  text: מִ/לְּ/בַד֙ עֹלַ֣ת הַ/בֹּ֔קֶר אֲשֶׁ֖ר לְ/עֹלַ֣ת הַ/תָּמִ֑יד תַּעֲשׂ֖וּ אֶת אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: fr
  text: En plus de l’holocauste quotidien du matin, vous offrirez ces sacrifices.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: En plus de
  rationale: La locution indique que les sacrifices prescrits pour la fête s’ajoutent à l’offrande habituelle; « En plus de » l’exprime clairement en français moderne.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: l’holocauste régulier du matin
  rationale: La proposition relative identifie l’holocauste du matin comme l’holocauste perpétuel, c’est-à-dire régulièrement offert; cette formulation évite de suggérer qu’un sacrifice serait offert pour un autre.
- source_word: תַּעֲשׂוּ
  choice: vous offrirez
  rationale: Dans le contexte des prescriptions sacrificielles, le verbe « offrir » rend naturellement le sens contextuel de « faire ».
- source_word: אֶת אֵלֶּה
  choice: ceux-ci
  rationale: Le démonstratif renvoie aux sacrifices masculins prescrits dans les versets précédents; « ceux-ci » conserve ce renvoi de manière concise.
