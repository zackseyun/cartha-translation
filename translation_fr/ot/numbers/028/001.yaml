  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; également rendu par « Yahvé » ou « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et ses principaux rendus possibles.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le piel narratif de דבר introduit ici une parole divine. « Parla » conserve la cadence narrative et se distingue de la formule qui introduit ensuite le contenu du discours.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition indique que la parole est adressée à Moïse ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cet infinitif introduit le contenu du discours qui suit. « En ces termes » rend naturellement cette fonction en français sans la tournure lourde « en disant » après « parla ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre et correspond à une translittération savante courante, sans remplacer celui-ci par un titre.
translation_notes:
  register: Français moderne, international et digne. La formule « en ces termes » introduit avec naturel le discours du verset suivant tout en conservant la structure de la formule hébraïque.
