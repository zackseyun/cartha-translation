reference: Numbers 28:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: fr
  text: et un bouc en sacrifice pour le péché[a], pour faire expiation pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sacrifice de purification ». Dans un contexte sacrificiel, le terme hébreu traduit par « sacrifice pour le péché » peut aussi désigner un sacrifice de purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: et un bouc
  rationale: שָׂעִיר désigne un bouc, c’est-à-dire un mâle de la chèvre; le ו préfixé est rendu par « et ». Le numéral qui suit est naturellement intégré à ce groupe en français.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans ce contexte sacrificiel, חַטָּאת désigne l’offrande apportée à cause du péché plutôt que le péché abstrait. « Sacrifice pour le péché » est clair et usuel; la valeur possible de purification est signalée en note.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral précise qu’un seul animal doit être offert; en français, l’article numéral « un » l’exprime naturellement.
- source_word: לְ/כַפֵּר
  choice: afin de faire l’expiation
  rationale: Dans le langage sacerdotal, כפר désigne l’action rituelle d’expier ou d’accomplir l’expiation. Cette formulation conserve la portée cultuelle et théologique sans préciser davantage son mécanisme.
- source_word: עֲלֵי/כֶם
  choice: pour vous
  rationale: Dans cette formule sacrificielle, עַל avec le suffixe de la deuxième personne du pluriel indique que l’acte est accompli en faveur du peuple. « Pour vous » est naturel et fidèle.
theological_decisions:
- issue: Traduction du vocabulaire sacrificiel de כפר
  choice: afin de faire l’expiation pour vous
  alternative: afin d’accomplir le rite d’expiation en votre faveur
  rationale: « Faire l’expiation » conserve la force théologique et cultuelle de la formule hébraïque sans imposer une théorie particulière de l’expiation. La tournure plus explicitement rituelle est possible, mais interprète davantage.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la syntaxe prescriptive du contexte cultuel, tout en employant une expression française naturelle.
