revisions:
- from: Vous offrirez ainsi, chaque jour pendant sept jours, une nourriture[a], une offrande présentée par le feu, d’une odeur agréable à Yahweh. Elle sera offerte en plus de l’holocauste perpétuel et de sa libation[b].
  to: Vous offrirez ainsi, chaque jour pendant sept jours, la nourriture d’une offrande par le feu, dont l’odeur est agréable à Yahweh[a] ; elle sera offerte en plus de l’holocauste perpétuel et de sa libation.
  rationale: La révision réunit les deux éléments de לֶחֶם אִשֵּׁה en une expression française cohérente, conserve la terminologie sacrificielle sans surinterpréter le rôle du feu, et retire une note alternative imprécise. Aucun changement de sens n’est apporté au reste du verset.
