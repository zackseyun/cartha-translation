  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: fr
  text: Vous offrirez ainsi, chaque jour pendant sept jours, la nourriture d’une offrande par le feu, dont l’odeur est agréable à Yahweh[a] ; elle sera offerte en plus de l’holocauste perpétuel et de sa libation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du pain » ou « de la nourriture d’une offrande par le feu » ; il s’agit ici de la nourriture sacrificielle, pas nécessairement de pain au sens strict.'
    reason: cultural_note
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: ainsi
  rationale: Le préfixe comparatif כ indique que les offrandes quotidiennes doivent correspondre à celles qui viennent d’être prescrites. « Ainsi » est naturel en français et conserve cette référence à la manière et aux quantités précédemment indiquées.
- source_word: תַּעֲשׂוּ
  choice: vous offrirez
  rationale: Le verbe עשה signifie littéralement « faire », mais, dans ce contexte sacrificiel, « offrir » exprime clairement l’action prescrite sans modifier sa portée.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: chaque jour pendant sept jours
  rationale: 'Cette formulation rend clairement la valeur distributive de l’expression hébraïque : l’action doit être répétée chacun des sept jours.'
- source_word: לֶחֶם אִשֵּׁה
  choice: une nourriture, une offrande présentée par le feu
  rationale: לֶחֶם désigne ici la nourriture sacrificielle plutôt que seulement du pain, et אִשֵּׁה une offrande liée au feu de l’autel. « Présentée par le feu » évite de suggérer que chaque élément devait nécessairement être entièrement consumé.
- source_word: רֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  rationale: Cette expression cultuelle traditionnelle décrit métaphoriquement l’acceptation favorable de l’offrande par Dieu. La traduction demeure concrète sans expliciter davantage la théologie implicite.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu par « Yahweh », ce qui conserve le nom propre présent dans le texte hébreu.
- source_word: עַל עוֹלַת הַתָּמִיד
  choice: en plus de l’holocauste perpétuel
  rationale: Dans cette prescription, עַל exprime l’ajout à l’offrande régulière. « Holocauste perpétuel » conserve le vocabulaire sacrificiel et l’idée d’une offrande continuellement prescrite.
- source_word: יֵעָשֶׂה
  choice: elle sera offerte
  rationale: Le passif de עשה reprend l’offrande mentionnée et se rend naturellement par le passif sacrificiel « sera offerte ».
- source_word: וְנִסְכּוֹ
  choice: et de sa libation
  rationale: נסך désigne une offrande liquide versée. Le suffixe masculin singulier renvoie à l’holocauste perpétuel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve ici le nom divin plutôt que de lui substituer un titre.
- issue: Sens de רֵיחַ נִיחֹחַ
  choice: odeur agréable
  alternative: parfum apaisant
  rationale: La formulation retenue conserve la métaphore sacrificielle et son idée d’agrément sans laisser entendre que l’offrande apaise une colère divine explicitement mentionnée dans ce verset.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire cultuel « holocauste » et « libation » est conservé pour sa précision, tandis que la syntaxe est allégée afin de rester accessible. Les termes concrets du texte hébreu, notamment la nourriture, le feu et l’odeur, demeurent visibles.
