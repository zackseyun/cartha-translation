revisions:
- from: 'Tu leur diras : « Voici l’offrande consumée par le feu[a] que vous présenterez à Yahweh : chaque jour, deux agneaux mâles d’un an, sans défaut, comme holocauste régulier. »'
  to: 'Tu leur diras : « Voici l’offrande par le feu[a] que vous présenterez à Yahweh : deux agneaux mâles d’un an, sans défaut, chaque jour, comme holocauste régulier. »'
  rationale: La révision remplace une formulation qui assimilait le terme générique אִשֶּׁה à la consommation complète de l’offrande par une expression française plus directe et moins interprétative. Tous les autres choix sont conservés, y compris le nom divin, la spécification des animaux, le rythme quotidien et le caractère régulier de l’holocauste.
