review_pass:
  verdict: revise
  source_fidelity: 'La structure et les éléments sacrificiels sont bien rendus : ordre adressé à Moïse, présentation à Yahweh, deux agneaux mâles d’un an sans défaut, rythme quotidien et holocauste régulier. Toutefois, « offrande consumée par le feu » interprète אִשֶּׁה de façon trop étroite : le terme technique désigne une offrande par/fait par le feu et ne signifie pas en lui-même que l’offrande est entièrement consumée. Cette consommation totale relève plus précisément de l’holocauste (עֹלָה).'
  naturalness: Le français est clair et de registre approprié. « Offrande par le feu » est à la fois plus proche du terme hébreu et suffisamment naturel dans un contexte cultuel. Le placement de « chaque jour » rend correctement la valeur distributive de לַיּוֹם.
  terminology: « Yahweh », « agneaux mâles d’un an », « sans défaut » et « holocauste régulier » sont cohérents et précis. La note doit éviter de présenter « mets offert » comme une équivalence directe et privilégiée d’אִשֶּׁה ; l’alternative formelle « offrande faite par le feu » préserve mieux l’ambiguïté lexicale attestée.
  issues:
  - severity: medium
    issue: « offrande consumée par le feu » restreint indûment le sens de אִשֶּׁה.
    rationale: אִשֶּׁה est un terme cultuel pour une offrande par le feu. Il ne désigne pas nécessairement, à lui seul, une offrande totalement consumée ; dans ce verset, cette précision est portée par עֹלָה, « holocauste ».
  - severity: low
    issue: La note propose « mets offert » sans exprimer clairement son caractère interprétatif.
    rationale: Le champ sémantique sacerdotal peut inclure l’idée d’une offrande alimentaire, mais « mets offert » ne constitue pas ici l’alternative lexicale la plus directe. Une note sur « offrande faite par le feu » correspond mieux à la formulation source et à l’audit anglais.
  revised_text: 'Tu leur diras : « Voici l’offrande par le feu[a] que vous présenterez à Yahweh : deux agneaux mâles d’un an, sans défaut, chaque jour, comme holocauste régulier. »'
  revised_footnotes:
