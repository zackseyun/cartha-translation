  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: fr
  text: 'Tu leur diras : « Voici l’offrande par le feu[a] que vous présenterez à Yahweh : deux agneaux mâles d’un an, sans défaut, chaque jour, comme holocauste régulier. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’offrande faite par le feu ».'
    reason: Alternative lexicale pour אִשֶּׁה, terme cultuel désignant une offrande par le feu.
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: l’offrande consumée par le feu
  rationale: Le terme sacerdotal désigne une offrande faite par le feu. Cette formulation française reste claire et évite de suggérer que l’offrande nourrirait littéralement Dieu; la note conserve une traduction plus formelle.
- source_word: תַּקְרִיבוּ
  choice: vous présenterez
  rationale: Le hiphil de קרב, en contexte sacrificiel, signifie présenter ou offrir; « présenter » garde l’idée rituelle d’amener l’offrande devant Dieu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: deux agneaux mâles d’un an
  rationale: Le substantif masculin et l’expression idiomatique « fils d’une année » indiquent des agneaux mâles âgés d’un an.
- source_word: תְמִימִם
  choice: sans défaut
  rationale: Dans la législation sacrificielle, le terme désigne des animaux exempts de défaut physique.
- source_word: לַיּוֹם
  choice: chaque jour
  rationale: 'Avec le nombre deux, l’expression a un sens distributif: deux pour chaque journée.'
- source_word: עֹלָה תָמִיד
  choice: holocauste régulier
  rationale: « Holocauste » est le terme cultuel français établi pour l’offrande entièrement brûlée; « régulier » exprime ici le rite quotidien récurrent sans laisser entendre une combustion ininterrompue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie le nom propre divin. Sa translittération préserve sa fonction de nom d’alliance, tandis que « le SEIGNEUR » reflète la tradition de lecture de substitution.
- issue: Sens de אִשֶּׁה
  choice: offrande consumée par le feu
  alternative: mets offert
  rationale: Le mot est lié au rituel du feu, mais peut aussi être compris dans le langage sacerdotal comme un « mets » destiné à Dieu. Le texte principal exprime le mode sacrificiel et la note préserve cette nuance cultuelle sans trancher excessivement.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre a été légèrement réorganisé autour de « chaque jour » pour une lecture naturelle, tout en conservant la portée distributive et le vocabulaire sacrificiel précis.
