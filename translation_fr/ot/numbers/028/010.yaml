source:
  edition: WLC
  text: עֹלַ֥ת שַׁבַּ֖ת בְּ/שַׁבַּתּ֑/וֹ עַל עֹלַ֥ת הַ/תָּמִ֖יד וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: fr
  text: L’holocauste du sabbat est offert chaque sabbat[a], en plus de l’holocauste régulier et de son offrande de vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en son sabbat ».'
    reason: La formulation hébraïque emploie un suffixe possessif, mais son sens est distributif dans ce contexte.
lexical_decisions:
- source_word: עֹלַת
  choice: holocauste
  rationale: Dans le vocabulaire sacrificiel biblique, עֹלָה désigne une offrande entièrement brûlée. « Holocauste » est l’équivalent français traditionnel et précis dans ce contexte.
- source_word: שַׁבַּת
  choice: sabbat
  rationale: Dans ce calendrier sacrificiel, le terme désigne clairement le jour du sabbat.
- source_word: בְּשַׁבַּתּוֹ
  choice: chaque sabbat
  rationale: 'La construction avec suffixe a ici une valeur distributive : le sacrifice doit être présenté à chaque occurrence du sabbat. La note conserve la forme plus littérale.'
- source_word: עַל
  choice: en plus de
  rationale: Dans ces prescriptions sacrificielles, עַל indique qu’une offrande s’ajoute à une autre plutôt qu’elle ne la remplace.
- source_word: הַתָּמִיד
  choice: régulier
  rationale: תָּמִיד exprime le caractère continuel ou régulièrement prescrit de l’holocauste quotidien. « Régulier » est naturel en français moderne sans suggérer une combustion matériellement ininterrompue.
- source_word: וְנִסְכָּהּ
  choice: et de son offrande de vin
  rationale: נֶסֶךְ désigne une offrande liquide versée. Dans ce contexte, il s’agit de vin (voir le verset 7), et le suffixe féminin renvoie à l’holocauste.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. Le verbe « sera offert » est explicité pour rendre naturelle en français la proposition nominale hébraïque, sans ajouter de contenu rituel.
