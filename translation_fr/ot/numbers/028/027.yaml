source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: fr
  text: 'Vous présenterez à Yahweh un holocauste en odeur agréable[a] : deux taureaux du gros bétail, un bélier et sept agneaux mâles âgés d’un an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en odeur apaisante ». La formule sacrificielle hébraïque לְרֵיחַ נִיחֹחַ est aussi rendue par « en parfum agréable » ou « en odeur apaisante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Vous présenterez
  rationale: Le hiphil de קרב, dans un contexte sacrificiel, signifie présenter ou offrir. « Présenterez » conserve l’idée rituelle sans alourdir la formulation.
- source_word: עוֹלָה
  choice: un holocauste
  rationale: « Holocauste » est le terme français établi pour le sacrifice entièrement brûlé ; il désigne clairement la catégorie cultuelle.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: comme un parfum agréable
  rationale: Cette formule sacrificielle exprime que l’offrande est agréée. « Parfum agréable » est naturel en français et conserve l’image olfactive de l’hébreu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par « Yahweh » afin de préserver le nom divin présent dans le texte hébreu.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: deux taureaux pris dans le gros bétail
  rationale: La formulation garde la classification bovine exprimée par בְּנֵי בָקָר sans ajouter une indication d’âge qui n’est pas explicite ici.
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: Équivalent direct et usuel du nom hébreu dans le vocabulaire sacrificiel.
- source_word: שִׁבְעָה כְבָשִׂים
  choice: sept agneaux mâles
  rationale: Le masculin est explicité pour rendre précisément כְבָשִׂים, qui désigne ici des agneaux mâles.
- source_word: בְּנֵי שָׁנָה
  choice: âgés d’un an
  rationale: Formulation française idiomatique de l’indication d’âge sacrificielle.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Portée de la formule לְרֵיחַ נִיחֹחַ
  choice: comme un parfum agréable à Yahweh
  alternative: pour produire un parfum apaisant pour Yahweh
  rationale: La traduction conserve l’image sacrificielle et l’idée d’acceptation sans expliquer davantage la manière dont ce langage anthropomorphique doit être compris.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel traditionnel « holocauste » est conservé, tandis que la syntaxe reste accessible. Le marqueur de note est placé après la formule qu’il explique.
