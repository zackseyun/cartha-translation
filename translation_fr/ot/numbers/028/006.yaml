  to: C’est l’holocauste régulier[a], accompli au mont Sinaï[d], pour être une agréable odeur[b], une offrande par le feu pour Yahweh[c].
  rationale: La révision ajoute l’ancre nécessaire pour l’ambiguïté de הָעֲשֻׂיָה et remplace « offert » par « accompli », qui reste proche de « fait » sans imposer que le verset parle exclusivement de la présentation matérielle du sacrifice. Elle rend aussi plus clairement la valeur de l’expression לְרֵיחַ נִיחֹחַ et adopte « offrande par le feu » pour אִשֶּׁה, formulation française établie qui préserve l’incertitude du terme.
