  text: עֹלַ֖ת תָּמִ֑יד הָ/עֲשֻׂיָה֙ בְּ/הַ֣ר סִינַ֔י לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: fr
  text: C’est l’holocauste régulier[a], accompli au mont Sinaï[d], pour être une agréable odeur[b], une offrande par le feu pour Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’holocauste continuel ». Dans ce contexte, l’expression désigne l’offrande présentée régulièrement, chaque jour.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour être un parfum apaisant » ou « pour être une odeur agréable ».
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement : « une offrande faite par le feu pour Yahweh ». Le sens exact du terme hébreu est discuté.'
    reason: lexical_alternative
  - marker: d
    text: Ou « fait au mont Sinaï » ou « offert au mont Sinaï ». Le participe hébreu peut aussi évoquer l’offrande telle qu’elle y fut établie.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלַת
  choice: holocauste
  rationale: Terme cultuel français établi pour l’offrande entièrement brûlée; il est plus précis et naturel que « offrande ascendante ».
- source_word: תָּמִיד
  choice: régulier
  rationale: Dans ce contexte sacrificiel, le mot désigne une offrande présentée à intervalles fixes, quotidiennement, plutôt qu’une action matériellement ininterrompue.
- source_word: הָעֲשֻׂיָה
  choice: offert
  rationale: Le participe passif signifie littéralement « fait ». Appliqué à un sacrifice, « offert » est naturel, tout en laissant la note signaler la formulation plus littérale et la possible référence à son institution au Sinaï.
- source_word: בְּהַר סִינַי
  choice: au mont Sinaï
  rationale: Rend naturellement le repère local hébreu sans décider dans le texte si l’offrande y fut matériellement présentée ou instituée.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: en parfum agréable
  rationale: Expression sacrificielle française claire qui conserve l’image olfactive et exprime l’agrément, sans développer une théorie de l’apaisement.
- source_word: אִשֶּׁה
  choice: un sacrifice consumé par le feu
  rationale: Le sens exact du terme cultuel est discuté, mais son rapport au feu est ici suffisamment transparent; cette formulation évite l’interprétation plus incertaine « offrande alimentaire ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Conserve le nom divin du texte hébreu et rend la destination du sacrifice indiquée par la préposition.
theological_decisions:
- issue: Sens de הָעֲשֻׂיָה au Sinaï
  choice: offert au mont Sinaï
  alternative: institué au mont Sinaï
  rationale: Le texte principal reste proche du participe « fait » en employant le verbe cultuel naturel « offrir ». La possibilité qu’il renvoie à l’institution de l’offrande au Sinaï est conservée en note plutôt qu’imposée.
- issue: Expression cultuelle רֵיחַ נִיחֹחַ
  choice: en parfum agréable
  alternative: en parfum apaisant
  rationale: Ce choix préserve l’image et l’idée d’agrément divin sans résoudre l’expression dans le sens théologique plus marqué d’un apaisement.
- issue: Valeur de אִשֶּׁה
  choice: un sacrifice consumé par le feu
  alternative: une offrande alimentaire
  rationale: La traduction traditionnelle liée au feu est retenue, puisque l’étymologie et le sens précis du terme demeurent débattus. Elle convient particulièrement à un holocauste.
- issue: Rendu du nom יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre de l’alliance est conservé conformément au texte source, plutôt que remplacé par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. « Holocauste » est conservé dans son sens cultuel biblique établi. La syntaxe brève suit celle de l’hébreu, et les notes maintiennent les ambiguïtés lexicales importantes.
