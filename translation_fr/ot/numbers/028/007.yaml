source:
  edition: WLC
  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: fr
  text: Son offrande de boisson sera d’un quart de hin pour chaque agneau[a]. Dans le lieu saint[b], tu verseras pour Yahweh une offrande de boisson enivrante[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour un seul agneau » ; littéralement « pour l’agneau, l’un ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le sanctuaire ».
    reason: lexical_alternative
  - marker: c
    text: La « boisson enivrante » est une boisson alcoolisée autre que le vin ; sa nature exacte n’est pas précisée.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: Son offrande liquide sera
  rationale: Le nom désigne l’offrande liquide qui accompagne le sacrifice. « Offrande liquide » est clair en français courant et le suffixe possessif renvoie à l’agneau offert dans le contexte.
- source_word: רְבִיעִת הַהִין
  choice: d’un quart de hin
  rationale: La formulation conserve exactement la proportion et l’unité de mesure ancienne sans conversion conjecturale.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: pour chaque agneau
  rationale: 'Littéralement « pour l’agneau, l’unique » ou « pour le seul agneau » ; dans cette prescription portant sur deux agneaux, la tournure a une valeur distributive naturelle : cette quantité vaut pour chacun.'
- source_word: בַּקֹּדֶשׁ
  choice: Dans le lieu saint
  rationale: Dans ce contexte cultuel, le terme désigne vraisemblablement l’espace sacré. « Lieu saint » reste plus transparent que « sanctuaire », tout en laissant cette possibilité en note.
- source_word: הַסֵּךְ
  choice: tu verseras
  rationale: La forme verbale ordonne de répandre le liquide en offrande. Le futur prescriptif rend naturellement l’instruction en français.
- source_word: נֶסֶךְ
  choice: une offrande liquide
  rationale: La répétition du nom dans l’hébreu est conservée, plutôt que sous-entendue, afin de maintenir l’insistance du texte.
- source_word: שֵׁכָר
  choice: de boisson enivrante
  rationale: Le mot désigne une boisson intoxicante distincte du vin sans en préciser la nature. « Boisson enivrante » évite l’anachronisme de « liqueur forte », qui pourrait évoquer un alcool distillé.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition indique le destinataire de l’offrande, et le nom divin est rendu directement par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente directement le nom propre et évite de le remplacer par un titre.
- issue: Sens cultuel de בַּקֹּדֶשׁ
  choice: dans le lieu saint
  alternative: dans le sanctuaire / dans la sainteté
  rationale: Le contexte sacrificiel favorise une référence spatiale, mais « sanctuaire » demeure une traduction possible et est signalé en note plutôt que traité comme certain.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire cultuel reste accessible sans employer « libation », plus littéraire. L’unité ancienne « hin » est conservée, et « boisson enivrante » préserve l’imprécision du terme source sans suggérer à tort une boisson distillée.
