    reason: lexical_alternative
  - marker: b
    text: Ou « dans le sanctuaire ».
    reason: lexical_alternative
  - marker: c
    text: La « boisson enivrante » est une boisson alcoolisée autre que le vin ; sa nature exacte n’est pas précisée.
    reason: cultural_note
