revisions:
- from: Son offrande liquide sera d’un quart de hin pour chaque agneau[a]. Dans le lieu saint[b], tu verseras pour Yahweh une offrande liquide de boisson enivrante[c].
  to: Son offrande de boisson sera d’un quart de hin pour chaque agneau[a]. Dans le lieu saint[b], tu verseras pour Yahweh une offrande de boisson enivrante[c].
  rationale: La révision conserve la structure et les ambiguïtés du texte hébreu, mais rend le vocabulaire sacrificiel plus naturel en français. Elle rectifie aussi la note sur « l’un » afin de ne pas ajouter l’idée d’unicité exclusive.
