  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: fr
  text: Le jour des prémices, lorsque vous présenterez à Yahweh une offrande nouvelle de céréales, à l’occasion de votre fête des Semaines, vous aurez une assemblée sainte. Vous ne ferez aucun travail ordinaire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun travail pénible » ou « aucun travail professionnel ». L’expression hébraïque désigne le travail habituel lié aux occupations quotidiennes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: Le jour des premiers fruits
  rationale: La formule temporelle introduit le jour de fête lié aux premières récoltes; «premiers fruits» est naturel et conserve le sens cultuel.
- source_word: בְּהַקְרִיבְכֶם
  choice: lorsque vous présenterez
  rationale: L’infinitif avec בְּ exprime ici la simultanéité; dans un contexte sacrificiel, קרב désigne l’action de présenter une offrande.
- source_word: מִנְחָה חֲדָשָׁה
  choice: une offrande nouvelle de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne une offrande végétale; «nouvelle» renvoie aux produits de la nouvelle récolte.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération rend explicitement le nom divin יהוה employé dans le texte hébreu.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: lors de votre fête des Semaines
  rationale: Le pluriel désigne ici la fête calendérique des Semaines, plutôt qu’une simple succession de semaines.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une assemblée sainte
  rationale: L’expression technique désigne un rassemblement sacré officiellement convoqué; cette formulation est claire en français moderne.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail ordinaire
  rationale: L’expression vise le travail habituel associé aux occupations quotidiennes, et non toute activité sans distinction.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; «Yahweh» conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de l’interdiction de travail
  choice: travail ordinaire
  alternative: travail pénible / travail professionnel
  rationale: La formule sacerdotale interdit le travail quotidien propre aux occupations régulières; elle ne doit pas être élargie silencieusement à toute forme d’activité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique demeure nette sans archaïsmes. «Assemblée sainte» traduit naturellement le terme cultuel, tandis que «fête des Semaines» explicite la référence calendaire.
