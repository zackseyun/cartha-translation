  terminology: « Prémices », « offrande de céréales », « Yahweh », « fête des Semaines » et « assemblée sainte » conservent convenablement les termes cultuels hébreux. La note est correctement ancrée après « travail ordinaire » et présente des équivalents sans surinterpréter l'interdit.
