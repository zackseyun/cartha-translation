source:
  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: fr
  text: Et, pour chaque taureau, trois dixièmes d’épha de farine fine, en offrande de céréales[a], mélangée à l’huile[b], et, pour chaque bélier, deux dixièmes d’épha de farine fine, en offrande de céréales, mélangée à l’huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « trois dixièmes » et, plus loin, « deux dixièmes »; il s’agit de dixièmes d’épha.
    reason: cultural_note
  - marker: b
    text: 'Ou : « mêlée à l’huile ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ainsi que trois dixièmes d’épha
  rationale: עֶשְׂרוֹן désigne une mesure d’un dixième, comprise ici comme un dixième d’épha. L’unité est explicitée pour rendre la prescription immédiatement intelligible.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Cette expression française courante désigne une farine très fine et convient au terme cultuel employé pour les offrandes.
- source_word: מִנְחָה
  choice: offrande végétale
  rationale: Dans ce contexte sacrificiel, le mot désigne l’offrande préparée à partir de produits végétaux, ici de la farine, plutôt qu’un don générique.
- source_word: בְּלוּלָה בַ/שֶּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe décrit une farine incorporée à de l’huile. « Pétrie à l’huile » est naturel dans le contexte d’une préparation de farine, tout en gardant l’idée de mélange.
- source_word: לַ/פָּר הָ/אֶחָד
  choice: pour chaque taureau
  rationale: Littéralement « pour le taureau, l’un ». Dans cette prescription portant sur plusieurs taureaux, la tournure a une valeur distributive; « chaque » l’exprime naturellement sans lui donner le sens ordinal de « premier ».
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: et deux dixièmes d’épha
  rationale: Comme dans le premier membre, l’épha est l’unité sous-entendue par la mesure en dixièmes et est précisée pour la clarté.
- source_word: לָ/אַיִל הָ/אֶחָד
  choice: pour chaque bélier
  rationale: La construction parallèle signifie littéralement « pour le bélier, l’un » et individualise ici chacun des béliers prescrits; elle ne justifie pas « le premier bélier ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe distributive « pour chaque » clarifie la portée de l’hébreu dans la série sacrificielle. « Épha » conserve l’unité ancienne, expliquée par la note, tandis que « fleur de farine » et « offrande végétale » emploient un vocabulaire biblique accessible.
