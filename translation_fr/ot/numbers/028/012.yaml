  to: Et, pour chaque taureau, trois dixièmes d’épha de farine fine, en offrande de céréales[a], mélangée à l’huile[b], et, pour chaque bélier, deux dixièmes d’épha de farine fine, en offrande de céréales, mélangée à l’huile.
