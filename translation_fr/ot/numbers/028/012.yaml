  naturalness: 'Le texte révisé emploie un français international plus direct : « Et » reflète mieux la conjonction initiale que « ainsi que », « farine fine » est plus transparent que « fleur de farine », et « mélangée à l’huile » est naturel sans suggérer plus précisément une opération de pétrissage.'
  terminology: « Épha » conserve l’unité antique; la note explique que les dixièmes sont des dixièmes d’épha. « Offrande de céréales » convient au sens cultuel contextuel de מִנְחָה. Aucun enjeu théologique ou de nom propre ne requiert de traitement particulier.
