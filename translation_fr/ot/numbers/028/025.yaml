  variant: modern international French
source:
  edition: WLC
  text: וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/025.yaml
  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: fr
  text: Le septième jour, vous aurez une assemblée sainte[a] ; vous ne ferez aucun travail ordinaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une convocation sainte » ou « une assemblée sacrée ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « aucun travail de labeur/service » ; il s’agit du travail habituel, notamment professionnel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: Le septième jour
  rationale: Cette formulation française rend naturellement la valeur temporelle de la préposition et l’adjectif ordinal. La conjonction initiale n’a pas besoin d’être exprimée séparément dans ce contexte.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une assemblée sainte
  rationale: L’expression cultuelle désigne un rassemblement sacré officiellement convoqué. « Assemblée sainte » est naturel en français moderne, tout en conservant l’idée centrale d’un rassemblement consacré.
- source_word: יִהְיֶה לָ/כֶם
  choice: vous aurez
  rationale: Littéralement « sera pour vous » ; « vous aurez » restitue de façon idiomatique la prescription sans en modifier la portée.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: vous ne ferez aucun travail ordinaire
  rationale: Avec la négation, כָּל se rend naturellement par « aucun ». L’expression מְלֶאכֶת עֲבֹדָה vise le travail habituel ou professionnel interdit pendant la fête, plutôt que toute activité sans exception.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive convient au contexte légal. « Assemblée sainte » évite le caractère moins courant de « sainte convocation », tandis que la note conserve la nuance d’une assemblée officiellement convoquée.
