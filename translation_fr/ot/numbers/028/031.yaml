  text: מִ/לְּ/בַ֞ד עֹלַ֧ת הַ/תָּמִ֛יד וּ/מִנְחָת֖/וֹ תַּעֲשׂ֑וּ תְּמִימִ֥ם יִהְיוּ לָ/כֶ֖ם וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: fr
  text: Vous les offrirez en plus de l’holocauste régulier[a] et de l’offrande de céréales qui l’accompagne. Ils seront pour vous sans défaut[b], avec les libations qui les accompagnent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’holocauste perpétuel » ou « l’holocauste quotidien ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Ils seront pour vous sans défaut »; il s’agit des animaux présentés en sacrifice.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire les offrandes de vin versées.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: en plus de
  rationale: Cette expression indique que les sacrifices prescrits s’ajoutent à l’offrande habituelle; « en plus de » est clair et naturel en français moderne.
- source_word: עֹלַת הַתָּמִיד
  choice: l’holocauste régulier
  rationale: תָּמִיד désigne ici l’holocauste prescrit de manière constante, offert quotidiennement. « Régulier » exprime cette fonction cultuelle sans imposer une seule nuance possible.
- source_word: וּמִנְחָתוֹ
  choice: et de l’offrande de céréales qui l’accompagne
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne l’offrande végétale associée à l’holocauste. La relative explicite naturellement en français le suffixe possessif hébreu.
- source_word: תַּעֲשׂוּ
  choice: Vous les offrirez
  rationale: Dans les prescriptions sacrificielles, עשה peut signifier préparer, accomplir ou offrir. « Offrirez » rend clairement l’action cultuelle et le pronom reprend les sacrifices prescrits dans le contexte.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Appliqué aux animaux sacrificiels, תָּמִים exige l’absence de tare ou de défaut physique; « sans défaut » est précis et idiomatique.
- source_word: יִהְיוּ לָכֶם
  choice: Ils seront pour vous
  rationale: Cette formulation conserve le datif לָכֶם, même si sa fonction exacte reste légèrement ouverte, et rattache l’exigence aux animaux que les Israélites doivent présenter.
- source_word: וְנִסְכֵּיהֶם
  choice: avec les libations qui les accompagnent
  rationale: נֶסֶךְ désigne une offrande liquide versée, ici associée aux sacrifices. « Libations » est le terme cultuel français précis, tandis que la relative restitue le rapport exprimé par le suffixe.
theological_decisions:
- issue: Référent du pluriel dans תְּמִימִם יִהְיוּ
  choice: Le pluriel « Ils » renvoie aux animaux sacrificiels prescrits dans le contexte.
  alternative: Faire porter grammaticalement « sans défaut » sur l’ensemble des offrandes, y compris les libations.
  rationale: Dans la législation sacrificielle, l’exigence d’être תְּמִימִם s’applique normalement aux animaux. La traduction évite donc de laisser entendre que les libations elles-mêmes pourraient être « sans défaut », tout en conservant la structure plurielle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire sacrificiel traditionnel (« holocauste », « libations ») est conservé pour sa précision, avec des notes explicatives. La division en deux phrases clarifie le référent des animaux sans effacer le datif hébreu « pour vous ».
