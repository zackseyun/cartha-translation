  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Tu offriras le second agneau entre les deux soirs[a]. Tu le prépareras selon l’offrande de céréales du matin et son offrande de boisson, comme un sacrifice consumé par le feu[b], dont l’odeur est agréable pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les deux soirs », expression hébraïque traditionnelle souvent comprise comme « au crépuscule ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une offrande faite par le feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: le second agneau
  rationale: Dans le contexte sacrificiel, כֶּבֶשׂ désigne couramment un agneau; « second » maintient le lien avec l’offrande quotidienne du matin.
- source_word: תַּעֲשֶׂה
  choice: tu offriras
  rationale: Le sens littéral est « faire », mais le français sacrificiel exige naturellement « offrir ».
- source_word: בֵּין הָעַרְבָּיִם
  choice: entre les deux soirs
  rationale: Cette formulation conserve l’expression hébraïque et son imprécision temporelle traditionnelle; l’interprétation « au crépuscule » est indiquée en note.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: avec une offrande de céréales semblable à celle du matin
  rationale: מִנְחָה désigne ici l’offrande végétale accompagnant le sacrifice; « offrande de céréales » est clair en français moderne.
- source_word: וּכְנִסְכּוֹ
  choice: et une offrande de vin semblable à celle du matin
  rationale: נֶסֶךְ désigne une offrande liquide versée; le contexte du verset précédent précise qu’il s’agit de vin, ce qui rend l’expression immédiatement compréhensible.
- source_word: אִשֵּׁה
  choice: un sacrifice consumé par le feu
  rationale: Le terme désigne une offrande faite par le feu. Cette traduction conserve explicitement cet élément lexical sans employer le calque peu naturel « mets ».
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable
  rationale: La formule exprime que l’offrande est agréée par Dieu tout en conservant l’image olfactive du texte.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu directement par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée temporelle de בֵּין הָעַרְבָּיִם
  choice: entre les deux soirs
  alternative: au crépuscule
  rationale: La portée chronologique précise de l’expression est discutée. Le texte principal conserve donc l’ambiguïté hébraïque et la note fournit l’équivalent interprétatif courant.
- issue: Sens de אִשֵּׁה
  choice: un sacrifice consumé par le feu
  alternative: une offrande faite par le feu; un mets offert
  rationale: Cette traduction garde le lien explicite avec le feu et évite de trancher en faveur de l’interprétation métaphorique « nourriture offerte à Dieu ».
translation_notes:
  register: Français international moderne, accessible et digne. Le tutoiement singulier reflète l’adresse grammaticale du texte. La seconde phrase est légèrement restructurée pour rendre clairement en français le parallélisme avec les offrandes du matin, sans éliminer les ambiguïtés lexicales signalées en notes.
