revisions:
- from: Tu offriras le second agneau entre les deux soirs[a]. Tu l’offriras avec une offrande de céréales et une offrande de vin semblables à celles du matin, comme un sacrifice consumé par le feu[b], dont l’odeur est agréable à Yahweh.
  to: Tu offriras le second agneau entre les deux soirs[a]. Tu le prépareras selon l’offrande de céréales du matin et son offrande de boisson, comme un sacrifice consumé par le feu[b], dont l’odeur est agréable pour Yahweh.
  rationale: La révision rétablit la comparaison exprimée par les deux occurrences de כְּ et évite d’ajouter « vin » au texte principal. Elle conserve l’ambiguïté chronologique, le registre sacrificiel et les deux ancres de notes existantes.
  reviewer_model: gpt-5.6-terra
