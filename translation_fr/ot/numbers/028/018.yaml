  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/018.yaml
  text: On the first day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: fr
  text: Le premier jour, il y aura une sainte convocation[a] ; vous ne ferez aucun travail ordinaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une assemblée sacrée ». L’expression désigne un rassemblement sacré officiellement convoqué.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « aucun travail de service » ; il s’agit du travail habituel, notamment professionnel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Le premier jour
  rationale: Rend directement la locution temporelle définie avec l’ordinal, sans ajouter « de la fête », qui relève du contexte mais n’est pas exprimé dans ce verset.
- source_word: מִקְרָא קֹדֶשׁ
  choice: vous tiendrez une assemblée sainte
  rationale: L’expression cultuelle désigne un rassemblement sacré officiellement convoqué. Cette formulation française naturelle conserve à la fois l’idée de rassemblement et son caractère saint.
- source_word: כָּל ... לֹא
  choice: aucun
  rationale: Dans cette construction négative, « aucun » exprime naturellement en français la portée totale de l’interdiction.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: travail ordinaire
  rationale: La combinaison désigne le travail habituel lié au service ou à l’activité professionnelle, interdit lors de la fête, plutôt que toute forme d’action ou seulement un travail physiquement pénible.
- source_word: לֹא תַעֲשׂוּ
  choice: vous ne ferez
  rationale: Le futur français convient au registre prescriptif solennel et maintient l’adresse communautaire à la deuxième personne du pluriel.
theological_decisions:
- issue: Étendue de l’interdiction de travailler
  choice: aucun travail ordinaire
  alternative: aucun travail pénible
  rationale: L’hébreu מְלֶאכֶת עֲבֹדָה vise plus probablement le travail habituel ou professionnel que le seul travail éprouvant. La formulation évite aussi de transformer le commandement en interdiction absolue de toute activité.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif maintient le ton juridique du passage. « Assemblée sainte » est plus immédiatement intelligible que « sainte convocation », tandis que la note conserve la nuance de convocation officielle.
