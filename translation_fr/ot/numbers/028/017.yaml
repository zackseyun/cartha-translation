source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר י֛וֹם לַ/חֹ֥דֶשׁ הַ/זֶּ֖ה חָ֑ג שִׁבְעַ֣ת יָמִ֔ים מַצּ֖וֹת יֵאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: fr
  text: Le quinzième jour de ce mois, il y aura une fête[a] ; pendant sept jours, on mangera du pain sans levain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une célébration ». Le mot hébreu peut désigner une fête religieuse, notamment une fête de pèlerinage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Le quinzième jour
  rationale: La conjonction וּ relie cette prescription au contexte précédent, mais n’a pas besoin d’être rendue explicitement en français. La tournure ordinale est l’expression française naturelle du syntagme hébreu littéralement « au jour quinze ».
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: de ce mois
  rationale: Dans ce contexte calendaire, חֹדֶשׁ désigne le mois.
- source_word: חָג
  choice: il y aura une fête
  rationale: חָג désigne une fête religieuse, souvent associée à un pèlerinage. La phrase nominale hébraïque reçoit naturellement une formulation existentielle au futur dans cette prescription calendaire.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Cette expression indique ici la durée de l’observance et de la consommation du pain sans levain.
- source_word: מַצּוֹת
  choice: du pain sans levain
  rationale: Dans ce calendrier cultuel, מַצּוֹת désigne le pain non fermenté. Le singulier collectif français est clair et idiomatique.
- source_word: יֵאָכֵל
  choice: on mangera
  rationale: Le niphal imparfait est passif, littéralement « sera mangé ». Le passif indéfini se rend naturellement en français par « on mangera », tout en conservant la valeur prescriptive du futur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans conserver un passif peu naturel en français ; le point-virgule reflète les deux propositions étroitement liées.
