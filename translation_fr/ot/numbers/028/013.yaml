  revision_rationale: La révision conserve tous les choix lexicaux substantiels du projet, mais remplace la phrase autonome par une apposition conforme à la syntaxe de la source. Elle corrige également la note afin qu’elle soit une alternative lexicale nette, correctement ancrée et non redondante.
