language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: fr
  text: 'et, pour chaque agneau, un dixième d’épha de fleur de farine en offrande végétale, pétrie à l’huile : un holocauste, un parfum agréable, une offrande consumée par le feu[a] pour Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande alimentaire ».
    reason: Le terme hébreu אִשֶּׁה désigne une offrande sacrificielle liée au feu ; « offrande alimentaire » reflète une autre analyse lexicale possible, sans imposer cette interprétation au texte.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: et… un dixième d’épha
  rationale: La répétition a une valeur distributive dans cette prescription. L’unité implicite est l’épha; l’expliciter rend la mesure compréhensible en français.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française consacrée et naturelle pour la farine raffinée employée dans les offrandes.
- source_word: מִנְחָה
  choice: offrande végétale
  rationale: Dans ce contexte cultuel, le terme désigne l’offrande non animale faite ici de farine, plutôt qu’un don indéterminé.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie à l’huile
  rationale: Rend naturellement en français la farine incorporée à de l’huile; « mélangée à de l’huile » serait également possible.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: pour chaque agneau
  rationale: Le contexte et la construction distributive indiquent la quantité prescrite pour chacun des agneaux, non pour un seul agneau au total.
- source_word: עֹלָה
  choice: holocauste
  rationale: Terme sacrificiel français précis pour une offrande entièrement brûlée.
- source_word: רֵיחַ נִיחֹחַ
  choice: un parfum agréable
  rationale: Rend l’expression cultuelle d’agrément et d’acceptabilité sans la surinterpréter.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Le terme appartient au vocabulaire sacrificiel et est étroitement associé au feu; cette traduction conserve cette donnée sans adopter l’interprétation plus discutée de « nourriture offerte ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition marque le destinataire de l’offrande, et le nom divin est rendu par sa translittération plutôt que remplacé par un titre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve ici le nom propre de l’alliance.
- issue: Sens du terme cultuel אִשֶּׁה
  choice: offrande consumée par le feu
  alternative: mets offert
  rationale: Le rapport du terme au feu est clair dans l’usage sacrificiel, tandis que son rendu par « mets » ou « nourriture » suppose une interprétation sémantique plus précise. L’alternative est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre « pour chaque agneau » est avancé pour éviter une phrase artificielle, tout en conservant la valeur distributive de l’hébreu. La phrase reste liée au contexte précédent par « et ».
