source:
  edition: WLC
  text: וּ/מִ֨נְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֗ר וּ/שְׁנֵ֧י עֶשְׂרֹנִ֛ים לָ/אַ֖יִל תַּעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: fr
  text: 'Vous préparerez aussi leur offrande de céréales : trois dixièmes[a] de farine fine mélangée à de l’huile pour le taureau, et deux dixièmes pour le bélier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « trois dixièmes » et « deux dixièmes » désignent respectivement trois et deux dixièmes d’épha, une mesure de capacité pour les matières sèches employée dans les prescriptions sacrificielles.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: aussi leur offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne une offrande faite de produits céréaliers. Le suffixe pluriel renvoie collectivement aux animaux mentionnés dans la prescription.
- source_word: סֹלֶת
  choice: de la farine fine
  rationale: סֹלֶת est le terme usuel pour la farine finement moulue employée dans les offrandes.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: mélangée à de l’huile
  rationale: Le participe passif indique que la farine est préparée par mélange avec de l’huile; cette formulation est naturelle et précise en français moderne.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: trois dixièmes
  rationale: עִשָּׂרוֹן désigne ici un dixième d’épha. La formulation abrégée conserve la concision de l’hébreu, tandis que la note explicite l’unité sous-entendue.
- source_word: לַפָּר
  choice: pour le taureau
  rationale: Le singulier défini renvoie au taureau indiqué dans la prescription sacrificielle immédiate.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: et deux dixièmes
  rationale: La traduction parallèle et concise reprend la même unité sous-entendue que dans le premier membre.
- source_word: לָאַיִל
  choice: pour le bélier
  rationale: Le singulier défini renvoie au bélier de la série d’offrandes prescrite.
- source_word: תַּעֲשׂוּ
  choice: Vous préparerez
  rationale: Dans ces instructions sacrificielles, עשה exprime l’exécution de la préparation requise. « Préparerez » est idiomatique sans préciser excessivement l’acte comme le ferait « offrirez ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase place le verbe en tête pour intégrer naturellement le תַּעֲשׂוּ final à l’ensemble de la prescription. « Offrande de céréales » évite l’ambiguïté possible de « offrande végétale » et reste accessible.
