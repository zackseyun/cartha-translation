base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: fr
  text: 'D’où pourrais-je obtenir de la viande pour en donner à tout ce peuple ? Car ils pleurent devant moi[a] en disant : « Donne-nous de la viande à manger ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ils pleurent auprès de moi » ou « ils font peser leurs pleurs sur moi ». Littéralement, l’hébreu dit : « ils pleurent sur moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: D’où pourrais-je tirer
  rationale: L’interrogatif מֵאַיִן porte sur la provenance, tandis que לִי implique ici l’impossibilité personnelle de Moïse. Cette tournure française naturelle conserve la question exaspérée sans introduire l’idée précise d’acheter ou de trouver.
- source_word: בָּשָׂר
  choice: de la viande
  rationale: Dans ce contexte alimentaire, בָּשָׂר désigne la viande plutôt que la chair au sens général.
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: pour en donner à tout ce peuple
  rationale: « Pour en donner » exprime naturellement la visée de l’infinitif לָתֵת; « tout ce peuple » maintient le singulier collectif de עָם.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de la plainte de Moïse.
- source_word: יִבְכּוּ עָלַי
  choice: ils pleurent devant moi
  rationale: La préposition עַל indique que les pleurs sont dirigés vers Moïse ou pèsent sur lui. « Devant moi » restitue la scène sans transformer implicitement les pleurs en hostilité; l’ambiguïté est signalée en note.
- source_word: תְּנָה לָּנוּ בָשָׂר וְנֹאכֵלָה
  choice: Donne-nous de la viande à manger !
  rationale: Cette formulation française rend la demande et la finalité exprimée par le cohortatif וְנֹאכֵלָה de façon concise et idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La question conserve l’exaspération de Moïse. La formulation de la demande populaire est directe et naturelle, tandis que la note préserve l’ambiguïté de l’expression hébraïque avec עַל.
