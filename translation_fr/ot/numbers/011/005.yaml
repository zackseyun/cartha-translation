id: NUM.11.5
reference: Numbers 11:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: fr
  text: Nous nous souvenons du poisson que nous mangions en Égypte gratuitement[a], ainsi que des concombres, des melons, des poireaux, des oignons et de l’ail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans rien payer ». Les Israélites évoquent ici l’Égypte du point de vue de leur plainte, malgré l’esclavage qu’ils y avaient subi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: Nous nous souvenons
  rationale: Le qatal à la première personne du pluriel exprime ici, dans le discours direct, un souvenir actuellement évoqué. Le présent est naturel en français.
- source_word: הַדָּגָה
  choice: du poisson
  rationale: Le nom désigne collectivement le poisson comme nourriture. Le singulier massif est idiomatique en français.
- source_word: אֲשֶׁר נֹאכַל
  choice: que nous mangions
  rationale: Le yiqtol a ici une valeur habituelle dans le passé; l’imparfait français rend clairement cette habitude.
- source_word: בְּמִצְרַיִם
  choice: en Égypte
  rationale: Traduction locative directe et idiomatique.
- source_word: חִנָּם
  choice: gratuitement
  rationale: L’adverbe signifie « sans paiement, sans frais ». « Gratuitement » conserve le point de vue de ceux qui se plaignent sans effacer l’ironie liée à leur esclavage.
- source_word: הַקִּשֻּׁאִים
  choice: les concombres
  rationale: Identification lexicale usuelle de ce produit.
- source_word: הָאֲבַטִּחִים
  choice: les melons
  rationale: Le terme désigne une sorte de melon; ce choix évite de préciser l’espèce au-delà de ce qu’assure le texte.
- source_word: הֶחָצִיר
  choice: les poireaux
  rationale: Dans cette liste d’aliments, le mot est traditionnellement et plausiblement compris comme un légume potager, plutôt que comme de l’herbe.
- source_word: הַבְּצָלִים
  choice: les oignons
  rationale: Équivalent lexical courant et précis.
- source_word: הַשּׁוּמִים
  choice: l’ail
  rationale: Équivalent lexical courant; le singulier massif est naturel en français.
theological_decisions:
- issue: Sens de חִנָּם dans le contexte de l’esclavage en Égypte
  choice: gratuitement
  alternative: sans rien payer; librement
  rationale: Le verset rapporte la plainte du peuple selon son propre point de vue et non une appréciation objective de sa condition en Égypte. Une traduction directe préserve à la fois sa rhétorique et l’ironie contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « mangions » explicite la valeur habituelle du verbe hébreu. « Ainsi que » relie naturellement le poisson à l’énumération sans ajouter de contenu interprétatif.
