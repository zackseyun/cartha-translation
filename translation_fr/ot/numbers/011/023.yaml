source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « La main de Yahweh est-elle devenue courte[a] ? Maintenant, tu verras si ma parole s’accomplira pour toi[b] ou non. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La main de Yahweh est-elle devenue courte ? » Cette image évoque la question : « La puissance de Yahweh est-elle devenue limitée ? »'
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « si ce que j’ai dit t’arrivera » ou « se réalisera pour toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: La main de Yahweh serait-elle devenue trop courte ?
  rationale: Cette formulation conserve l’image anthropomorphique hébraïque tout en donnant en français une question rhétorique naturelle exprimant une éventuelle limitation de sa puissance.
- source_word: עַתָּה תִרְאֶה
  choice: Maintenant, tu verras
  rationale: Rend directement l’adverbe temporel et la valeur future du verbe, qui annoncent une vérification imminente.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: si ma parole s’accomplira pour toi
  rationale: « S’accomplir » exprime naturellement la réalisation de la parole annoncée; « pour toi » préserve le suffixe de deuxième personne sans trancher entièrement sa nuance.
- source_word: אִם לֹא
  choice: ou non
  rationale: Complète en français moderne la construction interrogative introduite par « si ».
theological_decisions:
- issue: Langage anthropomorphique relatif à la puissance divine
  choice: Conserver l’image de la main devenue trop courte
  alternative: La puissance de Yahweh serait-elle devenue limitée ?
  rationale: L’image concrète porte la force rhétorique du texte et ne doit pas être remplacée silencieusement par son interprétation.
- issue: Nuance du suffixe dans הֲיִקְרְךָ
  choice: s’accomplira pour toi
  alternative: t’arrivera / se réalisera comme je te l’ai dit
  rationale: Le texte peut évoquer ce qui adviendra à Moïse ou l’accomplissement à son égard de la parole divine; la traduction retient une formulation proche et signale l’autre possibilité en note.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse personnelle de Yahweh à Moïse. L’idiome hébraïque de la « main » est maintenu dans le texte et expliqué en note.
