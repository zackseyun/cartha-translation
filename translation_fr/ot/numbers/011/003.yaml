source:
  edition: WLC
  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: fr
  text: Il appela ce lieu Tabéera[a], car le feu de Yahweh brûla parmi eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tabéera évoque en hébreu l’idée de « brûlure » ou d’« embrasement »; le nom fait jeu de mots avec le verbe « brûla » dans la suite du verset.
    reason: Le nom תבערה est lié étymologiquement au verbe בער, « brûler ».
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: Il donna à ce lieu le nom de
  rationale: Cette formulation française naturelle rend explicitement la formule hébraïque de dénomination sans la calquer maladroitement.
- source_word: תַּבְעֵרָה
  choice: Tabéra
  rationale: Le nom de lieu est translittéré selon une forme adaptée au français; son lien sonore avec l’idée de brûler est signalé en note.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction exprime ici clairement la cause donnée pour ce nom.
- source_word: בָעֲרָה
  choice: avait brûlé
  rationale: Le plus-que-parfait situe naturellement en français l’incendie à l’origine de la dénomination, tout en conservant le sens direct du verbe בער.
- source_word: בָם
  choice: parmi eux
  rationale: Dans ce contexte, l’expression désigne le feu qui a sévi au milieu du peuple, plutôt qu’un embrasement intérieur des personnes.
- source_word: אֵשׁ יְהוָה
  choice: le feu de Yahweh
  rationale: Cette traduction conserve la construction hébraïque et le nom divin explicite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le tétragramme; « Yahweh » préserve ici le nom propre divin sans le remplacer par un titre.
- issue: Rapport du feu à Yahweh
  choice: le feu de Yahweh
  alternative: un feu envoyé par Yahweh
  rationale: Le génitif hébreu est conservé sans préciser davantage s’il indique l’origine, l’appartenance ou l’action divine.
translation_notes:
  register: Français international moderne, narratif et digne. La formule hébraïque littérale « appeler le nom du lieu » est rendue idiomatiquement par « donner à ce lieu le nom de ». Le jeu de mots hébreu, impossible à reproduire pleinement dans le corps du texte, est conservé par une note.
