    issue: Forme du toponyme
    rationale: « Tabéra » simplifie excessivement תבערה et s’écarte de la forme française usuelle « Tabéera »; cette dernière rend mieux les voyelles et conserve plus clairement le rapport avec le jeu de mots hébreu.
  - severity: low
    issue: Note étymologique trop large
    rationale: « Brasier » n’est pas le sens lexical direct requis par le jeu de mots avec בער, « brûler ». Une formulation centrée sur « brûlure » ou « embrasement » est plus exacte.
  - severity: low
    issue: Temps verbal ajouté
    rationale: « Avait brûlé » est recevable contextuellement, mais le texte hébreu emploie une forme narrative simple. « Brûla » préserve mieux cette présentation sans expliciter l’antériorité.
