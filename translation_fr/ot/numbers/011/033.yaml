source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: fr
  text: La viande était encore entre leurs dents[a], avant même d’être consommée, et la colère de Yahweh s’enflamma contre le peuple ; Yahweh frappa le peuple d’un très grand fléau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « avant qu’elle soit retranchée » ou « coupée » ; dans ce contexte, probablement avant que la viande soit finie ou consommée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: la viande
  rationale: Dans le contexte des cailles mangées par le peuple, le mot désigne la chair animale considérée comme nourriture; « viande » est le terme français naturel.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: était encore entre leurs dents
  rationale: Cette formulation restitue directement la continuité exprimée par עוֹד et conserve l’image saisissante de la viande qui n’a pas encore été avalée.
- source_word: טֶרֶם יִכָּרֵת
  choice: avant d’être consommée
  rationale: Le verbe כרת signifie littéralement « retrancher/couper »; dans ce contexte alimentaire, la formulation indique vraisemblablement que la viande n’était pas encore finie ou consommée. La note conserve le sens littéral.
- source_word: וְאַף יְהוָה חָרָה
  choice: la colère de Yahweh s’enflamma
  rationale: Le français conserve la métaphore hébraïque d’une colère qui brûle tout en restant naturel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu et à la couche anglaise auditée.
- source_word: וַיַּךְ
  choice: frappa
  rationale: Le verbe נכה exprime ici l’action punitive de frapper; « frappa » en garde la force sans archaïsme.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: un fléau d’une extrême gravité
  rationale: מַכָּה désigne ici une calamité ou un fléau infligé collectivement; רַבָּה מְאֹד en souligne l’intensité exceptionnelle. Cette tournure est idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Expression anthropopathique de la colère divine
  choice: la colère de Yahweh s’enflamma contre le peuple
  alternative: Yahweh se mit en colère contre le peuple
  rationale: Le choix retenu conserve la métaphore forte de l’hébreu חרה אף au lieu de l’aplanir.
- issue: Lien temporel entre la consommation et la colère
  choice: quand la colère de Yahweh s’enflamma
  alternative: et la colère de Yahweh s’enflamma
  rationale: « Quand » rend naturellement en français la succession immédiate des circonstances, sans établir que la colère attendit l’achèvement de la consommation; le texte précise au contraire qu’elle éclata avant.
translation_notes:
  register: Français international moderne, lisible et solennel. La structure est légèrement réorganisée pour éviter une coordination pesante, tout en conservant l’image concrète, la violence du jugement et la répétition du nom Yahweh.
