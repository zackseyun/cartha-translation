  to: La viande était encore entre leurs dents[a], avant même d’être consommée, et la colère de Yahweh s’enflamma contre le peuple ; Yahweh frappa le peuple d’un très grand fléau.
  rationale: La révision supprime des marqueurs temporels non exprimés dans l’hébreu, améliore légèrement la fluidité française et rend רַבָּה מְאֹד par une expression qui maintient son sens de grandeur exceptionnelle. La note conserve l’ambiguïté lexicale de יִכָּרֵת et son interprétation contextuelle.
