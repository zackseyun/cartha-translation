source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: fr
  text: 'Mais Moïse dit : « Le peuple au milieu duquel je me trouve compte six cent mille personnes à pied[a], et toi, tu as dit : “Je leur donnerai de la viande, et ils en mangeront pendant un mois entier[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « six cent mille hommes à pied ». L’expression hébraïque peut désigner des personnes qui se déplacent à pied ou des fantassins.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « un mois de jours », expression qui désigne un mois complet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Moïse dit
  rationale: Le waw fait avancer le récit, tandis que « mais » exprime naturellement ici l’objection de Moïse à la déclaration divine précédente.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: six cent mille
  rationale: Traduction directe de la construction numérale hébraïque.
- source_word: רַגְלִי הָעָם
  choice: Le peuple … compte six cent mille personnes à pied
  rationale: Cette formulation conserve la référence au peuple et le sens littéral lié au fait d’être « à pied », sans imposer dans le texte principal une interprétation exclusivement militaire ou masculine.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: au milieu duquel je me trouve
  rationale: Rend directement l’idée de présence « au milieu de » ce peuple, dans un français actuel et digne.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: et toi, tu as dit
  rationale: Le pronom explicite אַתָּה porte un contraste marqué; la dislocation française « et toi » en restitue l’insistance sans surinterpréter.
- source_word: בָּשָׂר
  choice: viande
  rationale: Dans ce contexte alimentaire, « viande » est l’équivalent français naturel de בָּשָׂר.
- source_word: אֶתֵּן לָהֶם
  choice: Je leur donnerai
  rationale: Le futur français exprime clairement la promesse ou l’intention formulée au discours direct.
- source_word: וְאָכְלוּ
  choice: et ils en mangeront
  rationale: Le futur coordonné présente le résultat annoncé; le pronom « en » reprend naturellement « de la viande » en français.
- source_word: חֹדֶשׁ יָמִים
  choice: pendant un mois entier
  rationale: L’expression hébraïque signifie idiomatiquement un mois complet. Le français naturel est retenu, tandis que la forme littérale est signalée en note.
