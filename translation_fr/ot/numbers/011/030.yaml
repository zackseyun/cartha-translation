  text: וַ/יֵּאָסֵ֥ף מֹשֶׁ֖ה אֶל הַֽ/מַּחֲנֶ֑ה ה֖וּא וְ/זִקְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/030.yaml
  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: fr
  text: Puis Moïse retourna au camp[a], lui et les anciens d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Puis Moïse se retira au camp, lui et les anciens d’Israël ». Le verbe hébreu peut aussi être rendu plus littéralement de cette façon, mais, dans ce contexte, il signifie que Moïse retourna au camp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: retourna
  rationale: Le niphal de אסף peut se rendre littéralement par « fut rassemblé », mais il exprime ici, dans le contexte narratif, le retour de Moïse au camp. « Retourna » transmet naturellement ce sens sans surinterpréter le mouvement.
- source_word: אֶל הַמַּחֲנֶה
  choice: au camp
  rationale: אֶל indique la direction vers le camp d’Israël. « Au camp » est la formulation française directe et naturelle; « dans le camp » préciserait davantage l’entrée.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: lui et les anciens d’Israël
  rationale: Le pronom הוּא reprend Moïse avec une valeur appositionnelle ou emphatique et indique qu’il revient avec les anciens. La structure explicite du français conserve cette reprise hébraïque.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Cette traduction naturelle du groupe construit conserve le titre collectif traditionnel et reste claire en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le tour « lui et les anciens d’Israël » préserve l’insistance et la structure de l’hébreu, tandis que la note maintient visible l’ambiguïté lexicale du verbe.
