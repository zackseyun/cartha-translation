  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: fr
  text: 'Tu diras au peuple : « Consacrez-vous[a] pour demain, et vous mangerez de la viande, car vous avez pleuré devant Yahweh en disant : “Qui nous donnera de la viande à manger ? Car nous étions bien en Égypte.” Yahweh vous donnera de la viande, et vous en mangerez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sanctifiez-vous ». Le verbe hébreu signifie se mettre à part en préparation de l’action de Yahweh.'
    reason: Alternative lexicale conservant la nuance cultuelle du verbe.
lexical_decisions:
- source_word: תֹּאמַר
  choice: Tu diras
  rationale: L’imparfait 2ms adressé à Moïse a ici une valeur directive; le futur français rend naturellement cette instruction.
- source_word: הִתְקַדְּשׁוּ
  choice: Consacrez-vous
  rationale: Le hitpael impératif de קדשׁ exprime le fait de se mettre à part en vue de l’action divine; « consacrez-vous » en préserve la portée religieuse.
- source_word: לְמָחָר
  choice: pour demain
  rationale: La préposition situe la préparation en vue du lendemain; cette formulation reste proche de l’hébreu et naturelle en français.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: et vous mangerez de la viande
  rationale: בָּשָׂר désigne ici de la viande destinée à être mangée; la forme verbale exprime le résultat futur de l’ordre précédent.
- source_word: בְּכִיתֶם
  choice: vous avez pleuré
  rationale: L’accompli désigne une action antérieure qui motive la réponse annoncée; le passé composé en maintient la pertinence présente.
- source_word: בְּאָזְנֵי יְהוָה
  choice: aux oreilles de Yahweh
  rationale: La formulation conserve l’image hébraïque explicite tout en restant intelligible en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Qui nous donnera de la viande à manger ?
  rationale: Le hiphil de אכל signifie littéralement faire manger; cette tournure française exprime clairement le sens causatif sans suggérer l’acte de nourrir à la main.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: Car nous étions bien en Égypte
  rationale: Cette expression française naturelle conserve l’idée non comparative de טוֹב לָנוּ, sans ajouter « mieux ».
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: Yahweh vous donnera de la viande
  rationale: Le simple enchaînement est conservé sans expliciter par « donc » une relation causale seulement implicite.
- source_word: וַאֲכַלְתֶּם
  choice: et vous en mangerez
  rationale: La répétition finale est maintenue pour son insistance rhétorique; « en » évite une lourdeur inutile en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve sa fonction de nom personnel.
- issue: Portée de l’ordre הִתְקַדְּשׁוּ
  choice: Consacrez-vous
  alternative: Préparez-vous
  rationale: Le choix retenu conserve la dimension de mise à part rituelle ou religieuse sans préciser des rites que le verset ne nomme pas.
- issue: Lien entre la plainte et le don de viande
  choice: 'Simple succession : « Yahweh vous donnera »'
  alternative: « C’est pourquoi Yahweh vous donnera »
  rationale: Le waw permet de percevoir le lien contextuel, mais le texte ne l’explicite pas au moyen d’un connecteur causal fort; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier marque l’adresse à Moïse, tandis que l’impératif pluriel s’adresse au peuple. Les images hébraïques et la répétition finale sont conservées lorsqu’elles demeurent naturelles.
