  source_fidelity: 'Le sens général est fidèle au texte massorétique : l''instruction adressée à Moïse, l''impératif pluriel au peuple, la préparation pour le lendemain, la plainte, le don de viande et la répétition finale sont tous conservés. « Qui nous donnera de la viande à manger ? » rend adéquatement le hiphil de אכל. La formule « aux oreilles de Yahweh », toutefois, est un calque peu idiomatique en français.'
  naturalness: Le registre est moderne et digne. « Vous avez pleuré devant Yahweh » est plus naturel que « vous avez pleuré aux oreilles de Yahweh », tout en exprimant que leur plainte a été formulée en sa présence et entendue de lui. La typographie des interrogations dans le discours rapporté est également régularisée.
  terminology: « Yahweh », « consacrez-vous » et « viande » sont cohérents avec les choix terminologiques et le contexte. La note sur « sanctifiez-vous » conserve utilement l'alternative lexicale et la nuance de mise à part.
