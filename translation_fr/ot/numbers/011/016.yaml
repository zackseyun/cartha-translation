  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: fr
  text: 'Alors Yahvé dit à Moïse : « Rassemble pour moi[a] soixante-dix hommes parmi les anciens d’Israël, dont tu sais qu’ils sont des anciens du peuple et ses responsables[b]. Amène-les à la tente de la rencontre, et qu’ils se tiennent là avec toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Réunis pour moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « administrateurs » ; le terme hébreu désigne des agents exerçant des fonctions administratives sous l’autorité des anciens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt qu’un remplacement par le titre « le Seigneur ».
- source_word: אֶסְפָה לִּי
  choice: Rassemble pour moi
  rationale: Le verbe demande à Moïse de réunir des personnes, tandis que לִּי exprime qu’il doit le faire pour Yahvé.
- source_word: שִׁבְעִים אִישׁ
  choice: soixante-dix hommes
  rationale: אִישׁ, employé distributivement après le nombre, désigne ici des hommes adultes choisis pour exercer une fonction dirigeante.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: parmi les anciens d’Israël
  rationale: La préposition מִן indique une sélection opérée au sein du groupe des anciens d’Israël.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: dont tu sais qu’ils sont
  rationale: Cette formulation française naturelle conserve le fait que Moïse connaît déjà leur qualité reconnue.
- source_word: וְשֹׁטְרָיו
  choice: et ses responsables
  rationale: שֹׁטֵר désigne ici des agents chargés de fonctions administratives; le suffixe singulier renvoie collectivement au peuple.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction conserve le sens propre de l’expression désignant le sanctuaire où Yahvé rencontre son peuple.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: et qu’ils se tiennent là avec toi
  rationale: Le hitpael de יצב exprime l’idée de prendre position ou de se présenter, avec ici une valeur directive.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur; Yahweh; Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahvé » le conserve sous une forme établie en français, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au discours direct adressé personnellement à Moïse. La syntaxe demeure proche de l’hébreu tout en évitant les tournures artificielles.
