  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: fr
  text: Je descendrai et je parlerai avec toi là. Je prendrai de l’Esprit[a] qui repose sur toi et j’en mettrai sur eux. Ils porteront avec toi la charge du peuple, et tu ne porteras pas, toi seul, cette charge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’esprit ». Le mot hébreu רוּחַ peut désigner l’esprit, le vent ou le souffle ; dans ce contexte, il désigne ce qui équipe Moïse pour conduire le peuple.
    reason: 'Alternative lexicale et graphique : l’hébreu ne distingue pas typographiquement « Esprit » et « esprit » ; la majuscule reflète la compréhension contextuelle d’une puissance donnée par Dieu sans imposer une définition doctrinale ultérieure.'
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: Je descendrai
  rationale: Le verbe ירד signifie littéralement « descendre ». Cette formulation conserve le langage spatial et théophanique du texte hébreu sans l’atténuer.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: et je parlerai avec toi là-bas
  rationale: דבר avec עם exprime naturellement l’idée de parler avec quelqu’un. « Là-bas » maintient la précision spatiale du lieu indiqué dans le contexte.
- source_word: וְאָצַלְתִּי
  choice: Je prendrai une part
  rationale: Le verbe rare אצל décrit ici un prélèvement destiné à être placé sur les anciens. « Prendrai une part » rend la valeur partitive sans affirmer explicitement que Moïse subit une diminution.
- source_word: מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: de l’Esprit qui repose sur toi
  rationale: מן a une valeur partitive après « prendre une part ». Le contexte désigne l’Esprit qui donne à Moïse la capacité d’exercer sa mission. « Repose sur » exprime en français naturel la métaphore relationnelle de על.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: et je la mettrai sur eux
  rationale: שׂים signifie « mettre, placer ». Le pronom féminin reprend « une part » et permet de conserver l’image de ce qui est placé sur les anciens.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: Ils porteront avec toi la charge du peuple
  rationale: נשא et מַשָּׂא forment un réseau lexical autour de l’action de porter. « Charge » désigne clairement ici la lourde responsabilité liée à la conduite du peuple.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: et tu ne la porteras plus toi seul
  rationale: Le pronom renvoie à la charge. « Toi seul » restitue l’insistance de אַתָּה לְבַדֶּךָ, tandis que « plus » rend naturellement en français le résultat de la nouvelle répartition annoncée.
theological_decisions:
- issue: Faut-il écrire « Esprit » ou « esprit » pour רוּחַ ?
  choice: Esprit
  alternative: esprit
  rationale: Dans le contexte immédiat, רוּחַ désigne la puissance d’origine divine qui équipe Moïse puis les anciens pour leur mission. La majuscule signale ce sens sans imposer au verset une formulation doctrinale postérieure. Une note conserve l’alternative graphique et la portée lexicale plus large du mot.
- issue: Le transfert implique-t-il une diminution de ce qui repose sur Moïse ?
  choice: une part de l’Esprit
  alternative: de l’Esprit / quelque chose de l’esprit
  rationale: La construction avec מן est partitive, mais le texte ne précise pas si Moïse perd une portion de ce qui lui a été donné. La traduction évite donc de résoudre cette tension dans un sens ou dans l’autre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde les images concrètes de descente, de présence « sur » une personne et de charge portée en commun. Le tutoiement correspond au discours direct de Dieu à Moïse et à l’usage biblique français courant.
