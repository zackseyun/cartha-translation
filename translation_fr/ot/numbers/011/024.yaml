  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: fr
  text: Moïse sortit et rapporta au peuple les paroles de Yahweh. Il rassembla soixante-dix hommes parmi les anciens du peuple et les fit se tenir[a] autour de la tente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les plaça » ou « les établit ». Le verbe hébreu signifie littéralement « les fit se tenir debout ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la tente » ; d’après le contexte, il s’agit probablement de la tente de la Rencontre.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא exprime ici le fait de sortir du lieu où Moïse se trouvait; « sortit » est direct, naturel et conforme à la progression narrative.
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: rapporta au peuple les paroles de Yahweh
  rationale: La construction indique que Moïse communique au peuple les paroles reçues. « Rapporta » rend naturellement cette transmission en français, tandis que « les paroles » conserve l’expression concrète דִּבְרֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וַיֶּאֱסֹף
  choice: rassembla
  rationale: אסף signifie réunir ou rassembler; « rassembla » convient naturellement à la sélection et au regroupement des anciens.
- source_word: שִׁבְעִים אִישׁ
  choice: soixante-dix hommes
  rationale: אִישׁ, employé collectivement après le nombre, désigne ici des hommes choisis parmi les anciens; le genre du référent est donc conservé.
- source_word: מִזִּקְנֵי הָעָם
  choice: parmi les anciens du peuple
  rationale: 'Le מִן a une valeur partitive: les soixante-dix sont pris parmi le groupe reconnu des anciens du peuple.'
- source_word: וַיַּעֲמֵד אֹתָם
  choice: les fit se tenir
  rationale: Le hiphil de עמד est causatif, littéralement « les fit se tenir debout ». La formulation retenue conserve cette nuance sans préciser davantage la posture ou la disposition.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: autour de la tente
  rationale: Le texte dit simplement « la tente ». La traduction maintient cette désignation sans développer explicitement « tente de la rencontre », même si le contexte l’identifie probablement ainsi.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » en préserve la fonction et évite de le remplacer silencieusement par un titre.
- issue: Genre de אִישׁ dans שִׁבְעִים אִישׁ
  choice: soixante-dix hommes
  alternative: soixante-dix personnes
  rationale: Le nom hébreu est masculin et le contexte présente ces personnes comme des hommes choisis parmi les anciens; une formulation neutre effacerait cette donnée.
- issue: Identification de הָאֹהֶל
  choice: la tente
  alternative: la tente de la rencontre
  rationale: Le contexte renvoie vraisemblablement à la tente de la rencontre, mais le syntagme hébreu de ce verset dit seulement « la tente ». Cette brièveté est conservée et l’identification contextuelle est signalée en note.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple soutient le registre narratif biblique sans archaïsme marqué. « Parmi les anciens » explicite naturellement la valeur partitive de la préposition hébraïque, tandis que les notes préservent les nuances lexicales et contextuelles non résolues par le texte.
