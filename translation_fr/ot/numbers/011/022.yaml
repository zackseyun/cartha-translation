  text: הֲ/צֹ֧אן וּ/בָקָ֛ר יִשָּׁחֵ֥ט לָ/הֶ֖ם וּ/מָצָ֣א לָ/הֶ֑ם אִ֣ם אֶֽת כָּל דְּגֵ֥י הַ/יָּ֛ם יֵאָסֵ֥ף לָ/הֶ֖ם וּ/מָצָ֥א לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: fr
  text: Abattrait-on pour eux du petit bétail et du gros bétail, et cela leur suffirait-il ? Ou bien, si l’on rassemblait pour eux tous les poissons de la mer, cela leur suffirait-il[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « et cela sera trouvé pour eux », une expression qui signifie ici « et cela leur suffira » ou « et il y en aura assez pour eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: Faudra-t-il
  rationale: La particule interrogative introduit une question rhétorique portant sur une éventualité; cette tournure est naturelle en français et conserve la force du défi.
- source_word: צֹאן וּבָקָר
  choice: des moutons et des bovins
  rationale: Le premier terme désigne le petit bétail et le second les bovins. Cette formulation concrète distingue les deux catégories sans technicité excessive.
- source_word: יִשָּׁחֵט
  choice: égorger
  rationale: Le niphal de שׁחט désigne l’abattage d’animaux; « égorger » conserve ici le sens précis de mise à mort destinée à fournir de la viande.
- source_word: לָהֶם
  choice: pour eux
  rationale: La préposition exprime ici une action accomplie en vue de pourvoir aux besoins du peuple.
- source_word: וּמָצָא לָהֶם
  choice: pour qu’il y en ait assez pour eux
  rationale: Dans cette construction, מצא exprime la suffisance plutôt que la simple découverte. La tournure française rend l’idiome naturellement.
- source_word: אִם
  choice: Ou bien
  rationale: Dans la seconde branche de la question, אִם introduit une autre possibilité rhétorique; « Ou bien » marque clairement l’alternative.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: tous les poissons de la mer
  rationale: Traduction directe du syntagme construit, qui maintient la portée totalisante de כָּל.
- source_word: יֵאָסֵף
  choice: rassemblera-t-on
  rationale: Le niphal de אסף signifie « être rassemblé ». Le tour impersonnel français conserve l’idée sans préciser indûment qu’ils seraient pêchés.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques sont parallèles; la répétition de « pour eux » reflète l’insistance de l’hébreu. Le marqueur de note est placé après la seconde occurrence, tout en expliquant l’idiome répété dans les deux membres.
