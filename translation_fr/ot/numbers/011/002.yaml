  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: fr
  text: Alors le peuple cria à Moïse, et Moïse pria Yahweh ; le feu s’apaisa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retomba ». Le verbe hébreu évoque un feu qui baisse ou perd de sa force.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: cria
  rationale: Le verbe צעק exprime ici un cri pressant lancé dans la détresse pour obtenir de l’aide. « Cria » convient naturellement avec le complément « vers Moïse ».
- source_word: הָעָם
  choice: le peuple
  rationale: Dans ce récit, עַם désigne collectivement la communauté d’Israël. « Le peuple » est la formulation française courante et précise.
- source_word: אֶל מֹשֶׁה
  choice: vers Moïse
  rationale: La préposition אֶל indique la direction de l’appel. « Vers Moïse » conserve cette nuance sans expliciter davantage l’intention.
- source_word: וַיִּתְפַּלֵּל
  choice: pria
  rationale: La forme hitpael de פלל signifie couramment « prier ». Le contexte implique une intercession, mais « pria » reste plus directement lexical et évite de surinterpréter.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui préserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וַתִּשְׁקַע
  choice: s’apaisa
  rationale: שקע évoque littéralement le fait de s’enfoncer ou de retomber et, à propos du feu, indique qu’il perd de sa force. « S’apaisa » est clair et naturel sans affirmer nécessairement une extinction instantanée.
- source_word: הָאֵשׁ
  choice: le feu
  rationale: אֵשׁ signifie directement « feu » et renvoie ici au feu mentionné dans le contexte immédiat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, simple et digne. Les deux propositions brèves reproduisent le mouvement narratif du verset. « Cria vers Moïse » garde la direction exprimée en hébreu, tandis que « s’apaisa » restitue naturellement la diminution du feu sans imposer l’idée plus forte qu’il fut entièrement éteint.
