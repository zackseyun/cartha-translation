  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: fr
  text: 'Mais Moïse lui dit : « Est-ce pour moi que tu es jaloux[a] ? Si seulement tout le peuple de Yahweh était prophète, si Yahweh mettait son Esprit sur eux ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Est-ce pour moi que tu fais preuve de zèle ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְקַנֵּא
  choice: es-tu jaloux
  rationale: Dans ce contexte, le verbe קנא décrit l’attitude protectrice de Josué envers la position de Moïse. « Être jaloux » en rend naturellement la nuance, sans lui donner la valeur nécessairement positive que pourrait suggérer « être zélé ».
- source_word: לִי
  choice: pour moi
  rationale: La préposition avec suffixe indique que la réaction de Josué vise à défendre les intérêts de Moïse. « Pour moi » est direct et idiomatique en français.
- source_word: וּמִי יִתֵּן
  choice: si seulement
  rationale: L’expression idiomatique introduit un souhait, non une question littérale sur l’identité de celui qui donnerait quelque chose.
- source_word: כָּל עַם יְהוָה
  choice: tout le peuple de Yahweh
  rationale: Cette formulation rend clairement la totalité du peuple appartenant à Yahweh et reste naturelle en français moderne.
- source_word: נְבִיאִים
  choice: composé de prophètes
  rationale: Le nom pluriel signifie « prophètes ». L’ajout syntaxique « composé de » permet d’exprimer naturellement en français que tous les membres du peuple seraient prophètes, sans transformer le nom en simple activité verbale.
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: si Yahweh mettait son Esprit sur eux
  rationale: Dans la continuité du souhait introduit par וּמִי יִתֵּן, כִּי présente ici ce qui rendrait possible la condition prophétique souhaitée. « Mettre son Esprit sur eux » conserve l’image hébraïque de l’Esprit venant sur des personnes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: רוּחוֹ
  choice: son Esprit
  rationale: Le contexte immédiat est celui de la capacité prophétique accordée par Dieu ; « Esprit » désigne donc ici la présence divine qui habilite à prophétiser.
theological_decisions:
- issue: Sens de רוּחוֹ dans le contexte de l’habilitation prophétique
  choice: son Esprit
  alternative: son esprit
  rationale: Le contexte relie directement l’Esprit de Yahweh à la prophétie. La majuscule clarifie le référent divin sans préciser davantage la nature de cette action.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » préserve ce nom au lieu de le remplacer par un titre.
- issue: Portée de la jalousie exprimée par קנא
  choice: une jalousie protectrice exercée en faveur de Moïse
  alternative: un zèle en faveur de Moïse
  rationale: La question de Moïse met en cause la volonté de Josué de protéger son autorité. Le français « jaloux » conserve la possible nuance négative, tandis que la note signale l’autre nuance lexicale sans trancher excessivement.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le caractère vif de la question de Moïse et l’élan de son souhait. Le nom divin est rendu par « Yahweh » et l’image spatiale de l’Esprit placé « sur » les personnes est maintenue.
