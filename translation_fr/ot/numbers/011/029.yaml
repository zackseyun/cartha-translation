  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : Moïse interroge Josué sur sa jalousie à son égard, puis exprime le souhait que tout le peuple de Yahweh soit prophète parce que Yahweh mettrait son Esprit sur lui. « Yahweh » et « son Esprit » correspondent au texte hébreu et au contexte d’habilitation prophétique. Toutefois, « était composé de prophètes » est une explicitation structurelle inutile du prédicat nominal נְבִיאִים et affaiblit la formulation directe du souhait.'
  naturalness: La phrase est globalement naturelle en français moderne. « Tout le peuple de Yahweh était prophète » est plus direct, plus idiomatique dans ce registre et plus proche de la force concise de l’hébreu que « était composé de prophètes ».
  terminology: « Jaloux », « Yahweh », « prophète(s) » et « Esprit » sont appropriés. La note proposée sur « zèle » doit éviter l’ajout interprétatif « tant de », qui n’est pas exprimé dans l’hébreu.
