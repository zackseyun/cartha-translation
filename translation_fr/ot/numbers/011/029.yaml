    issue: « était composé de prophètes »
    rationale: Cette tournure présente le peuple comme un ensemble constitué d’une catégorie de personnes, alors que l’hébreu emploie directement le prédicat « prophètes ». Elle est plus lourde et moins vive que nécessaire.
  - severity: low
    issue: La note ajoute « tant de zèle »
    rationale: Le texte source permet l’alternative « zèle », mais ne précise aucune intensité telle que « tant de ».
