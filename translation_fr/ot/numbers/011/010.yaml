id: NUM.11.10
reference: Numbers 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: fr
  text: Moïse entendit le peuple pleurer, famille par famille[a], chacun à l’entrée de sa tente. La colère de Yahweh s’enflamma avec force, et cela déplut à Moïse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par clans ». Le terme hébreu peut désigner des familles étendues ou des groupes de parenté plus larges.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et cela fut mauvais aux yeux de Moïse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit
  rationale: Le verbe décrit ici la perception des pleurs par Moïse; « entendit » rend naturellement le wayyiqtol du qal.
- source_word: בֹּכֶה
  choice: pleurer
  rationale: Le participe présente une action en cours. Après « entendit », l’infinitif français exprime naturellement cette continuité.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: famille par famille
  rationale: Cette expression distributive et idiomatique représente les groupes de parenté désignés par מִשְׁפָּחָה sans imposer une organisation clanique trop précise.
- source_word: אִישׁ
  choice: chacun
  rationale: Dans cet emploi distributif, אִישׁ individualise les membres du peuple. « Chacun » conserve cette fonction sans rendre le français lourd.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: à l’entrée de sa tente
  rationale: La formulation conserve exactement l’image spatiale de l’ouverture de chaque tente.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: La colère de Yahweh s’enflamma avec une extrême violence
  rationale: La traduction garde la métaphore hébraïque de la colère qui brûle et rend la forte intensification de מְאֹד dans un français naturel.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: et cela fut mauvais aux yeux de Moïse
  rationale: Cette formulation préserve l’expression évaluative hébraïque et laisse volontairement implicite, comme le texte source, ce que Moïse juge mauvais.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Référent implicite de רָע dans l’évaluation de Moïse
  choice: cela fut mauvais aux yeux de Moïse
  alternative: cela déplut à Moïse
  rationale: L’hébreu ne précise pas explicitement si Moïse réagit aux pleurs, à la situation ou à la colère divine. Le démonstratif neutre et la tournure littérale maintiennent cette tension au lieu de fixer le référent.
- issue: Valeur distributive de אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: Dans la construction, אִישׁ fonctionne distributivement au sein du peuple. « Chacun » transmet cette individualisation sans nécessairement affirmer que seuls des hommes pleuraient.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du rythme narratif hébreu, tandis que « famille par famille » et « chacun » assurent une lecture naturelle. Les marqueurs [a] et [b] figurent dans le texte aux expressions qu’ils éclairent.
