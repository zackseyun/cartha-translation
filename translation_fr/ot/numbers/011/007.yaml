  text: וְ/הַ/מָּ֕ן כִּ/זְרַע גַּ֖ד ה֑וּא וְ/עֵינ֖/וֹ כְּ/עֵ֥ין הַ/בְּדֹֽלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: fr
  text: La manne ressemblait à de la graine de coriandre, et son aspect à celui du bdellium[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le bdellium est une résine ou une gomme aromatique. L’identification exacte du terme hébreu est incertaine; certains y voient plutôt une substance semblable à une pierre précieuse, comme une perle ou du cristal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: la manne
  rationale: Le nom défini désigne la nourriture déjà connue du récit; « la manne » est l’équivalent français usuel.
- source_word: כִּזְרַע גַּד
  choice: ressemblait à de la graine de coriandre
  rationale: La préposition כְּ exprime ici une comparaison, et גַּד est couramment identifié à la coriandre. Le singulier collectif « de la graine » rend naturellement זֶרַע en français.
- source_word: וְעֵינוֹ
  choice: et son aspect
  rationale: Dans cet emploi, עַיִן ne désigne pas littéralement l’œil, mais l’apparence visible.
- source_word: כְּעֵין
  choice: à celui du
  rationale: « À celui du » reprend naturellement « son aspect » tout en conservant la comparaison visuelle exprimée par la répétition de עַיִן.
- source_word: הַבְּדֹלַח
  choice: le bdellium
  rationale: « Bdellium » est l’équivalent traditionnel le plus direct, mais l’identification exacte du terme hébreu demeure incertaine; cette incertitude est signalée en note plutôt que résolue dans le texte.
theological_decisions: []
