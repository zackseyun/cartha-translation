  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: fr
  text: 'Moïse dit à Yahweh : « Pourquoi as-tu fait du mal à ton serviteur[a] ? Pourquoi n’ai-je pas trouvé grâce à tes yeux[b], pour que tu mettes sur moi la charge de tout ce peuple ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi as-tu maltraité ton serviteur ? » Le verbe hébreu signifie plus littéralement « causer du mal » et exprime ici la plainte de Moïse.'
    reason: lexical_alternative
  - marker: b
    text: « Trouver grâce aux yeux de quelqu’un » est une expression hébraïque qui signifie recevoir sa faveur.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: הֲרֵעֹתָ לְעַבְדֶּךָ
  choice: as-tu fait du mal à ton serviteur
  rationale: Rend directement le hiphil de רעע et conserve la vigueur de la plainte de Moïse, sans affirmer au-delà du discours que Dieu aurait commis un mal moral.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: ai-je trouvé grâce à tes yeux
  rationale: Conserve l’expression hébraïque tout en restant claire et naturelle en français biblique moderne.
- source_word: לָשׂוּם אֶת מַשָּׂא
  choice: pour que tu mettes … la charge
  rationale: Le syntagme garde la valeur possible de but ou de conséquence de l’infinitif et la métaphore du poids imposé.
- source_word: כָּל הָעָם הַזֶּה
  choice: tout ce peuple
  rationale: Préserve le singulier collectif de עָם dans une tournure française naturelle.
theological_decisions:
- issue: Dieu est le sujet de הֲרֵעֹתָ, littéralement « faire du mal/du mauvais »
  choice: as-tu fait du mal à ton serviteur
  alternative: as-tu maltraité ton serviteur
  rationale: La formulation retenue préserve la tension et la force de la plainte adressée par Moïse à Dieu. Une note précise la portée lexicale sans transformer cette parole de détresse en affirmation doctrinale.
- issue: Valeur de l’infinitif לָשׂוּם
  choice: pour que tu mettes
  alternative: au point de mettre / puisque tu as mis
  rationale: La construction peut exprimer le but ou le résultat; « pour que » conserve au mieux cette relation sans la réduire à une simple causalité.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe interrogative garde le ton de lamentation. « Tout ce peuple » rend naturellement le collectif singulier hébreu; aucune note n’est nécessaire.
