  text: לֹ֣א י֥וֹם אֶחָ֛ד תֹּאכְל֖וּ/ן וְ/לֹ֣א יוֹמָ֑יִם וְ/לֹ֣א חֲמִשָּׁ֣ה יָמִ֗ים וְ/לֹא֙ עֲשָׂרָ֣ה יָמִ֔ים וְ/לֹ֖א עֶשְׂרִ֥ים יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: fr
  text: Vous n’en mangerez pas seulement pendant un jour[a], ni pendant deux jours, ni pendant cinq jours, ni pendant dix jours, ni pendant vingt jours,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Vous n’en mangerez pas pendant un jour, ni pendant deux jours, ni pendant cinq jours, ni pendant dix jours, ni pendant vingt jours. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: pas seulement … ni
  rationale: La négation répétée exclut successivement chacune des durées. En français, « pas seulement … ni » rend naturellement la série tout en préparant la durée plus longue annoncée au verset suivant.
- source_word: יוֹם אֶחָד
  choice: un jour
  rationale: Rend directement l’expression cardinale et conserve la progression numérique.
- source_word: תֹּאכְלוּ/ן
  choice: vous n’en mangerez
  rationale: L’imparfait qal à la deuxième personne du masculin pluriel a ici une valeur future dans l’annonce divine. Le pronom « en » reprend naturellement la viande mentionnée dans le contexte immédiat.
- source_word: יוֹמָיִם
  choice: deux jours
  rationale: Le duel hébreu désigne explicitement deux jours.
- source_word: חֲמִשָּׁה יָמִים
  choice: cinq jours
  rationale: Traduction directe qui préserve l’accumulation rhétorique.
- source_word: עֲשָׂרָה יָמִים
  choice: dix jours
  rationale: Traduction directe qui maintient la progression.
- source_word: עֶשְׂרִים יוֹם
  choice: vingt jours
  rationale: Le singulier hébreu après vingt est idiomatique; le français exige normalement le pluriel « jours ».
- source_word: וְ
  choice: ni
  rationale: Dans cette série de termes niés, « ni » est l’équivalent français idiomatique du waw répété.
theological_decisions: []
