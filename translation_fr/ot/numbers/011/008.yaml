base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: fr
  text: Le peuple allait çà et là et la ramassait. Il la broyait avec des meules ou la pilait dans un mortier, puis la faisait cuire dans une marmite et en faisait des galettes. Elle avait un goût semblable à celui d’une huile onctueuse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « semblable à celui de l’huile fraîche ». L’expression hébraïque est difficile ; elle semble évoquer la richesse ou la fraîcheur de l’huile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ הָעָם וְלָקְטוּ
  choice: Le peuple parcourait les environs pour en ramasser
  rationale: שׁוט exprime un déplacement de côté et d’autre dans une zone; l’imparfait rend ici l’action habituelle. «Les environs» explicite naturellement l’étendue parcourue sans préciser un lieu absent de l’hébreu.
- source_word: וְטָחֲנוּ בָרֵחַיִם
  choice: Il la moulait avec des meules
  rationale: רֵחַיִם désigne les meules d’un moulin à bras. «Avec» rend clairement la valeur instrumentale de la préposition.
- source_word: אוֹ דָכוּ בַּמְּדֹכָה
  choice: ou la pilait dans un mortier
  rationale: דכך désigne l’action de broyer ou piler; «piler dans un mortier» est l’expression française naturelle et concrète.
- source_word: וּבִשְּׁלוּ בַּפָּרוּר
  choice: puis la faisait cuire dans une marmite
  rationale: בשל peut signifier cuire ou faire bouillir. «Faire cuire» préserve l’étendue sémantique sans imposer un procédé plus précis; פָּרוּר désigne un récipient de cuisson.
- source_word: וְעָשׂוּ אֹתוֹ עֻגוֹת
  choice: et en faisait des galettes
  rationale: עֻגוֹת désigne des pains ou gâteaux plats, souvent ronds; «galettes» est précis, courant et adapté au contexte.
- source_word: וְהָיָה טַעְמוֹ כְּטַעַם
  choice: Elle avait un goût semblable à celui de
  rationale: La formulation française rend explicitement la comparaison répétée autour de טַעַם tout en restant naturelle.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: une huile onctueuse
  rationale: La locution rare et difficile semble évoquer la richesse, la fraîcheur ou la substance grasse de l’huile. «Huile onctueuse» communique sa qualité riche sans prétendre lever entièrement l’incertitude.
