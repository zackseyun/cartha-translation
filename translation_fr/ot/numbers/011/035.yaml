  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: fr
  text: De Qibroth-Hattaava[a], le peuple partit pour Hatséroth et séjourna à Hatséroth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qibroth-Hattaava signifie « tombes du désir » ou « tombes de la convoitise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  choice: De Kibroth-Hattaava
  rationale: Ce syntagme fonctionne ici comme un nom de lieu. La translittération conserve le toponyme, tandis qu’une note en indique le sens transparent.
- source_word: נָסְע֥וּ
  choice: partit
  rationale: Dans les récits d’itinéraire, נסע désigne le fait de lever le camp et de se mettre en route. « Partit » exprime naturellement ce départ en français moderne.
- source_word: הָ/עָ֖ם
  choice: le peuple
  rationale: עם désigne collectivement la communauté israélite ; « le peuple » est ici la formulation française naturelle et habituelle.
- source_word: חֲצֵר֑וֹת
  choice: Hatséroth
  rationale: Il s’agit d’un nom de lieu, rendu par une translittération française usuelle et cohérente avec les consonnes hébraïques.
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  choice: et séjourna à Hatséroth
  rationale: La formulation signifie littéralement « et ils furent à Hatséroth ». Dans ce contexte d’itinéraire, « séjourna » rend idiomatiquement l’idée que le peuple y demeura quelque temps ; le singulier reprend l’accord collectif avec « le peuple ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Les toponymes sont translittérés ; la répétition de Hatséroth, présente dans l’hébreu, est conservée. Le passé simple convient au registre narratif biblique écrit sans être archaïque.
