id: NUM.11.1
reference: Numbers 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: fr
  text: Le peuple était comme des gens qui se plaignaient de leurs malheurs aux oreilles de Yahweh[a]. Yahweh l’entendit, et sa colère s’enflamma ; le feu de Yahweh[b] s’embrasa parmi eux et dévora à l’extrémité du camp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure hébraïque est rare et difficile. On pourrait aussi traduire : « Le peuple était comme des plaignants » ou « Le peuple était comme s’il se plaignait ». Littéralement, la plainte se fait « aux oreilles de Yahweh », c’est-à-dire qu’elle parvient à son attention.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un feu envoyé par Yahweh ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « aux abords du camp » ou « à la périphérie du camp ». L’hébreu indique le lieu, mais ne précise pas explicitement ce que le feu a consumé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים
  choice: Le peuple était comme des gens qui se plaignent
  rationale: La formulation conserve la valeur comparative de כְּ־ et le caractère duratif du participe hitpael, sans effacer la difficulté de cette tournure rare. Une note présente des formulations françaises plus naturelles mais légèrement plus interprétatives.
- source_word: רַע
  choice: de leurs malheurs
  rationale: Dans ce contexte, רַע peut désigner le malheur ou l’adversité dont le peuple se plaint. Le pluriel français est idiomatique pour les épreuves subies, tout en évitant de présenter la plainte elle-même comme moralement mauvaise sans certitude.
- source_word: בְּאָזְנֵי יְהוָה
  choice: aux oreilles de Yahweh
  rationale: Cette formulation maintient l’image auditive concrète de l’hébreu et prépare la répétition « Yahweh l’entendit ». Elle signifie que les plaintes sont parvenues à son attention.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh » plutôt que remplacé par un titre.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Yahweh l’entendit
  rationale: 'Le pronom « l’ » explicite naturellement en français l’objet implicite : la plainte du peuple.'
- source_word: וַיִּחַר אַפּוֹ
  choice: sa colère s’enflamma
  rationale: Cette expression française claire conserve l’image hébraïque de la colère qui brûle, sans reproduire littéralement la référence idiomatique au nez.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: le feu de Yahweh s’embrasa parmi eux
  rationale: Le génitif « de Yahweh » reste transparent et « parmi eux » rend בָּם sans préciser davantage la manière dont le feu les atteint.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: dévora l’extrémité du camp
  rationale: Le verbe « dévora » conserve la personnification forte du feu. « L’extrémité du camp » rend directement le lieu ou la partie périphérique indiquée par בִּקְצֵה, sans ajouter explicitement des personnes absentes du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. La translittération préserve le nom personnel sans lui substituer un titre.
- issue: Attribution du feu divin
  choice: le feu de Yahweh
  alternative: un feu envoyé par Yahweh
  rationale: Le choix principal conserve la relation génitive de l’hébreu sans décider si elle exprime l’appartenance, l’origine ou l’action directe. L’autre interprétation est signalée en note.
- issue: Objet de la plainte
  choice: leurs malheurs
  alternative: ils se plaignaient mal ; ils tenaient des propos mauvais
  rationale: רַע est syntaxiquement difficile. Le contexte favorise l’adversité comme objet de la plainte, mais la note maintient l’existence d’autres analyses possibles.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été divisée en trois phrases pour rendre clairement la progression narrative, tandis que les répétitions auditives et les images du feu ont été conservées. La formulation principale garde volontairement l’étrangeté comparative du premier membre et réserve les solutions plus fluides à la note.
