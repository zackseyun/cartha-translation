revisions:
- from: Le peuple était comme des gens qui se plaignent de leurs malheurs, aux oreilles de Yahweh[a]. Yahweh l’entendit, et sa colère s’enflamma. Alors le feu de Yahweh[b] s’embrasa parmi eux et dévora l’extrémité du camp[c].
  to: Le peuple était comme des gens qui se plaignaient de leurs malheurs aux oreilles de Yahweh[a]. Yahweh l’entendit, et sa colère s’enflamma ; le feu de Yahweh[b] s’embrasa parmi eux et dévora à l’extrémité du camp[c].
  rationale: La révision conserve les choix solides du projet tout en rétablissant la fonction locative de « à l’extrémité du camp » et l’ambiguïté de l’objet consumé. Elle harmonise aussi le temps verbal et évite l’ajout de « Alors ».
