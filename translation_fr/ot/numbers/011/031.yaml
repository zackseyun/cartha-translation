source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: fr
  text: Alors un vent venant de Yahweh[a] se leva, poussa des cailles depuis la mer et les laissa tomber près du camp, sur une étendue d’environ une journée de marche d’un côté et d’environ une journée de marche de l’autre, tout autour du camp, à environ deux coudées au-dessus du sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit venant de Yahweh » ; dans ce contexte, « vent » est toutefois plus probable, puisqu’il transporte les cailles depuis la mer.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à environ deux coudées sur la face du sol ». La proposition peut indiquer la hauteur à laquelle les cailles étaient répandues ou volaient, plutôt que l’épaisseur d’une couche d’oiseaux au sol. Deux coudées correspondent approximativement à 90 centimètres.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: un vent
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Ici, ce qui vient de Yahweh transporte des cailles depuis la mer ; « vent » convient donc le mieux au mouvement physique décrit, tout en signalant l’autre possibilité en note.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: venant de Yahweh se leva
  rationale: נָסַע exprime normalement un départ ou une mise en mouvement. Cette formulation française naturelle conserve à la fois l’origine divine du vent et son entrée en action, sans préciser davantage le mécanisme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel hébreu plutôt que de le remplacer par un titre.
- source_word: וַיָּגָז שַׂלְוִים
  choice: rabattit des cailles
  rationale: Le verbe rare גוז décrit ici l’action du vent qui amène les cailles. « Rabattit » rend cette action énergique et convient à des oiseaux poussés vers le sol.
- source_word: מִן הַיָּם
  choice: depuis la mer
  rationale: La formulation conserve l’origine géographique explicitement indiquée par l’hébreu, sans la transformer en simple indication de direction.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: les laissa retomber autour du camp
  rationale: נטשׁ peut évoquer le fait d’étendre, de laisser ou de jeter. La formulation rend le résultat de l’action du vent sans suggérer que les oiseaux tombèrent directement sur les tentes ; « autour » est éclairé par la suite du verset.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: sur une étendue d’environ une journée de marche d’un côté et d’environ une journée de marche de l’autre
  rationale: Cette traduction garde la structure répétitive et l’approximation de l’hébreu tout en explicitant qu’il s’agit de l’étendue de la zone.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: tout autour du camp
  rationale: « Tout autour » rend la valeur englobante de la forme hébraïque et précise que la répartition ne concernait pas seulement deux points isolés.
- source_word: וּכְאַמָּתַיִם
  choice: à environ deux coudées
  rationale: L’ancienne unité est conservée pour rester transparente par rapport au texte source ; « environ » rend la valeur approximative du préfixe כ.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: au-dessus du sol
  rationale: Dans ce contexte métrique, la locution littérale « sur la face du sol » peut indiquer la hauteur à laquelle les cailles se trouvaient ou volaient. La traduction principale retient cette lecture cohérente, tandis que la note préserve l’ambiguïté.
theological_decisions:
- issue: Action du vent venant de Yahweh
  choice: Le verset présente un vent venant de Yahweh comme le moyen par lequel les cailles sont amenées.
  alternative: On pourrait expliciter davantage que Yahweh envoie directement le vent et les cailles.
  rationale: L’hébreu attribue clairement à Yahweh l’origine du vent, mais ne détaille pas davantage le rapport causal. La traduction maintient ensemble l’action divine et le moyen naturel sans aller au-delà du texte.
translation_notes:
  register: Français international actuel, fluide et digne. Le rythme narratif est conservé, ainsi que la répétition spatiale du texte hébreu. Les termes techniques inutiles sont évités ; l’unité ancienne « coudée » est maintenue et brièvement expliquée en note.
