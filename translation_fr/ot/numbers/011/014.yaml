  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: fr
  text: Je ne peux pas, moi seul, porter tout ce peuple, car il est trop lourd pour moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל אָנֹכִי
  choice: Je ne peux pas, moi seul
  rationale: Reproduit l’incapacité exprimée par אוּכַל et l’insistance du pronom אָנֹכִי, tout en donnant une formulation française naturelle.
- source_word: לְבַדִּי
  choice: moi seul
  rationale: Exprime directement l’idée que Moïse est seul à assumer cette charge; la place détachée conserve l’emphase de l’hébreu.
- source_word: לָשֵׂאת
  choice: porter
  rationale: Conserve la métaphore hébraïque de la charge à porter.
- source_word: כָּבֵד מִמֶּנִּי
  choice: il est trop lourd pour moi
  rationale: Rend littéralement l’image du poids excessif et son rapport à la capacité de Moïse.
theological_decisions:
- issue: Nature de la charge de Moïse
  choice: Conserver la métaphore « porter » et « trop lourd »
  alternative: Expliciter par « prendre seul la responsabilité de » ou « cette charge est trop lourde »
  rationale: Le texte source associe explicitement le peuple à un poids; conserver cette tension imagée évite d’en réduire la portée à une simple fonction administrative.
translation_notes:
  register: Français moderne, digne et accessible. La dislocation « moi seul » maintient l’insistance inhabituelle de l’hébreu sans alourdir excessivement la phrase.
