source:
  edition: WLC
  text: וְ/הָֽ/אסַפְסֻף֙ אֲשֶׁ֣ר בְּ/קִרְבּ֔/וֹ הִתְאַוּ֖וּ תַּאֲוָ֑ה וַ/יָּשֻׁ֣בוּ וַ/יִּבְכּ֗וּ גַּ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ מִ֥י יַאֲכִלֵ֖/נוּ בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: fr
  text: 'La populace qui se trouvait au milieu d’eux fut prise d’un désir intense[a]. Les fils d’Israël, eux aussi, recommencèrent à pleurer et dirent : « Qui nous donnera de la viande à manger[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « désirèrent un désir », tournure hébraïque qui souligne l’intensité de leur envie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Qui nous nourrira de viande ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: la populace
  rationale: Ce nom collectif rare et péjoratif désigne une foule périphérique au sein du camp. « La populace » conserve la nuance dépréciative sans imposer l’idée plus précise d’un groupe ethniquement mêlé.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: qui se trouvait au milieu d’eux
  rationale: Cette formulation naturelle indique que le groupe vivait au sein du camp d’Israël, tout en évitant en français la tension de nombre de l’expression hébraïque.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: fut prise d’un désir intense
  rationale: Le verbe et le nom apparenté forment une expression intensive, littéralement « désirèrent un désir ». La traduction rend cette insistance dans un français idiomatique.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: recommencèrent à pleurer
  rationale: Dans ce contexte, שׁוב marque vraisemblablement la reprise de l’action. « Recommencèrent » exprime clairement ce renouvellement sans reproduire artificiellement l’image de retourner.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: Les fils d’Israël, eux aussi
  rationale: « Fils d’Israël » conserve la désignation filiale de l’hébreu; « eux aussi » marque que leur réaction s’ajoute à celle de la populace.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Qui nous donnera de la viande à manger ?
  rationale: Le hiphil de אכל signifie « faire manger, nourrir ». Cette tournure française rend naturellement l’idée, tandis que « viande » est le sens alimentaire de בשר ici.
theological_decisions: []
