  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: fr
  text: 'Est-ce moi qui ai conçu tout ce peuple ? Est-ce moi qui l’ai mis au monde[a], pour que tu me dises : « Porte-le contre ta poitrine, comme celui qui prend soin d’un nourrisson porte celui-ci, jusqu’au pays que tu as promis par serment à ses ancêtres » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici et dans la suite des pronoms singuliers : le peuple est représenté collectivement comme un seul enfant.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: Est-ce moi qui ai conçu
  rationale: La tournure interrogative emphatique introduit une question rhétorique. « Est-ce moi qui… ? » rend l’insistance du pronom indépendant tout en conservant naturellement la métaphore maternelle.
- source_word: כָּל הָעָם הַזֶּה
  choice: tout ce peuple
  rationale: עָם est ici un collectif singulier. Cette formulation française est naturelle et permet de maintenir ensuite l’image du peuple considéré comme un seul enfant.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: Est-ce moi qui l’ai mis au monde
  rationale: Le verbe ילד poursuit l’image de la grossesse et de l’accouchement. Le pronom singulier renvoie au collectif « peuple ».
- source_word: כִּי תֹאמַר אֵלַי
  choice: pour que tu me dises
  rationale: 'Dans la plainte rhétorique, כִּי introduit ici la conséquence implicite : Moïse n’a pas engendré le peuple pour devoir recevoir cet ordre.'
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: Porte-le contre ta poitrine
  rationale: נשא signifie porter, tandis que חֵיק désigne le sein, la poitrine ou le giron. « Contre ta poitrine » conserve l’image corporelle sans archaïsme.
- source_word: הָאֹמֵן
  choice: un père nourricier
  rationale: Le participe masculin désigne celui qui prend soin d’un enfant et l’élève. « Père nourricier » rend le genre grammatical et la fonction de soin, sans faire de cet homme une nourrice allaitante.
- source_word: הַיֹּנֵק
  choice: un enfant qui tète
  rationale: Le participe désigne précisément un enfant encore allaité. Cette formulation est claire et actuelle.
- source_word: עַל הָאֲדָמָה
  choice: jusqu’au pays
  rationale: Dans ce contexte de transport vers une destination, la préposition עַל est rendue selon le mouvement implicite. « Pays » convient à la terre promise.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: que tu as promis par serment à ses ancêtres
  rationale: La formulation française explicite idiomatiquement la valeur promissoire du serment tout en conservant la notion d’engagement juré. « Ses » maintient le renvoi au peuple collectif singulier.
theological_decisions:
- issue: Références au peuple d’Israël comme collectif singulier
  choice: Maintenir les pronoms singuliers « l’ », « le » et « ses »
  alternative: 'Employer le pluriel : « les », « leur » et « leurs »'
  rationale: L’hébreu traite עָם, « peuple », comme un collectif singulier et développe ainsi l’image d’Israël comme un seul enfant. Le français permet de conserver cette cohérence sans devenir obscur.
- issue: Identité de הָאֹמֵן
  choice: un père nourricier
  alternative: un gardien, un homme chargé de l’élever, ou une nourrice
  rationale: Le mot décrit une personne qui prend soin de l’enfant, et sa forme est masculine dans ce verset. Le choix principal préserve cette donnée sans prétendre que le terme désigne exclusivement un rôle parental précis; l’ambiguïté lexicale est signalée en note.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les deux questions rhétoriques et la métaphore maternelle sont conservées. « Contre ta poitrine » évite l’archaïsme de « dans ton sein », tandis que « père nourricier » garde la figure masculine du texte hébreu. Les guillemets français et les marqueurs de notes entre crochets sont intégrés au texte.
