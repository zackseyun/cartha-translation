  to: 'Est-ce moi qui ai conçu tout ce peuple ? Est-ce moi qui l’ai mis au monde[a], pour que tu me dises : « Porte-le contre ta poitrine, comme celui qui prend soin d’un nourrisson porte celui-ci, jusqu’au pays que tu as promis par serment à ses ancêtres » ?'
  rationale: La seule révision nécessaire remplace « père nourricier », qui surinterprète la relation entre le soignant et l’enfant, par une expression fonctionnelle qui rend le participe masculin sans lui attribuer un statut parental. La note b maintient les possibilités lexicales pertinentes. Le marqueur [b] est supprimé du texte, car la note correspondante ne peut être ancrée de manière naturelle dans la formulation révisée sans alourdir ou déformer la phrase.
