source:
  edition: WLC
  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: fr
  text: Mais maintenant, notre appétit est desséché[a] ; il n’y a absolument rien, si ce n’est la manne sous nos yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre âme est desséchée ». Le mot hébreu נֶפֶשׁ peut désigner l’âme, la vie ou, dans un contexte lié à la nourriture, l’appétit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Dans le contexte de la plainte, la conjonction jointe à l’adverbe temporel marque naturellement un contraste avec la situation évoquée auparavant.
- source_word: נַפְשֵׁנוּ
  choice: notre appétit
  rationale: נֶפֶשׁ peut désigner l’être, la vie ou l’âme, mais, dans ce contexte alimentaire, « appétit » exprime clairement le désir de nourriture sans imposer une lecture anthropologique.
- source_word: יְבֵשָׁה
  choice: se dessèche
  rationale: Le terme décrit un état de sécheresse ou de dépérissement. Le présent « se dessèche » conserve l’image vive et demeure idiomatique en français.
- source_word: אֵין כֹּל
  choice: il n’y a absolument rien
  rationale: « Absolument » rend la force emphatique de la négation associée à כֹּל.
- source_word: בִּלְתִּי אֶל
  choice: si ce n’est
  rationale: Cette tournure française exprime naturellement l’exclusion introduite par la construction hébraïque.
- source_word: הַמָּן
  choice: la manne
  rationale: L’article défini hébreu désigne la nourriture particulière et déjà connue ; « la manne » le reproduit sans ajouter le démonstratif absent du texte source.
- source_word: עֵינֵינוּ
  choice: sous nos yeux
  rationale: Cette expression française conserve l’image concrète de ce qu’ils voient continuellement devant eux.
theological_decisions:
- issue: Portée de נֶפֶשׁ dans une plainte portant sur la nourriture
  choice: Traduire « notre appétit » dans le texte et signaler « notre âme » en note
  alternative: notre âme se dessèche
  rationale: Le contexte favorise le sens alimentaire, mais la polysémie réelle de נֶפֶשׁ mérite d’être conservée dans une note plutôt que supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde l’emphase de la plainte et son image de dessèchement, sans ajouter le démonstratif « cette » devant « manne ».
