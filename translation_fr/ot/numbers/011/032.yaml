base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: fr
  text: Le peuple se leva et, pendant toute cette journée-là, toute la nuit et toute la journée du lendemain, il ramassa les cailles. Même celui qui en ramassa le moins en recueillit dix homers[a][b]. Ils les étalèrent tout autour du camp pour leur propre usage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le homer était une grande mesure de capacité pour les matières sèches. Son équivalent moderne exact est incertain ; le texte souligne que même celui qui ramassa le moins en recueillit une quantité considérable.
    reason: cultural_note
  - marker: b
    text: Ou « dix charges d’âne », si חֳמָרִים est compris d’après son association étymologique plutôt que comme le pluriel de la mesure appelée « homer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: Le peuple se leva
  rationale: Cette formulation conserve l’idiome hébreu et introduit avec vigueur l’action collective, sans réduire le verbe à un simple changement de posture.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: pendant toute cette journée-là, toute la nuit et toute la journée du lendemain
  rationale: La triple expression souligne la durée continue de la collecte. La tournure française reste naturelle tout en préservant l’insistance et le rythme de l’hébreu.
- source_word: וַיַּאַסְפוּ אֶת הַשְּׂלָו
  choice: il ramassa les cailles
  rationale: Le singulier collectif « il » reprend naturellement « le peuple » en français. « Ramasser » convient à la collecte des oiseaux tombés autour du camp.
- source_word: הַמַּמְעִיט אָסַף
  choice: Même celui qui en ramassa le moins en recueillit
  rationale: 'La formulation explicite le sens contextuel du participe et rend l’effet de contraste : la quantité indiquée représente le minimum recueilli.'
- source_word: עֲשָׂרָה חֳמָרִים
  choice: dix homers
  rationale: « Homer » est le nom conventionnel de cette grande mesure de capacité. La translittération évite une conversion moderne faussement précise, tandis qu’une note conserve l’autre compréhension possible.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: Ils les étalèrent pour eux-mêmes
  rationale: Le verbe accompagné de son infinitif apparenté insiste sur l’action d’étaler. « Pour eux-mêmes » rend לָהֶם sans préciser un procédé ou un but que le texte ne nomme pas.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: tout autour du camp
  rationale: Cette expression rend le sens spatial et distributif de סְבִיבוֹת dans un français courant.
