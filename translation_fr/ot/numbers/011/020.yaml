  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: fr
  text: 'pendant tout un mois, jusqu’à ce qu’elle vous sorte par les narines et vous devienne écœurante[a], parce que vous avez rejeté Yahweh, qui est au milieu de vous, et que vous avez pleuré devant lui en disant : « Pourquoi donc sommes-nous sortis d’Égypte ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous devienne répugnante » ou « vous inspire du dégoût ». Le mot hébreu exprime une vive répulsion.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: pendant tout un mois
  rationale: L’expression idiomatique désigne la durée d’un mois entier. Cette formulation française est naturelle et en conserve l’insistance.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: elle vous sorte par les narines
  rationale: Le contexte impose le sens concret de אַף. « Par les narines » préserve l’image corporelle forte de l’hébreu; le pronom féminin reprend la viande mentionnée dans le contexte.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: vous devienne écœurante
  rationale: Le terme rare זָרָא exprime une forte répulsion. « Écœurante » convient naturellement à la nourriture tout en gardant cette force.
- source_word: יַעַן כִּי
  choice: parce que
  rationale: La locution introduit la cause du jugement; « parce que » est son équivalent direct et courant.
- source_word: מְאַסְתֶּם
  choice: vous avez rejeté
  rationale: Le verbe signifie rejeter, avec une possible nuance de mépris. « Rejeté » exprime clairement la rupture visée sans amplifier indûment la nuance affective.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: qui est au milieu de vous
  rationale: Cette formulation désigne naturellement la présence de Yahweh au sein de la communauté et évite une lecture individualiste de « en vous ».
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: et que vous avez pleuré devant lui
  rationale: « Pleuré » rend précisément בכה, tandis que « devant lui » conserve la dimension de présence exprimée par לְפָנָיו.
- source_word: לָמָּה זֶּה
  choice: Pourquoi donc
  rationale: La particule זֶה donne ici à la question une nuance insistante ou exaspérée. « Donc » la restitue avec naturel sans introduire une idée temporelle.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: sommes-nous sortis d’Égypte
  rationale: La traduction garde le verbe concret « sortir », étroitement associé au motif de l’exode.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre et ne le remplace pas par un titre.
- issue: Portée de « au milieu de vous »
  choice: présence de Yahweh au sein du peuple
  alternative: présence intérieure en chaque individu
  rationale: Le pluriel et le contexte communautaire indiquent la présence divine parmi l’assemblée, sans affirmer ici une habitation intérieure individuelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’image crue des narines est conservée. Le verset étant un fragment syntaxique poursuivant la phrase précédente, il commence par une minuscule. Le féminin « elle » reprend la viande du contexte immédiat.
