source:
  edition: WLC
  text: וַ/יָּ֣רָץ הַ/נַּ֔עַר וַ/יַּגֵּ֥ד לְ/מֹשֶׁ֖ה וַ/יֹּאמַ֑ר אֶלְדָּ֣ד וּ/מֵידָ֔ד מִֽתְנַבְּאִ֖ים בַּֽ/מַּחֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: fr
  text: 'Un jeune homme courut prévenir Moïse[a] : « Eldad et Médad prophétisent dans le camp. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le jeune homme courut faire son rapport à Moïse et lui dit ». L’article hébreu peut être rendu par « le jeune homme », et le verbe peut aussi signifier « rapporter » ou « informer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: courut
  rationale: Le verbe רוץ désigne directement l’action de courir; le passé simple convient au récit suivi et en préserve la vivacité.
- source_word: הַנַּעַר
  choice: un jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune ou un jeune homme. Ici, il s’agit d’un messager jusque-là non identifié; l’indéfini est naturel en français, même si l’article hébreu permet aussi « le jeune homme ».
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: prévenir Moïse
  rationale: Le hiphil de נגד signifie annoncer, rapporter ou informer. « Prévenir » exprime naturellement ici le fait de porter sans délai une information à Moïse, sans préciser sa réaction.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: En français narratif, les deux-points introduisent naturellement les paroles qui suivent et évitent la tournure lourde « et lui dit », tout en conservant la fonction du verbe hébreu.
- source_word: אֶלְדָּד וּמֵידָד
  choice: Eldad et Médad
  rationale: Les noms propres sont translittérés selon l’usage français courant; l’accent de « Médad » guide la prononciation française.
- source_word: מִתְנַבְּאִים
  choice: prophétisent
  rationale: Le participe hitpael de נבא décrit une activité prophétique en cours. Le présent français dans le discours direct en rend clairement l’aspect continu.
- source_word: בַּמַּחֲנֶה
  choice: dans le camp
  rationale: Cette expression rend simplement et exactement le lieu où se déroule l’activité prophétique.
