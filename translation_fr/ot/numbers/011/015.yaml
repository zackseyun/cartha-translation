id: NUM.11.15
reference: Numbers 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: fr
  text: Si c’est ainsi que tu me traites, je t’en prie, tue-moi sur-le-champ, si j’ai trouvé grâce à tes yeux, et ne me laisse pas voir mon malheur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma détresse », « mon mal » ou « le malheur qui m’attend ». Le terme hébreu peut désigner l’adversité ou la catastrophe, et pas seulement le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם כָּכָה
  choice: Si c’est ainsi
  rationale: Introduit naturellement en français la condition et la manière, sans qu’il soit nécessaire de rendre séparément le ו initial.
- source_word: אַתְּ עֹשֶׂה לִּי
  choice: tu me traites
  rationale: Dans ce contexte, עשה avec ל exprime la manière dont Dieu agit envers Moïse. « Tu me traites » est naturel et conserve la force relationnelle de l’expression.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: je t’en prie, tue-moi sur-le-champ
  rationale: נָא marque la supplication, tandis que l’infinitif absolu joint à l’impératif intensifie la demande. « Sur-le-champ » en exprime l’insistance dans un français courant et digne.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: si j’ai trouvé grâce à tes yeux
  rationale: Conserve l’image de l’idiome hébreu tout en employant sa formulation française traditionnelle et intelligible.
- source_word: וְאַל אֶרְאֶה
  choice: et ne me laisse pas voir
  rationale: Rend la demande négative adressée à Dieu de manière idiomatique.
- source_word: בְּרָעָתִי
  choice: mon malheur
  rationale: רָעָה peut désigner le malheur, l’adversité ou la catastrophe, et non uniquement le mal moral. Ici, « mon malheur » convient à la détresse personnelle de Moïse tout en préservant une certaine ampleur sémantique.
theological_decisions:
- issue: Sens de בְּרָעָתִי dans la supplication de Moïse
  choice: son malheur ou l’adversité qui l’accable, plutôt que son mal moral
  alternative: mon mal, ma détresse, ma catastrophe
  rationale: Le contexte présente Moïse accablé par le poids du peuple, sans faire de cette phrase une confession explicite de faute morale. « Mon malheur » respecte ce contexte sans éliminer l’idée plus large d’adversité.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse singulière de Moïse à Dieu. La supplication conserve son intensité sans devenir familière.
