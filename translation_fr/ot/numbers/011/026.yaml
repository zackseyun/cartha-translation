  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: fr
  text: Cependant, deux hommes étaient restés dans le camp. L’un s’appelait Eldad, et le second Médad. L’Esprit reposa sur eux. Ils figuraient parmi les inscrits[a], mais ne s’étaient pas rendus à la tente[b], et ils prophétisèrent dans le camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils étaient parmi ceux dont le nom avait été consigné ». L’hébreu dit littéralement qu’ils étaient parmi les « écrits » ou les « consignés ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit vraisemblablement, dans le contexte de cet épisode, de la tente de la rencontre.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: étaient restés
  rationale: Le verbe שׁאר exprime ici le fait de rester ou d’être laissé sur place. Le plus-que-parfait situe naturellement cette situation avant la venue de l’Esprit, sans préciser pourquoi ces hommes étaient restés.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: deux hommes
  rationale: אֲנָשִׁים désigne explicitement ici deux hommes; cette traduction est précise et courante.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: L’un s’appelait Eldad, et le second Médad
  rationale: Cette formulation française naturelle conserve la distinction hébraïque entre « l’un » et « le second » sans reproduire lourdement la formule nominale.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: L’Esprit reposa sur eux
  rationale: Le contexte immédiat identifie רוּחַ comme l’Esprit qui accorde la capacité prophétique; נוח indique qu’il repose ou vient se poser sur eux.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: Ils figuraient parmi les inscrits
  rationale: כְּתֻבִים signifie littéralement les personnes « écrites » ou « consignées ». « Parmi les inscrits » exprime leur présence sur la liste tout en conservant l’idée du texte source.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: mais ne s’étaient pas rendus à la tente
  rationale: La terminaison directive de אֹהֱלָה marque un mouvement vers la tente. « Se rendre à » est naturel en français; le plus-que-parfait rend l’antériorité dans le récit.
- source_word: וַיִּתְנַבְּאוּ
  choice: ils prophétisèrent
  rationale: La forme de נבא désigne ici l’activité prophétique. Le passé simple convient au registre narratif et n’ajoute pas une nuance de commencement absente de la forme.
theological_decisions:
- issue: Majuscule ou minuscule pour הָרוּחַ
  choice: l’Esprit
  alternative: l’esprit
  rationale: Dans le contexte, il s’agit de l’Esprit divin qui reposait sur Moïse et qui donne aux anciens de prophétiser. La majuscule signale ce référent sans développer une doctrine supplémentaire.
- issue: Identification de הָאֹהֱלָה
  choice: la tente
  alternative: la tente de la rencontre
  rationale: Le contexte désigne très probablement la tente de la rencontre, mais ce verset dit seulement « la tente ». Le texte principal conserve cette formulation et la note donne l’identification contextuelle.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, avec le passé simple pour l’action principale et le plus-que-parfait pour les circonstances antérieures. Les noms Eldad et Médad suivent leur forme française biblique courante.
