  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי שָׁם֙ קָֽבְר֔וּ אֶת הָ/עָ֖ם הַ/מִּתְאַוִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: fr
  text: On donna donc à ce lieu le nom de Kibroth-Hattaava[a], parce que c’est là qu’on enterra ceux du peuple qui s’étaient livrés à la convoitise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibroth-Hattaava signifie probablement « Tombes de la convoitise » ou « Tombes du désir avide ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: On donna donc à ce lieu le nom de
  rationale: La tournure française naturelle rend la formule hébraïque de dénomination sans préciser qui nomma le lieu, le sujet du verbe hébreu n’étant pas explicite dans ce verset.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: Kibroth-Hattaava
  rationale: Le nom du lieu est translittéré dans le texte; son sens probable est indiqué en note.
- source_word: כִּי שָׁם
  choice: parce que c’est là
  rationale: Cette formulation exprime clairement le lien explicatif et conserve l’adverbe de lieu.
- source_word: קָבְרוּ אֶת הָעָם
  choice: qu’on enterra ceux du peuple
  rationale: Le sujet indéfini du pluriel hébreu se rend naturellement par « on »; « ceux du peuple » évite de laisser entendre que tout le peuple fut enterré.
- source_word: הַמִּתְאַוִּים
  choice: qui s’étaient abandonnés à leurs désirs
  rationale: Le participe hitpael désigne ceux qui se livraient à une convoitise insistante. Cette expression restitue cette nuance sans donner au terme une portée exclusivement sexuelle.
theological_decisions:
- issue: Portée de הָעָם הַמִּתְאַוִּים
  choice: ceux du peuple qui s’étaient abandonnés à leurs désirs
  alternative: le peuple qui avait été saisi de convoitise
  rationale: Le choix désigne le groupe coupable au sein du peuple sans affirmer que la totalité d’Israël fut enterrée, tout en conservant le lien explicite avec le peuple.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation de dénomination est idiomatique; le toponyme est translittéré et son jeu de sens avec « enterra » et « désirs » est expliqué en note.
