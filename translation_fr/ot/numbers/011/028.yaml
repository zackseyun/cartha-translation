  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: fr
  text: 'Alors Josué, fils de Noun, qui était au service de Moïse depuis sa jeunesse[a], prit la parole et dit : « Moïse, mon seigneur, arrête-les[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi ses jeunes hommes », ou peut-être « parmi ses hommes choisis ». L’expression hébraïque est concise et quelque peu ambiguë.
    reason: lexical_alternative
  - marker: b
    text: Ou « retiens-les » ou « interdis-le-leur ». Le verbe hébreu peut exprimer l’idée de retenir, d’empêcher ou d’interdire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: prit la parole et dit
  rationale: Cette tournure française naturelle rend la formule narrative hébraïque littéralement redondante « répondit et dit », sans supposer nécessairement qu’une question explicite ait été posée.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Les noms suivent leur forme française biblique usuelle.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: qui servait Moïse
  rationale: Le participe désigne ici le service personnel d’un assistant. La proposition relative est plus naturelle en français que « serviteur de Moïse » et n’évoque pas indûment l’esclavage.
- source_word: מִבְּחֻרָיו
  choice: depuis sa jeunesse
  rationale: Dans ce contexte, la locution peut indiquer que Josué servait Moïse depuis sa jeunesse. La forme hébraïque compacte permet aussi de comprendre « parmi ses jeunes hommes » ou « parmi ses hommes choisis » ; cette ambiguïté est signalée en note.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: Moïse, mon seigneur
  rationale: L’expression marque le respect envers un supérieur humain. L’ordre des mots retenu est idiomatique en français tout en conservant le titre déférent.
- source_word: כְּלָאֵם
  choice: arrête-les
  rationale: L’impératif peut signifier retenir, empêcher ou interdire. « Arrête-les » garde un objet personnel et reste assez large pour ne pas préciser abusivement le moyen employé.
