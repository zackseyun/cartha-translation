  to: Alors Yahweh descendit dans la nuée et lui parla. Il prit une part de l’Esprit qui était sur lui et la mit sur les soixante-dix anciens. Lorsque l’Esprit reposa sur eux, ils prophétisèrent, mais ils ne continuèrent pas[a].
  rationale: 'Deux ajustements limités améliorent la fidélité au texte source : « lorsque » évite l’idée non exprimée d’une immédiateté, et « une part de l’Esprit » explicite le partitif hébreu. La traduction principale et la note continuent de préserver l’ambiguïté de la dernière proposition.'
