  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: fr
  text: Alors Yahweh descendit dans la nuée et lui parla. Il prit une part de l’Esprit qui était sur lui et la mit sur les soixante-dix anciens. Lorsque l’Esprit reposa sur eux, ils prophétisèrent, mais ils ne continuèrent pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne cessèrent pas ». L’expression hébraïque est concise et peut être comprise de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe exprime un mouvement vers le bas. « Descendit » conserve sobrement le langage théophanique du texte.
- source_word: בֶּעָנָן
  choice: dans la nuée
  rationale: L’article hébreu renvoie vraisemblablement à la nuée déjà connue dans le récit du désert. « Nuée » garde le registre biblique tout en restant intelligible.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: lui parla
  rationale: Formulation française naturelle qui conserve le pronom hébreu, dont l’antécédent est Moïse dans le contexte.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: Il prit de l’Esprit qui était sur lui
  rationale: Le verbe rare אצל évoque ici un prélèvement ou une distribution. Cette formulation évite d’expliciter davantage que l’hébreu la manière dont l’Esprit est communiqué.
- source_word: רוּחַ
  choice: Esprit
  rationale: Le contexte présente une puissance divine reposant sur Moïse puis sur les anciens et produisant une activité prophétique. La majuscule signale ce référent divin.
- source_word: וַיִּתֵּן עַל
  choice: le mit sur
  rationale: Cette expression conserve l’image spatiale de l’hébreu, reprise ensuite lorsque l’Esprit repose sur les anciens.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: les soixante-dix anciens
  rationale: Cette formulation française naturelle identifie les soixante-dix hommes comme les anciens sans imposer une apposition lourde.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: Dès que l’Esprit reposa sur eux
  rationale: Le verbe נוח avec על décrit l’Esprit qui vient reposer sur eux. « Dès que » rend ici la relation temporelle du préfixe כְּ.
- source_word: וַיִּתְנַבְּאוּ
  choice: ils prophétisèrent
  rationale: Le verbe désigne leur activité prophétique et se rend clairement par le verbe français usuel.
- source_word: וְלֹא יָסָפוּ
  choice: mais ils ne continuèrent pas
  rationale: Dans le contexte, l’expression peut indiquer que leur activité prophétique ne se poursuivit pas. Sa brièveté et son ambiguïté réelles sont signalées par une note.
theological_decisions:
- issue: Référent de רוּחַ
  choice: l’Esprit divin, avec une majuscule
  alternative: l’esprit, avec une minuscule
  rationale: Le lien avec la présence qui était sur Moïse et l’effet prophétique sur les anciens favorisent le sens d’Esprit divin, tout en reconnaissant que la majuscule est une convention interprétative française.
- issue: Sens de וְלֹא יָסָפוּ
  choice: leur activité prophétique ne continua pas
  alternative: ils ne cessèrent pas
  rationale: La tournure hébraïque est concise et a reçu ces deux interprétations. Le texte principal adopte le sens contextuel courant, tandis que la note préserve l’autre lecture sans effacer la tension.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit. « Nuée » conserve la portée théophanique du passage sans alourdir la phrase.
