  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: fr
  text: Quand la rosée descendait sur le camp pendant la nuit[a], la manne descendait sur le camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et lorsque la rosée descendait sur le camp pendant la nuit, la manne descendait sur le camp. » L’hébreu emploie le même verbe (« descendre ») pour la rosée et pour la manne, ce qui souligne le parallèle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: Quand … descendait
  rationale: La conjonction et la préposition jointes à l’infinitif construit de ירד introduisent ici une proposition temporelle. « Quand … descendait » est naturel en français et, avec l’imparfait, exprime l’action habituelle dans ce contexte narratif.
- source_word: הַטַּל
  choice: la rosée
  rationale: Équivalent direct du nom défini, dans un français courant.
- source_word: עַל הַמַּחֲנֶה
  choice: sur le camp
  rationale: עַל signifie naturellement « sur » ici et décrit la rosée qui se dépose sur le camp.
- source_word: לָיְלָה
  choice: pendant la nuit
  rationale: Le nom est employé comme complément circonstanciel de temps. « Pendant la nuit » convient au caractère répétitif de la scène et reste naturel.
- source_word: יֵרֵד
  choice: descendait
  rationale: L’imparfait hébreu décrit une action coutumière dans le passé. L’imparfait français en rend clairement la valeur et conserve le même verbe que pour la rosée.
- source_word: הַמָּן
  choice: la manne
  rationale: Terme français traditionnel et courant pour cette nourriture déjà connue dans le récit; l’article défini est conservé.
- source_word: עָלָיו
  choice: sur lui
  rationale: Le pronom masculin singulier renvoie le plus naturellement au camp. « Sur lui » préserve le pronom hébreu sans préciser davantage le rapport éventuel entre la manne et la rosée.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « descendait » reproduit délibérément le parallélisme lexical de l’hébreu; le pronom « lui » maintient la référence grammaticale au camp sans expliciter une relation que le texte laisse implicite.
