source:
  edition: WLC
  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: fr
  text: 'Vous désignerez pour vous des villes : elles seront pour vous des villes de refuge, et celui qui aura tué une personne involontairement s’y enfuira.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: vous choisirez
  rationale: Le hiphil de קרה désigne ici l’action de sélectionner ou d’affecter certaines villes à une fonction précise. « Choisirez » est naturel en français et convient au cadre juridique.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: des villes ... villes de refuge
  rationale: La répétition de « villes » est conservée, comme en hébreu, pour la clarté juridique. « Villes de refuge » rend précisément l’institution désignée.
- source_word: מִקְלָט
  choice: refuge
  rationale: Dans ce contexte, le mot désigne un lieu protégé où l’auteur d’un homicide involontaire peut échapper au vengeur du sang.
- source_word: וְנָס שָׁמָּה
  choice: pourra s’y enfuir
  rationale: Dans la suite juridique, la forme exprime l’usage rendu possible par la désignation de ces villes. « Pourra » restitue naturellement cette fonction sans imposer une obligation absente du contexte immédiat.
- source_word: רֹצֵחַ
  choice: celui qui aura tué
  rationale: Le français « meurtrier » impliquerait généralement une intention criminelle, exclue ici par בִּשְׁגָגָה. Une périphrase neutre évite cette implication.
- source_word: מַכֵּה נֶפֶשׁ
  choice: qui aura tué quelqu’un
  rationale: L’expression signifie littéralement « frappant une personne », mais elle désigne ici un coup mortel. « Tuer quelqu’un » communique directement le résultat juridique en français actuel.
- source_word: נֶפֶשׁ
  choice: quelqu’un
  rationale: נֶפֶשׁ désigne ici une personne humaine, non l’âme en tant que composante immatérielle.
- source_word: בִּשְׁגָגָה
  choice: involontairement
  rationale: Le terme indique l’absence d’intention et fonde la distinction juridique avec l’homicide délibéré.
theological_decisions:
- issue: Qualification juridique de l’auteur de l’homicide
  choice: « Celui qui aura tué quelqu’un involontairement »
  alternative: « le meurtrier » ou « l’auteur de l’homicide »
  rationale: « Meurtrier » suggère en français un homicide volontaire, tandis que le texte précise l’absence d’intention. La formulation retenue préserve la distinction légale sans ajouter de jugement moral.
- issue: Valeur de וְנָס dans la disposition légale
  choice: « pourra s’y enfuir »
  alternative: « s’y enfuira » ou « devra s’y enfuir »
  rationale: Le contexte présente les villes comme accessibles à l’auteur d’un homicide involontaire. Le français modal exprime clairement cette possibilité institutionnelle sans transformer le texte en ordre explicite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste lisible, la répétition de « villes » est conservée, et les termes susceptibles d’impliquer à tort un meurtre intentionnel sont évités.
