  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: fr
  text: Ou s’il le frappe avec une pierre tenue à la main[a], susceptible de causer la mort, et qu’il meure, c’est un meurtrier ; le meurtrier sera mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec une pierre de main », c’est-à-dire une pierre tenue à la main ou maniable comme arme.'
    reason: Préciser l’expression hébraïque concise et inhabituelle sans surdéterminer son sens.
lexical_decisions:
- source_word: וְאִם
  choice: Ou s’il
  rationale: Introduit un autre cas dans la série juridique ; « Ou » rend naturellement cette progression casuistique.
- source_word: בְּאֶבֶן יָד
  choice: avec une pierre tenue à la main
  rationale: La construction signifie littéralement « pierre de main » et désigne une pierre tenue ou maniable comme arme, sans préciser davantage sa forme.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: assez lourde pour causer la mort
  rationale: Le relatif décrit la capacité létale de la pierre. Cette formulation française idiomatique exprime qu’il s’agit d’une pierre susceptible de tuer dans ce contexte.
- source_word: הִכָּהוּ
  choice: il le frappe
  rationale: נכה signifie ici frapper ; le présent convient au style législatif français et n’anticipe pas le décès énoncé ensuite.
- source_word: וַיָּמֹת
  choice: et qu’il meure
  rationale: Conserve la succession explicite entre le coup et la mort, dans une syntaxe française naturelle dépendant de « s’il ».
- source_word: רֹצֵחַ הוּא
  choice: c’est un meurtrier
  rationale: Dans ce cadre juridique, רצח qualifie un homicide coupable et non un simple acte de tuer.
- source_word: מוֹת יוּמַת
  choice: sera mis à mort
  rationale: La construction emphatique impose fermement la peine capitale. En français juridique et biblique, le futur exprime ici l’obligation, sans ajout de l’adverbe moins naturel « sûrement ».
- source_word: הָרֹצֵחַ
  choice: le meurtrier
  rationale: Maintient la répétition judiciaire du substantif hébreu au lieu de la remplacer par un pronom.
theological_decisions:
- issue: Qualification juridique de l’auteur de l’homicide dans la législation sur les villes de refuge
  choice: meurtrier
  alternative: homicide / celui qui a tué
  rationale: Le contexte distingue l’homicide coupable de la mort accidentelle. « Meurtrier » conserve le jugement juridique et moral du texte sans importer une doctrine ultérieure.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe législative naturelle. La répétition de « meurtrier » et la formulation solennelle de la peine sont conservées.
