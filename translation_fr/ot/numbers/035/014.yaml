source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: fr
  text: Vous désignerez[a] trois de ces villes au-delà du Jourdain[b], et vous désignerez trois de ces villes dans le pays de Canaan. Ce seront des villes de refuge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnerez »; le verbe hébreu signifie ici affecter ou réserver ces villes à cet usage.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de l’autre côté du Jourdain »; l’expression hébraïque ne fixe pas explicitement le point de vue géographique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: vous désignerez
  rationale: Le verbe נתן signifie littéralement « donner », mais, dans ce contexte juridique, il s’agit d’affecter des villes à une fonction précise. « Désigner » exprime clairement ce sens administratif en français courant.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: au-delà du Jourdain
  rationale: Cette formulation concise conserve le caractère relationnel de l’expression hébraïque sans préciser plus que le texte le point de vue géographique.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: dans le pays de Canaan
  rationale: Le rendu conserve le nom אֶרֶץ, « pays », et l’accent territorial de l’expression.
- source_word: עָרֵי מִקְלָט
  choice: villes de refuge
  rationale: Expression française établie et fidèle pour les villes destinées à protéger l’auteur d’un homicide involontaire; elle évite les connotations politiques modernes de « villes d’asile ».
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: trois de ces villes… trois de ces villes
  rationale: Le nom défini renvoie aux villes déjà évoquées. « De ces villes » rend naturellement en français cette référence à un ensemble déterminé.
- source_word: תִּהְיֶינָה
  choice: ce seront
  rationale: Le futur rend le statut assigné aux six villes et conserve la formulation juridique de l’hébreu.
