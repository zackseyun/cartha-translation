id: NUM.35.1
reference: Numbers 35:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse dans les plaines de Moab, près du Jourdain, à la hauteur de Jéricho. Il dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol introduit un nouvel acte de parole dans le récit. « Parla » rend naturellement la formule sans se confondre avec לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: Formulation française directe et naturelle pour le destinataire de la parole.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: עֲרָבוֹת désigne ici la région de plaines ou de steppes; « plaines de Moab » est exact, clair et géographiquement établi.
- source_word: עַל־יַרְדֵּן יְרֵחוֹ
  choice: près du Jourdain, à la hauteur de Jéricho
  rationale: Dans cette indication géographique, עַל exprime la proximité. Le nom Jéricho précise le secteur du Jourdain correspondant à la ville, probablement sur la rive opposée; « à la hauteur de » évite de faire croire que les plaines de Moab se trouvaient dans Jéricho même.
- source_word: לֵאמֹר
  choice: 'Il dit :'
  rationale: L'infinitif introduit le contenu du discours. Une nouvelle proposition avec deux-points est plus naturelle en français que le calque « en disant », tout en conservant sa fonction introductive.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre et n'importe pas le remplacement liturgique par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe hébraïque de la formule de discours est légèrement restructurée en deux phrases pour produire une lecture naturelle et introduire clairement les paroles qui suivent.
