  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: fr
  text: Mais s’il l’a poussé brusquement, sans hostilité, ou s’il a jeté sur lui un objet quelconque sans être à l’affût,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit, par contraste avec les cas précédents, une situation conditionnelle différente.
- source_word: בְּפֶתַע
  choice: brusquement
  rationale: Exprime le caractère soudain du geste; placé près de « poussé », le terme reste naturel en français.
- source_word: בְּלֹא אֵיבָה
  choice: sans hostilité
  rationale: אֵיבָה désigne une inimitié ou une animosité personnelle; « hostilité » est clair et actuel.
- source_word: הֲדָפוֹ
  choice: l’a poussé
  rationale: Rend directement le verbe désignant l’action de pousser ou de bousculer quelqu’un.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: a jeté sur lui
  rationale: Préserve la construction hébraïque indiquant qu’un objet est jeté sur ou contre la personne.
- source_word: כָּל כְּלִי
  choice: un objet quelconque
  rationale: כְּלִי est ici un terme large pour un objet, article ou instrument; cette formulation évite de le restreindre à un type précis.
- source_word: בְּלֹא צְדִיָּה
  choice: sans lui tendre de piège
  rationale: צְדִיָּה évoque concrètement le fait de guetter ou de se tenir en embuscade; cette formulation française conserve cette image sans imposer la catégorie juridique plus large de préméditation.
