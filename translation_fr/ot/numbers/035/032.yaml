reference: Numbers 35:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: fr
  text: Vous n’accepterez pas de rançon[a] pour celui qui s’est enfui vers sa ville de refuge[b], afin qu’il revienne habiter dans le pays avant la mort du prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « indemnité » ou « paiement compensatoire » ; le mot hébreu désigne une somme versée comme prix de rachat ou en compensation.
    reason: lexical_alternative
  - marker: b
    text: La syntaxe hébraïque est condensée. Elle peut aussi être comprise comme interdisant un paiement lié à la fuite vers la ville de refuge, au maintien dans celle-ci ou au retour depuis celle-ci avant la mort du prêtre.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: rançon
  rationale: Le terme désigne le prix versé pour racheter une personne ou se substituer à la conséquence juridique requise. « Rançon » conserve cette valeur légale sans la connotation interprétative de « pot-de-vin ».
- source_word: לָנוּס
  choice: pour celui qui s’est enfui
  rationale: L’infinitif de נוּס exprime la fuite. Dans le contexte de la ville de refuge, le français idiomatique emploie une proposition relative au passé, tout en laissant la note signaler la construction hébraïque compacte.
- source_word: עִיר מִקְלָטוֹ
  choice: sa ville de refuge
  rationale: Expression juridique consacrée et naturelle en français pour la ville d’asile assignée à l’auteur involontaire d’un homicide.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: afin qu’il revienne habiter dans le pays
  rationale: Les deux infinitifs expriment le retour suivi d’une nouvelle installation. « Revenir habiter » rend clairement leur relation en français moderne.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: avant la mort du prêtre
  rationale: Dans cette interdiction, עַד fixe le terme avant lequel le retour ne peut être obtenu. « Avant » évite l’ambiguïté que pourrait produire ici « jusqu’à » en français.
theological_decisions:
- issue: Portée juridique de l’interdiction relative au retour de l’auteur involontaire d’un homicide
  choice: Le paiement ne peut être accepté pour permettre à celui qui a fui vers sa ville de refuge de revenir habiter dans le pays avant la mort du prêtre.
  alternative: Le texte interdirait plus précisément un paiement lié soit à la fuite vers la ville de refuge, soit au maintien dans cette ville ou au retour depuis celle-ci.
  rationale: La syntaxe hébraïque est condensée. Le texte principal donne une lecture française cohérente avec le dispositif juridique du contexte, tandis que la note préserve les autres rapports syntaxiques possibles sans les éliminer.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative (« Vous n’accepterez pas ») convient au registre législatif du passage. « Prêtre » conserve le terme générique du texte hébreu, sans préciser ici « grand prêtre », précision fournie par le contexte plus large.
