source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: fr
  text: Vous ne souillerez pas le pays où vous habitez, au milieu duquel j’habite, car moi, Yahweh, j’habite au milieu des fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « parmi les Israélites » ou « parmi les enfants d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְטַמֵּא
  choice: rendre impur
  rationale: Le piel de טמא signifie rendre impur ou souiller. « Rendre impur » conserve ici la portée rituelle et morale du terme sans suggérer principalement une pollution environnementale.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire où Israël habite, et non la terre entière. « Pays » est naturel en français et maintient le cadre géographique de l’alliance.
- source_word: יֹשְׁבִים בָּהּ
  choice: où vous habitez
  rationale: Le participe de ישב exprime une résidence durable. Cette tournure française est naturelle tout en restant proche du sens hébreu.
- source_word: שֹׁכֵן
  choice: j’habite
  rationale: שכן exprime la présence permanente de Dieu au sein de son peuple. « Habiter » préserve la répétition lexicale avec l’habitation d’Israël sans introduire le terme technique « demeurer dans le tabernacle ».
- source_word: בְּתוֹכָהּ
  choice: au milieu duquel
  rationale: תוך marque une présence à l’intérieur ou au milieu. Le relatif reprend grammaticalement « le pays » et conserve le parallélisme spatial du verset.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit le motif de l’interdiction; « car » rend clairement cette valeur explicative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin exprimé par le tétragramme plutôt que de lui substituer un titre.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: au milieu des fils d’Israël
  rationale: Cette formulation conserve à la fois le sens spatial de בְּתוֹךְ et l’expression masculine littérale בְּנֵי יִשְׂרָאֵל. Une formulation française plus idiomatique figure en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. « Yahweh » le conserve comme nom propre et évite de le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal préserve la forme masculine de l’expression hébraïque sans exclure la portée collective visant le peuple d’Israël; la note donne l’équivalent collectif idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. La triple répétition du champ lexical de l’habitation est maintenue, ainsi que le parallélisme « au milieu duquel / au milieu des fils d’Israël ».
