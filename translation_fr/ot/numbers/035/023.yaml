  text: א֣וֹ בְ/כָל אֶ֜בֶן אֲשֶׁר יָמ֥וּת בָּ/הּ֙ בְּ/לֹ֣א רְא֔וֹת וַ/יַּפֵּ֥ל עָלָ֖י/ו וַ/יָּמֹ֑ת וְ/הוּא֙ לֹא אוֹיֵ֣ב ל֔/וֹ וְ/לֹ֥א מְבַקֵּ֖שׁ רָעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: fr
  text: ou si, sans voir[a], il fait tomber sur quelqu’un une pierre quelconque pouvant causer la mort, et que celui-ci en meurt, alors qu’il n’était pas son ennemi et ne cherchait pas à lui faire du mal —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans voir ». L’expression indique un manque de conscience ou d’attention, sans nécessairement exclure toute vision physique.'
    reason: clarification_lexicale
lexical_decisions:
- source_word: אוֹ
  choice: ou si
  rationale: Introduit une nouvelle possibilité dans la série de cas juridiques; « si » rend naturelle en français la construction conditionnelle poursuivie par le contexte.
- source_word: בְכָל אֶבֶן אֲשֶׁר יָמוּת בָּהּ
  choice: une pierre quelconque pouvant causer la mort
  rationale: Rend la portée générale de כָל et la capacité mortelle exprimée par la relative, dans un français juridique clair et naturel.
- source_word: בְּלֹא רְאוֹת
  choice: sans voir
  rationale: Conserve l’expression concrète et l’ambiguïté de l’hébreu plutôt que de la remplacer directement par « involontairement » ou « sans s’en rendre compte ».
- source_word: וַיַּפֵּל עָלָיו
  choice: il laisse tomber sur quelqu’un
  rationale: Le hiphil de נפל est causatif. « Laisse tomber » maintient l’action du sujet sans suggérer à tort une intention malveillante.
- source_word: וַיָּמֹת
  choice: et que celui-ci meure
  rationale: Exprime la conséquence mortelle et distingue clairement la victime du sujet qui a laissé tomber la pierre.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: alors qu’il n’était pas son ennemi
  rationale: La tournure concessive explicite naturellement la circonstance disculpatoire sans modifier le contenu juridique.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: et ne cherchait pas à lui faire du mal
  rationale: רָעָה désigne ici le tort ou le mal infligé à autrui; cette formulation française exprime clairement l’absence d’intention nuisible.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste celle d’un cas juridique lié aux versets voisins. L’expression « sans voir » est volontairement conservée afin de ne pas réduire l’ambiguïté de l’hébreu à la seule notion d’accident.
