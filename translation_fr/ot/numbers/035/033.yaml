  to: Vous ne souillerez pas le pays où vous habitez, car le sang souille le pays, et aucune expiation ne peut être faite pour le pays à cause du sang qui y a été versé, si ce n’est par le sang de celui qui l’a versé.
  rationale: 'Révision limitée au verbe répété : « souiller » rend plus fidèlement la contamination morale du pays exprimée par חנף et constitue une collocation française naturelle avec le sang versé. Le reste de la formulation conserve les relations syntaxiques de l''hébreu, notamment l''expiation du pays relativement au sang versé et l''exception exclusive finale.'
