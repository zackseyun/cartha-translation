  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: fr
  text: Vous ne souillerez pas le pays où vous habitez, car le sang souille le pays, et aucune expiation ne peut être faite pour le pays à cause du sang qui y a été versé, si ce n’est par le sang de celui qui l’a versé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, hifil)
  choice: profanerez / profane
  rationale: Dans ce contexte, le verbe désigne la souillure morale et sacrée du pays causée par le sang versé. « Profaner » garde cette dimension et permet de reproduire le même verbe hébreu dans les deux propositions.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le terme désigne ici le territoire où demeure Israël, plutôt que la terre entière. « Le pays » est naturel en français et conserve cette portée territoriale.
- source_word: כִּי הַדָּם הוּא
  choice: car le sang
  rationale: Le pronom הוּא met le sang en relief, mais le français exprime suffisamment cette focalisation par la tournure « car le sang profane le pays » sans ajout interprétatif tel que « lui-même ».
- source_word: יְכֻפַּר
  choice: aucune expiation ne peut être faite
  rationale: Le passif de כפר évoque ici l’enlèvement de la culpabilité liée au sang qui pèse sur le pays. « Expiation » conserve la portée cultuelle et morale du terme tout en restant compréhensible.
- source_word: לַדָּם אֲשֶׁר שֻׁפַּךְ בָּהּ
  choice: à cause du sang qui y a été versé
  rationale: La préposition ל marque ici le rapport entre l’expiation du pays et le sang versé. « À cause de » rend clairement le lien causal sans modifier l’entité concernée par l’expiation.
- source_word: כִּי אִם
  choice: si ce n’est
  rationale: Cette locution introduit le seul moyen admis; « si ce n’est » en conserve la force exclusive dans un registre digne et naturel.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: par le sang de celui qui l’a versé
  rationale: La formule désigne le sang de l’auteur de l’homicide. Cette traduction demeure proche de l’hébreu et évite l’expression française maladroite « celui qui verse le sang » dans ce contexte rétrospectif.
theological_decisions:
- issue: Nature de la profanation du pays par le sang versé
  choice: Le texte présente le sang versé comme causant une souillure morale et sacrée réelle du pays, qui exige une expiation.
  alternative: Comprendre cette formulation comme une simple métaphore du désordre social ou comme une règle exclusivement civile.
  rationale: La répétition de חנף et l’emploi de כפר associent explicitement le sang, le pays et l’expiation. La traduction préserve cette dimension sans lui imposer de catégories doctrinales ultérieures.
- issue: Moyen exclusif d’expiation dans ce cadre juridique
  choice: L’expiation du pays pour ce sang n’est possible que par le sang de celui qui l’a versé.
  alternative: Généraliser l’énoncé en principe universel sur toute forme de pardon ou d’expiation.
  rationale: כִּי אִם exprime une restriction forte, mais le contexte immédiat concerne le meurtrier et la culpabilité du sang pesant sur le pays. La formulation conserve cette tension et cette délimitation contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Profaner » a été retenu plutôt que « polluer » afin d’éviter une lecture seulement environnementale et de préserver la force morale et sacrée du verbe hébreu. La répétition française reproduit délibérément celle de l’original.
