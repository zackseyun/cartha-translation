source:
  edition: WLC
  text: וְ/הָי֧וּ הֶֽ/עָרִ֛ים לָ/הֶ֖ם לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֗ם יִהְי֤וּ לִ/בְהֶמְתָּ/ם֙ וְ/לִ/רְכֻשָׁ֔/ם וּ/לְ/כֹ֖ל חַיָּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: fr
  text: Ces villes leur serviront d’habitation, et les terrains qui les entourent[a] seront destinés à leur bétail, à leurs biens[b] et à tous leurs animaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs pâturages », « leurs espaces communs » ou « leurs terrains libres ». Le terme hébreu désigne les espaces ouverts autour des villes, ici notamment destinés au pâturage.
    reason: lexical_alternative
  - marker: b
    text: Ou « à leurs possessions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: ces villes
  rationale: עִיר désigne une ville ou une localité. « Villes » convient au contexte légal de l’attribution et reprend naturellement le démonstratif implicite du contexte.
- source_word: לָשָׁבֶת
  choice: leur serviront d’habitation
  rationale: 'L’infinitif de ישׁב exprime ici la destination des villes : elles sont données aux Lévites pour qu’ils y habitent. Cette formulation est naturelle en français moderne et conserve le sens de but.'
- source_word: מִגְרְשֵׁיהֶם
  choice: les terrains qui les entourent
  rationale: מִגְרָשׁ désigne l’espace ouvert attenant à une ville, notamment utilisable pour le pâturage. Cette traduction conserve la dimension spatiale du terme sans le réduire exclusivement à sa fonction pastorale.
- source_word: לִבְהֶמְתָּם
  choice: à leur bétail
  rationale: בְּהֵמָה désigne collectivement les animaux domestiques. « Bétail » est le terme français courant qui convient à ce contexte d’usage des terres.
- source_word: לִרְכֻשָׁם
  choice: à leurs biens
  rationale: רְכוּשׁ désigne les biens ou possessions. « Biens » rend avec concision la portée patrimoniale du terme, sans préciser indûment leur nature.
- source_word: וּלְכֹל חַיָּתָם
  choice: et à tous leurs animaux
  rationale: חַיָּה peut désigner un être vivant ou un animal. Dans cette énumération, « animaux » est clair et permet de conserver l’élargissement au-delà du seul bétail.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure juridique du verset tout en évitant les archaïsmes. La distinction potentiellement surprenante entre le bétail, les biens et l’ensemble des animaux est maintenue conformément au texte hébreu.
