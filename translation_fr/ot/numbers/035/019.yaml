source:
  edition: WLC
  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: fr
  text: C’est le vengeur du sang lui-même qui mettra à mort le meurtrier ; lorsqu’il le rencontrera, c’est lui qui le mettra à mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: Dans ce cadre juridique, l’expression désigne le membre de la famille chargé de venger le sang versé. « Vengeur du sang » conserve le terme juridique hébreu sans lui donner le sens plus général de « rédempteur ».
- source_word: הוּא
  choice: lui-même / c’est lui
  rationale: Le pronom indépendant est emphatique. Les deux formulations françaises soulignent que cet agent accomplit personnellement l’acte.
- source_word: יָמִית
  choice: mettra à mort
  rationale: Le hiphil de מות est causatif. « Mettre à mort » convient au contexte légal et restitue mieux cette nuance que le simple verbe « tuer ».
- source_word: הָרֹצֵחַ
  choice: le meurtrier
  rationale: Dans le contexte immédiat, il s’agit de l’auteur d’un homicide reconnu passible de mort, par contraste avec l’homicide involontaire traité dans le chapitre.
- source_word: בְּפִגְעוֹ בוֹ
  choice: lorsqu’il le rencontrera
  rationale: La construction exprime ici le fait de rencontrer quelqu’un ou de tomber sur lui. Cette traduction garde la valeur temporelle et reste naturelle en français.
- source_word: הוּא יְמִיתֶנּוּ
  choice: c’est lui qui le mettra à mort
  rationale: Cette reprise conserve l’insistance de l’hébreu sur l’identité de celui qui exécute la sentence.
theological_decisions:
- issue: Rôle juridique de גֹּאֵל הַדָּם
  choice: Présenter le « vengeur du sang » comme un agent humain lié à la famille dans le système judiciaire d’Israël.
  alternative: « rédempteur du sang » ou « libérateur du sang »
  rationale: Le passage relève du droit relatif à l’homicide et non d’un motif théologique de rédemption. Le terme juridique doit être conservé sans importer d’associations doctrinales ultérieures.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « mettra à mort » et l’emphase de « lui-même / c’est lui » reproduisent la solennité et l’insistance du texte hébreu. Aucune note n’est nécessaire, puisque « vengeur du sang » est directement employé dans le texte et le verset isolé ne demande pas d’explication supplémentaire.
