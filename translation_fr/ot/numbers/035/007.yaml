  register: Français international moderne, clair et digne. La syntaxe conserve la portée exhaustive de כָּל tout en rendant naturellement la reprise emphatique אֶתְהֶן. Le terme « pâturages » est accessible, tandis que la note signale l’étendue sémantique de מִגְרָשׁ.
