  text: כָּל הֶ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה עִ֑יר אֶתְ/הֶ֖ן וְ/אֶת מִגְרְשֵׁי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: fr
  text: Toutes les villes que vous donnerez aux Lévites seront au nombre de quarante-huit, avec leurs pâturages[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs terrains communaux » ou « les espaces ouverts qui les entourent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Toutes les villes
  rationale: Le quantificateur כָּל porte sur l’ensemble des villes concernées. « Toutes les villes » est naturel en français et conserve la portée totale de l’expression.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: que vous donnerez
  rationale: Le relatif suivi de l’imparfait hébreu à la deuxième personne du pluriel exprime ici une prescription à venir. Le futur français convient au registre juridique du contexte.
- source_word: לַלְוִיִּם
  choice: aux Lévites
  rationale: Désignation usuelle en français des membres de la tribu de Lévi, bénéficiaires des villes.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: au nombre de quarante-huit
  rationale: La tournure française exprime naturellement le total indiqué par la formule hébraïque « quarante et huit ville ».
- source_word: אֶתְהֶן
  choice: seront au nombre de
  rationale: Le pronom joint au marqueur d’objet reprend les villes comptées. La construction équative française rend cette reprise et le total sans produire une répétition artificielle.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: avec leurs pâturages
  rationale: מִגְרָשׁ désigne les espaces ouverts entourant les villes, utilisés notamment pour le bétail. « Avec » indique qu’ils sont attribués en même temps que les villes.
theological_decisions: []
