id: NUM.35.31
reference: Numbers 35:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: fr
  text: 'Vous n’accepterez pas de rançon pour la vie d’un meurtrier passible de mort[a] : il doit absolument être mis à mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car il sera certainement mis à mort ». La construction hébraïque souligne fortement l’obligation de la mise à mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: accepterez
  rationale: Avec כֹּפֶר dans ce contexte juridique, le verbe signifie recevoir ou accepter un paiement; « accepter » est naturel en français moderne.
- source_word: כֹּפֶר
  choice: rançon
  rationale: Le terme désigne un paiement destiné à détourner une peine ou à obtenir la libération de quelqu’un; « rançon » conserve ici cette portée juridique sans le réduire à un pot-de-vin.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: pour la vie d’un meurtrier
  rationale: נֶפֶשׁ peut désigner la vie ou la personne. Ici, le paiement viserait à épargner la vie du meurtrier; cette formulation garde le sens et la structure de l’hébreu.
- source_word: רֹצֵחַ
  choice: meurtrier
  rationale: Le chapitre distingue l’homicide involontaire du meurtre passible de mort; « meurtrier » exprime précisément la culpabilité en cause.
- source_word: רָשָׁע לָמוּת
  choice: passible de mort
  rationale: Dans ce cadre judiciaire, l’expression indique que l’auteur est juridiquement exposé à la peine de mort. « Passible de mort » est idiomatique et conserve cette force légale.
- source_word: כִּי מוֹת יוּמָת
  choice: il devra être mis à mort
  rationale: La construction associant l’infinitif absolu au verbe conjugué renforce l’obligation et la certitude. En français, « devra être mis à mort » exprime clairement la force prescriptive sans tournure artificielle.
theological_decisions:
- issue: Force juridique de la condamnation à mort
  choice: Le verset interdit de commuer par un paiement la peine d’un meurtrier passible de mort.
  alternative: Le verset décrirait seulement une pratique habituelle, sans forte valeur prescriptive.
  rationale: La négation impérative לֹא תִקְחוּ et la formule emphatique מוֹת יוּמָת donnent au texte la force d’une règle juridique ferme.
translation_notes:
  register: Français international moderne, sobre et juridique. Le futur de prescription « vous n’accepterez pas » convient au style législatif; « passible de mort » préserve la nuance judiciaire de רָשָׁע לָמוּת.
