  variant: modern international French
source:
  edition: WLC
  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: fr
  text: Ou s’il le frappe avec un objet en bois tenu à la main[a], capable de causer la mort, et qu’il meure, c’est un meurtrier ; le meurtrier sera certainement mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un instrument en bois qu’il tient à la main » ou « avec un objet en bois maniable à la main ».
    reason: Alternative lexicale reflétant l’étendue de כְּלִי et la fonction de יָד dans l’expression hébraïque.
lexical_decisions:
- source_word: בִּכְלִי עֵץ
  choice: avec un objet en bois
  rationale: כְּלִי est un terme large pouvant désigner un objet, un instrument, un ustensile ou une arme selon le contexte. « Objet » demeure naturel et conserve cette amplitude dans la série juridique des objets en fer, en pierre et en bois.
- source_word: יָד
  choice: tenu à la main
  rationale: Dans cette construction, יָד précise vraisemblablement que l’objet peut être manié à la main. Cette formulation explicite l’image hébraïque sans réduire l’objet à une catégorie d’arme particulière.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: capable de causer la mort
  rationale: La proposition qualifie l’objet comme potentiellement mortel, plutôt que de simplement répéter l’issue du cas décrit. La formulation française exprime clairement cette capacité létale.
- source_word: הִכָּהוּ
  choice: il le frappe
  rationale: נכה signifie couramment « frapper ». Le présent convient au style normatif français et n’anticipe pas la mort énoncée ensuite.
- source_word: וַיָּמֹת
  choice: et qu’il meure
  rationale: Cette formulation conserve la succession et le lien circonstanciel du texte hébreu, sans ajouter une intention ni une causalité plus précise que celle qui est exprimée.
- source_word: רֹצֵחַ
  choice: meurtrier
  rationale: Dans cette loi qui distingue l’homicide coupable de la mort accidentelle, רֹצֵחַ porte un jugement juridique et moral mieux rendu par « meurtrier » que par le terme plus général « tueur ».
- source_word: מוֹת יוּמַת
  choice: sera certainement mis à mort
  rationale: L’infinitif absolu joint à la forme verbale passive renforce la certitude et le caractère impératif de la peine. « Sera certainement mis à mort » conserve cette emphase dans un registre juridique digne.
theological_decisions:
- issue: Qualification juridique de רֹצֵחַ dans une loi sur l’homicide
  choice: meurtrier
  alternative: tueur ; auteur d’un homicide
  rationale: Le contexte immédiat oppose le meurtre passible de mort à l’homicide accidentel. « Meurtrier » communique cette qualification légale sans ajouter de conclusion doctrinale étrangère au passage.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique biblique accessible. Le présent dans la condition et le futur passif dans la sanction correspondent à l’usage normatif français. Le pronom de « qu’il meure » conserve la formulation hébraïque, même si son référent est compris par le contexte.
