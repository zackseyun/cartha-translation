source:
  edition: WLC
  text: וְ/הָי֨וּ לָ/כֶ֧ם הֶ/עָרִ֛ים לְ/מִקְלָ֖ט מִ/גֹּאֵ֑ל וְ/לֹ֤א יָמוּת֙ הָ/רֹצֵ֔חַ עַד עָמְד֛/וֹ לִ/פְנֵ֥י הָ/עֵדָ֖ה לַ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: fr
  text: Ces villes vous serviront de refuge contre le vengeur[a], afin que celui qui a tué ne meure pas avant d’avoir comparu devant la communauté pour être jugé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vengeur du sang » ou « le parent vengeur ». Le terme hébreu go’el désigne un proche parent qui, ici, est chargé de venger le sang versé.
    reason: Alternative lexicale et précision du rôle familial et juridique de גֹאֵל.
lexical_decisions:
- source_word: וְהָיוּ
  choice: serviront
  rationale: Le parfait avec waw, dans cette prescription juridique, a une valeur future et directive. « Serviront » exprime naturellement en français la fonction assignée aux villes.
- source_word: הֶעָרִים
  choice: Ces villes
  rationale: L’article renvoie aux villes désignées dans le contexte immédiat; le démonstratif français rend clairement cette reprise.
- source_word: לְמִקְלָט
  choice: de refuge
  rationale: מִקְלָט désigne un lieu de protection. Dans la tournure « servir de refuge », cette traduction est naturelle et précise.
- source_word: מִגֹּאֵל
  choice: contre le vengeur
  rationale: גֹאֵל est un terme de parenté qui désigne ici celui qui venge le sang versé. « Vengeur » garde le texte principal lisible, tandis que la note en explicite la portée familiale et juridique.
- source_word: וְלֹא יָמוּת
  choice: afin que ... ne meure pas
  rationale: La proposition indique la finalité de la protection offerte par les villes. Cette formulation conserve le verbe « mourir » sans préciser davantage l’agent de la mort.
- source_word: הָרֹצֵחַ
  choice: celui qui a tué
  rationale: Dans cette législation, רֹצֵחַ peut désigner l’auteur d’un homicide dont la culpabilité n’a pas encore été établie. Cette expression française évite de le qualifier prématurément de meurtrier.
- source_word: עַד עָמְדוֹ
  choice: avant d’avoir comparu
  rationale: Après עַד, l’infinitif avec suffixe exprime la limite temporelle. Dans un cadre judiciaire, « comparaître » rend naturellement le fait de se tenir devant l’instance compétente.
- source_word: לִפְנֵי הָעֵדָה
  choice: devant la communauté
  rationale: עֵדָה désigne ici la communauté réunie et investie d’une fonction judiciaire. « Communauté » est actuel et compréhensible, sans suggérer uniquement une assemblée cultuelle.
- source_word: לַמִּשְׁפָּט
  choice: pour être jugé
  rationale: מִשְׁפָּט renvoie ici à la procédure ou décision judiciaire. La formulation verbale est naturelle en français et maintient l’idée d’une adjudication encore à venir.
theological_decisions:
- issue: Statut juridique de הָרֹצֵחַ avant le jugement
  choice: « celui qui a tué » plutôt que « le meurtrier »
  alternative: « le meurtrier » ou « l’homicide »
  rationale: Le texte prévoit précisément une comparution avant décision. La traduction ne doit donc pas présumer une culpabilité pour meurtre que la communauté n’a pas encore établie.
- issue: Portée de גֹאֵל dans la législation sur l’homicide
  choice: « le vengeur » dans le texte, avec une note explicative
  alternative: « le vengeur du sang » ou « le parent chargé de la vengeance »
  rationale: Le mot hébreu porte une dimension de parenté et peut aussi désigner un proche qui rachète ou défend les droits familiaux. Ici, sa fonction est de venger le sang versé; la note préserve cette nuance sans alourdir le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère juridique du passage sans archaïsmes; « celui qui a tué » maintient la neutralité requise avant le jugement.
