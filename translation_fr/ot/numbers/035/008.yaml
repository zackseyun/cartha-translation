  source_fidelity: 'La formulation « sur la propriété des Israélites » rend mal le partitif מֵ־ (« provenant de / prélevées sur »), et « vous en prendrez » déplace l’action : l’hébreu ordonne d’augmenter ou de diminuer le nombre de villes que les Israélites donnent. La formulation révisée restitue la répartition proportionnelle sans identifier indûment les référents elliptiques comme des individus ou des tribus.'
  naturalness: Le texte révisé emploie une syntaxe juridique fluide en français international actuel. « De ceux qui ont beaucoup » et « de ceux qui ont peu » conserve l’ellipse du texte tout en étant idiomatique.
  terminology: « Propriétés des Israélites » convient pour אֲחֻזָּה dans le contexte d’avoirs fonciers héréditaires. « Lévites » et « villes » sont les termes établis du passage. La relative finale est neutralisée en français afin de ne pas résoudre artificiellement l’alternance hébraïque entre le singulier distributif et le pluriel.
  issues:
