  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: fr
  text: Quant aux villes que vous donnerez, prélevées sur les propriétés des Israélites, vous en donnerez davantage de la part de ceux qui ont beaucoup et moins de la part de ceux qui ont peu.[a] Chacun donnera aux Lévites quelques-unes de ses villes, en proportion de l’héritage reçu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la part de celui qui a beaucoup, vous augmenterez, et de la part de celui qui a peu, vous diminuerez ». Il s’agit du nombre de villes à fournir en proportion de l’importance de chaque héritage foncier.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie d’abord le singulier distributif (« chacun », « son héritage », « donnera »), puis un verbe au pluriel : « qu’ils recevront en héritage ». La formulation française neutralise cette alternance de nombre sans en fixer le référent.'
    reason: source_ambiguity
lexical_decisions:
- source_word: הֶעָרִים
  choice: les villes
  rationale: עִיר désigne une ville ou une localité. « Villes » maintient la terminologie habituelle des villes lévitiques dans ce chapitre.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: la propriété des Israélites
  rationale: אֲחֻזָּה désigne ici le territoire détenu comme possession héréditaire. « Propriété » reste compréhensible en français moderne, et « Israélites » rend naturellement l’expression collective בְּנֵי יִשְׂרָאֵל.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: vous en prendrez davantage à ceux qui en ont beaucoup et moins à ceux qui en ont peu
  rationale: La formulation exprime une répartition proportionnelle selon l’importance des territoires tribaux. L’ajout du pronom partitif « en » explicite qu’il s’agit du nombre de villes sans introduire un référent absent du contexte.
- source_word: אִישׁ
  choice: Chaque groupe
  rationale: אִישׁ a ici une valeur distributive. Le contexte et le passage du singulier au pluriel dans la proposition relative indiquent que les unités concernées sont les groupes tribaux plutôt que des individus isolés.
- source_word: כְּפִי נַחֲלָתוֹ
  choice: à proportion du territoire
  rationale: כְּפִי signifie idiomatiquement « selon la mesure de, à proportion de ». « Territoire » rend ici concrètement נַחֲלָה comme part territoriale reçue en héritage.
- source_word: אֲשֶׁר יִנְחָלוּ
  choice: que ses membres auront reçu en héritage
  rationale: Le verbe hébreu est au pluriel alors que le cadre distributif est singulier. Cette formulation conserve le changement de nombre en faisant du groupe l’unité distributive et de ses membres le sujet pluriel de l’héritage.
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: donnera aux Lévites quelques-unes de ses villes
  rationale: Le singulier correspond à l’unité distributive introduite par אִישׁ, et « quelques-unes de ses villes » exprime naturellement le sens partitif de מִן.
