revisions:
- from: Parmi les villes que vous donnerez sur la propriété des Israélites, vous en prendrez davantage à ceux qui en ont beaucoup et moins à ceux qui en ont peu.[a] Chaque groupe donnera aux Lévites quelques-unes de ses villes, à proportion du territoire que ses membres auront reçu en héritage.[b]
  to: Quant aux villes que vous donnerez, prélevées sur les propriétés des Israélites, vous en donnerez davantage de la part de ceux qui ont beaucoup et moins de la part de ceux qui ont peu.[a] Chacun donnera aux Lévites quelques-unes de ses villes, en proportion de l’héritage reçu.[b]
  rationale: La révision corrige le rapport partitif des villes aux propriétés israélites et maintient l’acte de donation prescrit par le texte. Elle rend clairement la proportionnalité de l’attribution tout en évitant de surinterpréter les référents elliptiques et l’alternance singulier-pluriel de l’hébreu.
