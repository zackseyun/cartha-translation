  register: Français international actuel, clair et digne. La syntaxe juridique demeure ferme, tandis que les ellipses hébraïques sont explicitées avec mesure. Le texte évite le calque peu naturel « fils d’Israël » et préserve dans une note le changement de nombre du texte source.
