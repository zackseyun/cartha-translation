    issue: « sur la propriété des Israélites »
    rationale: Le texte hébreu dit que les villes sont données « à partir de / sur la base de » la possession foncière des Israélites ; « sur la propriété » est peu naturel et n’exprime pas correctement ce rapport partitif.
  - severity: medium
    issue: « vous en prendrez davantage »
    rationale: Le verbe hébreu signifie augmenter ou rendre plus nombreux dans le cadre de ce que l’on donne. « Prendre » introduit un acte de saisie qui n’est pas exprimé.
  - severity: low
    issue: « Chaque groupe » et « ses membres »
    rationale: Cette explicitation interprète le singulier distributif comme un groupe tribal et le pluriel comme ses membres. Le contexte la rend plausible, mais le texte source conserve une formulation plus ouverte ; une tournure française neutre préserve mieux cette ambiguïté.
