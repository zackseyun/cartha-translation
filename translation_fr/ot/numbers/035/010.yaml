  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: fr
  text: 'Parle aux fils d’Israël et dis-leur[a] : « Quand vous traverserez le Jourdain vers le pays de Canaan, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « aux enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel commande à Moïse de s’adresser directement au peuple ; « Parle » en conserve la force et s’accorde avec la préposition אֶל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette traduction conserve l’expression familiale masculine du texte hébreu, tout en signalant en note l’équivalent collectif idiomatique.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Le maintien des deux verbes reproduit la formule hébraïque « parle… et dis » et son rythme.
- source_word: כִּי
  choice: Quand
  rationale: Dans ce contexte, la conjonction introduit la circonstance future dans laquelle l’instruction devra s’appliquer.
- source_word: אַתֶּם עֹבְרִים
  choice: vous traverserez
  rationale: Le pronom suivi du participe décrit ici une action future imminente ; le futur français est naturel après « quand ».
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: C’est la désignation géographique française usuelle ; le mot « fleuve » n’est pas explicite dans l’hébreu.
- source_word: אַרְצָה כְּנָעַן
  choice: pour entrer dans le pays de Canaan
  rationale: Le suffixe directionnel de אַרְצָה exprime un mouvement vers l’intérieur du territoire ; cette formulation naturelle précise le résultat de la traversée sans ajouter une destination étrangère au texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Parle… et dis-leur » est conservée pour refléter la cadence de l’hébreu. Le tutoiement singulier correspond à l’ordre adressé à Moïse, tandis que « vous » désigne collectivement Israël.
