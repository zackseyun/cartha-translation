  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: fr
  text: Ordonne aux Israélites[a] de donner aux Lévites des villes où habiter, prélevées sur le patrimoine qu’ils ont reçu en héritage ; vous donnerez aussi aux Lévites des terrains de pâture[b] autour de ces villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël »; on peut aussi traduire traditionnellement : « aux enfants d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne les espaces non bâtis autour d’une ville, utilisés notamment pour faire paître le bétail et pour d’autres besoins collectifs.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Ordonne
  rationale: L’impératif adressé à Moïse exprime un commandement net; « Ordonne » en conserve la force en français courant.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Cette désignation collective signifie littéralement « les fils d’Israël ». « Les Israélites » est naturel, précis et inclusif en français moderne, tandis qu’une note conserve la transparence de la forme hébraïque.
- source_word: וְנָתְנוּ
  choice: de donner
  rationale: Après « Ordonne », l’infinitif français rend naturellement la valeur injonctive de la forme verbale hébraïque.
- source_word: לַלְוִיִּם
  choice: aux Lévites
  rationale: Rend directement le destinataire de l’attribution.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: sur le patrimoine qu’ils ont reçu en héritage
  rationale: Cette formulation naturelle maintient les deux idées juridiquement liées de patrimoine possédé et d’héritage reçu, sans calque obscur.
- source_word: עָרִים לָשָׁבֶת
  choice: des villes où habiter
  rationale: Rend clairement la finalité exprimée par l’infinitif hébreu dans un français actuel et digne.
- source_word: מִגְרָשׁ
  choice: les terrains de pâture
  rationale: Le terme désigne les espaces non bâtis attenants aux villes, notamment destinés au bétail. « Terrains de pâture » exprime cet usage sans employer l’archaïque « banlieues ».
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: qui entourent ces villes
  rationale: Explicite naturellement en français le rapport spatial entre les terrains et les villes déjà mentionnées.
- source_word: תִּתְּנוּ
  choice: Vous donnerez
  rationale: Conserve le passage important de la troisième personne du pluriel à la deuxième personne du pluriel dans le texte hébreu.
