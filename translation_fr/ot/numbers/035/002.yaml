revisions:
- from: Ordonne aux Israélites[a] de donner aux Lévites, sur le patrimoine qu’ils ont reçu en héritage, des villes où habiter. Vous donnerez aussi aux Lévites les terrains de pâture[b] qui entourent ces villes.
  to: Ordonne aux Israélites[a] de donner aux Lévites des villes où habiter, prélevées sur le patrimoine qu’ils ont reçu en héritage ; vous donnerez aussi aux Lévites des terrains de pâture[b] autour de ces villes.
  rationale: La révision ne modifie pas le sens du passage. Elle explicite la provenance des villes à partir du patrimoine héréditaire israélite et allège la formulation du rapport entre les villes et leurs terrains attenants. Les ancres et le contenu des notes restent correctement associés aux expressions concernées.
