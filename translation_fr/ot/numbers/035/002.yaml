review_pass:
  verdict: revise
  source_fidelity: La structure injonctive est bien rendue, y compris le passage de « de donner » (Israélites à la troisième personne) à « vous donnerez » (deuxième personne du pluriel). « Israélites », « Lévites », « villes où habiter » et les terrains non bâtis associés aux villes correspondent au texte hébreu. Une légère révision rend plus explicite que les villes sont attribuées à partir du patrimoine héréditaire des Israélites, plutôt que d’être simplement situées « sur » ce patrimoine.
  naturalness: Le français est moderne, clair et de registre approprié. « Des villes où habiter, prélevées sur le patrimoine... » est plus précis et plus idiomatique dans ce contexte d’attribution foncière que l’incise actuelle « sur le patrimoine... ». « Autour de ces villes » est plus direct que « qui entourent ces villes ».
  terminology: « Patrimoine qu’ils ont reçu en héritage » conserve, en français naturel, les notions conjointes d’héritage et de possession foncière. « Terrains de pâture » est acceptable, avec une note qui précise que le terme couvre les espaces non bâtis et des usages collectifs plus larges.
  issues:
  - severity: low
    issue: Rapport de provenance foncière insuffisamment explicite
    rationale: Dans « donner ... sur le patrimoine », la préposition « sur » peut être comprise comme un simple cadre spatial ou patrimonial. Le מן de מִנַּחֲלַת indique que les villes sont prises sur l’héritage de leur possession; « prélevées sur » clarifie ce rapport sans ajouter de sens.
  - severity: low
    issue: Formulation spatiale un peu lourde
    rationale: « Les terrains de pâture qui entourent ces villes » est fidèle, mais « des terrains de pâture autour de ces villes » exprime plus naturellement le complément spatial hébreu.
  revised_text: Ordonne aux Israélites[a] de donner aux Lévites des villes où habiter, prélevées sur le patrimoine qu’ils ont reçu en héritage ; vous donnerez aussi aux Lévites des terrains de pâture[b] autour de ces villes.
  revised_footnotes:
