    issue: « que vous établirez »
    rationale: 'Le verbe תתנו est répété dans le texte hébreu : les six villes sont elles aussi des villes « que vous donnerez ». « Établirez » peut suggérer la fondation ou l’institution des villes plutôt que leur attribution aux Lévites pour cette fonction.'
  - severity: low
    issue: Formulation de la note lexicale
    rationale: « Littéralement “celui qui tue” » est réducteur pour un participe employé dans un cadre juridique. Une note décrivant la désignation de l’auteur d’un homicide explique plus exactement la nuance sans imposer une intention.
