base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: fr
  text: Parmi les villes que vous donnerez aux Lévites, il y aura les six villes de refuge, que vous donnerez afin que celui qui a tué quelqu’un[a] puisse s’y enfuir. En plus de celles-ci, vous donnerez quarante-deux villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne l’auteur d’un homicide. Dans le cadre juridique des villes de refuge, il ne précise pas à lui seul si la mort a été causée volontairement ou accidentellement.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: les villes
  rationale: עִיר peut désigner une ville ou une localité. « Villes » convient au contexte légal et territorial et assure la cohérence avec le reste du passage.
- source_word: לַלְוִיִּם
  choice: aux Lévites
  rationale: Le lamed indique ici les destinataires des villes.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: les six villes de refuge
  rationale: מִקְלָט désigne un refuge ou un asile. « Villes de refuge » est une expression française établie et exacte pour cette institution.
- source_word: לָנוּס שָׁמָּה
  choice: puisse s’y enfuir
  rationale: נוּס signifie « fuir, s’enfuir », et « y » restitue naturellement la valeur directionnelle de שָׁמָּה.
- source_word: הָרֹצֵחַ
  choice: celui qui a tué quelqu’un
  rationale: Dans ce contexte juridique, le participe désigne l’auteur d’un homicide sans préciser à lui seul si l’acte était intentionnel ou accidentel. Cette formulation française reste naturelle sans préjuger l’intention.
- source_word: וַעֲלֵיהֶם
  choice: En plus de celles-ci
  rationale: 'על a ici une valeur additive : les quarante-deux villes s’ajoutent aux six villes de refuge.'
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: quarante-deux villes
  rationale: Après le nombre, l’hébreu emploie le singulier עִיר selon une construction de dénombrement; le français exige le pluriel.
theological_decisions:
- issue: L’intention attribuée à הָרֹצֵחַ
  choice: Ne pas préciser si l’homicide était volontaire ou involontaire
  alternative: « le meurtrier » ou « l’auteur d’un homicide involontaire »
  rationale: Le terme hébreu, pris isolément dans ce verset, ne tranche pas cette question. Le contexte ultérieur établira les distinctions juridiques; la traduction ne doit pas les anticiper.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Parmi les villes… il y aura » restitue naturellement la relation partitive du texte hébreu. « Établirez » évite la répétition peu idiomatique de « donnerez » tout en exprimant que ces six villes sont affectées à cet usage.
