  to: Parmi les villes que vous donnerez aux Lévites, il y aura les six villes de refuge, que vous donnerez afin que celui qui a tué quelqu’un[a] puisse s’y enfuir. En plus de celles-ci, vous donnerez quarante-deux villes.
