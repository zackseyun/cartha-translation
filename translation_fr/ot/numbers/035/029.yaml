review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le renvoi aux dispositions précédentes, la portée durable (« de génération en génération ») et l’universalité des lieux de résidence. Toutefois, « procédure judiciaire » restreint מִשְׁפָּט à la procédure, alors que le terme conserve ici une portée juridique plus large (jugement, droit, décision judiciaire).
  naturalness: La phrase est claire et de registre juridique moderne. « Ces dispositions seront pour vous une règle judiciaire » est plus sobre et plus proche de la formulation hébraïque que « constitueront ... une règle de procédure judiciaire ». « Dans tous vos lieux d’habitation » préserve explicitement le complément locatif.
  terminology: « Règle judiciaire » rend de manière équilibrée la combinaison חֻקַּת מִשְׁפָּט sans imposer le sens plus étroit de procédure. La note conserve l’alternative « prescription juridique » et explique la double composante lexicale. La note sur les lieux d’habitation évite « communautés », qui peut dépasser le sens locatif de מוֹשָׁב.
  issues:
  - severity: medium
    issue: « procédure judiciaire » est trop spécifique pour מִשְׁפָּט.
    rationale: Dans cette collocation légale, מִשְׁפָּט désigne le domaine du jugement/droit judiciaire et ne se limite pas aux étapes procédurales. Une formulation plus large maintient l’ambiguïté lexicale.
  - severity: low
    issue: L’alternative « communautés » dans la note b est interprétative.
    rationale: מוֹשָׁב désigne d’abord un lieu de résidence ou d’établissement; « communauté » déplace le sens vers le groupe humain plutôt que le lieu.
