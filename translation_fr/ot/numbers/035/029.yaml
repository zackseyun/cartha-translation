  text: וְ/הָי֨וּ אֵ֧לֶּה לָ/כֶ֛ם לְ/חֻקַּ֥ת מִשְׁפָּ֖ט לְ/דֹרֹתֵי/כֶ֑ם בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: fr
  text: Ces dispositions seront pour vous une règle judiciaire[a], de génération en génération, dans tous vos lieux d’habitation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une prescription juridique ». L’hébreu associe un terme désignant une prescription établie à un terme relatif au jugement et au droit judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « partout où vous habiterez » ou « dans tous vos établissements ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ אֵלֶּה
  choice: Ces prescriptions constitueront
  rationale: Le démonstratif pluriel renvoie aux dispositions juridiques précédentes. « Ces prescriptions » explicite naturellement ce référent, tandis que le futur exprime leur valeur normative durable.
- source_word: לָכֶם
  choice: pour vous
  rationale: La préposition marque ici la référence aux destinataires de la législation.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: une règle de procédure judiciaire
  rationale: La combinaison de חֻקָּה, prescription établie, et מִשְׁפָּט, jugement ou ordre judiciaire, désigne ici une norme régissant les décisions et procédures judiciaires. Cette formulation française conserve les deux composantes sans suggérer un verdict particulier.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette expression idiomatique indique l'application durable de la règle au fil des générations.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: partout où vous habiterez
  rationale: מוֹשָׁב désigne un lieu de résidence ou d'établissement. La tournure choisie exprime clairement l'ensemble des lieux où les destinataires vivront.
