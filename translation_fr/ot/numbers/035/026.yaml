  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: fr
  text: Mais si celui qui a tué sort effectivement des limites de la ville de refuge où il s’est enfui,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « franchit les limites de la ville de refuge où il s’est enfui ». En hébreu, un infinitif absolu accompagne le verbe conjugué (littéralement : « sortir, il sort ») pour marquer l’insistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition en contraste avec les dispositions précédentes; « Mais si » exprime naturellement cette valeur dans le contexte juridique.
- source_word: יָצֹא יֵצֵא
  choice: sort effectivement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’idée verbale. « Effectivement » conserve cette insistance sans produire une tournure artificielle en français.
- source_word: הָרֹצֵחַ
  choice: celui qui a tué
  rationale: Dans la législation sur les villes de refuge, le terme désigne l’auteur d’un homicide sans préjuger ici qu’il s’agit d’un meurtrier coupable. Cette formulation reste claire et juridiquement neutre.
- source_word: אֶת גְּבוּל
  choice: des limites de
  rationale: Avec le verbe « sortir », cette expression rend naturellement le franchissement de la frontière protectrice de la ville.
- source_word: עִיר מִקְלָטוֹ
  choice: la ville de refuge
  rationale: Rend clairement le terme juridique consacré; le lien personnel exprimé par le suffixe hébreu ressort suffisamment du contexte, puisqu’il s’agit de la ville où cet homme s’est réfugié.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: où il s’est enfui
  rationale: La proposition relative désigne la ville vers laquelle l’homme a fui. Le passé composé est naturel en français et conserve le mouvement exprimé par שָׁמָּה.
theological_decisions:
- issue: Qualification morale de הָרֹצֵחַ
  choice: celui qui a tué
  alternative: le meurtrier
  rationale: « Le meurtrier » impliquerait une culpabilité intentionnelle que le contexte des villes de refuge ne permet pas d’attribuer automatiquement. La traduction retenue préserve la distinction juridique et théologique du passage.
translation_notes:
  register: Français moderne, clair et digne, avec une formulation juridique accessible. La phrase demeure ouverte, comme dans l’hébreu, puisque la conséquence de cette condition vient au verset suivant.
