source:
  edition: WLC
  text: וְ/אִם בְּ/שִׂנְאָ֖ה יֶהְדָּפֶ֑/נּוּ אֽוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו בִּ/צְדִיָּ֖ה וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: fr
  text: Mais si quelqu’un pousse un autre par haine, ou lui lance quelque chose avec une intention hostile[a], et que celui-ci meurt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec malveillance » ou « en embuscade » ; le terme hébreu désigne un acte hostile délibéré et peut comporter l’idée d’un guet-apens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit un cas conditionnel en contraste avec l’acte involontaire décrit auparavant.
- source_word: בְּשִׂנְאָה
  choice: par haine
  rationale: Exprime naturellement en français le mobile hostile indiqué par la préposition et le nom.
- source_word: יֶהְדָּפֶנּוּ
  choice: quelqu’un pousse un autre
  rationale: Le verbe désigne l’action de pousser ou de bousculer; cette formulation explicite les participants sans surinterpréter la violence du geste.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: lui lance quelque chose
  rationale: Le complément d’objet est sous-entendu en hébreu; « quelque chose » est ajouté pour obtenir une phrase française claire et naturelle.
- source_word: בִּצְדִיָּה
  choice: avec préméditation
  rationale: Rend la volonté hostile et délibérée du terme dans ce contexte juridique, tout en signalant en note sa possible nuance de guet-apens.
- source_word: וַיָּמֹת
  choice: et que celui-ci meure
  rationale: Conserve la conséquence exprimée par l’hébreu et distingue clairement la victime du sujet des verbes précédents.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, adapté au style juridique du passage. La construction « quelqu’un… un autre » évite l’ambiguïté des pronoms masculins successifs. Le verset reste syntaxiquement ouvert sur la suite, conformément au texte source.
