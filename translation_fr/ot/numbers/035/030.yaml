  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: fr
  text: Quiconque tue une personne, le meurtrier sera mis à mort[a] sur le témoignage de témoins[b]. Toutefois, un seul témoin ne témoignera pas contre une personne pour la faire mettre à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici la même racine pour « meurtrier » et pour le verbe rendu par « sera mis à mort ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur la bouche de témoins ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: Quiconque tue une personne
  rationale: Dans ce contexte juridique, l’expression désigne celui qui porte à une personne un coup mortel. « Tue une personne » exprime clairement le résultat sans introduire l’idée trompeuse d’une âme distincte du corps.
- source_word: נֶפֶשׁ
  choice: personne
  rationale: Dans les deux emplois, נֶפֶשׁ désigne un être humain ou sa vie. « Personne » convient au cadre judiciaire et reste naturel en français moderne.
- source_word: לְפִי עֵדִים
  choice: sur la déposition de témoins
  rationale: Littéralement « sur la bouche de témoins », cet idiome hébreu signifie qu’une décision repose sur leur témoignage. « Sur la déposition de témoins » restitue précisément sa portée juridique.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: le meurtrier sera mis à mort
  rationale: L’hébreu emploie la même racine pour le meurtrier et l’action judiciaire exercée contre lui. Une reproduction mécanique suggérerait à tort un meurtre illégal commis par le tribunal ; le passif français exprime correctement la peine légale.
- source_word: הָרֹצֵחַ
  choice: le meurtrier
  rationale: Le contexte vise l’auteur coupable d’un homicide passible de mort. « Meurtrier » est plus précis que le terme général « tueur ».
- source_word: וְעֵד אֶחָד לֹא יַעֲנֶה
  choice: Toutefois, la déposition d’un seul témoin ne suffira pas
  rationale: Dans ce cadre judiciaire, ענה signifie témoigner ou déposer. La formulation française rend la force probatoire insuffisante d’un témoignage unique, plutôt que d’interdire au témoin de parler.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: pour qu’une personne soit mise à mort
  rationale: Cette formule juridique condensée indique qu’un seul témoignage ne peut entraîner la mort de l’accusé. La traduction conserve la personne visée et l’issue capitale.
theological_decisions: []
