  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: fr
  text: Vous mesurerez, à l’extérieur de la ville, deux mille coudées du côté est, deux mille coudées du côté sud, deux mille coudées du côté ouest[a] et deux mille coudées du côté nord, la ville étant au milieu. L’ensemble constituera pour eux les terrains de pâture[b] des villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « mer », terme couramment employé pour désigner l’ouest, du côté de la mer Méditerranée.
    reason: lexical_alternative
  - marker: b
    text: Ou « terrains communaux » ou « espaces libres » ; le terme hébreu désigne les terres qui entourent une ville, souvent utilisées pour faire paître le bétail.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: Vous mesurerez
  rationale: Le qatal précédé de la conjonction prend ici, dans un texte législatif, une valeur prescriptive. Le futur français exprime naturellement cette instruction tout en conservant l’action concrète de mesurer.
- source_word: מִחוּץ לָעִיר
  choice: à l’extérieur de la ville
  rationale: Cette expression situe la mesure hors des limites de la ville; cette formulation est claire et idiomatique en français moderne.
- source_word: פְּאַת
  choice: du côté
  rationale: Dans ce contexte d’arpentage, le mot désigne chacun des côtés orientés de la zone, plutôt qu’un angle précis.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: est / sud / ouest / nord
  rationale: Ces termes indiquent ici les quatre directions cardinales. יָם signifie littéralement « mer », mais désigne conventionnellement l’ouest dans cet emploi.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: deux mille coudées
  rationale: La mesure ancienne explicite est conservée sans conversion moderne afin de respecter la précision formelle du texte.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: la ville étant au milieu
  rationale: La tournure décrit sobrement la disposition spatiale, avec la ville au centre de la zone mesurée.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: Tels seront pour eux
  rationale: Cette formulation garde la valeur de désignation de l’hébreu sans préciser indûment la nature juridique de la possession.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: les terrains de pâture des villes
  rationale: מִגְרָשׁ désigne les espaces ouverts entourant une ville, notamment utilisables pour le bétail. « Terrains de pâture » rend bien cet usage, tandis qu’une note conserve l’extension sémantique plus large.
