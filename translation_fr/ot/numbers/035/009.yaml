  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait avancer le récit et introduit la formule de révélation. « Parla » rend naturellement l'acte de parole en français tout en le distinguant de לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription usuelle « Yahweh », afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l'équivalent français idiomatique.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, l'infinitif לֵאמֹר annonce les paroles qui suivent. « En ces termes » est naturel en français et évite le calque lourd « en disant » après « parla ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L'hébreu emploie directement le tétragramme. La traduction conserve donc le nom divin, tandis qu'une note signale le rendu traditionnel sans imposer une substitution confessionnelle.
translation_notes:
  register: Français international moderne, digne et clair. La tournure « en ces termes » conserve la fonction introductive de la formule hébraïque sans reproduire littéralement une construction peu naturelle en français.
