  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: fr
  text: 'Ou bien, s’il l’a frappé de sa main par hostilité et qu’il en est mort[a], celui qui l’a frappé sera certainement mis à mort : c’est un meurtrier. Le vengeur du sang[b] mettra à mort le meurtrier quand il le rencontrera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il mourut ». L’hébreu enchaîne simplement la mort au coup.'
    reason: La formulation française intègre la proposition dans le cas conditionnel, tandis que l’hébreu emploie une succession narrative.
  - marker: b
    text: 'Ou : « le parent chargé de venger le sang ».'
    reason: Le terme גֹּאֵל désigne souvent un proche parent ayant une responsabilité familiale de rachat ou de réparation.
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: par hostilité
  rationale: Le nom אֵיבָה exprime l’hostilité ou la haine. « Par hostilité » rend naturellement en français la disposition hostile qui motive l’acte, essentielle dans ce cas juridique.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: l’a frappé de sa main
  rationale: Cette formulation conserve explicitement le moyen corporel indiqué par l’hébreu et reste naturelle en français.
- source_word: וַיָּמֹת
  choice: et que celui-ci soit mort
  rationale: Le français exige ici une articulation syntaxique avec « s’il » ; le subjonctif passé présente la mort comme l’issue du cas envisagé sans ajouter davantage de causalité que le texte source.
- source_word: מוֹת יוּמַת
  choice: sera certainement mis à mort
  rationale: L’adverbe « certainement » rend l’intensification produite par l’infinitif absolu associé au verbe passif, tout en maintenant le registre juridique.
- source_word: הַמַּכֶּה
  choice: celui qui l’a frappé
  rationale: Cette expression transparente reprend l’acte décrit et sonne plus naturellement que le substantif rare « frappeur ».
- source_word: רֹצֵחַ הוּא
  choice: c’est un meurtrier
  rationale: Le contexte précise l’intention hostile et distingue ainsi ce cas de l’homicide involontaire ; « meurtrier » exprime cette culpabilité intentionnelle.
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: Cette désignation conserve l’expression juridique propre au passage sans expliciter dans le corps du texte la relation familiale impliquée par גֹּאֵל.
- source_word: יָמִית
  choice: mettra à mort
  rationale: « Mettra à mort » garde le registre légal et fait écho à la peine formulée dans la proposition précédente.
- source_word: בְּפִגְעוֹ בוֹ
  choice: quand il le rencontrera
  rationale: La formule exprime le moment où le vengeur rencontre le meurtrier ; cette traduction est claire et idiomatique sans préciser indûment les circonstances.
theological_decisions:
- issue: Catégorie juridique de l’homicide intentionnel
  choice: meurtrier
  alternative: auteur d’un homicide
  rationale: L’hostilité explicitement mentionnée caractérise un homicide volontaire, et non une mort accidentelle. « Meurtrier » préserve la distinction morale et juridique établie par le chapitre.
- issue: Désignation de גֹּאֵל הַדָּם
  choice: le vengeur du sang
  alternative: le parent chargé de venger le sang
  rationale: Le texte principal conserve l’institution juridique sous sa forme concise. La note indique la dimension familiale possible sans l’imposer comme paraphrase dans le verset.
translation_notes:
  register: Français international moderne, digne et accessible, avec maintien du registre juridique. Les répétitions de « frapper », « meurtrier » et « mettre à mort » sont conservées afin de refléter la cohésion et l’insistance du texte hébreu.
