source:
  edition: WLC
  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: fr
  text: Mais si quelqu’un frappe quelqu’un avec un objet en fer et que la victime meurt[a], c’est un meurtrier ; le meurtrier doit être mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un instrument en fer ». Le terme hébreu est large et ne désigne pas en lui-même une arme particulière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: Introduit un nouveau cas juridique en contraste avec ce qui précède ; « Mais s’il » rend naturellement cette progression.
- source_word: בִּכְלִי בַרְזֶל
  choice: avec un objet en fer
  rationale: כְּלִי désigne largement un objet, ustensile ou instrument. « Objet » évite de préciser sans fondement qu’il s’agit d’un outil ou d’une arme.
- source_word: הִכָּהוּ
  choice: il le frappe
  rationale: Le hiphil de נכה signifie couramment « frapper » ; le présent convient au style général d’une disposition légale en français.
- source_word: וַיָּמֹת
  choice: et que celui-ci meure
  rationale: Conserve la succession exprimée par l’hébreu sans expliciter davantage le lien causal ; « celui-ci » lève l’ambiguïté pronominale en français.
- source_word: רֹצֵחַ הוּא
  choice: c’est un meurtrier
  rationale: Dans ce cadre juridique, רצח qualifie l’auteur d’un homicide coupable ; « meurtrier » exprime clairement ce statut.
- source_word: מוֹת יוּמַת
  choice: sera certainement mis à mort
  rationale: L’infinitif absolu associé à la forme verbale passive renforce la certitude et le caractère impératif de la peine. Cette formulation conserve l’emphase sans archaïsme.
- source_word: הָרֹצֵחַ
  choice: le meurtrier
  rationale: La forme définie reprend explicitement le statut juridique attribué à l’auteur.
theological_decisions:
- issue: Qualification juridique de רצח
  choice: meurtrier
  alternative: homicide
  rationale: « Homicide » peut désigner en français soit l’acte, soit son auteur, et n’implique pas toujours à lui seul une culpabilité intentionnelle. Dans ce cas légal, « meurtrier » rend mieux la qualification coupable affirmée par le texte, tout en laissant le contexte établir les critères.
translation_notes:
  register: Français international moderne, clair et digne. Le présent sert à formuler le cas juridique, tandis que le futur passif énonce la sanction. La répétition de « meurtrier » reproduit l’insistance du texte hébreu.
