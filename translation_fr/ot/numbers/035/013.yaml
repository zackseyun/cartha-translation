  yaml_path: translation/ot/numbers/035/013.yaml
  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: fr
  text: Les villes que vous donnerez seront pour vous six villes de refuge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: Les villes
  rationale: Le nom pluriel défini est rendu naturellement en français. La conjonction וְ peut rester non exprimée ici, puisque le verset poursuit directement l’instruction précédente et qu’un « Et » initial serait moins idiomatique.
- source_word: אֲשֶׁר תִּתֵּנוּ
  choice: que vous donnerez
  rationale: La proposition relative est conservée. Le futur français exprime naturellement la portée prospective de l’imparfait hébreu dans cette instruction.
- source_word: שֵׁשׁ
  choice: six
  rationale: Rendu direct du nombre cardinal.
- source_word: עָרֵי מִקְלָט
  choice: villes de refuge
  rationale: Cette expression reproduit clairement la chaîne construite hébraïque et désigne sans surinterprétation l’institution juridique du contexte.
- source_word: תִּהְיֶינָה לָ/כֶם
  choice: seront pour vous
  rationale: Le futur rend la valeur directive et résultative de la forme verbale; « pour vous » conserve la valeur de référence ou de bénéfice de לָכֶם.
