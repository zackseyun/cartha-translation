source:
  edition: WLC
  text: וּ/מִגְרְשֵׁי֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/לְוִיִּ֑ם מִ/קִּ֤יר הָ/עִיר֙ וָ/ח֔וּצָ/ה אֶ֥לֶף אַמָּ֖ה סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: fr
  text: Les pâturages des villes que vous donnerez aux Lévites s’étendront, à partir de la muraille de la ville vers l’extérieur, sur mille coudées tout autour[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ou « espaces non bâtis », pour les terrains qui entouraient les villes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à partir de la muraille de la ville »; certains comprennent plus généralement « à partir de la limite de la ville ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: les pâturages
  rationale: Dans ce contexte, מִגְרָשׁ désigne les terrains non bâtis entourant les villes lévitiques et destinés notamment au bétail. « Pâturages » exprime clairement leur fonction, tandis qu’une note conserve les sens plus généraux possibles.
- source_word: הֶעָרִים
  choice: des villes
  rationale: עִיר peut désigner une ville ou une localité; « villes » convient au contexte des villes attribuées aux Lévites et assure la cohérence du passage.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: que vous donnerez
  rationale: Le futur français rend naturellement la valeur prospective et prescriptive de la forme verbale dans ce contexte.
- source_word: לַלְוִיִּם
  choice: aux Lévites
  rationale: Traduction directe du groupe prépositionnel indiquant les bénéficiaires.
- source_word: מִקִּיר הָעִיר
  choice: à partir de la muraille de la ville
  rationale: קִיר signifie ordinairement « mur » ou « muraille ». Cette formulation préserve le point de départ concret de la mesure; une note signale l’interprétation plus générale « limite de la ville ».
- source_word: וָחוּצָה
  choice: vers l’extérieur
  rationale: La forme exprime une direction vers le dehors; « vers l’extérieur » est naturel et précis en français.
- source_word: אֶלֶף אַמָּה
  choice: mille coudées
  rationale: La mesure ancienne est conservée sans conversion afin de rester proche du texte source.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression rend clairement l’idée d’une mesure s’appliquant sur tout le pourtour de la ville.
