source:
  edition: WLC
  text: וְ/שָֽׁפְטוּ֙ הָֽ/עֵדָ֔ה בֵּ֚ין הַ/מַּכֶּ֔ה וּ/בֵ֖ין גֹּאֵ֣ל הַ/דָּ֑ם עַ֥ל הַ/מִּשְׁפָּטִ֖ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/024.yaml
  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: fr
  text: Alors la communauté jugera entre celui qui a frappé et le vengeur du sang[a], conformément à ces règles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne la personne chargée de venger le sang d’un proche.
    reason: lexical_alternative
  - marker: b
    text: Ou « conformément à ces décisions de justice ». Le terme hébreu peut désigner des règles juridiques ou des jugements.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Alors ... jugera
  rationale: Dans cette procédure juridique, le parfait précédé de וְ exprime l’étape suivante; le futur français rend naturellement cette valeur tout en conservant le sens judiciaire de שׁפט.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël exerçant une fonction judiciaire. « Communauté » est courant en français moderne et n’impose pas l’idée d’une assemblée réunie au moment précis.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et
  rationale: Cette tournure française rend naturellement la construction hébraïque répétée sans perte de sens.
- source_word: הַמַּכֶּה
  choice: celui qui a frappé
  rationale: Le participe substantivé de נכה désigne littéralement celui qui a porté le coup. Cette formulation reste neutre et n’anticipe pas un verdict de meurtre; elle n’ajoute pas non plus d’objet absent du verset.
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: La traduction conserve l’expression juridique hébraïque désignant la personne chargée de venger le sang d’un proche, sans expliciter dans le texte une parenté qui n’est pas formulée dans ce verset.
- source_word: עַל
  choice: conformément à
  rationale: Avec מִשְׁפָּטִים dans ce contexte légal, עַל indique la norme suivant laquelle le jugement doit être rendu.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: ces règles
  rationale: מִשְׁפָּטִים peut désigner des règles ou prescriptions juridiques. « Règles » est clair en français actuel tout en évitant que « jugements » soit compris comme des verdicts déjà prononcés.
theological_decisions:
- issue: Rôle judiciaire de la communauté dans une affaire d’homicide
  choice: Le verset attribue à la communauté la tâche de juger entre l’auteur du coup et le vengeur du sang, sans préjuger la culpabilité de meurtre.
  alternative: Comprendre la communauté comme un tribunal plus restreint ou désigner d’emblée l’auteur du coup comme un meurtrier.
  rationale: L’hébreu décrit une procédure communautaire et maintient ici la neutralité judiciaire quant à la qualification exacte de l’acte.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique accessible. La formulation conserve l’enchaînement procédural et l’ambiguïté du participe hébreu sans introduire une qualification pénale prématurée.
