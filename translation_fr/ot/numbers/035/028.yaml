source:
  edition: WLC
  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: fr
  text: Car il devra rester dans sa ville de refuge jusqu’à la mort du grand prêtre. Après la mort du grand prêtre, celui qui a tué[a] pourra retourner sur la terre qui lui appartient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’auteur de l’homicide ». Le terme hébreu désigne ici une catégorie juridique dans les lois sur les villes de refuge ; il ne faut donc pas nécessairement le comprendre comme « le meurtrier ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur la terre de sa propriété » ; autre traduction possible : « dans son domaine foncier ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification de la disposition juridique précédente.
- source_word: בְעִיר מִקְלָטוֹ
  choice: dans sa ville de refuge
  rationale: Rend directement l’expression hébraïque et conserve le terme juridique consacré « ville de refuge ».
- source_word: יֵשֵׁב
  choice: il devra rester
  rationale: Dans ce contexte légal, le verbe exprime une résidence imposée jusqu’à l’échéance indiquée, plutôt qu’une simple habitation.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: jusqu’à la mort du grand prêtre
  rationale: Préserve la construction nominale et rend naturellement le titre officiel en français.
- source_word: וְאַחֲרֵי מוֹת הַכֹּהֵן הַגָּדֹל
  choice: Après la mort du grand prêtre
  rationale: Conserve la répétition solennelle de l’expression, importante dans la formulation juridique hébraïque.
- source_word: הָרֹצֵחַ
  choice: celui qui a tué
  rationale: Désigne ici une catégorie juridique liée aux villes de refuge. Cette formulation n’impose pas le verdict moral et pénal que suggérerait « meurtrier ».
- source_word: יָשׁוּב
  choice: pourra retourner
  rationale: Exprime le rétablissement d’une permission juridique après une période de restriction, sans transformer le verbe en ordre ou en simple prédiction.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: sur la terre qui lui appartient
  rationale: Rend le sens foncier et patrimonial de אֲחֻזָּה dans un français actuel et naturel.
theological_decisions:
- issue: Faut-il rendre הָרֹצֵחַ par « meurtrier » ou par un terme juridiquement moins déterminé ?
  choice: celui qui a tué
  alternative: le meurtrier ; l’auteur de l’homicide
  rationale: La législation sur les villes de refuge distingue le meurtre intentionnel des autres homicides. « Celui qui a tué » préserve la catégorie juridique sans préjuger une culpabilité pour meurtre que ce verset n’affirme pas à lui seul.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère juridique du verset, la répétition de « la mort du grand prêtre » et l’indétermination morale du terme désignant la personne qui a causé la mort.
