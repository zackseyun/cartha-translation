  variant: modern international French
source:
  edition: WLC
  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: fr
  text: Alors l’assemblée délivrera l’auteur de l’homicide de la main du vengeur du sang[a] et le ramènera dans sa ville de refuge, celle où il s’est enfui. Il y habitera[b] jusqu’à la mort du grand prêtre, qu’on a oint avec l’huile sainte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vengeur de sang ». L’expression hébraïque désigne la personne chargée, selon le droit familial de l’époque, de venger le sang versé, souvent un proche parent.
    reason: lexical_alternative
  - marker: b
    text: Ou « Il y restera » ou « Il y demeurera ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie littéralement un verbe actif : « que [quelqu’un] a oint avec l’huile sainte » ; son sujet n’est pas exprimé. Beaucoup de traductions rendent plutôt : « qui avait été oint avec l’huile sainte ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: délivrera
  rationale: Le hifil de נצל exprime ici le fait de soustraire quelqu’un au pouvoir d’un autre. « Délivrera » convient au cadre judiciaire et protecteur.
- source_word: הָעֵדָה
  choice: l’assemblée
  rationale: Dans ce contexte, le terme désigne la communauté réunie qui exerce une fonction judiciaire. « Assemblée » garde ce sens collectif et formel en français actuel.
- source_word: הָרֹצֵחַ
  choice: l’auteur de l’homicide
  rationale: Le chapitre distingue le meurtre intentionnel de l’homicide involontaire. Cette formulation juridique et neutre n’attribue donc pas d’avance une intention criminelle.
- source_word: מִיַּד
  choice: de la main de
  rationale: L’expression concrète de l’hébreu est intelligible en français et évoque ici le pouvoir exercé sur la personne.
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: Cette expression rend le rôle juridique de celui qui est habilité à venger le sang versé, sans ajouter explicitement le lien de parenté seulement impliqué par גאל.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: le ramènera
  rationale: Le hifil de שוב signifie faire revenir ou ramener. « Ramènera » est naturel et précis.
- source_word: עִיר מִקְלָטוֹ
  choice: sa ville de refuge
  rationale: « Ville de refuge » est la désignation française claire de l’institution juridique décrite dans ce chapitre.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: celle où il s’est enfui
  rationale: La tournure relie clairement la proposition à la ville et restitue la fuite vers ce lieu sans lourdeur.
- source_word: וְיָשַׁב בָּהּ
  choice: Il y habitera
  rationale: ישב peut signifier habiter, demeurer ou rester. « Habitera » exprime naturellement la résidence imposée dans la ville.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: jusqu’à la mort du grand prêtre
  rationale: La construction nominale hébraïque est conservée et le titre est rendu par son équivalent français usuel.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: qu’il a oint
  rationale: L’hébreu emploie un verbe actif à la troisième personne du masculin singulier, avec le grand prêtre comme objet, mais sans nommer explicitement le sujet. La traduction conserve cette forme et son ambiguïté plutôt que de la transformer silencieusement en passif.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: avec l’huile sainte
  rationale: La formulation rend de près l’expression hébraïque définie qui désigne l’huile consacrée employée pour l’onction.
theological_decisions:
- issue: Statut juridique de הָרֹצֵחַ dans la législation sur les villes de refuge
  choice: « l’auteur de l’homicide » plutôt que « le meurtrier »
  alternative: « le meurtrier » ou « celui qui a tué »
  rationale: Le contexte distingue l’homicide volontaire de l’homicide involontaire. « Meurtrier » attribuerait prématurément une culpabilité que la procédure doit précisément déterminer.
- issue: Sujet implicite de מָשַׁח אֹתוֹ
  choice: 'Maintien de l’actif : « qu’il a oint »'
  alternative: « qui avait été oint » ou « qui a reçu l’onction »
  rationale: Le texte hébreu présente un verbe actif dont le sujet n’est pas exprimé. La formulation retenue préserve cette difficulté et évite d’introduire un agent ou un passif absent du texte consonantique.
translation_notes:
  register: Français international moderne, digne et accessible. Le registre reste juridique sans archaïsmes inutiles. La répétition hébraïque de « l’assemblée » est allégée dans la seconde proposition par le pronom sujet implicite de « ramènera », conformément à l’usage naturel du français, tandis que les ambiguïtés juridiquement et théologiquement significatives sont conservées ou signalées.
