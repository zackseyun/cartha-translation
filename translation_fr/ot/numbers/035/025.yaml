revisions:
- from: Alors l’assemblée délivrera l’auteur de l’homicide de la main du vengeur du sang[a] et le ramènera dans sa ville de refuge, celle où il s’est enfui. Il y habitera[b] jusqu’à la mort du grand prêtre qu’il a oint avec l’huile sainte[c].
  to: Alors l’assemblée délivrera l’auteur de l’homicide de la main du vengeur du sang[a] et le ramènera dans sa ville de refuge, celle où il s’est enfui. Il y habitera[b] jusqu’à la mort du grand prêtre, qu’on a oint avec l’huile sainte[c].
  rationale: La correction remplace le pronom français ambigu par « qu’on a oint », qui maintient un agent non identifié et l’orientation active du verbe sans introduire l’idée erronée que l’auteur de l’homicide aurait oint le grand prêtre. La note a est corrigée afin de ne pas substituer « meurtre » à l’expression hébraïque « sang ».
