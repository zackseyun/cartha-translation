revisions:
- from: Ces six villes serviront de refuge aux fils d’Israël[a], ainsi qu’à l’immigré et au résident qui vivent parmi eux[b]. Quiconque aura causé involontairement la mort d’une personne pourra s’y enfuir[c].
  to: Ces six villes serviront de refuge aux fils d’Israël[a], ainsi qu’à l’étranger résidant et au résident qui vivent parmi eux[b], afin que quiconque aura tué une personne[c] involontairement puisse s’y enfuir.
  rationale: La révision améliore la précision historique de la catégorie du גֵּר, corrige l’emplacement et la formulation de la note lexicale, et rend la relation de finalité de לָנוּס שָׁמָּה par « afin que … puisse s’y enfuir ». Elle ne modifie pas le sens juridique du verset ni son ambiguïté au-delà de ce qu’indique le contexte immédiat.
