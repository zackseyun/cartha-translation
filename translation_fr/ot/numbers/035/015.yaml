  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: fr
  text: Ces six villes serviront de refuge aux fils d’Israël[a], ainsi qu’à l’étranger résidant et au résident qui vivent parmi eux[b], afin que quiconque aura tué une personne[c] involontairement puisse s’y enfuir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « aux enfants d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: « Étranger résidant » et « résident » traduisent deux termes hébreux distincts (גֵּר et תּוֹשָׁב) désignant des personnes non autochtones vivant au sein de la société israélite.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « quiconque frappe une personne » ou « une vie » ; dans ce contexte, l’expression désigne celui qui a causé la mort d’une personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Conserve la forme masculine du syntagme hébreu et sa valeur de désignation nationale et liée à l’alliance; une formulation française plus courante est signalée en note.
- source_word: גֵּר
  choice: l’immigré
  rationale: Désigne ici une personne non native établie au sein de la société israélite. « Immigré » est actuel et intelligible, sans la connotation passagère de « voyageur ».
- source_word: תּוֹשָׁב
  choice: le résident
  rationale: Rend par un terme distinct le statut d’une personne qui demeure dans le pays ou la communauté sans être autochtone, préservant ainsi la distinction avec גֵּר.
- source_word: בְּתוֹכָם
  choice: qui vivent parmi eux
  rationale: Explicite naturellement en français le lien des deux groupes avec la communauté, tout en conservant l’idée de présence en son sein.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: Ces six villes serviront de refuge
  rationale: Exprime avec naturel la désignation légale des villes et la fonction indiquée par לְמִקְלָט.
- source_word: לָנוּס שָׁמָּה
  choice: pourra s’y enfuir
  rationale: Rend la finalité de ces villes dans un français idiomatique; « y » reprend clairement les six villes.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: Quiconque aura causé ... la mort d’une personne
  rationale: Dans ce contexte juridique, l’expression vise toute personne ayant causé une mort humaine. Cette formulation est claire et évite l’ambiguïté possible de « frapper une personne ».
- source_word: נֶפֶשׁ
  choice: personne
  rationale: Le mot désigne ici l’être humain victime de l’acte mortel, et non une « âme » au sens abstrait.
- source_word: בִּשְׁגָגָה
  choice: involontairement
  rationale: Préserve la distinction juridique entre homicide intentionnel et mort causée sans intention.
theological_decisions:
- issue: Forme genrée de la désignation בְּנֵי יִשְׂרָאֵל
  choice: Conserver « fils d’Israël » dans le texte principal
  alternative: « Israélites » ou « enfants d’Israël »
  rationale: La traduction garde la forme masculine plurielle du texte hébreu lorsqu’elle sert de désignation nationale traditionnelle, sans la neutraliser silencieusement; la note donne des équivalents français plus courants.
- issue: Nature de la mort visée par בִּשְׁגָגָה
  choice: « causé involontairement la mort »
  alternative: « tué par erreur » ou « tué accidentellement »
  rationale: « Involontairement » restitue la question décisive de l’absence d’intention sans imposer une théorie plus précise de l’accident ou de la culpabilité.
translation_notes:
  register: Français international moderne, clair et digne, avec une tonalité juridique sobre. La syntaxe a été légèrement restructurée pour éviter une phrase lourde tout en conservant la fonction des villes, les catégories de résidents et le caractère involontaire de l’homicide.
