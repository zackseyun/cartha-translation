  text: וּ/מָצָ֤א אֹת/וֹ֙ גֹּאֵ֣ל הַ/דָּ֔ם מִ/ח֕וּץ לִ/גְב֖וּל עִ֣יר מִקְלָט֑/וֹ וְ/רָצַ֞ח גֹּאֵ֤ל הַ/דָּם֙ אֶת הָ֣/רֹצֵ֔חַ אֵ֥ין ל֖/וֹ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: fr
  text: Si le vengeur du sang le trouve hors des limites de sa ville de refuge et tue l’auteur de l’homicide, le vengeur du sang n’encourt aucune responsabilité pour le sang versé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y a pas de sang pour lui », c’est-à-dire qu’aucune responsabilité liée au sang versé n’est imputée au vengeur du sang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: Cette expression transparente et consacrée rend la fonction juridique de la personne habilitée à venger le sang versé, sans ajouter explicitement une relation de parenté que le verset ne formule pas.
- source_word: מִחוּץ לִגְבוּל
  choice: hors des limites
  rationale: La formulation exprime naturellement en français le dépassement des limites territoriales et juridiques à l’intérieur desquelles la ville offre sa protection.
- source_word: עִיר מִקְלָטוֹ
  choice: sa ville de refuge
  rationale: « Ville de refuge » est la désignation française claire et usuelle de cette institution; le possessif renvoie à la ville où l’auteur de l’homicide s’est réfugié.
- source_word: וְרָצַח
  choice: tue
  rationale: Le verbe français neutre évite de qualifier l’acte de meurtre criminel, puisque la proposition finale exclut ici la culpabilité liée au sang versé.
- source_word: הָרֹצֵחַ
  choice: celui qui a tué
  rationale: Dans cette législation, le participe désigne l’auteur de l’homicide, qui peut être involontaire. Cette périphrase naturelle n’implique donc pas à tort un meurtre prémédité.
- source_word: אֵין לוֹ דָּם
  choice: ne sera pas coupable d’avoir versé le sang
  rationale: Cette formulation restitue le sens juridique de l’idiome hébreu tout en précisant clairement que le pronom vise le vengeur du sang.
theological_decisions:
- issue: Valeur morale et juridique de רצח dans le cas d’une mise à mort permise
  choice: Traduire neutralement par « tue »
  alternative: Traduire par « assassine » ou « commet un meurtre » pour maintenir une correspondance lexicale uniforme
  rationale: La fin du verset déclare que le vengeur n’encourt pas de culpabilité de sang. Un terme français désignant nécessairement un homicide criminel introduirait donc une contradiction absente du contexte juridique hébreu.
- issue: Référent de אֵין לוֹ דָּם
  choice: Rendre explicite que le vengeur du sang n’est pas coupable
  alternative: 'Conserver le pronom ambigu: « il ne sera pas coupable »'
  rationale: La syntaxe et la logique juridique font du vengeur le bénéficiaire de l’exemption. L’explicitation française évite que le lecteur attribue la déclaration à la personne tuée, sans modifier le fond du texte.
translation_notes:
  register: Français international moderne, sobre et juridique. La phrase reste liée au contexte conditionnel commencé dans les versets précédents; « si » rend naturellement cette continuité. La répétition de « vengeur du sang » est conservée là où elle clarifie le sujet de la conclusion.
