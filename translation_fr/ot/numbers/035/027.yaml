revisions:
- from: si le vengeur du sang le trouve hors des limites de sa ville de refuge et tue celui qui a tué, le vengeur du sang ne sera pas coupable d’avoir versé le sang.[a]
  to: Si le vengeur du sang le trouve hors des limites de sa ville de refuge et tue l’auteur de l’homicide, le vengeur du sang n’encourt aucune responsabilité pour le sang versé.[a]
  rationale: La révision conserve la structure conditionnelle du contexte législatif, les désignations juridiques établies et la neutralité de « tue ». Elle remplace une expression française susceptible de brouiller la notion de sang imputable par une formulation juridique plus exacte, et corrige le littéral de la note sans trancher au-delà du sens idiomatique attesté.
