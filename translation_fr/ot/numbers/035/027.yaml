    reason: lexical_alternative
  revision_rationale: La révision conserve la structure conditionnelle du contexte législatif, les désignations juridiques établies et la neutralité de « tue ». Elle remplace une expression française susceptible de brouiller la notion de sang imputable par une formulation juridique plus exacte, et corrige le littéral de la note sans trancher au-delà du sens idiomatique attesté.
