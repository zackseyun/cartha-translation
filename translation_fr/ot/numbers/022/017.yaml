  text: כִּֽי כַבֵּ֤ד אֲכַבֶּדְ/ךָ֙ מְאֹ֔ד וְ/כֹ֛ל אֲשֶׁר תֹּאמַ֥ר אֵלַ֖/י אֶֽעֱשֶׂ֑ה וּ/לְכָ/ה נָּא֙ קָֽבָ/ה לִּ֔/י אֵ֖ת הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: fr
  text: Car je te comblerai d’honneurs[a] et je ferai tout ce que tu me diras. Viens donc, je t’en prie, maudis ce peuple pour moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je t’honorerai grandement » ou « je te récompenserai généreusement ». L’hébreu associe un infinitif absolu au verbe conjugué pour renforcer la promesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la promesse de Balak comme motif de sa demande renouvelée et maintient clairement le lien logique avec le contexte.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: je te comblerai d’honneurs
  rationale: L’infinitif absolu joint au verbe conjugué, renforcé par מְאֹד, exprime une forte insistance. Cette tournure française naturelle conserve le vocabulaire de l’honneur sans le réduire à une simple récompense financière.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: et je ferai tout ce que tu me diras
  rationale: Rend la portée générale de כֹל אֲשֶׁר dans un ordre idiomatique en français, tout en conservant l’idée de paroles adressées directement à Balak.
- source_word: וּלְכָה נָּא
  choice: Viens donc, je t’en prie
  rationale: « Viens » traduit l’impératif de mouvement; « je t’en prie » rend la particule נָא, qui marque ici une demande insistante et courtoise. « donc » relie l’appel aux promesses précédentes.
- source_word: קָבָה
  choice: maudis
  rationale: Dans ce contexte, le verbe désigne l’action de prononcer ou d’appeler une malédiction contre le peuple.
- source_word: לִּי
  choice: pour moi
  rationale: Conserve simplement l’intérêt personnel de Balak dans l’action demandée.
- source_word: אֵת הָעָם הַזֶּה
  choice: ce peuple
  rationale: Respecte le singulier collectif de עָם et constitue la formulation française naturelle.
