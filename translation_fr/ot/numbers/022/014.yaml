  text: וַ/יָּק֨וּמוּ֙ שָׂרֵ֣י מוֹאָ֔ב וַ/יָּבֹ֖אוּ אֶל בָּלָ֑ק וַ/יֹּ֣אמְר֔וּ מֵאֵ֥ן בִּלְעָ֖ם הֲלֹ֥ךְ עִמָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/014.yaml
  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: fr
  text: 'Les dignitaires de Moab se levèrent, retournèrent auprès de Balak et lui dirent : « Balaam a refusé d’aller avec nous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: les dignitaires de Moab
  rationale: שָׂרִים désigne ici les représentants de haut rang envoyés par Balak ; « dignitaires » est naturel en français et convient mieux au contexte que le terme administratif moderne « fonctionnaires ».
- source_word: וַיָּק֨וּמוּ֙
  choice: se levèrent donc
  rationale: Conserve l'image hébraïque de l'action de se lever pour partir, tandis que « donc » exprime naturellement la progression narrative.
- source_word: וַיָּבֹאוּ אֶל־בָּלָק
  choice: retournèrent auprès de Balak
  rationale: Le verbe signifie littéralement « vinrent auprès de Balak » ; le contexte montre qu'ils reviennent vers celui qui les avait envoyés. « Auprès de » évite de suggérer qu'ils pénétrèrent dans Balak.
- source_word: מֵאֵן
  choice: a refusé
  rationale: Rend directement le refus volontaire exprimé par le verbe hébreu.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: de venir avec nous
  rationale: Après « refuser », l'infinitif français exprime naturellement la construction hébraïque. Du point de vue des messagers parlant à Balak, « venir » convient à leur destination commune.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concise et conserve la succession des actions ainsi que le discours direct de l'hébreu.
