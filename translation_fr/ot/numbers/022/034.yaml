  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: fr
  text: 'Alors Balaam dit à l’ange de Yahweh[a] : « J’ai péché, car je ne savais pas que tu te tenais sur la route pour t’opposer à moi. Maintenant, si cela est mal à tes yeux[b], je ferai demi-tour. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le messager de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Expression hébraïque pouvant signifier : « si tu trouves cela mauvais » ou « si cela te déplaît ».'
    reason: idiom_clarification
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans ce récit, il s’agit d’un être surnaturel qui se rend visible et barre la route à Balaam ; « ange » convient donc au contexte, tandis que le nom divin est translittéré « Yahweh ».
- source_word: חָטָאתִי
  choice: J’ai péché
  rationale: Le parfait exprime ici l’aveu d’une faute dont la portée demeure actuelle ; la formulation est naturelle dans une confession en français.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: car je ne savais pas
  rationale: כִּי introduit la raison donnée par Balaam. L’imparfait français convient à son ignorance pendant le trajet.
- source_word: נִצָּב לִקְרָאתִי
  choice: tu te tenais sur la route pour t’opposer à moi
  rationale: נִצָּב exprime une position ferme, et לִקְרָאתִי signifie littéralement « à ma rencontre ». Le contexte de l’épée dégainée et de la route barrée donne à cette rencontre une force hostile, rendue par « t’opposer à moi » sans effacer l’image de la position sur la route.
- source_word: בַּדָּרֶךְ
  choice: sur la route
  rationale: Rendu locatif direct et idiomatique dans le contexte d’un déplacement.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: si cela est mal à tes yeux
  rationale: La formulation conserve l’idiome hébreu et son poids moral, plutôt que de l’affaiblir en simple déplaisir.
- source_word: אָשׁוּבָה לִּי
  choice: je ferai demi-tour
  rationale: Le cohortatif exprime la volonté ou la disposition de Balaam à revenir sur ses pas. « Faire demi-tour » est naturel et précis dans cette scène de voyage ; le datif לִּי n’exige pas de rendu autonome.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin personnel. « Yahweh » le conserve comme nom plutôt que de lui substituer un titre, sans ajouter d’interprétation confessionnelle.
- issue: Portée de לִקְרָאתִי
  choice: pour t’opposer à moi
  alternative: pour venir à ma rencontre
  rationale: Le sens lexical de rencontre demeure en arrière-plan, mais l’ange se tient sur le chemin avec une épée dégainée afin de faire obstacle à Balaam. Le rendu choisi exprime cette force adversative contextuelle sans identifier davantage la nature de la faute.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste sobre. L’idiome « mal à tes yeux » est conservé dans le texte pour respecter la formulation hébraïque, avec une note explicative.
