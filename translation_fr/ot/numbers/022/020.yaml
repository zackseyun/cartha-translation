  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: fr
  text: 'Dieu vint auprès de Balaam pendant la nuit et lui dit : « Si les hommes sont venus t’appeler[a], lève-toi et pars avec eux. Mais tu feras uniquement ce que je te dirai[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sont venus te faire venir » ou « sont venus t’inviter ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mais seulement la parole que je te dirai, c’est elle que tu feras » ; « parole » peut aussi signifier « chose » ou « affaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint auprès de
  rationale: Le verbe בוא décrit ici la venue de Dieu auprès de Balaam. Cette formulation reste proche de l’hébreu sans préciser indûment le mode de manifestation.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le texte porte אֱלֹהִים, et non le nom divin YHWH ; la traduction maintient cette distinction.
- source_word: לַיְלָה
  choice: pendant la nuit
  rationale: Expression temporelle naturelle en français moderne qui conserve le cadre nocturne.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: Si ces hommes sont venus pour te convoquer
  rationale: « Convoquer » exprime naturellement dans ce contexte le but de leur venue, tandis que la note conserve l’alternative plus littérale « appeler ».
- source_word: קוּם לֵךְ
  choice: lève-toi et pars
  rationale: La traduction conserve les deux impératifs hébreux dans une coordination naturelle en français.
- source_word: אִתָּם
  choice: avec eux
  rationale: Rendu direct et clair de la préposition avec son suffixe pronominal.
- source_word: וְאַךְ
  choice: Mais… uniquement
  rationale: 'Cette construction rend la restriction forte introduite par אַךְ : Balaam peut partir, mais son action demeure strictement limitée par la parole divine.'
- source_word: הַדָּבָר אֲשֶׁר אֲדַבֵּר אֵלֶיךָ אֹתוֹ תַעֲשֶׂה
  choice: tu feras uniquement ce que je te dirai
  rationale: Ce rendu idiomatique conserve le sens et l’autorité de l’ordre. Une traduction mot à mot avec « faire la parole » serait peu naturelle en français moderne ; la note signale la formulation littérale et l’emphase de l’objet antéposé.
theological_decisions:
- issue: Désignation divine dans ce verset
  choice: Dieu
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement אֱלֹהִים dans ce verset plutôt que le tétragramme YHWH. La traduction évite donc d’harmoniser avec les versets voisins.
- issue: Portée de la permission accordée à Balaam
  choice: Conserver à la fois l’autorisation de partir et sa limitation stricte
  alternative: Reformuler de manière à présenter le départ lui-même comme interdit ou pleinement approuvé
  rationale: Le verset autorise explicitement Balaam à partir si les hommes sont venus le convoquer, tout en subordonnant son action à ce que Dieu lui dira. La traduction ne résout pas la tension narrative avec la suite du récit.
translation_notes:
  register: Français international moderne, digne et accessible. « Vint auprès de » garde la sobriété narrative ; « lève-toi et pars » restitue les deux impératifs sans archaïsme. La dernière proposition privilégie une syntaxe française naturelle, tandis que la note conserve la structure emphatique et l’éventail sémantique de דָּבָר.
