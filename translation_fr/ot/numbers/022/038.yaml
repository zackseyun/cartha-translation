  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: fr
  text: 'Balaam dit à Balak : « Me voici, je suis maintenant venu vers toi. Suis-je vraiment capable de dire quoi que ce soit ? Je ne dirai que la parole que Dieu mettra dans ma bouche. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Me voici
  rationale: Dans ce contexte d’arrivée devant Balak, « Me voici » conserve la force présentative de l’hébreu tout en étant naturel en français moderne.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: je suis venu vers toi maintenant
  rationale: Cette formulation rend explicitement le parfait et l’adverbe עַתָּה, en soulignant l’arrivée présente de Balaam.
- source_word: הֲיָכוֹל אוּכַל
  choice: Suis-je vraiment capable
  rationale: L’infinitif absolu associé au verbe conjugué intensifie la capacité; « vraiment » restitue cette emphase dans une question rhétorique naturelle.
- source_word: דַּבֵּר מְאוּמָה
  choice: de dire quoi que ce soit
  rationale: « Quoi que ce soit » rend la portée indéfinie et emphatique de מְאוּמָה avec un français idiomatique.
- source_word: הַדָּבָר
  choice: la parole
  rationale: Dans ce contexte prophétique, « la parole » préserve le singulier concret tout en évoquant un énoncé donné par Dieu.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: que Dieu mettra dans ma bouche
  rationale: La formulation conserve la métaphore hébraïque de la parole placée dans la bouche du messager.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: Je dirai … elle seule
  rationale: La reprise pronominale antéposée en hébreu marque la focalisation restrictive. « Elle seule » explicite cette exclusivité sans modifier le contenu de la parole.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom régit ici un verbe singulier et désigne Dieu comme celui qui donne autoritairement la parole à Balaam.
theological_decisions:
- issue: Maîtrise divine de la parole de Balaam
  choice: Balaam affirme son incapacité à prononcer autre chose que la parole mise dans sa bouche par Dieu.
  alternative: Balaam serait libre de parler comme il le souhaite, mais choisirait volontairement de se limiter.
  rationale: La question emphatique sur sa capacité, suivie de la focalisation « elle seule », présente une parole prophétique contrainte plutôt qu’une simple préférence, sans préciser davantage le mécanisme de cette contrainte.
translation_notes:
  register: Français international moderne, digne et accessible. « Me voici » garde une légère solennité biblique sans archaïsme marqué; la syntaxe finale préserve l’insistance de l’hébreu.
