  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: fr
  text: 'Il envoya donc des messagers auprès de Balaam, fils de Béor, à Péthor, qui se trouve près du Fleuve[a], dans le pays des fils de son peuple[b], pour l’appeler, en lui disant : « Voici qu’un peuple est sorti d’Égypte. Voici qu’il a couvert la face du pays[c], et il habite en face de moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu dit « le Fleuve » ; il s’agit vraisemblablement de l’Euphrate.
    reason: cross_reference
  - marker: b
    text: Ou « dans le pays de son peuple ». L’expression hébraïque « le pays des fils de son peuple » est difficile, et le référent de « son » est incertain.
    reason: alternative_reading
  - marker: c
    text: Littéralement « l’œil du pays », expression qui désigne sa surface visible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il envoya donc
  rationale: Le wayyiqtol fait progresser le récit. « Donc » rend naturellement ici l’enchaînement avec le contexte précédent sans alourdir la narration.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte diplomatique, le terme désigne clairement des envoyés humains et non des anges.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaam, fils de Béor
  rationale: Les noms propres suivent leur forme française biblique courante.
- source_word: פְּתוֹרָה
  choice: à Petor
  rationale: La terminaison directionnelle indique un mouvement vers le lieu. La construction française situe naturellement Balaam à Petor tout en exprimant la destination des messagers.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: qui se trouve près du Fleuve
  rationale: Le texte dit littéralement « le Fleuve », désignation qui renvoie vraisemblablement à l’Euphrate. Le nom générique est conservé dans le texte, avec identification en note.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: dans le pays des fils de son peuple
  rationale: Cette formulation conserve la structure difficile de l’hébreu et l’ambiguïté du possessif, plutôt que de choisir silencieusement une interprétation.
- source_word: לִקְרֹא לוֹ
  choice: pour l’appeler
  rationale: L’infinitif exprime le but. « Appeler » reste proche du sens ordinaire du verbe sans lui donner la nuance plus autoritaire de « convoquer ».
- source_word: לֵאמֹר
  choice: Il lui fit dire
  rationale: Cette tournure française introduit naturellement le message transmis par les envoyés et explicite sans excès la formule hébraïque de discours.
- source_word: הִנֵּה
  choice: Voici
  rationale: Répété deux fois, « voici » conserve la force d’appel à l’attention de la particule hébraïque dans un registre digne et actuel.
- source_word: עַם
  choice: un peuple
  rationale: « Peuple » est l’équivalent direct et convient à un groupe humain de dimension nationale.
- source_word: יָצָא מִמִּצְרַיִם
  choice: est sorti d’Égypte
  rationale: Le passé composé présente naturellement en français un événement accompli qui demeure pertinent pour la situation décrite.
- source_word: כִסָּה אֶת עֵין הָאָרֶץ
  choice: a couvert la face du pays
  rationale: Littéralement, l’expression parle de « l’œil du pays ». « La face du pays » conserve l’image corporelle tout en restant compréhensible en français.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: et il s’est établi en face de moi
  rationale: Le verbe peut exprimer le fait d’habiter, de séjourner ou d’être installé. « S’est établi » convient au peuple campé dans la région, tandis que « en face de moi » conserve la perspective personnelle du locuteur.
