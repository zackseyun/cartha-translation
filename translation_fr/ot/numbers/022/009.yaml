  text: וַ/יָּבֹ֥א אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֕אמֶר מִ֛י הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: fr
  text: 'Alors Dieu vint auprès de Balaam et dit : « Qui sont ces hommes qui sont avec toi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint vers
  rationale: Le qal wayyiqtol de בוא fait avancer le récit et exprime ici la venue de Dieu auprès de Balaam. « Vint vers » est naturel en français et évite de préciser indûment une entrée physique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Avec le verbe au singulier et dans ce contexte narratif, אֱלֹהִים désigne Dieu personnellement.
- source_word: אֶל בִּלְעָם
  choice: vers Balaam
  rationale: La préposition אֶל marque le mouvement en direction de Balaam ; « vers » convient naturellement après « vint ».
- source_word: וַיֹּאמֶר
  choice: et dit
  rationale: אמר introduit directement les paroles prononcées ; « dit » est l’équivalent français courant et précis.
- source_word: מִי
  choice: Qui
  rationale: L’interrogatif demande l’identité de personnes déterminées.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ces hommes
  rationale: Le nom masculin pluriel désigne ici les envoyés masculins présents, et le démonstratif les montre comme immédiatement concernés.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: עם suivi du suffixe pronominal exprime ici l’accompagnement ou la présence auprès de Balaam.
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif initial marque la progression de l’action ; « Alors » restitue cette succession avec naturel en français moderne.
theological_decisions:
- issue: Référent de אֱלֹהִים dans le récit de Balaam
  choice: Dieu
  alternative: un dieu / un être divin
  rationale: Même si אֱלֹהִים peut avoir d’autres sens ailleurs, l’accord verbal au singulier et le contexte immédiat indiquent ici Dieu comme interlocuteur de Balaam, sans qu’il soit nécessaire d’ajouter une précision doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la brièveté de l’hébreu et le caractère direct de la question divine.
