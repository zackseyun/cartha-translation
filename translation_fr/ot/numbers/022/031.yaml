id: NUM.22.31
reference: Numbers 22:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: fr
  text: Alors Yahweh ouvrit les yeux de Balaam[a], et il vit l’ange de Yahweh[b] qui se tenait sur la route, son épée dégainée à la main. Il s’inclina et se prosterna, face contre terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dévoila les yeux de Balaam ». Le verbe hébreu signifie littéralement « découvrir » ou « enlever ce qui couvre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le messager de Yahweh ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « vers sa face »; l’expression décrit une prosternation face contre terre.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיְגַל
  choice: dévoila
  rationale: Le verbe גלה signifie littéralement « découvrir, dévoiler ». « Dévoila les yeux » conserve l’image hébraïque d’un obstacle à la vision qui est ôté, tout en restant intelligible; la tournure plus idiomatique « ouvrit les yeux » est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: עֵינֵי בִלְעָם
  choice: les yeux de Balaam
  rationale: Cette formulation naturelle en français reproduit fidèlement la chaîne construite hébraïque.
- source_word: וַיַּרְא
  choice: Celui-ci vit
  rationale: Le passé simple convient au récit et exprime le résultat immédiat du dévoilement des yeux; « celui-ci » évite une répétition lourde et identifie clairement Balaam.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager, mais « ange » est ici le terme français usuel pour cet être surnaturel; l’autre sens est conservé en note.
- source_word: נִצָּב
  choice: qui se tenait
  rationale: Le participe décrit une position stable et présente; « se tenait » est naturel dans ce contexte narratif.
- source_word: בַּדֶּרֶךְ
  choice: sur la route
  rationale: Le contexte de déplacement indique une voie concrète, et « sur la route » exprime naturellement en français la position obstructive de l’ange.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: son épée dégainée à la main
  rationale: La formulation rend la proposition circonstancielle hébraïque et conserve explicitement l’épée tirée ainsi que sa présence dans la main.
- source_word: וַיִּקֹּד
  choice: Il s’inclina
  rationale: Le verbe décrit l’action de courber profondément le corps sans préciser davantage la posture.
- source_word: וַיִּשְׁתַּחוּ
  choice: et se prosterna
  rationale: Le choix garde au premier plan le geste corporel sans imposer le sens théologique plus explicite d’« adorer ».
- source_word: לְאַפָּיו
  choice: face contre terre
  rationale: Cette expression française naturelle communique l’image concrète de la face dirigée vers le sol.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme; sa translittération préserve le nom personnel au lieu de lui substituer un titre.
- issue: Valeur de וַיִּשְׁתַּחוּ
  choice: geste corporel de prosternation
  alternative: adora
  rationale: Le verbe peut décrire l’adoration, mais le contexte détaille avant tout la réaction physique de Balaam. « Se prosterna » conserve cette tension sans déterminer à lui seul la portée cultuelle du geste.
- issue: Identification de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: « Ange » convient au personnage surnaturel du récit, tandis que la possibilité lexicale « messager » reste visible dans la note sans imposer une identification théologique plus précise.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple soutient le registre biblique sans archaïsme marqué. La syntaxe est légèrement lissée pour le français, tout en maintenant l’image inhabituelle des yeux « dévoilés », expliquée en note.
