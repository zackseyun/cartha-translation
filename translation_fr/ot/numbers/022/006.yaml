  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: fr
  text: Et maintenant, viens, je t’en prie, maudire ce peuple pour moi, car il est plus puissant que moi.[a] Peut-être pourrai-je le frapper, et nous le chasserons du pays,[b] car je sais que celui que tu bénis est béni et que celui que tu maudis est maudit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il est trop nombreux pour moi ». Le terme hébreu peut évoquer la puissance ou la supériorité numérique.'
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « Peut-être pourrai-je le frapper, et nous le chasserons ». L’hébreu passe ici de la première personne du singulier à la première personne du pluriel.'
    reason: source_form
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois la transition discursive et l’urgence de la requête.
- source_word: לְכָה נָּא
  choice: viens, je t’en prie
  rationale: L’impératif suivi de la particule d’insistance ou de supplication appelle une invitation pressante mais polie.
- source_word: אָרָה לִּי אֶת הָעָם הַזֶּה
  choice: maudire ce peuple pour moi
  rationale: « Maudire » exprime directement l’invocation d’un malheur; « pour moi » conserve l’intérêt personnel indiqué par לִּי.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: car il est plus puissant que moi
  rationale: Le singulier reprend le nom collectif « peuple ». « Plus puissant » conserve la comparaison et la menace militaire, tandis qu’une note signale la nuance possible de supériorité numérique.
- source_word: אוּלַי אוּכַל נַכֶּה בּוֹ
  choice: Peut-être pourrai-je le frapper
  rationale: La formulation garde l’incertitude de אוּלַי, la capacité exprimée par אוּכַל et le sens concret de נכה. Une note signale le passage de la première personne du singulier à celle du pluriel dans l’hébreu.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: et le chasser du pays
  rationale: Le pronom singulier respecte le traitement du peuple comme nom collectif; « chasser du pays » rend naturellement l’expulsion territoriale.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: celui que tu bénis est béni
  rationale: Conserve la construction générique ainsi que l’état résultant exprimé par le participe passif.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: et celui que tu maudis est maudit
  rationale: Maintient le parallélisme exact avec la proposition précédente et la force passive ou résultative de יוּאָר.
theological_decisions:
- issue: Efficacité attribuée à la bénédiction et à la malédiction de Balaam
  choice: 'Conserver sans commentaire l’affirmation de Balak : « celui que tu bénis est béni… celui que tu maudis est maudit »'
  alternative: Préciser que Balak croit seulement à cette efficacité
  rationale: Le verset rapporte les paroles de Balak sans évaluer ici leur vérité théologique; ajouter une qualification résoudrait une tension que le texte laisse ouverte à ce stade du récit.
translation_notes:
  register: Français international actuel, digne et accessible. Le peuple est traité comme un nom collectif singulier (« il », « le »), conformément à l’hébreu et à l’usage naturel du français. La prière pressante reste perceptible sans tournure archaïque.
