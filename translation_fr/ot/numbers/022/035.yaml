  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: fr
  text: 'Alors l’ange de Yahweh[a] dit à Balaam : « Va avec les hommes, mais tu ne diras que la parole que je te dirai[b]. » Balaam partit donc avec les dignitaires de Balak[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le messager de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « le message » ou « l’affaire ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les chefs de Balak » ; traditionnellement : « les princes de Balak ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans ce récit, l’être surnaturel qui barre la route à Balaam est naturellement désigné comme « l’ange de Yahweh », tandis que la note conserve l’autre valeur lexicale.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: Va avec ces hommes
  rationale: L’impératif et עִם sont rendus directement. Le démonstratif français « ces » reprend naturellement les hommes déjà présents dans la scène, bien que l’hébreu emploie littéralement l’article défini.
- source_word: וְאֶפֶס
  choice: Mais… ne… que
  rationale: Dans ce contexte, אֶפֶס impose une restriction forte à la permission donnée. La tournure française « Mais tu ne diras que… » exprime clairement cette limitation.
- source_word: הַדָּבָר
  choice: la parole
  rationale: דָּבָר peut signifier parole, message, chose ou affaire. Dans cette construction avec le verbe דבר répété, « parole » convient au contexte de discours et préserve le lien lexical.
- source_word: אֲדַבֵּר אֵלֶיךָ אֹתוֹ תְדַבֵּר
  choice: tu ne diras que la parole que je te dirai
  rationale: 'Le futur français correspond à la valeur prospective des formes verbales. La restriction « ne… que » et l’objet antéposé אֹתוֹ rendent l’exclusivité : Balaam doit prononcer cette parole, et aucune autre.'
- source_word: שָׂרֵי בָלָק
  choice: les dignitaires de Balak
  rationale: שָׂרִים désigne des chefs, hauts responsables ou dignitaires. « Dignitaires » convient à cette délégation officielle sans laisser entendre qu’ils sont nécessairement des fils de roi.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte le tétragramme, rendu ici par la translittération « Yahweh » afin de préserver le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de l’autorisation accordée à Balaam
  choice: permission strictement limitée à la parole communiquée par Yahweh
  alternative: ordre général de partir et de parler librement
  rationale: וְאֶפֶס et l’emphase sur אֹתוֹ restreignent explicitement ce que Balaam pourra dire, sans résoudre au-delà du texte la tension narrative entre l’autorisation de partir et l’opposition divine antérieure.
translation_notes:
  register: Français international moderne, clair et digne. « Alors » assure la continuité narrative ; « partit donc » rend naturellement וַיֵּלֶךְ. La formulation privilégie une syntaxe française idiomatique tout en conservant la restriction emphatique de l’hébreu et ses principales possibilités lexicales en notes.
