  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַֽ/יַּחֲבֹ֖שׁ אֶת אֲתֹנ֑/וֹ וַ/יֵּ֖לֶךְ עִם שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: fr
  text: Balaam se leva le matin, sella son ânesse et alla avec les dignitaires de Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום décrit simplement le fait de se lever; « se leva » est naturel et direct en français.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Translittération française traditionnelle et largement reconnue du nom propre.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: L’expression signifie simplement « le matin »; le texte hébreu ne précise pas « de bon matin ».
- source_word: וַיַּחֲבֹשׁ
  choice: sella
  rationale: Avec une ânesse pour complément, חבש désigne idiomatiquement l’action de seller ou de préparer la monture.
- source_word: אֶת אֲתֹנוֹ
  choice: son ânesse
  rationale: Le nom אָתוֹן désigne explicitement une ânesse; le français permet de conserver naturellement cette précision dans le corps du texte, sans note.
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Dans ce contexte de départ avec les dignitaires, « partit » rend naturellement le mouvement exprimé par הלך, sans ajouter l’idée plus développée de voyage.
- source_word: עִם
  choice: avec
  rationale: Équivalent français direct de la préposition d’accompagnement.
- source_word: שָׂרֵי מוֹאָב
  choice: les dignitaires de Moab
  rationale: שָׂרִים désigne ici des personnages de haut rang investis d’une fonction politique; « dignitaires » conserve leur statut élevé sans supposer qu’ils sont princes de sang.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. La succession narrative hébraïque est rendue sans lourde répétition de « et »; « donc » relie naturellement ce geste à l’autorisation conditionnelle du verset précédent. La précision féminine d’אָתוֹן est conservée directement par « ânesse ».
