source:
  edition: WLC
  text: וַ/יָּ֨גָר מוֹאָ֜ב מִ/פְּנֵ֥י הָ/עָ֛ם מְאֹ֖ד כִּ֣י רַב ה֑וּא וַ/יָּ֣קָץ מוֹאָ֔ב מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: fr
  text: Moab eut très peur de ce peuple, car il était nombreux ; et Moab fut pris d’effroi devant les Israélites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Moab éprouva de la répulsion devant les Israélites » ou « Moab fut accablé à cause des Israélites ». Le verbe hébreu peut exprimer la répulsion, l’accablement ou une peur viscérale ; le contexte favorise ici l’idée d’effroi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: eut très peur
  rationale: Le verbe גור exprime ici la peur ou l’effroi ; avec מְאֹד, « eut très peur » rend naturellement l’intensité en français moderne.
- source_word: מִפְּנֵי
  choice: de / devant
  rationale: L’expression signifie littéralement « de devant la face de ». Avec la peur, « avoir peur de » est idiomatique ; dans la seconde proposition, « devant » conserve davantage l’image hébraïque sans raideur.
- source_word: הָעָם
  choice: ce peuple
  rationale: Le nom collectif désigne le peuple d’Israël déjà présent dans le contexte. Le démonstratif français explicite naturellement cette référence contextuelle sans ajouter une nouvelle identification.
- source_word: כִּי רַב הוּא
  choice: car il était nombreux
  rationale: Le singulier « il » respecte l’accord hébreu avec le nom collectif « peuple », tandis que « nombreux » exprime ici la grande taille de la population.
- source_word: וַיָּקָץ
  choice: fut pris d’effroi
  rationale: Le verbe קוץ peut évoquer la répulsion, l’accablement ou une peur viscérale. Dans ce contexte de crainte, « fut pris d’effroi » communique une détresse intense, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël ». « Les Israélites » est la désignation collective naturelle et inclusive en français contemporain, sans suggérer que seuls les hommes sont visés.
- source_word: מוֹאָב
  choice: Moab
  rationale: Transcription française traditionnelle du nom propre ; le contexte permet de comprendre Moab comme le peuple ou le pays personnifié.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Moab » et la structure causale du verset sont conservées. « Les Israélites » évite le calque peu naturel « les fils d’Israël », tout en rendant clairement le collectif.
