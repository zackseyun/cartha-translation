  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְב֣וֹת מוֹאָ֔ב מֵ/עֵ֖בֶר לְ/יַרְדֵּ֥ן יְרֵחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: fr
  text: Les fils d’Israël partirent et campèrent dans les plaines de Moab, au-delà du Jourdain, en face de Jéricho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « au-delà du Jourdain » dépend du point de vue adopté. Le camp se trouvait dans les plaines de Moab, à l’est du Jourdain, en face de Jéricho.
    reason: geographical_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partirent
  rationale: Dans les récits de déplacement au désert, נסע désigne le fait de lever le camp et de se mettre en route. « Partirent » est naturel en français moderne et convient au contexte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend formellement l’expression hébraïque, désignation collective habituelle du peuple, sans la réduire silencieusement à « les Israélites ».
- source_word: וַיַּחֲנוּ
  choice: campèrent
  rationale: Traduction directe et courante de חנה, sans la tonalité plus soutenue de « établirent leur camp ».
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: עַרְבוֹת désigne ici les terres planes ou steppiques de Moab. « Plaines » est clair, naturel et géographiquement établi.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: au-delà du Jourdain
  rationale: Préserve la relation géographique relative exprimée par l’hébreu sans fixer davantage le point de vue du narrateur.
- source_word: יְרֵחוֹ
  choice: en face de Jéricho
  rationale: Dans cette construction géographique, Jéricho sert de repère sur l’autre rive. « En face de Jéricho » explicite naturellement cette relation et évite de donner à entendre que le camp se trouvait dans la ville.
theological_decisions: []
