  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: fr
  text: Au matin, Balak prit Balaam et le fit monter à Bamoth-Baal[a]. De là, il vit l’extrémité du peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux hauts lieux de Baal », si l’expression est comprise comme une description plutôt que comme le nom de lieu Bamoth-Baal.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que seule la partie la plus extérieure d’Israël était visible depuis cet endroit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Au matin
  rationale: La formule hébraïque fait avancer le récit et situe l’action au matin. « Au matin » est naturel et digne, sans préciser explicitement « le lendemain », qui reste implicite dans la succession narrative.
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie couramment « prendre ». Ici, Balak emmène Balaam avec lui ; « prit » conserve la sobriété et l’étendue du terme hébreu.
- source_word: וַיַּעֲלֵהוּ
  choice: le fit monter
  rationale: La forme causative de עלה signifie « faire monter ». Cette traduction rend explicitement le causatif et le déplacement vers un lieu élevé.
- source_word: בָּמוֹת בָּעַל
  choice: Bamoth-Baal
  rationale: Dans ce contexte, l’expression fonctionne vraisemblablement comme un nom de lieu composé. La translittération française conserve ce toponyme, tandis qu’une note signale la lecture descriptive possible.
- source_word: וַיַּרְא
  choice: il vit
  rationale: 'ראה est le verbe courant pour « voir ». Le pronom « il » conserve la formulation du texte : le contexte favorise Balaam comme sujet, sans que le français impose un nom absent de l’hébreu.'
- source_word: מִשָּׁם
  choice: De là
  rationale: Cette expression locative désigne simplement le point depuis lequel la scène est observée.
- source_word: קְצֵה הָעָם
  choice: l’extrémité du peuple
  rationale: קצה désigne le bout, la limite ou l’extrémité. Cette formulation reste proche de l’image hébraïque sans remplacer « le peuple » par « le camp » ni réduire le sens à une partie quelconque.
