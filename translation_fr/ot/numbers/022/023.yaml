source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: fr
  text: L’ânesse vit l’ange de Yahweh qui se tenait sur le chemin, son épée dégainée à la main.[a] Elle quitta alors le chemin et alla dans le champ. Balaam frappa l’ânesse pour la ramener sur le chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ».
    reason: Alternative lexicale de מַלְאַךְ, qui peut désigner un messager ou un ange.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: l’ânesse
  rationale: Le nom אָתוֹן désigne explicitement une ânesse; le français courant permet de conserver naturellement cette précision de genre.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut signifier « messager » ou « ange »; dans cette scène surnaturelle où il porte une épée dégainée, « ange » convient au contexte, sans effacer l’autre valeur possible signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: qui se tenait sur le chemin
  rationale: Le participe exprime une position maintenue. « Se tenait sur le chemin » est naturel en français et suggère que l’ange en barre le passage.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: son épée dégainée à la main
  rationale: Cette formulation conserve l’image concrète de l’épée sortie de son fourreau et tenue en main, dans un français fluide.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: elle quitta alors le chemin
  rationale: Le verbe נָטָה indique ici que l’ânesse s’écarte de son trajet. « Quitta le chemin » exprime clairement ce mouvement sans lourdeur.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: alla dans le champ
  rationale: שָׂדֶה désigne ici un champ ou terrain ouvert; « le champ » garde le caractère concret de la scène.
- source_word: וַיַּךְ
  choice: frappa
  rationale: נכה désigne l’action de frapper; le verbe simple ne précise pas à lui seul que les coups auraient été répétés.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: pour la ramener sur le chemin
  rationale: Après que l’ânesse a quitté le chemin, l’infinitif causatif exprime l’intention de Balaam de l’y faire retourner. « Ramener » explicite naturellement cette relation contextuelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » en conserve la fonction de nom plutôt que de lui substituer un titre.
- issue: Sens de מַלְאַךְ dans l’expression מַלְאַךְ יְהוָה
  choice: ange
  alternative: messager
  rationale: Le contexte présente un être surnaturel visible par l’ânesse et armé d’une épée; « ange » est donc le sens contextuel le plus direct, tandis que l’ambiguïté lexicale est préservée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le choix « ânesse » conserve une donnée explicite de l’hébreu sans paraître technique. La syntaxe évite un calque lourd tout en maintenant l’ordre des actions et l’image de l’épée dégainée.
