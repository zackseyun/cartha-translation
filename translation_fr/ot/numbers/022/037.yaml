revisions:
- from: 'Balak dit à Balaam : « Ne t’avais-je pas expressément envoyé appeler ? Pourquoi n’es-tu pas venu auprès de moi ? Ne suis-je donc vraiment pas en mesure de te combler d’honneurs[a] ? »'
  to: 'Balak dit à Balaam : « Ne t’avais-je pas bel et bien envoyé appeler ? Pourquoi n’es-tu pas venu auprès de moi ? Ne suis-je vraiment pas capable de t’honorer[a] ? »'
  rationale: La révision conserve les trois questions rhétoriques, le reproche de Balak et le registre narratif moderne. Elle rend l’emphase de שָׁלֹחַ שָׁלַחְתִּי par « bel et bien », maintient l’idiome français « envoyer appeler », et restitue plus directement כבד par « honorer ».
