  text: וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם הֲ/לֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לִ/קְרֹא לָ֔/ךְ לָ֥/מָּה לֹא הָלַ֖כְתָּ אֵלָ֑/י הַֽ/אֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: fr
  text: 'Balak dit à Balaam : « Ne t’avais-je pas bel et bien envoyé appeler ? Pourquoi n’es-tu pas venu auprès de moi ? Ne suis-je vraiment pas capable de t’honorer[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « T’honorer » peut inclure l’idée de t’accorder une récompense ou un rang élevé, et non simplement de te témoigner du respect.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit le récit. En français, le passé simple suffit naturellement, sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: הֲלֹא
  choice: Ne t’avais-je pas
  rationale: La question négative appelle une réponse affirmative et exprime ici le reproche de Balak.
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: expressément envoyé
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Expressément » rend cette insistance sans imposer l’idée, possible mais non nécessaire, d’envois répétés ou urgents.
- source_word: לִקְרֹא לָךְ
  choice: appeler
  rationale: Dans ce contexte, קרא désigne le fait de faire venir quelqu’un. La construction française « envoyer appeler quelqu’un » est naturelle et fidèle.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: Pourquoi n’es-tu pas venu auprès de moi ?
  rationale: הלך signifie littéralement « aller », mais אֵלָי, dans la bouche de Balak, se rend idiomatiquement par « venir auprès de moi ».
- source_word: הַאֻמְנָם
  choice: donc vraiment
  rationale: La particule marque une interrogation appuyée, teintée d’incrédulité. « Donc vraiment » fait entendre le reproche sans le surcharger.
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: Ne suis-je donc vraiment pas en mesure de te combler d’honneurs ?
  rationale: יכל exprime la capacité, tandis que le piel de כבד signifie conférer de l’honneur. « Combler d’honneurs » est idiomatique en français et peut inclure prestige, rang et récompense sans réduire le sens à un paiement.
