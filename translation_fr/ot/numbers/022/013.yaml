  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: fr
  text: 'Balaam se leva le matin et dit aux dignitaires de Balak[a] : « Retournez dans votre pays, car Yahweh a refusé de me laisser partir avec vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux chefs de Balak » ou « aux princes de Balak ».
    reason: שָׂרִים possède une gamme de sens comprenant dignitaires, chefs et princes.
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום marque l’action suivante. « Se leva » est naturel et garde la forme du récit hébreu.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Expression temporelle courante, rendue simplement sans ajouter l’idée de bonne heure.
- source_word: שָׂרֵי בָלָק
  choice: dignitaires de Balak
  rationale: שָׂרִים peut désigner des chefs, des princes ou de hauts responsables. « Dignitaires » convient aux émissaires d’un roi sans imposer l’idée de fils de roi.
- source_word: לְכוּ אֶל אַרְצְכֶם
  choice: Retournez dans votre pays
  rationale: Dans le contexte, l’impératif leur ordonne de repartir vers leur propre territoire. « Retournez » explicite naturellement cette valeur contextuelle de הלך.
- source_word: כִּי
  choice: car
  rationale: Introduit directement la raison de l’ordre donné, dans un registre narratif digne et courant.
- source_word: מֵאֵן
  choice: a refusé
  rationale: Le piel accompli de מאן exprime un refus arrêté. Le passé composé est naturel dans le discours direct français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, qui conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְתִתִּי לַהֲלֹךְ
  choice: de me laisser partir
  rationale: נתן suivi d’un infinitif a ici le sens idiomatique de permettre. « Laisser partir » rend clairement l’autorisation de se mettre en route.
- source_word: עִמָּכֶם
  choice: avec vous
  rationale: Rend directement l’accompagnement exprimé par עִם.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Équivalent narratif français normal du verbe hébreu de parole.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin sans le remplacer par un titre et sans adopter la forme française traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste concis. « Dignitaires » évite à la fois le terme administratif trop moderne « fonctionnaires » et l’interprétation dynastique possible de « princes ».
