  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ לָֽ/אָת֔וֹן כִּ֥י הִתְעַלַּ֖לְתְּ בִּ֑/י ל֤וּ יֶשׁ חֶ֨רֶב֙ בְּ/יָדִ֔/י כִּ֥י עַתָּ֖ה הֲרַגְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: fr
  text: 'Balaam dit à l’ânesse : « Parce que tu t’es moquée de moi ! Si seulement j’avais une épée à la main, je te tuerais sur-le-champ. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple fait avancer naturellement le récit en français et rend le wayyiqtol sans alourdir la phrase d’un connecteur.
- source_word: לָאָתוֹן
  choice: à l’ânesse
  rationale: Le nom hébreu désigne explicitement une ânesse; le français permet de conserver cette précision de manière naturelle.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: tu t’es moquée de moi
  rationale: Dans ce contexte, le hitpael exprime un traitement humiliant ou moqueur. Cette formulation française est naturelle et conserve l’accusation de Balaam, sans imposer le sens plus fort de maltraitance.
- source_word: לוּ יֶשׁ חֶרֶב בְּיָדִי
  choice: Si seulement j’avais une épée à la main
  rationale: « Si seulement » rend le souhait irréel introduit par לוּ, tandis que « à la main » préserve l’image concrète de l’hébreu.
- source_word: כִּי עַתָּה הֲרַגְתִּיךְ
  choice: je te tuerais sur-le-champ
  rationale: Le conditionnel rend la conséquence irréelle liée au souhait précédent; « sur-le-champ » exprime avec dignité et netteté l’immédiateté de עַתָּה.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La précision féminine de אָתוֹן est directement conservée par « ânesse », ce qui rend inutile une note. L’ambiguïté du verbe הִתְעַלֵּל est rendue par le sens contextuel de moquerie, sans amplification interprétative.
