  text: וַ/יִּזְבַּ֥ח בָּלָ֖ק בָּקָ֣ר וָ/צֹ֑אן וַ/יְשַׁלַּ֣ח לְ/בִלְעָ֔ם וְ/לַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: fr
  text: Balak sacrifia des bovins et du petit bétail[a], puis il en envoya[b] à Balaam et aux dignitaires qui étaient avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne collectivement le petit bétail et peut inclure aussi bien les moutons que les chèvres.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit simplement « il envoya ». Le contexte laisse entendre que Balak envoya une partie de la viande ou des portions provenant des animaux sacrifiés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: sacrifia
  rationale: Le verbe זבח désigne couramment l’abattage sacrificiel. « Sacrifia » restitue clairement et sobrement cette dimension cultuelle.
- source_word: בָּקָר
  choice: des bovins
  rationale: בקר est un collectif désignant le gros bétail bovin. « Des bovins » est précis et n’implique pas uniquement des mâles.
- source_word: צֹאן
  choice: du petit bétail
  rationale: צאן est un terme collectif qui peut comprendre les moutons et les chèvres. « Petit bétail » préserve mieux cette étendue que le seul mot « moutons ».
- source_word: וַיְשַׁלַּח
  choice: il en envoya
  rationale: Le verbe signifie littéralement « il envoya ». Le pronom « en », naturel en français, indique d’après le contexte qu’une partie des animaux sacrifiés ou de leur viande fut envoyée, sans préciser abusivement la nature exacte de l’envoi.
- source_word: לְבִלְעָם
  choice: à Balaam
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: לַשָּׂרִים
  choice: aux dignitaires
  rationale: שׂרים désigne ici des personnages de haut rang. « Dignitaires » convient au cadre ancien sans suggérer nécessairement des princes héréditaires.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui étaient avec lui
  rationale: La proposition relative et le pronom du texte hébreu sont conservés. L’antécédent le plus naturel de « lui » est Balaam.
