  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְ/זִקְנֵ֣י מִדְיָ֔ן וּ/קְסָמִ֖ים בְּ/יָדָ֑/ם וַ/יָּבֹ֨אוּ֙ אֶל בִּלְעָ֔ם וַ/יְדַבְּר֥וּ אֵלָ֖י/ו דִּבְרֵ֥י בָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: fr
  text: Les anciens de Moab et les anciens de Madian partirent donc, emportant avec eux la rétribution pour la divination[a]. Ils arrivèrent auprès de Balaam et lui rapportèrent les paroles de Balak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « emportant avec eux des objets ou des signes divinatoires » ; l’expression hébraïque peut désigner ce qui sert à la divination, mais elle renvoie plus probablement ici à la rétribution apportée au devin.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: les anciens de
  rationale: Dans cette construction avec le nom d’un peuple, le terme désigne les anciens reconnus, qui exercent une fonction sociale et politique. « Les anciens de » conserve cette précision.
- source_word: וּקְסָמִים בְּיָדָם
  choice: emportant avec eux la rétribution pour la divination
  rationale: קְסָמִים peut désigner des pratiques ou objets divinatoires, mais le contexte suggère probablement, par métonymie, la rétribution apportée pour obtenir les services divinatoires de Balaam. « Emportant avec eux » rend naturellement l’expression hébraïque « dans leur main ».
- source_word: וַיָּבֹאוּ אֶל
  choice: Ils arrivèrent auprès de
  rationale: Le verbe בוא avec אֶל exprime l’arrivée auprès de quelqu’un. Cette formulation évite de répéter « partirent » tout en respectant la progression narrative.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: lui rapportèrent
  rationale: Le verbe signifie littéralement « parlèrent à lui ». Avec « les paroles de Balak » comme complément, « lui rapportèrent » exprime naturellement la transmission fidèle du message sans en préciser indûment la forme.
- source_word: דִּבְרֵי בָלָק
  choice: les paroles de Balak
  rationale: Cette traduction formelle préserve l’expression hébraïque et laisse ouverte la question de savoir s’il s’agit de paroles citées ou d’un message confié aux envoyés.
- source_word: וַיֵּלְכוּ
  choice: partirent donc
  rationale: Le waw consécutif fait avancer le récit et marque ici la mise à exécution de l’ordre précédent. « Donc » restitue naturellement ce lien contextuel.
theological_decisions: []
