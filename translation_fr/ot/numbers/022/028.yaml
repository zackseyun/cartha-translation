  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: fr
  text: 'Alors Yahweh ouvrit la bouche de l’ânesse, et elle dit à Balaam : « Que t’ai-je fait pour que tu m’aies frappée à trois reprises[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « ceci, trois pieds » ; « pieds » est ici un idiome pour des occurrences ou des occasions, d’où « à trois reprises ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: ouvrit
  rationale: Le qal wayyiqtol de פתח exprime directement l’action d’ouvrir; le passé simple convient au récit soutenu en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: פִּי הָאָתוֹן
  choice: la bouche de l’ânesse
  rationale: La construction signifie littéralement « la bouche de l’ânesse ». « Ânesse » rend explicitement le genre féminin du nom hébreu et s’accorde naturellement avec la suite.
- source_word: וַתֹּאמֶר
  choice: et elle dit
  rationale: La forme verbale est féminine singulière; le pronom « elle » identifie clairement l’ânesse comme locutrice.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: Que t’ai-je fait
  rationale: Formulation interrogative idiomatique et naturelle qui conserve le sens de la plainte.
- source_word: כִּי הִכִּיתַנִי
  choice: pour que tu me frappes ainsi
  rationale: Dans cette question, כִּי introduit le fait qui motive la plainte. « Pour que » rend naturellement en français le lien implicite entre l’acte supposé de l’ânesse et les coups reçus; « ainsi » souligne la conséquence sans ajouter de contenu doctrinal.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: pour la troisième fois
  rationale: L’expression idiomatique désigne trois occurrences. « Pour la troisième fois » est le tour français le plus naturel dans ce contexte immédiat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme comme nom propre. Sa translittération préserve cette donnée du texte source sans la remplacer par un titre.
- issue: Agent de la parole de l’ânesse
  choice: Yahweh ouvrit la bouche de l’ânesse
  alternative: Yahweh fit parler l’ânesse
  rationale: Le rendu conserve l’image concrète et l’action divine explicite de l’hébreu, sans expliquer davantage le mécanisme du miracle.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique littéraire sans archaïsme marqué. « Ânesse » est courant et rend le féminin explicite.
