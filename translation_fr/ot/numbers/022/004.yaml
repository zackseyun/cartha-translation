  source_fidelity: 'Le texte rend fidèlement la structure et le sens de l’hébreu : Moab personnifié s’adresse aux anciens de Madian, exprime sa crainte devant « cette assemblée », et conserve la répétition imagée de « lécher » dans la comparaison avec le bœuf. « Tout ce qui nous entoure » restitue correctement l’idée de « toutes nos alentours », et « À cette époque » rend bien le cadre temporel final.'
