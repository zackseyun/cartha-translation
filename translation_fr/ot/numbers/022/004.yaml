source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: fr
  text: 'Moab dit aux anciens de Madian : « Maintenant, cette assemblée va lécher tout ce qui nous entoure, comme le bœuf lèche la verdure des champs. » À cette époque, Balak, fils de Tsippor, était roi de Moab.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹאָב
  choice: Moab
  rationale: Le nom national est conservé comme sujet collectif et personnifié, conformément à l’hébreu.
- source_word: זִקְנֵי מִדְיָן
  choice: les anciens de Madian
  rationale: Rend directement le pluriel construit et emploie les formes françaises usuelles des noms propres.
- source_word: הַקָּהָל
  choice: cette assemblée
  rationale: Exprime le groupe rassemblé et la valeur déictique du contexte, sans réduire le terme à une simple foule ni lui donner une connotation ecclésiale.
- source_word: יְלַחֲכוּ / כִּלְחֹךְ
  choice: va lécher / comme le bœuf lèche
  rationale: Préserve la répétition de la racine et l’image concrète de la comparaison hébraïque; le singulier collectif « assemblée » appelle naturellement « va ».
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: tout ce qui nous entoure
  rationale: Formulation française idiomatique qui conserve l’étendue globale de l’expression hébraïque.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: la verdure des champs
  rationale: « Verdure » couvre l’ensemble de la végétation verte plutôt que la seule herbe; le pluriel générique « des champs » est naturel en français.
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: Balak, fils de Tsippor
  rationale: La virgule rend lisible l’apposition patronymique; le waw introduit ici une information d’arrière-plan, exprimée par le cadrage temporel initial.
- source_word: מֶלֶךְ לְמוֹאָב בָּעֵת הַהִוא
  choice: À cette époque, … était roi de Moab
  rationale: Restitue naturellement en français l’information de cadre et le prédicat royal.
