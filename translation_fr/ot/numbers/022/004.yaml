  terminology: « Moab », « Madian », « Balak » et « Tsippor » sont des formes françaises recevables. « Anciens », « assemblée », « roi » et « verdure » sont justes dans ce contexte. « Assemblée » garde la portée collective de qahal sans introduire de lecture confessionnelle imposée. Aucun terme théologique disputé ni aucune ambiguïté textuelle ne nécessitent une note.
