  text: וַ/יַּ֥רְא בָּלָ֖ק בֶּן צִפּ֑וֹר אֵ֛ת כָּל אֲשֶׁר עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽ/אֱמֹרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: fr
  text: Balak, fils de Tsippor, vit tout ce qu’Israël avait fait aux Amorites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « à l’Amorite », au singulier, employé ici collectivement pour désigner les Amorites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le wayyiqtol de ראה fait progresser le récit. Le passé simple convient au registre narratif français sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: בָּלָק
  choice: Balak
  rationale: Translittération française usuelle du nom propre.
- source_word: בֶּן צִפּוֹר
  choice: fils de Tsippor
  rationale: La chaîne construite indique la filiation. « Tsippor » rend le nom selon une translittération adaptée au français.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Expression française naturelle qui conserve l’idée de totalité et introduit la proposition objet.
- source_word: עָשָׂה
  choice: avait fait
  rationale: Le plus-que-parfait exprime naturellement en français l’antériorité des actes d’Israël par rapport au regard de Balak, sans prétendre que cette valeur soit imposée par la seule forme hébraïque.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française conventionnelle du nom du peuple.
- source_word: לָאֱמֹרִי
  choice: aux Amorites
  rationale: La préposition ל désigne ici ceux auxquels l’action a été faite. Le singulier ethnique hébreu a un sens collectif, rendu naturellement par le pluriel français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un style narratif biblique naturel; aucun connecteur tel que « alors » ou « or » n’est ajouté. La formulation conserve la relation large exprimée par ל plutôt que de l’interpréter plus précisément par « contre ».
