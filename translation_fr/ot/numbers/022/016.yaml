  text: וַ/יָּבֹ֖אוּ אֶל בִּלְעָ֑ם וַ/יֹּ֣אמְרוּ ל֗/וֹ כֹּ֤ה אָמַר֙ בָּלָ֣ק בֶּן צִפּ֔וֹר אַל נָ֥א תִמָּנַ֖ע מֵ/הֲלֹ֥ךְ אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: fr
  text: 'Ils vinrent auprès de Balaam et lui dirent : « Voici ce que dit Balak, fils de Tsippor : Je t’en prie, ne te retiens pas de venir auprès de moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: Ils vinrent auprès de Balaam
  rationale: בוא exprime ici l’arrivée des messagers vers Balaam. « Vinrent auprès de » rend naturellement le mouvement dirigé vers une personne.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: et lui dirent
  rationale: Formule narrative française naturelle qui conserve le destinataire explicite du discours.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend la formule de messager avec dignité et naturel en français moderne, sans l’archaïsme de « Ainsi parle ».
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: Balak, fils de Tsippor
  rationale: Les noms propres sont translittérés et la relation filiale est rendue directement.
- source_word: אַל־נָא
  choice: Je t’en prie, ne… pas
  rationale: אַל marque l’interdiction ou la demande négative, tandis que נָא lui donne une nuance d’insistance polie ou de supplication.
- source_word: תִמָּנַע מֵהֲלֹךְ
  choice: refuse pas de venir
  rationale: מנע avec מן et l’infinitif signifie se retenir, s’abstenir ou refuser d’accomplir l’action. Dans ce contexte, « ne refuse pas de venir » exprime clairement la requête sans lourdeur.
- source_word: אֵלָי
  choice: auprès de moi
  rationale: La préposition directionnelle avec le suffixe de première personne désigne Balak comme destination. « Auprès de moi » évite la répétition immédiate de « venir à moi » et reste fidèle.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La formule diplomatique est conservée sans archaïsme; la supplication de נָא demeure audible.
