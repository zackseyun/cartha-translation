base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: fr
  text: 'L’ânesse dit à Balaam : « Ne suis-je pas ton ânesse, celle que tu as montée depuis toujours jusqu’à aujourd’hui ? Ai-je jamais eu l’habitude d’agir ainsi envers toi ? » Il répondit : « Non. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: l’ânesse / ton ânesse
  rationale: Le nom אָתוֹן désigne spécifiquement une ânesse. Le français courant permet de conserver naturellement cette précision lexicale.
- source_word: הֲלוֹא אָנֹכִי
  choice: Ne suis-je pas
  rationale: Cette formulation française naturelle conserve la question rhétorique qui appelle une réponse affirmative.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: celle que tu as montée
  rationale: Le pronom « celle » reprend clairement « ton ânesse », et « monter » exprime naturellement l’action de chevaucher l’animal.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: depuis toujours jusqu’à aujourd’hui
  rationale: Cette expression restitue la durée qui va du passé le plus ancien de Balaam jusqu’au jour présent, sans imposer le sens plus précis de « toute ta vie ».
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: Ai-je l’habitude
  rationale: La construction intensive avec le verbe סכן porte ici sur un comportement habituel. La question française conserve cette valeur et son caractère rhétorique.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: d’agir ainsi envers toi
  rationale: « Ainsi » rend directement כֹּה et renvoie au comportement inhabituel de l’ânesse ; « envers toi » exprime la relation marquée par לְךָ.
- source_word: וַיֹּאמֶר לֹא
  choice: 'Il répondit : « Non. »'
  rationale: Dans ce bref échange, « répondit » est plus naturel en français que la répétition de « dit », tout en conservant exactement la réponse négative.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La précision féminine du terme hébreu est conservée directement par « ânesse », sans nécessiter de note. Le rythme des deux questions et de la réponse brève est maintenu.
