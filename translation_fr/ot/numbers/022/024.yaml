  text: וַֽ/יַּעֲמֹד֙ מַלְאַ֣ךְ יְהוָ֔ה בְּ/מִשְׁע֖וֹל הַ/כְּרָמִ֑ים גָּדֵ֥ר מִ/זֶּ֖ה וְ/גָדֵ֥ר מִ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: fr
  text: Puis l’ange de Yahweh se tint dans un sentier étroit entre les vignes[a], avec un mur d’un côté et un mur de l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le messager de Yahweh ». Le mot hébreu peut désigner un messager ou un ange ; dans le contexte du récit, le sens surnaturel convient.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Puis ... se tint
  rationale: Le wayyiqtol fait progresser le récit. « Puis » marque naturellement la succession, tandis que « se tint » exprime la prise de position.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager ou un ange; le contexte narratif indique ici un être surnaturel. Le nom divin est conservé sous la forme « Yahweh ».
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: dans un sentier étroit entre les vignes
  rationale: מִשְׁעוֹל désigne un chemin resserré ou une piste; les murs de chaque côté justifient « étroit ». Le pluriel הַכְּרָמִים est rendu naturellement par « les vignes ».
- source_word: גָּדֵר מִזֶּה וְגָדֵר מִזֶּה
  choice: avec un mur d’un côté et un mur de l’autre
  rationale: גָּדֵר peut être un mur ou une clôture. « Mur » convient au contexte viticole sans préciser indûment le matériau; la répétition hébraïque est conservée.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le nom divin; sa translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de מַלְאָךְ
  choice: ange
  alternative: messager
  rationale: Bien que le terme puisse signifier « messager », l’apparition surnaturelle dans le récit de Balaam favorise ici « ange ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la répétition des deux murs et n’ajoute pas « de pierre », matériau que l’hébreu ne précise pas.
