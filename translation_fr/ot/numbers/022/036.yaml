  verdict: revise
  source_fidelity: 'Le sens narratif est bien rendu : Balak reçoit la nouvelle de l’arrivée de Balaam et se rend à sa rencontre. Toutefois, « Ir-Moab » transforme une expression hébraïque dont l’analyse reste discutée (עִיר מוֹאָב, litt. « la ville de Moab » / possiblement un toponyme) en nom propre dans le texte courant. Il est plus sûr de conserver l’expression française et de signaler l’autre analyse en note. « À l’extrémité du territoire » rend possible le sens territorial de גְּבוּל et conserve la localisation géographique.'
  naturalness: Le français est globalement fluide et de registre narratif approprié. « Il sortit à sa rencontre jusqu’à Ir-Moab » est cependant un peu lourd et la juxtaposition de « sortit » et « jusqu’à » est moins naturelle. « Il alla à sa rencontre jusqu’à la ville de Moab » exprime clairement le déplacement vers le lieu indiqué.
  terminology: Les noms Balak, Balaam et Arnon sont adéquats. Il convient de ne pas fixer « Ir-Moab » comme toponyme sans indication dans le texte, puisque le syntagme hébreu peut également être compris comme une désignation descriptive. « Frontière » puis « territoire » est un choix français naturel qui reflète les sens possibles de גְּבוּל; la note conserve l’alternative.
  issues:
  - severity: medium
    issue: « Ir-Moab » impose dans le texte une lecture toponymique incertaine de עִיר מוֹאָב.
    rationale: Le syntagme peut désigner « la ville de Moab » sans que le texte hébreu exige une translittération comme nom propre. La note actuelle reconnaît cette ambiguïté, mais le texte principal la résout prématurément.
  - severity: low
    issue: La tournure « sortit à sa rencontre jusqu’à » est moins idiomatique.
    rationale: Le verbe français « aller » convient mieux avec le complément de destination « jusqu’à », tout en préservant le mouvement exprimé par יצא et la rencontre exprimée par לקראת.
  revised_text: Quand Balak apprit que Balaam était arrivé, il alla à sa rencontre jusqu’à la ville de Moab[a], située sur la frontière de l’Arnon, à l’extrémité du territoire[b].
