  text: וַ/יִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַ/יֵּצֵ֨א לִ/קְרָאת֜/וֹ אֶל עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/גְּבֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: fr
  text: Quand Balak apprit que Balaam était arrivé, il alla à sa rencontre jusqu’à la ville de Moab[a], située sur la frontière de l’Arnon, à l’extrémité du territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à une ville de Moab ». L’hébreu peut désigner soit une ville précise de Moab, possiblement un nom de lieu, soit plus généralement une ville appartenant à Moab.
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’extrémité de la frontière ». Le mot hébreu peut désigner une frontière ou le territoire qu’elle délimite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Dans ce contexte narratif, שׁמע désigne la réception d’une nouvelle. « Apprit » est naturel en français et n’ajoute aucun intermédiaire au récit.
- source_word: כִּי בָא בִלְעָם
  choice: que Balaam était arrivé
  rationale: Le plus-que-parfait français rend clairement l’antériorité de l’arrivée de Balaam par rapport à la réaction de Balak.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: il sortit à sa rencontre
  rationale: Cette formulation conserve le mouvement exprimé par יצא et rend idiomatiquement לקראת sans suggérer ni accueil chaleureux ni hostilité.
- source_word: אֶל עִיר מוֹאָב
  choice: jusqu’à Ir-Moab
  rationale: עִיר מוֹאָב peut désigner la localité connue comme « ville de Moab ». La translittération « Ir-Moab » la traite comme un toponyme probable tout en signalant en note l’autre analyse possible.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: située sur la frontière de l’Arnon
  rationale: La proposition localise la ville sur la limite marquée par l’Arnon; le nom désigne ici le cours d’eau servant de frontière.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: à l’extrémité du territoire
  rationale: קצה exprime une extrémité et גבול peut désigner un territoire aussi bien qu’une frontière. Ici, « territoire » évite l’expression française peu naturelle « extrémité de la frontière », sans masquer l’autre possibilité, donnée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Ir-Moab » conserve la concision du possible toponyme hébreu; les ambiguïtés géographiques réelles sont explicitées dans les notes.
