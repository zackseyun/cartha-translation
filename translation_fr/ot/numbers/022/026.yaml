source:
  edition: WLC
  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: fr
  text: Puis l’ange de Yahweh poursuivit son chemin[a] et se tint dans un passage étroit, où il n’y avait aucun moyen de se détourner ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « continua d’avancer » ou « alla plus loin ». L’expression hébraïque évoque littéralement le fait de continuer ou d’ajouter à l’action d’aller de l’avant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: poursuivit son chemin
  rationale: La construction יסף suivie de l’infinitif exprime la continuation de l’action. « Poursuivit son chemin » rend naturellement en français le déplacement de l’ange plus avant, tandis que « Puis » restitue la progression narrative du waw.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: Dans ce récit surnaturel, מַלְאַךְ désigne naturellement un « ange » plutôt qu’un messager humain. Le nom divin יְהוָה est transcrit « Yahweh ».
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: Le verbe עמד signifie se tenir debout ou prendre position. « Se tint » convient au fait que l’ange se place à cet endroit pour barrer le passage.
- source_word: בְּמָקוֹם צָר
  choice: dans un passage étroit
  rationale: Le syntagme désigne un endroit resserré. « Passage étroit » est naturel dans le contexte d’un chemin où aucun écart latéral n’est possible.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ
  choice: où il n’y avait aucun moyen
  rationale: דֶּרֶךְ peut signifier chemin, voie ou moyen. Ici, la proposition indique l’impossibilité pratique de s’écarter, non l’absence du chemin lui-même.
- source_word: לִנְטוֹת
  choice: de se détourner
  rationale: Le verbe נטה exprime ici un mouvement de côté. « Se détourner » rend plus précisément le contexte que le simple « tourner ».
- source_word: יָמִין וּשְׂמֹאול
  choice: ni à droite ni à gauche
  rationale: Cette formulation idiomatique française conserve les deux directions et, après une négation, exprime clairement qu’aucune échappatoire latérale n’existait.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte directement le tétragramme. La forme « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. « Passage étroit » rend concrètement la contrainte spatiale, et la tournure « ni à droite ni à gauche » reste claire pour un large lectorat.
