  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל הָ/אֱלֹהִ֑ים בָּלָ֧ק בֶּן צִפֹּ֛ר מֶ֥לֶךְ מוֹאָ֖ב שָׁלַ֥ח אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: fr
  text: 'Balaam dit à Dieu : « Balak, fils de Tsippor, roi de Moab, m’a envoyé[a] : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a envoyé vers moi ». L’hébreu ne précise pas ce qui a été envoyé; le contexte mentionne des messagers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français et rend inutile un « et » initial peu naturel ici.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: אֶל הָאֱלֹהִים
  choice: à Dieu
  rationale: Dans ce contexte, la forme avec article désigne le Dieu qui vient de parler à Balaam. Le français emploie naturellement « Dieu » sans article.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: Balak, fils de Tsippor
  rationale: La relation de filiation est rendue par une apposition naturelle. « Tsippor » suit une translittération française courante de צִפֹּר.
- source_word: מֶלֶךְ מוֹאָב
  choice: roi de Moab
  rationale: La chaîne construite identifie la fonction de Balak; l’apposition sans article est idiomatique en français.
- source_word: שָׁלַח אֵלָי
  choice: m’a envoyé ce message
  rationale: Le parfait décrit un envoi accompli dont Balaam rapporte maintenant le contenu. Cette formulation française naturelle conserve l’idée d’un envoi dirigé vers lui, tandis que la note signale la tournure hébraïque plus littérale.
theological_decisions:
- issue: Référent de הָאֱלֹהִים
  choice: Dieu, au singulier, comme interlocuteur de Balaam
  alternative: un dieu ou des dieux au sens générique
  rationale: Le contexte immédiat présente Balaam répondant à l’intervention divine du verset précédent. « Dieu » exprime cette identification contextuelle sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase demeure ouverte par les deux-points, conformément à l’hébreu, puisque le contenu du message suit au verset suivant.
