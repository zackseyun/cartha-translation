  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: fr
  text: L’ânesse m’a vu et s’est détournée devant moi ces trois fois. Si elle ne s’était pas détournée de devant moi[a], je t’aurais certainement déjà tué, tandis qu’elle, je l’aurais laissée en vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « peut-être s’est-elle détournée de devant moi ». D’après le contexte, cette proposition est généralement comprise comme une condition irréelle : « si elle ne s’était pas détournée de devant moi ».'
    reason: La formulation hébraïque transmise emploie « peut-être » et ne comporte pas de négation explicite, alors que la suite et le récit appellent un sens contrefactuel négatif.
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: m’a vu
  rationale: Le verbe ראה exprime ici une perception visuelle directe; « m’a vu » est simple et naturel.
- source_word: הָאָתוֹן
  choice: l’ânesse
  rationale: אָתוֹן désigne explicitement une femelle de l’âne; le français dispose du terme courant et naturel « ânesse ».
- source_word: וַתֵּט לְפָנַי
  choice: s’est détournée devant moi
  rationale: נטה signifie ici s’écarter ou se détourner. « Devant moi » rend לְפָנַי et maintient la relation spatiale avec le messager.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: ces trois fois
  rationale: L’expression idiomatique compte trois occurrences; « ces trois fois » est clair et proche de la formulation hébraïque.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: Si elle ne s’était pas détournée de devant moi
  rationale: 'Bien que אוּלַי signifie normalement « peut-être » et que le texte massorétique n’exprime pas la négation, le contexte exige une condition irréelle négative: l’écart de l’ânesse a empêché la mort de Balaam. La note signale cette difficulté.'
- source_word: כִּי עַתָּה
  choice: certainement déjà
  rationale: Dans l’apodose irréelle, l’expression souligne que la conséquence se serait produite à ce moment-là; cette formulation en restitue la force temporelle et emphatique.
- source_word: גַּם אֹתְךָה הָרַגְתִּי
  choice: je t’aurais certainement déjà tué
  rationale: Le parfait prend une valeur irréelle dans le contexte. Le conditionnel passé français exprime naturellement cette conséquence non réalisée; l’emphase de גַּם est portée par « certainement » et par le contraste.
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: tandis qu’elle, je l’aurais laissée en vie
  rationale: Le hiphil de חיה signifie faire vivre, garder ou laisser en vie. La dislocation « elle » préserve le contraste marqué entre Balaam et l’ânesse.
theological_decisions:
- issue: Condition irréelle malgré l’absence apparente de négation explicite après אוּלַי
  choice: « Si elle ne s’était pas détournée de devant moi »
  alternative: « Peut-être s’est-elle détournée de devant moi »
  rationale: 'La logique narrative indique que les écarts de l’ânesse ont sauvé Balaam: sans eux, le messager l’aurait tué. La traduction rend donc la condition irréelle négative requise par le contexte, tout en documentant dans une note la formulation littérale et son ambiguïté.'
translation_notes:
  register: Français international moderne, digne et accessible. « Ânesse » conserve naturellement le sexe indiqué par le nom hébreu. La syntaxe reste proche du texte source, tandis que les conditionnels passés rendent explicitement l’irréel. La note préserve la difficulté réelle du texte sans imposer silencieusement une résolution.
