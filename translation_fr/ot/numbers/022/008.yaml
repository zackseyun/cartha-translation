  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: fr
  text: 'Il leur dit : « Passez la nuit ici, et je vous rapporterai une réponse[a], selon ce que Yahweh[b] me dira. » Les dignitaires de Moab[c] restèrent avec Balaam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je vous transmettrai une parole » ou « je vous donnerai une réponse ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: c
    text: 'Ou : « les chefs de Moab », « les hauts responsables de Moab » ou « les princes de Moab ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: Passez la nuit ici
  rationale: L’impératif pluriel de לון/לין invite les envoyés à rester sur place pour la nuit. Cette formulation est naturelle en français moderne et conserve explicitement le lieu et la durée.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: je vous rapporterai une réponse
  rationale: Le hiphil de שוב associé à דָּבָר exprime ici l’idée de revenir vers eux avec une parole ou une réponse. « Rapporterai » préserve ce mouvement, tandis que « une réponse » convient naturellement au contexte.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: selon ce que Yahweh me dira
  rationale: כַּאֲשֶׁר marque la conformité à ce que Dieu communiquera. En contexte, l’imparfait hébreu יְדַבֵּר a une valeur future ; « me dira » est idiomatique sans affaiblir l’idée de parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », ce qui conserve le nom divin plutôt que de lui substituer un titre.
- source_word: וַיֵּשְׁבוּ
  choice: restèrent
  rationale: Dans ce contexte narratif, ישב signifie que les envoyés demeurèrent auprès de Balaam, en réponse à son invitation à passer la nuit.
- source_word: שָׂרֵי מוֹאָב
  choice: les dignitaires de Moab
  rationale: שָׂרִים désigne des personnages investis d’autorité. « Dignitaires » convient à des envoyés de haut rang dans un cadre royal, sans imposer l’idée de fils de roi que « princes » pourrait suggérer en français moderne.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Forme française traditionnelle et reconnue du nom propre hébreu בִּלְעָם.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération préserve le caractère personnel du nom, tandis que la note signale la convention française traditionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste fluide, tandis que « selon ce que » maintient la relation de conformité exprimée par כַּאֲשֶׁר. « Dignitaires » évite l’ambiguïté moderne de « princes » tout en conservant le rang élevé des envoyés.
