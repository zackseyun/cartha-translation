  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: fr
  text: 'Dieu dit à Balaam : « Tu n’iras pas avec eux. Tu ne maudiras pas le peuple, car il est béni. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français narratif, le passé simple « dit » rend naturellement cette succession sans qu’il soit nécessaire d’ajouter « et ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le terme désigne le vrai Dieu qui s’adresse directement à Balaam.
- source_word: לֹא תֵלֵךְ
  choice: Tu n’iras pas
  rationale: L’imparfait hébreu précédé de לֹא exprime ici une interdiction. Le futur français employé avec valeur injonctive en conserve la fermeté dans un registre digne et actuel.
- source_word: עִמָּהֶם
  choice: avec eux
  rationale: Rend directement la préposition et son suffixe, lequel renvoie aux messagers de Balak.
- source_word: לֹא תָאֹר
  choice: Tu ne maudiras pas
  rationale: Le verbe אָרַר signifie « maudire » ; la même construction prohibitive que dans la proposition précédente est rendue de manière parallèle.
- source_word: אֶת הָעָם
  choice: ce peuple
  rationale: Le nom défini désigne ici le peuple précis dont parlent les messagers, à savoir Israël. « Ce peuple » est naturel dans le discours direct français, sans changer le référent.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction ; « car » convient au registre soutenu mais accessible de la parole divine.
- source_word: בָרוּךְ הוּא
  choice: il est béni
  rationale: Le pronom et l’adjectif sont au masculin singulier et reprennent הָעָם, nom collectif masculin singulier. Le français permet naturellement la même concordance avec « peuple ».
theological_decisions:
- issue: Référent et nombre dans la proposition « il est béni »
  choice: « il est béni », avec « il » renvoyant collectivement au peuple d’Israël
  alternative: « ils sont bénis », en visant les membres du peuple
  rationale: L’hébreu emploie le masculin singulier בָרוּךְ הוּא après le collectif הָעָם. Le français peut préserver exactement ce singulier collectif sans ambiguïté gênante ni individualisation du référent.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme « Tu n’iras pas… Tu ne maudiras pas… » conserve la force des deux interdictions. Aucune note n’est nécessaire, puisque le masculin singulier hébreu se transpose naturellement en français avec « ce peuple… il ».
