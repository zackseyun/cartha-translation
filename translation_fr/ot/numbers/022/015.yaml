  text: וַ/יֹּ֥סֶף ע֖וֹד בָּלָ֑ק שְׁלֹ֣חַ שָׂרִ֔ים רַבִּ֥ים וְ/נִכְבָּדִ֖ים מֵ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: fr
  text: Puis Balak envoya de nouveau des dignitaires, plus nombreux et plus éminents[a] que les précédents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus honorés » ou « plus considérés ». L’hébreu souligne leur rang social ou leur prestige supérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: envoya de nouveau
  rationale: La construction יָסַף + infinitif, renforcée par עוֹד, exprime ici la répétition de l’envoi. « Envoya de nouveau » restitue naturellement cet idiome en français.
- source_word: בָּלָק
  choice: Balak
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: שָׂרִים
  choice: dignitaires
  rationale: Dans ce contexte diplomatique, le terme désigne des représentants de haut rang. « Dignitaires » exprime leur position sans employer le terme potentiellement trompeur « princes ».
- source_word: רַבִּים
  choice: plus nombreux
  rationale: 'La préposition comparative מִן dans מֵאֵלֶּה donne ici à l’adjectif une valeur comparative : la nouvelle délégation compte davantage de membres.'
- source_word: וְנִכְבָּדִים
  choice: plus éminents
  rationale: Le participe passif issu de כבד évoque le poids social, la considération et le prestige. « Plus éminents » rend clairement le rang supérieur de ces dignitaires.
- source_word: מֵאֵלֶּה
  choice: que les précédents
  rationale: Le démonstratif renvoie aux dignitaires envoyés auparavant. « Les précédents » explicite ce renvoi de façon naturelle sans changer son référent.
