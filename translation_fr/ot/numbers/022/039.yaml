  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: fr
  text: Balaam alla avec Balak, et ils arrivèrent à Qiryath-Houtsoth[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Qiryath-Houtsoth signifie probablement « ville des rues » ou « ville des places ouvertes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Le qal wayyiqtol de הלך fait progresser le récit et indique ici que Balaam se mit en route avec Balak. « Partit » est naturel en français sans ajouter de précision sur le mode de déplacement.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Translittération française traditionnelle et largement reconnue du nom propre.
- source_word: עִם
  choice: avec
  rationale: La préposition exprime simplement l’accompagnement; « avec » en donne le sens direct et idiomatique.
- source_word: בָּלָק
  choice: Balak
  rationale: Translittération française usuelle du nom propre.
- source_word: וַיָּבֹאוּ
  choice: ils arrivèrent
  rationale: Le qal wayyiqtol pluriel de בוא désigne le mouvement jusqu’au lieu nommé. « Ils arrivèrent » est idiomatique en français et n’implique pas nécessairement qu’ils soient entrés dans une enceinte.
- source_word: קִרְיַת חֻצוֹת
  choice: Qiryath-Houtsoth
  rationale: Puisque l’expression sert de nom de lieu, elle est translittérée dans le texte. La graphie rend les éléments hébreux de façon lisible en français; leur sens lexical est signalé en note.
