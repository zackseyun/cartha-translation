source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: fr
  text: Maintenant, je vous prie, restez ici vous aussi cette nuit, afin que je sache ce que Yahweh me dira encore.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers la nouvelle instruction de Balaam. « Maintenant » est naturel en français moderne sans qu’il soit nécessaire de reproduire mécaniquement la conjonction initiale.
- source_word: שְׁבוּ נָא
  choice: je vous prie, restez
  rationale: Dans ce contexte, ישׁב signifie demeurer ou rester plutôt que s’asseoir. La tournure « je vous prie » rend la nuance de requête portée par נָא dans un registre digne et courant.
- source_word: בָזֶה
  choice: ici
  rationale: Le démonstratif prépositionnel a ici une valeur locative; « ici » en donne le sens avec concision.
- source_word: גַּם אַתֶּם
  choice: vous aussi
  rationale: 'Conserve la valeur additive: cette délégation doit rester, comme la précédente.'
- source_word: הַלָּיְלָה
  choice: cette nuit
  rationale: L’expression désigne la nuit qui vient. « Cette nuit » est idiomatique en français international.
- source_word: וְאֵדְעָה
  choice: afin que je sache
  rationale: Le cohortatif exprime ici le but recherché par la demande de rester; « afin que » rend explicitement ce rapport.
- source_word: מַה יֹּסֵף
  choice: ce que … encore
  rationale: La construction avec יסף exprime une parole supplémentaire. La formulation « ce que … dira encore » est naturelle tout en conservant cette idée d’ajout.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: דַּבֵּר עִמִּי
  choice: me dira
  rationale: Dans ce contexte de révélation, la locution signifie communiquer une parole à Balaam. « Me dira » est idiomatique et n’impose pas l’idée d’un dialogue réciproque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; conserver « Yahweh » distingue le nom personnel du titre divin.
translation_notes:
  register: Français moderne international, clair et digne. La syntaxe reste proche du mouvement de l’hébreu tout en évitant un calque lourd. Aucune note n’est nécessaire, car « me dira encore » rend directement et naturellement l’expression hébraïque.
