  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: fr
  text: 'Balaam répondit aux serviteurs de Balaq : « Même si Balaq me donnait sa maison pleine d’argent et d’or, je ne pourrais pas aller au-delà de la parole de Yahweh, mon Dieu,[a] pour faire quoi que ce soit, que ce soit petit ou grand.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aller au-delà de la bouche de Yahweh, mon Dieu » ; cette expression signifie dépasser ou enfreindre ce qu’il a dit.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « pour faire une chose petite ou grande ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: Balaam répondit
  rationale: La double formule narrative hébraïque, littéralement « répondit et dit », se rend naturellement en français par le seul verbe « répondit », sans perte de fonction discursive.
- source_word: עַבְדֵי בָלָק
  choice: les serviteurs de Balaq
  rationale: « Serviteurs » reste proche de עֶבֶד tout en convenant aux émissaires ou gens de cour de Balaq dans ce contexte.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: Même si Balaq me donnait
  rationale: Le tour conditionnel introduit ici une hypothèse à valeur concessive; « même si » et l’imparfait la rendent clairement et naturellement en français.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: sa maison pleine d’argent et d’or
  rationale: Cette formulation conserve l’image concrète d’une maison remplie de richesses.
- source_word: לֹא אוּכַל
  choice: je ne pourrais pas
  rationale: Le verbe יכל exprime l’incapacité, et le conditionnel s’accorde avec l’hypothèse précédente sans réduire la déclaration à un simple refus.
- source_word: לַעֲבֹר אֶת פִּי
  choice: aller au-delà de la parole de
  rationale: Le choix conserve autant que possible l’image de franchir une limite fixée par ce que Dieu a prononcé, tout en évitant le littéralisme obscur « dépasser la bouche ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin propre plutôt que remplacé par un titre.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Rend directement le nom avec son suffixe possessif, sans ajouter d’implication étrangère au propos de Balaam.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: pour faire quoi que ce soit, petit ou grand
  rationale: Cette formulation garde le mérisme « petit ou grand » tout en explicitant en français sa portée exhaustive.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » maintient sa fonction de nom propre.
- issue: Portée de la déclaration de Balaam
  choice: une incapacité à aller au-delà de la parole prononcée par Yahweh
  alternative: un refus de transgresser le commandement de Yahweh
  rationale: Le texte emploie explicitement יכל, « pouvoir », avec l’expression idiomatique « aller au-delà de la bouche ». La traduction garde cette incapacité déclarée sans la réduire à une simple décision volontaire.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe directe convient à un récit dialogué; « argent et or » et « petit ou grand » préservent les images et la structure rhétorique de l’hébreu.
