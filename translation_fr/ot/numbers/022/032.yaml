revisions:
- from: 'L’ange de Yahvé lui dit : « Pourquoi as-tu frappé ton ânesse à trois reprises ? Voici, je suis sorti pour m’opposer à toi[a], car la voie que tu suis est téméraire devant moi[b]. »'
  to: 'L’ange de Yahvé lui dit : « Pourquoi as-tu frappé ton ânesse à trois reprises ? Voici, je suis sorti pour m’opposer à toi[a], car ta conduite est téméraire à mes yeux[b]. »'
  rationale: La révision est limitée à la dernière proposition et à l’accord de la note correspondante. « Ta conduite » explicite naturellement en français le sens figuré de « chemin/voie » dans ce contexte. « À mes yeux » rend la valeur évaluative de « devant moi » sans prétendre résoudre de façon définitive le sens disputé de יָרַט, que la note continue de signaler.
