base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: fr
  text: 'L’ange de Yahvé lui dit : « Pourquoi as-tu frappé ton ânesse à trois reprises ? Voici, je suis sorti pour m’opposer à toi[a], car ta conduite est téméraire à mes yeux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu שָׂטָן signifie ici « adversaire » ou « opposant » ; il ne désigne pas nécessairement Satan comme nom propre.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu traduit par « est téméraire » est rare et de sens incertain ; on peut aussi le comprendre au sens de « perverse » ou de « contraire ».
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahvé
  rationale: מַלְאַךְ peut désigner un messager ou un ange ; le contexte présente ici un être céleste. Le nom divin יהוה est transcrit « Yahvé » plutôt que remplacé par un titre.
- source_word: הִכִּיתָ אֶת אֲתֹנְךָ
  choice: as-tu frappé ton ânesse
  rationale: נכה signifie « frapper ». אֲתוֹן désigne précisément une ânesse, distinction naturelle et pertinente dans ce récit.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: à trois reprises
  rationale: Cette expression idiomatique signifie « trois fois » ; « à trois reprises » convient au registre de la réprimande.
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: Voici, je suis sorti
  rationale: « Voici » conserve la fonction d’appel à l’attention de הִנֵּה, et « je suis sorti » suit directement le verbe יצא tout en restant idiomatique.
- source_word: לְשָׂטָן
  choice: pour m’opposer à toi
  rationale: שָׂטָן est ici un nom commun désignant un adversaire ou un opposant. La formulation verbale est naturelle en français et le complément « à toi », implicite dans la situation, explicite la relation sans identifier ce terme au nom propre Satan.
- source_word: יָרַט הַדֶּרֶךְ לְנֶגְדִּי
  choice: la voie que tu suis est téméraire devant moi
  rationale: Le verbe rare ירט demeure incertain. « Téméraire » exprime l’idée probable d’une démarche précipitée ou inconsidérée, tandis que « devant moi » conserve la portée spatiale et évaluative de לְנֶגְדִּי.
theological_decisions:
- issue: Sens de לְשָׂטָן
  choice: 'un rôle d’opposant : « pour m’opposer à toi »'
  alternative: « comme adversaire » ou, à tort dans ce contexte, le nom propre « Satan »
  rationale: Le contexte décrit l’ange de Yahvé faisant obstacle à Balaam. Le mot fonctionne comme un nom commun et ne doit pas introduire une identification démonologique absente du passage.
- issue: Évaluation de la voie de Balaam
  choice: « est téméraire devant moi »
  alternative: « est perverse devant moi » ou « m’est contraire »
  rationale: Le verbe ירט est rare et son sens précis est discuté. Le texte principal retient une valeur de conduite précipitée ou inconsidérée, tandis qu’une note maintient visibles les autres compréhensions possibles.
translation_notes:
  register: Français international actuel, digne et accessible. « Ânesse » garde la précision du terme hébreu sans lourdeur. « Voici » maintient la solennité narrative, et les notes signalent les deux difficultés lexicales sans résoudre artificiellement l’ambiguïté.
