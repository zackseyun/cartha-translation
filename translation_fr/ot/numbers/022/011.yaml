  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: fr
  text: Voici, le peuple qui est sorti d’Égypte a couvert la surface du pays[a]. Maintenant, viens, maudis-le pour moi. Peut-être pourrai-je le combattre et le chasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’œil du pays », expression qui désigne sa surface visible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit le rapport avec insistance et attire l’attention, dans un registre français actuel et digne.
- source_word: הָעָם
  choice: le peuple
  rationale: Rend le collectif singulier qui désigne Israël comme peuple.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: qui est sorti d’Égypte
  rationale: Le participe hébreu identifie le peuple par sa sortie d’Égypte; une relative française est claire et naturelle.
- source_word: וַיְכַס
  choice: a couvert
  rationale: Présente l’action accomplie dont le résultat motive la demande de Balak; l’accord singulier respecte le nom collectif français « peuple ».
- source_word: עֵין הָאָרֶץ
  choice: toute la surface du pays
  rationale: L’expression signifie littéralement « l’œil du pays/de la terre » et désigne sa surface visible; « toute » explicite naturellement l’idée d’envahissement portée par le contexte.
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marque le passage urgent du constat à la requête.
- source_word: לְכָה
  choice: viens
  rationale: Impératif d’exhortation invitant Balaam à intervenir.
- source_word: קָבָה
  choice: maudis
  rationale: Rend directement le verbe spécifique qui signifie prononcer une malédiction.
- source_word: לִּי
  choice: pour moi
  rationale: 'Conserve le datif d’intérêt: Balaam doit agir au bénéfice de Balak.'
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom singulier reprend naturellement en français le collectif singulier « le peuple », sans effacer sa valeur collective.
- source_word: אוּלַי אוּכַל
  choice: Peut-être pourrai-je
  rationale: Préserve l’incertitude et l’espoir exprimés par אוּלַי, dans une formulation française fluide.
- source_word: לְהִלָּחֶם בּוֹ
  choice: le combattre
  rationale: Exprime l’engagement dans le combat contre ce peuple, avec la reprise pronominale française du collectif.
- source_word: וְגֵרַשְׁתִּיו
  choice: et le chasser
  rationale: Rend la conséquence espérée par Balak, sans préciser un complément de lieu que le texte ne formule pas.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le singulier collectif « le peuple » est maintenu avec les pronoms « le », conformément à la syntaxe française et à la forme hébraïque. L’idiome עֵין הָאָרֶץ est rendu dans le texte par son sens contextuel et signalé littéralement en note.
