  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: fr
  text: Quand l’ânesse vit l’ange de Yahweh[a], elle se coucha sous Balaam. Alors Balaam se mit en colère et frappa l’ânesse avec son bâton.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: l’ânesse
  rationale: Le nom אָתוֹן désigne spécifiquement une ânesse. Le français courant permet de conserver naturellement cette précision lexicale.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager ou un ange. Dans ce récit, il s’agit manifestement d’un messager surnaturel; « ange » convient donc au texte principal, tandis qu’une note conserve l’autre valeur possible du terme.
- source_word: וַתִּרְבַּץ
  choice: elle se coucha
  rationale: Le verbe רבץ signifie se coucher ou s’accroupir. « Se coucha » décrit clairement l’action de l’animal sans ajouter l’idée d’un effondrement.
- source_word: תַּחַת בִּלְעָם
  choice: sous Balaam
  rationale: תַּחַת signifie « sous » ou « au-dessous de ». Balaam étant monté sur l’ânesse, « sous Balaam » restitue directement l’image hébraïque.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: Balaam se mit en colère
  rationale: L’expression hébraïque évoque littéralement la colère qui s’enflamme. Cette tournure française moderne en transmet naturellement le sens et l’aspect inchoatif.
- source_word: וַיַּךְ
  choice: frappa
  rationale: Le verbe נכה a ici le sens général de frapper. « Frappa » est direct sans préciser indûment la violence ou la répétition du geste.
- source_word: בַּמַּקֵּל
  choice: avec son bâton
  rationale: מַקֵּל désigne un bâton ou une canne. « Bâton » est naturel dans cette scène; le possessif, implicite dans le contexte, rend la phrase idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Sens de מַלְאָךְ dans l’expression מַלְאַךְ יְהוָה
  choice: ange
  alternative: messager
  rationale: Le contexte présente un être surnaturel visible par l’ânesse; « ange » convient donc ici, tout en signalant en note le sens plus large de « messager ».
translation_notes:
  register: Français international moderne, narratif et digne. « Ânesse » conserve sans lourdeur la précision féminine de l’hébreu. La coordination hébraïque est rendue par « Quand » puis « Alors » pour une progression naturelle.
