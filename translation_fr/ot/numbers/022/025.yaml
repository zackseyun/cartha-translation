  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: fr
  text: Quand l’ânesse vit l’ange de Yahweh[a], elle se serra contre le mur et coinça le pied de Balaam contre le mur. Alors, il la frappa de nouveau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ». Dans ce contexte, il s’agit manifestement d’un être surnaturel; c’est pourquoi le texte principal emploie « ange ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: l’ânesse
  rationale: Le nom hébreu désigne explicitement une ânesse; le français dispose d’un terme courant et naturel qui conserve cette précision.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange; ici, le contexte surnaturel justifie « ange », tandis que le nom divin est conservé sous la forme « Yahweh ».
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: elle se serra contre le mur
  rationale: La tournure exprime le mouvement réflexif de l’ânesse qui se plaque étroitement contre le mur; « se serra » est naturel et précis.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: et coinça le pied de Balaam contre le mur
  rationale: Avec le pied de Balaam comme objet, le verbe indique qu’il est comprimé ou pris entre l’ânesse et le mur; « coinça » rend clairement le résultat physique sans exagérer la blessure.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: Alors, il la frappa de nouveau
  rationale: La construction יָסַף suivie de l’infinitif marque ici la répétition de l’action; « de nouveau » la restitue avec naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom divin et suit la convention indiquée pour le projet.
- issue: Sens de מַלְאַךְ dans l’expression מַלְאַךְ יְהוָה
  choice: ange
  alternative: messager
  rationale: Le mot peut avoir les deux sens. Dans ce récit, l’être est surnaturel; « ange » convient donc dans le texte principal, tout en conservant « messager » en note comme possibilité lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. « Ânesse » conserve naturellement le sexe de l’animal; « coinça » évite une répétition lourde de « serra » tout en rendant l’effet concret du second emploi de לחץ.
