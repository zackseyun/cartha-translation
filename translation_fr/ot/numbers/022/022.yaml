revisions:
- from: Mais la colère de Dieu s’enflamma parce qu’il était en route, et l’ange de Yahweh se posta sur le chemin pour s’opposer à lui[a]. Balaam montait son ânesse[b], et ses deux jeunes serviteurs étaient avec lui.
  to: Mais la colère de Dieu s’enflamma parce qu’il était en route, et l’ange de Yahweh se posta sur le chemin pour s’opposer à lui[a]. Balaam chevauchait son ânesse[b], et ses deux jeunes hommes étaient avec lui.
  rationale: La révision maintient toutes les décisions textuelles solides du projet, mais remplace une désignation possiblement restrictive des deux נערים et rend plus nettement l’action continue de Balaam sur son ânesse. Elle ne résout pas la tension narrative relative à la colère divine et conserve le caractère commun de שָׂטָן.
