  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: fr
  text: Mais la colère de Dieu s’enflamma parce qu’il était en route, et l’ange de Yahweh se posta sur le chemin pour s’opposer à lui[a]. Balaam chevauchait son ânesse[b], et ses deux jeunes hommes étaient avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le nom שָׂטָן (satan), qui signifie « adversaire » ou « opposant » ; il ne s’agit pas nécessairement du nom propre Satan.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne précisément une ânesse, c’est-à-dire un âne femelle.
    reason: lexical_precision
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: la colère de Dieu s’enflamma
  rationale: Cette formulation française naturelle conserve l’image vive de la colère qui brûle dans l’idiome hébreu.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: parce qu’il était en route
  rationale: Le participe exprime une action en cours; «était en route» rend naturellement cette valeur sans préciser au-delà du texte la raison exacte pour laquelle son départ provoque la colère divine.
- source_word: וַיִּתְיַצֵּב
  choice: se posta
  rationale: Le hitpael indique une prise de position délibérée; «se posta» restitue cette nuance intentionnelle et confrontante.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: «Ange» convient à l’être céleste du récit, tandis que «Yahweh» rend directement le nom divin.
- source_word: בַּדֶּרֶךְ
  choice: sur le chemin
  rationale: Cette expression est concrète et idiomatique en français pour désigner l’endroit où l’ange bloque le passage.
- source_word: לְשָׂטָן לוֹ
  choice: pour s’opposer à lui
  rationale: Le nom commun שָׂטָן décrit ici la fonction d’adversaire de l’ange; la tournure verbale est claire et naturelle en français tout en évitant d’en faire le nom propre Satan.
- source_word: וְהוּא רֹכֵב
  choice: Balaam montait
  rationale: Le pronom renvoie à Balaam; expliciter son nom évite en français une ambiguïté momentanée avec l’ange, tout en rendant l’arrière-plan circonstanciel du participe.
- source_word: אֲתֹנוֹ
  choice: son ânesse
  rationale: Le substantif hébreu désigne expressément une ânesse, distinction naturelle et pertinente dans le récit français.
- source_word: שְׁנֵי נְעָרָיו
  choice: ses deux jeunes serviteurs
  rationale: נְעָרִים peut désigner de jeunes hommes attachés au service d’une personne; «jeunes serviteurs» conserve à la fois l’âge suggéré et leur fonction probable dans ce contexte de voyage.
- source_word: עִמּוֹ
  choice: étaient avec lui
  rationale: L’ajout du verbe requis en français complète naturellement la proposition nominale hébraïque.
theological_decisions:
- issue: Sens de שָׂטָן dans ce contexte
  choice: 'nom commun exprimant l’opposition: «pour s’opposer à lui»'
  alternative: 'nom propre ou titre: «Satan»'
  rationale: La syntaxe et le contexte décrivent le rôle hostile de l’ange de Yahweh envers Balaam. Le nom propre «Satan» importerait ici une identification que le texte n’exige pas.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: «Yahweh» représente directement le tétragramme et distingue le nom divin d’un titre.
- issue: Cause précise de la colère divine
  choice: conserver simplement «parce qu’il était en route»
  alternative: expliciter qu’il allait contre la volonté de Dieu ou qu’il partait avec de mauvaises intentions
  rationale: Le texte affirme que Dieu se met en colère du fait qu’il va, alors que le contexte précédent contient une permission conditionnelle. La traduction préserve cette tension narrative sans ajouter une motivation absente du verset.
translation_notes:
  register: Français international moderne, digne et narratif. Le rythme reste proche de l’hébreu, avec des formulations courantes. Le nom «Balaam» est repris dans la seconde phrase pour éviter que le pronom français ne semble renvoyer à l’ange.
