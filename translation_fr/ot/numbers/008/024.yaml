    rationale: La combinaison est maladroite en français et affaiblit la relation entre l’idiome לִצְבֹא צָבָא (« accomplir un devoir/service assigné ») et בַּעֲבֹדַת (« au service de »). Une reformulation sûre améliore à la fois l’idiomaticité et la fidélité.
  revised_text: 'Voici ce qui concerne les Lévites : à partir de vingt-cinq ans, chacun viendra pour accomplir son devoir[a] au service de la tente de la Rencontre.'
  revised_footnotes:
