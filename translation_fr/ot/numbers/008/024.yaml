  text: זֹ֖את אֲשֶׁ֣ר לַ/לְוִיִּ֑ם מִ/בֶּן֩ חָמֵ֨שׁ וְ/עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה יָבוֹא֙ לִ/צְבֹ֣א צָבָ֔א בַּ/עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: fr
  text: 'Voici ce qui concerne les Lévites : à partir de vingt-cinq ans, chacun viendra pour accomplir son devoir[a] au service de la tente de la Rencontre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entrer en service » ; l’expression hébraïque évoque un service organisé et comporte une nuance militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: Voici ce qui concerne les Lévites
  rationale: La formule introduit une règle applicable aux Lévites. « Voici ce qui concerne » est naturel en français moderne et conserve la portée réglementaire de l’hébreu.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: dès l’âge de vingt-cinq ans
  rationale: Cette expression indique un seuil d’âge minimal. La formulation française rend clairement le sens de « vingt-cinq ans et au-dessus » sans lourdeur.
- source_word: יָבוֹא
  choice: chacun viendra
  rationale: Le verbe hébreu est au singulier après la désignation collective des Lévites. « Chacun » maintient cette distributivité tout en évitant un pronom masculin générique peu naturel en français actuel.
- source_word: לִצְבֹא צָבָא
  choice: prendre son service
  rationale: L’idiome évoque l’entrée dans un service organisé, avec des connotations de devoir ou de mobilisation. « Prendre son service » convient au contexte cultuel et garde quelque chose de cette nuance.
- source_word: בַּעֲבֹדַת
  choice: dans le travail de
  rationale: עֲבֹדָה désigne ici le travail ou la tâche assignée au sanctuaire. « Travail » évite la répétition immédiate de « service » tout en conservant la dimension concrète des fonctions exercées.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction transparente du nom du sanctuaire indique qu’il s’agit du lieu fixé pour la rencontre, sans réduire מוֹעֵד à une simple réunion humaine.
theological_decisions:
- issue: Verbe singulier avec un groupe collectif
  choice: chacun viendra
  alternative: ils viendront
  rationale: L’hébreu formule la règle au singulier distributif. « Chacun viendra » en préserve la forme et montre que l’obligation s’applique individuellement à tout Lévite concerné.
- issue: Nature du service lévitique
  choice: prendre son service
  alternative: venir servir
  rationale: La tournure choisie conserve la dimension de devoir organisé présente dans לִצְבֹא צָבָא sans transformer le service cultuel en activité militaire proprement dite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le ton réglementaire du verset. « Tente de la rencontre » est employé comme désignation transparente du sanctuaire.
