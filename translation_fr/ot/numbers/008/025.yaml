  text: וּ/מִ/בֶּן֙ חֲמִשִּׁ֣ים שָׁנָ֔ה יָשׁ֖וּב מִ/צְּבָ֣א הָ/עֲבֹדָ֑ה וְ/לֹ֥א יַעֲבֹ֖ד עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: fr
  text: À partir de l’âge de cinquante ans, il se retirera du service du travail et ne travaillera plus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, littéralement, « il reviendra du service du travail » ; le verbe hébreu signifie « revenir, retourner », mais il a ici le sens de se retirer de cette fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: Dès l’âge de cinquante ans
  rationale: L’expression hébraïque marque le seuil d’âge à partir duquel la disposition s’applique. Cette formulation est naturelle et précise en français moderne.
- source_word: יָשׁוּב
  choice: il se retirera
  rationale: Le verbe signifie littéralement « revenir, retourner, se détourner ». Avec מִן dans ce contexte administratif, il exprime le retrait du service actif, tout en laissant l’alternative littérale en note.
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: du service actif
  rationale: צָבָא désigne ici le service organisé des lévites, non une activité militaire, et עֲבֹדָה le travail assigné. « Service actif » rend naturellement l’expression dans son contexte sans suggérer un ministère ecclésiastique ultérieur.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: et ne servira plus
  rationale: עבד désigne ici l’accomplissement du service assigné. « Ne servira plus » est idiomatique et maintient le lien lexical avec le contexte de service.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure concise conserve le caractère réglementaire du verset. « Service actif » explicite la fonction contextuelle de l’expression hébraïque sans lui donner un sens militaire.
