review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le seuil d’âge et le retrait du service. Toutefois, « service actif » introduit une qualification absente de l’hébreu et peut évoquer indûment un cadre militaire. La paire צְבָא / עֲבֹדָה doit rester perceptible, et le dernier עבד est mieux rendu par « travailler » que par « servir ».
  naturalness: « À partir de l’âge de cinquante ans » est naturel en français international moderne. « Service du travail » est un peu formel, mais il conserve volontairement la formulation administrative dense de l’original sans ajouter d’interprétation.
  terminology: « Se retirer » convient à יָשׁוּב dans ce contexte. « Service du travail » préserve la distinction entre le service organisé (צָבָא) et le travail ou la tâche (עֲבֹדָה). « Ne travaillera plus » rend directement le verbe עבד final.
