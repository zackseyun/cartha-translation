    rationale: 'Le verbe עבד désigne l’exécution du travail ou de la tâche assignée. « Ne travaillera plus » reproduit plus directement le contraste avec le « service du travail ». '
  - severity: low
    issue: La note propose « quittera le service du travail », qui ne reflète pas l’alternative littérale indiquée.
    rationale: Puisque la note signale la valeur littérale de שוב, son alternative devrait employer « revenir » ou « retourner », tout en expliquant que le contexte impose le sens de retrait.
