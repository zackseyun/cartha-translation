  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: fr
  text: Prends les Lévites d’entre les Israélites et purifie-les[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ». Ou : « le peuple d’Israël ».'
    reason: L’expression hébraïque בני ישראל est littéralement « les fils d’Israël » et désigne collectivement les Israélites.
lexical_decisions:
- source_word: קַח
  choice: Prends
  rationale: Impératif adressé à Moïse. « Prends » rend directement לקח et convient à l’idée de prendre les Lévites au sein d’Israël afin de les mettre à part.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désigne le groupe tribal affecté au service du sanctuaire ; « les Lévites » est la désignation française courante et précise.
- source_word: מִתּוֹךְ
  choice: du milieu de
  rationale: L’expression marque l’extraction hors d’un groupe plus large. « Du milieu de » reste naturelle en français tout en conservant nettement cette image.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend littéralement l’expression hébraïque et en préserve la nuance familiale et collective. Une note indique les formulations françaises plus idiomatiques possibles.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: et purifie-les
  rationale: Dans ce contexte rituel, טהר désigne une purification cérémonielle. « Purifie-les » est clair, actuel et plus précis ici que le simple « rends-les purs ».
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; le peuple d’Israël
  rationale: Le texte hébreu emploie une désignation masculine plurielle à portée familiale et collective. Le corps du texte conserve cette forme sans réduire son référent aux seuls hommes ; la note fournit des équivalents collectifs naturels.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe impérative reste proche de l’hébreu ; « purifie » explicite naturellement le cadre rituel.
