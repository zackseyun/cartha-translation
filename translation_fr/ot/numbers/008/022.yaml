  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: fr
  text: Après cela, les Lévites vinrent accomplir leur service dans la tente de la rencontre, devant Aaron et devant ses fils. Ils firent pour eux exactement ce que Yahweh avait ordonné à Moïse au sujet des Lévites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils agirent ainsi à leur égard. » L’hébreu est concis; il peut désigner l’accomplissement des rites prescrits concernant les Lévites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Marque naturellement en français la succession temporelle après les rites décrits dans le contexte précédent; la coordination hébraïque n’a pas besoin d’être reproduite par « Et ».
- source_word: בָּאוּ הַלְוִיִּם לַעֲבֹד אֶת עֲבֹדָתָם
  choice: les Lévites vinrent accomplir leur service
  rationale: « Vinrent » respecte le verbe de mouvement sans préciser indûment qu’ils entrèrent; « accomplir leur service » rend l’expression cultuelle tout en évitant la répétition peu naturelle « servir leur service ».
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Rend la préposition בְּ et le nom traditionnel de la tente-sanctuaire dans un français clair et digne.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: devant Aaron et devant ses fils
  rationale: Conserve le sens concret et potentiellement institutionnel de לִפְנֵי sans expliciter une supervision sacerdotale seulement implicite.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל הַלְוִיִּם
  choice: exactement ce que Yahweh avait ordonné à Moïse au sujet des Lévites
  rationale: La tournure française exprime le rapport de conformité porté par כַּאֲשֶׁר; le plus-que-parfait situe l’ordre avant son exécution, et עַל est rendu sans ambiguïté par « au sujet de ».
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: Ils firent pour eux exactement ce que…
  rationale: La restructuration française rend le corrélatif כַּאֲשֶׁר…כֵּן de façon naturelle. « Pour eux » conserve le pronom et la valeur bénéficiaire possible de לָהֶם sans préciser quelles personnes sont le sujet implicite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Référent du sujet implicite de עָשׂוּ
  choice: Conserver « ils » sans identifier explicitement ses référents
  alternative: Aaron et ses fils firent; Moïse et Aaron firent
  rationale: Le sujet grammatical n’est pas exprimé dans cette proposition et le contexte peut orienter vers les responsables ayant accompli les rites. Le nommer dans le texte résoudrait une concision authentique de l’hébreu.
- issue: Valeur de לָהֶם dans כֵּן עָשׂוּ לָהֶם
  choice: pour eux
  alternative: à leur égard; envers eux
  rationale: « Pour eux » préserve la valeur bénéficiaire possible, tandis que la note signale que l’hébreu concis peut désigner plus largement ce qui fut fait à l’égard des Lévites.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe de la seconde phrase a été réorganisée pour restituer clairement le corrélatif hébreu sans effacer l’ambiguïté du sujet implicite ni celle de לָהֶם.
