lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le wayyiqtol fait progresser le récit. « Puis » marque naturellement la succession, tandis que « parla » rend דבר dans cette formule d’introduction.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, qui conserve ici le nom personnel plutôt que de lui substituer le titre « le Seigneur ».
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: Rend directement le destinataire introduit par אֶל, avec la forme française usuelle du nom מֹשֶׁה.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule hébraïque introduit les paroles directes qui suivent. En français, « en ces termes : » en exprime naturellement la fonction sans la tournure lourde « disant ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » conserve le nom divin dans une forme française reconnue, tandis que « le Seigneur » serait une substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la formule hébraïque tout en employant une introduction idiomatique aux paroles du verset suivant.
