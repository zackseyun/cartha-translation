  naturalness: « Selon le geste rituel de présentation » est lourd et redondant après « présenteras ». « Comme une offrande de présentation » est plus idiomatique, sobre et conserve le caractère cultuel du syntagme.
  terminology: « Tente de la rencontre », « purifier » et « offrande de présentation » conviennent à un français biblique moderne international. La note doit signaler le geste traditionnellement associé au terme sans prétendre en fixer la forme exacte.
