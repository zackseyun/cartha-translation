source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: fr
  text: Après cela, les Lévites viendront servir à la tente de la rencontre. Tu les purifieras[a] et tu les présenteras comme une offrande de présentation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu les rendras rituellement purs ». Le verbe hébreu désigne ici une purification rituelle.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une offrande présentée dans un rite de présentation, traditionnellement associé à un geste de balancement. La forme exacte de ce geste n’est pas précisée.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Marque clairement l’étape suivante des rites décrits précédemment, dans un français naturel et actuel.
- source_word: יָבֹאוּ הַלְוִיִּם
  choice: les Lévites viendront
  rationale: Le futur rend ici la suite prescrite des événements; « Lévites » est la désignation française usuelle du groupe.
- source_word: לַעֲבֹד
  choice: servir
  rationale: Dans ce contexte cultuel, le verbe désigne le service accompli par les Lévites sans leur attribuer plus précisément des fonctions sacerdotales.
- source_word: אֶת אֹהֶל מוֹעֵד
  choice: à la tente de la rencontre
  rationale: Après « servir », la préposition « à » exprime naturellement en français le lieu et le cadre de leur service. « Tente de la rencontre » conserve le sens du nom hébreu sans le réduire à une simple réunion humaine.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: Tu les purifieras
  rationale: טהר désigne ici la purification rituelle. « Purifier » est clair, digne et plus précis dans ce contexte que le seul nettoyage matériel.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: tu les présenteras comme une offrande selon le geste rituel de présentation
  rationale: La formulation française exprime que les Lévites eux-mêmes font l’objet du rite de תנופה. Elle évite l’image trompeusement littérale consistant à les « balancer », tout en conservant le caractère concret et cultuel du geste grâce à une note.
theological_decisions:
- issue: Langage rituel de la consécration des Lévites
  choice: Conserver explicitement la purification et la présentation des Lévites comme offrande rituelle.
  alternative: Paraphraser l’ensemble par « tu les consacreras » ou « tu les établiras dans leur service ».
  rationale: Le texte décrit des actes cultuels particuliers, et non une simple nomination. La traduction maintient cette dimension sans lui imposer de catégories théologiques ultérieures.
- issue: Sens concret du rite de תנופה appliqué aux personnes
  choice: Employer une formulation idiomatique de présentation rituelle et expliquer le geste en note.
  alternative: Traduire littéralement « tu les balanceras comme une offrande balancée ».
  rationale: Le texte présente de façon frappante les Lévites eux-mêmes comme l’objet du rite. La formulation retenue préserve cette tension tout en évitant en français une image physique probablement trompeuse.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste directe. Le vocabulaire rituel est conservé, mais l’expression hébraïque difficile concernant le geste de תנופה est rendue de manière intelligible et précisée en note.
