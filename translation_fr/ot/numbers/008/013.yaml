  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: fr
  text: Tu placeras les Lévites devant Aaron et devant ses fils, et tu les présenteras à Yahweh comme une offrande agitée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu les agiteras comme une offrande agitée pour Yahweh ». L’hébreu associe le verbe désignant l’agitation ou la présentation rituelle au nom de l’offrande correspondante.'
    reason: Préserver dans la note la répétition lexicale du verbe נוף et du nom תְּנוּפָה, tout en employant la terminologie rituelle française usuelle.
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Tu placeras
  rationale: 'Le hifil de עמד est causatif : il s’agit de faire tenir les Lévites à une place déterminée. « Placer » est naturel en français et convient à cette mise en position rituelle.'
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation habituelle du groupe tribal, avec conservation de l’article défini.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition marque ici la position ou la présentation formelle en présence d’Aaron et de ses fils.
- source_word: בָנָיו
  choice: ses fils
  rationale: Dans ce contexte sacerdotal, בנים désigne bien les fils d’Aaron, et non ses enfants au sens général.
- source_word: וְהֵנַפְתָּ
  choice: puis tu les présenteras
  rationale: Dans le vocabulaire rituel, le hifil de נוף désigne un geste cérémoniel de présentation ou de balancement. « Présenter » évite de suggérer que les personnes seraient simplement agitées physiquement, tandis que la nature du rite reste exprimée par « offrande balancée ».
- source_word: תְּנוּפָה
  choice: comme une offrande balancée
  rationale: תְּנוּפָה est un terme cultuel désignant une offrande présentée par un mouvement rituel. « Offrande balancée » conserve cette spécificité et la note explicite la répétition étymologique de l’hébreu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique le destinataire de la présentation, et le nom divin יהוה est rendu par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Expression du rite accompli avec les Lévites
  choice: les présenter comme une offrande balancée
  alternative: les balancer comme une offrande balancée
  rationale: Le choix principal communique clairement une présentation rituelle de personnes tout en conservant la catégorie cultuelle de תְּנוּפָה. La note maintient l’expression plus littérale et la répétition du verbe et du nom apparentés.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur injonctive convient à la série d’ordres rituels. « Puis » rend la progression de la cérémonie sans alourdir la coordination.
