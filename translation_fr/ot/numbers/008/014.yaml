  text: וְ/הִבְדַּלְתָּ֙ אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: fr
  text: Ainsi, tu sépareras les Lévites d’entre les fils d’Israël[a], et les Lévites seront à moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Israélites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « m’appartiendront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: Tu sépareras ainsi
  rationale: Le hifil de בדל signifie « séparer, mettre à part ». « Sépareras » rend directement le verbe, tandis que « ainsi » inscrit l’ordre dans la suite de la procédure sans alourdir la phrase.
- source_word: אֶת הַלְוִיִּם
  choice: les Lévites
  rationale: Le nom défini au pluriel désigne les membres du groupe de Lévi; « Lévites » est la désignation française courante.
- source_word: מִתּוֹךְ
  choice: du milieu de
  rationale: Cette expression indique une séparation opérée à l’intérieur d’un groupe. « Du milieu de » reste proche de la formulation hébraïque tout en étant naturel en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression familiale littérale de l’hébreu plutôt que de la remplacer dans le texte par « les Israélites ».
- source_word: וְהָיוּ לִי
  choice: et … seront à moi
  rationale: La construction היה + ל exprime ici l’appartenance. « Seront à moi » préserve la formulation simple de l’hébreu sans introduire explicitement l’idée de consécration.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: La répétition nominal de l’hébreu est maintenue pour préserver son insistance, au lieu d’employer un pronom.
theological_decisions:
- issue: Exprimer le statut des Lévites comme appartenance ou comme consécration cultuelle
  choice: les Lévites seront à moi
  alternative: les Lévites m’appartiendront; les Lévites me seront consacrés
  rationale: Le syntagme לִי avec היה énonce directement l’appartenance à Dieu. Le contexte implique une mise à part cultuelle, mais le verset n’emploie pas ici un terme explicite pour « consacrer »; cette portée demeure donc contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur garde la force de l’instruction hébraïque adressée à Moïse. La répétition de « les Lévites » et l’expression « fils d’Israël » conservent la structure marquée du texte source.
