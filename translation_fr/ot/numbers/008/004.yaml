  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: fr
  text: 'Voici comment fut fabriqué le porte-lampes : il était en or martelé[a] ; de sa base jusqu’à sa fleur, il était martelé. Conformément au modèle que Yahweh avait montré à Moïse[b], c’est ainsi qu’on fabriqua le porte-lampes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en or battu ». L’hébreu souligne que le porte-lampes avait été façonné au marteau ; certains comprennent aussi qu’il était fait d’une seule pièce.
    reason: lexical_alternative
  - marker: b
    text: « Conformément au modèle » peut aussi se traduire par « d’après l’aspect » ou « d’après la vision » que Yahweh avait donné à voir à Moïse.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: comment était fait
  rationale: Rend naturellement en français la manière de fabrication ou la facture de l’objet, plutôt qu’une œuvre abstraite.
- source_word: הַמְּנֹרָה
  choice: le porte-lampes
  rationale: Traduit le nom de cet objet cultuel au lieu de le translittérer ; le pluriel « lampes » correspond à sa fonction de support à plusieurs lampes.
- source_word: מִקְשָׁה
  choice: martelé
  rationale: Le terme désigne un ouvrage façonné au marteau. Sa répétition dans l’hébreu est conservée ; l’idée éventuelle d’une seule pièce est signalée en note sans être imposée dans le texte.
- source_word: זָהָב
  choice: or
  rationale: Désignation directe du matériau.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: de sa base jusqu’à sa fleur
  rationale: La tournure française exprime l’étendue complète. יָרֵךְ désigne ici la partie inférieure ou la base, et פֶּרַח l’ornement floral.
- source_word: כַּמַּרְאֶה
  choice: conformément au modèle
  rationale: Dans le contexte de la fabrication du sanctuaire, « modèle » désigne clairement la forme montrée à Moïse, tout en signalant en note les sens plus littéraux possibles.
- source_word: הֶרְאָה
  choice: avait montré
  rationale: Rend la forme causative de ראה et situe naturellement en français cette action avant la réalisation du porte-lampes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin sous une forme française usuelle et distincte d’un titre comme « le Seigneur ».
- source_word: כֵּן עָשָׂה
  choice: fut réalisé conformément
  rationale: Rend le rapport entre le modèle montré et l’exécution. Le passif naturel en français évite d’assigner avec certitude un sujet masculin que l’hébreu laisse implicite.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le nom propre est conservé plutôt que remplacé par un titre, sans introduire de particularité confessionnelle.
- issue: Sujet implicite de עָשָׂה
  choice: Le porte-lampes fut réalisé
  alternative: il fit le porte-lampes
  rationale: Le verbe hébreu est actif et masculin singulier, mais son sujet n’est pas exprimé. Le passif français préserve cette indétermination plutôt que d’identifier explicitement l’artisan.
- issue: Sens de כַּמַּרְאֶה
  choice: modèle
  alternative: aspect / vision
  rationale: « Modèle » convient au contexte de fabrication, tandis que la note maintient accessibles les autres nuances lexicales sans trancher une éventuelle dimension visionnaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite un calque lourd de « ouvrage » tout en conservant la répétition de « martelé » présente dans l’hébreu. « Porte-lampes » est préféré à la translittération « menorah » et à « chandelier », qui peut évoquer des bougies plutôt que des lampes à huile.
