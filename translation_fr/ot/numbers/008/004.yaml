revisions:
- from: 'Voici comment était fait le porte-lampes : il était en or martelé[a] ; de sa base jusqu’à sa fleur, il était martelé. Le porte-lampes fut réalisé conformément au modèle que Yahweh avait montré à Moïse[b].'
  to: 'Voici comment fut fabriqué le porte-lampes : il était en or martelé[a] ; de sa base jusqu’à sa fleur, il était martelé. Conformément au modèle que Yahweh avait montré à Moïse[b], c’est ainsi qu’on fabriqua le porte-lampes.'
  rationale: La révision rétablit l’action active finale et la construction corrélative « conformément à… c’est ainsi que… », tout en laissant l’agent humain implicite, comme dans l’hébreu. La note b est ajustée pour une syntaxe française cohérente et pour préserver les possibilités lexicales sans imposer le sens de « vision ».
