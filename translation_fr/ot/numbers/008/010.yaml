source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: fr
  text: Tu feras approcher les Lévites devant Yahweh, et les fils d’Israël[a] poseront leurs mains sur les Lévites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », expression collective courante désignant le peuple d’Israël.
    reason: Alternative lexicale et clarification de la portée collective de l’expression hébraïque.
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Tu feras approcher
  rationale: Le hiphil de קרב signifie « faire approcher » ou « présenter ». Cette formulation conserve le mouvement rituel vers la présence de Yahweh sans imposer l’interprétation plus générale « présenter ».
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française courante du groupe lévitique, au pluriel défini.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי désigne ici la position ou la présentation en présence de Yahweh ; « devant » est naturel et fidèle au contexte rituel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme, qui conserve le nom d’alliance présent dans le texte hébreu.
- source_word: וְסָמְכוּ
  choice: poseront
  rationale: Dans la construction rituelle avec « mains » et עַל, סמך décrit l’imposition des mains. « Poseront leurs mains sur » exprime clairement le geste en français moderne.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend formellement l’expression hébraïque tout en signalant en note son emploi collectif conventionnel.
- source_word: יְדֵיהֶם
  choice: leurs mains
  rationale: Le pluriel de l’hébreu est conservé naturellement en français.
- source_word: עַל הַלְוִיִּם
  choice: sur les Lévites
  rationale: עַל se traduit naturellement par « sur » dans la formule de l’imposition des mains.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal conserve la forme masculine plurielle de l’expression hébraïque, tandis que la note précise qu’elle désigne collectivement le peuple d’Israël.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier reflète la deuxième personne masculine singulière adressée à Moïse. La formulation conserve le caractère rituel du geste et la structure coordonnée du verset.
