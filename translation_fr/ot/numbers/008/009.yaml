source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: fr
  text: Tu feras approcher les Lévites devant la tente de la rencontre, puis tu rassembleras toute la communauté des fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des Israélites ». Littéralement : « des fils d’Israël ».'
    reason: Alternative lexicale idiomatique et indication de la forme littérale de l’hébreu.
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Tu feras approcher
  rationale: Le hiphil de קרב exprime ici le fait de faire approcher ou de présenter. « Faire approcher » conserve le mouvement vers le lieu sacré et convient à l’action rituelle.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française habituelle des membres de la tribu de Lévi affectés au service du sanctuaire.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend directement la position en face ou en présence de quelque chose, ici la tente de la rencontre.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rendu précis et intelligible de l’expression cultuelle, qui désigne le sanctuaire où a lieu la rencontre fixée avec Dieu.
- source_word: וְהִקְהַלְתָּ
  choice: puis tu rassembleras
  rationale: Le hiphil de קהל signifie réunir une assemblée. « Puis » rend naturellement la progression des instructions sans surcharger le français de coordinations répétées.
- source_word: כָּל עֲדַת
  choice: toute la communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël convoquée comme corps. « Toute la communauté » est naturel en français moderne et rend כָּל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque filiale et son masculin grammatical; la désignation collective plus idiomatique « les Israélites » est signalée en note.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: L’hébreu emploie explicitement un pluriel masculin filial tout en désignant collectivement le peuple de l’alliance. Le texte principal en préserve la forme, tandis que la note donne l’équivalent collectif courant.
translation_notes:
  register: Français international moderne, clair et digne. Le futur injonctif maintient la forme des instructions adressées à Moïse; le vocabulaire cultuel reste précis sans archaïsme inutile.
