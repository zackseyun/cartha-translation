base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: fr
  text: Moïse, Aaron et toute l’assemblée des fils d’Israël agirent envers les Lévites conformément à tout ce que Yahweh avait ordonné à Moïse au sujet des Lévites ; ainsi les fils d’Israël agirent envers eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », expression courante désignant le peuple de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: firent / agirent
  rationale: Le verbe עשה est très général. « Firent » maintient cette généralité dans la première proposition, tandis que « agirent » évite une répétition lourde dans la reprise finale sans préciser indûment les rites accomplis.
- source_word: עֲדַת
  choice: assemblée
  rationale: עֵדָה désigne ici la communauté d’Israël considérée collectivement; « assemblée » convient au registre du Pentateuque tout en restant naturel en français moderne.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale masculine du texte hébreu, plutôt que de la remplacer silencieusement par « les Israélites ».
- source_word: לַלְוִיִּם / לָהֶם
  choice: à l’égard des Lévites / envers eux
  rationale: La préposition ל marque les Lévites comme ceux à qui s’appliquent les actes prescrits. Ces formulations françaises préservent cette relation sans la réduire au seul bénéfice.
- source_word: כְּכֹל אֲשֶׁר
  choice: tout ce que
  rationale: Dans la construction « firent … tout ce que », cette traduction exprime naturellement la conformité complète aux instructions divines.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait indique naturellement que l’ordre divin précède son exécution racontée dans le verset.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: à Moïse à leur sujet
  rationale: Le premier complément désigne le destinataire de l’ordre, et le second les Lévites concernés. Le pronom « leur » évite une répétition tout en gardant le référent clair.
- source_word: כֵּן
  choice: exactement ainsi
  rationale: כֵּן reprend la conformité énoncée précédemment et la souligne; « exactement ainsi » rend cette force récapitulative en français idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel et l’ancrage d’alliance sans le remplacer par un titre.
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le choix conserve la forme familiale masculine de l’hébreu. Une note indique l’équivalent collectif courant afin que la portée communautaire ne soit pas mal comprise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement allégée par rapport à l’ordre hébreu, tout en conservant la répétition finale qui souligne l’obéissance exacte d’Israël.
