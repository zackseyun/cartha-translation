  source_fidelity: Le projet rend fidèlement la séquence rituelle, le singulier de l’officiant (« Tu offriras »), les deux offrandes, le nom divin et la finalité expiatoire. Toutefois, « sur la tête des taureaux » transpose trop littéralement la construction distributive hébraïque et suggère en français une seule tête pour plusieurs animaux.
