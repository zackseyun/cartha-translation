source:
  edition: WLC
  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: fr
  text: Puis les Lévites poseront leurs mains sur la tête de chacun des taureaux. Tu offriras l’un en sacrifice pour le péché[a] et l’autre en holocauste à Yahweh, afin de faire l’expiation pour les Lévites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner, dans les contextes sacerdotaux, le sacrifice associé au péché et à la purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: poseront leurs mains
  rationale: Dans le contexte sacrificiel, סמך désigne le geste rituel consistant à poser les mains sur l’animal; cette formulation est naturelle et précise en français.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: sur la tête des taureaux
  rationale: Le texte hébreu emploie « tête » au singulier avec « taureaux » au pluriel. Le français conserve cette forme distributive, compréhensible comme la tête de chacun des deux animaux.
- source_word: וַעֲשֵׂה
  choice: Tu offriras
  rationale: Le verbe est adressé à une seule personne et, avec des sacrifices pour objets, signifie naturellement « offrir » plutôt que le littéral « faire ».
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Cette expression française courante conserve le lien lexical avec le péché, tandis que la valeur possible de sacrifice de purification est signalée en note.
- source_word: עֹלָה
  choice: holocauste
  rationale: « Holocauste » est le terme cultuel français traditionnel désignant l’offrande entièrement consumée; il convient au registre biblique sans alourdir la phrase.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », et la préposition ל par « à » dans la formule d’offrande.
- source_word: לְכַפֵּר
  choice: afin de faire l’expiation
  rationale: Cette formulation préserve la portée rituelle et théologique de כפר sans préciser de manière indue un mécanisme doctrinal particulier.
- source_word: עַל הַלְוִיִּם
  choice: pour les Lévites
  rationale: Avec כפר, « pour » exprime naturellement en français ceux au bénéfice desquels l’expiation est accomplie.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre et préserve sa fonction de nom d’alliance.
- issue: Portée cultuelle de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut désigner l’offrande liée au péché aussi bien qu’à la purification dans les textes sacerdotaux. Le texte principal retient l’expression la plus immédiatement intelligible et la note préserve l’autre analyse.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le caractère prescriptif du rite. Le singulier « la tête des taureaux » suit de près l’hébreu et laisse entendre naturellement une application distributive aux deux animaux.
