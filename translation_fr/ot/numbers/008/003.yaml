id: NUM.8.3
reference: Numbers 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ כֵּן֙ אַהֲרֹ֔ן אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה הֶעֱלָ֖ה נֵרֹתֶ֑י/הָ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: fr
  text: 'Aaron fit ainsi : vers l’avant du porte-lampes[a], il plaça ses lampes[b], exactement comme Yahweh l’avait ordonné à Moïse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en direction de la face du porte-lampes » ou « tournées vers l’avant du porte-lampes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il alluma ses lampes ». Le verbe hébreu signifie littéralement « faire monter » et peut, dans ce contexte, évoquer soit la mise en place des lampes, soit leur allumage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: Aaron fit ainsi
  rationale: Cette tournure française naturelle exprime qu’Aaron se conforma à l’instruction précédente tout en conservant la valeur récapitulative de כֵּן.
- source_word: אֶל מוּל פְּנֵי
  choice: face à l’avant de
  rationale: L’expression indique l’orientation des lampes par rapport à la face ou à l’avant du porte-lampes, sans préciser davantage la disposition spatiale.
- source_word: הַמְּנוֹרָה
  choice: le porte-lampes
  rationale: Le terme désigne ici le support portant les lampes du sanctuaire. « Porte-lampes » traduit l’objet concrètement et évite la connotation moderne de bougies que peut avoir « chandelier ».
- source_word: הֶעֱלָה
  choice: il mit … en place
  rationale: Le hiphil de עלה signifie littéralement faire monter et, avec des lampes, peut évoquer leur installation ou leur allumage. « Mettre en place » convient au contexte d’orientation des lampes tout en signalant en note l’autre lecture possible.
- source_word: נֵרֹתֶיהָ
  choice: ses lampes
  rationale: נֵר désigne concrètement une lampe, et le suffixe féminin singulier renvoie au porte-lampes.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exactement comme Yahweh l’avait ordonné à Moïse
  rationale: « Exactement comme » rend l’idée de conformité précise, et le plus-que-parfait situe naturellement l’ordre avant son exécution.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Sens de הֶעֱלָה appliqué aux lampes
  choice: il mit ses lampes en place
  alternative: il alluma ses lampes
  rationale: Le contexte immédiat porte sur la disposition et l’orientation des lampes, mais le verbe peut aussi désigner leur allumage; cette ambiguïté est conservée au moyen d’une note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement de l’hébreu tout en restant naturelle; les deux ambiguïtés lexicales principales sont conservées dans les notes.
