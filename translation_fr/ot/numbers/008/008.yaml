id: NUM.8.8
reference: Numbers 8:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ פַּ֣ר בֶּן בָּקָ֔ר וּ/מִנְחָת֔/וֹ סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן וּ/פַר שֵׁנִ֥י בֶן בָּקָ֖ר תִּקַּ֥ח לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: fr
  text: 'Ils prendront ensuite un jeune taureau, avec l’offrande de céréales qui l’accompagne : de la farine fine mélangée à de l’huile. Tu prendras un second jeune taureau pour le sacrifice pour le péché[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Dans les contextes rituels sacerdotaux, le terme hébreu חַטָּאת peut désigner le sacrifice pour le péché ou le sacrifice de purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Ils prendront ensuite
  rationale: Le parfait qal avec waw poursuit la séquence des prescriptions rituelles. Le futur français exprime naturellement l’instruction, et « ensuite » marque la progression.
- source_word: פַּר בֶּן בָּקָר
  choice: un jeune taureau
  rationale: L’expression désigne idiomatiquement un taureau jeune issu du gros bétail; cette formulation est naturelle en français.
- source_word: וּמִנְחָתוֹ
  choice: avec l’offrande de céréales qui l’accompagne
  rationale: Dans ce contexte cultuel, מִנְחָה désigne l’offrande végétale, et le suffixe masculin renvoie au premier taureau. « Qui l’accompagne » explicite sans changer le rapport grammatical.
- source_word: סֹלֶת
  choice: de la farine fine
  rationale: Terme cultuel courant pour une farine soigneusement moulue destinée aux offrandes.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: mélangée à de l’huile
  rationale: Rend clairement la préparation rituelle exprimée par le participe passif.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: Tu prendras un second jeune taureau
  rationale: Le singulier de תִּקַּח marque un changement d’adresse par rapport au pluriel précédent; le français le préserve avec « tu ».
- source_word: לְחַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: חַטָּאת désigne ici le sacrifice rituel traditionnellement appelé « sacrifice pour le péché »; l’autre nuance fonctionnelle est signalée en note.
theological_decisions:
- issue: Sens de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le rendu principal conserve l’appellation traditionnelle et le lien lexical avec le péché, sans exclure la fonction purificatrice du rite, donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le changement du pluriel « ils prendront » au singulier « tu prendras » est maintenu. La ponctuation explicite l’apposition décrivant l’offrande de céréales.
