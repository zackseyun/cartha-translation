source:
  edition: WLC
  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: fr
  text: J’ai pris les Lévites à la place de tout premier-né parmi les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Israélites ». L’hébreu dit littéralement « parmi les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: J’ai pris
  rationale: Le qal wayyiqtol, première personne du singulier, de לקח signifie normalement « prendre ». Le passé composé convient au récit en français moderne et préserve le caractère concret du verbe sans expliciter davantage la fonction confiée aux Lévites.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Le pluriel défini désigne précisément les Lévites ; c’est la désignation française usuelle et exacte.
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans ce contexte, תַּחַת exprime la substitution, et non une position spatiale.
- source_word: כָּל בְּכוֹר
  choice: tout premier-né
  rationale: Devant le singulier בְּכוֹר, כָּל a une valeur distributive. « Tout premier-né » restitue cette construction sans ajouter « mâle », absent de ce verset.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: La préposition ב a ici un sens partitif, rendu par « parmi ». « Fils d’Israël » conserve l’expression masculine explicite de l’hébreu.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: L’hébreu porte littéralement le pluriel masculin « fils d’Israël ». Le texte principal le conserve sans neutralisation, tandis qu’une note signale l’équivalent collectif naturel en français.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure hébraïque tout en étant naturelle ; elle préserve le sens substitutif et la forme distributive du texte source.
