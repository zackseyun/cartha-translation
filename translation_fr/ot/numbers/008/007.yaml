id: NUM.8.7
reference: Numbers 8:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: fr
  text: 'Voici ce que tu leur feras pour les purifier : asperge-les d’eau de purification[a] ; qu’ils passent le rasoir sur tout leur corps et lavent leurs vêtements. Alors, ils se purifieront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « eau de faute » ou « eau de péché » ; on peut aussi traduire : « eau destinée à ôter le péché » ou « eau de purification du péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: Voici ce que tu leur feras
  rationale: Cette formulation française naturelle conserve l’introduction prescriptive et le fait que Moïse doit accomplir sur eux le rite indiqué.
- source_word: לְטַהֲרָם
  choice: pour les purifier
  rationale: Dans ce contexte lévitique, « purifier » exprime clairement la dimension rituelle de טהר sans la réduire à une purification morale.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: asperge-les
  rationale: Le verbe désigne ici l’aspersion rituelle ; la construction française intègre naturellement le complément pronominal.
- source_word: מֵי חַטָּאת
  choice: eau de purification
  rationale: Littéralement « eaux de faute/péché », l’expression désigne une eau employée dans un rite de purification. Ce choix reste fonctionnel sans introduire explicitement un sacrifice que le syntagme ne nomme pas.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: qu’ils passent le rasoir sur tout leur corps
  rationale: La formulation garde l’image concrète de l’hébreu, « faire passer un rasoir », tandis que « corps » communique ici le sens contextuel de בשר plus naturellement que « chair ».
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: et lavent leurs vêtements
  rationale: כבס désigne normalement le lavage des vêtements ; « laver leurs vêtements » est courant et précis en français moderne.
- source_word: וְהִטֶּהָרוּ
  choice: Alors, ils se purifieront
  rationale: Le réfléchi « se purifieront » rend la forme hébraïque, et « alors » fait ressortir la valeur résultative de la dernière proposition.
theological_decisions:
- issue: Nature de la purification dans le rite de consécration des lévites
  choice: Employer le vocabulaire de la purification rituelle sans le limiter à une purification morale
  alternative: Parler de « nettoyage » ou expliciter une purification uniquement « du péché »
  rationale: Le contexte décrit un rite concret de consécration. « Purifier » préserve sa portée cultuelle sans importer une catégorie doctrinale ultérieure.
- issue: Sens de מֵי חַטָּאת
  choice: « eau de purification », avec une note sur la formulation littérale
  alternative: « eau pour le péché » ou « eau de l’offrande pour le péché »
  rationale: חטאת peut se rapporter au péché, à la purification ou à une offrande pour le péché selon le contexte. Ici, aucun nom de sacrifice n’est exprimé ; la traduction fonctionnelle accompagnée d’une note préserve l’ambiguïté lexicale sans surinterpréter.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier reflète l’adresse hébraïque à Moïse. La syntaxe prescriptive demeure nette, et le vocabulaire rituel est conservé sans archaïsme.
