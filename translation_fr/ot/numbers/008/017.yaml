source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: fr
  text: Car tout premier-né parmi les fils d’Israël, tant parmi les humains que parmi les animaux, m’appartient. Le jour où j’ai frappé tout premier-né dans le pays d’Égypte, je me les suis consacrés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et conserve la valeur explicative de la conjonction.
- source_word: לִי
  choice: m’appartient
  rationale: Exprime naturellement en français la possession indiquée par la préposition hébraïque.
- source_word: כָל בְּכוֹר
  choice: tout premier-né
  rationale: Rend le singulier collectif sans ajouter « mâle », qui n’est pas explicite dans ce verset.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: Conserve l’expression familiale et communautaire de l’hébreu tout en restant intelligible en français moderne.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: tant parmi les humains que parmi les animaux
  rationale: Restitue le contraste collectif entre la catégorie humaine et la catégorie animale, ainsi que le parallélisme des prépositions.
- source_word: בְּיוֹם
  choice: Le jour où
  rationale: Formulation temporelle naturelle qui conserve la référence à l’occasion historique précise.
- source_word: הַכֹּתִי
  choice: j’ai frappé
  rationale: Rend directement le verbe נכה sans expliciter la mort au-delà de ce que porte le verbe lui-même.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: dans le pays d’Égypte
  rationale: Préserve l’expression hébraïque complète et sa tonalité narrative.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: je les ai consacrés pour moi
  rationale: « Consacrés » maintient la force sacrale du hiphil de קדשׁ, tandis que « pour moi » rend explicitement le second לִי sans confondre consécration et simple possession.
theological_decisions:
- issue: Valeur collective de אָדָם dans l’opposition humain-animal
  choice: les humains
  alternative: l’homme / l’humanité
  rationale: Dans ce contexte, אָדָם désigne la catégorie humaine par opposition aux animaux. « Les humains » exprime clairement ce sens collectif en français international actuel sans introduire une limitation masculine.
- issue: Force sacrale de הִקְדַּשְׁתִּי
  choice: je les ai consacrés pour moi
  alternative: je les ai mis à part pour moi
  rationale: « Consacrés » préserve l’idée d’une mise à part comme sainte et le fondement théologique de la revendication divine sur les premiers-nés.
translation_notes:
  register: Français moderne, digne et accessible. La structure en deux phrases suit l’articulation de l’hébreu. « Tant… que… » clarifie la portée de « tout premier-né » sur les humains et les animaux sans résoudre au-delà du texte la question du sexe des premiers-nés.
