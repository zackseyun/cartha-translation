base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: fr
  text: 'Parle à Aaron et dis-lui : « Quand tu installeras les lampes[a], les sept lampes éclaireront le devant du chandelier. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quand tu allumeras les lampes ». Le verbe hébreu signifie littéralement « faire monter » et peut désigner ici soit l’allumage des lampes, soit leur mise en place pour qu’elles éclairent vers l’avant.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif introduit une instruction divine directe; « Parle » conserve le registre formel du commandement.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: et dis-lui
  rationale: Cette formulation maintient les deux verbes de parole distincts, comme dans l’hébreu, tout en restant naturelle en français.
- source_word: בְּהַעֲלֹתְךָ
  choice: Quand tu installeras
  rationale: Le hiphil de עלה signifie littéralement « faire monter ». Dans ce contexte, il peut désigner la mise en place des lampes ou leur allumage; « installeras » préserve ici l’idée de disposition sans imposer le sens d’allumage.
- source_word: הַנֵּרֹת
  choice: les lampes
  rationale: נֵר désigne des lampes concrètes, et non la lumière de manière abstraite.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: l’espace devant le porte-lampes
  rationale: La combinaison אֶל מוּל פְּנֵי exprime l’orientation vers la zone située devant la face du porte-lampes. Cette formulation française rend la direction de la lumière sans suggérer que les lampes, qui font partie de l’objet, se trouvent elles-mêmes devant celui-ci.
- source_word: יָאִירוּ
  choice: éclaireront
  rationale: Le hiphil de אור a une valeur causative, « donner de la lumière »; « éclaireront » l’exprime naturellement en français.
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: les sept lampes
  rationale: Rendu direct du syntagme numéral hébreu, sans ajouter « toutes », absent du texte.
- source_word: הַמְּנוֹרָה
  choice: le porte-lampes
  rationale: Le terme désigne ici le support cultuel portant les sept lampes. « Porte-lampes » en traduit la fonction en français courant sans recourir à la translittération « ménorah ».
