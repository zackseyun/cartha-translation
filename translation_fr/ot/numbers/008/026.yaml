revisions:
- from: Mais il pourra assister ses frères dans la tente de la rencontre, en veillant à ce qui leur est confié, sans accomplir lui-même le service[a]. Voilà comment tu agiras envers les Lévites dans l’exercice de leurs fonctions.
  to: Mais il pourra assister ses frères dans la tente de la rencontre, en veillant à la responsabilité qui lui est confiée ; mais il n’accomplira aucun service[a]. Ainsi tu agiras envers les Lévites dans leurs fonctions.
  rationale: La révision retire deux précisions non exprimées (« lui-même » et le possessif pluriel) afin de respecter plus étroitement le texte hébreu. Elle conserve le contraste contextuellement justifié entre l’assistance permise et le service interdit, sans définir de façon excessive les tâches concernées.
