    reason: lexical_alternative
  revision_rationale: La révision retire deux précisions non exprimées (« lui-même » et le possessif pluriel) afin de respecter plus étroitement le texte hébreu. Elle conserve le contraste contextuellement justifié entre l’assistance permise et le service interdit, sans définir de façon excessive les tâches concernées.
