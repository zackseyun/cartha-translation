  text: וְ/שֵׁרֵ֨ת אֶת אֶחָ֜י/ו בְּ/אֹ֤הֶל מוֹעֵד֙ לִ/שְׁמֹ֣ר מִשְׁמֶ֔רֶת וַ/עֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַ/לְוִיִּ֖ם בְּ/מִשְׁמְרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: fr
  text: Mais il pourra assister ses frères dans la tente de la rencontre, en veillant à la responsabilité qui lui est confiée ; mais il n’accomplira aucun service[a]. Ainsi tu agiras envers les Lévites dans leurs fonctions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mais il n’accomplira aucun travail ». L’hébreu oppose l’assistance encore permise au travail de service régulier dont le Lévite âgé est désormais dispensé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת אֶת־אֶחָיו
  choice: Mais il pourra assister ses frères
  rationale: Le verbe שׁרת désigne ici une participation auxiliaire au ministère sacré. « Assister » marque naturellement cette participation permise tout en la distinguant du service régulier interdit ensuite; « ses frères » conserve le terme de parenté hébreu.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Rendu formel et intelligible de l’expression désignant le sanctuaire où Dieu rencontre son peuple.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: en veillant à ce qui leur est confié
  rationale: La construction avec verbe et nom apparentés exprime l’accomplissement ou la garde d’une responsabilité confiée. Cette formulation française évite le calque peu naturel « garder une garde ».
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: sans accomplir lui-même le service
  rationale: Le nom עֲבֹדָה et le verbe עבד forment une expression emphatique. « Le service » renvoie au travail régulier auquel le Lévite âgé ne participe plus, tandis que « lui-même » clarifie le contraste avec son rôle d’assistance sans ajouter une interdiction absolue de présence.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם
  choice: Voilà comment tu agiras envers les Lévites
  rationale: Formulation injonctive naturelle qui conserve le singulier de l’adresse hébraïque.
- source_word: בְּמִשְׁמְרֹתָם
  choice: dans l’exercice de leurs fonctions
  rationale: Le pluriel désigne les responsabilités ou fonctions assignées aux Lévites; ce rendu est idiomatique en français moderne.
theological_decisions:
- issue: Nature de l’activité permise au Lévite après l’âge de cessation du service régulier
  choice: Il peut continuer à assister ses frères et à veiller aux responsabilités confiées, mais non accomplir lui-même le service régulier.
  alternative: Toute forme de service lui serait désormais interdite, ou seule une garde matérielle lui resterait permise.
  rationale: Le contraste lexical entre שׁרת et עֲבֹדָה/עבד distingue une participation auxiliaire d’un travail de service régulier. La traduction maintient cette distinction sans définir plus précisément que l’hébreu la nature des tâches permises.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque. « Tente de la rencontre » est retenu comme désignation transparente du sanctuaire. La différence entre « assister » et « accomplir le service » préserve le contraste interne du verset.
