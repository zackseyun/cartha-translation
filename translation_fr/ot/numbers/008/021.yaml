  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: fr
  text: Les Lévites se purifièrent et lavèrent leurs vêtements. Aaron les présenta devant Yahweh comme une offrande de présentation[a], puis Aaron fit l’expiation pour eux afin de les purifier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les agita comme une offrande agitée ». L’hébreu emploie l’expression rituelle habituelle pour une présentation devant Yahweh comme une תְּנוּפָה (tenoufa).'
    reason: La note conserve l’alternative gestuelle traditionnelle tout en signalant que le texte utilise une expression rituelle établie.
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: se purifièrent
  rationale: Le hitpael de חטא désigne ici l’action réflexive de se soumettre à une purification rituelle. Le français « se purifièrent » préserve ce sens sans ajouter explicitement « du péché », absent de la formulation hébraïque.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: lavèrent leurs vêtements
  rationale: Traduction directe et naturelle de כבס et בגד, adaptée au contexte rituel.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: les présenta ... comme une offrande balancée
  rationale: La construction נוף avec תנופה est une expression rituelle de présentation devant Dieu. « Offrande balancée » conserve le terme cultuel traditionnel, tandis que « présenta » évite de suggérer qu’Aaron aurait littéralement agité les Lévites.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend simplement לִפְנֵי, et « Yahweh » représente directement le nom divin יהוה.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: accomplit pour eux le rite d’expiation
  rationale: כפר appartient ici au vocabulaire sacerdotal. Cette formulation française demeure compréhensible tout en préservant la portée rituelle du verbe et la valeur bénéficiaire de עֲלֵיהֶם.
- source_word: לְטַהֲרָם
  choice: afin de les purifier
  rationale: L’infinitif exprime le but ou le résultat de l’acte expiatoire. « Afin de » explicite naturellement ce rapport sans trancher excessivement entre but et résultat.
theological_decisions:
- issue: Distinction entre les termes rituels חטא, כפר et טהר
  choice: « se purifièrent », « accomplit ... le rite d’expiation » et « afin de les purifier »
  alternative: « se nettoyèrent », « fit l’expiation » et « pour les rendre purs »
  rationale: La traduction garde ensemble les notions apparentées de purification personnelle, d’expiation sacerdotale et de purification obtenue, sans leur imposer une systématisation doctrinale ultérieure.
- issue: Nature du geste désigné par נוף avec תנופה
  choice: « les présenta ... comme une offrande balancée »
  alternative: « les balança comme une offrande balancée »
  rationale: L’hébreu emploie l’expression rituelle habituelle, mais ne précise pas concrètement comment le geste fut appliqué aux Lévites. « Présenta » conserve cette réserve, et la note signale la formulation plus littérale.
- issue: Rendu du nom divin יהוה
  choice: « Yahweh »
  alternative: « le SEIGNEUR »
  rationale: Le texte porte le Tétragramme; sa translittération maintient le caractère personnel du nom d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation allège la longue coordination hébraïque sans modifier la succession des actes. Le terme cultuel « offrande balancée » est conservé et expliqué en note.
