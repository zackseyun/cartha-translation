  terminology: « Se purifièrent », « Yahweh » et « expiation » conviennent au registre sacerdotal. « Offrande de présentation » rend plus naturellement la fonction rituelle de תְּנוּפָה tout en évitant d’imposer une description gestuelle. « Fit l’expiation pour eux » est plus direct et plus proche du verbe hébreu que « accomplit pour eux le rite d’expiation ».
