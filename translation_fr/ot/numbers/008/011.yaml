  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: fr
  text: Aaron présentera les Lévites comme offrande de présentation devant Yahweh, parmi les fils d’Israël[a], et ils seront destinés à accomplir le service de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Parmi les fils d’Israël » peut aussi se comprendre « de la part des fils d’Israël » ou « en leur faveur » : les Lévites sont pris d’Israël et le représentent dans le service de Yahweh.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ils seront pour servir le service de Yahweh ». « Offrande de présentation » traduit un terme rituel traditionnellement rendu par « offrande balancée »; le verbe « présentera » appartient à la même racine hébraïque.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: présentera ... en geste de présentation rituelle
  rationale: Le verbe et le nom appartiennent à la même racine et désignent un rite de présentation, traditionnellement associé à l’offrande balancée. Puisque les personnes sont l’objet du rite, cette formulation française conserve le caractère rituel sans suggérer qu’Aaron les agite physiquement.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation consacrée de ce groupe au sein d’Israël.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend directement l’idiome de présence et conserve le nom divin.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: de la part des fils d’Israël
  rationale: מֵאֵת peut marquer ici la provenance ou la représentation. « De la part de » convient au contexte où les Lévites sont présentés par Israël, sans exclure qu’ils soient pris d’entre les Israélites.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression hébraïque traditionnelle et sa forme masculine plurielle.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: et ils seront affectés au service de Yahweh
  rationale: Expression française naturelle qui rend le résultat et la destination exprimés par la construction, tout en conservant le sens cultuel de עֲבֹדָה.
theological_decisions:
- issue: Présentation rituelle de personnes comme תְּנוּפָה
  choice: en geste de présentation rituelle
  alternative: comme offrande balancée
  rationale: Le texte applique aux Lévites une catégorie cultuelle sans indiquer qu’ils sont sacrifiés. La formulation retenue préserve la portée rituelle et le jeu de racine hébreu autant que le permet un français naturel.
- issue: Valeur de מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: de la part des fils d’Israël
  alternative: pris parmi les fils d’Israël
  rationale: Le contexte permet une nuance représentative aussi bien qu’une nuance de provenance. Le texte principal retient la première et la note signale la seconde afin de préserver l’ambiguïté.
- issue: Fonction future des Lévites
  choice: ils seront affectés au service de Yahweh
  alternative: ils seront là pour accomplir le service de Yahweh
  rationale: La formulation exprime l’assignation résultant du rite sans ajouter une conception particulière du ministère lévitique.
translation_notes:
  register: Français international moderne, digne et accessible. « Présentation rituelle » évite l’étrangeté de « balancer les Lévites », tandis que les notes conservent les nuances lexicales et syntaxiques de l’hébreu.
