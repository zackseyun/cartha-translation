  naturalness: Le français est globalement clair, mais « en geste de présentation rituelle » est peu idiomatique dans cette syntaxe. « Comme offrande de présentation » est plus naturel, maintient le registre cultuel et n’implique pas un sacrifice. « Seront destinés à accomplir le service » rend avec dignité la finalité de la dernière proposition.
