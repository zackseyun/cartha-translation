  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahvé[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple suffit naturellement à marquer cette progression, sans qu’un « et » initial soit nécessaire. Le verbe דבר est rendu par « parler », tandis que לֵאמֹר introduit la formulation qui suit.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente directement le tétragramme, au lieu de lui substituer le titre traditionnel « le Seigneur ».
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française consacrée du nom hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction au discours, l’infinitif « dire » annonce les paroles qui suivent. « En ces termes » rend cette fonction de manière naturelle et digne en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin YHWH. « Yahvé » le conserve comme nom propre, tandis que « le Seigneur » refléterait la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique écrit. La formule « en ces termes » évite le calque peu naturel « disant » tout en signalant que le discours commence au verset suivant.
