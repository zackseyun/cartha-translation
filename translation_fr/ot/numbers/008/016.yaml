  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: fr
  text: Car ils me sont entièrement donnés du milieu des fils d’Israël[a]. À la place de tout premier-né qui ouvre le sein maternel[b], de tout premier-né parmi les fils d’Israël[c], je les ai pris pour moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « donnés » pour souligner l’idée : « entièrement donnés », ou « bel et bien donnés ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « qui ouvre le sein maternel » désigne celui qui vient le premier du sein de sa mère, c’est-à-dire le premier-né.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « les fils d’Israël » ; selon le contexte, cette expression peut aussi se rendre par « le peuple d’Israël » ou « les Israélites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: entièrement donnés
  rationale: La répétition du participe passif intensifie l’idée du don. « Entièrement donnés » exprime naturellement en français leur consécration totale, sans reproduire une répétition maladroite.
- source_word: לִי
  choice: me sont … donnés
  rationale: Le pronom avec ל indique ici le destinataire et l’appartenance dans la construction « donnés à moi » ; la tournure française avec pronom indirect est naturelle et précise.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: du milieu des fils d’Israël
  rationale: מִתּוֹךְ marque une sélection opérée au sein d’un groupe. « Du milieu de » conserve cette image et la formulation familiale de l’hébreu.
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans ce contexte, תַּחַת exprime clairement la substitution des lévites aux premiers-nés.
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: tout être qui ouvre le sein maternel
  rationale: 'Cette formulation conserve l’image concrète de l’idiome hébreu tout en restant intelligible en français ; l’apposition suivante en précise le sens : le premier-né.'
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: tout premier-né parmi les fils d’Israël
  rationale: La phrase appositionnelle explicite l’idiome précédent. « Parmi » rend naturellement le מִן partitif.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: je les ai pris pour moi
  rationale: Le parfait présente l’acte comme accompli, et le לִי final souligne la revendication personnelle de Dieu. « Pour moi » rend cette nuance dans un français naturel.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: peuple d’Israël / Israélites
  rationale: L’hébreu emploie explicitement l’expression familiale masculine « fils d’Israël ». La conserver maintient la forme du texte et convient particulièrement à la mention des premiers-nés, tout en laissant entendre sa portée collective dans la première occurrence.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde l’apposition hébraïque entre « tout être qui ouvre le sein maternel » et « tout premier-né », tandis que les notes expliquent l’idiome et l’expression « fils d’Israël ».
