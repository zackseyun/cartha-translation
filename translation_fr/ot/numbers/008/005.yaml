lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative introduit une parole divine. « Parla » en rend précisément le sens et s’accorde naturellement avec « en ces termes ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé dans le texte par un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est la formulation française courante.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule, l’infinitif introduit le contenu du discours qui suit. « En ces termes » remplit cette fonction avec naturel en français, sans calquer lourdement l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le tétragramme, nom personnel de Dieu. « Yahweh » le conserve dans le corps du texte; une note signale le rendu traditionnel.
translation_notes:
  register: Français international moderne, digne et fluide. La formule « parla à Moïse en ces termes » restitue naturellement la formule hébraïque de discours tout en annonçant la parole directe du verset suivant.
