  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: fr
  text: J’ai donné les Lévites en don[a] à Aaron et à ses fils, du milieu des fils d’Israël[b], afin qu’ils accomplissent le service des fils d’Israël dans la tente de la rencontre et qu’ils fassent l’expiation pour les fils d’Israël, afin qu’il n’y ait pas de fléau parmi les fils d’Israël lorsque les fils d’Israël s’approcheront du lieu saint[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète la racine du verbe « donner » pour insister : littéralement, « j’ai donné les Lévites, donnés à Aaron et à ses fils ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi les Israélites ».
    reason: lexical_alternative
  - marker: c
    text: Ou « du sanctuaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: J’ai donné
  rationale: Le passé composé exprime naturellement en français l’acte accompli dont le résultat demeure valable dans ce discours divin.
- source_word: הַלְוִיִּם נְתֻנִים
  choice: les Lévites en don
  rationale: La formulation « donné… en don » maintient de manière idiomatique l’insistance produite en hébreu par la répétition de la racine נתן.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: à Aaron et à ses fils
  rationale: La préposition ל marque ici le destinataire ou bénéficiaire du don.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: du milieu des fils d’Israël
  rationale: Cette traduction conserve l’idée d’un groupe pris au sein d’Israël ainsi que l’expression formelle « fils d’Israël ».
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: afin qu’ils accomplissent le service
  rationale: « Accomplir le service » rend lisiblement la construction hébraïque formée d’un verbe et d’un nom de même racine.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Désignation transparente et usuelle de la tente cultuelle où Dieu rencontre son peuple.
- source_word: וּלְכַפֵּר עַל
  choice: et qu’ils fassent l’expiation pour
  rationale: La traduction garde le sens cultuel de כפר sans préciser au-delà du texte la nature exacte du rôle lévitique.
- source_word: נֶגֶף
  choice: fléau
  rationale: Dans ce contexte de violation possible du sanctuaire, נֶגֶף désigne un coup ou fléau infligé; « fléau » évite le sens trop spécifique que pourrait prendre « peste ».
- source_word: בְּגֶשֶׁת
  choice: lorsqu’ils s’approcheront
  rationale: L’infinitif construit précédé de ב exprime ici la circonstance temporelle de l’approche.
- source_word: הַקֹּדֶשׁ
  choice: le lieu saint
  rationale: Dans le contexte de la tente, le terme désigne concrètement l’espace sacré, tout en permettant l’autre traduction possible « sanctuaire ».
theological_decisions:
- issue: Rôle des Lévites dans le service et l’expiation
  choice: Les Lévites accomplissent le service des fils d’Israël et font l’expiation pour eux.
  alternative: Limiter leur rôle à une assistance pratique sans fonction liée à l’expiation.
  rationale: Le texte attribue explicitement aux Lévites le service et l’action exprimée par כפר. La traduction conserve cette tension sans redéfinir leur rôle selon une distinction théologique extérieure au verset.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites
  rationale: La traduction formelle garde la désignation masculine plurielle du peuple de l’alliance; une note signale l’équivalent français plus courant.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « donné… en don » préserve l’insistance hébraïque sans lourdeur excessive; « fils d’Israël » maintient la forme du texte source, tandis que la note offre l’expression courante.
