  text: וַ/יִּשְׁלַ֤ח מֹשֶׁה֙ לְ/רַגֵּ֣ל אֶת יַעְזֵ֔ר וַֽ/יִּלְכְּד֖וּ בְּנֹתֶ֑י/הָ ו/יירש אֶת הָ/אֱמֹרִ֥י אֲשֶׁר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: fr
  text: Alors Moïse envoya des hommes explorer Yazer. Ils s’emparèrent des localités qui en dépendaient[a] et dépossédèrent les Amorites qui s’y trouvaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses filles », expression hébraïque désignant les localités dépendant d’une ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol de שׁלח exprime ici simplement l’envoi dans la suite narrative; « envoya » est naturel et fidèle.
- source_word: לְרַגֵּל
  choice: explorer
  rationale: Le piel de רגל désigne une reconnaissance du lieu. « Explorer » rend clairement cette mission sans imposer l’idée moderne d’espionnage clandestin.
- source_word: יַעְזֵר
  choice: Yazer
  rationale: Translittération française usuelle et proche de la forme hébraïque du nom de lieu.
- source_word: וַיִּלְכְּדוּ
  choice: ils s’emparèrent
  rationale: לכד indique la prise ou la capture dans un contexte militaire; « s’emparèrent » convient à des localités conquises.
- source_word: בְּנֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Littéralement « ses filles », expression géographique hébraïque désignant les agglomérations dépendant d’une ville principale. La formulation retenue explicite le rapport sans préciser indûment leur taille.
- source_word: וַיִּירַשׁ
  choice: dépossédèrent
  rationale: Dans un contexte de conquête, ירש associe la prise de possession à l’éviction des occupants antérieurs; « dépossédèrent » conserve cette double portée.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier collectif hébreu désigne ici le groupe ethnique et se rend naturellement par le pluriel en français.
- source_word: אֲשֶׁר שָׁם
  choice: qui s’y trouvaient
  rationale: Cette proposition relative désigne les Amorites présents dans les lieux concernés; « s’y trouvaient » est idiomatique en français.
