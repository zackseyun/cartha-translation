  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: fr
  text: Ils l’abattirent, ainsi que ses fils et tout son peuple, sans lui laisser un seul survivant[a] ; puis ils prirent possession de son pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à ne pas lui laisser de survivant ».'
    reason: formal_equivalence
  - marker: b
    text: 'Ou : « ils occupèrent son pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ אֹתוֹ
  choice: Ils l’abattirent
  rationale: Dans ce contexte militaire, נכה désigne le fait de frapper et de vaincre, avec ici une issue mortelle clairement indiquée par l’absence totale de survivants. « Abattirent » garde la force concrète du verbe sans réduire l’action à une simple victoire.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le masculin pluriel בנים désigne ici les fils d’Og ; la précision de genre du texte source est conservée.
- source_word: כָּל עַמּוֹ
  choice: tout son peuple
  rationale: עַם a normalement le sens large de « peuple » et ne doit pas être limité à l’armée dans ce contexte.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: sans lui laisser un seul survivant
  rationale: Cette formulation française naturelle exprime l’anéantissement total indiqué par l’idiome hébreu, tout en conservant le complément « lui » de לוֹ.
- source_word: שָׂרִיד
  choice: survivant
  rationale: Dans un récit de guerre, « survivant » est plus direct et naturel que « reste », lequel pourrait suggérer une notion théologique technique absente du contexte immédiat.
- source_word: וַיִּירְשׁוּ
  choice: ils prirent possession de
  rationale: ירשׁ peut signifier hériter, posséder ou déposséder. Après la victoire militaire, « prendre possession de » rend clairement la saisie effective du territoire.
- source_word: אַרְצוֹ
  choice: son pays
  rationale: אֶרֶץ désigne ici le territoire gouverné par Og. « Pays » est idiomatique en français et évite le sens foncier plus étroit que pourrait prendre « terre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Un seul survivant » exprime naturellement la totalité marquée par la tournure hébraïque. La ponctuation distingue la destruction du peuple de la prise de possession qui en résulte.
