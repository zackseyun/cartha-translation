  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: fr
  text: Yahweh entendit la voix d’Israël et lui livra les Cananéens. Israël les voua à la destruction, eux et leurs villes. On donna donc à ce lieu le nom de Horma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Horma évoque en hébreu l’idée de « vouer à la destruction » ou de « mettre sous interdit ».
    reason: Signaler le jeu étymologique entre חָרְמָה et la racine חרם, perceptible dans le texte source mais absent en français.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre, conformément à la forme personnelle du texte hébreu.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: écouta la voix d’Israël
  rationale: Conserve l’image hébraïque de la « voix » tout en exprimant naturellement que Yahweh a prêté attention à la demande d’Israël.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: lui livra les Cananéens
  rationale: Dans ce contexte hostile, נתן signifie remettre au pouvoir de quelqu’un. Le singulier ethnique hébreu a une valeur collective, rendue naturellement au pluriel en français.
- source_word: וַיַּחֲרֵם אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: Israël les voua à la destruction, eux et leurs villes
  rationale: Le verbe חרם désigne ici la mise irrévocable sous interdit en vue de la destruction. La formulation garde cette portée technique sans employer un terme français opaque; Israël, collectif singulier, est le sujet implicite le plus naturel.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: On donna donc à ce lieu le nom de
  rationale: La tournure impersonnelle française préserve l’indétermination du sujet du verbe hébreu et rend naturellement la formule de dénomination.
- source_word: חָרְמָה
  choice: Horma
  rationale: Emploie la forme française usuelle du toponyme tout en signalant par une note son lien étymologique avec חרם.
theological_decisions:
- issue: Terminologie de la guerre liée à חרם
  choice: les voua à la destruction
  alternative: les détruisit entièrement / les mit sous interdit
  rationale: Cette formulation ne réduit pas חרם au simple fait de détruire et ne masque pas non plus son issue violente. Elle conserve la notion de consécration irrévocable à la destruction sans ajouter d’explication doctrinale.
- issue: Sujet implicite de וַיַּחֲרֵם
  choice: Israël
  alternative: Yahweh / sujet indéfini
  rationale: Le vœu formulé par Israël dans le contexte immédiat et l’accord au singulier avec le collectif Israël soutiennent cette lecture, sans modifier le contenu théologique du récit.
translation_notes:
  register: Français international moderne, digne et accessible. « Écouta la voix » maintient une légère coloration biblique compréhensible; « lui livra » et la tournure impersonnelle « On donna » assurent une lecture naturelle. Le pluriel « les Cananéens » explicite la valeur collective du singulier hébreu.
