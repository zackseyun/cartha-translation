  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « N’aie pas peur de lui, car je l’ai livré entre tes mains[a], avec tout son peuple et son pays. Tu lui feras ce que tu as fait à Sihôn, roi des Amorites, qui habitait à Heshbôn. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je l’ai donné dans ta main ». L’expression signifie : « je l’ai livré en ton pouvoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin présent dans le texte hébreu, au lieu de le remplacer par un titre.
- source_word: אַל תִּירָא אֹתוֹ
  choice: N’aie pas peur de lui
  rationale: Rend naturellement en français moderne l’interdiction exprimée par ירא, sans en renforcer le sens.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: je l’ai livré entre tes mains
  rationale: Le parfait présente la remise comme certaine et accomplie; « livré » explicite le sens de נתן dans ce contexte, tandis que « entre tes mains » conserve l’image hébraïque du pouvoir exercé sur l’adversaire.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: lui, tout son peuple et son pays
  rationale: Conserve les trois objets coordonnés du texte hébreu dans une formulation française fluide.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: Tu lui feras
  rationale: Exprime l’action future annoncée et maintient le parallélisme direct avec « ce que tu as fait ».
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: ce que tu as fait
  rationale: Formulation idiomatique française pour la comparaison avec le traitement antérieur de Sihôn.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: à Sihôn, roi des Amorites
  rationale: Suit le titre hébreu tout en employant la ponctuation naturelle du français.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: qui habitait à Heshbôn
  rationale: Le participe ישב décrit ici la résidence; l’imparfait français convient au cadre narratif passé.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; le rendre par « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur du parfait נָתַתִּי dans la promesse divine
  choice: je l’ai livré
  alternative: je vais le livrer
  rationale: Le parfait hébreu présente la victoire comme déjà accordée et certaine, même si sa réalisation militaire suit encore; le passé composé conserve cette tension temporelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au discours direct de Dieu à Moïse. Les formes « Sihôn » et « Heshbôn » rendent les noms hébreux de manière cohérente; l’image de la main est conservée et expliquée en note.
