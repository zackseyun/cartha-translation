  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: fr
  text: 'Alors le peuple vint trouver Moïse et dit : « Nous avons péché, car nous avons parlé contre Yahweh et contre toi. Prie Yahweh d’éloigner de nous les serpents[a]. » Moïse pria donc pour le peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « le serpent » au singulier; ce singulier peut désigner collectivement le fléau des serpents.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: Alors le peuple vint trouver
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque naturellement la succession, et « vint trouver » convient à une démarche adressée à Moïse.
- source_word: חָטָאנוּ
  choice: Nous avons péché
  rationale: Le parfait exprime ici un acte reconnu dans une confession et dont la portée demeure présente.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: nous avons parlé contre Yahweh et contre toi
  rationale: Avec la préposition ב, le verbe désigne ici une parole hostile. La répétition de « contre » restitue clairement le parallélisme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à sa fonction de nom propre dans le texte hébreu.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: Prie Yahweh
  rationale: Le hitpael de פלל signifie couramment « prier »; l'intercession ressort de la demande et de la conclusion du verset.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: d’éloigner de nous
  rationale: Après l'impératif « Prie », la forme verbale exprime le contenu souhaité de la prière. « Éloigner de nous » est idiomatique et conserve l'idée de retrait.
- source_word: אֶת הַנָּחָשׁ
  choice: les serpents
  rationale: Le nom hébreu est morphologiquement singulier, mais il peut désigner collectivement le fléau constitué par les serpents mentionnés au verset précédent. Le pluriel français rend naturellement ce référent collectif, tandis qu'une note conserve l'ambiguïté formelle.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: Moïse pria donc pour le peuple
  rationale: בְּעַד indique que Moïse prie en faveur du peuple. « Donc » marque ici l'accomplissement de la demande.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L'hébreu emploie explicitement le tétragramme comme nom propre; « Yahweh » le préserve sans le remplacer par un titre.
- issue: Nombre grammatical de הַנָּחָשׁ
  choice: les serpents dans le texte, avec note sur le singulier hébreu
  alternative: le serpent
  rationale: Le contexte immédiat parle d'une invasion de serpents. Le singulier peut toutefois être collectif; la note préserve cette tension sans imposer l'idée d'un unique animal.
