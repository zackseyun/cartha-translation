  source_fidelity: 'Le texte rend fidèlement les principaux éléments de l’hébreu : « le frappa » ne surinterprète pas וַיַּכֵּהוּ comme une mise à mort ; « du tranchant de l’épée » conserve l’image de לְפִי חָרֶב ; « prit possession » rend justement וַיִּירַשׁ dans ce contexte territorial. Les limites géographiques et la répétition de « jusqu’à » reflètent la construction du verset. « Forte » conserve l’indétermination de עַז sans imposer « fortifiée ».'
