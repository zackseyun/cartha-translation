source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: fr
  text: Israël le frappa du tranchant de l’épée et prit possession de son pays, depuis l’Arnon jusqu’au Yabboq, jusqu’aux fils d’Ammon[a], car la frontière des fils d’Ammon était forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les Ammonites.
    reason: La note explicite la valeur ethnique de l’expression hébraïque littérale « fils d’Ammon ».
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: le frappa
  rationale: Le verbe נכה signifie d’abord « frapper ». Cette traduction conserve sa valeur directe sans préciser que le roi fut tué, conclusion que le contexte n’impose pas explicitement.
- source_word: לְפִי חָרֶב
  choice: du tranchant de l’épée
  rationale: L’expression hébraïque évoque littéralement la « bouche » de l’épée. « Du tranchant de l’épée » en garde l’image dans un français clair et idiomatique.
- source_word: וַיִּירַשׁ
  choice: prit possession de
  rationale: Dans ce contexte militaire, ירש désigne la prise de possession d’un territoire, éventuellement par dépossession de ses occupants. Cette formulation évite le sens trompeur d’« hériter ».
- source_word: אַרְצוֹ
  choice: son pays
  rationale: אֶרֶץ désigne ici le domaine territorial du roi. « Son pays » est naturel en français sans suggérer nécessairement l’État-nation moderne.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: depuis l’Arnon jusqu’au Yabboq
  rationale: La paire de prépositions marque l’étendue géographique du territoire conquis; les articles signalent naturellement en français qu’il s’agit de cours d’eau.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: jusqu’aux fils d’Ammon
  rationale: La formulation conserve l’expression ethnique hébraïque, littéralement « fils d’Ammon », sans ajouter le mot « territoire », absent du texte.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici l’explication de la limite atteinte par la conquête.
- source_word: עַז
  choice: forte
  rationale: עַז exprime la force. « Forte » maintient le sens général sans préciser si la frontière était fortifiée, naturellement défendue ou défendue par une puissance militaire.
- source_word: גְּבוּל
  choice: frontière
  rationale: Dans ce contexte territorial, « frontière » rend naturellement גְּבוּל et convient à l’explication de l’arrêt de la conquête.
theological_decisions:
- issue: Portée ethnique de בְּנֵי עַמּוֹן
  choice: les fils d’Ammon
  alternative: les Ammonites
  rationale: L’hébreu emploie une expression masculine de parenté pour désigner collectivement le peuple ammonite. Le texte principal en conserve la forme pour la transparence, tandis que la note en donne l’équivalent ethnique idiomatique.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe suit le mouvement narratif hébreu tout en restant naturelle. « Du tranchant de l’épée » conserve l’image originale; « était forte » préserve l’indétermination du texte quant à la nature précise de la force de la frontière.
