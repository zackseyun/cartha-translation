  terminology: « Israël », « l’Arnon », « le Yabboq » et « les fils d’Ammon » sont cohérents. Le choix littéral « fils d’Ammon », accompagné d’une note donnant l’équivalent ethnique idiomatique, respecte à la fois le texte source et l’usage français. « Frontière » convient bien à גְּבוּל.
