source:
  edition: WLC
  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: fr
  text: 'De là, ils allèrent à Beer[a]. C’est le puits à propos duquel Yahweh avait dit à Moïse : « Rassemble le peuple, et je leur donnerai de l’eau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer est le nom du lieu ; en hébreu, ce nom correspond au mot qui signifie « puits ».
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: De là
  rationale: Cette expression poursuit naturellement l’itinéraire. En français, « De là » suffit à marquer l’enchaînement narratif.
- source_word: בְּאֵרָה
  choice: ils allèrent à Béer
  rationale: La terminaison directionnelle indique un mouvement vers Béer. Le verbe de déplacement, sous-entendu en hébreu, est explicité pour produire une phrase française naturelle.
- source_word: הִוא הַבְּאֵר
  choice: C’est le puits
  rationale: Cette proposition identifie le lieu nommé Béer au puits qui fait l’objet de la parole divine.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: à propos duquel Yahweh avait dit à Moïse
  rationale: Le relatif rattache le puits à la parole divine citée ensuite. Le plus-que-parfait situe naturellement cette parole avant l’étape racontée, sans modifier son contenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre plutôt que remplacé par un titre.
- source_word: אֱסֹף אֶת הָעָם
  choice: Rassemble le peuple
  rationale: L’impératif direct est conservé, et « le peuple » désigne ici collectivement Israël.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: et je leur donnerai de l’eau
  rationale: Le cohortatif exprime ici la volonté ou l’engagement divin à la suite de l’ordre donné à Moïse. Le futur français en restitue naturellement la force.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. Le conserver distingue ce nom d’un simple titre.
- issue: Valeur du cohortatif וְאֶתְּנָה
  choice: je leur donnerai de l’eau
  alternative: afin que je leur donne de l’eau
  rationale: Après l’impératif, la forme peut exprimer le but ou la résolution. Le futur maintient la promesse et l’intention divines sans imposer une lecture causale trop étroite.
translation_notes:
  register: Français international moderne, simple et digne. Le verbe de déplacement implicite est explicité. La répétition entre le nom Béer et le mot « puits » est conservée et expliquée en note.
