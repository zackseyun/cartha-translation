  yaml_path: translation/ot/numbers/021/031.yaml
  text: So Israel lived in the land of the Amorites[a].
translation:
  language: fr
  text: Israël habita dans le pays des Amorites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: habita
  rationale: Le verbe יָשַׁב peut signifier « s’asseoir, habiter, demeurer, s’établir ». Ici, dans ce résumé narratif, « habita » exprime naturellement le fait qu’Israël résida dans le territoire, sans insister autant que « s’installa » sur un établissement permanent.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française traditionnelle et courante du nom du peuple.
- source_word: בְּאֶרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici le territoire des Amorites. « Pays » est naturel en français moderne dans cette construction et conserve le sens territorial.
- source_word: הָאֱמֹרִי
  choice: des Amorites
  rationale: Bien que l’hébreu emploie une forme gentilique singulière collective, le pluriel français désigne naturellement le peuple auquel appartient le territoire.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient à la narration biblique écrite; « habita » reste fidèle au verbe source tout en évitant l’archaïsme de « demeura » et la nuance potentiellement trop forte de « s’installa ».
