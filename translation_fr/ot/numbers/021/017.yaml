  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: fr
  text: 'Alors Israël chanta ce chant :


    « Jaillis, ô puits ! Répondez-lui[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus explicite : « Répondez-lui en chant ! » Le verbe hébreu signifie littéralement « répondre » et peut désigner ici une réponse chantée, peut-être antiphonale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui fait avancer le récit et introduit naturellement l’action suivante.
- source_word: יָשִׁיר
  choice: chanta
  rationale: Bien que la forme soit un inaccompli, la construction narrative avec אָז lui donne ici une valeur passée.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre traditionnel du peuple, conservé sous sa forme française usuelle.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ce chant
  rationale: Rend directement le nom défini accompagné du démonstratif et convient à la citation poétique qui suit.
- source_word: עֲלִי
  choice: Jaillis
  rationale: Impératif féminin singulier adressé au puits. « Jaillis » exprime naturellement, dans ce contexte, la montée de l’eau, tout en gardant la vigueur poétique de l’appel.
- source_word: בְאֵר
  choice: ô puits
  rationale: Le puits est directement interpellé ; « ô » marque clairement le vocatif dans un registre poétique digne.
- source_word: עֱנוּ לָהּ
  choice: Répondez-lui
  rationale: L’impératif pluriel signifie littéralement « répondez-lui » et peut évoquer une réponse chantée ou antiphonée. La traduction principale conserve cette formulation et sa légère ambiguïté.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et poétique. « Jaillis » est plus naturel dans l’image d’un puits que le très formel « Monte », tandis que la note préserve la valeur responsive et possiblement musicale de עֱנוּ לָהּ.
