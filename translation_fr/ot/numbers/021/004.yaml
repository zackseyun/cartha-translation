source:
  edition: WLC
  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: fr
  text: Ils partirent du mont Hor par la route de la mer Rouge[a], afin de contourner le pays d’Édom, et le peuple perdit patience en chemin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « par la route de la mer des Roseaux ». Hébreu : yam souf.'
    reason: lexical_alternative
  - marker: b
    text: Ou « le peuple se découragea en chemin » ou « perdit courage en chemin ». L’expression hébraïque peut évoquer aussi bien l’impatience que le découragement; « en chemin » peut également se comprendre « à cause du chemin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les récits d’itinéraire au désert, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » est naturel et suffisamment précis en français.
- source_word: מֵהֹר הָהָר
  choice: du mont Hor
  rationale: « Mont Hor » est la forme française usuelle de ce nom de lieu.
- source_word: דֶּרֶךְ יַם סוּף
  choice: par la route de la mer Rouge
  rationale: דֶּרֶךְ désigne ici une route ou un itinéraire. La traduction traditionnelle « mer Rouge » est retenue dans le texte, tandis que « mer des Roseaux » est signalé en note pour préserver l’alternative lexicale de יַם־סוּף.
- source_word: לִסְבֹב
  choice: afin de contourner
  rationale: L’infinitif exprime le but du trajet. « Contourner » rend clairement l’idée de passer autour du territoire d’Édom.
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: le pays d’Édom
  rationale: אֶרֶץ peut désigner le pays ou le territoire d’un peuple. « Le pays d’Édom » est idiomatique et direct.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: le peuple perdit patience
  rationale: L’expression idiomatique קצר נפש évoque une patience à bout, mais peut aussi exprimer le découragement. « Perdit patience » convient au contexte sans effacer l’autre nuance, conservée en note.
- source_word: בַּדָּרֶךְ
  choice: en chemin
  rationale: La préposition ב est rendue selon son sens locatif direct. Le syntagme peut aussi suggérer que la route elle-même provoqua cet état.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe en deux phrases allège la coordination hébraïque sans modifier la progression du récit. « Mais » explicite légèrement le contraste narratif entre le départ et la réaction du peuple.
