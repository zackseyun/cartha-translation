  text: בְּאֵ֞ר חֲפָר֣וּ/הָ שָׂרִ֗ים כָּר֨וּ/הָ֙ נְדִיבֵ֣י הָ/עָ֔ם בִּ/מְחֹקֵ֖ק בְּ/מִשְׁעֲנֹתָ֑/ם וּ/מִ/מִּדְבָּ֖ר מַתָּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: fr
  text: 'le puits que les princes ont creusé,

    que les nobles du peuple ont creusé

    avec le bâton de commandement[a], avec leurs bâtons.

    Puis, du désert, ils sont allés à Mattana[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « avec le législateur » : le mot hébreu peut désigner un dirigeant ou un législateur, ou le bâton / sceptre qui symbolise son autorité.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu dit littéralement : « et du désert, Mattana » ; le contexte indique probablement le passage d’une étape de l’itinéraire à la suivante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: le puits
  rationale: Le nom désigne le puits précis célébré au verset précédent ; l’article défini est naturel en français malgré son absence formelle en hébreu.
- source_word: חֲפָרוּהָ
  choice: ont creusé
  rationale: Le verbe חפר signifie « creuser » ; le suffixe féminin renvoie à בְּאֵר, déjà placé en tête du vers.
- source_word: שָׂרִים
  choice: princes
  rationale: Le terme désigne ici des dirigeants de haut rang ; « princes » conserve la tonalité élevée du chant.
- source_word: כָּרוּהָ
  choice: ont percé
  rationale: Le verbe כרה exprime l’action de creuser ou d’excaver. « Percé » maintient le parallélisme tout en distinguant ce second verbe de חפר.
- source_word: נְדִיבֵי הָעָם
  choice: les nobles du peuple
  rationale: En parallèle avec שָׂרִים, נְדִיבִים désigne vraisemblablement les notables ou nobles plutôt que les personnes volontaires ou généreuses.
- source_word: בִּמְחֹקֵק
  choice: avec le sceptre du chef
  rationale: מְחֹקֵק peut désigner un législateur, un dirigeant ou son sceptre. Le parallélisme avec « leurs bâtons » favorise ici un instrument associé à l’autorité.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: avec leurs bâtons
  rationale: מִשְׁעֵנָה est un bâton servant d’appui. « Bâtons » est clair et naturel dans ce contexte poétique.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: Puis, du désert, ils sont allés à Mattana
  rationale: La proposition introduit l’étape suivante de l’itinéraire. Le mouvement et le verbe sont implicites en hébreu mais nécessaires à une formulation française naturelle.
theological_decisions:
- issue: Sens de בִּמְחֹקֵק dans le parallélisme poétique
  choice: 'lecture instrumentale : « avec le sceptre du chef »'
  alternative: 'lecture personnelle : « avec le législateur » ou « sous la conduite du législateur »'
  rationale: Le parallèle immédiat avec « avec leurs bâtons » favorise le sens d’un objet symbolisant l’autorité, sans exclure l’autre analyse lexicale.
- issue: Valeur de וּמִמִּדְבָּר מַתָּנָה
  choice: 'transition d’itinéraire : « du désert, ils sont allés à Mattana »'
  alternative: 'formulation elliptique : « et du désert, Mattana »'
  rationale: Les versets suivants énumèrent des étapes de voyage ; expliciter le déplacement rend en français la fonction contextuelle de l’ellipse hébraïque.
translation_notes:
  register: Français international moderne, digne et poétique. La disposition en lignes conserve le parallélisme du chant, puis la dernière phrase marque clairement la reprise de l’itinéraire.
