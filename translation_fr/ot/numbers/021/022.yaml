  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֗/ךָ לֹ֤א נִטֶּה֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּ/דֶ֤רֶךְ הַ/מֶּ֨לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבֻלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: fr
  text: « Permets-moi de traverser ton pays. Nous ne nous détournerons pas vers les champs ni vers les vignes, et nous ne boirons pas l’eau d’un puits. Nous suivrons la route du roi[a] jusqu’à ce que nous ayons franchi ta frontière. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « la voie royale ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Laisse-moi traverser
  rationale: Le cohortatif qal à la première personne du singulier exprime ici une demande adressée au roi. Cette formulation est naturelle et conserve la force de la requête.
- source_word: בְאַרְצְךָ
  choice: ton pays
  rationale: אֶרֶץ désigne ici le pays placé sous l’autorité du destinataire; « pays » convient au contexte politique et géographique.
- source_word: לֹא נִטֶּה
  choice: nous ne nous détournerons
  rationale: נטה évoque le fait de quitter l’itinéraire prévu; le verbe pronominal français préserve cette image de mouvement.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: ni dans les champs ni dans les vignes
  rationale: Les singuliers hébreux ont une valeur générique. Le pluriel français rend naturellement les espaces cultivés qu’Israël s’engage à ne pas emprunter.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: nous ne boirons pas l’eau des puits
  rationale: L’expression signifie littéralement « les eaux d’un puits ». Le pluriel générique en français communique clairement l’engagement de ne pas utiliser les ressources locales.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: nous suivrons la route du roi
  rationale: L’expression désigne littéralement la voie ou route du roi. « Suivre la route » exprime naturellement le déplacement le long de cet axe.
- source_word: נֵלֵךְ
  choice: nous suivrons
  rationale: הלך signifie aller ou marcher. Avec « route », « suivre » donne une formulation française idiomatique sans modifier le sens.
- source_word: עַד אֲשֶׁר נַעֲבֹר
  choice: jusqu’à ce que nous ayons franchi
  rationale: La proposition indique le terme du passage; le subjonctif passé présente naturellement en français l’action comme accomplie à cette limite.
- source_word: גְּבֻלֶךָ
  choice: ton territoire
  rationale: גְּבוּל peut désigner une frontière, mais aussi l’étendue territoriale qu’elle délimite. Ici, puisqu’il s’agit d’achever la traversée du pays, « territoire » est plus naturel que « frontière ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement reflète l’adresse directe au roi dans un contexte diplomatique ancien. Les pluriels « champs », « vignes » et « puits » rendent la valeur générique des singuliers hébreux. Le marqueur [a] figure dans le texte à l’expression annotée.
