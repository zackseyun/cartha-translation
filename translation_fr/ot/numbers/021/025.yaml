source:
  edition: WLC
  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: fr
  text: Israël prit toutes ces villes et s’établit dans toutes les villes des Amorites, à Heshbon et dans toutes les localités qui en dépendaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et dans toutes ses filles », expression qui désigne les petites localités dépendant d’une ville principale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie fondamentalement « prendre ». Dans ce contexte militaire, « prit » exprime naturellement la conquête sans préciser davantage que l’hébreu.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: toutes ces villes
  rationale: La traduction conserve explicitement le quantificateur et le démonstratif ; « villes » est ici le terme français courant pour עָרִים.
- source_word: וַיֵּשֶׁב
  choice: s’établit
  rationale: Le verbe ישׁב peut signifier habiter ou s’installer. « S’établit » rend ici le fait qu’Israël occupa ces lieux pour y résider.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: dans toutes les villes des Amorites
  rationale: Cette formulation reproduit clairement la relation exprimée par l’état construit hébreu, tout en employant l’appellation française usuelle « Amorites ».
- source_word: בְּחֶשְׁבּוֹן
  choice: à Heshbon
  rationale: Le nom propre est translittéré sous la forme française intelligible « Heshbon » ; la préposition locative se rend naturellement par « à » devant un nom de ville.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: et dans toutes les localités qui en dépendaient
  rationale: Littéralement, les « filles » d’une ville sont les petites localités placées sous sa dépendance. La formulation choisie transmet clairement cet idiome en français moderne, tandis que la note en conserve l’image.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu, avec la répétition de « toutes les villes », tandis que l’idiome des « filles » est explicité dans le texte et signalé en note.
