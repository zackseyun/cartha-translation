  yaml_path: translation/ot/numbers/021/015.yaml
  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: fr
  text: et le versant des oueds[a], qui s’étend jusqu’au site d’Ar[b] et s’appuie contre la frontière de Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vallées » ou « des ravins » ; le mot hébreu désigne souvent des lits de cours d’eau saisonniers (des oueds).
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’à la demeure d’Ar » ou « jusqu’au siège d’Ar ». L’expression hébraïque est difficile et peut désigner l’emplacement ou la localité d’Ar.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: versant
  rationale: Le nom désigne une pente ou un versant, particulièrement dans un cadre topographique. « Versant » est naturel et précis en français.
- source_word: הַנְּחָלִים
  choice: des oueds
  rationale: נחל désigne souvent un lit de cours d’eau saisonnier. « Oueds » conserve cette précision géographique propre au contexte désertique.
- source_word: אֲשֶׁר נָטָה
  choice: qui s’étend
  rationale: נטה peut signifier étendre, incliner ou déployer. Dans cette description géographique, « s’étend » exprime clairement l’orientation spatiale.
- source_word: לְשֶׁבֶת עָר
  choice: jusqu’au site d’Ar
  rationale: La construction est difficile et peut évoquer l’emplacement, le siège ou le lieu habité d’Ar. « Site d’Ar » convient au contexte topographique sans trancher en faveur de l’idée d’habitation.
- source_word: עָר
  choice: Ar
  rationale: Nom de lieu conservé par translittération.
- source_word: וְנִשְׁעַן
  choice: et s’appuie contre
  rationale: שען signifie littéralement s’appuyer ou reposer sur. La formulation conserve la métaphore topographique de l’hébreu.
- source_word: לִגְבוּל מוֹאָב
  choice: la frontière de Moab
  rationale: גבול désigne ici la frontière ou la limite territoriale. « Frontière de Moab » est clair et idiomatique.
