  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: fr
  text: Puis les Israélites partirent et campèrent à Oboth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partirent
  rationale: Dans un itinéraire au désert, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » est naturel en français moderne et exprime clairement le passage à l’étape suivante.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais fonctionne ici comme un ethnonyme collectif. « Les Israélites » en restitue naturellement le sens sans suggérer que seuls les hommes sont concernés.
- source_word: וַיַּחֲנוּ
  choice: campèrent
  rationale: Le verbe חנה est le terme habituel des récits d’itinéraire pour l’établissement d’un camp. « Campèrent » est précis, courant et digne.
- source_word: בְּאֹבֹת
  choice: à Oboth
  rationale: Oboth est un nom de lieu, conservé par translittération. Après « camper », la préposition française idiomatique devant un lieu-étape est « à ».
- source_word: וַ
  choice: Puis
  rationale: Le waw narratif fait progresser le récit et marque ici la succession des étapes. « Puis » rend cette progression avec naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation brève conserve le caractère d’un relevé d’itinéraire. Le nom propre « Oboth » suit la forme fournie par la couche de consultation anglaise.
