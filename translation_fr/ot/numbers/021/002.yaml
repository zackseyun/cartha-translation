source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: fr
  text: 'Alors Israël fit un vœu à l’Éternel en disant : « Si tu livres vraiment[a] ce peuple entre mes mains, je vouerai leurs villes à la destruction[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe : littéralement, « si donnant, tu donnes ce peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je frapperai leurs villes d’interdit ». Le verbe hébreu renvoie au ḥerem, par lequel quelque chose était voué irrévocablement, ici à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: fit un vœu
  rationale: La construction hébraïque à verbe et nom de même racine exprime l’acte solennel de prononcer un engagement. « Faire un vœu » est l’expression française naturelle et précise.
- source_word: לַיהוָה
  choice: à l’Éternel
  rationale: « L’Éternel » est la convention française biblique courante pour représenter le nom divin יהוה, tout en le distinguant du titre « Seigneur ».
- source_word: אִם נָתֹן תִּתֵּן
  choice: Si tu livres vraiment
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Vraiment » restitue cette insistance dans un français naturel.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier collectif עָם et le démonstratif sont rendus directement, sans transformer le groupe en pluriel.
- source_word: בְּיָדִי
  choice: entre mes mains
  rationale: Cette expression française conserve l’image hébraïque de la main comme pouvoir ou maîtrise, avec une tournure idiomatique naturelle.
- source_word: וְהַחֲרַמְתִּי
  choice: je vouerai ... à la destruction
  rationale: 'Le verbe חרם désigne ici la mise sous ḥerem : une consécration irrévocable conduisant à la destruction. Cette formulation garde à la fois la dimension formelle et l’issue destructrice.'
- source_word: עָרֵיהֶם
  choice: leurs villes
  rationale: « Villes » est le correspondant direct de עָרִים et convient au contexte militaire.
theological_decisions:
- issue: Le sens du ḥerem dans un vœu de guerre
  choice: je vouerai leurs villes à la destruction
  alternative: je détruirai entièrement leurs villes ; je frapperai leurs villes d’interdit
  rationale: 'La formulation retenue ne réduit pas חרם à une simple destruction militaire : elle conserve sa dimension de mise à part irrévocable, tout en rendant explicite son issue. Elle évite aussi d’imposer une explication doctrinale ou éthique étrangère au verset.'
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure claire à l’oral comme à l’écrit. « Entre mes mains » conserve l’image source sous une forme idiomatique ; « vouer à la destruction » préserve la gravité et la portée rituelle du ḥerem sans jargon dans le corps du texte.
