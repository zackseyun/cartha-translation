source:
  edition: WLC
  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: fr
  text: 'Car un feu est sorti de Heshbon,

    une flamme de la cité de Sihôn ;

    elle a dévoré Ar de Moab[a],

    les maîtres des hauts lieux de l’Arnon[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ville de Moab ». L’hébreu עָר peut être compris ici comme le nom propre Ar ou comme le nom commun « ville ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les maîtres des hauteurs de l’Arnon » ; par extension, certains comprennent « les habitants des hauteurs de l’Arnon ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication donnée par ce vers du chant et conserve la valeur causale du terme hébreu.
- source_word: אֵשׁ יָצְאָה
  choice: un feu est sorti
  rationale: Rend directement l’image poétique d’un feu qui part de Heshbon, avec l’accompli hébreu exprimé naturellement en français.
- source_word: מֵחֶשְׁבּוֹן
  choice: de Heshbon
  rationale: Le nom géographique est translittéré sous sa forme française courante.
- source_word: לֶהָבָה
  choice: une flamme
  rationale: Préserve le parallélisme concret avec « un feu ».
- source_word: מִקִּרְיַת סִיחֹן
  choice: de la cité de Sihôn
  rationale: קִרְיָה est un nom commun signifiant « cité » ou « ville » ; « cité » maintient ici le registre poétique sans en faire un nom propre.
- source_word: אָכְלָה
  choice: il a dévoré
  rationale: Le verbe signifie littéralement « manger » et décrit couramment l’action destructrice du feu ; « dévorer » conserve cette métaphore avec naturel.
- source_word: עָר מוֹאָב
  choice: Ar de Moab
  rationale: עָר est vraisemblablement ici le nom propre de la localité moabite Ar, tout en laissant signaler en note l’autre analyse possible.
- source_word: בַּעֲלֵי
  choice: les maîtres de
  rationale: Rend directement le pluriel construit de בַּעַל, « maîtres, possesseurs » ; une traduction par « habitants » serait plus interprétative.
- source_word: בָּמוֹת
  choice: hauts lieux
  rationale: Le mot peut désigner des hauts lieux, souvent associés au culte, ou plus généralement des hauteurs ; la formulation retenue conserve son sens lexical établi et son ambiguïté contextuelle est signalée en note.
- source_word: אַרְנֹן
  choice: l’Arnon
  rationale: L’article est idiomatique en français pour ce cours d’eau ou ravin géographique.
theological_decisions:
- issue: Nature de בָּמוֹת
  choice: hauts lieux
  alternative: hauteurs
  rationale: Le contexte poétique et géographique permet les deux sens. Le texte garde le sens lexical traditionnel sans imposer une référence cultuelle certaine, et la note préserve l’autre possibilité.
- issue: Référent de בַּעֲלֵי
  choice: maîtres
  alternative: habitants ou possesseurs
  rationale: La traduction formelle évite de déterminer sans preuve si l’expression désigne des chefs, des possesseurs ou, par extension, les habitants du lieu.
translation_notes:
  register: Vers poétique disposé en quatre lignes afin de faire ressortir les parallélismes. Langue actuelle et digne ; « cité » et « dévoré » maintiennent la vigueur du chant sans archaïsme excessif.
