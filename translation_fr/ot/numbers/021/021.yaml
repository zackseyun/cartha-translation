  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: fr
  text: 'Israël envoya alors des messagers à Sihôn, roi des Amorites, pour lui dire :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya alors
  rationale: Le wayyiqtol fait progresser le récit. « Envoya alors » rend naturellement en français cette succession narrative sans reproduire mécaniquement la conjonction hébraïque.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre désignant ici le peuple d’Israël; la forme française traditionnelle convient.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte diplomatique, le terme désigne des représentants humains et non des êtres célestes. « Messagers » reste naturel et moins interprétatif qu’« émissaires ».
- source_word: אֶל
  choice: à
  rationale: La préposition directionnelle est rendue idiomatiquement avec le verbe français « envoyer quelqu’un à quelqu’un ».
- source_word: סִיחֹן
  choice: Sihôn
  rationale: Transcription française courante du nom propre hébreu.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: roi des Amorites
  rationale: Le syntagme construit désigne Sihôn comme roi du peuple amorite. Le pluriel collectif est la formulation française la plus naturelle.
- source_word: לֵאמֹר
  choice: pour lui dire
  rationale: L’infinitif introduit les paroles rapportées au verset suivant. « Pour lui dire » est idiomatique et explicite naturellement que le message s’adresse à Sihôn.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase conserve la progression narrative et prépare les paroles directes du verset suivant. Aucune note n’est nécessaire: contrairement à l’anglais, « roi amorite » et « roi des Amorites » ne présentent pas ici une ambiguïté grammaticale qu’il faille préserver; la seconde formulation exprime naturellement le rapport de souveraineté.'
