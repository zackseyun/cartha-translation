  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: fr
  text: Moïse fit un serpent de bronze[a] et le plaça sur la perche[b]. Lorsqu’un serpent mordait quelqu’un[c] et que cette personne regardait le serpent de bronze[d], elle vivait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un serpent de cuivre ». Le terme hébreu peut désigner le cuivre ou le bronze.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’étendard » ou « la bannière ». Le mot hébreu désigne un objet élevé servant de signal.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « un homme » ; le terme a ici une portée représentative et désigne toute personne mordue.
    reason: lexical_alternative
  - marker: d
    text: Cet épisode est repris dans une perspective typologique en Jean 3.14-15.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: serpent
  rationale: « Serpent » conserve le registre narratif et littéraire du texte hébreu, tout en désignant clairement aussi bien l’animal que sa représentation façonnée.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme hébreu peut désigner le cuivre ou le bronze. « Bronze » correspond à l’usage biblique français courant, tandis que l’autre possibilité est signalée en note.
- source_word: הַנֵּס
  choice: la perche
  rationale: Dans ce contexte, le mot désigne le support élevé sur lequel Moïse place le serpent. « Perche » est concret et naturel en français; « étendard » ou « bannière » mettrait davantage l’accent sur la fonction de signal.
- source_word: וְהָיָה
  choice: Dès lors
  rationale: Cette formulation introduit naturellement la situation répétée qui résulte de l’action de Moïse, sans reproduire mécaniquement une tournure hébraïque peu idiomatique en français.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: si le serpent mordait quelqu’un
  rationale: L’imparfait français exprime ici une éventualité répétée. « Quelqu’un » restitue la portée représentative de אִישׁ sans limiter artificiellement l’énoncé aux hommes de sexe masculin.
- source_word: וְהִבִּיט אֶל
  choice: regardait
  rationale: Le verbe exprime simplement l’action de porter le regard vers le serpent. Cette traduction évite d’ajouter dans le texte principal une nuance théologique tirée de son emploi typologique ultérieur.
- source_word: וָחָי
  choice: elle restait en vie
  rationale: Cette expression rend clairement le résultat concret dans le contexte d’une morsure potentiellement mortelle. Elle demeure proche du sens de « vivre » sans ajouter l’idée plus interprétative de guérison.
theological_decisions:
- issue: Portée représentative du masculin אִישׁ
  choice: quelqu’un
  alternative: un homme
  rationale: Le nom masculin singulier est employé ici pour toute personne mordue. Le français « quelqu’un » en transmet naturellement la portée générale; la forme littérale est indiquée en note.
- issue: Possible lecture typologique de וְהִבִּיט אֶל
  choice: regardait
  alternative: tournait les regards vers
  rationale: Nombres 21:9 décrit d’abord l’action concrète de regarder le serpent. La portée typologique donnée en Jean 3.14-15 est signalée en note plutôt qu’intégrée dans la formulation du texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression du récit hébreu, tout en employant une construction conditionnelle naturelle. Les répétitions de « serpent de bronze » sont maintenues pour préserver la cohésion lexicale du verset.
