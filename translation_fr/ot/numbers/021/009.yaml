  to: Moïse fit un serpent de bronze[a] et le plaça sur la perche[b]. Lorsqu’un serpent mordait quelqu’un[c] et que cette personne regardait le serpent de bronze[d], elle vivait.
  rationale: La révision retire deux connecteurs français qui ajoutaient respectivement une conséquence et une temporalité non exigées par l’hébreu. Elle remplace également une expression interprétative de survie par « vivait », tout en conservant la valeur narrative habituelle et l’ambiguïté théologique du texte source.
