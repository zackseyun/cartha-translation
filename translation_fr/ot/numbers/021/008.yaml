source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: fr
  text: 'Alors Yahvé dit à Moïse : « Fais-toi un serpent brûlant[a] et place-le sur une perche[b]. Toute personne mordue qui le regardera restera en vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « séraph » ; littéralement « un brûlant ». Dans ce contexte, le terme désigne un serpent dont la morsure produit un effet brûlant.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner un étendard, un signal ou le mât qui le porte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français le nom divin personnel, plutôt que de le remplacer par un titre ; « Yahvé » est la forme française traditionnelle et immédiatement reconnaissable.
- source_word: עֲשֵׂה לְךָ
  choice: Fais-toi
  rationale: Rend de façon naturelle l’impératif accompagné du pronom datif, tout en conservant l’adresse personnelle faite à Moïse.
- source_word: שָׂרָף
  choice: serpent brûlant
  rationale: Le contexte identifie l’objet à un serpent et le terme hébreu évoque ce qui brûle, probablement par l’effet de la morsure. Cette traduction préserve l’image sans introduire explicitement la notion interprétative de venin ni l’association angélique ultérieure de « séraphin ».
- source_word: נֵס
  choice: perche
  rationale: Dans ce contexte, le mot désigne le support visible sur lequel le serpent doit être placé. « Perche » exprime clairement le référent concret, tandis que les sens plus généraux d’étendard ou de signal sont signalés en note.
- source_word: הַנָּשׁוּךְ
  choice: Toute personne mordue
  rationale: Le participe passif substantivé a une portée générale. Cette formulation française est inclusive, idiomatique et fidèle à « quiconque est mordu ».
- source_word: וְרָאָה אֹתוֹ
  choice: qui le regardera
  rationale: « Regarder » convient mieux que le simple « voir » à l’action intentionnelle décrite. La proposition relative conserve le lien entre la personne mordue, son regard et le résultat.
- source_word: וָחָי
  choice: restera en vie
  rationale: Dans le contexte d’une morsure potentiellement mortelle, la forme verbale annonce la survie. Cette expression française rend clairement ce résultat sans développer le mécanisme de la guérison.
theological_decisions:
- issue: Référent et image de שָׂרָף
  choice: « serpent brûlant » dans le texte principal
  alternative: « séraphin », « être brûlant » ou « serpent venimeux »
  rationale: Le récit impose ici le référent du serpent, tandis que l’adjectif « brûlant » maintient l’image lexicale hébraïque. « Serpent venimeux » préciserait une cause que le verset ne nomme pas, et « séraphin » risquerait d’évoquer à tort les êtres célestes d’autres passages.
- issue: Sens de וָחָי
  choice: « restera en vie »
  alternative: « vivra »
  rationale: Les deux traductions sont possibles. « Restera en vie » met en évidence la survie après la morsure sans nier que l’hébreu puisse se rendre plus littéralement par « vivra ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est fluide pour la lecture publique. Les notes sont placées immédiatement après les termes qu’elles expliquent, corrigeant ainsi le décalage apparent des marqueurs dans la couche anglaise de consultation.
