id: NUM.21.6
reference: Numbers 21:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: fr
  text: Alors Yahweh envoya parmi le peuple les serpents brûlants[a] ; ils mordirent le peuple, et beaucoup d’Israélites moururent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « serpents venimeux » ou « serpents ardents ». L’hébreu dit littéralement : « les serpents, les brûlants » ; le qualificatif peut évoquer l’effet brûlant de leur morsure.'
    reason: Alternative lexicale et préservation de l’ambiguïté du qualificatif hébreu.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: envoya
  rationale: Le verbe שׁלח, dans cette forme narrative, signifie directement « envoyer ». Le passé simple convient au récit biblique en français soutenu et actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve le tétragramme comme nom propre plutôt que de le remplacer par un titre.
- source_word: בָּעָם
  choice: parmi le peuple
  rationale: 'La préposition ב est comprise ici dans son sens locatif : les serpents sont envoyés au milieu du peuple. « Contre le peuple » expliciterait davantage l’hostilité que ne le fait la préposition elle-même.'
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: les serpents brûlants
  rationale: « Serpents » traduit נְחָשִׁים et « brûlants » conserve l’image de שְּׂרָפִים sans la réduire à l’explication « venimeux ». Le qualificatif peut évoquer leur nature ou l’effet brûlant de leur morsure.
- source_word: וַיְנַשְּׁכוּ
  choice: ils mordirent
  rationale: נשׁך signifie « mordre ». Le passé simple maintient la succession narrative.
- source_word: וַיָּמָת
  choice: moururent
  rationale: מות est le verbe ordinaire signifiant « mourir » ; ce choix reste direct et non interprétatif.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: beaucoup d’Israélites
  rationale: Cette formulation française naturelle rend l’idée d’un grand nombre de personnes appartenant à Israël. Elle évite le tour peu idiomatique « beaucoup du peuple d’Israël ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte le nom divin. « Yahweh » le conserve comme nom propre et évite de lui substituer silencieusement un titre.
- issue: Sens de הַשְּׂרָפִים
  choice: brûlants
  alternative: venimeux ; ardents
  rationale: Le qualificatif hébreu est imagé et n’indique pas explicitement s’il décrit l’apparence des serpents ou l’effet de leur morsure. « Brûlants » maintient cette tension ; la note signale les principales lectures possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient la cadence narrative sans archaïsme lexical. Le point-virgule évite une accumulation de coordinations. « Beaucoup d’Israélites » est idiomatique tout en rendant עַם רָב מִיִּשְׂרָאֵל.
