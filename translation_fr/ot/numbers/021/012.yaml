  text: מִ/שָּׁ֖ם נָסָ֑עוּ וַֽ/יַּחֲנ֖וּ בְּ/נַ֥חַל זָֽרֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: fr
  text: De là, ils partirent et campèrent dans le ravin de Zéred[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’oued de Zéred » ou « près du torrent de Zéred » ; le mot hébreu naḥal peut désigner un ravin, un oued ou le lit d’un cours d’eau saisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: De là
  rationale: L’expression adverbiale indique le départ depuis l’étape précédente; « De là » est naturel et conserve l’enchaînement du récit.
- source_word: נָסָעוּ
  choice: ils partirent
  rationale: Dans les récits d’itinéraire, נסע désigne la levée du camp et le départ. « Partirent » exprime clairement ce mouvement en français courant.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה signifie établir son camp. « Campèrent » est précis, naturel et adapté au registre narratif.
- source_word: בְּנַחַל
  choice: dans le ravin
  rationale: נַחַל peut désigner un ravin, un oued ou le lit d’un cours d’eau saisonnier. « Ravin » rend clairement la réalité géographique sans supposer un cours d’eau permanent; la préposition בְּ est conservée par « dans ».
- source_word: זָרֶד
  choice: Zéred
  rationale: Nom géographique translittéré selon l’usage français, avec un accent pour guider la prononciation.
