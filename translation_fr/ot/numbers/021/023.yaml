source:
  edition: WLC
  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: fr
  text: Mais Sihôn ne permit pas à Israël de traverser son territoire[a]. Alors Sihôn rassembla tout son peuple[b] et sortit vers le désert à la rencontre d’Israël. Il arriva à Yahats[c] et combattit Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de franchir sa frontière ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « tout son peuple » ; le contexte militaire laisse entendre qu’il s’agit d’une force armée, sans employer explicitement le mot « armée ».
    reason: lexical_alternative
  - marker: c
    text: Nom aussi transcrit « Yahça » ou « Yahaz » dans certaines traductions.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַן
  choice: permit
  rationale: Dans cette construction avec l’infinitif « traverser », le verbe exprime idiomatiquement la permission plutôt que le don.
- source_word: עֲבֹר
  choice: traverser
  rationale: Le verbe désigne ici le passage d’Israël à travers le pays de Sihôn.
- source_word: בִּגְבֻלוֹ
  choice: son territoire
  rationale: גְּבוּל peut désigner une frontière, des limites ou le territoire qu’elles délimitent ; le contexte demande ici le sens territorial.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: rassembla tout son peuple
  rationale: La formulation conserve « tout son peuple » sans remplacer ce terme par « armée », que le contexte militaire suggère mais que l’hébreu n’énonce pas.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: à la rencontre d’Israël
  rationale: Cette expression signifie littéralement aller à la rencontre de quelqu’un ; l’hostilité est explicitée ensuite par le combat.
- source_word: הַמִּדְבָּרָה
  choice: dans le désert
  rationale: La terminaison directionnelle marque un mouvement vers le désert ; avec « partir », « dans le désert » exprime naturellement cette destination en français.
- source_word: יָהְצָה
  choice: Yahats
  rationale: Transcription française usuelle du nom de lieu hébreu יַהַץ, avec la terminaison directionnelle dans la forme du verset.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: combattit Israël
  rationale: En français, « combattre Israël » exprime naturellement l’engagement hostile indiqué par לחם avec ב.
- source_word: וְלֹא
  choice: Mais ... ne ... pas
  rationale: La conjonction introduit ici un contraste avec la demande de passage formulée auparavant.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. La traduction reste proche de l’hébreu tout en évitant les calques peu naturels ; elle conserve notamment « tout son peuple » et la formulation relativement neutre « à la rencontre ».
