  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: fr
  text: De là, ils repartirent et campèrent de l’autre côté de l’Arnon[a], qui se trouve dans le désert s’étendant depuis la frontière des Amorites[b], car l’Arnon forme la frontière de Moab, entre Moab et les Amorites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà de l’Arnon ». L’expression hébraïque peut désigner l’autre côté ou la région située au-delà d’une limite, selon le point de vue adopté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui est dans le désert, sortant de la frontière de l’Amorite ». Le participe « sortant » peut se rapporter au désert ou, selon une autre analyse, à l’Arnon ; la traduction le rattache au désert.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: מִשָּׁם
  choice: De là
  rationale: Expression adverbiale courante qui reprend le lieu précédent et assure naturellement la progression du récit.
- source_word: נָסָעוּ
  choice: ils repartirent
  rationale: Dans les récits d’étapes, נסע désigne la levée du camp et le départ. « Repartirent » convient au déplacement successif depuis une halte précédente.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Rend directement l’action d’établir le camp dans un français moderne et naturel.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: au-delà de l’Arnon
  rationale: עֵבֶר désigne l’autre côté ou la région située au-delà d’une limite. Cette formulation concise conserve la dépendance du point de vue, explicitée en note.
- source_word: אֲשֶׁר בַּמִּדְבָּר הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: dans le désert qui s’étend depuis la frontière des Amorites
  rationale: La tournure française exprime naturellement la description géographique. Le participe יצא, littéralement « sortant », prend ici le sens spatial de s’étendre à partir d’une limite; l’ambiguïté de rattachement est signalée en note.
- source_word: גְּבוּל
  choice: frontière
  rationale: Le nom désigne ici la ligne séparant deux territoires. « Frontière » convient aux deux occurrences et évite de suggérer l’ensemble du territoire.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier morphologique fonctionne collectivement pour le peuple amorite; le pluriel est idiomatique en français.
- source_word: כִּי
  choice: En effet
  rationale: Introduit l’explication géographique qui justifie la description précédente.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: l’Arnon marque la frontière de Moab
  rationale: La proposition nominale présente l’Arnon comme limite territoriale. « Marque la frontière » est plus naturel en français que « est la frontière » sans ajouter d’idée étrangère au texte.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: entre Moab et les Amorites
  rationale: La répétition de בֵּין identifie clairement les deux parties séparées par la frontière.
