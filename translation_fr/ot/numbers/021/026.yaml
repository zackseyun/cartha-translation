  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: fr
  text: Car Heshbon était la ville de Sihôn, roi des Amorites. Celui-ci avait combattu le précédent roi de Moab et lui avait pris tout son territoire jusqu’à l’Arnon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente au sujet de Heshbon.
- source_word: עִיר
  choice: ville
  rationale: Rend directement le terme hébreu et convient à Heshbon comme centre royal.
- source_word: הִוא
  choice: était
  rationale: La proposition nominale hébraïque est située naturellement au passé dans ce récit historique.
- source_word: נִלְחַם בְּ
  choice: avait combattu
  rationale: Exprime le combat contre un adversaire; le plus-que-parfait marque l’antériorité dans cette explication rétrospective.
- source_word: הָרִאשׁוֹן
  choice: le précédent
  rationale: Dans ce contexte, désigne le roi de Moab antérieur plutôt que nécessairement le tout premier roi.
- source_word: וַיִּקַּח
  choice: avait arraché
  rationale: Le verbe indique la prise du territoire; « arracher à quelqu’un » restitue naturellement en français l’idée de retrait de son contrôle.
- source_word: כָּל אַרְצוֹ
  choice: tout son territoire
  rationale: Le suffixe renvoie au roi de Moab, et « territoire » convient au domaine politique conquis.
- source_word: מִיָּדוֹ
  choice: lui avait arraché
  rationale: Transpose l’idiome littéral « de sa main » en français naturel tout en conservant l’idée de dépossession et de perte de pouvoir.
- source_word: עַד אַרְנֹן
  choice: jusqu’à l’Arnon
  rationale: Indique la limite géographique atteinte par la conquête.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La reprise par « Celui-ci » clarifie que le sujet du combat est Sihôn, tandis que « lui » et « son territoire » renvoient au précédent roi de Moab, sans alourdir la phrase.
