base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: fr
  text: Ils partirent d’Oboth et campèrent à Iyé-Abarim[a], dans le désert, en face de Moab, à l’est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Iyé-Abarim peut aussi être compris selon son sens comme « les ruines d’Abarim » ou « les monceaux d’Abarim » ; ici, il sert de nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les itinéraires du désert, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » est naturel en français et convient à cette étape du voyage.
- source_word: מֵאֹבֹת
  choice: d’Oboth
  rationale: Nom de lieu, translittéré selon une forme française claire.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה signifie établir son camp. « Campèrent » conserve le sens concret dans un français courant.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: à Iyé-Abarim
  rationale: L’expression fonctionne ici comme un nom de lieu. La translittération est donc retenue dans le texte, tandis que son sens lexical possible est signalé en note.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר peut désigner une région aride ou semi-aride inhabitée. « Désert » est naturel et immédiatement compréhensible dans ce contexte géographique.
- source_word: אֲשֶׁר עַל פְּנֵי מוֹאָב
  choice: qui fait face à Moab
  rationale: Dans une indication géographique, עַל־פְּנֵי exprime une position en face de, vis-à-vis de. Cette formulation préserve l’orientation sans imposer une précision absente du texte.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: du côté du soleil levant
  rationale: Littéralement liée au lever du soleil, l’expression indique le côté oriental. Cette traduction conserve l’image hébraïque tout en restant idiomatique en français.
