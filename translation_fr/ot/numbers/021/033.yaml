id: NUM.21.33
reference: Numbers 21:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּפְנוּ֙ וַֽ/יַּעֲל֔וּ דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתָ֜/ם ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: fr
  text: Puis ils changèrent de direction et montèrent par la route du Bashân. Og, roi du Bashân, sortit à leur rencontre avec tout son peuple pour leur livrer bataille à Édréi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: ils changèrent de direction
  rationale: Le verbe פנה marque ici un changement de direction. Cette formulation est plus explicite et naturelle en français moderne que le simple « ils se tournèrent ».
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: עלה exprime un mouvement ascendant, possiblement topographique; « montèrent » le conserve avec concision.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: par la route du Bashân
  rationale: דרך suivi du nom de lieu désigne la route associée à la région du Bashân. « Par la route du Bashân » préserve l'ambiguïté entre route traversant et route menant à cette région.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, roi du Bashân
  rationale: L'apposition est rendue naturellement en français, avec translittération des noms propres.
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: יצא signifie littéralement « sortir ». Le contexte militaire suffit à indiquer la nature de cette sortie sans ajouter « marcha ».
- source_word: לִקְרָאתָם
  choice: à leur rencontre
  rationale: Cette expression rend directement le sens de לקראת, neutre en soi; l'hostilité est explicitée par la proposition suivante sur la bataille.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: avec tout son peuple
  rationale: עם signifie « peuple », non explicitement « armée ». « Avec » restitue idiomatiquement la coordination hébraïque dans cette phrase française.
- source_word: לַמִּלְחָמָה
  choice: pour leur livrer bataille
  rationale: La préposition ל marque ici le but. Cette expression française naturelle explicite le complément déjà présent dans le contexte sans transformer « peuple » en « armée ».
- source_word: אֶדְרֶעִי
  choice: à Édréi
  rationale: Le nom de lieu est translittéré; faute de préposition explicite en hébreu, « à » indique naturellement le lieu de l'affrontement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms Bashân et Édréi suivent une translittération française traditionnelle avec accents circonflexe et aigu. L'ambiguïté lexicale de לִקְרָאתָם est conservée par « à leur rencontre », tandis que le contexte hostile demeure explicite dans « pour leur livrer bataille ».
