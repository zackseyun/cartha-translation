  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: fr
  text: Nous avons tiré sur eux[a] ; Heshbon a péri jusqu’à Dibon. Nous avons dévasté jusqu’à Nophah[b], qui s’étend jusqu’à Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de cette proposition est difficile et a reçu plusieurs interprétations, notamment : « nous les avons renversés » ou « leur domination a disparu ».'
    reason: textual_variant
  - marker: b
    text: La forme traduite par « nous avons dévasté » est elle aussi incertaine ; certains l’analysent autrement, mais le contexte de ce chant de victoire favorise un verbe exprimant la dévastation.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: Nous avons tiré sur eux
  rationale: La forme est très difficile. L’analyse comme verbe lié à l’idée de tirer, avec une première personne du pluriel et un suffixe de troisième personne du pluriel, rend bien l’image guerrière vive du chant, sans masquer l’incertitude signalée en note.
- source_word: אָבַד
  choice: a péri
  rationale: Le verbe exprime la disparition ou la destruction. « A péri » conserve son aspect accompli et le ton poétique du chant de victoire.
- source_word: חֶשְׁבּוֹן
  choice: Heshbon
  rationale: Nom de lieu transcrit sous sa forme française biblique courante.
- source_word: עַד דִּיבוֹן
  choice: jusqu’à Dibon
  rationale: עַד indique ici la limite ou l’étendue territoriale.
- source_word: וַנַּשִּׁים
  choice: Nous avons tout dévasté
  rationale: La forme est incertaine, mais le contexte militaire favorise un verbe de dévastation à la première personne du pluriel. L’ajout idiomatique de « tout » exprime naturellement en français l’idée de ravager sans introduire un nouvel objet précis.
- source_word: עַד נֹפַח
  choice: jusqu’à Nofah
  rationale: עַד marque l’étendue, et Nofah est transcrit comme nom de lieu.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: qui s’étend jusqu’à Madaba
  rationale: La proposition relative ajoute une indication géographique. Cette formulation reste intelligible tout en conservant le rattachement syntaxique ambigu à Nofah.
- source_word: מֵידְבָא
  choice: Madaba
  rationale: Emploi de la forme française moderne et courante du nom de lieu biblique.
