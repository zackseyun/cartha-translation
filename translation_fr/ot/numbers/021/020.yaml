  text: וּ/מִ/בָּמ֗וֹת הַ/גַּיְא֙ אֲשֶׁר֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַ/פִּסְגָּ֑ה וְ/נִשְׁקָ֖פָה עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: fr
  text: et de Bamoth à la vallée située dans la campagne de Moab, puis au sommet du Pisga, qui domine le désert[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Yeshimôn », si le terme hébreu est compris comme le nom propre de cette région plutôt que comme une désignation descriptive.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui regarde la face du désert » ; l’expression décrit un lieu qui fait face à cette région ou la surplombe.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: et de Bamoth
  rationale: Les préfixes וּ et מִ sont rendus par « et de ». Dans cet itinéraire, בָּמוֹת fonctionne comme un nom de lieu ; il est donc translittéré plutôt que traduit par « hauts lieux ».
- source_word: הַגַּיְא
  choice: la vallée
  rationale: גַּיְא peut désigner une vallée ou un ravin. « Vallée » convient naturellement à cette description géographique.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: située dans la campagne de Moab
  rationale: שָׂדֶה signifie littéralement « champ », mais peut désigner la campagne ou un territoire ouvert. « Campagne de Moab » conserve l’image géographique sans suggérer une parcelle cultivée précise.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: jusqu’au sommet du Pisga
  rationale: רֹאשׁ signifie littéralement « tête », mais « sommet » est le terme français naturel dans ce contexte topographique. Pisga est traité comme un nom propre.
- source_word: וְנִשְׁקָפָה
  choice: qui domine
  rationale: Le verbe décrit le sommet comme donnant sur la région située en contrebas. La proposition relative maintient son lien avec « le sommet du Pisga ».
- source_word: עַל פְּנֵי
  choice: domine
  rationale: L’expression signifie littéralement « sur la face de » et, dans ce cadre géographique, indique que le sommet fait face à une étendue ou la surplombe. « Domine » rend idiomatiquement cette relation spatiale.
- source_word: הַיְשִׁימֹן
  choice: l’étendue désertique
  rationale: יְשִׁימוֹן désigne une région désolée ou désertique. La traduction descriptive reste naturelle en français, tandis que la possibilité d’un nom régional est signalée en note.
