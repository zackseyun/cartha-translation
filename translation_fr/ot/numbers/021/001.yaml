source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: fr
  text: Lorsque le Cananéen, roi d’Arad, qui habitait le Néguev, apprit qu’Israël arrivait par la route d’Atarim[a], il combattit Israël et fit des prisonniers parmi les Israélites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « par la route d’Atarim ». Le sens du terme « Atarim » est incertain : certains y voient un nom de lieu, tandis que d’autres, sous l’influence de versions anciennes, le comprennent comme « les espions » ou « les éclaireurs ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Dans ce récit, שׁמע désigne la réception d’une nouvelle. « Apprit » est naturel en français et exprime clairement que le roi fut informé de l’approche d’Israël.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: le Cananéen, roi d’Arad
  rationale: L’article défini présente le personnage comme « le Cananéen », tandis que « roi d’Arad » précise son identité en apposition. Cette construction suit de près l’hébreu tout en restant idiomatique.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: qui habitait le Néguev
  rationale: Le participe יֹשֵׁב indique la résidence. Le nom géographique « Néguev » est conservé plutôt que généralisé en « sud ».
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: qu’Israël arrivait
  rationale: Après « apprit », כִּי introduit le contenu de la nouvelle. L’imparfait « arrivait » rend l’approche alors en cours qui provoque la réaction du roi.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: par la route d’Atarim
  rationale: דֶּרֶךְ signifie « chemin, route, itinéraire ». Comme אֲתָרִים est obscur, sa translittération prudente comme nom propre préserve l’incertitude du texte; les autres compréhensions sont signalées en note.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: il combattit Israël
  rationale: Cette formulation rend directement l’engagement hostile sans préciser indûment l’ampleur du conflit.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: fit prisonniers certains des siens
  rationale: Le verbe שׁבה et le nom apparenté שֶׁבִי expriment la capture de prisonniers. מִמֶּנּוּ a ici une valeur partitive et renvoie au collectif Israël; « certains des siens » l’explicite naturellement sans identifier le nombre.
