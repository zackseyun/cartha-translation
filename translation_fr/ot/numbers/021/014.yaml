id: NUM.21.14
reference: Numbers 21:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: fr
  text: 'C’est pourquoi il est dit dans le Livre des guerres de Yahweh : « Waheb[a] en Soufa[b], et les oueds de l’Arnon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de ce vers cité est obscur. Certains comprennent « Waheb » autrement, notamment comme faisant partie d’une proposition verbale plutôt que comme un nom de lieu.
    reason: lexical_alternative
  - marker: b
    text: 'Ou peut-être : « dans la tempête », si Soufa est compris comme un nom commun plutôt que comme un nom de lieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette tournure française naturelle conserve la valeur déductive de la formule hébraïque qui introduit la citation.
- source_word: יֵאָמַר
  choice: il est dit
  rationale: Le niphal de אמר a ici un emploi impersonnel servant à introduire une citation.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: dans le Livre des guerres de Yahweh
  rationale: « Livre » rend naturellement סֵפֶר dans le titre d’une source écrite connue; le pluriel « guerres » et le nom divin sont conservés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶת וָהֵב
  choice: Waheb
  rationale: Dans cette citation très obscure, וָהֵב est vraisemblablement un nom de lieu; la translittération évite d’imposer un sens verbal conjectural.
- source_word: בְּסוּפָה
  choice: en Soufa
  rationale: Le terme est traité comme un nom de lieu et adapté à l’orthographe française; le sens nominal commun « dans la tempête » reste signalé en note.
- source_word: וְאֶת הַנְּחָלִים אַרְנוֹן
  choice: et les oueds de l’Arnon
  rationale: נְחָלִים désigne ici probablement des cours d’eau saisonniers ou leurs vallées; « oueds » est géographiquement précis, tandis que « de l’Arnon » conserve le rapport syntaxique sans le surinterpréter.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte donne le nom propre du Dieu d’Israël dans le titre de l’ouvrage cité; « Yahweh » le conserve explicitement.
translation_notes:
  register: Français international moderne, sobre et digne. « Oueds » conserve la précision géographique du contexte; les notes maintiennent les incertitudes réelles de la citation poétique hébraïque.
