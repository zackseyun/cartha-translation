  text: וּ/מִ/מַּתָּנָ֖ה נַחֲלִיאֵ֑ל וּ/מִ/נַּחֲלִיאֵ֖ל בָּמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: fr
  text: De Mattana à Nahaliel, et de Nahaliel à Bamoth[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu Bamoth peut aussi signifier « hauteurs » ou « hauts lieux » ; dans cet itinéraire, il est probablement employé comme nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: De Mattana
  rationale: La préposition מִן marque le point de départ (« de »). Le waw assure ici la continuité de l’itinéraire; en français, il n’est pas nécessaire de le rendre par « et » en tête de ce fragment. מַתָּנָה est traité comme un nom de lieu et translittéré selon une forme française naturelle.
- source_word: נַחֲלִיאֵל
  choice: à Nahaliel
  rationale: Aucune préposition n’est exprimée devant ce nom, mais le style elliptique de l’itinéraire indique le déplacement vers l’étape suivante. « à » est donc ajouté pour produire un français clair, sans modifier le sens.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: et de Nahaliel
  rationale: Le waw est rendu par « et » pour relier les deux étapes, tandis que מִן est traduit par « de ». Le nom du lieu est reproduit de manière cohérente.
- source_word: בָּמֽוֹת
  choice: Bamoth
  rationale: Dans cette liste d’étapes, בָּמוֹת fonctionne vraisemblablement comme un nom de lieu. La translittération préserve cette lecture, tandis que le sens lexical possible « hauteurs » ou « hauts lieux » est signalé en note.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et dignifié. La formulation conserve le style très condensé de l’itinéraire hébreu, tout en ajoutant « à » devant Nahaliel, nécessaire à la clarté en français. Le premier waw n’est pas rendu explicitement, car un « Et » initial serait peu naturel dans ce fragment et la continuité est déjà portée par le contexte.
