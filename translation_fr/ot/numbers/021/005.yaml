base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: fr
  text: 'Le peuple parla contre Dieu et contre Moïse : « Pourquoi nous avez-vous fait monter d’Égypte pour que nous mourions dans le désert ? Il n’y a ni pain ni eau, et nous avons en horreur ce pain misérable[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce pain méprisable » ou « ce pain sans valeur ». L’adjectif hébreu est rare et exprime le dédain du peuple pour la nourriture que Dieu lui fournit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: Le peuple parla contre Dieu et contre Moïse
  rationale: Dans ce contexte accusateur, דבר avec ב a une valeur hostile. « Parla contre » conserve cette force sans amplifier en « blasphéma » ni réduire à une parole neutre.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: nous avez-vous fait monter d’Égypte
  rationale: Le hiphil de עלה signifie « faire monter ». Cette formulation préserve l’expression spatiale traditionnelle de la sortie d’Égypte et le pluriel hébreu adressé à Dieu et à Moïse.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: pour que nous mourions dans le désert
  rationale: L’infinitif exprime ici le but que le peuple prête avec accusation à ses conducteurs. « Désert » est le terme français courant pour מִדְבָּר dans ce cadre, sans impliquer nécessairement une étendue uniquement sablonneuse.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: Il n’y a ni pain ni eau
  rationale: La coordination française « ni… ni… » rend naturellement la double négation. « Pain » maintient la répétition de לֶחֶם avec la proposition suivante.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: et nous avons en horreur
  rationale: Littéralement, « notre personne/notre âme éprouve du dégoût ». La tournure française exprime avec naturel et dignité la forte répulsion du texte.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: ce pain misérable
  rationale: L’adjectif rare קְלֹקֵל exprime le mépris envers la nourriture reçue. « Misérable » conserve l’évaluation dépréciative sans imposer l’idée précise d’une nourriture avariée. Le démonstratif « ce » est idiomatique en français dans cette plainte.
theological_decisions:
- issue: Caractère de la parole du peuple envers Dieu et Moïse
  choice: « parla contre Dieu et contre Moïse »
  alternative: « parla à Dieu et à Moïse » ou « parla de Dieu et de Moïse »
  rationale: Le contenu de la citation est clairement accusateur. Le rendu adversatif fait ressortir la rébellion présente dans le contexte sans ajouter une qualification doctrinale absente du verset.
- issue: Personnes visées par l’accusation « Pourquoi… ? »
  choice: Maintien du pluriel « avez-vous »
  alternative: Singulier « as-tu », compris comme adressé seulement à Moïse
  rationale: La forme verbale hébraïque הֶעֱלִיתֻנוּ est plurielle, en accord avec la mention conjointe de Dieu et de Moïse. La traduction préserve cette tension théologique plutôt que de restreindre silencieusement l’adresse à Moïse.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La répétition de « pain » est conservée afin de refléter la rhétorique paradoxale de la plainte : le peuple affirme qu’il n’y a pas de pain tout en méprisant le pain qui lui est donné.'
