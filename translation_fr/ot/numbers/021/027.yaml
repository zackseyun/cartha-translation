base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: fr
  text: 'C’est pourquoi les poètes[a] disent : « Venez à Heshbon ! Que la ville de Sihon soit bâtie et solidement établie ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui prononcent des proverbes », « les bardes » ; traditionnellement, « les chefs ». Le participe hébreu désigne probablement ici les auteurs ou récitants d’un chant proverbial, et non des dirigeants politiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette expression introduit la conséquence ou l’explication tirée du récit précédent et conserve naturellement la valeur logique de l’hébreu.
- source_word: יֹאמְרוּ
  choice: disent
  rationale: L’imparfait hébreu a ici une valeur habituelle ou gnomique dans une formule de citation ; le présent français convient.
- source_word: הַמֹּשְׁלִים
  choice: les poètes
  rationale: Dans ce contexte, le participe désigne vraisemblablement les auteurs ou récitants d’un chant proverbial ou satirique, plutôt que des dirigeants politiques.
- source_word: בֹּאוּ
  choice: Venez
  rationale: L’impératif masculin pluriel appelle les auditeurs à venir à Heshbon.
- source_word: חֶשְׁבּוֹן
  choice: Heshbon
  rationale: Le nom de lieu est translittéré sous sa forme française internationale usuelle.
- source_word: תִּבָּנֶה
  choice: Que … soit bâtie
  rationale: La forme poétique a ici une nuance volitive, rendue naturellement en français par « Que … soit bâtie ».
- source_word: וְתִכּוֹנֵן
  choice: et solidement établie
  rationale: Le verbe כון évoque ce qui est rendu stable ou fermement établi ; « solidement » explicite cette nuance tout en maintenant le parallélisme poétique.
- source_word: עִיר סִיחוֹן
  choice: la ville de Sihon
  rationale: Cette formulation rend clairement la relation exprimée par l’état construit hébreu sans préciser davantage sa nature.
