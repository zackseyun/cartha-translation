source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: fr
  text: Malheur à toi[a], Moab ! Tu es anéanti, peuple de Kemosh ! Il a fait de ses fils des fugitifs et de ses filles des captives pour Sihôn, roi des Amorites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a fait des fils de Moab des fugitifs et des filles de Moab des captives », si les suffixes renvoient à Moab plutôt qu’à Kemosh.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Malheur à toi
  rationale: L’interjection exprime à la fois la lamentation et l’annonce du désastre; cette formule conserve la vigueur poétique de l’apostrophe.
- source_word: אָבַדְתָּ
  choice: Tu es anéanti
  rationale: Le parfait décrit la perte catastrophique de Moab; « anéanti » reste proche du sens d’אבד et convient au chant de dérision.
- source_word: עַם כְּמוֹשׁ
  choice: peuple de Kemosh
  rationale: Le groupe construit désigne le peuple associé à la divinité moabite; la translittération « Kemosh » reflète directement le nom hébreu.
- source_word: נָתַן
  choice: Il a livré
  rationale: Le sens premier est « donner », mais dans ce contexte de défaite, « livrer » exprime naturellement la remise des fils et des filles à leur sort et à Sihôn.
- source_word: בָּנָיו פְּלֵיטִם
  choice: ses fils à la fuite
  rationale: Cette formulation rend le parallélisme résultatif tout en conservant dans פְּלֵיטִים l’idée de personnes contraintes de fuir.
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: ses filles à la captivité
  rationale: La tournure rend explicitement l’état ou le sort indiqué par בַּשְּׁבִית et maintient le parallélisme avec « à la fuite ».
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: à Sihôn, roi des Amorites
  rationale: Le lamed marque ici la destination ou le bénéficiaire de la remise; l’apposition identifie clairement Sihôn.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans בָּנָיו et וּבְנֹתָיו
  choice: 'Les suffixes renvoient à Kemosh : « ses fils » et « ses filles ».'
  alternative: 'Les suffixes renvoient collectivement à Moab : « ses fils » et « ses filles », avec Moab comme antécédent personnifié.'
  rationale: Kemosh est l’antécédent immédiat et la personnification poétique présente les Moabites comme ses enfants. L’ambiguïté réelle est toutefois signalée en note.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsme marqué. Ponctuation française et noms propres translittérés d’après l’hébreu.
