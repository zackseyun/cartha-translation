  text: לְ/אָבִ֣י/ו וּ/לְ/אִמּ֗/וֹ לְ/אָחִי/ו֙ וּ/לְ/אַ֣חֹת֔/וֹ לֹא יִטַּמָּ֥א לָ/הֶ֖ם בְּ/מֹתָ֑/ם כִּ֛י נֵ֥זֶר אֱלֹהָ֖י/ו עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: fr
  text: Même pour son père ou sa mère, son frère ou sa sœur, il ne se rendra pas impur à leur mort[a], car la consécration[b] de son Dieu est sur sa tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand ils meurent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : nézer. Dans le contexte du naziréat, ce mot désigne la consécration ou la mise à part pour Dieu, symbolisée par la chevelure portée sur la tête.'
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: Même pour son père ou sa mère, son frère ou sa sœur
  rationale: La mise en tête et « même » rendent en français l’insistance produite par les groupes prépositionnels placés avant l’interdiction en hébreu, tout en conservant les termes de parenté au singulier.
- source_word: לֹא יִטַּמָּא
  choice: il ne se rendra pas impur
  rationale: Cette formulation restitue la valeur réfléchie de la forme hébraïque et renvoie à l’impureté rituelle sans suggérer à tort une souillure morale.
- source_word: לָהֶם בְּמֹתָם
  choice: à leur mort
  rationale: La formulation française exprime naturellement la circonstance dans laquelle l’impureté liée aux proches décédés serait contractée, tout en gardant la tournure nominale de l’hébreu.
- source_word: כִּי
  choice: car
  rationale: « Car » introduit clairement la raison de l’interdiction dans un registre biblique actuel et digne.
- source_word: נֵזֶר
  choice: la consécration
  rationale: Dans le contexte du naziréat, le terme désigne la consécration ou mise à part pour Dieu, dont la chevelure constitue le signe visible; le contexte ne requiert pas le sens concret de « couronne ».
- source_word: אֱלֹהָיו
  choice: de son Dieu
  rationale: Le suffixe possessif explicite est conservé, ainsi que la relation formulée de manière concise et non développée dans le texte source.
- source_word: עַל רֹאשׁוֹ
  choice: est sur sa tête
  rationale: La traduction garde l’image concrète et l’allusion probable à la chevelure du nazir sans expliciter cette interprétation dans le corps du verset.
theological_decisions:
- issue: Nature de l’impureté dans la législation du naziréat
  choice: Employer « se rendre impur » dans son sens rituel et cultuel.
  alternative: Employer « se souiller », expression susceptible d’évoquer d’abord une faute morale.
  rationale: Le contexte concerne l’impureté rituelle contractée au contact de la mort; le verset n’affirme pas que cet état constitue en lui-même une souillure morale.
- issue: Portée de נֵזֶר dans le contexte du naziréat
  choice: Traduire par « consécration » et expliquer en note son rapport avec la mise à part et la chevelure.
  alternative: Traduire directement par « couronne », « chevelure consacrée » ou « signe de consécration ».
  rationale: « Consécration » communique la portée cultuelle sans réduire le mot à son symbole matériel ni ajouter dans le texte une précision interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe initiale met en relief les liens familiaux, tandis que « se rendre impur » maintient la distinction entre impureté rituelle et faute morale. Les deux appels de note sont placés sur les expressions qu’ils éclairent.
