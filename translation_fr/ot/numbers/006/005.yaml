revisions:
- from: Pendant toute la durée de son vœu de naziréat[a], aucun rasoir ne passera sur sa tête. Jusqu’à ce que soient accomplis les jours durant lesquels il se consacre à Yahweh, il sera saint ; il laissera pousser librement les cheveux de sa tête.
  to: Pendant toute la durée de son vœu de naziréat[a], aucun rasoir ne passera sur sa tête. Jusqu’à ce que s’achèvent les jours durant lesquels il se consacre à Yahweh, il sera saint ; il laissera pousser les cheveux de sa tête.
  rationale: La révision retire l’adverbe interprétatif « librement », tout en conservant l’exigence explicite de laisser pousser les cheveux. Elle allège aussi la formulation temporelle et précise l’alternative lexicale de la note sans modifier le sens du passage.
