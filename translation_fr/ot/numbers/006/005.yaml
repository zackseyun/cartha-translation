  variant: modern international French
source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: fr
  text: Pendant toute la durée de son vœu de naziréat[a], aucun rasoir ne passera sur sa tête. Jusqu’à ce que s’achèvent les jours durant lesquels il se consacre à Yahweh, il sera saint ; il laissera pousser les cheveux de sa tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son vœu de séparation ». Le terme hébreu à l’origine de « naziréat » évoque la mise à part et la consécration.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: son vœu de naziréat
  rationale: Cette formulation française naturelle conserve le terme technique désignant l’engagement du naziréen, tout en maintenant l’idée de consécration propre à la racine נזר.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: aucun rasoir ne passera sur sa tête
  rationale: Le rendu garde l’image concrète et l’expression juridique de l’hébreu, tout en étant intelligible en français moderne.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: jusqu’à ce que soient accomplis les jours
  rationale: Cette tournure restitue la notion d’achèvement portée par מלא et préserve la formulation temporelle solennelle du texte.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: durant lesquels il se consacre à Yahweh
  rationale: « Se consacre » exprime naturellement en français la mise à part volontaire indiquée par le hifil de נזר, sans effacer son lien avec le naziréat.
- source_word: קָדֹשׁ יִהְיֶה
  choice: il sera saint
  rationale: Le terme théologique explicite קָדֹשׁ est conservé plutôt que remplacé par une simple explication telle que « mis à part ».
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: il laissera pousser librement les cheveux de sa tête
  rationale: « Laisser pousser librement » rend à la fois la valeur permissive de גַּדֵּל et l’idée de chevelure non taillée ou laissée libre portée par פֶּרַע.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Maintien du terme קָדֹשׁ
  choice: il sera saint
  alternative: il sera consacré / mis à part
  rationale: « Saint » conserve la portée théologique du mot hébreu, tandis que le contexte du vœu en explicite déjà la dimension de consécration.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique et l’image du rasoir sont conservées, tandis que « laisser pousser librement » rend naturellement la nuance de פֶּרַע. Le masculin suit la formulation de ce verset dans son contexte immédiat.
