  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: fr
  text: Le prêtre offrira l’un en sacrifice pour le péché[a] et l’autre en holocauste. Il fera l’expiation pour lui, parce qu’il a péché en rapport avec la personne morte[b], et il consacrera sa tête ce même jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sacrifice de purification ». Le terme hébreu peut désigner le sacrifice pour le péché ou, particulièrement dans un contexte d’impureté rituelle, un sacrifice de purification.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « au sujet de la personne ». Dans ce contexte, le mot hébreu désigne une personne morte; l’expression concerne la souillure rituelle liée à un mort.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: Le prêtre offrira
  rationale: Dans ce contexte sacrificiel, עשה (« faire ») signifie idiomatiquement préparer et présenter l’offrande; « offrira » est naturel et précis en français.
- source_word: אֶחָד לְחַטָּאת
  choice: l’un en sacrifice pour le péché
  rationale: חַטָּאת désigne ici une catégorie sacrificielle pouvant être comprise comme sacrifice pour le péché ou sacrifice de purification. Le rendu principal conserve l’appellation traditionnelle, tandis que la note signale l’autre valeur, particulièrement pertinente dans un contexte d’impureté rituelle.
- source_word: וְאֶחָד לְעֹלָה
  choice: l’autre en holocauste
  rationale: עֹלָה est l’offrande entièrement consumée. « Holocauste » demeure le terme biblique français précis et courant dans la législation sacrificielle.
- source_word: וְכִפֶּר עָלָיו
  choice: Il accomplira ainsi le rite d’expiation pour lui
  rationale: כפר en contexte sacerdotal exprime l’accomplissement du rite qui produit l’expiation. Cette formulation garde la portée cultuelle sans imposer une théorie particulière de l’expiation.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: parce qu’il a péché au contact du mort
  rationale: Le contexte immédiat montre que נֶפֶשׁ désigne ici une personne morte, et que la faute est liée à la souillure contractée lors de cette mort. « Au contact du mort » exprime naturellement en français la relation contextuelle, sans présenter la personne morte comme la victime d’une faute morale.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: et il consacrera sa tête
  rationale: Le texte dit littéralement « consacrer sa tête ». Cette formulation préserve le symbole de la chevelure du nazir et n’ajoute pas explicitement l’idée de « reconsacrer », bien qu’elle soit impliquée par le contexte.
- source_word: בַּיּוֹם הַהוּא
  choice: ce même jour
  rationale: La formule rend l’indication temporelle et l’immédiateté de la reprise de la consécration dans un français naturel.
theological_decisions:
- issue: Valeur de חַטָּאת dans un contexte d’impureté rituelle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme nomme traditionnellement le sacrifice pour le péché, mais peut mettre l’accent sur la purification, notamment après une souillure rituelle. Le texte principal retient l’appellation largement reconnue et la note préserve l’ambiguïté lexicale.
- issue: Sens de « pécher au sujet de/sur la נֶפֶשׁ »
  choice: pécher au contact du mort
  alternative: pécher à cause du mort / au sujet de la personne morte
  rationale: Dans la loi du nazir, il s’agit d’une souillure causée par une mort survenue soudainement près de lui, non nécessairement d’une transgression morale volontaire contre le défunt. Le rendu explicite le contexte rituel tout en gardant le verbe « pécher » du texte hébreu.
- issue: Portée de כפר
  choice: accomplir le rite d’expiation pour lui
  alternative: faire l’expiation pour lui / le purifier
  rationale: « Expiation » conserve la force théologique et cultuelle du verbe sans la réduire à la seule purification ni définir le mécanisme précis du rite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement segmentée pour la lisibilité. Le vocabulaire cultuel (« holocauste », « expiation », « consacrer ») est conservé parce qu’il est précis, tandis que les notes éclairent les termes susceptibles d’être mal compris.
