revisions:
- from: Le prêtre offrira l’un en sacrifice pour le péché[a] et l’autre en holocauste. Il accomplira ainsi le rite d’expiation pour lui, parce qu’il a péché au contact du mort[b], et il consacrera sa tête ce même jour.
  to: Le prêtre offrira l’un en sacrifice pour le péché[a] et l’autre en holocauste. Il fera l’expiation pour lui, parce qu’il a péché en rapport avec la personne morte[b], et il consacrera sa tête ce même jour.
  rationale: La révision évite d’imposer un contact physique direct là où la formule hébraïque exprime plus largement le rapport à une personne morte dans le cadre de la loi du nazir. Elle rend également כפר de manière plus directe, sans ajout interprétatif, tout en maintenant le vocabulaire cultuel établi et l’indication temporelle « ce même jour ».
