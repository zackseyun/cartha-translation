review_pass:
  verdict: revise
  source_fidelity: Le rendu des deux sacrifices, de l’expiation et de la consécration de la tête est fidèle. « Au contact du mort » restreint toutefois la relation exprimée par עַל הַנֶּפֶשׁ à un contact direct; le contexte concerne bien une souillure liée à un décès, mais la formulation hébraïque ne décrit pas explicitement ici ce contact. « En rapport avec la personne morte » conserve mieux la relation sans la surdéterminer.
  naturalness: Le français est globalement naturel et de registre biblique moderne. « Il accomplira ainsi le rite d’expiation » est plus périphrastique que nécessaire et ajoute « ainsi », absent de l’hébreu. « Il fera l’expiation pour lui » est à la fois usuel dans ce registre et plus direct.
  terminology: « Sacrifice pour le péché », « holocauste », « expiation » et « consacrera sa tête » sont des choix terminologiques cohérents. La note sur חַטָּאת préserve correctement l’alternative « sacrifice de purification ». La note b doit refléter plus exactement le sens contextuel de l’expression sans présenter le décès lui-même comme l’agent qui aurait rendu impur le nazir.
  issues:
  - severity: medium
    issue: « au contact du mort » sur-spécifie la relation à la personne morte
    rationale: Le contexte permet de comprendre une souillure par un mort, mais le verset emploie la formule plus large « pécher concernant/au sujet de la personne morte ». Une traduction qui impose le contact direct réduit inutilement la formulation source.
  - severity: low
    issue: « ainsi » et « le rite » ajoutent une explicitation non requise
    rationale: וְכִפֶּר עָלָיו signifie directement que le prêtre fera l’expiation pour le nazir. L’ajout rend la phrase plus lourde et introduit une liaison explicative absente du texte.
  revised_text: Le prêtre offrira l’un en sacrifice pour le péché[a] et l’autre en holocauste. Il fera l’expiation pour lui, parce qu’il a péché en rapport avec la personne morte[b], et il consacrera sa tête ce même jour.
  revised_footnotes:
  - marker: a
    text: Ou « en sacrifice de purification ». Le terme hébreu peut désigner le sacrifice pour le péché ou, particulièrement dans un contexte d’impureté rituelle, un sacrifice de purification.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « au sujet de la personne ». Dans ce contexte, le mot hébreu désigne une personne morte; l’expression concerne la souillure rituelle liée à un mort.
    reason: cultural_note
  revision_rationale: La révision évite d’imposer un contact physique direct là où la formule hébraïque exprime plus largement le rapport à une personne morte dans le cadre de la loi du nazir. Elle rend également כפר de manière plus directe, sans ajout interprétatif, tout en maintenant le vocabulaire cultuel établi et l’indication temporelle « ce même jour ».
