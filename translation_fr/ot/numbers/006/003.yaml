base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: fr
  text: il s’abstiendra de vin et de boisson enivrante ; il ne boira ni vinaigre de vin ni vinaigre de boisson enivrante, ni aucune boisson obtenue par macération de raisins[a], et il ne mangera pas de raisins, frais ou secs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun liquide de raisins » ou « aucun jus de raisin ». Le terme hébreu peut désigner un liquide dans lequel des raisins ont trempé ou macéré.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des raisins frais et secs ». « Raisins secs » est une traduction idiomatique possible du second terme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: il s’abstiendra de vin et de boisson enivrante
  rationale: Le hifil de נזר exprime ici l’abstention dans le cadre du naziréat. « Boisson enivrante » distingue שֵׁכָר du vin sans préciser indûment sa composition.
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: vinaigre de vin ni vinaigre de boisson enivrante
  rationale: « Vinaigre » rend naturellement חֹמֶץ dans ce contexte, tandis que les compléments conservent le parallélisme des deux constructions hébraïques.
- source_word: מִשְׁרַת עֲנָבִים
  choice: boisson obtenue par macération de raisins
  rationale: מִשְׁרָה désigne vraisemblablement le liquide dans lequel des raisins ont trempé ou macéré. Cette formulation conserve cette nuance plus précisément que le simple « jus de raisin ».
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: raisins, frais ou secs
  rationale: Les adjectifs hébreux signifient littéralement « frais/humides et secs ». En français, « raisins frais ou secs » est naturel et explicite, sans remplacer le second adjectif par le substantif « raisins secs » dans le corps du verset.
theological_decisions:
- issue: Étendue de l’abstinence du nazir
  choice: Conserver l’énumération complète des produits issus du raisin
  alternative: Résumer par une interdiction générale de l’alcool ou du raisin
  rationale: Le texte interdit non seulement les boissons enivrantes, mais aussi le vinaigre, une préparation de raisins et les raisins eux-mêmes. Une généralisation à l’alcool seul réduirait la portée rituelle du passage.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur prescriptive convient au style législatif. « Boisson enivrante » est plus immédiatement intelligible que « boisson forte » et évite de limiter שֵׁכָר à une boisson particulière.
