  variant: modern international French
source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר כֹּ֥ה תְבָרֲכ֖וּ אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: fr
  text: 'Parle à Aaron et à ses fils en ces termes : « Voici comment vous bénirez les fils d’Israël[a]. Dites-leur : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « les Israélites » ou « le peuple d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel masculin singulier adresse directement l’ordre à Moïse. « Parle » est naturel et conserve la forme de commandement.
- source_word: וְאֶל בָּנָיו
  choice: et à ses fils
  rationale: Dans ce contexte sacerdotal, בָּנָיו désigne les fils d’Aaron, et non ses enfants au sens large.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule française introduit naturellement le contenu du discours tout en gardant sa fonction quotative.
- source_word: כֹּה
  choice: Voici comment
  rationale: כֹּה introduit ici la manière prescrite de prononcer la bénédiction. « Voici comment » est clair, actuel et conserve la portée directive.
- source_word: תְבָרֲכוּ
  choice: vous bénirez
  rationale: L’imparfait piel à la deuxième personne du pluriel a ici une valeur prescriptive. Le futur français exprime sobrement cette instruction sans la réduire à une simple prédiction.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction formelle conserve l’expression familiale et fédérative de l’hébreu, tout en signalant en note les équivalents français plus idiomatiques.
- source_word: אָמֹר לָהֶם
  choice: Dites-leur
  rationale: L’infinitif absolu אָמֹר a ici une force injonctive et introduit les paroles exactes de la bénédiction au verset suivant. Le pluriel français reprend naturellement Aaron et ses fils comme locuteurs.
theological_decisions:
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; le peuple d’Israël
  rationale: « Les fils d’Israël » rend explicitement la forme hébraïque et sa nuance familiale liée à l’identité d’Israël. Les formulations collectives restent possibles, puisque l’expression désigne conventionnellement l’ensemble du peuple.
- issue: Caractère prescriptif de la bénédiction sacerdotale
  choice: Voici comment vous bénirez
  alternative: C’est ainsi que vous bénirez ; Vous bénirez de cette manière
  rationale: La formulation retenue présente les paroles suivantes comme la manière prescrite de bénir, sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici comment » évite l’archaïsme de « Ainsi vous bénirez » tout en maintenant le ton solennel de l’instruction. La ponctuation laisse ouverte la bénédiction qui commence au verset suivant.
