source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יָבִא֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: fr
  text: Le huitième jour, il apportera au prêtre, à l’entrée de la tente de la rencontre, deux tourterelles ou deux jeunes pigeons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « deux fils de colombe » et désigne de jeunes pigeons ou de jeunes colombes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: Le huitième jour
  rationale: La construction prépositionnelle a un sens temporel. En français, l’article défini suffit naturellement à exprimer « le huitième jour »; la conjonction initiale n’a pas besoin d’être rendue par « et » dans ce contexte séquentiel.
- source_word: יָבִא
  choice: il apportera
  rationale: L’imparfait hiphil de בוא a ici une valeur prescriptive propre au langage juridique. Le futur français conserve cette force sans alourdir le texte.
- source_word: שְׁתֵּי תֹרִים
  choice: deux tourterelles
  rationale: תֹרִים désigne spécifiquement des tourterelles, terme français usuel dans le contexte sacrificiel.
- source_word: אוֹ
  choice: ou
  rationale: La conjonction présente simplement les deux offrandes permises comme des possibilités alternatives.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: deux jeunes pigeons
  rationale: L’expression, littéralement « deux fils de colombe/pigeon », est un idiome désignant de jeunes colombidés. « Jeunes pigeons » est clair et naturel en français.
- source_word: אֶל הַ/כֹּהֵן
  choice: au prêtre
  rationale: Cette formulation rend naturellement en français la destination de ce qui est apporté.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: פֶּתַח désigne l’entrée ou l’ouverture. « Tente de la rencontre » rend אֹהֶל מוֹעֵד comme désignation cultuelle tout en conservant son lien avec la rencontre fixée entre Dieu et son peuple.
theological_decisions:
- issue: Sens de אֹהֶל מוֹעֵד
  choice: tente de la rencontre
  alternative: tente de la Rencontre ; tente d’assignation
  rationale: « Tente de la rencontre » est intelligible en français moderne et conserve la portée relationnelle et cultuelle de מוֹעֵד sans imposer une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe place d’abord le destinataire puis le lieu, conformément à l’ordre hébreu, tout en restant naturelle. Le futur garde la tonalité prescriptive de l’instruction légale.
