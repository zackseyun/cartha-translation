  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: fr
  text: Pendant toute la durée de son naziréat, il ne mangera rien de ce qui provient de la vigne, depuis les pépins jusqu’à la peau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis les pépins jusqu’à la peau », expression qui englobe toutes les parties du raisin.'
    reason: clarification_of_merism
lexical_decisions:
- source_word: נִזְרוֹ
  choice: son naziréat
  rationale: Dans le contexte juridique de Nombres 6, le terme désigne l’état de consécration propre au nazir. « Naziréat » est le terme technique français établi et ne réduit pas le mot au seul acte de prononcer un vœu.
- source_word: כֹּל יְמֵי
  choice: Pendant toute la durée de
  rationale: Cette formulation française naturelle exprime la totalité de la période visée par l’hébreu.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: rien de ce qui provient
  rationale: Avec la négation portée par le verbe, l’expression délimite l’ensemble des produits interdits. « Provient » rend naturellement יֵעָשֶׂה sans suggérer uniquement une fabrication humaine.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: de la vigne
  rationale: Littéralement « de la vigne du vin »; en français, « la vigne » désigne clairement la vigne à raisin dans ce contexte.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: depuis les pépins jusqu’à la peau
  rationale: Cette tournure conserve le mérisme hébreu et nomme les parties du raisin communément attribuées à חַרְצַנִּים et זָג.
- source_word: לֹא יֹאכֵל
  choice: il ne mangera
  rationale: Le futur négatif convient au registre législatif français et rend la force prohibitive de l’inaccompli hébreu avec לֹא.
theological_decisions:
- issue: Sens de נִזְרוֹ
  choice: son naziréat
  alternative: son vœu de naziréat / sa consécration
  rationale: Le contexte concerne l’institution du naziréat, mais le nom hébreu peut évoquer plus largement la mise à part ou la consécration. Le terme technique français préserve ce cadre sans imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique reste sobre; « naziréat » est conservé comme terme biblique technique. Le marqueur de note est placé après l’expression qu’il explique.
