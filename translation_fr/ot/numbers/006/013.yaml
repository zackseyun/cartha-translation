id: NUM.6.13
reference: Numbers 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: fr
  text: 'Voici la loi concernant le naziréen : le jour où s’achèvera la période de sa mise à part[a], il sera conduit[b] à l’entrée de la tente de la Rencontre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « les jours de son vœu de naziréat » ou « la période de sa consécration ».'
    reason: lexical_alternative
  - marker: b
    text: 'Plus formellement : « il le conduira à l’entrée de la tente de la Rencontre ». En hébreu, le verbe est actif, mais le sujet n’est pas précisé dans ce verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת תּוֹרַת
  choice: Voici la loi concernant
  rationale: Cette formulation introduit naturellement en français moderne une prescription légale, tout en conservant le caractère formel de תּוֹרָה et le lien avec ce qui précède.
- source_word: הַנָּזִיר
  choice: le naziréen
  rationale: « Naziréen » est le terme technique français usuel pour la personne engagée dans l’institution particulière décrite en Nombres 6.
- source_word: בְּיוֹם מְלֹאת יְמֵי נִזְרוֹ
  choice: le jour où s’achèvera la période de sa mise à part
  rationale: La formulation rend le moment où les jours consacrés arrivent à leur terme. « Mise à part » préserve l’idée lexicale de séparation sans réduire explicitement le terme au vœu lui-même.
- source_word: יָבִיא אֹתוֹ
  choice: il sera conduit
  rationale: La forme hébraïque est active, « il le conduira », mais son sujet n’est pas exprimé. Le passif français restitue naturellement la procédure sans identifier arbitrairement celui qui conduit le naziréen; une note conserve la forme plus littérale.
- source_word: אֶל פֶּתַח
  choice: à l’entrée
  rationale: « Entrée » rend פֶּתַח de manière naturelle et précise dans le contexte du sanctuaire.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Cette désignation française établie rend le nom cultuel de la tente où a lieu la rencontre avec Dieu.
theological_decisions:
- issue: Sens des termes נֵזֶר et נָזִיר en Nombres 6
  choice: Conserver « naziréen » et rendre נִזְרוֹ par « sa mise à part »
  alternative: Employer « personne consacrée » et « consécration », ou préciser partout « vœu de naziréat »
  rationale: Le terme technique « naziréen » préserve l’institution israélite particulière, tandis que « mise à part » maintient le lien lexical avec la séparation consacrée sans imposer une interprétation doctrinale supplémentaire.
- issue: Voix de יָבִיא אֹתוֹ
  choice: Employer le passif « il sera conduit »
  alternative: Traduire formellement « il le conduira » ou employer l’indéfini « on le conduira »
  rationale: Le sujet du verbe actif n’étant pas explicite, le passif garde l’attention sur la présentation du naziréen et évite de déterminer qui l’accompagne. La note signale la structure hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste perceptible sans reproduire lourdement l’expression hébraïque « lorsque seront remplis les jours ». Les majuscules de « Rencontre » marquent la désignation cultuelle traditionnelle.
