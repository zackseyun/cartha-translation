  variant: modern international French
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: fr
  text: 'Et il présentera son offrande à Yahweh : un agneau mâle d’un an, sans défaut, en holocauste ; une agnelle d’un an, sans défaut, en sacrifice pour le péché[a] ; et un bélier sans défaut, pour des sacrifices de paix[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner le péché ainsi que le sacrifice associé à la purification d’une impureté ou d’une faute.
    reason: alternative_reading
  - marker: b
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: et il présentera
  rationale: Le hiphil de קרב, dans un contexte sacrificiel, signifie faire approcher ou présenter une offrande. « Présentera » est naturel en français et conserve la portée rituelle.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: Le terme désigne ici le don sacrificiel présenté à Dieu ; « offrande » est l’équivalent cultuel courant et précis.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: כֶּבֶשׂ בֶּן־שְׁנָתוֹ
  choice: un agneau mâle d’un an
  rationale: כֶּבֶשׂ désigne ici un jeune mouton mâle, et l’expression idiomatique בֶּן־שְׁנָתוֹ indique son âge. La mention « mâle » maintient le contraste avec l’agnelle qui suit.
- source_word: תָמִים
  choice: sans défaut
  rationale: Dans la législation sacrificielle, l’adjectif qualifie un animal exempt de défaut physique ; « sans défaut » est clair et précis.
- source_word: לְעֹלָה
  choice: en holocauste
  rationale: עֹלָה désigne l’offrande entièrement brûlée. « Holocauste » est le terme biblique français établi pour cette catégorie sacrificielle.
- source_word: כַבְשָׂה אַחַת בַּת־שְׁנָתָהּ
  choice: une agnelle d’un an
  rationale: כַבְשָׂה est la forme féminine et désigne une jeune brebis ; « agnelle » exprime naturellement en français le sexe et le jeune âge.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: חַטָּאת peut désigner le péché ou le sacrifice rituel associé à son traitement et à la purification. La traduction principale reste reconnaissable, tandis que l’autre nuance est signalée en note.
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: אַיִל désigne spécifiquement un bélier. L’article indéfini français exprime naturellement l’unité indiquée par אֶחָד.
- source_word: לִשְׁלָמִים
  choice: en sacrifice de paix
  rationale: שְׁלָמִים désigne une catégorie sacrificielle liée à la paix, au bien-être et à la communion. « Sacrifice de paix » conserve le lien lexical avec שׁלם sans imposer une seule dimension du rite.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre plutôt que de le remplacer par un titre.
- issue: Sens sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le mot peut mettre en avant le péché ou la fonction purificatrice du sacrifice. Le texte principal emploie la désignation traditionnelle et compréhensible, et la note préserve l’autre analyse lexicale.
- issue: Portée de שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion ; sacrifice de bien-être
  rationale: Le terme hébreu couvre plusieurs idées connexes. La traduction retenue évite de réduire sa portée, tandis que les autres possibilités sont données en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la liste sacrificielle hébraïque, avec des points-virgules pour en clarifier les trois éléments. Les termes cultuels traditionnels sont conservés lorsqu’ils restent intelligibles, et les ambiguïtés lexicales importantes sont documentées en notes.
