  yaml_path: translation/ot/numbers/006/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH »; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et sa traduction traditionnelle.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר, dans cette formule narrative, introduit une nouvelle prise de parole divine. « Parla » conserve la distinction avec לֵאמֹר et convient au registre biblique courant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif construit introduit le discours direct qui suit. « En ces termes » rend naturellement cette fonction en français et évite le tour lourd « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel tout en signalant en note la convention française traditionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le deux-points prépare la parole directe du verset suivant; « en ces termes » rend idiomatiquement la formule hébraïque sans supprimer sa fonction introductive.
