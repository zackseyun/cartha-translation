source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: fr
  text: Il consacrera de nouveau au SEIGNEUR les jours de son naziréat[a] et apportera un agneau mâle d’un an en sacrifice de réparation. Mais les jours précédents seront perdus[b], parce que son naziréat a été souillé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jours de sa séparation » ou « les jours de sa consécration ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les premiers jours tomberont » ; autrement dit, les jours déjà accomplis ne compteront plus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: il consacrera de nouveau
  rationale: Le hiphil de נזר désigne ici le renouvellement d’une période de consécration interrompue. Cette formulation exprime la reprise sans effacer l’idée fondamentale de consécration.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique le destinataire de la consécration, et le nom divin est translittéré directement.
- source_word: יְמֵי נִזְרוֹ
  choice: les jours de son naziréat
  rationale: Dans le cadre juridique de Nombres 6, נֵזֶר renvoie à l’état et à la période propres au naziréat. « Les jours » conserve l’expression temporelle explicite de l’hébreu.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: un agneau mâle d’un an
  rationale: L’expression désigne un agneau mâle dans sa première année et préserve la précision sacrificielle.
- source_word: לְאָשָׁם
  choice: en sacrifice de réparation
  rationale: אָשָׁם désigne l’offrande rituelle associée à la faute et à la réparation. « Sacrifice de réparation » est une désignation française claire et usuelle de cette catégorie.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים
  choice: mais les jours précédents
  rationale: Il s’agit des jours déjà accomplis avant la souillure; « précédents » rend naturellement leur relation avec la nouvelle période.
- source_word: יִפְּלוּ
  choice: seront perdus
  rationale: Le verbe signifie littéralement « tomberont ». Dans ce contexte juridique, ces jours cessent de compter; « seront perdus » exprime cet effet sans le développer dans le corps du texte.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: parce que son naziréat a été rendu impur
  rationale: La proposition donne la cause de l’annulation des jours antérieurs et conserve la notion d’impureté rituelle portée par טמא.
theological_decisions:
- issue: Sens de נזר dans la législation du naziréat
  choice: naziréat
  alternative: consécration / séparation
  rationale: Le mot garde l’idée de consécration séparée, mais son emploi dans Nombres 6 est institutionnel. « Naziréat » préserve cette précision sans imposer une interprétation confessionnelle.
- issue: Représentation du tétragramme יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: La translittération rend directement le nom propre présent dans le texte source et évite de le remplacer silencieusement par un titre.
- issue: Effet de יִפְּלוּ sur les jours déjà accomplis
  choice: seront perdus
  alternative: tomberont / ne compteront plus
  rationale: Le sens juridique contextuel est que les jours antérieurs ne sont plus comptabilisés, tandis que la note conserve l’image littérale du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les catégories rituelles du passage, ainsi que l’image littérale de יִפְּלוּ en note, tout en rendant clairement son effet dans le texte.
