  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: fr
  text: Tous les jours de sa mise à part[a], il est saint pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son vœu de nazir », « de son naziréat » ou « de sa consécration ». Le terme hébreu désigne ici l’état de celui qui est mis à part comme nazir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: Tous les jours de
  rationale: Cette formulation rend directement la totalité de la période exprimée par le quantificateur כֹּל et le pluriel construit יְמֵי, tout en restant naturelle en français.
- source_word: נִזְרוֹ
  choice: sa mise à part
  rationale: Le terme désigne ici l’état particulier de la personne mise à part comme nazir, plutôt que la seule formulation de son vœu. « Mise à part » conserve cette nuance sans confondre le terme avec l’adjectif « saint » qui suit.
- source_word: קָדֹשׁ הוּא
  choice: il est saint
  rationale: L’adjectif קָדֹשׁ garde ainsi toute sa portée religieuse et théologique, tandis que le pronom indépendant הוּא est rendu explicitement comme sujet.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Dans ce contexte de consécration, ל marque l’orientation ou l’appartenance à Dieu. « Pour Yahweh » est idiomatique en français et préserve le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Sens de נִזְרוֹ dans la législation sur le naziréat
  choice: sa mise à part
  alternative: son vœu de nazir ; sa consécration ; son naziréat
  rationale: Le verset met l’accent sur la durée de l’état de mise à part du nazir. Ce choix évite de réduire le terme au vœu lui-même et maintient la distinction entre cette condition et la sainteté affirmée ensuite.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe concise suit de près l’hébreu. « Mise à part » est plus immédiatement compréhensible que le terme technique « naziréat », lequel est conservé dans la note.
