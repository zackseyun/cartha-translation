  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: fr
  text: Si quelqu’un meurt tout à coup[a] près de lui et rend ainsi impure sa tête consacrée[b], il se rasera la tête le jour de sa purification ; le septième jour, il la rasera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu associe deux termes exprimant la soudaineté, ce qui souligne le caractère brusque et imprévu de la mort.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la tête de sa consécration ». L’expression relie la tête, et particulièrement les cheveux non coupés, à la consécration du nazir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Introduit un cas conditionnel dans la législation concernant le naziréat. En français, « Si » suffit naturellement à rendre la condition, sans alourdir l’enchaînement.
- source_word: יָמוּת מֵת
  choice: quelqu’un meurt
  rationale: La construction associe le verbe « mourir » au nom « mort » pour exprimer idiomatiquement le décès d’une personne. « Quelqu’un meurt » en donne le sens naturel en français.
- source_word: עָלָיו
  choice: près de lui
  rationale: Dans ce contexte d’impureté due à un mort, la préposition indique la proximité immédiate du nazir plutôt qu’un contact physique nécessaire.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: tout à coup
  rationale: Les deux termes apparentés renforcent l’idée d’un événement brusque et imprévu. « Tout à coup » restitue cette force en français courant.
- source_word: וְטִמֵּא
  choice: et rend ainsi impure
  rationale: La forme verbale est transitive. Cette formulation laisse la mort soudaine de la personne comme cause de la souillure tout en évitant un sujet français ambigu ou artificiel.
- source_word: רֹאשׁ נִזְרוֹ
  choice: sa tête consacrée
  rationale: נֵזֶר désigne ici la consécration propre au nazir, manifestée notamment par ses cheveux non coupés. « Sa tête consacrée » reste lisible tout en conservant la portée rituelle de l’expression.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: il se rasera la tête
  rationale: La tournure pronominale est naturelle en français pour l’action prescrite et conserve clairement la tête comme objet du rasage.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: le jour de sa purification
  rationale: טָהֳרָה renvoie ici au retour à la pureté rituelle. « Purification » exprime clairement cette dimension cultuelle.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: le septième jour
  rationale: Rend directement et naturellement l’indication temporelle hébraïque.
- source_word: יְגַלְּחֶנּוּ
  choice: il la rasera
  rationale: Le suffixe pronominal reprend « sa tête ». Le pronom féminin « la » maintient cette reprise sans répétition inutile.
theological_decisions:
- issue: Nature de la souillure liée au naziréat
  choice: 'Traduire נזר dans le registre de la consécration rituelle : « sa tête consacrée ».'
  alternative: « la tête de sa consécration » ou « sa tête vouée »
  rationale: Le passage traite de l’impureté rituelle interrompant la consécration du nazir. Cette traduction garde le lien entre la tête, les cheveux et la consécration sans introduire une catégorie doctrinale postérieure ni réduire l’expression au seul vœu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère juridique et rituel du passage, tout en évitant les calques peu naturels. « Nazir » n’est pas ajouté dans le corps du verset, puisqu’il est implicite dans le contexte immédiat.
