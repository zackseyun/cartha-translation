base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/015.yaml
  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: fr
  text: 'et une corbeille de pains sans levain : des gâteaux de fleur de farine mélangés à de l’huile[a] et de fines galettes sans levain enduites d’huile[b], avec leur offrande de céréales et leurs libations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gâteaux sans levain » pour la première occurrence de מַצּוֹת ; le terme hébreu a un sens large, puis le verset distingue les gâteaux et les fines galettes qui appartiennent à cette catégorie.
    reason: lexical_alternative
  - marker: b
    text: Ou « ointes d’huile » ; le verbe hébreu est celui qui signifie habituellement « oindre », mais il décrit ici la préparation des galettes.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: corbeille
  rationale: Le nom désigne ici le récipient contenant les produits sans levain. « Corbeille » est naturel en français dans ce contexte rituel.
- source_word: מַצּוֹת
  choice: pains sans levain
  rationale: Le terme désigne largement des pains ou produits sans levain; cette formulation générique permet ensuite de distinguer les gâteaux et les fines galettes.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française consacrée et précise pour la farine finement moulue employée dans les offrandes.
- source_word: חַלֹּת
  choice: gâteaux
  rationale: Dans ce contexte d’offrande, le mot désigne des pains façonnés; « gâteaux » les distingue des fines galettes mentionnées ensuite sans suggérer de grands pains modernes.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: mélangés à de l’huile
  rationale: La formulation rend directement l’idée d’un mélange avec l’huile sans préciser indûment qu’il s’agit nécessairement d’un pétrissage.
- source_word: רְקִיקֵי מַצּוֹת
  choice: fines galettes sans levain
  rationale: רְקִיקִים désigne des pièces de pain minces; « fines galettes » exprime clairement cette caractéristique et évite les connotations modernes de « gaufrettes ».
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: enduites d’huile
  rationale: Dans ce contexte de préparation alimentaire, le verbe usuel pour oindre décrit l’application d’huile sur les galettes. « Enduites » est idiomatique tout en conservant le geste concret.
- source_word: מִנְחָתָם
  choice: leur offrande de céréales
  rationale: Dans la législation sacrificielle, מִנְחָה désigne l’offrande végétale ou céréalière. Le possessif pluriel de l’hébreu est conservé.
- source_word: נִסְכֵּיהֶם
  choice: leurs offrandes de vin
  rationale: Le nom désigne des liquides versés en offrande. Dans ce cadre rituel, il s’agit de vin; cette expression est plus immédiatement compréhensible que « libations ».
