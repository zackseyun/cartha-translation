id: NUM.6.25
reference: Numbers 6:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: fr
  text: Que Yahweh fasse briller son visage sur toi et t’accorde sa grâce[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que Yahweh fasse briller son visage vers toi et te témoigne sa faveur. »'
    reason: Signale les équivalents plus littéraux de אֵלֶיךָ (« vers toi ») et de חנן (« témoigner de la faveur »).
lexical_decisions:
- source_word: יָאֵר
  choice: Que … fasse briller
  rationale: Le hiphil jussif de אוֹר exprime ici un souhait de bénédiction avec une nuance causative. La tournure « Que … fasse briller » restitue naturellement ces deux valeurs en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: פָּנָיו
  choice: son visage
  rationale: Cette traduction conserve l’image concrète de l’hébreu. « Sa présence » expliciterait l’expression au lieu de la traduire, tandis que « sa face » serait moins naturel en français moderne.
- source_word: אֵלֶיךָ
  choice: sur toi
  rationale: Bien que אֶל signifie fondamentalement « vers », « faire briller son visage sur quelqu’un » est une formulation française naturelle qui exprime la direction bienfaisante du regard divin.
- source_word: וִיחֻנֶּךָּ
  choice: et t’accorde sa grâce
  rationale: Le verbe חנן signifie accorder grâce ou faveur. Cette formulation garde le ton solennel d’une bénédiction sans réduire le sens à la seule pitié.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. Sa translittération préserve le nom personnel présent dans la bénédiction au lieu de lui substituer un titre.
- issue: Image anthropomorphique du visage qui brille
  choice: Conserver « fasse briller son visage »
  alternative: porte sur toi un regard favorable
  rationale: L’image poétique hébraïque exprime la présence et la faveur divines. La conserver respecte la force concrète du texte sans en imposer une paraphrase interprétative.
- issue: Portée de חנן
  choice: t’accorde sa grâce
  alternative: te témoigne sa faveur
  rationale: Les deux formulations sont possibles. « T’accorde sa grâce » convient au caractère solennel de la bénédiction, tout en laissant la note signaler l’équivalent plus explicite en termes de faveur.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit les formes hébraïques de deuxième personne du singulier et convient à l’adresse directe de la bénédiction. La tournure optative avec « Que » restitue le jussif hébreu.
