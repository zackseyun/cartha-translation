  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: fr
  text: Ainsi, ils placeront mon nom[b] sur les Israélites[a], et moi, je les bénirai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le peuple d’Israël ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « placer mon nom sur » évoque probablement l’invocation du nom de l’Éternel sur le peuple et le fait de le désigner comme lui appartenant.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: Ainsi, ils placeront
  rationale: Le verbe שׂוּם signifie « mettre, placer ». « Ainsi » relie cette déclaration à la bénédiction sacerdotale qui précède, tandis que le futur rend la valeur prospective de la forme hébraïque.
- source_word: אֶת שְׁמִי
  choice: mon nom
  rationale: La formulation littérale est conservée, car le « nom » porte ici une riche portée relationnelle et liée à l’alliance qu’une paraphrase risquerait de réduire.
- source_word: עַל
  choice: sur
  rationale: « Sur » préserve la métaphore concrète du texte hébreu et convient naturellement à l’expression française.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Israël », mais elle désigne collectivement le peuple d’Israël. « Les Israélites » est naturel en français moderne et évite de laisser croire que seuls les hommes sont visés; la forme littérale est signalée en note.
- source_word: וַאֲנִי
  choice: et moi, je
  rationale: Le pronom indépendant אֲנִי est explicite et emphatique. La dislocation française « et moi, je » en restitue naturellement l’insistance.
- source_word: אֲבָרֲכֵם
  choice: les bénirai
  rationale: Le futur exprime la promesse divine, et le pronom « les » renvoie collectivement aux Israélites.
theological_decisions:
- issue: Sens de l’action de placer le nom de Dieu sur Israël
  choice: Conserver l’expression concrète « placer mon nom sur » sans l’expliciter dans le corps du texte.
  alternative: « invoquer mon nom sur eux » ou « les marquer comme m’appartenant »
  rationale: L’expression peut évoquer l’invocation du nom de l’Éternel, l’appartenance à Dieu et l’identification au peuple de l’alliance. La traduction maintient cette richesse sans imposer une seule interprétation; une note en indique la portée probable.
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël; le peuple d’Israël
  rationale: Le syntagme masculin hébreu est un ethnonyme collectif qui englobe la communauté d’Israël. Le français idiomatique « les Israélites » en transmet le référent sans modifier sa portée théologique, tandis que la note conserve l’accès à la forme source.
translation_notes:
  register: Français international moderne, clair et digne. « Placer » conserve l’image concrète de l’hébreu; « et moi, je » restitue l’emphase divine sans lourdeur excessive.
