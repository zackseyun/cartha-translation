lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Que ... te bénisse
  rationale: Le piel jussif à la 3e personne masculine singulière, avec suffixe de 2e personne masculine singulière, exprime ici un souhait de bénédiction. La tournure française « Que ... te bénisse » en restitue naturellement la valeur volitive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération courante du nom divin, plutôt que remplacé par un titre.
- source_word: וְיִשְׁמְרֶךָ
  choice: et te garde
  rationale: Le qal jussif de שמר prolonge le souhait. « Te garde » conserve la concision, le parallélisme poétique et l'idée de protection.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L'hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre, tandis que « le SEIGNEUR » reflète la lecture traditionnelle de substitution; celle-ci est signalée en note.
translation_notes:
  register: Formulation brève, solennelle et naturelle en français moderne. Le tutoiement singulier reproduit les suffixes hébreux de deuxième personne masculine singulière, qui s'adressent ici à chaque membre du peuple. Le point d'exclamation marque la force bénédictive sans transformer les jussifs en impératifs.
