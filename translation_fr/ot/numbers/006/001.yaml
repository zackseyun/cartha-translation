  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, traditionnellement rendu par « le SEIGNEUR ». On trouve aussi les formes « Yahvé » et « Jéhovah ».'
    reason: Signaler le tétragramme hébreu et les principaux rendus traditionnels ou alternatifs en français.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait progresser le récit. En français, le passé simple convient à cette formule narrative et « parler » rend la solennité de l’introduction au discours.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, conformément à sa présence explicite dans le texte hébreu, plutôt que remplacé par un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est la tournure française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule infinitive introduit le contenu du discours. « En ces termes : » en restitue naturellement la fonction en français sans le calque pesant « disant ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre, tandis que « le SEIGNEUR » relève d’une substitution traditionnelle et « Jéhovah » d’une autre vocalisation conventionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué; les deux-points annoncent la parole qui suit au verset suivant.
