source:
  edition: WLC
  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: fr
  text: Que Yahweh lève son visage vers toi et te donne la paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « paix » (shalom) peut aussi évoquer la plénitude, l’intégrité et le bien-être.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: lève
  rationale: Le verbe נשׂא signifie littéralement « lever, élever, porter ». Avec « visage » pour complément, il exprime ici l’attention favorable, tout en conservant l’image concrète de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: פָּנָיו
  choice: son visage
  rationale: Le nom פָּנִים désigne littéralement le visage. Cette traduction garde la métaphore anthropomorphique de la faveur divine sans la remplacer par une interprétation abstraite.
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition אֶל exprime ici une direction. « Vers toi » restitue naturellement ce mouvement associé au fait de lever le visage.
- source_word: וְיָשֵׂם
  choice: et te donne
  rationale: Le verbe שׂים signifie littéralement « placer, mettre ». Dans cette formule de bénédiction, « te donne » exprime naturellement en français le résultat visé.
- source_word: לְךָ
  choice: te
  rationale: La préposition לְ marque le bénéficiaire. Elle est intégrée idiomatiquement au complément indirect dans « te donne ».
- source_word: שָׁלוֹם
  choice: paix
  rationale: שָׁלוֹם désigne la paix, mais aussi plus largement l’intégrité, la plénitude et le bien-être. « Paix » convient à la formule de bénédiction, tandis qu’une note en précise l’étendue sémantique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le nom divin. « Yahweh » en préserve le caractère personnel et distinct, sans le remplacer par un titre.
- issue: Maintien de l’expression anthropomorphique « lever son visage »
  choice: Conserver « lève son visage vers toi »
  alternative: te montre sa faveur ; porte sur toi un regard favorable
  rationale: L’hébreu associe l’image du visage divin à l’attention favorable. La formulation retenue préserve cette image littéraire et théologique sans en réduire le sens à une paraphrase.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme et l’image concrète de la bénédiction hébraïque, tout en employant une syntaxe française naturelle.
