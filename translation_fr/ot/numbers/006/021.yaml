revisions:
- from: 'Voici la loi concernant le naziréen qui fait un vœu : son offrande à Yahweh pour sa consécration, en plus de ce que ses moyens lui permettent d’offrir[a]. Il agira conformément au vœu qu’il aura fait, en plus de ce qu’exige la loi de sa consécration.'
  to: Voici la loi du naziréen qui s’engage à présenter à Yahweh son offrande pour sa consécration, outre ce que ses moyens lui permettent d’offrir[a]. Selon le vœu qu’il fera, ainsi fera-t-il, conformément à la loi de sa consécration.
  rationale: La révision corrige la portée de la dernière préposition sans modifier le sens général. Elle garde l’addition explicitement exprimée par מִלְּבַד (« outre »), restitue la relation « selon… ainsi » de la seconde phrase et maintient l’ambiguïté raisonnable de נֵזֶר par « consécration ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:47:45Z'
review_pass:
  verdict: revise
  source_fidelity: La dernière proposition du brouillon rend עַל (« selon / conformément à », ici en lien avec « la loi de sa consécration ») par « en plus de », ce qui impose un sens d’addition qui n’est pas requis par l’hébreu et déforme le parallélisme légal du verset. Le premier « outre » rend correctement מִלְּבַד. La formulation révisée maintient la distinction entre l’offrande vouée et les ressources disponibles, sans faire de la clause finale une obligation supplémentaire explicitement énoncée.
  naturalness: « Naziréen », « consécration », « outre ce que ses moyens lui permettent d’offrir » et « conformément à la loi de sa consécration » sont naturels dans un français moderne de registre juridique et scripturaire. « S’engage à présenter » explicite avec sobriété la construction où le naziréen voue son offrande.
  terminology: « Naziréen » préserve le terme technique נָזִיר. « Consécration » rend de façon cohérente נֵזֶר dans ce contexte. « Yahweh » correspond au tétragramme. « Loi » convient à תּוֹרָה dans cette prescription.
  issues:
  - severity: medium
    issue: La clausule finale est traduite « en plus de ce qu’exige la loi de sa consécration ».
    rationale: Le second עַל introduit « la loi de sa consécration » comme cadre ou référence de l’action (« selon / conformément à »), non comme un second « outre ». Le sens additif est déjà porté par מִלְּבַד dans la première phrase.
  - severity: low
    issue: « Il agira » ne restitue pas pleinement la corrélation כְּפִי… כֵּן (« selon… ainsi »).
    rationale: La révision conserve cette structure, importante dans la formulation normative.
  revised_text: Voici la loi du naziréen qui s’engage à présenter à Yahweh son offrande pour sa consécration, outre ce que ses moyens lui permettent d’offrir[a]. Selon le vœu qu’il fera, ainsi fera-t-il, conformément à la loi de sa consécration.
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « outre ce que sa main peut atteindre ».'
    reason: La note conserve l’image hébraïque de la « main », employée ici pour les moyens ou les ressources dont dispose le naziréen.
  revision_rationale: La révision corrige la portée de la dernière préposition sans modifier le sens général. Elle garde l’addition explicitement exprimée par מִלְּבַד (« outre »), restitue la relation « selon… ainsi » de la seconde phrase et maintient l’ambiguïté raisonnable de נֵזֶר par « consécration ».
