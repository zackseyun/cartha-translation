  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: fr
  text: Voici la loi du naziréen qui s’engage à présenter à Yahweh son offrande pour sa consécration, outre ce que ses moyens lui permettent d’offrir[a]. Selon le vœu qu’il fera, ainsi fera-t-il, conformément à la loi de sa consécration.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « outre ce que sa main peut atteindre ».'
    reason: La note conserve l’image hébraïque de la « main », employée ici pour les moyens ou les ressources dont dispose le naziréen.
lexical_decisions:
- source_word: תּוֹרַת הַנָּזִיר
  choice: la loi concernant le naziréen
  rationale: תּוֹרָה désigne ici la prescription qui régit le naziréen. « Loi concernant » est naturel en français juridique et conserve le terme technique « naziréen ».
- source_word: אֲשֶׁר יִדֹּר
  choice: qui fait un vœu
  rationale: La formulation garde la valeur verbale de נדר tout en étant plus idiomatique en français que « qui voue ».
- source_word: קָרְבָּנוֹ לַיהוָה
  choice: son offrande à Yahweh
  rationale: קָרְבָּן est le terme général pour une offrande présentée à Dieu; ל marque ici le destinataire ou la dédicace.
- source_word: עַל נִזְרוֹ
  choice: pour sa consécration
  rationale: נֵזֶר renvoie à l’état de mise à part consacré propre au naziréen. « Consécration » exprime ce statut sans confondre ce syntagme avec le vœu mentionné ensuite.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: en plus de ce que ses moyens lui permettent d’offrir
  rationale: L’expression littérale « ce que sa main peut atteindre » désigne les ressources ou la capacité de fournir une offrande. La traduction explicite l’idiome tout en le signalant en note.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: conformément au vœu qu’il aura fait
  rationale: כְּפִי exprime la conformité à la teneur du vœu. Le futur antérieur français situe naturellement le vœu avant son accomplissement.
- source_word: כֵּן יַעֲשֶׂה
  choice: Il agira
  rationale: Le futur a ici une force normative. « Il agira » reste digne et naturel dans une prescription légale.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: en plus de ce qu’exige la loi de sa consécration
  rationale: Dans ce contexte, עַל peut indiquer un ajout à l’obligation réglementaire. Cette lecture évite la redondance peu claire d’« conformément à son vœu, conformément à la loi » et maintient la distinction entre le vœu individuel et les prescriptions communes.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Rapport entre le vœu personnel et les exigences ordinaires du naziréat
  choice: Le naziréen doit accomplir son vœu en plus des prescriptions communes de sa consécration.
  alternative: Il doit agir selon son vœu, conformément à la loi de sa consécration.
  rationale: 'La répétition de עַל, après מִלְּבַד, peut marquer un supplément : les engagements particuliers du vœu s’ajoutent aux offrandes prescrites. La syntaxe demeure toutefois susceptible d’une lecture plus générale de conformité.'
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le caractère juridique du verset, le terme technique « naziréen » et la répétition conceptuelle entre le vœu particulier et la loi de la consécration.
