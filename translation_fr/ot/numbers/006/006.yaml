  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: fr
  text: Pendant toute la durée de sa mise à part pour l’Éternel[a], il ne s’approchera d’aucun cadavre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son vœu de naziréat » ou « sa consécration ». Le terme hébreu désigne l’état ou la période pendant laquelle une personne est mise à part comme naziréen.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « une personne morte » ; dans ce contexte, il s’agit d’un cadavre humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Pendant toute la durée de
  rationale: Cette formulation française naturelle exprime l’ensemble des jours, donc toute la période concernée, sans lourdeur littérale.
- source_word: הַזִּירוֹ
  choice: sa mise à part
  rationale: Le terme issu de la racine נזר désigne ici l’état ou la période de séparation propre au naziréat. « Mise à part » conserve cette valeur sans ajouter explicitement le mot « vœu ».
- source_word: לַיהוָה
  choice: pour l’Éternel
  rationale: La préposition ל marque ici l’orientation ou la consécration à YHWH. « Pour l’Éternel » exprime naturellement en français cette destination dédicatoire.
- source_word: עַל נֶפֶשׁ מֵת לֹא יָבֹא
  choice: il ne s’approchera d’aucun mort
  rationale: Avec בוא et עַל, l’expression interdit de s’approcher d’une personne morte. « Aucun mort » est clair, concis et garde la référence humaine de l’idiome hébreu.
theological_decisions:
- issue: Désignation de la période du naziréat
  choice: sa mise à part
  alternative: son vœu de naziréat ; sa consécration
  rationale: Le contexte établit qu’il s’agit du naziréat, mais le nom hébreu met directement l’accent sur la séparation. Le texte principal préserve cette nuance, tandis que la note explicite les autres formulations possibles.
- issue: Rendu du tétragramme יהוה
  choice: l’Éternel
  alternative: YHWH ; Yahvé ; le Seigneur
  rationale: « L’Éternel » est une désignation française traditionnelle, intelligible et digne du nom divin, sans introduire dans le corps du verset une vocalisation discutée.
- issue: Portée de נֶפֶשׁ מֵת
  choice: aucun mort
  alternative: un cadavre ; un corps sans vie
  rationale: Dans ce contexte de pureté rituelle, l’expression hébraïque désigne une personne humaine morte. Le choix retenu demeure naturel tout en évitant de traduire נֶפֶשׁ mécaniquement par « âme ».
translation_notes:
  register: Français international moderne, clair et digne. La tournure temporelle évite le calque « tous les jours de », tandis que « mise à part » maintient le lien lexical avec la séparation du naziréen. Les deux appels de note figurent explicitement dans le texte.
