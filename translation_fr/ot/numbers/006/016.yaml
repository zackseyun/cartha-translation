id: NUM.6.16
reference: Numbers 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: fr
  text: Le prêtre les présentera devant Yahweh et offrira son sacrifice pour le péché[a] et son holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Dans le langage sacerdotal, le terme hébreu peut désigner un sacrifice ayant pour fonction de purifier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: présentera
  rationale: Le hiphil de קרב exprime ici l’action de faire approcher ou de présenter devant Dieu. « Présentera » distingue cette étape de l’offrande proprement dite, exprimée ensuite par וְעָשָׂה.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant et précis de כֹּהֵן dans un contexte cultuel.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי marque la présence devant Dieu dans le cadre du culte; le nom divin est translittéré « Yahweh ».
- source_word: וְעָשָׂה
  choice: et offrira
  rationale: Bien que עשה signifie littéralement « faire », il désigne, avec des sacrifices comme compléments, l’accomplissement de l’acte sacrificiel; « offrira » est naturel en français.
- source_word: אֶת חַטָּאתוֹ
  choice: son sacrifice pour le péché
  rationale: Dans la législation sacrificielle, חַטָּאת désigne le sacrifice lié au péché; cette formulation française reste claire tout en laissant en note l’autre analyse cultuelle possible.
- source_word: וְאֶת עֹלָתוֹ
  choice: son holocauste
  rationale: « Holocauste » est le terme français établi pour עֹלָה, sacrifice entièrement consumé.
- source_word: objet implicite de וְהִקְרִיב
  choice: les
  rationale: L’hébreu n’exprime pas l’objet, mais le contexte du verset précédent fournit les offrandes concernées. Le pronom « les » conserve cette dépendance contextuelle sans préciser davantage.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le présente comme un nom propre sans le remplacer par un titre.
- issue: Valeur cultuelle de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le premier rendu est traditionnel, clair et contextuellement juste; une note conserve l’analyse selon laquelle le sacrifice a plus précisément une fonction de purification.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur exprime naturellement la prescription hébraïque. « Présentera » puis « offrira » maintient la distinction entre l’approche devant Dieu et l’acte sacrificiel. Le pronom « les » reprend les offrandes mentionnées au verset précédent.
