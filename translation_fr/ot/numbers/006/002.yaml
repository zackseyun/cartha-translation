id: NUM.6.2
reference: Numbers 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: fr
  text: '« Parle aux Israélites et dis-leur : Lorsqu’un homme ou une femme fait un vœu particulier[a], un vœu de naziréat, pour se consacrer à Yahweh[b], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se met à part en faisant un vœu de naziréat ».'
    reason: lexical_alternative
  - marker: b
    text: Le « naziréat » est l’état d’une personne spécialement mise à part pour Yahweh par un vœu.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation naturelle en français moderne désigne fidèlement les membres du peuple d’Israël; le calque « les fils d’Israël » serait ici moins idiomatique.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: un homme ou une femme
  rationale: L’hébreu nomme explicitement les deux sexes dans cette disposition juridique; la traduction conserve cette précision.
- source_word: כִּי
  choice: lorsqu’
  rationale: Dans l’énoncé d’un cas juridique, כִּי introduit la situation envisagée. « Lorsque » est naturel, tout en gardant la valeur conditionnelle que pourrait aussi exprimer « si ».
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: fait un vœu particulier
  rationale: Le hifil de פלא associé à la formule intensive « vouer un vœu » évoque un engagement spécial. Cette expression française rend le sens sans reproduire lourdement le cognat hébreu.
- source_word: נֶדֶר נָזִיר
  choice: un vœu de naziréat
  rationale: Cette expression rend le rapport construit entre le vœu et l’institution particulière du naziréat, tout en employant le terme technique français reconnu.
- source_word: לְהַזִּיר
  choice: pour se consacrer
  rationale: Le verbe exprime une mise à part consacrée. La tournure pronominale convient aussi bien à l’homme qu’à la femme mentionnés juste avant et évite d’ajouter un pronom genré absent du français requis.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération « Yahweh » représente directement le nom divin יהוה et préserve sa fonction de nom propre dans le texte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Nature du naziréat
  choice: un vœu de naziréat, pour se consacrer à Yahweh
  alternative: un vœu pour se séparer en l’honneur de Yahweh
  rationale: « Se consacrer » restitue la mise à part religieuse sans réduire le terme à une simple séparation matérielle. La note précise le caractère technique du naziréat.
- issue: Représentation des sexes dans la disposition juridique
  choice: conserver « un homme ou une femme » et employer « se consacrer »
  alternative: quiconque… se consacre
  rationale: Cette formulation maintient l’inclusion explicite des deux sexes dans l’hébreu, sans introduire en français un masculin représentant qui pourrait obscurcir cette portée.
translation_notes:
  register: Français international moderne, clair et digne. « Les Israélites » privilégie l’usage courant; « naziréat » conserve le terme institutionnel précis. La phrase reste ouverte par une virgule puisqu’elle introduit les prescriptions qui suivent.
