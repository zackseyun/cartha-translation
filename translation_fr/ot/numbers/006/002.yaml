  source_fidelity: 'Le texte rend correctement les éléments essentiels de l’hébreu : l’adresse aux Israélites, l’inclusion explicite d’« un homme ou une femme », la situation introduite par כִּי (« Lorsqu’ »), le caractère particulier du vœu, le vœu de naziréat et sa finalité envers Yahweh. « Se consacrer à Yahweh » restitue de manière juste et idiomatique la mise à part exprimée par לְהַזִּיר, sans effacer le caractère technique du naziréat.'
