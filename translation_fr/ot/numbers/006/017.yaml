  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: fr
  text: Il offrira le bélier en sacrifice de paix[a] à Yahweh, avec la corbeille de pains sans levain. Le prêtre offrira son offrande de céréales et sa libation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de sacrifices de communion ». Le terme hébreu peut être rendu par « sacrifices de paix » ou « sacrifices de communion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: le bélier
  rationale: Dans un contexte sacrificiel, אַיִל désigne précisément un bélier.
- source_word: יַעֲשֶׂה
  choice: il offrira
  rationale: Bien que עשה signifie couramment « faire », son emploi cultuel désigne ici l’accomplissement de l’offrande.
- source_word: זֶבַח שְׁלָמִים
  choice: en sacrifice de paix
  rationale: Cette formulation conserve à la fois l’idée de sacrifice exprimée par זֶבַח et la catégorie cultuelle שְׁלָמִים, tout en restant naturelle en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition marque le destinataire de l’offrande, et le nom divin est rendu directement par « Yahweh ».
- source_word: עַל סַל הַמַּצּוֹת
  choice: avec la corbeille de pains sans levain
  rationale: Dans ce contexte rituel, עַל indique l’accompagnement plutôt qu’une position spatiale; מַצּוֹת désigne des pains préparés sans levain.
- source_word: מִנְחָתוֹ
  choice: l’offrande de céréales qui l’accompagne
  rationale: Dans les textes sacerdotaux, מִנְחָה désigne habituellement l’offrande de céréales; le suffixe renvoie naturellement au sacrifice ou au bélier.
- source_word: נִסְכּוֹ
  choice: l’offrande de vin qui l’accompagne
  rationale: נֶסֶךְ désigne l’offrande liquide jointe au sacrifice; « offrande de vin » est clair et accessible dans ce contexte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre et son caractère d’alliance.
- issue: Traduction de שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion
  rationale: « Paix » conserve le lien lexical traditionnel et la largeur de sens du terme hébreu sans réduire la catégorie à la seule communion.
translation_notes:
  register: Français international moderne, digne et accessible. La seconde proposition est légèrement explicitée afin que les suffixes hébreux associés au sacrifice soient naturels en français; « aussi » rend la progression coordonnée du rite.
