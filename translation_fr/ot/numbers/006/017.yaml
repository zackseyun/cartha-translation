    text: Ou « sacrifice de sacrifices de communion ». Le terme hébreu peut être rendu par « sacrifices de paix » ou « sacrifices de communion ».
    reason: lexical_alternative
  revision_rationale: La révision supprime une addition stylistique et une explicitation relative afin de suivre plus directement la coordination hébraïque. Elle emploie « libation », terme cultuel français précis, et ajuste la note pour que l’alternative reflète la forme plurielle de שְׁלָמִים sans imposer une interprétation théologique.
