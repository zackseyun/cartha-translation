base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: fr
  text: Puis le prêtre prendra l’épaule bouillie du bélier, un pain sans levain de la corbeille et une galette sans levain. Il les déposera sur les paumes du nazir, après que celui-ci se sera rasé les cheveux consacrés de son naziréat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après qu’il se sera rasé son naziréat [sa consécration] ». Dans ce contexte, cette expression désigne les cheveux qui marquaient son naziréat.'
    reason: Préciser la métonymie de l’hébreu tout en conservant sa formulation littérale et son lien avec la consécration.
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis le prêtre prendra
  rationale: Dans cette prescription rituelle, le waw suivi du qatal marque l’étape suivante; le futur français exprime naturellement l’instruction et sa succession.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: l’épaule cuite
  rationale: זְרוֹעַ désigne ici la portion antérieure du bélier, traditionnellement exprimée par « épaule » en français; בְּשֵׁלָה indique qu’elle a été cuite.
- source_word: חַלַּת מַצָּה אַחַת
  choice: un pain sans levain
  rationale: חַלָּה désigne un pain ou gâteau de pain; « pain » est clair et naturel, tandis que « sans levain » restitue מַצָּה.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: une galette sans levain
  rationale: רָקִיק désigne une pièce de pain mince; « galette » en rend naturellement la forme en français moderne.
- source_word: עַל כַּפֵּי הַנָּזִיר
  choice: sur les paumes du nazir
  rationale: כַּפַּיִם vise précisément les paumes, et « nazir » conserve le terme rituel hébreu sans le confondre avec un habitant de Nazareth.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: après que celui-ci se sera rasé
  rationale: La tournure temporelle situe le rasage comme achevé avant le dépôt des offrandes; « celui-ci » lève naturellement toute ambiguïté sur le sujet.
- source_word: אֶת נִזְרוֹ
  choice: la tête consacrée par son naziréat
  rationale: L’expression signifie littéralement « son naziréat/sa consécration », mais désigne ici par métonymie la chevelure ou la tête qui en portait le signe. La formulation française rend l’action concrète tout en gardant le lien avec la consécration.
theological_decisions:
- issue: Sens concret ou abstrait de נִזְרוֹ dans le rite du nazir
  choice: la tête consacrée par son naziréat
  alternative: son naziréat; les cheveux de son naziréat
  rationale: Le complément grammatical est abstrait, mais le contexte immédiat du rasage exige un référent corporel. Le texte principal rend cette métonymie intelligible sans réduire le naziréat à la seule chevelure; la note conserve la forme littérale et l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et rituel. « Nazir » est retenu comme terme technique biblique. La syntaxe est divisée en deux phrases pour une lecture fluide, sans modifier la séquence des gestes.
