  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: fr
  text: Le prêtre les présentera par balancement devant Yahweh. C’est une chose sainte qui revient au prêtre, en plus de la poitrine de l’offrande présentée par balancement et de la cuisse du prélèvement[a]. Après cela, le naziréen pourra boire du vin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’offrande de contribution ». Le terme hébreu תְּרוּמָה désigne une portion prélevée et consacrée.'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « le naziréen boira du vin ». Dans ce contexte, cette formulation indique qu’il lui est désormais permis d’en boire.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: les présentera ... en les balançant comme offrande balancée
  rationale: Le hiphil de נוף et le nom apparenté תְּנוּפָה désignent le geste rituel de présentation par balancement. La formulation française conserve le lien lexical tout en explicitant qu’il s’agit d’une présentation cultuelle.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom renvoie aux éléments mentionnés au verset précédent; le pronom français maintient naturellement cette reprise.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend directement l’expression cultuelle, et « Yahweh » représente le nom divin יהוה.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: Cette offrande est sainte et revient au prêtre
  rationale: Le singulier hébreu considère collectivement ce qui vient d’être présenté. « Revient au prêtre » exprime la destination sacerdotale impliquée par לַכֹּהֵן sans perdre l’affirmation de sainteté.
- source_word: עַל
  choice: en plus de
  rationale: Dans cette formule de répartition, עַל marque l’addition aux parts sacerdotales déjà établies plutôt qu’une position physique.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: la poitrine de l’offrande balancée
  rationale: Cette expression désigne une part sacrificielle technique; la traduction reste transparente et cohérente avec תְּנוּפָה.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: la cuisse du prélèvement
  rationale: שׁוֹק désigne ici la cuisse ou partie supérieure de la patte. « Prélèvement » rend תְּרוּמָה comme portion mise à part et attribuée, sans imposer l’image traditionnelle mais incertaine d’un geste d’élévation.
- source_word: וְאַחַר
  choice: Après cela
  rationale: La locution marque la succession temporelle après l’achèvement du rite.
- source_word: יִשְׁתֶּה הַנָּזִיר יָיִן
  choice: le naziréen pourra boire du vin
  rationale: Dans le contexte de la fin du vœu, l’imparfait indique naturellement que l’interdiction est levée. « Pourra » exprime cette permission contextuelle, tandis qu’une note conserve la traduction plus littérale.
theological_decisions:
- issue: Transcription du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom personnel dans le corps du texte.
- issue: Valeur modale de יִשְׁתֶּה
  choice: pourra boire du vin
  alternative: boira du vin
  rationale: Le contexte juridique indique la permission retrouvée après l’accomplissement du rite, mais la forme verbale hébraïque peut aussi être rendue plus formellement par un futur.
- issue: Statut sacerdotal de la portion présentée
  choice: est sainte et revient au prêtre
  alternative: est sainte pour le prêtre
  rationale: La formulation choisie rend explicite l’attribution cultuelle sans présenter celle-ci comme une simple qualité subjective ou comme une propriété profane.
translation_notes:
  register: Français international moderne, digne et accessible. Le terme biblique « naziréen » est conservé pour נָזִיר. Les expressions rituelles sont rendues avec assez d’explicitation pour être comprises sans effacer leur caractère technique.
