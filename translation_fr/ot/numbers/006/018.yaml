source:
  edition: WLC
  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: fr
  text: Le naziréen se rasera la tête consacrée à l’entrée de la tente de la rencontre. Il prendra les cheveux de sa tête consacrée et les mettra sur le feu qui est sous le sacrifice de paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de communion » ou « sacrifice de bien-être ».
    reason: Alternative lexicale pour le terme cultuel שְׁלָמִים, dont la portée inclut possiblement la paix, l’intégrité, le bien-être et la communion.
lexical_decisions:
- source_word: הַנָּזִיר
  choice: le naziréen
  rationale: Ce terme français établi désigne ici la personne engagée dans le vœu particulier décrit en Nombres 6, plutôt qu’une personne consacrée au sens général.
- source_word: וְגִלַּח
  choice: se rasera
  rationale: Le verbe exprime l’action de raser la chevelure; le futur français convient au style prescriptif du passage.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Traduction directe et usuelle du lieu cultuel, avec « rencontre » pour מוֹעֵד dans cette expression consacrée.
- source_word: רֹאשׁ נִזְרוֹ
  choice: la tête consacrée
  rationale: Cette formulation française naturelle conserve le lien entre la tête, dont la chevelure marque le vœu, et l’état de consécration, sans imposer le développement interprétatif « tête de son vœu de naziréat ».
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: les cheveux de sa tête consacrée
  rationale: La répétition du lien avec la tête consacrée reflète celle de l’hébreu et souligne la valeur rituelle de la chevelure.
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: le feu qui brûle sous
  rationale: « Sous » rend directement la relation spatiale; l’ajout idiomatique « qui brûle » explicite seulement l’activité propre au feu sans modifier le rite.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: le sacrifice de paix
  rationale: Cette expression maintient une désignation cultuelle traditionnelle et le lien possible de שְׁלָמִים avec la paix, l’intégrité et le bien-être, tout en signalant d’autres traductions recevables en note.
theological_decisions:
- issue: Traduction du terme sacrificiel שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion; sacrifice de bien-être
  rationale: Le terme hébreu désigne une catégorie sacrificielle dont la portée ne se réduit pas avec certitude à la communion entre participants. « Paix » conserve l’appellation traditionnelle et une partie de l’éventail sémantique, tandis que la note préserve les principales autres compréhensions.
translation_notes:
  register: Français international moderne, digne et accessible. Le style prescriptif est rendu par le futur. Les termes cultuels « naziréen », « tente de la rencontre » et « sacrifice de paix » sont conservés sans archaïsme syntaxique.
