  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: fr
  text: Tels sont ceux qui furent recensés parmi les clans des descendants de Merari. Moïse et Aaron les recensèrent sur l’ordre de Yahvé[a], par l’intermédiaire de Moïse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche de Yahvé », c’est-à-dire sur son ordre.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de Moïse », c’est-à-dire par son intermédiaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Tels sont ceux qui furent recensés
  rationale: La formule présente le bilan du recensement. « Ceux qui furent recensés » rend le sens concret de פְקוּדֵי dans ce contexte sans ajouter explicitement « hommes », terme absent de l’hébreu.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: parmi les clans des descendants de Merari
  rationale: « Clans » convient à l’organisation tribale désignée par מִשְׁפְּחֹת, et « descendants de Merari » exprime naturellement en français la filiation de בְּנֵי מְרָרִי.
- source_word: פָּקַד
  choice: recensèrent
  rationale: Dans le contexte de Nombres 4, le verbe désigne l’action de dénombrer et d’inscrire les Lévites concernés; « recenser » est précis et idiomatique.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahvé
  rationale: Littéralement « selon la bouche de Yahvé », cette locution signifie agir conformément à son ordre. La note conserve l’image hébraïque.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin YHWH et permet de distinguer le nom propre d’un titre tel que « le Seigneur ».
- source_word: בְּיַד מֹשֶׁה
  choice: transmis par l’intermédiaire de Moïse
  rationale: L’expression littérale « par la main de Moïse » marque ici la médiation ou l’agence. « Par l’intermédiaire de Moïse » en donne naturellement le sens en français; « transmis » rattache clairement cette médiation à l’ordre divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. Le rendre par « Yahvé » préserve cette donnée sans le remplacer par un titre.
- issue: Relation entre l’ordre divin et la médiation de Moïse
  choice: « sur l’ordre de Yahvé, transmis par l’intermédiaire de Moïse »
  alternative: « selon la bouche de Yahvé, par la main de Moïse »
  rationale: La traduction principale communique le sens idiomatique des deux expressions tout en maintenant que l’ordre vient de Yahvé et passe par Moïse; les notes signalent les images littérales sans leur imposer une portée doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. « Clans » et « descendants » rendent naturellement la structure tribale et généalogique. La répétition de « recensés / recensèrent » conserve le lien lexical de l’hébreu, tandis que les deux phrases évitent une relative lourde et ambiguë en français.
