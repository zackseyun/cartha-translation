  rationale: מִשְׁפָּחוֹת désigne les subdivisions claniques du groupe lévitique.
- source_word: וּלְבֵית אֲבֹתָם
  choice: et leurs familles patriarcales
  rationale: L’expression בֵּית אָבוֹת désigne les maisons ou familles organisées selon la lignée paternelle; cette formulation française reste claire et distingue le niveau familial du clan.
