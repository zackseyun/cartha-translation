id: NUM.4.15
reference: Numbers 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: fr
  text: Quand Aaron et ses fils auront fini de couvrir les choses saintes et tous les objets sacrés, au moment où le camp se mettra en route, les fils de Qehath viendront ensuite pour les porter. Mais ils ne toucheront pas aux choses saintes[a], sinon ils mourront[b]. Voilà ce que les fils de Qehath auront à porter dans la tente de la Rencontre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne toucheront pas au sanctuaire ». L’hébreu emploie littéralement « le saint », expression qui peut désigner collectivement les objets sacrés ou, plus largement, le sanctuaire.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, plus littéralement : « et ils mourront ». L’hébreu énonce directement la conséquence.'
    reason: lexical_alternative
  - marker: c
    text: 'L’expression peut aussi être comprise ainsi : « pour ce qui concerne la tente de la Rencontre ».'
    reason: prepositional_ambiguity
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: auront fini de couvrir
  rationale: La construction exprime l’achèvement préalable de l’action; le futur antérieur français rend naturellement cette antériorité dans une procédure à venir.
- source_word: הַקֹּדֶשׁ
  choice: le sanctuaire
  rationale: Dans la première occurrence, le terme désigne globalement le domaine sacré dont les objets doivent être couverts; « sanctuaire » convient au contexte cultuel.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: tous les objets du sanctuaire
  rationale: כְּלֵי désigne les objets, ustensiles ou éléments d’équipement. « Objets » est clair et assez large pour ne pas restreindre indûment la catégorie.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: au moment où le camp se mettra en route
  rationale: L’infinitif construit marque le moment du départ; cette formulation est naturelle en français moderne.
- source_word: בְנֵי קְהָת
  choice: les fils de Qehath
  rationale: La formulation généalogique de l’hébreu est conservée, plutôt que remplacée dans le corps du texte par l’ethnonyme « Qehathites ».
- source_word: לָשֵׂאת
  choice: pour les porter
  rationale: Le pronom reprend les réalités sacrées qui viennent d’être couvertes; « porter » exprime directement la tâche de transport.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: Mais ils ne toucheront pas aux choses saintes
  rationale: Dans ce contexte de transport, הַקֹּדֶשׁ peut désigner collectivement les objets sacrés. « Toucher à » est idiomatique et maintient l’interdiction de contact.
- source_word: וָמֵתוּ
  choice: de peur de mourir
  rationale: La coordination hébraïque énonce directement l’issue mortelle. La tournure française restitue sa force d’avertissement, tandis qu’une note conserve la formulation plus littérale.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: Voilà ce que les fils de Qehath auront à porter
  rationale: Le pluriel démonstratif renvoie aux objets déjà énumérés, et מַשָּׂא associe charge matérielle et tâche assignée. La formulation française exprime les deux sans le calque peu naturel « ceux-ci sont la charge ».
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: La préposition est rendue localement. « Tente de la rencontre » traduit le rôle du lieu où Dieu rencontre son peuple ou ses représentants sans ajouter une précision absente.
theological_decisions:
- issue: Référent de הַקֹּדֶשׁ dans l’interdiction
  choice: les choses saintes, c’est-à-dire les réalités ou objets sacrés à transporter
  alternative: le sanctuaire
  rationale: Le contexte immédiat porte sur les objets couverts avant leur transport. Toutefois, le singulier collectif hébreu reste plus large; la note signale donc l’autre compréhension possible sans trancher silencieusement.
- issue: Nature de la conséquence exprimée par וָמֵתוּ
  choice: avertissement final rendu par « de peur de mourir »
  alternative: 'coordination directe : « et ils mourront »'
  rationale: Le français idiomatique fait ressortir la fonction d’avertissement de la clause, mais la note maintient la dureté et la franchise de la syntaxe hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve « les fils de Qehath » pour refléter la formulation hébraïque. « Objets » évite le caractère spécialisé de « ustensiles », et « auront à porter » rend naturellement la charge concrète assignée. Les ambiguïtés portant sur הַקֹּדֶשׁ, וָמֵתוּ et la valeur de בְּ sont signalées en notes.
