revisions:
- from: Quand Aaron et ses fils auront fini de couvrir le sanctuaire et tous les objets du sanctuaire, au moment où le camp se mettra en route, les fils de Qehath viendront ensuite pour les porter. Mais ils ne toucheront pas aux choses saintes[a], de peur de mourir[b]. Voilà ce que les fils de Qehath auront à porter dans la tente de la rencontre[c].
  to: Quand Aaron et ses fils auront fini de couvrir les choses saintes et tous les objets sacrés, au moment où le camp se mettra en route, les fils de Qehath viendront ensuite pour les porter. Mais ils ne toucheront pas aux choses saintes[a], sinon ils mourront[b]. Voilà ce que les fils de Qehath auront à porter dans la tente de la Rencontre[c].
  rationale: La révision évite de présenter comme un édifice ce qui est, dans le contexte, un ensemble de réalités sacrées à recouvrir et à transporter. Elle conserve en note la lecture plus large de הַקֹּדֶשׁ. « Sinon ils mourront » rend sans euphémisme la conséquence formulée directement en hébreu. Les notes existantes restent correctement ancrées et continuent de signaler les ambiguïtés pertinentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:47:58Z'
review_pass:
  verdict: revise
  source_fidelity: La séquence et l’interdiction sont bien rendues, mais « couvrir le sanctuaire » risque de faire entendre qu’il s’agit de couvrir l’édifice ou l’enceinte. Dans ce contexte de démontage et de transport, הַקֹּדֶשׁ désigne plus naturellement, de façon collective, les réalités sacrées à couvrir; l’ambiguïté plus large peut être conservée en note. La conséquence וָמֵתוּ est une coordination directe et gagne à être rendue explicitement (« sinon ils mourront »).
  naturalness: Le français est globalement fluide et d’un registre approprié. « Sinon ils mourront » est plus direct, plus naturel et plus fidèle que « de peur de mourir ». « Tente de la Rencontre » est une désignation française établie et accessible; la majuscule distingue le nom cultuel sans alourdir le texte.
  terminology: « Les fils de Qehath » préserve correctement la formulation généalogique. « Choses saintes » et « objets sacrés » rendent le collectif puis les כלי sans suggérer que le sanctuaire architectural serait couvert. « Tente de la Rencontre » convient à אֹהֶל מוֹעֵד.
  issues:
  - severity: medium
    issue: « couvrir le sanctuaire »
    rationale: Cette formulation peut désigner le bâtiment ou l’espace sacré dans son ensemble, alors que le contexte immédiat concerne les objets sacrés préparés pour le transport. « Les choses saintes » maintient le collectif hébreu et s’accorde avec l’interdiction qui suit.
  - severity: low
    issue: « de peur de mourir »
    rationale: La tournure est possible, mais elle transforme la conséquence coordonnée « et ils mourront » en expression de crainte. « Sinon ils mourront » restitue clairement l’avertissement et la conséquence.
  - severity: low
    issue: Capitalisation de « Rencontre »
    rationale: Dans « tente de la Rencontre », « Rencontre » fonctionne comme composant du nom cultuel établi en français et peut prendre une majuscule pour améliorer l’identification du référent.
  revised_text: Quand Aaron et ses fils auront fini de couvrir les choses saintes et tous les objets sacrés, au moment où le camp se mettra en route, les fils de Qehath viendront ensuite pour les porter. Mais ils ne toucheront pas aux choses saintes[a], sinon ils mourront[b]. Voilà ce que les fils de Qehath auront à porter dans la tente de la Rencontre[c].
  revised_footnotes:
