source:
  edition: WLC
  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: fr
  text: 'Mais faites ceci pour eux, afin qu’ils vivent et ne meurent pas lorsqu’ils s’approcheront des choses très saintes[a] : Aaron et ses fils viendront et affecteront chaque homme[b] à son service et à ce qu’il devra porter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Saint des saints » ou « du lieu très saint ». Dans ce contexte, l’expression désigne probablement les objets les plus sacrés plutôt que le sanctuaire intérieur lui-même.
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit littéralement « homme par homme », tournure distributive indiquant que chacun recevait son service et ce qu’il devait porter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: Mais faites ceci pour eux
  rationale: Le tour introduit l’instruction qui répond au danger mentionné dans le contexte. « Pour eux » rend naturellement la valeur bénéficiaire de לָהֶם.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: afin qu’ils vivent et ne meurent pas
  rationale: La formulation explicite la finalité de la mesure prescrite tout en conservant l’opposition solennelle entre vivre et mourir.
- source_word: בְּגִשְׁתָּם
  choice: lorsqu’ils s’approcheront
  rationale: La préposition ב avec l’infinitif construit exprime ici la circonstance temporelle; « s’approcher » conserve aussi la nuance cultuelle de נגשׁ.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: les choses très saintes
  rationale: Dans ce contexte de transport, l’expression désigne vraisemblablement les objets sacrés au plus haut degré plutôt que le lieu intérieur lui-même.
- source_word: וְשָׂמוּ אוֹתָם
  choice: affecteront
  rationale: Le verbe signifie ici placer chacun dans la fonction et auprès de la charge qui lui sont attribuées. « Affecter » exprime clairement cette attribution administrative.
- source_word: אִישׁ אִישׁ
  choice: chaque homme
  rationale: La répétition a une valeur distributive. Le masculin est maintenu puisque le passage concerne les hommes qehatites chargés du transport.
- source_word: עַל עֲבֹדָתוֹ
  choice: à son service
  rationale: עֲבֹדָה désigne la tâche de service assignée dans le cadre lévitique.
- source_word: וְאֶל מַשָּׂאוֹ
  choice: à ce qu’il devra porter
  rationale: Cette formulation rend le sens concret de מַשָּׂא dans le contexte du transport, sans l’ambiguïté française de « charge », qui pourrait désigner uniquement une fonction.
theological_decisions:
- issue: Référent de קֹדֶשׁ הַקֳּדָשִׁים
  choice: les choses très saintes
  alternative: le Saint des saints / le lieu très saint
  rationale: Le contexte immédiat porte sur les objets couverts que les Qehatites doivent transporter. Le pluriel concret convient donc mieux, tout en signalant en note la lecture spatiale possible.
- issue: Genre de אִישׁ אִישׁ
  choice: chaque homme
  alternative: chacun / chaque personne
  rationale: Les personnes visées sont les hommes du clan qehatite affectés au service lévitique; le masculin du texte source est donc pertinent et n’est pas neutralisé.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe prescriptive reste solennelle sans employer de tournures archaïques; « ce qu’il devra porter » privilégie la précision concrète dans ce contexte de transport.
