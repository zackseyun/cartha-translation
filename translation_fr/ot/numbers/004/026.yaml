source:
  edition: WLC
  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: fr
  text: Et les tentures de la cour, le rideau de l’entrée de la porte de la cour qui entoure le tabernacle et l’autel, leurs cordages[a], tout le matériel nécessaire à leur service et tout ce qui doit être fait avec eux[b] ; et ils accompliront leur service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs cordes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tout ce qui doit être fait pour eux ». L’hébreu peut désigner soit les tâches accomplies avec ces objets, soit celles qui sont accomplies pour eux dans le cadre du service.
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: tentures
  rationale: Désigne les pièces de tissu formant l’enceinte de la cour ; « tentures » est naturel et les distingue des rideaux intérieurs.
- source_word: חָצֵר
  choice: cour
  rationale: Terme usuel et précis pour l’espace extérieur clos du sanctuaire.
- source_word: מָסַךְ
  choice: rideau
  rationale: Dans ce contexte cultuel, le mot désigne une pièce textile fermant ou marquant une entrée ; « rideau » est plus naturel en français que « écran ».
- source_word: פֶּתַח שַׁעַר
  choice: l’entrée de la porte
  rationale: Conserve la formulation appuyée de la chaîne construite hébraïque tout en restant intelligible.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: qui entoure le tabernacle et l’autel
  rationale: Rend naturellement la relation spatiale de la cour autour du tabernacle et de l’autel, sans répéter lourdement « autour ».
- source_word: מֵיתְרֵיהֶם
  choice: leurs cordages
  rationale: Désigne collectivement les cordes servant à maintenir les éléments textiles ; « cordages » convient à cet équipement.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: tout le matériel nécessaire à leur service
  rationale: כְּלִים est un terme large pour l’équipement ; cette formulation exprime clairement sa fonction sans le réduire à des ustensiles.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: tout ce qui doit être fait avec eux
  rationale: Préserve l’interprétation instrumentale probable tout en signalant en note que לָהֶם peut aussi signifier « pour eux ».
- source_word: וְעָבָדוּ
  choice: et ils accompliront leur service
  rationale: Exprime le travail cultuel confié aux Guershonites et évite l’incomplétude que pourrait produire ici le simple verbe « servir ».
theological_decisions:
- issue: Référent et valeur de לָהֶם dans כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: « avec eux », en référence aux objets et éléments énumérés
  alternative: « pour eux »
  rationale: Le contexte porte sur l’usage et la manutention des éléments du sanctuaire, mais la préposition hébraïque permet aussi une lecture bénéficiaire ; l’ambiguïté est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’énumération hébraïque, avec un point-virgule avant la clause finale. Les termes cultuels « cour », « tabernacle » et « service » sont conservés pour leur précision contextuelle.
