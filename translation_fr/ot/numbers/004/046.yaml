  text: כָּֽל הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י יִשְׂרָאֵ֖ל אֶת הַ/לְוִיִּ֑ם לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: fr
  text: Tous les Lévites recensés[a] par Moïse, Aaron et les responsables d’Israël, selon leurs clans et leurs maisons paternelles[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dénombrés » ou « enregistrés ». L’hébreu emploie ici le vocabulaire officiel du recensement, formé sur le verbe פקד.
    reason: lexical_alternative
  - marker: b
    text: Les « maisons paternelles » sont des groupes familiaux définis par leur ascendance au sein des clans.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים אֲשֶׁר פָּקַד
  choice: Tous les Lévites recensés … par
  rationale: Le participe passif et le verbe de même racine relèvent ici du vocabulaire du recensement. La restructuration en français évite une répétition lourde (« tous les recensés que… recensèrent ») tout en conservant le sens officiel du dénombrement.
- source_word: מֹשֶׁה וְאַהֲרֹן וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: Moïse, Aaron et les responsables d’Israël
  rationale: נְשִׂיאִים désigne les chefs ou dirigeants tribaux. « Responsables » est actuel et compréhensible, sans suggérer des princes au sens dynastique.
- source_word: אֶת הַלְוִיִּם
  choice: les Lévites
  rationale: Le marqueur אֶת introduit le groupe directement recensé. Placer « les Lévites » en tête du groupe nominal donne une syntaxe française naturelle.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision familiale ou clanique dans l’organisation d’Israël; « clans » rend précisément ce niveau collectif.
- source_word: וּלְבֵית אֲבֹתָם
  choice: et leurs maisons paternelles
  rationale: Cette expression conserve la métaphore hébraïque traditionnelle de la « maison du père » pour une unité familiale ancestrale; une note en explicite le sens culturel.
