  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: fr
  text: 'Ils placeront dessus tous les ustensiles dont on se sert pour le service à l’autel : les récipients à braises, les fourches, les pelles et les bassins — tous les ustensiles de l’autel. Puis ils étendront dessus une couverture en cuir de tahash[a] et mettront ses barres en place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’animal désigné par le mot hébreu tahash est inconnu. On a notamment proposé une peau de chèvre, de marsouin ou de dugong ; le terme peut aussi être rendu plus généralement par « cuir résistant ».
    reason: Incertitude lexicale concernant l’espèce animale et le type de peau.
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Ils placeront dessus
  rationale: Le verbe נתן exprime ici la mise en place des objets dans une suite d’instructions; « placeront dessus » est naturel et renvoie clairement à l’autel.
- source_word: כָּל־כֵּלָיו
  choice: tous les ustensiles
  rationale: כְּלִי désigne largement des objets ou instruments; « ustensiles » convient à l’équipement cultuel et reste accessible.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: qui servent au service de l’autel
  rationale: La formulation rend la fonction cultuelle de שרת et explicite le référent de « lui/dessus » sans suggérer que les objets eux-mêmes accomplissent le service.
- source_word: הַמַּחְתֹּת
  choice: les récipients à braises
  rationale: מַחְתָּה désigne un récipient servant à prendre ou transporter des braises; cette traduction est plus précise ici que « encensoirs ».
- source_word: הַמִּזְלָגֹת
  choice: les fourches
  rationale: Traduction concrète et moderne de ces instruments fourchus, sans imposer l’emploi plus précis de « fourchettes à viande ».
- source_word: הַיָּעִים
  choice: les pelles
  rationale: Le terme désigne des instruments employés notamment pour retirer les cendres; « pelles » est clair dans le contexte de l’autel.
- source_word: הַמִּזְרָקֹת
  choice: les bassins
  rationale: Ces récipients cultuels pouvaient contenir ou servir à projeter des liquides; « bassins » évite la connotation domestique de « bols ».
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: tous les ustensiles de l’autel
  rationale: La reprise nominale hébraïque est conservée comme récapitulation de la liste.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: Puis ils étendront dessus une couverture
  rationale: « Étendre » conserve le sens concret de פרשׂ, tandis que « puis » marque naturellement la progression des opérations.
- source_word: עוֹר תַּחַשׁ
  choice: cuir de tahash
  rationale: L’identité de l’animal appelé תַּחַשׁ demeure incertaine. La translittération conserve cette incertitude au lieu de choisir arbitrairement une espèce ou d’ajouter une qualité absente du texte.
- source_word: וְשָׂמוּ בַדָּיו
  choice: et mettront ses barres en place
  rationale: La formule indique la mise en position des barres destinées au transport; « en place » exprime idiomatiquement cette action en français.
