  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/021.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Puis Yahweh parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le waw consécutif fait progresser le récit, tandis que דִּבֵּר désigne ici le fait de parler ou de s’adresser à quelqu’un. « Puis … parla » restitue naturellement ces deux aspects.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל introduit le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Dans cette formule introductive, l’infinitif « disant » annonce le contenu du discours. « En ces termes : » en restitue la fonction dans un français actuel et digne.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer silencieusement par le titre traditionnel « le SEIGNEUR ».
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la progression narrative et la formule d’introduction du discours sans employer le calque peu naturel « disant ».
