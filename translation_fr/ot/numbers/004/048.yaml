  rationale: Issu de פקד dans un contexte de recensement, le terme désigne les personnes enregistrées et comptées. Le contexte immédiat concerne les hommes lévites admissibles au service; « hommes » rend donc fidèlement le référent, tandis que « parmi eux » exprime naturellement le suffixe hébreu.
