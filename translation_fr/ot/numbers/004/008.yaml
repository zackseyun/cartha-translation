  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: fr
  text: Ils étendront sur eux une étoffe écarlate, couvriront la table d’une couverture en peau de tahash[a] et mettront ses barres en place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : tahash ; l’animal ou le matériau précis est incertain. Les traductions traditionnelles proposent notamment « peau de blaireau », « peau de dauphin » ou, plus généralement, « cuir fin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: Ils étendront par-dessus eux
  rationale: Le verbe désigne l’action de déployer une couverture sur les objets mentionnés au verset précédent; le pronom pluriel de l’hébreu est conservé.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: une étoffe écarlate
  rationale: Dans ce contexte, בגד désigne une pièce textile plutôt qu’un vêtement. « Écarlate » rend la couleur ou matière teinte sans ajouter « fil », qui n’est pas explicite ici.
- source_word: וְכִסּוּ אֹתוֹ
  choice: la couvriront
  rationale: Le suffixe objet singulier renvoie vraisemblablement à la table, nom féminin en français. La traduction maintient le passage du pluriel au singulier présent en hébreu.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: d’une couverture en peau de tahash
  rationale: מכסה indique une couche couvrante. L’identité précise du tahash étant incertaine, la translittération évite une identification animale spéculative.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: et mettront ses barres en place
  rationale: Les בדים sont les barres servant au transport du mobilier sacré. « En place » exprime naturellement l’action implicite de les positionner, sans préciser davantage le mode de fixation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec un vocabulaire concret adapté aux prescriptions cultuelles. La structure conserve le changement de référent entre les objets pluriels et la table singulière, ainsi que l’incertitude lexicale de תחשׁ.
