id: NUM.4.20
reference: Numbers 4:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: fr
  text: Mais ils ne doivent pas entrer pour regarder les objets sacrés, même un seul instant[a], sinon ils mourront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pendant qu’on les couvre ». L’expression hébraïque est difficile : elle peut désigner un regard très bref ou le moment où les objets sacrés sont couverts.'
    reason: ambiguïté lexicale et syntaxique
lexical_decisions:
- source_word: וְלֹא
  choice: Mais… ne… pas
  rationale: La conjonction avec la négation poursuit l’instruction sous forme d’interdiction; « Mais » marque naturellement le contraste avec les dispositions précédentes.
- source_word: יָבֹאוּ
  choice: ils ne doivent pas entrer
  rationale: Le verbe signifie venir, aller ou entrer. Dans ce contexte, il exprime l’interdiction faite aux Qehatites de pénétrer pour voir les objets sacrés.
- source_word: לִרְאוֹת
  choice: pour regarder
  rationale: « Regarder » rend ici plus clairement que « voir » l’exposition visuelle visée par l’avertissement, sans exagérer l’idée en « contempler ».
- source_word: כְבַלַּע
  choice: même un seul instant
  rationale: L’expression hébraïque est difficile et peut désigner une vision extrêmement brève; cette formulation idiomatique française conserve ce sens tout en signalant en note l’autre compréhension contextuelle, « pendant qu’on les couvre ».
- source_word: אֶת־הַקֹּדֶשׁ
  choice: les objets sacrés
  rationale: Le singulier hébreu a ici une valeur collective et renvoie, dans le contexte immédiat, au mobilier sacré du sanctuaire.
- source_word: וָמֵתוּ
  choice: sinon ils mourront
  rationale: La proposition énonce la conséquence mortelle d’une transgression; « sinon » restitue clairement la force de l’avertissement en français moderne.
theological_decisions:
- issue: Référent de הַקֹּדֶשׁ
  choice: référence collective aux objets sacrés
  alternative: le sanctuaire, ou ce qui est saint au sens abstrait
  rationale: Nombres 4 traite immédiatement du mobilier du tabernacle qu’il faut couvrir et transporter. « Les objets sacrés » conserve ce référent concret sans faire du terme un lieu.
- issue: Sens de כְבַלַּע
  choice: durée extrêmement brève
  alternative: au moment où les objets sacrés sont couverts
  rationale: La construction demeure ambiguë. Le texte principal adopte le sens temporel idiomatique traditionnel, tandis que la note préserve l’interprétation liée à l’action de couvrir, particulièrement pertinente dans le contexte.
translation_notes:
  register: Français international moderne, clair et digne. « Objets sacrés » est concret et accessible; « même un seul instant » exprime naturellement la brièveté absolue. La note conserve l’ambiguïté réelle de l’hébreu sans la résoudre silencieusement.
