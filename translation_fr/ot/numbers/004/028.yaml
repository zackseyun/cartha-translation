  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹ֛ת בְּנֵ֥י הַ/גֵּרְשֻׁנִּ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד וּ/מִ֨שְׁמַרְתָּ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: fr
  text: 'Voici le service des familles des descendants de Guershon dans la tente de la Rencontre : leur charge[a] relèvera de l’autorité d’Itamar[b], fils d’Aaron le prêtre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur responsabilité » ; le terme hébreu peut désigner une responsabilité ou une obligation assignée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la main d’Itamar », expression qui signifie sous sa supervision ou son autorité.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Voici le service
  rationale: La tournure présentative française rend naturellement l’identification introduite par le démonstratif זֹאת, tandis que « service » convient au travail assigné dans le sanctuaire sans introduire la nuance ecclésiastique moderne de « ministère ».
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: des familles des descendants de Guershon
  rationale: « Familles » conserve la structure sociale exprimée par מִשְׁפְּחֹת, et « descendants de Guershon » restitue clairement la filiation portée par בְּנֵי dans un français naturel.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Cette formulation rend littéralement les éléments de l’expression hébraïque tout en désignant clairement le sanctuaire où s’exerce le service.
- source_word: וּמִשְׁמַרְתָּם
  choice: leur responsabilité
  rationale: מִשְׁמֶרֶת désigne ici une charge ou une obligation assignée. « Responsabilité » est clair en français moderne et garde la portée administrative du terme.
- source_word: בְּיַד אִיתָמָר
  choice: sous l’autorité d’Itamar
  rationale: L’expression littérale « dans la main d’Itamar » est un idiome de supervision. La traduction explicite son sens naturel, tandis qu’une note conserve l’image hébraïque.
- source_word: בֶּן אַהֲרֹן הַכֹּהֵן
  choice: fils du prêtre Aaron
  rationale: Cette construction française rattache naturellement le titre de prêtre à Aaron, conformément à l’ordre et au sens de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche de la structure hébraïque, tout en explicitant dans le corps du texte l’idiome de la « main » et en signalant sa forme littérale en note.
