  source_fidelity: Le sens de la tranche d’âge, du participe « tous ceux qui viennent », de l’objectif du service et des deux expressions de travail est globalement bien rendu. « Transport des charges » est toutefois légèrement plus large que מַשָּׂא, qui vise le portage de charges.
