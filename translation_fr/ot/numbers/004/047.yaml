  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: fr
  text: de trente à cinquante ans, tous ceux qui viennent accomplir le travail de service et le service de portage[a] dans la tente de la Rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le travail du service et le travail du portage ». L’hébreu répète des formes du même nom, soit pour insister, soit pour distinguer des catégories de tâches.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de trente ans et au-dessus
  rationale: Cette formulation conserve explicitement l’idiome hébreu qui fixe la limite d’âge inférieure, tout en restant compréhensible en français moderne.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: jusqu’à l’âge de cinquante ans
  rationale: La formulation exprime directement la limite supérieure de la tranche d’âge.
- source_word: כָּל הַבָּא
  choice: tous ceux qui viennent
  rationale: Le participe substantivé désigne tous ceux qui se présentent pour cette fonction; la traduction conserve son mouvement verbal sans introduire l’idée plus interprétative d’aptitude ou d’affectation.
- source_word: לַעֲבֹד
  choice: accomplir
  rationale: L’infinitif indique le but de leur venue. «Accomplir» convient aux tâches décrites ensuite et évite de confondre le verbe avec le nom répété עֲבֹדָה.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: le travail de service
  rationale: Cette expression garde les deux éléments de la construction hébraïque tout en évitant une répétition excessivement obscure en français.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: et le service du transport des charges
  rationale: מַשָּׂא désigne ce qui est porté, une charge ou un fardeau. La traduction rend concrètement la tâche de transport sans réduire le terme à une notion abstraite.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: La préposition est rendue par «dans», et «tente de la rencontre» traduit le nom traditionnel du sanctuaire mobile sans ajouter d’interprétation.
