  variant: modern international French
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: fr
  text: Tels furent ceux qui furent recensés parmi les familles des fils de Guershon, tous ceux qui accomplissaient leur service dans la tente de la Rencontre, que Moïse et Aaron recensèrent sur l’ordre de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Tels furent ceux qui furent recensés
  rationale: La formule récapitule le recensement dans un contexte narratif passé. « Ceux qui furent recensés » exprime ici le sens de פקד sans ajouter explicitement « hommes », absent de cette expression hébraïque.
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: parmi les familles des fils de Guershon
  rationale: « Familles » convient aux subdivisions tribales, tandis que « fils de Guershon » conserve la tournure généalogique de l’hébreu.
- source_word: כָּל הָעֹבֵד
  choice: tous ceux qui accomplissaient leur service
  rationale: Le participe désigne l’ensemble des personnes engagées dans le service. L’imparfait français rend naturellement cette activité en cours dans le cadre du récit.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Traduction transparente de l’appellation cultuelle אֹהֶל מוֹעֵד. « Dans » conserve la préposition, sans exclure les tâches liées plus largement à la tente.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: que Moïse et Aaron recensèrent
  rationale: La relative reprend les personnes recensées; la répétition de « recenser » maintient le lien lexical avec פְקוּדֵי.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: Cette expression idiomatique signifie qu’ils agirent conformément au commandement divin; une traduction littérale par « sur la bouche de » serait obscure en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom propre sans le substituer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche de la structure récapitulative hébraïque, tout en évitant une lourdeur excessive; « accomplissaient leur service » convient mieux au registre cultuel que le simple « travaillaient ».
