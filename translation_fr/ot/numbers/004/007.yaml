source:
  edition: WLC
  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: fr
  text: Sur la table de la Présence[a], ils étendront une étoffe bleue. Ils y déposeront les plats, les coupes, les bols et les cruches pour la libation. Le pain perpétuel[b] sera sur la table.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « table des pains de proposition ». L’hébreu dit plus littéralement « table de la Présence ».'
    reason: alternative_reading
  - marker: b
    text: Ou « le pain continuel ». Il s’agit du pain régulièrement maintenu devant le SEIGNEUR sur cette table.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: la table de la Présence
  rationale: L’expression signifie littéralement « table de la face/de la présence ». Cette formulation conserve l’image hébraïque et son sens cultuel sans recourir d’emblée au traditionnel « table des pains de proposition ».
- source_word: יִפְרְשׂוּ
  choice: ils étendront
  rationale: Le verbe désigne l’action de déployer ou d’étendre quelque chose sur une surface.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: une étoffe bleue
  rationale: תְּכֵלֶת désigne une teinte bleue ou bleu-violet caractéristique des textiles du sanctuaire. « Bleue » reste clair sans préciser excessivement la nuance.
- source_word: הַקְּעָרֹת
  choice: les plats
  rationale: Le terme désigne ici des récipients plats faisant partie du service de la table.
- source_word: הַכַּפֹּת
  choice: les coupes
  rationale: Le mot peut désigner divers petits récipients ou ustensiles creux. « Coupes » convient à cette liste sans imposer une forme trop précise.
- source_word: הַמְּנַקִּיֹּת
  choice: les bols
  rationale: L’identification exacte de ce récipient cultuel est incertaine. « Bols » offre un terme courant et suffisamment général.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: les cruches destinées aux libations
  rationale: La construction associe ces récipients au versement d’une libation. « Cruches » exprime naturellement leur fonction probable, tandis que « libations » préserve le cadre cultuel.
- source_word: לֶחֶם הַתָּמִיד
  choice: le pain continuel
  rationale: תָּמִיד exprime la continuité ou la régularité prescrite. « Pain continuel » conserve la formulation cultuelle concise et laisse la note en préciser le sens.
- source_word: עָלָיו יִהְיֶה
  choice: sera sur la table
  rationale: Le pronom renvoie à la table. Répéter « la table » en français évite l’ambiguïté que créerait « dessus » après la liste des récipients.
theological_decisions:
- issue: Sens cultuel de « présence »
  choice: Conserver « table de la Présence » dans le texte
  alternative: « table des pains de proposition »
  rationale: Le choix principal suit plus directement l’expression hébraïque sans trancher au-delà de celle-ci la nature exacte de la présence évoquée; la désignation française traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux phrases remplacent la longue coordination hébraïque par une ponctuation naturelle. Les noms des récipients restent volontairement généraux, car leur forme exacte est incertaine. Tous les marqueurs de notes sont placés immédiatement après l’expression qu’ils expliquent.
