  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: fr
  text: de trente ans à cinquante ans, tous ceux qui viennent pour le service, pour le travail dans la tente de la rencontre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui se présentent pour le service ». Le participe hébreu peut mettre l’accent sur ceux qui viennent ou se présentent afin d’accomplir le service qui leur est assigné.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de trente ans et au-dessus
  rationale: L’expression idiomatique בֶּן + nombre + שָׁנָה indique l’âge; « depuis l’âge de » rend naturellement la borne inférieure, tandis que « et au-dessus » conserve la formulation inclusive de וָמַעְלָה.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: jusqu’à l’âge de cinquante ans
  rationale: Cette expression fixe la limite supérieure de la tranche d’âge dans un français clair et actuel.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: tous ceux qui viennent prendre leur service
  rationale: « viennent » garde la valeur du participe de בוא, et « prendre leur service » exprime ici l’entrée dans un devoir organisé sans imposer au contexte lévitique un sens strictement militaire.
- source_word: לַעֲבֹדָה
  choice: pour accomplir le travail
  rationale: Cette formulation distingue עֲבֹדָה du service organisé exprimé par צָבָא et rend explicite le rapport final marqué par לְ.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: « Tente de la rencontre » rend l’expression hébraïque standard אֹהֶל מוֹעֵד, et « dans » correspond directement à la préposition בְּ.
