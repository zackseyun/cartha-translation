  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: fr
  text: Ceux qui furent recensés[a], selon leurs clans et selon leurs maisons paternelles, étaient au nombre de 2 630.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « les personnes enregistrées parmi eux », « leur effectif recensé » ou « ceux qui furent dénombrés ». L’hébreu désigne les personnes inscrites lors du recensement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient au nombre de
  rationale: Dans cette formule de recensement, היה introduit le total obtenu. « Étaient au nombre de » est naturel en français et rend clairement la valeur résultative.
- source_word: פְּקֻדֵיהֶם
  choice: Ceux d’entre eux qui furent recensés
  rationale: Le terme désigne les personnes enregistrées ou comptées lors du recensement. Cette formulation conserve l’idée d’un groupe issu de l’ensemble mentionné sans ajouter ici le mot « hommes ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre des recensements d’Israël, מִשְׁפָּחָה désigne une subdivision de parenté; « clans » est précis et compréhensible.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs familles patriarcales
  rationale: L’expression désigne les unités généalogiques organisées selon la lignée paternelle. « Familles patriarcales » restitue cette structure en français actuel sans la réduire aux seuls pères immédiats.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: 2 630
  rationale: Rendu numérique conforme à l’usage typographique français moderne.
