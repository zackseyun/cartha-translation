id: NUM.4.5
reference: Numbers 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: fr
  text: Quand le camp se mettra en route, Aaron et ses fils viendront retirer le voile de séparation et en couvriront l’arche du témoignage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon l’expression traditionnelle, « l’arche de l’alliance ». Toutefois, l’hébreu dit ici « témoignage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: viendront
  rationale: Malgré la forme verbale au singulier, le sujet composé « Aaron et ses fils » et les verbes pluriels qui suivent indiquent une action collective. Le futur convient à cette instruction.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: Quand le camp se mettra en route
  rationale: La construction avec l’infinitif marque la circonstance temporelle. « Se mettre en route » rend naturellement le départ du camp.
- source_word: וְהוֹרִדוּ
  choice: retirer
  rationale: Dans le contexte du démontage du sanctuaire, le verbe désigne le fait de faire descendre puis d’enlever le voile. « Retirer » exprime clairement l’action sans préciser un mode de fixation absent du texte.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: le voile de séparation
  rationale: פָּרֹכֶת désigne le voile intérieur du sanctuaire, tandis que הַמָּסָךְ souligne sa fonction d’écran. L’expression française traditionnelle et compréhensible « voile de séparation » conserve cette fonction cultuelle.
- source_word: וְכִסּוּ בָהּ
  choice: et en couvriront
  rationale: Le pronom féminin renvoie au voile et indique le moyen employé. La tournure « en couvriront » restitue cette relation avec concision.
- source_word: אֲרֹן הָעֵדֻת
  choice: l’arche du témoignage
  rationale: Le texte porte עֵדוּת, « témoignage », et non בְּרִית, « alliance ». « Arche » est le terme français établi pour ce coffre sacré, sans remplacer le nom hébreu par l’expression traditionnelle différente.
theological_decisions:
- issue: Désignation de l’arche dans אֲרֹן הָעֵדֻת
  choice: l’arche du témoignage
  alternative: l’arche de l’alliance
  rationale: La traduction conserve la désignation exacte du texte hébreu, « témoignage », au lieu de lui substituer l’expression théologiquement proche mais lexicalement différente « arche de l’alliance ».
translation_notes:
  register: Français international moderne, clair et digne. Le futur exprime l’instruction liée au prochain départ du camp. « Retirer » évite le calque peu naturel « faire descendre », et « voile de séparation » maintient la fonction particulière du voile dans le sanctuaire.
