  text: וְ/לָקְחוּ֩ אֶת כָּל כְּלֵ֨י הַ/שָּׁרֵ֜ת אֲשֶׁ֧ר יְשָֽׁרְתוּ בָ֣/ם בַּ/קֹּ֗דֶשׁ וְ/נָֽתְנוּ֙ אֶל בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אוֹתָ֔/ם בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: fr
  text: Ils prendront ensuite tous les ustensiles avec lesquels ils assurent le service dans le sanctuaire, les mettront dans une étoffe bleue, les couvriront d’une housse en cuir fin[a] et les poseront sur le dispositif de transport[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu תָּחַשׁ (taḥash) est de sens incertain. Il peut désigner la peau d’un animal particulier ou une sorte de cuir fin ou résistant.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les poseront sur la perche ». Le texte hébreu emploie le singulier « perche » ou « barre », qui peut désigner l’ensemble du dispositif de transport.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Ils prendront ensuite
  rationale: Le waw introduit l’étape suivante des instructions, et l’accompli à valeur consécutive se rend naturellement par le futur en français.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: tous les ustensiles
  rationale: כְּלִי désigne ici les objets ou ustensiles employés dans le service cultuel. La proposition relative qui suit explicite leur fonction sans qu’il soit nécessaire de répéter « du service ».
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: avec lesquels ils assurent le service
  rationale: שרת désigne le service accompli dans le cadre du sanctuaire. Cette formulation française demeure claire et digne sans employer le verbe potentiellement ambigu « administrer ».
- source_word: בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: Le terme signifie littéralement « dans le lieu saint » ou « dans ce qui est saint »; dans ce contexte, « sanctuaire » désigne naturellement l’espace sacré sans imposer une identification plus étroite.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: une étoffe bleue
  rationale: בֶּגֶד désigne ici une pièce de tissu plutôt qu’un vêtement, et תְּכֵלֶת une matière teinte d’un bleu caractéristique des textiles du sanctuaire.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: une housse en cuir fin
  rationale: מִכְסֵה est une couverture protectrice; l’identité précise du תָּחַשׁ étant incertaine, « cuir fin » fournit un sens contextuel intelligible sans retenir une identification zoologique conjecturale. L’incertitude est signalée en note.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: et les poseront sur le dispositif de transport
  rationale: מוֹט est au singulier et peut désigner une barre ou perche de portage. « Dispositif de transport » exprime sa fonction sans trancher abusivement la forme exacte de l’appareil; l’alternative littérale est conservée en note.
