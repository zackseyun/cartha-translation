  text: נָשֹׂ֗א אֶת רֹ֛אשׁ בְּנֵ֥י גֵרְשׁ֖וֹן גַּם הֵ֑ם לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: fr
  text: Fais aussi le recensement[a] des fils de Guershon, selon leurs maisons ancestrales et selon leurs clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Relève la tête des fils de Guershon » ; c’est une expression qui signifie les compter ou en faire le recensement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Fais le recensement
  rationale: L’expression signifie littéralement « relever la tête », mais, dans ce contexte administratif, elle désigne le fait de compter officiellement un groupe. « Fais le recensement » rend naturellement l’impératif et son sens contextuel.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: les fils de Guershon
  rationale: Cette formulation conserve l’expression généalogique explicite de l’hébreu, plutôt que de la remplacer par un gentilé comme « Guershonites ».
- source_word: גַּם הֵם
  choice: aussi
  rationale: La locution ajoute les fils de Guershon au groupe précédemment recensé. En français naturel, « aussi » exprime cette inclusion sans surcharger la phrase.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons ancestrales
  rationale: L’expression désigne les unités de filiation paternelle. « Maisons ancestrales » reste fidèle à la structure sociale visée tout en étant plus intelligible en français moderne que le calque « maisons de leurs pères ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre tribal et censitaire, מִשְׁפָּחָה désigne une subdivision lignagère plus large que la famille nucléaire moderne ; « clans » évite cette ambiguïté.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe administrative du passage est conservée, tandis que l’idiome hébreu est rendu par son sens contextuel. Le nom גֵרְשׁוֹן est transcrit selon la forme française traditionnelle « Guershon ».
