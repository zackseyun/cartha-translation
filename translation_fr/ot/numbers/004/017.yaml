source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte YHWH, le nom propre de Dieu, ici transcrit « Yahweh » ; il est traditionnellement rendu par « l’Éternel » ou « le Seigneur ».
    reason: Préciser la forme hébraïque et signaler les principaux rendus traditionnels du nom divin.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif biblique en français écrit et rend précisément l’acte de parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin YHWH est transcrit « Yahweh » afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: La préposition אֶל désigne les destinataires de la parole. En français, sa répétition devant le second nom n’est pas nécessaire pour conserver le sens.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule introduit le discours direct qui suit. « En ces termes » est une tournure française naturelle et digne, sans lourdeur littérale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel ; le Seigneur ; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement, tandis que « l’Éternel » et « le Seigneur » lui substituent des titres et que « Jéhovah » repose sur une vocalisation hybride plus tardive.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif écrit ; « en ces termes » introduit naturellement la parole rapportée au verset suivant.
