  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: fr
  text: Ceux d’entre eux qui furent recensés selon leurs clans étaient au nombre de deux mille sept cent cinquante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient au nombre de
  rationale: Le waw consécutif fait progresser le compte rendu et היה exprime ici le total obtenu. La tournure française « étaient au nombre de » est naturelle dans un contexte de recensement.
- source_word: פְקֻדֵיהֶם
  choice: Ceux d’entre eux qui furent recensés
  rationale: Dans ce contexte de dénombrement, le terme issu de פקד désigne les personnes enregistrées ou comptées. Cette formulation conserve le sens passif sans ajouter « hommes », absent de ce verset.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision familiale ou clanique d’Israël. « Clans » rend clairement cette organisation, et la préposition לְ exprime le classement selon ces groupes.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: deux mille sept cent cinquante
  rationale: Le nombre hébreu est rendu en toutes lettres selon l’usage français, en conservant exactement le total de 2 750.
