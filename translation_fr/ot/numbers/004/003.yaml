  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: fr
  text: depuis l’âge de trente ans jusqu’à l’âge de cinquante ans, tous ceux qui se présentent pour le service[a], afin d’accomplir le travail dans la tente de la Rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « service » peut aussi désigner une tâche organisée, un corps constitué ou une armée. Ici, il s’agit du service assigné aux lévites.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de trente ans et au-dessus
  rationale: La tournure avec בֶּן et un nombre indique l’âge; « et au-dessus » conserve la formule hébraïque qui fixe la limite inférieure.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: jusqu’à l’âge de cinquante ans
  rationale: Rend clairement et naturellement la limite supérieure de la tranche d’âge.
- source_word: כָּל בָּא לַצָּבָא
  choice: tous ceux qui entrent en service
  rationale: Le participe בָּא garde l’idée d’entrer ou de se présenter, tandis que צָבָא désigne ici un service organisé plutôt qu’une activité militaire.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: pour accomplir le travail
  rationale: L’infinitif exprime le but; « accomplir le travail » convient au registre digne et à la tâche assignée.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Traduction transparente de l’expression hébraïque, avec « dans » pour le cadre du travail cultuel.
