  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: fr
  text: 'Voici ce qui leur est confié à porter pour tout leur service dans la tente de la Rencontre : les planches du tabernacle[a], ses traverses, ses poteaux et ses bases[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cadres du tabernacle ». Le mot hébreu désigne des pièces structurelles formant les parois.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses socles » ou « ses emboîtures ». Il s’agit des pièces de base dans lesquelles s’emboîtent les éléments verticaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Voici
  rationale: Cette tournure française introduit naturellement la précision qui suit, tout en rendant la valeur présentative de la conjonction et du démonstratif hébreux.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: la charge qu’ils auront à transporter
  rationale: מִשְׁמֶרֶת désigne une responsabilité assignée, tandis que מַשָּׂאָם désigne concrètement ce qu’ils doivent porter. Cette formulation française conserve les deux notions sans employer le peu naturel « devoir de leur fardeau ».
- source_word: לְכָל עֲבֹדָתָם
  choice: pour tout leur service
  rationale: « Service » convient au travail assigné aux Lévites et garde la nuance liée au sanctuaire sans la surinterpréter.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Rendu transparent de la désignation hébraïque du sanctuaire; « rencontre » exprime l’idée de rendez-vous ou de rencontre portée par מוֹעֵד.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: les cadres du tabernacle
  rationale: Dans ce contexte, קֶרֶשׁ désigne les pièces structurelles formant les parois. « Cadres » met en valeur leur fonction architecturale, tandis que « planches » reste une possibilité réelle signalée en note.
- source_word: בְרִיחָיו
  choice: ses traverses
  rationale: Ces pièces horizontales relient et maintiennent les cadres; « traverses » est précis et naturel en français architectural.
- source_word: עַמּוּדָיו
  choice: ses poteaux
  rationale: Le terme désigne des supports verticaux. « Poteaux » est concret, courant et approprié à une structure démontable.
- source_word: אֲדָנָיו
  choice: ses socles
  rationale: Il s’agit des pièces de fondation recevant les éléments verticaux. « Socles » est à la fois exact, lisible et moins ambigu que « bases ».
