  text: עַל פִּ֨י יְהוָ֜ה פָּקַ֤ד אוֹתָ/ם֙ בְּ/יַד מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/עַל מַשָּׂא֑/וֹ וּ/פְקֻדָ֕י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: fr
  text: Conformément à l’ordre de Yahvé, ils furent recensés par l’intermédiaire de Moïse[a], chacun selon son service et selon la charge qu’il devait porter; ils furent recensés[b] comme Yahvé l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est difficile et se rattache au verbe « recenser ». Il peut désigner les personnes recensées, leurs désignations ou leurs charges.
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: Sur l’ordre de Yahvé
  rationale: L’expression signifie littéralement « sur la bouche de Yahvé », mais constitue ici un idiome désignant l’ordre donné par Yahvé.
- source_word: פָּקַד אֹתָם
  choice: ils furent recensés
  rationale: Dans le contexte du recensement des Lévites aptes au service, פקד désigne leur enregistrement officiel; « recensés » rend ce sens administratif sans réduire le mot à un simple dénombrement.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Littéralement « par la main de Moïse »; l’expression indique ici que l’action s’accomplit par sa médiation.
- source_word: אִישׁ אִישׁ
  choice: chacun
  rationale: La répétition distributive hébraïque individualise le service et la charge de chaque homme recensé; le français naturel emploie « chacun ».
- source_word: עַל עֲבֹדָתוֹ
  choice: selon son service
  rationale: עֲבֹדָה désigne ici le service assigné à chaque Lévite dans le cadre du sanctuaire.
- source_word: וְעַל מַשָּׂאוֹ
  choice: et selon la charge qu’il devait porter
  rationale: מַשָּׂא désigne concrètement ce qui devait être transporté. Cette formulation évite l’ambiguïté de « fardeau » en français tout en conservant l’idée de charge.
- source_word: וּפְקֻדָיו
  choice: Leur affectation
  rationale: La forme, issue de פקד, est difficile et peut évoquer les personnes recensées, une désignation ou une charge confiée. « Affectation » convient au contexte de répartition du service, tandis qu’une note signale l’incertitude.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: fut conforme à ce que Yahvé avait ordonné à Moïse
  rationale: Le français explicite la relation de conformité entre l’affectation ou l’organisation précédente et l’ordre divin, sans modifier le contenu de cet ordre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte le nom propre divin יהוה. « Yahvé » le représente directement en français au lieu de lui substituer un titre.
- issue: Portée de וּפְקֻדָיו dans la proposition finale
  choice: Leur affectation fut conforme à ce que Yahvé avait ordonné à Moïse
  alternative: Et ceux qu’il avait recensés étaient ceux que Yahvé avait désignés à Moïse
  rationale: La morphologie et la syntaxe sont difficiles. Le choix principal suit le contexte des tâches attribuées, mais la note maintient ouverte l’interprétation liée aux personnes recensées ou à la charge confiée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation privilégie un ordre syntaxique naturel, rend concrètement la charge de transport et conserve en note l’ambiguïté réelle du dernier terme hébreu.
