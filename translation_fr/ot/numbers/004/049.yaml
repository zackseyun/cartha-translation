  to: Conformément à l’ordre de Yahvé, ils furent recensés par l’intermédiaire de Moïse[a], chacun selon son service et selon la charge qu’il devait porter; ils furent recensés[b] comme Yahvé l’avait ordonné à Moïse.
  rationale: La révision remplace l’interprétation singulière « Leur affectation » par une reprise explicite de « ils furent recensés », qui respecte mieux la forme plurielle et le contexte du recensement. La note maintient les autres possibilités de sens sans les intégrer de force au texte.
