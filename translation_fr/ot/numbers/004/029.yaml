  text: בְּנֵ֖י מְרָרִ֑י לְ/מִשְׁפְּחֹתָ֥/ם לְ/בֵית אֲבֹתָ֖/ם תִּפְקֹ֥ד אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: fr
  text: Quant aux fils de Merari[a], tu les recenseras selon leurs clans, selon leurs maisons paternelles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants de Merari » ou « Merarites ».
    reason: lexical_alternative
  - marker: b
    text: Expression généalogique hébraïque désignant des groupes familiaux établis selon l’ascendance paternelle.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: les fils de Merari
  rationale: L’expression signifie littéralement « les fils de Merari » et désigne ici ses descendants. Cette formulation conserve l’image généalogique de l’hébreu, tandis que la note indique des équivalents plus explicites.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte de recensement tribal, מִשְׁפָּחָה désigne une subdivision de parenté plus large que la famille nucléaire. « Clans » est clair et naturel en français moderne.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Cette expression généalogique traditionnelle désigne des groupes familiaux structurés d’après l’ascendance paternelle. La traduction conserve les deux éléments de l’expression hébraïque sans les réduire au simple mot « familles ».
- source_word: תִּפְקֹד
  choice: tu les recenseras
  rationale: Dans ce contexte, פקד signifie compter ou enregistrer officiellement. « Recenser » exprime naturellement cette opération administrative, et le futur français rend ici la valeur prescriptive de l’imparfait hébreu.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux fils de Merari et s’intègre naturellement avant le verbe en français.
