  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: fr
  text: 'À partir de trente ans et jusqu’à cinquante ans, tu les recenseras : tous ceux qui se présentent pour le service[a], afin d’accomplir le travail de la tente de la rencontre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « service » peut aussi désigner un corps organisé ou une armée ; ici, il s’agit de la tâche assignée aux Lévites.
    reason: Note lexicale et culturelle préservant la nuance collective de צָבָא.
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: Depuis l’âge de trente ans jusqu’à l’âge de cinquante ans
  rationale: L’expression hébraïque indique les deux limites de la tranche d’âge. Cette formulation française est naturelle et conserve clairement les seuils de trente et cinquante ans.
- source_word: תִּפְקְדֵם
  choice: tu les recenseras
  rationale: Dans ce contexte de dénombrement des Lévites aptes au service, פקד désigne leur recensement ou leur enregistrement. « Recenser » exprime davantage que le simple fait de compter, sans imposer une nuance militaire.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: tous ceux qui viennent prendre leur service
  rationale: La tournure désigne chacun de ceux qui se présentent pour une fonction organisée. « Prendre leur service » rend naturellement en français le mouvement exprimé par בוא et le sens institutionnel de צבא dans ce contexte lévitique.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: pour accomplir le travail
  rationale: L’infinitif עבד suivi du nom apparenté עֲבֹדָה produit une répétition naturelle en hébreu mais lourde en français. « Accomplir le travail » en conserve le sens sans calque maladroit.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette désignation traditionnelle du sanctuaire rend les deux éléments du syntagme hébreu sans ajouter de précision doctrinale.
theological_decisions:
- issue: Nuance éventuellement militaire de צָבָא appliqué aux Lévites
  choice: service
  alternative: corps organisé, troupe ou armée
  rationale: Dans Nombres 4, il s’agit du service organisé lié à la tente, et non d’un combat. « Service » préserve l’idée d’une fonction collective assignée sans introduire une image militaire excessive.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive (« tu les recenseras ») maintient la forme de l’instruction adressée à Moïse. La formulation évite à la fois l’archaïsme « depuis l’âge de trente ans et au-dessus » et une militarisation indue du service lévitique.
