  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: fr
  text: Ils placeront sur l’arche une couverture de peau de taḥash[a], puis étendront par-dessus cette couverture un tissu entièrement bleu et mettront ses barres en place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu תַּחַשׁ (taḥash) est de sens incertain. Il pourrait désigner la peau d’un animal particulier; on a notamment proposé « peau de chèvre », « peau de marsouin » ou « peau de dugong ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Ils placeront par-dessus l’arche
  rationale: Dans cette instruction rituelle, le parfait avec waw prend une valeur prescriptive. Le référent implicite du pronom est explicité par « l’arche » d’après le contexte immédiat, afin d’éviter une ambiguïté peu naturelle en français.
- source_word: כְּסוּי
  choice: une couverture
  rationale: Le nom désigne ce qui sert à couvrir; « couverture » convient naturellement à la couche protectrice posée sur l’arche.
- source_word: עוֹר תַּחַשׁ
  choice: en cuir fin
  rationale: L’identification zoologique de תַּחַשׁ est incertaine. « Cuir fin » évite une précision spéculative tout en exprimant qu’il s’agit d’une peau travaillée; l’incertitude est signalée en note.
- source_word: וּפָרְשׂוּ
  choice: puis étendront
  rationale: Le verbe signifie déployer ou étendre. « Puis » rend clairement la succession des gestes indiquée par la coordination hébraïque.
- source_word: בֶּגֶד
  choice: un tissu
  rationale: Bien que le mot puisse désigner un vêtement, il s’agit ici d’une pièce textile étendue comme couverture; « tissu » rend cette fonction.
- source_word: כְּלִיל תְּכֵלֶת
  choice: entièrement bleu
  rationale: כְּלִיל marque la totalité, tandis que תְּכֵלֶת désigne la teinture bleue ou bleu-violet caractéristique du sanctuaire. « Bleu » est clair et traditionnel sans surdéterminer la nuance.
- source_word: מִלְמָעְלָה
  choice: au-dessus
  rationale: L’expression indique que le tissu bleu constitue la couche supérieure.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: et mettront ses barres en place
  rationale: בַּדִּים désigne les barres servant au transport. « En place » explicite idiomatiquement le résultat du verbe « mettre » dans cette procédure.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le caractère prescriptif et la succession des couches, tout en explicitant sobrement le référent contextuel (« l’arche »).
