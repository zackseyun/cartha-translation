- from: Ils placeront par-dessus l’arche une couverture en cuir fin[a], puis étendront au-dessus un tissu entièrement bleu et mettront ses barres en place.
  to: Ils placeront sur l’arche une couverture de peau de taḥash[a], puis étendront par-dessus cette couverture un tissu entièrement bleu et mettront ses barres en place.
  rationale: La révision remplace l’interprétation « cuir fin » par « peau de taḥash », afin de refléter l’incertitude du mot hébreu dans le texte principal. Elle clarifie aussi que le tissu bleu est étendu sur la couverture précédente, sans modifier le sens ni le registre de l’instruction rituelle.
