  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: fr
  text: Sur l’autel d’or, ils étendront une étoffe bleue, le couvriront d’une couverture en cuir[a] et mettront ses barres en place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une couverture en peau de tahash » ; l’animal que désigne précisément tahash est inconnu. Les traductions proposées comprennent notamment « cuir fin », « peau de dugong » et d’autres termes désignant une peau résistante.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: l’autel d’or
  rationale: Le syntagme construit signifie littéralement « l’autel de l’or ». « L’autel d’or » est naturel en français et reste proche de la formulation hébraïque.
- source_word: יִפְרְשׂוּ
  choice: ils étendront
  rationale: Le verbe פרשׂ désigne l’action d’étendre ou de déployer quelque chose, ici une étoffe sur l’autel.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: une étoffe bleue
  rationale: בגד désigne ici une pièce de tissu, et תכלת une teinte bleue ou bleu violacé propre au mobilier cultuel. « Étoffe bleue » est clair sans préciser excessivement la nuance antique.
- source_word: וְכִסּוּ אֹתוֹ
  choice: le couvriront
  rationale: Le parfait précédé de waw poursuit la série d’instructions au futur. Le pronom masculin renvoie à l’autel.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: d’une couverture de cuir fin[a]
  rationale: מכסה signifie « couverture » et עור « peau, cuir ». L’identification de תחש étant incertaine, « cuir fin » évite d’imposer une espèce animale conjecturale, tandis que la note conserve explicitement l’incertitude.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: et mettront ses barres en place
  rationale: בדים désigne les barres servant au transport du mobilier du sanctuaire. « Mettront … en place » exprime naturellement l’action prescrite sans ajouter de détail absent du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la succession des gestes rituels. Le terme incertain תחש n’est pas identifié avec assurance dans le texte principal ; cette ambiguïté est signalée en note.
