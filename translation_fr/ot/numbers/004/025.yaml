  to: Ils porteront les tentures du tabernacle, la tente de la rencontre avec sa couverture, le revêtement de tahash[a] placé au-dessus, ainsi que le rideau de l’entrée de la tente de la rencontre.
  rationale: La translittération de tahash, accompagnée d’une note, maintient l’incertitude lexicale du texte hébreu sans retenir une espèce animale ni même affirmer dans le corps du texte qu’il s’agit nécessairement de cuir. « Placé au-dessus » conserve la fonction spatiale de l’expression hébraïque dans un français fluide.
