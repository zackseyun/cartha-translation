  naturalness: Le français est naturel, sobre et adapté au registre. « placée au-dessus » rend plus explicitement et idiomatiquement la position supérieure exprimée par אֲשֶׁר עָלָיו מִלְמָעְלָה.
  terminology: « Tentures », « tabernacle », « tente de la rencontre » et « rideau » sont cohérents et appropriés. « Revêtement de tahash » évite de présenter comme certaine une identification du terme hébreu contestée.
