  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: fr
  text: Ils porteront les tentures du tabernacle, la tente de la rencontre avec sa couverture, le revêtement de tahash[a] placé au-dessus, ainsi que le rideau de l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu תַּחַשׁ (tahash) désigne un matériau ou une peau animale dont l’identification est incertaine. Certaines traductions rendent « peau de tahash » ou proposent diverses espèces animales.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Ils porteront
  rationale: Dans ce contexte de déplacement du sanctuaire, נשׂא désigne l’action de porter ou de transporter les éléments confiés aux Lévites.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: les tentures du tabernacle
  rationale: יְרִיעֹת désigne les grandes pièces d’étoffe formant la structure textile; « tentures » est naturel et précis. « Tabernacle » conserve ici le terme consacré pour מִשְׁכָּן.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction conserve à la fois la réalité matérielle de la tente et la fonction de rencontre exprimée par מוֹעֵד.
- source_word: מִכְסֵהוּ
  choice: sa couverture
  rationale: Le suffixe renvoie naturellement à la tente de la rencontre, sans préciser davantage la nature de cette première couverture.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: la couverture de cuir[a]
  rationale: Le sens exact de תַּחַשׁ est incertain. « Cuir » communique prudemment qu’il s’agit d’une couverture faite de peau, sans identifier arbitrairement l’animal ni attribuer au matériau une qualité non exprimée.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: qui se trouve par-dessus
  rationale: Cette formulation française naturelle exprime la position supérieure de la couverture sans reproduire lourdement le redoublement spatial de l’hébreu.
- source_word: מָסַךְ פֶּתַח
  choice: le rideau de l’entrée
  rationale: Dans le contexte du sanctuaire, מָסָךְ désigne une tenture servant à fermer ou à masquer une entrée; « rideau » est clair et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’énumération du texte hébreu tout en évitant les répétitions spatiales peu naturelles. Le marqueur de note est placé immédiatement après « cuir », terme auquel il se rapporte.
