source:
  edition: WLC
  text: עַל פִּי֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו תִּהְיֶ֗ה כָּל עֲבֹדַת֙ בְּנֵ֣י הַ/גֵּרְשֻׁנִּ֔י לְ/כָל מַשָּׂאָ֔/ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/פְקַדְתֶּ֤ם עֲלֵ/הֶם֙ בְּ/מִשְׁמֶ֔רֶת אֵ֖ת כָּל מַשָּׂאָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: fr
  text: Tout le service des descendants de Guershon se fera sur l’ordre d’Aaron et de ses fils[a], dans tout ce qu’ils auront à transporter et dans tout leur service. Vous leur assignerez comme responsabilité[b] tout ce qu’ils auront à transporter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche d’Aaron et de ses fils ». Cette expression hébraïque signifie ici « selon leurs ordres » ou « selon leurs directives ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme charge ». Le terme hébreu désigne une tâche confiée dont on a la responsabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: sur l’ordre de
  rationale: L’expression signifie littéralement « sur la bouche de » et indique ici que le service s’accomplit selon les directives et sous l’autorité d’Aaron et de ses fils.
- source_word: תִּהְיֶה
  choice: se fera
  rationale: Dans cette prescription administrative, le futur français exprime naturellement la disposition imposée, sans recourir au « devra » plus explicitement modal.
- source_word: עֲבֹדַת
  choice: service
  rationale: Dans le contexte lévitique du sanctuaire, le terme désigne l’ensemble des tâches assignées; « service » garde à la fois le sens de travail et de fonction officielle.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: les descendants de Guershon
  rationale: La tournure hébraïque, littéralement « les fils du Guershonite », désigne ici le groupe familial issu de Guershon. « Descendants » est exact et naturel en français moderne.
- source_word: לְכָל מַשָּׂאָם וּלְכֹל עֲבֹדָתָם
  choice: qu’il s’agisse de tout ce qu’ils auront à transporter ou de tout autre service
  rationale: Les deux groupes en לְ précisent l’étendue de l’autorité exercée sur leurs transports et leur service. Cette formulation française rend la portée globale tout en évitant de suggérer que מַשָּׂא désigne seulement des charges matérielles déjà constituées. « Autre » explicite naturellement que le transport fait partie du service sans abolir la distinction hébraïque.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: vous leur assignerez
  rationale: Dans cette construction, פקד exprime l’attribution d’une responsabilité; le pluriel s’adresse naturellement à Aaron et à ses fils mentionnés immédiatement auparavant.
- source_word: בְּמִשְׁמֶרֶת
  choice: la responsabilité
  rationale: מִשְׁמֶרֶת peut désigner une charge confiée, une obligation à observer ou une responsabilité officielle. « Responsabilité » est clair et convient à l’assignation des objets à transporter.
- source_word: אֵת כָּל מַשָּׂאָם
  choice: de tout ce qu’ils auront à transporter
  rationale: Le syntagme est l’objet direct de l’assignation et désigne l’ensemble de leur charge de transport. Cette traduction concrète évite le sens figuré possible de « fardeaux ».
theological_decisions:
- issue: Portée de l’autorité d’Aaron et de ses fils
  choice: La traduction rattache le transport et l’ensemble du service à l’ordre d’Aaron et de ses fils.
  alternative: Comprendre les groupes en לְ comme une simple description des tâches plutôt que comme l’étendue de leur direction.
  rationale: La syntaxe permet une nuance de destination ou de portée, mais le contexte immédiat présente Aaron et ses fils comme responsables de diriger l’ensemble des tâches des Guershonites. La formulation retenue préserve cette portée sans développer une doctrine hiérarchique étrangère au verset.
translation_notes:
  register: Français international actuel, digne et accessible. Le futur conserve le caractère prescriptif du passage. « Descendants de Guershon » évite l’expression peu naturelle « fils du Guershonite ». La répétition relative au transport est maintenue, comme dans l’hébreu, tandis que la seconde occurrence de עֲבֹדָה est rendue par « autre service » afin de produire une phrase française claire.
