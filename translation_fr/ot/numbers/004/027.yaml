    text: 'Littéralement : « selon la bouche d’Aaron et de ses fils ». Cette expression hébraïque signifie ici « selon leurs ordres » ou « selon leurs directives ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme charge ». Le terme hébreu désigne une tâche confiée dont on a la responsabilité.'
    reason: lexical_alternative
  revision_rationale: 'La révision supprime l’ajout non exprimé « autre » et conserve explicitement les deux domaines parallèles du texte hébreu : ce qu’ils transportent et l’ensemble de leur service. « Comme responsabilité » rend naturellement la fonction de מִשְׁמֶרֶת dans la seconde proposition, sans modifier le sens administratif du verset.'
