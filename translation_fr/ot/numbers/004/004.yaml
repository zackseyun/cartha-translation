source:
  edition: WLC
  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: fr
  text: 'Voici le service des fils de Qehath dans la tente de la rencontre : il concerne les choses très saintes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Saint des saints » ou « le lieu très saint ». Ici, l’expression désigne probablement les objets les plus sacrés plutôt que seulement le sanctuaire intérieur.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: Voici
  rationale: Le démonstratif féminin singulier introduit et présente la fonction qui va être décrite; « Voici » rend naturellement cette valeur en français.
- source_word: עֲבֹדַת
  choice: le service
  rationale: Dans ce contexte cultuel, עֲבֹדָה désigne la tâche sacrée assignée aux Qehathites; « service » en conserve la portée officielle et religieuse.
- source_word: בְּנֵי קְהָת
  choice: les fils de Qehath
  rationale: Cette formulation conserve l’expression généalogique hébraïque tout en restant claire en français.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: La préposition ב situe leur service dans la sphère de la tente; « tente de la rencontre » rend le nom hébreu de manière transparente et naturelle.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: les choses très saintes
  rationale: Le contexte immédiat porte sur les objets sacrés confiés aux Qehathites. Le pluriel explicatif français exprime ce référent probable sans effacer l’autre lecture possible de l’expression hébraïque.
theological_decisions:
- issue: Référent de קֹדֶשׁ הַקֳּדָשִׁים
  choice: Les objets ou choses les plus sacrés confiés aux Qehathites
  alternative: Le lieu très saint, c’est-à-dire le Saint des saints
  rationale: La suite de Nombres 4 décrit l’emballage et le transport du mobilier sacré. Le sens objectal convient donc probablement mieux ici, mais la note préserve l’ambiguïté réelle de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. La segmentation en deux propositions évite une apposition ambiguë et rend explicite le lien implicite entre le service et les objets très saints.
