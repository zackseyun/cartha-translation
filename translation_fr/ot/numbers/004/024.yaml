  text: זֹ֣את עֲבֹדַ֔ת מִשְׁפְּחֹ֖ת הַ/גֵּרְשֻׁנִּ֑י לַ/עֲבֹ֖ד וּ/לְ/מַשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: fr
  text: 'Voici le service des familles des Guershonites : servir et porter des charges[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « servir et porter des fardeaux ».'
    reason: Alternative lexicale pour מַשָּׂא, qui peut désigner une charge, un fardeau ou le fait de porter.
lexical_decisions:
- source_word: זֹאת
  choice: Voici
  rationale: Le démonstratif féminin singulier introduit une définition du service; « Voici » rend naturellement en français la proposition nominale hébraïque dont la copule est sous-entendue.
- source_word: עֲבֹדַת
  choice: le service
  rationale: עֲבֹדָה peut désigner le service, le travail ou la tâche. « Service » convient au contexte des fonctions lévitiques sans les réduire à un simple travail manuel.
- source_word: מִשְׁפְּחֹת
  choice: des familles
  rationale: Le pluriel construit désigne les groupes familiaux composant les Guershonites. « Familles » est transparent et proche de la forme hébraïque; « clans » serait également possible.
- source_word: הַגֵּרְשֻׁנִּי
  choice: des Guershonites
  rationale: Le gentilé singulier à valeur collective désigne les descendants de Guershon. Le pluriel français s’accorde naturellement avec « familles ».
- source_word: לַעֲבֹד
  choice: servir
  rationale: L’infinitif construit avec ל indique ici la fonction ou la tâche. « Servir » conserve la répétition de sens avec « service », présente également en hébreu.
- source_word: וּלְמַשָּׂא
  choice: et porter des charges
  rationale: מַשָּׂא désigne ce qui est porté, une charge ou le fait de porter. « Porter des charges » exprime clairement la tâche concrète dans un français actuel, tout en conservant le sens du terme.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la répétition « service / servir » du texte hébreu et explicite sobrement l’objet de « porter » pour obtenir une phrase naturelle.
