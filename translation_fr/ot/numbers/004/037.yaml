source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: fr
  text: Tels furent les hommes recensés parmi les familles des Qehatites, tous ceux qui accomplissaient leur service dans la tente de la Rencontre, que Moïse et Aaron recensèrent sur l’ordre de Yahweh, par l’intermédiaire de Moïse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur l’ordre de Yahweh, par la main de Moïse »; ou : « par l’intermédiaire de Moïse ».'
    reason: L’hébreu בְּיַד מֹשֶׁה est une expression d’agence ou de médiation. La note donne l’image littérale tout en signalant une formulation française idiomatique.
lexical_decisions:
- source_word: פְקוּדֵי
  choice: les hommes recensés
  rationale: Dans ce contexte de recensement des Lévites aptes au service, le terme désigne les personnes dénombrées; cette formulation explicite naturellement en français qu’il s’agit d’hommes.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: les familles des Qehatites
  rationale: מִשְׁפָּחָה désigne ici les groupes familiaux ou clans; « familles » reste clair et courant, tandis que « Qehatites » exprime collectivement les descendants de Qehath.
- source_word: כָּל הָעֹבֵד
  choice: tous ceux qui accomplissaient leur service
  rationale: Le participe עֹבֵד décrit les personnes engagées dans le service; l’imparfait français convient au cadre narratif du recensement.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: La préposition בְּ indique le lieu ou la sphère du service. « Tente de la rencontre » rend le lieu où Dieu rencontre son peuple sans réduire מוֹעֵד à une simple réunion humaine.
- source_word: אֲשֶׁר פָּקַד
  choice: que Moïse et Aaron recensèrent
  rationale: פקד reprend ici le sens de dénombrer dans un recensement, et le relatif se rapporte aux hommes recensés.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: L’expression idiomatique signifie littéralement « selon la bouche de Yahweh » et désigne son commandement ou son ordre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּיַד מֹשֶׁה
  choice: transmis par l’intermédiaire de Moïse
  rationale: L’expression idiomatique marque ici la médiation de Moïse. La note conserve aussi la possibilité d’une traduction formellement plus proche de l’image hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre traditionnel.
- issue: Rapport entre l’ordre de Yahweh et la médiation de Moïse
  choice: sur l’ordre de Yahweh, transmis par l’intermédiaire de Moïse
  alternative: sur l’ordre de Yahweh, par la main de Moïse
  rationale: La formulation distingue l’autorité divine de sa transmission par Moïse tout en préservant, dans la note, l’image hébraïque et son ambiguïté d’agence.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au compte rendu formel du recensement; « accomplissaient leur service » garde la dimension cultuelle du verbe sans technicité excessive.
