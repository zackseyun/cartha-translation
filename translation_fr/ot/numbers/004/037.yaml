revisions:
- from: Tels furent les hommes recensés parmi les familles des Qehatites, tous ceux qui accomplissaient leur service dans la tente de la rencontre, que Moïse et Aaron recensèrent sur l’ordre de Yahweh, transmis par l’intermédiaire de Moïse.[a]
  to: Tels furent les hommes recensés parmi les familles des Qehatites, tous ceux qui accomplissaient leur service dans la tente de la Rencontre, que Moïse et Aaron recensèrent sur l’ordre de Yahweh, par l’intermédiaire de Moïse.[a]
  rationale: La révision supprime seulement l’ajout interprétatif « transmis ». Elle conserve le sens d’une action accomplie sur l’ordre de Yahweh avec Moïse comme médiateur ou agent, conformément à l’ambiguïté fonctionnelle de בְּיַד מֹשֶׁה. La majuscule à « Rencontre » marque la désignation du sanctuaire.
