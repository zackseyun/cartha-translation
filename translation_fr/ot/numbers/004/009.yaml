- from: Ils prendront ensuite une étoffe bleu pourpre[a] et en couvriront le porte-lampes destiné à l’éclairage, ainsi que ses lampes, ses pincettes, ses pelles à braises et tous les récipients pour son huile avec lesquels on en assure le service.
  to: Ils prendront ensuite une étoffe bleu-pourpre[a] et en couvriront le porte-lampes destiné à l’éclairage, ainsi que ses lampes, ses pincettes, ses plats à cendres et tous les récipients pour son huile avec lesquels on en assure le service.
