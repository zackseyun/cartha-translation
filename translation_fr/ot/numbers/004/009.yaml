  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: fr
  text: Ils prendront ensuite une étoffe bleu-pourpre[a] et en couvriront le porte-lampes destiné à l’éclairage, ainsi que ses lampes, ses pincettes, ses plats à cendres et tous les récipients pour son huile avec lesquels on en assure le service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une étoffe bleue ». Le mot hébreu תְּכֵלֶת désigne la couleur distinctive, allant du bleu au bleu-pourpre, des étoffes du sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: une étoffe bleu pourpre
  rationale: בֶּגֶד désigne ici une étoffe plutôt qu’un vêtement. תְּכֵלֶת est la matière teinte caractéristique des textiles du sanctuaire; « bleu pourpre » en signale la nuance sans employer un terme technique peu courant.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: le porte-lampes destiné à l’éclairage
  rationale: מְנוֹרָה est le support portant les lampes, et הַמָּאוֹר exprime ici naturellement sa fonction d’éclairage. Cette formulation évite le calque peu idiomatique « porte-lampes de la lumière ».
- source_word: נֵרֹתֶיהָ
  choice: ses lampes
  rationale: נֵר désigne les lampes individuelles placées sur le porte-lampes; « lampes » est précis et naturel.
- source_word: מַלְקָחֶיהָ
  choice: ses pincettes
  rationale: Le mot désigne l’instrument servant à saisir ou à ajuster les mèches. « Pincettes » convient mieux en français courant que le terme général « tenailles ».
- source_word: מַחְתֹּתֶיהָ
  choice: ses pelles à braises
  rationale: מַחְתָּה peut désigner une pelle ou un récipient pour les braises. Dans le contexte de l’entretien des lampes, « pelles à braises » est préférable à « encensoirs », qui suggérerait à tort un usage pour l’encens.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: tous les récipients pour son huile
  rationale: כְּלִים désigne ici l’ensemble des récipients ou ustensiles associés à l’huile du porte-lampes. La formulation française reste concrète tout en conservant le suffixe possessif.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: avec lesquels on en assure le service
  rationale: שׁרת appartient au vocabulaire du service cultuel. Le sujet pluriel indéterminé est rendu par « on », tandis que « avec lesquels » conserve la valeur instrumentale de בָּהֶם et « en » renvoie au porte-lampes.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. « Porte-lampes » évite que « chandelier » évoque des bougies, étrangères au contexte; « assurer le service » maintient la nuance cultuelle sans tournure archaïque.
