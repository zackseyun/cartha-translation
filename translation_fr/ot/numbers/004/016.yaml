  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: fr
  text: Éléazar, fils du prêtre Aaron, aura la responsabilité[a] de l’huile destinée au luminaire[b], de l’encens aromatique, de l’offrande régulière de céréales[c] et de l’huile d’onction. Il sera aussi responsable de tout le tabernacle et de tout ce qui s’y trouve, dans le sanctuaire et pour ses ustensiles[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi se traduire par « charge » ou « surveillance » ; il désigne une responsabilité confiée.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’huile du luminaire » ou « l’huile de la lumière ».'
    reason: literal_rendering
  - marker: c
    text: 'Ou : « l’offrande perpétuelle de céréales ». Le terme hébreu exprime la régularité ou la continuité.'
    reason: lexical_alternative
  - marker: d
    text: 'La fin du verset est elliptique et peut aussi se comprendre comme une précision appositionnelle : « le sanctuaire et ses ustensiles ». Littéralement, les prépositions permettent « dans le lieu saint et avec ses ustensiles ». Le mot rendu par « ustensiles » peut aussi désigner des récipients, des objets ou du matériel.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: פְקֻדַּת
  choice: la responsabilité
  rationale: Le nom désigne ici une charge confiée, comportant surveillance et responsabilité. Cette formulation est naturelle en français et convient au contexte sacerdotal.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: l’huile destinée au luminaire
  rationale: La construction signifie littéralement « l’huile du luminaire/de la lumière » et désigne l’huile servant à l’éclairage du sanctuaire, sans préciser davantage le dispositif.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: l’encens aromatique
  rationale: Le complément évoque les substances odorantes entrant dans la composition de l’encens. « Aromatique » restitue naturellement cette idée.
- source_word: מִנְחַת הַתָּמִיד
  choice: l’offrande régulière de céréales
  rationale: מִנְחָה désigne ici une offrande de céréales, et תָּמִיד sa présentation constante ou régulière. « Régulière » évite de préciser « quotidienne » au-delà du terme hébreu.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Expression française consacrée et exacte pour l’huile employée lors de l’onction.
- source_word: כָּל הַמִּשְׁכָּן
  choice: tout le tabernacle
  rationale: Dans ce contexte, מִשְׁכָּן désigne le tabernacle; « tout » conserve la portée globale de כָּל.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: et de tout ce qui s’y trouve
  rationale: Rendu direct et idiomatique de la proposition relative hébraïque.
- source_word: בְּקֹדֶשׁ וּבְכֵלָיו
  choice: du sanctuaire et de ses objets
  rationale: La fin du verset précise la responsabilité relative au domaine sacré et à son matériel. « Objets » garde une portée assez large pour כֵּלִים, qui peut désigner récipients, ustensiles ou équipements.
theological_decisions:
- issue: Fonction des deux occurrences de פְקֻדַּת dans une phrase nominale
  choice: Deux propositions françaises avec « aura la responsabilité », la seconde récapitulant et élargissant la première
  alternative: 'Conserver une seule phrase nominale et traiter la seconde occurrence comme une apposition : « … l’huile d’onction — la responsabilité de tout le tabernacle… »'
  rationale: L’hébreu est elliptique et appositionnel. Deux propositions rendent le sens intelligible sans faire de la seconde occurrence une responsabilité théologiquement distincte; elles maintiennent l’idée d’une charge confiée à Éléazar.
- issue: Rapport syntaxique de בְּקֹדֶשׁ וּבְכֵלָיו avec ce qui précède
  choice: Le comprendre comme une précision appositionnelle portant sur le sanctuaire et son matériel
  alternative: 'Le rendre strictement comme une indication de lieu : « dans le sanctuaire et parmi ses objets »'
  rationale: Les prépositions בְּ permettent un rendu locatif, mais le contexte de la charge confiée et l’ellipse hébraïque autorisent aussi une relation de domaine. La note conserve l’autre analyse sans trancher excessivement.
translation_notes:
  register: Français international moderne, digne et accessible. « Tabernacle », « encens », « offrande » et « onction » conservent le vocabulaire cultuel nécessaire; la structure en deux phrases évite une lourde phrase nominale tout en préservant la reprise de la responsabilité d’Éléazar.
