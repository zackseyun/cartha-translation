  text: Ceux d’entre eux qui furent recensés, selon leurs clans, étaient au nombre de trois mille deux cents.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient au nombre de
  rationale: Dans cette formule de recensement, le verbe היה introduit naturellement le total. « Étaient au nombre de » rend la tournure avec clarté en français courant et maintient la continuité du récit.
- source_word: פְקֻדֵיהֶם
  choice: ceux d’entre eux qui furent recensés
  rationale: Dans ce contexte de dénombrement, le terme désigne les personnes comptées ou enregistrées. Cette formulation conserve le lien exprimé par le suffixe « d’entre eux » sans ajouter ici le mot « hommes », absent de ce verset.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision familiale ou clanique au sein de la tribu. « Clans » convient à l’organisation sociale décrite dans Nombres, tandis que « selon » reproduit la valeur distributive de la préposition.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: trois mille deux cents
  rationale: Il s’agit du total cardinal exact. La formulation suit l’usage numérique naturel du français moderne.
