  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: fr
  text: âgés de trente ans et plus, jusqu’à cinquante ans, tous ceux qui se présentaient pour le service[a] afin d’accomplir le travail dans la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « service » peut désigner un service organisé ou l’accomplissement de fonctions assignées.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: âgés de trente à cinquante ans
  rationale: Cette formulation française naturelle exprime clairement les limites d’âge indiquées par l’hébreu, de trente ans et au-dessus jusqu’à cinquante ans.
- source_word: כָּל הַבָּא
  choice: tous ceux qui se présentaient
  rationale: Le participe de בוא désigne tous ceux qui venaient ou entraient dans la catégorie recensée. « Se présentaient » conserve l’idée de venir prendre sa place tout en étant idiomatique dans un contexte de service organisé.
- source_word: לַצָּבָא
  choice: pour le service
  rationale: Dans ce contexte lévitique, צָבָא désigne un service organisé ou une période de fonctions, non une activité guerrière. « Service » évite une connotation militaire excessive.
- source_word: לַעֲבֹדָה
  choice: afin d’accomplir le travail
  rationale: עֲבֹדָה désigne ici le travail assigné. Cette formulation le distingue du service organisé exprimé par צָבָא sans employer le terme ecclésiastique « ministère ».
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Rendu transparent de la désignation hébraïque du sanctuaire mobile; « dans » présente la tente comme la sphère de leur activité.
theological_decisions:
- issue: Nature du צָבָא lévitique
  choice: service
  alternative: armée / service militaire
  rationale: Le contexte porte sur les fonctions cultuelles des Lévites. Le terme garde l’idée d’une organisation structurée, sans transformer leur travail en activité guerrière.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « se présentaient pour le service » conserve le mouvement exprimé par בוא tout en rendant naturellement l’entrée dans un service structuré. Le marqueur [a] est placé immédiatement après le terme qu’il explique.
