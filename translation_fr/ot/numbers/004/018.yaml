  yaml_path: translation/ot/numbers/004/018.yaml
  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: fr
  text: Ne retranchez pas du milieu des Lévites la tribu des familles qehatites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne détruisez pas du milieu des Lévites le clan des familles qehatites. » Le verbe hébreu peut signifier « retrancher » ou « détruire », et « familles » peut aussi se traduire par « clans ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Ne… pas
  rationale: La particule négative introduit ici une interdiction directe; cette tournure rend naturellement sa force en français moderne.
- source_word: תַּכְרִיתוּ
  choice: retranchez
  rationale: Le hiphil de כרת signifie ici « faire disparaître, retrancher, détruire ». « Retrancher » conserve l’image hébraïque et la portée générale de l’avertissement sans préciser indûment le mécanisme.
- source_word: שֵׁבֶט
  choice: tribu
  rationale: Dans ce contexte généalogique, le terme désigne un groupe tribal; « tribu » en est l’équivalent français traditionnel et intelligible.
- source_word: מִשְׁפְּחֹת
  choice: familles
  rationale: Le pluriel construit désigne les groupes familiaux de la lignée qehatite. « Familles » est transparent, tandis que « clans » demeure une possibilité.
- source_word: הַקְּהָתִי
  choice: des Qehatites
  rationale: L’adjectif gentilice singulier a un sens collectif. Le pluriel français exprime naturellement l’ensemble des descendants de Qehath.
- source_word: מִתּוֹךְ
  choice: du milieu de
  rationale: Cette expression marque le retrait ou la disparition depuis l’intérieur d’un groupe plus vaste et reproduit fidèlement la relation spatiale et collective du texte.
- source_word: הַלְוִיִּם
  choice: des Lévites
  rationale: Désignation française usuelle du groupe dont les Qehatites font partie.
theological_decisions:
- issue: Portée de l’interdiction concernant le sort des Qehatites
  choice: Un avertissement à ne pas faire retrancher le groupe familial qehatite du milieu des Lévites.
  alternative: Un ordre général de ne pas détruire le clan qehatite.
  rationale: Le verset formule l’interdiction sans en préciser le mécanisme. Le contexte évoque le danger mortel lié au service des objets saints, mais la traduction garde volontairement la formulation large du texte hébreu.
translation_notes:
  register: Français international moderne, digne et direct. « Retrancher » conserve l’image et l’ambiguïté du verbe hébreu; la note fournit les principales variantes lexicales sans introduire l’explication contextuelle dans le verset.
