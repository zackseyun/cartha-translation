  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: fr
  text: à partir de trente ans, jusqu’à l’âge de cinquante ans, tous ceux qui entrent en service[a] pour accomplir le travail dans la tente de la rencontre —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ceux qui se présentent pour le service, pour le travail dans la tente de la rencontre »; le terme traduit par « service » peut désigner un corps organisé ou une fonction assignée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de trente ans et au-delà
  rationale: Cette formulation naturelle en français exprime la limite d’âge inférieure tout en conservant l’idée littérale de progression vers le haut.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: jusqu’à l’âge de cinquante ans
  rationale: La traduction indique clairement la limite supérieure de la tranche d’âge.
- source_word: כָּל הַבָּא
  choice: tous ceux qui entraient
  rationale: Le participe de בוא désigne ceux qui viennent ou entrent; dans ce contexte de recensement en vue d’une fonction, « entraient » rend naturellement l’admission au service.
- source_word: לַצָּבָא
  choice: en service
  rationale: צבא peut désigner une armée ou un corps organisé, mais il renvoie ici au service structuré des Lévites plutôt qu’à une activité militaire.
- source_word: לַעֲבֹדָה
  choice: pour accomplir le travail
  rationale: עֲבֹדָה désigne le travail ou le service. « accomplir le travail » le distingue du terme précédent צבא sans effacer le lien entre les deux expressions.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Cette désignation usuelle du sanctuaire mobile respecte la préposition ב et le sens de מוֹעֵד comme rencontre assignée.
