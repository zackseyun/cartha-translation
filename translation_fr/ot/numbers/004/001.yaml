source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר introduit une prise de parole dans le récit. « Parla » rend directement le verbe et convient au registre soutenu mais courant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: La préposition אֶל désigne les destinataires de la parole. Le français naturel coordonne les deux noms sous un même « à », sans perte de sens.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule hébraïque introduit le contenu du discours. « En ces termes : » est une tournure française naturelle qui évite le calque pesant « en disant ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre ni adopter la forme hybride traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère solennel de l’adresse divine tout en employant l’idiome naturel « en ces termes » pour introduire la parole qui suit.
