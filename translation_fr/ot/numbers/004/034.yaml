  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: fr
  text: Moïse, Aaron et les responsables de la communauté recensèrent les descendants de Qehath[a][b], selon leurs clans et leurs maisons ancestrales[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dénombrèrent ». Le verbe hébreu peut aussi signifier « nommer » dans d’autres contextes, mais il désigne ici un recensement en vue du service.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils du Qehatite », c’est-à-dire le groupe familial descendant de Qehath.
    reason: lexical_alternative
  - marker: c
    text: Les « maisons ancestrales » étaient des unités de parenté ou des divisions familiales traditionnelles en Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: recensèrent
  rationale: Dans ce contexte de dénombrement en vue du service, פקד signifie recenser ou dénombrer, non nommer à une fonction. « Recensèrent » est précis et naturel en français.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: les responsables de la communauté
  rationale: נְשִׂיאִים désigne ici les dirigeants reconnus de la communauté. « Responsables » exprime leur fonction sans connotation monarchique, et « communauté » rend naturellement עֵדָה dans ce contexte.
- source_word: בְּנֵי הַקְּהָתִי
  choice: les fils des Qehatites
  rationale: Cette formulation conserve l’expression généalogique explicite בְּנֵי tout en désignant le groupe issu de Qehath. Une note explicite l’idiome.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision de parenté dans l’organisation d’Israël; « clan » convient mieux que le terme plus général « famille ».
- source_word: וּלְבֵית אֲבֹתָם
  choice: et leurs maisons ancestrales
  rationale: בֵית אָבוֹת est une expression sociale et généalogique technique. « Maisons ancestrales » demeure proche du sens tout en étant plus intelligible en français moderne que le calque « maisons de leurs pères ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit. « Qehatites » suit une translittération française transparente; « responsables de la communauté » évite l’archaïsme de « princes de l’assemblée ». Les trois marqueurs de note figurent dans le texte.
