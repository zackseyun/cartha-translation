    issue: « les fils des Qehatites »
    rationale: Cette formulation signifie normalement les fils de plusieurs Qehatites. Le texte hébreu emploie un singulier collectif/adjectival (« du Qehatite ») et désigne le groupe issu de Qehath. « Descendants de Qehath » rend l’idiome sans ajouter ce pluriel génitif.
  - severity: low
    issue: 'Note b : « les fils du Qehatite » et « descendant de Qehath »'
    rationale: La note actuelle explique utilement l’idiome, mais son lien avec le texte principal est moins net puisque celui-ci parle de « Qehatites ». La révision aligne le nom de l’ancêtre dans le texte et dans la note.
