  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: fr
  text: Voici le service des clans des fils de Merari pour l’ensemble de leur service dans la tente de la rencontre, sous la direction d’Itamar, fils d’Aaron, le prêtre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main d’Itamar » ; expression hébraïque indiquant ici sa supervision ou sa direction administrative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Tel est le service
  rationale: Le démonstratif féminin introduit un énoncé récapitulatif. « Tel est » donne en français une formulation naturelle et digne, tandis que « service » convient aux fonctions cultuelles assignées.
- source_word: מִשְׁפְּחֹת
  choice: des clans
  rationale: Dans le cadre tribal et généalogique, le terme désigne les subdivisions d’une tribu plutôt que de simples familles nucléaires.
- source_word: בְּנֵי מְרָרִי
  choice: des fils de Merari
  rationale: La formulation généalogique hébraïque est conservée; « clans » indique déjà qu’il s’agit collectivement de la lignée de Merari.
- source_word: לְכָל עֲבֹדָתָם
  choice: pour tout leur service
  rationale: La préposition marque ici la relation à l’ensemble des tâches assignées. La répétition de « service » reflète celle du nom עֲבֹדָה dans l’hébreu.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Cette traduction rend la préposition בְּ et le nom traditionnel du sanctuaire mobile, tout en restant compréhensible en français moderne.
- source_word: בְּיַד
  choice: sous la direction de
  rationale: Littéralement « par la main de », l’expression idiomatique indique ici l’encadrement ou la supervision administrative d’Itamar.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Itamar, fils du prêtre Aaron
  rationale: Cette syntaxe française rattache sans ambiguïté le titre de prêtre à Aaron, conformément à la construction hébraïque, et translittère le nom אִיתָמָר sous sa forme française usuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « service » est volontaire afin de reproduire la structure hébraïque. « Tente de la rencontre » est retenu comme désignation transparente du sanctuaire. Le marqueur de note est placé après le segment qu’il explique.
