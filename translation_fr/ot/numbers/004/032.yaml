revisions:
- from: ainsi que les poteaux qui entourent la cour, avec leurs socles, leurs piquets et leurs cordages, tout leur matériel et tout le travail qui s’y rapporte. Vous attribuerez nominativement les objets dont ils auront la garde pour leur transport.[a]
  to: ainsi que les poteaux qui entourent la cour, avec leurs socles, leurs piquets et leurs cordages, tout leur matériel et tout leur service. Vous attribuerez nominativement les objets relevant de leur charge de transport.[a]
  rationale: La révision remplace deux formulations qui obscurcissaient légèrement les responsabilités de service et de portage. Elle maintient le caractère condensé de la dernière expression hébraïque dans le texte principal et conserve en note l’explicitation contextuelle, sans la présenter comme la seule lecture possible.
