base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: fr
  text: ainsi que les poteaux qui entourent la cour, avec leurs socles, leurs piquets et leurs cordages, tout leur matériel et tout leur service. Vous attribuerez nominativement les objets relevant de leur charge de transport.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, plus fluide : « Vous attribuerez nominativement à chacun le matériel qu’il sera chargé de transporter. »'
    reason: La phrase hébraïque כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם est très condensée. Cette traduction explicite le sens probable dans le contexte de la répartition individuelle des charges.
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: les poteaux qui entourent la cour
  rationale: עַמּוּדִים désigne ici les éléments verticaux de la clôture de la cour. « Poteaux » convient mieux que « colonnes » à cette fonction, tandis que la relative rend naturellement la valeur de סָבִיב.
- source_word: אַדְנֵיהֶם
  choice: leurs socles
  rationale: Dans le contexte du sanctuaire, אֶדֶן est la pièce de base dans laquelle prend place un élément vertical. « Socles » est précis et courant en français.
- source_word: יְתֵדֹתָם
  choice: leurs piquets
  rationale: יָתֵד désigne un piquet servant à fixer une structure de tente. « Piquets » s’accorde naturellement avec les cordages.
- source_word: מֵיתְרֵיהֶם
  choice: leurs cordages
  rationale: מֵיתָר désigne les cordes qui maintiennent une tente ou une clôture. « Cordages » exprime ici l’ensemble de ces cordes de fixation.
- source_word: לְכָל כְּלֵיהֶם
  choice: tout leur matériel
  rationale: כְּלִים est un terme large couvrant objets, ustensiles et équipement. Ici, « matériel » convient aux accessoires associés à la structure de la cour.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: tout le travail qui s’y rapporte
  rationale: עֲבֹדָה peut désigner service, tâche ou travail. Cette formulation naturelle conserve l’idée de l’ensemble des opérations liées à ce matériel.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: Vous attribuerez nominativement
  rationale: Avec בְשֵׁמֹת, פקד indique ici une attribution individualisée plutôt qu’un simple dénombrement. « Nominativement » exprime de façon concise l’assignation par nom.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: les objets dont ils auront la garde pour leur transport
  rationale: 'La formulation conserve les trois notions imbriquées du texte hébreu : les objets (כְּלֵי), la responsabilité ou garde (מִשְׁמֶרֶת) et le transport de la charge (מַשָּׂא), sans imposer dans le corps du texte une explicitation individuelle absente de cette expression même.'
