  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: fr
  text: Ils la mettront, avec tous ses ustensiles, dans une enveloppe de cuir de taḥash[a], puis ils la placeront sur la barre de transport.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens du mot hébreu תַּחַשׁ (taḥash) est incertain : il peut désigner la peau d’un animal particulier ou un type de cuir résistant. Des traductions traditionnelles proposent notamment « peau de dauphin » ou des identifications semblables.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: ils mettront
  rationale: Dans cette suite d’instructions, le parfait avec waw exprime l’étape suivante de la procédure. « Mettront » rend naturellement l’action d’envelopper ou d’introduire l’objet dans sa couverture.
- source_word: אֹתָהּ
  choice: la
  rationale: Le pronom féminin singulier renvoie au porte-lampes mentionné au verset précédent. Le pronom français conserve cette reprise sans répéter le nom.
- source_word: כָּל כֵּלֶיהָ
  choice: tous ses ustensiles
  rationale: כֵּלִים désigne ici les objets ou accessoires servant avec le porte-lampes. « Ustensiles » est concret, courant et adapté au contexte cultuel.
- source_word: אֶל מִכְסֵה
  choice: dans une couverture
  rationale: Après נתן, אֶל peut marquer le placement à l’intérieur ou sous une enveloppe. « Dans une couverture » exprime clairement que l’ensemble est enveloppé.
- source_word: עוֹר תַּחַשׁ
  choice: cuir fin
  rationale: L’identification de תַּחַשׁ demeure incertaine. « Cuir fin » évite une identification animale conjecturale tout en désignant une peau travaillée servant de protection; l’incertitude est signalée en note.
- source_word: וְנָתְנוּ
  choice: ils placeront
  rationale: À sa seconde occurrence, le même verbe introduit l’étape consistant à disposer l’objet enveloppé sur son support de transport. « Placeront » convient à ce positionnement.
- source_word: עַל הַמּוֹט
  choice: sur la barre de transport
  rationale: מוֹט désigne une barre ou une perche servant au portage. Le singulier hébreu est conservé, et « de transport » explicite sa fonction sans imposer l’idée plus développée d’un cadre.
