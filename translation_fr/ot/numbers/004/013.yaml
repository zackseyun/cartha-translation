  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: fr
  text: Ils enlèveront les cendres de l’autel, puis étendront dessus une étoffe pourpre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils purifieront l’autel » ou « ils enlèveront de l’autel les cendres grasses ». Le verbe hébreu désigne ici l’enlèvement des résidus de cendre produits par les sacrifices.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: Ils enlèveront les cendres
  rationale: Au piel, דשׁן désigne ici l’enlèvement des résidus de cendre, notamment graisseux, produits par les sacrifices. Cette formulation est naturelle en français et précise l’action cultuelle.
- source_word: הַמִּזְבֵּחַ
  choice: de l’autel
  rationale: « Autel » est l’équivalent français usuel de מִזְבֵּחַ dans le contexte du sanctuaire.
- source_word: וּפָרְשׂוּ
  choice: puis étendront
  rationale: פרשׂ exprime le fait de déployer ou d’étendre quelque chose. « Étendre » convient naturellement à la pose d’une étoffe sur l’autel; « puis » rend la succession des gestes portée ici par ו.
- source_word: עָלָיו
  choice: dessus
  rationale: עַל avec suffixe renvoie à l’autel et indique que l’étoffe est placée sur celui-ci. « Dessus » évite une répétition lourde tout en restant clair.
- source_word: בֶּגֶד
  choice: une étoffe
  rationale: Bien que בֶּגֶד puisse désigner un vêtement, il s’agit ici d’une pièce textile servant de couverture. « Étoffe » est idiomatique dans ce contexte.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: אַרְגָּמָן désigne une matière teinte en pourpre. Avec « étoffe », l’adjectif « pourpre » transmet le sens sans précision injustifiée.
