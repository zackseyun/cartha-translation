    issue: « Depuis l’âge de trente ans » pour une tranche d’âge
    rationale: « Depuis » suggère une durée qui se poursuit à partir d’un moment donné. Le texte hébreu fixe ici les bornes d’une catégorie de recensement ; « de trente à cinquante ans » est l’équivalent idiomatique approprié.
  - severity: low
    issue: Possessif ajouté dans « prendre leur service »
    rationale: Le texte ne comporte pas de possessif. Une formulation impersonnelle telle que « accomplir le service » rend plus directement l’expression tout en conservant son sens de service organisé.
  - severity: low
    issue: « tente sacrée » dans la note
    rationale: Cette expression explicative ajoute un qualificatif absent de la désignation citée. Il est préférable de reprendre « tente de la Rencontre ».
