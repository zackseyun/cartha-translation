  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקֹ֣ד אוֹתָ֑/ם כָּל הַ/בָּא֙ לִ/צְבֹ֣א צָבָ֔א לַ/עֲבֹ֥ד עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: fr
  text: 'De trente à cinquante ans, tu les recenseras : tous ceux qui se présentent pour accomplir le service, pour effectuer le travail dans la tente de la Rencontre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « accomplir leur devoir » ; l’expression hébraïque emploie le vocabulaire du service militaire au sens figuré pour désigner le service organisé à la tente de la Rencontre.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: Depuis l’âge de trente ans jusqu’à l’âge de cinquante ans
  rationale: Cette formulation française naturelle rend l’idiome hébreu de la tranche d’âge, y compris וָמַעְלָה, sans reproduire littéralement « fils de ».
- source_word: תִּפְקֹד אֹתָם
  choice: tu les recenseras
  rationale: Dans ce contexte de dénombrement administratif, פקד désigne l’action de compter ou d’inscrire; « recenser » exprime précisément cette opération.
- source_word: כָּל הַבָּא
  choice: tous ceux qui viennent
  rationale: Le participe substantivé précédé de כָּל désigne collectivement l’ensemble des hommes qui se présentent pour la fonction.
- source_word: לִצְבֹא צָבָא
  choice: prendre leur service
  rationale: La construction apparentée à צבא évoque l’entrée dans un service organisé. Cette expression française conserve l’idée d’affectation au devoir sans suggérer un combat littéral.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: pour accomplir leur travail
  rationale: Le verbe et le nom de même racine soulignent l’exécution du travail assigné; cette formulation rend le sens avec naturel tout en maintenant le second membre parallèle.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Cette traduction conserve le sens du lieu sacré où a lieu la rencontre fixée, sans ajouter d’interprétation.
theological_decisions:
- issue: Faut-il rendre צבא par un vocabulaire militaire explicite ?
  choice: prendre leur service
  alternative: accomplir un service militaire / partir en campagne
  rationale: Dans Nombres 4, il s’agit des fonctions cultuelles des Lévites, non d’un combat. La traduction garde la notion de service organisé attachée à צבא, tandis que la note signale sa coloration militaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Tente de la rencontre » est retenu comme désignation transparente de אֹהֶל מוֹעֵד. Le futur injonctif « tu les recenseras » correspond au commandement adressé à Moïse.
