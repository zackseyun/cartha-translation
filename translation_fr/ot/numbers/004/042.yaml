lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: Quant aux hommes recensés
  rationale: Le participe passif substantivé désigne ici les personnes soumises au recensement; « hommes » est explicité d’après le contexte immédiat de ce recensement lévitique.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: parmi les clans des descendants de Merari
  rationale: מִשְׁפְּחֹת désigne les clans; בְּנֵי peut naturellement désigner les descendants, et « parmi » rend la relation du recensement aux clans sans lourdeur.
- source_word: לְמִשְׁפְּחֹתָם
  choice: clan par clan
  rationale: Rend la répartition classificatoire du לְ hébreu dans un français naturel.
- source_word: לְבֵית אֲבֹתָם
  choice: famille paternelle par famille paternelle
  rationale: בֵּית אָבוֹת est une unité de parenté fondée sur les lignées paternelles; cette formulation garde la distinction avec « clans ».
