  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: fr
  text: Faites le recensement des fils de Qehath parmi les fils de Lévi[a], selon leurs clans, selon leurs maisons paternelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Relevez la tête des fils de Qehath parmi les fils de Lévi » ; il s’agit d’une expression hébraïque signifiant les compter ou en faire le recensement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Faites le recensement
  rationale: L’expression signifie littéralement « relever la tête », mais, dans ce contexte administratif, elle désigne l’action de compter officiellement un groupe. « Faites le recensement » en transmet clairement le sens en français moderne.
- source_word: בְּנֵי קְהָת
  choice: les fils de Qehath
  rationale: Cette formulation conserve la tournure généalogique de l’hébreu et reste naturelle dans le registre biblique français.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: parmi les fils de Lévi
  rationale: מִתּוֹךְ indique que ce groupe est recensé au sein de l’ensemble plus large des descendants de Lévi. « Parmi » exprime cette relation avec concision.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans les recensements tribaux, מִשְׁפָּחָה désigne une subdivision de la tribu, que « clan » rend avec précision.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs familles paternelles
  rationale: L’expression hébraïque désigne les unités de parenté structurées selon la lignée paternelle. Cette traduction évite l’expression peu naturelle « maisons de leurs pères » tout en préservant l’organisation sociale indiquée.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel correspond à l’ordre adressé à Moïse et Aaron dans le contexte immédiat. « Qehath » représente קְהָת de manière transparente, tandis que « familles paternelles » conserve la structure de parenté sans calque obscur.
