  text: וְ/עַל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: fr
  text: Et à la tête du contingent[a] de la tribu des fils d’Aser se trouvait Paguiël, fils d’Ocran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « corps », « division » ou « armée » ; le mot hébreu désigne ici un contingent organisé dans l’ordre du camp d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: À la tête de
  rationale: Dans la suite de la liste, la conjonction et la préposition introduisent le responsable placé au-dessus du contingent. Cette tournure est naturelle en français et conserve le sens d’autorité.
- source_word: צְבָא
  choice: corps organisé
  rationale: Dans le contexte de l’ordre de marche d’Israël, le mot désigne un contingent tribal structuré. « Corps organisé » exprime cette organisation sans réduire nécessairement le groupe à une armée combattante.
- source_word: מַטֵּה
  choice: tribu
  rationale: Ici, le terme désigne l’unité tribale, et non un bâton au sens concret.
- source_word: בְּנֵי אָשֵׁר
  choice: les fils d’Aser
  rationale: Cette traduction conserve la formulation généalogique littérale de l’hébreu, qui sert ici de désignation tribale.
- source_word: פַּגְעִיאֵל
  choice: Paguiel
  rationale: Translittération française conventionnelle du nom propre hébreu.
- source_word: בֶּן עָכְרָן
  choice: fils d’Okrân
  rationale: Le patronyme hébreu est rendu naturellement par « fils de »; la forme Okrân reflète plus directement עָכְרָן que la forme traditionnelle Okrân/Ocran.
