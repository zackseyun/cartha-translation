  terminology: « Tribu » et « fils de Manassé » conviennent. « Contingent » préserve la portée organisée, potentiellement militaire, de צָבָא sans imposer le sens étroit d’une armée combattante. « Pedahtsur » suit une translittération française plus fidèle, notamment pour צ (ts).
