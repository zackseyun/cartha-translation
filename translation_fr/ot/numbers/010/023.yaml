source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: fr
  text: À la tête du contingent de la tribu des fils de Manassé se trouvait Gamaliel, fils de Pedahtsur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « contingent » peut aussi se rendre par « armée », « troupe », « corps » ou « division » ; il désigne ici le contingent tribal organisé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Le chef de … était
  rationale: Dans cette formule récurrente décrivant l’ordre de marche, וְעַל désigne l’homme placé à la tête du contingent. Cette tournure française naturelle rend la fonction sans calquer maladroitement « et sur ».
- source_word: צְבָא
  choice: corps
  rationale: Dans ce contexte, le mot désigne le contingent tribal organisé pour la marche, avec une possible nuance militaire. « Corps » convient à une unité organisée sans la réduire nécessairement à une armée combattante.
- source_word: מַטֵּה
  choice: tribu
  rationale: Ici, מַטֵּה désigne clairement l’unité tribale, sens courant dans le livre des Nombres.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: les fils de Manassé
  rationale: La formulation conserve le désignant lignager masculin explicite de l’hébreu et correspond à l’appellation traditionnelle de cette tribu.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Translittération française usuelle du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement et naturellement le lien généalogique.
- source_word: פְּדָה צוּר
  choice: Pedahsur
  rationale: Le nom propre, graphiquement réparti en deux éléments dans le texte consonantique, est rendu comme un seul nom selon une translittération française cohérente.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase nominale française explicite la fonction de commandement impliquée par עַל, tandis que « corps » conserve la dimension collective et organisée de צְבָא. Le marqueur [a] figure dans le texte principal.
