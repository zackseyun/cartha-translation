review_pass:
  verdict: revise
  source_fidelity: La construction rend bien la fonction de commandement exprimée par וְעַל dans cette formule. Toutefois, « corps » est moins précis et moins naturel ici que « contingent », qui rend clairement צָבָא comme l’unité tribale organisée. La graphie « Pedahsur » ne rend pas adéquatement le צ de צוּר en français.
