    rationale: Le second élément צור contient צ, normalement rendu par « ts » dans une translittération française fidèle. « Pedahtsur » évite de transformer cette consonne en s.
  - severity: low
    issue: Choix de « corps »
    rationale: Dans cette formule de recensement et d’ordre de marche, « contingent » est plus immédiatement clair et moins susceptible d’évoquer un corps militaire moderne.
