source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: fr
  text: Et si tu pars avec nous, alors, tout le bien que Yahweh fera pour nous[a], nous te ferons du bien à toi aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ce bien-là que Yahweh fera avec nous ».'
    reason: L’hébreu emploie littéralement la préposition « avec »; dans ce contexte, elle peut exprimer la bienveillance de Yahweh envers Israël.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Et si
  rationale: Cette tournure introduit ici une condition. « Et si » la rend naturellement sans donner à la proposition la certitude qu’impliquerait « quand ».
- source_word: תֵלֵךְ עִמָּנוּ
  choice: tu pars avec nous
  rationale: Le verbe הלך accompagné de עִם exprime le fait de se joindre au déplacement d’Israël. Dans ce contexte de départ, « partir avec nous » est naturel et précis.
- source_word: וְהָיָה
  choice: alors
  rationale: La seconde occurrence introduit la conséquence de la condition; « alors » en marque clairement la fonction.
- source_word: הַטּוֹב הַהוּא
  choice: tout le bien
  rationale: L’expression désigne le bien accordé à Israël et précisé par la proposition relative. « Tout le bien » transmet naturellement en français la portée ouverte de ce bienfait.
- source_word: אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: que Yahweh fera pour nous
  rationale: Le hiphil de יטב signifie faire du bien ou accorder un bienfait. « Fera pour nous » conserve le verbe commun aux deux membres tout en rendant idiomatiquement עִמָּנוּ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: nous te ferons du bien à toi aussi
  rationale: Cette formulation conserve la répétition de la racine יטב et exprime la réciprocité promise, sans ajouter explicitement « le même bien », absent de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » en préserve la valeur de nom personnel sans introduire une substitution traditionnelle par un titre.
- issue: Nature du bien promis à l’accompagnateur
  choice: nous te ferons du bien à toi aussi
  alternative: nous te ferons profiter du même bien
  rationale: Le texte établit une réciprocité réelle, mais ne dit pas explicitement que le bien reçu sera identique ou partagé à parts égales. La formulation retenue préserve cette latitude.
translation_notes:
  register: Français international moderne, simple et digne. La répétition « fera… ferons » reflète le jeu verbal hébreu; « à toi aussi » souligne naturellement la réciprocité sans ajouter l’idée non exprimée d’un bien strictement identique.
