  text: אֵ֛לֶּה מַסְעֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/צִבְאֹתָ֑/ם וַ/יִּסָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: fr
  text: Telles furent les étapes des Israélites[a], selon leurs divisions[b]. Puis ils partirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « selon leurs troupes » ou « selon leurs corps d’armée ». L’hébreu évoque des groupes organisés pour la marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Telles furent
  rationale: Le démonstratif pluriel introduit ici un récapitulatif. Le passé simple convient au registre narratif soutenu et supplée naturellement la copule absente en hébreu.
- source_word: מַסְעֵי
  choice: les étapes
  rationale: Le pluriel construit de מַסָּע peut désigner les étapes, déplacements ou départs successifs. « étapes » rend clairement le parcours organisé dans le désert.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: des Israélites
  rationale: Littéralement « des fils d’Israël ». En français moderne, « Israélites » est la désignation collective naturelle et inclut l’ensemble du peuple dans ce contexte.
- source_word: לְצִבְאֹתָם
  choice: selon leurs divisions
  rationale: צְבָאוֹת désigne ici les groupes organisés dans lesquels le peuple se déplace. « divisions » conserve la nuance d’organisation quasi militaire sans suggérer nécessairement le combat.
- source_word: וַיִּסָּעוּ
  choice: Puis ils partirent
  rationale: Le wayyiqtol de נסע marque la reprise ou la progression du récit. « Puis » exprime cette succession plus naturellement qu’un simple « et » en français, tandis que « partirent » rend le début du déplacement.
