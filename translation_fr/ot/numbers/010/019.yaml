  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: fr
  text: À la tête du corps de la tribu des fils de Siméon se trouvait Sheloumiel, fils de Tsourishaddaï[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « division » ou « armée » pour « corps » (hébreu צְבָא), terme qui désigne ici le contingent organisé de la tribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: À la tête de
  rationale: Dans le contexte de l’ordre de marche, עַל marque la responsabilité exercée sur un contingent. « À la tête de » est naturel en français et exprime clairement cette fonction.
- source_word: צְבָא
  choice: corps
  rationale: Le terme désigne ici le contingent organisé d’une tribu. « Corps » conserve l’idée d’une formation structurée sans imposer celle d’une armée engagée au combat.
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans ce contexte d’organisation d’Israël, מַטֵּה désigne sans ambiguïté l’unité tribale.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: les fils de Siméon
  rationale: Cette traduction conserve la désignation tribale traditionnelle et la forme littérale de l’hébreu.
- source_word: שְׁלֻמִיאֵל
  choice: Sheloumiel
  rationale: Translittération française claire du nom hébreu, avec « ou » pour le son /u/.
- source_word: בֶּן
  choice: fils de
  rationale: Dans ce patronyme direct, « fils de » est la traduction exacte et naturelle.
- source_word: צוּרִי שַׁדָּי
  choice: Tsourishaddaï
  rationale: Translittération française du nom personnel composé, reproduit comme un seul nom.
