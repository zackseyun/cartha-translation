id: NUM.10.2
reference: Numbers 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: fr
  text: Fais-toi deux trompettes d’argent. Tu les façonneras au marteau[a]. Elles te serviront à convoquer la communauté et à faire partir les camps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : tu les feras d’une seule pièce martelée.'
    reason: Le terme מִקְשָׁה désigne un travail au marteau et peut aussi suggérer un objet façonné d’une seule pièce.
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Fais-toi
  rationale: Rend avec concision l’impératif et le complément לְךָ, qui indiquent que Moïse doit les faire pour l’usage qui lui est confié.
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  choice: deux trompettes d’argent
  rationale: חֲצֹצְרָה désigne une trompette, par opposition à la corne recourbée; le complément « d’argent » exprime naturellement la matière en français.
- source_word: מִקְשָׁה תַּעֲשֶׂה אֹתָם
  choice: Tu les façonneras au marteau
  rationale: מִקְשָׁה décrit un ouvrage métallique obtenu par martelage. La formulation française conserve le procédé de fabrication sans imposer avec certitude l’idée d’une seule pièce.
- source_word: וְהָיוּ לְךָ
  choice: Elles te serviront
  rationale: Exprime la fonction indiquée par la construction hébraïque avec לְךָ de manière naturelle, plutôt qu’une simple possession.
- source_word: לְמִקְרָא הָעֵדָה
  choice: à convoquer la communauté
  rationale: מִקְרָא évoque ici l’appel ou la convocation, et הָעֵדָה la communauté d’Israël.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: et à faire partir les camps
  rationale: 'La présence de אֶת devant « les camps » soutient ici un sens fonctionnel ou causatif: les trompettes servent à donner le départ aux différents camps.'
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Communauté » rend le groupe d’Israël sans connotation ecclésiastique ajoutée; « camps » est conservé au pluriel conformément à l’hébreu.
