  text: וְ/עַל צְבָ֖א מַטֵּ֣ה בְנֵי גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: fr
  text: À la tête du contingent de la tribu des fils de Gad se trouvait Éliasaph, fils de Déouël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « corps de troupe », « armée » ou « division ». Le mot hébreu צְבָא a souvent une nuance militaire, mais il désigne ici le groupe tribal organisé pour la marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: À la tête de
  rationale: Dans cette formule récurrente de la liste des responsables, עַל indique l’autorité exercée sur le groupe. « À la tête de » est idiomatique en français et s’accorde avec la phrase nominale hébraïque, où le verbe est sous-entendu.
- source_word: צְבָא
  choice: corps de troupe
  rationale: צְבָא désigne ici le groupe tribal organisé pour la marche, avec une nuance militaire réelle. « Corps de troupe » conserve cette nuance tout en évoquant une unité structurée plutôt que l’armée entière.
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans ce contexte, מַטֶּה désigne sans ambiguïté une tribu d’Israël, et non un bâton.
- source_word: בְנֵי גָד
  choice: les fils de Gad
  rationale: Ce rendu conserve la forme du nom tribal hébreu tout en restant clair et digne en français biblique moderne.
- source_word: אֶלְיָסָף
  choice: Éliasaph
  rationale: Le nom propre est rendu selon sa forme française biblique usuelle.
- source_word: בֶּן דְּעוּאֵל
  choice: fils de Déouël
  rationale: La construction patronymique hébraïque est reproduite directement; le nom est translittéré sous la forme française Déouël.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « à la tête de… se trouvait » restitue clairement la formule hébraïque elliptique. « Corps de troupe » préserve les connotations militaires de צְבָא sans réduire le groupe à une armée autonome.
