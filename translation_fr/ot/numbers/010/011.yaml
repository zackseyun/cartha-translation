  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: fr
  text: Il arriva que, dans la deuxième année, le vingtième jour du deuxième mois, la nuée s’éleva[a] de dessus le tabernacle du Témoignage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « monta » ou « se leva ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « la Demeure du Témoignage ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette formule rend la transition narrative hébraïque sans recourir à l’expression archaïque « il advint ».
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: la deuxième année
  rationale: Rendu direct de l’indication temporelle.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: le deuxième mois
  rationale: Rendu direct et cohérent de la deuxième indication temporelle.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: le vingtième jour du mois
  rationale: Le mot « jour », sous-entendu dans l’idiome hébreu, est explicité pour produire un français naturel et précis.
- source_word: נַעֲלָה
  choice: s’éleva
  rationale: Le verbe עלה décrit ici le mouvement ascendant de la nuée; « s’éleva » conserve ce sens tout en convenant au registre narratif.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est le terme biblique français établi pour la manifestation nuageuse qui guide Israël; il demeure intelligible et distingue ce signe d’un simple nuage météorologique.
- source_word: מֵעַל
  choice: d’au-dessus de
  rationale: Cette formulation exprime à la fois la position supérieure initiale et le mouvement d’éloignement.
- source_word: מִשְׁכַּן
  choice: tabernacle
  rationale: Ce terme désigne précisément le sanctuaire portatif et maintient les liens terminologiques avec les autres passages du Pentateuque.
- source_word: הָעֵדֻת
  choice: du Témoignage
  rationale: « Témoignage » reste proche du sens lexical et conserve la résonance canonique de la désignation cultuelle; la majuscule signale ici le dépôt sacré ainsi nommé.
theological_decisions:
- issue: Désignation du sanctuaire מִשְׁכַּן הָעֵדֻת
  choice: le tabernacle du Témoignage
  alternative: la Demeure du Témoignage; le tabernacle de l’alliance
  rationale: « Tabernacle du Témoignage » suit étroitement l’hébreu et préserve les échos internes au Pentateuque. « Demeure » est possible pour מִשְׁכָּן, tandis que « alliance » explicite une relation contextuelle qui n’est pas exprimée directement par עֵדוּת.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe conserve la succession solennelle des trois indications de date. « Nuée » et « tabernacle » relèvent du vocabulaire biblique établi sans être inutilement archaïques.
