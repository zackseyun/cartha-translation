  naturalness: La succession « Il arriva que, la deuxième année, le deuxième mois, le vingtième jour du mois » est lourde et elliptiquement construite en français. Regrouper le mois et le jour en une date française fluide rend le texte plus naturel sans réduire l’information source.
  terminology: « Nuée », « tabernacle » et « Témoignage » conviennent au registre biblique moderne et préservent les termes clés. « De dessus le tabernacle » est une tournure biblique sobre qui exprime mieux que « d’au-dessus du » le point de départ indiqué par מֵעַל.
