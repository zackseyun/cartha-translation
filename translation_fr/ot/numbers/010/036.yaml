  text: וּ/בְ/נֻחֹ֖/ה יֹאמַ֑ר שׁוּבָ֣/ה יְהוָ֔ה רִֽבְב֖וֹת אַלְפֵ֥י יִשְׂרָאֵֽל׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: fr
  text: 'Et, lorsque l’arche s’arrêtait, Moïse disait : « Reviens, Yahweh, vers les innombrables milliers d’Israël[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les myriades des milliers d’Israël », expression emphatique évoquant le très grand nombre des Israélites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: Et quand l’arche se reposait
  rationale: La construction avec l’infinitif de נוח forme une proposition temporelle. Le sujet pronominal renvoie à l’arche dans le contexte immédiat; le nom est explicité en français pour éviter une ambiguïté artificielle.
- source_word: יֹאמַר
  choice: Moïse disait
  rationale: L’imparfait hébreu exprime ici une parole habituelle chaque fois que l’arche s’arrêtait. Le contexte identifie Moïse comme locuteur; son nom est explicité pour produire un français naturel.
- source_word: שׁוּבָה
  choice: Reviens
  rationale: L’impératif de שוב, muni d’un hé paragogique, est un appel direct adressé à Yahweh. « Reviens » conserve le mouvement de retour sans préciser davantage la relation spatiale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: רִבְבוֹת אַלְפֵי יִשְׂרָאֵל
  choice: les innombrables milliers d’Israël
  rationale: L’expression accumule deux termes de grand nombre pour souligner l’immensité du peuple. Cette formulation française conserve l’emphase tout en évitant le tour peu naturel « les myriades des milliers ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Rapport exprimé par שׁוּבָה suivi de רִבְבוֹת
  choice: Reviens … vers les innombrables milliers
  alternative: Reviens … au milieu des innombrables milliers
  rationale: La préposition n’est pas exprimée en hébreu. « Vers » donne une construction française intelligible tout en évitant d’ajouter explicitement l’idée d’une présence « au milieu » du peuple.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La cadence de l’invocation est préservée, tandis que l’expression numérique hébraïque est rendue de façon idiomatique. Le point d’exclamation reflète la force de l’appel sans modifier son contenu.
