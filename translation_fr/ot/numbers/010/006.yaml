  text: וּ/תְקַעְתֶּ֤ם תְּרוּעָה֙ שֵׁנִ֔ית וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים תֵּימָ֑נָ/ה תְּרוּעָ֥ה יִתְקְע֖וּ לְ/מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: fr
  text: Quand vous donnerez un deuxième signal d’alarme[a], les camps établis au sud se mettront en route ; on sonnera le signal d’alarme pour leurs départs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une deuxième sonnerie » ; le terme hébreu désigne ici un signal distinctif de trompette servant à diriger les camps.
    reason: Alternative lexicale et précision contextuelle sur תְּרוּעָה.
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: quand vous donnerez
  rationale: Le verbe תקע désigne ici l’action de sonner de la trompette. Avec « signal d’alarme », « donner » produit en français une consigne naturelle tout en conservant l’adresse à la deuxième personne du pluriel.
- source_word: תְּרוּעָה
  choice: signal d’alarme
  rationale: Dans le contexte des trompettes de Nombres 10, le mot désigne une sonnerie distinctive servant à commander le départ, et non simplement un cri ou un bruit.
- source_word: שֵׁנִית
  choice: deuxième
  rationale: L’ordinal qualifie le signal et le distingue du premier signal mentionné dans la séquence.
- source_word: וְנָסְעוּ
  choice: se mettront en route
  rationale: Le verbe נסע décrit la levée du camp et le commencement du déplacement ; cette expression est claire et idiomatique en français moderne.
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: les camps établis
  rationale: Le participe חנה décrit les groupes de campement selon leur position stationnée. « Établis » évite la lourdeur de « les camps qui campent ».
- source_word: תֵּימָנָה
  choice: au sud
  rationale: Dans ce contexte d’organisation du camp, le terme indique l’emplacement méridional des campements plutôt qu’un mouvement vers le sud.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: ils sonneront le signal d’alarme
  rationale: La formulation conserve le verbe actif à la troisième personne du pluriel du texte massorétique ainsi que la répétition du terme désignant le signal.
- source_word: לְמַסְעֵיהֶם
  choice: pour leurs départs
  rationale: מַסָּע peut désigner une levée de camp, une étape ou un déplacement. Ici, le contexte procédural met l’accent sur les départs successifs.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le point-virgule conserve le lien étroit entre l’ordre de départ et le signal prescrit. Le pronom « ils » maintient la forme active et l’ambiguïté référentielle du texte hébreu, sans remplacer silencieusement celle-ci par un passif impersonnel.
