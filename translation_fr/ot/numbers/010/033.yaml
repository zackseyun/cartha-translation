id: NUM.10.33
reference: Numbers 10:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: fr
  text: Ils partirent de la montagne de Yahweh pour trois jours de marche[a], et l’arche de l’alliance de Yahweh avançait devant eux pour trois jours de marche, afin de leur trouver un lieu de repos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi rendre l’expression par « un trajet de trois jours », dans les deux occurrences.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « explorer » ou « rechercher » pour eux un lieu de repos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: ils partirent
  rationale: Dans le contexte des déplacements du camp, נסע signifie lever le camp et se mettre en route. « Partirent » est naturel en français et exprime clairement le début du déplacement.
- source_word: מֵהַר יְהוָה
  choice: de la montagne de Yahweh
  rationale: הַר désigne ici la montagne, et le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: pour trois jours de marche
  rationale: L’expression indique une distance ou une étape évaluée en jours de voyage. « Trois jours de marche » restitue idiomatiquement cette mesure en français.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Cette formulation suit la chaîne construite hébraïque sans préciser davantage une relation que le texte laisse sous forme nominale.
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: avançait devant eux
  rationale: Le participe נֹסֵעַ présente l’action en cours pendant la marche du peuple. L’imparfait français rend cette valeur durative, et « devant eux » conserve le sens spatial de לִפְנֵיהֶם.
- source_word: לָתוּר
  choice: chercher
  rationale: תור signifie explorer ou rechercher en vue de trouver. Ici, le but est un lieu de repos, de sorte que « chercher » convient mieux qu’un terme à coloration militaire.
- source_word: מְנוּחָה
  choice: un lieu où se reposer
  rationale: Dans ce contexte de déplacement, מְנוּחָה désigne concrètement un endroit permettant au peuple de faire halte et de se reposer.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Fonction de l’arche en tête du peuple
  choice: afin de leur chercher un lieu où se reposer
  alternative: afin d’explorer pour eux un lieu de repos
  rationale: La traduction conserve la finalité explicitement attribuée à la progression de l’arche, sans expliquer le mécanisme ni résoudre la tension éventuelle avec les autres indications narratives sur l’ordre de marche.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque de « trois jours de marche » est maintenue, tandis que « avançait » rend naturellement la valeur continue du participe. Les deux marqueurs de note figurent dans le texte.
