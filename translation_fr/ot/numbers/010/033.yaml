revisions:
- from: Ils partirent donc de la montagne de Yahweh pour trois jours de marche[a]. L’arche de l’alliance de Yahweh avançait devant eux durant ces trois jours de marche, afin de leur chercher un lieu où se reposer[b].
  to: Ils partirent de la montagne de Yahweh pour trois jours de marche[a], et l’arche de l’alliance de Yahweh avançait devant eux pour trois jours de marche, afin de leur trouver un lieu de repos[b].
  rationale: La révision retire l’inférence non exprimée « donc », maintient la répétition de l’expression hébraïque dans les deux occurrences et emploie une formulation française idiomatique pour la finalité de l’arche. Elle replace aussi la note b sur le mot qu’elle éclaire.
  reviewer_model: gpt-5.6-terra
