  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: fr
  text: 'Moïse dit à Hobab, fils de Réouel le Madianite, beau-père de Moïse[a] : « Nous partons vers le lieu dont Yahweh a dit : “Je vous le donnerai.” Viens avec nous, et nous te ferons du bien, car Yahweh a dit du bien au sujet d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu חֹתֵן peut désigner plus largement un parent par alliance ; certains comprennent donc ici « beau-frère de Moïse » ou « parent par alliance de Moïse » plutôt que « beau-père de Moïse ».
    reason: Préserver l’étendue sémantique du terme hébreu et l’incertitude sur le lien familial exact.
lexical_decisions:
- source_word: חֹבָב
  choice: Hobab
  rationale: Translittération conventionnelle du nom propre hébreu.
- source_word: רְעוּאֵל
  choice: Réouel
  rationale: Translittération française usuelle du nom propre, avec accents facilitant sa prononciation.
- source_word: הַמִּדְיָנִי
  choice: le Madianite
  rationale: Le gentilé défini désigne ici l’appartenance ethnique.
- source_word: חֹתֵן מֹשֶׁה
  choice: beau-père de Moïse
  rationale: חֹתֵן désigne couramment le beau-père, mais peut aussi avoir le sens plus large de parent par alliance; cette latitude est conservée en note.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: Nous partons
  rationale: Le participe accompagné du pronom exprime un déplacement en cours ou sur le point de commencer; cette formulation est naturelle et concise en français.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: 'dont Yahweh a dit : « Je vous le donnerai »'
  rationale: La construction relative et la promesse divine directe sont conservées; « le » reprend « le lieu », et « vous » correspond au pluriel hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לְכָה אִתָּנוּ
  choice: Viens avec nous
  rationale: Invitation directe et idiomatique qui respecte l’orientation vers le groupe du locuteur.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: et nous te ferons du bien
  rationale: Rend directement le causatif de יטב et son bénéficiaire sans préciser indûment la forme que prendra ce bien.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: a annoncé du bien pour Israël
  rationale: Formulation française naturelle qui maintient l’idée d’une parole portant sur le bien destiné à Israël, sans réduire l’expression à un simple éloge.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom personnel divin; sa translittération préserve cette donnée au lieu de lui substituer un titre.
- issue: Lien familial exprimé par חֹתֵן מֹשֶׁה
  choice: beau-père de Moïse
  alternative: parent par alliance de Moïse; beau-frère de Moïse
  rationale: « Beau-père » est le sens lexical courant, mais le terme hébreu peut désigner plus largement un homme apparenté par mariage. La note évite de trancher au-delà de ce que permet le mot.
- issue: Portée de דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: a annoncé du bien pour Israël
  alternative: a parlé en bien d’Israël; a promis du bien à Israël
  rationale: « Annoncé du bien » conserve à la fois l’acte de parole et le bien concernant Israël. « Promis » explicite davantage la force contextuelle, tandis que « parlé en bien » pourrait être compris comme un simple éloge.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste simple et oral, tandis que « a annoncé du bien » conserve la tension de l’expression hébraïque sans la transformer explicitement en promesse.
