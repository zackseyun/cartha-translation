  terminology: Les noms « Hobab », « Réouel », « Madianite » et le nom divin « Yahweh » sont cohérents. « Beau-père » est le sens usuel de חֹתֵן, et la note conserve correctement l’incertitude lexicale et narrative sans la résoudre de façon confessionnelle.
