revisions:
- from: Puis la bannière[a] du camp des fils de Dan se mit en marche, formant l’arrière-garde[b] de tous les camps, selon leurs corps d’armée[c] ; Ahiézer, fils d’Ammishaddaï, commandait son corps d’armée.
  to: Puis la bannière[a] du camp des fils de Dan se mit en marche, formant l’arrière-garde[b] de tous les camps selon leurs unités[c] ; à la tête de son unité se trouvait Ahiézer, fils d’Ammishaddaï.
  rationale: La révision remplace l’expression institutionnellement trop précise « corps d’armée » par « unité(s) », qui correspond mieux aux formations tribales du texte hébreu. Elle rend aussi la fonction d’Ahiézer au moyen d’une tournure française naturelle qui reste proche de la construction « sur son unité ». Les ancres et le contenu des notes sont conservés.
