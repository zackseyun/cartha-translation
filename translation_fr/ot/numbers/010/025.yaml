  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: fr
  text: Puis la bannière[a] du camp des fils de Dan se mit en marche, formant l’arrière-garde[b] de tous les camps selon leurs unités[c] ; à la tête de son unité se trouvait Ahiézer, fils d’Ammishaddaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étendard ».
    reason: lexical_alternative
  - marker: b
    text: Ou « fermant la marche ». Le terme peut aussi évoquer l’action de rassembler ceux qui restent derrière.
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut aussi être rendu par « armées », « troupes » ou « divisions » ; il désigne ici les unités tribales organisées selon l’ordre de marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Puis … se mit en marche
  rationale: Le waw consécutif fait progresser le récit; cette formulation exprime naturellement le départ ordonné du camp.
- source_word: דֶּגֶל
  choice: bannière
  rationale: Le terme désigne l’emblème sous lequel le camp tribal marche; « bannière » est actuel et clair, tandis qu’« étendard » reste une possibilité.
- source_word: מַחֲנֵה בְנֵי דָן
  choice: camp des fils de Dan
  rationale: Cette formulation conserve l’expression familiale et tribale de l’hébreu sans la neutraliser.
- source_word: מְאַסֵּף
  choice: formant l’arrière-garde
  rationale: Dans cet ordre de marche, le participe désigne le groupe qui ferme la marche, avec l’idée possible de rassembler ceux qui restent derrière.
- source_word: לְכָל הַמַּחֲנֹת
  choice: de tous les camps
  rationale: Dan occupe la position arrière par rapport à l’ensemble des camps en marche.
- source_word: לְצִבְאֹתָם
  choice: selon leurs corps d’armée
  rationale: צְבָאוֹת désigne ici les unités tribales organisées pour la marche; « corps d’armée » conserve la coloration militaire du terme sans réduire le sens au combat.
- source_word: וְעַל צְבָאוֹ
  choice: commandait son corps d’armée
  rationale: La tournure idiomatique explicite la fonction de celui qui est placé sur l’unité, tout en maintenant le même référent lexical que dans la proposition précédente.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiézer, fils d’Ammishaddaï
  rationale: Les noms sont translittérés selon l’usage français, et la formule patronymique hébraïque est conservée.
