review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est rendu fidèlement : le camp de Dan part en dernier et assure la fonction d’arrière-garde pour l’ensemble des camps organisés. Toutefois, « corps d’armée » est trop spécifique dans le français moderne et suggère une formation militaire moderne de grande ampleur, alors que צָבָא / צְבָאוֹת désigne ici les unités tribales organisées dans l’ordre de marche. La dernière proposition peut conserver plus directement la relation « sur/à la tête de son unité » sans surinterpréter le verbe de commandement.'
  naturalness: La phrase est globalement naturelle. « Selon leurs corps d’armée » est cependant lourd et peu idiomatique dans ce contexte. « Selon leurs unités » et « à la tête de son unité se trouvait » sont plus fluides, tout en gardant une formulation digne et moderne.
  terminology: « Bannière », « camp », « fils de Dan », « arrière-garde », Ahiézer et Ammishaddaï conviennent. Le remplacement de « corps d’armée » par « unités » évite un faux équivalent institutionnel moderne tout en gardant la cohérence entre le pluriel צְבָאֹתָם et le singulier צְבָאוֹ.
  issues:
  - severity: medium
    issue: « corps d’armée » pour צְבָאֹתָם / צְבָאוֹ
    rationale: En français, un « corps d’armée » désigne normalement une formation militaire moderne et importante. Le contexte concerne les groupements tribaux de la marche ; « unités » est plus juste et plus naturel sans effacer l’organisation militaire implicite.
  - severity: low
    issue: « commandait son corps d’armée » explicite davantage que la tournure hébraïque
    rationale: וְעַל צְבָאוֹ introduit le responsable placé sur l’unité. « À la tête de son unité se trouvait » rend cette relation de manière plus proche et évite l’ajout d’une coloration hiérarchique moderne.
