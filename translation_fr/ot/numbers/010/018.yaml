  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: fr
  text: Puis la bannière[a] du camp de Ruben partit selon leurs formations[b] ; Élitsour, fils de Shedéour, était à la tête de son contingent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étendard ».
    reason: lexical_alternative
  - marker: b
    text: Ou « selon leurs unités » ; le terme hébreu évoque des groupes organisés à la manière d’une armée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Puis ... partit
  rationale: Le waw avec la forme narrative de נסע fait avancer le récit. « Puis » exprime naturellement la succession, et « partit » convient au déplacement du camp sans ajouter l’idée plus précise de lever le camp.
- source_word: דֶּגֶל
  choice: bannière
  rationale: דֶּגֶל désigne ici l’emblème sous lequel un ensemble tribal se déplace. « Bannière » est concret et courant ; « étendard » demeure une autre traduction possible.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: le camp de Ruben
  rationale: 'La chaîne construite exprime directement l’appartenance ou l’association : le camp de la tribu de Ruben.'
- source_word: לְצִבְאֹתָם
  choice: selon ses corps de troupe
  rationale: Le pluriel צְבָאֹת avec suffixe renvoie aux formations organisées du camp. « Corps de troupe » conserve la coloration militaire et l’idée d’unités ordonnées sans suggérer nécessairement un combat.
- source_word: וְעַל צְבָאוֹ
  choice: Élitsour ... commandait son corps de troupe
  rationale: עַל marque ici l’autorité exercée sur l’unité. La tournure verbale française est plus naturelle que le calque « au-dessus de son corps de troupe était », tout en conservant le singulier צְבָאוֹ.
- source_word: אֱלִיצוּר
  choice: Élitsour
  rationale: Translittération française usuelle du nom hébreu, avec accents facilitant la prononciation.
- source_word: בֶּן שְׁדֵיאוּר
  choice: fils de Shedéour
  rationale: Le patronyme est rendu de manière directe, et le nom du père est translittéré plutôt que traduit.
