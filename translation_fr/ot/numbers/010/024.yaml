  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעוֹנִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: fr
  text: Et à la tête du corps de la tribu des fils de Benjamin se trouvait Abidân, fils de Guidéoni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « armée », « formation » ou « division » au lieu de « corps » ; le terme hébreu désigne ici un groupe organisé selon un ordre de type militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: À la tête de
  rationale: Dans la suite de l’ordre de marche, la préposition présente le responsable placé sur la formation. « À la tête de » exprime naturellement en français cette fonction de commandement; l’enchaînement avec les versets précédents suffit à rendre la valeur connective de וְ.
- source_word: צְבָא
  choice: corps
  rationale: Le mot désigne ici une formation tribale organisée, de caractère militaire, plutôt qu’une armée entière. « Corps » conserve cette idée sans réduire le groupe à une simple compagnie.
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans ce contexte administratif et militaire, le nom désigne la tribu, non le bâton au sens concret.
- source_word: בְּנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: Cette formulation préserve la construction généalogique de l’hébreu et le caractère solennel de la liste, tout en restant intelligible en français moderne.
- source_word: אֲבִידָן
  choice: Abidân
  rationale: Translittération française du nom propre hébreu, avec accent indiquant la voyelle finale prononcée.
- source_word: בֶּן גִּדְעוֹנִי
  choice: fils de Guidéoni
  rationale: Rendu patronymique direct et naturel; « Guidéoni » suit une translittération adaptée à la lecture française.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La structure répétitive de la liste est conservée, mais la tournure « à la tête de… se trouvait » évite un calque lourd. Le mot « corps » maintient la nuance militaire et organisationnelle de צְבָא; la note signale les principaux équivalents possibles.
