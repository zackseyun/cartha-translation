  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: fr
  text: Et à la tête du contingent de la tribu des fils de Nephtali se trouvait Ahira, fils d’Énan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « corps », « armée » ou « division » au lieu de « contingent ». Le mot hébreu צְבָא désigne ici le contingent tribal organisé dans le dispositif de campement et de marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: À la tête de
  rationale: Dans cette formule de commandement, עַל indique qu’Ahira est placé au-dessus du contingent. « À la tête de » est naturel en français et exprime clairement sa fonction; le וְ de liaison n’a pas besoin d’être rendu par « et » dans ce verset isolé.
- source_word: צְבָא
  choice: corps
  rationale: Dans le dispositif de campement et de marche, צְבָא désigne ici un contingent tribal organisé. « Corps » conserve la nuance collective et militaire sans évoquer nécessairement toute une armée nationale.
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans ce contexte, מַטֵּה désigne l’unité tribale, et non le bâton au sens concret.
- source_word: בְּנֵי נַפְתָּלִי
  choice: les fils de Nephtali
  rationale: La formulation familiale explicite de l’hébreu est conservée; dans ce contexte tribal, elle désigne les descendants de Nephtali.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Le nom propre est translittéré selon sa forme française biblique courante.
- source_word: בֶּן עֵינָן
  choice: fils d’Énân
  rationale: Rendu français concis et naturel de la construction patronymique hébraïque.
