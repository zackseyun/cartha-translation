  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/016.yaml
  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: fr
  text: Et le contingent[a] de la tribu des fils de Zabulon était placé sous le commandement d’Éliab, fils de Hélôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « contingent » par « armée » ou « division » ; le mot hébreu désigne ici une formation tribale organisée pour la marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: était placé sous le commandement de
  rationale: La conjonction relie cette notice à la précédente, tandis que עַל, avec le verbe sous-entendu, exprime ici l’autorité exercée sur le contingent. Une phrase verbale explicite est plus naturelle en français.
- source_word: צְבָא
  choice: contingent
  rationale: Dans le contexte de la marche au désert, le mot désigne une formation tribale organisée. « Contingent » conserve la dimension collective et militaire sans évoquer nécessairement une armée permanente.
- source_word: מַטֵּה
  choice: tribu
  rationale: Le terme désigne ici l’unité sociopolitique tribale, et non le bâton au sens concret.
- source_word: בְּנֵי זְבוּלֻן
  choice: les fils de Zabulon
  rationale: Cette traduction conserve l’expression généalogique explicite de l’hébreu, qui désigne les membres issus de Zabulon.
- source_word: אֱלִיאָב
  choice: Éliab
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בֶּן חֵלֹון
  choice: fils de Hélôn
  rationale: Traduction directe et naturelle de la construction patronymique hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe nominale elliptique de l’hébreu est explicitée par « était placé sous le commandement de ». L’expression traditionnelle « fils de Zabulon » est maintenue afin de préserver la formulation généalogique du texte source.
