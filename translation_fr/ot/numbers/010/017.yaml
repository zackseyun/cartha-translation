source:
  edition: WLC
  text: וְ/הוּרַ֖ד הַ/מִּשְׁכָּ֑ן וְ/נָסְע֤וּ בְנֵֽי גֵרְשׁוֹן֙ וּ/בְנֵ֣י מְרָרִ֔י נֹשְׂאֵ֖י הַ/מִּשְׁכָּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: fr
  text: Puis on démonta le tabernacle, et les fils de Guershon et les fils de Merari partirent, portant le tabernacle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, ils transportaient le tabernacle après son démontage, donc ses éléments; l’hébreu répète toutefois « le tabernacle » sans préciser « ses éléments ».
    reason: cultural_note
lexical_decisions:
- source_word: וְהוּרַד
  choice: on démonta
  rationale: Le hofal de ירד présente le tabernacle comme amené à quitter son état dressé. « On démonta » exprime naturellement l’action dans le contexte du départ du camp, sans suggérer qu’on l’a simplement abaissé.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: מִשְׁכָּן est ici le terme consacré pour la tente-sanctuaire d’Israël; « tabernacle » est précis, traditionnel et compréhensible en français biblique moderne.
- source_word: וְנָסְעוּ
  choice: partirent
  rationale: Dans le contexte des déplacements du camp, נסע signifie lever le camp et se mettre en route. « Partirent » est naturel et restitue clairement le début du déplacement.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: les fils de Guershon
  rationale: Cette formulation conserve l’expression clanique littérale de l’hébreu ainsi que son parallélisme.
- source_word: וּבְנֵי מְרָרִי
  choice: les fils de Merari
  rationale: La traduction maintient l’expression filiale explicite de l’hébreu et son parallélisme avec « les fils de Guershon ».
- source_word: נֹשְׂאֵי
  choice: portant
  rationale: Le participe décrit leur activité pendant le déplacement; « portant » est direct, actuel et syntaxiquement naturel.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: La seconde occurrence répète le même nom. La traduction préserve cette répétition plutôt que d’ajouter « les éléments », précision seulement implicite dans le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure active indéfinie « on démonta » rend naturellement le passif hébreu. Les expressions claniques littérales sont conservées, tout comme la répétition de « le tabernacle ».
