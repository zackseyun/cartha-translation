  text: וַ/יִּסַּ֞ע דֶּ֣גֶל מַחֲנֵ֧ה בְנֵֽי יְהוּדָ֛ה בָּ/רִאשֹׁנָ֖ה לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: fr
  text: L’étendard du camp des fils de Juda se mit en marche le premier[a], selon leurs unités[b] ; à la tête de son unité se trouvait Nahshon, fils d’Amminadab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bannière » pour « étendard ». Le mot hébreu désigne l’enseigne tribale sous laquelle l’unité du camp marchait.
    reason: lexical_alternative
  - marker: b
    text: Ou « selon leurs troupes ». Le terme hébreu désigne ici les groupements tribaux organisés pour la marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: partit
  rationale: Dans le récit des déplacements au désert, נסע désigne le fait de lever le camp et de se mettre en route. « Partit » est naturel et convient à l’ordre de marche.
- source_word: דֶּגֶל
  choice: étendard
  rationale: Le terme désigne l’enseigne tribale et, par extension, le groupe organisé qui marche sous elle. « Étendard » conserve l’image militaire du camp.
- source_word: מַחֲנֵה
  choice: camp
  rationale: Dans la construction דֶּגֶל מַחֲנֵה, le mot désigne le camp organisé sous l’étendard.
- source_word: בְנֵי יְהוּדָה
  choice: fils de Juda
  rationale: Cette formulation conserve la désignation tribale et généalogique explicite de l’hébreu.
- source_word: בָּרִאשֹׁנָה
  choice: le premier
  rationale: L’adverbe indique ici la première place dans l’ordre de départ. L’accord au masculin correspond naturellement à « l’étendard ».
- source_word: לְצִבְאֹתָם
  choice: selon leurs unités
  rationale: Le pluriel צבאות désigne les groupements ordonnés, de caractère militaire, qui composent le camp. « Unités » reste clair sans suggérer nécessairement des armées engagées au combat.
- source_word: וְעַל צְבָאוֹ
  choice: à la tête de son unité se trouvait
  rationale: La préposition על présente Nahshon comme celui qui commande l’unité de Juda. Cette tournure française exprime naturellement le rapport d’autorité tout en gardant le singulier du texte.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nahshon, fils d’Amminadab
  rationale: Les noms sont translittérés selon l’usage français courant, et la relation filiale est explicitement conservée.
