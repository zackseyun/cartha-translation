  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: fr
  text: Et la nuée de Yahweh était au-dessus d’eux de jour, lorsqu’ils partaient du camp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲנַן יְהוָה
  choice: Et la nuée de Yahweh
  rationale: עָנָן désigne une « nuée » ou un « nuage » ; « nuée » convient au registre biblique tout en restant compréhensible. La conjonction וַ־ est rendue par « Et » pour conserver le lien narratif. Le nom divin précise de quelle nuée il s’agit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: עֲלֵיהֶם
  choice: était au-dessus d’eux
  rationale: La préposition עַל exprime ici une position supérieure. « Au-dessus d’eux » conserve la valeur spatiale sans imposer une interprétation supplémentaire.
- source_word: יוֹמָם
  choice: pendant le jour
  rationale: L’adverbe signifie « de jour » ou « pendant le jour ». Cette formulation est naturelle en français et contraste implicitement avec la nuit.
- source_word: בְּנָסְעָם
  choice: lorsqu’ils partaient
  rationale: L’infinitif construit de נסע avec בְּ־ a une valeur temporelle et évoque le départ, la levée du camp.
- source_word: מִן הַמַּחֲנֶה
  choice: du camp
  rationale: מַחֲנֶה désigne le campement d’Israël ; avec la préposition מִן et l’article, « du camp » est direct et idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie le nom divin. Le conserver sous la forme « Yahweh » respecte sa fonction de nom propre sans lui substituer un titre.
- issue: Portée de la position de la nuée
  choice: au-dessus d’eux
  alternative: sur eux
  rationale: Le texte affirme la position de la nuée sans expliciter ici sa fonction protectrice. « Au-dessus d’eux » préserve cette sobriété et n’ajoute pas d’interprétation théologique.
translation_notes:
  register: Français moderne, courant et digne. « Nuée » maintient la coloration biblique traditionnelle sans archaïsme marqué ; la syntaxe demeure proche de l’hébreu tout en étant naturelle.
