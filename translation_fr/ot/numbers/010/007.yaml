source:
  edition: WLC
  text: וּ/בְ/הַקְהִ֖יל אֶת הַ/קָּהָ֑ל תִּתְקְע֖וּ וְ/לֹ֥א תָרִֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: fr
  text: Mais lorsque vous convoquerez l’assemblée, vous sonnerez, sans donner le signal d’alarme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans faire retentir la sonnerie d’alarme ». L’hébreu oppose ici la sonnerie ordinaire à la sonnerie distinctive qui, dans le contexte, donne le signal du départ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַקְהִיל
  choice: Mais lorsque vous convoquerez
  rationale: La conjonction, suivie de la préposition ב et de l’infinitif construit causatif de קהל, introduit une circonstance temporelle. « Mais » fait ressortir le contraste avec le signal de départ des versets précédents, et « convoquerez » exprime naturellement l’idée de faire assembler.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: קָהָל désigne ici la communauté convoquée et réunie. « Assemblée » est clair, digne et évite la coloration confessionnelle que peut avoir « congrégation » en français.
- source_word: תִּתְקְעוּ
  choice: vous sonnerez
  rationale: תקע désigne ici le fait de sonner des trompettes. Le contexte fournit l’instrument, que l’hébreu ne répète pas dans ce verset; « sonnerez » conserve donc la concision de l’original.
- source_word: וְלֹא תָרִיעוּ
  choice: sans donner le signal d’alarme
  rationale: Le verbe הריע désigne dans ce contexte la sonnerie distinctive servant de signal, par opposition à la sonnerie ordinaire. La tournure française exprime clairement cette opposition sans laisser entendre qu’il ne faudrait produire aucun son.
theological_decisions: []
translation_notes:
  register: Français international moderne, au registre sobre et normatif. Le futur conserve la valeur prescriptive de l’instruction, tandis que « assemblée » reste naturel dans un cadre communautaire sans introduire de terminologie confessionnelle.
