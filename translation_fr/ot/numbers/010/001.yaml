  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son autre rendu courant.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר, précédé du waw narratif, introduit ici une nouvelle prise de parole divine. « Parla » garde la valeur propre du verbe et convient à la formule solennelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de conserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit le destinataire de la parole ; « à » est son équivalent naturel en français.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: « Moïse » est la forme française usuelle du nom hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif לֵאמֹר introduit le contenu du discours. « En ces termes » remplit naturellement cette fonction en français tout en évitant la tournure plus lourde « en disant » après « parla ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, un nom propre. « Yahweh » le représente explicitement ; la substitution traditionnelle par « le SEIGNEUR » est signalée en note sans être imposée au texte.
translation_notes:
  register: Français international actuel, sobre et digne. La formule « parla à Moïse en ces termes » restitue naturellement l’introduction hébraïque du discours, lequel se poursuit au verset suivant.
