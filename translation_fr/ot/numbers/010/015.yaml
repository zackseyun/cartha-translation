  terminology: « Division » rend de façon appropriée le groupe tribal organisé désigné par צָבָא sans en faire nécessairement une armée combattante. « Issacar », « Nethanéel » et « Tsouar » suivent des usages francophones bibliques transparents. La note conserve les possibilités lexicales pertinentes.
