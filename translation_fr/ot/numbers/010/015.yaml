  source_fidelity: 'Le sens de la formule est globalement bien rendu : עַל introduit le responsable placé sur l’unité tribale, et « tribu des fils d’Issacar » reflète correctement מַטֵּה בְּנֵי יִשָׂשכָר. Toutefois, « corps de la tribu » est peu idiomatique et imprécis en français courant pour צָבָא dans ce contexte d’ordre de marche. La conjonction initiale est également présente dans l’hébreu.'
