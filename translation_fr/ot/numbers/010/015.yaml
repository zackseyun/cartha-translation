  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י יִשָׂשכָ֑ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: fr
  text: Et à la tête de la division de la tribu des fils d’Issacar se trouvait Nethanéel, fils de Tsouar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du corps » ou « de la troupe ». Le mot hébreu désigne ici un groupe tribal organisé pour la marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: À la tête de
  rationale: Dans cette formule qui énumère les responsables des unités en marche, עַל indique que Netanel est placé à la tête du groupe. La coordination avec le verset précédent reste perceptible dans la continuité de la liste, sans qu’un « et » initial soit nécessaire en français moderne.
- source_word: צְבָא
  choice: corps
  rationale: Le terme désigne ici un groupe tribal organisé pour la marche. « Corps » exprime une unité constituée sans imposer exclusivement l’idée d’une armée combattante; les autres sens possibles sont signalés en note.
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans ce contexte, מַטֵּה désigne sans ambiguïté une tribu d’Israël, et non un bâton.
- source_word: בְּנֵי יִשָׂשכָר
  choice: les fils d’Issacar
  rationale: Cette formulation conserve l’expression généalogique littérale de l’hébreu tout en restant intelligible dans le contexte tribal.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Translittération française claire du nom hébreu נְתַנְאֵל.
- source_word: בֶּן צוּעָר
  choice: fils de Tsouar
  rationale: La construction filiale hébraïque est rendue directement et les noms suivent une translittération française.
