  naturalness: Le français est sobre et fluide. « Tu connais les lieux où nous pourrons camper » est plus idiomatique et cohérent avec la situation narrative que « tu sais où nous campons ».
  terminology: « Ne nous quitte pas, je t’en prie », « désert » et « tu nous serviras d’yeux » conviennent. La note conserve utilement la formulation littérale et explique l’image sans lui imposer une portée doctrinale.
