  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: fr
  text: 'Il lui dit : « Ne nous quitte pas, je t’en prie, car tu connais les lieux où nous pourrons camper dans le désert, et tu nous serviras d’yeux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu seras pour nous des yeux », c’est-à-dire que ta connaissance du désert pourra nous guider.'
    reason: La note explicite la métaphore hébraïque sans la remplacer dans le texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il lui dit
  rationale: Le wayyiqtol poursuit le récit et introduit le discours direct. Le pronom « Il » reprend Moïse dans le contexte immédiat; « lui » rend naturellement en français le destinataire implicite.
- source_word: אַל נָא תַּעֲזֹב אֹתָנוּ
  choice: Ne nous quitte pas, je t’en prie
  rationale: אַל marque la défense, נָא l’insistance suppliante, et עזב signifie ici quitter ou laisser. Cette formulation conserve la prière pressante sans donner au verbe une portée théologique étrangère au contexte.
- source_word: כִּי עַל כֵּן
  choice: car
  rationale: Dans ce contexte, la locution introduit le motif de la demande. « Car » en exprime clairement la valeur causale dans un registre digne et naturel.
- source_word: יָדַעְתָּ חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: tu sais où nous campons dans le désert
  rationale: Le nom verbal חֲנֹתֵנוּ peut désigner le fait, la manière ou les lieux de camper. « Où nous campons » exprime naturellement la connaissance pratique des campements sans ajouter l’idée normative de ce qu’il faudrait faire.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: et tu nous serviras d’yeux
  rationale: La tournure hébraïque signifie littéralement qu’il sera « pour nous comme des yeux ». La traduction conserve cette image frappante tout en restant compréhensible en français.
theological_decisions: []
