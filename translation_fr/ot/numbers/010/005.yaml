source:
  edition: WLC
  text: וּ/תְקַעְתֶּ֖ם תְּרוּעָ֑ה וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים קֵֽדְמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: fr
  text: Quand vous sonnerez l’alarme[a], les camps qui sont établis à l’est se mettront en route.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un signal ». Le terme hébreu désigne ici la sonnerie particulière des trompettes qui donnait aux camps le signal du départ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Quand vous sonnerez
  rationale: Avec les trompettes, תקע signifie « sonner ». La proposition introduit ici naturellement le moment auquel les camps doivent partir.
- source_word: תְּרוּעָה
  choice: une sonnerie d’alarme
  rationale: Dans ce contexte de signaux donnés par les trompettes, le terme désigne une sonnerie distinctive commandant le déplacement, et non un simple son ni un cri.
- source_word: וְנָסְעוּ
  choice: se mettront en route
  rationale: נסע désigne couramment la levée du camp et le départ; cette formulation est naturelle en français et convient au mouvement collectif des camps.
- source_word: הַמַּחֲנוֹת
  choice: les camps
  rationale: Le pluriel renvoie directement aux groupements tribaux disposés autour du sanctuaire.
- source_word: הַחֹנִים
  choice: établis
  rationale: Le participe décrit la position occupée par les camps; « établis » rend ce sens statif sans lourdeur.
- source_word: קֵדְמָה
  choice: du côté est
  rationale: Dans l’organisation du camp, le mot indique ici l’emplacement oriental plutôt qu’un mouvement vers l’est.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Sonnerie d’alarme » conserve la valeur technique du signal, tandis que la note indique l’autre traduction possible. La construction au futur rend naturellement l’instruction hébraïque.
