revisions:
- from: Puis la bannière[a] du camp des fils d’Éphraïm partit, selon leurs divisions[b]. Élishama, fils d’Ammihoud, commandait sa division.
  to: Puis l’étendard[a] du camp des fils d’Éphraïm se mit en marche, selon leurs divisions[b]. À la tête de cette division se trouvait Élishama, fils d’Ammihoud.
  rationale: La révision améliore l’idiomaticité française et explicite l’antécédent de l’unité placée sous l’autorité d’Élishama. Elle ne modifie ni la progression narrative, ni l’organisation militaire implicite, ni les noms propres, et conserve les deux ancres de notes lexicales.
