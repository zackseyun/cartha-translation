  variant: modern international French
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: fr
  text: Puis l’étendard[a] du camp des fils d’Éphraïm se mit en marche, selon leurs divisions[b]. À la tête de cette division se trouvait Élishama, fils d’Ammihoud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bannière ». Le terme hébreu désigne l’enseigne tribale sous laquelle le camp se mettait en marche.
    reason: lexical_alternative
  - marker: b
    text: Ou « selon leurs corps de troupe ». L’hébreu évoque des groupes organisés à la manière d’une armée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Puis ... partit
  rationale: Le waw suivi du qatal poursuit la séquence narrative. « Puis » marque naturellement l’ordre de départ, et « partit » convient au contexte de la marche.
- source_word: דֶּגֶל
  choice: bannière
  rationale: Le terme désigne l’enseigne tribale autour de laquelle le camp est organisé. « Bannière » est actuel et clair, tandis qu’« étendard » reste une variante possible.
- source_word: מַחֲנֵה
  choice: camp
  rationale: Dans cette construction, le mot désigne l’unité de camp associée à la bannière; « camp » restitue directement le cadre de la marche au désert.
- source_word: בְנֵי אֶפְרַיִם
  choice: fils d’Éphraïm
  rationale: Cette formulation conserve l’expression tribale littérale de l’hébreu sans la réduire aux seuls fils immédiats d’Éphraïm.
- source_word: לְצִבְאֹתָם
  choice: selon leurs divisions
  rationale: Le pluriel צְבָאוֹת évoque ici des groupes organisés pour la marche, avec une nuance militaire, sans impliquer nécessairement des armées engagées au combat.
- source_word: וְעַל צְבָאוֹ
  choice: Élishama ... commandait sa division
  rationale: La formulation française naturelle exprime la position d’autorité indiquée par עַל et conserve le singulier du suffixe, qui renvoie à l’unité d’Éphraïm.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Élishama, fils d’Ammihoud
  rationale: Les noms sont translittérés selon une forme française reconnaissable, et la relation généalogique est rendue directement.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement restructurée dans la seconde phrase pour éviter une tournure nominale lourde, tout en préservant la relation de commandement et la distinction entre les divisions au pluriel et la division d’Éphraïm au singulier.
