revisions:
- from: Le jour de votre joie, lors de vos temps fixés et au début de vos mois[a], vous sonnerez des trompettes au-dessus de vos holocaustes et de vos sacrifices de paix[b]. Elles vous serviront de mémorial devant votre Dieu. Je suis Yahweh, votre Dieu.
  to: Le jour de votre joie, lors de vos temps fixés et au début de vos mois[a], vous sonnerez des trompettes lors de vos holocaustes et de vos sacrifices de paix[b]. Elles vous serviront de mémorial devant votre Dieu. Je suis Yahweh, votre Dieu.
  rationale: La révision remplace un calque français peu naturel de la préposition עַל par une formulation rituelle idiomatique qui conserve le lien entre les sonneries et les offrandes. Elle améliore aussi la formulation de la note sur les nouvelles lunes. Aucun changement de sens théologique ni aucune résolution indue d’ambiguïté n’est introduit.
