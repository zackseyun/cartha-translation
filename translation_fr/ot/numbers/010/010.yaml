review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au texte hébreu : les occasions cultuelles, les trompettes, les holocaustes, les sacrifices de paix, le mémorial devant Dieu et le nom Yahweh sont bien rendus. Toutefois, « au-dessus de vos holocaustes » transpose trop littéralement עַל et suggère en français une position physique peu naturelle, plutôt que l’accompagnement rituel des sacrifices.'
  naturalness: 'Le français est clair, digne et moderne. « Lors de vos holocaustes et de vos sacrifices de paix » rend naturellement la relation rituelle exprimée par la préposition hébraïque. La note a est également ajustée : « à vos nouvelles lunes » est une alternative française plus exacte et idiomatique que « lors de vos nouvelles lunes ».'
  terminology: « Temps fixés », « holocaustes », « sacrifices de paix », « mémorial » et « Yahweh » sont des choix recevables et cohérents avec le registre biblique. « Sacrifices de communion » demeure une bonne alternative en note. Le pronom « Elles » peut naturellement renvoyer aux trompettes, sans qu’il soit nécessaire de préciser davantage le référent.
  issues:
  - severity: medium
    issue: « au-dessus de vos holocaustes et de vos sacrifices de paix »
    rationale: Bien que עַל puisse littéralement se traduire par « sur », « au-dessus de » est peu idiomatique dans ce contexte rituel français et risque de décrire une localisation spatiale. « Lors de » exprime sobrement l’accompagnement des offrandes sans ajouter de détail interprétatif.
  - severity: low
    issue: 'Note a : « lors de vos nouvelles lunes »'
    rationale: L’alternative porte sur l’expression calendaire elle-même, non sur une reformulation de toute la relation temporelle. « à vos nouvelles lunes » est plus direct et plus idiomatique.
  revised_text: Le jour de votre joie, lors de vos temps fixés et au début de vos mois[a], vous sonnerez des trompettes lors de vos holocaustes et de vos sacrifices de paix[b]. Elles vous serviront de mémorial devant votre Dieu. Je suis Yahweh, votre Dieu.
  revised_footnotes:
  - marker: a
    text: Ou « à vos nouvelles lunes ». L’hébreu dit littéralement « aux têtes de vos mois ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sacrifices de communion ».
    reason: lexical_alternative
  revision_rationale: La révision remplace un calque français peu naturel de la préposition עַל par une formulation rituelle idiomatique qui conserve le lien entre les sonneries et les offrandes. Elle améliore aussi la formulation de la note sur les nouvelles lunes. Aucun changement de sens théologique ni aucune résolution indue d’ambiguïté n’est introduit.
