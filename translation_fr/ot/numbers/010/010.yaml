source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: fr
  text: Le jour de votre joie, lors de vos temps fixés et au début de vos mois[a], vous sonnerez des trompettes lors de vos holocaustes et de vos sacrifices de paix[b]. Elles vous serviront de mémorial devant votre Dieu. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à vos nouvelles lunes ». L’hébreu dit littéralement « aux têtes de vos mois ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sacrifices de communion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: votre joie
  rationale: Le nom désigne la joie ou l’allégresse. « Votre joie » est direct, naturel et conserve la formulation nominale de l’hébreu.
- source_word: מוֹעֲדֵיכֶם
  choice: vos temps fixés
  rationale: Le terme désigne des temps déterminés et, dans ce contexte cultuel, les célébrations qui leur correspondent. « Temps fixés » préserve cette étendue sans réduire explicitement le sens aux seules fêtes.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: au début de vos mois
  rationale: L’expression signifie littéralement « aux têtes de vos mois ». Cette formulation française en restitue clairement le sens calendaire; les nouvelles lunes sont signalées en note comme équivalent contextuel.
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: vous sonnerez des trompettes
  rationale: Le verbe signifie souffler ou sonner d’un instrument. En français, « sonner des trompettes » exprime naturellement l’action sans ajouter ici qu’elles sont en argent, détail donné plus tôt dans le chapitre.
- source_word: עַל עֹלֹתֵיכֶם
  choice: au-dessus de vos holocaustes
  rationale: « Au-dessus de » conserve la valeur fondamentale de עַל et l’image rituelle des trompettes sonnant pendant la présentation des offrandes.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: vos sacrifices de paix
  rationale: Cette traduction garde le lien lexical de שְׁלָמִים avec la paix, l’intégrité et le bien-être, tout en conservant le terme sacrificiel זִבְחֵי. « Sacrifices de communion » reste une autre traduction établie.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: Elles vous serviront de mémorial
  rationale: Le pluriel hébreu laisse une certaine tension quant au référent précis. Le pronom féminin français peut renvoyer aux trompettes ou aux offrandes mentionnées, sans imposer explicitement « les sonneries ». « Mémorial » conserve la portée cultuelle de זִכָּרוֹן.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: devant votre Dieu
  rationale: Cette expression rend directement le sens de « devant, en présence de » dans le contexte cultuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Référent de וְהָיוּ (« elles seront »)
  choice: Conserver un pronom pluriel sans expliciter le référent
  alternative: « Ces sonneries vous serviront de mémorial »
  rationale: Le texte hébreu ne nomme pas de nouveau sujet. Expliciter « les sonneries » rendrait une interprétation plausible, mais résoudrait une ambiguïté réelle du texte.
- issue: Traduction de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: « Paix » maintient le lien avec le champ sémantique de la plénitude, du bien-être et de la paix; la note préserve l’autre désignation française courante sans limiter le rite à sa dimension communautaire.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin; la translittération préserve le nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en série du verset est conservée. « Temps fixés » maintient la portée du terme cultuel sans l’identifier trop étroitement à une seule catégorie de fêtes. Le pronom « Elles » préserve autant que possible l’indétermination du référent dans la phrase hébraïque.
