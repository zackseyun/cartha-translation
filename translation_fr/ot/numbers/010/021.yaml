source:
  edition: WLC
  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: fr
  text: Puis les Qehatites se mirent en route, portant les objets sacrés[a], et la Demeure avait été dressée avant leur arrivée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « porteurs du sanctuaire ». Ici, l’expression désigne les objets sacrés transportés par les Qehatites, distincts de la structure de la Demeure mentionnée ensuite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: Puis … se mirent en route
  rationale: Le waw fait progresser le récit de la marche. « Se mirent en route » est naturel en français et convient au départ successif des groupes.
- source_word: הַקְּהָתִים
  choice: les Qehatites
  rationale: Désignation française courante des membres du clan descendant de Qehath.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: portant les objets sacrés
  rationale: Littéralement « porteurs du sanctuaire ». Dans ce contexte, l’expression désigne par métonymie les objets sacrés confiés aux Qehatites, par contraste avec la structure de la Demeure mentionnée ensuite.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: et la Demeure était dressée
  rationale: Le verbe hébreu est actif à la troisième personne du pluriel, mais son sujet n’est pas exprimé. Le contexte renvoie aux Lévites partis auparavant avec la structure. La tournure passive évite d’attribuer par erreur cette action aux Qehatites.
- source_word: הַמִּשְׁכָּן
  choice: la Demeure
  rationale: « Demeure » rend le sens de מִשְׁכָּן et constitue une désignation française claire et digne du sanctuaire mobile au désert.
- source_word: עַד בֹּאָם
  choice: avant leur arrivée
  rationale: La proposition indique que la Demeure était dressée pour l’arrivée des Qehatites avec les objets sacrés. Cette formulation exprime naturellement la relation temporelle en français.
theological_decisions:
- issue: Sujet implicite de וְהֵקִימוּ
  choice: 'Employer le passif : « la Demeure était dressée »'
  alternative: « ils dressaient la Demeure »
  rationale: L’hébreu ne nomme pas le sujet. Le contexte suggère les Guershonites et les Merarites partis en avant, et non les Qehatites. Le passif préserve cette donnée sans imposer explicitement une identification.
translation_notes:
  register: Français international moderne, fluide et digne. « Qehatites » et « Demeure » maintiennent le vocabulaire biblique sans archaïsme excessif. La note conserve la formulation littérale et signale la métonymie du texte hébreu.
