  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו לֹ֣א אֵלֵ֑ךְ כִּ֧י אִם אֶל אַרְצִ֛/י וְ/אֶל מוֹלַדְתִּ֖/י אֵלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/030.yaml
  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: fr
  text: 'Mais il lui dit : « Je n’irai pas ; j’irai plutôt dans mon pays et dans mon lieu d’origine[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auprès de ma parenté ». Le terme hébreu peut désigner le lieu, le pays ou le groupe d’origine.'
    reason: Préserve l’ambiguïté sémantique de מוֹלַדְתִּי sans privilégier une interprétation unique.
lexical_decisions:
- source_word: כִּי אִם
  choice: plutôt
  rationale: 'Dans ce contexte, la locution marque la correction ou l’opposition à l’idée de partir avec Moïse : « non… plutôt… ».'
- source_word: מוֹלַדְתִּי
  choice: ma parenté
  rationale: Le nom peut désigner le lieu ou le groupe d’origine. Coordonné à « mon pays », il désigne naturellement ici les proches ou le clan d’origine, sans répéter simplement l’idée de territoire.
- source_word: אֵלֵךְ
  choice: j’irai
  rationale: Le même verbe est conservé dans les deux propositions afin de rendre le contraste net entre le refus d’accompagner Moïse et le projet de retourner chez lui.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La répétition de « j’irai » conserve la structure contrastive de l’hébreu, tandis que « auprès de ma parenté » exprime idiomatiquement la destination humaine introduite par אֶל.
