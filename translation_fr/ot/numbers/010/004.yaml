  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: fr
  text: Mais si l’on ne fait sonner qu’une seule trompette, les responsables, chefs des milliers d’Israël[a], se réuniront auprès de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « chefs des milliers d’Israël » désigne probablement les chefs d’unités d’Israël organisées par milliers ; certaines traductions rendent le sens de manière plus interprétative par « chefs des clans d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Mais si
  rationale: Introduit une condition en contraste avec le cas précédent, où les deux trompettes sont sonnées.
- source_word: בְּ/אַחַת יִתְקָעוּ
  choice: si l’on ne sonne que d’une seule trompette
  rationale: L’hébreu dit littéralement « s’ils sonnent avec une seule »; « trompette » est implicite d’après le contexte. La tournure impersonnelle est naturelle en français et « ne… que » exprime clairement le contraste avec les deux trompettes.
- source_word: וְ/נוֹעֲדוּ אֵלֶי/ךָ
  choice: se réuniront auprès de toi
  rationale: Le niphal de יעד désigne ici le rassemblement provoqué par un signal convenu; « auprès de toi » exprime le mouvement vers Moïse sans suggérer une simple réunion informelle.
- source_word: הַ/נְּשִׂיאִים
  choice: les responsables
  rationale: נְשִׂיאִים désigne les dirigeants reconnus du peuple. « Responsables » évite la connotation monarchique que pourrait avoir « princes » et se distingue naturellement du terme « chefs » qui suit.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: chefs des milliers d’Israël
  rationale: Cette traduction conserve le terme administratif ou militaire « milliers » et la structure du texte hébreu, sans trancher en faveur de l’interprétation plus explicite « clans ».
