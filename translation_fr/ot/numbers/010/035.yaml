  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: fr
  text: 'Chaque fois que l’arche se mettait en route[a], Moïse disait : « Lève-toi, Yahweh[b] ! Que tes ennemis soient dispersés, que ceux qui te haïssent fuient devant toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand l’arche se mettait en route » ; la tournure hébraïque peut être rendue plus formellement par « Il arriva, lorsque l’arche se mit en route », mais elle semble ici décrire ce qui se produisait chaque fois.'
    reason: lexical_alternative
  - marker: b
    text: « Lève-toi » est un appel à Yahweh pour qu’il intervienne avec puissance ; cela ne signifie pas qu’il était littéralement couché ou inactif.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: Chaque fois que … se mettait en route
  rationale: Dans ce contexte, la construction introduit une circonstance répétée. Cette formulation française exprime naturellement la valeur habituelle tout en conservant l’idée de départ.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: L’hébreu dit simplement « l’arche » ; préciser « de l’alliance » ajouterait une information implicite tirée du contexte.
- source_word: קוּמָה
  choice: Lève-toi
  rationale: L’impératif conserve l’image vive d’un appel adressé à Dieu pour qu’il intervienne avec puissance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְיָפֻצוּ
  choice: Que … soient dispersés
  rationale: L’imparfait qui suit l’impératif a ici une valeur volitive ; la construction avec « que » rend clairement la demande en français.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Rendu direct du nom pluriel accompagné du suffixe de deuxième personne masculine singulière.
- source_word: וְיָנֻסוּ
  choice: que … fuient
  rationale: Ce second imparfait a lui aussi une valeur volitive et forme un parallélisme avec la demande précédente.
- source_word: מְשַׂנְאֶיךָ
  choice: ceux qui te haïssent
  rationale: Cette expression naturelle en français préserve la caractérisation durable exprimée par le participe hébreu.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: La formule exprime ici la fuite des adversaires face à Yahweh et convient au contexte de marche et de combat.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Sens de l’impératif « Lève-toi » adressé à Dieu
  choice: Conserver l’image sans l’expliciter dans le corps du texte
  alternative: Interviens avec puissance
  rationale: L’impératif est un appel à l’action divine. Garder la métaphore respecte la forme poétique et théologique du texte, tandis qu’une note évite une lecture matériellement littérale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde le parallélisme poétique des deux demandes. « Se mettait en route » convient à l’arche portée lors des déplacements, et « fuient devant toi » conserve l’imagerie de la retraite face à la présence divine.
