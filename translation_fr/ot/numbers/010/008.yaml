  variant: modern international French
source:
  edition: WLC
  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: fr
  text: Les fils d’Aaron, les prêtres, sonneront des trompettes. Ce sera pour vous une prescription permanente[a], de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une prescription perpétuelle » ou « une prescription pour toujours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: Les fils d’Aaron
  rationale: Rend directement l’expression familiale hébraïque בְנֵי אַהֲרֹן dans un français naturel.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Conserve l’apposition qui identifie les fils d’Aaron comme les prêtres.
- source_word: יִתְקְעוּ בַּחֲצֹצְרֹת
  choice: sonneront des trompettes
  rationale: En contexte, תקע avec חֲצֹצְרוֹת signifie faire retentir ou sonner les trompettes. Le futur français exprime naturellement la prescription légale sans la transformer en impératif direct.
- source_word: וְהָיוּ לָכֶם
  choice: Ce sera pour vous
  rationale: Le pluriel hébreu renvoie formellement à ce qui précède, mais le démonstratif singulier résume idiomatiquement en français la disposition entière. Il évite aussi l’obscur « elles seront », dont le lien avec une « prescription » serait peu naturel.
- source_word: לְחֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: « Prescription » convient au registre juridique de חֻקָּה, tandis que « permanente » exprime la durée de עוֹלָם sans trancher au-delà de la portée possible de la formule hébraïque.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Expression française courante qui communique l’application continue aux générations successives.
theological_decisions:
- issue: Portée temporelle de חֻקַּת עוֹלָם
  choice: une prescription permanente
  alternative: une prescription perpétuelle ; une prescription pour toujours
  rationale: La formule indique une disposition durable dans la vie d’Israël. « Permanente » en préserve la force continue sans imposer à עוֹלָם un sens philosophique d’infinité absolue que le contexte ne précise pas.
- issue: Référent du pluriel וְהָיוּ
  choice: Ce sera pour vous
  alternative: Elles seront pour vous
  rationale: Le singulier français reprend l’ensemble de la règle énoncée, alors que le pluriel littéral pourrait sembler désigner seulement les trompettes et produire une construction sémantiquement maladroite avec « prescription ». L’ambiguïté grammaticale est traitée sans ajouter de doctrine.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination initiale, naturelle en hébreu narratif, n’est pas reproduite mécaniquement. La ponctuation en deux phrases allège la longue coordination tout en conservant le lien logique. « Trompettes » reste non qualifié, puisque « d’argent » appartient au contexte immédiat mais n’est pas répété dans ce verset.
