  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: fr
  text: Ils partirent pour la première fois, sur l’ordre de Yahweh, par l’intermédiaire de Moïse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse », expression qui présente Moïse comme intermédiaire ou agent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: ils partirent
  rationale: Dans le récit des déplacements, נסע désigne le fait de lever le camp et de se mettre en route. « Partirent » est naturel en français moderne et convient au début d’une étape.
- source_word: בָּרִאשֹׁנָה
  choice: pour la première fois
  rationale: La forme adverbiale indique ici le caractère inaugural de ce départ depuis le Sinaï.
- source_word: עַל פִּי
  choice: sur l’ordre de
  rationale: L’expression signifie littéralement « sur la bouche de », mais constitue un idiome exprimant la conformité à une directive ou à un commandement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּיַד מֹשֶׁה
  choice: transmis par Moïse
  rationale: Littéralement « par la main de Moïse », l’expression présente Moïse comme l’intermédiaire par lequel l’ordre divin est communiqué et exécuté.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » en conserve la fonction de nom propre.
- issue: Rôle de Moïse dans בְּיַד מֹשֶׁה
  choice: transmis par Moïse
  alternative: par l’intermédiaire de Moïse
  rationale: Ce rendu exprime l’agence médiatrice de Moïse sans laisser entendre qu’il est la source du commandement.
translation_notes:
  register: Français international moderne, clair et digne. « Ainsi » relie naturellement ce premier départ à la préparation décrite dans le contexte. La tournure conserve la distinction entre Yahweh, source de l’ordre, et Moïse, son intermédiaire.
