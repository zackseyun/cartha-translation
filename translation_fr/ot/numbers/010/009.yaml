id: NUM.10.9
reference: Numbers 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: fr
  text: Quand vous partirez en guerre dans votre pays contre l’ennemi qui vous opprime[a], vous sonnerez l’alarme avec les trompettes. Alors, vous serez présents à la mémoire de Yahweh, votre Dieu[b], et vous serez sauvés de vos ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si vous partez en guerre dans votre pays ». La conjonction hébraïque peut introduire une circonstance future ou une condition.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « vous serez rappelés à la mémoire de Yahweh, votre Dieu »; de façon plus explicite : « Yahweh, votre Dieu, se souviendra de vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Quand
  rationale: Dans cette instruction, וְכִי introduit naturellement une éventualité future. « Quand » convient au contexte tout en laissant en note la valeur conditionnelle possible.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: vous partirez en guerre
  rationale: Cette tournure idiomatique exprime l’engagement dans une guerre; « partir en guerre » est naturel en français et convient à la perspective d’Israël dans son pays.
- source_word: בְּאַרְצְכֶם
  choice: dans votre pays
  rationale: Le terme désigne ici le territoire où Israël demeure. « Pays » est clair en français moderne, sans imposer l’idée d’un État moderne.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: contre l’ennemi qui vous opprime
  rationale: « Ennemi » rend צַר de façon directe, tandis que « qui vous opprime » conserve la force participiale et hostile de צֹרֵר.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: vous sonnerez l’alarme avec les trompettes
  rationale: Le hiphil de רוע, associé aux trompettes, désigne un signal d’alarme militaire plutôt qu’un simple son puissant.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: on se souviendra de vous devant Yahweh votre Dieu
  rationale: La tournure impersonnelle française conserve le sens passif du niphal et l’expression « devant Yahweh », sans transformer explicitement Dieu en sujet grammatical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: vous serez sauvés de vos ennemis
  rationale: Le passif conserve le niphal de ישׁע; « sauvés » exprime ici la délivrance militaire tout en gardant la portée plus large du terme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Sujet implicite de וֲנִזְכַּרְתֶּם
  choice: on se souviendra de vous devant Yahweh votre Dieu
  alternative: Yahweh votre Dieu se souviendra de vous
  rationale: Le choix principal maintient la forme passive et la tension du texte hébreu, tandis que l’alternative explicite le sujet divin de manière interprétative.
- issue: Rapport entre le signal et le souvenir devant Dieu
  choice: Alors, on se souviendra de vous devant Yahweh
  alternative: les trompettes vous rappelleront au souvenir de Yahweh
  rationale: Le texte affirme la mise en mémoire devant Dieu sans détailler mécaniquement comment le signal produit cet effet; la traduction évite d’ajouter une explication.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme est divisé en deux phrases pour éviter une coordination excessivement lourde. « Sonner l’alarme » appartient au registre courant tout en exprimant précisément la fonction militaire des trompettes. La tournure impersonnelle « on se souviendra » préserve le passif hébreu, bien qu’elle soit légèrement moins solennelle que « vous serez rappelés au souvenir ».
