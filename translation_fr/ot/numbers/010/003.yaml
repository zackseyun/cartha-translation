  yaml_path: translation/ot/numbers/010/003.yaml
  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: fr
  text: Quand on en sonnera, toute la communauté se rassemblera auprès de toi, à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתָקְעוּ בָהֵן
  choice: Quand on en sonnera
  rationale: 'Dans cette séquence d’instructions, la forme verbale a une valeur temporelle : le signal déclenche le rassemblement. Le pronom féminin pluriel renvoie aux deux trompettes du verset précédent; en français, « en sonner » est idiomatique.'
- source_word: וְנוֹעֲדוּ
  choice: se rassemblera
  rationale: Le niphal de יעד exprime ici le fait de se réunir en réponse à une convocation. Le singulier s’accorde naturellement avec le collectif « toute la communauté ».
- source_word: אֵלֶיךָ
  choice: auprès de toi
  rationale: L’hébreu signifie littéralement « vers toi ». « Auprès de toi » conserve l’orientation vers Moïse tout en exprimant naturellement le rassemblement en sa présence.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne collectivement la communauté d’Israël. « Toute la communauté » est clair, actuel et adapté au contexte du livre des Nombres.
- source_word: פֶּתַח
  choice: l’entrée
  rationale: Le terme désigne l’ouverture permettant d’accéder à la tente; « l’entrée » est la formulation française la plus naturelle.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction garde le lien lexical avec la rencontre fixée ou assignée, tout en restant compréhensible et digne en français moderne.
