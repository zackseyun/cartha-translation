  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: fr
  text: Les fils d’Israël[a] partirent du désert du Sinaï, par étapes, et le nuage s’arrêta dans le désert de Paran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Israélites ». L’hébreu dit littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partirent
  rationale: Dans ce récit de déplacement, נסע désigne le fait de lever le camp et de se mettre en route. « Partirent » est naturel en français moderne et convient avec le complément indiquant le point de départ.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation rend explicitement l’expression familiale masculine du texte hébreu. L’équivalent collectif plus idiomatique « les Israélites » est indiqué en note.
- source_word: לְמַסְעֵיהֶם
  choice: par étapes
  rationale: Le pluriel מַסָּע désigne ici les étapes successives de leur déplacement. « Par étapes » exprime clairement cette progression sans lourdeur.
- source_word: מִמִּדְבַּר סִינָי
  choice: du désert du Sinaï
  rationale: « Désert » est le terme français courant pour מִדְבָּר dans ce contexte géographique, sans imposer une description précise du terrain.
- source_word: וַיִּשְׁכֹּן
  choice: s’arrêta
  rationale: Avec le nuage comme sujet et dans un récit de marche, שכן indique qu’il vient demeurer ou se fixer à un endroit. « S’arrêta » rend naturellement cette halte tout en évitant une tournure archaïque.
- source_word: הֶעָנָן
  choice: le nuage
  rationale: L’article défini renvoie au nuage déjà connu qui guide le peuple. « Nuage » est plus courant en français moderne que le traditionnel « nuée ».
- source_word: בְּמִדְבַּר פָּארָן
  choice: dans le désert de Parân
  rationale: La préposition situe l’arrêt du nuage dans cette région; le nom propre hébreu est rendu selon sa forme française usuelle.
theological_decisions:
- issue: Rendu de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Aucun différend doctrinal n’est en jeu. Le texte principal conserve l’expression familiale masculine explicite de l’hébreu, tandis que la note fournit le collectif français plus idiomatique.
translation_notes:
  register: Français international moderne, simple et digne. « Nuage » a été préféré à « nuée », plus traditionnel et littéraire; « par étapes » conserve le caractère successif des déplacements.
