source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: fr
  text: Quand Moïse entra dans la tente de la rencontre pour parler avec lui, il entendit la voix qui lui parlait d’au-dessus du propitiatoire[a] placé sur l’arche du témoignage, d’entre les deux chérubins. Et il lui parla[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « propitiatoire » est le couvercle de l’arche, d’au-dessus duquel le Seigneur parlait, d’entre les chérubins.
    reason: cultural_note
  - marker: b
    text: Le sujet de « il lui parla » n’est pas exprimé en hébreu. Dans le contexte, il peut désigner le Seigneur; on peut aussi comprendre que « la voix » est le sujet. La grammaire permettrait également de rapporter le verbe à Moïse, mais le contexte favorise les premières lectures.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: Quand Moïse entrait
  rationale: La préposition ב avec l’infinitif construit de בוא forme une proposition temporelle. L’imparfait français convient à l’aspect itératif ou habituel suggéré dans ce verset récapitulatif, sans exclure une occurrence particulière.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rendu français courant et transparent de la désignation du sanctuaire, où Dieu rencontre son peuple et communique avec lui.
- source_word: לְדַבֵּר אִתּוֹ
  choice: pour parler avec lui
  rationale: « Avec lui » conserve le pronom hébreu et la nuance relationnelle de אֵת après דבר, sans préciser explicitement son référent.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: il entendait la voix
  rationale: קוֹל peut désigner un son ou une voix; le participe « parlant » et le contexte de révélation favorisent « voix ».
- source_word: מִדַּבֵּר
  choice: qui lui parlait
  rationale: Le participe hitpael inhabituel est naturellement compris ici avec une valeur active ou réciproque. Cette formulation française exprime le sens le plus direct tout en évitant une tournure artificielle comme « la voix se parlant ».
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: d’au-dessus du propitiatoire
  rationale: כַּפֹּרֶת désigne le couvercle cultuel de l’arche. « Propitiatoire » est le terme français consacré et permet de conserver sa portée cultuelle; une note en explique la réalité matérielle.
- source_word: אֲרֹן הָעֵדֻת
  choice: l’arche du témoignage
  rationale: Cette traduction traditionnelle conserve la dimension juridique et testimoniale des tables placées dans l’arche.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: entre les deux chérubins
  rationale: « Chérubins » est la forme française usuelle pour ces êtres célestes associés au sanctuaire. Le point de départ de la voix est déjà indiqué par « d’au-dessus ».
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Et elle lui parlait
  rationale: Le féminin « elle » reprend naturellement « la voix » en français et préserve l’implicite du sujet hébreu, sans ajouter « le Seigneur ». L’imparfait maintient la lecture habituelle de la scène.
theological_decisions:
- issue: Référent de « lui » dans « pour parler avec lui »
  choice: Le pronom reste implicite, comme en hébreu, et renvoie vraisemblablement au Seigneur.
  alternative: Expliciter « pour parler avec le Seigneur ».
  rationale: Le contexte identifie clairement l’interlocuteur divin, mais le texte hébreu emploie seulement un pronom. Le conserver évite une explicitation non nécessaire.
- issue: Sujet de la proposition finale וַיְדַבֵּר אֵלָיו
  choice: « Elle », reprenant grammaticalement « la voix », parle à Moïse.
  alternative: « Il lui parlait », avec le Seigneur comme sujet implicite; ou « Moïse lui parlait ».
  rationale: Le sujet hébreu n’est pas exprimé. La voix est l’antécédent immédiat et constitue la lecture syntaxique la plus naturelle, tout en représentant la parole personnelle de Dieu. La note signale les autres possibilités sans trancher plus que le texte.
- issue: Valeur temporelle de la scène
  choice: 'Lecture habituelle: « entrait », « entendait », « parlait ».'
  alternative: 'Lecture ponctuelle au passé simple: « entra », « entendit », « parla ».'
  rationale: Dans ce verset conclusif, la construction temporelle et la séquence verbale peuvent décrire ce qui se produisait lorsque Moïse entrait dans la tente. L’hébreu permet toutefois une narration ponctuelle, d’où la préservation de cette possibilité dans l’analyse sans surcharge de la traduction.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’hébreu sans devenir raide. « Propitiatoire » est conservé comme terme biblique précis, accompagné d’une explication. Les minuscules sont employées pour les désignations communes du mobilier et du sanctuaire.
