base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: fr
  text: 'et pour le sacrifice de communion[a] : deux bovins, cinq béliers, cinq boucs et cinq agneaux âgés d’un an. Telle fut l’offrande d’Ahiézer, fils d’Ammishaddaï.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: La conjonction et la préposition introduisent le dernier élément de la liste. « Sacrifice de communion » rend le terme cultuel שְׁלָמִים de manière naturelle, tout en laissant en note ses autres nuances possibles.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר désigne le gros bétail sans préciser ici le sexe; « bovins » évite de surinterpréter par « bœufs ».
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne clairement des béliers dans cette liste sacrificielle.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne spécifiquement des caprins mâles; « boucs » est le terme français courant et précis.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux âgés d’un an
  rationale: La formulation restitue naturellement l’expression hébraïque « fils d’un an » et conserve l’indication d’âge pertinente pour le sacrifice.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Le passé convient au récit d’offrandes déjà présentées, et « offrande » rend correctement קָרְבָּן dans ce contexte.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiézer, fils d’Ammishaddaï
  rationale: Les noms propres sont translittérés en suivant les conventions françaises, et בֶּן est rendu directement par « fils de ».
theological_decisions:
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Le terme peut évoquer la paix, l’intégrité ou la communion liée au repas sacrificiel. Le texte retient une désignation française intelligible sans exclure les autres nuances, signalées en note.
translation_notes:
  register: Français moderne, clair et digne. La structure énumérative du texte hébreu est conservée, avec une ponctuation naturelle. Le terme technique שְׁלָמִים est rendu dans le texte et ses principales variantes sont données en note.
