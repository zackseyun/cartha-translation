  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/027.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: fr
  text: un taureau du gros bétail[a], un bélier, un agneau mâle d’un an[b], pour l’holocauste ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un taureau, fils du gros bétail ». Cette expression hébraïque désigne un bovin appartenant au troupeau, souvent compris comme un jeune taureau.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un agneau mâle, fils de son année », c’est-à-dire âgé d’un an ou dans sa première année.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: taureau
  rationale: Terme français naturel et précis pour le bovin mâle offert en sacrifice ; le nom hébreu n’impose pas à lui seul de traduire « jeune taureau ».
- source_word: אֶחָד
  choice: un
  rationale: La répétition du numéral est conservée pour respecter la forme énumérative du texte hébreu.
- source_word: בֶּן בָּקָר
  choice: du gros bétail
  rationale: L’expression hébraïque signifie littéralement « fils du gros bétail » et classe l’animal parmi les bovins. « Du gros bétail » reste naturel en français dans ce contexte rituel.
- source_word: אַיִל
  choice: bélier
  rationale: Équivalent français usuel du mâle adulte de l’espèce ovine dans les listes sacrificielles.
- source_word: כֶּבֶשׂ
  choice: agneau mâle
  rationale: Le terme hébreu désigne spécifiquement un jeune ovin mâle ; « mâle » préserve cette précision lexicale.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: Cette expression idiomatique indique que l’animal est âgé d’un an ou se trouve dans sa première année ; « d’un an » est la formulation française la plus concise et naturelle.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: « Holocauste » est le terme français biblique courant pour l’offrande entièrement brûlée ; la préposition « pour » exprime ici la destination sacrificielle.
theological_decisions: []
