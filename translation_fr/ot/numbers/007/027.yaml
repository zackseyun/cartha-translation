  register: Français international moderne, sobre et digne. La structure répétitive de l’inventaire sacrificiel est maintenue. « Gros bétail » distingue naturellement les bovins du petit bétail, tandis que les notes rendent visibles les deux idiomes hébreux sans alourdir le verset.
