  text: un bouc comme sacrifice pour le péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: Dans ce contexte sacrificiel, l’expression désigne un caprin mâle. « Bouc » exprime naturellement en français à la fois l’espèce et le sexe; l’article indéfini rend ici le numéral אֶחָד sans lourdeur.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral explicite est conservé par « un », qui fonctionne à la fois comme déterminant numéral et comme article dans cette brève liste d’offrandes.
- source_word: לְחַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: Dans cette liste cultuelle, חַטָּאת désigne le sacrifice offert à propos du péché, non le péché abstrait. Cette formulation française reste claire et évite de suggérer que le sacrifice lui-même serait pécheur.
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice d’expiation
  rationale: Le contexte exige le nom d’un sacrifice plutôt que le sens abstrait « péché ». « Sacrifice pour le péché » demeure proche du texte et n’explicite pas davantage le mécanisme théologique, tandis que « sacrifice d’expiation » introduirait une interprétation plus précise que le terme hébreu seul.
translation_notes:
  register: Formulation brève, digne et naturelle, adaptée au caractère inventorial du passage. « Bouc » est le terme français courant et précis pour un caprin mâle.
