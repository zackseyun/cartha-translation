lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: un taureau pris dans le gros bétail
  rationale: Dans le contexte sacrificiel, פַּר désigne un taureau, tandis que בֶּן בָּקָר précise qu’il appartient au gros bétail. Cette formulation naturelle conserve les deux éléments sans calquer l’expression hébraïque.
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: אַיִל est le terme courant pour un mouton mâle adulte, notamment dans les listes de sacrifices.
- source_word: כֶּבֶשׂ אֶחָד
  choice: un agneau mâle
  rationale: כֶּבֶשׂ désigne ici un jeune mouton mâle. La précision « mâle » rend explicite la valeur lexicale du terme.
- source_word: בֶּן שְׁנָתוֹ
  choice: âgé d’un an
  rationale: Cette expression idiomatique indique l’âge prescrit de l’animal. « Âgé d’un an » est clair et naturel en français moderne.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: עֹלָה est le terme sacrificiel traditionnellement rendu par « holocauste », offrande entièrement brûlée. La préposition « pour » convient à la structure énumérative du verset.
