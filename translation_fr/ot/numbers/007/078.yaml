  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: fr
  text: Le douzième jour, le responsable des fils de Nephtali était Ahira, fils d’Énân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: Le douzième jour
  rationale: La construction hébraïque exprime ici une date ordinale. « Le douzième jour » est la formulation temporelle naturelle en français et conserve la formule répétée du chapitre.
- source_word: נָשִׂיא
  choice: responsable
  rationale: Dans ce contexte tribal, le terme désigne celui qui exerce une fonction reconnue à la tête du groupe. « Responsable » est clair et actuel, sans suggérer à tort un statut royal comme pourrait le faire « prince ».
- source_word: לִבְנֵי נַפְתָּלִי
  choice: des fils de Nephtali
  rationale: Le lamed indique ici le groupe auquel se rattache le responsable. « Des fils de Nephtali » garde la désignation tribale masculine explicite du texte hébreu.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Le nom propre est translittéré plutôt que traduit.
- source_word: בֶּן עֵינָן
  choice: fils d’Énân
  rationale: La construction patronymique hébraïque est rendue directement; l’élision française devant le nom est naturelle.
theological_decisions:
- issue: Désignation tribale genrée בְּנֵי
  choice: fils de Nephtali
  alternative: descendants de Nephtali
  rationale: Le substantif hébreu est explicitement masculin pluriel et sert de désignation tribale. La traduction conserve cette forme plutôt que de la neutraliser.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase brève reproduit la formule administrative et liturgique répétée dans le passage; les noms propres suivent une graphie française lisible.
