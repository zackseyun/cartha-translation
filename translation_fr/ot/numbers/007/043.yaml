  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande était un plat d’argent[a] pesant cent trente sicles, et un bassin d’argent[b] pesant soixante-dix sicles, selon le sicle du sanctuaire[c] ; tous deux étaient remplis de fleur de farine mélangée à de l’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une écuelle » pour קַעֲרָה.
    reason: lexical_alternative
  - marker: b
    text: Ou « une coupe » pour מִזְרָק, récipient employé dans le service rituel.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « d’après le sicle du sanctuaire », c’est-à-dire selon l’étalon de poids du sanctuaire.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande était
  rationale: Dans ce contexte cultuel, קָרְבָּן désigne ce qui est présenté comme offrande. Le verbe « était », sous-entendu dans la proposition nominale hébraïque, rend la phrase naturelle en français.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קַעֲרָה désigne un récipient large de type plat ou écuelle. « Plat » est clair, actuel et convient au mobilier cultuel sans préciser indûment sa forme.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: Cette tournure française exprime naturellement l’indication hébraïque du poids tout en conservant l’unité de mesure.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin d’argent
  rationale: מִזְרָק est un récipient rituel, parfois associé à l’aspersion. « Bassin » reste suffisamment général et n’ajoute pas une fonction qui n’est pas explicitée ici.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: Le sens pondéral implicite est explicité en français pour éviter qu’on comprenne une valeur monétaire.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La formule renvoie à l’étalon de poids en vigueur au sanctuaire. La traduction conserve le terme concret « sicle » et le lien avec le sanctuaire.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: tous deux étaient remplis
  rationale: La formulation reprend explicitement la référence aux deux récipients et rend naturellement l’adjectif hébreu « pleins ».
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: סֹלֶת désigne la farine fine de qualité utilisée dans les offrandes. « Fleur de farine » est une expression française précise et bien établie.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe indique que la farine a été intimement mélangée avec de l’huile. « Pétrie à l’huile » est idiomatique dans ce contexte alimentaire et cultuel.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans la législation sacerdotale, מִנְחָה désigne précisément l’offrande non sanglante faite de produits céréaliers. Cette traduction en préserve la spécificité.
