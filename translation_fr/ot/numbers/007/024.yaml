  text: בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/024.yaml
  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: fr
  text: Le troisième jour, le chef des fils de Zabulon[a] était Éliab, fils de Hélon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef pour les fils de Zabulon ». La préposition hébraïque peut marquer ici soit l’appartenance, soit la représentation.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: Cette formule temporelle narrative se rend naturellement ainsi en français moderne.
- source_word: נָשִׂיא
  choice: chef
  rationale: Dans ce contexte, le terme désigne le responsable reconnu d’une tribu. « Chef » exprime cette fonction officielle sans la connotation royale que pourrait avoir « prince ».
- source_word: לִבְנֵי
  choice: des fils de
  rationale: Le ל peut exprimer ici l’appartenance ou la représentation. « Des fils de » conserve la formulation généalogique et l’affiliation tribale, tout en laissant l’autre lecture en note.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française traditionnelle et largement reconnue du nom de la tribu.
- source_word: אֱלִיאָב
  choice: Éliab
  rationale: Forme française usuelle du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu direct de la formule patronymique hébraïque.
- source_word: חֵלֹן
  choice: Hélon
  rationale: Forme française usuelle du nom propre.
theological_decisions: []
