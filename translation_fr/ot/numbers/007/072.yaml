source:
  edition: WLC
  text: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/072.yaml
  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: fr
  text: Le onzième jour, ce fut le chef des fils d’Aser, Paguiël, fils d’Okrân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם
  choice: Le onzième jour
  rationale: La formulation hébraïque répète littéralement « jour », selon la formule narrative de Nombres 7. Le français naturel exprime ici la valeur ordinale par « le onzième jour ».
- source_word: נָשִׂיא
  choice: chef
  rationale: Dans ce contexte, le terme désigne le chef reconnu d’une tribu. « Chef » est clair et évite la connotation royale que pourrait avoir « prince ».
- source_word: לִ/בְנֵ֣י אָשֵׁ֑ר
  choice: des fils d’Aser
  rationale: Cette expression conserve l’image hébraïque de la descendance tout en indiquant l’appartenance tribale; « Aser » est la forme française traditionnelle et intelligible du nom.
- source_word: פַּגְעִיאֵ֖ל
  choice: Paguiël
  rationale: Translittération française usuelle du nom hébreu, avec le tréma signalant la prononciation distincte des voyelles.
- source_word: בֶּן עָכְרָֽן
  choice: fils d’Okrân
  rationale: Le patronyme hébreu est rendu directement par « fils de »; « Okrân » représente le nom hébreu en translittération française.
theological_decisions:
- issue: Phrase nominale sans verbe explicite
  choice: ce fut le chef des fils d’Aser
  alternative: le chef des fils d’Aser était
  rationale: L’hébreu juxtapose la date, la fonction et le nom sans verbe exprimé. « Ce fut » restitue naturellement en français la succession des chefs dans la série des offrandes sans ajouter une action absente de ce verset.
translation_notes:
  register: Français moderne, sobre et digne. La tournure « ce fut » maintient le caractère formulaire de l’énumération tout en rendant la phrase nominale hébraïque idiomatique.
