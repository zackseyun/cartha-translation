  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande comprenait un plat d’argent[a] pesant cent trente sicles, et un bassin d’argent[b] pesant soixante-dix sicles, selon le sicle du sanctuaire[c] ; tous deux étaient remplis de fleur de farine mélangée à de l’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une écuelle » ; le terme hébreu désigne un récipient peu profond.
    reason: lexical_alternative
  - marker: b
    text: Ou « une coupe » ; il s’agit d’un récipient utilisé dans le service du sanctuaire.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire selon l’étalon de poids officiel du sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande comprenait
  rationale: קָרְבָן désigne ici l’offrande cultuelle présentée. Le verbe « comprenait », ajouté en français, introduit naturellement la liste nominale sans modifier son contenu.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קַעֲרָה désigne un récipient relativement peu profond. « Plat » convient au contexte d’inventaire cultuel et reste courant en français.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: 'L’hébreu dit littéralement « son poids : trente et cent ». La tournure participiale est naturelle en français et conserve explicitement l’idée de poids.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: une coupe d’argent
  rationale: מִזְרָק désigne un récipient employé dans le service sacrificiel. « Coupe » marque un second type de récipient sans lui attribuer une fonction non explicitée dans ce verset.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: Le syntagme indique le poids de la coupe ; « pesant » rend cette relation explicite et idiomatique.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La formule précise l’étalon de poids employé. Cette traduction demeure proche de l’hébreu tout en étant naturelle.
- source_word: שְׁנֵיהֶם
  choice: tous deux
  rationale: La forme renvoie explicitement aux deux récipients et souligne qu’ils avaient le même contenu.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: סֹלֶת est la farine fine de qualité utilisée dans les offrandes. « Fleur de farine » est l’expression française précise et traditionnelle, encore intelligible.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe décrit la farine mélangée à de l’huile. « Pétrie à l’huile » est idiomatique dans le contexte alimentaire et sacrificiel, sans archaïsme inutile.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne spécifiquement une offrande non animale préparée à partir de céréales.
