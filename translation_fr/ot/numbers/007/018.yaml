  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: fr
  text: Le deuxième jour, Netanel, fils de Tsouar, chef d’Issacar, présenta son offrande[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « présenta »; les mots « son offrande » sont ajoutés d’après le contexte répétitif de Nombres 7, où chaque chef de tribu présente une offrande.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour
  rationale: Rend directement la locution temporelle formée de בְּ, « en/à », de יוֹם, « jour », et de l’ordinal « deuxième », sans préciser un événement que ce verset ne nomme pas.
- source_word: הִקְרִיב
  choice: présenta son offrande
  rationale: Le hiphil de קרב signifie ici « présenter » ou « apporter » dans un contexte cultuel. Le complément « son offrande », absent de ce verset en hébreu, est explicité d’après la formule répétée et le contexte immédiat de Nombres 7 afin d’obtenir une phrase française naturelle; cet ajout est signalé en note.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Translittération française moderne du nom hébreu, sans ajouter de valeur interprétative.
- source_word: בֶּן צוּעָר
  choice: fils de Tsouar
  rationale: Rend littéralement la construction généalogique hébraïque usuelle.
- source_word: נְשִׂיא
  choice: chef
  rationale: Dans le contexte tribal, le terme désigne un responsable reconnu. « Chef » est clair et évite la connotation royale moderne de « prince ».
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forme française biblique courante du nom de la tribu.
