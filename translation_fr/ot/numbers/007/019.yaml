  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: fr
  text: 'Il présenta son offrande : un plat d’argent[a] pesant cent trente sicles ; un bassin[b] d’argent pesant soixante-dix sicles, selon le sicle du sanctuaire[c] ; tous deux remplis de fleur de farine mélangée à l’huile, pour une offrande de céréales.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un plat creux d’argent » pour קַעֲרַת כֶּסֶף.
    reason: lexical_alternative
  - marker: b
    text: Ou « un bol » pour מִזְרָק.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « d’après le sicle du sanctuaire », c’est-à-dire selon l’étalon de poids sacré.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב אֶת־קָרְבָּנוֹ
  choice: Il présenta son offrande
  rationale: Dans ce contexte cultuel, le hifil de קרב désigne l’action d’apporter ou de présenter une offrande. « Présenta son offrande » rend naturellement la formule cérémonielle sans répétition maladroite.
- source_word: קַעֲרַת כֶּסֶף
  choice: un plat d’argent
  rationale: קַעֲרָה désigne ici un récipient relativement peu profond. « Plat » convient à l’inventaire du sanctuaire, tandis que « coupe » demeure une possibilité lexicale signalée en note.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: Cette formulation française fluide conserve le poids explicitement attribué au plat par le suffixe féminin hébreu.
- source_word: מִזְרָק
  choice: bassin
  rationale: Le terme désigne un récipient employé dans le culte. « Bassin » garde le registre formel approprié, avec « bol » comme autre traduction possible.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La phrase précise que les poids sont calculés d’après l’étalon officiel du sanctuaire. La traduction conserve la terminologie cultuelle de l’hébreu.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: tous deux remplis
  rationale: Cette expression reprend explicitement les deux récipients et restitue de manière concise leur remplissage commun.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française consacrée et précise pour la farine raffinée destinée aux offrandes.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie avec de l’huile
  rationale: בלל décrit la farine incorporée ou mélangée à l’huile. « Pétrie avec de l’huile » est naturel dans le contexte d’une préparation farineuse sacrificielle.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne spécifiquement l’offrande non animale préparée à partir de farine, et non une offrande générique.
