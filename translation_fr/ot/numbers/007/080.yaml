lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans ce contexte cultuel, le mot désigne un petit récipient destiné à contenir l’encens. « Coupe » est naturel en français moderne et évite le sens trompeur de « cuillère ».
- source_word: אַחַת
  choice: une
  rationale: Numéral cardinal accordé avec le nom féminin « coupe ».
- source_word: עֲשָׂרָה זָהָב
  choice: en or de dix sicles
  rationale: La formule elliptique indique le matériau du récipient et son poids. L’unité « sicles » est sous-entendue d’après la formule récurrente des offrandes dans ce chapitre.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: Adjectif prédicatif décrivant le contenu du récipient ; cette formulation est concise et naturelle.
- source_word: קְטֹרֶת
  choice: encens
  rationale: Équivalent usuel dans le contexte sacerdotal et cultuel.
