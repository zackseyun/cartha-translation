revisions:
- from: 'Le jour où Moïse eut achevé de dresser le tabernacle[a], il lui donna l’onction et le consacra, ainsi que tout son mobilier. Il fit de même pour l’autel et tous ses ustensiles : il leur donna l’onction et les consacra.'
  to: Le jour où Moïse eut achevé de dresser le tabernacle[a], il l’oignit et le consacra, ainsi que tout son mobilier, l’autel et tous ses ustensiles ; il les oignit et les consacra.
  rationale: 'La révision restitue les deux occurrences de l’onction et de la consécration, au lieu de les résumer par « il fit de même ». Elle maintient l’ambiguïté du pronom pluriel final : « les » renvoie aux objets énumérés sans en imposer une délimitation interprétative plus étroite que celle de l’hébreu. La note reste appropriée et son ancre est conservée.'
