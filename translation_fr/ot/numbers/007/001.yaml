  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: fr
  text: Le jour où Moïse eut achevé de dresser le tabernacle[a], il l’oignit et le consacra, ainsi que tout son mobilier, l’autel et tous ses ustensiles ; il les oignit et les consacra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le « tabernacle » est le sanctuaire mobile, ou demeure sacrée, d’Israël dans le désert. On peut aussi traduire le début : « Quand Moïse eut achevé de dresser le tabernacle ».'
    reason: Clarification lexicale et autre formulation possible de l’expression temporelle hébraïque.
lexical_decisions:
- source_word: וַיְהִי בְּיוֹם כַּלּוֹת
  choice: Le jour où … eut achevé
  rationale: La formule narrative וַיְהִי, suivie de l’expression temporelle בְּיוֹם כַּלּוֹת, établit ici le cadre temporel. Le français peut l’intégrer naturellement sans calquer « et il arriva ».
- source_word: לְהָקִים
  choice: de dresser
  rationale: Le hiphil de קום désigne ici l’action de monter ou d’ériger le sanctuaire. « Dresser » convient idiomatiquement à une structure de tente.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme français traditionnel et précis pour le sanctuaire mobile du désert; une note explicite son sens concret.
- source_word: וַיִּמְשַׁח
  choice: il lui donna l’onction
  rationale: משׁח décrit l’application rituelle d’huile. Cette formulation française garde clairement la portée cultuelle et évite l’ambiguïté moderne possible de « oindre ».
- source_word: וַיְקַדֵּשׁ
  choice: le consacra
  rationale: Dans ce contexte cultuel, קדשׁ signifie mettre à part pour un usage saint. « Consacrer » exprime cette dédicace rituelle sans suggérer une transformation morale.
- source_word: כָּל כֵּלָיו
  choice: tout son mobilier
  rationale: Pour l’ensemble du tabernacle, כֵּלִים englobe les objets et équipements du sanctuaire; « mobilier » est plus large et naturel que « ustensiles ».
- source_word: הַמִּזְבֵּחַ וְאֶת כָּל כֵּלָיו
  choice: l’autel et tous ses ustensiles
  rationale: Pour l’autel, le même nom כֵּלִים vise plus précisément les instruments employés à son service; « ustensiles » rend bien cette nuance contextuelle.
- source_word: וַיִּמְשָׁחֵם וַיְקַדֵּשׁ אֹתָם
  choice: il leur donna l’onction et les consacra
  rationale: Les pronoms pluriels hébreux sont conservés. La reprise française après les deux ensembles coordonnés reste volontairement générale.
theological_decisions:
- issue: Terminologie de la sainteté cultuelle
  choice: consacra
  alternative: sanctifia / rendit saints
  rationale: Le texte parle de la mise à part rituelle d’objets destinés au culte. « Consacra » préserve ce sens sans déplacer l’énoncé vers la transformation morale.
- issue: Portée des pronoms pluriels finaux
  choice: Reprise générale par « leur » et « les »
  alternative: Les rapporter uniquement à l’autel et à ses ustensiles
  rationale: La syntaxe permet de comprendre la reprise comme un résumé des éléments mentionnés, tandis que sa portée exacte n’est pas explicitée. La traduction ne la restreint donc pas artificiellement.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase d’ouverture est restructurée selon l’usage français, tout en conservant la relation temporelle et les répétitions rituelles significatives du texte hébreu.
