    issue: « Il lui donna l’onction » est une périphrase moins précise que le verbe rituel français usuel.
    rationale: Le verbe « oindre » rend directement משח et s’applique naturellement dans un contexte de consécration cultuelle; il évite d’affaiblir la répétition verbale de l’original.
