lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans ce contexte d’offrandes destinées au sanctuaire, le terme désigne un petit récipient. « Coupe » est naturel en français moderne et évite l’image d’une cuillère de table.
- source_word: אַחַת
  choice: une
  rationale: Le cardinal s’accorde avec le nom féminin « coupe ».
- source_word: עֲשָׂרָה זָהָב
  choice: pesant dix sicles
  rationale: Le texte hébreu dit littéralement « dix [d’]or », mais l’unité de poids est sous-entendue d’après la formule répétée dans les versets voisins. Le participe « pesant » explicite clairement le rapport entre le récipient et son poids.
- source_word: זָהָב
  choice: en or
  rationale: Indique la matière dont la coupe est faite.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: Adjectif prédicatif décrivant le contenu du récipient.
- source_word: קְטֹרֶת
  choice: encens
  rationale: Terme français courant pour la substance aromatique offerte dans le culte du sanctuaire.
