- source_word: זָהָב
  choice: en or
  rationale: Indique la matière dont le récipient est fait ; « en or » est la formulation française idiomatique.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: Adjectif prédicatif décrivant le contenu du récipient, rendu de manière concise et naturelle.
- source_word: קְטֹרֶת
  choice: encens
  rationale: Terme français courant pour la substance aromatique offerte dans le culte.
