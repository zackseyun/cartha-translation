  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande consistait en un plat d’argent[a] pesant cent trente sicles, et un bassin d’argent pesant soixante-dix sicles, selon le sicle du sanctuaire[b] ; tous deux étaient remplis de fleur de farine mêlée d’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coupe » ; le mot hébreu désigne ici un récipient peu profond en argent.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire selon l’étalon de poids en usage dans le sanctuaire.
    reason: clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande consistait en
  rationale: קָרְבָּן désigne ici le don cultuel présenté. « Offrande » est le terme français courant et précis ; « consistait en » rend naturelle la proposition nominale hébraïque et introduit l’inventaire.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קְעָרָה désigne un récipient relativement peu profond. « Plat » convient à cet objet du mobilier cultuel sans lui attribuer une forme plus précise que ne le permet le texte.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: La tournure participiale est naturelle en français et exprime clairement le poids du plat, tout en conservant la concision de l’inventaire.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin d’argent
  rationale: מִזְרָק est un récipient rituel ; « bassin » le distingue du plat précédent et convient au contexte du sanctuaire.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: Le syntagme indique le poids du bassin. La répétition de « pesant » lève toute ambiguïté en français.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition ב indique ici la norme de mesure. Cette formulation conserve la référence explicite à l’étalon sacré sans moderniser la valeur.
- source_word: שְׁנֵיהֶם
  choice: tous deux
  rationale: Cette expression reprend explicitement les deux récipients et restitue avec concision le pronom duel de sens.
- source_word: מְלֵאִים
  choice: étaient remplis de
  rationale: Le prédicat décrit le contenu des deux récipients. « Étaient remplis de » est naturel en français et maintient le sens statif.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: סֹלֶת désigne la farine fine de qualité employée dans les offrandes. « Fleur de farine » est l’expression cultuelle française consacrée et reste intelligible.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie avec de l’huile
  rationale: Le participe passif décrit la farine mêlée à l’huile. Dans ce contexte alimentaire et cultuel, « pétrie avec » exprime naturellement le mélange, sans suggérer une simple juxtaposition.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne spécifiquement l’offrande non animale préparée à base de farine. « Offrande de céréales » conserve cette distinction cultuelle.
