  rationale: Le numéral est explicite et doit être conservé dans le style répétitif de l’inventaire. En français, « un bouc » exprime naturellement à la fois le nombre et l’indéfini.
- source_word: לְחַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne l’offrande ou le sacrifice rituel lié au péché, et non simplement le péché abstrait. Cette formulation reste compréhensible tout en distinguant la fonction sacrificielle.
