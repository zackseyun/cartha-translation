source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande consistait en un plat d’argent[a], dont le poids était de cent trente sicles, et un bassin d’argent[b] de soixante-dix sicles, selon le sicle du sanctuaire[c]. Tous deux étaient remplis de fleur de farine mélangée à de l’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un plat creux » ; le terme hébreu désigne ici un récipient peu profond.
    reason: lexical_alternative
  - marker: b
    text: Ou « une coupe » ; il s’agit d’un récipient employé dans le culte.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire selon l’étalon de poids en vigueur au sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande était composée de
  rationale: קָרְבָּן désigne ici ce qui est présenté à Dieu dans le cadre du culte. La tournure française introduit naturellement la liste des objets sans changer leur fonction cultuelle.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat en argent
  rationale: קַעֲרָה désigne un récipient relativement peu profond. « Plat » convient à cet inventaire cultuel et reste courant en français moderne.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: dont le poids était de cent trente sicles
  rationale: 'Cette formulation restitue explicitement l’hébreu « son poids : cent trente » dans un français naturel.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin en argent
  rationale: מִזְרָק est un récipient employé dans le service sacrificiel. « Bassin » évoque mieux ce vase rituel que le terme plus domestique « bol ».
- source_word: שִׁבְעִים שֶׁקֶל
  choice: de soixante-dix sicles
  rationale: Dans cette liste de poids, la formulation concise indique sans ambiguïté le poids du bassin.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: L’expression indique que les poids sont calculés d’après l’étalon officiel du sanctuaire, tout en conservant la formulation cultuelle de l’hébreu.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Tous deux étaient remplis
  rationale: La traduction conserve l’accent explicite mis par l’hébreu sur les deux récipients.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: סֹלֶת désigne une farine fine de qualité employée dans les offrandes. « Fleur de farine » est précis, compréhensible et adapté au registre biblique.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mélangée à de l’huile
  rationale: Le participe passif exprime la préparation de la farine par mélange avec de l’huile. Cette formulation est directe et actuelle.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne l’offrande non animale préparée à partir de farine. « Offrande de céréales » est clair et la distingue des autres sacrifices.
