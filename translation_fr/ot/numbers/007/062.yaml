  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: fr
  text: une coupe en or de dix sicles[a], pleine d’encens ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « une coupe, dix en or, pleine d’encens » ; l’unité de poids « sicles » est sous-entendue d’après la formule d’offrande récurrente en Nombres 7.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans cet inventaire cultuel, le terme désigne un petit récipient destiné à contenir l’encens. « Coupe » est naturel en français moderne et convient mieux ici que le sens littéral « paume » ou que « cuillère ».
- source_word: אַחַת
  choice: une
  rationale: Le numéral indique simplement qu’il s’agit d’un seul récipient.
- source_word: עֲשָׂרָה זָהָב
  choice: en or de dix sicles
  rationale: Le mot « sicle » n’apparaît pas dans cette formule abrégée, mais il est sous-entendu d’après la formule complète récurrente de Nombres 7. La tournure française exprime à la fois la matière du récipient et son poids.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: L’adjectif féminin s’accorde avec le récipient et se rend naturellement par « pleine de ».
- source_word: קְטֹרֶת
  choice: encens
  rationale: C’est le terme français courant pour la substance aromatique employée dans le culte.
