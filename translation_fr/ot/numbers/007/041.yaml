  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: fr
  text: 'et, pour le sacrifice de communion[a] : deux bovins[b], cinq béliers, cinq boucs et cinq agneaux mâles d’un an. Telle fut l’offrande de Sheloumiel, fils de Tsourishaddaï.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu בָּקָר est un terme général désignant les bovins ; certaines traductions ont « deux bœufs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: La conjonction et la préposition poursuivent l’énumération. « Sacrifice de communion » rend le terme cultuel שְׁלָמִים de façon naturelle en français tout en évoquant la relation rétablie et le repas partagé, sans réduire le sens à une simple disposition intérieure.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un terme collectif désignant les bovins sans préciser ici leur sexe. « Deux bovins » conserve cette généralité mieux que « deux bœufs ».
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne sans ambiguïté des béliers dans ce contexte sacrificiel.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne des caprins mâles ; « boucs » exprime naturellement cette précision en français.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux mâles d’un an
  rationale: La traduction conserve à la fois le sexe indiqué par כְּבָשִׂים et l’âge exprimé par l’idiome בְּנֵי שָׁנָה.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Cette formule française naturelle reprend le bilan narratif de l’offrande présentée, tandis que « offrande » rend le sens général de קָרְבַּן.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: Sheloumiel, fils de Tsourishaddaï
  rationale: Les noms sont translittérés selon des conventions françaises lisibles, et בֶּן est rendu directement par « fils de ».
theological_decisions:
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix ; sacrifice de bien-être
  rationale: Le terme peut évoquer paix, intégrité, bien-être et communion. Le texte principal retient une désignation cultuelle française compréhensible, tandis que la note préserve les autres nuances lexicales légitimes.
translation_notes:
  register: Français international moderne, sobre et digne. La structure d’inventaire est conservée, avec une ponctuation qui facilite la lecture. Les marqueurs de notes sont placés immédiatement après les expressions concernées ; leur emplacement corrige l’inversion apparente des marqueurs dans la couche anglaise fournie.
