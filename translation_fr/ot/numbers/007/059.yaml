  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: fr
  text: 'Et, pour le sacrifice de communion[a] : deux bovins[b], cinq béliers, cinq boucs et cinq agneaux âgés d’un an. Telle fut[c] l’offrande de Gamliel, fils de Pedahtsour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie un terme collectif pour le gros bétail; traduction traditionnelle : « deux bœufs ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « Telle est l’offrande de »; le passé correspond au contexte narratif de l’énumération.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: Et, pour le sacrifice de communion
  rationale: La conjonction et la préposition poursuivent l’énumération commencée dans les versets précédents. « Sacrifice » rend זֶבַח, tandis que « de communion » exprime naturellement en français la catégorie sacrificielle שְׁלָמִים sans en réduire toute la portée à la seule idée de paix.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un nom collectif désignant le gros bétail bovin; « bovins » conserve cette généralité, contrairement à « bœufs », qui peut suggérer plus précisément des mâles castrés ou des animaux de trait.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne sans ambiguïté des béliers.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne des caprins mâles; « boucs » est le terme français courant et précis.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux âgés d’un an
  rationale: L’expression hébraïque, littéralement « agneaux fils d’une année », précise l’âge des animaux; la formulation retenue est claire et naturelle.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: קָרְבַּן désigne une offrande présentée à Dieu. La proposition hébraïque est sans verbe; le passé français l’intègre au récit tout en signalant en note le présent littéral possible.
- source_word: גַּמְלִיאֵל
  choice: Gamliel
  rationale: Cette translittération suit de près la forme hébraïque du nom propre.
- source_word: בֶּן פְּדָה־צוּר
  choice: fils de Pedahtsour
  rationale: « Fils de » rend directement בֶּן, et « Pedahtsour » translittère le nom hébreu en graphie française, avec « ts » pour צ.
theological_decisions:
- issue: Portée de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Le terme peut évoquer la paix, l’intégrité ou le bien-être et désigne aussi un sacrifice partagé. « Communion » est idiomatique dans le vocabulaire biblique français, mais les autres nuances légitimes sont conservées en note plutôt que tranchées silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la forme d’inventaire du passage. Les termes zoologiques sont précis sans être techniques, et les noms propres sont translittérés directement depuis l’hébreu.
