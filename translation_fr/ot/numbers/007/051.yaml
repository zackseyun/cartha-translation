  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: un taureau du gros bétail
  rationale: פַּר désigne un taureau, et בֶּן־בָּקָר précise qu’il appartient au gros bétail. Cette formulation reste proche de l’expression hébraïque tout en étant naturelle dans une liste sacrificielle.
- source_word: אַיִל
  choice: un bélier
  rationale: Terme usuel pour un mouton mâle adulte, notamment dans les textes sacrificiels.
- source_word: כֶּבֶשׂ
  choice: un agneau mâle
  rationale: Le nom désigne ici un jeune mouton mâle ; « agneau mâle » explicite le sexe indiqué par le terme hébreu.
- source_word: בֶּן־שְׁנָתוֹ
  choice: d’un an
  rationale: Expression idiomatique désignant un animal âgé d’un an ou dans sa première année ; « d’un an » est la formulation française courante dans ce contexte.
- source_word: לְעֹלָה
  choice: pour un holocauste
  rationale: עֹלָה est le terme sacrificiel consacré pour l’offrande entièrement consumée ; « holocauste » demeure le terme biblique français précis et courant.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral est répété devant chaque animal afin d’en indiquer la quantité ; la traduction le conserve pour chacun.
