  language: fr
  text: 'Le dixième jour, le responsable des fils de Dan était Ahiézer, fils d’Ammishaddaï :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: Le dixième jour
  rationale: La préposition בְּ avec יוֹם a ici une valeur temporelle. La tournure française « Le dixième jour » est naturelle et fidèle dans cette énumération.
- source_word: נָשִׂיא
  choice: responsable
  rationale: Dans ce contexte, le terme désigne le représentant reconnu d’une tribu. « Responsable » exprime cette fonction sans suggérer à tort un statut royal, comme pourrait le faire « prince ».
- source_word: לִבְנֵי דָן
  choice: des fils de Dan
  rationale: La formulation conserve l’expression familiale hébraïque בְּנֵי tout en restant compréhensible en français.
- source_word: אֲחִיעֶזֶר
  choice: Ahiézer
  rationale: Nom propre translittéré selon l’usage français biblique, avec un accent indiquant la prononciation.
- source_word: בֶּן
  choice: fils de
  rationale: Équivalent direct et conventionnel de la construction patronymique.
- source_word: עַמִּישַׁדָּי
  choice: Ammishaddaï
  rationale: Nom propre translittéré, avec tréma pour distinguer la dernière voyelle conformément à l’usage français.
