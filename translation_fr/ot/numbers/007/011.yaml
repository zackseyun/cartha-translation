id: NUM.7.11
reference: Numbers 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Un responsable par jour, un responsable par jour, ils présenteront leur offrande pour la dédicace de l’autel. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète littéralement « un responsable, un jour ; un responsable, un jour », soulignant que les responsables présenteront leurs offrandes à tour de rôle, à raison d’un par jour. On peut aussi traduire « un chef de tribu par jour ».
    reason: La répétition hébraïque et la portée distributive gagnent à être explicitées ; « chef de tribu » précise également la fonction contextuelle de נָשִׂיא.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: נָשִׂיא
  choice: responsable
  rationale: Dans ce contexte, le terme désigne les chefs représentant les tribus. « Responsable » est actuel et évite les connotations monarchiques de « prince ».
- source_word: אֶחָד לַיּוֹם
  choice: un responsable par jour
  rationale: La formulation distributive indique qu’un seul responsable intervient chaque jour dans la succession prévue.
- source_word: יַקְרִיבוּ
  choice: ils présenteront
  rationale: Le hiphil de קרב, en contexte sacrificiel, signifie présenter ou offrir ; « présenter » évite la répétition « offrir leur offrande ».
- source_word: קָרְבָּנָם
  choice: leur offrande
  rationale: Ce nom désigne ce qui est apporté et présenté à Dieu ; « offrande » est le terme cultuel français courant.
- source_word: לַחֲנֻכַּת
  choice: pour la dédicace de
  rationale: La préposition et le nom expriment ici la destination de l’offrande dans le cadre de l’inauguration cultuelle de l’autel.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français usuel du terme hébreu désignant l’autel sacrificiel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre et le distingue d’un titre, sans adopter la forme francisée traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, clair et digne. La répétition du texte source est conservée dans le verset pour maintenir son insistance sur l’ordre quotidien des offrandes. Le futur rend naturellement l’instruction hébraïque à valeur prescriptive.
