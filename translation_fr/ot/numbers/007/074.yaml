    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans le contexte des offrandes du sanctuaire, le terme désigne un petit récipient. « Coupe » est naturel en français et évite l’image trompeuse d’une cuillère de table.
- source_word: אַחַת
  choice: une
  rationale: Cardinal simple accordé avec le nom féminin כַּף.
- source_word: עֲשָׂרָה
  choice: dix
  rationale: Cardinal indiquant le poids du récipient, dont l’unité est sous-entendue en hébreu.
- source_word: זָהָב
  choice: en or
  rationale: Le nom de matière caractérise ici la composition du récipient ; « en or » est la tournure française la plus naturelle.
- source_word: עֲשָׂרָה זָהָב
  choice: de dix sicles
  rationale: L’hébreu omet l’unité de poids, mais la formule répétée dans le contexte permet de comprendre « sicles ». La note signale explicitement cet ajout de clarté.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: Rend directement l’état du récipient et s’accorde naturellement avec « coupe ».
- source_word: קְטֹרֶת
  choice: encens
  rationale: Terme français courant pour la substance aromatique offerte dans le culte du sanctuaire.
