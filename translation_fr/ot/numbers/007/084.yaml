source:
  edition: WLC
  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: fr
  text: 'Voici ce qui fut offert pour la dédicace de l’autel, le jour où il fut oint[a], de la part des responsables d’Israël[b] : douze plats d’argent, douze bassins d’argent et douze coupes d’or[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « au jour où il fut oint » ou « au jour de son onction ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « les chefs d’Israël ». Le terme hébreu désigne les dirigeants reconnus des tribus.
    reason: lexical_alternative
  - marker: c
    text: La forme exacte de ces ustensiles n’est pas certaine ; les termes peuvent aussi être rendus par « plateaux », « bols » et « cuillères » ou « godets ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Voici ce qui fut offert pour la dédicace de l’autel
  rationale: L’hébreu dit plus formellement « Voici la dédicace de l’autel ». Après l’énumération des dons, la phrase fonctionne comme un récapitulatif; « ce qui fut offert » explicite sobrement ce que désigne ici la dédicace.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: le jour où il reçut l’onction
  rationale: Cette formulation française naturelle conserve l’image rituelle de l’onction et renvoie sans ambiguïté à l’autel.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: par les responsables d’Israël
  rationale: נָשִׂיא désigne ici les chefs reconnus des tribus. « Responsables » est actuel et évite la connotation dynastique de « princes ».
- source_word: קַעֲרֹת כֶּסֶף
  choice: plats d’argent
  rationale: קְעָרָה désigne un récipient large, de type plat ou plateau; « plats » le distingue des bassins mentionnés ensuite.
- source_word: מִזְרְקֵי כֶסֶף
  choice: bassins d’argent
  rationale: מִזְרָק désigne un bassin ou bol employé dans le culte; « bassins » convient à sa fonction rituelle et maintient la distinction entre les ustensiles.
- source_word: כַּפּוֹת זָהָב
  choice: coupes d’or
  rationale: כַּף peut désigner un petit récipient creux, apparenté par la forme à la paume. « Coupes » reste compréhensible sans imposer avec certitude la forme précise de l’ustensile.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: douze
  rationale: Rendu direct des nombres cardinaux; les variations de genre grammatical de l’hébreu n’ont pas à être reproduites en français.
