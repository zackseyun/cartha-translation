    issue: Articulation de l’énumération
    rationale: Le syntagme « à cela s’ajoutaient » est une explicitation interprétative. Une séparation par point-virgule, avec reprise verbale minimale, distingue plus clairement les bovins des autres animaux sans modifier le sens.
  - severity: low
    issue: Temps verbal trop soutenu
    rationale: « Après qu’il eut été oint » est grammatical, mais relève d’un registre littéraire peu adapté à une traduction internationale moderne. « Après son onction » est idiomatique et conserve l’antériorité.
