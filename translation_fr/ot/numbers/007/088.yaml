source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: fr
  text: Et le total des bovins destinés au sacrifice de communion[a] était de vingt-quatre taureaux ; il y avait soixante béliers, soixante boucs et soixante agneaux d’un an. Ce fut là l’inauguration de l’autel, après son onction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: Alternative lexicale reflétant les diverses nuances possibles de שְׁלָמִים.
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: Et le total des bovins
  rationale: בְּקַר est un collectif désignant les bovins. La formulation « le total » rend la valeur récapitulative de כֹל, tandis que « Et » conserve le lien avec le contexte précédent.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: le sacrifice de communion
  rationale: Cette expression désigne une catégorie sacrificielle. « Sacrifice de communion » est compréhensible en français moderne et fait ressortir la dimension relationnelle du terme, sans exclure ses nuances de paix et de bien-être.
- source_word: פָּרִים
  choice: taureaux
  rationale: פָּרִים désigne ici les bovins mâles offerts en sacrifice ; le texte ne précise pas explicitement qu’ils sont jeunes.
- source_word: אֵילִם
  choice: béliers
  rationale: Équivalent français courant et précis du terme désignant les moutons mâles.
- source_word: עַתֻּדִים
  choice: boucs
  rationale: Le mot désigne des chèvres mâles ; « boucs » est la formulation française naturelle et précise.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: agneaux d’un an
  rationale: Rend naturellement l’âge expressément indiqué par l’hébreu.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: l’inauguration de l’autel
  rationale: חֲנֻכָּה désigne ici la mise en service solennelle de l’autel. « Inauguration » est plus naturel en français actuel que « dédicace » dans ce contexte.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: après qu’il eut été oint
  rationale: La tournure passive respecte l’absence de sujet exprimé pour l’onction et maintient la succession temporelle du texte.
theological_decisions:
- issue: Traduction de la catégorie sacrificielle שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix ; sacrifice de bien-être
  rationale: Le terme porte des nuances de paix, de plénitude et de communion. Le texte principal retient une désignation française claire, tandis que la note préserve les autres nuances légitimes sans imposer une interprétation doctrinale unique.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule et « à cela s’ajoutaient » clarifient que les vingt-quatre taureaux constituent le total des bovins, avant l’énumération des autres animaux, sans effacer la structure récapitulative de l’hébreu.
