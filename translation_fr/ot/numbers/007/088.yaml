revisions:
- from: Et le total des bovins destinés au sacrifice de communion[a] fut de vingt-quatre taureaux ; à cela s’ajoutaient soixante béliers, soixante boucs et soixante agneaux d’un an. Ce fut là l’inauguration de l’autel, après qu’il eut été oint.
  to: Et le total des bovins destinés au sacrifice de communion[a] était de vingt-quatre taureaux ; il y avait soixante béliers, soixante boucs et soixante agneaux d’un an. Ce fut là l’inauguration de l’autel, après son onction.
  rationale: 'La révision améliore la lisibilité de la structure récapitulative : les taureaux sont rattachés explicitement aux bovins, puis les autres catégories sont énumérées. Elle remplace aussi une tournure littéraire par une expression moderne qui maintient la chronologie et l’absence de sujet explicite pour l’onction.'
