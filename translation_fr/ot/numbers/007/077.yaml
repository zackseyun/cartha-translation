  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: fr
  text: 'et, pour le sacrifice de communion[a] : deux bovins, cinq béliers, cinq boucs et cinq agneaux mâles d’un an. Telle fut l’offrande de Paguiël, fils d’Okrân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être » ; le terme hébreu désigne une catégorie d’offrandes dont le sens exact peut inclure la paix, le bien-être et la communion.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: La conjonction et la préposition introduisent le dernier élément de l’inventaire. « Sacrifice de communion » rend naturellement la catégorie cultuelle שְׁלָמִים en français moderne, sans réduire son champ sémantique à la seule idée de paix.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un collectif désignant le gros bétail sans préciser ici le sexe; « bovins » conserve cette généralité.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne précisément des béliers.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne des caprins mâles; « boucs » est le terme français courant et précis.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux mâles d’un an
  rationale: La formulation conserve le sexe indiqué par כְּבָשִׂים et rend directement בְּנֵי שָׁנָה par « d’un an ».
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Cette formule clôt l’inventaire. Le passé simple convient au registre narratif écrit et « offrande » rend קָרְבַּן dans ce contexte.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: Paguiël, fils d’Okrân
  rationale: Les noms sont translittérés sous une forme lisible en français, et le patronyme est rendu selon l’usage français.
theological_decisions:
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Le terme peut évoquer la paix, l’intégrité ou la communion liée au repas sacrificiel. « Communion » exprime bien la fonction cultuelle sans imposer l’idée que l’offrande sert uniquement à rétablir la paix; une note conserve les autres rendus possibles.
translation_notes:
  register: Français international moderne, clair et digne. La structure d’inventaire est maintenue, avec une ponctuation naturelle. Le vocabulaire animalier reste précis, et la formule finale adopte un registre narratif soutenu mais accessible.
