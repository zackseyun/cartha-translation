  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: fr
  text: 'Total des bovins pour l’holocauste : douze taureaux, douze béliers, douze agneaux âgés d’un an, et leur offrande de céréales ; et douze boucs pour le sacrifice pour le péché[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu חַטָּאת peut mettre l’accent sur la purification de l’impureté aussi bien que sur le péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: Total du gros bétail
  rationale: Dans ce récapitulatif, כָּל introduit le total des bovins offerts. « Gros bétail » rend naturellement le collectif הַבָּקָר et le distingue des taureaux comptés ensuite.
- source_word: לָעֹלָה
  choice: destiné à l’holocauste
  rationale: Le ל marque ici la destination. « Holocauste » est le terme sacrificiel français usuel pour עֹלָה, offrande entièrement consumée.
- source_word: פָּרִים
  choice: taureaux
  rationale: Équivalent précis et courant de פָּרִים dans un contexte sacrificiel.
- source_word: אֵילִם
  choice: béliers
  rationale: Terme français standard pour les mâles adultes des ovins offerts en sacrifice.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: agneaux âgés d’un an
  rationale: Rend explicitement et naturellement l’indication d’âge portée par בְּנֵי שָׁנָה.
- source_word: וּמִנְחָתָם
  choice: avec leurs offrandes de céréales
  rationale: מִנְחָה désigne couramment, dans la législation sacrificielle, l’offrande végétale accompagnant les animaux. Le pluriel français s’accorde naturellement avec les différents sacrifices récapitulés tout en conservant la relation exprimée par le suffixe hébreu.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: et douze boucs
  rationale: Le syntagme désigne spécifiquement des caprins mâles ; « boucs » est précis, naturel et non archaïque.
- source_word: לְחַטָּאת
  choice: destinés au sacrifice pour le péché
  rationale: « Sacrifice pour le péché » est l’appellation française conventionnelle et intelligible de חַטָּאת dans ce cadre rituel ; la possibilité de comprendre une fonction de purification est conservée en note.
theological_decisions:
- issue: Sens de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme est traditionnellement associé au péché, mais peut mettre l’accent sur la purification rituelle produite par le sacrifice. Le texte principal retient la formulation la plus reconnue sans effacer l’autre nuance, signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le caractère récapitulatif de l’inventaire hébreu. Le point-virgule distingue les animaux destinés à l’holocauste des boucs destinés au sacrifice pour le péché.
