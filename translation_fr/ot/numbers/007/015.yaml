  source_fidelity: Le projet rend correctement les trois animaux, l’âge du dernier et leur destination cultuelle. Toutefois, « pris dans » ajoute une idée de prélèvement qui n’est pas exprimée par בֶּן־בָּקָר ; l’expression qualifie le taureau comme bovin/issu du gros bétail. La répétition de אֶחָד mérite aussi d’être visible dans l’énumération française.
