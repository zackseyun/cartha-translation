  terminology: « Taureau », « bélier », « agneau mâle âgé d’un an » et « offrande entièrement brûlée » sont des choix précis et compréhensibles. Le maintien explicite de « mâle » pour כֶּבֶשׂ est acceptable et reflète le genre lexical/source dans ce contexte.
