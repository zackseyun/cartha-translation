  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: un taureau pris dans le gros bétail
  rationale: פַּר désigne un taureau, tandis que l’expression בֶּן בָּקָר précise son appartenance aux bovins. Cette formulation naturelle conserve les deux éléments sans le littéralisme peu idiomatique « fils du gros bétail ».
- source_word: אַיִל
  choice: un bélier
  rationale: Terme français courant et précis pour le mouton mâle adulte dans un contexte sacrificiel.
- source_word: כֶּבֶשׂ
  choice: un agneau mâle
  rationale: Le terme désigne ici un agneau et, dans cette liste sacrificielle, le masculin est pertinent; « agneau mâle » l’explicite clairement.
- source_word: בֶּן שְׁנָתוֹ
  choice: âgé d’un an
  rationale: Rendu idiomatique moderne de l’expression hébraïque indiquant l’âge de l’animal.
- source_word: לְעֹלָה
  choice: pour l’offrande entièrement brûlée
  rationale: עֹלָה désigne le sacrifice consumé entièrement sur l’autel. Ce rendu transparent exprime sa caractéristique essentielle sans recourir au terme français traditionnel « holocauste », aujourd’hui fortement chargé d’un autre sens.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral répété indique le nombre de chaque animal. En français, la coordination permet de conserver clairement ce décompte sans répéter artificiellement « un seul ».
