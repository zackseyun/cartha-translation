  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: fr
  text: Alors les responsables d’Israël, chefs de leurs maisons ancestrales[a], apportèrent leurs offrandes[b]. C’étaient les responsables des tribus, ceux qui étaient préposés aux hommes recensés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « maisons ancestrales » étaient des groupes familiaux étendus, ou clans, au sein d’Israël.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « firent approcher » ou « présentèrent ». Dans ce contexte, il s’agit des offrandes apportées pour la dédicace.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ceux qui avaient la charge des hommes recensés ». L’expression hébraïque désigne les responsables du groupe enregistré lors du recensement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: apportèrent leurs offrandes
  rationale: Le hiphil de קרב signifie « faire approcher », donc « apporter » ou « présenter », notamment dans un contexte cultuel. Le contexte immédiat de la dédicace rend naturel l’objet implicite « leurs offrandes », tout en signalant en note la formulation plus littérale.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: les responsables d’Israël
  rationale: נָשִׂיא désigne ici les principaux dirigeants des tribus, non des princes au sens dynastique. « Responsables » est moderne, clair et adapté à leur fonction.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: chefs de leurs maisons ancestrales
  rationale: La « maison du père » est une unité de parenté plus large que la famille nucléaire. « Maisons ancestrales » conserve l’image sociale et généalogique sans employer le calque peu naturel « maisons de leurs pères ».
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: C’étaient les responsables des tribus
  rationale: מַטֶּה signifie littéralement « bâton », mais désigne conventionnellement une tribu dans ce contexte. La traduction restitue directement le référent sociopolitique.
- source_word: הֵם הָעֹמְדִים עַל הַפְּקֻדִים
  choice: ceux qui étaient préposés aux hommes recensés
  rationale: עמד על exprime ici une position de surveillance ou d’autorité. « Être préposé à » rend cette responsabilité sans reproduire maladroitement l’image de « se tenir au-dessus ». הַפְּקֻדִים désigne les personnes enregistrées lors du recensement; dans ce contexte, il s’agit des hommes recensés.
