  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande consistait en un plat d’argent[a] pesant cent trente sicles, et un bassin d’argent pesant soixante-dix sicles, selon le sicle du sanctuaire. Tous deux étaient remplis de fleur de farine pétrie à l’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une coupe » ; le terme désigne un récipient large. Le « bassin » qui suit peut aussi être rendu par « bol ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande consistait en
  rationale: קָרְבָּן désigne ici ce qui est présenté dans le cadre du culte. Cette tournure introduit naturellement en français la liste des objets offerts.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קְעָרָה désigne un récipient probablement large et peu profond ; « plat » convient au contexte d’inventaire cultuel.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: Rend avec naturel la mention hébraïque du poids du récipient sans alourdir la phrase.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin d’argent
  rationale: מִזְרָק est un récipient employé dans le service sacrificiel ; « bassin » en suggère mieux l’usage rituel que le terme plus général « bol ».
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: Explicite naturellement que le nombre indique le poids du second récipient.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La locution indique l’étalon de poids officiel lié au sanctuaire.
- source_word: שְׁנֵיהֶם
  choice: Tous deux
  rationale: Renvoie explicitement aux deux récipients d’argent.
- source_word: מְלֵאִים
  choice: étaient remplis de
  rationale: Rend l’adjectif prédicatif hébreu en français idiomatique.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française traditionnelle et précise pour une farine finement raffinée destinée aux offrandes.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie à l’huile
  rationale: Dans le vocabulaire sacrificiel, בלל décrit la farine incorporée ou mélangée avec de l’huile ; « pétrie à l’huile » est naturel et concret en français.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne spécifiquement une offrande composée de produits céréaliers, et non une offrande générique.
