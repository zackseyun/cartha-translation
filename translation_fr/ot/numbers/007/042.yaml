  text: בַּ/יּוֹם֙ הַ/שִּׁשִּׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: fr
  text: 'Le sixième jour : le chef des descendants de Gad[a], Éliasaph, fils de Déouel[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fils de Gad », c’est-à-dire les membres de la tribu issue de Gad.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte ici « Déouel »; dans un passage parallèle, le nom apparaît sous la forme « Réouel » (Nombres 2.14).
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Le sixième jour
  rationale: La préposition בְּ introduit ici une indication temporelle; cette formulation est l’équivalent français naturel de la formule narrative hébraïque.
- source_word: נָשִׂיא
  choice: chef
  rationale: Dans ce contexte, le terme désigne le dirigeant officiellement reconnu d’une tribu. « Chef » exprime clairement cette fonction sans suggérer la royauté qu’évoquerait « prince ».
- source_word: לִבְנֵי גָד
  choice: des descendants de Gad
  rationale: Le לִ marque la relation entre le chef et le groupe tribal. « Descendants de Gad » restitue le sens de l’expression littérale « fils de Gad » tout en étant naturel en français moderne.
- source_word: אֶלְיָסָף
  choice: Éliasaph
  rationale: Translittération française traditionnelle et transparente du nom propre hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Équivalent français normal de la construction patronymique hébraïque.
- source_word: דְּעוּאֵל
  choice: Déouel
  rationale: Cette forme rend les consonnes du texte massorétique de ce verset; la forme apparentée « Réouel » est signalée en note.
