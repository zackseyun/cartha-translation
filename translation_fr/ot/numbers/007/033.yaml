  text: un taureau du troupeau[a], un bélier, un agneau mâle d’un an, en holocauste ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un taureau, fils du gros bétail ». Cette expression hébraïque désigne un bovin du troupeau et est souvent comprise au sens de « jeune taureau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: un taureau pris dans le gros bétail
  rationale: פַּר désigne un taureau, souvent jeune, tandis que בֶּן בָּקָר précise par un idiome hébreu qu’il appartient au gros bétail. Cette formulation naturelle évite le calque « fils du gros bétail » tout en conservant cette précision.
- source_word: אַיִל
  choice: un bélier
  rationale: Terme sacrificiel courant désignant un mouton mâle adulte.
- source_word: כֶּבֶשׂ
  choice: un agneau mâle
  rationale: Dans cet inventaire sacrificiel, le terme désigne un agneau mâle; le genre est rendu explicitement en français.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: Expression hébraïque indiquant idiomatiquement que l’animal est âgé d’un an ou se trouve dans sa première année.
- source_word: לְעֹלָה
  choice: pour un holocauste
  rationale: עֹלָה est le terme consacré pour une offrande entièrement brûlée; « holocauste » reste le terme biblique français précis et usuel dans ce contexte.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral répété fixe le nombre de chaque animal. En français, les trois occurrences sont naturellement rendues par l’article numéral « un ».
theological_decisions:
- issue: Sens sacrificiel de עֹלָה
  choice: holocauste
  alternative: offrande entièrement brûlée
  rationale: « Holocauste » est le terme sacrificiel français traditionnel et précis, sans ajouter d’interprétation doctrinale; l’autre formulation explicite davantage le mode de sacrifice mais alourdit cet inventaire.
translation_notes:
  register: Français international moderne, sobre et digne. La structure d’inventaire est conservée; « gros bétail » distingue naturellement les bovins du petit bétail. La ponctuation finale suit la continuité de la liste dans le passage.
