lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: La locution désigne idiomatiquement un caprin mâle. « Bouc » exprime naturellement en français moderne l’espèce et le sexe sans reproduire littéralement la construction hébraïque.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral indique qu’un seul animal est offert. Dans cette liste, l’article numéral « un » conserve clairement la valeur énumérative.
- source_word: לְחַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne une catégorie de sacrifice et non le péché au sens abstrait. La préposition לְ marque ici la destination ou la fonction de l’animal.
theological_decisions:
- issue: Sens sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice d’expiation
  rationale: « Sacrifice pour le péché » maintient le lien lexical explicite avec le péché et évite de préciser à tort que le terme désigne exclusivement l’expiation, tout en indiquant clairement qu’il s’agit d’une catégorie rituelle.
translation_notes:
  register: Formulation concise, digne et actuelle, adaptée au style inventorial du chapitre. Le point-virgule conserve le caractère continu de l’énumération.
