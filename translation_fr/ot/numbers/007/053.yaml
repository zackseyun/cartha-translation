base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: fr
  text: 'et, pour le sacrifice de communion[a] : deux bovins[b], cinq béliers, cinq boucs et cinq agneaux âgés d’un an. Telle fut l’offrande d’Élishama, fils d’Ammihoud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ». Le terme hébreu désigne souvent un sacrifice accompagné d’un repas partagé, exprimant la paix, la communion ou l’intégrité.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici un terme collectif pour le gros bétail ; certaines traductions précisent « deux bœufs » ou « deux taureaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: La conjonction et la préposition poursuivent l’énumération. « Sacrifice » rend זֶבַח, tandis que « communion » exprime naturellement en français la dimension relationnelle et partagée des שְׁלָמִים sans réduire le terme à une simple idée de pacification.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un nom collectif désignant le gros bétail. « Bovins » reste naturel et n’impose ni le sexe ni la fonction de travail que suggéreraient « taureaux » ou « bœufs ».
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne clairement des béliers dans cette liste sacrificielle.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne spécifiquement des caprins mâles ; « boucs » conserve cette précision.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux âgés d’un an
  rationale: כְּבָשִׂים désigne des agneaux, et l’expression idiomatique בְּנֵי שָׁנָה précise qu’ils sont âgés d’un an. Le français grammaticalement masculin n’ajoute pas la formulation appuyée « agneaux mâles ».
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: La proposition nominale identifie rétrospectivement l’offrande du chef nommé. Le passé simple convient au registre narratif soutenu sans être archaïque.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Élishama, fils d’Ammihoud
  rationale: Les noms sont translittérés selon une forme française lisible, et le patronyme est rendu par la tournure habituelle « fils de ».
theological_decisions:
- issue: Sens cultuel de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix ; sacrifice de bien-être
  rationale: Le terme peut évoquer la paix, l’intégrité ou la communion liée à un repas sacrificiel partagé. Le texte principal retient une formulation française courante dans le vocabulaire biblique, tandis que la note préserve l’étendue sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la forme d’inventaire du texte hébreu. Les termes cultuels restent reconnaissables, avec une note lorsque leur portée ne se laisse pas ramener à un seul équivalent français.
