language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: fr
  text: 'Ils apportèrent leur offrande devant Yahweh : six chariots couverts[a] et douze bœufs, soit un chariot pour deux chefs et un bœuf pour chacun. Ils les présentèrent devant le tabernacle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu rendu par « couverts » est incertain. L’expression est traditionnellement comprise comme désignant des chariots couverts ou bâchés.
    reason: Signaler l’incertitude lexicale de צָב sans écarter l’interprétation traditionnelle adaptée au contexte de transport.
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: leur offrande
  rationale: Dans ce contexte cultuel, קָרְבָּן désigne ce qui est apporté et présenté à Dieu. « Offrande » est naturel et conserve cette portée religieuse.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime ici la présence ou la position devant quelqu’un; « devant » restitue simplement cette relation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel employé dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: עֶגְלֹת צָב
  choice: chariots couverts
  rationale: עֲגָלוֹת désigne des chariots; צָב est traditionnellement compris comme indiquant qu’ils étaient couverts, mais son sens exact demeure incertain, ce que signale la note.
- source_word: בָּקָר
  choice: bœufs
  rationale: Le contexte du transport et le singulier שׁוֹר dans la proposition distributive suivante indiquent des bovins employés comme animaux de trait.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: un chariot pour deux chefs
  rationale: 'La tournure est distributive : chaque paire de chefs fournit ou partage un chariot.'
- source_word: הַנְּשִׂאִים
  choice: chefs
  rationale: Dans ce passage, נְשִׂיאִים désigne les chefs des tribus. « Chefs » est précis sans leur attribuer un statut royal.
- source_word: וְשׁוֹר לְאֶחָד
  choice: et un bœuf pour chacun
  rationale: La formule distributive attribue un bœuf à chacun des chefs mentionnés.
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: Ils les présentèrent
  rationale: Le verbe הקריב signifie faire approcher ou présenter dans un cadre cultuel. « Présentèrent » évite de suggérer à tort que les chariots et les bœufs furent alors sacrifiés.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: מִשְׁכָּן désigne la demeure sacrée mobile; « tabernacle » est le terme français établi et le distingue de la « tente de la rencontre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin personnel et évite de le remplacer par le titre « le SEIGNEUR ».
translation_notes:
  register: Français international moderne, clair et digne. La coordination hébraïque est légèrement allégée en deux phrases, tandis que « soit » rend explicitement la répartition distributive déjà présente dans l’original.
