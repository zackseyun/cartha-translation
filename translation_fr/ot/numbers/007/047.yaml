  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: fr
  text: 'et, pour le sacrifice de communion[a] : deux bovins, cinq béliers, cinq boucs et cinq agneaux d’un an. Telle fut l’offrande d’Éliasaph, fils de Déouel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: La conjonction et la préposition introduisent un nouvel élément de l’inventaire. « Sacrifice de communion » exprime naturellement en français la catégorie sacrificielle שְׁלָמִים, sans effacer ses autres nuances possibles.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un collectif désignant le gros bétail; « bovins » conserve l’absence d’indication de sexe dans l’hébreu.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne précisément des béliers.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne des caprins mâles; « boucs » est le terme français courant et précis.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux d’un an
  rationale: La tournure hébraïque signifie littéralement des agneaux « fils d’une année »; « d’un an » en restitue naturellement l’exigence d’âge.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Cette formule française convient à la conclusion récapitulative du récit et rend קָרְבַּן par le terme cultuel général « offrande ».
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: Éliasaph, fils de Déouel
  rationale: Les noms sont translittérés selon leur forme biblique française usuelle, et le patronyme est rendu explicitement.
theological_decisions:
- issue: Sens de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix ; sacrifice de bien-être
  rationale: Le terme désigne une catégorie sacrificielle liée à la paix, à l’intégrité et à la communion. Le texte principal retient une formulation française claire, tandis que la note préserve les autres nuances lexicales sans imposer une interprétation théologique unique.
