  to: Son offrande consistait en un plat d’argent[a] pesant cent trente sicles et un bassin d’argent pesant soixante-dix sicles, selon le sicle du sanctuaire[b]. Tous deux étaient remplis de farine fine mêlée d’huile, pour une offrande de céréales.
  rationale: La révision remplace une formulation pouvant être comprise comme un pétrissage par l’expression plus directe « mêlée d’huile ». Elle rétablit aussi, à l’ancre b, l’alternative lexicale concernant le bassin rituel, conformément à la piste d’audit anglaise. Aucun changement n’est apporté aux poids, à l’étalon du sanctuaire ni à la catégorie de l’offrande.
