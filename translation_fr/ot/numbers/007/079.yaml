base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande consistait en un plat d’argent[a] pesant cent trente sicles et un bassin d’argent pesant soixante-dix sicles, selon le sicle du sanctuaire[b]. Tous deux étaient remplis de farine fine mêlée d’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une coupe d’argent » : le terme hébreu désigne un récipient dont la forme exacte reste incertaine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « un bassin à aspersion » pour « un bassin d’argent » : le terme hébreu peut souligner la fonction rituelle du récipient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande
  rationale: קָרְבָּן désigne ici ce qui est présenté à Dieu dans le cadre sacrificiel; « offrande » est naturel, clair et précis.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קְעָרָה désigne un récipient probablement assez peu profond; « plat » convient au contexte sans prétendre en fixer exactement la forme.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: Cette tournure française rend naturellement l’hébreu littéral « son poids était de cent trente ».
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin d’argent
  rationale: מִזְרָק est un récipient cultuel; « bassin » reste suffisamment général et n’impose pas dans le texte sa fonction rituelle précise.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: Le poids se rapporte au bassin; la répétition de « pesant » l’explicite clairement en français.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: Cette formule conserve le sens technique de l’étalon de poids cultuel.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Tous deux étaient remplis
  rationale: La formulation reprend explicitement les deux récipients et restitue l’état décrit par l’adjectif hébreu.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: « Fleur de farine » est l’équivalent français traditionnel et précis de la farine fine destinée aux sacrifices.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe indique que la farine est intimement mélangée à l’huile; « pétrie à l’huile » est une formulation cultuelle française naturelle.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne l’offrande non sanglante faite de farine ou de céréales; cette traduction en exprime clairement la catégorie.
