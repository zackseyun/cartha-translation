  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande était un plat d’argent[a] pesant cent trente sicles, et un bassin d’argent[b] pesant soixante-dix sicles, selon le sicle du sanctuaire[c] ; tous deux étaient remplis de fleur de farine mélangée à l’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une écuelle d’argent » ; le mot hébreu désigne un récipient rituel large.
    reason: lexical_alternative
  - marker: b
    text: Ou « une coupe d’argent » ; il s’agit d’un récipient associé au culte sacrificiel.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire d’après l’étalon de poids en usage au sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande était
  rationale: קָרְבָּן désigne ici ce qui est présenté dans le cadre du culte. « Offrande » est le terme français clair et usuel dans ce contexte sacrificiel.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קְעָרָה désigne un récipient relativement large, de type plat ou écuelle. « Plat » convient au contexte rituel sans préciser indûment sa forme.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: 'Cette tournure française naturelle exprime fidèlement l’hébreu, littéralement « son poids : cent trente ».'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin d’argent
  rationale: מִזְרָק désigne un récipient employé dans le culte sacrificiel. « Bassin » en rend la fonction et évite la connotation trop domestique de « bol ».
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: Le poids s’applique au bassin ; le participe « pesant » explicite naturellement en français la relation elliptique de l’hébreu.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La formule indique que les poids sont calculés d’après l’étalon officiel du sanctuaire. Le sens littéral de שֶׁקֶל est conservé dans le texte.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: tous deux étaient remplis
  rationale: « Tous deux » reprend explicitement les deux récipients et restitue la construction prédicative hébraïque.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: סֹלֶת désigne une farine fine de qualité destinée notamment aux offrandes. « Fleur de farine » est précis, idiomatique et digne.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe passif exprime le mélange de la farine avec l’huile. Dans le vocabulaire français des préparations céréalières, « pétrie à l’huile » est naturel et préserve l’idée d’incorporation.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne l’offrande non animale composée de farine et d’huile. « Offrande de céréales » la distingue clairement des autres sacrifices.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe de l’inventaire est allégée par deux participes « pesant », tandis que les termes cultuels traditionnels « sicle », « sanctuaire » et « offrande » sont conservés et éclairés au besoin par une note.
