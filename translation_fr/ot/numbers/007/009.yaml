id: NUM.7.9
reference: Numbers 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: fr
  text: 'Mais il ne donna rien aux fils de Qehath, car le service des objets sacrés[a] leur incombait : ils devaient les porter sur leurs épaules.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sanctuaire ». Dans ce contexte, l’hébreu désigne probablement les objets sacrés confiés aux Qehathites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Mais … aux fils de Qehath
  rationale: La préposition לְ marque le bénéficiaire indirect. « Fils de Qehath » conserve la désignation traditionnelle du clan, et « Mais » rend le contraste avec les dons faits aux autres clans lévitiques.
- source_word: לֹא נָתָן
  choice: il ne donna rien
  rationale: L’objet sous-entendu renvoie aux chars et aux bœufs du contexte précédent. « Ne donna rien » l’exprime naturellement sans ajouter ces éléments au texte.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: le service des objets sacrés
  rationale: עֲבֹדָה désigne ici le service ou la tâche confiée, et הַקֹּדֶשׁ renvoie très probablement, dans ce contexte, aux objets saints transportés par les Qehathites. Une note conserve l’autre compréhension possible, « service du sanctuaire ».
- source_word: עֲלֵיהֶם
  choice: leur incombait
  rationale: Cette formulation française naturelle rend l’image hébraïque d’une responsabilité qui était « sur eux », sans en affaiblir le caractère obligatoire.
- source_word: בַּכָּתֵף יִשָּׂאוּ
  choice: ils devaient les porter sur l’épaule
  rationale: L’imparfait hébreu exprime ici une obligation prescrite. Le pronom « les », exigé par le français, reprend les objets sacrés; le singulier collectif « l’épaule » suit l’expression hébraïque.
theological_decisions:
- issue: Référent de הַקֹּדֶשׁ
  choice: les objets sacrés
  alternative: le sanctuaire
  rationale: Le contexte immédiat des fonctions qehathites favorise les objets sacrés, mais le nom hébreu peut également désigner le sanctuaire ou le domaine saint; cette ambiguïté est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. « Qehath » suit une translittération française proche de l’hébreu; « leur incombait » conserve l’idée de charge obligatoire sans reproduire littéralement une tournure hébraïque peu naturelle.
