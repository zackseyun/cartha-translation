lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: Cette expression construite désigne idiomatiquement un mâle de l’espèce caprine. « Bouc » est précis, naturel et adapté au vocabulaire sacrificiel.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral est conservé afin de respecter le style énumératif et répétitif de Nombres 7. En français, « un bouc » exprime naturellement à la fois le nombre et l’indéfini.
- source_word: לְחַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne une offrande sacrificielle liée au péché et à la purification. La préposition לְ marque ici la destination ou la fonction.
theological_decisions:
- issue: Traduction du terme sacrificiel חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme hébreu peut désigner le sacrifice qui traite le péché, mais aussi la souillure rituelle. La formulation principale, aisément reconnaissable, conserve la référence au péché, tandis que la note signale l’autre nuance sans trancher artificiellement.
