lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans cet inventaire cultuel, le mot désigne un petit récipient destiné à contenir l’encens. « Coupe » est naturel en français et convient mieux ici que le sens littéral courant « paume » ou qu’« cuillère ».
- source_word: אַחַת
  choice: une
  rationale: Le numéral cardinal féminin s’accorde avec כַּף et se rend directement par « une ».
- source_word: עֲשָׂרָה
  choice: de dix sicles
  rationale: Le texte porte littéralement « dix », sans unité exprimée. Le contexte immédiat donne le sicle comme unité du poids des récipients ; l’unité est donc explicitée dans le texte, avec une note signalant l’ellipse hébraïque.
- source_word: זָהָב
  choice: en or
  rationale: Le nom indique la matière dont la coupe est faite ; « en or » est la formulation française naturelle.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: L’adjectif féminin qualifie la coupe et se rend idiomatiquement par « pleine de ».
- source_word: קְטֹרֶת
  choice: encens
  rationale: Terme usuel pour la substance aromatique offerte dans le culte du sanctuaire.
