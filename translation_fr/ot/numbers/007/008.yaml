  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: fr
  text: Il donna les quatre chariots et les huit bœufs aux fils de Merari, selon leur service, sous la direction d’Itamar, fils d’Aaron le prêtre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: chariots
  rationale: Le terme désigne ici des véhicules à roues servant au transport. « Chariots » est naturel en français moderne dans ce contexte et n’impose pas l’idée de chars de guerre.
- source_word: הַבָּקָר
  choice: bœufs
  rationale: Dans ce contexte, ces bovins sont destinés à tirer les chariots ; « bœufs » exprime cette fonction plus précisément que le terme général « bovins ».
- source_word: נָתַן
  choice: donna
  rationale: Le verbe hébreu signifie simplement « donner ». Le contexte implique une attribution officielle, sans que le verbe exige une formulation plus interprétative.
- source_word: לִבְנֵי מְרָרִי
  choice: aux descendants de Merari
  rationale: Littéralement « aux fils de Merari ». « Descendants » rend clairement l’expression lignagère en français actuel sans suggérer qu’il s’agit uniquement de ses fils immédiats.
- source_word: כְּפִי עֲבֹדָתָם
  choice: selon le service qui leur était confié
  rationale: כְּפִי signifie idiomatiquement « selon, en fonction de », et עֲבֹדָה désigne ici le service assigné lié au sanctuaire. La formulation française explicite naturellement ce cadre sans préciser davantage la proportion.
- source_word: בְּיַד אִיתָמָר
  choice: sous la direction d’Itamar
  rationale: Littéralement « par la main d’Itamar » ; dans ce contexte administratif, l’expression indique sa responsabilité ou sa supervision.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le titre défini qualifie Aaron et conserve l’identification formelle de l’hébreu.
