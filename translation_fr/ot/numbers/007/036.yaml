  text: Le cinquième jour, le responsable des fils de Siméon, Sheloumiel, fils de Tsourishaddaï,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Le cinquième jour
  rationale: Rend naturellement la locution temporelle avec l’ordinal, sans ajouter « de la dédicace », absent de ce verset.
- source_word: נָשִׂיא
  choice: responsable
  rationale: Désigne ici le chef reconnu du groupe tribal; « responsable » est clair en français moderne et évite la connotation royale possible de « prince ».
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: des fils de Siméon
  rationale: Conserve de façon transparente la désignation hébraïque de l’appartenance tribale; le ל exprime ici l’affiliation ou la représentation.
- source_word: שְׁלֻמִיאֵל
  choice: Sheloumiel
  rationale: Translittération française du nom propre hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Formule patronymique française habituelle.
- source_word: צוּרִישַׁדָּי
  choice: Tsourishaddaï
  rationale: Translittération française du nom propre hébreu, en conservant l’élément divin Shaddaï.
