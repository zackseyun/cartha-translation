translation:
  language: fr
  text: une coupe en or pesant dix sicles[a], pleine d’encens ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « une coupe, dix, en or, pleine d’encens ». L’unité « sicles » et le mot « pesant » sont ajoutés d’après la formule répétée dans le contexte immédiat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans cet inventaire d’offrandes destinées au sanctuaire, le mot désigne un petit récipient contenant de l’encens. « Coupe » est naturel en français et convient mieux ici que le sens littéral « paume » ou qu’une « cuillère ».
- source_word: אַחַת
  choice: une
  rationale: Le numéral cardinal s’accorde avec le nom féminin כַּף et indique qu’il s’agit d’un seul récipient.
- source_word: עֲשָׂרָה
  choice: pesant dix sicles
  rationale: L’hébreu porte seulement « dix », mais l’unité de poids est sous-entendue d’après la formule répétée dans le contexte immédiat. L’ajout de « pesant » clarifie que la mesure concerne le poids de la coupe.
- source_word: זָהָב
  choice: en or
  rationale: Le nom indique la matière du récipient. « En or » est la formulation française la plus naturelle.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: Cette forme décrit l’état du récipient et introduit son contenu.
- source_word: קְטֹרֶת
  choice: encens
  rationale: C’est le terme français courant pour la substance aromatique offerte dans le contexte du sanctuaire.
