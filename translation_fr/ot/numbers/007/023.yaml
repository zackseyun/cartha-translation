  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: fr
  text: 'et pour le sacrifice de paix[a] : deux bovins, cinq béliers, cinq boucs et cinq agneaux mâles d’un an. Telle fut l’offrande de Netanéel, fils de Tsouar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de communion » ou « sacrifice de bien-être » ; le terme hébreu שְׁלָמִים peut exprimer ces différentes nuances.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de paix
  rationale: La conjonction et la préposition introduisent l’élément suivant de la liste. « Sacrifice de paix » conserve le terme sacrificiel traditionnel tout en signalant en note les autres sens possibles de שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un collectif désignant le gros bétail sans préciser ici le sexe ; « bovins » évite la surinterprétation qu’entraînerait « bœufs ».
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne précisément des béliers.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתּוּדִים désigne des chèvres mâles ; « boucs » est le terme français naturel et précis.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux mâles d’un an
  rationale: כְּבָשִׂים est masculin et בְּנֵי שָׁנָה précise l’âge ; la formulation française rend ces deux éléments explicitement.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Cette formule conclusive identifie l’offrande. Le passé s’accorde au contexte narratif et « offrande » convient au sens cultuel de קָרְבָּן.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: Netanéel, fils de Tsouar
  rationale: Les noms sont translittérés en français moderne, avec le patronyme rendu naturellement par « fils de ».
theological_decisions:
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion ; sacrifice de bien-être
  rationale: Le mot désigne une catégorie cultuelle dont la nuance exacte ne se réduit pas à une seule notion. Le texte retient l’appellation traditionnelle et la note préserve les principales possibilités lexicales.
translation_notes:
  register: Français international moderne, digne et lisible. La structure de liste du texte hébreu est conservée, avec une ponctuation française naturelle et sans préciser le sexe des bovins, que l’hébreu laisse indéterminé.
