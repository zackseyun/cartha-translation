lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Le quatrième jour
  rationale: La préposition בְּ avec « jour » a ici une valeur temporelle; cette formulation est naturelle en français et conserve l’ordinal hébreu.
- source_word: נָשִׂיא
  choice: responsable
  rationale: Dans ce contexte, le terme désigne le chef officiellement reconnu d’une tribu. « Responsable » est clair et actuel, sans la connotation royale que pourrait suggérer « prince ».
- source_word: לִבְנֵי רְאוּבֵן
  choice: des fils de Ruben
  rationale: La préposition לְ marque ici l’appartenance ou la représentation. La formulation retenue reste proche de l’expression familiale et tribale de l’hébreu.
- source_word: אֱלִיצוּר
  choice: Élitsour
  rationale: Translittération française du nom hébreu, avec une graphie qui en représente les consonnes et la prononciation de manière accessible.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu français normal de la formule patronymique hébraïque.
- source_word: שְׁדֵיאוּר
  choice: Shedéour
  rationale: Translittération française du nom hébreu.
