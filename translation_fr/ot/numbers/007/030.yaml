  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: fr
  text: Le quatrième jour, le responsable des fils de Ruben[a] fut Élitsour, fils de Shedéour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les fils de Ruben »; la préposition hébraïque peut exprimer ici l’appartenance ou la représentation.
