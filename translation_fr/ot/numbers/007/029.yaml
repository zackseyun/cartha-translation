source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: fr
  text: 'et, pour le sacrifice de communion : deux bovins, cinq béliers, cinq boucs et cinq agneaux mâles d’un an. Telle fut l’offrande d’Éliab, fils de Hélôn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: La conjonction et la préposition poursuivent l’énumération précédente. « Sacrifice de communion » rend naturellement la catégorie cultuelle שְׁלָמִים sans réduire le terme à la seule idée de paix ou de bien-être.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un collectif désignant le gros bétail sans préciser ici le sexe; « bovins » conserve cette indétermination.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne explicitement des moutons mâles adultes.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne spécifiquement des caprins mâles.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux mâles d’un an
  rationale: La formulation préserve le genre masculin de כְּבָשִׂים dans cette liste sacrificielle et rend idiomatiquement בְּנֵי שָׁנָה.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Cette formule française convient au récapitulatif narratif; le passé s’accorde au contexte tout en conservant la valeur démonstrative de l’hébreu.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Éliab, fils de Hélôn
  rationale: Les noms sont translittérés en français et le patronyme est rendu par la formule concise habituelle.
theological_decisions:
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Le terme peut évoquer paix, intégrité, bien-être et repas partagé. « Communion » exprime bien la dimension relationnelle du sacrifice sans prétendre épuiser son champ sémantique.
translation_notes:
  register: Français international moderne, digne et fluide. Le vocabulaire cultuel reste précis; « bovins » évite d’ajouter un sexe absent du texte, tandis que « boucs » et « agneaux mâles » maintiennent les distinctions exprimées par l’hébreu.
