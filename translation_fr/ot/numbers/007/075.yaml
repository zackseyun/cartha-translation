  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: fr
  text: un taureau pris dans le gros bétail, un bélier, un agneau mâle d’un an, pour un holocauste ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: un taureau pris dans le gros bétail
  rationale: פַּר désigne un taureau ou jeune taureau, tandis que בֶּן בָּקָר précise idiomatiquement qu’il appartient au gros bétail. Cette formulation naturelle conserve les deux éléments sans reproduire littéralement « fils du gros bétail ».
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: אַיִל est le terme courant et précis pour un mouton mâle adulte, notamment dans les prescriptions sacrificielles.
- source_word: כֶּבֶשׂ אֶחָד
  choice: un agneau mâle
  rationale: כֶּבֶשׂ désigne ici un agneau mâle. Le préciser en français préserve la spécification de l’animal offert.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: L’expression hébraïque signifie que l’animal est dans sa première année ou âgé d’un an. « D’un an » est la formulation sacrificielle française la plus concise et naturelle.
- source_word: לְעֹלָה
  choice: pour un holocauste
  rationale: עֹלָה désigne l’offrande entièrement brûlée. « Holocauste » est le terme biblique français établi, et « pour » rend naturellement la préposition לְ.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral répété dénombre séparément chaque animal ; il est maintenu dans chacun des trois groupes nominaux.
theological_decisions:
- issue: Sens sacrificiel de עֹלָה
  choice: holocauste
  alternative: offrande entièrement brûlée
  rationale: « Holocauste » demeure le terme français consacré pour le sacrifice consumé sur l’autel. Il est ici intelligible dans son contexte cultuel et évite une paraphrase plus lourde.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. La structure énumérative de l’hébreu est conservée, avec une ponctuation adaptée à un verset faisant partie d’une liste plus longue.
