lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans la formule d’inventaire répétée en Nombres 7, le terme désigne un petit récipient destiné à contenir l’encens. « Coupe » est naturel en français moderne et reste moins spécifique que « cuillère ».
- source_word: אַחַת
  choice: une
  rationale: Cardinal simple, accordé avec le nom féminin כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: en or de dix sicles
  rationale: Dans ce contexte d’inventaire cultuel, le nombre accompagné de la matière indique le poids du récipient; l’unité « sicles » est sous-entendue et se déduit de la formule de pesée répétée dans le chapitre.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: Adjectif prédicatif décrivant le contenu du récipient; cette tournure est concise et idiomatique.
- source_word: קְטֹרֶת
  choice: encens
  rationale: Équivalent français courant de la substance aromatique offerte.
