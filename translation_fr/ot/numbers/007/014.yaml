lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans ce contexte cultuel, le mot désigne un petit récipient destiné à contenir l’encens. « Coupe » est naturel en français et évite l’image inadéquate d’une cuillère de table.
- source_word: אַחַת
  choice: une
  rationale: Le numéral cardinal s’accorde avec le nom féminin « coupe ».
- source_word: עֲשָׂרָה
  choice: pesant dix sicles
  rationale: Le texte porte littéralement « dix » sans répéter l’unité. La formule des offrandes dans le contexte immédiat indique qu’il s’agit du poids en sicles ; « pesant » explicite naturellement cette ellipse.
- source_word: זָהָב
  choice: en or
  rationale: Cette expression française indique clairement la matière dont le récipient est fait.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: L’adjectif féminin qualifie le récipient et introduit naturellement son contenu en français.
- source_word: קְטֹרֶת
  choice: encens
  rationale: Terme français courant et précis pour la substance aromatique employée dans le culte.
