  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: fr
  text: Il donna les deux chariots et les quatre bovins aux fils de Guershon, selon leur service.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: chariots
  rationale: עֲגָלָה désigne ici un véhicule servant au transport. « Chariots » est naturel en français et convient au contexte du transport du sanctuaire.
- source_word: הַבָּקָר
  choice: bovins
  rationale: בָּקָר est un collectif désignant des bêtes bovines. « Bovins » préserve cette généralité sans préciser indûment le sexe, même si le contexte suggère des animaux de trait.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: aux fils de Guershon
  rationale: Cette formulation reproduit naturellement l’expression filiale de l’hébreu plutôt que de la remplacer par un gentilé.
- source_word: כְּפִי עֲבֹדָתָם
  choice: selon le service qui leur était confié
  rationale: L’expression indique que le don correspondait à leur tâche assignée. L’explicitation « qui leur était confié » rend cette nuance idiomatiquement en français sans modifier le sens contextuel.
- source_word: נָתַן
  choice: Il donna
  rationale: Le verbe signifie simplement « donner » ; cette traduction évite d’ajouter l’idée plus interprétative d’une attribution administrative.
