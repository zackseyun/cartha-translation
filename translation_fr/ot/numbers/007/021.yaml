lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: un taureau du gros bétail
  rationale: פַּר désigne ici un taureau, et בֶּן בָּקָר le rattache au gros bétail. Cette formulation naturelle en français conserve la précision de la liste sacrificielle sans reproduire littéralement l’idiome « fils du gros bétail ».
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: אַיִל est le terme ordinaire pour un mouton mâle adulte, notamment dans les listes sacrificielles.
- source_word: כֶּבֶשׂ אֶחָד
  choice: un agneau mâle
  rationale: כֶּבֶשׂ désigne un agneau; « mâle » explicite le genre de l’animal indiqué par le terme hébreu dans ce contexte sacrificiel.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: L’idiome indique l’âge requis de l’animal. « D’un an » est la formulation française courante et précise.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: עֹלָה désigne l’offrande entièrement consumée. « Holocauste » est le terme biblique français établi, et « pour » rend naturellement le préfixe לְ dans cette énumération.
