  register: Français international moderne, digne et lisible. La syntaxe de l’inventaire est légèrement fluidifiée par « comprenait » et par deux participes de poids. Les termes cultuels sont conservés sans archaïsme inutile; les formes incertaines des récipients sont signalées en notes.
