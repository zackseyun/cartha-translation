  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande comprenait un plat d’argent[a] pesant cent trente sicles, et un bassin d’argent[b] pesant soixante-dix sicles, selon le sicle du sanctuaire[c]. Tous deux étaient remplis de fleur de farine mêlée d’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coupe » ou « récipient peu profond » ; le terme hébreu קְעָרָה ne permet pas d’en déterminer précisément la forme.
    reason: lexical_alternative
  - marker: b
    text: Ou « coupe d’aspersion » ; le terme hébreu מִזְרָק désigne ailleurs un récipient employé dans le service cultuel, notamment pour l’aspersion.
    reason: lexical_alternative
  - marker: c
    text: Le « sicle du sanctuaire » était l’étalon de poids en usage pour le sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande
  rationale: קָרְבָּן désigne ce qui est présenté dans le cadre du culte. « Offrande » est clair, naturel et adapté au contexte sacrificiel.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קְעָרָה peut désigner un plat, une coupe ou un récipient peu profond. « Plat » reste concret sans préciser excessivement sa forme.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: Cette formulation française naturelle exprime explicitement le poids indiqué par la construction nominale hébraïque.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin d’argent
  rationale: מִזְרָק désigne un récipient cultuel, parfois employé pour l’aspersion. « Bassin » n’impose pas ici une fonction que le verset ne précise pas.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: Le poids du bassin est rendu explicitement et naturellement en français.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La formule désigne l’étalon de poids officiel associé au sanctuaire; la traduction conserve sa spécificité cultuelle.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Tous deux étaient remplis
  rationale: Le duel renvoie clairement aux deux récipients et l’accord masculin pluriel convient à « plat » et « bassin ».
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française consacrée pour une farine très fine employée dans les offrandes.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie avec de l’huile
  rationale: Le participe décrit la farine mêlée à l’huile. « Pétrie avec » est idiomatique dans ce contexte alimentaire et sacrificiel.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne l’offrande non sanglante préparée à partir de farine; « offrande de céréales » est précis et accessible.
theological_decisions: []
