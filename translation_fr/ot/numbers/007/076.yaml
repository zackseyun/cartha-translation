  rationale: Le numéral est conservé dans la formulation française, conformément au caractère répétitif et inventorial de Nombres 7.
- source_word: לְחַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne l’offrande sacrificielle liée au péché et à la purification, et non simplement le péché abstrait.
