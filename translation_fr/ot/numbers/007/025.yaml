base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande consistait en un plat d’argent[a] pesant cent trente sicles, et un bassin d’argent[b] pesant soixante-dix sicles, selon le sicle du sanctuaire[c]. Tous deux étaient remplis de fleur de farine mêlée à l’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une coupe d’argent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un bol d’argent ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire selon l’étalon de poids en vigueur au sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande consistait en
  rationale: קָרְבָּן désigne ici ce qui est présenté dans un cadre cultuel. « Offrande » est précis et courant; « consistait en » introduit naturellement l’inventaire sans modifier son contenu.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קְעָרָה désigne un récipient probablement large et peu profond. « Plat » convient à cet objet cultuel, tandis que « coupe » risquerait de suggérer un récipient plus petit ou destiné à boire.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: La formulation française exprime naturellement le poids par le participe « pesant » tout en conservant la valeur exacte du texte hébreu.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin d’argent
  rationale: מִזְרָק désigne un récipient cultuel associé notamment à la manipulation ou à l’aspersion de liquides. « Bassin » le distingue clairement du premier plat.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: 'La répétition de « pesant » lève toute ambiguïté en français: les soixante-dix sicles indiquent le poids du bassin.'
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition בְּ indique ici la norme de mesure. Cette traduction conserve l’expression cultuelle tout en signalant qu’il s’agit de l’étalon officiel du sanctuaire.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Tous deux étaient remplis
  rationale: Le masculin duel de sens renvoie explicitement aux deux récipients. « Tous deux » est naturel et fidèle à l’insistance du texte.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: סֹלֶת désigne une farine fine de qualité destinée aux offrandes. « Fleur de farine » est l’expression française traditionnelle et précise pour une farine très fine.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe בְּלוּלָה décrit la farine mêlée à l’huile. « Pétrie à l’huile » est une formulation cultuelle française idiomatique; la note n’est pas nécessaire puisque l’idée essentielle de mélange est conservée.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne spécifiquement l’offrande non sanglante préparée à partir de produits céréaliers. « Offrande de céréales » est clair pour un lectorat moderne.
