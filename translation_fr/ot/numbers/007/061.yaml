  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande était un plat d’argent[a] pesant cent trente sicles, et un bassin d’argent[b] pesant soixante-dix sicles, selon le sicle du sanctuaire[c] ; tous deux étaient remplis de fleur de farine mêlée d’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plateau » pour קַעֲרָה.
    reason: lexical_alternative
  - marker: b
    text: Ou « coupe » pour מִזְרָק, récipient employé dans le service du sanctuaire.
    reason: lexical_alternative
  - marker: c
    text: Le « sicle du sanctuaire » désigne le sicle conforme à l’étalon de poids du sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Son offrande était
  rationale: קָרְבָּן désigne ici ce qui est présenté dans le cadre du culte. « Offrande » est précis et courant ; le verbe « était » donne à l’inventaire nominal une syntaxe française naturelle.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קַעֲרָה désigne un récipient plutôt large et peu profond. « Plat » convient mieux en français moderne que « assiette » dans ce contexte cultuel.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: 'L’hébreu exprime littéralement « son poids : cent trente ». La tournure participiale est naturelle en français et conserve clairement la valeur pondérale.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: un bassin d’argent
  rationale: מִזְרָק est un récipient employé dans le service sacrificiel. « Bassin » garde cette nuance cultuelle, tandis que « coupe » demeure une possibilité selon la forme envisagée.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: La répétition de « pesant » rend explicite et naturelle en français la mesure elliptique du second récipient.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: Cette expression indique que les poids sont calculés d’après l’étalon officiel du sanctuaire. La traduction conserve la formulation cultuelle tout en restant compréhensible.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: tous deux étaient remplis de
  rationale: « Tous deux » reprend explicitement les deux récipients, comme le pronom hébreu, et « étaient remplis de » convient naturellement à leur contenu.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Terme français consacré et précis pour la farine fine et raffinée employée dans les offrandes.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: pétrie avec de l’huile
  rationale: Le participe passif décrit la farine incorporée ou mélangée à l’huile. « Pétrie avec » est idiomatique dans le contexte d’une préparation à base de farine, sans ajouter d’ingrédient.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne précisément l’offrande non animale faite de farine ou de céréales, plutôt qu’une offrande générique.
