  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: fr
  text: un taureau du gros bétail[a], un bélier, un agneau mâle d’un an, pour l’holocauste ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « un taureau, fils du gros bétail ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: taureau
  rationale: Le terme désigne un taureau, éventuellement jeune. « Taureau » est précis et naturel dans cet inventaire sacrificiel.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral est répété devant chaque animal ; sa répétition est conservée pour respecter la structure de la liste.
- source_word: בֶּן בָּקָר
  choice: pris dans le gros bétail
  rationale: Littéralement « fils du gros bétail », cette expression classe le taureau parmi les bovins. La formulation française évite un calque obscur tout en préservant cette précision.
- source_word: אַיִל
  choice: bélier
  rationale: Équivalent français usuel du mâle adulte de l’espèce ovine dans un contexte sacrificiel.
- source_word: כֶּבֶשׂ
  choice: agneau mâle
  rationale: Le mot désigne un agneau et, dans cet inventaire sacrificiel, renvoie à un animal mâle ; « agneau mâle » explicite naturellement cette valeur.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: L’idiome hébreu indique que l’animal est dans sa première année ou âgé d’un an ; « d’un an » est la formulation française concise et courante.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: עֹלָה est le terme sacrificiel traditionnellement rendu par « holocauste », offrande entièrement consumée. La préposition indique la destination des animaux.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe nominale et la répétition de « un » reproduisent le rythme de l’inventaire hébreu. « Gros bétail » conserve la classification bovine sans recourir au calque peu naturel « fils du bétail ».
