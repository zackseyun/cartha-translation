base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/085.yaml
  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: fr
  text: chaque plat d’argent pesait cent trente sicles, et chaque bassin, soixante-dix. Le poids total de l’argent de ces récipients était de deux mille quatre cents sicles, selon le sicle du sanctuaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: cent trente
  rationale: Le nombre hébreu, littéralement « trente et cent », se rend selon l’ordre idiomatique du français moderne.
- source_word: הַקְּעָרָה הָאַחַת כֶּסֶף
  choice: chaque plat d’argent
  rationale: Dans ce récapitulatif, le singulier défini accompagné de « un » a une valeur distributive. קְעָרָה désigne ici un plat, et כֶּסֶף la matière, l’argent.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: chaque bassin
  rationale: Le singulier défini est distributif dans ce contexte. מִזְרָק désigne un récipient cultuel, rendu clairement par « bassin ».
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: le poids total de l’argent de ces récipients
  rationale: La formulation explicite naturellement en français qu’il s’agit du poids cumulé de l’argent constituant les objets précédemment énumérés.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: deux mille quatre cents
  rationale: Rendu cardinal usuel en français moderne.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition בְּ indique ici l’étalon de poids employé ; « selon » exprime naturellement cette valeur de référence.
