  text: וַ/יַּקְרִ֣יבוּ הַ/נְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הִמָּשַׁ֣ח אֹת֑/וֹ וַ/יַּקְרִ֧יבוּ הַ/נְּשִׂיאִ֛ם אֶת קָרְבָּנָ֖/ם לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: fr
  text: Les responsables présentèrent alors l’offrande pour la dédicace de l’autel[a], le jour où il fut oint ; les responsables présentèrent leur offrande devant l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « la dédicace de l’autel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: présentèrent
  rationale: Le hifil de קרב, dans un contexte cultuel, signifie faire approcher, présenter ou offrir. « Présentèrent » convient aux deux occurrences et évite la tournure maladroite « offrir leur offrande ».
- source_word: הַנְּשִׂאִים
  choice: les responsables
  rationale: Dans les Nombres, נָשִׂיא désigne les hommes placés à la tête des tribus. « Responsables » est clair et actuel, sans la connotation monarchique de « princes ».
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: l’offrande pour la dédicace de l’autel
  rationale: חֲנֻכָּה signifie « dédicace ». Ici, ce que les responsables présentent correspond aux dons liés à cette dédicace. La formulation française explicite ce référent implicite, tandis qu’une note conserve la construction plus littérale.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: le jour où celui-ci reçut l’onction
  rationale: La construction infinitive introduite par בְּ marque le moment. « Reçut l’onction » est naturel en français moderne et conserve la précision temporelle ainsi que la portée cultuelle de משׁח.
- source_word: קָרְבָּנָם
  choice: leur offrande
  rationale: קָרְבָּן désigne ici un don présenté dans le cadre du culte. « Offrande » est le terme français usuel dans ce contexte.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: devant l’autel
  rationale: לִפְנֵי a ici son sens spatial courant, « devant » ou « en présence de » ; « devant l’autel » est précis et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « les responsables présentèrent » est conservée afin de refléter la structure emphatique de l’hébreu.
