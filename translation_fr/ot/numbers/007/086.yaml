source:
  edition: WLC
  text: כַּפּ֨וֹת זָהָ֤ב שְׁתֵּים עֶשְׂרֵה֙ מְלֵאֹ֣ת קְטֹ֔רֶת עֲשָׂרָ֧ה עֲשָׂרָ֛ה הַ/כַּ֖ף בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ כָּל זְהַ֥ב הַ/כַּפּ֖וֹת עֶשְׂרִ֥ים וּ/מֵאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: fr
  text: Douze coupes d’or pleines d’encens[a], chaque coupe pesant dix sicles selon le sicle du sanctuaire. Le poids total de l’or des coupes était de cent vingt sicles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « récipients », « bols » ou, selon la traduction traditionnelle, « cuillères » pour les objets contenant l’encens.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: coupes
  rationale: Dans le contexte des offrandes du sanctuaire, le terme désigne de petits récipients destinés à contenir l’encens. « Coupes » est naturel en français moderne tout en conservant la forme exacte indéterminée.
- source_word: זָהָב
  choice: en or
  rationale: Désignation directe du matériau dont sont faits les récipients.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: douze
  rationale: Nombre cardinal indiquant le total des récipients.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: pleines d’encens
  rationale: Rend directement l’adjectif « pleines » et son complément, dans une formulation française concise.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: chaque coupe pesant dix sicles
  rationale: 'La répétition du nombre exprime une répartition : dix sicles pour chacune des coupes. « Pesant » explicite naturellement la valeur pondérale indiquée par le contexte.'
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: Conserve la formule technique qui renvoie à l’étalon officiel de poids utilisé au sanctuaire.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: le poids total de l’or des coupes
  rationale: Le contexte de pesée permet d’exprimer explicitement qu’il s’agit de la quantité totale d’or représentée par les coupes.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: cent vingt sicles
  rationale: Le texte donne le total de 120; l’unité « sicles » est reprise du membre de phrase précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le terme technique « sicle » est conservé, de même que la formule cultuelle « sicle du sanctuaire ». La ponctuation répartit les deux données principales en deux phrases pour faciliter la lecture.
