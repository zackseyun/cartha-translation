  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/057.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: fr
  text: un taureau du gros bétail[a], un bélier, un agneau mâle d’un an, pour un holocauste ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un taureau, fils du gros bétail ». Cette expression hébraïque désigne un taureau appartenant aux bovins; elle est aussi souvent rendue par « un jeune taureau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: taureau
  rationale: Le nom désigne un taureau, souvent jeune, dans les listes sacrificielles. « Taureau » est ici clair et naturel.
- source_word: אֶחָד
  choice: un
  rationale: Le nombre cardinal précise qu’un seul animal de chaque catégorie est offert.
- source_word: בֶּן בָּקָר
  choice: du gros bétail
  rationale: L’expression signifie littéralement « fils du gros bétail » et classe le taureau parmi les bovins. Cette formulation conserve cette précision sans reproduire littéralement l’idiome hébreu.
- source_word: אַיִל
  choice: bélier
  rationale: C’est le terme courant pour le mouton mâle adulte employé dans les sacrifices.
- source_word: כֶּבֶשׂ
  choice: agneau mâle
  rationale: Le terme désigne un agneau, de sexe mâle dans ce contexte sacrificiel; la traduction explicite cette donnée.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: Cet idiome hébreu indique que l’animal est âgé d’un an; « d’un an » est la formulation française naturelle.
- source_word: לְעֹלָה
  choice: pour un holocauste
  rationale: עֹלָה est le terme sacrificiel traditionnellement et précisément rendu par « holocauste », offrande entièrement consumée sur l’autel.
