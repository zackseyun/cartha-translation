  text: וַ/יְהִ֗י הַ/מַּקְרִ֛יב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן אֶת קָרְבָּנ֑/וֹ נַחְשׁ֥וֹן בֶּן עַמִּינָדָ֖ב לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: fr
  text: Celui qui présenta son offrande le premier jour fut Nahshôn, fils d’Amminadab, de la tribu de Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut
  rationale: Dans cette phrase d’identification, le verbe « être » au passé simple rend naturellement la forme narrative hébraïque sans recourir à l’archaïsme « il arriva que ».
- source_word: הַמַּקְרִיב
  choice: celui qui présenta
  rationale: Le participe hiphil de קרב désigne celui qui fait approcher ou présente l’offrande. Le passé simple convient à la narration et restitue l’acte cultuel en français courant et digne.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: le premier jour
  rationale: Expression temporelle française naturelle correspondant directement à l’hébreu.
- source_word: אֶת קָרְבָּנוֹ
  choice: son offrande
  rationale: « Offrande » conserve la portée cultuelle de קָרְבָּן dans le contexte de la dédicace du sanctuaire.
- source_word: נַחְשׁוֹן
  choice: Nahshôn
  rationale: Translittération française claire du nom hébreu, avec accent circonflexe signalant la voyelle longue sans alourdir la lecture.
- source_word: בֶּן עַמִּינָדָב
  choice: fils d’Amminadab
  rationale: Rendu direct et idiomatique du patronyme hébreu.
- source_word: לְמַטֵּה יְהוּדָה
  choice: pour la tribu de Juda
  rationale: La préposition לְ peut indiquer ici que Nahshôn agit au nom de sa tribu; « pour » préserve cette nuance de représentation, tandis que l’appartenance tribale reste possible.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au registre biblique écrit sans être archaïque. La formulation conserve la nuance cultuelle d’« offrande » et l’ambiguïté légère de la préposition hébraïque par une note.
