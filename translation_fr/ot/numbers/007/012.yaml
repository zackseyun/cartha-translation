  source_fidelity: La proposition לְ dans la formule tribale situe Nahshôn par rapport à la tribu de Juda; dans ce contexte de listes de dédicace, elle s’exprime le plus directement en français par « de la tribu de Juda ». Le sens représentatif est implicite dans l’action du chef tribal, mais « pour la tribu » fait de cette nuance pragmatique le sens grammatical principal.
