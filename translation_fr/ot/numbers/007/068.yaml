lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans le contexte des offrandes cultuelles de Nombres 7, le mot désigne un petit récipient cérémoniel contenant de l’encens. « Coupe » est naturel en français moderne et évite l’image trompeuse d’une cuillère ordinaire.
- source_word: אַחַת
  choice: une
  rationale: Cardinal simple accordé au féminin avec כַּף ; l’article indéfini français exprime naturellement ici le nombre « un ».
- source_word: זָהָב
  choice: en or
  rationale: Le nom indique la matière dont le récipient est fait ; « en or » est la tournure française idiomatique.
- source_word: עֲשָׂרָה
  choice: dix
  rationale: Le nombre renvoie à l’unité de poids sous-entendue dans la formule répétée du chapitre.
- source_word: עֲשָׂרָה זָהָב
  choice: pesant dix sicles
  rationale: L’hébreu est elliptique et omet l’unité. Le contexte formulaire de Nombres 7 indique qu’il s’agit du poids du récipient ; l’ajout explicite de « sicles » rend le sens intelligible.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: Adjectif prédicatif décrivant le contenu du récipient ; cette formulation est concise et idiomatique.
- source_word: קְטֹרֶת
  choice: encens
  rationale: Équivalent français standard de la substance aromatique offerte dans le culte.
