  rationale: Le numéral est conservé dans le style d’inventaire répétitif de Nombres 7. En français, « un bouc » exprime naturellement à la fois l’indéfini et le compte exact.
- source_word: לְחַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne couramment le sacrifice offert en rapport avec le péché. Cette formulation française claire conserve la désignation sacrificielle sans ajouter d’interprétation doctrinale.
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte sacrificiel
  choice: sacrifice pour le péché
  alternative: pour le péché
