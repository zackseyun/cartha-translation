- source_word: שְׂעִיר עִזִּים
  choice: bouc
  rationale: L’expression désigne un mâle de la chèvre. « Bouc » est le terme français naturel et précis, qui conserve explicitement le sexe de l’animal.
- source_word: אֶחָד
