  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: fr
  text: Le neuvième jour, le responsable des fils de Benjamin[a] était Abidân, fils de Guidéoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le responsable représentant les fils de Benjamin ». La préposition hébraïque peut exprimer ici une relation ou une fonction de représentation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: Le neuvième jour
  rationale: 'Dans cette indication temporelle, la préposition בְּ se rend naturellement en français sans préposition : « Le neuvième jour ».'
- source_word: נָשִׂיא
  choice: responsable
  rationale: Dans Nombres 7, le terme désigne le dirigeant reconnu d’une tribu. « Responsable » exprime clairement cette fonction sans les connotations royales possibles de « prince ».
- source_word: לִבְנֵי בִנְיָמִן
  choice: des fils de Benjamin
  rationale: Le לְ marque ici le lien du responsable avec le groupe tribal, tout en pouvant suggérer qu’il le représente. « Fils de Benjamin » conserve l’expression familiale masculine de l’hébreu.
- source_word: אֲבִידָן
  choice: Abidân
  rationale: Translittération française usuelle du nom hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu naturel et précis de la construction patronymique hébraïque.
- source_word: גִּדְעֹנִי
  choice: Guidéoni
  rationale: Translittération française usuelle du nom hébreu.
theological_decisions:
- issue: Désignation tribale genrée בְנֵי
  choice: fils de Benjamin
  alternative: descendants de Benjamin ; Benjaminites
  rationale: L’expression hébraïque présente la tribu comme les fils issus de l’ancêtre Benjamin. Le rendu retenu préserve cette image familiale et le genre grammatical du texte sans réduire la désignation aux seuls hommes individuellement.
- issue: Valeur relationnelle ou représentative de לְ dans לִבְנֵי בִנְיָמִן
  choice: responsable des fils de Benjamin
  alternative: responsable représentant les fils de Benjamin
  rationale: Le français « responsable de » rend naturellement l’appartenance ou la relation. Une note conserve la possibilité que la préposition souligne plus précisément la représentation du groupe.
translation_notes:
  register: Français international actuel, sobre et digne. La phrase nominale hébraïque est explicitée par « était » pour produire une proposition française naturelle, sans modifier l’identification du responsable.
