  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: fr
  text: 'Et pour le sacrifice de communion[a] : deux bovins, cinq béliers, cinq boucs et cinq agneaux mâles âgés d’un an. Telle fut l’offrande d’Ahira, fils d’Énan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: Et pour le sacrifice de communion
  rationale: La conjonction et la préposition introduisent l’élément suivant de l’inventaire. « Sacrifice de communion » conserve la construction nominale זֶבַח הַשְּׁלָמִים et désigne naturellement en français cette catégorie cultuelle, sans réduire שְׁלָמִים à la seule idée de paix.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un collectif désignant le gros bétail sans préciser ici le sexe. « Bovins » est exact, courant dans un inventaire et évite d’ajouter « bœufs » ou « taureaux ».
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִים désigne précisément des béliers ; le terme français conserve le sexe et l’espèce.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne des caprins mâles. « Boucs » est le terme français précis et naturel.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux mâles âgés d’un an
  rationale: La formulation rend explicitement le sexe indiqué par כְּבָשִׂים et l’âge exprimé idiomatiquement par בְּנֵי שָׁנָה.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Cette formule conclut et identifie l’offrande dans le récit. Le passé simple convient au registre narratif dignifié, tandis que « offrande » est le terme cultuel usuel pour קָרְבָּן.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: Ahira, fils d’Énân
  rationale: Les noms sont translittérés et le patronyme hébreu est rendu par la formulation française naturelle « fils de ».
theological_decisions:
- issue: Sens cultuel de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix ; sacrifice de bien-être
  rationale: Le terme hébreu peut évoquer la paix, l’intégrité ou le bien-être, et le rite comporte une dimension de communion. Le texte principal emploie une désignation française claire, tandis que la note conserve les principales possibilités lexicales sans imposer une interprétation théologique unique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe d’inventaire du texte hébreu est conservée sans lourdeur ; les termes zoologiques restent précis et les noms propres suivent une translittération française avec accents de lecture.
