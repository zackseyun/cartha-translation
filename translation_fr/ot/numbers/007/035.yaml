  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: fr
  text: 'et, pour le sacrifice de communion[a] : deux bovins, cinq béliers, cinq boucs et cinq agneaux d’un an. Telle fut l’offrande d’Élitsour, fils de Shedéour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: La conjonction et la préposition poursuivent l’énumération des offrandes. « Sacrifice de communion » rend le terme cultuel שְׁלָמִים de façon naturelle, tout en laissant en note ses autres nuances possibles.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un collectif désignant le gros bétail, sans préciser ici le sexe; « bovins » évite la précision excessive de « taureaux » ou « bœufs ».
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne sans ambiguïté des moutons mâles adultes.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne spécifiquement des chèvres mâles; « boucs » exprime cette précision sans périphrase.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux d’un an
  rationale: כְּבָשִׂים désigne ici des agneaux, et בְּנֵי שָׁנָה indique leur âge. « D’un an » est l’expression française naturelle.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Cette formule récapitulative est rendue au passé pour s’intégrer au récit français; קָרְבַּן est le terme général pour une offrande présentée à Dieu.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Élitsour, fils de Shedéour
  rationale: Les noms sont translittérés en français, et le patronyme est rendu selon la formule française usuelle « fils de ».
theological_decisions:
- issue: Sens cultuel de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Le terme peut évoquer la paix, le bien-être ou la communion liée au repas sacrificiel. Le texte principal retient une désignation cultuelle française intelligible, tandis que la note préserve l’étendue sémantique sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la forme d’inventaire du verset. Les termes animaliers restent précis sans ajouter de sexe non explicitement marqué pour les bovins ou les agneaux.
