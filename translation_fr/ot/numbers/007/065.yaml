id: NUM.7.65
reference: Numbers 7:65
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: fr
  text: 'et, pour le sacrifice de communion[a] : deux bovins, cinq béliers, cinq boucs et cinq agneaux mâles âgés d’un an. Telle fut l’offrande d’Abidân, fils de Guidéoni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: La conjonction et la préposition rattachent cet élément à l’inventaire précédent. « Sacrifice » rend זֶבַח, tandis que « de communion » exprime naturellement la catégorie cultuelle שְׁלָמִים sans en réduire le sens à la seule paix subjective.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un collectif désignant le gros bétail; « bovins » préserve l’absence de précision quant au sexe, contrairement à « taureaux » ou « bœufs ».
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne précisément des béliers.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתֻּדִים désigne des caprins mâles; « boucs » est précis et idiomatique en français.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux mâles âgés d’un an
  rationale: La traduction explicite le sexe indiqué par כְּבָשִׂים dans ce contexte et rend idiomatiquement בְּנֵי שָׁנָה.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: Cette formule conclut l’inventaire. Le passé convient au récit français, même si l’hébreu ne comporte pas ici de verbe exprimant explicitement le temps.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: Abidân, fils de Guidéoni
  rationale: Les noms sont translittérés selon une forme française lisible, et בֶּן est rendu par la formule patronymique naturelle « fils de ».
theological_decisions:
- issue: Sens cultuel de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Le terme peut évoquer la paix, l’intégrité ou le bien-être ainsi que le repas partagé lié au sacrifice. « Communion » fournit en français une désignation cultuelle claire, tandis qu’une note conserve les principales possibilités lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. L’énumération reste proche de l’ordre hébreu; la ponctuation clarifie sa relation avec les versets précédents.
