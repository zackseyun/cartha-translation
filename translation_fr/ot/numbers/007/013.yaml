  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: fr
  text: Son offrande était un plat d’argent[a] pesant cent trente sicles, une coupe d’argent[b] pesant soixante-dix sicles, selon le sicle du sanctuaire. Tous deux étaient remplis de fleur de farine mélangée à l’huile, pour une offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un plateau »; le terme hébreu désigne un récipient large et peu profond.
    reason: lexical_alternative
  - marker: b
    text: Ou « un bassin »; le terme hébreu désigne un récipient rituel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: Son offrande était
  rationale: קָרְבָּן désigne ici ce qui est présenté dans un cadre cultuel. « Offrande » est précis et naturel; le waw relie le verset à l’inventaire précédent sans qu’un « et » soit nécessaire en français.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: un plat d’argent
  rationale: קַעֲרָה désigne vraisemblablement un récipient large et peu profond. « Plat » rend naturellement cette forme générale sans lui attribuer une fonction plus précise que le texte.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesant cent trente sicles
  rationale: La tournure participiale française exprime clairement l’indication de poids qui suit le récipient tout en restant fluide.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: une coupe d’argent
  rationale: מִזְרָק est un récipient rituel, mais sa fonction précise n’est pas indiquée ici. « Coupe » convient au contexte d’inventaire sans ajouter l’idée explicite d’aspersion.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesant soixante-dix sicles
  rationale: Cette formulation rend explicitement et naturellement le poids de la coupe, sous-entendu dans la construction hébraïque.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La formule conserve la référence au poids étalon cultuel sans paraphrase interprétative.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Tous deux étaient remplis
  rationale: « Tous deux » reprend explicitement les deux récipients, comme la forme hébraïque.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Cette expression française établie désigne une farine très fine et convient au vocabulaire des offrandes.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mélangée à l’huile
  rationale: Le participe passif indique que la farine a été mêlée à l’huile; cette formulation est claire en français moderne.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne la catégorie cultuelle de l’offrande faite de produits céréaliers. Cette traduction est précise et compréhensible.
