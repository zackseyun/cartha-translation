source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: fr
  text: 'et, pour le sacrifice de communion[a] : deux bovins, cinq béliers, cinq boucs et cinq agneaux âgés d’un an. Telle fut l’offrande de Nahshôn, fils d’Amminadab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ». Le terme hébreu désigne souvent un sacrifice accompagné d’un repas partagé dans la communion et la paix.
    reason: Alternative lexicale pour le terme cultuel שְׁלָמִים.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: et, pour le sacrifice de communion
  rationale: Les préfixes introduisent un nouvel élément de la liste. « Sacrifice de communion » rend le terme cultuel שְׁלָמִים en évoquant le repas sacrificiel partagé, sans réduire son sens à une simple paix intérieure.
- source_word: בָּקָר שְׁנַיִם
  choice: deux bovins
  rationale: בָּקָר est un collectif désignant le gros bétail et ne précise pas ici le sexe des animaux ; « bovins » conserve cette généralité.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinq béliers
  rationale: אֵילִם désigne précisément des béliers.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: cinq boucs
  rationale: עַתּוּדִים désigne des caprins mâles ; « boucs » est le terme français actuel et précis.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinq agneaux âgés d’un an
  rationale: La formulation rend naturellement l’espèce et l’âge indiqués, sans ajouter une précision explicite de sexe absente de l’expression בְּנֵי שָׁנָה.
- source_word: זֶה קָרְבַּן
  choice: Telle fut l’offrande de
  rationale: La proposition nominale hébraïque récapitule l’ensemble de l’offrande ; le passé convient au cadre narratif français.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nahshôn, fils d’Amminadab
  rationale: Les noms sont translittérés et le patronyme בֶּן est rendu selon l’usage français par « fils de ».
theological_decisions:
- issue: Sens cultuel de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix ; sacrifice de bien-être
  rationale: Le terme peut souligner la paix, le bien-être ou la communion manifestée dans un repas sacrificiel partagé. Le choix principal reste ouvert grâce à une note présentant les autres rendus possibles.
translation_notes:
  register: Français international moderne, sobre et digne. L’énumération garde le rythme d’un inventaire cultuel ; « bovins » évite de préciser indûment le sexe, tandis que « béliers » et « boucs » conservent les précisions lexicales du texte hébreu.
