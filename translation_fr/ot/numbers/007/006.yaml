  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: fr
  text: Moïse prit les chariots et le bétail, et les donna aux Lévites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « bétail » désigne collectivement les bovins ; le contexte précise qu’il s’agit de bœufs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le qal wayyiqtol de לקח signifie normalement « prendre ». Ici, Moïse prend possession des dons qui viennent d’être présentés.
- source_word: הָעֲגָלֹת
  choice: les chariots
  rationale: עֲגָלוֹת désigne ici des véhicules destinés au transport dans le cadre du service du sanctuaire. « Chariots » est naturel en français moderne, sans préciser davantage leur forme.
- source_word: הַבָּקָר
  choice: le bétail
  rationale: בָּקָר est un collectif désignant les bovins. « Le bétail » préserve la formulation générale du verset, même si le contexte indique qu’il s’agit de bœufs.
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le qal wayyiqtol de נתן signifie directement « donner ». Le contexte suffit à faire comprendre qu’il s’agit d’une remise organisée pour le service.
- source_word: אוֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel reprend collectivement les chariots et le bétail. En français, le pronom « les » rend naturellement cette reprise.
- source_word: אֶל הַלְוִיִּם
  choice: aux Lévites
  rationale: La préposition אֶל marque ici le destinataire du transfert. « Aux Lévites » est l’équivalent français direct et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. L’ordre narratif et les verbes concrets de l’hébreu sont conservés. « Donc » rend la continuité de וַ־ dans le contexte, tandis que la répétition française de « et » maintient le rythme narratif sans lourdeur excessive.
