  text: un bouc en sacrifice pour le péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour un sacrifice pour le péché ». Le terme hébreu חַטָּאת peut signifier « péché » ou, dans un contexte sacrificiel comme ici, « sacrifice pour le péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: Cette expression construite désigne idiomatiquement un mâle parmi les chèvres. « Bouc » est le terme français naturel et précis pour cet animal sacrificiel.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral compte l’animal offert et maintient le style d’inventaire répétitif de Nombres 7.
- source_word: לְחַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne le sacrifice offert à propos du péché. Cette formulation française explicite la valeur sacrificielle tout en conservant le lien lexical avec le péché; la préposition לְ est rendue par « pour ».
theological_decisions:
- issue: Sens de חַטָּאת dans un contexte sacrificiel
  choice: le sacrifice pour le péché
  alternative: le péché
  rationale: L’inventaire des offrandes exige ici le sens cultuel du nom plutôt que la seule notion abstraite de péché. La traduction évite toutefois de préciser davantage la fonction théologique du sacrifice que ne le fait l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La tournure brève conserve le caractère d’inventaire du chapitre.
