  text: un taureau du troupeau, un bélier, un agneau mâle d’un an, pour l’holocauste ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: un taureau du gros bétail
  rationale: פַּר désigne un taureau ou jeune taureau, tandis que בֶּן בָּקָר précise son appartenance au cheptel bovin. « Du gros bétail » rend cette classification sans le littéralisme obscur de « fils du troupeau ».
- source_word: אֶחָד
  choice: un
  rationale: La répétition du numéral structure l’inventaire sacrificiel ; sa conservation respecte le rythme comptable de l’hébreu.
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: אַיִל est le terme courant pour le mouton mâle adulte, notamment dans les contextes sacrificiels.
- source_word: כֶּבֶשׂ אֶחָד
  choice: un agneau mâle
  rationale: כֶּבֶשׂ désigne ici un jeune mouton mâle ; « agneau mâle » conserve la précision de sexe présente dans l’hébreu.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: Cette expression idiomatique indique l’âge réglementaire de l’animal. « D’un an » est naturel et précis en français moderne.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: עֹלָה désigne l’offrande entièrement brûlée. « Holocauste » est le terme sacrificiel français consacré, et la préposition « pour » convient à la forme d’inventaire.
