  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י אֶפְרָ֑יִם אֱלִֽישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: fr
  text: Le septième jour, le chef des fils d’Éphraïm[a] était Élishama, fils d’Ammihoud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef pour les fils d’Éphraïm ». La préposition hébraïque peut indiquer un lien d’appartenance ou une fonction de représentation.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Le septième jour
  rationale: La préposition ב avec יוֹם et l’ordinal forme une indication temporelle. « Le septième jour » est la tournure française la plus naturelle et précise.
- source_word: נָשִׂיא
  choice: responsable
  rationale: Dans Nombres 7, le terme désigne le chef tribal chargé de présenter l’offrande. « Responsable » exprime clairement cette fonction représentative sans la connotation monarchique de « prince ».
- source_word: לִבְנֵי אֶפְרָיִם
  choice: des fils d’Éphraïm
  rationale: La préposition ל marque ici le lien ou la représentation auprès des descendants tribaux. « Des fils d’Éphraïm » conserve l’expression filiale de l’hébreu, tout en laissant signaler en note l’autre nuance possible.
- source_word: אֱלִישָׁמָע
  choice: Élishama
  rationale: Le nom propre est translittéré selon les conventions françaises usuelles.
- source_word: בֶּן עַמִּיהוּד
  choice: fils d’Ammihoud
  rationale: Cette construction patronymique hébraïque est rendue naturellement en français par « fils d’Ammihoud ».
