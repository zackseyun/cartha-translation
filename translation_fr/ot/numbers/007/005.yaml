review_pass:
  verdict: revise
  source_fidelity: La formulation « afin qu’ils servent » attribue une action aux objets offerts, alors que וְהָיוּ לַעֲבֹד exprime leur destination pour le service. « Pour le service » rend cette fonction sans personnifier les objets. « De leur part » peut signifier « en leur nom » plutôt que la provenance indiquée par מֵאִתָּם; « d’eux » conserve cette provenance.
  naturalness: « Prends-les d’eux » est direct et naturel dans ce contexte. « Pour le service de la tente de la Rencontre » est idiomatique en français moderne et évite l’expression peu naturelle « servir au service ».
  terminology: « Tente de la Rencontre » est une désignation française établie et fidèle à אֹהֶל מוֹעֵד. « Lévites » et « service » conviennent au registre et au vocabulaire du passage. La note conserve l’explication de l’idiome כְּפִי.
  issues:
  - severity: medium
    issue: Les objets sont présentés comme accomplissant eux-mêmes le service.
    rationale: « Afin qu’ils servent au service » traduit trop littéralement une construction de destination et produit une personnification maladroite; le contexte concerne des chariots et des bœufs destinés à être employés pour le service.
  - severity: low
    issue: « De leur part » est ambigu quant à la provenance.
    rationale: Cette expression peut indiquer une action faite au nom des donateurs, tandis que מֵאִתָּם signifie que Moïse doit prendre les objets auprès d’eux.
  revised_text: Prends-les d’eux, pour le service de la tente de la Rencontre ; tu les donneras aux Lévites, à chacun selon son service.[a]
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « chacun selon la bouche de son service », expression qui désigne ici une répartition conforme au service assigné à chacun.'
    reason: lexical_alternative
