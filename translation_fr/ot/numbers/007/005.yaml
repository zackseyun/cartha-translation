- from: Prends-les de leur part, afin qu’ils servent au service de la tente de la rencontre ; tu les donneras aux Lévites, à chacun selon son service.[a]
  to: Prends-les d’eux, pour le service de la tente de la Rencontre ; tu les donneras aux Lévites, à chacun selon son service.[a]
  rationale: La révision rend explicitement la destination cultuelle des objets sans leur attribuer l’action de servir, et elle clarifie leur provenance. Elle maintient la construction distributive finale et l’ambiguïté du singulier hébreu, sans préciser la répartition au-delà du texte.
  reviewer_model: gpt-5.6-terra
