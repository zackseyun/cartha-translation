source:
  edition: WLC
  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: fr
  text: Prends-les d’eux, pour le service de la tente de la Rencontre ; tu les donneras aux Lévites, à chacun selon son service.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun selon la bouche de son service », expression qui désigne ici une répartition conforme au service assigné à chacun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: Prends-les de leur part
  rationale: L’impératif קַח commande directement à Moïse de prendre ou recevoir les offrandes ; מֵאִתָּם indique qu’elles proviennent des chefs. « De leur part » est naturel en français et évite la répétition maladroite « prends-les d’eux ».
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: afin qu’ils servent au service de
  rationale: La construction indique la destination des objets en vue du service. Cette formulation garde le lien verbal entre עבד et עֲבֹדָה ainsi qu’une légère solennité, tout en restant intelligible pour des objets destinés à cet usage.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette désignation rend les deux éléments du syntagme hébreu et exprime le lieu fixé de la rencontre, sans introduire un terme ecclésiastique étranger au texte.
- source_word: וְנָתַתָּה אֹתָם אֶל הַלְוִיִּם
  choice: tu les donneras aux Lévites
  rationale: Le futur français traduit naturellement la forme verbale hébraïque à valeur prescriptive après l’impératif, tandis que « donner » conserve le sens ordinaire de נתן.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: à chacun selon son service
  rationale: אִישׁ a ici une fonction distributive. כְּפִי signifie littéralement « selon la bouche de », idiome exprimant ici une répartition conforme au service assigné à chacun.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve la répétition intentionnelle de la racine « servir/service » et la valeur distributive de la dernière proposition, sans préciser au-delà de l’hébreu la quantité attribuée à chaque Lévite.
