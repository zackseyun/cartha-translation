  text: un taureau pris dans le gros bétail[a], un bélier, un agneau mâle d’un an, pour l’holocauste ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un jeune taureau, un bélier, un agneau mâle dans sa première année, pour l’holocauste ». L’expression hébraïque littéralement « fils du gros bétail » désigne un bovin du troupeau, et « fils de son année » un animal dans sa première année.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: un taureau du gros bétail
  rationale: פַּר désigne couramment un taureau dans les textes sacrificiels, tandis que בֶּן־בָּקָר précise qu’il appartient au gros bétail. Cette formulation naturelle garde cette précision sans reproduire littéralement l’idiome hébreu « fils du gros bétail ».
- source_word: אַיִל
  choice: un bélier
  rationale: Terme usuel et précis pour un mouton mâle adulte, notamment dans un contexte sacrificiel.
- source_word: כֶּבֶשׂ
  choice: un agneau mâle
  rationale: Dans cette liste sacrificielle, le terme désigne un agneau et implique vraisemblablement un animal mâle ; la précision est rendue explicitement en français.
- source_word: בֶּן־שְׁנָתוֹ
  choice: d’un an
  rationale: L’idiome hébreu signifie que l’animal est dans sa première année ou âgé d’un an. « D’un an » est la formulation française la plus concise et naturelle dans une liste d’offrandes.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: עֹלָה désigne l’offrande entièrement consumée. « Holocauste » est le terme biblique français établi, et « pour » rend naturellement la préposition לְ.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral est répété devant chaque animal afin d’en indiquer le nombre ; cette structure est conservée en français.
