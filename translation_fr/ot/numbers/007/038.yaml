lexical_decisions:
- source_word: כַּף
  choice: coupelle
  rationale: Dans le contexte des offrandes du sanctuaire, le terme désigne un petit récipient. « Coupelle » est naturel en français actuel et évite que le traditionnel « cuillère » soit compris comme un ustensile de table.
- source_word: אַחַת
  choice: une
  rationale: Le cardinal s’accorde avec le nom féminin « coupelle ».
- source_word: זָהָב
  choice: en or
  rationale: Cette tournure française indique naturellement la matière dont le récipient est fait.
- source_word: עֲשָׂרָה זָהָב
  choice: pesant dix sicles
  rationale: La formule hébraïque elliptique donne un nombre suivi de la matière; le contexte immédiat et les formules parallèles montrent qu’il s’agit du poids en sicles. « Pesant » explicite la relation sans suggérer que le récipient contenait dix pièces de monnaie.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: L’adjectif prédicatif s’accorde avec « coupelle » et décrit son contenu de manière concise.
- source_word: קְטֹרֶת
  choice: encens
  rationale: Équivalent français courant de la substance aromatique offerte dans le culte.
