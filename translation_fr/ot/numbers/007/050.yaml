  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un petit plat en or » ou « un petit récipient en or ». Les versions traditionnelles portent souvent « cuillère », mais le terme hébreu désigne plus largement un petit récipient cérémoniel.
