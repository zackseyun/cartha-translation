lexical_decisions:
- source_word: כַּף
  choice: coupe
  rationale: Dans les inventaires cultuels du sanctuaire, le terme désigne un petit récipient cérémoniel. « Coupe » est naturel en français et évite le sens trop étroit que pourrait suggérer « cuillère ».
- source_word: אַחַת
  choice: une
  rationale: Cardinal simple accordé avec le nom féminin כַּף.
- source_word: עֲשָׂרָה
  choice: pesant dix sicles
  rationale: Le nom de l’unité n’est pas répété dans ce membre de phrase, mais le contexte immédiat de la formule d’inventaire indique qu’il s’agit d’un poids exprimé en sicles. L’explicitation rend le sens idiomatique en français.
- source_word: זָהָב
  choice: en or
  rationale: Indique la matière dont le récipient est fait ; « en or » est la tournure française naturelle.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: Adjectif prédicatif décrivant le contenu du récipient, rendu directement et naturellement.
- source_word: קְטֹרֶת
  choice: encens
  rationale: Terme français courant pour la substance aromatique brûlée dans le culte.
