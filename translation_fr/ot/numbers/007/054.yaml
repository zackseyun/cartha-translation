  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: fr
  text: Le huitième jour, le chef des fils de Manassé[a] était Gamliel, fils de Pedatsour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « fils de Manassé » : désignation tribale qui renvoie aux descendants de Manassé, c’est-à-dire à sa tribu.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: La préposition בְּ avec « jour » et l’ordinal forme une indication temporelle. Cette tournure est naturelle en français et n’ajoute aucun élément absent du verset.
- source_word: נָשִׂיא
  choice: responsable
  rationale: Dans ce contexte, le terme désigne le chef reconnu d’un groupe tribal. « Responsable » est clair et actuel, sans la connotation royale que pourrait avoir « prince ».
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: des fils de Manassé
  rationale: Cette formulation conserve l’expression familiale et tribale de l’hébreu בְּנֵי. La note précise qu’il s’agit des descendants, c’est-à-dire du groupe tribal issu de Manassé.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: גַּמְלִיאֵל
  choice: Gamliel
  rationale: Translittération française courante, proche de la forme hébraïque.
- source_word: בֶּן
  choice: fils de
  rationale: Équivalent direct et conventionnel de la construction patronymique hébraïque.
- source_word: פְּדָה צוּר
  choice: Pedahtsour
  rationale: Translittération française du nom propre composé, présentée comme un seul nom.
