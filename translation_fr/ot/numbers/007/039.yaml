  language: fr
  text: un taureau du gros bétail, un bélier, un agneau mâle d’un an, pour l’holocauste ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: un taureau du gros bétail
  rationale: פַּר désigne un taureau, notamment dans les listes sacrificielles. L’expression idiomatique בֶּן בָּקָר précise qu’il appartient au gros bétail ; la tournure française reste naturelle sans reproduire littéralement « fils du gros bétail ».
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: אַיִל est le terme courant pour un mouton mâle adulte, ici destiné au sacrifice.
- source_word: כֶּבֶשׂ אֶחָד
  choice: un agneau mâle
  rationale: כֶּבֶשׂ désigne un agneau et, dans ce contexte sacrificiel, un mâle. L’explicitation évite que le français générique « agneau » laisse le sexe indéterminé.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: Cette expression hébraïque indique idiomatiquement un animal âgé d’un an, ou dans sa première année ; « d’un an » est la formulation française la plus concise et naturelle.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: עֹלָה est l’offrande entièrement brûlée. « Holocauste » est le terme biblique français établi pour ce sacrifice, et « pour » rend le préfixe לְ dans cette liste.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La répétition de אֶחָד est naturellement portée par l’article numéral « un » devant chaque animal. « Gros bétail » distingue clairement les bovins du petit bétail dans le vocabulaire pastoral et sacrificiel.
