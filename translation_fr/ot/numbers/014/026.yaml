source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative introduit une nouvelle prise de parole divine; « parla » en est l’équivalent français naturel et soutenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: La préposition אֶל désigne les destinataires de la parole. En français, sa répétition devant le second nom n’est pas nécessaire pour rendre clairement la coordination hébraïque.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule introduit les paroles qui suivent. « En ces termes : » rend naturellement sa fonction en français et prépare la citation du verset suivant.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte le tétragramme, nom divin personnel. « Yahweh » le représente directement, tandis que « le Seigneur » reflète la substitution traditionnelle à la lecture.
translation_notes:
  register: Français international moderne, digne et fluide. La formule « en ces termes » évite le calque peu naturel « disant » tout en conservant la fonction introductive de לֵאמֹר.
source_grounding:
  english_pob_role: consult_only
