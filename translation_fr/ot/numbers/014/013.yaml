reference: Numbers 14:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: fr
  text: 'Mais Moïse dit à Yahweh : « Alors les Égyptiens l’apprendront[a], car c’est par ta puissance que tu as fait monter ce peuple du milieu d’eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et les Égyptiens l’ont appris, car c’est par ta puissance que tu as fait monter ce peuple du milieu d’eux. » La forme verbale hébraïque peut se comprendre comme un passé ou comme un résultat à venir dans l’intercession de Moïse ; le texte principal retient le sens prospectif, qui s’accorde bien avec la suite de son argument.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Moïse dit
  rationale: Le waw consécutif fait avancer le récit. « Mais » rend naturellement le contraste entre l’annonce du jugement par Yahweh et l’intercession de Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְשָׁמְעוּ מִצְרַיִם
  choice: Alors les Égyptiens l’apprendront
  rationale: 'Dans le contexte de l’intercession, le qatal peut exprimer le résultat à venir de la destruction envisagée : les Égyptiens en auront connaissance. « L’apprendront » rend idiomatiquement le verbe « entendre » en français, tandis que « alors » explicite sobrement le lien consécutif.'
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication qui fonde l’argument de Moïse.
- source_word: הֶעֱלִיתָ
  choice: tu as fait monter
  rationale: Cette formulation conserve le sens causatif du hifil de עלה et l’image hébraïque de la montée hors d’Égypte.
- source_word: בְכֹחֲךָ
  choice: par ta puissance
  rationale: 'La préposition ב marque ici le moyen : la délivrance a été accomplie par la puissance de Yahweh.'
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier collectif עם et le démonstratif sont rendus directement et naturellement.
- source_word: מִקִּרְבּוֹ
  choice: du milieu d’eux
  rationale: Le suffixe singulier renvoie collectivement à l’Égypte. La formulation française fait comprendre qu’Israël a été tiré du milieu des Égyptiens tout en gardant l’expression spatiale de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » en préserve la fonction de nom personnel sans lui substituer un titre.
- issue: Valeur temporelle de וְשָׁמְעוּ
  choice: 'lecture prospective : « les Égyptiens l’apprendront »'
  alternative: 'lecture accomplie : « les Égyptiens l’ont appris »'
  rationale: La suite de l’argument de Moïse favorise une conséquence à venir, mais la forme hébraïque permet aussi une lecture au passé ; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans devenir artificielle ; « l’apprendront » est plus idiomatique que « entendront » pour l’annonce d’une nouvelle, tandis que « fait monter » conserve l’image propre au verbe source.
