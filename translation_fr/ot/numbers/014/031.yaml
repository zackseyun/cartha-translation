source:
  edition: WLC
  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: fr
  text: Mais vos jeunes enfants, dont vous avez dit qu’ils deviendraient du butin[a], je les ferai entrer, et ils connaîtront[b] le pays que vous avez rejeté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deviendraient une proie » ou « deviendraient du butin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « feront l’expérience du pays ». Ici, le verbe hébreu traduit par « connaître » peut désigner une connaissance acquise par l’expérience.
    reason: lexical_alternative
  - marker: c
    text: Ou « que vous avez méprisé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: vos jeunes enfants
  rationale: טַף désigne ici les petits enfants vulnérables évoqués par leurs parents. « Jeunes enfants » évite l’ambiguïté de « petits-enfants », qui signifie normalement « descendants de la deuxième génération » en français.
- source_word: לָבַז
  choice: deviendraient du butin
  rationale: בַּז désigne ce qu’un ennemi emporte comme butin. Cette formulation convient au contexte militaire et reste naturelle en français.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: je les y amènerai
  rationale: La forme causative de בוא exprime le fait de faire venir ou entrer. Le pronom « y » reprend la destination connue par le contexte sans ajouter « Canaan » ni « terre promise ».
- source_word: וְיָדְעוּ
  choice: ils connaîtront
  rationale: Le sens premier est « connaître », avec ici une possible nuance d’expérience concrète ou de prise de possession, conservée en note.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire promis. « Le pays » est idiomatique en français et n’ajoute aucune précision absente de l’hébreu.
- source_word: מְאַסְתֶּם בָּהּ
  choice: que vous avez rejeté
  rationale: מָאַס peut exprimer le rejet, le mépris ou le refus. « Rejeté » rend clairement le refus du pays sans accentuer indûment l’idée de mépris.
theological_decisions:
- issue: Faut-il préciser que le pays est la Terre promise ou Canaan ?
  choice: Conserver simplement « le pays ».
  alternative: « la Terre promise » ou « le pays de Canaan »
  rationale: L’hébreu dit seulement « le pays ». Le contexte en précise le référent ; l’expliciter dans le texte introduirait une information interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. La dislocation « moi, je » rend l’emphase du pronom verbal divin et marque le contraste avec ce que les parents avaient affirmé. « Jeunes enfants » est retenu pour éviter le contresens courant de « petits-enfants ».
