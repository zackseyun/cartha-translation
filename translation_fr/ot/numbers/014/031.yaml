    rationale: Le pronom adverbial anticipe un référent introduit ensuite, tandis que le hiphil de בוא signifie ici faire entrer. « Je les ferai entrer » conserve l’ellipse de destination présente dans l’hébreu et rend mieux le verbe.
  - severity: medium
