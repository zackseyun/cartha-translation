source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: fr
  text: Pardonne, je t’en prie, la faute de ce peuple, selon la grandeur de ton amour fidèle, comme tu as supporté ce peuple depuis l’Égypte jusqu’ici[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme tu as pardonné à ce peuple depuis l’Égypte jusqu’ici ». Le verbe hébreu signifie « porter » ou « supporter » et peut, dans certains contextes, signifier « pardonner ».
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: Pardonne, je t’en prie
  rationale: L’impératif סלח accompagné de נָא exprime une supplication pressante. Cette formulation française conserve à la fois la demande de pardon et son caractère implorant.
- source_word: לַעֲוֺן
  choice: la faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de la faute. Ici, « faute » exprime naturellement l’offense coupable que Moïse demande à Dieu de pardonner, sans limiter le terme au seul sentiment de culpabilité.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: עַם est un nom collectif singulier. « Ce peuple » en préserve la forme et la portée communautaire.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: à la mesure de ton immense amour fidèle
  rationale: גֹּדֶל indique la grandeur, tandis que חֶסֶד évoque un amour loyal, constant et miséricordieux. Cette tournure rend l’appel à la grandeur de cet amour dans un français naturel.
- source_word: וְכַאֲשֶׁר
  choice: comme
  rationale: 'La conjonction introduit le précédent sur lequel Moïse fonde sa demande : la manière dont Dieu a déjà agi envers le peuple.'
- source_word: נָשָׂאתָה
  choice: tu as porté
  rationale: נשא signifie fondamentalement « porter » ou « supporter » et peut, dans certains contextes liés au péché, prendre le sens de « pardonner ». Comme son complément direct est ici le peuple, « porté » conserve l’image et l’ambiguïté du texte hébreu.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: depuis l’Égypte jusqu’ici
  rationale: La formule peut avoir une portée à la fois temporelle et spatiale. « Jusqu’ici » conserve cette double possibilité mieux que « jusqu’à présent ».
theological_decisions:
- issue: Sens de נָשָׂאתָה dans l’appel de Moïse
  choice: L’action antérieure de Dieu est décrite par l’image de porter le peuple, ce qui peut inclure patience, soutien et pardon.
  alternative: « Comme tu as pardonné à ce peuple depuis l’Égypte jusqu’ici. »
  rationale: Le complément du verbe est le peuple lui-même, et non sa faute. Garder « porté » préserve donc l’image hébraïque et sa tension théologique, tandis qu’une note signale le sens contextuel possible de pardon.
translation_notes:
  register: Français international moderne, digne et accessible. « Je t’en prie » marque la supplication sans archaïsme; « amour fidèle » conserve la dimension de loyauté de חֶסֶד; « porté » maintient volontairement la métaphore et l’ambiguïté de נשא.
