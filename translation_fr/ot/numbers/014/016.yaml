revisions:
- from: Parce que Yahweh était incapable de faire entrer ce peuple dans le pays qu’il avait juré de leur donner[a], il les a égorgés dans le désert.
  to: Parce que Yahweh n’a pas été en mesure[a] de faire entrer ce peuple dans le pays qu’il leur avait juré de donner, il les a égorgés dans le désert.
  rationale: 'La correction limite l’idée d’incapacité à l’action en cause, améliore l’idiomaticité de l’alternative en note et replace son ancre sur la construction hébraïque concernée. Elle conserve l’ambiguïté rhétorique : le verset rapporte l’explication que les nations seraient susceptibles de donner, sans résoudre théologiquement cette accusation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:49:01Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens causal de מִבִּלְתִּי יְכֹלֶת est bien rendu, de même que « faire entrer », le singulier collectif « ce peuple », la violence de וַיִּשְׁחָטֵם et le cadre du désert. Toutefois, « était incapable » décrit plus volontiers une incapacité constitutive ; « n’a pas été en mesure de » situe l’allégation dans l’événement envisagé et rend plus exactement la portée rhétorique du contexte.
  naturalness: La révision propose un français international moderne et idiome. Le déplacement de l’appel de note au groupe causal garantit que la note alternative est ancrée sur l’expression qu’elle concerne. « En raison de l’incapacité de Yahweh à... » est une alternative nominale naturelle, contrairement à « Faute pour Yahweh de pouvoir... », qui est lourde et peu usuelle.
  terminology: « Yahweh », « pays », « faire entrer », « égorgés » et « désert » sont cohérents avec le texte hébreu et le registre de la traduction. « De leur donner » explicite sobrement l’objet implicite du serment, le pays, sans modifier le sens.
  issues:
  - severity: medium
    issue: « était incapable » peut suggérer une incapacité permanente ou inhérente.
    rationale: Le substantif יְכֹלֶת porte ici sur la capacité alléguée de faire entrer le peuple dans le pays. Une formulation événementielle française préserve mieux l’accusation rapportée sans lui attribuer une portée ontologique accrue.
  - severity: low
    issue: L’appel de note est placé après « donner », alors que la note traite de la construction causale initiale.
    rationale: L’ancre doit suivre « n’a pas été en mesure » afin d’indiquer clairement le segment textuel concerné par l’alternative.
  - severity: low
    issue: La formulation actuelle de la note est peu naturelle en français moderne.
    rationale: « Faute pour Yahweh de pouvoir » est grammaticalement possible, mais nettement moins idiomatique que « En raison de l’incapacité de Yahweh à ».
  revised_text: Parce que Yahweh n’a pas été en mesure[a] de faire entrer ce peuple dans le pays qu’il leur avait juré de donner, il les a égorgés dans le désert.
  revised_footnotes:
  - marker: a
    text: 'Ou : « En raison de l’incapacité de Yahweh à faire entrer ce peuple dans le pays qu’il leur avait juré de donner. »'
    reason: La construction מִבִּלְתִּי יְכֹלֶת peut aussi être rendue par une tournure nominale qui exprime le manque de capacité allégué.
  revision_rationale: 'La correction limite l’idée d’incapacité à l’action en cause, améliore l’idiomaticité de l’alternative en note et replace son ancre sur la construction hébraïque concernée. Elle conserve l’ambiguïté rhétorique : le verset rapporte l’explication que les nations seraient susceptibles de donner, sans résoudre théologiquement cette accusation.'
