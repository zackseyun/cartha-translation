source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: fr
  text: Parce que Yahweh n’a pas été en mesure[a] de faire entrer ce peuple dans le pays qu’il leur avait juré de donner, il les a égorgés dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En raison de l’incapacité de Yahweh à faire entrer ce peuple dans le pays qu’il leur avait juré de donner. »'
    reason: La construction מִבִּלְתִּי יְכֹלֶת peut aussi être rendue par une tournure nominale qui exprime le manque de capacité allégué.
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: Parce que Yahweh était incapable
  rationale: 'La construction exprime ici la raison que les nations avanceraient : une prétendue incapacité de Yahweh. Cette formulation française est naturelle et conserve toute la force de l’accusation.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לְהָבִיא
  choice: faire entrer
  rationale: Le hifil de בוא signifie causer l’entrée. « Faire entrer » exprime précisément le mouvement vers l’intérieur du pays.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Cette formulation conserve le singulier collectif et la valeur démonstrative de l’hébreu.
- source_word: אֶל הָאָרֶץ
  choice: dans le pays
  rationale: Avec « faire entrer », la préposition « dans » indique naturellement l’entrée dans le pays promis.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: qu’il avait juré de leur donner
  rationale: L’objet du serment est implicite en hébreu. En français, « juré de leur donner » explicite sobrement la teneur évidente de la promesse et évite l’expression incomplète « le pays qu’il leur avait juré ».
- source_word: וַיִּשְׁחָטֵם
  choice: il les a égorgés
  rationale: שׁחט désigne une mise à mort par égorgement ou abattage. « Égorgés » préserve la violence délibérée de l’accusation, sans l’atténuer en simple « tués ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme français courant pour le מִדְבָּר où Israël séjourne, même s’il ne désigne pas nécessairement un désert de sable.
theological_decisions:
- issue: L’accusation des nations concernant la capacité de Yahweh
  choice: Parce que Yahweh était incapable de faire entrer ce peuple…
  alternative: Faute pour Yahweh de pouvoir faire entrer ce peuple…
  rationale: Le verset rapporte ce que les nations diraient dans le contexte immédiat; il ne formule pas directement une affirmation du narrateur sur une limitation réelle de Dieu. La traduction maintient néanmoins l’accusation sans l’adoucir.
translation_notes:
  register: Français international moderne, clair et digne. « Était incapable » conserve la tension rhétorique du propos attribué aux nations; « égorgés » maintient la vigueur inhabituelle du verbe hébreu.
