  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: fr
  text: Alors toute la communauté éleva la voix et poussa de grands cris[a], et le peuple pleura cette nuit-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « éleva [la voix]… et ils donnèrent leur voix », expression qui désigne une forte clameur collective.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: éleva
  rationale: Le verbe נָשָׂא signifie littéralement « lever, porter ». « Éleva » conserve l’image de l’expression hébraïque tout en restant naturel avec « la voix ».
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici la communauté d’Israël réunie. « Toute la communauté » est clair en français moderne et rend כָּל.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: poussa de grands cris
  rationale: Littéralement « ils donnèrent leur voix » ; l’expression décrit une clameur collective. La coordination avec « éleva la voix » reproduit les deux verbes hébreux sans calque obscur.
- source_word: הָעָם
  choice: le peuple
  rationale: Rend directement עָם et préserve la variation du texte hébreu après « la communauté ».
- source_word: וַיִּבְכּוּ
  choice: pleura
  rationale: בכה signifie « pleurer ». Ce choix distingue les pleurs de la clameur exprimée dans la proposition précédente.
- source_word: בַּלַּיְלָה הַהוּא
  choice: cette nuit-là
  rationale: Équivalent français idiomatique et précis de l’expression temporelle « durant cette nuit-là ».
