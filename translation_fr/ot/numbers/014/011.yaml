source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Jusqu’à quand ce peuple me méprisera-t-il[a] ? Jusqu’à quand ne croiront-ils pas en moi[b], malgré tous les signes que j’ai accomplis parmi eux[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « me traitera-t-il avec mépris ? »
    reason: lexical_alternative
  - marker: b
    text: Ou « ne me feront-ils pas confiance ? »
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « en son sein » : le pronom singulier renvoie à « ce peuple », considéré comme un ensemble.'
    reason: source_form
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé dans le texte hébreu au lieu de lui substituer un titre.
- source_word: עַד אָ֥נָה / וְעַד אָ֨נָה
  choice: Jusqu’à quand
  rationale: Équivalent français naturel de l’interrogation temporelle répétée, dont il conserve l’insistance rhétorique.
- source_word: יְנַאֲצֻנִי
  choice: me méprisera-t-il
  rationale: Le verbe נאץ exprime un mépris qui va jusqu’au rejet. « Mépriser » en restitue avec concision la force relationnelle.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Conserve le singulier collectif et la tonalité de mise à distance de l’hébreu.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: ne croira-t-il pas en moi
  rationale: Le hiphil de אמן construit avec ב peut exprimer le fait de croire en quelqu’un ou de lui faire confiance. Le texte principal retient la correspondance directe, tandis que l’autre nuance est signalée en note.
- source_word: בְּכֹל הָאֹתוֹת
  choice: malgré tous les signes
  rationale: 'Dans ce reproche, la préposition ב introduit naturellement une valeur concessive : l’incrédulité persiste en dépit des signes.'
- source_word: הָאֹתוֹת
  choice: les signes
  rationale: « Signes » rend אוֹת sans ajouter explicitement l’adjectif « miraculeux », même si le contexte implique des actes extraordinaires.
- source_word: עָשִׂיתִי
  choice: j’ai accomplis
  rationale: Le passé composé relie les actes antérieurs de Yahweh au reproche présent; « accomplir des signes » convient au registre biblique sans être archaïque.
- source_word: בְּקִרְבּוֹ
  choice: parmi eux
  rationale: Formulation française naturelle; le suffixe hébreu singulier renvoie grammaticalement au collectif « ce peuple », particularité conservée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Portée de לֹא יַאֲמִינוּ בִי
  choice: ne croira-t-il pas en moi
  alternative: ne me fera-t-il pas confiance
  rationale: L’hébreu associe ici croyance et confiance. Le texte principal garde le langage de la foi sans effacer la nuance de confiance, donnée en note.
- issue: Valeur de ב dans בְּכֹל הָאֹתוֹת
  choice: malgré tous les signes
  alternative: avec tous les signes
  rationale: La lecture concessive correspond au contexte du reproche, tout en reconnaissant que la préposition hébraïque est plus générale.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de « Jusqu’à quand » reproduit la vigueur du reproche divin. Le singulier collectif « ce peuple » est maintenu, tandis que « parmi eux » évite une tournure française pesante; la forme littérale est indiquée en note.
