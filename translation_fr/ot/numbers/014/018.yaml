- from: Yahweh est lent à la colère et riche en amour fidèle[a] ; il pardonne la faute et la révolte[b], mais il ne laisse certainement pas impuni[c] ; il fait retomber la faute des pères sur les enfants jusqu’à la troisième et à la quatrième génération[d].
  to: Yahweh est lent à la colère et riche en amour fidèle[a] ; il pardonne la faute et la révolte[b], mais il ne laisse certainement pas le coupable impuni[c] ; il fait retomber la faute des pères sur les enfants jusqu’à la troisième et à la quatrième génération[d].
  rationale: La seule révision est l’explicitation de « le coupable » dans la clause judiciaire et l’harmonisation de sa note. L’hébreu ne formule pas ce complément, mais la construction exige en français un référent naturel ; le contexte immédiat de faute et de révolte le fournit. Cette explicitation ne résout pas la tension du texte entre pardon et jugement, ni ne précise le mécanisme de la portée intergénérationnelle.
