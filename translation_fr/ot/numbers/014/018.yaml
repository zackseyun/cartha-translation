source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: fr
  text: Yahweh est lent à la colère et riche en amour fidèle[a] ; il pardonne la faute et la révolte[b], mais il ne laisse certainement pas le coupable impuni[c] ; il fait retomber la faute des pères sur les enfants jusqu’à la troisième et à la quatrième génération[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grand en fidélité », « riche en bonté » ou « débordant d’amour loyal ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu traduit par « pardonne » signifie littéralement « porte » ou « emporte » la faute et la révolte.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « il n’acquitte certainement pas le coupable » ; littéralement : « acquitter, il n’acquitte pas ».'
    reason: lexical_alternative
  - marker: d
    text: L’hébreu dit littéralement « sur les troisièmes et sur les quatrièmes » ; il s’agit des générations.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: Équivalent idiomatique naturel de l’expression hébraïque qui évoque une colère tardive.
- source_word: רַב חֶסֶד
  choice: riche en amour fidèle
  rationale: Rend à la fois l’abondance exprimée par רַב et la fidélité relationnelle, la bonté et la loyauté que recouvre חֶסֶד.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: il pardonne la faute et la révolte
  rationale: Dans cette formule sur la miséricorde divine, נֹשֵׂא a le sens de porter ou d’enlever la faute, donc de pardonner. « Faute » et « révolte » maintiennent la distinction entre עָוֺן et פָשַׁע.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: mais il ne laisse certainement pas impuni
  rationale: L’infinitif absolu avec le verbe conjugué renforce la négation. Cette formulation française conserve la portée judiciaire sans ajouter explicitement « le coupable », absent de l’hébreu.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: il fait retomber la faute des pères sur les enfants
  rationale: Rend ici פקד comme l’intervention par laquelle Dieu fait porter les conséquences judiciaires de la faute, sans réduire le propos à de simples conséquences naturelles.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: jusqu’à la troisième et à la quatrième génération
  rationale: Le mot « génération » est sous-entendu en hébreu et doit être explicité en français ; la répétition de « à » reflète les deux prépositions.
theological_decisions:
- issue: Justice divine et faute à travers les générations
  choice: Maintenir la tension entre le pardon de Dieu, son refus de laisser impuni et la faute des pères qui retombe sur les enfants.
  alternative: Interpréter la formule uniquement comme des conséquences naturelles, ou l’atténuer au regard des textes sur la responsabilité individuelle.
  rationale: Le texte hébreu juxtapose lui-même miséricorde et jugement. La traduction ne résout pas cette tension théologique et n’en précise pas le mécanisme.
- issue: Objet implicite dans וְנַקֵּה לֹא יְנַקֶּה
  choice: Ne pas ajouter « le coupable » dans le texte principal.
  alternative: « mais il n’acquitte certainement pas le coupable »
  rationale: L’objet est implicite. « Ne laisse certainement pas impuni » donne un français complet tout en évitant de rendre explicite ce que l’hébreu laisse sous-entendu.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en trois propositions met en relief la miséricorde, le jugement, puis sa portée intergénérationnelle. « Révolte » restitue la dimension de rupture portée par פָשַׁע ; « faute » reste naturel tout en conservant le poids moral de עָוֺן.
