  source_fidelity: 'Le sens général est fidèlement rendu : la lenteur à la colère, l’abondance du חֶסֶד, le pardon de la faute et de la révolte, la négation emphatique de l’acquittement, et la formule de répercussion sur les générations sont conservés. Toutefois, « ne laisse certainement pas impuni » laisse en français un complément implicite trop indéterminé et tend à faire porter l’impunité sur l’acte plutôt que sur la personne concernée par l’acquittement. Le contexte et la construction hébraïque permettent de rendre explicite « le coupable », comme le fait l’audit anglais, sans modifier le sens.'
