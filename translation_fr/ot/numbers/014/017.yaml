  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: fr
  text: 'Et maintenant, je t’en prie, que la puissance du Seigneur soit grande[a], comme tu l’as dit, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soit magnifiée ».'
    reason: Variante lexicale possible pour יִגְדַּל, qui peut évoquer la manifestation ou la reconnaissance de la grandeur de la puissance divine.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la liaison exprimée par וְ et la valeur temporelle et discursive de עַתָּה, qui introduit l’appel de Moïse.
- source_word: יִגְדַּל
  choice: que … soit grande
  rationale: Le jussif exprime ici une demande. Cette formulation reste proche du sens premier de גדל tout en étant claire en français; la possibilité « soit magnifiée » est signalée en note.
- source_word: נָא
  choice: je t’en prie
  rationale: Rend la nuance de supplication avec un registre naturel et digne, mieux adapté à une prière que le plus courant « s’il te plaît ».
- source_word: כֹּחַ
  choice: puissance
  rationale: Le terme désigne la force ou la capacité d’agir; « puissance » convient au contexte de l’action divine, dans le jugement comme dans la miséricorde.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rend le titre divin אֲדֹנָי sans le confondre avec le nom divin YHWH.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Exprime la correspondance entre la demande de Moïse et la déclaration antérieure de Dieu sans alourdir la phrase.
- source_word: דִּבַּרְתָּ
  choice: tu l’as déclaré
  rationale: Le passé composé souligne la pertinence actuelle de la parole antérieure de Dieu; « déclaré » prépare naturellement la citation solennelle qui suit.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Conserve explicitement la formule hébraïque qui introduit le contenu de la parole divine au verset suivant.
theological_decisions:
- issue: Sens de la demande concernant la puissance du Seigneur
  choice: que la puissance du Seigneur soit grande
  alternative: que la puissance du Seigneur soit magnifiée
  rationale: Le texte peut demander que la puissance divine se manifeste comme grande ou qu’elle soit reconnue comme telle. Le texte principal garde la formulation la plus proche de l’hébreu, tandis que la note préserve l’autre nuance sans trancher la tension.
- issue: Rendu du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: Seigneur
  rationale: L’hébreu emploie ici le titre אֲדֹנָי et non le tétragramme. « Le Seigneur » est naturel en français et n’importe pas la convention typographique réservée au nom YHWH.
translation_notes:
  register: Français international moderne, digne et adapté à une prière. « Je t’en prie » conserve la supplication sans archaïsme; « en disant » maintient le lien formel avec la citation du verset suivant.
