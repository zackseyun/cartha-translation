  variant: modern international French
source:
  edition: WLC
  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: fr
  text: Quant à vous, vos cadavres[a] tomberont dans ce désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos dépouilles mortelles ».
    reason: Variante lexicale possible pour פֶּגֶר; elle exprime le même référent avec une tonalité moins abrupte.
lexical_decisions:
- source_word: וּפִגְרֵיכֶם
  choice: vos cadavres
  rationale: פֶּגֶר désigne le corps d’une personne morte. « Cadavres » rend directement et sobrement la dureté concrète du jugement annoncé; la conjonction est intégrée à la tournure contrastive « Quant à vous ».
- source_word: אַתֶּם
  choice: Quant à vous
  rationale: Le pronom indépendant, ajouté après le suffixe de deuxième personne, a une valeur emphatique et contrastive. « Quant à vous » restitue naturellement cette mise en relief en français.
- source_word: יִפְּלוּ
  choice: tomberont
  rationale: Le verbe נפל signifie ici tomber en mourant. « Tomberont » conserve l’image simple de l’hébreu, tandis que « cadavres » explicite déjà l’issue mortelle.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: dans ce désert
  rationale: מִדְבָּר désigne ici la région désertique où se trouve Israël. « Dans ce désert » est idiomatique en français moderne et conserve la référence précise du démonstratif.
theological_decisions:
- issue: Force concrète du jugement exprimé par פִגְרֵיכֶם
  choice: vos cadavres
  alternative: vos dépouilles mortelles
  rationale: Le verset annonce sans détour la mort de la génération incrédule dans le désert. « Vos cadavres » préserve cette sévérité physique sans l’atténuer ni l’amplifier par une formulation interprétative.
translation_notes:
  register: Français international moderne, direct et solennel. La phrase conserve l’emphase contrastive du pronom hébreu et l’image concrète du jugement.
