review_pass:
  verdict: revise
  source_fidelity: 'La structure principale est bien rendue : les habitants ont déjà eu connaissance de la présence de Yahweh au milieu du peuple, de la nuée au-dessus d’eux et de la conduite par la colonne de nuée et de feu. Toutefois, « tu apparais face à face » transforme la forme niphal passive נִרְאָה (« tu es vu ») en une formulation active et lisse excessivement l’image « œil à œil ».'
  naturalness: Le français est globalement clair et de registre approprié. La phrase révisée conserve la relative française plus étroitement liée à « les habitants » et emploie « tu es vu face à face », formulation recevable dans un registre biblique moderne, tout en documentant l’étrangeté de l’hébreu en note.
  terminology: « Yahweh », « nuée », « colonne de nuée » et « colonne de feu » sont cohérents, naturels dans ce registre et fidèles aux termes du passage. La note doit présenter « tu apparais face à face » comme une possibilité de rendu plutôt que comme le texte principal, afin de préserver la voix passive et l’ambiguïté de l’original.
  issues:
  - severity: medium
    issue: La proposition « tu apparais face à face » ne conserve pas la voix passive de נִרְאָה.
    rationale: Le niphal signifie littéralement « tu es vu ». Le rendre par « tu apparais » déplace l’énoncé vers l’acte de se manifester et résout plus qu’il ne faut la construction inhabituelle.
  - severity: low
    issue: La note traduit littéralement עַיִן בְּעַיִן par « œil contre œil ».
    rationale: « Contre » suggère une opposition absente du texte. « Œil à œil » est plus proche, tout en restant signalé comme un littéralisme inhabituel.
  revised_text: Et ils le diront aux habitants de ce pays, qui ont appris que toi, Yahweh, tu es au milieu de ce peuple, que toi, Yahweh, tu es vu face à face[a], que ta nuée se tient au-dessus d’eux et que tu marches devant eux, le jour dans une colonne de nuée et la nuit dans une colonne de feu.
  revised_footnotes:
  - marker: a
    text: 'Ou : « tu apparais face à face ». Littéralement : « œil à œil, tu es vu » ; l’hébreu emploie une image inhabituelle et une forme passive.'
    reason: Préserve l’image « œil à œil » et la voix passive de l’hébreu, tout en donnant une alternative française plus idiomatique.
  revision_rationale: La révision corrige de façon limitée le traitement de עַיִן בְּעַיִן נִרְאָה. Elle maintient la formulation française naturelle « face à face », mais rétablit dans le texte la voix passive attestée par l’hébreu et évite de présenter une interprétation active comme seule traduction. Les autres choix du projet sont conservés.
