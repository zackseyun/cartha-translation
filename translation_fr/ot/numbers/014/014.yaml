revisions:
- from: Et ils le diront aux habitants de ce pays. Ceux-ci ont appris que toi, Yahweh, tu es au milieu de ce peuple, que toi, Yahweh, tu apparais face à face[a], que ta nuée se tient au-dessus d’eux et que tu marches devant eux, le jour dans une colonne de nuée et la nuit dans une colonne de feu.
  to: Et ils le diront aux habitants de ce pays, qui ont appris que toi, Yahweh, tu es au milieu de ce peuple, que toi, Yahweh, tu es vu face à face[a], que ta nuée se tient au-dessus d’eux et que tu marches devant eux, le jour dans une colonne de nuée et la nuit dans une colonne de feu.
  rationale: La révision corrige de façon limitée le traitement de עַיִן בְּעַיִן נִרְאָה. Elle maintient la formulation française naturelle « face à face », mais rétablit dans le texte la voix passive attestée par l’hébreu et évite de présenter une interprétation active comme seule traduction. Les autres choix du projet sont conservés.
  reviewer_model: gpt-5.6-terra
