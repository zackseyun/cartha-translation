source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: fr
  text: Et ils le diront aux habitants de ce pays, qui ont appris que toi, Yahweh, tu es au milieu de ce peuple, que toi, Yahweh, tu es vu face à face[a], que ta nuée se tient au-dessus d’eux et que tu marches devant eux, le jour dans une colonne de nuée et la nuit dans une colonne de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu apparais face à face ». Littéralement : « œil à œil, tu es vu » ; l’hébreu emploie une image inhabituelle et une forme passive.'
    reason: Préserve l’image « œil à œil » et la voix passive de l’hébreu, tout en donnant une alternative française plus idiomatique.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: les habitants de ce pays
  rationale: Le participe singulier a ici une valeur collective. « Les habitants » est naturel en français et désigne l’ensemble de la population résidente.
- source_word: שָׁמְעוּ
  choice: ont appris
  rationale: Le qatal exprime une information déjà parvenue aux habitants. « Ont appris » rend idiomatiquement le fait qu’ils en ont eu connaissance, sans imposer le sens auditif littéral de « ont entendu ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: Cette expression concrète et naturelle conserve l’idée de la présence de Yahweh parmi son peuple.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: tu apparais face à face
  rationale: Cette formulation française rend naturellement la manifestation directe évoquée par l’idiome hébreu, tandis que la note conserve son image littérale et l’ambiguïté de la forme passive.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: ta nuée se tient au-dessus d’eux
  rationale: « Se tient » préserve l’image concrète du verbe עמד sans réduire la nuée à une simple présence statique.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: tu marches devant eux
  rationale: Cette traduction reste proche du verbe הלך et de la position exprimée, sans expliciter davantage par « tu les conduis ».
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: dans une colonne de nuée ... dans une colonne de feu
  rationale: La préposition est comprise comme indiquant la forme visible dans laquelle Yahweh va devant le peuple; « dans » préserve cette lecture sans exclure entièrement une nuance instrumentale.
- source_word: יוֹמָם ... לָיְלָה
  choice: le jour ... la nuit
  rationale: Ce sont les équivalents adverbiaux les plus naturels en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; sa translittération préserve le nom propre sans lui substituer un titre.
- issue: Sens de עַיִן בְּעַיִן נִרְאָה
  choice: tu apparais face à face
  alternative: tu es vu œil contre œil
  rationale: Le texte principal emploie un idiome français intelligible, mais la note signale la formulation hébraïque inhabituelle et la valeur littéralement passive, afin de ne pas masquer l’ambiguïté de la manifestation décrite.
- issue: Référent du sujet implicite de שָׁמְעוּ
  choice: Ceux-ci ont appris
  alternative: ils ont appris
  rationale: Le sujet est compris comme les habitants du pays, antécédent le plus immédiat. « Ceux-ci » clarifie la syntaxe française sans ajouter de contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase hébraïque très longue est divisée après « ce pays » pour assurer la clarté, tout en maintenant l’enchaînement argumentatif. Les reprises de « toi, Yahweh » conservent l’insistance du texte source.
