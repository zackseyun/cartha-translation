language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: fr
  text: 'Ils se levèrent de bon matin et montèrent au sommet de la montagne. Ils dirent : « Nous voici ! Nous monterons vers le lieu dont Yahweh a parlé[a], car nous avons péché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le lieu que Yahweh a dit ». Le sens peut être : « le lieu que Yahweh a indiqué » ou « dont Yahweh a parlé ».'
    reason: La construction hébraïque est concise et son verbe signifie simplement « dire » ou « parler » ; la note préserve cette formulation et les nuances contextuelles possibles.
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Ils se levèrent de bon matin
  rationale: Le hifil de שׁכם exprime le fait de se lever tôt. « De bon matin » rend naturellement en français l’insistance temporelle de l’expression complète sans répétition lourde.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: montèrent au sommet de la montagne
  rationale: עלה signifie couramment « monter », et רֹאשׁ הָהָר désigne idiomatiquement le sommet de la montagne.
- source_word: לֵאמֹר
  choice: Ils dirent
  rationale: L’infinitif introduit le discours direct. Une nouvelle proposition avec « Ils dirent » est plus naturelle en français moderne que le participe « disant ».
- source_word: הִנֶּנּוּ
  choice: Nous voici !
  rationale: Cette formule de présentation à la première personne du pluriel est rendue directement et idiomatiquement, sans lui ajouter explicitement l’idée d’être prêts.
- source_word: וְעָלִינוּ
  choice: Nous monterons
  rationale: Dans ce contexte, la forme exprime l’action qu’ils ont désormais l’intention d’accomplir. Le futur français conserve cette valeur résolue sans en faire un ordre ou une exhortation.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר יְהוָה
  choice: vers le lieu dont Yahweh a parlé
  rationale: מָקוֹם est le terme ordinaire pour « lieu ». Le verbe אָמַר signifie simplement « dire/parler » ; « dont Yahweh a parlé » identifie naturellement en français le lieu mentionné, sans renforcer le verbe en « promis ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte hébreu.
- source_word: כִּי חָטָאנוּ
  choice: car nous avons péché
  rationale: כִּי introduit ici la raison invoquée, et חטא garde sa portée morale et théologique avec « pécher » plutôt qu’une formulation affaiblie comme « avoir tort ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. « Yahweh » en préserve le caractère de nom propre au lieu de lui substituer un titre.
- issue: Portée de חָטָאנוּ
  choice: nous avons péché
  alternative: nous avons eu tort
  rationale: La traduction retenue conserve l’aveu explicite de faute contenu dans le verbe hébreu et évite d’en atténuer la portée.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme excessif ; le discours direct reste vif et naturel.
