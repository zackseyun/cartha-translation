source:
  edition: WLC
  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: fr
  text: Mais, aussi vrai que je suis vivant, la gloire de Yahvé remplira toute la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le pays », si le mot hébreu אֶרֶץ est pris dans un sens plus local.
    reason: Alternative lexicale authentique entre « terre » et « pays ».
lexical_decisions:
- source_word: וְ/אוּלָם
  choice: Mais
  rationale: Marque un contraste appuyé avec ce qui précède, dans une formulation naturelle et sobre.
- source_word: חַי אָ֑נִי
  choice: aussi vrai que je suis vivant
  rationale: Rend en français actuel la formule solennelle de serment divin, plus clairement que le calque « je suis vivant ».
- source_word: וְ/יִמָּלֵ֥א
  choice: remplira
  rationale: Le niphal peut exprimer ici un résultat ou un état d'extension; avec « la gloire de Yahvé » comme sujet grammatical, « remplira » est naturel et fidèle.
- source_word: כְבוֹד
  choice: gloire
  rationale: Terme français consacré qui exprime ici la manifestation, la majesté et le renom divins.
- source_word: יְהוָ֖ה
  choice: Yahvé
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֶת כָּל הָ/אָֽרֶץ
  choice: toute la terre
  rationale: La portée universelle convient à l'ampleur de la déclaration, tout en signalant en note le sens local également possible de אֶרֶץ.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: portée universelle (« toute la terre »)
  alternative: portée locale (« tout le pays »)
  rationale: Le contexte solennel et l'affirmation concernant la gloire de Yahvé favorisent une portée universelle, mais le mot hébreu permet aussi un sens territorial; cette ambiguïté lexicale est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « aussi vrai que je suis vivant » conserve la solennité du serment sans archaïsme; « Yahvé » représente explicitement le tétragramme.
