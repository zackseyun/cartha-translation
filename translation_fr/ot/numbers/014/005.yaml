  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּפֹּ֥ל מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פְּנֵי/הֶ֑ם לִ/פְנֵ֕י כָּל קְהַ֥ל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: fr
  text: Alors Moïse et Aaron tombèrent face contre terre devant toute l’assemblée de la communauté des fils d’Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « l’assemblée de la communauté » réunit deux termes apparentés désignant le peuple rassemblé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: tombèrent
  rationale: Le singulier verbal hébreu précède un sujet composé, mais le français exige ici le pluriel. « Tombèrent » conserve le sens concret de נפל, tandis que « face contre terre » exprime la posture sans expliciter davantage son intention.
- source_word: עַל־פְּנֵיהֶם
  choice: face contre terre
  rationale: Équivalent français naturel de l’idiome hébreu décrivant une prosternation complète; il évite le calque peu idiomatique « sur leurs faces ».
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend directement la présence publique et spatiale indiquée par la préposition.
- source_word: כָּל
  choice: toute
  rationale: Avec le nom collectif féminin « assemblée », « toute » exprime naturellement la totalité.
- source_word: קְהַל
  choice: assemblée
  rationale: קָהָל désigne le groupe réuni; « assemblée » est courant, digne et précis.
- source_word: עֲדַת
  choice: communauté
  rationale: עֵדָה désigne ici le corps communautaire organisé. « Communauté » permet de conserver les deux termes collectifs hébreux sans répétition obscure en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: Rend formellement l’expression hébraïque et préserve sa formulation généalogique; une note signale les équivalents français collectifs possibles.
theological_decisions:
- issue: Conserver ou simplifier la double expression collective קְהַל עֲדַת
  choice: Conserver les deux termes par « l’assemblée de la communauté »
  alternative: « toute la communauté » ou « toute l’assemblée »
  rationale: L’hébreu juxtapose deux noms communautaires apparentés. Les maintenir respecte la solennité et la texture du texte sans leur attribuer artificiellement deux groupes distincts.
- issue: Rendre בְּנֵי יִשְׂרָאֵל de façon formelle ou collective
  choice: « les fils d’Israël »
  alternative: « les Israélites » ou « les enfants d’Israël »
  rationale: La formulation choisie conserve l’expression généalogique masculine du texte source sans exclure doctrinalement les autres membres du peuple; la note présente les formulations françaises plus collectives.
- issue: Préciser la signification spirituelle du geste
  choice: Décrire seulement qu’ils « tombèrent face contre terre »
  alternative: « se prosternèrent »
  rationale: Le contexte peut suggérer l’humilité, la détresse ou la supplication, mais le verset ne nomme pas explicitement la motivation. La traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, naturel et digne. « Face contre terre » rend idiomatiquement la posture; la structure plus formelle « assemblée de la communauté » est maintenue afin de refléter le redoublement lexical hébreu.
