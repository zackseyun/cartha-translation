revisions:
- from: Mais Josué, fils de Noun, et Caleb, fils de Yefounné, restèrent en vie parmi ces hommes qui étaient allés explorer le pays[a].
  to: Mais Josué, fils de Nun, et Caleb, fils de Jephunné, restèrent en vie d’entre ces hommes qui étaient allés explorer le pays[a].
  rationale: La révision rend explicitement la valeur de séparation et d’exception portée par מִן באמצעות « d’entre », tout en conservant le contraste narratif, le plus-que-parfait rétrospectif et l’ambiguïté lexicale de לתור. Les noms sont harmonisés avec l’usage biblique français établi.
  reviewer_model: gpt-5.6-terra
