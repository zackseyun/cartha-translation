  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/כָלֵ֖ב בֶּן יְפֻנֶּ֑ה חָיוּ֙ מִן הָ/אֲנָשִׁ֣ים הָ/הֵ֔ם הַֽ/הֹלְכִ֖ים לָ/ת֥וּר אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: fr
  text: Mais Josué, fils de Nun, et Caleb, fils de Jephunné, restèrent en vie d’entre ces hommes qui étaient allés explorer le pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaître le pays » ou « espionner le pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Mais Josué
  rationale: La conjonction marque ici le contraste avec la mort des autres explorateurs au verset précédent ; « Mais » le rend naturellement en français.
- source_word: בִּן נוּן
  choice: fils de Noun
  rationale: La construction filiale est conservée. « Noun » suit une translittération française courante du nom hébreu.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: et Caleb, fils de Yefounné
  rationale: La conjonction coordonne Caleb à Josué. La reprise de « fils de » est claire et naturelle ; « Yefounné » rend le nom hébreu dans une translittération adaptée au français.
- source_word: חָיוּ
  choice: restèrent en vie
  rationale: Le verbe signifie ici qu’ils demeurèrent vivants, par contraste avec les autres hommes qui moururent. Cette formulation reste proche de l’hébreu sans ajouter l’idée plus interprétative de « survivre ».
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: parmi ces hommes
  rationale: La préposition marque leur distinction au sein du groupe. « Parmi ces hommes » est idiomatique en français et indique qu’ils furent les exceptions.
- source_word: הַהֹלְכִים
  choice: qui étaient allés
  rationale: Le participe décrit rétrospectivement les hommes ayant pris part à la mission ; le plus-que-parfait convient à la chronologie narrative française.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: explorer le pays
  rationale: Dans ce contexte, תור désigne une mission de reconnaissance. « Explorer » demeure naturel et n’impose pas nécessairement la nuance d’espionnage clandestin ; les autres possibilités sont signalées en note.
