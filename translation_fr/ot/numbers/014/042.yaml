source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: fr
  text: Ne montez pas[a], car Yahweh n’est pas au milieu de vous, de peur que vous ne soyez battus devant vos ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne partez pas à l’assaut. »'
    reason: Le verbe signifie littéralement « monter », mais peut évoquer ici l’avancée militaire vers la région montagneuse.
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: Ne montez pas
  rationale: La particule אַל avec l’imparfait exprime une interdiction. Le verbe עלה signifie littéralement « monter » ; dans ce contexte militaire et géographique, il évoque aussi le fait de partir à l’assaut.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction de manière concise et naturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin exprimé dans le texte hébreu au lieu de lui substituer un titre.
- source_word: בְּקִרְבְּכֶם
  choice: au milieu de vous
  rationale: Rend directement l’expression spatiale et communautaire בקרבכם, qui désigne ici la présence de Yahweh au sein du peuple.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: sinon, vous serez battus
  rationale: Le niphal de נגף peut désigner le fait d’être frappé ou défait. Dans cet avertissement, la coordination négative exprime la conséquence à éviter ; « sinon » la rend clairement en français sans atténuer la portée militaire.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: devant vos ennemis
  rationale: Conserve l’expression hébraïque courante dans les récits de bataille, où une défaite se produit « devant » l’ennemi.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le Tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nature de la présence divine exprimée par בְּקִרְבְּכֶם
  choice: n’est pas au milieu de vous
  alternative: n’est pas avec vous
  rationale: « Au milieu de vous » maintient l’image de la présence au sein de la communauté sans préciser davantage la nature théologique de cette absence.
- issue: Valeur de וְלֹא dans l’avertissement
  choice: sinon, vous serez battus
  alternative: de peur que vous ne soyez battus
  rationale: Dans le contexte, la proposition annonce la défaite qui suivrait leur désobéissance. « Sinon » exprime naturellement cette conséquence, tandis que l’alternative conserve plus formellement la tournure négative hébraïque.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve « monter » et « devant vos ennemis », deux images du texte hébreu, tout en explicitant naturellement le rapport de conséquence par « sinon ».
