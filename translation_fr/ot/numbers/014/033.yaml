  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: fr
  text: Vos fils seront bergers dans le désert pendant quarante ans[a] et porteront vos infidélités[b], jusqu’à ce que vos cadavres aient disparu dans le désert.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu signifie littéralement « bergers » ; il peut aussi évoquer une vie pastorale et errante dans le désert.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu évoque littéralement la prostitution ou l’inconduite sexuelle ; cette image exprime ici l’infidélité envers Dieu.
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction : « jusqu’à la disparition de vos cadavres dans le désert ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: Vos fils
  rationale: Le pluriel masculin בנים désigne normalement les « fils » ; le contexte n’impose pas de l’élargir à « enfants ».
- source_word: רֹעִים
  choice: bergers
  rationale: Le participe vient de רעה, « faire paître, être berger ». « Bergers » conserve l’image concrète du texte hébreu, tandis que la nuance d’errance pastorale est signalée en note.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français biblique courant, « désert » désigne naturellement la région inculte où Israël séjourne, sans impliquer nécessairement une étendue uniquement sablonneuse.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: Expression française naturelle de la durée annoncée.
- source_word: וְנָשְׂאוּ
  choice: porteront le poids de
  rationale: נשא signifie littéralement « porter » et évoque ici le fait de subir les conséquences. L’ajout idiomatique « le poids de » rend ce sens clairement en français sans effacer l’image.
- source_word: אֶת זְנוּתֵיכֶם
  choice: vos infidélités
  rationale: זְנוּת emploie une image sexuelle pour parler ici de déloyauté envers Dieu. « Infidélités », au pluriel, convient à la fois au registre relationnel et à la répétition des actes, tandis qu’une note préserve la force sexuelle du terme hébreu.
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: jusqu’à ce que vos cadavres aient entièrement disparu
  rationale: תֹּם exprime l’achèvement complet et פגרים désigne des cadavres. Cette formulation française rend la disparition totale de la génération condamnée sans introduire un agent absent de l’hébreu.
theological_decisions:
- issue: 'Valeur de זְנוּתֵיכֶם : inconduite sexuelle littérale ou infidélité envers Dieu'
  choice: vos infidélités
  alternative: vos prostitutions / votre débauche
  rationale: Le contexte vise la rébellion d’Israël et sa déloyauté envers le Seigneur. « Infidélités » évite une lecture limitée à des actes sexuels, tout en laissant la note expliciter l’image sexuelle forte de l’hébreu.
- issue: 'Sens de רֹעִים : activité pastorale ou errance'
  choice: bergers
  alternative: errants / nomades
  rationale: La forme hébraïque appartient directement au vocabulaire du pâturage. Traduire par « errants » expliciterait un effet contextuel, mais remplacerait l’image lexicale du texte.
- issue: Relation entre les fautes des parents et l’expérience des fils
  choice: porteront le poids de vos infidélités
  alternative: subiront les conséquences de vos infidélités
  rationale: La formulation conserve l’idiome de « porter » sans préciser au-delà du texte s’il s’agit de culpabilité personnelle ou seulement de conséquences historiques.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la gravité de l’annonce judiciaire. « Désert » est préféré à « région sauvage » pour son naturel dans ce contexte biblique ; « cadavres » conserve la rudesse délibérée de פגרים.
