  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: fr
  text: Car tous les hommes qui ont vu ma gloire et les signes que j’ai accomplis en Égypte et dans le désert, et qui m’ont mis à l’épreuve ces dix fois et n’ont pas écouté ma voix[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne m’ont pas obéi ». En hébreu, l’expression « écouter la voix de quelqu’un » peut signifier tenir compte de sa parole et lui obéir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le fondement du serment et du jugement divins énoncés dans le contexte immédiat.
- source_word: כָל הָאֲנָשִׁים
  choice: tous ces hommes
  rationale: Le nom אֲנָשִׁים désigne ici les hommes de la génération visée par le jugement; « ces » convient à la valeur contextuelle définie de l’article.
- source_word: הָרֹאִים
  choice: qui ont vu
  rationale: Le participe décrit les hommes concernés en rappelant une expérience passée qui fonde leur responsabilité présente.
- source_word: כְּבֹדִי
  choice: ma gloire
  rationale: « Gloire » est le rendu naturel de כָּבוֹד dans ce contexte de manifestation divine.
- source_word: אֹתֹתַי
  choice: les signes
  rationale: אוֹת désigne des signes attestant l’action divine; « miracles » serait plus interprétatif.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que j’ai accomplis
  rationale: « Accomplir des signes » est une collocation française naturelle qui rend עשה sans ajouter une catégorie étrangère au texte.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: en Égypte et dans le désert
  rationale: « Désert » est le terme courant et contextuellement approprié en français moderne pour מִדְבָּר dans le récit de l’Exode.
- source_word: וַיְנַסּוּ אֹתִי
  choice: mais qui m’ont mis à l’épreuve
  rationale: נסה signifie ici éprouver ou tester Dieu. « Mettre à l’épreuve » rend clairement l’accusation; « mais » exprime naturellement le contraste porté par la coordination entre les manifestations vues et la réaction des hommes.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: dix fois déjà
  rationale: Le démonstratif זֶה donne à l’expression une force récapitulative; « déjà » la restitue idiomatiquement sans imposer nécessairement un décompte strictement arithmétique.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: sans écouter ma voix
  rationale: Préserve l’image hébraïque tout en laissant entendre le refus de tenir compte de la parole et d’obéir.
theological_decisions:
- issue: Références divines à la première personne
  choice: Conserver « ma gloire », « les signes que j’ai accomplis » et « ma voix »
  alternative: Expliciter la nature des manifestations ou remplacer « ma voix » par « mes ordres »
  rationale: Le discours direct de Dieu doit garder sa force et son ambiguïté propres, sans développement doctrinal absent de l’hébreu.
- issue: Portée genrée de הָאֲנָשִׁים
  choice: tous ces hommes
  alternative: tous ces gens
  rationale: Le terme et le contexte narratif visent les hommes de la génération jugée; une formulation neutre atténuerait cette précision.
- issue: Sens de שׁמע בקול
  choice: écouter ma voix, avec note sur la valeur d’obéissance
  alternative: m’obéir
  rationale: Le rendu principal conserve l’idiome concret de l’hébreu, tandis que la note signale sa portée comportementale sans résoudre silencieusement la tension lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure suspendue par un tiret, conformément à la syntaxe du passage qui se poursuit au verset suivant. Le contraste est formulé naturellement sans expansion théologique.
