source:
  edition: WLC
  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: fr
  text: Et pourquoi Yahweh nous fait-il entrer dans ce pays pour tomber sous l’épée ? Nos femmes et nos petits enfants deviendront un butin[a]. Ne vaudrait-il pas mieux pour nous retourner en Égypte ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deviendront une proie » ; l’hébreu désigne ce que des ennemis emportent comme prise ou butin.
    reason: Alternative lexicale reflétant l’étendue de sens de בַּז.
lexical_decisions:
- source_word: וְלָמָה
  choice: Et pourquoi
  rationale: La conjonction relie cette plainte à ce qui précède; « Et pourquoi » conserve ce mouvement discursif naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מֵבִיא
  choice: nous fait-il entrer
  rationale: Le participe présente l’action comme en cours ou imminente; la tournure causative française exprime naturellement le fait de conduire le peuple à l’intérieur du pays.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: Pour que nous tombions sous l’épée ?
  rationale: La proposition infinitive peut exprimer le résultat redouté, formulé ici comme une seconde question indignée. « Tomber sous l’épée » conserve l’image hébraïque de la mort au combat.
- source_word: נָשֵׁינוּ
  choice: nos femmes
  rationale: Dans ce contexte familial, le terme désigne les épouses; « nos femmes » est une formulation française courante et non ambiguë ici.
- source_word: וְטַפֵּנוּ
  choice: nos petits enfants
  rationale: טַף vise particulièrement les jeunes enfants et souligne leur vulnérabilité; « petits enfants » évite le sens affectif possible de « nos petits ».
- source_word: יִהְיוּ לָבַז
  choice: deviendront du butin
  rationale: בַּז désigne ce qui est saisi par l’ennemi comme butin. Cette formulation garde le cadre militaire tout en restant naturelle en français.
- source_word: הֲלוֹא טוֹב לָנוּ
  choice: Ne vaudrait-il pas mieux pour nous
  rationale: Cette question rhétorique négative appelle une réponse affirmative; le conditionnel français en restitue naturellement la valeur délibérative.
- source_word: שׁוּב מִצְרָיְמָה
  choice: retourner en Égypte
  rationale: L’infinitif exprime le retour vers le pays quitté; « retourner en Égypte » est idiomatique et conserve le motif du retour en arrière.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom divin sous une forme de translittération française largement reconnaissable, sans le remplacer par un titre.
- issue: Valeur de לִנְפֹּל בַּחֶרֶב
  choice: 'Question distincte exprimant le résultat redouté : « Pour que nous tombions sous l’épée ? »'
  alternative: 'Une seule question : « Pourquoi Yahweh nous fait-il entrer dans ce pays pour que nous tombions sous l’épée ? »'
  rationale: L’hébreu permet de rattacher directement l’infinitif à l’action de faire entrer. La ponctuation interrogative française rend la plainte avec clarté sans supprimer le lien de finalité ou de résultat.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formulation préserve l’enchaînement de la plainte, l’image de l’épée et le vocabulaire militaire du butin.
