  rationale: La révision réunit l’interrogation selon la syntaxe du texte hébreu et remplace une formulation française un peu maladroite par « deviendront un butin ». Elle maintient toutes les autres décisions du projet, notamment la translittération du nom divin et l’alternative lexicale en note.
