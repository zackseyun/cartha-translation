id: NUM.14.6
reference: Numbers 14:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/כָלֵב֙ בֶּן יְפֻנֶּ֔ה מִן הַ/תָּרִ֖ים אֶת הָ/אָ֑רֶץ קָרְע֖וּ בִּגְדֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: fr
  text: Josué, fils de Noun, et Caleb, fils de Jephunné, qui faisaient partie de ceux qui avaient exploré le pays, déchirèrent leurs vêtements.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements était un signe habituel de deuil, d’horreur ou de profonde détresse.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Josué
  rationale: La conjonction ouvre ici la suite narrative sans devoir être rendue explicitement en français. « Josué » est la forme française usuelle du nom.
- source_word: בִּן נוּן
  choice: fils de Noun
  rationale: Rend directement le patronyme hébreu dans une formulation française naturelle.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: et Caleb, fils de Yefounné
  rationale: La conjonction unit les deux sujets. « Caleb » est la forme française usuelle, tandis que « Yefounné » représente le nom hébreu de manière lisible.
- source_word: מִן הַתָּרִים
  choice: qui faisaient partie de ceux qui avaient exploré
  rationale: 'מִן a ici une valeur partitive : Josué et Caleb appartenaient au groupe des explorateurs. Le plus-que-parfait marque naturellement l''antériorité de l''exploration.'
- source_word: אֶת הָאָרֶץ
  choice: le pays
  rationale: אֶת, marqueur de l'objet direct, n'est pas traduit. Dans ce contexte territorial, « le pays » est idiomatique et ne précise pas davantage que l'hébreu.
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: déchirèrent leurs vêtements
  rationale: Cette formulation claire et digne conserve le geste concret exprimé en hébreu sans recourir à un terme archaïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit écrit. La valeur partitive de מִן est explicitée dans le texte afin d'éviter que « de ceux » soit compris comme indiquant simplement la provenance.
