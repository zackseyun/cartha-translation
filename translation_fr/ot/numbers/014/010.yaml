  verdict: revise
  source_fidelity: 'La formulation « parla de les lapider » affaiblit le sens de l’hébreu ויאמרו + infinitif, qui exprime ici une décision ou une injonction visant la lapidation. Le complément « à coups de pierres » rend explicitement le moyen indiqué par באבנים, sans ajouter « à mort ». Le reste respecte le texte : la gloire de Yahweh se manifeste dans la tente de la Rencontre devant l’ensemble d’Israël.'
  naturalness: « Toute la communauté dit qu’il fallait les lapider à coups de pierres » est idiomatique et clair en français moderne. « Devant tous les Israélites » rend naturellement la portée de אל tout en évitant l’enchaînement peu fluide « apparut … à tous les Israélites ».
  terminology: « Yahweh », « gloire », « tente de la Rencontre » et « Israélites » sont cohérents avec le registre biblique moderne et avec les choix terminologiques du projet. La majuscule à « Rencontre » traite l’expression comme la désignation établie du sanctuaire.
