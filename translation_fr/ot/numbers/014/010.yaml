    rationale: Bien que « lapider » implique normalement des pierres en français, באבנים est explicitement présent dans l’hébreu. « À coups de pierres » le conserve de manière naturelle.
  - severity: low
    issue: « Alors » introduit une relation temporelle plus marquée
    rationale: Le waw relie la manifestation divine à la réaction de la communauté; « Mais » préserve plus directement le contraste du contexte et correspond aussi à l’audit anglais.
