    issue: « parla de les lapider »
    rationale: Cette expression suggère qu’ils ont seulement discuté de cette éventualité. Le verbe אמר avec l’infinitif לרגם présente plus directement ce qu’ils disaient qu’il fallait faire.
  - severity: low
