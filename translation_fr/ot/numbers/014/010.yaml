  text: וַ/יֹּֽאמְרוּ֙ כָּל הָ֣/עֵדָ֔ה לִ/רְגּ֥וֹם אֹתָ֖/ם בָּ/אֲבָנִ֑ים וּ/כְב֣וֹד יְהוָ֗ה נִרְאָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: fr
  text: Mais toute la communauté dit qu’il fallait les lapider à coups de pierres. La gloire de Yahweh apparut alors dans la tente de la Rencontre, devant tous les Israélites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble de la communauté d’Israël. « Toute la communauté » est naturel en français moderne et conserve la portée collective de l’hébreu.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: parla de les lapider
  rationale: Le verbe רגם signifie « lapider ». La construction française « parler de les lapider » rend l’intention exprimée sans ajouter explicitement « à mort », absent du texte hébreu. Le moyen, « avec des pierres », est déjà contenu dans le verbe français « lapider ».
- source_word: אֹתָם
  choice: les
  rationale: Le pronom renvoie à Josué et Caleb dans le contexte immédiat. Il est maintenu sous forme pronominale afin de préserver l’enchaînement du texte.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: כָּבוֹד désigne ici la manifestation visible et glorieuse de la présence divine. Le nom personnel יהוה est translittéré « Yahweh ».
- source_word: נִרְאָה
  choice: apparut
  rationale: Le niphal de ראה exprime ici une manifestation visible. « Apparut » convient naturellement au contexte d’une manifestation divine.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: L’expression désigne la tente où Yahweh rencontre son peuple. « Tente de la rencontre » est transparente, digne et proche du sens de מוֹעֵד dans cette désignation cultuelle.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: à tous les Israélites
  rationale: Bien que l’expression signifie littéralement « à tous les fils d’Israël », elle fonctionne comme une désignation nationale englobant le peuple. « Tous les Israélites » transmet ce sens idiomatiquement en français sans restreindre artificiellement le référent aux hommes.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie le tétragramme comme nom personnel. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: tous les Israélites
  alternative: tous les fils d’Israël
  rationale: Il s’agit ici de la désignation conventionnelle du peuple d’Israël. Le français idiomatique « Israélites » en préserve la portée nationale et inclusive.
- issue: Force de רגם
  choice: lapider
  alternative: lapider à mort
  rationale: La mise à mort est vraisemblablement visée dans le contexte, mais elle n’est pas formulée séparément dans ce verset. La traduction n’ajoute donc pas « à mort ».
translation_notes:
  register: Français international moderne, courant et digne. La coordination « Alors » fait ressortir l’intervention divine au moment où la communauté envisage la lapidation. Aucun marqueur de note n’est requis, puisque la tournure idiomatique « tous les Israélites » est retenue dans le texte principal.
