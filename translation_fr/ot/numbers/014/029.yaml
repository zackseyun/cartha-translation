    issue: Expression d’âge non idiomatique
    rationale: « Depuis l’âge de vingt ans et au-dessus » est une formulation non naturelle en français moderne et risque de brouiller la construction. « Âgés de vingt ans et plus » exprime clairement le même groupe.
  - severity: low
    issue: Enchaînement syntaxique lourd après les deux-points
    rationale: La succession « vous tous qui avez été recensés, selon votre nombre total, depuis... » est grammaticalement compréhensible, mais peut être rendue plus fluide en faisant de « recensés » et « âgés » des appositions à « vous tous ».
