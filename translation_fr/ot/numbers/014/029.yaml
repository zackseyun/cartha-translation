  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: fr
  text: 'Dans ce désert, vos cadavres tomberont[a] : vous tous, recensés selon votre nombre total, âgés de vingt ans et plus, vous qui avez murmuré contre moi[c].[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos corps sans vie tomberont ». L’hébreu emploie une expression concrète qui souligne la mort physique dans le désert.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des personnes inscrites lors du recensement.
    reason: cultural_note
  - marker: c
    text: Ou « qui avez protesté contre moi » ; le verbe évoque des plaintes formulées dans un esprit de révolte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: Dans ce désert
  rationale: מִדְבָּר désigne une région désertique ou sauvage. « Désert » est naturel en français et convient au cadre géographique du récit.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: vos cadavres tomberont
  rationale: 'La formulation conserve l’image concrète et sévère de l’hébreu : נפל signifie « tomber » et פגר désigne un cadavre. Elle évite de réduire l’expression à « vous mourrez ».'
- source_word: וְכָל פְּקֻדֵיכֶם
  choice: vous tous qui avez été recensés
  rationale: פְּקֻדֵיכֶם renvoie aux personnes dénombrées ou inscrites lors du recensement. Cette tournure rend le référent clairement et naturellement.
- source_word: לְכָל מִסְפַּרְכֶם
  choice: selon votre nombre total
  rationale: La formule souligne que l’ensemble des personnes comptées est visé, sans omission.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Cette formulation restitue la formule hébraïque fixant le seuil d’âge dans le contexte du recensement, tout en restant intelligible en français international.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: qui avez murmuré contre moi
  rationale: Le hifil de לון exprime ici des plaintes répétées et rebelles. « Murmurer contre » garde la coloration biblique tout en demeurant compréhensible.
theological_decisions:
- issue: Caractère concret du jugement prononcé
  choice: Conserver « vos cadavres tomberont »
  alternative: « vous mourrez dans ce désert »
  rationale: Le texte hébreu met l’accent sur la réalité corporelle de la mort comme jugement. La traduction conserve cette force sans l’atténuer par une paraphrase.
translation_notes:
  register: Français moderne, digne et direct. La syntaxe explicite le lien entre les cadavres et les personnes recensées, tandis que les termes concrets du jugement et l’exhaustivité du dénombrement sont conservés.
