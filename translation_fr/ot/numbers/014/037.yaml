id: NUM.14.37
reference: Numbers 14:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: fr
  text: Ces hommes qui avaient répandu un rapport défavorable sur le pays moururent frappés par le fléau devant Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: moururent
  rationale: Le qal wayyiqtol de מות poursuit le récit au passé. Le passé simple convient au registre narratif soutenu et reste naturel dans une traduction biblique française.
- source_word: הָאֲנָשִׁים
  choice: Ces hommes
  rationale: L’expression définie renvoie aux hommes mentionnés dans le contexte précédent; « Ces hommes » rend clairement cette valeur anaphorique.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: qui avaient répandu un rapport défavorable sur le pays
  rationale: Le participe désigne les hommes par leur action antérieure, d’où le plus-que-parfait. יצא au causatif peut évoquer le fait de faire sortir ou circuler l’information; « répandu » est idiomatique en français. דִּבָּה désigne ici un rapport accusateur ou dénigrant, sans imposer plus explicitement que l’hébreu la notion de mensonge.
- source_word: בַּמַּגֵּפָה
  choice: frappés par le fléau
  rationale: מַגֵּפָה peut désigner un fléau, une plaie ou un coup mortel. La tournure « moururent frappés par le fléau » exprime naturellement le moyen ou la cause indiqué par בְּ.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי conserve l’idée de présence immédiate, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le Tétragramme. « Yahweh » préserve le nom personnel d’alliance plutôt que de le remplacer par un titre.
- issue: Nature du « rapport défavorable »
  choice: Ne pas préciser explicitement qu’il était mensonger
  alternative: un rapport mensonger sur le pays
  rationale: דִּבָּה comporte une nuance dénigrante ou accusatrice, mais ce verset ne formule pas à lui seul une qualification explicite de mensonge. La traduction conserve cette tension sans surinterprétation.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la tenue narrative. « Rapport défavorable » est plus naturel que « mauvais rapport » et conserve la portée négative de l’hébreu; « fléau » garde la solennité du jugement sans restreindre le terme à une maladie précisément identifiée.
