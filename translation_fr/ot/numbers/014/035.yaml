source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: fr
  text: 'Moi, Yahweh, j’ai parlé. Oui[a], je ferai cela à toute cette communauté mauvaise qui s’est liguée contre moi : dans ce désert, ils arriveront à leur fin, et c’est là qu’ils mourront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque rendue par « Oui » signifie littéralement « si ce n’est pas » ; dans un serment, elle exprime une très forte certitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Le parfait exprime une parole divine déjà prononcée et désormais certaine; le passé composé est naturel et solennel en français moderne.
- source_word: אִם לֹא
  choice: Oui, c’est bien
  rationale: Dans cette formule de serment, l’expression ne pose pas une condition réelle, mais renforce avec solennité la certitude de ce qui suit.
- source_word: הָעֵדָה הָרָעָה הַזֹּאת
  choice: toute cette communauté mauvaise
  rationale: « Communauté » désigne collectivement le groupe d’Israélites sans connotation ecclésiale particulière; « mauvaise » conserve ici le jugement moral porté par רָעָה.
- source_word: הַנּוֹעָדִים עָלָי
  choice: qui s’est liguée contre moi
  rationale: Le verbe décrit un rassemblement concerté en opposition à Yahweh; « se liguer » rend à la fois l’action collective et son caractère hostile.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: dans ce désert
  rationale: « Désert » est l’équivalent français courant de מִדְבָּר dans ce contexte géographique, tout en gardant le démonstratif.
- source_word: יִתַּמּוּ
  choice: ils disparaîtront jusqu’au dernier
  rationale: Le verbe signifie arriver à son terme, être entièrement consumé ou achevé. Cette formulation exprime l’épuisement total du groupe sans simplement répéter « mourir ».
- source_word: וְשָׁם יָמֻתוּ
  choice: et c’est là qu’ils mourront
  rationale: La tournure détachée conserve l’accent hébreu sur le lieu même où le jugement s’accomplira.
theological_decisions:
- issue: Valeur de la formule אִם לֹא
  choice: 'Affirmation solennelle : « Oui, c’est bien ce que je ferai »'
  alternative: 'Condition littérale : « si je ne fais pas cela »'
  rationale: Dans ce contexte de serment divin, אִם לֹא fonctionne comme une déclaration emphatique de certitude, non comme une condition laissée ouverte.
- issue: Portée de יִתַּמּוּ avant « ils mourront »
  choice: « ils disparaîtront jusqu’au dernier »
  alternative: « ils arriveront à leur fin »
  rationale: Le choix maintient la distinction entre l’anéantissement progressif et collectif du groupe et la mention explicite de leur mort, sans préciser un mécanisme absent de l’hébreu.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe garde la solennité de la déclaration divine sans archaïsmes. « Se liguer » exprime clairement l’opposition concertée; « jusqu’au dernier » explicite la totalité portée par יִתַּמּוּ sans fusionner ce verbe avec la mort mentionnée ensuite.
