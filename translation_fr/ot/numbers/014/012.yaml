base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: fr
  text: Je le frapperai de la peste et je le déposséderai[a] ; je ferai de toi une nation plus grande et plus puissante que lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le priverai de son héritage » ou « le déshériterai ». Le verbe hébreu peut évoquer à la fois la dépossession et la perte d’un héritage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: Je le frapperai
  rationale: Le hifil de נכה signifie couramment « frapper ». Le pronom masculin singulier représente ici Israël comme une entité collective.
- source_word: בַדֶּבֶר
  choice: par la peste
  rationale: דֶּבֶר désigne souvent une épidémie meurtrière dans un contexte de jugement. « La peste » est une formulation française naturelle et forte.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: et le déposséderai
  rationale: Le hifil de ירשׁ peut exprimer la dépossession ou la privation d’héritage. « Déposséder » conserve l’idée de perte de possession sans préciser excessivement sa nature.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: puis je ferai de toi une nation
  rationale: La construction עשה avec le complément introduit par לְ exprime le fait de faire de quelqu’un quelque chose. Cette tournure est idiomatique en français.
- source_word: גָּדוֹל וְעָצוּם מִמֶּנּוּ
  choice: plus grande et plus puissante que lui
  rationale: Le comparatif מן porte naturellement sur les deux adjectifs. עָצוּם peut évoquer la puissance, la force ou le grand nombre ; « puissante » préserve ici cette amplitude mieux que « nombreuse ».
theological_decisions:
- issue: Référent des suffixes masculins singuliers
  choice: Employer « le » et « lui » pour représenter Israël comme une nation collective au singulier.
  alternative: Employer « les » et « eux » pour désigner naturellement les Israélites au pluriel.
  rationale: L’hébreu emploie systématiquement le masculin singulier dans ce verset. Le français peut également reprendre « ce peuple » ou Israël comme une réalité collective par un pronom singulier, ce qui préserve la rhétorique du texte.
- issue: Portée de ירשׁ dans ce contexte
  choice: Traduire par « déposséder » dans le texte principal.
  alternative: « priver de son héritage » ou « déshériter »
  rationale: Le verbe comporte des connotations de possession et d’héritage, mais le contexte ne tranche pas entièrement entre perte du territoire, de l’héritage et du statut national. La note conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le futur direct conserve la force de la menace divine. Le singulier collectif, légèrement marqué mais intelligible, reproduit les suffixes hébreux et prépare la comparaison finale avec la nation issue de Moïse.
