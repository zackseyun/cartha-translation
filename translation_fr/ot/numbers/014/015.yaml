  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: fr
  text: 'Et si tu fais mourir ce peuple d’un seul coup[a], les nations qui ont entendu parler de toi[b] diront :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme un seul homme » ; l’expression signifie ici que le peuple entier serait mis à mort ensemble.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « qui ont entendu ce qu’on rapporte à ton sujet ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: Et si tu fais mourir
  rationale: Le hiphil de מות signifie « faire mourir, tuer ». Bien que וְ soit une simple coordination, le contexte de la phrase commencée au verset précédent appelle naturellement une formulation conditionnelle en français.
- source_word: הָעָם הַזֶּה
  choice: tout ce peuple
  rationale: עָם désigne ici Israël collectivement. « Ce peuple » rend le démonstratif, tandis que « tout » explicite la totalité exprimée par l’idiome qui suit.
- source_word: כְּאִישׁ אֶחָד
  choice: d’un seul coup
  rationale: Littéralement « comme un seul homme », l’expression indique ici que le peuple entier serait mis à mort ensemble. « D’un seul coup » en restitue naturellement la portée dans ce contexte, avec une note conservant la forme hébraïque.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: גּוֹיִם désigne les nations environnantes, par contraste avec Israël. « Les nations » évite les associations plus tardives de « les païens » ou « les Gentils ».
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: qui ont entendu parler de toi
  rationale: שֵׁמַע peut signifier « nouvelle, récit, renommée ». La construction « ton récit/ce qu’on rapporte de toi » se rend naturellement par « entendu parler de toi », tout en laissant ouverte la nuance entre les nouvelles de ses actes et sa renommée.
- source_word: לֵאמֹר
  choice: 'diront :'
  rationale: L’infinitif introduit les paroles des nations au verset suivant. Le futur et les deux-points assurent en français une transition naturelle vers la citation.
theological_decisions:
- issue: Portée de l’idiome anthropologique כְּאִישׁ אֶחָד
  choice: d’un seul coup
  alternative: comme un seul homme
  rationale: Dans ce contexte, l’expression ne décrit pas une unité d’action masculine, mais la mise à mort collective de tout le peuple. La traduction dynamique transmet cette portée sans transformer l’idiome en affirmation liée au sexe, tandis que la note en préserve la forme littérale.
- issue: Objet de ce que les nations ont entendu
  choice: entendu parler de toi
  alternative: entendu ce qu’on rapporte à ton sujet / entendu parler de ta renommée
  rationale: Le suffixe de שִׁמְעֲךָ renvoie à YHWH, et le nom peut désigner aussi bien le récit entendu à son sujet que sa renommée. La formulation retenue préserve cette amplitude sans préciser indûment s’il s’agit surtout de sa réputation ou d’un compte rendu de ses actes.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement suit l’adresse biblique singulière à Dieu. « Faire mourir » est moins abruptement moderne que « tuer » tout en rendant précisément le causatif hébreu. La phrase demeure ouverte sur les paroles rapportées au verset suivant.
