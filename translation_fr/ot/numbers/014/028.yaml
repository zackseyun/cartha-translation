  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: fr
  text: 'Dis-leur : « Aussi vrai que je suis vivant — déclaration du SEIGNEUR —, je ferai à votre égard ce que je vous ai entendu dire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Rend naturellement en français la formule hébraïque de serment divin, littéralement « Je suis vivant », tout en conservant sa force solennelle.
- source_word: נְאֻם יְהוָה
  choice: déclaration du SEIGNEUR
  rationale: Conserve la formule prophétique solennelle et représente le tétragramme selon la convention française « le SEIGNEUR ».
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם בְּאָזְנָי
  choice: comme je vous ai entendus le dire
  rationale: Expression française idiomatique qui restitue littéralement l'idée de paroles prononcées « à mes oreilles », c'est-à-dire entendues par Dieu.
- source_word: אִם לֹא ... כֵּן אֶעֱשֶׂה לָכֶם
  choice: je vous traiterai exactement comme
  rationale: L'hébreu emploie une formule de serment elliptique qui affirme avec certitude l'action annoncée; « exactement » en marque la correspondance emphatique sans ajouter une menace étrangère au texte.
theological_decisions:
- issue: Formule divine de serment אִם לֹא
  choice: 'Affirmation certaine intégrée à la phrase : « je vous traiterai exactement comme… »'
  alternative: « certainement, comme… ainsi je vous ferai »
  rationale: La tournure hébraïque est un serment elliptique, non une condition réelle. Le français retenu en transmet la certitude sans tenter de compléter l'imprécation sous-entendue.
- issue: Nom divin יהוה
  choice: le SEIGNEUR
  alternative: Yahvé
  rationale: Suit une convention française largement intelligible tout en distinguant typographiquement le tétragramme du titre ordinaire « Seigneur ».
translation_notes:
  register: Français international moderne, direct et solennel. La formulation garde l'adresse au pluriel et la correspondance judiciaire entre les paroles du peuple et ce que Dieu leur fera.
