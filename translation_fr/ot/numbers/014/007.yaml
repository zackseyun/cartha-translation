  text: וַ/יֹּ֣אמְר֔וּ אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֗רֶץ אֲשֶׁ֨ר עָבַ֤רְנוּ בָ/הּ֙ לָ/ת֣וּר אֹתָ֔/הּ טוֹבָ֥ה הָ/אָ֖רֶץ מְאֹ֥ד מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: fr
  text: 'Ils dirent à toute la communauté des Israélites : « Le pays que nous avons parcouru pour l’explorer[a] est un très, très bon pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le reconnaître » ou « pour l’espionner ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol de אמר introduit la prise de parole dans le récit ; le passé simple convient au registre narratif biblique français sans être archaïque.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: à toute la communauté des Israélites
  rationale: עֵדָה désigne ici la communauté réunie. « Israélites » rend naturellement בְּנֵי יִשְׂרָאֵל en français moderne, sans donner à « fils » un sens exclusivement masculin.
- source_word: לֵאמֹר
  choice: non rendu séparément
  rationale: L’infinitif hébreu qui introduit les paroles est rendu naturellement par les deux-points et la citation directe.
- source_word: הָאָרֶץ
  choice: Le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire de Canaan ; « pays » est plus naturel que « terre » pour un territoire exploré.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: que nous avons parcouru
  rationale: La tournure rend le mouvement à travers le territoire de manière idiomatique et concise.
- source_word: לָתוּר אֹתָהּ
  choice: pour l’explorer
  rationale: תור décrit une reconnaissance du territoire. « Explorer » conserve le sens sans imposer la nuance clandestine plus forte d’« espionner » ; cette possibilité est signalée en note.
- source_word: טוֹבָה
  choice: bon
  rationale: « Bon » conserve le sens fondamental de טוֹב, dont l’intensité est exprimée séparément par מְאֹד מְאֹד.
- source_word: מְאֹד מְאֹד
  choice: très, très
  rationale: La répétition française reproduit l’insistance rhétorique de l’hébreu au lieu de la réduire à un seul adverbe intensif.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. La répétition « très, très » est volontaire : elle préserve l’emphase de l’hébreu מְאֹד מְאֹד. Le marqueur [a] figure immédiatement après le terme concerné.'
