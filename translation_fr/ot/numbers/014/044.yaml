source:
  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: fr
  text: Mais ils eurent la présomption de monter vers le sommet de la montagne[a], tandis que l’arche de l’alliance de Yahweh[b] et Moïse ne sortirent pas du camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils agirent avec présomption » ou « ils osèrent monter ». Le verbe hébreu évoque une action volontaire et présomptueuse.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre construction possible : « l’arche de l’alliance appartenant à Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: ils eurent la présomption
  rationale: Le verbe rare עפל exprime ici une initiative téméraire et volontaire, prise en défi de l’avertissement divin. Cette formulation conserve la portée morale du terme sans réduire l’action à une simple montée.
- source_word: לַעֲלוֹת
  choice: de monter
  rationale: עלה désigne normalement un mouvement ascendant. « Monter » est naturel en français et convient au relief mentionné.
- source_word: אֶל רֹאשׁ הָהָר
  choice: jusqu’au sommet de la montagne
  rationale: רֹאשׁ, littéralement « tête », désigne idiomatiquement le sommet. La préposition אֶל indique la direction ou le but visé, sans garantir que celui-ci ait été atteint.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: tandis que l’arche de l’alliance de Yahweh
  rationale: La construction hébraïque est conservée de façon intelligible. Le waw introduit ici un contraste circonstanciel entre leur montée et l’immobilité de l’arche et de Moïse.
- source_word: לֹא מָשׁוּ
  choice: ne quittèrent pas
  rationale: מוש signifie ici ne pas s’éloigner ou ne pas partir d’un lieu. « Ne quittèrent pas » exprime clairement que ni l’arche ni Moïse n’accompagnèrent le peuple.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: le milieu du camp
  rationale: קֶרֶב désigne l’intérieur ou le milieu. Cette expression reste proche de l’hébreu tout en étant naturelle en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel de l’alliance plutôt que de lui substituer un titre.
- issue: Nuance morale de וַיַּעְפִּלוּ
  choice: ils eurent la présomption de monter
  alternative: ils montèrent avec défiance / ils osèrent monter
  rationale: Le contexte présente une tentative volontaire menée malgré la parole de Yahweh. Le choix retenu conserve la culpabilité et la témérité impliquées sans préciser davantage que le verbe.
- issue: Rapport syntaxique du dernier membre
  choice: tandis que
  alternative: mais
  rationale: Le waw marque le contraste entre l’initiative du peuple et le fait que l’arche et Moïse restent au camp. « Tandis que » rend ce rapport sans transformer l’énoncé en explication causale.
translation_notes:
  register: Français international moderne, digne et accessible. « Eurent la présomption » maintient la nuance morale du verbe rare ; « jusqu’au sommet » exprime le but de la montée sans affirmer qu’ils l’atteignirent. Les deux marqueurs de note figurent dans le texte dans l’ordre de leur apparition.
