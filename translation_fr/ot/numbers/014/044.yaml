revisions:
- from: Mais ils eurent la présomption de monter jusqu’au sommet de la montagne[a], tandis que l’arche de l’alliance de Yahweh[b] et Moïse ne quittèrent pas le milieu du camp.
  to: Mais ils eurent la présomption de monter vers le sommet de la montagne[a], tandis que l’arche de l’alliance de Yahweh[b] et Moïse ne sortirent pas du camp.
  rationale: La révision conserve la nuance de présomption, rend la direction de l’ascension sans suggérer explicitement son achèvement, et améliore l’idiomaticité du dernier membre. Les notes ont été corrigées afin que leurs alternatives françaises correspondent au sens lexical et qu’elles ne résolvent pas indûment l’ambiguïté de la construction hébraïque.
