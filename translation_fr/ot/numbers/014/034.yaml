id: NUM.14.34
reference: Numbers 14:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: fr
  text: Selon le nombre des jours pendant lesquels vous avez exploré le pays — quarante jours —, un jour pour une année, un jour pour une année, vous porterez le poids de vos fautes pendant quarante ans, et vous connaîtrez mon opposition[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon éloignement », « mon hostilité » ou « mon mécontentement ». Le terme hébreu est rare. Certaines traductions anciennes ont compris « ma rupture de promesse », mais il désigne probablement l’opposition ou la mise à distance du Seigneur envers cette génération rebelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: Selon le nombre des jours
  rationale: La préposition ב avec מִסְפָּר marque ici une correspondance proportionnelle. Cette formulation conserve le lien explicite entre les jours d’exploration et les années de jugement.
- source_word: תַּרְתֶּם
  choice: vous avez exploré
  rationale: Dans ce contexte, תור désigne la mission de reconnaissance du pays. « Exploré » est clair en français courant et n’impose pas la connotation clandestine que peut avoir « espionné ».
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le nom désigne ici le territoire de Canaan. « Le pays » est naturel en français et suffisamment précis dans le contexte.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: un jour pour une année, un jour pour une année
  rationale: La répétition emphatique de l’hébreu est maintenue, de même que la correspondance entre chaque jour et une année.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: vous porterez le poids de vos fautes
  rationale: L’expression נשא עון associe la culpabilité à ses conséquences. L’ajout idiomatique « le poids de » conserve l’image de porter tout en donnant une formulation française naturelle.
- source_word: וִידַעְתֶּם
  choice: vous connaîtrez
  rationale: ידע peut inclure une connaissance acquise par l’expérience. « Connaîtrez » préserve cette portée sans la réduire à « subirez ».
- source_word: תְּנוּאָתִי
  choice: mon opposition
  rationale: Ce nom rare peut exprimer l’opposition, l’éloignement ou l’hostilité. « Mon opposition » convient au contexte judiciaire et évite de suggérer que Dieu manquerait à sa promesse.
theological_decisions:
- issue: Sens de תְּנוּאָתִי dans l’annonce du jugement
  choice: mon opposition
  alternative: mon éloignement ; mon hostilité ; mon mécontentement ; ma rupture de promesse
  rationale: Le terme rare décrit vraisemblablement l’attitude de Dieu envers la génération rebelle, qu’il s’agisse d’opposition ou de mise à distance. « Mon opposition » maintient la sévérité et l’ambiguïté relative du terme sans attribuer à Dieu un manquement à sa parole.
translation_notes:
  register: Français international moderne, clair et digne. La répétition emphatique est volontairement conservée. Les tirets isolent « quarante jours » comme une reprise explicative du nombre des jours.
