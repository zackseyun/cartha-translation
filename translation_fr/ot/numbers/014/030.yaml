  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: fr
  text: Vous n’entrerez certainement pas dans le pays au sujet duquel j’ai levé la main pour vous y établir[a], excepté Caleb, fils de Jephunné, et Josué, fils de Noun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays au sujet duquel j’ai levé la main pour vous y établir ». Lever la main était un geste de serment : Dieu avait juré de leur donner ce pays.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: Vous n’entrerez certainement pas
  rationale: En tête de cette déclaration solennelle, אִם relève de la formule de serment et exprime une forte négation, non une simple condition.
- source_word: אֶל הָאָרֶץ
  choice: dans le pays
  rationale: Avec le verbe בוא, le français naturel exprime ici l’entrée dans un territoire.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: au sujet duquel j’ai levé la main
  rationale: Cette formulation conserve l’image hébraïque du geste de serment sans la remplacer entièrement par une explicitation.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: de vous y établir
  rationale: Le causatif de שׁכן signifie faire habiter ou établir; « vous y établir » est idiomatique et garde cette valeur causative.
- source_word: כִּי אִם
  choice: excepté
  rationale: La locution introduit les deux seules exceptions à la négation précédente.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Caleb, fils de Yefounné
  rationale: Le patronyme est conservé; les noms suivent une translittération française lisible et proche de l’hébreu.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: et Josué, fils de Noun
  rationale: La conjonction et le patronyme sont conservés; « Josué » est la forme française usuelle.
theological_decisions:
- issue: Rendre la formule de serment sans atténuer le jugement divin
  choice: Vous n’entrerez certainement pas dans le pays
  alternative: Si vous entrez dans le pays…
  rationale: Dans ce contexte de sentence divine, l’emploi de אִם a la force idiomatique d’une négation solennelle. Une proposition conditionnelle laisserait en français une phrase trompeuse et inachevée.
translation_notes:
  register: Français international moderne, digne et accessible. L’image concrète de la main levée est maintenue dans le texte, tandis que la note en explicite la portée culturelle. « Certainement pas » restitue la solennité de la négation sans archaïsme.
