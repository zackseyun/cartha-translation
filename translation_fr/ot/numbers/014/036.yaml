  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: fr
  text: Les hommes que Moïse avait envoyés reconnaître le pays[a] revinrent et amenèrent toute la communauté à murmurer contre lui en faisant circuler un rapport défavorable sur le pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « explorer le pays »; selon le contexte, « espionner le pays ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en répandant des propos dénigrants sur le pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Les hommes
  rationale: Le français n’a pas besoin de rendre mécaniquement le waw initial; « Les hommes » reprend naturellement les personnes déjà mentionnées sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: que Moïse avait envoyés
  rationale: Le plus-que-parfait explicite naturellement en français l’antériorité de l’envoi par rapport au retour, déjà claire dans le récit hébreu.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: explorer le pays
  rationale: Le verbe תור désigne ici une mission de reconnaissance. « Explorer » est courant, neutre et suffisamment large; « espionner » reste une possibilité contextuelle signalée en note.
- source_word: וַיָּשֻׁבוּ
  choice: revinrent
  rationale: Rendu narratif direct et concis du retour des hommes.
- source_word: וילונו עָלָיו
  choice: poussèrent toute la communauté à protester contre lui
  rationale: 'La forme a ici une valeur causative: les hommes provoquent la protestation de la communauté contre Moïse. « Protester contre » conserve l’orientation hostile de עָלָיו et exprime naturellement le motif récurrent des récriminations dans le désert.'
- source_word: אֶת כָּל־הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne collectivement la communauté d’Israël. « Communauté » est naturel en français moderne et évite le sens principalement cultuel que peut prendre « assemblée ».
- source_word: לְהוֹצִיא דִבָּה
  choice: en répandant des propos malveillants
  rationale: L’infinitif indique le moyen par lequel les hommes suscitent la protestation. דִבָּה peut désigner un rapport dénigrant ou des propos diffamatoires; cette formulation conserve la portée négative sans préciser indûment qu’il s’agit d’un mensonge.
- source_word: עַל־הָאָרֶץ
  choice: sur le pays
  rationale: La préposition introduit ici le sujet visé par les propos; « sur le pays » est idiomatique et garde ouverte la nuance possible d’hostilité envers le pays.
theological_decisions:
- issue: Responsabilité des explorateurs dans la protestation communautaire
  choice: 'Rendre explicitement la valeur causative: « poussèrent toute la communauté à protester »'
  alternative: « toute la communauté protesta » ou « murmurèrent avec toute la communauté »
  rationale: La construction hébraïque présente les hommes comme ceux qui provoquent les récriminations de la communauté, et non simplement comme des participants à celles-ci.
- issue: Nature des propos sur le pays
  choice: « propos malveillants »
  alternative: « faux rapport »
  rationale: Le texte condamne le caractère dénigrant du compte rendu sans exiger que chaque élément en soit factuellement faux; la traduction n’ajoute donc pas cette conclusion.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve le rôle causatif des explorateurs et la force négative de דִבָּה, tout en évitant les termes inutilement techniques ou une accusation explicite de mensonge que le mot hébreu n’impose pas à lui seul.
