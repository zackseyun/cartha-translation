    issue: « protester contre lui » affaiblit la nuance de récrimination de וַיַלִּינוּ.
    rationale: Dans le récit du désert, לון désigne le fait de murmurer ou de se plaindre avec hostilité; « protester » peut suggérer une contestation formelle ou légitime plutôt que les récriminations visées.
  - severity: medium
    issue: « propos malveillants » ne rend pas explicitement δִבָּה comme un rapport au sujet du pays et peut imputer une intention.
    rationale: Le mot désigne ici un mauvais rapport, dénigrant ou défavorable. La formulation proposée rend l’objet discursif sans décider que les hommes agissaient par malveillance ni que chaque affirmation était fausse.
  revised_text: Les hommes que Moïse avait envoyés reconnaître le pays[a] revinrent et amenèrent toute la communauté à murmurer contre lui en faisant circuler un rapport défavorable sur le pays[b].
