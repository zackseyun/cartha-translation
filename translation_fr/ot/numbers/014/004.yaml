  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: fr
  text: 'Ils se dirent : « Désignons un chef[b] et retournons en Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement : « donnons une tête ». Ici, « tête » désigne une personne placée à la tête du groupe, c’est-à-dire un chef.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils se dirent
  rationale: Le wayyiqtol de אמר fait progresser le récit. En français, le passé simple convient au registre narratif, et la forme pronominale introduit naturellement l’échange réciproque.
- source_word: אִישׁ אֶל אָחִיו
  choice: les uns aux autres
  rationale: L’expression signifie littéralement « chacun à son frère », mais fonctionne ici comme une tournure réciproque. « Les uns aux autres » en rend naturellement le sens sans accentuer indûment le genre masculin.
- source_word: נִתְּנָה
  choice: Donnons-nous
  rationale: Le cohortatif pluriel de נתן, construit avec רֹאשׁ, exprime la décision de se donner ou d’établir quelqu’un comme chef. « Donnons-nous » conserve davantage l’image verbale hébraïque tout en restant idiomatique en français.
- source_word: רֹאשׁ
  choice: un chef
  rationale: Bien que le mot signifie littéralement « tête », il désigne ici une personne placée à la tête du groupe. « Chef » exprime clairement cette fonction dans un registre digne et courant.
- source_word: וְנָשׁוּבָה
  choice: et retournons
  rationale: Le cohortatif coordonné poursuit l’exhortation collective. « Retournons » en conserve directement la force volitive.
- source_word: מִצְרָיְמָה
  choice: en Égypte
  rationale: La terminaison directionnelle indique un mouvement vers l’Égypte. Après « retourner », le français idiomatique emploie « en Égypte ».
theological_decisions: []
