id: NUM.14.8
reference: Numbers 14:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: fr
  text: 'Si Yahweh se plaît en nous[a], il nous fera entrer dans ce pays et nous le donnera : un pays ruisselant de lait et de miel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prend plaisir en nous » ou « nous est favorable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: La particule introduit ici une condition liée à la disposition favorable de Yahweh envers le peuple.
- source_word: חָפֵץ בָּנוּ
  choice: se plaît en nous
  rationale: Cette expression conserve la dimension personnelle et affective de חפץ tout en restant concise et digne en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: il nous fera entrer dans ce pays
  rationale: Dans la conséquence de la condition, la forme verbale a une valeur future; «faire entrer dans» exprime clairement l’entrée en Canaan.
- source_word: וּנְתָנָהּ לָנוּ
  choice: et nous le donnera
  rationale: Le suffixe pronominal renvoie au pays; נתן a ici son sens direct de «donner».
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: un pays ruisselant de lait et de miel
  rationale: La reprise appositionnelle de «pays» est maintenue, et l’image hébraïque de l’abondance est rendue par une expression française naturelle et traditionnelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin; sa transcription préserve le nom personnel sans lui substituer un titre.
- issue: Nature de la faveur divine exprimée par חָפֵץ בָּנוּ
  choice: se plaît en nous
  alternative: nous est favorable
  rationale: Le choix principal garde la nuance de plaisir ou d’agrément personnel, sans réduire l’expression à une simple assistance favorable.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conditionnelle et la reprise appositionnelle de « pays » suivent étroitement l’hébreu, tandis que « fera entrer » et « ruisselant » assurent une formulation naturelle.
