  text: וַ/יֵּ֤רֶד הָ/עֲמָלֵקִי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/הָ֣ר הַ/ה֑וּא וַ/יַּכּ֥וּ/ם וַֽ/יַּכְּת֖וּ/ם עַד הַֽ/חָרְמָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: fr
  text: Alors les Amalécites et les Cananéens qui habitaient cette région montagneuse descendirent, les frappèrent et les écrasèrent jusqu’à Horma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Horma est un nom de lieu. En hébreu, ce nom est apparenté à un terme évoquant la destruction ou le fait de vouer quelque chose à la destruction.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendirent
  rationale: Le verbe singulier placé avant un sujet composé est une construction hébraïque courante. Le pluriel français s’accorde naturellement avec les deux peuples et conserve le mouvement depuis les hauteurs.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: les Amalécites et les Cananéens
  rationale: Les gentilés morphologiquement singuliers ont ici un sens collectif; le pluriel est idiomatique en français et correspond aux verbes pluriels qui suivent.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: qui habitaient cette région montagneuse
  rationale: יֹשֵׁב exprime le fait d’habiter, tandis que הָר désigne ici un relief régional plutôt qu’un sommet isolé. « Région montagneuse » rend clairement ce cadre géographique.
- source_word: וַיַּכּוּם
  choice: les frappèrent
  rationale: נכה possède un sens militaire large, « frapper » ou « battre ». « Frappèrent » garde la force concrète du verbe sans anticiper l’intensification du verbe suivant.
- source_word: וַיַּכְּתוּם
  choice: les écrasèrent
  rationale: Le verbe exprime une action violente et accablante. « Écrasèrent » rend l’intensification après « frappèrent » sans affirmer explicitement une extermination totale.
- source_word: עַד הַחָרְמָה
  choice: jusqu’à Horma
  rationale: עַד indique la limite de la déroute; « jusqu’à » est la formulation française naturelle. Le toponyme est translittéré plutôt que traduit.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La coordination verbale reste vive et concise; « région montagneuse » évite l’ambiguïté de « montagne » pour un territoire de hauts reliefs.
