  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: fr
  text: Moïse adressa ces paroles à tous les Israélites, et le peuple fut dans un très grand deuil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: rapporta
  rationale: Dans ce contexte, Moïse communique au peuple les paroles divines qui précèdent. « Rapporta » exprime naturellement cette transmission en français, sans ajouter la solennité de « proclama ».
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: דְּבָרִים peut désigner des paroles, des choses ou des affaires. Ici, il renvoie au jugement divin que Moïse vient de recevoir; « ces paroles » en conserve le caractère verbal.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: à tous les Israélites
  rationale: בְּנֵי יִשְׂרָאֵל est ici le nom collectif usuel du peuple. « Tous les Israélites » est précis, inclusif et naturel en français moderne; le calque « tous les fils d’Israël » pourrait laisser croire que seuls les hommes sont visés.
- source_word: וַיִּתְאַבְּלוּ
  choice: prit un très grand deuil
  rationale: Le hitpael de אבל exprime l’entrée collective dans le deuil. La locution « prendre le deuil » conserve cette nuance plus précisément que le simple verbe « s’attrister ».
- source_word: הָעָם
  choice: le peuple
  rationale: עָם désigne ici la communauté d’Israël comme corps collectif; « le peuple » est l’équivalent français direct et naturel.
- source_word: מְאֹד
  choice: très grand
  rationale: מְאֹד intensifie fortement le deuil. Dans la tournure retenue, « un très grand deuil » rend cette force dans un français courant et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation privilégie la clarté collective de « Israélites » et rend l’aspect d’entrée dans le deuil par « prit un très grand deuil ».
