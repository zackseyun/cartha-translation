source:
  edition: WLC
  text: וְ/הָֽ/עֲמָלֵקִ֥י וְ/הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּ/עֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּ/סְע֥וּ לָ/כֶ֛ם הַ/מִּדְבָּ֖ר דֶּ֥רֶךְ יַם סֽוּף־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: fr
  text: Les Amalécites et les Cananéens habitent dans la vallée. Demain, changez de direction et partez vers le désert par la route de la mer Rouge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « mer des Roseaux ». Traduction traditionnelle : « mer Rouge ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי
  choice: Les Amalécites
  rationale: Le gentilé singulier avec l’article a un sens collectif; le pluriel désigne naturellement l’ensemble du peuple en français.
- source_word: וְהַכְּנַעֲנִי
  choice: et les Cananéens
  rationale: Comme le terme précédent, le gentilé singulier articulé est collectif et se rend naturellement au pluriel.
- source_word: יוֹשֵׁב
  choice: habitent
  rationale: Le participe exprime ici une résidence continue; « habitent » est clair, actuel et fidèle à cette valeur durative.
- source_word: בָּעֵמֶק
  choice: dans la vallée
  rationale: עֵמֶק désigne une vallée ou une région basse; « vallée » est le rendu le plus direct dans ce contexte.
- source_word: מָחָר
  choice: Demain
  rationale: L’adverbe indique le jour suivant et se traduit directement par « demain ».
- source_word: פְּנוּ
  choice: changez de direction
  rationale: L’impératif de פנה ordonne de se tourner ou de modifier sa direction. Cette formulation évite d’ajouter explicitement l’idée de retour, que le contexte peut suggérer mais que le verbe seul n’impose pas.
- source_word: וּסְעוּ
  choice: et partez
  rationale: Dans un contexte de déplacement, נסע signifie lever le camp et se mettre en route; « partez » transmet naturellement cet ordre.
- source_word: לָכֶם
  choice: partez
  rationale: Le datif éthique ou d’intérêt renforce l’implication des destinataires. Une traduction littérale comme « pour vous-mêmes » serait lourde en français; l’impératif direct conserve naturellement la force de l’ordre.
- source_word: הַמִּדְבָּר
  choice: vers le désert
  rationale: מִדְבָּר désigne une région sauvage et aride. « Désert » est le terme français courant dans ce cadre géographique, sans imposer l’image exclusive d’une étendue de sable.
- source_word: דֶּרֶךְ יַם סוּף
  choice: par la route de la mer Rouge
  rationale: דֶּרֶךְ indique l’itinéraire ou la direction. « Mer Rouge » conserve l’appellation traditionnelle et familière, tandis que le sens plus littéral de יַם סוּף est signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les noms de peuples sont au pluriel collectif. La syntaxe impérative reste directe, et « changez de direction » préserve la portée du verbe hébreu sans expliciter indûment un retour en arrière.
