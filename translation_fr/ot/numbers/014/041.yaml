id: NUM.14.41
reference: Numbers 14:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: fr
  text: 'Mais Moïse dit : « Pourquoi donc transgressez-vous l’ordre de Yahweh[a] ? Cela ne réussira pas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la bouche de Yahweh » ; expression qui désigne ce que Yahweh a dit ou ordonné. On pourrait aussi traduire : « la parole de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Cela ne prospérera pas. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Moïse dit
  rationale: Le waw narratif fait avancer le récit, tandis que « Mais » exprime naturellement ici le contraste entre l’intention du peuple et l’avertissement de Moïse.
- source_word: לָמָה זֶּה
  choice: Pourquoi donc
  rationale: « donc » restitue la nuance emphatique de זֶּה avec לָמָה sans produire une tournure artificielle en français.
- source_word: אַתֶּם עֹבְרִים
  choice: transgressez-vous
  rationale: Avec « la bouche/l’ordre de Yahweh » pour complément, עֹבְרִים désigne le fait d’enfreindre une parole contraignante, non un déplacement matériel.
- source_word: אֶת פִּי יְהוָה
  choice: l’ordre de Yahweh
  rationale: Littéralement « la bouche de Yahweh » ; l’expression désigne ici ce que Yahweh a dit et ordonné. « l’ordre » convient au contexte immédiat de désobéissance.
- source_word: וְהִוא
  choice: Cela
  rationale: Le pronom féminin renvoie probablement à l’entreprise ou à l’action projetée, implicite dans le contexte. « Cela » conserve cette référence sans la préciser indûment.
- source_word: לֹא תִצְלָח
  choice: ne réussira pas
  rationale: Le verbe צלח exprime ici la réussite d’une entreprise. Cette formulation est claire et idiomatique en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom divin personnel plutôt que de le remplacer par un titre.
- issue: Référent de וְהִוא
  choice: Cela, c’est-à-dire l’entreprise projetée
  alternative: Vous ne réussirez pas
  rationale: Le féminin singulier renvoie vraisemblablement à l’action militaire envisagée. Une formulation impersonnelle préserve cette référence implicite et évite de transformer le sujet grammatical en « vous ».
translation_notes:
  register: Français international moderne, naturel et digne. L’inversion « transgressez-vous » maintient le ton solennel de la question sans archaïsme marqué. Les marqueurs [a] et [b] figurent dans le texte à l’endroit correspondant.
