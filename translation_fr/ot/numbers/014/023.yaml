  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: fr
  text: ils ne verront certainement pas[a] le pays au sujet duquel j’ai juré à leurs pères[b], et aucun de ceux qui me méprisent ne le verra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « s’ils voient le pays ». Dans cette formule de serment, le sens est une négation emphatique : « ils ne verront certainement pas le pays ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « leurs ancêtres ». L’hébreu dit littéralement : « leurs pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: ils ne verront certainement pas
  rationale: Dans cette formule de serment, אִם introduit une négation solennelle et emphatique, et non une véritable condition. Le français explicite donc la négation.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, le terme désigne le territoire promis à Israël. « Le pays » est naturel en français et conserve l’expression biblique.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָם
  choice: que j’ai juré de donner à leurs pères
  rationale: Le verbe exprime un engagement sous serment. L’ajout de « de donner », implicite dans la construction hébraïque et son contexte, produit une formulation française claire sans modifier le contenu de la promesse.
- source_word: מְנַאֲצַי
  choice: ceux qui me méprisent
  rationale: Le participe désigne ceux qui traitent Dieu avec mépris ou le rejettent avec insolence. « Méprisent » est direct, digne et laisse au participe sa portée non limitée à un moment précis.
- source_word: לֹא יִרְאוּהָ
  choice: aucun … ne le verra
  rationale: Le pronom renvoie au pays. La tournure avec « aucun » rend naturellement en français la combinaison de וְכָל avec la négation, tout en conservant la répétition du verbe « voir ».
theological_decisions:
- issue: Valeur de la formule de serment initiale
  choice: 'La rendre par une négation emphatique : « ils ne verront certainement pas »'
  alternative: 'Traduire littéralement : « s’ils voient le pays »'
  rationale: Dans ce contexte de déclaration divine sous serment, la construction hébraïque exprime une exclusion certaine. Une condition littérale masquerait la force du jugement.
- issue: Traduction de אָבוֹת
  choice: « leurs pères » dans le texte principal
  alternative: « leurs ancêtres »
  rationale: L’hébreu emploie explicitement le terme masculin « pères », qui renvoie ici aux pères fondateurs d’Israël. La note signale l’équivalent français plus général sans neutraliser le texte principal.
translation_notes:
  register: Français international moderne, clair et solennel. Le futur simple convient au caractère judiciaire de la déclaration. « Certainement » restitue l’emphase de la formule de serment, tandis que « aucun de ceux qui me méprisent » évite une construction négative ambiguë.
