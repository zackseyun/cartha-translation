id: NUM.14.24
reference: Numbers 14:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: fr
  text: Mais mon serviteur Caleb, parce qu’un autre esprit était avec lui[a] et qu’il m’a suivi sans réserve[b], je le ferai entrer dans le pays où il est allé, et sa descendance en prendra possession[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il était animé d’un esprit différent »; il peut s’agir de dispositions ou d’une attitude différentes de celles du reste d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il a rempli derrière moi », expression hébraïque signifiant qu’il a suivi le Seigneur pleinement, de tout cœur.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « sa descendance en héritera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי
  choice: Mais mon serviteur
  rationale: Le waw marque ici le contraste avec la génération incrédule mentionnée dans le contexte. « Serviteur » exprime naturellement la relation de Caleb à Dieu sans mettre l’accent sur un statut servile.
- source_word: כָלֵב
  choice: Caleb
  rationale: Forme française traditionnelle du nom propre.
- source_word: עֵקֶב
  choice: parce que
  rationale: Introduit clairement la raison du traitement favorable réservé à Caleb.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: un autre esprit était avec lui
  rationale: Rendu proche de la syntaxe hébraïque, qui préserve l’ambiguïté de רוּחַ et n’en fait pas explicitement une simple attitude ni une désignation de l’Esprit de Dieu.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: il m’a suivi sans réserve
  rationale: L’expression idiomatique hébraïque signifie suivre pleinement ou de tout cœur. « Sans réserve » est naturel en français et exprime une adhésion entière.
- source_word: וַהֲבִיאֹתִיו
  choice: je le ferai entrer
  rationale: Le parfait à valeur déclarative exprime ici une action promise. Le causatif de בוא est rendu par « faire entrer ».
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: dans le pays où il est allé
  rationale: Cette formulation suit directement l’indication spatiale de l’hébreu et renvoie au déplacement antérieur de Caleb dans le pays.
- source_word: וְזַרְעוֹ
  choice: et sa descendance
  rationale: « Descendance » rend naturellement le sens collectif de זֶרַע en français moderne.
- source_word: יוֹרִשֶׁנָּה
  choice: en prendra possession
  rationale: ירשׁ peut signifier hériter de ou prendre possession d’un territoire. Cette formulation convient au contexte de la terre promise tout en conservant l’idée d’acquisition effective.
theological_decisions:
- issue: Sens de « un autre esprit » chez Caleb
  choice: Conserver la formulation large « un autre esprit était avec lui »
  alternative: « Il était animé d’un autre esprit » ou référence explicite à l’Esprit de Dieu
  rationale: רוּחַ peut désigner l’esprit, les dispositions intérieures ou l’attitude. Le texte n’identifie pas explicitement cet esprit à l’Esprit saint; la traduction préserve donc cette ouverture.
- issue: Nature de la fidélité de Caleb
  choice: « il m’a suivi sans réserve »
  alternative: « il m’a suivi pleinement » ou « de tout son cœur »
  rationale: Le rendu exprime la fidélité entière indiquée par l’idiome sans ajouter une terminologie doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu lorsque cela préserve une ambiguïté significative; l’idiome opaque וימלא אחרי est rendu en français courant. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
