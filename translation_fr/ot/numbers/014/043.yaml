source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: fr
  text: Car les Amalécites et les Cananéens sont là, devant vous, et vous tomberez sous l’épée. Puisque vous avez cessé de suivre Yahweh, Yahweh ne sera pas avec vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’avertissement formulé au verset précédent.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: les Amalécites et les Cananéens
  rationale: Les deux gentilés sont morphologiquement singuliers mais employés collectivement; le pluriel est naturel en français.
- source_word: שָׁם לִפְנֵיכֶם
  choice: sont là, devant vous
  rationale: Cette formulation conserve à la fois l’indication de lieu שָׁם et la relation spatiale exprimée par לִפְנֵיכֶם.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: et vous tomberez sous l’épée
  rationale: « Tomber sous l’épée » est une expression française naturelle qui garde l’image du verbe נפל et indique une mort violente au combat.
- source_word: כִּי עַל כֵּן
  choice: Puisque
  rationale: La locution introduit la cause de la défaite annoncée; « puisque » rend clairement ce lien sans reproduire lourdement les éléments hébreux.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: vous avez cessé de suivre Yahweh
  rationale: Le choix préserve l’image de la marche à la suite de Yahweh tout en exprimant idiomatiquement le fait de s’en être détourné.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: Yahweh ne sera pas avec vous
  rationale: La formulation conserve directement le motif de la présence divine, sans explicitation doctrinale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte le tétragramme comme nom propre; « Yahweh » le représente directement et évite de le remplacer par un titre.
- issue: Portée de la présence divine
  choice: Yahweh ne sera pas avec vous
  alternative: Yahweh ne vous soutiendra pas
  rationale: Le rendu littéral préserve la richesse et la tension de l’expression de présence sans la réduire à la seule aide militaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’enchaînement causal hébreu, avec une ponctuation qui évite une phrase excessivement chargée. Aucun marqueur de note n’est requis.
