  text: וַ/יִּלֹּ֨נוּ֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם כָּל הָ/עֵדָ֗ה לוּ מַ֨תְנוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּ/מִּדְבָּ֥ר הַ/זֶּ֖ה לוּ מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: fr
  text: 'Tous les Israélites murmurèrent contre Moïse et Aaron, et toute la communauté leur dit : « Si seulement nous étions morts en Égypte ! Ou si seulement nous étions morts dans ce désert ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: se plaignirent
  rationale: Le verbe לון décrit ici une plainte collective dirigée contre les responsables. « Se plaignirent » est naturel en français moderne et garde la force contestataire du contexte.
- source_word: עַל
  choice: de
  rationale: Avec « se plaindre », le français idiomatique désigne la personne visée par « se plaindre de quelqu’un ». La portée hostile envers Moïse et Aaron demeure claire dans le contexte.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: tous les fils d’Israël
  rationale: Cette formulation conserve l’expression masculine et nationale de l’hébreu, tout en restant compréhensible en français biblique moderne.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: Dans les Nombres, עֵדָה désigne collectivement la communauté d’Israël. « Communauté » est courant, digne et moins susceptible que « assemblée » de suggérer seulement une réunion ponctuelle.
- source_word: לוּ
  choice: si seulement
  rationale: Cette locution exprime clairement le souhait irréalisé et le regret, sans archaïsme.
- source_word: מַתְנוּ / מָתְנוּ
  choice: nous étions morts
  rationale: Après « si seulement », l’indicatif plus-que-parfait exprime naturellement en français un souhait contrefactuel portant sur le passé.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: en Égypte
  rationale: « En Égypte » rend idiomatiquement le nom de pays précédé de אֶרֶץ, sans perte de sens géographique en français.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: dans ce désert
  rationale: « Désert » est le terme courant en français pour le מִדְבָּר de l’itinéraire d’Israël et convient au cadre géographique du récit.
theological_decisions:
- issue: Désignation nationale genrée dans בְּנֵי יִשְׂרָאֵל
  choice: tous les fils d’Israël
  alternative: tous les Israélites
  rationale: Le texte hébreu emploie littéralement le pluriel masculin « fils d’Israël ». Le conserver maintient la forme de la désignation nationale sans nier que l’ensemble de la communauté est concerné.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « si seulement nous étions morts » est conservée pour rendre l’intensité rhétorique de la plainte hébraïque.
