review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris la double formulation du souhait irréel. Toutefois, « se plaindre de » atténue la direction hostile de עַל après לון; « murmurer contre » la restitue plus exactement. « Fils d’Israël » calque une désignation nationale hébraïque idiomatique, qui ne vise pas exclusivement les hommes; « Israélites » est donc plus exact en français sans perte de sens.
  naturalness: Le passé simple et la répétition de « Si seulement nous étions morts » conviennent au registre biblique moderne. « Tous les Israélites » est nettement plus naturel et idiomatique que « tous les fils d’Israël » dans ce contexte.
  terminology: « Communauté » rend bien עֵדָה. « Désert » est une traduction française établie et naturelle de מִדְבָּר ici. Les noms Moïse, Aaron et Égypte sont corrects.
  issues:
  - severity: medium
    issue: « se plaignirent de Moïse et d’Aaron »
    rationale: La construction française est possible, mais elle peut désigner le sujet d’une plainte plutôt qu’une opposition dirigée contre les chefs. Le contexte et עַל appellent plus précisément « murmurèrent contre ».
  - severity: medium
    issue: « Tous les fils d’Israël »
    rationale: Dans cette locution fixe, בְּנֵי יִשְׂרָאֵל est une désignation collective du peuple, non une restriction aux personnes de sexe masculin. « Tous les Israélites » rend le référent réel et respecte l’usage français moderne.
  revised_text: 'Tous les Israélites murmurèrent contre Moïse et Aaron, et toute la communauté leur dit : « Si seulement nous étions morts en Égypte ! Ou si seulement nous étions morts dans ce désert ! »'
