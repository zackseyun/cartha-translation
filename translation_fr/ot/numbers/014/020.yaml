source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: fr
  text: 'Yahweh dit : « J’ai pardonné, conformément à ta parole[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme tu l’as demandé » ; littéralement : « selon ta parole ».'
    reason: La formule כִּדְבָרֶךָ peut désigner la parole prononcée par Moïse et, dans ce contexte, sa demande d’intercession.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple rend naturellement cette progression narrative sans qu’il soit nécessaire d’ajouter une conjonction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: סָלַחְתִּי
  choice: J’ai pardonné
  rationale: Le verbe סלח exprime le pardon. Le passé composé présente ici l’acte comme accompli et pertinent dans la situation présente.
- source_word: כִּדְבָרֶךָ
  choice: conformément à ta parole
  rationale: Cette formulation conserve la valeur de la préposition כ et du nom דָּבָר, tout en reliant clairement le pardon à la demande formulée par Moïse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Portée du pardon annoncé
  choice: Ne pas préciser davantage l’étendue du pardon dans ce verset
  alternative: Expliciter un pardon total ou une absence de conséquences
  rationale: La déclaration affirme le pardon en réponse à Moïse, tandis que les versets suivants maintiennent des conséquences judiciaires. La traduction ne doit pas résoudre cette tension en ajoutant une précision absente de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Pardonné » est naturel dans le contexte tout en conservant la portée théologique du verbe. La tournure « conformément à ta parole » garde la structure de l’hébreu sans devenir obscure.
