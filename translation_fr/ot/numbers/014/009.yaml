source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: fr
  text: Seulement, ne vous révoltez pas contre Yahweh. N’ayez pas peur du peuple du pays, car ils sont notre pain[a]. Leur protection s’est éloignée d’eux[b], et Yahweh est avec nous. N’ayez pas peur d’eux !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils sont notre nourriture ». Littéralement : « ils sont notre pain », image qui évoque une conquête facile ou le fait d’être dévorés au sens figuré.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur ombre s’est retirée d’au-dessus d’eux ». Ici, l’« ombre » évoque probablement un abri ou une protection.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Seulement
  rationale: 'La particule introduit ici une restriction ou une insistance forte : la condition décisive est de ne pas se révolter contre Yahweh.'
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: ne vous révoltez pas contre Yahweh
  rationale: Avec le verbe מרד, la préposition בְּ désigne celui contre qui la révolte est dirigée. Le nom divin est translittéré « Yahweh » afin de rendre le tétragramme présent dans le texte source.
- source_word: אַל תִּירְאוּ אֶת־עַם הָאָרֶץ
  choice: n’ayez pas peur du peuple du pays
  rationale: Cette formulation directe conserve l’expression hébraïque « peuple du pays » ainsi que l’exhortation face aux habitants ennemis.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: car ils seront notre pain
  rationale: La métaphore vive du pain est conservée. Le futur idiomatique français exprime ici la perspective de conquête annoncée, sans développer explicitement l’image en « nous les dévorerons ».
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: Leur protection s’est retirée de dessus eux
  rationale: צֵל signifie littéralement « ombre », mais désigne ici vraisemblablement un abri ou une protection. « De dessus eux » préserve l’image spatiale de מֵעֲלֵיהֶם.
- source_word: וַיהוָה אִתָּנוּ
  choice: tandis que Yahweh est avec nous
  rationale: Le lien contextuel oppose la protection retirée aux adversaires à la présence de Yahweh auprès d’Israël. « Tandis que » rend naturellement ce contraste sans en modifier le contenu.
- source_word: אַל תִּירָאֻם
  choice: N’ayez pas peur d’eux !
  rationale: La répétition finale de l’interdiction est maintenue pour conserver l’insistance rhétorique de l’hébreu.
theological_decisions:
- issue: Métaphore de conquête dans כִּי לַחְמֵנוּ הֵם
  choice: 'Conserver l’image : « ils seront notre pain »'
  alternative: « ils seront notre nourriture » ou « nous les dévorerons »
  rationale: Le texte présente les habitants comme du pain, image suggérant une conquête facile ou leur consommation symbolique. La conserver évite de réduire l’ambiguïté et la force de la formule.
- issue: Sens métaphorique de צִלָּם
  choice: Traduire « leur protection » dans le texte principal
  alternative: « leur ombre » ou « leur abri »
  rationale: Dans ce contexte, l’ombre représente vraisemblablement ce qui protège. Le sens est rendu clairement, tandis que l’image littérale est signalée en note.
- issue: Rapport entre la disparition de leur protection et la présence divine
  choice: Ne pas identifier explicitement leur protection à une divinité ou à Yahweh
  alternative: Interpréter l’ombre comme leur dieu tutélaire ou comme la faveur divine
  rationale: L’hébreu ne précise pas l’identité de cette protection. La traduction maintient cette réserve et juxtapose simplement son retrait à la présence de Yahweh auprès d’Israël.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le vouvoiement pluriel correspond à l’adresse au peuple. La répétition finale est volontairement conservée, ainsi que l’image concrète du pain. Le nom divin est rendu par « Yahweh » conformément au texte hébreu fourni et à la couche de consultation anglaise.
