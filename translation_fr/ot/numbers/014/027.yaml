  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: fr
  text: Jusqu’à quand supporterai-je cette communauté mauvaise[a], qui récrimine contre moi ? J’ai entendu les récriminations des fils d’Israël[b], récriminations qu’ils dirigent contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assemblée » pour « communauté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « enfants d’Israël » ou « Israélites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Cette tournure idiomatique française conserve la question temporelle et l’exaspération exprimées en hébreu.
- source_word: לָעֵדָה
  choice: cette communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël; « communauté » est naturel en français moderne et garde le sens collectif.
- source_word: הָרָעָה הַזֹּאת
  choice: mauvaise
  rationale: L’adjectif porte ici un jugement moral sévère. « Mauvaise » conserve ce jugement sans introduire une nuance doctrinale étrangère.
- source_word: מַלִּינִים
  choice: récriminer
  rationale: Dans les récits du désert, le verbe désigne des plaintes répétées et hostiles. « Récriminer contre » rend clairement cette opposition en français actuel.
- source_word: עָלַי
  choice: contre moi
  rationale: 'La préposition a ici une valeur adversative: les récriminations sont dirigées contre Dieu.'
- source_word: תְּלֻנּוֹת
  choice: récriminations
  rationale: Le nom désigne des plaintes exprimées avec mécontentement; ce choix permet aussi de conserver la répétition lexicale avec le verbe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction formelle reproduit l’expression hébraïque masculine et son lien traditionnel avec le nom d’Israël; une formulation collective plus idiomatique est signalée en note.
- source_word: שָׁמָעְתִּי
  choice: J’ai entendu
  rationale: Le passé composé exprime naturellement en français l’action accomplie dont le résultat demeure pertinent dans la déclaration présente.
theological_decisions:
- issue: Ellipse dans la question עַד מָתַי לָעֵדָה ... אֲשֶׁר הֵמָּה מַלִּינִים עָלָי
  choice: Jusqu’à quand cette communauté mauvaise récriminera-t-elle contre moi ?
  alternative: Jusqu’à quand supporterai-je cette communauté mauvaise qui récrimine contre moi ?
  rationale: L’hébreu ne formule pas explicitement un verbe équivalent à « supporter ». La traduction retenue évite de l’ajouter et suit le sens rendu explicite par la proposition relative, tout en reconnaissant l’ellipse de la construction.
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix conserve la forme masculine de l’expression hébraïque sans exclure que le groupe désigne collectivement le peuple; l’alternative idiomatique figure en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Récriminer » évite l’archaïsme possible de « murmurer » tout en gardant l’idée de plaintes répétées dirigées contre Dieu. La répétition « récriminations / récriminent » reflète délibérément la répétition hébraïque.
