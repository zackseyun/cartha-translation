  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: fr
  text: 'Puis il prononça son discours[a] et dit : « Lève-toi, Balak, et écoute ; prête-moi l’oreille, fils de Tsippor. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son oracle » ou « son proverbe ». Le mot hébreu מָשָׁל peut désigner une sentence de type proverbial ou une déclaration poétique solennelle ; ici, il introduit la proclamation élevée de Balaam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: il prononça son discours
  rationale: L’expression idiomatique introduit une déclaration solennelle et poétique. « Prononça » est naturel en français, tandis que « discours » conserve une certaine généralité sans imposer à מָשָׁל le sens plus précis d’« oracle » ou de « proverbe ».
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Formule narrative ordinaire introduisant le discours direct.
- source_word: קוּם
  choice: Lève-toi
  rationale: L’impératif s’adresse à Balak. Cette formulation est claire et soutenue sans être archaïque.
- source_word: וּשֲׁמָע
  choice: et écoute
  rationale: שׁמע signifie entendre ou écouter. « Écoute » convient à l’injonction et permet de maintenir le parallélisme avec le verbe suivant.
- source_word: הַאֲזִינָה עָדַי
  choice: prête-moi l’oreille
  rationale: Cette tournure française exprime l’écoute attentive indiquée par אזן et rend explicitement la direction vers le locuteur portée par עָדַי.
- source_word: בְּנוֹ צִפֹּר
  choice: fils de Tsippor
  rationale: Le patronyme est conservé littéralement, conformément à la forme solennelle de l’adresse hébraïque.
