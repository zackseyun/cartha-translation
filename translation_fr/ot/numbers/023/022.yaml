  text: אֵ֖ל מוֹצִיאָ֣/ם מִ/מִּצְרָ֑יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: fr
  text: Dieu les fait sortir d’Égypte ; il a la force de l’aurochs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a les cornes d’un aurochs ». Le mot hébreu rendu par « force » est difficile et peut évoquer les cornes saillantes de l’animal. L’« aurochs » peut aussi être rendu plus généralement par « bœuf sauvage » ; la « licorne » des traductions anciennes est moins probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici le sujet de la proposition. « Dieu » est la formulation française la plus directe, sans ajouter une nuance comme « le Dieu puissant ».
- source_word: מוֹצִיאָם
  choice: les fait sortir
  rationale: Le participe hiphil de יצא avec suffixe masculin pluriel présente Dieu comme celui qui fait sortir le peuple. Le présent conserve la vigueur poétique et peut évoquer l’Exode comme action caractéristique de Dieu.
- source_word: מִמִּצְרָיִם
  choice: d’Égypte
  rationale: Après « faire sortir », « d’Égypte » exprime naturellement en français le point de départ.
- source_word: כְּתוֹעֲפֹת
  choice: la puissance du
  rationale: Le nom pluriel rare תּוֹעֲפֹת évoque probablement la force, l’élévation ou les cornes saillantes de l’animal. « La puissance » donne un français naturel tout en laissant une note signaler l’image concrète possible des cornes.
- source_word: רְאֵם
  choice: buffle sauvage
  rationale: רְאֵם désigne vraisemblablement un grand bovidé sauvage, souvent identifié à l’aurochs. « Buffle sauvage » est accessible en français moderne et évite le traditionnel mais improbable « licorne ».
- source_word: לוֹ
  choice: il a
  rationale: Le suffixe hébreu est au masculin singulier. La formulation conserve ce changement du pluriel « les » au singulier « il », qui présente probablement Israël collectivement, sans le lisser en pluriel.
theological_decisions:
- issue: Référent du pronom singulier לוֹ
  choice: Conserver le singulier « il »
  alternative: « ils ont » ou « Dieu a pour lui »
  rationale: Le texte massorétique passe du suffixe pluriel de מוֹצִיאָם au suffixe singulier לוֹ. Le singulier peut désigner Israël comme une entité collective. Le conserver respecte l’ambiguïté grammaticale et évite d’imposer un autre référent.
- issue: Image de רְאֵם
  choice: buffle sauvage
  alternative: aurochs ; licorne
  rationale: Le passage évoque la force d’un bovidé sauvage, non une créature mythologique. « Aurochs » est zoologiquement plus précis mais moins immédiatement accessible ; « licorne » relève surtout d’une ancienne tradition de traduction.
- issue: Sens de תּוֹעֲפֹת
  choice: puissance
  alternative: cornes
  rationale: Le terme est difficile et peut évoquer soit la puissance élevée de l’animal, soit plus concrètement ses cornes. Le texte principal privilégie une expression française claire, tandis que la note préserve l’autre possibilité et l’image animale.
translation_notes:
  register: Français international moderne, poétique mais direct. Le présent rend la vigueur du participe hébreu. Le passage du pluriel « les » au singulier « il » est volontairement maintenu afin de respecter le texte massorétique et son possible emploi collectif d’Israël.
