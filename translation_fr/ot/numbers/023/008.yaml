  terminology: « Dieu » pour אֵל et « Yahweh » pour יהוה respectent la distinction présente dans l’hébreu. « Maudire » est exact pour קבב. « S’indigner » est un choix prudent et lexicalement justifiable pour זעם; la note signale correctement l’alternative d’une expression hostile telle que la dénonciation ou l’imprécation.
