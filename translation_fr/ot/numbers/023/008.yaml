  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: fr
  text: 'Comment maudirais-je celui que Dieu n’a pas maudit ?

    Comment m’indignerais-je contre celui contre qui Yahweh ne s’est pas indigné ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Comment dénoncerais-je celui que Yahweh n’a pas dénoncé ? » Le verbe hébreu de cette ligne peut mettre l’accent soit sur l’indignation, soit sur son expression sous forme de dénonciation ou d’imprécation.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶקֹּב
  choice: Comment maudirais-je
  rationale: Dans cette question rhétorique, מָה exprime l’impossibilité plutôt qu’une demande d’information. Le conditionnel français rend naturellement cette force, et « maudire » correspond au verbe employé dans le contexte de l’oracle de Balaam.
- source_word: לֹא קַבֹּה אֵל
  choice: celui que Dieu n’a pas maudit
  rationale: La répétition de « maudire » conserve la correspondance lexicale avec אֶקֹּב. אֵל est rendu par le titre courant « Dieu ».
- source_word: וּמָה אֶזְעֹם
  choice: Comment m’indignerais-je contre
  rationale: זעם peut désigner l’indignation ou son expression hostile. La tournure pronominale « s’indigner contre » conserve ici le sens affectif sans l’aplatir en une simple répétition de « maudire ».
- source_word: לֹא זָעַם יְהוָה
  choice: celui contre qui Yahweh ne s’est pas indigné
  rationale: La même expression française qu’au premier membre de la ligne maintient le lien lexical entre אֶזְעֹם et זָעַם. Le nom divin יְהוָה est translittéré « Yahweh », distinctement de אֵל, « Dieu ».
theological_decisions:
- issue: Distinction entre les noms divins אֵל et יְהוָה
  choice: « Dieu » pour אֵל et « Yahweh » pour יְהוָה
  alternative: Employer « Dieu » dans les deux lignes, ou substituer « le Seigneur » à יְהוָה
  rationale: L’hébreu varie délibérément les désignations divines dans le parallélisme. La traduction conserve cette distinction et rend le tétragramme comme nom propre.
- issue: Portée du verbe זעם
  choice: Exprimer l’indignation dans le texte principal
  alternative: Traduire par « dénoncer », « réprouver » ou « lancer des imprécations contre »
  rationale: Le verbe peut viser l’indignation elle-même ou son expression sous forme de dénonciation. Le texte principal retient le sens affectif fondamental, tandis que la note signale la valeur d’acte verbal hostile.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux questions parallèles emploient le conditionnel pour exprimer l’impossibilité rhétorique. La répétition de « celui » explicite sobrement la personne visée, implicite dans la seconde ligne hébraïque.
