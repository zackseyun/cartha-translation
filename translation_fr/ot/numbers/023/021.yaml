  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: fr
  text: Il n’a pas considéré le malheur en Jacob, ni vu la détresse en Israël.[a] Yahweh, son Dieu, est avec lui, et l’acclamation d’un roi retentit parmi eux.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’a pas vu d’iniquité en Jacob, ni aperçu de perversité en Israël. » Les deux termes hébreux peuvent évoquer soit le mal moral, soit le malheur, la peine ou la détresse.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « en lui »; Israël est présenté comme un collectif singulier plus tôt dans le verset.'
    reason: lexical_alternative
  - marker: c
    text: L’expression peut désigner une acclamation royale au milieu d’Israël et peut faire allusion à la présence de Yahweh comme roi, sans l’identifier explicitement.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: n’a pas considéré
  rationale: Le verbe exprime un regard attentif ou le fait de porter son regard sur quelque chose. « Considéré » le distingue de רָאָה dans le membre parallèle tout en restant naturel en français.
- source_word: אָוֶן
  choice: malheur
  rationale: Le terme peut désigner le mal moral, la perversité, la peine ou le malheur. Dans cette bénédiction, « malheur » exprime l’adversité sans faire du texte une affirmation explicite de l’absence de tout péché en Israël; l’autre lecture est conservée en note.
- source_word: רָאָה
  choice: vu
  rationale: Traduction directe du verbe courant « voir », en parallèle avec הִבִּיט.
- source_word: עָמָל
  choice: détresse
  rationale: Le mot peut désigner la peine, la souffrance, l’oppression ou le mal. « Détresse » maintient ici le champ de l’affliction tout en distinguant le terme de אָוֶן.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: en Jacob / en Israël
  rationale: La préposition est rendue localement, conformément au parallélisme poétique et à la représentation collective du peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהָיו / עִמּוֹ
  choice: son Dieu / avec lui
  rationale: Les suffixes hébreux sont masculins singuliers; Jacob-Israël est personnifié comme un être collectif singulier.
- source_word: תְרוּעַת מֶלֶךְ
  choice: l’acclamation d’un roi
  rationale: תְרוּעָה désigne un grand cri pouvant être joyeux, guerrier ou royal. Avec « roi », « acclamation » rend naturellement la nuance royale sans identifier explicitement ce roi.
- source_word: בּוֹ
  choice: parmi eux
  rationale: Littéralement « en lui », le suffixe renvoie à Israël comme collectif singulier. Le français idiomatique passe ici au pluriel collectif; la forme littérale est signalée en note.
theological_decisions:
- issue: Le verset affirme-t-il l’absence de péché moral en Israël, ou l’absence de malheur et de détresse constatés contre lui ?
  choice: Le texte principal retient le sens de malheur et de détresse.
  alternative: « Il n’a pas vu d’iniquité en Jacob, ni aperçu de perversité en Israël. »
  rationale: אָוֶן et עָמָל admettent des sens moraux aussi bien que des sens liés à l’affliction. Le contexte de bénédiction favorise le second, mais l’ambiguïté réelle est maintenue en note plutôt que résolue dogmatiquement.
- issue: L’identité du roi dans תְרוּעַת מֶלֶךְ
  choice: « un roi » reste indéterminé dans le texte.
  alternative: Comprendre l’expression comme une acclamation de Yahweh en tant que roi.
  rationale: La proximité de la présence de Yahweh peut suggérer sa royauté, mais l’hébreu ne formule pas explicitement cette identification.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, ainsi que la personnification singulière de Jacob-Israël dans « son Dieu » et « avec lui ». « Retentit » explicite idiomatiquement la présence sonore de l’acclamation sans en préciser excessivement la nature.
