  terminology: « Yahweh » suit la politique de translittération du nom divin. Les termes « malheur », « détresse » et « acclamation » sont naturels, ne surinterprètent pas le passage et préservent les ambiguïtés lexicales et royales pertinentes. Les notes sont bien ancrées et correspondent aux éléments auxquels elles se rapportent.
