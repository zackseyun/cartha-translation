source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: fr
  text: 'Balaam répondit à Balak : « Ne t’ai-je pas dit : “Tout ce que Yahweh dira, je le ferai” ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: La formule narrative hébraïque emploie littéralement deux verbes (« répondit et dit »). En français actuel, « répondit » exprime naturellement l’ensemble sans lourdeur.
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: Ne t’ai-je pas dit
  rationale: הֲלֹא introduit une question rhétorique qui attend une réponse affirmative. Dans ce contexte, « dire à » rend naturellement דּבר אֶל et le passé composé rappelle les paroles antérieures de Balaam.
- source_word: כֹּל אֲשֶׁר
  choice: Tout ce que
  rationale: Cette formulation conserve la portée globale de l’expression hébraïque tout en restant idiomatique.
- source_word: יְדַבֵּר יְהוָה
  choice: Yahweh dira
  rationale: L’inaccompli hébreu peut viser ce que Yahweh dira dans la circonstance envisagée. Le futur s’accorde naturellement avec « je le ferai » et préserve le caractère prospectif de l’engagement.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: je le ferai
  rationale: Le pronom « le » reprend le contenu de ce que Yahweh dira. Cette tournure française conserve clairement l’engagement exprimé par l’inaccompli à la première personne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de l’engagement de Balaam
  choice: Tout ce que Yahweh dira, je le ferai
  alternative: Tout ce que Yahweh dit, je le fais
  rationale: Le futur rend bien, dans le contexte immédiat, l’obligation prospective revendiquée par Balaam, sans ajouter l’idée explicite de nécessité (« je dois »), absente de la forme verbale.
translation_notes:
  register: Français international moderne, sobre et digne. La formule hébraïque littérale « répondit et dit » est ramenée à l’idiome naturel « répondit », tandis que la question rhétorique et la structure de l’engagement sont conservées.
