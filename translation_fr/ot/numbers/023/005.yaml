source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: fr
  text: 'Alors Yahweh mit une parole dans la bouche de Balaam et dit : « Retourne auprès de Balak, et tu parleras ainsi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et voici ce que tu diras. »'
    reason: Alternative idiomatique pour la formule hébraïque וְכֹה תְדַבֵּר, littéralement « et ainsi tu parleras ».
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: mit
  rationale: Le verbe שׂוּם signifie couramment « mettre, placer ». « Mit » conserve ici l’image concrète et naturelle de la parole placée dans la bouche.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: דָּבָר
  choice: une parole
  rationale: Le singulier hébreu désigne ici la parole ou le message donné à Balaam. « Une parole » respecte le nombre et l’idiome prophétique sans expliciter davantage.
- source_word: בְּפִי בִלְעָם
  choice: dans la bouche de Balaam
  rationale: Cette formulation conserve directement l’image hébraïque de la parole divine mise dans la bouche du porte-parole.
- source_word: וַיֹּאמֶר
  choice: et dit
  rationale: Le sujet demeure Yahweh, clairement indiqué dans la proposition précédente. Le français peut naturellement conserver le sujet implicite.
- source_word: שׁוּב אֶל בָּלָק
  choice: Retourne auprès de Balak
  rationale: שׁוּב exprime le retour. « Auprès de Balak » indique naturellement le retour à sa présence, sans archaïsme.
- source_word: וְכֹה תְדַבֵּר
  choice: et voici comment tu parleras
  rationale: כֹה signifie « ainsi/de cette manière » et תְדַבֵּר « tu parleras ». Cette tournure moderne conserve à la fois la manière prescrite et la force directive du futur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Nature de la parole donnée à Balaam
  choice: une parole
  alternative: un message
  rationale: Le singulier concret est maintenu sans décider si דָּבָר désigne une formule précise ou, plus largement, un message prophétique.
- issue: Force de וְכֹה תְדַבֵּר
  choice: et voici comment tu parleras
  alternative: et tu parleras ainsi
  rationale: Les deux lectures expriment la parole prescrite par Dieu. La formulation retenue est naturelle en français et ne précise pas ici le contenu, qui suit dans le récit.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative reste proche de l’hébreu, tandis que « voici comment » évite le tour plus soutenu « ainsi tu parleras ». Le marqueur [a] figure dans le texte principal.
