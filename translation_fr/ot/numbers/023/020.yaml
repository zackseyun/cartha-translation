  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: fr
  text: Voici, j’ai reçu mission de bénir[a] ; il a béni[b], et je ne peux pas l’annuler[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai reçu de bénir » ; l’hébreu ne précise pas ce qui a été reçu.'
    reason: lexical_alternative
  - marker: b
    text: Le sujet de « il a béni » n’est pas exprimé en hébreu ; le contexte indique Dieu.
    reason: alternative_reading
  - marker: c
    text: 'Ou : « je ne peux pas le faire revenir », « je ne peux pas revenir dessus ». Le verbe évoque littéralement l’action de faire revenir ou de ramener ; le pronom renvoie à la bénédiction implicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit solennellement l’affirmation et attire l’attention, dans un français actuel mais digne.
- source_word: בָרֵךְ לָקָחְתִּי
  choice: j’ai reçu la charge de bénir
  rationale: Le verbe לָקַחְתִּי signifie littéralement « j’ai pris/reçu », tandis que בָרֵךְ exprime ici l’action de bénir. « La charge » rend en français naturel le complément laissé implicite, sans préciser qu’il s’agit formellement d’un ordre.
- source_word: וּבֵרֵךְ
  choice: il a béni
  rationale: Le parfait masculin singulier a un sujet implicite. Le contexte désigne Dieu, mais le pronom maintient la concision et l’implicite de l’hébreu.
- source_word: אֲשִׁיבֶנָּה
  choice: je ne peux pas révoquer sa bénédiction
  rationale: Le hiphil de שׁוב signifie faire revenir ou ramener. Dans ce contexte, il s’agit de retirer ou d’annuler la bénédiction déjà prononcée ; « révoquer » conserve cette idée avec clarté.
theological_decisions:
- issue: Sujet implicite de « il a béni »
  choice: Conserver « il », Dieu étant indiqué par le contexte
  alternative: Expliciter « Dieu a béni » ou employer un sujet indéfini
  rationale: La forme verbale hébraïque ne nomme pas le sujet. Le contexte renvoie fortement à Dieu, mais le texte principal garde l’implicite de l’original.
- issue: Objet implicite de « j’ai reçu »
  choice: Rendre l’implicite par « la charge de bénir » et le signaler en note
  alternative: « J’ai reçu de bénir » ou « j’ai reçu l’ordre de bénir »
  rationale: La première solution serait peu naturelle en français, tandis que « l’ordre » préciserait davantage que ne le fait l’hébreu. « La charge » offre un équilibre entre fidélité et lisibilité.
- issue: Objet féminin suffixé dans אֲשִׁיבֶנָּה
  choice: L’identifier contextuellement à la bénédiction
  alternative: Employer une formule plus indéterminée comme « revenir là-dessus »
  rationale: Le suffixe féminin appelle un référent féminin implicite, très probablement la bénédiction. L’explicitation est nécessaire pour éviter en français une reprise ambiguë de « charge ».
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve la force introductive sans archaïsme excessif ; la syntaxe brève maintient le caractère sentencieux de l’oracle.
