  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: fr
  text: Il revint vers lui et voici qu’il se tenait debout près de son holocauste, lui avec tous les chefs de Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: Il revint vers lui
  rationale: Rend directement le mouvement de retour vers Balak, avec le pronom ambigu conservé comme dans l’hébreu.
- source_word: וְהִנֵּה
  choice: et le trouva
  rationale: Dans ce contexte narratif, exprime naturellement la découverte signalée par hinnēh sans recourir à l’interjection vieillie « voici ».
- source_word: נִצָּב עַל־עֹלָתוֹ
  choice: debout près de son holocauste
  rationale: « Debout » rend l’état marqué par נצב; « près de » transmet la relation spatiale de על sans suggérer qu’il se tenait physiquement sur l’offrande.
- source_word: שָׂרֵי מוֹאָב
  choice: les chefs de Moab
  rationale: « Chefs » est un équivalent moderne et large de שרים, désignant ici les dignitaires moabites.
theological_decisions:
- issue: Référents des pronoms masculins
  choice: Conserver les pronoms « il » et « lui » dans le texte
  alternative: Expliciter « Balaam revint vers Balak »
  rationale: L’hébreu emploie des pronoms dont les référents se déduisent du contexte; les expliciter dans ce verset ajouterait des noms absents du texte source.
translation_notes:
  register: Français moderne, narratif et digne. La tournure idiomatique « le trouva debout » évite le calque « et voici » tout en préservant l’effet de constat; le tiret anglais n’est pas nécessaire en français.
