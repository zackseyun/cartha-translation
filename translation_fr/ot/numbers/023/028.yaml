  text: וַ/יִּקַּ֥ח בָּלָ֖ק אֶת בִּלְעָ֑ם רֹ֣אשׁ הַ/פְּע֔וֹר הַ/נִּשְׁקָ֖ף עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: fr
  text: Puis Balak emmena Balaam au sommet du Péor, qui domine le désert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Yeshimôn » ; le terme hébreu peut être compris soit comme une désignation descriptive d’une région désertique, soit comme un nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Puis ... emmena
  rationale: Le waw consécutif fait avancer le récit. Dans ce déplacement vers un lieu, « emmena » rend naturellement le sens contextuel de לקח, sans alourdir la phrase.
- source_word: בָּלָק
  choice: Balak
  rationale: Nom personnel transcrit selon l’usage français établi.
- source_word: אֶת בִּלְעָם
  choice: Balaam
  rationale: La marque de l’objet direct n’est pas exprimée en français; le nom personnel suit la forme française consacrée.
- source_word: רֹאשׁ
  choice: au sommet
  rationale: Dans ce contexte topographique, רֹאשׁ désigne le sommet ou le point culminant d’une hauteur.
- source_word: הַפְּעוֹר
  choice: du Peor
  rationale: Le nom géographique est transcrit « Peor »; la tournure « sommet du Peor » restitue naturellement en français la présence de l’article hébreu.
- source_word: הַנִּשְׁקָף
  choice: qui domine
  rationale: Le participe niphal de שׁקף décrit une hauteur donnant sur une région. « Qui domine » exprime clairement cette relation topographique.
- source_word: עַל פְּנֵי
  choice: l’étendue
  rationale: L’expression signifie littéralement « sur la face de ». Dans la description d’un paysage, « l’étendue » préserve l’idée d’une surface déployée tout en restant idiomatique.
- source_word: הַיְשִׁימֹן
  choice: désertique
  rationale: יְשִׁימֹן peut désigner une région désolée ou fonctionner comme nom géographique. Le texte principal communique le sens descriptif, tandis que la note conserve l’autre possibilité.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation reste proche de la structure topographique de l’hébreu, tout en évitant le calque peu naturel « la face du désert ». Le marqueur [a] figure dans le texte principal.
