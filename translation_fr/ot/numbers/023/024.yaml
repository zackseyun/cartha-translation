id: NUM.23.24
reference: Numbers 23:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: fr
  text: Voici un peuple qui se lève comme une lionne[a] et se dresse comme un lion. Il ne se couchera pas avant d’avoir mangé sa proie et bu le sang de ceux qui ont été tués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un lion ». Le mot hébreu לָבִיא peut désigner le lion de manière générale; « lionne » permet toutefois de le distinguer du terme rendu par « lion » dans la suite du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Voici
  rationale: Interjection déictique qui introduit avec force une observation; « Voici » reste naturel et digne en français biblique moderne.
- source_word: עָם
  choice: un peuple
  rationale: Désigne collectivement Israël et reproduit plus directement le sens de l’hébreu que « une nation ».
- source_word: כְּלָבִיא
  choice: comme une lionne
  rationale: לָבִיא peut désigner un lion au sens général, mais « lionne » est possible dans la poésie et maintient une distinction lexicale avec אֲרִי dans le membre parallèle.
- source_word: יָקוּם
  choice: se lève
  rationale: Le qal inaccompli de קום évoque ici l’animal qui se met debout; « se lève » est concret et naturel.
- source_word: וְכַאֲרִי
  choice: comme un lion
  rationale: אֲרִי est le terme courant pour le lion; la traduction conserve le parallélisme sans ajouter une idée de taille ou d’âge.
- source_word: יִתְנַשָּׂא
  choice: se dresse
  rationale: Le hitpael de נשׂא décrit ici le mouvement ou l’allure imposante de l’animal; « se dresse » rend cette image avec naturel.
- source_word: לֹא יִשְׁכַּב
  choice: il ne se couchera pas
  rationale: L’inaccompli prend dans cet oracle une valeur future et conserve l’image concrète du fauve.
- source_word: עַד יֹאכַל טֶרֶף
  choice: avant d’avoir mangé sa proie
  rationale: Cette formulation française rend la construction négative avec עַד et traduit יֹאכַל par « manger » sans l’intensifier en « dévorer »; le possessif est idiomatique dans l’image.
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: et bu le sang de ceux qui ont été tués
  rationale: חֲלָלִים désigne couramment les personnes tuées dans un contexte violent ou militaire; la formulation explicite est claire en français actuel tout en gardant intacte l’image saisissante.
theological_decisions:
- issue: L’image violente dans l’oracle de Balaam
  choice: Conserver les images de la proie mangée et du sang bu comme représentation poétique d’une victoire militaire irrésistible.
  alternative: Atténuer le passage en parlant simplement de victoire ou de triomphe.
  rationale: L’hébreu emploie volontairement une image prédatrice très forte. La traduction ne doit ni l’adoucir ni la transformer en prescription de boire littéralement du sang.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste fluide à l’oral comme à l’écrit; les images concrètes et la tension du texte hébreu sont conservées sans archaïsme ni atténuation.
