  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: fr
  text: 'Dieu rencontra Balaam[a], et celui-ci lui dit : « J’ai disposé les sept autels et j’ai offert un taureau et un bélier sur l’autel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu vint à la rencontre de Balaam » ; le verbe hébreu désigne une rencontre et peut, dans certains contextes, comporter la nuance d’une rencontre qui survient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: vint à la rencontre de
  rationale: Le verbe קרה exprime ici une rencontre divine. Cette formulation française reste naturelle et rend l’idée d’une rencontre réelle sans suggérer qu’elle serait fortuite.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom est accompagné d’un verbe singulier et désigne ici le Dieu unique.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Translittération française traditionnelle et largement reconnue de ce nom propre.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: et celui-ci lui dit
  rationale: Le discours à la première personne montre que Balaam est le sujet de « dit ». « Celui-ci » lève l’ambiguïté pronominale sans alourdir la phrase.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: les sept autels
  rationale: Le groupe nominal défini renvoie aux sept autels précis déjà connus dans le contexte.
- source_word: עָרַכְתִּי
  choice: J’ai disposé
  rationale: ערך signifie mettre en ordre ou disposer. Le passé composé convient à une action achevée dont Balaam rend compte à Dieu.
- source_word: וָאַעַל
  choice: et j’ai offert
  rationale: Dans un contexte sacrificiel, עלה signifie idiomatiquement faire monter, donc offrir en sacrifice.
- source_word: פָּר
  choice: un taureau
  rationale: Équivalent français courant de פר dans un contexte sacrificiel, sans ajouter une précision d’âge absente du texte.
- source_word: וָאַיִל
  choice: et un bélier
  rationale: Équivalent français standard de אַיִל dans le vocabulaire sacrificiel.
- source_word: בַּמִּזְבֵּחַ
  choice: sur l’autel
  rationale: La traduction conserve le singulier défini de l’hébreu sans expliciter dans le corps du texte une éventuelle valeur distributive.
theological_decisions:
- issue: Nature de la rencontre divine exprimée par וַיִּקָּר
  choice: Présenter une véritable rencontre entre Dieu et Balaam sans suggérer le hasard
  alternative: « Dieu rencontra Balaam » ou, avec une nuance fortuite plus marquée, « Dieu tomba sur Balaam »
  rationale: La racine peut ailleurs comporter une nuance de circonstance ou de rencontre inopinée, mais le récit décrit ici une intervention divine. « Vint à la rencontre de » préserve l’idée de rencontre sans introduire une conception de l’action divine comme accidentelle.
- issue: Valeur du singulier בַּמִּזְבֵּחַ après la mention de sept autels
  choice: Conserver « sur l’autel »
  alternative: « sur chaque autel »
  rationale: Le contexte peut favoriser une compréhension distributive, mais le texte hébreu emploie le singulier défini. La traduction principale n’ajoute donc pas « chaque », qui résoudrait implicitement cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite l’ambiguïté sur le locuteur grâce à « celui-ci ». Le singulier « sur l’autel » est maintenu par fidélité formelle, tandis que la formulation de la rencontre reste idiomatique en français.
