source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: fr
  text: Dieu n’est pas un homme pour mentir, ni un fils d’homme[b] pour changer d’avis[a]. A-t-il dit et ne le fera-t-il pas ? A-t-il parlé et ne l’accomplira-t-il pas[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « revenir sur sa décision » ; traditionnellement, « se repentir ». Le verbe hébreu peut désigner un changement de conduite ou de décision, mais il est question ici de la fiabilité de Dieu, non d’un repentir moral.
    reason: lexical_alternative
  - marker: b
    text: Ici, « fils d’homme » est une expression hébraïque désignant un être humain, et non un titre messianique.
    reason: cultural_note
  - marker: c
    text: Ou « le confirmer » ou « le réaliser ». Littéralement, l’hébreu signifie « le faire tenir debout ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, אֵל désigne le Dieu d’Israël. « Dieu » exprime naturellement le contraste avec l’être humain.
- source_word: אִישׁ
  choice: un homme
  rationale: Ce choix conserve le terme concret du texte hébreu et son parallélisme avec « fils d’homme ».
- source_word: וִיכַזֵּב
  choice: pour mentir
  rationale: Le verbe כזב peut signifier mentir ou se montrer faux. Ici, « mentir » rend clairement le contraste entre la fiabilité de Dieu et l’inconstance humaine.
- source_word: בֶן אָדָם
  choice: un fils d’homme
  rationale: La traduction garde l’expression hébraïque et le parallélisme poétique. Dans ce passage, elle désigne simplement un être humain.
- source_word: וְיִתְנֶחָם
  choice: pour changer d’avis
  rationale: La forme de נחם évoque ici un changement d’intention ou le fait de revenir sur une décision. « Changer d’avis » est clair en français moderne et n’introduit pas l’idée trompeuse d’un repentir moral de Dieu.
- source_word: הַהוּא אָמַר
  choice: A-t-il dit quelque chose
  rationale: La formulation interrogative restitue la force rhétorique de l’hébreu. « Quelque chose » fournit en français l’objet sous-entendu repris dans la proposition suivante.
- source_word: יַעֲשֶׂה
  choice: sans le faire
  rationale: עשה signifie largement faire ou agir. Cette tournure française exprime naturellement que Dieu réalise ce qu’il a dit.
- source_word: וְדִבֶּר
  choice: A-t-il parlé
  rationale: « Parlé » rend directement דבר et maintient le parallélisme avec « dit ».
- source_word: יְקִימֶנָּה
  choice: sans l’accomplir
  rationale: Le hiphil de קום signifie littéralement faire tenir debout, d’où établir, confirmer ou accomplir. « Accomplir » exprime naturellement ici la réalisation effective de la parole prononcée, tandis qu’une note conserve l’image hébraïque.
theological_decisions:
- issue: Portée de וְיִתְנֶחָם dans l’affirmation sur Dieu
  choice: changer d’avis
  alternative: revenir sur sa décision ; se raviser ; se repentir
  rationale: Le verset affirme la fiabilité de Dieu par contraste avec l’inconstance humaine. Cette traduction garde la tension du langage biblique sans transformer le verset en énoncé philosophique plus large ni suggérer un repentir moral.
- issue: Sens de בֶן אָדָם
  choice: expression ordinaire désignant un être humain
  alternative: titre messianique
  rationale: Dans ce parallélisme poétique, l’expression renvoie à l’humanité en général et ne fonctionne pas comme un titre messianique.
- issue: Force de יְקִימֶנָּה
  choice: accomplir ce qui a été dit
  alternative: établir ou confirmer la parole
  rationale: Le contexte porte sur la fidélité de Dieu à exécuter sa parole. « Accomplir » communique cette force sans effacer, grâce à la note, l’image littérale de ce qui est rendu stable.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé par « homme / fils d’homme » et « dit / parlé », tandis que les deux dernières propositions sont formulées comme des questions rhétoriques idiomatiques en français.
