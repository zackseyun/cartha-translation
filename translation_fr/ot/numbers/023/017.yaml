review_pass:
  verdict: revise
  source_fidelity: 'Le projet introduit deux éléments absents de l’hébreu : « revint » interprète וַיָּבֹא (« vint »), et « vit que » transforme la particule présentative וְהִנּוֹ en perception de Balaam. Le texte dit que Balak se tenait près de son holocauste, avec les chefs de Moab auprès de lui; il ne dit pas que Balaam l’a vu ni ne présente les chefs comme des accompagnateurs au sens actif.'
  naturalness: La formulation révisée reste fluide en français international moderne. « Et voici » rend naturellement la valeur présentative sans attribuer une action de voir au sujet. « Les chefs de Moab étaient avec lui » évite l’ambiguïté possible de « accompagné des dignitaires ».
  terminology: « Yahweh » rend correctement le tétragramme. « Holocauste » est le terme biblique français établi pour עֹלָה, bien que « sacrifice consumé par le feu » soit explicatif; « holocauste » convient au registre narratif. « Chefs de Moab » restitue sobrement שָׂרֵי מוֹאָב sans surdéterminer leur statut dynastique.
  issues:
  - severity: medium
    issue: « Il revint auprès de lui »
    rationale: וַיָּבֹא אֵלָיו signifie littéralement « il vint auprès de lui ». Le contexte peut suggérer un retour, mais le verbe ne l’énonce pas; il convient de ne pas ajouter cette nuance.
  - severity: medium
    issue: « et vit que » pour וְהִנּוֹ
    rationale: La particule הנה attire l’attention sur la scène (« et voici »); elle n’exprime pas l’acte de voir de Balaam. La traduction proposée ajoute donc une action et efface l’effet présentatif.
  - severity: low
    issue: « accompagné des dignitaires de Moab »
    rationale: Cette tournure est possible, mais אִתּוֹ signifie simplement « avec lui » et le sujet de l’accompagnement peut rester légèrement ambigu. Une coordination explicite est plus proche du texte.
  revised_text: 'Il vint auprès de lui et voici, Balak se tenait près de son holocauste, et les chefs de Moab étaient avec lui. Balak lui demanda : « Qu’a dit Yahweh ? »'
