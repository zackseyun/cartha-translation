  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: fr
  text: 'Il vint auprès de lui et voici, Balak se tenait près de son holocauste, et les chefs de Moab étaient avec lui. Balak lui demanda : « Qu’a dit Yahweh ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: Il revint auprès de lui
  rationale: Le verbe בוא signifie littéralement « venir », mais le contexte immédiat indique que Balaam revient auprès de Balak. « Revint auprès de lui » exprime naturellement en français ce déplacement sans changer son référent.
- source_word: וְהִנּוֹ
  choice: et vit que
  rationale: La particule attire vivement l’attention sur la scène découverte à l’arrivée. En récit français moderne, « vit que » rend naturellement cette valeur présentative sans l’archaïsme de « voici ».
- source_word: נִצָּב עַל עֹלָתוֹ
  choice: se tenait près de son holocauste
  rationale: Le participe נִצָּב décrit une posture en cours, et עַל possède ici le sens spatial de « près de, auprès de ». « Holocauste » est le terme français consacré pour עֹלָה, sacrifice entièrement brûlé.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: accompagné des dignitaires de Moab
  rationale: שָׂרִים désigne des personnages exerçant autorité ou rang. « Dignitaires » convient au cadre politique et évite de suggérer nécessairement des fils de roi, tandis que « accompagné » restitue idiomatiquement אִתּוֹ.
- source_word: מַה דִּבֶּר יְהוָה
  choice: Qu’a dit Yahweh ?
  rationale: Le passé composé convient à une parole divine tout juste reçue et pertinente au moment de la question. « Dire » est ici plus naturel en français que « parler ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement fluidifiée afin d’éviter la répétition lourde des pronoms masculins, tout en identifiant explicitement Balak à partir du contexte immédiat.
