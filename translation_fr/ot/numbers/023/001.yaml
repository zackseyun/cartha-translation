  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: fr
  text: 'Alors Balaam dit à Balak : « Construis-moi ici sept autels et prépare-moi ici[a] sept taureaux et sept béliers. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie deux fois une expression qui signifie littéralement « en ce lieu »; elle est rendue par « ici » dans les deux cas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors … dit » restitue naturellement cette succession en français moderne.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Translittération française traditionnelle et largement reconnue du nom propre.
- source_word: אֶל בָּלָק
  choice: à Balak
  rationale: Dans l’introduction d’un discours, אֶל désigne ici le destinataire; « à Balak » est la formulation française idiomatique.
- source_word: בְּנֵה לִי
  choice: Construis-moi
  rationale: L’impératif de בנה signifie « construire », et לִי indique ici le bénéficiaire. La construction française avec pronom conjoint est directe et naturelle.
- source_word: בָּזֶה
  choice: ici
  rationale: L’expression signifie littéralement « en ce lieu / dans ceci » et possède ici une valeur déictique locale. « Ici » la rend naturellement; sa répétition est conservée.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: sept autels
  rationale: Traduction directe du syntagme numérique.
- source_word: וְהָכֵן לִי
  choice: et prépare-moi
  rationale: L’impératif causatif de כון exprime l’action de mettre à disposition ou de tenir prêts les animaux destinés au sacrifice. « Prépare-moi » est concis et idiomatique.
- source_word: שִׁבְעָה פָרִים
  choice: sept taureaux
  rationale: פָרִים désigne des bovins mâles employés dans un contexte sacrificiel. « Taureaux » est précis sans ajouter une indication d’âge absente du texte.
- source_word: וְשִׁבְעָה אֵילִים
  choice: et sept béliers
  rationale: אֵילִים désigne précisément des moutons mâles, donc des béliers.
