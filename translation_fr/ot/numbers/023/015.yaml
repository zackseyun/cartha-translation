source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל עֹלָתֶ֑/ךָ וְ/אָנֹכִ֖י אִקָּ֥רֶה כֹּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: fr
  text: 'Il dit à Balak : « Tiens-toi ici, près de ton holocauste, et moi, j’irai là-bas faire une rencontre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’irai là-bas pour rencontrer quelqu’un ». Le verbe hébreu est concis et ne précise pas explicitement qui Balaam rencontrera.
    reason: Préserver l’ambiguïté lexicale et l’absence de complément exprimé dans l’hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: Il dit à Balak
  rationale: Le wayyiqtol poursuit naturellement le récit. En français, le passé simple rend cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: הִתְיַצֵּב
  choice: Tiens-toi
  rationale: L’impératif hitpael exprime le fait de prendre position et de rester à l’endroit indiqué. « Tiens-toi » est naturel et suffisamment précis en français moderne.
- source_word: כֹּה
  choice: ici
  rationale: Dans ce contexte spatial, le premier כֹּה désigne l’endroit où Balak doit rester.
- source_word: עַל עֹלָתֶךָ
  choice: près de ton holocauste
  rationale: עַל peut marquer une position à côté de quelque chose ou auprès de celle-ci. עֹלָה désigne précisément un holocauste, sacrifice entièrement brûlé.
- source_word: וְאָנֹכִי
  choice: et moi
  rationale: 'Le pronom explicite met Balaam en contraste avec Balak : Balak reste ici, tandis que lui se rend ailleurs.'
- source_word: אִקָּרֶה
  choice: j’irai … à sa rencontre
  rationale: Le niphal de קרה est concis et évoque ici une rencontre attendue. La tournure française exprime idiomatiquement le déplacement suggéré par le contexte, tout en laissant la note signaler que le complément personnel n’est pas exprimé en hébreu.
- source_word: כֹּה
  choice: là-bas
  rationale: Le second כֹּה renvoie à un autre lieu et forme avec « ici » un contraste spatial clair.
theological_decisions:
- issue: Identité de la personne que Balaam compte rencontrer
  choice: Employer « sa rencontre » sans nommer Dieu dans le texte principal
  alternative: Dire « à la rencontre de Dieu » ou conserver une formulation sans complément personnel
  rationale: Le contexte du cycle de Balaam oriente vers une rencontre divine, mais ce verset ne nomme pas explicitement l’objet du verbe. Le pronom donne une phrase française naturelle sans introduire le nom divin dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le contraste déictique « ici / là-bas » est conservé, ainsi que l’accent porté par « et moi ». « Holocauste » est maintenu comme terme biblique courant désignant l’offrande entièrement brûlée.
