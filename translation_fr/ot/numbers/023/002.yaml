  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בִּלְעָ֑ם וַ/יַּ֨עַל בָּלָ֧ק וּ/בִלְעָ֛ם פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: fr
  text: Balak fit comme Balaam l’avait dit, et Balak et Balaam offrirent un taureau et un bélier sur l’autel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fit monter » ; dans le contexte des sacrifices, cette expression signifie « offrir » ou « offrir en sacrifice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר דִּבֶּר
  choice: fit ce que ... lui avait dit
  rationale: Cette tournure française exprime naturellement l’exécution des instructions données auparavant par Balaam. Le pronom « lui » explicite seulement la relation impliquée par le contexte.
- source_word: וַיַּעַל
  choice: offrirent
  rationale: Le hiphil de עלה, avec des animaux sacrificiels et un autel, est un terme cultuel signifiant faire monter une offrande, donc « offrir » en français courant.
- source_word: בָּלָק וּבִלְעָם
  choice: Balak et Balaam
  rationale: Les deux noms forment explicitement le sujet coordonné du verbe singulier hébreu, coordination que le français rend naturellement avec un verbe au pluriel.
- source_word: פָּר
  choice: un taureau
  rationale: פָּר désigne couramment un bovin mâle dans les contextes sacrificiels; « taureau » reste précis sans ajouter une indication d’âge absente du verset.
- source_word: וָאַיִל
  choice: et un bélier
  rationale: אַיִל est le terme usuel pour un bélier.
- source_word: בַּמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Dans ce contexte sacrificiel, la préposition בְּ se rend naturellement par « sur ».
