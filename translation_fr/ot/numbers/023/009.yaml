  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: fr
  text: Car, du sommet des rochers, je le vois, et depuis les collines, je le contemple. Voici un peuple qui demeure à part et qui ne se compte pas parmi les nations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et qui n’est pas compté parmi les nations ». Le verbe hébreu peut être compris au passif aussi bien qu’au sens réfléchi ou moyen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui prolonge l’oracle de Balaam, sans préciser excessivement la nature du lien logique.
- source_word: מֵרֹאשׁ צֻרִים
  choice: du sommet des rochers
  rationale: רֹאשׁ désigne ici le sommet dans un contexte topographique; « rochers » conserve simplement l’image des hauteurs rocheuses.
- source_word: אֶרְאֶנּוּ
  choice: je le vois
  rationale: Le suffixe masculin singulier renvoie collectivement au peuple d’Israël; le pronom « le » préserve cette construction.
- source_word: וּמִגְּבָעוֹת
  choice: et depuis les collines
  rationale: Rend le parallèle topographique avec le premier membre tout en évitant en français la répétition immédiate de « du ».
- source_word: אֲשׁוּרֶנּוּ
  choice: je le contemple
  rationale: Le verbe poétique exprime un regard attentif; « contemple » le distingue de ראה sans archaïsme.
- source_word: הֶן
  choice: Voici
  rationale: Particule déictique qui attire l’attention sur la déclaration suivante; « Voici » convient au registre poétique et reste courant.
- source_word: עָם לְבָדָד יִשְׁכֹּן
  choice: un peuple qui demeure à part
  rationale: « À part » exprime la séparation ou la singularité sans suggérer nécessairement l’isolement; l’imparfait hébreu est rendu comme une caractéristique durable.
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: et qui ne se compte pas parmi les nations
  rationale: La forme hitpael peut recevoir un sens réfléchi ou moyen; cette formulation conserve le réfléchi tout en restant naturelle.
theological_decisions:
- issue: Sens réfléchi ou passif de לֹא יִתְחַשָּׁב
  choice: qui ne se compte pas parmi les nations
  alternative: qui n’est pas compté parmi les nations
  rationale: La forme hitpael permet une lecture réfléchie ou moyenne, tandis qu’une compréhension passive reste possible. Le texte principal retient le réfléchi sans transformer la distinction d’Israël en affirmation de supériorité; l’autre lecture est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. « Voici » et « contemple » maintiennent l’élévation de l’oracle sans employer un vocabulaire désuet. Le masculin singulier « le » conserve la représentation collective du peuple présente en hébreu.
