  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר מִן אֲ֠רָם יַנְחֵ֨/נִי בָלָ֤ק מֶֽלֶךְ מוֹאָב֙ מֵֽ/הַרְרֵי קֶ֔דֶם לְכָ/ה֙ אָֽרָ/ה לִּ֣/י יַעֲקֹ֔ב וּ/לְכָ֖/ה זֹעֲמָ֥/ה יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: fr
  text: 'Alors il prononça son oracle et dit :


    « D’Aram, Balak, roi de Moab, m’a fait venir,


    des montagnes de l’Orient :


    “Viens, maudis Jacob pour moi !


    et viens, exècre Israël !” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: il prononça son poème
  rationale: L’expression idiomatique introduit ici une déclaration poétique solennelle. « Poème » convient au contexte versifié et reste naturel en français, tandis que « proverbe » serait trop étroit et « oracle » préciserait peut-être excessivement la portée prophétique.
- source_word: מִן אֲרָם
  choice: D’Aram
  rationale: Aram est conservé comme nom géographique ancien plutôt que remplacé par « Syrie ».
- source_word: יַנְחֵנִי
  choice: m’a fait venir
  rationale: Le hiphil de נחה exprime une conduite dirigée. Dans ce contexte où Balak a mandé Balaam, « m’a fait venir » rend naturellement l’action causative sans suggérer que Balak l’a personnellement accompagné.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: des montagnes de l’Orient
  rationale: קדם est compris spatialement, en parallèle avec Aram. La tournure garde le relief poétique de l’hébreu.
- source_word: לְכָה
  choice: Viens
  rationale: L’impératif constitue une invitation pressante adressée à Balaam ; « Viens » est idiomatique en français.
- source_word: אָרָה
  choice: maudis
  rationale: Le verbe signifie directement « maudire » ; le terme français est clair et exact.
- source_word: לִּי
  choice: pour moi
  rationale: Le datif indique que l’action est demandée dans l’intérêt de Balak.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom personnel et national est conservé selon sa forme française traditionnelle.
- source_word: זֹעֲמָה
  choice: voue … à la malédiction
  rationale: Cette formulation conserve la force imprécatoire du second verbe tout en le distinguant de אָרָה. « Fustige » ou « dénonce » seraient trop faibles ou orienteraient vers une condamnation principalement verbale.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom personnel et national est conservé selon sa forme française traditionnelle.
theological_decisions:
- issue: Rapport entre Jacob et Israël dans la demande citée par Balaam
  choice: Conserver les deux noms comme désignations parallèles du peuple de l’alliance.
  alternative: Les fondre dans une seule expression telle que « les Israélites ».
  rationale: L’hébreu emploie délibérément « Jacob » et « Israël » dans un parallélisme poétique. Les maintenir préserve les résonances littéraires et historiques sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La disposition en vers fait ressortir le caractère poétique du מָשָׁל. « Alors » assure la continuité narrative ; la citation enchâssée est marquée par des guillemets français puis anglais doubles.
