  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: fr
  text: 'Balak dit à Balaam : « Viens, je te prie. Laisse-moi t’emmener dans un autre endroit. Peut-être cela sera-t-il bon aux yeux de Dieu[a], et, de là, maudis-le pour moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cela sera juste aux yeux de Dieu ». L’expression hébraïque peut signifier qu’une chose est juste ou agréable aux yeux de quelqu’un.'
    reason: Alternative lexicale pour l’idiome יִישַׁר בְּעֵינֵי ; correction de la formulation interrogative involontaire dans la note.
lexical_decisions:
- source_word: לְכָה נָּא
  choice: Viens, je te prie
  rationale: L’impératif de הלך sert ici d’invitation ou d’exhortation, et נָּא en adoucit le ton. Cette formulation est naturelle et respectueuse en français.
- source_word: אֶקָּחֲךָ
  choice: Laisse-moi t’emmener
  rationale: L’imparfait à valeur volitive prolonge l’invitation de Balak. « Laisse-moi t’emmener » exprime naturellement cette nuance.
- source_word: מָקוֹם אַחֵר
  choice: un autre endroit
  rationale: Rend directement le changement concret de lieu et de point d’observation.
- source_word: אוּלַי
  choice: Peut-être
  rationale: Conserve l’incertitude et l’espoir de Balak sans les renforcer.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: cela paraîtra-t-il bon aux yeux de Dieu
  rationale: Préserve l’image de l’idiome hébreu tout en restant compréhensible. Le sujet neutre « cela » renvoie implicitement au projet envisagé, puisque le verbe hébreu n’a pas de sujet explicite.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte narratif, le terme désigne le Dieu auquel Balaam a affaire. « Dieu » est la formulation française la plus naturelle sans ajouter de précision absente du texte.
- source_word: וְקַבֹּתוֹ לִי
  choice: et de là tu le maudiras pour moi
  rationale: Le verbe קבב signifie « maudire ». La formulation conserve la demande insistante de Balak et le pronom singulier qui présente Israël comme une entité collective.
- source_word: מִשָּׁם
  choice: de là
  rationale: Conserve la valeur spatiale de la préposition et rattache la malédiction au nouvel emplacement.
theological_decisions:
- issue: Référent de הָאֱלֹהִים dans les paroles de Balak
  choice: Dieu
  alternative: le dieu / une divinité
  rationale: Le récit présente Balaam comme soumis au Dieu d’Israël, et Balak espère qu’un changement de lieu modifiera ce que Dieu permettra. « Dieu » respecte ce référent narratif sans introduire une lecture polythéiste.
- issue: Nature de ce qui pourrait être bon aux yeux de Dieu
  choice: Conserver le sujet implicite au moyen de « cela »
  alternative: 'Expliciter : « Dieu trouvera peut-être bon que tu le maudisses »'
  rationale: L’hébreu ne précise pas grammaticalement le sujet de יִישַׁר. La traduction retenue conserve cette indétermination au lieu d’identifier explicitement ce qui pourrait être agréé.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue garde la politesse insistante de Balak, l’image hébraïque des « yeux de Dieu » et l’ambiguïté du sujet implicite.
