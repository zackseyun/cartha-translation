  to: 'Balak dit à Balaam : « Viens, je te prie. Laisse-moi t’emmener dans un autre endroit. Peut-être cela sera-t-il bon aux yeux de Dieu[a], et, de là, maudis-le pour moi. »'
  rationale: La révision rétablit l’impératif final du texte hébreu et corrige la syntaxe de la note, tout en préservant l’ambiguïté du sujet de « cela » et l’idiome des « yeux de Dieu ».
