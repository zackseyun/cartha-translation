    reason: Alternative lexicale pour l’idiome יִישַׁר בְּעֵינֵי ; correction de la formulation interrogative involontaire dans la note.
  revision_rationale: La révision rétablit l’impératif final du texte hébreu et corrige la syntaxe de la note, tout en préservant l’ambiguïté du sujet de « cela » et l’idiome des « yeux de Dieu ».
