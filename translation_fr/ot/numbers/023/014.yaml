  text: וַ/יִּקָּחֵ֨/הוּ֙ שְׂדֵ֣ה צֹפִ֔ים אֶל רֹ֖אשׁ הַ/פִּסְגָּ֑ה וַ/יִּ֨בֶן֙ שִׁבְעָ֣ה מִזְבְּחֹ֔ת וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: fr
  text: Il l’emmena alors au champ des Guetteurs[a], au sommet du Pisga. Il construisit sept autels et offrit un taureau et un bélier sur chaque autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le champ de Tsofim ». L’expression hébraïque peut être comprise soit comme une description traduite (« champ des Guetteurs »), soit comme un nom de lieu conservé.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: Il l’emmena donc
  rationale: Le wayyiqtol de לקח poursuit la narration; « emmena » exprime naturellement le déplacement de Balaam par Balaq, et « donc » marque l’enchaînement contextuel.
- source_word: שְׂדֵה צֹפִים
  choice: au champ des Guetteurs[a]
  rationale: Le syntagme construit signifie littéralement « champ des guetteurs/postes d’observation », mais peut aussi désigner un lieu nommé Tsofim. La traduction du sens lexical est retenue dans le texte, avec l’autre lecture en note.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: au sommet du Pisga
  rationale: Dans ce contexte géographique, רֹאשׁ désigne le sommet. הַפִּסְגָּה est traité comme le nom de lieu Pisga, conformément à son emploi biblique.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: Il construisit sept autels
  rationale: Traduction directe de בנה et de son complément; une nouvelle phrase allège naturellement la longue coordination hébraïque.
- source_word: וַיַּעַל
  choice: et offrit
  rationale: Dans un contexte sacrificiel, עלה signifie faire monter une offrande, donc « offrir »; ce choix conserve l’action cultuelle sans la surinterpréter.
- source_word: פָּר וָאַיִל
  choice: un taureau et un bélier
  rationale: Les deux noms singuliers désignent un animal de chaque espèce dans le rituel décrit.
- source_word: בַּמִּזְבֵּחַ
  choice: sur chaque autel
  rationale: 'Bien que l’hébreu porte formellement le singulier « sur l’autel », les sept autels mentionnés et le parallèle du passage indiquent un sens distributif: un taureau et un bélier sur chacun.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. « Pisga » suit la translittération française usuelle; « Guetteurs » garde le sens concret de צֹפִים tout en signalant par la majuscule une possible valeur toponymique.
