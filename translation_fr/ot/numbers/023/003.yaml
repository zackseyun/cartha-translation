source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: fr
  text: 'Alors Balaam dit à Balaq : « Tiens-toi près de ton holocauste, et moi, j’irai. Peut-être Yahweh viendra-t-il à ma rencontre. Ce qu’il me montrera, je te l’annoncerai. » Puis il se rendit sur une hauteur dénudée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une hauteur aride » ou « une colline dénudée ». Le terme hébreu rare semble désigner un lieu élevé, découvert et sans végétation.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: Tiens-toi près de ton holocauste
  rationale: L’impératif hitpael de יצב demande à Balaq de prendre position; avec עַל dans ce contexte, « près de » exprime naturellement la proximité sans laisser entendre qu’il doit se tenir sur l’offrande. עֹלָה désigne précisément un holocauste.
- source_word: וְאֵלְכָה
  choice: et moi, j’irai
  rationale: Le cohortatif exprime l’action que Balaam entend entreprendre. Le pronom tonique met naturellement en relief le changement de sujet en français.
- source_word: אוּלַי
  choice: Peut-être
  rationale: Conserve explicitement l’incertitude exprimée par l’hébreu.
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: Yahweh viendra-t-il à ma rencontre
  rationale: Le niphal de קרה peut exprimer une rencontre qui survient. Avec « Peut-être », cette formulation française rend l’attente incertaine de Balaam sans imposer l’idée moderne d’un pur hasard.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français du nom divin représenté par le tétragramme, plutôt que substitution par un titre.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: Ce qu’il me montrera
  rationale: L’expression hébraïque est condensée; דבר introduit ici le contenu communiqué, et le hiphil de ראה signifie « faire voir, montrer ». Cette formulation reste claire sans ajouter la notion plus interprétative de révélation.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: je te l’annoncerai
  rationale: Le hiphil de נגד signifie annoncer, déclarer ou rapporter. « Annoncer » convient au contexte d’une communication divine solennelle.
- source_word: שֶׁפִי
  choice: une hauteur dénudée
  rationale: Ce terme rare désigne vraisemblablement un lieu élevé, découvert ou sans végétation. La traduction conserve la valeur topographique sans préciser davantage la nature du site.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. Le transcrire préserve la distinction entre ce nom et un titre.
- issue: Nature de la rencontre espérée par Balaam
  choice: « Peut-être Yahweh viendra-t-il à ma rencontre »
  alternative: « Peut-être Yahweh se présentera-t-il fortuitement à moi »
  rationale: La traduction maintient l’incertitude de אוּלַי et la notion de rencontre de קרה, sans transformer en affirmation théologique l’éventuelle nuance de hasard du verbe.
- issue: Sens du terme rare שֶׁפִי
  choice: une hauteur dénudée
  alternative: seul / à l’écart
  rationale: La lecture topographique est retenue comme sens lexical probable, mais la note signale des formulations proches plutôt que de donner au lieu une fonction cultuelle absente du texte.
translation_notes:
  register: Français international moderne, digne et direct. « Holocauste » est conservé comme terme biblique précis pour une offrande entièrement brûlée. La ponctuation sépare la proposition sur la rencontre de celle sur le message afin d’éviter une phrase inutilement lourde.
