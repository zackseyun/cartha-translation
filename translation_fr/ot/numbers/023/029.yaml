  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: fr
  text: 'Alors Balaam dit à Balak : « Construis-moi ici sept autels et prépare-moi ici sept taureaux et sept béliers. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit; « Alors … dit » en rend naturellement la succession en français moderne.
- source_word: בְּנֵה לִי
  choice: Construis-moi
  rationale: L’impératif de בנה demande d’ériger les autels, et le datif לִי se rend idiomatiquement par le pronom « me ».
- source_word: בָּזֶה
  choice: ici
  rationale: L’expression signifie littéralement « en ce lieu »; « ici » en conserve clairement et naturellement la valeur locative.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: sept autels
  rationale: Traduction directe de la construction numérale.
- source_word: וְהָכֵן לִי
  choice: et prépare-moi
  rationale: Le hifil impératif de כון signifie ici rendre prêts ou fournir les animaux destinés aux sacrifices.
- source_word: פָרִים
  choice: taureaux
  rationale: פַּר désigne couramment un taureau dans un contexte sacrificiel; le texte n’impose pas de préciser qu’ils sont jeunes.
- source_word: אֵילִים
  choice: béliers
  rationale: אֵיל désigne le mâle du mouton, particulièrement dans les prescriptions et récits sacrificiels.
