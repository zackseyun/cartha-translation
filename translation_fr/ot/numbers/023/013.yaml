source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: fr
  text: 'Balak lui dit : « Viens donc avec moi dans un autre endroit, d’où tu pourras voir Israël. Tu n’en verras qu’une extrémité[a], sans le voir tout entier[b]. De là, maudis-le pour moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une partie située à l’extrémité ». L’hébreu évoque le bout, la limite ou la frange du peuple.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici des pronoms au singulier pour désigner Israël comme un seul peuple.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: Viens donc avec moi
  rationale: L’impératif de הלך accompagné de נָא exprime ici une invitation insistante mais polie. « Viens… avec moi » est naturel en français lorsque le locuteur invite quelqu’un à l’accompagner; « donc » rend légèrement la valeur sollicitante de נָא sans alourdir la phrase.
- source_word: אֶל מָקוֹם אַחֵר
  choice: dans un autre endroit
  rationale: Rend simplement le déplacement vers un nouveau lieu d’observation.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: d’où tu pourras voir Israël
  rationale: La proposition définit le nouveau point d’observation. Le nom « Israël » explicite naturellement en français le référent du suffixe singulier, qui est le peuple pris collectivement.
- source_word: אֶפֶס קָצֵהוּ תִרְאֶה
  choice: Tu n’en verras qu’une extrémité
  rationale: אֶפֶס a ici une valeur restrictive, et קָצֶה désigne un bout, une limite ou une extrémité. La tournure française exprime clairement qu’une partie seulement du peuple sera visible, tout en conservant l’image spatiale.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: sans le voir tout entier
  rationale: Préserve le contraste entre vue partielle et vue complète ainsi que la représentation singulière d’Israël comme un peuple collectif.
- source_word: וְקָבְנוֹ לִי מִשָּׁם
  choice: De là, maudis-le pour moi
  rationale: קבב signifie « maudire » dans ce récit. L’antéposition de « De là » maintient la logique spatiale de la stratégie de Balak.
theological_decisions:
- issue: Référent des suffixes masculins singuliers appliqués à Israël
  choice: Nommer d’abord « Israël », puis reprendre le peuple par les pronoms singuliers « le » et « lui »
  alternative: Employer constamment le pluriel (« les voir », « les maudire ») ou traduire littéralement par « lui » dès la première occurrence
  rationale: L’hébreu présente Israël comme une collectivité singulière. Le français permet de conserver cette unité collective après avoir explicité le référent, sans produire l’ambiguïté artificielle qu’aurait un premier « le voir » sans antécédent nominal dans ce verset.
- issue: Valeur contextuelle de l’impératif הלך
  choice: « Viens donc » comme invitation à accompagner Balak
  alternative: « Va, je te prie »
  rationale: Bien que הלך puisse signifier « aller », le contexte est celui d’une invitation à se déplacer ensemble; l’usage déictique naturel du français appelle « venir avec moi ».
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct reste naturel, et le nom « Israël » clarifie le référent collectif sans effacer les reprises au singulier du texte hébreu.
