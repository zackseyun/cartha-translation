  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: fr
  text: 'Yahweh rencontra Balaam, mit une parole dans sa bouche et dit : « Retourne auprès de Balak, et voici ce que tu diras. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּר
  choice: rencontra
  rationale: Le verbe קָרָה désigne ici une rencontre directe. « Rencontra » est naturel en français et n’ajoute pas l’idée plus précise d’une apparition.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé comme nom propre plutôt que remplacé par un titre.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: mit une parole dans sa bouche
  rationale: Cette formulation garde l’image hébraïque de la parole donnée à Balaam, tout en restant intelligible en français.
- source_word: דָּבָר
  choice: une parole
  rationale: Dans ce contexte, דָּבָר désigne l’énoncé précis que Balaam devra prononcer. « Parole » préserve le singulier et l’idiome prophétique.
- source_word: שׁוּב אֶל בָּלָק
  choice: Retourne auprès de Balak
  rationale: L’impératif ordonne à Balaam de revenir là où se trouve Balak. « Auprès de » exprime naturellement en français le retour vers une personne.
- source_word: וְכֹה תְדַבֵּר
  choice: et voici ce que tu diras
  rationale: כֹה introduit ici la parole qui va suivre. Cette tournure actuelle et digne communique clairement la valeur de l’expression hébraïque sans raideur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. Le conserver évite de le remplacer par un titre.
- issue: Nature de la parole placée dans la bouche de Balaam
  choice: une parole
  alternative: un message
  rationale: « Une parole » conserve le singulier hébreu et l’image d’une parole directement donnée, sans préciser davantage son mode d’inspiration.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide sans effacer l’image hébraïque « mit une parole dans sa bouche ». Aucun marqueur de note n’est requis puisqu’aucune note n’est retenue.
