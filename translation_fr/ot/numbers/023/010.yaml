  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: fr
  text: Qui peut compter la poussière de Jacob, ou dénombrer le quart d’Israël[a] ? Que mon âme meure de la mort des hommes droits[b], et que ma fin soit comme la sienne[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les quartiers d’Israël » ; l’expression peut aussi être comprise, de façon plus interprétative, comme désignant même un quart d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des justes ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie un suffixe masculin singulier : littéralement, « comme le sien ». Il peut renvoyer à un représentant des « hommes droits », expression collective au pluriel.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מִי מָנָה
  choice: Qui peut compter
  rationale: La question rhétorique implique l’impossibilité; « peut » explicite naturellement cette force en français.
- source_word: עֲפַר יַעֲקֹב
  choice: la poussière de Jacob
  rationale: Conserve l’image poétique de descendants innombrables et le parallélisme des noms Jacob et Israël.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: ou dénombrer le quart d’Israël
  rationale: « Le quart » rend directement רֹבַע sans trancher l’interprétation exacte; « dénombrer » restitue le parallélisme numérique.
- source_word: תָּמֹת נַפְשִׁי
  choice: Que mon âme meure
  rationale: Préserve le sujet explicite « mon âme » et la diction poétique du souhait hébreu.
- source_word: מוֹת יְשָׁרִים
  choice: de la mort des hommes droits
  rationale: « Hommes droits » rend le pluriel יְשָׁרִים et sa nuance morale sans lui imposer un sens théologique plus technique.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: et que ma fin soit
  rationale: « Fin » convient au parallélisme avec la mort tout en gardant la possible nuance d’issue finale.
- source_word: כָּמֹהוּ
  choice: comme la sienne
  rationale: Conserve le suffixe masculin singulier, malgré l’antécédent collectif pluriel, sans corriger silencieusement la tension grammaticale.
theological_decisions:
- issue: Sens de יְשָׁרִים
  choice: les hommes droits
  alternative: les justes
  rationale: Le choix suit la valeur lexicale de la droiture et évite de surcharger le terme d’une connotation judiciaire ou doctrinale.
- issue: Interprétation de רֹבַע יִשְׂרָאֵל
  choice: le quart d’Israël
  alternative: la multitude d’Israël; les quatre camps d’Israël
  rationale: La traduction formelle maintient l’ambiguïté de l’expression au lieu d’intégrer dans le texte une explication contextuelle.
- issue: Référent singulier de כָּמֹהוּ
  choice: comme la sienne
  alternative: comme la leur
  rationale: Le singulier hébreu est préservé, même si « les hommes droits » fonctionne collectivement; une note signale cette tension.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe exclamative restitue le souhait de Balaam. « Dénombrer » évite la répétition de « compter » tout en maintenant le parallélisme.
