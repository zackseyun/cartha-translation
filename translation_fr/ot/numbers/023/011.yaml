  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: fr
  text: 'Alors Balak dit à Balaam : « Que m’as-tu fait ? Je t’ai fait venir pour maudire mes ennemis, et voilà que tu les as bel et bien bénis ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » marque naturellement la succession en français moderne.
- source_word: מֶה עָשִׂיתָ לִי
  choice: Que m’as-tu fait ?
  rationale: Rend directement l’interrogation et le pronom complément, avec une formulation française naturelle pour une action qui vient d’avoir lieu.
- source_word: לָקֹב
  choice: pour maudire
  rationale: Dans ce contexte, קבב désigne l’action de prononcer une malédiction contre quelqu’un.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Équivalent direct et courant du nom pluriel avec suffixe possessif.
- source_word: לְקַחְתִּיךָ
  choice: Je t’avais fait venir
  rationale: לקח signifie littéralement « prendre », mais, dans cette situation, Balak a fait venir Balaam auprès de lui. Cette formulation française exprime le mouvement voulu sans introduire l’idée plus précise de l’embauche.
- source_word: וְהִנֵּה
  choice: et voilà que
  rationale: Cette tournure restitue en français actuel la surprise et le contraste signalés par הִנֵּה.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: tu les as bel et bien bénis
  rationale: Le verbe conjugué suivi de l’infinitif absolu renforce l’affirmation. « Bel et bien » en rend l’emphase sans ajouter l’idée d’une bénédiction abondante. « Les » explicite l’objet sous-entendu, à savoir les ennemis.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue conserve l’indignation de Balak ; « et voilà que » et « bel et bien » rendent l’emphase hébraïque sans archaïsme.
