  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר אָמַ֣ר בִּלְעָ֑ם וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: fr
  text: Balak fit donc comme Balaam l’avait dit, et il offrit un taureau et un bélier sur l’autel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Dans la construction avec כַּאֲשֶׁר אָמַר, עשה signifie naturellement « faire ce que quelqu’un a dit ».
- source_word: כַּאֲשֶׁר
  choice: ce que
  rationale: Avec « faire », la tournure française idiomatique « faire ce que Balaam avait dit » exprime fidèlement la conformité à ses instructions.
- source_word: אָמַר
  choice: avait dit
  rationale: Le plus-que-parfait marque naturellement en français que les paroles de Balaam précèdent l’action de Balak.
- source_word: וַיַּעַל
  choice: offrit
  rationale: Dans un contexte sacrificiel, עלה désigne l’action d’offrir une victime sur l’autel; « offrit » est précis et naturel.
- source_word: פָּר
  choice: un taureau
  rationale: « Taureau » est le terme français moderne et précis pour l’animal sacrificiel.
- source_word: אַיִל
  choice: un bélier
  rationale: « Bélier » est l’équivalent français usuel et précis de אַיִל.
- source_word: בַּמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Cette formulation rend naturellement la préposition ב dans ce contexte sacrificiel.
- source_word: וַ
  choice: donc
  rationale: « Donc » restitue ici l’enchaînement narratif et conséquent avec les instructions données précédemment.
