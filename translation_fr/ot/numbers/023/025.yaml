  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: fr
  text: 'Balak dit à Balaam : « Ne le maudis pas du tout et ne le bénis pas non plus ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « maudire, tu ne le maudiras pas… bénir, tu ne le béniras pas ». Dans chaque proposition, l’infinitif absolu suivi d’un verbe conjugué marque une forte insistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit le récit. Le passé simple convient au registre narratif français et il n’est pas nécessaire de rendre mécaniquement le waw par « et ».
- source_word: בָּלָק ... אֶל בִּלְעָם
  choice: Balak dit à Balaam
  rationale: Les noms propres suivent leur forme française usuelle, et אֶל introduit naturellement le destinataire par « à ».
- source_word: גַּם ... גַּם
  choice: mais ... non plus
  rationale: 'Dans ces deux interdictions parallèles, les occurrences de גַּם associent les deux actions. La tournure française « mais… non plus » exprime naturellement l’ordre frustré de Balak : à défaut de maudire, Balaam ne doit pas davantage bénir.'
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: Ne le maudis surtout pas
  rationale: קבב désigne ici l’action de maudire. L’infinitif absolu suivi du verbe conjugué renforce l’interdiction ; « surtout pas » en restitue l’insistance en français courant.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: ne le bénis surtout pas non plus
  rationale: ברך signifie « bénir ». La répétition de « surtout pas » conserve le parallélisme emphatique de l’infinitif absolu suivi du verbe conjugué, tandis que « non plus » relie clairement cette seconde interdiction à la première.
- source_word: ־נּוּ / ־נּוּ
  choice: le
  rationale: Le suffixe objet masculin singulier est rendu par « le » ; son référent reste implicite comme dans l’hébreu.
