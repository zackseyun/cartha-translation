source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: fr
  text: 'Car aucune divination ne peut rien contre Jacob[a], ni aucun sortilège contre Israël. En ce temps-ci, on dira au sujet de Jacob et d’Israël : « Ce que Dieu a accompli ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « il n’y a pas de divination en Jacob, ni de sortilège en Israël ». La préposition hébraïque permet les deux interprétations ; le contexte favorise ici l’idée que ces pratiques ne peuvent rien contre Israël.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, en comprenant la phrase comme une question : « Qu’a accompli Dieu ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: נַחַשׁ
  choice: présage
  rationale: Dans ce contexte, le nom désigne un moyen de connaître ou d’influencer l’avenir par les signes. « Présage » est courant en français et permet de le distinguer de קֶסֶם.
- source_word: קֶסֶם
  choice: divination
  rationale: Le terme désigne une pratique divinatoire occulte. « Divination » en donne clairement le sens sans introduire une forme particulière de magie absente de l’hébreu.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: contre Jacob / contre Israël
  rationale: Dans l’oracle de Balaam, la préposition בְּ est comprise comme visant l’inefficacité des procédés occultes contre Israël. La formulation « ne peut rien contre » rend cette portée en français naturel, tout en signalant en note l’autre compréhension possible.
- source_word: כָּעֵת
  choice: au moment voulu
  rationale: L’expression peut désigner le moment présent ou le moment approprié. Ici, elle évoque naturellement le moment où l’action de Dieu est reconnue et proclamée.
- source_word: יֵאָמֵר
  choice: on dira
  rationale: Le nifal imparfait a une valeur passive et impersonnelle. Le français « on dira » restitue naturellement « il sera dit » sans alourdir la phrase.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: au sujet de Jacob et d’Israël
  rationale: Le לְ peut marquer les personnes auxquelles la parole est adressée ou celles à propos desquelles elle est prononcée. Dans ce contexte, « au sujet de » met en valeur la proclamation concernant le peuple.
- source_word: מַה פָּעַל אֵל
  choice: Ce que Dieu a accompli !
  rationale: מַה est compris comme exclamatif et פָּעַל comme un accompli. Cette tournure concise conserve l’élan admiratif sans transformer la proposition en question.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici le titre divin commun. « Dieu » suffit sans ajouter un qualificatif non explicité dans le texte.
theological_decisions:
- issue: Le verset nie-t-il la présence de pratiques occultes en Israël ou leur efficacité contre Israël ?
  choice: Il proclame que les présages et la divination ne peuvent rien contre Jacob et Israël.
  alternative: Il affirme qu’il n’y a ni présage ni divination pratiqués au sein de Jacob et d’Israël.
  rationale: Le contexte de l’oracle porte sur l’impossibilité de maudire le peuple que Dieu a béni. La traduction principale exprime donc son invulnérabilité à ces procédés, tandis que la note préserve l’ambiguïté réelle de la préposition hébraïque.
- issue: מַה פָּעַל אֵל est-il interrogatif ou exclamatif ?
  choice: 'La proposition est une exclamation admirative : « Ce que Dieu a accompli ! »'
  alternative: 'La proposition est une question : « Qu’a accompli Dieu ? »'
  rationale: L’exclamation convient au point culminant de l’oracle, qui célèbre publiquement l’action de Dieu, mais la forme hébraïque permet aussi matériellement une lecture interrogative.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé. « Ne peut rien contre » explicite sobrement le sens contextuel de la préposition, et les deux ambiguïtés importantes sont maintenues dans les notes.
