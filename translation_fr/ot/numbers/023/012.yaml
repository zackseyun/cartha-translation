  text: וַ/יַּ֖עַן וַ/יֹּאמַ֑ר הֲ/לֹ֗א אֵת֩ אֲשֶׁ֨ר יָשִׂ֤ים יְהוָה֙ בְּ/פִ֔/י אֹת֥/וֹ אֶשְׁמֹ֖ר לְ/דַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: fr
  text: 'Il répondit : « Ne dois-je pas veiller à dire ce que Yahweh met dans ma bouche ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: Il répondit
  rationale: La formule narrative hébraïque associe littéralement « répondre » et « dire ». En français moderne, « Il répondit » exprime naturellement l’ensemble sans la lourdeur de « Il répondit et dit ».
- source_word: הֲלֹא
  choice: Ne dois-je pas
  rationale: Introduit une question rhétorique qui attend une réponse affirmative et exprime ici l’obligation ressentie par Balaam.
- source_word: אֵת אֲשֶׁר
  choice: ce que
  rationale: Rend naturellement en français le marqueur d’objet suivi du relatif.
- source_word: יָשִׂים
  choice: met
  rationale: Le verbe שׂים signifie placer ou mettre ; avec « dans ma bouche », « met » conserve clairement l’image hébraïque de paroles données.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel porté par le tétragramme, plutôt que de lui substituer un titre.
- source_word: בְּפִי
  choice: dans ma bouche
  rationale: Conserve l’image et l’idiome hébraïques tout en restant intelligible en français.
- source_word: אֹתוֹ
  choice: ce que
  rationale: Le pronom objet de reprise est intégré à la construction française « ce que… », sans répétition artificielle.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: veiller à dire
  rationale: שׁמר suivi de l’infinitif exprime l’attention à observer fidèlement une obligation. « Veiller à dire » préserve cette nuance de soin sans devenir pesant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Degré de contrainte et d’attention dans la réponse de Balaam
  choice: Ne dois-je pas veiller à dire
  alternative: Ne dois-je pas dire
  rationale: La question rhétorique exprime l’obligation, tandis que אֶשְׁמֹר לְדַבֵּר ajoute l’idée d’une observance attentive. Le français retenu maintient les deux sans suggérer une dictée mécanique.
translation_notes:
  register: Français international moderne, naturel et digne. La formule hébraïque « il répondit et dit » est idiomatiquement condensée en « Il répondit ». L’image « met dans ma bouche » est conservée en raison de sa clarté et de son importance dans le contexte prophétique.
