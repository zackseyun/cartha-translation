revisions:
- from: La nuée se retira de dessus la tente, et voici que Miriam était atteinte d’une grave affection de la peau[a], comme la neige. Aaron se tourna vers Miriam, et voici qu’elle était atteinte de cette affection.
  to: La nuée se retira de dessus la tente, et voici que Miriam était atteinte d’une affection cutanée[a], comme la neige. Aaron se tourna vers Miriam, et voici qu’elle était atteinte d’une affection cutanée.
  rationale: La révision retire une notion de gravité absente du texte, maintient l’indétermination médicale et rituelle de צָרַעַת par une note, et rétablit dans la seconde proposition une répétition lexicale plus proche de l’hébreu.
