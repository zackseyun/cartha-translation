base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: fr
  text: La nuée se retira de dessus la tente, et voici que Miriam était atteinte d’une affection cutanée[a], comme la neige. Aaron se tourna vers Miriam, et voici qu’elle était atteinte d’une affection cutanée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner plus largement une affection cutanée relevant des règles d’impureté rituelle; il ne correspond pas nécessairement à ce que la médecine moderne appelle la lèpre (maladie de Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: la nuée
  rationale: Le nom défini désigne ici la manifestation visible associée à la présence de l’Éternel. « La nuée » est la formulation biblique française naturelle et digne.
- source_word: סָר
  choice: se retira
  rationale: Le verbe exprime l’éloignement ou le retrait. « Se retira » convient au mouvement de la nuée quittant sa position au-dessus de la tente.
- source_word: מֵעַל הָאֹהֶל
  choice: de dessus la tente
  rationale: La préposition indique un mouvement depuis une position située au-dessus. Cette formulation reste proche de l’hébreu sans expliciter « tente de la rencontre », absent de ce verset.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure conserve l’effet de constat soudain et saisissant de la particule hébraïque, à ses deux occurrences.
- source_word: מְצֹרַעַת
  choice: atteinte d’une grave affection de la peau
  rationale: Le terme hébreu désigne une affection relevant de la catégorie de צָרַעַת, plus large que la lèpre au sens médical moderne. Une formulation descriptive évite une identification clinique trompeuse.
- source_word: כַּשָּׁלֶג
  choice: comme la neige
  rationale: La traduction conserve la comparaison brève de l’hébreu sans ajouter explicitement « blanche », même si la couleur est vraisemblablement en vue.
- source_word: וַיִּפֶן ... אֶל
  choice: se tourna vers
  rationale: Cette expression rend naturellement le mouvement orienté d’Aaron vers Miriam.
- source_word: וְהִנֵּה מְצֹרָעַת
  choice: et voici qu’elle était atteinte de cette affection
  rationale: Le démonstratif reprend naturellement en français l’affection déjà nommée tout en conservant la répétition emphatique du texte.
theological_decisions:
- issue: Identification de צָרַעַת avec la lèpre moderne
  choice: Employer une description générale d’affection cutanée grave et préciser la portée du terme en note
  alternative: Traduire « lépreuse »
  rationale: L’hébreu biblique couvre diverses atteintes cutanées ou rituelles et ne correspond pas nécessairement à la maladie de Hansen. La traduction choisie préserve cette indétermination sans nier la gravité du jugement narré.
- issue: Portée de la comparaison avec la neige
  choice: Conserver simplement « comme la neige »
  alternative: Expliciter « blanche comme la neige »
  rationale: Le contexte suggère la blancheur, mais le texte hébreu ne nomme pas expressément la couleur. La formulation littérale maintient cette légère ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » conserve la tonalité biblique usuelle; « et voici que » maintient la vivacité narrative. La description de l’affection privilégie la précision sémantique sur le terme traditionnel potentiellement trompeur « lèpre ».
