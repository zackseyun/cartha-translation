  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: fr
  text: Je parle avec lui, bouche à bouche[a], clairement[b] et non par énigmes ; il contemple la forme de Yahweh[c]. Pourquoi donc n’avez-vous pas eu peur de parler contre mon serviteur, contre Moïse ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « bouche à bouche » ; l’expression souligne que Yahweh parle directement avec Moïse. On peut aussi traduire : « face à face ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de façon manifeste ». Le mot hébreu peut aussi désigner une apparition ou une vision.'
    reason: textual_ambiguity
  - marker: c
    text: 'Ou : « la ressemblance de Yahweh » ou « l’apparence de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: bouche à bouche
  rationale: Cette expression reproduit l’image hébraïque d’une parole directe. Bien que « face à face » soit plus idiomatique en français, le texte dit précisément « bouche à bouche ».
- source_word: אֲדַבֶּר בּוֹ
  choice: je lui parle
  rationale: En français courant, « je lui parle » exprime naturellement l’échange direct signalé ici par דבר avec ב, sans la lourdeur de « je parle avec lui » dans cette construction.
- source_word: וּמַרְאֶה
  choice: clairement
  rationale: Mis en contraste avec « par énigmes », le terme décrit vraisemblablement le caractère manifeste et intelligible de la communication. Une note conserve toutefois les autres analyses possibles du nom מַרְאֶה.
- source_word: וְלֹא בְחִידֹת
  choice: et non par énigmes
  rationale: « Énigmes » rend le sens de paroles obscures ou indirectes tout en gardant le contraste avec la révélation claire accordée à Moïse.
- source_word: וּתְמֻנַת יְהוָה
  choice: la forme de Yahweh
  rationale: « Forme » garde le caractère concret mais non défini de תְּמוּנָה, sans expliquer davantage la nature de cette manifestation divine. Le nom divin est translittéré « Yahweh ».
- source_word: יַבִּיט
  choice: il contemple
  rationale: Le verbe exprime un regard intentionnel. « Contemple » convient au registre solennel sans ajouter une explication métaphysique.
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: Pourquoi donc n’avez-vous pas eu peur
  rationale: « Donc » fait ressortir la conclusion accusatrice tirée de la relation unique entre Yahweh et Moïse ; « avoir peur » rend naturellement ירא dans ce reproche.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: de parler contre mon serviteur, contre Moïse
  rationale: Dans ce contexte hostile, ב après דבר signifie « contre ». La répétition de « contre » reflète celle de la préposition hébraïque et met fortement Moïse en apposition.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom propre de l’alliance présent dans le texte hébreu.
- issue: Nature de ce que Moïse contemple
  choice: la forme de Yahweh
  alternative: la ressemblance de Yahweh / l’apparence de Yahweh
  rationale: « Forme » affirme la révélation exceptionnellement directe décrite par le verset, tout en laissant ouverte la nature exacte de cette perception et sans identifier celle-ci à une vision exhaustive de Dieu.
- issue: Mode de communication avec Moïse
  choice: clairement et non par énigmes
  alternative: dans une apparition et non par énigmes
  rationale: Le parallélisme favorise l’idée d’une communication manifeste, mais la note signale que מַרְאֶה peut aussi désigner une apparence ou une vision.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image inhabituelle « bouche à bouche » et la répétition emphatique « contre mon serviteur, contre Moïse », tandis que les notes rendent visibles les ambiguïtés lexicales importantes.
