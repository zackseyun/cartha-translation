  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: fr
  text: 'Soudain, Yahweh dit à Moïse, à Aaron et à Miriam : « Sortez[a], vous trois[b], à la tente de la Rencontre. » Et tous les trois sortirent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu signifie « sortir ». Selon le point de vue, on pourrait aussi traduire : « Venez dehors » ou « Allez dehors ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vous trois ». On pourrait aussi traduire : « vous, tous les trois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: פִּתְאֹם
  choice: Soudain
  rationale: Rend à la fois l'immédiateté et le caractère inattendu de la prise de parole divine; sa position initiale est naturelle en français narratif.
- source_word: צְאוּ
  choice: Sortez
  rationale: L'impératif de יצא indique un mouvement hors du lieu où se trouvent les trois personnes; le français « sortez » conserve la neutralité entre « allez dehors » et « venez dehors ».
- source_word: שְׁלָשְׁתְּכֶם
  choice: tous les trois
  rationale: Exprime clairement que les trois destinataires sont convoqués ensemble et conserve l'insistance du texte hébreu.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rend מוֹעֵד par « rencontre », qui exprime ici le lieu assigné où Yahweh rencontre son peuple, sans réduire le terme à une simple réunion humaine.
- source_word: וַיֵּצְאוּ
  choice: ils sortirent
  rationale: Rend directement la forme narrative de יצא et reprend naturellement le verbe de l'ordre donné.
- source_word: שְׁלָשְׁתָּם
  choice: tous les trois
  rationale: Préserve la répétition emphatique de l'hébreu, qui précise que les trois personnes obéirent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve sous une forme de translittération largement reconnue, sans le remplacer par un titre.
- issue: Sens de אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  alternative: la tente de la Réunion; la tente d'assignation
  rationale: « Rencontre » garde la dimension du rendez-vous divin attachée à מוֹעֵד et évite de faire de l'expression le simple nom d'un rassemblement humain.
translation_notes:
  register: Français international actuel, digne et narratif. La syntaxe reste simple et orale dans le discours direct. « Miriam » conserve la forme hébraïque du nom, et « tente de la rencontre » est traité comme un nom commun descriptif.
