  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: fr
  text: Moïse était un homme très humble[a], plus humble que tout autre être humain sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « très doux » ; le terme hébreu peut aussi évoquer une personne affligée ou abaissée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הָ/אִישׁ
  choice: L’homme
  rationale: L’article et le nom sont conservés conformément à l’expression hébraïque. Le waw de continuité n’exige pas ici un « et » initial en français moderne.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ענו
  choice: humble
  rationale: Dans ce contexte prédicatif, l’adjectif décrit le caractère de Moïse. « Humble » est naturel et évite les connotations de faiblesse que peut porter « doux ».
- source_word: מְאֹד
  choice: très
  rationale: Intensif adverbial courant, rendu directement et naturellement.
- source_word: מִ/כֹּל
  choice: plus que tout autre
  rationale: Cette formulation exprime clairement la comparaison en français et évite que « plus que tout » soit compris comme portant sur des choses plutôt que sur des personnes.
- source_word: הָאָדָם
  choice: être humain
  rationale: אָדָם a ici un sens générique et désigne l’ensemble des humains, sans restriction au sexe masculin.
- source_word: אֲשֶׁר
  choice: à la surface de la terre
  rationale: La proposition relative hébraïque est intégrée idiomatiquement au groupe comparatif français ; sa portée existentielle demeure claire.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: à la surface de la terre
  rationale: Rend l’image spatiale de l’expression hébraïque dans un français naturel et digne.
theological_decisions:
- issue: Sens générique de אָדָם dans la comparaison
  choice: être humain
  alternative: homme
  rationale: Le terme désigne ici toute personne humaine. « Être humain » préserve explicitement cette portée générique sans introduire une limitation masculine absente du contexte.
- issue: Description de Moïse par ענו
  choice: humble
  alternative: doux
  rationale: « Humble » convient le mieux à la disposition décrite, tout en laissant subsister la tension narrative créée par une affirmation de l’humilité de Moïse dans le récit qui porte son nom.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde l’expression marquée « L’homme Moïse » afin de refléter l’hébreu, tandis que « être humain » explicite la portée générique de אָדָם. Le marqueur de note [a] figure dans le texte.
