  text: וַ/תִּסָּגֵ֥ר מִרְיָ֛ם מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים וְ/הָ/עָם֙ לֹ֣א נָסַ֔ע עַד הֵאָסֵ֖ף מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/015.yaml
  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: fr
  text: Ainsi, Miriam fut tenue à l’écart, hors du camp, pendant sept jours, et le peuple ne se mit pas en route jusqu’à ce que Miriam soit réintégrée au camp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « jusqu’à ce que Miriam soit rassemblée ». Le verbe hébreu signifie « rassembler, recueillir » et désigne ici sa réintégration dans le camp après sa période d’exclusion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: fut tenue à l’écart
  rationale: Le niphal de סגר exprime ici l’exclusion imposée à Miriam. « Tenue à l’écart » rend naturellement son isolement hors du camp sans suggérer qu’elle était enfermée dans un lieu clos.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: du camp
  rationale: Avec « tenue à l’écart », « du camp » exprime naturellement la localisation hors du camp indiquée par l’hébreu.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Formulation française idiomatique qui conserve exactement la durée indiquée.
- source_word: הָעָם
  choice: le peuple
  rationale: Dans ce récit, le terme désigne la communauté d’Israël en marche; « le peuple » est l’équivalent français naturel.
- source_word: לֹא נָסַע
  choice: ne repartit pas
  rationale: נסע désigne souvent la levée du camp et la reprise du voyage. « Ne repartit pas » convient au contexte et se lit naturellement en français.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: avant qu’elle y soit réintégrée
  rationale: Le niphal de אסף signifie littéralement que Miriam fut « rassemblée » ou « recueillie ». Dans le contexte, il s’agit de son admission de nouveau dans le camp; le pronom « y » renvoie clairement à celui-ci.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Miriam » suit la forme hébraïque du nom. La formulation conserve l’exclusion réglementaire sans ajouter d’explication doctrinale.
