  naturalness: La révision reste sobre et idiomatique en français international moderne. « Ne se mit pas en route » rend naturellement le déplacement collectif exprimé par נסע; la répétition de « Miriam » évite toute ambiguïté référentielle.
  terminology: « Camp », « peuple », « tenue à l’écart » et « réintégrée au camp » conviennent au registre narratif et au contexte d’exclusion temporaire. Le nom « Miriam » est conservé conformément à la forme retenue dans le projet.
