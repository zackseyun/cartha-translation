  text: וַ/יִּֽחַר אַ֧ף יְהוָ֛ה בָּ֖/ם וַ/יֵּלַֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: fr
  text: La colère de Yahweh s’enflamma contre eux[a], puis il s’en alla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le nez de Yahweh s’enflamma contre eux » ; c’est une expression hébraïque qui signifie que sa colère s’enflamma contre eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר
  choice: s’enflamma
  rationale: Le verbe חרה décrit ici la colère comme une chaleur ou un feu qui s’allume. « S’enflamma » conserve cette métaphore tout en restant naturel en français.
- source_word: אַף
  choice: colère
  rationale: אַף signifie littéralement « nez », mais, dans cette expression avec חרה, il désigne idiomatiquement la colère.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh » plutôt que remplacé par un titre.
- source_word: בָּם
  choice: contre eux
  rationale: Dans cette construction, la préposition indique les personnes visées par la colère.
- source_word: וַיֵּלַךְ
  choice: il s’en alla
  rationale: הלך exprime ici le retrait de Yahweh après sa déclaration. « Il s’en alla » est direct, naturel et n’ajoute aucune précision absente de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans lui substituer un titre.
translation_notes:
  register: Français moderne, digne et accessible. La coordination hébraïque est rendue par « puis » afin de marquer naturellement la succession des actions, sans surinterpréter leur relation.
