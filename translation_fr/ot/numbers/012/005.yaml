source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: fr
  text: Alors Yahweh descendit dans une colonne de nuée. Il se tint à l’entrée de la tente[a], appela Aaron et Myriam, et tous deux s’avancèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la tente de la rencontre, d’après le contexte.
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « ils sortirent tous deux » ou « tous deux sortirent ». Le contexte peut indiquer qu’ils se présentèrent en réponse à l’appel de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד exprime concrètement un mouvement vers le bas. « Descendit » est naturel et conserve l’image théophanique et anthropomorphique de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom propre présent dans le texte source plutôt que de lui substituer un titre.
- source_word: בְּעַמּוּד עָנָן
  choice: dans une colonne de nuée
  rationale: La préposition ב peut indiquer ici le cadre ou le mode de la manifestation. L’indéfini rend naturellement l’absence d’article dans l’expression hébraïque.
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: « Se tint » traduit עמד avec dignité et convient à la position prise à l’entrée de la tente.
- source_word: פֶּתַח הָאֹהֶל
  choice: à l’entrée de la tente
  rationale: פתח désigne l’ouverture ou l’entrée. Le texte dit simplement « la tente », même si le contexte permet de reconnaître la tente de la rencontre.
- source_word: וַיִּקְרָא
  choice: appela
  rationale: קרא signifie couramment « appeler ». Le verbe conserve la simplicité de la narration sans renforcer inutilement le sens en « convoqua ».
- source_word: אַהֲרֹן וּמִרְיָם
  choice: Aaron et Miriam
  rationale: Formes françaises usuelles des deux noms bibliques.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: tous deux s’avancèrent
  rationale: יצא signifie littéralement « sortir », mais le contexte suggère qu’ils se présentent en réponse à l’appel. « S’avancèrent » rend ce mouvement naturellement, tandis que « tous deux » préserve שְׁנֵיהֶם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: « Yahweh » représente le nom propre du texte hébreu et évite de le remplacer par un titre.
- issue: Descente anthropomorphique de Yahweh
  choice: Conserver « descendit »
  alternative: Paraphraser par « apparut »
  rationale: L’hébreu présente explicitement une descente. La traduction maintient cette image sans tenter d’en résoudre les implications théologiques.
- issue: Sens contextuel de יצא
  choice: « s’avancèrent » dans le texte, avec le sens littéral en note
  alternative: « sortirent »
  rationale: Le contexte favorise l’idée qu’Aaron et Miriam se présentent à l’appel de Yahweh, mais une note conserve l’ambiguïté lexicale du verbe.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsmes. Les phrases ont été légèrement segmentées pour une lecture naturelle, sans modifier la succession des actions.
