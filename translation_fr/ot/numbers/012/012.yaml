source:
  edition: WLC
  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: fr
  text: Je t’en prie, qu’elle ne soit pas comme un mort[a], dont la chair est à moitié consumée lorsqu’il sort du ventre de sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme un mort ». L’image peut évoquer un enfant mort-né, dont la chair est à moitié consumée à sa sortie du ventre maternel.'
    reason: Préserve le sens littéral de כַּמֵּת dans le texte principal tout en signalant l’interprétation possible de l’image de la naissance.
lexical_decisions:
- source_word: אַל נָא
  choice: Je t’en prie, ne… pas
  rationale: אַל exprime l’interdiction ou la demande négative, tandis que נָא marque une supplication pressante. La tournure française rend naturellement cette imploration.
- source_word: תְהִי
  choice: la laisse pas devenir
  rationale: 'La forme féminine singulière renvoie à Miriam. Avec la négation, elle exprime ici une demande : qu’elle ne soit pas ou ne devienne pas dans cet état.'
- source_word: כַּמֵּת
  choice: comme un mort-né
  rationale: Littéralement, l’expression signifie « comme un mort ». La proposition qui suit situe cependant la mort à la sortie du ventre maternel ; « mort-né » rend explicitement cette image sans en atténuer la force.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: lorsqu’il sort du ventre de sa mère
  rationale: L’infinitif précédé de בְּ a une valeur temporelle. Cette formulation conserve l’image concrète et directe de l’hébreu.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: dont la chair est à moitié consumée
  rationale: Le verbe peut littéralement évoquer ce qui est mangé ou dévoré, mais décrit ici l’état de la chair. « Consumée » garde l’image physique saisissante dans un français digne et naturel.
theological_decisions:
- issue: Référent du féminin singulier תְהִי
  choice: « la » renvoie à Miriam
  alternative: Conserver un sujet féminin implicite
  rationale: Le contexte immédiat identifie Miriam comme l’objet de la supplication d’Aaron ; le pronom français explicite seulement la référence grammaticale.
- issue: Degré d’explicitation de כַּמֵּת
  choice: « comme un mort-né » dans le texte
  alternative: « comme une personne morte », avec l’image de la mort à la naissance précisée en note
  rationale: La suite du verset décrit celui qui sort déjà dans cet état du ventre maternel. « Mort-né » communique clairement l’image globale, tandis que la note signale la formulation hébraïque plus générale.
translation_notes:
  register: Français international moderne, naturel et digne. La supplication demeure pressante, et l’image corporelle volontairement dure du texte hébreu est conservée sans archaïsme.
