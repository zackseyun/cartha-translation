  text: Après cela, le peuple partit de Hatséroth et campa dans le désert de Parân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Après cela
  rationale: Marque la succession temporelle après les événements précédents; formulation naturelle en français moderne.
- source_word: נָסְעוּ
  choice: partit
  rationale: Le verbe נסע désigne ici le fait de lever le camp et de se mettre en route; « partit » rend ce mouvement avec simplicité dans le contexte.
- source_word: הָעָם
  choice: le peuple
  rationale: Désigne collectivement la communauté d’Israël; « le peuple » est la formulation française habituelle.
- source_word: מֵחֲצֵרוֹת
  choice: de Hatséroth
  rationale: Nom de lieu translittéré selon une forme française courante, avec la préposition de provenance.
- source_word: וַיַּחֲנוּ
  choice: et campa
  rationale: Le verbe חנה signifie établir son camp; le singulier français s’accorde naturellement avec le nom collectif « le peuple ».
- source_word: בְּמִדְבַּר
  choice: dans le désert de
  rationale: מִדְבָּר désigne une région aride et inhabitée; « désert » est clair, naturel et approprié au cadre géographique du récit.
- source_word: פָּארָן
  choice: Parân
  rationale: Nom de lieu translittéré sous une forme française reconnaissable.
