  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: fr
  text: 'Aaron dit à Moïse : « Je t’en prie, mon seigneur, ne fais pas peser sur nous le péché[a], car nous avons agi follement et nous avons péché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne nous tiens pas pour coupables ».
    reason: Alternative contextuelle pour תָשֵׁת עָלֵינוּ חַטָּאת, qui peut présenter la faute comme un poids imposé ou insister sur la culpabilité qui en résulte.
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Je t’en prie, mon seigneur
  rationale: בִּי introduit une supplication insistante, rendue naturellement par « Je t’en prie ». אֲדֹנִי est ici une marque de déférence adressée à Moïse, sans portée divine ; « mon seigneur » conserve cette relation hiérarchique.
- source_word: אַל נָא
  choice: ne fais pas
  rationale: La nuance de supplication portée par נָא est déjà exprimée par « Je t’en prie » ; la répéter alourdirait inutilement la phrase.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: ne fais pas peser sur nous le péché
  rationale: Cette formulation conserve l’image de quelque chose placé sur les coupables, tout en étant idiomatique en français. חַטָּאת peut désigner le péché ou la culpabilité ; « le péché » reste la traduction la plus directe.
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: car nous avons agi follement
  rationale: Le niphal de יאל exprime ici une conduite insensée ou moralement folle. « Agir follement » garde la dimension morale de l’aveu et le lien causal de la supplication.
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: et nous avons péché
  rationale: Le second membre explicite et renforce la confession. En français, le « car » initial porte naturellement sur les deux verbes, sans qu’il soit nécessaire de le répéter.
theological_decisions:
- issue: Sens de אֲדֹנִי adressé à Moïse
  choice: mon seigneur
  alternative: monsieur / mon maître
  rationale: Il s’agit d’un titre humain de respect et non d’un titre divin. « Mon seigneur » préserve la forte déférence d’Aaron sans identifier Moïse à Dieu.
- issue: Rapport de חַטָּאת à la faute et à la culpabilité
  choice: le péché
  alternative: la culpabilité
  rationale: 'Le contexte permet les deux nuances : l’acte fautif et la charge qui en découle. Le texte principal garde le terme concret « péché », tandis que la note signale l’autre lecture possible.'
translation_notes:
  register: Français international moderne, digne et accessible. La supplication est vive sans être familière. « Mon seigneur » conserve la déférence ancienne du dialogue, tandis que « fais peser » rend la métaphore hébraïque avec naturel.
