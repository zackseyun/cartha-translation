source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: fr
  text: 'Ils dirent : « Est-ce vraiment seulement par Moïse que Yahweh a parlé ? Ne nous a-t-il pas aussi parlé par notre intermédiaire ? » Et Yahweh entendit cela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Est-ce vraiment seulement à Moïse que Yahweh a parlé ? Ne nous a-t-il pas aussi parlé ? » La préposition hébraïque peut désigner soit l’intermédiaire, soit le destinataire de la parole divine ; le texte retient « par » parce que le contexte concerne l’autorité prophétique.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol de אמר poursuit naturellement le récit et introduit le discours direct. Le sujet pluriel renvoie à Miriam et Aaron dans le contexte immédiat.
- source_word: הֲרַק אַךְ
  choice: Est-ce donc seulement
  rationale: La tournure interrogative avec les deux particules restrictives donne une contestation appuyée. « donc seulement » exprime à la fois l’insistance et l’exclusivité en français naturel.
- source_word: בְּמֹשֶׁה
  choice: par Moïse
  rationale: Avec דבר dans ce contexte prophétique, ב peut marquer l’intermédiaire de la parole divine. « par Moïse » conserve cette lecture sans exclure l’autre possibilité, « à Moïse », signalée en note.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh a parlé
  rationale: דבר désigne ici la parole divine, et le parfait se rend naturellement par le passé composé. Le nom יהוה est translittéré « Yahweh ».
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: N’a-t-il pas aussi parlé par nous ?
  rationale: La construction parallèle invite à conserver « par » dans les deux questions. Miriam et Aaron revendiquent ainsi un rôle de médiateurs de la parole divine.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Et Yahweh l’entendit
  rationale: 'Le pronom « l’ » explicite sobrement l’objet sous-entendu en hébreu : les paroles qui viennent d’être prononcées. Le passé simple convient au registre narratif biblique tout en restant intelligible.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Valeur de la préposition ב avec דבר
  choice: par Moïse / par nous
  alternative: à Moïse / à nous
  rationale: Le contexte porte sur l’autorité prophétique et favorise la valeur médiatrice, mais l’hébreu permet aussi de comprendre la préposition comme désignant les destinataires; cette ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple maintient une narration biblique soutenue sans archaïsme marqué. Le parallélisme des deux questions est préservé, ainsi que leur ton de contestation.
