  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: fr
  text: 'Il n’en est pas ainsi de mon serviteur Moïse : il est fidèle dans toute ma maison[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans toute ma maisonnée ». En hébreu, le mot traduit par « maison » peut désigner une maisonnée ou un domaine, et pas seulement un bâtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Il n’en est pas ainsi
  rationale: Cette tournure rend le contraste correctif et appuyé de l’expression hébraïque dans un français naturel et digne.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte, le terme constitue un titre honorable décrivant la relation et la fonction de Moïse auprès de Dieu, sans mettre l’accent sur la condition servile.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française conventionnelle du nom propre.
- source_word: בְּכָל בֵּיתִי
  choice: dans toute ma maison
  rationale: Cette traduction conserve la préposition et l’image hébraïque de la maison, tout en laissant ouverte sa portée étendue de maisonnée ou de domaine.
- source_word: נֶאֱמָן הוּא
  choice: il est fidèle
  rationale: « Fidèle » exprime ici la fiabilité et la loyauté de Moïse; le pronom indépendant est naturellement rendu avec la copule en français.
theological_decisions:
- issue: Sens de « ma maison » relativement au rôle de Moïse
  choice: Conserver dans le texte l’image « dans toute ma maison ».
  alternative: « dans toute ma maisonnée » ou « parmi tout mon peuple »
  rationale: L’hébreu peut viser la maisonnée ou le domaine de Dieu, notamment sa communauté, mais il emploie explicitement l’image de la maison. La conserver préserve l’ambiguïté et les résonances intertextuelles sans imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. « Il n’en est pas ainsi » marque nettement le contraste avec ce qui précède; « maison » maintient la métaphore de l’original.
