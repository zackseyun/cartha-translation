review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement la condition rhétorique, la honte, l’exclusion hors du camp pendant sept jours et le retour ultérieur. Toutefois, « elle pourra y être réintégrée » introduit une nuance modale (« pourra ») qui n’est pas marquée par l’imparfait yiqtol passif dans ce contexte prescriptif; la forme française doit exprimer plus directement la conséquence ordonnée.
  naturalness: Le français est moderne et naturel. « Qu’elle soit tenue à l’écart » est possible, mais « qu’elle soit isolée » rend plus nettement l’exclusion imposée par le passif hébreu. La phrase finale gagnne en précision avec « qu’elle soit de nouveau admise » plutôt que le futur de possibilité.
  terminology: « Yahvé », « Moïse », « camp » et « couverte de honte » conviennent au français biblique international contemporain. « Réintégrée » est intelligible mais légèrement administratif et explicite davantage le retour communautaire que ne le fait le verbe אסף; « admise de nouveau » conserve mieux le passif et le contexte spatial.
  issues:
  - severity: medium
    issue: Nuance modale dans « elle pourra y être réintégrée »
    rationale: תֵּאָסֵף est un passif à valeur consécutive/injonctive après les sept jours, non une simple permission ou possibilité. « pourra » affaiblit cette valeur.
  - severity: low
    issue: 'Note b : « recueillie »'
    rationale: « Recueillie » peut évoquer l’accueil ou la prise en charge d’une personne vulnérable et n’est pas l’équivalent le plus clair ici. « admise de nouveau » ou « rassemblée de nouveau » est plus proche du retour après exclusion.
  revised_text: 'Et Yahvé dit à Moïse : « Si son père lui avait craché au visage, ne serait-elle pas couverte de honte[a] pendant sept jours ? Qu’elle soit isolée hors du camp pendant sept jours ; ensuite, qu’elle y soit de nouveau admise[b]. »'
  revised_footnotes:
