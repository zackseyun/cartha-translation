  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה וְ/אָבִ֨י/הָ֙ יָרֹ֤ק יָרַק֙ בְּ/פָנֶ֔י/הָ הֲ/לֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/אַחַ֖ר תֵּאָסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: fr
  text: 'Et Yahvé dit à Moïse : « Si son père lui avait craché au visage, ne serait-elle pas couverte de honte[a] pendant sept jours ? Qu’elle soit isolée hors du camp pendant sept jours ; ensuite, qu’elle y soit de nouveau admise[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’aurait-elle pas honte » ou « ne serait-elle pas humiliée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « qu’elle soit de nouveau recueillie » ou « rassemblée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: יָרֹק יָרַק
  choice: avait craché
  rationale: Dans cette proposition hypothétique, le plus-que-parfait exprime naturellement l’action renforcée par l’infinitif absolu hébreu sans répétition artificielle.
- source_word: בְּפָנֶיהָ
  choice: au visage
  rationale: Cette expression française rend naturellement l’insulte publique évoquée par l’hébreu.
- source_word: תִכָּלֵם
  choice: serait-elle couverte de honte
  rationale: Le nifal désigne ici le fait de subir la honte ou l’opprobre ; cette formulation conserve la question rhétorique et permet de ne pas réduire le sens à un seul sentiment intérieur.
- source_word: תִּסָּגֵר
  choice: qu’elle soit tenue à l’écart
  rationale: La tournure passive conserve l’idée d’isolement imposé tout en restant naturelle en français actuel.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Traduction directe et idiomatique du lieu d’exclusion.
- source_word: תֵּאָסֵף
  choice: elle pourra y être réintégrée
  rationale: Le passif est conservé, et « réintégrée » exprime naturellement le retour dans le camp et la communauté après l’exclusion ; une note signale l’image plus littérale du rassemblement.
theological_decisions:
- issue: Nature de la proposition évoquant le père qui crache
  choice: Une comparaison hypothétique fondant la période de honte et d’exclusion
  alternative: Le rappel littéral d’un événement réellement survenu
  rationale: La construction hébraïque fonctionne comme une condition rhétorique. La traduction maintient cette analogie sans lui ajouter de portée doctrinale ou symbolique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe rhétorique, les passifs et l’exclusion hors du camp sont préservés, tandis que les formulations évitent les calques peu naturels.
