    text: 'Ou : « n’aurait-elle pas honte » ou « ne serait-elle pas humiliée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « qu’elle soit de nouveau recueillie » ou « rassemblée ».'
    reason: lexical_alternative
