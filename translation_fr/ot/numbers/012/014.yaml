revisions:
- from: 'Et Yahvé dit à Moïse : « Si son père lui avait craché au visage, ne serait-elle pas couverte de honte[a] pendant sept jours ? Qu’elle soit tenue à l’écart, hors du camp, pendant sept jours ; ensuite, elle pourra y être réintégrée[b]. »'
  to: 'Et Yahvé dit à Moïse : « Si son père lui avait craché au visage, ne serait-elle pas couverte de honte[a] pendant sept jours ? Qu’elle soit isolée hors du camp pendant sept jours ; ensuite, qu’elle y soit de nouveau admise[b]. »'
  rationale: La révision élimine la modalité non marquée de « pourra » et conserve au dernier verbe sa forme passive, dans la continuité de l’injonction précédente. « Isolée » rend explicitement l’exclusion imposée sans ajouter de sens doctrinal. La note b est ajustée pour que l’alternative littérale soit formulée comme une conséquence prescriptive cohérente avec le contexte.
  reviewer_model: gpt-5.6-terra
