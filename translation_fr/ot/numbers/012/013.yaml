  text: וַ/יִּצְעַ֣ק מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: fr
  text: 'Moïse cria alors vers Yahweh : « Ô Dieu, je t’en prie, guéris-la, je t’en prie ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: cria alors
  rationale: Le verbe צעק exprime ici un cri intense et un appel pressant. « Cria » conserve la force de l’intercession, tandis que « alors » marque naturellement la progression narrative du וַ־.
- source_word: אֶל
  choice: vers
  rationale: Avec un verbe de cri ou d’appel, « crier vers » rend naturellement l’orientation de l’appel exprimée par אֶל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » préserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français actuel, les deux-points introduisent naturellement les paroles qui constituent le cri de Moïse, sans reproduire lourdement la formule hébraïque « en disant ».
- source_word: אֵל
  choice: Ô Dieu
  rationale: אֵל est ici un vocatif. « Ô Dieu » en exprime directement la fonction et garde un registre de prière digne.
- source_word: נָא … נָא
  choice: je t’en prie … je t’en prie
  rationale: La répétition est conservée afin de rendre l’insistance et l’urgence de la supplication hébraïque. « Je t’en prie » est plus naturel et solennel en français dans cette prière que deux occurrences de « s’il te plaît ».
- source_word: רְפָא
  choice: guéris
  rationale: L’impératif de רפא demande directement la guérison de Miriam ; « guéris » est l’équivalent français le plus précis.
- source_word: לָהּ
  choice: la
  rationale: Le pronom féminin singulier renvoie à Miriam et se rend naturellement par le pronom objet direct « la ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la valeur de nom propre sans le remplacer par un titre ni adopter la forme hybride traditionnelle « Jéhovah ».
- issue: Répétition de la particule de supplication נָא
  choice: conserver les deux occurrences
  alternative: n’en rendre qu’une pour alléger le français
  rationale: La répétition fait entendre l’urgence très concise de l’intercession de Moïse. La conserver évite d’effacer une insistance réelle du texte source.
translation_notes:
  register: Français international moderne, direct et digne. La formulation garde la brièveté et l’intensité de la prière. Les deux occurrences de « je t’en prie » reproduisent volontairement l’insistance hébraïque sans recourir à une tournure archaïque.
