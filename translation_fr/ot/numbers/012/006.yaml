language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: fr
  text: 'Il dit : « Écoutez donc mes paroles : s’il y a parmi vous un prophète, moi, Yahweh, je me fais connaître à lui dans une vision[a] ; je lui parle dans un rêve. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je me révèle à lui dans une vision ; je parle avec lui dans un rêve ». Les prépositions hébraïques permettent plusieurs nuances.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol introduit ici le discours direct dans la narration. « Il dit » est naturel en français et n’ajoute pas une valeur temporelle absente du verbe.
- source_word: שִׁמְעוּ נָא
  choice: Écoutez donc
  rationale: L’impératif pluriel est conservé, et « donc » rend la particule נָא comme une insistance solennelle plutôt que comme une simple formule de politesse.
- source_word: דְבָרָי
  choice: mes paroles
  rationale: Le pluriel hébreu est rendu directement dans un registre digne et courant.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: s’il y a parmi vous un prophète
  rationale: Cette formulation française naturelle rend l’expression littérale difficile « s’il y a votre prophète » sans effacer sa portée conditionnelle et communautaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: בַּמַּרְאָה אֵלָיו אֶתְוַדָּע
  choice: je me fais connaître à lui dans une vision
  rationale: La forme hitpael de ידע exprime ici la manifestation ou le dévoilement de soi ; « je me fais connaître » en conserve la nuance réflexive. « Dans une vision » rend naturellement le moyen ou cadre de la révélation.
- source_word: בַּחֲלוֹם אֲדַבֶּר בּוֹ
  choice: je lui parle dans un rêve
  rationale: Avec דבר, la préposition ב peut désigner la personne à qui la parole est adressée. « Je lui parle » est idiomatique en français, tandis que « dans un rêve » conserve le mode de révélation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le Tétragramme ; sa transcription préserve le nom propre sans lui substituer un titre.
- issue: Modes de révélation prophétique
  choice: Dieu se fait connaître dans une vision et parle dans un rêve
  alternative: Dieu apparaît dans une vision et parle par un rêve
  rationale: Le choix conserve le parallélisme et les deux modalités du texte sans définir davantage la nature de l’expérience prophétique.
- issue: Sens de אֲדַבֶּר בּוֹ
  choice: je lui parle
  alternative: je parle avec lui
  rationale: La préposition permet plusieurs nuances. « Je lui parle » exprime naturellement l’adresse divine sans suggérer nécessairement un dialogue réciproque, mais l’ambiguïté prépositionnelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe reste proche du parallélisme hébreu tout en évitant les tournures artificielles. Le marqueur [a] figure dans le texte principal.
