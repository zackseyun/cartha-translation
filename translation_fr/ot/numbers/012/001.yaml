  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: fr
  text: Miriam et Aaron parlèrent contre Moïse à cause de la femme coushite[b] qu’il avait prise[a], car il avait pris une femme coushite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « prendre » peut signifier « épouser » ou « prendre pour femme ».
    reason: lexical_alternative
  - marker: b
    text: Ou « éthiopienne ». L’hébreu dit « coushite », c’est-à-dire une femme originaire de Coush.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר
  choice: parlèrent
  rationale: Le verbe דבר désigne l’acte de parler. Avec בְּמֹשֶׁה dans ce contexte hostile, « parlèrent contre Moïse » exprime naturellement le sens sans transformer le verbe lui-même en « critiquèrent » ou « se plaignirent ».
- source_word: מִרְיָם וְאַהֲרֹן
  choice: Miriam et Aaron
  rationale: L’ordre des noms est conservé. Malgré la forme verbale féminine singulière, qui peut mettre Miriam au premier plan, le sujet coordonné est rendu naturellement au pluriel en français.
- source_word: בְּמֹשֶׁה
  choice: contre Moïse
  rationale: Avec דבר, la préposition ב peut désigner la personne contre laquelle on parle; le contexte confirme la nuance hostile.
- source_word: עַל אֹדוֹת
  choice: à cause de
  rationale: Cette locution indique ici le motif ou l’occasion des paroles prononcées contre Moïse.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: אִשָּׁה peut signifier « femme » ou « épouse ». « Femme » préserve l’ambiguïté lexicale, tandis que le verbe « prendre » dans ce contexte évoque l’union matrimoniale.
- source_word: הַכֻּשִׁית / כֻשִׁית
  choice: coushite
  rationale: Le terme désigne une femme originaire de Coush. « Coushite » reste proche du texte source et évite l’anachronisme possible d’« Éthiopienne ».
- source_word: אֲשֶׁר לָקָח
  choice: qu’il avait prise
  rationale: לקח signifie littéralement « prendre » et peut, dans un contexte matrimonial, vouloir dire « prendre pour femme » ou « épouser ». La formulation retenue conserve l’expression hébraïque; une note en précise l’idiome.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit une explication qui reprend et souligne le motif déjà énoncé.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: il avait pris une femme coushite
  rationale: La répétition de l’hébreu est maintenue afin d’en préserver l’insistance.
theological_decisions:
- issue: Identité et désignation ethnique de la femme de Moïse
  choice: Traduire כֻשִׁית par « coushite » sans identifier cette femme à Séphora ni harmoniser le verset avec les traditions concernant Madian.
  alternative: Employer « Éthiopienne » ou identifier explicitement la femme à Séphora.
  rationale: Le verset la qualifie seulement de coushite. La traduction conserve cette désignation sans trancher une question historique ou harmonisante que le texte ne résout pas.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition du texte hébreu est volontairement conservée. « Coushite » privilégie la transparence historique, et les notes expliquent l’idiome matrimonial ainsi que l’appellation traditionnelle « Éthiopienne ».
