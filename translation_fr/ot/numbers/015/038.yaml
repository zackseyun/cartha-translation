source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: fr
  text: Parle aux fils d’Israël et dis-leur de se faire des franges[a] aux coins de leurs vêtements, de génération en génération, et de mettre un cordon bleu[b] sur la frange de chaque coin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « houppes » (hébreu צִיצִת).
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu תְּכֵלֶת désigne une teinture ou une couleur bleue ou bleu-violet, employée notamment dans les matériaux sacrés d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduit le terme de parenté masculin du texte hébreu tout en restant naturel et intelligible en français biblique moderne.
- source_word: וְעָשׂוּ לָהֶם
  choice: de se faire
  rationale: Après « dis-leur », l’infinitif français rend naturellement la suite hébraïque; la forme pronominale conserve l’idée exprimée par לָהֶם, à savoir qu’ils les feront pour eux-mêmes.
- source_word: צִיצִת
  choice: houppes
  rationale: Désigne ici des assemblages de fils pendants fixés au vêtement. « Houppes » décrit clairement l’objet, tandis que « franges » demeure une possibilité signalée en note.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: aux coins de leurs vêtements
  rationale: כָּנָף signifie littéralement « aile », mais désigne idiomatiquement l’extrémité ou le coin d’un vêtement.
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Expression française naturelle indiquant que cette prescription vaut pour les générations successives.
- source_word: עַל צִיצִת הַכָּנָף
  choice: à la houppe de chaque coin
  rationale: Le singulier hébreu a ici une portée distributive; « chaque coin » explicite cette relation sans modifier le sens.
- source_word: פְּתִיל
  choice: un cordon
  rationale: Le mot désigne un fil torsadé ou un cordon; « cordon » convient à un élément distinct, attaché et visible.
- source_word: תְּכֵלֶת
  choice: bleu
  rationale: Rendu courant et accessible du nom de cette teinture ou couleur employée aussi dans les objets sacrés d’Israël; sa nuance exacte reste incertaine et est précisée en note.
theological_decisions: []
