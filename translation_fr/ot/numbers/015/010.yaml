    issue: « une offrande consumée par le feu » restreint le sens de אִשֶּׁה.
    rationale: Le terme désigne une catégorie d’offrande dans le langage sacerdotal; son association au feu est traditionnelle, mais le sens exact ne doit pas être surdéterminé. Une formulation plus littérale accompagnée d’une note préserve l’ambiguïté.
  - severity: low
    issue: « dont l’odeur est agréable » est moins naturel dans ce registre.
    rationale: « Au parfum agréable » rend naturellement la formule sacrificielle רֵיחַ נִיחֹחַ tout en évitant les connotations modernes potentiellement négatives de « odeur ».
  revised_text: 'Tu présenteras aussi, pour la libation, un demi-hin de vin : une offrande par le feu[a], au parfum agréable pour Yahweh.'
  revised_footnotes:
