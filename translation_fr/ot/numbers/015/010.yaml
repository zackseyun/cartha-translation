  variant: modern international French
source:
  edition: WLC
  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: fr
  text: 'Tu présenteras aussi, pour la libation, un demi-hin de vin : une offrande par le feu[a], au parfum agréable pour Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande consumée par le feu » ou « une offrande faite par le feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: aussi … de vin
  rationale: יַיִן désigne simplement le vin. La conjonction וְ relie cette prescription aux offrandes précédentes; « aussi » rend ce lien naturellement en français.
- source_word: תַּקְרִיב
  choice: tu présenteras
  rationale: Le hiphil de קרב signifie ici apporter ou présenter dans un cadre sacrificiel. « Présenter » conserve cette nuance sans multiplier le mot « offrande ».
- source_word: לַ/נֶּסֶךְ
  choice: pour la libation
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Libation » est le terme français précis et usuel dans ce contexte biblique.
- source_word: חֲצִי הַ/הִין
  choice: un demi-hin
  rationale: La mesure ancienne est conservée plutôt que convertie approximativement en unité moderne.
- source_word: אִשֵּׁה
  choice: une offrande consumée par le feu
  rationale: Le terme sacerdotal אִשֵּׁה est traditionnellement associé au feu sacrificiel. Cette formulation française exprime ce sens sans adopter le moins transparent « mets offert ».
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable
  rationale: Cette expression sacrificielle indique que l’offrande est agréée. La tournure est naturelle et évite de suggérer que l’odeur apaise littéralement Dieu.
- source_word: לַ/יהוָה
  choice: à Yahweh
  rationale: La préposition marque le destinataire de l’offrande, et le tétragramme est translittéré « Yahweh » conformément au choix éditorial du projet.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération maintient le nom personnel présent dans le texte hébreu et suit la convention indiquée pour ce projet.
- issue: Portée de אִשֵּׁה
  choice: une offrande consumée par le feu
  alternative: un mets offert
  rationale: Le mot appartient au vocabulaire sacrificiel sacerdotal et peut être compris soit par son association au feu, soit comme désignant ce qui est présenté à Dieu comme nourriture. Le contexte immédiat et l’usage traditionnel favorisent ici la mention du feu, sans développer davantage le mécanisme du sacrifice.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été réorganisée pour placer naturellement la quantité et la matière de la libation, tout en conservant le hin comme mesure ancienne.
