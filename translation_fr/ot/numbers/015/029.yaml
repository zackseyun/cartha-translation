  rationale: La révision remplace « parmi vous » par « parmi les Israélites », qui explicite fidèlement le référent pluriel de בְּתוֹכָם, et restitue séparément l’adresse communautaire de לָכֶם par « Pour vous ». « En cas d’acte involontaire » rend naturellement la portée générique de « pour celui qui agit involontairement » sans restreindre le cas à l’un des deux groupes.
