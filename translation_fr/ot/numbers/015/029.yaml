  text: הָֽ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם תּוֹרָ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם לָ/עֹשֶׂ֖ה בִּ/שְׁגָגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: fr
  text: Pour vous, la même loi s’appliquera à l’Israélite de naissance comme à l’étranger résident[a] vivant parmi les Israélites, en cas d’acte involontaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « étranger résident » désigne une personne non israélite établie au sein de la communauté d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: l’Israélite de naissance
  rationale: Cette formulation naturelle précise qu’il s’agit d’un membre autochtone d’Israël, sans reproduire littéralement l’expression idiomatique « fils d’Israël ».
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: comme à l’étranger résident[a] qui vit parmi vous
  rationale: גֵּר désigne ici un non-Israélite durablement établi dans la communauté, et le participe souligne sa résidence parmi elle. « Parmi vous » conserve l’adresse directe portée par לָכֶם.
- source_word: תּוֹרָה אַחַת
  choice: La même loi
  rationale: Dans ce contexte juridique, la formule souligne l’application identique de la règle aux deux groupes. « La même loi » exprime clairement cette égalité.
- source_word: יִהְיֶה לָכֶם
  choice: s’appliquera
  rationale: Cette tournure juridique idiomatique en français rend naturellement l’idée que la loi vaut pour la communauté à laquelle le texte s’adresse.
- source_word: לָעֹשֶׂה
  choice: lorsque l’un ou l’autre agit
  rationale: Le participe singulier a une valeur générique et vise toute personne appartenant à l’un des deux groupes mentionnés.
- source_word: בִּשְׁגָגָה
  choice: involontairement
  rationale: Le terme désigne un acte commis sans intention, par inadvertance ou erreur, dans ce contexte légal et sacrificiel.
theological_decisions:
- issue: Portée de l’égalité juridique entre l’Israélite de naissance et l’étranger résident en cas d’acte involontaire
  choice: La même règle s’applique aux deux groupes lorsqu’une personne agit involontairement.
  alternative: Rendre תּוֹרָה אַחַת plus littéralement par « une seule loi » ou « une même instruction ».
  rationale: Le verset affirme l’égalité d’application de la prescription dans le cas précis des actes involontaires, sans étendre explicitement cette affirmation au-delà du contexte légal immédiat.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été réorganisée pour être naturelle en français tout en conservant les deux groupes, l’unicité de la règle, l’adresse communautaire et le caractère involontaire de l’acte.
