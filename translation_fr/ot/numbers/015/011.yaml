  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: fr
  text: On fera ainsi pour chaque taureau, pour chaque bélier, ou pour une bête de petit bétail[a], parmi les moutons ou parmi les chèvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu שֶׂה désigne plus largement une tête de petit bétail, et non seulement un agneau; la suite précise qu’il s’agit d’un animal parmi les moutons ou parmi les chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: ainsi
  rationale: Adverbe qui introduit la manière prescrite; « ainsi » convient naturellement au registre légal.
- source_word: יֵעָשֶׂה
  choice: on procédera
  rationale: Le nifal à valeur impersonnelle exprime une prescription; cette tournure française en conserve la force sans préciser indûment un agent.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: pour chaque taureau
  rationale: L’article avec אֶחָד vise l’animal pris individuellement; « chaque » restitue cette portée distributive en français naturel.
- source_word: אַיִל
  choice: bélier
  rationale: Terme français courant et précis pour le mouton mâle mentionné dans la liste sacrificielle.
- source_word: הָאֶחָד
  choice: chaque
  rationale: Le numéral répété souligne l’application de la règle à chaque animal pris séparément; le français distributif évite le calque peu naturel « le seul/un ».
- source_word: שֶׂה
  choice: bête de petit bétail
  rationale: Le mot hébreu peut désigner une tête de menu ou petit bétail, ovine ou caprine; ce choix préserve cette étendue, explicitée par la suite du verset.
- source_word: בַכְּבָשִׂים
  choice: parmi les moutons
  rationale: La préposition marque ici l’appartenance à la catégorie ovine.
- source_word: בָעִזִּים
  choice: parmi les chèvres
  rationale: Expression parallèle indiquant l’appartenance à la catégorie caprine.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: pour chaque… pour chaque… ou… qu’elle soit… ou…
  rationale: La traduction conserve les différentes possibilités, tout en réorganisant légèrement les coordinations pour obtenir une phrase française claire.
