  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: fr
  text: Le pardon sera accordé à toute la communauté des Israélites[a], ainsi qu’à l’étranger résident qui séjourne parmi eux[b], car tout le peuple a agi par inadvertance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « toute l’assemblée des fils d’Israël ».
    reason: La note conserve la forme hébraïque de l’expression, tandis que le texte emploie une formulation française naturelle.
  - marker: b
    text: L’« étranger résident » est ici un non-Israélite établi parmi les Israélites, soumis aux lois de la communauté et bénéficiant de sa protection.
    reason: Cette précision rend la catégorie sociale et juridique désignée par גֵּר sans lui attribuer les connotations administratives contemporaines d’« immigré ».
  - marker: c
    text: Ou « car tout le peuple était dans l’erreur ». La fin de la phrase est elliptique ; litt. « car, pour tout le peuple, [c’était] par inadvertance ».
    reason: La note préserve l’ambiguïté de la construction hébraïque compacte et une autre traduction possible de la clause finale.
lexical_decisions:
- source_word: וְנִסְלַח
  choice: recevra le pardon
  rationale: 'Le nifal de סלח a ici un sens passif ou impersonnel : le pardon est accordé à la communauté. « Recevra le pardon » est naturel en français et conserve cette valeur sans introduire un sujet absent de l’hébreu.'
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toute la communauté des Israélites
  rationale: עֵדָה désigne la communauté ou l’assemblée. Dans cette disposition concernant tout le peuple, « communauté » est actuel et digne. « Israélites » rend idiomatiquement בְּנֵי יִשְׂרָאֵל sans laisser entendre que seules les personnes de sexe masculin sont visées.
- source_word: וְלַגֵּר
  choice: ainsi que l’immigré
  rationale: גֵּר désigne un étranger établi au sein d’Israël, bénéficiant de droits et soumis aux obligations de la communauté. « Immigré » exprime clairement cette situation en français moderne; une note en précise la portée historique et juridique.
- source_word: הַגָּר בְּתוֹכָם
  choice: qui séjourne au milieu d’eux
  rationale: Le verbe גור reprend la même racine que גֵּר. « Séjourne » laisse percevoir cet écho tout en rendant naturellement בְּתוֹכָם par « au milieu d’eux ».
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison pour laquelle le pardon s’étend à tous. « Car » convient au registre juridique et soutenu du passage.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: tout le peuple a agi involontairement
  rationale: La proposition hébraïque est elliptique, littéralement proche de « car, pour tout le peuple, [c’était] par inadvertance ». La formulation retenue donne en français le sens contextuel le plus probable tout en signalant en note une autre manière de comprendre cette construction compacte.
theological_decisions:
- issue: Étendue collective du pardon
  choice: Le pardon concerne toute la communauté israélite et inclut l’immigré établi en son sein.
  alternative: Comprendre la disposition comme ne visant que les Israélites de naissance.
  rationale: La mention explicite du גֵּר étend sans ambiguïté le bénéfice de cette mesure à l’étranger résident, sans ajouter de conclusion doctrinale au texte.
- issue: Caractère involontaire de la faute collective
  choice: « tout le peuple a agi involontairement »
  alternative: « tout le peuple s’était égaré » ou, plus littéralement, « pour tout le peuple, c’était par inadvertance »
  rationale: שְׁגָגָה marque l’erreur ou la faute non intentionnelle dans ce contexte légal et sacrificiel. L’hébreu demeure elliptique quant au verbe sous-entendu; la note préserve cette tension sans effacer la distinction avec une faute délibérée.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire garde la tonalité juridique du contexte sans archaïsmes. « Communauté des Israélites » est plus naturel que « assemblée des fils d’Israël », tandis que la note maintient la forme littérale. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
