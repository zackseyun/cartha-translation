  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: fr
  text: Il présentera avec le taureau une offrande de céréales composée de trois dixièmes d’épha[a] de fleur de farine, mélangée à un demi-hin d’huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trois dixièmes » ; dans ce contexte sacrificiel, il s’agit de trois dixièmes d’épha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Il présentera
  rationale: Le hiphil de קרב, dans un contexte sacrificiel, signifie « faire approcher », donc « présenter » ou « offrir ». Le futur prescriptif français rend naturellement l’instruction; l’enchaînement avec le contexte suffit sans traduire mécaniquement le waw.
- source_word: עַל
  choice: avec
  rationale: Ici, la préposition exprime l’accompagnement ou l’ajout de l’offrande céréalière au taureau, et non une position spatiale.
- source_word: בֶּן הַבָּקָר
  choice: le taureau
  rationale: L’expression idiomatique, littéralement « fils du gros bétail », désigne ici le bovin sacrificiel mentionné dans la procédure; « le taureau » est précis et naturel.
- source_word: מִנְחָה
  choice: une offrande de céréales
  rationale: Dans la législation sacerdotale, le terme désigne l’offrande végétale ou céréalière plutôt qu’une offrande générique.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française courante et digne pour la farine fine et raffinée employée dans les offrandes.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: trois dixièmes d’épha
  rationale: L’hébreu dit elliptiquement « trois dixièmes »; dans ce contexte métrologique, il s’agit de dixièmes d’épha. L’unité suppléée est signalée en note.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: pétris avec ... d’huile
  rationale: Le participe décrit la farine mêlée d’huile. « Pétris » convient à la fleur de farine et s’accorde avec « trois dixièmes », tout en exprimant concrètement le mélange.
- source_word: חֲצִי הַהִין
  choice: un demi-hin
  rationale: La translittération conserve l’ancienne unité liquide sans imposer une conversion moderne incertaine.
theological_decisions: []
