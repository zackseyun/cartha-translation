  text: אֵת֩ כָּל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶׁ֑ה מִן הַ/יּ֞וֹם אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה וָ/הָ֖לְאָה לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/023.yaml
  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: fr
  text: tout ce que Yahweh vous a commandé par l’intermédiaire de Moïse[a], depuis le jour où Yahweh a commandé et par la suite, de génération en génération —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse »; expression signifiant ici « par l’intermédiaire de Moïse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure française naturelle conserve la portée exhaustive de כָּל אֲשֶׁר, tandis que אֵת marque l’objet direct.
- source_word: צִוָּה
  choice: a commandé / a donné ses commandements
  rationale: Le parfait présente l’ensemble des prescriptions comme donné. La seconde formulation évite une répétition pesante tout en gardant la même valeur sémantique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֲלֵיכֶם
  choice: vous
  rationale: Avec « commander », le pronom complément rend naturellement en français les destinataires marqués par אֶל.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Littéralement « par la main de Moïse », l’expression désigne ici la médiation ou l’agence; cette formulation en transmet clairement le sens.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: depuis le jour où
  rationale: Cette expression marque naturellement en français le point de départ temporel.
- source_word: וָהָלְאָה
  choice: et par la suite
  rationale: La locution indique la continuation à partir du point temporel mentionné.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette expression française idiomatique traduit la continuité au fil des générations des destinataires.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée temporelle des commandements
  choice: depuis le jour où Yahweh a donné ses commandements et par la suite, de génération en génération
  alternative: depuis le jour où Yahweh a commandé, et désormais, pour vos générations
  rationale: La traduction conserve à la fois le point de départ, la continuation exprimée par וָהָלְאָה et l’application successive indiquée par לְדֹרֹתֵיכֶם, sans préciser davantage quel jour est visé.
translation_notes:
  register: Français international moderne, clair et digne. Le tiret final est conservé parce que le verset poursuit la phrase commencée au verset précédent et achevée au verset suivant.
