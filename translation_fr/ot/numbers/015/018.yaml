  yaml_path: translation/ot/numbers/015/018.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: fr
  text: '« Parle aux fils d’Israël et dis-leur : Quand vous entrerez dans le pays où je vous conduis,[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux enfants d’Israël » ou « aux Israélites ». L’hébreu dit littéralement « fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif intensif introduit l’instruction divine que Moïse doit transmettre. « Parle » en conserve la forme directe et solennelle.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette traduction conserve l’expression familiale et collective littérale de l’hébreu; une note signale les équivalents français plus courants.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: La formulation reproduit naturellement en français la séquence hébraïque habituelle « parle… et dis-leur ».
- source_word: בְּבֹאֲכֶם אֶל הָאָרֶץ
  choice: Quand vous entrerez dans le pays
  rationale: La préposition בְּ avec l’infinitif exprime ici le temps. Avec אֶל et le verbe de mouvement בוא, « entrer dans » rend clairement l’idée d’accès au pays; le futur convient naturellement après « quand » en français.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: où je vous conduis
  rationale: Le participe מֵבִיא présente l’action divine en cours ou orientée vers l’avenir. « Où » intègre naturellement l’adverbe résomptif שָׁמָּה (« là »), tandis que « conduis » exprime le fait que Dieu les fait venir dans le pays.
theological_decisions:
- issue: Agent divin de l’entrée dans le pays
  choice: où je vous conduis
  alternative: où je vous fais entrer
  rationale: « Conduis » préserve l’initiative et l’action continues de Dieu sans préciser davantage le mode de l’entrée. « Fais entrer » serait également possible, mais rendrait le causatif de manière plus explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « fils d’Israël » conserve le langage familial de la formule d’alliance; la note fournit les formulations françaises plus idiomatiques. Le deux-points et la virgule finale indiquent que l’instruction se poursuit au verset suivant.
