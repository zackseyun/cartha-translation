  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל אֶ֨רֶץ֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: fr
  text: '« Parle aux fils d’Israël et dis-leur : “Quand vous entrerez dans le pays où vous habiterez[a], que je vous donne,” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays de vos lieux d’habitation ». Autres traductions possibles : « le pays de vos établissements » ou « le pays où vous résiderez ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Parle à
  rationale: L’impératif piel introduit solennellement l’instruction divine que Moïse doit transmettre; « parle à » conserve la forme directe de l’hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction garde l’expression familiale et masculine explicite de l’hébreu; dans le contexte, elle désigne collectivement le peuple d’Israël.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Formule séquentielle courante qui conserve naturellement la distinction entre « parle » et « dis ».
- source_word: כִּי תָבֹאוּ
  choice: Quand vous entrerez
  rationale: כִּי introduit ici une circonstance future attendue, et בוא avec un pays se rend naturellement en français par « entrer »; le futur convient au point de vue de Moïse avant l’entrée dans le pays.
- source_word: אֶרֶץ מוֹשְׁבֹתֵיכֶם
  choice: le pays où vous habiterez
  rationale: Le pluriel מוֹשְׁבֹתֵיכֶם évoque les lieux d’habitation ou établissements; cette formulation française exprime le sens sans l’étrangeté de « pays de vos habitations ».
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: celui que je vous donne
  rationale: Le participe נֹתֵן présente le don divin comme actuel et certain. Le présent français « je vous donne » préserve cette valeur sans imposer un simple futur.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le rendu retenu préserve la forme filiale masculine du texte source, tout en laissant le contexte indiquer qu’il s’agit de la communauté d’Israël dans son ensemble.
- issue: Aspect du don divin dans נֹתֵן
  choice: celui que je vous donne
  alternative: celui que je vous donnerai; celui que je suis en train de vous donner
  rationale: Le présent conserve l’aspect participial et la certitude du don, sans préciser davantage sa temporalité ni alourdir la phrase.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Fils d’Israël » conserve la formulation du texte source; « le pays où vous habiterez » rend idiomatiquement la construction hébraïque inhabituelle. Le verset demeure syntaxiquement ouvert sur la législation qui suit.
