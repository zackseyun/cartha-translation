  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR » (souvent transcrit « Yahvé » en français).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר introduit un nouvel acte de parole dans le récit. « Parla » rend naturellement en français la formule récurrente de discours divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de la parole ; « à » est l’équivalent idiomatique en français.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Le nom propre est rendu selon sa forme française consacrée.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, l’infinitif לֵאמֹר annonce le contenu du discours qui suit. « En ces termes » évite le calque peu naturel « disant » tout en conservant sa fonction.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte directement le tétragramme. « Yahweh » le traite comme le nom personnel de Dieu et suit la convention demandée, sans le remplacer silencieusement par un titre. La note signale la tradition de traduction française.
translation_notes:
  register: Français international moderne, sobre et digne. La formule « parla à Moïse en ces termes » est idiomatique et convient à l’introduction solennelle d’un discours, sans archaïsme.
