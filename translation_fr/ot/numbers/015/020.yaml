source:
  edition: WLC
  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: fr
  text: De la première part de votre pâte[a], vous présenterez un pain comme contribution[b] ; vous le présenterez de la même manière que la contribution de l’aire de battage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner la pâte elle-même ou, par métonymie, le récipient dans lequel on la pétrit.
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement « offrande par élévation ». Le terme hébreu désigne une contribution mise à part et présentée.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: la première part
  rationale: Le terme désigne le commencement ou la première portion. « La première part » exprime ici clairement le prélèvement d’une portion sans évoquer exclusivement les prémices d’une récolte.
- source_word: עֲרִסֹתֵיכֶם
  choice: votre pâte
  rationale: Le nom peut désigner la pâte pétrie ou, par métonymie, le récipient où l’on pétrit. Dans ce contexte, la pâte est le sens le plus naturel puisque l’on en prélève un pain.
- source_word: חַלָּה
  choice: un pain
  rationale: Le terme désigne ici un pain ou une galette de pain mis à part. « Un pain » est naturel en français moderne et n’évoque pas un gâteau sucré.
- source_word: תָּרִימוּ
  choice: vous présenterez
  rationale: Le hiphil de רום signifie littéralement « élever » et, dans ce contexte cultuel, « présenter » une contribution. « Présenter » rend naturellement la fonction du geste en français sans recourir au calque peu idiomatique « élever ».
- source_word: תְרוּמָה
  choice: contribution
  rationale: Le terme désigne une part mise à part et présentée. « Contribution » en conserve la portée sans imposer le terme traditionnel mais obscur « offrande élevée ».
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: comme la contribution de l’aire de battage
  rationale: Cette formulation conserve la comparaison et le rapport concis du texte hébreu avec la contribution prélevée sur les produits traités à l’aire de battage.
- source_word: גֹּרֶן
  choice: aire de battage
  rationale: Expression française usuelle pour le lieu agricole où l’on bat et traite les céréales.
- source_word: כֵּן
  choice: comme
  rationale: La reprise comparative française « vous le présenterez comme… » exprime naturellement la corrélation marquée par כִּ… כֵּן.
- source_word: אֹתָהּ
  choice: le
  rationale: Le pronom féminin hébreu renvoie à la contribution ou au pain. En français, « le » reprend naturellement « un pain », sans lever davantage la référence.
