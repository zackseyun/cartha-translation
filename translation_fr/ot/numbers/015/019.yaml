id: NUM.15.19
reference: Numbers 15:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: fr
  text: Quand vous mangerez du pain du pays, vous prélèverez une contribution pour Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « vous présenterez une offrande à Yahweh ». Littéralement, l’hébreu dit « vous élèverez une contribution », selon une expression du langage cultuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: Quand vous mangerez
  rationale: La construction avec וְהָיָה et l’infinitif précédé de בְּ introduit ici une circonstance future. Cette formulation française en exprime naturellement la valeur temporelle.
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: du pain du pays
  rationale: מִן a ici une valeur partitive ou de provenance. « Du pain du pays » est naturel en français et maintient le lien avec les produits du pays où Israël entrera.
- source_word: תָּרִימוּ תְרוּמָה
  choice: vous prélèverez une contribution
  rationale: Le hiphil de רום associé à תְרוּמָה constitue une expression cultuelle désignant une part retirée de l’ensemble et présentée à Dieu. « Prélever une contribution » rend à la fois la mise à part et la destination cultuelle sans archaïsme.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition לְ marque ici la destination ou la dédicace de la contribution. Le nom divin יהוה est rendu par « Yahweh » conformément au choix éditorial indiqué.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Nature de la תְרוּמָה
  choice: une contribution
  alternative: une offrande
  rationale: « Contribution » préserve l’idée d’une part mise à part, tandis qu’« offrande » est plus large. La note signale la possibilité de rendre l’expression par un vocabulaire cultuel plus général.
translation_notes:
  register: Français international moderne, clair et digne. Le futur convient à l’instruction relative à l’entrée prochaine dans le pays. « Prélever » évite le calque peu naturel « élever une contribution » tout en gardant l’idée d’une part retirée et consacrée.
