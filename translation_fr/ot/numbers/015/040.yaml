id: NUM.15.40
reference: Numbers 15:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: fr
  text: afin que vous vous souveniez de tous mes commandements, que vous les mettiez en pratique et que vous soyez saints pour votre Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « consacrés à votre Dieu » ou « mis à part pour votre Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit naturellement en français une proposition de but, conformément à la valeur du terme hébreu.
- source_word: תִּזְכְּרוּ
  choice: vous vous souveniez
  rationale: Le subjonctif dépend de « afin que » et conserve l’idée de se rappeler les commandements dans le but d’agir.
- source_word: וַעֲשִׂיתֶם אֶת כָּל מִצְוֺתָי
  choice: de tous mes commandements, que vous les mettiez en pratique
  rationale: La reprise pronominale produit un français naturel tout en rendant עשה comme l’accomplissement concret des commandements, sans lui substituer le vocabulaire de « garder ».
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: que vous soyez saints
  rationale: « Saints » préserve l’étendue éthique, cultuelle et relationnelle de קדש, tandis que le subjonctif poursuit la proposition de but.
- source_word: לֵאלֹהֵיכֶם
  choice: pour votre Dieu
  rationale: « Pour » exprime en français moderne la relation ou l’appartenance marquée par ל sans imposer une interprétation plus étroite.
theological_decisions:
- issue: Sens de la sainteté dans le contexte de l’alliance
  choice: saints pour votre Dieu
  alternative: consacrés à votre Dieu / mis à part pour votre Dieu
  rationale: « Saints » conserve toute la portée théologique du terme hébreu sans réduire la sainteté à la seule séparation rituelle ou à la seule conduite morale.
translation_notes:
  register: Français international moderne, clair et digne. « Mettre en pratique » est plus idiomatique que « faire les commandements » tout en conservant l’idée d’exécution concrète. La coordination répétée avec « que » rend explicite la portée de « afin que » sur les trois verbes.
