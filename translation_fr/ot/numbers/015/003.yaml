language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: fr
  text: et que vous offrirez à Yahweh une offrande par le feu — un holocauste ou un sacrifice — pour accomplir un vœu, comme offrande volontaire ou lors de vos temps fixés[a], pour que s’en dégage une odeur agréable à Yahweh, du gros bétail ou du petit bétail[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lors de vos fêtes fixées ». Le terme hébreu peut désigner largement les temps fixés ou, plus précisément, les fêtes cultuelles.'
    reason: lexical_alternative
  - marker: b
    text: Le « petit bétail » comprend ici les moutons et les chèvres.
    reason: clarification
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: que vous offrirez […] une offrande consumée par le feu
  rationale: Le verbe « faire » prend ici, dans le contexte sacrificiel, le sens idiomatique d’« offrir ». אִשֶּׁה désigne une offrande livrée au feu; « consumée par le feu » est clair et naturel en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Rend directement le nom divin יהוה et exprime le destinataire de l’offrande.
- source_word: עֹלָה
  choice: un holocauste
  rationale: Terme français établi pour le sacrifice entièrement brûlé.
- source_word: אוֹ זֶבַח
  choice: ou un autre sacrifice
  rationale: זֶבַח est un terme général pour un sacrifice abattu. L’ajout de « autre » explicite en français la distinction contextuelle avec l’holocauste sans créer une nouvelle catégorie cultuelle.
- source_word: לְפַלֵּא נֶדֶר
  choice: pour accomplir un vœu
  rationale: L’expression désigne la mise à exécution d’un engagement votif; « accomplir un vœu » est idiomatique et précis.
- source_word: בִנְדָבָה
  choice: comme offrande volontaire
  rationale: Rend la catégorie sacrificielle d’une offrande faite librement, hors de l’obligation d’un vœu.
- source_word: בְּמֹעֲדֵיכֶם
  choice: lors de vos temps fixés
  rationale: Préserve l’étendue de מוֹעֵד, qui peut viser les rendez-vous cultuels en général ou, plus précisément, les fêtes établies.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: afin de produire une odeur agréable
  rationale: Conserve l’image cultuelle et le sens final de l’infinitif, dans un français moderne qui n’accentue pas indûment l’idée d’apaisement.
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: en prenant une bête dans le gros ou le petit bétail
  rationale: בָּקָר désigne les bovins, tandis que צֹאן est le collectif des ovins et caprins. La formulation française rend naturellement le choix d’un animal issu de l’un ou l’autre groupe.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Image sacrificielle רֵיחַ נִיחֹחַ
  choice: une odeur agréable
  alternative: une odeur apaisante; un parfum de bonne odeur
  rationale: Ce rendu maintient la métaphore anthropomorphique du texte tout en évitant d’imposer une théorie particulière de l’apaisement divin.
- issue: Rapport entre עֹלָה et זֶבַח
  choice: un holocauste ou un autre sacrifice
  alternative: un holocauste ou un sacrifice
  rationale: Le texte présente deux possibilités sacrificielles. « autre » évite en français de donner l’impression que l’holocauste ne serait pas lui-même un sacrifice, sans préciser davantage la nature de זֶבַח.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste ouverte par une virgule finale, puisque le verset fait partie de la phrase conditionnelle commencée au verset précédent et poursuivie au verset suivant. Les termes cultuels établis (« holocauste », « offrande volontaire ») sont conservés, avec des formulations explicites là où un calque serait peu naturel.
