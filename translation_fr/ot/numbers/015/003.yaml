revisions:
- from: et que vous offrirez à Yahweh une offrande consumée par le feu — un holocauste ou un autre sacrifice — pour accomplir un vœu, comme offrande volontaire ou lors de vos temps fixés[a], afin de produire une odeur agréable à Yahweh, en prenant une bête dans le gros ou le petit bétail[b],
  to: et que vous offrirez à Yahweh une offrande par le feu — un holocauste ou un sacrifice — pour accomplir un vœu, comme offrande volontaire ou lors de vos temps fixés[a], pour que s’en dégage une odeur agréable à Yahweh, du gros bétail ou du petit bétail[b],
  rationale: La révision évite de présenter toute « offrande par le feu » comme entièrement consumée, retire l’action ajoutée de « prendre une bête », et simplifie « un autre sacrifice » en conformité avec le texte hébreu. Elle conserve la phrase ouverte et la ponctuation finale, puisque le verset appartient à la construction contextuelle qui se poursuit.
