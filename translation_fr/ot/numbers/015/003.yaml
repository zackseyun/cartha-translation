  timestamp: '2026-07-14T12:49:27Z'
review_pass:
  verdict: revise
  source_fidelity: La structure sacrificielle, les catégories (holocauste, sacrifice, vœu, offrande volontaire, temps fixés) et le nom Yahweh sont globalement bien rendus. Toutefois, « consumée par le feu » attribue à אִשֶּׁה une idée de consommation totale qui n’est pas impliquée par ce terme générique d’offrande par le feu. De plus, « en prenant une bête » ajoute une action absente du texte et restreint inutilement « du gros ou du petit bétail », qui qualifie la provenance de l’offrande.
  naturalness: Le français est globalement accessible, mais « afin de produire une odeur agréable » est quelque peu mécanique. « pour que s’en dégage une odeur agréable à Yahweh » conserve l’image cultuelle tout en étant plus idiomatique. « Du gros bétail ou du petit bétail » est plus direct et naturel que la périphrase avec « une bête ».
  terminology: « Yahweh », « holocauste », « vœu » et « offrande volontaire » conviennent. « Offrande par le feu » rend plus exactement אִשֶּׁה que « offrande consumée par le feu ». « Un sacrifice », sans « autre », respecte l’opposition syntaxique du texte sans explicitation interprétative.
  issues:
  - severity: medium
    issue: « offrande consumée par le feu »
    rationale: אִשֶּׁה désigne une offrande présentée par le feu; le mot ne dit pas à lui seul que l’offrande est entièrement consumée. Cette précision convient à l’holocauste, mais pas nécessairement à l’ensemble des offrandes visées.
  - severity: medium
    issue: « en prenant une bête dans le gros ou le petit bétail »
    rationale: Le texte dit littéralement « du gros bétail ou du petit bétail ». Il n’ordonne ni ne décrit explicitement l’action de prendre un animal; cette formulation ajoute donc un élément et alourdit la syntaxe.
  - severity: low
    issue: « un autre sacrifice »
    rationale: Le qualificatif « autre » n’est pas exprimé en hébreu. Le simple « un sacrifice » est clair en français et plus proche de la coordination « un holocauste ou un sacrifice ».
  - severity: low
    issue: « afin de produire une odeur agréable »
    rationale: La tournure est compréhensible, mais elle est peu idiomatique et donne une formulation technique à l’image cultuelle. Une expression évoquant le dégagement d’une odeur est plus naturelle sans modifier le sens.
  revised_text: et que vous offrirez à Yahweh une offrande par le feu — un holocauste ou un sacrifice — pour accomplir un vœu, comme offrande volontaire ou lors de vos temps fixés[a], pour que s’en dégage une odeur agréable à Yahweh, du gros bétail ou du petit bétail[b],
  revised_footnotes:
