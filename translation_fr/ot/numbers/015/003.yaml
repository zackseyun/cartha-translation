    text: 'Ou : « lors de vos fêtes fixées ». Le terme hébreu peut désigner largement les temps fixés ou, plus précisément, les fêtes cultuelles.'
    reason: lexical_alternative
  - marker: b
    text: Le « petit bétail » comprend ici les moutons et les chèvres.
    reason: clarification
  revision_rationale: La révision évite de présenter toute « offrande par le feu » comme entièrement consumée, retire l’action ajoutée de « prendre une bête », et simplifie « un autre sacrifice » en conformité avec le texte hébreu. Elle conserve la phrase ouverte et la ponctuation finale, puisque le verset appartient à la construction contextuelle qui se poursuit.
