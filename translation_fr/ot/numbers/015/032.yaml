  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וַֽ/יִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּ/י֥וֹם הַ/שַּׁבָּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: fr
  text: Alors que les Israélites étaient dans le désert, ils trouvèrent un homme qui ramassait du bois[a] le jour du sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des branches »; littéralement, le terme peut désigner des morceaux de bois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: Le wayyiqtol de היה pose ici le cadre du récit plutôt qu’il n’exprime un devenir; l’imparfait français rend naturellement cette valeur circonstancielle.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation collective rend naturellement en français moderne l’expression hébraïque littérale « fils d’Israël » sans suggérer que seuls les hommes sont concernés.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne la région désertique où Israël séjourne; « désert » est le terme français courant sans imposer nécessairement l’image d’une étendue de sable.
- source_word: וַיִּמְצְאוּ
  choice: ils trouvèrent
  rationale: Le passé simple convient à l’action ponctuelle qui fait avancer ce récit, après la mise en situation à l’imparfait.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom désigne explicitement ici un individu masculin.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: qui ramassait du bois
  rationale: Le participe de קשש associé à עֵצִים décrit l’action de recueillir des morceaux de bois; la tournure relative est naturelle en français et conserve l’aspect en cours.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: Cette formulation conserve explicitement יוֹם, « jour », tout en employant la terminologie française courante.
theological_decisions:
- issue: Désignation du peuple de l’alliance בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: « Les Israélites » exprime clairement le collectif visé en français moderne. La forme littérale « les fils d’Israël » risquerait d’être comprise comme limitée aux hommes, alors que l’expression désigne le peuple.
- issue: Terminologie du sabbat
  choice: le jour du sabbat
  alternative: le sabbat
  rationale: Le texte mentionne explicitement le « jour » sans fournir ici de commentaire théologique sur l’infraction; la traduction conserve cette précision et n’ajoute aucune interprétation.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait établit le cadre et décrit l’action en cours, tandis que le passé simple marque la découverte. Le mot « sabbat » reste en minuscule selon l’usage français.
