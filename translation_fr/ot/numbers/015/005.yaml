source:
  edition: WLC
  text: וְ/יַ֤יִן לַ/נֶּ֨סֶךְ֙ רְבִיעִ֣ית הַ/הִ֔ין תַּעֲשֶׂ֥ה עַל הָ/עֹלָ֖ה א֣וֹ לַ/זָּ֑בַח לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: fr
  text: Tu prépareras aussi un quart de hin de vin pour la libation, avec l’holocauste[a] ou pour le sacrifice, pour chaque agneau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « sur l’holocauste ». La préposition hébraïque peut être rendue ainsi, mais elle indique vraisemblablement ici que la libation accompagne l’holocauste dans le rite.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pour un agneau »; « pour chaque agneau » explicite la valeur distributive de cette prescription.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: aussi … de vin
  rationale: La conjonction וְ rattache cette prescription à la précédente; יַיִן est le terme courant pour le vin. « Aussi » assure un enchaînement naturel en français.
- source_word: לַ/נֶּסֶךְ
  choice: pour la libation
  rationale: Dans ce contexte sacrificiel, נֶסֶךְ désigne l’offrande liquide versée. « Libation » est le terme français précis et usuel dans le registre biblique.
- source_word: רְבִיעִית הַ/הִין
  choice: un quart de hin
  rationale: La formulation conserve la quantité exacte et l’unité ancienne sans conversion conjecturale.
- source_word: תַּעֲשֶׂה
  choice: tu prépareras
  rationale: עָשָׂה signifie fondamentalement « faire », mais, dans ces prescriptions rituelles, « préparer » exprime naturellement l’action concernant le vin destiné à la libation.
- source_word: עַל הָ/עֹלָה
  choice: avec l’holocauste
  rationale: עַל peut formellement signifier « sur », mais indique vraisemblablement ici l’association de la libation à l’holocauste dans le rite.
- source_word: א֣וֹ לַ/זָּבַח
  choice: ou pour le sacrifice
  rationale: זֶבַח désigne ici un sacrifice distinct de l’holocauste; la préposition לְ est conservée par « pour » sans préciser davantage la catégorie sacrificielle.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: pour chaque agneau
  rationale: 'Littéralement « pour l’agneau, l’unique » ou « pour le seul agneau »; dans cette instruction quantitative, la tournure a une valeur distributive: la quantité vaut pour chaque animal.'
theological_decisions: []
