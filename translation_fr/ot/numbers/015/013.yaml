    text: Ou « une offrande faite par le feu, d’une odeur apaisante pour Yahweh ». Le terme rendu par « offrande par le feu » peut aussi être compris comme « offrande alimentaire ».
    reason: lexical_alternative
  revision_rationale: La correction rétablit la construction finale de l’hébreu, évite l’ajout d’une situation temporelle et emploie pour אִשֶּׁה un terme français suffisamment large. La note maintient les options lexicales sans imposer une interprétation théologique de l’expression « odeur apaisante ».
