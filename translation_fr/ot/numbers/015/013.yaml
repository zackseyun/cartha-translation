source:
  edition: WLC
  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Toute personne née dans le pays fera ainsi ces choses afin de présenter à Yahweh une offrande par le feu, d’une odeur agréable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande faite par le feu, d’une odeur apaisante pour Yahweh ». Le terme rendu par « offrande par le feu » peut aussi être compris comme « offrande alimentaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: Toute personne née dans le pays
  rationale: Le syntagme désigne distributivement chaque membre autochtone de la communauté, par contraste avec l’étranger résident au verset suivant. Le masculin singulier hébreu a ici une portée représentative et n’exclut pas les femmes.
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: procédera ainsi pour faire ces offrandes
  rationale: L’imparfait a une valeur prescriptive. Le démonstratif renvoie aux actes et éléments sacrificiels prescrits dans le contexte; «ces offrandes» rend ce renvoi plus clairement en français sans en modifier la portée.
- source_word: לְהַקְרִיב
  choice: lorsqu’elle présentera
  rationale: Dans ce contexte cultuel, le verbe signifie présenter ou offrir. La construction française explicite naturellement la circonstance visée par la prescription.
- source_word: אִשֵּׁה
  choice: un sacrifice consumé par le feu
  rationale: Le terme technique désigne une offrande faite par le feu. Cette formulation française reste compréhensible tout en conservant l’élément du feu, contrairement à «offrande alimentaire», interprétation possible mais moins transparente ici.
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur lui est agréable
  rationale: L’expression sacrificielle indique une odeur agréée par Dieu. Le pronom rend explicitement en français le rapport à Yahweh déjà exprimé dans l’hébreu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom propre «Yahweh», conformément à sa fonction de nom divin dans le texte source.
theological_decisions:
- issue: Portée du masculin singulier הָאֶזְרָח
  choice: Toute personne née dans le pays
  alternative: Tout homme né dans le pays
  rationale: La forme est grammaticalement masculine, mais sa fonction distributive dans cette instruction légale est générique. «Personne» transmet cette portée sans ajouter une restriction aux seuls hommes.
- issue: Sens de אִשֵּׁה
  choice: un sacrifice consumé par le feu
  alternative: une offrande alimentaire
  rationale: L’étymologie et l’usage cultuel permettent des formulations concurrentes. Le texte principal conserve le lien manifeste avec le feu, tandis que la note signale l’autre analyse lexicale reconnue.
- issue: Expression רֵיחַ נִיחֹחַ
  choice: dont l’odeur lui est agréable
  alternative: d’une odeur apaisante pour Yahweh
  rationale: La traduction exprime l’agrément divin sans préciser que l’offrande apaise Dieu, nuance possible mais théologiquement plus interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur garde la force prescriptive du discours légal. «Née dans le pays» évite le terme administratif moderne «citoyenne» et maintient le contraste contextuel avec l’étranger résident.
