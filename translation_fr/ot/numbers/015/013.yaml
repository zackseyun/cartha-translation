revisions:
- from: Toute personne née dans le pays procédera ainsi pour faire ces offrandes, lorsqu’elle présentera à Yahweh un sacrifice consumé par le feu, dont l’odeur lui est agréable.[a]
  to: Toute personne née dans le pays fera ainsi ces choses afin de présenter à Yahweh une offrande par le feu, d’une odeur agréable.[a]
  rationale: La correction rétablit la construction finale de l’hébreu, évite l’ajout d’une situation temporelle et emploie pour אִשֶּׁה un terme français suffisamment large. La note maintient les options lexicales sans imposer une interprétation théologique de l’expression « odeur apaisante ».
