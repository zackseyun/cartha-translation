review_pass:
  verdict: revise
  source_fidelity: La proposition introduit une circonstance temporelle absente du texte (« lorsqu’elle présentera ») et transforme la relation finale de לְהַקְרִיב (« afin de présenter »). « Sacrifice consumé par le feu » peut aussi suggérer indûment que l’offrande entière est brûlée. La révision conserve le renvoi à « ces choses », la valeur prescriptive et le caractère technique, mais ambigu, de אִשֶּׁה.
  naturalness: La formulation révisée est un français international moderne et juridique naturel. « Faire ainsi ces choses » garde volontairement le renvoi textuel aux prescriptions précédentes sans expliciter davantage leur contenu.
  terminology: « Personne née dans le pays » convient au sens générique de הָאֶזְרָח dans ce contexte. « Yahweh » rend le tétragramme. « Offrande par le feu » évite de préciser à tort que le sacrifice est entièrement consumé, tandis que la note préserve l’alternative lexicale « offrande alimentaire » et la nuance traditionnelle de רֵיחַ נִיחֹחַ.
  issues:
  - severity: medium
    issue: « lorsqu’elle présentera » ajoute une subordonnée temporelle.
    rationale: L’infinitif לְהַקְרִיב exprime ici le but de l’action prescrite, non une circonstance temporelle distincte.
  - severity: medium
    issue: « sacrifice consumé par le feu » est trop spécifique.
    rationale: אִשֶּׁה désigne une offrande faite/par le feu; le mot ne dit pas à lui seul que toute l’offrande est consumée.
  - severity: low
    issue: « dont l’odeur lui est agréable » rend le référent du pronom moins direct.
    rationale: La formulation « d’une odeur agréable à Yahweh » rattache explicitement la formule cultuelle à Yahweh, conformément au texte hébreu.
  revised_text: Toute personne née dans le pays fera ainsi ces choses afin de présenter à Yahweh une offrande par le feu, d’une odeur agréable.[a]
  revised_footnotes:
