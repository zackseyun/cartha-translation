id: NUM.15.27
reference: Numbers 15:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: fr
  text: Mais si une personne pèche involontairement, elle présentera une chèvre d’un an en sacrifice pour le péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner l’offrande qui traite le péché ou l’impureté, et pas seulement le péché lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Dans le contexte législatif, la conjonction introduit un cas particulier en contraste léger avec ce qui précède.
- source_word: נֶפֶשׁ אַחַת
  choice: une personne
  rationale: Dans ce contexte juridique, נֶפֶשׁ désigne une personne; אַחַת en marque le singulier.
- source_word: תֶּחֱטָא
  choice: pèche
  rationale: Le présent convient à la condition générale formulée par cette loi casuistique.
- source_word: בִשְׁגָגָה
  choice: involontairement
  rationale: Le terme désigne une faute commise sans intention, par opposition à un acte délibéré ou commis avec défi.
- source_word: וְהִקְרִיבָה
  choice: elle présentera
  rationale: Le hiphil de קרב signifie ici apporter ou présenter une offrande. Le futur français exprime naturellement la conséquence juridique.
- source_word: עֵז
  choice: une chèvre
  rationale: Le nom hébreu désigne ici une femelle de la chèvre; « chèvre » exprime naturellement ce sexe en français.
- source_word: בַּת שְׁנָתָהּ
  choice: d’un an
  rationale: L’expression idiomatique indique que l’animal est âgé d’un an ou se trouve dans sa première année.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans le vocabulaire sacrificiel, חַטָּאת désigne l’offrande qui traite le péché ou l’impureté, et non simplement le péché lui-même.
theological_decisions:
- issue: Genre grammatical de la personne qui pèche
  choice: « une personne… elle »
  alternative: Employer une tournure masculine générique ou reformuler pour éviter le pronom
  rationale: Les formes hébraïques sont au féminin singulier parce qu’elles s’accordent avec נֶפֶשׁ, nom féminin. Le français suit naturellement le genre grammatical de « personne »; cela ne limite pas la loi aux femmes.
- issue: Sens sacrificiel de חַטָּאת
  choice: « sacrifice pour le péché » dans le texte principal
  alternative: « sacrifice de purification »
  rationale: « Sacrifice pour le péché » reste clair et traditionnel, tandis qu’une note conserve l’autre analyse lexicale, qui met davantage en relief la fonction purificatrice du rite.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste concise; « elle » reprend grammaticalement « une personne » sans attribuer la prescription exclusivement aux femmes.
