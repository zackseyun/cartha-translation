  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר avec le waw narratif fait progresser le récit et introduit solennellement une parole divine. « Parla » conserve cette valeur mieux que le simple « dit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé dans le corps du texte par le titre traditionnel « le SEIGNEUR ».
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, l’infinitif « disant » annonce le contenu du discours. « En ces termes » restitue naturellement cette fonction en français sans la lourdeur de « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin. Le conserver sous la forme « Yahweh » distingue le nom propre du titre אֲדֹנָי et évite de remplacer silencieusement le tétragramme par un titre.
translation_notes:
  register: Français moderne, clair et digne. La tournure « parla à Moïse en ces termes » garde le caractère formulaire de l’hébreu tout en restant idiomatique.
