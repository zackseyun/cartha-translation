id: NUM.15.8
reference: Numbers 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: fr
  text: Lorsque tu offriras un taureau en holocauste ou en sacrifice, pour accomplir un vœu ou en sacrifices de paix à Yahweh,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  choice: Quand
  rationale: Dans cette instruction rituelle, la construction introduit le cas qui sera ensuite développé. « Quand » est naturel en français et convient au caractère procédural du passage.
- source_word: תַעֲשֶׂה
  choice: tu prépareras
  rationale: Le verbe עשה signifie largement « faire ». Dans ce contexte sacrificiel, « préparer » exprime naturellement l'action sans la réduire au seul acte d'offrir.
- source_word: בֶן בָּקָר
  choice: un bovin
  rationale: L'expression désigne une bête du gros bétail sans préciser ici de façon certaine le sexe ni l'âge. « Bovin » préserve cette généralité mieux que « taureau » ou « jeune taureau ».
- source_word: עֹלָה
  choice: holocauste
  rationale: Terme français traditionnel et précis pour le sacrifice entièrement consumé.
- source_word: אוֹ זָבַח
  choice: ou en sacrifice
  rationale: זבח est ici un terme sacrificiel général; « sacrifice » reste naturel et évite de surspécifier le rite.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: pour accomplir un vœu
  rationale: L'expression idiomatique renvoie à l'exécution concrète de ce qui a été voué. « Accomplir un vœu » est clair et fidèle en français.
- source_word: אוֹ שְׁלָמִים
  choice: ou comme sacrifice de paix
  rationale: « Sacrifice de paix » conserve la catégorie cultuelle traditionnelle tout en laissant ouvertes les nuances de communion et de bien-être associées à שְׁלָמִים.
- source_word: לַ/יהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici le destinataire du sacrifice; « pour » est idiomatique en français. Le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d'alliance plutôt que de le remplacer par un titre.
- issue: Rendu de שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion; sacrifice de bien-être
  rationale: Le terme désigne une catégorie sacrificielle dont l'étymologie et l'usage peuvent évoquer la paix, le bien-être et la communion. Le rendu retenu reste reconnaissable sans réduire le sens à une seule nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple convient à la formulation législative introduite par « Quand ». La phrase demeure ouverte, comme dans l'hébreu, car l'instruction se poursuit au verset suivant.
