review_pass:
  verdict: revise
  source_fidelity: Le sens sacrificiel est globalement bien rendu, et « Yahweh » reflète correctement le tétragramme. Toutefois, בֶן־בָּקָר désigne ici naturellement un taureau (ou jeune taureau), non le terme technique et générique « bovin ». Le pluriel de שְׁלָמִים mérite aussi d’être conservé.
  naturalness: « Préparer un bovin en holocauste » est lourd et peu idiomatique en français moderne. Dans ce contexte, « offrir un taureau en holocauste ou en sacrifice » est naturel sans ajouter de précision rituelle indue. « À Yahweh » exprime plus directement le destinataire que « pour Yahweh ».
  terminology: « Holocauste » et « sacrifices de paix » sont des équivalents établis et appropriés. Le pluriel « sacrifices de paix » correspond à la forme hébraïque plurielle. Les variantes de note doivent être au pluriel pour correspondre au terme annoté.
  issues:
  - severity: medium
    issue: « un bovin » est trop technique et insuffisamment naturel dans ce contexte.
    rationale: L’expression בֶן־בָּקָר est une désignation sacrificielle usuelle d’un taureau/jeune taureau. « Taureau » est l’équivalent français naturel et précis dans une instruction sur les offrandes.
  - severity: medium
    issue: « préparer un bovin en holocauste » est une construction française maladroite.
    rationale: Le français idiomatique emploie « offrir » pour l’animal présenté comme holocauste ou sacrifice. Ce choix rend adéquatement l’action cultuelle impliquée par עשה dans ce contexte.
  - severity: low
    issue: Le singulier « sacrifice de paix » ne reflète pas le pluriel שְׁלָמִים.
    rationale: Le pluriel « sacrifices de paix » préserve la morphologie du terme source et s’accorde avec les alternatives de traduction.
  revised_text: Lorsque tu offriras un taureau en holocauste ou en sacrifice, pour accomplir un vœu ou en sacrifices de paix à Yahweh,
  revised_footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ».
    reason: lexical_alternative
  revision_rationale: La révision remplace une formulation technique et peu idiomatique par un français naturel, maintient la portée ouverte de la phrase en vue du verset suivant, rend le destinataire par « à Yahweh » et conserve le pluriel de la catégorie sacrificielle שְׁלָמִים.
