revisions:
- from: Quand tu prépareras un bovin en holocauste ou en sacrifice, pour accomplir un vœu ou comme sacrifice de paix[a] pour Yahweh,
  to: Lorsque tu offriras un taureau en holocauste ou en sacrifice, pour accomplir un vœu ou en sacrifices de paix à Yahweh,
  rationale: La révision remplace une formulation technique et peu idiomatique par un français naturel, maintient la portée ouverte de la phrase en vue du verset suivant, rend le destinataire par « à Yahweh » et conserve le pluriel de la catégorie sacrificielle שְׁלָמִים.
  reviewer_model: gpt-5.6-terra
