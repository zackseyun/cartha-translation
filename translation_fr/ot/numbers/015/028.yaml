source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: fr
  text: Le prêtre fera l’expiation pour la personne qui commet une faute par inadvertance, en péchant par inadvertance devant Yahweh, afin de faire l’expiation pour elle, et il lui sera pardonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: fera l’expiation
  rationale: Le piel de כפר désigne ici l’accomplissement du rite d’expiation. Cette formulation française est claire et traditionnelle sans imposer une théorie particulière de l’expiation.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent direct du ministre du culte qui accomplit le rite.
- source_word: עַל הַנֶּפֶשׁ
  choice: pour la personne
  rationale: נֶפֶשׁ désigne ici l’être humain concerné, et non une âme immatérielle distincte du corps.
- source_word: הַשֹּׁגֶגֶת בְּחֶטְאָה בִשְׁגָגָה
  choice: qui s’est égarée en péchant involontairement
  rationale: « S’est égarée » rend le participe de שׁגג, tandis que « en péchant involontairement » rend חטא et la circonstance exprimée par בִשְׁגָגָה. La formulation conserve les deux éléments hébreux sans produire une répétition artificielle en français.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime la présence ou la relation devant quelqu’un; le nom divin יהוה est translittéré « Yahweh ».
- source_word: לְכַפֵּר עָלָיו
  choice: Il fera ainsi l’expiation pour elle
  rationale: La reprise de « fera l’expiation » conserve la répétition de כפר. « Ainsi » indique naturellement la valeur explicative ou résultative de l’infinitif sans modifier le contenu du rite.
- source_word: וְנִסְלַח לוֹ
  choice: et elle recevra le pardon
  rationale: Le passif hébreu indique que le pardon est accordé à la personne. Cette tournure française est naturelle et maintient Dieu comme agent implicite.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Sens de כפר
  choice: faire l’expiation
  alternative: faire propitiation
  rationale: « Expiation » préserve le sens cultuel général du verbe sans trancher entre des explications théologiques plus étroites du mécanisme du rite.
- issue: Agent du pardon dans וְנִסְלַח לוֹ
  choice: agent laissé implicite
  alternative: Yahweh lui pardonnera
  rationale: La forme hébraïque est passive et ne nomme pas explicitement l’agent; la traduction conserve cette discrétion.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin grammatical (« elle ») reprend naturellement « la personne » et reste générique. La division en deux phrases allège la syntaxe sans supprimer la répétition cultuelle de כפר.
