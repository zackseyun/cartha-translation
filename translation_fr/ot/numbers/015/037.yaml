lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe אָמַר introduit naturellement une parole en français ; le passé simple convient au registre narratif biblique.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Cette forme française traditionnelle représente le tétragramme tout en le distinguant typographiquement du titre ordinaire « Seigneur ».
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: Rend directement le destinataire de la parole.
- source_word: לֵאמֹר
  choice: ':'
  rationale: La formule hébraïque introduit ici les paroles qui suivent ; en français naturel, les deux-points en remplissent la fonction sans le calque lourd « en disant ».
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: « le SEIGNEUR » suit l'usage français largement reconnu et ne tranche pas la vocalisation ancienne du tétragramme.
translation_notes:
  register: Français moderne, sobre et digne. La coordination initiale hébraïque n'est pas reproduite mécaniquement, et לֵאמֹר est rendu par la ponctuation introductive, puisque la parole divine se poursuit au verset suivant.
