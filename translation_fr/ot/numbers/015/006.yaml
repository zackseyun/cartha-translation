source:
  edition: WLC
  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: fr
  text: 'Ou, pour un bélier, tu prépareras une offrande de céréales : deux dixièmes de farine fine[a], mélangée avec un tiers de hin d’huile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « deux dixièmes »; l’unité sous-entendue est l’épha, selon le système de mesures sacrificielles. Il s’agit donc de deux dixièmes d’épha.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Ou
  rationale: Marque simplement l’autre possibilité dans la série d’instructions sacrificielles, sans ajouter une condition absente de l’hébreu.
- source_word: לָ/אַ֨יִל֙
  choice: pour un bélier
  rationale: אַיִל désigne un bélier, et le préfixe ל exprime ici la relation ou la destination.
- source_word: תַּעֲשֶׂ֣ה מִנְחָ֔ה
  choice: tu prépareras comme offrande de céréales
  rationale: Dans ce contexte rituel, עשה signifie préparer, tandis que מִנְחָה désigne spécifiquement l’offrande végétale faite de farine.
- source_word: סֹ֖לֶת
  choice: fleur de farine
  rationale: Expression française traditionnelle mais encore intelligible pour une farine très fine, conforme au sens de סֹלֶת.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: deux dixièmes
  rationale: Conserve l’expression elliptique de l’hébreu; l’unité sous-entendue est l’épha dans le système de mesures sacrificielles.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: pétrie avec … d’huile
  rationale: Le participe féminin se rapporte à la farine. « Pétrie » rend naturellement l’incorporation de l’huile à la farine dans ce contexte, sans suggérer nécessairement une pâte achevée.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: un tiers de hin
  rationale: Rend directement la fraction tout en conservant l’unité de mesure ancienne.
