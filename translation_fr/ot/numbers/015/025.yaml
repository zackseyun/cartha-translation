language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: fr
  text: Le prêtre fera l’expiation pour toute la communauté des Israélites, et il leur sera pardonné, car c’était une faute involontaire et ils ont apporté leur offrande — un sacrifice consumé par le feu pour Yahweh — ainsi que leur sacrifice pour le péché[a] devant Yahweh, à cause de leur faute involontaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «leur sacrifice de purification». Le terme hébreu traditionnellement rendu par «sacrifice pour le péché» peut aussi mettre l’accent sur la purification accomplie par le rite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: fera l’expiation
  rationale: Le piel de כפר, dans ce contexte sacrificiel, exprime l’accomplissement du rite d’expiation; cette tournure française conserve sa portée cultuelle et théologique.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: pour toute la communauté des Israélites
  rationale: עַל après כפר signifie ici «pour, en faveur de». «Communauté des Israélites» rend naturellement עֲדַת בְּנֵי יִשְׂרָאֵל en français moderne sans limiter le groupe aux seuls hommes.
- source_word: וְנִסְלַח לָהֶם
  choice: et il leur sera pardonné
  rationale: Cette construction impersonnelle française respecte le passif hébreu et n’ajoute pas de sujet explicite à l’acte de pardonner.
- source_word: כִּי שְׁגָגָה הִוא
  choice: car c’était une faute involontaire
  rationale: שְׁגָגָה désigne une faute ou transgression commise par inadvertance; «faute involontaire» préserve à la fois la dimension morale et l’absence d’intention.
- source_word: אֶת קָרְבָּנָם
  choice: leur offrande
  rationale: קָרְבָּן est le terme général pour ce qui est présenté à Dieu; «offrande» est clair et usuel.
- source_word: אִשֶּׁה לַיהוָה
  choice: un sacrifice consumé par le feu pour Yahweh
  rationale: אִשֶּׁה désigne une offrande sacrificielle liée au feu. «Sacrifice consumé par le feu» est idiomatique et évite l’expression peu naturelle «offrande faite par feu».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: וְחַטָּאתָם
  choice: ainsi que leur sacrifice pour le péché
  rationale: Dans cette syntaxe, חַטָּאת désigne ce que la communauté apporte; le sens sacrificiel est donc requis. «Sacrifice pour le péché» reste compréhensible et laisse entendre sa fonction.
- source_word: עַל שִׁגְגָתָם
  choice: à cause de leur faute involontaire
  rationale: La reprise du même radical que plus haut est rendue par la même expression; עַל indique ici le motif auquel répond le sacrifice.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription conserve le nom propre présent dans la source au lieu de lui substituer un titre.
- issue: Sens sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le contexte exige le nom d’un sacrifice apporté devant Yahweh. Les deux désignations soulignent des aspects plausibles de sa fonction; le rendu principal conserve le lien lexical explicite avec le péché, et l’autre est signalé en note.
- issue: Agent du pardon
  choice: construction impersonnelle «il leur sera pardonné»
  alternative: Yahweh leur pardonnera
  rationale: L’hébreu emploie un passif sans nommer expressément l’agent. Le français choisi préserve cette retenue tout en laissant intacte l’implication théologique du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique est conservée sans calquer lourdement l’hébreu. «Israélites» est préféré à «fils d’Israël» pour désigner naturellement l’ensemble de la communauté. Le lien étroit entre les deux motifs introduits par כִּי et וְ est maintenu par la coordination.
