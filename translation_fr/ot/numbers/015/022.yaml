  text: וְ/כִ֣י תִשְׁגּ֔וּ וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵ֑לֶּה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: fr
  text: Mais si, par inadvertance, vous vous égarez et n’accomplissez pas tous ces commandements que Yahweh a énoncés à Moïse,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si vous commettez une erreur » ou « si vous péchez involontairement ». Le verbe hébreu évoque le fait de s’égarer ou de se tromper et désigne ici un manquement involontaire aux commandements.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Mais si
  rationale: Introduit naturellement en français le cas conditionnel, avec la légère transition contrastive du contexte légal.
- source_word: תִשְׁגּוּ
  choice: par inadvertance, vous vous égarez
  rationale: Préserve l’image de l’égarement portée par שׁגה ainsi que son caractère involontaire dans ce contexte juridique et cultuel.
- source_word: וְלֹא תַעֲשׂוּ
  choice: et n’accomplissez pas
  rationale: Dans le cadre de commandements, « accomplir » exprime naturellement l’idée de mettre en pratique, sans ajouter une notion absente du texte.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: tous ces commandements
  rationale: Rend directement la totalité marquée par כָּל et le sens juridique et religieux de מִצְוֺת.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: que Yahweh a donnés à Moïse
  rationale: En français, un commandement se « donne » naturellement. Cette formulation rend ici la communication divine exprimée littéralement par « a parlé à Moïse ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Nuance de שׁגה dans le contexte légal
  choice: égarement par inadvertance
  alternative: erreur / péché involontaire
  rationale: Le contexte oppose la faute involontaire à l’acte délibéré. La traduction conserve à la fois cette distinction et l’image lexicale de l’égarement, sans réduire le verbe au seul terme théologique « pécher ».
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « par inadvertance, vous vous égarez » maintient l’image hébraïque tout en explicitant la valeur involontaire imposée par le contexte. La virgule finale signale que la phrase se poursuit au verset suivant.
