source:
  edition: WLC
  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: fr
  text: Pour l’assemblée, il y aura une seule prescription pour vous et pour l’étranger qui réside parmi vous[a]. Ce sera une prescription permanente[b] de génération en génération. Devant Yahvé, l’étranger sera comme vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’immigré » ou « l’étranger résident ».
    reason: Alternative lexicale pour גֵּר, qui désigne ici un étranger établi au sein d’Israël.
  - marker: b
    text: Ou « perpétuelle » ou « pour toujours ».
    reason: עֹולָם peut exprimer une durée indéfinie ou durable; dans cette formule juridique, « permanente » souligne sa validité continue au fil des générations.
lexical_decisions:
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: קָהָל désigne ici la communauté rassemblée. « Assemblée » est actuel, clair et n’ajoute pas une connotation ecclésiastique étrangère au contexte.
- source_word: חֻקָּה אַחַת
  choice: une seule prescription
  rationale: חֻקָּה désigne une règle établie ayant force normative. « Une seule prescription » exprime à la fois son caractère juridique et l’unicité de la règle applicable aux deux groupes.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: pour vous et pour l’étranger qui réside parmi vous
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté, et le participe הַגָּר reprend la même racine. La formulation française rend naturellement son statut de résident tout en conservant la reprise nominale et verbale.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: Dans cette formule juridique, עוֹלָם exprime une validité durable au fil des générations. « Permanente » en communique la force sans imposer une notion philosophique d’éternité.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette expression idiomatique indique que la prescription reste applicable au cours des générations successives.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: l’étranger sera comme vous
  rationale: La construction comparative affirme avec concision la même situation devant Dieu dans le cadre de cette prescription, sans étendre explicitement cette égalité au-delà du contexte juridique immédiat.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: לִפְנֵי signifie « devant » ou « en présence de ». « Devant Yahvé » conserve l’expression relationnelle et cultuelle de l’hébreu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La transcription « Yahvé » représente en français moderne le nom divin exprimé par le tétragramme, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Statut de l’étranger résident dans la législation cultuelle d’Israël
  choice: Le même règlement s’applique aux Israélites et à l’étranger qui réside parmi eux dans le domaine visé par le contexte.
  alternative: Comprendre cette affirmation comme une égalité générale et sans restriction dans tous les domaines.
  rationale: Le verset souligne nettement l’unicité de la prescription et la parité des deux groupes « devant Yahvé », mais le contexte immédiat concerne des dispositions sacrificielles précises. La traduction préserve cette parité sans en élargir explicitement la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’équilibre juridique de l’hébreu, tandis que « l’étranger qui réside parmi vous » évite l’archaïsme de « l’étranger en séjour ». Les marqueurs de notes sont placés immédiatement après les termes concernés.
