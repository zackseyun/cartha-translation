  text: כַּ/מִּסְפָּ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּ֛כָה תַּעֲשׂ֥וּ לָ/אֶחָ֖ד כְּ/מִסְפָּרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/012.yaml
  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: fr
  text: Selon le nombre que vous préparerez[a], vous préparerez ainsi pour chacun, selon leur nombre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que vous ferez ». Le verbe hébreu עשה signifie couramment « faire »; « préparer » précise ici le sens imposé par le contexte sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּ/מִּסְפָּר אֲשֶׁר
  choice: Quel que soit le nombre… que
  rationale: Cette tournure française exprime naturellement la corrélation quantitative introduite par כַּמִּסְפָּר et la relative אֲשֶׁר, sans transformer le nombre en proportion.
- source_word: תַּעֲשׂוּ
  choice: vous préparerez
  rationale: Le verbe עשה signifie largement « faire »; dans le contexte immédiat des sacrifices, « préparer » rend clairement l’action prescrite tout en restant dans son champ sémantique.
- source_word: כָּכָה תַּעֲשׂוּ
  choice: vous procéderez ainsi
  rationale: La formulation restitue l’adverbe כָּכָה (« ainsi, de cette manière ») et évite en français une répétition maladroite de « préparer ».
- source_word: לָ/אֶחָד
  choice: pour chacun
  rationale: 'Le singulier אֶחָד a ici une valeur distributive : l’instruction vaut pour chaque animal ou unité sacrificielle.'
- source_word: כְ/מִסְפָּרָם
  choice: selon leur nombre
  rationale: Cette expression conserve la structure comparative et le suffixe pluriel du texte hébreu, dont le référent demeure contextuel.
- source_word: מִסְפָּר
  choice: nombre d’animaux
  rationale: Le contexte des versets précédents indique que le décompte porte sur les animaux offerts; l’explicitation rend le français intelligible sans modifier la procédure.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et procédural. « Quel que soit le nombre » rend la relation quantitative de manière idiomatique; « vous procéderez ainsi » préserve l’instruction sans lourde répétition. Le futur a valeur prescriptive dans ce contexte légal.
