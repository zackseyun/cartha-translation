  rationale: La révision rétablit la relation directive « selon le nombre… ainsi… » et évite d’ajouter « animaux » au texte. Elle maintient « préparer », choix contextuellement justifié et signalé par une note, tout en conservant l’ambiguïté du référent pluriel final.
