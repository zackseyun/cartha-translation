    rationale: La formule française peut signifier « indépendamment du nombre », tandis que l’hébreu prescrit d’agir conformément au nombre concerné.
  - severity: low
    issue: « d’animaux » explicite un référent absent du verset lui-même.
    rationale: Le contexte porte bien sur des sacrifices animaux, mais le texte source conserve ici un référent implicite; ne pas l’ajouter préserve mieux sa concision et son degré de précision.
