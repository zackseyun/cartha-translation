id: NUM.15.30
reference: Numbers 15:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: fr
  text: Mais la personne qui agit avec défi[a], qu’elle soit Israélite de naissance ou résidente étrangère, outrage Yahweh ; cette personne sera retranchée du milieu de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’une main levée » ; autre traduction possible : « avec arrogance » ou « avec présomption ».'
    reason: Conserver l’image hébraïque et signaler les principales nuances lexicales de l’expression.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: la personne
  rationale: Dans ce texte juridique, נֶפֶשׁ désigne la personne tout entière, et non une « âme » distincte du corps.
- source_word: תַּעֲשֶׂה
  choice: agit
  rationale: Le verbe עשה est général (« faire, agir »). « Agit » convient au contexte sans préciser indûment la nature de l’acte.
- source_word: בְּיָד רָמָה
  choice: avec défi
  rationale: L’expression signifie littéralement « d’une main levée » et évoque un acte ouvertement provocateur et présomptueux. « Avec défi » en restitue naturellement la force en français, tandis que la note conserve l’image hébraïque.
- source_word: הָאֶזְרָח
  choice: un autochtone
  rationale: Le terme désigne un membre natif du pays ou de la communauté, par contraste avec l’immigré résident.
- source_word: הַגֵּר
  choice: un immigré
  rationale: גֵּר désigne un non-autochtone établi au sein d’Israël et relevant de sa protection et de sa loi. « Immigré » est actuel et plus précis ici que le terme général « étranger ».
- source_word: אֶת־יְהוָה הוּא מְגַדֵּף
  choice: outrage Yahweh
  rationale: גדף exprime le mépris grave dirigé contre Dieu, par la parole ou par l’acte. « Outrage » préserve cette portée sans réduire nécessairement l’infraction à une parole blasphématoire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin dans le projet, plutôt que substitution par un titre.
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: La formule juridique et d’alliance indique une exclusion ou un jugement sévère sans préciser ici s’il s’agit d’une exécution, d’une expulsion ou d’un jugement divin.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: du milieu de son peuple
  rationale: Cette formulation proche de l’hébreu exprime le retrait hors de la communauté. Le possessif français reste naturellement accordé avec « peuple », tandis que le référent est « la personne ».
theological_decisions:
- issue: Nature de la faute
  choice: Un acte commis ouvertement en défi à Yahweh
  alternative: Un péché simplement volontaire ou prémédité
  rationale: 'L’image de la « main levée » exprime davantage que l’intention : elle comporte une nuance de provocation et de défi. La traduction ne précise toutefois pas une infraction particulière.'
- issue: Nature du retranchement
  choice: Conserver la formule « sera retranchée » sans en définir le mécanisme
  alternative: Comprendre explicitement une exécution, une expulsion de la communauté ou un jugement divin direct
  rationale: Le verset affirme un jugement sévère, mais ne permet pas à lui seul de trancher entre ces modalités.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe juridique reste nette sans archaïsmes. « Outrage Yahweh » conserve la gravité théologique du propos, et « sera retranchée » maintient l’ambiguïté de la sanction.
