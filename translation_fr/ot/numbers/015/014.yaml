source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: fr
  text: Et si un immigré réside avec vous, ou si quelqu’un se trouve parmi vous, au fil de vos générations, et qu’il offre à Yahvé une offrande par le feu, au parfum agréable, il fera comme vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Et si
  rationale: Conserve à la fois le lien avec la législation précédente et la valeur conditionnelle.
- source_word: יָגוּר ... גֵּר
  choice: un immigré réside
  rationale: Le verbe désigne le séjour d’un non-autochtone, tandis que גֵּר est ici une catégorie sociale et juridique. « Immigré » est actuel et « réside » marque une présence établie plutôt qu’une simple visite.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: Reproduit la préposition distincte de בְּתוֹכְכֶם, rendu ensuite par « parmi vous ».
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם
  choice: ou si quelqu’un se trouve parmi vous
  rationale: Restitue naturellement la construction relative assez large sans déterminer plus précisément le statut de cette personne.
- source_word: לְדֹרֹתֵיכֶם
  choice: au fil de vos générations
  rationale: Exprime l’application durable de la règle aux générations successives dans un français courant.
- source_word: וְעָשָׂה
  choice: et qu’il offre
  rationale: Dans le contexte sacrificiel, « offrir » rend idiomatiquement le sens de faire ou préparer une offrande.
- source_word: אִשֵּׁה
  choice: un sacrifice consumé par le feu
  rationale: Le terme désigne une offrande liée au feu. Cette formulation évite l’idée trompeuse d’une nourriture divine tout en conservant l’élément sacrificiel et le feu.
- source_word: רֵיחַ נִיחֹחַ
  choice: d’une agréable odeur
  rationale: Préserve la métaphore cultuelle de l’odeur qui agrée à Dieu dans une expression française naturelle et digne.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Transcrit le nom divin יהוה conformément à la couche de consultation anglaise fournie et conserve la direction de l’offrande.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: il fera comme vous
  rationale: Rend de façon concise la formule comparative qui impose à cette personne la même pratique qu’aux Israélites.
theological_decisions:
- issue: Statut du non-Israélite participant au culte sacrificiel
  choice: La même manière d’offrir est prescrite à l’immigré ou à la personne présente au sein de la communauté.
  alternative: Limiter explicitement la règle au seul étranger résident déjà pleinement intégré à la vie de l’alliance.
  rationale: La formule « il fera comme vous » établit ici une égalité de pratique, mais le verset ne définit pas toute la portée du statut d’alliance de la personne concernée.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la structure conditionnelle et la distinction entre « avec vous » et « parmi vous ». Aucun marqueur de note n’est nécessaire, puisque le sens igné de אִשֵּׁה est intégré au texte.
