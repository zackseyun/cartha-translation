revisions:
- from: Et si un immigré réside avec vous, ou si quelqu’un se trouve parmi vous, au fil de vos générations, et qu’il offre à Yahvé un sacrifice consumé par le feu, d’une agréable odeur, il fera comme vous.
  to: Et si un immigré réside avec vous, ou si quelqu’un se trouve parmi vous, au fil de vos générations, et qu’il offre à Yahvé une offrande par le feu, au parfum agréable, il fera comme vous.
  rationale: « Offrande par le feu » rend אִשֶּׁה sans restreindre le terme à un sacrifice entièrement consumé. « Au parfum agréable » restitue plus directement l’image cultuelle de רֵיחַ נִיחֹחַ et s’intègre naturellement à la phrase.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:57:51Z'
review_pass:
  verdict: revise
  source_fidelity: La structure conditionnelle, la distinction בין « avec vous » et « parmi vous », la durée « pour vos générations » et l’exigence d’une pratique identique sont bien rendues. Toutefois, « sacrifice consumé par le feu » peut indûment évoquer un sacrifice entièrement brûlé, alors que אִשֶּׁה désigne plus généralement une offrande faite par le feu.
  naturalness: La séquence « un sacrifice consumé par le feu, d’une agréable odeur » est un peu lourde et laisse « d’une agréable odeur » en apposition peu nette. « Une offrande par le feu, au parfum agréable » est plus naturel dans un registre biblique français moderne.
  terminology: « Yahvé » est cohérent avec le projet. « Immigré » est acceptable en français moderne pour גֵּר dans ce contexte légal; la révision se limite au terme sacrificiel afin de ne pas surinterpréter le type d’offrande.
  issues:
  - severity: medium
    issue: « sacrifice consumé par le feu » est trop spécifique pour אִשֶּׁה.
    rationale: Cette expression peut suggérer qu’il s’agit nécessairement d’une offrande totalement brûlée. Le terme hébreu désigne une offrande faite par le feu et n’identifie pas à lui seul un type sacrificiel particulier.
  - severity: low
    issue: Apposition maladroite de « d’une agréable odeur ».
    rationale: La formulation actuelle rend moins clairement le syntagme רֵיחַ נִיחֹחַ, qui qualifie l’offrande comme un parfum agréable destiné à Yahvé.
  revised_text: Et si un immigré réside avec vous, ou si quelqu’un se trouve parmi vous, au fil de vos générations, et qu’il offre à Yahvé une offrande par le feu, au parfum agréable, il fera comme vous.
  revised_footnotes: []
  revision_rationale: « Offrande par le feu » rend אִשֶּׁה sans restreindre le terme à un sacrifice entièrement consumé. « Au parfum agréable » restitue plus directement l’image cultuelle de רֵיחַ נִיחֹחַ et s’intègre naturellement à la phrase.
