  text: וְ/הָיָ֣ה לָ/כֶם֮ לְ/צִיצִת֒ וּ/רְאִיתֶ֣ם אֹת֗/וֹ וּ/זְכַרְתֶּם֙ אֶת כָּל מִצְוֺ֣ת יְהוָ֔ה וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹֽא תָתֻ֜רוּ אַחֲרֵ֤י לְבַבְ/כֶם֙ וְ/אַחֲרֵ֣י עֵֽינֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם זֹנִ֖ים אַחֲרֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: fr
  text: Ce sera pour vous une frange[a]. Quand vous la verrez, vous vous souviendrez de tous les commandements de Yahweh et vous les mettrez en pratique. Vous ne suivrez pas votre cœur ni vos yeux[b], à la suite desquels vous vous prostituez[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « houppe ». Le terme hébreu désigne la frange ou le gland fait de fils attaché au vêtement.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut évoquer le fait de poursuivre, de rechercher ou de suivre. Le « cœur » et les « yeux » désignent ici les inclinations intérieures et ce qui attire le regard.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie l’image de l’infidélité sexuelle pour parler d’une infidélité à l’alliance. Autre traduction possible : « à la suite desquels vous vous égarez ».'
    reason: metaphor_clarification
lexical_decisions:
- source_word: צִיצִת
  choice: houppe
  rationale: Dans ce contexte, le terme désigne l’ornement fait de fils fixé au coin du vêtement. « Houppe » nomme précisément cet objet en français courant, tandis que « frange » peut aussi désigner toute une bordure.
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: Elle vous servira de houppe
  rationale: Cette formulation française naturelle conserve la valeur prédicative de l’hébreu et son référent singulier, la cordelière mentionnée au verset précédent.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: Quand vous la verrez
  rationale: La coordination hébraïque exprime ici naturellement la circonstance qui déclenche le souvenir; le féminin reprend « houppe » en français.
- source_word: מִצְוֺת
  choice: commandements
  rationale: « Commandements » conserve la portée juridique et relationnelle du terme dans le cadre de l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: vous les mettrez en pratique
  rationale: Avec des commandements, cette expression rend idiomatiquement l’idée de les faire, sans réduire celle-ci à une simple activité extérieure.
- source_word: תָתֻרוּ אַחֲרֵי
  choice: vous ne suivrez pas
  rationale: Dans cet avertissement moral, le verbe évoque le fait de partir à la recherche de quelque chose ou de le poursuivre. « Suivre » est clair et naturel, tandis qu’une traduction comme « explorer après » serait obscure.
- source_word: לְבַבְכֶם וְאַחֲרֵי עֵינֵיכֶם
  choice: les désirs de votre cœur et de vos yeux
  rationale: Le cœur et les yeux sont littéralement nommés, mais ils représentent ici les impulsions intérieures et ce qui attire le regard. L’ajout de « désirs » explicite l’idiome sans effacer ses deux images.
- source_word: זֹנִים
  choice: vous vous prostituez
  rationale: Cette traduction maintient la forte métaphore sexuelle de זנה pour l’infidélité à l’alliance, au lieu de l’atténuer en simple égarement.
- source_word: אֲשֶׁר אַתֶּם זֹנִים אַחֲרֵיהֶם
  choice: auxquels vous vous prostituez
  rationale: Le relatif est rattaché aux désirs évoqués par le cœur et les yeux, et la poursuite infidèle exprimée par אַחֲרֵיהֶם demeure perceptible dans la construction française.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre de l’alliance; sa translittération le distingue d’un titre et n’ajoute aucune interprétation confessionnelle.
- issue: Force de la métaphore זנה
  choice: conserver l’image explicite avec « vous vous prostituez »
  alternative: « vous vous égarez » ou « vous êtes infidèles »
  rationale: L’hébreu décrit l’infidélité envers Dieu au moyen d’une image sexuelle volontairement forte. La conserver respecte la tension théologique et rhétorique du verset.
- issue: Portée de « cœur » et « yeux »
  choice: expliciter leur fonction désirante tout en conservant les images
  alternative: traduire littéralement « suivre votre cœur et vos yeux »
  rationale: Le contexte oppose les commandements de Yahweh aux impulsions intérieures et à l’attrait du regard. « Les désirs de votre cœur et de vos yeux » rend cette opposition intelligible sans remplacer les images hébraïques.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le futur reprend la valeur injonctive du passage. La syntaxe a été légèrement segmentée pour éviter une phrase lourde, tout en conservant l’enchaînement entre vue, souvenir, mise en pratique et avertissement.
