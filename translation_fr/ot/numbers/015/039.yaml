  naturalness: Le français est globalement clair et digne. « Frange » est plus immédiatement intelligible que « houppe ». La formulation « à la suite desquels vous vous prostituez » demeure volontairement forte, mais elle rend la métaphore et le complément אַחֲרֵיהֶם (« après eux ») sans l’atténuer.
  terminology: « Yahweh », « commandements » et « mettrez en pratique » conviennent. La métaphore de זנה doit rester explicite; « vous vous prostituez » la préserve sans imposer une lecture confessionnelle.
