  to: Ce sera pour vous une frange[a]. Quand vous la verrez, vous vous souviendrez de tous les commandements de Yahweh et vous les mettrez en pratique. Vous ne suivrez pas votre cœur ni vos yeux[b], à la suite desquels vous vous prostituez[c].
