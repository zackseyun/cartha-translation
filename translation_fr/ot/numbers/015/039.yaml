    issue: Ajout de « désirs » dans le texte principal
    rationale: L’hébreu dit littéralement « votre cœur » et « vos yeux ». Ces termes ont certes une portée désirante dans le contexte, mais l’ajout les remplace et réduit l’imagerie du texte; cette explication convient mieux à une note.
