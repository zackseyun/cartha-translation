id: NUM.15.41
reference: Numbers 15:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: fr
  text: Je suis Yahweh, votre Dieu, qui vous ai fait sortir du pays d’Égypte afin d’être votre Dieu. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici le Dieu unique d’Israël; le suffixe de deuxième personne du pluriel est rendu par « votre ».
- source_word: אֲשֶׁר הוֹצֵאתִי אֶתְכֶם
  choice: qui vous ai fait sortir
  rationale: Le hiphil de יצא a un sens causatif. Après « Je suis… qui », la forme « ai » maintient naturellement en français la première personne du locuteur.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Cette formulation conserve אֶרֶץ, « pays », ainsi que la cadence solennelle de la formule de l’exode.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: afin d’être votre Dieu
  rationale: L’infinitif précédé de ל exprime ici le but de la délivrance; « votre Dieu » rend idiomatiquement la relation d’alliance exprimée littéralement par « Dieu pour vous ».
- source_word: אֲנִי
  choice: Je suis
  rationale: La proposition nominale hébraïque appelle la copule en français; la répétition conserve l’insistance du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération préserve le nom d’alliance effectivement employé dans l’hébreu, sans lui substituer un titre.
- issue: Formule d’alliance לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: afin d’être votre Dieu
  alternative: afin d’être Dieu pour vous
  rationale: Le choix retenu exprime clairement en français moderne la relation d’alliance, sans réduire la phrase à une affirmation abstraite de divinité.
translation_notes:
  register: Français international moderne, clair et digne. La répétition finale et la formulation « pays d’Égypte » maintiennent la solennité de la déclaration d’alliance. Aucun marqueur de note n’est requis, puisque la tournure retenue rend directement et naturellement le sens de l’hébreu.
