  text: מֵ/רֵאשִׁית֙ עֲרִסֹ֣תֵי/כֶ֔ם תִּתְּנ֥וּ לַ/יהוָ֖ה תְּרוּמָ֑ה לְ/דֹרֹ֖תֵי/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: fr
  text: Vous donnerez à Yahweh, de génération en génération, une contribution prélevée sur la première portion de votre pâte[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de vos pétrins » : le terme hébreu peut désigner la pâte ou, par association, le récipient dans lequel elle est pétrie.'
    reason: lexical_alternative
  - marker: b
    text: Ou « offrande » ; traditionnellement « offrande élevée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: prélevée sur les prémices de
  rationale: רֵאשִׁית désigne ici la première portion mise à part. « Prémices » exprime naturellement en français la valeur cultuelle et partitive du terme.
- source_word: עֲרִסֹתֵיכֶם
  choice: votre pâte
  rationale: עֲרִסָה peut désigner la pâte ou, par métonymie, le récipient où elle est pétrie. Le prélèvement portant sur la matière elle-même, « pâte » convient le mieux dans ce contexte.
- source_word: תִּתְּנוּ
  choice: vous donnerez
  rationale: נתן signifie couramment « donner ». Le futur français a ici une valeur prescriptive naturelle et conserve la simplicité du verbe hébreu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme יְהוָה est rendu par le nom propre « Yahweh », conformément à sa fonction de nom divin dans le texte.
- source_word: תְּרוּמָה
  choice: une contribution
  rationale: תְּרוּמָה désigne une part prélevée et consacrée. « Contribution » reste clair en français moderne sans introduire le terme technique traditionnel « offrande élevée ».
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette formule française idiomatique exprime l'obligation durable qui se transmet au fil des générations.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve sa valeur de nom propre sans le remplacer par un titre.
- issue: Nature de la תְּרוּמָה
  choice: contribution
  alternative: offrande élevée
  rationale: Le terme désigne une portion mise à part pour Yahweh. « Contribution » évite de préciser un geste rituel que ce verset n'explicite pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe met en évidence le prélèvement d'une première portion tout en conservant le verbe simple « donner » et le nom divin Yahweh.
