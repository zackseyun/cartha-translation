revisions:
- from: Il y aura une seule loi et une seule règle pour vous et pour l’immigré qui réside avec vous[a].
  to: Il y aura une seule loi et une seule règle pour vous et pour l’étranger qui séjourne avec vous[a].
  rationale: La révision remplace « immigré » par « l’étranger qui séjourne », expression qui rend le nom גֵּר et le participe apparenté הַגָּר sans imposer une catégorie administrative moderne. Elle maintient la répétition emphatique « une seule loi et une seule règle », le futur prescriptif et « avec vous », conformément à l’hébreu.
