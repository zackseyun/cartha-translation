  text: תּוֹרָ֥ה אַחַ֛ת וּ/מִשְׁפָּ֥ט אֶחָ֖ד יִהְיֶ֣ה לָ/כֶ֑ם וְ/לַ/גֵּ֖ר הַ/גָּ֥ר אִתְּ/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: fr
  text: Il y aura une seule loi et une seule règle pour vous et pour l’étranger qui séjourne avec vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étranger résident ». Le mot hébreu גֵּר désigne un étranger établi au sein de la communauté israélite.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: loi
  rationale: Dans ce contexte juridique, le terme désigne une prescription contraignante. « Loi » est naturel en français et reste distinct de מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: règle
  rationale: Le mot désigne ici une norme ou prescription juridique. « Règle » exprime clairement ce sens sans évoquer à tort un verdict judiciaire; « ordonnance » serait moins naturel en français international courant.
- source_word: אַחַת / אֶחָד
  choice: une seule / une seule
  rationale: La répétition rend l’insistance de l’hébreu sur l’unicité et l’égalité de la norme, tout en restant idiomatique en français.
- source_word: יִהְיֶה
  choice: Il y aura
  rationale: Dans ce cadre légal, le futur français porte la valeur prescriptive de l’imparfait hébreu, sans recourir à une tournure juridique vieillie.
- source_word: גֵּר
  choice: immigré
  rationale: Le terme désigne un non-natif établi au sein d’Israël et relevant de son ordre communautaire. « Immigré » est actuel et compréhensible; une note précise la portée historique du terme.
- source_word: הַגָּר
  choice: qui réside
  rationale: Cette formulation naturelle restitue le participe hébreu et indique une présence établie, même si elle ne reproduit pas exactement la dérivation lexicale du nom גֵּר.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: La traduction suit directement la préposition hébraïque et demeure naturelle en français.
theological_decisions:
- issue: Égalité juridique entre Israël et l’étranger résident dans les prescriptions cultuelles
  choice: Conserver la formulation générale selon laquelle une même loi et une même règle valent pour les destinataires israélites et l’immigré qui réside avec eux.
  alternative: Limiter explicitement l’énoncé aux seules prescriptions sacrificielles du contexte immédiat.
  rationale: Le contexte est celui d’une section juridique particulière, mais le verset emploie une formulation large. La traduction préserve cette tension sans élargir ni restreindre explicitement la portée théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétée « une seule loi et une seule règle » conserve l’insistance de l’hébreu. « Immigré » est employé au sens résidentiel et non comme catégorie administrative moderne; la note en précise la valeur historique.
