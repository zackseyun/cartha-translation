review_pass:
  verdict: revise
  source_fidelity: La structure binaire (« une loi… une règle ») et l’inclusion du gēr sont bien rendues. Toutefois, « immigré » introduit une catégorie administrative et sociopolitique moderne qui ne correspond pas exactement au gēr biblique; « étranger qui séjourne avec vous » conserve mieux la désignation et l’écho du participe הַגָּר.
  naturalness: La phrase proposée est globalement fluide. « Étranger qui séjourne avec vous » est naturel dans un registre scripturaire moderne et accessible. La note a été reformulée pour éviter « non native » et « sous son ordre communautaire », formulations peu idiomatiques et inutilement interprétatives.
  terminology: « Loi » pour תּוֹרָה et « règle » pour מִשְׁפָּט distinguent adéquatement les deux termes dans un français moderne. « Étranger » avec une note explicative est préférable à « immigré »; il évite d’importer les catégories contemporaines de l’immigration tout en indiquant la résidence durable du gēr.
  issues:
  - severity: medium
    issue: « immigré » pour גֵּר
    rationale: Le terme français évoque couramment un statut migratoire contemporain ou une personne ayant immigré, alors que גֵּר désigne dans ce contexte un étranger établi au sein de la communauté israélite. Cette équivalence risque d’anachroniser la catégorie sociale et juridique ancienne.
  - severity: low
    issue: Formulation de la note
    rationale: « Personne non native » est peu naturel en français, et « sous son ordre communautaire » dépasse ce que le terme seul affirme. Une définition plus sobre de l’étranger établi préserve mieux la portée lexicale.
  revised_text: Il y aura une seule loi et une seule règle pour vous et pour l’étranger qui séjourne avec vous[a].
  revised_footnotes:
