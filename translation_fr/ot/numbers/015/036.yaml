  text: וַ/יֹּצִ֨יאוּ אֹת֜/וֹ כָּל הָ/עֵדָ֗ה אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֛/וֹ בָּ/אֲבָנִ֖ים וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Alors toute l’assemblée le fit sortir du camp et le lapida à coups de pierres. Il mourut, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: toute l’assemblée
  rationale: עֵדָה désigne ici l’ensemble de la communauté d’Israël réunie; « assemblée » conserve cette dimension collective et institutionnelle, tandis que « toute » rend כָּל.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: le fit sortir
  rationale: Le hiphil de יצא signifie « faire sortir » ou « emmener dehors ». Avec « toute l’assemblée » comme sujet collectif singulier en français, « le fit sortir » est précis et naturel.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: du camp
  rationale: Le mouvement vers l’extérieur exprimé en hébreu se rend idiomatiquement par « faire sortir du camp »; le résultat est bien une destination située hors du camp.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: le lapida à coups de pierres
  rationale: רגם désigne la lapidation. « À coups de pierres » restitue l’instrument explicitement exprimé par בָּאֲבָנִים sans la lourdeur de « le lapida avec des pierres ».
- source_word: וַיָּמֹת
  choice: Il mourut
  rationale: מות est le verbe ordinaire « mourir ». Une phrase distincte rend clairement l’issue de la lapidation sans ajouter l’idée interprétative de mise à mort.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: כַּאֲשֶׁר exprime la conformité à l’ordre précédent; le plus-que-parfait français marque naturellement l’antériorité du commandement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin et suit l’orientation fournie, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
