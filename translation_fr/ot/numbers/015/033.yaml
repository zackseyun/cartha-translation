  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: fr
  text: Ceux qui l’avaient trouvé en train de ramasser du bois l’amenèrent à Moïse, à Aaron et à toute l’assemblée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des morceaux de bois ». Le mot hébreu peut désigner le bois en général ou des pièces de bois, telles que des branches ou des bâtons.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: l’amenèrent
  rationale: Le hifil de קרב exprime ici le fait de faire approcher ou de présenter quelqu’un. Dans ce contexte narratif, « l’amenèrent à » rend naturellement le mouvement vers Moïse, Aaron et l’assemblée sans ajouter une comparution formelle absente du texte.
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: Ceux qui l’avaient trouvé
  rationale: Le participe substantivé désigne les personnes qui avaient découvert l’homme. Le plus-que-parfait marque naturellement en français l’antériorité de cette découverte par rapport au fait de l’amener.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: en train de ramasser du bois
  rationale: La tournure progressive rend l’action en cours au moment où l’homme fut trouvé. עֵצִים peut désigner le bois en général ou des morceaux de bois; « du bois » conserve le sens le plus large.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: à Moïse, à Aaron et à toute l’assemblée
  rationale: La répétition de « à » reflète celle de אֶל tout en restant fluide. « Toute l’assemblée » rend le caractère collectif et formel de עֵדָה dans ce contexte israélite.
- source_word: עֵדָה
  choice: assemblée
  rationale: « Assemblée » désigne naturellement en français moderne la communauté d’Israël considérée comme corps réuni, sans les connotations plus étroites que peut avoir « congrégation ».
