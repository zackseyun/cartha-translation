source:
  edition: WLC
  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: fr
  text: 'Alors, celui qui présente son offrande à Yahweh présentera une offrande de céréales : un dixième d’épha de farine fine[a], mélangée à un quart de hin d’huile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « un dixième » ; dans ce contexte sacrificiel, il s’agit d’un dixième d’épha.'
    reason: L’unité « épha », implicite dans le terme hébreu, est explicitée dans le texte pour rendre la mesure compréhensible.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Alors ... présentera
  rationale: Le waw suivi du parfait poursuit la procédure légale commencée au verset précédent. « Alors » exprime naturellement cette succession, et « présentera » rend le sens sacrificiel du hiphil de קרב.
- source_word: הַמַּקְרִיב
  choice: celui qui présente
  rationale: Le participe hiphil désigne la personne qui apporte l’offrande; cette formulation conserve la valeur participiale dans un français courant.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן désigne ici ce qui est présenté à Dieu dans le cadre sacrificiel; « offrande » est précis et naturel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל est rendue par « à », et le tétragramme est transcrit « Yahweh », ce qui maintient le nom divin du texte hébreu.
- source_word: מִנְחָה
  choice: en offrande de céréales
  rationale: Dans la législation sacrificielle, מִנְחָה désigne couramment une offrande faite de produit céréalier; cette expression est claire sans réduire le sens du mot dans d’autres contextes.
- source_word: סֹלֶת
  choice: farine fine
  rationale: סֹלֶת désigne une farine finement moulue et de qualité, employée pour les offrandes.
- source_word: עִשָּׂרוֹן
  choice: un dixième d’épha
  rationale: Le mot signifie littéralement « un dixième »; dans ce contexte métrologique sacrificiel, il s’agit d’un dixième d’épha. L’unité implicite est explicitée pour rendre la mesure intelligible.
- source_word: בָּלוּל
  choice: pétrie
  rationale: Le participe passif décrit la farine incorporée à l’huile. « Pétrie avec » est idiomatique dans ce contexte de préparation, tout en gardant l’idée de mélange.
- source_word: בִּרְבִעִית הַהִין
  choice: avec un quart de hin
  rationale: La formulation traduit directement la proportion indiquée et conserve l’unité ancienne « hin ».
- source_word: שָׁמֶן
  choice: huile
  rationale: L’hébreu dit simplement « huile »; préciser « huile d’olive » ajouterait une information probable mais non exprimée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Nature de מִנְחָה dans ce contexte
  choice: offrande de céréales
  alternative: offrande; offrande de tribut
  rationale: Le contexte sacrificiel et la mention de farine et d’huile déterminent ici une offrande céréalière, sans imposer ce sens à tous les emplois du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère prescriptif du passage sans employer de tournure juridique vieillie. Les unités anciennes « épha » et « hin » sont maintenues.
