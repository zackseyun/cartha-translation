source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: fr
  text: Alors, si cela a été fait par inadvertance sans que la communauté s’en aperçoive, toute la communauté offrira un taureau pris dans le gros bétail en holocauste, en agréable odeur pour Yahweh, avec son offrande de céréales et sa libation, conformément à la règle prescrite, ainsi qu’un bouc en sacrifice pour le péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sacrifice de purification ». Le mot hébreu peut désigner le sacrifice lié au péché et à la purification rituelle.
    reason: Alternative lexicale significative du terme sacrificiel חַטָּאת.
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: sans que la communauté s’en aperçoive
  rationale: L’expression signifie littéralement « loin des yeux de la communauté » et désigne ici ce qui échappe à son attention. La formulation française restitue naturellement cet idiome.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: la faute a été commise involontairement
  rationale: שְׁגָגָה désigne une erreur non intentionnelle, par opposition à l’acte délibéré dans le contexte proche. Le nom « faute » est explicité à partir du contexte de l’infraction évoquée au verset précédent.
- source_word: כָל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici la communauté d’Israël considérée collectivement. « Toute la communauté » est actuel, clair et fidèle à כָל.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: un taureau pris dans le gros bétail
  rationale: La formule spécifie un taureau appartenant au bétail bovin. Cette traduction conserve la précision sans reproduire servilement « fils du gros bétail ».
- source_word: לְעֹלָה
  choice: en holocauste
  rationale: עֹלָה est le terme sacrificiel consacré pour une offrande entièrement brûlée. « Holocauste » reste la désignation biblique française usuelle.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: comme parfum agréable
  rationale: La formule cultuelle exprime l’agrément de l’offrande auprès de Dieu tout en conservant la métaphore olfactive du texte.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », afin de préserver le nom divin présent dans le texte hébreu.
- source_word: וּמִנְחָתוֹ
  choice: avec l’offrande de céréales qui l’accompagne
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale associée à l’holocauste; le suffixe renvoie à l’offrande accompagnant le taureau.
- source_word: וְנִסְכּוֹ
  choice: l’offrande de vin qui l’accompagne
  rationale: נֶסֶךְ désigne une libation. « Offrande de vin » est plus immédiatement compréhensible en français courant, le contenu ayant été prescrit dans le contexte précédent.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à la règle prescrite
  rationale: מִשְׁפָּט renvoie ici à la procédure cultuelle normative, non à un jugement judiciaire.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: ainsi qu’un bouc
  rationale: שְׂעִיר עִזִּים désigne spécifiquement un caprin mâle; « bouc » porte cette précision en français.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: La traduction conserve le lien lexical traditionnel avec le péché, tout en signalant en note la nuance rituelle de purification.
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte sacrificiel sacerdotal
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut désigner l’offrande liée au péché tout en mettant en œuvre une purification rituelle. Le texte principal garde la terminologie familière, tandis que la note préserve l’autre nuance reconnue.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve sa fonction de nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique et cultuelle demeure formelle sans archaïsmes inutiles. Le singulier grammatical de l’acte est rendu par « la faute », éclairé par le contexte immédiat, et la coordination des offrandes est rendue de façon fluide.
