revisions:
- from: Alors, si la faute a été commise involontairement, sans que la communauté s’en aperçoive, toute la communauté offrira un taureau pris dans le gros bétail en holocauste, comme parfum agréable à Yahweh, avec l’offrande de céréales et l’offrande de vin qui l’accompagnent, conformément à la règle prescrite, ainsi qu’un bouc en sacrifice pour le péché[a].
  to: Alors, si cela a été fait par inadvertance sans que la communauté s’en aperçoive, toute la communauté offrira un taureau pris dans le gros bétail en holocauste, en agréable odeur pour Yahweh, avec son offrande de céréales et sa libation, conformément à la règle prescrite, ainsi qu’un bouc en sacrifice pour le péché[a].
  rationale: La révision conserve toutes les composantes du texte source tout en évitant l’ajout interprétatif minimal de « la faute ». Elle harmonise le vocabulaire des offrandes avec l’usage biblique français et rend les possessifs hébreux de manière directe. Aucun changement de portée théologique n’est introduit.
