  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Tu présenteras aussi un tiers de hin[b] de vin comme libation[a], en parfum agréable pour Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la libation » ; il s’agit d’une offrande liquide versée en accompagnement du sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Le hin était une ancienne unité de mesure pour les liquides.
    reason: cultural_note
  - marker: c
    text: Ou « une odeur apaisante » ou « une odeur agréable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַיִן
  choice: aussi … de vin
  rationale: יַיִן désigne le vin. Le waw relie cette prescription à la précédente ; dans la syntaxe française réorganisée, « aussi » exprime naturellement cette coordination.
- source_word: לַנֶּסֶךְ
  choice: pour la libation
  rationale: נֶסֶךְ désigne une offrande liquide versée en accompagnement du sacrifice. « Libation » est le terme français précis et courant dans ce contexte cultuel.
- source_word: שְׁלִשִׁית הַהִין
  choice: un tiers de hin
  rationale: La mesure ancienne est conservée plutôt que convertie approximativement ; une note en explique la nature.
- source_word: תַּקְרִיב
  choice: tu présenteras
  rationale: Le hifil de קרב signifie ici présenter ou offrir dans un cadre sacrificiel. « Présenter » demeure proche de l’image de l’approche tout en étant idiomatique.
- source_word: רֵיחַ נִיחֹחַ
  choice: une odeur agréable
  rationale: Cette expression sacrificielle caractérise l’offrande comme agréée. La traduction conserve l’image olfactive sans ajouter une interprétation théologique.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire ou celui à qui l’odeur est agréable ; le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel d’alliance sans le remplacer par un titre.
- issue: Portée de l’expression sacrificielle רֵיחַ נִיחֹחַ
  choice: une odeur agréable
  alternative: un parfum apaisant
  rationale: « Une odeur agréable » conserve l’image et l’idée d’agrément sans décider si נִיחֹחַ souligne plus précisément l’apaisement ; cette nuance est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est réorganisée pour une lecture naturelle, tout en conservant la quantité, la fonction cultuelle, l’image olfactive et le nom divin du texte hébreu.
