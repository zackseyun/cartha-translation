  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Cet homme doit absolument être mis à mort[a]. Que toute la communauté le lapide à coups de pierres[b], hors du camp. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un infinitif absolu suivi d’un verbe passif de même racine, construction qui renforce l’énoncé : « il sera certainement mis à mort ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le lapider avec les pierres ». Cette tournure judiciaire désigne l’exécution par lapidation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin YHWH, qui préserve ici le nom propre présent dans le texte hébreu.
- source_word: מוֹת יוּמַת
  choice: doit absolument être mis à mort
  rationale: L’infinitif absolu suivi du verbe de même racine renforce l’énoncé. Cette formulation conserve la voix passive, l’obligation judiciaire et l’intensité de l’hébreu.
- source_word: הָאִישׁ
  choice: cet homme
  rationale: Le nom défini renvoie à l’homme identifié dans le contexte précédent. Le démonstratif français rend cette reprise référentielle avec naturel.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: le lapidera
  rationale: Le verbe français « lapider » exprime clairement l’exécution à coups de pierres. La construction hébraïque plus redondante est signalée en note.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble collectif d’Israël. « Communauté » est actuel, compréhensible et adapté au contexte juridique.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Rendu idiomatique et précis du lieu où la lapidation doit avoir lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Force prescriptive de מוֹת יוּמַת
  choice: doit absolument être mis à mort
  alternative: sera certainement mis à mort
  rationale: Dans ce contexte de verdict divin, la construction exprime à la fois l’intensité et l’obligation. « Doit absolument » rend cette force sans atténuer la forme passive.
translation_notes:
  register: Français international moderne, clair et digne. La formulation demeure proche de la structure juridique de l’hébreu tout en évitant une redondance peu naturelle dans le corps du texte. Les marqueurs de notes sont placés après les expressions auxquelles ils se rapportent.
