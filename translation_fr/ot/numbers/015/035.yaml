  source_fidelity: Le sens général est bien rendu, y compris le nom divin, la sentence de mort et le lieu hors du camp. Toutefois, la seconde injonction hébraïque (infinitif absolu à valeur impérative) est mieux rendue en français par « Que ... le lapide » que par un simple futur déclaratif. Le complément « avec des pierres » doit aussi apparaître dans le texte, plutôt que seulement en note.
  naturalness: Le français est clair et de registre approprié. La formulation révisée conserve un français moderne tout en donnant à la seconde proposition sa valeur d’ordre judiciaire. « À coups de pierres » est idiomatique et explicite.
  terminology: « Yahweh », « Moïse », « mis à mort », « communauté » et « camp » conviennent. « Lapider » rend précisément le verbe hébreu dans ce contexte judiciaire.
