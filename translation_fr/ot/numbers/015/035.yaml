    rationale: רָגוֹם est un infinitif absolu employé avec valeur injonctive, suivi de « lui » et « avec les pierres ». « Que toute la communauté le lapide à coups de pierres » reflète mieux l’ordre et son moyen d’exécution.
  - severity: medium
    issue: L’appel de note b est placé après « hors du camp », alors que son contenu porte sur « le lapider ... avec des pierres ».
    rationale: L’ancre doit suivre l’expression concernée, afin de ne pas laisser entendre que la note explique le lieu de l’exécution.
  - severity: low
    issue: La note a présente une paraphrase française comme si elle était la traduction littérale de la construction hébraïque.
    rationale: L’hébreu emploie un infinitif absolu suivi d’un verbe passif de même racine; il est plus exact de décrire cette construction et son effet intensif sans lui attribuer une littéralité française artificielle.
