source:
  edition: WLC
  text: וַ/יַּנִּ֥יחוּ אֹת֖/וֹ בַּ/מִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: fr
  text: Ils le mirent en détention, car il n’avait pas été précisé ce qu’il fallait faire de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: ils le placèrent
  rationale: Le hifil de נוח peut signifier « placer », « déposer » ou « laisser ». Ici, « placèrent » exprime naturellement l’action de mettre l’homme sous garde.
- source_word: בַּמִּשְׁמָר
  choice: en détention
  rationale: מִשְׁמָר désigne la garde, la détention ou un lieu où quelqu’un est gardé. « En détention » rend le sens juridique sans suggérer une condamnation à la prison.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la mise en détention. « Car » convient au registre narratif digne et courant.
- source_word: לֹא פֹרַשׁ
  choice: il n’avait pas été précisé
  rationale: Le passif de פרש indique que la mesure à prendre n’avait pas encore été clairement énoncée ou spécifiée. Cette formulation conserve la portée procédurale du texte.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: ce qu’on devait lui faire
  rationale: Cette tournure impersonnelle rend naturellement la construction passive hébraïque et sa nuance délibérative ou juridique.
theological_decisions:
- issue: Nature de l’incertitude dans la procédure juridique
  choice: Le texte dit que la mesure à prendre n’avait pas encore été précisée.
  alternative: Comprendre plus étroitement que seule la peine précise n’avait pas encore été déclarée.
  rationale: Le passif לֹא פֹרַשׁ porte sur l’absence de spécification claire. La traduction préserve cette incertitude sans conclure que la loi entière était inconnue ni ajouter qu’il s’agissait exclusivement de la peine.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et narrative; « détention » évite de surinterpréter מִשְׁמָר comme une prison au sens institutionnel.
