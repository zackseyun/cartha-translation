  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: fr
  text: Car[a] cette personne a méprisé la parole de Yahweh et violé son commandement, elle sera bel et bien retranchée[b] ; sa culpabilité est sur elle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parce que ».'
    reason: Alternative possible pour la conjonction כִּי, qui peut introduire une explication ou une cause.
  - marker: b
    text: L’expression « sera bel et bien retranchée » rend l’intensification hébraïque. Le verset ne précise pas ici la forme exacte de ce retranchement.
    reason: 'Note culturelle et juridique : le texte ne permet pas d’identifier sans preuve le retranchement à une sanction particulière.'
  - marker: c
    text: 'Ou : « sa faute est sur elle » ou « son iniquité est sur elle ». Le terme peut évoquer la faute, la culpabilité ou ses conséquences.'
    reason: Alternative lexicale préservant l’étendue sémantique de עָוֹן.
lexical_decisions:
- source_word: כִּי
  choice: Parce que
  rationale: Introduit la raison du jugement énoncé dans le contexte précédent ; « Parce que » explicite naturellement cette valeur causale en français.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: דָּבָר désigne ici la parole ou l’ordre révélé de Dieu dans un contexte d’alliance ; le nom divin יהוה est transcrit « Yahweh ».
- source_word: בָּזָה
  choice: a méprisé
  rationale: Exprime un rejet marqué et délibéré, et non une simple négligence.
- source_word: מִצְוָתוֹ
  choice: son commandement
  rationale: Conserve le singulier hébreu et la portée juridique et religieuse du terme.
- source_word: הֵפַר
  choice: violé
  rationale: Dans ce contexte légal, « violer un commandement » rend clairement l’idée de le transgresser ou de le rompre.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: sera retranchée, oui, retranchée
  rationale: La reprise française reproduit l’intensification de l’infinitif absolu suivi du verbe conjugué, sans préciser la forme exacte du jugement.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: cette personne
  rationale: Dans un texte juridique, נֶפֶשׁ désigne l’individu ; « personne » évite ici les connotations anthropologiques trompeuses de « âme ».
- source_word: עֲוֺנָהּ בָּהּ
  choice: sa faute est sur elle
  rationale: Conserve la formulation judiciaire condensée et l’ambiguïté de עָוֹן, qui peut désigner la faute, la culpabilité ou ses conséquences.
theological_decisions:
- issue: Rendu du nom d’alliance יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens du jugement exprimé par כרת au nifal
  choice: retranchée
  alternative: mise à mort ou exclue de la communauté
  rationale: Le verset ne précise pas si le jugement prend la forme de la mort, de l’exclusion communautaire ou d’une autre sanction ; l’image hébraïque est donc maintenue.
- issue: Portée de עֲוֺנָהּ בָּהּ
  choice: sa faute est sur elle
  alternative: elle portera la peine de sa faute
  rationale: La proposition hébraïque est sans verbe et ne tranche pas nettement entre culpabilité et conséquence punitive ; une formulation littérale préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « retranchée, oui, retranchée » garde la solennité juridique et l’intensité de l’hébreu. Le féminin des pronoms découle du nom français « personne » et n’affirme rien sur le sexe du coupable.
