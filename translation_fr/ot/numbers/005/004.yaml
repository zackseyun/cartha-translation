  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: fr
  text: 'Les fils d’Israël firent ainsi[a] : ils les envoyèrent hors du camp. Comme Yahweh l’avait dit à Moïse, ainsi firent les fils d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël » ; cette expression désigne collectivement les Israélites.'
    reason: L’expression française formelle peut être comprise au sens strictement masculin ; la note précise sa portée collective dans l’hébreu.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: firent ainsi
  rationale: Cette tournure idiomatique exprime clairement l’exécution de l’ordre précédent tout en préparant la reprise finale du texte hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression familiale hébraïque, qui désigne ici collectivement le peuple d’Israël.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: ils les envoyèrent
  rationale: Le verbe שׁלח indique ici que les personnes concernées furent éloignées; le complément « hors du camp » explicite la destination et la mise à l’écart.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Formulation française naturelle et précise pour exprimer le déplacement vers l’extérieur du camp.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: comme ... l’avait ordonné
  rationale: Dans ce contexte, la parole de Yahweh est un commandement auquel Israël se conforme; le plus-que-parfait situe cette parole avant son exécution.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כֵּן עָשׂוּ
  choice: ainsi firent
  rationale: La reprise explicite conserve l’insistance hébraïque sur l’obéissance d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Valeur de דִּבֶּר dans le contexte
  choice: avait ordonné
  alternative: avait parlé
  rationale: Le contexte immédiat est celui d’un ordre divin exécuté par Israël. « Avait ordonné » rend cette force pragmatique sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et lisible. La structure répétitive du verset est maintenue afin de préserver l’accent mis par l’hébreu sur l’obéissance exacte du peuple.
