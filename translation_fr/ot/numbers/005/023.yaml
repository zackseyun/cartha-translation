    issue: « les en effacera dans l’eau amère »
    rationale: 'Le pronom « en » ne dispose pas d’un antécédent et d’une fonction syntaxique clairs : avec « les », il suggère plutôt « en effacer quelques-uns ». Le texte hébreu dit que le prêtre efface les malédictions écrites dans/vers l’eau ; il faut donc employer directement « les effacera dans l’eau amère ».'
  - severity: low
    issue: Note b présentée comme alternative alors qu’elle répète une action de lavage peu directement opposée au texte principal
    rationale: Une note plus exacte doit présenter « essuiera » comme alternative lexicale et expliquer que l’effacement porte sur les mots écrits et les fait passer dans l’eau.
