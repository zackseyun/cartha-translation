  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: fr
  text: Puis le prêtre écrira ces malédictions[a] sur le rouleau et les effacera dans l’eau amère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces malédictions liées au serment ». Le terme hébreu peut désigner une malédiction associée à un serment.
    reason: lexical_alternative
  - marker: b
    text: Ou « les essuiera dans l’eau amère ». Le verbe hébreu peut désigner l’action d’essuyer ou d’effacer les mots écrits, de sorte qu’ils passent dans l’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: Puis … écrira
  rationale: Dans cette suite d’instructions rituelles, le parfait précédé de la conjonction exprime naturellement l’étape suivante de la procédure; le futur français convient au contexte légal.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: ces malédictions
  rationale: אָלָה désigne ici les sanctions de malédiction prononcées sous serment; « malédictions » est clair dans le texte, tandis qu’une note conserve la nuance liée au serment.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français usuel du desservant cultuel chargé d’accomplir ce rite.
- source_word: בַּסֵּפֶר
  choice: sur le rouleau
  rationale: סֵפֶר désigne ici le support écrit ancien plutôt qu’un livre relié; en français, on écrit naturellement « sur » un rouleau.
- source_word: וּמָחָה
  choice: les en effacera
  rationale: Le verbe מחה signifie essuyer, effacer ou faire disparaître une inscription. La tournure exprime l’effacement des mots du rouleau sans perdre leur transfert vers l’eau.
- source_word: אֶל
  choice: dans
  rationale: La préposition marque ici la direction et le transfert de l’écriture effacée vers l’eau.
- source_word: מֵי הַמָּרִים
  choice: l’eau amère
  rationale: Formulation française naturelle du syntagme « eaux d’amertume / eaux amères » dans le contexte de ce liquide rituel.
