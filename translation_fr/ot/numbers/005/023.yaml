  verdict: revise
  source_fidelity: Le futur procédural, « le prêtre », « ces malédictions » et « sur le rouleau » rendent fidèlement l’hébreu. La seconde action doit toutefois conserver clairement le complément direct des mots écrits et leur effacement/transfert dans l’eau ; « les en effacera » est grammaticalement et sémantiquement mal formé dans ce contexte.
  naturalness: La phrase révisée est naturelle en français moderne et reste sobre. « Effacera dans l’eau amère » est une formulation rituelle intelligible, sans introduire une explication étrangère au texte.
  terminology: « Malédictions » convient pour אָלוֹת, avec la nuance de serment en note. « Eau amère » est acceptable comme collectif français pour le liquide rituel ; « rouleau » situe correctement le support ancien.
