  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: fr
  text: 'Que ces eaux porteuses de malédiction entrent dans tes entrailles[a], pour faire enfler le ventre et faire dépérir la cuisse. Et la femme dira : « Amen, amen. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour faire enfler le ventre et faire tomber la cuisse ». L’expression hébraïque est difficile et pourrait être un euphémisme désignant une atteinte aux organes reproducteurs.'
    reason: Signaler le sens littéral et l’incertitude lexicale sans résoudre dans le texte une ambiguïté de l’hébreu.
lexical_decisions:
- source_word: וּבָאוּ
  choice: Que ... entrent
  rationale: Dans cette formule de serment et de malédiction, la forme a une valeur imprécatoire; « Que ... entrent » exprime naturellement ce souhait solennel plutôt qu’un simple futur.
- source_word: הַמַּיִם הַמְאָרְרִים
  choice: ces eaux porteuses de malédiction
  rationale: Le pluriel « eaux » conserve le nombre hébreu et la tonalité rituelle. Le participe dérivé de ארר présente les eaux comme véhiculant ou produisant la malédiction, et non comme simplement amères.
- source_word: בְּמֵעַיִךְ
  choice: dans tes entrailles
  rationale: « Entrailles » désigne naturellement les parties intérieures du corps dans un registre digne, sans la précision clinique absente de l’hébreu.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: pour faire enfler le ventre
  rationale: La proposition infinitive exprime l’effet de la malédiction. « Ventre » est ici le correspondant direct et laisse ouverte une éventuelle portée reproductive.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: et dépérir la cuisse
  rationale: Littéralement, la construction évoque le fait de faire tomber la cuisse. « Dépérir » rend intelligible l’affliction corporelle sans imposer une identification anatomique ou médicale précise; « cuisse » conserve l’euphémisme possible du texte.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: Et la femme dira
  rationale: Le futur français convient à la prescription liturgique dans ce contexte juridique et rituel.
- source_word: אָמֵן אָמֵן
  choice: Amen, amen
  rationale: La répétition est conservée comme affirmation solennelle et formule liturgique familière.
theological_decisions:
- issue: Nature exacte des effets corporels de la malédiction
  choice: Conserver des termes corporels relativement littéraux — « faire enfler le ventre » et « dépérir la cuisse » — sans préciser l’affection médicale.
  alternative: Traduire explicitement par une fausse couche, la stérilité, l’atrophie des organes génitaux ou un prolapsus.
  rationale: L’expression hébraïque est difficile et probablement euphémistique. Elle semble concerner une atteinte corporelle à portée reproductive, mais ne permet pas d’en déterminer sûrement la nature exacte. La traduction préserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, solennel et accessible. La formulation conserve le cadre rituel ainsi que l’euphémisme anatomique probable, sans employer un vocabulaire médical trop précis.
