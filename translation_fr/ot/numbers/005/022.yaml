  source_fidelity: La formule imprécatoire « Que ... entrent » rend correctement la valeur volitive de וּבָאוּ. « Eaux porteuses de malédiction », « entrailles », « ventre » et « cuisse » respectent le lexique et conservent l’euphémisme ainsi que l’incertitude anatomique du texte hébreu. La double acclamation « Amen, amen » est fidèlement préservée.
  naturalness: Le texte est globalement solennel et naturel en français moderne. Toutefois, dans « pour faire enfler le ventre et dépérir la cuisse », le second infinitif coordonné se rattache grammaticalement aux eaux, comme si elles « dépérissaient » directement la cuisse. La répétition de « faire » est nécessaire pour exprimer clairement le causatif et produire une phrase idiomatique.
  terminology: « Porteuses de malédiction » est un rendu approprié du participe hébreu et ne réduit pas les eaux à des eaux simplement « maudites ». « Entrailles » et « cuisse » maintiennent utilement la réserve euphémistique du passage. La note explique l’incertitude sans imposer une affection reproductive particulière.
