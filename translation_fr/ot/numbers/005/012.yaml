base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: fr
  text: 'Parle aux fils d’Israël et dis-leur : Si la femme d’un homme s’égare et commet envers lui une grave déloyauté[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici un verbe et un nom de même racine pour souligner l’acte de déloyauté ; on pourrait aussi traduire : « commet une grave faute de déloyauté envers lui ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: Impératif introduisant l’instruction divine ; « Parle » conserve directement la formule hébraïque.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend formellement l’expression hébraïque, qui désigne collectivement le peuple d’Israël.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Reproduit la continuation de la formule de transmission sans lourdeur en français.
- source_word: אִישׁ אִישׁ
  choice: d’un homme
  rationale: La répétition distributive signifie « un homme quelconque » ; la construction conditionnelle française « Si la femme d’un homme » en restitue naturellement la portée.
- source_word: כִּי
  choice: Si
  rationale: Dans cette loi casuistique, la conjonction introduit un cas hypothétique.
- source_word: תִשְׂטֶה
  choice: se détourne du droit chemin
  rationale: Préserve l’image d’un écart de conduite sans préciser prématurément la nature exacte de la faute.
- source_word: אִשְׁתּוֹ
  choice: la femme d’un homme
  rationale: « Femme » convient ici au sens d’épouse, clairement établi par la relation possessive et le contexte conjugal.
- source_word: וּמָעֲלָה ... מָעַל
  choice: se rend gravement infidèle
  rationale: La tournure française exprime naturellement la déloyauté relationnelle, tandis que « gravement » signale la force de la construction hébraïque associant verbe et nom de même racine.
- source_word: בּוֹ
  choice: envers lui
  rationale: Désigne le mari comme la personne lésée ; « envers lui » s’accorde idiomatiquement avec « infidèle ».
theological_decisions:
- issue: Adresse collective genrée
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal garde le terme familial masculin explicite de l’hébreu, sans nier que l’expression désigne collectivement le peuple.
- issue: Portée de la faute conjugale
  choice: se détourne du droit chemin et se rend gravement infidèle envers lui
  alternative: s’égare et commet une faute de déloyauté envers lui
  rationale: Le verset amorce le cas juridique sans encore détailler l’acte dans ce seul verset ; la formulation préserve donc la progression et la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la cadence de l’introduction légale hébraïque. « Les fils d’Israël » privilégie la forme source, tandis que la formulation de la faute évite un calque peu naturel en français.
