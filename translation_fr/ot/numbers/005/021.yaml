  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: fr
  text: 'Puis le prêtre fera prêter à la femme le serment de malédiction[a] et lui dira : « Que Yahweh fasse de toi un objet de malédiction et de serment au milieu de ton peuple, lorsque Yahweh fera dépérir ta cuisse[b] et enfler ton ventre[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « le serment assorti d’une malédiction » ou « le serment imprécatoire ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’hébreu parle de la « cuisse » qui « tombe ». Cette expression difficile peut évoquer un dépérissement ou un affaissement et pourrait désigner, par euphémisme, les organes reproducteurs.
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « ventre » peut aussi désigner l’abdomen ou la matrice. L’effet médical ou reproductif exact de cette malédiction reste discuté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: fera prêter … le serment
  rationale: 'Le hiphil de שׁבע a ici un sens causatif : le prêtre amène la femme à prêter serment. Cette formulation française est naturelle et conserve la portée juridique et rituelle.'
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: le serment de malédiction
  rationale: Le syntagme construit associe explicitement le serment (שְׁבֻעָה) à la malédiction (אָלָה). La formulation retenue préserve les deux éléments sans employer le terme plus technique « imprécatoire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin représente le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: un objet de malédiction et de serment
  rationale: Cette tournure conserve les deux substantifs hébreux tout en indiquant que la femme deviendrait un exemple invoqué dans les malédictions et les serments.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: au milieu de ton peuple
  rationale: Cette expression garde la dimension communautaire et publique du texte hébreu.
- source_word: בְּתֵת
  choice: lorsque … fera
  rationale: L’infinitif construit précédé de בְּ exprime ici la circonstance dans laquelle la femme deviendrait un objet de malédiction et de serment.
- source_word: יְרֵךְ
  choice: cuisse
  rationale: יָרֵךְ désigne littéralement la cuisse ou la partie supérieure de la jambe, mais peut évoquer par euphémisme les organes reproducteurs. « Cuisse » évite de trancher cette ambiguïté dans le texte principal.
- source_word: נֹפֶלֶת
  choice: dépérir
  rationale: Le participe de נפל signifie littéralement « tomber ». Dans cette formule de malédiction, il semble décrire l’affaissement, le dépérissement ou le flétrissement de la partie du corps concernée. « Dépérir » rend l’effet corporel de manière intelligible sans imposer un diagnostic précis.
- source_word: בִּטְנֵךְ
  choice: ton ventre
  rationale: בֶּטֶן peut désigner le ventre, l’abdomen ou la matrice. « Ventre » est courant en français et maintient l’ambiguïté anatomique du terme.
- source_word: צָבָה
  choice: enfler
  rationale: Le mot décrit un gonflement ou une distension. « Enfler » est concis, naturel et convient à la formule de malédiction.
theological_decisions:
- issue: Degré de précision à donner aux effets corporels de la malédiction
  choice: Conserver l’image de la cuisse qui dépérit et du ventre qui enfle, sans préciser qu’il s’agirait d’une fausse couche, d’une stérilité ou d’une autre affection reproductive.
  alternative: Traduire explicitement par une fausse couche, la stérilité, la chute de l’utérus ou le gonflement de la matrice.
  rationale: L’hébreu est difficile et ne nomme aucun diagnostic de manière explicite. La traduction maintient donc l’image corporelle et la possible portée reproductive sans résoudre une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de la formule rituelle, tandis que les termes anatomiques restent concrets sans introduire une interprétation médicale ou confessionnelle particulière.
