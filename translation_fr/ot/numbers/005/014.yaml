  rationale: La révision supprime l’inférence causale de « de sorte que » et rend les deux scénarios dans une syntaxe conditionnelle française parallèle. Elle conserve l’ambiguïté inhérente au terme d’impureté et les deux ancres de notes, tout en restant cohérente avec le cadre juridique amorcé dans les versets précédents.
