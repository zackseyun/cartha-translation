  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: fr
  text: si un esprit de jalousie s’empare de lui, s’il devient jaloux de sa femme et qu’elle s’est souillée[a] ; ou si un esprit de jalousie s’empare de lui et qu’il devient jaloux de sa femme, alors qu’elle ne s’est pas souillée[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’elle est devenue impure ». L’hébreu emploie le vocabulaire de l’impureté ; ici, il s’agit précisément d’une souillure sexuelle présumée.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et elle ne s’est pas souillée ». « Alors que » fait ressortir le contraste entre la jalousie du mari et l’absence possible de souillure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: qu’un esprit … s’empare de lui
  rationale: Avec רוּחַ pour sujet, l’expression décrit une impulsion qui vient dominer l’homme. « S’empare de lui » est idiomatique en français et conserve cette force.
- source_word: רוּחַ קִנְאָה
  choice: un esprit de jalousie
  rationale: רוּחַ peut désigner ici une disposition ou une impulsion intérieure, et קִנְאָה désigne la jalousie dans ce contexte conjugal. La formulation garde l’image hébraïque sans la réduire à un simple sentiment.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: de sorte qu’il devient jaloux de sa femme
  rationale: Le verbe exprime la réaction jalouse du mari. « Devient jaloux de sa femme » rend naturellement le mouvement verbal et la relation avec la proposition précédente.
- source_word: נִטְמָאָה
  choice: elle se soit souillée
  rationale: Le verbe appartient au vocabulaire de l’impureté, mais il vise ici une souillure liée à l’infidélité sexuelle présumée. La tournure pronominale rend la responsabilité envisagée dans ce cas juridique sans trancher au-delà du texte.
- source_word: אוֹ
  choice: ou
  rationale: La particule introduit le second cas possible prévu par la loi. Le parallélisme français suffit à en faire ressortir la valeur alternative.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: alors qu’elle ne s’est pas souillée
  rationale: L’hébreu emploie la conjonction ordinaire « et », mais le second scénario oppose la jalousie du mari à l’absence réelle de souillure. « Alors que » explicite sobrement ce contraste.
theological_decisions:
- issue: Portée du vocabulaire d’impureté dans la loi concernant l’adultère présumé
  choice: Traduire נִטְמָאָה par « se soit souillée »
  alternative: « soit devenue impure » ou « ait été souillée »
  rationale: Le contexte porte sur une infidélité sexuelle présumée plutôt que sur une simple impureté rituelle. « Se souiller » conserve le chevauchement moral et cultuel du terme sans introduire de conclusion doctrinale étrangère au passage.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste subordonnée parce que le verset poursuit la construction juridique commencée aux versets précédents. Le parallélisme des deux scénarios est conservé, avec une légère explicitation de leurs relations logiques.
