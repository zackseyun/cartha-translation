  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: fr
  text: ou bien lorsqu’un esprit de jalousie s’empare d’un homme[a] et qu’il devient jaloux de sa femme, il présentera la femme devant Yahweh, et le prêtre accomplira à son égard toute cette prescription[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « passe sur lui » ou « vient sur lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toute cette instruction », « toute cette loi » ou « tout ce rituel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: ou bien lorsqu’
  rationale: Introduit la seconde possibilité de la phrase plus large; « ou bien lorsqu’ » conserve la valeur disjonctive tout en s’enchaînant naturellement en français.
- source_word: אִישׁ
  choice: un homme
  rationale: Rend le terme hébreu courant sans substituer explicitement « mari »; la suite, « sa femme », précise la relation conjugale.
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: un esprit de jalousie s’empare d’un homme
  rationale: Formulation française naturelle qui exprime la venue d’une impulsion dominante tout en conservant « esprit de jalousie » et son ambiguïté.
- source_word: רוּחַ
  choice: esprit
  rationale: Conserve l’ambiguïté de l’hébreu entre disposition intérieure, impulsion dominante et éventuelle force spirituelle.
- source_word: קִנְאָה
  choice: jalousie
  rationale: Dans le contexte d’une infidélité conjugale soupçonnée, « jalousie » correspond au sens requis.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: et qu’il devient jaloux de sa femme
  rationale: Reproduit le lien lexical avec « jalousie » et rend naturellement la progression verbale en français.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: il présentera la femme devant Yahweh
  rationale: Le causatif de עמד signifie faire tenir debout ou présenter; « présentera » convient au cadre rituel sans alourdir la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin conformément à l’usage du projet.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: le prêtre lui appliquera
  rationale: Dans ce contexte procédural, cette formulation française rend l’action prescrite envers la femme sans suggérer que le prêtre lui fait arbitrairement quelque chose.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: toute cette prescription
  rationale: תורה désigne ici l’ensemble des directives rituelles précédentes. « Prescription » conserve la force normative et convient mieux en français que le littéral peu naturel « toute cette loi ».
theological_decisions:
- issue: Nature de « l’esprit de jalousie »
  choice: Conserver l’expression « un esprit de jalousie » sans définir son origine ni sa nature.
  alternative: une crise de jalousie; une impulsion jalouse
  rationale: L’hébreu peut désigner une disposition envahissante sans trancher entre phénomène psychologique et force spirituelle; la traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La construction conserve le caractère de seconde éventualité dans la phrase commencée aux versets précédents. Le futur exprime ici la procédure prescrite.
