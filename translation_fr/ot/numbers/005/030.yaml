    issue: Le deux-points avant « il présentera » remplace la coordination explicite du texte source.
    rationale: וְהֶעֱמִיד et וְעָשָׂה poursuivent la chaîne verbale ; « et il présentera ... et le prêtre... » la reproduit plus directement.
  - severity: medium
    issue: « Le prêtre lui appliquera toute cette prescription » est une collocation française maladroite et rend imprécisément ועשה לה.
    rationale: Le prêtre accomplit/exécute la prescription à l’égard de la femme ; il ne lui « applique » pas une prescription au sens administratif moderne. « Accomplira à son égard » garde la direction de לָהּ et le registre rituel-juridique.
