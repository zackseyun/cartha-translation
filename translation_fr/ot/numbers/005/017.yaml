  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: fr
  text: Le prêtre prendra de l’eau consacrée[a] dans un récipient en terre cuite[b]. Il prendra un peu de la poussière qui se trouve sur le sol[c] du tabernacle et la mettra dans l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’eau sainte ». L’hébreu désigne une eau mise à part comme sainte pour un usage rituel.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans un vase d’argile » ou « dans un récipient de poterie ».
    reason: lexical_alternative
  - marker: c
    text: Ou « sur le plancher du tabernacle ». Le terme hébreu peut désigner le sol ou le plancher.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: eau consacrée
  rationale: L’expression désigne une eau mise à part pour un usage rituel. « Eau consacrée » rend clairement ce sens en français moderne sans évoquer nécessairement les emplois ecclésiaux ultérieurs de « eau bénite ».
- source_word: בִּכְלִי חָרֶשׂ
  choice: dans un récipient en terre cuite
  rationale: כְּלִי désigne un récipient, et חָרֶשׂ un matériau de terre cuite ou de poterie. Cette formulation est naturelle et précise en français.
- source_word: מִן הֶעָפָר
  choice: un peu de la poussière
  rationale: 'La préposition מִן a ici une valeur partitive : le prêtre prélève une certaine quantité de poussière, non la totalité.'
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: sur le sol du tabernacle
  rationale: קַרְקַע peut désigner le sol ou le plancher. « Sol » convient naturellement à la surface intérieure du tabernacle tout en préservant l’ambiguïté matérielle.
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: prendra ... prendra ... et mettra
  rationale: Dans cette prescription rituelle, le futur français exprime naturellement les actions requises et conserve leur enchaînement.
- source_word: הַמָּיִם
  choice: l’eau
  rationale: L’article renvoie à l’eau déjà mentionnée au début du verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « le prêtre » est allégée dans la seconde phrase sans perdre le sujet. « Tabernacle » est conservé comme terme cultuel courant; « récipient en terre cuite » évite l’archaïsme de « vase de terre ».
