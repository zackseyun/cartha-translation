lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר ouvre ici une nouvelle unité de discours. « Parla » rend précisément la formule narrative hébraïque et convient au registre biblique moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le restitue comme nom propre plutôt que de lui substituer le titre traditionnel « le SEIGNEUR ».
- source_word: אֶל
  choice: à
  rationale: La préposition introduit le destinataire de la parole ; « à » est l'équivalent français naturel après « parler ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, l'infinitif לֵאמֹר annonce le contenu du discours qui suit. « En ces termes » est naturel en français et évite le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre par « Yahweh » préserve le nom personnel présent dans la source, tandis que « le SEIGNEUR » relève d'une substitution traditionnelle et « Jéhovah » d'une forme hybride tardive.
translation_notes:
  register: 'Français international moderne, naturel et digne. La formule hébraïque est rendue sans lourdeur : « parla à Moïse en ces termes » introduit clairement le discours à venir.'
