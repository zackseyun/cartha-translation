  text: וְ/הִשְׁקָה֙ אֶת הָ֣/אִשָּׁ֔ה אֶת מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִ֑ים וּ/בָ֥אוּ בָ֛/הּ הַ/מַּ֥יִם הַֽ/מְאָרֲרִ֖ים לְ/מָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: fr
  text: Puis il fera boire à la femme l’eau amère qui apporte la malédiction[a], et l’eau qui apporte la malédiction entrera en elle pour produire l’amertume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les eaux de l’amertume qui apportent la malédiction ». En hébreu, le mot « eaux » est au pluriel, comme cela arrive couramment pour parler de l’eau.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « entrera en elle comme amertume ». La tournure hébraïque peut indiquer le résultat ou l’effet produit.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: Puis il fera boire
  rationale: Le hiphil de שׁקה exprime l’action de faire boire ou de donner à boire. « Faire boire » conserve clairement la valeur causative et convient au contexte rituel.
- source_word: הָאִשָּׁה
  choice: à la femme
  rationale: Traduction directe du nom défini, sans généralisation.
- source_word: מֵי הַמָּרִים
  choice: l’eau amère
  rationale: Littéralement « les eaux de l’amertume ». En français, le singulier massif « l’eau » est naturel, tandis que « amère » conserve le sens concret de la tournure hébraïque.
- source_word: הַמְאָֽרֲרִים / הַמְאָרֲרִים
  choice: qui apporte la malédiction
  rationale: Le participe issu de ארר présente l’eau comme porteuse ou agente de la malédiction, plutôt que simplement comme une eau elle-même maudite.
- source_word: וּבָאוּ בָהּ
  choice: entrera en elle
  rationale: בוא suivi de ב exprime ici l’entrée dans la femme. Le singulier français s’accorde avec le nom massif « eau ».
- source_word: לְמָרִים
  choice: pour produire l’amertume
  rationale: La préposition ל peut exprimer ici le résultat ou l’effet. Cette formulation reste intelligible sans préciser davantage la nature physique de cet effet.
theological_decisions:
- issue: Nature de la malédiction associée à l’eau dans l’épreuve rituelle
  choice: Décrire l’eau comme « apportant la malédiction »
  alternative: « l’eau maudite »
  rationale: Le participe hébreu peut désigner l’eau qui porte ou met en œuvre la malédiction. Cette traduction préserve sa fonction judiciaire et rituelle sans lui attribuer explicitement une puissance magique intrinsèque.
- issue: Sens de לְמָרִים
  choice: « pour produire l’amertume » comme résultat
  alternative: « amèrement » ou « pour devenir amère »
  rationale: L’hébreu est condensé et peut décrire un résultat funeste ou une amertume. Le texte principal garde l’idée de résultat, tandis que la note signale une traduction plus formelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « qui apporte la malédiction » est maintenue pour refléter l’insistance de l’hébreu. « Puis » rend l’enchaînement narratif de וְ sans lourdeur.
