  source_fidelity: 'Le sens général est fidèle : le prêtre impose un serment, la condition concerne l’absence de relations sexuelles avec un autre homme et l’absence d’égarement dans l’impureté pendant le mariage, puis vient l’exemption des eaux amères porteuses de malédiction. Toutefois, « pour te rendre impure » infléchit la construction hébraïque vers un but ou un résultat expressément formulé, alors que שָׂטִית טֻמְאָה associe l’égarement à l’impureté sans cette explicitation.'
  naturalness: Le français est fluide et d’un registre juridique-rituel approprié. « T’être égarée dans l’impureté » est à la fois naturel dans ce registre et plus proche de la formulation source.
  terminology: « Faire prêter serment », « coucher avec », « eaux amères » et « malédiction » conviennent. Le rendu idiomatique « alors que tu étais mariée » est sobre et évite de surinterpréter תחת אישך comme une assertion d’autorité exclusivement.
