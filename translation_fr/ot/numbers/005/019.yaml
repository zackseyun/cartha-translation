source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: fr
  text: 'Le prêtre lui fera prêter serment et dira à la femme : « Si aucun homme n’a couché avec toi, et si tu ne t’es pas égarée dans l’impureté alors que tu étais mariée[a], sois épargnée par ces eaux amères qui apportent la malédiction[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous ton mari » ; expression qui renvoie ici à sa condition de femme mariée et au lien conjugal.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « les eaux amères, celles qui apportent la malédiction ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ אֹתָהּ
  choice: lui fera prêter serment
  rationale: Le hifil de שבע exprime ici l’action de faire jurer ou de placer sous serment. Cette formulation française est naturelle et conserve la valeur causative.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: Si aucun homme n’a couché avec toi
  rationale: שׁכב est ici un euphémisme courant désignant les relations sexuelles. « Coucher avec » restitue naturellement cet euphémisme en français moderne.
- source_word: שָׂטִית טֻמְאָה
  choice: tu ne t’es pas détournée pour te rendre impure
  rationale: La formulation garde l’image de la déviation portée par שׂטה et le concept d’impureté de טֻמְאָה, sans réduire celle-ci à une catégorie exclusivement rituelle ou morale.
- source_word: תַּחַת אִישֵׁךְ
  choice: alors que tu étais mariée
  rationale: Littéralement « sous ton mari », l’expression renvoie ici à la condition conjugale de la femme. Une traduction idiomatique évite en français une formulation opaque ou susceptible de suggérer une position physique.
- source_word: הִנָּקִי
  choice: sois épargnée par
  rationale: Dans ce contexte d’ordalie, la forme exprime le fait d’être quitte ou indemne des effets des eaux. « Sois épargnée par » communique clairement ce résultat sans déclarer explicitement un acquittement judiciaire.
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים הָאֵלֶּה
  choice: ces eaux amères qui apportent la malédiction
  rationale: Le pluriel hébreu « eaux » et l’adjectif « amères » sont conservés. Le participe de ארר décrit les eaux comme produisant ou réalisant la malédiction.
theological_decisions:
- issue: Nature de la faute envisagée
  choice: Conserver les expressions concrètes « coucher avec », « se détourner » et « se rendre impure »
  alternative: Expliciter directement par « commettre l’adultère »
  rationale: Le contexte concerne l’infidélité conjugale présumée, mais l’hébreu ne la désigne pas ici par un terme juridique unique. La traduction préserve donc la texture et la portée du texte sans importer une précision supplémentaire.
- issue: Sens de תַּחַת אִישֵׁךְ
  choice: alors que tu étais mariée
  alternative: sous l’autorité de ton mari
  rationale: L’expression marque la situation et le lien conjugaux. La rendre en termes d’autorité seulement risquerait de résoudre trop étroitement l’idiome et d’accentuer une interprétation sociale particulière.
- issue: Effet des eaux
  choice: qui apportent la malédiction
  alternative: qui font tomber la malédiction
  rationale: Le participe présente les eaux comme porteuses ou productrices de malédiction, sans préciser davantage le mécanisme de l’ordalie.
translation_notes:
  register: Français international moderne, digne et accessible. Le style juridique et rituel est maintenu sans archaïsmes tels que « adjurer ». La syntaxe reste solennelle tout en étant naturelle à l’oral comme à l’écrit.
