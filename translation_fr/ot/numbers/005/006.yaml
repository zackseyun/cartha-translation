    rationale: Elle transforme le génitif hébreu « des péchés de l’humain / de l’humanité » en une relative et réduit la concision, tout en interprétant plus étroitement la relation exprimée par l’original.
  - severity: low
    issue: « ainsi » ajoute une liaison inférentielle non explicitement marquée.
    rationale: L’infinitif hébreu exprime l’acte de rupture de fidélité ; « en agissant infidèlement » le rend sans ajouter cette nuance discursive.
  - severity: low
    issue: « l’Éternel » ne correspond pas au choix effectif de la piste d’audit anglaise (« Yahweh »).
    rationale: Bien que traditionnel en français, « l’Éternel » est un titre interprétatif plutôt qu’une représentation du nom divin. « Yahvé » est clair et usuel en français.
