revisions:
- from: 'Parle aux fils d’Israël : Lorsqu’un homme ou une femme commet l’un quelconque des péchés dont les humains peuvent se rendre coupables[a], se montrant ainsi infidèle envers l’Éternel, cette personne devient coupable.'
  to: 'Parle aux fils d’Israël : Lorsqu’un homme ou une femme commet l’un quelconque des péchés humains[a], en agissant infidèlement envers Yahvé, cette personne est coupable.'
  rationale: La révision rapproche le français de la structure et de la concision de l’hébreu, préserve le sens générique de הָאָדָם par une note, et harmonise le rendu du nom divin avec l’audit anglais. Elle ne résout pas au-delà du texte l’étendue exacte de « péchés humains ».
