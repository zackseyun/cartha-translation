source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: fr
  text: 'Parle aux fils d’Israël : Lorsqu’un homme ou une femme commet l’un quelconque des péchés humains[a], en agissant infidèlement envers Yahvé, cette personne est coupable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’un quelconque des péchés de l’humain ». L’expression hébraïque désigne ici les êtres humains en général.'
    reason: Précise la portée générique de הָאָדָם tout en signalant la formulation littérale.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif intensif de דבר introduit directement une instruction divine ; « Parle » est naturel et concis en français biblique actuel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’image familiale et communautaire de l’hébreu, sans la réduire au simple ethnonyme « Israélites ».
- source_word: אִישׁ אֽוֹ אִשָּׁה
  choice: un homme ou une femme
  rationale: La paire explicite de l’hébreu est conservée et indique que la règle s’applique aux deux sexes.
- source_word: כִּי יַעֲשׂוּ
  choice: Lorsqu’un homme ou une femme commet
  rationale: Le verbe hébreu est au pluriel après une expression distributive au singulier ; le français emploie naturellement le singulier. « Lorsqu’ » convient à la formulation d’un cas juridique.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: l’un quelconque des péchés dont les humains peuvent se rendre coupables
  rationale: הָאָדָם désigne ici l’être humain en général. Cette formulation rend le caractère générique de l’expression tout en évitant l’ambiguïté moderne de « péchés de l’homme ».
- source_word: לִמְעֹל מַעַל
  choice: se montrant ainsi infidèle
  rationale: L’infinitif accompagné d’un nom de même racine souligne une rupture de fidélité. « Se montrer infidèle » exprime clairement cette déloyauté relationnelle ou covenantale.
- source_word: בַּיהוָה
  choice: envers l’Éternel
  rationale: Avec מעל, la préposition désigne celui envers qui l’infidélité est commise. « L’Éternel » est la forme française traditionnelle et intelligible employée ici pour le tétragramme.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: cette personne devient coupable
  rationale: נפש désigne ici la personne elle-même, non une « âme » au sens technique. Le verbe exprime son entrée dans un état de culpabilité ou de responsabilité.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: l’Éternel
  alternative: Yahvé ; le Seigneur
  rationale: « L’Éternel » est une désignation française traditionnelle du tétragramme et demeure claire pour le lectorat moderne. Une translittération comme « Yahvé » serait également possible, tandis que « le Seigneur » suivrait la tradition de substitution.
- issue: Portée de הָאָדָם dans la formule juridique
  choice: les humains
  alternative: l’homme ; l’humanité
  rationale: Le mot est générique dans ce contexte et ne limite pas le péché aux personnes de sexe masculin. Le rendu choisi explicite cette portée sans modifier l’application universelle du texte.
- issue: Nature de מעל envers יהוה
  choice: infidélité envers l’Éternel
  alternative: faute contre l’Éternel ; acte de perfidie envers l’Éternel
  rationale: Le terme évoque une rupture de fidélité, mais le verset ne définit pas davantage la relation juridique ou covenantale en jeu ; le rendu préserve cette largeur sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste nette, tandis que « fils d’Israël » conserve l’expression familiale de la source. La virgule finale de la couche anglaise n’est pas reproduite, le verset français étant présenté comme une phrase autonome.
