review_pass:
  verdict: revise
  source_fidelity: La formulation actuelle rend correctement la destination sacerdotale et la possession, mais elle ne représente pas explicitement le pluriel de יַקְרִיבוּ (« ils apporteront ») et peut faire de la contribution elle-même, plutôt que des dons sacrés, l’élément apporté. La révision rétablit la relation relative et exprime clairement « tous ».
  naturalness: La phrase révisée reste idiomatique dans un français moderne, sobre et juridique. « Contribution prélevée sur tous les dons sacrés » rend naturellement la construction cultuelle sans recourir à un calque.
  terminology: « Contribution prélevée », « dons sacrés », « fils d’Israël », « prêtre » et « lui appartiendra » sont appropriés et cohérents avec les valeurs lexicales du texte hébreu. La note sur « fils d’Israël » est conservée.
  issues:
