  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: fr
  text: Toute contribution prélevée sur tous les dons sacrés que les fils d’Israël[a] apporteront au prêtre lui appartiendra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Israélites ». L’hébreu dit littéralement « fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: contribution prélevée
  rationale: Le terme désigne une part mise à part et remise comme offrande ou droit sacerdotal. « Contribution prélevée » exprime naturellement en français l’idée d’un don retiré d’un ensemble pour être consacré.
- source_word: קָדְשֵׁי
  choice: dons sacrés
  rationale: Le pluriel construit désigne ici les biens consacrés apportés par les Israélites. « Dons sacrés » est clair, digne et plus contextuel que le littéral « choses saintes ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: Cette formulation conserve le terme familial masculin du texte hébreu, tandis qu’une note signale l’équivalent collectif courant « Israélites ».
- source_word: יַקְרִיבוּ
  choice: apportée
  rationale: Dans ce contexte cultuel, le hiphil de קרב signifie faire approcher, présenter ou apporter. « Apportée » est naturel en français et maintient l’idée de remise au prêtre sans calque maladroit.
- source_word: לַכֹּהֵן
  choice: au prêtre
  rationale: La préposition indique ici le destinataire de la contribution; « au prêtre » correspond directement et idiomatiquement au français.
- source_word: לוֹ יִהְיֶה
  choice: lui appartiendra
  rationale: L’expression hébraïque établit juridiquement la possession. Le futur français « lui appartiendra » rend clairement cette valeur normative.
theological_decisions:
- issue: Désignation de la communauté d’alliance בְנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites
  rationale: Aucun enjeu doctrinal particulier n’impose de neutraliser ou d’expliciter davantage l’expression. Le texte principal conserve sa forme familiale masculine, et la note fournit l’équivalent collectif idiomatique.
translation_notes:
  register: Français international moderne, sobre et juridique. La phrase conserve la portée cultuelle et possessive du verset tout en évitant le calque peu naturel « faire approcher ». Le relatif anglais est rendu par une coordination participiale afin de limiter l’ambiguïté de rattachement en français.
