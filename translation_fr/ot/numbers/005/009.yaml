    rationale: יַקְרִיבוּ a pour sujet les fils d’Israël. Dans le texte actuel, « apportée » s’accorde avec « contribution » et laisse entendre que celle-ci est apportée, alors que la relative hébraïque se rattache naturellement aux dons sacrés apportés par les Israélites.
  - severity: low
    issue: La portée de « tous » (לְכָל) n’est pas explicite.
    rationale: « Les dons sacrés » peut avoir une valeur générique, mais « tous les dons sacrés » rend plus directement l’universel exprimé dans l’hébreu.
  revised_text: Toute contribution prélevée sur tous les dons sacrés que les fils d’Israël[a] apporteront au prêtre lui appartiendra.
  revised_footnotes:
