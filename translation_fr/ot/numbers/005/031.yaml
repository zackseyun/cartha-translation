id: NUM.5.31
reference: Numbers 5:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נִקָּ֥ה הָ/אִ֖ישׁ מֵ/עָוֺ֑ן וְ/הָ/אִשָּׁ֣ה הַ/הִ֔וא תִּשָּׂ֖א אֶת עֲוֺנָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: fr
  text: Alors l’homme sera dégagé de toute culpabilité[a], mais cette femme portera sa faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le mari sera dégagé de toute culpabilité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « portera sa culpabilité »; l’expression hébraïque peut aussi impliquer qu’elle subira les conséquences de sa faute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: sera dégagé
  rationale: Le niphal de נקה exprime ici le fait d’être exempté ou libéré d’une responsabilité. « Sera dégagé de toute culpabilité » est naturel en français et garde la portée juridico-morale de la construction avec מִן.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: אִישׁ signifie formellement « homme »; dans le contexte, il s’agit du mari. Le texte principal conserve le terme le plus proche de l’hébreu, tandis que la note indique la valeur contextuelle.
- source_word: מֵעָוֺן
  choice: de toute culpabilité
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences qui en découlent. Avec נקה, « culpabilité » exprime clairement l’exemption de responsabilité; « toute » rend idiomatiquement en français la portée de l’absence de culpabilité sans ajouter une distinction doctrinale.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: mais cette femme
  rationale: Le ו relie les propositions, mais leur rapport est contrastif. « Mais » rend naturellement ce contraste, et « cette femme » préserve l’emphase du démonstratif הַהִוא.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: portera sa faute
  rationale: L’expression נשׂא עָוֹן signifie porter sa faute ou sa culpabilité, souvent avec l’idée d’en subir les conséquences. « Portera sa faute » conserve l’image et l’ambiguïté de l’expression hébraïque.
theological_decisions:
- issue: Portée de עָוֹן dans les deux propositions
  choice: Rendre le premier emploi par « culpabilité » et le second par « faute », avec une note sur les conséquences possibles.
  alternative: Employer « culpabilité » dans les deux propositions, ou expliciter « subira les conséquences de sa faute ».
  rationale: La variation française évite une tournure lourde tout en maintenant le parallèle entre l’exemption de l’homme et la responsabilité de la femme. La note préserve la tension sémantique de עָוֹן entre faute, culpabilité et conséquences, sans choisir exclusivement l’un de ces aspects.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure hébraïque tout en étant naturelle à l’oral et à l’écrit. Les notes signalent la valeur contextuelle de « l’homme » et l’étendue sémantique de l’expression « porter sa faute ».
