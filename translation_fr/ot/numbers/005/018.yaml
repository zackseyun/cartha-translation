  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: fr
  text: Le prêtre placera la femme devant Yahweh, dénouera ses cheveux[a] et déposera dans ses mains l’offrande de céréales commémorative — c’est une offrande de céréales de jalousie —, et il tiendra dans sa main les eaux amères qui apportent la malédiction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « découvrira la tête de la femme » ou « laissera retomber librement ses cheveux ». L’expression hébraïque parle littéralement de la « tête » de la femme et peut désigner le fait de dénouer sa chevelure dans le cadre du rite.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui apportent une malédiction ». Le participe hébreu présente ces eaux comme produisant ou portant la malédiction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: placera
  rationale: Le hiphil de עמד exprime ici l’action de faire tenir ou de présenter officiellement la femme; « placera » convient au geste rituel en français naturel.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: L’expression cultuelle indique la présence de Dieu; le nom divin יהוה est transcrit « Yahweh ».
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: dénouera ses cheveux
  rationale: L’expression mentionne littéralement la tête de la femme, mais פרע désigne vraisemblablement ici le fait de libérer ou dénouer sa chevelure dans le cadre du rite. Une note conserve les autres possibilités.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: déposera dans ses mains
  rationale: Littéralement « mettra sur ses paumes »; « dans ses mains » restitue naturellement le geste concret.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: l’offrande végétale de rappel
  rationale: מִנְחָה désigne ici une offrande faite de produits végétaux, et זִכָּרוֹן ce qui sert de rappel ou de mémorial. « De rappel » garde ouverte la question de ce qui est rappelé et à qui.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: c’est une offrande végétale de jalousie
  rationale: Le pluriel hébreu קְנָאֹת a ici une valeur abstraite; le singulier français « jalousie » est naturel, tandis que la répétition d’« offrande végétale » conserve l’apposition hébraïque.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: Le prêtre, lui, tiendra dans sa main
  rationale: Cette formulation française rend la proposition circonstancielle et conserve le singulier concret « main » de l’hébreu.
- source_word: מֵי הַמָּרִים
  choice: les eaux amères
  rationale: Le pluriel « eaux » reflète l’expression hébraïque tout en restant intelligible dans un registre biblique moderne.
- source_word: הַמְאָרֲרִים
  choice: qui apportent la malédiction
  rationale: Le participe décrit les eaux comme porteuses ou productrices de la malédiction; l’article défini est plausible dans ce rite précis, sans effacer l’autre lecture possible signalée en note.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de הַמְאָרֲרִים
  choice: les eaux qui apportent la malédiction
  alternative: les eaux qui apportent une malédiction
  rationale: L’article hébreu peut renvoyer à la malédiction rituelle déterminée par le contexte, mais le participe peut aussi être rendu de façon plus indéfinie; la note préserve cette nuance.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement répartie en deux phrases pour éviter une période trop lourde, sans modifier la succession des gestes rituels. « Offrande végétale » est retenu plutôt que « offrande de céréales », car מִנְחָה désigne plus largement l’offrande non animale prescrite dans le cadre sacerdotal.
