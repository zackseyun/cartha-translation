revisions:
- from: Le prêtre placera la femme devant Yahweh, dénouera ses cheveux[a] et déposera dans ses mains l’offrande végétale de rappel — c’est une offrande végétale de jalousie. Le prêtre, lui, tiendra dans sa main les eaux amères qui apportent la malédiction[b].
  to: Le prêtre placera la femme devant Yahweh, dénouera ses cheveux[a] et déposera dans ses mains l’offrande de céréales commémorative — c’est une offrande de céréales de jalousie —, et il tiendra dans sa main les eaux amères qui apportent la malédiction[b].
  rationale: La révision précise le terme cultuel français pour מנחה, remplace une collocation peu naturelle par « commémorative » pour זִכָּרוֹן, et retire un contraste discursif non marqué dans le texte source. La traduction conserve l’ambiguïté de פרע dans la note ainsi que la nuance possible de l’expression relative aux eaux.
