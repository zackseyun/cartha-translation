base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: fr
  text: Le prêtre prendra alors une poignée de l’offrande de céréales, sa part commémorative, et la brûlera sur l’autel. Après quoi, il fera boire l’eau à la femme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָמַץ
  choice: prendra alors une poignée
  rationale: Dans le contexte sacrificiel, קמץ désigne l’action de prélever une poignée. Le futur français convient à cette prescription rituelle, et « alors » marque la succession.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français usuel de כֹּהֵן dans un contexte cultuel.
- source_word: מִן הַמִּנְחָה
  choice: de l’offrande de céréales
  rationale: Dans la législation sacerdotale, מִנְחָה désigne ici l’offrande non sanglante constituée de produits céréaliers; cette formulation est précise et compréhensible.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: sa part commémorative
  rationale: אַזְכָּרָה désigne la part de l’offrande brûlée sur l’autel comme mémorial. Le possessif féminin renvoie à l’offrande de céréales.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: et la fera brûler sur l’autel
  rationale: Dans l’usage sacrificiel, הקטיר signifie faire brûler une offrande, avec l’idée qu’elle monte en fumée. Le pronom « la » reprend naturellement « la part commémorative ».
- source_word: וְאַחַר
  choice: Après quoi
  rationale: Cette locution temporelle exprime clairement la succession des actes prescrits.
- source_word: יַשְׁקֶה
  choice: il fera boire
  rationale: Le hifil de שׁקה est causatif. « Faire boire » en conserve directement la valeur sans surcharger la phrase.
- source_word: אֶת הָאִשָּׁה
  choice: à la femme
  rationale: En français, la construction idiomatique de « faire boire » place la personne sous la forme d’un complément introduit par « à » lorsque la boisson est aussi exprimée.
- source_word: אֶת הַמָּיִם
  choice: l’eau
  rationale: Le texte hébreu de ce verset dit simplement « l’eau »; il n’y a donc pas lieu d’ajouter ici l’adjectif « amère » fourni par le contexte plus large.
theological_decisions:
- issue: Faut-il qualifier l’eau d’« amère » d’après le contexte rituel plus large ?
  choice: Conserver simplement « l’eau ».
  alternative: « l’eau amère »
  rationale: Le verset porte uniquement הַמָּיִם, « l’eau ». Ajouter « amère » importerait dans ce verset une précision présente dans le contexte, mais absente de sa formulation propre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la séquence rituelle hébraïque tout en employant une syntaxe française naturelle. Aucune note n’est nécessaire, puisque « l’eau » reproduit directement le texte de ce verset sans introduire de variante textuelle ou lexicale.
