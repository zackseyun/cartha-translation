  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: fr
  text: Les dons sacrés de chaque homme lui appartiendront[a] ; tout ce qu’un homme donnera au prêtre lui appartiendra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses choses saintes seront à lui ». Il s’agit de biens consacrés comme offrandes ; « lui » renvoie à chaque homme.'
    reason: lexical_alternative
  - marker: b
    text: 'Dans cette seconde proposition, « lui » renvoie naturellement au prêtre : ce qui lui est donné lui appartient.'
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: chaque homme / un homme
  rationale: Le nom masculin singulier a ici une valeur distributive dans un contexte juridique. La première occurrence est rendue par « chaque homme », la seconde par « un homme » dans la proposition relative généralisante.
- source_word: קֳדָשָׁיו
  choice: ses dons sacrés
  rationale: Le pluriel désigne ici des biens mis à part pour le culte. « Dons sacrés » exprime naturellement leur caractère consacré, tandis que « choses saintes » serait plus littéral mais moins idiomatique.
- source_word: לוֹ יִהְיוּ
  choice: lui appartiendront
  rationale: La construction exprime la possession. Cette formulation française est naturelle tout en conservant le pronom hébreu et son référent implicite.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: tout ce qu’un homme donnera au prêtre
  rationale: « Tout ce que » rend la portée générale de la proposition relative, et « au prêtre » conserve le singulier défini de l’hébreu.
- source_word: לוֹ יִהְיֶה
  choice: lui appartiendra
  rationale: La formule de possession est répétée comme dans l’hébreu. Dans la seconde proposition, le prêtre est le référent naturel du pronom.
theological_decisions:
- issue: Référent des pronoms possessifs implicites
  choice: Conserver dans le texte les pronoms « lui », avec une note pour chacun
  alternative: Expliciter directement « à cet homme » puis « au prêtre »
  rationale: L’hébreu ne nomme pas les référents dans les deux formules de possession. Le contexte et la syntaxe orientent l’interprétation, mais une traduction qui expliciterait les deux référents supprimerait la concision et une part de l’ambiguïté du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste concise. « Dons sacrés » évite le tour peu naturel « choses saintes », tandis que les pronoms « lui » préservent la structure serrée de l’hébreu.
