  naturalness: La formulation révisée est naturelle en français international moderne et garde la phrase en suspens, comme l’exige la continuité syntaxique avec le verset suivant. « Alors que tu étais mariée » rend idiomatiquement la situation exprimée par l’hébreu; la note conserve l’image littérale.
  terminology: « Impure » préserve la catégorie rituelle et juridique de טמא. « Ait couché avec toi » restitue de manière claire et non crue l’euphémisme hébreu. « Égarée » conserve l’image de l’écart sans imposer la qualification interprétative « infidèle » dans le texte principal.
