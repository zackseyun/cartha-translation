  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: fr
  text: Mais si tu t’es égarée alors que tu étais mariée[a], si tu es devenue impure, et qu’un homme autre que ton mari ait couché avec toi[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sous ton mari ». Cette expression évoque la situation de la femme dans le lien conjugal et peut aussi se traduire par « alors que tu étais mariée ». Le verbe « t’es égarée » peut, dans ce contexte, désigner l’infidélité envers ton mari.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici une expression euphémique, littéralement « un homme a donné en toi son coucher », pour désigner des relations sexuelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: tu t’es détournée
  rationale: Le verbe exprime une déviation, ici dans le cadre de la fidélité conjugale. « T’es détournée » conserve cette image tout en restant naturel en français.
- source_word: תַּחַת אִישֵׁךְ
  choice: de ton mari
  rationale: Littéralement « sous ton mari », expression liée au lien conjugal. En français actuel, « te détourner de ton mari » transmet clairement le sens contextuel sans conserver un calque obscur.
- source_word: נִטְמֵאת
  choice: tu t’es rendue impure
  rationale: Le niphal de טמא indique ici une souillure dans le cadre rituel et juridique. « Impure » préserve cette catégorie biblique, tandis que la tournure pronominale exprime naturellement le résultat de l’acte.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: un homme a couché avec toi
  rationale: L’expression hébraïque, littéralement « un homme a mis/donné en toi sa couche », est un euphémisme sexuel. « A couché avec toi » en restitue clairement le sens et le registre euphémique.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: un autre homme que ton mari
  rationale: La préposition marque l’exclusion. Cette formulation française indique sans ambiguïté qu’il s’agit d’un homme autre que le mari.
theological_decisions:
- issue: Traduction de l’image de l’infidélité conjugale sans dépasser l’hébreu
  choice: « tu t’es détournée de ton mari », suivi de l’expression sexuelle explicite mais euphémique « a couché avec toi »
  alternative: « tu as été infidèle à ton mari »
  rationale: Le choix retenu conserve l’image de la déviation présente dans שׂטה, tandis que la proposition suivante précise la nature sexuelle de l’acte. Il évite ainsi d’ajouter une qualification doctrinale ou morale qui ne serait pas nécessaire.
- issue: Valeur de l’impureté exprimée par נִטְמֵאת
  choice: « tu t’es rendue impure »
  alternative: « tu as été souillée »
  rationale: « Impure » maintient la dimension rituelle et juridique du vocabulaire de טמא sans réduire le terme à une seule nuance morale ou physique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement suit l’adresse directe au singulier féminin. La phrase demeure suspendue par un tiret, conformément à la structure du serment qui se poursuit au verset suivant.
