  verdict: revise
  source_fidelity: 'La structure et les principaux termes du texte hébreu sont bien rendus : relation sexuelle, secret à l’égard du mari, absence de témoin et absence de prise sur le fait. Toutefois, « elle s’est rendue impure » attribue à la femme l’action de se rendre elle-même impure, alors que נִטְמָאָה est un nifal qui décrit son accession à l’état d’impureté sans expliciter une telle agentivité.'
  naturalness: Le français est globalement fluide et adapté à un registre juridique sobre. « Elle est devenue impure » est à la fois plus naturel dans ce contexte et plus fidèle à la voix du texte source. « Elle s’est cachée » conserve une formulation française idiomatique sans l’ajout aspectuel de « s’est tenue cachée ».
  terminology: « Émission de semence », « impure » et « témoin contre elle » maintiennent utilement le vocabulaire corporel, rituel et juridique. La note sur « saisie » préserve correctement une possibilité du verbe final sans imposer l’interprétation de la contrainte.
