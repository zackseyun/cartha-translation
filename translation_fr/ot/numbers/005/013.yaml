  - severity: low
    issue: « elle s’est tenue cachée » ajoute une nuance durative
    rationale: וְנִסְתְּרָה exprime le fait d’être cachée ou de se cacher. « Elle s’est cachée » rend plus directement la forme pronominale française tout en évitant l’ajout de durée impliqué par « s’est tenue ».
  revised_text: un homme a couché avec elle, avec émission de semence[a], à l’insu de son mari ; elle s’est cachée et est devenue impure, sans qu’il y ait de témoin contre elle, et elle n’a pas été surprise[b] —
