  rationale: La révision retire l’agentivité causative ajoutée par « s’est rendue impure » et rend נִטְמָאָה par « est devenue impure », qui préserve la catégorie d’impureté sans déterminer son agent. Elle simplifie aussi « s’est tenue cachée » en « s’est cachée », sans modifier le sens général ni l’ouverture syntaxique du verset.
