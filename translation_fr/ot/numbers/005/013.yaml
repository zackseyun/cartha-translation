  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: fr
  text: un homme a couché avec elle, avec émission de semence[a], à l’insu de son mari ; elle s’est cachée et est devenue impure, sans qu’il y ait de témoin contre elle, et elle n’a pas été surprise[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’un coucher de semence », expression désignant un rapport sexuel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « elle n’a pas été saisie ». Certains comprennent : « elle n’a pas été contrainte ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: un homme a couché avec elle
  rationale: « Coucher avec » exprime clairement et dignement le sens sexuel de שׁכב avec un complément de personne. Le passé composé s’intègre naturellement au cas juridique hypothétique commencé au verset précédent.
- source_word: שִׁכְבַת זֶרַע
  choice: avec émission de semence
  rationale: Cette formulation conserve la mention explicite de זֶרַע et la portée corporelle de l’expression hébraïque, importante dans un contexte de pureté, sans employer un langage inutilement cru.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: à l’insu de son mari
  rationale: Expression française naturelle qui rend l’idée que les faits ont échappé au regard et à la connaissance du mari.
- source_word: וְנִסְתְּרָה
  choice: elle s’est tenue cachée
  rationale: Le pronominal conserve la nuance moyenne ou réfléchie possible du nifal et maintient la femme comme sujet grammatical.
- source_word: וְהִיא נִטְמָאָה
  choice: elle s’est rendue impure
  rationale: « Impure » préserve le vocabulaire juridique et cultuel de טמא. La tournure pronominale rend ici l’entrée dans cet état sans remplacer la catégorie textuelle par le terme plus chargé « souillée ».
- source_word: וְעֵד אֵין בָּהּ
  choice: sans qu’il y ait de témoin contre elle
  rationale: « Contre elle » exprime naturellement la portée judiciaire probable de בָּהּ, tout en reconnaissant en note implicite de décision que « à son sujet » reste possible.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: elle n’a pas été surprise
  rationale: Dans ce contexte de faute demeurée secrète et sans témoin, « surprise » signifie prise sur le fait. Le sens possible « saisie », parfois compris comme une allusion à la contrainte, est conservé en note.
theological_decisions:
- issue: Portée du langage d’impureté נִטְמָאָה
  choice: elle s’est rendue impure
  alternative: elle a été souillée
  rationale: Le choix maintient la catégorie de pureté du texte sans accentuer indûment une lecture morale ou émotionnelle.
- issue: Sens de לֹא נִתְפָּשָׂה
  choice: elle n’a pas été surprise
  alternative: 'elle n’a pas été saisie ; certains comprennent : elle n’a pas été contrainte'
  rationale: Le contexte immédiat insiste sur l’absence de découverte et de témoin, ce qui favorise « surprise [sur le fait] ». La forme hébraïque peut toutefois signifier « saisie », et l’éventuelle implication de contrainte ne doit pas être effacée.
- issue: Agentivité de וְנִסְתְּרָה
  choice: elle s’est tenue cachée
  alternative: elle a agi en secret ; elle a été cachée
  rationale: Le nifal autorise une nuance passive ou réfléchie. La traduction choisie préserve autant que possible cette tension sans préciser qui aurait dissimulé les faits.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe juridique fluide. Le verset demeure syntaxiquement ouvert par un tiret, puisqu’il poursuit la proposition conditionnelle commencée au verset précédent. Les formulations explicites mais non vulgaires préservent le contexte sexuel et les catégories de pureté du texte hébreu.
