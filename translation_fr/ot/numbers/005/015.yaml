source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: fr
  text: 'L’homme amènera sa femme au prêtre et apportera pour elle son offrande : un dixième d’épha de farine d’orge. Il ne versera pas d’huile dessus et n’y mettra pas d’oliban, car c’est une offrande de céréales liée à la jalousie[a], une offrande commémorative qui remet la faute en mémoire[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une offrande de céréales de jalousies »; le pluriel hébreu peut exprimer la jalousie intense ou les accès de jalousie liés à cette affaire.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « faute » peut aussi désigner la culpabilité ou les conséquences d’un tort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת־אִשְׁתּוֹ
  choice: L’homme amènera sa femme
  rationale: Dans cette prescription juridique, la forme verbale a une valeur injonctive. « L’homme » conserve le terme hébreu, tandis que « sa femme » explicite naturellement le lien conjugal.
- source_word: אֶל־הַכֹּהֵן
  choice: au prêtre
  rationale: Rendu direct du titre cultuel hébreu.
- source_word: וְהֵבִיא אֶת־קָרְבָּנָהּ עָלֶיהָ
  choice: et apportera pour elle son offrande
  rationale: Le suffixe féminin désigne l’offrande rattachée à la femme, bien que l’homme l’apporte en sa faveur.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: un dixième d’épha
  rationale: La mesure ancienne est translittérée plutôt que convertie approximativement.
- source_word: קֶמַח שְׂעֹרִים
  choice: farine d’orge
  rationale: Expression française naturelle et lexicalement exacte pour la farine produite à partir d’orge.
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן
  choice: Il ne versera pas d’huile dessus
  rationale: Le pronom renvoie à l’offrande; « verser dessus » rend directement le geste prescrit.
- source_word: וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: et n’y mettra pas d’encens
  rationale: לְבֹנָה désigne l’oliban, couramment appelé « encens » en français biblique et général.
- source_word: מִנְחַת קְנָאֹת
  choice: une offrande de céréales liée à la jalousie
  rationale: מִנְחָה désigne ici l’offrande céréalière. La formulation relationnelle conserve l’étendue de קְנָאֹת sans faire de la jalousie la matière de l’offrande.
- source_word: מִנְחַת זִכָּרוֹן
  choice: une offrande commémorative
  rationale: זִכָּרוֹן exprime la fonction de mémoire ou de rappel; « commémorative » est naturel et digne en français.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: qui remet la faute en mémoire
  rationale: La proposition relative rend clairement la valeur fonctionnelle du participe tout en laissant ouverte la portée précise de עָוֹן.
theological_decisions:
- issue: La fonction judiciaire de l’offrande et le statut de la femme
  choice: Décrire l’offrande comme remettant la faute en mémoire sans déclarer la femme coupable.
  alternative: Présenter le rite comme présupposant sa culpabilité, ou au contraire comme purement symbolique et sans portée judiciaire.
  rationale: Le verset énonce la composition et la fonction mémorielle de l’offrande, mais ne tranche pas encore la question de la culpabilité. La traduction conserve cette tension.
- issue: Portée de קְנָאֹת
  choice: « liée à la jalousie »
  alternative: « de jalousie » ou « des soupçons jaloux »
  rationale: Cette formulation garde le lien avec la jalousie qui motive le rite sans préciser abusivement si elle est légitime, possessive ou simplement soupçonneuse.
translation_notes:
  register: Français international moderne, clair et solennel. Le futur conserve le ton normatif du texte juridique. « Épha » maintient l’unité ancienne; « offrande de céréales » rend le vocabulaire sacrificiel de manière accessible. Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondant réellement aux notes.
