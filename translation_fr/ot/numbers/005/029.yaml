  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: fr
  text: Telle est la loi concernant la jalousie[a], lorsqu’une femme mariée se détourne de son mari[b] et devient impure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un pluriel, « les jalousies », probablement comme désignation technique de cette procédure légale.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « se détourne sous son mari » : l’expression renvoie au fait qu’elle est liée à son mari par le mariage.'
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Telle est la loi concernant
  rationale: Cette tournure française naturelle conserve la formule récapitulative juridique hébraïque.
- source_word: הַקְּנָאֹת
  choice: la jalousie
  rationale: Le pluriel hébreu sert vraisemblablement de désignation technique de la procédure; le singulier collectif est plus idiomatique en français, avec une note signalant la forme source.
- source_word: אֲשֶׁר
  choice: lorsqu’
  rationale: La particule relative introduit ici le cas auquel la loi s’applique.
- source_word: תִּשְׂטֶה
  choice: se détourne
  rationale: Le verbe évoque métaphoriquement un écart par rapport à la fidélité conjugale sans expliciter davantage l’acte.
- source_word: אִשָּׁה
  choice: une femme mariée
  rationale: Le contexte conjugal impose ici le sens d’épouse; cette formulation est claire en français moderne.
- source_word: תַּחַת אִישָׁהּ
  choice: de son mari
  rationale: Dans ce contexte, l’expression littérale « sous son mari » décrit le lien conjugal. « Se détourne de son mari » intègre naturellement l’idiome sans introduire explicitement la notion contestable d’autorité.
- source_word: וְנִטְמָאָה
  choice: et se rend impure
  rationale: Cette formulation conserve le langage d’impureté et la nuance de changement d’état du niphal, sans remplacer le terme par une accusation explicite d’adultère.
theological_decisions:
- issue: Nature de l’impureté dans la loi relative au soupçon d’infidélité
  choice: se rend impure
  alternative: devient impure; commet un adultère
  rationale: L’hébreu emploie le vocabulaire de l’impureté dans un contexte sexuel, mais ne formule pas ici directement « commet un adultère ». La traduction préserve cette catégorie et sa tension.
- issue: Sens de l’expression תַּחַת אִישָׁהּ
  choice: se détourne de son mari
  alternative: sous l’autorité de son mari; alors qu’elle est liée à son mari
  rationale: L’expression renvoie au lien conjugal. La traduction évite de trancher inutilement en faveur d’une lecture exclusivement fondée sur l’autorité, tout en gardant le rapport au mari.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste concise; les métaphores hébraïques et le vocabulaire d’impureté sont préservés sans surinterprétation.
