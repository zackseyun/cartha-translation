  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: fr
  text: Vous ferez sortir du camp tout homme et toute femme ; vous les ferez sortir afin qu’ils ne rendent pas impurs leurs campements[a], au milieu desquels[b] je demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte le pluriel « leurs camps », qui peut désigner les différentes divisions ou installations du camp.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « au milieu d’eux » : l’hébreu peut renvoyer soit aux campements, soit aux personnes qui y sont rassemblées.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: aussi bien les hommes que les femmes
  rationale: La tournure hébraïque exprime l’inclusion de toute la gamme, sans exception liée au sexe. Cette formulation est naturelle en français et conserve la distinction homme-femme du contexte humain.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: vous renverrez… vous les renverrez
  rationale: La répétition du piel de שלח est maintenue pour préserver l’insistance du texte, sans donner au geste une nuance punitive plus forte que l’hébreu.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Rendu français idiomatique qui exprime clairement le déplacement au-delà des limites du camp.
- source_word: יְטַמְּאוּ
  choice: rendent impurs
  rationale: Dans ce contexte sacerdotal, טמא concerne l’impureté rituelle. « Rendre impurs » conserve cette portée mieux que « contaminer ».
- source_word: מַחֲנֵיהֶם
  choice: leurs campements
  rationale: Le substantif hébreu est au pluriel avec un suffixe de troisième personne du masculin pluriel. « Campements » préserve ce pluriel, qui peut viser les différentes parties ou divisions du camp d’Israël.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: au milieu desquels j’habite
  rationale: Cette formulation rattache grammaticalement la proposition aux « campements » tout en conservant l’idée solennelle de la présence de Dieu au milieu d’Israël.
theological_decisions:
- issue: Référent de אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: « au milieu desquels j’habite », avec rattachement grammatical aux campements
  alternative: « au milieu d’eux j’habite », en référence aux Israélites associés aux campements
  rationale: Le suffixe masculin pluriel peut renvoyer aux campements au pluriel ou, selon le sens, aux personnes qui y vivent. Le texte principal suit l’antécédent explicite sans supprimer l’autre possibilité, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition rhétorique de « renverrez » et le vocabulaire sacerdotal de l’impureté sont conservés. Les deux marqueurs de note figurent dans le texte principal.
