  timestamp: '2026-07-14T12:47:42Z'
review_pass:
  verdict: revise
  source_fidelity: Le pluriel de מַחֲנֵיהֶם est correctement conservé par « leurs campements », et la note b signale correctement l’ambiguïté du suffixe dans « au milieu d’eux ». Toutefois, « renvoyer » évoque souvent en français le fait de renvoyer quelqu’un à son lieu d’origine et est moins précis ici que la sortie ordonnée hors du camp. « Faire sortir » rend clairement l’éloignement spatial sans renforcer indûment le verbe en expulsion punitive.
  naturalness: Le texte est globalement clair et de registre approprié. « Vous ferez sortir du camp tout homme et toute femme » est plus idiomatique et plus net que « vous renverrez hors du camp aussi bien les hommes que les femmes », tout en préservant l’inclusivité de l’hébreu et la répétition verbale.
  terminology: « Rendre impurs » convient bien au contexte d’impureté rituelle. « Demeure » exprime plus naturellement, dans un registre biblique français moderne, la présence divine portée par שכן. Les deux notes sont conservées avec leurs ancres et légèrement précisées.
