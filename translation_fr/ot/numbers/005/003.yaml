    rationale: En français courant, ce verbe peut suggérer le retour d’une personne plutôt que son éloignement au-delà de la limite du camp. « Faire sortir » explicite le mouvement exigé par le texte hébreu sans ajouter une connotation pénale.
  - severity: low
    issue: La note a ajoute « d’Israël » et emploie « zones ».
    rationale: L’explication peut rester plus proche du verset et plus neutre en parlant de divisions ou d’installations du camp, sans ajout contextuel inutile.
