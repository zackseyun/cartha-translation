revisions:
- from: Vous renverrez hors du camp aussi bien les hommes que les femmes ; vous les renverrez afin qu’ils ne rendent pas impurs leurs campements[a], au milieu desquels[b] j’habite.
  to: Vous ferez sortir du camp tout homme et toute femme ; vous les ferez sortir afin qu’ils ne rendent pas impurs leurs campements[a], au milieu desquels[b] je demeure.
  rationale: La révision remplace « renverrez » par « ferez sortir » afin de rendre plus exactement l’ordre de retrait hors du camp, tout en maintenant la répétition du verbe hébreu. Elle conserve le pluriel de « campements », le vocabulaire rituel d’impureté et l’ambiguïté du dernier pronom au moyen de la note ancrée. « Je demeure » convient au registre et à la notion de présence divine sans ajout doctrinal.
