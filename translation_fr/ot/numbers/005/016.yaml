  text: וְ/הִקְרִ֥יב אֹתָ֖/הּ הַ/כֹּהֵ֑ן וְ/הֶֽעֱמִדָ֖/הּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: fr
  text: Alors le prêtre la fera approcher et la fera se tenir devant Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement rendu par « le SEIGNEUR » ; autre forme possible : « Yahvé ».'
    reason: Signaler la forme hébraïque du nom divin ainsi que ses principaux rendus en français.
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: la fera approcher
  rationale: Le hifil de קרב exprime ici le fait de faire approcher la femme. Cette formulation conserve la valeur causative et spatiale du verbe, en lien avec sa présentation devant Yahweh.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כֹּהֵן dans un contexte cultuel et juridique.
- source_word: וְהֶעֱמִדָהּ
  choice: la fera se tenir
  rationale: 'Le hifil de עמד est causatif : le prêtre fait en sorte que la femme se tienne debout. « La fera se tenir » préserve cette nuance sans alourdir la phrase.'
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend naturellement la position en présence de quelqu’un et correspond à l’emploi habituel de לִפְנֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin YHWH, qui conserve ici le nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte directement le tétragramme YHWH. Le texte principal conserve donc le nom divin sous la forme « Yahweh », tandis que la note signale le rendu français traditionnel.
translation_notes:
  register: Français moderne, clair et digne. La répétition causative « fera… fera… » reflète les deux formes verbales hébraïques et convient au registre juridique du passage.
