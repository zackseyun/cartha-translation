  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: fr
  text: 'Lorsqu’il lui fera boire l’eau, si elle s’est souillée et a été infidèle à son mari, l’eau qui apporte la malédiction entrera en elle pour produire de l’amertume[a] : son ventre enflera, sa cuisse dépérira[b], et cette femme deviendra un objet de malédiction au milieu de son peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entrera en elle comme une eau amère ». L’expression hébraïque traduite par « pour produire de l’amertume » est difficile et peut décrire soit l’effet de l’eau, soit sa qualité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sa cuisse tombera ». Il s’agit probablement d’un euphémisme désignant une grave atteinte corporelle touchant ses organes reproducteurs, mais le sens exact reste incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: Quand il lui aura fait boire l’eau
  rationale: Le hifil de שׁקה exprime la causation, « faire boire ». Le futur antérieur introduit naturellement en français l’action préalable à la conséquence conditionnelle.
- source_word: נִטְמְאָה
  choice: elle s’est rendue impure
  rationale: Cette formulation conserve la notion d’impureté morale et rituelle ainsi que la valeur contextuellement réfléchie, sans réduire le terme à une seule catégorie.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: a été infidèle à son mari
  rationale: La construction intensive avec מעל désigne une rupture de fidélité. Cette expression est naturelle en français et maintient la dimension relationnelle de la faute.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: l’eau qui porte la malédiction
  rationale: Le participe qualifie l’eau comme porteuse ou agente de la malédiction. « Porte la malédiction » reste clair sans préciser excessivement le mécanisme.
- source_word: וּבָאוּ בָהּ
  choice: entrera en elle
  rationale: Le pluriel hébreu מַיִם est rendu par le singulier collectif français « l’eau ». Le verbe בוא avec ב indique l’entrée dans son corps.
- source_word: לְמָרִים
  choice: pour produire de l’amertume
  rationale: La formule hébraïque est difficile. Cette traduction conserve la valeur résultative probable de לְ tout en laissant « amertume » assez ouvert quant à la nature exacte de l’effet.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: son ventre enflera
  rationale: בטן désigne directement le ventre ou l’abdomen. « Ventre » évite d’imposer l’interprétation plus précise « utérus ».
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: sa cuisse dépérira
  rationale: יָרֵךְ signifie littéralement « cuisse », mais peut servir d’euphémisme corporel ou reproductif. « Dépérira » rend intelligible l’affliction sans prétendre résoudre l’expression obscure.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: cette femme deviendra un objet de malédiction au milieu de son peuple
  rationale: « Objet de malédiction » exprime qu’elle deviendra publiquement un exemple ou une formule de malédiction. « Au milieu de son peuple » conserve la dimension communautaire.
theological_decisions:
- issue: Nature exacte de l’affliction corporelle décrite par la formule de l’épreuve
  choice: Conserver « son ventre enflera, sa cuisse dépérira » dans le texte principal
  alternative: « son ventre enflera et ses organes reproducteurs seront atteints » ou une formulation évoquant explicitement une fausse couche
  rationale: L’hébreu emploie des termes concrets, mais l’expression concernant la « cuisse » est obscure et probablement euphémistique. Le texte principal reste proche de l’image source sans imposer une interprétation médicale ou reproductive particulière.
- issue: Sens de לְמָרִים
  choice: « pour produire de l’amertume » avec une note signalant l’incertitude
  alternative: « comme une eau amère » ou « pour causer d’amères souffrances »
  rationale: La syntaxe peut décrire l’effet ou la qualité de l’eau. La traduction retient une lecture résultative probable, tout en préservant l’ambiguïté dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit naturellement la séquence conditionnelle hébraïque. Les images corporelles sont conservées sans archaïsme inutile ni précision médicale conjecturale.
