revisions:
- from: Puis le prêtre prendra de la main de la femme l’offrande de céréales pour la jalousie. Il présentera l’offrande de céréales devant Yahweh en accomplissant le geste rituel, puis l’approchera de l’autel.
  to: Puis le prêtre prendra de la main de la femme l’offrande de céréales de jalousie. Il accomplira avec l’offrande le geste rituel de balancement devant Yahweh, puis l’approchera de l’autel.
  rationale: La révision restitue explicitement le geste prescrit par וְהֵנִיף et conserve le caractère de désignation rituelle du complément « de jalousie ». Elle ne modifie ni la séquence des actions ni les référents du texte hébreu.
