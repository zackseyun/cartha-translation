  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: fr
  text: Puis le prêtre prendra de la main de la femme l’offrande de céréales de jalousie. Il accomplira avec l’offrande le geste rituel de balancement devant Yahweh, puis l’approchera de l’autel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis le prêtre prendra
  rationale: Le waw suivi du qatal poursuit la succession des prescriptions rituelles. « Puis » et le futur rendent naturellement cette étape procédurale en français.
- source_word: מִיַּד הָאִשָּׁה
  choice: de la main de la femme
  rationale: Cette formulation conserve l’image et indique que le prêtre reçoit directement l’offrande tenue par la femme.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: l’offrande de céréales pour la jalousie
  rationale: « Offrande de céréales » exprime la catégorie sacrificielle de מִנְחָה. « Pour la jalousie » rend la fonction rituelle du complément sans donner au pluriel hébreu une lourdeur artificielle en français.
- source_word: וְהֵנִיף
  choice: présentera … en accomplissant le geste rituel
  rationale: Le hiphil de נוף désigne ici le mouvement rituel traditionnellement appelé balancement. Cette formulation française compréhensible conserve l’idée d’une présentation accompagnée d’un geste prescrit, sans suggérer un simple mouvement vague.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » est la formulation cultuelle naturelle pour לִפְנֵי, et le nom divin est translittéré conformément au projet.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: puis l’approchera de l’autel
  rationale: Le hiphil de קרב signifie faire approcher ou amener près de. « L’approchera de l’autel » préserve cette nuance cultuelle et le pronom féminin renvoie à l’offrande.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Sens rituel de תנופה implicite dans וְהֵנִיף
  choice: présentation accompagnée du geste rituel
  alternative: agitera / balancera
  rationale: Le verbe désigne un acte cultuel précis, mais sa forme matérielle exacte n’est pas détaillée dans ce verset. La traduction évite de réduire le rite à une agitation ordinaire tout en signalant le geste.
translation_notes:
  register: Français international moderne, digne et accessible. La division en deux phrases allège une longue chaîne hébraïque sans modifier l’ordre des gestes. Le vocabulaire sacrificiel demeure précis, et « Yahweh » conserve le nom divin.
