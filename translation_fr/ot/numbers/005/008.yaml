id: NUM.5.8
reference: Numbers 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: fr
  text: Mais si cet homme n’a pas de proche parent ayant le droit de recevoir la réparation pour la faute[a], la réparation pour la faute rendue au SEIGNEUR revient au prêtre[b], en plus du bélier d’expiation avec lequel le prêtre fera l’expiation pour cet homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie גֹּאֵל, terme qui désigne ici un proche parent investi d’un droit et d’une responsabilité juridiques dans une affaire familiale.
    reason: lexical_alternative
  - marker: b
    text: Ici, le mot hébreu אָשָׁם désigne la réparation due pour la faute, et non le bélier sacrificiel, qui est mentionné séparément dans la suite du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: proche parent ayant le droit de recevoir
  rationale: Dans ce cadre juridique, le terme désigne un membre de la famille habilité à recevoir la réparation au nom de la personne lésée. Cette formulation française exprime à la fois le lien familial et la fonction légale sans introduire l’idée différente de rachat.
- source_word: הָאָשָׁם
  choice: réparation pour la faute
  rationale: Ici, le mot désigne la compensation due à cause de la faute, et non le sacrifice, puisque le bélier est mentionné séparément.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: la réparation pour la faute rendue
  rationale: Le participe passif de שוב marque la restitution de la compensation; « rendue » conserve cette valeur juridique.
- source_word: לַיהוָה
  choice: à l’Éternel
  rationale: Rendu selon l’usage français biblique courant pour le tétragramme; la réparation est consacrée à Dieu et attribuée au prêtre.
- source_word: לַכֹּהֵן
  choice: revient au prêtre
  rationale: Le français exige ici un prédicat explicite; cette tournure exprime clairement le destinataire légal de la réparation.
- source_word: מִלְּבַד
  choice: en plus de
  rationale: La locution distingue nettement la réparation du bélier sacrificiel et indique que celui-ci s’y ajoute.
- source_word: אֵיל הַכִּפֻּרִים
  choice: le bélier d’expiation
  rationale: Formulation naturelle et concise qui conserve la fonction cultuelle du bélier.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: avec lequel le prêtre fera l’expiation pour cet homme
  rationale: Le bélier est le moyen de l’expiation. Le sujet sacerdotal, implicite dans la procédure, est explicité en français pour éviter une construction passive lourde.
- source_word: לָאִישׁ
  choice: cet homme
  rationale: L’hébreu est au masculin singulier; le démonstratif assure une référence naturelle dans le verset.
theological_decisions:
- issue: Rapport entre la réparation et le sacrifice
  choice: La réparation matérielle et le bélier d’expiation sont deux éléments distincts.
  alternative: Comprendre la réparation elle-même comme une offrande cultuelle.
  rationale: מִלְּבַד (« en plus de ») introduit séparément le bélier et empêche de confondre la compensation juridique avec le sacrifice expiatoire.
- issue: Fonction du גֹּאֵל dans ce contexte
  choice: Le proche parent est présenté comme ayant le droit de recevoir la réparation.
  alternative: Employer « rédempteur » ou « proche parent chargé du rachat ».
  rationale: Le contexte immédiat concerne le versement d’une réparation lorsqu’il n’existe aucun ayant droit familial; une traduction fonctionnelle évite de suggérer ici une opération de rachat non exprimée.
- issue: Rendu du tétragramme YHWH
  choice: l’Éternel
  alternative: Yahvé; le Seigneur
  rationale: « l’Éternel » est une désignation française digne et bien établie du nom divin, sans tenter de trancher définitivement sa vocalisation ancienne.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la distinction juridique entre réparation et sacrifice, tout en explicitant seulement ce qui est nécessaire à l’intelligibilité de la syntaxe hébraïque.
