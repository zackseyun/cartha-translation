  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/005.yaml
  text: And Yahweh spoke to Moses, saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר, précédé du waw narratif, ouvre ici une nouvelle unité de discours. « Parla » garde le registre narratif soutenu de la formule hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit le destinataire de la parole et se rend naturellement par « à » en français.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d'introduction, l'infinitif לֵאמֹר annonce les paroles qui suivent. « En ces termes » est idiomatique en français et évite le calque lourd « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le Tétragramme. « Yahweh » conserve le nom propre et ne le remplace pas par le titre « le Seigneur ».
translation_notes:
  register: Français moderne, naturel et digne. La formule « parla à Moïse en ces termes » signale clairement que le discours se poursuit au verset suivant, tout en restant proche de la structure hébraïque.
