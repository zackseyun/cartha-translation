source:
  edition: WLC
  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: fr
  text: ils confesseront le péché qu’ils ont commis, puis chacun restituera intégralement ce qu’il doit pour sa faute[a], en y ajoutant un cinquième, et donnera le tout à la personne envers qui il s’est rendu coupable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « ce qu’il doit pour sa faute » rend un terme hébreu qui peut aussi désigner la réparation due ou la responsabilité encourue. Dans ce contexte, il s’agit du montant principal à restituer, et non d’un sacrifice de réparation.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à celui envers qui il s’est rendu coupable ». Il s’agit de la personne lésée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: ils confesseront
  rationale: Le hitpael de ידה exprime ici l’aveu explicite de la faute; le futur français convient à la prescription légale.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: le péché qu’ils ont commis
  rationale: חַטָּאת désigne ici la faute reconnue; « commettre un péché » est naturel et proche de l’expression hébraïque.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: puis chacun restituera intégralement ce dont il est redevable
  rationale: Le hiphil de שוב indique la restitution; אָשָׁם désigne ici la dette ou responsabilité née de la faute, tandis que בְּרֹאשׁוֹ renvoie au montant principal, rendu par « intégralement ». « Chacun » explicite sans changer le sens le passage du pluriel collectif au singulier distributif.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: en y ajoutant un cinquième
  rationale: La formule prescrit une majoration d’un cinquième du principal, soit vingt pour cent.
- source_word: וְנָתַן לַאֲשֶׁר אָשַׁם לוֹ
  choice: et le donnera à la personne envers qui il s’est rendu coupable
  rationale: Cette formulation conserve le lien lexical avec la culpabilité et identifie clairement la personne lésée, sans réduire le membre de phrase à un vocabulaire purement civil.
theological_decisions:
- issue: Sens de אָשָׁם dans le contexte de la restitution
  choice: dette ou responsabilité résultant de la faute, à restituer
  alternative: sacrifice de réparation
  rationale: Le remboursement du principal, la majoration d’un cinquième et le versement à la personne lésée montrent qu’il s’agit ici de la responsabilité pécuniaire liée à la faute, non du sacrifice lui-même.
- issue: Alternance entre le pluriel et le singulier
  choice: « ils confesseront », puis « chacun restituera »
  alternative: uniformiser tout le verset au pluriel
  rationale: L’hébreu passe du pluriel de l’aveu au singulier distributif de la restitution. « Chacun » rend cette transition intelligible sans l’effacer.
translation_notes:
  register: Français international moderne, clair et digne, avec une formulation juridique accessible. La structure pluriel-singulier de l’hébreu est conservée de façon naturelle au moyen de « chacun ».
