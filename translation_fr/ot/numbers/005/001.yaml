  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le SEIGNEUR ». D’autres rendus français comprennent « Yahvé » et « Jéhovah ».'
