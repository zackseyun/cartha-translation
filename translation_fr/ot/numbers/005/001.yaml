lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative introduit une nouvelle parole divine. « Parla » est naturel et légèrement plus précis que « dit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל marque ici le destinataire de la parole ; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction au discours direct, « en ces termes » annonce naturellement les paroles qui suivent et évite le calque peu idiomatique « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre et correspond à une translittération française courante, tandis que « le SEIGNEUR » relève d’une substitution traditionnelle.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure « en ces termes » restitue idiomatiquement la formule hébraïque qui introduit la citation du verset suivant.
