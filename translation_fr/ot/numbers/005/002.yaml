  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: fr
  text: Ordonne aux Israélites de faire sortir du camp toute personne atteinte d’une affection de la peau[a], toute personne qui a un écoulement corporel, et toute personne impure à cause d’un mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une affection lépreuse ». Le terme hébreu désigne diverses affections de la peau dans les lois de pureté, et pas nécessairement la lèpre au sens médical moderne.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « impure à cause d’une personne » ; dans les lois de pureté, cette expression désigne l’impureté liée à un cadavre humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Ordonne
  rationale: L’impératif singulier adressé à Moïse exprime un commandement direct et ferme.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Littéralement « aux fils d’Israël » ; « aux Israélites » exprime naturellement en français la désignation collective du peuple sans alourdir la phrase.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: de faire sortir du camp
  rationale: Cette formulation rend le renvoi hors du camp sans lui ajouter une nuance punitive absente du verbe.
- source_word: כָּל צָרוּעַ
  choice: toute personne atteinte d’une affection de la peau
  rationale: Le terme rituel vise diverses affections cutanées graves et ne correspond pas nécessairement à la lèpre au sens médical moderne.
- source_word: כָל זָב
  choice: toute personne qui a un écoulement corporel
  rationale: Dans les lois de pureté, זָב désigne une personne ayant un écoulement corporel anormal ; « corporel » évite l’ambiguïté du français « écoulement » employé seul.
- source_word: כֹל טָמֵא לָנָפֶשׁ
  choice: toute personne impure à cause d’un mort
  rationale: L’expression est un idiome juridique désignant l’impureté liée à un cadavre humain. La formulation française conserve le lien causal sans préciser davantage que l’hébreu le mode de contamination.
theological_decisions:
- issue: Sens de l’impureté rituelle
  choice: impure
  alternative: souillée
  rationale: טָמֵא décrit ici un statut rituel relatif à la sainteté du camp, non un jugement moral sur la personne.
- issue: Portée de נֶפֶשׁ dans l’expression טָמֵא לָנֶפֶשׁ
  choice: un mort
  alternative: le contact avec un cadavre
  rationale: Dans ce contexte légal, נֶפֶשׁ renvoie à une personne morte. « À cause d’un mort » préserve l’idiome et n’impose pas explicitement la notion de contact, bien que celle-ci soit précisée ailleurs dans la législation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique demeure directe, tandis que « Israélites » et « faire sortir » évitent un littéralisme peu naturel. Les termes « affection de la peau », « écoulement corporel » et « impure » distinguent le cadre rituel d’un diagnostic médical précis ou d’une faute morale.
