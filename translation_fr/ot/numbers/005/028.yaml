  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: fr
  text: Mais si la femme n’est pas devenue impure et qu’elle est pure, elle sera reconnue innocente et concevra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « elle sera ensemencée de semence », expression qui évoque la conception ou la fécondité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction introduit le cas opposé à celui du verset précédent; « Mais si » exprime naturellement ce contraste en français.
- source_word: לֹא נִטְמְאָה
  choice: ne s’est pas rendue impure
  rationale: Le nifal de טמא peut exprimer le fait de devenir impur. Dans ce contexte d’infidélité présumée, la tournure pronominale conserve la dimension morale et sexuelle sans réduire le terme à une impureté seulement rituelle.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Traduction directe du nom défini.
- source_word: וּטְהֹרָה הִוא
  choice: et qu’elle est pure
  rationale: טָהוֹר désigne ici l’état de pureté de la femme. La reprise « qu’elle » coordonne naturellement les deux conditions en français.
- source_word: וְנִקְּתָה
  choice: elle sera reconnue innocente
  rationale: Le nifal de נקה peut signifier être quitte, exempt ou innocenté. Dans le cadre de l’épreuve qui tranche une accusation, cette formulation exprime la disculpation sans imposer un vocabulaire judiciaire trop technique.
- source_word: וְנִזְרְעָה זָרַע
  choice: et aura des enfants
  rationale: L’expression signifie littéralement « être ensemencée de semence » et évoque la conception ou la fécondité. « Avoir des enfants » rend l’idiome en français courant et digne; une note conserve l’image hébraïque.
theological_decisions:
- issue: Nature de l’issue promise à la femme reconnue innocente
  choice: La femme est disculpée et aura des enfants.
  alternative: Elle demeure indemne et pourra concevoir; ou l’expression affirme plus généralement sa fécondité.
  rationale: La proposition finale emploie une image de semence qui renvoie à la conception et à la descendance. La traduction ne précise ni le nombre d’enfants ni le moment de cette fécondité, et la note signale la formulation imagée du texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant le contraste, la double affirmation de pureté et la portée de la disculpation.
