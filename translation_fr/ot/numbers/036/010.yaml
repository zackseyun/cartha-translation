  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: fr
  text: Comme Yahweh l’avait ordonné à Moïse, les filles de Tselophhad agirent ainsi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Comme
  rationale: Introduit la correspondance entre l’ordre donné et l’action accomplie; « Comme » est naturel en français et conserve cette relation.
- source_word: צִוָּה
  choice: l’avait ordonné
  rationale: Le verbe exprime un commandement; le plus-que-parfait marque naturellement l’antériorité de l’ordre par rapport à l’action des filles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel porté par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: En français, « ordonner à quelqu’un » exprime idiomatiquement que Moïse est le destinataire du commandement.
- source_word: כֵּן עָשׂוּ
  choice: agirent ainsi
  rationale: Rend avec naturel l’idée qu’elles se conformèrent à l’ordre, sans préciser davantage le contenu de leur action.
- source_word: בְּנוֹת צְלָפְחָד
  choice: les filles de Tselofhad
  rationale: Reproduit clairement la construction hébraïque et emploie une translittération française intelligible du nom.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le nom divin; « Yahweh » le conserve comme nom personnel sans lui substituer un titre.
translation_notes:
  register: Français moderne, sobre et digne. La tournure comparative reste concise; le passé simple convient au registre narratif biblique écrit, tandis que le plus-que-parfait indique l’ordre antérieur.
