source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: fr
  text: 'Moïse donna cet ordre aux Israélites, conformément à la parole de Yahvé[a] : « La tribu des descendants de Joseph a raison. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche de Yahvé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « La tribu des descendants de Joseph parle correctement. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Cette formulation française naturelle conserve la force autoritative du verbe צוה sans la raideur possible de « commanda les Israélites ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans le français courant, « les Israélites » exprime naturellement le groupe désigné par l’idiome hébreu « les fils d’Israël ».
- source_word: עַל פִּי יְהוָה
  choice: conformément à la parole de Yahvé
  rationale: L’expression rend l’autorisation divine exprimée par l’idiome hébreu, littéralement « selon la bouche de Yahvé », tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente directement le nom divin plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement le discours direct et évitent le calque pesant « en disant ».
- source_word: מַטֵּה בְנֵי יוֹסֵף
  choice: la tribu des descendants de Joseph
  rationale: מַטֵּה désigne ici une tribu; « descendants de Joseph » restitue clairement le lien familial de בְנֵי יוֹסֵף dans un français naturel.
- source_word: כֵּן ... דֹּבְרִים
  choice: a raison
  rationale: Dans ce contexte, כֵּן évalue favorablement les propos précédents. « A raison » exprime avec naturel que la déclaration ou la requête de la tribu est juste, même si le participe דֹּבְרִים signifie littéralement « parlent ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. « Yahvé » le conserve explicitement, tandis que « le SEIGNEUR » substituerait un titre traditionnel.
- issue: Portée de l’approbation divine
  choice: « La tribu des descendants de Joseph a raison »
  alternative: « La tribu des descendants de Joseph parle correctement »
  rationale: La traduction retenue affirme que leur position est juste sans préciser au-delà du texte si l’approbation vise exclusivement la formulation, l’argument ou la requête.
translation_notes:
  register: Français international moderne, clair et digne. Les idiomes hébreux sont rendus naturellement dans le corps du texte, avec leurs formes plus littérales signalées en notes. Le discours direct est introduit par deux-points plutôt que par un calque de לֵאמֹר.
