source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: fr
  text: Tels sont les commandements et les ordonnances que Yahweh ordonna par l’intermédiaire de Moïse aux Israélites, dans les plaines de Moab, près du Jourdain, vis-à-vis de Jéricho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près du Jourdain de Jéricho ». L’hébreu peut aussi être compris comme désignant le Jourdain situé près de Jéricho.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Cette formule démonstrative plurielle introduit naturellement en français la récapitulation finale du livre.
- source_word: הַמִּצְוֺת
  choice: les commandements
  rationale: Le terme désigne des prescriptions données avec autorité; « commandements » conserve le registre juridique et solennel.
- source_word: וְהַמִּשְׁפָּטִים
  choice: et les règles
  rationale: Dans ce contexte législatif, מִשְׁפָּטִים désigne des règles ou dispositions juridiques; « règles » est clair en français moderne sans suggérer ici des verdicts particuliers.
- source_word: צִוָּה
  choice: donna
  rationale: Avec « les commandements et les règles » comme complément, « donna » produit une phrase française naturelle tout en exprimant leur origine autoritative; la notion de commandement demeure explicite dans le substantif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Littéralement « par la main de Moïse »; l’expression française rend clairement l’idée d’agence et le rôle médiateur de Moïse.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: L’expression signifie littéralement « aux fils d’Israël », mais désigne collectivement le peuple; « aux Israélites » est exact, inclusif et naturel en français actuel.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: עַרְבֹת désigne la région de plaines ou de steppes; « plaines de Moab » est une désignation géographique claire et traditionnelle.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: près du Jourdain, en face de Jéricho
  rationale: עַל situe le lieu auprès du Jourdain, tandis que יְרֵחוֹ rattache vraisemblablement cette localisation à Jéricho; la formulation explicite naturellement la position transjordanienne tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. Sa translittération préserve cette valeur au lieu de lui substituer un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  alternative: aux fils d’Israël
  rationale: L’expression d’alliance désigne ici collectivement tout le peuple d’Israël, non exclusivement ses membres masculins; le rendu naturel évite une restriction absente du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la formule récapitulative, tout en rendant les idiomes hébreux dans un français naturel. Le choix « règles » évite le sens judiciaire trop étroit que pourrait prendre « jugements » en français contemporain.
