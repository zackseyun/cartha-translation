  text: וַ/תִּהְיֶ֜ינָה מַחְלָ֣ה תִרְצָ֗ה וְ/חָגְלָ֧ה וּ/מִלְכָּ֛ה וְ/נֹעָ֖ה בְּנ֣וֹת צְלָפְחָ֑ד לִ/בְנֵ֥י דֹדֵי/הֶ֖ן לְ/נָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: fr
  text: Machla, Tirtsa, Hogla, Milka et Noa, filles de Tselofhad, devinrent les épouses des fils de leurs oncles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus explicitement : « des fils des frères de leur père ».'
    reason: Précision lexicale sur le lien de parenté exprimé par דֹדֵיהֶן dans ce contexte.
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: devinrent
  rationale: Dans cette formule matrimoniale, le verbe היה présente l’entrée dans un nouvel état. « Devinrent » exprime naturellement cette transition tout en restant proche de l’hébreu.
- source_word: בְּנוֹת צְלָפְחָד
  choice: filles de Tselofhad
  rationale: « Filles » est le sens direct de בְּנוֹת dans ce contexte familial; le nom propre est translittéré selon un usage français clair.
- source_word: לִבְנֵי דֹדֵיהֶן
  choice: des fils de leurs oncles
  rationale: Avec la formule « devenir les épouses de », la préposition ל est rendue idiomatiquement par « de ». דֹדֵיהֶן désigne leurs oncles; le contexte indique plus précisément les frères de leur père.
- source_word: לְנָשִׁים
  choice: les épouses
  rationale: « Épouses » rend sans ambiguïté le sens matrimonial de נָשִׁים dans cette construction et évite l’ambiguïté moderne de « femmes ».
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: Machla, Tirtsa, Hogla, Milka et Noa
  rationale: Les noms personnels sont translittérés dans leur ordre hébreu, sous des formes lisibles en français.
