source:
  edition: WLC
  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: fr
  text: Elles épousèrent des hommes appartenant aux clans des descendants de Manassé, fils de Joseph, et leur héritage resta attaché à la tribu de leur clan paternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: des hommes appartenant aux clans
  rationale: Le syntagme introduit par מִן indique ici que les époux furent pris parmi les clans de Manassé. En français, expliciter « des hommes appartenant » rend naturellement cette provenance sans donner à penser que les clans eux-mêmes seraient les époux.
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: des descendants de Manassé, fils de Joseph
  rationale: Dans ce contexte tribal, בְּנֵי désigne les descendants de Manassé. « Descendants » est plus naturel et moins ambigu en français actuel que « fils », tandis que la filiation de Manassé est conservée littéralement.
- source_word: הָיוּ לְנָשִׁים
  choice: elles épousèrent
  rationale: Littéralement, elles « furent pour femmes ». La formulation active française garde les femmes comme sujet et exprime clairement qu'elles devinrent les épouses d'hommes issus de ces clans.
- source_word: נַחֲלָתָן
  choice: leur héritage
  rationale: Le terme désigne ici la propriété foncière héréditaire attribuée dans le cadre tribal; « héritage » est la formulation biblique et juridique la plus concise.
- source_word: וַתְּהִי
  choice: resta
  rationale: Bien que le verbe puisse signifier simplement « fut », le contexte souligne que le bien transmis ne passa pas à une autre tribu. « Resta » rend cette continuité implicite.
- source_word: עַל מַטֵּה
  choice: dans la tribu
  rationale: Dans ce contexte de rattachement foncier et tribal, עַל indique que l'héritage demeure attaché à la tribu. « Dans » est idiomatique en français et évite le calque obscur « sur la tribu ».
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: du clan de leur père
  rationale: מִשְׁפָּחָה désigne ici une subdivision de la tribu; « clan » rend mieux cette structure que le terme général « famille ». Le singulier collectif « leur père » suit l'hébreu.
