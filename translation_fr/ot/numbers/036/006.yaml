  to: 'Voici ce que Yahweh a ordonné au sujet des filles de Tselophchad : « Elles pourront épouser qui leur semblera bon[a], mais elles devront se marier au sein d’un clan de la tribu de leur père[b]. »'
  rationale: La révision conserve la permission et la restriction du texte hébreu, emploie une graphie française plus reconnue pour le nom propre et resserre la note b sur la valeur lexicale et syntaxique du verset. Elle ne modifie pas le sens du passage.
