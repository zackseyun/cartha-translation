  verdict: revise
  source_fidelity: 'Le sens central est fidèle : Yahweh donne une permission matrimoniale réelle, assortie d’une restriction à la structure tribale paternelle. « Dans un clan de la tribu de leur père » rend bien les deux termes hébreux משפחה et מטה. Une légère révision améliore toutefois la forme du nom propre et évite de présenter comme contenu direct de ce verset la finalité successorale explicitée dans le contexte immédiat plutôt que dans la formulation même du verset.'
  naturalness: Le français est clair, moderne et d’un registre approprié. « Elles pourront épouser qui leur semblera bon » est idiomatique et préserve l’idée de ce qui leur paraît bon. « Au sein d’un clan » exprime plus naturellement l’appartenance requise que « se marier dans un clan ».
  terminology: « Yahweh », « tribu » et « clan » conviennent. La graphie française usuelle et plus proche de la forme hébraïque est « Tselophchad ». La note b doit conserver l’ambiguïté famille/clan sans transformer l’objectif contextuel de conservation de l’héritage en une clause explicite de ce verset.
