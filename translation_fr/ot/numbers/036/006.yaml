id: NUM.36.6
reference: Numbers 36:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: fr
  text: 'Voici ce que Yahweh a ordonné au sujet des filles de Tselophchad : « Elles pourront épouser qui leur semblera bon[a], mais elles devront se marier au sein d’un clan de la tribu de leur père[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qui est bon à leurs yeux » ; c’est-à-dire l’homme qu’elles jugeront bon d’épouser.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu associe les termes « famille/clan » et « tribu ». La restriction porte donc sur l’appartenance au groupe tribal de leur père.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Voici ce que
  rationale: Cette tournure introduit naturellement en français moderne le contenu d’une directive, tout en conservant sa force officielle.
- source_word: צִוָּה יְהוָה
  choice: Yahweh a ordonné
  rationale: Le parfait exprime ici un ordre donné et toujours applicable. Le nom divin est translittéré directement.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: au sujet des filles de Tselofehad
  rationale: La préposition ל marque ici les personnes concernées par la décision, plutôt que nécessairement ses destinataires directes.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: qui leur semblera bon
  rationale: Cette formulation française rend clairement l’idiome hébreu « ce qui est bon à leurs yeux » sans en effacer le sens de libre choix.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: elles pourront épouser / elles devront se marier
  rationale: La première occurrence exprime la permission dans la proposition principale; la répétition après אַךְ prend une valeur obligatoire sous l’effet de la restriction.
- source_word: אַךְ
  choice: mais
  rationale: Dans ce contexte, la particule introduit une restriction nette à la liberté qui vient d’être accordée.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: dans un clan de la tribu de leur père
  rationale: « Clan » distingue מִשְׁפָּחָה de מַטֶּה, « tribu », et la préposition est rendue selon le sens d’appartenance au groupe dans lequel le mariage doit avoir lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Portée de la liberté matrimoniale accordée aux filles
  choice: permission réelle, limitée au clan tribal paternel
  alternative: obligation d’épouser un homme déterminé
  rationale: L’expression « qui leur semblera bon » laisse le choix du mari aux femmes, tandis que אַךְ introduit uniquement la limite liée à l’appartenance tribale.
translation_notes:
  register: Français international moderne, clair et digne. « Épouser » et « se marier » évitent le calque peu naturel « devenir femmes ». La translittération « Tselofehad » représente le nom hébreu צְלָפְחָד de façon accessible.
