  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: fr
  text: Et si le Jubilé arrive chez les fils d’Israël[a], leur héritage s’ajoutera à celui de la tribu dont elles feront partie, et leur héritage sera retranché de celui de la tribu de nos pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez les Israélites » ; traditionnellement, « chez les enfants d’Israël ». L’hébreu dit littéralement « chez les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: La construction hébraïque est conditionnelle. Dans cet argument juridique, « Et si » préserve cette forme et l’éventualité envisagée, sans la transformer en certitude temporelle.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: le Jubilé a lieu
  rationale: Le verbe היה présente ici la survenue du Jubilé. « A lieu » est naturel en français et garde l’idée d’un événement prévu par la loi.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: Cette formulation rend directement l’expression hébraïque et conserve son caractère familial; une note donne les équivalents français plus idiomatiques ou traditionnels.
- source_word: וְנוֹסְפָה
  choice: s’ajoutera
  rationale: Le niphal exprime le rattachement de cet héritage à un autre patrimoine tribal. La forme pronominale française transmet naturellement ce résultat.
- source_word: נַחֲלָתָן
  choice: leur héritage
  rationale: Dans ce contexte, נחלה désigne le bien foncier héréditaire des filles. « Héritage » reste concis et conforme au vocabulaire du passage.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: à celui de la tribu
  rationale: Avec יסף, la préposition על marque l’ajout à un autre héritage. Le pronom « celui » évite une répétition lourde tout en gardant le référent clair.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: à laquelle elles appartiendront
  rationale: Le féminin pluriel renvoie aux filles évoquées dans le contexte. La formulation française exprime leur futur rattachement à la tribu de leurs maris sans rendre littéralement une tournure hébraïque obscure.
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: de celui de la tribu de nos pères
  rationale: La traduction maintient le contraste avec la tribu ancestrale des porte-parole et conserve explicitement « nos pères ».
- source_word: יִגָּרַע
  choice: sera retranché
  rationale: Le niphal de גרע indique qu’une part sera enlevée ou diminuée. « Sera retranché » convient au transfert juridique d’un patrimoine tribal à un autre.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible, avec une syntaxe juridique claire. Le féminin « elles » explicite le référent grammatical et contextuel de תִּהְיֶינָה, à savoir les filles de Tselofhad. La condition introduite par וְאִם est conservée plutôt que transformée en simple indication temporelle.
