  to: Et si le Jubilé arrive chez les fils d’Israël[a], leur héritage s’ajoutera à celui de la tribu dont elles feront partie, et leur héritage sera retranché de celui de la tribu de nos pères.
  rationale: La révision améliore l’idiomaticité française de l’expression de l’arrivée du Jubilé et du rattachement tribal des filles, sans modifier la portée conditionnelle du texte ni le transfert de l’héritage décrit par l’hébreu. La note est ajustée en conséquence pour correspondre exactement à la préposition retenue dans le texte.
