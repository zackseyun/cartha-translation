  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: fr
  text: Aucun héritage ne passera d’une tribu à une autre, car chacune des tribus des fils d’Israël[a] restera attachée à son propre héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les tribus d’Israël » ; l’hébreu dit littéralement « les tribus des fils d’Israël ».
    reason: Précise l’expression collective hébraïque et signale une traduction française plus idiomatique.
lexical_decisions:
- source_word: תִסֹּב
  choice: passera
  rationale: Dans ce contexte juridique, le verbe désigne le passage d’un héritage sous l’autorité d’une autre tribu, et non un mouvement circulaire.
- source_word: נַחֲלָה
  choice: héritage
  rationale: Le terme désigne ici le territoire reçu en partage et transmis au sein de la tribu; « héritage » conserve sa dimension foncière et juridique.
- source_word: מִמַּטֶּה לְמַטֶּה אַחֵר
  choice: d’une tribu à une autre
  rationale: מַטֶּה peut signifier littéralement « bâton », mais désigne clairement ici une tribu. Cette formulation française exprime naturellement le transfert entre unités tribales.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’interdiction et convient au registre juridique du passage.
- source_word: אִישׁ ... יִדְבְּקוּ
  choice: resteront chacune attachées
  rationale: Le singulier distributif אִישׁ porte sur les tribus nommées ensuite. « Chacune » en restitue la force, tandis que « resteront attachées » rend naturellement l’idée de דבק dans ce contexte.
- source_word: בְּנַחֲלָתוֹ
  choice: à leur propre héritage
  rationale: Avec דבק, la préposition exprime l’attachement. Le pluriel français reprend naturellement « les tribus », sans modifier le sens distributif de l’hébreu.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: les tribus des fils d’Israël
  rationale: Cette traduction conserve l’expression hébraïque explicite « fils d’Israël », tout en laissant une formulation plus courante en note.
theological_decisions:
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites / tribus d’Israël
  rationale: Le texte principal conserve la forme traditionnelle et littérale de l’expression collective hébraïque, sans laisser entendre qu’elle exclut les femmes du peuple; la note indique une formulation française collective possible.
translation_notes:
  register: Français international moderne, clair et digne. La tournure juridique demeure concise; « chacune » rend explicitement la construction distributive hébraïque et assure un accord naturel avec « les tribus ».
