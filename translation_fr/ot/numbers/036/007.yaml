  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: fr
  text: Ainsi, aucun héritage des fils d’Israël ne passera d’une tribu à une autre[a], car chacun des fils d’Israël restera attaché à l’héritage de la tribu de ses pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne sera transféré d’une tribu à une autre ».'
    reason: Alternative lexicale mettant explicitement en valeur le sens juridique du changement d’appartenance tribale.
lexical_decisions:
- source_word: תִסֹּב
  choice: ne passera
  rationale: Dans ce contexte juridique, le verbe désigne un héritage qui change d’appartenance tribale. « Ne passera » exprime naturellement ce transfert sans évoquer un simple mouvement physique.
- source_word: נַחֲלָה
  choice: héritage
  rationale: Terme usuel pour le patrimoine foncier attribué et transmis au sein d’Israël.
- source_word: מִמַּטֶּה אֶל מַטֶּה
  choice: d’une tribu à une autre
  rationale: מַטֶּה signifie ici « tribu ». Cette formulation française rend clairement le passage entre deux tribus.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression généalogique masculine du texte hébreu dans cette disposition concernant la transmission du patrimoine tribal.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison donnée à l’interdiction dans un registre juridique naturel.
- source_word: אִישׁ
  choice: chacun
  rationale: 'Rend la valeur distributive du terme dans la proposition : chaque membre concerné doit demeurer lié à son héritage tribal.'
- source_word: יִדְבְּקוּ
  choice: restera attaché
  rationale: דבק exprime une adhésion ou un attachement ferme. Le singulier français s’accorde naturellement avec « chacun » tout en rendant la portée distributive du pluriel hébreu.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: à l’héritage de la tribu de ses pères
  rationale: Suit de près la structure généalogique du texte et désigne le patrimoine de la tribu paternelle.
theological_decisions:
- issue: Langage généalogique masculin dans une règle collective
  choice: les fils d’Israël… chacun… ses pères
  alternative: les Israélites… chacun… ses ancêtres
  rationale: Le texte emploie explicitement des termes masculins et généalogiques (בני, איש, אבתיו) dans le cadre de l’appartenance et de la transmission tribales. La traduction les conserve sans élargir ni restreindre davantage la portée juridique du verset.
translation_notes:
  register: Français international moderne, clair et digne. La formulation demeure proche de la structure juridique hébraïque tout en évitant les tournures artificielles.
