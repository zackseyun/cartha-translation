- from: Les chefs de famille[a] du clan des descendants de Galaad, fils de Makir, fils de Manassé, qui appartenait aux clans des descendants de Joseph, s’approchèrent et parlèrent devant Moïse et devant les responsables, les chefs de famille des Israélites[b].
  to: Les chefs de famille[a] du clan des descendants de Galaad, fils de Makir, fils de Manassé, issus des clans des descendants de Joseph, s’approchèrent et parlèrent devant Moïse et devant les responsables, les chefs de famille des Israélites[b].
  rationale: La seule modification nécessaire remplace la relative singulière ambiguë par un participe pluriel, afin de rattacher clairement « issus des clans des descendants de Joseph » au groupe des chefs mentionné par le texte. Le sens, le registre et les ancrages de notes sont préservés.
