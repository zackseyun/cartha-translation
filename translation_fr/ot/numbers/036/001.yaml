id: NUM.36.1
reference: Numbers 36:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: fr
  text: Les chefs de famille[a] du clan des descendants de Galaad, fils de Makir, fils de Manassé, issus des clans des descendants de Joseph, s’approchèrent et parlèrent devant Moïse et devant les responsables, les chefs de famille des Israélites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs des maisons ancestrales ». L’expression hébraïque désigne les responsables reconnus des groupes familiaux dans l’organisation tribale d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: s’approchèrent
  rationale: Le verbe קרב décrit ici la démarche formelle de personnes venant présenter une affaire; « s’approchèrent » en conserve à la fois le mouvement concret et la nuance officielle.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs de famille
  rationale: Littéralement « les têtes des pères », l’expression désigne les responsables reconnus des unités familiales ancestrales. « Chefs de famille » est naturel en français moderne tout en gardant la fonction sociale.
- source_word: לְמִשְׁפַּחַת בְּנֵי גִלְעָד
  choice: du clan des descendants de Galaad
  rationale: La préposition ל marque ici l’appartenance. « Clan » distingue cette unité généalogique de la famille immédiate, tandis que « descendants » exprime naturellement le sens collectif de בְּנֵי.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: fils de Makir, fils de Manassé
  rationale: La répétition de « fils de » conserve la chaîne généalogique formelle de l’hébreu sans la condenser en « petit-fils ».
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: qui appartenait aux clans des descendants de Joseph
  rationale: מִן situe ce clan à l’intérieur du groupe tribal plus large issu de Joseph. Cette formulation rend explicite en français la relation généalogique sans modifier son contenu.
- source_word: וַיְדַבְּרוּ
  choice: parlèrent
  rationale: Traduction directe et sobre de דבר, adaptée au cadre officiel sans ajouter une insistance absente de l’hébreu.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂאִים
  choice: devant Moïse et devant les responsables
  rationale: לִפְנֵי évoque une prise de parole en présence des autorités. « Responsables » traduit הַנְּשִׂיאִים dans une langue actuelle sans imposer un titre politique trop précis.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: les chefs de famille des Israélites
  rationale: L’apposition précise le rôle des responsables. « Israélites » restitue naturellement en français l’expression formelle « fils d’Israël », signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le vocabulaire « clan », « chefs de famille » et « responsables » rend la structure tribale compréhensible sans archaïsme excessif. La répétition généalogique « fils de » est conservée, tandis que בְּנֵי est rendu par « descendants » lorsqu’il désigne collectivement une lignée.
