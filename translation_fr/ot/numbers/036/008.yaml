  source_fidelity: 'Le sens juridique et foncier du verset est bien conservé : la fille détentrice d’un héritage doit se marier à l’intérieur du clan relevant de la tribu de son père, afin que chaque Israélite conserve son héritage paternel. Toutefois, « quelqu’un » ne rend pas suffisamment le masculin singulier de לְאֶחָד dans le contexte matrimonial ; « un homme » est plus précis.'
  naturalness: Le français est globalement naturel et de registre juridique accessible. « Épousera un homme » est à la fois plus idiomatique et plus clair que « épousera quelqu’un ». La note d est reformulée pour éviter une référence possessive ambiguë après le pluriel.
  terminology: « Héritage », « clan », « tribu », « fils d’Israël » et « pères » sont appropriés et maintiennent les distinctions du texte hébreu. « Possède » convient au sens de possession foncière durable de ירשׁ dans ce contexte.
