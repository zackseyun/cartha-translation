- from: Toute fille qui possède un héritage[a] parmi les tribus des fils d’Israël[b] épousera quelqu’un du clan[c] de la tribu de son père, afin que les fils d’Israël possèdent chacun[d] l’héritage de ses pères.
  to: Toute fille qui possède un héritage[a] parmi les tribus des fils d’Israël[b] épousera un homme du clan[c] de la tribu de son père, afin que les fils d’Israël possèdent chacun[d] l’héritage de ses pères.
  rationale: La seule correction du texte principal explicite que le partenaire requis est un homme, conformément au masculin singulier hébreu et au contexte juridique du mariage. Les autres choix sont conservés. La note d est clarifiée sans modifier le sens ni résoudre indûment la nuance possible entre hériter et posséder.
