source:
  edition: WLC
  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: fr
  text: Toute fille qui possède un héritage[a] parmi les tribus des fils d’Israël[b] épousera un homme du clan[c] de la tribu de son père, afin que les fils d’Israël possèdent chacun[d] l’héritage de ses pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui hérite d’un héritage » / « qui reçoit un héritage » ; le participe hébreu peut souligner son statut d’héritière.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire « des Israélites » ; l’hébreu dit littéralement « des fils d’Israël ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de la famille » ; le mot hébreu désigne ici un groupe de parenté à l’intérieur de la tribu.
    reason: lexical_alternative
  - marker: d
    text: Ou « afin que chacun des fils d’Israël hérite de l’héritage de ses pères » ; le terme hébreu a une valeur distributive.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת
  choice: qui possède
  rationale: Le participe de ירשׁ décrit ici naturellement le statut juridique durable d’une fille détentrice d’un bien héréditaire, plutôt que le seul moment où elle en hérite.
- source_word: נַחֲלָה
  choice: héritage
  rationale: Dans ce contexte foncier et tribal, le terme désigne un patrimoine transmis au sein de la lignée; « héritage » en conserve à la fois le sens juridique et familial.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: parmi les tribus des fils d’Israël
  rationale: « Tribus » rend les divisions tribales, tandis que « parmi » exprime naturellement l’appartenance indiquée par la préposition hébraïque. La formulation genrée du texte est conservée.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: du clan de la tribu de son père
  rationale: « Clan » distingue le groupe de parenté désigné par מִשְׁפָּחָה de l’unité plus large qu’est la tribu, מַטֶּה.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: épousera
  rationale: Cette expression idiomatique signifie littéralement « sera pour femme ». « Épousera » est clair et naturel en français tout en conservant la portée juridique de la prescription.
- source_word: יִירְשׁוּ
  choice: possèdent
  rationale: Dans ce contexte de maintien des terres ancestrales au sein de la tribu, ירשׁ peut désigner la possession durable. Ce choix évite une répétition lourde de « hériter » et souligne la finalité foncière de la règle.
- source_word: אִישׁ
  choice: chacun
  rationale: אִישׁ a ici une valeur distributive. « Chacun » la rend naturellement sans ajouter une insistance sur le sexe qui ne constitue pas la fonction principale du mot dans cette proposition.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: l’héritage de ses pères
  rationale: La formulation conserve le pluriel concret « pères » et le cadre patrilinéaire explicite de cette législation.
theological_decisions:
- issue: Langage genré de l’alliance et du droit successoral
  choice: Conserver « fils d’Israël » et « ses pères » dans le texte principal.
  alternative: Employer « Israélites » et « ancêtres ».
  rationale: Les formes masculines appartiennent ici au cadre patrilinéaire précis de la loi successorale; les neutraliser ferait disparaître un élément pertinent de la structure juridique décrite.
- issue: Valeur de ירשׁ dans la proposition finale
  choice: Rendre le verbe par « possèdent » afin d’exprimer la conservation de la propriété ancestrale.
  alternative: Rendre le verbe par « héritent » en insistant sur la transmission successorale.
  rationale: Le verbe permet les deux nuances. Le contexte immédiat vise surtout à empêcher le transfert d’un héritage d’une tribu à une autre; « possèdent » respecte cette finalité sans exclure l’origine héréditaire du bien.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe demeure formelle pour convenir à une prescription juridique, mais l’idiome hébreu « être pour femme » est rendu naturellement par « épouser ». Les termes « clan », « tribu », « héritage », « fils » et « pères » préservent les distinctions sociales et patrilinéaires du texte source.
