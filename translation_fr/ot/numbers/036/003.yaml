language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: fr
  text: Si elles épousent un homme de l’une des tribus des fils d’Israël, leur héritage sera retranché de l’héritage de nos pères et ajouté à celui de la tribu à laquelle elles appartiendront. Ainsi, il sera retranché de la part de notre héritage attribuée par tirage au sort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du lot de notre héritage » ; le « lot » désigne ici la part attribuée par tirage au sort.'
    reason: Précise le sens concret de גּוֹרָל et conserve sa formulation littérale comme possibilité de lecture.
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: Si elles épousent
  rationale: La tournure hébraïque signifie littéralement « et elles deviennent des femmes/épouses ». Dans la suite de l’hypothèse formulée par les chefs de famille, le français exprime naturellement la condition par « si » et le mariage par le verbe « épouser ».
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: un homme de l’une des tribus des fils d’Israël
  rationale: Cette formulation conserve l’appartenance tribale et l’expression biblique « fils d’Israël », tout en évitant le calque peu naturel « l’un des fils des tribus ».
- source_word: וְנִגְרְעָה
  choice: sera retranché
  rationale: Le nifal de גרע indique qu’une part est soustraite ou retirée. « Retranché » convient au contexte juridique du transfert d’un patrimoine tribal et reprend le même verbe à la fin du verset.
- source_word: נַחֲלָתָן
  choice: leur héritage
  rationale: « Héritage » rend le terme foncier נַחֲלָה et maintient le mot clé répété dans le verset.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: de l’héritage de nos pères
  rationale: La traduction garde l’image généalogique masculine explicite du texte hébreu ainsi que l’idée de continuité ancestrale et tribale.
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: et ajouté à celui de la tribu
  rationale: Le passif exprime le transfert de l’héritage vers le patrimoine d’une autre tribu. Le pronom « celui » évite une répétition lourde sans perdre le référent.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: à laquelle elles appartiendront
  rationale: La proposition décrit la future affiliation tribale des femmes après leur mariage. Le futur conserve la valeur prospective de l’imparfait hébreu.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ
  choice: de la part de notre héritage attribuée par tirage au sort
  rationale: גּוֹרָל désigne littéralement le « sort » et, par métonymie, la part déterminée par ce procédé. La formulation française rend clairement les deux dimensions.
theological_decisions: []
