source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: fr
  text: 'Ils dirent : « Yahweh a ordonné à mon seigneur de donner le pays en héritage, par tirage au sort, aux fils d’Israël[a] ; et mon seigneur a reçu de Yahweh l’ordre de donner l’héritage de Tselofhad, notre frère, à ses filles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux enfants d’Israël » ou « aux Israélites ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: Alternative lexicale et précision sur la formulation masculine collective de l’hébreu.
lexical_decisions:
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Titre humain respectueux adressé à Moïse ; « mon seigneur » conserve la déférence sans suggérer qu’il s’agit d’un titre divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לָתֵת אֶת הָאָרֶץ בְּנַחֲלָה
  choice: donner le pays en héritage
  rationale: Rend directement le don divin du pays et la valeur foncière et héréditaire de נַחֲלָה dans un français naturel.
- source_word: בְּגוֹרָל
  choice: par tirage au sort
  rationale: Exprime clairement le procédé de répartition indiqué par le terme hébreu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Conserve la formulation masculine et collective du texte source, tout en signalant en note des formulations françaises plus englobantes.
- source_word: צֻוָּה בַיהוָה
  choice: a reçu de Yahweh l’ordre
  rationale: Restitue naturellement en français la forme passive et l’idée que Yahweh est la source du commandement, sans alourdir la phrase.
- source_word: נַחֲלַת צְלָפְחָד
  choice: l’héritage de Tselofhad
  rationale: Reproduit clairement la relation de possession exprimée par l’état construit hébreu dans ce contexte juridique.
- source_word: אָחִינוּ
  choice: notre frère
  rationale: Préserve le langage familial explicite du texte plutôt que de l’interpréter par « notre parent » ou « notre membre de clan ».
- source_word: לִבְנֹתָיו
  choice: à ses filles
  rationale: Rend directement les bénéficiaires féminines de l’héritage.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le conserve sans le remplacer par un titre.
- issue: Portée du masculin collectif לִבְנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: enfants d’Israël ; Israélites
  rationale: La traduction maintient la forme littérale et traditionnelle du syntagme hébreu, tandis que la note précise sa portée collective possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique du passage est conservée, mais la seconde tournure passive est rendue idiomatiquement par « a reçu de Yahweh l’ordre ». Le nom Tselofhad suit une translittération française transparente de צְלָפְחָד.
