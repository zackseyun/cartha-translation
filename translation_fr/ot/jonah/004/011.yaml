  text: וַֽ/אֲנִי֙ לֹ֣א אָח֔וּס עַל נִינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה אֲשֶׁ֣ר יֶשׁ בָּ֡/הּ הַרְבֵּה֩ מִֽ/שְׁתֵּים עֶשְׂרֵ֨ה רִבּ֜וֹ אָדָ֗ם אֲשֶׁ֤ר לֹֽא יָדַע֙ בֵּין יְמִינ֣/וֹ לִ/שְׂמֹאל֔/וֹ וּ/בְהֵמָ֖ה רַבָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/011.yaml
  text: And should I not have compassion on Nineveh[a], the great city, in which there are more than one hundred twenty thousand people who do not know their right hand from their left[b], and many animals?
translation:
  language: fr
  text: Et moi, n’aurais-je pas compassion de Ninive[a], la grande ville, où se trouvent plus de cent vingt mille êtres humains qui ne savent pas distinguer leur droite de leur gauche[b], ainsi qu’un grand nombre d’animaux ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’épargnerais-je pas Ninive ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « ne savent pas distinguer leur droite de leur gauche » peut désigner spécialement de jeunes enfants ou, plus généralement, des personnes qui manquent de discernement.
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוּס
  choice: j’aurais compassion de
  rationale: Le verbe חוּס peut exprimer la compassion ou le fait d’épargner. « Avoir compassion de » rend ici le souci miséricordieux de Dieu, en contraste avec l’attachement de Jonas à la plante, tout en laissant entendre que la ville est épargnée.
- source_word: הָעִיר הַגְּדוֹלָה
  choice: la grande ville
  rationale: Cette formulation conserve l’adjectif hébreu et l’écho littéraire de la désignation répétée de Ninive dans le livre.
- source_word: יֶשׁ בָּהּ
  choice: où se trouvent
  rationale: Cette tournure française naturelle rend la construction existentielle hébraïque et maintient l’attention sur ceux qui sont présents dans la ville.
- source_word: הַרְבֵּה מִשְׁתֵּים עֶשְׂרֵה רִבּוֹ
  choice: plus de cent vingt mille
  rationale: L’hébreu dit littéralement « plus de douze myriades ». La formulation retenue en donne l’équivalent numérique clair en français tout en conservant « plus de ».
- source_word: אָדָם
  choice: êtres humains
  rationale: Le nom désigne ici la population humaine dénombrée de Ninive. « Êtres humains » évite toute restriction au sexe masculin et forme un contraste explicite avec les animaux mentionnés ensuite.
- source_word: אֲשֶׁר לֹא יָדַע בֵּין יְמִינוֹ לִשְׂמֹאלוֹ
  choice: qui ne savent pas distinguer leur droite de leur gauche
  rationale: Cette traduction conserve l’image hébraïque dans une formulation française idiomatique, sans décider si elle vise de jeunes enfants ou, plus généralement, des personnes dépourvues de discernement.
- source_word: וּבְהֵמָה רַבָּה
  choice: ainsi qu’un grand nombre d’animaux
  rationale: בְּהֵמָה désigne des bêtes, souvent domestiques, sans se limiter aux bovins. « Animaux » préserve cette largeur de sens, et « un grand nombre » rend naturellement רַבָּה.
theological_decisions:
- issue: Référent de ceux qui ne savent pas distinguer leur droite de leur gauche
  choice: Conserver l’expression sans préciser davantage son référent.
  alternative: De jeunes enfants ; ou, plus largement, des habitants dépourvus de discernement moral ou spirituel.
  rationale: L’expression hébraïque permet ces lectures. Le texte principal maintient donc l’ambiguïté réelle et la note la signale sans la résoudre.
- issue: Attitude divine exprimée par אָחוּס
  choice: Rendre le terme par « avoir compassion de ».
  alternative: « Épargner » Ninive.
  rationale: Le contexte oppose le souci de Dieu pour Ninive à celui de Jonas pour la plante. La traduction choisie met en valeur la compassion divine, tandis que la note conserve la possibilité lexicale d’un accent plus direct sur le fait d’épargner.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe interrogative conserve la force rhétorique de la conclusion du livre. « Et moi » maintient le contraste initial marqué par l’hébreu, tandis que les deux notes préservent les principales ambiguïtés lexicales et interprétatives.
