base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/005.yaml
  text: Then Jonah went out from the city and sat east of the city[b][a]. There he made himself a shelter and sat under it in the shade until he would see what would happen in the city.
translation:
  language: fr
  text: Jonas sortit de la ville et s’assit à l’est de celle-ci. Là, il se fit un abri[a] et s’assit sous cet abri, à l’ombre, en attendant de voir ce qui arriverait dans la ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une hutte ». Le mot hébreu désigne un abri temporaire, souvent fait de branchages.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce que deviendrait la ville ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא exprime ici le fait de sortir ou de quitter un lieu. « Sortit » restitue directement la progression narrative.
- source_word: מִן הָעִיר
  choice: de la ville
  rationale: La préposition מן marque l’éloignement ou la séparation; « de la ville » est naturel après « sortit ».
- source_word: וַיֵּשֶׁב
  choice: s’assit
  rationale: ישב peut signifier s’asseoir, demeurer ou s’installer. Le geste concret convient ici et se prolonge par l’attente de Jonas.
- source_word: מִקֶּדֶם לָעִיר
  choice: à l’est de celle-ci
  rationale: Dans cette indication spatiale, קדם désigne vraisemblablement le côté est. Le pronom évite une répétition lourde de « ville ».
- source_word: וַיַּעַשׂ לוֹ
  choice: il se fit
  rationale: 'Le pronom לו est un datif d’intérêt: Jonas fabrique l’abri pour lui-même. « Se fit » rend cela avec naturel.'
- source_word: סֻכָּה
  choice: un abri
  rationale: סֻכָּה désigne une construction temporaire, souvent faite de branchages. « Abri » en exprime clairement la fonction, tandis que la forme concrète est précisée en note.
- source_word: תַּחְתֶּיהָ
  choice: dessous
  rationale: Le suffixe féminin renvoie à la סֻכָּה. « Dessous » est une formulation française fluide après la mention de l’abri.
- source_word: בַּצֵּל
  choice: à l’ombre
  rationale: צֵל peut désigner l’ombre ou la protection qu’elle procure. Dans le contexte de l’abri, « à l’ombre » est idiomatique.
- source_word: עַד אֲשֶׁר יִרְאֶה
  choice: en attendant de voir
  rationale: La construction exprime l’attente orientée vers un événement à observer. Cette tournure française restitue naturellement cette valeur prospective.
- source_word: מַה יִּהְיֶה בָּעִיר
  choice: ce qui arriverait dans la ville
  rationale: L’expression demande quel événement ou quelle issue se produira concernant la ville. Cette traduction conserve la référence locative explicite de בָּעִיר sans préciser davantage le sort envisagé.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. Les répétitions hébraïques sont légèrement allégées sans supprimer les étapes du récit; l’ambiguïté entre ce qui se passerait dans la ville et ce qu’elle deviendrait est conservée par une note.
