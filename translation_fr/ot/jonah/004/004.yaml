id: JON.4.4
reference: Jonah 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה הַ/הֵיטֵ֖ב חָ֥רָה לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/004.yaml
  text: And Yahweh said[a], “Is it right for you to be angry?”
translation:
  language: fr
  text: 'Yahweh dit : « Est-ce bien que tu sois en colère ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Fais-tu bien de te mettre en colère ? »'
    reason: Alternative lexicale plus proche de la forme hébraïque הֲהֵיטֵב.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. En français, « dit » suffit naturellement dans la continuité narrative, sans qu’il soit nécessaire de rendre systématiquement le waw par « et » ou « alors ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: הֲהֵיטֵב
  choice: Est-ce bien
  rationale: L’interrogatif joint à l’infinitif absolu hiphil de יטב évalue ici le bien-fondé ou la convenance de la colère. « Est-ce bien que… ? » garde cette portée évaluative dans un français naturel.
- source_word: חָרָה
  choice: sois en colère
  rationale: Le verbe évoque littéralement le fait de brûler ou de s’enflammer, mais il exprime idiomatiquement la colère dans cette construction.
- source_word: לָךְ
  choice: tu sois
  rationale: Le complément en ל désigne la personne concernée. La construction française « Est-ce bien que tu sois… ? » en restitue naturellement la fonction sans calquer « pour toi ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: « Yahweh » représente directement le nom propre hébreu sans lui substituer un titre et sans introduire une lecture confessionnelle particulière.
- issue: Portée de הֲהֵיטֵב חָרָה לָךְ
  choice: 'Question portant sur le bien-fondé de la colère : « Est-ce bien que tu sois en colère ? »'
  alternative: « Fais-tu bien de te mettre en colère ? »
  rationale: L’hébreu ne demande pas simplement si Jonas éprouve de la colère, mais si celle-ci est bonne, appropriée ou justifiée. La formulation retenue conserve cette tension sans préciser davantage le critère moral.
translation_notes:
  register: Français international moderne, sobre et digne. La question brève conserve le ton de réprimande mesurée de l’hébreu. Le marqueur de note [a] est placé après la citation à laquelle il se rapporte.
