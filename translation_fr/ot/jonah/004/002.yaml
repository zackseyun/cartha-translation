source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֨ל אֶל יְהוָ֜ה וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ הֲ/לוֹא זֶ֣ה דְבָרִ֗/י עַד הֱיוֹתִ/י֙ עַל אַדְמָתִ֔/י עַל כֵּ֥ן קִדַּ֖מְתִּי לִ/בְרֹ֣חַ תַּרְשִׁ֑ישָׁ/ה כִּ֣י יָדַ֗עְתִּי כִּ֤י אַתָּה֙ אֵֽל חַנּ֣וּן וְ/רַח֔וּם אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/002.yaml
  text: And he prayed to Yahweh and said[a], “Please, Yahweh, was this not what I said while I was still in my own land? That is why I acted first to flee to Tarshish, because I knew that you are a gracious and compassionate God, slow to anger and abundant in steadfast love[c][b], and relenting concerning the disaster.”
translation:
  language: fr
  text: 'Il pria Yahweh et dit : « Ah ! Yahweh, n’est-ce pas ce que je disais quand j’étais encore dans mon pays ? C’est pourquoi j’ai pris les devants pour m’enfuir vers Tarsis[a]. Car je savais que tu es un Dieu qui fait grâce et qui est compatissant[b], lent à la colère, riche en amour fidèle, et qui renonce au malheur[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je me suis empressé de fuir vers Tarsis » ou « j’ai devancé cela en fuyant vers Tarsis ». Le verbe hébreu exprime l’idée d’agir par avance ou de prendre les devants.
    reason: lexical_alternative
  - marker: b
    text: Ou « miséricordieux ». Cette description de Dieu reprend les termes d’Exode 34.6.
    reason: cross_reference
  - marker: c
    text: Ou « qui revient sur le malheur » ou « qui renonce au désastre ». Le mot hébreu peut signifier « mal » ou « malheur » ; il désigne ici le jugement menaçant Ninive, et non un mal moral en Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: Il pria
  rationale: Le hitpael de פלל désigne normalement l’action de prier. Le contenu plaintif de la parole de Jonas ne change pas la nature de cette adresse à Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin exprimé directement dans le texte hébreu, plutôt que remplacement par un titre.
- source_word: אָנָּה
  choice: Ah !
  rationale: Cette particule peut exprimer aussi bien la supplication que l’exclamation. Ici, « Ah ! » convient au ton de plainte indignée de Jonas sans transformer sa parole en demande polie.
- source_word: הֲלוֹא זֶה דְבָרִי
  choice: n’est-ce pas ce que je disais
  rationale: La question rhétorique attend une réponse affirmative. « Ce que je disais » rend naturellement l’expression littérale « ma parole » dans ce souvenir d’une conviction antérieure.
- source_word: עַד הֱיוֹתִי עַל אַדְמָתִי
  choice: quand j’étais encore dans mon pays
  rationale: La tournure situe les propos de Jonas avant son départ, alors qu’il se trouvait toujours sur sa terre natale.
- source_word: קִדַּמְתִּי לִבְרֹחַ
  choice: j’ai pris les devants en m’enfuyant
  rationale: קדם exprime ici une action entreprise par avance. Cette formulation française conserve la nuance anticipatrice tout en reliant clairement celle-ci à la fuite.
- source_word: חַנּוּן וְרַחוּם
  choice: qui fait grâce et qui est compatissant
  rationale: Les deux adjectifs décrivent respectivement la disposition à accorder sa faveur et la compassion profonde de Dieu. La formulation verbale est naturelle en français et garde les deux qualités distinctes.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: Équivalent idiomatique établi de l’expression hébraïque littérale « long de narines », qui évoque la patience et la retenue face à la colère.
- source_word: רַב חֶסֶד
  choice: riche en amour fidèle
  rationale: חסד désigne ici un amour loyal, constant et bienveillant. « Amour fidèle » conserve cette dimension relationnelle mieux que le seul mot « bonté ».
- source_word: וְנִחָם עַל הָרָעָה
  choice: et qui revient sur le malheur
  rationale: Le nifal de נחם exprime le fait de renoncer à l’exécution d’un jugement annoncé ou de revenir sur celui-ci. רעה désigne dans ce contexte le malheur ou le désastre, non une faute morale commise par Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin. Sa transcription préserve la distinction entre ce nom et les titres attribués à Dieu.
- issue: Portée de וְנִחָם עַל הָרָעָה
  choice: qui revient sur le malheur
  alternative: qui renonce au malheur
  rationale: '« Revient sur » conserve la force anthropopathique et la tension du texte : Dieu ne met pas à exécution le jugement annoncé. Le choix de « malheur » évite toutefois de suggérer que Dieu aurait commis un mal moral.'
- issue: Écho à la révélation d’Exode 34.6
  choice: qui fait grâce et qui est compatissant, lent à la colère, riche en amour fidèle
  alternative: clément et miséricordieux, patient et d’une grande bonté
  rationale: La formulation garde les éléments de la confession traditionnelle reprise par Jonas sans introduire une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct conserve le ton vif de la plainte de Jonas. « Ah ! » marque son exclamation, tandis que « prendre les devants » rend naturellement la nuance anticipatrice de קדם. La syntaxe attributive demeure claire malgré l’accumulation solennelle des qualités divines.
