  naturalness: Le registre est globalement naturel et digne. « En m’enfuyant à Tarsis » est cependant moins idiomatique dans un français international actuel; « pour m’enfuir vers Tarsis » est plus fluide tout en conservant la direction du mouvement.
  terminology: « Yahweh », « Dieu qui fait grâce », « compatissant », « lent à la colère » et « riche en amour fidèle » sont des choix solides. « Malheur » convient ici à הָרָעָה, qui désigne le désastre/jugement menacé et non le mal moral.
