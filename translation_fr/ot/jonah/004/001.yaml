  yaml_path: translation/ot/jonah/004/001.yaml
  text: But it was greatly displeasing to Jonah[a], and he became angry.
translation:
  language: fr
  text: Mais cela déplut profondément à Jonas[a], et il se mit en colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce fut un mal pour Jonas, un grand mal ». L’hébreu reprend ici le vocabulaire du « mal » pour décrire la réaction de Jonas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע אֶל יוֹנָה
  choice: cela déplut profondément à Jonas
  rationale: La construction avec le verbe רעע et אֶל exprime ici la vive désapprobation subjective de Jonas. « Déplut à Jonas » rend naturellement l’idiome sans présenter la conduite de Dieu comme objectivement mauvaise.
- source_word: רָעָה גְדוֹלָה
  choice: profondément
  rationale: Le nom apparenté רָעָה accompagné de גְדוֹלָה intensifie le verbe par une reprise lexicale, littéralement « un grand mal ». L’adverbe exprime cette intensité en français courant, tandis que la note conserve le jeu de mots hébreu.
- source_word: וַיִּחַר לוֹ
  choice: il se mit en colère
  rationale: L’expression idiomatique, littéralement « cela brûla pour lui », indique l’entrée dans un état de colère. « Il se mit en colère » en restitue clairement l’aspect dynamique.
- source_word: וַ
  choice: Mais … et
  rationale: « Mais » fait ressortir le contraste avec la compassion accordée à Ninive au verset précédent; le second waw poursuit naturellement la séquence avec « et ».
- source_word: יוֹנָה
  choice: Jonas
  rationale: Forme française traditionnelle et usuelle du nom biblique.
theological_decisions:
- issue: רָעָה décrit-il un mal objectif ou la réaction subjective de Jonas?
  choice: 'La réaction subjective de Jonas: « cela déplut profondément à Jonas »'
  alternative: « ce fut un grand mal pour Jonas » ou « cela parut très mauvais à Jonas »
  rationale: Le contexte décrit la réaction de Jonas à la compassion de Dieu sans valider son jugement moral. La traduction principale évite cette fausse implication, tandis que la note préserve la formulation saisissante et l’ambiguïté lexicale de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Déplut profondément » conserve la forte intensité sans lourdeur; la note rend visible le jeu lexical de l’hébreu.
