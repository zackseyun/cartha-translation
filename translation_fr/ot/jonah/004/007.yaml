  text: וַ/יְמַ֤ן הָֽ/אֱלֹהִים֙ תּוֹלַ֔עַת בַּ/עֲל֥וֹת הַ/שַּׁ֖חַר לַֽ/מָּחֳרָ֑ת וַ/תַּ֥ךְ אֶת הַ/קִּֽיקָי֖וֹן וַ/יִּיבָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/007.yaml
  text: But God appointed a worm at the rising of dawn the next day[a], and it struck the plant so that it withered.
translation:
  language: fr
  text: Mais le lendemain, au lever de l’aube, Dieu fit venir un ver, qui attaqua la plante[a], et elle se dessécha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu qiqayon désigne une plante particulière, mais son identification exacte est incertaine ; on propose notamment le ricin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן
  choice: désigna
  rationale: Le verbe exprime ici l’action intentionnelle de Dieu qui assigne un agent, selon le motif répété dans Jonas. « Désigna » préserve cette intention sans suggérer une simple permission.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Le texte porte אֱלֹהִים et non le nom divin YHWH.
- source_word: תּוֹלַעַת
  choice: un ver
  rationale: Le nom désigne largement une créature vermiforme; « ver » reste naturel et évite de préciser indûment l’espèce.
- source_word: בַּעֲלוֹת הַשַּׁחַר
  choice: au lever de l’aube
  rationale: Cette formulation rend directement l’image hébraïque de l’aube qui se lève, dans un français actuel et digne.
- source_word: לַמָּחֳרָת
  choice: le lendemain
  rationale: Le terme situe l’événement au jour qui suit et se rend idiomatiquement ainsi en français.
- source_word: וַתַּךְ
  choice: frappa
  rationale: Le verbe נכה signifie littéralement « frapper ». Ce choix conserve la vigueur de l’hébreu sans expliquer le mode précis de l’atteinte.
- source_word: הַקִּיקָיוֹן
  choice: la plante
  rationale: L’identification botanique du qiqayon demeure incertaine. « La plante » assure la cohérence contextuelle sans introduire une précision contestable.
- source_word: וַיִּיבָשׁ
  choice: qui se dessécha
  rationale: Le verbe signifie « se dessécher, dépérir ». La proposition relative exprime naturellement en français le résultat de l’atteinte tout en conservant la succession narrative.
theological_decisions:
- issue: Action divine dans les circonstances de Jonas
  choice: Dieu désigne intentionnellement le ver.
  alternative: Dieu permet seulement qu’un ver apparaisse.
  rationale: וַיְמַן présente une intervention active de Dieu, conforme au motif des agents qu’il assigne dans Jonas 4; la traduction ne réduit donc pas cette action à une simple permission.
translation_notes:
  register: Français international moderne, clair et soutenu. La syntaxe suit l’ordre narratif hébreu tout en restant naturelle. Le marqueur de note est placé après la phrase portant sur « la plante », terme qu’il explicite.
