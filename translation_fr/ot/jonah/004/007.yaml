review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : Dieu agit intentionnellement, un ver endommage le qiqayon, et la plante se dessèche. Toutefois, « désigna un ver » est peu idiomatique en français et peut évoquer une simple désignation nominative plutôt que l’intervention effective exprimée par וַיְמַן. « Fit venir » rend naturellement l’initiative divine sans préciser indûment le mécanisme. « Attaqua » est plus naturel qu’« frappa » pour l’action d’un ver sur une plante, tout en conservant la force de וַתַּךְ.'
  naturalness: La phrase proposée est globalement claire, mais « Dieu désigna un ver » et « celui-ci frappa la plante » sont raides en français moderne. La reprise par « il » et le verbe « attaqua » produisent une narration plus fluide et naturelle. Le déplacement du marqueur immédiatement après « la plante » en précise l’ancrage lexical.
  terminology: « Dieu », « ver » et « plante » sont appropriés. La note conserve avec prudence l’incertitude sur l’identification du qiqayon ; « ricin » doit rester présenté comme une proposition et non comme une identification certaine.
  issues:
  - severity: medium
    issue: « Dieu désigna un ver » est ambigu et peu naturel.
    rationale: Le français « désigner » peut signifier nommer ou montrer du doigt. Dans ce contexte, « fit venir » exprime plus clairement l’action divine effective portée par וַיְמַן, sans réduire celle-ci à une permission.
  - severity: low
    issue: « Celui-ci frappa la plante » est maladroit pour un ver.
    rationale: Le verbe hébreu signifie bien « frapper/atteindre », mais « attaqua la plante » est idiomatique en français et rend l’atteinte dommageable sans surinterpréter son mode.
  - severity: low
    issue: Le marqueur de note est placé en fin de phrase plutôt qu’auprès de « la plante ».
    rationale: La note porte sur qiqayon, rendu par « la plante » ; l’ancrage immédiat améliore la lisibilité.
  revised_text: Mais le lendemain, au lever de l’aube, Dieu fit venir un ver, qui attaqua la plante[a], et elle se dessécha.
  revised_footnotes:
  - marker: a
    text: Le terme hébreu qiqayon désigne une plante particulière, mais son identification exacte est incertaine ; on propose notamment le ricin.
    reason: lexical_alternative
  revision_rationale: La révision conserve la succession narrative et l’action intentionnelle de Dieu, tout en remplaçant deux formulations littérales mais peu idiomatiques par un français international moderne. La note est maintenue et son ancrage est rapproché du terme qu’elle explique.
