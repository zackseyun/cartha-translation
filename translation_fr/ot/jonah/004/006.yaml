  naturalness: « Donner de l’ombre à sa tête » est peu idiomatique ; « faire de l’ombre au-dessus de sa tête » est plus naturel et conserve l’image. La phrase révisée garde un registre moderne, clair et digne.
  terminology: « Yahweh Dieu » préserve les deux appellations divines. « qiqayon » est conservé sans identification botanique indue. « Très grande joie » restitue adéquatement l’intensification hébraïque.
