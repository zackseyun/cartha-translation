  to: Yahweh Dieu fit pousser une plante appelée qiqayon[a], qui grandit au-dessus de Jonas afin de faire de l’ombre au-dessus de sa tête et de le délivrer de son malheur. Jonas éprouva une très grande joie à cause du qiqayon.
