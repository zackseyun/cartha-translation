source:
  edition: WLC
  text: וַ/יְמַ֣ן יְהוָֽה אֱ֠לֹהִים קִיקָי֞וֹן וַ/יַּ֣עַל מֵ/עַ֣ל לְ/יוֹנָ֗ה לִֽ/הְי֥וֹת צֵל֙ עַל רֹאשׁ֔/וֹ לְ/הַצִּ֥יל ל֖/וֹ מֵ/רָֽעָת֑/וֹ וַ/יִּשְׂמַ֥ח יוֹנָ֛ה עַל הַ/קִּֽיקָי֖וֹן שִׂמְחָ֥ה גְדוֹלָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/006.yaml
  text: And Yahweh God appointed a qiqayon plant[a], and it grew up over Jonah to be a shade over his head, to deliver him from his discomfort. And Jonah rejoiced over the qiqayon plant with great joy.
translation:
  language: fr
  text: Yahweh Dieu fit pousser une plante appelée qiqayon[a], qui grandit au-dessus de Jonas afin de faire de l’ombre au-dessus de sa tête et de le délivrer de son malheur. Jonas éprouva une très grande joie à cause du qiqayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu qiqayon : plante dont l’identification est incertaine ; traditionnellement rendue par « vigne », elle est parfois identifiée au ricin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן
  choice: fit venir
  rationale: Le verbe מנה exprime ici l’action délibérée et souveraine de Dieu, qui dispose successivement le poisson, la plante, le ver et le vent. « Fit venir » est naturel en français et convient à l’apparition de la plante.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Le nom personnel יהוה est translittéré « Yahweh », tandis que אֱלֹהִים est rendu par « Dieu »; l’association inhabituelle des deux appellations est conservée.
- source_word: קִיקָיוֹן
  choice: plante appelée qiqayon
  rationale: L’identification botanique est incertaine. La translittération maintient la précision lexicale de l’hébreu sans imposer l’identification traditionnelle comme une vigne ni l’hypothèse du ricin.
- source_word: וַיַּעַל מֵעַל לְיוֹנָה
  choice: qui poussa au-dessus de Jonas
  rationale: Dans le contexte végétal, עלה décrit naturellement la croissance de la plante; « au-dessus de Jonas » conserve sa position et prépare sa fonction d’ombrage.
- source_word: לִהְיוֹת צֵל עַל רֹאשׁוֹ
  choice: afin de donner de l’ombre à sa tête
  rationale: Cette formulation française naturelle exprime fidèlement la finalité de la plante et le sens concret de צֵל.
- source_word: לְהַצִּיל לוֹ מֵרָעָתוֹ
  choice: de le délivrer de son mal-être
  rationale: רָעָה peut désigner le mal, le malheur ou la détresse. « Mal-être » préserve ici une certaine amplitude entre souffrance physique et état pénible, sans transformer le terme en jugement moral.
- source_word: וַיִּשְׂמַח ... שִׂמְחָה גְדוֹלָה
  choice: éprouva une très grande joie
  rationale: Cette tournure idiomatique restitue l’intensification produite par le verbe et son complément de même racine, tout en évitant une répétition peu naturelle en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom personnel divin. « Yahweh » le conserve comme nom plutôt que de le remplacer par un titre.
- issue: Portée de רָעָתוֹ
  choice: son mal-être
  alternative: son malheur
  rationale: Le contexte immédiat évoque le soulagement procuré par l’ombre, mais le mot peut avoir une portée plus large que le seul inconfort physique. « Mal-être » garde cette tension sans suggérer que la plante délivre Jonas de sa propre méchanceté.
translation_notes:
  register: Français international moderne, naturel et digne. Le texte conserve le nom divin « Yahweh », la particularité du terme botanique hébreu et l’intensité de la joie de Jonas.
