id: JON.4.3
reference: Jonah 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה קַח נָ֥א אֶת נַפְשִׁ֖/י מִמֶּ֑/נִּי כִּ֛י ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/003.yaml
  text: And now[a], Yahweh, please take my life from me, for my dying is better than my living.
translation:
  language: fr
  text: Et maintenant, Yahweh, je t’en prie, prends-moi la vie, car ma mort vaut mieux que ma vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « car mieux vaut pour moi mourir que vivre ».'
    reason: alternative lexicale et stylistique
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La conjonction וְ et l’adverbe temporel עַתָּה assurent à la fois la continuité du discours et l’immédiateté de la demande de Jonas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: קַח נָא
  choice: je t’en prie, prends
  rationale: L’impératif קַח exprime la demande directe, tandis que נָא lui donne la nuance d’une supplication; cette tournure est naturelle et digne en français.
- source_word: אֶת נַפְשִׁי מִמֶּנִּי
  choice: prends-moi la vie
  rationale: Dans ce contexte, נֶפֶשׁ désigne la vie de Jonas et non une âme immatérielle. La construction française rend idiomatiquement l’idée de lui retirer la vie, sans ajouter de précision sur le moyen.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Jonas à l’appui de sa demande.
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: ma mort vaut mieux que ma vie
  rationale: La construction comparative avec מִן appelle « vaut mieux que ». Les deux noms avec suffixe de première personne sont conservés par le parallélisme « ma mort / ma vie ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom propre divin; « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Nature de נֶפֶשׁ dans la demande de Jonas
  choice: la vie
  alternative: l’âme
  rationale: Jonas demande à Dieu de mettre fin à son existence terrestre. « La vie » correspond ici au sens contextuel de נֶפֶשׁ et évite d’introduire une conception particulière de l’âme.
translation_notes:
  register: Français international actuel, sobre et digne. La supplication « je t’en prie » conserve la force de נָא, tandis que « ma mort vaut mieux que ma vie » maintient le parallélisme nominal de l’hébreu; la note donne la formulation française la plus idiomatique.
