source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/זְרֹ֣חַ הַ/שֶּׁ֗מֶשׁ וַ/יְמַ֨ן אֱלֹהִ֜ים ר֤וּחַ קָדִים֙ חֲרִישִׁ֔ית וַ/תַּ֥ךְ הַ/שֶּׁ֛מֶשׁ עַל רֹ֥אשׁ יוֹנָ֖ה וַ/יִּתְעַלָּ֑ף וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֕אמֶר ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/008.yaml
  text: When the sun rose[a], God appointed a scorching east wind, and the sun beat down on Jonah’s head so that he grew faint. And he asked that he might die, and said[b], “My death is better than my life.”
translation:
  language: fr
  text: 'Au lever du soleil, Dieu fit venir un vent d’est brûlant[a]. Le soleil frappa la tête de Jonas, au point qu’il défaillit. Il demanda alors à mourir et dit : « Ma mort vaut mieux que ma vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un vent d’est étouffant », « violent » ou peut-être « silencieux ». L’adjectif hébreu est rare et son sens incertain ; « brûlant » convient au contexte de chaleur accablante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: Au lever du soleil
  rationale: La tournure restitue naturellement la proposition temporelle introduite par וַיְהִי avec כִּ et l’infinitif, sans alourdir le récit par une formule telle que « il arriva que ».
- source_word: וַיְמַן
  choice: fit venir
  rationale: Dans Jonas, le verbe exprime l’action délibérée par laquelle Dieu assigne ou dispose un élément créé. « Fit venir » convient naturellement à un vent et conserve clairement l’initiative divine.
- source_word: רוּחַ קָדִים
  choice: un vent d’est
  rationale: Expression française idiomatique désignant un vent venant de l’est.
- source_word: חֲרִישִׁית
  choice: brûlant
  rationale: L’adjectif hébreu, rare et difficile, reçoit ici un sens lié à la chaleur accablante du contexte. Une note conserve les principales autres possibilités.
- source_word: וַתַּךְ הַשֶּׁמֶשׁ עַל רֹאשׁ יוֹנָה
  choice: Le soleil frappa la tête de Jonas
  rationale: « Frapper » préserve l’image concrète du verbe נכה et reste naturel pour décrire l’action intense du soleil.
- source_word: וַיִּתְעַלָּף
  choice: il défaillit
  rationale: Le verbe décrit Jonas accablé au point de perdre ses forces, sans obliger à comprendre qu’il perdit entièrement connaissance.
- source_word: וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת
  choice: Il demanda alors à mourir
  rationale: Cette formulation française rend le sens de l’idiome hébreu concernant sa propre vie, sans reproduire artificiellement sa syntaxe.
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: Ma mort vaut mieux que ma vie
  rationale: Cette phrase nominale concise conserve le contraste direct entre « ma mort » et « ma vie » ainsi que la force abrupte de l’hébreu.
theological_decisions:
- issue: Action divine exprimée par וַיְמַן אֱלֹהִים
  choice: Dieu fit venir
  alternative: Dieu désigna / prépara
  rationale: Le texte présente Dieu comme dirigeant intentionnellement un phénomène naturel. « Fit venir » maintient cette action divine explicite sans ajouter de développement doctrinal.
translation_notes:
  register: Français international moderne, sobre et narratif. Le rythme est concis, et la parole finale de Jonas garde la formulation nominale et abrupte de l’hébreu. Le marqueur [a] figure immédiatement après l’expression concernée.
