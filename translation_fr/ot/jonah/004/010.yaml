source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אַתָּ֥ה חַ֨סְתָּ֙ עַל הַ/קִּ֣יקָי֔וֹן אֲשֶׁ֛ר לֹא עָמַ֥לְתָּ בּ֖/וֹ וְ/לֹ֣א גִדַּלְתּ֑/וֹ שֶׁ/בִּן לַ֥יְלָה הָיָ֖ה וּ/בִן לַ֥יְלָה אָבָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/010.yaml
  text: Then Yahweh said[a], "You had compassion on the plant, for which you did not labor and which you did not make grow, which came up in a night and perished in a night."
translation:
  language: fr
  text: 'Alors Yahweh dit : « Toi, tu as eu pitié de cette plante[a], pour laquelle tu n’as pas peiné et que tu n’as pas fait grandir, qui est apparue en une nuit et a péri en une nuit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le qiqayon ». L’espèce exacte de cette plante est incertaine ; elle est souvent identifiée au ricin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit; « Alors » marque naturellement la suite en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אַתָּה חַסְתָּ עַל
  choice: Toi, tu as eu pitié de
  rationale: Le pronom explicite est mis en relief en hébreu. « Avoir pitié de » exprime ici de façon naturelle le souci compatissant ou l’attachement qui conduit à vouloir épargner.
- source_word: הַקִּיקָיוֹן
  choice: le ricin
  rationale: « Ricin » est l’identification française traditionnelle et probable du qiqayon, tout en laissant son incertitude botanique à une note.
- source_word: אֲשֶׁר לֹא עָמַלְתָּ בּוֹ
  choice: pour lequel tu n’as pas peiné
  rationale: עמל désigne une peine ou un travail pénible; la formulation française conserve l’idée que Jonas n’y a fourni aucun effort.
- source_word: וְלֹא גִדַּלְתּוֹ
  choice: et que tu n’as pas fait grandir
  rationale: Le piel de גדל indique ici l’action de faire croître; cette traduction préserve clairement l’absence d’intervention de Jonas.
- source_word: שֶׁבִּן לַיְלָה הָיָה
  choice: né en une nuit
  rationale: L’expression idiomatique « fils d’une nuit » décrit ce qui vient à l’existence en l’espace d’une nuit. « Né en une nuit » conserve l’image de manière intelligible sans préciser indûment le mode de croissance.
- source_word: וּבִן לַיְלָה אָבָד
  choice: il a disparu en une nuit
  rationale: אבד peut signifier périr, être détruit ou disparaître. « A disparu » convient à la plante désormais perdue et maintient le parallélisme temporel.
theological_decisions:
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le tétragramme, nom personnel du Dieu d’Israël. Le translittérer évite de remplacer le nom par un titre.
- issue: Portée de la compassion de Jonas
  choice: tu as eu pitié du ricin
  alternative: tu as épargné le ricin
  rationale: Le verbe חס peut exprimer la pitié, la compassion ou le fait d’épargner. Dans le contexte, Jonas n’a pas effectivement sauvé la plante; la formulation retenue préserve donc le parallèle avec la sollicitude divine du verset suivant sans lui attribuer une action qu’il n’a pas accomplie.
translation_notes:
  register: Français international moderne, naturel et digne. La mise en relief « Toi, tu » reflète l’emphase du pronom hébreu et prépare le contraste du verset suivant. Les deux occurrences de « en une nuit » conservent le parallélisme frappant de l’original.
