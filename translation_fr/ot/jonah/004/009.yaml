source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל יוֹנָ֔ה הַ/הֵיטֵ֥ב חָרָֽה לְ/ךָ֖ עַל הַ/קִּֽיקָי֑וֹן וַ/יֹּ֕אמֶר הֵיטֵ֥ב חָֽרָה לִ֖/י עַד מָֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/009.yaml
  text: Then God said to Jonah[a], “Is it right for you to be angry about the plant?” And he said, “It is right for me to be angry, even to death.”
translation:
  language: fr
  text: 'Alors Dieu dit à Jonas : « As-tu raison d’être en colère à cause de la plante[a] ? » Il répondit : « Oui, j’ai raison d’être en colère, jusqu’à en mourir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie קִיקָיוֹן (qiqayon), nom d’une plante dont l’espèce est incertaine. On l’a notamment traduit par « courge », « liane » ou « ricin ».
    reason: Alternative lexicale et identification botanique incertaine.
lexical_decisions:
- source_word: הַהֵיטֵב חָרָה לְךָ
  choice: As-tu raison d’être en colère
  rationale: L’expression idiomatique porte sur le caractère justifié de la colère de Jonas. Cette formulation naturelle en français conserve la portée évaluative de la question.
- source_word: עַל הַקִּיקָיוֹן
  choice: à cause de la plante
  rationale: La préposition indique ici ce qui provoque la colère. « La plante » évite de préciser à tort une espèce dont l’identification reste incertaine.
- source_word: הֵיטֵב חָרָה לִי
  choice: Oui, j’ai raison d’être en colère
  rationale: La réponse reprend l’évaluation contenue dans la question et affirme que la colère est justifiée. « Oui » rend explicite en français la valeur affirmative de la reprise hébraïque sans modifier son sens.
- source_word: עַד מָוֶת
  choice: jusqu’à en mourir
  rationale: 'Cette expression française conserve l’intensité extrême de la formule tout en laissant ouverte sa nuance exacte : colère mortelle ou désir de mourir sous l’effet de cette colère.'
- source_word: וַיֹּאמֶר
  choice: Alors Dieu dit / Il répondit
  rationale: « Alors » fait progresser naturellement le récit. Pour la seconde occurrence, « répondit » exprime la fonction évidente de la parole dans le dialogue, sans changer son contenu.
theological_decisions:
- issue: Évaluation morale de la colère de Jonas
  choice: Présenter la question comme portant sur le bien-fondé de sa colère.
  alternative: « Fais-tu bien de te mettre en colère ? »
  rationale: L’hébreu ne demande pas seulement si Jonas est en colère, mais si cette colère est légitime. La réponse de Jonas reprend avec force cette prétention.
- issue: Identification de קִיקָיוֹן
  choice: Employer le terme générique « plante » dans le texte.
  alternative: « ricin », « courge », « liane » ou « qiqayon »
  rationale: L’espèce botanique demeure incertaine. Le terme générique préserve cette incertitude sans introduire une précision non assurée.
- issue: Portée de עַד מָוֶת
  choice: « jusqu’à en mourir »
  alternative: « à en mourir » ou « jusqu’à la mort »
  rationale: La formulation conserve l’extrême intensité de la déclaration sans décider si Jonas dit être assez en colère pour mourir, désirer mourir, ou être en colère jusqu’à la mort.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct et énergique. La répétition autour du bien-fondé de la colère est préservée, tandis que l’incertitude botanique est signalée en note.
