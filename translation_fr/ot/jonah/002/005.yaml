source:
  edition: WLC
  text: וַ/אֲנִ֣י אָמַ֔רְתִּי נִגְרַ֖שְׁתִּי מִ/נֶּ֣גֶד עֵינֶ֑י/ךָ אַ֚ךְ אוֹסִ֣יף לְ/הַבִּ֔יט אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/005.yaml
  text: And I said[a], ‘I have been driven out from before your eyes; yet I will again look toward your holy temple.’
translation:
  language: fr
  text: 'Et moi, j’ai dit : « J’ai été chassé loin de ton regard[a] ; pourtant, je regarderai encore[b] vers ton saint temple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant tes yeux » ; autre traduction possible : « hors de ta présence ».'
    reason: L’expression hébraïque conserve l’image des yeux tout en pouvant désigner la présence ou le regard favorable de Dieu.
  - marker: b
    text: 'Ou : « je continuerai à regarder ».'
    reason: La construction hébraïque peut exprimer soit la répétition, soit la continuation de l’action.
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: Et moi, j’ai dit
  rationale: La coordination et le pronom exprimé poursuivent le récit tout en mettant le locuteur en relief. « J’ai dit » conserve le sens ordinaire du verbe sans exclure qu’il s’agisse ici d’une parole intérieure.
- source_word: נִגְרַשְׁתִּי
  choice: J’ai été chassé
  rationale: Le nifal de גרש exprime le fait d’être repoussé ou expulsé. Cette formulation garde clairement la voix passive sans ajouter une nuance juridique ou politique.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: loin de ton regard
  rationale: L’expression signifie littéralement « de devant tes yeux ». « Loin de ton regard » garde l’image concrète des yeux tout en étant naturelle en français moderne ; la portée possible de présence divine est signalée en note.
- source_word: אַךְ
  choice: pourtant
  rationale: La particule marque ici un retournement appuyé, du sentiment d’exclusion vers l’espérance.
- source_word: אוֹסִיף לְהַבִּיט
  choice: je regarderai encore
  rationale: La construction avec יסף peut exprimer la répétition ou la continuation. « Encore » préserve utilement cette latitude en français, explicitée en note.
- source_word: אֶל הֵיכַל קָדְשֶׁךָ
  choice: vers ton saint temple
  rationale: הֵיכָל désigne ici le temple de Dieu, et le complément « de ta sainteté » se rend naturellement par l’adjectif « saint ». La préposition directionnelle est conservée par « vers ».
theological_decisions:
- issue: L’exclusion est-elle décrite comme étant hors du regard de Dieu ou hors de sa présence ?
  choice: loin de ton regard
  alternative: hors de ta présence
  rationale: Le texte hébreu emploie l’image concrète des yeux de Dieu. La traduction principale la conserve sans réduire cette image à une formulation théologique plus abstraite ; la note mentionne la portée idiomatique possible.
- issue: Le locuteur espère-t-il regarder de nouveau vers le temple ou continuer à le faire ?
  choice: je regarderai encore
  alternative: je continuerai à regarder
  rationale: La construction hébraïque permet les deux nuances. Le contexte favorise souvent l’idée d’un regard renouvelé, mais la note maintient l’autre possibilité sans trancher abusivement.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme entre l’exclusion ressentie et le regard tourné vers le temple est conservé, ainsi que la tension entre détresse et espérance.
