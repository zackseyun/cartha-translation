source:
  edition: WLC
  text: לְ/קִצְבֵ֤י הָרִים֙ יָרַ֔דְתִּי הָ/אָ֛רֶץ בְּרִחֶ֥י/הָ בַעֲדִ֖/י לְ/עוֹלָ֑ם וַ/תַּ֧עַל מִ/שַּׁ֛חַת חַיַּ֖/י יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/007.yaml
  text: I went down to the roots of the mountains[a]; the earth with its bars was around me forever, but you brought up my life from the pit[c][b], O Yahweh my God.
translation:
  language: fr
  text: Je suis descendu jusqu’aux racines des montagnes[a] ; la terre, avec ses verrous, m’enfermait pour toujours[b]. Mais tu as fait remonter ma vie hors de la fosse[c], Yahweh, mon Dieu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’aux extrémités » ou « jusqu’aux bases des montagnes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la terre avait tiré ses verrous derrière moi pour toujours ». L’hébreu évoque l’enfermement au moyen des barres ou des verrous de la terre.
    reason: lexical_alternative
  - marker: c
    text: Ou « hors de la tombe » ou « hors de la destruction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִצְבֵי הָרִים
  choice: jusqu’aux racines des montagnes
  rationale: קִצְבֵי désigne les extrémités ou les limites. Avec les montagnes et le mouvement de descente, « racines » exprime naturellement en français leurs profondeurs ou leurs bases, tout en conservant l’image poétique.
- source_word: יָרַדְתִּי
  choice: je suis descendu
  rationale: Le qal accompli à la première personne décrit directement le mouvement vers le bas ; cette formulation est naturelle et fidèle.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans cette scène cosmique de descente, d’enfermement et de mort, « la terre » convient mieux que le sens plus local de « pays ».
- source_word: בְּרִחֶיהָ בַעֲדִי
  choice: avec ses verrous, m’enfermait
  rationale: בְּרִיחַ désigne un verrou ou une barre. בַעֲדִי peut évoquer ce qui est autour ou derrière le locuteur ; « m’enfermait » rend l’image carcérale sans ajouter des portes absentes de l’hébreu.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: L’expression communique ici la finalité apparemment irrévocable de la mort telle que Jonas l’éprouve, sans imposer une définition métaphysique de sa durée.
- source_word: וַתַּעַל
  choice: tu as fait remonter
  rationale: Le hifil de עלה signifie « faire monter ». La tournure conserve le contraste explicite entre la descente de Jonas et l’action salvatrice de Dieu.
- source_word: מִשַּׁחַת
  choice: hors de la fosse
  rationale: שַׁחַת peut désigner la fosse, la tombe ou la destruction. « Fosse » maintient l’image concrète de la profondeur et laisse présente sa connotation mortuaire.
- source_word: חַיַּי
  choice: ma vie
  rationale: La traduction littérale préserve la formulation hébraïque et souligne que le salut arrache la vie de Jonas à la mort.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, mon Dieu
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, et אֱלֹהָי est rendu directement par « mon Dieu ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie le nom personnel divin. « Yahweh » le conserve sous une forme de translittération largement reconnue, sans le remplacer par un titre.
- issue: Portée de לְעוֹלָם dans une prière aux portes de la mort
  choice: pour toujours
  alternative: à jamais ; pour une durée indéfinie
  rationale: « Pour toujours » garde la force existentielle et poétique de l’enfermement ressenti comme définitif, sans transformer cette parole en affirmation doctrinale sur une durée littéralement infinie.
- issue: Sens de שַׁחַת
  choice: la fosse
  alternative: la tombe ; la destruction
  rationale: Le terme est polysémique. « Fosse » conserve l’image spatiale qui structure le verset, tandis qu’une note maintient ouvertes les nuances de mort et de destruction.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme entre « je suis descendu » et « tu as fait remonter » est conservé. La ponctuation rend lisible l’enchaînement des images sans supprimer leur tension ni leur densité.
