source:
  edition: WLC
  text: בְּ/הִתְעַטֵּ֤ף עָלַ/י֙ נַפְשִׁ֔/י אֶת יְהוָ֖ה זָכָ֑רְתִּי וַ/תָּב֤וֹא אֵלֶ֨י/ךָ֙ תְּפִלָּתִ֔/י אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/008.yaml
  text: When my life was fainting away within me[a], I remembered Yahweh, and my prayer came to you[b], into your holy temple.
translation:
  language: fr
  text: Quand ma vie s’épuisait[a], je me suis souvenu de Yahweh, et ma prière est parvenue jusqu’à toi, vers ton saint temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quand mon âme s’épuisait » ou « Quand mon être s’épuisait ». Le mot hébreu peut désigner la vie, l’âme ou la personne elle-même selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « ton saint palais » ou « ton saint sanctuaire ». Le terme hébreu peut désigner un palais royal ou un temple ; ici, « temple » convient au contexte de la prière.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף עָלַי נַפְשִׁי
  choice: Quand ma vie défaillait en moi
  rationale: La construction introduit une circonstance temporelle et décrit l’affaiblissement intérieur de Jonas. « Ma vie » rend ici נֶפֶשׁ dans le contexte d’un péril mortel, tandis que « défaillait en moi » exprime naturellement l’idiome hébreu sans en effacer la dimension intérieure.
- source_word: אֶת־יְהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le nom divin יהוה ; sa translittération préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- source_word: זָכָרְתִּי
  choice: je me suis souvenu
  rationale: Rend directement le qal parfait de זכר, sans développer implicitement le souvenir en invocation ou en prière.
- source_word: וַתָּבוֹא אֵלֶיךָ תְּפִלָּתִי
  choice: ma prière est parvenue jusqu’à toi
  rationale: « Est parvenue » constitue en français une expression naturelle pour une prière qui vient jusqu’à Dieu, tout en restant proche du mouvement exprimé par בוא.
- source_word: אֶל־הֵיכַל קָדְשֶׁךָ
  choice: jusque dans ton saint temple
  rationale: « Temple » convient au contexte cultuel de la prière. « Jusque dans » maintient l’image dynamique de la prière qui entre dans la demeure sainte de Dieu.
theological_decisions:
- issue: Sens anthropologique de נַפְשִׁי
  choice: ma vie
  alternative: mon âme / mon être
  rationale: Dans ce contexte de mort imminente, « ma vie » exprime le sens concret le plus probable sans imposer une définition technique de l’âme. La note conserve les autres nuances légitimes.
- issue: Référent du saint temple
  choice: ne pas préciser s’il s’agit du temple terrestre ou de la demeure céleste
  alternative: identifier explicitement le temple de Jérusalem ou le sanctuaire céleste
  rationale: Le texte permet à l’image du temple de garder sa résonance sans trancher ici entre la demeure terrestre et céleste de Dieu.
- issue: Rendu du nom יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: La translittération rend le nom divin présent dans le texte hébreu et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient à la narration personnelle, tandis que l’imparfait marque l’affaiblissement en cours. La répétition « jusqu’à toi, jusque dans » conserve le double mouvement du texte hébreu sans alourdir excessivement la phrase.
