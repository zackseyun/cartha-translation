  text: Waters closed in around me to my very life[a]; the deep surrounded me[b]; seaweed was wrapped around my head.
translation:
  language: fr
  text: Les eaux m’encerclaient, menaçant ma vie même[a] ; l’abîme m’entourait ; des algues étaient enroulées autour de ma tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à la vie » ou « jusqu’à la personne » ; le sens est que les eaux menaçaient sa vie même.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner des roseaux ou des joncs ; dans ce contexte marin, « algues » paraît le plus naturel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: m’encerclaient
  rationale: Le verbe exprime l’idée d’envelopper ou de cerner. « M’encerclaient » rend naturellement la menace des eaux et évite de répéter « m’entourait » dans le membre suivant.
- source_word: מַיִם
  choice: les eaux
  rationale: Le pluriel poétique français correspond bien au pluriel hébreu et à l’image de masses d’eau menaçantes.
- source_word: עַד נֶפֶשׁ
  choice: menaçant ma vie même
  rationale: נֶפֶשׁ désigne ici la vie ou la personne elle-même, non une âme immatérielle abstraite. Cette formulation exprime que les eaux mettent en péril la vie du prophète sans introduire l’image interprétative du cou.
- source_word: תְּהוֹם
  choice: l’abîme
  rationale: Dans ce contexte marin et poétique, « l’abîme » désigne les eaux profondes. Le terme est courant et digne en français biblique moderne, sans qu’il faille lui donner ici un sens eschatologique.
- source_word: יְסֹבְבֵנִי
  choice: m’entourait
  rationale: Rend directement le sens d’entourer ou d’encercler, tout en maintenant le parallélisme avec le premier membre.
- source_word: סוּף
  choice: des algues
  rationale: Le mot peut désigner des roseaux, des joncs ou des plantes aquatiques. Dans la scène d’immersion en mer, « algues » convient le mieux à l’image.
- source_word: חָבוּשׁ
  choice: s’enroulaient autour
  rationale: Le participe passif évoque quelque chose lié ou enveloppé autour de la tête. La tournure française au pluriel est naturelle avec « des algues » et conserve l’image concrète.
- source_word: לְרֹאשִׁי
  choice: de ma tête
  rationale: Rend simplement la relation exprimée par la préposition et le nom avec suffixe possessif.
theological_decisions:
- issue: Sens de נֶפֶשׁ
  choice: ma vie même
  alternative: mon âme / mon être même
  rationale: Le contexte décrit une mort imminente dans les eaux. « Vie » conserve le sens concret et existentiel de נֶפֶשׁ sans imposer une anthropologie dualiste.
translation_notes:
  register: Français international moderne, poétique et digne. L’imparfait maintient la description progressive de l’encerclement. Les deux verbes distincts, « encercler » et « entourer », préservent le parallélisme sans lourde répétition. Tous les marqueurs de notes figurent dans le texte.
