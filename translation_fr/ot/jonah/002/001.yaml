  text: וַ/יְמַ֤ן יְהוָה֙ דָּ֣ג גָּד֔וֹל לִ/בְלֹ֖עַ אֶת יוֹנָ֑ה וַ/יְהִ֤י יוֹנָה֙ בִּ/מְעֵ֣י הַ/דָּ֔ג שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/001.yaml
  text: And Yahweh appointed a great fish to swallow Jonah[d][c][b][a], and Jonah was in the belly of the fish three days and three nights.
translation:
  language: fr
  text: Yahweh prépara un grand poisson pour avaler Jonas.[a][b] Jonas resta dans le ventre du poisson[c] trois jours et trois nuits.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « disposa » ou « désigna » un grand poisson.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « un grand poisson », sans préciser qu’il s’agissait d’une baleine.
    reason: alternative_reading
  - marker: c
    text: L’hébreu dit littéralement « dans les parties intérieures du poisson »; l’expression est rendue idiomatiquement par « dans le ventre du poisson ».
    reason: lexical_alternative
  - marker: d
    text: L’expression « trois jours et trois nuits » est traduite telle quelle, sans trancher la question d’un éventuel décompte inclusif.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְמַן
  choice: fit venir
  rationale: Le verbe exprime ici l’action délibérée et souveraine de Yahweh, qui dispose du poisson pour cette tâche. « Fit venir » est naturel en français et évite le sens administratif que pourrait suggérer « désigna ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: דָּג גָּדוֹל
  choice: un grand poisson
  rationale: דָּג est le terme ordinaire pour « poisson » et גָּדוֹל signifie « grand ». Cette traduction n’introduit pas l’identification plus précise « baleine », absente de l’hébreu.
- source_word: לִבְלֹעַ
  choice: pour engloutir
  rationale: Le verbe signifie avaler ou engloutir. « Engloutir » convient naturellement à la scène et exprime l’absorption entière de Jonas sans ajouter l’idée de le dévorer.
- source_word: בִּמְעֵי הַדָּג
  choice: dans le ventre du poisson
  rationale: Le pluriel hébreu désigne les parties intérieures ou entrailles. « Dans le ventre » en donne une expression française idiomatique sans tonalité clinique ou grotesque.
- source_word: וַיְהִי יוֹנָה
  choice: Jonas resta
  rationale: Dans ce contexte duratif, la tournure indique que Jonas se trouva et demeura dans le poisson pendant la durée précisée. « Resta » produit un français naturel sans modifier cette donnée.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: trois jours et trois nuits
  rationale: La formulation reproduit directement l’expression temporelle hébraïque et ne tranche pas la question d’un éventuel décompte inclusif.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Identification de la créature marine
  choice: un grand poisson
  alternative: une baleine
  rationale: L’hébreu dit seulement « poisson »; préciser « baleine » importerait une identification qui ne figure pas dans le texte.
- issue: Portée de l’expression temporelle
  choice: trois jours et trois nuits
  alternative: pendant une partie de trois jours
  rationale: La traduction conserve l’expression telle quelle et laisse ouverte la question du mode de décompte, sans harmonisation interprétative.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe en deux phrases améliore la lisibilité tout en conservant la succession narrative. « Fit venir » communique l’intervention intentionnelle de Yahweh dans un langage courant; « ventre » rend idiomatiquement l’expression hébraïque désignant les parties intérieures.
