source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר קָ֠רָאתִי מִ/צָּ֥רָה לִ֛/י אֶל יְהוָ֖ה וַֽ/יַּעֲנֵ֑/נִי מִ/בֶּ֧טֶן שְׁא֛וֹל שִׁוַּ֖עְתִּי שָׁמַ֥עְתָּ קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/003.yaml
  text: And he said[a], “I called to Yahweh out of my distress, and he answered me. From the belly of Sheol I cried out[b]; you heard my voice.”
translation:
  language: fr
  text: 'Il dit : « Dans ma détresse, j’ai appelé Yahweh, et il m’a répondu. Du ventre[a] du shéol[b], j’ai crié au secours ; tu as entendu ma voix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sein du shéol » ; le mot hébreu peut désigner le ventre ou le sein maternel.
    reason: lexical_alternative
  - marker: b
    text: Le shéol est le terme hébreu désignant le domaine des morts ; dans une traduction plus interprétative, on pourrait rendre ici « le séjour des morts » ou « la tombe ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Cette formule narrative introduit la prière de Jonas. En français moderne, « Il dit » rend naturellement le wayyiqtol sans alourdir la phrase d’un « Et » peu idiomatique ici.
- source_word: קָרָאתִי מִצָּרָה לִי
  choice: Dans ma détresse, j’ai appelé
  rationale: צָרָה désigne la détresse ou l’affliction. La tournure « dans ma détresse » exprime naturellement en français la situation depuis laquelle Jonas appelle, tandis que « j’ai appelé » conserve le vocabulaire de la prière.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est translittéré « Yahweh », ce qui préserve le nom d’alliance présent dans l’hébreu.
- source_word: וַיַּעֲנֵנִי
  choice: et il m’a répondu
  rationale: Le verbe ענה désigne ici la réponse de Dieu à la prière, et « m’ » rend explicitement le suffixe de première personne.
- source_word: מִבֶּטֶן שְׁאוֹל
  choice: Du ventre du shéol
  rationale: בֶּטֶן peut signifier « ventre » ou « sein ». « Ventre » préserve l’image corporelle et son écho au poisson sans réduire שְׁאוֹל à la tombe ou à l’enfer.
- source_word: שִׁוַּעְתִּי
  choice: j’ai crié au secours
  rationale: Le verbe שׁוע exprime précisément un cri lancé pour obtenir de l’aide. « Crier au secours » le distingue utilement de קרא, rendu plus haut par « appeler ».
- source_word: שָׁמַעְתָּ קוֹלִי
  choice: tu as entendu ma voix
  rationale: Cette traduction conserve le passage soudain de la troisième à la deuxième personne ainsi que l’expression concrète « ma voix ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération maintient le nom divin personnel attesté par le texte, plutôt que de le remplacer par un titre.
- issue: Sens de שְׁאוֹל
  choice: le shéol
  alternative: le séjour des morts ; la tombe ; l’enfer
  rationale: « Shéol » préserve la portée propre du terme hébreu et évite de l’identifier sans nuance soit à une tombe physique, soit à une conception ultérieure de l’enfer.
- issue: Image de בֶּטֶן שְׁאוֹל
  choice: le ventre du shéol
  alternative: le sein du shéol
  rationale: « Ventre » conserve l’image viscérale et poétique, tandis qu’une note signale l’autre valeur possible du nom hébreu sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est conservé, ainsi que le passage de « il » à « tu » dans l’adresse à Dieu. Le point-virgule maintient le lien étroit entre le cri de Jonas et l’écoute divine.
