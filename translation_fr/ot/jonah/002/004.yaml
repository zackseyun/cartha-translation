source:
  edition: WLC
  text: וַ/תַּשְׁלִיכֵ֤/נִי מְצוּלָה֙ בִּ/לְבַ֣ב יַמִּ֔ים וְ/נָהָ֖ר יְסֹבְבֵ֑/נִי כָּל מִשְׁבָּרֶ֥י/ךָ וְ/גַלֶּ֖י/ךָ עָלַ֥/י עָבָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/004.yaml
  text: You cast me into the deep[a], into the heart of the seas, and the current surrounded me; all your breakers and your waves passed over me.
translation:
  language: fr
  text: Tu m’as jeté dans les profondeurs, au cœur des mers ; le courant[a] m’a encerclé. Tous tes brisants et tes vagues ont passé sur moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fleuve » ou « le flot » ; נָהָר signifie le plus souvent « fleuve », mais désigne probablement ici le courant marin dans ce contexte poétique.
    reason: Alternative lexicale authentique du terme hébreu נָהָר.
lexical_decisions:
- source_word: וַתַּשְׁלִיכֵנִי
  choice: Tu m’as jeté
  rationale: Le verbe שלך exprime l’action de jeter ou lancer. Le tutoiement conserve l’adresse directe à Dieu marquée par la deuxième personne masculine singulière.
- source_word: מְצוּלָה
  choice: dans les profondeurs
  rationale: Le terme désigne les profondeurs marines. Le pluriel français est naturel et maintient l’image d’un engloutissement dans l’abîme marin.
- source_word: בִּלְבַב יַמִּים
  choice: au cœur des mers
  rationale: Cette traduction conserve la métaphore concrète de לְבַב, « cœur », ainsi que le pluriel יַמִּים, « mers ».
- source_word: וְנָהָר
  choice: le courant
  rationale: Bien que נָהָר signifie habituellement « fleuve », le contexte maritime permet de comprendre ici un courant ou un flot. « Courant » s’intègre naturellement aux images de déferlants et de vagues.
- source_word: יְסֹבְבֵנִי
  choice: m’a encerclé
  rationale: Le verbe סבב signifie entourer ou encercler. « Encerclé » rend avec force l’idée d’une eau qui enferme Jonas de toutes parts.
- source_word: מִשְׁבָּרֶיךָ
  choice: tes déferlants
  rationale: Le mot désigne des vagues qui se brisent. « Déferlants » restitue leur mouvement puissant dans un français actuel et poétique.
- source_word: וְגַלֶּיךָ
  choice: et tes vagues
  rationale: גַּלִּים désigne les vagues. Le possessif est maintenu afin de respecter la formulation hébraïque et l’adresse à Dieu.
- source_word: עָלַי עָבָרוּ
  choice: ont passé sur moi
  rationale: Traduction proche de l’expression hébraïque, qui conserve l’image des eaux passant au-dessus de Jonas sans ajouter explicitement l’idée interprétative de balayage.
theological_decisions:
- issue: L’action divine dans la descente de Jonas dans la mer
  choice: 'Maintenir l’adresse directe à Dieu : « Tu m’as jeté… tes déferlants et tes vagues »'
  alternative: Atténuer cette action en faisant implicitement des marins les seuls agents
  rationale: L’hébreu emploie explicitement la deuxième personne du singulier et des suffixes possessifs correspondants. Le verset présente donc l’épreuve comme relevant ultimement de l’action souveraine de Dieu, tout en laissant subsister la médiation humaine racontée dans le récit.
translation_notes:
  register: Français moderne, digne et poétique sans archaïsme. La ponctuation fait ressortir les trois mouvements du verset. Les métaphores hébraïques « cœur des mers » et les eaux appartenant à Dieu sont conservées.
