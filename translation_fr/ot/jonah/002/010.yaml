source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/ק֤וֹל תּוֹדָה֙ אֶזְבְּחָה לָּ֔/ךְ אֲשֶׁ֥ר נָדַ֖רְתִּי אֲשַׁלֵּ֑מָה יְשׁוּעָ֖תָ/ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/010.yaml
  text: But as for me[a], with the voice of thanksgiving I will sacrifice to you; what I have vowed I will pay. Salvation belongs to Yahweh.
translation:
  language: fr
  text: Mais moi, avec des paroles de reconnaissance, je t’offrirai un sacrifice ; ce que j’ai fait comme vœu, je l’accomplirai. Le salut appartient à Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « La délivrance appartient à Yahweh » ou « Le salut vient de Yahweh ». Le mot hébreu peut désigner ici le secours ou la délivrance, tout en ayant le sens plus large de salut.'
    reason: Alternative lexicale et nuance syntaxique.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: Le pronom indépendant met le locuteur en relief et marque un contraste avec ceux qui s’attachent aux idoles au verset précédent.
- source_word: בְּקוֹל תּוֹדָה
  choice: avec des paroles de reconnaissance
  rationale: קוֹל évoque la voix ou le son, tandis que תּוֹדָה désigne ici la reconnaissance exprimée dans le culte. Cette formulation française conserve le caractère audible de l’action de grâce sans être artificiellement littérale.
- source_word: אֶזְבְּחָה לָּךְ
  choice: je t’offrirai un sacrifice
  rationale: Le verbe זבח désigne l’offrande d’un sacrifice. La tournure choisie est naturelle en français et rend explicitement le complément implicite du verbe hébreu.
- source_word: אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה
  choice: ce que j’ai promis par vœu, je l’accomplirai
  rationale: Dans le contexte des vœux, le piel de שלם signifie s’acquitter de son engagement ou l’accomplir. « Promis par vœu » évite l’ambiguïté moderne de « voué » et conserve le sens cultuel.
- source_word: יְשׁוּעָתָה לַיהוָה
  choice: Le salut appartient à Yahweh
  rationale: יְשׁוּעָה peut désigner une délivrance concrète ou le salut au sens large. Le ל exprime ici de façon concise l’appartenance, l’origine ou la prérogative ; la traduction principale retient la formule « appartient à » tout en signalant les autres nuances en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de représenter directement le tétragramme présent dans le texte hébreu.
theological_decisions:
- issue: Portée de יְשׁוּעָה et valeur du ל dans יְשׁוּעָתָה לַיהוָה
  choice: Le salut appartient à Yahweh
  alternative: La délivrance vient de Yahweh / Le salut vient de Yahweh
  rationale: La formulation retenue garde la portée générale de « salut » et l’affirmation selon laquelle il relève de Yahweh, sans exclure la délivrance immédiate de Jonas ni la nuance de provenance.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription préserve le nom propre de l’hébreu plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le contraste initial, le langage cultuel du sacrifice et du vœu, ainsi que la concision solennelle de la déclaration finale.
