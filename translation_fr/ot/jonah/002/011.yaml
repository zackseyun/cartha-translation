  yaml_path: translation/ot/jonah/002/011.yaml
  text: Then Yahweh spoke to the fish[a], and it vomited Jonah onto the dry land.
translation:
  language: fr
  text: Alors Yahweh a parlé au poisson[a], et le poisson a vomi Jonas sur la terre ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a dit au poisson ».'
    reason: 'Alternative lexicale : אמר signifie littéralement « dire », tandis que « parler à » est une formulation française naturelle dans ce contexte.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: parla
  rationale: Le verbe אמר signifie littéralement « dire ». Avec le complément introduit par ל, « parla au poisson » est naturel en français et évite de renforcer indûment le sens par « ordonna ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel יהוה au lieu de lui substituer un titre.
- source_word: לַדָּג
  choice: au poisson
  rationale: דג désigne simplement le « poisson » dans ce verset ; l’adjectif « grand », présent plus tôt dans le récit, n’est pas exprimé ici.
- source_word: וַיָּקֵא
  choice: vomit
  rationale: Le verbe קיא désigne directement l’action de vomir. Ce choix conserve la force concrète du terme hébreu sans l’atténuer par « recracha ».
- source_word: אֶת יוֹנָה
  choice: Jonas
  rationale: אֶת marque Jonas comme objet direct défini ; cette fonction est rendue par la syntaxe française normale.
- source_word: אֶל הַיַּבָּשָׁה
  choice: sur la terre ferme
  rationale: יַבָּשָׁה désigne la terre sèche ou ferme, par opposition à la mer. Avec le mouvement impliqué par le verbe, « sur la terre ferme » est idiomatique en français.
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif fait progresser la séquence du récit ; « Alors » exprime naturellement cette succession en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: « Yahweh » conserve le nom divin sous une translittération couramment employée et suit la convention du projet sans remplacer le nom par un titre.
translation_notes:
  register: Français moderne, clair et digne. La formulation reste concrète et concise, conformément au style narratif hébreu ; le relatif « qui » évite une répétition lourde tout en maintenant l’enchaînement des actions.
