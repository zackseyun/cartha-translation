  text: מְשַׁמְּרִ֖ים הַבְלֵי שָׁ֑וְא חַסְדָּ֖/ם יַעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/009.yaml
  text: Those who cling to worthless idols forsake their own mercy[a].
translation:
  language: fr
  text: Ceux qui s’attachent à des idoles sans valeur abandonnent leur propre fidélité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « abandonnent l’amour fidèle qui leur est accordé », c’est-à-dire la bonté ou la miséricorde de Dieu. Le sens de « leur propre fidélité » reste discuté.
    reason: 'Lecture alternative de חַסְדָּם : le nom peut désigner la fidélité qui est la leur ou l’amour fidèle, la bonté ou la miséricorde qui leur vient de Dieu.'
lexical_decisions:
- source_word: מְשַׁמְּרִים
  choice: s’attachent à
  rationale: Le verbe signifie couramment « garder, observer, veiller sur ». Avec הַבְלֵי שָׁוְא, il exprime ici une fidélité persistante envers de faux objets de culte; « s’attachent à » rend naturellement cette idée sans réduire le geste à une simple observation.
- source_word: הַבְלֵי שָׁוְא
  choice: des idoles sans valeur
  rationale: הֶבֶל évoque ce qui est vapeur, vide ou vain, tandis que שָׁוְא renforce l’idée de fausseté et d’inanité. Dans ce contexte prophétique, l’expression désigne les idoles comme objets de culte illusoires et sans valeur.
- source_word: חַסְדָּם
  choice: l’amour fidèle qui leur était destiné
  rationale: חֶסֶד peut désigner l’amour fidèle, la bonté, la loyauté ou la faveur miséricordieuse. Le suffixe « leur » est conservé, mais sa relation précise avec cet amour reste ambiguë. Cette formulation suggère un bien relationnel qui leur appartient ou leur est offert sans préciser excessivement s’il vient de Dieu ou s’il s’agit de leur propre fidélité.
- source_word: יַעֲזֹבוּ
  choice: abandonnent
  rationale: עָזַב signifie « quitter, délaisser, abandonner ». « Abandonnent » convient au registre solennel tout en restant naturel en français moderne.
theological_decisions:
- issue: Sens de חַסְדָּם et relation de cet amour fidèle avec les idolâtres et Dieu
  choice: L’expression principale désigne l’amour fidèle lié à leur relation avec Dieu, présenté comme leur étant destiné, qu’ils abandonnent en s’attachant aux idoles.
  alternative: « abandonnent leur propre fidélité » ou « renoncent à la bonté qui leur est accordée », notamment à la grâce disponible auprès de Dieu.
  rationale: L’hébreu est concis et permet de comprendre חֶסֶד comme la fidélité qui devrait être la leur ou comme l’amour miséricordieux dont ils bénéficient auprès de Dieu. Le texte principal évite de réduire le terme à la seule « miséricorde », tandis que la note préserve explicitement les deux grandes lectures.
translation_notes:
  register: Français international moderne, naturel et digne. « Idoles sans valeur » explicite l’idiome prophétique; la formulation de חַסְדָּם et la note maintiennent l’ambiguïté théologique réelle du texte hébreu.
