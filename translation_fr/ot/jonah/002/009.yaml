  - severity: low
    issue: Note alternative formulée de manière imprécise
    rationale: « Leur propre fidélité » ne devrait pas être seulement une option en note si le texte principal choisit une paraphrase différente. En plaçant cette lecture dans le texte et l’interprétation de l’amour fidèle reçu de Dieu dans la note, l’ensemble reflète plus clairement les deux possibilités.
