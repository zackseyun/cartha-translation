  source_fidelity: 'La première proposition rend bien מְשַׁמְּרִים הַבְלֵי־שָׁוְא : « s’attachent à » exprime l’adhésion persistante, et « idoles sans valeur » rend de façon idiomatique l’expression des « vanités trompeuses/vaines ». En revanche, « l’amour fidèle qui leur était destiné » introduit l’idée temporelle et téléologique de destination (« était destiné »), absente de חַסְדָּם. Le suffixe possessif doit être maintenu sans cette expansion. « Leur propre fidélité » constitue une lecture principale sobre et défendable; la note doit conserver l’autre compréhension, selon laquelle il s’agit de la bonté ou de l’amour fidèle reçu de Dieu.'
  naturalness: La phrase est fluide et de registre approprié. La correction proposée est plus directe et évite la tournure interprétative « qui leur était destiné ».
  terminology: « Idoles sans valeur » est naturel en français moderne et acceptable pour l’idiome hébreu. « Fidélité » convient à l’une des valeurs relationnelles de חֶסֶד sans imposer « alliance », qui n’est pas exprimé dans le verset. La note préserve les valeurs possibles d’amour fidèle, de bonté ou de miséricorde.
