  text: וַ/יִּתְפַּלֵּ֣ל יוֹנָ֔ה אֶל יְהוָ֖ה אֱלֹהָ֑י/ו מִ/מְּעֵ֖י הַ/דָּגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/002.yaml
  text: Then Jonah prayed to Yahweh his God from the belly of the fish[a].
translation:
  language: fr
  text: 'Alors Jonas pria Yahweh, son Dieu, du ventre du poisson[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis les parties intérieures du poisson » ; « ventre » est ici une traduction naturelle selon le contexte.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: Alors ... pria
  rationale: Le wayyiqtol fait avancer le récit. « Alors » exprime naturellement la succession, et le passé simple convient au registre narratif digne.
- source_word: יוֹנָה
  choice: Jonas
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: אֶל
  choice: pria Yahweh
  rationale: En français, le complément du verbe « prier » se construit directement lorsqu’il désigne la personne à qui la prière est adressée ; traduire littéralement la préposition produirait une tournure moins naturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du tétragramme, qui conserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: 'Le suffixe masculin singulier exprime sans ambiguïté la possession ou la relation : « son Dieu ».'
- source_word: מִמְּעֵי
  choice: depuis le ventre
  rationale: Le nom peut désigner les parties intérieures, les entrailles, le ventre ou la matrice. Dans le contexte du poisson qui a avalé Jonas, « ventre » est clair et naturel ; « depuis » marque le lieu d’où monte la prière.
- source_word: הַדָּגָה
  choice: du poisson
  rationale: L’hébreu porte simplement « le poisson ». La forme grammaticale féminine n’impose pas de préciser le sexe en français, et l’adjectif « grand » ne doit pas être ajouté dans ce verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel présent dans la source sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre narratif biblique accessible. Le deux-points respecte la fonction introductive du verset avant les paroles de la prière qui suivent.
