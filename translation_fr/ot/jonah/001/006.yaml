  text: וַ/יִּקְרַ֤ב אֵלָי/ו֙ רַ֣ב הַ/חֹבֵ֔ל וַ/יֹּ֥אמֶר ל֖/וֹ מַה לְּ/ךָ֣ נִרְדָּ֑ם ק֚וּם קְרָ֣א אֶל אֱלֹהֶ֔י/ךָ אוּלַ֞י יִתְעַשֵּׁ֧ת הָ/אֱלֹהִ֛ים לָ֖/נוּ וְ/לֹ֥א נֹאבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/006.yaml
  text: So the captain came near to him and said to him[a], “What do you mean, sleeper? Get up, call on your god. Perhaps the god will give thought to us[c][b], so that we may not perish.”
translation:
  language: fr
  text: 'Le capitaine[a] s’approcha de lui et lui dit : « Comment peux-tu dormir[b] ? Lève-toi, invoque ton dieu ! Peut-être que le dieu pensera à nous[c], et nous ne périrons pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le chef des marins » ou « le maître du navire ».'
    reason: lexical_alternative
  - marker: b
    text: 'La réprimande hébraïque est très concise, littéralement : « Qu’as-tu à dormir ? » Elle signifie quelque chose comme : « Comment peux-tu dormir ? »'
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe hébreu, rare, peut aussi signifier : « prêtera attention à nous » ou « se souciera de nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב הַחֹבֵל
  choice: le capitaine
  rationale: L’expression désigne littéralement le chef des marins. « Le capitaine » est l’équivalent moderne le plus naturel pour le responsable du navire.
- source_word: וַיִּקְרַב אֵלָיו
  choice: s’approcha de lui
  rationale: Cette formulation rend directement le mouvement exprimé par קָרַב et convient au registre narratif.
- source_word: מַה לְּךָ נִרְדָּם
  choice: Comment peux-tu dormir ?
  rationale: L’hébreu formule une réprimande très concise. Cette traduction en restitue l’étonnement indigné dans un français naturel, tandis que la note conserve la forme littérale inhabituelle.
- source_word: קוּם
  choice: Lève-toi
  rationale: Impératif français courant, direct et urgent, correspondant à קוּם.
- source_word: קְרָא אֶל אֱלֹהֶיךָ
  choice: invoque ton dieu
  rationale: Dans ce contexte, קרא אל désigne un appel adressé à une divinité. « Invoquer » exprime clairement l’appel religieux sans ajouter de contenu.
- source_word: אוּלַי
  choice: Peut-être
  rationale: Le terme marque une possibilité ou un espoir incertain, nuance préservée par « peut-être ».
- source_word: יִתְעַשֵּׁת
  choice: pensera à nous
  rationale: Ce verbe rare peut évoquer le fait de penser à quelqu’un, de lui prêter attention ou de se soucier de lui. « Pensera à nous » conserve la nuance délibérative sans préciser indûment la forme de l’intervention.
- source_word: הָאֱלֹהִים
  choice: le dieu
  rationale: Le capitaine parle de la divinité que Jonas doit invoquer sans la nommer comme le Dieu d’Israël. L’article et la minuscule maintiennent cette perspective générique dans son discours.
- source_word: וְלֹא נֹאבֵד
  choice: et nous ne périrons pas
  rationale: La coordination hébraïque exprime l’issue espérée. Cette formulation française reste proche de la syntaxe de la source tout en étant claire.
theological_decisions:
- issue: Référence de אֱלֹהֶיךָ et הָאֱלֹהִים dans les paroles du capitaine païen
  choice: « ton dieu » puis « le dieu », avec une minuscule
  alternative: « ton Dieu » puis « Dieu »
  rationale: Le capitaine invite Jonas à s’adresser à sa propre divinité, sans identifier explicitement celle-ci au SEIGNEUR. La traduction évite donc de lui attribuer une confession théologique que le verset n’énonce pas, tout en laissant intacte l’ironie narrative.
- issue: Rapport logique de וְלֹא נֹאבֵד
  choice: « et nous ne périrons pas »
  alternative: « afin que nous ne périssions pas »
  rationale: La simple coordination préserve la forme hébraïque et peut naturellement exprimer en français le résultat espéré, sans transformer explicitement la proposition en subordonnée de but.
translation_notes:
  register: Français international moderne, direct et digne. Le discours conserve l’urgence de la scène. « Invoque » relève d’un registre religieux courant; « périrons » garde la gravité du récit sans être archaïque.
