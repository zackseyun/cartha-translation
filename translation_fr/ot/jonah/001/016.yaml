reference: Jonah 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽירְא֧וּ הָ/אֲנָשִׁ֛ים יִרְאָ֥ה גְדוֹלָ֖ה אֶת יְהוָ֑ה וַ/יִּֽזְבְּחוּ זֶ֨בַח֙ לַֽ/יהוָ֔ה וַֽ/יִּדְּר֖וּ נְדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/016.yaml
  text: Then the men feared Yahweh with great fear[a], and they offered a sacrifice to Yahweh and made vows.
translation:
  language: fr
  text: Alors les hommes éprouvèrent une grande crainte de Yahweh[a]. Ils offrirent un sacrifice à Yahweh et firent des vœux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les hommes craignirent une grande crainte de Yahweh ». On peut aussi comprendre : « ils eurent très peur de Yahweh » ou « ils éprouvèrent une profonde révérence pour Yahweh ».'
    reason: La construction intensive et le terme ירא peuvent exprimer aussi bien l’effroi que la crainte révérencielle dans ce contexte.
lexical_decisions:
- source_word: וַיִּירְאוּ … יִרְאָה גְדוֹלָה
  choice: furent saisis d’une grande crainte
  rationale: Le verbe ירא et le nom apparenté יִרְאָה forment une construction intensive, littéralement « craignirent une grande crainte ». Cette formulation française en conserve la force sans produire une tournure artificielle.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le texte emploie le terme courant « les hommes ». Le contexte permet de les identifier comme les marins, mais cette précision n’est pas ajoutée au corps du texte.
- source_word: אֶת יְהוָה
  choice: de Yahweh
  rationale: Après « une grande crainte », le français exprime naturellement l’objet de cette crainte avec « de ». Le nom divin יהוה est transcrit « Yahweh » plutôt que remplacé par un titre.
- source_word: וַיִּזְבְּחוּ זֶבַח
  choice: Ils offrirent un sacrifice
  rationale: La combinaison du verbe et du nom de même champ lexical désigne idiomatiquement l’offrande d’un sacrifice. La traduction est naturelle et maintient le sens cultuel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique ici le destinataire ou celui à qui le sacrifice est consacré.
- source_word: וַיִּדְּרוּ נְדָרִים
  choice: firent des vœux
  rationale: Cette association verbale et nominale exprime des engagements solennels. « Faire des vœux » est l’expression française usuelle, sans ajouter une qualification absente de l’hébreu.
theological_decisions:
- issue: Nuance de la crainte envers Yahweh
  choice: furent saisis d’une grande crainte de Yahweh
  alternative: eurent très peur de Yahweh ; éprouvèrent un profond respect pour Yahweh
  rationale: Dans ce contexte, ירא peut évoquer à la fois l’effroi et la crainte révérencielle. La formulation retenue ne réduit pas cette réaction à la seule terreur ni au seul respect religieux, et la suite — sacrifice et vœux — garde toute sa portée.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte hébreu emploie le nom divin personnel. Sa transcription le distingue d’un simple titre et suit ici la forme de référence du projet.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « furent saisis d’une grande crainte » restitue l’intensité de l’hébreu tout en restant naturelle. Les propositions courtes conservent la progression narrative et la réaction cultuelle des hommes.
