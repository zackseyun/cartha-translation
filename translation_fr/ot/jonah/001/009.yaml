  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם עִבְרִ֣י אָנֹ֑כִי וְ/אֶת יְהוָ֞ה אֱלֹהֵ֤י הַ/שָּׁמַ֨יִם֙ אֲנִ֣י יָרֵ֔א אֲשֶׁר עָשָׂ֥ה אֶת הַ/יָּ֖ם וְ/אֶת הַ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/009.yaml
  text: He said to them[a], “I am a Hebrew, and I fear Yahweh, the God of heaven[b], who made the sea and the dry land.”
translation:
  language: fr
  text: 'Il leur dit : « Je suis hébreu et je crains[a] Yahweh[b], le Dieu du ciel, qui a fait la mer et la terre ferme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je révère » ou « j’adore ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « YHWH », nom divin traditionnellement rendu par « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Il leur dit
  rationale: Cette formulation rend naturellement la proposition narrative hébraïque sans alourdir le français par un « Et » initial peu nécessaire.
- source_word: עִבְרִי
  choice: hébreu
  rationale: C’est l’appellation ethnique courante en français. Employé comme adjectif attribut, le mot prend ici une minuscule selon l’usage français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: le Dieu du ciel
  rationale: Bien que שָׁמַיִם soit de forme plurielle en hébreu, « le Dieu du ciel » est l’équivalent idiomatique naturel en français.
- source_word: יָרֵא
  choice: je crains
  rationale: « Craindre » est l’équivalent lexical direct et préserve la tension entre la profession de Jonas et sa conduite, tout en laissant ouverte la nuance de révérence ou de culte.
- source_word: עָשָׂה
  choice: a fait
  rationale: Le verbe courant « faire » correspond directement à עָשָׂה sans introduire la nuance plus spécifique de « créer ».
- source_word: הַיָּם
  choice: la mer
  rationale: C’est le rendu normal du terme et il convient précisément au cadre maritime du récit.
- source_word: הַיַּבָּשָׁה
  choice: la terre ferme
  rationale: Cette expression désigne naturellement le sol sec par opposition à la mer et maintient le contraste hébreu.
- source_word: אָנֹכִי ... אֲנִי
  choice: Je suis… et je crains
  rationale: La répétition explicite de « je » dans les deux propositions reflète naturellement les deux pronoms hébreux et leur insistance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de le remplacer par le titre traditionnel « le Seigneur ».
- issue: Valeur de יָרֵא dans la déclaration de Jonas
  choice: je crains
  alternative: je révère ; j’adore
  rationale: « Je crains » préserve la portée première du verbe et l’ironie théologique du contexte. Les autres nuances possibles sont signalées en note plutôt que choisies dans le corps du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste proche de la structure hébraïque tout en évitant les tournures artificielles. Les ambiguïtés lexicales et la tension théologique sont conservées plutôt que résolues.
