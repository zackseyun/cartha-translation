  text: וַֽ/יהוָ֗ה הֵטִ֤יל רֽוּחַ גְּדוֹלָה֙ אֶל הַ/יָּ֔ם וַ/יְהִ֥י סַֽעַר גָּד֖וֹל בַּ/יָּ֑ם וְ/הָ֣/אֳנִיָּ֔ה חִשְּׁבָ֖ה לְ/הִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/004.yaml
  text: But Yahweh hurled a great wind onto the sea[a], and there was a great storm on the sea[b], so that the ship seemed about to be broken up.
translation:
  language: fr
  text: Mais Yahweh lança un grand vent sur la mer, et il y eut une grande tempête sur la mer ; le navire semblait sur le point de se briser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le navire pensait se briser » ; l’hébreu personnifie le navire pour exprimer qu’il était sur le point de se disloquer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Mais Yahweh
  rationale: Le waw prend ici naturellement une nuance adversative après la fuite de Jonas. Le nom divin est transcrit « Yahweh », conformément à sa présence explicite dans l’hébreu.
- source_word: הֵטִיל
  choice: lança
  rationale: Le verbe exprime un geste énergique de projection. « Lança » garde cette force et reste naturel avec « vent » en français.
- source_word: רוּחַ גְּדוֹלָה
  choice: un vent violent
  rationale: Dans ce contexte maritime, רוּחַ désigne clairement le vent. « Violent » rend ici la grandeur en intensité et s’accorde idiomatiquement avec « vent ».
- source_word: אֶל הַיָּם
  choice: sur la mer
  rationale: Avec le verbe de projection, אֶל marque la direction vers la mer; « sur la mer » exprime naturellement en français le déchaînement du vent à sa surface.
- source_word: וַיְהִי סַעַר גָּדוֹל
  choice: et une violente tempête s’éleva
  rationale: La tournure rend l’apparition résultante de la tempête en français courant et digne. La répétition de « violent » reflète celle de גָּדוֹל dans le texte hébreu.
- source_word: בַּיָּם
  choice: sur la mer
  rationale: Cette expression situe la tempête dans l’espace maritime, avec une formulation française directe.
- source_word: וְהָאֳנִיָּה
  choice: Le navire, lui
  rationale: La dislocation avec « lui » marque le passage à la conséquence subie par le navire sans imposer un lien logique plus précis que celui du contexte.
- source_word: חִשְּׁבָה
  choice: semblait
  rationale: Littéralement, le navire « pensait » se briser. « Semblait » transmet le sens contextuel tout en signalant en note la personnification hébraïque.
- source_word: לְהִשָּׁבֵר
  choice: sur le point de se briser
  rationale: Le nifal exprime ici le fait de se rompre ou d’être brisé; la construction avec חִשְּׁבָה indique une issue imminente.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. Sa transcription préserve explicitement ce nom sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. « Navire » convient au contexte maritime; « se briser » reste clair sans technicité. La répétition « violent… violente » conserve l’insistance de l’hébreu.
