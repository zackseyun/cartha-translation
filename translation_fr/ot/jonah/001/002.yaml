id: JON.1.2
reference: Jonah 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֠וּם לֵ֧ךְ אֶל נִֽינְוֵ֛ה הָ/עִ֥יר הַ/גְּדוֹלָ֖ה וּ/קְרָ֣א עָלֶ֑י/הָ כִּֽי עָלְתָ֥ה רָעָתָ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/002.yaml
  text: Arise[a], go to Nineveh, the great city, and cry out against it[b], because their evil has come up before me.
translation:
  language: fr
  text: Lève-toi, va à Ninive, la grande ville, et crie contre elle[a], car leur méchanceté[b] est montée jusqu’à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « proclame à son sujet ». La tournure hébraïque peut avoir un sens plus général, mais le contexte favorise ici l’idée d’une proclamation dirigée contre Ninive.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur mal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֠וּם
  choice: Lève-toi
  rationale: L’impératif rend l’ordre prophétique brusque et énergique, tout en restant naturel en français actuel.
- source_word: לֵ֧ךְ
  choice: va
  rationale: Équivalent direct et idiomatique de l’impératif de הלך dans ce contexte de mission.
- source_word: נִֽינְוֵ֛ה
  choice: Ninive
  rationale: Forme française conventionnelle du nom propre.
- source_word: הָעִיר הַגְּדוֹלָה
  choice: la grande ville
  rationale: Conserve l’apposition et la portée possible de « grande », qui peut évoquer aussi bien les dimensions que l’importance.
- source_word: וּקְרָא עָלֶיהָ
  choice: et crie contre elle
  rationale: קרא exprime ici une proclamation publique et pressante; avec על et la mention de la méchanceté de Ninive, le sens adversatif est le plus probable. La note préserve toutefois la lecture plus générale.
- source_word: רָעָתָם
  choice: leur méchanceté
  rationale: Dans ce contexte d’accusation divine, רעה désigne le mal moral. « Méchanceté » est plus clairement moral que le terme français polysémique « mal ».
- source_word: עָלְתָה ... לְפָנָי
  choice: est montée jusqu’à moi
  rationale: Cette formulation naturelle conserve l’image verticale du mal qui monte dans la présence et à la connaissance de Dieu.
theological_decisions:
- issue: Portée de וּקְרָא עָלֶיהָ
  choice: Une dénonciation dirigée contre Ninive
  alternative: Une proclamation au sujet de Ninive, sans force explicitement hostile
  rationale: La construction קרא על, éclairée par la proposition causale qui suit, favorise une annonce de jugement. La traduction principale retient cette force sans préciser le contenu du jugement, tandis que la note signale l’ambiguïté syntaxique réelle.
- issue: Sens de רָעָתָם
  choice: Le mal moral des habitants de Ninive
  alternative: Leur malheur ou la calamité qui les frappe
  rationale: Le mal est présenté comme la raison de l’intervention divine et comme quelque chose qui monte devant Dieu; le contexte soutient donc nettement le sens moral, sans imposer une qualification confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Lève-toi » garde la vigueur de l’appel prophétique; « crie contre elle » conserve à la fois la dimension publique de la proclamation et sa force accusatrice. Les pronoms passent naturellement du singulier pour la ville (« elle ») au pluriel pour ses habitants (« leur »), comme dans l’hébreu.
