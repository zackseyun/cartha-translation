  text: וַ/יִּקְרְא֨וּ אֶל יְהוָ֜ה וַ/יֹּאמְר֗וּ אָנָּ֤ה יְהוָה֙ אַל נָ֣א נֹאבְדָ֗ה בְּ/נֶ֨פֶשׁ֙ הָ/אִ֣ישׁ הַ/זֶּ֔ה וְ/אַל תִּתֵּ֥ן עָלֵ֖י/נוּ דָּ֣ם נָקִ֑יא כִּֽי אַתָּ֣ה יְהוָ֔ה כַּ/אֲשֶׁ֥ר חָפַ֖צְתָּ עָשִֽׂיתָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/014.yaml
  text: Then they cried out to Yahweh and said[a], “Please, Yahweh, do not let us perish on account of this man's life, and do not put innocent blood on us, for you, Yahweh[b], have done as you pleased.”
translation:
  language: fr
  text: 'Alors ils crièrent vers Yahweh et dirent : « De grâce, Yahweh, ne nous laisse pas périr pour la vie de cet homme[a], et ne mets pas à notre charge le sang innocent[b], car toi, Yahweh, tu as agi comme tu l’as voulu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque peut aussi se comprendre : « pour avoir ôté la vie à cet homme » ou « à cause de cet homme ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne nous rends pas coupables d’avoir versé le sang d’un innocent » ; littéralement, « ne mets pas sur nous du sang innocent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל יְהוָה
  choice: ils crièrent vers Yahweh
  rationale: Le tour קרא אל exprime ici un appel pressant adressé à Dieu. « Crièrent vers » conserve l’urgence et la direction de cet appel sans le réduire au terme plus général « prièrent ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: אָנָּה
  choice: De grâce
  rationale: La particule introduit une supplication insistante. « De grâce » est naturel, digne et plus chargé d’urgence que le simple « s’il te plaît ».
- source_word: אַל נָא נֹאבְדָה
  choice: ne nous laisse pas périr
  rationale: Le cohortatif sous négation exprime la demande de ne pas connaître la ruine. Cette formulation reste naturelle sans préciser excessivement la causalité divine.
- source_word: בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: à cause de la vie de cet homme
  rationale: 'נפש désigne ici la vie de l’homme. La formulation conserve ce terme tout en laissant ouverte la nuance : périr à cause de sa vie ou pour lui avoir ôté la vie.'
- source_word: וְאַל תִּתֵּן עָלֵינוּ דָּם נָקִיא
  choice: et ne mets pas à notre charge le sang innocent
  rationale: Cette expression française garde l’image juridique de quelque chose placé sur eux, tout en rendant intelligible l’idée de responsabilité pour le sang versé.
- source_word: כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ
  choice: tu as fait ce qui te plaisait
  rationale: La traduction rend l’action accomplie et la liberté du vouloir divin sans importer une terminologie théologique ultérieure.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; conserver « Yahweh » maintient le caractère personnel du nom divin.
- issue: Degré d’explicitation de la culpabilité liée au sang
  choice: ne mets pas à notre charge le sang innocent
  alternative: ne nous tiens pas pour coupables d’avoir versé le sang d’un innocent
  rationale: Le choix principal préserve l’image et la tension juridique de l’hébreu. L’alternative explicite davantage la culpabilité, mais ajoute des éléments seulement implicites.
- issue: Sens de בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: à cause de la vie de cet homme
  alternative: pour avoir ôté la vie à cet homme
  rationale: Le texte peut viser la vie de Jonas comme cause de leur perte ou leur responsabilité s’ils la lui ôtent. Le texte principal conserve cette ambiguïté, précisée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit; « de grâce » marque la supplication sans archaïsme excessif. Les deux notes sont placées après les expressions auxquelles elles se rapportent.
