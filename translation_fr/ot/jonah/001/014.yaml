revisions:
- from: 'Alors ils crièrent vers Yahweh et dirent : « De grâce, Yahweh, ne nous laisse pas périr à cause de la vie de cet homme[a], et ne mets pas à notre charge le sang innocent[b], car toi, Yahweh, tu as fait ce qui te plaisait. »'
  to: 'Alors ils crièrent vers Yahweh et dirent : « De grâce, Yahweh, ne nous laisse pas périr pour la vie de cet homme[a], et ne mets pas à notre charge le sang innocent[b], car toi, Yahweh, tu as agi comme tu l’as voulu. »'
  rationale: La révision remplace une tournure française qui obscurcissait la portée de « vie » par « pour la vie de cet homme », expression qui conserve l’ambiguïté du texte hébreu, explicitée en note. Elle remplace aussi « tu as fait ce qui te plaisait » par une formulation qui reflète plus directement « comme tu l’as voulu ». Les ancres et le contenu des notes restent correctement associés aux expressions concernées.
