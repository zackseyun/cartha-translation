  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל יוֹנָ֥ה בֶן אֲמִתַּ֖י לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/001.yaml
  text: The word of Yahweh came to Jonah son of Amittai[a], saying[b],
translation:
  language: fr
  text: La parole de Yahweh[a] fut adressée à Jonas, fils d’Amittaï, en ces termes :[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte le nom divin יהוה (YHWH), rendu ici par « Yahweh ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « Et il arriva que la parole de Yahweh fut adressée à Jonas, fils d’Amittaï, pour dire ». La tournure hébraïque sert à ouvrir le récit et à introduire les paroles du verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: La construction ouvre couramment un récit hébreu. Plutôt que de reproduire lourdement « Et il arriva que », le français intègre sa fonction narrative à la proposition principale.
- source_word: דְּבַר יְהוָה
  choice: La parole de Yahweh
  rationale: « Parole » conserve le sens concret de דָּבָר ainsi que la formule prophétique traditionnelle et ses résonances intertextuelles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le distinguer d’un titre comme « le Seigneur ».
- source_word: אֶל יוֹנָה
  choice: à Jonas
  rationale: La préposition אֶל désigne ici le destinataire de la révélation; « à » est l’équivalent français naturel.
- source_word: בֶן אֲמִתַּי
  choice: fils d’Amittaï
  rationale: Le patronyme hébreu est rendu directement, avec la graphie française usuelle des noms.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule introduit les paroles divines qui suivent. Les deux-points et « en ces termes » rendent naturellement ce lien en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le Tétragramme comme nom propre. « Yahweh » le représente directement sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la formule prophétique « la parole de Yahweh » tout en évitant le calque pesant de l’ouverture narrative hébraïque.
