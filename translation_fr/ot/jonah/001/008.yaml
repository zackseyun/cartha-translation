id: JON.1.8
reference: Jonah 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הַגִּידָ/ה נָּ֣א לָ֔/נוּ בַּ/אֲשֶׁ֛ר לְ/מִי הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ מַה מְּלַאכְתְּ/ךָ֙ וּ/מֵ/אַ֣יִן תָּב֔וֹא מָ֣ה אַרְצֶ֔/ךָ וְ/אֵֽי מִ/זֶּ֥ה עַ֖ם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/008.yaml
  text: Then they said to him[a], “Please tell us on whose account this trouble has come upon us. What is your occupation, and where do you come from? What is your land[b], and from what people are you?”
translation:
  language: fr
  text: 'Alors ils lui dirent : « Dis-nous, s’il te plaît, à cause de qui ce malheur nous arrive[a]. Quel est ton métier et d’où viens-tu ? Quel est ton pays[b], et de quel peuple es-tu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en raison de qui ce malheur est pour nous ». Le mot hébreu רָעָה désigne ici le malheur ou le désastre qui menace les marins, pas nécessairement un mal moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Quelle est ta terre ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Alors ils lui dirent
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français.
- source_word: הַגִּידָה נָּא לָנוּ
  choice: Dis-nous, s’il te plaît
  rationale: Le hiphil de נגד signifie « dire, déclarer, faire savoir », et נָא donne à la demande une nuance de politesse ou d’insistance.
- source_word: בַּאֲשֶׁר לְמִי הָרָעָה הַזֹּאת לָנוּ
  choice: à cause de qui ce malheur nous arrive
  rationale: La formulation demande qui est à l’origine de la situation menaçante. רָעָה désigne ici un malheur ou un désastre, sans impliquer nécessairement un mal moral.
- source_word: מַה מְּלַאכְתְּךָ
  choice: Quel est ton métier
  rationale: מְלָאכָה peut désigner le travail, l’activité ou le métier d’une personne. « Métier » convient naturellement à cette série de questions sur l’identité de Jonas.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: et d’où viens-tu
  rationale: מֵאַיִן interroge sur l’origine ou la provenance. Cette tournure est directe et idiomatique en français.
- source_word: מָה אַרְצֶךָ
  choice: Quel est ton pays
  rationale: אֶרֶץ peut signifier « terre » ou « pays ». Dans une question portant sur l’origine, « pays » est le choix français le plus naturel sans imposer l’idée moderne d’un État-nation.
- source_word: וְאֵי מִזֶּה עַם אָתָּה
  choice: et de quel peuple es-tu
  rationale: עַם désigne un peuple ou un groupe national. La formulation française conserve la distinction entre le pays et l’appartenance à un peuple.
theological_decisions: []
