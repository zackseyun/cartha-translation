source:
  edition: WLC
  text: וַ/יִּשְׂאוּ֙ אֶת יוֹנָ֔ה וַ/יְטִלֻ֖/הוּ אֶל הַ/יָּ֑ם וַ/יַּעֲמֹ֥ד הַ/יָּ֖ם מִ/זַּעְפּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/015.yaml
  text: So they picked up Jonah and threw him into the sea[a], and the sea ceased from its raging.
translation:
  language: fr
  text: Alors ils soulevèrent Jonas et le jetèrent à la mer, et la mer cessa de faire rage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: ils soulevèrent
  rationale: Le verbe נשׂא décrit ici l’action concrète de prendre Jonas en le levant avant de le jeter par-dessus bord. « Soulevèrent » reste naturel tout en conservant cette nuance.
- source_word: וַיְטִלֻהוּ
  choice: le jetèrent
  rationale: Le verbe טול signifie jeter ou lancer. « Jetèrent » est le terme courant et précis, sans ajouter une violence que le verbe n’impose pas à lui seul.
- source_word: אֶל הַיָּם
  choice: à la mer
  rationale: Après « jeter » et à propos d’une personne passée par-dessus bord, « jeter à la mer » est l’expression française idiomatique et indique clairement le mouvement vers l’intérieur de la mer.
- source_word: וַיַּעֲמֹד הַיָּם
  choice: la mer cessa
  rationale: עמד signifie littéralement « se tenir, s’arrêter ». Dans ce contexte, il exprime la cessation de l’agitation de la mer; « cessa » rend cette valeur sans réduire l’image à la seule idée de calme.
- source_word: מִזַּעְפּוֹ
  choice: de déchaîner sa fureur
  rationale: זעף évoque la fureur ou l’agitation violente. Cette formulation française conserve la personnification énergique de la mer et s’accorde naturellement avec « cessa ».
theological_decisions:
- issue: Personnification de la violence de la mer
  choice: Conserver la fureur personnifiée de la mer dans « la mer cessa de déchaîner sa fureur »
  alternative: la mer se calma
  rationale: 'Le texte hébreu ne présente pas seulement un changement météorologique: il attribue à la mer une זעף, une fureur violente. La traduction maintient cette force littéraire sans lui ajouter de portée doctrinale.'
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique écrit. La formulation reste proche de l’enchaînement hébreu tout en étant idiomatique en français.
