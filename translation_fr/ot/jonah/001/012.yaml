base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/012.yaml
  text: And he said to them[a], “Pick me up and throw me into the sea, and the sea will become calm for you[c][b], for I know that this great storm is upon you because of me.”
translation:
  language: fr
  text: 'Il leur dit : « Prenez-moi et jetez-moi dans la mer ; alors la mer se calmera pour vous, car je sais que c’est à cause de moi que cette grande tempête s’abat sur vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: Prenez-moi
  rationale: Dans ce contexte, נשׂא désigne l’action de saisir et soulever Jonas pour le jeter par-dessus bord. « Prenez-moi » est naturel en français et implique suffisamment ce geste concret.
- source_word: וַהֲטִילֻנִי
  choice: jetez-moi
  rationale: Le hifil de טול signifie « jeter, lancer ». « Jetez-moi » est direct, courant et adapté au contexte.
- source_word: הַיָּם
  choice: la mer
  rationale: יָם signifie normalement « mer » ; « océan » préciserait excessivement le référent.
- source_word: וְיִשְׁתֹּק
  choice: se calmera
  rationale: Le verbe signifie littéralement « se taire, rester silencieux ». Appliqué à une mer agitée, il exprime naturellement la fin de l’agitation.
- source_word: מֵעֲלֵיכֶם
  choice: autour de vous
  rationale: L’expression signifie littéralement « de dessus vous ». Dans ce contexte maritime, « autour de vous » rend naturellement l’idée que la mer cessera de les assaillir, sans reproduire un calque obscur.
- source_word: יוֹדֵעַ אָנִי
  choice: je sais
  rationale: Le participe accompagné du pronom affirme nettement la connaissance de Jonas. « Je sais » rend cette affirmation sans emphase artificielle.
- source_word: בְשֶׁלִּי
  choice: à cause de moi
  rationale: La locution exprime ici la cause et la responsabilité personnelle de Jonas.
- source_word: הַסַּעַר הַגָּדוֹל הַזֶּה
  choice: cette violente tempête
  rationale: סַעַר désigne une tempête et גָּדוֹל en souligne l’ampleur. En français contemporain, « violente » exprime naturellement la grande intensité de la tempête.
- source_word: עֲלֵיכֶם
  choice: s’est abattue sur vous
  rationale: La préposition עַל présente la tempête comme étant sur les marins. « S’est abattue sur vous » conserve cette image en français idiomatique.
theological_decisions:
- issue: L’aveu de responsabilité de Jonas
  choice: Jonas reconnaît explicitement que la tempête s’est abattue sur les marins à cause de lui.
  alternative: Jonas signalerait seulement un lien avec lui, sans reconnaître directement sa responsabilité.
  rationale: La locution causale בְשֶׁלִּי indique clairement que Jonas se présente comme la cause de la tempête ; la traduction ne doit pas atténuer cet aveu.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste bref et pressant. La tournure littérale inhabituelle de מֵעֲלֵיכֶם est conservée en note plutôt que calquée dans le texte.
