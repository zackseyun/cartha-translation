revisions:
- from: 'Il leur dit : « Prenez-moi et jetez-moi à la mer. Alors la mer se calmera autour de vous[a], car je sais que c’est à cause de moi que cette violente tempête s’est abattue sur vous. »'
  to: 'Il leur dit : « Prenez-moi et jetez-moi dans la mer ; alors la mer se calmera pour vous, car je sais que c’est à cause de moi que cette grande tempête s’abat sur vous. »'
  rationale: La révision rétablit l’aspect non accompli de la tempête, conserve « grande » pour גָּדוֹל et rend l’effet de מֵעֲלֵיכֶם en français courant sans perdre la formulation littérale, qui demeure signalée en note.
