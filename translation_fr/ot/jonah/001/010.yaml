    text: 'Plus littéralement : « les hommes craignirent une grande crainte ».'
    reason: L’hébreu emploie un verbe et un nom de même racine afin d’intensifier la peur.
  revision_rationale: La révision retire l’ajout interprétatif « loin de », remplace le déictique spatial « là » par une question française neutre, et rend la note plus proche de la construction cognate hébraïque. Le plus-que-parfait final conserve l’antériorité contextuelle exprimée naturellement en français.
