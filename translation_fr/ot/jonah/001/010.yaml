base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/010.yaml
  text: Then the men were greatly afraid[a], and they said to him, “What is this that you have done?” For the men knew that he was fleeing from the presence of Yahweh, because he had told them.
translation:
  language: fr
  text: 'Alors les hommes furent saisis d’une grande peur[a] et lui dirent : « Qu’est-ce que tu as fait ? » Car ils savaient qu’il fuyait la présence de Yahweh, parce qu’il le leur avait dit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les hommes craignirent une grande crainte ».'
    reason: L’hébreu emploie un verbe et un nom de même racine afin d’intensifier la peur.
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: furent saisis d’une grande peur
  rationale: Le cognat hébreu renforce l’intensité. Cette formulation française reste naturelle tout en conservant la force de l’expression.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le terme désigne littéralement les hommes; bien que le contexte les identifie comme des marins, le texte emploie ici le nom courant.
- source_word: מַה זֹּאת עָשִׂיתָ
  choice: Qu’est-ce que tu as fait là ?
  rationale: Le « là » rend naturellement en français la valeur expressive du démonstratif hébreu, sans transformer la question en « Pourquoi ? ».
- source_word: מִלִּפְנֵי יְהוָה
  choice: loin de la présence de Yahweh
  rationale: Cette expression conserve l’idée de fuite hors de la présence de Dieu et son ironie théologique, dans un français intelligible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בֹרֵחַ
  choice: fuyait
  rationale: L’imparfait français rend l’action en cours exprimée par le participe hébreu.
- source_word: כִּי ... כִּי
  choice: en effet ... car
  rationale: Les deux occurrences ont des fonctions explicatives distinctes; les différencier produit un enchaînement naturel en français.
- source_word: הִגִּיד לָהֶם
  choice: il le leur avait dit
  rationale: Le plus-que-parfait marque que Jonas les avait informés avant leur réaction et leur question.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct est naturel, et la répétition « les hommes » est allégée dans la seconde phrase sans perte de référent.
