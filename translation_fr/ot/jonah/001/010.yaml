revisions:
- from: 'Alors les hommes furent saisis d’une grande peur[a] et lui dirent : « Qu’est-ce que tu as fait là ? » Ils savaient en effet qu’il fuyait loin de la présence de Yahweh, car il le leur avait dit.'
  to: 'Alors les hommes furent saisis d’une grande peur[a] et lui dirent : « Qu’est-ce que tu as fait ? » Car ils savaient qu’il fuyait la présence de Yahweh, parce qu’il le leur avait dit.'
  rationale: La révision retire l’ajout interprétatif « loin de », remplace le déictique spatial « là » par une question française neutre, et rend la note plus proche de la construction cognate hébraïque. Le plus-que-parfait final conserve l’antériorité contextuelle exprimée naturellement en français.
  reviewer_model: gpt-5.6-terra
