  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ מַה נַּ֣עֲשֶׂה לָּ֔/ךְ וְ/יִשְׁתֹּ֥ק הַ/יָּ֖ם מֵֽ/עָלֵ֑י/נוּ כִּ֥י הַ/יָּ֖ם הוֹלֵ֥ךְ וְ/סֹעֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/011.yaml
  text: Then they said to him[b][a], “What should we do to you so that the sea may quiet down for us?” For the sea was growing more and more stormy.
translation:
  language: fr
  text: 'Ils lui dirent alors : « Que devons-nous te faire pour que la mer se calme autour de nous[a] ? » En effet, la mer devenait de plus en plus déchaînée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de dessus nous », image saisissante de la mer qui pèse sur eux et les menace.'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « allait et tempêtait », c’est-à-dire qu’elle se déchaînait toujours davantage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָּךְ
  choice: Que devons-nous te faire
  rationale: Cette formulation conserve l’action dirigée vers Jonas exprimée par לָּךְ et la valeur délibérative de l’imparfait, tout en restant naturelle en français.
- source_word: וְיִשְׁתֹּק
  choice: pour que ... se calme
  rationale: Le verbe שתק signifie « être tranquille, silencieux ». Appliqué à la mer, « se calme » est idiomatique; « pour que » explicite la valeur finale du waw dans cette question.
- source_word: הַיָּם
  choice: la mer
  rationale: Équivalent français courant de יָם dans ce récit.
- source_word: מֵעָלֵינוּ
  choice: autour de nous
  rationale: Le sens littéral est « de dessus nous ». « Autour de nous » rend naturellement la menace immédiate que la mer fait peser sur les marins sans reproduire un calque français obscur; la note conserve l’image hébraïque.
- source_word: כִּי
  choice: En effet
  rationale: Introduit l’explication de l’urgence de leur question. « En effet » assure un enchaînement naturel en français.
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: devenait de plus en plus déchaînée
  rationale: La construction הוֹלֵךְ suivi du participe marque une progression continue. Cette traduction restitue à la fois l’intensification et la violence de la mer.
