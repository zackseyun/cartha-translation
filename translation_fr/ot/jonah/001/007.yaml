source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ לְכוּ֙ וְ/נַפִּ֣ילָה גֽוֹרָל֔וֹת וְ/נֵ֣דְעָ֔ה בְּ/שֶׁ/לְּ/מִ֛י הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ וַ/יַּפִּ֨לוּ֙ גּֽוֹרָל֔וֹת וַ/יִּפֹּ֥ל הַ/גּוֹרָ֖ל עַל יוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/007.yaml
  text: And they said[a], each man to his companion, “Come, let us cast lots, so that we may know on whose account this evil has come upon us.” So they cast lots, and the lot fell on Jonah.
translation:
  language: fr
  text: 'Ils se dirent les uns aux autres : « Venez, tirons au sort afin de savoir à cause de qui ce malheur[a] nous arrive. » Ils tirèrent donc au sort, et le sort tomba sur Jonas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce mal » ou « ce désastre ». Le mot hébreu peut désigner le mal, le malheur ou une catastrophe selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: les uns aux autres
  rationale: Cette tournure française naturelle rend l’expression distributive hébraïque, qui décrit les hommes se parlant mutuellement, sans produire le calque peu idiomatique « chacun à son compagnon ».
- source_word: לְכוּ
  choice: Venez
  rationale: Bien que le verbe signifie littéralement « aller », il sert ici d’exhortation introduisant une action commune. « Venez » en restitue naturellement la force en français.
- source_word: וְנַפִּילָה גוֹרָלוֹת
  choice: tirons au sort
  rationale: Le cohortatif exprime une proposition collective. « Tirer au sort » est l’expression française courante correspondant à cette pratique.
- source_word: וְנֵדְעָה
  choice: afin de savoir
  rationale: Dans ce contexte, la conjonction suivie du cohortatif indique le but recherché par le tirage au sort.
- source_word: בְּשֶׁלְּמִי
  choice: à cause de qui
  rationale: Cette expression restitue clairement le rapport causal recherché, sans ajouter une qualification morale explicite de la personne responsable.
- source_word: הָרָעָה הַזֹּאת
  choice: ce malheur
  rationale: Dans le contexte de la tempête, רָעָה désigne avant tout le mal subi, c’est-à-dire une calamité. « Malheur » est naturel en français, tandis qu’une note conserve l’éventail sémantique du terme hébreu.
- source_word: לָנוּ
  choice: nous arrive
  rationale: L’hébreu présente une proposition sans verbe exprimé. « Nous arrive » explicite naturellement en français le rapport entre le malheur et les marins.
- source_word: וַיַּפִּלוּ גוֹרָלוֹת
  choice: Ils tirèrent donc au sort
  rationale: Le récit indique qu’ils mettent leur proposition à exécution. « Donc » marque naturellement cette conséquence.
- source_word: וַיִּפֹּל הַגּוֹרָל עַל יוֹנָה
  choice: le sort tomba sur Jonas
  rationale: Cette formulation française traditionnelle et intelligible conserve de près l’image et le résultat exprimés par l’hébreu.
theological_decisions:
- issue: Sens de רָעָה dans le contexte d’une calamité providentielle
  choice: ce malheur
  alternative: ce mal ; ce désastre
  rationale: Le mot hébreu peut désigner le mal moral, le dommage ou une catastrophe. Ici, les marins parlent de la détresse qui les frappe. « Malheur » communique ce sens contextuel sans nier l’ambiguïté lexicale, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct et énergique ; le vocabulaire courant rend le verset accessible sans effacer l’ambiguïté du terme רָעָה.
