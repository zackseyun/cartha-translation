source:
  edition: WLC
  text: וַ/יַּחְתְּר֣וּ הָ/אֲנָשִׁ֗ים לְ/הָשִׁ֛יב אֶל הַ/יַּבָּשָׁ֖ה וְ/לֹ֣א יָכֹ֑לוּ כִּ֣י הַ/יָּ֔ם הוֹלֵ֥ךְ וְ/סֹעֵ֖ר עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/013.yaml
  text: But the men rowed hard to return to the dry land[a], but they could not[c][b], because the sea kept growing more and more stormy against them.
translation:
  language: fr
  text: Mais les hommes ramèrent de toutes leurs forces pour regagner la terre ferme[a] ; ils n’y parvinrent pas, car la mer se déchaînait de plus en plus contre eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour revenir jusqu’au rivage ». Le verbe traduit par « ramèrent de toutes leurs forces » signifie littéralement « creuser » ; dans ce contexte maritime, il évoque l’effort vigoureux des rameurs.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque indique que la mer devenait toujours plus violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְתְּרוּ
  choice: ramèrent de toutes leurs forces
  rationale: Le verbe signifie littéralement « creuser », mais, dans ce contexte maritime, il décrit l’effort intense des hommes aux rames. Cette formulation conserve à la fois l’action concrète et son intensité.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le texte emploie le nom courant « hommes », et non un terme technique désignant des marins.
- source_word: לְהָשִׁיב אֶל הַיַּבָּשָׁה
  choice: pour regagner la terre ferme
  rationale: Dans ce contexte, la forme causative de שוב exprime le mouvement de retour vers la terre ; « regagner » est naturel en français, tandis que « la terre ferme » préserve l’image explicite de יבשה.
- source_word: וְלֹא יָכֹלוּ
  choice: ils n’y parvinrent pas
  rationale: Cette expression rend clairement leur incapacité à atteindre le but qu’ils poursuivaient.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la cause de leur échec.
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: se déchaînait de plus en plus
  rationale: 'La construction avec הוֹלֵךְ et le participe marque une progression : la violence de la mer allait croissant.'
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: La préposition présente ici la mer comme une force hostile dirigée contre les hommes.
