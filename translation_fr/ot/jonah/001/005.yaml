source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ הַ/מַּלָּחִ֗ים וַֽ/יִּזְעֲקוּ֮ אִ֣ישׁ אֶל אֱלֹהָי/ו֒ וַ/יָּטִ֨לוּ אֶת הַ/כֵּלִ֜ים אֲשֶׁ֤ר בָּֽ/אֳנִיָּה֙ אֶל הַ/יָּ֔ם לְ/הָקֵ֖ל מֵֽ/עֲלֵי/הֶ֑ם וְ/יוֹנָ֗ה יָרַד֙ אֶל יַרְכְּתֵ֣י הַ/סְּפִינָ֔ה וַ/יִּשְׁכַּ֖ב וַ/יֵּרָדַֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/005.yaml
  text: Then the sailors were afraid[a], and each cried out to his god. They threw the cargo that was in the ship into the sea to lighten it for themselves. But Yonah had gone down into the innermost parts of the vessel[b], and he lay down and fell fast asleep.
translation:
  language: fr
  text: Alors les marins prirent peur et chacun cria vers son dieu. Ils jetèrent à la mer les objets[a] qui se trouvaient dans le navire, afin d’alléger le navire. Mais Jonas était descendu au fond du bateau[b] ; il s’était couché et dormait profondément.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le matériel » ou « les biens ». Le terme hébreu est général ; dans ce contexte, il désigne ce qui pouvait être jeté par-dessus bord pour alléger le navire.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les parties les plus reculées du bateau » ou « dans la cale ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הַמַּלָּחִים
  choice: les marins prirent peur
  rationale: « Prirent peur » rend naturellement la réaction soudaine exprimée par ירא dans ce contexte de danger, tandis que « marins » est l’équivalent moderne précis de מַלָּחִים.
- source_word: וַיִּזְעֲקוּ אִישׁ אֶל אֱלֹהָיו
  choice: chacun cria vers son dieu
  rationale: זעק exprime un cri de détresse; אִישׁ a ici une valeur distributive, et le suffixe singulier indique que chaque marin s’adresse à sa propre divinité.
- source_word: הַכֵּלִים
  choice: les objets
  rationale: כֵּלִים est un terme large pouvant désigner des objets, du matériel ou des biens. « Objets » préserve cette largeur sans imposer le sens plus précis de « cargaison ».
- source_word: אֶל הַיָּם
  choice: à la mer
  rationale: Avec « jeter », l’expression française idiomatique « jeter à la mer » rend clairement le mouvement exprimé par אֶל.
- source_word: לְהָקֵל מֵעֲלֵיהֶם
  choice: afin de l’alléger
  rationale: Le verbe הקל signifie rendre plus léger. Le pronom renvoie naturellement au navire; la relation exprimée par מֵעֲלֵיהֶם est idiomatiquement implicite en français et signifie qu’ils cherchent à réduire ce qui pèse sous eux.
- source_word: יָרַד אֶל יַרְכְּתֵי הַסְּפִינָה
  choice: était descendu au fond du bateau
  rationale: Le plus-que-parfait présente l’action comme antérieure à la scène des marins. יַרְכְּתֵי désigne les parties reculées ou profondes; « au fond » conserve cette image spatiale sans introduire un terme nautique trop technique.
- source_word: וַיִּשְׁכַּב וַיֵּרָדַם
  choice: il s’était couché et dormait profondément
  rationale: שכב indique qu’il s’est couché, tandis que רדם évoque un sommeil profond. La formulation française rend l’état résultant et le contraste narratif avec l’agitation des marins.
theological_decisions:
- issue: Référence à la divinité païenne אֱלֹהָיו
  choice: son dieu
  alternative: ses dieux
  rationale: 'Le suffixe hébreu est singulier et אִישׁ est distributif: chaque marin invoque son propre dieu. La minuscule distingue ces divinités du Dieu d’Israël sans ajouter de jugement au texte.'
translation_notes:
  register: Français international moderne, narratif et digne. « Jonas » suit la forme française courante du nom biblique. Les deux termes nautiques hébreux sont rendus par « navire » puis « bateau » afin de conserver une légère variation sans suggérer une distinction technique certaine.
