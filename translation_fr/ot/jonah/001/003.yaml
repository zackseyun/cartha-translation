  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֤קָם יוֹנָה֙ לִ/בְרֹ֣חַ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָ֑ה וַ/יֵּ֨רֶד יָפ֜וֹ וַ/יִּמְצָ֥א אָנִיָּ֣ה בָּאָ֣ה תַרְשִׁ֗ישׁ וַ/יִּתֵּ֨ן שְׂכָרָ֜/הּ וַ/יֵּ֤רֶד בָּ/הּ֙ לָ/ב֤וֹא עִמָּ/הֶם֙ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/003.yaml
  text: But Jonah rose to flee to Tarshish from the presence of Yahweh[a]. He went down to Joppa and found a ship going to Tarshish. He paid its fare and went down into it to go with them to Tarshish[c][b], away from the presence of Yahweh.
translation:
  language: fr
  text: Mais Jonas se leva pour fuir vers Tarsis, loin de la présence de Yahvé[a]. Il descendit à Jaffa et trouva un navire qui allait à Tarsis[b]. Il paya son passage, puis y descendit[c] pour aller avec eux à Tarsis, loin de la présence de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « loin de Yahvé » ; littéralement : « loin de la présence de Yahvé ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut se rendre littéralement par « un navire venant à Tarsis » ; ici, elle indique que le navire avait Tarsis pour destination.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu répète ici le verbe « descendre ». Cette répétition contribue au mouvement descendant du récit dans ce chapitre.
    reason: literary_feature
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Conserve le sens concret de קום et la succession narrative, dans un français naturel.
- source_word: לִבְרֹחַ תַּרְשִׁישָׁה
  choice: pour fuir vers Tarsis
  rationale: ברח exprime la fuite, tandis que le ה directionnel indique un mouvement vers Tarsis.
- source_word: מִלִּפְנֵי יְהוָה
  choice: loin de la présence de Yahvé
  rationale: Préserve l’image hébraïque de la « présence » ou de la « face » de Yahvé, ainsi que l’ironie théologique de la tentative de Jonas.
- source_word: יָפוֹ
  choice: Jaffa
  rationale: Forme française moderne et largement reconnaissable du nom de la ville portuaire antique.
- source_word: אֳנִיָּה
  choice: navire
  rationale: Désigne naturellement un bâtiment destiné à la navigation maritime.
- source_word: בָּאָה תַרְשִׁישׁ
  choice: qui allait à Tarsis
  rationale: Dans ce contexte de destination, בוא décrit le mouvement du navire vers Tarsis; cette formulation est claire sans surinterpréter.
- source_word: שְׂכָרָהּ
  choice: le prix du passage
  rationale: שכר peut désigner le prix payé ou le coût du transport. Cette expression française évite l’ambiguïté de « son tarif » et reste naturelle.
- source_word: וַיֵּרֶד בָּהּ
  choice: puis y descendit
  rationale: Conserve la répétition significative de ירד, plutôt que de l’aplanir par « embarqua ».
- source_word: לָבוֹא עִמָּהֶם
  choice: pour aller avec eux
  rationale: Rend directement l’infinitif et le groupe prépositionnel selon le point de vue naturel en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Rend le nom divin personnel sous sa forme française traditionnelle et reconnaissable, plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Sens de מִלִּפְנֵי יְהוָה
  choice: loin de la présence de Yahvé
  alternative: loin de Yahvé
  rationale: La formulation retenue garde l’image concrète de la présence divine et la tension du récit, sans expliquer comment Jonas concevait sa fuite.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. Sa transcription permet de le distinguer d’un titre, sans introduire une interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms « Tarsis », « Jaffa » et « Yahvé » suivent des formes françaises reconnaissables. La répétition de « Tarsis » et de « loin de la présence de Yahvé » est conservée pour respecter l’insistance du texte source.
