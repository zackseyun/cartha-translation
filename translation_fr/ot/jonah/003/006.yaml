id: JON.3.6
reference: Jonah 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּגַּ֤ע הַ/דָּבָר֙ אֶל מֶ֣לֶך נִֽינְוֵ֔ה וַ/יָּ֨קָם֙ מִ/כִּסְא֔/וֹ וַ/יַּעֲבֵ֥ר אַדַּרְתּ֖/וֹ מֵֽ/עָלָ֑י/ו וַ/יְכַ֣ס שַׂ֔ק וַ/יֵּ֖שֶׁב עַל הָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/006.yaml
  text: When the message reached the king of Nineveh[a], he rose from his throne, removed his robe, covered himself with sackcloth[c][b], and sat in the ashes.
translation:
  language: fr
  text: Quand la nouvelle parvint au roi de Ninive[a], il se leva de son trône, ôta son manteau[b], se couvrit d’une toile de sac et s’assit sur la cendre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Quand l’affaire parvint au roi de Ninive»; le terme hébreu peut aussi désigner la parole ou le rapport.
    reason: lexical_alternative
  - marker: b
    text: Ou «sa robe». Le terme hébreu désigne un vêtement extérieur distinctif, éventuellement somptueux.
    reason: lexical_alternative
  - marker: c
    text: Littéralement «sur la cendre».
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּגַּע הַדָּבָר
  choice: la nouvelle parvint
  rationale: Dans cette construction, נגע avec אֶל exprime le fait que quelque chose parvient à quelqu’un. דָּבָר peut désigner une parole, une affaire ou une nouvelle; ici, «la nouvelle» désigne naturellement ce qui fut porté à l’attention du roi.
- source_word: מֶלֶךְ נִינְוֵה
  choice: le roi de Ninive
  rationale: Rend directement et clairement la relation construite de l’hébreu.
- source_word: וַיָּקָם מִכִּסְאוֹ
  choice: il se leva de son trône
  rationale: כִּסֵּא peut être un siège ou un trône; le contexte royal justifie «trône» et conserve la portée symbolique du geste.
- source_word: וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו
  choice: ôta son manteau
  rationale: Le hifil de עבר signifie ici enlever, et אַדֶּרֶת désigne un vêtement extérieur distinctif. «Ôta son manteau» est précis, naturel et évite une formulation réflexive inutile en français.
- source_word: וַיְכַס שַׂק
  choice: se couvrit d’une toile de sac
  rationale: La formulation conserve le verbe «couvrir» et explicite naturellement en français que le roi s’en revêt. «Toile de sac» désigne l’étoffe rude associée au deuil et à l’humiliation.
- source_word: וַיֵּשֶׁב עַל הָאֵפֶר
  choice: s’assit sur la cendre
  rationale: «Sur» rend directement עַל, tandis que le singulier collectif «la cendre» reste naturel en français et préserve l’image hébraïque.
theological_decisions:
- issue: Gestes royaux d’humiliation et imagerie de repentance
  choice: Décrire simplement les gestes du roi sans les qualifier explicitement de repentance.
  alternative: Ajouter dans le corps du texte qu’il se repentit ou s’humilia devant Dieu.
  rationale: Le verset présente des gestes associés au deuil, à l’humiliation et à la repentance, mais n’énonce pas lui-même une conclusion théologique explicite. La traduction laisse le contexte porter cette signification.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. Les gestes sont rendus sans archaïsme marqué ni explicitation doctrinale.
