  text: וַ/יָּ֣קָם יוֹנָ֗ה וַ/יֵּ֛לֶךְ אֶל נִֽינְוֶ֖ה כִּ/דְבַ֣ר יְהוָ֑ה וְ/נִֽינְוֵ֗ה הָיְתָ֤ה עִיר גְּדוֹלָה֙ לֵֽ/אלֹהִ֔ים מַהֲלַ֖ךְ שְׁלֹ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/003.yaml
  text: So Jonah arose and went to Nineveh[a], according to the word of Yahweh. Now Nineveh was an exceedingly great city before God[b], a journey of three days.
translation:
  language: fr
  text: Jonas se leva et alla à Ninive, conformément à la parole de Yahweh. Or Ninive était une ville immense devant Dieu[a], une marche de trois jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une grande ville pour/devant Dieu ». Cette tournure peut aussi avoir une valeur superlative : « une ville extrêmement grande ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « une marche de trois jours ». L’expression peut désigner le temps nécessaire pour traverser la ville ou pour en faire le tour au cours d’une visite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום dans cette forme narrative marque la réponse de Jonas à l’ordre reçu et fait écho à la formulation de 1.3 et 3.2, sans surinterpréter son mouvement.
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: הלך est le verbe courant pour « aller » ou « marcher » ; « alla » restitue directement la succession narrative.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: Cette formulation conserve l’idée littérale d’une action accomplie selon la parole, c’est-à-dire en obéissance au commandement divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: עִיר גְּדוֹלָה לֵאלֹהִים
  choice: une ville immense devant Dieu
  rationale: « Immense » exprime naturellement la grandeur exceptionnelle, tandis que « devant Dieu » maintient la référence explicite à Dieu et l’ambiguïté de la préposition ל.
- source_word: מַהֲלַךְ שְׁלֹשֶׁת יָמִים
  choice: il fallait trois jours de marche pour la parcourir
  rationale: מהלך désigne une durée ou une étendue de parcours. Cette traduction française est naturelle, tout en laissant une note préciser que le texte ne détermine pas exactement la nature du parcours.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de לֵאלֹהִים dans עִיר גְּדוֹלָה לֵאלֹהִים
  choice: 'maintenir la mention de Dieu : « une ville immense devant Dieu »'
  alternative: « une ville extrêmement grande », avec une valeur purement superlative
  rationale: La construction peut être un superlatif idiomatique, mais elle contient explicitement אֱלֹהִים. Le texte principal conserve cette référence sans exclure le sens intensif, indiqué en note.
translation_notes:
  register: Français international moderne, narratif et digne. « Se leva donc » conserve la cadence du récit ; « conformément à » exprime clairement l’obéissance. Les notes maintiennent les ambiguïtés réelles de לֵאלֹהִים et de la mesure de trois jours.
