  text: וְ/יִתְכַּסּ֣וּ שַׂקִּ֗ים הָֽ/אָדָם֙ וְ/הַ/בְּהֵמָ֔ה וְ/יִקְרְא֥וּ אֶל אֱלֹהִ֖ים בְּ/חָזְקָ֑ה וְ/יָשֻׁ֗בוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וּ/מִן הֶ/חָמָ֖ס אֲשֶׁ֥ר בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/008.yaml
  text: Let both man and beast be covered with sackcloth[a], and let them call out mightily to God[c][b], and let each man turn from his evil way and from the violence that is in their hands.
translation:
  language: fr
  text: Que les humains et les bêtes se couvrent de toile de sac, qu’ils crient vers Dieu avec force[a], et que chacun se détourne de sa mauvaise voie et de la violence qui est dans leurs mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec insistance »; littéralement « avec force ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe ici du singulier distributif (« chacun… sa ») au pluriel (« leurs mains »), désignant collectivement les habitants.
    reason: source_text_clarification
lexical_decisions:
- source_word: וְיִתְכַּסּוּ שַׂקִּים
  choice: se couvrent de toile de sac
  rationale: Le hitpael de כסה peut avoir une valeur réfléchie ou moyenne. « Se couvrent » est naturel en français et conserve l’image concrète du deuil et de l’humiliation exprimée par שַׂקִּים.
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: les humains comme les bêtes
  rationale: אָדָם désigne ici les êtres humains collectivement, en contraste avec les animaux. בְּהֵמָה renvoie aux animaux domestiques; « bêtes » maintient le contraste solennel et concis.
- source_word: וְיִקְרְאוּ אֶל אֱלֹהִים בְּחָזְקָה
  choice: qu’ils crient vers Dieu avec force
  rationale: קרא אל exprime ici un appel pressant adressé à Dieu. בְּחָזְקָה indique l’intensité; « avec force » en garde la forme concrète sans réduire le sens à la seule sincérité.
- source_word: וְיָשֻׁבוּ
  choice: se détourne
  rationale: שׁוב décrit littéralement un mouvement de retour ou de changement de direction. Avec les compléments introduits par מִן, « se détourner de » exprime clairement le renversement moral sans remplacer la métaphore par le terme théologique « se repentir ».
- source_word: אִישׁ
  choice: chacun
  rationale: 'אִישׁ a ici une valeur distributive: chaque personne parmi les habitants est appelée à changer. « Chacun » rend cette fonction naturellement en français.'
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: de sa mauvaise voie
  rationale: « Voie » conserve la métaphore hébraïque courante pour la conduite ou la manière de vivre. « Mauvaise » traduit directement רָעָה sans explicitation supplémentaire.
- source_word: וּמִן הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם
  choice: et de la violence qui est entre leurs mains
  rationale: חָמָס désigne directement la violence ou le tort violent. La formulation garde l’image des mains et le passage remarquable du singulier distributif (« chacun… sa ») au suffixe pluriel (« leurs ») dans l’hébreu.
theological_decisions:
- issue: Portée morale de שׁוב
  choice: « se détourne »
  alternative: « se repente » ou « revienne »
  rationale: Le contexte implique la repentance, mais le verbe hébreu conserve l’image plus large et concrète d’un changement de direction. La traduction ne transforme donc pas cette image en terme théologique explicite.
- issue: Référence collective de הָאָדָם et distributive de אִישׁ
  choice: « les humains » puis « chacun »
  alternative: « l’homme » puis « chaque homme »
  rationale: Dans ce contexte, הָאָדָם désigne la catégorie humaine opposée aux bêtes, tandis que אִישׁ distribue l’ordre à chaque individu. Le français retenu exprime ces fonctions sans suggérer que seuls les hommes de sexe masculin sont concernés.
- issue: Alternance du singulier et du pluriel dans la dernière proposition
  choice: Maintenir « chacun… sa… leurs mains »
  alternative: Uniformiser en « chacun… sa… ses mains » ou au pluriel « tous… leur… leurs mains »
  rationale: Le texte hébreu passe délibérément du singulier distributif אִישׁ et de son suffixe singulier au suffixe pluriel de כַּפֵּיהֶם. Le maintien de cette tension évite de corriger silencieusement la forme du texte.
translation_notes:
  register: Français international actuel, digne et direct. Les subjonctifs rendent la force injonctive de la proclamation. « Toile de sac », « mauvaise voie » et « entre leurs mains » préservent les images culturelles et éthiques de l’hébreu tout en restant compréhensibles.
