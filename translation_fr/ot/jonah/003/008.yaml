    issue: « entre leurs mains »
    rationale: Cette expression française évoque surtout la possession, le contrôle ou une situation située entre deux mains. L’hébreu dit « dans leurs mains »; cette formulation, quoique imagée, est également l’expression biblique française établie et préserve mieux la métaphore des actes violents.
  - severity: low
    issue: « les humains comme les bêtes »
    rationale: « Comme » peut avoir une nuance comparative absente de la coordination hébraïque. « Et » rend directement la juxtaposition de הָאָדָם וְהַבְּהֵמָה.
