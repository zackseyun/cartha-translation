  source_fidelity: 'La structure injonctive est bien rendue par les subjonctifs, et les principaux termes suivent fidèlement l’hébreu : les humains et les bêtes, la toile de sac, l’appel intense à Dieu, le détournement de la mauvaise voie et la violence. Toutefois, « entre leurs mains » ne rend pas exactement בְּכַפֵּיהֶם, qui signifie littéralement « dans leurs mains » et conserve l’image des actes commis ou détenus par eux.'
  naturalness: Le français est globalement clair, actuel et d’un registre convenant à une proclamation solennelle. « Les humains comme les bêtes » peut toutefois suggérer une assimilation comparative (« les humains comme [étant] des bêtes ») plutôt que la simple coordination source. « Les humains et les bêtes » est plus net.
  terminology: « Toile de sac », « Dieu », « mauvaise voie » et « violence » sont des choix précis et naturels. « Chacun » rend convenablement la valeur distributive de אִישׁ en français, sans imposer une lecture sexuée. La note sur l’alternance singulier/pluriel est utile et correctement ancrée.
  issues:
