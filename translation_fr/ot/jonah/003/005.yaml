  source_fidelity: Le sens collectif de אַנְשֵׁי נִינְוֵה est bien rendu par « les habitants de Ninive ». La construction אמן + ב est correctement reconnue comme pouvant exprimer la foi/confiance en Dieu aussi bien que l’acceptation de sa parole. En français, toutefois, « crurent en Dieu » reflète plus directement la préposition hébraïque et évite de faire de « crurent Dieu » une lecture trop exclusivement propositionnelle.
  naturalness: « Crurent Dieu » est grammatical, mais peu idiomatique en français international moderne et peut paraître archaïque ou elliptique. « Crurent en Dieu » est naturel, clair et demeure sobre. « Se vêtirent de toile de sac » est plus fluide que « se revêtirent de toile de sac », tout en conservant l’image matérielle.
