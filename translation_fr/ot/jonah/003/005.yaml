  text: וַֽ/יַּאֲמִ֛ינוּ אַנְשֵׁ֥י נִֽינְוֵ֖ה בֵּֽ/אלֹהִ֑ים וַ/יִּקְרְאוּ צוֹם֙ וַ/יִּלְבְּשׁ֣וּ שַׂקִּ֔ים מִ/גְּדוֹלָ֖/ם וְ/עַד קְטַנָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/005.yaml
  text: And the people of Nineveh believed God[a], and they proclaimed a fast and put on sackcloth, from their greatest to their least.
translation:
  language: fr
  text: Les habitants de Ninive crurent en Dieu[a]. Ils proclamèrent un jeûne et se vêtirent de toile de sac, du plus grand au plus petit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « crurent Dieu ». La construction hébraïque peut exprimer aussi bien le fait de croire Dieu que celui de mettre sa confiance en lui.
    reason: alternative lexicale et préservation de l’ambiguïté de la construction hébraïque
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: crurent
  rationale: Le hiphil de אמן avec ב exprime ici le fait de croire Dieu ou de mettre sa confiance en lui. « Crurent » rend directement leur réponse au message sans préciser davantage la nature théologique de cette foi.
- source_word: אַנְשֵׁי נִינְוֵה
  choice: les habitants de Ninive
  rationale: Bien que אַנְשֵׁי signifie littéralement « les hommes de », le groupe désigne collectivement la population de la ville dans ce contexte. « Les habitants » est naturel en français et concorde avec la portée générale de la formule finale.
- source_word: בֵּאלֹהִים
  choice: Dieu
  rationale: Avec אמן + ב, la construction peut signifier croire Dieu ou croire en Dieu. Le complément direct « crurent Dieu » est possible en français et garde le lien immédiat avec la proclamation reçue, tandis qu'une note conserve l'autre nuance.
- source_word: וַיִּקְרְאוּ צוֹם
  choice: ils proclamèrent un jeûne
  rationale: קרא avec צום désigne l'annonce publique d'un jeûne collectif. « Proclamèrent un jeûne » restitue clairement le caractère officiel de l'action.
- source_word: וַיִּלְבְּשׁוּ שַׂקִּים
  choice: se revêtirent de toile de sac
  rationale: שַׂקִּים désigne des vêtements grossiers portés en signe d'affliction ou d'humiliation. La formulation française est digne, compréhensible et conserve l'image concrète.
- source_word: מִגְּדוֹלָם וְעַד קְטַנָּם
  choice: du plus grand au plus petit
  rationale: Cette formule mérismatique inclut toute la population, probablement selon le rang ou l'importance. La tournure française en préserve la concision et la portée totale.
theological_decisions:
- issue: Nature de la réponse des Ninivites à Dieu
  choice: « crurent Dieu », sans développer en repentance, conversion ou foi salvatrice
  alternative: « crurent en Dieu » ou une formulation explicitant leur repentance
  rationale: Le verset mentionne la foi, le jeûne et la toile de sac. Même si le contexte suggère la repentance, la traduction ne doit pas ajouter une conclusion théologique que ce verset ne formule pas explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. « Toile de sac » conserve l'image biblique sans employer le terme moins transparent « sac » seul; « les habitants » rend le collectif sans limiter indûment le groupe aux hommes adultes.
