  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : commencement de l’entrée/progression de Jonas dans Ninive, étendue d’une journée de marche, proclamation publique, délai de quarante jours et annonce d’un renversement. Toutefois, « Il lança cet appel » absorbe les deux verbes וַיִּקְרָא וַיֹּאמַר et atténue légèrement la formulation explicite de la proclamation. Une formulation avec « cria » et le discours direct restitue plus directement la force de l’hébreu, sans lourdeur artificielle.'
  naturalness: Le français est globalement moderne et clair. « sur une distance d’une journée de marche » est compréhensible, mais un peu pesant après « avancer ». « pénétrer dans la ville sur une journée de marche » est plus fluide tout en gardant la valeur spatiale de מַהֲלַךְ יוֹם אֶחָד.
  terminology: « Encore quarante jours » restitue bien עוֹד. « Ninive sera renversée » préserve utilement l’ambiguïté de נֶהְפָּכֶת entre ruine/renversement et retournement radical; il ne faut pas imposer « détruite » dans le texte. La note peut présenter « détruite » comme possibilité, mais « mise sens dessus dessous » est trop idiomatique et trop faible pour une annonce prophétique de jugement.
  issues:
