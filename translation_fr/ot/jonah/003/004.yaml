  text: וַ/יָּ֤חֶל יוֹנָה֙ לָ/ב֣וֹא בָ/עִ֔יר מַהֲלַ֖ךְ י֣וֹם אֶחָ֑ד וַ/יִּקְרָא֙ וַ/יֹּאמַ֔ר ע֚וֹד אַרְבָּעִ֣ים י֔וֹם וְ/נִֽינְוֵ֖ה נֶהְפָּֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/004.yaml
  text: Jonah began to go into the city a day's journey[a], and he cried out and said, “Yet forty days[b], and Nineveh will be overturned.”
translation:
  language: fr
  text: 'Jonas commença à pénétrer dans la ville sur une journée de marche[a]. Il cria : « Encore quarante jours, et Ninive sera renversée[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une marche d’un jour ». L’expression désigne l’étendue normalement parcourue en un jour et peut décrire la distance que Jonas parcourut dans la ville.'
    reason: clarification
  - marker: b
    text: Ou « sera détruite ». Le verbe hébreu peut désigner un renversement destructeur, mais aussi un retournement radical.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל ... לָבוֹא בָעִיר
  choice: commença à avancer dans la ville
  rationale: Le hifil de חלל suivi de l’infinitif marque ici le commencement de l’action. « Avancer dans la ville » exprime naturellement le mouvement vers l’intérieur sans suggérer que Jonas vient seulement d’en franchir la limite.
- source_word: מַהֲלַךְ יוֹם אֶחָד
  choice: sur une distance d’une journée de marche
  rationale: La tournure désigne l’étendue normalement parcourue en un jour. Cette formulation conserve sa valeur spatiale et son lien syntaxique avec l’entrée de Jonas dans la ville.
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: Il lança cet appel
  rationale: Cette formulation française rend l’annonce publique et sonore exprimée par קרא, tout en intégrant naturellement ויאמר sans l’alourdissement de « il cria et dit ».
- source_word: עוֹד אַרְבָּעִים יוֹם
  choice: Encore quarante jours
  rationale: עוֹד indique ici le temps qui reste avant l’événement annoncé. « Encore quarante jours » garde clairement l’idée d’un compte à rebours.
- source_word: נֶהְפָּכֶת
  choice: sera renversée
  rationale: Le nifal de הפך peut évoquer le renversement, la destruction ou une transformation radicale. « Renversée » annonce nettement le jugement tout en conservant davantage de largeur sémantique que « détruite ».
theological_decisions:
- issue: Portée sémantique de נֶהְפָּכֶת dans l’avertissement de Jonas
  choice: sera renversée
  alternative: sera détruite
  rationale: Le verbe hébreu autorise l’idée d’un renversement catastrophique, mais aussi celle d’un retournement plus large. La traduction retenue préserve cette tension littéraire et théologique au lieu de réduire d’emblée l’annonce à la destruction matérielle.
translation_notes:
  register: Français international moderne, direct et digne. « Il lança cet appel » conserve la force publique de la proclamation tout en évitant une coordination hébraïsante peu naturelle. Le discours bref garde l’urgence de l’original.
