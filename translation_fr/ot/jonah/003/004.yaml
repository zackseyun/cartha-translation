    issue: Les deux verbes de proclamation sont condensés dans « Il lança cet appel ».
    rationale: Cette condensation est possible en français, mais « il cria » suivi du discours direct exprime plus nettement la proclamation publique de וַיִּקְרָא et conserve la transition vers le contenu introduit par וַיֹּאמַר.
  - severity: low
    issue: La variante « mise sens dessus dessous » dans la note b est trop familière et imprécise.
    rationale: Elle peut évoquer un simple désordre. Le verbe הפך renvoie ici à un renversement décisif, potentiellement destructeur, tout en permettant le motif plus large du retournement.
