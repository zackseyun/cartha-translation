id: JON.3.10
reference: Jonah 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֤רְא הָֽ/אֱלֹהִים֙ אֶֽת מַ֣עֲשֵׂי/הֶ֔ם כִּי שָׁ֖בוּ מִ/דַּרְכָּ֣/ם הָ/רָעָ֑ה וַ/יִּנָּ֣חֶם הָ/אֱלֹהִ֗ים עַל הָ/רָעָ֛ה אֲשֶׁר דִּבֶּ֥ר לַ/עֲשׂוֹת לָ/הֶ֖ם וְ/לֹ֥א עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/010.yaml
  text: When God saw their deeds[a], that they had turned from their evil way, God relented concerning the disaster that he had spoken to bring on them[b], and he did not do it.
translation:
  language: fr
  text: Quand Dieu vit leurs actes et constata qu’ils s’étaient détournés de leur mauvaise conduite, Dieu renonça au malheur[a] qu’il avait annoncé leur faire subir, et il ne le fit pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « revint sur le malheur » ou « changea d’avis au sujet du malheur ». L’hébreu décrit la réponse de Dieu au changement de conduite des Ninivites, sans lui attribuer de faute morale. Le même mot hébreu désigne plus haut ce qui est « mauvais » dans leur conduite et ici le « malheur » annoncé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה signifie simplement « voir » dans ce récit. La coordination française « vit… et constata que » rend naturellement la perception des actes et de ce qu’ils manifestaient.
- source_word: מַעֲשֵׂיהֶם
  choice: leurs actes
  rationale: מַעֲשִׂים désigne les actions accomplies. « Leurs actes » est actuel, clair et conserve leur portée morale.
- source_word: כִּי שָׁבוּ
  choice: et constata qu’ils s’étaient détournés
  rationale: כִּי précise ici ce que Dieu vit dans leurs actes ou le motif de sa réaction. Cette formulation française exprime le lien sans réduire artificiellement l’ambiguïté entre contenu et cause.
- source_word: מִדַּרְכָּם הָרָעָה
  choice: de leur mauvaise conduite
  rationale: Le singulier דֶּרֶךְ évoque leur voie ou manière de vivre. « Mauvaise conduite » restitue naturellement en français le sens moral de l’expression.
- source_word: וַיִּנָּחֶם
  choice: renonça
  rationale: Dans ce contexte, נחם décrit le fait que Dieu ne met pas à exécution le jugement annoncé. « Renonça » préserve le changement réel de ligne d’action sans suggérer une faute morale.
- source_word: עַל הָרָעָה
  choice: au malheur
  rationale: La seconde occurrence de רָעָה désigne la calamité annoncée, non le mal moral. « Malheur » maintient autant que possible le lien lexical français avec « mauvaise » tout en distinguant les deux sens.
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם
  choice: qu’il avait annoncé leur faire subir
  rationale: דִּבֶּר exprime l’annonce divine et לַעֲשׂוֹת לָהֶם l’action projetée envers eux. « Faire subir » est idiomatique en français lorsqu’il s’agit d’un malheur annoncé.
- source_word: וְלֹא עָשָׂה
  choice: et il ne le fit pas
  rationale: Cette formulation conserve la brièveté et la simplicité de l’hébreu, l’antécédent étant clair.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte narratif, אֱלֹהִים désigne sans ambiguïté Dieu.
theological_decisions:
- issue: Langage anthropopathique de וַיִּנָּחֶם au sujet de la réponse divine
  choice: « Dieu renonça au malheur »
  alternative: « Dieu changea d’avis », « Dieu regretta » ou « Dieu se repentit »
  rationale: Le texte présente une modification réelle de l’action annoncée par Dieu en réponse au retournement de Ninive. « Renonça » garde cette tension sans laisser entendre que Dieu aurait commis une faute; la note signale les autres nuances possibles.
- issue: Deux sens contextuels de רָעָה
  choice: « mauvaise conduite » pour le mal moral des Ninivites, puis « malheur » pour la calamité annoncée
  alternative: Employer « mal » dans les deux cas
  rationale: Le même lexème hébreu est répété, mais son référent change selon le contexte. La traduction distingue le mal moral de la calamité judiciaire tout en conservant un écho lexical entre « mauvaise » et « malheur ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression du récit et la répétition de « Dieu ». « Mauvaise conduite » est plus naturel que le calque « mauvaise voie », tandis que « renonça au malheur » garde la tension théologique du texte. Le marqueur [a] figure bien dans le corps du verset.
