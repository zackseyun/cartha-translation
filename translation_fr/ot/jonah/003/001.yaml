source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶל יוֹנָ֖ה שֵׁנִ֥ית לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/001.yaml
  text: Then the word of Yahweh came to Jonah a second time[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh fut adressée à Jonas une deuxième fois[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nouveau ». L’hébreu marque explicitement la répétition après la première mission confiée à Jonas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: La forme narrative fait progresser le récit. Avec « la parole de Yahweh », la tournure française « fut adressée » exprime naturellement la venue de la parole à son destinataire sans ajouter un événement distinct.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la formule prophétique et sa résonance canonique, tandis que « message » serait plus interprétatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: adressée à
  rationale: Dans cette formule prophétique, la préposition désigne le destinataire; « adressée à » est idiomatique en français.
- source_word: יוֹנָה
  choice: Jonas
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: שֵׁנִית
  choice: une deuxième fois
  rationale: Cette expression rend explicitement la répétition et souligne que Jonas reçoit de nouveau une mission après le premier appel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles qui suivent. En français, les deux-points remplissent naturellement cette fonction et évitent le calque pesant « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » en conserve la fonction et n’y substitue pas un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la formule prophétique « la parole de Yahweh »; les deux-points introduisent directement le discours du verset suivant.
