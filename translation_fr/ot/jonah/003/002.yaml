  variant: modern international French
source:
  edition: WLC
  text: ק֛וּם לֵ֥ךְ אֶל נִֽינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה וִּ/קְרָ֤א אֵלֶ֨י/הָ֙ אֶת הַ/קְּרִיאָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/002.yaml
  text: Arise[a], go to Nineveh, the great city, and proclaim to it the proclamation that I speak to you.
translation:
  language: fr
  text: « Lève-toi, va à Ninive, la grande ville, et proclame-lui le message que je te dirai. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֛וּם
  choice: Lève-toi
  rationale: L’impératif de קום appelle Jonas à se mettre debout et à agir; « Lève-toi » rend naturellement en français la solennité et l’urgence du commandement.
- source_word: לֵ֥ךְ
  choice: va
  rationale: Dans cette suite d’impératifs, הלך est le verbe courant de déplacement; « va » est l’équivalent français direct et naturel.
- source_word: נִֽינְוֵ֖ה
  choice: Ninive
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הָעִ֣יר הַגְּדוֹלָ֑ה
  choice: la grande ville
  rationale: גדול peut évoquer la taille comme l’importance. « La grande ville » préserve cette amplitude et la répétition littéraire propre au livre.
- source_word: וּקְרָ֤א אֵלֶ֨יהָ֙
  choice: et proclame-lui
  rationale: קרא peut signifier appeler, crier ou proclamer. La préposition אֶל signifie ici « à », contrairement à עַל, « contre », en Jonas 1.2; « proclame-lui » conserve ce changement sans renforcer indûment l’hostilité du mandat.
- source_word: אֶת הַקְּרִיאָ֔ה
  choice: le message
  rationale: Le nom קְרִיאָה désigne ici ce qui doit être proclamé. « Le message » est clair et idiomatique en français; reproduire le cognat par « proclame la proclamation » serait lourd et peu naturel.
- source_word: אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽיךָ
  choice: que je te dirai
  rationale: 'Le participe דֹבֵר peut prendre, dans ce contexte de mandat à accomplir, une valeur prospective: Dieu communiquera à Jonas le message à annoncer. « Que je te dirai » est naturel et évite l’étrange impression que le contenu serait déjà en train d’être énoncé.'
theological_decisions:
- issue: Orientation du message adressé à Ninive
  choice: proclame-lui
  alternative: crie contre elle
  rationale: Ce verset emploie אֶל, « à », et non עַל, « contre », comme en Jonas 1.2. La traduction conserve ce déplacement et ne précise pas d’avance si le message est uniquement une condamnation.
- issue: Temporalité de la parole divine
  choice: que je te dirai
  alternative: que je te dis
  rationale: La forme participiale est susceptible d’une lecture en cours ou prospective. Le contexte de l’envoi favorise en français une formulation prospective, tout en maintenant que le contenu vient directement de Dieu.
translation_notes:
  register: Français moderne, international et digne. La coordination impérative conserve le rythme pressant de l’hébreu. « Proclame-lui le message » privilégie la clarté naturelle tout en respectant la préposition du texte source.
