base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/009.yaml
  text: Who knows? God may turn and relent[a], and turn from the burning of his anger[b], so that we do not perish.
translation:
  language: fr
  text: Qui sait ? Dieu pourrait changer d’attitude, renoncer à son jugement[a] et se détourner de l’ardeur de sa colère[b], afin que nous ne périssions pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se raviser », « changer d’avis » ou « regretter ». Ici, le verbe évoque le fait que Dieu peut ne pas exécuter le jugement annoncé.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu dit littéralement : « de l’ardeur de sa colère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Qui sait ?
  rationale: Cette expression idiomatique conserve à la fois l’incertitude et l’espérance exprimées par la question rhétorique.
- source_word: יָשׁוּב
  choice: se retournera peut-être
  rationale: Après « Qui sait ? », le yiqtol exprime une possibilité plutôt qu’une certitude. « Se retourner » garde l’image fondamentale du verbe שוב.
- source_word: וְנִחַם
  choice: renoncera
  rationale: Dans ce contexte, נחם désigne le fait de renoncer au jugement annoncé. Ce choix reste naturel en français sans suggérer que Dieu aurait commis une erreur.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Rendu usuel du nom commun défini désignant ici Dieu.
- source_word: וְשָׁב
  choice: se détournera
  rationale: Le second emploi de שוב est rendu avec un verbe de même champ sémantique, adapté au complément « de son ardente colère ».
- source_word: מֵחֲרוֹן אַפּוֹ
  choice: de son ardente colère
  rationale: Cette formulation française naturelle conserve l’image de chaleur ou de brûlure portée par l’expression hébraïque חרון אף.
- source_word: וְלֹא נֹאבֵד
  choice: ainsi, nous ne périrons pas
  rationale: « Ainsi » explicite sobrement le résultat espéré, tout en conservant la première personne du pluriel et le verbe « périr ».
theological_decisions:
- issue: La réaction de Dieu exprimée par נחם
  choice: Dieu « renoncera » peut-être au jugement annoncé
  alternative: Dieu « changera peut-être d’avis » ou « regrettera »
  rationale: « Renoncer » exprime ici que Dieu peut ne pas exécuter le jugement annoncé. La formulation préserve la réelle ouverture du discours à une réponse divine, sans conclure que Dieu se serait trompé ni résoudre la tension théologique du texte.
translation_notes:
  register: Français international actuel, digne et accessible. L’inversion après « peut-être » soutient un registre soigné sans être archaïque. La répétition de verbes de mouvement conserve autant que possible le double emploi de שוב, tandis que les notes maintiennent les nuances lexicales et théologiques.
