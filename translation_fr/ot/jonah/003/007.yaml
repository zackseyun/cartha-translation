  source_fidelity: La formulation « Il fit proclamer » rend bien le cadre d’une proclamation publique, mais l’énumération française actuelle (« qu’aucun être humain ni aucune bête... ») est grammaticalement et stylistiquement maladroite. Le texte hébreu énumère les humains, les animaux, le gros bétail et le petit bétail comme catégories soumises au jeûne. « Gros bétail / petit bétail » conserve cette portée sans restreindre צאן aux moutons.
  naturalness: La révision emploie une coordination négative française naturelle et un registre solennel mais moderne. « Les humains » est idiomatique dans ce contraste collectif avec les animaux, et « qu’ils ne paissent pas » convient au style de l’édit.
  terminology: « Hauts dignitaires » convient à גדליו dans un contexte royal. « Bêtes », « gros bétail » et « petit bétail » reflètent les catégories hébraïques sans surinterprétation. Aucun terme théologique disputé n’est en jeu.
