base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/007.yaml
  text: 'And he proclaimed and said in Nineveh[a], by decree of the king and his nobles: “Let neither man nor beast, herd nor flock, taste anything. Let them not graze[b], and let them not drink water.”'
translation:
  language: fr
  text: 'Il fit proclamer ceci dans Ninive : « Par décret du roi et de ses hauts dignitaires, que ni les humains ni les bêtes, ni le gros ni le petit bétail ne goûtent quoi que ce soit ! Qu’ils ne paissent pas et ne boivent pas d’eau ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּזְעֵק וַיֹּאמֶר
  choice: Il fit proclamer ceci
  rationale: Dans le contexte d’un édit public, cette tournure française rend naturellement l’annonce officielle et l’introduction de son contenu, sans reproduire lourdement « il proclama et dit ».
- source_word: בְּנִינְוֵה
  choice: dans Ninive
  rationale: La préposition est locative et situe la proclamation à l’intérieur de la ville.
- source_word: מִטַּעַם
  choice: Par décret de
  rationale: Dans un contexte administratif, טַעַם désigne une décision ou un décret officiel.
- source_word: הַמֶּלֶךְ וּגְדֹלָיו
  choice: du roi et de ses hauts dignitaires
  rationale: גְדֹלָיו, littéralement « ses grands », désigne ici les principaux personnages associés au roi ; « hauts dignitaires » est naturel, précis et suffisamment formel en français.
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: aucun être humain ni aucune bête
  rationale: אָדָם est ici collectif et s’oppose aux animaux. « Être humain » préserve cette opposition sans suggérer que seuls les hommes de sexe masculin sont visés.
- source_word: הַבָּקָר וְהַצֹּאן
  choice: aucun bovin ni aucun animal du petit bétail
  rationale: בָּקָר désigne les bovins ou gros bétail, tandis que צֹאן est un terme collectif couvrant le petit bétail, notamment moutons et chèvres. Cette formulation évite de réduire צֹאן aux seuls moutons.
- source_word: אַל יִטְעֲמוּ מְאוּמָה
  choice: ne goûte quoi que ce soit
  rationale: Le verbe טעם signifie littéralement « goûter » ; la formule exprime ici l’interdiction totale de consommer.
- source_word: אַל יִרְעוּ
  choice: Qu’ils ne paissent pas
  rationale: Le verbe רעה signifie ici paître ou brouter ; « paître » convient au registre digne de l’édit tout en restant clair.
- source_word: וּמַיִם אַל יִשְׁתּוּ
  choice: et ne boivent pas d’eau
  rationale: La traduction conserve explicitement l’objet « eau » et coordonne la seconde interdiction à la première.
theological_decisions:
- issue: Portée collective de הָאָדָם dans l’opposition entre humains et animaux
  choice: être humain
  alternative: homme ; humanité ; les gens
  rationale: Le contexte englobe toute la population humaine sans distinction de sexe. « Être humain » rend la catégorie collective en opposition aux bêtes tout en évitant l’ambiguïté moderne de « homme ».
translation_notes:
  register: Français international moderne, digne et accessible. Le tour juridique « Par décret » et les impératifs au subjonctif conservent la solennité de la proclamation. Aucun marqueur de note n’est nécessaire.
