lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans les listes généalogiques et de recensement de l’époque postexilique, בְּנֵי introduit couramment un groupe familial ou clanique. « Les fils de » conserve l’expression généalogique hébraïque sans expliciter davantage par « descendants ».
- source_word: זַתּוּא
  choice: Zattou
  rationale: Le nom propre est translittéré plutôt que traduit. « Zattou » représente naturellement en français la forme hébraïque זַתּוּא.
- source_word: שְׁמֹנֶה מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: huit cent quarante-cinq
  rationale: 'La suite de nombres hébraïque exprime exactement 845. L’orthographe française traditionnelle est retenue : « cent » reste invariable puisqu’il est suivi d’un autre nombre.'
