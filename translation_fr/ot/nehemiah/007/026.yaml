lexical_decisions:
- source_word: אַנְשֵׁי
  choice: les hommes de
  rationale: Le pluriel construit de אִישׁ introduit ici les habitants de localités dans une liste de recensement. « Les hommes de » conserve la forme masculine de l’hébreu et le style de la liste, tandis que « les gens de » reste une possibilité idiomatique.
- source_word: בֵית לֶחֶם
  choice: Bethléem
  rationale: Nom de lieu rendu selon sa forme française traditionnelle, sans traduire littéralement ses éléments.
- source_word: וּנְטֹפָה
  choice: et de Netopha
  rationale: La conjonction coordonne les deux localités sous un total commun. La préposition « de » est répétée en français pour marquer clairement que les hommes viennent des deux lieux.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: '188'
  rationale: La suite de nombres hébraïque donne un total de cent quatre-vingt-huit. Les chiffres conviennent au style condensé d’une liste de recensement.
