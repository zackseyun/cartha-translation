  text: 'Les hommes de Béthel et d’Aï[a] : cent vingt-trois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens de Béthel et d’Aï ». Littéralement, l’hébreu dit « les hommes de Béthel et d’Aï ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: les hommes de
  rationale: Le pluriel construit de אִישׁ désigne ici un groupe rattaché à des lieux. « Les hommes de » rend directement la forme masculine de l’hébreu; « les gens de » serait plus idiomatique, mais moins formellement précis.
- source_word: בֵית אֵל
  choice: Béthel
  rationale: Toponyme rendu selon sa forme française traditionnelle, sans traduire son sens étymologique (« maison de Dieu »).
- source_word: וְ/הָ/עָי
  choice: et d’Aï
  rationale: Le nom de lieu עַי, précédé en hébreu de la conjonction et de l’article, est rendu selon l’usage français établi. La préposition « de » se répète naturellement devant le second lieu et s’élide en « d’ ».
- source_word: מֵאָה עֶשְׂרִים וּ/שְׁלֹשָׁה
  choice: cent vingt-trois
  rationale: Le nombre cardinal est rendu dans sa forme française standard, en conservant exactement le total indiqué.
