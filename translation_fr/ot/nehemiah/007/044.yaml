  text: 'The singers: the sons of Asaph[a], one hundred forty-eight.'
translation:
  language: fr
  text: 'Les chanteurs : les fils d’Asaph[a], cent quarante-huit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les descendants d’Asaph ». En hébreu, « les fils de » peut désigner une lignée familiale ou les membres d’un groupe, et pas seulement les fils immédiats.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le participe substantivé du verbe שׁיר désigne ceux qui chantent. Dans cette liste de recensement, « les chanteurs » est naturel, précis et plus fidèle que le terme plus large « les musiciens ».
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans les désignations généalogiques et claniques, בְּנֵי signifie littéralement « fils de », tout en pouvant englober des descendants ou les membres d’un groupe familial ou professionnel. La formulation retenue préserve cette expression de filiation.
- source_word: אָסָף
  choice: Asaph
  rationale: Le nom propre est translittéré selon son usage français établi.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: cent quarante-huit
  rationale: La suite de nombres cardinaux hébraïques indique sans ambiguïté un total de 148 personnes.
