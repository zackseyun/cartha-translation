  verdict: revise
  source_fidelity: 'La version distingue insuffisamment הָעֹלִים (« qui montèrent/remontèrent ») de וַיָּשׁוּבוּ (« et qui retournèrent ») : « revinrent » puis « Ils retournèrent » répète le même verbe français et obscurcit la double formulation du texte hébreu. La révision conserve les deux verbes sans leur attribuer deux événements distincts. La note b doit aussi rendre exactement la direction de לְ (« vers/à »), non « dans ».'
  naturalness: « Membres de la province » est un français moderne et naturel pour l’expression administrative בני המדינה. La construction à relatives coordonnées, encadrée par des tirets pour l’incise explicative, est fluide tout en gardant la structure descriptive du verset.
  terminology: « Nabuchodonosor », « Babylone », « Juda » et « déportés » conviennent au registre biblique historique français. « Captivité des exilés » préserve volontairement les deux substantifs apparentés de l’hébreu; la note offre la solution plus idiomatique « de l’exil ».
