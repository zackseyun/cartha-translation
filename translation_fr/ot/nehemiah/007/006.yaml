  - severity: low
    issue: La note b qualifie « dans sa ville » de littéral
    rationale: L’hébreu אִישׁ לְעִירוֹ signifie littéralement « un homme vers/à sa ville ». « Dans sa ville » peut être une adaptation acceptable dans le texte courant, mais ne doit pas être présenté comme le sens littéral de la préposition.
