  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: fr
  text: 'Voici les membres de la province qui remontèrent de la captivité des exilés[a] — ceux que Nabuchodonosor, roi de Babylone, avait déportés — et qui retournèrent à Jérusalem et en Juda, chacun dans sa ville[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « de l’exil ». L’hébreu emploie littéralement deux termes : « de la captivité des exilés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un homme vers sa ville ». Cette expression distributive désigne les rapatriés, possiblement avec leurs foyers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: ceux de la province
  rationale: Littéralement « les fils de la province ». En français moderne, « ceux de la province » exprime naturellement l’appartenance administrative sans suggérer une filiation biologique.
- source_word: הָעֹלִים
  choice: qui revinrent
  rationale: Le verbe signifie littéralement « monter ». Dans ce contexte de retour au pays, « revinrent » est naturel; l’idée traditionnelle de montée peut aussi être conservée, mais elle alourdirait la succession avec וַיָּשׁוּבוּ.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: de la captivité des exilés
  rationale: Cette formulation conserve les deux substantifs apparentés et la légère redondance expressive de l’hébreu.
- source_word: אֲשֶׁר הֶגְלָה
  choice: ceux que ... avait déportés
  rationale: « Déporter » rend précisément le déplacement forcé causé par le roi de Babylone et convient au registre historique.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nabuchodonosor
  rationale: Forme française biblique traditionnelle et largement reconnue du nom royal.
- source_word: וַיָּשׁוּבוּ
  choice: Ils retournèrent
  rationale: Rend directement le verbe שׁוב et maintient sa valeur narrative propre plutôt que de l’absorber dans le premier verbe.
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: à Jérusalem et en Juda
  rationale: Les prépositions françaises idiomatiques diffèrent selon la ville et le territoire; Juda désigne ici la région.
- source_word: אִישׁ לְעִירוֹ
  choice: chacun dans sa ville
  rationale: Rend naturellement l’expression distributive. « Chacun » peut inclure les personnes et foyers représentés dans la liste sans imposer en français un masculin plus appuyé que l’hébreu contextuel.
theological_decisions:
- issue: Portée du masculin singulier représentatif אִישׁ
  choice: chacun dans sa ville
  alternative: chaque homme dans sa ville
  rationale: Dans cette formule distributive, אִישׁ individualise les membres du groupe et peut représenter leurs foyers. « Chacun » préserve cette distribution sans prétendre que seuls des hommes sont concernés.
- issue: Relation syntaxique de וַיָּשׁוּבוּ avec la description des rapatriés
  choice: 'nouvelle proposition : « Ils retournèrent »'
  alternative: 'seconde relative : « et qui retournèrent »'
  rationale: Le wayyiqtol hébreu fait avancer la présentation par une proposition verbale. Une phrase distincte respecte cette transition tout en donnant un français clair; aucune portée théologique particulière n’est ajoutée.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde le caractère administratif et généalogique de l’introduction à la liste, tout en évitant les calques peu naturels tels que « les fils de la province ».
