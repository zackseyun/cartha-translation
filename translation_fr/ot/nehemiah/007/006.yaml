  to: 'Voici les membres de la province qui remontèrent de la captivité des exilés[a] — ceux que Nabuchodonosor, roi de Babylone, avait déportés — et qui retournèrent à Jérusalem et en Juda, chacun dans sa ville[b] :'
  rationale: La correction rend « remontèrent » pour le participe העלים et conserve « retournèrent » pour וישובו, conformément à la double expression du texte source. Elle maintient l’incise relative à la déportation et le caractère distributif de la dernière formule, tout en rectifiant la note littérale.
