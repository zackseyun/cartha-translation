source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: fr
  text: Puis je confiai la responsabilité de Jérusalem à mon frère Hanani et à Hanania, le commandant de la forteresse, car il[b] était un homme digne de confiance[a] et craignait Dieu plus que beaucoup d’autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme de vérité »; autre traduction possible : « un homme fidèle ».'
    reason: lexical_alternative
  - marker: b
    text: Le singulier « il » renvoie le plus naturellement à Hanania, bien que certains comprennent cet éloge comme justifiant plus généralement la nomination des deux hommes.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה ... עַל יְרוּשָׁלִָם
  choice: je confiai la responsabilité de Jérusalem à
  rationale: Dans ce contexte administratif, צוה avec des personnes comme compléments et עַל יְרוּשָׁלַ͏ִם exprime l’attribution d’une charge. Cette formulation française est naturelle tout en conservant l’idée de mandat et d’autorité.
- source_word: חֲנָנִי אָחִי
  choice: mon frère Hanani
  rationale: Le suffixe de première personne identifie Hanani comme le frère de Néhémie; cet ordre est idiomatique en français.
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Translittération française usuelle du nom hébreu, distincte de Hanani.
- source_word: שַׂר הַבִּירָה
  choice: le commandant de la forteresse
  rationale: שַׂר désigne ici un responsable ou commandant, et בִּירָה un ensemble fortifié. « Forteresse » est clair et accessible.
- source_word: כִּי הוּא
  choice: car celui-ci était
  rationale: כִּי introduit le motif de la nomination. « Celui-ci » conserve le singulier et renvoie le plus naturellement à Hanania, l’antécédent le plus proche, sans rendre son identité absolument explicite.
- source_word: כְּאִישׁ אֱמֶת
  choice: un homme digne de confiance
  rationale: Littéralement proche de « un homme de vérité », l’expression caractérise ici la fiabilité et l’intégrité nécessaires à la fonction.
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: et craignait Dieu
  rationale: Conserve directement l’idiome hébreu de la crainte révérencielle de Dieu.
- source_word: מֵרַבִּים
  choice: plus que beaucoup d’autres
  rationale: Le comparatif מן avec רַבִּים signifie « plus que beaucoup ». L’ajout idiomatique de « d’autres » clarifie la comparaison sans la durcir en « plus que la plupart ».
theological_decisions:
- issue: Référent du pronom singulier dans la proposition élogieuse
  choice: Le singulier renvoie principalement à Hanania, l’antécédent le plus proche.
  alternative: L’éloge peut être compris comme justifiant plus largement la nomination des deux hommes.
  rationale: Le pronom et les prédicats hébreux sont au singulier. « Celui-ci » préserve cette donnée et son renvoi naturel à Hanania, tout en évitant de transformer le texte en un pluriel interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe administrative est rendue naturellement; l’expression biblique « craignait Dieu » est conservée. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
