  naturalness: Le français est moderne, clair et de registre approprié. « Car il était » est plus naturel dans ce contexte narratif et préserve mieux la discrétion référentielle du pronom source que « car celui-ci était ».
  terminology: « Homme digne de confiance » rend bien איש אמת dans un contexte de responsabilité publique; la note conserve utilement les possibilités plus littérales ou voisines. « Craignait Dieu » maintient l’idiome biblique sans surcharge confessionnelle.
