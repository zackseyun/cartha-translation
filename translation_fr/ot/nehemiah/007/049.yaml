lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן forme ici une formule généalogique répétée. « Les fils de » en préserve la structure formelle, tout en pouvant désigner un groupe familial ou une lignée plutôt que les seuls fils immédiats.
- source_word: חָנָן
  choice: Hanân
  rationale: Nom propre de personne ou de clan, translittéré en français; l’accent circonflexe signale la voyelle longue finale de la forme hébraïque.
- source_word: גִדֵּל
  choice: Guiddel
  rationale: Nom propre figurant dans la liste des serviteurs du Temple; « Gui- » rend naturellement en français le g dur devant i, et la consonne redoublée est conservée.
- source_word: גָחַר
  choice: Gahar
  rationale: Nom propre translittéré de manière lisible en français. Le h représente approximativement la consonne gutturale ח sans imposer une notation savante.
