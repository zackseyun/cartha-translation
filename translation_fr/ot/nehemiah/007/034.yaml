lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן introduit ici un groupe familial dans une liste de recensement. « Les fils de » conserve la forme hébraïque tout en restant claire en français.
- source_word: עֵילָם
  choice: Élam
  rationale: Nom propre translittéré selon l’usage français biblique ; il désigne ici une famille ou un groupe portant ce nom.
- source_word: אַחֵר
  choice: un autre
  rationale: L’adjectif peut signifier « autre » ou, selon la détermination comprise dans le contexte, « l’autre ». « Un autre Élam » est naturel en français et distingue ce groupe de celui déjà mentionné, sans imposer une détermination absente de la forme hébraïque.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1 254
  rationale: La suite de nombres signifie exactement « mille deux cents cinquante-quatre ». Les chiffres et l’espace comme séparateur de milliers conviennent à une liste de recensement en français moderne.
