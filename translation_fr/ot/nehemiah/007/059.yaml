  text: בְּנֵ֧י שְׁפַטְיָ֣ה בְנֵֽי חַטִּ֗יל בְּנֵ֛י פֹּכֶ֥רֶת הַצְּבָיִ֖ים בְּנֵ֥י אָמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/059.yaml
  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pochereth-hazzebaim[b], the sons of Amon.
translation:
  language: fr
  text: les fils de Shephatia[a], les fils de Hattil, les fils de Pokéreth-Hatsebaïm[b], les fils d’Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les descendants de » dans tout le verset. Dans les listes généalogiques, l’hébreu « fils de » désigne souvent une lignée familiale.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi comprendre « Pokéreth de Tsebaïm »; l’expression hébraïque est conservée ici comme un nom propre composé.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Rend directement le pluriel construit de בֵּן et conserve la structure répétitive de la liste. Dans ce contexte généalogique, l’expression peut désigner plus largement les descendants ou les membres d’une lignée.
- source_word: שְׁפַטְיָה
  choice: Shephatia
  rationale: Transcription française claire du nom propre hébreu, sans en traduire le sens.
- source_word: חַטִּיל
  choice: Hattil
  rationale: Transcription directe du nom propre, avec redoublement du t correspondant à la consonne hébraïque renforcée.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Pokéreth-Hatsebaïm
  rationale: L’ensemble est conservé comme nom propre composé. La transcription suit les sons hébreux et le trait d’union signale l’unité de la désignation familiale.
- source_word: אָמֽוֹן
  choice: Amon
  rationale: Forme française traditionnelle et transparente de ce nom propre dans la liste; il ne s’agit pas ici d’un nom commun.
