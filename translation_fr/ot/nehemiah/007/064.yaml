source:
  edition: WLC
  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: fr
  text: Ceux-ci cherchèrent leur document généalogique[a], mais on ne le trouva pas. Ils furent donc exclus du sacerdoce[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur inscription dans le registre généalogique ». L’hébreu évoque un écrit servant à établir leur filiation.
    reason: lexical_alternative
  - marker: b
    text: Ou « déclarés inaptes au sacerdoce ». Le verbe hébreu peut évoquer le fait d’être tenu pour souillé; ici, il désigne leur exclusion du service sacerdotal faute de filiation vérifiable.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ceux-ci
  rationale: Le démonstratif pluriel renvoie au groupe mentionné précédemment sans ajouter un nom absent de l’hébreu.
- source_word: בִּקְשׁוּ
  choice: cherchèrent
  rationale: Le verbe exprime ici la recherche d’une pièce écrite précise; « cherchèrent » convient au récit et reste direct.
- source_word: כְתָבָם הַמִּתְיַחְשִׂים
  choice: leur document généalogique
  rationale: כְּתָב désigne un écrit ou document, tandis que le participe de יחס situe celui-ci dans le cadre de l’établissement de la filiation. La formulation française rend naturellement l’idée d’une pièce écrite attestant l’ascendance, tout en signalant en note une autre analyse syntaxique possible.
- source_word: וְלֹא נִמְצָא
  choice: mais on ne le trouva pas
  rationale: Le verbe hébreu est au singulier; son sujet implicite le plus naturel est le document recherché. La tournure impersonnelle française conserve ce sens.
- source_word: וַיְגֹאֲלוּ
  choice: ils furent donc exclus
  rationale: Dans ce contexte administratif et sacerdotal, le verbe indique qu’ils furent déclarés impropres ou écartés. « Exclus » exprime clairement la conséquence sans imposer une notion plus précise d’impureté rituelle.
- source_word: מִן הַכְּהֻנָּה
  choice: du sacerdoce
  rationale: כְּהֻנָּה désigne la condition ou la fonction sacerdotale. « Du sacerdoce » est une formulation française directe et digne.
theological_decisions:
- issue: Portée de וַיְגֹאֲלוּ dans le contexte sacerdotal
  choice: exclus du sacerdoce
  alternative: déclarés impurs pour le sacerdoce; disqualifiés du sacerdoce
  rationale: Le défaut de preuve généalogique entraîne l’écartement de la fonction sacerdotale. La traduction retient le résultat concret sans affirmer que les personnes étaient rituellement impures en elles-mêmes.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Document généalogique » rend le contexte administratif de manière intelligible; les notes préservent l’ambiguïté syntaxique et la nuance littérale du verbe final.
