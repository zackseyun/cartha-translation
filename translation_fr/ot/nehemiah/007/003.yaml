  to: 'Je leur dis : « Les portes de Jérusalem ne devront pas être ouvertes avant que le soleil ne soit chaud[a]. Pendant que les gardes sont encore à leur poste, qu’ils ferment les battants et les tiennent fermés[b]. Désignez des gardes parmi les habitants de Jérusalem[c], chacun à son poste et chacun en face de sa maison. »'
  rationale: La révision supprime la précision non exprimée d’un verrou et clarifie que les gardes sont désignés parmi les résidents de Jérusalem. Elle conserve la structure injonctive, le caractère concret de « soleil ... chaud », et les ambiguïtés lexicales signalées dans les notes.
