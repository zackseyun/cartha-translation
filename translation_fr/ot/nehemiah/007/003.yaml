review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : interdiction d’ouvrir les portes avant que le soleil ne soit chaud, fermeture des battants pendant que les gardes sont en poste, puis désignation de gardes parmi les habitants. Toutefois, « verrouillent » spécifie un mécanisme de fermeture que l’hébreu אחז ne précise pas; le sens contextuel est plutôt tenir/assujettir les battants après les avoir fermés. « Établissez des gardes parmi les habitants » peut aussi se lire comme si les gardes étaient placés au milieu des habitants, plutôt que sélectionnés parmi eux.'
  naturalness: Le français est globalement moderne et digne. « Désignez des gardes parmi les habitants » est plus idiomatique et rend clairement la valeur partitive. « Les tiennent fermés » est naturel dans la séquence d’instructions et évite de surtraduire.
  terminology: « Portes », « battants », « gardes », « poste » et « en face de sa maison » sont appropriés. La révision maintient l’ambiguïté de משמרות au moyen de la note, sans imposer le sens de tours de garde.
  issues:
