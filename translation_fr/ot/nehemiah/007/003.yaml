source:
  edition: WLC
  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: fr
  text: 'Je leur dis : « Les portes de Jérusalem ne devront pas être ouvertes avant que le soleil ne soit chaud[a]. Pendant que les gardes sont encore à leur poste, qu’ils ferment les battants et les tiennent fermés[b]. Désignez des gardes parmi les habitants de Jérusalem[c], chacun à son poste et chacun en face de sa maison. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « avant que le soleil ne devienne chaud » : il ne s’agit donc pas simplement du lever du soleil, mais d’un moment plus avancé de la matinée.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les tiennent »; dans ce contexte, il s’agit de maintenir les battants fermés ou de les mettre en sûreté.
    reason: lexical_alternative
  - marker: c
    text: Ou « désignez des tours de garde parmi les habitants de Jérusalem ». Le terme hébreu peut désigner les gardes eux-mêmes ou les périodes et tâches de garde.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּתְחוּ
  choice: ne devront pas être ouvertes
  rationale: Le niphal exprime ici le passif, et לֹא avec l’inaccompli a valeur d’interdiction ou de consigne ferme.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: avant que le soleil ne soit chaud
  rationale: Cette formulation conserve l’image concrète de l’hébreu et indique un moment plus tardif que le simple lever du soleil.
- source_word: וְעַד הֵם עֹמְדִים
  choice: pendant que les gardes sont encore à leur poste
  rationale: Le verbe signifie littéralement « se tenir debout », mais le contexte de surveillance indique qu’ils sont encore en fonction ou à leur poste.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: qu’ils ferment les battants
  rationale: Les דְּלָתוֹת sont les battants des portes de la ville; « battants » évite l’ambiguïté entre les portes urbaines et leurs vantaux.
- source_word: וֶאֱחֹזוּ
  choice: les verrouillent
  rationale: Le verbe signifie littéralement « tenir, saisir »; après la fermeture des battants, il désigne leur immobilisation ou leur mise en sûreté, sans que le mécanisme soit explicitement nommé.
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת
  choice: établissez aussi des gardes
  rationale: Le hiphil de עמד signifie placer ou établir; מִשְׁמְרוֹת peut désigner soit les gardes, soit les tours de garde.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: parmi les habitants de Jérusalem
  rationale: 'Le contexte appelle un sens partitif : les gardes doivent être pris parmi les habitants de la ville.'
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  choice: chacun à son poste
  rationale: אִישׁ est distributif, et מִשְׁמָר désigne ici le poste ou la tâche de garde assignée.
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: et chacun en face de sa maison
  rationale: Cette traduction garde la valeur spatiale de נֶגֶד sans préciser davantage que l’hébreu l’emplacement exact.
