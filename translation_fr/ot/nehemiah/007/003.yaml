    issue: « les verrouillent » est trop spécifique pour וֶאֱחֹזוּ.
    rationale: Le verbe signifie littéralement « saisir/tenir » et, dans ce contexte, requiert que les battants soient rendus sûrs, mais ne mentionne ni serrure ni verrou.
  - severity: low
    issue: « Établissez des gardes parmi les habitants » est syntaxiquement ambigu.
    rationale: La construction peut suggérer un emplacement des gardes parmi la population. « Désignez ... parmi » exprime sans ambiguïté que les gardes sont pris parmi les habitants.
