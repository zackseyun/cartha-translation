  text: הַ/שֹּֽׁעֲרִ֗ים בְּנֵֽי שַׁלּ֤וּם בְּנֵֽי אָטֵר֙ בְּנֵֽי טַלְמֹ֣ן בְּנֵֽי עַקּ֔וּב בְּנֵ֥י חֲטִיטָ֖א בְּנֵ֣י שֹׁבָ֑י מֵאָ֖ה שְׁלֹשִׁ֥ים וּ/שְׁמֹנָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/045.yaml
  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
translation:
  language: fr
  text: 'Les gardiens des portes : les fils de Shalloum[a], les fils d’Ater, les fils de Talmôn, les fils d’Akkoub, les fils de Hatita, les fils de Shobaï : 138.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « fils de » peut désigner plus largement les membres d’une lignée ou d’un clan, et pas seulement les fils directs.
    reason: Précision lexicale sur l’étendue possible de בְּנֵי dans une liste généalogique.
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: les gardiens des portes
  rationale: Le terme désigne les personnes chargées de surveiller et de garder les portes, notamment dans le cadre du service du temple. Cette formulation est claire et naturelle en français moderne.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le sens littéral est « fils de », mais, dans cette liste généalogique et communautaire, l’expression peut désigner les membres d’une lignée ou d’un clan. La traduction conserve la structure répétitive de l’hébreu, tandis qu’une note en précise la portée possible.
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: אָטֵר
  choice: Ater
  rationale: Translittération du nom propre hébreu.
- source_word: טַלְמֹן
  choice: Talmôn
  rationale: Translittération française du nom propre, avec accent circonflexe pour rendre la voyelle longue.
- source_word: עַקּוּב
  choice: Akkoub
  rationale: Translittération française naturelle du nom propre hébreu, avec redoublement de la consonne et « ou » pour la voyelle /u/.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Translittération du nom propre hébreu, sans ajout d’une consonne finale absente de la prononciation.
- source_word: שֹׁבָי
  choice: Shobaï
  rationale: Translittération française qui distingue les deux voyelles finales au moyen du tréma.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: '138'
  rationale: La suite de nombres hébreux donne un total de 138. Les chiffres conviennent naturellement à une liste de recensement.
theological_decisions: []
