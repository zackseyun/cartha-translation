lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique, le pluriel construit de בֵּן peut désigner les fils au sens strict, mais aussi plus largement les descendants ou les membres d’une lignée. « Les fils de » conserve la formule hébraïque traditionnelle et reste naturelle dans ce registre.
- source_word: גַזָּם
  choice: Gazzam
  rationale: Nom propre transcrit en français sans être traduit.
- source_word: עֻזָּא
  choice: Ouzza
  rationale: Nom propre transcrit selon une graphie française qui rend naturellement la voyelle initiale hébraïque.
- source_word: פָסֵחַ
  choice: Paséah
  rationale: Nom propre transcrit en français; le « h » final représente la consonne hébraïque ח sans imposer une prononciation technique au lecteur.
