  rationale: Nom propre translittéré d’après la forme du texte massorétique. La graphie française emploie Y pour la consonne initiale.
- source_word: דַרְקוֹן
  choice: Darkôn
  rationale: Translittération du nom propre hébreu, avec accent circonflexe pour signaler la voyelle longue sans alourdir la lecture.
- source_word: גִדֵּל
  choice: Guiddel
  rationale: 'Translittération adaptée au français : « Gu » préserve le son dur de la consonne initiale devant i, et la consonne redoublée reflète le dagesh.'
