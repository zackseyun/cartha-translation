  rationale: Nom de lieu rendu selon sa forme française biblique usuelle.
- source_word: וָגָבַע
  choice: et Guéba
  rationale: Le texte hébreu porte גבע, qui correspond à Guéba, et non גבעה, qui correspond à Guibéa.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: six cent vingt et un
  rationale: Le nombre cardinal est écrit en toutes lettres dans un français naturel et conforme à la graphie moderne.
