  text: בְּנֵי לְבָנָ֥ה בְנֵי חֲגָבָ֖ה בְּנֵ֥י שַׁלְמָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/048.yaml
  text: the sons of Lebanah[a], the sons of Hagabah[b], the sons of Shalmai.
translation:
  language: fr
  text: les fils de Lebana[a], les fils de Hagaba, les fils de Shalmaï[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les descendants de » à chacune des trois occurrences de « les fils de » ; la formule généalogique hébraïque peut désigner une lignée familiale ou un clan, et pas seulement des fils au sens strict.
    reason: lexical_alternative
  - marker: b
    text: Certaines traditions de la liste parallèle donnent « Salmaï ». Le texte hébreu de Néhémie porte ici « Shalmaï ».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן est rendu directement par la formule généalogique française traditionnelle « les fils de ». Dans ce type de liste, elle peut désigner plus largement des descendants ou les membres d’une famille, possibilité signalée en note.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Nom propre translittéré selon un usage français naturel, sans conserver un h final qui ne se prononce pas en français.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Nom propre translittéré à partir de la forme massorétique, avec une graphie adaptée au français.
- source_word: שַׁלְמָי
  choice: Shalmaï
  rationale: Cette translittération représente le שׁ initial par « sh » et le yod final vocalique par « ï », tout en suivant la vocalisation massorétique de ce verset.
theological_decisions: []
translation_notes:
