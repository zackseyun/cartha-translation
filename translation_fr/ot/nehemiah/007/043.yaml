base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
translation:
  language: fr
  text: 'Les lévites : les fils de Yéchoua, de Qadmiel, des fils de Hodva[a] : 74.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « fils de Hodva » peut aussi signifier « descendants de Hodva » ou « membres de la famille de Hodva ».
    reason: Préciser la portée possible de l’expression généalogique hébraïque sans trancher entre filiation immédiate et appartenance à une lignée plus large.
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Les lévites
  rationale: Nom défini pluriel qui introduit un sous-groupe dans la liste du recensement; la formulation nominale conserve le style concis de la liste sans ajouter de verbe.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans un contexte généalogique, le terme peut désigner les fils au sens strict ou, plus largement, les descendants et membres d’une lignée. La traduction formelle préserve ici la structure hébraïque.
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Transcription française de la forme hébraïque postexilique יֵשׁוּעַ, sans la remplacer par la forme plus longue « Josué ».
- source_word: לְקַדְמִיאֵל
  choice: de Qadmiel
  rationale: Dans cette liste, la préposition לְ exprime un rattachement familial; « de » rend ce lien de façon concise.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: des fils de Hodva
  rationale: La répétition de לְ et le groupe généalogique sont conservés au lieu de simplifier une syntaxe hébraïque quelque peu condensée.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: '74'
  rationale: Le nombre du recensement est rendu en chiffres, conformément au style naturel d’une liste chiffrée en français moderne.
