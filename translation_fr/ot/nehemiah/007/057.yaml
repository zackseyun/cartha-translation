  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סוֹטַ֥י בְּנֵי סוֹפֶ֖רֶת בְּנֵ֥י פְרִידָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: fr
  text: 'Les descendants des serviteurs de Salomon : les descendants de Sotaï, les descendants de Soféreth, les descendants de Perida.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: les descendants de
  rationale: Dans cette liste généalogique de rapatriés, בְּנֵי désigne les membres d’une lignée ou d’un groupe familial, et non nécessairement des fils directs. « Les descendants de » exprime naturellement cette portée en français moderne.
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Dans l’expression עַבְדֵי שְׁלֹמֹה, le terme fonctionne comme la désignation traditionnelle d’un groupe héréditaire associé à Salomon. « Serviteurs » préserve cette désignation sans imposer ici la nuance plus forte d’« esclaves ».
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française conventionnelle du nom propre biblique.
- source_word: סוֹטַי
  choice: Sotaï
  rationale: Translittération française du nom propre, avec tréma pour signaler que les deux voyelles se prononcent séparément.
- source_word: סוֹפֶרֶת
  choice: Soféreth
  rationale: Le mot est traité comme un nom de famille et translittéré plutôt que traduit; cette graphie rend la vocalisation massorétique de façon lisible en français.
- source_word: פְרִידָא
  choice: Perida
  rationale: Translittération simple du nom propre conforme à la vocalisation du texte massorétique.
