source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: fr
  text: Voici ceux qui revinrent de Tel-Mélah, Tel-Harsha, Keroub, Addôn[a] et Immer. Ils ne purent faire connaître leur maison paternelle[b] et leur descendance, ni dire s’ils étaient d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esdras 2.59 porte « Addân » là où Néhémie donne ici « Addôn ».
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « la maison de leurs pères » ; cette expression désigne leur famille paternelle ou leur groupe ancestral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: Voici ceux qui revinrent
  rationale: Dans ce contexte postexilique, le participe de עלה désigne ceux qui remontèrent au pays. « Revinrent » exprime naturellement ce retour en français sans employer le terme technique « rapatriés ».
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: de Tel-Mélah, Tel-Harsha, Keroub, Addôn et Immer
  rationale: Les noms propres sont translittérés selon un usage français lisible. « Addôn » suit le texte consonantique de Néhémie, tandis qu’Esdras 2.59 présente une variante.
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: Ils ne purent indiquer
  rationale: Le hiphil de נגד signifie faire connaître ou déclarer. « Indiquer » convient au contexte généalogique sans ajouter explicitement l’idée juridique de preuve.
- source_word: בֵּית אֲבוֹתָם
  choice: leur maison ancestrale
  rationale: L’expression désigne la maison paternelle, c’est-à-dire le groupe familial d’origine. « Maison ancestrale » conserve l’image hébraïque tout en restant intelligible en français actuel.
- source_word: וְזַרְעָם
  choice: ni leur lignée
  rationale: זֶרַע signifie littéralement « semence » et, ici, la filiation ou la descendance. « Lignée » rend le sens généalogique attendu.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: ni dire s’ils étaient d’Israël
  rationale: La formulation conserve l’incertitude exprimée par אִם et reste proche de « s’ils étaient issus d’Israël », sans réduire nécessairement Israël à une simple désignation géographique.
theological_decisions:
- issue: Nature de l’appartenance à Israël
  choice: s’ils étaient d’Israël
  alternative: s’ils étaient Israélites
  rationale: La formulation retenue préserve la tournure généalogique et l’ambiguïté du texte, sans définir plus précisément la nature ethnique, familiale ou communautaire de cette appartenance.
translation_notes:
  register: Français moderne, clair et digne. La première proposition est séparée de l’explication suivante pour alléger une longue phrase de liste. Les noms propres sont francisés avec modération, et les expressions généalogiques restent transparentes sans devenir techniques.
