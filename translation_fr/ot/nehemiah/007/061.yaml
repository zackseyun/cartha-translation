revisions:
- from: Voici ceux qui revinrent de Tel-Mélah, Tel-Harsha, Keroub, Addôn[a] et Immer. Ils ne purent indiquer leur maison ancestrale[b] ni leur lignée, ni dire s’ils étaient d’Israël.
  to: Voici ceux qui revinrent de Tel-Mélah, Tel-Harsha, Keroub, Addôn[a] et Immer. Ils ne purent faire connaître leur maison paternelle[b] et leur descendance, ni dire s’ils étaient d’Israël.
  rationale: La révision remplace « maison ancestrale » par « maison paternelle », plus conforme à l’expression généalogique hébraïque, et remplace « lignée » par « descendance », qui correspond plus directement à זֶרַע. La dernière coordination est simplifiée afin de rendre clairement l’incapacité à faire connaître leur identité familiale et à dire s’ils étaient d’Israël, sans imposer une notion juridique de preuve.
