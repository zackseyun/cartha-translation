review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : il s’agit d’un groupe de personnes revenues de lieux nommés et incapables d’établir leur appartenance généalogique à Israël. Toutefois, « maison ancestrale » peut évoquer une demeure héritée plutôt que la « maison paternelle » (groupe familial) du texte hébreu. La coordination « ni leur lignée, ni dire » alourdit et dédouble inutilement l’infinitif gouverné par « ne purent ».'
  naturalness: Le français est globalement clair et de registre approprié. « Maison paternelle » est à la fois plus exact et plus idiomatique dans un contexte biblique généalogique. « Leur descendance » rend זַרְעָם plus directement que « leur lignée », qui peut désigner autant l’ascendance que la descendance. La formulation révisée garde l’incertitude de « s’ils étaient d’Israël » tout en restant fluide.
  terminology: Les noms Tel-Mélah, Tel-Harsha, Keroub, Addôn et Immer sont cohérents avec une translittération française lisible. « D’Israël » préserve sans surinterprétation la formulation généalogique du texte. « Maison paternelle » restitue précisément בית אבות.
  issues:
  - severity: medium
    issue: « maison ancestrale » est imprécis dans ce contexte.
    rationale: בית אבות désigne la maison/famille paternelle, donc l’identité de clan ou de famille, et non principalement une demeure ancestrale.
  - severity: low
    issue: La construction « ni leur lignée, ni dire s’ils » est stylistiquement lourde.
    rationale: Le texte hébreu relie sous la même incapacité la déclaration de l’ascendance familiale et la question de l’appartenance à Israël. Une coordination plus directe améliore la lisibilité sans modifier le sens.
  revised_text: Voici ceux qui revinrent de Tel-Mélah, Tel-Harsha, Keroub, Addôn[a] et Immer. Ils ne purent faire connaître leur maison paternelle[b] et leur descendance, ni dire s’ils étaient d’Israël.
