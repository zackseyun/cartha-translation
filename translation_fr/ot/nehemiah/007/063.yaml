  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: fr
  text: 'Et parmi les prêtres : les fils de Hobaya, les fils de Hakkots et les fils de Barzillaï, qui avait épousé l’une des filles de Barzillaï le Galaadite et fut appelé sous leur nom.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: Et parmi les prêtres
  rationale: Rend naturellement le sens partitif de מִן et introduit les familles sacerdotales au sein de la liste.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Conserve la structure répétée du registre hébreu; dans ce contexte généalogique, l’expression désigne aussi les descendants ou la famille.
- source_word: חֳבַיָּה
  choice: Hobaya
  rationale: Translittération française claire du nom hébreu.
- source_word: הַקּוֹץ
  choice: Hakkots
  rationale: Translittération qui intègre l’article hébreu traditionnellement attaché au nom de cette famille sacerdotale.
- source_word: בַרְזִלַּי
  choice: Barzillaï
  rationale: Forme française usuelle du nom, employée de manière cohérente pour la famille et pour le Galaadite.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת בַרְזִלַּי הַגִּלְעָדִי אִשָּׁה
  choice: qui avait épousé l’une des filles de Barzillaï le Galaadite
  rationale: Rend idiomatiquement la construction hébraïque « prendre une femme parmi les filles de » tout en conservant l’antériorité de ce mariage par rapport au changement de nom.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: et avait pris leur nom
  rationale: Exprime en français courant le fait d’être désigné par le nom de cette famille; le pluriel « leur » reste conforme au suffixe hébreu.
theological_decisions: []
translation_notes:
  register: Style de registre généalogique, digne et lisible. La répétition « les fils de » est maintenue afin de refléter la structure de la liste, tandis que la tournure matrimoniale est rendue en français naturel.
