  rationale: Translittération française claire du toponyme hébreu ; « Kephira » est conservé en note comme graphie possible.
- source_word: וּבְאֵרוֹת
  choice: et Bééroth
  rationale: La conjonction est rendue par « et » et le nom de lieu est translittéré ; les deux voyelles sont distinguées pour refléter la forme hébraïque.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: '743'
  rationale: Le nombre hébreu correspond exactement à 743 ; les chiffres conviennent au style d’une liste de recensement.
