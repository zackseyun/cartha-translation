  text: הַֽ/כֹּהֲנִ֑ים בְּנֵ֤י יְדַֽעְיָה֙ לְ/בֵ֣ית יֵשׁ֔וּעַ תְּשַׁ֥ע מֵא֖וֹת שִׁבְעִ֥ים וּ/שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/039.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: fr
  text: 'Les prêtres : les fils de Yedaïa[a], de la maison de Yéchoua[b], neuf cent soixante-treize.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « fils de » peut désigner des descendants ou les membres d’une lignée familiale, et non seulement des fils immédiats.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi rendre ce nom par « Josué », mais « Yéchoua » reflète mieux la forme hébraïque employée dans ce contexte postexilique.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Les prêtres
  rationale: Le nom défini au pluriel introduit une catégorie du recensement. La formulation nominale respecte la structure concise de la liste sans ajouter de verbe.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans ce contexte généalogique, le terme peut désigner des descendants ou les membres d’une lignée. « Les fils de » conserve la forme hébraïque, tandis que la note en précise l’étendue possible.
- source_word: יְדַעְיָה
  choice: Yedaïa
  rationale: Translittération française moderne du nom propre hébreu, qui en reflète la forme sans le traduire.
- source_word: לְבֵית יֵשׁוּעַ
  choice: de la maison de Yéchoua
  rationale: Dans cette liste, la préposition indique l’appartenance, et « maison » désigne ici une famille ou une lignée.
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Cette translittération reflète la forme hébraïque postexilique du nom et permet de la distinguer de la forme française traditionnelle « Josué », également possible.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: neuf cent soixante-treize
  rationale: Rendu direct du nombre cardinal 973 selon l’usage orthographique français courant.
