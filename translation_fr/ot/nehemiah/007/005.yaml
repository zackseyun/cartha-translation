review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l’impulsion intérieure attribuée à Dieu, le rassemblement des groupes civiques et l’existence d’un registre de lignées sont bien rendus. Toutefois, « pour procéder à leur inscription généalogique » déplace légèrement l’action vers Néhémie comme agent de l’inscription, tandis que le hitpael לְהִתְיַחֵשׂ désigne l’enregistrement/établissement des personnes selon leur ascendance.'
  naturalness: « Me mit à cœur » est moins idiomatique en français moderne que « me donna à cœur ». « Être inscrits selon leurs généalogies » est à la fois plus naturel et plus proche du sens administratif du texte. « Remontés » rend clairement l’idée du retour et de la montée sans exiger une paraphrase explicative dans le verset.
  terminology: « Notables », « responsables », « peuple » et « registre généalogique » conviennent au registre narratif et administratif. Le passé simple est approprié. La formulation révisée conserve la réserve du texte sur la modalité de l’action divine.
  issues:
  - severity: medium
    issue: Agent et valeur de l’inscription généalogique
    rationale: « Procéder à leur inscription » présente Néhémie comme celui qui effectue l’opération. La forme réflexive hébraïque vise plutôt l’enregistrement des personnes selon leur généalogie ; « pour qu’ils soient inscrits selon leurs généalogies » conserve mieux cette nuance.
  - severity: low
    issue: Idiomaticité de l’expression d’impulsion divine
    rationale: « Me mit à cœur » est compréhensible, mais « me donna à cœur » est une tournure française biblique courante et naturelle qui rend directement l’hébreu « donna à mon cœur ».
  - severity: low
    issue: Clarté de la montée des premiers arrivants
    rationale: « Étaient montés les premiers » peut évoquer une simple montée physique. « Étaient remontés les premiers » exprime plus clairement, sans surinterprétation, le mouvement de retour impliqué par le contexte.
  revised_text: 'Alors mon Dieu me donna à cœur de rassembler les notables, les responsables et le peuple, pour qu’ils soient inscrits selon leurs généalogies[a]. Je trouvai le registre généalogique de ceux qui étaient remontés les premiers[b], et j’y trouvai écrit :'
