base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: fr
  text: 'Alors mon Dieu me donna à cœur de rassembler les notables, les responsables et le peuple, pour qu’ils soient inscrits selon leurs généalogies[a]. Je trouvai le registre généalogique de ceux qui étaient remontés les premiers[b], et j’y trouvai écrit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour les recenser selon leurs lignées familiales ». L’hébreu évoque une inscription officielle fondée sur l’ascendance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de ceux qui étaient remontés au début ». Il s’agit du premier groupe revenu de l’exil vers Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: Alors mon Dieu me mit à cœur
  rationale: Cette tournure française naturelle conserve l’initiative divine et l’idée d’une impulsion intérieure, sans préciser indûment le mode de révélation.
- source_word: וָאֶקְבְּצָה
  choice: de rassembler
  rationale: L’infinitif exprime naturellement en français le contenu de l’impulsion donnée par Dieu, tout en respectant la valeur volitive de la forme hébraïque.
- source_word: הַחֹרִים
  choice: les notables
  rationale: Dans le cadre civique de Néhémie, le terme désigne les membres éminents de la société. « Notables » est actuel et moins susceptible d’évoquer exclusivement une noblesse héréditaire.
- source_word: הַסְּגָנִים
  choice: les responsables
  rationale: Le mot désigne des autorités administratives subalternes. « Responsables » reste compréhensible et suffisamment large sans imposer un titre institutionnel trop précis.
- source_word: לְהִתְיַחֵשׂ
  choice: pour procéder à leur inscription généalogique
  rationale: Cette formulation rend l’idée d’un enregistrement officiel fondé sur l’ascendance, sans forcer la voix grammaticale ni réduire l’action à la simple rédaction d’une généalogie.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: le registre généalogique
  rationale: « Registre » exprime clairement la nature administrative du document écrit et rend l’expression hébraïque avec naturel en français moderne.
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: ceux qui étaient montés les premiers
  rationale: Cette traduction conserve l’image biblique de la montée vers Juda ou Jérusalem et identifie le premier groupe sans paraphraser par « exilés revenus ».
- source_word: וָאֶמְצָא כָתוּב בּוֹ
  choice: 'et j’y trouvai écrit :'
  rationale: La formule française suit de près l’hébreu et introduit naturellement le contenu du registre dans les versets suivants.
theological_decisions:
- issue: Nature de l’impulsion divine dans la conduite de Néhémie
  choice: mon Dieu me mit à cœur
  alternative: Dieu m’inspira
  rationale: L’hébreu attribue clairement l’initiative à Dieu, mais ne définit pas le mode de cette communication. La traduction retenue préserve cette réserve et évite de présenter explicitement l’acte comme une inspiration formelle.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique. « Notables » et « responsables » évitent à la fois l’archaïsme administratif et une précision institutionnelle absente de l’hébreu.
