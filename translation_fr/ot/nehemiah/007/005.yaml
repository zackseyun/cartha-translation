revisions:
- from: 'Alors mon Dieu me mit à cœur de rassembler les notables, les responsables et le peuple pour procéder à leur inscription généalogique[a]. Je trouvai le registre généalogique de ceux qui étaient montés les premiers[b], et j’y trouvai écrit :'
  to: 'Alors mon Dieu me donna à cœur de rassembler les notables, les responsables et le peuple, pour qu’ils soient inscrits selon leurs généalogies[a]. Je trouvai le registre généalogique de ceux qui étaient remontés les premiers[b], et j’y trouvai écrit :'
  rationale: La révision corrige une légère dérive d’agent dans la formule relative à l’inscription généalogique et améliore l’idiomaticité française, tout en préservant l’initiative divine, le registre administratif et l’ambiguïté sobre du texte source. Les ancres de notes sont maintenues après les expressions qu’elles éclairent.
