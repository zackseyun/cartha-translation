  text: מִ֠/לְּ/בַד עַבְדֵי/הֶ֤ם וְ/אַמְהֹֽתֵי/הֶם֙ אֵ֔לֶּה שִׁבְעַ֣ת אֲלָפִ֔ים שְׁלֹ֥שׁ מֵא֖וֹת שְׁלֹשִׁ֣ים וְ/שִׁבְעָ֑ה וְ/לָ/הֶ֗ם מְשֹֽׁרֲרִים֙ וּ/מְשֹׁ֣רֲר֔וֹת מָאתַ֖יִם וְ/אַרְבָּעִ֥ים וַ/חֲמִשָּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/067.yaml
  text: besides their male and female servants[a], of whom there were 7,337; and they had 245 male and female singers.
translation:
  language: fr
  text: sans compter leurs esclaves, hommes et femmes[a], qui étaient au nombre de 7 337. Ils avaient aussi 245 chanteurs et chanteuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs et servantes ». Les termes hébreux peuvent avoir un sens plus général, mais, dans ce contexte de recensement, ils désignent probablement des esclaves, hommes et femmes, attachés aux maisonnées.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: sans compter
  rationale: Cette expression introduit naturellement en français un groupe ajouté au total précédent dans le contexte d’un recensement.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: leurs esclaves, hommes et femmes
  rationale: עֶבֶד et אָמָה peuvent désigner des serviteurs ou des esclaves. Ici, leur dénombrement comme membres dépendants des maisonnées met vraisemblablement en avant leur condition servile; la formulation conserve aussi la distinction de genre explicite en hébreu.
- source_word: אֵלֶּה
  choice: qui étaient au nombre de
  rationale: Le démonstratif, littéralement « ceux-ci », annonce le nombre. Cette tournure restitue sa fonction dans un français naturel de recensement.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7 337
  rationale: La notation chiffrée avec l’espacement français moderne convient à une liste de recensement et préserve exactement le nombre.
- source_word: וְלָהֶם
  choice: Ils avaient aussi
  rationale: La construction possessive hébraïque est rendue idiomatiquement par « ils avaient »; « aussi » explicite la valeur additive de la conjonction dans ce relevé.
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: chanteurs et chanteuses
  rationale: Les participes masculin et féminin distinguent explicitement les deux genres; la paire française les reproduit avec naturel.
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: La notation chiffrée est claire et adaptée au registre numérique du passage.
