  text: וּ/מֵֽ/רָאשֵׁ֣י הָֽ/אָב֗וֹת נָֽתְנוּ֙ לְ/אוֹצַ֣ר הַ/מְּלָאכָ֔ה זָהָ֕ב דַּרְכְּמוֹנִ֖ים שְׁתֵּ֣י רִבּ֑וֹת וְ/כֶ֕סֶף מָנִ֖ים אַלְפַּ֥יִם וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: fr
  text: Parmi les chefs de famille, certains donnèrent au trésor pour les travaux vingt mille dariques d’or[a] et deux mille deux cents mines d’argent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La darique était une monnaie d’or perse.
    reason: cultural_note
  - marker: b
    text: La mine était une unité ancienne de poids et, par extension, de valeur monétaire.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Des chefs de familles ancestrales
  rationale: 'Le partitif « des » rend naturellement l’idée de provenance ou de sélection exprimée par מִן : il s’agit de chefs appartenant à cet ensemble, sans affirmer que tous ont donné. « Familles ancestrales » exprime ici les groupes généalogiques désignés par הָאָבוֹת dans un français moderne.'
- source_word: נָתְנוּ
  choice: donnèrent
  rationale: Le passé simple convient au récit historique et reproduit sans ajout interprétatif le sens du qal accompli.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: au trésor destiné aux travaux
  rationale: אוֹצָר désigne le dépôt de biens précieux ou trésor, tandis que הַמְּלָאכָה renvoie aux travaux financés. Cette formulation rend clairement la destination sans présenter les travaux eux-mêmes comme propriétaires du trésor.
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: dariques d’or
  rationale: La darique est la monnaie d’or perse historiquement visée; conserver ce terme maintient la précision culturelle du texte.
- source_word: שְׁתֵּי רִבּוֹת
  choice: vingt mille
  rationale: La tournure hébraïque signifie littéralement « deux dizaines de milliers »; « vingt mille » est son équivalent numérique naturel.
- source_word: וְכֶסֶף מָנִים
  choice: et ... mines d’argent
  rationale: La mine est une unité ancienne de poids et, par extension, de valeur monétaire. L’ordre français « mines d’argent » rend naturellement le matériau כֶסֶף.
- source_word: אַלְפַּיִם וּמָאתָיִם
  choice: deux mille deux cents
  rationale: Formulation numérique standard en français contemporain.
