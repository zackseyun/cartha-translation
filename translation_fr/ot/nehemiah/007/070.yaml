revisions:
- from: Des chefs de familles ancestrales[b] donnèrent au trésor destiné aux travaux vingt mille dariques d’or[a] et deux mille deux cents mines d’argent[c].
  to: Parmi les chefs de famille, certains donnèrent au trésor pour les travaux vingt mille dariques d’or[a] et deux mille deux cents mines d’argent[b].
  rationale: La révision remplace une expression française peu naturelle par « chefs de famille » et rend explicitement, dans le texte même, la valeur partitive de « parmi ». Elle simplifie aussi la formulation du trésor sans modifier le sens. La note lexicale devenue inutile est supprimée; les deux notes culturelles nécessaires sont conservées avec des marqueurs adaptés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:49:23Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général et les quantités sont exacts. Toutefois, « familles ancestrales » est une expression peu idiomatique et ne rend pas aussi clairement la fonction administrative et généalogique de רָאשֵׁי הָאָבוֹת. « Parmi les chefs de famille, certains » exprime explicitement la valeur partitive de מִן sans suggérer que tous ont contribué.
  naturalness: La phrase révisée est plus fluide en français international moderne. « Au trésor pour les travaux » est plus direct que « au trésor destiné aux travaux » tout en conservant le lien avec l’œuvre financée.
  terminology: « Chefs de famille » est le terme français moderne le plus naturel ici pour les responsables des groupes familiaux. « Dariques » et « mines » préservent avec justesse les unités anciennes; les notes culturelles les expliquent adéquatement.
  issues:
  - severity: medium
    issue: « familles ancestrales » est maladroit et imprécis dans ce contexte.
    rationale: Cette expression peut évoquer simplement des familles ayant des ancêtres, plutôt que les unités de parenté ou maisons paternelles dont il est question. « Chefs de famille » est plus naturel et communique mieux le rôle des רָאשֵׁי הָאָבוֹת.
  - severity: low
    issue: La note b propose une littéralité qui ne correspond pas exactement à sa formulation française.
    rationale: « Parmi les chefs des maisons ancestrales » n’est pas une formulation plus littérale claire du syntagme hébreu et conserve l’expression peu naturelle « maisons ancestrales ». La construction principale peut rendre directement le partitif, sans note lexicale.
  revised_text: Parmi les chefs de famille, certains donnèrent au trésor pour les travaux vingt mille dariques d’or[a] et deux mille deux cents mines d’argent[b].
  revised_footnotes:
