translation_notes:
  register: Français international moderne, clair et digne. « Temple » porte une majuscule pour désigner le sanctuaire de Jérusalem. La tournure « étaient au nombre de » rend naturellement la fonction totalisatrice de la proposition nominale hébraïque.
