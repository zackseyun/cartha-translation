base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/060.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: fr
  text: Tous les serviteurs du Temple et les fils des serviteurs de Salomon étaient au nombre de trois cent quatre-vingt-douze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Netinim », translittération traditionnelle du nom donné à une catégorie de serviteurs du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Tous
  rationale: Dans ce contexte de recensement, כָּל introduit le total des deux groupes nommés; « Tous » est naturel et concis.
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: Le terme désigne une catégorie reconnue de personnes affectées au service du Temple. Cette traduction fonctionnelle est immédiatement compréhensible; la translittération traditionnelle est conservée en note.
- source_word: וּבְנֵי
  choice: et les fils de
  rationale: בְּנֵי signifie formellement « fils de » et peut désigner des descendants. Ici, la formulation littérale préserve ce qui semble être le nom administratif traditionnel du groupe.
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans cette appellation collective, « serviteurs » évite de préciser indûment leur condition juridique.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: trois cent quatre-vingt-douze
  rationale: Le nombre cardinal hébreu est écrit en toutes lettres, conformément à l’usage du texte biblique courant; « cent » et « vingt » restent invariables puisqu’ils sont suivis.
