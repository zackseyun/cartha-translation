- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן désigne ici les membres d’une lignée ou d’un clan. « Les fils de » conserve l’expression généalogique hébraïque tout en restant naturelle dans une liste en français.
- source_word: עֵילָם
  choice: Élam
  rationale: Le nom propre est translittéré selon l’usage français biblique. Dans ce contexte, il désigne la famille ou le clan d’Élam, plutôt que la région géopolitique.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1 254
  rationale: La suite de nombres hébraïque donne un total de 1 254. L’écriture chiffrée avec une espace comme séparateur des milliers suit l’usage français moderne et convient à cette liste de recensement. Aucun terme équivalant à « personnes » n’est explicite dans l’hébreu.
