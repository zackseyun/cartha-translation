- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן désigne ici les membres d’une lignée ou d’un clan. « Les fils de » conserve la forme généalogique concise de la liste tout en restant idiomatique en français biblique moderne.
