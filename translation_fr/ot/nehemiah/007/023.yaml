  rationale: Nom propre translittéré en français, avec « ç » pour représenter le son consonantique /ts/ du tsadé et un tréma afin de marquer la séparation des voyelles finales.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וְאַרְבָּעָה
  choice: trois cent vingt-quatre
  rationale: Rendu conforme à l’usage numérique français moderne ; « cent » reste invariable puisqu’il est suivi d’un autre nombre.
