  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד הַ/כֹּהֵ֖ן לְ/אוּרִ֥ים וְ/תוּמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: fr
  text: Le gouverneur[a] leur ordonna de ne pas manger des aliments très saints[b] jusqu’à ce qu’un prêtre se présente avec l’ourim et le toummim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Tirshata », titre administratif d’origine perse.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des portions sacerdotales classées comme « très saintes », et non du sanctuaire intérieur appelé le « Saint des saints ».
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: le gouverneur
  rationale: Ce titre administratif d’origine perse désigne ici le gouverneur. Le traduire communique naturellement la fonction en français moderne; la translittération « Tirshata » est conservée en note.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: leur ordonna de ne pas manger
  rationale: La proposition rapporte la teneur de la directive du gouverneur. Cette formulation française exprime clairement l’interdiction sans l’alourdir.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: des aliments très saints
  rationale: Dans ce contexte de légitimité sacerdotale, l’expression superlative désigne les portions sacrées que les prêtres pouvaient manger, et non le sanctuaire intérieur.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: jusqu’à ce qu’un prêtre se présente
  rationale: La construction marque le terme futur de l’interdiction. L’article hébreu peut avoir une valeur générique; « un prêtre » évite de suggérer un individu déjà identifié. « Se présente » rend naturellement l’idée d’entrer en fonction ou d’être disponible pour trancher la question.
- source_word: לְאוּרִים וְתוּמִּים
  choice: avec l’ourim et le toummim
  rationale: Les noms traditionnels des moyens sacerdotaux de discernement sont translittérés. « Avec » préserve la portée large de la préposition hébraïque, sans préciser indûment le mécanisme de consultation.
theological_decisions:
- issue: Référent de « très saints »
  choice: les aliments ou portions sacerdotales classés comme très saints
  alternative: le Saint des saints, c’est-à-dire le sanctuaire intérieur
  rationale: Le contexte concerne des hommes dont l’ascendance sacerdotale n’a pas pu être établie et leur droit de manger les portions sacrées. Il ne s’agit donc pas de l’accès au sanctuaire intérieur.
- issue: Traduction du titre perse
  choice: le gouverneur
  alternative: le Tirshata
  rationale: Il s’agit d’un titre administratif plutôt que d’un nom propre. Traduire sa fonction rend le sens immédiatement accessible, tout en signalant la forme traditionnelle en note.
- issue: Fonction de l’ourim et du toummim
  choice: maintenir la formulation générale « avec »
  alternative: expliciter « qui consulte au moyen de l’ourim et du toummim »
  rationale: Le texte évoque un prêtre associé à l’ourim et au toummim sans décrire précisément la procédure. La traduction conserve cette retenue et l’ambiguïté du rapport exprimé par לְ.
translation_notes:
  register: Français international moderne, clair et digne. « Aliments très saints » explicite le référent alimentaire imposé par le contexte tout en conservant la catégorie cultuelle. Les formes « ourim » et « toummim » suivent une translittération française lisible.
