  text: the sons of Keros[a], the sons of Sia, the sons of Padon.
translation:
  language: fr
  text: Les fils de Kéros[a], les fils de Sia, les fils de Padon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les descendants de », pour chacune des occurrences de « les fils de » ; la formule généalogique hébraïque peut désigner une lignée familiale plus large, et non seulement des fils au sens strict.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique, le pluriel construit de בֵּן désigne l’appartenance à une lignée ou à une famille. « Les fils de » conserve la formule hébraïque et le registre traditionnel de la liste, tout en restant clair en français.
- source_word: קֵירֹס
  choice: Kéros
  rationale: Nom propre translittéré d’après la forme hébraïque ; l’accent indique naturellement la voyelle initiale en français.
- source_word: סִיעָא
  choice: Sia
  rationale: Nom propre translittéré sans lui attribuer de sens interprétatif ; « Sia » est une forme française simple et lisible.
- source_word: פָדוֹן
  choice: Padôn
  rationale: Nom propre translittéré d’après les consonnes et les voyelles du texte hébreu ; l’accent circonflexe rend lisible la voyelle longue sans alourdir la forme.
theological_decisions: []
