  source_fidelity: 'La structure répétitive « les fils de » rend fidèlement les trois occurrences de בְּנֵי. Les noms sont correctement traités comme des noms de groupe/famille translittérés. Toutefois, la graphie française proposée pour נפושסים (« Nefoushesim ») est inutilement éloignée de la forme hébraïque et de la transcription française usuelle : le samekh doit être rendu par s, non par sh. « Nefoussim » conserve mieux la séquence consonantique du texte massorétique.'
