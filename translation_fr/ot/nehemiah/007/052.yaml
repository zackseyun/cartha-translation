lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique, la formule construite introduit une famille ou un groupe. « Les fils de » conserve la structure répétitive de l’hébreu tout en restant claire en français.
- source_word: בֵסַי
  choice: Bésaï
  rationale: Nom propre translittéré selon les usages naturels du français ; les accents indiquent clairement la prononciation, et le tréma sépare les voyelles finales.
- source_word: מְעוּנִים
  choice: Méounim
  rationale: La translittération préserve l’ambiguïté entre un nom de groupe et une désignation ethnique, sans imposer l’interprétation plus précise « Méounites ».
- source_word: נפושסים
  choice: Nefoushesim
  rationale: Cette translittération française représente directement la forme consonantique fournie, notamment le son « sh » par « sh », tout en traitant le terme comme un nom de famille ou de groupe.
