  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: fr
  text: 'Et ce que donna le reste du peuple : 20 000 dariques d’or[a], 2 000 mines d’argent[b] et 67 tuniques de prêtres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La darique était une monnaie perse en or.
    reason: cultural_note
  - marker: b
    text: La mine était une ancienne unité de poids et, par extension, de valeur monétaire.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ שְׁאֵרִית הָעָם
  choice: Le reste du peuple donna
  rationale: La construction relative de reprise est rendue par une phrase française directe et naturelle. Dans cette liste administrative, שְׁאֵרִית désigne le reste de la population plutôt qu’un « reste » au sens théologique.
- source_word: זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹא
  choice: 20 000 dariques d’or
  rationale: Le terme historique précis est conservé, et l’ordre des mots est adapté au français moderne.
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: 2 000 mines d’argent
  rationale: מָנִים désigne des mines, unités anciennes de poids et, par extension, de valeur; aucun équivalent moderne conjectural n’est imposé.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: tuniques pour les prêtres
  rationale: Cette formulation naturelle indique les destinataires sans imposer que le génitif hébreu décrive techniquement une catégorie liturgique de vêtements.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: '67'
  rationale: Notation numérique claire et courante en français moderne.
theological_decisions:
- issue: Sens de שְׁאֵרִית הָעָם
  choice: le reste du peuple
  alternative: le reste préservé du peuple / le restant du peuple
  rationale: Le contexte distingue ici les autres donateurs des groupes déjà mentionnés; rien n’exige une notion théologique de « reste fidèle ».
translation_notes:
  register: Français international moderne, sobre et digne. Les termes historiques « darique » et « mine » sont conservés et expliqués en notes. Les nombres sont écrits en chiffres pour la lisibilité d’un inventaire.
