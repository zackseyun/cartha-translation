- from: Lorsque la muraille eut été construite et que j’eus posé les portes, les gardiens des portes, les chanteurs et les lévites furent désignés[a].
  to: Lorsque la muraille fut construite et que j’eus mis en place les portes, les portiers, les chanteurs et les lévites furent désignés[a].
  rationale: 'Révision limitée à deux expressions : « mis en place les portes » améliore la précision et l’idiomaticité, et « portiers » adopte le terme français courant pour les responsables des portes. La note et son ancrage sont conservés.'
