  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר נִבְנְתָה֙ הַ/חוֹמָ֔ה וָ/אַעֲמִ֖יד הַ/דְּלָת֑וֹת וַ/יִּפָּֽקְד֛וּ הַ/שּׁוֹעֲרִ֥ים וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: fr
  text: Lorsque la muraille fut construite et que j’eus mis en place les portes, les portiers, les chanteurs et les lévites furent désignés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent affectés » ou « furent recensés » ; le verbe hébreu peut désigner plus largement une mesure administrative.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La tournure introduit la circonstance temporelle du récit. « Lorsque » rend naturellement cette fonction sans ajouter un marqueur discursif absent du texte.
- source_word: נִבְנְתָה הַחוֹמָה
  choice: la muraille eut été construite
  rationale: Le nifal parfait de בנה est passif. Le passé antérieur marque en français soutenu mais accessible l’antériorité par rapport à la désignation qui suit, sans ajouter l’idée explicite de reconstruction.
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: j’eus posé les portes
  rationale: Le hifil de עמד signifie ici faire tenir ou mettre en place. « Poser les portes » est idiomatique dans ce contexte architectural et respecte le sens littéral de דְּלָתוֹת.
- source_word: וַיִּפָּקְדוּ
  choice: furent désignés
  rationale: Le nifal de פקד peut exprimer une mesure administrative telle que désigner, affecter ou recenser. « Furent désignés » convient à l’organisation de ces groupes tout en évitant de surspécifier la procédure.
- source_word: הַשּׁוֹעֲרִים
  choice: les gardiens des portes
  rationale: Le terme désigne ceux qui ont la charge des portes. Cette formulation est claire en français international et ne leur attribue pas nécessairement une fonction militaire.
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le participe substantivé issu de שׁיר désigne directement les chanteurs, notamment dans le cadre cultuel.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: « Lévites » est la désignation française établie de ce groupe.
theological_decisions: []
