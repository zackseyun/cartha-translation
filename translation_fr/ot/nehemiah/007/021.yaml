  text: 'les fils d’Ater[a], d’Ézéchias : quatre-vingt-dix-huit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les descendants d’Ater, d’Ézéchias ». L’hébreu peut désigner un groupe issu d’Ater et associé à Ézéchias, peut-être une subdivision familiale.'
    reason: Alternative lexicale et clarification de l’affiliation ambiguë exprimée par לְחִזְקִיָּה, sans imposer « branche » dans le texte.
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans ce contexte de recensement généalogique, le pluriel construit de בֵּן peut désigner les descendants ou les membres d’un groupe familial. « Les fils de » conserve la forme traditionnelle de la liste tout en restant clair en français moderne.
- source_word: אָטֵר
  choice: Ater
  rationale: Nom propre de personne ou de famille, translittéré sous la forme française usuelle.
- source_word: לְחִזְקִיָּה
  choice: de la branche d’Ézéchias
  rationale: Le לְ marque vraisemblablement ici l’appartenance ou une subdivision au sein de la famille d’Ater. L’explicitation « de la branche » rend cette relation naturelle en français sans la présenter comme absolument certaine.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: quatre-vingt-dix-huit
  rationale: Nombre cardinal rendu selon l’usage standard du français international moderne.
