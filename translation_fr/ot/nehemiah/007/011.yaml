  text: 'les fils de Pahath-Moab[a], des fils de Yéchoua et de Joab : 2 818.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les descendants de Pahath-Moab… les descendants de Yéchoua et de Joab ». En hébreu, « fils de » peut désigner une lignée familiale plus large, et non seulement des fils directs.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste de recensement, le terme désigne un groupe familial ou une lignée. « Les fils de » conserve l’expression hébraïque tout en laissant entendre son sens collectif.
- source_word: פַחַת מוֹאָב
  choice: Pahath-Moab
  rationale: Nom propre translittéré plutôt que traduit; le trait d’union rend lisible l’unité du nom composé.
- source_word: לִבְנֵי
  choice: parmi les fils de
  rationale: Le préfixe ל marque ici vraisemblablement une sous-classification au sein du groupe de Pahath-Moab. « Parmi » exprime naturellement cette relation sans la préciser davantage.
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Translittération française de la forme postexilique effectivement présente dans le texte hébreu, distincte de la forme plus longue Josué.
- source_word: וְיוֹאָב
  choice: et de Joab
  rationale: La conjonction est rendue simplement; Joab est la forme française traditionnelle du nom.
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: 2 818
  rationale: Les chiffres facilitent la lecture d’une liste de recensement; l’espace correspond à l’usage typographique français pour les milliers.
