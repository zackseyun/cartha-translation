source:
  edition: WLC
  text: וְ/הָ/עִ֞יר רַחֲבַ֤ת יָדַ֨יִם֙ וּ/גְדוֹלָ֔ה וְ/הָ/עָ֥ם מְעַ֖ט בְּ/תוֹכָ֑/הּ וְ/אֵ֥ין בָּתִּ֖ים בְּנוּיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/004.yaml
  text: The city was wide and large[a], but the people within it were few, and no houses had been built.
translation:
  language: fr
  text: La ville était vaste et étendue[a], mais ses habitants étaient peu nombreux, et il n’y avait pas de maisons bâties.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et la ville était large et grande… et le peuple y était peu nombreux, et il n’y avait pas de maisons bâties. » L’hébreu enchaîne plus directement les propositions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִיר
  choice: La ville
  rationale: הָעִיר signifie « la ville ». Le וְ initial assure la continuité du récit, mais il n’est pas nécessaire de le rendre explicitement en français dans cette phrase descriptive.
- source_word: רַחֲבַת יָדַיִם
  choice: vaste
  rationale: L’expression, littéralement « large de mains », décrit une grande largeur ou un espace ample. « Vaste » en restitue naturellement l’idée en français.
- source_word: וּגְדוֹלָה
  choice: et étendue
  rationale: גְדוֹלָה qualifie ici les dimensions de la ville. « Étendue » complète « vaste » sans suggérer une grandeur de prestige.
- source_word: וְהָעָם מְעַט בְּתוֹכָהּ
  choice: mais ses habitants étaient peu nombreux
  rationale: מְעַט indique un petit nombre. « Mais » explicite le contraste contextuel entre les dimensions de la ville et le faible nombre de personnes qui s’y trouvent; « ses habitants » rend naturellement הָעָם בְּתוֹכָהּ.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: et aucune maison n’avait été bâtie
  rationale: אֵין exprime ici l’absence, et בְּנוּיִם est le participe passif « bâties ». Le plus-que-parfait convient au point de vue narratif, sans ajouter l’idée non exprimée de reconstruction.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation privilégie une équivalence optimale tout en signalant en note la coordination plus formelle de l’hébreu.
