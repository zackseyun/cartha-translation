- source_word: בְּנֵי
  choice: Les descendants de
  rationale: Dans cette liste de recensement, le pluriel construit de « fils » désigne les membres d’une lignée ou d’un groupe familial. « Les descendants de » exprime naturellement cette portée en français moderne sans laisser entendre qu’il s’agit uniquement des fils directs.
- source_word: עַזְגָּד
  choice: Azgad
  rationale: Nom propre de personne ou de famille, translittéré sous la forme française usuelle.
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 2 322
  rationale: La suite numérique hébraïque signifie littéralement « deux mille, trois cents, vingt et deux ». La notation française moderne, avec une espace comme séparateur des milliers, transmet clairement le total du recensement.
