  naturalness: Le français est globalement naturel et de registre approprié. « Puis, quand arriva le septième mois » est toutefois un enchaînement un peu pesant et redondant en français moderne. « Et lorsque le septième mois arriva » est plus fluide tout en gardant le lien discursif.
  terminology: « Prêtres », « lévites », « gardiens des portes », « chanteurs », « serviteurs du Temple » et « tout Israël » sont appropriés. Les notes sur les Nethinim et sur « les fils d’Israël » sont correctement ancrées et préservent les alternatives pertinentes.
