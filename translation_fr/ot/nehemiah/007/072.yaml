source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: fr
  text: Ainsi, les prêtres, les lévites, les gardiens des portes, les chanteurs, une partie du peuple, les serviteurs du Temple[a] et tout Israël habitèrent dans leurs villes. Et lorsque le septième mois arriva, les fils d’Israël[b] étaient dans leurs villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Nethinim », translittération traditionnelle du nom donné à cette catégorie de serviteurs du Temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « les Israélites » ou « le peuple d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: habitèrent
  rationale: Le verbe ישׁב signifie ici demeurer ou habiter. « Habitèrent » convient au contexte du repeuplement tout en restant proche de l’hébreu.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis de כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation traditionnelle et transparente des membres de ce groupe.
- source_word: הַשּׁוֹעֲרִים
  choice: les gardiens des portes
  rationale: Rend clairement la fonction de ceux qui surveillaient les portes, sans employer le terme vieilli ou ambigu « portiers ».
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le participe désigne ceux qui chantent, notamment dans le service du Temple.
- source_word: וּמִן הָעָם
  choice: une partie du peuple
  rationale: 'La préposition מִן a ici un sens partitif : il s’agit de certains membres du peuple, par contraste avec les groupes spécialisés déjà cités.'
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: Ce groupe institutionnel affecté au service du sanctuaire est désigné par sa fonction pour être compris immédiatement; la translittération traditionnelle est conservée en note.
- source_word: וְכָל יִשְׂרָאֵל
  choice: et tout Israël
  rationale: Rendu collectif direct, conforme à la formulation hébraïque.
- source_word: בְּעָרֵיהֶם
  choice: dans leurs villes
  rationale: Traduction directe de l’expression; עִיר peut désigner une ville ou une localité.
- source_word: וַיִּגַּע הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: quand arriva le septième mois
  rationale: Avec une indication temporelle, נגע exprime l’arrivée du mois. L’ordre français est naturel tout en conservant cette image temporelle.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend explicitement l’expression hébraïque masculine plurielle בְּנֵי יִשְׂרָאֵל; son emploi collectif est signalé en note.
theological_decisions:
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte hébreu dit littéralement « les fils d’Israël », même si l’expression fonctionne ici comme un ethnonyme collectif. Le texte principal préserve cette forme et la note indique les équivalents idiomatiques.
- issue: Désignation institutionnelle הַנְּתִינִים
  choice: les serviteurs du Temple
  alternative: les Nethinim
  rationale: La traduction fonctionnelle est plus intelligible en français moderne, sans imposer d’interprétation doctrinale; la désignation traditionnelle reste accessible en note.
translation_notes:
  register: Français international moderne, digne et lisible. La liste conserve son rythme administratif. « Temple » prend une majuscule pour désigner le sanctuaire de Jérusalem. Le marqueur [a] est placé après « serviteurs du Temple », terme auquel se rapporte la note.
