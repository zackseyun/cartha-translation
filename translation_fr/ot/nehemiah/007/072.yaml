  rationale: La révision se limite à remplacer « Puis, quand arriva » par « Et lorsque le septième mois arriva ». Elle évite une nuance séquentielle ajoutée, rend plus directement la conjonction hébraïque et améliore la fluidité sans modifier le sens du passage ni les notes.
