- source_word: וְאוֹנוֹ
  choice: et d’Ono
  rationale: La conjonction est rendue par « et »; la répétition de « de » produit en français une énumération claire des localités auxquelles le groupe est associé.
- source_word: שְׁבַע מֵאוֹת וְעֶשְׂרִים וְאֶחָד
  choice: sept cent vingt et un
  rationale: Le nombre cardinal hébreu est écrit en toutes lettres, conformément au style de cette liste et à un français naturel.
