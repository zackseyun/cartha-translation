  text: וּ/מִ/קְצָת֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת נָתְנ֖וּ לַ/מְּלָאכָ֑ה הַ/תִּרְשָׁ֜תָא נָתַ֣ן לָ/אוֹצָ֗ר זָהָ֞ב דַּרְכְּמֹנִ֥ים אֶ֨לֶף֙ מִזְרָק֣וֹת חֲמִשִּׁ֔ים כָּתְנוֹת֙ כֹּֽהֲנִ֔ים שְׁלֹשִׁ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: fr
  text: Une partie des chefs de familles donnèrent pour les travaux. Le gouverneur[a] donna au trésor mille dariques d’or[b], cinquante coupes et cinq cent trente-cinq tuniques de prêtres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Tirshata », titre administratif perse.
    reason: lexical_alternative
  - marker: b
    text: La darique était une monnaie d’or perse.
    reason: cultural_note
  - marker: c
    text: Le texte hébreu porte « cinq cent trente-cinq tuniques de prêtres ». Le passage parallèle d’Esdras 2.69 en mentionne cent; certaines traductions harmonisent les deux passages ou suivent une autre tradition textuelle.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: Une partie des chefs de familles
  rationale: Cette formulation naturelle conserve le sens partitif de וּמִקְצָת et rend le titre social postexilique רָאשֵׁי הָאָבוֹת sans reproduire littéralement l’expression hébraïque peu claire en français « chefs des pères ».
- source_word: לַמְּלָאכָה
  choice: pour les travaux
  rationale: Dans ce contexte, מְלָאכָה désigne l’entreprise concrète soutenue par les dons. Le pluriel « travaux » est idiomatique en français et convient à l’effort de reconstruction.
- source_word: הַתִּרְשָׁתָא
  choice: le gouverneur
  rationale: Le titre administratif d’origine perse est traduit par sa fonction afin d’être immédiatement compréhensible; sa forme traditionnelle translittérée est signalée en note.
- source_word: לָאוֹצָר
  choice: au trésor
  rationale: Dans une liste de dons précieux, אוֹצָר désigne naturellement le lieu ou le fonds où ces biens sont déposés.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: mille dariques d’or
  rationale: « Darique » est le nom français historiquement précis de cette monnaie d’or perse; la mention explicite de l’or est conservée.
- source_word: מִזְרָקוֹת
  choice: coupes
  rationale: Le mot désigne des récipients, notamment cultuels. « Coupes » est clair et naturel, sans imposer une fonction rituelle plus précise que le texte.
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: tuniques de prêtres
  rationale: כָּתְנוֹת désigne des vêtements de type tunique; le complément כֹּהֲנִים indique qu’ils sont destinés aux prêtres.
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: cinq cent trente-cinq
  rationale: Le texte massorétique vocalisé donne littéralement « trente et cinq cents », soit 535. Ce chiffre est conservé malgré la différence avec le passage parallèle.
