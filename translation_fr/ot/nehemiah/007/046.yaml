  text: הַ/נְּתִינִ֑ים בְּנֵי צִחָ֥א בְנֵי חֲשֻׂפָ֖א בְּנֵ֥י טַבָּעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/046.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[b], the sons of Tabbaoth.'
translation:
  language: fr
  text: 'Les serviteurs du Temple : les fils de Tsiha[a], les fils de Hasoufa[b], les fils de Tabbaoth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu נְתִינִים, traditionnellement transcrit « Netinim », désigne une catégorie de personnes affectées au service du Temple.
    reason: lexical_alternative
  - marker: b
    text: 'Autre transcription possible : « Hasoupha ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: נְתִינִים est un terme technique désignant un groupe affecté au service du Temple. La traduction fonctionnelle est claire en français moderne, tandis que la note conserve le terme traditionnel translittéré.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste, בְּנֵי introduit des groupes familiaux ou claniques. « Les fils de » préserve la forme répétitive et généalogique de l’hébreu sans exclure le sens plus large de descendants.
- source_word: צִחָא
  choice: Tsiha
  rationale: Translittération française du nom propre, avec « ts » pour représenter צ et sans ajout d’un h final absent de la prononciation visée.
- source_word: חֲשֻׂפָא
  choice: Hasoufa
  rationale: 'Translittération adaptée aux conventions françaises : « ou » rend la voyelle /u/ et « f » la consonne פ non redoublée.'
- source_word: טַבָּעוֹת
  choice: Tabbaoth
  rationale: Translittération du nom propre qui conserve le redoublement consonantique indiqué par le dagesh et une forme reconnaissable dans la tradition biblique.
