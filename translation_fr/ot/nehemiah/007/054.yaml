  text: the sons of Bazlith, the sons of Mehida, the sons of Harsha—
translation:
  language: fr
  text: les descendants de Batslith, les descendants de Mehida, les descendants de Harsha —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: les descendants de
  rationale: Dans cette liste de familles, le terme désigne les membres issus d’un ancêtre ou appartenant à un clan. « Les descendants de » exprime ce sens naturellement en français moderne sans laisser entendre qu’il s’agit uniquement de fils immédiats.
- source_word: בַצְלִית
  choice: Batslith
  rationale: Nom propre translittéré. « Batslith » représente la consonne צ par « ts » et conserve « th » pour la finale ת, selon une forme française lisible et proche de l’hébreu.
- source_word: מְחִידָא
  choice: Mehida
  rationale: Nom propre translittéré ; « Mehida » rend simplement la forme hébraïque, le ח étant représenté sans graphie inutilement technique.
- source_word: חַרְשָׁא
  choice: Harsha
  rationale: Nom propre translittéré plutôt que traduit ; cette forme conserve la fonction onomastique du terme et demeure lisible en français.
