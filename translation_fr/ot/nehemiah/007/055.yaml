lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique, le pluriel construit de בֵּן désigne les membres ou descendants d’une famille. « Les fils de » conserve directement la structure répétitive et solennelle de l’hébreu.
- source_word: בַרְקוֹס
  choice: Barqos
  rationale: Nom propre translittéré. Le q rend distinctement le qoph hébreu et évite de suggérer une traduction du nom.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Nom propre rendu selon sa forme française biblique usuelle; il sert ici à désigner une famille.
- source_word: תָמַח
  choice: Témah
  rationale: Nom propre translittéré d’après la vocalisation massorétique תָמַח. L’accent facilite en français la lecture de la première voyelle comme /e/.
theological_decisions: []
translation_notes:
  register: Formulation concise et digne, adaptée à une liste de familles. La triple répétition de « les fils de » reproduit le parallélisme de l’hébreu. Ponctuation française courante; aucune note n’est nécessaire, car la vocalisation massorétique soutient Témah et la variante anglaise « Tamah » ne provient pas d’une ambiguïté du texte hébreu fourni.
