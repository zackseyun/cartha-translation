- source_word: רְצִין
  choice: Retsîn
  rationale: Forme française traditionnelle et transparente du nom hébreu, avec l’accent circonflexe indiquant la voyelle longue.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Translittération directe du nom propre hébreu selon les conventions françaises.
