source:
  edition: WLC
  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: fr
  text: 'ceux qui vinrent avec Zorobabel : Yéchoua, Néhémie, Azaria, Raamia[a], Nahamani, Mardochée, Bilshân, Mispéreth, Bigvaï, Nehoum[b] et Baana. Nombre des hommes du peuple d’Israël[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la liste parallèle d’Esdras 2.2, ce nom apparaît sous la forme « Réélaya ».
    reason: alternative_reading
  - marker: b
    text: Dans la liste parallèle d’Esdras 2.2, ce nom apparaît sous la forme « Rehoum ».
    reason: alternative_reading
  - marker: c
    text: Cette formule introduit les effectifs du recensement, dont l’énumération commence au verset suivant.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים
  choice: ceux qui vinrent
  rationale: Le participe précédé de l’article désigne un groupe déterminé. La proposition relative française rend naturellement cette valeur tout en conservant le lien syntaxique avec le verset précédent.
- source_word: עִם
  choice: avec
  rationale: La préposition exprime ici simplement l’accompagnement.
- source_word: זְרֻבָּבֶל
  choice: Zorobabel
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Translittération française claire du nom postexilique, qui évite de l’assimiler silencieusement à la forme traditionnelle « Josué ».
- source_word: רַעַמְיָה
  choice: Raamia
  rationale: Le texte massorétique de Néhémie porte cette forme; la forme différente de la liste parallèle d’Esdras est signalée en note.
- source_word: נַחֲמָנִי
  choice: Nahamani
  rationale: Translittération adaptée à l’orthographe française de la forme massorétique.
- source_word: מָרְדֳּכַי
  choice: Mardochée
  rationale: Forme française usuelle du nom; le texte ne permet pas de l’identifier d’office au personnage du livre d’Esther.
- source_word: מִסְפֶּרֶת
  choice: Mispéreth
  rationale: Translittération du nom propre selon la forme du texte massorétique.
- source_word: נְחוּם
  choice: Nehoum
  rationale: La forme de Néhémie est conservée dans le texte principal; la variante de la liste parallèle est indiquée en note.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Nombre des hommes du peuple d’Israël
  rationale: Cette formulation conserve à la fois l’intitulé nominal « nombre » et le terme explicitement masculin אַנְשֵׁי, sans réduire l’expression à « peuple d’Israël ».
theological_decisions:
- issue: Langage masculin du recensement dans אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: des hommes du peuple d’Israël
  alternative: du peuple d’Israël
  rationale: L’hébreu emploie explicitement le pluriel masculin « hommes de ». Le conserver relève de la précision lexicale et ne préjuge pas à lui seul de la portée sociale ou théologique du recensement.
- issue: Formes des noms différentes en Esdras 2.2
  choice: Suivre les formes du texte massorétique de Néhémie, « Raamia » et « Nehoum »
  alternative: Harmoniser avec « Reélia » et « Rehoum » en Esdras 2.2
  rationale: Le texte principal traduit le passage demandé sans harmonisation; les différences de la liste parallèle sont préservées dans les notes.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms bibliques français bien établis sont conservés lorsqu’ils sont immédiatement reconnaissables; les autres sont translittérés de façon lisible. La structure enchaîne la fin de la phrase précédente avec l’intitulé du recensement.
