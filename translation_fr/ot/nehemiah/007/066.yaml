lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: L’ensemble de l’assemblée
  rationale: כָּל suivi du nom défini exprime la totalité. Cette formulation française rend clairement l’ensemble de la communauté recensée.
- source_word: כְּאֶחָד
  choice: comptait
  rationale: Littéralement « comme un » ou « comme une seule unité ». Dans ce récapitulatif numérique, l’expression présente l’assemblée comme un total unique; le verbe « comptait » l’intègre naturellement en français, tandis que la note conserve la tournure littérale.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת וְשִׁשִּׁים
  choice: 42 360 personnes
  rationale: La suite numérique correspond à quarante-deux mille trois cent soixante. L’ajout de « personnes » explicite naturellement en français l’unité sous-entendue par le dénombrement.
