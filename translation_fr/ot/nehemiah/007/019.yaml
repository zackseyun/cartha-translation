  choice: Bigvaï
  rationale: Nom propre translittéré en français; le tréma indique que les voyelles finales se prononcent séparément.
- source_word: אַלְפַּיִם שִׁשִּׁים וְשִׁבְעָה
  choice: 2 067
  rationale: La suite numérique signifie littéralement « deux mille, soixante et sept ». Les chiffres, avec l’espacement typographique français, rendent clairement le dénombrement exact dans une longue liste.
