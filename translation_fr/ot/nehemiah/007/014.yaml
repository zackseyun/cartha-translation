lexical_decisions:
- source_word: בְּנֵי
  choice: les descendants de
  rationale: Dans cette liste de recensement, le pluriel construit de בֵּן désigne les membres d’une lignée familiale, et non nécessairement les fils immédiats. « Les descendants de » exprime ce sens naturellement en français.
- source_word: זַכָּי
  choice: Zakkaï
  rationale: Le nom propre est translittéré selon une forme française qui représente le redoublement de la consonne hébraïque et la finale -aï.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '760'
  rationale: L’expression numérale signifie littéralement « sept cents et soixante ». Les chiffres conviennent au style concis d’une liste de recensement et facilitent la lecture.
