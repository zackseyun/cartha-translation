base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: fr
  text: 'Tu as même établi des prophètes pour proclamer à ton sujet à Jérusalem : « Il y a un roi en Juda ! » À présent, ces propos parviendront au roi[a]. Viens donc, et concertons-nous ensemble.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces paroles », « ces affaires » ou « ces rapports ». Le mot hébreu peut désigner des paroles, des affaires ou des rapports.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Tu as même
  rationale: La particule additive prend ici une valeur emphatique dans la suite des accusations.
- source_word: נְבִיאִים
  choice: des prophètes
  rationale: Le terme désigne normalement des prophètes, sans raison contextuelle de l'affaiblir en « porte-parole ».
- source_word: הֶעֱמַדְתָּ
  choice: établi
  rationale: Le hiphil exprime l'affectation de personnes à une fonction; « établir » convient au registre et reste proche de l'image hébraïque.
- source_word: לִקְרֹא עָלֶיךָ
  choice: pour proclamer à ton sujet
  rationale: Cette formulation conserve la valeur de la préposition עַל sans préciser davantage le contenu que ne le fait l'hébreu.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: Il y a un roi en Juda !
  rationale: La proposition nominale hébraïque est très brève; cette traduction restitue l'annonce d'une royauté sans insérer explicitement le nom de Néhémie.
- source_word: וְעַתָּה יִשָּׁמַע לַמֶּלֶךְ כַּדְּבָרִים הָאֵלֶּה
  choice: À présent, le roi va entendre parler de ces faits
  rationale: Tour français naturel qui conserve l'idée que ces paroles ou affaires parviendront au roi; « faits » laisse au contexte leur caractère d'allégations.
- source_word: וְעַתָּה לְכָה
  choice: Viens donc, maintenant
  rationale: L'impératif et la transition rhétorique sont rendus sans surinterprétation.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: et concertons-nous ensemble
  rationale: Le cohortatif niphal exprime une délibération commune; « se concerter » est naturel en français moderne.
theological_decisions:
- issue: Nature de l'accusation de royauté
  choice: Conserver la formule impersonnelle « Il y a un roi en Juda ! »
  alternative: « Tu es roi en Juda ! » ou « Néhémie est roi en Juda ! »
  rationale: Le contexte vise clairement Néhémie, mais la citation hébraïque, nominale et elliptique, ne le nomme pas. La traduction préserve cette tension sans ajouter un sujet explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton accusateur de la lettre et l'ellipse de l'annonce royale, tout en évitant une littéralité obscure.
