  source_fidelity: La traduction rend correctement l'accusation d'avoir नियुक्तé des prophètes et préserve de façon appropriée l'ellipse de « roi en Juda », sans insérer le nom de Néhémie. Toutefois, « ces faits » tend à présenter comme établies des accusations qui, dans le contexte, sont des paroles/propos ou des rapports allégués. « Ces propos parviendront au roi » conserve mieux la portée de דְּבָרִים et le passif implicite de יִשָּׁמַע.
