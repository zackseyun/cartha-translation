  text: וָ/אֶשְׁלְחָ֤/ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֤א נִֽהְיָה֙ כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר כִּ֥י מִֽ/לִּבְּ/ךָ֖ אַתָּ֥ה בוֹדָֽא/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: fr
  text: 'Je lui envoyai ce message : « Rien de tout ce que tu affirmes ne s’est produit, car c’est dans ton propre cœur que tu l’inventes[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu fabriques tout cela dans ton propre cœur ».'
    reason: Variante lexicale de בּוֹדָאם (« inventer », « fabriquer ») ; elle conserve l’image hébraïque du cœur comme source intérieure de l’accusation fabriquée.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו לֵאמֹר
  choice: Je lui envoyai donc ce message
  rationale: Le wayyiqtol marque la progression du récit. Cette formulation française exprime naturellement l’envoi d’une réponse et introduit directement la citation, sans reproduire lourdement « en disant ».
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: Rien de tout ce que tu affirmes ne s’est produit
  rationale: היה nie ici la réalité ou la survenue des faits allégués. La tournure française reste naturelle tout en conservant la portée globale de דְּבָרִים.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: ce que tu affirmes
  rationale: Le participe אוֹמֵר présente une affirmation en cours. « Affirmer » convient au contexte d’accusations et demeure plus précis que le simple « dire ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la justification de la dénégation de Néhémie.
- source_word: מִלִּבְּךָ
  choice: dans ton propre cœur
  rationale: Le choix conserve l’image anthropologique hébraïque du cœur comme siège de la pensée et de l’intention, ainsi que l’idée d’une origine personnelle.
- source_word: בּוֹדָאם
  choice: tu l’inventes
  rationale: Le verbe בדא désigne l’action d’inventer ou de fabriquer une allégation. Le singulier pronominal reprend naturellement en français l’ensemble de ce qui est affirmé.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative a été allégée pour éviter un calque peu naturel, tandis que l’image hébraïque du « cœur » a été maintenue afin de ne pas réduire le texte à une simple référence à l’esprit.
