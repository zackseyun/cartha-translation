  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: fr
  text: En outre, ils ne cessaient de faire son éloge devant moi[a] et de lui rapporter mes paroles[b]. Tobiya m’envoya des lettres pour m’effrayer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parler de ses bonnes actions » ou « dire du bien de lui ». L’expression hébraïque est plus large que les seules actions et désigne ici les propos favorables tenus au sujet de Tobiya devant Néhémie.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ils faisaient sortir mes paroles vers lui », expression qui signifie qu’ils transmettaient à Tobiya ce que disait Néhémie.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: De plus
  rationale: Marque l’ajout d’un dernier élément à la série d’actions décrites dans le contexte.
- source_word: טוֹבֹתָיו
  choice: ses qualités
  rationale: Le pluriel substantivé de « bon » peut désigner les bonnes actions, les mérites ou les qualités de Tobiya. « Ses qualités » reste assez large et convient à l’éloge favorable fait devant Néhémie.
- source_word: הָיוּ אֹמְרִים
  choice: ils ne cessaient de vanter
  rationale: La construction היה avec participe exprime une action passée continue ou répétée. Dans ce contexte, « vanter » rend naturellement le fait de parler favorablement des qualités de Tobiya.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Rend directement l’expression hébraïque et indique que ces propos étaient tenus en présence de Néhémie.
- source_word: וּדְבָרַי
  choice: mes paroles
  rationale: דבר désigne ici ce que Néhémie disait, information ensuite transmise à Tobiya.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: ils lui rapportaient
  rationale: Littéralement « ils faisaient sortir vers lui »; dans le contexte, l’expression signifie transmettre ou rapporter à Tobiya les paroles de Néhémie.
- source_word: אִגְּרוֹת
  choice: des lettres
  rationale: Équivalent français courant du terme désignant une correspondance écrite.
- source_word: שָׁלַח
  choice: envoyait
  rationale: Le singulier hébreu peut se comprendre collectivement ou comme une action répétée dans ce contexte; l’imparfait français s’accorde naturellement avec la pluralité des lettres.
- source_word: לְיָרְאֵנִי
  choice: pour m’effrayer
  rationale: 'Exprime le but recherché par Tobiya: provoquer la peur chez Néhémie.'
