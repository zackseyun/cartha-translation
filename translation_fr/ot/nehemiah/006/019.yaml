revisions:
- from: De plus, ils ne cessaient de vanter ses qualités devant moi[a], puis ils lui rapportaient mes paroles[b]. Tobiya envoyait des lettres pour m’effrayer.
  to: En outre, ils ne cessaient de faire son éloge devant moi[a] et de lui rapporter mes paroles[b]. Tobiya m’envoya des lettres pour m’effrayer.
  rationale: La révision supprime la chronologie ajoutée par « puis », rend le parfait narratif final par « envoya », et emploie « faire son éloge » afin de refléter la portée contextuelle, favorable mais non limitée aux qualités personnelles, de טוֹבֹתָיו. Les deux notes restent ancrées aux mêmes emplacements et expliquent les ambiguïtés lexicales pertinentes.
