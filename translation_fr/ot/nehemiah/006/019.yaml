  - severity: low
    issue: Imparfait « Tobiya envoyait » pour שָׁלַח
    rationale: Le verbe hébreu est un parfait narratif. Avec « des lettres », le passé simple français (« envoya ») rend l’événement sans ajouter une notion de répétition ou de durée.
  - severity: low
    issue: « vanter ses qualités » est plus étroit que l’expression hébraïque
    rationale: טוֹבֹתָיו peut viser ses bonnes actions, ses mérites ou, plus largement, les propos favorables tenus à son sujet. « Faire son éloge » préserve mieux cette portée contextuelle.
