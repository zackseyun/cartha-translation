  source_fidelity: 'Le sens général est fidèle : des personnes font l’éloge de Tobiya devant Néhémie, transmettent à Tobiya les paroles de Néhémie, et Tobiya envoie des lettres dans le but de l’effrayer. Toutefois, « puis » introduit une succession absente de l’hébreu, qui coordonne simplement les deux actions. Le parfait narratif שָׁלַח est mieux rendu ici par un passé simple (« envoya ») que par l’imparfait itératif (« envoyait »).'
  naturalness: Le français est globalement naturel. « Faire son éloge » est plus idiomatique et légèrement moins réducteur que « vanter ses qualités », tout en rendant l’idée de propos favorables. La coordination par « et » conserve le lien du texte source sans imposer de chronologie.
  terminology: « Tobiya » est une translittération recevable du nom hébreu. « Lettres », « paroles » et « m’effrayer » rendent adéquatement les termes et la finalité du texte. Les notes conservent utilement les possibilités lexicales sans les présenter comme des certitudes.
