  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: fr
  text: Souviens-toi de Tobiya et de Sanballat, mon Dieu, selon leurs actes que voici, ainsi que de Noadia, la prophétesse, et des autres prophètes qui cherchaient à m’intimider.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui cherchaient à me faire peur ».'
    reason: Alternative lexicale rendant plus littéralement la valeur causative de ירא, tandis que « intimider » exprime naturellement en français l’action concertée décrite par le contexte.
lexical_decisions:
- source_word: זָכְרָה
  choice: Souviens-toi
  rationale: L’impératif, employé dans une prière directement adressée à Dieu, appelle celui-ci à prendre en compte les personnes et leurs actes. « Souviens-toi » conserve la forme directe et traditionnelle sans expliciter un jugement que l’hébreu ne formule pas.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe de première personne du singulier exprime l’adresse personnelle de Néhémie à Dieu.
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: de Tobiya et de Sanballat
  rationale: Après « se souvenir », le français exige la préposition « de ». Les noms sont translittérés sous des formes françaises transparentes.
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: selon leurs actes que voici
  rationale: 'כְּ marque ici la conformité ou la mesure : Néhémie demande à Dieu de se souvenir d’eux en rapport avec leurs actes. Le suffixe hébreu est formellement singulier, mais son référent contextuel englobe les deux hommes nommés; le pluriel français rend naturellement cette portée collective.'
- source_word: וְגַם
  choice: ainsi que
  rationale: Cette locution française exprime naturellement l’ajout de Noadia et des autres prophètes à la requête.
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: de Noadia, la prophétesse
  rationale: Le féminin hébreu est conservé par « prophétesse », terme français clair qui identifie explicitement Noadia comme femme exerçant une fonction prophétique.
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: et des autres prophètes
  rationale: יֶתֶר désigne le reste du groupe. « Les autres prophètes » est plus naturel en français actuel que « le reste des prophètes » tout en gardant le même sens contextuel.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: qui cherchaient à m’intimider
  rationale: La construction avec היה et le participe décrit une action continue ou répétée dans le passé. La forme causative de ירא indique une tentative visant à susciter la peur; « cherchaient à m’intimider » rend à la fois l’intention et la durée, sans laisser entendre qu’elle a nécessairement réussi.
theological_decisions:
- issue: Tonalité de l’appel au souvenir divin contre les adversaires
  choice: Conserver la demande que Dieu se souvienne des adversaires selon leurs actes, sans ajouter une condamnation explicite.
  alternative: « Punis Tobiya et Sanballat » ou « tiens-les pour responsables »
  rationale: La prière a une portée imprécatoire et judiciaire implicite, mais le texte hébreu se limite au verbe « se souvenir » et à la mesure des actes. La traduction préserve cette retenue et la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe de prière est conservée. « Actes que voici » maintient le démonstratif hébreu, et « cherchaient à m’intimider » restitue l’aspect continu ainsi que la tentative de provoquer la peur.
