  source_fidelity: 'Le sens général est juste : Néhémie reconnaît que cet homme n’était pas envoyé par Dieu et que Tobiya et Sanballat l’avaient rémunéré. Toutefois, le קשר logique introduit par כִּי après la négation est adversatif/explicatif (« mais [plutôt] ») et mérite d’être exprimé plus nettement que par de simples deux-points.'
  naturalness: Le français est clair et moderne. « Il avait prononcé cette prophétie » est possible, mais « il avait prophétisé contre moi » est plus idiomatique et rend directement le verbe דבר avec « prophétie » comme objet interne.
  terminology: « Dieu », « prophétisé », « contre moi », « Tobiya », « Sanballat » et « payé » conviennent. La graphie « Tobiya » est cohérente avec le choix annoncé et avec l’hébreu.
