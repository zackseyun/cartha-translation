  text: וָ/אַכִּ֕ירָ/ה וְ/הִנֵּ֥ה לֹֽא אֱלֹהִ֖ים שְׁלָח֑/וֹ כִּ֤י הַ/נְּבוּאָה֙ דִּבֶּ֣ר עָלַ֔/י וְ/טוֹבִיָּ֥ה וְ/סַנְבַלַּ֖ט שְׂכָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: fr
  text: Je compris alors que Dieu ne l’avait pas envoyé, mais qu’il avait prophétisé contre moi parce que Tobiya et Sanballat l’avaient payé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: Je compris alors
  rationale: Le verbe נכר au hiphil exprime ici le fait de discerner ou de reconnaître. « Je compris alors » rend naturellement la prise de conscience dans le contexte.
- source_word: וְהִנֵּה
  choice: que
  rationale: La particule introduit le contenu soudainement constaté. En français courant, cette nuance est portée par « compris alors que », sans le calque peu naturel « et voici ».
- source_word: הַנְּבוּאָה דִּבֶּר עָלַי
  choice: il avait prononcé cette prophétie contre moi
  rationale: דבר avec pour objet « la prophétie » signifie la prononcer; עלי a ici une valeur hostile, d’où « contre moi ».
- source_word: שְׂכָרוֹ
  choice: l’avaient payé
  rationale: שכר signifie engager contre rémunération ou payer. « L’avaient payé » est direct et naturel, tout en conservant l’idée d’une intervention intéressée.
theological_decisions:
- issue: Origine divine revendiquée de la prophétie
  choice: ce n’était pas Dieu qui l’avait envoyé
  alternative: Dieu ne l’avait pas envoyé
  rationale: La formulation nie clairement la mission divine de l’homme sans nier la réalité générale de la prophétie ou résoudre davantage la manière dont Néhémie l’a discernée.
- issue: Rapport entre la fausse mission et le paiement
  choice: deux-points puis « parce que »
  alternative: mais il avait prononcé cette prophétie contre moi, car…
  rationale: Le texte oppose implicitement l’envoi divin au motif réel, le paiement par Tobiya et Sanballat. La ponctuation française rend ce rapport sans ajouter une qualification absente telle que « fausse prophétie ».
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé de « comprendre » situe la prise de conscience dans le récit; les plus-que-parfaits marquent l’antériorité de l’envoi revendiqué, de la prophétie et du paiement. Graphie « Tobiya » retenue pour refléter plus directement טוֹבִיָּה.
