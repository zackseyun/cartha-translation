source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ אֵלַ֨/י סַנְבַלַּ֜ט כַּ/דָּבָ֥ר הַ/זֶּ֛ה פַּ֥עַם חֲמִישִׁ֖ית אֶֽת נַעֲר֑/וֹ וְ/אִגֶּ֥רֶת פְּתוּחָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/005.yaml
  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: fr
  text: Puis Sanballat m’envoya son serviteur pour la cinquième fois, de la même façon, avec une lettre ouverte[a] à la main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « non cachetée ».'
    reason: L’adjectif פְּתוּחָה signifie littéralement « ouverte »; appliqué à une lettre, il peut indiquer qu’elle n’était pas scellée et pouvait donc être lue par d’autres.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Puis … envoya
  rationale: Le waw consécutif fait progresser le récit. « Puis » exprime naturellement cette succession en français.
- source_word: אֵלַי
  choice: m’envoya
  rationale: La préposition אֶל avec le suffixe de première personne désigne ici le destinataire de l’envoi; le pronom français placé devant « envoya » rend naturellement « envoya vers moi ».
- source_word: סַנְבַלַּט
  choice: Sanballat
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: כַּדָּבָר הַזֶּה
  choice: de la même façon
  rationale: L’expression renvoie à la démarche répétée décrite dans le contexte. Cette formulation française conserve la valeur anaphorique sans traduire דָּבָר de manière artificiellement littérale.
- source_word: פַּעַם חֲמִישִׁית
  choice: pour la cinquième fois
  rationale: Cette tournure française exprime clairement le nombre de répétitions indiqué par l’hébreu.
- source_word: אֶת נַעֲרוֹ
  choice: son serviteur
  rationale: נַעַר peut désigner un jeune homme, mais, dans ce contexte d’envoi comme messager, il indique surtout une fonction de service.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: avec une lettre ouverte[a]
  rationale: Le contexte présente la lettre comme accompagnant le serviteur. « Ouverte » rend directement פְּתוּחָה tout en laissant la note préciser le sens contextuel possible de « non cachetée ».
- source_word: בְּיָדוֹ
  choice: à la main
  rationale: Cette expression conserve l’image concrète de la lettre portée par le serviteur, avec une tournure française naturelle.
