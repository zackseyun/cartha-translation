source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: fr
  text: Lorsque tous nos ennemis l’apprirent et que toutes les nations qui nous entouraient le virent, ils perdirent beaucoup de leur assurance[a]. Ils reconnurent alors que cette œuvre avait été accomplie par notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils tombèrent beaucoup à leurs propres yeux ». Le sens est qu’ils furent profondément abattus ou perdirent beaucoup de leur assurance.'
    reason: L’expression hébraïque est idiomatique et associe l’abattement à leur propre regard sur eux-mêmes.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La formule narrative hébraïque introduit ici la circonstance temporelle. En français moderne, « Lorsque » exprime naturellement l’enchaînement sans conserver une tournure lourde comme « Et il arriva que ».
- source_word: שָׁמְעוּ
  choice: l’apprirent
  rationale: Le verbe signifie littéralement « entendirent ». Comme son objet est sous-entendu — l’achèvement de la muraille — « l’apprirent » restitue naturellement en français le fait qu’ils en reçurent la nouvelle.
- source_word: כָּל אֹיְבֵינוּ
  choice: tous nos ennemis
  rationale: Rendu direct du groupe nominal hébreu.
- source_word: וַיִּרְאוּ
  choice: le virent
  rationale: Conserve le sens courant de « voir » tout en ajoutant le pronom requis par la syntaxe française, dont l’antécédent contextuel est l’achèvement des travaux.
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: toutes les nations qui nous entouraient
  rationale: « Nations » convient ici aux peuples voisins et évite de charger le terme d’un sens théologique ultérieur.
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: ils perdirent beaucoup de leur propre estime
  rationale: Littéralement, ils « tombèrent beaucoup à leurs propres yeux ». La formulation française exprime l’abaissement intérieur ou la perte d’assurance tout en maintenant l’idée de leur propre appréciation.
- source_word: וַיֵּדְעוּ
  choice: Ils reconnurent alors
  rationale: Dans ce contexte, le verbe désigne non une simple acquisition d’information, mais la reconnaissance de la cause divine. « Alors » rend explicitement l’enchaînement narratif porté par le waw consécutif.
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: grâce à notre Dieu
  rationale: La préposition מֵאֵת peut marquer la provenance ou l’agent. « Grâce à » attribue l’accomplissement à Dieu de manière naturelle en français, sans préciser indûment le mécanisme de son action.
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: cette œuvre avait été accomplie
  rationale: Le passif et l’antériorité de l’achèvement sont conservés. « Œuvre » convient à l’entreprise de reconstruction et garde une dignité de registre.
theological_decisions:
- issue: L’action de Dieu dans l’achèvement de l’œuvre
  choice: grâce à notre Dieu
  alternative: venait de notre Dieu / avait été accomplie par notre Dieu
  rationale: Le texte attribue clairement à Dieu la réussite du projet, mais מֵאֵת peut exprimer aussi bien la source que l’agent. « Grâce à notre Dieu » conserve cette attribution décisive sans imposer une description plus précise de la causalité.
translation_notes:
  register: Français international moderne, clair et digne. La formule narrative initiale est allégée selon l’usage français, tandis que la succession entendre/voir/reconnaître et l’attribution de l’œuvre à Dieu sont préservées.
