  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם מַרְבִּ֞ים חֹרֵ֤י יְהוּדָה֙ אִגְּרֹ֣תֵי/הֶ֔ם הוֹלְכ֖וֹת עַל טוֹבִיָּ֑ה וַ/אֲשֶׁ֥ר לְ/טוֹבִיָּ֖ה בָּא֥וֹת אֲלֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/017.yaml
  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: fr
  text: De plus, en ces jours-là, les notables de Juda envoyaient de nombreuses lettres à Tobia, et celles de Tobia leur parvenaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs lettres allaient à Tobia, et ce qui était à Tobia venait à eux ». Dans la seconde proposition, le mot « lettres » est sous-entendu, selon le parallélisme avec la première.'
    reason: La formulation hébraïque est elliptique et laisse implicite le nom repris dans la seconde proposition.
lexical_decisions:
- source_word: גַּם
  choice: De plus
  rationale: La locution exprime naturellement la valeur additive de la particule et rattache ce fait aux événements précédents.
- source_word: בַּיָּמִים הָהֵם
  choice: en ces jours-là
  rationale: Cette formulation française courante conserve l’expression temporelle hébraïque et le registre narratif.
- source_word: מַרְבִּים
  choice: envoyaient de nombreuses
  rationale: Avec « lettres » comme complément et le participe hébreu, l’expression décrit une action répétée ou continue; cette traduction en restitue le sens sans conserver le littéralisme « multipliaient ».
- source_word: חֹרֵי יְהוּדָה
  choice: les notables de Juda
  rationale: Le terme désigne ici les membres influents de l’élite judéenne; « notables » est naturel en français moderne et rend leur rang social sans préciser indûment une fonction officielle.
- source_word: אִגְּרֹתֵיהֶם
  choice: de nombreuses lettres
  rationale: Le nom désigne une correspondance écrite. Le possessif hébreu n’a pas besoin d’être exprimé séparément en français puisque les notables sont déjà les expéditeurs explicites.
- source_word: הוֹלְכוֹת עַל טוֹבִיָּה
  choice: à Tobie
  rationale: Littéralement, les lettres « allaient vers/à » Tobie; avec le verbe « envoyaient », le complément de destination rend naturellement cet idiome.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: et celles de Tobie
  rationale: La construction relative est elliptique. Le pronom féminin « celles » reprend « lettres », tandis que « de Tobie » préserve une légère ambiguïté entre provenance et appartenance.
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: leur parvenaient
  rationale: Le participe indique une action suivie ou répétée. « Parvenaient » convient naturellement à des lettres et rend leur arrivée auprès des notables.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Notables » exprime le statut social des חֹרִים sans leur attribuer une charge administrative précise. Le rythme de la phrase met en évidence la correspondance réciproque et répétée.
