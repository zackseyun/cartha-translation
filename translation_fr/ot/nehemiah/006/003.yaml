source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֨/ה עֲלֵי/הֶ֤ם מַלְאָכִים֙ לֵ/אמֹ֔ר מְלָאכָ֤ה גְדוֹלָה֙ אֲנִ֣י עֹשֶׂ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/רֶ֑דֶת לָ֣/מָּה תִשְׁבַּ֤ת הַ/מְּלָאכָה֙ כַּ/אֲשֶׁ֣ר אַרְפֶּ֔/הָ וְ/יָרַדְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: fr
  text: 'Je leur envoyai donc des messagers pour leur dire : « J’accomplis une œuvre importante et je ne peux pas descendre. Pourquoi cette œuvre s’arrêterait-elle si je la délaissais[a] pour descendre vers vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si je cessais de m’en occuper ».'
    reason: Le verbe רפה peut exprimer le fait de relâcher une activité, de la laisser tomber ou de cesser de s’en occuper.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה עֲלֵיהֶם
  choice: Je leur envoyai donc
  rationale: Le wayyiqtol fait avancer le récit, rendu naturellement par « donc » ; avec « envoyer des messagers », עַל indique ici les destinataires.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte politique, le terme désigne des envoyés humains chargés de transmettre une réponse.
- source_word: מְלָאכָה גְדוֹלָה
  choice: une œuvre importante
  rationale: מְלָאכָה désigne le travail ou la tâche en cours, et גְדוֹלָה en souligne ici l’ampleur et l’importance plutôt que les seules dimensions matérielles.
- source_word: אֲנִי עֹשֶׂה
  choice: J’accomplis
  rationale: Le participe exprime une activité en cours ; « accomplis » convient à une œuvre entreprise tout en restant naturel en français.
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: et je ne peux pas descendre
  rationale: La traduction conserve le mouvement spatial vers le bas depuis Jérusalem et exprime directement l’impossibilité déclarée par Néhémie.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: Pourquoi cette œuvre s’arrêterait-elle
  rationale: שׁבת signifie ici cesser ou s’arrêter. Le conditionnel français restitue la portée rhétorique de la question.
- source_word: כַּאֲשֶׁר אַרְפֶּהָ
  choice: si je la délaissais
  rationale: רפה au hiphil évoque le fait de relâcher, laisser tomber ou cesser de soutenir l’activité. Dans la logique hypothétique de la question, « si » et le conditionnel rendent l’enchaînement avec naturel.
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: pour descendre vers vous
  rationale: La formulation conserve la répétition du verbe ירד et le déplacement depuis Jérusalem en direction des destinataires.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Œuvre importante » garde la portée valorisante de l’hébreu sans donner à entendre uniquement une grande dimension matérielle. La répétition de « descendre » est conservée.
