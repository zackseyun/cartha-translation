revisions:
- from: 'Il y était écrit : « Le bruit court parmi les nations — et Gashmou[a] l’affirme aussi — que toi et les Juifs, vous projetez de vous révolter. C’est pour cela que tu rebâtis la muraille et que, d’après ces informations, tu dois devenir leur roi. »'
  to: 'Il y était écrit : « Le bruit court parmi les nations — et Gashmou[a] l’affirme aussi — que toi et les Juifs, vous projetez de vous révolter. C’est pour cela que tu rebâtis la muraille et que tu deviendras leur roi, selon ces propos. »'
  rationale: La révision retire la nuance d’obligation introduite par « dois » et rend la royauté comme l’issue que les accusations attribuent à Néhémie. « Selon ces propos » reflète plus directement la référence finale aux allégations rapportées, tout en gardant un français moderne et clair.
