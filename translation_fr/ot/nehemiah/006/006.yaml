base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: fr
  text: 'Il y était écrit : « Le bruit court parmi les nations — et Gashmou[a] l’affirme aussi — que toi et les Juifs, vous projetez de vous révolter. C’est pour cela que tu rebâtis la muraille et que tu deviendras leur roi, selon ces propos. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Gashmou »; ce nom est aussi rendu par « Guéshem ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: Il y était écrit
  rationale: Le participe passif introduit le contenu de la lettre; l’imparfait français s’intègre naturellement au cadre narratif passé.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: Le bruit court parmi les nations
  rationale: Cette tournure française naturelle rend le nifal de שׁמע comme une information qui circule, tout en conservant la portée politique et ethnique de גּוֹיִם.
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: et Gashmou l’affirme aussi
  rationale: « Aussi » restitue la valeur additive de וְ; « l’affirme » indique naturellement que Gashmou confirme le bruit mentionné.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: vous projetez de vous révolter
  rationale: חשב suivi de l’infinitif exprime ici une intention concertée, sans la nuance plus forte de « comploter ».
- source_word: עַל כֵּן
  choice: C’est pour cela que
  rationale: Exprime clairement le lien allégué entre le projet de révolte et la reconstruction.
- source_word: בּוֹנֶה הַחוֹמָה
  choice: tu rebâtis la muraille
  rationale: « Rebâtir » correspond au contexte de restauration de la muraille tout en restant dans le champ de בנה.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: tu dois devenir leur roi
  rationale: Rend le devenir exprimé par הוה avec ל et présente la royauté comme le dessein que la lettre attribue à Néhémie, sans l’énoncer comme un fait certain.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: d’après ces informations
  rationale: דברים désigne ici les propos ou informations qui circulent; ce choix reste proche du sens tout en évitant l’expression française peu claire « d’après ces paroles ».
