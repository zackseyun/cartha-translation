  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: fr
  text: La muraille fut achevée le vingt-cinquième jour du mois d’Éloul[a], en cinquante-deux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éloul est le sixième mois du calendrier hébreu.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: fut donc achevée
  rationale: Le qal wayyiqtol de שלם, avec « la muraille » comme sujet féminin singulier, exprime ici l’arrivée à son terme. La tournure française « fut achevée » est naturelle et digne; « donc » rend la progression narrative portée par וַ־.
- source_word: הַחוֹמָה
  choice: la muraille
  rationale: Le nom défini désigne l’enceinte de Jérusalem dans le contexte. « Muraille » convient mieux que le terme générique « mur » pour une fortification urbaine.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה
  choice: le vingt-cinquième jour
  rationale: La préposition avec le nombre forme une indication de date. Le français explicite naturellement « jour ».
- source_word: לֶאֱלוּל
  choice: du mois d’Éloul
  rationale: Éloul est un nom de mois hébreu, conservé par translittération. L’ajout de « mois » clarifie immédiatement la référence culturelle.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: en cinquante-deux jours
  rationale: Le ל־ introduit la durée totale nécessaire à l’achèvement. « En cinquante-deux jours » exprime clairement cette durée sans suggérer une simple succession chronologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Muraille » restitue le contexte fortifié; le passé simple maintient un registre biblique digne sans archaïsme marqué. La variante « fut terminée » n’exige pas de note, car elle ne représente pas une ambiguïté substantielle du texte source.
