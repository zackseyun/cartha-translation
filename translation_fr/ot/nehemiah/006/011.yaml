source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: fr
  text: 'Mais j’ai dit : « Un homme comme moi prendrait-il la fuite ? Et quel homme comme moi pourrait entrer dans le Temple[a] et rester en vie ? Je n’y entrerai pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctuaire ». Il ne s’agit probablement pas seulement de se cacher à l’intérieur du bâtiment, mais d’entrer dans une partie du Temple à laquelle Néhémie n’avait pas le droit d’accéder, ce qui explique les mots « rester en vie ».
    reason: Précision lexicale et contextuelle concernant הַהֵיכָל et l’implication cultuelle probable de l’entrée.
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Mais j’ai répondu
  rationale: Le waw fait avancer le récit, tandis que « Mais » marque ici le refus opposé par Néhémie à la proposition précédente. « J’ai répondu » est naturel dans ce dialogue.
- source_word: הָאִישׁ כָּמוֹנִי
  choice: Un homme comme moi
  rationale: La formule est générique et conserve la référence au statut, à la responsabilité et à l’honneur de Néhémie.
- source_word: יִבְרָח
  choice: prendrait-il la fuite
  rationale: Cette expression rend la fuite motivée par la peur et maintient la force rhétorique de la question.
- source_word: וּמִי כָמוֹנִי
  choice: Et quel homme comme moi
  rationale: La formulation française conserve le parallélisme et l’insistance de l’hébreu, tout en rendant intelligible la construction elliptique.
- source_word: אֲשֶׁר יָבוֹא
  choice: pourrait entrer
  rationale: Le conditionnel modal exprime naturellement l’incrédulité de la question rhétorique sans transformer le propos en simple prédiction.
- source_word: הַהֵיכָל
  choice: le Temple
  rationale: Dans ce contexte, le mot désigne le bâtiment du Temple, probablement son espace sacré. « Temple » reste le terme le plus immédiatement accessible; la note signale la précision possible.
- source_word: וָחָי
  choice: et rester en vie
  rationale: La tournure exprime clairement la survie supposée après cette entrée, tout en gardant le lien coordonné de l’hébreu.
- source_word: לֹא אָבוֹא
  choice: Je n’y entrerai pas
  rationale: La reprise avec « y » est idiomatique en français et conserve le refus ferme d’entrer dans le lieu mentionné.
theological_decisions:
- issue: Portée de l’entrée dans le Temple
  choice: Le texte principal laisse entendre qu’une telle entrée exposerait Néhémie à la mort, sans expliciter la règle cultuelle en cause.
  alternative: Comprendre que Néhémie refuse simplement une cachette, sans implication liée à l’accès au sanctuaire.
  rationale: Le contexte de Néhémie 6.10-13 indique que la proposition visait à le faire pécher et à le discréditer. La traduction et la note préservent cette portée probable sans préciser au-delà du texte la nature exacte de l’interdiction.
translation_notes:
  register: Français international moderne, digne et direct. Les deux questions rhétoriques conservent le courage et le sens de la responsabilité de Néhémie. La majuscule à « Temple » identifie ici le sanctuaire de Jérusalem.
