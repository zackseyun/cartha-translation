  text: כִּ֣י כֻלָּ֗/ם מְיָֽרְאִ֤ים אוֹתָ֨/נוּ֙ לֵ/אמֹ֔ר יִרְפּ֧וּ יְדֵי/הֶ֛ם מִן הַ/מְּלָאכָ֖ה וְ/לֹ֣א תֵעָשֶׂ֑ה וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: fr
  text: 'Car tous cherchaient à nous effrayer[a], en disant : « Leurs mains faibliront dans ce travail, et il ne se fera pas. » Mais maintenant[b], fortifie mes mains !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cherchaient à nous faire peur ». Le texte hébreu porte bien « nous », et non « me ».'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est une brève prière adressée à Dieu. Une autre vocalisation a parfois conduit à la comprendre autrement, mais le texte massorétique porte un impératif : « fortifie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים אֹתָנוּ
  choice: cherchaient à nous effrayer
  rationale: Le participe au hiphil exprime ici une action continue visant à provoquer la peur. Le pluriel « nous » respecte directement le texte massorétique.
- source_word: לֵאמֹר
  choice: en se disant
  rationale: Dans ce contexte, l’infinitif introduit le contenu de l’intention ou du raisonnement des adversaires, plutôt qu’une parole nécessairement prononcée devant Néhémie.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: Leurs mains faibliront
  rationale: Cette formulation conserve l’image hébraïque des mains qui perdent leur force tout en exprimant naturellement la perte de courage et d’efficacité.
- source_word: מִן־הַמְּלָאכָה
  choice: dans ce travail
  rationale: La préposition marque ici le domaine ou la cause de l’affaiblissement. « Ce travail » renvoie clairement au chantier de reconstruction.
- source_word: וְלֹא תֵעָשֶׂה
  choice: et il ne se fera pas
  rationale: Le nifal est rendu au passif et son sujet reste le travail mentionné juste avant, sans ajouter explicitement l’idée d’achèvement.
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Cette expression marque le passage contrasté du projet des adversaires à la brève prière de Néhémie.
- source_word: חַזֵּק אֶת־יָדָי
  choice: fortifie mes mains
  rationale: La traduction préserve l’image des mains et son écho antithétique avec les mains censées faiblir. L’impératif est compris comme une demande adressée à Dieu.
theological_decisions:
- issue: Passage du récit à une prière directe
  choice: « Mais maintenant, fortifie mes mains ! » est rendu comme une brève prière de Néhémie à Dieu.
  alternative: 'Comprendre la clause comme une affirmation ou une exhortation personnelle : « maintenant, je fortifiai mes mains ».'
  rationale: La vocalisation massorétique donne un impératif masculin singulier, qui se lit naturellement comme une adresse à Dieu et correspond aux prières brèves insérées dans le récit de Néhémie.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre les mains qui risquent de faiblir et les mains que Néhémie demande à Dieu de fortifier est volontairement conservé.
