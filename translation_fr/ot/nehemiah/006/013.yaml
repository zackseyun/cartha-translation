base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: fr
  text: 'C’est pour cela qu’il avait été engagé : pour que je prenne peur, que j’agisse ainsi et que je pèche[a], afin qu’ils aient matière à me calomnier[b] et à me couvrir d’opprobre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il avait été payé » ou « soudoyé ». Le mot hébreu signifie le plus directement « engagé » ou « payé » ; « soudoyé » rend plus explicite le caractère malhonnête du paiement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et cela serait pour eux un mauvais nom ». L’expression signifie probablement que le péché de Néhémie donnerait à ses ennemis matière à le calomnier et à ternir sa réputation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: dans ce but / pour que / afin de
  rationale: Les trois occurrences expriment le but ou le résultat recherché. La variation française évite une répétition pesante tout en conservant cette progression.
- source_word: שָׂכוּר
  choice: engagé
  rationale: Le participe passif signifie directement « engagé » ou « payé ». « Engagé » garde le sens lexical sans expliciter plus que le texte l’idée de corruption.
- source_word: אִירָא
  choice: je prenne peur
  rationale: Après לְמַעַן, l’imparfait présente l’effet recherché sur Néhémie. Cette formulation est naturelle et dynamique en français moderne.
- source_word: וְאֶעֱשֶׂה כֵן
  choice: que j’agisse ainsi
  rationale: La formule signifie littéralement « et que je fasse ainsi ». « Agir ainsi » renvoie clairement à la conduite proposée dans le contexte.
- source_word: וְחָטָאתִי
  choice: et que je pèche
  rationale: 'Le parfait coordonné exprime ici la conséquence visée : l’acte aurait constitué un péché.'
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: Ils auraient alors de quoi me faire une mauvaise réputation
  rationale: Littéralement, la chose « serait pour eux comme un mauvais nom ». Dans le contexte, le péché projeté fournirait aux adversaires un moyen de porter atteinte à la réputation de Néhémie.
- source_word: יְחָרְפוּנִי
  choice: m’insulter
  rationale: חרף peut signifier outrager, insulter ou couvrir de reproches. « Insulter » exprime clairement l’hostilité et l’humiliation recherchées.
