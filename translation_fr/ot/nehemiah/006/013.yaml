revisions:
- from: 'C’est dans ce but qu’il avait été engagé : pour que je prenne peur, que j’agisse ainsi et que je pèche[a]. Ils auraient alors de quoi me faire une mauvaise réputation[b], afin de m’insulter.'
  to: 'C’est pour cela qu’il avait été engagé : pour que je prenne peur, que j’agisse ainsi et que je pèche[a], afin qu’ils aient matière à me calomnier[b] et à me couvrir d’opprobre.'
  rationale: La révision maintient la structure de but du verset et le sens non surinterprété de « engagé ». Elle rend plus explicitement, mais sans rigidifier l'idiome discuté, que l'acte fautif aurait fourni aux ennemis une matière à calomnie, puis à opprobre. Les deux ancres de notes restent attachées aux unités lexicales correspondantes.
