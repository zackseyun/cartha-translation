  to: Lorsque Sanballat, Tobiya, Guéshem l’Arabe et le reste de nos ennemis apprirent que j’avais rebâti la muraille[a] et qu’il n’y restait plus aucune brèche — bien que, jusque-là, je n’eusse pas encore posé les battants aux portes —
  rationale: La révision remplace « les portes dans les entrées » par « les battants aux portes ». Elle préserve ainsi le contraste lexical de l’hébreu entre les battants (דְּלָתוֹת) et les portes de ville (שְׁעָרִים), en français moderne et naturel. « Bien que » exprime directement la concession factuelle introduite dans le contexte, sans changer le sens ni la suspension syntaxique du verset.
