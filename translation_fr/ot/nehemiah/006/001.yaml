  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: fr
  text: Lorsque Sanballat, Tobiya, Guéshem l’Arabe et le reste de nos ennemis apprirent que j’avais rebâti la muraille[a] et qu’il n’y restait plus aucune brèche — bien que, jusque-là, je n’eusse pas encore posé les battants aux portes —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bâti la muraille ». Le verbe hébreu signifie simplement « bâtir » ; « rebâti » convient ici au contexte de la restauration d’une muraille existante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר נִשְׁמַע
  choice: Lorsque … apprirent
  rationale: La tournure française personnelle et active rend naturellement le niphal « il fut entendu / on apprit », tandis que « lorsque » introduit sans lourdeur le nouveau développement narratif.
- source_word: סַנְבַלַּט ... טוֹבִיָּה ... גֶשֶׁם הָעַרְבִי
  choice: Sanballat, Tobiya, Guéshem l’Arabe
  rationale: Les noms propres sont translittérés en français; הָעַרְבִי est rendu directement comme désignation ethnique.
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: le reste de nos ennemis
  rationale: Traduction directe, naturelle et précise de l’idée de ceux qui restent parmi les ennemis.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: j’avais rebâti la muraille
  rationale: Le verbe signifie littéralement « bâtir », mais le contexte décrit la remise en état d’une muraille préexistante; « rebâtir » explicite naturellement ce contexte sans masquer le sens littéral, signalé en note.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: il n’y restait plus aucune brèche
  rationale: פֶּרֶץ désigne ici une ouverture ou brèche dans la muraille; cette formulation conserve l’idée qu’aucune ne demeurait.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: même si, jusque-là
  rationale: Dans ce contexte, גַּם introduit une réserve concessive. La formulation française exprime clairement que les portes n’étaient néanmoins pas encore installées.
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי
  choice: je n’avais pas encore posé les portes
  rationale: Le hiphil de עמד signifie ici mettre en place. « Poser » est idiomatique en français et ne précise pas indûment la technique d’installation.
- source_word: בַּשְּׁעָרִים
  choice: dans les entrées
  rationale: Les דְּלָתוֹת sont les battants installés dans les ouvertures fortifiées. « Entrées » évite la répétition ambiguë de « portes dans les portes » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste volontairement inachevée, comme le verset hébreu, puisqu’elle se poursuit au verset suivant. Les tirets isolent la réserve concernant les portes. La distinction entre la muraille, ses brèches, les portes et les entrées fortifiées est maintenue.
