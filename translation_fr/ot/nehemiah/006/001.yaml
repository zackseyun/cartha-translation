  source_fidelity: 'Le sens global est fidèle au texte hébreu : les adversaires apprennent l’achèvement de la muraille, sans brèche restante, tandis que les battants des portes n’ont pas encore été mis en place. « Rebâti » est défendable dans le contexte et son caractère interprétatif est correctement signalé en note.'
