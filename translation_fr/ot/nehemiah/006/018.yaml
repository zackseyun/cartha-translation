  text: כִּי רַבִּ֣ים בִּֽ/יהוּדָ֗ה בַּעֲלֵ֤י שְׁבוּעָה֙ ל֔/וֹ כִּי חָתָ֥ן ה֖וּא לִ/שְׁכַנְיָ֣ה בֶן אָרַ֑ח וִֽ/יהוֹחָנָ֣ן בְּנ֔/וֹ לָקַ֕ח אֶת בַּת מְשֻׁלָּ֖ם בֶּ֥ן בֶּֽרֶכְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: fr
  text: 'Car beaucoup de gens en Juda lui étaient liés par serment[a] : il était en effet le gendre de Shekania, fils d’Arah, et son fils Yohanân avait épousé[b] la fille de Meshoullam, fils de Bérékia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « beaucoup de gens en Juda étaient détenteurs d’un serment envers lui »; autrement dit, ils étaient tenus envers lui par serment.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avait pris la fille de Meshoullam »; il s’agit d’une expression courante pour dire qu’il l’avait épousée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: beaucoup de gens en Juda
  rationale: Le locatif « en Juda » désigne ici les membres de la communauté ou de la province; « beaucoup de gens » est naturel en français et évite de substantiver maladroitement « beaucoup ».
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: lui étaient liés par serment
  rationale: L’expression signifie littéralement qu’ils étaient « détenteurs d’un serment envers lui », c’est-à-dire tenus envers lui par un engagement juré. La formulation retenue conserve la force de cette obligation.
- source_word: כִּי … כִּי
  choice: Car … en effet
  rationale: Le premier כִּי rattache le verset à l’explication donnée dans le contexte précédent; le second introduit le motif de ces liens jurés. La ponctuation française rend clairement cette relation logique.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: il était le gendre de Shekania
  rationale: Dans ce contexte de parenté, חָתָן désigne vraisemblablement un gendre. « Allié par mariage » resterait possible, mais serait moins précis et moins naturel.
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: et son fils Yohanân
  rationale: Le pronom renvoie naturellement au personnage principal de l’explication, Tobie, dont les alliances matrimoniales expliquent les obligations mentionnées; cette lecture correspond aussi à l’enchaînement syntaxique.
- source_word: לָקַח אֶת בַּת
  choice: avait épousé la fille
  rationale: « Prendre la fille de quelqu’un » est ici un idiome matrimonial. « Épouser » en exprime clairement le sens en français moderne, tandis qu’une note conserve la forme littérale.
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: la fille de Meshoullam, fils de Bérékia
  rationale: Cette formulation reproduit clairement la chaîne patronymique hébraïque.
