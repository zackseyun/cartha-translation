  source_fidelity: 'Le sens essentiel est bien rendu : déplacement chez Shemaya, état indéterminé d''empêchement, invitation à se réunir dans l''édifice du temple, fermeture des portes et menace répétée. Toutefois, « petit-fils » interprète trop précisément la seconde relation exprimée par בן, qui est littéralement « fils de » et peut, selon l''usage généalogique, avoir une portée plus large. La formulation de la note doit aussi mieux présenter l''alternative « sanctuaire » et l''opposition au vaste ensemble cultuel.'
  naturalness: Le registre narratif est bon et le passé simple convient. « Retrouvons-nous » est naturel. « Ils viennent te tuer » est plus idiomatique et direct que « ils viennent pour te tuer », tout en gardant la construction de l'hébreu. « De nuit » rend de façon concise la mise en relief temporelle répétée.
  terminology: « Maison de Dieu » et « temple » sont appropriés. La note conserve utilement « sanctuaire », sans trancher la portée technique de הֵיכָל. Les noms sont conservés selon la translittération du projet.
