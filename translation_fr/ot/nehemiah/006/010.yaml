  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: fr
  text: 'Je me rendis alors chez Shemaya, fils de Delaya, fils de Mehetabel. Il était enfermé. Il me dit : « Retrouvons-nous dans la maison de Dieu, à l’intérieur du temple[a], et fermons-en les portes, car ils viennent te tuer. Oui, de nuit, ils viennent te tuer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’intérieur du sanctuaire ». Le terme hébreu heikhal peut désigner l’édifice du temple ou le sanctuaire, plutôt que l’ensemble du complexe du temple ou ses parvis.
    reason: Alternative lexicale préservant la portée possible de הֵיכָל.
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: Je me rendis alors
  rationale: Le pronom explicite met légèrement le sujet en relief, et la conjonction poursuit le récit. « Se rendre chez » exprime naturellement le déplacement vers la maison de Shemaya.
- source_word: בֵּית שְׁמַעְיָה
  choice: chez Shemaya
  rationale: Dans ce contexte, « la maison de Shemaya » désigne son domicile ; « chez Shemaya » est plus naturel en français moderne sans changer le sens.
- source_word: שְׁמַעְיָה בֶן דְּלָיָה בֶּן מְהֵיטַבְאֵל
  choice: Shemaya, fils de Delaya et petit-fils de Mehetabel
  rationale: Les noms sont translittérés de manière lisible. Le second בֶן indique ici la génération précédente ; « petit-fils » évite une chaîne française ambiguë.
- source_word: וְהוּא עָצוּר
  choice: Il était enfermé
  rationale: עָצוּר peut signifier retenu, enfermé ou reclus. Cette formulation conserve l’incertitude sur la cause et le caractère volontaire ou imposé de sa situation.
- source_word: נִוָּעֵד
  choice: Retrouvons-nous
  rationale: La forme exprime une proposition de rencontre. « Retrouvons-nous » est idiomatique et garde la valeur exhortative.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: La traduction conserve l’expression hébraïque usuelle désignant le complexe du temple.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: à l’intérieur du temple
  rationale: La formulation marque clairement l’entrée dans le bâtiment sacré, sans préciser davantage une zone cultuelle que le terme hébreu ne nomme pas explicitement.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: et fermons-en les portes
  rationale: La valeur exhortative se poursuit. Le pronom « en » évite une répétition lourde tout en renvoyant sans ambiguïté au temple.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: car ils viennent pour te tuer
  rationale: Le participe pluriel a un sujet indéfini naturellement rendu par « ils » ; la proposition de but est traduite directement.
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: Oui, c’est pendant la nuit qu’ils viennent pour te tuer
  rationale: La répétition est conservée pour rendre l’urgence. La tournure emphatique met en relief la nuit sans transformer l’expression en « cette nuit », plus précise que l’hébreu.
theological_decisions:
- issue: Portée de הֵיכָל dans un contexte d’accès à un espace sacré restreint
  choice: temple
  alternative: sanctuaire
  rationale: Le contexte du verset suivant donne du poids au sens plus précis de « sanctuaire », mais הֵיכָל peut désigner le bâtiment du temple sans identifier techniquement sa partie la plus intérieure. Le texte principal reste lisible et la note préserve l’alternative théologiquement significative.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit ; le discours direct reste naturel et pressant. Les répétitions porteuses d’urgence sont maintenues.
