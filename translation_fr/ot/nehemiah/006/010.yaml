    rationale: Le texte hébreu porte littéralement « fils de Delaya, fils de Mehetabel ». Bien que « petit-fils » soit possible dans une généalogie, le terme בן n'impose pas ici une relation de petit-fils au sens strict. Conserver la répétition évite de restreindre indûment la relation.
