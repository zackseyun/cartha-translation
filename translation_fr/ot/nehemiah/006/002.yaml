  terminology: Les noms « Sanballat », « Guéshem » et « Ono » sont cohérents. « Plaine » pour בִּקְעָה et « faire du mal » pour לַעֲשׂוֹת לִי רָעָה sont justes; les notes préservent les alternatives lexicales pertinentes.
