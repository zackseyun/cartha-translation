  text: וַ/יִּשְׁלַ֨ח סַנְבַלַּ֤ט וְ/גֶ֨שֶׁם֙ אֵלַ֣/י לֵ/אמֹ֔ר לְכָ֞/ה וְ/נִֽוָּעֲדָ֥ה יַחְדָּ֛ו בַּ/כְּפִירִ֖ים בְּ/בִקְעַ֣ת אוֹנ֑וֹ וְ/הֵ֨מָּה֙ חֹֽשְׁבִ֔ים לַ/עֲשׂ֥וֹת לִ֖/י רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: fr
  text: 'Alors Sanballat et Guéshem m’envoyèrent dire : « Viens, rencontrons-nous dans les villages[a] de la plaine[b] d’Ono. » Mais ils projetaient de me faire du mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « à Kefirim », si l’on comprend le mot hébreu comme un nom de lieu plutôt que comme « villages ».'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « plaine » peut aussi être rendu par « vallée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח סַנְבַלַּט וְגֶשֶׁם אֵלַי לֵאמֹר
  choice: Sanballat et Guéshem m’envoyèrent dire
  rationale: La tournure française naturelle « envoyer dire » rend la formule hébraïque avec לֵאמֹר sans ajouter explicitement « un message ». Le verbe hébreu au singulier devant un sujet composé est idiomatique.
- source_word: לְכָה
  choice: Viens
  rationale: Dans cette invitation, l’impératif du verbe « aller/marcher » correspond naturellement au français « Viens ».
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: rencontrons-nous
  rationale: Le niphal de יעד exprime ici une rencontre convenue; la forme pronominale française rend aussi l’idée réciproque de יַחְדָּו sans lourdeur.
- source_word: בַּכְּפִירִים
  choice: dans l’un des villages
  rationale: Le nom commun peut désigner des villages ou hameaux. Le pluriel hébreu avec la préposition peut, dans ce contexte d’invitation à un lieu de rencontre, être rendu idiomatiquement par « dans l’un des villages »; la lecture comme nom de lieu est conservée en note.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: de la plaine d’Ono
  rationale: בִּקְעָה désigne une large vallée ou plaine. « Plaine » convient au relief évoqué et reste accessible; « vallée » demeure possible et figure en note.
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: Mais ils projetaient
  rationale: Le contexte donne à la conjonction une valeur adversative. חשׁב exprime ici un dessein ou projet, et non une simple pensée.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: de me faire du mal
  rationale: Cette expression française naturelle rend l’intention hostile sans préciser indûment la forme du tort envisagé.
