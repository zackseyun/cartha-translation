  source_fidelity: La traduction rend fidèlement l’invitation, le lieu et l’intention hostile. Toutefois, « l’un des villages » introduit l’idée de singularité (« l’un »), absente de l’hébreu בכפרים, qui est pluriel si on le comprend comme nom commun.
