  text: They sent to me four times in this way[a], and I answered them in the same way.
translation:
  language: fr
  text: Ils m’envoyèrent quatre fois le même message[a], et je leur répondis de la même manière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon cette parole » dans les deux propositions. L’expression renvoie ici au même message répété et à une réponse du même ordre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: Ils m’envoyèrent
  rationale: Le verbe signifie simplement « envoyer » et son objet reste implicite en hébreu. La tournure française conserve cette ellipse tout en exprimant clairement que la démarche vise Néhémie.
- source_word: כַּדָּבָר הַזֶּה
  choice: la même demande
  rationale: Littéralement « selon cette parole/chose ». Dans le contexte, l’expression renvoie à l’invitation répétée des adversaires. « La même demande » rend naturellement ce référent sans préciser qu’un messager ou une lettre fut envoyé.
- source_word: אַרְבַּע פְּעָמִים
  choice: quatre fois
  rationale: Expression directe indiquant quatre occurrences.
- source_word: וָאָשִׁיב אוֹתָם
  choice: je leur répondis
  rationale: Le hiphil de שוב peut désigner le fait de retourner une réponse. En français, « répondre à quelqu’un » demande un complément indirect, d’où « leur » plutôt que le calque « les ».
- source_word: כַּדָּבָר הַזֶּה
  choice: chaque fois de la même manière
  rationale: La répétition exacte de l’expression hébraïque indique que Néhémie renouvela une réponse du même ordre. « Chaque fois » explicite la portée distributive naturelle du contexte, tandis que « de la même manière » évite de prétendre que les mots étaient nécessairement identiques.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit biblique écrit. La formulation évite le calque peu naturel « selon cette parole » dans le corps du texte, tout en le signalant en note et sans ajouter de moyen de communication absent de l’hébreu.
