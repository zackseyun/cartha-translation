- from: Ils m’envoyèrent quatre fois la même demande[a], et je leur répondis chaque fois de la même manière.
  to: Ils m’envoyèrent quatre fois le même message[a], et je leur répondis de la même manière.
  rationale: La révision remplace une association verbale peu naturelle par « le même message », qui rend de façon idiomatique l’objet implicite de « envoyer » dans ce contexte. Elle maintient la répétition voulue par l’hébreu et conserve en note la littéralité de l’expression, sans imposer un support précis ni l’identité verbatim des réponses.
