  text: וַ/יִּשְׁלְח֥וּ אֵלַ֛/י כַּ/דָּבָ֥ר הַ/זֶּ֖ה אַרְבַּ֣ע פְּעָמִ֑ים וָ/אָשִׁ֥יב אוֹתָ֖/ם כַּ/דָּבָ֥ר הַ/זֶּֽה׃ס
