  text: וּ/בַ/חֲנֻכַּ֞ת חוֹמַ֣ת יְרוּשָׁלִַ֗ם בִּקְשׁ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל מְק֣וֹמֹתָ֔/ם לַ/הֲבִיאָ֖/ם לִֽ/ירוּשָׁלִָ֑ם לַ/עֲשֹׂ֨ת חֲנֻכָּ֤ה וְ/שִׂמְחָה֙ וּ/בְ/תוֹד֣וֹת וּ/בְ/שִׁ֔יר מְצִלְתַּ֖יִם נְבָלִ֥ים וּ/בְ/כִנֹּרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: fr
  text: Lors de la dédicace de la muraille de Jérusalem, ils recherchèrent les lévites partout où ils se trouvaient[a], afin de les faire venir à Jérusalem pour célébrer la dédicace[b] dans la joie, avec des actions de grâce et des chants, au son des cymbales, des harpes et des lyres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils cherchèrent les lévites dans tous leurs lieux de résidence » ou, selon le contexte, « ils convoquèrent les lévites ». Le verbe hébreu signifie d’abord « chercher ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour faire une dédicace ».'
    reason: lexical_alternative
  - marker: c
    text: La distinction exacte entre les deux instruments à cordes traduits par « harpes » et « lyres » est incertaine; l’hébreu emploie deux noms d’instruments différents.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: Lors de la dédicace de la muraille de Jérusalem
  rationale: La tournure temporelle « lors de » rend naturellement la préposition בְּ; « dédicace » conserve le sens nominal de חֲנֻכָּה, et « muraille » convient mieux qu’un simple « mur » à l’enceinte d’une ville.
- source_word: בִּקְשׁוּ אֶת הַלְוִיִּם
  choice: ils recherchèrent les lévites
  rationale: בקשׁ signifie d’abord « chercher ». « Recherchèrent » conserve cette valeur sans préciser indûment qu’il s’agissait d’une convocation officielle.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: partout où ils se trouvaient
  rationale: Cette formulation française naturelle rend l’idée distributive de « tous leurs lieux », c’est-à-dire les différents endroits où résidaient les lévites, sans imposer le sens plus précis de « villes » ou de « villages ».
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: afin de les faire venir à Jérusalem
  rationale: Le hifil de בוא est causatif. Dans ce contexte, « faire venir » est plus naturel en français que « les apporter » ou « les amener », puisqu’il s’agit de personnes dispersées que l’on rassemble.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: pour célébrer la dédicace
  rationale: Littéralement, l’hébreu dit « faire une dédicace ». « Célébrer la dédicace » transmet idiomatiquement l’accomplissement de la cérémonie.
- source_word: וְשִׂמְחָה
  choice: dans la joie
  rationale: שִׂמְחָה désigne la joie ou l’allégresse; « dans la joie » s’intègre naturellement à la description de la célébration.
- source_word: וּבְתוֹדוֹת וּבְשִׁיר
  choice: avec des actions de grâce et des chants
  rationale: « Actions de grâce » conserve le sens de תּוֹדוֹת sans l’assimiler automatiquement aux chants, tandis que le pluriel français « chants » rend naturellement le collectif שִׁיר.
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: au son des cymbales, des harpes et des lyres
  rationale: « Au son de » explicite sans excès la fonction musicale des instruments. Les deux derniers termes désignent deux instruments à cordes distincts, traditionnellement rendus par « harpes » et « lyres », bien que leur identification exacte demeure incertaine.
