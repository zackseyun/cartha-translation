translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le sujet pluriel indéterminé de l’hébreu (« ils »), le vocabulaire cérémoniel et l’énumération musicale, tout en évitant une syntaxe trop calquée. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
