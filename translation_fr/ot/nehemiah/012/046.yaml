id: NEH.12.46
reference: Nehemiah 12:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי בִ/ימֵ֥י דָוִ֛יד וְ/אָסָ֖ף מִ/קֶּ֑דֶם ראש הַ/מְשֹׁ֣רְרִ֔ים וְ/שִׁיר תְּהִלָּ֥ה וְ/הֹד֖וֹת לֵֽ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: fr
  text: Car autrefois, au temps de David et d’Asaph, il y avait des chefs parmi les chanteurs[a], ainsi que des chants de louange et d’actions de grâce à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « chef des chanteurs »; le singulier paraît avoir ici un sens collectif. On peut aussi traduire « responsables des chanteurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve clairement le lien logique avec le contexte.
- source_word: בִימֵי דָוִיד וְאָסָף מִקֶּדֶם
  choice: autrefois, au temps de David et d’Asaph
  rationale: Rend l’expression temporelle dans un français naturel tout en associant מִקֶּדֶם à l’époque ancienne de David et d’Asaph.
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: des chefs parmi les chanteurs
  rationale: Le singulier רֹאשׁ semble avoir ici une valeur collective. « Chefs » exprime la fonction de direction, tandis que « chanteurs » reste précis et compréhensible.
- source_word: וְשִׁיר תְּהִלָּה
  choice: ainsi que des chants de louange
  rationale: Le singulier שִׁיר peut désigner collectivement le répertoire chanté. « Ainsi que » relie naturellement ce second élément à la proposition elliptique.
- source_word: וְהֹדוֹת לֵאלֹהִים
  choice: et d’actions de grâce à Dieu
  rationale: הֹדוֹת désigne ici des expressions de reconnaissance adressées à Dieu; « actions de grâce » convient au registre cultuel sans être confessionnellement marqué.
theological_decisions:
- issue: Ellipse du verbe dans la proposition hébraïque
  choice: il y avait
  alternative: conserver une phrase nominale sans verbe
  rationale: Le verbe d’existence est sous-entendu en hébreu. Son ajout est nécessaire pour obtenir une phrase française intelligible et ne modifie pas la portée théologique du texte.
translation_notes:
  register: Français moderne, digne et accessible. « Chanteurs » a été préféré à « chantres », plus traditionnel mais moins courant. La syntaxe hébraïque elliptique est explicitée avec « il y avait », et l’ambiguïté du singulier collectif est signalée en note.
