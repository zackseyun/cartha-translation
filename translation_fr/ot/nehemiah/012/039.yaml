  terminology: Les noms Éphraïm et Hananel sont correctement transcrits. « Vieille Porte », « porte des Poissons », « tour des Cent » et « porte des Brebis » sont des rendus sobres. « porte de la Garde » préserve utilement l’incertitude de מַטָּרָה; les alternatives en note sont appropriées.
