base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: fr
  text: Ils passèrent au-dessus de la porte d’Éphraïm, de la Vieille Porte, de la porte des Poissons, de la tour de Hananel et de la tour des Cent, jusqu’à la porte des Brebis. Ils s’arrêtèrent[a] à la porte de la Garde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se tinrent » ou « prirent place ».
    reason: lexical_alternative
  - marker: b
    text: Ou « porte de la Prison » ou « porte du Poste de garde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעַל ... וְעַל ... וְעַל
  choice: au-dessus de
  rationale: Dans le contexte d’une procession longeant le sommet de la muraille, la valeur spatiale de עַל est mieux rendue par « au-dessus de » que par le simple « près de ». La répétition hébraïque est condensée en français pour assurer une lecture naturelle.
- source_word: לְשַׁעַר אֶפְרַיִם
  choice: la porte d’Éphraïm
  rationale: Rend directement la relation construite entre « porte » et le nom propre Éphraïm.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: la Vieille Porte
  rationale: Rendu traditionnel et direct de l’expression, sans préciser arbitrairement « vieille ville » ni traiter le terme comme un nom propre.
- source_word: שַׁעַר הַדָּגִים
  choice: la porte des Poissons
  rationale: Traduction idiomatique du groupe construit « porte des poissons » et nom usuel de ce lieu.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: la tour de Hananel
  rationale: Conserve le nom propre et la structure transparente de l’hébreu.
- source_word: מִגְדַּל הַמֵּאָה
  choice: la tour des Cent
  rationale: Préserve l’expression énigmatique de l’hébreu sans expliquer ce que désigne « cent ».
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: jusqu’à la porte des Brebis
  rationale: עַד indique la limite atteinte par l’itinéraire.
- source_word: וְעָמְדוּ
  choice: ils s’arrêtèrent
  rationale: עמד signifie littéralement « se tenir debout », mais, après la description d’un déplacement, il peut naturellement signaler l’arrêt de la procession. Une note conserve le sens plus formel.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: à la porte de la Garde
  rationale: מַטָּרָה appartient au champ de la garde, de la surveillance ou du lieu de détention. « Garde » reste prudent et n’impose pas l’interprétation « prison ».
