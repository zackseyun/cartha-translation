  to: Et tout Israël, aux jours de Zorobabel et aux jours de Néhémie, donnait les parts[a] destinées aux chanteurs et aux portiers, selon ce qui était requis chaque jour[b] ; il mettait à part pour les Lévites, et les Lévites mettaient à part pour les fils d’Aaron[c].
  rationale: La révision retire « ce qui était destiné », ajout absent du texte source, et rend מַקְדִּשִׁים par « mettait à part ». Cette expression conserve la notion de mise à part cultuelle tout en respectant l’ellipse de l’objet en hébreu. Le reste de la traduction et les ancres de notes sont conservés; la légère révision de l’idiome quotidien améliore la précision sans modifier le sens.
