  text: וְ/כָל יִשְׂרָאֵל֩ בִּ/ימֵ֨י זְרֻבָּבֶ֜ל וּ/בִ/ימֵ֣י נְחֶמְיָ֗ה נֹֽתְנִ֛ים מְנָי֛וֹת הַ/מְשֹׁרְרִ֥ים וְ/הַ/שֹּׁעֲרִ֖ים דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ וּ/מַקְדִּשִׁים֙ לַ/לְוִיִּ֔ם וְ/הַ/לְוִיִּ֔ם מַקְדִּשִׁ֖ים לִ/בְנֵ֥י אַהֲרֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: fr
  text: Et tout Israël, aux jours de Zorobabel et aux jours de Néhémie, donnait les parts[a] destinées aux chanteurs et aux portiers, selon ce qui était requis chaque jour[b] ; il mettait à part pour les Lévites, et les Lévites mettaient à part pour les fils d’Aaron[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les parts attribuées ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’affaire d’un jour en son jour », c’est-à-dire ce que chaque jour exigeait.'
    reason: source_idiom
  - marker: c
    text: C’est-à-dire les prêtres descendants d’Aaron.
    reason: historical_clarification
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Et tout Israël
  rationale: Conserve l’expression collective et historique de l’hébreu. L’accord au singulier en français traite Israël comme un peuple pris dans son ensemble.
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: aux jours de Zorobabel et aux jours de Néhémie
  rationale: Maintient la répétition solennelle de בִּימֵי et le cadre historique du texte source.
- source_word: נֹתְנִים
  choice: donnait
  rationale: Le participe décrit ici une pratique habituelle pendant la période évoquée ; l’imparfait français exprime naturellement cette durée ou répétition.
- source_word: מְנָיוֹת
  choice: les parts
  rationale: Désigne les parts de subsistance attribuées au personnel du temple. « Parts » est clair et concis, tandis que la nuance d’attribution est signalée en note.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: les chanteurs et les portiers
  rationale: Rend les fonctions reconnues du service du temple dans un français courant et digne.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: selon les besoins de chaque jour
  rationale: Exprime clairement l’idiome hébreu, qui évoque ce qui devait être fourni quotidiennement, sans reproduire un calque obscur.
- source_word: מַקְדִּשִׁים
  choice: consacrait
  rationale: Préserve la dimension sacrée de la racine קדשׁ. Le complément « ce qui était destiné » explicite sobrement l’objet sous-entendu par le contexte sans le réduire à un simple don administratif.
- source_word: לַלְוִיִּם
  choice: ce qui était destiné aux Lévites
  rationale: La préposition ל indique les bénéficiaires. Cette formulation française rend explicite l’objet implicite tout en évitant de définir plus précisément la nature des biens consacrés.
- source_word: בְנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: Conserve la désignation généalogique du texte source au lieu de la remplacer directement par son référent fonctionnel, les prêtres.
theological_decisions:
- issue: Sens cultuel de מַקְדִּשִׁים dans le contexte du soutien au temple
  choice: « consacrait ce qui était destiné » aux Lévites, puis aux fils d’Aaron
  alternative: « mettait à part » ou « fournissait une part » aux Lévites et aux prêtres
  rationale: « Consacrait » maintient la notion de sainteté propre à קדשׁ, tandis que « ce qui était destiné » fournit en français l’objet que l’hébreu laisse implicite. La traduction ne précise pas indûment la nature exacte de ces biens.
- issue: Identification des fils d’Aaron
  choice: Maintien de « fils d’Aaron » dans le texte
  alternative: « prêtres descendants d’Aaron » ou « prêtres aaronides »
  rationale: La formulation généalogique est théologiquement et historiquement significative. Une note indique sa fonction sacerdotale sans la substituer au texte.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait souligne la pratique habituelle. La répétition « aux jours de… et aux jours de… » conserve la cadence historique de l’hébreu. Les termes cultuels restent accessibles sans effacer leur portée sacrée.
