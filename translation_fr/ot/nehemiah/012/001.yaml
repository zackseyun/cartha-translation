source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֥ר עָל֛וּ עִם זְרֻבָּבֶ֥ל בֶּן שְׁאַלְתִּיאֵ֖ל וְ/יֵשׁ֑וּעַ שְׂרָיָ֥ה יִרְמְיָ֖ה עֶזְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: fr
  text: 'Voici les prêtres et les lévites qui montèrent avec Zorobabel, fils de Shéaltiel, et Yéchoua[a] : Seraya, Jérémie, Esdras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu « Yéchoua » ; on peut aussi traduire « Josué » si le nom est normalisé plutôt que transcrit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne la nouvelle liste tout en rendant la fonction présentative du démonstratif précédé de waw, sans ajouter un marqueur temporel.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: les prêtres et les lévites
  rationale: Rend directement les deux groupes coordonnés dans ce contexte de liste.
- source_word: אֲשֶׁר עָלוּ
  choice: qui montèrent
  rationale: Conserve le sens spatial de עלה, couramment employé pour la montée vers Juda et Jérusalem lors du retour d’exil, sans expliciter une destination absente du verset.
- source_word: עִם
  choice: avec
  rationale: Rend simplement l’accompagnement.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Zorobabel, fils de Shéaltiel
  rationale: Emploie les formes françaises usuelles des noms et exprime directement la filiation.
- source_word: וְיֵשׁוּעַ
  choice: et Yéchoua[a]
  rationale: Transcrit la forme hébraïque postexilique יֵשׁוּעַ plutôt que de la normaliser silencieusement en « Josué »; la variante est signalée en note.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: Seraya, Jérémie, Esdras
  rationale: Présente les noms qui ouvrent la liste sous leurs formes françaises usuelles ou, pour Seraya, sous une translittération claire.
