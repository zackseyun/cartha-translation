  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: fr
  text: 'Et les Lévites étaient : Josué, Binnouï, Qadmiel, Shérébia, Juda et Mattania, qui, avec ses frères, était chargé des chants d’action de grâce.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « eux et leurs frères étaient chargés des actions de grâce ». L’hébreu peut être compris collectivement, bien que le pronom singulier renvoie le plus naturellement à Mattania. Le mot traduit par « chants d’action de grâce » désigne plus littéralement des actions de grâce ou des expressions de louange.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 'Et les Lévites étaient :'
  rationale: La conjonction relie ce groupe à la liste précédente. Le verbe « étaient », absent mais sous-entendu en hébreu, rend l’énumération naturelle en français.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: Josué, Binnouï, Qadmiel, Shérébia, Juda et Mattania
  rationale: Les noms propres sont transcrits sous des formes françaises claires et cohérentes avec leur prononciation hébraïque.
- source_word: עַל
  choice: chargé de
  rationale: Dans ce contexte, la préposition exprime une responsabilité ou une fonction de direction; « chargé de » est idiomatique et précis en français.
- source_word: הֻיְּדוֹת
  choice: chants d’action de grâce
  rationale: Le pluriel désigne des expressions liturgiques de reconnaissance ou de louange. Dans le cadre des fonctions lévitiques, « chants d’action de grâce » explicite naturellement leur caractère cultuel sans exclure la portée plus large du terme.
- source_word: הוּא
  choice: qui ... était
  rationale: Le pronom masculin singulier renvoie le plus naturellement au dernier nom cité, Mattania, et se rend avec fluidité par une proposition relative.
- source_word: וְאֶחָיו
  choice: avec ses frères
  rationale: L’expression associe à Mattania d’autres Lévites présentés comme ses frères; le lien exprimé par le terme hébreu est conservé.
theological_decisions:
- issue: Référent du pronom singulier הוּא après une liste de Lévites
  choice: Le singulier renvoie à Mattania, qui exerçait cette responsabilité avec ses frères.
  alternative: La phrase peut être comprise plus collectivement comme attribuant cette fonction aux hommes nommés dans la liste.
  rationale: La proximité syntaxique et le pronom singulier favorisent Mattania comme référent. La note conserve toutefois l’autre compréhension possible sans trancher au-delà des données du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « chargé des » exprime naturellement la responsabilité cultuelle. La note réunit l’ambiguïté du référent et la nuance lexicale du terme liturgique.
