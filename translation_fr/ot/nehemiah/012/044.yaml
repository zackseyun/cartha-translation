source:
  edition: WLC
  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: fr
  text: Ce jour-là, des hommes furent préposés aux salles qui servaient d’entrepôts[a] pour les contributions sacrées, les prémices et les dîmes. Ils devaient y rassembler, en provenance des champs rattachés aux villes, les parts prescrites par la Loi[b] pour les prêtres et pour les lévites, car Juda se réjouissait des prêtres et des lévites qui étaient à leur poste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner des «salles» ou des «chambres»; ici, leur fonction d’entreposage est expressément indiquée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement «les parts de la Loi», c’est-à-dire les parts que la Torah prescrivait pour les prêtres et les lévites.
    reason: lexical_alternative
  - marker: c
    text: Littéralement «qui se tenaient debout»; dans ce contexte, l’expression désigne ceux qui se tenaient à leur poste pour assurer leur service.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: furent préposés
  rationale: Le passif exprime la désignation officielle de certains hommes à une responsabilité administrative; «préposés» convient naturellement avec le complément introduit par «aux».
- source_word: הַנְּשָׁכוֹת לָאֹצָרוֹת
  choice: les salles qui servaient d’entrepôts
  rationale: נשכות désigne des salles ou chambres, tandis que לאצרות en précise ici la fonction de stockage. La formulation française conserve les deux éléments sans suggérer une seconde série de locaux.
- source_word: לַתְּרוּמוֹת
  choice: pour les contributions sacrées
  rationale: תרומות désigne des biens mis à part et apportés pour l’usage sacré. «Contributions sacrées» reste clair tout en évitant de les confondre avec les sacrifices.
- source_word: לָרֵאשִׁית
  choice: les prémices
  rationale: Terme français établi pour la première part de la production consacrée à Dieu.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: et les dîmes
  rationale: Équivalent usuel et précis du terme hébreu désignant les dixièmes prélevés.
- source_word: לִכְנוֹס בָּהֶם
  choice: y rassembler
  rationale: Rend à la fois l’action de recueillir les biens et leur placement dans les salles mentionnées.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: en provenance des champs rattachés aux villes
  rationale: Les champs sont les terres agricoles relevant des différentes localités; «rattachés» explicite sobrement cette relation plutôt que de donner à entendre que les champs se trouvent dans les villes.
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: les parts prescrites par la Loi
  rationale: Le génitif hébreu signifie ici les parts fixées par la Torah. La formulation est idiomatique et son sens demeure transparent.
- source_word: כִּי שִׂמְחַת יְהוּדָה עַל
  choice: car Juda se réjouissait de
  rationale: Transforme naturellement en proposition verbale l’expression nominale hébraïque «car la joie de Juda était au sujet de», sans modifier son rapport causal.
- source_word: הָעֹמְדִים
  choice: qui étaient à leur poste
  rationale: Le participe signifie littéralement «ceux qui se tenaient debout»; dans le cadre du Temple, il évoque ceux qui se tiennent à leur poste pour accomplir leur service.
theological_decisions:
- issue: Portée de הָעֹמְדִים appliqué aux prêtres et aux lévites
  choice: qui étaient à leur poste
  alternative: qui accomplissaient leur service
  rationale: «À leur poste» conserve l’image hébraïque de la station debout tout en faisant comprendre la fonction cultuelle, sans préciser davantage que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La division en deux phrases allège une longue construction administrative sans perdre les rapports logiques. «La Loi» traduit ici la Torah dans son rôle prescriptif; «Juda» désigne collectivement la communauté judéenne, comme dans l’hébreu.
