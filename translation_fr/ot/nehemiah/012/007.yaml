  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: fr
  text: 'Sallou, Amok, Hilqiya et Yedaïa : tels étaient les chefs des prêtres[a] et de leurs frères[b] à l’époque de Yéchoua[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsables des prêtres ». L’hébreu dit littéralement « têtes des prêtres ».
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs proches » ou « les autres prêtres ». L’hébreu porte littéralement « leurs frères ».
    reason: lexical_alternative
  - marker: c
    text: Yéchoua est une forme postexilique du nom apparentée à « Josué ».
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ
  choice: Sallou
  rationale: Nom propre transcrit sous une forme naturelle en français, avec « ou » pour la voyelle finale.
- source_word: עָמוֹק
  choice: Amok
  rationale: Nom propre transcrit directement, conformément à l’usage français.
- source_word: חִלְקִיָּה
  choice: Hilqiya
  rationale: Transcription du nom hébreu qui en conserve les principales consonnes et la terminaison théophore, sans passer par sa forme anglaise.
- source_word: יְדַעְיָה
  choice: Yedaïa
  rationale: Transcription française du nom propre hébreu, plutôt qu’adaptation de la graphie anglaise.
- source_word: אֵלֶּה
  choice: tels
  rationale: Le démonstratif reprend naturellement en français les personnes qui viennent d’être nommées, sans ajouter un substantif absent de l’hébreu.
- source_word: רָאשֵׁי
  choice: les chefs de
  rationale: Le pluriel construit de « tête » désigne idiomatiquement des responsables. « Chefs » conserve l’idée de prééminence sans suggérer le titre institutionnel plus tardif de « grands prêtres ».
- source_word: הַכֹּהֲנִים
  choice: des prêtres
  rationale: Traduction directe du nom défini au pluriel dans la construction avec רָאשֵׁי.
- source_word: וַאֲחֵיהֶם
  choice: et de leurs frères
  rationale: Le mot hébreu signifie littéralement « leurs frères ». La préposition « de » est reprise en français pour rendre la relation avec « chefs » de manière claire, tout en conservant le terme familial et son possible sens corporatif.
- source_word: בִּימֵי
  choice: à l’époque de
  rationale: Rendu français actuel et naturel de l’expression temporelle hébraïque « aux jours de ».
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Transcription française de la forme postexilique du nom, distinguée de la forme plus longue habituellement rendue par « Josué ».
theological_decisions:
- issue: Portée de וַאֲחֵיהֶם dans le contexte sacerdotal
  choice: leurs frères
  alternative: leurs parents ; les autres prêtres
  rationale: Le texte emploie explicitement le masculin pluriel « frères ». Le contexte peut viser les membres apparentés ou associés des groupes sacerdotaux, mais la traduction conserve le terme concret sans trancher cette portée.
- issue: Valeur de רָאשֵׁי comme terme de direction
  choice: chefs des prêtres
  alternative: responsables des prêtres ; grands prêtres
  rationale: « Chefs » exprime une fonction dirigeante et préserve l’image hébraïque. « Grands prêtres » risquerait d’introduire un titre institutionnel qui n’est pas nécessairement visé ici.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « tels étaient » convient à une liste historique, tandis que « à l’époque de » évite l’archaïsme de « aux jours de ». Les noms sont transcrits directement depuis l’hébreu selon des conventions lisibles en français.
