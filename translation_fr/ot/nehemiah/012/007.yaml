  terminology: '« Chefs des prêtres » rend correctement le terme de direction sans importer le titre technique « grands prêtres ». Les transcriptions retenues sont cohérentes avec un choix de translittération directe. En revanche, « leurs parents » est un faux ami en français moderne : il désigne d’abord le père et la mère, non des parents au sens de membres de la parenté.'
