  source_fidelity: 'Le sens général est fidèle : les quatre noms sont suivis de l’identification de ces personnes comme chefs liés aux prêtres et à leurs frères, à l’époque de Yéchoua. « À l’époque de » rend naturellement l’expression temporelle בִּימֵי. La formulation française conserve, comme l’hébreu, une certaine latitude quant au rapport précis entre « chefs », « prêtres » et « leurs frères ».'
