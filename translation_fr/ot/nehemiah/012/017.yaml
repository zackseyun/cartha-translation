translation:
  language: fr
  text: pour Abiya, Zikri ; pour Miniamin, pour Moadia[a], Piltaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans certaines traditions textuelles apparentées, ce nom apparaît sous la forme Maadia, variante orthographique du même nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַ/אֲבִיָּה
  choice: pour Abiya
  rationale: Le préfixe ל marque ici le rattachement à une maison ou division sacerdotale. « pour Abiya » conserve la structure elliptique et concise de la liste hébraïque.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Nom propre transcrit sous une forme naturelle en français moderne.
- source_word: לְ/מִנְיָמִין
  choice: pour Miniamin
  rationale: Le préfixe ל indique le rattachement dans cette liste. La répétition de « pour » respecte la syntaxe exceptionnellement elliptique du texte massorétique, où aucun représentant n'est nommé après Miniamin.
- source_word: לְ/מוֹעַדְיָה
  choice: pour Moadia
  rationale: Le texte consonantique et la vocalisation massorétique donnent Moadia. Le nom est transcrit plutôt que traduit.
- source_word: פִּלְטָי
  choice: Piltaï
  rationale: Nom propre transcrit en français ; le tréma indique que les voyelles finales se prononcent séparément.
