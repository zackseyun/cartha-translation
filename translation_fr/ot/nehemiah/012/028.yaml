source:
  edition: WLC
  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: fr
  text: Les fils des chanteurs furent rassemblés, venant de la région qui entoure Jérusalem[a] et des localités des Netophatites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la plaine autour de Jérusalem ». Le mot hébreu peut désigner une plaine, une étendue circulaire ou une région, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « des villages des Netophatites ». Le mot hébreu désigne souvent de petites localités ou des villages non fortifiés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: furent rassemblés
  rationale: Le niphal de אסף peut avoir une valeur passive ou réfléchie. « Furent rassemblés » conserve la forme hébraïque sans décider s’ils se réunirent d’eux-mêmes ou furent convoqués.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: les fils des chanteurs
  rationale: La traduction garde la construction formelle « fils de », qui peut désigner ici les descendants ou les membres du groupe des chanteurs, sans substituer une interprétation institutionnelle au texte.
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le participe substantivé désigne précisément ceux qui chantent, et non les musiciens en général.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: la région qui entoure Jérusalem
  rationale: כִּכָּר peut désigner une plaine, une étendue circulaire ou une région. Avec « autour de Jérusalem », « la région qui entoure Jérusalem » exprime naturellement le sens géographique tout en laissant l’autre possibilité en note.
- source_word: חַצְרֵי
  choice: les localités
  rationale: Dans un contexte géographique, חָצֵר désigne souvent de petites agglomérations, notamment des villages non fortifiés. « Localités » convient sans préciser au-delà du texte.
- source_word: נְטֹפָתִי
  choice: des Netophatites
  rationale: La forme gentilice renvoie aux habitants associés à Netopha plutôt qu’au seul nom du lieu.
