base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: fr
  text: À l’époque d’Éliasib, de Joïada, de Yohanân et de Yaddoua, les lévites furent inscrits comme chefs de familles ancestrales[a], de même que les prêtres, sous le règne de Darius le Perse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « chefs de maisons paternelles », expression désignant des clans ou des lignées familiales.
    reason: cultural_note
  - marker: b
    text: Ou « durant le règne de Darius le Perse » ou « au temps du règne de Darius le Perse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation française courante et précise des membres du groupe lévitique.
- source_word: בִּימֵי
  choice: À l’époque de
  rationale: Rend naturellement l’expression temporelle hébraïque tout en gardant sa portée historique.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: Éliasib, Joïada, Yohanân et Yaddoua
  rationale: Translittérations françaises reconnaissables; Yohanân correspond bien au texte hébreu יוֹחָנָן, et non à Jonathan.
- source_word: כְּתוּבִים
  choice: furent inscrits
  rationale: Le participe passif de כתב évoque ici l’inscription dans un document ou registre administratif et généalogique.
- source_word: רָאשֵׁי אָבוֹת
  choice: comme chefs de familles ancestrales
  rationale: Rend l’expression socio-généalogique hébraïque de façon compréhensible en français moderne sans la réduire à de simples chefs de famille nucléaire.
- source_word: וְהַכֹּהֲנִים
  choice: de même que les prêtres
  rationale: Restitue naturellement l’ellipse hébraïque en indiquant que les prêtres furent eux aussi inscrits.
- source_word: עַל מַלְכוּת
  choice: jusqu’au règne de
  rationale: Dans ce contexte de listes et de chronologie, la préposition עַל peut marquer la limite atteinte; cette lecture correspond au lien contextuel avec le verset suivant, tout en laissant l’autre possibilité en note.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: Darius le Perse
  rationale: Forme française naturelle de l’apposition ethnique hébraïque.
