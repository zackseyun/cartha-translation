- from: Les deux groupes d’action de grâce[a] prirent place dans la maison de Dieu. Moi aussi, je pris place avec la moitié des responsables.
  to: Les deux groupes d’action de grâce[a] prirent position dans la maison de Dieu, ainsi que moi et la moitié des responsables qui m’accompagnaient.
  rationale: La révision maintient le groupe d’action de grâce comme référent contextuel de l’expression littérale, rend עמד par une expression cérémonielle non ambiguë, et coordonne explicitement Néhémie avec la moitié des responsables qui étaient avec lui. Elle ne tranche pas davantage qu’il ne faut sur la nature exacte des deux groupes.
