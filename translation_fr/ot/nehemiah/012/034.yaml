lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Dans cette liste de participants, le mot désigne le nom personnel ou tribal, et non la région géographique. « Juda » est la forme française biblique usuelle.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Nom propre figurant dans une liste coordonnée; la forme française traditionnelle et actuelle est conservée.
- source_word: שְׁמַעְיָה
  choice: Shemaïa
  rationale: Nom propre transcrit sous une forme française lisible, avec le tréma signalant la séparation des voyelles.
- source_word: יִרְמְיָה
  choice: Jérémie
  rationale: La forme française biblique usuelle assure clarté et reconnaissance du nom.
- source_word: וְ / וּ
  choice: et
  rationale: Les conjonctions répétées relient les noms. En français naturel, des virgules suivies d’un dernier « et » rendent fidèlement cette coordination sans lourdeur.
