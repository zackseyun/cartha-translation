- source_word: ל/מלוכי
  choice: pour Mallouki
  rationale: Dans la structure de cette liste sacerdotale, le préfixe ל indique vraisemblablement la maison ou le groupe que représente la personne ensuite nommée. « Pour Mallouki » restitue cette relation sans l'expliciter davantage. La graphie « Mallouki » suit une translittération française naturelle de la forme massorétique.
- source_word: יונתן
  choice: Jonathan
  rationale: Forme française traditionnelle et aisément reconnaissable du nom hébreu יוֹנָתָן.
- source_word: ל/שבניה
  choice: pour Shebania
  rationale: Comme dans le premier membre, le préfixe ל est rendu par « pour » afin de conserver le parallélisme et la fonction représentative probable de la liste.
- source_word: יוסף
  choice: Joseph
  rationale: Forme française traditionnelle du nom hébreu יוֹסֵף.
