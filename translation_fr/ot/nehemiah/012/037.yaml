  text: וְ/עַל֩ שַׁ֨עַר הָ/עַ֜יִן וְ/נֶגְדָּ֗/ם עָלוּ֙ עַֽל מַעֲלוֹת֙ עִ֣יר דָּוִ֔יד בַּֽ/מַּעֲלֶ֖ה לַ/חוֹמָ֑ה מֵ/עַל֙ לְ/בֵ֣ית דָּוִ֔יד וְ/עַ֛ד שַׁ֥עַר הַ/מַּ֖יִם מִזְרָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: fr
  text: À la porte de la Source[a], devant eux, ils montèrent par les marches[b] de la ville de David, à la montée de la muraille, au-dessus de la maison de David, jusqu’à la porte des Eaux, à l’est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porte de la Fontaine ». Le mot hébreu peut désigner une source naturelle ou une fontaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « les degrés » ou « les montées ». Le terme hébreu peut désigner des marches aménagées ou, plus largement, des voies montantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: la porte de la Source
  rationale: עַיִן peut désigner une source ou une fontaine. « Porte de la Source » forme un nom de lieu naturel en français et convient au contexte topographique.
- source_word: וְנֶגְדָּם
  choice: devant eux
  rationale: 'נֶגֶד exprime ici une position relative : devant, en face de. « Devant eux » reste clair tout en conservant le référent pluriel du texte hébreu.'
- source_word: עָלוּ
  choice: ils montèrent
  rationale: Le qal de עלה signifie couramment monter. Le passé simple convient au récit suivi et restitue directement le mouvement ascendant.
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: les marches de la ville de David
  rationale: Le pluriel מַעֲלוֹת peut désigner des marches, des degrés ou des montées. Dans ce cadre urbain, « marches » évoque naturellement un aménagement construit.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: à la montée de la muraille
  rationale: Cette formulation conserve la valeur topographique de מַעֲלֶה et le rapport étroit avec la muraille sans préciser abusivement s’il s’agit d’une montée vers elle ou le long d’elle.
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: au-dessus de la maison de David
  rationale: מֵעַל situe l’itinéraire à une altitude supérieure par rapport à la maison de David; « au-dessus de » préserve cette relation spatiale.
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: la porte des Eaux, à l’est
  rationale: מִזְרָח indique l’est ou la direction orientale. La formulation française situe naturellement la porte sans éliminer la nuance directionnelle.
- source_word: וְעַל
  choice: Près de
  rationale: Dans cette description d’itinéraire, עַל peut avoir une valeur locative auprès d’un point de repère. « Près de » est idiomatique en français et évite le sens matériel de « sur ».
