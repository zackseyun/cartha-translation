  text: וְ/יוֹיָדָע֙ הוֹלִ֣יד אֶת יוֹנָתָ֔ן וְ/יוֹנָתָ֖ן הוֹלִ֥יד אֶת יַדּֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/011.yaml
  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: fr
  text: Et Yoyada engendra Yonatan[a], et Yonatan engendra Yaddoua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits et certaines traductions ont « Yohanan » au lieu de « Yonatan ». Le texte hébreu suivi ici porte « Yonatan ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: '[non rendu]'
  rationale: Dans cette brève suite généalogique, le premier waw relie le verset au précédent. En français, commencer directement par le nom est plus naturel sans perdre le lien contextuel.
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Translittération française proche de la forme hébraïque du nom propre, distincte de la forme plus développée Yehoyada.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד indique qu’un homme a eu pour descendant direct celui qui est nommé. « Engendra » est concis, exact et demeure intelligible dans un registre biblique digne.
- source_word: אֶת
  choice: '[non rendu]'
  rationale: Marqueur hébreu de l’objet direct, représenté en français par la construction syntaxique.
- source_word: יוֹנָתָן
  choice: Yonatan
  rationale: Le texte massorétique fourni porte clairement יוֹנָתָן, « Yonatan ». La variante « Yohanan » est signalée en note plutôt qu’introduite dans le texte principal.
- source_word: וְ
  choice: et
  rationale: La seconde conjonction coordonne simplement les deux notices généalogiques.
- source_word: יַדּוּעַ
  choice: Yaddoua
  rationale: Translittération française du nom hébreu, avec « ou » pour la voyelle /u/ et doublement du d pour refléter le daguesh.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et digne, adapté au style généalogique. Les noms sont translittérés directement depuis l’hébreu; « engendra » conserve la précision de la filiation masculine sans alourdir la phrase.
