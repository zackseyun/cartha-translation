  text: אֵ֕לֶּה בִּ/ימֵ֛י יוֹיָקִ֥ים בֶּן יֵשׁ֖וּעַ בֶּן יוֹצָדָ֑ק וּ/בִ/ימֵי֙ נְחֶמְיָ֣ה הַ/פֶּחָ֔ה וְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סּוֹפֵֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: fr
  text: Ceux-ci étaient du temps de Joïakim, fils de Josué, fils de Yotsadak, et du temps de Néhémie, le gouverneur, et d’Esdras, le prêtre, le scribe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ce sont eux qui étaient en fonction
  rationale: Le démonstratif pluriel renvoie aux personnes énumérées précédemment. L’hébreu est sans verbe; « étaient en fonction » explicite naturellement en français leur présence dans les fonctions mentionnées par le contexte, sans les réduire à une simple existence.
- source_word: בִּימֵי
  choice: au temps de
  rationale: Rend l’idiome chronologique hébreu de manière naturelle et digne en français moderne.
- source_word: יוֹיָקִים
  choice: Joyakim
  rationale: Translittération française usuelle de ce nom, permettant de distinguer ce prêtre du roi généralement appelé Joïakim.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: fils de Josué, fils de Yotsadak
  rationale: Conserve la relation généalogique exprimée deux fois par בֶּן et emploie des formes françaises reconnaissables des noms.
- source_word: וּבִימֵי
  choice: ainsi qu’au temps de
  rationale: Conserve la seconde indication chronologique tout en évitant une coordination française pesante.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: Néhémie, le gouverneur
  rationale: פֶּחָה désigne le gouverneur d’une province sous administration impériale; « gouverneur » est clair et historiquement approprié.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: et d’Esdras, le prêtre, le scribe
  rationale: Les deux groupes nominaux hébreux sont conservés comme titres apposés à Esdras, sans fusionner les fonctions ni suggérer deux personnes.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et historique. Les titres administratifs et religieux restent distincts. La syntaxe explicite le caractère rétrospectif de la liste tout en conservant les deux repères chronologiques.
