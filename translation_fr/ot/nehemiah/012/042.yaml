  yaml_path: translation/ot/nehemiah/012/042.yaml
  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: fr
  text: ainsi que Maaséya, Shemaya, Éléazar, Ouzzi, Yehohanân, Malkiya, Élam et Ézer. Les chanteurs se firent entendre[a], avec Yizrahya, le responsable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « chantèrent à pleine voix ». Le verbe hébreu est causatif : littéralement, ils « firent entendre ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « le superviseur » ou « le préposé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: Maaséya
  rationale: Transcription française lisible du nom propre hébreu.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Transcription française lisible du nom propre, sans traduire son sens.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Forme française traditionnelle et immédiatement reconnaissable.
- source_word: עֻזִּי
  choice: Ouzzi
  rationale: Transcription adaptée aux conventions phonétiques du français.
- source_word: יְהוֹחָנָן
  choice: Yehohanân
  rationale: Conserve la forme longue du nom présente dans le texte hébreu, plutôt que de l'assimiler à la forme plus courte Yohanân.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Transcription française claire du nom propre hébreu.
- source_word: עֵילָם
  choice: Élam
  rationale: Le terme désigne ici une personne; il est donc transcrit comme nom propre.
- source_word: עָזֶר
  choice: Ézer
  rationale: Transcription française claire du nom propre.
- source_word: וַיַּשְׁמִיעוּ
  choice: se firent entendre
  rationale: Rend naturellement en français la valeur causative du hifil de שמע dans le contexte des chanteurs, sans ajouter explicitement un complément absent de l'hébreu.
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Désignation directe et naturelle de ceux qui chantent dans le cadre de la cérémonie.
- source_word: יִזְרַחְיָה
  choice: Yizrahya
  rationale: Transcription française du nom propre hébreu.
- source_word: הַפָּקִיד
  choice: le responsable
  rationale: Exprime la fonction de la personne préposée ou chargée de superviser, sans préciser un rang que le texte ne donne pas.
