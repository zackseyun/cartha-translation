  rationale: Le nom propre est rendu par sa forme française biblique usuelle, « Esdras ».
- source_word: וּ/מְשֻׁלָּם
  choice: et Meshoullam
  rationale: La conjonction וּ introduit le dernier élément de la liste et se rend naturellement par « et ». Le nom propre est translittéré « Meshoullam » pour représenter la consonne hébraïque שׁ et la voyelle u.
