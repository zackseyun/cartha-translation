  text: וּ/בִ/ימֵי֙ יֽוֹיָקִ֔ים הָי֥וּ כֹהֲנִ֖ים רָאשֵׁ֣י הָ/אָב֑וֹת לִ/שְׂרָיָ֣ה מְרָיָ֔ה לְ/יִרְמְיָ֖ה חֲנַנְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: fr
  text: 'À l’époque de Yoyaqim, parmi les prêtres, les chefs des maisons paternelles étaient : pour Seraya, Meraya ; pour Jérémie, Hanania.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִימֵי יוֹיָקִים
  choice: À l’époque de Yoyaqim
  rationale: Rend naturellement l’expression temporelle hébraïque « aux jours de », sans perdre sa portée historique.
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  choice: les prêtres chefs de familles
  rationale: Dans ce contexte généalogique, אָבוֹת désigne les familles ou lignées ancestrales; la formulation française indique que les hommes nommés sont les chefs sacerdotaux de ces familles.
- source_word: לִשְׂרָיָה ... לְיִרְמְיָה
  choice: pour Seraya… pour Jérémie
  rationale: Conserve la structure elliptique marquée par לְ, qui associe chaque chef à la famille sacerdotale correspondante sans préciser davantage la relation.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et adapté à une liste généalogique. Les noms sont translittérés de façon lisible; « Jérémie » suit la forme française traditionnelle. L’ellipse de l’hébreu est conservée après les deux occurrences de « pour ».
