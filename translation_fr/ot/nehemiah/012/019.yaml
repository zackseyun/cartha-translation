lexical_decisions:
- source_word: וּ/לְ/יוֹיָרִיב
  choice: pour Joyarib
  rationale: Le préfixe וּ (« et ») suivi de לְ (« pour, de ») poursuit l’énumération. En français, la conjonction peut rester implicite dans cette liste, tandis que « pour » exprime l’association avec la maison sacerdotale concernée.
- source_word: מַתְּנַי
  choice: Mattenaï
  rationale: Nom propre transcrit selon une forme française qui reflète l’hébreu.
- source_word: לִֽ/ידַֽעְיָה
  choice: pour Yedaeya
  rationale: La préposition לְ marque ici l’association dans la liste des représentants des familles sacerdotales ; « pour » restitue cette relation avec concision.
- source_word: עֻזִּי
  choice: Ouzzi
  rationale: Nom propre transcrit selon l’usage phonétique français.
