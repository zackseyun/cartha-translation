lexical_decisions:
- source_word: לְ/חִלְקִיָּה
  choice: pour Hilqiya
  rationale: 'Dans cette liste sacerdotale, la préposition ל indique vraisemblablement l’association ou la représentation : Hashabia est nommé comme représentant de la maison d’Hilqiya. « Pour » conserve la formulation elliptique du registre, tandis que le nom propre est translittéré selon un usage français clair.'
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Nom propre translittéré plutôt que traduit ; « Hashabia » est une forme française lisible qui rend les principales consonnes hébraïques.
- source_word: לִֽ/ידַֽעְיָה
  choice: pour Yedaeya
  rationale: Comme dans le premier membre, ל marque ici l’association ou la représentation au sein de la liste. « Pour Yedaeya » garde le parallélisme et le caractère elliptique de l’hébreu.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Nom propre translittéré sous une forme naturelle en français et proche de l’hébreu.
