base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: fr
  text: Le second groupe d’actions de grâce[a] allait vers la gauche. Je marchais derrière lui, avec la moitié du peuple, sur la muraille, depuis le haut de la tour des Fours jusqu’à la Muraille large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le second chœur d’actions de grâce » ou « le second cortège d’actions de grâce ». Le terme hébreu peut désigner un groupe participant à une procession cérémonielle, et non uniquement un chœur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: groupe d’actions de grâce
  rationale: Dans le contexte de la dédicace, le terme désigne un groupe organisé qui exprime la reconnaissance au cours d’une procession, et non la seule notion abstraite d’action de grâce. « Groupe » préserve l’ouverture quant à sa fonction exacte.
- source_word: הַשֵּׁנִית
  choice: second
  rationale: Ordinal féminin se rapportant au groupe désigné par הַתּוֹדָה.
- source_word: הַהוֹלֶכֶת
  choice: allait
  rationale: L’imparfait français rend naturellement le mouvement en cours exprimé par le participe hébreu.
- source_word: לְמוֹאל
  choice: vers la gauche
  rationale: Le terme indique le côté ou la direction de gauche, ici dans le cadre des deux cortèges avançant en sens opposés.
- source_word: אַחֲרֶיהָ
  choice: derrière lui
  rationale: L’expression décrit la position de Néhémie dans le cortège. Le pronom masculin français reprend « groupe », bien que le suffixe hébreu soit féminin en accord avec הַתּוֹדָה.
- source_word: חֲצִי הָעָם
  choice: la moitié du peuple
  rationale: Rendu direct du syntagme construit, désignant l’une des deux parties du peuple assemblé.
- source_word: מֵעַל לְהַחוֹמָה
  choice: sur la muraille
  rationale: Dans ce contexte, la procession avance sur le sommet de la muraille; « sur » exprime idiomatiquement cette localisation.
- source_word: מֵעַל לְמִגְדַּל הַתַּנּוּרִים
  choice: depuis un point situé au-dessus de la tour des Fours
  rationale: 'Le double emploi de מֵעַל est conservé autant que possible : le trajet sur la muraille est repéré à la hauteur ou au-dessus de cette tour.'
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: la tour des Fours
  rationale: Traduction transparente du nom topographique, avec « fours » au sens d’installations de cuisson.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: la Muraille large
  rationale: Le syntagme semble désigner une section connue de l’enceinte; la majuscule marque cette valeur toponymique tout en conservant le sens de l’adjectif.
theological_decisions: []
