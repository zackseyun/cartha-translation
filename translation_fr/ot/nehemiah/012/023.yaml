source:
  edition: WLC
  text: בְּנֵ֤י לֵוִי֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת כְּתוּבִ֕ים עַל סֵ֖פֶר דִּבְרֵ֣י הַ/יָּמִ֑ים וְ/עַד יְמֵ֖י יֽוֹחָנָ֥ן בֶּן אֶלְיָשִֽׁיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: fr
  text: Les fils de Lévi, chefs de familles, furent inscrits dans le livre des annales[a], jusqu’aux jours de Yohanan, fils d’Éliashib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « livre des annales » désigne ici un registre historique officiel, et pas nécessairement les livres bibliques des Chroniques.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: Les fils de Lévi
  rationale: Cette traduction conserve la forme hébraïque et sa structure, qui désigne ici plus précisément les chefs parmi les descendants de Lévi.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefs des familles ancestrales
  rationale: L’expression désigne les responsables de groupes familiaux fondés sur la filiation. Cette formulation est naturelle en français moderne sans réduire nécessairement ces groupes à des familles nucléaires.
- source_word: כְּתוּבִים
  choice: furent inscrits
  rationale: Le participe passif indique que leurs noms furent consignés par écrit dans un registre.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dans le livre des annales
  rationale: Dans ce contexte administratif, עַל se rend naturellement par « dans », et דִּבְרֵי הַיָּמִים désigne des annales ou archives historiques.
- source_word: וְעַד יְמֵי
  choice: jusqu’à l’époque de
  rationale: Cette expression française naturelle marque la limite chronologique du registre tout en rendant l’hébreu « jusqu’aux jours de ».
- source_word: יוֹחָנָן
  choice: Yohanan
  rationale: La translittération reflète directement la forme hébraïque du nom et convient aux usages du français international.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: fils d’Éliashib
  rationale: Traduction directe et naturelle de la construction patronymique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Familles ancestrales » explicite l’idée de lignées familiales sans employer l’expression vieillie « maisons paternelles ». Les noms propres suivent une translittération proche de l’hébreu.
