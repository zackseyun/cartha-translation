base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/010.yaml
  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: fr
  text: Yéchoua fut le père[a] de Joïakim, Joïakim fut le père d’Éliashib, et Éliashib fut le père de Joïada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formule généalogique hébraïque signifie littéralement : « Yéchoua fit naître Joïakim… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Translittération française moderne du nom hébreu, qui distingue ce personnage de Josué, fils de Noun, tout en reflétant la forme postexilique du texte.
- source_word: הוֹלִיד
  choice: fut le père de
  rationale: Dans cette formule généalogique, le hiphil de ילד signifie littéralement « fit naître » et, idiomatiquement, indique la paternité. « Fut le père de » est naturel en français moderne et moins archaïque que « engendra ».
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marque de l’objet direct sans équivalent lexical autonome en français; sa fonction est exprimée par la syntaxe.
- source_word: יוֹיָקִים
  choice: Yoyaqim
  rationale: Translittération cohérente de la forme hébraïque présente dans ce verset; elle évite de confondre ce prêtre avec d’autres personnages traditionnellement appelés Joïakim.
- source_word: אֶלְיָשִׁיב
  choice: Éliashib
  rationale: Translittération française claire et proche de la forme hébraïque.
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Translittération de la forme hébraïque du texte, cohérente avec Yoyaqim.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La répétition de « fut le père de » conserve la structure généalogique et le rythme du texte hébreu; les noms sont translittérés de manière cohérente plutôt que remplacés par des formes françaises traditionnelles susceptibles de créer des confusions.
