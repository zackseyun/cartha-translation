lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: Bakboukia
  rationale: Nom propre transcrit sous une forme naturelle en français; la conjonction initiale est intégrée par « et » entre les deux noms.
- source_word: וְעֻנּוֹ
  choice: Ounno
  rationale: Le terme est compris comme un nom propre, conformément à la structure immédiate de cette liste de lévites. La graphie « Ou- » rend naturellement en français la voyelle hébraïque.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Traduction directe du terme de parenté, qui peut ici désigner des membres du même groupe familial ou lévitique sans effacer l’image hébraïque.
- source_word: לְנֶגְדָּם
  choice: se tenaient en face d’eux
  rationale: La préposition exprime une position vis-à-vis ou en correspondance avec les autres groupes; « se tenaient » est suppléé pour produire une phrase française naturelle dans ce contexte d’organisation du service.
- source_word: לְמִשְׁמָרוֹת
  choice: selon leurs groupes de service
  rationale: Le pluriel désigne ici vraisemblablement des équipes, tours ou charges organisés pour le service du temple. Cette formulation transmet l’organisation collective sans réduire le sens à une simple garde.
