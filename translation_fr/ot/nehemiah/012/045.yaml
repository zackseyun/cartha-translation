  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: fr
  text: Ils s’acquittèrent du service de leur Dieu et du service de la purification[a] ; les chanteurs et les portiers firent de même[b], conformément à l’ordre de David et de son fils Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du service de la pureté » ou « du service du nettoyage rituel ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu formule de manière elliptique la mention des chanteurs et des portiers ; il signifie probablement qu’eux aussi s’acquittaient des fonctions qui leur étaient assignées.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: ils s’acquittèrent du service
  rationale: L’association de שׁמר et מִשְׁמֶרֶת désigne ici l’accomplissement fidèle d’une responsabilité assignée. Cette formulation idiomatique garde l’idée d’une charge cultuelle sans le calque peu naturel « garder la garde ».
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le suffixe possessif hébreu est explicite et doit être conservé.
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: et du service de la purification
  rationale: הַטָּהֳרָה renvoie, dans le contexte du temple, à la purification ou à l’état de pureté rituelle. « Purification » rend clairement cette dimension cultuelle, tandis que la note préserve les autres nuances possibles.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: les chanteurs et les portiers firent de même
  rationale: La proposition hébraïque est elliptique. La reprise verbale rend en français la lecture contextuelle la plus probable, selon laquelle ces deux groupes accomplissaient eux aussi leurs fonctions, tout en signalant l’ellipse en note.
- source_word: שֹׁעֲרִים
  choice: portiers
  rationale: Dans le cadre du temple, le terme désigne les responsables affectés aux portes. « Portiers » est précis, courant et traditionnel sans être archaïque.
- source_word: כְּמִצְוַת
  choice: conformément à l’ordre
  rationale: מִצְוָה désigne ici une directive faisant autorité concernant le service du temple. « Ordre » conserve le singulier et le caractère prescriptif du terme.
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: de David et de son fils Salomon
  rationale: Cette tournure française identifie sans ambiguïté Salomon comme fils de David tout en conservant les deux auteurs associés à l’ordre.
theological_decisions:
- issue: Sens de הַטָּהֳרָה dans le contexte du service du temple
  choice: purification
  alternative: pureté ; nettoyage
  rationale: Le contexte est cultuel et concerne des fonctions liées au temple. « Purification » exprime cette dimension rituelle sans la transformer en notion exclusivement morale ni lui imposer une doctrine ultérieure.
- issue: Rôle syntaxique des chanteurs et des portiers
  choice: ils accomplissent eux aussi les fonctions mentionnées
  alternative: les chanteurs et les portiers pourraient être simplement coordonnés dans une construction nominale laissée implicite
  rationale: L’hébreu est elliptique et ne répète pas le verbe. Le contexte favorise une extension de l’action à ces groupes ; la traduction l’explicite pour être intelligible, et la note conserve l’information sur l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, digne et accessible. « S’acquitter du service » restitue l’idiome hébreu sans lourdeur, et le point-virgule clarifie l’extension elliptique de l’action aux chanteurs et aux portiers.
