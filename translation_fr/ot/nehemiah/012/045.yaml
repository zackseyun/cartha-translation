  source_fidelity: 'Le texte rend fidèlement l’idiome וַיִּשְׁמְרוּ מִשְׁמֶרֶת par « s’acquittèrent du service » et conserve la double responsabilité : celle « de leur Dieu » et celle « de la purification ». « Purification » convient au sens cultuel de הַטָּהֳרָה. La reprise explicite « les chanteurs et les portiers firent de même » est une résolution raisonnable et lisible de l’ellipse hébraïque, signalée en note. L’ordre est correctement attribué à David et à Salomon, son fils.'
