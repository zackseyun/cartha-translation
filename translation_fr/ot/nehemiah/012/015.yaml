lexical_decisions:
- source_word: לְ/חָרִם
  choice: pour Harim
  rationale: Dans cette liste sacerdotale, le préfixe לְ marque le rapport entre une maison ou division sacerdotale et son représentant. « Pour Harim » conserve la formule concise de l’hébreu.
- source_word: עַדְנָא
  choice: Adna
  rationale: Translittération française simple du nom propre hébreu.
- source_word: לִ/מְרָיוֹת
  choice: pour Merayoth
  rationale: Le préfixe לִ remplit ici la même fonction associative que dans le membre précédent. La graphie « Merayoth » rend le nom propre de façon lisible en français.
- source_word: חֶלְקָי
  choice: Helkaï
  rationale: Translittération française du nom propre, avec tréma pour signaler que les deux voyelles se prononcent séparément.
