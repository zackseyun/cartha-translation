  text: וָ/אַעֲלֶה֙ אֶת שָׂרֵ֣י יְהוּדָ֔ה מֵ/עַ֖ל לַ/חוֹמָ֑ה וָ/אַעֲמִ֡ידָ/ה שְׁתֵּ֣י תוֹדֹת֩ גְּדוֹלֹ֨ת וְ/תַהֲלֻכֹ֤ת לַ/יָּמִין֙ מֵ/עַ֣ל לַ/חוֹמָ֔ה לְ/שַׁ֖עַר הָ/אַשְׁפֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: fr
  text: Puis je fis monter les chefs de Juda sur la muraille et j’y plaçai deux grands chœurs d’action de grâce[a], qui se mirent en marche vers la droite sur la muraille, en direction de la porte du Fumier[b]. L’un d’eux y alla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « deux grandes actions de grâce ». Dans ce contexte, cette expression désigne probablement des groupes organisés, ou des chœurs, qui rendent grâce. Le terme suivant peut désigner leur marche en procession.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jusqu’à la porte du Fumier ». La préposition hébraïque peut indiquer ici soit la direction, soit la destination.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: je fis monter
  rationale: Le hiphil de עלה exprime ici la causation (« faire monter »). Cette formulation française conserve directement cette valeur.
- source_word: שָׂרֵי יְהוּדָה
  choice: les chefs de Juda
  rationale: שָׂרִים désigne des dirigeants ou responsables; « chefs » est moderne et n’implique pas qu’il s’agisse de fils de roi.
- source_word: מֵעַל לַחוֹמָה
  choice: sur la muraille
  rationale: Dans ce contexte, l’expression indique la montée jusqu’au sommet praticable de la muraille, où se déroule la procession.
- source_word: וָאַעֲמִידָה
  choice: j’y plaçai
  rationale: Le hiphil de עמד signifie « faire tenir, mettre en place ». « Placer » convient à l’organisation cérémonielle sans imposer l’idée d’une nomination officielle.
- source_word: שְׁתֵּי תוֹדֹת גְּדוֹלֹת
  choice: deux grands chœurs d’actions de grâce
  rationale: Littéralement « deux grandes actions de grâce »; dans la scène de dédicace, תוֹדוֹת désigne vraisemblablement, par métonymie, des groupes organisés célébrant Dieu par des actions de grâce.
- source_word: וְתַהֲלֻכֹת
  choice: et leurs cortèges
  rationale: Le nom dérivé de הלך évoque la marche ou le défilé. Le possessif rend naturellement en français le lien contextuel entre les groupes d’actions de grâce et les processions, sans en faire nécessairement quatre groupes distincts.
- source_word: לַיָּמִין
  choice: vers la droite
  rationale: Traduction littérale qui évite de convertir implicitement la direction en « vers le sud ».
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: en direction de la porte du Fumier
  rationale: אַשְׁפֹּת désigne le fumier ou les détritus. « En direction de » exprime la valeur directionnelle de ל sans affirmer que la porte était nécessairement le point d’arrivée.
