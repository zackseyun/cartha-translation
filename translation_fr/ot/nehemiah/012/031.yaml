translation_notes:
  register: Français international moderne, soutenu mais accessible. « Muraille », « actions de grâce » et « porte du Fumier » maintiennent le registre historique et liturgique. La syntaxe est divisée en deux phrases pour éviter que « l’un » ne soit maladroitement rattaché à « cortèges » et pour rendre clairement le mouvement du premier groupe.
