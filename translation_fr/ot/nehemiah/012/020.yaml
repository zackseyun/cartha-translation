translation_notes:
  register: Style nominal et concis, conforme à une liste. Les noms sont translittérés selon les usages du français moderne. Une seule note est retenue pour expliquer la préposition hébraïque répétée ; aucune note n’est nécessaire sur Éber, puisque la variante anglaise « Heber » relève de la tradition orthographique anglaise plutôt que d’une variante du texte source.
