lexical_decisions:
- source_word: לְ/סַלַּי
  choice: pour Sallaï
  rationale: Dans cette liste sacerdotale, la préposition לְ marque l’association avec une maison sacerdotale ou sert d’en-tête. « pour » restitue naturellement cette fonction en français, tandis que le nom est translittéré Sallaï.
- source_word: קַלָּי
  choice: Kallaï
  rationale: Translittération du nom propre hébreu, avec redoublement de la consonne et tréma pour indiquer que le i se prononce séparément.
- source_word: לְ/עָמוֹק
  choice: pour Amok
  rationale: Comme dans le premier groupe, לְ introduit ici la maison sacerdotale à laquelle la personne nommée est associée ; « pour » convient au style concis de la liste.
- source_word: עֵבֶר
  choice: Éber
  rationale: Translittération française usuelle qui reflète les consonnes hébraïques ע־ב־ר ; la graphie traditionnelle « Héber » est moins directement représentative de l’hébreu.
