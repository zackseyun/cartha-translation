lexical_decisions:
- source_word: ל/עדיא
  choice: pour Iddo
  rationale: 'Dans cette liste sacerdotale, le préfixe ל indique l’association ou la représentation : Zacharie représente la maison sacerdotale d’Iddo. La forme עדיא est ici comprise, d’après le contexte de la liste (voir Néhémie 12.4), comme une variante du nom Iddo.'
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française biblique courante de ce nom propre ; il désigne ici le représentant associé à Iddo.
- source_word: לְ/גִנְּתוֹן
  choice: pour Guinnethon
  rationale: Comme dans le premier membre du verset, le préfixe ל marque ici la maison sacerdotale représentée par la personne nommée ensuite. « Guinnethon » est une translittération française naturelle du nom propre.
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: Translittération française usuelle du nom propre ; Meshoullam est le représentant associé à Guinnethon.
