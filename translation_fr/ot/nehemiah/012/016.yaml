    text: 'Dans cette liste, l’hébreu place la préposition ל (« à », « pour » ou « de ») devant les noms des maisons sacerdotales. Elle est rendue ici par « pour » afin d’exprimer la représentation : Zacharie représentait celle d’Iddo, et Meshoullam celle de Guinnethon.'
