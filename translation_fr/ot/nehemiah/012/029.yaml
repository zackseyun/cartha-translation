  text: וּ/מִ/בֵּית֙ הַגִּלְגָּ֔ל וּ/מִ/שְּׂד֥וֹת גֶּ֖בַע וְ/עַזְמָ֑וֶת כִּ֣י חֲצֵרִ֗ים בָּנ֤וּ לָ/הֶם֙ הַ/מְשֹׁ֣רֲרִ֔ים סְבִיב֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: fr
  text: Et de Beth-Guilgal, des champs de Guéba et d’Azmaveth, car les chanteurs s’étaient bâti des villages[a] autour de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « établissements » ; le terme hébreu peut désigner des lieux habités délimités et renvoie ici à de petites implantations où les chanteurs vivaient autour de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: ainsi que de Beth-Guilgal
  rationale: Le nom est compris comme un toponyme formé avec Beth-, et non comme la désignation littérale d’une « maison ». « Ainsi que de » prolonge naturellement l’énumération commencée au verset précédent.
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: des champs de Guéba et d’Azmaveth
  rationale: שׂדות désigne directement les champs ou terres agricoles rattachés à ces localités. « Champs » conserve cette image concrète.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici une explication de la présence des chanteurs dans ces lieux.
- source_word: חֲצֵרִים
  choice: villages
  rationale: Dans ce contexte géographique, le terme désigne des lieux d’habitation ou petites agglomérations plutôt que des cours intérieures.
- source_word: בָּנוּ לָהֶם
  choice: s’étaient construit
  rationale: Le verbe signifie « bâtir ». Le plus-que-parfait français exprime naturellement la situation antérieure expliquant leur provenance, tandis que la tournure pronominale rend לָהֶם, « pour eux-mêmes ».
- source_word: הַמְשֹׁרֲרִים
  choice: les chanteurs
  rationale: Le participe issu de שׁיר désigne précisément ceux qui chantent, ici dans le cadre du service cultuel.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: autour de Jérusalem
  rationale: Cette formulation française courante préserve le sens spatial de la région entourant la ville.
