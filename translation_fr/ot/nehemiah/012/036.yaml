  text: וְֽ/אֶחָ֡י/ו שְֽׁמַעְיָ֡ה וַ/עֲזַרְאֵ֡ל מִֽלֲלַ֡י גִּֽלֲלַ֡י מָעַ֞י נְתַנְאֵ֤ל וִֽ/יהוּדָה֙ חֲנָ֔נִי בִּ/כְלֵי שִׁ֥יר דָּוִ֖יד אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/עֶזְרָ֥א הַ/סּוֹפֵ֖ר לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: fr
  text: 'ainsi que ses frères : Shemaya, Azarel, Milalaï, Guilalaï, Maaï, Netanel, Juda et Hanani, avec les instruments de musique[a] de David, l’homme de Dieu, et Esdras, le scribe, qui marchait devant eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les instruments de chant ».'
    reason: La note conserve la formulation concrète de l’hébreu tout en maintenant dans le texte principal l’expression française idiomatique « instruments de musique ».
lexical_decisions:
- source_word: וְאֶחָיו
  choice: ainsi que ses frères
  rationale: Le nom אֶחָיו signifie littéralement « ses frères ». Dans cette liste processionnelle, il peut désigner des membres du même groupe lévitique, mais le sens de base est conservé.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: Shemaya, Azarel, Milalaï, Guilalaï, Maaï, Netanel, Juda et Hanani
  rationale: Les noms propres sont translittérés sous des formes lisibles en français moderne, avec « Juda », forme française traditionnelle et immédiatement reconnaissable.
- source_word: בִּכְלֵי שִׁיר
  choice: avec les instruments de musique
  rationale: כְּלֵי désigne des objets ou instruments, et שִׁיר le chant ou la musique. « Instruments de musique » est l’expression française naturelle, tandis que la formulation plus littérale est signalée en note.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: de David, l’homme de Dieu
  rationale: Le complément rattache les instruments à David, ensuite désigné par le titre honorifique biblique « l’homme de Dieu ».
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: Esdras, le scribe
  rationale: « Esdras » est la forme française traditionnelle du nom, et « le scribe » rend directement son titre.
- source_word: לִפְנֵיהֶם
  choice: était devant eux
  rationale: La préposition indique qu’Esdras se trouvait en tête du groupe. Le verbe « était », implicite en hébreu, donne une phrase naturelle en français sans préciser davantage le mode de déplacement.
theological_decisions:
- issue: Rendu du titre אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  alternative: l’homme du vrai Dieu
  rationale: « L’homme de Dieu » conserve le titre honorifique biblique et ses résonances intertextuelles sans introduire une précision absente du texte hébreu.
translation_notes:
  register: Français moderne, clair et digne. Le début reste syntaxiquement lié au verset précédent, comme dans le texte hébreu. La seconde proposition explicite seulement la copule sous-entendue afin d’éviter un fragment artificiel en français.
