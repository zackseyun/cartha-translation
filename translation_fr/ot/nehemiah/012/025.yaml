  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: fr
  text: Mattania, Bakbukia, Obadia, Meshoullam, Talmôn et Akkoub étaient gardiens et portiers ; ils montaient la garde dans les réserves des portes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : dans les lieux de rassemblement près des portes. Le sens précis de l’expression hébraïque est incertain.'
    reason: L’hébreu אֲסֻפֵּי peut désigner des lieux où l’on rassemble ou entrepose quelque chose ; l’emplacement exact par rapport aux portes n’est pas explicitement précisé.
lexical_decisions:
- source_word: שֹׁמְרִים שׁוֹעֲרִים
  choice: gardiens et portiers
  rationale: Rend les deux désignations juxtaposées du texte hébreu sans les fondre en une seule fonction.
- source_word: מִשְׁמָר
  choice: ils montaient la garde
  rationale: Exprime naturellement en français l’idée de service de garde ou de veille.
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: dans les réserves des portes
  rationale: « Réserves » convient au sens de lieux où l’on rassemble ou entrepose des biens, tandis que « des portes » conserve la relation concise et quelque peu indéterminée de l’hébreu.
