id: NEH.12.24
reference: Nehemiah 12:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רָאשֵׁ֣י הַ֠/לְוִיִּם חֲשַׁבְיָ֨ה שֵֽׁרֵבְיָ֜ה וְ/יֵשׁ֤וּעַ בֶּן קַדְמִיאֵל֙ וַ/אֲחֵי/הֶ֣ם לְ/נֶגְדָּ֔/ם לְ/הַלֵּ֣ל לְ/הוֹד֔וֹת בְּ/מִצְוַ֖ת דָּוִ֣יד אִישׁ הָ/אֱלֹהִ֑ים מִשְׁמָ֖ר לְ/עֻמַּ֥ת מִשְׁמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: fr
  text: 'Les chefs des Lévites étaient Hashabia, Shérébia et Josué, fils de Kadmiel. Leurs frères se tenaient en face d’eux[a] pour louer et rendre grâce, conformément au commandement de David, l’homme de Dieu : un groupe de service en face d’un autre groupe de service[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur faisant face » ou « leur correspondant ». L’expression décrit vraisemblablement des groupes de Lévites disposés les uns vis-à-vis des autres pour le culte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une garde en vis-à-vis d’une garde ». Cette formule peut désigner des divisions de service correspondantes ou alternantes.'
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: les chefs des Lévites
  rationale: רָאשֵׁי désigne ici les personnes qui occupent une fonction dirigeante. « Chefs » rend naturellement cet emploi idiomatique tout en conservant la désignation cultuelle précise « Lévites ».
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: Hashabia, Shérébia et Josué, fils de Kadmiel
  rationale: Les noms suivent des formes françaises bibliques reconnaissables. « Fils de Kadmiel » conserve explicitement la relation donnée par בֶּן.
- source_word: וַאֲחֵיהֶם
  choice: leurs frères
  rationale: Le substantif masculin pluriel est rendu directement; il désigne les autres Lévites associés à ces responsables.
- source_word: לְנֶגְדָּם
  choice: en face d’eux
  rationale: L’expression marque une position vis-à-vis d’un autre groupe et peut aussi suggérer une correspondance fonctionnelle; la formulation française conserve cette ouverture.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: pour louer et rendre grâce
  rationale: Les deux infinitifs liturgiques restent distincts. « Rendre grâce » exprime naturellement הוֹדוֹת dans ce contexte sans ajouter de complément absent de l’hébreu.
- source_word: בְּמִצְוַת דָּוִיד
  choice: conformément au commandement de David
  rationale: La préposition בְּ indique ici la conformité à une directive faisant autorité.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Ce titre biblique traditionnel est conservé sans explication doctrinale supplémentaire.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: un groupe de service en face d’un autre groupe de service
  rationale: מִשְׁמָר peut désigner une garde, un service ou une division chargée du service. Dans ce cadre lévitique, « groupe de service » est compréhensible et suffisamment prudent; la répétition et la disposition réciproque de l’hébreu sont maintenues.
theological_decisions:
- issue: Valeur du terme masculin אֲחֵיהֶם
  choice: leurs frères
  alternative: leurs compagnons lévites
  rationale: L’hébreu emploie explicitement le terme masculin pluriel « frères » pour les Lévites associés. La traduction ne neutralise pas cette donnée.
- issue: Sens de la formule cultuelle elliptique מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: un groupe de service en face d’un autre groupe de service
  alternative: une division répondant à l’autre; une garde en vis-à-vis d’une garde
  rationale: Le passage présente une organisation réciproque des Lévites, mais ne précise pas expressément qu’il s’agit d’un chant antiphoné ou d’une alternance. La traduction conserve donc l’indétermination relative de la formule.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe nominale hébraïque est explicitée par « étaient » et « se tenaient » afin d’obtenir une phrase naturelle. Les termes cultuels restent sobres, et la formule finale demeure volontairement non spécifique quant au mode exact d’alternance.
