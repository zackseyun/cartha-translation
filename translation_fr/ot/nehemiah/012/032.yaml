  text: Hoshaiah and half of the officials of Judah went behind them[a].
translation:
  language: fr
  text: Hoshaïa et la moitié des chefs de Juda allèrent derrière eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après eux ». L’hébreu peut désigner le fait de suivre dans l’ordre de la procession ; « derrière eux » en explicite la disposition spatiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: marchaient
  rationale: Dans le cadre d’une procession, « marchaient » exprime naturellement le déplacement à pied. Le singulier hébreu précède un sujet composé, tandis que le français demande ici le pluriel.
- source_word: אַחֲרֵיהֶם
  choice: derrière eux
  rationale: La préposition indique une position ou un mouvement à la suite d’un groupe. « Derrière eux » rend clairement l’ordre spatial de la procession, sans exclure le sens plus général « après eux ».
- source_word: הוֹשַׁעְיָה
  choice: Hoshaya
  rationale: Le nom propre est translittéré sous une forme lisible en français, proche de l’hébreu.
- source_word: וַחֲצִי
  choice: et la moitié des
  rationale: חֲצִי signifie « moitié » et la conjonction coordonne Hoshaya avec une partie du groupe des responsables.
- source_word: שָׂרֵי
  choice: responsables
  rationale: שַׂר désigne ici des personnes exerçant une autorité civique. « Responsables » est naturel et n’évoque pas à tort des fils de roi, comme pourrait le faire « princes ».
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom géographique et tribal.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le verbe « marchaient » met en évidence le contexte processionnel, et « responsables » rend la fonction publique sans connotation dynastique.
