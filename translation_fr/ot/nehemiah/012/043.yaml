revisions:
- from: Ce jour-là, ils offrirent de grands sacrifices[a] et se réjouirent, car Dieu leur avait donné une grande joie[b]. Les femmes et les enfants[c] se réjouirent eux aussi, et la joie de Jérusalem s’entendit au loin[d].
  to: Ce jour-là, ils offrirent de grands sacrifices[a] et se réjouirent, car Dieu les avait comblés d’une grande joie[b]. Les femmes et les enfants[c] se réjouirent eux aussi, et la joie de Jérusalem s’entendit au loin[d].
  rationale: La révision remplace une expression qui présente surtout Dieu comme donateur de joie par une formulation qui maintient plus nettement sa causalité dans la réjouissance, conformément au piel hébreu et à son intensification. Les autres choix sont conservés. La note b est également corrigée sur le plan grammatical.
