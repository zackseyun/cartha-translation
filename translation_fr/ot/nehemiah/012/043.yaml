  text: וַ/יִּזְבְּח֣וּ בַ/יּוֹם הַ֠/הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַ/יִּשְׂמָ֗חוּ כִּ֤י הָ/אֱלֹהִים֙ שִׂמְּחָ/ם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְ/גַ֧ם הַ/נָּשִׁ֛ים וְ/הַ/יְלָדִ֖ים שָׂמֵ֑חוּ וַ/תִּשָּׁמַ֛ע שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵ/רָחֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: fr
  text: Ce jour-là, ils offrirent de grands sacrifices[a] et se réjouirent, car Dieu les avait comblés d’une grande joie[b]. Les femmes et les enfants[c] se réjouirent eux aussi, et la joie de Jérusalem s’entendit au loin[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils sacrifièrent de grands sacrifices ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Dieu les avait fait se réjouir d’une grande joie ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les épouses et les enfants » ; le mot hébreu peut désigner les femmes ou les épouses selon le contexte.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « la joie de Jérusalem fut entendue de loin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ זְבָחִים גְּדוֹלִים
  choice: ils offrirent de grands sacrifices
  rationale: Dans ce contexte cultuel, זבח désigne l’acte d’offrir des sacrifices. Cette formulation française est naturelle et évite la répétition peu idiomatique « sacrifier des sacrifices », tout en conservant גְּדוֹלִים par « grands ».
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: se réjouirent
  rationale: La répétition du même verbe français maintient la cohésion produite par les formes répétées de la racine שׂמח.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: leur avait donné une grande joie
  rationale: Cette tournure exprime naturellement en français que Dieu est la source et l’agent de leur joie. Une note conserve la formulation hébraïque plus littérale, où le verbe est causatif et suivi d’un nom de même racine.
- source_word: הַנָּשִׁים וְהַיְלָדִים
  choice: les femmes et les enfants
  rationale: נָשִׁים peut désigner les femmes ou les épouses. Sans possessif explicite, « les femmes » est le choix le plus large et préserve l’inclusion explicite de ce groupe avec les enfants.
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: la joie de Jérusalem s’entendit au loin
  rationale: « S’entendit au loin » rend naturellement le passif hébreu et l’idée d’une joie audible à grande distance, tandis que « la joie de Jérusalem » préserve le rapport génitif sans préciser davantage s’il s’agit de la ville ou de ses habitants.
theological_decisions:
- issue: L’action de Dieu dans la joie du peuple
  choice: Dieu est présenté comme celui qui leur donne la grande joie.
  alternative: Dieu les fit se réjouir d’une grande joie.
  rationale: Le piel שִׂמְּחָם attribue explicitement à Dieu l’action de susciter leur joie. La formulation retenue garde cette initiative divine dans un français naturel, tandis que la note fournit la construction causative plus littérale.
- issue: L’étendue de la communauté en fête
  choice: Les femmes et les enfants sont explicitement inclus dans la réjouissance.
  alternative: Les épouses et les enfants se réjouirent eux aussi.
  rationale: Le texte nomme directement ces groupes. « Femmes » conserve le sens le plus général de נָשִׁים, mais son autre sens contextuellement possible est signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit historique écrit. La répétition de « se réjouirent » maintient le motif lexical du texte, tandis que « eux aussi » rend naturellement la valeur additive de וְגַם.
