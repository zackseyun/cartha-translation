    issue: La traduction principale de שִׂמְּחָם par « leur avait donné une grande joie » ne rend pas pleinement la valeur causative du piel.
    rationale: Le texte hébreu dit littéralement que Dieu les a fait se réjouir d’une grande joie. « Les avait comblés d’une grande joie » conserve clairement l’initiative et l’action divine, sans imposer une interprétation doctrinale.
  - severity: low
    issue: 'Accord fautif dans la note b : « Dieu les avait fait se réjouir ».'
    rationale: Dans la construction « faire + infinitif », le participe passé « fait » est invariable.
