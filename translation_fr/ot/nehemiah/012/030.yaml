  text: וַ/יִּֽטַּהֲר֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם וַֽ/יְטַהֲרוּ֙ אֶת הָ/עָ֔ם וְ/אֶת הַ/שְּׁעָרִ֖ים וְ/אֶֽת הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: fr
  text: Les prêtres et les lévites se purifièrent[a], puis ils purifièrent le peuple, les portes et la muraille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se rendirent purs »; le même verbe hébreu est ensuite employé transitivement pour la purification du peuple, des portes et de la muraille.
    reason: Signaler la valeur réflexive de la première forme et la répétition intentionnelle de la même racine hébraïque.
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: se purifièrent
  rationale: Le hitpael exprime ici une action réflexive de purification rituelle. « Se purifièrent » est naturel, digne et maintient le lien lexical avec le verbe transitif qui suit.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis dans ce contexte cultuel.
- source_word: וְהַלְוִיִּם
  choice: et les lévites
  rationale: Désignation conventionnelle en français des membres du groupe lévitique attaché au service du temple.
- source_word: וַיְטַהֲרוּ
  choice: ils purifièrent
  rationale: Le piel est transitif ici. La répétition de « purifier » reproduit la même racine hébraïque employée d'abord réflexivement, puis transitivement.
- source_word: הָעָם
  choice: le peuple
  rationale: Sens ordinaire du terme dans ce contexte; « assemblée » serait plus restrictif sans nécessité.
- source_word: הַשְּׁעָרִים
  choice: les portes
  rationale: Rendu direct et idiomatique dans le contexte de l'enceinte de Jérusalem.
- source_word: הַחוֹמָה
  choice: la muraille
  rationale: Dans le contexte urbain de Jérusalem, « muraille » désigne plus naturellement qu'« un mur » l'ensemble de l'enceinte fortifiée, tout en conservant le singulier hébreu.
theological_decisions:
- issue: Nature de la purification
  choice: purification rituelle
  alternative: nettoyage général ou purification morale
  rationale: Dans le cadre de la dédicace et du service cultuel, טהר renvoie à une purification rituelle ou cérémonielle. « Purifier » conserve cette nuance sans préciser un rite que le verset ne décrit pas.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Puis » rend clairement la succession des deux actions suggérée par les formes narratives hébraïques. La répétition « se purifièrent / purifièrent » préserve le lien lexical du texte source.
