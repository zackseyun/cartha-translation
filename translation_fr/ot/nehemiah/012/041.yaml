source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֡ים אֶלְיָקִ֡ים מַעֲשֵׂיָ֡ה מִ֠נְיָמִין מִיכָיָ֧ה אֶלְיוֹעֵינַ֛י זְכַרְיָ֥ה חֲנַנְיָ֖ה בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/041.yaml
  text: 'and the priests: Eliakim[a], Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets.'
translation:
  language: fr
  text: et les prêtres Éliakim, Maaséya, Miniamin, Mikaya, Élyoénaï, Zacharie et Hanania, avec des trompettes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les trompettes ». L’hébreu peut indiquer que ces prêtres étaient accompagnés de trompettes, qu’ils en étaient munis ou qu’ils étaient affectés à leur usage.
    reason: La construction prépositionnelle est concise et ne précise pas exactement le rapport entre les prêtres et les trompettes.
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: et les prêtres
  rationale: La conjonction וְ relie cette liste à la procession décrite précédemment, et הַכֹּהֲנִים désigne normalement « les prêtres ».
- source_word: אֶלְיָקִים
  choice: Éliakim
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: מַעֲשֵׂיָה
  choice: Maaséya
  rationale: Transcription française moderne qui reflète la forme hébraïque du nom sans reprendre une graphie anglaise.
- source_word: מִנְיָמִין
  choice: Miniamin
  rationale: Cette forme suit directement la graphie consonantique du texte hébreu présent.
- source_word: מִיכָיָה
  choice: Mikaya
  rationale: Transcription transparente du nom hébreu, préférable ici à « Michée », qui pourrait l'assimiler à une autre forme française traditionnelle.
- source_word: אֶלְיוֹעֵינַי
  choice: Élyoénaï
  rationale: Transcription française lisible qui conserve les principaux éléments phonétiques du nom hébreu.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française biblique bien établie de ce nom propre.
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Forme française courante et proche de l'hébreu.
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: avec des trompettes
  rationale: La préposition בְּ peut exprimer ici l'accompagnement ou le moyen. « Avec des trompettes » reste naturel en français et évite de préciser au-delà du texte si les prêtres les portaient ou en jouaient.
