  text: וּ/מִ/בְּנֵ֥י הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְר֑וֹת זְכַרְיָ֨ה בֶן יֽוֹנָתָ֜ן בֶּן שְׁמַֽעְיָ֗ה בֶּן מַתַּנְיָה֙ בֶּן מִ֣יכָיָ֔ה בֶּן זַכּ֖וּר בֶּן אָסָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: fr
  text: 'et, parmi les fils des prêtres, avec des trompettes : Zacharie, fils de Jonathan, fils de Shemaïa, fils de Mattania, fils de Micaïa, fils de Zaccur, fils d’Asaph.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי הַ/כֹּהֲנִים
  choice: et, parmi les prêtres
  rationale: 'La préposition מִן exprime ici une relation partitive : les personnes nommées appartiennent au groupe des prêtres. En français actuel, « parmi les prêtres » rend naturellement cette valeur sans ajouter explicitement « quelques-uns ». Le terme « fils » n’est pas repris devant « prêtres », car « les fils des prêtres » pourrait suggérer à tort qu’ils ne sont pas eux-mêmes prêtres.'
- source_word: בַּ/חֲצֹצְרוֹת
  choice: avec des trompettes
  rationale: Le ב est instrumental ou associatif dans ce contexte processionnel. « Avec des trompettes » est naturel et ne suppose pas qu’un ensemble précis de trompettes ait déjà été identifié.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française biblique usuelle du nom.
- source_word: בֶן
  choice: fils de
  rationale: Le marqueur généalogique répété est conservé à chaque génération afin de respecter la structure de l’hébreu.
- source_word: יֽוֹנָתָן
  choice: Jonathan
  rationale: Forme française usuelle du nom.
- source_word: שְׁמַעְיָה
  choice: Shemaïa
  rationale: Transcription française claire et courante, avec tréma pour signaler les voyelles distinctes.
- source_word: מַתַּנְיָה
  choice: Mattania
  rationale: Forme française biblique usuelle.
- source_word: מִיכָיָה
  choice: Micaïa
  rationale: Transcription française traditionnelle qui distingue ce nom de Michée.
- source_word: זַכּוּר
  choice: Zaccur
  rationale: Transcription française biblique établie.
- source_word: אָסָף
  choice: Asaph
  rationale: Forme française biblique usuelle, sans ajout interprétatif sur l’identité ou le rôle de cet ancêtre.
theological_decisions:
- issue: Lien généalogique avec Asaph
  choice: Conserver toute la chaîne sous la forme répétée « fils de »
  alternative: Comprendre le dernier lien plus largement comme « descendant d’Asaph » ou comme appartenance à la lignée d’Asaph
  rationale: L’hébreu répète בֶן et présente formellement une généalogie. La traduction ne précise pas si chaque lien doit être compris comme une filiation immédiate ou si certains peuvent résumer une ascendance plus longue.
translation_notes:
  register: Français moderne, digne et lisible. Le verset étant syntaxiquement rattaché au contexte précédent, la minuscule initiale et l’ouverture par « et » sont conservées. La ponctuation met en relief Zacharie comme membre nommé du groupe muni de trompettes.
