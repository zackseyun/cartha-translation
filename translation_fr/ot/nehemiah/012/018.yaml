lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: pour Bilga
  rationale: Dans cette liste de responsables sacerdotaux, la préposition לְ marque l’association ou la représentation. « Pour » rend naturellement cette fonction en français. Le nom propre est translittéré sous la forme « Bilga ».
- source_word: שַׁמּוּעַ
  choice: Shammoua
  rationale: Nom propre du représentant associé à Bilga ; « Shammoua » reproduit de façon lisible la forme hébraïque en français.
- source_word: לִֽ/שְׁמַעְיָה
  choice: pour Shemaya
  rationale: Comme dans le premier groupe, לְ indique ici la personne ou la famille représentée. « Pour » conserve le parallélisme de la liste, et « Shemaya » est une translittération française claire du nom.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: La forme hébraïque pleine est conservée plutôt que d’être ramenée au nom français traditionnel « Jonathan ».
