  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים בָּנֵ֥י/נוּ וּ/בְנֹתֵ֖י/נוּ אֲנַ֣חְנוּ רַבִּ֑ים וְ/נִקְחָ֥ה דָגָ֖ן וְ/נֹאכְלָ֥ה וְ/נִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/002.yaml
  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
translation:
  language: fr
  text: 'Il y en avait qui disaient : « Nous, nos fils et nos filles, nous sommes nombreux. Procurons-nous du grain, afin que nous puissions manger et vivre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Il y en avait qui disaient
  rationale: Cette tournure conserve la construction existentielle et présente ces personnes comme un groupe parmi plusieurs dans le récit des plaintes.
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: Nous, nos fils et nos filles, nous sommes nombreux
  rationale: La formulation garde l’insistance de l’hébreu sur l’ensemble de la famille ainsi que le pronom explicite אֲנַחְנוּ, sans réduire le sens à la simple possession de nombreux enfants.
- source_word: וְנִקְחָה
  choice: Obtenons
  rationale: Le cohortatif exprime ici une volonté ou un appel pressant. « Obtenons » rend l’idée d’acquérir le nécessaire sans suggérer forcément qu’on le prend de force.
- source_word: דָגָן
  choice: du grain
  rationale: Le terme désigne les céréales ou le produit céréalier, et non la nourriture en général.
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: afin que nous puissions manger et vivre
  rationale: La relation de but est naturelle dans le contexte, tandis que les deux verbes hébreux restent distinctement exprimés.
