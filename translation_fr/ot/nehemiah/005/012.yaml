  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: fr
  text: 'Ils dirent : « Nous restituerons et nous ne leur réclamerons rien. Nous ferons comme tu le dis. » Alors j’appelai les prêtres et je les fis prêter serment d’agir conformément à cette parole.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de faire selon cette parole ». Le terme hébreu peut aussi désigner une « affaire » ou, dans ce contexte, l’engagement qui vient d’être pris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: Nous rendrons tout
  rationale: Le hiphil de שוב exprime ici la restitution de ce qui a été pris ou exigé. L’objet étant implicite et renvoyant aux biens mentionnés dans le contexte précédent, « tout » rend naturellement en français l’ensemble de ce qui doit être restitué.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: nous ne leur réclamerons rien
  rationale: Dans ce contexte économique, בקש désigne ce que les créanciers cherchent à obtenir ou exigent des débiteurs. « Réclamer » convient à une créance sans préciser au-delà de l’hébreu s’il s’agit du capital, des intérêts ou d’autres sommes.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: Nous ferons comme tu le dis
  rationale: Cette formulation française actuelle exprime à la fois l’assentiment marqué par כֵּן et la conformité à l’instruction de Néhémie.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: Alors j’appelai les prêtres
  rationale: קרא avec un complément direct signifie appeler ou convoquer. Le passé simple maintient un récit écrit digne et fluide; « alors » marque la succession narrative.
- source_word: וָאַשְׁבִּיעֵם
  choice: je leur fis prêter serment
  rationale: Le hiphil de שבע signifie faire jurer quelqu’un ou lui imposer un serment. En français, « faire prêter serment » est idiomatique. Le pronom renvoie le plus naturellement aux hommes qui viennent de prendre cet engagement, les prêtres étant appelés pour encadrer ou attester le serment.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: d’agir conformément à cet engagement
  rationale: דָּבָר peut désigner une parole, une affaire ou, ici, la déclaration qui vient d’être faite. « Engagement » communique sa force performative dans le contexte du serment, tandis que la note conserve les possibilités lexicales plus formelles.
