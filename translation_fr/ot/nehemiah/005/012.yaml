    issue: Antécédent de « leur » après « les prêtres »
    rationale: Le suffixe de וָאַשְׁבִּיעֵם a un antécédent contextuellement discuté. En français, « je leur fis prêter serment » fait normalement des prêtres les personnes assermentées. Employer « les » conserve la reprise pronominale du texte sans l’expliciter davantage.
  - severity: low
    issue: « tout » explicite l’objet implicite de נָשִׁיב
    rationale: Le contexte précédent permet cette compréhension, mais le texte hébreu ne porte pas ce quantificateur. « Nous restituerons » garde l’objet sous-entendu.
  - severity: low
    issue: Note lexicalement trop directive sur « engagement »
    rationale: דָּבָר signifie d’abord « parole / chose / affaire »; l’idée d’engagement est contextuellement possible, mais ne doit pas être présentée comme l’identification exclusive du référent.
