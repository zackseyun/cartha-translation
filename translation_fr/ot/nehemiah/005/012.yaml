  to: 'Ils dirent : « Nous restituerons et nous ne leur réclamerons rien. Nous ferons comme tu le dis. » Alors j’appelai les prêtres et je les fis prêter serment d’agir conformément à cette parole.[a]'
  rationale: La révision maintient le sens de restitution et de renoncement aux réclamations, tout en évitant d’ajouter « tout ». Elle rend דָּבָר par « parole », plus proche du terme hébreu, et ajuste la note pour préserver les nuances contextuelles. « Je les fis prêter serment » reproduit la reprise pronominale sans déterminer davantage l’antécédent débattu du suffixe hébreu.
