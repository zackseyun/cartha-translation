  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י לְ/טוֹבָ֑ה כֹּ֥ל אֲשֶׁר עָשִׂ֖יתִי עַל הָ/עָ֥ם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: fr
  text: Souviens-toi de moi[a], mon Dieu, pour mon bien, pour tout ce que j’ai fait en faveur de ce peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Souviens-toi de moi favorablement. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Souviens-toi de moi
  rationale: 'L’appel adressé à Dieu emploie זכר avec לִי dans une tournure de prière. En français naturel, le pronom se rend comme complément direct : « Souviens-toi de moi ».'
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: La forme avec suffixe de première personne exprime ici l’adresse directe et personnelle à Dieu, sans qu’une interjection comme « ô » soit nécessaire.
- source_word: לְטוֹבָה
  choice: pour mon bien
  rationale: La préposition ל avec טוֹבָה indique une remembrance ayant une issue bonne ou favorable pour le priant. « Pour mon bien » conserve cette portée bénéfique en français idiomatique.
- source_word: כֹּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette construction relative signifie « tout ce que » et se rend ainsi naturellement en français moderne.
- source_word: עָשִׂיתִי
  choice: j’ai fait
  rationale: Le passé composé convient à l’action passée considérée rétrospectivement depuis la prière présente.
- source_word: עַל
  choice: à cause de
  rationale: Dans ce contexte, עַל rattache la demande de souvenir favorable à l’ensemble des actes accomplis par Néhémie pour le peuple. « À cause de » rend clairement ce fondement sans présenter explicitement les œuvres comme un mérite acquis.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier collectif et le démonstratif hébreux sont conservés directement.
theological_decisions:
- issue: Nature de la prière de Néhémie pour que Dieu se souvienne de lui
  choice: Une demande adressée à Dieu afin qu’il se souvienne favorablement de Néhémie en considération de ce qu’il a fait pour le peuple
  alternative: Une demande de justification publique ou l’affirmation d’un mérite devant Dieu
  rationale: Le texte relie bien la demande aux actes de Néhémie, mais il ne définit pas la nature théologique de ce rapport. La traduction maintient cette tension sans imposer une doctrine du mérite.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton personnel de la prière et la répétition sémantique des deux compléments, tout en évitant le calque peu naturel « pour le bien ».
