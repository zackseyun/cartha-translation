base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: fr
  text: 'Après avoir réfléchi[a], je mis en cause[b] les notables et les responsables. Je leur dis : « Chacun de vous exige des intérêts de son frère[c] ! » Puis je convoquai contre eux une grande assemblée[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’hébreu exprime l’idée que le cœur de Néhémie délibéra en lui ; il réfléchit intérieurement avant d’agir.
    reason: idiom
  - marker: b
    text: 'Ou : « je contestai les notables et les responsables », ou « je leur adressai des reproches ». Le verbe hébreu peut évoquer aussi bien une confrontation qu’une accusation.'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut désigner les intérêts exigés ou, plus largement, la charge imposée par la dette. « Son frère » souligne qu’il s’agit de membres du même peuple.
    reason: lexical_ambiguity
  - marker: d
    text: 'Littéralement : « je plaçai contre eux une grande assemblée ». L’expression signifie qu’il convoqua une importante assemblée contre eux.'
    reason: idiom
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: Après avoir délibéré en moi-même
  rationale: L’expression hébraïque décrit une délibération intérieure. Cette formulation française en restitue le sens réflexif sans y importer l’idée de colère, déjà exprimée au verset précédent.
- source_word: וָאָרִיבָה
  choice: je mis en cause
  rationale: Le verbe ריב peut désigner une contestation, une confrontation ou une accusation. « Mettre en cause » conserve ici la tonalité accusatrice, voire quasi judiciaire, sans imposer une procédure juridique formelle.
- source_word: הַחֹרִים וְאֶת הַסְּגָנִים
  choice: les notables et les responsables
  rationale: « Notables » désigne naturellement les membres de l’élite judéenne, tandis que « responsables » rend le terme administratif sans lui attribuer un titre institutionnel trop précis.
- source_word: מַשָּׁא ... נשאים
  choice: exige des intérêts
  rationale: Dans ce contexte de prêts et d’endettement, מַשָּׁא désigne la charge imposée aux emprunteurs, couramment comprise comme des intérêts. « Exiger » rend la force accusatrice du participe נשאים.
- source_word: אִישׁ בְּאָחִיו
  choice: Chacun de vous ... de son frère
  rationale: La tournure distributive française conserve à la fois l’idée de chacun et le vocabulaire de fraternité qui souligne les liens unissant les membres du peuple.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: je convoquai contre eux une grande assemblée
  rationale: Le verbe נתן signifie littéralement « donner/placer », mais forme ici une expression indiquant la convocation d’une assemblée publique. « Contre eux » maintient la force adversative de עֲלֵיהֶם.
theological_decisions:
- issue: Portée du mot « frère »
  choice: Conserver « son frère »
  alternative: « son compatriote » ou « un autre membre du peuple »
  rationale: Le texte emploie explicitement le langage de la parenté. Le conserver maintient sa portée sociale et communautaire sans préciser davantage la nature théologique de cette fraternité.
- issue: Nature de la charge économique מַשָּׁא
  choice: « intérêts »
  alternative: « charge », « créance » ou « fardeau de la dette »
  rationale: Le contexte immédiat favorise le sens d’intérêts exigés sur des prêts, mais une note signale la portée plus large possible du terme afin de ne pas effacer son ambiguïté lexicale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe a été légèrement restructurée pour rendre naturellement la tournure distributive hébraïque (« chacun… son frère »). Les termes administratifs restent généraux afin de ne pas surdéterminer les fonctions historiques.
