  text: וְ/הַ/יְּהוּדִ֨ים וְ/הַ/סְּגָנִ֜ים מֵאָ֧ה וַ/חֲמִשִּׁ֣ים אִ֗ישׁ וְ/הַ/בָּאִ֥ים אֵלֵ֛י/נוּ מִן הַ/גּוֹיִ֥ם אֲשֶׁר סְבִיבֹתֵ֖י/נוּ עַל שֻׁלְחָנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: fr
  text: Les Juifs[a] et les fonctionnaires, soit cent cinquante hommes, ainsi que ceux qui venaient auprès de nous des nations voisines, étaient à ma table[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ».
    reason: lexical_alternative
  - marker: b
    text: Être « à la table » de Néhémie signifie qu’il fournissait la nourriture à ces personnes dans le cadre de son hospitalité et de ses responsabilités administratives.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: Les Juifs
  rationale: Le terme peut désigner ici les membres du peuple juif en général. « Les Juifs » est naturel en français moderne, tandis que « les Judéens » demeure une possibilité à nuance davantage géographique.
- source_word: וְהַסְּגָנִים
  choice: les hauts fonctionnaires
  rationale: Le mot désigne des responsables civils ou administratifs subordonnés. « Hauts fonctionnaires » exprime leur rang sans leur attribuer un titre perse trop précis.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: soit cent cinquante hommes
  rationale: « Soit » rend explicite en français que le nombre précise l'ensemble formé par les Juifs et les hauts fonctionnaires; « hommes » conserve la référence masculine du texte hébreu.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: ainsi que ceux qui venaient chez nous
  rationale: Le participe hébreu évoque les personnes venant auprès de Néhémie. L'imparfait français convient à cette description rétrospective d'une fréquentation habituelle ou répétée.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: des nations voisines
  rationale: Cette formulation naturelle conserve l'idée de peuples non juifs situés autour de la communauté, sans employer le terme plus interprétatif « païens ».
- source_word: עַל שֻׁלְחָנִי
  choice: étaient à ma table
  rationale: L'expression conserve l'image concrète de la table de Néhémie et laisse entendre, sans l'expliciter dans le corps du texte, qu'il nourrissait ces personnes.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l'image idiomatique de la table tout en clarifiant discrètement le rapport du nombre au premier groupe.
