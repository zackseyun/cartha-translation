  text: וְ/גַם אֲנִי֙ אַחַ֣/י וּ/נְעָרַ֔/י נֹשִׁ֥ים בָּ/הֶ֖ם כֶּ֣סֶף וְ/דָגָ֑ן נַֽעַזְבָה נָּ֖א אֶת הַ/מַּשָּׁ֥א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: fr
  text: Moi aussi, mes frères et mes serviteurs[a], nous leur prêtons[b] de l’argent et des céréales. Je vous en prie, mettons donc fin à cette charge[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes jeunes gens » ou « mes assistants ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nous agissons envers eux en créanciers »; le verbe hébreu peut évoquer l’exigence d’une créance, et non un simple fait de prêter.
    reason: lexical_alternative
  - marker: c
    text: Ou « à cette dette » ou « à cette exaction »; l’hébreu signifie littéralement « ce fardeau » ou « cette charge ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Moi aussi
  rationale: Rend la valeur additive et emphatique de וְגַם, en associant Néhémie à la pratique qu’il dénonce.
- source_word: אַחַי
  choice: mes frères
  rationale: Conserve le terme familial hébreu, qui peut désigner ici des proches ou des compagnons solidaires de Néhémie.
- source_word: וּנְעָרַי
  choice: mes serviteurs
  rationale: Dans ce contexte, נְעָרִים désigne vraisemblablement les jeunes hommes attachés au service ou à la suite de Néhémie; « serviteurs » est plus clair en français courant, tandis que l’autre sens est signalé en note.
- source_word: נֹשִׁים בָּהֶם
  choice: nous leur prêtons
  rationale: Le participe pluriel présente Néhémie, ses frères et ses serviteurs comme créanciers. Cette formulation française reste naturelle sans effacer la nuance potentiellement contraignante, indiquée en note.
- source_word: כֶּסֶף וְדָגָן
  choice: de l’argent et du blé
  rationale: כֶּסֶף désigne ici l’argent employé dans les prêts; דָגָן renvoie aux céréales, rendu par « blé » dans ce contexte alimentaire et économique.
- source_word: נַעַזְבָה נָּא
  choice: Je vous en prie, mettons fin
  rationale: Le cohortatif accompagné de נָא exprime une exhortation pressante mais courtoise. « Mettons fin » rend idiomatiquement l’appel collectif à abandonner la pratique.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: à cette charge
  rationale: מַשָּׁא évoque littéralement une charge ou un fardeau et peut, dans ce contexte financier, désigner la dette ou l’exaction imposée. « Charge » maintient la métaphore et l’ambiguïté.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La reprise disloquée « Moi aussi… nous » respecte le groupe sujet pluriel de l’hébreu tout en restant naturelle à l’oral solennel. Les notes conservent l’ambiguïté économique de נשׁה et מַשָּׁא.
