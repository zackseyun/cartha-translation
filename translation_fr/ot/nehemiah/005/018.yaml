  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: fr
  text: Ce qu’on préparait chaque jour était un bœuf, six moutons de choix et des oiseaux pour moi. Tous les dix jours, on fournissait aussi du vin de toutes sortes en abondance. Malgré cela, je n’ai pas réclamé les provisions du gouverneur[a], car la charge qui pesait sur ce peuple était lourde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pain du gouverneur »; l’expression peut désigner sa ration ou les provisions attachées à sa fonction.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « car le travail était pénible pour ce peuple » ou « car le service pesait lourdement sur ce peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: Ce qu’on préparait chaque jour
  rationale: Le passif hébreu désigne ici la préparation des denrées. « Chaque jour » exprime naturellement la quantité prévue pour une journée dans cette description habituelle.
- source_word: שׁוֹר אֶחָד
  choice: un bœuf
  rationale: שׁוֹר désigne un bovin; « bœuf » convient au contexte alimentaire sans insister indûment sur le sexe de l’animal.
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: six moutons de choix
  rationale: צֹאן peut désigner le petit bétail, tandis que בְּרֻרוֹת indique des bêtes sélectionnées. « Moutons de choix » restitue clairement la quantité et la qualité.
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: et des oiseaux pour moi
  rationale: צִפֳּרִים est un terme général pour les oiseaux. Le verbe « préparait », placé en tête de phrase, régit naturellement cet élément et évite une répétition lourde.
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: Tous les dix jours
  rationale: L’expression indique un intervalle récurrent de dix jours.
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: du vin de toutes sortes en abondance
  rationale: La formulation conserve à la fois la diversité exprimée par בְּכָל et l’idée de grande quantité portée par לְהַרְבֵּה.
- source_word: וְעִם זֶה
  choice: Malgré cela
  rationale: Cette locution introduit un contraste concessif entre l’ampleur des dépenses décrites et le refus de Néhémie de faire valoir son droit officiel.
- source_word: לֶחֶם הַפֶּחָה
  choice: les provisions du gouverneur
  rationale: Littéralement « le pain du gouverneur ». Ici, לֶחֶם désigne vraisemblablement par métonymie les vivres ou la ration attachés à la fonction; « provisions » reste naturel tout en préservant une certaine latitude.
- source_word: לֹא בִקַּשְׁתִּי
  choice: je n’ai pas réclamé
  rationale: בקשׁ signifie demander ou rechercher. Dans ce contexte administratif, « réclamer » exprime le fait de ne pas faire valoir un droit, sans suggérer nécessairement une exigence abusive.
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: car la charge qui pesait sur ce peuple était lourde
  rationale: Cette formulation conserve l’image hébraïque du poids et laisse עֲבֹדָה englober le travail, le service et la charge imposée au peuple.
theological_decisions:
- issue: Portée socio-économique du refus de Néhémie
  choice: Néhémie ne fait pas valoir les provisions attachées à sa charge de gouverneur, par égard pour le lourd fardeau du peuple.
  alternative: Néhémie ne demande simplement pas de pain, ou refuse précisément un impôt lié à sa fonction.
  rationale: Le contexte favorise l’idée de provisions officielles auxquelles le gouverneur pouvait prétendre. La traduction exprime ce droit non exercé sans définir plus précisément le mécanisme fiscal que ne le fait le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase a été légèrement restructurée pour éviter une succession pesante de passifs, tout en conservant les quantités, la périodicité et le contraste éthique du texte hébreu.
