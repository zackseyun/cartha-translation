  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: fr
  text: Je me suis mis très en colère lorsque j’ai entendu leur cri de détresse et ces paroles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et ces faits ». Le mot hébreu peut désigner aussi bien des paroles que les faits ou les affaires dont il était question.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: Je me suis mis en colère
  rationale: L’expression idiomatique חרה + ל décrit la colère qui s’allume chez une personne. Cette formulation naturelle en français rend l’entrée dans cet état sans recourir au calque « cela brûla en moi ».
- source_word: מְאֹד
  choice: très
  rationale: L’adverbe intensifie la colère. « Très » est clair et naturel en français moderne.
- source_word: כַּאֲשֶׁר
  choice: lorsque
  rationale: La conjonction situe ici la colère de Néhémie au moment où il entend la plainte. « Lorsque » exprime naturellement ce rapport temporel dans un registre digne.
- source_word: שָׁמַעְתִּי
  choice: j’ai entendu
  rationale: Le verbe désigne ici le fait d’entendre la plainte et les propos du peuple; le sens simple convient au contexte.
- source_word: זַעֲקָתָם
  choice: leurs cris de détresse
  rationale: זְעָקָה désigne un cri provoqué par la détresse ou l’injustice. Le pluriel collectif est idiomatique en français et fait ressortir la souffrance ainsi que la protestation, sans réduire le terme à une simple « plainte ».
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: et ces paroles
  rationale: דְּבָרִים peut désigner des paroles ou des faits, affaires et situations. « Ces paroles » s’accorde directement avec le verbe « entendre », tout en conservant l’autre possibilité dans une note.
