base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: fr
  text: 'Mais les gouverneurs qui m’avaient précédé imposaient de lourdes charges au peuple : ils lui prenaient du pain et du vin, en plus de quarante sicles d’argent[a]. Même leurs serviteurs[b] dominaient le peuple. Moi, je n’ai pas agi ainsi, à cause de la crainte de Dieu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction hébraïque est difficile. On peut aussi comprendre : « après quarante sicles d’argent » ; elle semble indiquer que le pain et le vin s’ajoutaient à un prélèvement de quarante sicles d’argent.'
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: Ou « leurs hommes de service » ou « leurs jeunes gens ». Le terme hébreu peut désigner des subordonnés attachés au service des gouverneurs.
    reason: alternative lexicale
  - marker: c
    text: Ou « par respect pour Dieu ». L’expression hébraïque est littéralement « à cause de la crainte de Dieu ».
    reason: alternative lexicale et théologique
lexical_decisions:
- source_word: הַפַּחוֹת הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: les gouverneurs qui m’avaient précédé
  rationale: פֶּחָה désigne ici les gouverneurs provinciaux de l’époque perse. La formulation française exprime naturellement qu’ils ont occupé la fonction avant Néhémie.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: imposaient de lourdes charges au peuple
  rationale: Le hiphil de כבד conserve l’image de la lourdeur tout en indiquant, dans ce contexte administratif, des exigences oppressives.
- source_word: וַיִּקְחוּ מֵהֶם בְּלֶחֶם וָיַיִן
  choice: ils lui prenaient du pain et du vin
  rationale: La traduction garde les denrées concrètes nommées en hébreu et le sens ordinaire de לקח, « prendre ».
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: en plus de quarante sicles d’argent
  rationale: Dans cette construction difficile, אַחַר est compris comme signalant un prélèvement supplémentaire. Une note conserve l’incertitude syntaxique.
- source_word: נַעֲרֵיהֶם
  choice: leurs serviteurs
  rationale: Dans un cadre administratif, נַעַר peut désigner des subordonnés ou hommes de service, et non simplement de jeunes hommes.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: dominaient le peuple
  rationale: שלט exprime l’exercice d’un pouvoir sur autrui. « Dominaient » en restitue ici la force négative sans ajouter l’image absente du texte que comporterait « tyrannisaient ».
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: Moi, je n’ai pas agi ainsi
  rationale: Le pronom détaché met en relief le contraste explicite entre Néhémie et ses prédécesseurs.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: à cause de la crainte de Dieu
  rationale: Cette formulation préserve l’expression théologique hébraïque et laisse subsister sa gamme de sens, de la crainte à la révérence responsable devant Dieu.
theological_decisions:
- issue: Sens de יִרְאַת אֱלֹהִים
  choice: à cause de la crainte de Dieu
  alternative: par respect pour Dieu
  rationale: « Crainte de Dieu » garde l’idiome biblique et sa tension entre crainte, révérence et conscience de devoir rendre compte à Dieu, sans le réduire au seul respect.
translation_notes:
  register: Français international moderne, digne et accessible. Les imparfaits présentent les prélèvements et la domination comme la conduite habituelle des anciens gouverneurs ; le passé composé met ensuite en relief le choix personnel de Néhémie.
