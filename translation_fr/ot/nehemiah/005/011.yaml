  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: fr
  text: Je vous en prie, rendez-leur aujourd’hui même leurs champs, leurs vignes, leurs oliveraies et leurs maisons, ainsi que le centième[a] de l’argent, du grain, du vin nouveau et de l’huile que vous leur réclamez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le centième ». Il s’agit vraisemblablement de la part d’un pour cent réclamée sur l’argent, le grain, le vin nouveau et l’huile.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut désigner le fait de réclamer une dette ; selon une autre compréhension, il s’agit de ce que vous leur faites payer à titre d’intérêt.
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ
  choice: Rendez-leur
  rationale: L’impératif pluriel causatif de שוב demande de faire revenir les biens à leurs propriétaires, donc de les leur rendre.
- source_word: נָא
  choice: donc
  rationale: La particule donne ici au commandement une nuance d’exhortation pressante; « donc » est naturel en français moderne sans affaiblir l’impératif.
- source_word: כְּהַיּוֹם
  choice: dès aujourd’hui
  rationale: Cette expression souligne l’immédiateté de la restitution demandée.
- source_word: שְׂדֹתֵיהֶם כַּרְמֵיהֶם זֵיתֵיהֶם וּבָתֵּיהֶם
  choice: leurs champs, leurs vignes, leurs oliveraies et leurs maisons
  rationale: Ces équivalents désignent naturellement les différentes propriétés foncières et immobilières énumérées.
- source_word: וּמְאַת
  choice: ainsi que le centième
  rationale: Le mot signifie littéralement « un centième »; la formulation conserve la donnée chiffrée sans préciser davantage le mécanisme financier.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: Dans ce contexte de prêts et de créances, כסף désigne la valeur monétaire plutôt que le métal en tant que tel.
- source_word: הַדָּגָן
  choice: le blé
  rationale: דגן désigne les céréales ou le grain; « blé » est ici un terme collectif courant et naturel pour les denrées céréalières.
- source_word: הַתִּירוֹשׁ
  choice: le vin nouveau
  rationale: תירוש désigne typiquement le produit récent de la vigne; « vin nouveau » préserve cette nuance.
- source_word: הַיִּצְהָר
  choice: l’huile
  rationale: יצהר désigne l’huile fraîche, normalement l’huile d’olive dans ce contexte agricole.
- source_word: אֲשֶׁר אַתֶּם נֹשִׁים בָּהֶם
  choice: que vous exigez d’eux
  rationale: La formulation exprime l’action des créanciers et sa portée oppressive, sans réduire le verbe à un terme financier technique unique.
theological_decisions:
- issue: Portée financière de נֹשִׁים dans la dénonciation de l’oppression économique
  choice: que vous exigez d’eux
  alternative: que vous leur faites payer à titre d’intérêt; que vous leur prêtez à intérêt
  rationale: Le contexte concerne les pratiques abusives des créanciers. Le rendu choisi garde la force de la réprimande tout en laissant ouverte la nature technique exacte du prélèvement.
- issue: Rapport syntaxique du « centième » avec les biens énumérés
  choice: le centième de l’argent, du blé, du vin nouveau et de l’huile
  alternative: l’intérêt perçu sur l’argent, le blé, le vin nouveau et l’huile
  rationale: Le texte massorétique donne explicitement « le centième ». Le conserver évite d’identifier sans réserve cette fraction à un taux ou à une forme précise d’intérêt.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif demeure ferme, tandis que « donc » rend la nuance exhortative de נָא. Les deux notes signalent les principales incertitudes financières sans imposer une reconstruction particulière.
