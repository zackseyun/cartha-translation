base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: fr
  text: 'Je leur dis : « Nous avons racheté, autant que nous le pouvions, nos frères juifs[a] qui avaient été vendus aux nations. Et vous, vous vendez même vos frères[b], si bien qu’ils nous sont revendus ! » Ils gardèrent le silence et ne trouvèrent rien à répondre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos compatriotes juifs ». L’hébreu dit littéralement « nos frères, les Juifs » et emploie un terme de parenté masculin pour les membres de la communauté.
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase est elliptique. Littéralement, « et ils nous sont vendus ». On peut aussi traduire : « et devraient-ils nous être vendus ? » Elle peut se comprendre comme une question rhétorique soulignant que ces Judéens finiraient par être vendus aux leurs.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: avons racheté
  rationale: Dans ce contexte, le verbe désigne l’achat de Judéens réduits en servitude à l’étranger afin de les ramener parmi les leurs. « Racheter » exprime naturellement cette idée sans développer davantage sa portée théologique.
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: nos frères juifs
  rationale: Cette formulation rend directement le terme de parenté masculin et l’appellation « les Juifs », tout en conservant le langage de solidarité communautaire.
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: qui avaient été vendus aux nations
  rationale: Le plus-que-parfait situe naturellement cette vente avant leur rachat. « Nations » demeure proche de גּוֹיִם et évite une expression trop marquée par l’usage néotestamentaire.
- source_word: כְּדֵי בָנוּ
  choice: autant que nous le pouvions
  rationale: Cette tournure française courante exprime l’étendue des moyens ou des capacités disponibles.
- source_word: וְגַם אַתֶּם
  choice: Et vous, vous… à votre tour
  rationale: La dislocation et « à votre tour » rendent l’insistance accusatrice portée par le pronom explicite et גַם, sans introduire une indication temporelle absente de l’hébreu.
- source_word: תִּמְכְּרוּ
  choice: vous vendez
  rationale: Le présent rend la conduite que Néhémie reproche directement à ses interlocuteurs.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: si bien qu’ils nous sont revendus !
  rationale: 'La formulation présente la conséquence absurde de leur conduite : des Judéens rachetés de l’étranger finissent vendus de nouveau à leur propre communauté. Le caractère elliptique de l’hébreu est signalé en note.'
- source_word: וַיַּחֲרִישׁוּ
  choice: ils gardèrent le silence
  rationale: Rendu idiomatique et fidèle du verbe dans ce contexte de confrontation.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: ne trouvèrent rien à répondre
  rationale: Cette expression française restitue naturellement l’idiome hébreu « ne trouvèrent pas de parole ».
theological_decisions:
- issue: Portée du terme de parenté אַחֵינוּ / אֲחֵיכֶם
  choice: frères
  alternative: compatriotes juifs ; frères et sœurs
  rationale: Le texte emploie un nom masculin pluriel de parenté pour les membres de la communauté. Le texte principal en conserve la forme, tandis que la note précise sa portée communautaire.
- issue: Valeur de וְנִמְכְּרוּ לָנוּ
  choice: 'conséquence exclamative : « si bien qu’ils nous sont revendus ! »'
  alternative: 'question rhétorique : « et devraient-ils nous être revendus ? »'
  rationale: La proposition hébraïque est brève et peut exprimer soit le résultat scandaleux des ventes, soit une question rhétorique. Le texte principal retient la conséquence, mais la note préserve explicitement l’autre lecture.
translation_notes:
  register: Français international actuel, digne et narratif. Les répétitions de « vous » et de « frères » sont conservées pour rendre l’insistance et la solidarité communautaire du discours. La ponctuation exclamative traduit la force de la réprimande sans effacer l’ambiguïté syntaxique, documentée en note.
