  source_fidelity: 'Le sens général est fidèle : Néhémie oppose le rachat de Judéens vendus aux nations à la vente de leurs propres frères par ses interlocuteurs. « Racheté », « frères juifs », « autant que nous le pouvions » et la conclusion narrative rendent bien l’hébreu. Toutefois, « à votre tour » introduit l’idée d’une succession d’actions qui n’est pas exprimée par וְגַם אַתֶּם ; « même » rend plus directement la valeur emphatique de גַם. La proposition finale demeure syntaxiquement elliptique en hébreu ; une conséquence exclamative est possible, à condition que la note conserve clairement la lecture interrogative.'
  naturalness: 'Le français est naturel, soutenu sans être archaïsant. « Ils gardèrent le silence et ne trouvèrent rien à répondre » est particulièrement idiomatique. La légère révision proposée améliore l’accusation directe : « Et vous, vous vendez même vos frères » est plus naturel et plus proche du texte que « à votre tour ».'
  terminology: « Juifs », « nations », « racheté » et « frères » conviennent au registre et au contexte. La note a est utile et correctement ancrée. Pour la fin du verset, « revendus » explicite de façon acceptable le retour absurde de personnes déjà rachetées, mais la note doit indiquer que l’hébreu dit plus littéralement « ils nous sont vendus » et qu’il permet aussi une question rhétorique.
