    rationale: Le passif נִכְבָּשׁוֹת, dans un contexte où les enfants sont livrés « comme esclaves », demande une formulation qui exprime clairement l’esclavage. « Asservies » peut désigner une domination plus générale et atténue le sens contextuel.
  - severity: medium
    issue: « Nous n’avons aucun moyen d’y remédier »
    rationale: L’idiome וְאֵין לְאֵל יָדֵנוּ exprime le manque de pouvoir ou de moyens ; « y remédier » ajoute l’objet précis d’une réparation ou d’un arrêt.
