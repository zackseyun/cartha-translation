  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: fr
  text: Et maintenant, notre chair est comme la chair de nos frères, et nos enfants comme leurs enfants[a]. Pourtant, voici que nous réduisons nos fils et nos filles en esclavage, et certaines de nos filles ont déjà été réduites en esclavage. Mais nous n’avons aucun moyen d’agir[b], et nos champs et nos vignes sont à d’autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous sommes de la même chair que nos frères, et nos enfants sont comme les leurs ». L’hébreu conserve l’image concrète de la chair pour souligner l’humanité et la parenté partagées.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il n’y a pas de force à notre main ». L’expression signifie qu’ils n’ont ni le pouvoir ni les moyens d’agir. L’hébreu ajoute ensuite, par simple coordination : « et nos champs et nos vignes sont à d’autres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: notre chair est comme celle de nos frères
  rationale: Préserve l’image concrète de la « chair » tout en exprimant naturellement en français la communauté humaine et familiale revendiquée.
- source_word: אַחֵינוּ
  choice: nos frères
  rationale: Rend directement le terme masculin de parenté, qui désigne ici les autres membres de la communauté judéenne.
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: nos enfants sont comme leurs enfants
  rationale: בנים peut désigner collectivement les enfants; ce choix convient à la comparaison générale, tandis que la suite nomme explicitement fils et filles.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: réduisons ... en esclavage
  rationale: Le verbe évoque la contrainte et, avec לַעֲבָדִים, l’entrée dans un état d’esclavage; la formulation française est nette et idiomatique.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: certaines de nos filles sont déjà asservies
  rationale: Le participe passif décrit des filles déjà placées sous domination. « Asservies » maintient le lien lexical avec la contrainte sans atténuer la réalité de l’esclavage.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: nous n’avons aucun moyen d’y remédier
  rationale: Rend l’idiome exprimant l’absence de force ou de moyens effectifs, sans prendre אֵל comme un titre divin.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: car nos champs et nos vignes appartiennent à d’autres
  rationale: Explicite naturellement la valeur possessive de la proposition nominale et son rapport explicatif avec leur impuissance.
theological_decisions:
- issue: Langage de parenté dans une plainte pour injustice sociale
  choice: Conserver « frères » et employer « enfants » dans la comparaison générale
  alternative: Employer partout des termes entièrement inclusifs, ou traduire partout formellement par « frères » et « fils »
  rationale: Ce choix respecte le terme masculin אַחֵינוּ tout en reconnaissant la portée collective de בנים; la suite conserve la distinction explicite entre fils et filles.
- issue: Force du vocabulaire relatif à l’esclavage
  choice: Employer « esclavage » et « asservies »
  alternative: Employer « service », « servitude » ou « soumises »
  rationale: Le contexte décrit une contrainte pour dette qui livre les enfants à un statut servile; une terminologie forte évite d’en atténuer la gravité.
- issue: Rapport logique de la dernière proposition
  choice: Rendre le waw par « car »
  alternative: Conserver une simple coordination avec « et »
  rationale: La perte des champs et des vignes explique vraisemblablement l’absence de moyens, mais la note signale que l’hébreu présente formellement une coordination.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque, tandis que les idiomes sont rendus naturellement. Le vocabulaire ne minimise pas la réalité de l’esclavage pour dette.
