  to: Et maintenant, notre chair est comme la chair de nos frères, et nos enfants comme leurs enfants[a]. Pourtant, voici que nous réduisons nos fils et nos filles en esclavage, et certaines de nos filles ont déjà été réduites en esclavage. Mais nous n’avons aucun moyen d’agir[b], et nos champs et nos vignes sont à d’autres.
