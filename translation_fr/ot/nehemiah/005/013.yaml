  variant: modern international French
source:
  edition: WLC
  text: גַּם חָצְנִ֣/י נָעַ֗רְתִּי וָֽ/אֹמְרָ֡/ה כָּ֣כָה יְנַעֵ֪ר הָֽ/אֱלֹהִ֟ים אֶת כָּל הָ/אִישׁ֩ אֲשֶׁ֨ר לֹֽא יָקִ֜ים אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה מִ/בֵּית/וֹ֙ וּ/מִ֣/יגִיע֔/וֹ וְ/כָ֛כָה יִהְיֶ֥ה נָע֖וּר וָ/רֵ֑ק וַ/יֹּאמְר֨וּ כָֽל הַ/קָּהָ֜ל אָמֵ֗ן וַֽ/יְהַלְלוּ֙ אֶת יְהוָ֔ה וַ/יַּ֥עַשׂ הָ/עָ֖ם כַּ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: fr
  text: 'Je secouai aussi le pli de mon vêtement[a] et je dis : « Que Dieu secoue de même, hors de sa maison et du fruit de son travail[c], tout homme qui ne tiendra pas cet engagement[b] ! Qu’il soit ainsi secoué et laissé sans rien ! » Toute l’assemblée dit : « Amen ! » puis elle loua Yahweh. Et le peuple agit conformément à cet engagement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le devant de mon vêtement ». L’hébreu désigne le repli d’un vêtement qui pouvait servir à porter des objets ; le geste symbolise ici le fait d’être vidé et dépouillé.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ne réalisera pas cette parole » ; il s’agit de respecter et de mettre à exécution l’engagement pris.
    reason: lexical_alternative
  - marker: c
    text: Ou « de son travail ». Le mot hébreu peut désigner soit le labeur lui-même, soit ce qu’il produit.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָצְנִי
  choice: le pli de mon vêtement
  rationale: חָצֶן désigne ici le repli d’un vêtement qui pouvait servir à contenir des objets. Cette formulation rend concrètement le geste symbolique de Néhémie.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: je secouai / qu’il secoue / secoué
  rationale: La répétition de נער relie le geste accompli à la malédiction prononcée. La répétition de « secouer » conserve cette image et ce jeu verbal.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: tiendra cet engagement
  rationale: Dans ce contexte de serment, l’expression signifie mettre à exécution ou respecter la parole donnée. « Tenir cet engagement » est naturel en français et maintient la dimension d’obligation.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: hors de sa maison et du fruit de son travail
  rationale: יְגִיעַ peut désigner le travail pénible ou ce qu’il produit. Le contexte d’une dépossession favorise ici le produit du travail, tout en signalant l’autre possibilité en note.
- source_word: וָרֵק
  choice: laissé sans rien
  rationale: רֵק signifie « vide ». Appliqué à une personne après l’image du vêtement secoué, « laissé sans rien » exprime naturellement en français la privation totale sans effacer la métaphore précédente.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: קָהָל désigne la communauté réunie. « Assemblée » est précis, courant et sans coloration confessionnelle indue.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: כַדָּבָר הַזֶּה
  choice: conformément à cet engagement
  rationale: דָּבָר renvoie ici à la parole solennelle que le peuple vient d’accepter. « Engagement » explicite ce référent dans un français idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme. « Yahweh » conserve le nom propre tout en évitant de le remplacer silencieusement par un titre.
- issue: Masculin représentatif כָּל הָאִישׁ
  choice: tout homme
  alternative: quiconque
  rationale: L’hébreu emploie un singulier masculin à valeur représentative. « Tout homme » en conserve la forme et reste naturel dans ce contexte de déclaration publique.
- issue: Portée de la malédiction symbolique
  choice: secoué hors de sa maison et du fruit de son travail, puis laissé sans rien
  alternative: chassé de sa maison et dépouillé de ses biens
  rationale: Le choix retenu préserve l’image répétée de נער et la tension entre geste symbolique, exclusion et dépossession, sans réduire l’expression à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel de l’imprécation est conservé, ainsi que la triple reprise de l’image de la secousse. « Laissé sans rien » rend idiomatiquement l’état de celui qui est « vide » sans surcharger le texte d’une explication.
