  text: וְ֠/גַם בִּ/מְלֶ֜אכֶת הַ/חוֹמָ֤ה הַ/זֹּאת֙ הֶחֱזַ֔קְתִּי וְ/שָׂדֶ֖ה לֹ֣א קָנִ֑ינוּ וְ/כָל נְעָרַ֔/י קְבוּצִ֥ים שָׁ֖ם עַל הַ/מְּלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: fr
  text: Je me suis aussi appliqué aux travaux de cette muraille[a]. Nous n’avons acheté aucun champ, et tous mes jeunes gens[b] étaient rassemblés là pour les travaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai pris part aux travaux de cette muraille » ; le verbe hébreu peut évoquer l’idée de s’y attacher ou de s’y engager fermement.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes serviteurs » ou « les hommes de ma suite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Je me suis aussi
  rationale: « Aussi » conserve la valeur additive de גַם et rattache naturellement l’action au contexte précédent.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: aux travaux de cette muraille
  rationale: מְלָאכָה désigne le travail ou la tâche; le pluriel français « travaux » convient naturellement à un chantier de construction, sans ajouter « ville », absent du texte.
- source_word: הֶחֱזַקְתִּי
  choice: me suis consacré
  rationale: Le hiphil de חזק exprime ici le fait de prendre fermement part à l’ouvrage ou de s’y appliquer; « me suis consacré » rend l’engagement personnel de Néhémie en français naturel.
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: Nous n’avons acheté aucun champ
  rationale: La première personne du pluriel de קנה est conservée. « Aucun champ » rend clairement le singulier שָׂדֶה sous la négation.
- source_word: נְעָרַי
  choice: mes serviteurs
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un homme de la suite. Dans ce contexte administratif, « serviteurs » est naturel, tout en signalant l’alternative en note.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: étaient rassemblés là pour les travaux
  rationale: Le participe passif est rendu par « étaient rassemblés »; « là » conserve שָׁם et « pour les travaux » exprime leur affectation au chantier.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe est légèrement segmentée pour éviter une accumulation lourde de coordinations. « Muraille » évoque clairement l’enceinte urbaine sans expliciter ce que l’hébreu laisse au contexte.
