source:
  edition: WLC
  text: גַּ֞ם מִ/יּ֣וֹם אֲשֶׁר צִוָּ֣ה אֹתִ֗/י לִ/הְי֣וֹת פֶּחָ/ם֮ בְּ/אֶ֣רֶץ יְהוּדָה֒ מִ/שְּׁנַ֣ת עֶשְׂרִ֗ים וְ֠/עַד שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ לְ/אַרְתַּחְשַׁ֣סְתְּא הַ/מֶּ֔לֶךְ שָׁנִ֖ים שְׁתֵּ֣ים עֶשְׂרֵ֑ה אֲנִ֣י וְ/אַחַ֔/י לֶ֥חֶם הַ/פֶּ֖חָה לֹ֥א אָכַֽלְתִּי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: fr
  text: De plus, depuis le jour où il m’a établi comme leur gouverneur dans le pays de Juda, depuis la vingtième année jusqu’à la trente-deuxième année du roi Artaxerxès — soit douze ans —, mes frères et moi n’avons pas mangé la ration attribuée au gouverneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le pain du gouverneur », c’est-à-dire les vivres ou l’allocation que le gouverneur avait normalement le droit de recevoir.
    reason: Précise le sens administratif et idiomatique de לֶחֶם tout en conservant son image littérale.
lexical_decisions:
- source_word: גַּם
  choice: De plus
  rationale: Introduit un élément supplémentaire dans la défense de Néhémie et conserve la valeur additive de l’hébreu.
- source_word: מִיּוֹם אֲשֶׁר
  choice: depuis le jour où
  rationale: Marque le début d’une période qui s’étend sur les douze années ensuite précisées.
- source_word: צִוָּה אֹתִי
  choice: il m’a établi
  rationale: Dans ce contexte administratif, le verbe exprime une désignation officielle plutôt qu’un simple ordre.
- source_word: לִהְיוֹת פֶּחָם
  choice: comme leur gouverneur
  rationale: פֶּחָה désigne un gouverneur provincial de l’administration perse; le suffixe masculin pluriel est rendu par « leur ».
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: Rend directement l’expression géographique sans introduire l’interprétation administrative « province ».
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: depuis la vingtième année jusqu’à la trente-deuxième année du roi Artaxerxès
  rationale: Conserve avec naturel la formule de datation selon les années de règne.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: soit douze ans
  rationale: Explicite en français la valeur récapitulative de l’apposition hébraïque.
- source_word: אֲנִי וְאַחַי
  choice: mes frères et moi
  rationale: Conserve le sens masculin explicite de אַחַי tout en suivant l’ordre idiomatique du français.
- source_word: לֶחֶם הַפֶּחָה
  choice: la ration du gouverneur
  rationale: לֶחֶם signifie littéralement « pain », mais désigne ici les vivres ou l’entretien auxquels le gouverneur avait droit; « ration » garde l’idée de nourriture fournie officiellement.
- source_word: לֹא אָכַלְתִּי
  choice: n’avons pas mangé
  rationale: Préserve l’image concrète du verbe « manger »; le pluriel français est requis par le sujet coordonné.
theological_decisions:
- issue: Portée de אַחַי
  choice: mes frères
  alternative: mes compagnons / mes proches
  rationale: Le terme hébreu est explicitement masculin et signifie d’abord « frères »; le contexte peut inclure des collaborateurs, mais cette extension ne doit pas remplacer le terme dans le texte.
- issue: Sens administratif de לֶחֶם הַפֶּחָה
  choice: la ration du gouverneur
  alternative: le pain du gouverneur
  rationale: Le contexte traite des prélèvements et de l’entretien officiel du gouverneur. La traduction idiomatique communique ce sens tout en signalant le terme littéral en note.
- issue: Suffixe de פֶּחָם
  choice: leur gouverneur
  alternative: gouverneur
  rationale: Le texte massorétique porte un suffixe masculin pluriel. Sa référence exacte reste contextuelle, mais il convient de ne pas l’effacer.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la longue structure chronologique de l’hébreu, avec des tirets pour rendre lisible l’apposition « douze ans ». Le titre administratif est traduit par « gouverneur », terme courant et historiquement approprié.
