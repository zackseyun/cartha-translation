  variant: modern international French
source:
  edition: WLC
  text: ו/יאמר לֹא ט֥וֹב הַ/דָּבָ֖ר אֲשֶׁר אַתֶּ֣ם עֹשִׂ֑ים הֲ/ל֞וֹא בְּ/יִרְאַ֤ת אֱלֹהֵ֨י/נוּ֙ תֵּלֵ֔כוּ מֵ/חֶרְפַּ֖ת הַ/גּוֹיִ֥ם אוֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: fr
  text: 'Alors j’ai dit : « Ce que vous faites n’est pas bien. Ne devriez-vous pas marcher dans la crainte de notre Dieu, à cause des insultes des nations, nos ennemies[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin d’éviter les insultes des nations, nos ennemies ». La préposition hébraïque peut indiquer le motif ou ce que l’on cherche à éviter.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors j’ai dit
  rationale: Le waw narratif fait progresser le récit. « Alors j’ai dit » rend naturellement en français la succession narrative.
- source_word: לֹא טוֹב
  choice: n’est pas bien
  rationale: Cette formulation garde l’évaluation morale directe de l’hébreu tout en étant idiomatique en français moderne.
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Ce que vous faites
  rationale: Tour français naturel qui restitue sans lourdeur l’expression nominale hébraïque.
- source_word: הֲלוֹא
  choice: Ne devriez-vous pas
  rationale: La question rhétorique a ici une force exhortative et morale, bien rendue par cette tournure.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: dans la crainte de notre Dieu
  rationale: « Crainte » conserve l’idiome biblique et sa portée théologique, sans le réduire à la seule révérence.
- source_word: תֵּלֵכוּ
  choice: marcher
  rationale: Le choix conserve la métaphore hébraïque de la conduite morale, qui demeure compréhensible en français biblique moderne.
- source_word: מֵחֶרְפַּת
  choice: à cause des insultes
  rationale: מִן peut exprimer ici le motif ou l’évitement recherché. « Insultes » rend concrètement חֶרְפָּה dans le contexte de peuples hostiles, tandis qu’une note préserve l’autre analyse possible.
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: des nations, nos ennemies
  rationale: « Nations » convient aux peuples étrangers environnants. L’apposition est conservée, avec l’accord français de « ennemies » avec « nations ».
theological_decisions:
- issue: Métaphore éthique de הלך dans un contexte d’obéissance à Dieu
  choice: Conserver « marcher »
  alternative: « vivre » ou « vous conduire »
  rationale: « Marcher » maintient la texture biblique de l’appel à une conduite conforme à la crainte de Dieu sans imposer une interprétation confessionnelle particulière.
- issue: Rapport entre la crainte de Dieu et les insultes des nations
  choice: Rendre מִן par « à cause de » dans le texte
  alternative: « afin d’éviter »
  rationale: La préposition hébraïque permet une nuance causale ou une idée d’évitement. Le texte retient la relation causale la moins expansive, et la note signale l’autre compréhension plausible.
translation_notes:
  register: Français international moderne, digne et direct. La métaphore « marcher dans la crainte de notre Dieu » est volontairement conservée pour respecter l’expression hébraïque, tandis que la syntaxe générale reste naturelle.
