  source_fidelity: Le texte rend fidèlement la progression narrative (« Alors j’ai dit »), l’évaluation morale, la question rhétorique exhortative, l’image éthique de « marcher dans la crainte de notre Dieu » et l’apposition « les nations, nos ennemies ». « À cause des insultes » représente de manière défendable la relation exprimée par מִן avec חֶרְפָּה; la note conserve correctement l’alternative d’un but d’évitement.
