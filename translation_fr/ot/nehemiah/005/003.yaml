  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים שְׂדֹתֵ֛י/נוּ וּ/כְרָמֵ֥י/נוּ וּ/בָתֵּ֖י/נוּ אֲנַ֣חְנוּ עֹרְבִ֑ים וְ/נִקְחָ֥ה דָגָ֖ן בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: fr
  text: 'D’autres disaient : « Nous donnons en garantie nos champs, nos vignes et nos maisons[a] pour obtenir du grain pendant la famine. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous mettons en gage nos champs, nos vignes et nos maisons. » Le verbe hébreu désigne le fait de donner des biens en garantie d’une dette.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: D’autres disaient
  rationale: Cette formulation naturelle introduit un autre groupe parmi les plaignants et rend la valeur durative du participe sans alourdir la phrase.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: nos champs, nos vignes et nos maisons
  rationale: Ces termes concrets correspondent directement aux trois catégories de biens fonciers mentionnées dans l’hébreu.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: Nous donnons en garantie
  rationale: Dans ce contexte, le verbe désigne la remise de biens comme sûreté d’une dette. Cette expression française est précise et évite d’imposer le cadre juridique moderne plus étroit d’une hypothèque.
- source_word: וְנִקְחָה
  choice: pour obtenir
  rationale: La forme exprime ici le but pratique de la mise en garantie. « Obtenir » respecte le sens général de prendre ou se procurer sans préciser indûment qu’il s’agit d’un achat.
- source_word: דָגָן
  choice: du blé
  rationale: Dans ce contexte alimentaire, « blé » est une désignation française courante des céréales vivrières, tout en restant plus concrète que « nourriture ».
- source_word: בָּרָעָב
  choice: pendant la famine
  rationale: La préposition situe l’action dans les circonstances de la famine sans trancher explicitement entre une nuance temporelle et causale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Donner en garantie » est préféré à « hypothéquer », plus immédiatement transparent et moins dépendant d’une catégorie juridique moderne précise.
