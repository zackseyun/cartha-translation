source:
  edition: WLC
  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים לָוִ֥ינוּ כֶ֖סֶף לְ/מִדַּ֣ת הַ/מֶּ֑לֶךְ שְׂדֹתֵ֖י/נוּ וּ/כְרָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/004.yaml
  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: fr
  text: 'D’autres disaient : « Nous avons emprunté de l’argent[a] pour payer l’impôt[b] du roi sur nos champs et nos vignes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’argent métal » ; ici, de la monnaie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le tribut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: D’autres disaient
  rationale: Cette tournure introduit naturellement en français un autre groupe parmi les plaignants. L’imparfait rend la valeur durative ou rapportée du participe אֹמְרִים dans un récit au passé.
- source_word: לָוִינוּ
  choice: nous avons emprunté
  rationale: Le verbe désigne le fait d’emprunter ou de contracter un prêt. Le passé composé exprime naturellement l’acte passé dont les conséquences demeurent présentes.
- source_word: כֶסֶף
  choice: de l’argent
  rationale: Le sens premier est « argent » au sens du métal, mais, dans ce contexte économique, le mot désigne la monnaie ou une somme d’argent.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: pour payer l’impôt du roi
  rationale: מִדָּה désigne ici une contribution imposée ou un tribut dû au roi. L’ajout de « payer » explicite en français le but du prêt sans modifier le sens.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: sur nos champs et nos vignes
  rationale: Les biens fonciers sont vraisemblablement l’assiette de l’impôt. « Sur » exprime clairement et naturellement qu’il s’agit d’un prélèvement portant sur ces terres.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « D’autres disaient » évite une tournure existentielle lourde, tandis que « l’impôt du roi » communique immédiatement la réalité administrative du passage. Les marqueurs de notes figurent directement après les expressions concernées.
