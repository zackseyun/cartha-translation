  text: וַ/תְּהִ֨י צַעֲקַ֥ת הָ/עָ֛ם וּ/נְשֵׁי/הֶ֖ם גְּדוֹלָ֑ה אֶל אֲחֵי/הֶ֖ם הַ/יְּהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/001.yaml
  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: fr
  text: Une grande clameur s’éleva parmi le peuple et leurs femmes contre leurs frères juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs frères judéens ». Le terme hébreu peut désigner les Juifs ou les Judéens, selon que l’accent porte sur l’identité ethnique et communautaire ou sur l’origine régionale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: s’éleva
  rationale: Le wayyiqtol de היה introduit un nouveau développement. En français, « une clameur s’éleva » exprime naturellement l’apparition de cette protestation sans ajouter de marqueur temporel explicite.
- source_word: צַעֲקַת
  choice: clameur
  rationale: Le nom désigne un cri de détresse ou de protestation. « Clameur » en rend à la fois l’intensité et la dimension collective.
- source_word: הָעָם
  choice: les gens du peuple
  rationale: Le terme désigne ici les membres de la communauté touchés par l’oppression économique. Cette formulation évite que « le peuple et leurs femmes » suggère à tort que les femmes ne font pas partie du peuple, tout en conservant la distinction grammaticale du verset.
- source_word: וּנְשֵׁיהֶם
  choice: et leurs femmes
  rationale: Dans cette construction, נָשִׁים signifie le plus naturellement « femmes » au sens d’épouses. Le français « leurs femmes » préserve cette relation et leur participation explicite à la protestation.
- source_word: גְּדוֹלָה
  choice: grande
  rationale: L’adjectif exprime l’ampleur ou l’intensité de la clameur; « grande » en est l’équivalent direct.
- source_word: אֶל
  choice: contre
  rationale: Dans le contexte d’une plainte, la préposition désigne ceux que vise la protestation. « Contre » rend clairement cette valeur adversative.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le texte dit littéralement « leurs frères » et souligne ainsi la solidarité communautaire que l’injustice vient trahir.
- source_word: הַיְּהוּדִים
  choice: juifs
  rationale: Le terme qualifie les « frères » selon leur identité judéenne ou juive. « Juifs » est naturel en français moderne, tandis que l’alternative historique « Judéens » est signalée en note.
theological_decisions:
- issue: Portée du terme יְהוּדִים
  choice: juifs
  alternative: Judéens
  rationale: Le terme hébreu peut mettre l’accent soit sur l’identité ethnique et communautaire, soit sur l’appartenance régionale à Juda. Le contexte met en scène une injustice interne à la communauté; « frères juifs » communique bien cette solidarité, sans exclure la nuance régionale conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « les gens du peuple et leurs femmes » rend la construction hébraïque sans donner à entendre que les femmes seraient extérieures au peuple. « Clameur » conserve la force publique et collective de la plainte.
