source:
  edition: WLC
  text: וְ/עַל יָד֥/וֹ בָנ֖וּ אַנְשֵׁ֣י יְרֵח֑וֹ וְ/עַל יָד֣/וֹ בָנָ֔ה זַכּ֖וּר בֶּן אִמְרִֽי־ס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/002.yaml
  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
translation:
  language: fr
  text: À côté de lui, les hommes de Jéricho bâtirent ; et à côté de lui[a], Zaccur, fils d’Imri, bâtit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « à côté de lui ». Le référent du pronom singulier n’est pas précisé ; certaines traductions rendent ici « à côté d’eux » en reliant l’expression aux hommes de Jéricho.
    reason: ambiguïté référentielle
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: À côté de lui
  rationale: L’expression idiomatique עַל יָד avec suffixe pronominal indique ici la proximité dans la succession des travaux le long de la muraille. « À côté de lui » reste naturel en français tout en conservant le singulier hébreu.
- source_word: בָנוּ
  choice: bâtirent
  rationale: Le qal de בנה signifie simplement « bâtir ». Même si le contexte général concerne la remise en état de la muraille, le verset n’emploie pas ici le verbe « réparer » ni une forme explicitement restaurative.
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: les hommes de Jéricho
  rationale: אַנְשֵׁי désigne littéralement les « hommes de » Jéricho. Cette formulation conserve l’expression masculine du texte source et l’association de ce groupe à la ville.
- source_word: וְעַל יָדוֹ
  choice: et à côté de lui
  rationale: La seconde occurrence porte elle aussi un suffixe masculin singulier en hébreu. La traduction le conserve plutôt que de l’harmoniser avec le groupe pluriel qui précède, afin de préserver la formulation et l’ambiguïté référentielle du texte.
- source_word: בָנָה
  choice: bâtit
  rationale: Comme dans la première proposition, le verbe בנה est rendu par « bâtir », ici au passé simple singulier, adapté au registre narratif biblique français.
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: Zaccur, fils d’Imri
  rationale: Les noms propres sont translittérés sous leurs formes françaises usuelles, et le patronyme hébreu בֶּן est rendu naturellement par « fils de ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient à cette énumération narrative. La répétition de « bâtir » reproduit celle du texte hébreu, tandis que la ponctuation distingue nettement les deux groupes de bâtisseurs.
