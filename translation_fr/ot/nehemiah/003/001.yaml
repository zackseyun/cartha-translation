source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: fr
  text: Alors Éliashib, le grand prêtre, se leva avec ses frères, les prêtres, et ils bâtirent la porte des Brebis. Eux-mêmes la consacrèrent[a] et en posèrent les battants. Ils la consacrèrent jusqu’à la tour des Cent, jusqu’à la tour de Hananel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la dédièrent ». Le verbe hébreu peut désigner le fait de mettre quelque chose à part comme saint ou de le dédier spécialement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Conserve l’image et la force narrative de קום, qui introduit ici l’entrée en action d’Éliashib, sans expliciter davantage que l’hébreu.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: Titre français courant et exact pour le principal prêtre d’Israël.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: avec ses frères, les prêtres
  rationale: Maintient le terme familial « frères » et l’apposition qui les identifie comme prêtres.
- source_word: שַׁעַר הַצֹּאן
  choice: la porte des Brebis
  rationale: Rend naturellement le nom de cette porte de Jérusalem tout en conservant le substantif concret de l’hébreu.
- source_word: הֵמָּה
  choice: ils
  rationale: Le pronom sujet explicite du français porte naturellement la reprise du sujet; ajouter « eux-mêmes » risquerait de produire une insistance plus forte que ne l’exige le contexte.
- source_word: קִדְּשׁוּהוּ
  choice: ils la consacrèrent
  rationale: « Consacrer » conserve la dimension religieuse de קדשׁ, qui désigne la mise à part comme sainte, tout en laissant « dédier » comme possibilité contextuelle.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: ils en posèrent les battants
  rationale: Exprime la mise en place des éléments mobiles de la porte sans préciser indûment la technique d’installation.
- source_word: מִגְדַּל הַמֵּאָה
  choice: la tour des Cent
  rationale: Traduit de façon transparente le nom hébreu plutôt que de le translittérer.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: la tour de Hananel
  rationale: Traduit le nom commun et translittère le nom propre conformément à l’usage français.
- source_word: וְעַד ... עַד
  choice: jusqu’à… jusqu’à
  rationale: Reproduit la double indication d’étendue présente dans l’hébreu.
theological_decisions:
- issue: Sens cultuel de קדשׁ appliqué à la porte
  choice: consacrèrent
  alternative: dédièrent
  rationale: Le verbe peut désigner une mise à part sainte ou une dédicace spéciale. « Consacrèrent » préserve la nuance cultuelle liée à l’action des prêtres, sans préciser un rite que le texte ne décrit pas.
translation_notes:
  register: Français international actuel, sobre et digne. La structure narrative demeure proche de l’hébreu. Le pronom féminin « la » reprend naturellement « la porte » et conserve la répétition du verbe « consacrer » dans la seconde indication d’étendue.
