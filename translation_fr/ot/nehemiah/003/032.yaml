  yaml_path: translation/ot/nehemiah/003/032.yaml
  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: fr
  text: Entre la chambre haute de l’angle[a] et la porte des Brebis, les orfèvres et les marchands effectuèrent des réparations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la montée de l’angle » ou « la salle haute de l’angle ». Le mot hébreu peut désigner une chambre haute ou une montée; l’élément architectural exact reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: Entre
  rationale: Le waw relie ce dernier tronçon à la description précédente; en français, « Entre » exprime naturellement le rapport spatial sans alourdir la phrase.
- source_word: עֲלִיַּת
  choice: la salle haute
  rationale: Le nom peut désigner une pièce ou construction située en hauteur, mais aussi éventuellement une montée. « Salle haute » conserve le sens architectural le plus probable tout en signalant l’incertitude en note.
- source_word: הַפִּנָּה
  choice: l’angle
  rationale: Le terme désigne l’angle ou le coin de la muraille. « L’angle » convient au registre architectural et n’ajoute pas l’idée non exprimée d’une tour.
- source_word: לְשַׁעַר הַצֹּאן
  choice: et la porte des Brebis
  rationale: Après « entre », le français demande la coordination « et ». « Porte des Brebis » rend clairement le nom reconnu de cette porte de Jérusalem.
- source_word: הֶחֱזִיקוּ
  choice: firent les réparations
  rationale: Dans Néhémie 3, ce verbe décrit régulièrement les travaux de remise en état des murailles et des portes; cette formulation rend le sens contextuel plutôt qu’un littéral « fortifièrent ».
- source_word: הַצֹּרְפִים
  choice: les orfèvres
  rationale: Le participe substantivé désigne des artisans qui affinent ou travaillent les métaux précieux; « orfèvres » est précis et naturel en français.
- source_word: וְהָרֹכְלִים
  choice: et les marchands
  rationale: Le terme désigne des commerçants ou négociants; « marchands » est moderne, clair et suffisamment large.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La phrase garde la concision de l’hébreu. Le marqueur [a] est placé immédiatement après l’expression architecturale ambiguë.
