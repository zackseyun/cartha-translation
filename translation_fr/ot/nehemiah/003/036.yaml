  text: שְׁמַ֤ע אֱלֹהֵ֨י/נוּ֙ כִּֽי הָיִ֣ינוּ בוּזָ֔ה וְ/הָשֵׁ֥ב חֶרְפָּתָ֖/ם אֶל רֹאשָׁ֑/ם וּ/תְנֵ֥/ם לְ/בִזָּ֖ה בְּ/אֶ֥רֶץ שִׁבְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: fr
  text: Écoute, notre Dieu, car nous sommes devenus un objet de mépris[a]. Fais retomber sur leur tête leur opprobre, et livre-les au pillage dans un pays de captivité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « car nous sommes devenus [un] mépris ». On peut aussi comprendre : « car nous sommes méprisés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le pays de captivité ». L’hébreu permet ici une lecture indéfinie ou, selon le contexte, plus déterminée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: Impératif adressé à Dieu. « Écoute » est naturel dans une prière et n’ajoute pas de complément absent de l’hébreu.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom avec le suffixe de première personne du pluriel et sa valeur vocative.
- source_word: הָיִינוּ בוּזָה
  choice: nous sommes devenus un objet de mépris
  rationale: Le parfait de היה avec le nom בוּזָה décrit l’état auquel les priants ont été réduits. Cette formulation française conserve l’image nominale sans la tournure littérale peu naturelle « nous sommes devenus mépris ».
- source_word: וְהָשֵׁב
  choice: Fais retomber
  rationale: Le hiphil impératif de שוב exprime ici un retour causé; avec « insultes » et « tête », « faire retomber » restitue naturellement l’idée de renversement rétributif.
- source_word: חֶרְפָּתָם
  choice: leurs insultes
  rationale: חֶרְפָּה peut désigner l’opprobre, la honte ou l’insulte. Dans ce contexte de railleries hostiles, « insultes » est clair et idiomatique, tout en gardant la force du terme.
- source_word: אֶל רֹאשָׁם
  choice: sur leur propre tête
  rationale: Rend l’expression hébraïque de rétribution personnelle; « propre » explicite naturellement en français l’effet réfléchi de l’idiome.
- source_word: וּתְנֵם לְבִזָּה
  choice: livre-les au pillage
  rationale: נתן avec le suffixe objet et לְבִזָּה demande que les ennemis soient livrés comme butin. « Livrer au pillage » est une expression française directe et naturelle.
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: dans un pays de captivité
  rationale: Conserve le caractère indéfini de אֶרֶץ sans article ainsi que le substantif « captivité », sans préciser davantage que l’hébreu.
theological_decisions:
- issue: Prière imprécatoire contre les ennemis
  choice: Conserver la demande directe de justice rétributive
  alternative: Atténuer en une demande générale de justice ou comprendre la requête comme purement métaphorique
  rationale: Le texte hébreu demande explicitement à Dieu de faire revenir l’opprobre des adversaires sur eux et de les livrer au pillage. La traduction ne doit ni neutraliser ni amplifier cette tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La prière demeure directe et solennelle; les formulations archaïques sont évitées. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
