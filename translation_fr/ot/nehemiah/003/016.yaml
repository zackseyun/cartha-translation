source:
  edition: WLC
  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: fr
  text: Après lui, Néhémie, fils d’Azbouc, responsable d’une moitié du district de Beth-Tsour, effectua les réparations jusqu’en face des tombeaux de David, jusqu’au réservoir qui avait été construit et jusqu’à la maison des guerriers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se traduire par « maison des hommes vaillants ». Il s’agit peut-être d’un bâtiment militaire, mais son identification exacte demeure incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste des travaux, l’expression marque normalement la succession des ouvriers ou des sections réparées, tout en pouvant avoir une nuance spatiale.
- source_word: הֶחֱזִיק
  choice: effectua les réparations
  rationale: Le hiphil de חזק est employé comme formule technique dans Néhémie 3 pour la remise en état de la muraille.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: chef de la moitié du district
  rationale: שַׂר désigne ici un responsable administratif, et פֶּלֶךְ un district de l’époque perse.
- source_word: בֵּית צוּר
  choice: Beth-Tsour
  rationale: Le nom de lieu est translittéré selon une forme française qui rend les consonnes hébraïques.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: jusque devant les tombeaux de David
  rationale: נֶגֶד situe les travaux face aux tombeaux, sans suggérer qu’ils atteignaient ou pénétraient le lieu même.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: le réservoir construit
  rationale: La formulation conserve le sens passif et résultatif de « réservoir qui avait été fait » dans un français naturel.
- source_word: בֵּית הַגִּבֹּרִים
  choice: la maison des guerriers
  rationale: גִּבֹּרִים peut désigner des hommes forts ou des guerriers; « maison des guerriers » reste proche du texte sans identifier abusivement le bâtiment à une caserne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « jusqu’à », caractéristique de la délimitation topographique hébraïque, est conservée. « Réservoir » est préféré à « piscine » dans ce contexte d’aménagement hydraulique.
