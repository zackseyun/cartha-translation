    issue: Formulation topographique légèrement lourde
    rationale: « Jusque devant les tombeaux » est moins idiomatique et un peu moins précis que « jusqu’en face des tombeaux », qui rend directement נֶגֶד (« en face de, vis-à-vis de »).
  - severity: medium
    issue: Titre administratif ambigu
    rationale: « Chef de la moitié du district » peut être lu comme un chef partiel ou comme une moitié de chef. Le génitif « responsable d’une moitié du district » traduit clairement שַׂר חֲצִי פֶּלֶךְ sans surinterpréter le rang exact.
  - severity: low
    issue: Qualification du réservoir insuffisamment fluide
    rationale: « Le réservoir construit » est possible, mais « le réservoir qui avait été construit » restitue plus naturellement en français la forme passive définie הָעֲשׂוּיָה.
