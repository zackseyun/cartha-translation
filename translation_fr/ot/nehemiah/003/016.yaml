  verdict: revise
  source_fidelity: 'Le sens général est fidèle au texte hébreu : succession dans la liste, activité de réparation, statut administratif, limites topographiques et désignation prudente de la « maison des guerriers ». « Jusqu’en face des tombeaux de David » rend plus exactement et plus naturellement עַד נֶגֶד que « jusque devant ».'
  naturalness: '« Chef de la moitié du district » est compréhensible, mais ambigu et peu idiomatique : il peut suggérer qu’il dirige seulement une moitié indéterminée. « Responsable d’une moitié du district » exprime clairement la fonction administrative. « Le réservoir qui avait été construit » est plus naturel que l’adjectif isolé « construit » tout en conservant le passif résultatif hébreu.'
  terminology: « Beth-Tsour » est conservé comme translittération française du toponyme. « Maison des guerriers » demeure une traduction sobre de בֵּית הַגִּבֹּרִים, sans imposer l’identification à une caserne. La note conserve l’alternative littérale et l’incertitude référentielle.
  issues:
