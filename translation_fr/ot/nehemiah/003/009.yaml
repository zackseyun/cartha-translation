  text: וְ/עַל יָדָ֤/ם הֶחֱזִיק֙ רְפָיָ֣ה בֶן ח֔וּר שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/009.yaml
  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
translation:
  language: fr
  text: À côté d’eux, Rephaya, fils de Hur, chef de la moitié du district de Jérusalem, fit des réparations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « renforça ». Le verbe hébreu signifie littéralement « rendre fort », mais il est employé dans ce chapitre pour parler des travaux de réparation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: À côté d’eux
  rationale: L’expression hébraïque, littéralement « à leur main/côté », situe dans ce chapitre l’équipe suivante le long de la muraille. « À côté d’eux » rend naturellement cette progression.
- source_word: הֶחֱזִיק
  choice: fit des réparations
  rationale: Le hifil de חזק signifie littéralement « rendre fort, renforcer », mais il désigne ici idiomatiquement la participation aux travaux de réfection de la muraille.
- source_word: רְפָיָה
  choice: Rephaya
  rationale: Translittération française moderne du nom hébreu, conservant approximativement sa forme et sa prononciation.
- source_word: בֶן־חוּר
  choice: fils de Hour
  rationale: Expression patronymique ordinaire identifiant Rephaya par son père.
- source_word: שַׂר
  choice: chef
  rationale: שַׂר désigne un dirigeant ou responsable. « Chef » convient à cette fonction administrative sans surdéterminer le rang précis.
- source_word: חֲצִי פֶּלֶךְ
  choice: la moitié du district
  rationale: פֶּלֶךְ désigne ici une circonscription administrative. La formulation indique que Rephaya dirigeait l’une des deux moitiés du district de Jérusalem.
- source_word: יְרוּשָׁלִָם
  choice: de Jérusalem
  rationale: Forme française usuelle du nom de lieu, dans une relation de dépendance avec « district ».
