id: NEH.3.21
reference: Nehemiah 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק מְרֵמ֧וֹת בֶּן אוּרִיָּ֛ה בֶּן הַקּ֖וֹץ מִדָּ֣ה שֵׁנִ֑ית מִ/פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב וְ/עַד תַּכְלִ֖ית בֵּ֥ית אֶלְיָשִֽׁיב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: fr
  text: Après lui, Merémoth, fils d’Urie, fils de Hakkots, répara une autre section[a], depuis l’entrée de la maison d’Éliashib jusqu’à l’extrémité de cette maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une deuxième section ». L’expression hébraïque peut désigner une portion supplémentaire confiée à Merémoth ou, plus littéralement, une « deuxième mesure » ou longueur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste des travaux de Néhémie 3, l’expression marque la succession des équipes ou des portions réparées. « Après lui » conserve directement cette progression.
- source_word: הֶחֱזִיק
  choice: répara
  rationale: Le verbe signifie fondamentalement « fortifier » ou « rendre solide », mais il désigne ici, de manière idiomatique, l’exécution de travaux de réparation.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: Merémoth, fils d’Urie, fils de Hakkots
  rationale: La chaîne patronymique est conservée pour identifier précisément le personnage, avec les formes françaises usuelles des noms bibliques.
- source_word: מִדָּה שֵׁנִית
  choice: une autre section
  rationale: Dans ce contexte, l’expression désigne vraisemblablement une portion supplémentaire confiée à Merémoth, déjà mentionné au verset 4. La note conserve la formulation plus littérale « une deuxième section ».
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: depuis l’entrée de la maison d’Éliashib
  rationale: פֶּתַח désigne ici l’ouverture ou l’entrée d’un bâtiment; « entrée » convient naturellement à la description topographique.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: jusqu’à l’extrémité de cette maison
  rationale: תַּכְלִית exprime ici une limite spatiale ou un point terminal. Le démonstratif évite une répétition lourde tout en gardant Éliashib comme référent explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit la progression topographique de l’hébreu, tandis que la répétition finale de « la maison d’Éliashib » est allégée par « cette maison » sans perte de sens.
