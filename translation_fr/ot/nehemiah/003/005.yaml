  text: וְ/עַל יָדָ֖/ם הֶחֱזִ֣יקוּ הַ/תְּקוֹעִ֑ים וְ/אַדִּֽירֵי/הֶם֙ לֹא הֵבִ֣יאוּ צַוָּרָ֔/ם בַּ/עֲבֹדַ֖ת אֲדֹנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: fr
  text: À côté d’eux, les habitants de Teqoa firent des réparations. Mais leurs notables[a] ne voulurent pas plier la nuque au travail de leurs maîtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs chefs » ou « leurs hommes influents ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « n’apportèrent pas leur nuque au travail de leurs maîtres » ; cette image exprime leur refus de se soumettre à la tâche ou de s’y engager.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: À côté d’eux
  rationale: Dans la liste des travaux de Néhémie 3, l’expression situe chaque équipe par rapport à la précédente. Cette formulation française rend clairement cette proximité.
- source_word: הֶחֱזִיקוּ
  choice: effectuèrent les réparations
  rationale: Dans ce contexte, le verbe désigne la remise en état ou la consolidation de la muraille, plutôt que le simple fait de « fortifier » ou de « saisir ».
- source_word: הַתְּקוֹעִים
  choice: les habitants de Teqoa
  rationale: Le gentilé hébreu désigne les gens originaires de Teqoa. Cette tournure est plus immédiatement compréhensible en français qu’un gentilé rare.
- source_word: וְאַדִּירֵיהֶם
  choice: leurs notables
  rationale: Le terme désigne ici les hommes puissants, éminents ou influents de la communauté. « Notables » convient au contexte civique sans préciser indûment leur fonction.
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: ne voulurent pas courber la nuque
  rationale: La formulation conserve l’image corporelle du texte hébreu tout en exprimant naturellement en français un refus de se soumettre à la tâche ou de s’y engager.
- source_word: בַּעֲבֹדַת
  choice: pour participer au travail
  rationale: Dans ce chapitre, עֲבֹדָה renvoie au travail collectif de reconstruction. « Participer » explicite seulement la relation idiomatique entre la nuque et le travail.
- source_word: אֲדֹנֵיהֶם
  choice: leurs maîtres
  rationale: Le pluriel possessif est conservé. « Maîtres » rend directement la relation d’autorité sans transformer le terme en titre divin singulier.
theological_decisions:
- issue: Référent de « leurs maîtres »
  choice: Conserver le pluriel et la référence à des autorités humaines sans les identifier davantage
  alternative: Comprendre ou reformuler l’expression comme « le travail du Seigneur »
  rationale: L’hébreu porte explicitement le pluriel « leurs maîtres ». Le rendre par un titre divin singulier effacerait cette donnée et résoudrait une question que le verset ne précise pas.
translation_notes:
  register: Français international moderne, sobre et digne. « Teqoa » suit une translittération proche de l’hébreu. L’image de la nuque est maintenue, tandis que la syntaxe est légèrement explicitée pour rester naturelle et compréhensible.
