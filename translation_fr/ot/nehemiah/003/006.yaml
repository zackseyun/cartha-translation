source:
  edition: WLC
  text: וְ/אֵת֩ שַׁ֨עַר הַיְשָׁנָ֜ה הֶחֱזִ֗יקוּ יֽוֹיָדָע֙ בֶּן פָּסֵ֔חַ וּ/מְשֻׁלָּ֖ם בֶּן בְּסֽוֹדְיָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו וּ/מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: fr
  text: Joïada, fils de Paséah, et Meshoullam, fils de Besodia, réparèrent la Vieille Porte[a]. Ils en posèrent les poutres et mirent en place ses battants, ses verrous et ses barres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « la porte de Yeshana », si le second terme est un nom de lieu plutôt que l’adjectif « vieille ».
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: réparèrent
  rationale: Dans Néhémie 3, ce verbe sert régulièrement à décrire la remise en état d’une partie des fortifications. « Réparèrent » est naturel en français et convient au contexte de construction.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: la Vieille Porte
  rationale: L’expression se comprend naturellement comme le nom d’une porte signifiant « Vieille Porte ». La possibilité que יְשָׁנָה soit un nom de lieu est conservée en note.
- source_word: קֵרֻהוּ
  choice: en posèrent les poutres
  rationale: Le verbe désigne l’action de couvrir ou de munir de poutres. Dans le cas d’une porte fortifiée, cette formulation décrit clairement l’ouvrage sans suggérer nécessairement la toiture complète d’un bâtiment.
- source_word: וַיַּעֲמִידוּ
  choice: mirent en place
  rationale: Le causatif signifie littéralement « faire tenir debout » ou « placer ». « Mettre en place » convient naturellement à l’installation des éléments de la porte.
- source_word: דַּלְתֹתָיו
  choice: ses battants
  rationale: Le pluriel renvoie vraisemblablement aux deux éléments mobiles de la porte. « Battants » est plus précis que « portes » en français dans ce contexte.
- source_word: מַנְעֻלָיו
  choice: ses verrous
  rationale: Dans ce contexte, le terme désigne les dispositifs servant à fermer la porte. « Verrous » reste concret sans supposer une serrure moderne.
- source_word: בְרִיחָיו
  choice: ses barres
  rationale: Le mot désigne les barres transversales qui renforcent ou bloquent les battants; « barres » le distingue des poutres déjà mentionnées.
- source_word: הֵמָּה
  choice: Ils
  rationale: Le pronom reprend avec une certaine insistance les deux hommes nommés. Le simple pronom « Ils » suffit en français courant.
- source_word: יוֹיָדָע ... וּמְשֻׁלָּם
  choice: Joïada ... et Meshoullam
  rationale: Les noms propres sont translittérés sous des formes françaises reconnaissables.
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: Paséah / Besodia
  rationale: Les noms patronymiques sont translittérés plutôt que traduits.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « Battants » précise la structure d’une porte à deux vantaux, tandis que « verrous » et « barres » maintiennent la distinction entre les deux types de dispositifs de fermeture.
