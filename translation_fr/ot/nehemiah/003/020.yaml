source:
  edition: WLC
  text: אַחֲרָ֨י/ו הֶחֱרָ֧ה הֶחֱזִ֛יק בָּר֥וּךְ בֶּן זבי מִדָּ֣ה שֵׁנִ֑ית מִן הַ֨/מִּקְצ֔וֹעַ עַד פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב הַ/כֹּהֵ֖ן הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: fr
  text: Après lui, Baruch, fils de Zabbaï[a], répara avec ardeur[b] une deuxième section, depuis l’angle jusqu’à l’entrée de la maison d’Éliashib, le grand prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils de Zakkaï », selon une autre tradition du nom attestée dans certaines versions.
    reason: alternative_reading
  - marker: b
    text: La tournure hébraïque rendue par « répara avec ardeur » est inhabituelle et souligne probablement la ferveur ou le zèle exceptionnel de Baruch dans ce travail.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste des travaux, l’expression indique à la fois la succession des ouvriers et la proximité du tronçon suivant.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: répara avec ardeur
  rationale: הֶחֱזִיק désigne ici la réparation ou la consolidation de la muraille. Le verbe inhabituel הֶחֱרָה intensifie l’action et évoque vraisemblablement le zèle ou la ferveur; « avec ardeur » rend cet effet en français naturel sans effacer l’étrangeté signalée en note.
- source_word: בָּרוּךְ בֶּן זבי
  choice: Baruch, fils de Zabbaï
  rationale: Les noms propres sont translittérés; « Zabbaï » représente directement la forme consonantique du texte hébreu, tandis qu’une autre tradition du nom est donnée en note.
- source_word: מִדָּה שֵׁנִית
  choice: une deuxième section
  rationale: Dans ce chapitre, l’expression désigne un autre tronçon attribué à un ouvrier, et non une mesure abstraite.
- source_word: מִן הַמִּקְצוֹעַ
  choice: depuis l’angle
  rationale: Le nom désigne l’angle ou le tournant architectural de la muraille; « l’angle » convient au contexte topographique.
- source_word: עַד פֶּתַח בֵּית
  choice: jusqu’à l’entrée de la maison de
  rationale: פֶּתַח désigne une entrée ou une ouverture, et בֵּית renvoie vraisemblablement ici à la résidence ou au complexe d’habitation.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: Éliashib, le grand prêtre
  rationale: « Grand prêtre » est le titre français consacré pour הַכֹּהֵן הַגָּדוֹל.
