source:
  edition: WLC
  text: וְ/עַל יָד֣/וֹ הֶחֱזִ֗יק שַׁלּוּם֙ בֶּן הַלּוֹחֵ֔שׁ שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ יְרוּשָׁלִָ֑ם ה֖וּא וּ/בְנוֹתָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: fr
  text: À côté de lui[a], Shalloum, fils d’Hallohesh, chef de la moitié du district de Jérusalem, effectua les réparations, lui et ses filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et près de lui ». L’expression hébraïque évoque littéralement ce qui se fait « à sa main », c’est-à-dire à côté de la section du travailleur précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: À côté de lui
  rationale: Dans Néhémie 3, cette expression idiomatique situe chaque équipe près de la section précédente. Cette formulation naturelle conserve le sens spatial et l’enchaînement des travaux.
- source_word: הֶחֱזִיק
  choice: effectua les réparations
  rationale: Dans le contexte du chapitre, le hifil de חזק désigne la participation à la remise en état de la muraille. Cette traduction exprime clairement l’action sans retenir le littéralisme potentiellement trompeur « fortifia ».
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: Translittération française usuelle du nom hébreu.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: fils d’Hallohesh
  rationale: Le patronyme est conservé sous forme translittérée, sans chercher à traduire le nom propre.
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: chef de la moitié du district de Jérusalem
  rationale: שַׂר désigne ici un responsable administratif et פֶּלֶךְ un district. « District » évite de donner à cette circonscription une ampleur excessive.
- source_word: הוּא וּבְנוֹתָיו
  choice: avec ses filles
  rationale: La formulation française identifie clairement Shalloum et ses filles comme participants aux travaux, tout en restant naturelle. La mention remarquable des filles est pleinement conservée.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve le caractère administratif du titre de Shalloum ainsi que la participation explicite de ses filles, sans ajouter d’objet absent du texte hébreu.
