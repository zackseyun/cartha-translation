  text: מֵ/עַ֣ל שַׁ֣עַר הַ/סּוּסִ֗ים הֶחֱזִ֨יקוּ֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ לְ/נֶ֥גֶד בֵּיתֽ/וֹ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/028.yaml
  text: Above the Horse Gate[a], the priests made repairs, each one opposite his own house.
translation:
  language: fr
  text: Au-dessus de la porte des Chevaux[a], les prêtres firent des réparations, chacun en face de sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la porte des chevaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל
  choice: Au-dessus de
  rationale: Dans cette liste de travaux, la préposition situe ce tronçon par rapport au secteur précédent; « au-dessus de » en conserve naturellement le sens spatial.
- source_word: שַׁעַר הַסּוּסִים
  choice: la porte des Chevaux
  rationale: Le groupe construit désigne vraisemblablement un nom de lieu. La majuscule signale ce statut, tandis que « des Chevaux » reste proche de la forme hébraïque.
- source_word: הֶחֱזִיקוּ
  choice: firent des réparations
  rationale: Dans Néhémie 3, le verbe décrit régulièrement la remise en état de la muraille ou de ses portes; cette formulation rend le contexte de construction sans s'en tenir au sens littéral « fortifier ».
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français direct du nom défini.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier a ici une valeur distributive au sein du groupe des prêtres.
- source_word: לְנֶגֶד
  choice: en face de
  rationale: L'expression indique qu'un tronçon se trouvait devant ou vis-à-vis de la maison de chaque prêtre; « en face de » est naturel et ne précise pas davantage la géométrie du lieu.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: Le suffixe masculin singulier dépend du distributif « chacun »; le singulier français convient donc.
theological_decisions: []
