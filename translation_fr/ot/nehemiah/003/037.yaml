source:
  edition: WLC
  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: fr
  text: Ne couvre pas leur faute[a], et que leur péché ne soit pas effacé de devant toi, car ils ont provoqué la colère en présence des bâtisseurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne pardonne pas leur iniquité » ; l’hébreu emploie l’image de couvrir leur faute.
    reason: lexical_alternative
  - marker: b
    text: Ou « car ils t’ont provoqué à la colère en présence des bâtisseurs ». L’hébreu ne précise pas explicitement qui a été provoqué à la colère.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: ne couvre pas leur faute
  rationale: Le verbe כסה avec עַל évoque l’action de couvrir et peut, dans ce contexte, signifier ne pas tenir compte d’une faute ou la pardonner. « Ne couvre pas » conserve l’image hébraïque, tandis que « faute » exprime ici à la fois le tort commis et la culpabilité.
- source_word: חַטָּאתָם
  choice: leur péché
  rationale: « Péché » est le sens direct de חַטָּאת et maintient le parallélisme avec « leur faute ».
- source_word: מִלְּפָנֶיךָ ... תִּמָּחֶה
  choice: ne soit pas effacé de devant toi
  rationale: מחה signifie effacer ou faire disparaître. « De devant toi » préserve l’image relationnelle et spatiale de ce qui demeure sous le regard de Dieu.
- source_word: הִכְעִיסוּ
  choice: ils ont provoqué la colère
  rationale: Le hifil de כעס signifie provoquer la colère. Puisque l’objet n’est pas exprimé, cette formulation garde la concision et l’ambiguïté du texte hébreu.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: devant les bâtisseurs
  rationale: לְנֶגֶד signifie naturellement « devant, en présence de ». « Devant les bâtisseurs » restitue directement cette dimension publique sans transformer la locution en « contre les bâtisseurs ».
theological_decisions:
- issue: Caractère imprécatoire de la prière concernant le péché des adversaires
  choice: Conserver la demande directe que leur faute ne soit ni couverte ni effacée.
  alternative: 'Atténuer en disant : « ne ferme pas les yeux sur leur faute ».'
  rationale: L’hébreu formule une requête sévère et explicite. La traduction maintient cette tension théologique sans l’adoucir ni l’expliquer selon une doctrine particulière.
- issue: Objet implicite de la colère provoquée
  choice: Ne pas ajouter explicitement « ta » ou « toi » dans le texte principal.
  alternative: « Ils t’ont provoqué à la colère devant les bâtisseurs. »
  rationale: Le sujet qui éprouve la colère est naturellement compris comme Dieu, mais l’hébreu n’exprime pas l’objet. Le texte principal préserve cette ellipse, et la note signale l’autre formulation possible.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve le parallélisme de la prière et l’image hébraïque de la faute couverte ou du péché effacé, tout en évitant un vocabulaire inutilement archaïque.
