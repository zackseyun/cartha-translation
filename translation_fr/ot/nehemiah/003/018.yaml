  text: אַחֲרָי/ו֙ הֶחֱזִ֣יקוּ אֲחֵי/הֶ֔ם בַּוַּ֖י בֶּן חֵנָדָ֑ד שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: fr
  text: 'Après lui, leurs frères réparèrent : Bavvaï[a], fils de Hénadad, chef de la moitié du district de Qeïla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traditions textuelles donnent « Binnouï » au lieu de « Bavvaï ».
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Rend le repère spatial et séquentiel qui introduit la section suivante des travaux, tout en conservant le pronom masculin du texte hébreu.
- source_word: הֶחֱזִיקוּ
  choice: firent des réparations
  rationale: Dans Néhémie 3, le verbe « renforcer » est employé dans le contexte de la remise en état de la muraille; cette formulation naturelle explicite ce sens contextuel.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Traduction directe qui conserve la désignation relationnelle du texte, sans décider s'il s'agit de frères biologiques ou de membres du même groupe.
- source_word: בַּוַּי
  choice: Bavvaï
  rationale: Translittération de la forme vocalisée du WLC; la variante « Binnouï » est signalée en note.
- source_word: בֶּן חֵנָדָד
  choice: fils de Hénadad
  rationale: Rend naturellement la construction patronymique hébraïque.
- source_word: שַׂר
  choice: chef
  rationale: Terme français courant et digne convenant à un responsable administratif, sans connotation militaire excessive.
- source_word: חֲצִי פֶּלֶךְ
  choice: la moitié du district
  rationale: Le terme désigne ici une subdivision administrative; « district » évite de suggérer une province de plus grande étendue.
- source_word: קְעִילָה
  choice: Qéila
  rationale: Translittération française usuelle du nom de lieu.
