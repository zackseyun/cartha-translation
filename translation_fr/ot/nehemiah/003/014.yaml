source:
  edition: WLC
  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: fr
  text: Malkiya, fils de Rékab, chef du district de Beth-Kérem, répara la porte du Fumier[a]. C’est lui qui la bâtit et mit en place ses battants, ses verrous et ses barres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porte des Déchets ». Le nom hébreu désigne le fumier ou les déchets.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: répara
  rationale: Dans la liste des travaux de Néhémie 3, ce verbe désigne la prise en charge et la réparation d’une section des fortifications; « répara » est naturel et précis en français.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: la porte du Fumier
  rationale: אַשְׁפּוֹת renvoie au fumier ou aux déchets. « porte du Fumier » conserve le sens concret du nom hébreu et correspond à une désignation française établie; l’autre valeur possible est signalée en note.
- source_word: שַׂר פֶּלֶךְ
  choice: chef du district
  rationale: שַׂר désigne ici un dirigeant ou haut responsable, et פֶּלֶךְ une circonscription administrative. « chef du district » rend sobrement cette fonction sans préciser davantage son statut.
- source_word: בֵּית הַכָּרֶם
  choice: Beth-Kérem
  rationale: Le toponyme est translittéré plutôt que traduit; cette forme est lisible en français moderne tout en reflétant le nom hébreu.
- source_word: הוּא יִבְנֶנּוּ
  choice: C’est lui qui la bâtit
  rationale: « bâtit » rend directement בנה sans ajouter explicitement l’idée de reconstruction, tandis que la tournure « C’est lui qui » restitue l’insistance portée par הוּא.
- source_word: וְיַעֲמִיד
  choice: mit en place
  rationale: Le hiphil de עמד signifie ici poser ou installer les éléments de la porte; « mit en place » convient à l’ensemble des pièces énumérées.
- source_word: דַּלְתֹתָיו
  choice: ses battants
  rationale: Le pluriel désigne les panneaux mobiles de la porte; « battants » est plus précis que « portes » dans ce contexte architectural.
- source_word: מַנְעֻלָיו
  choice: ses verrous
  rationale: Le terme désigne les dispositifs servant à fermer ou bloquer la porte; « verrous » s’accorde naturellement avec les barres mentionnées ensuite.
- source_word: וּבְרִיחָיו
  choice: ses barres
  rationale: בְּרִיחַ désigne une barre de fermeture ou barre transversale servant à assurer une porte.
theological_decisions: []
