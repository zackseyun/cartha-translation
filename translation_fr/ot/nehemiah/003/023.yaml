  text: אַחֲרָ֨י/ו הֶחֱזִ֧יק בִּנְיָמִ֛ן וְ/חַשּׁ֖וּב נֶ֣גֶד בֵּיתָ֑/ם אַחֲרָ֣י/ו הֶחֱזִ֗יק עֲזַרְיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן עֲנָֽנְיָ֖ה אֵ֥צֶל בֵּיתֽ/וֹס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: fr
  text: Après lui, Benjamin et Hashoub réparèrent en face de leur maison. Après lui, Azaria, fils de Maaséya, fils de Hanania, répara près de sa maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste des travaux de Néhémie 3, cette formule récurrente marque la progression d’un secteur du mur au suivant.
- source_word: הֶחֱזִיק
  choice: réparèrent / répara
  rationale: Le hiphil de חזק désigne ici la participation aux travaux de remise en état du mur; « réparer » exprime naturellement cet emploi contextuel.
- source_word: בִּנְיָמִן וְחַשּׁוּב
  choice: Benjamin et Hashoub
  rationale: Les noms propres sont transcrits selon des formes françaises usuelles et proches de l’hébreu.
- source_word: נֶגֶד בֵּיתָם
  choice: la partie située en face de leur maison
  rationale: נֶגֶד indique une position vis-à-vis de la maison; l’ajout explicatif de « la partie située » rend en français l’objet sous-entendu des travaux sans changer le référent.
- source_word: עֲזַרְיָה בֶן מַעֲשֵׂיָה בֶּן עֲנָנְיָה
  choice: Azaria, fils de Maaséya, fils d’Anania
  rationale: La structure généalogique hébraïque est conservée sans préciser davantage la relation entre les générations.
- source_word: אֵצֶל בֵּיתוֹ
  choice: la partie située à côté de sa maison
  rationale: אֵצֶל exprime la proximité; « à côté de » le distingue clairement de la formule séquentielle « après lui ».
