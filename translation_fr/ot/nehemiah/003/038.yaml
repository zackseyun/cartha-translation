revisions:
- from: Nous avons donc rebâti la muraille, et toute la muraille fut raccordée jusqu’à la moitié de sa hauteur, car le peuple avait à cœur de travailler[a].
  to: Nous rebâtîmes donc la muraille, et les parties de toute la muraille furent reliées jusqu’à la moitié de sa hauteur, car le peuple avait à cœur de travailler[a].
  rationale: La révision remplace le terme technique « raccordée » par « les parties … furent reliées », qui rend plus idiomatiquement l’image de tronçons unis et préserve la voix passive du texte hébreu. Elle harmonise aussi les temps narratifs. L’explicitation « de sa hauteur » et la note sur l’idiome du cœur sont conservées.
