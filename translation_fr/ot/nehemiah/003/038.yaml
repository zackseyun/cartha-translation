    issue: « Toute la muraille fut raccordée » est une formulation technique et quelque peu raide.
    rationale: Le nifal de קשר évoque le fait que les portions de la muraille se relient. En français, il est plus naturel de dire que les parties ou tronçons de la muraille furent reliés.
  - severity: low
    issue: Alternance injustifiée des temps verbaux.
    rationale: « Nous avons rebâti » suivi de « fut raccordée » mélange passé composé et passé simple. Une narration biblique au passé simple permet une formulation cohérente et digne.
