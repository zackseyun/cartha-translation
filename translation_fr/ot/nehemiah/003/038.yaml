  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: fr
  text: Nous rebâtîmes donc la muraille, et les parties de toute la muraille furent reliées jusqu’à la moitié de sa hauteur, car le peuple avait à cœur de travailler[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le peuple avait un cœur pour faire ». Cette expression indique qu’il était intérieurement résolu et disposé à accomplir le travail.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: Nous avons donc rebâti
  rationale: Le wayyiqtol qal à la première personne du pluriel poursuit le récit. « Rebâti » convient à la remise en état de la muraille existante, et « donc » rend naturellement l’enchaînement dans ce contexte.
- source_word: הַחוֹמָה
  choice: la muraille
  rationale: חוֹמָה désigne ici la muraille fortifiée de la ville ; « muraille » est plus précis que le terme général « mur ».
- source_word: וַתִּקָּשֵׁר כָּל הַחוֹמָה
  choice: toute la muraille fut raccordée
  rationale: Le nifal de קשר présente les différents tronçons comme reliés en un ensemble continu. Le passif « fut raccordée » conserve cette valeur résultative.
- source_word: עַד חֶצְיָהּ
  choice: jusqu’à la moitié de sa hauteur
  rationale: L’hébreu dit littéralement « jusqu’à sa moitié ». Dans ce contexte de construction, la moitié visée est naturellement celle de la hauteur ; l’explicitation évite une formulation française obscure.
- source_word: וַיְהִי לֵב לָעָם
  choice: car le peuple avait à cœur
  rationale: Cette tournure préserve l’image hébraïque du cœur tout en exprimant naturellement la résolution et l’empressement du peuple. « Car » rend la relation explicative avec l’avancement des travaux.
- source_word: לַעֲשׂוֹת
  choice: de travailler
  rationale: Bien que עשה signifie largement « faire », le contexte de la reconstruction appelle ici le français idiomatique « travailler ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La métaphore du cœur est conservée sous la forme idiomatique « avoir à cœur », tandis que l’expression elliptique concernant la moitié de la muraille est explicitée avec mesure.
