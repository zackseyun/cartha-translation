  source_fidelity: 'Le sens de l’hébreu est bien rendu : Tobiya est auprès de Sanballat, reprend la raillerie, et l’image hyperbolique veut dire qu’un simple renard suffirait à endommager le mur. « Renard », « mur de pierres » et « ouvrir une brèche » sont des rendus défendables de שׁוּעָל, חוֹמַת אַבְנֵיהֶם et וּפָרַץ.'
  naturalness: Le français est globalement naturel et conserve le ton moqueur. Toutefois, dans « Tobiya l’Ammonite, qui se tenait à ses côtés », le possessif de « ses côtés » peut être lu comme renvoyant à Tobiya lui-même plutôt qu’à la personne auprès de laquelle il se trouve. « Près de lui » rend explicitement et sans ambiguïté la relation indiquée par אֶצְלוֹ.
  terminology: « Tobiya », « l’Ammonite », « renard » et « mur de pierres » conviennent à un français biblique moderne international. Les notes lexicales sont appropriées et leurs ancres correspondent aux mots concernés.
