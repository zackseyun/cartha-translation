base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: fr
  text: 'Tobiya l’Ammonite se tenait près de lui et dit : « Même ce qu’ils construisent ! Si un renard[a] monte dessus, il ouvrira une brèche[b] dans leur mur de pierres ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « renard » peut, dans certains contextes, désigner plus largement un canidé semblable au renard.
    reason: lexical_alternative
  - marker: b
    text: Ou « il démolira leur mur de pierres ». Le verbe hébreu peut exprimer l’ouverture d’une brèche ou l’effondrement d’un ouvrage ; il souligne ici la prétendue faiblesse du mur dans la raillerie de Tobiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: qui se tenait à ses côtés
  rationale: La préposition אֵצֶל avec suffixe exprime la proximité. Cette formulation française indique naturellement que Tobiya se trouvait auprès de Sanballat, sans ajouter de rôle particulier.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: Même ce qu’ils construisent !
  rationale: גַּם renforce ici la raillerie. La phrase détachée rend le ton méprisant tout en conservant la formulation elliptique de l’hébreu.
- source_word: אִם
  choice: si
  rationale: La particule introduit une condition. Le simple « si » conserve directement la structure et laisse l’ensemble de la phrase porter la force sarcastique.
- source_word: יַעֲלֶה שׁוּעָל
  choice: un renard monte dessus
  rationale: שׁוּעָל désigne normalement le renard, bien qu’il puisse parfois recouvrir un canidé proche. « Dessus » explicite en français l’objet implicite, à savoir le mur.
- source_word: וּפָרַץ
  choice: il ouvrira une brèche
  rationale: פרץ évoque l’action de faire une brèche ou de rompre une défense. Le sujet grammatical reste le renard, ce qui préserve l’image moqueuse de la fragilité du mur.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: leur mur de pierres
  rationale: Cette formulation suit de près le groupe construit hébreu, littéralement « le mur de leurs pierres », tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le nom « Tobiya » suit de près la forme hébraïque. La ponctuation met en relief la raillerie sans résoudre l’ellipse ni atténuer l’exagération du propos.
