  text: וְ/עַל יָדָ֣/ם הֶחֱזִ֗יק מְרֵמ֤וֹת בֶּן אוּרִיָּה֙ בֶּן הַקּ֔וֹץ וְ/עַל יָדָ֣/ם הֶחֱזִ֔יק מְשֻׁלָּ֥ם בֶּן בֶּרֶכְיָ֖ה בֶּן מְשֵׁיזַבְאֵ֑ל וְ/עַל יָדָ֣/ם הֶֽחֱזִ֔יק צָד֖וֹק בֶּֽן בַּעֲנָֽא־־־ס־־־ס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: fr
  text: À côté d’eux, Merémoth, fils d’Ourie, fils d’Hakkots, effectua des réparations[a]. À côté d’eux, Meshoullam, fils de Bérékia, fils de Meshézabéel, effectua des réparations. À côté d’eux, Tsadok, fils de Baana, effectua des réparations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « répara » ou, plus littéralement, « consolida ». Dans ce chapitre, le verbe hébreu est une formule récurrente qui désigne les travaux de réparation d’une section de la muraille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: À côté d’eux
  rationale: Littéralement « à leur main », cette expression idiomatique indique ici que chaque équipe travaille sur la section voisine de la précédente.
- source_word: הֶחֱזִיק
  choice: effectua des réparations
  rationale: Dans la formule répétée de Néhémie 3, le verbe désigne le fait de consolider ou de réparer une section de la muraille; cette formulation naturelle conserve l’idée de travaux de remise en état.
- source_word: מְרֵמוֹת
  choice: Merémoth
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette notice généalogique, le sens immédiat de filiation est le plus naturel.
- source_word: אוּרִיָּה
  choice: Ourie
  rationale: Forme française traditionnelle et reconnaissable du nom hébreu.
- source_word: הַקּוֹץ
  choice: Hakkots
  rationale: Translittération proche de la forme hébraïque, dont l’article est intégré au nom.
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: Translittération adaptée aux conventions phonétiques du français.
- source_word: בֶּרֶכְיָה
  choice: Bérékia
  rationale: Translittération française claire et proche de l’hébreu.
- source_word: מְשֵׁיזַבְאֵל
  choice: Meshézabéel
  rationale: Translittération française qui rend les principaux éléments consonantiques et vocaliques du nom hébreu.
- source_word: צָדוֹק
  choice: Tsadok
  rationale: Translittération française proche de la prononciation hébraïque.
- source_word: בַּעֲנָא
  choice: Baana
  rationale: Translittération simple et proche de la forme massorétique.
