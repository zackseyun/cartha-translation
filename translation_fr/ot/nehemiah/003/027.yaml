  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/תְּקֹעִ֖ים מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֜גֶד הַ/מִּגְדָּ֤ל הַ/גָּדוֹל֙ הַ/יּוֹצֵ֔א וְ/עַ֖ד חוֹמַ֥ת הָ/עֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: fr
  text: Après lui, les habitants de Tekoa réparèrent une autre section[a], en face de la grande tour en saillie, jusqu’au mur de l’Ophel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une deuxième section ». L’expression hébraïque peut souligner que les habitants de Tekoa réparèrent une portion supplémentaire après celle qui leur avait été attribuée auparavant.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste des travaux de Néhémie 3, l’expression marque la succession des équipes ou des portions de mur; le suffixe masculin singulier renvoie à l’ouvrier mentionné précédemment.
- source_word: הֶחֱזִיקוּ
  choice: réparèrent
  rationale: Bien que le verbe signifie littéralement « fortifier » ou « rendre solide », il sert ici de terme technique pour les travaux de réfection de la muraille.
- source_word: הַתְּקֹעִים
  choice: les habitants de Tekoa
  rationale: Le gentilé désigne les gens originaires de Tekoa; cette formulation est plus immédiatement compréhensible en français courant qu’un gentilé rare.
- source_word: מִדָּה שֵׁנִית
  choice: une autre section
  rationale: L’expression désigne une portion supplémentaire confiée au même groupe, déjà mentionné en Néhémie 3.5. La note conserve la traduction plus littérale possible.
- source_word: מִנֶּגֶד
  choice: en face de
  rationale: La préposition situe les travaux devant ou vis-à-vis du repère architectural.
- source_word: הַמִּגְדָּל הַגָּדוֹל הַיּוֹצֵא
  choice: la grande tour en saillie
  rationale: Le participe « qui sort » décrit vraisemblablement une tour faisant saillie par rapport à l’alignement de la muraille; « en saillie » est précis et naturel en contexte architectural.
- source_word: וְעַד
  choice: jusqu’à
  rationale: L’expression marque le point d’aboutissement de la portion réparée; en français, la coordination peut rester implicite sans perte de sens.
- source_word: חוֹמַת הָעֹפֶל
  choice: le mur de l’Ophel
  rationale: Le nom en construction est rendu directement, tandis qu’Ophel est conservé comme nom propre traditionnel du secteur de Jérusalem.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Habitants de Tekoa » évite un gentilé français peu transparent; « tour en saillie » conserve la précision architecturale du participe hébreu.
