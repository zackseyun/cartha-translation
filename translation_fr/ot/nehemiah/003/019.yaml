id: NEH.3.19
reference: Nehemiah 3:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְחַזֵּ֨ק עַל יָד֜/וֹ עֵ֧זֶר בֶּן יֵשׁ֛וּעַ שַׂ֥ר הַ/מִּצְפָּ֖ה מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֕גֶד עֲלֹ֥ת הַ/נֶּ֖שֶׁק הַ/מִּקְצֹֽעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: fr
  text: À côté de lui, Ézer, fils de Josué et responsable de Mitspa, répara une autre section[a], en face de la montée vers l’arsenal[b], à l’angle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une deuxième section ». L’expression hébraïque peut souligner qu’Ézer répara un tronçon supplémentaire de la muraille.
    reason: lexical_alternative
  - marker: b
    text: Ou « le dépôt d’armes », ou encore « les armes ». L’hébreu désigne probablement ici un lieu associé au stockage des armes.
    reason: lexical_alternative
  - marker: c
    text: Ou « au tournant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: répara
  rationale: Dans la liste des travaux de Néhémie 3, le verbe signifie en contexte remettre en état ou consolider la muraille; « répara » exprime naturellement cette activité.
- source_word: עַל יָדוֹ
  choice: À côté de lui
  rationale: Cette expression récurrente situe chaque équipe par rapport à la précédente dans la succession des travaux.
- source_word: שַׂר הַמִּצְפָּה
  choice: responsable de Mitspa
  rationale: שַׂר désigne ici un dirigeant ou administrateur local. « Responsable » rend la fonction publique sans suggérer un titre monarchique précis.
- source_word: מִדָּה שֵׁנִית
  choice: une autre section
  rationale: L’expression désigne vraisemblablement un tronçon supplémentaire de la muraille; la variante plus littérale « une deuxième section » est signalée en note.
- source_word: מִנֶּגֶד
  choice: en face de
  rationale: La préposition exprime une position faisant face à un point de repère.
- source_word: עֲלֹת
  choice: la montée vers
  rationale: L’infinitif substantivé désigne ici un passage ascendant conduisant au lieu mentionné.
- source_word: הַנֶּשֶׁק
  choice: l’arsenal
  rationale: Le nom peut désigner les armes elles-mêmes, mais le contexte topographique suggère un endroit associé à leur stockage.
- source_word: הַמִּקְצֹעַ
  choice: l’angle
  rationale: Le terme désigne un angle ou un tournant dans le tracé de la muraille; « angle » conserve sa nuance architecturale.
