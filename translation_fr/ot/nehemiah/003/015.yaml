  register: Français international moderne, clair et digne. Les noms propres suivent des formes françaises lisibles; la syntaxe met en valeur l’emphase hébraïque sur l’auteur des travaux. Le singulier verbal du texte reçu est rendu de manière cohérente par Shalloun comme sujet des opérations.
