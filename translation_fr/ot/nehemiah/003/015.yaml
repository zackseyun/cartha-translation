source:
  edition: WLC
  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: fr
  text: Shalloun, fils de Kol-Hozé, responsable du district de Mitspa, répara la porte de la Source. C’est lui qui la reconstruisit, la couvrit d’un toit et en posa les battants, les verrous et les barres. Il répara aussi le mur de la piscine de Shélah[a], près du jardin du roi, jusqu’aux marches qui descendent de la Cité de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « piscine de Siloé », traditionnellement associée à Siloam. Le nom hébreu employé ici est Shélah.
    reason: Le texte porte la forme שֶּׁלַח; la note signale l’appellation traditionnelle plus familière sans la substituer au nom hébreu dans le texte.
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: la porte de la Source
  rationale: עַיִן désigne ici une source d’eau. « Porte de la Source » est naturel en français et conserve le lien topographique avec les installations hydrauliques de Jérusalem.
- source_word: הֶחֱזִיק
  choice: répara
  rationale: Dans Néhémie 3, le verbe désigne couramment la remise en état d’une portion de mur ou d’une porte.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: responsable du district de Mitspa
  rationale: שַׂר désigne un dirigeant ou fonctionnaire et פֶּלֶךְ une circonscription administrative. « Responsable » reste précis sans définir excessivement la fonction.
- source_word: הוּא יִבְנֶנּוּ
  choice: C’est lui qui la reconstruisit
  rationale: La tournure rend l’emphase portée par הוּא et exprime, dans ce contexte de restauration, l’idée de reconstruction.
- source_word: וִיטַלְלֶנּוּ
  choice: la couvrit d’un toit
  rationale: Le verbe évoque la couverture de l’ouvrage. Cette formulation explicite naturellement en français le sens architectural.
- source_word: ויעמידו דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: en posa les battants, les verrous et les barres
  rationale: « Battants » convient aux éléments mobiles d’une porte monumentale; « verrous » et « barres » distinguent les deux types de dispositifs de fermeture mentionnés.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: le mur de la piscine de Shélah
  rationale: בְּרֵכָה signifie « piscine » ou « bassin ». « Shélah » reproduit le nom sous la forme du texte hébreu sans imposer dans le corps du verset son identification traditionnelle.
- source_word: לְגַן הַמֶּלֶךְ
  choice: près du jardin du roi
  rationale: Dans cette description topographique, לְ exprime vraisemblablement la relation spatiale; « près de » demeure naturel tout en évitant une précision excessive.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדוֹת
  choice: jusqu’aux marches qui descendent
  rationale: La traduction conserve la tension littérale entre les « montées/marches » et le participe indiquant qu’elles descendent, tout en produisant un français clair.
- source_word: מֵעִיר דָּוִיד
  choice: de la Cité de David
  rationale: מִן marque ici le point d’origine des marches; « de » restitue simplement cette relation.
theological_decisions: []
