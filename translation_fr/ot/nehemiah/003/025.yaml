revisions:
- from: Palal, fils d’Ouzaï, répara en face de l’angle[a] et de la tour qui fait saillie depuis la maison haute du roi[b], près de la cour de la garde[c]. Après lui, Pedaya, fils de Parosh, répara.
  to: Palal, fils d’Ouzaï, répara en face de l’angle[a] et de la tour qui fait saillie de la maison supérieure du roi[b], située près de la cour de la garde[c]. Après lui, Pedaya, fils de Parosh, répara.
  rationale: La révision corrige le sens de « supérieure » et rend explicite, conformément à la syntaxe hébraïque la plus probable et à l’audit anglais, que la maison royale est située près de la cour de la garde. Elle ne transforme pas la maison en palais dans le texte principal et préserve cette possibilité en note.
