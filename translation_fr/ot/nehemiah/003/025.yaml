  text: פָּלָ֣ל בֶּן אוּזַי֮ מִ/נֶּ֣גֶד הַ/מִּקְצוֹעַ֒ וְ/הַ/מִּגְדָּ֗ל הַ/יּוֹצֵא֙ מִ/בֵּ֤ית הַ/מֶּ֨לֶךְ֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר לַ/חֲצַ֣ר הַ/מַּטָּרָ֑ה אַחֲרָ֖י/ו פְּדָיָ֥ה בֶן פַּרְעֹֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: fr
  text: Palal, fils d’Ouzaï, répara en face de l’angle[a] et de la tour qui fait saillie de la maison supérieure du roi[b], située près de la cour de la garde[c]. Après lui, Pedaya, fils de Parosh, répara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du coin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du palais supérieur ». L’hébreu dit littéralement « de la maison supérieure du roi ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de la cour de la prison ». Le terme désigne probablement une cour surveillée servant à la détention.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: en face de
  rationale: Cette expression conserve le rapport spatial avec les repères architecturaux sans préciser une distance que l’hébreu ne donne pas.
- source_word: הַמִּקְצוֹעַ
  choice: l’angle
  rationale: Le nom désigne l’angle ou le coin formé par un mur ou un bâtiment. « Angle » convient au contexte architectural, tandis que « coin » reste possible en note.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: la tour qui fait saillie
  rationale: Le participe de יצא décrit ici une tour qui avance hors de l’alignement de l’ensemble architectural. Cette formulation est naturelle et précise en français.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: depuis la maison haute du roi
  rationale: La traduction garde les éléments du texte hébreu et leur ambiguïté architecturale. « Palais supérieur » serait plus fluide, mais interprète בית comme un palais.
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: près de la cour de la garde
  rationale: Dans ce contexte, מטרה évoque une cour surveillée, possiblement destinée à la détention. « Garde » évite d’imposer la nuance pénale plus forte de « prison ».
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Cette formule introduit le réparateur suivant dans la succession des travaux décrits au chapitre 3.
- source_word: פָּלָל / אוּזַי / פְּדָיָה / פַּרְעֹשׁ
  choice: Palal / Ouzaï / Pedaya / Parosh
  rationale: Les noms propres sont translittérés sous une forme lisible en français moderne.
- source_word: '[verbe sous-entendu avec פָּלָל et פְּדָיָה בֶן־פַּרְעֹשׁ]'
  choice: répara
  rationale: L’hébreu omet ici le verbe, qui se déduit de la structure répétitive de Néhémie 3. Il est nécessaire de le rétablir en français pour former des propositions complètes.
