  text: וַ/יֹּ֣אמֶר לִ/פְנֵ֣י אֶחָ֗י/ו וְ/חֵיל֙ שֹֽׁמְר֔וֹן וַ/יֹּ֕אמֶר מָ֛ה הַ/יְּהוּדִ֥ים הָ/אֲמֵלָלִ֖ים עֹשִׂ֑ים הֲ/יַעַזְב֨וּ לָ/הֶ֤ם הֲ/יִזְבָּ֨חוּ֙ הַ/יְכַלּ֣וּ בַ/יּ֔וֹם הַ/יְחַיּ֧וּ אֶת הָ/אֲבָנִ֛ים מֵ/עֲרֵמ֥וֹת הֶ/עָפָ֖ר וְ/הֵ֥מָּה שְׂרוּפֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: fr
  text: 'Il parla devant ses frères et l’armée de Samarie. Il dit : « Que font ces misérables Juifs ? Vont-ils restaurer la muraille par eux-mêmes[a] ? Vont-ils offrir des sacrifices ? Vont-ils tout achever en un jour ? Vont-ils redonner vie à ces pierres tirées de monceaux de poussière, alors qu’elles ont été brûlées ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. On peut aussi comprendre : « Vont-ils reconstruire par leurs propres moyens ? », ou, plus littéralement, selon une autre analyse : « Vont-ils les abandonner à eux-mêmes ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: devant ses frères
  rationale: לִפְנֵי indique qu’il parle en leur présence. « Ses frères » conserve le sens littéral de אֶחָיו, tout en pouvant désigner ici ses proches collaborateurs.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: et l’armée de Samarie
  rationale: חֵיל désigne ici une force militaire ; « l’armée » est clair et naturel en français moderne.
- source_word: הָאֲמֵלָלִים
  choice: ces misérables
  rationale: Le terme est méprisant et présente les Juifs comme faibles et pitoyables. « Misérables » restitue bien l’insulte dans ce contexte de moquerie.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: Vont-ils restaurer la muraille par eux-mêmes ?
  rationale: 'L’expression est difficile : עזב signifie normalement « laisser, abandonner », mais le contexte suggère une raillerie visant leur prétention à restaurer la muraille eux-mêmes. Le complément explicite « la muraille » est fourni par le contexte immédiat.'
- source_word: הֲיִזְבָּחוּ
  choice: Vont-ils offrir des sacrifices ?
  rationale: זבח désigne l’action d’offrir un sacrifice. Cette formulation est idiomatique et garde la succession rapide des questions moqueuses.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: Vont-ils tout achever en un jour ?
  rationale: כלה au piel signifie « achever, terminer ». « Tout » rend naturel en français l’objet sous-entendu sans en modifier le sens.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: Vont-ils redonner vie à ces pierres
  rationale: Le causatif de חיה signifie littéralement « faire vivre, ranimer ». « Redonner vie » préserve la personnification ironique des pierres.
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: tirées de monceaux de poussière
  rationale: עֲרֵמוֹת désigne des tas ou monceaux, et עָפָר la poussière ou la terre meuble. La traduction conserve l’image concrète sans remplacer celle-ci par l’interprétation « décombres ».
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: alors qu’elles ont été brûlées
  rationale: La proposition souligne l’état des pierres et renforce la raillerie. « Alors que » exprime naturellement la valeur adversative implicite.
