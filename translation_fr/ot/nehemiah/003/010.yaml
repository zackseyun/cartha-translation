  text: וְ/עַל יָדָ֧/ם הֶחֱזִ֛יק יְדָיָ֥ה בֶן חֲרוּמַ֖ף וְ/נֶ֣גֶד בֵּית֑/וֹ וְ/עַל יָד֣/וֹ הֶחֱזִ֔יק חַטּ֖וּשׁ בֶּן חֲשַׁבְנְיָֽה־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/010.yaml
  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: fr
  text: À côté d’eux, Yedaïa, fils de Haroumaf, fit des réparations en face de sa maison[a] ; et à côté de lui, Hattoush, fils de Hashabnia, fit des réparations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant sa maison ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: À côté d’eux
  rationale: Dans la liste des travaux de Néhémie 3, l’expression עַל יָד indique que l’équipe suivante travaille sur une section adjacente. Cette formulation française est naturelle et conserve la progression topographique.
- source_word: הֶחֱזִיק
  choice: fit des réparations
  rationale: Dans ce chapitre, le hifil de חזק fonctionne comme une expression technique désignant la participation aux travaux de réfection de la muraille. « Fit des réparations » rend clairement ce sens tout en maintenant la formule répétée.
- source_word: יְדָיָה
  choice: Yedaïa
  rationale: Transcription française moderne du nom hébreu, avec tréma pour guider la prononciation des voyelles distinctes.
- source_word: בֶן חֲרוּמַף
  choice: fils de Haroumaf
  rationale: La construction généalogique est rendue directement et le nom propre est transcrit selon les usages phonétiques du français.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: en face de sa maison
  rationale: נֶגֶד exprime une relation spatiale pouvant signifier « devant » ou « en face de ». La formulation retenue est naturelle en français sans effacer l’autre possibilité, signalée en note.
- source_word: וְעַל יָדוֹ
  choice: et à côté de lui
  rationale: La même expression d’adjacence réapparaît avec un suffixe singulier renvoyant à Yedaïa. La répétition française préserve la structure du texte.
- source_word: חַטּוּשׁ
  choice: Hattoush
  rationale: Transcription française du nom hébreu חַטּוּשׁ.
- source_word: בֶן חֲשַׁבְנְיָה
  choice: fils de Hashabnia
  rationale: La relation filiale est rendue littéralement et le nom propre est transcrit en français.
