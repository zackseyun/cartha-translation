source:
  edition: WLC
  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: fr
  text: Après lui, Sadoc, fils d’Immer, répara la partie située en face de sa maison[a]. Après lui, Shemaïa, fils de Shekania, gardien de la porte de l’Est[b], fit des réparations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant sa maison ».
    reason: lexical_alternative
  - marker: b
    text: Ou « responsable de la porte de l’Est ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste de Néhémie 3, cette formule indique la succession des équipes et probablement aussi leur proximité le long de la muraille.
- source_word: הֶחֱזִיק
  choice: répara / fit des réparations
  rationale: Le hiphil de חזק signifie littéralement « rendre fort », mais désigne ici, de façon idiomatique, des travaux de remise en état. La variation française évite une répétition lourde sans changer le sens.
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: Sadoc, fils d’Immer
  rationale: Les noms propres sont rendus selon leurs formes françaises bibliques usuelles, et la filiation hébraïque est conservée.
- source_word: נֶגֶד בֵּיתוֹ
  choice: la partie située en face de sa maison
  rationale: נֶגֶד exprime la position « devant » ou « en face de ». L’ajout explicatif de « la partie située » rend naturel en français l’objet sous-entendu des travaux.
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: Shemaïa, fils de Shekania
  rationale: Translittération française claire des noms propres, avec conservation de la formule de filiation.
- source_word: שֹׁמֵר
  choice: gardien
  rationale: Le participe désigne la fonction de Shemaïa; « gardien » convient naturellement à la surveillance ou à la responsabilité d’une porte.
- source_word: שַׁעַר הַמִּזְרָח
  choice: la porte de l’Est
  rationale: L’expression désigne une porte précise caractérisée par son orientation; la majuscule marque son emploi comme nom de porte.
theological_decisions: []
