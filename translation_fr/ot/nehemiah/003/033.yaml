  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר שָׁמַ֣ע סַנְבַלַּ֗ט כִּֽי אֲנַ֤חְנוּ בוֹנִים֙ אֶת הַ֣/חוֹמָ֔ה וַ/יִּ֣חַר ל֔/וֹ וַ/יִּכְעַ֖ס הַרְבֵּ֑ה וַ/יַּלְעֵ֖ג עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: fr
  text: Lorsque Sanballat apprit que nous reconstruisions la muraille, il se mit en colère, entra dans une violente fureur et se moqua des Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Judéens ». Le terme hébreu peut désigner les habitants de Juda aussi bien que les Juifs dans un sens plus large.'
    reason: Alternative lexicale préservant la portée régionale possible de יְהוּדִים.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La formule narrative introduit ici un nouveau développement. « Lorsque » restitue naturellement le rapport temporel sans ajouter un adverbe absent de l’hébreu.
- source_word: שָׁמַע
  choice: apprit
  rationale: Le verbe signifie littéralement « entendre », mais désigne ici la réception d’une nouvelle ; « apprit » est idiomatique et précis en français.
- source_word: סַנְבַלַּט
  choice: Sanballat
  rationale: Le nom propre est translittéré selon la forme française usuelle.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: que nous reconstruisions
  rationale: Le participe exprime une action en cours. Le contexte montre qu’il s’agit de restaurer la muraille endommagée de Jérusalem, d’où « reconstruisions » plutôt que le plus général « construisions ».
- source_word: הַחוֹמָה
  choice: la muraille
  rationale: Dans ce contexte, חוֹמָה désigne l’enceinte fortifiée de Jérusalem ; « muraille » est plus précis que « mur » en français.
- source_word: וַיִּחַר לוֹ
  choice: il se mit en colère
  rationale: L’expression idiomatique évoque littéralement une colère qui brûle. Cette formulation en communique clairement le sens.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: entra dans une violente fureur
  rationale: Le second terme de colère intensifie le premier. Cette formulation conserve l’escalade sans répéter simplement « colère ».
- source_word: וַיַּלְעֵג
  choice: se moqua
  rationale: Le verbe exprime la dérision et le mépris ; « se moqua » est naturel, clair et suffisamment fort.
- source_word: עַל הַיְּהוּדִים
  choice: des Juifs
  rationale: יְהוּדִים peut désigner les Juifs au sens large ou les Judéens au sens régional. « Juifs » est la désignation française la plus reconnaissable ici, tandis que l’autre nuance est signalée en note.
