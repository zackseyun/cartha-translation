source:
  edition: WLC
  text: אחר/י הֶחֱזִ֜יק חֲנַנְיָ֣ה בֶן שֶׁלֶמְיָ֗ה וְ/חָנ֧וּן בֶּן צָלָ֛ף הַ/שִּׁשִּׁ֖י מִדָּ֣ה שֵׁנִ֑י אַחֲרָ֣י/ו הֶחֱזִ֗יק מְשֻׁלָּם֙ בֶּן בֶּ֣רֶכְיָ֔ה נֶ֖גֶד נִשְׁכָּתֽ/וֹ־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: fr
  text: Après lui, Hanania, fils de Shélémia, et Hanoun, le sixième fils de Tsalaf, réparèrent une autre section[a]. Après lui, Meshoullam, fils de Bérékia, répara la partie située en face de sa chambre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une seconde mesure ». Dans Néhémie 3, cette expression désigne une section supplémentaire à réparer. Le texte hébreu porte d''abord « après moi », mais la formule répétée dans le chapitre est traditionnellement comprise ici au sens de « après lui ».'
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste des travaux, cette formule récurrente indique la succession ou la proximité des équipes. Le premier אַחֲרַי a la forme « après moi », mais le contexte et la formule parallèle qui suit favorisent le sens traditionnel « après lui » ; l'écart textuel est signalé en note.
- source_word: הֶחֱזִיק
  choice: répara / réparèrent
  rationale: Dans Néhémie 3, le verbe désigne les travaux de remise en état de la muraille ; « réparer » est naturel et précis en français.
- source_word: הַשִּׁשִּׁי
  choice: le sixième fils
  rationale: L'ordinal qualifie vraisemblablement Hanoun dans la descendance de Tsalaf. « fils » est explicité en français pour rendre compréhensible l'ellipse hébraïque.
- source_word: מִדָּה שֵׁנִי
  choice: une autre section
  rationale: Littéralement « une seconde mesure », l'expression désigne ici une portion supplémentaire de la muraille confiée aux réparateurs.
- source_word: נֶגֶד
  choice: en face de
  rationale: La préposition situe les travaux devant ou vis-à-vis du point de référence.
- source_word: נִשְׁכָּתוֹ
  choice: sa chambre
  rationale: Le nom désigne une pièce ou chambre, sans permettre d'en préciser sûrement la fonction.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: Hanania / Shélémia / Hanoun / Tsalaf / Meshoullam / Bérékia
  rationale: Les noms propres sont translittérés sous des formes lisibles en français moderne, sans les traduire.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe répétitive de la liste est conservée. « La partie située » est ajouté pour rendre explicite l'objet sous-entendu du second « répara ». Tous les marqueurs de note présents dans le texte correspondent aux notes fournies.
