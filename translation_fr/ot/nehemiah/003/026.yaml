  text: וְ/הַ֨/נְּתִינִ֔ים הָי֥וּ יֹשְׁבִ֖ים בָּ/עֹ֑פֶל עַ֠ד נֶ֜גֶד שַׁ֤עַר הַ/מַּ֨יִם֙ לַ/מִּזְרָ֔ח וְ/הַ/מִּגְדָּ֖ל הַ/יּוֹצֵֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/026.yaml
  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: fr
  text: Les serviteurs du Temple[a] habitaient sur l’Ophel, jusqu’en face de la porte des Eaux, à l’est, et de la tour en saillie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Netinim, catégorie reconnue de serviteurs affectés au service du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: Le terme désigne une catégorie reconnue de personnel affecté au service du Temple, traditionnellement appelée les Netinim. La traduction fonctionnelle est immédiatement compréhensible en français moderne.
- source_word: הָיוּ יֹשְׁבִים
  choice: habitaient
  rationale: La construction avec היה et le participe exprime ici une résidence durable. L’imparfait français rend naturellement cet état continu.
- source_word: בָּעֹפֶל
  choice: sur l’Ofel
  rationale: עֹפֶל désigne ici le secteur élevé et fortifié de Jérusalem. Le nom propre est translittéré, et « sur » convient à sa réalité topographique.
- source_word: עַד נֶגֶד
  choice: jusqu’en face de
  rationale: Cette expression indique à la fois l’étendue jusqu’à une limite et la position vis-à-vis d’un repère.
- source_word: שַׁעַר הַמַּיִם
  choice: la porte des Eaux
  rationale: Cette traduction naturelle du groupe construit conserve le nom traditionnel de cette porte de Jérusalem.
- source_word: לַמִּזְרָח
  choice: du côté de l’est
  rationale: La formulation exprime l’orientation ou la localisation orientale sans imposer une précision absente de l’hébreu.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: la tour en saillie
  rationale: Dans ce contexte architectural, le participe décrit une tour qui avance ou dépasse par rapport à l’alignement du mur.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le nom topographique « Ofel » est conservé, tandis que le titre fonctionnel des Netinim est traduit pour rester accessible. La coordination finale suit de près la structure spatiale de l’hébreu sans en lever artificiellement toutes les ambiguïtés.
