base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: fr
  text: À côté de lui, Ouzziel, fils de Harhaya, l’un des orfèvres, fit des réparations. À côté de lui, Hanania, fils des parfumeurs, fit des réparations. Ils remirent Jérusalem en état[a] jusqu’à la Muraille large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Ils laissèrent Jérusalem jusqu’à la Muraille large. » Le verbe hébreu signifie habituellement « laisser », mais, dans ce contexte de reconstruction, il est couramment compris au sens de « remettre en état » ou « réparer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: À côté de lui
  rationale: Dans la liste des travaux de Néhémie 3, cette expression situe chaque équipe par rapport à la précédente. Cette formulation française est naturelle et conserve le sens spatial.
- source_word: הֶחֱזִיק
  choice: fit des réparations
  rationale: Le verbe signifie fondamentalement « rendre fort » ou « fortifier », mais il désigne ici la participation aux travaux de remise en état de la muraille.
- source_word: צֹרְפִים
  choice: l’un des orfèvres
  rationale: Le pluriel désigne ici le groupe professionnel auquel appartenait Ouzziel. « Orfèvres » convient à des artisans travaillant et affinant les métaux précieux.
- source_word: בֶן הָרַקָּחִים
  choice: l’un des parfumeurs
  rationale: L’expression, littéralement « fils des parfumeurs », marque vraisemblablement l’appartenance de Hanania au corps de métier des fabricants de parfums et d’onguents. La formulation retenue est claire en français moderne.
- source_word: וַיַּעַזְבוּ
  choice: Ils remirent … en état
  rationale: Même si le verbe signifie habituellement « laisser » ou « abandonner », le contexte des travaux permet de comprendre ici une remise en état. La note conserve l’autre lecture possible.
- source_word: יְרוּשָׁלַםִ
  choice: Jérusalem
  rationale: Le texte nomme la ville, probablement par métonymie pour ses fortifications; la traduction n’ajoute donc pas « la muraille de » dans le corps du verset.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: jusqu’à la Muraille Large
  rationale: L’expression paraît désigner un élément connu des fortifications de Jérusalem. Les majuscules signalent qu’il s’agit d’un nom topographique.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. Les noms propres suivent des translittérations françaises lisibles. La répétition « À côté de lui … fit des réparations » reproduit la structure séquentielle du chapitre, tandis que la note maintient l’ambiguïté réelle du dernier verbe.
