  yaml_path: translation/ot/nehemiah/003/022.yaml
  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: fr
  text: Après lui, les prêtres, les hommes de la plaine[a], réparèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du district ». Le mot hébreu peut désigner une plaine ou une région de forme circulaire; le lieu précis visé ici reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Après lui
  rationale: Rend naturellement la succession des équipes dans la liste, sans qu’il soit nécessaire d’expliciter le וְ initial en français.
- source_word: הֶחֱזִיקוּ
  choice: firent des réparations
  rationale: Dans Néhémie 3, le verbe désigne idiomatiquement la participation aux travaux de réfection de la muraille; cette formulation convient mieux au contexte que le sens littéral « saisir » ou « fortifier ».
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent direct du nom défini au pluriel.
- source_word: אַנְשֵׁי
  choice: les hommes de
  rationale: Conserve la valeur masculine plurielle et la construction d’appartenance du texte hébreu.
- source_word: הַכִּכָּר
  choice: la Plaine
  rationale: כִּכָּר peut désigner une plaine ou une région de forme circulaire. « La Plaine » conserve le sens géographique le plus direct tout en laissant la note signaler l’incertitude sur le lieu précis.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La majuscule à « Plaine » indique qu’il s’agit vraisemblablement d’une désignation géographique.
