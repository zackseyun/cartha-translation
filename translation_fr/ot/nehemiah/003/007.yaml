  text: וְ/עַל יָדָ֨/ם הֶחֱזִ֜יק מְלַטְיָ֣ה הַ/גִּבְעֹנִ֗י וְ/יָדוֹן֙ הַ/מֵּרֹ֣נֹתִ֔י אַנְשֵׁ֥י גִבְע֖וֹן וְ/הַ/מִּצְפָּ֑ה לְ/כִסֵּ֕א פַּחַ֖ת עֵ֥בֶר הַ/נָּהָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: fr
  text: À côté d’eux, Melatia le Gabaonite et Yadôn le Méronotite réparèrent, avec les hommes de Gabaon et de Mitspa, en rapport avec le siège du gouverneur de la province de l’Au-delà-du-Fleuve[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour le siège du gouverneur d’Au-delà-du-Fleuve ». L’expression peut désigner le siège ou la résidence officielle du gouverneur, indiquer que ces hommes relevaient de son autorité administrative ou, moins probablement, marquer la limite jusqu’à laquelle ils travaillèrent.'
    reason: Ambiguïté lexicale et syntaxique de לְכִסֵּא.
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: À côté d’eux
  rationale: Dans la liste des travaux de Néhémie 3, l’expression idiomatique indique que l’équipe suivante travaillait dans le secteur adjacent.
- source_word: הֶחֱזִיק
  choice: effectuèrent les réparations
  rationale: Dans ce contexte de reconstruction, le verbe désigne la participation aux travaux de remise en état; cette formulation est naturelle en français tout en conservant le sens contextuel.
- source_word: מְלַטְיָה
  choice: Melatia
  rationale: Translittération française du nom propre hébreu.
- source_word: הַגִּבְעֹנִי
  choice: le Gabaonite
  rationale: Le gentilé hébreu désigne l’origine géographique de Melatia; «Gabaonite» est la forme française usuelle.
- source_word: יָדוֹן
  choice: Yadôn
  rationale: Translittération du nom propre hébreu, avec maintien de la consonne initiale yod.
- source_word: הַמֵּרֹנֹתִי
  choice: le Méronotite
  rationale: Le terme est rendu comme un gentilé, parallèlement à «le Gabaonite».
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: avec les hommes de Gabaon et de Mitspa
  rationale: אַנְשֵׁי suivi des noms de lieux désigne les hommes appartenant à ces localités; «avec» les associe naturellement aux deux responsables nommés.
- source_word: לְכִסֵּא
  choice: pour le siège de
  rationale: כִּסֵּא signifie littéralement «siège» ou «trône». Dans ce cadre administratif, «siège» convient mieux que «trône». La préposition לְ est rendue sans imposer une portée spatiale absente du texte, tandis qu’une note conserve l’incertitude syntaxique et institutionnelle.
- source_word: פַּחַת
  choice: du gouverneur de
  rationale: Ce titre administratif de l’époque perse trouve son équivalent moderne le plus clair dans «gouverneur».
- source_word: עֵבֶר הַנָּהָר
  choice: la province d’Au-delà-du-Fleuve
  rationale: L’expression est le nom administratif perse de la région située à l’ouest de l’Euphrate. «Province» explicite le statut régional, et les majuscules signalent un nom officiel.
theological_decisions:
- issue: Rapport syntaxique de לְכִסֵּא avec les travailleurs et les réparations
  choice: «pour le siège du gouverneur» dans le texte, avec explicitation de l’ambiguïté en note
  alternative: «qui relevaient de l’autorité du gouverneur» ou «jusqu’au siège du gouverneur»
  rationale: L’hébreu ne détermine pas sans ambiguïté si l’expression indique le bénéficiaire des travaux, le rattachement administratif des hommes ou, moins probablement, une limite spatiale. Le texte principal reste proche de la construction source et la note évite de résoudre silencieusement la difficulté.
translation_notes:
  register: Français international moderne, clair et digne. Les noms sont translittérés ou rendus selon des formes françaises reconnaissables. La formulation administrative évite le terme royal «trône», peu probable ici, sans effacer le sens littéral de «siège».
