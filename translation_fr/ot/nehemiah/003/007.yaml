  rationale: La révision allège le verbe de construction et rend plus naturel le nom administratif. Surtout, elle ne fait pas de « siège » le bénéficiaire incontestable des réparations, tout en maintenant le terme concret du texte source et l’ambiguïté dans une note ancrée.
