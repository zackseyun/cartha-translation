  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: fr
  text: Les descendants de Senaa construisirent la porte des Poissons. Ils la couvrirent[a] et mirent en place ses battants, ses verrous et ses barres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « y posèrent les poutres ». Le verbe hébreu peut désigner la couverture d’une structure dans un contexte de construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: la porte des Poissons
  rationale: Le syntagme construit désigne une porte précise de Jérusalem associée aux poissons; cette formulation est naturelle en français pour un nom de porte.
- source_word: בָּנוּ
  choice: construisirent
  rationale: Le verbe בנה signifie normalement « construire ». Même si le chapitre décrit une restauration, le texte emploie ici le verbe général plutôt qu’un terme précis pour « réparer ».
- source_word: בְּנֵי הַסְּנָאָה
  choice: Les descendants de Senaa
  rationale: בני peut désigner les fils au sens propre ou les membres d’une famille ou d’un clan. Dans cette liste de travailleurs, « descendants » exprime naturellement le groupe familial sans imposer une filiation immédiate. Le ה initial est l’article attaché au nom dans le syntagme et n’a pas à être intégré à la translittération française.
- source_word: הֵמָּה
  choice: Ils
  rationale: Le pronom indépendant reprend le groupe déjà nommé. En français, ajouter « eux-mêmes » produirait ici une insistance plus forte que ne l’exige le contexte; le sujet explicite rend la reprise naturellement.
- source_word: קֵרוּהוּ
  choice: la couvrirent d’une charpente
  rationale: Dans un contexte de construction, קרה évoque le fait de couvrir une structure au moyen de poutres ou d’une toiture. La formulation conserve cette image architecturale sans affirmer plus précisément qu’un toit complet fut posé.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: mirent en place ses battants
  rationale: L’expression signifie littéralement faire tenir les portes. « Mettre en place » rend leur installation, et « battants » convient aux éléments mobiles d’une porte monumentale.
- source_word: מַנְעוּלָיו
  choice: ses verrous
  rationale: Dans ce contexte architectural, le terme désigne les dispositifs de fermeture; « verrous » convient à son association avec les barres.
- source_word: וּבְרִיחָיו
  choice: et ses barres
  rationale: בריח désigne une barre servant à fermer ou consolider une porte; « barres » est direct et distinct de « verrous ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient à la narration historique. « Descendants » rend explicitement la valeur familiale ou clanique probable de בני; « battants » évite l’ambiguïté de « portes » après le nom de la porte monumentale.
