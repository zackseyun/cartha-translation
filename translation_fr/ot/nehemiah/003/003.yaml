    issue: « d’une charpente » sur-spécifie le sens de קֵרוּהוּ.
    rationale: Le verbe hébreu indique qu’ils couvrirent/toiturèrent la porte; il peut évoquer une couverture faite de poutres, mais le texte ne nomme pas explicitement une charpente. Cette précision doit être retirée du texte et, au besoin, conservée comme possibilité en note.
  - severity: low
    issue: La note actuelle donne « la couvrirent » comme alternative alors que le texte emploie déjà « la couvrirent d’une charpente ».
    rationale: La note est moins claire parce qu’elle ne distingue pas nettement la traduction retenue de l’alternative. Une note limitée à « y posèrent les poutres » rend l’autre possibilité sans redondance.
