  rationale: La révision supprime l’ajout interprétatif « d’une charpente » afin de rendre le verbe hébreu avec la latitude qu’il possède dans ce contexte architectural. La note conserve l’alternative fondée sur une couverture réalisée par des poutres. Les autres choix sont maintenus.
