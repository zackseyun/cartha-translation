  text: מִדָּ֣ה שֵׁנִ֗ית הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן חָרִ֔ם וְ/חַשּׁ֖וּב בֶּן פַּחַ֣ת מוֹאָ֑ב וְ/אֵ֖ת מִגְדַּ֥ל הַ/תַּנּוּרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: fr
  text: Malkiya, fils de Harim, et Hashoub, fils de Pahath-Moab, réparèrent une autre section[a], ainsi que la tour des fours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une deuxième section ». L’expression hébraïque peut se traduire plus littéralement ainsi ; dans ce contexte, elle désigne une portion supplémentaire à réparer.
    reason: lexical_alternative
  - marker: b
    text: Ou « la tour des fourneaux ». Le terme hébreu peut désigner des fours ou des fourneaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: une autre section
  rationale: Dans le contexte des travaux décrits en Néhémie 3, l’expression désigne naturellement une portion supplémentaire de la muraille confiée à la réparation. Cette formulation française conserve l’idée d’une section distincte sans imposer un ordre numérique strict.
- source_word: הֶחֱזִיק
  choice: réparèrent
  rationale: Dans le contexte de la reconstruction de la muraille, le verbe signifie remettre en état ou consolider. « Réparèrent » est ici le terme français le plus clair et naturel.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Translittération française transparente du nom hébreu.
- source_word: בֶן חָרִם
  choice: fils de Harim
  rationale: Rendu direct et naturel de la construction filiale hébraïque.
- source_word: וְחַשּׁוּב
  choice: et Hashoub
  rationale: La conjonction est conservée et le nom propre est translittéré selon une graphie lisible en français.
- source_word: בֶּן פַּחַת מוֹאָב
  choice: fils de Pahath-Moab
  rationale: Le nom familial composé est conservé par translittération, avec un trait d’union.
- source_word: וְאֵת
  choice: ainsi que
  rationale: Cette formulation marque naturellement en français l’ajout de la tour à la section de muraille réparée.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: la tour des Fours
  rationale: Le rendu conserve l’image concrète et la forme d’un nom de lieu. Le terme hébreu peut désigner des fours domestiques ou des fourneaux.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Les noms sont translittérés de manière lisible pour un public francophone, et les ambiguïtés lexicales réelles sont conservées en notes.
