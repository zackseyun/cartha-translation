  text: אחרי הֶחֱזִ֗יק מַלְכִּיָּה֙ בֶּן הַ/צֹּ֣רְפִ֔י עַד בֵּ֥ית הַ/נְּתִינִ֖ים וְ/הָ/רֹכְלִ֑ים נֶ֚גֶד שַׁ֣עַר הַ/מִּפְקָ֔ד וְ/עַ֖ד עֲלִיַּ֥ת הַ/פִּנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: fr
  text: Après lui, Malkiya, fils de l’orfèvre, répara jusqu’à la maison des serviteurs du Temple et des marchands, en face de la porte de l’Inspection, et jusqu’à la chambre haute de l’angle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Translittération française proche de la forme hébraïque du nom propre.
- source_word: בֶּן הַצֹּרְפִי
  choice: fils de l’orfèvre
  rationale: הַצֹּרְפִי désigne un artisan qui affine ou travaille les métaux précieux; « orfèvre » convient au contexte et à la tradition lexicale du passage.
- source_word: בֵּית הַנְּתִינִים
  choice: la maison des serviteurs du Temple
  rationale: Les נְתִינִים formaient un groupe affecté au service du sanctuaire; cette formulation rend leur fonction de manière immédiatement compréhensible.
- source_word: הָרֹכְלִים
  choice: des marchands
  rationale: Le terme désigne des commerçants, souvent itinérants; « marchands » est naturel et suffisamment précis.
- source_word: שַׁעַר הַמִּפְקָד
  choice: la porte de l’Inspection
  rationale: מִפְקָד peut évoquer l’inspection, le recensement ou le rassemblement; la majuscule indique ici un nom de porte sans supprimer l’incertitude historique sur sa fonction.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: la chambre haute de l’angle
  rationale: עֲלִיָּה désigne une pièce ou chambre située en hauteur, et הַפִּנָּה l’angle ou le coin de la muraille.
theological_decisions: []
