base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: fr
  text: Hanoun et les habitants de Zanoah réparèrent la porte de la Vallée[a]. Ils la bâtirent et en installèrent les battants, les verrous et les barres, et réparèrent mille coudées de mur[b], jusqu’à la porte du Fumier[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « renforcèrent » la porte de la Vallée ; dans ce chapitre consacré à la reconstruction, le verbe hébreu peut signifier rendre solide ou réparer.
    reason: lexical_alternative
  - marker: b
    text: Mille coudées correspondent à environ 457 mètres.
    reason: cultural_note
  - marker: c
    text: Ou « porte des Déchets ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: réparèrent
  rationale: Dans le contexte de la reconstruction en Néhémie 3, le verbe désigne la remise en état ou l’affermissement d’un ouvrage. « Réparèrent » exprime naturellement l’action sans effacer le sens possible de « renforcèrent », signalé en note.
- source_word: שַׁעַר הַגַּיְא
  choice: la porte de la Vallée
  rationale: Le groupe construit nomme une porte de la ville. Cette formulation française est claire et conserve le lien explicite avec la vallée.
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: les habitants de Zanoa
  rationale: Le participe substantivé désigne les personnes qui résident dans cette localité. « Habitants » est concis et idiomatique.
- source_word: הֵמָּה בָנוּהוּ
  choice: Ils la bâtirent
  rationale: Le verbe signifie explicitement « bâtir ». Le pronom sujet reprend naturellement Hanoun et les habitants de Zanoa; le contexte permet de comprendre qu’il s’agit d’une reconstruction sans devoir l’ajouter au verbe.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: en posèrent les battants
  rationale: Le verbe signifie faire tenir debout ou mettre en place. Pour une porte monumentale, « poser les battants » rend précisément et naturellement l’installation de ses panneaux.
- source_word: מַנְעֻלָיו וּבְרִיחָיו
  choice: les verrous et les barres
  rationale: Ces deux termes désignent les dispositifs servant à fermer et consolider la porte. La traduction maintient leur distinction sans introduire l’idée moderne d’une serrure à clé.
- source_word: אֶלֶף אַמָּה בַּחוֹמָה
  choice: mille coudées de mur
  rationale: La mesure ancienne est conservée dans le texte, tandis qu’une équivalence moderne approximative est fournie en note. « De mur » exprime naturellement la longueur du tronçon réparé.
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: la porte du Fumier
  rationale: Le nom est traditionnellement compris comme désignant la porte par laquelle on évacuait le fumier ou les détritus. La traduction directe conserve la forme concrète du toponyme, avec une autre possibilité en note.
