source:
  edition: WLC
  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/לְוִיִּ֖ם רְח֣וּם בֶּן בָּנִ֑י עַל יָד֣/וֹ הֶחֱזִ֗יק חֲשַׁבְיָ֛ה שַׂר חֲצִי פֶ֥לֶךְ קְעִילָ֖ה לְ/פִלְכּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: fr
  text: 'Après lui, les Lévites firent les réparations : Rehoum, fils de Bani. À côté de lui, Hashabia, chef de la moitié du district de Qeïla, fit les réparations pour son district[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la section qui lui était attribuée ». L’hébreu peut désigner soit le district placé sous l’autorité de Hashabia, soit la portion de muraille dont il avait la responsabilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste des bâtisseurs, cette expression situe le groupe suivant par rapport à celui qui précède, avec une nuance à la fois spatiale et séquentielle.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: effectuèrent les réparations / effectua les réparations
  rationale: Le hiphil de חזק signifie littéralement « rendre fort », mais fonctionne dans Néhémie 3 comme une formule désignant les travaux de réfection de la muraille.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française usuelle des membres de ce groupe, sans explicitation interprétative.
- source_word: רְחוּם בֶּן־בָּנִי
  choice: Rehoum, fils de Bani
  rationale: Transcription française courante des noms, avec maintien de la filiation.
- source_word: עַל יָדוֹ
  choice: À côté de lui
  rationale: Littéralement « à sa main »; dans ce chapitre, l'expression désigne l'emplacement contigu des travaux.
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Transcription française intelligible du nom propre hébreu.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: chef de la moitié du district de Qeïla
  rationale: שַׂר désigne ici un responsable administratif, et פֶלֶךְ une circonscription ou un district.
- source_word: לְפִלְכּוֹ
  choice: pour son district
  rationale: Le ל préfixé peut indiquer la responsabilité, le bénéfice ou la sphère d'intervention; cette formulation en conserve l'indétermination relative.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. « Sous la direction de » rend la relation syntaxique probable entre « les Lévites » et « Rehoum », tout en évitant de faire de Rehoum plusieurs personnes. Le vocabulaire administratif reste sobre; une note préserve l’ambiguïté de לְפִלְכּוֹ.
