id: NEH.3.24
reference: Nehemiah 3:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק בִּנּ֛וּי בֶּן חֵנָדָ֖ד מִדָּ֣ה שֵׁנִ֑ית מִ/בֵּ֣ית עֲזַרְיָ֔ה עַד הַ/מִּקְצ֖וֹעַ וְ/עַד הַ/פִּנָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: fr
  text: Après lui, Binnouï, fils de Hénadad, répara une deuxième portion[a], depuis la maison d’Azaria jusqu’à l’angle et jusqu’au coin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une autre portion ». L’expression hébraïque peut désigner soit le deuxième tronçon réparé par Binnouï, soit simplement une nouvelle portion délimitée du chantier.'
    reason: lexical_alternative
  - marker: b
    text: Les deux mots hébreux traduits par « angle » et « coin » sont proches, mais non identiques ; ils désignent probablement deux éléments architecturaux voisins.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Dans la liste des travaux de Néhémie 3, l’expression marque la succession des ouvriers ou des chantiers, sans imposer une stricte proximité spatiale.
- source_word: הֶחֱזִיק
  choice: répara
  rationale: Le verbe signifie littéralement « fortifier, rendre solide », mais désigne ici, de façon idiomatique, les travaux de réparation de la muraille.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: Binnouï, fils de Hénadad
  rationale: Les noms sont translittérés selon l’usage biblique français, et le patronyme hébreu est rendu directement par « fils de ».
- source_word: מִדָּה שֵׁנִית
  choice: une deuxième portion
  rationale: שֵׁנִית signifie « deuxième » et מִדָּה désigne ici une étendue délimitée du chantier. « Portion » est naturel dans ce contexte tout en conservant l’idée d’un tronçon mesuré.
- source_word: מִבֵּית עֲזַרְיָה
  choice: depuis la maison d’Azaria
  rationale: Cette formulation conserve la structure du texte hébreu tout en restant naturelle en français.
- source_word: עַד הַמִּקְצוֹעַ
  choice: jusqu’à l’angle
  rationale: Le terme désigne un angle ou un endroit où la muraille change de direction. « Angle » permet de le distinguer du terme architectural suivant.
- source_word: וְעַד הַפִּנָּה
  choice: et jusqu’au coin
  rationale: פִּנָּה désigne couramment un coin ou un point d’angle. La répétition de « jusqu’à » reflète celle de עַד et maintient la progression topographique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit la progression du rapport de travaux, tandis que les deux termes architecturaux apparentés restent distincts.
