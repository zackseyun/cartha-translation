  text: וּ/מִ/בְּנֵ֨י יוֹיָדָ֤ע בֶּן אֶלְיָשִׁיב֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל חָתָ֖ן לְ/סַנְבַלַּ֣ט הַ/חֹרֹנִ֑י וָ/אַבְרִיחֵ֖/הוּ מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: fr
  text: Parmi les fils de Yoyada, fils d’Éliashib, le grand prêtre, l’un était gendre de Sanballat le Horonite[a]. Je l’ai chassé loin de moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, dans un sens plus large, « était apparenté par mariage à Sanballat ». Le terme hébreu peut désigner une relation par alliance ; ici, « gendre » est la lecture précise la plus naturelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « je l’ai fait fuir » ou « je l’ai banni ». Le verbe hébreu souligne un éloignement forcé, sans préciser la forme administrative de cette mesure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Parmi les fils de … l’un
  rationale: La construction partitive désigne un membre du groupe. Cette tournure est naturelle en français et conserve clairement ce sens.
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Transcription française moderne du nom hébreu, distinguant la consonne initiale de celle d’Éliashib.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: fils d’Éliashib
  rationale: La filiation est rendue directement afin de préserver la précision généalogique.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: Titre français consacré et exact du principal prêtre d’Israël.
- source_word: חָתָן לְסַנְבַלַּט
  choice: était gendre de Sanballat
  rationale: Le terme désigne une relation créée par mariage; dans ce contexte, « gendre » constitue la lecture précise la plus naturelle, tout en signalant en note le sens plus large possible.
- source_word: הַחֹרֹנִי
  choice: le Horonite
  rationale: L’appellation d’origine est conservée sous sa forme française traditionnelle.
- source_word: וָאַבְרִיחֵהוּ
  choice: Je l’ai donc chassé
  rationale: Le hiphil de ברח exprime le fait de contraindre quelqu’un à fuir ou à partir. « Chasser » restitue cette force sans présumer une procédure officielle de bannissement.
- source_word: מֵעָלָי
  choice: loin de moi
  rationale: L’expression indique l’éloignement hors de la présence ou de la sphère d’autorité de Néhémie; associée à « chasser », cette formulation est idiomatique en français.
theological_decisions: []
