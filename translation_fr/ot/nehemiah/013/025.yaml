base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: fr
  text: 'Je les pris à partie et les maudis[a] ; je frappai certains de ces hommes et leur arrachai les cheveux. Puis je leur fis prêter serment par Dieu : « Vous ne donnerez pas vos filles à leurs fils[b] et vous ne prendrez aucune de leurs filles pour vos fils ni pour vous-mêmes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les insultai » ; le verbe hébreu peut désigner des paroles de malédiction ou des paroles outrageantes.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « si vous donnez… et si vous prenez… » ; dans cette formule de serment, ces propositions ont une valeur prohibitive.'
    reason: source_form
lexical_decisions:
- source_word: וָאָרִיב עִמָּם
  choice: Je les pris à partie
  rationale: Le verbe ריב exprime ici une confrontation vive, avec une possible nuance de contestation ou d’accusation. « Prendre à partie » rend cette action directement et naturellement, sans la réduire à de simples reproches.
- source_word: וָאֲקַלְלֵם
  choice: les maudis
  rationale: קלל désigne le plus naturellement le fait de prononcer une malédiction, tout en pouvant aussi évoquer des paroles outrageantes. « Maudire » conserve la force du terme sans ajouter de contenu absent du texte.
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: je frappai certains d’entre eux
  rationale: La construction avec מִן indique qu’il s’agit d’une partie du groupe. « Frappai » rapporte la violence physique sans préciser indûment sa gravité.
- source_word: וָאֶמְרְטֵם
  choice: leur arrachai les cheveux
  rationale: מרט signifie arracher ou épiler. Le français exige d’expliciter les cheveux, sous-entendus dans l’hébreu ; la formulation conserve le caractère brutal de l’acte.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: je leur fis prêter serment au nom de Dieu
  rationale: Le hiphil de שבע signifie faire jurer ou placer sous serment. « Au nom de Dieu » exprime naturellement en français la force de בֵּאלֹהִים dans cette formule de serment.
- source_word: אִם תִּתְּנוּ
  choice: Vous ne donnerez pas
  rationale: Après la formule « je leur fis prêter serment », אִם introduit le contenu prohibitif du serment. Le futur à valeur d’interdiction transmet en français son caractère solennel.
- source_word: בְּנֹתֵיכֶם לִבְנֵיהֶם
  choice: vos filles à leurs fils
  rationale: Cette expression matrimoniale indique que les filles seraient données en mariage aux fils de l’autre groupe. La formulation française demeure concise et transparente.
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: et vous ne prendrez aucune de leurs filles
  rationale: Dans ce contexte matrimonial, נשא signifie prendre une femme pour épouse. L’ajout de « aucune » rend naturellement la portée négative en français, tandis que la suite explicite les bénéficiaires du mariage.
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: pour vos fils ni pour vous-mêmes
  rationale: La prohibition vise à la fois les mariages arrangés pour les fils et ceux des hommes eux-mêmes. « Ni » convient à la coordination sous la négation française.
theological_decisions:
- issue: Rendre sans atténuation ni amplification les mesures violentes prises par Néhémie
  choice: Conserver le récit direct de la malédiction, des coups et de l’arrachage des cheveux
  alternative: Atténuer ces gestes en simples réprimandes verbales, ou les amplifier en châtiment plus sévère que ne l’indique le texte
  rationale: Le texte rapporte des actes disciplinaires durs. La traduction doit les présenter tels quels sans les justifier, les condamner, les adoucir ni en augmenter la violence.
- issue: Valeur de אִם dans la formule de serment
  choice: 'Exprimer une interdiction solennelle : « Vous ne donnerez pas… »'
  alternative: Conserver littéralement « si vous donnez… » ou employer le simple impératif « ne donnez pas… »
  rationale: Dans ce contexte de serment, אִם introduit elliptiquement l’engagement négatif. Le futur français communique clairement la prohibition solennelle tout en évitant de transformer la phrase en condition ordinaire.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple convient au registre narratif biblique sans archaïsme excessif. « Prendre à partie » restitue une confrontation énergique ; les actions violentes restent formulées sans euphémisme ni dramatisation ajoutée.
