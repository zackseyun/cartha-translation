source:
  edition: WLC
  text: וּ/בְנֵי/הֶ֗ם חֲצִי֙ מְדַבֵּ֣ר אַשְׁדּוֹדִ֔ית וְ/אֵינָ֥/ם מַכִּירִ֖ים לְ/דַבֵּ֣ר יְהוּדִ֑ית וְ/כִ/לְשׁ֖וֹן עַ֥ם וָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: fr
  text: La moitié de leurs enfants parlaient la langue d’Asdod[a] et ne savaient pas parler la langue de Juda, mais parlaient la langue de tel ou tel peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parlaient asdodien »; la fin du verset peut aussi se traduire : « et ne savaient pas parler la langue de Juda, mais parlaient chacun la langue de son peuple ».'
    reason: Le gentilé אַשְׁדּוֹדִית désigne la langue d’Asdod, tandis que la construction distributive finale permet une formulation plus étroitement liée aux peuples respectifs.
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: leurs enfants
  rationale: בנים peut désigner plus précisément les fils, mais renvoie ici collectivement aux descendants de ces familles mixtes; « enfants » convient naturellement au contexte.
- source_word: חֲצִי
  choice: La moitié de
  rationale: Le terme indique qu’une partie seulement des enfants est concernée; cette tournure française en exprime clairement la proportion.
- source_word: מְדַבֵּר
  choice: parlaient
  rationale: Le participe décrit ici une pratique ou une aptitude habituelle; l’imparfait convient au récit et s’accorde selon le sens avec le collectif « moitié ».
- source_word: אַשְׁדּוֹדִית
  choice: la langue d’Asdod
  rationale: Le gentilé féminin désigne la langue associée à Asdod. La périphrase française est plus claire et naturelle qu’un adjectif rare tel qu’« asdodien ».
- source_word: וְאֵינָם מַכִּירִים
  choice: et ne savaient pas
  rationale: Avec l’infinitif לְדַבֵּר, הכיר exprime la connaissance pratique nécessaire pour parler; « ne savaient pas parler » rend directement cette incapacité acquise sans suggérer une impossibilité physique.
- source_word: לְדַבֵּר יְהוּדִית
  choice: parler la langue de Juda
  rationale: יְהוּדִית désigne la langue de Juda ou des Judéens. Cette formulation évite de préciser anachroniquement « hébreu » et reste plus intelligible que « parler judéen ».
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: mais parlaient la langue de tel ou tel peuple
  rationale: La répétition distributive עַם וָעָם évoque les langues respectives de différents peuples. Le second « parlaient », implicite dans l’hébreu, est ajouté pour obtenir une phrase française complète, sans introduire l’idée non explicite d’« uniquement ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Langue de Juda » conserve la désignation historique du texte sans l’identifier explicitement à l’hébreu. La syntaxe française explicite le verbe sous-entendu dans le dernier membre tout en préservant la portée distributive de l’hébreu.
