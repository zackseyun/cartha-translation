  text: וַ/יְהִ֖י כְּ/שָׁמְעָ֣/ם אֶת הַ/תּוֹרָ֑ה וַ/יַּבְדִּ֥ילוּ כָל עֵ֖רֶב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: fr
  text: Quand ils entendirent la Loi, ils séparèrent d’Israël tout le groupe mêlé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux d’ascendance mêlée » ou « toute la population mêlée ». Le mot hébreu עֵרֶב est un terme collectif désignant un groupe mêlé.
    reason: 'Alternative lexicale : le référent précis du collectif עֵרֶב demeure ambigu.'
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Quand ils entendirent
  rationale: La construction narrative וַיְהִי suivie de כ avec l’infinitif construit introduit ici l’événement suivant et une proposition temporelle. Le français naturel peut rendre l’ensemble simplement par « Quand ils entendirent ».
- source_word: הַתּוֹרָה
  choice: la Loi
  rationale: Dans ce contexte postexilique de lecture publique, תּוֹרָה désigne l’enseignement normatif transmis par Moïse. « La Loi » est clair pour le grand public et garde la portée institutionnelle du terme.
- source_word: וַיַּבְדִּילוּ
  choice: ils séparèrent
  rationale: בדל exprime l’action de séparer ou de mettre à part. « Séparèrent » conserve la formulation du texte sans préciser davantage la modalité de l’exclusion.
- source_word: כָל עֵרֶב
  choice: tout le groupe mêlé
  rationale: עֵרֶב est un nom collectif désignant un ensemble mêlé. Cette formulation française préserve sa valeur collective sans affirmer dans le texte principal que le mélange concernait nécessairement l’ascendance.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La préposition מן marque la séparation, et יִשְׂרָאֵל demeure le nom de la communauté d’alliance. « D’Israël » est direct et n’explicite pas excessivement le référent.
theological_decisions:
- issue: Référent d’« Israël » dans le contexte postexilique de délimitation communautaire
  choice: Conserver « Israël » comme désignation collective
  alternative: « des Israélites » ou « de l’assemblée d’Israël »
  rationale: Le texte hébreu emploie le nom propre יִשְׂרָאֵל. Le conserver maintient sa portée communautaire et liée à l’alliance sans imposer une interprétation ecclésiologique ou ethnique plus précise.
- issue: Nature du « groupe mêlé »
  choice: Ne pas définir dans le texte principal la nature exacte du mélange
  alternative: « tous ceux d’ascendance mêlée » ou « tous les étrangers mêlés au peuple »
  rationale: Le collectif עֵרֶב évoque un mélange, mais le verset seul ne précise pas explicitement s’il s’agit d’ascendance, d’origine étrangère ou d’une compagnie composite. Une note présente les principales possibilités sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La majuscule à « Loi » signale ici la Torah comme corpus reconnu, sans recourir à un emprunt moins transparent.
