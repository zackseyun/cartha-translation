  text: וְ/לִ/פְנֵ֣י מִ/זֶּ֔ה אֶלְיָשִׁיב֙ הַ/כֹּהֵ֔ן נָת֖וּן בְּ/לִשְׁכַּ֣ת בֵּית אֱלֹהֵ֑י/נוּ קָר֖וֹב לְ/טוֹבִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: fr
  text: Avant cela, le prêtre Éliashib, qui avait été établi responsable d’une salle de la maison de notre Dieu, était lié à Tobiya[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était un proche de Tobiya ». L’expression hébraïque peut désigner une proximité familiale ou sociale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: Avant cela
  rationale: L’expression situe les faits avant les événements précédemment racontés. Le וְ initial assure la continuité du récit sans exiger un « et » en français.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: le prêtre Éliashib
  rationale: Le titre défini est rendu naturellement avant le nom propre en français.
- source_word: נָתוּן בְּלִשְׁכַּת
  choice: qui avait été chargé de la salle
  rationale: Le participe passif de נתן indique ici qu’Éliashib avait reçu une fonction relative à cette salle. « Avait été chargé de » exprime cette responsabilité sans suggérer une simple présence physique.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: de la maison de notre Dieu
  rationale: Cette formulation conserve l’image hébraïque de la « maison » de Dieu et la première personne du pluriel.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: était un proche de Tobiya
  rationale: « Un proche » garde ouverte la nature du lien, qui peut relever de la parenté ou d’une association sociale, tout en restant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le tiret final signale que la phrase et le récit se poursuivent au verset suivant. La formulation évite de préciser comme certain un lien de parenté que l’hébreu laisse ambigu.
