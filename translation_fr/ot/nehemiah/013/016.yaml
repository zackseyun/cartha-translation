  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: fr
  text: Des Tyriens habitaient aussi à Jérusalem[a] ; ils y apportaient du poisson et toutes sortes de marchandises, qu’ils vendaient le jour du sabbat aux fils de Juda, à Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en elle » ; le pronom renvoie à Jérusalem.'
    reason: referent_clarification
  - marker: b
    text: 'Ou, en conservant la coordination : « aux fils de Juda et à Jérusalem ». La mention finale peut aussi être emphatique : « à Jérusalem même ».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: Des Tyriens aussi
  rationale: Le nom désigne des gens originaires de Tyr. « aussi » rattache naturellement cette infraction à celles qui précèdent.
- source_word: יָשְׁבוּ בָהּ
  choice: habitaient dans la ville
  rationale: ישׁב exprime ici la résidence. Le suffixe féminin renvoie à Jérusalem ; expliciter « la ville » évite en français une reprise pronominale maladroite.
- source_word: מְבִיאִים דָּאג וְכָל מֶכֶר
  choice: ils y apportaient du poisson et toutes sortes de marchandises
  rationale: Le participe décrit une activité habituelle. מֶכֶר désigne des biens destinés à la vente ; le pluriel français est idiomatique.
- source_word: וּמֹכְרִים בַּשַּׁבָּת
  choice: qu’ils vendaient le jour du sabbat
  rationale: La relative relie clairement la vente aux produits apportés, tandis que « le jour du sabbat » exprime naturellement le moment de l’activité.
- source_word: לִבְנֵי יְהוּדָה
  choice: aux fils de Juda
  rationale: Cette traduction conserve l’expression filiale littérale de l’hébreu, qui désigne collectivement les Judéens, sans la neutraliser dans le texte principal.
- source_word: וּבִירוּשָׁלִָם
  choice: jusque dans Jérusalem
  rationale: La formulation française rend la valeur vraisemblablement emphatique de la coordination finale tout en signalant en note qu’une lecture simplement coordonnée reste possible.
