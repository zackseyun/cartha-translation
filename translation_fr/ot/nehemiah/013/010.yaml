  text: וָ/אֵ֣דְעָ֔/ה כִּֽי מְנָי֥וֹת הַ/לְוִיִּ֖ם לֹ֣א נִתָּ֑נָה וַ/יִּבְרְח֧וּ אִישׁ לְ/שָׂדֵ֛/הוּ הַ/לְוִיִּ֥ם וְ/הַ/מְשֹׁרְרִ֖ים עֹשֵׂ֥י הַ/מְּלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: fr
  text: Je découvris que les parts destinées aux Lévites[a] ne leur avaient pas été données. Les Lévites et les chanteurs qui accomplissaient le travail s’étaient enfuis, chacun dans son champ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les parts prescrites pour les Lévites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un homme vers son champ », c’est-à-dire chacun vers son propre champ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: Je découvris
  rationale: Dans cette suite narrative, ידע exprime le fait que Néhémie prend connaissance de la situation. « Je découvris » rend naturellement cette valeur dynamique.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: les parts dues aux Lévites
  rationale: מְנָיוֹת désigne ici les parts de provisions attribuées aux Lévites. « Dues aux Lévites » exprime clairement leur destination sans préciser davantage leur nature.
- source_word: לֹא נִתָּנָה
  choice: ne leur avaient pas été remises
  rationale: Le passif de נתן est conservé. Le plus-que-parfait situe ce manquement avant la découverte de Néhémie, et le pronom « leur » explicite en français les bénéficiaires déjà nommés.
- source_word: וַיִּבְרְחוּ
  choice: avaient donc fui
  rationale: ברח signifie « fuir ». « Donc » rend le lien de conséquence avec l’absence de soutien, tandis que le plus-que-parfait présente cette fuite comme déjà accomplie lorsque Néhémie la constate.
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: chacun vers son champ
  rationale: La tournure distributive hébraïque, littéralement « un homme vers son champ », est rendue directement et naturellement en français.
- source_word: וְהַמְשֹׁרְרִים
  choice: et les chanteurs
  rationale: « Chanteurs » désigne sans ajout explicatif les chanteurs affectés au culte, que le contexte permet d’identifier.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: qui assuraient le service
  rationale: Le participe désigne ceux qui accomplissaient la tâche ou le travail en question. Dans ce contexte cultuel, « assuraient le service » est naturel tout en restant suffisamment général.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple introduit la découverte de Néhémie; le plus-que-parfait marque les faits antérieurs qu’il constate. La formulation conserve le verbe fort « fuir » et la répartition individuelle exprimée par l’hébreu.
