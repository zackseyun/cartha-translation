  source_fidelity: 'Le sens général est fidèle : Néhémie apprend que les provisions attribuées aux Lévites n’ont pas été données, et que les Lévites et les chanteurs ont quitté leur poste pour leurs champs. Toutefois, « donc » explicite un lien logique non marqué par le texte hébreu, et « assurer le service » précise quelque peu « faire le travail ».'
  naturalness: Le français est globalement fluide et de registre narratif approprié. « Chacun dans son champ » est plus idiomatique que « chacun vers son champ » dans ce contexte, tout en conservant la distribution individuelle.
  terminology: « Parts destinées aux Lévites » rend clairement le génitif hébreu comme des parts qui leur sont attribuées. « Accomplissaient le travail » reste plus proche de עֹשֵׂי הַמְּלָאכָה que « assuraient le service », sans exclure le cadre cultuel établi par le contexte.
