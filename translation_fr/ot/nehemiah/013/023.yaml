source:
  edition: WLC
  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם רָאִ֤יתִי אֶת הַ/יְּהוּדִים֙ הֹשִׁ֗יבוּ נָשִׁים֙ אשדודיות עמוניות מוֹאֲבִיּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: fr
  text: À cette époque-là aussi, je vis des Juifs[a] qui avaient épousé[b] des femmes ashdodiennes, ammonites et moabites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des Judéens ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avaient fait habiter des femmes » ; dans ce contexte, l’expression signifie qu’ils les avaient prises pour épouses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּיָּמִים הָהֵם
  choice: À cette époque-là aussi
  rationale: Cette formulation française naturelle conserve à la fois la valeur additive de גַּם et le repère temporel de בַּיָּמִים הָהֵם.
- source_word: רָאִיתִי
  choice: je vis
  rationale: Le verbe ordinaire « voir » préserve le caractère direct du témoignage de Néhémie ; le passé simple convient au registre narratif biblique sans être archaïque.
- source_word: אֶת הַיְּהוּדִים
  choice: des Juifs
  rationale: Dans le contexte postexilique, le terme désigne les membres de la communauté juive. « Judéens » reste possible et est signalé en note.
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: avaient épousé des femmes
  rationale: Le sens littéral du hiphil de ישׁב est « faire habiter, installer », mais l’expression désigne ici le fait de prendre ces femmes pour épouses. Le plus-que-parfait situe ces mariages avant le constat de Néhémie.
- source_word: אשדודיות עמוניות מוֹאֲבִיּוֹת
  choice: ashdodiennes, ammonites et moabites
  rationale: Ces adjectifs féminins rendent les trois gentilés hébreux et s’accordent naturellement avec « femmes ».
theological_decisions:
- issue: Portée ethnogéographique de הַיְּהוּדִים
  choice: Juifs
  alternative: Judéens
  rationale: « Juifs » communique naturellement l’identité de la communauté postexilique, tandis que « Judéens » mettrait davantage l’accent sur l’origine géographique. La variante est conservée en note afin de ne pas effacer cette nuance.
- issue: Valeur de הֹשִׁיבוּ נָשִׁים
  choice: avaient épousé des femmes
  alternative: avaient fait habiter des femmes
  rationale: Le rendu idiomatique indique clairement la relation matrimoniale visée par le contexte, sans ajouter de jugement théologique au texte. La forme plus littérale est donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple « je vis » maintient la tonalité narrative, tandis que le plus-que-parfait rend explicitement l’antériorité des mariages. Les gentilés féminins conservent la structure concise de l’hébreu.
