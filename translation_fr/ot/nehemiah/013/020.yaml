  text: וַ/יָּלִ֨ינוּ הָ/רֹכְלִ֜ים וּ/מֹכְרֵ֧י כָל מִמְכָּ֛ר מִ/ח֥וּץ לִ/ירוּשָׁלִָ֖ם פַּ֥עַם וּ/שְׁתָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: fr
  text: Alors les marchands et les vendeurs de toutes sortes de marchandises passèrent la nuit[a] hors de Jérusalem une fois ou deux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « logèrent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une fois et deux », expression signifiant « une fois ou deux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: passèrent la nuit
  rationale: Le verbe לון désigne le fait de passer la nuit ou de loger. « Passèrent la nuit » exprime naturellement l’action ponctuelle sans suggérer une installation durable.
- source_word: הָרֹכְלִים
  choice: les marchands
  rationale: רֹכְלִים désigne des commerçants ou marchands itinérants. « Marchands » convient au contexte commercial et reste courant en français moderne.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: et les vendeurs de toutes sortes de marchandises
  rationale: La tournure hébraïque englobe tout ce qui peut être vendu. Cette formulation française conserve l’étendue de כָל tout en restant naturelle.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: hors de Jérusalem
  rationale: מִחוּץ indique un emplacement à l’extérieur de la ville. « Hors de Jérusalem » est clair, digne et idiomatique.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: une fois ou deux
  rationale: L’expression littérale « une fois et deux » est un idiome indiquant une ou deux occasions. « Une fois ou deux » en restitue exactement le sens sans exagérer la fréquence.
theological_decisions: []
