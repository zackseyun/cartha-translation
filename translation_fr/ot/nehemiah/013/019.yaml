source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: fr
  text: Lorsque les portes de Jérusalem commencèrent à s’assombrir[a] avant le sabbat, je donnai l’ordre de fermer les battants et de ne pas les rouvrir jusqu’après le sabbat. Je postai quelques-uns de mes serviteurs[b] aux portes, afin qu’aucun chargement[c] n’entre dans la ville le jour du sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque les ombres du soir commencèrent à tomber sur les portes de Jérusalem ».
    reason: lexical_alternative
  - marker: b
    text: Ou « quelques-uns des hommes de ma suite ». Le terme peut désigner les membres de l’entourage personnel de Néhémie.
    reason: lexical_alternative
  - marker: c
    text: Il pouvait s’agir notamment de marchandises transportées pour être vendues, puisque le contexte concerne le commerce pendant le sabbat.
    reason: cultural_note
lexical_decisions:
- source_word: צָלֲלוּ
  choice: commencèrent à s’assombrir
  rationale: Le verbe décrit les portes gagnées par l’ombre à l’approche du soir. Cette formulation française conserve l’image et indique naturellement l’imminence du sabbat, qui commençait au coucher du soleil.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: les portes de Jérusalem
  rationale: Rendu direct et naturel de la chaîne construite hébraïque.
- source_word: וָאֹמְרָה ... וָאֹמְרָה
  choice: j’ordonnai ... de
  rationale: Le verbe signifie littéralement « dire », mais les deux occurrences introduisent ici les directives administratives de Néhémie. Le français les réunit sans perdre leur force impérative.
- source_word: הַדְּלָתוֹת
  choice: les battants
  rationale: Dans le contexte des portes d’une ville, le terme désigne les panneaux ou battants que l’on ferme, plutôt que l’ensemble monumental des portes.
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: avant la fin du sabbat
  rationale: Formulation française naturelle qui exprime que les battants ne devaient être rouverts qu’une fois le sabbat passé.
- source_word: וּמִנְּעָרַי
  choice: quelques-uns de mes serviteurs
  rationale: Dans l’entourage du gouverneur, נַעַר peut désigner des serviteurs ou des membres de sa suite, sans nécessairement insister sur leur jeunesse.
- source_word: הֶעֱמַדְתִּי עַל הַשְּׁעָרִים
  choice: Je postai ... aux portes
  rationale: « Poster » rend clairement l’affectation de personnel à un lieu de surveillance.
- source_word: לֹא יָבוֹא מַשָּׂא
  choice: qu’aucun chargement n’entre dans la ville
  rationale: Le texte évoque concrètement une charge transportée par les portes. « Dans la ville » explicite la direction impliquée par le contexte sans remplacer le terme concret par « marchandises ».
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: Ce rendu conserve la mention explicite du « jour » présente en hébreu.
theological_decisions:
- issue: Rendu de שַׁבָּת
  choice: sabbat
  alternative: jour de repos
  rationale: Le mot désigne ici le sabbat hebdomadaire propre à la vie religieuse et sociale d’Israël, et non un simple jour de repos générique.
translation_notes:
  register: 'Français international moderne, sobre et narratif. Le passé simple convient au registre historique et dignifié. La phrase resserre les deux verbes de parole en un seul ordre coordonné, tout en conservant les deux interdictions successives : fermer, puis ne pas rouvrir.'
