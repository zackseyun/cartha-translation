  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: fr
  text: Tout Juda apporta la dîme des céréales, du vin nouveau et de l’huile dans les entrepôts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salles de réserve ». Le terme hébreu peut désigner des pièces de stockage ou des trésoreries ; ici, la mention des céréales, du vin et de l’huile favorise le sens de lieux de stockage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: Tout Juda
  rationale: כָּל avec le nom propre יְהוּדָה désigne collectivement toute la communauté de Juda. « Tout Juda » conserve cette formulation collective sans trancher artificiellement entre territoire et population.
- source_word: הֵבִיאוּ
  choice: apporta
  rationale: Le hiphil de בוא signifie couramment « apporter » ou « faire entrer ». Le singulier français s’accorde naturellement avec le sujet collectif « Tout Juda ».
- source_word: מַעְשַׂר
  choice: la dîme
  rationale: מַעְשַׂר est le terme habituel pour le dixième dû. Le singulier hébreu, à valeur collective, est conservé.
- source_word: הַ/דָּגָן
  choice: des céréales
  rationale: דָּגָן désigne largement les produits céréaliers, et non seulement le froment. « Céréales » est précis et naturel en français moderne.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: du vin nouveau
  rationale: תִּירוֹשׁ désigne typiquement le vin nouveau ou le produit récent de la vigne, par contraste lexical avec le terme plus général יַיִן.
- source_word: וְ/הַ/יִּצְהָר
  choice: de l’huile
  rationale: יִצְהָר désigne l’huile fraîche, normalement l’huile d’olive dans les listes agricoles. « Huile » reste idiomatique et évite une précision implicite non exprimée formellement.
- source_word: לָ/אוֹצָרוֹת
  choice: dans les magasins
  rationale: אוֹצָרוֹת désigne ici les pièces où l’on entrepose les provisions du temple. « Magasins » convient aux céréales, au vin et à l’huile, tout en évitant l’idée principalement monétaire que pourrait suggérer « trésors ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre de la phrase est légèrement réorganisé pour éviter une lourdeur et rattacher clairement la destination au verbe. Le vocabulaire agricole demeure concret, tandis que « Tout Juda » préserve le caractère collectif de l’hébreu.
