source:
  edition: WLC
  text: וָ/אָרִ֨יבָ/ה֙ אֶת הַ/סְּגָנִ֔ים וָ/אֹ֣מְרָ֔/ה מַדּ֖וּעַ נֶעֱזַ֣ב בֵּית הָ/אֱלֹהִ֑ים וָֽ/אֶ֨קְבְּצֵ֔/ם וָֽ/אַעֲמִדֵ֖/ם עַל עָמְדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: fr
  text: 'Je pris alors à partie les responsables et leur dis : « Pourquoi la maison de Dieu est-elle délaissée[a] ? » Puis je les rassemblai et les rétablis à leur poste[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « laissée à l’abandon ». Le verbe hébreu au passif peut désigner ce qui est laissé ou abandonné ; ici, le contexte met surtout en cause la négligence du service et du soutien liés au temple.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fis tenir à leur place ». L’expression évoque leur rétablissement dans les fonctions qui leur étaient assignées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: Je pris alors à partie
  rationale: Le verbe ריב exprime ici une confrontation ou une contestation. « Prendre à partie » conserve cette force adversative sans réduire l’action à une simple réprimande.
- source_word: הַסְּגָנִים
  choice: les responsables
  rationale: סְגָנִים désigne des autorités administratives subalternes. « Responsables » est clair en français moderne et convient au contexte, sans imposer un titre institutionnel trop précis.
- source_word: וָאֹמְרָה
  choice: et leur dis
  rationale: Traduction directe du verbe אמר dans la séquence narrative ; le pronom indirect explicite naturellement en français les personnes interpellées.
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Rend directement l’interrogatif hébreu dans une formulation française naturelle.
- source_word: נֶעֱזַב
  choice: est-elle délaissée
  rationale: Le passif de עזב peut évoquer ce qui est laissé, abandonné ou négligé. « Délaissée » maintient cette amplitude tout en convenant au défaut d’entretien du service du temple dans le contexte.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction formelle conserve l’expression hébraïque et sa portée religieuse, sans la remplacer explicitement par « temple ».
- source_word: וָאֶקְבְּצֵם
  choice: je les rassemblai
  rationale: קבץ signifie rassembler ou réunir ; cette formulation est directe et naturelle.
- source_word: וָאַעֲמִידֵם עַל עָמְדָם
  choice: les rétablis à leur poste
  rationale: L’expression signifie littéralement les faire tenir à leur place. Dans ce contexte, elle indique le retour des personnes concernées à leurs fonctions assignées.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le registre narratif biblique sans archaïsme lexical. « Délaissée » préserve l’ambiguïté entre négligence et abandon, tandis que « rétablis à leur poste » explicite sobrement l’idiome administratif hébreu.
