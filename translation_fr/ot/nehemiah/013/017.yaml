  text: וָ/אָרִ֕יבָ/ה אֵ֖ת חֹרֵ֣י יְהוּדָ֑ה וָ/אֹמְרָ֣/ה לָ/הֶ֗ם מָֽה הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים וּֽ/מְחַלְּלִ֖ים אֶת י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: fr
  text: 'Je pris à partie les notables de Juda et leur dis : « Quelle est cette mauvaise action que vous commettez en profanant le jour du sabbat[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en violant le jour du sabbat ». Le verbe hébreu évoque le fait de traiter comme ordinaire ce qui est saint.
    reason: 'Alternative lexicale : « violer » met l’accent sur la transgression, tandis que « profaner » exprime plus explicitement l’atteinte au caractère saint du sabbat.'
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: Je pris donc à partie
  rationale: Le verbe ריב exprime ici une confrontation énergique ou une réprimande. « Prendre à partie » conserve cette force adversative sans supposer une procédure judiciaire formelle ; « donc » rend la progression narrative du waw consécutif.
- source_word: חֹרֵי יְהוּדָה
  choice: les notables de Juda
  rationale: חֹרִים désigne les membres éminents ou dirigeants de la société. « Notables » est naturel en français moderne et n'impose pas une fonction administrative précise.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: Quel est ce mal
  rationale: Cette formulation française concise conserve la condamnation morale portée par רָע, sans l'affaiblir en simple erreur ou mauvaise pratique.
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: que vous commettez
  rationale: Le participe indique une conduite en cours. Avec « mal », le verbe « commettre » est plus idiomatique que « faire » et maintient la gravité morale.
- source_word: וּמְחַלְּלִים
  choice: en profanant
  rationale: Dans ce contexte, חלל signifie traiter comme ordinaire ce qui est saint. Le gérondif rend naturellement en français le rapport entre l'acte mauvais et la profanation, sans en modifier le contenu.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: Cette traduction conserve explicitement יוֹם tout en employant la désignation française usuelle « sabbat ».
theological_decisions:
- issue: Langage décrivant l'atteinte au sabbat
  choice: profanant le jour du sabbat
  alternative: violant le jour du sabbat ; désacralisant le jour du sabbat
  rationale: « Profaner » préserve l'opposition biblique entre le saint et le profane portée par חלל. Le texte dénonce ainsi non seulement la transgression d'une règle, mais le traitement d'un jour saint comme s'il était ordinaire.
translation_notes:
  register: Français international moderne, digne et direct. « Notables » désigne les responsables sociaux sans surinterpréter leur charge ; « prendre à partie » restitue la confrontation énergique dans une formulation courante.
