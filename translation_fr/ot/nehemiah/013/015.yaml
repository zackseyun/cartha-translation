  text: בַּ/יָּמִ֣ים הָ/הֵ֡מָּה רָאִ֣יתִי בִֽ/יהוּדָ֣ה דֹּֽרְכִֽים גִּתּ֣וֹת בַּ/שַּׁבָּ֡ת וּ/מְבִיאִ֣ים הָ/עֲרֵמ֣וֹת וְֽ/עֹמְסִ֪ים עַל הַ/חֲמֹרִ֟ים וְ/אַף יַ֜יִן עֲנָבִ֤ים וּ/תְאֵנִים֙ וְ/כָל מַשָּׂ֔א וּ/מְבִיאִ֥ים יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וָ/אָעִ֕יד בְּ/י֖וֹם מִכְרָ֥/ם צָֽיִד׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: fr
  text: En ces jours-là, je vis en Juda des gens qui foulaient le raisin dans les pressoirs le jour du sabbat, qui apportaient des tas de céréales et les chargeaient sur des ânes, ainsi que du vin, des raisins, des figues et toutes sortes de charges, et qui les faisaient entrer à Jérusalem le jour du sabbat. Je les avertis le jour où ils vendaient des provisions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: fouler le raisin dans les pressoirs
  rationale: Littéralement « fouler des pressoirs » ; la formulation française explicite l’objet naturellement sous-entendu par l’activité viticole.
- source_word: הָעֲרֵמוֹת
  choice: des tas de céréales
  rationale: Le mot désigne des tas ou des monceaux. Dans ce contexte de chargement agricole, « céréales » rend l’implicite sans imposer une espèce particulière.
- source_word: וָאָעִיד
  choice: Je les avertis solennellement
  rationale: Le verbe עוּד au hifil peut signifier prendre à témoin, protester ou avertir avec insistance. Ici, l’action de Néhémie contre la profanation du sabbat appelle un avertissement formel.
- source_word: צָיִד
  choice: denrées
  rationale: Dans ce contexte commercial, le terme désigne des provisions ou de la nourriture, et non spécifiquement du gibier. « Denrées » convient aux produits agricoles énumérés.
theological_decisions:
- issue: Nature de l’intervention de Néhémie
  choice: avertissement solennel
  alternative: témoignage contre eux
  rationale: La traduction retient la valeur contextuelle d’admonestation sans atténuer le caractère officiel et grave du verbe.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « le jour du sabbat » est conservée parce qu’elle structure l’accusation dans l’hébreu. « D’autres » évite une longue coordination ambiguë tout en laissant entendre plusieurs activités observées en Juda.
