revisions:
- from: En ces jours-là, je vis en Juda des gens fouler le raisin dans les pressoirs le jour du sabbat. D’autres apportaient des tas de céréales et les chargeaient sur des ânes ; ils apportaient aussi du vin, des raisins, des figues et toutes sortes de fardeaux, qu’ils faisaient entrer à Jérusalem le jour du sabbat. Je les avertis solennellement le jour où ils vendaient leurs denrées.
  to: En ces jours-là, je vis en Juda des gens qui foulaient le raisin dans les pressoirs le jour du sabbat, qui apportaient des tas de céréales et les chargeaient sur des ânes, ainsi que du vin, des raisins, des figues et toutes sortes de charges, et qui les faisaient entrer à Jérusalem le jour du sabbat. Je les avertis le jour où ils vendaient des provisions.
  rationale: La révision supprime l’opposition non marquée par « D’autres » et conserve une seule série d’activités observées. Elle remplace « fardeaux » par « charges », plus approprié aux marchandises transportées, sans modifier le sens du passage.
