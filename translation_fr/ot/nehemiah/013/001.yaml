source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: fr
  text: Ce jour-là, on lut dans le livre de Moïse[a] devant le peuple, et l’on y trouva écrit qu’aucun Ammonite ni aucun Moabite ne devait jamais[c] entrer dans l’assemblée de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le rouleau de Moïse ». Le mot hébreu peut désigner un livre, un rouleau ou un document écrit.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la communauté de Dieu ».
    reason: lexical_alternative
  - marker: c
    text: Ou « pour toujours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend naturellement la référence à un jour précis tout en conservant la sobriété de l’hébreu.
- source_word: נִקְרָא בְּסֵפֶר מֹשֶׁה
  choice: on lut dans le livre de Moïse
  rationale: Le nifal peut ici avoir une valeur passive ou impersonnelle. La tournure française impersonnelle est naturelle; «dans le livre» respecte la préposition hébraïque et évite de faire du livre lui-même l’objet direct du verbe.
- source_word: בְּאָזְנֵי הָעָם
  choice: devant le peuple
  rationale: Littéralement «aux oreilles du peuple»; l’expression française indique clairement une lecture publique entendue par le peuple sans ajouter explicitement «à haute voix».
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: et l’on y trouva écrit
  rationale: Tournure idiomatique qui conserve l’idée de découverte ainsi que la référence au livre.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: aucun Ammonite ni aucun Moabite
  rationale: Sous la négation, «ni» rend naturellement la portée distributive visant l’un et l’autre groupe.
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: dans l’assemblée de Dieu
  rationale: «Assemblée» rend directement קָהָל sans importer un vocabulaire ecclésiologique postérieur; le génitif divin est conservé.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: Dans cette interdiction, «jamais» exprime naturellement en français la portée durable de la formule hébraïque.
theological_decisions:
- issue: Sens de בִּקְהַל הָאֱלֹהִים
  choice: l’assemblée de Dieu
  alternative: la communauté de Dieu
  rationale: Le choix principal préserve le langage du rassemblement et le rapport direct à Dieu, sans préciser davantage la nature ou les droits associés à cette assemblée.
- issue: Portée de עַד עוֹלָם dans la formule d’exclusion
  choice: ne devait jamais entrer
  alternative: ne devait pas entrer pour toujours
  rationale: «Jamais» conserve la force d’exclusion durable dans un français naturel, sans résoudre au-delà du texte les questions relatives à son application.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit emploie le passé simple, naturel dans une narration biblique soutenue. La formulation impersonnelle «on lut» reflète l’ambiguïté passive/impersonnelle du verbe hébreu. Les marqueurs de notes sont placés dans le texte principal après les expressions concernées.
