revisions:
- from: Ainsi, je les ai purifiés de tout ce qui était étranger, et j’ai établi les tours de service[a] des prêtres et des lévites, chacun à sa tâche.
  to: Ainsi, je les ai purifiés de tout ce qui était étranger, et j’ai établi des fonctions de service pour les prêtres et les lévites, chacun dans son travail[a].
  rationale: La révision explicite que les fonctions sont établies pour les prêtres et les lévites et évite de restreindre מִשְׁמָרוֹת à des rotations. Le reste de la traduction conserve la portée large et non ethnicisée de « tout ce qui était étranger » ainsi que la distribution individuelle exprimée par אִישׁ בִּמְלַאכְתּוֹ.
