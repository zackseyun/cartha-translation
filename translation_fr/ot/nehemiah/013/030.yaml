  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: fr
  text: Ainsi, je les ai purifiés de tout ce qui était étranger, et j’ai établi des fonctions de service pour les prêtres et les lévites, chacun dans son travail[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des charges », « des gardes » ou « des affectations de service ».
    reason: Le pluriel מִשְׁמָרוֹת possède plusieurs nuances possibles dans l’organisation du service sacerdotal et lévitique.
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Ainsi, je les ai purifiés
  rationale: Le piel de טהר signifie « purifier » ou « rendre pur ». « Purifiés » convient au contexte des réformes de Néhémie. « Ainsi » exprime ici l’enchaînement récapitulatif ou résultatif possible du waw, sans alourdir la phrase.
- source_word: מִכָּל נֵכָר
  choice: de tout ce qui était étranger
  rationale: נֵכָר désigne ce qui est étranger ou extérieur. Cette formulation française conserve l’ampleur de l’expression hébraïque sans la réduire aux étrangers comme personnes ni à une forme précise de souillure.
- source_word: וָאַעֲמִידָה
  choice: et j’ai établi
  rationale: Le hiphil de עמד exprime ici l’action de mettre en place ou d’organiser officiellement. « Établi » garde ce sens administratif et s’accorde naturellement avec les tours de service.
- source_word: מִשְׁמָרוֹת
  choice: les tours de service
  rationale: Le terme peut désigner des gardes, des charges, des divisions ou des services organisés. Dans le contexte sacerdotal et lévitique, « tours de service » rend clairement l’idée d’un ordre de service établi tout en conservant la notion de rotation ou d’affectation.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: des prêtres et des lévites
  rationale: Cette construction française exprime naturellement les tours de service établis pour les deux groupes explicitement nommés en hébreu.
- source_word: אִישׁ
  choice: chacun
  rationale: 'אִישׁ a ici une valeur distributive : chaque membre des groupes concernés reçoit sa place propre. « Chacun » restitue cette fonction avec naturel.'
- source_word: בִּמְלַאכְתּוֹ
  choice: à sa tâche
  rationale: מְלָאכָה peut signifier travail, tâche, fonction ou service. « À sa tâche » indique de façon concise l’affectation de chacun à son domaine de travail.
theological_decisions:
- issue: Portée de « les » et de « tout ce qui était étranger »
  choice: La purification concerne les personnes visées dans le contexte, débarrassées de tout élément étranger, sans préciser davantage la nature de cet élément.
  alternative: « Je les ai purifiés de tous les étrangers » ou « de toute femme étrangère ».
  rationale: L’hébreu emploie une expression abstraite et large. Bien que le contexte évoque notamment les mariages mixtes et les compromissions du personnel du temple, la traduction ne doit pas restreindre le propos aux seules personnes étrangères ou aux seules épouses étrangères.
- issue: Valeur distributive du masculin אִישׁ
  choice: chacun à sa tâche
  alternative: chaque homme à son travail
  rationale: Dans cette construction, אִישׁ distribue les fonctions entre les membres des groupes masculins nommés, plutôt qu’il ne souligne le mot « homme ». « Chacun » en restitue exactement la fonction.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient à la narration personnelle de Néhémie et reste naturel pour le lectorat actuel. La phrase conserve la sobriété administrative du texte hébreu sans préciser indûment la nature de ce qui est « étranger ».
