  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: fr
  text: N’est-ce pas à cause de ces choses que Salomon, roi d’Israël, a péché ? Parmi les nombreuses nations, il n’y avait aucun roi comme lui ; il était aimé de son Dieu, et Dieu l’a établi roi sur tout Israël. Même lui, les femmes étrangères[a] l’ont fait pécher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les épouses étrangères ». L’hébreu dit « les femmes étrangères » ; d’après le récit de Salomon, il peut s’agir de ses épouses, mais ce terme n’est pas explicite dans ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: N’est-ce pas à cause de ces choses
  rationale: La tournure interrogative appelle une réponse affirmative, tandis que « à cause de ces choses » conserve la valeur causale de עַל אֵלֶּה sans préciser davantage le référent.
- source_word: חָטָא
  choice: a péché
  rationale: Rendu courant et direct du verbe dans un contexte moral et religieux.
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: Pourtant, parmi les nombreuses nations, il n’y avait aucun roi comme lui
  rationale: « Pourtant » exprime naturellement le contraste contextuel, et le reste conserve la comparaison portée par l’hébreu.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: Il était aimé de son Dieu
  rationale: Préserve le sens passif ou adjectival de אָהוּב et le suffixe possessif de « son Dieu ».
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ עַל כָּל יִשְׂרָאֵל
  choice: Dieu l’avait établi roi sur tout Israël
  rationale: Dans cette construction, נתן exprime l’établissement dans une fonction. Le plus-que-parfait rend clairement l’antériorité de cette faveur par rapport à la chute évoquée.
- source_word: גַּם אוֹתוֹ
  choice: Même lui
  rationale: 'Conserve la mise en relief de l’objet et l’étonnement : malgré sa situation exceptionnelle, Salomon a lui aussi été entraîné dans le péché.'
- source_word: הֶחֱטִיאוּ
  choice: l’ont entraîné dans le péché
  rationale: Exprime en français naturel la valeur causative du hiphil de חטא sans développer le mécanisme de son péché.
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: les femmes étrangères
  rationale: Rendu lexical direct qui n’ajoute pas explicitement la notion d’épouses, même si le récit de Salomon permet cette compréhension.
theological_decisions:
- issue: Rôle des femmes étrangères dans le péché de Salomon
  choice: les femmes étrangères l’ont entraîné dans le péché
  alternative: les femmes étrangères l’ont fait pécher
  rationale: La formulation conserve l’attribution causative explicite du texte sans ajouter qu’elles l’auraient tenté ni expliquer politiquement ou religieusement le processus.
- issue: Désignation divine אֱלֹהִים
  choice: son Dieu… Dieu
  alternative: son Dieu… le Seigneur
  rationale: Le premier syntagme comporte un suffixe possessif, tandis que le second emploie אֱלֹהִים sans suffixe. Aucun nom divin justifiant « le Seigneur » n’apparaît ici.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique et l’insistance de « Même lui » sont conservées. « Entraîné dans le péché » évite la raideur de « fait pécher » tout en maintenant la causalité du verbe hébreu.
