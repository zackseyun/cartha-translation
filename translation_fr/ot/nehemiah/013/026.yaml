revisions:
- from: N’est-ce pas à cause de ces choses que Salomon, roi d’Israël, a péché ? Pourtant, parmi les nombreuses nations, il n’y avait aucun roi comme lui. Il était aimé de son Dieu, et Dieu l’avait établi roi sur tout Israël. Même lui, les femmes étrangères[a] l’ont entraîné dans le péché.
  to: N’est-ce pas à cause de ces choses que Salomon, roi d’Israël, a péché ? Parmi les nombreuses nations, il n’y avait aucun roi comme lui ; il était aimé de son Dieu, et Dieu l’a établi roi sur tout Israël. Même lui, les femmes étrangères[a] l’ont fait pécher.
  rationale: La révision rétablit un temps français correspondant directement au récit hébreu, exprime explicitement la causalité de « ont fait pécher » et évite d’attribuer à la première conjonction une opposition qui n’est pas lexicalement marquée. Elle préserve l’accent rhétorique sur Salomon ainsi que l’ambiguïté entre « femmes » et « épouses » dans la note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:49:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'La formulation conserve correctement la question rhétorique, la causalité de « ces choses », le titre de Salomon, l’amour de son Dieu et l’insistance de « même lui ». Deux ajustements sont nécessaires : le plus-que-parfait (« l’avait établi ») n’est pas exigé par le wayyiqtol hébreu, qui se rend plus directement par un passé simple/composé ; et « entraîné dans le péché » est un peu moins explicite que le causatif « ont fait pécher ». Le contraste introduit par « Pourtant » avant « parmi les nombreuses nations » n’est pas marqué par le texte hébreu.'
  naturalness: Le français est globalement naturel et d’un registre approprié. « Dieu l’a établi roi » et « l’ont fait pécher » sont à la fois idiomatiques et plus proches de la syntaxe et de la force verbale du texte source.
  terminology: « Salomon », « roi d’Israël », « son Dieu », « Dieu », « femmes étrangères » et « péché » sont appropriés. La note conserve correctement l’alternative contextuelle « épouses étrangères » sans la substituer au terme explicite du verset.
  issues:
  - severity: medium
    issue: Temps de « Dieu l’avait établi roi »
    rationale: Le texte hébreu emploie un wayyiqtol narratif (« et Dieu le fit/l’établit roi »). Le plus-que-parfait français ajoute une relation d’antériorité qui n’est pas explicitement exprimée.
  - severity: low
    issue: « Pourtant » avant « parmi les nombreuses nations »
    rationale: La conjonction hébraïque est simplement connective. Le contraste rhétorique ressort suffisamment de l’éloge de Salomon suivi de « Même lui » ; « Pourtant » à cet endroit interprète inutilement la liaison.
  - severity: medium
    issue: « l’ont entraîné dans le péché »
    rationale: Cette expression est naturelle, mais « ont fait pécher » rend plus directement la valeur causative du hiphil הֶחֱטִיאוּ, sans ajouter une image de processus.
  revised_text: N’est-ce pas à cause de ces choses que Salomon, roi d’Israël, a péché ? Parmi les nombreuses nations, il n’y avait aucun roi comme lui ; il était aimé de son Dieu, et Dieu l’a établi roi sur tout Israël. Même lui, les femmes étrangères[a] l’ont fait pécher.
  revised_footnotes:
  - marker: a
    text: Ou « les épouses étrangères ». L’hébreu dit « les femmes étrangères » ; d’après le récit de Salomon, il peut s’agir de ses épouses, mais ce terme n’est pas explicite dans ce verset.
    reason: lexical_alternative
