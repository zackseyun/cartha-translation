base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: fr
  text: 'Je les ai donc avertis en leur disant : « Pourquoi passez-vous la nuit devant la muraille ? Si vous recommencez, je porterai la main contre vous[a]. » Dès lors, ils ne sont plus venus le jour du sabbat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’emploierai la force contre vous ». Litt. : « j’enverrai une main contre vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה בָהֶם
  choice: Je les ai donc avertis
  rationale: Le hifil de עוד exprime ici un avertissement solennel adressé aux marchands. « Avertir » est naturel en français moderne et convient à la confrontation décrite.
- source_word: וָאֹמְרָה אֲלֵיהֶם
  choice: en leur disant
  rationale: Cette formulation française unit naturellement les deux verbes successifs sans perdre l’acte explicite de parole.
- source_word: מַדּוּעַ אַתֶּם לֵנִים
  choice: Pourquoi passez-vous la nuit
  rationale: לין signifie loger ou passer la nuit. La traduction retenue est directe, courante et précise.
- source_word: נֶגֶד הַחוֹמָה
  choice: devant la muraille
  rationale: נֶגֶד situe les marchands en face ou devant la muraille. « Devant » conserve cette indication spatiale sans ajouter explicitement « à l’extérieur », bien que le contexte le suggère.
- source_word: אִם תִּשְׁנוּ
  choice: Si vous recommencez
  rationale: שנה signifie ici répéter l’action. Le verbe français exprime naturellement l’objet implicite sans le préciser davantage.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: je mettrai la main sur vous
  rationale: Cette locution française conserve l’image de la main et la menace d’une intervention directe, sans déterminer précisément s’il s’agit d’arrestation ou d’un autre recours à la force.
- source_word: מִן הָעֵת הַהִיא
  choice: Dès lors
  rationale: Formulation concise et naturelle indiquant qu’à partir de ce moment le comportement a cessé.
- source_word: לֹא בָאוּ בַּשַּׁבָּת
  choice: ils ne sont plus venus le jour du sabbat
  rationale: « Ne sont plus venus » rend le résultat durable impliqué par le contexte. « Le jour du sabbat » désigne clairement le moment où ils avaient l’habitude de venir.
theological_decisions:
- issue: Nature exacte de la menace de Néhémie
  choice: je mettrai la main sur vous
  alternative: j’emploierai la force contre vous
  rationale: L’hébreu menace d’une action coercitive sans en préciser la forme. La traduction conserve cette indétermination plutôt que de définir une sanction particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé maintient une narration accessible; « sabbat » conserve le terme biblique usuel. La citation directe emploie un registre ferme sans archaïsme.
