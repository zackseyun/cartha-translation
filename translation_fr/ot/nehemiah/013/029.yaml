source:
  edition: WLC
  text: זָכְרָ֥/ה לָ/הֶ֖ם אֱלֹהָ֑/י עַ֚ל גָּאֳלֵ֣י הַ/כְּהֻנָּ֔ה וּ/בְרִ֥ית הַ/כְּהֻנָּ֖ה וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: fr
  text: Souviens-toi d’eux[a], mon Dieu, car ils ont profané le sacerdoce ainsi que l’alliance du sacerdoce et des lévites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Souviens-toi d’eux, mon Dieu, à propos de ceux qui ont profané le sacerdoce ainsi que l’alliance du sacerdoce et des lévites. »'
    reason: La tournure hébraïque emploie un participe substantivé, littéralement « ceux qui profanent » ou « les profanateurs », et la préposition עַל peut se comprendre comme « à propos de » ou « à cause de ».
lexical_decisions:
- source_word: זָכְרָה
  choice: Souviens-toi
  rationale: Cette forme exprime ici un appel direct adressé à Dieu, caractéristique des prières de Néhémie. Le verbe reste en lui-même neutre, tandis que le contexte lui donne une portée judiciaire.
- source_word: לָהֶם
  choice: d’eux
  rationale: Après זכר, la préposition ל avec le pronom peut se rendre naturellement par « d’eux ». Le sens défavorable ressort de l’accusation qui suit, sans être ajouté au verbe.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Le suffixe de première personne du singulier est rendu directement et conserve l’adresse personnelle propre à la prière.
- source_word: עַל
  choice: car
  rationale: La préposition introduit ici le motif de la demande. « Car » exprime clairement cette valeur causale dans un français naturel et digne.
- source_word: גָּאֳלֵי
  choice: ils ont profané
  rationale: Le participe substantivé vient du verbe גאל au sens de souiller ou profaner, et non de la racine homonyme signifiant racheter. Une proposition verbale est plus naturelle en français que « les profanateurs de ».
- source_word: הַכְּהֻנָּה
  choice: le sacerdoce
  rationale: Le nom abstrait désigne la fonction ou l’institution sacerdotale, et non simplement les prêtres comme personnes.
- source_word: וּבְרִית הַכְּהֻנָּה
  choice: ainsi que l’alliance du sacerdoce
  rationale: Cette formulation conserve le rapport génitif du texte sans préciser indûment s’il s’agit d’une alliance conclue avec les prêtres ou d’une alliance relative à l’institution sacerdotale.
- source_word: וְהַלְוִיִּם
  choice: et des lévites
  rationale: Le groupe est rattaché naturellement à « l’alliance », de sorte que celle-ci concerne le sacerdoce et les lévites. La formulation garde néanmoins la concision du texte hébreu.
theological_decisions:
- issue: La demande de se souvenir des coupables est-elle favorable ou défavorable ?
  choice: Un souvenir défavorable, en vue du jugement, exprimé par le contexte
  alternative: Une demande neutre de se souvenir d’eux, sans portée judiciaire explicite
  rationale: Dans les prières de Néhémie, « se souvenir » peut avoir une portée favorable ou défavorable. Ici, l’accusation de profanation indique un appel judiciaire. La traduction laisse toutefois cette portée découler de la proposition causale plutôt que de l’ajouter au verbe lui-même.
- issue: Portée de « l’alliance du sacerdoce et des lévites »
  choice: Une alliance se rapportant au sacerdoce et aux lévites ensemble
  alternative: L’alliance du sacerdoce d’une part, puis les lévites comme second objet distinct de la profanation
  rationale: La syntaxe hébraïque favorise le rattachement des lévites à l’alliance, mais elle demeure condensée. La traduction maintient ce lien sans définir davantage la nature exacte de l’alliance.
translation_notes:
  register: Français international moderne, avec un registre de prière digne et accessible. « Sacerdoce » est retenu comme terme précis et courant dans le contexte biblique. La coordination a été légèrement explicitée par « ainsi que » afin d’éviter que l’alliance soit prise pour un simple troisième objet indépendant, tout en conservant la tension syntaxique de l’hébreu.
