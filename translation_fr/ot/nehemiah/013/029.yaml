  naturalness: Le français est naturel, clair et d’un registre biblique moderne accessible. « Sacerd­oce » convient au nom institutionnel abstrait visé par l’hébreu. La coordination par « ainsi que » est fluide et ne modifie pas sensiblement la portée des objets de « profané ».
  terminology: Les termes « mon Dieu », « profané », « sacerdoce », « alliance » et « lévites » sont précis, cohérents avec le contexte biblique et adaptés au français international moderne. Aucun terme ne surinterprète la nature de l’alliance.
