base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: fr
  text: J’établis responsables des réserves le prêtre Shélémia, le scribe Tsadok et Pedaya, l’un des lévites, ainsi que Hanan, fils de Zakkour et petit-fils de Mattania, à leurs côtés[a], car ils étaient considérés comme dignes de confiance[b]. C’était à eux de distribuer à leurs frères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous leur direction » ; l’expression hébraïque peut indiquer une étroite association ou un service subordonné.
    reason: lexical_alternative
  - marker: b
    text: Ou « reconnus comme fidèles ».
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu masculin rendu par « frères » désigne ici leurs compagnons ou les autres membres de leur communauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹצְרָה עַל אֹצָרוֹת
  choice: Je préposai aux réserves
  rationale: Le verbe exprime ici la désignation de responsables, tandis que אֹצָרוֹת désigne les pièces ou lieux où étaient entreposées les offrandes. « Préposer aux réserves » rend clairement cette fonction administrative sans suggérer que Néhémie entreposait lui-même les biens.
- source_word: צָדוֹק הַסֹּפֵר
  choice: le scribe Tsadok
  rationale: סֹפֵר peut désigner un scribe, un secrétaire ou un fonctionnaire. « Scribe » conserve le titre traditionnel sans préciser indûment sa fonction.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: Pedaya, l’un des lévites
  rationale: Cette formulation naturelle rend littéralement l’appartenance de Pedaya au groupe des lévites.
- source_word: וְעַל יָדָם
  choice: à leurs côtés
  rationale: L’expression idiomatique peut marquer une étroite association ou une position subordonnée. Le texte principal conserve cette latitude, et la note signale l’autre lecture possible.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: car ils étaient considérés comme dignes de confiance
  rationale: נֶאֱמָנִים qualifie ici des personnes fiables dans l’exercice d’une responsabilité, et נֶחְשָׁבוּ indique qu’elles étaient tenues ou reconnues pour telles.
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: C’était à eux de faire les distributions
  rationale: וַעֲלֵיהֶם exprime une responsabilité assignée, et חלק désigne ici la répartition concrète de parts ou de provisions.
- source_word: לַאֲחֵיהֶם
  choice: à leurs frères
  rationale: La traduction conserve le terme masculin de parenté employé par l’hébreu, tout en laissant la note expliquer sa portée communautaire dans ce contexte.
theological_decisions:
- issue: Portée du terme masculin אֲחֵיהֶם
  choice: leurs frères
  alternative: leurs compagnons ou les autres membres de leur communauté
  rationale: Le texte hébreu emploie explicitement le pluriel masculin « frères ». Le conserver évite d’aplatir la forme du texte ou de préciser sans certitude qu’il s’agit uniquement des lévites.
- issue: Nuance morale ou administrative de נֶאֱמָנִים
  choice: dignes de confiance
  alternative: fidèles
  rationale: Dans ce contexte de gestion et de distribution, la fiabilité est au premier plan. « Dignes de confiance » garde néanmoins la dimension de fidélité personnelle sans introduire une qualification doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Préposai » maintient une tonalité administrative adaptée au récit sans archaïsme excessif. La syntaxe distingue les trois responsables nommés de Hanan placé « à leurs côtés », tout en préservant l’ambiguïté hiérarchique de l’expression hébraïque.
