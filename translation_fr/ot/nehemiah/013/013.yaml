  to: J’établis responsables des réserves le prêtre Shélémia, le scribe Tsadok et Pedaya, l’un des lévites, ainsi que Hanan, fils de Zakkour et petit-fils de Mattania, à leurs côtés[a], car ils étaient considérés comme dignes de confiance[b]. C’était à eux de distribuer à leurs frères[c].
  rationale: 'Révision limitée à deux formulations stylistiques sûres : la nomination est exprimée plus clairement comme l’établissement de responsables des réserves, et la charge de distribution est rendue par un infinitif français naturel, sans pluriel ni objet ajoutés. Les notes et leurs ancres restent correctement alignées.'
