source:
  edition: WLC
  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י עַל זֹ֑את וְ/אַל תֶּ֣מַח חֲסָדַ֗/י אֲשֶׁ֥ר עָשִׂ֛יתִי בְּ/בֵ֥ית אֱלֹהַ֖/י וּ/בְ/מִשְׁמָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: fr
  text: Souviens-toi de moi pour cela, mon Dieu, et n’efface pas les actes de fidélité[a] que j’ai accomplis pour la maison de mon Dieu et pour les responsabilités qui lui sont liées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes actes de loyauté », « mes bontés » ou « mes actes de fidélité à l’alliance ». Le mot hébreu peut exprimer la bonté, la loyauté ou la fidélité dans le cadre d’une relation d’alliance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « et pour ses charges » ; il s’agit des fonctions et responsabilités liées à la maison de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Souviens-toi de moi
  rationale: La demande adressée à Dieu se rend naturellement ainsi en français, tout en conservant l’appel personnel direct.
- source_word: עַל זֹאת
  choice: pour cela
  rationale: L’expression renvoie à ce qui vient d’être raconté et peut exprimer le motif de la demande.
- source_word: וְאַל תֶּמַח
  choice: et n’efface pas
  rationale: Le verbe מחה évoque l’action d’effacer ou de supprimer; « effacer » conserve en français l’image liée au souvenir ou au registre.
- source_word: חֲסָדַי
  choice: les actes de fidélité
  rationale: Au pluriel et précisé par « que j’ai accomplis », חֶסֶד désigne ici des actes manifestant fidélité, loyauté ou bonté. Cette formulation garde la portée relationnelle du terme sans imposer explicitement « alliance » là où le mot demeure polysémique.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que j’ai accomplis
  rationale: La proposition relative qualifie les actes; le passé composé convient au regard rétrospectif de la prière.
- source_word: בְּבֵית אֱלֹהַי
  choice: pour la maison de mon Dieu
  rationale: Bien que בְ puisse signifier « dans », le contexte présente des actions accomplies au bénéfice et au service du temple; « pour » exprime naturellement ce rapport.
- source_word: וּבְמִשְׁמָרָיו
  choice: et pour les services qui y sont assurés
  rationale: מִשְׁמָר désigne les charges, fonctions ou obligations attachées au temple. Cette formulation française indique clairement le référent du suffixe tout en conservant l’idée de responsabilités cultuelles.
theological_decisions:
- issue: Sens de חֲסָדַי dans une prière à la première personne
  choice: les actes de fidélité
  alternative: mes bontés; mes actes de loyauté; mes actes de fidélité à l’alliance
  rationale: Le texte présente les actions de Néhémie comme des manifestations de fidélité. La traduction conserve ce poids théologique sans transformer le verset en affirmation explicite de mérite ni restreindre le mot à une seule nuance.
- issue: Tonalité potentiellement méritoire de la demande
  choice: Conserver sans atténuation l’appel « Souviens-toi de moi » et la mention des actes accomplis
  alternative: Paraphraser afin de réduire la mise en avant des actions de Néhémie
  rationale: L’hébreu formule directement cette demande. La tension théologique doit rester visible plutôt que d’être résolue par une reformulation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La prière directe est préservée, ainsi que la métaphore de l’effacement. « Les services qui y sont assurés » évite l’ambiguïté possible de « ses services » en français et renvoie clairement aux responsabilités du temple.
