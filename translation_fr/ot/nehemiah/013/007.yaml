  variant: modern international French
source:
  edition: WLC
  text: וָ/אָב֖וֹא לִֽ/ירוּשָׁלִָ֑ם וָ/אָבִ֣ינָ/ה בָ/רָעָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה אֶלְיָשִׁיב֙ לְ/ט֣וֹבִיָּ֔ה לַ/עֲשׂ֥וֹת ל/וֹ֙ נִשְׁכָּ֔ה בְּ/חַצְרֵ֖י בֵּ֥ית הָ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: fr
  text: Quand j’arrivai à Jérusalem, je compris le mal qu’Éliashib avait fait pour Tobiya en lui aménageant une chambre[a] dans les cours de la maison de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pièce ». Le terme hébreu désigne une salle ou une chambre située dans l’enceinte du temple.
    reason: lexical_alternative
  - marker: b
    text: La « maison de Dieu » désigne ici le temple.
    reason: cultural_note
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: Quand j’arrivai à Jérusalem
  rationale: Le wayyiqtol fait progresser le récit. La tournure temporelle française exprime naturellement que la constatation eut lieu à l’arrivée de Néhémie, sans ajouter explicitement l’idée d’un retour.
- source_word: וָאָבִינָה
  choice: je compris
  rationale: Le verbe בין désigne ici la compréhension ou la prise de conscience de Néhémie; « je compris » en conserve directement la valeur cognitive.
- source_word: בָרָעָה
  choice: le mal
  rationale: רָעָה porte un jugement moral explicite sur l’acte; « le mal » en maintient le poids sans en préciser davantage la nature.
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: qu’Éliashib avait fait pour Tobiya
  rationale: Le plus-que-parfait marque l’antériorité de l’acte par rapport à la compréhension de Néhémie. Le ל indique que Tobiya en était le bénéficiaire.
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: en lui aménageant une chambre
  rationale: L’infinitif précise en quoi consistait le mal commis. « Aménager » convient à la mise à disposition d’un local, tandis que « chambre » conserve l’étendue de sens de נִשְׁכָּה sans imposer la fonction plus précise de magasin.
- source_word: בְּחַצְרֵי
  choice: dans les cours
  rationale: Le pluriel חַצְרֵי désigne les cours de l’enceinte du sanctuaire; « cours » est ici concis et usuel.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction garde l’expression hébraïque transparente, qui désigne ici le temple, sans la remplacer dans le texte par son référent interprété.
theological_decisions:
- issue: Caractérisation morale de l’acte d’Éliashib
  choice: le mal
  alternative: le tort; la mauvaise action
  rationale: Le texte qualifie expressément l’acte par רָעָה. La traduction conserve ce jugement moral fort sans expliquer au-delà du verset pourquoi l’acte était mauvais.
- issue: Désignation du sanctuaire
  choice: la maison de Dieu
  alternative: le temple de Dieu
  rationale: La formulation littérale préserve l’image théologique du texte hébreu, tandis qu’une note indique clairement son référent historique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit historique écrit; la syntaxe demeure accessible. Les noms propres suivent les formes françaises usuelles Éliashib et Tobiya.
