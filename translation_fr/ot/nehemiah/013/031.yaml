  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: fr
  text: Et pour l’offrande de bois aux moments prévus[a], ainsi que pour les prémices — souviens-toi de moi, mon Dieu, favorablement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’offrande du bois ». L’hébreu désigne l’apport de bois fourni à des moments déterminés pour le service du temple.'
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « pour le bien ». Ou : « pour mon bien ».'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: l’offrande de bois
  rationale: Cette expression conserve le cadre cultuel et désigne l’apport programmé du bois destiné au service du temple.
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: aux dates fixées
  rationale: La formulation exprime clairement des moments officiellement déterminés, dans un français actuel et naturel.
- source_word: בִּכּוּרִים
  choice: les prémices
  rationale: « Prémices » est le terme français établi pour les premiers produits présentés à Dieu.
- source_word: זָכְרָה לִּי
  choice: Souviens-toi de moi
  rationale: La traduction directe conserve la formule de prière récurrente de Néhémie et son adresse personnelle à Dieu.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le possessif et l’adresse personnelle sont rendus sans expansion.
- source_word: לְטוֹבָה
  choice: pour le bien
  rationale: Cette formulation brève conserve l’indétermination de l’hébreu entre souvenir favorable, bienfait et issue bénéfique.
theological_decisions:
- issue: Sens cultuel de קֻרְבַּן הָעֵצִים
  choice: l’offrande de bois
  alternative: l’approvisionnement en bois
  rationale: Le choix maintient explicitement la dimension d’offrande, sans réduire l’expression à une simple opération logistique.
- issue: Portée de la demande finale לְטוֹבָה
  choice: pour le bien
  alternative: favorablement / pour mon bien
  rationale: La traduction retenue ne précise pas si Néhémie demande l’approbation divine, un bienfait personnel ou plus largement une issue favorable.
translation_notes:
  register: Français international moderne, digne et concis. La coordination initiale « Et pour » conserve le lien syntaxique avec ce qui précède. Le vocabulaire cultuel reste accessible, avec une note pour expliciter l’offrande de bois.
