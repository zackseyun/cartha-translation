revisions:
- from: Et pour l’offrande de bois aux dates fixées[a], ainsi que pour les prémices. Souviens-toi de moi, mon Dieu, pour le bien[b].
  to: Et pour l’offrande de bois aux moments prévus[a], ainsi que pour les prémices — souviens-toi de moi, mon Dieu, favorablement[b].
  rationale: La révision améliore l'idiomaticité française tout en maintenant le vocabulaire cultuel et la concision de l'hébreu. « Favorablement » explicite la fonction grammaticale de la demande sans déterminer la nature précise du bien attendu ; la note préserve la formulation littérale et son possible sens personnel.
