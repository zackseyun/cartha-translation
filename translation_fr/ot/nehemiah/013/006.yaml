source:
  edition: WLC
  text: וּ/בְ/כָל זֶ֕ה לֹ֥א הָיִ֖יתִי בִּֽ/ירוּשָׁלִָ֑ם כִּ֡י בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וּ/שְׁתַּ֜יִם לְ/אַרְתַּחְשַׁ֤סְתְּא מֶֽלֶךְ בָּבֶל֙ בָּ֣אתִי אֶל הַ/מֶּ֔לֶךְ וּ/לְ/קֵ֥ץ יָמִ֖ים נִשְׁאַ֥לְתִּי מִן הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: fr
  text: Mais pendant tout ce temps, je n’étais pas à Jérusalem. En effet, la trente-deuxième année d’Artaxerxès, roi de Babylone[a], je me rendis auprès du roi. Au bout d’un certain temps[b], je demandai au roi l’autorisation de partir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « roi de Babylone ». La traduction suit le texte tel qu’il est écrit, sans l’harmoniser avec le cadre plus large de l’Empire perse.
    reason: textual_variant
  - marker: b
    text: Ou « à la fin de quelques jours » ou « après un certain temps ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: Mais pendant tout ce temps
  rationale: La formule situe dans le temps les événements précédents et souligne, par « mais », que Néhémie était absent pendant qu’ils se produisaient.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: je n’étais pas à Jérusalem
  rationale: Cette formulation directe et naturelle exprime simplement l’absence de Néhémie durant la période concernée.
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit ici l’explication de son absence; « En effet » rend clairement ce lien en français narratif.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם
  choice: la trente-deuxième année
  rationale: C’est la tournure française usuelle pour dater un événement d’après une année de règne.
- source_word: לְאַרְתַּחְשַׁסְתְּא
  choice: d’Artaxerxès
  rationale: Le nom propre suit sa forme française traditionnelle et largement reconnue.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: La traduction conserve le titre donné explicitement par le texte hébreu, sans l’harmoniser avec le cadre plus large de l’Empire perse.
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: je me rendis auprès du roi
  rationale: Le verbe בוא peut exprimer le fait de venir ou d’aller selon le point de vue. « Se rendre auprès de » est naturel en français et convient à la démarche vers la cour royale.
- source_word: וּלְקֵץ יָמִים
  choice: Au bout d’un certain temps
  rationale: Cette expression rend l’idiome hébreu littéralement lié à la « fin de jours » tout en conservant son caractère temporel indéfini.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: je demandai au roi l’autorisation de partir
  rationale: Dans ce contexte, la forme verbale désigne une demande de congé ou de permission. La traduction exprime la demande sans affirmer explicitement qu’elle fut accordée.
