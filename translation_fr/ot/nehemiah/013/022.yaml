  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: fr
  text: J’ai dit aux Lévites de se purifier, puis de venir garder les portes afin de sanctifier le jour du sabbat. Souviens-toi aussi de cela en ma faveur, mon Dieu[a], et épargne-moi selon l’abondance de ton amour fidèle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Souviens-toi aussi de moi à cause de cela, mon Dieu. » La tournure hébraïque peut rapporter l’idée de faveur soit à Néhémie lui-même, soit à l’acte qui vient d’être mentionné.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « amour fidèle » traduit l’hébreu ḥésed, qui désigne souvent la bonté loyale, la fidélité et la miséricorde de Dieu dans le cadre de son alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: J’ai dit aux Lévites
  rationale: Le verbe אמר signifie ici « dire » ou « donner une instruction ». « J’ai dit aux Lévites » reste proche de l’hébreu sans renforcer indûment l’énoncé en « j’ai ordonné ».
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: de se purifier
  rationale: La construction avec היה et le participe exprime l’action attendue; la forme hitpael de טהר a ici un sens réfléchi.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: puis de venir garder les portes
  rationale: Cette formulation rend naturellement en français la suite des participes hébreux et conserve l’idée que les Lévites viennent assumer la garde des portes.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: afin de sanctifier le jour du sabbat
  rationale: קדשׁ exprime la mise à part comme saint. « Sanctifier » garde ici le lien explicite entre la garde des portes et le caractère sacré du sabbat.
- source_word: גַּם זֹאת זָכְרָה לִּי
  choice: Souviens-toi aussi de cela en ma faveur
  rationale: L’expression demande à Dieu de tenir compte favorablement de l’acte qui vient d’être mentionné. Une note préserve l’autre rattachement possible de la tournure bénéficiaire.
- source_word: וְחוּסָה עָלַי
  choice: et épargne-moi
  rationale: חוס peut exprimer la pitié, la compassion ou le fait d’épargner. Dans cette supplication, « épargne-moi » rend directement la demande de grâce.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: selon l’abondance de ton amour fidèle
  rationale: רֹב indique l’abondance, tandis que חֶסֶד désigne ici l’amour loyal et miséricordieux de Dieu. « Amour fidèle » en conserve à la fois la dimension relationnelle et la constance.
theological_decisions:
- issue: Sens de חֶסֶד dans une prière sollicitant la grâce
  choice: amour fidèle
  alternative: bonté; fidélité; amour d’alliance; miséricorde
  rationale: Le terme associe bonté, loyauté et miséricorde. « Amour fidèle » garde cette richesse sans réduire le mot à un seul de ses aspects ni ajouter une formulation confessionnelle.
- issue: Portée de זָכְרָה לִּי
  choice: Souviens-toi aussi de cela en ma faveur
  alternative: Souviens-toi aussi de moi à cause de cela
  rationale: La syntaxe hébraïque permet de comprendre que Dieu se souvienne favorablement soit de l’acte mentionné pour Néhémie, soit de Néhémie en raison de cet acte. Le texte principal retient une lecture naturelle et la note maintient l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit clairement la progression des actions sans reproduire lourdement la chaîne participiale hébraïque. « Sabbat », « sanctifier » et « amour fidèle » conservent le poids cultuel et théologique du texte tout en restant compréhensibles.
