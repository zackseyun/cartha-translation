base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: fr
  text: Vos pères n’ont-ils pas agi ainsi, et notre Dieu n’a-t-il pas fait venir sur nous et sur cette ville tout ce malheur[a] ? Or vous augmentez encore la colère contre Israël en profanant le sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce désastre » ou « toute cette calamité ». Ici, le mot hébreu רָעָה peut désigner un malheur survenu comme jugement.
    reason: alternative lexicale
lexical_decisions:
- source_word: הֲלֹוא כֹה עָשׂוּ
  choice: Vos pères n’ont-ils pas agi ainsi
  rationale: La tournure interrogative négative rend la question rhétorique qui appelle l’assentiment, tandis que « agir ainsi » traduit naturellement כֹה עָשׂוּ.
- source_word: אֲבֹתֵיכֶם
  choice: vos pères
  rationale: Rend directement le pluriel masculin familial de l’hébreu; « vos ancêtres » resterait possible, mais serait plus général.
- source_word: וַיָּבֵא אֱלֹהֵינוּ
  choice: et notre Dieu n’a-t-il pas fait venir
  rationale: « Faire venir » reflète la forme causative de בוא. La reprise interrogative en français clarifie que la seconde proposition appartient à la même question rhétorique sans supprimer Dieu comme agent du jugement.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: tout ce malheur
  rationale: Dans ce contexte de jugement, רָעָה désigne la calamité subie. « Malheur » est naturel en français et conserve une certaine amplitude lexicale sans suggérer que Dieu commettrait un mal moral.
- source_word: וְעַל הָעִיר הַזֹּאת
  choice: et sur cette ville
  rationale: Conserve la répétition conceptuelle de עַל et le parallélisme entre le peuple et la ville.
- source_word: וְאַתֶּם מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: Et vous, vous attirez encore davantage de colère sur Israël
  rationale: Cette formulation française naturelle exprime l’idée d’ajouter ou d’accroître la colère pesant sur Israël. Le redoublement de « vous » marque le contraste emphatique de וְאַתֶּם.
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: en profanant le sabbat
  rationale: Le gérondif rend le moyen ou la circonstance exprimée par לְ, et « profaner » correspond au sens de חלל appliqué au sabbat.
theological_decisions:
- issue: Sens de רָעָה lorsque Dieu fait venir le jugement
  choice: malheur
  alternative: mal; désastre; calamité
  rationale: Le contexte renvoie à une catastrophe judiciaire plutôt qu’à un mal moral accompli par Dieu. « Malheur » maintient la gravité du terme tout en évitant de résoudre la phrase dans un sens théologiquement trompeur.
- issue: Agent de la colère exprimée par חָרוֹן
  choice: colère, sans ajout explicite de « de Dieu »
  alternative: colère de Dieu; ardente colère
  rationale: Le contexte permet de comprendre la colère divine, mais l’hébreu ne nomme pas son détenteur dans cette proposition. La traduction préserve cette implicitation au lieu d’ajouter une précision doctrinale.
- issue: Force du jugement divin
  choice: fait venir sur nous et sur cette ville
  alternative: a permis que ce malheur nous atteigne
  rationale: Le texte présente directement Dieu comme celui qui fait venir le malheur. La traduction ne doit pas atténuer cette causalité explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est formulée avec une syntaxe française claire; « sabbat » garde la terminologie biblique courante. Le contraste emphatique entre les pères et les contemporains de Néhémie est maintenu.
