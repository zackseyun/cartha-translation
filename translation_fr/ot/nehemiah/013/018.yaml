    issue: « attirez encore davantage de colère sur Israël »
    rationale: La formulation transforme l’idée d’« ajouter/augmenter la colère contre Israël » en celle de l’attirer, et « davantage » explicite une comparaison absente du texte. Une formulation avec « augmenter » conserve plus précisément le sens du participe מוֹסִיפִים et de חָרוֹן עַל יִשְׂרָאֵל.
