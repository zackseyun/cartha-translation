revisions:
- from: Il lui aménagea une grande pièce[a]. C’était là qu’autrefois on déposait[b] l’offrande de céréales, l’encens, les ustensiles et la dîme du blé, du vin nouveau et de l’huile — la part prescrite pour les Lévites, les chantres et les portiers[c] — ainsi que la contribution destinée aux prêtres[d].
  to: Il lui aménagea une grande pièce[a]. C’était là qu’autrefois on déposait[b] l’offrande de céréales, l’encens, les ustensiles et la dîme des céréales, du vin nouveau et de l’huile — la part prescrite pour les Lévites, les chanteurs et les gardiens des portes[c] — ainsi que la contribution destinée aux prêtres[d].
  rationale: La révision remplace la spécification injustifiée « blé » par « céréales », actualise deux désignations de fonctions du temple et corrige l’alternative française trompeuse dans la note sur la pièce. Une nouvelle note précise que l’encens en question est l’oliban. Le rendu prudent de la syntaxe elliptique concernant la part prescrite est maintenu.
