  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: fr
  text: Il lui aménagea une grande pièce[a]. C’était là qu’autrefois on déposait[b] l’offrande de céréales, l’encens, les ustensiles et la dîme des céréales, du vin nouveau et de l’huile — la part prescrite pour les Lévites, les chanteurs et les gardiens des portes[c] — ainsi que la contribution destinée aux prêtres[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande salle » ou « un grand local de stockage ». Le terme hébreu désigne une pièce des dépendances du temple, qui pouvait servir au stockage.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu exprime une pratique habituelle dans le passé : « on avait coutume d’y déposer ».'
    reason: linguistic_clarification
  - marker: c
    text: 'Littéralement : « le commandement des Lévites, des chanteurs et des gardiens des portes » ; dans ce contexte, il s’agit de ce qui leur était prescrit comme part.'
    reason: source_ambiguity
  - marker: d
    text: Ou « l’offrande prélevée pour les prêtres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: Il lui aménagea
  rationale: Dans ce contexte, עשה avec ל signifie qu’il fit ou prépara cet espace pour lui. « Aménagea » exprime naturellement en français la préparation concrète d’une pièce sans préciser abusivement les travaux réalisés.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: une grande pièce
  rationale: לִשְׁכָּה désigne une salle ou pièce dans les dépendances du temple, souvent utilisée pour le stockage. « Pièce » est naturel en français moderne et ne préjuge pas exclusivement de sa fonction.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: C’était là qu’autrefois on déposait
  rationale: La construction היה avec participe exprime ici une pratique habituelle passée, et לְפָנִים signifie « autrefois ». L’imparfait français rend clairement cette valeur coutumière.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans le contexte cultuel, מִנְחָה désigne l’offrande végétale, couramment faite de farine ou de céréales. Cette formulation est plus précise que le simple mot « offrande ».
- source_word: הַלְּבוֹנָה
  choice: l’encens
  rationale: לְבוֹנָה désigne précisément l’oliban, encens employé dans le culte. « Encens » est le terme français courant et immédiatement compréhensible.
- source_word: הַכֵּלִים
  choice: les ustensiles
  rationale: כֵּלִים désigne des objets ou instruments servant au culte. « Ustensiles » conserve l’idée d’objets fonctionnels sans ajouter une catégorie absente de l’hébreu.
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: la dîme du blé, du vin nouveau et de l’huile
  rationale: מַעְשֵׂר est la dîme; דָּגָן, תִּירוֹשׁ et יִצְהָר forment la triade habituelle du blé, du vin nouveau et de l’huile.
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: la part prescrite pour les Lévites, les chantres et les portiers
  rationale: Littéralement, le texte parle du « commandement » de ces groupes, mais dans cette liste de denrées entreposées, il s’agit elliptiquement de ce qui leur était prescrit ou dû. « La part prescrite » rend ce sens tout en signalant l’ellipse en note.
- source_word: וּתְרוּמַת הַכֹּהֲנִים
  choice: la contribution destinée aux prêtres
  rationale: תְּרוּמָה désigne une contribution ou offrande mise à part. « Contribution » est clair en français moderne, tandis que « destinée aux prêtres » rend la relation du construit sans imposer qu’ils en soient les donateurs.
theological_decisions:
- issue: Sens de מִצְוַת dans la liste des réserves du temple
  choice: la part prescrite pour les Lévites, les chantres et les portiers
  alternative: le commandement concernant les Lévites, les chantres et les portiers
  rationale: Le contexte matériel des dîmes entreposées favorise une ellipse désignant la part prescrite pour ces serviteurs du temple. Une note conserve toutefois la forme plus littérale de l’hébreu et évite de masquer la tension syntaxique.
- issue: Relation exprimée par תְרוּמַת הַכֹּהֲנִים
  choice: la contribution destinée aux prêtres
  alternative: la contribution des prêtres
  rationale: Dans ce contexte de réserves affectées au personnel cultuel, les prêtres sont vraisemblablement les bénéficiaires. La note maintient le sens cultuel possible d’« offrande prélevée » sans introduire une terminologie confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit, tandis que l’imparfait marque l’ancienne pratique habituelle. « Chantres » et « portiers » maintiennent le cadre institutionnel du temple tout en restant intelligibles; les notes préservent les principales ambiguïtés lexicales et syntaxiques de l’hébreu.
