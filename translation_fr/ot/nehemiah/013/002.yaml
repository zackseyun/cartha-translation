source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: fr
  text: car ils n’étaient pas venus à la rencontre des fils d’Israël avec du pain et de l’eau, et avaient engagé Balaam contre lui[a] pour le maudire. Mais notre Dieu a changé la malédiction en bénédiction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte un verbe au singulier («il avait engagé») et des pronoms singuliers («contre lui», «pour le maudire»). Israël est ici envisagé comme une entité collective; le sujet singulier du verbe peut renvoyer à Balak dans l’épisode évoqué.
    reason: ambiguïté grammaticale et singulier collectif
lexical_decisions:
- source_word: קִדְּמוּ
  choice: n’étaient pas venus à la rencontre
  rationale: Le verbe désigne ici le fait d’aller au-devant de quelqu’un pour le recevoir. Cette formulation conserve l’action concrète sans ajouter l’idée plus interprétative d’accueil.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression filiale explicite de l’hébreu et reste intelligible en français biblique moderne.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: avec du pain et de l’eau
  rationale: La formulation rend directement les deux provisions nommées et maintient l’écho de Deutéronome 23.5.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת בִּלְעָם
  choice: avaient engagé Balaam contre lui
  rationale: Le verbe est morphologiquement au singulier, mais son sujet n’est pas exprimé dans ce fragment et le contexte précédent présente des peuples au pluriel. Le français emploie le pluriel collectif sans introduire explicitement Balak; «contre lui» préserve le suffixe singulier qui traite Israël collectivement.
- source_word: לְקַלְלוֹ
  choice: pour le maudire
  rationale: Le suffixe hébreu est au masculin singulier et renvoie à Israël considéré comme une entité collective; le français peut conserver naturellement ce singulier après «Israël».
- source_word: וַיַּהֲפֹךְ
  choice: a changé
  rationale: Dans cette construction de transformation, «changer ... en ...» est idiomatique et précis en français.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le suffixe possessif de première personne du pluriel est explicite et doit être conservé.
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: la malédiction en bénédiction
  rationale: La construction française «changer X en Y» restitue clairement le passage d’un état à l’autre et le contraste hébreu.
theological_decisions:
- issue: Désignation filiale d’Israël
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: L’hébreu emploie explicitement une expression filiale masculine. La traduction la conserve sans la neutraliser.
- issue: Singulier collectif dans les pronoms visant Israël
  choice: contre lui ... pour le maudire
  alternative: contre eux ... pour les maudire
  rationale: Les suffixes hébreux sont au singulier et présentent Israël comme une entité collective. Comme «Israël» peut naturellement recevoir le pronom «lui» en français, la forme source peut être conservée; une note explicite cette valeur collective.
- issue: Sujet singulier de «engager» dans le texte massorétique
  choice: avaient engagé
  alternative: il avait engagé
  rationale: La forme verbale hébraïque est singulière, mais le sujet n’est pas nommé dans ce fragment. Le pluriel français suit les peuples évoqués par le contexte immédiat sans identifier implicitement le sujet à Balak; la note signale la forme singulière afin de préserver l’ambiguïté textuelle.
translation_notes:
  register: Français international actuel, digne et lisible. «Venir à la rencontre» garde la scène concrète; «fils d’Israël» maintient la forme hébraïque. La ponctuation divise la longue coordination pour une lecture naturelle sans modifier la logique du verset.
