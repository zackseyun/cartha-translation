  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: fr
  text: Alors j’ai donné l’ordre[a], et ils ont purifié les salles. Puis j’y ai remis les objets de la maison de Dieu, ainsi que l’offrande de céréales et l’oliban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai dit ». Dans ce contexte, ces paroles constituent un ordre qui est aussitôt exécuté.'
    reason: lexical_alternative
  - marker: b
    text: L’oliban est une résine aromatique employée comme encens.
    reason: lexical_precision
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Alors j’ai donné l’ordre
  rationale: Le verbe signifie littéralement « j’ai dit », mais le contexte montre qu’il s’agit d’une directive immédiatement exécutée. « Donner l’ordre » en restitue naturellement la force, tandis que « alors » rend la progression narrative.
- source_word: וַיְטַהֲרוּ
  choice: l’on a purifié
  rationale: טהר peut désigner une purification rituelle aussi bien qu’un nettoyage. « Purifier » conserve ici la dimension cultuelle liée aux salles du temple.
- source_word: הַלְּשָׁכוֹת
  choice: les salles
  rationale: לשכה désigne des pièces ou salles dans l’enceinte du temple. « Salles » est naturel en français moderne sans préciser indûment qu’il s’agissait uniquement de réserves.
- source_word: וָאָשִׁיבָה שָּׁם
  choice: Puis j’y ai remis
  rationale: La forme causative de שוב exprime l’action de faire revenir ou de remettre. « J’y ai remis » rend à la fois le retour des objets et l’adverbe שם, « là ».
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: les objets de la maison de Dieu
  rationale: כְּלִי est un terme large désignant des objets, ustensiles ou récipients. « Objets » évite de limiter le sens aux seuls vases, tandis que « maison de Dieu » préserve l’expression hébraïque.
- source_word: אֶת הַמִּנְחָה
  choice: ainsi que l’offrande de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne l’offrande végétale, traditionnellement composée de farine ou de céréales. « Ainsi que » marque naturellement l’ajout aux objets remis en place.
- source_word: וְהַלְּבוֹנָה
  choice: et l’encens
  rationale: לְבוֹנָה désigne précisément l’oliban, c’est-à-dire le frankincense. « Encens » est toutefois le terme courant et immédiatement compréhensible en français biblique moderne; une note en précise la nature.
