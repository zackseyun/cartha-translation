  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’ordre, la purification des pièces et la remise en place des biens cultuels sont conservés. Toutefois, le sujet pluriel explicite de וַיְטַהֲרוּ (« ils purifièrent ») est neutralisé par « l’on a purifié », et לְבוֹנָה désigne spécifiquement l’oliban plutôt que l’encens en général.'
  naturalness: Le français est clair, moderne et d’un registre approprié. « Ils ont purifié les salles » est tout aussi naturel que la tournure impersonnelle et correspond plus directement au texte source. « Oliban » est précis; une note courte en assure l’accessibilité.
  terminology: « Maison de Dieu », « off rande de céréales », « salles » et « objets » conviennent au contexte cultuel et restent sans surinterprétation. « Oliban » doit remplacer « encens », qui est un terme plus large que le mot hébreu.
