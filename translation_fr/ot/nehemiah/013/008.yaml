  text: וַ/יֵּ֥רַֽע לִ֖/י מְאֹ֑ד וָֽ/אַשְׁלִ֜יכָ/ה אֶֽת כָּל כְּלֵ֧י בֵית טוֹבִיָּ֛ה הַ/ח֖וּץ מִן הַ/לִּשְׁכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/008.yaml
  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: fr
  text: Cela me déplut beaucoup, et je jetai hors de la pièce[a] tous les biens de la maison de Tobie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit d’une pièce située dans l’ensemble du temple.
    reason: cultural_note
  - marker: b
    text: 'Ou : « tous les objets de la maison de Tobie ». Le terme hébreu peut désigner des objets, des ustensiles, du mobilier, du matériel ou des biens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: J’en fus profondément contrarié
  rationale: L’expression idiomatique indique que la situation déplut fortement à Néhémie. Cette formulation conserve la réaction personnelle et son intensité sans préciser davantage la nature de l’émotion.
- source_word: וָאַשְׁלִיכָה
  choice: je jetai
  rationale: Le verbe hiphil de שלך exprime ici une action énergique consistant à jeter ou faire sortir; « jetai » en garde la force dans un français naturel.
- source_word: כָּל
  choice: toutes
  rationale: Le terme a une portée exhaustive, naturellement rendue par « toutes » devant « les affaires ».
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: les affaires de la maison de Tobie
  rationale: כְּלִי peut désigner des objets, ustensiles, équipements, meubles ou biens. « Affaires » préserve cette ampleur sémantique, tandis que « maison » maintient l’ambiguïté possible entre maisonnée et ensemble domestique.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: hors de la salle
  rationale: La construction marque le déplacement vers l’extérieur depuis la pièce. « Hors de » rend ce mouvement, et « salle » convient à une pièce du complexe du temple sans imposer la fonction plus précise de magasin.
