source:
  edition: WLC
  text: וְ/לָ/כֶ֣ם הֲ/נִשְׁמַ֗ע לַ/עֲשֹׂת֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את לִ/מְעֹ֖ל בֵּֽ/אלֹהֵ֑י/נוּ לְ/הֹשִׁ֖יב נָשִׁ֥ים נָכְרִיּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: fr
  text: Allons-nous donc vous écouter[a] et commettre toute cette grande faute, en étant infidèles envers notre Dieu en épousant des femmes étrangères[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous obéir ». Le verbe hébreu peut signifier écouter quelqu’un, tenir compte de lui ou se conformer à ce qu’il demande.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « faire habiter des femmes étrangères » ; dans ce contexte, il s’agit de les prendre pour épouses.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע ... וְלָכֶם
  choice: Allons-nous donc vous écouter
  rationale: Le nifal de שׁמע, construit ici avec לָכֶם, peut exprimer le fait d’écouter quelqu’un au sens de suivre son exemple ou de se conformer à sa conduite. La question rhétorique et la continuité avec le verset précédent sont rendues naturellement par « donc ».
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: et commettre un mal aussi grave
  rationale: En français, « commettre un mal » exprime idiomatiquement l’action morale désignée par עשה. « Un mal aussi grave » restitue la force conjointe de כָּל, הַגְּדוֹלָה et הַזֹּאת sans le calque peu naturel « tout ce grand mal ».
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: en étant infidèles envers notre Dieu
  rationale: מעל désigne une rupture de fidélité ou une conduite déloyale, souvent dans le cadre de la relation avec Dieu. « Être infidèles envers » en conserve la portée relationnelle sans imposer un vocabulaire rituel technique.
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: par le fait d’épouser des femmes étrangères
  rationale: Le hifil de ישׁב signifie littéralement « faire habiter ». Avec « des femmes étrangères » dans ce contexte matrimonial, il désigne leur intégration au foyer comme épouses. La formulation choisie communique clairement ce sens contextuel tout en signalant le littéral en note.
theological_decisions:
- issue: Portée de לִמְעֹל בֵּאלֹהֵינוּ
  choice: Une infidélité relationnelle envers Dieu
  alternative: Une faute générale ou une profanation rituelle contre Dieu
  rationale: Le verbe מעל porte l’idée de déloyauté et de rupture de confiance, fréquemment dans un contexte d’alliance. La traduction maintient ce poids théologique sans réduire la faute à une catégorie exclusivement rituelle.
- issue: Nature de l’union avec les נָשִׁים נָכְרִיּוֹת
  choice: Épouser des femmes étrangères
  alternative: Faire habiter des femmes étrangères
  rationale: Le contexte immédiat concerne les mariages avec des femmes issues des peuples voisins. « Épouser » explicite la référence matrimoniale sans ajouter de jugement confessionnel sur les unions mixtes au-delà de la situation décrite dans le passage.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique conserve le ton indigné de Néhémie. « Des femmes étrangères » maintient la désignation du texte source, tandis que la note préserve l’image littérale de leur installation dans le foyer.
