  text: וְ֠/לֶחֶם מִ/שָּׁמַ֜יִם נָתַ֤תָּה לָ/הֶם֙ לִ/רְעָבָ֔/ם וּ/מַ֗יִם מִ/סֶּ֛לַע הוֹצֵ֥אתָ לָ/הֶ֖ם לִ/צְמָאָ֑/ם וַ/תֹּ֣אמֶר לָ/הֶ֗ם לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר נָשָׂ֥אתָ אֶת יָדְ/ךָ֖ לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: fr
  text: Tu leur as donné du pain venu du ciel pour apaiser leur faim, et tu as fait sortir pour eux de l’eau du rocher pour étancher leur soif. Tu leur as dit d’entrer dans le pays et d’en prendre possession, ce pays que tu avais juré de leur donner[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « que tu avais levé ta main pour le leur donner »; « lever la main » est une expression de serment. Le pronom « le » renvoie au pays.
    reason: Conserve l’image concrète de l’expression hébraïque tout en rendant dans le texte principal son sens idiomatique naturel.
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: du pain venu du ciel
  rationale: Conserve l’image concrète du « pain » plutôt que d’expliciter la manne; « venu du ciel » exprime naturellement l’origine marquée par מִן.
- source_word: לִרְעָבָם
  choice: pour apaiser leur faim
  rationale: Rend la relation exprimée par לְ dans un français naturel et fait ressortir la fonction du don sans modifier le sens.
- source_word: מַיִם מִסֶּלַע הוֹצֵאתָ
  choice: tu as fait sortir pour eux de l’eau du rocher
  rationale: « Faire sortir » conserve la valeur causative du hiphil de יצא. L’article français convient à l’épisode connu du rocher, bien que le nom hébreu soit sans article.
- source_word: לִצְמָאָם
  choice: pour étancher leur soif
  rationale: Formulation française idiomatique, parallèle à « pour apaiser leur faim », qui exprime la réponse apportée à leur besoin.
- source_word: וַתֹּאמֶר לָהֶם
  choice: tu leur as dit
  rationale: Reste fidèle au sens ordinaire de אמר sans renforcer indûment le verbe en « ordonner ».
- source_word: לָבוֹא לָרֶשֶׁת
  choice: d’entrer dans le pays et d’en prendre possession
  rationale: 'Rend distinctement les deux infinitifs: l’entrée, puis la prise de possession. La coordination est naturelle en français et ne transforme pas ירשׁ en héritage passif.'
- source_word: נָשָׂאתָ אֶת יָדְךָ
  choice: tu avais juré, la main levée
  rationale: Exprime clairement la valeur idiomatique du serment tout en conservant l’image corporelle propre à l’hébreu.
- source_word: לָתֵת לָהֶם
  choice: de leur donner
  rationale: Rend directement et naturellement la proposition infinitive hébraïque.
theological_decisions:
- issue: L’image anthropomorphique du geste de serment divin
  choice: « tu avais juré, la main levée » dans le texte principal
  alternative: « tu avais levé la main pour le leur donner » ou simplement « tu avais juré de leur donner »
  rationale: Cette formulation communique le sens réel de l’expression hébraïque sans effacer son image concrète ni produire en français une phrase obscure. Elle préserve ainsi la solennité du serment lié au don du pays.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme entre la faim et la soif est maintenu par deux expressions idiomatiques. La répétition de « pays » clarifie l’antécédent après « en prendre possession » et donne à la dernière proposition une cadence naturelle.
