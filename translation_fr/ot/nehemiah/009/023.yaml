    issue: Construction relative et infinitive maladroite dans la seconde moitié du verset.
    rationale: « le pays dont tu avais dit à leurs pères qu’ils y entreraient » est grammaticalement pesant et moins fidèle à לָבוֹא לָרָשֶׁת, deux infinitifs dépendant de « tu avais dit ». « le pays où tu avais dit à leurs pères d’entrer pour en prendre possession » est idiomatique et conserve la structure.
  revised_text: Tu as rendu leurs enfants aussi nombreux que les étoiles du ciel[a], et tu les as fait entrer dans le pays où tu avais dit à leurs pères d’entrer pour en prendre possession[b].
