  text: וּ/בְנֵי/הֶ֣ם הִרְבִּ֔יתָ כְּ/כֹכְבֵ֖י הַ/שָּׁמָ֑יִם וַ/תְּבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר אָמַ֥רְתָּ לַ/אֲבֹתֵי/הֶ֖ם לָ/ב֥וֹא לָ/רָֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: fr
  text: Tu as rendu leurs enfants aussi nombreux que les étoiles du ciel[a], et tu les as fait entrer dans le pays où tu avais dit à leurs pères d’entrer pour en prendre possession[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tu as multiplié leurs fils comme les étoiles du ciel. » « Fils » peut ici désigner plus largement les enfants ou les descendants. Cette expression rappelle la promesse faite aux patriarches.'
    reason: lexical_alternative; cross_reference
  - marker: b
    text: 'Ou : « pour en hériter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: leurs enfants
  rationale: בנים peut désigner les fils au sens strict ou, collectivement, les enfants et la descendance. Dans ce contexte de multiplication d’un peuple, « leurs enfants » garde l’image familiale sans la limiter aux hommes.
- source_word: הִרְבִּיתָ
  choice: tu as rendu ... aussi nombreux
  rationale: Le hiphil de רבה exprime ici le fait de rendre nombreux. Cette tournure est naturelle en français et s’accorde clairement avec la comparaison introduite par « que ».
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: que les étoiles du ciel
  rationale: Cette formulation conserve l’écho verbal de la promesse faite aux patriarches tout en étant idiomatique en français moderne.
- source_word: וַתְּבִיאֵם
  choice: tu les as fait entrer
  rationale: Le hiphil de בוא signifie faire venir ou faire entrer. « Faire entrer » rend ici explicitement le mouvement vers l’intérieur du pays.
- source_word: אֶל הָאָרֶץ
  choice: dans le pays
  rationale: Avec « faire entrer », la préposition française « dans » exprime naturellement l’entrée sur le territoire.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: dont tu avais dit à leurs pères
  rationale: Le relatif rattache le pays à la parole antérieure de Dieu adressée aux pères. Le plus-que-parfait marque naturellement cette antériorité.
- source_word: לָבוֹא לָרָשֶׁת
  choice: qu’ils y entreraient pour en prendre possession
  rationale: Les infinitifs expriment le contenu ou la finalité de la parole divine. « Prendre possession » rend le sens contextuel de ירשׁ sans imposer le sens possible d’« hériter ».
theological_decisions:
- issue: Écho de la promesse faite aux patriarches
  choice: Conserver « les étoiles du ciel » et « leurs pères »
  alternative: Employer des formulations plus générales comme « les étoiles » et « leurs ancêtres »
  rationale: Le vocabulaire rappelle intentionnellement la promesse patriarcale. La traduction maintient cet écho sans ajouter une interprétation explicite au texte.
- issue: Sens de ירשׁ dans la prise du pays
  choice: « en prendre possession »
  alternative: « en hériter »
  rationale: Le verbe peut exprimer l’héritage ou la prise de possession. Ici, le mouvement d’entrée dans le pays favorise « prendre possession », tout en signalant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est maintenu dans cette prière adressée directement à Dieu. La formulation préserve le parallélisme narratif et l’écho de la promesse patriarcale.
