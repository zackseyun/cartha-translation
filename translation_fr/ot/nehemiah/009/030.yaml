source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: fr
  text: Pendant de nombreuses années, tu as été patient envers eux et tu les as avertis par ton Esprit, par l’intermédiaire de tes prophètes[a], mais ils n’ont pas écouté. Alors tu les as livrés au pouvoir des peuples des pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as témoigné contre eux par ton Esprit, par l’intermédiaire de tes prophètes ».'
    reason: Alternative lexicale conservant la nuance judiciaire possible de עוד.
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  choice: Pendant de nombreuses années, tu as été patient envers eux
  rationale: L’expression décrit une longue prolongation de la patience divine. Cette formulation française naturelle conserve l’idée de durée et de retenue du jugement.
- source_word: וַתָּעַד בָּם
  choice: tu les as avertis
  rationale: Le hifil de עוד peut exprimer le fait d’avertir ou de témoigner contre quelqu’un. Dans le contexte des appels prophétiques, « avertis » communique clairement la portée de cette action, tandis que la note conserve la nuance judiciaire.
- source_word: בְּרוּחֲךָ
  choice: par ton Esprit
  rationale: Dans ce contexte prophétique, רוּחַ désigne l’Esprit de Dieu comme agent de l’avertissement transmis par les prophètes.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: par l’intermédiaire de tes prophètes
  rationale: Littéralement « par la main de », cet idiome hébreu indique ici l’intermédiaire ou l’agent humain.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: mais ils n’ont pas prêté attention
  rationale: האזין signifie écouter attentivement, prêter l’oreille. La formulation rend le défaut d’attention ou d’obéissance sans accentuer au-delà du texte la notion de refus volontaire.
- source_word: וַתִּתְּנֵם בְּיַד
  choice: Alors tu les as livrés au pouvoir
  rationale: Le don « dans la main » de quelqu’un signifie la remise sous son autorité ou sa puissance. « Livrés au pouvoir » est idiomatique en français et explicite l’image.
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: des peuples des autres pays
  rationale: Le pluriel désigne les peuples de territoires étrangers ou environnants. L’ajout contextuel « autres » évite que le français évoque les populations internes d’un même pays.
theological_decisions:
- issue: Référent de « ton Esprit »
  choice: L’Esprit de Dieu comme agent de l’avertissement prophétique
  alternative: L’esprit de Dieu compris comme disposition ou souffle
  rationale: La construction « par ton Esprit, par l’intermédiaire de tes prophètes » présente le souffle ou Esprit divin comme la source agissante de leur message, sans préciser davantage sa nature.
- issue: Portée de וַתָּעַד בָּם
  choice: tu les as avertis
  alternative: tu as témoigné contre eux
  rationale: Le verbe porte à la fois une nuance d’avertissement et de témoignage à charge. Le texte principal privilégie le sens communicatif dans ce contexte, et la note préserve la nuance judiciaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. « Par l’intermédiaire de » rend clairement l’agent prophétique; « livrés au pouvoir » naturalise l’idiome hébreu de la main sans en perdre le sens.
