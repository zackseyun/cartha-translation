    text: 'Ou : « tu as témoigné contre eux par ton Esprit, par l’intermédiaire de tes prophètes ».'
    reason: Alternative lexicale conservant la nuance judiciaire possible de עוד.
  revision_rationale: La révision supprime l’ajout interprétatif « autres » et emploie « n’ont pas écouté », plus proche du verbe hébreu. Le choix principal « avertis » et sa note alternative préservent de manière équilibrée la double nuance d’avertissement et de témoignage.
