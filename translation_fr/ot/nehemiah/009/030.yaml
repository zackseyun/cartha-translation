- from: Pendant de nombreuses années, tu as été patient envers eux et tu les as avertis par ton Esprit, par l’intermédiaire de tes prophètes[a], mais ils n’ont pas prêté attention. Alors tu les as livrés au pouvoir des peuples des autres pays.
  to: Pendant de nombreuses années, tu as été patient envers eux et tu les as avertis par ton Esprit, par l’intermédiaire de tes prophètes[a], mais ils n’ont pas écouté. Alors tu les as livrés au pouvoir des peuples des pays.
  rationale: La révision supprime l’ajout interprétatif « autres » et emploie « n’ont pas écouté », plus proche du verbe hébreu. Le choix principal « avertis » et sa note alternative préservent de manière équilibrée la double nuance d’avertissement et de témoignage.
