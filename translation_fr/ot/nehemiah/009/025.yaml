source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: fr
  text: Ils s’emparèrent de villes fortifiées et d’une terre fertile[a]. Ils prirent possession de maisons remplies de toutes sortes de biens, de citernes taillées, de vignes, d’oliviers et d’arbres fruitiers en abondance. Ils mangèrent, furent rassasiés, prirent de l’embonpoint et se délectèrent de ta grande bonté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une terre grasse »; c’est-à-dire une terre riche et fertile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: ils s’emparèrent
  rationale: Le verbe לכד exprime ici la prise militaire de villes; « s’emparer de » est naturel et précis en français.
- source_word: עָרִים בְּצֻרוֹת
  choice: villes fortifiées
  rationale: Rend directement l’idée de villes protégées par des fortifications.
- source_word: אֲדָמָה שְׁמֵנָה
  choice: terre fertile
  rationale: Littéralement « terre grasse »; l’expression hébraïque désigne un sol riche et productif.
- source_word: וַיִּירְשׁוּ
  choice: ils prirent possession
  rationale: ירשׁ peut signifier hériter, déposséder ou prendre possession; le contexte met l’accent sur l’appropriation du pays conquis.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: maisons remplies de toutes sortes de biens
  rationale: Dans ce contexte matériel, טוּב désigne les bonnes choses ou richesses disponibles; cette formulation évite l’ambiguïté morale de « tout bien ».
- source_word: בֹּרוֹת חֲצוּבִים
  choice: citernes taillées dans le roc
  rationale: Les בֹּרוֹת sont des réservoirs d’eau, et חצובים indique qu’ils ont été creusés ou taillés; « dans le roc » explicite naturellement le procédé impliqué par le verbe.
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל
  choice: vignes, oliviers et arbres fruitiers
  rationale: Équivalents français courants et concrets pour ces ressources agricoles.
- source_word: לָרֹב
  choice: en abondance
  rationale: Conserve l’idée de grande quantité sans alourdir l’énumération.
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: ils mangèrent, furent rassasiés
  rationale: שׂבע signifie parvenir à satiété; « furent rassasiés » garde l’image concrète et un registre biblique actuel.
- source_word: וַיַּשְׁמִינוּ
  choice: prirent de l’embonpoint
  rationale: Préserve l’image physique de « devenir gras » tout en évitant la rudesse ou la connotation péjorative possible de « devinrent gros ».
- source_word: וַיִּתְעַדְּנוּ
  choice: vécurent dans les délices
  rationale: Le verbe exprime une jouissance raffinée ou une vie d’abondance; cette formulation conserve sa force sans introduire explicitement un jugement moral.
theological_decisions:
- issue: Rapport entre la jouissance d’Israël et בְּטוּבְךָ הַגָּדוֹל
  choice: grâce à ta grande bonté
  alternative: dans ta grande bonté / de tes grands biens
  rationale: Le syntagme attribue l’abondance dont jouit le peuple à la bonté généreuse de Dieu. « Grâce à » rend naturellement la valeur circonstancielle ou causale possible de ב, tandis que « bonté » préserve une portée plus large que les seuls biens matériels.
- issue: Éventuelle connotation morale de וַיַּשְׁמִינוּ וַיִּתְעַדְּנוּ
  choice: image d’abondance sans condamnation explicite
  alternative: formulation suggérant l’excès coupable ou la complaisance
  rationale: Les verbes décrivent ici les effets de la prospérité; le verset lui-même ne formule pas encore de jugement explicite. La traduction conserve les images sans ajouter une condamnation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif de la série de waw consécutifs est conservé par des propositions successives. « Villes fortifiées », « furent rassasiés » et « grande bonté » maintiennent une tonalité biblique sans archaïsme. Le seul appel de note [a] figure bien dans le texte.
