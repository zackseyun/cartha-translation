language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: fr
  text: Mais toi, dans ton immense compassion[a], tu ne les as pas abandonnés dans le désert. La colonne de nuée ne se retira pas d’au-dessus d’eux pendant le jour, pour les conduire sur le chemin, ni la colonne de feu pendant la nuit, pour les éclairer, eux et le chemin qu’ils devaient suivre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans tes nombreuses compassions » ; le nom hébreu est au pluriel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: dans ton immense compassion
  rationale: רַחֲמִים est morphologiquement pluriel et désigne ici la compassion ou la miséricorde abondante de Dieu. Le singulier collectif est plus naturel en français moderne; la note conserve l’information formelle du pluriel hébreu.
- source_word: עֲזַבְתָּם
  choice: tu ne les as pas abandonnés
  rationale: « Abandonner » exprime clairement l’idée de laisser ou délaisser, sans archaïsme.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans le contexte de la marche d’Israël, « désert » est la désignation française courante de la région inculte évoquée par מִדְבָּר.
- source_word: עַמּוּד הֶעָנָן
  choice: la colonne de nuée
  rationale: Formulation biblique transparente qui préserve le parallèle avec la colonne de feu.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: ne s’est pas éloignée de dessus eux
  rationale: Cette formulation conserve à la fois le mouvement d’éloignement exprimé par סוּר et la relation spatiale de מֵעֲלֵיהֶם.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: pour les conduire sur le chemin
  rationale: Le hiphil de נחה signifie « conduire, guider »; « sur le chemin » rend naturellement la progression indiquée par בְּ.
- source_word: עַמּוּד הָאֵשׁ
  choice: la colonne de feu
  rationale: Rend directement le groupe construit et maintient le parallélisme avec la colonne de nuée.
- source_word: לְהָאִיר לָהֶם וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: pour les éclairer, eux et le chemin qu’ils devaient suivre
  rationale: La formulation française rend לָהֶם comme les bénéficiaires de la lumière et maintient וְאֶת הַדֶּרֶךְ comme élément coordonné explicitement éclairé, sans transformer ce dernier en simple complément de lieu.
theological_decisions:
- issue: Langage de la compassion divine
  choice: Singulier collectif « ton immense compassion », avec note sur le pluriel hébreu
  alternative: « tes nombreuses compassions »
  rationale: Le pluriel littéral serait peu idiomatique en français. Le singulier collectif transmet le sens sans réduire la richesse du terme, laquelle est signalée en note.
- issue: Modalité du chemin à suivre
  choice: « qu’ils devaient suivre »
  alternative: « sur lequel ils marcheraient »
  rationale: La tournure exprime la destination pratique de la guidance sans introduire un commandement divin plus explicite que ne le fait l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre la colonne de nuée le jour et la colonne de feu la nuit est conservé, ainsi que l’accent initial mis sur « toi ».
