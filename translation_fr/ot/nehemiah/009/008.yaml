  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: fr
  text: Tu as trouvé son cœur fidèle devant toi et tu as conclu avec lui une alliance pour donner le pays des Cananéens, des Hittites, des Amorites, des Perizzites, des Jébusites et des Guirgashites — pour le donner à sa descendance[a]. Tu as accompli tes paroles[b], car tu es juste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un nom collectif singulier, littéralement « sa semence », qui peut aussi se traduire par « sa postérité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tu as établi » ou « confirmé tes paroles ».
    reason: lexical_alternative
  - marker: c
    text: Ou « car tu es droit ». Le terme peut exprimer aussi bien la rectitude que la justice.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: Tu as trouvé son cœur fidèle devant toi
  rationale: « Trouver » conserve le sens direct de מצא, tandis que « cœur » désigne ici la personne intérieure, notamment sa disposition et sa volonté. « Devant toi » préserve l’expression relationnelle et évaluative de l’hébreu.
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: et tu as conclu avec lui une alliance
  rationale: L’expression כרת ברית signifie littéralement « couper une alliance », mais « conclure une alliance » est l’idiome français naturel et précis.
- source_word: לָתֵת אֶת־אֶרֶץ הַכְּנַעֲנִי ... הַגִּרְגָּשִׁי
  choice: pour donner le pays des Cananéens ... et des Guirgashites
  rationale: « Pays » rend naturellement אֶרֶץ. Les gentilés hébreux sont des singuliers collectifs; le pluriel français désigne clairement chacun de ces peuples.
- source_word: לָתֵת לְזַרְעוֹ
  choice: pour le donner à sa descendance
  rationale: La répétition de « donner » reproduit la reprise hébraïque. « Descendance » rend le collectif singulier זֶרַע sans imposer un seul individu ni perdre la valeur collective.
- source_word: וַתָּקֶם אֶת־דְּבָרֶיךָ
  choice: Tu as accompli tes paroles
  rationale: Avec « paroles » comme complément, קום exprime ici leur réalisation effective. « Accompli » convient au contexte de la promesse tenue tout en conservant le pluriel דְּבָרֶיךָ.
- source_word: כִּי צַדִּיק אָתָּה
  choice: car tu es juste
  rationale: « Juste » est le rendu français naturel de צַדִּיק appliqué à Dieu et peut exprimer à la fois sa rectitude morale et sa justice. « Car » conserve la fonction explicative de כִּי.
theological_decisions:
- issue: Portée de זֶרַע dans la promesse faite à Abraham
  choice: sa descendance
  alternative: sa postérité / sa semence
  rationale: Le nom hébreu est un collectif singulier. « Descendance » garde cette portée ouverte sans la réduire arbitrairement à un individu ni employer le calque peu naturel « semence ».
- issue: Sens de קום appliqué aux paroles divines
  choice: tu as accompli tes paroles
  alternative: tu as établi / confirmé tes paroles
  rationale: Le contexte célèbre l’exécution de la promesse, mais le verbe peut aussi évoquer le fait de rendre les paroles fermes ou de les confirmer; cette nuance est signalée en note.
- issue: Traduction de צַדִּיק à propos de Dieu
  choice: juste
  alternative: droit
  rationale: « Juste » conserve en français une portée morale et judiciaire assez large. « Droit » met davantage l’accent sur la rectitude; la note maintient cette nuance possible sans réduire le terme à une seule conception de la justice divine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la répétition hébraïque de « donner » et le pluriel « tes paroles », tout en employant les formes françaises usuelles des noms de peuples.
