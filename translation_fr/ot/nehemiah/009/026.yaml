source:
  edition: WLC
  text: וַ/יַּמְר֨וּ וַֽ/יִּמְרְד֜וּ בָּ֗/ךְ וַ/יַּשְׁלִ֤כוּ אֶת תּוֹרָֽתְ/ךָ֙ אַחֲרֵ֣י גַוָּ֔/ם וְ/אֶת נְבִיאֶ֣י/ךָ הָרָ֔גוּ אֲשֶׁר הֵעִ֥ידוּ בָ֖/ם לַ/הֲשִׁיבָ֣/ם אֵלֶ֑י/ךָ וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדוֹלֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: fr
  text: Mais ils se montrèrent réfractaires et se révoltèrent contre toi[a]. Ils jetèrent ta loi derrière leur dos[b]. Ils tuèrent tes prophètes, qui les avertissaient solennellement[c] afin de les ramener à toi. Ils commirent de graves outrages[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « refusèrent d’obéir », « se montrèrent arrogants » ou « te provoquèrent »; le verbe hébreu évoque une résistance délibérée et provocante.
    reason: lexical_alternative
  - marker: b
    text: Ou « ton instruction » plutôt que « ta loi ».
    reason: lexical_alternative
  - marker: c
    text: Ou « témoignaient contre eux »; l’hébreu peut désigner un avertissement solennel ou un témoignage à charge.
    reason: lexical_alternative
  - marker: d
    text: Ou « de grands blasphèmes », « de graves insultes » ou « de grandes provocations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: ils se montrèrent réfractaires
  rationale: Le verbe מרה exprime ici une résistance volontaire et provocante. « Se montrèrent réfractaires » le distingue du verbe suivant, qui désigne explicitement la révolte.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: se révoltèrent contre toi
  rationale: מרד désigne ouvertement la rébellion; « contre toi » conserve l’orientation personnelle exprimée par בָּךְ.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: ils jetèrent ta loi derrière leur dos
  rationale: La formulation garde l’image concrète et méprisante de l’hébreu au lieu de la réduire à l’idée d’ignorer la loi.
- source_word: תּוֹרָתְךָ
  choice: ta loi
  rationale: Dans cette confession retraçant l’histoire de l’alliance, « loi » est naturel et reconnaissable, tandis qu’une note conserve le sens possible d’« instruction ».
- source_word: נְבִיאֶיךָ
  choice: tes prophètes
  rationale: Équivalent français usuel et direct.
- source_word: הֵעִידוּ בָם
  choice: les avertissaient solennellement
  rationale: Le hiphil de עוּד peut évoquer le témoignage porté contre quelqu’un ou une mise en garde insistante. Le contexte de rappel à Dieu favorise ici l’idée d’un avertissement solennel sans supprimer l’autre nuance.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: afin de les ramener à toi
  rationale: La construction causative de שוב indique que l’intervention des prophètes visait à faire revenir le peuple vers Dieu.
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: de graves outrages
  rationale: Le nom désigne des actes de mépris ou d’insulte envers Dieu, et ne se limite pas nécessairement à des paroles. « Graves outrages » préserve cette largeur sémantique et la force de l’expression.
theological_decisions:
- issue: Différenciation de וַיַּמְרוּ et וַיִּמְרְדוּ
  choice: « se montrèrent réfractaires et se révoltèrent »
  alternative: « désobéirent et se révoltèrent » ou « se montrèrent arrogants et se révoltèrent »
  rationale: Les deux verbes proches sont maintenus distincts afin de préserver la progression rhétorique de la résistance obstinée à la rébellion ouverte, sans leur attribuer une distinction doctrinale artificielle.
- issue: Portée de נֶאָצוֹת
  choice: « de graves outrages »
  alternative: « de grands blasphèmes », « de graves insultes » ou « de grandes provocations »
  rationale: Le contexte présente une offense dirigée contre Dieu, mais le terme hébreu est plus large que le seul blasphème verbal. « Outrages » garde à la fois cette orientation et cette amplitude.
- issue: Valeur de הֵעִידוּ בָם
  choice: « les avertissaient solennellement »
  alternative: « témoignaient contre eux » ou « les adjuraient »
  rationale: La finalité explicitement restauratrice — les ramener à Dieu — rend l’avertissement solennel naturel en français, tandis que la note signale la nuance judiciaire possible du témoignage à charge.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme bref conserve l’accumulation des fautes. Les images concrètes de l’hébreu sont maintenues, notamment « derrière leur dos », sans archaïsme inutile.
