source:
  edition: WLC
  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: fr
  text: Pourtant, tu es juste dans tout ce qui nous est arrivé, car tu as agi avec fidélité, mais nous avons fait le mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Pourtant, tu
  rationale: La conjonction introduit ici un contraste avec la culpabilité reconnue par le peuple. « Pourtant » rend naturellement cette valeur adversative tout en conservant l’adresse directe.
- source_word: צַדִּיק
  choice: juste
  rationale: Le terme affirme la droiture morale de Dieu à l’égard de tout ce qui a frappé le peuple. En français courant et théologique, « juste » exprime clairement cette droiture sans réduire le propos à une simple conformité juridique.
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: dans tout ce qui nous est arrivé
  rationale: La préposition indique le domaine ou le rapport dans lequel Dieu est déclaré juste. Cette formulation française est idiomatique et reste proche de la construction hébraïque.
- source_word: כִּי
  choice: car
  rationale: 'La conjonction introduit le fondement de l’affirmation précédente : Dieu est juste, puisqu’il a agi avec fidélité, contrairement au peuple.'
- source_word: אֱמֶת עָשִׂיתָ
  choice: tu as agi avec fidélité
  rationale: Littéralement, la tournure associe « vérité/fidélité » au verbe « faire ». Dans ce contexte, elle décrit une conduite fidèle et fiable; « agir avec fidélité » préserve ce sens dans un français naturel.
- source_word: וַ/אֲנַחְנוּ
  choice: tandis que nous, nous
  rationale: La conjonction oppose nettement la conduite du peuple à celle de Dieu. « Tandis que » fait ressortir ce contraste, et la reprise du pronom conserve l’emphase de l’hébreu.
- source_word: הִרְשָׁעְנוּ
  choice: avons agi avec méchanceté
  rationale: La forme verbale désigne le fait de se conduire de manière coupable ou mauvaise. Cette traduction garde la valeur active du verbe et forme un parallèle avec « tu as agi avec fidélité ».
theological_decisions:
- issue: La justice de Dieu face aux malheurs subis par Israël
  choice: Dieu est déclaré juste dans tout ce qui est arrivé au peuple.
  alternative: Dieu a eu raison de punir le peuple.
  rationale: Le texte confesse la justice de Dieu à l’égard des événements subis, mais ne précise pas ici tous leurs mécanismes punitifs. La traduction maintient cette affirmation et sa tension théologique sans ajouter une explication absente de l’hébreu.
- issue: Le contraste entre la fidélité divine et la faute humaine
  choice: « tu as agi avec fidélité, tandis que nous, nous avons agi avec méchanceté »
  alternative: « tu as fait la vérité, mais nous avons été coupables »
  rationale: La formulation retenue rend le parallélisme des conduites et conserve l’opposition théologique centrale, tout en exprimant idiomatiquement la tournure hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu dans la prière. La syntaxe met en relief le contraste entre « toi » et « nous » sans alourdir le verset.
