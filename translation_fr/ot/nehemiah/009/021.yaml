  text: וְ/אַרְבָּעִ֥ים שָׁנָ֛ה כִּלְכַּלְתָּ֥/ם בַּ/מִּדְבָּ֖ר לֹ֣א חָסֵ֑רוּ שַׂלְמֹֽתֵי/הֶם֙ לֹ֣א בָל֔וּ וְ/רַגְלֵי/הֶ֖ם לֹ֥א בָצֵֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: fr
  text: Pendant quarante ans, tu as pourvu à leurs besoins dans le désert ; ils n’ont manqué de rien. Leurs vêtements ne se sont pas usés, et leurs pieds n’ont pas gonflé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Voir Deutéronome 8.4.
    reason: cross_reference
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: tu as pourvu à leurs besoins
  rationale: Le polel de כלכל exprime ici une prise en charge durable et complète. Cette formulation française naturelle conserve l’idée de soutien et de provision sans la limiter à la nourriture.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région inhabitée et aride. « Désert » est la formulation courante et immédiatement compréhensible dans le contexte de la marche d’Israël.
- source_word: לֹא חָסֵרוּ
  choice: ils n’ont manqué de rien
  rationale: Cette tournure idiomatique rend naturellement en français l’absence totale de manque exprimée par la négation absolue.
- source_word: שַׂלְמֹתֵיהֶם
  choice: leurs vêtements
  rationale: שַׂלְמָה désigne un vêtement, parfois plus précisément un vêtement extérieur. « Vêtements » convient au pluriel collectif sans imposer une précision absente du contexte.
- source_word: לֹא בָלוּ
  choice: ne se sont pas usés
  rationale: בלה décrit la détérioration due à l’usage ou au temps ; « s’user » est le verbe français naturel pour des vêtements.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: et leurs pieds n’ont pas enflé
  rationale: בצק exprime ici le gonflement. La formulation est concise, naturelle et préserve l’affirmation concrète de leur conservation physique.
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: Pendant quarante ans
  rationale: La formulation marque clairement la durée de l’action. La conjonction initiale peut ne pas être rendue séparément en français, puisque le lien avec le contexte demeure évident.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Pourvoir à leurs besoins » évite une formulation trop étroite tout en restant accessible ; le parallélisme des trois affirmations de préservation est conservé.
