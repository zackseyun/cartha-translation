  terminology: « Signes et prodiges », « Pharaon » et « serviteurs » conviennent. « Agir avec arrogance » rend bien הֵזִידוּ dans un français moderne. La note doit éviter d’ajouter l’idée spécifique d’une conduite « délibérément excessive », qui n’est pas nécessaire à la valeur lexicale du verbe.
