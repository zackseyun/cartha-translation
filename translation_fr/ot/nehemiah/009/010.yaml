  to: Tu as accompli des signes et des prodiges contre Pharaon, contre tous ses serviteurs et contre tout le peuple de son pays, car tu savais qu’ils avaient agi avec arrogance[a] contre eux. Tu t’es ainsi fait un nom qui demeure jusqu’à ce jour.
  rationale: La révision renforce légèrement la valeur adversative de « contre eux », rend l’expression temporelle de façon plus proche du texte source par « jusqu’à ce jour », et resserre la note lexicale. Elle conserve l’ambiguïté voulue du pronom « eux », dont le contexte suggère les Israélites sans les nommer dans le verset.
