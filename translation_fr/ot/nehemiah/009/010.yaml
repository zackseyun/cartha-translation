source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֹתֹ֨ת וּ/מֹֽפְתִ֜ים בְּ/פַרְעֹ֤ה וּ/בְ/כָל עֲבָדָי/ו֙ וּ/בְ/כָל עַ֣ם אַרְצ֔/וֹ כִּ֣י יָדַ֔עְתָּ כִּ֥י הֵזִ֖ידוּ עֲלֵי/הֶ֑ם וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: fr
  text: Tu as accompli des signes et des prodiges contre Pharaon, contre tous ses serviteurs et contre tout le peuple de son pays, car tu savais qu’ils avaient agi avec arrogance[a] contre eux. Tu t’es ainsi fait un nom qui demeure jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec présomption » ou « avec insolence ». Le verbe hébreu peut décrire une conduite orgueilleuse, insolente ou présomptueuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Tu as accompli
  rationale: Le verbe signifie littéralement « donner », mais avec « signes et prodiges », le français idiomatique exprime l’action divine par « accomplir » sans en modifier le sens.
- source_word: אֹתֹת וּמֹפְתִים
  choice: des signes et des prodiges
  rationale: Cette expression consacrée conserve à la fois la valeur révélatrice des signes et le caractère extraordinaire des prodiges.
- source_word: בְּפַרְעֹה
  choice: contre Pharaon
  rationale: Dans ce contexte de jugement, la préposition בְּ désigne ceux que frappent les signes et prend une valeur adversative.
- source_word: וּבְכָל עֲבָדָיו
  choice: contre tous ses serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs, des fonctionnaires ou des esclaves. « Serviteurs » conserve cette ampleur sans préciser indûment leur rang.
- source_word: וּבְכָל עַם אַרְצוֹ
  choice: contre tout le peuple de son pays
  rationale: Cette formulation naturelle respecte la structure possessive de l’hébreu et rend אֶרֶץ par « pays » dans son sens territorial et politique.
- source_word: כִּי יָדַעְתָּ כִּי
  choice: car tu savais que
  rationale: Le premier כִּי introduit la cause, et le second la proposition complétive dépendant de « savais ».
- source_word: הֵזִידוּ
  choice: avaient agi avec arrogance
  rationale: Le verbe évoque une conduite orgueilleuse, insolente ou présomptueuse. « Agir avec arrogance » est actuel, clair et conserve la portée morale du terme.
- source_word: עֲלֵיהֶם
  choice: envers eux
  rationale: La formulation garde le pronom implicite du texte hébreu sans le remplacer par une désignation interprétative; dans le contexte, il renvoie très probablement aux Israélites.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: Tu t’es ainsi fait un nom
  rationale: L’expression idiomatique signifie acquérir une renommée. Le tour français conserve l’image hébraïque, tandis que « ainsi » exprime naturellement la conséquence portée par la coordination.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: qui demeure encore aujourd’hui
  rationale: Cette expression indique que la renommée établie alors subsiste jusqu’au présent du locuteur.
theological_decisions:
- issue: Référent de « eux » dans « ils avaient agi avec arrogance envers eux »
  choice: Conserver le pronom « eux »; il renvoie vraisemblablement au peuple d’Israël.
  alternative: Expliciter « envers ton peuple » ou comprendre l’arrogance comme dirigée plus généralement contre Dieu.
  rationale: Le contexte de l’Exode indique que Pharaon et les Égyptiens ont traité Israël avec arrogance. La conservation du pronom respecte toutefois l’implicite du texte et évite de résoudre silencieusement ce que l’hébreu ne nomme pas ici.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu dans la prière. La syntaxe reste proche de l’enchaînement hébreu tout en employant des expressions françaises naturelles.
