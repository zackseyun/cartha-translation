base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: fr
  text: Ils se levèrent à leur place[a] et lurent dans le livre de la Loi de Yahweh, leur Dieu, pendant un quart de la journée[b] ; pendant un autre quart, ils faisaient confession et se prosternaient devant Yahweh, leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’endroit où ils se tenaient », et peut-être « sur leur estrade ». L’expression hébraïque est condensée.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un quart de la journée […] et un quart » ; un quart de la journée fut consacré à la lecture, puis un autre à la confession et à la prosternation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: Ils se tinrent à leur place
  rationale: קום suivi de l’expression condensée עַל עָמְדָם décrit ici le fait de prendre ou garder sa position. Cette formulation est naturelle en français sans préciser à tort qu’il s’agissait d’une estrade.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: lurent dans le livre de la Loi
  rationale: Avec בְּסֵפֶר, קרא désigne la lecture d’un texte écrit. « Dans le livre » reproduit naturellement en français la construction hébraïque sans imposer « rouleau ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: רְבִעִית הַיּוֹם וּרְבִעִית
  choice: pendant un quart de la journée ; pendant un autre quart
  rationale: La seconde expression est elliptique et reprend la même unité temporelle. « Un autre quart » l’explicite sobrement en français.
- source_word: מִתְוַדִּים
  choice: ils confessaient leurs péchés
  rationale: Le participe hitpael exprime une action prolongée. Dans ce contexte pénitentiel, l’objet implicite de la confession est leurs péchés ; l’explicitation rend le sens idiomatique en français.
- source_word: וּמִשְׁתַּחֲוִים לַיהוָה
  choice: et se prosternaient devant Yahweh
  rationale: Le verbe conserve l’image concrète de la prosternation cultuelle. « Devant » exprime naturellement en français l’orientation de cet hommage envers Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme ; la translittération préserve le nom propre sans le remplacer par un titre.
- issue: Sens de מִשְׁתַּחֲוִים
  choice: se prosternaient
  alternative: adoraient
  rationale: « Se prosterner » maintient le geste corporel exprimé par l’hébreu tout en laissant le contexte indiquer sa valeur d’adoration.
- issue: Objet implicite de מִתְוַדִּים
  choice: confessaient leurs péchés
  alternative: faisaient confession
  rationale: Le contexte de Néhémie 9 rend les péchés implicitement objets de la confession. L’explicitation donne un français clair sans introduire une particularité confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple porte les actions narratives ponctuelles, tandis que l’imparfait rend la durée des deux participes hébreux. La répétition de « Yahweh, leur Dieu » est conservée.
