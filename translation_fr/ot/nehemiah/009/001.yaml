base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: fr
  text: Le vingt-quatrième jour de ce mois, les Israélites se rassemblèrent dans le jeûne, revêtus de toile de sac[a] et avec de la terre sur eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La toile de sac était une étoffe grossière portée en signe de deuil, d’humiliation ou de repentance.
    reason: cultural_note
  - marker: b
    text: Littéralement « de la terre sur eux » ; ils s’en étaient mis sur eux en signe de deuil et de repentance.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הַזֶּה
  choice: Le vingt-quatrième jour de ce mois
  rationale: La formule hébraïque de datation emploie un nombre cardinal, que le français rend naturellement par un ordinal. Le ו initial assure la continuité narrative sans exiger ici un « et » explicite.
- source_word: נֶאֶסְפוּ
  choice: se rassemblèrent
  rationale: Le nifal exprime ici le fait de se réunir; le pronominal français restitue naturellement sa valeur médio-réfléchie sans imposer un agent extérieur.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans ce contexte collectif, ce terme français courant restitue naturellement la désignation du peuple; « fils d’Israël » resterait possible mais sonnerait plus littéral et pourrait être compris comme visant seulement les hommes.
- source_word: בְּצוֹם
  choice: pour jeûner
  rationale: Le syntagme décrit le jeûne accompagnant le rassemblement. La formulation verbale est claire en français et ne modifie pas la valeur pénitentielle du contexte.
- source_word: וּבְשַׂקִּים
  choice: revêtus d’habits de toile grossière
  rationale: Le pluriel שַׂקִּים désigne des vêtements ou étoffes grossières portés en signe de deuil ou de repentance. Cette formulation est plus intelligible en français moderne que le calque « dans des sacs ».
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: et couverts de terre
  rationale: אֲדָמָה signifie ici terre ou sol placé sur les personnes. La traduction conserve cette image sans préciser qu’elle se trouvait sur leur tête, détail absent de l’hébreu.
