  source_fidelity: 'Le sens global est bien rendu : la date, le rassemblement, le jeûne et les deux signes de deuil sont présents. Toutefois, « pour jeûner » exprime plus nettement un but que le syntagme hébreu, qui décrit le rassemblement comme se tenant dans le jeûne. « Couverts de terre » peut aussi suggérer qu''ils étaient entièrement recouverts, alors que le texte dit seulement qu''il y avait de la terre sur eux.'
  naturalness: Le français est généralement fluide et adapté à un registre biblique moderne. « Dans le jeûne », « revêtus de toile de sac » et « avec de la terre sur eux » sont à la fois naturels, précis et moins interprétatifs.
  terminology: « Israélites » convient ici pour בני ישראל. « Toile de sac » est le terme français biblique usuel pour שקּים, tout en restant compréhensible. Les notes conservent l'explication culturelle sans attribuer à la terre une localisation non exprimée dans l'hébreu.
