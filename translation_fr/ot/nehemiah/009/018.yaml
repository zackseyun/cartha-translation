id: NEH.9.18
reference: Nehemiah 9:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֗ף כִּֽי עָשׂ֤וּ לָ/הֶם֙ עֵ֣גֶל מַסֵּכָ֔ה וַ/יֹּ֣אמְר֔וּ זֶ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר הֶעֶלְ/ךָ֖ מִ/מִּצְרָ֑יִם וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: fr
  text: 'Même lorsqu’ils se sont fait un veau en métal fondu[a] et ont dit : « Voici ton dieu, celui qui t’a fait monter d’Égypte », ils ont commis de graves outrages[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un veau en métal coulé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de grands blasphèmes » ou « de graves provocations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Même lorsqu’ils
  rationale: Dans le contexte, l’expression introduit une concession au sein du récit de la rébellion d’Israël malgré la fidélité de Dieu. « Même lorsqu’ils » conserve cette force et s’intègre naturellement à la phrase qui se poursuit au verset suivant.
- source_word: עָשׂוּ לָהֶם
  choice: se sont fait
  rationale: 'La tournure française rend la nuance d’intérêt personnel portée par לָהֶם : ils ont fabriqué l’objet pour eux-mêmes, en vue de leur propre usage cultuel.'
- source_word: עֵגֶל מַסֵּכָה
  choice: un veau en métal fondu
  rationale: מַסֵּכָה désigne une image obtenue par fonte. Cette formulation actuelle indique à la fois la forme du veau et sa fabrication comme idole, sans recourir au peu naturel « veau de fonte ».
- source_word: זֶה אֱלֹהֶיךָ
  choice: Voici ton dieu
  rationale: Le démonstratif et le suffixe sont au singulier dans le texte hébreu. La minuscule convient au veau idolâtre auquel la déclaration attribue faussement l’action divine.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: celui qui t’a fait monter d’Égypte
  rationale: Cette formulation garde l’image et la tournure traditionnelles de l’hébreu עלה מן dans le contexte de l’exode. « Celui qui » reprend naturellement l’antécédent masculin singulier.
- source_word: וַיַּעֲשׂוּ נֶאָצוֹת גְּדֹלוֹת
  choice: ils ont commis de graves outrages
  rationale: « Commettre » est l’association idiomatique naturelle avec « outrages ». Le nom נֶאָצוֹת évoque des actes de mépris et d’insulte envers Dieu ; « graves outrages » en conserve la portée sans la réduire aux seules paroles blasphématoires.
theological_decisions:
- issue: Nombre et statut du référent de אֱלֹהֶיךָ
  choice: ton dieu
  alternative: ton Dieu ; tes dieux
  rationale: La grammaire immédiate présente le veau au singulier, tandis que la minuscule signale qu’il s’agit d’une idole sans nier que les Israélites lui attribuent l’œuvre de Dieu. Le pluriel connu d’autres formulations du récit n’est pas imposé ici au texte massorétique.
- issue: Portée de נֶאָצוֹת
  choice: de graves outrages
  alternative: de grands blasphèmes ; de graves provocations
  rationale: Le terme peut couvrir plus largement des manifestations de mépris ou des affronts envers Dieu. « Outrages » préserve cette amplitude et la gravité théologique, sans limiter le sens à des paroles ni expliciter davantage que l’hébreu l’objet de ces actes.
