  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: fr
  text: Même nos rois, nos chefs, nos prêtres et nos pères[a] n’ont pas mis ta loi en pratique et n’ont prêté attention ni à tes commandements ni à tes témoignages[b], par lesquels tu les avais avertis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ». L’hébreu dit littéralement « nos pères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tes avertissements solennels ». Les mots hébreux traduits par « témoignages » et « avertis » sont de la même famille et évoquent un témoignage ou une mise en garde solennelle; la clause peut aussi être rendue « contre lesquels tu as témoigné ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Même
  rationale: Dans la continuité de l’énumération et de la confession, la conjonction accompagnée du marqueur d’objet ajoute avec emphase ces groupes responsables.
- source_word: מְלָכֵינוּ
  choice: nos rois
  rationale: Rendu direct du pluriel muni du suffixe de première personne du pluriel.
- source_word: שָׂרֵינוּ
  choice: nos chefs
  rationale: Le terme désigne ici les responsables civils ou dirigeants; « chefs » est naturel et suffisamment large en français moderne.
- source_word: כֹּהֲנֵינוּ
  choice: nos prêtres
  rationale: Équivalent français usuel du terme hébreu.
- source_word: וַאֲבֹתֵינוּ
  choice: nos pères
  rationale: Conserve le sens littéral et l’expression historique du texte; le contexte vise les générations antérieures.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: n’ont pas mis ta loi en pratique
  rationale: Avec תּוֹרָה, עשה exprime l’observance concrète; cette formulation française est plus naturelle que « faire ta loi ».
- source_word: הִקְשִׁיבוּ
  choice: n’ont prêté attention
  rationale: Le hiphil de קשׁב exprime une écoute attentive qui conduit à tenir compte de ce qui est dit.
- source_word: מִצְוֺתֶיךָ
  choice: tes commandements
  rationale: Conserve le vocabulaire formel de l’alliance et sa distinction avec la loi prise globalement.
- source_word: וּלְעֵדְוֺתֶיךָ אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: ni aux avertissements solennels que tu leur avais adressés
  rationale: Le nom et le verbe apparentés relèvent du témoignage solennel et de l’admonestation. Cette traduction communique clairement leur valeur contextuelle, tandis qu’une note conserve l’autre analyse possible.
theological_decisions:
- issue: Sens de תּוֹרָה
  choice: ta loi
  alternative: ton enseignement
  rationale: Dans cette confession nationale centrée sur l’alliance, le terme désigne la loi divine à observer, sans exclure sa dimension d’enseignement.
- issue: Référence de אָבוֹת
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le texte hébreu emploie le masculin « pères » pour les générations passées; la note explicite le sens contextuel sans neutraliser le texte principal.
- issue: Rapport entre עֵדְוֹת et הֵעִיד
  choice: avertissements solennels que tu leur avais adressés
  alternative: témoignages par lesquels tu as témoigné contre eux
  rationale: Le contexte favorise l’idée d’admonestations divines, mais la construction conserve une nuance judiciaire et testimoniale réelle, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Mettre la loi en pratique » rend naturellement l’idiome hébreu. La coordination négative « ni… ni… » clarifie que les deux compléments dépendent de « prêter attention ». Tous les marqueurs de notes figurent dans le texte.
