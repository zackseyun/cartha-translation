id: NEH.9.5
reference: Nehemiah 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ הַ/לְוִיִּ֡ם יֵשׁ֣וּעַ וְ֠/קַדְמִיאֵל בָּנִ֨י חֲשַׁבְנְיָ֜ה שֵׁרֵֽבְיָ֤ה הֽוֹדִיָּה֙ שְׁבַנְיָ֣ה פְתַֽחְיָ֔ה ק֗וּמוּ בָּרֲכוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם מִן הָ/עוֹלָ֖ם עַד הָ/עוֹלָ֑ם וִ/יבָֽרְכוּ֙ שֵׁ֣ם כְּבוֹדֶ֔/ךָ וּ/מְרוֹמַ֥ם עַל כָּל בְּרָכָ֖ה וּ/תְהִלָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: fr
  text: 'Puis les lévites — Yéchoua, Qadmiel, Bani, Hashabnia, Shérébia, Hodia, Shebania et Petahia — dirent : « Levez-vous ! Bénissez Yahweh, votre Dieu, d’éternité en éternité ! Qu’ils bénissent[a] ton nom glorieux[b], élevé au-dessus de toute bénédiction et de toute louange ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et qu’ils bénissent ». L’hébreu passe ici à la troisième personne du pluriel avec une valeur de souhait ou d’exhortation ; le sujet n’est pas exprimé. Certaines traductions rendent plutôt : « Béni soit » pour assurer la continuité de la prière.'
    reason: ambiguïté grammaticale
  - marker: b
    text: 'Littéralement : « le nom de ta gloire ».'
    reason: précision lexicale
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Puis … dirent
  rationale: Le waw consécutif fait progresser le récit ; « Puis » rend naturellement cette succession en français.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation usuelle du groupe, avec maintien de l’article défini.
- source_word: יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה
  choice: Yéchoua, Qadmiel, Bani, Hashabnia, Shérébia, Hodia, Shebania et Petahia
  rationale: Translittérations françaises lisibles des noms hébreux, sans passer par leurs formes anglaises.
- source_word: קוּמוּ
  choice: Levez-vous !
  rationale: Impératif masculin pluriel, naturel dans le cadre d’un appel public au culte.
- source_word: בָּרֲכוּ
  choice: Bénissez
  rationale: Le verbe piel de ברך signifie ici « bénir » ; ce choix conserve aussi l’écho avec בְּרָכָה, « bénédiction », à la fin du verset.
- source_word: אֶת יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, votre Dieu
  rationale: Le nom divin est rendu directement par « Yahweh » et le suffixe de deuxième personne du pluriel par « votre ».
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: d’éternité en éternité
  rationale: Formule française digne et concise qui conserve la structure de l’idiome hébreu exprimant une durée sans limite.
- source_word: וִיבָרְכוּ
  choice: Qu’ils bénissent
  rationale: La forme verbale massorétique est à la troisième personne du pluriel avec une valeur volitive. La traduction conserve ce changement grammatical, malgré l’absence d’un antécédent explicite.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: ton nom glorieux
  rationale: Équivalent français naturel du groupe construit littéralement « le nom de ta gloire ».
- source_word: וּמְרוֹמַם
  choice: élevé
  rationale: Le participe passif est rapporté au nom divin et rendu sans ajouter de verbe ou de sujet absent de l’hébreu.
- source_word: עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: au-dessus de toute bénédiction et de toute louange
  rationale: Rend l’idée que le nom divin dépasse toute bénédiction et toute louange qui peuvent lui être adressées.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » préserve le caractère de nom propre sans introduire un titre à sa place.
- issue: Sujet et valeur de וִיבָרְכוּ
  choice: Qu’ils bénissent
  alternative: Béni soit
  rationale: Le texte massorétique porte une troisième personne masculine plurielle à valeur volitive. « Béni soit » fluidifie la phrase mais transforme le nombre et masque le changement grammatical ; le texte principal conserve donc la tension de l’hébreu, avec une note explicative.
translation_notes:
  register: Français international moderne, clair et solennel. Les impératifs gardent l’énergie de l’appel liturgique. La ponctuation distingue la liste des lévites de leur discours, et le passage de « votre Dieu » à « ton nom » reproduit le changement d’adresse du texte hébreu.
