source:
  edition: WLC
  text: וְ/הַ/יָּם֙ בָּקַ֣עְתָּ לִ/פְנֵי/הֶ֔ם וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְֽ/אֶת רֹ֨דְפֵי/הֶ֜ם הִשְׁלַ֧כְתָּ בִ/מְצוֹלֹ֛ת כְּמוֹ אֶ֖בֶן בְּ/מַ֥יִם עַזִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: fr
  text: Tu as fendu la mer devant eux[a], et ils ont traversé au milieu de la mer sur un sol sec ; tu as précipité ceux qui les poursuivaient dans les profondeurs[b], comme une pierre dans des eaux puissantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « divisé la mer ».'
    reason: Alternative lexicale pour בקע, qui peut décrire le fait de fendre ou de diviser.
  - marker: b
    text: 'Ou : « dans les abîmes ».'
    reason: Alternative française pour le pluriel מְצוֹלוֹת, qui désigne les profondeurs marines.
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: tu as fendu
  rationale: Le verbe בקע exprime l’action de fendre ou d’ouvrir en séparant. « Fendre » conserve la force concrète de l’image et reste naturel en français soutenu.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Cette expression rend directement l’idée spatiale de ce qui se produit sous leurs yeux et sur leur passage.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: ils ont traversé au milieu de la mer
  rationale: « Traverser » exprime ici le passage d’un côté à l’autre, tandis que « au milieu de la mer » préserve la valeur concrète de תוֹךְ.
- source_word: בַּיַּבָּשָׁה
  choice: sur un sol sec
  rationale: La formule indique que le fond découvert était sec. « Sur un sol sec » est plus naturel en français actuel que le calque « sur la terre sèche ».
- source_word: רֹדְפֵיהֶם
  choice: ceux qui les poursuivaient
  rationale: Le participe désigne les personnes lancées à leur poursuite. Cette formulation est claire et naturelle, sans suggérer une persécution d’un autre type.
- source_word: הִשְׁלַכְתָּ
  choice: tu as précipité
  rationale: Le hiphil de שלך signifie jeter. Dans ce contexte de chute dans les profondeurs, « précipiter » exprime naturellement le mouvement sans exagérer l’hébreu.
- source_word: בִמְצוֹלֹת
  choice: dans les profondeurs
  rationale: מְצוֹלוֹת désigne les profondeurs de la mer. Le pluriel français conserve l’image et permet aussi l’alternative « les abîmes » en note.
- source_word: כְּמוֹ אֶבֶן
  choice: comme une pierre
  rationale: La comparaison simple et directe est conservée telle quelle.
- source_word: בְּמַיִם עַזִּים
  choice: dans des eaux puissantes
  rationale: עַזִּים signifie fortes ou puissantes. « Puissantes » préserve cette valeur sans ajouter explicitement l’idée d’eaux agitées ou déchaînées.
theological_decisions:
- issue: L’action divine dans le rappel de l’exode
  choice: 'Conserver l’adresse directe à Dieu : « Tu as fendu… tu as précipité ».'
  alternative: Employer une formulation impersonnelle ou nominale qui atténuerait l’adresse directe.
  rationale: Les verbes hébreux sont à la deuxième personne du singulier dans une prière communautaire. La traduction maintient donc la confession directe des actes historiques de Dieu, sans ajout interprétatif.
translation_notes:
  register: Français international moderne, clair et digne, adapté au registre d’une prière historique. La ponctuation garde le parallélisme des deux actions divines. « Sur un sol sec » privilégie l’intelligibilité actuelle, tandis que « des eaux puissantes » conserve sobrement l’intensité de l’hébreu.
