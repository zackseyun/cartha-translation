revisions:
- from: Tu les as avertis pour les ramener à ta loi, mais ils ont agi avec insolence et n’ont pas écouté tes commandements. Ils ont péché contre tes règles, celles que l’être humain doit mettre en pratique pour vivre par elles.[a] Ils ont présenté une épaule rebelle, raidi leur nuque[b] et n’ont pas voulu écouter.
  to: 'Tu les as avertis pour les ramener à ta loi, mais ils ont agi avec insolence et n’ont pas écouté tes commandements. Ils ont péché contre tes prescriptions : celui qui les met en pratique vivra par elles.[a] Ils ont opposé une épaule rebelle, ont raidi la nuque[b] et n’ont pas voulu écouter.'
  rationale: La révision corrige la faute grammaticale, rend les prescriptions divines avec une terminologie plus précise, et restitue plus fidèlement la relation non explicitée entre la mise en pratique et la vie. Les images corporelles et l’ambiguïté de « vivre par elles » sont conservées.
