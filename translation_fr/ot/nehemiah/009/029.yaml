  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: fr
  text: 'Tu les as avertis pour les ramener à ta loi, mais ils ont agi avec insolence et n’ont pas écouté tes commandements. Ils ont péché contre tes prescriptions : celui qui les met en pratique vivra par elles.[a] Ils ont opposé une épaule rebelle, ont raidi la nuque[b] et n’ont pas voulu écouter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Allusion à Lévitique 18.5. Littéralement : « qu’un être humain mettra en pratique et vivra par elles ».'
    reason: cross_reference_and_literal_rendering
  - marker: b
    text: « Opposer une épaule rebelle » et « raidir la nuque » sont des images d’un refus obstiné d’obéir.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: Tu les as avertis
  rationale: Le hifil de עוד exprime ici un avertissement solennel. « Avertir » rend naturellement en français l’appel insistant de Dieu sans effacer sa portée judiciaire possible.
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: pour les ramener à ta loi
  rationale: Le hifil de שׁוב signifie faire revenir ou ramener. Dans ce contexte d’alliance, « loi » convient à תּוֹרָה tout en restant clair.
- source_word: הֵזִידוּ
  choice: ils ont agi avec insolence
  rationale: זיד désigne une conduite présomptueuse et arrogante; « avec insolence » est actuel et souligne la rébellion délibérée.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: n’ont pas écouté tes commandements
  rationale: « Écouter » conserve l’image hébraïque de שׁמע, qui implique ici l’obéissance.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: Ils ont péché contre tes règles
  rationale: מִשְׁפָּטִים désigne ici les prescriptions ou règles établies par Dieu. « Règles » garde la valeur normative sans le sens français potentiellement trompeur de « jugements ».
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: celles que l’être humain doit mettre en pratique pour vivre par elles
  rationale: La formulation conserve le relatif, l’action exigée et l’expression « vivre par elles ». אָדָם est générique et se rend naturellement par « l’être humain » en français.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: Ils ont présenté une épaule rebelle
  rationale: Cette traduction préserve la métaphore corporelle de la résistance obstinée, au lieu de la remplacer par une simple explication.
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: raidi leur nuque
  rationale: « Raidir la nuque » est une expression française compréhensible qui conserve l’image hébraïque de l’obstination.
- source_word: וְלֹא שָׁמֵעוּ
  choice: n’ont pas voulu écouter
  rationale: La tournure française fait ressortir le refus volontaire qui clôt et résume la phrase.
theological_decisions:
- issue: Portée de אָדָם dans la promesse de vie
  choice: l’être humain
  alternative: un homme
  rationale: 'אָדָם a ici une portée générique: la parole vaut pour toute personne qui met ces prescriptions en pratique. Le français « l’être humain » transmet cette portée sans restreindre indûment le référent.'
- issue: Sens de « vivre par elles »
  choice: Conserver l’expression sans préciser la nature de la vie
  alternative: y trouver la vie / grâce à elles il vivra
  rationale: Le texte fait écho à Lévitique 18.5 et laisse ouverte la portée exacte de « vivre ». La traduction conserve cette tension au lieu d’en donner une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores corporelles de l’hébreu sont conservées, avec une note explicative. Le tutoiement correspond à la prière adressée directement à Dieu.
