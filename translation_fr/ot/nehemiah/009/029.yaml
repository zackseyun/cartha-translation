    issue: « celles que l’être humain doit mettre en pratique pour vivre par elles » infléchit la syntaxe de la clause sur la vie.
    rationale: Le texte hébreu exprime l’accomplissement suivi de la vie (« fera … et vivra »), non explicitement une obligation formulée par « doit » ni un but introduit par « pour ».
  - severity: low
    issue: « règles » affaiblit légèrement la précision juridique de מִשְׁפָּטִים.
    rationale: « Prescriptions » est moderne, naturel et conserve mieux le caractère normatif des décisions divines.
