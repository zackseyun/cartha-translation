source:
  edition: WLC
  text: וְ/אֶת שַׁבַּ֥ת קָדְשְׁ/ךָ֖ הוֹדַ֣עַתָ לָ/הֶ֑ם וּ/מִצְו֤וֹת וְ/חֻקִּים֙ וְ/תוֹרָ֔ה צִוִּ֣יתָ לָ/הֶ֔ם בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: fr
  text: Tu leur as fait connaître ton saint sabbat, et tu leur as prescrit des commandements, des décrets et une loi[a] par l’intermédiaire de Moïse, ton serviteur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un enseignement » : le mot hébreu תוֹרָה peut désigner aussi bien une instruction que la loi.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de Moïse, ton serviteur »; cette expression signifie ici « par l’intermédiaire de Moïse, ton serviteur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: ton saint sabbat
  rationale: « Sabbat » conserve la portée précise, cultuelle et covenantielle de שַׁבַּת. La construction nominale קָדְשְׁךָ a ici une valeur attributive, rendue naturellement par « saint ».
- source_word: הוֹדַעַתָ
  choice: tu leur as fait connaître
  rationale: Le hiphil de ידע exprime l’idée de faire savoir ou connaître; cette formulation française en préserve clairement la valeur causative.
- source_word: מִצְוֹת
  choice: commandements
  rationale: Ce terme désigne des ordres ou commandements et convient au registre juridique et covenantiel du passage.
- source_word: חֻקִּים
  choice: décrets
  rationale: חֻקִּים désigne des prescriptions établies. « Décrets » maintient sa distinction avec « commandements » et « loi » dans l’énumération.
- source_word: תוֹרָה
  choice: une loi
  rationale: Dans cette série de termes juridiques, « loi » est le sens contextuel le plus probable. L’article indéfini rend naturellement en français le singulier sans article de l’hébreu, sans prétendre épuiser la nuance d’enseignement.
- source_word: צִוִּיתָ לָהֶם
  choice: tu leur as prescrit
  rationale: Le piel de צוה exprime un commandement. « Prescrire » permet d’introduire naturellement en français les trois compléments juridiques sans la lourdeur de « commander des commandements ».
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: par l’intermédiaire de Moïse, ton serviteur
  rationale: בְּיַד, littéralement « par la main de », est ici un idiome de médiation. « Par l’intermédiaire de » en restitue le sens en français courant et digne.
theological_decisions:
- issue: Rendu de la triade juridique מִצְוֹת וְחֻקִּים וְתוֹרָה
  choice: des commandements, des décrets et une loi
  alternative: des ordres, des prescriptions et un enseignement
  rationale: Le contexte met en avant la révélation et la législation divines transmises par Moïse. Le choix retient trois termes distincts et préserve ainsi la structure hébraïque, tandis que la note signale la portée plus large possible de תוֹרָה.
- issue: Médiation de Moïse dans בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  alternative: par la main de Moïse
  rationale: L’expression hébraïque indique ici l’agent ou le médiateur sans préciser davantage la nature théologique de cette médiation. Le français idiomatique évite de transformer l’image littérale en affirmation distincte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’énumération hébraïque tout en évitant une tournure peu naturelle comme « commander des commandements ». Les termes juridiques demeurent distincts, et les notes conservent les nuances lexicales de תוֹרָה et de l’idiome בְּיַד.
