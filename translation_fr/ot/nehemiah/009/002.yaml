  text: וַ/יִּבָּֽדְלוּ֙ זֶ֣רַע יִשְׂרָאֵ֔ל מִ/כֹּ֖ל בְּנֵ֣י נֵכָ֑ר וַ/יַּעַמְד֗וּ וַ/יִּתְוַדּוּ֙ עַל חַטֹּ֣אתֵי/הֶ֔ם וַ/עֲוֺנ֖וֹת אֲבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: fr
  text: Alors, les descendants d’Israël[a] se séparèrent de tous les étrangers. Ils se tinrent debout et confessèrent leurs péchés ainsi que les fautes de leurs pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la semence d’Israël »; on pourrait aussi traduire « la descendance d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: La confession porte à la fois sur leurs propres péchés et sur les fautes de leurs pères, c’est-à-dire les générations qui les ont précédés; le texte n’explicite pas ici comment cette faute ancestrale se rapporte à leur culpabilité personnelle.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: se séparèrent
  rationale: Le nifal exprime ici naturellement une séparation délibérée accomplie par les membres du peuple eux-mêmes. La tournure pronominale française en conserve le sens sans imposer un passif.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: les descendants d’Israël
  rationale: זֶרַע signifie littéralement « semence », mais désigne collectivement la postérité. « Les descendants » rend clairement et naturellement ce lien généalogique en français moderne.
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: de tous les étrangers
  rationale: L’expression idiomatique בְּנֵי נֵכָר désigne des personnes d’origine étrangère, et non uniquement des fils au sens masculin et littéral.
- source_word: וַיַּעַמְדוּ
  choice: ils se tinrent debout
  rationale: Cette formulation rend la posture exprimée par עמד et convient au contexte solennel de la confession.
- source_word: וַיִּתְוַדּוּ
  choice: confessèrent
  rationale: À cette forme, ידה désigne l’aveu ou la confession. « Confessèrent » est précis, naturel et n’ajoute aucune indication sur la manière.
- source_word: חַטֹּאתֵיהֶם
  choice: leurs péchés
  rationale: Le pluriel de חַטָּאת désigne directement les péchés; le terme français usuel en conserve la portée morale et religieuse.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: les fautes de leurs pères
  rationale: עָוֹן peut désigner la faute, la culpabilité ou sa conséquence. Dans ce contexte de confession, « fautes » exprime les actes répréhensibles sans trancher en faveur d’une culpabilité personnellement héritée; « pères » conserve la formulation historique et collective de l’hébreu.
theological_decisions:
- issue: Confession collective des fautes ancestrales
  choice: Le peuple confesse ses propres péchés ainsi que les fautes de ses pères.
  alternative: Comprendre qu’il reconnaît seulement les conséquences de la culpabilité de ses pères, ou qu’il fait une simple évocation historique de leurs fautes.
  rationale: La syntaxe place les deux groupes nominaux sous le même verbe « confesser ». La traduction maintient donc la dimension collective de cette confession, sans affirmer pour autant une transmission automatique de la culpabilité personnelle.
translation_notes:
  register: Français international moderne, sobre et solennel. Le passé simple convient au récit écrit; « se tinrent debout » préserve la posture du texte source. « Fautes » reste courant tout en distinguant עָוֹן du terme rendu par « péchés ».
