source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: fr
  text: Toi seul, tu es Yahweh. Tu as fait les cieux, les cieux les plus élevés[a] et toute leur armée, la terre et tout ce qui s’y trouve, les mers et tout ce qu’elles contiennent. C’est toi qui les maintiens tous en vie[b], et l’armée des cieux se prosterne devant toi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les cieux des cieux », expression qui désigne les cieux les plus élevés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu leur donnes la vie à tous ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « l’armée céleste se prosterne devant toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא יְהוָה לְבַדֶּךָ
  choice: Toi seul, tu es Yahweh
  rationale: La dislocation « Toi seul, tu… » rend naturellement en français l’insistance des pronoms hébreux et de לְבַדֶּךָ, tout en conservant le nom divin.
- source_word: עָשִׂיתָ
  choice: tu as fait
  rationale: Le verbe עשה signifie ici faire l’ensemble du cosmos; « fait » reste direct sans le confondre avec le verbe plus précis « créer ».
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Le pluriel français convient au contexte cosmique et correspond à la forme hébraïque.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: les cieux les plus élevés
  rationale: Cette formulation française exprime l’idée superlative de l’expression littérale « les cieux des cieux »; la forme littérale est signalée en note.
- source_word: כָל צְבָאָם
  choice: toute leur armée
  rationale: « Armée » conserve la portée collective de צבא sans la réduire exclusivement aux étoiles ou aux êtres célestes.
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: la terre et tout ce qui s’y trouve
  rationale: Dans cet inventaire de la création, אֶרֶץ désigne la terre entière; la formulation est naturelle en français moderne.
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: les mers et tout ce qu’elles contiennent
  rationale: « Les mers » traduit directement יַמִּים et complète la série cosmique des cieux, de la terre et des mers.
- source_word: מְחַיֶּה אֶת כֻּלָּם
  choice: tu les maintiens tous en vie
  rationale: Le participe piel peut exprimer l’action de donner la vie ou de la conserver. Dans la suite de l’acte créateur, cette traduction rend clairement l’action continuelle sans effacer l’autre nuance, donnée en note.
- source_word: וּצְבָא הַשָּׁמַיִם
  choice: l’armée des cieux
  rationale: La formulation reste proche de l’expression collective hébraïque et laisse ouverte son extension exacte aux corps ou êtres célestes.
- source_word: לְךָ מִשְׁתַּחֲוִים
  choice: se prosterne devant toi
  rationale: Le verbe exprime une prosternation ou un hommage; le singulier français s’accorde avec le collectif « armée ».
theological_decisions:
- issue: Exclusivité divine de Yahweh
  choice: Toi seul, tu es Yahweh
  alternative: Tu es Yahweh, toi seul
  rationale: La formulation choisie place l’exclusivité au premier plan, comme la construction emphatique hébraïque, sans ajouter « Dieu », absent du texte.
- issue: Action continuelle de Dieu envers la création
  choice: tu les maintiens tous en vie
  alternative: tu leur donnes la vie à tous
  rationale: Le contexte passe de la fabrication du cosmos à son soutien continuel. Le sens causatif « donner la vie » demeure possible et est conservé en note.
- issue: Identité de l’armée des cieux
  choice: l’armée des cieux
  alternative: l’armée céleste
  rationale: La traduction littérale conserve l’ambiguïté entre l’ensemble des corps célestes et les êtres célestes, plutôt que d’imposer une identification.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe emphatique initiale garde la force de l’hébreu; le vocabulaire cosmique reste sobre. « Armée » préserve volontairement l’ambiguïté de צבא, tandis que les notes présentent les principales nuances lexicales sans surinterprétation confessionnelle.
