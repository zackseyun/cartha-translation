source:
  edition: WLC
  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: fr
  text: Mais, dans ton immense compassion, tu ne les as pas réduits à néant et tu ne les as pas abandonnés[a], car tu es un Dieu qui fait grâce et qui est compatissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne les as pas complètement détruits et tu ne les as pas délaissés ».'
    reason: Alternative lexicale pour l’expression עשה כלה et pour עזב.
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: Mais, dans l’abondance de ta compassion
  rationale: La conjonction initiale marque ici le contraste avec la rébellion rappelée auparavant. Le pluriel intensif et l’adjectif הָרַבִּים expriment l’ampleur de la compassion divine ; « l’abondance de ta compassion » est idiomatique en français moderne.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: tu ne les as pas réduits à néant
  rationale: L’expression עשה כלה signifie mener à une fin complète, supprimer ou anéantir. « Réduire à néant » conserve la force de l’expression sans préciser un moyen de destruction.
- source_word: וְלֹא עֲזַבְתָּם
  choice: et tu ne les as pas abandonnés
  rationale: עזב signifie laisser, délaisser ou abandonner. « Abandonner » est clair, actuel et convient au maintien de la sollicitude divine dans le contexte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la retenue de Dieu ; « car » rend naturellement ce rapport explicatif.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici une désignation courante de Dieu ; le contexte n’exige pas d’ajouter explicitement une notion de puissance.
- source_word: חַנּוּן
  choice: qui fait grâce
  rationale: Cette formulation exprime la disposition à accorder la grâce et préserve la distinction avec רַחוּם, rendu par « compatissant ».
- source_word: וְרַחוּם
  choice: et qui est compatissant
  rationale: רַחוּם désigne la compassion profonde. « Compatissant » rend l’adjectif sans le confondre avec חַנּוּן.
- source_word: אָתָּה
  choice: tu es
  rationale: Le pronom indépendant souligne le sujet dans la proposition nominale hébraïque ; le français exige ici le verbe « être ».
theological_decisions:
- issue: Rendu de la formule décrivant le caractère divin חַנּוּן וְרַחוּם
  choice: un Dieu qui fait grâce et qui est compatissant
  alternative: un Dieu plein de grâce et de compassion
  rationale: Le choix retient deux expressions distinctes pour les deux adjectifs hébreux, sans leur ajouter de nuance doctrinale étrangère.
- issue: Valeur de la conjonction initiale וּ
  choice: Mais
  alternative: Et
  rationale: Dans le déroulement de la prière, cette phrase oppose la compassion de Dieu aux rébellions répétées du peuple ; « Mais » explicite cette valeur contextuelle légitime.
- issue: Portée de לֹא עֲשִׂיתָם כָּלָה
  choice: tu ne les as pas réduits à néant
  alternative: tu ne les as pas complètement détruits
  rationale: Le texte affirme que Dieu n’a pas mené leur destruction jusqu’à son terme. La formulation principale conserve le caractère idiomatique, tandis que la note donne le sens destructif plus explicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. La formulation « qui fait grâce » garde la couleur de la formule biblique tout en restant intelligible.
