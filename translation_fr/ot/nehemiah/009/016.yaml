id: NEH.9.16
reference: Nehemiah 9:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: fr
  text: Mais eux, nos pères, ont agi avec présomption et ont raidi la nuque[a] ; ils n’ont pas écouté tes commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression hébraïque signifiant qu’ils se sont montrés obstinés et rebelles.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: Mais eux
  rationale: Le pronom indépendant met les ancêtres en relief, tandis que le contexte donne à la conjonction une valeur contrastive par rapport aux bienfaits de Dieu rappelés auparavant.
- source_word: וַאֲבֹתֵינוּ
  choice: nos pères
  rationale: Cette formulation rend littéralement le lien de parenté et conserve l’identification collective de la communauté avec les générations précédentes.
- source_word: הֵזִידוּ
  choice: ont agi avec présomption
  rationale: Le verbe exprime une conduite orgueilleuse, insolente ou présomptueuse. Cette traduction garde à la fois l’idée d’action et sa portée morale.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: ont raidi la nuque
  rationale: La traduction conserve l’image hébraïque de la nuque rendue raide, métaphore d’une attitude obstinée et rebelle, dans une expression française compréhensible.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: ils n’ont pas écouté
  rationale: Le verbe signifie littéralement écouter ou prêter attention ; avec « tes commandements », le refus d’obéir reste implicite sans être ajouté au texte.
- source_word: מִצְוֺתֶיךָ
  choice: tes commandements
  rationale: Ce terme conserve le registre juridique et alliancé du substantif hébreu.
theological_decisions:
- issue: Identification collective aux générations pécheresses antérieures
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » maintient la formulation concrète du texte hébreu et la solidarité historique exprimée par la prière, sans ajouter de précision doctrinale.
- issue: Rapport entre l’écoute et l’obéissance
  choice: n’ont pas écouté
  alternative: n’ont pas obéi
  rationale: La formulation retenue préserve le sens lexical et laisse au contexte des commandements la portée évidente de désobéissance, sans réduire la tension sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « Mais eux, nos pères » garde l’emphase du pronom hébreu. L’idiome de la nuque raide est conservé dans le texte et brièvement expliqué en note.
