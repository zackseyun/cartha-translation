source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: fr
  text: Et maintenant, notre Dieu, le Dieu grand, puissant et redoutable[a], toi qui gardes l’alliance et l’amour fidèle, que toute la détresse qui nous est arrivée ne te paraisse pas peu de chose — celle qui est arrivée sur nos rois, nos chefs, nos prêtres, nos prophètes, nos pères[b] et sur tout ton peuple — depuis le temps des rois d’Assyrie jusqu’à aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « digne de crainte ». Le terme hébreu désigne celui qui inspire une crainte révérencielle.
    reason: lexical_alternative
  - marker: b
    text: Ou « nos ancêtres ». Le mot hébreu est masculin et désigne ici les générations antérieures du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Dieu
  rationale: En apposition à « notre Dieu » et suivi de titres adjectivaux, אֵל désigne ici Dieu. La formulation « notre Dieu, Dieu grand… » conserve cette apposition tout en restant naturelle en français.
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: grand, puissant et redoutable
  rationale: Ces épithètes divines expriment la grandeur, la puissance et la crainte révérencielle qu’inspire Dieu. « Redoutable » garde le poids de נוֹרָא sans suggérer simplement quelque chose d’admirable.
- source_word: שׁוֹמֵר
  choice: toi qui gardes
  rationale: Le participe décrit l’action constante de Dieu. La relative avec reprise vocative est claire et naturelle dans une prière française.
- source_word: הַבְּרִית וְהַחֶסֶד
  choice: l’alliance et la fidélité
  rationale: חֶסֶד évoque ici l’attachement loyal manifesté dans le cadre de l’alliance. « Fidélité » en rend la dimension durable et relationnelle sans expression archaïque.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: ne te paraisse pas peu de chose
  rationale: Cette tournure restitue l’idiome demandant à Dieu de ne pas tenir la détresse pour insignifiante, tout en préservant l’idée qu’elle est placée devant son regard.
- source_word: כָּל הַתְּלָאָה
  choice: toute la détresse
  rationale: תְּלָאָה désigne les peines et épreuves subies. « Détresse » convient à la souffrance historique et collective évoquée.
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: qui nous a atteints
  rationale: Le sens littéral, « qui nous a trouvés », est un idiome décrivant un malheur qui survient à quelqu’un. « Atteints » en transmet naturellement le sens.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: elle qui a frappé nos rois, nos chefs, nos prêtres, nos prophètes, nos pères
  rationale: La reprise « elle qui a frappé » clarifie en français que tous les groupes énumérés ont subi la même détresse. שָׂרִים est rendu par « chefs », terme assez large pour des responsables de haut rang.
- source_word: וּלְכָל עַמֶּךָ
  choice: et tout ton peuple
  rationale: L’expression étend la liste des personnes touchées à l’ensemble du peuple appartenant à Dieu.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר
  choice: depuis le temps des rois d’Assyrie
  rationale: La formule marque le début de la longue période d’épreuves. « Le temps » rend naturellement le pluriel idiomatique « les jours ».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Cette formulation française courante exprime la continuité entre l’époque assyrienne et le présent des locuteurs.
theological_decisions:
- issue: Rendu des épithètes divines liées à la confession d’alliance
  choice: Dieu grand, puissant et redoutable
  alternative: Dieu grand, puissant et digne de crainte
  rationale: « Redoutable » maintient ensemble la majesté, la puissance et la crainte révérencielle exprimées par נוֹרָא, sans réduire le terme à la terreur.
- issue: Rendu de חֶסֶד dans la formule d’alliance
  choice: la fidélité
  alternative: l’amour fidèle
  rationale: « Fidélité » met en relief la loyauté durable de Dieu envers son alliance. « Amour fidèle » expliciterait davantage la dimension affective, mais le texte principal conserve une formulation concise et consacrée en français biblique moderne.
- issue: Rendu de אֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » conserve la forme masculine et la formulation historique du texte hébreu. Une note signale que le mot peut désigner plus largement les ancêtres du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe vocative conserve le ton solennel de la prière, tandis que « ne te paraisse pas peu de chose » maintient l’image relationnelle de l’idiome hébreu. La reprise « elle qui a frappé » clarifie la portée de l’énumération sans modifier les groupes nommés.
