id: NEH.9.17
reference: Nehemiah 9:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: fr
  text: Mais ils ont refusé d’écouter et ne se sont pas souvenus des prodiges que tu avais accomplis au milieu d’eux. Ils se sont obstinés et, dans leur révolte, se sont donné un chef pour retourner à leur esclavage. Mais toi, tu es un Dieu qui pardonne[a], plein de grâce et de compassion, lent à la colère et riche en amour fidèle, et tu ne les as pas abandonnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un Dieu de pardons » ; le pluriel souligne l’abondance de son pardon.'
    reason: La note préserve le pluriel abstrait et intensif de סְלִיחוֹת, rendu de manière idiomatique dans le texte principal.
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: ils ont refusé d’écouter
  rationale: Cette formulation conserve l’idée explicite de refus et le verbe « écouter », tout en laissant entendre la désobéissance sans l’introduire directement dans le texte.
- source_word: נִפְלְאֹתֶיךָ
  choice: tes prodiges
  rationale: « Prodiges » désigne naturellement des actes extraordinaires de Dieu qui suscitent l’émerveillement.
- source_word: עָשִׂיתָ עִמָּהֶם
  choice: que tu avais accomplis au milieu d’eux
  rationale: « Au milieu d’eux » rend ici la portée communautaire de עִם et situe les actes divins parmi le peuple, sans les réduire à de simples bienfaits faits pour lui.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: ils se sont obstinés
  rationale: L’expression hébraïque signifie littéralement qu’ils ont raidi leur nuque. L’équivalent idiomatique français communique clairement leur entêtement volontaire sans produire une image opaque.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: se sont donné un chef
  rationale: 'Littéralement « ils ont placé/donné une tête » : dans ce contexte, « se donner un chef » exprime naturellement la désignation d’un dirigeant.'
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: pour retourner à leur esclavage
  rationale: « Esclavage » rend directement עַבְדוּת et convient au contexte du retour envisagé en Égypte.
- source_word: בְּמִרְיָם
  choice: dans leur révolte
  rationale: La locution est conservée comme circonstance de leur décision de se donner un chef et de retourner à l’esclavage.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: un Dieu qui pardonne
  rationale: Le pluriel abstrait hébreu présente Dieu comme abondant en pardons. La proposition relative exprime cette qualité en français naturel, tandis qu’une note conserve la forme remarquable de l’original.
- source_word: חַנּוּן וְרַחוּם
  choice: plein de grâce et de compassion
  rationale: Cette paire distingue la faveur généreuse de Dieu de sa profonde compassion, dans une langue actuelle et digne.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: C’est l’équivalent français établi et intelligible de l’expression idiomatique hébraïque.
- source_word: רַב־חֶסֶד
  choice: riche en amour fidèle
  rationale: « Amour fidèle » garde ensemble la dimension affective et la loyauté durable de חֶסֶד; « riche en » rend naturellement רַב.
- source_word: וְלֹא עֲזַבְתָּם
  choice: et tu ne les as pas abandonnés
  rationale: « Abandonner » exprime clairement la rupture relationnelle niée par le texte et reste naturel en français contemporain.
theological_decisions:
- issue: Préserver la description divine du pardon sans rendre littéralement un pluriel abstrait peu naturel
  choice: un Dieu qui pardonne
  alternative: un Dieu de pardons
  rationale: La formulation choisie présente le pardon comme un trait caractéristique de Dieu sans limiter sa portée. La note signale le pluriel intensif de l’hébreu.
- issue: Rendre חֶסֶד sans imposer une définition confessionnelle étroite
  choice: amour fidèle
  alternative: bonté / amour d’alliance
  rationale: « Amour fidèle » conserve à la fois l’amour, la constance et la loyauté relationnelle du terme, tout en évitant de résoudre plus précisément que le texte sa portée théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé favorise une narration accessible; le tutoiement suit l’adresse directe à Dieu. Les expressions « prodiges », « lent à la colère » et « amour fidèle » maintiennent la résonance biblique sans archaïsme marqué.
