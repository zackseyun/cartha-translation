  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: fr
  text: Leurs fils[a] entrèrent donc et prirent possession du pays. Tu soumis devant eux les habitants du pays, les Cananéens, et tu les livras en leur pouvoir[b], ainsi que leurs rois et les peuples du pays, pour les traiter comme ils le voulaient[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants », ou, de manière plus explicite, « les descendants » ou « les Israélites ». L’hébreu dit littéralement « les fils ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu les donnas entre leurs mains ».'
    reason: hebrew_idiom
  - marker: c
    text: Littéralement, « pour faire à leur égard selon leur volonté ». Ou « pour les traiter à leur guise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: les fils
  rationale: Cette traduction conserve le langage familial et généalogique de l’hébreu. Dans le contexte, il s’agit des descendants d’Israël qui sont entrés en Canaan.
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: prirent possession du pays
  rationale: Dans un contexte territorial, ירשׁ désigne la prise de possession. La formulation française est naturelle et garde le sens concret de l’acquisition du pays.
- source_word: וַתַּכְנַע לִפְנֵיהֶם
  choice: tu soumis devant eux
  rationale: Le verbe כנע exprime ici la mise sous domination dans un contexte militaire et politique. « Devant eux » préserve la construction et l’image spatiale de l’hébreu.
- source_word: יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים
  choice: les habitants du pays, les Cananéens
  rationale: La désignation explicative de l’hébreu est conservée, y compris le nom ethnique.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: tu les livras en leur pouvoir
  rationale: L’expression rend clairement en français l’idiome hébreu « donner dans leur main », qui signifie placer sous leur autorité ou leur domination.
- source_word: מַלְכֵיהֶם וְאֶת עַמְמֵי הָאָרֶץ
  choice: leurs rois et les peuples du pays
  rationale: Le pluriel « peuples » reflète עַמְמֵי et maintient l’idée de plusieurs groupes établis dans le pays.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: pour qu’ils fassent d’eux ce qu’ils voulaient
  rationale: La formulation exprime directement la liberté d’action indiquée par « selon leur volonté », sans atténuer la force du texte.
theological_decisions:
- issue: Référent de « les fils »
  choice: Conserver « les fils » en comprenant l’expression comme les descendants d’Israël entrés en Canaan.
  alternative: Traduire explicitement par « les Israélites » ou « leurs descendants ».
  rationale: L’hébreu emploie un terme familial qui relie cette génération aux pères évoqués dans la prière. La traduction garde cette continuité sans remplacer le terme par une identification interprétative.
- issue: Force du langage de conquête
  choice: Maintenir les verbes forts « soumis » et « livras en leur pouvoir ».
  alternative: Employer une formulation atténuée, telle que « tu leur permis de vaincre ».
  rationale: Le verset attribue directement à Dieu la soumission des habitants et leur mise au pouvoir d’Israël. Il ne convient pas d’adoucir cette attribution ni sa portée militaire et politique.
- issue: Liberté d’action accordée aux conquérants
  choice: Traduire « pour qu’ils fassent d’eux ce qu’ils voulaient ».
  alternative: « pour qu’ils les traitent à leur guise » ou « selon leur bon plaisir ».
  rationale: La formulation retenue conserve la dureté et l’ampleur de l’expression hébraïque sans préciser moralement ou juridiquement la nature des actes.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit solennel d’une prière historique. Le texte conserve le langage familial et la force du vocabulaire de conquête, tandis que les notes signalent les principaux équivalents possibles et l’idiome hébreu.
