  text: וַ/תִּתֵּ֨ן לָ/הֶ֤ם מַמְלָכוֹת֙ וַ/עֲמָמִ֔ים וַֽ/תַּחְלְקֵ֖/ם לְ/פֵאָ֑ה וַ/יִּֽירְשׁ֞וּ אֶת אֶ֣רֶץ סִיח֗וֹן וְ/אֶת אֶ֨רֶץ֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וְ/אֶת אֶ֖רֶץ ע֥וֹג מֶֽלֶךְ הַ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: fr
  text: Tu leur as donné des royaumes et des peuples, et tu les as répartis entre eux, région par région. Ils ont pris possession du pays de Sihôn, du pays du roi de Heshbon, et du pays d’Og, roi du Bashân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: des royaumes et des peuples
  rationale: Rend directement les deux pluriels hébreux tout en conservant leur distinction.
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: tu leur en as réparti chaque région
  rationale: לְפֵאָה désigne ici une part, un secteur ou une région. La formulation française exprime une répartition territoriale sans retenir le littéral obscur « vers un coin ».
- source_word: וַיִּירְשׁוּ
  choice: ils ont pris possession
  rationale: Dans ce contexte territorial, le verbe ירשׁ signifie entrer en possession d’un pays, souvent par conquête.
- source_word: אֶרֶץ
  choice: pays
  rationale: « Pays » est naturel en français pour les territoires gouvernés par Sihôn et Og.
- source_word: וְאֶת אֶרֶץ מֶלֶךְ חֶשְׁבּוֹן
  choice: c’est-à-dire du pays du roi de Heshbon
  rationale: Le texte massorétique relie « pays » à « roi de Heshbon » sans répéter explicitement Sihôn; la tournure explicative reflète vraisemblablement l’apposition et évite d’introduire un second territoire.
theological_decisions:
- issue: Nature du don divin et de la prise de possession
  choice: Conserver successivement « tu leur as donné » et « ils ont pris possession »
  alternative: Fusionner les deux actions en présentant uniquement Dieu comme celui qui leur remet les territoires
  rationale: Le texte maintient ensemble l’action souveraine de Dieu et l’entrée effective du peuple en possession; la traduction ne résout pas cette tension.
- issue: Identification de Sihôn
  choice: Lire « le pays du roi de Heshbon » comme une explication du pays de Sihôn
  alternative: Traduire comme deux pays distincts ou corriger en « Sihôn, roi de Heshbon »
  rationale: La syntaxe transmise est inhabituelle, mais le contexte identifie Sihôn comme roi de Heshbon. « C’est-à-dire » conserve la valeur appositive probable sans modifier le texte hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres suivent des graphies bibliques françaises reconnaissables. La formulation privilégie la clarté tout en gardant la structure historique et théologique du verset.
