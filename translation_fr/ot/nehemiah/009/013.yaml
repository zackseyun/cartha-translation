  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: fr
  text: Tu es descendu sur le mont Sinaï et tu as parlé avec eux du ciel ; tu leur as donné des règles justes, des lois de vérité[a], de bonnes prescriptions et de bons commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des lois vraies » ou « des enseignements fiables ». Le mot hébreu peut désigner des lois ou des enseignements, et l’expression évoque la vérité autant que la fiabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: Tu es descendu sur le mont Sinaï
  rationale: « Descendre sur » rend directement le mouvement exprimé par ירד et la localisation marquée par עַל, dans une formulation française naturelle et digne.
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: et tu as parlé avec eux depuis le ciel
  rationale: « Parler avec eux » conserve la préposition עִם (« avec »), tandis que « depuis le ciel » indique naturellement le point d’origine de la parole.
- source_word: וַתִּתֵּן לָהֶם
  choice: Tu leur as donné
  rationale: Cette formulation directe rend נתן avec le complément indirect introduit par ל et maintient l’adresse à Dieu à la deuxième personne.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: des règles justes
  rationale: מִשְׁפָּטִים désigne ici des règles ou décisions de droit; « règles » est clair en français courant, et « justes » exprime la rectitude morale et juridique de יְשָׁרִים.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: des enseignements vrais
  rationale: Le pluriel תּוֹרוֹת peut désigner des enseignements aussi bien que des lois. « Enseignements vrais » conserve cette largeur de sens et rend אֱמֶת sans réduire sa portée à la seule exactitude juridique.
- source_word: חֻקִּים
  choice: prescriptions
  rationale: « Prescriptions » rend la notion de dispositions établies et permet de distinguer ce terme des autres vocables juridiques de la liste.
- source_word: וּמִצְוֺת
  choice: commandements
  rationale: « Commandements » est l’équivalent français naturel et traditionnel de מִצְוֺת dans un contexte d’alliance.
- source_word: טוֹבִים
  choice: de bonnes prescriptions et de bons commandements
  rationale: L’adjectif masculin pluriel טוֹבִים qualifie naturellement les deux derniers noms coordonnés. Sa répétition en français rend cette portée explicite et fluide.
theological_decisions:
- issue: Différenciation des quatre termes relatifs à la révélation donnée au Sinaï
  choice: 'Conserver quatre désignations distinctes : « règles », « enseignements », « prescriptions » et « commandements ».'
  alternative: Réduire l’énumération à « lois et commandements », ou rendre תּוֹרוֹת uniquement par « lois ».
  rationale: L’accumulation de termes hébreux souligne la richesse et la qualité de la révélation divine. Les distinguer préserve la texture du texte sans imposer à chacun une définition technique ou confessionnelle trop étroite.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple pour la lecture publique. « Parlé avec eux » conserve une nuance relationnelle présente dans l’hébreu, et les quatre termes juridiques sont différenciés sans lourdeur technique.
