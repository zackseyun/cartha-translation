  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: fr
  text: Nous voici aujourd’hui esclaves[a] ! Et la terre que tu as donnée à nos pères pour qu’ils mangent de ses fruits et de ses biens, nous y voici esclaves[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le terme hébreu désigne ici des personnes assujetties et souligne probablement leur soumission à une puissance impériale.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nous sommes esclaves sur elle », c’est-à-dire sur la terre même que Dieu avait donnée à nos pères.'
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: nous voici
  rationale: La particule attire l’attention et souligne avec force la situation présente. Sa répétition est conservée par « nous voici », formulation naturelle en français qui soutient la lamentation.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Le terme oppose la condition présente du peuple au don passé de la terre.
- source_word: עֲבָדִים
  choice: esclaves
  rationale: Dans ce contexte de domination impériale, le mot met en relief l’assujettissement et la perte de liberté, sens que « serviteurs » rendrait moins nettement.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le terme désigne ici le territoire donné par Dieu aux pères. « La terre » convient au langage biblique de la promesse tout en restant courant.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: que tu as donnée à nos pères
  rationale: La traduction maintient l’adresse directe à Dieu et le terme familial masculin employé dans l’hébreu.
- source_word: לֶאֱכֹל
  choice: pour qu’ils mangent
  rationale: L’infinitif exprime le but du don de la terre; la traduction directe conserve l’image concrète de la jouissance de ses produits.
- source_word: פִּרְיָהּ
  choice: ses fruits
  rationale: Ce rendu conserve l’image agricole concrète et le pluriel est idiomatique en français.
- source_word: טוּבָהּ
  choice: ses biens
  rationale: Le nom peut désigner la bonté, l’abondance ou les bonnes choses de la terre. « Ses biens » garde une portée large sans limiter le sens aux seules récoltes.
- source_word: עָלֶיהָ
  choice: nous y voici
  rationale: Le pronom « y » rend naturellement en français la valeur locative de « sur elle », tandis qu’une note conserve la formulation littérale et son ironie rhétorique.
theological_decisions:
- issue: Sens de עֲבָדִים dans une lamentation sur la terre promise
  choice: esclaves
  alternative: serviteurs
  rationale: Le peuple déplore sa soumission à une puissance étrangère alors même qu’il habite la terre donnée par Dieu. « Esclaves » exprime cette absence de liberté sans ajouter une interprétation confessionnelle.
- issue: Référence aux לַאֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: L’hébreu emploie explicitement le terme masculin « pères »; le conserver respecte la forme et la résonance historique du texte.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition de « nous voici » reproduit l’insistance de הִנֵּה aux deux endroits. L’exclamation rend la force de la lamentation sans en modifier le contenu.
