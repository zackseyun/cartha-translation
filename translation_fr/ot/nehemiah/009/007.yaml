  text: אַתָּה הוּא֙ יְהוָ֣ה הָ/אֱלֹהִ֔ים אֲשֶׁ֤ר בָּחַ֨רְתָּ֙ בְּ/אַבְרָ֔ם וְ/הוֹצֵאת֖/וֹ מֵ/א֣וּר כַּשְׂדִּ֑ים וְ/שַׂ֥מְתָּ שְּׁמ֖/וֹ אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: fr
  text: C’est toi, Yahweh, le Dieu[a], qui as choisi Abram, qui l’as fait sortir d’Our des Chaldéens et qui lui as donné le nom d’Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh Dieu ». L’hébreu emploie le nom divin YHWH.
    reason: La relation syntaxique entre le nom divin et הָאֱלֹהִים peut être exprimée avec ou sans article explicite en français.
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: C’est toi
  rationale: La tournure hébraïque est emphatique et identifie directement Dieu. « C’est toi » rend cette insistance de façon naturelle en français.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Yahweh Dieu
  rationale: Le nom divin YHWH est transcrit « Yahweh », tandis que הָאֱלֹהִים est rendu par « Dieu ». La juxtaposition conserve les deux éléments de l’hébreu sans substituer un titre au nom divin.
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: as choisi Abram
  rationale: Avec בחר, la préposition introduit ici l’objet du choix; le français emploie naturellement un complément d’objet direct. Le nom « Abram » est maintenu pour faire ressortir son changement ultérieur en « Abraham ».
- source_word: וְהוֹצֵאתוֹ
  choice: l’as fait sortir
  rationale: La forme causative de יצא signifie « faire sortir » ou « conduire hors de ». « L’as fait sortir » suit précisément la forme hébraïque et reste idiomatique.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: d’Our des Chaldéens
  rationale: Il s’agit de la désignation géographique traditionnelle et claire en français moderne.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: lui as donné le nom d’Abraham
  rationale: Littéralement, l’hébreu dit « tu as établi son nom Abraham ». La formulation choisie exprime naturellement en français l’acte de donner un nouveau nom.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre; « Jéhovah » repose sur une vocalisation traditionnelle plus tardive.
- issue: Relation entre יְהוָה et הָאֱלֹהִים
  choice: Yahweh Dieu
  alternative: Yahweh, le Dieu / le Seigneur Dieu
  rationale: Les deux termes sont conservés dans leur ordre, sans ajouter une interprétation confessionnelle. La note signale une autre manière possible de comprendre la construction hébraïque.
translation_notes:
  register: Français moderne, international et digne. La répétition de « qui » clarifie la structure relative et donne au verset une cadence naturelle, tout en suivant les trois actions divines du texte hébreu.
