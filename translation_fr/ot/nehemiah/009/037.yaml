  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: fr
  text: Ses récoltes abondantes[a] reviennent aux rois que tu as établis sur nous à cause de nos péchés. Ils exercent leur pouvoir à leur guise sur nos corps[b] et sur notre bétail, et nous sommes dans une grande détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses produits abondants » ou « son rendement abondant » ; le suffixe renvoie à la terre mentionnée au verset précédent.
    reason: lexical_alternative
  - marker: b
    text: Ou « nos personnes » ; littéralement, « nos corps ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ מַרְבָּה
  choice: Ses récoltes abondantes
  rationale: תְּבוּאָה désigne les produits ou la récolte de la terre, et le suffixe féminin renvoie à la terre du verset précédent. מַרְבָּה exprime ici l’abondance ou l’accroissement. Cette formulation est naturelle et conserve le lien avec la terre.
- source_word: לַמְּלָכִים
  choice: reviennent aux rois
  rationale: La préposition ל indique ici le bénéficiaire ou la destination. « Reviennent aux rois » exprime naturellement que les récoltes profitent aux souverains étrangers.
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: que tu as établis sur nous
  rationale: נתן avec עַל peut signifier placer ou établir quelqu’un au-dessus d’autres personnes. La traduction maintient l’action directement attribuée à Dieu.
- source_word: בְּחַטֹּאותֵינוּ
  choice: à cause de nos péchés
  rationale: 'Dans ce contexte, ב a une valeur causale : la domination étrangère est présentée comme une conséquence des péchés du peuple.'
- source_word: גְּוִיֹּתֵינוּ
  choice: nos corps
  rationale: גְּוִיָּה désigne ici le corps ou la personne physique soumise au pouvoir des rois, et non un cadavre.
- source_word: מֹשְׁלִים
  choice: Ils exercent leur pouvoir
  rationale: Le participe décrit une domination continue. Cette formulation française rend le verbe משל sans suggérer nécessairement une administration légitime ou bienveillante.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: sur notre bétail
  rationale: בְּהֵמָה désigne collectivement les animaux domestiques; « bétail » est précis et courant dans ce contexte agricole.
- source_word: כִּרְצוֹנָם
  choice: à leur guise
  rationale: L’expression signifie qu’ils agissent selon leur propre volonté. « À leur guise » restitue de façon concise le caractère discrétionnaire de leur pouvoir.
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: et nous sommes dans une grande détresse
  rationale: צָרָה évoque une situation de détresse, d’oppression ou d’angoisse. La formulation conserve la gravité de la lamentation collective.
theological_decisions:
- issue: Action divine dans la domination étrangère
  choice: Dieu a établi ces rois sur le peuple à cause de ses péchés.
  alternative: Dieu a seulement permis leur domination, ou approuve tout ce que font ces rois.
  rationale: Le texte hébreu attribue directement à Dieu l’établissement des rois sur le peuple comme conséquence de ses péchés. Il ne dit toutefois pas que Dieu approuve tous les abus commis par ces souverains.
translation_notes:
  register: Français international moderne, digne et accessible. « Reviennent aux rois » et « exercent leur pouvoir » évitent un calque peu naturel tout en conservant la destination des récoltes et la domination continue exprimées par l’hébreu.
