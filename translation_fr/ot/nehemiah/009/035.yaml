  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: fr
  text: Même dans leur royaume, au milieu de ta grande bonté que tu leur avais accordée, et dans le pays vaste et fertile que tu avais mis à leur disposition, ils ne t’ont pas servi[a] et ne se sont pas détournés de leurs mauvaises actions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne t’ont pas rendu de culte » ; le verbe hébreu peut englober à la fois le culte et le service.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne se sont pas repentis de leurs mauvaises actions » ; littéralement, « ne se sont pas détournés de leurs mauvaises actions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: dans leur royaume
  rationale: מַלְכוּת peut désigner le royaume, la royauté ou le règne. Ici, « dans leur royaume » exprime naturellement leur situation de souveraineté établie.
- source_word: וּבְטוּבְךָ הָרָב אֲשֶׁר נָתַתָּ לָהֶם
  choice: malgré toute la bonté dont tu les avais comblés
  rationale: טוּב désigne ici la bonté divine dans ses bienfaits concrets. « Malgré » rend la valeur concessive de l’accumulation contextuelle, tandis que « combler de bonté » formule naturellement en français l’idée de bonté accordée.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: le pays vaste et fertile
  rationale: רְחָבָה signifie « vaste, spacieux » et שְׁמֵנָה, littéralement « gras », qualifie idiomatiquement une terre riche et fertile.
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: que tu avais mis à leur disposition
  rationale: L’expression לִפְנֵיהֶם signifie littéralement « devant eux ». Dans le contexte du don du pays, « mis à leur disposition » transmet clairement l’idée de mise à disposition providentielle sans répéter lourdement « donné ».
- source_word: לֹא עֲבָדוּךָ
  choice: ils ne t’ont pas servi
  rationale: עבד appliqué à Dieu comprend le service, l’obéissance et le culte. « Servir » conserve cette amplitude.
- source_word: וְלֹא שָׁבוּ מִמַּעַלְלֵיהֶם הָרָעִים
  choice: et ne se sont pas détournés de leurs mauvaises actions
  rationale: שׁוב avec מִן exprime le fait de se détourner de quelque chose. מַעֲלָלִים désigne des actes ou des pratiques ; « mauvaises actions » est clair et fidèle.
theological_decisions:
- issue: Sens de עבד à propos de Dieu
  choice: servi
  alternative: rendu un culte
  rationale: « Servir » préserve à la fois les dimensions de culte et d’obéissance liées au verbe hébreu, sans le restreindre au domaine cultuel.
- issue: Portée morale de שׁוב מִן
  choice: ne se sont pas détournés de leurs mauvaises actions
  alternative: ne se sont pas repentis de leurs mauvaises actions
  rationale: La formulation choisie conserve l’image concrète du retournement présente dans l’hébreu, sans remplacer celle-ci par le terme théologique plus interprétatif « se repentir ».
translation_notes:
  register: Français international moderne, digne et accessible. Le verset garde la longue structure cumulative de la prière, tout en employant des tournures françaises naturelles. Les plus-que-parfaits situent les dons divins avant l’infidélité constatée.
