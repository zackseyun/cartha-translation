  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: fr
  text: Tu as vu la détresse de nos pères en Égypte, et tu as entendu leur cri près de la mer des Roseaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement appelée « mer Rouge ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Tu as vu
  rationale: Rend directement ראה tout en laissant le contexte exprimer que Dieu a pris connaissance de leur situation; le tutoiement convient à l’adresse directe de la prière.
- source_word: עֳנִי
  choice: la détresse
  rationale: « Détresse » exprime naturellement en français moderne la misère et la souffrance désignées par עֳנִי, sans en préciser excessivement la cause.
- source_word: אֲבֹתֵינוּ
  choice: de nos pères
  rationale: Le texte hébreu emploie explicitement le masculin pluriel « nos pères »; cette formulation garde aussi le registre historique et communautaire de la prière.
- source_word: בְּמִצְרָיִם
  choice: en Égypte
  rationale: Traduction locative directe et idiomatique.
- source_word: זַעֲקָתָם
  choice: leur cri
  rationale: זְעָקָה désigne un cri de détresse ou un appel au secours; « leur cri » est naturel et conserve la force du terme sans explicitation ajoutée.
- source_word: שָׁמַעְתָּ
  choice: tu as entendu
  rationale: Traduction directe de שמע; le contexte permet d’entendre la portée favorable de cette écoute divine sans l’ajouter au texte.
- source_word: עַל
  choice: près de
  rationale: Dans ce contexte spatial, עַל situe le cri des Israélites au bord ou à proximité de la mer; « près de » est naturel en français et évite l’étrangeté de « sur la mer ».
- source_word: יַם סוּף
  choice: la mer des Roseaux
  rationale: Cette traduction rend les éléments lexicaux de l’hébreu יַם־סוּף plus directement que le nom traditionnel « mer Rouge », lequel est signalé en note.
