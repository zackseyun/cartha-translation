  variant: modern international French
source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: fr
  text: Mais quand ils avaient du repos, ils recommençaient à faire le mal devant toi. Alors tu les laissais au pouvoir de leurs ennemis[a], qui les dominaient. Puis ils revenaient et criaient vers toi ; du ciel, tu les entendais et tu les délivrais, bien des fois, selon ta compassion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main de leurs ennemis », expression hébraïque qui signifie être sous leur pouvoir ou leur contrôle.'
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: Mais quand ils avaient du repos
  rationale: La construction temporelle indique la circonstance de leur rechute sans exprimer « dès que ». L’imparfait convient au résumé d’un cycle répété.
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: ils recommençaient à faire le mal
  rationale: Avec l’infinitif, שׁוב exprime ici la répétition de l’action ; cette formulation française naturelle la distingue du retour ultérieur vers Dieu.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Conserve l’image relationnelle de la présence divine sans réduire le sens à la seule perception visuelle ni expliciter « contre toi ».
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: tu les laissais au pouvoir de leurs ennemis
  rationale: « Laisser » préserve la gravité du jugement sans suggérer nécessairement un abandon définitif ; « au pouvoir de » restitue l’idiome hébreu de la main.
- source_word: וַיִּרְדּוּ בָהֶם
  choice: qui les dominaient
  rationale: Le verbe désigne l’exercice d’une domination sur eux ; « dominaient » est précis sans ajouter explicitement l’idée d’oppression.
- source_word: וַיָּשׁוּבוּ וַיִּזְעָקוּךָ
  choice: Puis ils revenaient à toi et criaient vers toi
  rationale: Le second שׁוב garde son sens de retour ; « à toi » explicite en français la direction impliquée par l’enchaînement avec le cri adressé à Dieu. « Criaient vers toi » conserve l’urgence de זעק.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: du ciel, tu les entendais
  rationale: Le complément placé en tête est conservé et le pronom objet, naturel en français, reprend ceux qui criaient.
- source_word: וְתַצִּילֵם
  choice: et tu les délivrais
  rationale: Le verbe évoque ici la délivrance hors du pouvoir des ennemis ; l’imparfait rend la valeur itérative du résumé.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: bien des fois, selon ta compassion
  rationale: רַבּוֹת s’accorde avec עִתִּים et signifie que les délivrances eurent lieu de nombreuses fois, non que les compassions étaient « abondantes ». Le pluriel hébreu רַחֲמִים se rend idiomatiquement par le singulier collectif « compassion ».
theological_decisions:
- issue: Langage de l’abandon divin
  choice: tu les laissais au pouvoir de leurs ennemis
  alternative: tu les abandonnais entre les mains de leurs ennemis
  rationale: La formulation exprime le retrait de la protection divine et le jugement historique, tout en évitant de faire entendre un abandon absolu ou définitif, contredit par les délivrances répétées du même verset.
- issue: Valeur itérative des formes verbales
  choice: 'imparfaits : « laissais », « entendais », « délivrais »'
  alternative: passés composés ou passés simples accompagnés de « bien des fois »
  rationale: Le passage récapitule un cycle répété. En français, l’imparfait rend naturellement cette répétition habituelle, tandis que « bien des fois » confirme la pluralité des interventions.
- issue: Référent de רַבּוֹת
  choice: « bien des fois »
  alternative: « selon tes abondantes compassions »
  rationale: L’accord grammatical rattache רַבּוֹת, féminin pluriel, à עִתִּים, également féminin pluriel ; il ne modifie pas רַחֲמֶיךָ. La traduction évite donc une lecture théologiquement plausible mais grammaticalement erronée.
translation_notes:
  register: Français international moderne, courant et digne. Les imparfaits présentent le cycle historique comme répété. Le point-virgule marque la réponse divine au cri du peuple sans alourdir la phrase.
