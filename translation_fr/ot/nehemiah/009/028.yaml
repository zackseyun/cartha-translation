    issue: Ajout interprétatif dans « ils revenaient à toi ».
    rationale: Le texte hébreu dit littéralement qu'ils « revenaient », puis qu'ils criaient vers Dieu. Le contexte peut suggérer un retour à Dieu, mais le complément « à toi » n'est pas exprimé et réduit légèrement l'ambiguïté du verbe.
  revised_text: Mais quand ils avaient du repos, ils recommençaient à faire le mal devant toi. Alors tu les laissais au pouvoir de leurs ennemis[a], qui les dominaient. Puis ils revenaient et criaient vers toi ; du ciel, tu les entendais et tu les délivrais, bien des fois, selon ta compassion.
