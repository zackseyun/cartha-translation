language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: fr
  text: Alors tu les as livrés aux mains de leurs adversaires, qui les ont opprimés. Au temps de leur détresse, ils ont crié vers toi ; et toi, du ciel, tu les as entendus. Dans ton immense compassion, tu leur as donné des libérateurs[a], qui les ont sauvés de la main de leurs adversaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sauveurs ». Le mot hébreu vient du verbe « sauver » et désigne ici les agents humains que Dieu a suscités pour délivrer son peuple.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: tu les as livrés aux mains de
  rationale: Dans ce contexte, נתן suivi de בְּיַד signifie remettre quelqu’un au pouvoir d’un autre. « Livrer aux mains de » conserve l’image hébraïque tout en étant naturel en français.
- source_word: צָרֵיהֶם
  choice: leurs adversaires
  rationale: צַר désigne ici des opposants hostiles. « Adversaires » préserve la distinction avec le verbe suivant, qui exprime l’oppression.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: qui les ont opprimés
  rationale: Le verbe évoque l’action de serrer, accabler ou mettre dans la détresse ; « opprimer » convient au contexte de domination ennemie.
- source_word: וּבְעֵת צָרָתָם
  choice: Au temps de leur détresse
  rationale: Cette formulation rend directement la construction temporelle עֵת + צָרָה et maintient le champ lexical de l’affliction.
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: ils ont crié vers toi
  rationale: צעק exprime un appel pressant lancé dans la détresse ; « crier vers » en conserve l’urgence et l’orientation vers Dieu.
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: du ciel, tu les as entendus
  rationale: Le passé composé s’intègre au récit rétrospectif, tandis que « du ciel » préserve l’indication de provenance du texte hébreu.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: Dans ton immense compassion
  rationale: רַחֲמִים peut désigner une compassion profonde et abondante. Le singulier collectif français rend naturellement l’idée portée par le pluriel hébreu et par הָרַבִּים.
- source_word: מֹשִׁיעִים
  choice: des libérateurs
  rationale: Le terme, formé sur la racine ישׁע (« sauver »), désigne ici des agents humains suscités par Dieu pour délivrer le peuple.
- source_word: וְיוֹשִׁיעוּם
  choice: qui les ont sauvés
  rationale: La proposition relative relie naturellement l’action aux « libérateurs », et « sauver » rend directement la racine ישׁע.
- source_word: מִיַּד צָרֵיהֶם
  choice: de la main de leurs adversaires
  rationale: Cette traduction conserve l’image hébraïque de la main comme pouvoir et reprend le même terme que dans la première moitié du verset.
theological_decisions:
- issue: Désignation d’agents humains par מֹשִׁיעִים
  choice: libérateurs
  alternative: sauveurs
  rationale: Le mot peut littéralement être rendu par « sauveurs », mais il désigne ici des êtres humains par lesquels Dieu accorde la délivrance. « Libérateurs » exprime leur fonction sans effacer le lien lexical avec « sauver », maintenu dans la proposition suivante.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. Les images hébraïques de la main et du ciel sont conservées, avec une syntaxe française fluide.
