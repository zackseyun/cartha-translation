base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: fr
  text: Tu leur as donné ton bon Esprit pour les instruire[a]. Tu n’as pas privé leur bouche de ta manne, et tu leur as donné de l’eau pour étancher leur soif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton bon esprit ». L’hébreu peut se comprendre des deux manières ; ici, il désigne probablement l’Esprit de Dieu qui guide et instruit Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: ton bon Esprit
  rationale: Le syntagme signifie littéralement « ton esprit bon ». Dans ce contexte d’action divine qui éclaire et enseigne Israël, « ton bon Esprit » est la lecture la plus probable. La majuscule relève toutefois de l’interprétation, d’où la variante en note.
- source_word: לְהַשְׂכִּילָם
  choice: pour les instruire
  rationale: Le hifil de שׂכל exprime ici l’action de donner de l’intelligence ou du discernement. « Instruire » rend clairement cette valeur causative dans un français naturel.
- source_word: מַנְךָ
  choice: ta manne
  rationale: Le nom désigne la nourriture fournie à Israël au désert et traditionnellement appelée « manne » en français.
- source_word: לֹא מָנַעְתָּ מִפִּיהֶם
  choice: tu n’as pas retiré ta manne de leur bouche
  rationale: מנע signifie « retenir, refuser, retirer ». La formulation conserve l’image concrète de l’hébreu, « de leur bouche », sans la réduire à un simple « tu ne les en as pas privés ».
- source_word: מַיִם ... לִצְמָאָם
  choice: de l’eau pour étancher leur soif
  rationale: La tournure française explicite naturellement la fonction de l’eau donnée face à leur soif, conformément au sens de la construction hébraïque.
theological_decisions:
- issue: L’identification de רוּחֲךָ הַטּוֹבָה comme l’Esprit de Dieu
  choice: ton bon Esprit
  alternative: ton bon esprit
  rationale: Le contexte présente cet esprit comme le don actif de Dieu qui instruit Israël, ce qui favorise une référence à l’Esprit de Dieu. Comme l’hébreu ne marque pas les majuscules et que רוּחַ peut aussi se traduire « esprit », la possibilité est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination hébraïque est allégée par une nouvelle phrase, tandis que l’image concrète « de leur bouche » est conservée. « Étancher leur soif » est idiomatique sans modifier le sens de la provision divine.
