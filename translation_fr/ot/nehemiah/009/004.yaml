  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: fr
  text: Alors Yéchoua, Bani, Qadmiel, Chebania, Bounni, Chérébia, Bani et Kenani se tinrent sur l’estrade des lévites[a] et crièrent d’une voix forte à Yahweh, leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « la montée » ou « les marches des lévites » ; l’expression peut désigner un emplacement surélevé ou un escalier associé aux lévites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se tinrent
  rationale: Dans ce contexte d’assemblée publique, קום indique que les hommes prennent ou occupent une position debout. Le pluriel français s’accorde naturellement avec la liste des sujets, malgré la forme verbale hébraïque au singulier placée avant celle-ci.
- source_word: מַעֲלֵה
  choice: estrade
  rationale: Le nom désigne littéralement une montée, un escalier ou des marches. Ici, « estrade » exprime naturellement la fonction probable d’un emplacement surélevé d’où parlent les lévites, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: הַלְוִיִּם
  choice: des lévites
  rationale: Le groupe construit désigne l’emplacement associé aux lévites. La minuscule convient au nom commun désignant les membres de la tribu ou leur fonction.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: Yéchoua, Bani, Qadmiel, Chebania, Bounni, Chérébia, Bani et Kenani
  rationale: Les noms sont translittérés sous des formes lisibles en français moderne. La répétition de Bani est maintenue conformément au texte hébreu.
- source_word: וַיִּזְעֲקוּ
  choice: crièrent
  rationale: זעק exprime un cri intense, souvent un appel pressant adressé à Dieu. « Crièrent » conserve cette force sans préciser davantage la nature de l’appel.
- source_word: בְּקוֹל גָּדוֹל
  choice: d’une voix forte
  rationale: Cette tournure française naturelle conserve l’image concrète de l’expression hébraïque, littéralement « avec une grande voix ».
- source_word: אֶל יְהוָה
  choice: vers Yahweh
  rationale: La préposition אֶל marque la direction de leur cri. « Vers » préserve cette orientation, et le nom divin est translittéré « Yahweh ».
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le suffixe possessif est rendu directement et conserve la relation exprimée par l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. La translittération « Yahweh » maintient le nom propre et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit l’ordre narratif hébreu tout en employant une syntaxe française fluide. La répétition du nom Bani et l’ambiguïté de מַעֲלֵה sont conservées.
