  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: fr
  text: Tu les as conduits le jour par une colonne de nuée, et la nuit par une colonne de feu, pour leur éclairer le chemin qu’ils devaient suivre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « pour leur donner de la lumière sur le chemin qu’ils devaient suivre ». Littéralement : « pour éclairer pour eux le chemin ».'
    reason: La préposition marque les bénéficiaires (« pour eux »), tandis que « le chemin » est l’objet direct du verbe « éclairer ». Cette note indique une autre formulation française possible sans attribuer au texte la nuance ajoutée de « devant eux ».
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: par une colonne de nuée
  rationale: La préposition ב peut exprimer ici le moyen ou l’accompagnement spatial. « Par » rend naturellement en français le moyen visible par lequel Dieu guidait le peuple, sans exclure la dimension de présence.
- source_word: הִנְחִיתָם
  choice: tu les as conduits
  rationale: Le hifil de נחה signifie ici guider ou conduire. Le passé composé convient au récit rétrospectif de la prière et reste naturel en français moderne.
- source_word: יוֹמָם
  choice: le jour
  rationale: Expression temporelle adverbiale mise en parallèle avec « la nuit ».
- source_word: וּבְעַמּוּד אֵשׁ
  choice: et […] par une colonne de feu
  rationale: La formulation maintient le parallélisme avec la colonne de nuée et rend la même valeur de la préposition ב.
- source_word: לַיְלָה
  choice: la nuit
  rationale: Équivalent temporel naturel, en correspondance équilibrée avec « le jour ».
- source_word: לְהָאִיר לָהֶם
  choice: pour éclairer devant eux
  rationale: L’infinitif hifil exprime le but. « Devant eux » rend idiomatiquement la valeur bénéficiaire de לָהֶם tout en reliant la lumière au chemin.
- source_word: אֶת הַדֶּרֶךְ
  choice: le chemin
  rationale: Le marqueur אֶת présente « le chemin » comme objet direct de l’action d’éclairer. « Chemin » conserve l’image concrète de l’itinéraire.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: qu’ils devaient suivre
  rationale: La proposition relative désigne l’itinéraire prévu pour eux. « Suivre un chemin » est plus naturel en français que le calque « marcher dans lequel » et exprime bien l’orientation attendue.
theological_decisions:
- issue: Image de la conduite divine pendant la traversée du désert
  choice: Présenter sobrement la conduite historique du peuple par la nuée et le feu
  alternative: Expliciter dans le texte une interprétation symbolique ou typologique de la présence divine
  rationale: L’hébreu met directement l’accent sur l’action de Dieu qui conduit et éclaire la route. La traduction n’ajoute aucune interprétation doctrinale étrangère au verset.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme « le jour… la nuit » et « colonne de nuée… colonne de feu » est conservé, tandis que la proposition finale est formulée idiomatiquement.
