source:
  edition: WLC
  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: fr
  text: et une lettre pour Asaph, gardien du domaine boisé du roi[a], afin qu’il me fournisse du bois de construction pour les poutres des portes de la citadelle du temple[b], ainsi que pour la muraille de la ville et pour la maison où j’habiterai. Le roi m’accorda tout cela, car la bonne main de mon Dieu était sur moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du parc royal » ou « du verger royal ». Le mot hébreu désigne un domaine royal aménagé, probablement boisé ici puisqu’il doit fournir du bois de construction.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la citadelle qui est à la Maison ». « La Maison » désigne vraisemblablement ici le temple; la relation précise peut exprimer l’appartenance ou une association avec le temple.
    reason: lexical_alternative
  - marker: c
    text: L’expression « la bonne main de mon Dieu était sur moi » évoque l’action favorable et providentielle de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: une lettre
  rationale: Le nom désigne une lettre ou un document officiel; « une lettre » convient naturellement à la série de requêtes adressées au roi.
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: gardien du domaine boisé du roi
  rationale: פַּרְדֵּס peut désigner un parc, un verger ou un domaine royal aménagé. Puisqu’Asaph doit fournir du bois, « domaine boisé » rend clairement la fonction du lieu sans le réduire à une forêt sauvage.
- source_word: יִתֶּן לִי עֵצִים
  choice: qu’il me fournisse du bois de construction
  rationale: עֵצִים signifie littéralement « arbres/bois »; le contexte de construction justifie « bois de construction ».
- source_word: לְקָרוֹת
  choice: pour faire les poutres
  rationale: Le verbe renvoie à la pose de poutres ou à la charpente. Cette formulation reste claire sans limiter nécessairement l’action à la couverture d’un toit.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבָּיִת
  choice: les portes de la citadelle attenante au temple
  rationale: בִּירָה désigne une citadelle ou forteresse; אֲשֶׁר לַבַּיִת exprime son association avec « la Maison », ici le temple. « Attenante » préserve ce rapport sans affirmer une appartenance administrative précise.
- source_word: חוֹמַת הָעִיר
  choice: la muraille de la ville
  rationale: Rendu direct et naturel de la chaîne construite hébraïque.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: la maison où j’habiterai
  rationale: Littéralement « la maison dans laquelle j’entrerai »; dans le contexte, il s’agit de la résidence que Néhémie occupera. Le français idiomatique exprime ici cette fonction.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: Le roi m’accorda tout cela
  rationale: L’hébreu omet l’objet explicite. « Tout cela » reprend naturellement en français l’ensemble des demandes précédentes sans les limiter aux seules lettres.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלָי
  choice: car la bonne main de mon Dieu était sur moi
  rationale: La formulation conserve l’image anthropomorphique caractéristique d’Esdras-Néhémie tout en rendant naturellement la valeur causale du contexte.
theological_decisions:
- issue: La providence divine exprimée par « la bonne main de mon Dieu »
  choice: Conserver l’image de la main et expliciter la relation causale par « car »
  alternative: selon la bonne main de mon Dieu sur moi
  rationale: L’image de la main exprime l’action providentielle favorable de Dieu et mérite d’être conservée. « Car » communique en français le lien entre la faveur divine et la réponse du roi, sans réduire l’expression à une abstraction.
- issue: Identification de הַבַּיִת dans « la citadelle qui est à la Maison »
  choice: le temple
  alternative: la Maison
  rationale: Dans ce contexte, « la Maison » désigne vraisemblablement le temple. Le rendre ainsi donne au lecteur moderne le référent attendu, tandis que la note signale la forme littérale et l’ambiguïté de la relation syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset commence par « et » parce qu’il poursuit directement la demande amorcée au verset précédent. « Citadelle » est retenu comme terme historique courant; « domaine boisé » évite de donner à פַּרְדֵּס le sens trop étroit de « forêt ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
