revisions:
- from: et une lettre pour Asaph, gardien du domaine boisé du roi[a], afin qu’il me fournisse du bois de construction pour faire les poutres des portes de la citadelle attenante au temple[b], de la muraille de la ville et de la maison où j’habiterai. Le roi m’accorda tout cela, car la bonne main de mon Dieu était sur moi[c].
  to: et une lettre pour Asaph, gardien du domaine boisé du roi[a], afin qu’il me fournisse du bois de construction pour les poutres des portes de la citadelle du temple[b], ainsi que pour la muraille de la ville et pour la maison où j’habiterai. Le roi m’accorda tout cela, car la bonne main de mon Dieu était sur moi[c].
  rationale: La révision évite de présenter comme certaine une contiguïté physique entre la citadelle et le temple, tout en conservant l’identification contextuellement probable de « la Maison » au temple et en signalant l’ambiguïté dans la note. Elle clarifie aussi que le bois est demandé pour les poutres des portes et, plus généralement, pour les deux autres constructions. Les autres choix, notamment l’expression imagée de la bonne main de Dieu et la reprise française « tout cela », sont conservés.
