source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/חֹ֣דֶשׁ נִיסָ֗ן שְׁנַ֥ת עֶשְׂרִ֛ים לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ יַ֣יִן לְ/פָנָ֑י/ו וָ/אֶשָּׂ֤א אֶת הַ/יַּ֨יִן֙ וָ/אֶתְּנָ֣/ה לַ/מֶּ֔לֶךְ וְ/לֹא הָיִ֥יתִי רַ֖ע לְ/פָנָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: fr
  text: Au mois de Nisan, la vingtième année du roi Artaxerxès, alors que le vin était devant lui, je pris le vin et le donnai au roi. Or, je ne m’étais pas montré triste en sa présence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je n’avais pas été mauvais devant lui ». Dans ce contexte, l’expression hébraïque désigne une apparence triste ou sombre en présence du roi.'
    reason: Précise le sens contextuel d’un idiome dont la traduction littérale serait trompeuse en français.
lexical_decisions:
- source_word: וַיְהִי
  choice: Au mois de Nisan…
  rationale: La formule narrative ouvre la scène datée. En français, son effet est rendu naturellement par l’entrée directe dans le cadre temporel, sans l’archaïsme « il advint ».
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: Au mois de Nisan
  rationale: Conserve l’expression formelle de datation et translittère le nom du mois selon l’usage français.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: la vingtième année du roi Artaxerxès
  rationale: Rend idiomatiquement la datation par année de règne; « Artaxerxès » est la forme française consacrée.
- source_word: יַיִן לְפָנָיו
  choice: alors que le vin était devant lui
  rationale: Conserve l’expression sobre et concrète du texte sans introduire une coupe, absente de l’hébreu.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: je pris le vin
  rationale: Dans le contexte du service royal, נשׂא désigne le fait de prendre ou soulever le vin pour le servir; « pris » reste naturel sans préciser davantage que la source.
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: et le donnai au roi
  rationale: Traduction directe de נתן, avec reprise pronominale de « vin ».
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: Or, je ne m’étais pas montré triste en sa présence
  rationale: רַע signifie littéralement « mauvais », mais décrit ici l’apparence sombre ou affligée de Néhémie devant le roi. Le plus-que-parfait exprime l’état antérieur sans ajouter l’emphase de « jamais ».
