source:
  edition: WLC
  text: וְ/הַ/סְּגָנִ֗ים לֹ֤א יָדְעוּ֙ אָ֣נָה הָלַ֔כְתִּי וּ/מָ֖ה אֲנִ֣י עֹשֶׂ֑ה וְ/לַ/יְּהוּדִ֨ים וְ/לַ/כֹּהֲנִ֜ים וְ/לַ/חֹרִ֣ים וְ/לַ/סְּגָנִ֗ים וּ/לְ/יֶ֨תֶר֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה עַד כֵּ֖ן לֹ֥א הִגַּֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: fr
  text: Mais les responsables ne savaient ni où j’étais allé ni ce que je faisais. Jusque-là, je n’avais rien dit aux Juifs[a], aux prêtres, aux notables, aux responsables ni aux autres qui faisaient le travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Judéens ». Le mot hébreu יְהוּדִים peut désigner soit les habitants de Juda, soit plus largement la communauté juive.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: les hauts fonctionnaires
  rationale: Le terme désigne des responsables administratifs ou dirigeants subordonnés. « Hauts fonctionnaires » est naturel en français et convient aux deux occurrences sans imposer un titre perse trop précis.
- source_word: יָדְעוּ
  choice: ne savaient
  rationale: Le qal de ידע signifie couramment « savoir ». L’imparfait convient à l’arrière-plan narratif.
- source_word: אָנָה הָלַכְתִּי
  choice: où j’étais allé
  rationale: אָנָה indique la destination, et le plus-que-parfait exprime naturellement en français le déplacement antérieur au constat des responsables.
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: ni ce que je faisais
  rationale: Le participe exprime ici une action ou un projet en cours. La structure française « ne… ni… ni… » relie idiomatiquement les deux éléments ignorés.
- source_word: לַיְּהוּדִים
  choice: aux Juifs
  rationale: יְהוּדִים peut désigner les Juifs comme communauté ou les habitants de Juda. « Juifs » est la formulation française usuelle, tandis qu’une note conserve l’alternative régionale.
- source_word: לַכֹּהֲנִים
  choice: aux prêtres
  rationale: Équivalent direct et usuel de כֹּהֲנִים.
- source_word: לַחֹרִים
  choice: aux notables
  rationale: Dans ce contexte social et administratif, חֹרִים désigne les membres influents ou nobles de la communauté. « Notables » est clair, actuel et moins lié à un système nobiliaire précis.
- source_word: וּלְיֶתֶר
  choice: aux autres
  rationale: יֶתֶר désigne le reste d’un ensemble. « Aux autres » s’intègre naturellement à l’énumération française.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: qui accompliraient le travail
  rationale: Le participe singulier à valeur collective désigne les autres personnes concernées par l’exécution du travail. Dans le contexte, le chantier n’a pas encore été annoncé; le conditionnel évite de laisser entendre qu’il avait déjà commencé tout en gardant la référence au groupe destiné à l’accomplir.
- source_word: עַד כֵּן
  choice: Jusque-là
  rationale: Cette expression temporelle marque le moment jusqu’auquel Néhémie avait gardé son projet secret.
- source_word: לֹא הִגַּדְתִּי
  choice: je n’avais rien dit
  rationale: Le hiphil de נגד signifie « annoncer, faire connaître, dire ». « N’avoir rien dit à » est idiomatique en français et restitue la rétention d’information.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La première phrase conserve le parallélisme des deux informations ignorées. « Notables » évite l’archaïsme ou la connotation féodale possible de « nobles ». Le marqueur [a] figure immédiatement après « Juifs ».
