base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: fr
  text: 'Je leur répondis : « Le Dieu du ciel, c’est lui qui nous fera réussir. Quant à nous, ses serviteurs, nous nous lèverons et nous bâtirons. Mais vous, vous n’avez à Jérusalem ni part, ni droit, ni souvenir[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ni mémorial »; le terme hébreu peut désigner un souvenir conservé ou une commémoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: Je leur répondis
  rationale: L’expression idiomatique signifie donner une réponse. En français, « je leur répondis » rend naturellement les deux formulations hébraïques sans la lourdeur de « je leur répondis une parole et leur dis ».
- source_word: אֱלֹהֵי הַשָּׁמַיִם הוּא
  choice: Le Dieu du ciel, c’est lui
  rationale: « Le Dieu du ciel » est le titre postexilique usuel; la dislocation « c’est lui » conserve l’insistance portée par le pronom הוּא.
- source_word: יַצְלִיחַ לָנוּ
  choice: nous donnera la réussite
  rationale: Le hiphil de צלח exprime ici le succès accordé par Dieu à l’entreprise. Cette formulation garde la nuance causative et reste naturelle.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte, le mot désigne ceux qui servent Dieu et lui sont attachés, plutôt qu’un statut social d’esclaves.
- source_word: נָקוּם וּבָנִינוּ
  choice: nous nous lèverons et nous bâtirons
  rationale: La coordination exprime la résolution de passer à l’action. « Bâtir » reste proche du verbe simple, sans expliciter « rebâtir », que le contexte permet néanmoins de comprendre.
- source_word: אֵין חֵלֶק
  choice: vous n’avez … ni part
  rationale: חֵלֶק désigne une portion ou une participation reconnue; « part » convient à la formule d’exclusion.
- source_word: וּצְדָקָה
  choice: ni droit
  rationale: Dans ce contexte politico-juridique, צְדָקָה renvoie à un droit ou titre légitime sur Jérusalem, non à la justice morale.
- source_word: וְזִכָּרוֹן
  choice: ni souvenir
  rationale: Le terme désigne le fait d’être gardé en mémoire ou d’avoir une présence commémorée. « Souvenir » préserve cette nuance, tandis qu’une note signale les autres compréhensions possibles.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition française « à » est la tournure locative idiomatique avec un nom de ville.
theological_decisions:
- issue: Désignation des personnes au service de Dieu
  choice: ses serviteurs
  alternative: ses esclaves
  rationale: Le propos porte ici sur l’allégeance à Dieu et le service accompli sous son autorité. « Serviteurs » rend cette relation sans introduire au premier plan un statut social qui n’est pas l’enjeu du passage.
- issue: Sens de צְדָקָה dans la formule d’exclusion
  choice: droit
  alternative: titre légitime; justice
  rationale: Néhémie nie aux adversaires toute qualité reconnue à Jérusalem. Le sens juridico-politique de « droit » convient mieux que le sens moral ou théologique de « justice ».
- issue: Sens de זִכָּרוֹן à propos de Jérusalem
  choice: souvenir
  alternative: titre mémoriel; droit de cité; monument commémoratif
  rationale: Le mot demeure inhabituel dans cette triade et peut évoquer une reconnaissance historique ou une présence commémorée. Le texte garde le terme concret et ambigu, avec une note explicative.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le passé simple convient au récit biblique écrit. La reprise emphatique « c’est lui » et le contraste « Quant à nous… Mais vous… » reproduisent les oppositions du texte hébreu. La triade finale est conservée plutôt que réduite à une paraphrase juridique.
