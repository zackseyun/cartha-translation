  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: fr
  text: 'Le roi me dit : « Pourquoi as-tu le visage triste[a], alors que tu n’es pas malade ? Ce n’est rien d’autre qu’une tristesse du cœur[b]. » Je fus alors saisi d’une très grande peur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ton visage est mauvais » ; expression désignant ici un visage triste ou troublé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une peine du cœur », « un trouble intérieur ». L’hébreu dit littéralement « un mal du cœur » ; il s’agit ici d’une détresse intérieure plutôt que d’un mal moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Interrogatif ordinaire exprimant la raison ; « Pourquoi » est naturel et précis en français.
- source_word: פָּנֶיךָ רָעִים
  choice: as-tu le visage triste
  rationale: Littéralement, « ton visage est mauvais » ; dans ce contexte, il s’agit d’une expression triste ou troublée. La formulation française conserve l’image du visage tout en rendant clairement l’idiome.
- source_word: חוֹלֶה
  choice: malade
  rationale: Équivalent français direct et courant de l’état de maladie.
- source_word: וְאַתָּה אֵינְךָ חוֹלֶה
  choice: alors que tu n’es pas malade
  rationale: La tournure exprime ici le contraste entre l’apparence du visage et l’absence de maladie physique.
- source_word: אֵין זֶה כִּי אִם
  choice: Ce ne peut être qu’
  rationale: Cette construction exclut les autres explications ; la tournure choisie restitue naturellement cette force exclusive.
- source_word: רֹעַ לֵב
  choice: une tristesse du cœur
  rationale: Littéralement, « mal du cœur » ou « mauvais état du cœur ». Le contexte oppose la maladie physique à une détresse intérieure, sans nécessairement évoquer le mal moral.
- source_word: וָאִירָא
  choice: Je fus alors saisi ... de peur
  rationale: Le wayyiqtol fait avancer le récit ; « alors » marque la succession, et la tournure française exprime naturellement la réaction de Néhémie.
- source_word: הַרְבֵּה מְאֹד
  choice: d’une très grande peur
  rationale: Les deux éléments intensifient fortement la peur ; cette expression française en conserve l’emphase sans lourdeur.
theological_decisions:
- issue: Sens de רֹעַ לֵב
  choice: 'Détresse intérieure : « tristesse du cœur »'
  alternative: 'Mal moral : « mauvais fond du cœur » ou « méchanceté du cœur »'
  rationale: Le roi oppose explicitement cette réalité à la maladie physique et interprète l’expression de Néhémie comme le signe d’une souffrance intérieure. La traduction n’importe donc pas une accusation morale, tout en signalant en note l’étendue littérale de l’expression hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct demeure naturel ; les images hébraïques du visage et du cœur sont conservées, avec des notes pour leur sens idiomatique.
