base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: fr
  text: 'Mais lorsque Sanballat le Horonite, Tobia, le serviteur ammonite[a], et Guéshem l’Arabe l’apprirent, ils se moquèrent de nous et nous méprisèrent. Ils dirent : « Qu’est-ce que vous êtes en train de faire ? Vous révoltez-vous contre le roi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tobia, le fonctionnaire ammonite » ; certains comprennent ici le mot « serviteur » comme un titre officiel.
    reason: Alternative lexicale et contextuelle pour עֶבֶד.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Quand … l’apprirent
  rationale: Le waw narratif fait progresser le récit, tandis que la subordination temporelle relie naturellement l’information reçue à la réaction hostile qui suit. Le pronom « l’ » reprend le projet exposé au verset précédent.
- source_word: הַחֹרֹנִי
  choice: le Horonite
  rationale: Cette désignation géographique ou gentilice est conservée sous une forme française traditionnelle et transparente.
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: le serviteur ammonite
  rationale: עֶבֶד désigne fondamentalement une personne au service d’une autre, avec une condition précise qui reste incertaine ici. « Serviteur » évite de trancher sans preuve entre esclave et haut fonctionnaire; une note conserve l’autre interprétation contextuelle possible.
- source_word: הָעַרְבִי
  choice: l’Arabe
  rationale: Rendu direct et naturel de la désignation ethnique ou régionale.
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: ils se moquèrent de nous
  rationale: Le verbe exprime la raillerie et le ridicule; cette formulation est courante en français moderne.
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: nous méprisèrent
  rationale: Le verbe marque le mépris et renforce la raillerie exprimée par le membre précédent.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Qu’est-ce que vous êtes en train de faire ?
  rationale: Cette formulation naturelle exprime l’interrogation accusatrice du texte sans le calque peu idiomatique « Quelle est cette chose que vous faites ? ».
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: Vous révoltez-vous contre le roi ?
  rationale: La construction est rendue comme une question accusatrice; le participe hébreu présente l’action comme en cours.
theological_decisions:
- issue: Statut de Tobia désigné par עֶבֶד
  choice: serviteur
  alternative: esclave; fonctionnaire
  rationale: Le terme peut désigner un serviteur ou esclave, mais il peut aussi fonctionner dans certains contextes comme une désignation administrative. Le contexte ne permet pas d’établir avec certitude la condition juridique de Tobia; le texte principal reste donc sobre, et la note signale l’interprétation titulaire.
translation_notes:
  register: Français international moderne, narratif et digne. Les gentilés traditionnels « Horonite » et « Arabe » sont conservés. Le discours direct reste incisif et naturel, sans atténuer l’accusation de rébellion.
