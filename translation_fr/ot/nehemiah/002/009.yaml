  text: וָֽ/אָב֗וֹא אֶֽל פַּֽחֲווֹת֙ עֵ֣בֶר הַ/נָּהָ֔ר וָ/אֶתְּנָ֣/ה לָ/הֶ֔ם אֵ֖ת אִגְּר֣וֹת הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֤ח עִמִּ/י֙ הַ/מֶּ֔לֶךְ שָׂ֥רֵי חַ֖יִל וּ/פָרָשִֽׁים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: fr
  text: Je me rendis donc auprès des gouverneurs de l’Au-delà-du-Fleuve[a] et je leur remis les lettres du roi. Le roi avait envoyé avec moi des officiers de l’armée et des cavaliers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette expression désigne vraisemblablement la région administrative perse située à l’ouest de l’Euphrate, aussi appelée la Transeuphratène.
    reason: cultural_note
  - marker: b
    text: Ou « des chefs militaires et des hommes à cheval ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: gouverneurs
  rationale: Le terme désigne des responsables territoriaux de l’administration perse. « Gouverneurs » est précis, naturel et plus accessible que « satrapes ».
- source_word: עֵבֶר הַנָּהָר
  choice: Au-delà-du-Fleuve
  rationale: L’expression est conservée comme une désignation géographique et administrative, sans ajouter « province » dans le texte principal. Les majuscules et les traits d’union signalent sa valeur de nom régional.
- source_word: אִגְּרוֹת
  choice: lettres
  rationale: Le mot désigne ici des écrits officiels du roi. « Lettres » reste proche de l’hébreu tout en convenant naturellement au contexte.
- source_word: שָׂרֵי חַיִל
  choice: officiers de l’armée
  rationale: L’expression désigne des chefs militaires. Cette formulation claire conserve à la fois leur rang d’autorité et leur appartenance à l’armée.
- source_word: פָרָשִׁים
  choice: cavaliers
  rationale: Le terme désigne des hommes montés à cheval. « Cavaliers » est naturel en français et reste moins collectif que « cavalerie ».
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: Le roi avait envoyé avec moi
  rationale: Le plus-que-parfait rend la valeur explicative de cette proposition, qui précise que l’escorte avait été envoyée avec Néhémie avant son arrivée auprès des gouverneurs.
- source_word: וָאָבוֹא
  choice: Je me rendis donc
  rationale: Le passé simple convient au récit suivi, tandis que « donc » marque naturellement la progression narrative. « Se rendre auprès de » exprime ici l’arrivée auprès des gouverneurs.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le passé simple soutient le registre narratif biblique sans archaïsme excessif. La désignation « Au-delà-du-Fleuve » préserve la formulation hébraïque et son caractère administratif probable, expliqué en note.
