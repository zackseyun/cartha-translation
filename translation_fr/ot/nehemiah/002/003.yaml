source:
  edition: WLC
  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ הַ/מֶּ֖לֶךְ לְ/עוֹלָ֣ם יִחְיֶ֑ה מַדּ֜וּעַ לֹא יֵרְע֣וּ פָנַ֗/י אֲשֶׁ֨ר הָ/עִ֜יר בֵּית קִבְר֤וֹת אֲבֹתַ/י֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ אֻכְּל֥וּ בָ/אֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: fr
  text: 'Je dis au roi : « Que le roi vive toujours ! Pourquoi n’aurais-je pas le visage triste, alors que la ville, lieu des tombeaux de mes ancêtres[a], est en ruine et que ses portes ont été dévorées par le feu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison des tombeaux de mes pères », expression désignant le lieu associé à la sépulture de ses ancêtres.'
    reason: Précise la forme concrète de l’expression hébraïque et justifie sa traduction idiomatique dans le texte.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Je dis
  rationale: Le wayyiqtol de אמר poursuit simplement le récit au passé. Le passé simple convient au registre narratif écrit et reste naturel dans une traduction biblique française.
- source_word: לַמֶּלֶךְ / הַמֶּלֶךְ
  choice: au roi / le roi
  rationale: La première occurrence désigne le destinataire; la seconde appartient à la formule déférente d’adresse royale.
- source_word: לְעוֹלָם יִחְיֶה
  choice: Que le roi vive toujours !
  rationale: Cette formulation rend naturellement en français la formule conventionnelle de souhait et d’acclamation adressée au souverain.
- source_word: לֹא יֵרְעוּ פָנַי
  choice: Pourquoi n’aurais-je pas le visage triste
  rationale: L’expression hébraïque associe la tristesse ou l’affliction au visage. Cette tournure française conserve l’image corporelle sans paraître artificielle.
- source_word: הָעִיר בֵּית קִבְרוֹת אֲבֹתַי
  choice: la ville, lieu des tombeaux de mes ancêtres
  rationale: L’apposition est conservée, tandis que « lieu » transmet la valeur idiomatique de בֵּית sans suggérer à tort un bâtiment funéraire unique. « Ancêtres » est plus naturel et plus large que « pères » en français moderne.
- source_word: חֲרֵבָה
  choice: est en ruine
  rationale: Le prédicat décrit l’état de dévastation de la ville; « en ruine » est clair, actuel et fidèle.
- source_word: אֻכְּלוּ בָאֵשׁ
  choice: ont été dévorées par le feu
  rationale: Le passif de אכל personnifie le feu comme ce qui dévore. La traduction préserve cette image forte plutôt que de la réduire à « brûlées ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formule de cour conserve sa solennité; l’image du visage triste et celle du feu qui dévore sont maintenues.
