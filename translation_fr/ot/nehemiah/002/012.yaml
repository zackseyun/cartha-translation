source:
  edition: WLC
  text: וָ/אָק֣וּם לַ֗יְלָה אֲנִי֮ וַ/אֲנָשִׁ֣ים מְעַט֮ עִמִּ/י֒ וְ/לֹא הִגַּ֣דְתִּי לְ/אָדָ֔ם מָ֗ה אֱלֹהַ/י֙ נֹתֵ֣ן אֶל לִבִּ֔/י לַ/עֲשׂ֖וֹת לִ/ירוּשָׁלִָ֑ם וּ/בְהֵמָה֙ אֵ֣ין עִמִּ֔/י כִּ֚י אִם הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אֲנִ֖י רֹכֵ֥ב בָּֽ/הּ׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: fr
  text: Je me levai donc de nuit, accompagné de quelques hommes. Je n’avais dit à personne ce que mon Dieu mettait dans mon cœur de faire pour Jérusalem[a]. Il n’y avait avec moi aucun animal, sauf celui que je montais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « ce que mon Dieu avait mis dans mon cœur » ou « ce que mon Dieu m’inspirait de faire pour Jérusalem ».'
    reason: Le participe hébreu peut décrire une action en cours, la présenter de façon vive ou renvoyer, selon le contexte narratif, à une résolution déjà donnée.
  - marker: b
    text: Le terme hébreu désigne un animal en général ; il s’agit ici de la monture de Néhémie.
    reason: La note précise la portée contextuelle du mot sans remplacer le terme général du texte source par une espèce non indiquée.
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: Je me levai donc de nuit
  rationale: Le wayyiqtol de קום poursuit le récit, d’où « donc », tandis que « de nuit » exprime naturellement en français le moment de l’action et conserve le ton narratif.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: accompagné de quelques hommes
  rationale: Cette formulation française naturelle maintient la présence explicite de Néhémie et du petit groupe masculin qui l’accompagne, sans reproduire lourdement l’ordre des mots hébreu.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: Je n’avais dit à personne
  rationale: Le plus-que-parfait situe la non-divulgation avant cette sortie nocturne. Dans ce contexte indéfini, לְאָדָם signifie naturellement « à personne » plutôt que littéralement « à un homme ».
- source_word: מָה אֱלֹהַי נֹתֵן אֶל לִבִּי
  choice: ce que mon Dieu mettait dans mon cœur
  rationale: Le participe נֹתֵן peut présenter l’action comme en cours ou de manière vivante. La traduction conserve l’image hébraïque du cœur, siège de la pensée, de la volonté et de la résolution, sans transformer cette impulsion divine en révélation verbale explicite.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: de faire pour Jérusalem
  rationale: La formulation reste volontairement générale comme l’hébreu et n’anticipe pas les précisions ultérieures concernant la reconstruction.
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם הַבְּהֵמָה
  choice: Il n’y avait avec moi aucun animal, sauf celui
  rationale: בְּהֵמָה est un terme général désignant ici un animal servant de monture. « Animal » préserve cette généralité, tandis que la construction avec « sauf » rend clairement l’exception introduite par כִּי אִם.
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: que je montais
  rationale: Cette tournure idiomatique française restitue simplement le participe רֹכֵב et la scène en cours.
theological_decisions:
- issue: L’impulsion divine à l’origine du projet de Néhémie
  choice: « ce que mon Dieu mettait dans mon cœur »
  alternative: « ce que mon Dieu avait mis dans mon cœur » ou « ce que mon Dieu m’inspirait de faire »
  rationale: Le texte attribue à Dieu l’origine intérieure du projet, mais ne précise ni le mode de cette action ni s’il s’agit d’une révélation verbale. La formulation choisie conserve à la fois l’initiative divine, l’action humaine et la valeur progressive ou vive du participe.
translation_notes:
  register: Français international moderne, narratif et digne. « De nuit » et « je me levai » maintiennent une légère élévation de registre sans archaïsme. La syntaxe a été assouplie pour éviter un calque hébreu lourd, tout en conservant la discrétion de Néhémie, l’initiative attribuée à Dieu et la généralité de son projet pour Jérusalem.
