base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: fr
  text: 'Le roi me dit, tandis que la reine[a] était assise à ses côtés : « Combien de temps durera ton voyage, et quand reviendras-tu ? » Le roi jugea donc bon de m’envoyer, et je lui indiquai une date.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la consort » ou « l’épouse royale ». Le terme hébreu désigne la consort royale du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Équivalent français courant de מֶלֶךְ dans ce récit royal.
- source_word: הַשֵּׁגַל
  choice: la reine
  rationale: Le terme rare désigne ici la femme ou compagne royale du roi. « La reine » est naturel en français, tandis que la nuance plus précise de consort est signalée en note.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: était assise à ses côtés
  rationale: Le participe pose une circonstance simultanée et אֵצֶל exprime la proximité; cette formulation est naturelle et digne en français.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: Combien de temps durera ton voyage
  rationale: La question porte idiomatiquement sur la durée du déplacement. L'ajout de « durera », implicite en hébreu, donne un français clair.
- source_word: וּמָתַי תָּשׁוּב
  choice: et quand reviendras-tu
  rationale: Rend directement la question temporelle et le sens usuel de שׁוּב, « revenir ».
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ וַיִּשְׁלָחֵנִי
  choice: Le roi consentit donc à me laisser partir
  rationale: L'expression idiomatique indique l'approbation du roi suivie de son autorisation de départ. « Consentit » préserve l'acte favorable sans traduire littéralement « cela fut bon à ses yeux ».
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: et je lui indiquai une date
  rationale: זְמָן désigne un moment ou terme fixé. Dans la réponse à « quand reviendras-tu ? », « une date » exprime naturellement l'échéance précisée au roi sans ajouter sa valeur absente du texte.
