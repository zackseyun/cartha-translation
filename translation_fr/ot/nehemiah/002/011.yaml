  text: So I came to Jerusalem and was there three days.
translation:
  language: fr
  text: J’arrivai à Jérusalem et j’y restai trois jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבוֹא
  choice: J’arrivai donc
  rationale: Le waw consécutif fait avancer le récit, et בוא exprime ici l’arrivée à destination. « Donc » assure un enchaînement naturel avec le contexte sans ajouter de causalité forte.
- source_word: אֶל יְרוּשָׁלִָם
  choice: à Jérusalem
  rationale: Avec un verbe de mouvement, אֶל marque la destination. Le français idiomatique emploie « arriver à Jérusalem ».
- source_word: וָאֱהִי שָׁם
  choice: et j’y restai
  rationale: היה signifie fondamentalement « être », mais, associé à שָׁם et à une durée, il indique ici le fait de demeurer sur place. « J’y restai » rend ce sens contextuel en français naturel.
- source_word: יָמִים שְׁלֹשָׁה
  choice: trois jours
  rationale: Le groupe nominal indique une durée; en français, celle-ci se construit directement après « rester », sans préposition.
