base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: fr
  text: 'Je dis alors au roi : « Si le roi le juge bon, qu’on me remette des lettres destinées aux gouverneurs de la Transeuphratène[a], afin qu’ils me laissent passer jusqu’à mon arrivée en Juda. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Transeuphratène » est le nom administratif perse de la région située à l’ouest de l’Euphrate.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: Puis je dis
  rationale: Le waw consécutif fait avancer le récit; « Puis » exprime naturellement la succession en français.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Si le roi le juge bon
  rationale: Cette formule de cour déférente est rendue de manière naturelle tout en conservant l’idée littérale de ce qui paraît bon au roi.
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: qu’on me remette des lettres
  rationale: Le tour français impersonnel restitue la demande polie adressée au roi et « remette » convient à la délivrance de documents officiels.
- source_word: פַּחֲוֹת
  choice: gouverneurs
  rationale: Le terme désigne les administrateurs provinciaux de l’Empire perse.
- source_word: עֵבֶר הַנָּהָר
  choice: la Transeuphratène
  rationale: Ce nom français désigne la circonscription perse située à l’ouest de l’Euphrate et évite de prendre l’expression pour une simple indication directionnelle.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: afin qu’ils me laissent passer
  rationale: Dans ce contexte administratif, le hiphil de עבר exprime l’autorisation ou la facilitation du passage.
- source_word: עַד אֲשֶׁר אָבוֹא
  choice: jusqu’à mon arrivée
  rationale: Cette formulation française rend clairement la limite temporelle du passage demandé.
- source_word: יְהוּדָה
  choice: Juda
  rationale: « Juda » est la forme française traditionnelle du nom géographique; « Judée » serait moins adaptée à ce contexte perse.
