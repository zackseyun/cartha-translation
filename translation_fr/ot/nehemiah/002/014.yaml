  text: וָ/אֶֽעֱבֹר֙ אֶל שַׁ֣עַר הָ/עַ֔יִן וְ/אֶל בְּרֵכַ֖ת הַ/מֶּ֑לֶךְ וְ/אֵין מָק֥וֹם לַ/בְּהֵמָ֖ה לַ/עֲבֹ֥ר תַּחְתָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: fr
  text: Puis je continuai jusqu’à la porte de la Source[a] et au bassin du roi, mais il n’y avait pas assez de place pour que l’animal que je montais puisse passer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la porte de la Fontaine ». Le mot hébreu peut désigner une source ou une fontaine.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour que l’animal sous moi passe ». Il s’agit de l’animal que Néhémie montait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: Puis je suis passé
  rationale: Le verbe עבר exprime ici la poursuite du déplacement au cours de l’inspection nocturne. « Je suis passé » est naturel en français et ne suppose pas nécessairement le franchissement d’une limite.
- source_word: שַׁעַר הָעַיִן
  choice: la porte de la Source
  rationale: Dans ce contexte topographique, עַיִן désigne une source ou une fontaine. « Porte de la Source » garde le rapport de détermination de l’hébreu et constitue un nom de lieu clair en français.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: le Réservoir du Roi
  rationale: בְּרֵכָה désigne un bassin ou un réservoir. « Réservoir » convient à l’aménagement hydraulique évoqué, tandis que les majuscules signalent un lieu nommé.
- source_word: וְאֵין מָקוֹם
  choice: mais il n’y avait pas assez de place
  rationale: La conjonction prend ici une valeur adversative puisque le manque d’espace empêche la progression. L’ajout idiomatique « assez de » exprime naturellement en français la place insuffisante sans modifier le sens.
- source_word: לַבְּהֵמָה
  choice: la bête
  rationale: בְּהֵמָה est un terme général désignant un animal, sans préciser l’espèce. « Bête » conserve cette généralité et convient à un animal de selle dans un récit biblique de registre digne.
- source_word: לַעֲבֹר
  choice: puisse passer
  rationale: Le français emploie naturellement le subjonctif dans la construction consécutive « assez de place pour que… puisse passer »; le sens spatial simple de עבר est conservé.
- source_word: תַּחְתָּי
  choice: que je montais
  rationale: Littéralement « sous moi »; dans le contexte, l’expression indique que Néhémie se trouvait sur l’animal. « Que je montais » rend explicitement cette relation en français courant, tandis qu’une note préserve la forme hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, international et narratif, avec un ton digne. Les noms topographiques sont rendus de façon transparente. La formulation évite de préciser l’espèce de la monture, que l’hébreu ne nomme pas, et la note conserve l’image littérale « sous moi ».
