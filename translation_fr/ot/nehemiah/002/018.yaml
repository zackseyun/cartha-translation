base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: fr
  text: 'Je leur fis alors connaître comment la main de mon Dieu s’était montrée favorable envers moi[a], ainsi que les paroles que le roi m’avait adressées. Ils dirent : « Levons-nous et bâtissons[b] ! » Ils se donnèrent courage pour cette bonne œuvre[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comment la main de mon Dieu avait été bonne envers moi » ou « comment mon Dieu avait agi avec bienveillance envers moi ». L’hébreu dit littéralement : « la main de mon Dieu était bonne sur moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Mettons-nous debout et construisons ! »'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils fortifièrent leurs mains pour le bien ». Le contexte désigne l’œuvre de reconstruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד לָהֶם
  choice: Je leur racontai alors
  rationale: Le waw narratif fait progresser le récit. « Alors » rend cet enchaînement, tandis que « racontai » convient au compte rendu de l’action de Dieu et des paroles du roi.
- source_word: יַד אֱלֹהַי אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: comment la bonne main de mon Dieu avait été sur moi
  rationale: La formulation conserve l’image hébraïque de la main divine, qui exprime l’action favorable de Dieu. L’adjectif « bonne » et la préposition « sur » maintiennent aussi les éléments concrets de l’expression source.
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: ainsi que les paroles que le roi m’avait adressées
  rationale: « Ainsi que » introduit naturellement le second élément rapporté. « Les paroles » préserve le substantif hébreu, et le plus-que-parfait situe ces paroles avant le récit de Néhémie.
- source_word: נָקוּם וּבָנִינוּ
  choice: Levons-nous et bâtissons !
  rationale: Ces formes à la première personne du pluriel expriment ici une exhortation et une résolution collectives. « Bâtissons » garde un registre digne et convient à la reconstruction de la muraille.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: Et ils affermirent leurs mains
  rationale: Cette traduction conserve la seconde image des mains et le lien rhétorique avec la main de Dieu au début du verset. « Affermirent » communique l’idée de rendre fort tout en restant intelligible dans un registre soutenu.
- source_word: לַטּוֹבָה
  choice: pour cette bonne œuvre
  rationale: L’hébreu dit littéralement « pour le bien ». Le contexte désigne la reconstruction proposée; « cette bonne œuvre » explicite légèrement ce référent sans modifier l’évaluation positive du texte.
theological_decisions:
- issue: 'L’expression de l’action divine : « la main de mon Dieu »'
  choice: Conserver la métaphore de la main de Dieu et son caractère favorable
  alternative: Dire seulement que Dieu avait favorisé Néhémie ou lui avait fait grâce
  rationale: La métaphore attribue la réussite de Néhémie à l’action personnelle de Dieu, sans préciser davantage la manière dont cette action s’exerce. La conserver évite de réduire ou de systématiser cette affirmation.
- issue: Le rapport entre l’action divine et la réponse humaine
  choice: 'Conserver les deux mentions des mains : la main de Dieu et les mains affermies des bâtisseurs'
  alternative: Paraphraser la seconde par « ils prirent courage »
  rationale: La répétition crée un écho littéraire entre l’action favorable de Dieu et la résolution humaine. La traduction la maintient sans transformer cet écho en affirmation doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et légèrement soutenu. Les expressions concrètes « main de mon Dieu » et « affermirent leurs mains » sont conservées afin de reproduire l’écho du texte hébreu; les notes éclairent ces tournures sémitiques sans les effacer du texte principal.
