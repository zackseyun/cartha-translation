  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: fr
  text: Lorsque Sanballat le Horonite et Tobiya, l’esclave ammonite,[a] apprirent cela, ils furent très mécontents[b] qu’un homme soit venu chercher le bien des Israélites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le serviteur ammonite ». Le mot hébreu peut désigner un esclave, un serviteur ou un subordonné.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce fut pour eux un grand mal »; l’hébreu répète la famille du mot « mal » pour souligner l’intensité de leur réaction.'
    reason: source_idiom
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprirent cela
  rationale: Le verbe signifie « entendre/apprendre ». « Cela » est naturellement explicité en français d’après le contexte immédiat, qui rapporte l’arrivée et la mission de Néhémie.
- source_word: הַחֹרֹנִי
  choice: le Horonite
  rationale: Ce gentilé désigne Sanballat d’après son origine; la forme traditionnelle « Horonite » conserve cette désignation sans préciser un lieu que le texte ne nomme pas ici.
- source_word: הָעֶבֶד הָעַמֹּנִי
  choice: le serviteur ammonite
  rationale: עֶבֶד peut désigner un esclave, un serviteur ou un subordonné. Dans cette désignation sociale de Tobiya, « serviteur » demeure naturel sans imposer avec certitude un statut juridique d’esclave; une note conserve l’autre possibilité.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: ils furent profondément contrariés
  rationale: La formulation rend idiomatiquement leur très vive réaction négative. La répétition hébraïque de la famille de רע est signalée en note.
- source_word: אָדָם
  choice: un homme
  rationale: Le nom singulier renvoie ici à Néhémie et la formulation masculine de la source est conservée.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: rechercher le bien
  rationale: Cette expression préserve le champ lexical de טוֹב, « bon/bien », tout en exprimant l’action menée en faveur d’Israël.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: des Israélites
  rationale: Équivalent français naturel de « fils d’Israël » lorsqu’il désigne collectivement le peuple.
theological_decisions:
- issue: Sens de עֶבֶד dans la désignation de Tobiya
  choice: serviteur
  alternative: esclave
  rationale: Le terme hébreu couvre plusieurs formes de dépendance ou de service, et le contexte immédiat ne suffit pas à déterminer précisément le statut de Tobiya. Le texte principal choisit le terme français le moins surdéterminé et la note maintient l’ambiguïté.
- issue: Rendu de אָדָם
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le référent individuel est Néhémie; « un homme » reproduit sans neutralisation inutile la forme masculine du texte.
- issue: Nature du « bien » recherché pour Israël
  choice: rechercher le bien des Israélites
  alternative: veiller au bien-être des Israélites
  rationale: « Le bien » conserve l’expression ouverte du texte, qui peut englober bien-être, avantage et prospérité, sans la réduire à une seule dimension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure hébraïque tout en évitant un calque peu naturel; les gentilés traditionnels sont conservés et les ambiguïtés lexicales importantes sont documentées en notes.
