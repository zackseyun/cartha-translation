base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: fr
  text: 'Alors je leur dis : « Vous voyez la détresse dans laquelle nous sommes : Jérusalem est en ruine et ses portes ont été brûlées par le feu. Venez, reconstruisons la muraille de Jérusalem, afin que nous ne soyons plus un objet de honte.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet de mépris » ou « un sujet d’opprobre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: la détresse dans laquelle nous sommes
  rationale: Dans ce contexte, רָעָה désigne la situation calamiteuse de la communauté plutôt qu’un mal moral. « Détresse » exprime naturellement cette adversité, tandis que la tournure « dans laquelle nous sommes » conserve l’image hébraïque.
- source_word: חֲרֵבָה
  choice: est en ruine
  rationale: L’adjectif décrit Jérusalem comme dévastée. Le singulier idiomatique « en ruine » convient en français moderne et garde la portée matérielle de l’expression.
- source_word: נִצְּתוּ בָאֵשׁ
  choice: ont été ravagées par le feu
  rationale: Cette formulation conserve le passif et la mention explicite du feu, tout en évitant la tournure française lourde « brûlées par le feu ».
- source_word: לְכוּ וְנִבְנֶה
  choice: Venez, reconstruisons
  rationale: לְכוּ introduit ici une exhortation collective, et le cohortatif inclut Néhémie avec ses interlocuteurs. « Reconstruisons » rend explicite la restauration d’une muraille auparavant existante.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: la muraille de Jérusalem
  rationale: « Muraille » désigne précisément l’enceinte fortifiée d’une ville et restitue naturellement le construit hébreu.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: afin que nous ne soyons plus un objet de honte
  rationale: חֶרְפָּה évoque une honte publique et le mépris qui l’accompagne. « Objet de honte » préserve la dimension communautaire sans imposer une interprétation confessionnelle.
