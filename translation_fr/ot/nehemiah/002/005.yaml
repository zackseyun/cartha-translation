base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: fr
  text: 'Je dis alors au roi : « Si le roi le juge bon, et si ton serviteur a trouvé grâce à tes yeux, que tu m’envoies en Juda, dans la ville des tombeaux de mes ancêtres[a], afin que je la rebâtisse[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la ville des tombeaux de mes pères ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu signifie « bâtir » ; « rebâtir » tient compte du fait que la ville est en ruines.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Je dis alors
  rationale: Le waw consécutif fait progresser le récit ; « alors » en exprime naturellement la succession en français.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Si le roi le juge bon
  rationale: Cette formule de cour sollicite avec déférence l’approbation royale, sans recourir à une tournure française archaïque.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: et si ton serviteur a trouvé grâce à tes yeux
  rationale: La formulation conserve l’image hébraïque du regard favorable tout en restant claire et digne en français.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans une adresse au roi, le terme constitue une autodésignation conventionnelle marquant l’humilité et le service ; « esclave » serait ici trompeur.
- source_word: תִּשְׁלָחֵנִי
  choice: envoie-moi
  rationale: L’impératif français inséré dans la proposition conditionnelle rend naturellement la requête exprimée en hébreu.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et standard du nom géographique.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: dans la ville où se trouvent les tombeaux de mes ancêtres
  rationale: Cette formulation naturelle explicite la relation du syntagme hébreu, littéralement « la ville des tombeaux de mes pères » ; « ancêtres » évite de limiter אבות aux pères immédiats.
- source_word: וְאֶבְנֶנָּה
  choice: afin que je la rebâtisse
  rationale: Le cohortatif exprime le but de la demande ; le suffixe féminin renvoie à la ville. « Rebâtir » rend le contexte d’une ville en ruines, bien que le verbe de base signifie « bâtir ».
