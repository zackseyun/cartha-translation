  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: fr
  text: 'Le roi me demanda : « Que désires-tu donc ? » Alors je priai le Dieu du ciel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מַה זֶּה
  choice: Que… donc ?
  rationale: Cette tournure interrogative demande ce que Néhémie souhaite; « donc » rend naturellement la nuance insistante de זֶּה en français sans alourdir la question.
- source_word: מְבַקֵּשׁ
  choice: désires-tu
  rationale: Le participe de בקש peut exprimer ce que quelqu’un cherche, demande ou souhaite. Dans l’échange avec le roi, « désires-tu » reste naturel tout en évitant de préciser indûment la forme de la requête.
- source_word: וָאֶתְפַּלֵּל
  choice: Alors je priai
  rationale: Le verbe התפלל signifie « prier ». Le passé simple convient au registre narratif digne et rend la succession immédiate des actions.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: le Dieu du ciel
  rationale: Traduction directe du titre hébreu, conservant sa formulation théologique sans expansion interprétative.
theological_decisions:
- issue: Nature et durée de la prière de Néhémie
  choice: « Alors je priai » sans autre précision
  alternative: « Alors j’adressai rapidement une prière »
  rationale: Le texte indique que Néhémie prie entre la question du roi et sa réponse, mais ne qualifie ni la durée ni la forme de cette prière; la traduction préserve cette réserve.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient une narration biblique soutenue sans archaïsme lexical; les guillemets français signalent directement la parole royale.
