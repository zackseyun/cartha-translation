  to: Je sortis alors, de nuit, par la porte de la Vallée, en direction de la source du Dragon[a] et de la porte du Fumier, et j’examinais[b] les murailles de Jérusalem, qui présentaient des brèches, ainsi que ses portes, que le feu consumait.
  rationale: La révision conserve l’interprétation contextuelle « j’examinais », attestée par le sens général du passage et retenue dans l’audit anglais, tout en corrigeant la note pour exposer honnêtement la difficulté du texte hébreu. Elle rend les dégâts comme un état contemporain de l’inspection et améliore légèrement la fluidité narrative sans modifier le sens.
