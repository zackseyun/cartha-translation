base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: fr
  text: Je sortis alors, de nuit, par la porte de la Vallée, en direction de la source du Dragon[a] et de la porte du Fumier, et j’examinais[b] les murailles de Jérusalem, qui présentaient des brèches, ainsi que ses portes, que le feu consumait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « source du Serpent » ou « source du Chacal ». Le nom hébreu emploie tannîn, terme pouvant désigner un dragon, un serpent ou une créature semblable.
    reason: lexical_alternative
  - marker: b
    text: 'La construction hébraïque est difficile : le verbe signifie habituellement « briser ». Dans ce contexte, elle est comprise comme décrivant l’inspection des murailles endommagées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: Je sortis donc
  rationale: Le wayyiqtol de יצא fait progresser le récit. « Donc » marque naturellement l’enchaînement, et le passé simple convient au registre narratif français.
- source_word: בְשַׁעַר הַגַּיְא
  choice: par la porte de la Vallée
  rationale: Dans ce contexte de déplacement, ב indique le passage par la porte; גיא désigne une vallée ou un ravin.
- source_word: לַיְלָה
  choice: de nuit
  rationale: L’accusatif adverbial exprime le moment de l’action; « de nuit » est concis et naturel.
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: en direction de la source du Dragon
  rationale: עין désigne ici une source. אל־פני indique l’orientation de l’itinéraire, tandis que תנין conserve dans ce nom de lieu son image de dragon ou de grand reptile sans la préciser davantage.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: la porte du Fumier
  rationale: אשפת désigne le fumier ou les détritus. « Porte du Fumier » est une désignation traditionnelle, intelligible et appropriée à un nom de lieu.
- source_word: וָאֱהִי שֹׂבֵר
  choice: et j’examinais
  rationale: La construction avec היה et un participe présente une action en cours. Bien que שבר signifie normalement « briser », le contexte de l’inspection nocturne des fortifications soutient ici le sens d’examiner; l’imparfait en conserve l’aspect duratif.
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ
  choice: les murailles de Jérusalem
  rationale: « Murailles » exprime clairement qu’il s’agit des fortifications urbaines.
- source_word: אֲשֶׁר הַמְפֹרָצִים
  choice: qui avaient été éventrées
  rationale: Le participe passif de פרץ décrit des murailles ouvertes par des brèches. « Éventrées » rend cette destruction de façon concrète et naturelle.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: ses portes, que le feu avait consumées
  rationale: Le passif de אכל avec le feu exprime l’idée d’être dévoré ou consumé; cette formulation préserve l’image tout en restant idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple fait avancer le récit, tandis que l’imparfait de « j’examinais » rend l’action en cours. Les noms topographiques restent transparents et les ambiguïtés lexicales réelles sont signalées en notes.
