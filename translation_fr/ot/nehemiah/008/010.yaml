  text: וַ/יֹּ֣אמֶר לָ/הֶ֡ם לְכוּ֩ אִכְל֨וּ מַשְׁמַנִּ֜ים וּ/שְׁת֣וּ מַֽמְתַקִּ֗ים וְ/שִׁלְח֤וּ מָנוֹת֙ לְ/אֵ֣ין נָכ֣וֹן ל֔/וֹ כִּֽי קָד֥וֹשׁ הַ/יּ֖וֹם לַ/אֲדֹנֵ֑י/נוּ וְ/אַל תֵּ֣עָצֵ֔בוּ כִּֽי חֶדְוַ֥ת יְהוָ֖ה הִ֥יא מָֽעֻזְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: fr
  text: 'Puis il leur dit : « Allez manger des mets riches et boire des boissons sucrées. Envoyez aussi des portions à ceux pour qui rien n’est préparé[a], car ce jour est saint pour notre Seigneur. Ne vous attristez pas, car la joie de Yahweh[b] est votre forteresse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à celui pour qui rien n’est préparé ».'
    reason: La note conserve le singulier indéfini et la tournure exacte de l’hébreu.
  - marker: b
    text: 'On peut aussi comprendre : « la joie en Yahweh » ou « la joie que donne Yahweh ».'
    reason: La relation exprimée par la construction « la joie de Yahweh » est authentiquement ambiguë en hébreu.
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: des mets riches
  rationale: Le terme désigne littéralement des choses grasses ou riches et, dans ce contexte de fête, des mets riches. Cette formulation garde la dimension festive sans produire un calque maladroit.
- source_word: מַמְתַקִּים
  choice: des boissons sucrées
  rationale: Le mot désigne des choses douces ou sucrées ; avec le verbe « boire », il s’agit naturellement de boissons sucrées, sans qu’il faille préciser qu’il s’agit de vin.
- source_word: מָנוֹת
  choice: des portions
  rationale: Dans le cadre d’un repas de fête, le mot renvoie à des parts de nourriture distribuées à d’autres.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: à ceux qui n’ont rien de préparé
  rationale: Cette formulation française naturelle exprime l’absence de provisions préparées. Le pluriel générique rend l’indéfini hébreu sans limiter la consigne à un seul homme.
- source_word: קָדוֹשׁ
  choice: saint
  rationale: « Saint » est le terme usuel pour un jour consacré à Dieu et conserve la portée religieuse de l’hébreu.
- source_word: לַאֲדֹנֵינוּ
  choice: pour notre Seigneur
  rationale: אדון est ici un titre divin. « Notre Seigneur » convient au registre révérenciel et se distingue du nom divin Yahweh employé plus loin.
- source_word: תֵּעָצֵבוּ
  choice: ne soyez pas dans la tristesse
  rationale: Le verbe évoque la peine et l’affliction. Cette expression actuelle s’accorde au contexte où le peuple pleure après avoir entendu la Loi.
- source_word: חֶדְוַת יְהוָה
  choice: la joie de Yahweh
  rationale: La construction hébraïque est conservée afin de ne pas décider si elle désigne la joie qui vient de Yahweh, celle qu’il éprouve, ou la joie placée en lui.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le distinguer du titre אֲדֹנֵינוּ, « notre Seigneur », présent dans le même verset.
- source_word: מָעֻזְּכֶם
  choice: votre forteresse
  rationale: Le nom désigne un lieu fort, un refuge ou une source de puissance. « Forteresse » conserve la métaphore concrète, contrairement au rendu plus abstrait « force ».
theological_decisions:
- issue: Sens de חֶדְוַת יְהוָה
  choice: la joie de Yahweh
  alternative: la joie en Yahweh
  rationale: Le génitif hébreu demeure ouvert à plusieurs relations sémantiques. Le texte principal reproduit cette tension, tandis que la note signale une interprétation courante sans l’imposer.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend le nom personnel présent dans le texte et permet de préserver la différence entre יְהוָה et le titre אֲדֹנֵינוּ dans ce même verset.
- issue: Image de מָעוֹז
  choice: votre forteresse
  alternative: votre force
  rationale: Le choix principal garde l’image spatiale d’un lieu protecteur, tout en laissant ouverte l’idée dérivée d’une source de force.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs sont directs, comme en hébreu. « Mets riches » et « boissons sucrées » évoquent clairement un repas de fête ; « forteresse » maintient l’image concrète du texte source.
