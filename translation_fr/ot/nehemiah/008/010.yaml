    rationale: La formulation principale « ceux qui n’ont rien de préparé » peut déplacer l’accent vers ce qu’ils n’ont pas préparé eux-mêmes. « Ceux pour qui rien n’est préparé » reflète plus étroitement la tournure hébraïque sans perdre le naturel français.
  - severity: low
    issue: Formulation de l’interdiction de s’attrister
    rationale: « Ne soyez pas dans la tristesse » est compréhensible, mais « Ne vous attristez pas » est plus naturel en français contemporain et rend directement le verbe hébreu.
