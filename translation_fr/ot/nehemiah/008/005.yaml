id: NEH.8.5
reference: Nehemiah 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח עֶזְרָ֤א הַ/סֵּ֨פֶר֙ לְ/עֵינֵ֣י כָל הָ/עָ֔ם כִּֽי מֵ/עַ֥ל כָּל הָ/עָ֖ם הָיָ֑ה וּ/כְ/פִתְח֖/וֹ עָֽמְד֥וּ כָל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: fr
  text: Esdras ouvrit le livre sous les yeux de tout le peuple[a], car il se tenait plus haut que tout le peuple. Lorsqu’il l’ouvrit, tout le peuple se leva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rouleau ». Le mot hébreu סֵפֶר peut désigner un document écrit ayant la forme d’un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: ouvrit
  rationale: Le verbe פתח signifie « ouvrir ». Même si le support était probablement un rouleau, le texte emploie le verbe ordinaire « ouvrir » plutôt qu’un terme signifiant explicitement « dérouler ».
- source_word: הַסֵּפֶר
  choice: le livre
  rationale: סֵפֶר désigne un écrit, un livre ou un rouleau. « Le livre » est naturel en français et conserve la désignation générale du texte hébreu; la forme matérielle possible est signalée en note.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: L’expression signifie littéralement « aux yeux de ». « Sous les yeux de » restitue clairement le caractère visible et public de l’action.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: עָם désigne ici la population rassemblée. La répétition de « tout le peuple » reproduit l’insistance du texte hébreu.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: car il se tenait plus haut que tout le peuple
  rationale: מֵעַל exprime ici une position physique élevée, comme l’indique le contexte. « Se tenait plus haut » évite de suggérer une supériorité sociale tout en expliquant pourquoi tous pouvaient le voir.
- source_word: וּכְפִתְחוֹ
  choice: Lorsqu’il l’ouvrit
  rationale: La préposition כְּ introduit ici une circonstance temporelle, « quand/lorsque ». Le pronom « l’ » reprend naturellement « le livre ».
- source_word: עָמְדוּ
  choice: se leva
  rationale: עמד peut signifier « se tenir debout » ou, selon le contexte, « se lever ». Après l’ouverture du livre, le français « se leva » exprime naturellement le passage du peuple à la station debout, sans développer davantage le geste.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en clarifiant que la hauteur d’Esdras est physique. « Se leva » est retenu comme formulation française naturelle pour la réaction collective.
