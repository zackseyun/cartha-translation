  text: וַ֠/יִּקְרָא בְּ/סֵ֨פֶר תּוֹרַ֤ת הָ/אֱלֹהִים֙ י֣וֹם בְּ/י֔וֹם מִן הַ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן עַ֖ד הַ/יּ֣וֹם הָ/אַחֲר֑וֹן וַ/יַּֽעֲשׂוּ חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּ/בַ/יּ֧וֹם הַ/שְּׁמִינִ֛י עֲצֶ֖רֶת כַּ/מִּשְׁפָּֽט׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: fr
  text: Il lut dans le livre de la loi de Dieu, jour après jour[a], depuis le premier jour jusqu’au dernier. Ils célébrèrent la fête pendant sept jours[b] et, le huitième jour, il y eut une assemblée solennelle, conformément à ce qui était prescrit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chaque jour». Le texte souligne que la lecture avait lieu quotidiennement.
    reason: lexical_alternative
  - marker: b
    text: Ou «Ils observèrent la fête pendant sept jours».
    reason: lexical_alternative
  - marker: c
    text: Littéralement «selon la règle» ou «selon l’ordonnance».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Il lut
  rationale: Le verbe קרא suivi de בְּסֵפֶר désigne ici la lecture, vraisemblablement publique. Le singulier hébreu est conservé; le contexte identifie implicitement le lecteur à Esdras.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: dans le livre de la loi de Dieu
  rationale: En français, «lire dans le livre» rend naturellement la construction avec בְּ sans imposer le support matériel; סֵפֶר peut aussi désigner un rouleau.
- source_word: יוֹם בְּיוֹם
  choice: jour après jour
  rationale: Cette expression idiomatique traduit l’action répétée quotidiennement tout en conservant le rythme de l’hébreu.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: depuis le premier jour jusqu’au dernier
  rationale: La formulation restitue directement toute la durée inclusive indiquée par l’hébreu.
- source_word: וַיַּעֲשׂוּ חָג
  choice: Ils célébrèrent la fête
  rationale: עשה avec חג signifie observer ou célébrer une fête. «Célébrèrent» est naturel en français moderne et garde le caractère festif et cultuel.
- source_word: עֲצֶרֶת
  choice: une assemblée solennelle
  rationale: Le terme désigne un rassemblement sacré particulier qui clôt la fête. Cette traduction conserve sa portée cultuelle sans la réduire à une réunion ordinaire.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à ce qui était prescrit
  rationale: מִשְׁפָּט désigne ici la règle normative fixant l’observance; cette formulation française exprime clairement le caractère prescrit.
theological_decisions:
- issue: Sujet singulier de la lecture et sujet pluriel de la célébration
  choice: Conserver «Il lut» puis «Ils célébrèrent»
  alternative: Employer un pluriel ou une tournure impersonnelle pour la lecture
  rationale: Les formes hébraïques distinguent le lecteur singulier de la communauté qui célèbre. Maintenir cette distinction respecte les rôles narratifs sans expliciter dans le verset le nom d’Esdras.
- issue: Portée cultuelle de עֲצֶרֶת
  choice: «une assemblée solennelle»
  alternative: «une assemblée» ou «une assemblée de clôture»
  rationale: Le choix retenu exprime le caractère sacré et prescrit du rassemblement final, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative reste proche de l’hébreu, tandis que «conformément à ce qui était prescrit» évite le tour plus administratif «selon l’ordonnance». Tous les marqueurs de notes figurent dans le texte dans l’ordre alphabétique.
