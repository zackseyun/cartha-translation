base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: fr
  text: Le peuple sortit donc, apporta les branchages[a] et se fit des huttes, chacun sur son toit, ainsi que dans leurs cours, dans les cours de la maison de Dieu, sur la place de la porte des Eaux[b] et sur la place de la porte d’Éphraïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les apporta »; il s’agit des branchages mentionnés au verset précédent.'
    reason: referent_clarification
  - marker: b
    text: 'Le mot hébreu désigne un espace public ouvert, ou une esplanade, près d’une porte; traduction traditionnelle : « large place ».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: Le peuple sortit donc
  rationale: Le singulier collectif « le peuple » est naturel en français et appelle ici un verbe au singulier. « Donc » marque la conséquence de l’instruction donnée au verset précédent.
- source_word: וַיָּבִיאוּ
  choice: rapporta les branchages
  rationale: Le hiphil de בוא signifie « apporter ». L’objet, non exprimé dans ce verset, est repris du verset précédent; « les branchages » rend ce référent explicite sans ajouter une nouvelle action.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: se fit des huttes
  rationale: La tournure pronominale rend naturellement לָהֶם en français. « Huttes » désigne des abris temporaires et conserve le lien lexical avec la fête des Huttes.
- source_word: אִישׁ עַל גַּגּוֹ
  choice: chacun sur son toit
  rationale: אִישׁ a ici une valeur distributive. Le singulier « chacun… son » préserve l’individualisation du texte hébreu.
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: ainsi que dans leurs cours
  rationale: חָצֵר désigne un espace clos attenant à une habitation. « Cours » est précis et idiomatique; « ainsi que » relie clairement ce lieu à ceux où les huttes furent dressées.
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: dans les cours de la maison de Dieu
  rationale: La formulation reste proche de l’hébreu et désigne les espaces du complexe du temple sans remplacer l’expression source par une interprétation.
- source_word: וּבִרְחוֹב
  choice: sur la place
  rationale: רְחוֹב désigne ici un espace public ouvert près d’une porte. En français, on construit naturellement « sur la place ».
- source_word: שַׁעַר הַמַּיִם
  choice: la porte des Eaux
  rationale: Cette forme française claire traite l’expression comme le nom propre d’une porte de la ville.
- source_word: שַׁעַר אֶפְרָיִם
  choice: la porte d’Éphraïm
  rationale: La construction avec « de » reflète directement le groupe nominal hébreu tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. Le passé simple convient au registre narratif biblique. Les noms des portes prennent une majuscule à leur élément distinctif. La coordination a été légèrement allégée afin d’éviter une succession pesante de « et » tout en conservant tous les emplacements énumérés.
