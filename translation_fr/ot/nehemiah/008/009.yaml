base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: fr
  text: 'Alors Néhémie, le gouverneur[a], Esdras, le prêtre et le scribe, et les lévites qui instruisaient le peuple dirent à tout le peuple : « Ce jour est saint pour Yahvé votre Dieu. Ne vous lamentez pas et ne pleurez pas. » En effet, tout le peuple pleurait en entendant les paroles de la Loi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Tirshata », titre administratif perse.
    reason: lexical_alternative
  - marker: b
    text: Ou « les paroles de la Torah ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: le gouverneur
  rationale: Ce titre administratif d’époque perse désigne ici la fonction exercée par Néhémie. « Gouverneur » en communique clairement le sens, tandis qu’une note conserve la translittération possible.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: le prêtre et scribe
  rationale: Les deux noms présentent les fonctions d’Esdras. Cette formulation française naturelle conserve les deux titres sans les fusionner.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: les lévites qui instruisaient le peuple
  rationale: Le participe causatif de בין exprime ici l’action de faire comprendre ou de donner l’intelligence du texte. « Instruisaient » rend naturellement cette fonction pédagogique.
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: Ce jour est saint
  rationale: La formulation garde la prédication directe de l’hébreu et le sens religieux de קָדוֹשׁ.
- source_word: תִּתְאַבְּלוּ
  choice: soyez dans le deuil
  rationale: Le verbe désigne le fait de mener deuil, souvent manifesté extérieurement. Cette expression le distingue clairement de l’action de pleurer mentionnée ensuite.
- source_word: תִּבְכּוּ / בוֹכִים
  choice: pleurez / pleurait
  rationale: « Pleurer » convient au registre solennel de la scène et reproduit la répétition lexicale de l’hébreu.
- source_word: כְּשָׁמְעָם
  choice: en entendant
  rationale: Le gérondif exprime naturellement en français la simultanéité entre l’écoute et les pleurs.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: les paroles de la Loi
  rationale: Dans le contexte de la lecture publique du texte de l’alliance, « la Loi » est clair et établi en français. Une note signale « Torah », qui conserve plus directement le terme hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur ; YHWH
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » restitue en français moderne le nom personnel divin plutôt que de le remplacer par un titre, tout en suivant la décision de l’édition anglaise de rendre le nom de l’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque tout en évitant les tournures artificielles. « Esdras, le prêtre et scribe » indique naturellement que les deux titres se rapportent à Esdras.
