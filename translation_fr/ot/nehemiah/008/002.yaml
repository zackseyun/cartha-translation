    text: 'Ou : « tous ceux qui pouvaient comprendre ce qu’ils entendaient ». L’expression peut désigner tous ceux qui étaient en mesure de saisir la lecture.'
    reason: lexical_alternative
  revision_rationale: La révision remplace la construction « composée des hommes comme des femmes et de tous ceux » par une apposition française naturelle qui conserve les deux expressions coordonnées de l’hébreu. Le complément de date est rattaché à « apporta », comme dans le texte source. Les notes et leurs ancres sont maintenues.
