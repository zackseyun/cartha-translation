  text: וַ/יָּבִ֣יא עֶזְרָ֣א הַ֠/כֹּהֵן אֶֽת הַ/תּוֹרָ֞ה לִ/פְנֵ֤י הַ/קָּהָל֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה וְ/כֹ֖ל מֵבִ֣ין לִ/שְׁמֹ֑עַ בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: fr
  text: Alors le prêtre Esdras apporta la Loi devant l’assemblée, hommes et femmes[a], et tous ceux qui étaient capables de comprendre en écoutant[b], le premier jour du septième mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis l’homme jusqu’à la femme », expression qui indique ici toute l’étendue de l’assemblée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous ceux qui pouvaient comprendre ce qu’ils entendaient ». L’expression peut désigner tous ceux qui étaient en mesure de saisir la lecture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: Alors ... apporta
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette progression narrative en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le titre, en apposition à Esdras dans l’hébreu, est conservé explicitement.
- source_word: הַתּוֹרָה
  choice: la Loi
  rationale: Dans ce contexte de lecture publique, le terme désigne la Loi mosaïque. La majuscule aide à signaler ce référent déterminé sans recourir au mot moins transparent « Torah ».
- source_word: לִפְנֵי הַקָּהָל
  choice: devant l’assemblée
  rationale: Cette formulation naturelle conserve le cadre public et formel, sans les connotations ecclésiales que pourrait prendre « congrégation ».
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: composée des hommes comme des femmes
  rationale: La tournure restitue en français courant l’étendue inclusive exprimée littéralement par « depuis l’homme jusqu’à la femme », tout en maintenant les deux termes genrés du texte source.
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: et de tous ceux qui étaient capables de comprendre en écoutant
  rationale: La formulation préserve le lien explicite entre compréhension et écoute, sans réduire l’expression à la simple capacité physique d’entendre.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: C’était le premier jour du septième mois
  rationale: Cette formulation idiomatique rend la date hébraïque avec clarté. Une nouvelle phrase évite une longue accumulation syntaxique en français.
theological_decisions:
- issue: Description genrée de l’auditoire
  choice: les hommes comme les femmes
  alternative: depuis l’homme jusqu’à la femme
  rationale: L’hébreu emploie deux noms singuliers genrés pour exprimer toute l’étendue de l’assemblée. Le texte principal en donne le sens inclusif dans un français naturel, tandis que la note conserve la forme littérale.
- issue: Traduction de תּוֹרָה
  choice: la Loi
  alternative: la Torah / l’instruction
  rationale: « La Loi » convient à la lecture publique du corpus mosaïque et reste immédiatement compréhensible. « Instruction » serait possible lexicalement mais trop général ici; « Torah » serait plus formellement proche mais moins transparent pour certains lecteurs.
- issue: Capacité de l’auditoire à comprendre
  choice: capables de comprendre en écoutant
  alternative: en âge de comprendre / capables de comprendre ce qu’ils entendaient
  rationale: Le texte source relie étroitement la compréhension à l’écoute sans préciser explicitement s’il s’agit surtout de l’âge ou d’une autre capacité. La traduction maintient cette relative ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée en deux phrases pour éviter une accumulation lourde, sans modifier les relations du texte hébreu. Les marqueurs [a] et [b] figurent tous deux dans le corps du verset.
