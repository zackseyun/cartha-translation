id: NEH.8.6
reference: Nehemiah 8:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: fr
  text: 'Esdras bénit Yahvé, le grand Dieu, et tout le peuple répondit, en levant les mains : « Amen ! Amen ! »[a] Puis ils s’inclinèrent et se prosternèrent devant Yahvé, le visage contre terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Amen » est une réponse liturgique exprimant l’adhésion : « Qu’il en soit ainsi ! » Sa répétition renforce ici l’assentiment du peuple.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Avec Dieu comme objet, le piel de ברך exprime une bénédiction adressée à Dieu, proche de la louange. « Bénit » conserve l’idiome biblique et la forme lexicale sans réduire le sens à « loua ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du tétragramme, qui préserve ici le nom divin plutôt que de le remplacer par un titre.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: le grand Dieu
  rationale: Rend naturellement l’apposition hébraïque et maintient l’accent porté par « grand ».
- source_word: וַיַּעֲנוּ
  choice: répondit
  rationale: Le verbe ענה introduit la réponse orale collective du peuple. Le singulier français s’accorde naturellement avec le collectif « tout le peuple ».
- source_word: אָמֵן אָמֵן
  choice: Amen ! Amen !
  rationale: La translittération conserve la réponse liturgique d’assentiment, et la répétition en maintient l’insistance.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: en levant les mains
  rationale: La tournure exprime naturellement en français l’action qui accompagne la réponse du peuple.
- source_word: וַיִּקְּדוּ
  choice: s’inclinèrent
  rationale: קדד désigne le fait de se courber ou de s’incliner. Ce choix garde cette action distincte de la prosternation exprimée ensuite.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prosternèrent devant
  rationale: Le verbe décrit une prosternation accomplie en hommage ou en adoration. « Devant Yahvé » restitue naturellement la construction avec ל et la dimension cultuelle sans effacer le geste corporel.
- source_word: אַפַּיִם אָרְצָה
  choice: le visage contre terre
  rationale: Équivalent idiomatique clair de l’expression littérale « faces/narines vers la terre », qui décrit une prosternation complète.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahvé » est sa forme française traditionnelle et transparente, permettant de conserver le nom propre plutôt que de lui substituer un titre.
- issue: Rapport entre l’inclination et l’adoration
  choice: 'deux gestes successifs : « s’inclinèrent et se prosternèrent »'
  alternative: « s’inclinèrent et adorèrent »
  rationale: Les deux verbes hébreux sont maintenus distincts. La mention du visage contre terre favorise pour le second un rendu corporel, tandis que « devant Yahvé » en préserve la portée cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement narratif hébreu tout en évitant les calques lourds. Les exclamations rendent l’acclamation collective sans ajouter de contenu.
