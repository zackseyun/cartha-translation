id: NEH.8.11
reference: Nehemiah 8:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם מַחְשִׁ֤ים לְ/כָל הָ/עָם֙ לֵ/אמֹ֣ר הַ֔סּוּ כִּ֥י הַ/יּ֖וֹם קָדֹ֑שׁ וְ/אַל תֵּעָצֵֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: fr
  text: 'Les Lévites faisaient taire tout le peuple[a] en disant : « Faites silence, car ce jour est saint ; ne vous attristez pas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « demandaient à tout le peuple de se tenir tranquille ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne soyez pas dans la peine » ou « ne soyez pas tristes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Les Lévites
  rationale: Désignation française habituelle du groupe chargé de fonctions liées au culte.
- source_word: מַחְשִׁים
  choice: faisaient taire
  rationale: 'Le participe exprime une action en cours : les Lévites s’employaient à obtenir le silence du peuple.'
- source_word: לְכָל הָעָם
  choice: tout le peuple
  rationale: Rend naturellement la totalité de la population rassemblée.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule introductive naturelle du discours direct en français.
- source_word: הַסּוּ
  choice: Faites silence
  rationale: L’impératif appelle collectivement les personnes présentes à cesser leurs manifestations bruyantes; cette formulation reste claire et digne.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: car ce jour est saint
  rationale: כִּי introduit le motif de l’ordre, tandis que l’article avec « jour » renvoie ici au jour présent, rendu naturellement par « ce jour ».
- source_word: וְאַל תֵּעָצֵבוּ
  choice: ne vous attristez pas
  rationale: Le verbe désigne le fait d’éprouver peine ou tristesse, sans imposer l’idée plus précise d’un deuil rituel.
theological_decisions:
- issue: Traduction de קָדֹשׁ à propos du jour de l’assemblée
  choice: saint
  alternative: sacré
  rationale: « Saint » conserve la portée biblique de la mise à part pour Dieu et le poids théologique du terme, sans en préciser davantage la nature.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait restitue la valeur durative du participe hébreu; le pluriel de politesse n’est pas en jeu, les impératifs s’adressant collectivement à tout le peuple.
