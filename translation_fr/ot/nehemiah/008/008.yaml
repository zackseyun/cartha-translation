  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: fr
  text: Ils lurent dans le livre, dans la loi de Dieu, clairement[a] ; ils en donnèrent le sens, de sorte que l’on comprit ce qui était lu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « distinctement ». Le terme hébreu peut désigner une lecture claire, une mise en évidence du texte par l’explication ou, peut-être, sa traduction pour les auditeurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Ils lisaient
  rationale: Avec un écrit pour complément, קרא désigne naturellement l’action de lire. L’imparfait français convient à la description suivie de la scène.
- source_word: בַסֵּפֶר
  choice: dans le livre
  rationale: La préposition ב peut ici marquer le texte dans lequel on lit. « Dans le livre » reste naturel en français et conserve la formulation hébraïque.
- source_word: בְּתוֹרַת הָאֱלֹהִים
  choice: dans la loi de Dieu
  rationale: Dans Esdras-Néhémie, תּוֹרָה renvoie ici concrètement au corpus de la loi lu publiquement. La répétition de « dans » reflète les deux prépositions et présente « la loi de Dieu » comme une précision de « le livre ».
- source_word: מְפֹרָשׁ
  choice: de façon claire
  rationale: Le terme issu de פרש évoque ce qui est rendu distinct ou explicite. Cette formulation préserve l’ambiguïté entre une lecture distincte, une explication et, éventuellement, une traduction.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: ils en donnaient le sens
  rationale: L’expression signifie littéralement « placer/donner l’intelligence ». « Donner le sens » exprime sobrement la fonction explicative sans préciser indûment sa méthode.
- source_word: וַיָּבִינוּ
  choice: de sorte que l’on comprenait
  rationale: Le verbe בין exprime ici naturellement le résultat de la lecture accompagnée d’explication. Le sujet demeure implicite dans l’hébreu ; le pronom indéfini français évite de l’identifier plus précisément que le texte.
- source_word: בַּמִּקְרָא
  choice: ce qui était lu
  rationale: מִקְרָא peut désigner la lecture publique ou son contenu. « Ce qui était lu » est idiomatique et rend clairement l’objet de la compréhension.
