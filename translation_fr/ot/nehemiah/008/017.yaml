  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: fr
  text: Toute l’assemblée de ceux qui étaient revenus de captivité construisit des cabanes et habita dans ces cabanes. En effet, depuis les jours de Yéchoua, fils de Noun[a], jusqu’à ce jour-là, les fils d’Israël n’avaient pas fait ainsi. Il y eut une très grande joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yéchoua, fils de Noun, c’est-à-dire Josué, fils de Noun.
    reason: La note identifie la forme du nom attestée dans ce verset avec sa forme française traditionnelle.
lexical_decisions:
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: Le terme désigne la communauté réunie. « Assemblée » conserve cette dimension collective sans connotation ecclésiastique trop marquée.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: ceux qui étaient revenus de captivité
  rationale: Cette formulation suit de près le participe et son complément, tout en restant naturelle en français.
- source_word: סֻכּוֹת
  choice: cabanes
  rationale: Le mot désigne les abris temporaires de la fête des Cabanes. « Cabanes » est clair en français moderne et évite la confusion possible de « tabernacles » avec le sanctuaire.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: habita dans ces cabanes
  rationale: Dans ce contexte rituel, יָשַׁב exprime le fait de séjourner ou d’habiter, et non simplement de s’asseoir.
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: En effet, … n’avaient pas fait ainsi
  rationale: 'Cette traduction conserve la formulation concise et l’ambiguïté du texte : elle renvoie à la manière de faire décrite, sans affirmer que la fête n’avait jamais été célébrée.'
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: depuis les jours de Yéchoua, fils de Noun
  rationale: « Yéchoua » représente la forme יֵשׁוּעַ effectivement attestée dans ce verset; une note donne le nom français traditionnel du même personnage.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression hébraïque masculine et sa portée traditionnelle de désignation collective du peuple.
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: Il y eut une très grande joie
  rationale: Cette expression rend directement l’intensité de גְּדוֹלָה מְאֹד dans un français naturel et digne.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: L’expression hébraïque est grammaticalement masculine et sert de désignation collective traditionnelle; le texte principal en conserve la forme sans la neutraliser.
- issue: Identité de יֵשׁוּעַ בִּן נוּן
  choice: Yéchoua, fils de Noun
  alternative: Josué, fils de Noun
  rationale: Le texte massorétique emploie ici la forme יֵשׁוּעַ plutôt que la forme longue יְהוֹשֻׁעַ. Le texte principal reflète cette donnée, tandis que la note fournit l’identification française familière.
- issue: Portée de l’affirmation « n’avaient pas fait ainsi »
  choice: conserver la référence anaphorique sans l’expliciter
  alternative: n’avaient pas célébré la fête de cette manière
  rationale: L’hébreu peut viser la manière de construire les cabanes et d’y habiter plutôt qu’une absence totale de célébration. La formulation retenue préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. Le récit emploie le passé simple pour les actions principales et le plus-que-parfait pour l’antériorité historique. La répétition de « cabanes » reproduit l’insistance du texte hébreu sans lourdeur excessive.
