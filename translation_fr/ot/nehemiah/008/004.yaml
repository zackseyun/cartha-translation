  text: וַֽ/יַּעֲמֹ֞ד עֶזְרָ֣א הַ/סֹּפֵ֗ר עַֽל מִגְדַּל עֵץ֮ אֲשֶׁ֣ר עָשׂ֣וּ לַ/דָּבָר֒ וַ/יַּֽעֲמֹ֣ד אֶצְל֡/וֹ מַתִּתְיָ֡ה וְ/שֶׁ֡מַע וַ֠/עֲנָיָה וְ/אוּרִיָּ֧ה וְ/חִלְקִיָּ֛ה וּ/מַעֲשֵׂיָ֖ה עַל יְמִינ֑/וֹ וּ/מִ/שְּׂמֹאל֗/וֹ פְּ֠דָיָה וּ/מִֽישָׁאֵ֧ל וּ/מַלְכִּיָּ֛ה וְ/חָשֻׁ֥ם וְ/חַשְׁבַּדָּ֖נָה זְכַרְיָ֥ה מְשֻׁלָּֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: fr
  text: Esdras, le scribe, se tint debout sur une estrade en bois qu’on avait construite pour l’occasion[a]. À côté de lui se tenaient Mattitia, Shéma, Anaya, Urie, Hilqiya et Maaséya, à sa droite, et Pedaya, Mishaël, Malkiya, Hashoum, Hashbaddana, Zacharie et Meshoullam, à sa gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une tour de bois ». On peut aussi comprendre : « pour cette affaire » ou « à cet effet ».'
    reason: La note préserve l’image littérale de מִגְדַּל עֵץ et l’étendue sémantique de לַדָּבָר, rendue dans le texte par « pour l’occasion ».
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: une estrade en bois
  rationale: Littéralement « une tour de bois ». Dans le contexte d’une lecture publique, l’expression désigne une structure surélevée où Esdras se tient; « estrade en bois » en exprime naturellement la fonction en français.
- source_word: לַדָּבָר
  choice: pour l’occasion
  rationale: דָּבָר peut désigner une parole, une chose, une affaire ou un événement. Ici, l’expression renvoie à l’occasion précise pour laquelle l’estrade avait été construite, sans indiquer explicitement la nature exacte de sa fonction.
- source_word: אֶצְלוֹ
  choice: À côté de lui
  rationale: La préposition exprime la proximité et introduit les hommes placés de part et d’autre d’Esdras.
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: à sa droite / à sa gauche
  rationale: Ces formulations françaises naturelles conservent exactement l’organisation spatiale du texte hébreu.
- source_word: הַסֹּפֵר
  choice: le scribe
  rationale: « Scribe » est le terme français établi pour celui qui maîtrise et transmet les textes, notamment la Loi.
- source_word: וַיַּעֲמֹד
  choice: se tenait / se tenaient
  rationale: Dans cette scène descriptive, « se tenir » rend naturellement la posture d’Esdras et des hommes placés à ses côtés, tout en préservant la répétition du verbe hébreu.
