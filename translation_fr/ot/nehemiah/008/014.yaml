source:
  edition: WLC
  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: fr
  text: Ils trouvèrent écrit dans la Loi que Yahweh avait ordonné, par l’intermédiaire de Moïse, aux fils d’Israël[a] d’habiter dans des cabanes pendant la fête, au septième mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ; littéralement « les fils d’Israël ».
    reason: Précise à la fois la forme littérale de l’hébreu et sa portée collective.
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: Ils trouvèrent écrit
  rationale: Cette formulation conserve la construction hébraïque tout en restant claire et digne en français.
- source_word: בַּתּוֹרָה
  choice: dans la Loi
  rationale: Dans ce contexte, le terme désigne l’instruction écrite transmise par Moïse; « la Loi » est l’expression française courante et appropriée.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: L’expression hébraïque indique que Moïse est l’agent ou le médiateur par lequel le commandement a été donné.
- source_word: יֵשְׁבוּ
  choice: d’habiter
  rationale: Dans le cadre de cette fête, le verbe indique un séjour dans des abris temporaires; « habiter » préserve ce sens sans archaïsme.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: La traduction rend directement l’expression hébraïque, tout en signalant en note sa portée collective possible.
- source_word: בַּסֻּכּוֹת
  choice: dans des cabanes
  rationale: « Cabanes » désigne naturellement en français les abris temporaires et végétaux associés à cette fête.
- source_word: בֶּחָג
  choice: pendant la fête
  rationale: Le syntagme renvoie à la fête connue dans le contexte et exprime la durée du séjour prescrit.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: au septième mois
  rationale: Cette expression temporelle traduit directement l’hébreu dans un français naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal conserve la forme de l’hébreu, tandis que la note indique la lecture collective naturelle sans limiter indûment le commandement aux seuls hommes.
translation_notes:
  register: Français international moderne, soutenu sans être archaïque. La phrase a été légèrement restructurée avec « ordonner à… de… » afin d’éviter un subjonctif imparfait artificiel, tout en conservant le contenu et les rapports syntaxiques essentiels de l’hébreu.
