  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: fr
  text: Tout le peuple se rassembla comme un seul homme sur la place située devant la porte des Eaux[a]. Ils dirent à Esdras, le scribe, d’apporter le livre de la loi de Moïse que Yahweh avait prescrite à Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « comme un seul homme » signifie « tous ensemble, d’un commun accord ».
    reason: La note explicite la valeur idiomatique de l’expression tout en maintenant son image dans le texte principal.
lexical_decisions:
- source_word: וַיֵּאָסְפוּ כָל הָעָם
  choice: Tout le peuple se rassembla
  rationale: Le niphal de אסף exprime ici le rassemblement de toute la communauté. Le singulier collectif est naturel en français et correspond à הָעָם.
- source_word: כְּאִישׁ אֶחָד
  choice: comme un seul homme
  rationale: Cette expression française établie conserve l’image masculine singulière de l’idiome hébreu et souligne l’unité d’action.
- source_word: אֶל הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמָּיִם
  choice: sur la place située devant la porte des Eaux
  rationale: רְחוֹב désigne ici un espace public ouvert. « Sur la place » est idiomatique en français, et « située » explicite sans surinterprétation la relative locative.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא הַסֹּפֵר לְהָבִיא
  choice: Ils dirent à Esdras, le scribe, d’apporter
  rationale: La construction française « dire à quelqu’un de » reproduit naturellement אמר suivi d’un infinitif, sans ajouter la nuance de demande qu’introduirait « demander ».
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: le livre de la loi de Moïse
  rationale: סֵפֶר peut désigner un livre ou un rouleau. « Livre » reste exact, courant et conventionnel, tandis que « loi de Moïse » respecte le rapport construit sans préciser davantage la nature du lien.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  choice: que Yahweh avait prescrite à Israël
  rationale: L’accord féminin rattache naturellement le relatif à « la loi », contenu que Yahweh a imposé à Israël. « Prescrire à » rend la construction de צוה avec son destinataire sans l’inélégance de « commander Israël » ni l’ajout de « pour ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui conserve sa valeur de nom propre dans le texte hébreu.
theological_decisions:
- issue: Sens et forme de כְּאִישׁ אֶחָד
  choice: comme un seul homme
  alternative: comme un seul être / d’un commun accord
  rationale: La formulation retenue conserve l’image exacte de l’hébreu tout en étant une locution française intelligible. La note en précise la portée collective.
- issue: Référent du relatif dans אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  choice: la loi que Yahweh avait prescrite à Israël
  alternative: le livre que Yahweh avait commandé à Israël
  rationale: Sémantiquement, ce que Yahweh commande est la Torah, non l’objet matériel qu’est le livre. La traduction rend cette relation sans ajouter une affirmation sur l’auteur humain du livre.
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le nom propre divin; sa translittération préserve cette distinction et n’importe pas un titre de substitution.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Esdras » et « porte des Eaux » suivent les formes françaises bibliques usuelles.
