base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: fr
  text: Le deuxième jour, les chefs de famille[a] de tout le peuple, les prêtres et les lévites se réunirent auprès d’Esdras, le scribe, afin de comprendre les paroles de la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne les chefs des maisons paternelles, c’est-à-dire les responsables des clans ou des familles élargies.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour
  rationale: Cette formulation française rend naturellement l’indication temporelle; la continuité narrative portée par le waw ressort du contexte sans qu’un « et » initial soit nécessaire.
- source_word: נֶאֶסְפוּ
  choice: se réunirent
  rationale: Le nifal d’אסף a ici un sens intransitif collectif. « Se réunirent » est naturel et précis en français.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs de famille
  rationale: L’expression désigne les responsables des groupes familiaux ou lignagers. « Chefs de famille » communique clairement leur fonction, tandis que la note conserve la forme sociale plus littérale.
- source_word: לְכָל הָעָם
  choice: de tout le peuple
  rationale: Le complément se rapporte aux chefs de famille et indique qu’ils représentaient l’ensemble du peuple.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: les prêtres et les lévites
  rationale: Les deux groupes sont énumérés avec les chefs de famille parmi ceux qui se réunissent.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: auprès d’Esdras, le scribe
  rationale: אֶל indique le mouvement vers Esdras. « Scribe » conserve son titre reconnu de spécialiste lettré de la Loi.
- source_word: וּלְהַשְׂכִּיל
  choice: afin de mieux comprendre
  rationale: L’infinitif hiphil de שׂכל exprime ici le but de parvenir à une compréhension éclairée. Cette tournure est claire et idiomatique sans réduire l’idée à une simple prise d’information.
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: les paroles de la Loi
  rationale: « Paroles » maintient la référence au contenu formulé de la Torah, et « Loi » convient à ce contexte d’instruction d’alliance.
