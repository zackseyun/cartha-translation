  text: וַ/אֲשֶׁ֣ר יַשְׁמִ֗יעוּ וְ/יַעֲבִ֨ירוּ ק֥וֹל בְּ/כָל עָרֵי/הֶם֮ וּ/בִ/ירוּשָׁלִַ֣ם לֵ/אמֹר֒ צְא֣וּ הָ/הָ֗ר וְ/הָבִ֨יאוּ֙ עֲלֵי זַ֨יִת֙ וַ/עֲלֵי עֵ֣ץ שֶׁ֔מֶן וַ/עֲלֵ֤י הֲדַס֙ וַ/עֲלֵ֣י תְמָרִ֔ים וַ/עֲלֵ֖י עֵ֣ץ עָבֹ֑ת לַ/עֲשֹׂ֥ת סֻכֹּ֖ת כַּ/כָּתֽוּב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: fr
  text: 'et qu’ils devaient faire entendre et diffuser cette proclamation dans toutes leurs villes et à Jérusalem : « Allez dans la région montagneuse et rapportez des rameaux[b] d’olivier, d’arbre à huile[a], de myrte, de palmier et d’arbres au feuillage touffu, afin de faire des cabanes, comme il est écrit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « arbre à huile ». Il pourrait s’agir de l’oléastre ou de l’olivier sauvage, mais l’espèce exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « feuilles d’olivier… feuilles de myrte… ». Ici, « rameaux » exprime naturellement en français le matériau feuillu servant à construire les cabanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: et qu’ils devaient
  rationale: La formulation poursuit la phrase du verset précédent et introduit un second élément de ce qui était écrit dans la Loi.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: faire cette proclamation et la diffuser
  rationale: Cette expression associe l’annonce publique au fait de la faire circuler largement; la traduction française restitue naturellement les deux verbes.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: dans toutes leurs villes ainsi qu’à Jérusalem
  rationale: Cette formulation distingue Jérusalem de l’ensemble des autres villes tout en conservant la portée géographique de l’annonce.
- source_word: צְאוּ הָהָר
  choice: Allez dans la région montagneuse
  rationale: הָהָר peut désigner la montagne ou la région montagneuse; le contexte de la collecte de feuillage favorise ici le sens géographique collectif.
- source_word: עֲלֵי
  choice: rameaux
  rationale: Le mot signifie littéralement « feuilles de », mais il désigne ici le matériau feuillu rapporté pour construire les cabanes; « rameaux » est naturel en français et le sens littéral est signalé en note.
- source_word: עֵץ שֶׁמֶן
  choice: arbre à huile
  rationale: La traduction littérale conserve l’indétermination du nom végétal hébreu, dont l’identification exacte est discutée.
- source_word: הֲדַס
  choice: myrte
  rationale: Équivalent français courant de ce nom végétal.
- source_word: תְמָרִים
  choice: palmier
  rationale: Dans cette liste régie par « rameaux de », le nom de l’arbre exprime naturellement les rameaux de palmier.
- source_word: עֵץ עָבֹת
  choice: arbres au feuillage touffu
  rationale: L’adjectif évoque une végétation épaisse ou dense; cette traduction conserve cette caractéristique sans ajouter « autres », absent de l’hébreu.
- source_word: לַעֲשֹׂת סֻכּוֹת
  choice: afin de faire des cabanes
  rationale: « Cabanes » désigne clairement les abris temporaires de la fête tout en restant accessible au lecteur moderne.
