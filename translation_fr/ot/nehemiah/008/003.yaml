source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: fr
  text: Il y lut, devant la place située en face de la porte des Eaux, depuis les premières lueurs du jour[a] jusqu’à midi, en présence des hommes, des femmes et de ceux qui pouvaient comprendre[b]. Tout le peuple prêtait une oreille attentive au livre[c] de la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis la lumière » ; autre traduction : « depuis l’aube ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui avaient du discernement » ; il s’agit probablement de toutes les personnes en âge de comprendre la lecture.'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut aussi être traduit par « rouleau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: Il y lut
  rationale: Dans ce contexte de lecture publique d’un texte écrit, קרא signifie naturellement « lire ». Le pronom adverbial « y » rend de façon idiomatique בּוֹ, littéralement « en lui/dedans ».
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: devant la place située en face de la porte des Eaux
  rationale: רְחוֹב désigne une place ou un espace public ouvert. La répétition de לִפְנֵי est conservée sans lourdeur excessive par « devant » puis « en face de ».
- source_word: מִן הָאוֹר
  choice: depuis les premières lueurs du jour
  rationale: L’expression signifie littéralement « depuis la lumière » et désigne ici le point du jour. Cette formulation naturelle garde l’image de l’apparition de la lumière.
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: jusqu’à midi
  rationale: Littéralement « jusqu’à la moitié du jour » ; « midi » en exprime clairement et naturellement le sens temporel.
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים
  choice: en présence des hommes, des femmes
  rationale: נֶגֶד situe la lecture face à l’assemblée. Le français « en présence de » convient au contexte et maintient la mention explicite des hommes et des femmes.
- source_word: וְהַמְּבִינִים
  choice: et de ceux qui pouvaient comprendre
  rationale: Le participe de בין désigne les personnes capables de saisir la lecture, vraisemblablement aussi les enfants en âge de la comprendre.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: Tout le peuple prêtait une oreille attentive à
  rationale: Cette expression française naturelle conserve l’image concrète de l’oreille employée dans l’idiome hébreu et communique l’attention soutenue de l’assemblée.
- source_word: סֵפֶר הַתּוֹרָה
  choice: livre de la Loi
  rationale: סֵפֶר peut désigner un livre, un rouleau ou un document. תּוֹרָה renvoie ici au corpus écrit et normatif lu publiquement ; « Loi » est transparent pour le lectorat général.
theological_decisions:
- issue: Sens de תּוֹרָה dans le contexte de la lecture publique de l’alliance
  choice: Loi
  alternative: instruction ; Torah
  rationale: Bien que תּוֹרָה puisse signifier plus largement « instruction », le contexte vise ici un corpus écrit faisant autorité. « Loi » rend ce sens clairement sans introduire une interprétation confessionnelle particulière.
- issue: Composition de l’auditoire
  choice: les hommes, les femmes et ceux qui pouvaient comprendre
  alternative: tous ceux qui étaient capables de comprendre
  rationale: Le texte hébreu nomme expressément les hommes et les femmes, puis ajoute un groupe défini par sa capacité de compréhension. La traduction conserve cette structure et laisse ouverte l’identité exacte du troisième groupe.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la progression narrative et l’image de l’oreille attentive, tout en évitant une syntaxe trop calquée. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
