base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: fr
  text: Alors tout le peuple s’en alla pour manger et boire, envoyer des portions[a] et célébrer avec une grande joie, car ils avaient compris les paroles qui leur avaient été communiquées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire des parts de nourriture envoyées à d’autres personnes dans le cadre de la fête.
    reason: clarification_lexicale
  - marker: b
    text: 'Autre traduction possible : « qui leur avaient été expliquées ». Le mot traduit par « paroles » peut aussi désigner des « choses » ou des « sujets ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל־הָעָם
  choice: Alors tout le peuple s’en alla
  rationale: La forme narrative marque la suite du récit et le départ de l’assemblée. « S’en alla » exprime naturellement ce mouvement en français.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: pour manger et boire
  rationale: Les infinitifs indiquent le but du départ; la formulation française est directe et idiomatique.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: envoyer des portions
  rationale: מָנוֹת désigne des parts attribuées, vraisemblablement de nourriture dans ce contexte festif. « Portions » conserve la concision et la portée du terme hébreu.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: célébrer dans une grande joie
  rationale: Littéralement, l’expression évoque le fait de « faire une grande joie ». Cette formulation naturelle en français garde à la fois l’idée de célébration et l’intensité de גְדוֹלָה.
- source_word: כִּי הֵבִינוּ
  choice: car ils avaient compris
  rationale: כִּי introduit la cause de la joie. Le plus-que-parfait fait ressortir que cette compréhension fonde les actions rapportées.
- source_word: בַּדְּבָרִים
  choice: les paroles
  rationale: דְּבָרִים peut désigner des paroles ou des choses. Dans le contexte de la lecture publique de la Loi, « paroles » préserve le lien avec le contenu verbal reçu.
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: qui leur avaient été expliquées
  rationale: Le hiphil de ידע signifie « faire connaître, informer ». Dans ce contexte pédagogique, « expliquer » est naturel, tout en étant signalé par une note comme une contextualisation possible de la formulation plus littérale « faire connaître ».
theological_decisions:
- issue: Fondement de la joie du peuple
  choice: La joie découle explicitement de la compréhension des paroles communiquées.
  alternative: Présenter cette joie comme une expression technique de renouvellement de l’alliance ou comme l’aboutissement explicite de la repentance.
  rationale: Le texte établit directement un lien causal entre leur compréhension et leur célébration. La traduction n’ajoute pas de développement doctrinal que ce verset ne formule pas.
- issue: Nature de ce qui a été compris
  choice: « les paroles »
  alternative: « les choses » ou « les questions »
  rationale: Le contexte immédiat de lecture et d’enseignement favorise le sens verbal, sans nier l’étendue sémantique de דָּבָר; la note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement narratif de l’hébreu sans lourdeur. « Portions » garde la terminologie concrète du texte, et les notes préservent l’ambiguïté de דְּבָרִים ainsi que la valeur fondamentale de הוֹדִיעוּ.
