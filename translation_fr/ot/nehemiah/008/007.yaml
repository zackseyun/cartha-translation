base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: fr
  text: Josué, Bani, Shérébia, Yamîn, Akkoub, Shabbetaï, Hodiya, Maaséya, Qelita, Azaria, Yozabad, Hanân, Pelaya et les Lévites faisaient comprendre la Loi au peuple[a], tandis que celui-ci restait à sa place[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aidaient le peuple à comprendre la Loi ». Le verbe hébreu est causatif : les Lévites faisaient en sorte que la Loi soit comprise.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se tenait debout à sa place ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֵשׁוּעַ ... פְּלָאיָה
  choice: Josué, Bani, Shérébia, Yamîn, Akkoub, Shabbetaï, Hodiya, Maaséya, Qelita, Azaria, Yozabad, Hanân, Pelaya
  rationale: Les noms propres sont transcrits sous des formes françaises reconnaissables, sans être traduits. « Josué » est la forme française traditionnelle de יֵשׁוּעַ dans ce contexte.
- source_word: וְהַלְוִיִּם
  choice: et les Lévites
  rationale: La coordination hébraïque est conservée sans décider si les hommes nommés constituent eux-mêmes l’ensemble des Lévites ou si un groupe plus large leur est ajouté.
- source_word: מְבִינִים
  choice: faisaient comprendre
  rationale: Le participe hiphil de בין exprime ici l’action de faire comprendre. Cette formulation française rend directement la valeur causative tout en restant naturelle.
- source_word: אֶת־הָעָם לַתּוֹרָה
  choice: la Loi au peuple
  rationale: La syntaxe française est réorganisée autour de « faire comprendre quelque chose à quelqu’un ». Dans ce récit de lecture publique, « la Loi » désigne naturellement la Torah, tout en restant accessible au grand public.
- source_word: וְהָעָם עַל עָמְדָם
  choice: tandis que celui-ci restait à sa place
  rationale: La formulation exprime que le peuple demeurait là où il se trouvait. Le pronom évite une répétition lourde, et le singulier collectif correspond à « le peuple ».
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve la coordination quelque peu ambiguë entre les personnes nommées et « les Lévites », ainsi que la nuance possible de la dernière expression hébraïque.
