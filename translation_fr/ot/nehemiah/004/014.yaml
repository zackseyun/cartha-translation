source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: fr
  text: À l’endroit où vous entendrez le son de la trompe[a], rassemblez-vous à cet endroit, auprès de nous. Notre Dieu combattra pour nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la corne de bélier ». Le shofar est une trompe en corne, souvent de bélier.
    reason: Précision lexicale sur la nature de l’instrument désigné par שׁוֹפָר.
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: À l’endroit où
  rationale: Cette formulation française naturelle conserve le sens locatif concret de בִּמְקוֹם et rend la relative אֲשֶׁר de manière idiomatique.
- source_word: תִּשְׁמְעוּ
  choice: vous entendrez
  rationale: Le qal de שׁמע signifie ici « entendre ». Le futur français convient à la situation envisagée dans cette consigne.
- source_word: קוֹל הַשּׁוֹפָר
  choice: le son de la trompe
  rationale: « Son » traduit explicitement קוֹל. « Trompe » désigne naturellement en français l’instrument à vent qu’est le שׁוֹפָר, sans le confondre avec une trompette moderne; la précision matérielle est conservée en note.
- source_word: שָׁמָּה
  choice: à cet endroit
  rationale: L’adverbe directionnel renvoie au lieu où retentira la trompe. La reprise « à cet endroit » est plus claire en français que le seul adverbe « là » dans cette phrase.
- source_word: תִּקָּבְצוּ
  choice: rassemblez-vous
  rationale: Le niphal de קבץ exprime ici l’action de se réunir; l’impératif pronominal français en restitue clairement la force.
- source_word: אֵלֵינוּ
  choice: auprès de nous
  rationale: Le suffixe de première personne du pluriel doit être conservé. « Auprès de nous » exprime idiomatiquement le mouvement de ralliement vers le locuteur et son groupe.
- source_word: אֱלֹהֵינוּ
  choice: Notre Dieu
  rationale: Le possessif hébreu est maintenu, car il contribue fortement à l’affirmation rhétorique du verset.
- source_word: יִלָּחֶם לָנוּ
  choice: combattra pour nous
  rationale: Le niphal de לחם attribue directement à Dieu l’action de combattre, tandis que לָנוּ indique qu’il agit en faveur du peuple.
theological_decisions:
- issue: Langage du combat divin
  choice: Notre Dieu combattra pour nous
  alternative: Notre Dieu nous aidera à combattre
  rationale: L’hébreu présente Dieu lui-même comme sujet de l’action de combattre, et non simplement comme celui qui prête assistance. La traduction préserve cette emphase sans préciser davantage les modalités de son intervention.
translation_notes:
  register: Français international moderne, clair et digne. « Rassemblez-vous » garde la force de l’ordre militaire, tandis que « trompe » reste compréhensible et historiquement approprié.
