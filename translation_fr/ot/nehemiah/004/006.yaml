base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: fr
  text: 'Lorsque les Juifs qui habitaient près d’eux vinrent, ils nous répétèrent dix fois : « D’où que vous vous tourniez[a], ils viendront contre nous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « partout où vous revenez ». Le verbe hébreu peut signifier « revenir » ou « retourner » ; dans ce contexte, il peut désigner le fait de se tourner dans n’importe quelle direction.'
    reason: lexical_alternative
  - marker: b
    text: La formulation hébraïque de la fin de la phrase est elliptique et difficile. Le sujet « ils » et le verbe « viendront » sont compris d’après le contexte ; littéralement, elle se termine par « contre nous » ou « sur nous ».
    reason: textual_clarity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La formule narrative introduit ici une circonstance temporelle. « Lorsque » restitue ce lien avec naturel, sans la lourdeur d’un calque tel que « Et il arriva que, lorsque ».
- source_word: בָּאוּ
  choice: vinrent
  rationale: Le verbe de mouvement indique que ces Juifs se rendirent auprès de Néhémie et de son groupe.
- source_word: הַיְּהוּדִים
  choice: les Juifs
  rationale: Dans ce contexte, le terme désigne les membres du peuple juif habitant à proximité des adversaires, et pas seulement, au sens géographique strict, les habitants de Juda.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: qui habitaient près d’eux
  rationale: La préposition exprime la proximité avec les adversaires mentionnés dans le contexte. « Près d’eux » reste clair sans suggérer nécessairement une appartenance à leur groupe.
- source_word: וַיֹּאמְרוּ לָנוּ עֶשֶׂר פְּעָמִים
  choice: ils nous répétèrent dix fois
  rationale: Cette formulation française naturelle conserve le nombre explicite et rend l’idée d’avertissements répétés.
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: De tous les côtés
  rationale: Littéralement « de tous les endroits ». Dans cet avertissement, l’expression évoque plus naturellement les différentes directions d’où peut venir la menace.
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: où vous vous tournez
  rationale: Le verbe שׁוּב signifie normalement « revenir, retourner », mais peut évoquer ici le fait de se tourner dans une direction. La traduction conserve cette lecture contextuelle tout en signalant l’autre possibilité en note.
- source_word: עָלֵינוּ
  choice: nous attaquer
  rationale: Littéralement « contre/sur nous ». Le contexte hostile justifie « attaquer », tandis que le sujet et le verbe de l’action sont implicites ou absents dans la formulation hébraïque difficile.
