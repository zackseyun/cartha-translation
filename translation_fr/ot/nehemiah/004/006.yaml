  source_fidelity: 'La traduction rend bien le cadre narratif, les Juifs vivant à proximité et la répétition « dix fois ». Cependant, « De tous les côtés où vous vous tournez » mélange de façon peu naturelle le complément spatial (« de tous les côtés ») et la relative (« où vous vous tournez »). La proposition hébraïque finale est elliptique et syntaxiquement difficile : elle permet une compréhension directionnelle, mais le verbe d’attaque et son sujet ne sont pas exprimés dans le texte massorétique.'
