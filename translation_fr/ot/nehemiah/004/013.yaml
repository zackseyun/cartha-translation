base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: fr
  text: 'Alors je dis aux notables, aux responsables et au reste du peuple : « La tâche est considérable et étendue, et nous sommes séparés le long de la muraille, loin les uns des autres[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun de son frère » ; expression hébraïque indiquant une séparation réciproque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: les notables
  rationale: Dans Néhémie, le terme désigne les membres de l’élite sociale et les hommes influents. « Notables » est naturel en français moderne et n’implique pas un titre nobiliaire précis.
- source_word: הַסְּגָנִים
  choice: les magistrats
  rationale: Le mot désigne des dirigeants ou administrateurs subalternes. « Magistrats » exprime ici une fonction publique dirigeante sans préciser indûment leur rang.
- source_word: יֶתֶר הָעָם
  choice: le reste du peuple
  rationale: Traduction directe et idiomatique de l’expression désignant tous ceux qui ne font pas partie des deux groupes de dirigeants déjà mentionnés.
- source_word: הַמְּלָאכָה
  choice: le travail
  rationale: Le terme renvoie ici à l’entreprise de reconstruction de la muraille. « Travail » est clair, courant et suffisamment large.
- source_word: הַרְבֵּה
  choice: considérable
  rationale: Dans cet emploi prédicatif, le mot décrit l’ampleur de la tâche. « Considérable » restitue naturellement cette idée en français.
- source_word: וּרְחָבָה
  choice: et très étendu
  rationale: L’adjectif signifie littéralement « large » ou « vaste » et décrit ici l’étendue spatiale du chantier. « Très étendu » conserve cette image sans suggérer que le travail lui-même serait dispersé.
- source_word: נִפְרָדִים
  choice: nous sommes séparés
  rationale: Le participe passif indique que les travailleurs se trouvent à distance les uns des autres. « Séparés » préserve ce sens spatial sans introduire l’idée d’un conflit.
- source_word: עַל הַחוֹמָה
  choice: le long de la muraille
  rationale: Bien que עַל puisse signifier « sur », le contexte décrit la répartition des ouvriers sur toute la longueur de la muraille. « Le long de » rend clairement cette disposition spatiale.
- source_word: רְחוֹקִים
  choice: loin
  rationale: Adjectif spatial simple indiquant la grande distance entre les différents groupes de travailleurs.
- source_word: אִישׁ מֵאָחִיו
  choice: les uns des autres
  rationale: Littéralement « chacun de son frère », cette tournure hébraïque exprime ici une relation réciproque. « Les uns des autres » en transmet naturellement le sens.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. Le passé simple (« je dis ») convient au récit biblique sans être archaïque. « Notables » et « magistrats » distinguent les deux groupes dirigeants, tandis que « considérable et très étendu » conserve les deux dimensions de la tâche : son ampleur et son étendue spatiale.'
