  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: fr
  text: Les bâtisseurs construisaient, chacun avec son épée attachée à la taille, et celui qui sonnait du cor[a] se tenait à côté de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne le shofar, un cor utilisé notamment comme instrument de signal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: Les bâtisseurs / pendant qu’ils construisaient
  rationale: Le participe de בנה désigne d’abord les personnes qui bâtissent, puis exprime l’action en cours. Cette formulation naturelle conserve en français la répétition de la même racine.
- source_word: אִישׁ
  choice: chacun
  rationale: 'אִישׁ a ici une valeur distributive : chaque bâtisseur portait personnellement une épée.'
- source_word: חַרְבּוֹ
  choice: leur épée
  rationale: Le possessif singulier hébreu accompagne la tournure distributive. En français, « chacun leur épée » renvoie naturellement à l’ensemble des bâtisseurs sans changer le sens individuel.
- source_word: אֲסוּרִים עַל מָתְנָיו
  choice: attachée à la taille
  rationale: Le participe passif de אסר signifie « liée » ou « fixée », et מָתְנַיִם désigne la région des reins ou de la taille. La traduction décrit clairement la manière dont l’épée était portée, sans expression archaïque.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: celui qui sonnait du cor
  rationale: Le participe de תקע met l’accent sur la personne chargée de faire retentir l’instrument. « Cor » est intelligible et correspond mieux qu’une trompette moderne au שׁוֹפָר, dont la nature précise est indiquée en note.
- source_word: אֶצְלִי
  choice: à côté de moi
  rationale: La préposition exprime ici une proximité immédiate avec Néhémie.
