  text: הַ/בּוֹנִ֧ים בַּ/חוֹמָ֛ה וְ/הַ/נֹּשְׂאִ֥ים בַּ/סֶּ֖בֶל עֹמְשִׂ֑ים בְּ/אַחַ֤ת יָד/וֹ֙ עֹשֶׂ֣ה בַ/מְּלָאכָ֔ה וְ/אַחַ֖ת מַחֲזֶ֥קֶת הַ/שָּֽׁלַח׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: fr
  text: 'Les bâtisseurs sur la muraille et les porteurs de charges étaient chargés[a] : chacun faisait le travail d’une main et tenait son arme[b] de l’autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « chargés » est rare, et sa nuance précise est incertaine. Il peut aussi évoquer le fait de charger ou de manier des matériaux.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner plus précisément une lance, un javelot ou une autre arme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: Ceux qui bâtissaient la muraille
  rationale: Le participe substantivé הַבּוֹנִים désigne les bâtisseurs. Dans ce contexte, בַּחוֹמָה indique naturellement l’objet ou le lieu de leur activité; « bâtissaient la muraille » est idiomatique en français et correspond à la scène.
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: et ceux qui transportaient les charges
  rationale: נשא associé à סבל évoque le transport de matériaux pesants. « Charges » est concret et convient au chantier sans donner à « fardeaux » une connotation figurée.
- source_word: עֹמְשִׂים
  choice: travaillaient ainsi chargés
  rationale: Ce participe rare paraît décrire des ouvriers chargés ou occupés à manier des matériaux. La formulation française relie cet état à leur travail tout en laissant la note signaler l’incertitude lexicale.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: d’une main, chacun faisait le travail
  rationale: 'Le singulier est distributif: chaque ouvrier est envisagé individuellement. « Chacun » rend ce mouvement du pluriel collectif au singulier hébreu.'
- source_word: וְאַחַת מַחֲזֶקֶת
  choice: et de l’autre, il tenait
  rationale: Le participe féminin s’accorde avec la « main » sous-entendue. Le français explicite naturellement l’opposition entre les deux mains.
- source_word: הַשָּׁלַח
  choice: son arme
  rationale: Le terme peut désigner une arme de jet, un javelot, une lance ou un autre type d’arme. Le terme générique « arme » préserve l’indétermination du contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure distributive « chacun… il » conserve le passage du groupe à l’ouvrier individuel. La répétition liée aux charges est légèrement lissée, tandis que l’incertitude du participe rare est conservée en note.
