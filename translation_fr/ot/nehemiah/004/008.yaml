base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: fr
  text: 'Je regardai, puis je me levai et dis aux notables, aux responsables et au reste du peuple : « N’ayez pas peur d’eux. Souvenez-vous du Seigneur, qui est grand et redoutable[a], et combattez pour vos frères[b], vos fils, vos filles, vos femmes et vos maisons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grand et digne de crainte ». L’adjectif hébreu désigne ce qui inspire un profond saisissement, voire de la peur.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est au masculin pluriel; le verset nomme ensuite séparément les fils, les filles et les femmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Je regardai
  rationale: Le verbe ראה ouvre la suite d’actions de Néhémie. « Je regardai » conserve ici la nuance d’observation active sans ajouter un complément absent de l’hébreu.
- source_word: וָאָקוּם
  choice: puis je me levai
  rationale: קום marque le passage à une action résolue. « Je me levai » est naturel et fidèle, tandis que « puis » explicite sobrement la progression narrative portée par la forme verbale hébraïque.
- source_word: הַחֹרִים
  choice: les notables
  rationale: Le terme désigne des personnes de rang social élevé. « Notables » est clair en français moderne et convient au contexte communautaire.
- source_word: הַסְּגָנִים
  choice: les responsables
  rationale: סְגָנִים désigne des dirigeants ou administrateurs subordonnés. « Responsables » reste courant et assez large pour ne pas imposer un titre administratif trop précis.
- source_word: יֶתֶר הָעָם
  choice: le reste du peuple
  rationale: Cette expression distingue l’ensemble de la population des dirigeants déjà nommés. La formulation française est directe et idiomatique.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: N’ayez pas peur d’eux
  rationale: La tournure rend naturellement l’interdiction de craindre les adversaires auxquels le peuple fait face.
- source_word: אֶת אֲדֹנָי
  choice: le Seigneur
  rationale: אֲדֹנָי est ici le titre divin « Seigneur », et non le tétragramme יהוה.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: qui est grand et redoutable
  rationale: נורא évoque ce qui inspire crainte et saisissement. « Redoutable » maintient cette force, tandis que la relative donne une phrase naturelle en français.
- source_word: זְכֹרוּ
  choice: Souvenez-vous
  rationale: L’impératif direct conserve la force de l’appel à garder le Seigneur présent à l’esprit.
- source_word: וְהִלָּחֲמוּ עַל
  choice: et combattez pour
  rationale: Dans ce contexte, la construction signifie combattre en faveur de quelqu’un ou pour le défendre.
- source_word: אֲחֵיכֶם
  choice: vos frères
  rationale: Le nom hébreu est un masculin pluriel désignant ici les frères ou les hommes apparentés; les autres membres des familles sont ensuite énumérés séparément.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: vos fils, vos filles, vos femmes et vos maisons
  rationale: La traduction conserve la liste concrète et cumulative ainsi que l’étendue possible de בָּתִּים, qui peut renvoyer aux habitations comme aux maisonnées.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: le Maître
  rationale: Le texte emploie אֲדֹנָי et non יהוה. « Le Seigneur » est le titre divin français usuel et évite de confondre les deux formes hébraïques.
- issue: Portée de הַנּוֹרָא
  choice: redoutable
  alternative: impressionnant; digne de crainte
  rationale: Le passage oppose la peur des adversaires à la conscience de la grandeur de Dieu. « Redoutable » préserve la tension entre majesté saisissante et crainte sans réduire le terme à une simple admiration.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple convient au récit écrit sans archaïsme excessif. Les impératifs pluriels gardent la vigueur de l’exhortation. « Maisons » préserve l’ambiguïté entre bâtiments d’habitation et maisonnées.
