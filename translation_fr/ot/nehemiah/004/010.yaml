  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: fr
  text: À partir de ce jour-là, la moitié de mes jeunes gens[a] travaillait, tandis que l’autre moitié tenait les lances, les boucliers, les arcs et les armures[b]. Les chefs étaient derrière toute la maison de Juda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes serviteurs », « mes hommes » ou « les hommes de ma suite ». Le terme hébreu peut désigner des jeunes gens, des serviteurs ou des hommes attachés au service d’un dirigeant.
    reason: lexical_alternative
  - marker: b
    text: Ou « les cuirasses » ou « les cottes de mailles »; le terme hébreu désigne une protection portée sur le corps.
    reason: lexical_alternative
  - marker: c
    text: La position des chefs derrière toute la maison de Juda peut indiquer qu’ils assuraient son soutien militaire ou surveillaient les travaux.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: mes jeunes gens
  rationale: Le terme peut désigner des jeunes hommes, des serviteurs ou des hommes de la suite de Néhémie. « Mes jeunes gens » conserve son sens lexical direct sans imposer une relation domestique.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: travaillait
  rationale: Dans ce contexte, l’expression désigne l’accomplissement des travaux de reconstruction. Le singulier s’accorde naturellement avec « la moitié ».
- source_word: מַחֲזִיקִים
  choice: tenait
  rationale: Le participe exprime ici l’action de tenir les armes énumérées; cette traduction reste concrète et proche de l’hébreu.
- source_word: הָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת
  choice: les lances, les boucliers, les arcs
  rationale: Ces équivalents français courants rendent directement l’inventaire militaire.
- source_word: הַשִּׁרְיֹנִים
  choice: les armures
  rationale: Le mot désigne une protection corporelle, probablement une cuirasse ou une cotte de mailles; « armures » préserve la généralité du terme.
- source_word: הַשָּׂרִים
  choice: les chefs
  rationale: Le terme peut désigner des chefs, des responsables ou des officiers. « Chefs » convient au contexte d’organisation collective sans préciser indûment un grade militaire.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: derrière toute la maison de Juda
  rationale: La traduction conserve le sens spatial de אַחֲרֵי et l’expression collective « maison de Juda », sans transformer explicitement cette position en soutien ou en surveillance.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image collective « maison de Juda » et évite d’ajouter un verbe d’action absent de la proposition hébraïque concernant les chefs.
