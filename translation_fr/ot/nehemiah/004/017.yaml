base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: fr
  text: Ni moi, ni mes frères, ni mes jeunes gens, ni les hommes de la garde qui étaient derrière moi ne retirions nos vêtements. Chacun gardait son arme à portée de main, même pour aller chercher de l’eau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du verset est difficile en hébreu; littéralement : « chacun son arme, l’eau ». Elle peut signifier que chacun gardait son arme à portée de main, même pour aller chercher de l’eau, ou que chacun allait chercher de l’eau avec son arme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: Ni… ni… nous n’enlevions
  rationale: La construction avec אֵין et le participe exprime une action continuellement niée. L’imparfait français rend naturellement cette situation prolongée, tandis que la reprise « nous » après les sujets coordonnés est idiomatique.
- source_word: אַחַי
  choice: mes frères
  rationale: Conserve le terme familial du texte hébreu sans préciser s’il désigne ici des frères au sens strict ou des proches.
- source_word: נְעָרַי
  choice: mes jeunes gens
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. « Jeunes gens » conserve l’indétermination lexicale sans imposer un statut servile.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: les hommes de la garde
  rationale: Rend clairement le sens de garde ou de service de surveillance dans ce contexte de sécurité.
- source_word: אֲשֶׁר אַחֲרַי
  choice: qui se tenaient derrière moi
  rationale: Conserve le sens spatial probable de אַחֲרַי et explicite seulement ce qui est nécessaire à une formulation française naturelle.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: nous n’enlevions nos vêtements
  rationale: פשט avec בגדים signifie enlever ses vêtements. L’expression est claire, courante et digne.
- source_word: אִישׁ
  choice: chacun
  rationale: Rend l’emploi distributif de אִישׁ de manière naturelle en français.
- source_word: שִׁלְחוֹ
  choice: son arme à portée de main
  rationale: שֶׁלַח peut désigner une arme, notamment une arme de jet. La clause étant textuellement difficile, cette formulation exprime la disponibilité de l’arme sans en déterminer abusivement le type ni introduire la « main droite », absente du texte massorétique transmis.
- source_word: הַמָּיִם
  choice: même pour aller chercher de l’eau
  rationale: La mention finale de l’eau est très elliptique. Cette formulation donne l’interprétation contextuelle probable tout en signalant l’incertitude en note.
