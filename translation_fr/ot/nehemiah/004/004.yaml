  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה כָּשַׁל֙ כֹּ֣חַ הַ/סַּבָּ֔ל וְ/הֶ/עָפָ֖ר הַרְבֵּ֑ה וַ/אֲנַ֨חְנוּ֙ לֹ֣א נוּכַ֔ל לִ/בְנ֖וֹת בַּ/חוֹמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: fr
  text: 'Juda dit[a] : « Les porteurs n’ont plus de forces, et il y a beaucoup de décombres[b]. Nous ne pouvons pas bâtir la muraille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les gens de Juda dirent. » Le nom propre singulier « Juda » représente probablement ici l’ensemble de la communauté.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « poussière » ; dans ce contexte, il s’agit vraisemblablement des débris ou des gravats de la ville en ruine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Le nom propre est conservé, conformément à l’hébreu. Dans ce contexte, il désigne vraisemblablement de façon collective les gens de Juda, ce que précise la note.
- source_word: כָּשַׁל כֹּחַ
  choice: n’ont plus de forces
  rationale: Cette tournure française naturelle exprime l’épuisement physique indiqué par l’image hébraïque d’une force qui chancelle ou défaille.
- source_word: הַסַּבָּל
  choice: les porteurs
  rationale: Le nom désigne ceux qui transportent des charges. Le pluriel rend en français la valeur collective probable du singulier hébreu.
- source_word: הֶעָפָר
  choice: décombres
  rationale: Le sens lexical ordinaire est « poussière » ou « terre », mais le contexte de la muraille ruinée indique les gravats ou débris qui entravent les travaux.
- source_word: לֹא נוּכַל
  choice: nous ne pouvons pas
  rationale: La forme exprime l’incapacité, non le refus.
- source_word: לִבְנוֹת בַּחוֹמָה
  choice: bâtir la muraille
  rationale: Cette formulation idiomatique rend l’activité de construction portant sur la muraille. « Bâtir sur la muraille » risquerait de suggérer en français qu’une autre structure est édifiée au-dessus d’elle.
theological_decisions: []
