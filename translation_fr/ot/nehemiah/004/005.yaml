  text: וַ/יֹּאמְר֣וּ צָרֵ֗י/נוּ לֹ֤א יֵדְעוּ֙ וְ/לֹ֣א יִרְא֔וּ עַ֛ד אֲשֶׁר נָב֥וֹא אֶל תּוֹכָ֖/ם וַ/הֲרַגְנ֑וּ/ם וְ/הִשְׁבַּ֖תְנוּ אֶת הַ/מְּלָאכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: fr
  text: 'Nos adversaires dirent : « Ils ne sauront rien et ne verront rien jusqu’à ce que nous arrivions au milieu d’eux[a], que nous les tuions et que nous fassions cesser le travail. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֵינוּ
  choice: nos adversaires
  rationale: Le terme צַר désigne ici des opposants hostiles. « Adversaires » exprime clairement cette opposition sans ajouter une nuance étrangère au texte.
- source_word: יֵדְעוּ
  choice: ils ne sauront rien
  rationale: יָדַע évoque ici le fait de savoir ou d’être au courant. Cette formulation française conserve le verbe simple et convient à l’idée d’une attaque surprise.
- source_word: יִרְאוּ
  choice: ils ne verront rien
  rationale: Le sens concret de רָאָה, « voir », est maintenu afin de préserver le parallélisme avec « savoir » et la vigueur de la menace.
- source_word: עַד אֲשֶׁר
  choice: jusqu’à ce que
  rationale: Cette locution marque la limite temporelle de leur ignorance et correspond directement à la construction hébraïque.
- source_word: נָבוֹא אֶל תּוֹכָם
  choice: nous arrivions au milieu d’eux
  rationale: בּוֹא indique l’arrivée ou l’entrée, et תּוֹךְ le milieu intérieur d’un groupe. La formulation rend naturellement l’idée d’une irruption parmi eux.
- source_word: וַהֲרַגְנוּם
  choice: que nous les tuions
  rationale: הָרַג est le verbe courant signifiant « tuer ». Le choix conserve le caractère direct et brutal de la menace.
- source_word: וְהִשְׁבַּתְנוּ אֶת הַמְּלָאכָה
  choice: que nous fassions cesser le travail
  rationale: La forme causative de שׁבת signifie « faire cesser ». Cette traduction en garde explicitement la valeur causative, tandis que מְלָאכָה désigne ici le travail de reconstruction.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le parallélisme hébreu entre « savoir » et « voir » est conservé, malgré son caractère légèrement marqué en français. L’imparfait « disaient » présente la menace formulée par les adversaires dans le contexte narratif, tandis que les subjonctifs suivent naturellement « jusqu’à ce que ».
