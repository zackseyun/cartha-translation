base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: fr
  text: Alors je postai des hommes aux points les plus bas du site, derrière la muraille, aux endroits exposés[a] ; je postai le peuple par familles, avec leurs épées, leurs lances et leurs arcs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux endroits nus » ou « ouverts ». Le terme hébreu est rare et peut désigner des secteurs découverts, donc vulnérables à une attaque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: je postai
  rationale: Le hiphil de עמד exprime ici le fait de placer des personnes à des postes défensifs. « Poster » convient au contexte militaire et reste naturel en français.
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: dans les parties les plus basses du terrain
  rationale: מִתַּחְתִּיּוֹת désigne les parties inférieures ou les plus basses, et מָקוֹם le lieu ou le terrain. Cette formulation conserve le sens spatial sans préciser à tort la configuration exacte.
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: derrière la muraille
  rationale: La locution situe les défenseurs à l’arrière de la muraille. « Derrière la muraille » est clair et idiomatique.
- source_word: בצחחיים
  choice: aux endroits découverts
  rationale: Ce terme rare semble désigner des espaces nus, ouverts ou exposés. « Endroits découverts » exprime la vulnérabilité tactique possible tout en maintenant l’ambiguïté dans une note.
- source_word: וָאַעֲמִיד אֶת־הָעָם
  choice: et je disposai le peuple
  rationale: La reprise du verbe hébreu est conservée, mais « disposai » évite une répétition française pesante et souligne l’organisation méthodique des défenseurs.
- source_word: לְמִשְׁפָּחוֹת
  choice: par familles
  rationale: מִשְׁפָּחוֹת peut désigner des familles élargies ou des clans. « Par familles » est accessible et rend le principe de regroupement social.
- source_word: עִם חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: avec leurs épées, leurs lances et leurs arcs
  rationale: Cette traduction directe conserve la liste ternaire des armes et le suffixe possessif répété en hébreu.
