  text: וַ/יִּקְשְׁר֤וּ כֻלָּ/ם֙ יַחְדָּ֔ו לָ/ב֖וֹא לְ/הִלָּחֵ֣ם בִּ/ירוּשָׁלִָ֑ם וְ/לַ/עֲשׂ֥וֹת ל֖/וֹ תּוֹעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: fr
  text: Ils se liguèrent tous ensemble pour venir combattre Jérusalem et y semer la confusion[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « y provoquer du désordre » ou « y causer des troubles ». Le nom hébreu peut désigner la confusion, le trouble ou le désarroi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: se liguèrent
  rationale: Le verbe קשר exprime ici la formation concertée d’une alliance hostile. « Se liguer » rend naturellement cette idée sans imposer le caractère clandestin que peut suggérer « conspirer ».
- source_word: כֻלָּם יַחְדָּו
  choice: tous ensemble
  rationale: Cette expression préserve à la fois la totalité du groupe et le caractère coordonné de son action.
- source_word: לָבוֹא לְהִלָּחֵם
  choice: pour venir combattre
  rationale: La formulation conserve le verbe de mouvement suivi du verbe de combat, comme dans l’hébreu, tout en restant naturelle en français.
- source_word: בִּירוּשָׁלָם
  choice: Jérusalem
  rationale: Après « combattre », le français moderne peut employer directement le nom de la ville comme complément désignant la cible de l’action hostile.
- source_word: וְלַעֲשׂוֹת לוֹ תּוֹעָה
  choice: et y semer la confusion
  rationale: Littéralement, il s’agit de produire pour ou dans la ville un état de confusion ou de désordre. « Y semer la confusion » rend idiomatiquement le résultat recherché et laisse la portée exacte du nom ouverte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Se liguer » souligne l’action hostile concertée; « semer la confusion » est idiomatique tout en conservant l’indétermination du terme hébreu, explicitée en note.
