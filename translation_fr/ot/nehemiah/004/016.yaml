base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: fr
  text: 'À cette époque-là, j’ai aussi dit au peuple : « Que chaque homme et son serviteur[a] passent la nuit à l’intérieur de Jérusalem, et qu’ils montent la garde pour nous la nuit et travaillent le jour[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner un jeune homme, un assistant ou un subordonné.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une construction nominale : « ils seront pour nous une garde la nuit et un travail le jour ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: À cette même époque, … aussi
  rationale: La formulation conserve à la fois la référence temporelle et la valeur additive de גַּם, dans un ordre naturel en français.
- source_word: אָמַרְתִּי לָעָם
  choice: j’ai dit au peuple
  rationale: Traduction directe et idiomatique de la formule hébraïque.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: chacun … avec son serviteur
  rationale: אִישׁ a ici une valeur distributive. Dans ce contexte de travail et de garde, « serviteur » exprime la relation subordonnée suggérée par נַעַר sans imposer que la personne soit jeune.
- source_word: יָלִינוּ
  choice: passe la nuit
  rationale: Rend clairement le sens de loger ou demeurer quelque part pendant la nuit.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: à l’intérieur de Jérusalem
  rationale: Exprime explicitement la localisation dans l’enceinte de la ville.
- source_word: הַלַּיְלָה מִשְׁמָר
  choice: assureront la garde pour nous la nuit
  rationale: Formulation française naturelle qui rend la fonction de surveillance ou de protection exprimée par מִשְׁמָר.
- source_word: וְהַיּוֹם מְלָאכָה
  choice: et travailleront le jour
  rationale: Le nom abstrait מְלָאכָה, « travail », est rendu verbalement en français afin de conserver clairement le même sujet humain dans le parallèle nuit-jour.
