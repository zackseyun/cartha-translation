revisions:
- from: 'À cette même époque, j’ai aussi dit au peuple : « Que chacun passe la nuit à l’intérieur de Jérusalem avec son serviteur[a]. Ainsi, ils assureront la garde pour nous la nuit et travailleront le jour[b]. »'
  to: 'À cette époque-là, j’ai aussi dit au peuple : « Que chaque homme et son serviteur[a] passent la nuit à l’intérieur de Jérusalem, et qu’ils montent la garde pour nous la nuit et travaillent le jour[b]. »'
  rationale: La révision rétablit « chaque homme et son serviteur » comme double sujet de l’instruction, enlève la conséquence ajoutée par « Ainsi », et rend le parallélisme garde nocturne / travail diurne au moyen de deux verbes français naturels. La note b décrit la forme nominale hébraïque sans prétendre que son calque français soit idiomatique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:49:12Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « chacun ... avec son serviteur » affaiblit la coordination explicite de l’hébreu (« chaque homme et son serviteur »). « Ainsi » introduit en outre une nuance consécutive qui n’est pas nécessairement exprimée par le waw. La révision conserve la fonction nocturne et diurne tout en respectant mieux la coordination source.
  naturalness: Le français proposé reste moderne et fluide. « Que chaque homme et son serviteur passent la nuit... » est naturel dans un registre biblique contemporain, et « monter la garde » est idiomatique.
  terminology: « Serviteur » convient ici pour נער sans imposer le sens de « jeune homme ». La note maintient les possibilités lexicales pertinentes. « Monter la garde » rend précisément משמר dans ce contexte.
  issues:
  - severity: medium
    issue: « avec son serviteur » ne reproduit pas pleinement la coordination de « chaque homme et son serviteur ».
    rationale: L’hébreu présente les deux personnes comme les sujets de l’ordre de passer la nuit dans Jérusalem. « Avec » est compréhensible, mais réduit la symétrie syntaxique et peut faire du serviteur un simple accompagnateur.
  - severity: low
    issue: « Ainsi » ajoute une liaison consécutive interprétative.
    rationale: Le texte coordonne l’instruction de loger dans la ville avec leur fonction de garde nocturne et de travail diurne. Une coordination française directe préserve mieux cette relation sans la définir comme conséquence.
  - severity: low
    issue: La note b qualifie de littérale une formulation française qui nécessite une légère explicitation pour être intelligible.
    rationale: La note peut plutôt signaler la construction nominale de l’hébreu, dont la formulation française strictement littérale est elliptique et peu naturelle.
