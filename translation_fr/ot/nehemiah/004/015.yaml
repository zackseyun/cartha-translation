  text: וַ/אֲנַ֖חְנוּ עֹשִׂ֣ים בַּ/מְּלָאכָ֑ה וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ בָּֽ/רְמָחִ֔ים מֵ/עֲל֣וֹת הַ/שַּׁ֔חַר עַ֖ד צֵ֥את הַ/כּוֹכָבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: fr
  text: Nous poursuivions donc le travail, tandis que la moitié d’entre eux tenait les lances, depuis les premières lueurs de l’aube jusqu’à l’apparition des étoiles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis la montée de l’aube jusqu’à la sortie des étoiles ».'
    reason: La note conserve les images concrètes des expressions hébraïques, rendues de manière plus idiomatique dans le texte.
lexical_decisions:
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: poursuivions le travail
  rationale: Le participe exprime ici une action continue dans le récit. « Poursuivions le travail » rend naturellement cette durée sans préciser davantage la nature des travaux.
- source_word: וְחֶצְיָם
  choice: tandis que la moitié d’entre eux
  rationale: La conjonction coordonne deux actions simultanées. « Tandis que » explicite naturellement ce rapport en français.
- source_word: מַחֲזִיקִים בָּרְמָחִים
  choice: tenait les lances
  rationale: Le participe décrit le maintien continu des armes. Le singulier « tenait » s’accorde avec le nom collectif « la moitié » et « les lances » reflète la forme définie de l’hébreu.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: depuis les premières lueurs de l’aube
  rationale: Cette formulation française naturelle rend le commencement du jour évoqué littéralement par la « montée » de l’aube.
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: jusqu’à l’apparition des étoiles
  rationale: Le syntagme désigne le moment où les étoiles sortent ou deviennent visibles. « Apparition » conserve l’image concrète sans se réduire au terme plus interprétatif « nuit ».
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. L’imparfait exprime la continuité des deux actions, et la tournure temporelle reste imagée tout en étant naturelle.
