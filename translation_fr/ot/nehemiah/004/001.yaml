  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר שָׁמַ֣ע סַנְבַלַּ֡ט וְ֠/טוֹבִיָּה וְ/הָ/עַרְבִ֨ים וְ/הָ/עַמֹּנִ֜ים וְ/הָ/אַשְׁדּוֹדִ֗ים כִּֽי עָלְתָ֤ה אֲרוּכָה֙ לְ/חֹמ֣וֹת יְרוּשָׁלִַ֔ם כִּי הֵחֵ֥לּוּ הַ/פְּרֻצִ֖ים לְ/הִסָּתֵ֑ם וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: fr
  text: Quand Sanballat, Tobiya, les Arabes, les Ammonites et les Ashdodites apprirent que la restauration des murailles de Jérusalem avait progressé[a] et que les brèches avaient commencé à être comblées[b], ils se mirent très en colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que la réparation des murailles de Jérusalem avait progressé ». Le mot hébreu peut évoquer la guérison ou le rétablissement et s’applique ici, par image, à la remise en état des murailles.
    reason: lexical_alternative
  - marker: b
    text: Ou « les ouvertures avaient commencé à être refermées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Quand
  rationale: Cette formule narrative introduit ici une proposition temporelle. « Quand » rend naturellement la transition sans ajouter un adverbe temporel absent de l’hébreu.
- source_word: שָׁמַע
  choice: apprirent
  rationale: Dans ce contexte, le verbe désigne la réception d’une nouvelle. « Apprirent » est plus naturel en français que « entendirent que », tout en conservant le sens.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: Sanballat, Tobiya
  rationale: Translittération française usuelle des noms propres.
- source_word: הָעַרְבִים וְהָעַמֹּנִים וְהָאַשְׁדּוֹדִים
  choice: les Arabes, les Ammonites et les Ashdodites
  rationale: Ces gentilés rendent directement les trois groupes nommés dans le texte hébreu.
- source_word: עָלְתָה אֲרוּכָה
  choice: la restauration … avançait
  rationale: אֲרוּכָה évoque la guérison ou la remise en état, ici appliquée métaphoriquement aux murailles, tandis que עָלְתָה indique une progression. Cette formulation conserve les deux idées dans un français naturel.
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: des murailles de Jérusalem
  rationale: « Murailles » convient aux fortifications urbaines et exprime naturellement en français la relation marquée par la préposition hébraïque.
- source_word: הַפְּרֻצִים
  choice: les brèches
  rationale: Le terme désigne les ouvertures produites dans une muraille; « brèches » est précis et courant dans ce contexte.
- source_word: לְהִסָּתֵם
  choice: à être comblées
  rationale: L’infinitif passif exprime la fermeture des brèches. « Être comblées » est idiomatique pour des ouvertures dans une muraille et préserve la voix passive.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: ils se mirent très en colère
  rationale: L’expression hébraïque décrit une colère intense. La formulation française est actuelle, claire et conserve l’entrée dans cet état.
