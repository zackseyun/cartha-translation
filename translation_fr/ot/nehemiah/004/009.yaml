base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: fr
  text: Lorsque nos ennemis apprirent que nous en avions eu connaissance[a] et que Dieu avait déjoué leur projet[b], nous retournâmes tous à la muraille, chacun à son travail[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « que nous l’avions appris ». L’hébreu dit littéralement : « que cela nous était devenu connu ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « avait fait échouer leur dessein ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie une expression distributive : « un homme vers son travail », c’est-à-dire que chaque travailleur a repris sa tâche.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La construction introduit le moment où survient la suite du récit. En français moderne, « Lorsque » rend naturellement cette transition sans reproduire lourdement « Et il arriva que ».
- source_word: אוֹיְבֵינוּ
  choice: nos ennemis
  rationale: Équivalent direct et naturel du nom avec suffixe de première personne du pluriel.
- source_word: כִּי נוֹדַע לָנוּ
  choice: que nous en avions eu connaissance
  rationale: Cette formulation française conserve l'idée que le projet était désormais connu du groupe, tout en restant naturelle. Le pronom « en » renvoie au projet hostile implicite dans le contexte.
- source_word: וַיָּפֶר
  choice: avait déjoué
  rationale: Le verbe הפר exprime ici l'annulation ou la mise en échec d'un dessein. « Déjouer un projet » est idiomatique en français et convient au contexte.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte, le terme désigne le Dieu d'Israël; le français emploie normalement le nom sans article.
- source_word: עֲצָתָם
  choice: leur projet
  rationale: עצה peut désigner un conseil, un dessein ou un projet. Ici, « projet » exprime clairement le plan des ennemis sans ajouter la nuance péjorative de « complot ».
- source_word: וְנָשׁוּב כֻּלָּנוּ
  choice: nous sommes tous retournés
  rationale: שוב signifie revenir ou retourner, et כֻּלָּנוּ précise que tous les membres du groupe ont repris leur place.
- source_word: אֶל הַחוֹמָה
  choice: à la muraille
  rationale: Il s'agit de la muraille de Jérusalem en cours de reconstruction; « muraille » est précis et naturel dans ce contexte urbain.
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: chacun à son travail
  rationale: איש est employé distributivement. « Chacun » restitue cette individualisation avec concision, tandis que « travail » rend le sens général de מלאכה.
theological_decisions:
- issue: Attribution de l'échec du projet ennemi
  choice: Dieu avait déjoué leur projet
  alternative: Les circonstances avaient fait échouer leur projet
  rationale: L'hébreu attribue explicitement à Dieu l'échec du projet ennemi. La traduction maintient cette affirmation directe sans la réduire à une circonstance impersonnelle.
- issue: Expression distributive masculine אִישׁ
  choice: chacun à son travail
  alternative: chaque homme à son travail
  rationale: Dans cette construction, איש a une fonction distributive. « Chacun » en restitue exactement la portée en français courant sans affirmer davantage que le texte sur la composition du groupe.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe évite l’archaïsme « il arriva que » tout en conservant la séquence du récit. « Muraille » convient au rempart urbain de Jérusalem, et « chacun à son travail » garde la force distributive de l’hébreu.
