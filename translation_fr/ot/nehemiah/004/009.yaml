  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : les ennemis apprennent que leur dessein est connu, Dieu le met en échec, puis tous retournent à la muraille, chacun à son travail. « Projet », « déjoué », « muraille » et « chacun » sont des équivalents justes. La note a doit toutefois mieux refléter le niphal de ידע : le texte dit que la chose « était devenue connue de nous », non simplement qu’elle « nous était connue ».'
  naturalness: La combinaison du passé simple (« apprirent ») et du passé composé (« sommes retournés ») dans la même séquence narrative produit une discordance de registre. Le maintien du passé simple dans la proposition principale donne un français narratif moderne plus homogène.
  terminology: « Dieu » rend correctement הָאֱלֹהִים sans atténuer l’attribution divine. « Leur projet » rend bien עֲצָתָם sans imposer la nuance plus accusatrice de « complot ». « Chacun à son travail » restitue naturellement la valeur distributive de אִישׁ אֶל־מְלַאכְתּוֹ.
  issues:
