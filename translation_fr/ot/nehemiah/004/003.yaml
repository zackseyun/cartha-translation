  text: וַ/נִּתְפַּלֵּ֖ל אֶל אֱלֹהֵ֑י/נוּ וַ/נַּעֲמִ֨יד מִשְׁמָ֧ר עֲלֵי/הֶ֛ם יוֹמָ֥ם וָ/לַ֖יְלָה מִ/פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/003.yaml
  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: fr
  text: Nous avons prié notre Dieu et posté une garde contre eux, jour et nuit, à cause d’eux[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « établi une surveillance contre eux ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant eux » ; ici, l’expression signifie « à cause d’eux » ou « en raison d’eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: nous avons prié
  rationale: Le hitpael de פלל signifie couramment « prier ». Cette formulation naturelle n’ajoute aucune intensité absente du verbe hébreu.
- source_word: אֶל אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le possessif de première personne du pluriel est conservé. En français, « prier notre Dieu » exprime naturellement la direction marquée par אֶל sans qu’il soit nécessaire d’ajouter « à ».
- source_word: וַנַּעֲמִיד
  choice: posté
  rationale: Le hiphil de עמד désigne ici l’action de mettre en place. Avec « une garde », « poster » est le verbe militaire idiomatique en français.
- source_word: מִשְׁמָר
  choice: une garde
  rationale: מִשְׁמָר peut désigner une garde ou une surveillance. « Une garde » convient au sens collectif et au contexte défensif.
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: Dans ce contexte d’hostilité, עַל indique que la garde est dirigée contre la menace qu’ils représentent, plutôt qu’une surveillance exercée sur eux.
- source_word: יוֹמָם וָלַיְלָה
  choice: jour et nuit
  rationale: Cette expression naturelle conserve le mérisme hébreu et l’idée de vigilance continue.
- source_word: מִפְּנֵיהֶם
  choice: à cause d’eux
  rationale: Littéralement « de devant eux », l’expression indique ici le motif de la garde. « À cause d’eux » conserve la valeur causale sans introduire explicitement la peur.
theological_decisions:
- issue: La réponse à l’opposition
  choice: La prière et la défense concrète sont présentées comme deux actions coordonnées, sans privilégier l’une au détriment de l’autre.
  alternative: Mettre exclusivement l’accent soit sur la prière, soit sur les préparatifs défensifs.
  rationale: L’hébreu coordonne la prière adressée à Dieu et la mise en place d’une garde. La traduction préserve cette tension entre confiance en Dieu et action pratique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient à une narration accessible. « Posté une garde » maintient la couleur défensive et « jour et nuit » conserve la concision de l’hébreu.
