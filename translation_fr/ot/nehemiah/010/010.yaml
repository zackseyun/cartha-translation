  text: וְֽ/הַ/לְוִיִּ֑ם וְ/יֵשׁ֨וּעַ֙ בֶּן אֲזַנְיָ֔ה בִּנּ֕וּי מִ/בְּנֵ֥י חֵנָדָ֖ד קַדְמִיאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: fr
  text: 'et les Lévites : Josué, fils d’Azania, Binnouï, des descendants de Hénadad[a], Kadmiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils de Hénadad ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: et les Lévites
  rationale: La conjonction relie cette catégorie à la liste précédente. Le nom défini pluriel introduit les signataires lévites, sans qu’il soit nécessaire d’ajouter un verbe absent de l’hébreu.
- source_word: וְיֵשׁוּעַ
  choice: Josué
  rationale: Le nom יֵשׁוּעַ est rendu par sa forme française biblique courante. La conjonction préfixée n’est pas répétée après les deux-points, puisque la liste française n’en a pas besoin.
- source_word: בֶּן אֲזַנְיָה
  choice: fils d’Azania
  rationale: La construction généalogique est traduite directement et naturellement en français.
- source_word: בִּנּוּי
  choice: Binnouï
  rationale: Translittération adaptée aux conventions graphiques françaises afin de représenter clairement la prononciation du nom hébreu.
- source_word: מִבְּנֵי חֵנָדָד
  choice: des descendants de Hénadad
  rationale: Dans ce contexte de clan, בְּנֵי désigne les membres ou descendants de la lignée de Hénadad. « Descendants » exprime ce sens naturellement, tandis que la formulation littérale est signalée en note.
- source_word: קַדְמִיאֵל
  choice: Kadmiel
  rationale: Translittération française claire et proche de la forme hébraïque.
theological_decisions: []
