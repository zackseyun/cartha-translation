  register: Style de liste sobre et digne, avec les formes françaises usuelles ou transparentes des noms propres. Aucun verbe n’est ajouté, conformément à la syntaxe nominale de l’hébreu. La ponctuation indique clairement que les noms suivants appartiennent à la catégorie des Lévites.
