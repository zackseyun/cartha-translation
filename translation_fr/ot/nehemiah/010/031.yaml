  text: וַ/אֲשֶׁ֛ר לֹא נִתֵּ֥ן בְּנֹתֵ֖י/נוּ לְ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם לֹ֥א נִקַּ֖ח לְ/בָנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: fr
  text: et que nous ne donnerons pas nos filles aux peuples du pays, ni ne prendrons[a] leurs filles pour nos fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « prendre » signifie prendre en mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: et que
  rationale: Dans le contexte du renouvellement de l’alliance, cette expression introduit une nouvelle obligation dépendant de l’engagement formulé auparavant.
- source_word: לֹא נִתֵּן
  choice: nous ne donnerons pas
  rationale: L’imparfait hébreu exprime ici un engagement collectif pour l’avenir.
- source_word: לְעַמֵּי הָאָרֶץ
  choice: aux peuples du pays
  rationale: Le pluriel עַמֵּי est conservé, sans préciser davantage l’identité ou la religion de ces groupes.
- source_word: לֹא נִקַּח
  choice: ne prendrons pas
  rationale: Le verbe garde son sens lexical de « prendre »; dans ce contexte réciproque, il s’agit de prendre une femme en mariage.
- source_word: לְבָנֵינוּ
  choice: pour nos fils
  rationale: La formulation traduit précisément le masculin pluriel hébreu et maintient le parallélisme avec « nos filles ».
theological_decisions:
- issue: Formuler l’interdiction des mariages sans introduire une interprétation ethnique, raciale ou religieuse absente du verset
  choice: les peuples du pays
  alternative: les peuples païens du pays; les étrangers du pays; les habitants du pays
  rationale: La traduction conserve le pluriel et la formulation sociogéographique du texte, sans ajouter « païens » ou « étrangers », ni réduire le pluriel à un collectif singulier.
translation_notes:
  register: Français moderne, digne et naturel. La structure d’engagement est maintenue par « et que »; le parallélisme entre donner les filles et prendre les filles est conservé. Un seul appel de note est placé après la proposition concernée.
