source:
  edition: WLC
  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: fr
  text: Nous apporterons aux prêtres, dans les chambres[b] du temple de notre Dieu, les prémices de notre pâte[a], nos contributions, le fruit de tout arbre, le vin nouveau et l’huile. Nous apporterons aussi aux Lévites la dîme tirée de nos terres, car ce sont les Lévites qui prélèvent la dîme dans toutes les villes où nous travaillons[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la première part de notre pâte ». Le terme hébreu désigne la pâte ou la masse pétrie dont une part était consacrée.
    reason: lexical_alternative
  - marker: b
    text: Ou « les réserves ». Le mot hébreu désigne des pièces du complexe du temple, souvent utilisées pour entreposer des biens.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « dans toutes les villes de notre travail » ou « de notre service ». L’expression hébraïque est condensée et peut désigner les villes liées aux activités agricoles du peuple.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: les prémices de notre pâte
  rationale: רֵאשִׁית désigne la première part, et עֲרִיסָה la pâte ou masse pétrie. « Les prémices de notre pâte » conserve le caractère concret et cultuel de l’expression.
- source_word: תְּרוּמֹתֵינוּ
  choice: nos contributions
  rationale: תְּרוּמָה désigne un don prélevé et consacré. « Contributions » est clair en français moderne sans introduire un terme rituel archaïque.
- source_word: פְּרִי כָל עֵץ
  choice: le fruit de tout arbre
  rationale: Rendu formel qui conserve la valeur distributive de כָל.
- source_word: תִּירוֹשׁ
  choice: le vin nouveau
  rationale: תִּירוֹשׁ désigne couramment le vin nouvellement produit dans les listes de produits agricoles.
- source_word: יִצְהָר
  choice: l’huile
  rationale: Dans ce contexte agricole, le terme désigne l’huile, normalement l’huile d’olive, sans que le type d’huile soit explicitement précisé.
- source_word: נָבִיא
  choice: nous apporterons
  rationale: Le hiphil de בוא à la première personne du pluriel exprime ici l’engagement collectif pris dans le cadre de l’alliance.
- source_word: לִשְׁכוֹת
  choice: les salles
  rationale: לִשְׁכּוֹת désigne les pièces du complexe du temple. « Salles » préserve le sens architectural sans limiter explicitement leur fonction au stockage.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: la dîme tirée de nos terres
  rationale: La formulation française explicite naturellement que la dîme provient du produit des terres tout en restant proche de la relation exprimée en hébreu.
- source_word: הַמְעַשְּׂרִים
  choice: qui prélèvent la dîme
  rationale: Le participe désigne ici l’action de recevoir ou collecter la dîme. « Prélever » convient à cette fonction administrative et fait écho aux produits tirés des terres.
- source_word: בְּכָל עָרֵי עֲבֹדָתֵנוּ
  choice: dans toutes les villes où nous travaillons
  rationale: עֲבֹדָה peut désigner le travail, le service ou l’activité. Le rendu reste naturel et conserve l’idée générale de travail sans imposer explicitement une interprétation exclusivement agricole.
theological_decisions:
- issue: Rôle des Lévites dans la perception de la dîme
  choice: car ce sont les Lévites qui prélèvent la dîme
  alternative: et les Lévites reçoivent la dîme
  rationale: La construction hébraïque met les Lévites en relief et le participe הַמְעַשְּׂרִים décrit leur activité. Le rendu conserve cette emphase sans développer davantage leur statut cultuel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en deux phrases pour rendre claire la destination distincte des dons remis aux prêtres et de la dîme remise aux Lévites, sans modifier leur relation dans le texte hébreu. Les termes cultuels courants « prémices » et « dîme » sont conservés.
