source:
  edition: WLC
  text: וְ/עַמֵּ֣י הָ/אָ֡רֶץ הַֽ/מְבִיאִים֩ אֶת הַ/מַּקָּח֨וֹת וְ/כָל שֶׁ֜בֶר בְּ/י֤וֹם הַ/שַּׁבָּת֙ לִ/מְכּ֔וֹר לֹא נִקַּ֥ח מֵ/הֶ֛ם בַּ/שַּׁבָּ֖ת וּ/בְ/י֣וֹם קֹ֑דֶשׁ וְ/נִטֹּ֛שׁ אֶת הַ/שָּׁנָ֥ה הַ/שְּׁבִיעִ֖ית וּ/מַשָּׁ֥א כָל יָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: fr
  text: Quant aux peuples du pays qui apportent, le jour du sabbat, des marchandises et toutes sortes de céréales pour les vendre, nous ne leur achèterons rien le jour du sabbat ni un jour consacré. Nous laisserons la terre en repos la septième année et renoncerons à toute créance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à toute dette » ou « à toute exigence »; l’expression hébraïque signifie littéralement « la charge de toute main ».
    reason: L’expression מַשָּׁא כָל יָד est rare et condensée; son sens exact est débattu, même si le contexte favorise la remise des créances.
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: les peuples du pays
  rationale: Conserve le pluriel hébreu et désigne naturellement les populations environnantes ou non judéennes, sans les réduire à un collectif singulier.
- source_word: הַמַּקָּחוֹת
  choice: des marchandises
  rationale: Rend clairement le sens commercial général du nom hébreu dans un français actuel.
- source_word: כָל שֶׁבֶר
  choice: toutes sortes de céréales
  rationale: Dans ce contexte de vente, שֶׁבֶר désigne vraisemblablement les grains ou céréales; la tournure française rend la portée de כָל sans suggérer que chaque grain individuel est visé.
- source_word: לֹא נִקַּח מֵהֶם
  choice: nous ne leur achèterons rien
  rationale: Le sens général de לקח est « prendre », mais la mention explicite de biens apportés pour être vendus impose ici le sens commercial « acheter ».
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: ni un jour consacré
  rationale: Après une négation, « ni » exprime naturellement l’extension de l’interdiction. « Consacré » traduit la qualité sacrée du jour sans identifier une fête particulière.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: Nous laisserons la terre en repos la septième année
  rationale: Le texte dit littéralement « nous laisserons la septième année »; dans le contexte de la législation sabbatique, l’objet agricole est elliptique. La formulation française explicite minimalement cette ellipse et reste naturelle.
- source_word: מַשָּׁא כָל יָד
  choice: toute créance
  rationale: Cette expression condensée et difficile évoque vraisemblablement toute exigence financière ou dette réclamée par un créancier. « Créance » préserve mieux que « dette » le point de vue de celui qui renonce à réclamer, tandis qu’une note maintient l’incertitude lexicale.
theological_decisions:
- issue: Portée de l’obligation liée à la septième année
  choice: Repos de la terre et renonciation aux créances
  alternative: « laisser la septième année et la charge de toute main »
  rationale: La formulation fait écho aux lois sabbatiques concernant à la fois le repos agricole et la remise des obligations financières. Le texte principal exprime ce sens probable sans développer davantage les prescriptions légales.
- issue: Sens de מַשָּׁא כָל יָד
  choice: toute créance
  alternative: toute dette, toute exigence, ou littéralement « la charge de toute main »
  rationale: L’idiome hébreu demeure obscur. Le choix principal communique son probable sens juridico-économique, tandis que la note conserve les autres possibilités et évite de supprimer une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe contractuelle au futur est maintenue. Les répétitions de « jour du sabbat » reflètent l’insistance du texte, tandis que « jour consacré » évite un vocabulaire confessionnel spécialisé.
