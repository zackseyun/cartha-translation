id: NEH.10.1
reference: Nehemiah 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: fr
  text: À cause de tout cela[a], nous prenons un engagement ferme et le mettons par écrit. Sur le document scellé[b] figurent nos responsables, nos lévites et nos prêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Dans tout cela, nous concluons un engagement ferme et le mettons par écrit. » L’hébreu emploie littéralement le verbe « couper », expression traditionnelle utilisée pour conclure une alliance ou un engagement solennel.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur ce qui est scellé ». Il s’agit vraisemblablement du document écrit et officiellement scellé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: À cause de tout cela
  rationale: Dans ce contexte, la préposition בְּ renvoie à l’ensemble de la confession et des faits précédents avec une valeur vraisemblablement causale. Cette formulation française garde ce renvoi tout en restant naturelle.
- source_word: כֹּרְתִים אֲמָנָה
  choice: nous prenons un engagement ferme
  rationale: כרת, littéralement « couper », est employé dans l’idiome de conclusion d’une alliance ou d’un engagement. אֲמָנָה désigne ici un engagement ferme et digne de confiance. « Prendre un engagement ferme » rend naturellement l’expression sans effacer sa portée solennelle.
- source_word: וְכֹתְבִים
  choice: et le mettons par écrit
  rationale: Le participe coordonné indique que l’engagement est consigné par écrit. Le pronom explicite en français reprend naturellement « engagement ».
- source_word: וְעַל הֶחָתוּם
  choice: Sur le document scellé
  rationale: L’expression substantivée désigne vraisemblablement l’écrit officiellement scellé. « Document » explicite sobrement le support sous-entendu, tandis que « scellé » conserve la formalité juridique.
- source_word: שָׂרֵינוּ
  choice: nos responsables
  rationale: שָׂרִים désigne des dirigeants ou dignitaires reconnus. « Responsables » convient au contexte administratif postexilique sans suggérer nécessairement des princes de sang royal.
- source_word: לְוִיֵּנוּ
  choice: nos lévites
  rationale: Terme français traditionnel et précis pour ce groupe cultuel.
- source_word: כֹּהֲנֵינוּ
  choice: nos prêtres
  rationale: Équivalent français direct du terme désignant les membres du sacerdoce.
theological_decisions:
- issue: Nature de l’אֲמָנָה
  choice: engagement ferme
  alternative: alliance sûre / déclaration solennelle
  rationale: Le nom souligne la fermeté et la fiabilité de l’acte sans être le terme hébreu habituel pour « alliance » (בְּרִית). La traduction évite donc de l’assimiler sans réserve à une alliance tout en gardant son caractère contraignant.
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve le caractère collectif, solennel et administratif de l’engagement. « Figurer » rend l’ellipse hébraïque sans ajouter explicitement « les noms » ou « les sceaux », que le texte ne formule pas.
