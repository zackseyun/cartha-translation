  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: fr
  text: Nous apporterons aussi les premiers-nés de nos fils et de notre bétail[a], comme il est écrit dans la Loi, ainsi que les premiers-nés de nos bovins et de notre petit bétail[b], à la maison de notre Dieu, aux prêtres qui assurent le service dans la maison de notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire conformément aux prescriptions de la Torah concernant les premiers-nés des humains et des animaux.
    reason: cross_reference
  - marker: b
    text: L’expression hébraïque désigne plus précisément les premiers-nés des bovins ainsi que ceux des ovins et des caprins.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: les premiers-nés de nos fils
  rationale: « Premiers-nés » rend le pluriel hébreu, tandis que « de nos fils » conserve la relation génitivale sans préciser dans le texte principal les dispositions de rachat prévues par la Torah.
- source_word: וּבְהֶמְתֵּינוּ
  choice: et de notre bétail
  rationale: בְּהֵמָה désigne ici collectivement les animaux domestiques; « bétail » est naturel et suffisamment large.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: comme il est écrit dans la Loi
  rationale: Cette formule renvoie aux prescriptions écrites de la Torah; la majuscule signale qu’il s’agit de cet ensemble déterminé plutôt que de la loi en général.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: les premiers-nés de nos bovins et de notre petit bétail
  rationale: בָּקָר désigne surtout les bovins, tandis que צֹאן englobe les ovins et les caprins. « Petit bétail » conserve cette portée sans la réduire aux seuls moutons.
- source_word: לְהָבִיא
  choice: nous apporterons
  rationale: L’infinitif poursuit la liste des engagements du contexte. Une forme verbale explicite donne en français une phrase autonome et naturelle tout en conservant la valeur d’engagement.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: à la maison de notre Dieu
  rationale: La traduction garde l’expression concrète de l’hébreu plutôt que de l’interpréter directement par « temple ».
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: aux prêtres qui assurent le service
  rationale: Le participe décrit leur fonction continue. « Assurer le service » reste clair et convient au contexte cultuel.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: dans la maison de notre Dieu
  rationale: La répétition de l’expression est conservée, comme dans l’hébreu, afin de maintenir son insistance.
theological_decisions:
- issue: Traduire בֵּית אֱלֹהֵינוּ littéralement ou expliciter son référent
  choice: la maison de notre Dieu
  alternative: le temple de notre Dieu
  rationale: Bien que le temple soit le référent, l’hébreu dit « maison de notre Dieu ». La formulation retenue préserve l’image et évite une explicitation inutile.
- issue: Expliciter le traitement rituel distinct des premiers-nés humains et animaux
  choice: conserver simplement « premiers-nés » dans le texte principal
  alternative: ajouter que les fils doivent être rachetés et que certains animaux doivent être offerts
  rationale: Le verset renvoie à la Loi sans détailler ici les modalités différentes. Les ajouter au texte principal résoudrait au-delà de ce que dit le passage.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de liste est rendue par « aussi » et « ainsi que ». La répétition de « la maison de notre Dieu » est volontairement maintenue pour refléter l’insistance du texte hébreu.
