source:
  edition: WLC
  text: מַחֲזִיקִ֣ים עַל אֲחֵי/הֶם֮ אַדִּירֵי/הֶם֒ וּ/בָאִ֞ים בְּ/אָלָ֣ה וּ/בִ/שְׁבוּעָ֗ה לָ/לֶ֨כֶת֙ בְּ/תוֹרַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר נִתְּנָ֔ה בְּ/יַ֖ד מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֑ים וְ/לִ/שְׁמ֣וֹר וְ/לַ/עֲשׂ֗וֹת אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֲדֹנֵ֔י/נוּ וּ/מִשְׁפָּטָ֖י/ו וְ/חֻקָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: fr
  text: Ils se joignent à leurs frères, à leurs notables, et s’engagent, sous peine de malédiction et par serment[b], à suivre la loi de Dieu, donnée par la main de Moïse[c], serviteur de Dieu, et à observer et à mettre en pratique tous les commandements de Yahweh, notre Seigneur, ainsi que ses règles et ses prescriptions[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'La « malédiction » et le « serment » forment un engagement solennel : ceux qui jurent acceptent les sanctions de l’alliance s’ils ne tiennent pas leur parole.'
    reason: cultural_note
  - marker: c
    text: 'Ou « donnée par l’intermédiaire de Moïse ». Littéralement : « donnée par la main de Moïse ».'
    reason: lexical_alternative
  - marker: d
    text: « Règles » peut aussi se traduire par « ordonnances » ou « décisions de justice », et « prescriptions » par « décrets » ou « statuts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: se joignent à
  rationale: Dans ce contexte d’alliance, l’expression évoque le fait de s’attacher fermement à d’autres et de faire cause commune avec eux, plutôt qu’un simple soutien matériel.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le terme hébreu masculin de parenté est conservé; dans le contexte, il désigne les autres membres israélites de la communauté.
- source_word: אַדִּירֵיהֶם
  choice: les notables parmi eux
  rationale: Le mot désigne ici les membres éminents et influents de la communauté. Cette formulation rend le statut social tout en clarifiant l’apposition.
- source_word: בְּאָלָה וּבִשְׁבוּעָה
  choice: par une malédiction et un serment
  rationale: 'Les deux éléments de l’engagement d’alliance sont maintenus: un serment solennel et l’acceptation de la malédiction encourue en cas de violation.'
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: à suivre la loi de Dieu
  rationale: «Suivre» exprime naturellement en français la conduite conforme à la Torah; «loi» convient au cadre juridique et allianciel du passage.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: donnée par la main de Moïse
  rationale: La formulation conserve l’image hébraïque de la «main» tout en indiquant que Moïse est le médiateur par lequel la loi a été transmise.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: serviteur de Dieu
  rationale: Pour Moïse, עֶבֶד constitue ici un titre honorifique; «serviteur» est donc plus juste et idiomatique que «esclave».
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: à observer et mettre en pratique
  rationale: Deux verbes sont conservés afin de rendre l’insistance de la formule d’alliance sur la fidélité attentive et l’accomplissement concret.
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  choice: ses règles et ses prescriptions
  rationale: Ces termes distinguent deux catégories d’exigences juridiques sans leur imposer une différenciation théologique plus précise que ne le permet le contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. «Yahweh» conserve le nom personnel du Dieu d’Israël au lieu de lui substituer un titre.
- issue: Portée du terme masculin אֲחֵיהֶם
  choice: leurs frères
  alternative: leurs proches; les autres Israélites
  rationale: Le masculin pluriel du texte est maintenu sans exclure par interprétation l’ensemble plus large de la communauté concernée.
- issue: Valeur de עֶבֶד appliqué à Moïse
  choice: serviteur de Dieu
  alternative: esclave de Dieu
  rationale: Dans cette désignation traditionnelle de Moïse, le mot fonctionne comme un titre honorifique de service et d’appartenance à Dieu.
- issue: Nature de la malédiction et du serment
  choice: un engagement d’alliance assorti d’une malédiction
  alternative: deux actes entièrement indépendants
  rationale: Le rapprochement des deux termes indique un serment par lequel les participants acceptent les sanctions de l’alliance en cas de désobéissance, sans préciser davantage la forme du rite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe ample reflète la déclaration solennelle d’alliance. Les termes juridiques restent distincts sans devenir techniques, et l’image hébraïque «par la main de Moïse» est conservée puis explicitée en note.
