revisions:
- from: Ils se joignent à leurs frères[a], les notables parmi eux, et se lient par une malédiction et un serment[b] à suivre la loi de Dieu, donnée par la main de Moïse[c], serviteur de Dieu, et à observer et mettre en pratique tous les commandements de Yahweh, notre Seigneur, ainsi que ses règles et ses prescriptions[d].
  to: Ils se joignent à leurs frères, à leurs notables, et s’engagent, sous peine de malédiction et par serment[b], à suivre la loi de Dieu, donnée par la main de Moïse[c], serviteur de Dieu, et à observer et à mettre en pratique tous les commandements de Yahweh, notre Seigneur, ainsi que ses règles et ses prescriptions[d].
  rationale: La révision enlève l'explicitation non marquée « parmi eux » et remplace une construction française raide par une formulation naturelle qui conserve le caractère auto-sanctionné du serment. La note a est supprimée, car la formulation révisée ne porte plus son ancre et l'alternative proposée reposait elle aussi sur une analyse trop déterminée du groupe des notables. Les autres notes restent ancrées et pertinentes.
