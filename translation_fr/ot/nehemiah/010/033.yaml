  text: וְ/הֶעֱמַ֤דְנוּ עָלֵ֨י/נוּ֙ מִצְוֺ֔ת לָ/תֵ֥ת עָלֵ֛י/נוּ שְׁלִשִׁ֥ית הַ/שֶּׁ֖קֶל בַּ/שָּׁנָ֑ה לַ/עֲבֹדַ֖ת בֵּ֥ית אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: fr
  text: Nous nous sommes aussi imposé l’obligation de donner chaque année un tiers de sicle pour le service de la maison de notre Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Nous avons aussi établi pour nous des prescriptions : donner chaque année un tiers de sicle. »'
    reason: La forme plurielle מִצְוֺת peut être comprise collectivement comme une obligation précise ou plus littéralement comme des prescriptions.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ עָלֵינוּ
  choice: Nous nous sommes aussi imposé
  rationale: Le hifil de עמד avec עַל exprime ici le fait d’établir une exigence contraignante pour soi-même. Cette formulation française rend naturellement le caractère volontaire et obligatoire de l’engagement communautaire; « aussi » représente la conjonction dans le contexte.
- source_word: מִצְוֺת
  choice: l’obligation
  rationale: Bien que la forme soit plurielle, le nom peut avoir ici une valeur collective ou abstraite et introduit une exigence précise, explicitée par l’infinitif suivant. « L’obligation » est plus naturel en français que « le commandement » dans la construction « s’imposer… de donner », sans affaiblir sa force contraignante.
- source_word: לָתֵת
  choice: de donner
  rationale: Le verbe נתן signifie directement « donner ». Ce choix évite de préciser indûment qu’il s’agirait d’un paiement.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: un tiers de sicle
  rationale: La construction désigne une fraction de l’unité de poids et de monnaie appelée sicle. Cette formulation est exacte et idiomatique en français biblique moderne.
- source_word: בַּשָּׁנָה
  choice: chaque année
  rationale: L’expression indique la périodicité annuelle. « Chaque année » est clair et naturel en français courant.
- source_word: לַעֲבֹדַת
  choice: pour le service
  rationale: Dans le contexte du sanctuaire, עֲבֹדָה désigne le service ou les activités nécessaires au culte. « Service » conserve cette portée sans la réduire au seul entretien matériel.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: la maison de notre Dieu
  rationale: La traduction garde l’expression concrète de l’hébreu et sa tonalité communautaire. « Temple » serait explicatif, mais moins proche de la forme source.
theological_decisions:
- issue: Nature de l’engagement exprimé par מִצְוֺת
  choice: une obligation que la communauté s’impose
  alternative: des prescriptions / un commandement que la communauté établit pour elle-même
  rationale: Le texte présente la communauté comme se liant elle-même à une contribution annuelle déterminée. « Obligation » préserve la force contraignante sans suggérer explicitement que cette mesure particulière est formulée ici comme un commandement divin direct.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure pronominale « nous nous sommes imposé » rend sans lourdeur la répétition hébraïque de עָלֵינוּ; « sicle » conserve l’unité ancienne plutôt que de proposer une équivalence monétaire trompeuse.
