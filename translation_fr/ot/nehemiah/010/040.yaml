source:
  edition: WLC
  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: fr
  text: Car les Israélites et les Lévites[a] apporteront dans les salles la contribution de céréales, de vin nouveau et d’huile. Là se trouvent les ustensiles du sanctuaire, ainsi que les prêtres qui assurent le service, les gardiens des portes et les chanteurs. Et nous ne négligerons pas la maison de notre Dieu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël et les fils de Lévi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous n’abandonnerons pas la maison de notre Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: les salles
  rationale: Le terme désigne les pièces annexes du temple, notamment utilisées pour entreposer les offrandes. « Salles » conserve le sens architectural sans réduire leur fonction à celle de magasins.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: les Israélites et les Lévites
  rationale: Cette formulation idiomatique en français rend naturellement les expressions hébraïques « fils d’Israël » et « fils de Lévi »; la forme littérale est signalée en note afin de préserver le parallélisme de l’original.
- source_word: תְּרוּמַת
  choice: la contribution
  rationale: Le mot désigne ce qui est prélevé et consacré à un usage sacré. « Contribution » reste clair et convient aux produits agricoles énumérés.
- source_word: הַדָּגָן
  choice: blé
  rationale: Dans ce contexte agricole, דָּגָן désigne les céréales ou le grain. « Blé » est naturel en français biblique courant, tout en représentant ici la production céréalière.
- source_word: הַתִּירוֹשׁ
  choice: vin nouveau
  rationale: Le terme renvoie au vin issu de la récolte récente; « vin nouveau » conserve cette nuance agricole.
- source_word: הַיִּצְהָר
  choice: huile
  rationale: Dans la triade céréales-vin-huile, il s’agit de l’huile d’olive. Le contexte permet la formulation concise « huile ».
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: les ustensiles du sanctuaire
  rationale: כְּלִי désigne ici les objets et instruments employés dans le culte. « Ustensiles » est plus immédiatement compréhensible en français moderne que « vases ».
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: les prêtres qui assurent le service
  rationale: Le participe exprime l’exercice actif du service sacerdotal; cette formulation est naturelle et garde sa valeur fonctionnelle.
- source_word: הַשּׁוֹעֲרִים
  choice: les gardiens des portes
  rationale: Le terme désigne les membres du personnel du temple chargés des accès; cette expression est claire et précise.
- source_word: לֹא נַעֲזֹב
  choice: nous ne négligerons pas
  rationale: Dans le contexte de l’entretien matériel et cultuel du temple, le verbe signifie ne pas délaisser ses responsabilités envers la maison de Dieu. « Négliger » exprime directement cette portée pratique.
theological_decisions:
- issue: Désignation des groupes de l’alliance
  choice: les Israélites et les Lévites
  alternative: les fils d’Israël et les fils de Lévi
  rationale: La formulation idiomatique évite de faire entendre qu’il s’agit uniquement de descendants masculins immédiats, sans effacer la forme hébraïque, donnée en note.
- issue: Portée de l’engagement envers la maison de Dieu
  choice: nous ne négligerons pas la maison de notre Dieu
  alternative: nous n’abandonnerons pas la maison de notre Dieu
  rationale: Le contexte porte sur le soutien concret du culte et de ses responsables. « Négliger » rend cette obligation sans exclure la nuance plus forte de délaissement, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe a été répartie en trois phrases pour rendre clairement la longue coordination hébraïque, tout en conservant le « Car » initial et le « Et » du dernier engagement.
