  text: And on the sealed document were Nehemiah the governor[a], son of Hacaliah[b], and Zedekiah.
translation:
  language: fr
  text: Parmi ceux qui avaient apposé leur sceau[a] se trouvaient Néhémie, le gouverneur[b], fils de Hacalia, et Sédécias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « les scellés ». L’expression hébraïque, difficile, peut désigner ceux qui avaient apposé leur sceau ou, dans le contexte, l’acte scellé sur lequel leurs noms figuraient.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « le Tirshatha », titre administratif de l’époque perse, traditionnellement transcrit plutôt que traduit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Sur
  rationale: La préposition introduit ici la liste des personnes dont les noms figuraient sur l’acte d’alliance scellé. En français, « Sur » exprime naturellement ce rapport au document.
- source_word: הַחֲתוּמִים
  choice: le document scellé
  rationale: La forme hébraïque est un participe passif masculin pluriel, littéralement « les scellés ». Dans ce contexte administratif, elle désigne vraisemblablement le document muni de sceaux ou, par métonymie, les personnes associées à ces sceaux. « Le document scellé » donne un sens naturel en français sans employer le terme plus interprétatif « signataires ».
- source_word: נְחֶמְיָה
  choice: Néhémie
  rationale: Transcription française biblique usuelle du nom propre.
- source_word: הַתִּרְשָׁתָא
  choice: le gouverneur
  rationale: Il s’agit d’un titre administratif de l’époque perse. « Gouverneur » en communique clairement la fonction au lecteur moderne, tandis que la forme traditionnelle est conservée en note.
- source_word: בֶּן
  choice: fils de
  rationale: Équivalent français direct de la formule généalogique hébraïque.
- source_word: חֲכַלְיָה
  choice: Hakalya
  rationale: Transcription française claire du nom hébreu, conforme aux conventions modernes de translittération biblique.
- source_word: וְצִדְקִיָּה
  choice: et Sédécias
  rationale: La conjonction relie le second nom à Néhémie; « Sédécias » est la forme française biblique usuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « figuraient » rend explicite, sans lourdeur, que les noms suivants se trouvaient sur l’acte scellé. Les notes préservent l’ambiguïté grammaticale de הַחֲתוּמִים et la forme historique du titre הַתִּרְשָׁתָא.
