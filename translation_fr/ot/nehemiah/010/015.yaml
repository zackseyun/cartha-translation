  text: 'the heads of the people: Parosh[a], Pahath-moab, Elam, Zattu, Bani.'
translation:
  language: fr
  text: 'les chefs du peuple[a] : Parosh, Pahath-Moab, Élam, Zattou, Bani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les têtes du peuple » ; on peut aussi traduire : « les dirigeants du peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: les chefs de
  rationale: Le pluriel construit de רֹאשׁ désigne idiomatiquement des personnes occupant une position dirigeante. « Les chefs de » est naturel en français tout en restant proche de la métaphore hébraïque de la tête.
- source_word: הָעָם
  choice: du peuple
  rationale: עַם désigne ici la communauté représentée dans la liste de l’alliance ; « le peuple » est le rendu français courant et adapté au contexte.
- source_word: פַּרְעֹשׁ
  choice: Parosh
  rationale: Nom propre personnel ou familial, translittéré sans le traduire.
- source_word: פַּחַת מוֹאָב
  choice: Pahath-Moab
  rationale: Nom propre composé, translittéré avec un trait d’union afin d’en rendre visible la structure.
- source_word: עֵילָם
  choice: Élam
  rationale: Dans cette liste, le terme est compris comme un nom personnel ou familial plutôt que comme celui d’une région ; la graphie française usuelle est retenue.
- source_word: זַתּוּא
  choice: Zattou
  rationale: Translittération adaptée aux conventions phonographiques du français moderne.
- source_word: בָּנִי
  choice: Bani
  rationale: La forme consonantique et vocalisée du verset soutient « Bani » ; elle est conservée sans harmonisation avec des noms proches rencontrés ailleurs.
