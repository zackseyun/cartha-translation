id: NEH.10.36
reference: Nehemiah 10:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: fr
  text: et à apporter chaque année à la maison de Yahweh[b] les prémices de notre terre et les prémices de tous les fruits de chaque arbre[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toutes sortes de fruits de chaque arbre ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le temple.
    reason: clarification
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: et à apporter
  rationale: La conjonction suivie de l’infinitif poursuit la liste des engagements de l’alliance; « apporter » convient naturellement à des offrandes conduites au sanctuaire.
- source_word: בִּכּוּרֵי
  choice: les prémices
  rationale: Ce terme désigne les premiers produits offerts à Dieu; « prémices » conserve sa portée agricole et cultuelle.
- source_word: אַדְמָתֵנוּ
  choice: notre terre
  rationale: אדמה désigne ici la terre cultivée dont proviennent les récoltes. « Notre terre » est naturel en français et évite le sens surtout matériel que pourrait suggérer « notre sol ».
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: et les prémices de tous les fruits de chaque arbre
  rationale: La formulation conserve l’enchaînement cumulatif de l’hébreu tout en restant intelligible en français.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: chaque année
  rationale: L’expression idiomatique marque une obligation annuelle répétée; « chaque année » la rend avec naturel.
- source_word: לְ/בֵית יְהוָה
  choice: à la maison de Yahweh
  rationale: « Maison » préserve l’image hébraïque du sanctuaire, tandis que « Yahweh » rend directement le nom divin יהוה.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel et son caractère d’alliance sans le remplacer par un titre.
- issue: Sens de בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: « Maison » traduit formellement בֵּית et conserve la métaphore du texte; une note précise qu’il s’agit du temple.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe place « chaque année » plus tôt que l’hébreu afin d’éviter une phrase pesante, sans modifier sa portée. « Prémices » est retenu comme terme cultuel courant.
