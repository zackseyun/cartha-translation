source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הָ/עָ֡ם הַ/כֹּהֲנִ֣ים הַ֠/לְוִיִּם הַ/שּׁוֹעֲרִ֨ים הַ/מְשֹׁרְרִ֜ים הַ/נְּתִינִ֗ים וְֽ/כָל הַ/נִּבְדָּ֞ל מֵ/עַמֵּ֤י הָ/אֲרָצוֹת֙ אֶל תּוֹרַ֣ת הָ/אֱלֹהִ֔ים נְשֵׁי/הֶ֖ם בְּנֵי/הֶ֣ם וּ/בְנֹתֵי/הֶ֑ם כֹּ֖ל יוֹדֵ֥עַ מֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: fr
  text: 'ainsi que le reste du peuple : les prêtres, les lévites, les gardiens des portes, les chanteurs, les serviteurs du Temple[a] et tous ceux qui s’étaient séparés des peuples des pays pour adhérer à la loi de Dieu, leurs épouses, leurs fils et leurs filles — tous ceux qui savaient et comprenaient[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Nethinim », translittération traditionnelle du nom donné à une catégorie de serviteurs du Temple.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici des formes masculines singulières ayant une valeur collective : littéralement, « quiconque s’était séparé… quiconque savait et comprenait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: ainsi que le reste du peuple
  rationale: שְׁאָר désigne ce qui reste; « peuple » convient à cette communauté d’alliance. « Ainsi que » relie naturellement ce fragment à la liste du contexte précédent.
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: les prêtres, les lévites, les gardiens des portes, les chanteurs
  rationale: Ces équivalents usuels rendent précisément les différentes catégories de personnel mentionnées. « Chanteurs » conserve le sens spécifique de la racine שׁיר.
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: Le terme désigne une classe affectée au service du sanctuaire. Une traduction explicite est plus intelligible que la translittération traditionnelle « Nethinim ».
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: et tous ceux qui s’étaient séparés des peuples des pays pour adhérer à la loi de Dieu
  rationale: Le participe singulier avec כָל a une valeur collective, naturellement rendue au pluriel en français. « Pour adhérer à » exprime la direction d’אֶל vers la Torah sans donner l’impression qu’ils se seraient séparés de la loi.
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: avec leurs épouses, leurs fils et leurs filles
  rationale: La traduction conserve les trois groupes explicitement nommés. « Avec » clarifie leur inclusion dans l’énumération sans effacer l’apposition hébraïque.
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: tous ceux qui avaient connaissance et discernement
  rationale: Cette formulation garde les deux notions coordonnées et leur portée collective, tout en indiquant une participation consciente et éclairée.
theological_decisions:
- issue: Portée du masculin singulier collectif dans הַנִּבְדָּל et יוֹדֵעַ מֵבִין
  choice: 'Employer des formulations collectives au pluriel : « tous ceux qui… »'
  alternative: 'Rendre littéralement chaque forme au masculin singulier : « quiconque s’était séparé… quiconque savait et comprenait »'
  rationale: Les formes hébraïques sont grammaticalement masculines et singulières, mais ont une force collective après כָל. Le français pluriel est naturel et n’exclut pas les épouses, fils et filles que le texte mentionne expressément.
- issue: Relation exprimée par אֶל תּוֹרַת הָאֱלֹהִים
  choice: « pour adhérer à la loi de Dieu »
  alternative: « vers la loi de Dieu » ou « pour la loi de Dieu »
  rationale: La traduction maintient l’idée d’orientation et de ralliement à la Torah, sans résoudre au-delà du texte les modalités religieuses ou sociales de cette séparation.
- issue: Sens de הַנְּתִינִים
  choice: « les serviteurs du Temple »
  alternative: « les Nethinim »
  rationale: Le titre fonctionnel rend la catégorie compréhensible sans lui attribuer un statut théologique plus précis que ne le fait le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation conserve le caractère inachevé du verset, dont la construction se poursuit au verset suivant. La majuscule à « Temple » identifie le sanctuaire de Jérusalem dans un usage éditorial français courant.
