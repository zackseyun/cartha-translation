- source_word: מְשֵׁיזַבְאֵל
  choice: Meshézabel
  rationale: Nom propre translittéré plutôt que traduit. « Meshézabel » rend la forme hébraïque de manière naturelle en français et correspond à l’usage biblique français courant.
- source_word: צָדוֹק
  choice: Sadoc
  rationale: Nom propre rendu selon sa forme française traditionnelle et immédiatement reconnaissable, plutôt que par une translittération plus technique comme « Tsadoq ».
- source_word: יַדּוּעַ
  choice: Yaddoua
  rationale: Nom propre translittéré en français. Le double « d » reflète le redoublement consonantique marqué dans l’hébreu, et « ou » rend naturellement la voyelle correspondante en français.
