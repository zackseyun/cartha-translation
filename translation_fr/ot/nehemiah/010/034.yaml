  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: fr
  text: pour le pain de présentation[a], pour l’offrande régulière de céréales[b] et pour l’holocauste régulier, pour les sabbats, les nouvelles lunes et les temps fixés[c], pour les choses saintes[d], pour les sacrifices pour le péché[e], afin de faire expiation pour Israël, et pour toute l’œuvre de la maison de notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pain disposé » ou « le pain mis en place ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’offrande continuelle de céréales » et « l’holocauste continuel ».
    reason: lexical_alternative
  - marker: c
    text: Les « temps fixés » comprennent notamment les fêtes établies.
    reason: lexical_alternative
  - marker: d
    text: Ou « les offrandes saintes » ou « les choses consacrées ».
    reason: lexical_alternative
  - marker: e
    text: Dans certains contextes, l’expression rendue par « sacrifices pour le péché » peut aussi se comprendre comme « sacrifices de purification ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: le pain disposé
  rationale: L’expression désigne littéralement le pain de la disposition ou de la mise en ordre. « Le pain disposé » reste proche de l’hébreu tout en étant compréhensible, sans imposer un terme traditionnel moins transparent.
- source_word: מִנְחַת הַתָּמִיד
  choice: l’offrande régulière de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne une offrande de céréales, et תָּמִיד sa présentation régulière ou continuelle.
- source_word: עֹלַת הַתָּמִיד
  choice: l’holocauste régulier
  rationale: עֹלָה désigne l’offrande entièrement brûlée, traditionnellement appelée « holocauste » en français biblique; תָּמִיד indique son caractère régulier.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: les sabbats, les nouvelles lunes et les temps fixés
  rationale: La formulation conserve l’énumération des occasions cultuelles. « Temps fixés » garde la portée de מוֹעֲדִים, qui comprend les fêtes sans s’y limiter explicitement.
- source_word: וְלַקֳּדָשִׁים
  choice: pour les choses saintes
  rationale: Le pluriel reste général et peut viser des choses ou offrandes consacrées; la traduction ne réduit pas cette portée.
- source_word: וְלַחַטָּאוֹת
  choice: pour les sacrifices pour le péché
  rationale: Dans un inventaire cultuel, חַטָּאוֹת désigne naturellement les sacrifices pour le péché, tout en laissant signaler en note l’interprétation « sacrifices de purification ».
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: destinés à faire l’expiation pour Israël
  rationale: « Faire l’expiation » rend la force cultuelle de כפר sans préciser davantage le mécanisme théologique.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: pour tous les travaux de la maison de notre Dieu
  rationale: « Travaux » conserve le sens large de מְלָאכָה et ne limite pas l’expression au seul service liturgique.
theological_decisions:
- issue: Rendu de la terminologie sacrificielle sans surinterprétation
  choice: 'Conserver les catégories cultuelles établies : « offrande de céréales », « holocauste », « sacrifices pour le péché » et « faire l’expiation ».'
  alternative: Employer des formulations plus interprétatives comme « offrande de don », « offrande entièrement consumée » ou « sacrifices de purification ».
  rationale: Le verset énumère les besoins du temple et les obligations sacrificielles. Ces termes français reconnus préservent les catégories hébraïques sans leur ajouter une précision doctrinale étrangère au passage.
- issue: Portée de קֳּדָשִׁים
  choice: Traduire largement par « les choses saintes ».
  alternative: Préciser « les offrandes saintes » ou « les dons consacrés ».
  rationale: L’hébreu ne détermine pas assez précisément le référent pour autoriser une formulation plus étroite.
- issue: Lien syntaxique des sabbats, nouvelles lunes et temps fixés
  choice: Présenter ces éléments comme des occasions ou besoins distincts dans l’énumération, en répétant « pour ».
  alternative: Les rattacher directement à « l’holocauste régulier ».
  rationale: L’ellipse hébraïque permet une certaine tension syntaxique. La répétition de « pour » suit les prépositions du texte et évite de faire dépendre exclusivement toute la série de l’holocauste régulier.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset étant la suite syntaxique du précédent, il commence par « pour ». Les répétitions structurent clairement l’inventaire sans effacer les catégories cultuelles ni l’ambiguïté de certains termes.
