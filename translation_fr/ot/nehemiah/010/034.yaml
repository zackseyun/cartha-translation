  to: pour le pain de présentation[a], pour l’offrande régulière de céréales[b] et pour l’holocauste régulier, pour les sabbats, les nouvelles lunes et les temps fixés[c], pour les choses saintes[d], pour les sacrifices pour le péché[e], afin de faire expiation pour Israël, et pour toute l’œuvre de la maison de notre Dieu.
  rationale: La révision améliore deux formulations françaises sans modifier le sens ni résoudre les ambiguïtés du texte hébreu. « Pain de présentation » donne un équivalent cultuel français clair pour le pain de la disposition, tandis que « toute l’œuvre » maintient l’ampleur de מְלָאכָה. Le déplacement de « afin de faire expiation pour Israël » après l’ancre e clarifie son lien avec les sacrifices pour le péché et conserve la valeur finale de לְכַפֵּר.
