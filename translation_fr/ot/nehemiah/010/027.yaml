lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: Ahija
  rationale: Dans cette suite de noms, le préfixe וַ relie le premier nom aux éléments précédents. En français, cette coordination se rend naturellement par « et » devant le dernier élément de la série plutôt que mécaniquement devant Ahija. Le nom אֲחִיָּה est translittéré sous la forme française biblique usuelle « Ahija ».
- source_word: חָנָן
  choice: Hanan
  rationale: Nom propre translittéré directement selon une forme française claire et usuelle, sans en traduire le sens.
- source_word: עָנָן
  choice: Anan
  rationale: Nom propre translittéré « Anan », forme concise qui correspond aux consonnes hébraïques et se distingue naturellement de « Hanan ».
