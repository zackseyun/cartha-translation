base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: fr
  text: Le prêtre, un descendant d’Aaron, sera avec les lévites lorsque ceux-ci prélèveront la dîme. Les lévites apporteront la dîme de la dîme[a] à la maison de notre Dieu, dans les salles de l’entrepôt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un dixième de la dîme ». L’expression hébraïque signifie littéralement « la dîme de la dîme » et désigne la part que les lévites donnent sur la dîme qu’ils reçoivent.
    reason: lexical_alternative
  - marker: b
    text: Ou « du trésor ». Il s’agit vraisemblablement ici d’un lieu où l’on entreposait les dîmes et les offrandes, et non exclusivement d’une réserve d’argent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: Dans ce contexte d’engagement communautaire, la forme exprime une disposition à observer; le futur français conserve naturellement cette portée prospective.
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: le prêtre, un descendant d’Aaron
  rationale: Cette formulation garde l’article défini de « le prêtre » tout en rendant clairement l’appartenance à la lignée d’Aaron; « descendant » évite de faire croire qu’il s’agit nécessairement d’un fils immédiat.
- source_word: עִם
  choice: avec
  rationale: Le terme indique ici la présence du prêtre aux côtés des lévites pendant le prélèvement.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: lorsque ceux-ci prélèveront la dîme
  rationale: L’infinitif désigne l’action de prélever la dîme. La proposition temporelle est idiomatique en français, et « ceux-ci » évite une répétition lourde sans ambiguïté.
- source_word: יַעֲלוּ
  choice: apporteront
  rationale: Le hifil de עלה signifie littéralement « feront monter ». Dans ce contexte, il décrit l’acheminement vers le temple; « apporteront » est naturel en français tout en conservant le mouvement vers la destination.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: la dîme de la dîme
  rationale: La formulation technique et répétitive de l’hébreu est conservée. Elle désigne la part que les lévites prélèvent sur la dîme qu’ils ont eux-mêmes reçue.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: à la maison de notre Dieu
  rationale: La traduction garde l’expression cultuelle et relationnelle de l’hébreu sans la remplacer explicitement par « temple ».
- source_word: הַלְּשָׁכוֹת
  choice: les salles
  rationale: Le mot désigne des pièces du complexe du temple, ici affectées au stockage. « Salles » est plus courant en français moderne que « chambres » dans ce sens architectural.
- source_word: לְבֵית הָאוֹצָר
  choice: de l’entrepôt
  rationale: Le contexte porte sur le stockage de dîmes, notamment de produits agricoles. « Entrepôt » communique mieux cette fonction que « trésor », qui évoquerait surtout de l’argent ou des objets précieux.
theological_decisions:
- issue: Désignation du lieu de stockage du temple
  choice: entrepôt
  alternative: trésor
  rationale: Le passage concerne l’administration et le stockage des dîmes. « Entrepôt » reflète cette réalité matérielle sans réduire le lieu à une réserve monétaire.
- issue: Identification du prêtre comme « fils d’Aaron »
  choice: descendant d’Aaron
  alternative: fils d’Aaron
  rationale: L’expression marque ici l’appartenance à la lignée sacerdotale d’Aaron. « Descendant » transmet cette portée généalogique sans suggérer une filiation immédiate.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur maintient le ton normatif de l’engagement. La répétition technique « la dîme de la dîme » est volontairement conservée, tandis que la syntaxe entourant les lieux de stockage est rendue de façon naturelle.
