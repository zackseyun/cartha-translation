revisions:
- from: Nous avons tiré au sort au sujet de l’offrande de bois[a], nous, les prêtres, les lévites et le peuple, afin de l’apporter à la maison de notre Dieu, selon nos maisons ancestrales, à des dates fixées, d’année en année, pour faire brûler le bois sur l’autel de Yahweh notre Dieu, comme il est écrit dans la Loi.
  to: Nous, les prêtres, les lévites et le peuple, avons tiré au sort au sujet de l’offrande de bois[a], afin de l’apporter à la maison de notre Dieu selon nos familles, à des moments fixés, d’année en année, pour que le bois soit brûlé sur l’autel de Yahweh notre Dieu, comme il est écrit dans la Loi.
  rationale: La révision conserve l’ambiguïté de la préposition « au sujet de / pour » dans la note, précise naturellement la répartition « selon nos familles », rend les occasions prévues par « à des moments fixés » et évite d’attribuer explicitement une causation humaine à l’action de brûler.
