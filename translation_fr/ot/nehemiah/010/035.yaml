  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: fr
  text: Nous, les prêtres, les lévites et le peuple, avons tiré au sort au sujet de l’offrande de bois[a], afin de l’apporter à la maison de notre Dieu selon nos familles, à des moments fixés, d’année en année, pour que le bois soit brûlé sur l’autel de Yahweh notre Dieu, comme il est écrit dans la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’offrande de bois ». La préposition hébraïque peut indiquer soit le sujet sur lequel portait le tirage au sort, soit le but auquel il servait ; dans les deux cas, le tirage répartissait la responsabilité de fournir le bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: Nous avons tiré au sort
  rationale: L’expression causative avec נפל et גּוֹרָלוֹת est l’idiome hébreu usuel pour le tirage au sort. « Tirer au sort » est naturel en français moderne.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: au sujet de l’offrande de bois
  rationale: עַל introduit vraisemblablement ici l’objet de la décision prise par tirage au sort. La formulation indique que l’offrande consiste en bois destiné à l’autel, sans faire des lots eux-mêmes une offrande.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: nous, les prêtres, les lévites et le peuple
  rationale: Ces trois groupes explicitent le sujet à la première personne du pluriel. L’ajout de « nous » rend cette apposition claire et naturelle en français.
- source_word: לְהָבִיא לְבֵית אֱלֹהֵינוּ
  choice: afin de l’apporter à la maison de notre Dieu
  rationale: L’infinitif exprime le but du tirage au sort. Le pronom renvoie à l’offrande de bois, et « maison de notre Dieu » conserve l’expression hébraïque désignant le temple.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: selon nos maisons ancestrales
  rationale: L’expression désigne les unités familiales ou claniques chargées à tour de rôle de fournir le bois. « Maisons ancestrales » conserve l’image sociale hébraïque tout en restant compréhensible.
- source_word: לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה
  choice: à des dates fixées, d’année en année
  rationale: La traduction rend à la fois la programmation des occasions et leur récurrence annuelle.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: pour faire brûler le bois sur l’autel
  rationale: La formulation explicite l’objet implicite du verbe, le bois, et rend clairement sa fonction cultuelle sur l’autel sans ajouter l’idée plus interprétative d’un feu perpétuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte source.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: comme il est écrit dans la Loi
  rationale: Cette formule renvoie à une prescription de la Torah reconnue comme autorité; la majuscule indique ici ce corpus précis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » en préserve la fonction de nom propre sans lui substituer un titre.
- issue: Fonction du bois sur l’autel
  choice: pour faire brûler le bois sur l’autel
  alternative: pour entretenir le feu sur l’autel
  rationale: Le texte affirme que le bois doit brûler sur l’autel, mais ne précise pas explicitement ici qu’il s’agit d’entretenir un feu perpétuel. La traduction évite donc de résoudre cette nuance par ajout interprétatif.
translation_notes:
  register: Français international moderne, digne et lisible. La structure administrative du verset est conservée, avec une syntaxe légèrement réorganisée pour clarifier que les prêtres, les lévites et le peuple participent au tirage au sort.
