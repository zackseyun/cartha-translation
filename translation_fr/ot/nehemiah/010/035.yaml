review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle. Toutefois, « selon nos maisons ancestrales » est moins précis et moins idiomatique que « selon nos familles », qui rend ici les divisions familiales/claniques (littéralement, les maisons paternelles). « À des dates fixées » réduit des temps/occasions fixés à des dates calendaires. Enfin, « faire brûler le bois » introduit une causation plus explicite que le verbe hébreu; une tournure passive française rend mieux la finalité sans préciser l’agent.
  naturalness: Le français est globalement clair et d’un registre approprié. La révision allège toutefois l’apposition « nous, les prêtres... » et emploie des formulations plus naturelles dans ce contexte administratif et cultuel.
  terminology: « Offrande de bois », « Yahweh », « autel » et « Loi » conviennent. « Familles » communique clairement la valeur socio-familiale de « maisons paternelles » sans conserver un calque peu naturel.
  issues:
  - severity: medium
    issue: « selon nos maisons ancestrales »
    rationale: Cette expression est compréhensible, mais elle sonne peu naturelle et risque d’évoquer des bâtiments ou des lignées ancestrales abstraites. Le syntagme hébreu désigne les groupes familiaux/claniques servant de base à la répartition.
  - severity: low
    issue: « à des dates fixées »
    rationale: Le texte parle de temps ou d’occasions déterminés; « moments fixés » préserve cette portée sans la restreindre à des dates.
  - severity: low
    issue: « pour faire brûler le bois »
    rationale: Le texte exprime que le bois doit brûler/être brûlé sur l’autel, sans désigner explicitement un agent qui le ferait brûler. La voix passive évite cet ajout léger.
