  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: fr
  text: 'Voici les fils de Benjamin[a] : Sallou, fils de Meshoullam, fils de Yoëd[b], fils de Pedaya, fils de Qolaya, fils de Maaséya, fils d’Itiel, fils de Yeshaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « fils de Benjamin » peut aussi s’entendre au sens plus large de « descendants de Benjamin » ou de « Benjaminites ».
    reason: lexical_alternative
  - marker: b
    text: Le nom « Yoëd » suit ici le texte massorétique. Dans la généalogie parallèle de 1 Chroniques 9.7, on lit « Hodavia ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Cette formule introduit naturellement en français la nouvelle partie de la liste, sans imposer un temps verbal absent de la proposition nominale hébraïque.
- source_word: בְּנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: La traduction conserve l’expression généalogique hébraïque et son accent sur la filiation; dans ce contexte tribal, elle peut aussi désigner plus largement les descendants de Benjamin.
- source_word: בֶּן
  choice: fils de
  rationale: La formule répétée rend clairement et directement la chaîne généalogique hébraïque.
- source_word: סַלֻּא
  choice: Sallou
  rationale: Transcription française moderne du nom hébreu.
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: Transcription française qui représente les consonnes et la vocalisation du nom hébreu.
- source_word: יוֹעֵד
  choice: Yoëd
  rationale: Transcription du nom tel qu’il figure dans le texte massorétique, sans l’harmoniser avec la généalogie parallèle.
- source_word: פְּדָיָה
  choice: Pedaya
  rationale: Transcription française moderne du nom hébreu.
- source_word: קוֹלָיָה
  choice: Qolaya
  rationale: Transcription qui conserve la forme vocalisée du nom hébreu.
- source_word: מַעֲשֵׂיָה
  choice: Maaséya
  rationale: Transcription française lisible qui reflète les principales composantes phonétiques du nom hébreu.
- source_word: אִיתִיאֵל
  choice: Itiel
  rationale: Transcription française naturelle du nom hébreu.
- source_word: יְשַׁעְיָה
  choice: Yeshaya
  rationale: La transcription distingue ce personnage du prophète habituellement appelé Ésaïe tout en représentant plus directement la forme hébraïque.
