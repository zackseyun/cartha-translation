  text: כִּֽי מִצְוַ֥ת הַ/מֶּ֖לֶךְ עֲלֵי/הֶ֑ם וַ/אֲמָנָ֥ה עַל הַ/מְשֹׁרְרִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: fr
  text: Car l’ordre du roi s’imposait à eux[a], et une provision fixe était prévue[b] pour les chanteurs, pour chaque jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reposait sur eux »; l’expression hébraïque peut souligner l’obligation qui leur était imposée ou le fait que l’ordre les concernait.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner une disposition ferme, une obligation établie ou une provision garantie.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’organisation décrite au verset précédent et conserve clairement le lien logique.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: un ordre du roi
  rationale: Dans ce contexte administratif, מִצְוָה désigne une directive royale ayant autorité; « ordre » est naturel et précis en français moderne.
- source_word: עֲלֵיהֶם
  choice: s’appliquait à eux
  rationale: Cette formulation rend l’idée qu’une directive les concernait et avait force à leur égard, sans imposer une lecture trop matérielle de la préposition עַל.
- source_word: וַאֲמָנָה
  choice: une disposition fixe était établie
  rationale: אֲמָנָה évoque ici quelque chose de ferme ou d’officiellement établi, qu’il s’agisse d’un arrangement, d’une obligation ou d’une provision garantie. La formulation française garde cette portée administrative.
- source_word: עַל הַמְשֹׁרְרִים
  choice: pour les chanteurs
  rationale: Dans le contexte, la disposition concerne les chanteurs et vraisemblablement leur service ou leur entretien; « pour » exprime ce rapport sans le préciser au-delà du texte.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: selon les besoins de chaque jour
  rationale: L’expression idiomatique signifie littéralement « l’affaire d’un jour en son jour » et désigne ce qui doit être assuré ou accompli jour après jour.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et administratif. La tournure reste proche de la structure hébraïque tout en explicitant les propositions sans verbe. « Chanteurs » est retenu comme terme courant et digne pour les membres de ce service du temple.
