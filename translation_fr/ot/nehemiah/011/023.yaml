revisions:
- from: Car un ordre du roi s’appliquait à eux[a], et une disposition fixe était établie pour les chanteurs[b], selon les besoins de chaque jour.
  to: Car l’ordre du roi s’imposait à eux[a], et une provision fixe était prévue[b] pour les chanteurs, pour chaque jour.
  rationale: La révision supprime l’ajout « besoins », allège une redondance, garde l’ambiguïté administrative de l’hébreu et déplace la note b sur le mot qu’elle explique. « Pour chaque jour » rend le caractère journalier de l’expression finale sans en préciser indûment la nature.
