  text: et à En-Rimmon[a], à Tsorea et à Jarmuth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aïn-Rimmon ». Le premier élément du nom hébreu peut être transcrit « En » ou « Aïn ».
