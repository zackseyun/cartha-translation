lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: à En-Rimmon
  rationale: Le préfixe בְּ indique ici le lieu (« à »). Le toponyme est translittéré sous la forme française courante « En-Rimmon »; le וּ initial poursuit l’énumération, mais sa répétition n’a pas besoin d’être reproduite devant chaque nom en français.
- source_word: וּ/בְ/צָרְעָה
  choice: à Tsorea
  rationale: Le nom de lieu est rendu par la forme française reconnaissable « Tsorea ». La préposition בְּ est traduite par « à ».
- source_word: וּ/בְ/יַרְמוּת
  choice: à Yarmouth
  rationale: Le toponyme est translittéré selon la forme française biblique courante « Yarmouth », et בְּ est rendu par « à ».
