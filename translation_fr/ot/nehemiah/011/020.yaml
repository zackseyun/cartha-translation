  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁאָ֨ר יִשְׂרָאֵ֜ל הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה אִ֖ישׁ בְּ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: fr
  text: Le reste d’Israël, les prêtres et les lévites se trouvaient dans toutes les villes de Juda, chacun[a] dans son héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme dans son héritage ». Le singulier hébreu a ici une valeur distributive.'
    reason: Précision sur la forme littérale et la valeur distributive de אִישׁ avec le suffixe singulier.
lexical_decisions:
- source_word: וּשְׁאָר
  choice: Le reste de
  rationale: שְׁאָר désigne ce qui subsiste ou reste. « Le reste de » est naturel en français et marque le contraste avec les groupes précédemment recensés à Jérusalem.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé selon sa forme française usuelle. Dans ce contexte, il désigne les autres membres du peuple, à côté des prêtres et des lévites expressément nommés.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant du terme désignant la classe sacerdotale.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Équivalent français usuel pour les membres du groupe lévitique.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: dans toutes les villes de Juda
  rationale: La préposition בְּ est ici locative. Cette formulation rend directement l’étendue de leur implantation dans les villes de Juda.
- source_word: אִישׁ
  choice: chacun
  rationale: Le nom masculin singulier אִישׁ a ici une valeur distributive. « Chacun » exprime clairement cette fonction en français moderne tout en conservant le singulier.
- source_word: בְּנַחֲלָתוֹ
  choice: dans son héritage
  rationale: נַחֲלָה évoque un bien reçu en héritage ou un lot attribué, notamment dans le cadre de la terre d’Israël. « Héritage » préserve cette portée mieux que le terme plus général « propriété ».
theological_decisions:
- issue: Rendu du masculin singulier distributif
  choice: chacun dans son héritage
  alternative: chaque homme dans son héritage
  rationale: L’hébreu emploie אִישׁ et un suffixe masculin singulier de manière distributive. « Chacun dans son héritage » reste fidèle à cette structure tout en étant plus naturel en français contemporain; « chaque homme » serait plus littéral, mais risquerait d’accentuer inutilement le sexe des personnes visées.
- issue: Portée de נַחֲלָה
  choice: héritage
  alternative: propriété; lot attribué
  rationale: Le choix maintient la dimension traditionnelle et territoriale du bien transmis ou attribué, sans réduire le terme à une simple propriété privée ni expliciter au-delà de l’hébreu le mode d’attribution.
translation_notes:
  register: Français moderne, digne et direct. La proposition hébraïque étant nominale, « se trouvaient » fournit une copule locative naturelle sans ajouter l’idée plus précise d’une résidence permanente. La répétition des articles devant « prêtres » et « lévites » respecte la coordination de l’hébreu.
