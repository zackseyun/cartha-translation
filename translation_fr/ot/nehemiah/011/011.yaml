source:
  edition: WLC
  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: fr
  text: Seraya, fils de Hilqiya, fils de Meshoullam, fils de Sadoc, fils de Merayoth, fils d’Ahitoub, responsable[a] de la maison de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef » ou « dirigeant ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le temple.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Nom propre transcrit selon une forme française courante et directement reconnaissable.
- source_word: בֶן
  choice: fils de
  rationale: La formule généalogique répétée désigne naturellement la filiation. Même si certaines généalogies peuvent omettre des générations, rien ici n’impose de rendre le terme par « descendant de ».
- source_word: נְגִיד
  choice: responsable
  rationale: Le mot désigne une personne placée à la tête ou chargée d’une fonction. « Responsable » convient au cadre administratif et sacerdotal sans introduire la nuance royale que pourrait suggérer « chef » ou « prince ».
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction préserve l’expression hébraïque concrète et naturelle, tout en laissant une note préciser qu’il s’agit du temple.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans cette construction, le terme renvoie au Dieu d’Israël et se traduit au singulier.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La chaîne généalogique est conservée sans la simplifier, et l’expression « maison de Dieu » maintient l’image hébraïque.
