  text: וּ/מַעֲשֵׂיָ֣ה בֶן בָּר֣וּךְ בֶּן כָּל חֹ֠זֶה בֶּן חֲזָיָ֨ה בֶן עֲדָיָ֧ה בֶן יוֹיָרִ֛יב בֶּן זְכַרְיָ֖ה בֶּן הַ/שִּׁלֹנִֽי־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: fr
  text: et Maaséya, fils de Baruc, fils de Col-Hozé, fils de Hazaya, fils d’Adaya, fils de Yoyarib, fils de Zacharie, fils du Shilonite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Shélonite ». Le terme hébreu peut signaler un lien avec Silo ou avec le clan de Shéla dans la tradition généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: et Maaséya
  rationale: La conjonction ו est conservée, car le verset poursuit la liste précédente. Le nom propre est translittéré selon une forme naturelle en français.
- source_word: בֶן
  choice: fils de
  rationale: La formule généalogique répétée est rendue uniformément par « fils de ». Même si בֶן peut parfois désigner un descendant plus éloigné, rien n’impose ici d’abandonner la structure directe du texte.
- source_word: בָּרוּךְ
  choice: Baruc
  rationale: Forme française biblique courante de ce nom propre.
- source_word: כָּל חֹזֶה
  choice: Col-Hozé
  rationale: L’expression fonctionne ici comme un nom propre composé et n’est donc pas traduite littéralement. La graphie choisie demeure proche de l’hébreu tout en étant lisible en français.
- source_word: חֲזָיָה
  choice: Hazaya
  rationale: Translittération française du nom propre, distinguant naturellement sa finale de celle de Zacharie.
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Translittération française claire du nom propre.
- source_word: יוֹיָרִיב
  choice: Yoyarib
  rationale: Cette forme suit directement l’hébreu présent dans ce verset, sans introduire la forme théophore développée « Yehoyarib ».
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française biblique bien établie de ce nom.
- source_word: הַ/שִּׁלֹנִי
  choice: le Silonite
  rationale: La forme adjectivale avec article indique une appartenance géographique ou clanique. « Silonite » conserve cette indétermination sans préciser s’il s’agit d’un lien avec Silo ou avec une lignée généalogique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « fils de » est maintenue pour reproduire la cadence généalogique de l’hébreu. Les noms propres suivent des formes françaises lisibles, tout en restant proches du texte source. Le marqueur de note est placé après « Silonite », le terme auquel la variante se rapporte.
