lexical_decisions:
- source_word: כָּל
  choice: Tous
  rationale: Le quantificateur désigne l’ensemble des Lévites recensés; « Tous » est direct et naturel en français.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: « Lévites » est la désignation française conventionnelle et précise des membres de ce groupe.
- source_word: בְּעִיר הַקֹּדֶשׁ
  choice: qui se trouvaient dans la ville sainte
  rationale: La préposition בְּ marque ici le lieu. La relative rend naturellement en français le groupe nominal hébreu et évite une tournure maladroite comme « Tous les Lévites dans la ville sainte ».
- source_word: הַקֹּדֶשׁ
  choice: sainte
  rationale: Dans la construction « ville de la sainteté », l’adjectif « sainte » restitue le sens cultuel et consacré de קֹדֶשׁ.
- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: étaient au nombre de deux cent quatre-vingt-quatre
  rationale: La séquence donne un total de 284. « Étaient au nombre de » explicite idiomatiquement la proposition nominale hébraïque sans modifier son sens.
