  yaml_path: translation/ot/nehemiah/011/027.yaml
  text: and in Hazar-shual[a], and in Beer-sheba and its villages.
translation:
  language: fr
  text: à Hatsar-Shoual, à Beer-Shéba et dans les villages qui en dépendaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « et ses filles » ; expression désignant les villages ou localités dépendant d’une ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲצַר שׁוּעָל
  choice: à Hatsar-Shoual
  rationale: Les préfixes indiquent « et à/dans ». Le toponyme est translittéré selon des conventions françaises lisibles plutôt que traduit étymologiquement par « village du renard ».
- source_word: וּבִבְאֵר שֶׁבַע
  choice: à Beer-Shéba
  rationale: Ce nom de lieu bien connu est translittéré, avec des accents facilitant sa prononciation en français. La répétition de « et » n’est pas nécessaire devant chacun des éléments d’une énumération naturelle en français.
- source_word: וּבְנֹתֶיהָ
  choice: et dans les villages qui en dépendaient
  rationale: Le mot « filles » est ici un idiome géographique désignant les localités rattachées à une ville. Cette formulation exprime clairement leur dépendance envers Beer-Shéba tout en conservant la valeur locative du contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le verset étant un fragment d’énumération, il commence par une minuscule et ne rétablit pas artificiellement un verbe absent de ce segment.
