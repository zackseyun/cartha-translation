lexical_decisions:
- source_word: חָצוֹר
  choice: Hatsor
  rationale: Nom de lieu translittéré selon un usage français courant. Le sens étymologique possible (« enceinte » ou « établissement ») n’est pas traduit, car le mot désigne ici une ville.
- source_word: רָמָה
  choice: Rama
  rationale: Forme française biblique courante de ce nom de lieu. Bien que le nom soit apparenté à un mot signifiant « hauteur », il fonctionne ici comme un toponyme.
- source_word: גִּתָּיִם
  choice: Guittaïm
  rationale: Translittération française lisible du nom de lieu, avec « Gu » pour rendre le son /g/ devant « i » et le tréma pour marquer la séparation vocalique. La terminaison fait partie du toponyme et n’est pas traduite.
