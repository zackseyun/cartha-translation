revisions:
- from: 'À Jérusalem s’installèrent des descendants de Juda et des descendants de Benjamin[a]. Parmi les descendants de Juda : Ataya, fils d’Ozias, fils de Zacharie, fils d’Amaria, fils de Shephatia, fils de Mahalaléel, l’un des descendants de Pérets.'
  to: 'À Jérusalem vivaient des descendants de Juda et des descendants de Benjamin[a]. Parmi les descendants de Juda : Ataïa, fils d’Ozias, fils de Zacharie, fils d’Amaria, fils de Shephatia, fils de Mahalaléel, descendant de Pérets.'
  rationale: La révision remplace « s’installèrent » par « vivaient », qui rend le sens résidentiel de יָשַׁב sans introduire une nuance d’établissement. Elle adopte « Ataïa », forme française plus cohérente avec le nom hébreu, et resserre la qualification finale tout en maintenant son rattachement à Ataïa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:49:34Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement les deux groupes tribaux, la généalogie et le rattachement final de Ataïa à Pérets. Toutefois, « s’installèrent » ajoute l’idée d’un établissement/installation que le verbe יָשַׁב n’exprime pas nécessairement ; il signifie ici plus sobrement « habiter, vivre ».
  naturalness: Le français est globalement naturel et de registre approprié. « À Jérusalem vivaient… » est plus idiomatique dans ce contexte de liste et évite la nuance indûment ponctuelle de « s’installèrent ».
  terminology: « Descendants » convient pour בְּנֵי dans ce contexte tribal. Les formes françaises des noms sont cohérentes ; « Ataïa » est une graphie française plus usuelle et plus proche de la vocalisation hébraïque que « Ataya ».
  issues:
  - severity: medium
    issue: « s’installèrent » surinterprète יָשְׁבוּ.
    rationale: Le verbe hébreu décrit le fait de résider/habiter. Le contexte plus large peut concerner le repeuplement, mais le verset lui-même ne précise pas l’acte de s’installer.
  - severity: low
    issue: « l’un des descendants de Pérets » peut être simplifié.
    rationale: La formule finale qualifie Ataïa comme membre de la lignée de Pérets. « descendant de Pérets » rend cette relation sans ajouter l’article indéfini « l’un », non nécessaire en français.
  revised_text: 'À Jérusalem vivaient des descendants de Juda et des descendants de Benjamin[a]. Parmi les descendants de Juda : Ataïa, fils d’Ozias, fils de Zacharie, fils d’Amaria, fils de Shephatia, fils de Mahalaléel, descendant de Pérets.'
  revised_footnotes:
  - marker: a
    text: 'On peut aussi traduire : « habitaient ». Le verbe hébreu peut désigner le fait d’habiter ou de résider dans un lieu.'
    reason: lexical_alternative
  revision_rationale: La révision remplace « s’installèrent » par « vivaient », qui rend le sens résidentiel de יָשַׁב sans introduire une nuance d’établissement. Elle adopte « Ataïa », forme française plus cohérente avec le nom hébreu, et resserre la qualification finale tout en maintenant son rattachement à Ataïa.
