  text: וּ/בִֽ/ירוּשָׁלִַ֨ם֙ יָֽשְׁב֔וּ מִ/בְּנֵ֥י יְהוּדָ֖ה וּ/מִ/בְּנֵ֣י בִנְיָמִ֑ן מִ/בְּנֵ֣י יְ֠הוּדָה עֲתָיָ֨ה בֶן עֻזִּיָּ֜ה בֶּן זְכַרְיָ֧ה בֶן אֲמַרְיָ֛ה בֶּן שְׁפַטְיָ֥ה בֶן מַהֲלַלְאֵ֖ל מִ/בְּנֵי פָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: fr
  text: 'À Jérusalem vivaient des descendants de Juda et des descendants de Benjamin[a]. Parmi les descendants de Juda : Ataïa, fils d’Ozias, fils de Zacharie, fils d’Amaria, fils de Shephatia, fils de Mahalaléel, descendant de Pérets.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « habitaient ». Le verbe hébreu peut désigner le fait d’habiter ou de résider dans un lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: À Jérusalem
  rationale: Le contexte français rend la continuation sans exiger un « et » initial, peu naturel ici; la préposition et le lieu sont directement exprimés.
- source_word: יָשְׁבוּ
  choice: s’installèrent
  rationale: Le verbe ישב peut signifier habiter, résider ou s’établir. Dans le contexte du repeuplement de Jérusalem, « s’installèrent » est naturel tout en conservant cette nuance contextuelle.
- source_word: מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן
  choice: des descendants de Juda et des descendants de Benjamin
  rationale: בני désigne ici les membres issus des lignées tribales; « descendants » communique ce sens plus clairement que le littéral « fils ». Le מן partitif indique qu’il ne s’agit que d’une partie de chaque groupe.
- source_word: מִבְּנֵי יְהוּדָה
  choice: Parmi les descendants de Juda
  rationale: La seconde occurrence introduit le membre de Juda nommé dans la liste; « parmi » rend naturellement la valeur partitive de מן.
- source_word: עֲתָיָה
  choice: Ataya
  rationale: Translittération française proche de l’hébreu, avec la terminaison -ya courante pour les noms théophores.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu formel et conventionnel dans une généalogie, sans exclure la possibilité biblique de générations intermédiaires non indiquées.
- source_word: עֻזִּיָּה
  choice: Ozias
  rationale: Forme française biblique traditionnelle et largement reconnaissable.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française biblique usuelle.
- source_word: אֲמַרְיָה
  choice: Amaria
  rationale: Translittération française claire et proche de l’hébreu.
- source_word: שְׁפַטְיָה
  choice: Shephatia
  rationale: Translittération française lisible qui conserve les principaux éléments phonétiques du nom hébreu.
- source_word: מַהֲלַלְאֵל
  choice: Mahalaléel
  rationale: Forme française traditionnelle, proche du nom hébreu.
- source_word: מִבְּנֵי פָרֶץ
  choice: l’un des descendants de Pérets
  rationale: La formule rattache Ataya à la lignée de Pérets. « L’un des descendants » explicite en français la relation partitive sans faire de Mahalaléel le seul référent possible.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Les noms suivent des formes françaises reconnues lorsqu’elles sont bien établies; ailleurs, une translittération lisible est employée. Le vocabulaire généalogique reste explicite sans archaïsme.
