source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: fr
  text: 'Voici les chefs de la province qui habitaient à Jérusalem. Dans les villes de Juda, chacun habitait sur sa propriété, dans les villes qui étaient les leurs : Israël[a], les prêtres, les lévites, les serviteurs du Temple[b] et les descendants des serviteurs de Salomon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu porte simplement « Israël », probablement comme désignation collective dans cette liste.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « les Netinim », classe de personnes affectées au service du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: les chefs de la province
  rationale: רָאשֵׁי désigne les principaux responsables, et הַמְּדִינָה la province administrative de l’époque perse. « Chefs de la province » conserve cette valeur sans évoquer un État moderne.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: qui habitaient à Jérusalem
  rationale: יָשַׁב exprime ici la résidence établie ; « habitaient » est naturel et précis en français contemporain.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: Dans les villes de Juda, … habitait
  rationale: La coordination hébraïque marque le passage de Jérusalem aux autres localités de Juda. Le français opère ce changement sans imposer une opposition forte absente du texte.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif signifie que chaque personne ou chef de foyer résidait sur son propre bien. « Chacun » restitue cette distribution avec naturel.
- source_word: בַּאֲחֻזָּתוֹ
  choice: sur sa propriété
  rationale: אֲחֻזָּה désigne un bien foncier détenu, souvent héréditaire. « Sur sa propriété » rend concrètement la relation au territoire.
- source_word: בְּעָרֵיהֶם
  choice: dans leurs villes respectives
  rationale: Le pluriel pronominal renvoie collectivement aux villes propres aux groupes énumérés. « Respectives » clarifie cette distribution tout en conservant le pluriel.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom sans article est conservé tel quel, vraisemblablement comme désignation collective placée en tête de la liste ; une note signale l’autre formulation possible.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: les prêtres, les lévites
  rationale: Ce sont les équivalents français usuels de ces deux groupes institutionnels.
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: Le terme désigne une classe affectée au service du sanctuaire. La traduction fonctionnelle est plus intelligible que la simple translittération.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: les descendants des serviteurs de Salomon
  rationale: Dans cette liste communautaire, בְּנֵי désigne les membres issus d’une lignée, et non nécessairement les seuls fils immédiats.
