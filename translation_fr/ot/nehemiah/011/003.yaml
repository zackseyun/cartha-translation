translation_notes:
  register: Français international moderne, digne et lisible. La répétition spatiale de l’hébreu est partiellement conservée (« Dans les villes… dans leurs villes respectives »), tout en étant rendue compréhensible. La majuscule à « Temple » identifie le sanctuaire de Jérusalem.
