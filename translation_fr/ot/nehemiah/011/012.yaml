base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: fr
  text: Leurs frères, qui faisaient le travail pour le Temple[a], étaient au nombre de huit cent vingt-deux ; et Adaïa, fils de Yeroam, fils de Pelalia, fils d’Amtsi, fils de Zacharie, fils de Pashhour, fils de Malkiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pour la maison ». Dans ce contexte, « la maison » désigne le Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Leurs frères
  rationale: Le nom hébreu signifie littéralement « leurs frères ». Dans ce recensement sacerdotal, il désigne les autres membres de leur groupe, mais la traduction conserve le terme de parenté sans expliciter « prêtres ».
- source_word: עֹשֵׂי הַמְּלָאכָה לַבַּיִת
  choice: qui faisaient le travail pour le Temple[a]
  rationale: La tournure rend le participe hébreu dans un français naturel et conserve l’idée générale de « travail ». Le contexte montre que « la maison » désigne le Temple; la note maintient visible l’expression littérale et son ambiguïté lexicale.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: huit cent vingt-deux
  rationale: Rendu cardinal direct, conforme à l’usage français; « cent » reste invariable puisqu’il est suivi d’un autre nombre.
- source_word: וַעֲדָיָה
  choice: Il y avait aussi Adaïa
  rationale: Le waw poursuit l’énumération. Une nouvelle phrase avec « Il y avait aussi » évite une coordination française maladroite après l’indication du nombre, tout en conservant la continuité de la liste.
- source_word: בֶּן
  choice: fils de
  rationale: La formule généalogique hébraïque est conservée à chaque degré. Même si les généalogies peuvent omettre des générations, rien dans ce verset n’impose le sens plus général de « descendant de ».
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: Yeroam / Pelalia / Amtsi / Zacharie / Pashhour / Malkiya
  rationale: Les noms propres sont transcrits sous des formes lisibles en français moderne; « Zacharie » suit sa forme française bien établie.
