  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה בֶּן בּוּנִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: fr
  text: 'Et parmi les lévites : Shemaya, fils de Hashoub[a], fils d’Azriqam, fils de Hashabya, fils de Bounni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les listes généalogiques, le mot hébreu traduit par « fils de » peut aussi désigner un descendant plus éloigné, et pas nécessairement le fils direct.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Parmi
  rationale: Dans la continuité de la liste précédente, la tournure française « Parmi les lévites » rend naturellement l’introduction d’un nouveau groupe; il n’est pas nécessaire de traduire וְ séparément.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désigne les membres du groupe tribal et cultuel de Lévi; « les lévites » est la désignation française usuelle.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Translittération française claire du nom hébreu, avec « sh » pour שׁ et « y » pour י.
- source_word: בֶן
  choice: fils de
  rationale: Rend formellement la structure généalogique hébraïque tout en laissant à une note la possibilité d’une filiation plus éloignée.
- source_word: חַשּׁוּב
  choice: Hashoub
  rationale: Translittération adaptée aux conventions de lecture françaises; le redoublement consonantique massorétique n’a pas besoin d’être reproduit graphiquement.
- source_word: עַזְרִיקָם
  choice: Azriqam
  rationale: Translittération proche de la forme hébraïque, notamment par « q » pour ק.
- source_word: חֲשַׁבְיָה
  choice: Hashabya
  rationale: Translittération française proche de la forme hébraïque, sans ajouter une syllabe finale étrangère au nom source.
- source_word: בּוּנִּי
  choice: Bounni
  rationale: « ou » indique naturellement le son /u/ en français; le double n aide à conserver la consonne renforcée de la forme massorétique.
