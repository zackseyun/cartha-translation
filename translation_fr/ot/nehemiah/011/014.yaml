  text: וַ/אֲחֵי/הֶם֙ גִּבּ֣וֹרֵי חַ֔יִל מֵאָ֖ה עֶשְׂרִ֣ים וּ/שְׁמֹנָ֑ה וּ/פָקִ֣יד עֲלֵי/הֶ֔ם זַבְדִּיאֵ֖ל בֶּן הַ/גְּדוֹלִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: fr
  text: Leurs frères, hommes vaillants, étaient au nombre de cent vingt-huit. Celui qui était responsable d’eux était Zabdiel, fils de Hagguedolim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils des grands » ou « fils des notables ». L’expression hébraïque peut être descriptive plutôt qu’un nom propre.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Leurs frères
  rationale: Le nom signifie littéralement « frères ». Dans cette liste, il désigne les hommes du même groupe; la traduction conserve le lien exprimé par l’hébreu sans l’élargir en « compatriotes ».
- source_word: גִּבּוֹרֵי חַיִל
  choice: hommes vaillants
  rationale: Cette expression qualifie des hommes reconnus pour leur force, leur courage ou leur capacité. « Hommes vaillants » en préserve la portée sans imposer ici une fonction strictement militaire.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: cent vingt-huit
  rationale: Rendu direct du nombre cardinal 128, selon l’usage français courant.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: Celui qui était responsable d’eux était
  rationale: פָקִיד désigne une personne établie dans une fonction de direction ou de surveillance. Cette formulation française naturelle conserve le caractère administratif général du terme sans préciser indûment « officier ».
- source_word: זַבְדִּיאֵל
  choice: Zabdiel
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בֶּן הַגְּדוֹלִים
  choice: fils de Hagguedolim
  rationale: Le groupe הַגְּדוֹלִים peut être compris comme un nom familial ou clanique. Le texte principal conserve donc cette possibilité par translittération, tandis qu’une note signale l’analyse descriptive également possible.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « étaient au nombre de » convient au contexte de recensement. « Hommes vaillants » garde la force de l’expression hébraïque sans lui donner un sens exclusivement militaire. Le marqueur de note est placé après « Hagguedolim », auquel la variante se rapporte.
