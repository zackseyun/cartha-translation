  text: and in Ziklag[a], and in Mekonah and its daughter villages.
translation:
  language: fr
  text: à Tsiklag, à Mekona et dans les villages qui en dépendaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et dans ses filles », expression hébraïque désignant les petites localités ou agglomérations dépendant de Mekona.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַג
  choice: à Tsiklag
  rationale: La préposition בְּ indique ici le lieu. Dans cette énumération, le וְ de coordination peut rester implicite en français jusqu’au dernier élément. Le nom propre est translittéré selon un usage français courant.
- source_word: וּ/בִ/מְכֹנָ֖ה
  choice: à Mekona
  rationale: La préposition בְּ est rendue par « à » devant ce nom de lieu. « Mekona » transpose simplement le nom hébreu en français.
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: et dans les villages qui en dépendaient
  rationale: 'Littéralement « et dans ses filles » : בָּנוֹת désigne idiomatiquement les petites localités rattachées à une ville principale. Cette formulation française exprime clairement ce rapport de dépendance, et « en » renvoie à Mekona.'
