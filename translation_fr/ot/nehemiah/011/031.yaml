  text: וּ/בְנֵ֥י בִנְיָמִ֖ן מִ/גָּ֑בַע מִכְמָ֣שׂ וְ/עַיָּ֔ה וּ/בֵֽית אֵ֖ל וּ/בְנֹתֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/031.yaml
  text: And the sons of Benjamin were from Geba[a], Michmash, Aijah, and Bethel and its villages.
translation:
  language: fr
  text: 'Les fils de Benjamin s’établirent à partir de Guéba : à Micmas, à Aïya[a], à Béthel et dans les localités qui en dépendaient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aï ». La forme hébraïque employée ici est עַיָּה (Aïya) ; elle peut désigner le même lieu ou refléter un nom de lieu étroitement apparenté dans la tradition de traduction.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: Les fils de Benjamin
  rationale: La formulation conserve l’expression hébraïque littérale tout en désignant, dans ce contexte de peuplement, les membres de la tribu de Benjamin.
- source_word: מִגָּבַע
  choice: habitaient à partir de Guéba
  rationale: La préposition מִן indique ici le point de départ d’une répartition géographique. Le verbe « habitaient » est explicité en français d’après le contexte de la liste des lieux de résidence.
- source_word: מִכְמָשׂ
  choice: Mikmas
  rationale: Transcription française courante du nom de lieu hébreu.
- source_word: וְעַיָּה
  choice: à Aya[a]
  rationale: « Aya » représente naturellement en français la forme hébraïque עַיָּה. L’identification ou la traduction alternative « Aï » est signalée en note.
- source_word: וּבֵית אֵל
  choice: à Béthel
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu.
- source_word: וּבְנֹתֶיהָ
  choice: et dans les villages qui en dépendaient
  rationale: Littéralement « et ses filles » ; dans le vocabulaire géographique hébreu, l’expression désigne les villages ou localités dépendant d’une ville principale.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La tournure « à partir de Guéba » conserve la valeur du préfixe hébreu מִן, tandis que « habitaient » rend explicite l’ellipse propre à cette liste de peuplement. Les noms géographiques suivent les formes françaises usuelles.
