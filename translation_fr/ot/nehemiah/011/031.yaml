  - severity: low
    issue: Graphie de Micmas et d’Aïya à harmoniser avec l’usage biblique français et la forme hébraïque
    rationale: « Micmas » est la forme française courante; « Aïya » signale le yod redoublé de עַיָּה et évite de confondre silencieusement ce nom avec « Aï ».
