  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: fr
  text: Quant aux villages situés dans leurs campagnes, certains des fils de Juda habitaient à Qiryath-Arba[a] et dans les localités qui en dépendaient, à Dibon et dans les localités qui en dépendaient[b], ainsi qu’à Yeqabseel[c] et dans les villages alentour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qiryath-Arba est l’ancien nom d’Hébron ; voir Josué 14.15.
    reason: cross_reference
  - marker: b
    text: Littéralement « ses filles », expression désignant les localités dépendantes ou environnantes d’une ville.
    reason: lexical_alternative
  - marker: c
    text: Yeqabseel est aussi appelé « Qabseel » dans des passages et traditions textuelles apparentés.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: Quant aux villages situés dans leurs campagnes
  rationale: La tournure introduit une nouvelle catégorie dans la liste. חֲצֵרִים désigne ici des habitats ruraux, et שְׂדֹתָם leurs terres agricoles ou campagnes.
- source_word: מִבְּנֵי יְהוּדָה
  choice: certains des fils de Juda
  rationale: « Certains des » exprime la valeur partitive de מִן, tandis que « fils de Juda » conserve la désignation tribale hébraïque.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Le verbe exprime ici la résidence, sans nécessairement insister sur l’acte initial de s’établir.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: à Qiryath-Arba
  rationale: Le nom propre est translittéré; son identification avec Hébron est donnée en note plutôt qu’intégrée au verset.
- source_word: וּבְנֹתֶיהָ
  choice: dans les localités qui en dépendaient
  rationale: Littéralement « ses filles »; dans cet emploi géographique, il s’agit des localités rattachées à une ville principale.
- source_word: וּבְדִיבוֹן
  choice: à Dibon
  rationale: Translittération usuelle du nom de lieu.
- source_word: וּבִיקַּבְצְאֵל
  choice: à Yeqabseel
  rationale: Cette forme rend la graphie massorétique יִקַּבְצְאֵל; la forme apparentée Qabseel est signalée en note.
- source_word: וַחֲצֵרֶיהָ
  choice: dans les villages alentour
  rationale: חֲצֵרִים désigne ici les petites implantations rurales associées à Yeqabseel; cette formulation les distingue naturellement des « filles » des villes précédentes.
theological_decisions:
- issue: Désignation tribale genrée מִבְּנֵי יְהוּדָה
  choice: certains des fils de Juda
  alternative: certains des membres du peuple de Juda
  rationale: La traduction conserve l’expression tribale genrée du texte hébreu sans lui attribuer une portée doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres suivent une translittération proche de l’hébreu. La métaphore littérale des villes « filles » est explicitée naturellement dans le texte et conservée en note.
