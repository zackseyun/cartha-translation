base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/006.yaml
  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: fr
  text: Tous les descendants de Pérets qui habitaient à Jérusalem étaient au nombre de quatre cent soixante-huit hommes valeureux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hommes de valeur ». L’expression hébraïque peut désigner des hommes qui se distinguent par leur force, leurs capacités ou leur vaillance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל בְּנֵי פֶרֶץ
  choice: Tous les descendants de Pérets
  rationale: Dans ce registre généalogique, בְּנֵי désigne les membres de la lignée de Pérets plutôt que ses fils immédiats. « Descendants » exprime naturellement ce sens en français moderne, tandis que « tous » rend la totalité indiquée par כָּל.
- source_word: הַיֹּשְׁבִים בִּירוּשָׁלִָם
  choice: qui habitaient à Jérusalem
  rationale: Le participe de ישׁב décrit ici la résidence. « Habitaient à Jérusalem » est courant et convient au contexte d'un relevé de population.
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: quatre cent soixante-huit
  rationale: Le nombre hébreu est rendu en toutes lettres selon l'usage français; « cent » reste invariable puisqu'il est suivi d'un autre nombre.
- source_word: אַנְשֵׁי חָיִל
  choice: hommes valeureux
  rationale: Cette expression peut évoquer la vaillance, la force ou la capacité. « Hommes valeureux » conserve ici sa forme masculine et sa portée élogieuse sans être excessivement archaïque.
