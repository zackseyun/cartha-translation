  text: וְ/יוֹאֵ֥ל בֶּן זִכְרִ֖י פָּקִ֣יד עֲלֵי/הֶ֑ם וִ/יהוּדָ֧ה בֶן הַ/סְּנוּאָ֛ה עַל הָ/עִ֖יר מִשְׁנֶֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: fr
  text: Joël, fils de Zikri, était leur responsable, et Juda, fils de Hassénoua, était le second de la ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adjoint chargé de la ville » ou « le second dans le commandement de la ville ».
    reason: Le terme מִשְׁנֶה désigne une personne de second rang ; la nature exacte de cette fonction administrative n’est pas précisée.
lexical_decisions:
- source_word: פָּקִיד
  choice: responsable
  rationale: Le terme désigne une personne établie dans une fonction de surveillance ou d’administration. « Responsable » est naturel en français moderne et évite de préciser indûment la nature civile ou militaire de la charge.
- source_word: עֲלֵיהֶם
  choice: d’eux
  rationale: Avec פָּקִיד, la préposition עַל marque ici l’autorité exercée sur le groupe mentionné auparavant. « Responsable d’eux » exprime cette relation de manière idiomatique.
- source_word: מִשְׁנֶה
  choice: le second responsable
  rationale: Le mot peut désigner une personne de second rang ou un adjoint. Cette formulation conserve l’idée de rang tout en restant compréhensible, sans définir plus précisément la structure administrative.
- source_word: עַל הָעִיר
  choice: de la ville
  rationale: Dans ce contexte administratif, עַל indique le domaine de responsabilité. Le français idiomatique « responsable de la ville » rend cette juridiction sans reproduire mécaniquement la préposition hébraïque.
- source_word: הַסְּנוּאָה
  choice: Hassénoua
  rationale: Le nom propre est translittéré, avec intégration de l’article hébreu dans la forme du nom et une graphie adaptée à la lecture française.
- source_word: וְ
  choice: et
  rationale: La conjonction relie les deux responsables mentionnés dans le verset et maintient la continuité de l’énumération.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation administrative reste sobre et conserve l’ambiguïté du titre מִשְׁנֶה. Les noms sont rendus sous les formes françaises Zikri et Hassénoua.
