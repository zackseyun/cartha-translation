  yaml_path: translation/ot/nehemiah/011/021.yaml
  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: fr
  text: Les serviteurs du Temple[a] habitaient sur l’Ofel. Tsihah et Guishpa étaient responsables des serviteurs du Temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu netinim, terme technique désignant un groupe affecté au service du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: נְתִינִים est un terme technique postexilique désignant un groupe affecté au service du Temple. Cette traduction exprime clairement leur fonction et leur statut collectif sans imposer au lecteur une translittération obscure.
- source_word: יֹשְׁבִים
  choice: habitaient
  rationale: Le participe de ישׁב indique ici une résidence durable. L’imparfait français rend naturellement cet état continu dans le cadre narratif.
- source_word: בָּעֹפֶל
  choice: sur l’Ofel
  rationale: עֹפֶל désigne ici le quartier fortifié en hauteur de Jérusalem. « Sur » correspond à sa réalité topographique, et « Ofel » est la forme française courante du nom.
- source_word: צִיחָא
  choice: Siha
  rationale: Nom propre transcrit selon un usage français courant, avec « s » pour la consonne initiale צ.
- source_word: גִשְׁפָּא
  choice: Guishpa
  rationale: Nom propre transcrit dans une forme lisible en français, où « gu » maintient le son dur devant « i ».
- source_word: עַל
  choice: étaient responsables de
  rationale: Dans ce contexte administratif, עַל exprime l’autorité ou la surveillance. Cette formulation est plus naturelle et plus précise en français actuel qu’un calque comme « étaient sur ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Temple » porte une majuscule pour désigner l’institution et l’édifice cultuel de Jérusalem. La division en deux phrases évite une coordination lourde tout en conservant les rapports syntaxiques du texte hébreu.
