- source_word: צְבֹעִים
  choice: Tseboïm
  rationale: Nom de lieu translittéré plutôt que traduit. « Ts » représente le tsadé initial, et le tréma indique que les voyelles finales se prononcent séparément.
- source_word: נְבַלָּט
  choice: Neballat
  rationale: Nom de lieu translittéré. Cette forme reste proche de la graphie hébraïque pointée et rend visible le redoublement du lamed, tout en demeurant lisible en français.
