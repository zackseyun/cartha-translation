source:
  edition: WLC
  text: וַֽ/יְבָרֲכ֖וּ הָ/עָ֑ם לְ/כֹל֙ הָֽ/אֲנָשִׁ֔ים הַ/מִּֽתְנַדְּבִ֔ים לָ/שֶׁ֖בֶת בִּ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/002.yaml
  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: fr
  text: Le peuple bénit tous les hommes qui s’étaient portés volontaires pour habiter à Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui s’étaient offerts volontairement pour habiter à Jérusalem » (formulation plus littérale).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: bénit
  rationale: Le piel de ברך signifie couramment « bénir ». Ici, le peuple exprime une bénédiction ou son approbation envers ces hommes; « bénit » conserve le lien lexical sans réduire le sens à de simples félicitations.
- source_word: הָעָם
  choice: le peuple
  rationale: עם est le terme collectif courant pour désigner le peuple; cette formulation est naturelle et proche de l’hébreu.
- source_word: לְכֹל הָאֲנָשִׁים
  choice: tous les hommes
  rationale: אֲנָשִׁים désigne ici les hommes. Le masculin explicite est conservé plutôt que neutralisé.
- source_word: הַמִּתְנַדְּבִים
  choice: qui s’étaient portés volontaires
  rationale: Le hitpael de נדב exprime l’engagement volontaire de soi. « Se porter volontaire » rend naturellement en français moderne cette nuance réfléchie et volontaire.
- source_word: לָשֶׁבֶת
  choice: pour habiter
  rationale: ישב peut signifier s’asseoir, demeurer, habiter ou s’établir. Dans ce contexte résidentiel, « habiter » est clair, naturel et digne.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition française « à » est la tournure locative idiomatique avec le nom de cette ville.
theological_decisions:
- issue: Rendu genré de הָאֲנָשִׁים
  choice: tous les hommes
  alternative: toutes les personnes / tous ceux
  rationale: Le texte hébreu emploie le nom masculin אֲנָשִׁים plutôt qu’un collectif générique; le masculin explicite est donc maintenu.
translation_notes:
  register: Français international moderne, naturel et digne. Le plus-que-parfait situe l’engagement volontaire avant la bénédiction exprimée par le peuple. Le marqueur de note [a] figure bien dans le texte principal.
