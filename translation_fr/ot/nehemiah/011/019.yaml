  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/שּֽׁוֹעֲרִים֙ עַקּ֣וּב טַלְמ֔וֹן וַ/אֲחֵי/הֶ֖ם הַ/שֹּׁמְרִ֣ים בַּ/שְּׁעָרִ֑ים מֵאָ֖ה שִׁבְעִ֥ים וּ/שְׁנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/019.yaml
  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: fr
  text: 'Les gardiens des portes : Akkoub, Talmôn et leurs frères[a], qui montaient la garde aux portes, étaient au nombre de 172.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs proches parents »; le mot hébreu traduit par « frères » peut désigner de proches parents de sexe masculin ou d’autres membres du même groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: les gardiens des portes
  rationale: Cette expression rend clairement la fonction institutionnelle de ceux qui étaient chargés de surveiller ou de desservir les portes, tout en restant naturelle en français moderne.
- source_word: עַקּוּב
  choice: Akkoub
  rationale: Nom propre translittéré directement de l’hébreu selon une forme lisible en français.
- source_word: טַלְמוֹן
  choice: Talmôn
  rationale: Nom propre translittéré directement de l’hébreu, avec l’accent circonflexe indiquant la voyelle longue finale.
- source_word: וַאֲחֵיהֶם
  choice: et leurs frères[a]
  rationale: Le sens premier de אָח est « frère ». Dans une liste communautaire, le terme peut aussi désigner des proches parents ou les membres masculins du même groupe; la traduction principale conserve donc le terme concret de l’hébreu et une note signale son extension possible.
- source_word: הַשֹּׁמְרִים
  choice: qui montaient la garde
  rationale: Le participe décrit leur fonction habituelle et continue. « Monter la garde » est une tournure française naturelle qui conserve le sens actif de surveillance.
- source_word: בַּשְּׁעָרִים
  choice: aux portes
  rationale: La préposition situe leur service aux portes; cette formulation est idiomatique en français et correspond au contexte.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: '172'
  rationale: Le chiffre exprime sans ambiguïté le nombre total et convient au style lisible d’une liste administrative.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure de liste est conservée, tandis que « étaient au nombre de » rend naturellement l’énoncé du total. La répétition de « portes » reflète celle du texte hébreu et clarifie la fonction des hommes recensés.
