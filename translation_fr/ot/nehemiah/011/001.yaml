revisions:
- from: Les chefs du peuple habitaient à Jérusalem. Le reste du peuple tira au sort une personne sur dix pour qu’elle vienne habiter à Jérusalem, la ville sainte, tandis que les neuf autres parts restaient dans les autres villes.[a]
  to: Les chefs du peuple habitaient à Jérusalem, et le reste du peuple tira au sort afin de faire venir à Jérusalem une personne sur dix pour y habiter, dans la ville sainte, tandis que les neuf dixièmes restaient dans les villes[a].
  rationale: La révision rend la dernière proportion naturelle et intelligible en français tout en maintenant, dans la note, la forme littérale et idiomatique de l’hébreu. Elle remplace également une paraphrase non nécessaire (« groupes ») par une explication plus neutre et conserve la causativité de « faire venir ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:49:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les responsables résident à Jérusalem, le reste du peuple procède à un tirage au sort pour y faire résider une personne sur dix, et les neuf portions restantes demeurent dans les villes. Toutefois, « les neuf autres parts » est peu idiomatique en français et la note parle de « groupes », notion que le texte ne précise pas.'
  naturalness: « Neuf parts » et plus encore « les neuf autres parts » ne se disent pas naturellement pour une répartition de population. « Neuf dixièmes » exprime clairement en français le sens distributif de l’idiome hébreu, avec une note qui en signale la formulation littérale.
  terminology: « Chefs du peuple », « tira au sort », « habiter » et « la ville sainte » conviennent au registre et au contexte. « Faire venir » rend plus directement la valeur causative de לְהָבִיא que « pour qu’elle vienne ».
  issues:
  - severity: medium
    issue: Formulation française maladroite de וְתֵשַׁע הַיָּדוֹת
    rationale: « Les neuf autres parts restaient » est artificiel et laisse « parts » sans référent naturel. Le contexte et l’idiome indiquent les neuf dixièmes restants.
  - severity: low
    issue: La note ajoute « groupes »
    rationale: Le terme « groupes » interprète le référent social de l’idiome. Il suffit d’expliquer que « mains » est employé pour des parts ou portions dans cette répartition.
  - severity: low
    issue: La causativité de לְהָבִיא peut être plus explicite
    rationale: « Afin de faire venir » conserve la valeur factitive du hiphil sans suggérer la contrainte.
  revised_text: Les chefs du peuple habitaient à Jérusalem, et le reste du peuple tira au sort afin de faire venir à Jérusalem une personne sur dix pour y habiter, dans la ville sainte, tandis que les neuf dixièmes restaient dans les villes[a].
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « et neuf mains dans les villes ». « Mains » est ici un idiome hébreu désignant les neuf parts restantes sur dix.'
    reason: Explication de l’idiome hébreu rendu par « les neuf dixièmes ».
  revision_rationale: La révision rend la dernière proportion naturelle et intelligible en français tout en maintenant, dans la note, la forme littérale et idiomatique de l’hébreu. Elle remplace également une paraphrase non nécessaire (« groupes ») par une explication plus neutre et conserve la causativité de « faire venir ».
