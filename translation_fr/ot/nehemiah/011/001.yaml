  text: וַ/יֵּשְׁב֥וּ שָׂרֵֽי הָ/עָ֖ם בִּ/ירוּשָׁלִָ֑ם וּ/שְׁאָ֣ר הָ֠/עָם הִפִּ֨ילוּ גוֹרָל֜וֹת לְ/הָבִ֣יא אֶחָ֣ד מִן הָ/עֲשָׂרָ֗ה לָ/שֶׁ֨בֶת֙ בִּֽ/ירוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ וְ/תֵ֥שַׁע הַ/יָּד֖וֹת בֶּ/עָרִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: fr
  text: Les chefs du peuple habitaient à Jérusalem, et le reste du peuple tira au sort afin de faire venir à Jérusalem une personne sur dix pour y habiter, dans la ville sainte, tandis que les neuf dixièmes restaient dans les villes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et neuf mains dans les villes ». « Mains » est ici un idiome hébreu désignant les neuf parts restantes sur dix.'
    reason: Explication de l’idiome hébreu rendu par « les neuf dixièmes ».
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: les chefs du peuple
  rationale: שָׂרִים désigne ici les dirigeants ou responsables du peuple. « Chefs » est naturel, digne et suffisamment large dans ce contexte administratif.
- source_word: וַיֵּשְׁבוּ
  choice: habitaient
  rationale: Le verbe ישׁב exprime ici la résidence; l’imparfait français convient à l’état de fait décrit.
- source_word: וּשְׁאָר הָעָם
  choice: le reste du peuple
  rationale: Rend directement et naturellement שְׁאָר, « reste » ou « restant ».
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: tira au sort
  rationale: Expression française usuelle pour la sélection par le sort; le singulier verbal s’accorde naturellement avec le collectif « le reste du peuple ».
- source_word: לְהָבִיא
  choice: pour qu’elle vienne
  rationale: Le hiphil de בוא signifie littéralement « faire venir ». Cette formulation française exprime clairement le déplacement attendu de la personne sélectionnée sans suggérer qu’elle aurait été amenée de force.
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: une personne sur dix
  rationale: Le masculin hébreu אֶחָד fonctionne distributivement. « Une personne sur dix » explicite le référent humain et conserve la proportion.
- source_word: לָשֶׁבֶת
  choice: habiter
  rationale: ישׁב désigne ici le fait de résider durablement, rendu en français courant par « habiter ».
- source_word: עִיר הַקֹּדֶשׁ
  choice: la ville sainte
  rationale: Traduction directe du syntagme construit, consacrée et naturelle en français.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: tandis que les neuf autres parts restaient
  rationale: Littéralement « et neuf parts/mains »; la formulation conserve l’image des parts tout en rendant explicite qu’il s’agit des neuf portions restantes sur dix.
- source_word: בֶּעָרִים
  choice: dans les autres villes
  rationale: עָרִים désigne les autres agglomérations de Juda par contraste avec Jérusalem. « Autres » rend ce contraste implicite et « villes » reste la traduction courante de עָרִים.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination hébraïque initiale n’est pas surtraduite par un marqueur comme « Or » ou « Maintenant ». Deux phrases allègent la longue structure hébraïque sans modifier ses rapports logiques.
