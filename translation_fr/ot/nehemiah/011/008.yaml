translation:
  language: fr
  text: 'Après lui venaient Gabbaï et Sallaï : neuf cent vingt-huit[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement dans ce contexte : « À côté de lui », si l’expression est comprise dans un sens spatial plutôt que comme l’indication d’une succession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Après lui venaient
  rationale: L’expression signifie littéralement « et après lui ». Dans cette liste, elle indique vraisemblablement la succession des personnes ou des groupes recensés. Le verbe « venaient », sous-entendu en hébreu, donne une phrase française naturelle sans préciser davantage la relation.
- source_word: גַּבַּי
  choice: Gabbaï
  rationale: Nom propre translittéré en français moderne ; le tréma indique que les deux voyelles se prononcent séparément.
- source_word: סַלָּי
  choice: Sallaï
  rationale: Nom propre translittéré en français moderne ; le redoublement de la consonne reflète la forme hébraïque et le tréma distingue les voyelles finales.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: neuf cent vingt-huit
  rationale: Le nombre hébreu correspond sans ambiguïté à 928. Son écriture en toutes lettres convient au registre biblique courant ; « cent » reste invariable puisqu’il est suivi d’un autre nombre.
