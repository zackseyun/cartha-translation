revisions:
- from: Le responsable des Lévites à Jérusalem était Ouzzi, fils de Bani, fils de Hashabia, fils de Mattania, fils de Mika, l’un des descendants d’Asaph, les chantres, chargé du travail de la maison de Dieu.[a]
  to: Le responsable des Lévites à Jérusalem était Ouzzi, fils de Bani, fils de Hashabia, fils de Mattania, fils de Mika, de la lignée d’Asaph, parmi les chanteurs, ayant la charge du travail de la maison de Dieu.[a]
  rationale: La révision résout l’ambiguïté syntaxique concernant les descendants d’Asaph et les chanteurs, modernise légèrement le registre, et précise la fonction d’Ouzzi comme responsabilité sur le travail sans dépasser l’ambiguïté contextuelle de לְנֶגֶד.
