base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: fr
  text: Le responsable des Lévites à Jérusalem était Ouzzi, fils de Bani, fils de Hashabia, fils de Mattania, fils de Mika, de la lignée d’Asaph, parmi les chanteurs, ayant la charge du travail de la maison de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsable du travail de la maison de Dieu ». L’expression hébraïque avec לְנֶגֶד peut exprimer une responsabilité ou une fonction de supervision par rapport au travail du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: Le responsable des Lévites
  rationale: פְקִיד désigne une personne établie dans une fonction de surveillance ou d’administration. « Responsable » exprime naturellement cette fonction officielle sans lui donner une nuance militaire ou ecclésiastique étrangère au texte.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition בְּ a ici un sens locatif; « à Jérusalem » est la tournure française idiomatique.
- source_word: עֻזִּי בֶן בָּנִי בֶּן חֲשַׁבְיָה בֶּן מַתַּנְיָה בֶּן מִיכָא
  choice: Ouzzi, fils de Bani, fils de Hashabia, fils de Mattania, fils de Mika
  rationale: La répétition de « fils de » conserve clairement la chaîne généalogique hébraïque. Les noms sont translittérés sous des formes lisibles en français.
- source_word: מִבְּנֵי אָסָף
  choice: l’un des descendants d’Asaph
  rationale: Littéralement « d’entre les fils d’Asaph »; dans ce cadre généalogique et professionnel, « l’un des descendants d’Asaph » communique plus clairement le sens en français moderne.
- source_word: הַמְשֹׁרְרִים
  choice: les chantres
  rationale: Le participe désigne ceux qui exercent la fonction de chanteurs dans le culte. « Chantres » est précis, digne et plus spécifique que « musiciens ».
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: chargé du travail
  rationale: Dans ce contexte administratif, לְנֶגֶד peut indiquer une responsabilité relative au travail. Cette formulation française rend ce sens tout en signalant l’incertitude dans la note.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction conserve l’image hébraïque transparente; le contexte indique qu’il s’agit du temple.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe généalogique est conservée, tandis que « descendants » clarifie l’emploi collectif de « fils ». La note maintient l’ambiguïté de לְנֶגֶד entre responsabilité et affectation.
