base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: fr
  text: Mattania, fils de Mica, fils de Zabdi, fils d’Asaph, était le chef, celui qui commençait l’action de grâce dans la prière[a] ; Bakboukia était le second parmi ses frères ; et Abda, fils de Shammoua, fils de Galal, fils de Yedoutoun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu est condensé : « chef du commencement, rendant grâce pour/à la prière ». Il peut indiquer que Mattania dirigeait ou inaugurait l’action de grâce ; le rapport exact entre l’action de grâce et la prière demeure incertain.'
    reason: La construction רֹאשׁ הַתְּחִלָּה יְהוֹדֶה לַתְּפִלָּה est syntaxiquement condensée. La note préserve les possibilités sans ajouter l’idée d’un chant.
lexical_decisions:
- source_word: רֹאשׁ
  choice: le responsable
  rationale: Le terme désigne ici celui qui occupe la fonction dirigeante. « Responsable » restitue cette idée naturellement sans imposer un titre administratif plus précis que l’hébreu.
- source_word: הַתְּחִלָּה
  choice: chargé d’entonner
  rationale: 'Le nom « commencement » précise vraisemblablement le rôle de Mattania : il donnait le départ au chant liturgique. La tournure verbale française rend cette fonction sans reproduire une construction hébraïque obscure.'
- source_word: יְהוֹדֶה
  choice: les actions de grâce
  rationale: Dans ce contexte cultuel, le hiphil de ידה évoque l’action de remercier ou de louer. « Actions de grâce » convient au cadre liturgique tout en évitant le sens moins probable de confession.
- source_word: לַתְּפִלָּה
  choice: pendant la prière
  rationale: La préposition ל relie ici vraisemblablement l’action de grâce au moment ou au cadre de la prière. « Pendant la prière » est idiomatique, tandis que la note conserve d’autres rapports syntaxiques possibles.
- source_word: מִשְׁנֶה
  choice: le deuxième
  rationale: Le mot indique une seconde place ou un rang secondaire. La formulation concise préserve l’indétermination sur la nature exacte de cette position.
- source_word: מֵאֶחָיו
  choice: parmi ses frères
  rationale: Cette traduction garde l’expression familiale du texte hébreu sans l’expliciter comme « autres lévites » ou « membres de son groupe ».
- source_word: יְדִיתוּן
  choice: Yedoutoun
  rationale: Transcription française usuelle du nom hébreu, avec une initiale correspondant à la prononciation moderne de la consonne י.
theological_decisions:
- issue: Sens de ידה dans le cadre du culte
  choice: rendre grâce
  alternative: confesser
  rationale: Le contexte lévitique et liturgique, ainsi que le lien avec Asaph, favorisent nettement l’idée de louange reconnaissante. Le sens de « confesser » demeure lexicalement possible ailleurs, mais il est peu probable ici.
- issue: Fonction exacte de Mattania dans la prière
  choice: il dirigeait en entonnant les actions de grâce
  alternative: il était le chef au commencement et rendait grâce dans la prière
  rationale: La syntaxe hébraïque est condensée et difficile. Le texte principal exprime la compréhension fonctionnelle la plus probable, tandis que la note signale une traduction plus littérale afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres suivent des formes françaises courantes. Les trois segments coordonnés de l’hébreu sont répartis en phrases brèves pour rendre la liste intelligible, sans modifier les relations généalogiques ni les rangs mentionnés.
