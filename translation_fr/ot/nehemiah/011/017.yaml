revisions:
- from: Mattania, fils de Michée, fils de Zabdi, fils d’Asaph, était le responsable chargé d’entonner les actions de grâce pendant la prière[a]. Bakboukia était le deuxième parmi ses frères. Il y avait aussi Abda, fils de Shammoua, fils de Galal, fils de Yedoutoun.
  to: Mattania, fils de Mica, fils de Zabdi, fils d’Asaph, était le chef, celui qui commençait l’action de grâce dans la prière[a] ; Bakboukia était le second parmi ses frères ; et Abda, fils de Shammoua, fils de Galal, fils de Yedoutoun.
  rationale: La révision supprime l’implication non exprimée selon laquelle Mattania « entonnait » un chant et l’ajout « Il y avait aussi ». Elle rend plus directement le rôle de tête et d’initiateur, maintient « action de grâce » dans son contexte cultuel, et reformule la note afin de conserver l’ambiguïté syntaxique du texte hébreu.
