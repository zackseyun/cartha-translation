  rationale: Translittération proche de l'hébreu et adaptée à la prononciation française.
- source_word: יָכִין
  choice: Yakin
  rationale: Translittération française directe du nom hébreu, cohérente avec la révision fournie.
theological_decisions:
- issue: Rapport syntaxique de Yakin avec les noms précédents
  choice: Présenter Yakin comme un second prêtre au moyen de « et »
  alternative: Lire « Yakin » comme un élément supplémentaire sans conjonction explicite, ou comme lié à la lignée précédente
  rationale: Le texte massorétique juxtapose les noms après « Parmi les prêtres ». Dans le contexte de la liste, l'ajout discret de « et » rend en français la coordination implicite sans imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Les anthroponymes sont translittérés au plus près de l'hébreu selon des graphies accessibles aux lecteurs francophones.
