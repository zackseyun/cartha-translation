id: NEH.11.13
reference: Nehemiah 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶחָי/ו֙ רָאשִׁ֣ים לְ/אָב֔וֹת מָאתַ֖יִם אַרְבָּעִ֣ים וּ/שְׁנָ֑יִם וַ/עֲמַשְׁסַ֧י בֶּן עֲזַרְאֵ֛ל בֶּן אַחְזַ֥י בֶּן מְשִׁלֵּמ֖וֹת בֶּן אִמֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/013.yaml
  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: fr
  text: et ses frères[a], chefs de maisons ancestrales, au nombre de 242 ; et Amashsaï, fils d’Azarel, fils d’Ahzaï, fils de Meshillémoth, fils d’Immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, le mot « frères » peut aussi désigner des hommes apparentés appartenant au même groupe familial ou sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: et ses frères[a]
  rationale: « Frères » traduit directement le pluriel de אָח avec suffixe, tout en laissant la note signaler que le terme peut désigner plus largement des hommes apparentés du même groupe familial ou sacerdotal.
- source_word: רָאשִׁים לְאָבוֹת
  choice: chefs de maisons ancestrales
  rationale: Cette expression rend la structure sociale des « maisons paternelles », c’est-à-dire des groupes familiaux issus d’un ancêtre, dans un français actuel et compréhensible.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: au nombre de 242
  rationale: Le nombre hébreu est exactement 242 ; l’ajout idiomatique « au nombre de » clarifie sa fonction dans cette liste administrative.
- source_word: וַעֲמַשְׁסַי
  choice: et Amashsaï
  rationale: Translittération française proche de la forme massorétique propre à ce verset, sans l’harmoniser avec le nom Amasaï.
- source_word: בֶּן
  choice: fils de
  rationale: La formule généalogique répétée est rendue littéralement ; elle peut parfois indiquer une filiation plus lointaine, mais rien n’impose ici de remplacer « fils » par « descendant ».
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Translittération française régulière du nom propre hébreu.
- source_word: אַחְזַי
  choice: Ahzaï
  rationale: Translittération française qui conserve la forme du nom attestée dans ce verset.
- source_word: מְשִׁלֵּמוֹת
  choice: Meshillémoth
  rationale: Translittération française de la vocalisation massorétique du nom.
- source_word: אִמֵּר
  choice: Immer
  rationale: Translittération directe du nom propre, également porté par une famille sacerdotale.
