source:
  edition: WLC
  text: וְ/שַׁבְּתַ֨י וְ/יוֹזָבָ֜ד עַל הַ/מְּלָאכָ֤ה הַ/חִֽיצֹנָה֙ לְ/בֵ֣ית הָ/אֱלֹהִ֔ים מֵ/רָאשֵׁ֖י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: fr
  text: Shabbétaï et Yozabad, qui comptaient parmi les chefs des Lévites, étaient responsables des tâches extérieures liées à la maison de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du travail accompli à l’extérieur pour la maison de Dieu ». L’expression hébraïque peut désigner des tâches effectuées hors du sanctuaire proprement dit, par opposition aux fonctions exercées à l’intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: Shabbétaï et Yozabad
  rationale: Les noms propres sont translittérés directement de l’hébreu; la coordination française conserve la structure de la liste sans alourdir le début du verset par un « Et » peu naturel hors contexte immédiat.
- source_word: עַל
  choice: étaient responsables de
  rationale: Dans ce contexte administratif, la préposition exprime une responsabilité ou une supervision. Cette tournure est naturelle en français moderne.
- source_word: הַמְּלָאכָה הַחִיצֹנָה
  choice: des tâches extérieures
  rationale: מְלָאכָה désigne ici le travail ou les fonctions assignées; le pluriel collectif « tâches » convient au contexte. חִיצֹנָה indique ce qui est extérieur, sans préciser exactement s’il s’agit de tâches accomplies hors du sanctuaire ou d’affaires non internes.
- source_word: לְבֵית הָאֱלֹהִים
  choice: liées à la maison de Dieu
  rationale: Le לְ marque le rapport de ces tâches avec la maison de Dieu et peut avoir la nuance de destination ou d’intérêt. « Liées à » préserve cette relation sans imposer exclusivement « de » ou « pour ».
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: qui comptaient parmi les chefs des Lévites
  rationale: Cette formulation rend à la fois le sens partitif de מִן et la fonction dirigeante de רָאשֵׁי, dans un français idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation administrative « étaient responsables » est naturelle, tandis que « maison de Dieu » conserve l’expression biblique et évite de préciser indûment « Temple ».
