  source_fidelity: 'Le texte rend fidèlement la structure et le sens administratif de l’hébreu : Shabbétaï et Yozabad sont identifiés comme faisant partie des chefs lévitiques et ayant la charge de la « tâche extérieure » relative à la maison de Dieu. « Qui comptaient parmi » exprime bien le partitif מִן sans forcer une relation hiérarchique plus précise. « Liées à » conserve avec prudence la relation indiquée par לְ.'
