  text: וּ/מִן הַ/לְוִיִּ֔ם מַחְלְק֥וֹת יְהוּדָ֖ה לְ/בִנְיָמִֽין־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/036.yaml
  text: And from the Levites[a], divisions in Judah belonged to Benjamin.
translation:
  language: fr
  text: Et, parmi les lévites, des divisions en Juda relevaient de Benjamin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Et, parmi les lévites, des divisions de Juda étaient pour Benjamin. » L’hébreu est très condensé, et le rapport exact entre « Juda » et « Benjamin » reste implicite.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: Parmi
  rationale: Dans cette phrase nominale très elliptique, « parmi » rend naturellement l’idée partitive de מִן; le ו initial assure le lien avec la liste précédente sans exiger ici un « et » lourd en français.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Le nom désigne directement les membres de la tribu de Lévi; cette formulation simple n’ajoute aucune précision clanique absente de l’hébreu.
- source_word: מַחְלְקוֹת
  choice: des groupes
  rationale: Le terme peut désigner des divisions ou sections organisées. « Groupes » est clair en français courant tout en convenant au contexte administratif.
- source_word: יְהוּדָה
  choice: établis en Juda
  rationale: Le texte juxtapose « groupes » et « Juda » sans expliciter leur rapport. La formulation retient l’interprétation contextuelle selon laquelle ces groupes lévitiques se trouvaient sur le territoire de Juda, tout en signalant l’ellipse en note.
- source_word: לְבִנְיָמִין
  choice: furent rattachés à Benjamin
  rationale: La préposition לְ indique ici vraisemblablement une relation ou une affectation. « Rattachés à » exprime cette relation administrative sans suggérer une propriété stricte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase principale explicite avec prudence le lien administratif probable; la note conserve la forte concision et l’ambiguïté syntaxique de l’hébreu.
