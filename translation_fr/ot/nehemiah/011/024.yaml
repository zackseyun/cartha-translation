source:
  edition: WLC
  text: וּ/פְתַֽחְיָ֨ה בֶּן מְשֵֽׁיזַבְאֵ֜ל מִ/בְּנֵי זֶ֤רַח בֶּן יְהוּדָה֙ לְ/יַ֣ד הַ/מֶּ֔לֶךְ לְ/כָל דָּבָ֖ר לָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: fr
  text: Petahia, fils de Meshézabel, l’un des descendants de Zérah, fils de Juda, était auprès du roi[a] pour toute affaire concernant le peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la main du roi ». L’expression peut aussi signifier qu’il était l’agent du roi ou à son service.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour le peuple ». L’hébreu peut désigner les affaires concernant le peuple ou celles traitées en sa faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: Petahia
  rationale: Le nom est translittéré sous une forme naturelle en français. Le waw relie ce verset à la liste précédente, mais il n’est pas rendu par « et », peu naturel ici en français.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: fils de Meshézabel
  rationale: La construction généalogique est rendue directement, avec translittération du nom propre.
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: l’un des descendants de Zérah, fils de Juda
  rationale: Dans ce contexte généalogique, « descendants » exprime naturellement la valeur collective de « fils de », tandis que la filiation explicite de Zérah est conservée.
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: était auprès du roi
  rationale: Cette formulation française conserve l’idée de proximité avec le roi tout en pouvant évoquer une fonction officielle; une note signale les sens d’agent ou de serviteur royal.
- source_word: לְ/כָל דָּבָר
  choice: pour toute affaire
  rationale: דָּבָר désigne ici une affaire ou question administrative plutôt qu’une simple parole.
- source_word: לָ/עָם
  choice: concernant le peuple
  rationale: Cette traduction rattache le complément aux affaires traitées sans exclure l’autre possibilité, à savoir une action accomplie pour le peuple.
