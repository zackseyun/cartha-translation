  text: זָנֹ֤חַ עֲדֻלָּם֙ וְ/חַצְרֵי/הֶ֔ם לָכִישׁ֙ וּ/שְׂדֹתֶ֔י/הָ עֲזֵקָ֖ה וּ/בְנֹתֶ֑י/הָ וַ/יַּחֲנ֥וּ מִ/בְּאֵֽר שֶׁ֖בַע עַד גֵּֽיא הִנֹּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: fr
  text: à Zanoah, à Adoullam et dans leurs villages, à Lakish et dans ses champs, à Azéqa et dans les localités qui en dépendaient[a]. Ils s’établirent[b] de Beer-Shéba jusqu’à la vallée de Hinnom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses villes filles » ; c’est-à-dire les localités ou villages rattachés à Azéqa.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu signifie littéralement « camper » ou « dresser son camp » ; dans ce contexte, il peut désigner le fait de s’établir dans la région.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: Zanoah
  rationale: Nom de lieu translittéré; la préposition « à », implicite dans cette suite dépendant du contexte précédent, rend la liste naturelle en français.
- source_word: עֲדֻלָּם
  choice: Adoullam
  rationale: Forme française traditionnelle et transparente du nom de lieu.
- source_word: חַצְרֵיהֶם
  choice: les villages qui en dépendaient
  rationale: Dans une liste géographique, חָצֵר désigne des villages ou établissements ruraux rattachés aux villes principales; cette formulation évite le sens trompeur de « cours » ou « enclos ».
- source_word: לָכִישׁ
  choice: Lakish
  rationale: Translittération française courante du nom de lieu.
- source_word: שְׂדֹתֶיהָ
  choice: ses champs
  rationale: Conserve le sens concret de שָׂדֶה tout en évoquant naturellement les terres agricoles appartenant à Lakish.
- source_word: עֲזֵקָה
  choice: Azéqa
  rationale: Translittération adaptée à la lecture française.
- source_word: בְנֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Littéralement « ses filles »; l’expression hébraïque désigne ici les agglomérations rattachées à une ville principale. Le choix français transmet clairement la relation administrative ou territoriale.
- source_word: וַיַּחֲנוּ
  choice: ils s’établirent
  rationale: חנה signifie fondamentalement « camper », mais, dans le contexte du repeuplement et d’une aire d’habitation durable, « s’établir » exprime mieux la portée contextuelle sans effacer le sens littéral, signalé en note.
- source_word: מִבְּאֵר שֶׁבַע
  choice: depuis Beer-Shéba
  rationale: La préposition מִן marque le point de départ de l’étendue géographique; « depuis » convient à la construction corrélative avec « jusqu’à ».
- source_word: עַד גֵּיא הִנֹּם
  choice: jusqu’à la vallée de Hinnom
  rationale: Rend explicitement la limite géographique indiquée par עַד et conserve le nom propre de la vallée.
