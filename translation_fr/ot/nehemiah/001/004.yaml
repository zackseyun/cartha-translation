source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: fr
  text: Quand j’ai entendu ces paroles[a], je me suis assis, j’ai pleuré et j’ai été en deuil pendant des jours. Je jeûnais et priais devant le Dieu du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces choses » ou « ces événements ». Le mot hébreu peut désigner des paroles, des faits ou des choses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: Quand j’ai entendu
  rationale: La tournure narrative avec וַיְהִי et כְּ suivi de l’infinitif introduit ici une circonstance temporelle. Le français naturel n’a pas besoin de rendre littéralement « il arriva que ».
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: דְּבָרִים peut désigner des paroles, des faits ou des choses. Dans le contexte immédiat, il s’agit du contenu rapporté à Néhémie; « ces paroles » reste proche de la forme hébraïque tout en étant naturel.
- source_word: יָשַׁבְתִּי
  choice: je me suis assis
  rationale: יָשַׁב signifie ici s’asseoir. La forme pronominale est l’expression française idiomatique de cette réaction physique.
- source_word: וָאֶבְכֶּה
  choice: j’ai pleuré
  rationale: בכה est le verbe courant pour pleurer; ce choix est précis, actuel et digne.
- source_word: וָאֶתְאַבְּלָה יָמִים
  choice: porté le deuil pendant plusieurs jours
  rationale: אבל exprime le deuil ou une affliction manifestée, et יָמִים indique une durée indéterminée de plusieurs jours. « Porter le deuil » conserve cette nuance mieux que le seul « m’affliger ».
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: Je jeûnais et priais
  rationale: היה suivi de participes présente des actions en cours ou prolongées. L’imparfait français rend naturellement cette valeur durative.
- source_word: לִפְנֵי
  choice: devant
  rationale: לִפְנֵי signifie « devant » ou « en présence de ». « Devant » est concis et naturel dans le contexte de la prière.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: le Dieu du ciel
  rationale: Cette construction est un titre divin caractéristique d’Esdras-Néhémie. « Le Dieu du ciel » en donne une traduction directe et idiomatique.
theological_decisions:
- issue: Traduction du titre אֱלֹהֵי הַשָּׁמָיִם
  choice: le Dieu du ciel
  alternative: Dieu du ciel
  rationale: Le texte emploie un titre divin, non le nom YHWH. L’article défini convient en français et n’introduit aucune désignation absente de l’hébreu.
- issue: Nature du deuil exprimé par אבל
  choice: porté le deuil
  alternative: été dans l’affliction
  rationale: Le choix conserve la force concrète du terme sans décider si toutes les pratiques formelles de deuil étaient présentes.
translation_notes:
  register: Français international moderne, sobre et digne. La première phrase conserve l’enchaînement rapide des réactions de Néhémie; une nouvelle phrase met en relief la durée du jeûne et de la prière. L’imparfait rend la valeur continue des participes hébreux.
