source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: fr
  text: Que ton oreille soit attentive et tes yeux ouverts pour écouter la prière de ton serviteur, que je t’adresse maintenant[b] devant toi, jour et nuit, pour les fils d’Israël[a], tes serviteurs, tout en confessant les péchés des fils d’Israël que nous avons commis contre toi. Moi-même et la famille de mon père avons péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le peuple d’Israël » ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », expression qui souligne leur appartenance familiale.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « aujourd’hui » ; ici, le mot situe la prière en cours, faite « jour et nuit ».
    reason: source_language_clarification
lexical_decisions:
- source_word: תְּהִי נָא
  choice: Que … soit
  rationale: Le jussif accompagné de נָא exprime une supplication polie. En français, la tournure optative « Que … soit » restitue naturellement cette prière respectueuse.
- source_word: אָזְנְךָ קַשֶּׁבֶת וְעֵינֶיךָ פְתֻחוֹת
  choice: ton oreille soit attentive et tes yeux ouverts
  rationale: Cette formulation conserve le parallélisme et l’imagerie anthropomorphique du texte hébreu, avec l’oreille au singulier et les yeux au pluriel.
- source_word: לִשְׁמֹעַ אֶל תְּפִלַּת עַבְדְּךָ
  choice: pour écouter la prière de ton serviteur
  rationale: « Écouter » exprime ici l’attention demandée, tandis que « la prière de ton serviteur » garde le registre respectueux de l’adresse à Dieu.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ
  choice: que je fais maintenant devant toi
  rationale: Le participe indique une action en cours. « Faire une prière » est naturel en français, et « devant toi » conserve explicitement לְפָנֶיךָ.
- source_word: הַיּוֹם יוֹמָם וָלַיְלָה
  choice: maintenant, jour et nuit
  rationale: הַיּוֹם signifie littéralement « aujourd’hui », mais peut situer l’action présente; « maintenant » évite l’étrangeté de « aujourd’hui, jour et nuit » tout en conservant la continuité exprimée par « jour et nuit ». Une note signale la forme littérale.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: pour les fils d’Israël, tes serviteurs
  rationale: עַל désigne ici ceux en faveur de qui Néhémie prie. « Fils d’Israël » préserve l’expression familiale et fédérale du texte source.
- source_word: וּמִתְוַדֶּה
  choice: tout en confessant
  rationale: Le participe coordonné décrit une action simultanée à la prière; « tout en » rend clairement cette simultanéité.
- source_word: חַטֹּאות בְּנֵי יִשְׂרָאֵל אֲשֶׁר חָטָאנוּ לָךְ
  choice: les péchés des fils d’Israël que nous avons commis contre toi
  rationale: La formulation française rend naturellement le relatif hébreu et maintient que les fautes sont dirigées contre Dieu.
- source_word: וַאֲנִי וּבֵית אָבִי
  choice: Moi et la famille de mon père
  rationale: Le waw coordonne Néhémie et sa maison paternelle sans imposer un emphatique absent du texte. « Famille de mon père » communique en français moderne la portée familiale de בֵית אָבִי.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « ton oreille » et « tes yeux »
  alternative: Paraphraser par « sois attentif »
  rationale: L’image corporelle structure la supplication hébraïque et exprime l’attention divine demandée; la conserver respecte la rhétorique sans trancher la question de sa portée métaphorique.
- issue: Sens de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: le peuple d’Israël / les Israélites
  rationale: La traduction retenue préserve la formulation filiale explicite du texte hébreu ainsi que sa résonance familiale, sans la réduire à un simple nom collectif.
- issue: Inclusion personnelle de Néhémie dans la confession
  choice: Moi et la famille de mon père, nous avons péché
  alternative: Moi aussi et la maison de mon père, nous avons péché
  rationale: Le texte inclut sans réserve Néhémie et sa famille dans la culpabilité confessée. Il ne contient toutefois pas d’adverbe explicite correspondant à « aussi »; la simple coordination conserve cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement solennel de la prière, ses images corporelles et sa confession collective, tout en évitant les tournures inutilement archaïques.
