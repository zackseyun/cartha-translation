  text: וְ/שַׁבְתֶּ֣ם אֵלַ֔/י וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אִם יִהְיֶ֨ה נִֽדַּחֲ/כֶ֜ם בִּ/קְצֵ֤ה הַ/שָּׁמַ֨יִם֙ מִ/שָּׁ֣ם אֲקַבְּצֵ֔/ם ו/הבואתי/ם אֶל הַ/מָּק֔וֹם אֲשֶׁ֣ר בָּחַ֔רְתִּי לְ/שַׁכֵּ֥ן אֶת שְׁמִ֖/י שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: fr
  text: mais si vous revenez à moi, si vous gardez mes commandements et les mettez en pratique, même si ceux d’entre vous qui ont été dispersés[a] se trouvent à l’extrémité des cieux[b], je les rassemblerai de là et je les ramènerai au lieu que j’ai choisi pour y faire demeurer mon nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos exilés » ou « ceux d’entre vous qui ont été chassés ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « à l’extrémité des cieux » : expression désignant la distance la plus lointaine possible.'
    reason: cultural_note
  - marker: c
    text: Ou « pour y établir mon nom ». L’hébreu conserve l’image du nom de Dieu qui demeure dans le lieu choisi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: mais si vous revenez à moi
  rationale: Le verbe שׁוּב suivi de אֶל signifie couramment « revenir » ou « retourner vers ». La condition se poursuit depuis le verset précédent ; « mais si » explicite en français cette articulation et son contraste.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי וַעֲשִׂיתֶם אֹתָם
  choice: si vous gardez mes commandements et les mettez en pratique
  rationale: « Garder » conserve le vocabulaire de l’obéissance à l’alliance, tandis que « mettre en pratique » exprime naturellement l’acte de les accomplir sans fusionner les deux propositions hébraïques.
- source_word: נִדַּחֲכֶם
  choice: ceux d’entre vous qui ont été dispersés
  rationale: La formulation rend le sens passif de personnes chassées ou dispersées, tout en restant naturelle en français et en conservant le suffixe de deuxième personne.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: à l’extrémité des cieux
  rationale: Cette traduction assez formelle préserve l’image cosmique hébraïque désignant la distance la plus lointaine.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: je les rassemblerai de là
  rationale: קבץ est le verbe usuel du rassemblement de personnes dispersées, notamment dans le contexte du retour d’exil.
- source_word: וַהֲבֹאתִים
  choice: je les ramènerai
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Dans ce contexte de restauration après la dispersion, « ramener » est idiomatique et explicite la direction du retour.
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: le lieu que j’ai choisi
  rationale: La formulation rend directement le choix divin du lieu du sanctuaire et son effet toujours valable.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: pour y faire demeurer mon nom
  rationale: Le causatif de שכן et l’image du nom qui demeure sont conservés, plutôt que réduits à une simple commémoration ou localisation.
theological_decisions:
- issue: Formule de la présence divine au sanctuaire
  choice: pour y faire demeurer mon nom
  alternative: pour y établir mon nom
  rationale: L’hébreu emploie la formule liée au sanctuaire choisi, où le nom de Dieu demeure. Cette traduction conserve la tension entre la présence de Dieu associée au lieu et le refus de l’y enfermer spatialement.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle est explicitée par la répétition de « si ». Les images bibliques de l’extrémité des cieux et du nom qui demeure sont maintenues, avec des notes pour en éclairer le sens.
