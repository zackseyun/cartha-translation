  source_fidelity: 'La structure et les référents sont bien rendus : Hanani est identifié comme l’un des frères de Néhémie, accompagné d’hommes de Juda, et Jérusalem est le second objet de la demande. Toutefois, « après la captivité » transforme מן (« de / hors de », dans l’idée de survivants issus de la captivité) en simple repère temporel. Il convient de rendre explicitement que ces rescapés avaient survécu à la captivité.'
  naturalness: Le français est globalement naturel et de registre narratif soigné. La reformulation proposée évite l’expression peu idiomatique « restés de la captivité » tout en supprimant l’ambiguïté temporelle de « après la captivité ».
  terminology: « Juifs », avec note pour « Judéens », est recevable dans ce contexte perse. « Rescapés » rend bien הפליטה. « Captivité » conserve le terme de base, avec « exil » comme alternative en note. La note sur les rescapés est resserrée afin de ne pas introduire le « désastre », absent du texte.
  issues:
