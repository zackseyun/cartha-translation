  rationale: La révision remplace le repère temporel « après la captivité » par « qui avaient survécu à la captivité », expression française claire qui rend la relation exprimée par « les rescapés ... qui étaient restés de la captivité ». Les notes sont conservées avec leurs ancres et rendues plus strictement lexicales.
