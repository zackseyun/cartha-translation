  text: וַ/יָּבֹ֨א חֲנָ֜נִי אֶחָ֧ד מֵ/אַחַ֛/י ה֥וּא וַ/אֲנָשִׁ֖ים מִֽ/יהוּדָ֑ה וָ/אֶשְׁאָלֵ֞/ם עַל הַ/יְּהוּדִ֧ים הַ/פְּלֵיטָ֛ה אֲשֶֽׁר נִשְׁאֲר֥וּ מִן הַ/שֶּׁ֖בִי וְ/עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: fr
  text: Hanani, l’un de mes frères, arriva avec quelques hommes de Juda. Je les interrogeai au sujet des Juifs[a], les rescapés[b] qui avaient survécu à la captivité[c], ainsi qu’au sujet de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Le terme hébreu peut désigner le peuple de Juda ou le peuple juif au sens large.
    reason: lexical_alternative
  - marker: b
    text: Ou « survivants » ou « reste ».
    reason: lexical_alternative
  - marker: c
    text: Ou « l’exil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Le wayyiqtol de בוא exprime ici l’arrivée dans un récit au passé ; « arriva » est naturel en français.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Le nom propre est translittéré selon l’usage français.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: l’un de mes frères
  rationale: Cette traduction conserve le terme familial masculin et l’expression partitive de l’hébreu, sans l’élargir à « parent ».
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: avec quelques hommes de Juda
  rationale: « Avec » rend naturellement l’accompagnement implicite, et « quelques » évite une formulation française abrupte sans préciser indûment leur nombre.
- source_word: וָאֶשְׁאָלֵם
  choice: Je les interrogeai
  rationale: שׁאל signifie demander ou s’enquérir ; « interroger au sujet de » convient au registre narratif et à la recherche d’informations.
- source_word: הַיְּהוּדִים
  choice: les Juifs
  rationale: Dans le contexte perse, le terme peut désigner les Judéens ou, plus largement, le peuple juif. « Les Juifs » est ici l’expression française conventionnelle, avec l’alternative signalée en note.
- source_word: הַפְּלֵיטָה
  choice: rescapés
  rationale: Le substantif collectif désigne ceux qui ont échappé au désastre. « Rescapés » garde cette idée tout en s’intégrant naturellement à la phrase.
- source_word: אֲשֶׁר נִשְׁאֲרוּ
  choice: qui étaient restés
  rationale: Cette formulation conserve la proposition relative et la nuance résultative de שׁאר au nifal.
- source_word: מִן הַשֶּׁבִי
  choice: après la captivité
  rationale: Dans cette construction, מן peut situer les personnes comme restant de ou à la suite de la captivité. « Après la captivité » donne un français clair sans réduire שׁבי au seul déplacement géographique ; « exil » est indiqué en note.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: ainsi qu’au sujet de Jérusalem
  rationale: La formulation maintient Jérusalem comme second objet parallèle de la demande tout en évitant une répétition pesante.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La phrase hébraïque a été répartie en deux phrases françaises pour alléger la syntaxe, tout en conservant l’ordre narratif et les deux objets de la demande. Tous les marqueurs de note figurent immédiatement après les expressions concernées.
