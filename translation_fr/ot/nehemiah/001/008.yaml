  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: fr
  text: 'Souviens-toi, je t’en prie, de l’ordre que tu as donné à Moïse, ton serviteur : « Si vous êtes infidèles[a], je vous disperserai parmi les peuples[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Si vous vous montrez infidèles » ou « Si vous rompez votre engagement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi les nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Souviens-toi, je t’en prie
  rationale: L’impératif זְכָר appelle Dieu à se souvenir, tandis que נָא marque une supplication respectueuse. Cette formulation est naturelle et digne en français.
- source_word: הַדָּבָר
  choice: la parole
  rationale: דָּבָר désigne ici la déclaration transmise à Moïse. « La parole » en conserve la portée sans la réduire à une simple promesse.
- source_word: צִוִּיתָ
  choice: que tu as donnée
  rationale: צוה signifie littéralement « commander ». Avec « parole » comme complément et une déclaration comprenant un avertissement, « la parole que tu as donnée » est idiomatique en français tout en exprimant son origine autoritative.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: À propos de Moïse dans sa relation à Dieu, « serviteur » rend le statut de service officiel sans suggérer indûment l’esclavage au sens moderne.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rend directement l’infinitif hébreu qui introduit la citation.
- source_word: תִּמְעָלוּ
  choice: vous êtes infidèles
  rationale: מעל exprime une infidélité ou une rupture de foi, notamment dans un cadre d’alliance. Cette expression préserve cette nuance sans préciser une catégorie juridique absente du texte.
- source_word: אָפִיץ
  choice: je vous disperserai
  rationale: Le hiphil de פוץ signifie faire se disperser. « Disperser » convient naturellement au jugement d’exil annoncé ici.
- source_word: בָּעַמִּים
  choice: parmi les peuples
  rationale: Le pluriel עַמִּים désigne des collectivités humaines ou ethniques. « Peuples » suit de près l’hébreu; « nations » reste possible.
theological_decisions:
- issue: Nuance d’alliance du verbe מעל dans la proposition conditionnelle
  choice: Si vous êtes infidèles
  alternative: Si vous agissez avec infidélité / Si vous trahissez votre engagement
  rationale: La formulation conserve l’idée d’une rupture de fidélité dans le cadre de l’alliance, sans définir plus précisément la faute ni résoudre la portée exacte du terme.
translation_notes:
  register: Français international moderne, respectueux et accessible. Le tutoiement correspond à l’adresse directe à Dieu; le pluriel « vous » dans la citation vise collectivement Israël. La tournure « je t’en prie » restitue la supplication de נָא sans alourdir la phrase.
