  text: דִּבְרֵ֥י נְחֶמְיָ֖ה בֶּן חֲכַלְיָ֑ה וַ/יְהִ֤י בְ/חֹֽדֶשׁ כסלו שְׁנַ֣ת עֶשְׂרִ֔ים וַ/אֲנִ֥י הָיִ֖יתִי בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: fr
  text: Paroles de Néhémie, fils de Hacalia[a]. Or, il arriva qu’au mois de Kislev, la vingtième année[b], alors que j’étais à Suse, la citadelle[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Récit de Néhémie, fils de Hacalia ». Le titre hébreu « Paroles de » peut introduire un récit ou un mémoire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la vingtième année ». Le verset ne précise pas de quel règne il s’agit ; la suite du contexte désigne Artaxerxès.
    reason: cultural_note
  - marker: c
    text: Ou « la forteresse ». Le terme hébreu désigne un complexe royal fortifié.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Paroles de
  rationale: Le pluriel construit de דָּבָר peut désigner les paroles, les faits ou le récit associés à une personne. « Paroles de » conserve la forme du titre hébreu; une note signale le sens possible de « récit ».
- source_word: נְחֶמְיָה
  choice: Néhémie
  rationale: Forme française biblique usuelle du nom propre.
- source_word: בֶּן חֲכַלְיָה
  choice: fils de Hacalia
  rationale: Rend directement la relation filiale; « Hacalia » est une forme française usuelle du nom.
- source_word: וַיְהִי
  choice: Au mois de Kislev
  rationale: La formule narrative introduit ici la circonstance temporelle. En français actuel, son effet se rend naturellement par l’entrée directe dans la datation, sans calque lourd tel que « il arriva que ».
- source_word: בְחֹדֶשׁ כסלו
  choice: au mois de Kislev
  rationale: Rend la formule de datation et translittère le nom du mois hébreu selon l’usage français courant.
- source_word: שְׁנַת עֶשְׂרִים
  choice: la vingtième année
  rationale: Préserve l’absence, dans ce verset, d’un souverain explicitement nommé.
- source_word: וַאֲנִי הָיִיתִי
  choice: j’étais
  rationale: Expression naturelle de la situation du narrateur au moment indiqué, sans surcharger la coordination hébraïque.
- source_word: בְשׁוּשַׁן
  choice: à Suse
  rationale: « Suse » est la forme française conventionnelle du toponyme.
- source_word: הַבִּירָה
  choice: la citadelle
  rationale: בִּירָה désigne ici le complexe royal fortifié; « citadelle » conserve ce sens architectural et politique.
