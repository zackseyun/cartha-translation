  text: וַ/יֹּאמְרוּ֮ לִ/י֒ הַֽ/נִּשְׁאָרִ֞ים אֲשֶֽׁר נִשְׁאֲר֤וּ מִן הַ/שְּׁבִי֙ שָׁ֣ם בַּ/מְּדִינָ֔ה בְּ/רָעָ֥ה גְדֹלָ֖ה וּ/בְ/חֶרְפָּ֑ה וְ/חוֹמַ֤ת יְרוּשָׁלִַ֨ם֙ מְפֹרָ֔צֶת וּ/שְׁעָרֶ֖י/הָ נִצְּת֥וּ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: fr
  text: 'Ils me répondirent : « Les survivants de la déportation[a], qui sont restés là, dans la province, sont dans une grande détresse et dans l’opprobre[b]. La muraille de Jérusalem est en brèche, et ses portes ont été brûlées par le feu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les survivants de la captivité » ou « les survivants de l’exil ». L’expression hébraïque peut désigner la captivité ou l’exil dont ils sont issus.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans un grand malheur et dans la honte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: Ils me répondirent
  rationale: Dans le contexte d’un échange commencé au verset précédent, le verbe narratif introduit leur réponse. Cette formulation est naturelle en français tout en conservant la progression du récit.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ
  choice: Ceux qui sont restés ... après avoir survécu
  rationale: Les deux formes de שׁאר soulignent la condition de ceux qui ont subsisté après la catastrophe. La formulation française évite une répétition pesante tout en exprimant à la fois le fait de rester et celui de survivre.
- source_word: מִן הַשְּׁבִי
  choice: à la déportation
  rationale: שְׁבִי peut désigner la captivité ou l’exil résultant de la déportation. « Déportation » convient au contexte historique et s’emploie naturellement avec « survivre », sans nier l’autre analyse possible signalée en note.
- source_word: בַּמְּדִינָה
  choice: dans la province
  rationale: À l’époque perse, מְדִינָה désigne une circonscription administrative. « Province » constitue l’équivalent historique le plus direct.
- source_word: בְּרָעָה גְדֹלָה
  choice: dans une grande détresse
  rationale: Ici, רָעָה désigne une situation de malheur ou d’adversité, non une faute morale. « Grande détresse » rend clairement la gravité de cette situation.
- source_word: וּבְחֶרְפָּה
  choice: et dans la honte
  rationale: חֶרְפָּה évoque la honte publique, l’opprobre ou le déshonneur. « Dans la honte » est clair et actuel, tout en préservant la dimension sociale du terme.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: La muraille de Jérusalem
  rationale: Le singulier collectif désigne l’ensemble des fortifications de la ville. « Muraille » est plus précis que « mur » dans ce contexte urbain.
- source_word: מְפֹרָצֶת
  choice: est éventrée
  rationale: Le participe passif de פרץ décrit une muraille ouverte par des brèches. « Éventrée » exprime de façon concise son état de ruine, sans impliquer nécessairement sa destruction totale.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: et ses portes ont été incendiées
  rationale: Le verbe exprime la destruction ou l’embrasement par le feu. « Ont été incendiées » rend naturellement en français l’expression hébraïque et son résultat encore visible.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste fluide, tandis que « province », « muraille » et « déportation » conservent la couleur historique. Les notes sont placées auprès des expressions auxquelles elles se rapportent, afin de préserver les possibilités lexicales de l’hébreu.
