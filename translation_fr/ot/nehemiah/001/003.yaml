    rationale: '« Après avoir survécu à la déportation » présente la déportation comme un événement antérieur auquel ils auraient survécu; le syntagme hébreu reste plus compact et peut se comprendre comme « de la captivité/de l’exil ». Une formulation nominale préserve mieux cette relation et le jeu entre « restés » et « survivants ». '
  - severity: low
    issue: « Incendiées » ajoute possiblement une intention
    rationale: 'Le verbe hébreu indique que les portes ont été brûlées/détruites par le feu, sans préciser l’auteur ni l’intention. '
  - severity: low
    issue: « Honte » atténue la notion de déshonneur public
    rationale: חֶרְפָּה désigne notamment l’opprobre ou le reproche social; « opprobre » est précis et demeure accessible dans ce registre.
