reference: Nehemiah 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: fr
  text: 'Et j’ai dit : « Je t’en prie, Yahweh, Dieu du ciel, Dieu grand et redoutable[a], toi qui gardes l’alliance et l’amour fidèle[b] envers ceux qui t’aiment et qui gardent tes commandements, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui inspire la crainte ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la fidélité à l’alliance » ou « la bonté constante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Et j’ai dit
  rationale: Le wayyiqtol introduit la prière de Néhémie et poursuit simplement le récit, sans ajouter une relation logique plus précise.
- source_word: אָֽנָּא
  choice: Je t’en prie
  rationale: Cette particule exprime une supplication respectueuse. La formulation est naturelle en français moderne et convient à une prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin du texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Dieu du ciel
  rationale: Expression française idiomatique correspondant à la construction hébraïque.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: Dieu grand et redoutable
  rationale: « Grand » conserve le sens premier de גָּדוֹל, tandis que « redoutable » exprime la crainte révérencielle suscitée par נוֹרָא sans l’affaiblissement que pourrait subir « impressionnant ».
- source_word: שֹׁמֵר הַבְּרִית
  choice: toi qui gardes l’alliance
  rationale: Le participe caractérise Dieu comme celui qui demeure fidèle à l’alliance; « garder » préserve aussi l’écho lexical de la seconde occurrence de שׁמר.
- source_word: וָחֶסֶד
  choice: et l’amour fidèle
  rationale: Dans son association avec l’alliance, חֶסֶד désigne un amour loyal et constant. « Amour fidèle » reste lisible tout en conservant cette portée relationnelle et covenantale.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: envers ceux qui t’aiment et qui gardent tes commandements
  rationale: Les deux participes parallèles désignent les bénéficiaires de l’alliance et de l’amour fidèle de Dieu. La répétition de « qui » rend clairement leur coordination.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin; sa translittération préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Portée de חֶסֶד dans un contexte d’alliance
  choice: l’amour fidèle
  alternative: la fidélité à l’alliance / la bonté constante
  rationale: Le terme associe amour, loyauté et constance. La traduction choisie conserve cette densité sans imposer une paraphrase technique unique.
- issue: Nuance de נוֹרָא appliqué à Dieu
  choice: redoutable
  alternative: qui inspire la crainte / impressionnant
  rationale: Le mot décrit celui qui suscite la crainte et le respect. « Redoutable » maintient cette tension sans réduire le terme à une simple admiration.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est maintenu dans l’adresse directe à Dieu, conformément à l’usage biblique français courant. La phrase reste ouverte par une virgule finale, puisque la prière se poursuit au verset suivant.
