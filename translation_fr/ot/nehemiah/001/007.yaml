  text: חֲבֹ֖ל חָבַ֣לְנוּ לָ֑/ךְ וְ/לֹא שָׁמַ֣רְנוּ אֶת הַ/מִּצְוֺ֗ת וְ/אֶת הַֽ/חֻקִּים֙ וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוִּ֖יתָ אֶת מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: fr
  text: Nous nous sommes très mal conduits envers toi[a] et nous n’avons pas observé les commandements, les prescriptions et les décisions de justice[b] que tu as commandés à Moïse, ton serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe par une construction emphatique ; on peut aussi traduire : « Nous avons agi envers toi d’une manière tout à fait corrompue. »'
    reason: lexical_alternative
  - marker: b
    text: Ou « règles de droit » ou « jugements ». Le terme hébreu peut désigner des décisions juridiques ou des lois fondées sur des cas particuliers.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: nous avons eu […] une conduite profondément corrompue
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’idée verbale. « Profondément » restitue cette insistance sans reproduire artificiellement la répétition hébraïque.
- source_word: לָךְ
  choice: envers toi
  rationale: La préposition indique ici que la conduite coupable vise Dieu sur le plan relationnel. « Envers toi » s’accorde naturellement avec « conduite » tout en conservant cette orientation.
- source_word: שָׁמַרְנוּ
  choice: nous n’avons pas observé
  rationale: Avec des termes juridiques, שׁמר signifie respecter ou mettre en pratique. « Observer » convient au registre de la loi et s’applique naturellement aux trois noms qui suivent.
- source_word: הַמִּצְוֺת
  choice: les commandements
  rationale: Ce terme désigne les obligations expressément commandées et conserve ici sa portée juridique et covenantielle.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: חקים désigne des dispositions établies. « Prescriptions » est précis, actuel et distinct de « commandements » et de « décisions de justice ».
- source_word: הַמִּשְׁפָּטִים
  choice: les décisions de justice
  rationale: משפטים peut désigner des jugements juridiques, des règles de droit ou des cas de jurisprudence. « Décisions de justice » maintient la nuance judiciaire et la distinction entre les trois termes.
- source_word: צִוִּיתָ
  choice: tu avais donnés
  rationale: Dans l’expression française « donner des commandements, des prescriptions et des décisions », ce rendu communique naturellement l’acte d’autorité exprimé par צוה. Le plus-que-parfait situe cet acte antérieurement à la désobéissance confessée.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Pour Moïse dans sa relation à Dieu, « serviteur » est le titre contextuellement approprié et souligne son service mandaté.
theological_decisions:
- issue: Maintien de la triade juridique de la Torah
  choice: commandements, prescriptions et décisions de justice
  alternative: ordres, décrets et règles
  rationale: Les trois termes hébreux restent distincts afin de préserver la texture juridique du texte sans leur attribuer des catégories doctrinales plus étroites que celles qu’impose le passage.
- issue: Nature de la faute confessée
  choice: une conduite profondément corrompue envers Dieu
  alternative: nous avons gravement péché contre toi
  rationale: Le choix retenu suit le champ lexical de חבל et conserve l’image d’une conduite corrompue, sans remplacer celle-ci par le terme théologique plus général « pécher ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton de confession ainsi que les trois termes juridiques distincts, tout en évitant une répétition hébraïque peu naturelle en français.
