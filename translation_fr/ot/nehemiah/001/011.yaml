  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: fr
  text: Je t’en prie, Seigneur, que ton oreille soit attentive à la prière de ton serviteur et à celle de tes serviteurs qui prennent plaisir à craindre ton nom[a]. Je t’en prie, accorde aujourd’hui la réussite à ton serviteur et accorde-lui de trouver compassion[b] auprès de cet homme[c]. Or, j’étais échanson du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui désirent révérer ton nom » ou « qui prennent plaisir à éprouver de la crainte devant ton nom ».
    reason: lexical_alternative
  - marker: b
    text: Ou « accorde-lui de trouver faveur ». L’expression hébraïque parle littéralement de le donner « pour compassion » ou « pour miséricordes ».
    reason: lexical_alternative
  - marker: c
    text: « Cet homme » désigne le roi, que Néhémie présente dans la proposition suivante comme celui dont il était l’échanson.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא / נָא
  choice: Je t’en prie
  rationale: Ces particules expriment une supplication pressante. « Je t’en prie » est naturel, digne et permet de rendre leur répétition dans la prière.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit ici du titre divin Adonaï, employé en apostrophe, et non du tétragramme.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: que ton oreille soit attentive
  rationale: Cette formulation conserve l’image hébraïque de l’oreille tout en exprimant clairement la demande d’une écoute favorable.
- source_word: עַבְדְּךָ / עֲבָדֶיךָ
  choice: ton serviteur / tes serviteurs
  rationale: Dans cette prière, le terme exprime une humble relation de service envers Dieu sans mettre au premier plan un statut juridique d’esclave.
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: qui prennent plaisir à craindre ton nom
  rationale: « Prendre plaisir » rend la disposition volontaire exprimée par חפץ, tandis que « craindre ton nom » conserve la force et l’ambivalence révérencielle de l’expression biblique.
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: accorde aujourd’hui la réussite à ton serviteur
  rationale: Le hifil de צלח demande à Dieu de faire réussir son serviteur. Cette tournure est claire et garde Dieu comme auteur de la réussite.
- source_word: וּתְנֵהוּ לְרַחֲמִים
  choice: fais en sorte qu’il rencontre la compassion
  rationale: L’expression hébraïque signifie littéralement donner quelqu’un « pour compassion » et demande qu’il soit traité avec miséricorde. La formulation française conserve la notion de compassion sans produire un calque obscur.
- source_word: לִפְנֵי הָאִישׁ הַזֶּה
  choice: auprès de cet homme
  rationale: « Auprès de » exprime ici la relation à la personne devant laquelle Néhémie comparaîtra, tout en conservant la désignation volontairement indirecte « cet homme ».
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: Or, j’étais échanson du roi
  rationale: « Échanson » est le terme français précis pour cette charge de cour. « Or » marque naturellement le passage de la prière à la précision narrative.
theological_decisions:
- issue: Sens de עבד dans le langage de la prière
  choice: serviteur
  alternative: esclave
  rationale: Le mot peut désigner un esclave, mais il sert ici d’autodésignation humble devant Dieu. « Serviteur » respecte cette fonction sans imposer au passage un accent sur la condition juridique.
- issue: Portée de ירא appliqué au nom de Dieu
  choice: craindre ton nom
  alternative: révérer ton nom
  rationale: La formulation retenue préserve la tension biblique entre crainte, respect profond et émerveillement, plutôt que de la réduire silencieusement à la seule révérence.
- issue: Nature de la demande exprimée par רַחֲמִים
  choice: compassion
  alternative: faveur
  rationale: « Compassion » maintient la dimension de miséricorde du terme hébreu. « Faveur » est possible dans le contexte de cour, mais généralise davantage le sens.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve les images bibliques de l’oreille attentive et de la crainte du nom de Dieu, mais évite les calques incompréhensibles. « Échanson », terme historique précis, reste suffisamment courant dans les traductions et récits anciens; le contexte indique immédiatement qu’il s’agit d’une fonction auprès du roi.
