source:
  edition: WLC
  text: וְ/הֵ֥ם עֲבָדֶ֖י/ךָ וְ/עַמֶּ֑/ךָ אֲשֶׁ֤ר פָּדִ֨יתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּד֔וֹל וּ/בְ/יָדְ/ךָ֖ הַ/חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: fr
  text: Mais eux, ce sont tes serviteurs et ton peuple, que tu as rachetés[a] par ta grande puissance et par ta main forte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivrés » ; le verbe hébreu évoque une libération obtenue par une intervention délivrante.
    reason: lexical_alternative
  - marker: b
    text: Ou « ta main puissante » ; littéralement « ta main forte », expression courante désignant l'action puissante de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Mais eux, ce sont
  rationale: 'Dans la continuité de la supplication précédente, la conjonction a ici une nuance légèrement contrastive et récapitulative : malgré leur faute et leur dispersion, ils demeurent les serviteurs et le peuple de Dieu.'
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Le terme peut aussi désigner des esclaves, mais le contexte met en avant l'appartenance et le service dans la relation d'alliance avec Dieu.
- source_word: וְעַמֶּךָ
  choice: et ton peuple
  rationale: Le nom désigne collectivement la communauté appartenant à Dieu; le possessif est conservé explicitement.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif reprend naturellement en français « tes serviteurs et ton peuple ».
- source_word: פָּדִיתָ
  choice: tu as rachetés
  rationale: Le verbe exprime la libération obtenue par une intervention délivrante et conserve l'écho probable de la sortie d'Égypte.
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: par ta grande puissance
  rationale: Cette formulation française naturelle rend la puissance de Dieu comme le moyen de son intervention.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: et par ta main forte
  rationale: La traduction conserve l'image anthropomorphique hébraïque de la main comme expression de l'action efficace de Dieu, ainsi que le sens direct de l'adjectif « forte ».
theological_decisions:
- issue: Le langage de la rédemption dans la prière de Néhémie
  choice: rachetés
  alternative: délivrés; libérés moyennant rançon
  rationale: « Rachetés » préserve la portée historique et théologique du verbe, probablement évocatrice de l'Exode, sans lui imposer des précisions doctrinales postérieures absentes du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure disloquée « Mais eux, ce sont » restitue l'accent porté sur leur appartenance persistante à Dieu. L'accord de « rachetés » suit les deux antécédents masculins pluriels.
