source:
  edition: WLC
  text: צָד֣וּ צְעָדֵ֔י/נוּ מִ/לֶּ֖כֶת בִּ/רְחֹבֹתֵ֑י/נוּ קָרַ֥ב קִצֵּ֛י/נוּ מָלְא֥וּ יָמֵ֖י/נוּ כִּי בָ֥א קִצֵּֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/018.yaml
  text: They hunted our steps[a], so that we could not walk in our streets. Our end drew near; our days were fulfilled[c][b], for our end had come.
translation:
  language: fr
  text: Ils ont traqué nos pas[a], nous empêchant de marcher dans nos rues. Notre fin s’est approchée[b] ; nos jours étaient accomplis[c], car notre fin était venue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont épié nos pas » ou « ont guetté chacun de nos pas ». Le verbe hébreu évoque une poursuite hostile.
    reason: lexical_alternative
  - marker: b
    text: Ou « notre perte ». Le mot hébreu signifie « fin » et implique ici une issue funeste.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « nos jours étaient pleins », expression qui indique que le temps imparti était entièrement écoulé.
    reason: cultural_note
lexical_decisions:
- source_word: צָדוּ
  choice: Ils ont traqué
  rationale: Le verbe exprime ici une poursuite hostile, voire le fait d’épier ou de guetter. « Traquer » conserve cette force prédatrice sans préciser indûment la manière.
- source_word: צְעָדֵינוּ
  choice: nos pas
  rationale: Traduction concrète et directe qui préserve l’image de tous les déplacements surveillés.
- source_word: מִלֶּכֶת
  choice: nous empêchant de marcher
  rationale: La préposition מִן avec l’infinitif exprime ici l’empêchement. Cette formulation rend clairement le rapport avec la traque mentionnée auparavant.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: dans nos rues
  rationale: רְחֹבוֹת peut désigner des rues, des places ou des espaces urbains ouverts. « Rues » convient naturellement au contexte des déplacements dans la ville.
- source_word: קָרַב קִצֵּינוּ
  choice: Notre fin approchait
  rationale: La traduction garde le sens fondamental de קֵץ, « fin », et le mouvement exprimé par קָרַב, sans expliciter la destruction seulement impliquée par le contexte.
- source_word: מָלְאוּ יָמֵינוּ
  choice: nos jours étaient accomplis
  rationale: Littéralement, « nos jours étaient pleins ». « Étaient accomplis » transmet en français actuel l’idée que le temps imparti était arrivé à son terme.
- source_word: כִּי בָא קִצֵּינוּ
  choice: car notre fin était venue
  rationale: « Car » rend la valeur explicative de כִּי. La répétition de « notre fin » reproduit celle de קִצֵּינוּ dans l’hébreu.
theological_decisions:
- issue: Portée de « notre fin »
  choice: Conserver « notre fin »
  alternative: « notre perte » ou « notre destruction »
  rationale: Le contexte évoque clairement une issue funeste, mais le terme hébreu signifie d’abord « fin ». La formulation retenue préserve cette tension sans ajouter une précision doctrinale ou historique absente du mot lui-même.
translation_notes:
  register: Français international moderne, sobre et digne. La traduction conserve l’image concrète des pas traqués, la répétition de « notre fin » et l’ambiguïté mesurée du terme קֵץ, tout en explicitant naturellement en français la notion d’empêchement.
