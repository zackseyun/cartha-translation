translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe conserve le parallélisme et la portée universelle du verset; le conditionnel «entreraient» rend l’événement envisagé depuis le point de vue passé sans réduire l’énoncé à une simple possibilité.
