  text: לֹ֤א הֶאֱמִ֨ינוּ֙ מַלְכֵי אֶ֔רֶץ ו/כל יֹשְׁבֵ֣י תֵבֵ֑ל כִּ֤י יָבֹא֙ צַ֣ר וְ/אוֹיֵ֔ב בְּ/שַׁעֲרֵ֖י יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/012.yaml
  text: The kings of the earth did not believe[a], nor did any of the inhabitants of the world, that an adversary and an enemy would enter the gates of Jerusalem.
translation:
  language: fr
  text: Ni les rois de la terre ni aucun des habitants du monde ne croyaient qu’un adversaire et un ennemi entreraient par les portes de Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le verbe hébreu est au singulier : « viendrait aux portes de Jérusalem ». Dans ce contexte, « venir » aux portes implique l’entrée dans la ville ; le français emploie naturellement le pluriel avec les deux noms coordonnés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִינוּ
  choice: ne croyaient pas
  rationale: Le hifil de אמן exprime ici le fait de tenir pour vrai ou crédible; la proposition introduite par כִּי précise ce qu’ils ne croyaient pas.
- source_word: מַלְכֵי אֶרֶץ
  choice: les rois de la terre
  rationale: En parallèle avec «les habitants du monde», אֶרֶץ a ici une portée universelle plutôt que locale.
- source_word: וְכָל יֹשְׁבֵי תֵבֵל
  choice: ni aucun des habitants du monde
  rationale: Après la négation, «ni aucun» rend naturellement en français la coordination hébraïque et sa portée universelle; תֵבֵל désigne le monde habité.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce qui n’était pas cru, et non une proposition causale.
- source_word: יָבֹא
  choice: entreraient
  rationale: Le verbe signifie littéralement «viendraient», mais avec les portes de Jérusalem il décrit une entrée; le conditionnel français convient au discours indirect régi par un verbe au passé.
- source_word: צַר
  choice: un adversaire
  rationale: «Adversaire» conserve la valeur propre de צַר et le distingue du terme courant pour «ennemi» qui suit.
- source_word: וְאוֹיֵב
  choice: et un ennemi
  rationale: אוֹיֵב est le terme usuel pour «ennemi»; conserver les deux substantifs respecte l’insistance du texte hébreu.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: par les portes de Jérusalem
  rationale: Avec un verbe de mouvement, בְּ peut marquer le lieu ou le passage d’entrée; «par les portes» exprime naturellement en français la pénétration dans la ville.
