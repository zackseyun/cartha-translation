  text: דָּבַ֨ק לְשׁ֥וֹן יוֹנֵ֛ק אֶל חכּ֖/וֹ בַּ/צָּמָ֑א עֽוֹלָלִים֙ שָׁ֣אֲלוּ לֶ֔חֶם פֹּרֵ֖שׂ אֵ֥ין לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/004.yaml
  text: The tongue of the nursing infant sticks to the roof of his mouth because of thirst[a]; children ask for bread[b], but no one breaks it for them.
translation:
  language: fr
  text: La langue du nourrisson se colle à son palais sous l’effet de la soif ; les petits enfants demandent du pain, mais personne ne leur en distribue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y a personne qui rompe ou répartisse [du pain] pour eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבַק
  choice: se colle
  rationale: Le verbe exprime une adhérence forte. « Se colle » rend naturellement en français l’effet physique de la déshydratation.
- source_word: לְשׁוֹן
  choice: la langue
  rationale: Le sens anatomique direct convient au contexte et conserve l’image concrète.
- source_word: יוֹנֵק
  choice: du nourrisson
  rationale: Le participe substantivé désigne un très jeune enfant encore allaité ; « nourrisson » est actuel, clair et pathétique sans amplification.
- source_word: אֶל חכּוֹ
  choice: à son palais
  rationale: חֵךְ désigne le palais, c’est-à-dire la voûte de la bouche. « Palais » est précis et naturel en français.
- source_word: בַּצָּמָא
  choice: sous l’effet de la soif
  rationale: La préposition présente ici la soif comme la cause ou la circonstance de l’adhérence ; cette formulation française exprime clairement le rapport causal.
- source_word: עוֹלָלִים
  choice: les petits enfants
  rationale: Le terme désigne de jeunes enfants. L’adjectif « petits » conserve la nuance d’âge et accentue leur vulnérabilité sans dépasser le sens lexical.
- source_word: שָׁאֲלוּ
  choice: demandent
  rationale: Le verbe signifie fondamentalement « demander ». Le contexte exprime déjà l’urgence, sans qu’il soit nécessaire de traduire par « supplier ».
- source_word: לֶחֶם
  choice: du pain
  rationale: Le nom concret est conservé plutôt que généralisé en « nourriture ».
- source_word: פֹּרֵשׂ
  choice: partage
  rationale: Dans ce contexte, le participe évoque vraisemblablement l’action de rompre ou de distribuer du pain. « Partager » communique naturellement la distribution destinée aux enfants tout en gardant l’objet sous-entendu.
- source_word: אֵין לָהֶם
  choice: personne ne leur en
  rationale: La construction signifie littéralement qu’il n’y a pour eux personne accomplissant l’action. Cette tournure est idiomatique en français, et « en » reprend le pain.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le présent rend la scène immédiate. Le parallélisme entre le nourrisson assoiffé et les petits enfants privés de pain est maintenu ; le point-virgule reproduit la progression du verset.
