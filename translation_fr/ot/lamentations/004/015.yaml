  to: '« Écartez-vous ! Impurs ! » on leur cria. « Écartez-vous, écartez-vous, ne touchez pas ! » Car ils se sont enfuis[a], ils ont même erré. Parmi les nations, on disait : « Ils n’y séjourneront plus[b]. »'
