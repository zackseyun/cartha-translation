  text: ס֣וּרוּ טָמֵ֞א קָ֣רְאוּ לָ֗/מוֹ ס֤וּרוּ ס֨וּרוּ֙ אַל תִּגָּ֔עוּ כִּ֥י נָצ֖וּ גַּם נָ֑עוּ אָֽמְרוּ֙ בַּ/גּוֹיִ֔ם לֹ֥א יוֹסִ֖יפוּ לָ/גֽוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/015.yaml
  text: “Turn aside! Unclean!” they cried to them[a]. “Turn aside, turn aside, do not touch!” For they have fled; they have even wandered. Among the nations they said[b], “They will stay no longer.”
translation:
  language: fr
  text: '« Écartez-vous ! Impurs ! » on leur cria. « Écartez-vous, écartez-vous, ne touchez pas ! » Car ils se sont enfuis[a], ils ont même erré. Parmi les nations, on disait : « Ils n’y séjourneront plus[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ont été chassés ». Le verbe hébreu est rare, et sa nuance exacte est discutée ici.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Ils ne résideront plus en étrangers. » Le verbe hébreu évoque le fait de résider quelque part comme étranger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: Écartez-vous
  rationale: L’impératif pluriel ordonne de se tenir à distance. « Écartez-vous » conserve l’idée de se détourner ou de se mettre hors du chemin sans imposer celle d’une expulsion définitive. La répétition est maintenue.
- source_word: טָמֵא
  choice: Impurs
  rationale: Le terme désigne l’impureté rituelle et sociale. Le pluriel français s’accorde naturellement avec les personnes interpellées, bien que l’hébreu emploie une forme singulière comme cri d’avertissement.
- source_word: קָרְאוּ לָמוֹ
  choice: leur criait-on
  rationale: קרא avec ל introduit une parole adressée à quelqu’un. La tournure impersonnelle française rend le sujet collectif non précisé et l’urgence du cri public.
- source_word: אַל תִּגָּעוּ
  choice: ne les touchez pas
  rationale: נגע signifie littéralement « toucher ». Le pronom objet, implicite en hébreu, est explicité en français pour éviter que l’ordre soit incomplet ou ambigu.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit une explication et s’intègre au mouvement poétique du verset.
- source_word: נָצוּ
  choice: ils se sont enfuis
  rationale: Le verbe rare semble décrire la fuite ou l’éloignement forcé. « Se sont enfuis » convient au parallélisme, tandis que l’autre nuance possible est signalée en note.
- source_word: גַּם נָעוּ
  choice: ils sont même partis à l’aventure
  rationale: נוע évoque ici le déplacement errant. Cette formulation française exprime une errance sans destination; « même » rend la progression marquée par גַּם.
- source_word: אָמְרוּ בַגּוֹיִם
  choice: Parmi les nations, on disait
  rationale: La tournure impersonnelle préserve l’indétermination du sujet de אָמְרוּ et situe la parole au milieu des nations.
- source_word: לֹא יוֹסִיפוּ לָגוּר
  choice: Ils n’y séjourneront plus
  rationale: גור désigne le fait de résider comme étranger ou résident temporaire. « Séjourner » garde cette nuance tout en restant intelligible; « y » reprend naturellement le lieu exprimé par « parmi les nations ».
theological_decisions:
- issue: Identité de ceux qui prononcent la parole parmi les nations
  choice: Sujet indéfini rendu par « on disait »
  alternative: « Les nations disaient » ou « ils disaient parmi les nations »
  rationale: Le verbe hébreu est au pluriel sans sujet explicite. La traduction évite d’identifier dogmatiquement les locuteurs aux nations ou aux fugitifs.
translation_notes:
  register: Français international actuel, poétique et digne. Les impératifs répétés conservent la violence du rejet public. La tournure impersonnelle « on » rend les sujets collectifs non nommés sans alourdir le vers.
