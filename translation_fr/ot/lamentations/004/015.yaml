review_pass:
  verdict: revise
  source_fidelity: La structure, la répétition des impératifs, le cri d’« impureté », ainsi que l’incertitude de נָצוּ sont globalement bien rendus. Toutefois, « ne les touchez pas » introduit un objet (« les ») absent de l’hébreu et réduit une formulation elliptique. « Partis à l’aventure » évoque en français un départ volontaire et aventureux, ce qui ne rend pas l’errance contrainte ou désorientée de נָעוּ. Le parfait hébreu de la première clameur se rend plus naturellement par un passé ponctuel en français.
  naturalness: « On leur cria » et « ne touchez pas » donnent une diction française actuelle, concise et poétique. « Ils ont même erré » est idiomatique sans suggérer une aventure choisie. « Ils n’y séjourneront plus » conserve un registre accessible et la nuance de résidence temporaire ou étrangère peut être précisée en note.
  terminology: « Impurs » convient au cri public désignant des personnes rituellement impures. « Séjourner » est approprié pour גור, à condition que la note explicite sa nuance de résidence en étranger. Aucune décision théologique supplémentaire n’est requise.
