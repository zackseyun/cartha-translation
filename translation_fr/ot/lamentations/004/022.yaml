  text: תַּם עֲוֺנֵ/ךְ֙ בַּת צִיּ֔וֹן לֹ֥א יוֹסִ֖יף לְ/הַגְלוֹתֵ֑/ךְ פָּקַ֤ד עֲוֺנֵ/ךְ֙ בַּת אֱד֔וֹם גִּלָּ֖ה עַל חַטֹּאתָֽיִ/ךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/022.yaml
  text: Your punishment is finished[a], daughter Zion; he will not exile you again. He has punished your iniquity, daughter Edom[c][b]; he has uncovered your sins.
translation:
  language: fr
  text: Ta peine est terminée[a], fille de Sion ; il ne t’enverra plus en exil. Il a puni ta faute[b], fille d’Édom ; il a dévoilé tes péchés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ta faute est arrivée à son terme » ou « Ta culpabilité a pris fin ». Le mot hébreu peut désigner la faute, la culpabilité ou la peine qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: Ou « il a demandé compte de ta faute » ou, plus littéralement, « il a visité ta faute ». Le verbe hébreu peut exprimer le fait de demander compte d’une faute en exerçant le jugement.
    reason: lexical_alternative
  - marker: c
    text: Ou « il a mis tes péchés à découvert » ou « il a révélé tes péchés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּם
  choice: est terminée
  rationale: Le parfait qal exprime l’achèvement. Avec « peine » comme sujet, « est terminée » est naturel en français et conserve l’idée d’une période arrivée à son terme.
- source_word: עֲוֺנֵךְ (première occurrence)
  choice: ta peine
  rationale: עָוֹן peut désigner la faute, la culpabilité ou la peine qui en résulte. La mention immédiate de la fin de l’exil favorise ici le sens de conséquence pénale, sans effacer les autres possibilités, signalées en note.
- source_word: בַּת צִיּוֹן
  choice: fille de Sion
  rationale: Cette formulation conserve la personnification poétique hébraïque de Sion et demeure compréhensible en français biblique moderne.
- source_word: לֹא יוֹסִיף לְהַגְלוֹתֵךְ
  choice: il ne t’enverra plus en exil
  rationale: La construction יָסַף suivie de l’infinitif marque la non-répétition ou la cessation. « Ne… plus » rend idiomatiquement cette valeur, tandis que « envoyer en exil » exprime clairement le hifil de גלה.
- source_word: פָּקַד
  choice: a demandé compte de
  rationale: Dans ce contexte judiciaire, פקד signifie intervenir au sujet d’une faute ou la faire entrer en ligne de compte. « Demander compte de » exprime le jugement sans réduire le verbe au seul châtiment déjà accompli.
- source_word: עֲוֺנֵךְ (seconde occurrence)
  choice: ta faute
  rationale: Ici, le mot est l’objet de פקד et se trouve en parallèle avec les « péchés » dévoilés. « Faute » met donc en avant la culpabilité d’Édom plutôt que sa peine.
- source_word: בַּת אֱדוֹם
  choice: fille d’Édom
  rationale: La traduction maintient la personnification parallèle à « fille de Sion ».
- source_word: גִּלָּה עַל חַטֹּאתָיִךְ
  choice: il a dévoilé tes péchés
  rationale: Le piel de גלה signifie découvrir, révéler ou exposer. « Dévoiler » conserve l’image de ce qui était caché et devient visible.
- source_word: חַטֹּאתָיִךְ
  choice: tes péchés
  rationale: « Péchés » est l’équivalent français direct et transparent du pluriel חַטֹּאות dans ce contexte moral et judiciaire.
theological_decisions:
- issue: Valeur de עָוֹן dans la première proposition
  choice: « ta peine »
  alternative: « ta faute » ou « ta culpabilité »
  rationale: La promesse selon laquelle Sion ne sera plus envoyée en exil indique que la conséquence judiciaire est arrivée à son terme. Une note préserve toutefois la polysémie du terme hébreu.
- issue: Sujet implicite de יוֹסִיף, פָּקַד et גִּלָּה
  choice: Le pronom « il » est conservé sans identifier explicitement le sujet.
  alternative: Ajouter « le SEIGNEUR » comme sujet
  rationale: Le contexte permet de comprendre un agent divin, mais le verset hébreu ne le nomme pas. Le pronom évite d’introduire une désignation absente du texte.
- issue: Force judiciaire de פקד appliqué à Édom
  choice: « a demandé compte de ta faute »
  alternative: « a puni ta faute » ou, plus littéralement, « a visité ta faute »
  rationale: La formulation choisie communique l’action judiciaire tout en préservant la tension entre mise en accusation, intervention et châtiment présente dans le champ sémantique du verbe.
translation_notes:
  register: Français international moderne, poétique et digne. Les personnifications « fille de Sion » et « fille d’Édom » sont maintenues. Le tutoiement singulier reflète les formes féminines singulières de l’hébreu. La ponctuation en deux phrases fait ressortir le contraste entre la fin de la peine de Sion et le jugement d’Édom.
