source:
  edition: WLC
  text: הָ/אֹֽכְלִים֙ לְ/מַ֣עֲדַנִּ֔ים נָשַׁ֖מּוּ בַּ/חוּצ֑וֹת הָ/אֱמֻנִים֙ עֲלֵ֣י תוֹלָ֔ע חִבְּק֖וּ אַשְׁפַּתּֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/005.yaml
  text: Those who used to eat delicacies are desolate in the streets[a]; those who were brought up on scarlet embrace ash heaps.
translation:
  language: fr
  text: Ceux qui mangeaient des mets délicats dépérissent dans les rues ; ceux qui étaient élevés sur l’écarlate étreignent des tas d’ordures.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des tas de cendres » ou « des tas de fumier » ; le terme hébreu désigne des endroits où s’accumulent les déchets et exprime une humiliation extrême.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹכְלִים לְמַעֲדַנִּים
  choice: ceux qui mangeaient des mets délicats
  rationale: Le participe substantivé désigne ceux qui avaient coutume de manger des aliments raffinés. L’imparfait français exprime naturellement cette situation passée, désormais renversée.
- source_word: נָשַׁמּוּ
  choice: dépérissent
  rationale: Dans ce contexte appliqué à des personnes exposées dans les rues, le verbe évoque leur état de dévastation et d’abandon. « Dépérissent » rend cette ruine humaine sans imposer la lecture psychologique « sont épouvantés ».
- source_word: בַּחוּצוֹת
  choice: dans les rues
  rationale: Le terme désigne les espaces publics extérieurs de la ville ; « dans les rues » est naturel et souligne leur exposition.
- source_word: הָאֱמֻנִים
  choice: ceux qui étaient élevés
  rationale: Le participe passif de אמן évoque des personnes nourries et élevées avec soin, non des personnes « fidèles ».
- source_word: עֲלֵי תוֹלָע
  choice: sur l’écarlate
  rationale: תולע désigne ici par métonymie une étoffe écarlate, produit de luxe teint avec la cochenille. La préposition est conservée afin de préserver l’image inhabituelle de personnes élevées sur de riches étoffes.
- source_word: חִבְּקוּ
  choice: étreignent
  rationale: Le verbe concret « étreindre » maintient le contraste saisissant entre le luxe d’autrefois et le contact présent avec les déchets.
- source_word: אַשְׁפַּתּוֹת
  choice: tas d’ordures
  rationale: Le nom désigne des amas de déchets, susceptibles d’inclure cendres et fumier. « Tas d’ordures » communique clairement l’humiliation extrême sans réduire indûment le terme aux seules cendres.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme et le contraste social du texte hébreu sont conservés. « Mets délicats » garde une dignité littéraire accessible ; « sur l’écarlate » préserve volontairement l’image condensée et légèrement énigmatique de l’original.
