  text: בְּנֵ֤י צִיּוֹן֙ הַ/יְקָרִ֔ים הַ/מְסֻלָּאִ֖ים בַּ/פָּ֑ז אֵיכָ֤ה נֶחְשְׁבוּ֙ לְ/נִבְלֵי חֶ֔רֶשׂ מַעֲשֵׂ֖ה יְדֵ֥י יוֹצֵֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/002.yaml
  text: The precious sons of Zion[a], weighed out against fine gold—how they are regarded as clay jars[b], the work of a potter’s hands.
translation:
  language: fr
  text: Les fils précieux de Sion[a], estimés à l’égal de l’or fin — comment sont-ils considérés comme des vases d’argile[b], œuvres façonnées par les mains d’un potier !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants de Sion ». L’expression hébraïque signifie littéralement « les fils de Sion » et peut désigner plus largement ses habitants.
    reason: lexical_alternative
  - marker: b
    text: Ou « des vases de terre cuite » ou « des pots d’argile ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי צִיּוֹן
  choice: les fils de Sion
  rationale: Rend littéralement l’expression masculine et poétique, sans la neutraliser, tout en laissant au contexte la possibilité qu’elle désigne plus largement les habitants de Sion.
- source_word: הַיְקָרִים
  choice: précieux
  rationale: Exprime à la fois la grande valeur et l’attachement affectif, dans un registre digne adapté à la lamentation.
- source_word: הַמְסֻלָּאִים בַּפָּז
  choice: estimés à l’égal de l’or fin
  rationale: Le participe passif peut évoquer une pesée ou, plus généralement, une évaluation par rapport à l’or. Cette formulation française naturelle conserve l’idée de comparaison de valeur sans imposer une pesée concrète.
- source_word: פָּז
  choice: or fin
  rationale: Désigne un or de grande qualité, pur ou raffiné; « or fin » est idiomatique et soutenu en français.
- source_word: אֵיכָה
  choice: comment
  rationale: Introduit l’étonnement douloureux caractéristique de la lamentation; l’exclamation finale en restitue la force.
- source_word: נֶחְשְׁבוּ
  choice: sont-ils considérés
  rationale: Rend le niphal de חשׁב, « être compté, tenu ou considéré comme », sans suggérer nécessairement une transformation matérielle.
- source_word: לְנִבְלֵי חֶרֶשׂ
  choice: comme des cruches d’argile
  rationale: נבל désigne ici des récipients, et חרס leur matière de terre cuite. « Cruches d’argile » est concret, naturel et maintient le contraste avec l’or.
- source_word: מַעֲשֵׂה יְדֵי יוֹצֵר
  choice: œuvre des mains d’un potier
  rationale: Préserve l’image concrète des mains et l’artisan potier, ainsi que le parallélisme poétique de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le tiret marque le renversement brutal entre la valeur de l’or et la fragilité de la poterie; l’exclamation restitue la douleur portée par אֵיכָה.
