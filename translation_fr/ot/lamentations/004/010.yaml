revisions:
- from: De leurs mains, des femmes pleines de compassion ont fait cuire leurs propres enfants[a] ; ils leur ont servi de nourriture lors du désastre de la fille de mon peuple[b].
  to: Les mains de femmes compatissantes ont fait cuire leurs propres enfants[a] ; ceux-ci leur ont servi de nourriture lors de la ruine de la fille de mon peuple[b].
  rationale: La révision rétablit l’image syntaxique et rhétorique des « mains » au début du verset et retire de la note culturelle une précision interprétative trop étroite. Elle ne modifie ni la dureté du propos ni son ambiguïté sémantique.
