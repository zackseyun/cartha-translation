source:
  edition: WLC
  text: יְדֵ֗י נָשִׁים֙ רַחֲמָ֣נִיּ֔וֹת בִּשְּׁל֖וּ יַלְדֵי/הֶ֑ן הָי֤וּ לְ/בָרוֹת֙ לָ֔/מוֹ בְּ/שֶׁ֖בֶר בַּת עַמִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/010.yaml
  text: The hands of compassionate women cooked their own children[b][a]; they became food for them in the destruction of the daughter of my people.
translation:
  language: fr
  text: Les mains de femmes compatissantes ont fait cuire leurs propres enfants[a] ; ceux-ci leur ont servi de nourriture lors de la ruine de la fille de mon peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont fait bouillir leurs propres enfants ». Le verbe hébreu désigne la cuisson, souvent dans l’eau.'
    reason: lexical_alternative
  - marker: b
    text: « La fille de mon peuple » est une expression poétique hébraïque qui personnifie mon peuple dans sa détresse.
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי נָשִׁים רַחֲמָנִיּוֹת
  choice: De leurs mains, des femmes pleines de compassion
  rationale: La formulation conserve l’image concrète des « mains » tout en restant naturelle en français, et maintient le contraste terrible entre la compassion habituelle de ces femmes et leur acte.
- source_word: בִּשְּׁלוּ
  choice: ont fait cuire
  rationale: Le verbe désigne la cuisson, vraisemblablement dans l’eau. « Faire cuire » rend le sens général sans imposer une précision plus étroite que le contexte.
- source_word: יַלְדֵיהֶן
  choice: leurs propres enfants
  rationale: « Propres » souligne naturellement en français la valeur du possessif hébreu et l’horreur du fait, sans ajouter un nouveau référent.
- source_word: הָיוּ לְבָרוֹת לָמוֹ
  choice: ils leur ont servi de nourriture
  rationale: Cette tournure française exprime clairement que les enfants sont devenus la nourriture de ces femmes, tout en reproduisant sobrement la proposition hébraïque.
- source_word: בְּשֶׁבֶר
  choice: lors du désastre
  rationale: שֶׁבֶר évoque la fracture, l’effondrement ou la ruine. « Désastre » convient ici à la catastrophe subie par le peuple et évite une expression française artificielle.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: La traduction littérale préserve la personnification poétique et prophétique du peuple, particulièrement de Jérusalem/Sion.
theological_decisions:
- issue: Maintien de l’expression בַּת עַמִּי
  choice: la fille de mon peuple
  alternative: mon peuple
  rationale: La personnification appartient à la poésie de la lamentation et ne doit pas être réduite à une simple désignation du peuple.
- issue: Degré d’explicitation de l’anthropophagie
  choice: ont fait cuire leurs propres enfants ; ils leur ont servi de nourriture
  alternative: ont préparé leurs enfants pour les manger
  rationale: Le texte hébreu est direct et terrifiant. La traduction en conserve la force sans ajouter un verbe explicite signifiant « manger » qui n’apparaît pas sous cette forme dans le verset.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme reste poétique, l’image des mains est conservée, et la violence du texte n’est pas atténuée. Les deux appels de note figurent explicitement dans le texte.
