  text: זַכּ֤וּ נְזִירֶ֨י/הָ֙ מִ/שֶּׁ֔לֶג צַח֖וּ מֵ/חָלָ֑ב אָ֤דְמוּ עֶ֨צֶם֙ מִ/פְּנִינִ֔ים סַפִּ֖יר גִּזְרָתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/007.yaml
  text: Her princes were purer than snow[a], whiter than milk; their bodies were more ruddy than corals[c][b], their form was like sapphire.
translation:
  language: fr
  text: Ses hommes consacrés étaient plus purs que la neige[a], plus blancs que le lait ; leurs corps étaient plus vermeils que le corail[b], leur aspect était comme le saphir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses nazirs » ; selon une autre interprétation, « ses princes ». Le terme hébreu désigne des personnes mises à part ou consacrées, mais pourrait évoquer ici les notables de Jérusalem.
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu est de sens incertain ; il pourrait désigner des rubis, des perles ou une autre matière précieuse rouge.
    reason: lexical_alternative
  - marker: c
    text: Le nom antique traduit par « saphir » pourrait désigner le lapis-lazuli plutôt que le saphir moderne.
    reason: cultural_note
lexical_decisions:
- source_word: נְזִירֶיהָ
  choice: ses hommes consacrés
  rationale: Le nom désigne fondamentalement des personnes mises à part ou consacrées, notamment par un vœu. Le contexte peut viser l’élite distinguée de Jérusalem, mais « hommes consacrés » conserve le sens lexical sans trancher en faveur de « princes ».
- source_word: זַכּוּ
  choice: étaient plus purs
  rationale: Le verbe exprime la pureté ou la netteté ; le comparatif français convient à la construction avec la neige.
- source_word: צַחוּ
  choice: plus blancs
  rationale: Le verbe évoque une blancheur éclatante ou la luminosité ; « plus blancs que le lait » rend naturellement l’image.
- source_word: עֶצֶם
  choice: leur corps
  rationale: Bien que le nom signifie couramment « os », il peut désigner ici la substance ou la charpente corporelle. Le singulier collectif « leur corps » reste naturel en français.
- source_word: אָדְמוּ
  choice: était plus vermeil
  rationale: Le verbe signifie être rouge ou vermeil. « Vermeil » suggère ici une coloration saine tout en gardant le registre poétique.
- source_word: פְּנִינִים
  choice: corail
  rationale: Le référent précis est incertain, mais le parallélisme avec la rougeur favorise une matière précieuse rouge telle que le corail ; l’incertitude est signalée en note.
- source_word: גִּזְרָתָם
  choice: leur silhouette
  rationale: Le nom désigne la forme, la figure ou les contours. « Silhouette » produit en français une image corporelle claire et poétique.
- source_word: סַפִּיר
  choice: saphir
  rationale: La désignation traditionnelle est conservée, tout en indiquant en note que la pierre antique pourrait être le lapis-lazuli.
theological_decisions:
- issue: Identité des נְזִירֶיהָ
  choice: ses hommes consacrés
  alternative: ses princes / ses nazirs
  rationale: Le terme peut désigner des personnes consacrées par vœu, mais certains comprennent ici les nobles de Jérusalem. Le texte principal garde l’idée de consécration et la note préserve les autres lectures plausibles.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme binaire du vers hébreu est conservé, ainsi que ses comparatifs et ses images minérales. Les ambiguïtés lexicales majeures sont explicitées sans alourdir le texte principal.
