source:
  edition: WLC
  text: כִּלָּ֤ה יְהוָה֙ אֶת חֲמָת֔/וֹ שָׁפַ֖ךְ חֲר֣וֹן אַפּ֑/וֹ וַ/יַּצֶּת אֵ֣שׁ בְּ/צִיּ֔וֹן וַ/תֹּ֖אכַל יְסוֹדֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/011.yaml
  text: Yahweh has exhausted his wrath[a]; he has poured out his burning anger. He kindled a fire in Zion[b], and it consumed her foundations.
translation:
  language: fr
  text: Yahweh a épuisé sa fureur[a] ; il a déversé son ardente colère[b]. Il a allumé un feu dans Sion, et ce feu en a dévoré les fondations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a mené sa fureur jusqu’à son terme » ou « a entièrement dépensé sa fureur ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la brûlure de sa colère », expression qui désigne sa colère violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּה
  choice: a épuisé
  rationale: Le verbe exprime ici l’action de mener quelque chose jusqu’à son terme ou de le dépenser entièrement. « A épuisé » conserve l’idée que la fureur a été déployée jusqu’au bout.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin du texte hébreu, plutôt que de lui substituer un titre.
- source_word: חֲמָתוֹ
  choice: sa fureur
  rationale: חֵמָה désigne une colère intense. « Fureur » convient au registre poétique et permet de distinguer cette expression du parallèle qui suit.
- source_word: שָׁפַךְ
  choice: a déversé
  rationale: Ce choix conserve l’image concrète de quelque chose que l’on répand tout en étant idiomatique en français avec la colère divine.
- source_word: חֲרוֹן אַפּוֹ
  choice: son ardente colère
  rationale: L’expression évoque littéralement la chaleur ou l’embrasement de la colère. « Ardente colère » maintient cette image sans lourdeur excessive.
- source_word: וַיַּצֶּת אֵשׁ
  choice: Il a allumé un feu
  rationale: La formulation rend directement l’action d’allumer ou d’attiser un feu et conserve l’image du jugement.
- source_word: בְּצִיּוֹן
  choice: dans Sion
  rationale: La préposition situe normalement le feu à l’intérieur de Sion ; « dans » garde ce sens spatial naturel.
- source_word: וַתֹּאכַל
  choice: en a dévoré
  rationale: Le verbe signifie littéralement « manger » et s’emploie pour un feu qui consume. « Dévoré » préserve la vigueur de l’image.
- source_word: יְסוֹדֹתֶיהָ
  choice: les fondations
  rationale: Le suffixe renvoie à Sion, personnifiée au féminin en hébreu. La tournure « en a dévoré les fondations » identifie clairement Sion comme possesseur sans imposer en français un pronom possessif ambigu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie le nom propre divin. « Yahweh » le représente directement et évite de le remplacer par un titre.
- issue: Parallélisme des deux expressions de la colère divine
  choice: Conserver « sa fureur » et « son ardente colère » comme deux expressions parallèles
  alternative: Les fondre en une seule mention de la colère
  rationale: L’hébreu emploie deux formulations distinctes. Les maintenir respecte l’intensification poétique et la tension du tableau du jugement.
- issue: Portée de כִּלָּה appliqué à la fureur
  choice: a épuisé sa fureur
  alternative: a accompli sa fureur / a donné libre cours jusqu’au bout à sa fureur
  rationale: Le choix garde l’ambiguïté entre mener la fureur à son plein accomplissement et la dépenser entièrement, sans suggérer qu’elle aurait simplement cessé d’exister.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme en deux phrases préserve le parallélisme poétique. « Déversé », « ardente » et « dévoré » maintiennent les images concrètes de liquide, de chaleur et de feu présentes dans l’hébreu.
