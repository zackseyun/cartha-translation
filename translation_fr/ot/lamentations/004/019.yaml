  text: קַלִּ֤ים הָיוּ֙ רֹדְפֵ֔י/נוּ מִ/נִּשְׁרֵ֖י שָׁמָ֑יִם עַל הֶ/הָרִ֣ים דְּלָקֻ֔/נוּ בַּ/מִּדְבָּ֖ר אָ֥רְבוּ לָֽ/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/019.yaml
  text: Our pursuers were swifter than the eagles of the heavens[a]; on the mountains they pursued us; in the wilderness they lay in wait for us.
translation:
  language: fr
  text: Nos poursuivants étaient plus rapides que les aigles du ciel[a] ; sur les montagnes, ils nous poursuivaient sans relâche ; dans le désert, ils nous guettaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vautours du ciel » ; le mot hébreu נֶשֶׁר peut désigner l’aigle ou le vautour selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלִּים
  choice: plus rapides
  rationale: Le complément introduit par מִן impose ici une comparaison. « Plus rapides » est naturel en français moderne et conserve l’idée de vitesse.
- source_word: רֹדְפֵינוּ
  choice: nos poursuivants
  rationale: Rend directement le participe substantivé de רדף sans ajouter la nuance religieuse ou judiciaire que pourrait suggérer « persécuteurs ».
- source_word: מִנִּשְׁרֵי שָׁמָיִם
  choice: que les aigles du ciel
  rationale: « Aigles » exprime naturellement l’image de rapidité, tandis que « du ciel » rend le génitif hébreu dans un français poétique mais courant. L’ambiguïté zoologique de נֶשֶׁר est signalée en note.
- source_word: עַל הֶהָרִים
  choice: sur les montagnes
  rationale: Traduction locative directe qui préserve le relief de l’image.
- source_word: דְּלָקֻנוּ
  choice: ils nous traquaient
  rationale: דלק désigne une poursuite ardente. « Traquaient » évite une répétition lourde de « poursuivants » tout en conservant l’intensité et la continuité de la chasse.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français biblique moderne, « désert » couvre naturellement la région inculte ou steppique désignée par מִדְבָּר, sans exiger un désert de sable.
- source_word: אָרְבוּ לָנוּ
  choice: ils nous guettaient en embuscade
  rationale: Cette formulation exprime à la fois l’attente dissimulée et l’intention d’attaquer portées par ארב.
