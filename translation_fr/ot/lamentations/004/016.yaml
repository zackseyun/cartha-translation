source:
  edition: WLC
  text: פְּנֵ֤י יְהוָה֙ חִלְּקָ֔/ם לֹ֥א יוֹסִ֖יף לְ/הַבִּיטָ֑/ם פְּנֵ֤י כֹהֲנִים֙ לֹ֣א נָשָׂ֔אוּ זקנים לֹ֥א חָנָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/016.yaml
  text: The face of Yahweh has scattered them[a]; he will no longer look on them. They showed no regard for priests[c][b]; they showed no favor to elders.
translation:
  language: fr
  text: La face de Yahweh les a dispersés[a] ; il ne les regardera plus. Ils n’ont eu aucun égard pour les prêtres[b] ; ils n’ont accordé aucune faveur aux anciens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La présence de Yahweh les a divisés » ou « les a répartis ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Ils n’ont pas relevé le visage des prêtres » ; expression idiomatique signifiant qu’ils ne leur ont témoigné ni égard ni faveur.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils n’ont eu aucune pitié pour les personnes âgées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי יְהוָה
  choice: La face de Yahweh
  rationale: La traduction littérale conserve l’image anthropomorphique vive et le lien poétique avec le regard dans la proposition suivante. « La présence de Yahweh » reste une possibilité idiomatique signalée en note.
- source_word: חִלְּקָם
  choice: les a dispersés
  rationale: Au piel, חלק peut exprimer la division, la répartition ou la dispersion. Dans ce contexte de jugement et d’exil, « dispersés » rend naturellement l’action sans en préciser excessivement les modalités.
- source_word: לֹא יוֹסִיף לְהַבִּיטָם
  choice: il ne posera plus son regard sur eux
  rationale: La construction יסף avec infinitif sous négation signifie « ne plus » ou « ne pas recommencer à ». Cette formulation française garde l’image du regard et son possible sens relationnel ou judiciaire.
- source_word: פְּנֵי כֹהֲנִים לֹא נָשָׂאוּ
  choice: Ils n’ont eu aucun égard pour les prêtres
  rationale: L’expression נשא פנים, littéralement « relever/porter le visage », est idiomatique et signifie témoigner considération ou faveur. « Avoir égard pour » est clair, digne et adapté au parallélisme.
- source_word: זקנים
  choice: les anciens
  rationale: זקנים peut désigner les personnes âgées ou les responsables reconnus de la communauté. En parallèle avec les prêtres, « les anciens » convient le mieux tout en laissant percevoir la dimension d’âge.
- source_word: לֹא חָנָנוּ
  choice: ils n’ont témoigné aucune faveur
  rationale: חנן peut signifier faire grâce, témoigner de la faveur ou avoir pitié. « Témoigner aucune faveur » préserve la portée lexicale large et le parallélisme, tandis que la possibilité « aucune pitié » est donnée en note.
theological_decisions:
- issue: Langage anthropomorphique appliqué à l’action divine
  choice: Conserver « La face de Yahweh »
  alternative: « La présence de Yahweh » ou « Yahweh lui-même »
  rationale: L’hébreu emploie une image concrète que la traduction ne doit pas aplanir. La conserver maintient la force poétique sans imposer une conception corporelle de Dieu.
- issue: Nature du regard divin refusé
  choice: « il ne posera plus son regard sur eux »
  alternative: « il ne leur accordera plus d’attention »
  rationale: La formulation retenue préserve l’ambiguïté entre regard, attention favorable et considération judiciaire, au lieu de choisir silencieusement une seule nuance.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en deux phrases parallèles est maintenu. Le nom divin est translittéré « Yahweh », et les tournures idiomatiques obscures sont rendues clairement tout en étant documentées en notes.
