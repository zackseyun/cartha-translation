  text: גַּם תנין חָ֣לְצוּ שַׁ֔ד הֵינִ֖יקוּ גּוּרֵי/הֶ֑ן בַּת עַמִּ֣/י לְ/אַכְזָ֔ר כי ענים בַּ/מִּדְבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/003.yaml
  text: Even jackals offer the breast[a]; they nurse their young. The daughter of my people has become cruel[b], like ostriches in the wilderness.
translation:
  language: fr
  text: Même les chacales offrent la mamelle[a] et allaitent leurs petits. La fille de mon peuple est devenue cruelle, comme les autruches[b] dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « monstres marins » ou « dragons » pour תנין ; « chacales » est retenu ici parce que le verset parle d’animaux qui allaitent leurs petits, ce qui convient mieux au contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « hiboux » ; l’hébreu ענים est traditionnellement compris comme désignant les autruches, notamment à la lumière de Job 39.13-17.
    reason: lexical_alternative
lexical_decisions:
- source_word: תנין
  choice: chacals
  rationale: Dans ce contexte d’allaitement des petits et de comparaison avec des animaux du désert, le sens terrestre « chacals » convient mieux que « monstres marins » ou « dragons ».
- source_word: חָלְצוּ שַׁד
  choice: présentent leurs mamelles
  rationale: L’expression décrit concrètement l’action d’exposer ou d’offrir la mamelle pour allaiter. Cette formulation est naturelle en français tout en conservant l’image maternelle.
- source_word: הֵינִיקוּ
  choice: allaitent
  rationale: Le hiphil de ינק signifie faire téter, donc allaiter; ce verbe exprime clairement l’action maternelle en français courant.
- source_word: גּוּרֵיהֶן
  choice: leurs petits
  rationale: Le nom désigne les petits d’animaux; « leurs petits » évite de préciser une espèce au-delà de ce qu’exige le texte.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: La traduction conserve la personnification poétique et prophétique de la communauté.
- source_word: לְאַכְזָר
  choice: est devenue cruelle
  rationale: La construction exprime un état résultant; « est devenue » rend le changement tragique décrit dans le contexte.
- source_word: כי ענים
  choice: comme les autruches
  rationale: La compréhension traditionnelle « autruches » correspond à l’image biblique de ces oiseaux du désert et de leur dureté envers leurs petits, notamment en Job 39. « Hiboux » reste une possibilité lexicale.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Ici, « désert » restitue naturellement le milieu aride associé aux autruches, tout en restant dans le registre poétique.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. La structure en deux phrases met en relief le contraste entre les soins des animaux sauvages et la cruauté produite par la détresse au sein du peuple. « Mamelles » est retenu plutôt que « seins » puisqu’il s’agit d’animaux.
