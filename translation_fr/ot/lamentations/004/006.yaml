  text: וַ/יִּגְדַּל֙ עֲוֺ֣ן בַּת עַמִּ֔/י מֵֽ/חַטַּ֖את סְדֹ֑ם הַֽ/הֲפוּכָ֣ה כְמוֹ רָ֔גַע וְ/לֹא חָ֥לוּ בָ֖/הּ יָדָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/006.yaml
  text: For the iniquity of the daughter of my people has grown greater than the sin of Sodom[a], which was overthrown in a moment[b], though no hands labored against her.
translation:
  language: fr
  text: Car la faute de la fille de mon peuple est devenue plus grave que le péché de Sodome[a], qui fut renversée en un instant[b], et aucune main ne s’est acharnée contre elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la culpabilité de la fille de mon peuple est devenue plus grande que celle de Sodome ». Les mots hébreux traduits par « faute » et « péché » peuvent aussi désigner la culpabilité ou le châtiment qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset est difficile en hébreu. On peut aussi comprendre : « et aucune main ne fut portée contre elle » ou « et aucune main ne se tordit à son sujet ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: est devenue plus grave
  rationale: Le verbe גדל exprime ici une augmentation ou une supériorité. « Est devenue plus grave » conserve sa valeur verbale tout en donnant en français une comparaison naturelle portant sur la faute.
- source_word: עֲוֺן
  choice: faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences punitives de celle-ci. Dans la comparaison immédiate avec le « péché » de Sodome, « faute » rend naturellement le sens moral sans exclure l’arrière-plan du jugement.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: Cette personnification traditionnelle de Jérusalem ou de Juda appartient au langage poétique des Lamentations. La conserver respecte l’image et la dignité du texte.
- source_word: מֵחַטַּאת סְדֹם
  choice: que le péché de Sodome
  rationale: La préposition מִן marque la comparaison. חַטָּאת désigne ici le péché de Sodome, même si le mot peut parfois évoquer aussi sa culpabilité ou son châtiment.
- source_word: הַהֲפוּכָה
  choice: renversée
  rationale: Le participe passif rappelle le renversement de Sodome raconté dans la Genèse. « Renversée » préserve mieux cet écho que le terme plus général « détruite ».
- source_word: כְמוֹ רָגַע
  choice: en un instant
  rationale: L’expression souligne la soudaineté du renversement. « En un instant » est idiomatique et reste proche de la formulation hébraïque.
- source_word: וְלֹא חָלוּ בָהּ יָדָיִם
  choice: sans que des mains se soient acharnées contre elle
  rationale: La proposition est obscure. Cette traduction exprime prudemment l’idée probable d’une action humaine soutenue qui, contrairement au long siège de Jérusalem, ne s’exerça pas contre Sodome. La note conserve d’autres lectures possibles.
theological_decisions:
- issue: Sens de עָוֹן dans la comparaison avec Sodome
  choice: La faute morale de la fille du peuple est plus grave que le péché de Sodome.
  alternative: Son châtiment ou sa culpabilité est plus grand que celui de Sodome.
  rationale: עָוֹן peut réunir faute, culpabilité et conséquence punitive. La proximité de חַטָּאת favorise le sens moral dans le texte principal, mais la note signale explicitement l’autre possibilité afin de ne pas effacer la tension entre péché et jugement.
- issue: Interprétation de la dernière proposition
  choice: Sodome fut renversée soudainement, sans action humaine prolongée contre elle.
  alternative: Aucune main ne s’est posée sur elle, ou aucune main ne s’est tordue à son sujet.
  rationale: L’hébreu est très condensé et difficile. Le texte principal retient le contraste probable entre la chute instantanée de Sodome et les souffrances prolongées de Jérusalem, tandis que la note préserve les principales autres compréhensions.
translation_notes:
  register: Français international moderne, poétique et digne. La personnification « la fille de mon peuple » et l’écho au renversement de Sodome sont conservés. La syntaxe demeure fluide, tandis que les notes rendent visibles les ambiguïtés lexicales et textuelles réelles.
