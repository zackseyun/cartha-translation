source:
  edition: WLC
  text: נָע֤וּ עִוְרִים֙ בַּֽ/חוּצ֔וֹת נְגֹֽאֲל֖וּ בַּ/דָּ֑ם בְּ/לֹ֣א יֽוּכְל֔וּ יִגְּע֖וּ בִּ/לְבֻשֵׁי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/014.yaml
  text: They wandered blind through the streets[a], defiled with blood[b], so that they could not touch their garments.
translation:
  language: fr
  text: Ils erraient, aveugles, dans les rues[a], souillés de sang[b], sans pouvoir toucher leurs vêtements[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Ils erraient comme des aveugles dans les rues. » L’hébreu ne comporte pas de terme explicite signifiant « comme ».'
    reason: alternative_reading
  - marker: b
    text: « Souillés de sang » évoque probablement l’impureté, et non seulement des vêtements physiquement tachés de sang.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu est très condensé, et le sujet de « pouvoir toucher » n’est pas explicité à nouveau. On peut aussi comprendre : « si bien que personne ne pouvait toucher leurs vêtements ».'
    reason: alternative_reading
lexical_decisions:
- source_word: נָעוּ
  choice: ils erraient
  rationale: Le verbe נוע évoque un mouvement instable ou sans direction. « Erraient » convient au contexte de lamentation tout en laissant percevoir leur désorientation.
- source_word: עִוְרִים
  choice: aveugles
  rationale: Le terme désigne littéralement des aveugles. Employé en apposition, « aveugles » conserve l’image hébraïque sans ajouter une particule comparative absente du texte.
- source_word: בַּחוּצוֹת
  choice: dans les rues
  rationale: חוּצוֹת désigne les rues ou les espaces ouverts de la ville. « Dans les rues » est naturel en français et s’accorde avec le mouvement exprimé par le verbe.
- source_word: נְגֹאֲלוּ
  choice: souillés
  rationale: Au nifal, גאל exprime ici la souillure ou la pollution, vraisemblablement avec une portée d’impureté. « Souillés » rend mieux cette nuance que le simple fait d’être tachés.
- source_word: בַּדָּם
  choice: de sang
  rationale: La préposition introduit ce qui cause ou constitue la souillure. L’expression française idiomatique est « souillés de sang ».
- source_word: בְּלֹא יֽוּכְלוּ יִגְּעוּ
  choice: sans pouvoir toucher
  rationale: Cette tournure suit le plus directement les verbes hébreux au pluriel et évite d’introduire dans le texte principal un sujet indéfini qui n’est pas exprimé, tout en signalant en note l’ambiguïté de la syntaxe comprimée.
- source_word: בִּלְבֻשֵׁיהֶם
  choice: leurs vêtements
  rationale: Le nom désigne les habits ou vêtements. « Vêtements » garde un registre digne sans archaïsme.
theological_decisions:
- issue: Sujet implicite de « pouvoir toucher »
  choice: 'Les verbes sont rapportés au sujet pluriel précédent : « sans pouvoir toucher leurs vêtements »'
  alternative: « si bien que personne ne pouvait toucher leurs vêtements »
  rationale: La morphologie hébraïque maintient des formes verbales plurielles sans sujet explicite nouveau, ce qui favorise grammaticalement la continuité du sujet. Toutefois, le contexte d’impureté peut suggérer que d’autres personnes ne pouvaient pas toucher leurs vêtements; cette lecture demeure donc explicitement ouverte en note.
translation_notes:
  register: Français international moderne, poétique et digne. La phrase brève conserve la densité du vers hébreu. « Erraient », « souillés » et « vêtements » maintiennent un registre soutenu mais courant, sans archaïsme.
