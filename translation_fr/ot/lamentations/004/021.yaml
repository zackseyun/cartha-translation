source:
  edition: WLC
  text: שִׂ֤ישִׂי וְ/שִׂמְחִי֙ בַּת אֱד֔וֹם יושבתי בְּ/אֶ֣רֶץ ע֑וּץ גַּם עָלַ֨יִ/ךְ֙ תַּעֲבָר כּ֔וֹס תִּשְׁכְּרִ֖י וְ/תִתְעָרִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/021.yaml
  text: Rejoice and be glad[a], daughter of Edom, you who dwell in the land of Uz[b]; the cup will also pass to you—you will become drunk and strip yourself bare.
translation:
  language: fr
  text: 'Réjouis-toi et sois dans l’allégresse, fille d’Édom, toi qui habites au pays d’Ous ! La coupe viendra aussi jusqu’à toi[a] : tu t’enivreras et tu te mettras à nu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la coupe passera aussi sur toi ». Cette coupe représente ici le jugement.'
    reason: Précision sur l’expression hébraïque et sur son image contextuelle.
  - marker: b
    text: 'Ou : « tu te dénuderas » ; le texte évoque une nudité qui expose à la honte.'
    reason: Alternative lexicale préservant la valeur réfléchie et la honte associée à l’image.
lexical_decisions:
- source_word: שִׂישִׂי וְשִׂמְחִי
  choice: Réjouis-toi et sois dans l’allégresse
  rationale: Les deux impératifs féminins expriment une joie redoublée. Cette formulation conserve le parallélisme sans répétition pesante et laisse entendre l’ironie du contexte.
- source_word: בַּת אֱדוֹם
  choice: fille d’Édom
  rationale: La métaphore prophétique personnifiant le peuple ou le territoire sous les traits d’une fille est conservée, ainsi que l’adresse au féminin.
- source_word: יושבתי
  choice: toi qui habites
  rationale: Le participe féminin est rendu comme une apposition vocative naturelle en français et exprime une habitation durable.
- source_word: בְּאֶרֶץ עוּץ
  choice: au pays d’Ous
  rationale: « Pays » convient à la désignation géographique, et « Ous » offre une transcription française claire du nom עוּץ.
- source_word: גַּם עָלַיִךְ תַּעֲבָר כּוֹס
  choice: La coupe viendra aussi jusqu’à toi
  rationale: La formulation communique naturellement l’arrivée du jugement destiné à Édom tout en maintenant l’image concrète de la coupe. Le sens plus littéral de « passer sur toi » est signalé en note.
- source_word: תִּשְׁכְּרִי
  choice: tu t’enivreras
  rationale: Le futur pronominal rend avec concision l’entrée dans l’état d’ivresse produite par la coupe.
- source_word: וְתִתְעָרִי
  choice: et tu te mettras à nu
  rationale: Cette expression conserve la valeur réfléchie de la forme verbale et l’image d’une nudité honteuse, sans employer un registre archaïque.
theological_decisions:
- issue: L’image métaphorique de la coupe
  choice: Conserver « la coupe » comme image du jugement qui atteint Édom.
  alternative: 'Paraphraser : « le châtiment viendra aussi jusqu’à toi ».'
  rationale: L’image prophétique de la coupe possède une portée littéraire et théologique importante. La conserver évite d’effacer une métaphore scripturaire récurrente.
- issue: Le ton des impératifs adressés à Édom
  choice: Traduire directement l’appel à se réjouir sans ajouter explicitement qu’il est ironique.
  alternative: Ajouter une marque comme « vas-y » ou « pour l’instant » afin d’expliciter l’ironie.
  rationale: Le renversement qui suit suffit à faire percevoir l’ironie. Une explicitation dans le texte résoudrait un effet rhétorique que l’hébreu laisse au lecteur.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique, la personnification féminine d’Édom et l’image de la coupe sont préservés. La ponctuation fait ressortir le brusque passage de la joie au jugement.
