  text: Better were those slain by the sword than those slain by hunger[a], who waste away, pierced through for lack of the produce of the field.
translation:
  language: fr
  text: Mieux valaient ceux qui ont été tués par l’épée que ceux que la faim tue, eux qui dépérissent, transpercés faute de produits des champs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « eux qui dépérissent, transpercés, parce qu’il n’y a pas de produits des champs ». L’hébreu de cette proposition est difficile, en particulier le verbe rendu par « dépérissent » et la valeur de la préposition rendue par « faute de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבִים הָיוּ
  choice: ont eu un sort meilleur
  rationale: Le comparatif exprime ici une condition relativement préférable, non une bonté morale. Cette tournure naturelle en français conserve le caractère tragique de la comparaison.
- source_word: חַלְלֵי חֶרֶב
  choice: ceux qui sont morts par l’épée
  rationale: חָלָל désigne couramment une personne tuée. « Par l’épée » rend naturellement le rapport instrumental du groupe construit.
- source_word: מֵחַלְלֵי רָעָב
  choice: que ceux qui sont morts de faim
  rationale: Le préfixe מ marque la comparaison. « De faim » exprime en français idiomatique la mort causée par la faim, dans le contexte d’une famine.
- source_word: שֶׁהֵם
  choice: ceux-ci
  rationale: Le relatif accompagné du pronom renvoie aux victimes de la faim. La reprise par « ceux-ci » clarifie ce référent sans ajouter de lien causal absent du texte.
- source_word: יָזוּבוּ
  choice: dépérissent
  rationale: Le verbe est difficile et évoque vraisemblablement l’idée de s’écouler, se vider ou se consumer progressivement. « Dépérissent » rend le déclin prolongé dû à la faim tout en laissant l’incertitude signalée en note.
- source_word: מְדֻקָּרִים
  choice: transpercés
  rationale: Le participe passif de דקר signifie littéralement « transpercés ». Le terme conserve l’image vive, probablement appliquée ici aux souffrances de la famine.
- source_word: מִתְּנוּבוֹת שָׂדָי
  choice: faute des produits des champs
  rationale: 'Dans ce contexte, la préposition מ peut être comprise dans un sens privatif ou causal : ils dépérissent parce qu’ils sont privés de ce que donnent les champs. « Produits des champs » rend תְּנוּבוֹת שָׂדָי de manière naturelle.'
