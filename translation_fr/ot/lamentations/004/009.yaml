  - severity: low
    issue: « ont eu un sort meilleur » est plus interprétatif et rétrospectif que nécessaire.
    rationale: טוֹבִים הָיוּ exprime directement que les premiers étaient dans une condition préférable; « Mieux valaient » restitue le comparatif élégiaque avec plus de concision.
  - severity: medium
    issue: 'La succession « sont morts de faim : ceux-ci dépérissent » est temporellement et référentiellement maladroite.'
    rationale: Le texte qualifie les victimes de la faim tout en décrivant leur consumation; une relative portant directement sur ceux que la faim tue maintient cette tension poétique sans produire en français l’impression qu’ils sont déjà morts puis continuent à dépérir.
  revised_text: Mieux valaient ceux qui ont été tués par l’épée que ceux que la faim tue, eux qui dépérissent, transpercés faute de produits des champs[a].
