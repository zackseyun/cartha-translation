id: LAM.4.8
reference: Lamentations 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָשַׁ֤ךְ מִ/שְּׁחוֹר֙ תָּֽאֳרָ֔/ם לֹ֥א נִכְּר֖וּ בַּ/חוּצ֑וֹת צָפַ֤ד עוֹרָ/ם֙ עַל עַצְמָ֔/ם יָבֵ֖שׁ הָיָ֥ה כָ/עֵֽץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/008.yaml
  text: Their appearance is darker than soot[a]; they are not recognized in the streets. Their skin has shriveled on their bones[b]; it has become dry like wood.
translation:
  language: fr
  text: Leur apparence est plus sombre que la suie[a] ; on ne les reconnaît pas dans les rues. Leur peau s’est rétractée sur leurs os[b] ; elle est devenue sèche comme du bois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus sombre que la noirceur ». Le terme hébreu peut désigner la noirceur en général ; « suie » donne ici une image concrète.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur peau colle à leurs os ». Le verbe hébreu peut évoquer une peau qui se contracte étroitement sur les os.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁךְ
  choice: est plus sombre
  rationale: Le parfait qal décrit ici l’état sombre qui résulte de la famine. Le présent français rend naturellement cette description vive sans imposer une nuance progressive.
- source_word: מִשְּׁחוֹר
  choice: que la suie
  rationale: Le מִן comparatif introduit le terme de comparaison. « Suie » fournit une image concrète plausible, tout en signalant en note que שְׁחוֹר peut désigner plus généralement la noirceur.
- source_word: תָּאֳרָם
  choice: leur apparence
  rationale: תֹּאַר désigne l’aspect ou la forme visible. « Apparence » est naturel, actuel et suffisamment large.
- source_word: לֹא נִכְּרוּ
  choice: on ne les reconnaît pas
  rationale: Le niphal exprime le fait qu’ils ne sont pas reconnaissables. La tournure française avec « on » est plus idiomatique que le passif tout en conservant le sens.
- source_word: בַּחוּצוֹת
  choice: dans les rues
  rationale: חוּצוֹת désigne les rues ou espaces publics de la ville ; « rues » est ici l’équivalent moderne le plus clair.
- source_word: צָפַד
  choice: s’est rétractée
  rationale: Le verbe rare évoque une peau contractée ou collée aux os sous l’effet de l’émaciation. « S’est rétractée » conserve l’image sans la préciser excessivement.
- source_word: עוֹרָם
  choice: leur peau
  rationale: עוֹר désigne directement la peau humaine dans ce contexte.
- source_word: עַל עַצְמָם
  choice: sur leurs os
  rationale: La préposition עַל présente la peau tirée ou contractée sur les os ; la formulation française préserve cette image corporelle.
- source_word: יָבֵשׁ הָיָה
  choice: elle est devenue sèche
  rationale: La construction décrit l’état résultant de la peau. Le pronom singulier « elle » reprend naturellement « peau ».
- source_word: כָעֵץ
  choice: comme du bois
  rationale: עֵץ peut désigner un arbre ou du bois. Ici, la comparaison souligne surtout la sécheresse et la dureté inertes ; « bois » convient mieux que « arbre ».
