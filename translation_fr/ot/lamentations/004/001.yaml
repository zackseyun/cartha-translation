source:
  edition: WLC
  text: אֵיכָה֙ יוּעַ֣ם זָהָ֔ב יִשְׁנֶ֖א הַ/כֶּ֣תֶם הַ/טּ֑וֹב תִּשְׁתַּפֵּ֨כְנָה֙ אַבְנֵי קֹ֔דֶשׁ בְּ/רֹ֖אשׁ כָּל חוּצֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/001.yaml
  text: How the gold has grown dim[b][a], how the fine gold has changed! The holy stones are poured out at the head of every street.
translation:
  language: fr
  text: Comme l’or a perdu son éclat ! Comme l’or fin s’est altéré ! Les pierres saintes[a] sont répandues à l’entrée de toutes les rues[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pierres sacrées » ou « les pierres du sanctuaire ». L’hébreu peut désigner des pierres consacrées du Temple ou, dans une image poétique, des pierres précieuses saintes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la tête de toutes les rues » ; l’expression peut désigner le début, l’entrée ou le carrefour des rues.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיכָה
  choice: Comme
  rationale: Introduit ici une exclamation de lamentation. En français, « Comme… ! » restitue naturellement la plainte poétique sans ajouter une interjection absente du texte.
- source_word: יוּעַם
  choice: a perdu son éclat
  rationale: La forme exprime l’assombrissement ou la perte de brillance. Cette tournure française conserve l’image de l’or devenu terne sans préciser indûment qu’il serait matériellement corrodé.
- source_word: זָהָב
  choice: l’or
  rationale: Équivalent lexical direct.
- source_word: יִשְׁנֶא
  choice: s’est altéré
  rationale: Le verbe indique un changement d’état. « S’est altéré » convient au contexte de l’or tout en restant distinct de la première proposition.
- source_word: הַכֶּתֶם הַטּוֹב
  choice: l’or fin
  rationale: כֶּתֶם désigne un or précieux ou raffiné, et הַטּוֹב en souligne la qualité. « L’or fin » est concis, poétique et naturel.
- source_word: תִּשְׁתַּפֵּכְנָה
  choice: sont répandues
  rationale: Préserve l’image de choses versées ou dispersées, tout en étant idiomatique pour des pierres jonchant l’espace public.
- source_word: אַבְנֵי קֹדֶשׁ
  choice: les pierres saintes
  rationale: Traduction proche de l’expression hébraïque « pierres de sainteté », qui évite de décider s’il s’agit des pierres du sanctuaire, de pierres consacrées ou d’une image des habitants de Sion.
- source_word: בְּרֹאשׁ
  choice: à l’entrée de
  rationale: Littéralement « à la tête de ». Dans le contexte urbain, l’expression peut désigner le commencement ou l’entrée d’une rue; la note conserve le sens littéral et les autres possibilités.
- source_word: כָּל חוּצוֹת
  choice: de toutes les rues
  rationale: חוּצוֹת peut désigner les rues ou les espaces ouverts d’une ville. « Toutes les rues » rend naturellement la portée de כָּל dans ce contexte.
theological_decisions:
- issue: Référent des « pierres saintes »
  choice: Maintenir l’expression littérale sans identifier son référent.
  alternative: Les pierres du sanctuaire, des pierres précieuses consacrées, ou, par anticipation du verset 2, les habitants précieux de Sion.
  rationale: L’image hébraïque demeure ouverte. La traduction ne doit pas résoudre une ambiguïté poétique susceptible de porter plusieurs résonances théologiques et littéraires.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux exclamations rendent le rythme de la lamentation; le vocabulaire reste accessible tout en préservant l’ambiguïté des images hébraïques.
