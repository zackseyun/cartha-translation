reference: Lamentations 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֵֽ/חַטֹּ֣את נְבִיאֶ֔י/הָ עֲוֺנ֖וֹת כֹּהֲנֶ֑י/הָ הַ/שֹּׁפְכִ֥ים בְּ/קִרְבָּ֖/הּ דַּ֥ם צַדִּיקִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/013.yaml
  text: Because of the sins of her prophets[a], the iniquities of her priests, who poured out in her midst the blood of the righteous[b],
translation:
  language: fr
  text: À cause des péchés de ses prophètes et des iniquités de ses prêtres, qui ont versé[a] en son sein le sang des justes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont répandu ». Le verbe hébreu évoque littéralement le fait de répandre ou de verser ; avec le sang, les deux formulations sont possibles.
    reason: lexical_alternative
  - marker: b
    text: Ou « des innocents ». L’hébreu signifie plus littéralement « des justes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחַטֹּאת
  choice: À cause des péchés de
  rationale: La préposition מִן peut ici exprimer la cause. « À cause de » rend naturellement le lien causal avec la situation de Jérusalem décrite dans le contexte.
- source_word: נְבִיאֶיהָ
  choice: ses prophètes
  rationale: Le suffixe féminin singulier renvoie à la ville personnifiée ; le possessif français conserve ce rapport.
- source_word: עֲוֺנוֹת
  choice: les iniquités de
  rationale: עָוֹן désigne la faute morale et peut aussi évoquer la culpabilité qui en découle. « Iniquités » conserve ce poids tout en distinguant le terme de חַטֹּאת, rendu par « péchés ».
- source_word: כֹּהֲנֶיהָ
  choice: ses prêtres
  rationale: Traduction directe de כֹּהֵן avec le suffixe féminin singulier renvoyant à la ville.
- source_word: הַשֹּׁפְכִים
  choice: qui versaient
  rationale: Le participe qualifie les prophètes et les prêtres. Avec « le sang », « verser » est idiomatique en français tout en conservant l'image concrète de שפך.
- source_word: בְּקִרְבָּהּ
  choice: en son sein
  rationale: Cette expression conserve l'idée que le sang a été versé à l'intérieur même de la ville personnifiée.
- source_word: דַּם
  choice: le sang de
  rationale: Traduction directe du complément d'objet de הַשֹּׁפְכִים.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: Le substantif adjectival désigne littéralement des personnes justes. « Les justes » préserve cette catégorie morale sans la réduire à la seule innocence judiciaire.
theological_decisions:
- issue: Faut-il rendre צַדִּיקִים comme une catégorie morale ou seulement comme l'innocence judiciaire ?
  choice: les justes
  alternative: les innocents
  rationale: Le mot hébreu peut désigner ceux qui sont justes ou dans leur droit, et pas uniquement des personnes juridiquement innocentes. « Les justes » préserve l'étendue éthique et théologique du terme ; l'autre possibilité est signalée en note.
translation_notes:
  register: Français moderne, digne et lisible. La coordination explicite par « et » rend naturelle l’énumération hébraïque. « En son sein » maintient la personnification de Jérusalem et le registre poétique. La virgule finale est conservée puisque le verset se prolonge syntaxiquement dans le suivant.
