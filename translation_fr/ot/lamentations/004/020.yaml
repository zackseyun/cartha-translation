source:
  edition: WLC
  text: ר֤וּחַ אַפֵּ֨י/נוּ֙ מְשִׁ֣יחַ יְהוָ֔ה נִלְכַּ֖ד בִּ/שְׁחִיתוֹתָ֑/ם אֲשֶׁ֣ר אָמַ֔רְנוּ בְּ/צִלּ֖/וֹ נִֽחְיֶ֥ה בַ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/020.yaml
  text: The breath of our nostrils[a], Yahweh’s anointed, was captured in their pits—he of whom we said, “Under his shadow we will live among the nations.”
translation:
  language: fr
  text: 'Le souffle de nos narines, l’oint de Yahvé, a été capturé dans leurs fosses[a], lui dont nous disions : « Sous son ombre, nous vivrons parmi les nations. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leurs pièges » ou « dans leurs filets ».
    reason: Le terme hébreu peut évoquer aussi bien des fosses que des dispositifs destinés à capturer.
lexical_decisions:
- source_word: רוּחַ אַפֵּינוּ
  choice: Le souffle de nos narines
  rationale: Cette traduction conserve l’image corporelle concrète de l’hébreu et exprime la dépendance vitale du peuple envers le roi sans la réduire à une paraphrase comme « notre vie ».
- source_word: מְשִׁיחַ יְהוָה
  choice: l’oint de Yahvé
  rationale: מְשִׁיחַ désigne ici le roi consacré par onction. « L’oint » préserve le titre royal et théologique sans faire du verset une annonce messianique directe; « Yahvé » rend explicitement le nom divin יהוה.
- source_word: נִלְכַּד
  choice: a été capturé
  rationale: Le nifal exprime le fait d’être pris ou capturé; cette formulation convient au contexte politique et militaire.
- source_word: בִּשְׁחִיתוֹתָם
  choice: dans leurs fosses
  rationale: Le nom peut désigner des fosses servant à prendre ou à détruire. « Fosses » maintient l’image concrète, tandis que les sens possibles « pièges » et « filets » sont signalés en note.
- source_word: אֲשֶׁר אָמַרְנוּ
  choice: lui dont nous disions
  rationale: La tournure rattache clairement la proposition relative à « l’oint de Yahvé » et rend naturellement en français la valeur durative ou habituelle que le contexte permet.
- source_word: בְּצִלּוֹ
  choice: Sous son ombre
  rationale: La traduction conserve la métaphore de l’ombre comme abri et protection politique, au lieu de l’expliciter dans le corps du texte.
- source_word: נִחְיֶה
  choice: nous vivrons
  rationale: Le verbe signifie directement « vivre »; le contexte peut inclure l’idée de survivre, sans qu’il soit nécessaire de l’imposer dans la traduction.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Dans ce contexte, גּוֹיִם désigne les nations étrangères. Cette expression est claire et évite la coloration néotestamentaire que pourrait prendre « les païens ».
theological_decisions:
- issue: Faut-il rendre מְשִׁיחַ יְהוָה de manière à désigner explicitement le Messie eschatologique ?
  choice: « l’oint de Yahvé », compris dans le contexte immédiat comme le roi historique de Juda
  alternative: « le Messie de Yahvé »
  rationale: Bien que מְשִׁיחַ soit le terme hébreu à l’origine du titre « Messie », le contexte des Lamentations évoque le roi capturé sur lequel le peuple comptait. La traduction conserve le titre d’oint sans transformer ce passage en prédiction messianique explicite.
translation_notes:
  register: Français moderne, international et digne. La syntaxe poétique ainsi que les images fortes de l’hébreu — souffle, narines, fosses et ombre — sont conservées. Le marqueur de note est placé après « fosses », terme auquel porte réellement la variante lexicale.
