  text: עוד/ינה תִּכְלֶ֣ינָה עֵינֵ֔י/נוּ אֶל עֶזְרָתֵ֖/נוּ הָ֑בֶל בְּ/צִפִּיָּתֵ֣/נוּ צִפִּ֔ינוּ אֶל גּ֖וֹי לֹ֥א יוֹשִֽׁעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/017.yaml
  text: Still our eyes failed[a], looking in vain for our help; in our watching we watched for a nation that could not save.
translation:
  language: fr
  text: Nos yeux s’épuisaient encore à espérer en vain du secours ; dans notre attente, nous guettions une nation qui ne pouvait pas nous sauver[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire la fin du verset : « nous attendions une nation qui n’a pas sauvé ». Le verbe hébreu peut signifier « guetter », « attendre » ou « chercher du regard », et la dernière proposition peut exprimer soit l’incapacité, soit l’échec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶינָה
  choice: encore
  rationale: Exprime la persistance de l’attente et de l’épuisement ; placé avec le verbe, « encore » est naturel en français.
- source_word: תִּכְלֶינָה עֵינֵינוּ
  choice: Nos yeux s’épuisaient
  rationale: Conserve l’image poétique des yeux consumés par une attente prolongée, dans un français actuel et intelligible.
- source_word: אֶל־עֶזְרָתֵנוּ הָבֶל
  choice: à attendre en vain du secours
  rationale: Rend la syntaxe hébraïque condensée en exprimant à la fois l’orientation vers le secours espéré et sa futilité.
- source_word: בְּצִפִּיָּתֵנוּ צִפִּינוּ
  choice: dans notre attente, nous guettions
  rationale: Préserve autant que possible la répétition de la racine hébraïque tout en évitant une formulation artificielle en français.
- source_word: גּוֹי
  choice: une nation
  rationale: Le contexte désigne une puissance politique étrangère dont on espérait le secours.
- source_word: לֹא יוֹשִׁעַ
  choice: qui ne pouvait pas sauver
  rationale: Exprime l’incapacité pratique de cette nation à apporter la délivrance, tout en maintenant en note la possibilité d’un simple constat d’échec.
theological_decisions:
- issue: Incapacité ou échec de la nation attendue
  choice: qui ne pouvait pas sauver
  alternative: qui n’a pas sauvé
  rationale: L’imparfait modal convient au caractère vain de l’espoir, mais l’hébreu peut aussi être compris comme le constat que la nation n’a effectivement pas apporté le salut ; l’ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme et l’image des yeux épuisés sont conservés ; la répétition hébraïque liée à l’attente est rendue de manière naturelle plutôt que littérale.
