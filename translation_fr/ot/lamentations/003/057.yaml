  text: קָרַ֨בְתָּ֙ בְּ/י֣וֹם אֶקְרָאֶ֔/ךָּ אָמַ֖רְתָּ אַל תִּירָֽא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/057.yaml
  text: You came near on the day I called to you; you said[a], “Do not fear.”
translation:
  language: fr
  text: 'Tu t’es approché le jour où je t’ai appelé ; tu as dit : « N’aie pas peur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרַבְתָּ
  choice: Tu t’es approché
  rationale: Le qal accompli à la 2e personne du masculin singulier exprime ici le fait de s’approcher. Cette formulation française est naturelle et conserve l’image concrète de la proximité.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: La préposition ב avec יוֹם a une valeur temporelle. « Le jour où » restitue fidèlement l’expression hébraïque tout en restant idiomatique en français.
- source_word: אֶקְרָאֶךָּ
  choice: je t’ai appelé
  rationale: La forme vient de קרא, à la 1re personne du singulier avec suffixe de 2e personne masculine. Dans ce contexte de prière, elle désigne un appel adressé à Dieu ; le passé composé s’accorde naturellement avec le récit rétrospectif.
- source_word: אָמַרְתָּ
  choice: tu as dit
  rationale: Traduction directe et courante de אמר, qui introduit ici les paroles rapportées.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: אַל suivi de l’inaccompli exprime une défense ou un encouragement négatif. « N’aie pas peur » est naturel en français moderne et conserve la portée de l’hébreu sans l’intensifier.
theological_decisions:
- issue: Identification de l’interlocuteur et du locuteur
  choice: 'Le verset s’adresse directement à Dieu : « Tu t’es approché… tu as dit »'
  alternative: Comprendre les formes comme renvoyant à un interlocuteur masculin singulier non identifié
  rationale: Les verbes à la 2e personne masculine singulière indiquent clairement un interlocuteur unique ; dans le contexte de la prière environnante, il s’agit de Dieu. La traduction maintient cette relation directe sans ajouter d’affirmation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse singulière directe à Dieu. « N’aie pas peur » est préféré au plus littéral mais moins idiomatique « Ne crains pas ».
