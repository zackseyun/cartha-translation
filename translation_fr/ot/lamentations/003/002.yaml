  text: אוֹתִ֥/י נָהַ֛ג וַ/יֹּלַ֖ךְ חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/002.yaml
  text: He has driven me and made me walk in darkness and not light[a].
translation:
  language: fr
  text: Il m’a conduit et m’a fait marcher dans les ténèbres, et non dans la lumière[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il m’a poussé et m’a fait aller dans les ténèbres, et non dans la lumière. »'
    reason: 'Alternative lexicale : נָהַג peut évoquer l’action de pousser ou de mener, et וַיּוֹלַךְ peut se rendre par « faire aller ».'
lexical_decisions:
- source_word: אוֹתִי
  choice: m’
  rationale: La particule אֵת marque ici le complément d’objet direct à la première personne du singulier; le pronom élidé « m’ » le rend naturellement en français.
- source_word: נָהַג
  choice: a poussé
  rationale: Le verbe peut signifier conduire, mener ou pousser. « A poussé » conserve ici la nuance coercitive qui convient au contexte d’affliction, tout en laissant la variante plus neutre en note.
- source_word: וַיֹּלַךְ
  choice: m’a fait marcher
  rationale: La forme causative de הלך exprime le fait de faire aller ou marcher quelqu’un. « M’a fait marcher » en préserve clairement la valeur causative.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: « Les ténèbres » est une traduction directe, poétique et courante de חֹשֶׁךְ dans ce contraste avec la lumière.
- source_word: וְלֹא אוֹר
  choice: et non dans la lumière
  rationale: L’hébreu est elliptique, littéralement « et non lumière ». La reprise de « dans » est implicite et nécessaire à une formulation française naturelle; « et non » maintient l’opposition abrupte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. Le passé composé donne à l’action passée une portée encore sensible dans la plainte. La répétition de « m’a » préserve le parallélisme verbal et la force causative du texte hébreu.
