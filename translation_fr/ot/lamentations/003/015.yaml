  text: הִשְׂבִּיעַ֥/נִי בַ/מְּרוֹרִ֖ים הִרְוַ֥/נִי לַעֲנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/015.yaml
  text: He has filled me with bitterness[a]; he has made me drink wormwood.
translation:
  language: fr
  text: 'Il m’a rassasié d’amertumes,

    il m’a abreuvé[a] d’absinthe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il m’en a imbibé » ou « il m’en a donné à satiété ». Le verbe hébreu peut exprimer l’idée de faire boire abondamment ou de saturer.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׂבִּיעַנִי
  choice: m’a rassasié
  rationale: Le hiphil de שׂבע signifie « rassasier » ou « remplir ». « M’a rassasié » conserve l’idée forte d’en recevoir jusqu’à satiété, ici dans un sens douloureux clairement déterminé par le complément.
- source_word: בַמְּרוֹרִים
  choice: d’amertumes
  rationale: Le pluriel désigne des choses amères ou l’amertume sous ses diverses formes. Le pluriel français, légèrement poétique mais intelligible, préserve la forme et l’intensité de l’hébreu sans préciser indûment « herbes amères ».
- source_word: הִרְוַנִי
  choice: m’a abreuvé
  rationale: Le hiphil de רוה peut évoquer le fait de donner abondamment à boire, d’imbiber ou de saturer. « Abreuver » maintient l’image concrète de la boisson et le parallélisme avec « rassasier ».
- source_word: לַעֲנָה
  choice: d’absinthe
  rationale: לענה désigne une plante réputée pour son extrême amertume, traditionnellement rendue en français par « absinthe ». Ce choix conserve l’image végétale et ses résonances bibliques plutôt que de la réduire à la seule notion d’amertume.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme des deux propositions est conservé, ainsi que la progression entre satiété d’amertumes et absorption d’absinthe.
