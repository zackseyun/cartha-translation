source:
  edition: WLC
  text: גָּדַ֤ר דְּרָכַ/י֙ בְּ/גָזִ֔ית נְתִיבֹתַ֖/י עִוָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/009.yaml
  text: He has walled in my ways with hewn stone[c][b][a]; he has made my paths crooked.
translation:
  language: fr
  text: Il a muré mes chemins avec des pierres taillées[a] ; il a rendu mes sentiers tortueux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des pierres équarries » ou « avec des pierres de taille ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il a tordu mes sentiers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  choice: a muré
  rationale: Le verbe exprime l’action de fermer ou d’entourer au moyen d’un mur ou d’une clôture. « Muré » maintient ici l’image concrète d’un obstacle bâti, renforcée par les pierres taillées.
- source_word: דְּרָכַי
  choice: mes chemins
  rationale: Le nom peut désigner des voies concrètes comme, au sens figuré, le cours suivi par une personne. « Mes chemins » conserve cette amplitude et le parallélisme poétique avec « mes sentiers ».
- source_word: בְּגָזִית
  choice: avec des pierres taillées
  rationale: Le terme désigne de la pierre travaillée ou équarrie. Le pluriel collectif « des pierres taillées » est naturel en français et évoque une obstruction solide, délibérément construite.
- source_word: נְתִיבֹתַי
  choice: mes sentiers
  rationale: Le mot désigne un sentier, une piste ou une voie. « Mes sentiers » distingue naturellement ce terme de « mes chemins » tout en gardant le parallélisme.
- source_word: עִוָּה
  choice: a rendu tortueux
  rationale: Le verbe signifie courber, tordre ou rendre de travers. « A rendu tortueux » préserve l’image spatiale des sentiers sans lui imposer un sens moral.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme entre « chemins » et « sentiers » ainsi que les images concrètes de la maçonnerie et du trajet déformé sont conservés. Le sujet masculin singulier demeure implicite quant à son identité, comme dans le contexte hébreu.
