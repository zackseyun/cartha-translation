source:
  edition: WLC
  text: נַחְפְּשָׂ֤ה דְרָכֵ֨י/נוּ֙ וְֽ/נַחְקֹ֔רָה וְ/נָשׁ֖וּבָה עַד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/040.yaml
  text: Let us examine our ways and search them out[b][a], and let us return to Yahweh.
translation:
  language: fr
  text: Examinons nos voies, sondons-les, et revenons à Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « retournons-nous vers Yahweh »; le verbe peut aussi évoquer la repentance.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַחְפְּשָׂה
  choice: Examinons
  rationale: Le cohortatif à la première personne du pluriel porte une exhortation collective. « Examinons » exprime naturellement l’idée de rechercher avec soin dans ce contexte d’introspection morale.
- source_word: דְרָכֵינוּ
  choice: nos voies
  rationale: « Voies » conserve la métaphore hébraïque des chemins pour désigner la conduite et la manière de vivre.
- source_word: וְנַחְקֹרָה
  choice: sondons-les
  rationale: Le second cohortatif renforce le premier avec l’idée d’une investigation approfondie. « Sondons-les » préserve ce parallélisme sans répétition plate; le pronom reprend naturellement « nos voies ».
- source_word: וְנָשׁוּבָה
  choice: et revenons
  rationale: Le verbe שׁוב signifie fondamentalement revenir ou faire demi-tour. « Revenons » conserve l’image relationnelle sans la réduire au seul concept abstrait de repentance.
- source_word: עַד
  choice: à
  rationale: Après שׁוב, la préposition marque ici le mouvement en direction de Dieu; « à » est la formulation française la plus naturelle avec « revenir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel et son rôle relationnel dans l’appel à revenir à Dieu.
- issue: Portée de שׁוב
  choice: revenons
  alternative: repentons-nous; retournons-nous vers
  rationale: « Revenons » garde le sens concret et relationnel du verbe hébreu ainsi que son ouverture théologique; la repentance est impliquée par le contexte, mais ne doit pas être imposée comme son unique sens.
translation_notes:
  register: Français moderne, sobre et exhortatif. Le parallélisme « Examinons… sondons… revenons… » restitue les trois cohortatifs hébreux dans une formulation naturelle et digne.
