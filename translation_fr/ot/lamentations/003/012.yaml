  yaml_path: translation/ot/lamentations/003/012.yaml
  text: He bent his bow and set me up as a target for the arrow[a].
translation:
  language: fr
  text: 'Il a bandé son arc

    et m’a placé comme une cible pour la flèche.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il a tendu son arc et m’a placé comme une cible pour la flèche. »
    reason: Alternative lexicale pour דָּרַךְ (« bander », « tendre »).
lexical_decisions:
- source_word: דָּרַךְ
  choice: a bandé
  rationale: Avec « arc », le verbe désigne l’action de tendre ou bander l’arc en vue de tirer. « Bander son arc » est l’expression française naturelle et conserve l’image concrète.
- source_word: קַשְׁתּוֹ
  choice: son arc
  rationale: Le suffixe masculin singulier de troisième personne est rendu directement par le possessif « son ».
- source_word: וַיַּצִּיבֵנִי
  choice: et m’a placé
  rationale: Le verbe יצב signifie ici « placer, établir, faire tenir ». « M’a placé » restitue sobrement le fait que le locuteur est positionné comme objet de l’attaque.
- source_word: כַּמַּטָּרָא
  choice: comme cible
  rationale: Le préfixe כ exprime la comparaison et מטרה désigne une cible ou un but. « Comme cible » préserve explicitement la valeur comparative.
- source_word: לַחֵץ
  choice: pour la flèche
  rationale: La préposition ל exprime ici la destination ou la relation à l’attaque. Le singulier défini de l’hébreu est conservé dans « la flèche ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme poétique est conservé sur deux lignes, avec une formulation concrète et sans explicitation théologique ajoutée.
