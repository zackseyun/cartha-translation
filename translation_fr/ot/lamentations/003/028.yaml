review_pass:
  verdict: revise
  source_fidelity: Le jussif est correctement rendu par « Qu’il s’assoie », et « seul et se taise » restitue bien בָּדָד וְיִדֹּם. La dernière proposition doit cependant conserver plus visiblement la relation spatiale de עָלָיו (« sur lui »). « Il le lui a imposé » est grammaticalement possible, mais transforme cette relation en complément indirect et rend l’ambiguïté référentielle moins transparente.
  naturalness: « Qu’il s’assoie seul et se taise » est naturel dans un français moderne et sobre. « Car il l’a fait peser sur lui » est idiomatique, conserve l’idée contextuelle d’une charge imposée, et reflète plus directement la préposition hébraïque.
  terminology: « Faire peser sur » convient au contexte sans nommer ni Dieu ni le fardeau. Il conserve l’objet implicite par « l’ » et le destinataire masculin singulier par « lui ». La note doit indiquer que le sujet et l’objet restent implicites, plutôt que présenter « prendre sur lui » comme une simple équivalence non contextualisée.
  issues:
  - severity: medium
    issue: La formulation « il le lui a imposé » ne reflète pas explicitement עָלָיו.
    rationale: Le texte hébreu dit littéralement que quelque chose a été placé/porté « sur lui ». En français, « imposer à quelqu’un » est une adaptation recevable, mais « faire peser sur lui » préserve mieux l’image et la construction source tout en restant naturel.
  - severity: low
    issue: La note actuelle propose « il l’a pris sur lui » sans expliciter suffisamment qu’il s’agit d’une possibilité lexicale et syntaxiquement distincte.
    rationale: Cette option peut se comprendre avec « sur lui » comme complément du sujet, tandis que le rendu principal comprend le suffixe comme la personne sur qui la charge est placée. La note doit préserver cette possibilité sans brouiller les référents.
