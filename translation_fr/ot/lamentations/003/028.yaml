  text: יֵשֵׁ֤ב בָּדָד֙ וְ/יִדֹּ֔ם כִּ֥י נָטַ֖ל עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/028.yaml
  text: Let him sit alone and be silent[a], for he has laid it on him.
translation:
  language: fr
  text: Qu’il s’assoie seul et se taise, car il l’a fait peser sur lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il l’a pris sur lui ». L’hébreu ne précise ni le sujet de l’action ni ce que représente le pronom « l’ » ; la relation exprimée par « sur lui » peut aussi être comprise autrement selon le sens donné au verbe.'
    reason: ambiguïté lexicale et grammaticale
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Qu’il s’assoie
  rationale: L’imparfait qal de troisième personne masculine singulière a ici une valeur jussive dans la suite d’exhortations du contexte. Le subjonctif français rend naturellement cette nuance.
- source_word: בָּדָד
  choice: seul
  rationale: Ce terme exprime la solitude ou l’isolement. « Seul » est naturel, sobre et conserve la force affective du texte.
- source_word: וְיִדֹּם
  choice: et se taise
  rationale: Le verbe דמם peut évoquer le silence ou l’immobilité. Dans ce contexte d’acceptation de l’épreuve, « se taise » exprime clairement le silence sans exclure l’idée de calme.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’exhortation. « Car » conserve ce lien causal dans un registre digne et courant.
- source_word: נָטַל
  choice: a imposé
  rationale: Avec עַל, le verbe désigne ici le fait de placer ou de faire peser quelque chose sur quelqu’un. « Imposer » restitue naturellement cette idée en français, tout en laissant le complément non identifié.
- source_word: עָלָיו
  choice: le lui
  rationale: Le pronom indirect « lui » rend le destinataire masculin de ce qui est imposé; le pronom « le » représente en français l’objet implicite sans le nommer.
theological_decisions:
- issue: Sujet de נָטַל et objet sous-entendu
  choice: Conserver les référents indéterminés au moyen de « il le lui a imposé »
  alternative: « car le Seigneur le lui a imposé » ou « car il l’a pris sur lui »
  rationale: L’hébreu ne nomme explicitement ni le sujet de l’action ni ce qui est placé ou porté. La traduction n’ajoute donc ni « le Seigneur » ni un nom précis comme « fardeau », et la note signale l’autre compréhension possible du verbe.
translation_notes:
  register: Français international moderne, sobre et digne. La construction jussive est rendue sans archaïsme, et les pronoms préservent autant que possible l’ambiguïté concise de l’hébreu.
