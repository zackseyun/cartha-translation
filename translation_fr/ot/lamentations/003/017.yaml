  text: וַ/תִּזְנַ֧ח מִ/שָּׁל֛וֹם נַפְשִׁ֖/י נָשִׁ֥יתִי טוֹבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/017.yaml
  text: You have thrust my soul away from peace[c][b][a]; I have forgotten goodness.
translation:
  language: fr
  text: Tu as privé mon âme de paix[a] ; j’ai oublié le bien-être[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, on peut aussi traduire : « Tu as rejeté mon âme loin de la paix », ou comprendre : « Mon âme est privée de paix. » Le mot hébreu traduit par « paix » peut aussi désigner le bien-être ou l’intégrité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le bien », « le bonheur » ou « la prospérité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנַח
  choice: Tu as privé
  rationale: Le verbe זנח exprime le rejet ou la mise à l’écart. Avec « de paix », « priver » restitue naturellement en français l’idée d’être écarté de cet état, sans atténuer la violence de la plainte.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » convient au registre poétique et conserve la dimension intérieure de la plainte.
- source_word: מִשָּׁלוֹם
  choice: de paix
  rationale: שָׁלוֹם recouvre la paix, le bien-être et l’intégrité. « Paix » est idiomatique ici, tandis qu’une note conserve l’étendue du terme hébreu.
- source_word: נָשִׁיתִי
  choice: j’ai oublié
  rationale: Le parfait à la première personne exprime directement l’oubli. Il n’est pas nécessaire d’ajouter une valeur causative absente de la forme.
- source_word: טוֹבָה
  choice: le bonheur
  rationale: טוֹבָה désigne ici le bien éprouvé, le bien-être ou la prospérité. « Le bonheur » exprime naturellement en français la perte de toute expérience favorable, sans la limiter aux biens matériels.
theological_decisions:
- issue: Sujet et construction de וַתִּזְנַח
  choice: 'Adresse directe à Dieu : « Tu as privé mon âme »'
  alternative: « Mon âme est privée de paix » ou « Tu as rejeté mon âme loin de la paix »
  rationale: La forme peut être comprise comme une deuxième personne masculine singulière dans l’adresse à Dieu, tandis que la syntaxe poétique permet aussi une lecture moins directement personnelle. La traduction principale suit l’adresse divine suggérée par le contexte, et la note signale l’autre formulation possible.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme bref de l’hébreu est conservé, avec une formulation principale naturelle et des notes qui préservent les ambiguïtés lexicales et syntaxiques.
