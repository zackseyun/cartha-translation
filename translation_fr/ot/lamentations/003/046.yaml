  yaml_path: translation/ot/lamentations/003/046.yaml
  text: All our enemies have opened their mouths against us[a].
translation:
  language: fr
  text: Tous nos ennemis ont ouvert la bouche contre nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּצוּ
  choice: ouvrent grand
  rationale: Le qal accompli de פצה, associé à « bouche », décrit l’action d’ouvrir la bouche et peut évoquer ici l’hostilité ou la raillerie. Le présent français convient au discours poétique de lamentation et « grand » restitue la force de l’expression sans expliciter davantage l’intention.
- source_word: עָלֵינוּ
  choice: contre nous
  rationale: Dans ce contexte hostile, la préposition עַל a une valeur adversative plutôt que simplement spatiale.
- source_word: פִּיהֶם
  choice: la bouche
  rationale: L’hébreu emploie le singulier « leur bouche » avec un sujet pluriel. Le français peut naturellement conserver ce singulier distributif.
- source_word: כָּל
  choice: Tous
  rationale: Devant « nos ennemis », כָּל a un sens collectif rendu naturellement par « tous ».
- source_word: אֹיְבֵינוּ
  choice: nos ennemis
  rationale: Traduction directe et usuelle de אֹיֵב avec le suffixe de première personne du pluriel.
