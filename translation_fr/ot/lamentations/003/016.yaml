  text: וַ/יַּגְרֵ֤ס בֶּֽ/חָצָץ֙ שִׁנָּ֔/י הִכְפִּישַׁ֖/נִי בָּ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/016.yaml
  text: He has ground my teeth with gravel[b][a]; he has pressed me down into the ashes.
translation:
  language: fr
  text: Il m’a broyé les dents avec du gravier[a] ; il m’a fait me courber dans la cendre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il m’a brisé les dents avec des cailloux. »'
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « m’a fait me courber » est rare et son sens précis est incertain. Il peut aussi exprimer l’idée de m’humilier, de m’abaisser, ou de me contraindre à me tenir dans la cendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגְרֵס
  choice: a broyé
  rationale: Le verbe exprime l’action d’écraser ou de broyer. « Broyé » conserve la violence concrète de l’image et s’emploie naturellement avec « les dents ».
- source_word: בֶּחָצָץ
  choice: avec du gravier
  rationale: חָצָץ désigne de petites pierres ou du gravier. « Du gravier » rend bien le caractère abrasif de l’image.
- source_word: שִׁנָּי
  choice: mes dents
  rationale: Le nom hébreu est au pluriel et porte le suffixe de première personne du singulier.
- source_word: הִכְפִּישַׁנִי
  choice: m’a enfoncé
  rationale: Ce verbe rare semble exprimer l’abaissement ou le fait de plaquer quelqu’un au sol. « M’a enfoncé » maintient à la fois la dimension physique et l’humiliation, sans exclure les autres nuances possibles.
- source_word: בָּאֵפֶר
  choice: dans la cendre
  rationale: אֵפֶר signifie « cendre ». Avec le verbe choisi, « dans » exprime naturellement le mouvement vers la cendre sans remplacer celle-ci par la poussière.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme et la violence des images hébraïques sont conservés. « La cendre », au singulier collectif, est plus naturel en français que « les cendres » dans cette construction.
