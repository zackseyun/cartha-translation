source:
  edition: WLC
  text: רָאִ֨יתָה֙ כָּל נִקְמָתָ֔/ם כָּל מַחְשְׁבֹתָ֖/ם לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/060.yaml
  text: You have seen all their vengeance[a], all their schemes against me.
translation:
  language: fr
  text: Tu as vu toute leur vengeance, tous leurs projets contre moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous leurs projets à mon sujet ». La préposition hébraïque peut exprimer plus largement une relation, mais le contexte hostile favorise « contre moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: Tu as vu
  rationale: Le qal accompli, 2e personne masculine singulière, s’adresse à Dieu. Le passé composé exprime naturellement en français une action constatée dont la portée demeure présente.
- source_word: כָּל
  choice: toute / tous
  rationale: Le terme marque la totalité dans ses deux emplois; l’accord français exige « toute » avec « vengeance » et « tous » avec « projets ».
- source_word: נִקְמָתָם
  choice: leur vengeance
  rationale: Le nom נְקָמָה désigne la vengeance ou l’action de se venger; le suffixe renvoie aux ennemis. « Vengeance » conserve la force du terme hébreu.
- source_word: מַחְשְׁבֹתָם
  choice: leurs projets
  rationale: מַחֲשָׁבוֹת peut désigner des pensées, des desseins ou des projets. « Projets » préserve ici la relative neutralité lexicale du mot, tandis que le contexte et « contre moi » indiquent leur caractère hostile.
- source_word: לִי
  choice: contre moi
  rationale: La préposition לְ peut exprimer la relation ou la direction. Dans ce contexte de vengeance ennemie, « contre moi » rend naturellement la valeur hostile, tout en signalant en note l’autre lecture possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement convient à l’adresse individuelle à Dieu dans le contexte du poème. La traduction conserve le parallélisme et évite de renforcer מַחְשְׁבוֹת par « complots », puisque l’hostilité est déjà exprimée par « contre moi ».
