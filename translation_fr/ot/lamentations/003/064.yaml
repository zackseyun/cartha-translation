  text: תָּשִׁ֨יב לָ/הֶ֥ם גְּמ֛וּל יְהוָ֖ה כְּ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/064.yaml
  text: You will repay them[a], O Yahweh[b], according to the work of their hands.
translation:
  language: fr
  text: Tu leur rendras la rétribution[a], Yahweh, selon l’œuvre de leurs mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puisses-tu leur rendre la rétribution ». Le verbe hébreu peut exprimer aussi bien un souhait formulé dans la prière qu’une affirmation confiante.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « selon l’œuvre de leurs mains », expression qui désigne ce qu’ils ont fait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב לָהֶם גְּמוּל
  choice: Tu leur rendras
  rationale: Le hiphil de שוב exprime ici le fait de faire revenir sur eux ce qui leur est dû, en association avec גְּמוּל, « rétribution ». « Rendre » restitue naturellement en français l’idée de rétribuer, tandis que le futur garde la nuance possible d’assurance au sein de la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: selon l’œuvre de leurs mains
  rationale: « Selon » marque la correspondance de la rétribution avec leurs actes. La formulation conserve le singulier collectif מַעֲשֶׂה et l’image hébraïque concrète des « mains ».
theological_decisions:
- issue: Valeur modale de תָּשִׁיב dans une prière
  choice: Tu leur rendras
  alternative: Puisses-tu leur rendre
  rationale: Le yiqtol peut être compris comme un futur exprimant la confiance ou comme un souhait à valeur jussive. Le texte principal retient le futur et la note préserve explicitement l’autre lecture.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération représente le nom propre du texte source sans lui substituer un titre traditionnel.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement convient à l’adresse directe à Dieu. La tournure concise conserve l’image hébraïque tout en restant intelligible; l’ambiguïté entre demande et assurance est maintenue par la note.
