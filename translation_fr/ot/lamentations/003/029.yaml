source:
  edition: WLC
  text: יִתֵּ֤ן בֶּֽ/עָפָר֙ פִּ֔י/הוּ אוּלַ֖י יֵ֥שׁ תִּקְוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/029.yaml
  text: Let him put his mouth in the dust—perhaps there is hope[a].
translation:
  language: fr
  text: Qu’il mette sa bouche dans la poussière — peut-être y a-t-il de l’espoir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Qu’il place sa bouche dans la poussière » ; cette expression évoque une profonde humilité, l’abaissement ou une soumission silencieuse.
    reason: alternative lexicale et éclairage de l’expression imagée
lexical_decisions:
- source_word: יִתֵּן
  choice: Qu’il mette
  rationale: Le verbe נתן signifie couramment « donner, mettre, placer ». Dans cette suite d’exhortations, la forme yiqtol a une valeur jussive, bien rendue par « Qu’il mette ».
- source_word: בֶּעָפָר
  choice: dans la poussière
  rationale: עָפָר désigne la poussière ou la terre meuble. « Dans la poussière » conserve l’image concrète et sa résonance biblique.
- source_word: פִּיהוּ
  choice: sa bouche
  rationale: Traduction littérale du nom avec suffixe masculin singulier. L’image corporelle est maintenue sans réduire son sens possible à une seule interprétation.
- source_word: אוּלַי
  choice: peut-être
  rationale: אוּלַי exprime une possibilité ou une attente incertaine. « Peut-être » en garde la retenue.
- source_word: יֵשׁ
  choice: il y a
  rationale: La particule existentielle signifie « il y a, il existe » ; l’incertitude est déjà exprimée par « peut-être ».
- source_word: תִּקְוָה
  choice: de l’espoir
  rationale: תִּקְוָה signifie couramment « espoir » ou « attente ». La tournure française naturelle après « il y a » est « de l’espoir ».
theological_decisions:
- issue: Posture imagée d’humilité et de soumission
  choice: Conserver l’image concrète « mette sa bouche dans la poussière ».
  alternative: Paraphraser par « s’incline dans l’humiliation » ou « garde le silence dans l’abaissement ».
  rationale: L’hébreu présente une posture corporelle saisissante pouvant évoquer l’humilité profonde, l’abaissement ou la soumission silencieuse. La traduction préserve cette pluralité au lieu d’imposer une seule explication.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le parallélisme exhortatif, l’image corporelle et l’incertitude exprimée par « peut-être ».
