  text: זְכָר עָנְיִ֥/י וּ/מְרוּדִ֖/י לַעֲנָ֥ה וָ/רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/019.yaml
  text: Remember my affliction and my wandering[b][a], the wormwood and the gall.
translation:
  language: fr
  text: Souviens-toi de mon affliction et de mon errance[a], de l’absinthe et du poison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ma vie sans foyer » ; le terme hébreu évoque une errance instable.
    reason: lexical_alternative
  - marker: b
    text: L’absinthe et le poison sont des images concrètes de l’amertume et de ce qui fait mourir ; ensemble, ils peuvent évoquer une souffrance extrêmement amère.
    reason: cultural_note
lexical_decisions:
- source_word: זְכָר
  choice: Souviens-toi
  rationale: L’impératif qal masculin singulier exprime une demande directe. « Souviens-toi » est naturel en français et conserve cette adresse.
- source_word: עָנְיִי
  choice: mon affliction
  rationale: Le terme désigne la détresse, la misère ou la souffrance. « Affliction » en garde le poids concret sans préciser indûment sa nature.
- source_word: מְרוּדִי
  choice: mon errance
  rationale: Le nom évoque une vie instable et vagabonde. « Errance » préserve cette amplitude, tandis que « absence de foyer » serait plus interprétatif.
- source_word: לַעֲנָה
  choice: l’absinthe
  rationale: Le mot hébreu désigne une plante amère employée comme image de l’amertume. Le nom concret est conservé plutôt que remplacé par son sens figuré.
- source_word: וָרֹאשׁ
  choice: le poison
  rationale: רֹאשׁ peut désigner une plante vénéneuse ou une substance toxique et amère. « Poison » reste concret, intelligible en français moderne et conserve l’association entre toxicité et amertume.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. L’impératif et les images concrètes de l’hébreu sont maintenus ; la répétition de « de » clarifie que l’absinthe et le poison appartiennent au contenu du souvenir.
