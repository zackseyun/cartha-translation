  text: ט֤וֹב וְ/יָחִיל֙ וְ/דוּמָ֔ם לִ/תְשׁוּעַ֖ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/026.yaml
  text: It is good to wait quietly for the salvation of Yahweh[a].
translation:
  language: fr
  text: Il est bon d’attendre en silence le salut de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il est bon d’espérer, en silence, le salut de Yahweh »; le verbe hébreu peut exprimer une attente pleine d’espérance.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Il est bon
  rationale: L’adjectif ouvre une proposition sans verbe exprimé. « Il est bon » restitue naturellement en français sa valeur prédicative et évaluative.
- source_word: יָחִיל
  choice: d’attendre
  rationale: Le verbe יחל associe l’attente à l’espérance. Dans ce contexte, « attendre » convient naturellement, tandis que l’objet attendu, le salut de Yahweh, conserve la nuance d’espérance.
- source_word: דוּמָם
  choice: en silence
  rationale: L’adverbe évoque le silence et l’immobilité paisible. « En silence » est idiomatique et reste proche de la formulation hébraïque.
- source_word: לִתְשׁוּעַת
  choice: le salut
  rationale: תְּשׁוּעָה peut désigner le salut ou la délivrance. « Le salut » garde ici à la fois la portée concrète de l’intervention divine et sa résonance théologique plus large.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par « Yahweh », ce qui préserve le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin et évite de substituer un titre au texte source.
- issue: Nuance de יָחִיל
  choice: attendre
  alternative: espérer
  rationale: Le verbe permet les deux nuances. « Attendre » s’accorde bien avec le salut encore attendu, sans exclure l’espérance implicite; la variante est signalée en note afin de préserver l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe concise reflète la formulation proverbiale de l’hébreu; « en silence » conserve son image de calme sans surinterpréter l’attitude intérieure.
