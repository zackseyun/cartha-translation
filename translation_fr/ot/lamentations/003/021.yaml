  yaml_path: translation/ot/lamentations/003/021.yaml
  text: This I call to mind[a]; therefore I have hope.
translation:
  language: fr
  text: Je me rappelle ceci[a] ; c’est pourquoi j’espère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « Je ramène ceci à mon cœur. » En hébreu, le « cœur » peut désigner le for intérieur, notamment la pensée et la mémoire. Le verbe rendu par « j’espère » peut aussi exprimer une attente confiante.
    reason: Préserve l’image hébraïque de « ramener à son cœur » et signale la nuance possible d’attente confiante, sans alourdir le texte.
lexical_decisions:
- source_word: זֹאת
  choice: Voici ce que
  rationale: Le démonstratif féminin singulier peut renvoyer à ce qui précède ou annoncer ce qui suit. « Voici ce que » demeure ouvert tout en introduisant naturellement en français le contenu remémoré.
- source_word: אָשִׁיב
  choice: je ramène
  rationale: Le hiphil de שוב signifie littéralement « faire revenir, ramener ». Cette traduction conserve l’image hébraïque et s’accorde naturellement avec « à mon cœur ».
- source_word: אֶל לִבִּי
  choice: à mon cœur
  rationale: Dans l’anthropologie hébraïque, le cœur est le siège de la pensée, de la mémoire et de la résolution intérieure. Le conserver préserve ici l’image concrète sans être obscur en français.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette locution exprime la conséquence logique de ce retour intérieur et se lit avec naturel en français moderne.
- source_word: אוֹחִיל
  choice: j’espère
  rationale: Le hiphil de יחל exprime l’espoir ou l’attente confiante. « J’espère » est concis et laisse subsister la nuance d’attente, signalée en note.
theological_decisions:
- issue: Valeur anthropologique de לֵב (« cœur »)
  choice: Conserver « cœur » dans l’image « ramener à mon cœur »
  alternative: « Je me rappelle ceci » ou « je remets ceci en mémoire »
  rationale: Le cœur hébraïque comprend la pensée, la mémoire et la volonté, et non les seules émotions. La formulation retenue préserve cette conception et l’image poétique sans imposer une lecture doctrinale particulière.
- issue: Nuance de אוֹחִיל entre espérance et attente
  choice: « j’espère »
  alternative: « j’attends avec confiance »
  rationale: Le contexte fait ressortir l’espérance retrouvée, tandis que le verbe peut aussi comporter une nuance d’attente. La note maintient cette amplitude sémantique.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe demeure simple. Le choix relativement formel « ramène à mon cœur » conserve l’image hébraïque, tandis que la note donne l’équivalent idiomatique.
