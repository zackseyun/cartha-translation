  text: Waters closed over my head[a]; I said[b], “I am cut off.”
translation:
  language: fr
  text: 'Les eaux ont recouvert ma tête[a] ; j’ai dit : « Je suis retranché[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les eaux ont déferlé au-dessus de ma tête. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Je suis perdu » ou « Je suis anéanti ». L’hébreu dit littéralement « Je suis retranché », image d’une personne coupée de la vie ou de tout espoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוּ
  choice: ont recouvert
  rationale: Dans ce contexte, le verbe décrit les eaux qui montent jusqu’à couvrir ou submerger le locuteur. « Ont recouvert » conserve l’image concrète et reste naturel en français.
- source_word: מַיִם
  choice: les eaux
  rationale: Le pluriel poétique « les eaux » correspond à la forme hébraïque et convient au registre des Lamentations.
- source_word: עַל רֹאשִׁי
  choice: ma tête
  rationale: Avec « recouvrir », le français exprime naturellement le rapport sans rendre séparément עַל ; l’image concrète de la tête submergée est préservée.
- source_word: אָמַרְתִּי
  choice: j’ai dit
  rationale: La traduction directe maintient la formulation hébraïque sans décider s’il s’agit de paroles prononcées ou d’un discours intérieur.
- source_word: נִגְזָרְתִּי
  choice: je suis retranché
  rationale: « Retranché » préserve la métaphore d’une personne coupée de la vie ou de tout espoir, sans la réduire à une interprétation comme « je suis perdu ».
theological_decisions:
- issue: Portée de נִגְזָרְתִּי
  choice: je suis retranché
  alternative: je suis perdu / c’en est fait de moi
  rationale: Le texte ne précise pas explicitement si le locuteur se dit voué à la mort, détruit ou privé d’espoir. La formulation retenue conserve cette tension.
translation_notes:
  register: Français international moderne, poétique et digne. « Les eaux » maintient le registre élevé du poème ; « retranché » conserve l’image hébraïque tout en restant intelligible grâce à la note.
