  text: בָּנָ֥ה עָלַ֛/י וַ/יַּקַּ֖ף רֹ֥אשׁ וּ/תְלָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/005.yaml
  text: He has built against me and surrounded me with bitterness and hardship[a][b].
translation:
  language: fr
  text: Il a bâti contre moi[b] et m’a encerclé d’amertume[a] et de peine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de poison et de peine » ; רֹאשׁ peut désigner une substance toxique ou amère, traditionnellement rendue aussi par « fiel ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Il a bâti contre moi » ; cette formulation évoque probablement les ouvrages d’un siège.'
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: a bâti contre
  rationale: Le verbe signifie littéralement « bâtir ». Avec עָלַי, il décrit ici une construction hostile, évoquant probablement les ouvrages d’un siège, sans remplacer l’image par une interprétation explicite.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte hostile, « contre moi » exprime naturellement la valeur adversative de la préposition, plutôt que le sens spatial « sur moi ».
- source_word: וַיַּקַּף
  choice: m’a encerclé
  rationale: Le verbe signifie « entourer, encercler ». « M’a encerclé » conserve l’image concrète du siège; le complément « me » est explicité d’après le contexte.
- source_word: רֹאשׁ
  choice: amertume
  rationale: Le nom peut désigner une substance amère ou toxique, traditionnellement le « fiel ». « Amertume » est naturel dans la poésie de lamentation tout en laissant « poison » comme possibilité signalée en note.
- source_word: וּתְלָאָה
  choice: et de peine
  rationale: Le nom désigne la fatigue, l’épreuve ou la détresse. « Peine » convient au contexte d’affliction et forme en français une expression naturelle sans réduire le terme à la seule fatigue physique.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore concrète de la construction hostile et de l’encerclement est conservée; les deux notes rendent compte de l’ambiguïté lexicale et de l’image probable du siège.
