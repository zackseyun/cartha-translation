  text: כִּ֣י לֹ֥א יִזְנַ֛ח לְ/עוֹלָ֖ם אֲדֹנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/031.yaml
  text: For the Lord will not reject forever[a].
translation:
  language: fr
  text: Car le Seigneur ne rejettera pas pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’abandonnera pas » ou « ne repoussera pas ». Le verbe hébreu peut désigner le fait de rejeter, d’abandonner ou de repousser.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de ce qui précède. « Car » conserve naturellement cette valeur connective sans imposer une nuance plus précise.
- source_word: לֹא
  choice: ne… pas
  rationale: Négation française normale portant directement sur le verbe.
- source_word: יִזְנַח
  choice: rejette
  rationale: Le verbe זנח peut exprimer le rejet, la répudiation ou l’abandon. « Rejeter » est clair, actuel et garde ici la portée relationnelle du terme sans ajouter de complément absent de l’hébreu.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Dans cette construction négative, l’expression indique que le rejet du Seigneur ne dure pas indéfiniment. « Pour toujours » en restitue directement la portée temporelle.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: אֲדֹנָי est un titre divin signifiant « Seigneur », et non le nom divin YHWH. L’article est requis par l’usage français courant.
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: Seigneur
  rationale: Le texte emploie le titre אֲדֹנָי, non le tétragramme. « Le Seigneur » traduit ce titre de façon naturelle en français sans introduire une distinction absente du texte.
- issue: Objet implicite du verbe « rejeter »
  choice: Aucun objet ajouté
  alternative: « ne nous rejette pas » ou « ne rejette personne »
  rationale: L’hébreu ne précise pas l’objet. Ne pas en ajouter préserve l’ellipse et évite de restreindre indûment la portée du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation concise conserve l’ellipse de l’hébreu et le lien logique avec le contexte.
