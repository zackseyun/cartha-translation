  text: מִ/פִּ֤י עֶלְיוֹן֙ לֹ֣א תֵצֵ֔א הָ/רָע֖וֹת וְ/הַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/038.yaml
  text: Do not both calamities and good come from the mouth of the Most High?[a]
translation:
  language: fr
  text: Les malheurs et le bonheur ne viennent-ils pas de la bouche du Très-Haut ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les maux » ou « les désastres » ; le mot hébreu peut désigner largement ce qui est mauvais, nuisible ou défavorable. Ici, « les malheurs » évite de suggérer nécessairement le mal moral.
    reason: alternative lexicale
lexical_decisions:
- source_word: מִפִּי
  choice: de la bouche de
  rationale: Conserve l’image hébraïque de la bouche comme source d’une parole ou d’un décret, tout en restant naturel en français.
- source_word: עֶלְיוֹן
  choice: du Très-Haut
  rationale: Titre divin consacré en français, fidèle à l’idée d’élévation suprême.
- source_word: לֹא
  choice: ne… pas
  rationale: La négation s’inscrit ici dans une question rhétorique, conformément au contexte immédiat de Lamentations 3.37-39.
- source_word: תֵצֵא
  choice: viennent
  rationale: Rend naturellement l’idée de sortir ou de procéder d’une source; le pluriel français s’accorde avec les deux éléments coordonnés.
- source_word: הָרָעוֹת
  choice: les malheurs
  rationale: Dans ce contexte, le terme désigne les réalités nuisibles ou adverses; « malheurs » préserve cette portée sans imposer le sens d’un mal moral.
- source_word: וְהַטּוֹב
  choice: et le bonheur
  rationale: Le substantif adjectival désigne ce qui est bon ou favorable. « Le bonheur » forme en français une opposition naturelle avec « les malheurs », tout en gardant une portée générale.
theological_decisions:
- issue: 'La portée de רָעוֹת : mal moral ou réalités adverses'
  choice: « les malheurs »
  alternative: « les maux », « le mal » ou « les désastres »
  rationale: Le contexte concerne l’adversité et l’affliction sous le gouvernement du Très-Haut. « Les malheurs » évite d’affirmer plus précisément que le texte ne l’exige que Dieu serait l’auteur du mal moral.
- issue: Négation déclarative ou question rhétorique
  choice: 'Question rhétorique : « ne viennent-ils pas… ? »'
  alternative: 'Déclaration négative : « ne viennent pas… »'
  rationale: Dans l’enchaînement de Lamentations 3.37-39, la phrase affirme rhétoriquement que les événements favorables comme défavorables relèvent du commandement du Très-Haut.
translation_notes:
  register: Français international moderne, digne et accessible. L’image hébraïque « de la bouche du Très-Haut » et la forme interrogative sont conservées; l’opposition idiomatique « les malheurs et le bonheur » rend naturellement le contraste du texte.
