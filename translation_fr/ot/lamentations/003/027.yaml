  text: ט֣וֹב לַ/גֶּ֔בֶר כִּֽי יִשָּׂ֥א עֹ֖ל בִּ/נְעוּרָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/027.yaml
  text: It is good for a man that he bear the yoke in his youth[a][b].
translation:
  language: fr
  text: Il est bon pour l’homme de porter le joug dans sa jeunesse[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour une personne » ; l’hébreu emploie le masculin singulier « homme » dans un énoncé de portée générale.
    reason: lexical_alternative
  - marker: b
    text: Ou « de supporter le joug » ; l’image évoque le fait de prendre sur soi et d’endurer une charge ou une discipline.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Il est bon
  rationale: L’adjectif prédicatif ouvre l’énoncé; le français naturel demande la tournure impersonnelle « Il est bon ».
- source_word: לַגֶּבֶר
  choice: pour l’homme
  rationale: גֶּבֶר désigne ici un homme de manière représentative. « L’homme » conserve le masculin du texte hébreu tout en pouvant porter une portée générale.
- source_word: כִּי
  choice: de
  rationale: כִּי introduit ici le contenu de ce qui est bon. Après « Il est bon pour l’homme », l’infinitif français avec « de » exprime naturellement ce rapport sans lui donner une valeur causale.
- source_word: יִשָּׂא
  choice: porter
  rationale: נשׂא peut signifier lever, porter ou supporter. Avec עֹל, « porter » est idiomatique et maintient à la fois l’image concrète et l’idée d’endurance.
- source_word: עֹל
  choice: le joug
  rationale: Le terme signifie littéralement « joug » et fonctionne comme image d’une charge ou d’une discipline. L’article défini convient à l’emploi générique français.
- source_word: בִּנְעוּרָיו
  choice: dans sa jeunesse
  rationale: La forme désigne la période de la jeunesse; cette expression est naturelle, concise et respecte le suffixe masculin singulier.
theological_decisions:
- issue: Référence masculine à portée générale
  choice: pour l’homme… dans sa jeunesse
  alternative: pour une personne… pendant sa jeunesse
  rationale: L’hébreu emploie explicitement גֶּבֶר et un suffixe masculin singulier. La formulation française conserve ce marquage tout en laissant au proverbe sa portée représentative.
- issue: Sens métaphorique du joug
  choice: conserver « le joug »
  alternative: expliciter par « la charge » ou « la discipline »
  rationale: Le texte ne précise pas la nature du joug. Garder l’image préserve l’ambiguïté entre épreuve, charge et discipline plutôt que d’imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste immédiatement compréhensible, tandis que l’image traditionnelle du « joug » est conservée sans en fixer abusivement le sens.
