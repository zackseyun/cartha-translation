  text: זָכ֣וֹר תִּזְכּ֔וֹר ו/תשיח עָלַ֖/י נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/020.yaml
  text: My soul continually remembers and is bowed down within me[a].
translation:
  language: fr
  text: Mon âme ne cesse de s’en souvenir et elle est abattue en moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Elle se souvient, elle se souvient, et mon âme est abaissée sur moi. » La répétition hébraïque renforce l’action de se souvenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר תִּזְכּוֹר
  choice: ne cesse de s’en souvenir
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’idée verbale. « Ne cesse de s’en souvenir » rend naturellement en français la persistance ou l’insistance du souvenir, avec « mon âme » comme sujet exprimé à la fin de la proposition hébraïque.
- source_word: וְתָשִׁיחַ
  choice: s’abaisse
  rationale: Le verbe exprime ici le fait d’être abaissé ou courbé. « S’abaisse » conserve l’image concrète sans préciser davantage qu’il ne faut la nature de l’accablement.
- source_word: עָלַי
  choice: au-dedans de moi
  rationale: Littéralement « sur moi ». Avec « mon âme » comme sujet, le français « au-dedans de moi » communique naturellement l’abattement intérieur tout en signalant en note la formulation hébraïque.
- source_word: נַפְשִׁי
  choice: Mon âme
  rationale: « Mon âme » préserve la texture poétique et anthropologique de נֶפֶשׁ, qui peut désigner la personne, la vie intérieure ou le moi.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. La tournure « ne cesse de » rend l’intensification hébraïque avec naturel; « au-dedans de moi » restitue l’idiome intérieur sans effacer la formulation littérale, donnée en note.
