  - severity: low
    issue: Formulation de la note littérale
    rationale: « Se souvenant, elle se souvient » n’est pas une bonne représentation française de l’infinitif absolu intensif. La répétition « Elle se souvient, elle se souvient » permet de la montrer sans lui attribuer une valeur circonstancielle.
