  text: כִּ֣י אִם הוֹגָ֔ה וְ/רִחַ֖ם כְּ/רֹ֥ב חסד/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/032.yaml
  text: For if he causes grief[b][a], he will also show compassion according to the abundance of his steadfast love.
translation:
  language: fr
  text: Car, même s’il cause du chagrin[a], il fait aussi preuve de compassion, selon l’abondance de son amour fidèle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car, s’il cause du chagrin, il fera aussi preuve de compassion, selon l’abondance de son amour fidèle. » La construction hébraïque peut avoir une nuance conditionnelle ou concessive dans ce contexte.'
    reason: alternative_reading
  - marker: b
    text: L’expression « amour fidèle » traduit l’hébreu ḥèsèd, qui peut aussi désigner la bonté, la fidélité aimante ou l’amour lié à une alliance, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car, même si
  rationale: La combinaison relie le verset au contexte précédent avec une valeur explicative, tout en permettant la nuance concessive qui convient au contraste interne du verset.
- source_word: הוֹגָה
  choice: il cause du chagrin
  rationale: La forme causative exprime le fait de susciter peine ou affliction. « Cause du chagrin » conserve cette valeur et le registre affectif du passage.
- source_word: וְרִחַם
  choice: il fait preuve de compassion
  rationale: רחם désigne une compassion active. Le présent français convient à la portée générale de l’énoncé, tandis que le contraste est naturellement porté par « même si ».
- source_word: כְּרֹב
  choice: tant … est grand
  rationale: Cette tournure française naturelle exprime la mesure ou le fondement abondant indiqué par כְּרֹב sans calquer lourdement « selon l’abondance de ».
- source_word: חסדו
  choice: son amour fidèle
  rationale: חסד associe amour, fidélité et bonté durable. « Amour fidèle » garde cette richesse et le distingue de la compassion exprimée par רחם.
theological_decisions:
- issue: Rapport entre l’affliction causée et la compassion divine
  choice: 'Lecture concessive : « même s’il cause du chagrin, il fait preuve de compassion »'
  alternative: 'Lecture conditionnelle : « s’il cause du chagrin, il fera aussi preuve de compassion »'
  rationale: Le contexte de Lamentations 3:31-33 favorise une concession, mais la construction hébraïque peut également être entendue comme conditionnelle; cette possibilité est donc conservée en note.
- issue: Distinction entre רחם et חסד
  choice: Rendre רחם par « compassion » et חסד par « amour fidèle »
  alternative: Employer le vocabulaire de la miséricorde pour les deux termes
  rationale: La distinction française reflète les deux termes hébreux apparentés mais non identiques et évite d’effacer la texture théologique du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le contraste du texte hébreu, distingue compassion et amour fidèle, et signale en note l’ambiguïté réelle entre lecture concessive et conditionnelle.
