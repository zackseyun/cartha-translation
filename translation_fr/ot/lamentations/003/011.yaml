  yaml_path: translation/ot/lamentations/003/011.yaml
  text: He turned my paths aside and tore me apart[a]; he made me desolate.
translation:
  language: fr
  text: Il a fait dévier mes sentiers et m’a déchiré[a] ; il a fait de moi une désolation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’a mis en pièces ». Le verbe hébreu est rare et semble décrire une violente mise en pièces, peut-être dans le prolongement de l’image animale du contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכַי
  choice: mes sentiers
  rationale: Le pluriel concret est conservé et prolonge naturellement en français l’image du parcours suivi par le locuteur.
- source_word: סוֹרֵר
  choice: a détourné
  rationale: Le verbe exprime ici l’action de faire dévier ou de détourner les sentiers du locuteur.
- source_word: וַיְפַשְּׁחֵנִי
  choice: m’a déchiré
  rationale: Ce verbe rare évoque une déchirure violente, probablement dans le prolongement de l’image du prédateur au verset précédent, sans imposer dans le texte principal une manière précise de mettre en pièces.
- source_word: שָׂמַנִי
  choice: m’a réduit à
  rationale: Cette tournure française exprime naturellement le résultat produit par שׂים avec son complément d’état.
- source_word: שֹׁמֵם
  choice: la désolation
  rationale: La formulation rend l’état de ruine et d’abandon exprimé par le participe, tout en conservant la force poétique de l’hébreu.
