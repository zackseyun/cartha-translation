  yaml_path: translation/ot/lamentations/003/004.yaml
  text: He has worn away my flesh and my skin[a]; he has broken my bones.
translation:
  language: fr
  text: Il a fait dépérir ma chair et ma peau[a] ; il a brisé mes os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a usé ma chair et ma peau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלָּה
  choice: a usé
  rationale: Le piel de בלה exprime l’action d’user ou de faire dépérir. « A usé » conserve l’image concrète d’une détérioration physique sans ajouter l’idée plus interprétative de consommation.
- source_word: בְשָׂרִי
  choice: ma chair
  rationale: « Chair » rend directement בשר et préserve le caractère physique et viscéral de l’image.
- source_word: וְעוֹרִי
  choice: et ma peau
  rationale: עור désigne la peau ; la traduction littérale maintient le parallélisme corporel avec « ma chair ».
- source_word: שִׁבַּר
  choice: a brisé
  rationale: שבר signifie couramment briser ou casser. « Brisé » convient au registre poétique et à l’intensité de la plainte sans aller jusqu’à « fracassé ».
- source_word: עַצְמוֹתָי
  choice: mes os
  rationale: Traduction directe qui préserve l’image corporelle et la force poétique de l’hébreu.
theological_decisions: []
