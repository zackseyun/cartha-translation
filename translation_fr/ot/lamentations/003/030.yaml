  text: יִתֵּ֧ן לְ/מַכֵּ֛/הוּ לֶ֖חִי יִשְׂבַּ֥ע בְּ/חֶרְפָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/030.yaml
  text: Let him give his cheek to the one who strikes him[a]; let him be filled with reproach.
translation:
  language: fr
  text: Qu’il présente sa joue à celui qui le frappe ; qu’il soit rassasié d’opprobre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il ait son plein d’humiliation » ou « d’insultes ». L’expression hébraïque signifie littéralement être « rassasié d’opprobre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: Qu’il présente
  rationale: Dans cette suite d’exhortations, l’imparfait hébreu a une valeur jussive. « Présenter sa joue » exprime naturellement en français l’action de la livrer sans effacer l’image concrète du texte.
- source_word: לְמַכֵּהוּ
  choice: à celui qui le frappe
  rationale: La préposition לְ, le participe hiphil de נכה et le suffixe masculin singulier désignent la personne qui le frappe ; cette formulation conserve la valeur participiale dans un français courant.
- source_word: לֶחִי
  choice: sa joue
  rationale: לֶחִי désigne la joue ou la mâchoire. « Joue » convient à l’image de l’affront ou du coup subi, et le possessif implicite est nécessaire en français naturel.
- source_word: יִשְׂבַּע
  choice: qu’il se rassasie
  rationale: Le verbe שבע signifie être rassasié ou avoir son plein. « Se rassasier » conserve volontairement la métaphore forte de l’hébreu.
- source_word: בְּחֶרְפָּה
  choice: d’opprobre
  rationale: חֶרְפָּה peut désigner l’opprobre, la honte, l’humiliation ou l’insulte. « Opprobre » préserve ici la dimension sociale et publique du déshonneur tout en gardant un registre digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les deux propositions gardent la forme exhortative du contexte ainsi que l’image concrète de la joue et la métaphore volontairement rude du rassasiement.
