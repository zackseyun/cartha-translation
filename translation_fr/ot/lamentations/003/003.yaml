  text: Surely against me he turns his hand again and again all day long[a].
translation:
  language: fr
  text: Oui, c’est bien contre moi qu’il se retourne sans cesse ; il tourne sa main contre moi tout au long du jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Oui, contre moi il revient/retourne ; il tourne/retourne sa main tout le jour. » Les deux verbes hébreux successifs peuvent souligner la répétition de l’action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule a ici une valeur emphatique d’assertion plutôt que restrictive. « Oui » introduit naturellement la plainte avec force en français.
- source_word: בִּי
  choice: contre moi
  rationale: Dans ce contexte d’action hostile, la préposition בְּ avec le pronom de première personne exprime naturellement l’orientation adverse.
- source_word: יָשֻׁב יַהֲפֹךְ
  choice: il retourne… encore et encore
  rationale: Les deux verbes successifs, « revenir/retourner » et « tourner/retourner », peuvent exprimer une action répétée. La formulation française conserve le geste de la main et explicite idiomatiquement l’itération.
- source_word: יָדוֹ
  choice: sa main
  rationale: Le nom concret est conservé afin de préserver l’image hébraïque de la main comme moyen d’action ou de puissance.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Cette expression française naturelle rend la durée continue et accablante indiquée par l’hébreu.
