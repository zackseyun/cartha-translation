source:
  edition: WLC
  text: סְחִ֧י וּ/מָא֛וֹס תְּשִׂימֵ֖/נוּ בְּ/קֶ֥רֶב הָ/עַמִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/045.yaml
  text: You have made us scum and refuse in the midst of the peoples[a][b].
translation:
  language: fr
  text: Tu as fait de nous des ordures et des rebuts[a] au milieu des peuples[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des balayures et des objets de mépris » ; les deux noms rares réunis expriment un mépris et un avilissement extrêmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi les nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: סְחִי
  choice: ordures
  rationale: Ce nom rare désigne ce qui est sale, vil ou rejeté, peut-être ce qu’on enlève en raclant ou en balayant. « Ordures » est actuel, concret et exprime fortement l’avilissement.
- source_word: וּמָאוֹס
  choice: et des rebuts
  rationale: Le terme évoque ce qui est rejeté, méprisé ou jugé répugnant. « Rebuts » conserve à la fois l’idée de rejet et celle d’absence de valeur, tout en formant avec « ordures » une paire expressive.
- source_word: תְּשִׂימֵנוּ
  choice: tu as fait de nous
  rationale: Le verbe שׂים signifie littéralement « placer », mais avec ces attributs il a ici le sens de « faire de, rendre ». Le passé composé exprime naturellement en français l’action accomplie dont l’effet demeure.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: Cette expression conserve la dimension spatiale et sociale de la locution hébraïque, tout en restant naturelle dans un registre digne.
- source_word: הָעַמִּים
  choice: des peuples
  rationale: Le pluriel de עַם désigne les différents peuples environnants. « Peuples » est le rendu le plus direct, tandis que « nations » reste possible selon la nuance contextuelle.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation conserve l’image très dure du texte hébreu sans l’atténuer ; « au milieu des peuples » maintient sa structure plus formelle, tandis que les notes signalent les principales possibilités lexicales.
