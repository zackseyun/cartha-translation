source:
  edition: WLC
  text: שָׁמַ֤עְתָּ חֶרְפָּתָ/ם֙ יְהוָ֔ה כָּל מַחְשְׁבֹתָ֖/ם עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/061.yaml
  text: You have heard their reproach[a], O Yahweh, all their schemes against me.
translation:
  language: fr
  text: Tu as entendu leurs insultes, Yahweh, tous leurs projets contre moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes leurs pensées à mon sujet ». Le nom hébreu peut désigner des pensées, des intentions ou des projets ; dans ce contexte, il s’agit probablement de projets hostiles.'
    reason: Alternative lexicale et préservation de l’ambiguïté de מַחְשְׁבֹתָם עָלָי.
lexical_decisions:
- source_word: שָׁמַעְתָּ
  choice: Tu as entendu
  rationale: Le qal accompli, deuxième personne masculine singulière, s’adresse directement à Yahweh. Le passé composé exprime naturellement en français une action accomplie dont la portée demeure actuelle dans la prière.
- source_word: חֶרְפָּתָם
  choice: leurs insultes
  rationale: חֶרְפָּה peut désigner l’opprobre, le mépris ou l’insulte. Le pluriel français « insultes » rend ici de façon naturelle les paroles méprisantes des adversaires, sans réduire le terme à une simple honte subie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui conserve le nom divin plutôt que de lui substituer un titre.
- source_word: כָּל
  choice: tous
  rationale: כָּל englobe ici l’ensemble des projets ou pensées hostiles évoqués.
- source_word: מַחְשְׁבֹתָם
  choice: leurs projets
  rationale: Le nom peut signifier « pensées », « intentions » ou « projets ». Dans ce contexte d’hostilité, « projets » est naturel tout en restant moins interprétatif que « complots ».
- source_word: עָלָי
  choice: contre moi
  rationale: 'Avec des projets hostiles, עַל prend naturellement un sens adversatif : « contre moi ». Le sens plus neutre « à mon sujet » reste possible et est signalé en note.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Degré d’hostilité de מַחְשְׁבֹתָם עָלָי
  choice: tous leurs projets contre moi
  alternative: toutes leurs pensées à mon sujet
  rationale: Le contexte immédiat favorise des intentions hostiles, mais l’expression hébraïque permet aussi une lecture plus neutre. Cette ambiguïté est conservée par une note.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement convient à l’adresse biblique directe à Dieu. « Insultes » et « projets » sont courants et accessibles ; la note évite de faire passer l’interprétation contextuelle pour l’unique sens possible.
