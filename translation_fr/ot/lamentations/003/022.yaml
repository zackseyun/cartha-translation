source:
  edition: WLC
  text: חַֽסְדֵ֤י יְהוָה֙ כִּ֣י לֹא תָ֔מְנוּ כִּ֥י לֹא כָל֖וּ רַחֲמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/022.yaml
  text: Because of Yahweh’s steadfast love we are not consumed[a], for his mercies never come to an end.
translation:
  language: fr
  text: C’est grâce aux bontés de Yahvé que nous ne sommes pas anéantis[a], car ses compassions ne prennent jamais fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plusieurs manuscrits hébreux et les versions anciennes appuient cette autre traduction : « Les bontés de Yahvé ne prennent jamais fin. » Selon cette lecture, « les bontés » est le sujet et le premier verbe est lu différemment.'
    reason: textual_alternative
lexical_decisions:
- source_word: חַסְדֵי יְהוָה
  choice: les bontés de Yahvé
  rationale: Le pluriel peut désigner les manifestations répétées de l’amour fidèle de Yahvé. « Les bontés » est naturel en français poétique et garde cette pluralité concrète.
- source_word: כִּי לֹא תָמְנוּ
  choice: C’est grâce… que nous ne sommes pas anéantis
  rationale: Dans le texte massorétique vocalisé, תָמְנוּ est à la première personne du pluriel. La formulation française exprime naturellement le lien causal sans effacer ce « nous ».
- source_word: כִּי לֹא כָלוּ
  choice: car… ne prennent jamais fin
  rationale: Le second כִּי donne la raison de la proposition précédente, et le verbe nié affirme que les compassions de Yahvé ne s’épuisent pas.
- source_word: רַחֲמָיו
  choice: ses compassions
  rationale: Le pluriel hébreu évoque une compassion abondante et renouvelée. Le pluriel français conserve cette nuance et le parallélisme poétique.
theological_decisions:
- issue: Sujet et syntaxe de la première proposition
  choice: C’est grâce aux bontés de Yahvé que nous ne sommes pas anéantis.
  alternative: Les bontés de Yahvé ne prennent jamais fin.
  rationale: La forme massorétique pointée תָמְנוּ est à la première personne du pluriel et commande donc la traduction principale. Plusieurs manuscrits hébreux et les versions anciennes témoignent toutefois d’une autre lecture, où les bontés de Yahvé sont le sujet; cette variante importante est conservée en note.
translation_notes:
  register: Français international moderne, digne et poétique. « Yahvé » représente explicitement le nom divin; « anéantis » rend la gravité du verbe tout en restant intelligible. Le verset conserve la structure causale et le parallélisme de l’hébreu.
