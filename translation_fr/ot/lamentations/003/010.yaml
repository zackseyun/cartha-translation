  yaml_path: translation/ot/lamentations/003/010.yaml
  text: He is a bear lying in wait for me[a], a lion in hiding places.
translation:
  language: fr
  text: Il est un ours aux aguets contre moi, un lion dans des cachettes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּב
  choice: un ours
  rationale: Le nom désigne clairement l’ours; l’article indéfini convient à cette comparaison prédicative en français.
- source_word: אֹרֵב
  choice: à l’affût
  rationale: Le participe de ארב exprime l’action de guetter en vue d’une attaque; « à l’affût » rend naturellement cette menace délibérée.
- source_word: הוּא
  choice: Il est
  rationale: Le pronom indépendant est explicite et sert de sujet; le présent « est » est nécessaire en français.
- source_word: לִי
  choice: pour moi
  rationale: La préposition indique que le locuteur est la cible de l’animal embusqué; « pour moi » conserve la formulation hébraïque tout en restant idiomatique avec « à l’affût ».
- source_word: אַרְיֵה
  choice: un lion
  rationale: Le nom désigne un lion; l’article indéfini maintient le parallélisme avec « un ours ».
- source_word: בְּמִסְתָּרִים
  choice: caché dans les lieux secrets
  rationale: Le pluriel désigne des endroits dissimulés. L’ajout de « caché », implicite dans l’expression, produit une formulation française naturelle et conserve l’image de l’embuscade.
theological_decisions:
- issue: Référent du pronom « il »
  choice: Maintenir « Il » sans identifier explicitement le référent dans ce verset.
  alternative: Remplacer le pronom par « Dieu » ou « le Seigneur ».
  rationale: L’hébreu emploie le pronom הוּא; expliciter son référent ici résoudrait une relation contextuelle que le verset laisse sous forme pronominale.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme des deux prédateurs est conservé, avec une formulation concise adaptée à la poésie des Lamentations.
