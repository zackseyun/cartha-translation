  text: the lips of those who rise against me[b][a], and their muttering against me all day long.
translation:
  language: fr
  text: les lèvres[a] de ceux qui se dressent contre moi, et ce qu’ils murmurent[b] contre moi tout au long du jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les paroles de ceux qui se dressent contre moi ». En hébreu, les « lèvres » désignent concrètement la parole.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur méditation » ou « ce qu’ils chuchotent ». Le terme hébreu peut désigner une réflexion intérieure ou une parole à voix basse ; le contexte hostile favorise ici l’idée de murmure.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: les lèvres de
  rationale: Rend concrètement le pluriel construit « lèvres de », métonymie hébraïque de la parole, tout en conservant l’image du texte source.
- source_word: קָמַי
  choice: ceux qui se dressent contre moi
  rationale: Reflète le participe substantivé de קום avec suffixe de première personne, dans son sens hostile contextuel, sans le réduire au nom plus général « adversaires ».
- source_word: הֶגְיוֹנָם
  choice: ce qu’ils murmurent
  rationale: Le nom peut désigner une réflexion intérieure ou une parole à voix basse. Dans ce contexte hostile, « ce qu’ils murmurent » est naturel en français et n’ajoute pas l’idée plus précise de complot.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans le contexte de paroles hostiles, la préposition signifie idiomatiquement « contre moi » plutôt que le sens spatial littéral « sur moi ».
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Expression française naturelle qui conserve l’idée d’une durée continue pendant toute la journée.
