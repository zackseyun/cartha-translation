id: LAM.3.59
reference: Lamentations 3:59
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָאִ֤יתָה יְהוָה֙ עַוָּ֣תָתִ֔/י שָׁפְטָ֖/ה מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/059.yaml
  text: You have seen[a], O Yahweh, the wrong done to me[b]; judge my case.
translation:
  language: fr
  text: Tu as vu, Yahweh, le tort qu’on m’a fait[a] ; juge ma cause[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’injustice commise contre moi » ; le nom hébreu peut désigner un tort, une déformation du droit ou une injustice.
    reason: lexical_alternative
  - marker: b
    text: Ou « rends-moi justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: Tu as vu
  rationale: Le qal accompli, deuxième personne masculine singulière, s’adresse directement à Yahweh. Le passé composé exprime naturellement en français une constatation passée qui fonde l’appel présent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: עַוָּתָתִי
  choice: le tort qu’on m’a fait
  rationale: Dans ce contexte judiciaire, le nom désigne le tort ou l’injustice subis par le locuteur, non une faute qu’il aurait commise. Cette formulation est naturelle et conserve le caractère subi du tort.
- source_word: שָׁפְטָה
  choice: juge
  rationale: L’impératif demande à Dieu d’exercer son jugement. « Juge » maintient explicitement la métaphore judiciaire sans anticiper l’issue favorable.
- source_word: מִשְׁפָּטִי
  choice: ma cause
  rationale: Le nom peut désigner le jugement, le droit ou l’affaire portée en justice. « Ma cause » convient ici à l’appel judiciaire et reste idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin ; sa translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de עַוָּתָתִי
  choice: le tort qu’on m’a fait
  alternative: mon tort
  rationale: Le parallélisme avec la demande de juger la cause du locuteur indique une injustice subie. « Mon tort » pourrait, en français, suggérer à tort sa propre culpabilité.
- issue: Portée de שָׁפְטָה מִשְׁפָּטִי
  choice: juge ma cause
  alternative: rends-moi justice
  rationale: Le rendu retenu conserve la formulation judiciaire et l’ambiguïté quant à l’issue du jugement ; l’alternative explicite davantage l’attente d’une décision favorable.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe au singulier. L’interpellation « Yahweh » est conservée sans « ô », devenu marqué ou archaïsant dans l’usage courant.
