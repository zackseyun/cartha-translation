  text: עֵינִ/י֙ עֽוֹלְלָ֣ה לְ/נַפְשִׁ֔/י מִ/כֹּ֖ל בְּנ֥וֹת עִירִֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/051.yaml
  text: My eye causes grief to my soul because of all the daughters of my city.
translation:
  language: fr
  text: Ce que je vois accable mon âme à cause de toutes les filles de ma ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינִי
  choice: Ce que je vois
  rationale: Littéralement « mon œil » ; en français actuel, la tournure métonymique « ce que je vois » exprime naturellement la perception visuelle à l’origine de la souffrance.
- source_word: עוֹלְלָה
  choice: accable
  rationale: Le verbe rare עלל, ici avec עֵינִי comme sujet, indique que la vue inflige du mal ou de la peine ; « accable » conserve la force causative et affective sans préciser davantage la nature du mal.
- source_word: לְנַפְשִׁי
  choice: mon âme
  rationale: Conserve le terme anthropologique נֶפֶשׁ et la profondeur intérieure de la plainte, dans une formulation française intelligible.
- source_word: מִכֹּל בְּנוֹת עִירִי
  choice: à cause de toutes les filles de ma ville
  rationale: מִן est compris causalement dans le contexte. « Filles de ma ville » garde l’expression hébraïque, probablement relative aux femmes de Jérusalem, sans en réduire explicitement la portée.
theological_decisions:
- issue: Référent des « filles de ma ville »
  choice: Maintenir « toutes les filles de ma ville »
  alternative: « toutes les femmes de ma ville » ou « toutes les villes filles de ma cité »
  rationale: Le texte permet une compréhension directe des femmes de la ville, tandis que d’autres analyses proposent des localités dépendantes. La traduction conserve l’image et son ambiguïté plutôt que de trancher.
translation_notes:
  register: Français moderne, sobre et poétique. La personnification littérale de « mon œil » est rendue par la métonymie naturelle « ce que je vois », tout en maintenant le rapport causatif avec la souffrance intérieure.
