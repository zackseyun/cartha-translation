  text: חֲדָשִׁים֙ לַ/בְּקָרִ֔ים רַבָּ֖ה אֱמוּנָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/023.yaml
  text: They are new every morning[a]; great is your faithfulness.
translation:
  language: fr
  text: Chaque matin, elles sont nouvelles[a] ; grande est ta fidélité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est nouveau chaque matin », si le sujet implicite est compris collectivement à partir de la ligne précédente.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲדָשִׁים
  choice: se renouvellent
  rationale: L’adjectif pluriel signifie littéralement « nouvelles ». En français, avec pour sujet implicite les marques de compassion du verset précédent, « se renouvellent » exprime naturellement qu’elles sont nouvelles de nouveau chaque matin, sans suggérer qu’elles viennent seulement d’apparaître.
- source_word: לַבְּקָרִים
  choice: chaque matin
  rationale: 'La construction temporelle au pluriel exprime la répétition : « le matin après le matin », d’où l’idiome français « chaque matin ».'
- source_word: רַבָּה
  choice: grande
  rationale: L’adjectif prédicatif signifie « grande » ou « abondante ». « Grande » convient naturellement à « fidélité » et conserve la formulation emphatique de l’hébreu.
- source_word: אֱמוּנָתֶךָ
  choice: ta fidélité
  rationale: אֱמוּנָה désigne ici la fermeté, la fiabilité et la constance de Dieu. « Fidélité » rend cette qualité sans la réduire à une croyance subjective.
theological_decisions:
- issue: Sujet implicite repris du verset précédent
  choice: Elles se renouvellent chaque matin
  alternative: Elle se renouvelle chaque matin
  rationale: Le verset hébreu commence par un adjectif pluriel sans sujet exprimé. Le pluriel renvoie le plus naturellement aux marques de compassion mentionnées en 3.22. La note conserve la possibilité d’une compréhension collective au singulier.
translation_notes:
  register: Français international moderne, naturel et digne. L’inversion « grande est ta fidélité » préserve l’accent poétique et solennel de la proposition hébraïque, tandis que « se renouvellent » évite en français une tournure abrupte avec le sujet pronominal implicite.
