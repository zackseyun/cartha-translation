  text: עַד יַשְׁקִ֣יף וְ/יֵ֔רֶא יְהוָ֖ה מִ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/050.yaml
  text: until Yahweh looks down and sees from heaven[a].
translation:
  language: fr
  text: jusqu’à ce que Yahweh regarde du haut du ciel et voie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « regarde d’en haut et voit depuis le ciel ». Les deux verbes soulignent l’observation attentive de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Marque le terme de la situation qui se prolonge depuis le verset précédent et appelle ici naturellement le subjonctif en français.
- source_word: יַשְׁקִיף
  choice: regarde d’en haut
  rationale: Le hifil de שׁקף exprime le regard porté depuis un lieu élevé; cette formulation conserve l’image verticale sans anticiper le complément «depuis le ciel».
- source_word: וְיֵרֶא
  choice: et voie
  rationale: Le qal de ראה signifie couramment «voir». Un verbe distinct préserve la paire poétique hébraïque et son effet d’insistance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: מִשָּׁמָיִם
  choice: depuis le ciel
  rationale: Bien que שָׁמַיִם ait une forme plurielle, le singulier «le ciel» est ici l’expression française idiomatique pour la demeure céleste d’où Yahweh observe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; «Yahweh» préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de la paire verbale יַשְׁקִיף וְיֵרֶא
  choice: regarde d’en haut et voie
  alternative: se penche pour voir
  rationale: Le choix retient les deux verbes du texte et laisse leur relation poétique ouverte, plutôt que de les fondre en une seule action interprétée.
translation_notes:
  register: Français international moderne, sobre et poétique. Le verset demeure syntaxiquement lié au précédent par «jusqu’à ce que». Le subjonctif «voie» est requis après cette locution.
