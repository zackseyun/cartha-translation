  text: עֵינִ֧/י נִגְּרָ֛ה וְ/לֹ֥א תִדְמֶ֖ה מֵ/אֵ֥ין הֲפֻגֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/049.yaml
  text: My eye runs down and does not cease[a], without interruption,
translation:
  language: fr
  text: Mon œil coule sans s’arrêter[a], sans aucun répit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon œil coule et ne reste pas immobile, sans aucune pause ». Le verbe hébreu traduit par « s’arrêter » peut aussi signifier « rester immobile », et le dernier nom peut désigner une « pause », un « répit » ou un « soulagement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  choice: Mon œil
  rationale: Le singulier hébreu avec suffixe de première personne est conservé; dans ce langage poétique, l’œil représente l’organe d’où coulent les larmes.
- source_word: נִגְּרָה
  choice: se répand
  rationale: Le verbe décrit ce qui coule ou se déverse. « Se répand » conserve l’image concrète sans ajouter explicitement les larmes, absentes du texte hébreu.
- source_word: וְלֹא תִדְמֶה
  choice: sans s’arrêter
  rationale: דמה peut signifier cesser ou rester immobile. Dans le contexte des pleurs continus, « sans s’arrêter » rend naturellement la négation et le sens contextuel.
- source_word: מֵאֵין הֲפֻגוֹת
  choice: sans aucun répit
  rationale: L’expression indique l’absence de pause, de relâche ou de soulagement; « aucun répit » restitue clairement cette continuité.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le singulier « mon œil » et l’image implicite des larmes sont maintenus; la formulation demeure naturelle tout en préservant l’ambiguïté lexicale du verbe דמה.
