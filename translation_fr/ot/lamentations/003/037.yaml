  text: מִ֣י זֶ֤ה אָמַר֙ וַ/תֶּ֔הִי אֲדֹנָ֖/י לֹ֥א צִוָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/037.yaml
  text: Who is this who speaks and it happens[b][a], unless the Lord has commanded it?
translation:
  language: fr
  text: Qui donc parle, et cela arrive[a], sans que le Seigneur l’ait ordonné[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a parlé, et cela est arrivé » ; l’hébreu emploie des formes passées dans une affirmation rhétorique de portée générale.'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « commandé » ; on peut aussi comprendre : « décrété ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי זֶה
  choice: Qui donc
  rationale: L’interrogatif renforcé par le démonstratif forme une question rhétorique appuyée. « Qui donc » en restitue naturellement la force en français.
- source_word: אָמַר
  choice: parle
  rationale: Bien que l’hébreu emploie une forme passée, le présent exprime ici naturellement une vérité générale dans la question rhétorique.
- source_word: וַתֶּהִי
  choice: et la chose arrive
  rationale: Le verbe היה indique qu’une chose ou un événement implicite se produit. Cette formulation reste claire et actuelle sans préciser indûment la nature de l’événement.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: אֲדֹנָי est ici le titre divin « Seigneur ».
- source_word: לֹא צִוָּה
  choice: sans que ... l’ait ordonnée
  rationale: צוה signifie littéralement « commander », mais, appliqué à la réalisation d’un événement, « ordonner » est idiomatique en français et conserve l’idée d’une directive souveraine sans recourir au terme théologique plus marqué « décréter ».
theological_decisions:
- issue: Portée de la souveraineté divine exprimée par צוה
  choice: ordonnée
  alternative: commandée ; décrétée
  rationale: « Ordonnée » rend naturellement la directive divine concernant un événement. « Commandée » est plus littéral mais moins idiomatique ici, tandis que « décrétée » pourrait introduire une formulation théologique plus technique que le mot hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée, ainsi que la tension entre le sens lexical de « commander » et son application à l’avènement d’un événement.
