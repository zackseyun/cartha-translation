  text: בְּ/מַחֲשַׁכִּ֥ים הוֹשִׁיבַ֖/נִי כְּ/מֵתֵ֥י עוֹלָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/006.yaml
  text: He has made me dwell in darkness like those long dead[a].
translation:
  language: fr
  text: Il m’a fait habiter dans les ténèbres, comme ceux qui sont morts depuis longtemps[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il m’a fait asseoir dans des lieux obscurs, comme les morts d’autrefois. »
    reason: Alternative lexicale conservant plus littéralement le causatif de « s’asseoir » et la valeur possible de עוֹלָם comme passé lointain.
lexical_decisions:
- source_word: בְּמַחֲשַׁכִּים
  choice: dans les ténèbres
  rationale: Le pluriel hébreu désigne ici un lieu ou un domaine obscur. « Dans les ténèbres » est naturel en français et conserve l’image d’un enfermement dans l’obscurité.
- source_word: הוֹשִׁיבַנִי
  choice: Il m’a fait habiter
  rationale: 'Le hiphil de ישׁב avec suffixe de première personne exprime une action causative : faire asseoir, demeurer ou habiter. Dans ce contexte de confinement imposé, « m’a fait habiter » rend naturellement cette nuance.'
- source_word: כְּמֵתֵי
  choice: comme ceux qui sont morts
  rationale: La préposition comparative כְּ et le pluriel construit de « mort » introduisent une comparaison avec les morts. La formulation française évite l’ambiguïté possible de « comme les morts depuis longtemps », qui pourrait sembler qualifier leur manière d’être morts.
- source_word: עוֹלָם
  choice: depuis longtemps
  rationale: עוֹלָם peut évoquer une durée indéfinie ou un passé lointain. Avec « les morts », le sens le plus probable est celui de personnes mortes depuis fort longtemps, sans imposer l’idée métaphysique d’éternité.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation conserve le parallélisme imagé et la tension entre habitation forcée et mise en position assise; l’alternative plus littérale figure en note.
