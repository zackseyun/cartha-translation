  text: לְ/הַטּוֹת֙ מִשְׁפַּט גָּ֔בֶר נֶ֖גֶד פְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/035.yaml
  text: to deny a man justice before the face of the Most High—
translation:
  language: fr
  text: quand on prive quelqu’un de justice devant le Très-Haut,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת מִשְׁפַּט גָּבֶר
  choice: quand on prive quelqu’un de justice
  rationale: Littéralement, « faire dévier le droit d’un homme ». En contexte judiciaire, l’expression signifie fausser son jugement ou lui refuser la justice. « Priver quelqu’un de justice » restitue naturellement cette idée en français moderne sans ajouter un agent précis.
- source_word: נֶגֶד פְּנֵי עֶלְיוֹן
  choice: devant le Très-Haut
  rationale: נֶגֶד פְּנֵי exprime la présence ou le regard de quelqu’un, et עֶלְיוֹן est ici le titre divin « le Très-Haut ». La formulation française conserve le registre solennel et l’idée que l’acte se déroule sous son regard.
theological_decisions:
- issue: Portée du titre divin עֶלְיוֹן
  choice: le Très-Haut
  alternative: le Dieu Très-Haut
  rationale: Le texte hébreu emploie le titre substantivé sans ajouter « Dieu » ; la traduction retenue préserve cette concision et cette désignation divine traditionnelle.
- issue: Nature de l’injustice décrite
  choice: priver quelqu’un de justice
  alternative: faire dévier le droit d’un homme
  rationale: Le vers évoque une atteinte judiciaire sans préciser exactement son mécanisme. La formulation retenue communique cette portée tout en évitant de déterminer davantage la forme du déni de justice.
translation_notes:
  register: Fragment syntaxiquement lié aux versets voisins. Français moderne, digne et accessible ; « quelqu’un » rend גָּבֶר de façon inclusive et naturelle dans cette maxime générale. La virgule signale la poursuite de la phrase.
