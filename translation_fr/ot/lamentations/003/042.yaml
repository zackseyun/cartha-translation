  text: נַ֤חְנוּ פָשַׁ֨עְנוּ֙ וּ/מָרִ֔ינוּ אַתָּ֖ה לֹ֥א סָלָֽחְתָּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/042.yaml
  text: We have transgressed and rebelled[a]; you have not forgiven.
translation:
  language: fr
  text: Nous avons transgressé et nous nous sommes rebellés ; toi, tu n’as pas pardonné[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu n’as pas accordé ton pardon ». Le verbe hébreu est un terme courant du pardon divin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: Nous, nous
  rationale: Le pronom indépendant, distinct de la marque personnelle portée par les verbes, souligne le sujet. La dislocation naturelle « Nous, nous » conserve cette insistance et prépare le contraste avec « toi ».
- source_word: פָשַׁעְנוּ
  choice: avons commis des transgressions
  rationale: Le verbe פשע exprime la transgression, avec une possible nuance de révolte contre l’autorité. Cette formulation maintient le vocabulaire moral tout en laissant au verbe suivant l’idée plus explicite de rébellion.
- source_word: וּמָרִינוּ
  choice: et nous nous sommes rebellés
  rationale: מרה signifie se rebeller ou se montrer rebelle. Le rendu verbal préserve le parallélisme et l’intensification par rapport à פשע.
- source_word: אַתָּה
  choice: toi, tu
  rationale: Le pronom indépendant explicite met Dieu en relief et marque le contraste avec נחנו. La dislocation « toi, tu » rend cette emphase dans un français naturel.
- source_word: לֹא
  choice: n’… pas
  rationale: La négation simple porte directement sur le verbe « pardonner ».
- source_word: סָלָחְתָּ
  choice: as pardonné
  rationale: סלח est le terme courant du pardon, notamment du pardon accordé par Dieu. Le passé composé convient à l’action passée envisagée dans sa portée présente au sein de la lamentation.
theological_decisions:
- issue: L’absence de pardon divin dans la lamentation
  choice: toi, tu n’as pas pardonné
  alternative: toi, tu n’as pas accordé ton pardon
  rationale: La traduction garde l’affirmation directe adressée à Dieu, sans l’atténuer ni chercher à résoudre la tension théologique du passage.
translation_notes:
  register: Français moderne, digne et accessible. Les dislocations « Nous, nous » et « toi, tu » reproduisent l’opposition emphatique des pronoms hébreux sans raideur excessive. Le point-virgule met nettement en relief le contraste entre la faute humaine et la réponse divine.
