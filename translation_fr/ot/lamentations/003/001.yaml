source:
  edition: WLC
  text: אֲנִ֤י הַ/גֶּ֨בֶר֙ רָאָ֣ה עֳנִ֔י בְּ/שֵׁ֖בֶט עֶבְרָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/001.yaml
  text: I am the man who has seen affliction under the rod of his wrath[a][b].
translation:
  language: fr
  text: Je suis l’homme qui a vu la détresse sous le bâton de sa fureur[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le bâton de sa fureur ». La préposition hébraïque peut se traduire de plusieurs manières.
    reason: lexical_alternative
  - marker: b
    text: « Détresse » peut aussi se traduire par « affliction », « misère » ou « souffrance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי הַגֶּבֶר
  choice: Je suis l’homme
  rationale: La proposition nominale hébraïque s’ouvre sur le pronom indépendant emphatique אֲנִי. « Je suis l’homme » restitue naturellement en français cette identification appuyée et conserve l’article défini de הַגֶּבֶר.
- source_word: רָאָה
  choice: qui a vu
  rationale: Le passé composé convient à l’autoportrait présent du locuteur, façonné par une souffrance passée. « Voir » garde le sens concret du verbe hébreu sans expliciter d’emblée « subir » ou « connaître par expérience ».
- source_word: עֳנִי
  choice: la détresse
  rationale: Le nom désigne ici l’affliction, la misère ou la souffrance. « Détresse » est courant, digne et assez large pour ne pas réduire le terme à la pauvreté matérielle.
- source_word: בְּשֵׁבֶט
  choice: sous le bâton
  rationale: שֵׁבֶט désigne un bâton, une verge ou un sceptre. Dans ce contexte de châtiment, « bâton » conserve l’image concrète; « sous » exprime naturellement l’assujettissement tout en laissant en note les autres valeurs possibles de la préposition בְּ.
- source_word: עֶבְרָתוֹ
  choice: sa fureur
  rationale: עֶבְרָה exprime une colère intense. « Fureur » conserve cette force en français moderne et solennel, tandis que le possessif masculin singulier reste non explicité quant à son référent.
theological_decisions:
- issue: Référent du possessif dans « sa fureur »
  choice: Conserver le possessif « sa » sans ajouter « Dieu » ni « le Seigneur ».
  alternative: « la fureur du Seigneur » ou « la fureur de Dieu »
  rationale: L’hébreu ne porte qu’un suffixe masculin singulier. Le contexte permet d’identifier le référent divin, mais le nommer dans le corps du verset lèverait une implicitation que le texte source maintient.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’ouverture emphatique, l’image du bâton, l’ambiguïté de la préposition et le référent implicite du possessif.
