source:
  edition: WLC
  text: ט֤וֹב יְהוָה֙ לְ/קוָֹ֔/ו לְ/נֶ֖פֶשׁ תִּדְרְשֶֽׁ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/025.yaml
  text: Yahweh is good to those who wait for him[a], to the soul that seeks him.
translation:
  language: fr
  text: Yahweh est bon pour ceux qui l’attendent[a], pour l’âme qui le cherche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui espèrent en lui » ; le verbe hébreu évoque une attente pleine d’espérance.
    reason: alternative lexicale
lexical_decisions:
- source_word: טוֹב
  choice: bon
  rationale: L’adjectif qualifie Yahweh dans sa relation avec ceux qui se tournent vers lui. « Bon » est direct, naturel et conserve une portée plus large que « bienveillant ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de représenter le tétragramme présent dans le texte hébreu.
- source_word: לְקֹוָו
  choice: pour ceux qui l’attendent
  rationale: Le verbe קוה exprime une attente confiante et porteuse d’espérance. « L’attendent » convient au contexte de l’épreuve et préserve l’idée d’un délai vécu dans l’expectative; la nuance d’espérance est signalée en note.
- source_word: לְנֶפֶשׁ
  choice: pour l’âme
  rationale: נפש peut désigner l’âme, la personne ou l’être. « L’âme » conserve ici l’image et le registre poétique hébreux sans imposer une anthropologie technique.
- source_word: תִּדְרְשֶׁנּוּ
  choice: qui le cherche
  rationale: Lorsque Dieu en est l’objet, דרש désigne couramment une recherche relationnelle ou spirituelle. Le féminin singulier du verbe s’accorde avec נפש.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le verset emploie directement le tétragramme; « Yahweh » en préserve la fonction de nom propre au lieu de lui substituer un titre.
- issue: Nuance du verbe קוה
  choice: ceux qui l’attendent
  alternative: ceux qui espèrent en lui
  rationale: Le verbe associe attente et espérance. Le texte principal met en avant l’attente patiente adaptée au contexte des Lamentations, tandis que la note conserve explicitement l’autre nuance.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme hébreu est conservé, ainsi que « l’âme », expression intelligible mais plus élevée que « la personne ».
