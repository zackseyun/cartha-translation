  text: קוֹלִ֖/י שָׁמָ֑עְתָּ אַל תַּעְלֵ֧ם אָזְנְ/ךָ֛ לְ/רַוְחָתִ֖/י לְ/שַׁוְעָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/056.yaml
  text: 'You heard my voice: do not hide your ear from my plea for relief[a], from my cry for help.'
translation:
  language: fr
  text: 'Tu as entendu ma voix : ne ferme pas ton oreille à mon soupir[a], à mon cri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à mon répit » ou « à mon souffle ». Le mot hébreu peut évoquer le soulagement, le répit ou l’espace pour respirer; la construction des deux groupes qui suivent « ton oreille » est difficile.
    reason: Préserver l’ambiguïté lexicale et syntaxique de לְרַוְחָתִי, sans imposer l’interprétation « appel au secours ».
lexical_decisions:
- source_word: קוֹלִי
  choice: ma voix
  rationale: קוֹל désigne couramment la voix ou le son. Dans cette prière personnelle, « ma voix » est l’équivalent français le plus naturel.
- source_word: שָׁמָעְתָּ
  choice: tu as entendu
  rationale: Le qatal qal à la 2e personne masculine singulière rappelle ici que Dieu a entendu le locuteur; le passé composé convient au français contemporain.
- source_word: אַל תַּעְלֵם
  choice: ne ferme pas
  rationale: Le verbe signifie littéralement cacher ou dérober. Avec « oreille », le français idiomatique emploie « fermer son oreille »; cette formulation conserve l’image corporelle sans produire une expression obscure.
- source_word: אָזְנְךָ
  choice: ton oreille
  rationale: Le singulier concret de l’hébreu est conservé et reste naturel dans l’expression française « fermer son oreille à ».
- source_word: לְרַוְחָתִי
  choice: à mon appel au secours
  rationale: רַוְחָה évoque le soulagement ou le répit. Dans cette construction difficile et en parallèle avec שַׁוְעָה, l’expression est comprise comme un appel visant à obtenir du soulagement.
- source_word: לְשַׁוְעָתִי
  choice: à mon cri
  rationale: שַׁוְעָה désigne un cri pressant, notamment un appel à l’aide. « Mon cri » évite de répéter « au secours » tout en gardant le parallélisme et l’urgence.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le tutoiement correspond à l’adresse directe à Dieu. La métaphore de l’oreille est maintenue sous une forme idiomatique; les deux derniers groupes sont rendus comme les compléments de « fermer son oreille à ».
