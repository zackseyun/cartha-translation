id: LAM.3.24
reference: Lamentations 3:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֶלְקִ֤/י יְהוָה֙ אָמְרָ֣ה נַפְשִׁ֔/י עַל כֵּ֖ן אוֹחִ֥יל לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/024.yaml
  text: “Yahweh is my portion,” says my soul[b][a]; “therefore I will hope in him.”
translation:
  language: fr
  text: « Yahweh est ma part[a], dit mon âme ; c’est pourquoi j’espérerai en lui[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon héritage ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je l’attendrai avec espérance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקִי
  choice: ma part
  rationale: חֵלֶק désigne une part attribuée, un lot ou un héritage. « Ma part » conserve la concision et la force poétique de l’hébreu sans limiter le sens à un héritage juridique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de remplacement.
- source_word: אָמְרָה
  choice: dit
  rationale: Bien que la forme hébraïque soit un accompli, elle introduit ici une confession directe à valeur actuelle. Le présent français est naturel dans ce cadre.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ désigne ici le moi intérieur du locuteur. « Mon âme » préserve le langage poétique sans imposer une anthropologie technique.
- source_word: עַל־כֵּן
  choice: c’est pourquoi
  rationale: Cette locution exprime la conséquence tirée de la confession précédente ; « c’est pourquoi » rend clairement ce lien logique.
- source_word: אוֹחִיל
  choice: j’espérerai
  rationale: Le hiphil de יחל peut exprimer une attente confiante ou l’espérance. Le futur « j’espérerai » respecte la forme prospective tout en restant idiomatique.
- source_word: לוֹ
  choice: en lui
  rationale: Avec יחל, « espérer en lui » exprime naturellement en français une confiance dirigée vers Yahweh.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme יְהוָה. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de חֶלְקִי
  choice: ma part
  alternative: mon héritage
  rationale: Le contexte permet une résonance d’héritage et d’appartenance, mais le terme ne doit pas être réduit à son seul sens juridique. « Ma part » maintient cette amplitude.
translation_notes:
  register: Français international actuel, poétique et digne. La syntaxe reste proche du parallélisme hébreu, tandis que « c’est pourquoi » et « espérer en lui » assurent une expression française naturelle.
