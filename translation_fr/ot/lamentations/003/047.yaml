  text: Terror and pitfall have come upon us, devastation and destruction.
translation:
  language: fr
  text: La terreur et la fosse sont venues sur nous, la dévastation et la ruine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחַד
  choice: terreur
  rationale: Rend la peur intense ou l’effroi menaçant exprimé par le nom hébreu.
- source_word: פַחַת
  choice: piège
  rationale: Le terme désigne littéralement une fosse servant de piège; « piège » conserve ici l’image et l’effet, tout en reproduisant l’assonance avec פַּחַד autant que le français le permet.
- source_word: הַשֵּׁאת
  choice: dévastation
  rationale: Dans ce contexte de catastrophe, le terme évoque le ravage ou la désolation; « dévastation » est naturel et garde cette portée.
- source_word: הַשָּׁבֶר
  choice: ruine
  rationale: Le nom signifie brisure, effondrement ou désastre; « ruine » convient au parallélisme sans surinterpréter le mode de destruction.
