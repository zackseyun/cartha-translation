id: LAM.3.44
reference: Lamentations 3:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: סַכּ֤וֹתָה בֶֽ/עָנָן֙ לָ֔/ךְ מֵ/עֲב֖וֹר תְּפִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/044.yaml
  text: You have covered yourself with a cloud so that prayer cannot pass through[a].
translation:
  language: fr
  text: Tu t’es enveloppé d’un nuage, afin que la prière ne puisse pas passer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Tu t’es enveloppé d’un nuage, empêchant la prière de passer. »'
    reason: Alternative plus formelle pour la construction מֵעֲבוֹר, qui exprime l’empêchement.
lexical_decisions:
- source_word: סַכּוֹתָה
  choice: tu t’es enveloppé
  rationale: Le qal accompli à la 2e personne masculine singulière, complété par לָךְ, prend ici un sens réfléchi. « Tu t’es enveloppé » rend naturellement l’image sans l’atténuer.
- source_word: בֶעָנָן
  choice: d’un nuage
  rationale: La préposition ב peut indiquer ici le moyen ou le milieu enveloppant. Le singulier de עָנָן est conservé.
- source_word: לָךְ
  choice: te / t’
  rationale: Formellement « pour toi », ce complément renforce ici le sens réfléchi du verbe; il est intégré en français dans « tu t’es enveloppé ».
- source_word: מֵעֲבוֹר
  choice: afin que … ne puisse pas passer
  rationale: מִן suivi de l’infinitif construit exprime l’empêchement ou l’exclusion. La proposition finale rend cette relation clairement et naturellement en français.
- source_word: תְּפִלָּה
  choice: la prière
  rationale: Le singulier a une portée générique. En français, « la prière » exprime naturellement cette valeur sans individualiser une prière particulière.
theological_decisions:
- issue: Image anthropomorphique de Dieu faisant obstacle à la prière
  choice: Conserver l’adresse directe et l’image de Dieu s’enveloppant d’un nuage qui empêche la prière de passer.
  alternative: Atténuer l’image par « tu t’es caché dans un nuage » ou présenter l’obstacle comme impersonnel.
  rationale: L’hébreu s’adresse directement à Dieu et maintient la tension propre à la lamentation entre la prière humaine et le jugement ou le retrait divin. La traduction ne résout ni n’adoucit cette tension.
translation_notes:
  register: Français international moderne, digne et direct. « S’envelopper d’un nuage » conserve l’image concrète de l’hébreu; « afin que » explicite naturellement la relation d’empêchement sans modifier le sens.
