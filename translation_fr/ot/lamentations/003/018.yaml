source:
  edition: WLC
  text: וָ/אֹמַר֙ אָבַ֣ד נִצְחִ֔/י וְ/תוֹחַלְתִּ֖/י מֵ/יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/018.yaml
  text: So I said[a], “My endurance has perished[b], and my hope from Yahweh.”
translation:
  language: fr
  text: 'Alors j’ai dit : « Mon endurance a disparu[a], ainsi que mon espérance venant de Yahweh[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma splendeur a disparu », si נִצְחִי désigne ici l’éclat ou la gloire plutôt que l’endurance.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « mon espérance de Yahweh ». Cette expression elliptique peut désigner l’espérance qui vient de Yahweh ou celle qui est placée en Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors j’ai dit
  rationale: Le waw suivi de la forme narrative introduit ici la conclusion du locuteur dans la progression du récit. « Alors j’ai dit » est naturel en français et conserve cet enchaînement.
- source_word: אָבַד
  choice: a disparu
  rationale: Le verbe אָבַד exprime la perte, la disparition ou l’anéantissement. « A disparu » rend fortement la perte complète tout en convenant au registre de la lamentation.
- source_word: נִצְחִי
  choice: mon endurance
  rationale: נֵצַח peut désigner ce qui dure, la capacité de tenir, mais aussi, dans certains contextes, l’éclat ou la splendeur. Ici, le parallèle avec la perte de l’espérance favorise « mon endurance », c’est-à-dire la capacité de continuer.
- source_word: וְתוֹחַלְתִּי
  choice: ainsi que mon espérance
  rationale: תּוֹחֶלֶת désigne l’espérance ou l’attente. « Espérance » convient au contexte de lamentation, et « ainsi que » fait naturellement porter le verbe « a disparu » sur les deux éléments coordonnés.
- source_word: מֵיְהוָה
  choice: venant de Yahweh
  rationale: La préposition מִן signifie normalement « de » ou « venant de ». Cette formulation rend la lecture de source sans masquer que l’expression hébraïque, très condensée, peut aussi évoquer une espérance placée en Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Sens de נִצְחִי dans ce contexte
  choice: mon endurance
  alternative: ma splendeur ; ma force
  rationale: Le contexte décrit l’effondrement intérieur du locuteur et la perte de son espérance. « Mon endurance » exprime sa capacité de tenir sans réduire le terme à la seule force physique; l’autre sens lexical réel est signalé en note.
- issue: Rapport entre l’espérance et Yahweh dans מֵיְהוָה
  choice: espérance venant de Yahweh
  alternative: espérance placée en Yahweh
  rationale: Le sens premier de מִן favorise l’idée de provenance, mais l’expression elliptique permet aussi de comprendre que Yahweh est l’objet de l’espérance. La note conserve cette tension.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et sombre, conformément au registre de la lamentation. La coordination « ainsi que » restitue naturellement l’ellipse verbale hébraïque; les notes préservent les deux ambiguïtés lexicales importantes.
