lexical_decisions:
- source_word: הֵבִיא
  choice: a fait pénétrer
  rationale: Le hiphil de בוא exprime ici l’action causative de faire entrer. « A fait pénétrer » rend clairement l’entrée violente des projectiles dans le corps sans ajouter un verbe absent du texte.
- source_word: בְּכִלְיוֹתָי
  choice: dans mes reins
  rationale: כִּלְיָה désigne littéralement le rein et peut évoquer l’être intérieur. Dans cette image de flèches qui transpercent le corps, le sens anatomique concret est prioritaire; « reins » conserve aussi la portée poétique du terme.
- source_word: בְּנֵי
  choice: les fils de
  rationale: La tournure hébraïque littérale « fils de » est conservée afin de préserver l’image poétique frappante et l’ambiguïté formelle; elle désigne ici ce qui provient du carquois, c’est-à-dire les flèches.
- source_word: אַשְׁפָּתוֹ
  choice: son carquois
  rationale: אַשְׁפָּה désigne un carquois, terme français courant et précis.
