  text: כִּ֣י לֹ֤א עִנָּה֙ מִ/לִּבּ֔/וֹ וַ/יַּגֶּ֖ה בְנֵי אִֽישׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/033.yaml
  text: For he does not afflict from his heart or grieve the sons of men[a][b].
translation:
  language: fr
  text: Car ce n’est pas de son cœur[a] qu’il afflige ou attriste les êtres humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « volontiers »; littéralement, « de son cœur ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les fils de l’homme », expression hébraïque qui désigne les êtres humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’affirmation précédente et conserve naturellement la valeur causale en français.
- source_word: לֹא
  choice: ce n’est pas… que
  rationale: La négation est intégrée à une tournure clivée idiomatique qui porte précisément sur מִלִּבּוֹ, sans nier que Dieu puisse affliger dans le contexte.
- source_word: עִנָּה
  choice: afflige
  rationale: Le verbe désigne ici le fait d’infliger une souffrance ou une détresse; « affliger » en conserve la gravité et l’étendue.
- source_word: מִלִּבּוֹ
  choice: de tout son cœur
  rationale: Cette expression française naturelle garde l’image hébraïque du cœur et exprime l’idée que l’affliction ne procède pas de son inclination profonde, sans réduire le texte au seul adverbe « volontiers ».
- source_word: וַיַּגֶּה
  choice: ou attriste
  rationale: Le verbe évoque le fait de causer chagrin ou douleur. « Attrister » le distingue du verbe précédent tout en restant naturel.
- source_word: בְנֵי אִישׁ
  choice: les êtres humains
  rationale: L’expression hébraïque, littéralement « les fils de l’homme », désigne collectivement les humains. Le français courant rend ici le référent générique sans donner à tort l’impression qu’il s’agit uniquement d’hommes de sexe masculin.
theological_decisions:
- issue: Disposition divine exprimée par une image anthropomorphique
  choice: ce n’est pas de tout son cœur qu’il afflige
  alternative: il n’afflige pas volontiers
  rationale: La formulation conserve l’image du cœur comme siège de l’inclination tout en évitant l’ambiguïté française selon laquelle Dieu n’affligerait jamais. Elle exprime que l’affliction n’est pas son plaisir ni son penchant profond.
- issue: Portée de l’expression masculine représentative
  choice: les êtres humains
  alternative: les fils de l’homme
  rationale: Dans ce syntagme idiomatique, le masculin hébreu a une portée humaine générale. La traduction communique cette portée en français moderne, tandis qu’une note conserve la forme littérale.
- issue: Relation entre les deux verbes
  choice: afflige ou attriste
  alternative: afflige et attriste
  rationale: Le waw peut relier étroitement les deux actions, mais dans cette proposition négative les verbes décrivent des aspects parallèles de la souffrance infligée. « ou » rend naturellement leur coordination sous la portée de la négation sans imposer deux actes distincts.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure clivée préserve la portée de la négation sur la disposition du cœur. Les deux notes sont signalées dans le texte principal.
