  verdict: revise
  source_fidelity: La tournure négative qui porte sur l’origine ou la disposition intérieure de l’affliction est bien comprise, et « les êtres humains » rend correctement la portée collective de בְּנֵי אִישׁ. Toutefois, « de tout son cœur » ajoute l’idée de totalité (« wholeheartedness »), absente de מִלִּבּוֹ, qui dit littéralement « de son cœur » et, idiomatiquement, « volontairement ».
  naturalness: La phrase demeure naturelle et digne en français moderne. « Ce n’est pas de son cœur qu’il afflige ou attriste… » conserve une formulation compréhensible tout en reflétant plus exactement l’image hébraïque.
  terminology: « Afflige » et « attriste » distinguent utilement les deux verbes. « Les êtres humains » est un bon rendu international et inclusif du référent humain collectif; la note conserve avec justesse la forme littérale.
