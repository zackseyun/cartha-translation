source:
  edition: WLC
  text: סַכֹּ֤תָה בָ/אַף֙ וַֽ/תִּרְדְּפֵ֔/נוּ הָרַ֖גְתָּ לֹ֥א חָמָֽלְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/043.yaml
  text: You covered yourself with anger and pursued us[b][a]; you killed without pity.
translation:
  language: fr
  text: Tu t’es enveloppé de colère[a] et tu nous as poursuivis ; tu as tué sans pitié[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le mot hébreu désigne le « nez », mais il exprime idiomatiquement la colère. On pourrait aussi traduire : « dans ta colère » ou « avec colère ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu n’as pas épargné » ou « tu n’as pas eu compassion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַכֹּתָה
  choice: tu t’es enveloppé
  rationale: Le verbe סכך exprime l’action de couvrir. Le sens réfléchi, suggéré ici par le contexte et prolongé au verset suivant, est rendu naturellement par « s’envelopper », tout en conservant l’image.
- source_word: בָאַף
  choice: de colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère. Avec « s’envelopper », la préposition est rendue naturellement par « de ».
- source_word: וַתִּרְדְּפֵנוּ
  choice: et tu nous as poursuivis
  rationale: רדף signifie couramment « poursuivre ». Cette formulation directe n’ajoute pas la nuance plus spécialisée de « persécuter ».
- source_word: הָרַגְתָּ
  choice: tu as tué
  rationale: הרג est le verbe courant pour « tuer ». La formulation moderne et directe préserve la force de l’accusation.
- source_word: לֹא חָמָלְתָּ
  choice: sans pitié
  rationale: חמל peut signifier « épargner » ou « avoir compassion ». Après « tu as tué », « sans pitié » rend avec concision la manière impitoyable de l’action sans créer une répétition maladroite.
theological_decisions:
- issue: Adresse directe à Dieu dans une lamentation qui lui attribue le jugement
  choice: Conserver sans l’atténuer l’accusation directe à la deuxième personne
  alternative: 'Paraphraser : « tu as permis qu’on nous poursuive » ou « tu semblais tuer sans pitié »'
  rationale: L’hébreu attribue directement ces actes à l’interlocuteur. Le genre de la lamentation autorise cette parole audacieuse ; la traduction doit préserver cette tension théologique plutôt que l’expliquer ou l’adoucir.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé rend naturellement les actes accomplis dans le récit de lamentation. Le point-virgule maintient la progression accusatrice et le parallélisme.
