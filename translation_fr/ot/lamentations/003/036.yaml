  source_fidelity: 'Le premier membre rend bien לְעַוֵּת אָדָם בְּרִיבוֹ : « faire tort à quelqu’un dans son procès » conserve l’idée de léser ou de fausser le droit d’une personne dans une affaire judiciaire. Pour אֲדֹנָי לֹא רָאָה, le français doit éviter de faire du pronom objet un ajout interprétatif trop précis. « Le Seigneur ne le voit pas » peut faire croire que le Seigneur ne voit pas la personne, plutôt que l’injustice ou l’affaire évoquée. « Le Seigneur ne le voit-il pas ? » respecte mieux le verbe « voir » et rend explicitement possible la lecture rhétorique traditionnellement reconnue, sans imposer « n’approuve pas » dans le texte.'
