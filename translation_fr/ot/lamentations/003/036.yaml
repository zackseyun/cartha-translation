  text: to deny a man justice in his case—the Lord does not approve[a][b].
translation:
  language: fr
  text: 'faire tort à quelqu’un dans son procès[a] —

    le Seigneur ne le voit-il pas ?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « fausser la cause de quelqu’un dans un litige » ou « léser quelqu’un dans son affaire » dans un contexte judiciaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, dans une lecture déclarative : « le Seigneur n’a pas vu » ou « le Seigneur ne le voit pas ». La phrase peut être comprise comme une question rhétorique. Dans ce contexte, « voir » peut aussi exprimer le fait de prendre en considération ou d’approuver : « le Seigneur ne l’approuve pas ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְעַוֵּת
  choice: faire tort
  rationale: Le piel de עוה exprime ici l’action de fausser ce qui est juste ou de léser quelqu’un. « Faire tort » rend naturellement cette atteinte dans le cadre judiciaire indiqué par la suite.
- source_word: אָדָם
  choice: quelqu’un
  rationale: Le nom désigne ici un être humain singulier engagé dans un litige. « Quelqu’un » conserve cette portée individuelle et générique en français courant.
- source_word: בְּרִיבוֹ
  choice: dans son procès
  rationale: רִיב peut désigner un différend ou une affaire judiciaire. Le contexte des versets 34–36 favorise ici « procès », formulation claire qui maintient la dimension juridique.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי, traditionnellement et naturellement rendu en français par « le Seigneur ».
- source_word: לֹא רָאָה
  choice: ne le voit pas
  rationale: Cette formulation conserve le verbe hébreu « voir » et sa négation, sans remplacer dans le texte l’image originale par son implication possible, « ne pas approuver ».
theological_decisions:
- issue: Faut-il comprendre לֹא רָאָה comme une absence de perception ou comme une absence d’approbation ?
  choice: 'Conserver dans le texte l’expression visuelle : « le Seigneur ne le voit pas »'
  alternative: « le Seigneur ne l’approuve pas » ; ou, selon une lecture interrogative, « le Seigneur ne le voit-il pas ? »
  rationale: Le verbe signifie littéralement « voir », mais peut, dans ce contexte, évoquer le fait de considérer ou d’approuver. Garder l’image dans le texte et signaler les interprétations en note préserve la tension du passage sans la résoudre silencieusement.
translation_notes:
  register: Français moderne, sobre et digne. Le verset demeure syntaxiquement lié aux infinitifs des versets précédents. « Faire tort à quelqu’un » évite une tournure juridique artificielle, tandis que les notes conservent les possibilités lexicales et l’ambiguïté théologique de la dernière proposition.
