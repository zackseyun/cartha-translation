  text: Mes ennemis m’ont pourchassé comme un oiseau[a], sans raison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe par une construction que l’on pourrait rendre littéralement par « pourchasser, ils m’ont pourchassé »; autre traduction possible : « Mes ennemis m’ont bel et bien pourchassé comme un oiseau, sans raison. »'
