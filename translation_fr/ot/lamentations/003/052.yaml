lexical_decisions:
- source_word: צוֹד צָדוּנִי
  choice: m’ont pourchassé
  rationale: Le verbe צוד évoque la chasse ou la capture du gibier. « Pourchasser » restitue naturellement l’image d’une poursuite hostile. La construction hébraïque associant infinitif absolu et verbe conjugué renforce l’action; cette insistance est signalée en note plutôt que rendue par un adverbe potentiellement trop précis.
- source_word: כַּצִּפּוֹר
  choice: comme un oiseau
  rationale: צִפּוֹר est ici un terme général désignant un oiseau, sans qu’une espèce particulière soit indiquée. La comparaison conserve l’image de la vulnérabilité d’une proie.
- source_word: אֹיְבַי
  choice: Mes ennemis
  rationale: Le nom désigne directement les ennemis ou adversaires. « Mes ennemis » est clair, courant et fidèle.
- source_word: חִנָּם
  choice: sans raison
  rationale: Dans ce contexte, חִנָּם exprime l’absence de motif légitime. « Sans raison » est naturel en français moderne et maintient l’affirmation d’une hostilité injustifiée.
