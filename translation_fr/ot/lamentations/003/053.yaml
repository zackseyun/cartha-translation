review_pass:
  verdict: revise
  source_fidelity: Le sens de צָמְתוּ avec « ma vie » est celui de mettre fin, supprimer ou réduire au silence. « Ont anéanti ma vie » est possible, mais formule plus catégoriquement une destruction accomplie que ne l’exige l’image, alors que le locuteur poursuit sa lamentation. « Ont réduit ma vie au silence » rend bien la force du verbe tout en conservant le langage imagé. « Dans la fosse » reflète correctement בַּבּוֹר. « Jeté une pierre sur moi » maintient l’ambiguïté pertinente de בִּי, qui peut renvoyer à une pierre lancée contre lui ou placée sur/au-dessus de lui.
  naturalness: La formulation révisée est sobre et poétique dans un français international moderne. « Réduire ma vie au silence » est une image naturelle dans ce registre; elle évite la finalité excessive de « anéantir ma vie ».
  terminology: « Fosse », « vie » et « pierre » sont appropriés. La note conserve l’alternative spatiale sans imposer une interprétation architecturale ou narrative précise.
  issues:
  - severity: medium
    issue: « ont anéanti ma vie » peut surtraduire l’achèvement de l’action.
    rationale: Le verbe hébreu peut exprimer la suppression ou la mise à fin, mais, dans la bouche d’un locuteur vivant et dans cette image poétique, « réduire au silence » conserve plus exactement la force sans présenter la mort comme un fait explicitement accompli.
  - severity: low
    issue: La note emploie « lui » alors que le texte est à la première personne.
    rationale: Employer « moi » dans les deux options rend l’explication cohérente avec la voix du verset.
