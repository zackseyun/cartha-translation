  text: צָֽמְת֤וּ בַ/בּוֹר֙ חַיָּ֔/י וַ/יַּדּוּ אֶ֖בֶן בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/053.yaml
  text: They silenced my life in the pit[a], and threw a stone at me.
translation:
  language: fr
  text: Ils ont réduit ma vie au silence dans la fosse et ont jeté une pierre sur moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre moi » ; l’image peut évoquer soit une pierre lancée contre moi, soit une pierre posée au-dessus de moi pour fermer la fosse.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְתוּ
  choice: ont anéanti
  rationale: Le verbe exprime l’idée de mettre fin, supprimer ou détruire. Avec « ma vie » comme complément, « ont anéanti ma vie » est naturel en français et conserve la violence de l’image sans affirmer nécessairement une mort accomplie.
- source_word: בַבּוֹר
  choice: dans la fosse
  rationale: בּוֹר peut désigner une fosse, une citerne ou une cavité servant de prison. « La fosse » garde cette amplitude et convient au contexte de confinement et de mort imminente.
- source_word: חַיַּי
  choice: ma vie
  rationale: Le pluriel hébreu muni du suffixe de première personne fonctionne ici idiomatiquement au sens de « ma vie ».
- source_word: וַיַּדּוּ
  choice: ont jeté
  rationale: Le verbe signifie jeter ou lancer. « Ont jeté » est clair, actuel et non marqué.
- source_word: אֶבֶן
  choice: une pierre
  rationale: Le nom singulier désigne simplement une pierre; l’article indéfini est naturel en français.
- source_word: בִּי
  choice: sur moi
  rationale: La préposition ב peut indiquer le contact ou la direction. « Sur moi » préserve mieux l’ambiguïté entre une pierre lancée contre la personne et une pierre placée au-dessus d’elle pour fermer la fosse.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le marqueur de note est placé après l’ensemble de la proposition concernée. « Anéanti ma vie » rend le résultat visé par צָמְתוּ, tandis que « sur moi » maintient l’ambiguïté spatiale du texte hébreu.
