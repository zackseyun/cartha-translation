id: LAM.3.65
reference: Lamentations 3:65
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תִּתֵּ֤ן לָ/הֶם֙ מְגִנַּת לֵ֔ב תַּאֲלָֽתְ/ךָ֖ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/065.yaml
  text: You will give them hardness of heart[b][a]; your curse will be upon them.
translation:
  language: fr
  text: Tu leur donneras un cœur endurci[a][b] ; ta malédiction sera sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puisses-tu leur donner un cœur endurci ; que ta malédiction soit sur eux ! » L’inaccompli hébreu peut s’entendre comme un souhait ou une imprécation.'
    reason: alternative_reading
  - marker: b
    text: Littéralement, « une couverture » ou « un bouclier du cœur ». L’expression est rare ; dans ce contexte, elle évoque probablement un cœur fermé, insensible ou endurci.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: Tu leur donneras
  rationale: L’inaccompli qal, 2e personne du masculin singulier de נתן, s’adresse à Dieu. Le futur français conserve la valeur solennelle de la prière tout en laissant ouverte une nuance de souhait ou d’imprécation.
- source_word: מְגִנַּת לֵב
  choice: un cœur endurci
  rationale: L’expression rare signifie littéralement quelque chose comme « couverture/protection du cœur ». Dans ce contexte de jugement, elle désigne probablement un état intérieur d’insensibilité ou d’endurcissement. La formulation retenue est naturelle en français, tandis que l’incertitude lexicale est signalée en note.
- source_word: תַּאֲלָתְךָ
  choice: ta malédiction
  rationale: Le nom désigne ici une malédiction, éventuellement liée à une imprécation ou à un serment. « Malédiction » est le terme français courant qui convient au contexte.
- source_word: לָהֶם ... לָהֶם
  choice: leur ... sur eux
  rationale: La répétition de la préposition hébraïque souligne les destinataires. La variation française évite une tournure artificielle tout en conservant cette orientation du jugement vers eux.
theological_decisions:
- issue: 'Valeur de l’inaccompli : annonce ou prière imprécatoire'
  choice: Le futur « Tu leur donneras »
  alternative: « Puisses-tu leur donner »
  rationale: Le passage est une prière demandant le jugement divin. Le futur français peut exprimer une affirmation solennelle à valeur imprécatoire sans trancher entièrement entre prédiction et souhait ; l’autre possibilité est conservée en note.
- issue: Nature de l’état intérieur désigné par מְגִנַּת לֵב
  choice: « un cœur endurci »
  alternative: « une couverture du cœur » ou « un cœur fermé »
  rationale: Le contexte associe cet état intérieur à la malédiction divine, mais l’expression hébraïque demeure rare et difficile. La traduction principale donne le sens contextuel probable sans faire disparaître l’image littérale, signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe à Dieu. Le point-virgule maintient le parallélisme entre les deux membres du verset.
