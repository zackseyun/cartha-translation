  yaml_path: translation/ot/lamentations/003/007.yaml
  text: He has walled me in so that I cannot get out[a]; he has made my chain heavy.
translation:
  language: fr
  text: Il a dressé un mur autour de moi, et je ne peux pas sortir ; il a alourdi ma chaîne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma chaîne de bronze » ou « mon entrave ». Le terme hébreu est apparenté au mot « bronze » (ou « cuivre ») et désigne probablement ici une entrave métallique.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר בַּעֲדִי
  choice: Il m’a enfermé derrière un mur
  rationale: Le verbe גדר évoque l’action de murer, clôturer ou enfermer. Cette formulation française conserve l’image concrète d’un mur et exprime naturellement l’enfermement subi par le locuteur.
- source_word: וְלֹא אֵצֵא
  choice: si bien que je ne peux pas sortir
  rationale: L’hébreu dit littéralement « et je ne sors pas / ne peux pas sortir ». Dans ce contexte, la tournure consécutive rend clairement le résultat de l’enfermement sans introduire l’idée plus forte d’une évasion.
- source_word: הִכְבִּיד
  choice: il a alourdi
  rationale: Le hifil de כבד signifie « rendre lourd, alourdir ». Le choix maintient l’image concrète et la construction causative.
- source_word: נְחָשְׁתִּי
  choice: ma chaîne
  rationale: Le terme, apparenté au mot désignant le bronze ou le cuivre, désigne vraisemblablement ici une entrave métallique. « Ma chaîne » est naturel en français et convient à l’image carcérale, tandis que l’incertitude lexicale et l’allusion possible au bronze sont signalées en note.
