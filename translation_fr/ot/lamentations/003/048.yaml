  yaml_path: translation/ot/lamentations/003/048.yaml
  text: Streams of water run down from my eyes over the destruction of the daughter of my people[a][b].
translation:
  language: fr
  text: Des ruisseaux d’eau coulent de mes yeux à cause de la ruine de la fille de mon peuple[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la destruction », « du désastre » ou « du brisement de la fille de mon peuple ».
    reason: lexical_alternative
  - marker: b
    text: « La fille de mon peuple » est une expression poétique hébraïque qui personnifie le peuple sous les traits d’une fille ; selon le contexte, elle peut évoquer Sion ou Juda.
    reason: cultural_note
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: Des ruisseaux d’eau
  rationale: פֶּלֶג désigne un canal ou un cours d’eau. « Des ruisseaux d’eau » conserve l’image poétique de flots de larmes sans l’intensifier en « torrents ».
- source_word: תֵּרַד
  choice: coulent
  rationale: Le verbe ירד signifie littéralement « descendre ». Avec les larmes et les yeux, « coulent » exprime naturellement en français le mouvement descendant.
- source_word: עֵינִי
  choice: mes yeux
  rationale: Bien que la forme hébraïque soit morphologiquement au singulier, cet emploi peut désigner collectivement les yeux; le pluriel est idiomatique en français.
- source_word: עַל
  choice: à cause de
  rationale: La préposition indique ici le motif des pleurs. « À cause de » rend clairement ce rapport causal.
- source_word: שֶׁבֶר
  choice: la ruine
  rationale: Dans ce contexte de lamentation, שֶׁבֶר évoque l’effondrement, le désastre ou la dévastation. « Ruine » garde à la fois la force concrète et une certaine amplitude sémantique.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: La traduction littérale conserve la personnification poétique hébraïque de la communauté, souvent Sion ou Juda, sous les traits d’une fille.
