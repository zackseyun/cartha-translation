source:
  edition: WLC
  text: הָיִ֤יתִי שְּׂחֹק֙ לְ/כָל עַמִּ֔/י נְגִינָתָ֖/ם כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/014.yaml
  text: I have become a laughingstock to all my people[a], their song all day long.
translation:
  language: fr
  text: Je suis devenu la risée de tout mon peuple, le sujet de leurs chansons[a] tout au long du jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leurs chants moqueurs » ou « de leurs chansons railleuses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי
  choice: Je suis devenu
  rationale: Le parfait qal à la première personne peut exprimer un état présent résultant d’événements passés; cette formulation convient au contexte de lamentation.
- source_word: שְּׂחֹק
  choice: la risée
  rationale: Le nom désigne la dérision ou celui dont on rit. « La risée » rend naturellement en français sa fonction prédicative.
- source_word: לְכָל עַמִּי
  choice: de tout mon peuple
  rationale: Avec « la risée », le français idiomatique demande « de » pour désigner ceux qui se moquent; « tout mon peuple » suit directement l’hébreu sans ajouter l’emphase de « mon propre peuple ».
- source_word: נְגִינָתָם
  choice: le sujet de leurs chansons
  rationale: Le nom peut désigner une chanson, une musique ou un chant moqueur. L’ajout idiomatique de « le sujet de » indique que le locuteur est ce qu’ils chantent, tandis que la note conserve le sens explicitement railleur possible.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Formulation française naturelle et soutenue pour l’expression temporelle signifiant « toute la journée ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « La risée » est courant et expressif sans être familier; « tout au long du jour » maintient le ton poétique de la lamentation.
