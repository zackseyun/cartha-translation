  text: קָרָ֤אתִי שִׁמְ/ךָ֙ יְהוָ֔ה מִ/בּ֖וֹר תַּחְתִּיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/055.yaml
  text: I called on your name[a], O Yahweh, from the depths of the pit.
translation:
  language: fr
  text: J’ai invoqué ton nom, Yahweh, depuis les profondeurs de la fosse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis les parties les plus basses de la fosse » ; autre traduction possible : « depuis les profondeurs d’en bas de la fosse ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: קָרָאתִי
  choice: J’ai invoqué
  rationale: Le qal accompli à la première personne du singulier signifie littéralement « j’ai appelé ». Avec « ton nom », « j’ai invoqué » exprime naturellement en français l’appel adressé à Dieu dans la prière.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: La traduction littérale conserve l’idiome hébreu de l’invocation du nom, sans le réduire à un simple « je t’ai appelé ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: מִבּוֹר
  choice: depuis… la fosse
  rationale: בּוֹר peut désigner une fosse, une citerne ou un cachot creusé. « Fosse » garde ici la portée concrète et métaphorique de l’image.
- source_word: תַּחְתִּיּוֹת
  choice: les profondeurs
  rationale: Ce pluriel évoque les régions inférieures ou les endroits les plus bas. « Les profondeurs de la fosse » est naturel en français tout en conservant l’idée d’un lieu extrêmement bas.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en préserve la fonction de nom propre sans lui substituer un titre.
translation_notes:
  register: Français moderne, international et digne. « J’ai invoqué ton nom » conserve l’idiome biblique tout en restant immédiatement compréhensible ; « depuis les profondeurs de la fosse » restitue naturellement l’image hébraïque.
