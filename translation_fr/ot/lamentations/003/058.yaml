  text: רַ֧בְתָּ אֲדֹנָ֛/י רִיבֵ֥י נַפְשִׁ֖/י גָּאַ֥לְתָּ חַיָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/058.yaml
  text: You have defended the cause of my soul[a], O Lord; you have redeemed my life.
translation:
  language: fr
  text: Tu as défendu ma cause[a], Seigneur ; tu as racheté ma vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les causes de mon âme » ; le mot rendu par « âme » peut aussi désigner la vie ou la personne. Ou : « Tu as plaidé ma cause. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבְתָּ
  choice: tu as défendu
  rationale: Le qal de ריב, associé ici à רִיבֵי, évoque l’action de soutenir ou plaider une cause. « Défendu » rend naturellement en français l’intervention juridique en faveur du locuteur.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Le terme est le titre divin révérenciel אֲדֹנָי. « Seigneur » est son équivalent français usuel ; placé en apostrophe, il conserve l’adresse directe sans recourir au « ô » littéraire.
- source_word: רִיבֵי
  choice: ma cause
  rationale: Le pluriel hébreu peut avoir ici une valeur collective ou intensive et désigner l’ensemble du litige du locuteur. Le singulier collectif « ma cause » est idiomatique en français.
- source_word: נַפְשִׁי
  choice: ma
  rationale: Dans l’expression juridique, נֶפֶשׁ désigne la personne ou la vie du locuteur. « Ma cause » exprime naturellement « la cause qui me concerne », tandis que la note conserve la formulation plus explicite « la cause de mon être ».
- source_word: גָּאַלְתָּ
  choice: tu as racheté
  rationale: גאל désigne l’action de délivrer ou de reprendre en qualité de rédempteur. « Racheté » préserve cette image particulière sans la réduire à une délivrance générale.
- source_word: חַיָּי
  choice: ma vie
  rationale: Le pluriel morphologique est employé idiomatiquement au sens de « vie ». « Ma vie » est l’équivalent français naturel.
theological_decisions:
- issue: Maintien des deux images distinctes, juridique puis rédemptrice
  choice: « défendu ma cause » puis « racheté ma vie »
  alternative: Uniformiser les deux membres par des termes généraux comme « tu m’as secouru et sauvé »
  rationale: L’hébreu associe deux champs d’image distincts, celui du procès avec ריב et celui du rachat avec גאל. Les conserver respecte la progression poétique et la tension théologique du verset.
- issue: Portée de נַפְשִׁי dans le premier membre
  choice: L’intégrer idiomatiquement dans « ma cause », avec une note signalant la formulation littérale et l’autre lecture possible
  alternative: Traduire directement « la cause de mon âme »
  rationale: נֶפֶשׁ peut désigner l’âme, la vie, la personne ou l’être. « La cause de mon âme » serait peu naturel et potentiellement réducteur en français moderne ; la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, sobre et digne. L’ordre avec « Seigneur » en apostrophe reste naturel et marque clairement l’adresse directe. Le passé composé convient au témoignage rétrospectif du locuteur.
