  text: מַה יִּתְאוֹנֵן֙ אָדָ֣ם חָ֔י גֶּ֖בֶר עַל חטא/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/039.yaml
  text: Why should a living man complain, a man, about his sins?
translation:
  language: fr
  text: Pourquoi un être humain vivant, un homme, se plaindrait-il de son péché[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La préposition hébraïque peut aussi se comprendre, dans le contexte, comme « à cause de son péché », c’est-à-dire de ses conséquences ou de son châtiment. Le texte ne mentionne pas explicitement le châtiment.
    reason: Préserve l’ambiguïté de עַל tout en signalant l’interprétation contextuelle traditionnelle sans ajouter « châtiment » au texte.
lexical_decisions:
- source_word: אָדָם חָי (ʾādām ḥāy)
  choice: un être humain encore en vie
  rationale: Exprime naturellement en français l’idée d’un humain vivant, avec la nuance contextuelle que le simple fait d’être encore en vie met en question sa plainte.
- source_word: יִתְאוֹנֵן (yitʾônēn)
  choice: se plaindrait-il
  rationale: Le verbe désigne l’action de se lamenter ou de se plaindre; le conditionnel français convient à la question rhétorique introduite par « pourquoi ».
- source_word: גֶּבֶר (gever)
  choice: un homme
  rationale: Conserve la reprise emphatique du texte hébreu après אָדָם, sans fondre silencieusement les deux termes.
- source_word: עַל חטאו (ʿal ḥeṭʾô)
  choice: au sujet de son péché
  rationale: Rend directement la préposition עַל et le singulier « son péché », sans ajouter explicitement la notion de châtiment, absente du texte consonantique.
theological_decisions:
- issue: La plainte porte-t-elle sur le péché ou sur son châtiment ?
  choice: au sujet de son péché
  alternative: à cause du châtiment de ses péchés
  rationale: L’hébreu dit littéralement « au sujet de son péché ». Le contexte peut faire entendre les conséquences ou le châtiment du péché, mais les expliciter dans le corps du texte résoudrait une ambiguïté réelle.
translation_notes:
  register: Français moderne, digne et accessible. La répétition quelque peu marquée « un être humain… un homme » est maintenue afin de préserver le parallélisme et l’insistance de l’hébreu.
