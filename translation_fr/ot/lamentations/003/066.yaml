  yaml_path: translation/ot/lamentations/003/066.yaml
  text: You will pursue them in anger and destroy them from under the heavens of Yahweh[a][b].
translation:
  language: fr
  text: Poursuis-les avec colère et détruis-les[a] de dessous les cieux de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu les poursuivras dans ta colère et tu les détruiras », les verbes hébreux à l’inaccompli pouvant aussi exprimer une attente assurée.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « de dessous les cieux de Yahweh » ; cette image poétique évoque leur disparition totale du monde qui se trouve sous les cieux de Yahweh.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּרְדֹּף
  choice: Tu les poursuivras
  rationale: Le qal inaccompli à la deuxième personne masculine singulière s’adresse directement à Dieu. Le futur français conserve ici la force solennelle de la prière sans transformer le verbe en récit passé; la nuance de souhait ou de demande est signalée en note.
- source_word: בְּאַף
  choice: dans ta colère
  rationale: אַף désigne idiomatiquement la colère, et la préposition בְּ exprime ici la manière ou la circonstance concomitante. Le possessif explicite naturellement en français la colère de l’interlocuteur divin.
- source_word: וְתַשְׁמִידֵם
  choice: et tu les détruiras
  rationale: Le hiphil inaccompli de שׁמד, muni du suffixe de troisième personne masculine plurielle, signifie faire périr ou détruire. « Détruire » garde la force du verbe sans les connotations modernes plus particulières d’« exterminer ».
- source_word: מִתַּחַת
  choice: de dessous
  rationale: La préposition composée exprime littéralement un mouvement ou un retrait « de dessous ». Cette formulation conserve l’image spatiale poétique, malgré son caractère plus marqué en français courant.
- source_word: שְׁמֵי
  choice: les cieux de
  rationale: Le pluriel construit de שָׁמַיִם est rendu par « les cieux de », formulation poétique qui respecte le nombre et le registre élevés du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui préserve le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
theological_decisions:
- issue: Force des verbes hébreux à l’inaccompli dans cette prière
  choice: 'Futur à valeur de demande ou d’attente assurée : « Tu les poursuivras… tu les détruiras »'
  alternative: 'Impératif ou souhait explicite : « Poursuis-les… détruis-les »'
  rationale: Dans le contexte de lamentation et de prière, les inaccomplis peuvent avoir une portée volitive tout en se prêtant à une formulation future. Le texte principal conserve cette tension; la note donne la lecture explicitement suppliante.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie directement le nom divin. « Yahweh » en conserve la forme personnelle, sans remplacer le nom par un titre.
translation_notes:
  register: Français moderne, digne et poétique. Le futur maintient l’ambiguïté entre demande pressante et attente assurée. La tournure marquée « de dessous les cieux » est conservée pour respecter l’image spatiale de l’hébreu; la note en éclaire le sens.
