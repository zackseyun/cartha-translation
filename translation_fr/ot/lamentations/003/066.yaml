review_pass:
  verdict: revise
  source_fidelity: Les deux verbes sont des inaccomplis à la 2e personne masculine singulière, adressés à Yahweh. Dans la séquence de supplication des vv. 64–66, leur valeur volitive est au premier plan. L’impératif français rend cette prière de façon plus directe; la note conserve la possibilité d’une lecture au futur d’attente assurée. « De dessous les cieux de Yahweh » préserve l’image et le registre poétique de מִתַּחַת שְׁמֵי יְהוָה.
  naturalness: « Tu les poursuivras… tu les détruiras » se lit principalement en français comme une prédiction plutôt que comme une demande. « Poursuis-les… détruis-les » est naturel, digne et conforme au contexte de prière. « Avec colère » est idiomatique en français moderne; « de dessous les cieux » demeure volontairement poétique et est éclairé par la note.
  terminology: « Yahweh » rend correctement le tétragramme. « Détruire » est fidèle à la force de שׁמד sans ajouter les connotations spécifiques d’« exterminer ».
  issues:
