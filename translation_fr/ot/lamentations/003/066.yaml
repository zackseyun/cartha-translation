    issue: La valeur de prière des inaccomplis est insuffisamment exprimée dans le texte principal.
    rationale: Le futur indicatif français présente normalement l’action comme une affirmation sur l’avenir. Dans le contexte immédiat, les formes hébraïques constituent plus naturellement une demande adressée à Dieu. L’impératif français exprime cette force sans éliminer l’autre possibilité, qui est maintenue en note.
  - severity: low
    issue: La note a décrit l’espace sous les cieux comme étant sous « les cieux de Dieu ».
    rationale: Même dans une explication, reprendre « Yahweh » évite de neutraliser le nom divin explicitement employé dans le verset.
