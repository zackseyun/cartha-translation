  text: to crush under his feet all the prisoners of the earth,[a]
translation:
  language: fr
  text: écraser sous ses pieds tous les prisonniers de la terre,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les prisonniers du pays ». Le mot hébreu אֶרֶץ peut désigner soit « la terre », soit « le pays »; « la terre » conserve ici la portée large et poétique possible du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַכֵּא
  choice: écraser
  rationale: L’infinitif construit avec לְ poursuit l’énumération des actes iniques aux versets 34–36. דכא exprime l’idée d’écraser ou d’accabler; « écraser » conserve ici la force concrète de l’image des pieds.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition a ici son sens spatial direct et régit « ses pieds ».
- source_word: רַגְלָיו
  choice: ses pieds
  rationale: Le nom hébreu est au pluriel avec un suffixe masculin singulier de troisième personne; cette traduction en reproduit exactement le nombre et la relation possessive.
- source_word: כֹּל
  choice: tous les
  rationale: Devant le pluriel « prisonniers », « tous les » rend naturellement la totalité collective exprimée par כֹּל.
- source_word: אֲסִירֵי
  choice: prisonniers de
  rationale: Le terme désigne des personnes détenues ou captives. « Prisonniers » est courant, précis et convient au contexte d’injustice.
- source_word: אָרֶץ
  choice: la terre
  rationale: אָרֶץ peut désigner soit la terre au sens large, soit un pays ou territoire. « La terre » préserve la portée universelle possible de cette formulation poétique, sans exclure l’autre lecture, signalée en note.
