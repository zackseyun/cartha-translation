  yaml_path: translation/ot/lamentations/003/008.yaml
  text: Even when I cry out and call for help[a], he shuts out my prayer.
translation:
  language: fr
  text: Même quand je crie et appelle au secours, il ferme l’accès à ma prière.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם כִּי
  choice: Même quand
  rationale: 'Dans ce contexte, la locution a une force concessive : malgré les cris du locuteur, l’action exprimée ensuite demeure. « Même quand » est naturel en français et conserve cette tension.'
- source_word: אֶזְעַק
  choice: je crie
  rationale: Le verbe זעק désigne un cri puissant, souvent poussé dans la détresse. « Je crie » en restitue directement l’intensité.
- source_word: וַאֲשַׁוֵּעַ
  choice: et appelle au secours
  rationale: Le piel de שׁוע exprime un appel pressant à l’aide. Cette formulation le distingue du premier verbe tout en rendant clairement le parallélisme.
- source_word: שָׂתַם
  choice: il bloque
  rationale: Le verbe signifie boucher, obstruer ou bloquer. Avec « ma prière » pour complément, « bloque » conserve l’image forte de la prière empêchée de parvenir à destination.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: Le nom signifie directement « prière » ; cette traduction est précise et naturelle.
theological_decisions:
- issue: Sujet implicite de « il bloque »
  choice: Conserver le pronom masculin singulier « il » sans ajouter « Dieu » ni « le Seigneur ».
  alternative: Nommer explicitement Dieu, ou employer une tournure passive comme « ma prière est bloquée ».
  rationale: Le verbe hébreu est à la troisième personne du masculin singulier sans sujet explicite dans cette proposition. Le contexte identifie le référent, mais « il » préserve la concision et l’implicite de l’hébreu sans introduire un nom divin absent du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la force de la plainte, le parallélisme des deux appels et l’image concrète de l’obstruction.
