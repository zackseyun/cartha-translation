  yaml_path: translation/ot/lamentations/003/063.yaml
  text: Look at their sitting down and their rising up[a]; I am their song.
translation:
  language: fr
  text: 'Regarde quand ils s’assoient et quand ils se lèvent[a] : je suis le sujet de leur chant[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur action de s’asseoir et leur action de se lever ». Cette paire peut désigner l’ensemble de leurs faits et gestes.'
    reason: idiome hébreu
  - marker: b
    text: 'Ou : « je suis leur chant ». Le terme hébreu peut désigner un chant ou de la musique ; dans ce contexte, il s’agit probablement d’un chant par lequel ils se moquent de moi.'
    reason: alternative lexicale
lexical_decisions:
- source_word: שִׁבְתָּם וְקִימָתָם
  choice: qu’ils soient assis ou debout
  rationale: Le couple concret « leur position assise et leur lever » forme une expression mérismatique qui embrasse leur conduite quotidienne. Cette formulation française naturelle conserve les deux pôles sans réduire le sens à un instant précis.
- source_word: הַבִּיטָה
  choice: Regarde-les
  rationale: L’impératif est une demande directe adressée à Dieu. Le complément « les » reprend naturellement les personnes dont les attitudes sont évoquées.
- source_word: אֲנִי
  choice: je
  rationale: Le pronom explicite souligne que le locuteur lui-même est l’objet de leurs chansons.
- source_word: מַנְגִּינָתָם
  choice: le sujet de leurs chansons
  rationale: Le nom désigne une chanson ou une musique; dans le contexte hostile, le suffixe indique vraisemblablement que le locuteur est ce qu’ils chantent. « Le sujet de » rend cette relation clairement sans inscrire la moquerie, probable mais implicite, dans le texte principal.
