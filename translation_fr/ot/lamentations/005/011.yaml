  text: נָשִׁים֙ בְּ/צִיּ֣וֹן עִנּ֔וּ בְּתֻלֹ֖ת בְּ/עָרֵ֥י יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/011.yaml
  text: Women in Zion were violated[a], virgins in the cities of Judah.
translation:
  language: fr
  text: À Sion, des femmes ont été violées[a], et des vierges dans les villes de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « maltraitées » ou « humiliées ». Le verbe hébreu peut désigner plus largement l’humiliation ou les sévices, mais, dans ce contexte où il est question de femmes et de vierges, il évoque très probablement le viol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: des femmes
  rationale: Le pluriel désigne ici les femmes en général plutôt que spécifiquement des épouses, comme le suggère le parallèle avec les jeunes filles.
- source_word: בְּצִיּוֹן
  choice: À Sion
  rationale: La préposition marque le lieu. « À Sion » est la tournure française naturelle pour situer les faits dans cette ville.
- source_word: עִנּוּ
  choice: ont été violées
  rationale: Au piel, le verbe peut exprimer l’humiliation ou les sévices; appliqué ici à des femmes et à des jeunes filles, il désigne très probablement des violences sexuelles. Le français « violées » rend clairement le sens contextuel le plus vraisemblable, tandis que la note préserve l’étendue lexicale du verbe.
- source_word: בְּתֻלֹת
  choice: des jeunes filles
  rationale: Le nom peut désigner des vierges ou, dans l’usage courant, de jeunes femmes en âge de se marier. « Jeunes filles » est naturel en français et évite de réduire leur désignation à un état sexuel, tout en laissant « vierges » comme autre traduction possible.
- source_word: בְּעָרֵי יְהוּדָה
  choice: dans les villes de Juda
  rationale: Cette traduction directe du groupe construit conserve le parallélisme géographique avec Sion.
