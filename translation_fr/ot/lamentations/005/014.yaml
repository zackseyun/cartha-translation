source:
  edition: WLC
  text: זְקֵנִים֙ מִ/שַּׁ֣עַר שָׁבָ֔תוּ בַּחוּרִ֖ים מִ/נְּגִינָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/014.yaml
  text: The elders have ceased from the gate[a], the young men from their music.
translation:
  language: fr
  text: 'Les anciens ne se tiennent plus à la porte,

    les jeunes hommes ne font plus de musique.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne jouent plus » ou « ne chantent plus » ; le terme hébreu peut désigner une exécution musicale, souvent instrumentale.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: les anciens
  rationale: Dans ce contexte civique, le terme désigne vraisemblablement les hommes âgés qui exercent aussi un rôle reconnu dans la communauté; « les anciens » rend cette double nuance.
- source_word: מִשַּׁעַר שָׁבָתוּ
  choice: ne siègent plus à la porte de la ville
  rationale: Littéralement, ils « ont cessé loin de la porte ». En français, « ne siègent plus à la porte » exprime naturellement leur disparition du lieu habituel de délibération et de justice; « de la ville » explicite le sens contextuel de la porte sans développer sa fonction.
- source_word: בַּחוּרִים
  choice: les jeunes hommes
  rationale: Le nom désigne des hommes dans la force de la jeunesse; cette formulation conserve le parallèle avec « les anciens ».
- source_word: מִנְּגִינָתָם
  choice: ont cessé de jouer de la musique
  rationale: נְגִינָה peut désigner la musique, le chant ou surtout l'exécution instrumentale. Cette formulation est naturelle et garde l'idée d'une activité musicale, tandis que la note signale l'ambiguïté.
theological_decisions: []
translation_notes:
  register: Style poétique, sobre et digne. Le parallélisme entre les anciens absents de la vie civique et les jeunes hommes privés de leur activité musicale est conservé en deux lignes.
