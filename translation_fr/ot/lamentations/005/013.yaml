  text: בַּחוּרִים֙ טְח֣וֹן נָשָׂ֔אוּ וּ/נְעָרִ֖ים בָּ/עֵ֥ץ כָּשָֽׁלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/013.yaml
  text: Young men carry millstones[b][a], and boys stagger under wood.
translation:
  language: fr
  text: Les jeunes hommes portent la meule[a], et les garçons trébuchent sous le bois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portent le travail de mouture » ou « portent un moulin ». Le terme hébreu est lié au broyage et peut désigner soit le travail lui-même, soit l’appareil servant à moudre.
    reason: lexical_alternative
  - marker: b
    text: La préposition hébraïque peut aussi se comprendre « avec le bois » ou « dans/au moyen du bois » ; dans ce contexte, elle évoque probablement des garçons qui chancellent sous des charges de bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  choice: les jeunes hommes
  rationale: Désigne de jeunes adultes masculins, probablement dans la force de l’âge. Cette expression française est naturelle et ne surcharge pas le terme.
- source_word: טְחוֹן
  choice: la meule
  rationale: Le mot est associé au broyage ou à la mouture. Avec « porter », il peut désigner l’instrument de mouture, mais le travail de broyage reste possible; une note conserve cette ambiguïté.
- source_word: נָשָׂאוּ
  choice: portent
  rationale: Le verbe signifie lever, porter ou supporter. « Portent » convient à l’image concrète d’un lourd fardeau.
- source_word: וּנְעָרִים
  choice: et les garçons
  rationale: Le terme peut désigner des garçons ou de jeunes gens. « Garçons » marque ici une différence d’âge probable avec les jeunes hommes du premier membre et renforce le pathétique sans excès d’interprétation.
- source_word: בָּעֵץ
  choice: sous le bois
  rationale: La préposition peut littéralement se rendre par « dans », « avec » ou « sous » selon le rapport contextuel. « Sous le bois » exprime naturellement le fardeau suggéré, tandis que la note signale la formulation plus littérale.
- source_word: כָּשָׁלוּ
  choice: trébuchent
  rationale: Le verbe exprime le fait de trébucher ou de chanceler. « Trébuchent » reste proche de l’hébreu sans aller jusqu’à « s’effondrent ».
