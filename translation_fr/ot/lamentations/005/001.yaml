id: LAM.5.1
reference: Lamentations 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זְכֹ֤ר יְהוָה֙ מֶֽה הָ֣יָה לָ֔/נוּ הביט וּ/רְאֵ֥ה אֶת חֶרְפָּתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/001.yaml
  text: Remember[a], O Yahweh, what has happened to us; look, and see our disgrace.
translation:
  language: fr
  text: Souviens-toi, Yahweh, de ce qui nous est arrivé ; regarde et vois notre déshonneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre opprobre » ; également « notre honte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: Impératif masculin singulier de זכר adressé à Yahweh. « Souviens-toi » est l’appel naturel en français et conserve la portée de la prière, qui demande à Dieu de prendre en considération la détresse du peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: מֶה הָיָה לָנוּ
  choice: de ce qui nous est arrivé
  rationale: Cette formulation idiomatique exprime les événements et la situation qui ont frappé le peuple, sans réduire le sens à son seul état présent.
- source_word: הביט
  choice: regarde
  rationale: L’impératif de נבט introduit une demande pressante. « Regarde » garde sa valeur propre et permet de conserver le parallélisme avec « vois ».
- source_word: וּרְאֵה
  choice: et vois
  rationale: 'L’impératif de ראה est rendu distinctement pour préserver le double appel hébreu : « regarde et vois ».'
- source_word: אֶת חֶרְפָּתֵנוּ
  choice: notre déshonneur
  rationale: חֶרְפָּה désigne l’opprobre, la honte ou le déshonneur subi publiquement. « Déshonneur » exprime clairement l’atteinte à l’honneur, tandis que la note signale les autres nuances possibles.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom personnel et l’adresse directe de la prière, sans le remplacer par un titre.
translation_notes:
  register: Français moderne, naturel et digne. Le vocatif sans « ô » évite une solennité archaïsante. Le double impératif « regarde et vois » est maintenu pour respecter le parallélisme et l’insistance de l’hébreu.
