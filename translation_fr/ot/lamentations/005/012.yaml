  text: שָׂרִים֙ בְּ/יָדָ֣/ם נִתְל֔וּ פְּנֵ֥י זְקֵנִ֖ים לֹ֥א נֶהְדָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/012.yaml
  text: Princes were hung up by their hands[b][a]; the faces of elders were not honored.
translation:
  language: fr
  text: 'Des princes ont été suspendus par les mains[a] ;

    on n’a témoigné aucun respect aux anciens[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par leur main ». L’expression indique probablement qu’ils ont été suspendus par les mains.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le visage des anciens n’a pas été honoré », expression hébraïque signifiant qu’on leur a refusé le respect qui leur était dû.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  choice: princes
  rationale: Le terme désigne des dirigeants, hauts responsables ou nobles. « Princes » conserve ici le rang élevé et le contraste avec leur humiliation publique.
- source_word: בְּיָדָם
  choice: par les mains
  rationale: Avec le verbe « suspendre », la préposition בְּ indique très probablement la partie du corps par laquelle ces hommes ont été suspendus. Le français emploie naturellement le pluriel « les mains ».
- source_word: נִתְלוּ
  choice: ont été suspendus
  rationale: Le niphal de תלה signifie « être pendu/suspendu ». « Suspendus » évite de suggérer nécessairement une pendaison par le cou ou une exécution, tout en conservant l’image de violence et d’exposition.
- source_word: פְּנֵי זְקֵנִים
  choice: aux anciens
  rationale: Littéralement, « le visage des anciens » ; le visage représente ici leur personne et leur dignité. La formulation française explicite naturellement cette métonymie sans en modifier le sens.
- source_word: לֹא נֶהְדָּרוּ
  choice: on n’a témoigné aucun respect
  rationale: Le niphal de הדר exprime le fait de recevoir honneur, considération ou dignité. Cette tournure française rend clairement le passif hébreu dans une langue actuelle.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme du vers est conservé en deux membres ; le premier garde l’image concrète de l’humiliation, tandis que le second rend explicitement une expression hébraïque qui serait peu naturelle si elle était reproduite mot à mot.
