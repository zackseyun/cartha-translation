source:
  edition: WLC
  text: אַתָּ֤ה יְהוָה֙ לְ/עוֹלָ֣ם תֵּשֵׁ֔ב כִּסְאֲ/ךָ֖ לְ/דֹ֥ר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/019.yaml
  text: But you[a], O Yahweh, sit enthroned forever; your throne is from generation to generation.
translation:
  language: fr
  text: Toi, Yahweh, tu sièges[a] pour toujours ; ton trône demeure de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu demeures pour toujours ». Le verbe hébreu signifie littéralement « s’asseoir, siéger » ou « demeurer » ; la mention du trône dans le membre parallèle suggère ici l’idée de siéger en roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: Toi
  rationale: Le pronom indépendant placé en tête porte l’emphase et marque le contraste avec la condition humaine décrite auparavant. La dislocation « Toi… tu » rend naturellement cette mise en relief en français, sans ajouter une conjonction absente de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Dans ce contexte, le terme exprime la perpétuité ; cette formulation est naturelle et digne en français moderne.
- source_word: תֵּשֵׁב
  choice: tu sièges
  rationale: Le verbe signifie littéralement « s’asseoir, siéger, demeurer ». Le parallélisme avec « ton trône » met ici en avant la posture royale ; « siéger » conserve l’image sans la transformer directement en « régner ».
- source_word: כִּסְאֲךָ
  choice: ton trône
  rationale: Rendu direct du nom avec suffixe de deuxième personne du masculin singulier.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette expression française naturelle reproduit l’idiome hébreu de continuité à travers les générations successives.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme comme nom propre ; sa translittération préserve cette fonction.
- issue: Portée royale du verbe ישׁב
  choice: tu sièges
  alternative: tu demeures
  rationale: La mention parallèle du trône favorise le sens royal, mais la note conserve l’autre valeur lexicale possible afin de ne pas effacer l’ambiguïté du verbe.
- issue: Verbe sous-entendu dans le second membre
  choice: ton trône demeure
  alternative: ton trône est là
  rationale: L’hébreu présente une proposition nominale sans verbe exprimé. Le français exige ici un appui verbal naturel ; « demeure » exprime la continuité indiquée par le complément temporel sans introduire une idée étrangère au parallélisme.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise « Toi… tu » conserve l’emphase initiale de l’hébreu. Le point-virgule met en valeur le parallélisme des deux membres.
