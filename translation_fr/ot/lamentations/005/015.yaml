  text: The joy of our heart has ceased[a]; our dancing has turned to mourning.
translation:
  language: fr
  text: La joie de notre cœur a cessé ; notre danse s’est changée en deuil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: a cessé
  rationale: Le qal accompli exprime la cessation et son résultat présent. « A cessé » est concis, naturel et fidèle au ton de la lamentation.
- source_word: מְשׂוֹשׂ
  choice: la joie
  rationale: Le nom désigne la joie ou l’allégresse. « La joie » convient naturellement à la construction « de notre cœur » et préserve la sobriété poétique.
- source_word: לִבֵּנוּ
  choice: notre cœur
  rationale: L’hébreu emploie un singulier collectif avec un suffixe pluriel. Le singulier français conserve cette image commune sans donner un tour archaïque à la phrase.
- source_word: נֶהְפַּךְ
  choice: se sont changées
  rationale: Le nifal accompli décrit un changement d’état. La tournure pronominale française exprime ce passage sans préciser un agent que le texte ne nomme pas.
- source_word: לְאֵבֶל
  choice: en deuil
  rationale: אֵבֶל désigne le deuil ou les manifestations de deuil. « En deuil » forme un contraste idiomatique et fort avec les danses de fête.
- source_word: מְחֹלֵנוּ
  choice: nos danses
  rationale: Le nom désigne la danse, particulièrement dans un contexte festif. Le pluriel français rend naturellement l’activité collective, tandis que le singulier de l’hébreu reste signalé en note.
