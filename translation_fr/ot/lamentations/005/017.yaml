  text: עַל זֶ֗ה הָיָ֤ה דָוֶה֙ לִבֵּ֔/נוּ עַל אֵ֖לֶּה חָשְׁכ֥וּ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/017.yaml
  text: Because of this our heart has become sick[a]; because of these things our eyes have grown dim.
translation:
  language: fr
  text: À cause de cela, notre cœur est devenu malade[a] ; à cause de ces choses, nos yeux se sont obscurcis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de cela, notre cœur était défaillant ; à cause de ces choses, nos yeux se sont assombris. »'
    reason: L’adjectif דָוֶה peut évoquer la maladie, la faiblesse ou la défaillance, tandis que les formes verbales peuvent aussi être rendues par des temps du passé.
lexical_decisions:
- source_word: עַל זֶה
  choice: À cause de cela
  rationale: La préposition עַל suivie du démonstratif exprime ici la cause ou le motif. Cette formulation française rend clairement ce rapport causal.
- source_word: הָיָה דָוֶה
  choice: est devenu malade
  rationale: Le verbe היה avec l’adjectif prédicatif דָוֶה décrit l’entrée dans un état qui demeure pertinent. « Est devenu malade » conserve à la fois le résultat et la métaphore corporelle.
- source_word: לִבֵּנוּ
  choice: notre cœur
  rationale: « Cœur » préserve l’image hébraïque de la personne intérieure tout en restant naturel et intelligible en français.
- source_word: עַל אֵלֶּה
  choice: à cause de ces choses
  rationale: La reprise de עַל marque encore la cause. « Ces choses » rend explicitement et naturellement le démonstratif pluriel.
- source_word: חָשְׁכוּ
  choice: se sont obscurcis
  rationale: Le verbe signifie littéralement devenir sombre. Avec les yeux pour sujet, « se sont obscurcis » conserve l’image poétique sans préciser si elle évoque le chagrin, l’épuisement ou l’affaiblissement de la vue.
- source_word: עֵינֵינוּ
  choice: nos yeux
  rationale: La traduction directe maintient le parallélisme et l’imagerie corporelle du verset.
theological_decisions: []
