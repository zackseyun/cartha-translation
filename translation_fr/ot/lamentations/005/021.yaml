  text: הֲשִׁיבֵ֨/נוּ יְהוָ֤ה אֵלֶ֨י/ךָ֙ ו/נשוב חַדֵּ֥שׁ יָמֵ֖י/נוּ כְּ/קֶֽדֶם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/021.yaml
  text: Restore us to yourself[a], O Yahweh, that we may return[b]; renew our days as of old.
translation:
  language: fr
  text: Ramène-nous à toi, Yahweh, et nous reviendrons[a] ; renouvelle nos jours comme autrefois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que nous revenions » ; ou encore : « alors nous reviendrons ».'
    reason: La relation syntaxique entre l’impératif הֲשִׁיבֵנוּ et וְנָשׁוּב peut être comprise comme une coordination, une conséquence ou un but.
  - marker: b
    text: 'Littéralement : « comme auparavant » ou « comme aux temps anciens ».'
    reason: קֶדֶם peut évoquer ce qui était auparavant ou les temps anciens, sans préciser la période visée.
lexical_decisions:
- source_word: הֲשִׁיבֵנוּ
  choice: Ramène-nous
  rationale: Le hifil impératif de שוב avec suffixe de première personne du pluriel signifie « faire revenir » ou « ramener ». « Ramène-nous » conserve directement l’image du retour vers Dieu et convient naturellement à la supplication.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֵלֶיךָ
  choice: à toi
  rationale: Traduction directe de la préposition אֶל avec suffixe de deuxième personne masculine du singulier ; elle exprime le mouvement relationnel vers Dieu sans explicitation superflue.
- source_word: וְנָשׁוּב
  choice: et nous reviendrons
  rationale: 'Le waw suivi de l’inaccompli peut exprimer la conséquence de l’impératif précédent : Dieu ramène le peuple, qui alors revient. Cette formulation française conserve la coordination et l’ambiguïté de nuance du texte hébreu.'
- source_word: חַדֵּשׁ
  choice: renouvelle
  rationale: Le piel impératif de חדש signifie « renouveler » ou « rendre nouveau ». « Renouvelle » est direct, idiomatique et garde le parallélisme des deux demandes.
- source_word: יָמֵינוּ
  choice: nos jours
  rationale: La traduction concrète et littérale préserve l’expression poétique, même si « jours » peut désigner plus largement la condition de vie du peuple.
- source_word: כְּקֶדֶם
  choice: comme autrefois
  rationale: קֶדֶם désigne ici le temps passé ou les temps anciens. « Comme autrefois » est naturel en français moderne et garde ouverte l’étendue exacte de la période évoquée.
theological_decisions:
- issue: Rapport entre l’action divine et le retour humain dans וְנָשׁוּב
  choice: et nous reviendrons
  alternative: afin que nous revenions
  rationale: Après l’impératif, l’hébreu peut se comprendre comme une coordination à valeur consécutive ou comme une relation de but/résultat. Le texte principal conserve la forme coordonnée, tandis que la note signale l’autre lecture, sans trancher davantage la tension entre initiative divine et réponse humaine.
translation_notes:
  register: Français international moderne, simple et digne, avec une cadence poétique. « Ramène-nous à toi » préserve l’image hébraïque du retour ; les deux notes rendent visibles les ambiguïtés syntaxique et temporelle sans alourdir le verset.
