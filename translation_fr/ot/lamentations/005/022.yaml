translation:
  language: fr
  text: À moins que tu ne nous aies entièrement rejetés et que tu ne sois extrêmement en colère contre nous[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car tu nous as entièrement rejetés et tu es extrêmement en colère contre nous », si l’on comprend cette ligne comme une affirmation plus autonome plutôt que comme une réserve à la prière du verset précédent.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement, pour l’expression de la colère : « sur nous »; « contre nous » en exprime le sens dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: à moins que
  rationale: Dans le prolongement de la demande du verset 21, la locution introduit naturellement en français une réserve ou une exception. Une lecture causale ou conditionnelle demeure possible et est signalée en note.
- source_word: מָאֹס מְאַסְתָּנוּ
  choice: tu ne nous aies entièrement rejetés
  rationale: L’infinitif absolu suivi du verbe de même racine intensifie l’action. « Entièrement rejetés » restitue cette insistance ainsi que le sens principal de מאס dans cette lamentation, sans durcir le terme en « méprisés ».
- source_word: קָצַפְתָּ
  choice: ta colère … ne soit
  rationale: La tournure nominale est naturelle en français après « à moins que » et exprime l’état de colère résultant du qatal hébreu, sans imposer une distinction temporelle que le contexte ne tranche pas nettement.
- source_word: עָלֵינוּ
  choice: contre nous
  rationale: Avec la colère, על marque ici son orientation hostile. « Contre nous » reste idiomatique et conserve plus directement cette nuance que « envers nous ».
- source_word: עַד מְאֹד
  choice: extrême
  rationale: L’adjectif attribut traduit avec force l’intensification « jusqu’à l’extrême / au plus haut point » dans une formulation française fluide et digne.
theological_decisions:
- issue: Le verset constitue-t-il une réserve à la prière précédente ou une affirmation plus autonome ?
  choice: 'Une proposition exceptive poursuivant la prière du verset 21 : « à moins que… »'
  alternative: 'Une déclaration plus autonome : « Car tu nous as entièrement rejetés… » ou une condition : « Mais si tu nous as entièrement rejetés… »'
  rationale: כִּי אִם peut avoir ici une valeur exceptive, qui maintient la fin ouverte et la tension entre l’appel au rétablissement et la possibilité redoutée d’un rejet. La note conserve l’autre analyse syntaxique sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et sobre. Le tutoiement correspond à l’adresse directe à Dieu dans la lamentation. La syntaxe exceptive dépend volontairement du verset précédent, tandis que les notes préservent l’ambiguïté de כִּי אִם et la formulation spatiale de עָלֵינוּ.
