  text: מִצְרַ֨יִם֙ נָתַ֣נּוּ יָ֔ד אַשּׁ֖וּר לִ/שְׂבֹּ֥עַֽ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/006.yaml
  text: We have given the hand to Egypt and to Assyria[a], to get enough bread.
translation:
  language: fr
  text: Nous avons tendu la main à l’Égypte et à l’Assyrie[a] pour avoir assez de pain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Nous avons donné la main à l’Égypte et à l’Assyrie » — c’est-à-dire que nous nous sommes soumis à elles, avons recherché leur alliance ou leur avons demandé de l’aide.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Nom de pays; « l’Égypte » est la forme française usuelle.
- source_word: נָתַנּוּ
  choice: avons tendu
  rationale: Le qal accompli, première personne du pluriel, décrit une action accomplie dont les conséquences demeurent. Avec יָד, « tendre la main » restitue naturellement l’image de l’hébreu en français.
- source_word: יָד
  choice: la main
  rationale: Le nom signifie littéralement « main ». Dans l’expression נתן יד, le geste peut évoquer la soumission, la recherche d’une alliance ou un appel à l’aide; l’image est conservée dans le texte et son éventail de sens précisé en note.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Nom de pays; « l’Assyrie » est la forme française usuelle.
- source_word: לִשְׂבֹּעַ
  choice: pour avoir assez
  rationale: L’infinitif de שבע exprime le fait d’être rassasié ou satisfait. Devant « pain », « avoir assez » rend clairement et naturellement le but recherché sans effacer l’idée de suffisance.
- source_word: לָחֶם
  choice: pain
  rationale: Le terme désigne littéralement le pain et peut aussi représenter la nourriture en général. Le concret « pain » est conservé, particulièrement évocateur dans ce contexte de disette.
