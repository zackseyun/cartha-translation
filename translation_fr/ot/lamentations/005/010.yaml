  text: עוֹרֵ֨/נוּ֙ כְּ/תַנּ֣וּר נִכְמָ֔רוּ מִ/פְּנֵ֖י זַלְעֲפ֥וֹת רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/010.yaml
  text: Our skin is as hot as an oven because of the burning heat of famine[a].
translation:
  language: fr
  text: Notre peau est brûlante comme un four à cause des ardeurs de la famine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Notre peau est brûlante comme un four sous les effets dévorants de la famine. » Les mots hébreux traduits par « est brûlante » et « ardeurs » sont rares ; ils peuvent évoquer une chaleur brûlante ou les effets fébriles et desséchants de la famine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרֵנוּ
  choice: Notre peau
  rationale: עוֹר désigne ici la peau humaine; « peau » est le terme français naturel et direct.
- source_word: כְּתַנּוּר
  choice: comme un four
  rationale: La préposition comparative כְּ introduit l’image du four; avec « brûle », le français exprime naturellement la chaleur intense sans ajout explicatif.
- source_word: נִכְמָרוּ
  choice: brûle
  rationale: Le niphal rare de כמר évoque ici un état de chaleur intense ou de dessèchement. « brûle » convient à l’image du four tout en évitant de préciser à tort une coloration ou une fièvre.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Dans ce contexte, מִפְּנֵי marque clairement la cause.
- source_word: זַלְעֲפוֹת
  choice: ardeurs
  rationale: Ce pluriel rare peut évoquer des chaleurs brûlantes, des accès fébriles ou des effets dévorants. « ardeurs » conserve l’intensité et une part de l’indétermination du terme.
- source_word: רָעָב
  choice: famine
  rationale: רָעָב désigne ici la calamité collective de la famine, plutôt que la seule sensation individuelle de faim.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le singulier collectif « notre peau » reproduit l’expression hébraïque. L’image du four demeure explicite, tandis que la note signale l’incertitude des deux termes rares sans imposer l’idée plus précise de fièvre.
