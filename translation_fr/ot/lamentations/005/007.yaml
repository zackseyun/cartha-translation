source:
  edition: WLC
  text: אֲבֹתֵ֤י/נוּ חָֽטְאוּ֙ אינ/ם אנחנו עֲוֺנֹתֵי/הֶ֥ם סָבָֽלְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/007.yaml
  text: Our fathers sinned[a], and they are no more; but we bear their iniquities.
translation:
  language: fr
  text: Nos pères ont péché ; ils ne sont plus, et nous, nous portons leurs fautes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous portons la peine ou les conséquences de leurs fautes ». Le mot hébreu peut désigner la faute elle-même, la culpabilité ou le fardeau qui en résulte.'
    reason: alternative lexicale et préservation de l’ambiguïté théologique
lexical_decisions:
- source_word: אֲבֹתֵינוּ
  choice: Nos pères
  rationale: Le terme désigne les pères et, par extension, les ancêtres. « Nos pères » conserve la force familiale et l’écho collectif du texte hébreu.
- source_word: חָטְאוּ
  choice: ont péché
  rationale: Le parfait qal exprime ici l’action passée des générations précédentes ; le passé composé est naturel en français moderne.
- source_word: אֵינָם
  choice: ils ne sont plus
  rationale: L’expression signifie littéralement qu’ils ne sont pas et indique, dans ce contexte, qu’ils ont disparu ou sont morts. « Ils ne sont plus » en restitue sobrement la portée.
- source_word: אֲנַחְנוּ
  choice: et nous, nous
  rationale: Le pronom indépendant marque un contraste appuyé avec les pères. La dislocation « et nous, nous » rend cette emphase naturellement en français.
- source_word: עֲוֺנֹתֵיהֶם
  choice: leurs fautes
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences qui en découlent. « Fautes » reste intelligible et assez ouvert, tandis que la note explicite l’étendue sémantique.
- source_word: סָבָלְנוּ
  choice: nous portons
  rationale: Le verbe signifie porter, supporter ou endurer un fardeau. « Portons » conserve l’image concrète sans réduire le sens à la seule souffrance.
theological_decisions:
- issue: Le verset affirme-t-il une culpabilité directement héritée ou le poids des conséquences des fautes ancestrales ?
  choice: « nous portons leurs fautes »
  alternative: « nous subissons les conséquences de leurs fautes »
  rationale: L’hébreu laisse ouverte la relation entre faute, culpabilité et conséquences. La traduction principale préserve cette tension sans imposer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule maintient la progression du verset, et « et nous, nous » fait entendre le contraste explicite de l’hébreu.
