  text: בְּ/נַפְשֵׁ֨/נוּ֙ נָבִ֣יא לַחְמֵ֔/נוּ מִ/פְּנֵ֖י חֶ֥רֶב הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/009.yaml
  text: At the risk of our lives we get our bread[b][a], because of the sword in the wilderness.
translation:
  language: fr
  text: Au péril de notre vie, nous obtenons notre pain[a], à cause de l’épée dans le désert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous rapportons notre pain ». Le verbe hébreu peut signifier « apporter » ou, plus généralement ici, « obtenir, se procurer ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à cause de l’épée du désert », c’est-à-dire peut-être de la menace d’hommes armés dans le désert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנַפְשֵׁנוּ
  choice: Au péril de notre vie
  rationale: L’expression hébraïque évoque ici le danger de mort. Cette formulation française naturelle conserve la gravité de l’image sans suggérer que la vie serait un simple moyen d’échange.
- source_word: נָבִיא
  choice: nous obtenons
  rationale: Le hiphil de בוא signifie littéralement « faire venir, apporter », mais peut, avec « notre pain », exprimer l’idée de se procurer de la nourriture. « Obtenons » rend ce sens tout en laissant l’autre analyse en note.
- source_word: לַחְמֵנוּ
  choice: notre pain
  rationale: Le terme désigne littéralement le pain et, par extension, la nourriture indispensable. Le maintien de « pain » préserve l’image concrète du texte.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition indique ici la cause ou le motif de la situation dangereuse.
- source_word: חֶרֶב
  choice: l’épée
  rationale: La traduction littérale conserve l’image vive de la menace armée, sans expliciter davantage que l’hébreu.
- source_word: הַמִּדְבָּר
  choice: le désert
  rationale: מִדְבָּר désigne une région aride ou inhabitée. « Désert » est courant, clair et adapté au contexte, tout en pouvant évoquer un territoire non sécurisé.
