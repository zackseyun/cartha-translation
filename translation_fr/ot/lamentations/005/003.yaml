id: LAM.5.3
reference: Lamentations 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְתוֹמִ֤ים הָיִ֨ינוּ֙ אין אָ֔ב אִמֹּתֵ֖י/נוּ כְּ/אַלְמָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/003.yaml
  text: We have become orphans[a], without a father; our mothers are like widows.
translation:
  language: fr
  text: Nous sommes devenus orphelins[a], sans père ; nos mères sont comme des veuves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « privés de père ».
    reason: Alternative lexicale qui met davantage en relief la privation du père et de sa protection.
lexical_decisions:
- source_word: יְתוֹמִים
  choice: orphelins
  rationale: Le terme désigne des enfants privés d’un parent et, dans l’usage biblique, souvent de la protection paternelle. « Orphelins » est naturel en français moderne ; la précision « sans père » qui suit explicite ici la situation.
- source_word: הָיִינוּ
  choice: sommes devenus
  rationale: L’accompli de היה peut décrire un état (« nous étions »), mais le contexte de catastrophe permet de rendre l’entrée dans cet état et son résultat présent par « sommes devenus ».
- source_word: אֵין אָב
  choice: sans père
  rationale: La construction négative existentielle signifie littéralement qu’il n’y a pas de père. « Sans père » en restitue sobrement le sens et l’accent sur la perte de la protection paternelle.
- source_word: אִמֹּתֵינוּ
  choice: nos mères
  rationale: Traduction directe du nom pluriel avec suffixe possessif de première personne du pluriel.
- source_word: כְּאַלְמָנוֹת
  choice: comme des veuves
  rationale: Le préfixe comparatif כְּ marque une comparaison. « Comme des veuves » préserve l’image sans affirmer que toutes les mères sont littéralement veuves.
theological_decisions:
- issue: Portée de la comparaison concernant les mères
  choice: nos mères sont comme des veuves
  alternative: nos mères sont veuves
  rationale: L’hébreu emploie explicitement le préfixe comparatif כְּ. Conserver la comparaison respecte la tension du texte et n’impose pas une affirmation historique plus forte.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme est conservé, avec une ponctuation qui maintient les deux membres du verset. « Orphelins » reste idiomatique, tandis que la note signale la nuance plus spécifiquement paternelle.
