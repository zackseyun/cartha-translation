  text: עֲבָדִים֙ מָ֣שְׁלוּ בָ֔/נוּ פֹּרֵ֖ק אֵ֥ין מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/008.yaml
  text: Servants rule over us[b][a]; there is no one to rescue us from their hand.
translation:
  language: fr
  text: Des esclaves ont exercé le pouvoir sur nous[a] ; personne ne nous délivre de leur main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des serviteurs ». Le terme hébreu peut désigner des serviteurs ou des esclaves ; « esclaves » souligne ici l’humiliation liée au renversement de l’ordre social.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de leur main », expression qui désigne leur pouvoir ou leur emprise.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים
  choice: esclaves
  rationale: Le pluriel peut désigner des serviteurs ou des esclaves. « Esclaves » fait mieux ressortir ici le renversement social et l’humiliation exprimés par la plainte, sans masquer l’autre sens possible.
- source_word: מָשְׁלוּ בָנוּ
  choice: exercent le pouvoir sur nous
  rationale: Le verbe משל construit avec ב exprime l’exercice d’une domination. Cette formulation est naturelle en français moderne et garde la force oppressive du propos.
- source_word: פֹּרֵק
  choice: nous arrache
  rationale: Le participe substantivé désigne quelqu’un qui délivre en retirant les opprimés du pouvoir d’autrui. « Arrache » convient à l’image concrète des mains qui suit.
- source_word: אֵין
  choice: personne ne
  rationale: La tournure existentielle hébraïque avec le participe se rend naturellement en français par une négation personnelle complète.
- source_word: מִיָּדָם
  choice: à leurs mains
  rationale: La « main » représente ici le pouvoir ou l’emprise. Le pluriel français est idiomatique avec un possesseur pluriel et conserve l’image corporelle de l’hébreu.
