  - severity: low
    issue: Parallélisme économique insuffisamment explicite dans le second membre
    rationale: « Notre bois nous arrive » préserve la direction du verbe, mais « s’obtient contre paiement » exprime plus clairement, en français courant, l’accès conditionné par un paiement, qui est le point du verset.
