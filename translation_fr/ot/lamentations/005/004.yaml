translation_notes:
  register: 'Français international moderne, sobre et digne. Le parallélisme économique du verset est rendu par « contre de l’argent » et « à prix d’argent ». Les possessifs sont maintenus afin de préserver l’ironie douloureuse : le peuple paie pour sa propre eau et son propre bois.'
