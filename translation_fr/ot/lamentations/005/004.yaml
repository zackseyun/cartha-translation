  text: We drink our water for silver[b][a]; our wood comes at a price.
translation:
  language: fr
  text: Nous buvons notre eau en la payant[a] ; notre bois s’obtient contre paiement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous buvons notre eau pour de l’argent. » L’hébreu dit littéralement « avec/pour de l’argent », « argent » désignant le moyen de paiement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « notre bois nous arrive pour un prix » ou « notre bois nous est apporté contre paiement ». Le verbe hébreu est au pluriel (« ils arrivent ») ; le français emploie naturellement le singulier collectif « bois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵינוּ
  choice: notre eau
  rationale: Le pluriel hébreu avec suffixe de première personne du pluriel se rend naturellement en français par le nom massif singulier « notre eau ». Le possessif est conservé, car il souligne qu’ils doivent payer même l’eau qui devrait être la leur.
- source_word: בְּכֶסֶף
  choice: contre de l’argent
  rationale: Littéralement « avec/pour de l’argent (de l’argent métal) ». En français moderne, « contre de l’argent » exprime clairement l’échange onéreux sans suggérer nécessairement des pièces de monnaie.
- source_word: שָׁתִינוּ
  choice: nous buvons
  rationale: Bien que la forme soit un accompli, le présent convient à la plainte décrivant une condition persistante et lui garde son caractère immédiat.
- source_word: עֵצֵינוּ
  choice: notre bois
  rationale: L’hébreu dit simplement « notre bois ». « Bois de chauffage » serait plausible, mais préciserait davantage que le texte source.
- source_word: בִּמְחִיר
  choice: à prix d’argent
  rationale: Cette formulation française naturelle fait ressortir l’obligation de payer et fait écho au premier membre du verset, sans effacer l’idée générale de prix.
- source_word: יָבֹאוּ
  choice: nous arrive
  rationale: Le verbe hébreu est au pluriel, en accord avec la forme plurielle de « bois ». Le français traite normalement « bois » comme un nom massif singulier. L’ajout du pronom indirect « nous » explicite naturellement la destination impliquée, tandis que la note conserve l’autre lecture possible, passive.
