translation:
  language: fr
  text: car le mont Sion est dévasté ; des renards[a] s’y promènent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacals » ; le terme hébreu peut avoir un sens plus large dans certains contextes, mais « renards » est le rendu usuel ici.
