lexical_decisions:
- source_word: עַל
  choice: car
  rationale: Dans le contexte, la préposition introduit la cause de la lamentation exprimée au verset précédent. « Car » rend naturellement ce lien causal en français.
- source_word: הַר צִיּוֹן
  choice: le mont Sion
  rationale: Formulation française courante et concise pour le syntagme hébreu.
- source_word: שֶׁשָּׁמֵם
  choice: est dévasté
  rationale: Le relatif suivi du verbe décrit l’état présent du mont Sion. « Est dévasté » exprime clairement son état de ruine sans ajouter l’idée explicite d’un changement d’état.
- source_word: שׁוּעָלִים
  choice: des renards
  rationale: « Renards » est le sens usuel du terme hébreu, même si celui-ci peut désigner plus largement des canidés et être rendu par « chacals » dans certains contextes.
- source_word: הִלְּכוּ
  choice: se promènent
  rationale: Le verbe désigne le fait de circuler ou d’aller çà et là. « Se promènent » est naturel en français et n’ajoute pas la nuance prédatrice qu’aurait « rôdent ».
- source_word: בוֹ
  choice: s’y
  rationale: Le pronom renvoie au mont Sion ; « s’y promènent » rend idiomatiquement le déplacement sur les lieux en français.
