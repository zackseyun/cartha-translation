  text: עַ֤ל צַוָּארֵ֨/נוּ֙ נִרְדָּ֔פְנוּ יָגַ֖עְנוּ לא הֽוּנַ֖ח לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/005.yaml
  text: We are pursued at our necks[a]; we are weary[b]; no rest is given to us.
translation:
  language: fr
  text: Sur nos cous, nous sommes pourchassés[a] ; nous sommes fatigués ; aucun repos ne nous est accordé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Sur nos cous, nous sommes poursuivis. » L’hébreu présente l’image saisissante de poursuivants qui les talonnent.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « on ne nous laisse aucun repos » ou « il ne nous est pas permis de nous reposer ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל צַוָּארֵינוּ
  choice: Sur nos cous
  rationale: Cette formulation conserve l’image concrète et saisissante de poursuivants qui talonnent leurs victimes. « Cous » rend le pluriel hébreu sans l’aplanir.
- source_word: נִרְדָּפְנוּ
  choice: nous sommes pourchassés
  rationale: Le nifal de רדף exprime ici une poursuite subie. « Pourchassés » garde le caractère concret et hostile de la scène, là où « persécutés » serait plus abstrait.
- source_word: יָגַעְנוּ
  choice: nous sommes épuisés
  rationale: Le verbe décrit l’état de fatigue produit par l’effort et l’oppression. « Épuisés » exprime naturellement en français l’usure due à cette poursuite incessante.
- source_word: לֹא הוּנַח לָנוּ
  choice: aucun repos ne nous est accordé
  rationale: 'Le hofal de נוח a un sens causatif passif : il ne leur est pas permis de se reposer. La tournure française restitue ce sens sans ajouter d’agent.'
theological_decisions: []
translation_notes:
  register: Français moderne, digne et concret. L’ordre initial inhabituel est conservé afin de mettre en relief l’image des cous sous la pression des poursuivants ; les deux-points du texte sont rendus par des points-virgules pour maintenir le rythme de la plainte.
