  text: לָ֤/מָּה לָ/נֶ֨צַח֙ תִּשְׁכָּחֵ֔/נוּ תַּֽעַזְבֵ֖/נוּ לְ/אֹ֥רֶךְ יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/020.yaml
  text: Why do you forget us forever? Why do you abandon us for so many days?[a]
translation:
  language: fr
  text: Pourquoi nous oublierais-tu pour toujours ? Pourquoi nous abandonnerais-tu si longtemps ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour une longueur de jours », c’est-à-dire « pendant longtemps » ou « durant de nombreux jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: L’adverbe interrogatif introduit ici une question de lamentation adressée directement à Dieu.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Cette expression rend naturellement en français l’idée d’une durée sans fin et conserve la force rhétorique de la plainte.
- source_word: תִּשְׁכָּחֵנוּ
  choice: nous oublierais-tu
  rationale: L’imparfait hébreu peut exprimer une action en cours ou envisagée. Le conditionnel interrogatif est idiomatique dans une plainte française et laisse entendre l’incrédulité douloureuse de la question sans trancher strictement entre présent et avenir.
- source_word: תַּעַזְבֵנוּ
  choice: nous abandonnerais-tu
  rationale: « Abandonner » est courant, clair et garde la forte charge affective de עזב.
- source_word: לְאֹרֶךְ יָמִים
  choice: si longtemps
  rationale: Littéralement « pour une longueur de jours », l’expression désigne une longue durée. « Si longtemps » est naturel en français et convient au ton de lamentation.
theological_decisions:
- issue: Portée temporelle des deux imparfaits תִּשְׁכָּחֵנוּ et תַּעַזְבֵנוּ
  choice: Conditionnel interrogatif (« oublierais-tu », « abandonnerais-tu »)
  alternative: Présent (« nous oublies-tu », « nous abandonnes-tu ») ou futur (« nous oublieras-tu », « nous abandonneras-tu »)
  rationale: La forme hébraïque ne fixe pas à elle seule une valeur temporelle française unique. Le conditionnel restitue une question de lamentation portant sur une situation ressentie comme actuelle et redoutée comme durable, sans transformer la plainte en affirmation doctrinale d’un abandon définitif.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme des deux questions est conservé, ainsi que la tension entre « pour toujours » et l’expression concrète d’une longue suite de jours.
