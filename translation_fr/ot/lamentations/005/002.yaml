  text: נַחֲלָתֵ֨/נוּ֙ נֶֽהֶפְכָ֣ה לְ/זָרִ֔ים בָּתֵּ֖י/נוּ לְ/נָכְרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/002.yaml
  text: Our inheritance has been turned over to strangers[a], our houses to foreigners.
translation:
  language: fr
  text: 'Notre héritage est passé à des étrangers[a],

    nos maisons à des étrangers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Notre héritage a été transféré à des étrangers, nos maisons à des étrangers. » Plus littéralement, le verbe hébreu peut signifier « a été renversé » ou « a été transformé » ; dans ce contexte, il évoque probablement un transfert de possession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתֵנוּ
  choice: notre héritage
  rationale: « Héritage » conserve à la fois le sens concret d’un bien reçu ou attribué et la portée liée à la terre transmise, sans réduire le terme à une simple propriété.
- source_word: נֶהֶפְכָה
  choice: est passé
  rationale: Le niphal de הפך exprime ici un changement subi. Dans ce contexte de dépossession, « est passé » rend naturellement le résultat — le bien se trouve désormais en d’autres mains — tout en laissant une note signaler l’image plus littérale.
- source_word: לְזָרִים
  choice: à des étrangers
  rationale: Le terme désigne des personnes extérieures au groupe. « Étrangers » est clair et naturel en français, sans la connotation administrative moderne que pourrait avoir « ressortissants étrangers ».
- source_word: בָּתֵּינוּ
  choice: nos maisons
  rationale: « Maisons » correspond au sens concret du mot hébreu et maintient le parallélisme avec « héritage ».
- source_word: לְנָכְרִים
  choice: à des gens venus d’ailleurs
  rationale: Cette formulation exprime la provenance étrangère marquée par נָכְרִים tout en évitant de répéter « étrangers » et en reflétant la variation lexicale de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme bref de l’hébreu est conservé, avec ellipse du verbe dans le second membre. La traduction distingue les deux termes hébreux désignant les personnes extérieures sans leur imposer une différence technique excessive.
