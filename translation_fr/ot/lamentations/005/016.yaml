source:
  edition: WLC
  text: נָֽפְלָה֙ עֲטֶ֣רֶת רֹאשֵׁ֔/נוּ אֽוֹי נָ֥א לָ֖/נוּ כִּ֥י חָטָֽאנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/016.yaml
  text: The crown has fallen from our head[a]. Woe to us[b], for we have sinned.
translation:
  language: fr
  text: La couronne est tombée de notre tête[a] ! Malheur à nous[b], car nous avons péché !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « La couronne de notre tête est tombée. » L’hébreu emploie littéralement l’expression poétique « la couronne de notre tête ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Hélas pour nous ! » Il s’agit d’un cri de lamentation intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָפְלָה
  choice: est tombée
  rationale: Le qatal qal à la 3e personne du féminin singulier s’accorde avec עֲטֶרֶת. Le passé composé exprime naturellement en français une action accomplie dont les effets demeurent présents dans la lamentation.
- source_word: עֲטֶרֶת רֹאשֵׁנוּ
  choice: la couronne ... de notre tête
  rationale: Cette formulation conserve la chaîne construite poétique et le singulier collectif de l’hébreu, sans préciser de manière interprétative s’il s’agit avant tout de royauté, d’honneur ou de gloire.
- source_word: אוֹי נָא לָנוּ
  choice: Malheur à nous
  rationale: אוֹי est un cri de détresse ou de lamentation, tandis que נָא en renforce ici l’intensité. « Malheur à nous » est une expression française naturelle, forte et digne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison du malheur et maintient explicitement le lien causal avec la confession qui suit.
- source_word: חָטָאנוּ
  choice: nous avons péché
  rationale: Le qatal qal à la 1re personne du pluriel exprime une confession collective. « Pécher » est le correspondant français direct et évite une paraphrase réductrice.
theological_decisions:
- issue: Confession collective et culpabilité
  choice: « car nous avons péché » présente le péché collectif comme la raison du cri de malheur.
  alternative: 'Comprendre כִּי comme une simple affirmation emphatique : « oui, nous avons péché ».'
  rationale: La valeur causale de כִּי convient le mieux au contexte et préserve le rapport explicite entre le désastre déploré et la faute confessée, sans développer davantage cette relation.
- issue: Portée symbolique de la couronne
  choice: Conserver simplement l’image de « la couronne » sans en expliciter le référent.
  alternative: Traduire ou gloser par « notre honneur », « notre gloire » ou la royauté perdue.
  rationale: L’image peut évoquer l’honneur, la dignité ou la royauté. Le texte français garde cette richesse et cette ambiguïté poétiques au lieu d’imposer une seule interprétation.
translation_notes:
  register: Français international moderne, poétique et digne. Le singulier collectif « notre tête » est volontairement maintenu pour refléter l’image hébraïque. Les points d’exclamation rendent la force des cris de lamentation sans ajouter de contenu.
