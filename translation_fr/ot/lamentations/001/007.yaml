source:
  edition: WLC
  text: זָֽכְרָ֣ה יְרוּשָׁלִַ֗ם יְמֵ֤י עָנְיָ/הּ֙ וּ/מְרוּדֶ֔י/הָ כֹּ֚ל מַחֲמֻדֶ֔י/הָ אֲשֶׁ֥ר הָי֖וּ מִ֣/ימֵי קֶ֑דֶם בִּ/נְפֹ֧ל עַמָּ֣/הּ בְּ/יַד צָ֗ר וְ/אֵ֤ין עוֹזֵר֙ לָ֔/הּ רָא֣וּ/הָ צָרִ֔ים שָׂחֲק֖וּ עַ֥ל מִשְׁבַּתֶּֽ/הָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/007.yaml
  text: Jerusalem remembered in the days of her affliction and her wanderings all her precious things that were from days of old[a]. When her people fell into the hand of the foe, and there was no one to help her, foes saw her[b]; they laughed at her ruin.
translation:
  language: fr
  text: Jérusalem se souvint des jours de son affliction et de son errance[a], de tous les biens précieux qu’elle possédait autrefois. Quand son peuple tomba aux mains de l’adversaire, sans que personne vienne à son secours, ses ennemis la virent et se moquèrent de sa ruine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son absence de foyer » ; le terme hébreu est rare et son sens est discuté.
    reason: lexical_alternative
  - marker: b
    text: Ou « de son effondrement » ou « de sa désolation » ; le nom hébreu désigne probablement la chute de Jérusalem ou son état dévasté.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה
  choice: se souvint
  rationale: Le qal accompli, 3e personne du féminin singulier, a pour sujet Jérusalem personnifiée. Le passé simple convient au récit poétique et conserve l’aspect rétrospectif.
- source_word: יְמֵי עָנְיָהּ
  choice: aux jours de son affliction
  rationale: עֳנִי désigne l’affliction, la détresse ou la misère. « Affliction » garde la gravité du terme et s’insère naturellement dans le registre poétique.
- source_word: וּמְרוּדֶיהָ
  choice: et de son errance
  rationale: Ce nom rare et discuté est probablement lié à l’idée d’errer, notamment dans le contexte de l’exil. Le singulier collectif « errance » est idiomatique en français; l’autre compréhension principale est signalée en note.
- source_word: כֹּל מַחֲמֻדֶיהָ
  choice: de tous les biens précieux
  rationale: Le terme peut englober les objets désirables, les trésors et plus largement ce qui était cher à la ville. « Biens précieux » demeure assez large tout en étant naturel.
- source_word: אֲשֶׁר הָיוּ מִימֵי קֶדֶם
  choice: qu’elle possédait autrefois
  rationale: La formulation explicite idiomatiquement le rapport entre Jérusalem et ses biens précieux. מִימֵי קֶדֶם renvoie aux temps anciens ou passés, ici rendu par « autrefois ».
- source_word: בִּנְפֹל עַמָּהּ
  choice: Quand son peuple tomba
  rationale: L’infinitif construit précédé de ב exprime ici la circonstance temporelle. « Quand » rend clairement cette relation.
- source_word: בְּיַד צָר
  choice: aux mains de l’adversaire
  rationale: L’expression hébraïque signifie tomber sous le pouvoir de quelqu’un. Le singulier « l’adversaire » préserve le nombre du texte source, tandis que le pluriel français « aux mains » rend naturellement l’idiome.
- source_word: וְאֵין עוֹזֵר לָהּ
  choice: sans que personne vienne à son secours
  rationale: Cette tournure française exprime l’absence totale de soutien sans alourdir la phrase.
- source_word: רָאוּהָ צָרִים
  choice: ses ennemis la virent
  rationale: Le pluriel צָרִים désigne ceux qui lui sont hostiles. « Ses ennemis » est clair, courant et fidèle à la personnification de Jérusalem.
- source_word: שָׂחֲקוּ
  choice: se moquèrent
  rationale: Le verbe signifie rire, ici manifestement avec une force de dérision. « Se moquèrent » rend cette valeur contextuelle en français naturel.
- source_word: עַל מִשְׁבַּתֶּהָ
  choice: de sa ruine
  rationale: Le nom difficile peut évoquer la cessation, l’effondrement ou l’état dévasté de Jérusalem. « Ruine » exprime bien l’objet de la dérision tout en laissant l’alternative en note.
