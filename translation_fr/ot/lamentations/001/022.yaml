  verdict: revise
  source_fidelity: Le jussif initial, l’impératif adressé à Dieu, la répétition de עלל (« traiter »), le motif des révoltes et l’image du cœur malade sont fidèlement rendus. Une légère révision du premier groupe nominal clarifie que רָעָתָם vise ici le mal commis par les adversaires, conformément au contexte et sans supprimer l’alternative « malheur » en note.
  naturalness: « Toute leur méchanceté » est plus idiomatique et immédiatement intelligible que « tout leur mal », expression qui peut spontanément se comprendre comme les malheurs qu’ils subissent. Le reste est fluide, moderne et d’un registre approprié à une lamentation-prière.
  terminology: « Méchanceté », « traite-les », « révoltes », « gémissements » et « mon cœur est malade » rendent avec justesse le vocabulaire moral, judiciaire et affectif du texte. Le féminin de « traitée » est recevable dans le cadre de Jérusalem personnifiée.
