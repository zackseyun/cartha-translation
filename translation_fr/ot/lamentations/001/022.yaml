language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תָּבֹ֨א כָל רָעָתָ֤/ם לְ/פָנֶ֨י/ךָ֙ וְ/עוֹלֵ֣ל לָ֔/מוֹ כַּ/אֲשֶׁ֥ר עוֹלַ֛לְתָּ לִ֖/י עַ֣ל כָּל פְּשָׁעָ֑/י כִּֽי רַבּ֥וֹת אַנְחֹתַ֖/י וְ/לִבִּ֥/י דַוָּֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/022.yaml
  text: Let all their evil come before you[a], and deal with them as you have dealt with me because of all my transgressions; for my groans are many[c][b], and my heart is sick.
translation:
  language: fr
  text: Que toute leur méchanceté vienne devant toi[a] ! Traite-les comme tu m’as traitée[b] à cause de toutes mes révoltes. Car mes gémissements sont nombreux[c], et mon cœur est malade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout leur mal ». Le mot hébreu peut aussi signifier « malheur », mais il désigne probablement ici le mal dont ils sont coupables.
    reason: lexical_alternative
  - marker: b
    text: Ou « Fais-leur ce que tu m’as fait ». L’hébreu répète le même verbe dans les deux membres de la phrase.
    reason: lexical_alternative
  - marker: c
    text: Ou « mes soupirs sont nombreux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבֹא
  choice: Que … vienne
  rationale: L’imparfait qal a ici une valeur jussive dans une prière ; cette tournure exprime naturellement la demande en français.
- source_word: רָעָתָם
  choice: tout leur mal
  rationale: רָעָה peut désigner le mal moral ou le malheur. Le parallèle avec les révoltes de Sion favorise ici le mal dont les ennemis sont coupables, sans effacer entièrement la largeur du terme.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Expression idiomatique qui évoque à la fois la présence et l’examen judiciaire de Dieu.
- source_word: וְעוֹלֵל לָמוֹ … כַּאֲשֶׁר עוֹלַלְתָּ לִי
  choice: Traite-les comme tu m’as traitée
  rationale: La répétition de « traiter » reproduit celle du verbe עלל et conserve la comparaison entre le sort demandé pour les ennemis et le jugement déjà subi par la locutrice.
- source_word: עַל כָּל פְּשָׁעָי
  choice: à cause de toutes mes révoltes
  rationale: פשע désigne des actes de rupture ou de rébellion. « Révoltes » en garde la force morale et relationnelle.
- source_word: רַבּוֹת אַנְחֹתַי
  choice: mes gémissements sont nombreux
  rationale: אַנְחָה évoque les soupirs ou gémissements produits par la douleur ; « gémissements » restitue clairement l’intensité de la lamentation.
- source_word: לִבִּי דַוָּי
  choice: mon cœur est malade
  rationale: דַוָּי exprime la maladie, la faiblesse ou l’affliction ; la formulation conserve la métaphore hébraïque de la souffrance intérieure.
theological_decisions:
- issue: Nature du jugement demandé contre les ennemis
  choice: Présenter le verset comme un appel à Dieu afin qu’il prenne en compte leur mal et les traite comme il a traité Sion.
  alternative: Accentuer la demande de châtiment rétributif, ou l’atténuer en simple demande de prise en considération.
  rationale: L’hébreu formule une prière judiciaire et imprécatoire, mais ne précise ni la forme ni l’étendue du traitement demandé. La traduction n’intensifie ni n’adoucit cet appel.
- issue: Genre de la locutrice
  choice: « traitée », au féminin
  alternative: 'Employer une formulation sans marque de genre : « agis envers eux comme tu as agi envers moi ».'
  rationale: Dans le poème, la voix est celle de Jérusalem personnifiée comme une femme ; le féminin rend ce cadre littéraire explicite sans modifier le référent.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme bref convient à la prière de lamentation. Le féminin « traitée » maintient la personnification de Jérusalem, tandis que « révoltes » garde la gravité de פשע sans recourir à un vocabulaire inutilement archaïque.
