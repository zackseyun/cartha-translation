  to: Son impureté était dans les pans de sa robe[a] ; elle ne s’est pas souciée de son issue. Elle est descendue de manière stupéfiante[b] ; il n’y avait personne pour la consoler. Regarde, Yahweh, ma détresse, car l’ennemi s’est élevé[c] !
