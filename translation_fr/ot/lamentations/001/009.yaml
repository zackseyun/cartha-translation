  text: טֻמְאָתָ֣/הּ בְּ/שׁוּלֶ֗י/הָ לֹ֤א זָֽכְרָה֙ אַחֲרִיתָ֔/הּ וַ/תֵּ֣רֶד פְּלָאִ֔ים אֵ֥ין מְנַחֵ֖ם לָ֑/הּ רְאֵ֤ה יְהוָה֙ אֶת עָנְיִ֔/י כִּ֥י הִגְדִּ֖יל אוֹיֵֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/009.yaml
  text: Her uncleanness was in her skirts[a]; she did not remember her end. So she came down astonishingly; there was no comforter for her. Look, O Yahweh, my affliction[c][b], for the enemy has magnified himself.
translation:
  language: fr
  text: Son impureté était dans les pans de sa robe[a] ; elle ne s’est pas souciée de son issue. Elle est descendue de manière stupéfiante[b] ; il n’y avait personne pour la consoler. Regarde, Yahweh, ma détresse, car l’ennemi s’est élevé[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Son impureté était dans les pans de sa robe. »'
    reason: L’image hébraïque situe la souillure dans les bords inférieurs du vêtement.
  - marker: b
    text: 'Littéralement : « elle est descendue de façon extraordinaire » ; l’expression évoque un effondrement saisissant, hors du commun.'
    reason: La note conserve la métaphore de la descente et la construction inhabituelle de l’hébreu.
  - marker: c
    text: 'Ou : « car l’ennemi s’est fait grand » ou « s’est exalté ».'
    reason: Le verbe peut décrire la puissance prise par l’ennemi ou son orgueilleuse exaltation.
lexical_decisions:
- source_word: טֻמְאָתָהּ בְּשׁוּלֶיהָ
  choice: Son impureté souillait les pans de sa robe
  rationale: « Impureté » conserve les dimensions rituelle et morale de טֻמְאָה. La formulation rend naturellement en français l’image d’une souillure présente sur les bords inférieurs du vêtement, sans la réduire à une simple saleté matérielle.
- source_word: לֹא זָכְרָה אַחֲרִיתָהּ
  choice: elle n’a pas pensé à ce qui l’attendait
  rationale: זכר signifie littéralement « se souvenir », mais peut ici exprimer la prise en considération. אַחֲרִית désigne la fin, l’issue ou l’avenir ; cette formulation française préserve l’idée des conséquences futures sans imposer celle d’une fin absolue.
- source_word: וַתֵּרֶד פְּלָאִים
  choice: Sa chute a été stupéfiante
  rationale: Le texte dit littéralement qu’elle « est descendue de façon extraordinaire ». Dans ce contexte de ruine et d’humiliation, « chute » restitue la métaphore, tandis que « stupéfiante » exprime le caractère extraordinaire et bouleversant de l’événement.
- source_word: אֵין מְנַחֵם לָהּ
  choice: personne ne l’a consolée
  rationale: Formulation française naturelle du participe substantivé « il n’y a pas de consolateur pour elle », tout en conservant le motif récurrent de l’absence de consolation.
- source_word: רְאֵה יְהוָה אֶת עָנְיִי
  choice: Regarde, Yahweh, ma détresse
  rationale: L’impératif est un appel direct à l’attention divine. « Détresse » convient à עֳנִי dans ce contexte de misère et de souffrance.
- source_word: כִּי הִגְדִּיל אוֹיֵב
  choice: car l’ennemi s’est élevé
  rationale: Le hiphil de גדל exprime ici le fait de se grandir ou de s’exalter. « S’est élevé » demeure idiomatique et conserve la nuance de triomphe orgueilleux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte hébreu emploie le nom divin personnel. La translittération « Yahweh » le distingue d’un titre et suit la politique éditoriale fournie.
- issue: Nature de l’impureté de Jérusalem
  choice: Maintenir le terme général « impureté »
  alternative: saleté, faute sexuelle ou impureté rituelle exclusivement
  rationale: Le contexte et l’image peuvent évoquer plusieurs dimensions de la souillure. La traduction ne tranche pas au-delà de ce qu’affirme le substantif hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours passe à la première personne dans la supplication finale, comme en hébreu. Les guillemets rendent ce changement de voix explicite sans identifier davantage la locutrice.
