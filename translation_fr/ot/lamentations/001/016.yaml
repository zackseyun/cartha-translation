source:
  edition: WLC
  text: עַל אֵ֣לֶּה אֲנִ֣י בוֹכִיָּ֗ה עֵינִ֤/י עֵינִ/י֙ יֹ֣רְדָה מַּ֔יִם כִּֽי רָחַ֥ק מִמֶּ֛/נִּי מְנַחֵ֖ם מֵשִׁ֣יב נַפְשִׁ֑/י הָי֤וּ בָנַ/י֙ שֽׁוֹמֵמִ֔ים כִּ֥י גָבַ֖ר אוֹיֵֽב־׀׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/016.yaml
  text: For these things I am weeping; my eye[a], my eye runs down with water, because the comforter who restores my soul is far from me. My children have become desolate, because the enemy has prevailed.
translation:
  language: fr
  text: À cause de tout cela, je pleure ; mon œil, mon œil ruisselle d’eau, car celui qui me console et me redonne vie[a] est loin de moi. Mes enfants sont dévastés, car l’ennemi l’a emporté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui me restaure » ; traditionnellement : « qui restaure mon âme ». Le mot hébreu nephesh peut désigner la vie, la personne tout entière ou l’âme selon le contexte.'
    reason: Préserver l’étendue sémantique de נֶפֶשׁ et signaler la formulation traditionnelle sans imposer une anthropologie particulière.
lexical_decisions:
- source_word: עַל אֵלֶּה
  choice: À cause de tout cela
  rationale: La préposition עַל suivie du démonstratif indique ici ce qui provoque les pleurs. « Tout cela » est naturel en français et reprend l’ensemble des malheurs évoqués.
- source_word: בוֹכִיָּה
  choice: je pleure
  rationale: Le participe féminin exprime l’action continue de Jérusalem personnifiée. Le présent français convient à cette lamentation en cours.
- source_word: עֵינִי עֵינִי
  choice: mon œil, mon œil
  rationale: Le singulier répété est conservé afin de respecter l’intensité et la forme poétique de l’hébreu, plutôt que de lisser en « mes yeux ».
- source_word: יֹרְדָה מַּיִם
  choice: ruisselle d’eau
  rationale: L’hébreu parle littéralement d’eau qui descend. « Ruisselle d’eau » garde cette image sans remplacer explicitement l’eau par les larmes.
- source_word: מְנַחֵם
  choice: celui qui me console
  rationale: Le participe substantivé désigne la personne susceptible d’apporter la consolation. Cette formulation est plus courante en français moderne que « le consolateur ».
- source_word: מֵשִׁיב נַפְשִׁי
  choice: ranime ma vie
  rationale: Le verbe שׁוב à la forme causative évoque ici le rétablissement, tandis que נֶפֶשׁ peut désigner la vie ou l’être tout entier. « Ranime ma vie » exprime ce renouvellement sans imposer une anthropologie dualiste.
- source_word: רָחַק מִמֶּנִּי
  choice: est loin de moi
  rationale: Traduction directe de l’éloignement ou de l’absence du consolateur.
- source_word: בָנַי
  choice: Mes enfants
  rationale: Bien que le nom puisse signifier littéralement « mes fils », il désigne collectivement les habitants issus de Sion personnifiée ; « enfants » évite de limiter le propos aux hommes.
- source_word: שֹׁמֵמִים
  choice: sont dans la désolation
  rationale: Le terme décrit un état de dévastation, d’abandon ou de consternation. Cette formulation conserve la portée du mot sans choisir exclusivement entre ruine extérieure et accablement intérieur.
- source_word: גָבַר אוֹיֵב
  choice: l’ennemi l’a emporté
  rationale: גבר exprime la supériorité acquise ou la victoire. L’expression française rend naturellement le fait que l’ennemi a prévalu.
theological_decisions:
- issue: Sens de נַפְשִׁי dans le contexte de la lamentation
  choice: ma vie
  alternative: mon âme ; mon être
  rationale: נֶפֶשׁ désigne fréquemment la vie, la personne ou l’être entier, et pas nécessairement une composante immatérielle distincte. « Ma vie » convient au rétablissement espéré dans ce contexte, tandis qu’une note préserve l’étendue sémantique du terme.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition inhabituelle « mon œil, mon œil » ainsi que l’image de l’eau sont maintenues pour conserver la force rhétorique de l’hébreu, tandis que « celui qui me console » évite le caractère plus spécialisé de « consolateur ».
