  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la splendeur quitte Sion, ses princes sont comparés à des cervidés sans pâturage, puis ils avancent épuisés face à un poursuivant. Toutefois, « ont marché » restreint légèrement le verbe hébreu הלך (« aller, s’avancer ») à la marche proprement dite. « Avançaient » garde mieux le mouvement sous la pression du poursuivant, sans expliciter une fuite.'
  naturalness: Le français est globalement naturel et conserve un registre poétique sobre. « Ils avançaient sans force devant celui qui les poursuivait » est plus fluide dans ce tableau narratif que « ils ont marché sans force » et évite la nuance trop concrète de « marcher ».
  terminology: « La fille de Sion », « splendeur », « princes » et « cerfs » sont appropriés et respectent la personnification ainsi que le registre du texte. Le poursuivant reste au singulier, conformément au participe hébreu. La note a est reformulée afin que l’alternative littérale soit idiomatique en français.
  issues:
  - severity: low
    issue: « ont marché » est plus spécifique que le verbe hébreu הלך.
    rationale: הלך désigne ici le fait d’aller ou d’avancer ; il n’impose pas l’idée de marcher à pied. Une formulation plus générale préserve mieux la portée du verbe.
  - severity: low
    issue: La formulation « Toute sa beauté est sortie de la fille de Sion » de la note a est peu idiomatique en français.
    rationale: L’alternative peut conserver l’image de sortie tout en exprimant naturellement le départ de la splendeur hors de Sion.
