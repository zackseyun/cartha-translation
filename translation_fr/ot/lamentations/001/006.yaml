  text: וַ/יֵּצֵ֥א מן בת צִיּ֖וֹן כָּל הֲדָרָ֑/הּ הָי֣וּ שָׂרֶ֗י/הָ כְּ/אַיָּלִים֙ לֹא מָצְא֣וּ מִרְעֶ֔ה וַ/יֵּלְכ֥וּ בְ/לֹא כֹ֖חַ לִ/פְנֵ֥י רוֹדֵֽף־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/006.yaml
  text: From daughter Zion all her splendor has departed[a]; her princes have become like deer that find no pasture[b]; they went without strength before the pursuer.
translation:
  language: fr
  text: Toute sa splendeur a quitté la fille de Sion[a]. Ses princes sont devenus pareils à des cerfs qui ne trouvent pas de pâturage[b] ; ils avançaient sans force devant celui qui les poursuivait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute sa majesté » ou « toute sa beauté est partie de la fille de Sion ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pareils à des daims qui n’ont trouvé aucun pâturage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מִן בַּת־צִיּוֹן
  choice: a quitté la fille de Sion
  rationale: Le verbe signifie littéralement « sortir ». Avec « toute sa splendeur » pour sujet, « a quitté » exprime naturellement en français la disparition de ce qui appartenait à Sion, tout en conservant l’image d’un départ.
- source_word: בַּת־צִיּוֹן
  choice: la fille de Sion
  rationale: Cette formulation traditionnelle et intelligible préserve la personnification poétique de Sion comme femme ou fille représentant la ville et sa population.
- source_word: כָּל הֲדָרָהּ
  choice: toute sa splendeur
  rationale: הָדָר peut évoquer la splendeur, la majesté ou la beauté. « Splendeur » convient au prestige et à l’éclat perdus de la ville sans introduire la charge théologique possible de « gloire ».
- source_word: שָׂרֶיהָ
  choice: ses princes
  rationale: שַׂר désigne des princes, chefs ou hauts responsables. « Princes » maintient le cadre royal et national ainsi que le registre poétique.
- source_word: כְּאַיָּלִים
  choice: pareils à des cerfs
  rationale: אַיָּל désigne vraisemblablement le cerf ou le daim mâle. « Cerfs » rend clairement l’image animale et s’accorde avec l’absence de pâturage.
- source_word: לֹא מָצְאוּ מִרְעֶה
  choice: qui ne trouvent pas de pâturage
  rationale: Le présent rend la comparaison descriptive avec naturel en français. מִרְעֶה désigne un pâturage ou lieu où paître.
- source_word: וַיֵּלְכוּ בְלֹא כֹחַ
  choice: ils ont marché sans force
  rationale: הלך signifie aller ou marcher, sans exprimer explicitement la fuite. « Marché » conserve le mouvement pénible et concret, tandis que « sans force » rend directement l’épuisement.
- source_word: לִפְנֵי רוֹדֵף
  choice: devant celui qui les poursuivait
  rationale: La tournure indique qu’ils avancent sous la pression de leur poursuivant. Le singulier hébreu est conservé par « celui », sans préciser davantage son identité.
