  to: Toute sa splendeur a quitté la fille de Sion[a]. Ses princes sont devenus pareils à des cerfs qui ne trouvent pas de pâturage[b] ; ils avançaient sans force devant celui qui les poursuivait.
  rationale: La révision remplace « ont marché » par « avançaient », qui rend plus largement le mouvement exprimé par הלך et s’insère naturellement dans la description poétique. La note a est ajustée pour une alternative française idiomatique, sans changer la possibilité lexicale de « sortir / partir ».
