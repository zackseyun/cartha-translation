source:
  edition: WLC
  text: נִשְׂקַד֩ עֹ֨ל פְּשָׁעַ֜/י בְּ/יָד֗/וֹ יִשְׂתָּֽרְג֛וּ עָל֥וּ עַל צַוָּארִ֖/י הִכְשִׁ֣יל כֹּחִ֑/י נְתָנַ֣/נִי אֲדֹנָ֔/י בִּ/ידֵ֖י לֹא אוּכַ֥ל קֽוּם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/014.yaml
  text: The yoke of my transgressions is bound by his hand[a]; they are woven together, they have come up upon my neck; he has made my strength fail[c][b]. The Lord has given me into hands from which I cannot rise.
translation:
  language: fr
  text: Le joug de mes révoltes a été attaché par sa main[a] ; elles se sont entrelacées[b], elles sont montées sur mon cou. Il a fait céder ma force. Le Seigneur m’a livrée entre des mains[c] dont je ne peux me relever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « est tenu sous surveillance ». Le verbe hébreu est rare et difficile ; le contexte du joug favorise le sens « attaché » ou « fixé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se sont enchevêtrées » ou « se sont tressées ensemble ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « dans des mains » et ne précise pas à qui elles appartiennent.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׂקַד
  choice: a été attaché
  rationale: Le verbe est rare et difficile. Dans le contexte du joug placé sur le cou, « attaché » exprime naturellement l’idée probable d’un joug fixé, tout en signalant l’autre analyse en note.
- source_word: עֹל
  choice: joug
  rationale: Ce terme conserve l’image centrale d’un fardeau oppressif et de la servitude.
- source_word: פְּשָׁעַי
  choice: mes révoltes
  rationale: פשע désigne souvent une rébellion contre une autorité légitime. « Révoltes » préserve ici cette portée morale et théologique, davantage que le terme plus général « fautes ».
- source_word: בְּיָדוֹ
  choice: par sa main
  rationale: Cette formulation conserve l’image hébraïque de la main et exprime l’agent de l’action sans préciser davantage son identité dans la première proposition.
- source_word: יִשְׂתָּרְגוּ
  choice: elles se sont entrelacées
  rationale: Ce verbe rare évoque vraisemblablement des éléments entrecroisés ou tressés. Le pronom féminin pluriel renvoie naturellement aux « révoltes » qui forment le joug.
- source_word: עָלוּ עַל צַוָּארִי
  choice: elles sont montées sur mon cou
  rationale: La traduction garde le mouvement et l’image physique du texte hébreu, sans remplacer explicitement les révoltes entrelacées par des courroies supposées.
- source_word: הִכְשִׁיל כֹּחִי
  choice: il a fait céder ma force
  rationale: La forme causative de כשל signifie littéralement faire trébucher ou défaillir. Avec « ma force » comme complément, « faire céder » rend l’effet de façon naturelle et vigoureuse.
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Rendu français courant et digne du titre divin אֲדֹנָי.
- source_word: בִּידֵי
  choice: entre des mains
  rationale: Le pluriel sans détermination précise laisse les oppresseurs indéfinis, comme dans l’hébreu.
- source_word: לֹא אוּכַל קוּם
  choice: je ne peux pas me relever
  rationale: קום évoque ici le fait de se relever ou de se rétablir après l’assujettissement, et non le seul geste physique de se mettre debout.
theological_decisions:
- issue: Référent des formes masculines singulières « sa » et « il »
  choice: Elles sont conservées comme renvoyant à Dieu, identifié ensuite comme « le Seigneur ».
  alternative: Comprendre la première forme de manière plus impersonnelle, ou rapporter une partie de l’action au joug lui-même.
  rationale: La dernière proposition nomme explicitement le Seigneur comme celui qui livre la locutrice. Le contexte attribue également l’affliction au jugement divin, mais la traduction ne nomme pas Dieu avant que le texte lui-même ne le fasse.
- issue: Nature des « mains » auxquelles la locutrice est livrée
  choice: Les mains et leurs détenteurs restent indéfinis.
  alternative: Expliciter « les mains de mes ennemis » ou « de mes oppresseurs ».
  rationale: L’hébreu ne désigne pas ici les détenteurs de ces mains. Ne pas les identifier préserve la sobriété et l’ouverture du texte.
translation_notes:
  register: Français international moderne, poétique mais accessible. La ponctuation distingue les images successives sans atténuer leur densité. Le féminin des pronoms suit « mes révoltes » et laisse subsister l’image audacieuse de fautes entrelacées formant un joug.
