revisions:
- from: Le Seigneur a rejeté tous mes vaillants au milieu de moi ; il a convoqué contre moi une assemblée[a] pour briser mes jeunes hommes. Le Seigneur a foulé au pressoir la jeune fille, fille de Juda[b].
  to: Le Seigneur a rejeté tous mes vaillants en mon sein ; il a convoqué contre moi une assemblée[a] pour briser mes jeunes hommes. Le Seigneur a foulé la vierge, fille de Juda, au pressoir[b].
  rationale: La révision conserve les choix contextuellement solides du projet pour le rejet des vaillants et l’assemblée convoquée, tout en rétablissant « vierge » pour בְּתוּלָה et en améliorant la fluidité de la personnification et de l’image du pressoir. La note sur מוֹעֵד maintient l’ambiguïté lexicale sans privilégier indûment une lecture.
