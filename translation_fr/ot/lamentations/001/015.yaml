source:
  edition: WLC
  text: סִלָּ֨ה כָל אַבִּירַ֤/י אֲדֹנָ/י֙ בְּ/קִרְבִּ֔/י קָרָ֥א עָלַ֛/י מוֹעֵ֖ד לִ/שְׁבֹּ֣ר בַּחוּרָ֑/י גַּ֚ת דָּרַ֣ךְ אֲדֹנָ֔/י לִ/בְתוּלַ֖ת בַּת יְהוּדָֽה־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/015.yaml
  text: The Lord has rejected all my mighty men in my midst[a]; he has summoned an appointed time against me to crush my young men[b]. The Lord has trodden the winepress for the virgin daughter of Judah.
translation:
  language: fr
  text: Le Seigneur a rejeté tous mes vaillants en mon sein ; il a convoqué contre moi une assemblée[a] pour briser mes jeunes hommes. Le Seigneur a foulé la vierge, fille de Juda, au pressoir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a fixé contre moi un temps déterminé ». Le mot hébreu peut désigner un temps fixé ou une assemblée convoquée.'
    reason: lexical_alternative
  - marker: b
    text: Le foulage au pressoir évoque ici la violence du jugement divin.
    reason: cultural_note
lexical_decisions:
- source_word: סִלָּה
  choice: a rejeté
  rationale: Le piel exprime ici la mise à l’écart ou le rejet décisif des défenseurs de Jérusalem ; « a rejeté » est clair et adapté au contexte de défaite.
- source_word: אַבִּירַי
  choice: tous mes vaillants
  rationale: Le terme désigne les hommes forts, probablement les guerriers. « Mes vaillants » garde la force martiale sans ajouter un titre social.
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי, et non du tétragramme ; « le Seigneur » le rend naturellement en français.
- source_word: בְּקִרְבִּי
  choice: au milieu de moi
  rationale: Cette formulation conserve la personnification de Jérusalem et le sens spatial et collectif de l’hébreu, bien qu’elle soit volontairement plus littérale que « en mon sein ».
- source_word: קָרָא עָלַי מוֹעֵד
  choice: il a convoqué contre moi une assemblée
  rationale: מוֹעֵד peut désigner soit un temps fixé, soit une réunion convoquée. Avec קָרָא, « convoquer une assemblée » est naturel et conserve l’ironie d’un rassemblement dirigé contre Jérusalem ; l’ambiguïté est signalée en note.
- source_word: לִשְׁבֹּר
  choice: pour briser
  rationale: « Briser » garde l’image verbale hébraïque et exprime la destruction violente sans l’atténuer.
- source_word: בַּחוּרַי
  choice: mes jeunes hommes
  rationale: Le mot désigne des hommes dans la force de l’âge, souvent aptes au combat ; « jeunes hommes » reste direct et non interprétatif.
- source_word: גַּת דָּרַךְ
  choice: a foulé au pressoir
  rationale: Cette tournure française maintient l’image concrète du foulage des raisins et sa valeur métaphorique de jugement.
- source_word: לִבְתוּלַת בַּת יְהוּדָה
  choice: la jeune fille, fille de Juda
  rationale: « Jeune fille » rend ici בְּתוּלָה dignement sans faire de l’état sexuel le point central, tandis que « fille de Juda » conserve la personnification collective. La construction française fait de cette figure ce qui est foulé au pressoir, conformément à l’image.
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי
  choice: Le Seigneur
  alternative: Seigneur
  rationale: L’article donne en français un titre divin naturel sans confondre אֲדֹנָי avec le nom propre YHWH.
- issue: Identité de celle qui est foulée au pressoir
  choice: la jeune fille, fille de Juda
  alternative: un pressoir pour la jeune fille, fille de Juda
  rationale: La syntaxe et l’image permettent de comprendre Juda personnifiée comme l’objet du foulage. Le français retenu rend cette métaphore sévère sans introduire un pressoir préparé « pour » elle comme objet distinct.
- issue: Sens de מוֹעֵד
  choice: une assemblée
  alternative: un temps fixé
  rationale: Le contexte verbal de convocation favorise « assemblée », mais la polysémie réelle demeure ; elle est donc explicitement conservée dans la note plutôt que résolue dogmatiquement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme poétique et la personnification de Jérusalem sont conservés. « Au milieu de moi » maintient délibérément l’étrangeté expressive de la ville qui parle ; « en mon sein » serait plus idiomatique, mais plus soutenu.
