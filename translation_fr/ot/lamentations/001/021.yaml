  text: שָׁמְע֞וּ כִּ֧י נֶאֱנָחָ֣ה אָ֗נִי אֵ֤ין מְנַחֵם֙ לִ֔/י כָּל אֹ֨יְבַ֜/י שָׁמְע֤וּ רָֽעָתִ/י֙ שָׂ֔שׂוּ כִּ֥י אַתָּ֖ה עָשִׂ֑יתָ הֵבֵ֥אתָ יוֹם קָרָ֖אתָ וְ/יִֽהְי֥וּ כָמֽוֹ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/021.yaml
  text: They have heard that I groan[a]; there is no one to comfort me. All my enemies have heard of my trouble; they rejoice that you have done it. You have brought the day you proclaimed[c][b]; let them become like me.
translation:
  language: fr
  text: Ils ont entendu mes gémissements ; personne ne me console. Tous mes ennemis ont entendu parler de mon malheur[a] ; ils se réjouissent de ce que c’est toi qui l’as fait. Tu as fait venir le jour que tu as proclamé[b] ; qu’ils deviennent comme moi ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ma calamité » ou « de ma détresse ». Le terme hébreu peut désigner un désastre ou une affliction.
    reason: lexical_alternative
  - marker: b
    text: Ou « le jour que tu as annoncé ».
    reason: lexical_alternative
  - marker: c
    text: Ou « et ils deviendront comme moi ». La forme hébraïque peut exprimer soit un souhait, soit un événement futur ; le souhait convient bien au contexte de cette lamentation.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ כִּי נֶאֱנָחָה אָנִי
  choice: Ils ont entendu que je gémis
  rationale: Le parfait de שׁמע exprime une audition accomplie, tandis que נֶאֱנָחָה décrit le gémissement actuel de la locutrice. « Gémir » rend la détresse plus fortement que « soupirer ».
- source_word: אֵין מְנַחֵם לִי
  choice: personne ne me console
  rationale: Cette formulation française naturelle conserve l’idée qu’il n’existe aucun consolateur pour la locutrice.
- source_word: רָעָתִי
  choice: mon malheur
  rationale: Dans ce contexte, רָעָה désigne la calamité ou l’affliction subie, non une faute morale. « Malheur » est à la fois courant et suffisamment fort.
- source_word: שָׂשׂוּ
  choice: ils se réjouissent
  rationale: Le verbe exprime une joie active devant le malheur de Sion ; « se réjouissent » en conserve la dureté morale.
- source_word: כִּי אַתָּה עָשִׂיתָ
  choice: de ce que c’est toi qui l’as fait
  rationale: La tournure souligne le pronom אַתָּה et maintient l’attribution explicite du désastre à Dieu, tandis que « l’ » garde l’objet implicite.
- source_word: הֵבֵאתָ יוֹם קָרָאתָ
  choice: Tu as fait venir le jour que tu avais proclamé
  rationale: Les deux formes sont des parfaits. « Faire venir le jour » rend l’expression causative, et « proclamer » convient à l’annonce publique d’un jour fixé.
- source_word: וְיִהְיוּ כָמוֹנִי
  choice: qu’ils deviennent comme moi !
  rationale: L’imparfait précédé de וְ se comprend naturellement ici comme un souhait imprécatoire. « Deviennent » restitue la valeur de היה.
theological_decisions:
- issue: L’action divine dans le malheur de Jérusalem
  choice: 'Le désastre est explicitement attribué à Dieu : « c’est toi qui l’as fait » et « Tu as fait venir le jour ».'
  alternative: Atténuer ou laisser indéterminée l’action divine.
  rationale: Le texte hébreu s’adresse directement à Dieu à la deuxième personne et lui attribue l’événement. La traduction conserve cette tension théologique.
- issue: Valeur de וְיִהְיוּ
  choice: 'Un souhait : « qu’ils deviennent comme moi ! »'
  alternative: 'Une affirmation future : « et ils deviendront comme moi ».'
  rationale: La morphologie permet une lecture au futur, mais le contexte de lamentation et d’appel au jugement favorise la valeur de souhait, sans exclure l’autre lecture, signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme bref et les reprises du texte hébreu sont conservés. La personnification de Jérusalem reste perceptible par la voix à la première personne, sans ajout explicatif.
