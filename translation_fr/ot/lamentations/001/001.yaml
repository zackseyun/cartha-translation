id: LAM.1.1
reference: Lamentations 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵיכָ֣ה יָשְׁבָ֣ה בָדָ֗ד הָ/עִיר֙ רַבָּ֣תִי עָ֔ם הָיְתָ֖ה כְּ/אַלְמָנָ֑ה רַּבָּ֣תִי בַ/גּוֹיִ֗ם שָׂרָ֨תִי֙ בַּ/מְּדִינ֔וֹת הָיְתָ֖ה לָ/מַֽס׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/001.yaml
  text: How she sits alone[a], the city once full of people! She has become like a widow, she who was great among the nations, a princess among the provinces; she has become subject to forced labor.
translation:
  language: fr
  text: Comme elle est assise solitaire, la ville autrefois si peuplée ! Elle est devenue pareille à une veuve. Elle qui était grande parmi les nations, princesse parmi les provinces, elle est soumise au travail forcé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soumise au tribut ». Le mot hébreu מַס peut désigner soit un tribut imposé par un conquérant, soit un travail forcé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Comme
  rationale: Introduit l’exclamation de lamentation et d’étonnement, sans en faire une question demandant une information.
- source_word: יָשְׁבָה בָדָד
  choice: elle est assise solitaire
  rationale: Le parfait décrit avec vivacité l’état présent de la ville; « assise solitaire » conserve l’image poétique de l’abandon.
- source_word: הָעִיר רַבָּתִי עָם
  choice: la ville autrefois si peuplée
  rationale: Rend naturellement l’abondance passée de population et son contraste avec la solitude actuelle, sans ajouter le nom de Jérusalem.
- source_word: הָיְתָה כְּאַלְמָנָה
  choice: elle est devenue pareille à une veuve
  rationale: « Est devenue » met en relief le renversement de condition, tandis que « pareille à » maintient explicitement la comparaison marquée par כְּ.
- source_word: רַבָּתִי בַגּוֹיִם
  choice: grande parmi les nations
  rationale: Conserve le langage de prestige et le parallélisme du texte hébreu.
- source_word: שָׂרָתִי בַּמְּדִינוֹת
  choice: princesse parmi les provinces
  rationale: « Princesse » rend directement le rang féminin élevé; « provinces » désigne les régions administratives.
- source_word: הָיְתָה לָמַס
  choice: elle est soumise au travail forcé
  rationale: מַס peut désigner une corvée imposée ou un tribut; le sens de travail obligatoire exprime bien ici le passage du rang princier à la sujétion.
theological_decisions: []
