source:
  edition: WLC
  text: רְאֵ֨ה יְהוָ֤ה כִּֽי צַר לִ/י֙ מֵעַ֣/י חֳמַרְמָ֔רוּ נֶהְפַּ֤ךְ לִבִּ/י֙ בְּ/קִרְבִּ֔/י כִּ֥י מָר֖וֹ מָרִ֑יתִי מִ/ח֥וּץ שִׁכְּלָה חֶ֖רֶב בַּ/בַּ֥יִת כַּ/מָּֽוֶת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/020.yaml
  text: Look[a], O Yahweh, for I am in distress; my inward parts are churning; my heart is overturned within me, because I have been very rebellious[b]. Outside the sword bereaves[c]; inside the house it is like death.
translation:
  language: fr
  text: Regarde, Yahweh, car je suis dans la détresse ! Mes entrailles sont en tumulte[a] ; mon cœur se retourne au-dedans de moi, car je me suis gravement révoltée[b]. Au-dehors, l’épée apporte le deuil[c] ; dans la maison, c’est comme la mort[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mes entrailles ». Dans la langue biblique, les entrailles représentent le siège des émotions profondes et expriment ici une violente angoisse intérieure.
    reason: cultural_note
  - marker: b
    text: Ou « car je me suis amèrement révoltée ». L’hébreu intensifie le verbe « se révolter » en le faisant précéder d’une forme de la même racine.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu peut signifier plus précisément : « l’épée prive d’enfants » ou « l’épée rend sans enfants ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou « dans la maison, la mort ». L’hébreu est très concis et elliptique, mais la préposition marque normalement une comparaison : « comme la mort ».'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה
  choice: Regarde
  rationale: L’impératif ouvre un appel direct adressé à Dieu. « Regarde » est naturel en français moderne et conserve la force de la supplication.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre ; la forme « Yahweh » en préserve la valeur personnelle.
- source_word: צַר לִי
  choice: je suis dans la détresse
  rationale: Cette formulation idiomatique exprime clairement l’affliction personnelle indiquée par l’adjectif et le pronom.
- source_word: מֵעַי חֳמַרְמָרוּ
  choice: Mes entrailles sont en tumulte
  rationale: La traduction conserve l’expression corporelle hébraïque de l’angoisse profonde tout en évitant une formulation anatomique maladroite ou ambiguë en français.
- source_word: נֶהְפַּךְ לִבִּי בְּקִרְבִּי
  choice: mon cœur se retourne au-dedans de moi
  rationale: Cette formulation maintient l’image concrète d’un bouleversement intérieur plutôt que de la réduire à la simple tristesse.
- source_word: כִּי מָרוֹ מָרִיתִי
  choice: car je me suis gravement révoltée
  rationale: L’adverbe « gravement » rend l’intensification produite en hébreu par l’infinitif absolu suivi du verbe de même racine. Le féminin correspond à la voix personnifiée de Jérusalem dans le poème.
- source_word: מִחוּץ שִׁכְּלָה חֶרֶב
  choice: Au-dehors, l’épée apporte le deuil
  rationale: Le verbe שׁכל évoque la privation d’enfants et, plus largement, le deuil causé par cette perte. Cette formulation reste compacte et ne précise pas explicitement un complément absent du texte.
- source_word: בַּבַּיִת כַּמָּוֶת
  choice: dans la maison, c’est comme la mort
  rationale: La traduction conserve à la fois l’opposition spatiale avec « au-dehors » et la comparaison marquée par כְּ, tout en explicitant sobrement la proposition elliptique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, nom personnel du Dieu d’Israël. Le conserver sous une forme translittérée évite de le remplacer silencieusement par un titre.
- issue: Genre de la voix qui confesse sa révolte
  choice: révoltée
  alternative: révolté
  rationale: Le locuteur poétique est Jérusalem personnifiée, appelée auparavant « fille de Sion » et présentée au féminin dans le chapitre. L’accord féminin rend cette personnification en français sans modifier le contenu de la confession.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre « au-dehors » et « dans la maison » est maintenu, de même que les images corporelles du texte hébreu. La ponctuation souligne la progression de la détresse intérieure vers la menace extérieure et domestique.
