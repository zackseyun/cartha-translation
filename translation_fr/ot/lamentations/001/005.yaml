id: LAM.1.5
reference: Lamentations 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָי֨וּ צָרֶ֤י/הָ לְ/רֹאשׁ֙ אֹיְבֶ֣י/הָ שָׁל֔וּ כִּֽי יְהוָ֥ה הוֹגָ֖/הּ עַ֣ל רֹב פְּשָׁעֶ֑י/הָ עוֹלָלֶ֛י/הָ הָלְכ֥וּ שְׁבִ֖י לִ/פְנֵי צָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/005.yaml
  text: Her foes have become the head[a]; her enemies prosper, because Yahweh has afflicted her for the multitude of her transgressions[b]. Her children have gone away into captivity before the foe.
translation:
  language: fr
  text: Ses adversaires ont pris le dessus ; ses ennemis vivent tranquilles[a], car Yahweh l’a accablée à cause de ses nombreuses révoltes. Ses tout-petits[b] ont été emmenés en captivité devant l’adversaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prospèrent » ou « vivent en sécurité ». Le verbe hébreu peut exprimer la tranquillité, la sécurité ou la prospérité.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses jeunes enfants » ou « ses nourrissons ». Le terme hébreu désigne de très jeunes enfants et souligne leur vulnérabilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֶיהָ
  choice: ses adversaires
  rationale: Le terme désigne ici ceux qui lui sont hostiles et fait écho à « l’adversaire » en fin de verset.
- source_word: לְרֹאשׁ
  choice: ont pris le dessus
  rationale: Littéralement « sont devenus la tête » ; l’expression marque leur position dominante. La formulation française transmet naturellement cette image d’ascendant.
- source_word: אֹיְבֶיהָ
  choice: ses ennemis
  rationale: Équivalent courant dans un contexte d’hostilité et de conquête.
- source_word: שָׁלוּ
  choice: vivent tranquilles
  rationale: Le verbe exprime l’aisance ou la sécurité, éventuellement la prospérité. « Vivent tranquilles » conserve cette gamme de sens sans limiter le propos à la réussite matérielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: הוֹגָהּ
  choice: l’a accablée
  rationale: La forme causative signifie provoquer peine ou affliction ; « accabler » rend avec naturel la force du verbe dans une lamentation.
- source_word: עַל רֹב פְּשָׁעֶיהָ
  choice: à cause de ses nombreuses révoltes
  rationale: רֹב exprime la multitude et פֶּשַׁע une transgression de caractère rebelle. Cette formulation garde à la fois l’abondance et la gravité de la faute.
- source_word: עוֹלָלֶיהָ
  choice: ses tout-petits
  rationale: Le terme vise de jeunes enfants et souligne leur vulnérabilité ; « tout-petits » est précis et naturel en français moderne.
- source_word: שְׁבִי
  choice: en captivité
  rationale: Le nom désigne l’état de captif ou la captivité ; l’expression s’intègre naturellement avec « sont partis ».
- source_word: לִפְנֵי צָר
  choice: devant l’adversaire
  rationale: La formulation garde l’image spatiale de captifs emmenés sous la domination de l’ennemi sans ajouter explicitement qu’ils sont poussés ou conduits.
theological_decisions:
- issue: Action divine dans la souffrance de Jérusalem
  choice: car Yahweh l’a accablée à cause de ses nombreuses révoltes
  alternative: car Yahweh lui a causé du chagrin en raison de ses nombreuses transgressions
  rationale: L’hébreu attribue explicitement l’affliction à Yahweh et la relie aux fautes de Jérusalem. La traduction conserve sans les atténuer l’action divine et la responsabilité humaine.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est préservé ; « ont pris le dessus » rend idiomatiquement la domination, tandis que « devant l’adversaire » conserve l’image sobre et ambiguë de l’hébreu.
