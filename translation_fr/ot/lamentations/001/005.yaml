    issue: « Ses tout-petits sont partis en captivité »
    rationale: Le verbe הלכו est actif en forme mais, avec « en captivité devant l’adversaire », décrit le départ des enfants sous le pouvoir ennemi. « Sont partis » peut suggérer un départ autonome ou volontaire. « Ont été emmenés en captivité » exprime ce sens contextuel sans surcharger le texte.
