  naturalness: Français moderne, clair et d’un registre convenable. « Ont pris le dessus » est naturel, mais explicite l’image « tête » de manière interprétative acceptable. « Ont été emmenés » est plus naturel et plus fidèle au dernier cola que « sont partis ».
  terminology: « Yahweh », « adversaires », « ennemis », « révoltes » et « captivité » conviennent. « Tout-petits » rend bien עוֹלָלֶיהָ; la note conserve utilement les possibilités « jeunes enfants » et « nourrissons ».
