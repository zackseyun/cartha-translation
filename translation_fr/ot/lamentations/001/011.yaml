source:
  edition: WLC
  text: כָּל עַמָּ֤/הּ נֶאֱנָחִים֙ מְבַקְּשִׁ֣ים לֶ֔חֶם נָתְנ֧וּ מחמודי/הם בְּ/אֹ֖כֶל לְ/הָשִׁ֣יב נָ֑פֶשׁ רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה כִּ֥י הָיִ֖יתִי זוֹלֵלָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/011.yaml
  text: All her people groan[a], seeking bread; they have given their precious things for food to restore life. Look, O Yahweh, and see[c][b], for I have become despised.
translation:
  language: fr
  text: Tous les siens gémissent en cherchant du pain. Ils ont donné leurs biens précieux[a] contre de la nourriture afin de reprendre des forces[b]. Regarde, Yahvé, et vois, car je suis devenue un objet de mépris[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs trésors », « les choses auxquelles ils tenaient ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « afin de restaurer la vie » ; l’expression signifie ici retrouver de la vigueur ou préserver leur vie.
    reason: lexical_alternative
  - marker: c
    text: Ou « car je suis devenue méprisable », « vile ». Le mot hébreu est rare et peut exprimer le mépris subi ou un état jugé avilissant.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָחִים
  choice: gémit
  rationale: Le verbe exprime les gémissements audibles d’un peuple accablé; le singulier s’accorde naturellement avec le collectif « tout son peuple ».
- source_word: מְבַקְּשִׁים לֶחֶם
  choice: en cherchant du pain
  rationale: Cette formulation conserve l’image concrète du pain tout en rendant naturellement la construction participiale hébraïque.
- source_word: מחמודיהם
  choice: leurs biens précieux
  rationale: Le terme désigne ce qui est désiré et précieux, notamment des possessions de valeur, sans se limiter à l’argent.
- source_word: בְּאֹכֶל
  choice: contre de la nourriture
  rationale: La préposition indique ici l’échange de biens précieux en retour de nourriture.
- source_word: לְהָשִׁיב נָפֶשׁ
  choice: afin de reprendre des forces
  rationale: Dans ce contexte de famine, נֶפֶשׁ renvoie à la vie ou à la personne; l’expression décrit le fait de se ranimer et de survivre, non une restauration de l’âme immatérielle.
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: Regarde ... et vois
  rationale: Les deux impératifs sont maintenus afin de préserver l’intensité et le parallélisme de l’appel adressé à Dieu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin YHWH et permet de le rendre comme un nom propre.
- source_word: זוֹלֵלָה
  choice: un objet de mépris
  rationale: Dans cette plainte, le mot rare décrit vraisemblablement Jérusalem comme méprisée ou tenue pour vile, plutôt qu’une gloutonnerie littérale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte rend explicitement le nom divin plutôt que de le remplacer par un titre, tout en employant sa forme française usuelle.
- issue: Sens de נֶפֶשׁ dans לְהָשִׁיב נָפֶשׁ
  choice: reprendre des forces
  alternative: ramener l’âme à la vie
  rationale: Le contexte immédiat de faim et d’achat de nourriture indique la restauration de la vitalité ou la préservation de la vie; il ne faut pas imposer ici une distinction doctrinale entre corps et âme.
- issue: Valeur de זוֹלֵלָה
  choice: un objet de mépris
  alternative: méprisable / vile
  rationale: Le contexte favorise l’humiliation sociale de la ville personnifiée, mais la formulation rare peut aussi qualifier son état comme vil ou méprisable; cette possibilité est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La personnification féminine de Jérusalem est conservée dans « je suis devenue ». Le passage du collectif singulier « tout son peuple » au pronom pluriel « ils » suit le sens distributif de l’hébreu et reste naturel en français.
