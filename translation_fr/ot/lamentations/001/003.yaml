  text: גָּֽלְתָ֨ה יְהוּדָ֤ה מֵ/עֹ֨נִי֙ וּ/מֵ/רֹ֣ב עֲבֹדָ֔ה הִ֚יא יָשְׁבָ֣ה בַ/גּוֹיִ֔ם לֹ֥א מָצְאָ֖ה מָנ֑וֹחַ כָּל רֹדְפֶ֥י/הָ הִשִּׂיג֖וּ/הָ בֵּ֥ין הַ/מְּצָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/003.yaml
  text: Judah has gone into exile because of affliction and because of great servitude; she dwells among the nations and finds no rest[a]. All her pursuers have overtaken her in the narrow places.
translation:
  language: fr
  text: Juda est partie en exil à cause de son affliction et de sa lourde servitude. Elle habite parmi les nations, elle ne trouve aucun repos. Tous ses poursuivants l’ont rattrapée dans les passages étroits[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les lieux étroits ». L’expression évoque des lieux resserrés où l’on se trouve pris au piège et peut aussi suggérer la détresse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְתָה
  choice: est partie en exil
  rationale: Le qal de גלה exprime ici le départ en exil. Cette formulation conserve le motif central de l’exil sans trancher en faveur d’un passif explicite.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Le nom désigne ici Juda, personnifiée au féminin, comme l’indiquent les formes féminines du texte hébreu.
- source_word: מֵעֹנִי
  choice: à cause de son affliction
  rationale: La préposition מִן est comprise dans un sens causal. « Affliction » garde la portée générale de עֹנִי, qui peut évoquer la misère, la détresse ou l’oppression.
- source_word: וּמֵרֹב עֲבֹדָה
  choice: et de sa lourde servitude
  rationale: עֲבֹדָה peut désigner le travail, le service ou la servitude. Dans ce contexte d’oppression et d’exil, « lourde servitude » exprime la contrainte sans préciser au-delà du texte la forme exacte de l’asservissement.
- source_word: הִיא יָשְׁבָה בַגּוֹיִם
  choice: Elle habite parmi les nations
  rationale: ישׁב signifie littéralement s’asseoir, mais couramment habiter ou demeurer. « Habite » rend naturellement la situation durable de Juda déplacée parmi des peuples étrangers.
- source_word: לֹא מָצְאָה מָנוֹחַ
  choice: elle ne trouve aucun repos
  rationale: מָנוֹחַ peut désigner le repos ou un lieu de repos. Cette formulation française conserve la portée physique et existentielle de l’expression.
- source_word: כָּל רֹדְפֶיהָ
  choice: Tous ceux qui la poursuivaient
  rationale: Le participe de רדף désigne ceux qui poursuivent Juda. La relative est plus naturelle en français que le substantif « poursuivants » et maintient l’image de la chasse.
- source_word: הִשִּׂיגוּהָ
  choice: l’ont rattrapée
  rationale: Le hiphil de נשׂג signifie atteindre ou rattraper. « Rattrapée » maintient directement l’image de poursuivants qui rejoignent leur proie.
- source_word: בֵּין הַמְּצָרִים
  choice: dans les passages étroits
  rationale: La locution évoque littéralement des espaces resserrés où Juda se trouve prise au piège. « Passages étroits » conserve l’image spatiale, tandis que la note signale la nuance possible de détresse.
