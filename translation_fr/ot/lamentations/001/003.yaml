  to: Juda est partie en exil à cause de son affliction et de sa lourde servitude. Elle habite parmi les nations, elle ne trouve aucun repos. Tous ses poursuivants l’ont rattrapée dans les passages étroits[a].
  rationale: La révision conserve le texte et son registre, tout en corrigeant l’alternative fautive de la note et en rendant le participe hébreu par un groupe nominal français plus précis. La note maintient l’ambiguïté entre l’image topographique et l’écho possible à la détresse.
