  variant: modern international French
source:
  edition: WLC
  text: צַדִּ֥יק ה֛וּא יְהוָ֖ה כִּ֣י פִ֣י/הוּ מָרִ֑יתִי שִׁמְעוּ נָ֣א כָל עמים וּ/רְאוּ֙ מַכְאֹבִ֔/י בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י הָלְכ֥וּ בַ/שֶּֽׁבִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/018.yaml
  text: 'Yahweh is righteous[a], for I have rebelled against his word. Hear, please, all peoples[b], and see my pain: my virgins and my young men have gone into captivity.'
translation:
  language: fr
  text: 'Yahweh est juste, car je me suis rebellée contre sa parole[a]. Écoutez, je vous prie, tous les peuples, et voyez ma douleur : mes jeunes filles[b] et mes jeunes hommes sont allés en captivité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa bouche », c’est-à-dire ce qu’il a dit ou ordonné.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mes vierges » ; on peut aussi traduire : « mes jeunes femmes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: juste
  rationale: Comme adjectif attribut de Yahweh, « juste » exprime en français courant sa droiture et le bien-fondé de son jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé comme nom propre plutôt que remplacé par le titre « le Seigneur ».
- source_word: פִיהוּ
  choice: sa parole
  rationale: Littéralement « sa bouche » ; la bouche désigne ici, par métonymie, ce que Yahweh a dit ou ordonné. « Sa parole » restitue naturellement cet idiome en français.
- source_word: מָרִיתִי
  choice: je me suis rebellée contre
  rationale: Le verbe exprime la rébellion ou le refus d’obéir à une autorité. Le féminin rend explicite en français que la locutrice est Jérusalem personnifiée.
- source_word: שִׁמְעוּ נָא
  choice: Écoutez, je vous prie
  rationale: Cette formulation garde l’impératif et la nuance de supplication portée par נָא.
- source_word: כָל עמים
  choice: vous tous, peuples
  rationale: עַמִּים désigne collectivement les peuples ; l’ajout de « vous » rend l’apostrophe naturelle sans en élargir le sens.
- source_word: מַכְאֹבִי
  choice: ma douleur
  rationale: Le terme désigne directement la douleur ou la souffrance et convient au registre de la lamentation.
- source_word: בְּתוּלֹתַי
  choice: mes jeunes filles
  rationale: Dans ce contexte collectif, « jeunes filles » est naturel en français moderne ; le sens plus littéral « vierges » est signalé en note.
- source_word: וּבַחוּרַי
  choice: mes jeunes hommes
  rationale: Le terme désigne ici les jeunes hommes, en parallèle avec les jeunes filles.
- source_word: הָלְכוּ בַשֶּׁבִי
  choice: sont allés en captivité
  rationale: Cette traduction conserve le verbe simple « aller » sans introduire dans le texte l’idée causative « ont été emmenés », tout en exprimant clairement l’exil.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin ; le conserver évite de le remplacer silencieusement par un titre.
- issue: Degré de littéralité de פִיהוּ
  choice: sa parole
  alternative: sa bouche
  rationale: « Sa bouche » reproduit la forme hébraïque, mais risque en français d’obscurcir la confession d’avoir désobéi à ce que Dieu a dit. Le texte principal traduit la métonymie, tandis que la note en préserve la formulation littérale.
- issue: Genre de la voix qui parle
  choice: je me suis rebellée
  alternative: je me suis rebellé
  rationale: La voix est celle de Jérusalem/Sion personnifiée, féminine dans le poème. L’accord féminin, nécessaire en français, rend cette donnée contextuelle sans ajouter un nouvel acteur.
translation_notes:
  register: Français international actuel, sobre et poétique. La supplication reste audible dans « je vous prie », tandis que les expressions idiomatiques sont rendues clairement sans effacer leurs formes littérales, conservées en notes.
