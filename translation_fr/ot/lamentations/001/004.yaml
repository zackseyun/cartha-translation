  terminology: « Sion », « prêtres », « jeunes filles » et « amertume » conviennent. La note sur בְּתוּלֹתֶיהָ maintient à juste titre « vierges » comme sens plus littéral, sans imposer cette lecture dans le texte. « Fête solennelle » est une désignation française appropriée du rassemblement/festival cultuel désigné par מוֹעֵד.
