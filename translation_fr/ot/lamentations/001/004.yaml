source:
  edition: WLC
  text: דַּרְכֵ֨י צִיּ֜וֹן אֲבֵל֗וֹת מִ/בְּלִי֙ בָּאֵ֣י מוֹעֵ֔ד כָּל שְׁעָרֶ֨י/הָ֙ שֽׁוֹמֵמִ֔ין כֹּהֲנֶ֖י/הָ נֶאֱנָחִ֑ים בְּתוּלֹתֶ֥י/הָ נּוּג֖וֹת וְ/הִ֥יא מַר לָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/004.yaml
  text: The roads of Zion mourn[a], because no one comes to the appointed feast; all her gates are desolate, her priests groan, her virgins grieve[b], and she herself is bitter.
translation:
  language: fr
  text: Les chemins de Sion sont en deuil, car nul ne vient à la fête solennelle[a]. Toutes ses portes sont désertes, ses prêtres gémissent, ses jeunes filles[b] sont accablées, et elle-même est dans l’amertume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rendez-vous fixé », « le temps fixé » ou « la fête fixée ». Le mot hébreu peut désigner un moment déterminé, une rencontre ou une fête religieuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses vierges »; on peut aussi traduire : « ses jeunes femmes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי צִיּוֹן
  choice: Les chemins de Sion
  rationale: Le pluriel de דֶּרֶךְ désigne ici les voies empruntées pour se rendre à Sion. « Chemins » évoque naturellement les routes de pèlerinage et convient au registre poétique.
- source_word: אֲבֵלוֹת
  choice: sont en deuil
  rationale: La forme féminine plurielle personnifie les chemins comme portant le deuil; cette expression française conserve clairement cette image.
- source_word: מִבְּלִי בָּאֵי מוֹעֵד
  choice: car personne ne vient à la fête fixée
  rationale: מִבְּלִי exprime l’absence, בָּאֵי ceux qui viennent, et מוֹעֵד peut désigner un temps fixé, une rencontre ou une fête. Le contexte cultuel de Sion favorise ici le sens de fête religieuse, sans effacer les autres possibilités.
- source_word: כָּל שְׁעָרֶיהָ שׁוֹמֵמִין
  choice: Toutes ses portes sont dévastées
  rationale: שׁוֹמֵמִין évoque à la fois la désolation et l’abandon consécutifs à la ruine. « Dévastées » restitue avec force le cadre de la lamentation.
- source_word: כֹּהֲנֶיהָ נֶאֱנָחִים
  choice: ses prêtres gémissent
  rationale: Le participe נֶאֱנָחִים décrit des soupirs ou gémissements de détresse; « gémissent » est naturel et suffisamment intense.
- source_word: בְּתוּלֹתֶיהָ
  choice: ses jeunes filles
  rationale: בְּתוּלָה peut désigner une vierge ou, plus largement dans l’usage poétique, une jeune fille. « Jeunes filles » est naturel en français moderne, tandis que le sens plus littéral est signalé en note.
- source_word: נּוּגוֹת
  choice: sont accablées de tristesse
  rationale: Le terme exprime un état d’affliction ou de chagrin. Cette formulation conserve l’intensité et évite l’ambiguïté française de « affligées », qui peut suggérer qu’elles infligent une peine.
- source_word: וְהִיא מַר לָהּ
  choice: et elle-même est dans l’amertume
  rationale: « Elle-même » rend l’emphase du pronom וְהִיא et maintient la personnification féminine de Sion. « Est dans l’amertume » rend l’état de détresse amère exprimé par l’idiome מַר לָהּ.
theological_decisions:
- issue: Personnification féminine de Sion/Jérusalem
  choice: Employer les formes féminines « ses » et « elle-même » pour présenter Sion comme une femme en deuil.
  alternative: Traiter la ville de façon moins personnifiée et rendre le pronom par une tournure impersonnelle.
  rationale: Les suffixes et le pronom hébreux sont féminins, et cette personnification structure la poésie de Lamentations 1. La conserver respecte la rhétorique du texte sans lui ajouter d’interprétation doctrinale.
- issue: Portée cultuelle de מוֹעֵד
  choice: Traduire dans le corps du texte par « fête fixée ».
  alternative: « temps fixé » ou « assemblée fixée ».
  rationale: Le contexte des chemins de Sion autrefois fréquentés par ceux qui venaient au culte favorise la fête religieuse, mais la note conserve la polysémie réelle du terme.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme suit les membres parallèles de l’hébreu, conserve la personnification de Sion et privilégie des formulations compréhensibles sans banaliser la lamentation.
