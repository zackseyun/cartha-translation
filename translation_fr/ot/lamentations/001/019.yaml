base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/019.yaml
  text: I called to my lovers[a]; they deceived me[b]. My priests and my elders perished in the city while they sought food for themselves to restore their lives.
translation:
  language: fr
  text: J’ai appelé mes amants[a] ; eux, ils m’ont trompée. Mes prêtres et mes anciens ont péri dans la ville, tandis qu’ils cherchaient de quoi manger pour se maintenir en vie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « mes amants » désigne probablement, de manière imagée, les alliés politiques de Jérusalem ou d’autres appuis auxquels elle avait accordé sa confiance.
    reason: cultural_note
  - marker: b
    text: 'Ou : « car ils cherchaient de quoi manger pour se maintenir en vie ». Le mot hébreu traduit par « tandis que » peut aussi introduire ici une explication ou une cause.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָאתִי
  choice: J’ai appelé
  rationale: Le qal accompli à la première personne exprime un appel adressé à ceux dont Jérusalem attendait du secours, sans ajouter l’intensité de « crier ».
- source_word: לַמְאַהֲבַי
  choice: mes amants
  rationale: Le terme signifie littéralement « ceux qui m’aiment / mes amants ». « Mes amants » conserve la métaphore relationnelle, probablement appliquée aux alliés politiques de Jérusalem.
- source_word: הֵמָּה רִמּוּנִי
  choice: eux, ils m’ont trompée
  rationale: Le piel de רמה désigne la tromperie. Le pronom indépendant הֵמָּה reçoit une légère mise en relief par « eux » ; le féminin de « trompée » correspond à Jérusalem personnifiée.
- source_word: כֹּהֲנַי וּזְקֵנַי
  choice: mes prêtres et mes anciens
  rationale: « Prêtres » est direct ; « anciens » désigne ici les responsables de la communauté plutôt que simplement des hommes âgés.
- source_word: בָּעִיר גָּוָעוּ
  choice: ont expiré dans la ville
  rationale: גוע évoque le fait de rendre le dernier souffle. « Ont expiré » conserve la nuance poétique et funèbre du verbe.
- source_word: כִּי בִקְשׁוּ אֹכֶל לָמוֹ
  choice: alors qu’ils cherchaient de la nourriture
  rationale: כִּי peut être causal ou explicatif ; dans ce contexte, la proposition décrit naturellement les circonstances de leur mort. La finalité personnelle est déjà rendue par la proposition suivante.
- source_word: וְיָשִׁיבוּ אֶת נַפְשָׁם
  choice: pour reprendre vie
  rationale: Littéralement, il s’agit de « faire revenir leur נפש ». Ici נפש désigne la vie ou la personne vivante, et l’expression française « reprendre vie » rend naturellement le but recherché sans introduire l’idée d’une âme immatérielle.
theological_decisions:
- issue: Identification des « amants »
  choice: Conserver la métaphore dans le texte et signaler son référent probable en note
  alternative: Traduire directement par « alliés »
  rationale: Le texte hébreu personnifie Jérusalem et emploie un langage amoureux chargé d’ironie. Le réduire à « alliés » supprimerait une image importante, tandis que la note évite d’imposer une identification absolue.
- issue: Relation exprimée par כִּי
  choice: Rendre le sens circonstanciel par « alors que » et noter l’alternative causale
  alternative: « car ils cherchaient »
  rationale: Les deux relations sont possibles. Le texte principal reste idiomatique en français, et la note préserve l’ambiguïté syntaxique sans résoudre artificiellement la tension.
translation_notes:
  register: Français international actuel, digne et poétique. La personnification féminine de Jérusalem est maintenue par « trompée ». « Amants » conserve l’image audacieuse de l’hébreu, tandis que « reprendre vie » rend l’idiome de נפש de façon claire pour un lectorat moderne.
