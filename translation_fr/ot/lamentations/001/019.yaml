  rationale: La révision remplace une expression française susceptible d’ajouter l’idée d’un retour d’entre les morts par une formulation qui correspond au contexte de pénurie et à l’idiome hébreu relatif à la préservation de la vie. Elle améliore aussi la naturalité de « ont expiré » sans modifier le sens ni résoudre autrement l’ambiguïté de כִּי, qui reste signalée en note.
