base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/010.yaml
  text: The enemy has stretched out his hand over all her precious things[c][b][a], for she has seen nations enter her sanctuary—those whom you commanded not to enter your assembly.
translation:
  language: fr
  text: L’ennemi a étendu la main sur tout ce qu’elle avait de précieux[a]. Car elle a vu des peuples[b] entrer dans son sanctuaire, ceux à qui tu avais ordonné de ne pas entrer dans son assemblée[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur tous ses trésors » ou « sur tout ce qu’elle désirait ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des nations ». Le terme désigne ici des peuples étrangers; certaines traductions traditionnelles ont « des païens ».
    reason: lexical_alternative
  - marker: c
    text: Voir Deutéronome 23, où certains peuples sont exclus de l’assemblée du SEIGNEUR.
    reason: cross_reference
  - marker: d
    text: 'Le verbe « tu avais ordonné » correspond à une adresse masculine à Dieu dans le texte hébreu. Le possessif final est toutefois féminin et renvoie vraisemblablement à Jérusalem personnifiée : littéralement, « dans son assemblée ».'
    reason: textual_theological_ambiguity
lexical_decisions:
- source_word: יָדוֹ ... פָּרַשׂ
  choice: a étendu la main
  rationale: Cette formulation conserve l’image hébraïque d’un geste hostile visant à saisir ou à s’emparer.
- source_word: צָר
  choice: l’ennemi
  rationale: Dans le contexte de la dévastation de Jérusalem, le terme désigne clairement un adversaire oppresseur.
- source_word: כָּל מַחֲמַדֶּיהָ
  choice: tout ce qu’elle avait de précieux
  rationale: Le mot englobe ce qui est précieux, désirable ou estimé, sans le limiter à des richesses monétaires.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication de la plainte précédente et convient au registre poétique.
- source_word: רָאֲתָה
  choice: elle a vu
  rationale: Le passé composé rend naturellement l’accompli hébreu tout en maintenant la vivacité de la lamentation.
- source_word: גֹּויִם
  choice: des peuples
  rationale: Le terme désigne les peuples ou nations étrangers. « Peuples » est naturel en français et évite les connotations religieuses plus tardives de « païens ».
- source_word: בָּאוּ מִקְדָּשָׁהּ
  choice: entrer dans son sanctuaire
  rationale: Cette traduction exprime directement l’intrusion profanatrice dans le lieu sacré associé à Jérusalem.
- source_word: אֲשֶׁר צִוִּיתָה לֹא יָבֹאוּ
  choice: ceux à qui tu avais ordonné de ne pas entrer
  rationale: La tournure française rend explicitement la proposition relative et conserve l’idée d’un ordre antérieur interdisant l’entrée.
- source_word: בַקָּהָל לָךְ
  choice: dans ton assemblée
  rationale: « Assemblée » garde la portée communautaire et cultuelle de קָהָל sans employer un terme spécifiquement ecclésial.
theological_decisions:
- issue: Référent de l’adresse à la deuxième personne
  choice: Le texte français conserve l’adresse directe « tu/ton », généralement comprise comme adressée à Dieu dans le mouvement de la lamentation.
  alternative: La forme féminine du pronom hébreu final peut faire entendre une adresse à Jérusalem personnifiée.
  rationale: Le contexte et l’idée d’un commandement d’exclusion favorisent une adresse à Dieu, mais la forme grammaticale finale crée une tension réelle. Le français conserve l’adresse sans nommer explicitement son destinataire, et une note signale l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique et l’image concrète de la main étendue sont conservées. Les formulations évitent aussi bien l’archaïsme que le vocabulaire propre à une tradition confessionnelle.
