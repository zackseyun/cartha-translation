source:
  edition: WLC
  text: ל֣וֹא אֲלֵי/כֶם֮ כָּל עֹ֣בְרֵי דֶרֶךְ֒ הַבִּ֣יטוּ וּ/רְא֗וּ אִם יֵ֤שׁ מַכְאוֹב֙ כְּ/מַכְאֹבִ֔/י אֲשֶׁ֥ר עוֹלַ֖ל לִ֑/י אֲשֶׁר֙ הוֹגָ֣ה יְהוָ֔ה בְּ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/012.yaml
  text: Is it nothing to you[a], all you who pass by on the road? Look and see whether there is any sorrow like my sorrow, which was dealt to me[b], with which Yahweh afflicted me in the day of his fierce anger.
translation:
  language: fr
  text: Cela ne vous fait-il rien[a], à vous tous qui passez sur la route ? Regardez et voyez s’il existe une douleur pareille à ma douleur, celle qui m’a été infligée[b], celle dont Yahweh m’a accablée au jour de son ardente colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cela ne vous concerne-t-il pas, vous tous qui passez ? » L’ouverture hébraïque est elliptique, littéralement : « pas à vous » ; elle peut être comprise comme un appel à l’attention ou à la compassion.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celle qui m’a été imposée ». Le verbe hébreu évoque ici le traitement sévère subi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֣וֹא אֲלֵיכֶם
  choice: Cela ne vous fait-il rien
  rationale: L’hébreu est elliptique, littéralement « pas à vous ». Cette formulation française conserve l’appel indigné adressé aux passants sans combler excessivement l’ellipse.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: à vous tous qui passez sur le chemin
  rationale: La traduction garde l’adresse directe, le participe et l’image concrète du chemin.
- source_word: הַבִּיטוּ וּרְאוּ
  choice: Regardez et voyez
  rationale: Les deux impératifs sont conservés afin de rendre l’insistance de l’appel.
- source_word: אִם יֵשׁ
  choice: s’il existe
  rationale: Après les impératifs, אִם introduit ici une interrogation indirecte comparative.
- source_word: מַכְאוֹב ... כְּמַכְאֹבִי
  choice: une douleur pareille à ma douleur
  rationale: « Douleur » couvre naturellement la souffrance physique et morale de מַכְאוֹב et permet de conserver la répétition hébraïque.
- source_word: אֲשֶׁר עוֹלַל לִי
  choice: celle qui m’a été infligée
  rationale: Le passif exprime le traitement sévère subi tout en évitant de préciser prématurément le sujet, nommé dans la proposition suivante.
- source_word: אֲשֶׁר הוֹגָה
  choice: celle dont ... m’a accablée
  rationale: Le hiphil de יגה signifie causer de la peine ou affliger. « Accabler » convient au registre de la lamentation et la forme féminine renvoie à la ville personnifiée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּיוֹם חֲרוֹן אַפּוֹ
  choice: au jour de son ardente colère
  rationale: « Ardente colère » rend l’intensité de l’expression idiomatique חֲרוֹן אַף tout en restant naturelle en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- issue: Genre de la voix qui se lamente
  choice: accablée
  alternative: accablé
  rationale: Le contexte de Lamentations 1 présente Jérusalem, personnifiée comme une femme, prenant la parole. L’accord féminin le signale naturellement en français sans changer l’identité poétique du locuteur.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « douleur » et le double impératif sont maintenus pour préserver la force poétique. Le féminin « accablée » correspond à Jérusalem personnifiée dans le contexte.
