  text: פֵּֽרְשָׂ֨ה צִיּ֜וֹן בְּ/יָדֶ֗י/הָ אֵ֤ין מְנַחֵם֙ לָ֔/הּ צִוָּ֧ה יְהוָ֛ה לְ/יַעֲקֹ֖ב סְבִיבָ֣י/ו צָרָ֑י/ו הָיְתָ֧ה יְרוּשָׁלִַ֛ם לְ/נִדָּ֖ה בֵּינֵי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/017.yaml
  text: Zion has spread out her hands; there is no one to comfort her[a]. Yahweh has commanded concerning Jacob that his enemies surround him; Jerusalem has become an unclean thing among them.
translation:
  language: fr
  text: 'Sion a étendu les mains ; personne ne la console. Yahweh a donné cet ordre au sujet de Jacob : que ses ennemis l’encerclent. Jérusalem est devenue parmi eux une chose impure[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « comme une femme pendant ses règles » ou « comme une impureté menstruelle » ; le terme hébreu évoque l’impureté rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרְשָׂה צִיּוֹן בְּיָדֶיהָ
  choice: Sion étend les mains
  rationale: Le qal de פרשׂ exprime ici le déploiement ou l’extension des mains. Le présent français rend naturellement la scène poétique sans préciser indûment s’il s’agit d’une prière, d’un appel ou d’un geste de détresse.
- source_word: אֵין מְנַחֵם לָהּ
  choice: mais personne ne la console
  rationale: Cette formulation naturelle conserve la construction existentielle et le motif central de la consolation dans les Lamentations. « Mais » explicite sobrement le contraste déjà marqué par la juxtaposition.
- source_word: צִוָּה יְהוָה לְיַעֲקֹב
  choice: Yahweh a donné ordre au sujet de Jacob
  rationale: « Donner ordre » conserve la force de צוה. « Au sujet de » respecte l’ouverture sémantique de לְ, sans décider silencieusement entre une nuance simplement référentielle et une nuance défavorable.
- source_word: סְבִיבָיו צָרָיו
  choice: que ses ennemis l’encerclent
  rationale: L’hébreu juxtapose « autour de lui » et « ses adversaires ». La proposition française exprime naturellement le contenu de l’ordre et l’encerclement hostile.
- source_word: הָיְתָה יְרוּשָׁלִַם לְנִדָּה
  choice: Jérusalem est devenue … une chose impure
  rationale: « Est devenue » exprime l’entrée dans un état. נִדָּה évoque une impureté rituelle, notamment menstruelle, ainsi que la répulsion qui en résulte; le texte principal reste accessible et la note en précise l’image.
- source_word: בֵּינֵיהֶם
  choice: parmi eux
  rationale: Équivalent français idiomatique indiquant la condition de Jérusalem au milieu de ses ennemis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Degré de précision de l’image נִדָּה
  choice: une chose impure, avec note
  alternative: une femme pendant ses règles
  rationale: Le terme peut évoquer précisément l’impureté menstruelle, mais il qualifie ici métaphoriquement Jérusalem. Le rendu principal transmet son état d’impureté et de rejet sans éliminer, grâce à la note, l’arrière-plan rituel et corporel.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe demeure claire pour un lectorat général, tout en gardant l’ambiguïté de la préposition devant « Jacob » et la force rituelle de נִדָּה dans une note.
