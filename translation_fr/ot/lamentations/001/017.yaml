  source_fidelity: 'Le sens global est fidèlement rendu : le geste de Sion, l’absence de consolation, l’ordre de Yahweh concernant Jacob, l’encerclement par les ennemis et l’état d’impureté de Jérusalem sont tous conservés. Le parfait hébreu פֵּרְשָׂה est mieux reflété par un passé composé. La préposition לְ devant « Jacob » demeure syntaxiquement et sémantiquement délicate; « au sujet de Jacob » préserve prudemment cette ouverture. La formulation révisée évite d’ajouter une opposition explicite non marquée par le texte.'
  naturalness: « Sion a étendu les mains » et « Yahweh a donné cet ordre au sujet de Jacob » sont naturels dans un registre biblique moderne. L’ajout de « cet » rend la construction française « donner ordre » idiomatique. La phrase reste poétique, claire et accessible.
  terminology: « Yahweh » respecte le tétragramme. « Console » maintient le motif important de la consolation. « Une chose impure », accompagnée de la note, rend l’image rituelle et répulsive de נִדָּה sans imposer dans le texte courant une interprétation exclusivement menstruelle.
