  text: בָּכ֨וֹ תִבְכֶּ֜ה בַּ/לַּ֗יְלָה וְ/דִמְעָתָ/הּ֙ עַ֣ל לֶֽחֱיָ֔/הּ אֵֽין לָ֥/הּ מְנַחֵ֖ם מִ/כָּל אֹהֲבֶ֑י/הָ כָּל רֵעֶ֨י/הָ֙ בָּ֣גְדוּ בָ֔/הּ הָ֥יוּ לָ֖/הּ לְ/אֹיְבִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/002.yaml
  text: She weeps bitterly in the night[a], with her tears on her cheeks; among all her lovers she has no comforter. All her companions have dealt treacherously with her[b]; they have become her enemies.
translation:
  language: fr
  text: 'Elle pleure, elle pleure pendant la nuit,

    et ses larmes coulent sur ses joues.

    Parmi tous ses amants[a],

    personne ne la console.

    Tous ses proches[b] l’ont trahie ;

    ils sont devenus ses ennemis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alliés ». Le mot hébreu traduit par « amants » maintient la personnification de la ville comme une femme et peut aussi désigner ses partenaires politiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « amis », « compagnons » ou « alliés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּכוֹ תִבְכֶּה
  choice: Elle pleure, elle pleure
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’action. La répétition reproduit naturellement en français l’insistance et la continuité des pleurs sans préciser indûment leur qualité.
- source_word: בַּלַּיְלָה
  choice: pendant la nuit
  rationale: Cette expression temporelle conserve l’idée de pleurs nocturnes et convient au rythme poétique.
- source_word: וְדִמְעָתָהּ עַל לֶחֱיָהּ
  choice: et ses larmes coulent sur ses joues
  rationale: L’hébreu dit littéralement que sa larme est sur sa joue. Le pluriel collectif et le verbe « coulent » rendent l’image de façon naturelle en français, sans en changer le sens.
- source_word: אֵין לָהּ מְנַחֵם
  choice: personne ne la console
  rationale: La construction existentielle nie la présence de quiconque exerce l’action de consoler. Cette formulation est claire et idiomatique.
- source_word: מִכָּל אֹהֲבֶיהָ
  choice: Parmi tous ses amants
  rationale: « Amants » maintient la personnification féminine de la ville ainsi que la possible connotation de partenaires politiques ou de relations infidèles.
- source_word: כָּל רֵעֶיהָ
  choice: Tous ses proches
  rationale: רֵעַ peut désigner un ami, un compagnon ou un associé. « Proches » reste relationnel et assez large pour ne pas réduire le terme à une catégorie exclusivement personnelle ou politique.
- source_word: בָּגְדוּ בָהּ
  choice: l’ont trahie
  rationale: Le verbe exprime la déloyauté et la perfidie. « Trahir » en donne ici une traduction française directe, forte et naturelle.
- source_word: הָיוּ לָהּ לְאֹיְבִים
  choice: ils sont devenus ses ennemis
  rationale: 'La construction marque le nouvel état de la relation : ceux qui lui étaient proches sont désormais ses ennemis.'
theological_decisions:
- issue: La représentation métaphorique de Jérusalem comme une femme ayant des « amants »
  choice: Conserver « amants » dans le texte
  alternative: alliés ; ceux qui l’aimaient
  rationale: Le contexte personnifie la ville en femme, et le mot peut évoquer à la fois des relations intimes infidèles et des partenaires politiques. « Alliés » résoudrait prématurément cette tension métaphorique.
- issue: Portée relationnelle ou politique de רֵעֶיהָ
  choice: Employer « proches » et signaler les autres possibilités en note
  alternative: amis ; compagnons ; alliés
  rationale: Le terme hébreu demeure assez large. La traduction et la note préservent cette ouverture sans imposer une lecture exclusivement politique.
translation_notes:
  register: Français moderne, international et digne, avec une disposition poétique. La répétition initiale rend l’intensification hébraïque. Les termes « amants » et « proches » préservent respectivement la métaphore et l’ambiguïté relationnelle du texte source.
