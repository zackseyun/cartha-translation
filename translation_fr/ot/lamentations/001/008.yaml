  text: חֵ֤טְא חָֽטְאָה֙ יְר֣וּשָׁלִַ֔ם עַל כֵּ֖ן לְ/נִידָ֣ה הָיָ֑תָה כָּֽל מְכַבְּדֶ֤י/הָ הִזִּיל֨וּ/הָ֙ כִּי רָא֣וּ עֶרְוָתָ֔/הּ גַּם הִ֥יא נֶאֶנְחָ֖ה וַ/תָּ֥שָׁב אָחֽוֹר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/008.yaml
  text: Jerusalem has sinned grievously[a]; therefore she has become unclean. All who honored her despise her, because they have seen her nakedness[c][b]. She herself also groans and turns backward.
translation:
  language: fr
  text: Jérusalem a gravement péché ; c’est pourquoi elle est devenue impure.[a] Tous ceux qui l’honoraient la méprisent, car ils ont vu sa nudité. Elle aussi gémit et se détourne.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle est devenue comme une femme pendant ses règles » ou « elle est devenue une souillure » ; le terme hébreu évoque l’impureté rituelle et la mise à l’écart.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « retourne en arrière » ou « se tourne en arrière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵטְא חָטְאָה
  choice: a gravement péché
  rationale: L’infinitif absolu joint au verbe conjugué intensifie l’idée verbale. Cette formulation française naturelle exprime à la fois le péché et sa gravité.
- source_word: לְנִידָה
  choice: est devenue impure
  rationale: נִידָה peut désigner l’impureté menstruelle, une condition d’impureté ou ce qui est tenu à l’écart. « Impure » conserve ici la portée rituelle et sociale sans alourdir le texte.
- source_word: מְכַבְּדֶיהָ
  choice: ceux qui l’honoraient
  rationale: Le participe de כבד désigne ceux qui accordaient honneur et considération à Jérusalem ; l’imparfait français marque naturellement leur attitude antérieure.
- source_word: הִזִּילוּהָ
  choice: la méprisent
  rationale: La forme exprime le fait de traiter quelqu’un comme vil ou sans valeur. « Méprisent » rend clairement le renversement entre l’honneur passé et le dédain présent.
- source_word: עֶרְוָתָהּ
  choice: sa nudité
  rationale: Le terme désigne littéralement la nudité, avec une forte connotation de honte et d’exposition publique. La traduction directe préserve la métaphore.
- source_word: נֶאֶנְחָה
  choice: gémit
  rationale: Le verbe évoque une manifestation audible de détresse ; « gémit » convient au registre poétique et douloureux des Lamentations.
- source_word: גַּם הִיא
  choice: elle-même
  rationale: Le pronom explicite הִיא met Jérusalem en relief, tandis que גַּם la rattache au mouvement du contexte. « Elle-même » restitue cette insistance avec naturel en français.
- source_word: וַתָּשָׁב אָחוֹר
  choice: se détourne
  rationale: L’expression signifie littéralement revenir ou se tourner en arrière. Dans le contexte de honte et d’exposition, « se détourne » exprime naturellement le mouvement de recul sans en préciser indûment la cause.
theological_decisions:
- issue: Métaphore de l’impureté dans le jugement de Jérusalem
  choice: Rendre לְנִידָה par « est devenue impure » dans le texte principal
  alternative: « est devenue comme une femme pendant ses règles » ou « est devenue une souillure »
  rationale: L’image associe l’impureté à la honte et à la mise à l’écart de Jérusalem. La traduction principale conserve cette portée rituelle et sociale, tandis que la note rend accessible l’image hébraïque plus concrète.
- issue: Exposition de la nudité comme image d’humiliation
  choice: Conserver « sa nudité »
  alternative: « sa honte » ou « ses parties intimes »
  rationale: Le texte évoque à la fois une exposition corporelle et l’humiliation qui en résulte. Le terme littéral préserve cette tension sans réduire l’image à sa seule signification abstraite.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsmes. Les phrases restent claires pour un large lectorat, tout en conservant les images fortes d’impureté, de nudité et de recul présentes dans l’hébreu.
