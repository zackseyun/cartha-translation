- from: D’en haut, il a envoyé un feu dans mes os, et ce feu m’a maîtrisée[a]. Il a tendu un filet sous mes pieds, il m’a fait reculer. Il m’a réduite à la désolation, languissante tout le jour[b].
  to: D’en haut, il a envoyé un feu dans mes os et m’a dominée[a]. Il a tendu un filet sous mes pieds, il m’a fait reculer. Il m’a réduite à la désolation, languissante tout le jour[b].
  rationale: La révision corrige l’incompatibilité entre le sujet féminin explicite « ce feu » et la forme verbale masculine singulière du texte massorétique. Elle maintient l’ambiguïté réelle de la proposition dans une note, sans imposer la lecture du feu comme sujet ni une lecture alternative du verbe. Les autres retouches sont limitées à la précision grammaticale des notes.
