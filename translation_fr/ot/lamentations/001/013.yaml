source:
  edition: WLC
  text: מִ/מָּר֛וֹם שָֽׁלַח אֵ֥שׁ בְּ/עַצְמֹתַ֖/י וַ/יִּרְדֶּ֑/נָּה פָּרַ֨שׂ רֶ֤שֶׁת לְ/רַגְלַ/י֙ הֱשִׁיבַ֣/נִי אָח֔וֹר נְתָנַ֨/נִי֙ שֹֽׁמֵמָ֔ה כָּל הַ/יּ֖וֹם דָּוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/013.yaml
  text: From on high he sent fire into my bones[a], and it prevailed against them; he spread a net for my feet; he turned me back; he made me desolate[b], faint all day long.
translation:
  language: fr
  text: D’en haut, il a envoyé un feu dans mes os et m’a dominée[a]. Il a tendu un filet sous mes pieds, il m’a fait reculer. Il m’a réduite à la désolation, languissante tout le jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu est difficile. Selon la vocalisation massorétique, le verbe peut se comprendre : « et il m’a dominée », avec un sujet masculin implicite et un suffixe féminin renvoyant à la locutrice personnifiée. D’autres comprennent que le feu a dominé les os (« et il les a maîtrisés »). Certaines traductions suivent aussi une autre analyse du verbe : « il l’a fait descendre jusque dans mes os ».'
    reason: ambiguïté grammaticale et lexicale
  - marker: b
    text: Ou « malade tout le jour », « faible tout le jour » ou « dépérissante tout le jour ».
    reason: alternative lexicale
lexical_decisions:
- source_word: מִמָּרוֹם
  choice: D’en haut
  rationale: מָרוֹם désigne la hauteur ou un lieu élevé. « D’en haut » conserve cette image sans préciser « du ciel », précision absente du verset.
- source_word: שָׁלַח אֵשׁ בְּעַצְמֹתַי
  choice: il a envoyé un feu dans mes os
  rationale: Cette formulation garde l’image vive du feu envoyé jusque dans les os et rend naturellement la valeur pénétrante possible de la préposition בְּ.
- source_word: וַיִּרְדֶּנָּה
  choice: et ce feu m’a maîtrisée
  rationale: La forme massorétique relève naturellement de רדה, « dominer, soumettre, maîtriser ». Le suffixe féminin singulier peut renvoyer à la locutrice personnifiée; la reprise « ce feu » explicite en français le sujet le plus vraisemblable de la proposition tout en signalant l’ambiguïté dans la note.
- source_word: פָּרַשׂ רֶשֶׁת לְרַגְלַי
  choice: Il a tendu un filet sous mes pieds
  rationale: « Tendre un filet » est l’expression française naturelle pour le piège décrit; « sous mes pieds » maintient l’image corporelle de רַגְלַי.
- source_word: הֱשִׁיבַנִי אָחוֹר
  choice: il m’a fait reculer
  rationale: Le hiphil de שוב avec אָחוֹר exprime le fait de contraindre quelqu’un à revenir en arrière ou à battre en retraite.
- source_word: נְתָנַנִי שֹׁמֵמָה
  choice: Il m’a réduite à la désolation
  rationale: Cette tournure exprime à la fois la causalité de נָתַן et l’état de dévastation porté par שֹׁמֵמָה, sans limiter le mot à une simple émotion.
- source_word: כָּל־הַיּוֹם דָּוָה
  choice: languissante tout le jour
  rationale: דָּוָה peut évoquer la maladie, la faiblesse, la souffrance ou le dépérissement. « Languissante » garde cette amplitude dans un français poétique mais compréhensible.
theological_decisions:
- issue: Sujet implicite des verbes masculins singuliers
  choice: Employer « il » sans identifier explicitement le sujet.
  alternative: Traduire « le Seigneur » comme sujet.
  rationale: Le contexte attribue l’action au jugement divin, mais aucun nom divin ne figure dans ce verset. Le pronom requis par le français préserve cette retenue du texte hébreu.
- issue: Référent du suffixe dans וַיִּרְדֶּנָּה
  choice: 'Comprendre le feu comme sujet et la locutrice personnifiée comme objet: « ce feu m’a maîtrisée ».'
  alternative: 'Comprendre les os comme objet implicite: « il les a maîtrisés »; ou rendre le verbe selon l’idée de descente: « il l’a fait descendre » / « il est descendu jusque dans mes os ».'
  rationale: La vocalisation massorétique favorise le sens « dominer, soumettre » et le suffixe est féminin singulier, ce qui s’accorde avec la locutrice, Jérusalem personnifiée. La construction demeure difficile; la note conserve donc les autres compréhensions anciennes ou courantes sans les imposer au texte principal.
translation_notes:
  register: Français international actuel, digne et poétique. Le féminin (« maîtrisée », « languissante ») rend visible la voix de Jérusalem personnifiée. Les images concrètes du feu, des os, du filet et du recul sont conservées, tandis que la syntaxe est légèrement explicitée pour rester naturelle en français.
