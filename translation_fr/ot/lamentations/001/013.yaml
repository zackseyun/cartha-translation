    rationale: La note doit d’abord indiquer que la vocalisation massorétique peut se rendre par un sujet masculin implicite et un objet féminin. Les compréhensions où le feu agit sur les os, ainsi que la lecture liée à « faire descendre », peuvent être indiquées comme analyses alternatives.
  - severity: low
    issue: L’alternative « dépérissant » de la note b n’est pas accordée avec la locutrice féminine.
    rationale: Dans le cadre retenu par le texte principal, il faut écrire « dépérissante ».
