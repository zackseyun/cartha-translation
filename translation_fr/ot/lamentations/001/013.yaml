    issue: Le sujet de « ce feu m’a maîtrisée » ne correspond pas directement à la morphologie massorétique de וַיִּרְדֶּנָּה.
    rationale: La forme verbale est masculine singulière avec suffixe féminin singulier. Faire du feu, nom féminin, le sujet explicite masque cette donnée grammaticale et privilégie une interprétation contestée. « Il m’a dominée » préserve la morphologie tout en laissant l’agent implicite, comme dans le reste du verset.
  - severity: low
