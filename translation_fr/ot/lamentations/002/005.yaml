source:
  edition: WLC
  text: הָיָ֨ה אֲדֹנָ֤/י כְּ/אוֹיֵב֙ בִּלַּ֣ע יִשְׂרָאֵ֔ל בִּלַּע֙ כָּל אַרְמְנוֹתֶ֔י/הָ שִׁחֵ֖ת מִבְצָרָ֑י/ו וַ/יֶּ֨רֶב֙ בְּ/בַת יְהוּדָ֔ה תַּאֲנִיָּ֖ה וַ/אֲנִיָּֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/005.yaml
  text: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed his strongholds[a], and he multiplied mourning and lamentation in Daughter Judah.
translation:
  language: fr
  text: Le Seigneur est devenu comme un ennemi ; il a englouti Israël. Il a englouti tous ses palais, il a détruit ses forteresses[a] et il a multiplié le deuil et la lamentation au sein de la fille de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici un suffixe masculin singulier (« ses forteresses », celles d’un référent masculin), alors que « ses palais » renvoie auparavant à un référent féminin. Certaines traductions harmonisent les deux expressions.
    reason: La forme française « ses » ne permet pas de voir le changement de genre présent dans le texte massorétique.
lexical_decisions:
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Titre divin rendu selon l’usage français courant, sans le confondre avec le nom divin YHWH.
- source_word: הָיָה ... כְּאוֹיֵב
  choice: est devenu comme un ennemi
  rationale: Préserve explicitement la comparaison marquée par כְּ et suggère, dans le contexte de la lamentation, un changement de posture sans affirmer une identité essentielle.
- source_word: בִּלַּע
  choice: a englouti
  rationale: Conserve l’image forte de l’acte d’avaler tout en exprimant naturellement une destruction totale.
- source_word: כָּל אַרְמְנוֹתֶיהָ
  choice: tous ses palais
  rationale: אַרְמוֹן peut désigner un palais fortifié ; « palais » convient ici et le possessif féminin est naturellement repris en français par « ses ».
- source_word: שִׁחֵת
  choice: a détruit
  rationale: Rend directement et vigoureusement l’idée de dévastation.
- source_word: מִבְצָרָיו
  choice: ses forteresses
  rationale: Le nom désigne des lieux fortifiés. Le suffixe massorétique est masculin singulier, mais le français « ses » ne marque pas le genre ; une note signale donc cette particularité.
- source_word: וַיֶּרֶב
  choice: a multiplié
  rationale: Préserve la valeur causative de la forme verbale et l’intensification poétique.
- source_word: בְּבַת יְהוּדָה
  choice: chez la fille de Juda
  rationale: Conserve la personnification poétique tout en employant une tournure française naturelle pour le domaine humain touché.
- source_word: תַּאֲנִיָּה וַאֲנִיָּה
  choice: le deuil et les lamentations
  rationale: Maintient le redoublement de termes proches qui intensifie l’expression de la douleur.
theological_decisions:
- issue: Rendre la relation du Seigneur à l’ennemi comme une identité ou comme une comparaison
  choice: Le Seigneur est devenu comme un ennemi
  alternative: Le Seigneur est devenu un ennemi ; Le Seigneur était comme un ennemi
  rationale: L’hébreu contient explicitement la particule comparative כְּ, qu’il faut conserver afin de ne pas résoudre la tension théologique du jugement divin.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve les images poétiques d’engloutissement et de personnification, ainsi que le parallélisme de la lamentation.
