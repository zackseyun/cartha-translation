revisions:
- from: Le Seigneur est devenu comme un ennemi ; il a englouti Israël. Il a englouti tous ses palais, il a détruit ses forteresses[a] et il a multiplié le deuil et les lamentations chez la fille de Juda.
  to: Le Seigneur est devenu comme un ennemi ; il a englouti Israël. Il a englouti tous ses palais, il a détruit ses forteresses[a] et il a multiplié le deuil et la lamentation au sein de la fille de Juda.
  rationale: 'Révision limitée à deux ajustements de français et de forme poétique : remplacement de « chez » par « au sein de » pour un cadre collectif plus naturel, et retour au singulier abstrait pour le second terme du doublet. Le sens, la comparaison théologique et l’ambiguïté référentielle du suffixe masculin sont préservés.'
