revisions:
- from: Tes prophètes ont eu pour toi des visions fausses et absurdes ; ils n’ont pas dévoilé ta faute, ce qui aurait rétabli ta situation[a]. Au contraire, ils ont eu pour toi des oracles faux et trompeurs[b].
  to: Tes prophètes ont eu pour toi des visions fausses et absurdes ; ils n’ont pas révélé ta faute pour rétablir ta situation. Au contraire, ils ont eu pour toi des oracles mensongers et propres à égarer[a].
  rationale: La révision conserve les choix fondamentaux du projet, mais restitue la valeur finale de l’infinitif hébreu par « pour rétablir ». Elle maintient l’ambiguïté sémantique de l’idiome de restauration dans une note concise et rend plus explicitement la force d’égarement de מַדּוּחִים. La fusion des deux notes en une seule note placée sur « oracles » évite un ancrage qui ne correspondait pas exactement à la note sur la restauration, tout en conservant toutes les informations textuelles pertinentes.
