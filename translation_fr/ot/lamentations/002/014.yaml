  text: נְבִיאַ֗יִ/ךְ חָ֤זוּ לָ/ךְ֙ שָׁ֣וְא וְ/תָפֵ֔ל וְ/לֹֽא גִלּ֥וּ עַל עֲוֺנֵ֖/ךְ לְ/הָשִׁ֣יב שבית/ך וַ/יֶּ֣חֱזוּ לָ֔/ךְ מַשְׂא֥וֹת שָׁ֖וְא וּ/מַדּוּחִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/014.yaml
  text: Your prophets saw for you falsehood and folly[a], and they did not uncover your iniquity to restore your fortunes; instead[b], they saw for you false oracles and delusions.
translation:
  language: fr
  text: Tes prophètes ont eu pour toi des visions fausses et absurdes ; ils n’ont pas révélé ta faute pour rétablir ta situation. Au contraire, ils ont eu pour toi des oracles mensongers et propres à égarer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot traduit par « oracles » signifie aussi littéralement « fardeaux » et sert de terme technique pour certaines proclamations prophétiques. Pour « rétablir ta situation », l’hébreu dit littéralement : « pour ramener ta captivité » ; l’expression peut aussi désigner plus largement le rétablissement après une calamité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאַיִךְ
  choice: Tes prophètes
  rationale: Le nom pluriel muni du suffixe féminin singulier désigne les prophètes de Jérusalem, à qui le poème s’adresse comme à une femme.
- source_word: חָזוּ לָךְ
  choice: ont eu pour toi des visions
  rationale: Le verbe חזה relève ici de la perception prophétique. Cette formulation française conserve l’image de la vision tout en restant naturelle.
- source_word: שָׁוְא וְתָפֵל
  choice: fausses et absurdes
  rationale: שָׁוְא évoque ce qui est faux, vide ou trompeur ; תָפֵל, terme rare, ce qui est insipide, inconsistant ou insensé. « Absurdes » rend ici leur inanité intellectuelle et morale.
- source_word: וְלֹא גִלּוּ עַל עֲוֺנֵךְ
  choice: ils n’ont pas dévoilé ta faute
  rationale: L’expression signifie mettre à nu ou révéler le tort moral. « Faute » conserve le poids éthique de עָוֹן sans alourdir le français.
- source_word: לְהָשִׁיב שְׁבִיתֵךְ
  choice: ce qui aurait rétabli ta situation
  rationale: La formule hébraïque désigne le renversement d’une condition de détresse, souvent liée à la captivité. La tournure explicite le lien de finalité ou de conséquence dans un français naturel sans imposer que l’exil soit l’unique référent.
- source_word: מַשְׂאוֹת שָׁוְא
  choice: des oracles faux
  rationale: מַשָּׂא désigne ici une proclamation prophétique, bien que son sens concret soit « charge » ou « fardeau ». « Oracles » communique clairement le genre du discours.
- source_word: מַדּוּחִים
  choice: trompeurs
  rationale: Le terme désigne des choses qui égarent. Coordonné à « oracles », l’adjectif français évite une répétition maladroite de « visions » tout en gardant l’idée d’égarement.
theological_decisions:
- issue: Sens de לְהָשִׁיב שְׁבִיתֵךְ
  choice: ce qui aurait rétabli ta situation
  alternative: pour ramener tes captifs / pour mettre fin à ta captivité
  rationale: L’idiome peut évoquer concrètement le retour des captifs, mais sert aussi plus largement à exprimer le rétablissement après une calamité. Le texte principal préserve cette portée générale et la note signale les lectures plus littérales.
- issue: Valeur de מַשְׂאוֹת
  choice: oracles
  alternative: fardeaux
  rationale: « Fardeaux » reproduit le sens concret traditionnel, mais risque de masquer en français moderne qu’il s’agit de proclamations prophétiques. « Oracles » rend immédiatement cette fonction.
translation_notes:
  register: Français international moderne, digne et directement intelligible. Le tutoiement féminin singulier correspond à l’adresse poétique faite à Jérusalem. Le parallélisme prophétique est conservé, avec une ponctuation qui rend nettement le contraste.
