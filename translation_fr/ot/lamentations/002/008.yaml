source:
  edition: WLC
  text: חָשַׁ֨ב יְהוָ֤ה לְ/הַשְׁחִית֙ חוֹמַ֣ת בַּת צִיּ֔וֹן נָ֣טָה קָ֔ו לֹא הֵשִׁ֥יב יָד֖/וֹ מִ/בַּלֵּ֑עַ וַ/יַּֽאֲבֶל חֵ֥ל וְ/חוֹמָ֖ה יַחְדָּ֥ו אֻמְלָֽלוּ׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/008.yaml
  text: Yahweh determined to destroy the wall of daughter Zion[a]; he stretched out a measuring line; he did not hold back his hand from swallowing up, and he made rampart and wall mourn[b]; together they languish.
translation:
  language: fr
  text: Yahweh a résolu de détruire la muraille de la fille de Sion[a]. Il a tendu le cordeau ; il n’a pas retenu sa main d’engloutir[b]. Il a mis en deuil le rempart et la muraille ; ensemble, ils dépérissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus concise : « la muraille de Sion ». L’hébreu personnifie Sion, c’est-à-dire Jérusalem, sous les traits d’une fille.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, il « n’a pas retiré sa main d’engloutir ». L’expression évoque une destruction qui engloutit ou dévore tout.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁב
  choice: a résolu
  rationale: Dans ce contexte de jugement, le verbe exprime un dessein arrêté. « A résolu » est naturel en français et rend mieux cette intention délibérée que le simple « a pensé ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: לְהַשְׁחִית
  choice: de détruire
  rationale: L’infinitif hifil désigne ici une action active de destruction ; « détruire » en donne le sens direct.
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: la muraille de la fille de Sion
  rationale: Cette formulation conserve la chaîne construite et la personnification poétique de Sion sous les traits d’une fille.
- source_word: נָטָה קָו
  choice: Il a tendu le cordeau
  rationale: Le « cordeau » est un instrument de mesure ; l’expression maintient l’image d’une destruction mesurée et délibérée sans l’expliciter excessivement.
- source_word: לֹא הֵשִׁיב יָדוֹ מִבַּלֵּעַ
  choice: il n’a pas retenu sa main d’engloutir
  rationale: La formulation conserve à la fois l’idée de ne pas retirer ou retenir la main et la métaphore saisissante de l’engloutissement, malgré une tournure volontairement poétique.
- source_word: וַיַּאֲבֶל
  choice: Il a mis en deuil
  rationale: 'Le verbe est compris dans un sens causatif : l’action de Yahweh fait entrer les fortifications personnifiées dans le deuil.'
- source_word: חֵל וְחוֹמָה
  choice: le rempart et la muraille
  rationale: « Rempart » désigne l’ouvrage défensif extérieur, tandis que « muraille » maintient la distinction avec l’enceinte principale.
- source_word: יַחְדָּו אֻמְלָלוּ
  choice: ensemble, ils dépérissent
  rationale: « Ensemble » exprime leur sort commun, et « dépérissent » rend leur affaiblissement progressif tout en prolongeant la personnification.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le représente directement et évite de le remplacer par le titre « Seigneur ».
- issue: Agent du deuil du rempart et de la muraille
  choice: Yahweh les met en deuil
  alternative: le rempart et la muraille prennent le deuil
  rationale: La forme verbale et la continuité des actions attribuées à Yahweh favorisent une lecture causative, sans supprimer la personnification poétique des fortifications.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme bref et les personnifications du poème sont conservés. « Cordeau », « rempart » et « muraille » maintiennent le vocabulaire architectural et militaire du texte source.
