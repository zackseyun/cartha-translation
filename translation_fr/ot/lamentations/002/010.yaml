- from: Les anciens de la fille de Sion sont assis à terre, en silence ; ils ont répandu de la poussière sur leur tête et se sont revêtus d’un sac ; les jeunes filles de Jérusalem ont baissé la tête jusqu’à terre.[a]
  to: Les anciens de la fille de Sion sont assis à terre, en silence ; ils ont jeté de la poussière sur leur tête et se sont revêtus de sacs ; les jeunes filles de Jérusalem ont baissé la tête jusqu’à terre.[a]
