review_pass:
  verdict: revise
  source_fidelity: 'Le verset rend fidèlement les trois gestes de deuil : les anciens sont assis à terre et silencieux, ils mettent de la poussière sur leur tête et revêtent des sacs, puis les vierges de Jérusalem baissent la tête vers la terre. « Répandu de la poussière » affaiblit toutefois légèrement l''action concrète de הֶעֱלוּ (« jeter/mettre de la poussière sur »), et le singulier « d’un sac » ne reflète pas naturellement le pluriel שַׂקִּים.'
  naturalness: Le français est sobre, fluide et adapté à un registre poétique moderne. « Se sont revêtus de sacs » est une formulation biblique claire et plus proche du texte que « se sont revêtus d’un sac ».
  terminology: « Anciens », « fille de Sion » et « jeunes filles de Jérusalem » sont recevables. La note conserve utilement la valeur plus spécifique de בְּתוּלֹת, sans imposer une lecture sociale ou doctrinale excessive.
  issues:
  - severity: low
    issue: Le geste de la poussière est rendu par « répandu ».
    rationale: Le hifil de עלה dans cette expression de deuil évoque plus précisément le fait de faire monter, donc de jeter ou de mettre, de la poussière sur la tête. « Jeté » conserve mieux l'image concrète.
  - severity: low
    issue: « Se sont revêtus d’un sac » emploie un singulier qui ne correspond pas au pluriel hébreu.
    rationale: שַׂקִּים est pluriel. « Se sont revêtus de sacs » est à la fois fidèle et naturel dans le style biblique français.
