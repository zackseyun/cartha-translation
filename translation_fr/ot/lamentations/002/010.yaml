translation_notes:
  register: Français international moderne, sobre et poétique. La ponctuation en trois membres garde le parallélisme de la scène. « Fille de Sion » préserve la personnification hébraïque; « sac » conserve le vocabulaire biblique du deuil sans archaïsme excessif.
