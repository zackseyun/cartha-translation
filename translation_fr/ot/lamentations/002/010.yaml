  text: יֵשְׁב֨וּ לָ/אָ֤רֶץ יִדְּמוּ֙ זִקְנֵ֣י בַת צִיּ֔וֹן הֶֽעֱל֤וּ עָפָר֙ עַל רֹאשָׁ֔/ם חָגְר֖וּ שַׂקִּ֑ים הוֹרִ֤ידוּ לָ/אָ֨רֶץ֙ רֹאשָׁ֔/ן בְּתוּלֹ֖ת יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/010.yaml
  text: The elders of daughter Zion sit on the ground in silence[a]; they have thrown dust on their heads and put on sackcloth[b]; the virgins of Jerusalem have bowed their heads to the ground.
translation:
  language: fr
  text: Les anciens de la fille de Sion sont assis à terre, en silence ; ils ont jeté de la poussière sur leur tête et se sont revêtus de sacs ; les jeunes filles de Jérusalem ont baissé la tête jusqu’à terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu désigne plus précisément les vierges, c’est-à-dire les jeunes femmes non mariées de Jérusalem, présentées ici comme un groupe en deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשְׁבוּ לָאָרֶץ יִדְּמוּ
  choice: sont assis à terre, en silence
  rationale: Rend concrètement la posture de deuil et le silence exprimé par דמם, dans un français naturel, sans ajouter une idée de durée.
- source_word: זִקְנֵי
  choice: les anciens
  rationale: « Anciens » conserve à la fois la dimension d’âge et le statut communautaire possible, contrairement à « vieillards » ou « dirigeants », qui réduiraient le sens.
- source_word: בַת צִיּוֹן
  choice: la fille de Sion
  rationale: Préserve la personnification poétique traditionnelle sans la remplacer par une simple désignation géographique.
- source_word: הֶעֱלוּ עָפָר עַל רֹאשָׁם
  choice: ils ont répandu de la poussière sur leur tête
  rationale: Exprime clairement le geste rituel de deuil. Le singulier distributif « leur tête » est idiomatique en français.
- source_word: חָגְרוּ שַׂקִּים
  choice: se sont revêtus d’un sac
  rationale: Conserve l’image biblique du sac comme vêtement de deuil tout en évitant le littéralisme peu naturel « ont ceint des sacs ».
- source_word: הוֹרִידוּ לָאָרֶץ רֹאשָׁן
  choice: ont baissé la tête jusqu’à terre
  rationale: Suit le mouvement concret du verbe « faire descendre/abaisser » et exprime la profondeur de l’accablement sans surinterpréter le geste.
- source_word: בְּתוּלֹת יְרוּשָׁלִָם
  choice: les jeunes filles de Jérusalem
  rationale: En français moderne, « jeunes filles » désigne naturellement ce groupe social de jeunes femmes non mariées; une note signale la précision lexicale de l’hébreu.
