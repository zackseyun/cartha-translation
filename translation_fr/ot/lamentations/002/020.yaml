  text: רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה לְ/מִ֖י עוֹלַ֣לְתָּ כֹּ֑ה אִם תֹּאכַ֨לְנָה נָשִׁ֤ים פִּרְיָ/ם֙ עֹלֲלֵ֣י טִפֻּחִ֔ים אִם יֵהָרֵ֛ג בְּ/מִקְדַּ֥שׁ אֲדֹנָ֖/י כֹּהֵ֥ן וְ/נָבִֽיא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/020.yaml
  text: Look[a], O Yahweh, and see—to whom have you done this? Should women eat their offspring[b], the children they have cared for? Should priest and prophet be killed in the sanctuary of the Lord?
translation:
  language: fr
  text: 'Regarde, Yahweh, et vois : à qui as-tu fait subir cela ? Faut-il que des femmes mangent le fruit de leurs entrailles[a], les petits enfants qu’elles ont choyés[b] ? Faut-il qu’un prêtre et un prophète soient tués dans le sanctuaire du Seigneur ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur fruit », c’est-à-dire leurs propres enfants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les petits enfants dont elles ont pris soin » ; l’expression peut évoquer des enfants tendrement élevés ou portés dans les bras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: Regarde ... et vois
  rationale: Les deux impératifs sont conservés afin de rendre l’insistance de l’appel, dans un français actuel et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve la distinction avec אֲדֹנָי, rendu plus loin par « le Seigneur ».
- source_word: לְמִי עוֹלַלְתָּ כֹּה
  choice: à qui as-tu fait subir cela ?
  rationale: « Faire subir » explicite naturellement en français la portée néfaste du verbe dans ce contexte, sans préciser davantage la nature du jugement.
- source_word: אִם ... תֹּאכַלְנָה / אִם יֵהָרֵג
  choice: Faut-il que ... ?
  rationale: Les deux אִם introduisent ici des questions rhétoriques horrifiées plutôt que de simples propositions conditionnelles.
- source_word: פִּרְיָם
  choice: le fruit de leurs entrailles
  rationale: Cette expression française garde l’image du « fruit » tout en indiquant clairement qu’il s’agit de leurs propres enfants.
- source_word: עֹלֲלֵי טִפֻּחִים
  choice: les petits enfants qu’elles ont bercés
  rationale: La formulation rend les jeunes enfants et les soins tendres évoqués par טִפֻּחִים; « bercés » reste concret et idiomatique.
- source_word: בְּמִקְדַּשׁ אֲדֹנָי
  choice: dans le sanctuaire du Seigneur
  rationale: « Sanctuaire » correspond au lieu saint, tandis que « Seigneur » traduit אֲדֹנָי et maintient sa distinction d’avec Yahweh.
- source_word: כֹּהֵן וְנָבִיא
  choice: prêtres et prophètes
  rationale: Le singulier hébreu sans article désigne ici les représentants de ces catégories; le pluriel générique est naturel en français dans la construction passive.
theological_decisions:
- issue: Les deux désignations divines du verset
  choice: יְהוָה rendu par « Yahweh » et אֲדֹנָי par « le Seigneur »
  alternative: Rendre les deux par « le Seigneur »
  rationale: Le texte hébreu emploie délibérément deux formes différentes; la traduction en conserve la distinction.
- issue: Nature des interrogations introduites par אִם
  choice: 'Questions rhétoriques exprimant l’horreur : « Faut-il que… ? »'
  alternative: Questions prédictives (« Est-ce que… ? ») ou propositions conditionnelles (« Si… »)
  rationale: Le contexte de lamentation et le parallélisme présentent ces actes comme des réalités scandaleuses soumises au regard de Dieu, sans effacer la tension de l’adresse qui lui est faite.
translation_notes:
  register: Français international moderne, digne et direct. Le double impératif et les deux questions parallèles conservent l’intensité de la lamentation. Les images maternelles restent concrètes sans employer de tournure archaïque.
