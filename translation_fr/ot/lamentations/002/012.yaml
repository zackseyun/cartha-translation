base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/012.yaml
  text: They say to their mothers[a], “Where are grain and wine?” as they faint like the wounded in the streets of the city[c][b], as their life is poured out into their mothers’ bosom.
translation:
  language: fr
  text: 'Ils disent à leurs mères :


    « Où sont le grain et le vin ? »


    Ils défaillent comme des blessés[a]


    dans les rues de la ville,


    tandis que leur vie se répand


    dans le giron de leurs mères[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des morts ». Le mot hébreu peut désigner une personne transpercée, mortellement blessée ou tuée.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les bras de leurs mères » ou « sur les genoux de leurs mères ». Littéralement, « dans le giron de leurs mères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִמֹּתָם
  choice: à leurs mères
  rationale: Le préfixe לְ marque ici la personne à qui les enfants s’adressent; le pluriel possessif est rendu naturellement en français.
- source_word: יֹאמְרוּ
  choice: ils demandent
  rationale: Dans ce contexte, « Où sont… ? » est une demande adressée aux mères. Le présent restitue l’immédiateté de la scène poétique.
- source_word: אַיֵּה דָּגָן וָיָיִן
  choice: Où sont le blé et le vin ?
  rationale: דָּגָן désigne les céréales ou le produit du grain; « blé » est ici une désignation française concrète et courante de cette nourriture de base. L’accord au pluriel est naturel avec les deux éléments coordonnés.
- source_word: בְּהִתְעַטְּפָם
  choice: ils défaillent
  rationale: Le verbe décrit l’affaiblissement allant jusqu’à l’évanouissement; « défaillir » convient au registre poétique sans être obscur.
- source_word: כֶּחָלָל
  choice: comme des blessés à mort
  rationale: חָלָל peut désigner une personne transpercée, mortellement blessée ou tuée. « Blessés à mort » maintient la comparaison avec des victimes de guerre tout en correspondant à des enfants dont la vie est encore en train de s’écouler.
- source_word: בִּרְחֹבוֹת עִיר
  choice: dans les rues de la ville
  rationale: רְחֹבוֹת désigne les espaces ouverts, places ou larges rues de la ville; « rues » donne une image claire et naturelle en français.
- source_word: בְּהִשְׁתַּפֵּךְ נַפְשָׁם
  choice: tandis que leur vie s’épanche
  rationale: נֶפֶשׁ signifie ici la vie qui s’en va plutôt qu’une âme conçue abstraitement. « S’épanche » conserve la métaphore littérale du liquide versé.
- source_word: אֶל חֵיק אִמֹּתָם
  choice: sur le sein de leurs mères
  rationale: חֵיק peut désigner le sein, le giron ou les genoux. « Sur le sein » préserve l’image maternelle intime et le mouvement suggéré par אֶל.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. La disposition en vers rend les parallélismes de la lamentation. « Défaillent » et « s’épanche » gardent une légère élévation de registre tout en restant compréhensibles. Tous les marqueurs de notes figurent dans le texte.
