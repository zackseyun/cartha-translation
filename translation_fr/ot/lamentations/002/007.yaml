id: LAM.2.7
reference: Lamentations 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זָנַ֨ח אֲדֹנָ֤/י מִזְבְּח/וֹ֙ נִאֵ֣ר מִקְדָּשׁ֔/וֹ הִסְגִּיר֙ בְּ/יַד אוֹיֵ֔ב חוֹמֹ֖ת אַרְמְנוֹתֶ֑י/הָ ק֛וֹל נָתְנ֥וּ בְּ/בֵית יְהוָ֖ה כְּ/י֥וֹם מוֹעֵֽד׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/007.yaml
  text: The Lord has rejected his altar[a]; he has abandoned his sanctuary. He has given the walls of her palaces into the hand of the enemy[c][b]. They raised a shout in the house of Yahweh as on the day of an appointed feast.
translation:
  language: fr
  text: Le Seigneur a rejeté son autel ; il a répudié son sanctuaire. Il a livré aux mains de l’ennemi les murailles de ses palais[a]. Ils ont poussé des cris dans la maison de Yahweh, comme en un jour de fête solennelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les murailles de ses citadelles ». Le mot hébreu peut désigner des palais, souvent conçus comme des bâtiments fortifiés.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme en un jour de fête » ; l’hébreu désigne un temps fixé, notamment une fête ou une assemblée cultuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: a rejeté
  rationale: Rend l’idée de mise à l’écart et de désaveu, sans suggérer nécessairement un abandon définitif.
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Titre divin naturel et traditionnel en français, distinct du nom propre Yahweh qui apparaît plus loin.
- source_word: מִזְבְּחוֹ
  choice: son autel
  rationale: Traduction directe du singulier avec suffixe possessif masculin.
- source_word: נִאֵר
  choice: a répudié
  rationale: Conserve un verbe distinct et plus fort que « a rejeté », exprimant un désaveu marqué sans imposer la nuance émotionnelle maximale de « abhorrer ».
- source_word: מִקְדָּשׁוֹ
  choice: son sanctuaire
  rationale: Terme français naturel pour le lieu sacré dans le contexte du temple.
- source_word: הִסְגִּיר בְּיַד אוֹיֵב
  choice: a livré aux mains de l’ennemi
  rationale: Expression française idiomatique qui conserve l’image hébraïque de la main comme symbole du pouvoir.
- source_word: חוֹמֹת אַרְמְנוֹתֶיהָ
  choice: les murailles de ses palais
  rationale: Le suffixe féminin renvoie à la ville personnifiée. « Murailles » convient aux ouvrages défensifs entourant les palais ou citadelles.
- source_word: קוֹל נָתְנוּ
  choice: Ils ont poussé des cris
  rationale: Rend naturellement l’idiome littéral « ils ont donné de la voix » et le tumulte hostile implicite.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Préserve l’expression « maison » et transcrit le nom divin personnel.
- source_word: כְּיוֹם מוֹעֵד
  choice: comme en un jour de fête fixée
  rationale: מוֹעֵד désigne un temps déterminé, souvent une fête cultuelle; cette formulation maintient à la fois l’idée de fête et celle de date fixée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, distinct du titre אֲדֹנָי au début du verset; « Yahweh » préserve cette distinction.
- issue: Rapport de sens entre זָנַח et נִאֵר
  choice: 'Deux verbes différenciés : « a rejeté » et « a répudié »'
  alternative: Employer « rejeter » dans les deux membres, ou traduire נִאֵר par « a abhorré »
  rationale: La différenciation respecte le parallélisme avec intensification possible, tandis que « répudier » garde la force du second verbe sans trancher en faveur de sa nuance la plus extrême.
- issue: Référent du suffixe féminin dans אַרְמְנוֹתֶיהָ
  choice: La ville personnifiée, rendue par « ses palais »
  alternative: Expliciter « les palais de Jérusalem »
  rationale: Le féminin renvoie au personnage collectif présent dans le contexte, mais le verset ne nomme pas explicitement Jérusalem; le pronom conserve cette cohésion poétique.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme hébreu est conservé, ainsi que la distinction entre le titre « Le Seigneur » et le nom « Yahweh ». Les formulations restent accessibles tout en maintenant l’image des « mains de l’ennemi » et l’ironie du tumulte ennemi comparé à celui d’un jour de fête.
