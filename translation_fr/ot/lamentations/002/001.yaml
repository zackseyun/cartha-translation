  text: אֵיכָה֩ יָעִ֨יב בְּ/אַפּ֤/וֹ אֲדֹנָ/י֙ אֶת בַּת צִיּ֔וֹן הִשְׁלִ֤יךְ מִ/שָּׁמַ֨יִם֙ אֶ֔רֶץ תִּפְאֶ֖רֶת יִשְׂרָאֵ֑ל וְ/לֹא זָכַ֥ר הֲדֹם רַגְלָ֖י/ו בְּ/י֥וֹם אַפּֽ/וֹ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/001.yaml
  text: How the Lord in his anger has clouded over daughter Zion! He has cast from heaven to earth the beauty of Israel[c][b][a], and he did not remember his footstool in the day of his anger.
translation:
  language: fr
  text: Comme le Seigneur a, dans sa colère, couvert d’un nuage la fille de Sion[a] ! Il a précipité du ciel sur la terre la splendeur d’Israël[c] et ne s’est pas souvenu de son marchepied[b] au jour de sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a assombri » ou « a enveloppé d’un nuage ». Le verbe hébreu évoque l’image de Sion couverte ou obscurcie par un nuage.
    reason: lexical_alternative
  - marker: b
    text: « Son marchepied » peut désigner Sion, le temple ou l’arche, tous associés à la présence de Dieu sur la terre.
    reason: alternative_reading
  - marker: c
    text: Ou « la gloire d’Israël » ou « la beauté d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Comme
  rationale: Introduit ici une exclamation de lamentation, non une demande d’information. « Comme » conserve la force exclamative sans transformer le vers en question.
- source_word: יָעִיב
  choice: a couvert d’un nuage
  rationale: Le verbe évoque l’action de couvrir ou d’obscurcir par un nuage. Cette formulation préserve l’image hébraïque.
- source_word: בְּאַפּוֹ
  choice: dans sa colère
  rationale: אַף désigne littéralement le nez, mais exprime idiomatiquement la colère. Le français courant appelle ici « colère ».
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le titre divin est traduit par son équivalent français usuel et digne.
- source_word: בַּת צִיּוֹן
  choice: la fille de Sion
  rationale: Conserve la personnification poétique de la ville et de ses habitants tout en restant naturel en français.
- source_word: הִשְׁלִיךְ
  choice: a précipité
  rationale: Rend la force du geste de jeter d’en haut et souligne la chute dramatique du ciel sur la terre.
- source_word: מִשָּׁמַיִם אֶרֶץ
  choice: du ciel sur la terre
  rationale: Exprime naturellement en français le mouvement descendant et l’opposition entre l’élévation et l’abaissement.
- source_word: תִּפְאֶרֶת יִשְׂרָאֵל
  choice: la splendeur d’Israël
  rationale: תִּפְאֶרֶת peut désigner la beauté, la gloire ou la splendeur. « Splendeur » garde à la fois les dimensions esthétique et honorifique.
- source_word: וְלֹא זָכַר
  choice: et ne s’est pas souvenu
  rationale: Reproduit directement le verbe זכר et en préserve les possibles résonances relationnelles et d’alliance.
- source_word: הֲדֹם רַגְלָיו
  choice: son marchepied
  rationale: Équivalent français naturel de l’image hébraïque, sans identifier explicitement son référent.
- source_word: בְּיוֹם אַפּוֹ
  choice: au jour de sa colère
  rationale: Conserve la formulation temporelle solennelle ainsi que la répétition du motif de la colère.
theological_decisions:
- issue: Référent de « son marchepied »
  choice: L’image « son marchepied » est conservée sans préciser son référent dans le texte principal.
  alternative: Le temple, Sion/Jérusalem, ou l’arche associée à la présence et au trône terrestres de Dieu.
  rationale: L’hébreu ne tranche pas explicitement entre ces référents possibles. Les préciser dans le texte résoudrait indûment une ambiguïté réelle.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe exclamative de « Comme » restitue la lamentation initiale; les images du nuage, de la chute du ciel sur la terre et du marchepied sont maintenues sans explicitation excessive.
