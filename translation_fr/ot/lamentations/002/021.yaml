language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁכְב֨וּ לָ/אָ֤רֶץ חוּצוֹת֙ נַ֣עַר וְ/זָקֵ֔ן בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י נָפְל֣וּ בֶ/חָ֑רֶב הָרַ֨גְתָּ֙ בְּ/י֣וֹם אַפֶּ֔/ךָ טָבַ֖חְתָּ לֹ֥א חָמָֽלְתָּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/021.yaml
  text: Young and old lie on the ground in the streets[a]; my virgins and my young men have fallen by the sword. You killed them in the day of your anger[b]; you slaughtered without pity.
translation:
  language: fr
  text: Jeunes et vieux gisent à terre dans les rues ; mes jeunes filles[a] et mes jeunes hommes sont tombés sous l’épée. Tu les as tués au jour de ta colère ; tu les as massacrés sans pitié[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mes vierges ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sans épargner ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְבוּ לָאָרֶץ
  choice: gisent à terre
  rationale: Le parfait décrit ici l’état résultant des morts étendus au sol. « Gisent à terre » conserve l’image concrète et le ton solennel du verset.
- source_word: חוּצוֹת
  choice: dans les rues
  rationale: Le terme désigne les espaces publics ouverts de la ville, notamment les rues ; ce choix est naturel dans le contexte de la chute de Jérusalem.
- source_word: נַעַר וְזָקֵן
  choice: Jeunes et vieux
  rationale: Cette paire forme une expression englobante qui vise les différentes générations ; la formulation française en restitue naturellement la portée.
- source_word: בְּתוּלֹתַי
  choice: mes jeunes filles
  rationale: Le mot désigne des jeunes femmes non mariées ou vierges. « Jeunes filles » est naturel en français moderne, tandis que la nuance plus littérale est signalée en note.
- source_word: וּבַחוּרַי
  choice: mes jeunes hommes
  rationale: Le terme désigne des hommes dans la force de la jeunesse, non des hommes « choisis ».
- source_word: נָפְלוּ בֶחָרֶב
  choice: sont tombés sous l’épée
  rationale: Cette tournure conserve l’image hébraïque traditionnelle d’une mort violente causée par l’épée, sans l’élargir arbitrairement à la bataille.
- source_word: הָרַגְתָּ
  choice: Tu les as tués
  rationale: Le pronom objet « les » est explicité à partir du contexte. Le passé composé rend directement l’acte accompli dans un français actuel.
- source_word: בְּיוֹם אַפֶּךָ
  choice: au jour de ta colère
  rationale: « Colère » rend ici le sens figuré de אַף, et « au jour de » maintient la tonalité prophétique de la formule temporelle.
- source_word: טָבַחְתָּ
  choice: tu les as massacrés
  rationale: Le verbe est plus fort et plus sanglant que הָרַגְתָּ. « Massacrés » préserve cette intensification sans archaïsme.
- source_word: לֹא חָמָלְתָּ
  choice: sans pitié
  rationale: Cette formulation concise exprime l’absence de compassion ; l’autre nuance possible, « sans épargner », est conservée en note.
theological_decisions:
- issue: Attribution directe du massacre à Dieu
  choice: 'Maintenir l’adresse directe : « Tu les as tués… tu les as massacrés »'
  alternative: Employer un passif ou une formulation impersonnelle qui atténuerait l’action divine
  rationale: L’hébreu désigne directement Dieu comme agent dans la plainte. La traduction conserve cette tension théologique au lieu de l’adoucir.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme en deux phrases conserve la progression du tableau des morts vers l’accusation adressée à Dieu. Le vocabulaire concret (« gisent », « épée », « massacrés ») préserve la force du texte sans recourir à des archaïsmes.
