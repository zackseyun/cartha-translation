source:
  edition: WLC
  text: ק֣וּמִי רֹ֣נִּי ב/ליל לְ/רֹאשׁ֙ אַשְׁמֻר֔וֹת שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/019.yaml
  text: Rise[a], cry out in the night, at the beginning of the watches; pour out your heart like water before the face of the Lord. Lift up your hands to him for the lives of your little children, who are faint with hunger at the head of every street.
translation:
  language: fr
  text: 'Lève-toi, pousse des cris dans la nuit,

    au début des veilles !

    Répands ton cœur comme de l’eau

    devant le Seigneur.

    Élève tes mains vers lui

    pour la vie de tes tout-petits,

    qui défaillent de faim

    à chaque coin de rue.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la tête de toutes les rues » ; l’expression désigne vraisemblablement les coins ou les entrées des rues.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמִי
  choice: Lève-toi
  rationale: Impératif féminin singulier adressé à Jérusalem personnifiée ; formulation française actuelle qui conserve l’urgence de l’appel.
- source_word: רֹנִּי
  choice: pousse des cris
  rationale: Le verbe peut désigner un cri retentissant, joyeux ou plaintif selon le contexte. Ici, le cadre de lamentation appelle une expression neutre quant à la nature du cri, sans suggérer un chant joyeux.
- source_word: בַלַּיל
  choice: dans la nuit
  rationale: Rend directement et naturellement l’indication temporelle.
- source_word: לְרֹאשׁ אַשְׁמֻרוֹת
  choice: au début des veilles
  rationale: רֹאשׁ a ici le sens de commencement, et אַשְׁמֻרוֹת désigne les périodes de garde qui divisent la nuit. La traduction reste proche de l’expression hébraïque sans imposer explicitement une lecture distributive (« chaque veille »).
- source_word: שִׁפְכִי כַמַּיִם לִבֵּךְ
  choice: Répands ton cœur comme de l’eau
  rationale: Conserve la métaphore concrète d’une effusion intérieure totale et incontrainte.
- source_word: נֹכַח פְּנֵי אֲדֹנָי
  choice: devant le Seigneur
  rationale: Exprime la présence directe indiquée par נֹכַח פְּנֵי dans un français naturel ; traduire littéralement « devant la face » serait ici pesant.
- source_word: שְׂאִי אֵלָיו כַּפַּיִךְ
  choice: Élève tes mains vers lui
  rationale: Rend le geste de supplication et la direction exprimée par אֵלָיו ; כַּפַּיִם désigne littéralement les paumes, mais « mains » est l’usage naturel en français.
- source_word: עַל נֶפֶשׁ עוֹלָלַיִךְ
  choice: pour la vie de tes tout-petits
  rationale: עַל marque ici l’intercession en faveur de quelqu’un ; נֶפֶשׁ désigne la vie, non une âme abstraite, et עוֹלָלִים de très jeunes enfants.
- source_word: הָעֲטוּפִים בְּרָעָב
  choice: qui défaillent de faim
  rationale: Le participe décrit les enfants qui perdent leurs forces sous l’effet de la faim.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: à chaque coin de rue
  rationale: Expression française idiomatique correspondant au sens spatial de l’hébreu dans ce contexte ; l’image plus littérale est signalée en note.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: mon Seigneur
  rationale: Le texte porte אֲדֹנָי et non le tétragramme. « le Seigneur » rend le titre divin sans lui appliquer la convention typographique réservée au nom YHWH ni imposer le possessif possible étymologiquement.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes conserve le rythme poétique et les impératifs féminins adressés à Jérusalem personnifiée. « Tout-petits » maintient le caractère poignant de la référence aux très jeunes enfants sans archaïsme.
