source:
  edition: WLC
  text: וַ/יַּחְמֹ֤ס כַּ/גַּן֙ שֻׂכּ֔/וֹ שִׁחֵ֖ת מוֹעֲד֑/וֹ שִׁכַּ֨ח יְהוָ֤ה בְּ/צִיּוֹן֙ מוֹעֵ֣ד וְ/שַׁבָּ֔ת וַ/יִּנְאַ֥ץ בְּ/זַֽעַם אַפּ֖/וֹ מֶ֥לֶךְ וְ/כֹהֵֽן׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/006.yaml
  text: He has laid waste his shelter like a garden[a]; he has destroyed his appointed meeting place. Yahweh has caused appointed feast and Sabbath to be forgotten in Zion[c][b], and in the indignation of his anger he has spurned king and priest.
translation:
  language: fr
  text: 'Il a saccagé son abri comme un jardin[a] ;

    il a détruit son lieu d’assemblée[b].

    Yahweh a fait oublier à Sion les temps de fête[c] et le sabbat ;

    dans sa violente colère, il a rejeté roi et prêtre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa hutte » ou « son tabernacle ». Le terme hébreu peut désigner un abri, une hutte ou un couvert ; l’image exacte est discutée.
    reason: lexical_alternative
  - marker: b
    text: Ou « son lieu de rencontre établi » ; peut-être « sa tente de la Rencontre ». Le mot hébreu est apparenté à celui rendu ensuite par « temps de fête ».
    reason: lexical_alternative
  - marker: c
    text: Ou « la fête fixée » ou « le temps fixé ». Associé ici au sabbat, le terme désigne probablement les temps festifs établis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹס
  choice: a saccagé
  rationale: Le piel exprime ici une action violente et destructrice. « Saccager » restitue cette force dans un français naturel.
- source_word: כַּגַּן
  choice: comme un jardin
  rationale: Conserve explicitement la comparaison difficile du texte hébreu sans tenter de l’expliquer dans le corps du verset.
- source_word: שֻׂכּוֹ
  choice: son abri
  rationale: Le nom peut désigner une hutte, un abri ou un couvert. « Abri » reste assez large et n’introduit pas trop vite le sens technique de « tabernacle ».
- source_word: שִׁחֵת
  choice: a détruit
  rationale: Dans le contexte de la dévastation de Sion, le verbe décrit une destruction concrète.
- source_word: מוֹעֲדוֹ
  choice: son lieu de rencontre fixé
  rationale: 'Avec « détruire » comme verbe et le second מוֹעֵד employé ensuite avec le sabbat, le premier terme est probablement spatial : le lieu assigné aux rencontres cultuelles. La formulation maintient aussi le lien lexical avec « fêtes fixées ».'
- source_word: שִׁכַּח
  choice: a fait oublier
  rationale: La forme causative est rendue directement et naturellement en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּצִיּוֹן
  choice: dans Sion
  rationale: Rend simplement la valeur locative de la préposition.
- source_word: מוֹעֵד
  choice: fêtes fixées
  rationale: Associé au sabbat, le mot désigne vraisemblablement ici les temps festifs établis. Le pluriel français exprime naturellement la catégorie collective.
- source_word: וְשַׁבָּת
  choice: et sabbat
  rationale: La coordination sans article conserve la formulation condensée et poétique de l’hébreu.
- source_word: וַיִּנְאַץ
  choice: a rejeté
  rationale: Le verbe exprime un rejet chargé de mépris. « Rejeter » est clair et digne ; la force du contexte en préserve la gravité.
- source_word: בְּזַעַם אַפּוֹ
  choice: dans sa violente colère
  rationale: Cette tournure française idiomatique rend l’intensification produite par les deux termes hébreux liés à la fureur et à la colère.
- source_word: מֶלֶךְ וְכֹהֵן
  choice: roi et prêtre
  rationale: L’absence d’articles conserve le caractère représentatif et lapidaire des deux fonctions visées.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le tétragramme comme nom personnel. « Yahweh » le conserve sous une forme largement reconnue sans le remplacer par un titre.
- issue: Sens du premier מוֹעֵד
  choice: 'sens spatial : « son lieu de rencontre fixé »'
  alternative: 'sens temporel : « son temps fixé / sa fête » ; sens cultuel technique : « sa tente de la Rencontre »'
  rationale: L’objet de « détruire » est plus naturellement un lieu, tandis que le second emploi, coordonné au sabbat, a un sens temporel ou festif. La traduction préserve cette tension et le jeu sur les deux emplois du même mot.
translation_notes:
  register: Français international moderne, poétique et digne, avec des propositions brèves qui suivent le parallélisme hébreu. Le vocabulaire demeure accessible tout en conservant la comparaison énigmatique et le double emploi de מוֹעֵד.
