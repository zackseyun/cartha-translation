  - severity: low
    issue: « fille Sion » est moins naturel en français biblique moderne que « fille de Sion ».
    rationale: La construction française avec « de » est la forme consacrée pour préserver la personnification de בַּת־צִיּוֹן tout en restant claire pour un lectorat international.
