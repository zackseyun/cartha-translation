  verdict: revise
  source_fidelity: 'La traduction rend fidèlement la progression du verset : l’arc bandé, les comparaisons hostiles, la mise à mort de ce qui est « désirable aux yeux », la tente de la fille de Sion et la fureur répandue comme le feu. Toutefois, « comme celle d’un adversaire » introduit en français une comparaison avec la main d’un adversaire qui n’est pas formulée par l’hébreu. Le texte compare la main droite elle-même à un adversaire dans son attitude hostile.'
  naturalness: Le registre est moderne, poétique et globalement naturel. « Fille de Sion » est la forme française établie et plus idiomatique que « fille Sion ». « Se tenait postée comme un adversaire » rend de manière plus exacte et fluide l’idée de positionnement exprimée par le participe hébreu.
  terminology: « Bander son arc », « ennemi », « adversaire », « tente », « fureur » et « comme un feu » conviennent. « Fille de Sion » conserve la personnification poétique sans réduire l’expression à Jérusalem. La formulation neutre pour מַחֲמַדֵּי עָיִן préserve prudemment l’ambiguïté entre personnes chères et réalités belles ou précieuses.
  issues:
