  text: דָּרַ֨ךְ קַשְׁתּ֜/וֹ כְּ/אוֹיֵ֗ב נִצָּ֤ב יְמִינ/וֹ֙ כְּ/צָ֔ר וַֽ/יַּהֲרֹ֔ג כֹּ֖ל מַחֲמַדֵּי עָ֑יִן בְּ/אֹ֨הֶל֙ בַּת צִיּ֔וֹן שָׁפַ֥ךְ כָּ/אֵ֖שׁ חֲמָתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/004.yaml
  text: He bent his bow like an enemy; his right hand stood ready like a foe[a], and he killed all who were pleasing to the eye in the tent of daughter Zion; he poured out his wrath like fire.
translation:
  language: fr
  text: Il a bandé son arc comme un ennemi ; sa main droite se tenait postée comme un adversaire. Il a tué tout ce qui charmait le regard[a] dans la tente de la fille de Sion ; il a déversé sa fureur comme un feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui charmaient le regard ». L’expression hébraïque peut désigner des personnes aimées aussi bien que, plus largement, tout ce qui était beau ou précieux.
    reason: Alternative lexicale préservant l’ambiguïté du référent.
lexical_decisions:
- source_word: דָּרַךְ קַשְׁתּוֹ
  choice: Il a bandé son arc
  rationale: En contexte guerrier, le verbe désigne l’action de tendre ou de préparer l’arc. « Bander son arc » est une expression française précise et naturelle qui conserve l’image martiale.
- source_word: כְּאוֹיֵב
  choice: comme un ennemi
  rationale: Le préfixe comparatif כְּ est conservé explicitement, sans atténuer la représentation saisissante de Dieu agissant envers Sion comme un ennemi.
- source_word: נִצָּב יְמִינוֹ כְּצָר
  choice: sa main droite s’est dressée comme celle d’un adversaire
  rationale: נִצָּב exprime une position ferme ou prête à agir. L’ajout de « celle » rend en français la comparaison de manière naturelle tout en gardant la main droite comme sujet de l’image.
- source_word: וַיַּהֲרֹג
  choice: Il a tué
  rationale: Traduction directe, actuelle et non archaïque du verbe courant « tuer ».
- source_word: מַחֲמַדֵּי עָיִן
  choice: tout ce qui charmait le regard
  rationale: L’expression désigne ce qui est désirable, précieux ou agréable aux yeux. Le neutre préserve l’ambiguïté entre personnes aimées et biens précieux, que l’hébreu ne tranche pas explicitement.
- source_word: בְּאֹהֶל בַּת־צִיּוֹן
  choice: dans la tente de fille Sion
  rationale: « Fille Sion » conserve la personnification poétique de la ville et de son peuple ; « tente » maintient l’image concrète de leur demeure.
- source_word: שָׁפַךְ
  choice: il a déversé
  rationale: « Déverser » rend naturellement l’image d’un liquide répandu avec force et convient à la colère comme objet métaphorique.
- source_word: כָּאֵשׁ
  choice: comme un feu
  rationale: La comparaison est reproduite simplement et directement.
- source_word: חֲמָתוֹ
  choice: sa fureur
  rationale: חֵמָה évoque une colère ardente et intense. « Fureur » conserve cette force dans un registre moderne et digne.
theological_decisions:
- issue: Dieu est présenté comme agissant « comme un ennemi » envers Sion
  choice: 'Conserver directement les deux comparaisons hostiles : « comme un ennemi » et « comme celle d’un adversaire ».'
  alternative: Atténuer par « il semblait être un ennemi » ou expliquer qu’il combattait seulement à la manière d’un ennemi.
  rationale: L’hébreu formule explicitement ces comparaisons. La traduction maintient la tension théologique du poème sans la résoudre ni l’adoucir.
- issue: Personnification בַּת־צִיּוֹן
  choice: fille Sion
  alternative: la fille de Sion ; Sion ; Jérusalem
  rationale: La personnification est essentielle à la poésie et à la lamentation. La conserver évite de réduire l’image à un simple nom géographique.
- issue: Référent de מַחֲמַדֵּי עָיִן
  choice: 'Formulation neutre dans le texte principal : « tout ce qui charmait le regard ».'
  alternative: « tous ceux qui charmaient le regard », compris comme des personnes aimées.
  rationale: Le contexte du verbe « tuer » peut orienter vers des personnes, mais l’expression hébraïque peut aussi désigner plus largement tout ce qui est beau, précieux ou désirable. La formulation retenue préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsmes. Le parallélisme guerrier et les comparaisons abruptes sont conservés. « Fille Sion » maintient la personnification biblique, tandis que la note explicite l’ambiguïté de מַחֲמַדֵּי עָיִן.
