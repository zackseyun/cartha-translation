revisions:
- from: Il a bandé son arc comme un ennemi ; sa main droite s’est dressée comme celle d’un adversaire. Il a tué tout ce qui charmait le regard[a] dans la tente de fille Sion ; il a déversé sa fureur comme un feu.
  to: Il a bandé son arc comme un ennemi ; sa main droite se tenait postée comme un adversaire. Il a tué tout ce qui charmait le regard[a] dans la tente de la fille de Sion ; il a déversé sa fureur comme un feu.
  rationale: La révision retire l’ajout interprétatif « celle d’ » et rend נִצָּב par « se tenait postée », qui exprime une position établie et prête à l’action. Elle adopte également « fille de Sion », formulation française usuelle qui conserve la personnification du texte hébreu. L’ambiguïté de « tout ce qui charmait le regard » est maintenue et explicitée par la note.
