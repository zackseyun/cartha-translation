revisions:
- from: 'Tous ceux qui passent sur le chemin battent des mains en te voyant ; ils sifflent[a] et secouent la tête devant la fille de Jérusalem[b] : « Est-ce là la ville dont on disait : “La perfection de la beauté”[c], “la joie de toute la terre” ? »'
  to: 'Tous les passants battent des mains contre toi ; ils sifflent[a] et secouent la tête contre la fille de Jérusalem[b] : « Est-ce là la ville dont on disait : “La perfection de la beauté, la joie de toute la terre” ? »'
  rationale: La révision rétablit la direction hostile des gestes envers Jérusalem, améliore l'idiomaticité de la désignation des voyageurs et unifie la citation finale conformément à la syntaxe hébraïque. La note lexicale sur le sifflement est clarifiée. L'ancre [c] demeure dans le jeu de notes, mais est déplacée au sein de la citation dans le texte révisé afin d'ancrer explicitement l'alternative à « la perfection de la beauté ».
  reviewer_model: gpt-5.6-terra
