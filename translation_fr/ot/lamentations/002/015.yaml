base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/015.yaml
  text: 'All who pass along the road clap their hands at you[a]; they hiss and shake their heads over daughter Jerusalem: “Is this the city that they called the perfection of beauty[c][b], the joy of all the earth?”'
translation:
  language: fr
  text: 'Tous les passants battent des mains contre toi ; ils sifflent[a] et secouent la tête contre la fille de Jérusalem[b] : « Est-ce là la ville dont on disait : “La perfection de la beauté, la joie de toute la terre” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussent des sifflements » ; le verbe hébreu peut désigner un son aigu de dérision, rendu par « siffler » ou « pousser des sifflements ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fille Jérusalem », personnification poétique de la ville.
    reason: cultural_note
lexical_decisions:
- source_word: סָפְקוּ ... כַּפַּיִם
  choice: battent des mains
  rationale: L’expression désigne le fait de frapper les paumes l’une contre l’autre, ici comme geste de moquerie. « Battent des mains » est naturel en français et conserve le geste concret.
- source_word: עָלַיִךְ
  choice: en te voyant
  rationale: La préposition oriente le geste hostile vers Jérusalem. Cette formulation idiomatique évite l’étrange « battent des mains sur toi » tout en gardant Jérusalem comme cible de la dérision.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: tous ceux qui passent sur le chemin
  rationale: La traduction conserve la mention explicite du chemin et désigne naturellement les voyageurs de passage.
- source_word: שָׁרְקוּ
  choice: sifflent
  rationale: Le verbe évoque un son aigu, sifflement ou chuintement, qui exprime ici le mépris. « Sifflent » garde l’image sonore et l’ambiguïté lexicale.
- source_word: וַיָּנִעוּ רֹאשָׁם
  choice: secouent la tête
  rationale: Il s’agit d’un geste conventionnel de mépris ou de stupeur. « Secouent la tête » est l’expression française moderne la plus naturelle.
- source_word: עַל בַּת יְרוּשָׁלָם
  choice: devant la fille de Jérusalem
  rationale: « Devant » relie naturellement le geste à la cité prise pour cible, tandis que « fille de Jérusalem » maintient la personnification poétique hébraïque.
- source_word: הֲזֹאת הָעִיר
  choice: Est-ce là la ville
  rationale: Cette tournure rend directement la question rhétorique chargée de mépris.
- source_word: שֶׁיֹּאמְרוּ
  choice: dont on disait
  rationale: L’imparfait français exprime la réputation habituelle que Jérusalem avait autrefois, sans préciser indûment l’identité des locuteurs.
- source_word: כְּלִילַת יֹפִי
  choice: la perfection de la beauté
  rationale: La formulation nominale conserve l’idée d’une beauté complète ou accomplie ainsi que la densité poétique de l’hébreu.
- source_word: מָשׂוֹשׂ לְכָל הָאָרֶץ
  choice: la joie de toute la terre
  rationale: Cette traduction concise conserve le caractère nominal de l’expression et sa portée universelle.
