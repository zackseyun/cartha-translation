source:
  edition: WLC
  text: פָּצ֨וּ עָלַ֤יִ/ךְ פִּי/הֶם֙ כָּל א֣וֹיְבַ֔יִ/ךְ שָֽׁרְקוּ֙ וַ/יַּֽחַרְקוּ שֵׁ֔ן אָמְר֖וּ בִּלָּ֑עְנוּ אַ֣ךְ זֶ֥ה הַ/יּ֛וֹם שֶׁ/קִּוִּינֻ֖/הוּ מָצָ֥אנוּ רָאִֽינוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/016.yaml
  text: All your enemies open their mouths against you[a]; they hiss and gnash their teeth. They say, “We have swallowed you up! Surely this is the day we hoped for; we have found it[b], we have seen it.”
translation:
  language: fr
  text: 'Tous tes ennemis ouvrent grand la bouche contre toi ; ils sifflent[a] et grincent des dents. Ils disent : « Nous l’avons engloutie[b] ! Oui, voici le jour que nous espérions ; nous l’avons trouvé, nous l’avons vu ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu désigne un sifflement ou un coup de sifflet ; selon le contexte, ce geste peut exprimer la dérision ou la stupeur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Nous l’avons avalée. » Le pronom hébreu est féminin et renvoie à Sion ou à Jérusalem personnifiée.'
    reason: metaphor_and_pronominal_reference
lexical_decisions:
- source_word: פָּצוּ
  choice: ouvrent grand
  rationale: Le verbe désigne l’action d’ouvrir largement, ici la bouche ; « ouvrent grand la bouche » conserve la vigueur de l’image en français naturel.
- source_word: עָלַיִךְ
  choice: contre toi
  rationale: Dans ce contexte d’hostilité dirigée vers Sion, la préposition exprime l’opposition.
- source_word: כָּל אֹיְבַיִךְ
  choice: tous tes ennemis
  rationale: Rend directement la totalité du groupe et maintient l’adresse à la deuxième personne féminine.
- source_word: שָׁרְקוּ
  choice: sifflent avec mépris
  rationale: Le verbe peut évoquer un sifflement exprimant la dérision ou la stupeur ; le complément explicite ici sa valeur hostile et évite le sens positif possible de « siffler » en français.
- source_word: וַיַּחַרְקוּ שֵׁן
  choice: grincent des dents
  rationale: Expression française courante correspondant au geste de rage et de malveillance décrit par l’hébreu.
- source_word: בִּלָּעְנוּ
  choice: Nous l’avons engloutie
  rationale: Le suffixe objet féminin singulier renvoie à la ville personnifiée, Sion/Jérusalem. « Engloutie » préserve la métaphore vive de la destruction totale.
- source_word: אַךְ זֶה הַיּוֹם
  choice: Oui, voici le jour
  rationale: אַךְ marque ici une affirmation triomphante ; « voici » présente avec force le jour attendu.
- source_word: שֶׁקִּוִּינֻהוּ
  choice: que nous espérions
  rationale: קוה associe attente et espoir ; dans la bouche des ennemis, il exprime leur attente avide de ce jour.
- source_word: מָצָאנוּ
  choice: nous y sommes arrivés
  rationale: Littéralement « nous avons trouvé » sans objet exprimé. L’expression française renvoie naturellement au jour attendu et peut exprimer le fait de l’avoir atteint, sans introduire un pronom ambigu.
- source_word: רָאִינוּ
  choice: nous le voyons
  rationale: 'Rend simplement le verbe « voir » et conserve la culmination de la déclaration : le jour attendu est désormais sous leurs yeux.'
theological_decisions:
- issue: Référent de l’objet de בִּלָּעְנוּ
  choice: 'Féminin singulier : « Nous l’avons engloutie »'
  alternative: 'Deuxième personne : « Nous t’avons engloutie »'
  rationale: Le texte consonantique et la vocalisation massorétique donnent un suffixe objet de troisième personne féminine singulière (-נוּהָ contracté dans la forme), qui renvoie naturellement à Sion/Jérusalem personnifiée, malgré l’adresse à la deuxième personne dans la proposition précédente. La traduction conserve ce changement de personne plutôt que de l’harmoniser.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le parallélisme et la violence imagée du vers hébreu sont conservés. « Avec mépris » explicite la fonction contextuelle du sifflement sans remplacer l’image, tandis que la note signale son amplitude sémantique.
