id: LAM.2.17
reference: Lamentations 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָשָׂ֨ה יְהוָ֜ה אֲשֶׁ֣ר זָמָ֗ם בִּצַּ֤ע אֶמְרָת/וֹ֙ אֲשֶׁ֣ר צִוָּ֣ה מִֽ/ימֵי קֶ֔דֶם הָרַ֖ס וְ/לֹ֣א חָמָ֑ל וַ/יְשַׂמַּ֤ח עָלַ֨יִ/ךְ֙ אוֹיֵ֔ב הֵרִ֖ים קֶ֥רֶן צָרָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/017.yaml
  text: Yahweh has done what he planned[a]; he has fulfilled his word, which he commanded from days of old. He has torn down and has not shown pity; he has made the enemy rejoice over you[c][b]; he has exalted the horn of your foes.
translation:
  language: fr
  text: Yahweh a fait ce qu’il avait projeté ; il a accompli sa parole[a], celle qu’il avait ordonnée depuis les temps anciens[b]. Il a détruit et n’a pas eu pitié ; il a fait se réjouir l’ennemi à tes dépens ; il a relevé la corne[c] de tes adversaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a mis sa parole à exécution » ou « a mené sa parole à son terme ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis les jours d’autrefois », c’est-à-dire depuis longtemps.'
    reason: lexical_alternative
  - marker: c
    text: Dans la Bible, la « corne » représente la force, la puissance ou l’honneur.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel représenté par le tétragramme, au lieu de lui substituer un titre.
- source_word: זָמָם
  choice: avait projeté
  rationale: Exprime une intention délibérée et antérieure que Yahweh met effectivement en œuvre.
- source_word: בִּצַּע אֶמְרָתוֹ
  choice: a accompli sa parole
  rationale: Rend l’idée de mener à son terme une parole prononcée, tout en restant naturel en français.
- source_word: אֲשֶׁר צִוָּה
  choice: celle qu’il avait ordonnée
  rationale: Préserve la force de צִוָּה, qui présente cette parole comme un ordre ou décret divin, sans la réduire à une simple prédiction.
- source_word: מִימֵי קֶדֶם
  choice: depuis les temps anciens
  rationale: Transpose clairement l’idiome temporel hébreu tout en conservant sa tonalité poétique.
- source_word: הָרַס
  choice: a démoli
  rationale: Garde l’image concrète d’une destruction comparable à la démolition d’une ville ou de ses ouvrages.
- source_word: וְלֹא חָמָל
  choice: n’a pas eu pitié
  rationale: Conserve explicitement la dimension affective du verbe plutôt que de rendre seulement l’idée de ne pas épargner.
- source_word: וַיְשַׂמַּח עָלַיִךְ אוֹיֵב
  choice: a fait se réjouir l’ennemi à tes dépens
  rationale: Reproduit la valeur causative du verbe et le triomphe hostile de l’ennemi sur la destinataire féminine, Jérusalem ou Sion.
- source_word: הֵרִים קֶרֶן
  choice: a relevé la corne
  rationale: Préserve l’image biblique de la corne tout en exprimant son élévation.
- source_word: צָרָיִךְ
  choice: tes adversaires
  rationale: Rend le pluriel hébreu et évite de répéter « ennemi » tout en gardant un registre digne.
theological_decisions:
- issue: L’action divine dans la destruction de Jérusalem
  choice: Yahweh demeure le sujet explicite de l’accomplissement, de la démolition, du refus de pitié et de la joie accordée à l’ennemi.
  alternative: Présenter Dieu comme ayant seulement permis ces événements.
  rationale: La chaîne verbale hébraïque attribue directement ces actions à Yahweh. La traduction conserve cette tension théologique sans atténuer sa causalité.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe en propositions parallèles reflète le rythme de la lamentation. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
