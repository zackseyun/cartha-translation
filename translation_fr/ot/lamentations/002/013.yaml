base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/013.yaml
  text: What can I testify for you? What can I compare you to[a], daughter Jerusalem? What can I liken to you, so that I may comfort you, virgin daughter Zion? For your fracture is as great as the sea[b]; who can heal you?
translation:
  language: fr
  text: 'Quel témoignage puis-je rendre à ton sujet[a] ? À quoi te comparer, fille de Jérusalem ? À quoi t’assimiler pour te consoler, vierge, fille de Sion ? Car ta ruine est vaste comme la mer[b] : qui peut te guérir ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quel témoignage puis-je rendre pour toi ? » ou, plus largement, « Que puis-je dire à ton sujet ? » Le verbe hébreu relève du témoignage, mais la tournure est difficile.
    reason: lexical_alternative
  - marker: b
    text: Ou « ta fracture », « ta blessure » ou « ton effondrement ». Le mot hébreu désigne ce qui est brisé ou détruit ; « ruine » convient ici à Jérusalem personnifiée, tandis que la suite parle de guérison.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲעִידֵךְ
  choice: Quel témoignage puis-je rendre à ton sujet ?
  rationale: La tournure hébraïque est difficile. Cette formulation conserve le champ lexical du témoignage tout en restant compréhensible en français ; la note signale les autres rapports possibles entre le témoin et Jérusalem.
- source_word: אֲדַמֶּה לָּךְ
  choice: À quoi te comparer
  rationale: Rend directement l’idée de chercher un terme de comparaison, avec une tournure idiomatique en français moderne.
- source_word: הַבַּת יְרוּשָׁלִַם
  choice: fille de Jérusalem
  rationale: Conserve la personnification féminine de la ville sans ajouter de qualificatif absent de l’hébreu.
- source_word: אַשְׁוֶה לָּךְ
  choice: À quoi t’assimiler
  rationale: Préserve le parallélisme avec le verbe précédent tout en rendant la légère variation lexicale de l’hébreu.
- source_word: וַאֲנַחֲמֵךְ
  choice: pour te consoler
  rationale: Le contexte indique que trouver une comparaison pourrait permettre la consolation ; l’infinitif de but exprime naturellement ce lien en français.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: vierge, fille de Sion
  rationale: Conserve le sens ordinaire de בְּתוּלָה et l’adresse poétique à la ville. La virgule évite l’enchaînement peu naturel « vierge fille de Sion » sans effacer l’apposition.
- source_word: שִׁבְרֵךְ
  choice: ta ruine
  rationale: שֶׁבֶר désigne une cassure, un effondrement ou un désastre. Pour une ville personnifiée, « ruine » garde l’idée d’effondrement et s’accorde avec la question métaphorique de la guérison ; les autres possibilités sont indiquées en note.
- source_word: גָדוֹל כַּיָּם
  choice: vaste comme la mer
  rationale: « Vaste » exprime naturellement l’immensité évoquée par la comparaison avec la mer, là où « grande comme la mer » serait moins idiomatique.
- source_word: מִי יִרְפָּא לָךְ
  choice: qui peut te guérir ?
  rationale: Conserve le verbe concret « guérir » et rend la force rhétorique de la question, qui souligne l’extrême gravité du mal.
theological_decisions:
- issue: Portée de l’expression « vierge, fille de Sion »
  choice: Maintien de l’image civique féminine sans l’interpréter
  alternative: Remplacer « vierge » par « jeune fille » ou expliciter une doctrine liée à la pureté
  rationale: Le texte personnifie Sion sous les traits d’une vierge ; il ne faut ni atténuer le terme lexical ni lui imposer une portée doctrinale ou morale que ce verset n’explicite pas.
translation_notes:
  register: Français international moderne, poétique et digne. Les trois interrogations successives et la personnification de Jérusalem/Sion sont maintenues. La variation « comparer / assimiler » reflète les deux verbes hébreux sans alourdir le verset.
