base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/009.yaml
  text: Her gates have sunk into the earth; he has destroyed and broken her bars[a]. Her king and her princes are among the nations; there is no law. Even her prophets have found no vision from Yahweh.
translation:
  language: fr
  text: Ses portes se sont enfoncées dans la terre ; il a détruit et brisé ses barres. Son roi et ses princes sont parmi les nations ; il n’y a pas de loi[a]. Même ses prophètes n’ont trouvé aucune vision venant de YHWH.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il n’y a pas d’instruction ». Le mot hébreu torah peut désigner la loi, l’instruction ou l’enseignement.'
    reason: alternative lexicale
lexical_decisions:
- source_word: טָבְעוּ בָאָרֶץ
  choice: se sont enfoncées dans la terre
  rationale: Le verbe exprime l’enfoncement ou l’engloutissement. Cette formulation française conserve l’image poétique des portes effondrées dans le sol.
- source_word: בְּרִיחֶיהָ
  choice: ses barres
  rationale: Le terme désigne les barres qui assuraient la fermeture des portes de la ville. « Barres » reste concret et concis.
- source_word: מַלְכָּהּ וְשָׂרֶיהָ
  choice: son roi et ses princes
  rationale: « Princes » préserve la dimension politique et nobiliaire de שָׂרִים, sans l’aplatir en « responsables » ou « dirigeants ».
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: Cette traduction courante de גּוֹיִם évite d’introduire explicitement la notion d’exil, qui est contextuellement probable mais non formulée dans le syntagme.
- source_word: אֵין תּוֹרָה
  choice: il n’y a plus de loi
  rationale: תּוֹרָה peut désigner la loi aussi bien que l’instruction. « Il n’y a plus de loi » exprime naturellement en français l’absence constatée dans la situation présente, tandis que l’autre sens est signalé en note.
- source_word: לֹא מָצְאוּ חָזוֹן מֵיְהוָה
  choice: n’ont trouvé aucune vision venant de YHWH
  rationale: La formulation conserve le verbe « trouver » et présente la vision comme provenant de YHWH, sans transformer le texte en une affirmation plus générale sur toute révélation.
theological_decisions:
- issue: Sujet implicite de אִבַּד et וְשִׁבַּר
  choice: Conserver le sujet sous la forme du pronom « il » sans nommer explicitement YHWH.
  alternative: « YHWH a détruit et brisé »
  rationale: Les verbes hébreux sont à la troisième personne du singulier sans sujet exprimé dans cette proposition. Le contexte désigne fortement YHWH, mais le pronom respecte l’implicite du texte.
- issue: Sens de תּוֹרָה dans ce contexte
  choice: Employer « loi » dans le texte principal.
  alternative: « enseignement » ou « instruction »
  rationale: Dans cette lamentation sur l’effondrement de Jérusalem, le mot peut évoquer à la fois l’ordre de l’alliance et l’enseignement faisant autorité. Le texte principal retient le sens concis « loi » et la note préserve l’autre possibilité.
- issue: Rendu du nom divin יהוה
  choice: YHWH
  alternative: « le SEIGNEUR » ou « Yahweh »
  rationale: La forme YHWH représente directement le tétragramme hébreu sans imposer une vocalisation incertaine ni le remplacer par un titre.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe poétique claire. La personnification féminine de Jérusalem est maintenue par les possessifs, et le parallélisme entre l’effondrement politique et le silence prophétique est préservé.
