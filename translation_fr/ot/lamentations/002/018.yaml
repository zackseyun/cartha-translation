  text: צָעַ֥ק לִבָּ֖/ם אֶל אֲדֹנָ֑/י חוֹמַ֣ת בַּת צִ֠יּוֹן הוֹרִ֨ידִי כַ/נַּ֤חַל דִּמְעָה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אַֽל תִּתְּנִ֤י פוּגַת֙ לָ֔/ךְ אַל תִּדֹּ֖ם בַּת עֵינֵֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/018.yaml
  text: 'Their heart cried out to the Lord[a], O wall of daughter Zion: let tears run down like a stream day and night; give yourself no relief[c][b]; let not the apple of your eye rest.'
translation:
  language: fr
  text: Leur cœur a crié vers le Seigneur[a]. Ô muraille de la fille de Sion, fais couler tes larmes comme un cours d’eau[b], jour et nuit ! Ne t’accorde aucun répit ; que la prunelle de ton œil ne cesse pas de pleurer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Leurs cœurs ont crié vers le Seigneur. » L’hébreu emploie le singulier « cœur » avec un suffixe pluriel, probablement dans un sens collectif.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner un torrent, un oued ou son lit.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « que la fille de ton œil ne reste pas immobile ». Cette expression désigne la prunelle, ou l’œil lui-même, qui doit continuer à verser des larmes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָעַק לִבָּם
  choice: Leur cœur a crié
  rationale: Le singulier « cœur » avec suffixe pluriel est conservé comme expression collective ; « a crié » rend l’intensité du verbe sans alourdir la phrase.
- source_word: אֶל אֲדֹנָי
  choice: vers le Seigneur
  rationale: Le titre divin אֲדֹנָי désigne ici le Dieu d’Israël ; « vers » convient naturellement au mouvement de l’appel adressé à Dieu.
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: Muraille de la fille de Sion
  rationale: La tournure est comprise comme une apostrophe. « Muraille » rend חוֹמָה, tandis que « fille de Sion » maintient la personnification sémitique de la ville.
- source_word: הוֹרִידִי כַנַּחַל דִּמְעָה
  choice: fais couler tes larmes comme un torrent
  rationale: L’impératif causatif féminin s’adresse à la muraille personnifiée. נַחַל peut désigner un cours d’eau ou un torrent ; « torrent » exprime ici l’écoulement abondant et continu.
- source_word: יוֹמָם וָלַיְלָה
  choice: jour et nuit
  rationale: Cette expression indique naturellement une durée ininterrompue.
- source_word: אַל תִּתְּנִי פוּגַת לָךְ
  choice: Ne t’accorde aucun répit
  rationale: פּוּגָה signifie une pause ou un répit ; le choix évite de suggérer spécifiquement le sommeil.
- source_word: אַל תִּדֹּם בַּת עֵינֵךְ
  choice: que la prunelle de ton œil ne cesse pas de pleurer
  rationale: Littéralement, la « fille de l’œil » ne doit pas rester immobile ou silencieuse. La formulation française explicite l’image de l’œil qui pleure sans interruption, tout en conservant « prunelle ».
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: mon Seigneur
  rationale: Le contexte présente אֲדֹנָי comme titre du Dieu d’Israël. Le texte massorétique ne comporte pas ici de suffixe possessif imposant « mon ».
- issue: Référent du cri initial
  choice: Leur cœur a crié vers le Seigneur
  alternative: 'Leur cœur crie : « Seigneur ! »'
  rationale: La préposition אֶל marque le destinataire du cri. La traduction ne transforme donc pas le titre divin en contenu explicite du cri.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La ponctuation distingue la déclaration initiale de l’apostrophe à la muraille personnifiée. « Fille de Sion » conserve l’image biblique ; « torrent » et « répit » restent courants sans être familiers.
