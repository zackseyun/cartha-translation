source:
  edition: WLC
  text: בִּלַּ֨ע אֲדֹנָ֜/י לא חָמַ֗ל אֵ֚ת כָּל נְא֣וֹת יַעֲקֹ֔ב הָרַ֧ס בְּ/עֶבְרָת֛/וֹ מִבְצְרֵ֥י בַת יְהוּדָ֖ה הִגִּ֣יעַ לָ/אָ֑רֶץ חִלֵּ֥ל מַמְלָכָ֖ה וְ/שָׂרֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/002.yaml
  text: The Lord has swallowed up[a], without pity, all the pastures of Jacob; in his wrath he has torn down the strongholds of daughter Judah; he has brought them down to the ground[c][b]; he has defiled the kingdom and its princes.
translation:
  language: fr
  text: Le Seigneur a englouti[a] sans pitié toutes les demeures de Jacob. Dans sa fureur, il a démoli les forteresses de la fille de Juda et les a fait tomber jusqu’à terre. Il a profané le royaume et ses chefs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a dévoré ». Le verbe hébreu évoque littéralement l’action d’avaler. Le terme traduit par « demeures » peut aussi désigner des pâturages ou des lieux de séjour.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: a englouti
  rationale: Conserve l’image vive d’avaler ou d’engloutir, plutôt que de l’aplatir en « détruire ».
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Traduit le titre divin Adonaï; le texte source n’emploie pas ici le tétragramme.
- source_word: לֹא חָמַל
  choice: sans pitié
  rationale: Expression française concise qui rend l’absence de compassion et le refus d’épargner.
- source_word: נְאוֹת יַעֲקֹב
  choice: les demeures de Jacob
  rationale: Dans ce contexte de destruction de Juda, « demeures » rend naturellement les lieux habités; le sens possible de pâturages est signalé en note.
- source_word: הָרַס
  choice: a démoli
  rationale: Rend précisément l’action d’abattre des ouvrages fortifiés.
- source_word: בְּעֶבְרָתוֹ
  choice: dans sa fureur
  rationale: Exprime l’intensité de עֶבְרָה dans un français poétique actuel.
- source_word: מִבְצְרֵי
  choice: les forteresses
  rationale: Préserve le sens militaire concret des lieux fortifiés.
- source_word: בַת יְהוּדָה
  choice: la fille de Juda
  rationale: Conserve la personnification poétique hébraïque dans une formulation française intelligible.
- source_word: הִגִּיעַ לָאָרֶץ
  choice: les a jetées à terre
  rationale: 'Rend idiomatiquement le causatif: les forteresses ont été amenées jusqu’au sol.'
- source_word: חִלֵּל
  choice: a profané
  rationale: Préserve la nuance de désacralisation ou de déshonneur attachée au piel de חלל.
- source_word: מַמְלָכָה
  choice: le royaume
  rationale: Désigne naturellement ici l’entité politique, en parallèle avec ses dirigeants.
- source_word: וְשָׂרֶיהָ
  choice: et ses chefs
  rationale: « Chefs » est actuel et assez large pour les princes, dirigeants ou hauts responsables désignés par שׂרים.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: Le Seigneur
  alternative: Adonaï
  rationale: Le mot est un titre divin et non le nom YHWH; il est donc traduit sans employer la convention typographique réservée au tétragramme.
- issue: Portée de חִלֵּל appliqué au royaume et à ses chefs
  choice: a profané
  alternative: a déshonoré
  rationale: « Profané » maintient la forte nuance de violation du statut consacré sans préciser davantage la nature exacte de cette consécration.
translation_notes:
  register: Français international moderne, digne et poétique. Les phrases ont été légèrement segmentées pour la lisibilité tout en conservant la progression et les images du vers hébreu.
