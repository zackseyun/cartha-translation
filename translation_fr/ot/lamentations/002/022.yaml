  text: תִּקְרָא֩ כְ/י֨וֹם מוֹעֵ֤ד מְגוּרַ/י֙ מִ/סָּבִ֔יב וְ/לֹ֥א הָיָ֛ה בְּ/י֥וֹם אַף יְהוָ֖ה פָּלִ֣יט וְ/שָׂרִ֑יד אֲשֶׁר טִפַּ֥חְתִּי וְ/רִבִּ֖יתִי אֹיְבִ֥/י כִלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/022.yaml
  text: You summoned my terrors from every side as on an appointed day[a], and on the day of Yahweh’s anger there was no survivor or remnant. Those whom I nurtured and raised[b], my enemy destroyed them.
translation:
  language: fr
  text: Tu as convoqué, comme pour un jour de fête[a], mes terreurs de toutes parts[b]. Au jour de la colère de Yahweh, il n’y eut ni rescapé ni survivant. Ceux que j’avais choyés et élevés, mon ennemi les a exterminés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme pour un jour fixé » / « comme lors d’une fête ». Le mot hébreu peut désigner un moment fixé, notamment une fête où l’on se rassemble.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui me terrifient de toutes parts ». L’expression hébraïque peut désigner les terreurs elles-mêmes ou ceux qui les inspirent.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: תִּקְרָא
  choice: Tu as convoqué
  rationale: Le qal à la 2e personne masculine singulière s’adresse directement à Yahweh. « Convoquer » exprime ici l’appel qui fait venir et se rassembler les instruments de terreur.
- source_word: כְיוֹם מוֹעֵד
  choice: comme pour un jour de fête
  rationale: מוֹעֵד désigne un temps fixé et, fréquemment, une fête avec rassemblement. Cette formulation française rend l’ironie d’un rassemblement de terreurs comparable à celui d’une fête, sans effacer le sens plus large signalé en note.
- source_word: מְגוּרַי מִסָּבִיב
  choice: mes terreurs de toutes parts
  rationale: מְגוּרַי est compris comme ce qui inspire l’effroi à la locutrice; מִסָּבִיב évoque l’encerclement. L’autre analyse possible, « ceux qui me terrifient », est conservée en note.
- source_word: בְּיוֹם אַף יְהוָה
  choice: Au jour de la colère de Yahweh
  rationale: אַף désigne ici la colère, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: פָּלִיט וְשָׂרִיד
  choice: ni rescapé ni survivant
  rationale: Les deux substantifs forment une paire qui souligne la destruction totale. « Rescapé » met l’accent sur celui qui échappe au danger, tandis que « survivant » désigne celui qui demeure en vie.
- source_word: טִפַּחְתִּי וְרִבִּיתִי
  choice: j’avais choyés et élevés
  rationale: Les deux verbes décrivent les soins tendres et l’éducation donnés aux enfants. Le plus-que-parfait est naturel en français pour des soins antérieurs à leur destruction.
- source_word: אֹיְבִי כִלָּם
  choice: mon ennemi les a exterminés
  rationale: Le suffixe de première personne est conservé dans « mon ennemi ». Au piel, כלה signifie mener à leur fin ou anéantir; « exterminés » exprime la gravité et la totalité de l’action.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Identité des êtres détruits
  choice: Ceux que j’avais choyés et élevés
  alternative: mes enfants
  rationale: Le contexte suggère fortement des enfants, mais le verset utilise une proposition relative plutôt que le nom « enfants ». La traduction conserve cette formulation et sa portée possible.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement correspond à l’adresse directe à Yahweh. La ponctuation répartit le verset en trois mouvements tout en préservant l’enchaînement du texte hébreu.
