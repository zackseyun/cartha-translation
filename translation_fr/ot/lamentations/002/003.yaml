  text: גָּדַ֣ע בָּֽ/חֳרִי אַ֗ף כֹּ֚ל קֶ֣רֶן יִשְׂרָאֵ֔ל הֵשִׁ֥יב אָח֛וֹר יְמִינ֖/וֹ מִ/פְּנֵ֣י אוֹיֵ֑ב וַ/יִּבְעַ֤ר בְּ/יַעֲקֹב֙ כְּ/אֵ֣שׁ לֶֽהָבָ֔ה אָכְלָ֖ה סָבִֽיב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/003.yaml
  text: In burning anger he has cut down every horn of Israel[a]; he has drawn back his right hand from before the enemy[b], and he has burned in Jacob like a flaming fire that devours all around.
translation:
  language: fr
  text: Dans son ardente colère, il a abattu toute corne d’Israël[a] ; il a retiré sa main droite devant l’ennemi[b] ; il a brûlé au sein de Jacob comme un feu flamboyant qui dévore tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « corne » est, en hébreu, une image de la force ou de la puissance.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « il a retiré sa main droite de devant l’ennemi ». L’image évoque le retrait de sa puissance ou de sa protection.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַע
  choice: a abattu
  rationale: Le verbe exprime l’action de couper ou d’abattre avec violence. « Abattre » convient naturellement à l’image de la corne brisée et conserve la force destructrice du texte.
- source_word: בָּחֳרִי אַף
  choice: dans son ardente colère
  rationale: חֳרִי évoque la chaleur ou l’embrasement de la colère. « Ardente colère » est idiomatique et maintient le champ lexical du feu développé dans la suite du verset.
- source_word: כֹּל קֶרֶן יִשְׂרָאֵל
  choice: toute corne d’Israël
  rationale: La corne est une métaphore hébraïque de la force, de la puissance ou de la dignité. La conserver respecte l’imagerie poétique, tandis qu’une note en éclaire le sens.
- source_word: הֵשִׁיב אָחוֹר יְמִינוֹ
  choice: il a retiré sa main droite
  rationale: L’expression représente le retrait volontaire de la puissance protectrice de Dieu. « Retirer » rend clairement le mouvement vers l’arrière sans remplacer l’image par son interprétation.
- source_word: מִפְּנֵי אוֹיֵב
  choice: devant l’ennemi
  rationale: La locution signifie littéralement « de devant la face de l’ennemi ». En français, « devant l’ennemi » conserve l’ambiguïté entre retrait en sa présence et retrait face à lui.
- source_word: וַיִּבְעַר בְּיַעֲקֹב
  choice: il a brûlé en Jacob
  rationale: Le verbe בער décrit le fait de brûler ou de s’embraser. Avec בְּ, la formulation situe le feu destructeur au sein de Jacob et prépare directement la comparaison suivante.
- source_word: כְּאֵשׁ לֶהָבָה
  choice: comme un feu flamboyant
  rationale: Cette expression française naturelle conserve l’intensification produite en hébreu par l’association du feu et de la flamme.
- source_word: אָכְלָה סָבִיב
  choice: qui dévore tout autour
  rationale: Le verbe féminin se rapporte à l’image du feu. « Dévore » restitue sa personnification vive, et « tout autour » exprime l’étendue de la destruction.
theological_decisions:
- issue: Langage métaphorique du jugement divin
  choice: Conserver les images de la corne, de la main droite et du feu.
  alternative: Remplacer « corne » par « force », « main droite » par « puissance protectrice », ou expliciter le feu comme une simple image du jugement.
  rationale: Ces métaphores superposent la puissance d’Israël abattue, la protection divine retirée et le jugement qui consume. Les interpréter directement dans le corps du texte réduirait la tension poétique et théologique de l’hébreu.
- issue: Référent implicite de « il a brûlé »
  choice: Maintenir le sujet divin sous la forme personnelle « il a brûlé en Jacob ».
  alternative: Traduire explicitement « sa colère a brûlé » ou « il a allumé un feu contre Jacob ».
  rationale: Le texte hébreu garde Dieu comme sujet grammatical tout en le comparant à un feu. La traduction préserve cette formulation saisissante sans introduire un sujet ou une orientation absents du texte.
translation_notes:
  register: 'Français international moderne, digne et poétique. La syntaxe reste claire tout en conservant les métaphores concrètes et la progression du texte hébreu : force abattue, protection retirée, feu dévorant.'
