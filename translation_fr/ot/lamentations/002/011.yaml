source:
  edition: WLC
  text: כָּל֨וּ בַ/דְּמָע֤וֹת עֵינַ/י֙ חֳמַרְמְר֣וּ מֵעַ֔/י נִשְׁפַּ֤ךְ לָ/אָ֨רֶץ֙ כְּבֵדִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּ֑/י בֵּֽ/עָטֵ֤ף עוֹלֵל֙ וְ/יוֹנֵ֔ק בִּ/רְחֹב֖וֹת קִרְיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/011.yaml
  text: My eyes are spent with tears[a]; my inward parts churn; my liver is poured out to the earth because of the destruction of the daughter of my people[d][c][b], because infant and nursing child faint in the streets of the city.
translation:
  language: fr
  text: Mes yeux s’épuisent à force de larmes ; mes entrailles bouillonnent ; mon foie se déverse à terre[a] à cause du désastre de la fille de mon peuple[b], tandis que petits enfants et nourrissons défaillent dans les rues de la cité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « mon foie se déverse à terre ». Dans cette poésie de lamentation, le foie et les entrailles représentent le siège d’une détresse profonde.'
    reason: cultural_note
  - marker: b
    text: « La fille de mon peuple » est une personnification poétique hébraïque du peuple et, dans ce contexte, de sa ville.
    reason: cultural_note
lexical_decisions:
- source_word: כָּלוּ בַדְּמָעוֹת עֵינַי
  choice: Mes yeux s’épuisent à force de larmes
  rationale: Le verbe exprime l’épuisement ou l’exténuation. « À force de larmes » rend naturellement en français la valeur circonstancielle ou causale de la préposition tout en conservant l’image corporelle.
- source_word: חֳמַרְמְרוּ מֵעַי
  choice: mes entrailles bouillonnent
  rationale: Le verbe rare évoque une agitation viscérale, possiblement un bouillonnement. « Entrailles » maintient l’anthropologie corporelle hébraïque sans la remplacer par « cœur ».
- source_word: נִשְׁפַּךְ לָאָרֶץ כְּבֵדִי
  choice: mon foie se répand à terre
  rationale: La formulation conserve l’organe concret et l’image saisissante d’un effondrement intérieur qui se déverse vers le sol. Le présent français convient au parallélisme poétique malgré la forme accomplie hébraïque.
- source_word: עַל שֶׁבֶר
  choice: à cause du désastre qui frappe
  rationale: שֶׁבֶר peut désigner fracture, ruine ou désastre. Dans le contexte de la catastrophe collective, « désastre » est concret et naturel ; « qui frappe » relie idiomatiquement ce nom à son complément sans effacer l’image sous-jacente de brisure.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: La personnification poétique hébraïque est conservée plutôt que remplacée par une paraphrase, et une note en explique la portée.
- source_word: בְּעָטֵף
  choice: tandis que … défaillent
  rationale: L’infinitif construit décrit la scène concomitante qui motive la lamentation. « Défaillent » rend l’affaiblissement allant jusqu’à l’effondrement, sans imposer la mort ; « tandis que » préserve mieux que « parce que » l’ambiguïté circonstancielle de בְּ.
- source_word: עוֹלֵל וְיוֹנֵק
  choice: petits enfants et nourrissons
  rationale: Le premier terme désigne de très jeunes enfants et le second ceux qui tètent encore. Cette paire est claire et naturelle en français moderne, même si les catégories peuvent se chevaucher.
- source_word: בִּרְחֹבוֹת קִרְיָה
  choice: sur les places de la cité
  rationale: רְחֹבוֹת désigne ici les espaces ouverts ou places urbaines, et קִרְיָה est rendu par le terme poétique mais intelligible « cité ».
theological_decisions:
- issue: Portée de « la fille de mon peuple »
  choice: Conserver la personnification littérale et l’expliquer en note
  alternative: Paraphraser par « mon peuple bien-aimé » ou « la ville de mon peuple »
  rationale: L’expression peut personnifier la communauté et, dans le contexte, Jérusalem, sans que le verset oblige à choisir exclusivement l’une des deux références.
- issue: Relation syntaxique de בְּעָטֵף avec la lamentation précédente
  choice: 'Rendre par la concomitance : « tandis que »'
  alternative: 'Rendre explicitement la cause : « parce que »'
  rationale: La scène des enfants qui défaillent explique certainement la douleur, mais la préposition בְּ avec l’infinitif peut aussi marquer le temps ou la circonstance. La traduction évite de réduire cette souplesse à une causalité explicite.
translation_notes:
  register: Français international actuel, digne et poétique. Les images corporelles fortes de l’hébreu sont maintenues. La ponctuation en trois membres restitue l’intensification du vers, et « cité » conserve une légère élévation poétique sans archaïsme marqué.
