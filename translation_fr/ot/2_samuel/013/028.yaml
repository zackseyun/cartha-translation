  to: 'Absalom donna cet ordre à ses jeunes hommes : « Faites attention : quand le cœur d’Amnon sera égayé par le vin[a], et que je vous dirai : “Frappez Amnon !”, tuez-le. N’ayez pas peur. N’est-ce pas moi qui vous en ai donné l’ordre ? Prenez courage et montrez-vous vaillants. »'
  rationale: La révision remplace une expression française susceptible de suggérer une exécution judiciaire par l’ordre direct de tuer présent dans l’hébreu. Elle améliore aussi légèrement l’idiomaticité de l’ordre initial et de l’exhortation finale, sans modifier le sens, le registre narratif ou l’ambiguïté concernant le degré d’ébriété d’Amnon.
