  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: fr
  text: 'Absalom donna cet ordre à ses jeunes hommes : « Faites attention : quand le cœur d’Amnon sera égayé par le vin[a], et que je vous dirai : “Frappez Amnon !”, tuez-le. N’ayez pas peur. N’est-ce pas moi qui vous en ai donné l’ordre ? Prenez courage et montrez-vous vaillants. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand Amnon sera de bonne humeur grâce au vin ». L’expression hébraïque parle littéralement de son cœur rendu bon par le vin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  choice: ses jeunes hommes
  rationale: Le terme peut désigner des jeunes gens, des serviteurs ou des hommes attachés au service d’un chef. Ici, il s’agit des agents personnels d’Absalom chargés d’exécuter un acte violent ; « jeunes hommes » conserve le sens concret sans les réduire à des domestiques.
- source_word: רְאוּ נָא
  choice: Soyez attentifs
  rationale: L’impératif accompagné de נָא appelle instamment les hommes à guetter le moment indiqué. Cette formulation est naturelle en français moderne et garde la force directive.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: quand le cœur d’Amnon sera égayé par le vin
  rationale: La formulation conserve l’image hébraïque du cœur rendu joyeux par le vin, sans préciser qu’Amnon serait nécessairement ivre.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: Frappez Amnon !
  rationale: Le verbe נכה signifie largement frapper ou porter un coup. « Frappez » laisse au verbe suivant le soin d’expliciter l’issue meurtrière.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: mettez-le à mort
  rationale: Le hiphil de מות exprime le fait de faire mourir. « Mettez-le à mort » distingue clairement l’ordre de tuer du signal initial « Frappez ».
- source_word: אַל תִּירָאוּ
  choice: N’ayez pas peur
  rationale: Interdiction directe, rendue dans un français actuel et ferme.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: N’est-ce pas moi qui vous en ai donné l’ordre ?
  rationale: La question rhétorique souligne l’autorité et la responsabilité personnelles d’Absalom, conformément à l’emphase portée par אָנֹכִי.
- source_word: חִזְקוּ
  choice: Soyez forts
  rationale: L’impératif appelle à la force et au courage ; la traduction directe convient au ton martial.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: montrez-vous vaillants
  rationale: L’expression désigne des hommes courageux et capables, avec une nuance martiale. Dans l’adresse directe à un groupe masculin déjà identifié, « montrez-vous vaillants » transmet naturellement cette qualité sans lourdeur idiomatique.
theological_decisions:
- issue: Expression masculine dans לִבְנֵי חָיִל
  choice: montrez-vous vaillants
  alternative: soyez des hommes vaillants
  rationale: Le contexte établit déjà qu’Absalom s’adresse à ses jeunes hommes. L’accord masculin de « vaillants » maintient ce référent réel, tandis que la tournure verbale rend naturellement l’idiome hébreu en français sans en généraliser l’application.
translation_notes:
  register: Français international moderne, digne et narratif. Les impératifs restent brefs et fermes. L’image hébraïque du cœur est conservée dans le texte, tandis que la note en explique le sens idiomatique.
