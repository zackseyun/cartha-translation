  text: וְ/עָלֶ֨י/הָ֙ כְּתֹ֣נֶת פַּסִּ֔ים כִּי֩ כֵ֨ן תִּלְבַּ֧שְׁןָ בְנוֹת הַ/מֶּ֛לֶךְ הַ/בְּתוּלֹ֖ת מְעִילִ֑ים וַ/יֹּצֵ֨א אוֹתָ֤/הּ מְשָֽׁרְת/וֹ֙ הַ/ח֔וּץ וְ/נָעַ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: fr
  text: Elle portait une tunique d’apparat[a], car c’est ainsi que les filles vierges du roi étaient vêtues de robes. Puis le serviteur d’Amnon la mit dehors et verrouilla la porte derrière elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une tunique richement ornée », « une tunique de plusieurs couleurs » ou « une longue tunique à manches » ; le sens exact de l’expression hébraïque est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: une tunique d’apparat
  rationale: L’expression désigne un vêtement distinctif, mais le sens précis de פַּסִּים demeure incertain. « Tunique d’apparat » exprime le caractère remarquable et prestigieux du vêtement sans imposer l’interprétation traditionnelle « de plusieurs couleurs » ni la seule hypothèse des manches longues.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ ... מְעִילִים
  choice: car c’est ainsi que s’habillaient
  rationale: La construction explique une coutume vestimentaire. Cette formulation française exprime naturellement l’habitude; la notion de robe ou vêtement est déjà portée par la phrase précédente, ce qui évite une répétition lourde.
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: les filles vierges du roi
  rationale: 'Cette traduction conserve explicitement les deux indications du texte hébreu : leur filiation royale et leur virginité, sans réduire cette dernière à la seule idée de célibat.'
- source_word: מְשָׁרְתוֹ
  choice: le serviteur d’Amnon
  rationale: Le terme désigne ici l’homme qui sert personnellement Amnon. Répéter le nom d’Amnon rend le référent de « son serviteur » immédiatement clair en français dans un verset isolé.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: la mit dehors
  rationale: La forme causative signifie qu’il la fait sortir. « La mit dehors » est idiomatique, concise et restitue la rudesse de l’acte sans ajouter une violence physique non explicitée.
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: verrouilla la porte derrière elle
  rationale: נעל indique que la porte est fermée à clé ou au verrou, et non simplement refermée. « Verrouilla » traduit la détermination et le caractère définitif du geste.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Filles vierges » maintient le marqueur social explicite du texte. La répétition du nom d’Amnon clarifie le possessif hébreu dans la lecture isolée du verset.
