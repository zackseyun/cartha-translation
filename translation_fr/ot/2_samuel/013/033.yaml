base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: fr
  text: 'Maintenant, que mon seigneur le roi ne prenne pas à cœur cette affirmation : « Tous les fils du roi sont morts », alors que seul Amnon est mort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers la rectification de Jonadab, dans un français naturel.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: ne prenne pas à cœur
  rationale: Rend naturellement l’expression hébraïque qui signifie littéralement mettre une parole ou une affaire sur son cœur, tout en conservant sa dimension affective.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Conserve la formule respectueuse de la cour adressée au roi.
- source_word: דָּבָר
  choice: cette nouvelle
  rationale: Dans le contexte, le terme désigne le message reçu au sujet des fils du roi. « Nouvelle » explicite ce référent sans le réduire à une simple pensée.
- source_word: לֵאמֹר
  choice: en se disant
  rationale: Introduit naturellement en français le contenu que David ne doit pas accueillir dans son cœur; le sujet implicite reste le roi.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ מֵתוּ
  choice: Tous les fils du roi sont morts
  rationale: Traduction directe de la fausse nouvelle rapportée, avec le présent d’état.
- source_word: כִּי אִם
  choice: En effet, seul
  rationale: 'Rend ici la correction restrictive: contrairement à la rumeur, Amnon seulement est mort.'
- source_word: לְבַדּוֹ
  choice: seul
  rationale: 'Préserve l’insistance sur l’exclusivité: aucun autre fils du roi n’est mort.'
- source_word: מֵת
  choice: est mort
  rationale: Le présent d’état maintient le parallèle et le contraste avec « sont morts ».
