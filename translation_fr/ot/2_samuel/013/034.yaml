base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: fr
  text: Absalom prit la fuite. Le jeune homme qui faisait le guet[a] leva les yeux[b], et voici qu’il vit une grande foule qui arrivait par le chemin derrière lui[c], du côté de la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le guetteur ». L’hébreu associe « jeune homme/serviteur » à un participe signifiant « observer » ou « faire le guet ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « leva son œil » : expression hébraïque signifiant qu’il regarda ou leva les yeux.'
    reason: lexical_alternative
  - marker: c
    text: Ou « venant du chemin derrière lui, du flanc de la montagne ». Les rapports spatiaux sont exprimés de façon condensée en hébreu, et le référent de « lui » n’est pas explicite.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח אַבְשָׁלוֹם
  choice: Absalom prit la fuite
  rationale: ברח exprime la fuite ou l’évasion. « Prendre la fuite » est naturel, digne et conserve la force narrative.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: le jeune homme qui faisait le guet
  rationale: Cette formulation préserve à la fois נַעַר, « jeune homme/serviteur », et le participe צֹפֶה, « celui qui observe/fait le guet », sans lui attribuer trop précisément une fonction officielle.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: leva les yeux
  rationale: L’expression française correspond naturellement à l’idiome hébreu et en conserve l’image.
- source_word: וַיַּרְא וְהִנֵּה
  choice: vit que
  rationale: Dans ce contexte, « vit que » restitue avec fluidité la découverte soudaine signalée par הִנֵּה, sans recourir à l’archaïsant « voici ».
- source_word: עַם רַב
  choice: une foule nombreuse
  rationale: Le collectif עַם qualifié par רַב désigne ici un grand nombre de personnes; « foule nombreuse » est idiomatique sans préciser indûment leur organisation.
- source_word: הֹלְכִים
  choice: arrivait
  rationale: הלך désigne le déplacement; du point de vue de l’observateur, le groupe s’approche. Le singulier s’accorde avec le collectif français « foule ».
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: par le chemin derrière lui, du côté de la montagne
  rationale: La formulation reste proche de la syntaxe spatiale comprimée de l’hébreu et en préserve l’ambiguïté plutôt que d’identifier arbitrairement le référent de « lui ».
