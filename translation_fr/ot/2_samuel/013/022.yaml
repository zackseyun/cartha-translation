base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: fr
  text: Absalom ne parla pas à Amnon, ni en mal ni en bien[a], car Absalom haïssait Amnon parce que celui-ci avait fait violence à Tamar, la sœur d’Absalom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ni en mal ni en bien » ; cette expression signifie qu’Absalom n’adressait aucune parole à Amnon.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avait humilié Tamar ». Dans ce contexte, le verbe hébreu désigne la violence sexuelle qu’Amnon lui avait infligée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: parla à
  rationale: En français courant, « parler à quelqu’un » rend naturellement la construction hébraïque sans préciser davantage la nature de l’échange.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: ni en mal ni en bien
  rationale: Cette formulation conserve les deux pôles de l’expression hébraïque, laquelle signifie ici qu’Absalom n’adressa aucune parole à Amnon.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du silence d’Absalom ; « car » exprime clairement ce rapport causal.
- source_word: שָׂנֵא
  choice: haïssait
  rationale: Le verbe exprime directement une haine forte ; l’imparfait convient à l’état qui explique le comportement d’Absalom.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: parce que
  rationale: La locution introduit ici le motif de la haine. « Parce que » en donne le sens causal dans un français naturel.
- source_word: עִנָּה
  choice: avait fait violence à
  rationale: Dans le contexte de l’agression sexuelle racontée précédemment, le verbe désigne la violence et l’humiliation infligées à Tamar. Cette expression rend la gravité de l’acte sans réduire le champ du verbe à un terme juridique moderne.
- source_word: אֲחֹתוֹ
  choice: sa sœur
  rationale: La formulation simple conserve le lien familial mis en avant par le texte hébreu.
