translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque finale est répartie en deux phrases pour une lecture naturelle, sans modifier la progression de la scène. Le marqueur [a] est placé après « se leva » conformément à la couche de consultation anglaise, bien que la note explique le geste mentionné immédiatement après.
