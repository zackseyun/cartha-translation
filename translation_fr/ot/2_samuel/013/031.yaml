  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: fr
  text: Alors le roi se leva, déchira ses vêtements[a] et se coucha par terre. Tous ses serviteurs se tenaient debout, les vêtements déchirés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements était, dans la Bible hébraïque, une manière habituelle d’exprimer le chagrin, l’effroi ou le deuil.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal wayyiqtol de קום marque l’action suivante dans le récit. « Se leva » rend naturellement la réaction soudaine du roi.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne David par son titre; la traduction conserve ce titre sans expliciter son nom.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: déchira ses vêtements
  rationale: L’expression désigne le geste conventionnel consistant à déchirer ses habits sous l’effet du deuil, de l’effroi ou d’une profonde détresse. « Vêtements » convient au registre narratif digne sans être archaïque.
- source_word: וַיִּשְׁכַּב אַרְצָה
  choice: se coucha par terre
  rationale: שכב exprime ici le fait de se coucher, et אַרְצָה indique le mouvement vers le sol. Cette formulation française rend à la fois le mouvement et la posture.
- source_word: וְכָל־עֲבָדָיו
  choice: Tous ses serviteurs
  rationale: עֲבָדִים peut désigner les serviteurs ou membres de l’entourage royal. « Serviteurs » reste direct et n’impose pas un rang administratif précis.
- source_word: נִצָּבִים
  choice: se tenaient debout
  rationale: Le participe niphal décrit leur état ou leur posture durable dans la scène. « Se tenaient debout » restitue cette nuance mieux que le simple « se levèrent ».
- source_word: קְרֻעֵי בְגָדִים
  choice: les vêtements déchirés
  rationale: Le participe passif décrit l’état résultant de leurs vêtements. La construction détachée est naturelle en français et conserve ce sens.
