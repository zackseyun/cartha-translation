base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: fr
  text: 'Alors il appela le jeune homme qui était à son service et lui dit : « Faites donc sortir celle-là[a], loin de moi, dehors, et verrouille[b] la porte derrière elle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « celle-ci » ou « celle-là » ; le féminin désigne Tamar sur un ton volontairement distant et méprisant.
    reason: lexical_alternative
  - marker: b
    text: Le premier ordre (« faites sortir ») est au pluriel en hébreu, tandis que le second (« verrouille ») est au singulier, bien qu’un seul serviteur vienne d’être mentionné.
    reason: textual_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: le jeune homme qui était à son service
  rationale: נַעַר désigne ici un jeune homme attaché au service personnel d’Amnon, et מְשָׁרְתוֹ précise sa fonction. Cette formulation française conserve les deux éléments sans les réduire au seul titre de « serviteur ».
- source_word: שִׁלְחוּ נָא
  choice: Faites donc sortir
  rationale: Le verbe exprime l’action de faire partir ou sortir, tandis que נָא nuance l’ordre. « donc » rend ici cette particule sans donner à l’ordre cruel une politesse artificielle.
- source_word: זֹאת
  choice: celle-là
  rationale: Le démonstratif féminin désigne Tamar sans la nommer. « Celle-là » conserve en français la distance et le mépris du propos, sans ajouter le nom « femme » absent de l’hébreu.
- source_word: מֵעָלַי הַחוּצָה
  choice: de chez moi, dehors
  rationale: מֵעָלַי indique ici l’éloignement hors de la présence d’Amnon, et הַחוּצָה précise la direction vers l’extérieur. La légère insistance de la formulation française reflète celle de l’hébreu.
- source_word: וּנְעֹל
  choice: et verrouille
  rationale: נעל peut signifier barrer, verrouiller ou fermer à clé. « Verrouiller » convient à une porte que l’on ferme solidement sans imposer un mécanisme trop précis.
- source_word: אַחֲרֶיהָ
  choice: derrière elle
  rationale: Dans le contexte de la fermeture d’une porte après le départ de quelqu’un, c’est l’équivalent idiomatique français de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Celle-là » laisse entendre le mépris d’Amnon sans ajouter un substantif absent du texte. Le passage du pluriel au singulier dans les impératifs est conservé et signalé en note plutôt que discrètement harmonisé.
