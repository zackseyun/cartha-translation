  text: When King David heard all these things[a], he was very angry.
translation:
  language: fr
  text: Quand le roi David apprit toutes ces choses, il se mit très en colère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « cela brûla fortement pour lui » ; expression idiomatique signifiant qu’il fut très en colère.'
