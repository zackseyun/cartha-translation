lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Quand le roi David
  rationale: Le waw relie les événements du récit et se rend naturellement ici par une proposition temporelle. « Le roi David » traduit directement le titre défini et le nom propre.
- source_word: שָׁמַע
  choice: apprit
  rationale: Le verbe signifie fondamentalement « entendre »; dans ce contexte, David reçoit le récit des événements. « Apprit » exprime naturellement en français cette prise de connaissance.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: tout ce qui s’était passé
  rationale: דְּבָרִים peut désigner des paroles, des faits ou des événements. Ici, l’expression renvoie à l’ensemble de l’affaire concernant Tamar et Amnon; cette formulation française est claire sans réduire le sens à de simples paroles.
- source_word: וַ/יִּחַר ל/וֹ מְאֹד
  choice: il entra dans une grande colère
  rationale: L’expression hébraïque décrit littéralement quelque chose qui brûle fortement en lui et constitue un idiome de colère intense. La formulation retenue est naturelle, actuelle et conserve la force du texte.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple « apprit » convient au récit biblique écrit; l’expression « entra dans une grande colère » restitue clairement l’intensité de l’idiome hébreu.
