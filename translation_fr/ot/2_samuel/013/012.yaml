source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אָחִ/י֙ אַל תְּעַנֵּ֔/נִי כִּ֛י לֹא יֵֽעָשֶׂ֥ה כֵ֖ן בְּ/יִשְׂרָאֵ֑ל אַֽל תַּעֲשֵׂ֖ה אֶת הַ/נְּבָלָ֥ה הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: fr
  text: 'Elle lui dit : « Non, mon frère ! Ne me fais pas violence[a], car cela ne se fait pas en Israël. Ne commets pas cette infamie[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne m’humilie pas » ou « ne me viole pas ». Le verbe hébreu peut exprimer une atteinte mêlant violence sexuelle, humiliation et déshonneur.
    reason: lexical_alternative
  - marker: b
    text: Ou « cet acte ignoble » ou « cet outrage ». Le terme hébreu désigne un acte moralement scandaleux, et non une simple sottise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: Elle lui dit
  rationale: Le wayyiqtol introduit la prise de parole dans la continuité du récit. En français naturel, il n’est pas nécessaire de rendre explicitement la conjonction initiale.
- source_word: אַל אָחִי אַל
  choice: Non, mon frère ! Ne… pas
  rationale: Le premier אַל a ici la force d’une protestation urgente, tandis que le second introduit une défense. Cette formulation conserve l’intensité de l’appel et le lien familial, essentiel dans ce contexte.
- source_word: תְּעַנֵּנִי
  choice: ne me fais pas violence
  rationale: Au piel, ענה peut désigner le fait d’humilier ou de violer une femme, notamment par une violence sexuelle. « Faire violence à » convient au contexte sans réduire le terme à une seule nuance et conserve à la fois l’idée d’agression et celle d’atteinte à la dignité.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: car cela ne se fait pas en Israël
  rationale: Le niphal impersonnel de עשה exprime ici une norme morale et communautaire. La tournure française restitue naturellement cette idée.
- source_word: אַל תַּעֲשֵׂה
  choice: Ne commets pas
  rationale: Avec pour complément un nom désignant un acte moralement scandaleux, « commettre » est plus idiomatique en français que « faire » tout en conservant la force de l’interdiction.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: cette infamie
  rationale: נְבָלָה désigne un acte honteux, ignoble et contraire à l’ordre moral de la communauté, et non une simple sottise. « Infamie » rend cette gravité avec concision.
theological_decisions:
- issue: Portée de l’expression « en Israël »
  choice: Conserver l’appel à la norme morale collective d’Israël sans l’expliciter davantage
  alternative: Paraphraser comme une référence explicite à la loi ou à l’alliance
  rationale: Le texte évoque une conduite jugée inadmissible au sein d’Israël, mais ne précise pas ici s’il renvoie directement à une prescription légale particulière. La traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, direct et digne. Les exclamations rendent l’urgence de la supplication sans ajouter de formule de politesse absente de l’hébreu. « Faire violence » préserve la portée sexuelle du contexte ainsi que la nuance d’humiliation, tandis que « infamie » maintient la forte condamnation morale du dernier syntagme.
