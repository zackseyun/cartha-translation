source:
  edition: WLC
  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: fr
  text: Amnon avait un ami nommé Yonadab, fils de Shiméa, qui était le frère de David. Yonadab était un homme très avisé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « très sage » ou « très intelligent ». Le mot hébreu peut désigner largement la sagesse ou l’habileté ; ici, la suite du récit montre que Yonadab met sa perspicacité au service d’un conseil moralement douteux.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  choice: ami
  rationale: Le nom désigne couramment un ami, un compagnon ou un proche. « Ami » exprime naturellement la relation introduite ici sans préciser davantage sa nature.
- source_word: וּלְאַמְנוֹן
  choice: Amnon avait
  rationale: La construction hébraïque « à Amnon [était] » exprime la possession. Le français idiomatique emploie « Amnon avait »; la conjonction initiale n’exige pas ici l’ajout de « Or » ou « Maintenant ».
- source_word: וּשְׁמוֹ
  choice: nommé
  rationale: La formule hébraïque signifie littéralement « et son nom était ». « Nommé » l’intègre avec naturel à la phrase française tout en conservant l’identification du personnage.
- source_word: בֶּן שִׁמְעָה
  choice: fils de Shiméa
  rationale: Traduction directe de l’expression généalogique, avec translittération usuelle du nom propre en français.
- source_word: אֲחִי דָוִד
  choice: frère de David
  rationale: La chaîne construite identifie Shiméa, et non Yonadab, comme frère de David. La proximité syntaxique de l’apposition française conserve ce rattachement.
- source_word: אִישׁ חָכָם מְאֹד
  choice: un homme très avisé
  rationale: חָכָם peut désigner la sagesse ou l’habileté intellectuelle. « Avisé » rend ici la perspicacité de Yonadab sans lui attribuer nécessairement une qualité morale positive; « homme » respecte le masculin explicite אִישׁ.
theological_decisions:
- issue: Valeur morale de חָכָם appliqué à Yonadab
  choice: très avisé
  alternative: très sage; très intelligent
  rationale: Le terme hébreu reste sémantiquement large, tandis que la suite du récit montre une perspicacité mise au service d’un conseil moralement condamnable. « Avisé » préserve cette tension sans transformer d’emblée la sagesse en ruse malveillante.
