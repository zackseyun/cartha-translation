base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: fr
  text: 'Amnon se coucha donc et fit semblant d’être malade. Le roi vint le voir. Amnon dit alors au roi : « Je t’en prie, permets à ma sœur Tamar de venir préparer sous mes yeux deux galettes[a], afin que je mange de sa main. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux gâteaux » ou « deux pâtisseries » ; la nature exacte de la préparation désignée par le terme hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Le verbe décrit Amnon qui s’allonge, vraisemblablement sur son lit, pour mettre en scène sa prétendue maladie. « Se coucha » est naturel et précis en français.
- source_word: וַיִּתְחָל
  choice: fit semblant d’être malade
  rationale: La forme verbale exprime ici une maladie feinte, comme le montre le contexte de la ruse d’Amnon.
- source_word: לִרְאֹתוֹ
  choice: le voir
  rationale: Cette traduction directe conserve le sens de ראה, tout en évoquant naturellement une visite dans ce contexte.
- source_word: תָּבוֹא נָא
  choice: Permets, je te prie, à … de venir
  rationale: La particule נָא marque une requête polie adressée au roi. Cette tournure française rend clairement que David doit autoriser ou faire venir Tamar.
- source_word: תָּמָר אֲחֹתִי
  choice: ma sœur Tamar
  rationale: Cet ordre est plus idiomatique en français que « Tamar, ma sœur », sans modifier le rapport exprimé par l’hébreu.
- source_word: וּתְלַבֵּב
  choice: préparer
  rationale: Ce verbe rare désigne la confection des לְבִבוֹת. « Préparer » évite de préciser une technique culinaire que le texte ne permet pas d’établir.
- source_word: לְעֵינַי
  choice: sous mes yeux
  rationale: L’expression française conserve l’image concrète de l’hébreu et indique qu’Amnon veut regarder Tamar préparer la nourriture.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: deux galettes[a]
  rationale: Le terme désigne une préparation dont la nature exacte est incertaine. « Galettes » offre une désignation culinaire plausible sans affirmer qu’elles étaient en forme de cœur.
- source_word: וְאֶבְרֶה
  choice: afin que je mange
  rationale: Le verbe signifie ici manger ou prendre de la nourriture, avec une nuance adaptée au rôle de malade qu’Amnon joue.
- source_word: מִיָּדָהּ
  choice: de sa main
  rationale: La traduction garde le singulier et l’expression concrète de l’hébreu, qui souligne le service personnel demandé à Tamar.
