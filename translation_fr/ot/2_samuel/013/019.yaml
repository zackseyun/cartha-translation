  text: וַ/תִּקַּ֨ח תָּמָ֥ר אֵ֨פֶר֙ עַל רֹאשָׁ֔/הּ וּ/כְתֹ֧נֶת הַ/פַּסִּ֛ים אֲשֶׁ֥ר עָלֶ֖י/הָ קָרָ֑עָה וַ/תָּ֤שֶׂם יָדָ/הּ֙ עַל רֹאשָׁ֔/הּ וַ/תֵּ֥לֶךְ הָל֖וֹךְ וְ/זָעָֽקָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: fr
  text: Alors Tamar se mit de la cendre sur la tête, déchira la tunique particulière qu’elle portait[a], posa la main sur sa tête et s’en alla en poussant des cris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tunique ornée », « la tunique multicolore » ou « la tunique à longues manches ». L’expression hébraïque est incertaine ; dans ce contexte, elle désigne le vêtement distinctif porté par les filles vierges du roi (voir le verset 18).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: de la cendre
  rationale: Le nom désigne ici la cendre employée comme signe de deuil. Le singulier collectif est idiomatique en français.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: se mit de la cendre sur la tête
  rationale: Cette formulation naturelle exprime l’action indiquée par l’hébreu sans alourdir la phrase avec le littéral « prit de la cendre ».
- source_word: כְתֹנֶת הַפַּסִּים
  choice: la tunique particulière
  rationale: Le sens précis de הַפַּסִּים est incertain. « Particulière » signale le caractère distinctif du vêtement dans le contexte, sans imposer les interprétations discutées « multicolore », « ornée » ou « à longues manches ».
- source_word: אֲשֶׁר עָלֶיהָ
  choice: qu’elle portait
  rationale: Rendu français idiomatique de la proposition relative désignant le vêtement qui était sur elle.
- source_word: קָרָעָה
  choice: déchira
  rationale: Verbe usuel pour le geste de déchirer un vêtement sous l’effet du deuil ou de la détresse.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: posa la main sur sa tête
  rationale: Conserve sans l’interpréter le geste corporel de détresse et d’humiliation.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: s’en alla en poussant des cris tout au long du chemin
  rationale: 'Reproduit naturellement la valeur durative de l’infinitif absolu associé au verbe conjugué : elle avançait tout en continuant à crier.'
- source_word: זָעָקָה
  choice: en poussant des cris
  rationale: Exprime un cri fort sans préciser indûment s’il s’agit de lamentations, d’un appel au secours ou de paroles de protestation.
