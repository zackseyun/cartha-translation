  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: fr
  text: Et moi, où irais-je porter ma honte[a] ? Et toi, tu serais comme l’un des infâmes d’Israël[b]. Maintenant, je t’en prie, parle au roi[c], car il ne refusera pas de me donner à toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon déshonneur » ou « mon opprobre ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi se rendre par « insensés » ou « hommes ignobles » ; il désigne ici des personnes moralement indignes, et non simplement peu intelligentes.
    reason: lexical_alternative
  - marker: c
    text: 'C’est-à-dire : « il ne refusera pas de me donner à toi ». Tamar pensait peut-être que le roi consentirait à cette union, ou cherchait désespérément à retarder Amnon ; le texte ne le précise pas.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה אוֹלִיךְ אֶת חֶרְפָּתִי
  choice: où irais-je porter ma honte
  rationale: La question rhétorique conserve l’idée de déplacement exprimée par אָנָה et le hiphil de הלך. « Porter ma honte » est naturel en français et évoque à la fois le déshonneur subi et son poids social.
- source_word: חֶרְפָּתִי
  choice: ma honte
  rationale: Dans ce contexte, le terme désigne le déshonneur public qui retomberait sur Tamar. « Honte » est courant et direct; « opprobre » reste indiqué en note comme équivalent plus formel.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: pour l’un des infâmes
  rationale: נבל qualifie ici une personne moralement indigne et sans honte, non simplement dépourvue d’intelligence. « Passer pour l’un des infâmes » rend naturellement le jugement social impliqué.
- source_word: דַּבֶּר נָא
  choice: je t’en prie, parle
  rationale: La particule נָא donne à l’impératif la force d’une supplication urgente; cette formulation française la restitue sans archaïsme.
- source_word: לֹא יִמְנָעֵנִי מִמֶּךָּ
  choice: il ne refusera pas de me donner à toi
  rationale: La formulation explicite en français l’idiome hébreu « ne me retiendra pas loin de toi », qui évoque ici le fait que le roi ne refuserait pas Tamar à Amnon.
theological_decisions:
- issue: Portée de l’appel de Tamar au roi
  choice: Présenter ses paroles sans décider si elle envisage réellement une union autorisée ou cherche seulement à retarder l’agression.
  alternative: Traduire ou annoter la phrase comme une proposition certainement réalisable, ou au contraire comme une simple ruse certaine.
  rationale: Le texte rapporte l’affirmation de Tamar sans en préciser la faisabilité juridique ni l’intention stratégique. La note maintient donc cette ambiguïté narrative.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve l’intensité des deux questions et appels successifs, tandis que les notes rendent les nuances lexicales et l’ambiguïté narrative sans imposer une interprétation confessionnelle.
