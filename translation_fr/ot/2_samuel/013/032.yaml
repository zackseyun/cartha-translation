  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: fr
  text: 'Jonadab, fils de Shiméa, frère de David, prit alors la parole et dit : « Que mon seigneur ne dise pas : “Ils ont tué tous les jeunes hommes, les fils du roi”, car Amnon seul est mort. Absalom en avait décidé ainsi[a] depuis le jour où Amnon avait violé[b] Tamar, sa sœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression peut se comprendre comme « la chose avait été fixée sur la parole d’Absalom », c’est-à-dire selon son ordre ou sa résolution arrêtée.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut aussi être rendu par « humilié » ou « fait violence à »; dans ce contexte, il désigne un viol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: prit alors la parole et dit
  rationale: La formule française restitue naturellement le tour narratif hébreu « répondit et dit », sans imposer l’idée d’une réponse à une question précise.
- source_word: אֲחִי דָוִד
  choice: frère de David
  rationale: Le groupe construit identifie Shiméa comme le frère de David; l’apposition française conserve cette relation clairement.
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: Que mon seigneur ne dise pas
  rationale: Le subjonctif à valeur injonctive rend le jussif négatif tout en maintenant la déférence de la parole adressée au roi.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: tous les jeunes hommes, les fils du roi
  rationale: « Jeunes hommes » convient aux fils royaux présents, et l’apposition du texte hébreu est conservée.
- source_word: הֵמִיתוּ
  choice: ils ont tué
  rationale: Le hiphil de מות signifie « faire mourir, tuer »; la forme plurielle est conservée.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: Amnon seul est mort
  rationale: « Seul » restitue directement l’exclusivité exprimée par לְבַדּוֹ.
- source_word: עַל פִּי אַבְשָׁלוֹם הָיְתָה שׂוּמָה
  choice: Absalom en avait décidé ainsi
  rationale: Cette formulation française exprime une décision arrêtée dont Absalom est l’auteur, tout en renvoyant en note aux nuances possibles de l’idiome עַל־פִּי et du passif résultatif.
- source_word: מִיּוֹם עַנֹּתוֹ
  choice: depuis le jour où Amnon avait violé
  rationale: Dans ce contexte, le piel de ענה désigne la violence sexuelle infligée à Tamar. Le nom explicite évite une ambiguïté pronominale en français; une note conserve les rendus lexicaux moins explicites.
- source_word: אֲחֹתוֹ
  choice: Tamar, sa sœur
  rationale: Le possessif traduit directement le suffixe hébreu; Tamar est la sœur d’Amnon comme d’Absalom.
