review_pass:
  verdict: revise
  source_fidelity: Le rendu de הַמַּשְׂרֵת par « plat », de וַתִּצֹק par « versa », et de וַיְמָאֵן par « refusa » est fidèle au texte hébreu et au contexte immédiat. En revanche, « d’ici » et « de chez lui » déplacent l’expression répétée מֵעָלַי / מֵעָלָיו, qui signifie idiomatiquement l’éloignement de la présence d’Amnon, non principalement la sortie d’un lieu identifié comme sa demeure.
  naturalness: Le français est globalement naturel et de registre narratif approprié. « De ma présence » / « de sa présence » est à la fois idiomatique dans ce registre et plus précis que les formulations actuelles.
  terminology: « Plat » convient pour le récipient de service. « Tout le monde » rend naturellement la valeur collective de כָל־אִישׁ sans imposer une lecture restrictive. La note sur « versa » explique correctement l’objet sous-entendu.
  issues:
  - severity: medium
    issue: Les expressions « Faites sortir tout le monde d’ici » et « tous sortirent de chez lui » ne conservent pas précisément la référence personnelle de מֵעָלַי / מֵעָלָיו.
    rationale: Le parallélisme hébreu demande que les personnes soient éloignées d’Amnon (« de ma présence »), puis qu’elles sortent de sa présence. « D’ici » généralise le référent, tandis que « de chez lui » ajoute l’idée de domicile, absente du texte.
