base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: fr
  text: 'Alors elle prit le plat et en versa le contenu devant lui[a], mais il refusa de manger. Amnon dit : « Faites sortir tout le monde de ma présence. » Et tous sortirent de sa présence.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « versa devant lui » ; dans ce contexte, il s’agit de verser hors du plat la nourriture préparée pour la lui présenter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: le plat
  rationale: Le nom désigne ici le récipient utilisé pour présenter la nourriture. « Plat » convient naturellement en français et n’impose pas qu’il s’agisse encore de l’ustensile de cuisson.
- source_word: וַתִּצֹק לְפָנָיו
  choice: en versa le contenu devant lui
  rationale: Le verbe יצק signifie concrètement « verser ». La tournure française explicite discrètement l’objet implicite tout en conservant le geste décrit par l’hébreu.
- source_word: וַיְמָאֵן לֶאֱכֹל
  choice: il refusa de manger
  rationale: מָאֵן exprime un refus délibéré plutôt qu’une simple absence d’envie.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלַי
  choice: Faites sortir tout le monde d’ici
  rationale: Le hiphil impératif de יצא est causatif. « Tout le monde » rend idiomatiquement כָל אִישׁ dans cette formule collective, et « d’ici » exprime naturellement l’éloignement demandé par מֵעָלַי.
- source_word: וַיֵּצְאוּ כָל אִישׁ מֵעָלָיו
  choice: Et tous sortirent de chez lui
  rationale: « Tous » reprend la portée collective de כָל אִישׁ. « De chez lui » indique qu’ils quittent l’endroit où Amnon se trouve, sans donner à מֵעָלָיו le sens moderne et ambigu de « sur lui ».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le concret du verbe « verser » est préservé, tandis que les expressions hébraïques de séparation sont rendues idiomatiquement. La répétition collective de כָל אִישׁ est conservée par « tout le monde » puis « tous ».
