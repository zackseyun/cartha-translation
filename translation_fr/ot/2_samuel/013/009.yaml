  to: 'Alors elle prit le plat et en versa le contenu devant lui[a], mais il refusa de manger. Amnon dit : « Faites sortir tout le monde de ma présence. » Et tous sortirent de sa présence.'
  rationale: La révision conserve les choix lexicaux justifiés pour le plat, le geste de verser et le refus de manger. Elle remplace seulement les indications spatiales par « de ma présence » et « de sa présence », afin de rendre le sens idiomatique et le parallélisme de la préposition hébraïque avec ses suffixes personnels, sans ajouter l’idée que le lieu est la maison d’Amnon.
