base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: fr
  text: 'Il lui dit : « Pourquoi es-tu si amaigri, fils du roi, matin après matin[a] ? Ne veux-tu pas me le dire ? » Amnon lui répondit : « J’aime Tamar[b], la sœur d’Absalom, mon frère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque matin » ou « tous les matins ». L’hébreu répète le mot « matin ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Je suis amoureux de Tamar ». L’hébreu dit plus littéralement : « J’aime Tamar ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Interrogatif direct exprimant la cause ; « Pourquoi » est naturel et fidèle.
- source_word: כָּכָה דַּל
  choice: si amaigri
  rationale: Dans ce contexte, דַּל décrit l’aspect physique diminué d’Amnon ; « amaigri » rend clairement cet état visible sans suggérer la pauvreté.
- source_word: בֶּן הַמֶּלֶךְ
  choice: fils du roi
  rationale: Conserve l’adresse rhétorique et la formulation concrète de l’hébreu, plutôt que de substituer le titre « prince ».
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: matin après matin
  rationale: La répétition hébraïque exprime la récurrence ; cette tournure française la préserve naturellement.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: Ne veux-tu pas me le dire ?
  rationale: Rend la question pressante introduite par הֲלוֹא dans un français courant ; le pronom « le » reprend la cause de son état.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: la sœur d’Absalom, mon frère
  rationale: Préserve l’apposition et l’accent relationnel de l’hébreu tout en restant naturel en français.
- source_word: אֲנִי אֹהֵב
  choice: J’aime
  rationale: Le verbe אָהֵב est le terme ordinaire pour aimer ; la traduction conserve cette formulation sans interpréter ici la nature morale ou psychologique du sentiment.
theological_decisions:
- issue: Nature du sentiment déclaré par Amnon envers Tamar
  choice: J’aime Tamar
  alternative: Je suis amoureux de Tamar ; Je désire Tamar
  rationale: L’hébreu emploie le verbe courant אָהֵב, « aimer ». Le contexte narratif révélera la nature dévoyée du désir d’Amnon, mais ce verset ne doit pas être reformulé de manière à anticiper ou à imposer cette interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’adresse « fils du roi » et l’apposition « Absalom, mon frère ». Les notes maintiennent les principales nuances lexicales sans surinterpréter le récit.
