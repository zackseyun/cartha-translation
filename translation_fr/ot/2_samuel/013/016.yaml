  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אוֹדֹ֞ת הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את מֵ/אַחֶ֛רֶת אֲשֶׁר עָשִׂ֥יתָ עִמִּ֖/י לְ/שַׁלְּחֵ֑/נִי וְ/לֹ֥א אָבָ֖ה לִ/שְׁמֹ֥עַֽ לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: fr
  text: 'Mais elle lui dit[a] : « Non ! Car ce grand tort — me renvoyer — est plus grave que l’autre que tu m’as fait. » Mais il ne voulut pas l’écouter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Ne fais pas cela ! Car ce grand tort — me renvoyer — est plus grave que l’autre que tu m’as fait. » L’hébreu est condensé et sa construction est difficile.'
    reason: alternative_lexicale_et_syntaxique
lexical_decisions:
- source_word: אַל
  choice: Non !
  rationale: Bien que אַל introduise souvent une défense (« ne… pas »), il exprime ici, dans une formulation elliptique, la vive protestation de Tamar. « Non ! » est naturel en français et conserve la force de son refus.
- source_word: אוֹדֹת
  choice: Car
  rationale: Le terme introduit le motif de la protestation. Dans cette phrase hébraïque très condensée, « Car » établit naturellement le lien logique en français.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: un tort plus grave encore
  rationale: רָעָה peut désigner un mal, un préjudice ou un tort. Dans ce contexte moral et relationnel, « tort » convient bien. גְּדוֹלָה est rendu dans la comparaison par « plus grave encore ».
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: que celui que tu m’as fait
  rationale: Le féminin אַחֶרֶת renvoie à un autre tort implicite. « Celui » reprend clairement « tort » sans expliciter davantage que l’hébreu la première violence.
- source_word: לְשַׁלְּחֵנִי
  choice: me renvoyer
  rationale: L’infinitif avec suffixe désigne l’acte contre lequel Tamar proteste. « Me renvoyer » en restitue directement le sens.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: Mais il ne voulut pas l’écouter
  rationale: אָבָה exprime la volonté ou le refus. « Ne voulut pas l’écouter » conserve la dimension volontaire du refus et rend לִשְׁמֹעַ לָהּ de façon idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation clarifie la syntaxe elliptique de l’hébreu sans atténuer la protestation de Tamar ni préciser davantage la nature du premier tort.
