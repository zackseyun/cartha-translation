  yaml_path: translation/ot/2_samuel/013/024.yaml
  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: fr
  text: 'Absalom vint auprès du roi et dit : « Voici donc que ton serviteur a des tondeurs. Que le roi et ses serviteurs viennent donc avec ton serviteur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא גֹזְזִים לְעַבְדֶּךָ
  choice: Voici, ton serviteur fait tondre ses moutons
  rationale: L’hébreu dit littéralement que des tondeurs sont au service du locuteur, formule qui annonce en contexte la tonte de ses moutons. L’explicitation de « ses moutons » rend naturellement la scène en français sans changer son sens.
- source_word: יֵלֶךְ נָא
  choice: viennent, je te prie
  rationale: Le verbe הלך peut exprimer le déplacement envisagé selon le point de vue du locuteur. Dans cette invitation adressée au roi à rejoindre Absalom, « viennent » est idiomatique; נָא marque une requête polie.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Conserve la formule de déférence par laquelle Absalom parle de lui-même au roi.
