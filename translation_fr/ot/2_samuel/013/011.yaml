base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: fr
  text: 'Lorsqu’elle s’approcha de lui pour qu’il mange[a], il la saisit et lui dit : « Viens, couche avec moi, ma sœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lorsqu’elle lui apporta le plat pour qu’il mange » ; le verbe hébreu peut signifier soit que Tamar s’est approchée, soit qu’elle a apporté la nourriture près de lui.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: וַתַּגֵּשׁ אֵלָיו לֶאֱכֹל
  choice: Comme elle s’approchait de lui pour qu’il mange
  rationale: Le verbe נגשׁ peut ici être intransitif (« s’approcher ») ou causatif (« apporter, approcher quelque chose »). Sans objet explicite dans ce verset, le français naturel retient le mouvement de Tamar vers Amnon, tandis que la note conserve l’autre analyse possible. לֶאֱכֹל exprime le but et, dans le contexte, Amnon est celui qui doit manger.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: il la saisit
  rationale: חזק avec ב indique une prise ferme. « Saisit » rend la force coercitive de l’acte sans ajouter de détail absent du texte.
- source_word: בּוֹאִי
  choice: Viens
  rationale: Impératif féminin singulier direct de בוא, rendu sans amplification.
- source_word: שִׁכְבִי עִמִּי
  choice: couche avec moi
  rationale: שׁכב avec עִם est ici un idiome sexuel. « Coucher avec » est clair et courant en français moderne, sans atténuer la demande sexuelle.
- source_word: אֲחוֹתִי
  choice: ma sœur
  rationale: Le terme de parenté est explicite et essentiel à la portée narrative et morale de la scène.
theological_decisions:
- issue: Rendre l’impératif sexuel sans l’euphémiser
  choice: couche avec moi
  alternative: allonge-toi avec moi
  rationale: Le contexte et l’usage hébreu imposent le sens sexuel. La formulation retenue le rend clairement, sans obscurcissement ni crudité ajoutée.
- issue: Maintenir l’adresse familiale
  choice: ma sœur
  alternative: omettre l’adresse comme redondante
  rationale: L’adresse est présente dans l’hébreu et accentue la gravité de la demande incestueuse; elle ne doit donc pas être supprimée.
translation_notes:
  register: Français international moderne, sobre et digne. La narration demeure fluide, tandis que la parole d’Amnon conserve sa brutalité directe. L’ambiguïté du premier verbe hébreu est signalée en note plutôt que résolue silencieusement.
