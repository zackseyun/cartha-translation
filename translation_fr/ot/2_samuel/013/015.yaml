  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: fr
  text: 'Alors Amnon la haït d’une très grande haine, car la haine qu’il éprouvait pour elle était plus grande que l’amour qu’il avait éprouvé pour elle. Amnon lui dit : « Lève-toi, va. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: Alors Amnon la haït
  rationale: Le waw consécutif fait avancer le récit. « Alors » marque naturellement cette progression, et le pronom féminin objet désigne Tamar.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: d’une haine immense
  rationale: Cette expression intensifie le verbe. « D’une haine immense » conserve la répétition rhétorique entre « haïr » et « haine » tout en restant naturelle en français moderne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication de la haine soudaine d’Amnon.
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: la haine ... était plus forte que l’amour
  rationale: La préposition מִן exprime la comparaison. En français, une haine ou un amour peut naturellement être dit « plus fort ».
- source_word: אֲשֶׁר שְׂנֵאָהּ
  choice: qu’il éprouvait pour elle
  rationale: Cette formulation française rend la relation entre le nom « haine » et le verbe hébreu שׂנא sans produire la tournure peu naturelle « la haine dont il la haïssait ».
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: qu’il avait éprouvé pour elle
  rationale: Le plus-que-parfait situe cet amour avant la haine qui vient de surgir et maintient le parallélisme avec « la haine qu’il éprouvait ».
- source_word: קוּמִי לֵכִי
  choice: Lève-toi, va-t’en !
  rationale: Les deux impératifs féminins singuliers sont brefs et brutaux. « Va-t’en » exprime en français courant la valeur contextuelle de l’ordre de partir, tandis que la note donne la forme plus littérale.
