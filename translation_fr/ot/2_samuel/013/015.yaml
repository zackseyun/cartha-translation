review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, mais « va-t’en » et surtout la note (« la chasse ») explicitent davantage que l’impératif hébreu לֵכִי, qui signifie simplement « va ». « Très grande haine » rend plus directement l’intensification גדולה מאד.
  naturalness: Le français est fluide et d’un registre narratif approprié. « Lève-toi, va » reste bref et naturel dans un contexte solennel, tout en gardant l’abrupteté de l’hébreu.
  terminology: « Haït / haine » préserve utilement la répétition du texte source. « Plus grande que l’amour » reflète plus précisément le comparatif entre « haine » et « amour » que « plus forte ».
  issues:
  - severity: medium
    issue: L’ordre final est rendu par « va-t’en », et la note parle d’Amnon qui « la chasse ».
    rationale: Le texte hébreu porte les deux impératifs « Lève-toi, va »; il ne contient pas explicitement le verbe « chasser ». Le contexte peut suggérer une dismissal brutale, mais la traduction principale doit conserver la concision non interprétative de l’ordre.
  - severity: low
    issue: « d’une haine immense » et « plus forte que l’amour » sont légèrement plus interprétatifs que la formulation du texte source.
    rationale: L’hébreu répète « grand(e) » pour la haine et établit une comparaison avec l’amour. « Très grande haine » et « plus grande que l’amour » reproduisent plus étroitement ce choix lexical.
