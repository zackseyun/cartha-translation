revisions:
- from: 'Alors Amnon la haït d’une haine immense, car la haine qu’il éprouvait pour elle était plus forte que l’amour qu’il avait éprouvé pour elle. Puis Amnon lui dit : « Lève-toi, va-t’en ! »[a]'
  to: 'Alors Amnon la haït d’une très grande haine, car la haine qu’il éprouvait pour elle était plus grande que l’amour qu’il avait éprouvé pour elle. Amnon lui dit : « Lève-toi, va. »'
  rationale: La révision conserve le déroulement narratif, la répétition « haït / haine », le plus-que-parfait pour l’amour antérieur et la comparaison explicite. Elle rend les deux impératifs finaux sans ajouter l’idée de chasser ou de renvoyer, et supprime donc une note devenue inutile.
