base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: fr
  text: 'Amnon dit alors à Tamar : « Apporte la nourriture dans la pièce intérieure[a], afin que je mange de ta main. » Tamar prit donc les gâteaux qu’elle avait préparés et les apporta à Amnon, son frère, dans la pièce intérieure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la chambre », ou simplement « dans la pièce ». Le mot hébreu désigne une pièce intérieure ou retirée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  choice: Apporte
  rationale: 'Impératif féminin singulier de בוא employé au causatif : Amnon ordonne à Tamar d’amener la nourriture là où il se trouve.'
- source_word: הַבִּרְיָה
  choice: la nourriture
  rationale: Le nom désigne ici des aliments préparés pour être mangés. « Nourriture » reste assez général, tandis que les לְבִבוֹת sont nommés plus précisément ensuite.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: dans la pièce intérieure
  rationale: חֶדֶר désigne une pièce située à l’intérieur ou retirée. La même traduction aux deux occurrences préserve la répétition et fait percevoir le cadre isolé sans ajouter explicitement l’idée de secret.
- source_word: וְאֶבְרֶה
  choice: afin que je mange
  rationale: Le cohortatif exprime ici le but recherché par Amnon après l’ordre donné à Tamar.
- source_word: מִיָּדֵךְ
  choice: de ta main
  rationale: La formulation concrète de l’hébreu est conservée; elle souligne le caractère personnel de la demande d’Amnon.
- source_word: הַלְּבִבוֹת
  choice: les gâteaux
  rationale: Dans le contexte immédiat, le terme désigne les préparations particulières confectionnées par Tamar; « gâteaux » est clair sans préciser indûment leur composition.
- source_word: אָחִיהָ
  choice: son frère
  rationale: Le lien de parenté est explicitement exprimé en hébreu et demeure essentiel à la force narrative et morale du récit.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le passé simple soutient le registre narratif biblique sans archaïsme marqué. La répétition de « pièce intérieure » reproduit celle du texte hébreu et met en relief le déplacement vers un lieu retiré.
