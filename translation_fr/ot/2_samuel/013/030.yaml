base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: fr
  text: 'Pendant qu’ils étaient en chemin, la nouvelle[a] parvint à David : « Absalom a tué tous les fils du roi ; il n’en reste pas un seul. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rapport » ; le terme hébreu peut aussi désigner une rumeur ou une information non vérifiée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: Pendant qu’ils étaient en chemin
  rationale: La formule narrative וַיְהִי, suivie du pronom et du complément, établit ici une circonstance temporelle. Cette formulation est naturelle en français moderne et conserve cette valeur.
- source_word: הַשְּׁמֻעָה
  choice: une rumeur
  rationale: שְׁמוּעָה peut désigner une nouvelle, un rapport ou une rumeur. Comme l’information reçue est non vérifiée et fausse dans son ampleur, « rumeur » convient au contexte tout en signalant l’alternative en note.
- source_word: בָאָה אֶל דָּוִד
  choice: parvint à David
  rationale: « Parvint à David » rend idiomatiquement le mouvement figuré de l’information exprimé par le verbe בוא.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu direct de l’annonce sans qu’il soit nécessaire d’ajouter « disant ».
- source_word: הִכָּה
  choice: a abattu
  rationale: Le verbe נכה signifie frapper ou abattre et, dans ce contexte, implique la mise à mort. « A abattu » préserve à la fois l’image verbale et la portée létale.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: tous les fils du roi
  rationale: Traduction directe et naturelle ; « fils » conserve la référence masculine précise du contexte.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: il n’en reste pas un seul
  rationale: Cette tournure française rend avec force la négation et le numéral אֶחָד, ainsi que l’idée de survivant exprimée par le nifal de יתר.
