base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: fr
  text: 'Absalom dit alors[a] : « Sinon, je t’en prie, que mon frère Amnon vienne avec nous. » Mais le roi lui dit : « Pourquoi irait-il avec toi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus explicite : « Si tu ne veux pas venir, je t’en prie, que mon frère Amnon vienne avec nous. » L’hébreu est elliptique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit / Mais … demanda
  rationale: Le waw narratif fait progresser le récit. « Alors » convient à la première prise de parole, tandis que « Mais » marque naturellement la réaction opposée du roi. Dans la seconde proposition, « demanda » est idiomatique devant une question directe.
- source_word: וָלֹא
  choice: Sinon
  rationale: 'L’expression est elliptique et renvoie au refus précédent : « si tu ne viens pas » ou « si cela ne se fait pas ». « Sinon » conserve cette concision sans préciser abusivement l’élément sous-entendu.'
- source_word: נָא
  choice: je t’en prie
  rationale: La particule adoucit la requête. « Je t’en prie » restitue ici la déférence d’Absalom envers le roi dans un français actuel et digne.
- source_word: יֵלֶךְ
  choice: que … vienne / irait-il
  rationale: Dans la requête, le mouvement est envisagé depuis le groupe d’Absalom, d’où le français naturel « vienne avec nous ». Dans la question rhétorique du roi, le conditionnel « irait-il » exprime naturellement la valeur délibérative de l’imparfait hébreu.
- source_word: אִתָּנוּ
  choice: avec nous
  rationale: Équivalent comitatif direct du syntagme hébreu.
- source_word: אַמְנוֹן אָחִי
  choice: mon frère Amnon
  rationale: Cet ordre est plus naturel en français que « Amnon, mon frère » dans cette requête, tout en conservant exactement la relation exprimée.
- source_word: לָמָה
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et idiomatique.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: Le suffixe masculin singulier désigne Absalom; le tutoiement convient à la parole du père à son fils et correspond au singulier hébreu.
