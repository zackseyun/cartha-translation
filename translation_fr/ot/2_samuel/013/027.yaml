base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/027.yaml
  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: fr
  text: Mais Absalom insista auprès de lui[a]. Alors le roi envoya Amnon et tous les fils du roi avec Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pressa avec insistance » ou « finit par le faire céder ». L’expression hébraïque est plus forte qu’une simple demande et évoque une pression persistante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: Absalom insista auprès de lui
  rationale: L’expression idiomatique avec פרץ et בְּ exprime ici une pression insistante, et non l’idée littérale de « faire une brèche ». « Insista auprès de lui » est naturel en français et convient au refus initial de David au verset précédent.
- source_word: וַיִּשְׁלַח
  choice: le roi envoya
  rationale: שלח signifie ici que David consent à leur départ et les envoie au banquet. Le sujet implicite est rendu par « le roi » afin d’éviter l’ambiguïté créée en français par deux pronoms masculins successifs.
- source_word: אִתּוֹ
  choice: avec Absalom
  rationale: Le texte dit littéralement « avec lui »; le référent est Absalom. Répéter son nom clarifie naturellement le sens en français.
- source_word: אֶת אַמְנוֹן
  choice: Amnon
  rationale: La particule d’objet direct n’est pas traduite; le nom propre suit la forme française courante.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: et tous ses autres fils
  rationale: Littéralement « et tous les fils du roi ». Puisque le sujet explicité est « le roi » et qu’Amnon est lui-même l’un de ses fils, « ses autres fils » exprime clairement l’inclusion implicite sans lourdeur.
