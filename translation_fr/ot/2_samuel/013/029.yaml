  text: וַֽ/יַּעֲשׂ֞וּ נַעֲרֵ֤י אַבְשָׁלוֹם֙ לְ/אַמְנ֔וֹן כַּ/אֲשֶׁ֥ר צִוָּ֖ה אַבְשָׁל֑וֹם וַ/יָּקֻ֣מוּ כָּל בְּנֵ֣י הַ/מֶּ֗לֶךְ וַֽ/יִּרְכְּב֛וּ אִ֥ישׁ עַל פִּרְדּ֖/וֹ וַ/יָּנֻֽסוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: fr
  text: Les jeunes hommes d’Absalom[a] firent à Amnon ce qu’Absalom avait ordonné[b]. Alors tous les fils du roi se levèrent ; chacun monta sur son mulet, et ils s’enfuirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les serviteurs d’Absalom » ou « les hommes de la suite d’Absalom ». Le terme hébreu peut désigner de jeunes hommes au service de quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « firent à Amnon comme Absalom l’avait ordonné ». Le verset précédent précise l’ordre : frapper Amnon à mort quand il aurait le cœur égayé par le vin.'
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: les jeunes hommes d’Absalom
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un homme de la suite. « Jeunes hommes » conserve le sens lexical premier sans préciser outre mesure leur statut, tandis que la note signale les autres possibilités.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: firent à Amnon
  rationale: Cette formulation conserve la concision de l’hébreu. Le verset précédent explicite l’acte ordonné, sans qu’il soit nécessaire de l’ajouter dans le corps du texte.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ce qu’Absalom avait ordonné
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité de l’ordre dans le récit, et « ce que » exprime ici l’exécution conforme de cet ordre.
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Rendu direct et naturel qui convient au registre narratif et à la réaction soudaine des fils du roi.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: tous les fils du roi
  rationale: Traduction directe de la construction hébraïque, désignant ici les fils du roi David présents au banquet.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: chacun monta sur son mulet
  rationale: אִישׁ a une valeur distributive (« chacun »), et פֶּרֶד désigne un mulet. La phrase française est claire et idiomatique.
- source_word: וַיָּנֻסוּ
  choice: ils s’enfuirent
  rationale: Le verbe נוּס exprime une fuite urgente ; « s’enfuirent » en rend précisément le mouvement dans un français narratif naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe narrative fluide. La formulation conserve la sobriété de l’hébreu sans expliciter dans le corps du verset la mise à mort mentionnée dans le contexte immédiat.
