source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וּ/לְ/אַבְשָׁל֧וֹם בֶּן דָּוִ֛ד אָח֥וֹת יָפָ֖ה וּ/שְׁמָ֣/הּ תָּמָ֑ר וַ/יֶּאֱהָבֶ֖/הָ אַמְנ֥וֹן בֶּן דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: fr
  text: Après cela[a], Absalom, fils de David, avait une sœur d’une grande beauté, nommée Tamar, et Amnon, fils de David, l’aimait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’éprit d’elle » ou « la désirait ». L’hébreu emploie le verbe ordinaire signifiant « aimer », mais la suite du récit montre que l’attachement d’Amnon était corrompu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: La formule narrative et l’expression temporelle introduisent ensemble la suite des événements. « Après cela » est naturel en français moderne et conserve le lien avec le récit précédent.
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: Absalom, fils de David, avait
  rationale: La construction possessive hébraïque, littéralement « à Absalom était », se rend naturellement par « avait ». La désignation « fils de David » est maintenue.
- source_word: אָחוֹת יָפָה
  choice: une sœur d’une grande beauté
  rationale: אָחוֹת signifie « sœur » et יָפָה décrit ici sa beauté physique. Cette formulation française est claire, digne et évite une succession maladroite d’adjectifs.
- source_word: וּשְׁמָהּ תָּמָר
  choice: nommée Tamar
  rationale: Cette formulation idiomatique transmet simplement la proposition hébraïque « et son nom était Tamar » sans en modifier le contenu.
- source_word: וַיֶּאֱהָבֶהָ
  choice: l’aimait
  rationale: Le texte emploie le verbe ordinaire אָהֵב, « aimer ». Le récit ultérieur révèle la corruption de ce prétendu amour, mais la traduction principale conserve le terme non qualifié et la tension littéraire de l’hébreu.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: Amnon, fils de David
  rationale: La répétition de « fils de David » est préservée afin de maintenir l’accent du verset sur les liens au sein de la famille royale.
theological_decisions:
- issue: Rendu de אָהֵב dans un récit moralement chargé
  choice: l’aimait
  alternative: la désirait ; s’était épris d’elle
  rationale: Bien que la suite montre que l’attachement d’Amnon était corrompu et violent, ce verset emploie le verbe hébreu courant pour « aimer ». Le conserver dans le texte principal évite de résoudre prématurément la tension théologique et narrative.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure fluide tout en conservant la double désignation « fils de David » et l’ambiguïté intentionnelle du verbe « aimer ».
