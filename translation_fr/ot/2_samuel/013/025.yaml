base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: fr
  text: 'Mais le roi dit à Absalom : « Non, mon fils, je t’en prie, n’allons pas tous, de peur que nous ne te soyons à charge. » Absalom insista auprès de lui, mais le roi ne voulut pas y aller. Il le bénit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: je t’imposerais une trop lourde charge
  rationale: Littéralement « afin que nous ne soyons pas lourds sur toi ». La formulation française exprime naturellement le poids matériel et logistique que représenterait la venue de toute la cour.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Absalom insista auprès de lui
  rationale: Le verbe פָּרַץ avec ב peut décrire une vive insistance exercée sur quelqu’un. Le sujet implicite est rendu explicite pour éviter une ambiguïté artificielle en français.
- source_word: וַיְבָרֲכֵהוּ
  choice: Il lui donna cependant sa bénédiction
  rationale: Le verbe signifie « bénir ». « Donner sa bénédiction » convient ici au geste d’un père et roi qui, sans accepter de venir, accorde sa faveur à Absalom; « cependant » explicite le contraste narratif sans ajouter de contenu doctrinal.
