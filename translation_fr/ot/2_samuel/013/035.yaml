  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: fr
  text: 'Alors Jonadab dit au roi : « Voici que les fils du roi sont arrivés. Comme ton serviteur l’avait dit, il en a été ainsi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors … dit » en restitue naturellement la succession en français moderne.
- source_word: יֽוֹנָדָב
  choice: Jonadab
  rationale: Le nom propre est translittéré selon sa forme française conventionnelle.
- source_word: אֶל הַמֶּלֶךְ
  choice: au roi
  rationale: L’expression désigne ici le roi humain David ; la minuscule convient.
- source_word: הִנֵּה
  choice: Voici que
  rationale: La particule attire l’attention sur ce qui devient visible ou manifeste. « Voici que » conserve cette immédiateté dans un registre naturel et digne.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: les fils du roi
  rationale: Cette formulation restitue directement la chaîne construite et maintient le pluriel, important puisque Jonadab rectifie la nouvelle selon laquelle tous les fils auraient été tués.
- source_word: בָּאוּ
  choice: sont arrivés
  rationale: L’accompli constate leur arrivée désormais manifeste. Le passé composé convient à la scène immédiate et évite de lui donner à tort un sens progressif.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: comme ton serviteur l’avait dit
  rationale: Dans cette construction, דָּבָר renvoie à la parole prononcée. « Ton serviteur » conserve l’auto-désignation respectueuse propre au langage de cour ; le plus-que-parfait marque naturellement l’antériorité de la déclaration.
- source_word: כֵּן הָיָה
  choice: Les choses se sont passées
  rationale: La formule confirme que les faits correspondent à la déclaration précédente. Cette tournure française naturelle restitue le sens de « ainsi cela s’est produit », tandis que la proposition comparative qui suit exprime clairement la correspondance.
