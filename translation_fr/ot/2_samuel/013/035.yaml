  register: Français international moderne, narratif et digne. Le discours de cour est préservé par « ton serviteur », sans archaïsme inutile. La seconde phrase réorganise légèrement l’ordre hébreu pour produire une formulation française naturelle tout en conservant la correspondance emphatique entre la parole antérieure et les faits.
