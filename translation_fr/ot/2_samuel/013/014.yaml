  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: fr
  text: Mais il refusa de l’écouter[a] et, comme il était plus fort qu’elle[b], il lui fit violence[c] et coucha avec elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « il ne voulut pas écouter sa voix ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « il la maîtrisa par la force ».'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu peut signifier « humilier », « maltraiter » ou « faire violence » ; ici, il désigne une violence sexuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אָבָה לִשְׁמֹעַ בְּקוֹלָהּ
  choice: il refusa de l’écouter
  rationale: La tournure exprime un refus volontaire de tenir compte de ses paroles. « Refusa de l’écouter » est naturel en français et conserve cette dimension volitive; l’expression hébraïque littérale est signalée en note.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: il fut plus fort qu’elle
  rationale: Le verbe חזק avec מן exprime ici la supériorité physique qui lui permit de l’emporter. Cette traduction garde la forme comparative et la succession des actions sans la réduire d’emblée à « il la maîtrisa ».
- source_word: וַיְעַנֶּהָ
  choice: lui fit violence
  rationale: Dans ce contexte, ענה désigne l’humiliation et la violence sexuelles infligées à Tamar. « Lui fit violence » rend clairement la contrainte tout en préservant la portée lexicale du verbe, plus large que le seul acte sexuel.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: coucha avec elle
  rationale: שכב avec un complément direct est un idiome courant désignant les rapports sexuels. « Coucha avec elle » en conserve la formulation, tandis que les propositions précédentes établissent sans ambiguïté l’absence de consentement.
