lexical_decisions:
- source_word: וְ/אַבְשָׁל֥וֹם
  choice: Mais Absalom
  rationale: Dans cette reprise narrative, la conjonction וְ peut naturellement marquer un léger contraste et se traduire par « mais »; « et » reste également possible.
- source_word: בָּרַ֖ח
  choice: s’enfuit
  rationale: Le verbe ברח exprime la fuite; « s’enfuit » est précis, naturel et convient au registre narratif.
- source_word: וַ/יֵּ֣לֶךְ
  choice: alla
  rationale: Le verbe הלך dans la chaîne narrative signifie simplement « aller »; le passé simple maintient un récit français fluide et digne.
- source_word: גְּשׁ֑וּר
  choice: Gueshour
  rationale: Transcription française usuelle du nom de lieu hébreu גְּשׁוּר.
- source_word: וַ/יְהִי שָׁ֖ם
  choice: Il y resta
  rationale: Littéralement « et il fut là »; en français actuel, « il y resta » exprime naturellement la présence prolongée indiquée par la durée qui suit.
- source_word: שָׁלֹ֥שׁ שָׁנִֽים
  choice: trois ans
  rationale: Traduction directe de l’expression de durée.
