  text: Mais[a] Absalom s’enfuit et alla à Gueshour. Il y resta[b] trois ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et Absalom s’enfuit et alla à Gueshour. » La conjonction hébraïque peut se traduire ici par « mais » ou par « et ».'
