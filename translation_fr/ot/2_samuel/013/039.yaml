base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: fr
  text: Le roi David désirait ardemment aller vers Absalom[a], car il s’était consolé au sujet d’Amnon, puisqu’il était mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de cette proposition est difficile. Autre traduction possible : « Le roi David cessa de sortir pour aller vers Absalom. »'
    reason: Signaler l’ambiguïté réelle de la syntaxe hébraïque et une autre interprétation ancienne et largement attestée, sans ajouter l’idée non explicite de poursuite.
lexical_decisions:
- source_word: וַתְּכַל
  choice: désirait ardemment
  rationale: La forme hébraïque signifie normalement « elle s’épuisa / arriva à son terme » et semble supposer un sujet féminin sous-entendu, probablement « l’âme » du roi. Dans ce contexte, elle exprime donc un désir intense, tout en présentant une difficulté grammaticale signalée en note.
- source_word: לָצֵאת אֶל־אַבְשָׁלוֹם
  choice: aller vers Absalom
  rationale: Rend directement le mouvement exprimé par « sortir/aller vers », sans préciser indûment s’il s’agissait de le visiter, de le rechercher ou de le ramener.
- source_word: נִחַם עַל־אַמְנוֹן
  choice: s’était consolé au sujet d’Amnon
  rationale: Préserve le sens du niphal de נחם et la relation générale marquée par עַל, sans transformer explicitement la consolation en oubli ou en fin du deuil.
theological_decisions:
- issue: Ambiguïté syntaxique de וַתְּכַל et disposition de David envers Absalom
  choice: Le roi David désirait ardemment aller vers Absalom
  alternative: Le roi David cessa de partir à la poursuite d’Absalom
  rationale: La forme féminine peut s’expliquer par un sujet implicite tel que « l’âme de David », lecture soutenue par le contexte immédiat de 2 Samuel 14.1. Cependant, le texte hébreu est difficile et peut aussi être compris comme indiquant la cessation d’une action hostile; cette possibilité est conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, sobre et narratif. « Désirait ardemment » est courant et digne; « aller vers » conserve volontairement l’indétermination du mouvement hébreu. Le marqueur [a] figure dans le texte principal.
