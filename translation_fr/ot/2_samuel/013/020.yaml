  naturalness: Le français est globalement naturel et de registre digne. L’inversion interrogative (« Amnon, ton frère, a-t-il été avec toi ? ») est plus fluide et plus soignée que « Est-ce qu’Amnon … a été avec toi ? » dans ce contexte narratif. « Mais maintenant » rétablit également l’enchaînement du discours.
