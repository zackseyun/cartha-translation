base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: fr
  text: 'Absalom, son frère, lui dit alors : « Amnon, ton frère, a-t-il été avec toi[a] ? Mais maintenant, ma sœur, garde le silence : c’est ton frère. Ne prends pas cette affaire à cœur. » Tamar resta, dévastée[b], dans la maison de son frère Absalom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Amnon, ton frère, a-t-il été avec toi ? » Cette expression discrète désigne ici l’agression sexuelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ravagée ». Le terme hébreu évoque la dévastation, la ruine ou une profonde désolation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: Amnon
  rationale: Le nom propre est translittéré selon la forme française traditionnelle.
- source_word: הָיָה עִמָּךְ
  choice: a été avec toi
  rationale: Cette formulation préserve l’expression indirecte de l’hébreu, qui désigne ici discrètement l’agression sexuelle sans l’expliciter dans le corps du texte.
- source_word: הַחֲרִישִׁי
  choice: garde le silence
  rationale: L’impératif exprime l’ordre de se taire. Cette formulation française actuelle conserve sa force sans l’atténuer.
- source_word: אָחִיךְ הוּא
  choice: c’est ton frère
  rationale: La proposition brève et brutale est conservée comme justification donnée par Absalom, sans en adoucir la portée troublante.
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַדָּבָר הַזֶּה
  choice: Ne prends pas cette affaire à cœur
  rationale: L’expression idiomatique hébraïque signifie littéralement ne pas placer son cœur sur cette affaire; l’équivalent français conserve la dimension intérieure et émotionnelle.
- source_word: וַתֵּשֶׁב
  choice: resta
  rationale: Le verbe peut signifier s’asseoir, demeurer ou habiter. Ici, « resta » exprime naturellement la situation durable de Tamar dans la maison d’Absalom.
- source_word: שֹׁמֵמָה
  choice: dévastée
  rationale: Le terme évoque la désolation, la ruine et l’accablement. « Dévastée » rend clairement en français moderne l’état profond de Tamar tout en laissant « désolée » comme autre traduction possible.
- source_word: בֵּית אַבְשָׁלוֹם אָחִיהָ
  choice: dans la maison de son frère Absalom
  rationale: La formulation conserve le cadre domestique concret et rend explicitement le lien familial présent en hébreu.
theological_decisions:
- issue: Euphémisme narratif désignant l’agression sexuelle
  choice: Conserver dans le texte principal la formulation indirecte « a été avec toi ».
  alternative: « t’a fait violence » ou « a couché avec toi »
  rationale: L’hébreu emploie une expression indirecte dans ce récit traumatique. La conserver respecte sa retenue lexicale et son ambiguïté de forme, tandis que le contexte et la note en précisent la référence.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct conserve la retenue de l’hébreu ainsi que la dureté troublante des paroles d’Absalom, sans interprétation confessionnelle ajoutée.
