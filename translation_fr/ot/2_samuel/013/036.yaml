base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: fr
  text: Dès qu’il eut fini de parler, voici que les fils du roi arrivèrent. Ils élevèrent la voix et pleurèrent. Le roi et tous ses serviteurs pleurèrent eux aussi abondamment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pleurèrent de très grands pleurs », tournure hébraïque emphatique exprimant un deuil intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Dès qu’il eut fini de parler
  rationale: La formule narrative et la proposition temporelle indiquent une succession immédiate. Cette tournure française naturelle en conserve le mouvement sans reproduire lourdement « il arriva que ».
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Ce marqueur attire vivement l’attention sur l’arrivée des fils du roi. « Voici que » en préserve la fonction narrative sans lui imposer nécessairement l’idée de soudaineté.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: les fils du roi
  rationale: Traduction directe de la construction hébraïque, naturelle en français et importante pour les liens familiaux au cœur du récit.
- source_word: בָּאוּ
  choice: arrivèrent
  rationale: Dans ce contexte, « arrivèrent » exprime naturellement l’aboutissement de leur venue sur les lieux.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: Ils élevèrent la voix
  rationale: Cette expression conserve l’image de l’idiome hébreu et introduit clairement une lamentation audible.
- source_word: וַיִּבְכּוּ
  choice: et pleurèrent
  rationale: « Pleurèrent » désigne précisément les larmes et le deuil, plutôt qu’un simple cri.
- source_word: וְגַם
  choice: eux aussi
  rationale: Cette formulation marque que le roi et ses serviteurs se joignent aux pleurs des fils.
- source_word: וְכָל עֲבָדָיו
  choice: et tous ses serviteurs
  rationale: עֲבָדָיו peut désigner les serviteurs ou les gens attachés à la cour. « Serviteurs » reste fidèle et évite de préciser indûment leur rang.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: pleurèrent abondamment[a]
  rationale: Le français idiomatique exprime ainsi l’intensité de la tournure emphatique hébraïque; la note en signale la forme littérale.
