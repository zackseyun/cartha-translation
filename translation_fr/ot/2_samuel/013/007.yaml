  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: fr
  text: 'Alors David envoya dire à Tamar, chez elle : « Va, je te prie, chez ton frère Amnon et prépare-lui de la nourriture[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un plat fortifiant » ou « de quoi manger ». Le terme hébreu désigne de la nourriture préparée pour une personne malade ou convalescente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל תָּמָר ... לֵאמֹר
  choice: envoya dire à Tamar
  rationale: Le verbe signifie littéralement « envoya », mais la construction avec אֶל, le nom de la destinataire et לֵאמֹר introduit l’envoi d’un message. « Envoya dire » est idiomatique en français et ne suppose pas que David se soit déplacé.
- source_word: הַבַּיְתָה
  choice: chez elle
  rationale: Le nom « maison » porte un suffixe directionnel. Dans ce contexte, la formule situe naturellement Tamar à sa résidence, où le message lui est adressé. « Chez elle » rend ce sens sans donner l’impression que David envoie Tamar elle-même.
- source_word: לְכִי נָא
  choice: Va, je te prie
  rationale: L’impératif féminin singulier est adouci par נָא. La tournure conserve à la fois l’ordre et sa formulation polie, dans un registre digne et naturel.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: chez ton frère Amnon
  rationale: La chaîne construite signifie littéralement « maison d’Amnon, ton frère ». En français, « chez ton frère Amnon » exprime naturellement le déplacement vers sa maison tout en conservant le lien familial.
- source_word: וַעֲשִׂי לוֹ הַבִּרְיָה
  choice: et prépare-lui un repas
  rationale: Dans ce contexte culinaire, עשה se rend naturellement par « préparer ». הַבִּרְיָה désigne de la nourriture destinée à une personne malade ou convalescente; « un repas » reste lisible et sobre, tandis que la nuance particulière est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Envoya dire », « chez elle » et « chez ton frère » évitent une syntaxe calquée sur l’hébreu. La nuance médicale de הַבִּרְיָה est conservée en note sans préciser indûment la nature exacte du plat.
