base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: fr
  text: Tamar se rendit donc chez son frère Amnon, qui était couché. Elle prit la pâte, la pétrit, en façonna des gâteaux[a] sous ses yeux, puis fit cuire les gâteaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en fit des gâteaux en forme de cœur » ; le verbe et le nom hébreux sont rares et pourraient évoquer une forme associée au mot « cœur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « fit bouillir les gâteaux » ; le verbe hébreu peut désigner précisément une cuisson à l’eau, mais il peut aussi avoir ici le sens plus général de « faire cuire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: se rendit donc
  rationale: Le wayyiqtol fait progresser le récit; « donc » exprime naturellement la suite donnée aux instructions précédentes.
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: chez son frère Amnon
  rationale: En français courant, « chez » rend naturellement le déplacement vers la maison d’Amnon, tandis que « son frère » conserve la relation familiale mise en avant par l’hébreu.
- source_word: וְהוּא שֹׁכֵב
  choice: qui était couché
  rationale: La proposition décrit la situation d’Amnon à l’arrivée de Tamar sans préciser davantage le lieu ni la raison.
- source_word: הַבָּצֵק
  choice: la pâte
  rationale: Équivalent usuel et précis dans ce contexte de préparation alimentaire.
- source_word: וְתָלֹשׁ
  choice: la pétrit
  rationale: Le verbe לוש désigne normalement l’action de pétrir une pâte.
- source_word: וַתְּלַבֵּב
  choice: en façonna des gâteaux
  rationale: Le verbe rare semble désigner la mise en forme de la pâte pour produire les לְבִבוֹת; cette formulation traduit l’action sans imposer l’hypothèse de gâteaux en forme de cœur.
- source_word: לְעֵינָיו
  choice: sous ses yeux
  rationale: Expression française naturelle qui conserve l’idée qu’Amnon voyait Tamar préparer les gâteaux.
- source_word: וַתְּבַשֵּׁל
  choice: fit cuire
  rationale: Le verbe peut désigner plus précisément la cuisson à l’eau, mais « faire cuire » préserve ici l’indétermination du procédé.
- source_word: הַלְּבִבוֹת
  choice: les gâteaux
  rationale: Le nom rare désigne les aliments façonnés par Tamar; « gâteaux » est compréhensible sans affirmer une forme incertaine.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Chez son frère Amnon » évite la lourdeur de « à la maison de »; « sous ses yeux » conserve la proximité visuelle de l’expression hébraïque. Les deux incertitudes lexicales réelles sont signalées sans surcharger le texte principal.
