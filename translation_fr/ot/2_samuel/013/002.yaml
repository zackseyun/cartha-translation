  text: וַ/יֵּ֨צֶר לְ/אַמְנ֜וֹן לְ/הִתְחַלּ֗וֹת בַּֽ/עֲבוּר֙ תָּמָ֣ר אֲחֹת֔/וֹ כִּ֥י בְתוּלָ֖ה הִ֑יא וַ/יִּפָּלֵא֙ בְּ/עֵינֵ֣י אַמְנ֔וֹן לַ/עֲשׂ֥וֹת לָ֖/הּ מְאֽוּמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: fr
  text: Amnon fut si tourmenté à cause de Tamar, sa sœur[a], qu’il se rendit malade. Car elle était vierge, il semblait impossible à Amnon de lui faire quoi que ce soit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Amnon fut tourmenté au point d’en devenir malade à cause de Tamar, sa sœur. » L’expression hébraïque peut se comprendre soit au sens réflexif (« se rendre malade »), soit comme indiquant le résultat (« devenir malade »).'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque, littéralement « cela était extraordinaire aux yeux d’Amnon », peut désigner ce qui lui paraissait trop difficile ou irréalisable. Autrement dit, Amnon ne voyait aucun moyen d’agir envers elle.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: en fut si tourmenté
  rationale: Le verbe exprime ici une forte détresse intérieure ou le sentiment d’être acculé. « Tourmenté » rend cette pression émotionnelle sans l’atténuer.
- source_word: לְהִתְחַלּוֹת
  choice: qu’il se rendit malade
  rationale: L’infinitif hitpael de חלה peut signifier « devenir malade » ou « se rendre malade ». Le rendu réflexif conserve cette nuance, tandis que la note signale l’autre analyse possible.
- source_word: בַּעֲבוּר
  choice: à cause de
  rationale: La préposition indique ici la cause de son état, non un avantage ou un but.
- source_word: אֲחֹתוֹ
  choice: sa sœur
  rationale: Le lien familial est explicite dans l’hébreu et essentiel à la portée narrative et morale du passage.
- source_word: בְתוּלָה
  choice: vierge
  rationale: Ce terme rend directement le sens de בְתוּלָה dans un français moderne, clair et non archaïque.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: Amnon estimait impossible
  rationale: L’expression idiomatique indique que, du point de vue d’Amnon, l’action paraissait hors de portée ou irréalisable. Le français naturel explicite ce point de vue sans ajouter de motif.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: de lui faire quoi que ce soit
  rationale: 'La formulation conserve l’indétermination de l’hébreu : elle ne précise pas prématurément l’acte envisagé, tout en gardant la valeur orientée vers Tamar de לָהּ.'
theological_decisions:
- issue: Nature de l’état maladif d’Amnon
  choice: « il se rendit malade » dans le texte, avec l’autre lecture en note
  alternative: « il en devint malade »
  rationale: La forme verbale permet une compréhension réflexive ou résultative. Le texte retient la première sans exclure la seconde.
- issue: Portée de « lui faire quoi que ce soit »
  choice: Maintenir une expression générale et inquiétante
  alternative: Préciser qu’il voulait avoir des relations sexuelles avec elle ou lui faire violence
  rationale: L’hébreu reste indéterminé à ce stade. Une explicitation anticiperait la suite du récit et résoudrait une ambiguïté que le texte conserve.
translation_notes:
  register: Français international moderne, narratif et digne. « Quoi que ce soit » préserve l’ambiguïté menaçante de l’original; « estimait impossible » rend naturellement l’idiome hébraïque tout en maintenant le point de vue subjectif d’Amnon.
