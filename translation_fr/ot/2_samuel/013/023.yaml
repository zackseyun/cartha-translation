  text: וַֽ/יְהִי֙ לִ/שְׁנָתַ֣יִם יָמִ֔ים וַ/יִּהְי֤וּ גֹֽזְזִים֙ לְ/אַבְשָׁל֔וֹם בְּ/בַ֥עַל חָצ֖וֹר אֲשֶׁ֣ר עִם אֶפְרָ֑יִם וַ/יִּקְרָ֥א אַבְשָׁל֖וֹם לְ/כָל בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: fr
  text: Au bout de deux années entières[a], Absalom fit tondre ses moutons à Baal-Hatsor, près d’Éphraïm, et il invita tous les fils du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « deux années de jours », expression hébraïque désignant deux années complètes.'
    reason: L’expression idiomatique de l’hébreu est rendue par son sens dans le texte, tandis que la note en conserve la forme littérale.
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: Au bout de deux années entières
  rationale: L’expression hébraïque, littéralement « deux années de jours », désigne une période complète de deux ans. Cette formulation française rend naturellement l’achèvement de cette période.
- source_word: גֹזְזִים לְאַבְשָׁלוֹם
  choice: Absalom fit tondre ses moutons
  rationale: Le participe désigne des tondeurs appartenant au service d’Absalom ou travaillant pour lui. La tournure causative française exprime clairement la situation sans alourdir le récit; « ses moutons » explicite l’objet naturellement sous-entendu par le contexte.
- source_word: בְּבַעַל חָצוֹר
  choice: à Baal-Hatsor
  rationale: Le nom du lieu est translittéré; « à » convient à l’indication du lieu où se déroule la tonte.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: près d’Éphraïm
  rationale: Dans cette indication géographique, עִם exprime la proximité. « Près de » est idiomatique en français et préserve la référence, qui peut désigner une localité appelée Éphraïm.
- source_word: וַיִּקְרָא
  choice: il invita
  rationale: Le verbe signifie littéralement « appeler », mais, dans le contexte d’une réunion liée à la tonte, son sens pragmatique est « inviter ».
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: tous les fils du roi
  rationale: Traduction directe et naturelle de la construction génitivale hébraïque.
- source_word: וַיְהִי
  choice: Au bout de
  rationale: La formule narrative introduit ici l’étape temporelle suivante. En français, la progression est rendue naturellement par la proposition temporelle, sans ajouter un marqueur tel que « Or » ou « Il arriva ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste fluide tout en conservant le lieu, la durée complète et l’ensemble des fils du roi.
