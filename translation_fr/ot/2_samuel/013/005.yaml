source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: fr
  text: 'Yonadab lui dit : « Couche-toi sur ton lit et fais semblant d’être malade[a]. Quand ton père viendra te voir, dis-lui : “Que ma sœur Tamar vienne, s’il te plaît, me donner à manger[b]. Qu’elle prépare sous mes yeux le repas[c], afin que je voie et que je mange de sa main.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « feins d’être malade ». Le verbe hébreu signifie ici se donner l’apparence d’être malade.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « du pain » ; en hébreu, ce mot peut désigner plus largement la nourriture.
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu désigne probablement une nourriture spécialement préparée pour une personne malade ou convalescente.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: Couche-toi sur ton lit
  rationale: Cette formulation rend naturellement en français l’action de s’étendre sur son lit, sans alourdir l’expression.
- source_word: וְהִתְחָל
  choice: fais semblant d’être malade
  rationale: Dans ce contexte, la forme verbale indique qu’Amnon doit paraître malade, et non se rendre réellement malade.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: Quand ton père viendra te voir
  rationale: La subordination temporelle exprime naturellement en français la suite d’instructions introduite par l’hébreu.
- source_word: תָּבֹא נָא
  choice: Que … vienne, s’il te plaît
  rationale: La tournure au subjonctif rend la demande adressée au père, tandis que « s’il te plaît » restitue la particule de supplication נָא.
- source_word: תָמָר אֲחוֹתִי
  choice: ma sœur Tamar
  rationale: Ordre idiomatique en français pour l’apposition hébraïque « Tamar, ma sœur » dans cette demande.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: me donner à manger
  rationale: Le verbe ברה évoque ici le fait de nourrir ou de fournir de la nourriture à un malade. Cette traduction le distingue de עשה, « préparer », employé ensuite.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: Qu’elle prépare sous mes yeux le repas
  rationale: « Sous mes yeux » conserve l’élément visuel, et « le repas » désigne naturellement la nourriture préparée pour le prétendu malade.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: afin que je voie
  rationale: La traduction conserve le verbe de perception sans lui ajouter un complément d’objet absent de l’hébreu.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: et que je mange de sa main
  rationale: 'L’expression préserve le rôle personnel de Tamar : Amnon veut recevoir directement d’elle ce qu’il mangera.'
