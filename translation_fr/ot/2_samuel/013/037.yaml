  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: fr
  text: Mais Absalom s’enfuit et se rendit auprès de Talmaï, fils d’Ammihour, roi de Gueshour. Et David[a] porta le deuil de son fils chaque jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le sujet de « porta le deuil » est implicite; le contexte indique qu’il s’agit de David.
    reason: Le français exige ici de clarifier un antécédent que l’hébreu laisse sous-entendu.
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם בָּרַח
  choice: Mais Absalom s’enfuit
  rationale: La conjonction marque ici naturellement le contraste narratif; « s’enfuit » rend directement le verbe בּרח dans un registre actuel et digne.
- source_word: וַיֵּלֶךְ אֶל
  choice: et se rendit auprès de
  rationale: Cette formulation française exprime le déplacement vers une personne sans suggérer que Talmaï serait un lieu.
- source_word: תַּלְמַי בֶּן עמיחור
  choice: Talmaï, fils d’Ammihour
  rationale: Les noms propres sont translittérés selon un usage français clair, et le patronyme hébreu est rendu directement.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: roi de Gueshour
  rationale: La chaîne construite identifie Talmaï comme roi de Gueshour; l’absence d’article convient à l’apposition française.
- source_word: וַיִּתְאַבֵּל
  choice: Et David porta le deuil
  rationale: Le hitpael de אבל désigne le fait de mener deuil. Le sujet implicite est explicité comme David d’après le contexte, tout en étant signalé par une note.
- source_word: עַל בְּנוֹ
  choice: de son fils
  rationale: Avec « porter le deuil », la construction française idiomatique est « de »; le fils visé dans le contexte est Amnon.
- source_word: כָּל הַיָּמִים
  choice: chaque jour
  rationale: Cette expression rend naturellement la continuité de l’idiome hébreu sans lui donner le sens de « toute sa vie ».
theological_decisions:
- issue: Identité du sujet implicite de וַיִּתְאַבֵּל
  choice: David est nommé dans le texte avec un appel de note.
  alternative: Conserver le pronom ambigu « il ».
  rationale: Le verbe hébreu n’exprime qu’un sujet masculin singulier, mais le contexte narratif renvoie à David. L’explicitation évite en français de faire de Talmaï l’antécédent immédiat, tandis que la note préserve la donnée grammaticale et l’ambiguïté formelle de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Les formes « Talmaï », « Ammihour » et « Gueshour » suivent une translittération francisée lisible. « Chaque jour » est préféré au calque peu naturel « tous les jours » après un passé simple, et évite l’interprétation potentiellement excessive « toute sa vie ».
