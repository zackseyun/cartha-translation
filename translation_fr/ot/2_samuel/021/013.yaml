  text: וַ/יַּ֤עַל מִ/שָּׁם֙ אֶת עַצְמ֣וֹת שָׁא֔וּל וְ/אֶת עַצְמ֖וֹת יְהוֹנָתָ֣ן בְּנ֑/וֹ וַ/יַּ֣אַסְפ֔וּ אֶת עַצְמ֖וֹת הַ/מּוּקָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: fr
  text: Il fit remonter de là les ossements de Saül et ceux de son fils Jonathan. Puis ils recueillirent les ossements de ceux qui avaient été exécutés et exposés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ceux qui avaient été suspendus » ; ou : « de ceux qui avaient été empalés ». Le terme hébreu désigne ici les hommes exécutés dont les corps avaient été exposés publiquement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Il fit remonter
  rationale: Le hiphil de עלה exprime ici le fait de faire monter ou de retirer les ossements du lieu où ils se trouvaient. « Fit remonter » conserve cette nuance concrète.
- source_word: מִשָּׁם
  choice: de là
  rationale: Équivalent français direct et naturel de l’adverbe déictique.
- source_word: עַצְמוֹת
  choice: les ossements
  rationale: Le mot désigne littéralement les os. Dans un contexte funéraire, « ossements » est plus naturel et plus digne en français que « os ».
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: son fils Jonathan
  rationale: Cette formulation française indique sans ambiguïté que Jonathan est le fils de Saül, tout en restant naturelle.
- source_word: וַיַּאַסְפוּ
  choice: ils recueillirent
  rationale: La forme verbale est au pluriel et ne doit pas être harmonisée avec le sujet singulier du premier verbe. « Recueillir » convient à la collecte d’ossements en vue de leur ensevelissement.
- source_word: הַמּוּקָעִים
  choice: ceux qui avaient été exécutés et exposés
  rationale: Le terme désigne ici les hommes mis à mort dont les corps avaient été publiquement suspendus ou exposés. Cette formulation évite d’imposer un procédé précis, tel que la pendaison ou l’empalement, que le terme hébreu ne permet pas d’établir avec certitude.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La séparation en deux phrases rend clairement le passage du verbe singulier (« il fit remonter ») au verbe pluriel (« ils recueillirent »), distinction présente dans l’hébreu. Le marqueur de note est placé immédiatement après l’expression qu’il explique.
