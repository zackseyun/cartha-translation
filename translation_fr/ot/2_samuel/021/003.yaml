source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: fr
  text: 'David dit aux Gabaonites : « Que dois-je faire pour vous, et par quel moyen ferai-je expiation afin que vous bénissiez l’héritage de Yahweh[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire la fin de la phrase plus littéralement : « et bénissez l’héritage de Yahweh ». « L’héritage de Yahweh » désigne ici Israël, le peuple qui lui appartient.'
    reason: La forme hébraïque permet une coordination simple aussi bien qu’un sens de finalité ou de résultat ; la note explicite également la métaphore culturelle.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר est la formule narrative habituelle introduisant les paroles de David ; « dit » reste direct et sans surinterprétation.
- source_word: הַגִּבְעֹנִים
  choice: les Gabaonites
  rationale: Désignation française traditionnelle et intelligible des habitants de Gabaon.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: Que dois-je faire pour vous ?
  rationale: L’interrogatif suivi de l’inaccompli exprime ici une délibération ; cette formulation est naturelle en français moderne.
- source_word: וּבַמָּה
  choice: Par quel moyen
  rationale: La préposition ב marque le moyen ou l’instrument. « Par quel moyen » en conserve explicitement la nuance, plus nettement que le simple « comment ».
- source_word: אֲכַפֵּר
  choice: ferai-je expiation
  rationale: Le piel de כפר porte ici l’idée d’expier une faute grave et de remédier à la culpabilité liée à la violation d’une alliance. « Faire expiation » en préserve le poids religieux et réparateur.
- source_word: וּבָרְכוּ
  choice: afin que vous bénissiez
  rationale: Le waw suivi de la forme volitive peut exprimer le résultat recherché. « Afin que » rend clairement ce rapport tout en laissant en note la coordination plus littérale.
- source_word: נַחֲלַת יְהוָה
  choice: l’héritage de Yahweh
  rationale: נחלה désigne ce qui appartient en propre à Yahweh, ici son peuple Israël ; « héritage » conserve l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel plutôt que substitution par un titre.
theological_decisions:
- issue: Sens de כפר dans un contexte de faute de sang et de violation d’alliance
  choice: faire expiation
  alternative: réparer le tort ; faire amende honorable
  rationale: « Faire expiation » maintient la portée collective, religieuse et réparatrice du terme sans la réduire à une simple compensation sociale.
- issue: Rapport syntaxique de וּבָרְכוּ avec la demande précédente
  choice: 'finalité ou résultat : « afin que vous bénissiez »'
  alternative: 'coordination simple : « et bénissez »'
  rationale: Le contexte favorise l’action que David accomplira pour obtenir la bénédiction des Gabaonites sur Israël, mais la coordination hébraïque demeure possible et est signalée en note.
- issue: Référent de « l’héritage de Yahweh »
  choice: conserver la métaphore, comprise comme désignant Israël
  alternative: expliciter directement « le peuple de Yahweh »
  rationale: La traduction garde l’expression théologiquement significative du texte hébreu ; une note en éclaire le référent sans l’aplatir.
translation_notes:
  register: Français international moderne, digne et accessible. Les interrogations sont séparées pour une syntaxe française fluide. « Faire expiation » est volontairement soutenu mais demeure biblique et compréhensible ; le nom divin est rendu par « Yahweh ».
