  text: וַ/יֻּגַּ֖ד לְ/דָוִ֑ד אֵ֧ת אֲשֶׁר עָשְׂתָ֛ה רִצְפָּ֥ה בַת אַיָּ֖ה פִּלֶ֥גֶשׁ שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/011.yaml
  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: fr
  text: On rapporta à David ce qu’avait fait Ritspa, fille d’Aïa et concubine de Saül.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On rapporta
  rationale: Le passif hébreu du verbe נגד introduit une information transmise. La tournure française indéfinie « On rapporta » est naturelle dans un récit et conserve l’absence d’un agent nommé.
- source_word: לְדָוִד
  choice: à David
  rationale: La préposition לְ marque ici le destinataire de l’information.
- source_word: אֵת אֲשֶׁר
  choice: ce que
  rationale: L’indicateur d’objet suivi du relatif introduit le contenu rapporté ; « ce que » est la formulation française idiomatique.
- source_word: עָשְׂתָה
  choice: avait fait
  rationale: L’action de Ritspa précède le moment où elle est rapportée à David ; le plus-que-parfait exprime clairement cette antériorité narrative.
- source_word: רִצְפָּה
  choice: Ritspa
  rationale: Translittération française usuelle du nom hébreu רִצְפָּה, avec « ts » pour צ.
- source_word: בַת אַיָּה
  choice: fille d’Aya
  rationale: Identification patronymique rendue directement et naturellement en français.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: concubine de Saül
  rationale: La chaîne construite désigne le statut et la relation de Ritspa à Saül. « Concubine » préserve sans euphémisme la désignation sociale du texte.
theological_decisions: []
