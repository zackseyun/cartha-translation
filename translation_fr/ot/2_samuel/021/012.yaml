    rationale: 'La séquence hébraïque comporte deux verbes narratifs successifs : David alla, puis prit. « David se rendit ... et prit » les rend tous deux de manière plus précise.'
  - severity: low
    issue: « volés sur la place publique » est moins précis que nécessaire pour מֵרְחֹב.
    rationale: La préposition hébraïque indique que les ossements ont été enlevés depuis la place publique. « De la place publique » rend explicitement cette provenance.
  - severity: low
    issue: La note b qualifie « empalés » d’interprétation du « supplice ».
    rationale: Le texte ne précise pas le mode d’exposition et ne requiert pas de caractériser celle-ci comme un supplice. Une formulation neutre préserve mieux l’ambiguïté.
