  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יִּקַּ֞ח אֶת עַצְמ֤וֹת שָׁאוּל֙ וְ/אֶת עַצְמוֹת֙ יְהוֹנָתָ֣ן בְּנ֔/וֹ מֵ/אֵ֕ת בַּעֲלֵ֖י יָבֵ֣ישׁ גִּלְעָ֑ד אֲשֶׁר֩ גָּנְב֨וּ אֹתָ֜/ם מֵ/רְחֹ֣ב בֵּֽית שַׁ֗ן אֲשֶׁ֨ר תלו/ם שם ה/פלשתים בְּ/י֨וֹם הַכּ֧וֹת פְּלִשְׁתִּ֛ים אֶת שָׁא֖וּל בַּ/גִּלְבֹּֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: fr
  text: Puis David se rendit chez les habitants de Yabesh-de-Galaad[a] et prit les ossements de Saül et ceux de son fils Jonathan. Ceux-ci les avaient volés de la place publique de Beth-Shân, où les Philistins les avaient suspendus[b] le jour où ils abattirent Saül au Guilboa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les maîtres de Yabesh-de-Galaad », expression qui désigne ici les habitants de la ville.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « exposés » ou, dans une interprétation plus précise du mode d’exposition, « empalés » ; le verbe hébreu signifie d’abord « suspendre » ou « pendre ».'
    reason: lexical_alternative
  - marker: c
    text: Guilboa désigne la région montagneuse où Saül est tombé (voir 1 Samuel 31.8-13).
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמוֹת
  choice: ossements
  rationale: Le nom hébreu désigne littéralement les os. « Ossements » convient naturellement en français au contexte funéraire tout en conservant le caractère concret du terme.
- source_word: בַּעֲלֵי
  choice: habitants de
  rationale: Avec un nom de lieu, le terme désigne ici les gens rattachés à cette ville. « Habitants de » est idiomatique et n'ajoute aucune restriction de sexe absente de l'expression.
- source_word: יָבֵישׁ גִּלְעָד
  choice: Yabesh-de-Galaad
  rationale: Cette forme française identifie clairement la ville de Yabesh située en Galaad.
- source_word: גָּנְבוּ
  choice: avaient volés
  rationale: Le verbe signifie proprement « voler ». Le plus-que-parfait marque que cette action précède celle de David.
- source_word: מֵרְחֹב
  choice: sur la place publique
  rationale: Le nom désigne un espace ouvert de la ville, notamment une place. « Place publique » rend clairement ce cadre civique.
- source_word: בֵּית שַׁן
  choice: Beth-Shân
  rationale: Forme française traditionnelle et reconnaissable du nom de lieu.
- source_word: תלוּם שָׁם
  choice: les avaient suspendus
  rationale: Le verbe signifie d'abord « suspendre, pendre ». Cette traduction préserve l'ambiguïté entre suspension du cadavre et exposition publique sans imposer l'idée plus précise d'empalement.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: avaient abattu Saül
  rationale: « Abattre » exprime ici le coup mortel porté à Saül et conserve la force verbale de נכה sans réduire l'expression à une simple défaite.
- source_word: בַּגִּלְבֹּעַ
  choice: au Guilboa
  rationale: Le texte nomme simplement Guilboa. La préposition française « au » convient au massif sans ajouter explicitement « mont ».
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: Puis David alla prendre
  rationale: « Puis » marque la progression narrative, tandis que « alla prendre » reproduit naturellement la succession des deux verbes hébreux.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: son fils Jonathan
  rationale: Cette formulation française indique sans ambiguïté que Jonathan est le fils de Saül, conformément à l'apposition hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été divisée en deux phrases pour éviter une longue chaîne de relatives et clarifier que les habitants de Yabesh-de-Galaad sont les auteurs du geste antérieur. Les noms propres suivent des formes françaises courantes.
