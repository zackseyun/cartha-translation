source:
  edition: WLC
  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: fr
  text: 'À l’époque de David, il y eut une famine pendant trois ans, année après année. David consulta Yahvé[a], et Yahvé dit : « C’est à cause de Saül et de sa maison coupable de sang versé[b], parce qu’il a mis à mort les Gabaonites. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « rechercha Yahvé » ; littéralement : « rechercha la face de Yahvé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « maison des sangs », expression hébraïque désignant une maisonnée coupable d’avoir versé le sang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: famine
  rationale: Dans ce récit, le terme désigne une grave pénurie de nourriture touchant le pays, et non simplement la faim ressentie par des individus.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: pendant trois ans, année après année
  rationale: La formulation conserve à la fois la durée de trois ans et l’insistance hébraïque sur leur succession continue.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: rechercha la face de Yahvé
  rationale: Cette traduction maintient l’image hébraïque de la « face », tout en restant intelligible en français et en exprimant une démarche personnelle auprès de Dieu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: C’est à cause de Saül et de sa maison coupable d’effusion de sang
  rationale: Dans le contexte, la réponse divine indique la cause de la famine. « Maison » désigne ici la maisonnée ou la dynastie, et l’expression française rend la culpabilité liée au sang versé.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: parce qu’il a fait mourir les Gabaonites
  rationale: Le verbe au singulier renvoie à Saül comme agent principal. « Faire mourir » conserve le ton formel et la portée de responsabilité du passage.
- source_word: הַגִּבְעֹנִים
  choice: les Gabaonites
  rationale: Il s’agit de la forme française biblique usuelle du nom de ce peuple.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: La transcription préserve le nom personnel présent dans le texte hébreu, tandis que la forme française « Yahvé » demeure largement reconnaissable.
- issue: Sens de la formule concernant Saül et sa maison
  choice: La famine est présentée comme survenant à cause de Saül et de sa maison coupable d’effusion de sang, en raison de la mise à mort des Gabaonites.
  alternative: 'Traduire littéralement : « vers Saül et vers la maison des sangs ».'
  rationale: La réponse de Yahvé explique la cause de la famine. L’explicitation causale est nécessaire en français, mais la note conserve l’image littérale et sa force judiciaire.
translation_notes:
  register: Français international moderne, narratif et digne. Le début reste direct, sans ajouter de connecteur temporel absent de l’hébreu. L’expression « année après année » conserve l’insistance du texte source, et les deux idiomes hébraïques importants sont maintenus dans le corps du texte puis éclairés en note.
