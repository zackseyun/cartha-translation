base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: fr
  text: Après cela, il y eut encore une guerre contre les Philistins à Gob. Alors Sibkaï le Houshatite abattit Saph[a], qui était l’un des descendants de Rapha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Saph » ; le passage parallèle en 1 Chroniques 20.4 donne « Sippaï ».
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « qui était l’un des descendants du géant ». L’hébreu peut renvoyer soit à un personnage nommé Rapha, soit à la lignée des géants ou des Rephaïm.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Après cela
  rationale: Transition temporelle naturelle qui conserve l’enchaînement du récit sans l’alourdir.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: il y eut encore une guerre
  rationale: Rend la reprise du conflit exprimée par עוֹד dans un français narratif naturel.
- source_word: בְּגֹב עִם פְּלִשְׁתִּים
  choice: contre les Philistins à Gob
  rationale: Dans ce contexte militaire, « contre » exprime naturellement les parties en conflit, tandis que « à Gob » indique le lieu de la bataille.
- source_word: אָז
  choice: Alors
  rationale: Marque simplement l’étape suivante du récit.
- source_word: הִכָּה
  choice: abattit
  rationale: En contexte de combat, le verbe désigne ici le fait de frapper mortellement ou de terrasser; « abattit » en conserve la force sans archaïsme.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibkaï le Houshatite
  rationale: Translittération française lisible du nom personnel et du gentilé, sans identification géographique conjecturale.
- source_word: סַף
  choice: Saf
  rationale: Reproduit la forme du nom dans le texte massorétique de ce verset; la forme parallèle « Sippaï » est signalée en note.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: qui était l’un des descendants de Rapha
  rationale: « Descendants » rend la notion d’appartenance à une lignée, et « Rapha » conserve dans le texte principal la possibilité d’un nom propre sans imposer l’interprétation « géant ».
theological_decisions:
- issue: Faut-il comprendre הָרָפָה comme un nom propre ou comme la désignation du géant/de la lignée des Rephaïm ?
  choice: Rapha, compris comme nom propre ou ancêtre de lignée
  alternative: le géant; le Rephaïte
  rationale: La construction généalogique favorise une référence de lignée, mais l’hébreu permet aussi l’interprétation traditionnelle « le géant ». Le texte principal conserve « Rapha » et la note maintient l’ambiguïté.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe narrative simple. Les noms sont translittérés sous des formes lisibles en français; les ambiguïtés textuelle et généalogique sont conservées dans les notes.
