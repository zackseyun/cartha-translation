  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מדין וְ/אֶצְבְּעֹ֣ת יָדָי/ו֩ וְ/אֶצְבְּעֹ֨ת רַגְלָ֜י/ו שֵׁ֣שׁ וָ/שֵׁ֗שׁ עֶשְׂרִ֤ים וְ/אַרְבַּע֙ מִסְפָּ֔ר וְ/גַם ה֖וּא יֻלַּ֥ד לְ/הָ/רָפָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: fr
  text: 'Il y eut encore une guerre à Gath. Il y avait là un homme d’une stature extraordinaire[a] : il avait six doigts à chaque main et six orteils à chaque pied, soit vingt-quatre en tout. Lui aussi était issu de Rapha[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile ; littéralement, elle peut se comprendre comme « un homme de mesure », c’est-à-dire un homme de taille ou de stature exceptionnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « était né de Rapha ». Le nom peut évoquer les Rephaïm, un groupe souvent associé à des hommes de très grande taille.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: guerre
  rationale: Le nom désigne la guerre ou un conflit armé; « guerre » conserve la portée générale du terme dans cette série d’affrontements.
- source_word: בְּגַת
  choice: à Gath
  rationale: La préposition ב situe ici l’action; « à Gath » est la formulation française naturelle pour une ville.
- source_word: אִישׁ מדין
  choice: un homme d’une stature extraordinaire
  rationale: L’expression difficile semble décrire des dimensions physiques hors du commun. Cette formulation rend le sens probable sans recourir au calque obscur « homme de mesure ».
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: six doigts à chaque main et six orteils à chaque pied
  rationale: L’hébreu parle littéralement des « doigts de ses mains » et des « doigts de ses pieds ». Le français distingue naturellement les doigts des orteils; le total explicite de vingt-quatre montre que chacune des quatre extrémités en comptait six.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: six ... à chaque
  rationale: La répétition hébraïque répartit les six doigts et les six orteils; la construction française explicite clairement cette distribution.
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: soit vingt-quatre en tout
  rationale: Cette expression restitue naturellement le récapitulatif numérique de l’hébreu.
- source_word: יֻלַּד לְהָרָפָה
  choice: était né de Rapha
  rationale: Le passif de ילד avec ל exprime ici l’origine ou la descendance. Garder « Rapha » comme désignation propre préserve l’ambiguïté du référent.
theological_decisions:
- issue: Identité de הָרָפָה
  choice: Rapha, comme désignation ancestrale laissée inexpliquée dans le corps du texte
  alternative: le géant; les Rephaïm; un descendant de Rapha
  rationale: Le contexte indique une filiation, mais ne permet pas de trancher avec certitude entre un ancêtre nommé Rapha et un rattachement au groupe des Rephaïm. La traduction ne transforme donc pas directement le terme en « géant ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe explicite la répartition des vingt-quatre doigts et orteils tout en conservant l’indication de guerre et l’ambiguïté généalogique liée à Rapha.
