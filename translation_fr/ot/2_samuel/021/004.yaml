translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct. « Faire mourir » conserve le registre judiciaire de l’hébreu sans employer le plus abrupt « tuer ». Les notes maintiennent l’ambiguïté de deux tournures elliptiques.
