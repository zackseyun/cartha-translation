base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: fr
  text: 'Les Gabaonites lui répondirent : « Nous ne réclamons ni argent ni or à Saül ni à sa famille[a], et ce n’est pas à nous de faire mourir qui que ce soit en Israël[b]. » Il dit alors : « Que voulez-vous que je fasse pour vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il ne s’agit pas d’argent ou d’or entre nous et Saül, ainsi que sa famille. » La tournure hébraïque est idiomatique et renvoie probablement à une indemnisation financière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous n’avons pas le droit de faire mourir qui que ce soit en Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: Nous ne réclamons ni argent ni or à Saül ou à sa famille
  rationale: La tournure hébraïque est idiomatique et, dans le contexte, concerne vraisemblablement une indemnisation pécuniaire. « Nous ne réclamons » rend clairement ce sens juridique ou compensatoire sans transformer la phrase en simple constat de possession. Le pluriel français correspond aux Gabaonites qui parlent collectivement, malgré le singulier לִי.
- source_word: עִם
  choice: à
  rationale: Dans ce contexte de réclamation, עִם désigne les parties auxquelles une compensation pourrait être demandée. La construction française « réclamer à » exprime naturellement ce rapport.
- source_word: בֵּיתוֹ
  choice: sa famille
  rationale: « Maison » peut désigner ici la maisonnée ou la lignée de Saül. « Sa famille » est naturel en français moderne et convient aux personnes visées dans la suite du récit.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: et ce n’est pas à nous de faire mourir qui que ce soit en Israël
  rationale: La proposition elliptique exprime vraisemblablement l’absence de prérogative ou d’autorité pour exécuter un Israélite, plutôt que l’absence d’une personne à tuer. « Ce n’est pas à nous » conserve cette retenue sans expliciter excessivement la notion de droit.
- source_word: אִישׁ
  choice: qui que ce soit
  rationale: Dans cette phrase négative, le nom singulier a une portée indéfinie générale. « Qui que ce soit » est idiomatique et inclusif en français, tout en rendant l’idée d’aucun individu.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: Que voulez-vous que je fasse pour vous ?
  rationale: 'La formulation hébraïque est condensée : littéralement, « Que dites-vous que je fasse pour vous ? » La traduction retenue exprime naturellement la demande de David : il invite les Gabaonites à indiquer ce qu’ils souhaitent qu’il fasse.'
