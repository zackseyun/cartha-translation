  text: וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הָ/אִישׁ֙ אֲשֶׁ֣ר כִּלָּ֔/נוּ וַ/אֲשֶׁ֖ר דִּמָּה לָ֑/נוּ נִשְׁמַ֕דְנוּ מֵֽ/הִתְיַצֵּ֖ב בְּ/כָל גְּבֻ֥ל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: fr
  text: 'Ils dirent au roi : « L’homme qui nous a anéantis et qui avait conçu contre nous[a] le projet de nous exterminer, afin que nous ne puissions plus subsister[b] nulle part sur le territoire d’Israël— »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui avait tramé contre nous ». Le verbe hébreu peut désigner le fait de concevoir un projet ou de tramer quelque chose.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de nous tenir ou de nous établir sur tout le territoire d’Israël » ; il s’agit de ne plus pouvoir conserver aucune présence en Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: nous a décimés
  rationale: Le piel de כלה exprime ici l’action de mener à sa fin, de détruire. « Nous a décimés » convient à la plainte collective de survivants et conserve la force de l’accusation sans laisser entendre que chacun d’eux a effectivement péri.
- source_word: דִּמָּה לָנוּ
  choice: avait conçu contre nous le projet
  rationale: Dans ce contexte, דמה désigne un dessein ou un projet hostile; « contre nous » rend la valeur adversative de לָנוּ. Le plus-que-parfait situe naturellement ce dessein derrière les actes reprochés.
- source_word: נִשְׁמַדְנוּ
  choice: de nous exterminer
  rationale: Le niphal de שׁמד évoque la destruction ou l’extermination. L’infinitif français l’intègre au projet hostile tout en maintenant la gravité du terme.
- source_word: מֵהִתְיַצֵּב
  choice: afin que nous n’ayons plus aucune place
  rationale: התיצב signifie littéralement se tenir, prendre position ou s’établir. Dans ce contexte, l’expression française désigne la suppression de toute présence durable en Israël.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: sur tout le territoire d’Israël
  rationale: גְּבוּל désigne ici l’étendue territoriale d’Israël plutôt que sa seule ligne frontalière; « tout » en conserve la portée globale.
- source_word: הָאִישׁ
  choice: L’homme
  rationale: L’article défini renvoie à Saül, déjà identifié dans le contexte. La formulation reste proche de l’hébreu et naturelle dans le discours direct.
