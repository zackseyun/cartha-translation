  text: וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים וַ/יַּ֡ךְ אֶלְחָנָן֩ בֶּן יַעְרֵ֨י אֹרְגִ֜ים בֵּ֣ית הַלַּחְמִ֗י אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: fr
  text: Il y eut encore une guerre contre les Philistins, à Gob. Elhanan, fils de Yaaré-Oreguim[a], le Bethléhémite, abattit Goliath, le Gathien[b]. La hampe de sa lance était comme l’ensouple d’un métier à tisser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu Yaaré-Oreguim est difficile. Certains pensent que le mot « Oreguim » (« tisserands ») a été répété par inadvertance à partir de la fin du verset.
    reason: textual_variant
  - marker: b
    text: '1 Chroniques 20.5 présente une autre formulation : Elhanan y tue Lahmi, frère de Goliath. Beaucoup considèrent que le texte de Samuel conserve ici une leçon difficile ou altérée et proposent de l’harmoniser avec celle des Chroniques.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/ג֖וֹב
  choice: à Gob
  rationale: Avec un nom de lieu désignant le théâtre d’une bataille, la préposition בְ est naturellement rendue par « à ». Le nom propre Gob est translittéré.
- source_word: וַ/יַּ֡ךְ
  choice: abattit
  rationale: Dans ce contexte guerrier, נכה désigne le fait de frapper mortellement ou de terrasser. « Abattit » conserve la force martiale du verbe sans l’aplatir en un simple « frappa ».
- source_word: יַעְרֵ֨י אֹרְגִ֜ים
  choice: Yaaré-Oreguim
  rationale: Le texte massorétique présente cette forme difficile dans la désignation du père d’Elhanan. Elle est conservée et translittérée plutôt que corrigée silencieusement d’après le passage parallèle.
- source_word: בֵּ֣ית הַלַּחְמִ֗י
  choice: le Bethléhémite
  rationale: La forme hébraïque est comprise dans son sens gentilé et rendue par le terme français naturel désignant un homme de Bethléhem.
- source_word: אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י
  choice: Goliath, le Gathien
  rationale: Le texte massorétique nomme explicitement Goliath comme objet direct. « Gathien » rend le gentilé indiquant son origine, Gath, sans harmoniser le texte avec 1 Chroniques 20.5.
- source_word: וְ/עֵ֣ץ חֲנִית֔/וֹ
  choice: La hampe de sa lance
  rationale: עֵץ signifie littéralement « bois », mais désigne ici la partie longue et rigide de la lance. « Hampe » est le terme français précis et naturel.
- source_word: כִּ/מְנ֖וֹר אֹרְגִֽים
  choice: comme l’ensouple d’un métier à tisser
  rationale: מְנוֹר désigne ici la grosse pièce de bois d’un métier à tisser. « Ensouple » restitue précisément l’image, tandis que l’ajout « d’un métier à tisser » la rend compréhensible dans son contexte.
theological_decisions:
- issue: Tension apparente avec le récit où David tue Goliath en 1 Samuel 17 et avec le parallèle de 1 Chroniques 20.5
  choice: Conserver dans le texte principal la leçon massorétique selon laquelle Elhanan abattit Goliath le Gathien.
  alternative: Lire qu’Elhanan tua Lahmi, frère de Goliath le Gathien, en harmonisant avec 1 Chroniques 20.5.
  rationale: Le texte hébreu fourni nomme expressément Goliath. La traduction ne résout donc pas silencieusement la tension avec les autres passages; elle signale la variante du parallèle dans une note.
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation répartit la longue phrase hébraïque en trois phrases lisibles. Les formes difficiles du texte massorétique sont maintenues dans le corps du texte et expliquées en notes, sans harmonisation silencieuse.
