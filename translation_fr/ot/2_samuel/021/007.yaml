source:
  edition: WLC
  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: fr
  text: Mais le roi épargna Mephibosheth, fils de Jonathan, fils de Saül, à cause du serment de Yahweh[a] qui existait entre eux, entre David et Jonathan, fils de Saül.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens probable dans ce contexte : « le serment prêté au nom de Yahweh » ; c’est-à-dire le serment échangé entre David et Jonathan en prenant Yahweh à témoin.'
    reason: Préciser le sens contextuel probable de la construction hébraïque sans supprimer son ambiguïté dans le texte principal.
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: épargna
  rationale: Dans ce contexte, le verbe חמל indique que le roi s’abstient de livrer Mephibosheth à la mort. « Épargna » exprime directement cette action tout en gardant l’idée de compassion.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le titre défini désigne David dans le contexte, mais la traduction conserve la désignation formelle du texte hébreu.
- source_word: מְפִיבֹשֶׁת
  choice: Mephibosheth
  rationale: Le nom propre est translittéré sous sa forme française courante.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: fils de Jonathan, fils de Saül
  rationale: La répétition de « fils de » préserve la structure généalogique de l’hébreu, plutôt que de l’expliciter par « petit-fils de Saül ».
- source_word: עַל
  choice: à cause de
  rationale: La préposition introduit ici le motif de la décision du roi. « À cause de » rend clairement ce rapport causal en français courant.
- source_word: שְׁבֻעַת יְהוָה
  choice: le serment de Yahweh
  rationale: 'Cette formulation proche de l’hébreu conserve l’ambiguïté grammaticale : il peut s’agir d’un serment prêté au nom de Yahweh ou, littéralement, d’un serment attribué à Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֲשֶׁר בֵּינֹתָם
  choice: qui existait entre eux
  rationale: Cette expression garde l’image relationnelle de l’hébreu et prépare l’identification explicite des deux parties.
- source_word: בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: entre David et Jonathan
  rationale: Le français n’a pas besoin de répéter la préposition devant le second nom pour exprimer clairement la relation bilatérale.
theological_decisions:
- issue: Sens de « serment de Yahweh »
  choice: Conserver dans le texte l’expression littérale « serment de Yahweh », avec une note indiquant son sens contextuel probable.
  alternative: Traduire directement « serment prêté au nom de Yahweh » ou comprendre un serment prononcé par Yahweh lui-même.
  rationale: Dans ce contexte d’engagement entre David et Jonathan, l’expression désigne vraisemblablement un serment prêté en invoquant Yahweh comme témoin. Le texte principal ne tranche toutefois pas une ambiguïté que la construction hébraïque permet formellement.
- issue: Référent de « le roi »
  choice: Conserver « le roi ».
  alternative: Expliciter « le roi David ».
  rationale: Le contexte identifie David, mais l’hébreu emploie ici le titre seul ; le conserver respecte la présentation narrative.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la structure hébraïque, notamment dans la généalogie et dans la reprise « entre eux, entre David et Jonathan », sans devenir archaïque.
