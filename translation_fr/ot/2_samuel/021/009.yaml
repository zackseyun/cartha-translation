base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: fr
  text: Il les livra aux mains des Gabaonites, et ils les pendirent[a] sur la montagne devant Yahweh. Les sept tombèrent ensemble. Ils furent mis à mort dans les premiers jours de la moisson, au début de la moisson de l’orge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les empalèrent » ou « les exposèrent publiquement ». Le verbe hébreu peut désigner plus largement une exécution ou la suspension de personnes pour une exposition publique; il ne précise pas nécessairement une pendaison au sens moderne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד
  choice: Il les livra aux mains de
  rationale: La construction נתן + ביד exprime ici la remise de personnes au pouvoir d’autrui. « Livra aux mains de » rend cet idiome et sa force judiciaire plus justement qu’un simple « donna ».
- source_word: הַגִּבְעֹנִים
  choice: les Gabaonites
  rationale: « Gabaonites » est la forme française traditionnelle et couramment reconnue du nom de ce peuple.
- source_word: וַיֹּקִיעֻם
  choice: les pendirent
  rationale: Le verbe désigne une mise à mort ou une exposition publique par suspension ou empalement. « Pendirent » convient au récit, tandis qu’une note conserve l’incertitude sur le procédé exact.
- source_word: בָּהָר
  choice: sur la montagne
  rationale: Le nom défini singulier הַר désigne ici une montagne ou une hauteur déterminée; la traduction formelle « sur la montagne » préserve cette formulation.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formule indique que l’acte est accompli devant Dieu, avec une portée publique, judiciaire et cultuelle, sans préciser davantage cette relation.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: Tous les sept tombèrent ensemble
  rationale: Cette formulation rend le nombre collectif et conserve l’image hébraïque de la chute dans la mort.
- source_word: הֻמְתוּ
  choice: Ils furent mis à mort
  rationale: Le hophal de מות est causatif passif; « furent mis à mort » en restitue plus précisément la valeur que « furent tués ».
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: dans les premiers jours de la moisson
  rationale: La phrase situe les événements au commencement de la saison de la moisson.
- source_word: תְּחִלַּת קְצִיר שְׂעֹרִים
  choice: au début de la moisson de l’orge
  rationale: Cette apposition précise qu’il s’agit du début de la récolte de l’orge.
theological_decisions:
- issue: Nature exacte de l’exécution exprimée par יקע
  choice: Le texte principal dit « les pendirent » et signale l’ambiguïté par une note.
  alternative: « les empalèrent » ou « les exposèrent publiquement »
  rationale: Le contexte décrit une exécution publique devant Yahweh, mais le verbe hébreu ne permet pas de déterminer avec certitude si les victimes furent pendues au sens étroit, empalées ou suspendues pour être exposées. La note évite de trancher artificiellement.
translation_notes:
  register: Français international moderne, naturel et digne. « Livra aux mains » conserve la force de l’idiome hébreu sans lourdeur excessive. Les phrases sont légèrement segmentées pour assurer la clarté, tout en maintenant la succession narrative et l’image de la chute des sept hommes.
