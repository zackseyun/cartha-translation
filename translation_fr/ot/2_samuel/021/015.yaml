  text: וַ/תְּהִי ע֧וֹד מִלְחָמָ֛ה לַ/פְּלִשְׁתִּ֖ים אֶת יִשְׂרָאֵ֑ל וַ/יֵּ֨רֶד דָּוִ֜ד וַ/עֲבָדָ֥י/ו עִמּ֛/וֹ וַ/יִּלָּחֲמ֥וּ אֶת פְּלִשְׁתִּ֖ים וַ/יָּ֥עַף דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: fr
  text: Il y eut de nouveau une guerre entre les Philistins et Israël. David descendit avec ses serviteurs[a], et ils combattirent les Philistins. David fut pris de fatigue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses hommes ». L’hébreu dit littéralement « ses serviteurs », expression courante pour ceux qui étaient au service d’un roi, notamment ses hommes de guerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Il y eut de nouveau une guerre
  rationale: Formulation narrative naturelle qui conserve le sens existentiel de היה et la récurrence exprimée par עוֹד.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: entre les Philistins et Israël
  rationale: La construction désigne ici les deux camps opposés; « entre… et… » l’exprime clairement en français.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Conserve le sens spatial de ירד sans préciser une destination absente du texte.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: avec ses serviteurs
  rationale: עֲבָדָיו signifie littéralement « ses serviteurs » et peut désigner ici les hommes attachés au service militaire du roi. En français, « avec » rend déjà עִמּוֹ, de sorte qu’une répétition de « avec lui » serait maladroite.
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: ils combattirent les Philistins
  rationale: Rend directement l’engagement dans le combat exprimé par לחם; le complément sans préposition est idiomatique en français.
- source_word: וַיָּעַף
  choice: David s’épuisa
  rationale: Le verbe indique que David devint las ou défaillant sous l’effet du combat; « s’épuisa » conserve cette valeur progressive et prépare naturellement la suite du récit.
