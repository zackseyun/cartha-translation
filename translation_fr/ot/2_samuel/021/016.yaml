base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: fr
  text: Et Ishbi-Benob[a], l’un des descendants de Rapha[b], avait une lance qui pesait trois cents sicles de bronze et portait une épée neuve[c]. Il dit qu’il allait frapper David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme du nom hébreu est incertaine. « Ishbi-Benob » suit l’interprétation traditionnelle ; on trouve aussi « Yishbi-Benob », ou une autre division des consonnes.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « l’un de ceux qui étaient nés de Rapha ». Il s’agit probablement de la lignée de géants associée aux Rephaïm.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte seulement « neuve » ; le nom sous-entendu est incertain. Selon l’interprétation traditionnelle, il s’agit d’une épée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: Ishbi-Benob
  rationale: Le texte consonantique et sa vocalisation sont difficiles. La compréhension traditionnelle comme nom propre convient au contexte et aux noms des guerriers des versets voisins, mais l’incertitude est signalée en note.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: l’un des descendants de Rapha
  rationale: La tournure indique l’appartenance à une lignée. La translittération « Rapha » préserve le nom et évite de réduire d’emblée celui-ci au sens de « géant ».
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: avait une lance qui pesait
  rationale: Dans ce contexte guerrier, קֵין désigne vraisemblablement une lance ou sa hampe. La restructuration française exprime naturellement le poids de l’arme.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: trois cents sicles de bronze
  rationale: Le sicle est conservé comme unité ancienne, sans conversion moderne approximative. Dans le contexte militaire, נְחֹשֶׁת est rendu par « bronze ».
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: portait une épée neuve
  rationale: L’hébreu dit seulement « ceint d’une neuve », avec un nom féminin sous-entendu. « Épée » est le complément traditionnel et contextuellement probable, mais l’ellipse est indiquée en note.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: Il déclara qu’il allait abattre David
  rationale: Littéralement, la formule associe « dire » à l’infinitif « frapper ». Elle exprime ici une résolution déclarée; « abattre » convient au combat sans introduire la nuance juridique de « meurtre ».
