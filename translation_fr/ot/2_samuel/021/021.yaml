source:
  edition: WLC
  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שמעי אֲחִ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: fr
  text: Il défia Israël, et Jonathan, fils de Shimeï[a], frère de David, l’abattit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quelques manuscrits ainsi que le passage parallèle de 1 Chroniques 20.7 portent « Shiméa » ou « Shiméah » au lieu de « Shimeï ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: défia
  rationale: Dans ce contexte guerrier, le verbe exprime une provocation insultante lancée contre Israël. « Défia » rend naturellement la portée hostile du terme sans la réduire à une simple moquerie.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte désigne collectivement la nation d’Israël; le nom propre conserve directement cette valeur.
- source_word: וַיַּכֵּהוּ
  choice: l’abattit
  rationale: Le verbe נכה signifie fondamentalement « frapper »; dans ce combat mortel, « abattit » conserve l’image de l’action tout en indiquant naturellement son issue.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française courante de ce nom biblique.
- source_word: בֶּן שמעי
  choice: fils de Shimeï
  rationale: La traduction suit la forme שמעי du texte fourni, tout en signalant en note la variante attestée dans la tradition manuscrite et le passage parallèle.
- source_word: אֲחִי דָוִד
  choice: frère de David
  rationale: La construction hébraïque signifie littéralement « frère de David ». Sa position après « fils de Shimeï » identifie naturellement Shimeï comme le frère de David.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La coordination par « et » respecte la succession hébraïque sans introduire un contraste absent du texte. La ponctuation maintient l’apposition « frère de David » auprès de Shimeï, tout en conservant la concision de l’original.
