  text: וַ/יִּקְבְּר֣וּ אֶת עַצְמוֹת שָׁא֣וּל וִ/יהוֹנָֽתָן בְּ֠נ/וֹ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן בְּ/צֵלָ֗ע בְּ/קֶ֨בֶר֙ קִ֣ישׁ אָבִ֔י/ו וַֽ/יַּעֲשׂ֔וּ כֹּ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֑לֶךְ וַ/יֵּעָתֵ֧ר אֱלֹהִ֛ים לָ/אָ֖רֶץ אַֽחֲרֵי כֵֽן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: fr
  text: Ils ensevelirent les ossements de Saül et de Jonathan, son fils, dans le territoire de Benjamin, à Tséla, dans le tombeau de Qish, père de Saül. Ils firent tout ce que le roi avait ordonné. Après cela, Dieu se laissa fléchir en faveur du pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu exauça les supplications en faveur du pays » ou « Dieu répondit favorablement à la prière pour le pays ». Le verbe hébreu implique une réponse favorable à une supplication.
    reason: Alternative lexicale explicitant le sens du niphal de עתר.
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Ils ensevelirent
  rationale: Le verbe קבר désigne l’action d’enterrer ou d’ensevelir. Le passé simple convient au registre narratif biblique français tout en restant clair.
- source_word: עַצְמוֹת
  choice: les ossements
  rationale: Le mot signifie littéralement « os ». « Ossements » est naturel en français dans un contexte funéraire et conserve le caractère concret de l’hébreu.
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: de Saül et de Jonathan, son fils
  rationale: La formulation conserve explicitement le lien filial entre Jonathan et Saül.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: dans le territoire de Benjamin
  rationale: Cette expression rend la dimension géographique de אֶרֶץ sans suggérer ici un État indépendant; « pays de Benjamin » serait également possible.
- source_word: בְּצֵלָע
  choice: à Tséla
  rationale: Le nom de lieu est translittéré; la préposition « à » est idiomatique en français devant une localité.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: dans le tombeau de Qish, père de Saül
  rationale: קֶבֶר peut désigner une tombe ou un tombeau. Le référent de « son père » est explicité comme Saül afin d’éviter qu’en français Qish soit pris pour le père de Jonathan.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: Ils firent tout ce que le roi avait ordonné
  rationale: La formulation reproduit la totalité exprimée par כֹּל et emploie le plus-que-parfait pour rendre naturellement l’antériorité de l’ordre royal.
- source_word: וַיֵּעָתֵר אֱלֹהִים
  choice: Dieu se laissa fléchir
  rationale: Le niphal de עתר exprime une réponse favorable à une supplication. Cette tournure française préserve cette valeur sans ajouter explicitement un sujet humain ni une prière absente de la proposition.
- source_word: לָאָרֶץ
  choice: en faveur du pays
  rationale: 'La préposition ל indique ici l’intérêt ou le bénéfice: la réponse favorable de Dieu concerne le pays frappé par la famine.'
- source_word: אַחֲרֵי כֵן
  choice: Après cela
  rationale: Rendu temporel direct et naturel, marquant que la réponse divine suit l’exécution des ordres du roi.
theological_decisions:
- issue: Sens de וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: Dieu se laissa fléchir en faveur du pays
  alternative: Dieu exauça les supplications en faveur du pays; Dieu répondit favorablement à la prière pour le pays
  rationale: Le verbe au niphal implique une réaction favorable à une supplication, même si le substantif « prière » n’apparaît pas dans le verset. « Se laissa fléchir » conserve cette implication et l’initiative divine sans développer le résultat en « guérit le pays ».
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple est retenu pour la narration historique. Les noms sont rendus « Saül », « Jonathan », « Tséla » et « Qish ». La dernière proposition conserve l’implication d’une supplication sans introduire l’expansion interprétative « Dieu guérit le pays ».
