source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: fr
  text: Alors le roi prit les deux fils de Ritspa, fille d’Aya, qu’elle avait eus de Saül — Armoni et Mephibosheth — ainsi que les cinq fils de Mikal[a], fille de Saül, qu’elle avait eus d’Adriel, fils de Barzillaï, originaire de Mehola.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quelques manuscrits et des témoins anciens lisent « Mérab » au lieu de « Mikal » ; voir 1 Samuel 18.19, où Mérab, fille de Saül, est donnée en mariage à Adriel.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit donc
  rationale: Le waw consécutif fait progresser le récit. « Prit donc » exprime naturellement en français la succession narrative portée par le verbe לקח.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte hébreu emploie le titre défini plutôt que le nom de David; le titre est donc conservé.
- source_word: שְׁנֵי בְּנֵי רִצְפָּה בַת אַיָּה
  choice: les deux fils de Ritspa, fille d’Aya
  rationale: La chaîne construite avec le numéral désigne les deux fils de Ritspa. Les noms propres sont translittérés selon une forme française claire.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: qu’elle avait eus de Saül
  rationale: Le verbe ילד avec ל désigne ici Saül comme père. Cette formulation française naturelle situe aussi la naissance avant l’action du roi.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: Armoni et Mephibosheth
  rationale: Les deux noms propres sont translittérés; la généalogie permet de distinguer ce Mephibosheth du fils de Jonathan.
- source_word: חֲמֵשֶׁת בְּנֵי מִיכַל בַּת שָׁאוּל
  choice: les cinq fils de Mikal, fille de Saül
  rationale: Le texte massorétique porte « Mikal ». Cette leçon est conservée dans le corps du texte malgré sa tension avec 1 Samuel 18.19.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: qu’elle avait eus d’Adriel
  rationale: La même construction que dans la première proposition est rendue de façon parallèle et désigne Adriel comme père.
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: fils de Barzillaï, originaire de Mehola
  rationale: Le patronyme est rendu directement. Le gentilé הַמְּחֹלָתִי est explicité en français courant comme une origine géographique.
theological_decisions:
- issue: Tension historique et textuelle concernant Mikal comme mère des fils d’Adriel
  choice: Conserver « Mikal » dans le texte principal et signaler « Mérab » en note.
  alternative: Lire « Mérab, fille de Saül » dans le texte principal.
  rationale: Le texte hébreu fourni lit « Mikal », tandis que 1 Samuel 18.19 présente Mérab comme l’épouse d’Adriel. La difficulté ne doit être ni harmonisée silencieusement ni dissimulée; la leçon du texte source reste donc dans le corps du verset et la variante significative est documentée.
translation_notes:
  register: Français international moderne, narratif et digne. « Avaient eus de » est plus naturel que le calque « avaient enfantés à » tout en indiquant clairement la paternité. Les tirets isolent les noms des deux premiers fils sans alourdir la phrase. Le marqueur [a] est placé immédiatement après « Mikal », terme concerné par la variante.
