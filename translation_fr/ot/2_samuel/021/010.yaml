base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: fr
  text: Alors Ritspa, fille d’Aya, prit une toile de sac et l’étendit pour elle sur le rocher, depuis le début de la moisson jusqu’à ce que de l’eau soit déversée du ciel sur eux.[a] Elle ne permit pas aux oiseaux du ciel de se poser sur eux le jour, ni aux bêtes des champs la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce que la pluie tombe sur eux du ciel ». Plus littéralement : « jusqu’à ce que de l’eau soit déversée sur eux depuis les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: une toile de sac
  rationale: Le terme désigne l’étoffe grossière associée au deuil. « Toile de sac » est naturel en français moderne et conserve cette connotation.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: l’étendit pour elle sur le rocher
  rationale: Le verbe נטה décrit ici le déploiement ou l’étirement de l’étoffe; לָהּ est rendu par « pour elle », et אֶל par « sur » selon le contexte.
- source_word: מִתְּחִלַּת קָצִיר
  choice: depuis le début de la moisson
  rationale: La formulation conserve l’absence de précision sur la céréale récoltée.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: jusqu’à ce que l’eau tombe du ciel sur eux
  rationale: La traduction garde « l’eau » et l’image d’une venue depuis le ciel, tout en employant une tournure française naturelle; il s’agit vraisemblablement de la pluie.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: Expression française claire qui correspond à la tournure hébraïque usuelle désignant les oiseaux.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: se poser sur eux
  rationale: Dans ce contexte, נוח désigne le fait pour les oiseaux de se poser ou de s’abattre sur les corps.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: Cette expression communique directement qu’il s’agit d’animaux non domestiques, sans l’archaïsme de « bêtes des champs ».
- source_word: יוֹמָם ... לָיְלָה
  choice: pendant le jour ... pendant la nuit
  rationale: La formulation française conserve le contraste temporel et le parallélisme.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « sur eux » maintient le lien avec les corps évoqués dans le contexte. « Elle resta là » explicite sobrement la durée de la veille suggérée par la construction, sans préciser une posture ou un abri que l’hébreu ne décrit pas.
