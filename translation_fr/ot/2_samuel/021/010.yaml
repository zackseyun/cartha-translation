revisions:
- from: Alors Ritspa, fille d’Aya, prit une toile de sac et l’étendit pour elle sur le rocher. Elle resta là depuis le début de la moisson jusqu’à ce que l’eau tombe du ciel sur eux.[a] Elle empêchait les oiseaux du ciel de se poser sur eux pendant le jour, et les animaux sauvages de s’en approcher pendant la nuit.
  to: Alors Ritspa, fille d’Aya, prit une toile de sac et l’étendit pour elle sur le rocher, depuis le début de la moisson jusqu’à ce que de l’eau soit déversée du ciel sur eux.[a] Elle ne permit pas aux oiseaux du ciel de se poser sur eux le jour, ni aux bêtes des champs la nuit.
  rationale: La révision supprime l’explicitation non formulée d’une veille sur place, restitue l’image de l’eau déversée et maintient l’ellipse concernant les bêtes des champs plutôt que de leur attribuer explicitement une approche. La note conserve l’interprétation naturelle de cette eau comme pluie sans l’imposer dans le texte principal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T16:32:42Z'
