  - severity: medium
    issue: Ajout de « Elle resta là »
    rationale: Cette phrase explicite une veille prolongée que le contexte peut suggérer, mais que le verset ne formule pas. Elle doit être supprimée pour ne pas ajouter au texte.
  - severity: medium
    issue: « les animaux sauvages de s’en approcher »
    rationale: Le texte hébreu laisse elliptique l’action refusée aux bêtes des champs. « S’en approcher » précise indûment cette action.
  - severity: low
    issue: « l’eau tombe du ciel »
    rationale: Le verbe נתך évoque le fait d’être versé ou déversé. Une formulation française conservant cette image est préférable; la note peut signaler l’alternative « la pluie tomba ».
