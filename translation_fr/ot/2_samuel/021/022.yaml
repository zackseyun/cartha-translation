  text: אֶת אַרְבַּ֥עַת אֵ֛לֶּה יֻלְּד֥וּ לְ/הָ/רָפָ֖ה בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖ד וּ/בְ/יַ֥ד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: fr
  text: Ces quatre-là étaient nés du Rapha[a] à Gath, et ils tombèrent par la main de David et par celle de ses serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Rapha », « du géant » ou « des Rephaïm ». L’hébreu renvoie probablement à la lignée de géants associée à Gath.
    reason: Lecture alternative de הָרָפָה, dont l’identité exacte demeure ambiguë.
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: ces quatre-là
  rationale: Cette tournure rend le nombre accompagné du démonstratif sans ajouter « hommes », absent de l’hébreu. Le suffixe « -là » donne une formulation française naturelle qui renvoie aux quatre personnages précédemment mentionnés.
- source_word: יֻלְּדוּ
  choice: étaient nés
  rationale: Le passif de ילד exprime ici la naissance et, par extension, l’ascendance. « Étaient nés » reste proche de l’image hébraïque sans employer le plus technique « avaient été engendrés ».
- source_word: לְהָרָפָה
  choice: du Rapha
  rationale: Cette formulation conserve Rapha comme désignation ambiguë d’un ancêtre ou d’une lignée, tout en exprimant en français le rapport de descendance indiqué par le contexte.
- source_word: בְּגַת
  choice: à Gath
  rationale: Pour une ville, « à Gath » est la formulation locative française courante.
- source_word: וַיִּפְּלוּ
  choice: ils tombèrent
  rationale: Le verbe נפל signifie littéralement « tomber » et évoque ici la mort au combat. La traduction conserve cette image sans expliciter davantage.
- source_word: בְיַד
  choice: par la main de
  rationale: L’expression hébraïque marque l’agent. La tournure française, légèrement solennelle mais intelligible, en préserve l’image; la seconde occurrence est rendue par « par celle de » pour éviter une répétition pesante.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme désigne ceux qui sont au service de David, ici dans un cadre militaire. « Serviteurs » reste proche du lexique hébreu sans préciser plus que le texte leur statut.
theological_decisions:
- issue: Identité de הָרָפָה
  choice: Une désignation ancestrale ou clanique conservée sous la forme « le Rapha »
  alternative: « Rapha », « le géant » ou « les Rephaïm »
  rationale: Le contexte relie ces quatre combattants à la tradition des géants de Gath, mais la forme hébraïque permet plusieurs analyses. Le texte principal conserve donc l’ambiguïté plutôt que d’imposer l’une d’elles.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve les images hébraïques de la naissance et de la main comme agent, tout en évitant des formulations excessivement archaïques.
