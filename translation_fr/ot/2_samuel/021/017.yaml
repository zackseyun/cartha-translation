base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: fr
  text: 'Mais Abishaï, fils de Tserouya, vint à son secours, frappa le Philistin et le tua. Alors les hommes de David lui jurèrent : « Tu ne sortiras plus avec nous pour aller au combat, de peur que tu n’éteignes la lampe d’Israël[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la lumière d’Israël ». L’hébreu dit littéralement « la lampe », image du rôle vital de David pour la vie et la stabilité de la nation.
    reason: Alternative lexicale et clarification de la métaphore hébraïque.
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: vint à son secours
  rationale: Le verbe עזר signifie « aider, secourir ». Cette tournure française naturelle exprime clairement l’intervention d’Abishaï en plein combat.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abishaï, fils de Tserouya
  rationale: Les noms sont translittérés selon un usage français courant, et בן est rendu explicitement par « fils de ».
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: frappa le Philistin
  rationale: נכה signifie ici « frapper ». Le verbe suivant indiquant expressément la mort, cette traduction évite d’anticiper ou de répéter l’idée de mise à mort.
- source_word: וַיְמִיתֵהוּ
  choice: et le tua
  rationale: La forme causative de מות indique sans ambiguïté qu’Abishaï causa sa mort. « Le tua » est direct et naturel.
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: Alors les hommes de David lui jurèrent
  rationale: נשבע désigne la prestation d’un serment. « Lui jurèrent » conserve la solennité de l’engagement tout en restant idiomatique.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: Tu ne sortiras plus avec nous pour aller au combat
  rationale: L’imparfait hébreu, dans le cadre du serment, a valeur d’interdiction ferme. « Sortir » préserve l’expression militaire hébraïque, tandis que « pour aller au combat » la rend intelligible en français actuel.
- source_word: וְלֹא תְכַבֶּה
  choice: de peur que tu n’éteignes
  rationale: La coordination hébraïque exprime ici la conséquence redoutée que l’interdiction cherche à éviter. « De peur que » restitue naturellement ce rapport sans transformer la métaphore.
- source_word: נֵר יִשְׂרָאֵל
  choice: la lampe d’Israël
  rationale: נֵר désigne concrètement une lampe. Le maintien de cette image préserve la métaphore hébraïque du rôle vital et stabilisateur de David pour Israël.
theological_decisions:
- issue: Désignation métaphorique de David comme lumière qui soutient Israël
  choice: Conserver « la lampe d’Israël » dans le texte principal
  alternative: « la lumière d’Israël »
  rationale: L’hébreu emploie une image concrète et non une explication abstraite. « Lampe » maintient l’imagerie littéraire et royale sans préciser au-delà du texte la nature du rôle de David.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la structure hébraïque tout en explicitant naturellement le rapport de conséquence redoutée dans la dernière proposition.
