  to: Le roi convoqua donc les Gabaonites et leur parla. Or les Gabaonites n’étaient pas des fils d’Israël, mais faisaient partie du reste des Amorites[a]. Les fils d’Israël leur avaient prêté serment, mais Saül avait cherché à les frapper, dans son zèle pour les fils d’Israël et de Juda[b].
  rationale: La révision conserve les choix principaux du projet tout en corrigeant une note qui déformait le rapport entre les Gabaonites et le reste amorite. Elle évite aussi d’imposer explicitement l’issue mortelle dans la traduction de נכה, tout en maintenant le contexte violent et la possibilité de cette lecture.
