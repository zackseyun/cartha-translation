  text: וַ/יִּקְרָ֥א הַ/מֶּ֛לֶךְ לַ/גִּבְעֹנִ֖ים וַ/יֹּ֣אמֶר אֲלֵי/הֶ֑ם וְ/הַ/גִּבְעֹנִ֞ים לֹ֣א מִ/בְּנֵ֧י יִשְׂרָאֵ֣ל הֵ֗מָּה כִּ֚י אִם מִ/יֶּ֣תֶר הָ/אֱמֹרִ֔י וּ/בְנֵ֤י יִשְׂרָאֵל֙ נִשְׁבְּע֣וּ לָ/הֶ֔ם וַ/יְבַקֵּ֤שׁ שָׁאוּל֙ לְ/הַכֹּתָ֔/ם בְּ/קַנֹּאת֥/וֹ לִ/בְנֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: fr
  text: Le roi convoqua donc les Gabaonites et leur parla. Or les Gabaonites n’étaient pas des fils d’Israël, mais faisaient partie du reste des Amorites[a]. Les fils d’Israël leur avaient prêté serment, mais Saül avait cherché à les frapper, dans son zèle pour les fils d’Israël et de Juda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui restait des Amorites ». Littéralement : « du reste de l’Amorite » ; le singulier collectif désigne ici les Amorites.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans sa jalousie pour les fils d’Israël et de Juda ». Le mot hébreu peut exprimer le zèle ou la jalousie selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convoqua
  rationale: Dans ce contexte royal, קרא signifie faire venir auprès de soi. « Convoqua » exprime naturellement cet acte sans ajouter de détail.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: leur parla
  rationale: Rend l’hébreu « dit à eux » dans un français naturel après « convoqua ».
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: n’étaient pas des fils d’Israël
  rationale: Conserve l’expression familiale בני ישראל et son écho lors de sa répétition plus loin dans le verset.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: ce qui restait des Amorites
  rationale: יֶתֶר désigne ce qui subsiste. Cette formulation moderne évite que « reste » ou « survivants » ne précise excessivement la nature du groupe.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: s’étaient engagés envers eux par serment
  rationale: Exprime clairement la force relationnelle du serment et l’antériorité de celui-ci dans l’arrière-plan narratif.
- source_word: לְהַכֹּתָם
  choice: à les frapper à mort
  rationale: נכה peut désigner ici une attaque meurtrière. La formulation garde l’image de la frappe tout en rendant explicite sa portée dans ce contexte.
- source_word: בְּקַנֹּאתוֹ
  choice: dans son zèle
  rationale: קנא peut exprimer un zèle ardent ou une jalousie. Le contexte national favorise « zèle », sans valider moralement l’action de Saül.
theological_decisions:
- issue: Valeur de בני ישראל comme désignation nationale
  choice: fils d’Israël
  alternative: Israélites
  rationale: La formulation littérale conserve le lien lexical entre les deux occurrences du verset et la distinction finale entre Israël et Juda, tout en restant intelligible en français biblique moderne.
- issue: Motif de Saül exprimé par קנא
  choice: zèle
  alternative: jalousie
  rationale: Le terme décrit ici une ardeur partisane en faveur d’Israël et de Juda. « Zèle » convient mieux au contexte, mais une note maintient l’ambiguïté lexicale et morale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe explicative de l’hébreu est conservée par « Or ». Les expressions « fils d’Israël » sont maintenues pour leur transparence lexicale, tandis que « ce qui restait » et « s’étaient engagés envers eux par serment » assurent une compréhension immédiate.
