    issue: La note a propose une alternative sémantiquement incorrecte.
    rationale: « Appartenaient aux survivants des Amorites » ne rend pas l’idée que les Gabaonites constituaient ou faisaient partie du reste amorite ; elle les présente comme rattachés à des survivants. La note doit être remplacée.
  - severity: low
    issue: « Les frapper à mort » surinterprète légèrement לְהַכֹּתָם.
    rationale: Le contexte peut impliquer une entreprise meurtrière, mais נכה signifie littéralement frapper et peut être laissé sans explicitation de résultat en français afin de préserver la portée du texte.
