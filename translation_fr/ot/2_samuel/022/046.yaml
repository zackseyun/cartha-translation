  text: בְּנֵ֥י נֵכָ֖ר יִבֹּ֑לוּ וְ/יַחְגְּר֖וּ מִ/מִּסְגְּרוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/046.yaml
  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: fr
  text: Les étrangers perdent courage et sortent en tremblant de leurs forteresses[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Les étrangers dépérissent ». Le verbe hébreu peut désigner plus littéralement le fait de se flétrir ou de dépérir.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu est difficile ici. On propose aussi « sortent en rampant », « sortent en boitant » ou, plus littéralement, « se ceignent ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de leurs places fortes »; peut-être aussi « de leurs lieux clos » ou « de leurs prisons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: Les étrangers
  rationale: Cette expression construite, littéralement « fils de l'étranger/de l'étrangeté », désigne idiomatiquement des peuples étrangers. « Les étrangers » est naturel en français moderne et conserve le sens collectif.
- source_word: יִבֹּלוּ
  choice: perdent courage
  rationale: Le verbe נבל signifie couramment « se flétrir, dépérir, s'affaiblir ». Dans ce chant de victoire militaire, il évoque vraisemblablement l'effondrement de leur vigueur ou de leur courage. La traduction plus concrète « dépérissent » reste signalée en note.
- source_word: וְיַחְגְּרוּ
  choice: sortent en tremblant
  rationale: La forme est difficile. La racine חגר signifie normalement « ceindre », mais le contexte paraît décrire des ennemis soumis qui quittent avec crainte leurs lieux fortifiés. « Sortent en tremblant » rend cette compréhension contextuelle sans masquer les autres analyses, données en note.
- source_word: מִמִּסְגְּרוֹתָם
  choice: de leurs forteresses
  rationale: מִסְגְּרוֹת désigne des lieux fermés ou des enceintes. Dans le cadre militaire du poème, « forteresses » convient bien; « lieux clos » ou « prisons » demeurent lexicalement possibles.
