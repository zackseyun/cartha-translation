  text: וַ/יִּרְכַּ֥ב עַל כְּר֖וּב וַ/יָּעֹ֑ף וַ/יֵּרָ֖א עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: fr
  text: Il monta sur un chérubin et s’envola ; il apparut[a] sur les ailes du vent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il fut vu ». Le verbe hébreu peut exprimer le fait d’être vu ou d’apparaître.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: Il monta
  rationale: Le qal de רכב signifie monter sur une monture ou la chevaucher. « Monta sur » convient naturellement au chérubin envisagé comme porteur céleste et conserve l’image concrète.
- source_word: עַל
  choice: sur
  rationale: La préposition marque ici le support ou la position ; « sur » est son équivalent français direct et idiomatique.
- source_word: כְּרוּב
  choice: un chérubin
  rationale: Le singulier désigne la créature céleste connue dans la Bible hébraïque. Le terme français traditionnel « chérubin » préserve ce référent sans le paraphraser.
- source_word: וַיָּעֹף
  choice: et s’envola
  rationale: Le verbe עוף signifie voler. « S’envola » rend naturellement le mouvement dans ce récit poétique sans ajouter l’idée plus précise de planer.
- source_word: וַיֵּרָא
  choice: il apparut
  rationale: Le niphal de ראה peut exprimer le fait d’être vu ou d’apparaître. « Il apparut » est naturel en français dans une scène de manifestation divine, tandis qu’une note conserve l’autre valeur possible.
- source_word: כַּנְפֵי
  choice: les ailes de
  rationale: Le pluriel construit de כָּנָף signifie littéralement « les ailes de ». Cette image vive et accessible doit être conservée.
- source_word: רוּחַ
  choice: du vent
  rationale: Dans ce contexte poétique de théophanie, רוּחַ désigne le plus naturellement le vent. « Esprit » convient moins à l’image des ailes, et « vent de tempête » ajouterait une précision absente du terme lui-même.
theological_decisions:
- issue: Préserver l’imagerie du guerrier divin sans rationaliser la théophanie
  choice: Conserver les images concrètes du chérubin, du vol et des ailes du vent.
  alternative: Paraphraser la scène comme une manifestation de la puissance divine.
  rationale: Le verset présente le SEIGNEUR au moyen d’une poésie théophanique. La traduction garde cette tension imagée au lieu de l’expliquer ou de la réduire à une abstraction.
- issue: Valeur de la forme niphal וַיֵּרָא
  choice: il apparut
  alternative: il fut vu
  rationale: Les deux valeurs sont possibles. « Il apparut » s’intègre plus naturellement à la manifestation décrite, sans exclure la lecture passive signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe demeure concise et parallèle, et les images traditionnelles sont conservées sans archaïsmes inutiles.
