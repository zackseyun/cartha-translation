source:
  edition: WLC
  text: מְהֻלָּ֖ל אֶקְרָ֣א יְהוָ֑ה וּ/מֵ/אֹיְבַ֖/י אִוָּשֵֽׁעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: fr
  text: Je fais appel à Yahweh, qui est digne de louange[a], et je suis sauvé de mes ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qu’on loue » ou « qui doit être loué ». Le participe hébreu présente Yahweh comme celui à qui revient la louange.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: qui est digne de louange
  rationale: Le participe passif de הלל qualifie Yahweh comme celui qui doit être loué. « Digne de louange » exprime naturellement cette valeur en français tout en conservant le sens prédicatif.
- source_word: אֶקְרָא
  choice: je fais appel à
  rationale: Avec le nom divin comme complément, קרא exprime ici l’action d’invoquer Dieu ou de faire appel à lui. Cette formulation est courante et garde la portée priante du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: וּמֵאֹיְבַי
  choice: et ... de mes ennemis
  rationale: La conjonction coordonne les propositions, et la préposition מִן indique ceux dont le locuteur est délivré, sans ajouter l’image absente du texte d’une délivrance « de la main » des ennemis.
- source_word: אִוָּשֵׁעַ
  choice: je suis sauvé
  rationale: Le niphal inaccompli de ישׁע peut exprimer le fait d’être sauvé ou délivré. Dans cette affirmation poétique à portée habituelle, le présent français convient et préserve le champ lexical du salut.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: L’hébreu emploie directement le tétragramme. « Yahweh » préserve ici le nom personnel plutôt que de lui substituer un titre.
- issue: Valeur temporelle de אִוָּשֵׁעַ
  choice: je suis sauvé
  alternative: je serai sauvé ; je suis délivré
  rationale: L’inaccompli hébreu permet une nuance habituelle ou prospective. Le présent s’accorde avec l’énoncé poétique général sans exclure l’idée d’une délivrance répétée.
translation_notes:
  register: Français international moderne, naturel et digne. « Faire appel à » rend clairement l’invocation sans archaïsme ; la structure brève conserve le parallélisme poétique.
