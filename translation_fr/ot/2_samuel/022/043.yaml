  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: fr
  text: Je les ai écrasés comme la poussière de la terre ; comme la boue des rues, je les ai broyés et piétinés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « aplatis » ou « étendus ». Le dernier verbe hébreu peut désigner l’action de battre une matière pour l’aplatir ou l’étendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Je les ai réduits en poussière
  rationale: Le verbe שׁחק exprime ici l’action de broyer très finement. Cette formulation française s’accorde naturellement avec la comparaison qui suit et conserve la force de l’image.
- source_word: כַּעֲפַר אָרֶץ
  choice: comme la poussière de la terre
  rationale: עָפָר désigne la poussière ou la terre meuble. La formulation garde la construction hébraïque et demeure claire en français moderne.
- source_word: כְּטִיט חוּצוֹת
  choice: comme la boue des rues
  rationale: טִיט signifie « boue » ou « bourbier », et חוּצוֹת désigne ici les rues ou espaces publics. L’expression restitue directement l’image urbaine.
- source_word: אֲדִקֵּם
  choice: je les ai broyés
  rationale: Le hiphil de דקק signifie réduire en petits morceaux ou broyer. « Broyés » maintient l’intensité sans répéter exactement la première formulation.
- source_word: אֶרְקָעֵם
  choice: piétinés
  rationale: רקע peut évoquer le fait de battre, d’aplatir ou d’étendre. Dans l’image guerrière de la boue des rues, « piétinés » rend naturellement l’idée d’écrasement sous les pieds, tout en signalant l’autre possibilité en note.
