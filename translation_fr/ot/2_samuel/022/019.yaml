  text: יְקַדְּמֻ֖/נִי בְּ/י֣וֹם אֵידִ֑/י וַ/יְהִ֧י יְהוָ֛ה מִשְׁעָ֖ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/019.yaml
  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: fr
  text: Ils m’ont affronté au jour de mon malheur[a], mais Yahweh[b] fut mon appui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils sont venus à ma rencontre » ou « Ils m’ont devancé », au jour de mon malheur.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH, le nom divin, transcrit « Yahweh »; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: Ils m’ont affronté
  rationale: Le piel de קדם avec un objet de première personne signifie ici venir à la rencontre de quelqu’un dans un contexte hostile. « Affronter » exprime naturellement cette force adversative, tout en laissant en note les lectures plus neutres possibles.
- source_word: בְּיוֹם אֵידִי
  choice: au jour de mon malheur
  rationale: « Au jour de » conserve l’image temporelle hébraïque dans un français digne et naturel. אֵיד désigne un malheur grave, une catastrophe ou un désastre; « malheur » convient bien au registre poétique sans réduire le sens à une émotion intérieure.
- source_word: וַיְהִי
  choice: mais ... a été
  rationale: Le waw introduit ici un contraste contextuel entre l’attaque des ennemis et le soutien divin. « Mais » rend cette relation naturellement en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que par un titre de substitution.
- source_word: מִשְׁעָן לִי
  choice: mon appui
  rationale: מִשְׁעָן désigne ce sur quoi l’on s’appuie. Dans cet emploi métaphorique, « mon appui » est concis, idiomatique et conserve l’image de soutien.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Yahweh
  rationale: Le texte porte directement le nom divin. « Yahvé » est sa forme traditionnelle et largement intelligible en français moderne; la note signale l’hébreu YHWH et l’autre translittération usuelle.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme bref du verset est conservé, ainsi que le contraste entre l’assaut hostile et l’appui de Dieu. Les deux appels de note figurent dans le texte principal.
