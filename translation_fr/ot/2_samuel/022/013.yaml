  text: מִ/נֹּ֖גַהּ נֶגְדּ֑/וֹ בָּעֲר֖וּ גַּחֲלֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/013.yaml
  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: fr
  text: De l’éclat devant lui, des braises ardentes flamboyèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: De l’éclat
  rationale: נֹגַהּ désigne un éclat, une lumière rayonnante. « Éclat » convient à l’imagerie théophanique, tandis que la préposition מִן est rendue par « de » pour conserver l’idée de provenance.
- source_word: נֶגְדּוֹ
  choice: qui était devant lui
  rationale: נֶגֶד avec le suffixe masculin singulier situe l’éclat devant lui. La proposition relative donne en français une formulation naturelle sans élargir le sens à « sa présence ».
- source_word: בָּעֲרוּ
  choice: flamboyèrent
  rationale: Le qal de בער signifie brûler ou flamber. « Flamboyèrent » restitue la vivacité de la scène sans ajouter explicitement une action divine.
- source_word: גַּחֲלֵי אֵשׁ
  choice: des braises ardentes
  rationale: L’expression construite signifie littéralement « des charbons de feu ». « Braises ardentes » en transmet naturellement l’image en français moderne, sans la redondance peu idiomatique de « charbons de feu ».
theological_decisions:
- issue: Imagerie théophanique et rapport implicite entre l’éclat et les braises
  choice: La phrase décrit les braises flamboyant à partir de l’éclat situé devant Dieu, sans expliciter davantage le lien causal.
  alternative: « À son éclat, des braises ardentes s’embrasèrent », qui ferait de l’éclat la cause explicite de leur embrasement.
  rationale: L’hébreu poétique est condensé et ne nomme aucune action divine directe. La traduction conserve la provenance et la succession des images sans résoudre leur relation précise.
translation_notes:
  register: Français international actuel, poétique et digne. « Braises ardentes » est plus idiomatique que le calque « charbons de feu », tandis que « flamboyèrent » maintient la force visuelle du verbe hébreu.
