  text: וָ/אֲכַלֵּ֥/ם וָ/אֶמְחָצֵ֖/ם וְ/לֹ֣א יְקוּמ֑וּ/ן וַֽ/יִּפְּל֖וּ תַּ֥חַת רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: fr
  text: Je les ai dévorés[a] et broyés[b] ; ils ne se sont pas relevés ; ils sont tombés sous mes pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « anéantis » ; le verbe hébreu signifie littéralement « manger, dévorer » et exprime ici la destruction dans un contexte guerrier.
    reason: lexical_alternative
  - marker: b
    text: Ou « écrasés » ou « mis en pièces ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: Je les ai dévorés
  rationale: Le verbe אכל signifie littéralement « manger, dévorer » et peut, dans un contexte guerrier, exprimer l’anéantissement. « Dévorés » conserve l’image forte de l’hébreu tout en restant intelligible en français poétique.
- source_word: וָאֶמְחָצֵם
  choice: et broyés
  rationale: Le verbe מחץ évoque l’action de frapper, écraser ou broyer. « Broyés » rend la violence et le caractère décisif de la défaite sans réduire l’expression à un simple « vaincus ».
- source_word: וְלֹא יְקוּמוּן
  choice: ils ne se sont pas relevés
  rationale: Cette formulation rend directement la négation et le verbe קום sans ajouter l’idée modale qu’ils « ne pouvaient pas » se relever.
- source_word: וַיִּפְּלוּ
  choice: ils sont tombés
  rationale: Traduction directe de נפל, qui maintient le mouvement bref et concret du vers poétique.
- source_word: תַּחַת רַגְלָי
  choice: sous mes pieds
  rationale: L’expression conserve l’image hébraïque de la soumission totale et de la défaite des ennemis.
theological_decisions:
- issue: La violence guerrière dans le chant de victoire de David
  choice: Conserver à la première personne les images explicites de destruction et de soumission
  alternative: Atténuer par une paraphrase telle que « Je les ai entièrement vaincus »
  rationale: L’hébreu emploie des verbes poétiques violents et concrets. Les conserver respecte la teneur du chant sans imposer une justification théologique ni adoucir le texte.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme et les images corporelles du texte poétique sont conservés ; le passé composé donne une narration naturelle en français contemporain.
