  text: חַי יְהוָ֖ה וּ/בָר֣וּךְ צוּרִ֑/י וְ/יָרֻ֕ם אֱלֹהֵ֖י צ֥וּר יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: fr
  text: Yahweh est vivant ! Béni soit mon rocher ! Que Dieu, le rocher de mon salut[a], soit exalté !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon rocher sauveur » ou « le rocher de ma délivrance ».
    reason: Alternative lexicale pour צוּר יִשְׁעִי, où יֶשַׁע peut être rendu par « salut » ou « délivrance », et où la relation entre les noms peut être formulée de façon adjectivale.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Yahweh est vivant !
  rationale: La proposition nominale hébraïque exprime ici une déclaration de louange. Cette formulation française conserve l’affirmation que Yahweh vit, sans la transformer en formule de serment (« Aussi vrai que Yahweh est vivant »).
- source_word: וּבָרוּךְ
  choice: Béni soit
  rationale: Dans ce contexte doxologique, le participe passif a valeur d’acclamation. « Béni soit » en restitue le ton élevé et demeure naturel en français.
- source_word: צוּרִי
  choice: mon rocher
  rationale: Le terme צוּר désigne littéralement un rocher et sert ici de métaphore divine évoquant solidité et protection. La métaphore est conservée plutôt qu’explicitée par « refuge ».
- source_word: וְיָרֻם
  choice: Que soit exalté
  rationale: La forme verbale exprime un souhait ou une acclamation. La tournure française conserve cette nuance volitive et le parallélisme avec « Béni soit ».
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: Dieu, le rocher de mon salut
  rationale: La formulation comprend « Dieu » comme désignation suivie d’une apposition, lecture soutenue par le parallélisme poétique et la récurrence de l’image du rocher. « Salut » garde la portée large de יֶשַׁע.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Métaphore divine de צוּר
  choice: rocher
  alternative: refuge / forteresse
  rationale: Le maintien de l’image hébraïque respecte la représentation poétique de Dieu comme source de stabilité, de protection et de salut.
- issue: Construction אֱלֹהֵי צוּר יִשְׁעִי
  choice: Dieu, le rocher de mon salut
  alternative: le Dieu de mon rocher de salut / Dieu, mon rocher sauveur
  rationale: L’apposition produit un français intelligible tout en préservant la relation poétique entre Dieu, le rocher et le salut. La note signale des formulations possibles sans imposer une résolution plus étroite.
translation_notes:
  register: Français international moderne, digne et poétique. Les exclamations rendent le caractère doxologique du verset; le parallélisme et la métaphore répétée du rocher sont conservés.
