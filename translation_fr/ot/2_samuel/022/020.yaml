base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: fr
  text: Il m’a fait sortir dans un vaste espace[a] ; il m’a délivré, parce qu’il prenait plaisir à moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un espace ouvert » ou « dans un lieu spacieux ». L’image hébraïque oppose la liberté et le soulagement à l’enfermement ou à la détresse.
    reason: lexical_alternative
  - marker: b
    text: Ou « parce qu’il se plaisait en moi » ou « parce qu’il trouvait son plaisir en moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: Il m’a fait sortir
  rationale: 'Le hiphil de יצא exprime ici la causation : « faire sortir ». Cette formulation naturelle conserve l’image d’une délivrance hors de la détresse.'
- source_word: לַמֶּרְחָב
  choice: au large
  rationale: מֶרְחָב désigne un espace vaste et ouvert, par contraste avec l’enfermement ou la détresse. « Au large » restitue cette image de liberté et de soulagement en français idiomatique.
- source_word: יְחַלְּצֵנִי
  choice: il m’a délivré
  rationale: Le piel de חלץ signifie retirer d’un danger, délivrer ou secourir. « Délivré » convient au registre poétique et au parallélisme avec la proposition précédente.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la raison de la délivrance et se rend clairement par « parce que ».
- source_word: חָפֵץ בִּי
  choice: il prenait plaisir en moi
  rationale: חפץ construit avec ב exprime le plaisir ou la complaisance que l’on trouve en quelqu’un. La formulation garde la force relationnelle de l’hébreu sans préciser davantage la nature de cette faveur.
theological_decisions:
- issue: Motif de la délivrance divine
  choice: parce qu’il prenait plaisir en moi
  alternative: parce qu’il se plaisait en moi
  rationale: Le verset présente le plaisir favorable de Dieu envers David comme motif de sa délivrance. La traduction conserve cette affirmation et sa tension théologique sans y introduire une explication sur le mérite.
translation_notes:
  register: Français moderne, international et digne, avec un rythme poétique sobre. « Au large » est idiomatique tout en préservant l’image spatiale de l’hébreu ; « prenait plaisir en moi » conserve la portée personnelle de חפץ ב.
