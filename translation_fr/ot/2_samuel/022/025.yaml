base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: fr
  text: Et Yahweh m’a rétribué selon ma justice, selon ma pureté devant ses yeux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ses yeux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: m’a traité
  rationale: Dans cette construction, le verbe exprime la rétribution, c’est-à-dire le fait d’agir envers quelqu’un en fonction de sa conduite. « M’a traité selon » est naturel en français et préserve le sens sans imposer la connotation exclusivement positive de « récompensé ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre hébreu plutôt que de lui substituer un titre.
- source_word: לִי
  choice: m’
  rationale: Le pronom marque le bénéficiaire ou destinataire de l’action et s’intègre idiomatiquement au verbe français.
- source_word: כְּצִדְקָתִי
  choice: selon ma justice
  rationale: צדקה désigne ici la conformité à ce qui est droit. « Ma justice » conserve la formulation personnelle et la tension théologique du texte; « selon » rend la valeur de כְּ.
- source_word: כְּבֹרִי
  choice: selon ma pureté
  rationale: בֹּר désigne la pureté ou l’absence de souillure. « Pureté » est plus naturel que « propreté » dans ce registre, sans ajouter les « mains », absentes de ce verset.
- source_word: לְנֶגֶד עֵינָיו
  choice: devant ses yeux
  rationale: Cette traduction conserve l’image concrète de l’hébreu tout en restant intelligible; le sens idiomatique est « à ses yeux » ou « à son regard ».
theological_decisions:
- issue: L’affirmation par David de sa justice et de sa pureté
  choice: Maintenir sans atténuation l’affirmation à la première personne.
  alternative: Interpréter explicitement ces termes comme une fidélité relative à l’alliance ou reformuler pour éviter l’idée d’une perfection morale.
  rationale: L’hébreu affirme directement que Yahweh agit envers David selon sa justice et sa pureté. La traduction conserve cette tension sans préciser dans le texte s’il s’agit d’une innocence absolue, d’une intégrité relative ou d’une justification dans une situation donnée.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « selon » reproduit le parallélisme hébreu; l’image « devant ses yeux » est maintenue et explicitée en note.
