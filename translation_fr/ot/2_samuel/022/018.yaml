  text: He rescued me from my strong enemy, from those who hated me, for they were too mighty for me.
translation:
  language: fr
  text: Il m’a délivré de mon puissant ennemi, de ceux qui me haïssaient, car ils étaient plus forts que moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Il m’a délivré
  rationale: Le hifil de נצל exprime ici l’action d’arracher quelqu’un au danger; « délivré » convient au registre poétique et reste naturel.
- source_word: מֵאֹיְבִי עָז
  choice: de mon puissant ennemi
  rationale: עָז qualifie l’ennemi comme fort ou puissant. « Puissant ennemi » conserve la force de l’expression sans la réduire à la seule robustesse physique.
- source_word: מִשֹּׂנְאַי
  choice: de ceux qui me haïssaient
  rationale: Le participe pluriel substantivé désigne les personnes qui éprouvaient de la haine envers le locuteur.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: car ils étaient plus forts que moi
  rationale: La construction comparative avec מִן indique qu’ils avaient une force supérieure à celle du locuteur; l’imparfait français rend naturellement cet état dans le récit.
