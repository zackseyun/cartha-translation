id: 2SA.22.31
reference: 2 Samuel 22:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: fr
  text: Quant à Dieu, sa voie est irréprochable ; la parole de Yahweh est éprouvée[a] ; il est un bouclier pour tous ceux qui trouvent refuge en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « affinée » ou « passée au creuset » ; l’hébreu évoque un métal purifié par le feu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Quant à Dieu
  rationale: Cette formulation rend l’ouverture thématique de la proposition hébraïque tout en restant naturelle en français.
- source_word: תָּמִים
  choice: irréprochable
  rationale: Le terme décrit ici une voie entière, sans défaut. « Irréprochable » exprime cette intégrité sans réduire le mot à une perfection abstraite.
- source_word: דַּרְכּוֹ
  choice: sa voie
  rationale: « Voie » conserve à la fois l’image du chemin et le sens figuré de la manière d’agir de Dieu.
- source_word: אִמְרַת יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » préserve la portée générale d’un énoncé ou d’une déclaration, tandis que « Yahweh » transcrit le nom divin présent dans l’hébreu.
- source_word: צְרוּפָה
  choice: éprouvée
  rationale: Le mot évoque un métal passé au creuset et, par extension, quelque chose qui a été testé et reconnu authentique. « Éprouvée » communique clairement ce résultat en français moderne.
- source_word: מָגֵן הוּא
  choice: il est un bouclier
  rationale: La traduction conserve directement la métaphore protectrice et la proposition nominale hébraïque.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: pour tous ceux qui trouvent refuge en lui
  rationale: Cette expression maintient l’image concrète de personnes cherchant auprès de Dieu abri et protection, plutôt que de l’aplatir en simple confiance.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. Sa transcription préserve cette distinction au lieu de lui substituer un titre.
- issue: Portée métaphorique de צְרוּפָה
  choice: éprouvée
  alternative: passée au creuset
  rationale: « Éprouvée » indique que la parole a subi l’épreuve et s’est révélée fiable, tandis que la note conserve explicitement l’image métallurgique sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, poétique mais accessible. La structure en trois propositions parallèles est conservée, ainsi que les images de la voie, du creuset et du bouclier.
