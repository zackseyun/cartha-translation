  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: fr
  text: Car les vagues[a] de la mort m’ont entouré ; les torrents du mal[b] m’ont épouvanté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les déferlantes » ou « les flots ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les torrents de Bélial », si le mot hébreu est compris comme un nom propre plutôt que comme un nom commun désignant le mal, la perversité ou la destruction.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication de l’affirmation précédente et conserve naturellement la valeur causale du terme hébreu.
- source_word: אֲפָפֻנִי
  choice: m’encerclaient
  rationale: Exprime le fait d’être entouré et comme pris de toutes parts, tout en convenant au registre poétique.
- source_word: מִשְׁבְּרֵי
  choice: vagues
  rationale: Le mot désigne des vagues qui se brisent ou des déferlantes. « Vagues » rend clairement l’image aquatique en français courant, tandis que la nuance plus violente est signalée en note.
- source_word: מָוֶת
  choice: mort
  rationale: Rendu direct du nom hébreu ; la mort est figurée comme une masse d’eau menaçante.
- source_word: נַחֲלֵי
  choice: torrents
  rationale: Dans ce parallélisme poétique, le mot évoque des cours d’eau impétueux plutôt que de simples ruisseaux.
- source_word: בְלִיַּעַל
  choice: perversité
  rationale: Le terme fonctionne vraisemblablement ici comme un nom commun désignant ce qui est mauvais, pervers ou funeste. « Perversité » reste intelligible et évite d’introduire dans le texte principal une personnification plus tardive.
- source_word: יְבַעֲתֻנִי
  choice: m’épouvantaient
  rationale: Le verbe exprime une terreur intense et soudaine ; « épouvanter » en conserve la force dans une langue poétique actuelle.
theological_decisions:
- issue: Faut-il comprendre בְלִיַּעַל comme un nom propre (« Bélial ») ou comme un nom commun ?
  choice: Le texte principal porte « perversité », compris comme un nom commun.
  alternative: « Bélial », si le mot est pris comme un nom propre ; on peut aussi comprendre « destruction » ou « malfaisance ».
  rationale: Le contexte poétique met le terme en parallèle avec la mort et des eaux destructrices. Rien n’impose ici d’y voir le nom propre d’un être démoniaque ; cette possibilité traditionnelle est néanmoins conservée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux images aquatiques est maintenu, ainsi que l’intensité progressive d’« encercler » à « épouvanter ».
