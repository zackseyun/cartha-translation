source:
  edition: WLC
  text: יַרְעֵ֥ם מִן שָׁמַ֖יִם יְהוָ֑ה וְ/עֶלְי֖וֹן יִתֵּ֥ן קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: fr
  text: 'Yahweh tonna du ciel,

    et le Très-Haut fit retentir sa voix[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « donna sa voix » ; expression poétique pouvant aussi se traduire « fit entendre sa voix ».
    reason: Précise la formulation hébraïque tout en indiquant une autre restitution française idiomatique, sans identifier explicitement la voix au tonnerre.
lexical_decisions:
- source_word: יַרְעֵם
  choice: tonna
  rationale: Le hifil de רעם évoque ici la production du tonnerre. « Tonna » est naturel en français, conserve l’image de la théophanie dans l’orage et permet à Yahweh de rester le sujet direct du verbe.
- source_word: מִן שָׁמַיִם
  choice: du ciel
  rationale: Dans ce contexte théophanique, « du ciel » exprime naturellement l’origine céleste de la manifestation divine, sans alourdir le vers par « depuis les cieux ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וְעֶלְיוֹן
  choice: et le Très-Haut
  rationale: עֶלְיוֹן fonctionne comme un titre divin dans le parallélisme poétique. « Le Très-Haut » en conserve clairement la valeur superlative.
- source_word: יִתֵּן קוֹלוֹ
  choice: donna de la voix
  rationale: Cette expression française garde l’image concrète de l’hébreu, littéralement « donna sa voix », tout en restant compréhensible. Elle maintient aussi le parallélisme avec « tonna » sans réduire explicitement la voix au seul tonnerre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; le Seigneur
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Rapport entre Yahweh et le Très-Haut
  choice: Conserver les deux désignations en parallélisme poétique
  alternative: Présenter explicitement « le Très-Haut » comme une apposition à Yahweh
  rationale: Le vers met les deux désignations en parallèle sans formuler explicitement leur rapport grammatical. La traduction reproduit cette structure et n’ajoute aucune explication doctrinale.
- issue: Rapport entre la voix divine et le tonnerre
  choice: Maintenir deux formulations poétiques parallèles sans les identifier explicitement
  alternative: Traduire « le Très-Haut fit gronder le tonnerre »
  rationale: Le contexte rapproche fortement la voix du tonnerre, mais l’hébreu dit « donna sa voix ». La formulation retenue préserve cette image et sa portée théologique sans la résoudre.
translation_notes:
  register: Français moderne, poétique et digne. Les deux lignes reproduisent le parallélisme hébreu. « Tonna » est idiomatique, tandis que « donna de la voix » conserve une légère étrangeté poétique contrôlée, éclairée par la note.
