  text: בַּ/צַּר לִ/י֙ אֶקְרָ֣א יְהוָ֔ה וְ/אֶל אֱלֹהַ֖/י אֶקְרָ֑א וַ/יִּשְׁמַ֤ע מֵ/הֵֽיכָל/וֹ֙ קוֹלִ֔/י וְ/שַׁוְעָתִ֖/י בְּ/אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: fr
  text: 'Dans ma détresse, j’ai appelé Yahweh,

    j’ai appelé mon Dieu.

    De son temple[a], il a entendu ma voix,

    et mon appel au secours est parvenu à ses oreilles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « temple » peut aussi signifier « palais » ou « sanctuaire »; il désigne ici la demeure céleste de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Dans ma détresse
  rationale: La locution décrit une situation de détresse ou d’adversité. « Dans ma détresse » est naturel en français et conserve l’image d’une épreuve oppressante sans en préciser indûment l’intensité.
- source_word: אֶקְרָא … אֶקְרָא
  choice: j’ai appelé … j’ai appelé
  rationale: Le même verbe קרא est répété dans l’hébreu. Sa répétition est conservée pour respecter le parallélisme poétique. Dans le cadre rétrospectif du cantique, les formes sont rendues au passé composé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le nom divin avec le suffixe de première personne du singulier signifie directement « mon Dieu ».
- source_word: וַיִּשְׁמַע
  choice: il a entendu
  rationale: La forme narrative hébraïque présente l’écoute de Dieu comme la réponse à l’appel. Le passé composé convient au récit poétique rétrospectif et respecte plus directement la valeur passée de la forme verbale.
- source_word: מֵהֵיכָלוֹ
  choice: De son temple
  rationale: הֵיכָל peut désigner un temple, un sanctuaire ou un palais. « Temple » conserve ici la résonance sacrée de la demeure céleste de Dieu, tandis qu’une note signale l’ambiguïté lexicale.
- source_word: קוֹלִי
  choice: ma voix
  rationale: Traduction directe et idiomatique de קוֹל avec le suffixe de première personne du singulier.
- source_word: שַׁוְעָתִי
  choice: mon appel au secours
  rationale: שַׁוְעָה désigne un cri ou un appel lancé pour obtenir de l’aide. Cette formulation française explicite naturellement la demande implicite sans ajouter de contenu étranger au terme.
- source_word: בְּאָזְנָיו
  choice: est parvenu à ses oreilles
  rationale: Littéralement « dans ses oreilles ». La formulation choisie préserve l’image corporelle tout en exprimant clairement en français que l’appel a été entendu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie le nom personnel divin. « Yahweh » le conserve comme tel, sans lui substituer un titre.
- issue: Nature de la demeure divine désignée par הֵיכָל
  choice: temple
  alternative: palais / sanctuaire
  rationale: Dans ce contexte poétique, le mot peut évoquer à la fois la demeure royale et le sanctuaire céleste de Dieu. Le texte retient « temple » et la note maintient les autres possibilités.
- issue: Temps verbal de la réponse divine
  choice: il a entendu
  alternative: il entend
  rationale: La forme וַיִּשְׁמַע est une forme narrative passée dans le récit du secours reçu. Le passé composé suit ce mouvement sans transformer l’énoncé en maxime générale.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme et la répétition du verbe « appeler » sont maintenus. Le passé composé rend naturellement le témoignage rétrospectif du cantique, tandis que l’image de l’appel parvenant aux oreilles de Dieu est conservée.
