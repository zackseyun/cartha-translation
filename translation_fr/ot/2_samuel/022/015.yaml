  yaml_path: translation/ot/2_samuel/022/015.yaml
  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: fr
  text: Il lança des flèches et les dispersa ; il lança des éclairs et les mit en déroute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les jeta dans la confusion ». Les deux verbes peuvent décrire l’effet des flèches et des éclairs sur les ennemis de David.'
    reason: 'Alternative lexicale : פוץ peut signifier « disperser » et המם « troubler, jeter dans la confusion » ou « mettre en déroute » dans un contexte guerrier.'
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il lança
  rationale: שלח signifie fondamentalement « envoyer », mais avec des flèches comme objet, « lança » rend naturellement l’action en français sans affaiblir l’image poétique.
- source_word: חִצִּים
  choice: des flèches
  rationale: Équivalent courant et précis, qui conserve l’image guerrière concrète.
- source_word: וַיְפִיצֵם
  choice: et les dispersa
  rationale: Le causatif exprime l’idée de disperser ou mettre en déroute ; « dispersa » reste proche du sens lexical et convient au contexte de combat divin.
- source_word: בָּרָק
  choice: il fit jaillir l’éclair
  rationale: בָּרָק désigne l’éclair. Le texte hébreu elliptique omet un verbe explicite ; « fit jaillir » restitue en français l’action parallèle à l’envoi des flèches sans identifier simplement l’éclair aux flèches.
- source_word: וַיְהֻמֵּם
  choice: et les jeta dans la confusion
  rationale: Le verbe המם exprime le fait de troubler, bouleverser ou mettre en déroute. Cette formulation conserve sa valeur causative et la tension entre désarroi et défaite militaire.
theological_decisions:
- issue: Référent des suffixes pronominaux dans « les dispersa » et « les jeta dans la confusion »
  choice: Les pronoms renvoient aux ennemis implicitement présents dans le contexte.
  alternative: Laisser le référent entièrement implicite ou expliciter « ses ennemis ».
  rationale: Les suffixes hébreux marquent un objet masculin pluriel, et le contexte de guerre divine désigne naturellement les adversaires. Garder « les » préserve l’implicite du texte sans ajouter « ses ennemis ».
- issue: Relation entre l’éclair et le second effet sur les ennemis
  choice: 'Conserver deux actions parallèles : Dieu fait jaillir l’éclair, puis jette les ennemis dans la confusion.'
  alternative: Comprendre les deux verbes comme décrivant globalement la mise en déroute produite par les flèches et l’éclair.
  rationale: La syntaxe poétique est compacte et l’hébreu ne précise pas le lien causal. La traduction maintient ce parallélisme et la relative ambiguïté plutôt que de l’expliquer dans le corps du verset.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La brièveté et le parallélisme de la poésie hébraïque sont conservés ; le sujet divin demeure exprimé par « il », conformément au contexte immédiat.
