revisions:
- from: Il lança des flèches et les dispersa ; il fit jaillir l’éclair et les jeta dans la confusion.[a]
  to: Il lança des flèches et les dispersa ; il lança des éclairs et les mit en déroute.[a]
  rationale: La révision retire l’image ajoutée de l’éclair qui « jaillit » et exprime le parallélisme poétique par la répétition sobre de « lança ». Elle emploie « des éclairs » comme équivalent français naturel du nom hébreu singulier à valeur collective, et rend המם par l’expression militaire idiomatique « mit en déroute », tout en préservant en note la nuance de confusion.
  reviewer_model: gpt-5.6-terra
