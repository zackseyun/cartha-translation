    reason: 'Alternative lexicale : פוץ peut signifier « disperser » et המם « troubler, jeter dans la confusion » ou « mettre en déroute » dans un contexte guerrier.'
  revision_rationale: La révision retire l’image ajoutée de l’éclair qui « jaillit » et exprime le parallélisme poétique par la répétition sobre de « lança ». Elle emploie « des éclairs » comme équivalent français naturel du nom hébreu singulier à valeur collective, et rend המם par l’expression militaire idiomatique « mit en déroute », tout en préservant en note la nuance de confusion.
