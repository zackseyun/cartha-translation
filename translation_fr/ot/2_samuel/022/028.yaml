source:
  edition: WLC
  text: וְ/אֶת עַ֥ם עָנִ֖י תּוֹשִׁ֑יעַ וְ/עֵינֶ֖י/ךָ עַל רָמִ֥ים תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: fr
  text: 'Tu sauves un peuple affligé[a], mais tes yeux sont sur les orgueilleux[b] : tu les abaisses.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pauvre », « opprimé » ou « humilié ». Le mot hébreu peut exprimer la pauvreté, l’affliction ou l’oppression.
    reason: lexical_alternative
  - marker: b
    text: Ou « les hautains ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: peuple
  rationale: Ce nom collectif singulier désigne ici un groupe de personnes; « peuple » convient au contexte poétique sans imposer l’idée politique de nation.
- source_word: עָנִי
  choice: affligé
  rationale: L’adjectif peut désigner quelqu’un de pauvre, d’opprimé, d’affligé ou d’humilié. « Affligé » préserve la détresse sociale et vécue sans limiter le sens à la pauvreté matérielle.
- source_word: תּוֹשִׁיעַ
  choice: tu sauves
  rationale: Le hifil de ישׁע exprime l’action de sauver ou de délivrer. « Tu sauves » est concis et conserve toute l’ampleur du verbe.
- source_word: עֵינֶיךָ
  choice: tu as les yeux sur
  rationale: Cette tournure française naturelle conserve l’image concrète des « yeux » employée en hébreu et exprime un regard actif dirigé vers les orgueilleux.
- source_word: רָמִים
  choice: les orgueilleux
  rationale: Dans ce contraste, le terme désigne les personnes qui s’élèvent avec hauteur. « Les orgueilleux » rend clairement la portée morale sans effacer l’image de l’élévation.
- source_word: תַּשְׁפִּיל
  choice: pour les abaisser
  rationale: Le hifil de שׁפל signifie rendre bas, abaisser ou humilier. La construction finale française relie naturellement le regard de Dieu à son action tout en conservant le renversement vertical du texte.
- source_word: וְאֶת
  choice: marque de l’objet direct, non traduite séparément
  rationale: אֵת introduit ici le complément d’objet direct; le וְ initial est rendu implicitement par l’enchaînement français.
- source_word: וְ
  choice: mais
  rationale: Bien que la conjonction signifie formellement « et », le parallélisme oppose le salut des affligés à l’abaissement des orgueilleux; « mais » explicite cette valeur adversative en français idiomatique.
theological_decisions:
- issue: Contraste moral ou seulement social
  choice: Le verset oppose le peuple affligé que Dieu sauve aux orgueilleux qu’il abaisse.
  alternative: Le verset opposerait exclusivement les pauvres sur le plan économique aux personnes socialement élevées.
  rationale: עָנִי garde une possible dimension sociale, tandis que רָמִים peut évoquer ceux qui sont élevés; néanmoins, le parallélisme porte aussi une dimension morale claire. La formulation choisie maintient ces deux horizons sans réduire le contraste à l’économie seule.
- issue: Rapport entre le regard de Dieu et l’abaissement des orgueilleux
  choice: « Tu as les yeux sur les orgueilleux pour les abaisser » présente le regard divin comme orienté vers l’action qui suit.
  alternative: « Tes yeux sont sur les orgueilleux; tu les abaisses » conserverait deux propositions plus juxtaposées.
  rationale: L’hébreu est syntaxiquement resserré. La tournure française choisie reste fidèle à l’image et au sens résultatif sans préciser indûment le moyen ou le moment du jugement.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu. L’image concrète des yeux est conservée dans une tournure française naturelle, et l’opposition entre « affligé » et « orgueilleux » demeure nette sans effacer les nuances sociales possibles.
