  text: הָ/אֵ֕ל הַ/נֹּתֵ֥ן נְקָמֹ֖ת לִ֑/י וּ/מוֹרִ֥יד עַמִּ֖ים תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/048.yaml
  text: the God who gives vengeance to me and brings peoples down under me.
translation:
  language: fr
  text: le Dieu qui m’accorde la vengeance et abaisse des peuples sous moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: le Dieu
  rationale: Reproduit la désignation définie de Dieu dans la continuité poétique du verset précédent.
- source_word: הַנֹּתֵן נְקָמֹת לִי
  choice: qui m’accorde la vengeance
  rationale: Le pluriel hébreu נְקָמוֹת peut exprimer les actes de vengeance ou la vengeance dans toute sa force. « M’accorde » rend naturellement נֹתֵן ... לִי sans transformer le bénéficiaire en simple objet d’une vengeance exercée à sa place.
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: et qui fait descendre des peuples sous moi
  rationale: Conserve l’image verticale et royale de l’hébreu ainsi que le pluriel indéfini « des peuples », sans préciser davantage la manière de leur soumission.
theological_decisions:
- issue: Rapport entre Dieu, le locuteur et la vengeance
  choice: m’accorde la vengeance
  alternative: me venge
  rationale: L’hébreu dit littéralement que Dieu « donne des vengeances à/pour moi ». La formulation retenue préserve le rôle du locuteur comme bénéficiaire ou destinataire, sans résoudre l’ambiguïté par « me venge ».
- issue: Soumission des peuples
  choice: fait descendre des peuples sous moi
  alternative: soumet des peuples à mon autorité
  rationale: La traduction conserve la métaphore spatiale de תַּחְתֵּנִי et évite d’expliciter une notion politique qui, bien que possible dans le contexte, n’est pas formulée directement.
translation_notes:
  register: Style poétique, digne et actuel. La tournure « fait descendre ... sous moi » est volontairement imagée et légèrement marquée afin de préserver la formulation hébraïque.
