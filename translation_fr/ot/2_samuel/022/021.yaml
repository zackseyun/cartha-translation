  text: יִגְמְלֵ֥/נִי יְהוָ֖ה כְּ/צִדְקָתִ֑/י כְּ/בֹ֥ר יָדַ֖/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: fr
  text: Yahweh me traite[a] selon ma justice ; selon la pureté de mes mains[b], il me rétribue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « me récompense ». Le verbe hébreu peut désigner la manière de traiter ou de rétribuer quelqu’un selon sa conduite.
    reason: lexical_alternative
  - marker: b
    text: La « pureté de mes mains » est une image hébraïque qui désigne l’innocence ou l’intégrité dans les actes.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: m’a traité
  rationale: Le verbe גמל peut exprimer la manière dont on traite quelqu’un en fonction de sa conduite, notamment l’idée de rétribution. « M’a traité » en conserve l’étendue sémantique, tandis que le second membre explicite la rétribution positive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כְּצִדְקָתִי
  choice: selon ma justice
  rationale: Le nom צְדָקָה désigne ici la droiture ou la conduite juste du locuteur. « Selon » rend la valeur de mesure ou de correspondance de la préposition כְּ.
- source_word: כְּבֹר יָדַי
  choice: selon la pureté de mes mains
  rationale: בֹּר évoque la pureté ou la propreté. La formulation conserve l’image hébraïque des mains pures, qui renvoie à l’innocence ou à l’intégrité dans les actes.
- source_word: יָשִׁיב לִי
  choice: il m’a rendu ce qui me revenait
  rationale: Le hiphil de שוב signifie ici rendre ou rétribuer. Cette formulation française exprime la rétribution sans suggérer nécessairement le remboursement d’une dette financière.
theological_decisions:
- issue: La déclaration de justice personnelle implique-t-elle une perfection sans péché ou un mérite absolu devant Dieu ?
  choice: Conserver directement l’affirmation du locuteur concernant « ma justice » et « la pureté de mes mains ».
  alternative: Atténuer cette affirmation, ou la reformuler comme une déclaration de perfection absolue et de mérite salvateur.
  rationale: L’hébreu attribue explicitement au locuteur justice et pureté des actes. La traduction préserve cette tension sans étendre l’affirmation à une perfection morale absolue ni à un enseignement sur le salut par le mérite.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme hébreu est conservé, tout comme l’image concrète des mains pures. « Rendu ce qui me revenait » est idiomatique et maintient l’idée de rétribution.
