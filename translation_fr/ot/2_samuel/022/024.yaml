  text: וָ/אֶהְיֶ֥ה תָמִ֖ים ל֑/וֹ וָ/אֶשְׁתַּמְּרָ֖/ה מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/024.yaml
  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: fr
  text: J’ai été intègre envers lui[a], et je me suis gardé de ma faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai été sans reproche devant lui » ou « entier avec lui ». Le mot hébreu peut exprimer l’intégrité ou le fait d’être entier, et la préposition peut être comprise dans un sens relationnel ou évaluatif.
    reason: lexical_alternative
  - marker: b
    text: Ou « de mon iniquité » ou « de ma culpabilité ». Le mot hébreu peut désigner la faute, la culpabilité qui en résulte, ou parfois ses conséquences.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: J’ai été
  rationale: Le wayyiqtol de היה exprime ici, dans le récit poétique, un état passé. La coordination initiale est rendue naturellement par l’enchaînement français.
- source_word: תָמִים
  choice: intègre
  rationale: תָמִים évoque la totalité, la droiture et l’intégrité. « Intègre » conserve la force morale du terme sans imposer l’idée d’une perfection absolue et sans péché.
- source_word: לוֹ
  choice: envers lui
  rationale: La préposition signifie littéralement « pour lui / à son égard ». « Envers lui » préserve cette orientation relationnelle; « devant lui » ou « à ses yeux » exprimerait plus explicitement une nuance évaluative possible.
- source_word: וָאֶשְׁתַּמְּרָה
  choice: je me suis gardé
  rationale: La forme réflexive de שׁמר décrit l’action de veiller sur soi-même afin de se tenir éloigné de quelque chose. « Je me suis gardé » en restitue clairement la valeur réflexive.
- source_word: מֵעֲוֺנִי
  choice: de ma faute
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. « Ma faute » est naturel en français moderne, conserve la portée morale et maintient le suffixe personnel, important dans cette affirmation.
theological_decisions:
- issue: La déclaration de David implique-t-elle une perfection morale absolue?
  choice: Une affirmation forte d’intégrité devant Dieu, sans expliciter une absence absolue de tout péché
  alternative: Une revendication de perfection morale absolue
  rationale: Le choix « intègre » respecte la force de תָמִים et la tension du texte, tandis que la seconde proposition reconnaît explicitement « ma faute ». La traduction ne réduit donc pas la déclaration, mais ne lui ajoute pas non plus une doctrine de perfection sans péché.
translation_notes:
  register: Français international moderne, sobre et poétique. La formulation reste proche de la structure hébraïque tout en étant naturelle. « Intègre » évite le registre juridique étroit d’« irréprochable » et fait entendre l’idée de droiture entière; « faute » est plus courant qu’« iniquité », cette dernière étant conservée en note.
