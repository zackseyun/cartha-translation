  text: בְּנֵ֥י נֵכָ֖ר יִתְכַּֽחֲשׁוּ לִ֑/י לִ/שְׁמ֥וֹעַ אֹ֖זֶן יִשָּׁ֥מְעוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/045.yaml
  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
translation:
  language: fr
  text: Les étrangers se soumettent à moi[a] ; à peine ont-ils entendu qu’ils m’obéissent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier qu’ils feignent l’obéissance ou se soumettent à contrecœur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à l’audition de l’oreille » ; c’est-à-dire dès qu’ils entendent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: Les étrangers
  rationale: L’expression signifie littéralement « les fils de l’étranger », mais désigne idiomatiquement des personnes étrangères. La formulation française évite un calque peu naturel sans perdre le référent.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: se soumettent à moi
  rationale: Dans ce chant de victoire, le hitpael de כחש exprime une soumission contrainte, réticente ou possiblement feinte. La traduction principale rend l’acte de soumission, tandis que la note conserve explicitement son ambiguïté.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: au seul ouï-dire
  rationale: Littéralement « à l’audition de l’oreille », cette tournure indique une réaction immédiate à ce qui est entendu, sans rencontre directe. « Au seul ouï-dire » conserve l’image de l’information reçue par l’oreille dans un français naturel et soutenu.
- source_word: יִשָּׁמְעוּ לִי
  choice: ils m’obéissent
  rationale: Le verbe שׁמע construit avec ל signifie ici écouter au sens de prêter attention et obéir, ce que le contexte de soumission des peuples confirme.
theological_decisions:
- issue: Nature de la soumission des étrangers
  choice: Le texte principal parle de soumission sans la présenter comme volontaire.
  alternative: « font semblant de m’obéir » ou « viennent en tremblant devant moi »
  rationale: Le verbe hébreu permet une nuance de soumission forcée ou feinte, mais ne justifie pas de trancher entièrement entre dissimulation, réticence et capitulation. La note maintient cette tension.
translation_notes:
  register: Français international moderne, digne et lisible. « Au seul ouï-dire » garde une légère élévation poétique adaptée au chant, tandis que les notes expliquent les deux expressions hébraïques sans résoudre abusivement leur ambiguïté.
