- from: J’ai poursuivi mes ennemis et je les ai anéantis ; je ne suis pas revenu avant de les avoir exterminés.
  to: J’ai poursuivi mes ennemis et je les ai anéantis ; je ne suis pas revenu en arrière avant de les avoir complètement anéantis.
  rationale: La révision précise le sens directionnel de « ne pas revenir » dans une poursuite et remplace « exterminés » par une expression qui rend la finalité de כּלה sans introduire une connotation plus spécifique. La répétition de l’idée de destruction reflète la progression emphatique du distique hébreu.
