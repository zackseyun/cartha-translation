review_pass:
  verdict: revise
  source_fidelity: Le mouvement et la progression de l’hébreu sont globalement rendus, mais « je ne suis pas revenu » est moins précis que שׁוב dans ce contexte de poursuite, qui signifie ne pas rebrousser chemin / ne pas faire demi-tour. « Exterminés » ajoute une connotation moderne de destruction d’une population et est plus étroit que כלה, dont le sens ici est mener à terme, achever ou consumer.
  naturalness: La phrase est fluide, mais « avant de les avoir exterminés » est inutilement redondant après « anéantis » et alourdit la clausule. « Je ne suis pas revenu en arrière » est naturel en français international et exprime le mouvement de la poursuite.
  terminology: « Anéantis » convient à וָאַשְׁמִידֵם dans ce contexte martial. Pour כַּלּוֹתָם, « les avoir complètement anéantis » conserve la finalité totale sans la connotation spécifique d’« exterminer ».
  issues:
  - severity: medium
    issue: « Je ne suis pas revenu » sous-traduit le mouvement de retrait impliqué par שׁוב dans le contexte de la poursuite.
    rationale: Le parallèle narratif indique que le locuteur ne rebrousse pas chemin avant l’achèvement de l’action; « revenu en arrière » rend ce sens sans imposer une destination.
  - severity: medium
    issue: « Exterminés » est une précision lexicale et historique non requise par כּלה.
    rationale: כלה exprime l’achèvement, la consommation ou la disparition complète. « Exterminer » peut évoquer spécifiquement l’élimination systématique d’un groupe; « complètement anéantis » conserve mieux l’amplitude du terme hébreu.
