  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
translation:
  language: fr
  text: J’ai poursuivi mes ennemis et je les ai anéantis ; je ne suis pas revenu en arrière avant de les avoir complètement anéantis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: J’ai poursuivi
  rationale: Le qal de רדף signifie couramment « poursuivre ». Le passé composé convient à la narration poétique en français moderne.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Le nom אֹיֵב avec le suffixe de première personne désigne directement « mes ennemis ».
- source_word: וָאַשְׁמִידֵם
  choice: et je les ai anéantis
  rationale: Le hifil de שׁמד exprime la destruction complète. « Anéantir » conserve la force martiale du verbe sans registre familier.
- source_word: וְלֹא אָשׁוּב
  choice: je ne suis pas revenu
  rationale: Le verbe שׁוב signifie revenir ou retourner. Dans le mouvement de la poursuite, « je ne suis pas revenu » reste naturel tout en évitant de préciser au-delà de l’hébreu le geste de faire demi-tour.
- source_word: עַד כַּלּוֹתָם
  choice: avant de les avoir exterminés
  rationale: 'L’infinitif construit piel de כלה avec suffixe objet exprime ici l’action menée jusqu’à son terme : le locuteur ne revient qu’après avoir entièrement éliminé ses ennemis. Cette construction française rend explicitement le sujet implicite de l’infinitif.'
