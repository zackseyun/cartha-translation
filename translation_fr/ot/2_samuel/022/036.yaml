  text: וַ/תִּתֶּן לִ֖/י מָגֵ֣ן יִשְׁעֶ֑/ךָ וַ/עֲנֹתְ/ךָ֖ תַּרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/036.yaml
  text: You gave me the shield of your salvation[a], and your gentleness made me great.
translation:
  language: fr
  text: Tu m’as donné le bouclier de ton salut, et ta douceur[a] m’a rendu grand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton humilité » ou « ton abaissement bienveillant » ; l’expression hébraïque est difficile et peut évoquer Dieu qui s’abaisse avec bonté pour élever celui qui parle. Certains comprennent plutôt « ton secours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Tu m’as donné
  rationale: Le qal wayyiqtol de נתן exprime ici simplement une action passée. Le passé composé est naturel en français moderne, et le pronom « tu » conserve l’adresse directe à Dieu.
- source_word: מָגֵן
  choice: le bouclier
  rationale: L’image militaire concrète doit être conservée plutôt que remplacée par l’idée abstraite de protection.
- source_word: יִשְׁעֶךָ
  choice: de ton salut
  rationale: Cette formulation préserve la construction hébraïque et la portée large de ישׁע, qui évoque le salut, la délivrance ou la victoire accordée par Dieu.
- source_word: וַעֲנֹתְךָ
  choice: ton humilité
  rationale: Le terme est difficile. « Humilité » rend directement l’idée surprenante de Dieu qui s’abaisse avec bienveillance pour élever le locuteur, tout en laissant subsister la tension théologique du texte.
- source_word: תַּרְבֵּנִי
  choice: m’a rendu grand
  rationale: Le hiphil de רבה signifie faire grandir ou rendre grand. Cette traduction conserve le sens causatif et convient à l’élévation du locuteur après sa délivrance.
theological_decisions:
- issue: Le sens de וַעֲנֹתְךָ appliqué à Dieu
  choice: ton humilité
  alternative: ta douceur ; ton abaissement bienveillant ; ton secours
  rationale: « Ton humilité » préserve la formulation théologiquement saisissante selon laquelle Dieu s’abaisse pour élever son serviteur. Comme le mot hébreu est difficile et susceptible d’autres interprétations, les principales nuances sont signalées en note sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe reste simple, l’image du bouclier est conservée et l’expression inhabituelle « ton humilité » maintient la tension propre à l’hébreu.
