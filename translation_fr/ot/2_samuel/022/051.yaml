  source_fidelity: Révision nécessaire pour rendre plus directement le possessif de לִמְשִׁיחוֹ (« son oint ») et la relation syntaxique de David à « son oint ». Le texte conserve correctement « grandes délivrances », le singulier collectif « descendance » et la durée « pour toujours ».
  naturalness: La formulation proposée reste naturelle en français international moderne. « Montre son amour fidèle » exprime חֶסֶד plus précisément que « témoigne de sa fidélité », qui pouvait paraître trop abstrait et ne pas expliciter la dimension bienveillante du terme.
  terminology: « Son oint » est le correspondant direct de מְשִׁיחוֹ; la note en donne l’explication accessible et l’alternative « Messie ». « Amour fidèle » rend la loyauté durable de חֶסֶד sans réduire le terme à une fidélité générale ni imposer une interprétation confessionnelle.
  issues:
