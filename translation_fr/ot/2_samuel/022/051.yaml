revisions:
- from: Il accorde de grandes délivrances[a] à son roi et témoigne de sa fidélité[b] envers celui qu’il a consacré par l’onction[c], envers David et sa descendance, pour toujours.
  to: Il accorde de grandes délivrances[a] à son roi et montre son amour fidèle[b] envers son oint[c], David, et envers sa descendance, pour toujours.
  rationale: 'La révision rétablit une correspondance plus directe avec la construction hébraïque : Dieu agit envers « son oint », identifié comme David, puis envers sa descendance. Elle affine aussi le rendu de חֶסֶד en « amour fidèle », tout en laissant les nuances « fidélité à l’alliance » et « bonté loyale » dans la note. Aucun changement de sens théologique n’est introduit.'
