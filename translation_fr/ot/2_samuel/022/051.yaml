    issue: « celui qu’il a consacré par l’onction » remplace « son oint »
    rationale: Cette périphrase est compréhensible, mais elle explicite et reformule le terme hébreu plutôt que de conserver son possessif et son titre. « Son oint » est concis, exact et peut être éclairé en note.
  - severity: medium
    issue: Relation de David à « son oint » insuffisamment marquée
    rationale: Dans לִמְשִׁיחוֹ לְדָוִד, David précise l’oint. La ponctuation révisée (« son oint, David ») conserve cette apposition plutôt que de faire de David un bénéficiaire simplement coordonné.
  - severity: low
    issue: « sa fidélité » est trop général pour חֶסֶד
    rationale: Le terme désigne une bienveillance loyale, souvent liée à l’alliance. « Son amour fidèle » garde à la fois la dimension affective/bienfaisante et la constance; la note précise les autres possibilités.
