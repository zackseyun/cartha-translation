  text: מגדיל יְשׁוּע֣וֹת מַלְכּ֑/וֹ וְ/עֹֽשֶׂה חֶ֧סֶד לִ/מְשִׁיח֛/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֖/וֹ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: fr
  text: Il accorde de grandes délivrances[a] à son roi et montre son amour fidèle[b] envers son oint[c], David, et envers sa descendance, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de grandes victoires » ou « un grand salut ». Le pluriel hébreu peut désigner des actes de délivrance.
    reason: lexical_alternative
  - marker: b
    text: Ou « montre sa fidélité à l’alliance » ou « montre sa bonté loyale ». Le terme hébreu désigne un amour fidèle et durable, souvent associé à l’alliance.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « son oint ». Le mot peut aussi être rendu par « son Messie ». Ici, il désigne d’abord David, le roi consacré par l’onction; il peut aussi évoquer la promesse messianique plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל יְשׁוּעוֹת
  choice: accorde de grandes délivrances
  rationale: Le participe causatif de גדל signifie littéralement « rendre grand »; associé au pluriel יְשׁוּעוֹת, il évoque de grands actes de délivrance ou de grandes victoires. Cette formulation française est naturelle tout en conservant le pluriel concret de l’hébreu.
- source_word: מַלְכּוֹ
  choice: à son roi
  rationale: Rend directement le nom avec suffixe possessif et maintient la relation entre le Seigneur et le roi davidique.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: et témoigne de sa fidélité
  rationale: חֶסֶד désigne ici une bonté loyale et durable, liée à l’engagement de Dieu. « Fidélité » exprime cette loyauté relationnelle sans alourdir le texte principal; la dimension d’alliance est explicitée en note.
- source_word: לִמְשִׁיחוֹ
  choice: envers celui qu’il a consacré par l’onction
  rationale: Cette expression rend le sens premier de « son oint » dans un français courant et indique clairement qu’il s’agit du roi consacré, sans imposer d’emblée le titre ultérieur de « Messie ».
- source_word: לְדָוִד
  choice: envers David
  rationale: Le nom propre est rendu selon sa forme française usuelle.
- source_word: וּלְזַרְעוֹ
  choice: et sa descendance
  rationale: זֶרַע est un singulier collectif. « Descendance » est naturel en français et conserve la portée dynastique et collective du terme.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Formulation française claire et idiomatique de la durée sans fin exprimée dans la promesse.
theological_decisions:
- issue: Sens de חֶסֶד dans le contexte de l’alliance davidique
  choice: sa fidélité
  alternative: son amour fidèle; sa fidélité à l’alliance
  rationale: Le contexte royal et dynastique souligne la loyauté de Dieu envers son engagement. Le texte principal garde une expression française fluide, tandis que la note préserve explicitement la nuance d’alliance.
- issue: Interprétation de מְשִׁיחוֹ
  choice: celui qu’il a consacré par l’onction
  alternative: son oint; son Messie
  rationale: Le référent immédiat est David, puis le roi de sa lignée. Cette traduction conserve le sens historique de l’onction royale sans effacer la résonance messianique plus large, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme royal et dynastique du verset. « Consacré par l’onction » évite l’emploi substantivé, moins transparent aujourd’hui, de « oint », tout en maintenant la portée biblique du terme.
