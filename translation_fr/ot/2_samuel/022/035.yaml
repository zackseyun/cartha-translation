  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: fr
  text: Il entraîne mes mains au combat[a], et mes bras peuvent plier un arc de bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la guerre ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est difficile. Autre traduction possible : « un arc de bronze est plié par mes bras » ; l’image souligne la force que Dieu donne au combattant.'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: מְלַמֵּד
  choice: entraîne
  rationale: Le participe de למד exprime ici un apprentissage pratique. Dans ce contexte militaire, « entraîne » est naturel et plus précis que le seul « enseigne ».
- source_word: יָדַי
  choice: mes mains
  rationale: Le pluriel concret est conservé afin de respecter l’image corporelle et son parallélisme avec « mes bras ».
- source_word: לַמִּלְחָמָה
  choice: au combat
  rationale: מלחמה peut désigner la guerre ou le combat. « Au combat » s’accorde naturellement avec « entraîne mes mains » sans élargir nécessairement la scène à une campagne entière.
- source_word: וְנִחַת
  choice: tendent
  rationale: La forme hébraïque est difficile et peut être comprise comme décrivant l’arc qui se plie sous l’action des bras ou la capacité des bras à le bander. « Mes bras tendent » donne une formulation française directe tout en laissant la note signaler l’ambiguïté.
- source_word: קֶשֶׁת
  choice: un arc
  rationale: Équivalent français courant du nom de cette arme.
- source_word: נְחוּשָׁה
  choice: de bronze
  rationale: Le terme peut renvoyer au bronze ou au cuivre. « De bronze » est la désignation traditionnelle et idiomatique d’un arc figurant une force exceptionnelle.
- source_word: זְרֹעֹתַי
  choice: mes bras
  rationale: Le pluriel concret est maintenu pour préserver le parallélisme avec « mes mains » et l’image de la force physique reçue.
theological_decisions:
- issue: L’action divine dans l’aptitude guerrière
  choice: Le verset attribue à Dieu l’entraînement et la force de David dans un combat réel.
  alternative: Lire le verset comme une affirmation générale sur le combat spirituel des croyants.
  rationale: Le contexte immédiat est le chant d’action de grâce d’un roi pour sa délivrance et son aptitude au combat. La traduction n’allégorise pas cette affirmation historique.
- issue: Ambiguïté de וְנִחַת et rapport entre les bras et l’arc
  choice: 'Formulation active : « mes bras tendent un arc de bronze » avec une note exposant l’autre analyse.'
  alternative: « Un arc de bronze est tendu par mes bras » ou « mes bras peuvent tendre un arc de bronze ».
  rationale: L’hébreu est inhabituel et les analyses divergent. Le texte principal reste idiomatique, tandis que la note évite de masquer l’incertitude grammaticale.
translation_notes:
  register: Français international moderne, sobre et digne. La construction conserve les images concrètes des mains, des bras et de l’arc, ainsi que le cadre militaire du texte.
