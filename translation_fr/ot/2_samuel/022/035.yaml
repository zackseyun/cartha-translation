  rationale: La révision remplace « tendent » par « peuvent plier », qui correspond mieux à l’image d’un arc métallique courbé grâce à la force des bras et reste conforme à la solution idiomatique retenue dans l’audit anglais. La note conserve explicitement l’ambiguïté grammaticale de l’hébreu, sans imposer une analyse unique.
