  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: fr
  text: 'Il dit : « Le SEIGNEUR est mon rocher, ma forteresse et celui qui me délivre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française courante, en petites capitales, sans imposer une vocalisation reconstruite.
- source_word: סַלְעִי
  choice: mon rocher
  rationale: Conserve l’image concrète du rocher comme lieu de stabilité et de protection.
- source_word: מְצֻדָתִי
  choice: ma forteresse
  rationale: Exprime naturellement en français un lieu fortifié offrant refuge et défense.
- source_word: מְפַלְטִי לִי
  choice: celui qui me délivre
  rationale: Rend le participe nominal et le complément לִי dans une tournure française idiomatique; le bénéfice personnel exprimé par « pour moi » est porté par « me ».
theological_decisions:
- issue: Valeur de לִי après מְפַלְטִי
  choice: celui qui me délivre
  alternative: mon libérateur pour moi
  rationale: La formulation retenue préserve la relation personnelle sans le pléonasme peu naturel de « mon libérateur pour moi »; elle n’ajoute aucune précision doctrinale au texte.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme ternaire et les métaphores défensives sont conservés; la tournure hébraïque finale est idiomatisée sans perte de sens.
