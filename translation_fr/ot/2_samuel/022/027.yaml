source:
  edition: WLC
  text: עִם נָבָ֖ר תִּתָּבָ֑ר וְ/עִם עִקֵּ֖שׁ תִּתַּפָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/027.yaml
  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: fr
  text: Avec celui qui est pur, tu te montres pur ; avec celui qui est tortueux, tu te montres retors[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu te montres contraire » ou « tu agis avec habileté ». Le verbe hébreu est rare et son sens est incertain ; il évoque une réponse adaptée à la conduite tortueuse de l’autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: pur
  rationale: L’adjectif désigne la pureté ou la netteté morale. « Pur » est naturel en français et permet de conserver la reprise de la même racine dans le verbe suivant.
- source_word: תִּתָּבָר
  choice: tu te montres pur
  rationale: La forme verbale a probablement une nuance réflexive. Cette traduction préserve cette nuance ainsi que le parallélisme poétique avec « celui qui est pur ».
- source_word: עִקֵּשׁ
  choice: tortueux
  rationale: Le terme décrit une personne moralement dévoyée ou retorse. « Tortueux » maintient l’image d’un comportement qui n’est pas droit et s’oppose clairement à « pur ».
- source_word: תִּתַּפָּל
  choice: tu te montres retors
  rationale: Ce verbe rare et difficile semble exprimer une réponse correspondante de Dieu envers l’homme tortueux. « Retors » conserve la force et la tension de l’hébreu sans réduire le sens à la seule prudence habile.
- source_word: עִם
  choice: avec
  rationale: La préposition exprime ici la relation et la correspondance entre la conduite de la personne et la manière dont Dieu agit envers elle.
theological_decisions:
- issue: Comment rendre la réponse de Dieu envers l’homme tortueux sans effacer la formulation provocante de l’hébreu
  choice: tu te montres retors
  alternative: tu agis avec habileté / tu te montres contraire
  rationale: « Retors » préserve le parallélisme tendu et la réponse correspondante suggérée par le texte. Il ne faut pas transformer silencieusement le verbe en une qualité simplement positive ; la note signale toutefois sa rareté et les autres compréhensions possibles.
translation_notes:
  register: Français moderne, poétique et dignifié. La répétition « pur… pur » reproduit le jeu de racine hébreu ; « tortueux… retors » cherche une correspondance sonore et sémantique analogue tout en laissant la difficulté du dernier verbe visible dans la note.
