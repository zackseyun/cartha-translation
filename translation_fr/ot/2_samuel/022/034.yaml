  text: מְשַׁוֶּ֥ה רגלי/ו כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּמוֹתַ֖/י יַעֲמִדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/034.yaml
  text: He makes my feet like the feet of deer[b][a], and sets me secure on my heights.
translation:
  language: fr
  text: Il rend mes pieds[c] pareils à ceux des biches[a] et me fait tenir debout sur mes hauteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « femelles du cerf ». L’hébreu emploie un nom féminin désignant des cervidés, image d’agilité et d’assurance sur les terrains escarpés.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur mes hauts lieux ». Dans ce contexte poétique, l’expression désigne vraisemblablement des lieux élevés plutôt que des sites cultuels.
    reason: lexical_alternative
  - marker: c
    text: Le texte consonantique porte « ses pieds »; la lecture massorétique traditionnelle porte « mes pieds ».
    reason: textual_variant
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: rend … pareils
  rationale: Le participe piel exprime ici l’idée de rendre semblable; cette tournure française conserve le sens causatif et s’accorde naturellement avec la comparaison.
- source_word: רַגְלַי
  choice: mes pieds
  rationale: Le suffixe massorétique est à la première personne, en accord avec « me » et « mes hauteurs » dans la suite du verset.
- source_word: כָּאַיָּלוֹת
  choice: à ceux des biches
  rationale: Le féminin pluriel désigne des biches. « Ceux » reprend explicitement « pieds » et rend la comparaison claire sans ajouter un élément absent du sens.
- source_word: בָּמוֹתַי
  choice: mes hauteurs
  rationale: Le terme désigne ici des lieux élevés. « Mes hauteurs » préserve le possessif et la force poétique sans suggérer nécessairement des hauts lieux cultuels.
- source_word: יַעֲמִדֵנִי
  choice: me fait tenir debout
  rationale: Le hiphil de עמד signifie littéralement « faire tenir debout » ou « établir ». Cette traduction conserve le causatif sans expliciter dans le texte une sécurité seulement implicite.
