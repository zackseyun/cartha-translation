  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: fr
  text: Les cordes du Shéol[a] m’ont entouré ; les pièges de la mort sont venus à ma rencontre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la tombe » ou « le séjour des morts ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « m’ont fait face » ou « m’ont surpris ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: les cordes de
  rationale: Le nom חבל désigne ici des cordes ou des liens. « Cordes » conserve l’image poétique de l’entrave et correspond au parallélisme avec les « pièges ».
- source_word: שְׁאוֹל
  choice: Shéol
  rationale: La translittération conserve le terme hébreu désignant le séjour des morts, sans le réduire à la tombe ni préciser davantage sa portée théologique.
- source_word: סַבֻּנִי
  choice: m’encerclaient
  rationale: Issu de סבב, le verbe exprime l’action d’entourer ou d’encercler. « M’encerclaient » est naturel et renforce sobrement l’image menaçante.
- source_word: קִדְּמֻנִי
  choice: venaient à ma rencontre
  rationale: Le verbe קדם peut signifier venir au-devant de quelqu’un, le rencontrer ou l’affronter. Cette formulation préserve le mouvement vers le locuteur sans imposer le sens plus interprétatif de « m’affrontaient ».
- source_word: מֹקְשֵׁי
  choice: les pièges de
  rationale: מוקש désigne un piège ou un lacet. « Pièges » est clair en français moderne et maintient l’image d’un danger mortel.
- source_word: מָוֶת
  choice: la mort
  rationale: Traduction directe du nom מָוֶת, conforme au parallélisme poétique.
theological_decisions:
- issue: Rendu de שְׁאוֹל
  choice: Shéol
  alternative: la tombe ; le séjour des morts
  rationale: « Shéol » préserve le terme propre à l’univers conceptuel hébreu et l’ambiguïté entre la mort, la tombe et le séjour des morts, sans résoudre artificiellement cette tension.
translation_notes:
  register: Français moderne, poétique et digne. Le rythme en deux membres conserve le parallélisme hébreu ; « Shéol » maintient la texture théologique du texte source.
