  text: וַ/תַּזְרֵ֥/נִי חַ֖יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֥יעַ קָמַ֖/י תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: fr
  text: Tu m’as ceint de force pour le combat[a] ; tu as fait plier sous moi ceux qui se dressaient contre moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu m’as équipé pour le combat en me donnant de la force. » Le verbe hébreu évoque littéralement le fait de ceindre quelqu’un, et, par extension, de l’équiper ou de le préparer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu as fait s’agenouiller sous moi ceux qui se dressaient contre moi ». Le verbe hébreu peut exprimer plus littéralement l’action de faire s’incliner ou s’agenouiller.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: tu m’as équipé
  rationale: Le verbe exprime ici l’action de ceindre ou d’équiper quelqu’un. « Équiper » restitue naturellement en français moderne la préparation au combat, tandis qu’une note conserve l’image plus littérale de la ceinture.
- source_word: חַיִל
  choice: de force
  rationale: חַיִל désigne ici la force ou la puissance dont le locuteur est pourvu en vue du combat.
- source_word: לַמִּלְחָמָה
  choice: pour le combat
  rationale: Cette formulation française naturelle convient au contexte martial immédiat et rend la valeur de destination de לַ.
- source_word: תַּכְרִיעַ
  choice: tu as fait plier
  rationale: Le causatif de כרע signifie faire plier, agenouiller ou s’incliner. « Faire plier » conserve le mouvement d’abaissement sans imposer exclusivement l’image de l’agenouillement.
- source_word: קָמַי
  choice: ceux qui se dressaient contre moi
  rationale: La formulation préserve le lien avec קום, « se lever, se dresser », ainsi que le sens hostile du participe.
- source_word: תַּחְתֵּנִי
  choice: sous moi
  rationale: Traduction directe de l’expression spatiale, qui représente les adversaires soumis et placés sous le locuteur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique et l’imagerie martiale sont maintenus. « Faire plier » évite une tournure maladroite tout en préservant l’abaissement causé par Dieu.
