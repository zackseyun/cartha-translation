source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: fr
  text: David adressa à Yahweh les paroles de ce chant, le jour où Yahweh le délivra de la main de tous ses ennemis et de la main de Saül.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: adressa
  rationale: Le verbe דבר signifie ici « parler, prononcer ». Avec le complément introduit par ל (« à Yahweh »), « adressa à » rend naturellement la construction sans transformer le verbe en « chanta ».
- source_word: לַיהוָה / יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu porte explicitement le tétragramme יהוה; « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: les paroles de ce chant
  rationale: Cette formulation conserve à la fois דִּבְרֵי (« paroles ») et שִׁירָה (« chant »), sans réduire l’expression à « ce chant ».
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Rend l’indication temporelle de façon naturelle en français tout en gardant la référence au jour de la délivrance.
- source_word: הִצִּיל
  choice: délivra
  rationale: Dans ce contexte de menaces ennemies, le verbe נצל désigne l’action d’arracher quelqu’un à un pouvoir hostile; « délivrer » convient au registre narratif et poétique.
- source_word: מִכַּף
  choice: de la main de
  rationale: La traduction conserve la métaphore hébraïque de la main comme puissance ou emprise, intelligible en français biblique courant.
- source_word: כָּל אֹיְבָיו
  choice: tous ses ennemis
  rationale: Équivalent direct, naturel et complet du groupe hébreu.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et standard du nom hébreu שָׁאוּל.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie deux fois le nom propre divin. « Yahweh » en conserve la fonction de nom d’alliance sans substituer un titre et sans imposer une lecture confessionnelle particulière.
- issue: Nature de l’énoncé de David
  choice: « adressa […] les paroles de ce chant »
  alternative: « chanta ce chant »
  rationale: Même si le contenu est un chant, l’hébreu emploie דבר (« parler ») et mentionne explicitement ses « paroles ». La traduction maintient cette formulation plutôt que de résoudre la tension en disant simplement « chanta ».
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le caractère introductif du verset et le parallélisme « de la main de… et de la main de… ». Aucun archaïsme n’est nécessaire.
