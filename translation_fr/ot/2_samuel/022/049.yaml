  text: וּ/מוֹצִיאִ֖/י מֵ/אֹֽיְבָ֑/י וּ/מִ/קָּמַ/י֙ תְּר֣וֹמְמֵ֔/נִי מֵ/אִ֥ישׁ חֲמָסִ֖ים תַּצִּילֵֽ/נִי׃
base_translation:
