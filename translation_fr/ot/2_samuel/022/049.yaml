  yaml_path: translation/ot/2_samuel/022/049.yaml
  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
translation:
  language: fr
  text: Toi qui me fais échapper à mes ennemis[a], tu m’élèves au-dessus de ceux qui se dressent contre moi ; tu me délivres de l’homme violent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et me fais échapper à mes ennemis » ; la conjonction hébraïque peut être rendue explicitement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’un homme de violence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: qui me fait échapper
  rationale: Le participe causatif de יצא évoque le fait de faire sortir. « Qui me fait échapper » conserve cette valeur causative dans un français naturel et maintient le lien relatif avec le contexte précédent.
- source_word: מֵאֹיְבָי
  choice: à mes ennemis
  rationale: Avec « échapper », le français exige naturellement la préposition « à » ; l’idée de séparation exprimée par מִן demeure intacte.
- source_word: וּמִקָּמַי
  choice: ceux qui se dressent contre moi
  rationale: Cette formulation garde l’image verbale de קום et sa valeur hostile, plutôt que de la réduire au terme plus général « adversaires ».
- source_word: תְּרוֹמְמֵנִי
  choice: tu m’élèves au-dessus
  rationale: Le choix préserve à la fois la métaphore verticale de רום et l’idée de supériorité accordée sur les assaillants.
- source_word: מֵאִישׁ חֲמָסִים
  choice: de l’homme violent
  rationale: Le singulier איש est conservé, tandis que חֲמָסִים, pluriel de qualité ou expression intensive de la violence, est rendu idiomatiquement par l’adjectif « violent ».
- source_word: תַּצִּילֵנִי
  choice: tu me délivres
  rationale: « Délivrer » rend naturellement נצל dans ce contexte de menace et convient au registre poétique et solennel du cantique.
