source:
  edition: WLC
  text: וַ/יֵּ֥ט שָׁמַ֖יִם וַ/יֵּרַ֑ד וַ/עֲרָפֶ֖ל תַּ֥חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: fr
  text: Il courba les cieux et descendit ; une obscurité épaisse[a] était sous ses pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une sombre nuée » ; le mot hébreu peut désigner une obscurité dense associée à la manifestation du Seigneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: courba
  rationale: Le verbe נטה, avec « les cieux » pour complément, évoque ici Dieu qui fait se courber les cieux vers le bas. « Courba » conserve avec naturel cette image cosmique et théophanique.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Dans ce contexte poétique de théophanie, « les cieux » préserve mieux le registre élevé et cosmique que « le ciel ».
- source_word: וַיֵּרַד
  choice: descendit
  rationale: Traduction directe de ירד, claire et digne en français, qui conserve le mouvement spatial exprimé par l’hébreu.
- source_word: וַעֲרָפֶל
  choice: une obscurité épaisse
  rationale: עֲרָפֶל désigne une obscurité dense, parfois comprise comme une nuée sombre, associée ici à la manifestation divine. Ce choix préserve sa densité sans imposer l’interprétation de la nuée.
- source_word: תַּחַת
  choice: sous
  rationale: Préposition spatiale directe et naturelle correspondant à תַּחַת.
- source_word: רַגְלָיו
  choice: ses pieds
  rationale: Le texte dit littéralement « ses pieds ». Cette formulation conserve l’image corporelle concrète plutôt que de la paraphraser.
theological_decisions:
- issue: Imagerie théophanique anthropomorphique appliquée à Dieu
  choice: 'Conserver littéralement les images spatiales et corporelles : « descendit » et « sous ses pieds ».'
  alternative: 'Atténuer l’anthropomorphisme, par exemple : « se manifesta depuis le ciel ».'
  rationale: L’hébreu décrit poétiquement une théophanie au moyen d’un langage spatial et corporel. La traduction maintient cette tension entre la transcendance divine et la représentation imagée de sa venue, sans l’expliquer ni la réduire.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé simple convient au registre narratif-poétique du cantique. Le parallélisme et l’imagerie cosmique de l’hébreu sont conservés sans lourdeur archaïsante.
