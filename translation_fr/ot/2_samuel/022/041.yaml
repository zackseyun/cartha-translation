  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: fr
  text: Tu as fait fuir mes ennemis devant moi[a] ; j’ai détruit ceux qui me haïssaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tu m’as donné la nuque (ou le dos) de mes ennemis » ; image d’ennemis qui tournent le dos et prennent la fuite devant le vainqueur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: אֹיֵב désigne couramment un ennemi, et le suffixe de première personne impose « mes ennemis ».
- source_word: תַּתָּה לִּי עֹרֶף
  choice: tu as fait tourner le dos à mes ennemis devant moi
  rationale: L’expression signifie littéralement que Dieu a « donné » à David la nuque ou le dos de ses ennemis, image de leur fuite ou de leur mise en déroute. La formulation française explicite naturellement cet idiome tout en conservant l’image du dos tourné.
- source_word: מְשַׂנְאַי
  choice: ceux qui me haïssaient
  rationale: Le participe substantivé avec suffixe désigne ceux qui éprouvaient de la haine envers le locuteur ; l’imparfait convient au cadre narratif passé.
- source_word: וָאַצְמִיתֵם
  choice: j’ai anéanti
  rationale: Le hiphil de צמת exprime ici le fait de détruire ou de supprimer entièrement. « Anéanti » rend la force du verbe dans un registre poétique et digne.
