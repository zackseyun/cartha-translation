  source_fidelity: Le premier membre exprime littéralement que Dieu donne au locuteur la « nuque / le dos » de ses ennemis, idiome de déroute ou de fuite. « Tu as fait tourner le dos à mes ennemis devant moi » n’est pas idiomatique en français et risque de suggérer une action des ennemis envers le locuteur plutôt que leur fuite. « Tu as fait fuir mes ennemis devant moi » rend clairement le sens contextuel. « J’ai détruit ceux qui me haïssaient » rend sobrement et fidèlement le hiphil de צמת.
  naturalness: La révision emploie un français moderne et fluide. « Faire tourner le dos à quelqu’un » est ambigu et peu naturel dans ce contexte, tandis que « faire fuir » est immédiatement compréhensible.
