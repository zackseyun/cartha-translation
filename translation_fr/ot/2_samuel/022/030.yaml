  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: fr
  text: Car, par toi je peux courir contre une troupe[a] ; par mon Dieu, je peux franchir une muraille d’un bond.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une bande de pillards ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Oui
  rationale: Dans ce chant, la particule renforce et confirme le témoignage précédent. « Oui » rend naturellement cette valeur assertive en poésie française, sans imposer un lien causal trop étroit.
- source_word: בְכָה
  choice: par toi
  rationale: La préposition ב peut exprimer ici le moyen ou l’accompagnement. « Par toi » met en avant l’action rendue possible par Dieu tout en conservant la concision du parallélisme.
- source_word: אָרוּץ
  choice: je peux courir contre
  rationale: L’imparfait hébreu peut exprimer ici une capacité acquise grâce à Dieu. « Courir contre » conserve l’élan de l’image militaire sans préciser indûment l’issue de l’assaut.
- source_word: גְּדוּד
  choice: une troupe
  rationale: גדוד désigne une troupe, une bande armée ou un groupe de pillards. « Troupe » est direct, actuel et suffisamment large.
- source_word: בֵּאלֹהַי
  choice: par mon Dieu
  rationale: La reprise de ב forme un parallélisme avec « par toi » et présente Dieu comme celui qui rend l’action possible. « Mon Dieu » garde la dimension personnelle du texte.
- source_word: אֲדַלֶּג
  choice: je peux franchir d’un bond
  rationale: Le piel de דלג évoque le fait de bondir ou de sauter. Cette formulation française naturelle conserve à la fois la capacité et le mouvement.
- source_word: שׁוּר
  choice: une muraille
  rationale: Dans ce contexte militaire, שׁוּר désigne vraisemblablement un mur défensif. « Muraille » restitue mieux cette image qu’un simple « mur ».
theological_decisions:
- issue: Action rendue possible par Dieu dans une image guerrière
  choice: « je peux courir… je peux franchir »
  alternative: « je cours… je franchis »
  rationale: Les formes verbales peuvent décrire l’action elle-même ou la capacité habituelle. La traduction retenue fait ressortir l’habilitation divine suggérée par « par toi / par mon Dieu », sans étendre l’affirmation au-delà de ce témoignage poétique.
- issue: Valeur de la préposition ב
  choice: 'moyen : « par toi / par mon Dieu »'
  alternative: 'accompagnement : « avec toi / avec mon Dieu »'
  rationale: Les deux valeurs sont possibles. Le parallélisme et l’accent porté sur ce que Dieu permet favorisent ici le moyen, sans nier la possibilité de l’accompagnement.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme « par toi / par mon Dieu » est maintenu. « Franchir une muraille d’un bond » évite une tournure lourde tout en préservant l’image vive du texte hébreu.
