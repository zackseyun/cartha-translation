  text: כִּ֥י כָל משפט/ו לְ/נֶגְדִּ֑/י וְ/חֻקֹּתָ֖י/ו לֹא אָס֥וּר מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: fr
  text: 'Car toutes ses décisions étaient devant moi,

    et je ne me suis pas détourné de ses prescriptions.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car toutes ses décisions étaient devant moi, et je ne me suis détourné d’aucune d’elles. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et conserve naturellement la valeur causale dans le mouvement poétique.
- source_word: כָל
  choice: toutes
  rationale: Conserve la portée exhaustive du quantificateur hébreu.
- source_word: מִשְׁפָּטָיו
  choice: ses décisions
  rationale: Le terme désigne des décisions de justice ou des règles établies. « Décisions » reste clair en français moderne et se distingue de « prescriptions » dans le parallélisme.
- source_word: לְנֶגְדִּי
  choice: étaient devant moi
  rationale: Préserve l’image hébraïque de ce qui demeure présent au regard ou à la conscience, sans l’expliciter excessivement.
- source_word: וְחֻקֹּתָיו
  choice: et ses prescriptions
  rationale: Le terme renvoie à des dispositions fixées. « Prescriptions » rend cette nuance légale et forme un parallélisme naturel avec « décisions ».
- source_word: לֹא אָסוּר
  choice: je ne me suis pas détourné
  rationale: Rend le verbe סוּר, « se détourner, s’écarter », dans un français actuel tout en conservant l’idée de déviation morale.
- source_word: מִמֶּנָּה
  choice: de ses prescriptions
  rationale: Le pronom hébreu féminin singulier a un référent formellement difficile après le pluriel חֻקֹּתָיו. La répétition explicite du groupe nominal donne une lecture naturelle sans masquer l’ambiguïté, signalée en note.
theological_decisions:
- issue: Rendre les différents termes relatifs à la loi de l’alliance sans effacer leur distinction
  choice: 'Conserver deux termes distincts : « décisions » et « prescriptions ».'
  alternative: Employer dans les deux membres un terme générique tel que « lois » ou « commandements ».
  rationale: L’hébreu emploie deux noms juridiques différents en parallèle. Les distinguer respecte la texture du texte sans imposer une catégorie théologique simplifiée.
- issue: Référent du pronom final מִמֶּנָּה
  choice: Le rapporter explicitement aux « prescriptions » dans le texte principal.
  alternative: Le rendre par « d’elles » ou comprendre plus largement « de toutes ces décisions et prescriptions ».
  rationale: La proximité favorise un renvoi aux prescriptions, mais la forme pronominale et la poésie permettent une compréhension collective plus large. La note préserve cette ouverture.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme juridique est maintenu sans vocabulaire inutilement archaïque. Le marqueur de note [a] figure dans le texte principal.
