  yaml_path: translation/ot/2_samuel/022/032.yaml
  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: fr
  text: Car qui est Dieu, sinon Yahweh ? Et qui est un rocher, sinon notre Dieu ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui est le Rocher, sinon notre Dieu ? » En hébreu, « rocher » est une métaphore fréquente et fonctionne parfois presque comme un titre donné à Dieu.'
    reason: 'Alternative lexicale : « le Rocher » traite le terme comme un quasi-titre, tandis que le texte principal conserve le nom commun métaphorique.'
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison ou le fondement de la louange qui précède ; « Car » en conserve clairement la fonction logique.
- source_word: מִי
  choice: qui
  rationale: Le pronom interrogatif ouvre deux questions rhétoriques parallèles.
- source_word: אֵל
  choice: Dieu
  rationale: Dans cette affirmation rhétorique d’exclusivité, le mot désigne le vrai Dieu plutôt qu’une divinité quelconque.
- source_word: מִבַּלְעֲדֵי
  choice: en dehors de
  rationale: 'Cette locution exprime l’exclusion : nul autre ne peut être Dieu ni rocher. « En dehors de » reste proche de la formulation hébraïque et naturel en français.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: צוּר
  choice: un rocher
  rationale: La traduction conserve la métaphore concrète de stabilité, de force et de protection, sans la remplacer par son interprétation.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Cette formulation rend directement le suffixe de première personne du pluriel et préserve la dimension communautaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement au lieu de le remplacer par un titre.
- issue: Statut de la métaphore צוּר
  choice: un rocher
  alternative: le Rocher
  rationale: La syntaxe permet de comprendre le mot comme un nom commun employé métaphoriquement. La minuscule évite d’imposer qu’il s’agisse ici d’un titre formel, tout en maintenant l’image théologique.
translation_notes:
  register: Français moderne, digne et direct. Les deux questions rhétoriques et leur parallélisme poétique sont conservés ; la métaphore du rocher n’est pas explicitée dans le corps du texte.
