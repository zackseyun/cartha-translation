source:
  edition: WLC
  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: fr
  text: Tu m’as délivré des querelles de mon peuple[a] ; tu me gardes à la tête des nations[b] ; un peuple que je ne connaissais pas me sert[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des conflits de mon peuple ». L’hébreu peut évoquer des dissensions au sein du peuple de David ou des conflits impliquant celui-ci.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu me préserves comme chef des nations ».
    reason: lexical_alternative
  - marker: c
    text: Ou « me servira ». Dans ce contexte poétique, la forme verbale hébraïque peut aussi recevoir une nuance future.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: Tu m’as délivré
  rationale: Le hifil de פלט exprime le fait de faire échapper ou de délivrer. Le passé composé convient au caractère rétrospectif du chant et « délivré » garde la portée du secours divin.
- source_word: מֵרִיבֵי עַמִּי
  choice: des querelles de mon peuple
  rationale: 'רִיב peut désigner querelle, conflit ou contestation. Le génitif hébreu reste ouvert : il peut s’agir de dissensions internes au peuple de David ou de conflits impliquant celui-ci.'
- source_word: תִּשְׁמְרֵנִי
  choice: tu m’as maintenu
  rationale: שׁמר signifie garder, préserver ou maintenir. Dans ce contexte royal, « maintenir » exprime naturellement la protection durable de David dans sa fonction sans effacer l’idée de conservation.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: à la tête des nations
  rationale: רֹאשׁ est employé métaphoriquement pour la position de chef. Cette formulation française conserve l’image de la tête tout en indiquant clairement une autorité royale.
- source_word: גּוֹיִם
  choice: nations
  rationale: Dans ce contexte royal, גּוֹיִם désigne des nations ou peuples autres qu’Israël. « Nations » est précis et n’importe pas les connotations plus tardives de « païens ».
- source_word: עַם לֹא יָדַעְתִּי
  choice: un peuple que je ne connaissais pas
  rationale: Le singulier collectif עַם est indéfini, et ידע exprime ici une connaissance ou une relation préalable. L’imparfait français présente naturellement l’état antérieur.
- source_word: יַעַבְדֻנִי
  choice: me servait
  rationale: עבד peut exprimer le service et, dans un cadre royal, la sujétion politique. L’imparfait français convient à une situation résultante ou durable et préserve le vocabulaire du service.
theological_decisions:
- issue: La domination royale sur des nations étrangères
  choice: Conserver le sens historique et royal dans le texte principal.
  alternative: Expliciter une lecture directement messianique.
  rationale: Le contexte immédiat est le chant de délivrance et de royauté de David. Une portée typologique ou messianique peut être reconnue dans une lecture canonique plus large, mais elle ne doit pas être introduite dans la traduction du verset.
- issue: Valeur temporelle des imparfaits hébreux
  choice: Employer un cadre passé et rétrospectif, avec « me servait » pour l’action durable.
  alternative: 'Traduire le dernier verbe au futur : « me servira ».'
  rationale: Dans ce poème rétrospectif, l’imparfait hébreu peut décrire une réalité habituelle ou résultante passée, mais une nuance future demeure grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au discours direct adressé à Dieu. La formulation conserve l’image royale de « la tête des nations » et laisse en note les principales ambiguïtés lexicales et temporelles.
