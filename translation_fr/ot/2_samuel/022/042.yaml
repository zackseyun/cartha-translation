    rationale: « Personne ne les a sauvés » est compatible avec le contexte, mais l’hébreu exprime plus littéralement qu’il n’y avait aucun sauveur / personne pour sauver. Une formulation existentielle conserve mieux cette nuance.
  - severity: low
    issue: Préposition avec l’appel à Yahvé
    rationale: Pour un appel adressé à une personne, « crier à Yahvé » est plus idiomatique en français moderne que « crier vers Yahvé », tout en rendant adéquatement אֶל.
  - severity: low
    issue: Formulation de l’alternative en note
    rationale: L’analyse de יִשְׁעוּ est effectivement discutée, mais « regarder autour d’eux » dépasse ce que l’alternative exige. « Ils ont cherché du secours » signale l’autre orientation de sens avec davantage de retenue.
  revised_text: Ils ont crié au secours[a], mais il n’y avait personne pour les sauver ; ils ont crié à Yahvé, mais il ne leur a pas répondu.
