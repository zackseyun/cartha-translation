  text: יִשְׁע֖וּ וְ/אֵ֣ין מֹשִׁ֑יעַ אֶל יְהוָ֖ה וְ/לֹ֥א עָנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: fr
  text: Ils ont crié au secours[a], mais il n’y avait personne pour les sauver ; ils ont crié à Yahvé, mais il ne leur a pas répondu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils ont cherché du secours. » Le sens précis du verbe hébreu est discuté.'
    reason: ambiguïté lexicale
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: Ils ont crié au secours
  rationale: Dans ce contexte de défaite et en parallèle avec מֹשִׁיעַ (« quelqu’un qui sauve »), le verbe exprime un appel désespéré à l’aide. Cette formulation est naturelle en français tout en signalant en note l’autre analyse lexicale possible.
- source_word: וְאֵין מֹשִׁיעַ
  choice: mais personne ne les a sauvés
  rationale: La construction indique l’absence de quiconque pouvant apporter le salut. Le passé composé s’intègre naturellement au récit poétique français, et « mais » rend la portée adversative du waw.
- source_word: אֶל יְהוָה
  choice: vers Yahvé
  rationale: La préposition אֶל marque la direction de l’appel. « Yahvé » est la forme française courante du nom divin יהוה et conserve sa valeur de nom propre.
- source_word: וְלֹא עָנָם
  choice: mais il ne leur a pas répondu
  rationale: Le verbe ענה signifie ici « répondre » ; son sujet implicite est Yahvé, et le suffixe masculin pluriel est rendu par « leur ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre par le nom propre « Yahvé » préserve cette référence particulière sans la remplacer par un titre.
- issue: Absence de réponse divine
  choice: mais il ne leur a pas répondu
  alternative: mais aucune réponse ne leur est venue
  rationale: 'La formulation conserve l’affirmation directe et difficile du texte : Yahvé est bien le sujet implicite du verbe et ne répond pas aux ennemis vaincus.'
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est rendu explicite par la répétition de « ils ont crié », sous-entendue dans le second membre hébreu. La ponctuation avec point-virgule conserve l’équilibre poétique des deux appels sans réponse.
