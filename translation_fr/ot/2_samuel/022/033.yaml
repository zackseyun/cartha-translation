source:
  edition: WLC
  text: הָ/אֵ֥ל מָעוּזִּ֖/י חָ֑יִל וַ/יַּתֵּ֥ר תָּמִ֖ים דרכ/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: fr
  text: Dieu est mon puissant refuge, et il rend ma voie parfaite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en suivant plus littéralement la forme consonantique : « et il rend sa voie parfaite ». Le passage parallèle de Psaume 18.33 appuie « ma voie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: Dieu
  rationale: L’article défini accompagne ici אֵל employé comme désignation de Dieu. En français courant, « Dieu » est plus naturel que le calque « le Dieu ».
- source_word: מָעוּזִּי חָיִל
  choice: mon puissant refuge
  rationale: מָעוֹז désigne un lieu ou une source de protection, tandis que חָיִל exprime ici la force ou la puissance. « Mon puissant refuge » conserve ces deux nuances sans imposer l’image militaire plus précise d’une forteresse.
- source_word: וַיַּתֵּר
  choice: il rend
  rationale: Le sens du verbe יתר dans cette construction est difficile. En lien avec תָּמִים et avec le parallèle de Psaume 18.33, « il rend » exprime naturellement l’idée que Dieu établit ou dispose la voie dans son intégrité.
- source_word: תָּמִים
  choice: irréprochable
  rationale: Le terme évoque l’intégrité, la plénitude ou ce qui est sans défaut. « Irréprochable » convient au contexte moral et évite que « parfaite » soit compris comme une perfection absolue.
- source_word: דרכו
  choice: ma voie
  rationale: La forme consonantique peut se comprendre comme « sa voie », mais le parallèle de Psaume 18.33 soutient « ma voie », qui s’accorde aussi avec la perspective personnelle du chant. L’autre lecture est conservée en note.
theological_decisions:
- issue: Référent du suffixe pronominal dans le dernier mot
  choice: 'Dieu rend irréprochable la voie du psalmiste : « ma voie ».'
  alternative: 'Dieu rend sa propre voie irréprochable : « sa voie ».'
  rationale: Le texte consonantique de Samuel permet plus littéralement « sa voie », tandis que le passage parallèle de Psaume 18.33 appuie « ma voie ». La traduction suit ce parallèle sans effacer l’ambiguïté textuelle, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et poétique; « puissant refuge » maintient à la fois les idées de protection et de force.
