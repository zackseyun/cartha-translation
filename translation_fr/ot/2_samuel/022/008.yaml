  yaml_path: translation/ot/2_samuel/022/008.yaml
  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: fr
  text: Alors la terre s’ébranla et trembla ; les fondations des cieux frémirent et furent ébranlées, car il était en colère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ הָאָרֶץ
  choice: la terre fut secouée et trembla
  rationale: Le verbe רָעַשׁ évoque une violente agitation ou un tremblement. La formulation française rend l’intensité du couple verbal hébreu sans introduire l’image plus particulière de « chanceler ».
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: les fondations du ciel
  rationale: Traduction directe de l’image cosmique. Le singulier collectif « ciel » est naturel en français moderne, tandis que l’hébreu emploie la forme plurielle שָׁמַיִם.
- source_word: יִרְגָּזוּ וַיִּתְגָּעֲשׁוּ
  choice: frémirent et furent ébranlées
  rationale: רָגַז exprime ici le tremblement, et la forme réfléchie/intensive de גָּעַשׁ une forte agitation. Le parallélisme et les deux verbes distincts sont conservés.
- source_word: כִּי חָרָה לוֹ
  choice: parce qu’il était en colère
  rationale: L’expression idiomatique signifie littéralement que la colère « brûlait » en lui. La traduction française courante exprime clairement la cause tout en conservant la référence pronominale du texte.
theological_decisions:
- issue: Description anthropopathique de la colère divine
  choice: parce qu’il était en colère
  alternative: parce que sa colère s’était enflammée
  rationale: La formulation directe préserve l’affirmation du texte sans l’atténuer ni développer une interprétation doctrinale. L’alternative, plus littérale, risquerait de paraître artificielle en français courant.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme du vers hébreu est maintenu, avec un vocabulaire accessible et une imagerie cosmique conservée.
