  text: עָלָ֤ה עָשָׁן֙ בְּ/אַפּ֔/וֹ וְ/אֵ֥שׁ מִ/פִּ֖י/ו תֹּאכֵ֑ל גֶּחָלִ֖ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: fr
  text: De la fumée monta de ses narines[a], et de sa bouche sortit un feu dévorant ; des braises s’embrasèrent, issues de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son nez » ; le mot hébreu traduit par « narines » peut aussi désigner, par extension idiomatique, la colère.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: De la fumée monta
  rationale: Le verbe exprime un mouvement ascendant. « Monta » restitue directement cette image dans un français naturel et poétique.
- source_word: בְּאַפּוֹ
  choice: de ses narines
  rationale: אַף peut désigner le nez ou la narine et, par extension idiomatique, la colère. Ici, le parallélisme avec « de sa bouche » favorise l’image corporelle concrète ; la préposition est rendue par « de » pour indiquer la provenance de la fumée.
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: et de sa bouche sortit un feu dévorant
  rationale: La formulation conserve la provenance du feu et rend l’action de תֹּאכֵל (« dévorer, consumer ») par l’adjectif verbal naturel « dévorant ». « Sortit » est explicité en français à partir du parallélisme et de la notion de provenance portée par מִן.
- source_word: גֶּחָלִים
  choice: des braises
  rationale: « Braises » est le terme français courant pour des charbons ardents et convient à l’imagerie poétique du verset.
- source_word: בָּעֲרוּ מִמֶּנּוּ
  choice: jaillirent de lui
  rationale: בָּעַר décrit le fait de brûler ou de s’embraser. Dans ce contexte d’émission ardente, « jaillirent » donne une expression française vive à l’image, tandis que « de lui » maintient explicitement la source indiquée par מִמֶּנּוּ.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu dans la théophanie
  choice: Conserver littéralement les images des « narines », de la « bouche », de la fumée et du feu sortant de lui.
  alternative: Comprendre אַף uniquement au sens abstrait de « colère » et atténuer l’imagerie corporelle.
  rationale: Le texte poétique représente la colère et la puissance divines au moyen d’une théophanie anthropomorphique. Garder cette image respecte le parallélisme hébreu et évite de résoudre silencieusement la tension entre le sens concret « nez/narine » et le sens idiomatique « colère ».
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le rythme poétique est préservé par trois images successives et par des verbes vifs. Le point-virgule distingue le dernier membre tout en maintenant le parallélisme.
