  text: עִם חָסִ֖יד תִּתְחַסָּ֑ד עִם גִּבּ֥וֹר תָּמִ֖ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: fr
  text: Avec celui qui est fidèle, tu te montres fidèle ; avec le guerrier intègre, tu te montres intègre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד
  choice: celui qui est fidèle
  rationale: Le terme désigne ici une personne loyale et attachée à l’alliance. « Fidèle » conserve le lien lexical avec la manière dont Dieu se montre envers elle, sans imposer le sens plus étroit de « pieux ».
- source_word: גִּבּוֹר
  choice: guerrier
  rationale: Dans ce cantique guerrier, גִּבּוֹר évoque naturellement un homme vaillant ou un combattant. « Guerrier » est idiomatique et rend mieux le contexte que le simple « homme fort ».
- source_word: תָּמִים
  choice: intègre
  rationale: Le mot exprime l’intégrité, la conduite entière et sans reproche plutôt qu’une perfection absolue.
- source_word: תִּתְחַסָּד / תִּתַּמָּם
  choice: tu te montres fidèle / tu te montres intègre
  rationale: Les formes verbales réfléchies reprennent les qualités des personnes mentionnées. « Tu te montres » restitue ce parallélisme et évite de réduire l’énoncé à une simple action ponctuelle.
theological_decisions:
- issue: Relation entre la conduite humaine et la manière dont Dieu se manifeste
  choice: 'Conserver le parallélisme direct : « Avec celui qui est fidèle… avec le guerrier intègre… »'
  alternative: Expliciter une récompense divine ou une causalité morale
  rationale: L’hébreu affirme une correspondance sans en préciser ici le mécanisme. La traduction ne doit pas transformer cette tension poétique en doctrine explicitée.
translation_notes:
  register: Français moderne, digne et poétique. La répétition « fidèle/fidèle » et « intègre/intègre » reproduit volontairement les jeux de racines de l’hébreu.
