  text: יִשְׁלַ֥ח מִ/מָּר֖וֹם יִקָּחֵ֑/נִי יַֽמְשֵׁ֖/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/017.yaml
  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: fr
  text: D’en haut, il tend la main[a], il me saisit, il me tire des eaux nombreuses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il envoie » ou « il étend » d’en haut ; l’objet du verbe n’est pas exprimé en hébreu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de grandes eaux » ou « d’eaux puissantes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: il tend la main
  rationale: Le verbe signifie littéralement « envoyer » et peut aussi exprimer l’idée d’étendre quelque chose. Comme aucun complément n’est exprimé en hébreu, « il tend la main » restitue naturellement en français le geste de secours implicite, sans remplacer l’image par une simple explication.
- source_word: מִמָּרוֹם
  choice: d’en haut
  rationale: Cette expression conserve la hauteur spatiale et le registre poétique de מָרוֹם sans préciser « du ciel », terme plus explicite que l’hébreu.
- source_word: יִקָּחֵנִי
  choice: il me saisit
  rationale: לקח signifie couramment « prendre ». Dans cette scène de sauvetage, « saisir » rend le mouvement concret et s’enchaîne naturellement avec la main tendue.
- source_word: יַמְשֵׁנִי
  choice: il me retire
  rationale: La forme causative de משה désigne ici l’action de tirer quelqu’un hors de l’eau. « Retirer » exprime clairement ce sauvetage en français courant.
- source_word: מִמַּיִם רַבִּים
  choice: des eaux immenses
  rationale: Littéralement « de nombreuses/grandes eaux ». « Eaux immenses » préserve l’ampleur menaçante et la force poétique de l’image dans un français naturel.
theological_decisions:
- issue: Image du secours divin venant d’en haut
  choice: Conserver « d’en haut »
  alternative: « du ciel »
  rationale: Le texte présente une intervention divine venue des hauteurs, mais n’emploie pas explicitement le mot « ciel ». La traduction maintient cette indétermination poétique.
- issue: Complément implicite du verbe יִשְׁלַח
  choice: Expliciter idiomatiquement « la main »
  alternative: « il envoie » ou « il étend » sans complément
  rationale: L’hébreu laisse l’objet du verbe inexprimé. En français, « il tend la main » rend intelligible le geste de sauvetage sans imposer une précision doctrinale ; une note signale la formulation plus littérale.
translation_notes:
  register: Français moderne, poétique et digne. La coordination reste brève pour reproduire la succession rapide des gestes de secours. « D’en haut » évite une précision cosmologique absente du texte, tandis que « eaux immenses » conserve l’ampleur de l’image hébraïque.
