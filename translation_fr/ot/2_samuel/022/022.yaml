  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: fr
  text: Car j’ai gardé les voies de Yahweh et je ne me suis pas détourné de mon Dieu par méchanceté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je n’ai pas été infidèle à mon Dieu ».'
    reason: La construction hébraïque associe l’idée d’agir méchamment à l’éloignement d’avec Dieu. Cette formulation exprime de façon plus globale la portée relationnelle de l’ensemble.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et convient au mouvement explicatif du poème.
- source_word: שָׁמַרְתִּי
  choice: j’ai gardé
  rationale: Conserve le sens fondamental de « garder, observer » ainsi que l’aspect accompli du verbe hébreu.
- source_word: דַּרְכֵי
  choice: les voies
  rationale: Maintient la métaphore hébraïque traditionnelle des chemins comme manière de vivre ou conduite prescrite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: רָשַׁעְתִּי
  choice: je n’ai pas agi avec méchanceté
  rationale: Rend directement le sens moral du verbe רשע, « agir en méchant, agir avec méchanceté ».
- source_word: מֵאֱלֹהָי
  choice: en me détournant de mon Dieu
  rationale: La préposition מִן exprime normalement l’éloignement ou la séparation; la formulation française relie naturellement cette idée au verbe de conduite mauvaise, sans effacer sa dimension relationnelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Sens de רָשַׁעְתִּי מֵאֱלֹהָי
  choice: je n’ai pas agi avec méchanceté en me détournant de mon Dieu
  alternative: je n’ai pas été infidèle à mon Dieu
  rationale: La traduction principale garde à la fois la notion de conduite mauvaise portée par רשע et celle d’éloignement suggérée par מִן. La note signale une formulation plus idiomatique qui comprend l’ensemble comme une infidélité envers Dieu.
translation_notes:
  register: Français international moderne, poétique et digne. « Gardé les voies » conserve l’image hébraïque tout en restant intelligible; la seconde proposition explicite avec mesure une construction hébraïque difficile.
