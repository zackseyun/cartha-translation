- from: Car j’ai gardé les voies de Yahweh et je n’ai pas agi avec méchanceté en me détournant de mon Dieu.[a]
  to: Car j’ai gardé les voies de Yahweh et je ne me suis pas détourné de mon Dieu par méchanceté.[a]
  rationale: Révision limitée du second membre afin de conserver explicitement l’éloignement « de mon Dieu » et la qualification morale portée par רשע, dans une syntaxe française plus naturelle. La note conserve une alternative interprétative sans l’imposer au texte principal.
