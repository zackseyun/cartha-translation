  variant: modern international French
source:
  edition: WLC
  text: אֱלֹהֵ֥י צוּרִ֖/י אֶחֱסֶה בּ֑/וֹ מָגִנִּ֞/י וְ/קֶ֣רֶן יִשְׁעִ֗/י מִשְׂגַּבִּ/י֙ וּ/מְנוּסִ֔/י מֹשִׁעִ֕/י מֵ/חָמָ֖ס תֹּשִׁעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: fr
  text: mon Dieu[a], mon rocher, en qui je me réfugie, mon bouclier et la corne de mon salut[b], ma forteresse et mon refuge, mon sauveur[c] — tu me sauves de la violence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu de mon rocher » ; la construction hébraïque peut se traduire plus littéralement ainsi, mais « mon Dieu, mon rocher » convient mieux à la suite poétique de titres.
    reason: lexical_alternative
  - marker: b
    text: Dans la poésie hébraïque, la « corne » représente la force et la puissance victorieuse.
    reason: cultural_note
  - marker: c
    text: Ou « mon libérateur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: mon Dieu, mon rocher
  rationale: La forme construite אֱלֹהֵי devant צוּרִי permet une traduction littérale « Dieu de mon rocher », mais l’apposition « mon Dieu, mon rocher » rend naturellement en français la suite poétique des titres divins tout en signalant l’autre analyse en note.
- source_word: אֶחֱסֶה בּוֹ
  choice: en qui je me réfugie
  rationale: Le verbe חסה exprime l’action de chercher refuge. La relative française conserve la préposition et s’intègre à la chaîne d’appositions.
- source_word: מָגִנִּי
  choice: mon bouclier
  rationale: Traduction directe qui préserve l’image concrète de la protection.
- source_word: קֶרֶן יִשְׁעִי
  choice: la corne de mon salut
  rationale: La traduction conserve à la fois l’image hébraïque de la corne, symbole de force et de puissance victorieuse, et la relation construite avec « mon salut ».
- source_word: מִשְׂגַּבִּי
  choice: ma forteresse
  rationale: Le terme désigne un lieu élevé et sûr. « Forteresse » exprime clairement la sécurité défensive dans un français actuel.
- source_word: וּמְנוּסִי
  choice: mon refuge
  rationale: Le nom évoque le lieu vers lequel on fuit pour être en sécurité ; « refuge » est concis et fidèle.
- source_word: מֹשִׁעִי
  choice: mon sauveur
  rationale: Le participe substantivé de ישׁע désigne celui qui sauve ou délivre. « Sauveur » correspond directement à la reprise verbale « tu me sauves ».
- source_word: מֵחָמָס
  choice: de la violence
  rationale: חָמָס désigne la violence ou l’injustice violente. La traduction garde le nom abstrait sans introduire des agresseurs qui ne sont pas explicitement mentionnés.
- source_word: תֹּשִׁעֵנִי
  choice: tu me sauves
  rationale: La deuxième personne masculine singulière avec suffixe objet de première personne marque une adresse directe à Dieu. Le présent français convient à l’énoncé poétique sans préciser excessivement l’aspect verbal.
theological_decisions:
- issue: Accumulation de titres métaphoriques appliqués à Dieu
  choice: 'Conserver les images concrètes : « rocher », « bouclier », « corne », « forteresse » et « refuge ».'
  alternative: Les remplacer par des notions explicatives telles que « protecteur » ou « source de puissance ».
  rationale: L’accumulation d’images protectrices et guerrières constitue la texture poétique et théologique du verset ; les expliciter dans le corps du texte en réduirait la force.
- issue: Sens de מֹשִׁעִי
  choice: mon sauveur
  alternative: mon libérateur
  rationale: Les deux sens sont possibles, mais « sauveur » est lexicalement fidèle et fait écho au verbe תֹּשִׁיעֵנִי, sans ajouter au passage une doctrine ultérieure.
- issue: Relation entre אֱלֹהֵי et צוּרִי
  choice: 'Lire les expressions comme deux titres en apposition : « mon Dieu, mon rocher ».'
  alternative: 'Suivre strictement la forme construite : « Dieu de mon rocher ».'
  rationale: L’apposition s’accorde mieux avec la série de titres et produit un français intelligible, tandis que la possibilité formelle de l’autre lecture est préservée en note.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe conserve l’accumulation solennelle des titres tout en restant naturelle. Les métaphores hébraïques sont maintenues, et les variantes significatives sont indiquées sans alourdir le texte.
