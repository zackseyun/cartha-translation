  text: כִּֽי אַתָּ֥ה נֵירִ֖/י יְהוָ֑ה וַ/יהוָ֖ה יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: fr
  text: Car tu es ma lampe[a], Yahweh, et Yahweh éclaire mes ténèbres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma lumière ». L’hébreu dit littéralement « ma lampe » et emploie une image concrète.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication ou le fondement de ce qui précède. « Car » conserve cette relation sans la réduire à une affirmation purement emphatique.
- source_word: אַתָּה
  choice: tu
  rationale: Le pronom masculin singulier s’adresse directement à Dieu ; le tutoiement convient à l’adresse biblique en français actuel.
- source_word: נֵירִי
  choice: ma lampe
  rationale: נֵיר désigne concrètement une lampe. Cette traduction préserve l’image poétique de Dieu comme source de lumière, plutôt que de l’abstraire en « ma lumière ».
- source_word: יְהוָה / וַיהוָה
  choice: Yahweh / et Yahweh
  rationale: Le nom divin est translittéré et répété dans les deux propositions, conformément à l’hébreu, plutôt que remplacé par un titre ou un pronom.
- source_word: יַגִּיהַּ
  choice: éclaire
  rationale: La forme causative de נגה exprime le fait de faire briller ou de donner de la lumière. « Éclaire » est naturel, digne et conserve ce sens causatif dans le contexte.
- source_word: חָשְׁכִּי
  choice: mes ténèbres
  rationale: Le nom avec suffixe de première personne signifie littéralement « mes ténèbres ». Cette expression préserve la portée personnelle et métaphorique sans préciser indûment s’il s’agit de détresse, de danger ou de tristesse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel et évite de lui substituer un titre ; sa répétition respecte également le parallélisme hébreu.
- issue: Nature de l’image appliquée à Dieu
  choice: « tu es ma lampe »
  alternative: « tu es ma lumière »
  rationale: Le texte identifie directement Yahweh à la lampe. Garder l’objet concret préserve la force de la métaphore sans la reformuler en notion abstraite.
translation_notes:
  register: Français international moderne, poétique et sobre. La structure parallèle et la répétition du nom divin sont conservées. « Mes ténèbres » garde l’image personnelle du texte sans en imposer une interprétation particulière.
