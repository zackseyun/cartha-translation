  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: fr
  text: Tu élargis l’espace sous mes pas[a], et mes chevilles n’ont pas vacillé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tu élargis mes pas sous moi. » L’expression hébraïque évoque un espace suffisant pour avancer et un appui assuré.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mes chevilles n’ont pas glissé » ou « n’ont pas fléchi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: Tu donnes de l’aisance
  rationale: Le hiphil de רחב exprime l’action de rendre large ou spacieux. Cette formulation française naturelle restitue ici l’idée d’une liberté de mouvement et d’un appui assuré, sans effacer l’image hébraïque, précisée en note.
- source_word: צַעֲדַי תַּחְתֵּנִי
  choice: à mes pas
  rationale: צַעֲדַי désigne les pas ou les enjambées, et תַּחְתֵּנִי signifie littéralement « sous moi ». L’expression hébraïque évoque l’espace donné aux pas et la sûreté de l’appui. Une traduction mot à mot serait obscure en français; la note la conserve.
- source_word: וְלֹא
  choice: et … ne … pas
  rationale: La coordination simple respecte le parallélisme hébraïque sans transformer explicitement le second membre en conséquence ou en but.
- source_word: מָעֲדוּ
  choice: n’ont pas vacillé
  rationale: Le verbe מעד peut signifier glisser, chanceler ou perdre son appui. « Vaciller » convient au sujet anatomique et maintient l’image de stabilité.
- source_word: קַרְסֻלָּי
  choice: mes chevilles
  rationale: Le nom désigne précisément les chevilles ou leur articulation; cette traduction conserve l’image corporelle plus exactement que « mes pieds ».
