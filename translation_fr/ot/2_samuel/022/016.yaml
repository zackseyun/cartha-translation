  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: fr
  text: 'Alors apparurent les chenaux de la mer,

    les fondations du monde furent mises à nu,

    à la réprimande de Yahweh,

    au souffle impétueux de ses narines.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: apparurent
  rationale: Le niphal de ראה peut exprimer l’entrée dans le champ de la vue. « Apparurent » rend naturellement la soudaine visibilité des chenaux tout en conservant l’image poétique.
- source_word: אֲפִקֵי יָם
  choice: les chenaux de la mer
  rationale: אֲפִיקִים désigne des chenaux, lits ou cours d’eau. « Chenaux de la mer » conserve le sens spatial sans préciser indûment qu’il s’agit de sources.
- source_word: יִגָּלוּ
  choice: furent mises à nu
  rationale: Le niphal de גלה signifie être découvert ou dévoilé. « Furent mises à nu » restitue avec force le parallélisme poétique.
- source_word: מֹסְדוֹת תֵּבֵל
  choice: les fondations du monde
  rationale: מֹסְדוֹת signifie « fondations » et תֵּבֵל désigne poétiquement le monde, parfois plus précisément le monde habité. La formulation retenue garde la portée cosmique.
- source_word: בְּגַעֲרַת
  choice: sous la réprimande de
  rationale: גְּעָרָה désigne une réprimande ou semonce efficace. « Sous la réprimande de » exprime ici la cause de la convulsion cosmique dans un français digne et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: par le souffle impétueux sortant de ses narines
  rationale: נִשְׁמַת et רוּחַ forment une expression de souffle puissant; אַפּוֹ évoque littéralement ses narines, avec une possible connotation de colère. La traduction préserve l’anthropomorphisme sans réduire l’image à l’abstraction « colère ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement et évite de remplacer silencieusement le nom par un titre.
- issue: Sens de אַף dans l’image finale
  choice: ses narines
  alternative: sa colère
  rationale: אַף peut désigner le nez ou la colère. Avec le souffle qui en sort, le sens corporel « narines » soutient l’image immédiate, tandis que la connotation de colère demeure perceptible dans le contexte de la réprimande divine.
translation_notes:
  register: Poésie élevée mais accessible, disposée en quatre lignes pour faire ressortir le parallélisme. « Chenaux » est précis sans être archaïque; « souffle impétueux » évite la lourdeur d’un calque tel que « souffle du vent » tout en maintenant la violence de la théophanie.
