  text: וַ/יָּבֹ֣א כָל הָ/עָ֗ם לְ/הַבְר֧וֹת אֶת דָּוִ֛ד לֶ֖חֶם בְּ/ע֣וֹד הַ/יּ֑וֹם וַ/יִּשָּׁבַ֨ע דָּוִ֜ד לֵ/אמֹ֗ר כֹּ֣ה יַעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י אִם לִ/פְנֵ֧י בֽוֹא הַ/שֶּׁ֛מֶשׁ אֶטְעַם לֶ֖חֶם א֥וֹ כָל מְאֽוּמָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: fr
  text: 'Alors tout le peuple vint presser David de manger pendant qu’il faisait encore jour. David fit ce serment : « Que Dieu me fasse ceci, et qu’il y ajoute encore[a], si, avant le coucher du soleil, je goûte du pain ou quoi que ce soit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une formule conventionnelle d’auto-malédiction, littéralement : « Que Dieu me fasse ainsi et qu’il ajoute encore ainsi. » Le malheur invoqué n’est pas précisé.'
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: presser David de manger
  rationale: Le hiphil de ברה désigne ici le fait d’amener quelqu’un à prendre de la nourriture, vraisemblablement dans le contexte du deuil. Cette formulation française exprime naturellement l’insistance du peuple.
- source_word: לֶחֶם
  choice: du pain
  rationale: Le terme peut désigner plus largement la nourriture, mais « pain » conserve l’image concrète de l’hébreu. Dans la bouche de David, la suite « ou quoi que ce soit » en élargit explicitement la portée.
- source_word: בְּעוֹד הַיּוֹם
  choice: pendant qu’il faisait encore jour
  rationale: La formule indique que la journée n’était pas achevée et prépare la mention du coucher du soleil.
- source_word: וַיִּשָּׁבַע ... לֵאמֹר
  choice: fit ce serment
  rationale: Rend clairement et dignement l’acte solennel introduisant les paroles de David.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: Que Dieu me traite avec la plus grande sévérité
  rationale: Il s’agit d’une formule conventionnelle d’auto-malédiction dont le châtiment précis reste inexprimé. Cette tournure française en communique la force sans inventer de peine déterminée; une note signale le caractère elliptique de l’hébreu.
- source_word: כִּי אִם
  choice: si
  rationale: Dans cette formule de serment, la locution introduit la condition qui déclencherait l’auto-malédiction.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: avant le coucher du soleil
  rationale: Rend idiomatiquement l’expression hébraïque désignant le moment où le soleil se couche.
- source_word: אֶטְעַם
  choice: je goûte
  rationale: Le sens littéral « goûter » souligne que David refuse d’absorber même une quantité minime.
- source_word: אוֹ כָל מְאוּמָה
  choice: ou quoi que ce soit
  rationale: Cette expression française restitue l’extension emphatique de l’interdiction à toute nourriture ou autre chose consommable.
theological_decisions:
- issue: Formule d’auto-malédiction dans le serment
  choice: Que Dieu me traite avec la plus grande sévérité
  alternative: Que Dieu me fasse ceci et qu’il y ajoute encore cela
  rationale: Le français naturel exige d’expliciter la valeur menaçante de la formule, mais le texte ne précise pas le châtiment. La traduction conserve donc cette indétermination et l’explique en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Presser David de manger » évite le tour peu idiomatique « lui faire manger du pain », tandis que « du pain » est conservé dans le serment pour respecter le terme concret de l’hébreu. La ponctuation exclamative rend la solennité énergique du vœu.
