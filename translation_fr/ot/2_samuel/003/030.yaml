base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: fr
  text: Ainsi, Joab et son frère Abishaï tuèrent Abner parce qu’il avait tué leur frère Asaël à Gabaon, au cours de la bataille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et Joab et son frère Abishaï tuèrent Abner. » La conjonction hébraïque peut se traduire simplement par « et » ; « ainsi » met en valeur le lien explicatif avec le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ / וַ
  choice: Ainsi
  rationale: La conjonction relie ce verset au récit précédent et introduit ici une explication récapitulative. « Ainsi » rend naturellement cette valeur contextuelle, tandis que « et » reste possible.
- source_word: הָרְגוּ
  choice: tuèrent
  rationale: Le verbe הרג désigne simplement l’action de tuer. « Tuèrent » convient au registre narratif et évite « assassinèrent », qui imposerait une qualification juridique ou morale plus précise que le terme hébreu.
- source_word: לְאַבְנֵר
  choice: Abner
  rationale: 'Après הרג, la préposition ל marque ici la personne atteinte par l’action. Le français naturel emploie un complément d’objet direct : « tuèrent Abner ».'
- source_word: עַל אֲשֶׁר
  choice: parce que
  rationale: Cette expression introduit le motif de l’acte. « Parce que » en donne un équivalent français clair et idiomatique.
- source_word: הֵמִית
  choice: avait fait mourir
  rationale: Le hiphil de מות exprime le fait de causer la mort. Le plus-que-parfait marque l’antériorité de la mort d’Asaël par rapport à celle d’Abner, et « fait mourir » préserve la nuance causative sans ajouter de jugement juridique.
- source_word: אָחִיו / אֲחִיהֶם
  choice: son frère / leur frère
  rationale: Le premier suffixe présente Abishaï comme le frère de Joab ; le second présente Asaël comme le frère de Joab et d’Abishaï. Ces liens familiaux, essentiels au motif indiqué, sont explicitement conservés.
- source_word: בְּגִבְעוֹן
  choice: à Gabaon
  rationale: « À » est la préposition française naturelle pour situer l’événement à Gabaon ; la forme traditionnelle française du toponyme est conservée.
- source_word: בַּמִּלְחָמָה
  choice: au cours de la bataille
  rationale: L’article hébreu renvoie à la bataille précise déjà racontée. « Au cours de la bataille » conserve cette détermination et exprime clairement la circonstance temporelle.
theological_decisions:
- issue: Qualification morale de la mort d’Abner
  choice: « tuèrent »
  alternative: « assassinèrent »
  rationale: Bien que le contexte puisse conduire à juger l’acte, le verbe hébreu employé dans ce verset signifie tuer sans porter à lui seul la qualification plus précise d’assassinat. La traduction ne tranche donc pas au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme lexical. La formulation « Joab et son frère Abishaï » rend naturellement la relation exprimée par l’hébreu.
