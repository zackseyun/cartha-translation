  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: fr
  text: 'Abner dit à David : « Je vais me mettre en route et rassembler tout Israël auprès de mon seigneur le roi, afin qu’ils concluent une alliance avec toi[a], et tu régneras sur tout ce que tu désires[b]. » David laissa partir Abner, et celui-ci s’en alla en paix[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « coupent une alliance avec toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur tout ce que désire ton âme ».'
    reason: lexical_alternative
  - marker: c
    text: « S’en aller en paix » indique ici un départ sans violence, en sécurité et en bons termes.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: Je vais me mettre en route
  rationale: Les cohortatifs expriment la résolution d’Abner. Cette formulation française rend naturellement l’enchaînement littéral « je me lèverai et j’irai » sans en perdre l’élan.
- source_word: וְאֶקְבְּצָה
  choice: et rassembler
  rationale: Le verbe קבץ désigne ici le rassemblement politique de l’ensemble des tribus auprès de David.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: auprès de mon seigneur le roi
  rationale: La préposition marque la direction du rassemblement vers David, tandis que « mon seigneur le roi » conserve la déférence de l’adresse royale.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: afin qu’ils concluent une alliance avec toi
  rationale: « Conclure une alliance » est l’équivalent français courant de l’expression hébraïque כרת ברית, littéralement « couper une alliance ». Le lien final avec le rassemblement est rendu par « afin que ».
- source_word: וּמָלַכְתָּ
  choice: Alors tu régneras
  rationale: Le verbe exprime l’exercice de la royauté; « alors » rend naturellement la conséquence attendue de l’alliance.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: sur tout ce que tu désires
  rationale: Cette tournure française conserve l’étendue du règne et exprime naturellement le désir attribué en hébreu à la נֶפֶשׁ, la personne intérieure.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: David laissa partir Abner
  rationale: Dans ce contexte, שׁלח signifie qu’Abner reçoit congé et peut repartir; « laissa partir » évite de suggérer qu’il est envoyé en mission par David.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: et celui-ci s’en alla en paix
  rationale: La formulation conserve l’idiome hébreu tout en identifiant clairement Abner comme sujet de la proposition.
theological_decisions:
- issue: Langage de l’alliance
  choice: concluent une alliance avec toi
  alternative: coupent une alliance avec toi
  rationale: Le passage évoque une alliance politique. La formulation idiomatique française ne lui ajoute aucune portée confessionnelle, tandis qu’une note conserve l’image littérale hébraïque.
- issue: Expression anthropologique avec נֶפֶשׁ
  choice: tout ce que tu désires
  alternative: tout ce que désire ton âme
  rationale: Dans cette expression, נֶפֶשׁ désigne la personne comme siège du désir. Le texte principal emploie un français naturel, et la note signale la forme plus littérale sans imposer une conception particulière de l’âme.
- issue: Portée de « en paix »
  choice: s’en alla en paix
  alternative: partit sain et sauf et en bons termes
  rationale: L’idiome est conservé dans le texte afin de ne pas réduire sa portée au seul sentiment de tranquillité; la note en précise les implications contextuelles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe du discours reste solennelle sans archaïsmes; les idiomes hébreux opaques sont rendus naturellement, avec leurs formes littérales données en note.
