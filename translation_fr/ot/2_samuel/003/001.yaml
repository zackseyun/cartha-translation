  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ אֲרֻכָּ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/דָוִד֙ הֹלֵ֣ךְ וְ/חָזֵ֔ק וּ/בֵ֥ית שָׁא֖וּל הֹלְכִ֥ים וְ/דַלִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: fr
  text: La guerre entre la maison de Saül[b] et la maison de David se prolongea[a]. David devenait de plus en plus fort, tandis que la maison de Saül devenait de plus en plus faible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fut longue ». Il est ici question de la durée de la guerre.'
    reason: lexical_alternative
  - marker: b
    text: Le mot « maison » peut désigner la maisonnée, la lignée familiale ou la dynastie régnante ; il possède probablement ici une portée à la fois familiale et politique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה אֲרֻכָּה
  choice: La guerre … se prolongea
  rationale: L’adjectif hébreu signifie littéralement « longue » et décrit ici la durée de la guerre. « Se prolongea » restitue ce sens dans un français naturel, sans ajouter un marqueur temporel absent du texte.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: entre la maison de Saül et la maison de David
  rationale: « Maison » conserve la portée à la fois familiale et politique de בֵּית, plus large que le seul terme « dynastie ».
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: David devenait de plus en plus fort
  rationale: La construction avec הֹלֵךְ exprime une progression continue. La tournure française rend clairement l’accroissement graduel de la force de David.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: la maison de Saül devenait de plus en plus faible
  rationale: La formulation rend la diminution progressive de puissance et maintient le contraste symétrique avec David. Le singulier français traite « maison » comme un nom collectif.
- source_word: דַלִּים
  choice: faible
  rationale: Dans ce contexte politique et militaire, le mot désigne une perte de force ou de puissance, non la pauvreté économique.
theological_decisions:
- issue: Portée de « maison »
  choice: Conserver « maison » dans le texte
  alternative: Employer « dynastie » ou « famille »
  rationale: Le terme hébreu peut englober la maisonnée, la lignée et le pouvoir dynastique. Le traduire par « maison » préserve cette pluralité sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée en deux pour faciliter la lecture tout en préservant le contraste progressif de l’hébreu. Les répétitions de « maison » et « de plus en plus » maintiennent la structure et l’opposition du texte source.
