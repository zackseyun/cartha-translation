  text: וַ/יֵּדְע֧וּ כָל הָ/עָ֛ם וְ/כָל יִשְׂרָאֵ֖ל בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י לֹ֤א הָיְתָה֙ מֵֽ/הַ/מֶּ֔לֶךְ לְ/הָמִ֖ית אֶת אַבְנֵ֥ר בֶּן נֵֽר־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: fr
  text: Ainsi, ce jour-là, tout le peuple et tout Israël reconnurent que la mise à mort d’Abner, fils de Ner, ne venait pas du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que le roi n’était pas à l’origine de la mise à mort d’Abner » ; autre interprétation : « que le roi n’avait pas ordonné la mort d’Abner ». L’hébreu exprime littéralement l’idée de source ou d’origine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: reconnurent
  rationale: Le qal narratif de ידע indique ici que tous en vinrent à reconnaître un fait; « reconnurent » exprime naturellement cette prise de conscience dans le contexte.
- source_word: כָל הָעָם וְכָל יִשְׂרָאֵל
  choice: tout le peuple et tout Israël
  rationale: Conserve les deux expressions collectives et leur portée emphatique sans les fondre l’une dans l’autre.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Équivalent français courant et précis de l’expression temporelle hébraïque.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: ne venait pas du roi
  rationale: Rend l’idée hébraïque de source ou d’origine tout en restant idiomatique en français, sans expliciter davantage la responsabilité du roi.
- source_word: לְהָמִית
  choice: la mise à mort
  rationale: Exprime la valeur causative de l’infinitif hiphil de מות et permet une formulation française naturelle avec « ne venait pas du roi ».
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: d’Abner, fils de Ner
  rationale: Conserve les noms propres et la désignation généalogique sous une forme française standard.
theological_decisions:
- issue: Degré d’implication concernant la responsabilité de David dans la mort d’Abner
  choice: La mise à mort « ne venait pas du roi ».
  alternative: Le roi n’avait pas ordonné sa mort / le roi était innocent de sa mort.
  rationale: L’hébreu énonce la source ou l’origine de l’acte plutôt qu’une innocence juridique générale ou l’absence explicite d’un ordre; la traduction maintient cette portée limitée et son ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La construction est réorganisée pour être naturelle en français, tout en conservant l’insistance sur « tout le peuple et tout Israël » et l’ambiguïté de l’expression hébraïque relative au roi.
