    text: L’expression « s’en aller en paix » indique qu’Abner était parti sain et sauf et en bons termes.
    reason: lexical_alternative
  revision_rationale: La révision rétablit la coordination initiale, rend l’arrivée comme un événement narratif achevé, évite l’ajout temporel de « plus », et traduit plus directement l’envoi d’Abner. La formulation conserve l’ambiguïté contextuelle de « expédition » et le sens idiomatique de « en paix ».
