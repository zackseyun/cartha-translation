revisions:
- from: Or voici, les serviteurs de David et Joab revenaient d’une expédition, rapportant avec eux un butin considérable. Abner n’était plus auprès de David à Hébron, car David l’avait laissé repartir, et il s’en était allé en paix[a].
  to: Et voici, les serviteurs de David et Joab revinrent d’une expédition et rapportèrent avec eux un butin considérable. Mais Abner n’était pas avec David à Hébron, car David l’avait renvoyé, et il s’en était allé en paix[a].
  rationale: La révision rétablit la coordination initiale, rend l’arrivée comme un événement narratif achevé, évite l’ajout temporel de « plus », et traduit plus directement l’envoi d’Abner. La formulation conserve l’ambiguïté contextuelle de « expédition » et le sens idiomatique de « en paix ».
