base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: fr
  text: Et voici, les serviteurs de David et Joab revinrent d’une expédition et rapportèrent avec eux un butin considérable. Mais Abner n’était pas avec David à Hébron, car David l’avait renvoyé, et il s’en était allé en paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « s’en aller en paix » indique qu’Abner était parti sain et sauf et en bons termes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici
  rationale: Introduit avec vivacité un nouveau développement du récit; « voici » conserve la valeur présentative de l’hébreu dans un registre narratif digne.
- source_word: עַבְדֵי דָוִד
  choice: les serviteurs de David
  rationale: Désigne ici les hommes attachés au service de David, sans imposer la notion d’esclavage.
- source_word: בָּא מֵהַגְּדוּד
  choice: revenaient d’une expédition
  rationale: גְּדוּד peut désigner une troupe ou son expédition armée. Le butin mentionné ensuite favorise ici le sens d’expédition militaire, sans préciser au-delà du texte sa nature exacte.
- source_word: וְשָׁלָל רָב עִמָּם הֵבִיאוּ
  choice: rapportant avec eux un butin considérable
  rationale: Rend naturellement le retour avec une grande quantité de biens pris lors de l’opération.
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: Abner n’était plus auprès de David à Hébron
  rationale: « N’était plus » exprime clairement son absence au moment où Joab revient; « auprès de » convient au contexte de présence personnelle et politique.
- source_word: כִּי שִׁלְּחוֹ
  choice: car David l’avait laissé repartir
  rationale: Le sujet implicite est David d’après le contexte. Le plus-que-parfait marque l’antériorité, et « laissé repartir » rend le renvoi sans suggérer nécessairement un congédiement hostile.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: et il s’en était allé en paix
  rationale: 'Conserve l’expression hébraïque et sa portée: Abner est parti sans violence, en sécurité et en bons termes.'
