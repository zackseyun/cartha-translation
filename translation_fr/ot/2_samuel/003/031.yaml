base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: fr
  text: 'David dit à Joab et à tout le peuple qui était avec lui : « Déchirez vos vêtements, revêtez-vous de toile de sac et faites entendre des lamentations devant Abner. » Le roi David marchait derrière le brancard funèbre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la couche funèbre » ou « la civière ». Le mot hébreu signifie souvent « lit », mais il désigne ici le support sur lequel le corps d’Abner était transporté.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: Déchirez vos vêtements
  rationale: L’impératif décrit le geste traditionnel par lequel on déchirait ses vêtements en signe de deuil. Cette formulation est à la fois directe, naturelle et fidèle.
- source_word: חִגְרוּ שַׂקִּים
  choice: revêtez-vous de toile de sac
  rationale: Le verbe signifie littéralement « ceignez-vous », mais l’expression désigne ici le fait de porter une étoffe grossière en signe de deuil. « Revêtez-vous de toile de sac » garde l’image sans employer une tournure française obscure.
- source_word: וְסִפְדוּ
  choice: faites entendre des lamentations
  rationale: ספד désigne les lamentations publiques et rituelles pour un mort. Cette traduction exprime plus précisément cet acte que le seul verbe général « pleurer ».
- source_word: לִפְנֵי אַבְנֵר
  choice: devant Abner
  rationale: 'La formulation conserve le sens spatial du texte hébreu : les endeuillés doivent se placer devant Abner, c’est-à-dire devant son corps porté dans le cortège, sans expliciter dans le texte ce que l’hébreu laisse implicite.'
- source_word: הֹלֵךְ אַחֲרֵי
  choice: marchait derrière
  rationale: Le participe hébreu présente une action en cours, bien rendue par l’imparfait français. « Derrière » exprime clairement la position de David dans le cortège.
- source_word: הַמִּטָּה
  choice: le brancard funèbre
  rationale: מִטָּה signifie souvent « lit » ou « couche », mais désigne ici le support sur lequel le corps d’Abner est transporté. « Brancard funèbre » est précis et plus immédiatement compréhensible que « civière funèbre » ou « bière ».
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: Le roi David
  rationale: Cette disposition du titre et du nom est naturelle en français et met en évidence le rôle royal de David dans la procession.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image concrète des rites de deuil et la disposition du cortège, tout en évitant les archaïsmes tels que « ceignez-vous de sacs » et l’emploi potentiellement ambigu de « bière ».
