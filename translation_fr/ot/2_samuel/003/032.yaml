base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: fr
  text: On enterra Abner à Hébron. Le roi éleva la voix et pleura au tombeau d’Abner[a], et tout le peuple pleura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le tombeau d’Abner ». La préposition hébraïque peut exprimer une orientation vers le tombeau ; dans ce contexte, elle peut aussi se comprendre au sens idiomatique de « au tombeau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: On enterra
  rationale: Le qal wayyiqtol à la 3e personne du pluriel exprime l’action narrative successive. Le pronom indéfini « on » rend naturellement en français les acteurs non nommés.
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: La préposition בְּ indique ici le lieu. En français, le nom de ville appelle naturellement « à ».
- source_word: וַיִּשָּׂא ... אֶת־קוֹלוֹ
  choice: éleva la voix
  rationale: Cette expression idiomatique décrit une lamentation audible. « Éleva la voix » en conserve la force et la dignité littéraire.
- source_word: וַיֵּבְךְּ
  choice: pleura
  rationale: Le verbe בכה désigne les pleurs. « Pleura » convient au contexte funèbre et permet de reproduire sa répétition à la fin du verset.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: devant la tombe d’Abner
  rationale: אֶל marque ordinairement un mouvement ou une orientation vers quelque chose, mais peut décrire ici la relation du roi au lieu de sépulture. « Devant la tombe » est naturel en français et garde une nuance spatiale sans imposer une direction précise.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: tout le peuple pleura
  rationale: La répétition de בכה est conservée, et כָּל־הָעָם est rendu directement par « tout le peuple ».
theological_decisions: []
