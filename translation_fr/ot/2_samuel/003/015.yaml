  text: וַ/יִּשְׁלַח֙ אִ֣ישׁ בֹּ֔שֶׁת וַ/יִּקָּחֶ֖/הָ מֵ֣/עִֽם אִ֑ישׁ מֵ/עִ֖ם פַּלְטִיאֵ֥ל בֶּן לוש־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: fr
  text: Alors Ish-Bosheth envoya prendre Mikal à son mari[a], Paltiel, fils de Laïsh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’auprès de l’homme, d’auprès de Paltiel, fils de Laïsh ». Ici, « l’homme » désigne son mari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya chercher
  rationale: Le verbe signifie littéralement « envoya ». Comme l’action qui suit consiste à faire prendre Mikal, « envoya chercher » exprime naturellement en français l’envoi d’agents sans préciser leur identité.
- source_word: אִישׁ בֹּשֶׁת
  choice: Ish-Bosheth
  rationale: Translittération française usuelle du nom propre, avec un trait d’union pour ses deux éléments.
- source_word: וַיִּקָּחֶהָ
  choice: la fit prendre
  rationale: Le sujet reste Ish-Bosheth, mais l’envoi préalable suppose que l’action est exécutée par ses agents. La tournure causative française évite de laisser entendre qu’il est allé lui-même la prendre, tout en conservant la sobriété de לקח.
- source_word: מֵעִם אִישׁ
  choice: à son mari
  rationale: מֵעִם marque ici la séparation d’avec quelqu’un. אִישׁ signifie littéralement « homme », mais désigne dans ce contexte le mari de Mikal. En français, « prendre quelqu’un à son mari » rend naturellement cette relation.
- source_word: מֵעִם פַּלְטִיאֵל
  choice: Paltiel
  rationale: La répétition hébraïque précise que le mari en question est Paltiel. Une apposition française transmet cette identification sans lourdeur.
- source_word: בֶּן לוש
  choice: fils de Laïsh
  rationale: בֶּן exprime la filiation. Laïsh est une translittération française conventionnelle du nom propre ici vocalisé לָיִשׁ dans la tradition massorétique.
theological_decisions:
- issue: Statut conjugal de Paltiel
  choice: son mari
  alternative: l’homme
  rationale: Le contexte présente Paltiel comme le mari avec lequel Mikal vivait, tandis que David revendique son mariage antérieur. Traduire אִישׁ par « son mari » explicite le sens relationnel immédiat sans trancher la question théologique ou juridique de la légitimité respective des unions.
translation_notes:
  register: Français moderne, international et digne. La phrase privilégie une narration fluide tout en signalant en note la répétition et l’expression littérale de l’hébreu. Le nom de Mikal, absent comme nom explicite dans ce verset mais repris par le pronom féminin, est introduit pour assurer une référence naturelle en français dans un verset isolé.
