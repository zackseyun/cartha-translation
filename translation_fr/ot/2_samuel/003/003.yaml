- source_word: ל/אביגל
  choice: né d’Abigaïl
  rationale: La préposition ל marque ici la filiation maternelle dans la liste des fils de David ; cette formulation est naturelle en français et évite de répéter « fils ».
- source_word: הַכַּרְמְלִי
  choice: le Carmélite
  rationale: Gentilé traditionnel désignant ici Nabal comme homme de Carmel, et non membre d’un ordre religieux.
- source_word: גְּשׁוּר
  choice: Gueshour
  rationale: Translittération française usuelle du nom géographique hébreu.
