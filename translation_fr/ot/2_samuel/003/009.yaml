revisions:
- from: 'Que Dieu inflige cela à Abner, et pire encore, si je n’accomplis pas pour David exactement ce que Yahweh lui a juré[a] :'
  to: 'Que Dieu inflige cela à Abner, et bien plus encore, si je ne fais pas pour David ce que Yahweh lui a juré[a] :'
  rationale: La révision maintient l’auto-imprécation, le nom d’Abner à la troisième personne et les deux-points qui annoncent la suite au verset 10. Elle remplace une reformulation qui risquait de modifier le lien entre le serment de Yahweh et l’engagement d’Abner, et rend plus sobrement l’intensification de la formule hébraïque.
