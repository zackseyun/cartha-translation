  text: כֹּֽה יַעֲשֶׂ֤ה אֱלֹהִים֙ לְ/אַבְנֵ֔ר וְ/כֹ֖ה יֹסִ֣יף ל֑/וֹ כִּ֗י כַּ/אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לְ/דָוִ֔ד כִּֽי כֵ֖ן אֶֽעֱשֶׂה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: fr
  text: 'Que Dieu inflige cela à Abner, et bien plus encore, si je ne fais pas pour David ce que Yahweh lui a juré[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car, comme Yahweh l’a juré à David, ainsi je ferai pour lui ». Dans cette formule de serment, la condition négative (« si je ne... ») est implicite.'
    reason: La note préserve la construction positive de l’hébreu tout en expliquant l’explicitation française de la condition inhérente à l’auto-imprécation.
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: Que Dieu inflige cela à Abner, et pire encore
  rationale: Cette formule hébraïque de serment appelle sur celui qui parle un châtiment divin volontairement laissé indéfini. « Inflige cela » en conserve la retenue, tandis que « et pire encore » exprime l’intensification de וְכֹה יֹסִיף לוֹ. Le nom d’Abner est maintenu comme dans l’hébreu, où il parle de lui-même à la troisième personne.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans cette formule de serment, le mot désigne le Dieu unique et appelle donc le singulier en français.
- source_word: כַּאֲשֶׁר
  choice: exactement ce que
  rationale: Dans la formulation française restructurée, cette expression conserve la correspondance précise entre le serment de Yahweh et l’action qu’Abner s’engage à accomplir.
- source_word: נִשְׁבַּע
  choice: a juré
  rationale: Le passé composé exprime un serment prononcé antérieurement dont la portée demeure actuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: si je n’accomplis pas pour David exactement ce que Yahweh lui a juré
  rationale: 'Le français explicite la valeur conditionnelle négative sous-entendue par la formule imprécatoire : Abner appelle le châtiment sur lui-même s’il manque à son engagement. « Pour David » clarifie le référent de לוֹ sans changer le sens contextuel.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Négative sous-entendue dans le serment
  choice: si je n’accomplis pas
  alternative: car, comme Yahweh l’a juré à David, ainsi je ferai pour lui
  rationale: La formule d’auto-imprécation exige en français une condition indiquant dans quel cas le châtiment invoqué doit tomber. La négation n’est pas exprimée matériellement dans le texte hébreu reçu, mais elle est sous-entendue par l’usage de la formule; une note conserve la forme plus littérale.
translation_notes:
  register: Français international moderne, solennel mais accessible. La tournure garde l’auto-imprécation à la troisième personne (« Abner ») et l’indétermination traditionnelle du châtiment. Les deux-points signalent que la phrase se poursuit au verset suivant.
