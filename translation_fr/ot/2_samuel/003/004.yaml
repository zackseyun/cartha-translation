  text: the fourth[a], Adonijah son of Haggith; and the fifth, Shephatiah son of Abital.
translation:
  language: fr
  text: le quatrième[a], Adoniya, fils de Hagguit ; et le cinquième, Shefatia, fils d’Abital.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu commence par « et le quatrième », poursuivant la liste du verset précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְבִיעִי
  choice: le quatrième
  rationale: L’adjectif ordinal est conservé. La conjonction initiale, qui relie ce verset à la liste du verset précédent, est signalée en note plutôt que rendue dans le texte français, où elle serait moins naturelle en début de verset.
- source_word: אֲדֹנִיָּה
  choice: Adoniya
  rationale: Nom propre translittéré selon une forme française claire et courante.
- source_word: בֶן
  choice: fils de
  rationale: L’état construit exprime ici la filiation directe ; « fils de » est la formulation généalogique naturelle en français.
- source_word: חַגִּית
  choice: Hagguit
  rationale: Nom propre rendu selon la forme française biblique usuelle.
- source_word: וְהַחֲמִישִׁי
  choice: et le cinquième
  rationale: La conjonction est conservée ici, car elle coordonne naturellement les deux éléments de la liste présents dans le verset.
- source_word: שְׁפַטְיָה
  choice: Shefatia
  rationale: Nom propre translittéré dans une forme lisible en français moderne, tout en restant proche de l’hébreu.
- source_word: אֲבִיטָל
  choice: Abital
  rationale: Nom propre translittéré directement, conformément à l’usage français.
