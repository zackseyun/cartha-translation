  text: וְ/הַ/שִּׁשִּׁ֣י יִתְרְעָ֔ם לְ/עֶגְלָ֖ה אֵ֣שֶׁת דָּוִ֑ד אֵ֛לֶּה יֻלְּד֥וּ לְ/דָוִ֖ד בְּ/חֶבְרֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: fr
  text: et le sixième, Yitréam, qu’il eut d’Égla, femme de David[a]. Ce sont les fils qui naquirent à David, à Hébron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « femme de David ». Dans ce contexte, cette expression présente Égla comme l’une des femmes de David, sans nécessairement dire qu’elle était sa seule femme.
    reason: Préciser la portée de la construction hébraïque et éviter une lecture exclusive.
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: et le sixième
  rationale: L’ordinal avec la conjonction poursuit la liste des fils de David. Le nom « fils » reste implicite, comme en hébreu.
- source_word: יִתְרְעָם
  choice: Yitréam
  rationale: Translittération française moderne du nom propre hébreu.
- source_word: לְעֶגְלָה
  choice: qu’il eut d’Égla
  rationale: Dans cette formule généalogique, לְ introduit la mère. Cette tournure française exprime clairement la filiation maternelle sans donner à la préposition un sens plus précis que le contexte.
- source_word: אֵשֶׁת דָּוִד
  choice: femme de David
  rationale: Rendu direct de la construction hébraïque. Il conserve la formulation du texte sans laisser entendre qu’Égla était nécessairement l’unique femme de David.
- source_word: אֵלֶּה
  choice: Ceux-là
  rationale: Le démonstratif récapitule les fils énumérés dans les versets précédents sans ajouter le nom « fils », absent de l’hébreu.
- source_word: יֻלְּדוּ
  choice: naquirent
  rationale: Le passif de ילד dans cette notice généalogique décrit naturellement la naissance.
- source_word: לְדָוִד
  choice: à David
  rationale: 'Dans la formule ילד + לְ, le complément indique le père : ils naquirent à David.'
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: La préposition indique le lieu où eurent lieu ces naissances.
theological_decisions:
- issue: Statut d’Égla parmi les femmes de David
  choice: femme de David
  alternative: la femme de David / une femme de David
  rationale: L’hébreu signifie littéralement « femme de David ». La formulation retenue préserve cette relation sans suggérer qu’elle était son unique femme ni introduire explicitement l’indéfini « une », absent du texte.
translation_notes:
  register: Français moderne, sobre et digne. La tournure généalogique « qu’il eut d’Égla » rend explicite le rôle maternel marqué par לְ, tandis que « naquirent à David » conserve la formulation biblique de la seconde proposition.
