  verdict: revise
  source_fidelity: Le texte rend correctement la succession (« le sixième »), le nom, la mère, l’apposition « femme de David », et le lieu. Toutefois, « Ceux-là naquirent à David à Hébron » est une reproduction trop littérale de la syntaxe hébraïque et ne fonctionne pas naturellement en français moderne. L’explicitation de « fils », clairement impliqué par la liste immédiate, permet de conserver le sens généalogique de אֵלֶּה יֻלְּדוּ לְדָוִד.
  naturalness: « Qu’il eut d’Égla » est recevable dans une liste généalogique. En revanche, « Ceux-là naquirent à David à Hébron » est heurté et ambigu en français contemporain. « Ce sont les fils qui naquirent à David, à Hébron » est une formulation biblique sobre, intelligible et idiomatique, tout en gardant la tournure généalogique.
  terminology: « Yitréam », « Égla », « femme de David » et « Hébron » sont cohérents. La note maintient à juste titre la portée non exclusive de la construction « femme de David » sans imposer d’interprétation supplémentaire.
