reference: 2 Samuel 3:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָדַ֨עְתָּ֙ אֶת אַבְנֵ֣ר בֶּן נֵ֔ר כִּ֥י לְ/פַתֹּתְ/ךָ֖ בָּ֑א וְ/לָ/דַ֜עַת אֶת מוֹצָֽאֲ/ךָ֙ וְ/אֶת מבוא/ך וְ/לָ/דַ֕עַת אֵ֛ת כָּל אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: fr
  text: 'Tu connais Abner, fils de Ner : il est venu pour te tromper[a], pour connaître tes allées et venues[b] et tout ce que tu fais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’attirer », « te séduire » ou « te persuader ». Le verbe hébreu peut désigner le fait d’inciter, de séduire ou de tromper ; ici, le contexte hostile favorise « te tromper ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ta sortie et ton entrée » : expression désignant l’ensemble des déplacements ou des activités d’une personne.'
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Tu connais
  rationale: 'Le qal accompli à la 2e personne du masculin singulier exprime ici un état présent : Joab affirme que David connaît le caractère ou les intentions d’Abner.'
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner, fils de Ner
  rationale: La filiation est rendue dans une formulation française naturelle et digne.
- source_word: כִּי
  choice: ':'
  rationale: La ponctuation française introduit naturellement le contenu de ce que David est censé savoir, sans alourdir la phrase avec « à savoir qu’ ».
- source_word: לְפַתֹּתְךָ
  choice: pour te tromper
  rationale: Le verbe peut signifier séduire, attirer, persuader ou tromper. Le contexte politique hostile favorise ici l’idée de tromperie, tandis qu’une note préserve l’étendue lexicale.
- source_word: בָּא
  choice: il est venu
  rationale: Le passé composé convient au discours direct et souligne la venue récente d’Abner auprès de David.
- source_word: וְלָדַעַת
  choice: pour connaître
  rationale: Dans cette proposition de but, le verbe désigne l’acquisition de renseignements. « Connaître » reste naturel avec le complément idiomatique qui suit.
- source_word: מוֹצָאֲךָ וְאֶת מְבוֹאֶךָ
  choice: tes allées et venues
  rationale: Cette expression française naturelle conserve le mérisme hébreu désignant l’ensemble des déplacements ou activités de David.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: tout ce que tu fais
  rationale: Cette formulation courante rend la portée globale de כָּל et la valeur présente du participe sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au discours adressé personnellement au roi dans le récit. La tournure « tes allées et venues » rend l’idiome hébreu de façon immédiatement compréhensible, avec sa forme littérale conservée en note.
