  text: וַ/יִּשְׁלַח֩ אַבְנֵ֨ר מַלְאָכִ֧ים אֶל דָּוִ֛ד תחת/ו לֵ/אמֹ֖ר לְ/מִי אָ֑רֶץ לֵ/אמֹ֗ר כָּרְתָ֤/ה בְרִֽיתְ/ךָ֙ אִתִּ֔/י וְ/הִנֵּה֙ יָדִ֣/י עִמָּ֔/ךְ לְ/הָסֵ֥ב אֵלֶ֖י/ךָ אֶת כָּל יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: fr
  text: 'Alors Abner envoya de sa part[a] des messagers à David. Il lui fit dire : « À qui appartient le pays ? Conclus une alliance avec moi, et voici : ma main est avec toi[b] pour rallier à toi tout Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à sa place »; l’expression peut indiquer que les messagers parlaient en son nom.'
    reason: lexical_alternative
  - marker: b
    text: « Ma main est avec toi » exprime le soutien d’Abner et le pouvoir qu’il met au service de David.
    reason: idiom_explanation
lexical_decisions:
- source_word: תחתו
  choice: de sa part
  rationale: Le syntagme signifie littéralement « à sa place » et indique ici qu’Abner agit par l’intermédiaire de représentants. « De sa part » est naturel en français dans le contexte d’une mission diplomatique.
- source_word: לְמִי אָרֶץ
  choice: À qui appartient le pays ?
  rationale: Cette question très concise porte sur la possession du pays et, implicitement, sur l’autorité qui s’y exerce. La traduction conserve sa forme interrogative sans expliciter davantage la prétention politique d’Abner.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: Conclus une alliance avec moi
  rationale: כרת ברית est l’expression habituelle pour conclure une alliance. Le français courant ne reprend pas littéralement l’image de « couper » une alliance; l’article indéfini rend naturellement l’acte demandé.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: 'et voici : ma main sera avec toi'
  rationale: La traduction garde l’image hébraïque de la main, qui évoque à la fois le soutien et la capacité d’agir. Le futur convient à l’engagement proposé dans ce contexte conditionnel, sans réduire la métaphore à une simple déclaration de sympathie.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: pour rallier à toi
  rationale: Le verbe exprime ici le fait de faire changer d’orientation ou d’allégeance. « Rallier à toi » rend clairement ce mouvement politique en français.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette formulation française traditionnelle et claire désigne collectivement l’ensemble d’Israël.
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Dans ce cadre politique, le terme désigne des envoyés humains. « Messagers » reste précis sans ajouter le statut plus technique que pourrait suggérer « ambassadeurs ».
theological_decisions:
- issue: Portée de la question לְמִי אָרֶץ
  choice: 'Maintenir la question directe : « À qui appartient le pays ? »'
  alternative: L’expliciter par « Qui doit régner sur le pays ? » ou en faire l’affirmation implicite « Le pays est à moi »
  rationale: L’hébreu est elliptique et peut évoquer aussi bien la possession que le droit de gouverner. La question directe préserve la tension politique et ne transforme pas l’insinuation d’Abner en affirmation explicite.
- issue: Sens de « ma main sera avec toi »
  choice: Conserver la métaphore de la main
  alternative: Paraphraser par « je te soutiendrai » ou « mon pouvoir sera à ton service »
  rationale: La métaphore associe soutien personnel et pouvoir effectif. La conserver évite de choisir un seul de ces aspects.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque de לֵאמֹר (« en disant… en disant ») est rendue par « Il lui fit dire » et par le discours direct afin d’éviter une lourdeur étrangère au français, tandis que « et voici » conserve l’effet d’insistance de וְהִנֵּה.
