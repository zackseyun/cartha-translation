  text: וַ/יֹּ֣אמֶר ט֔וֹב אֲנִ֕י אֶכְרֹ֥ת אִתְּ/ךָ֖ בְּרִ֑ית אַ֣ךְ דָּבָ֣ר אֶחָ֡ד אָנֹכִי֩ שֹׁאֵ֨ל מֵ/אִתְּ/ךָ֤ לֵ/אמֹר֙ לֹא תִרְאֶ֣ה אֶת פָּנַ֔/י כִּ֣י אִם לִ/פְנֵ֣י הֱבִיאֲ/ךָ֗ אֵ֚ת מִיכַ֣ל בַּת שָׁא֔וּל בְּ/בֹאֲ/ךָ֖ לִ/רְא֥וֹת אֶת פָּנָֽ/י־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: fr
  text: 'Il dit : « D’accord. Je conclurai une alliance avec toi. Je ne te demande qu’une chose : tu ne verras pas mon visage[a] sans avoir d’abord amené Mikal, fille de Saül, quand tu viendras voir mon visage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne paraîtras pas devant moi sans avoir d’abord amené Mikal, fille de Saül, quand tu viendras paraître devant moi ». L’hébreu dit littéralement : « voir mon visage ».'
    reason: L’expression hébraïque peut désigner le fait de voir quelqu’un ou celui de se présenter officiellement devant lui.
lexical_decisions:
- source_word: טוֹב
  choice: D’accord
  rationale: Exprime naturellement en français l’assentiment bref de David, sans développer le texte.
- source_word: אֶכְרֹת ... בְּרִית
  choice: Je conclurai une alliance
  rationale: Rend l’expression hébraïque littérale « couper une alliance » par l’équivalent français courant, tout en conservant la portée formelle de בְּרִית.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: Je ne te demande qu’une chose
  rationale: Restitue la restriction portée par אַךְ et la demande unique dans un ordre naturel en français.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Les deux-points introduisent directement le contenu de la demande, fonction assumée ici par לֵאמֹר.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: tu ne verras pas mon visage
  rationale: Conserve l’expression hébraïque et son possible sens personnel ou protocolaire, plutôt que de trancher silencieusement entre « me voir » et « paraître devant moi ».
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: sans avoir d’abord amené
  rationale: Exprime clairement la condition exceptive ainsi que l’antériorité exigée par David.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikal, fille de Saül
  rationale: Transcrit le nom hébreu de manière transparente et rend naturellement l’apposition filiale.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: quand tu viendras voir mon visage
  rationale: Préserve la reprise délibérée de l’expression « voir mon visage » présente dans l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « D’accord » évite l’artificialité de « Bien » comme formule d’assentiment. La répétition inhabituelle de « voir mon visage » est maintenue parce qu’elle appartient au texte hébreu, tandis qu’une note signale sa possible valeur protocolaire.
