reference: 2 Samuel 3:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע דָּוִד֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יֹּ֗אמֶר נָקִ֨י אָנֹכִ֧י וּ/מַמְלַכְתִּ֛/י מֵ/עִ֥ם יְהוָ֖ה עַד עוֹלָ֑ם מִ/דְּמֵ֖י אַבְנֵ֥ר בֶּן נֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: fr
  text: 'Après cela[a], David l’apprit et déclara : « Mon royaume et moi sommes pour toujours innocents devant Yahweh du sang d’Abner, fils de Ner[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par la suite » ou « Plus tard ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des sangs d’Abner », expression qui évoque le sang versé et la responsabilité liée à sa mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette expression temporelle situe la réaction de David après les événements qui viennent d’être racontés. « Après cela » est naturel en français et conserve le lien narratif explicite.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: David l’apprit
  rationale: Le verbe signifie « entendre, apprendre ». Le pronom « l’ » reprend naturellement en français le meurtre d’Abner rapporté dans le contexte, sans ajouter de nouvel élément.
- source_word: וַיֹּאמֶר
  choice: déclara
  rationale: Dans cette prise de parole publique et solennelle, « déclara » rend naturellement le verbe courant « dire » tout en respectant la force de l’énoncé.
- source_word: נָקִי אָנֹכִי וּמַמְלַכְתִּי
  choice: Mon royaume et moi sommes […] innocents
  rationale: נָקִי exprime l’absence de culpabilité. L’ordre « Mon royaume et moi » est plus idiomatique en français que « Moi et mon royaume », tout en maintenant l’association de David à son royaume.
- source_word: מֵעִם יְהוָה
  choice: devant Yahweh
  rationale: L’expression présente Yahweh comme témoin et juge de l’innocence affirmée. « Devant » conserve cette dimension relationnelle et judiciaire.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette formulation moderne exprime clairement la durée indéfinie et solennelle de la déclaration.
- source_word: מִדְּמֵי אַבְנֵר
  choice: du sang d’Abner
  rationale: Le pluriel hébreu « des sangs » est une expression relative au sang versé et à la responsabilité qui en découle. La formulation française conserve l’image concrète, tandis que le mot « innocents » en indique la portée juridique et morale.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner, fils de Ner
  rationale: Les noms sont translittérés selon leur forme française usuelle, et le patronyme hébreu est rendu directement par « fils de Ner ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de l’innocence revendiquée par David
  choice: Conserver la déclaration de David sans en certifier ni en contester la véracité
  alternative: Reformuler comme une affirmation objective de son innocence
  rationale: Le verset rapporte les paroles de David. La traduction maintient cette perspective narrative et laisse intacte la tension éventuelle entre sa déclaration et l’évaluation plus large du récit.
- issue: Sens de מַמְלַכְתִּי
  choice: mon royaume
  alternative: ma dynastie
  rationale: « Royaume » conserve le sens politique large du terme sans décider qu’il désigne exclusivement la maison dynastique de David.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste accessible, tandis que « du sang d’Abner » préserve l’image judiciaire et théologique de l’hébreu. Les deux appels de note figurent dans le texte principal.
