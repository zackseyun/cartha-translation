  text: וַ/יֵּצֵ֤א יוֹאָב֙ מֵ/עִ֣ם דָּוִ֔ד וַ/יִּשְׁלַ֤ח מַלְאָכִים֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יָּשִׁ֥בוּ אֹת֖/וֹ מִ/בּ֣וֹר הַסִּרָ֑ה וְ/דָוִ֖ד לֹ֥א יָדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: fr
  text: Joab quitta alors David et envoya des messagers à la poursuite d’Abner. Ils le ramenèrent du puits de Sira[a], mais David ne le savait pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « de Bor-Sira », si l’expression hébraïque est un nom de lieu plutôt que « le puits de Sira ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: quitta alors
  rationale: Dans la suite narrative, le verbe exprime le départ de Joab d’auprès de David. « Quitta » est naturel en français et « alors » restitue l’enchaînement du wayyiqtol.
- source_word: מֵעִם דָּוִד
  choice: David
  rationale: Avec « quitta », le complément direct « David » rend idiomatiquement le mouvement hors de sa présence, sans le calque peu naturel « sortit d’auprès de David ».
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Le contexte désigne des agents humains envoyés par Joab, et non des anges.
- source_word: אַחֲרֵי אַבְנֵר
  choice: à la poursuite d’Abner
  rationale: La préposition indique ici que les messagers suivent Abner pour le rejoindre. Cette formulation française rend le mouvement plus clairement que le calque « après Abner ».
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: Ils le ramenèrent
  rationale: La forme causative de שׁוב signifie qu’ils firent revenir Abner; « ramenèrent » en donne une expression française concise et naturelle.
- source_word: מִבּוֹר הַסִּרָה
  choice: depuis le puits de Sira
  rationale: בּוֹר peut désigner un puits ou une citerne. « Le puits de Sira » est une lecture naturelle de l’expression, tandis que la possibilité d’un nom de lieu composé est conservée en note.
- source_word: וְדָוִד לֹא יָדָע
  choice: sans que David le sache
  rationale: Cette tournure exprime naturellement en français que David ignorait l’initiative de Joab et son exécution, tout en conservant le contraste contextuel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite les calques hébraïques peu naturels tout en conservant l’incertitude toponymique dans la note.
