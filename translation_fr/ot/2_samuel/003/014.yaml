base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: fr
  text: 'Puis David envoya des messagers à Ish-Bosheth, fils de Saül, pour lui dire : « Donne-moi ma femme Mikal, que j’ai prise pour fiancée[a], pour cent prépuces de Philistins[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « que j’ai obtenue pour femme ». L’hébreu dit plus littéralement : « que j’ai prise pour fiancée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Voir 1 Samuel 18.25-27 : David obtint Mikal en présentant des prépuces de Philistins, conformément au prix nuptial exigé par Saül.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Puis David envoya
  rationale: Le waw consécutif fait progresser le récit ; « Puis » exprime naturellement la succession sans ajouter de lien causal.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte humain, le terme désigne des personnes chargées de transmettre un message ; « messagers » est direct et courant.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: à Ish-Bosheth, fils de Saül
  rationale: La translittération du nom propre est conservée et l'apposition hébraïque est rendue directement.
- source_word: לֵאמֹר
  choice: pour lui dire
  rationale: Cette tournure française introduit naturellement le discours direct tout en rendant la formule hébraïque.
- source_word: תְּנָה
  choice: Rends-moi
  rationale: Bien que נתן signifie littéralement « donner », le contexte indique que David réclame la restitution de Mikal, déjà appelée sa femme ; « rends-moi » exprime cette demande en français idiomatique.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: ma femme Mikal
  rationale: La construction appositionnelle identifie la femme comme Mikal. Le français omet naturellement la répétition du marqueur d'objet.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: que je me suis fiancée
  rationale: Le verbe ארשׂ désigne les fiançailles ou l'engagement matrimonial. Cette formulation conserve le datif réfléchi לִי et la tension entre « ma femme » et la référence aux fiançailles.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: pour cent prépuces de Philistins
  rationale: La préposition exprime ici le prix nuptial. La formulation reste concrète et proche de l'hébreu.
theological_decisions:
- issue: Terminologie du statut matrimonial de Mikal
  choice: Conserver « ma femme » et rendre ארשׂ par « me suis fiancée ».
  alternative: Uniformiser la formulation avec « que j'ai épousée » ou « que j'ai obtenue pour femme ».
  rationale: L'hébreu associe explicitement l'affirmation « ma femme » au vocabulaire des fiançailles et du prix nuptial. La traduction préserve cette tension juridique et relationnelle au lieu de l'harmoniser.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la narration biblique soutenue sans être archaïque. « Prépuces » conserve sans euphémisme le caractère concret du texte source.
