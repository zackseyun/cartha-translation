revisions:
- from: 'Puis David envoya des messagers à Ish-Bosheth, fils de Saül, pour lui dire : « Rends-moi ma femme Mikal, que je me suis fiancée[a] pour cent prépuces de Philistins[b]. »'
  to: 'Puis David envoya des messagers à Ish-Bosheth, fils de Saül, pour lui dire : « Donne-moi ma femme Mikal, que j’ai prise pour fiancée[a], pour cent prépuces de Philistins[b]. »'
  rationale: La révision corrige la faute de français affectant le verbe de fiançailles et remplace « Rends-moi » par l’équivalent direct de l’impératif hébreu. Elle conserve délibérément la juxtaposition « ma femme » / « prise pour fiancée », qui reflète la formulation juridique et relationnelle du texte source, sans la résoudre. Les deux notes sont conservées avec une formulation française corrigée et précise.
