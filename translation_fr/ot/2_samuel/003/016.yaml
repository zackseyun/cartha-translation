  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: fr
  text: 'Son mari l’accompagna, marchant tout en pleurant derrière elle[a], jusqu’à Bahourim. Alors Abner lui dit : « Va, retourne[b]. » Il retourna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à sa suite ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Va, retourne. » Les deux impératifs donnent de l’insistance à l’ordre ; on pourrait aussi traduire : « Retourne-t’en. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte, אִישׁ avec le suffixe féminin singulier désigne le mari de la femme ; « son mari » est précis et naturel en français.
- source_word: הָלוֹךְ וּבָכֹה
  choice: marchant […] tout en pleurant
  rationale: La construction dépeint une action continue et simultanée. Cette formulation en conserve l’aspect duratif dans un français courant.
- source_word: אַחֲרֶיהָ
  choice: derrière elle
  rationale: L’expression indique ici qu’il la suit. « Derrière elle » conserve directement la valeur spatiale, tandis que « à sa suite » reste une autre traduction possible.
- source_word: עַד בַּחֻרִים
  choice: jusqu’à Bahourim
  rationale: עַד suivi d’un lieu marque le point atteint au terme du déplacement ; « jusqu’à » l’exprime naturellement.
- source_word: בַּחֻרִים
  choice: Bahourim
  rationale: Nom de lieu translittéré sous une forme française claire, avec « ou » pour le son /u/.
- source_word: לֵךְ שׁוּב
  choice: Va, retourne-t’en
  rationale: Les deux impératifs hébreux sont conservés afin de rendre la brièveté et l’insistance de l’ordre, sans les fondre silencieusement en un seul.
- source_word: וַיָּשֹׁב
  choice: Et il s’en retourna
  rationale: Le waw consécutif fait avancer le récit ; la coordination par « Et » suit sobrement la progression narrative de l’hébreu.
