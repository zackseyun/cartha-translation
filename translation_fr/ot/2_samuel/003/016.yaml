    issue: Le pronom dans « retourne-t’en » n’est pas exprimé dans le double impératif hébreu לֵךְ שׁוּב.
    rationale: La formulation ajoute une orientation pronominale (« t’en ») que le texte source ne spécifie pas. « Va, retourne » conserve les deux impératifs sans ajouter ce détail.
  - severity: low
    issue: L’ancre de la note a est placée après « l’accompagna », alors que son alternative porte sur la relation spatiale exprimée par « derrière elle ».
    rationale: Déplacer l’ancre après « derrière elle » rend la note lexicalement et structurellement cohérente.
  - severity: low
    issue: « Et il s’en retourna » est inutilement soutenu pour la variante française moderne.
    rationale: « Il retourna » transmet simplement le waw narratif et le verbe source, avec un registre plus naturel.
