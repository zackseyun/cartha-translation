  rationale: La révision conserve le choix naturel « l’accompagna », mais replace la note d’alternative sur l’expression spatiale qu’elle concerne. Elle rend aussi les deux impératifs hébreux sans ajouter le pronom « en », et emploie une conclusion narrative plus naturelle en français moderne.
