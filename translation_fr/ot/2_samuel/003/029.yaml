    issue: Ajout de « grave » dans « une grave maladie de peau ».
    rationale: Le terme hébreu peut désigner diverses affections cutanées associées à l’impureté rituelle, mais le verset ne les qualifie pas explicitement de graves. Cet ajout réduit indûment le champ lexical.
  - severity: low
    issue: « Que jamais ne disparaissent de la maison de Joab… » est moins direct que la formule hébraïque négative avec « être retranché / manquer ».
    rationale: La tournure proposée dans la révision exprime plus clairement le souhait que de tels membres ne cessent jamais d’être présents dans la maison de Joab.
