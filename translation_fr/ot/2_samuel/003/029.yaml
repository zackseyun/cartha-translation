revisions:
- from: Que cela retombe sur la tête de Joab et sur toute sa famille[a] ! Que jamais ne disparaissent de la maison de Joab un homme atteint d’un écoulement, un homme atteint d’une grave maladie de peau[b], un homme qui tient le fuseau[c], un homme qui tombe par l’épée ou un homme qui manque de pain !
  to: Que cela retombe sur la tête de Joab et sur toute la maison de son père[a] ! Qu’il ne manque jamais, dans la maison de Joab, quelqu’un atteint d’un écoulement corporel, d’une affection cutanée[b], quelqu’un qui tient un fuseau[c], qui tombe sous l’épée ou qui manque de pain !
  rationale: La révision retire l’adjectif interprétatif « grave », précise l’écoulement sans le médicaliser excessivement, et reformule la seconde imprécation pour rendre plus fidèlement la continuité visée par « qu’il ne soit pas retranché de la maison de Joab ». Les notes maintiennent les ambiguïtés lexicales pertinentes, notamment pour l’affection cutanée et le fuseau.
