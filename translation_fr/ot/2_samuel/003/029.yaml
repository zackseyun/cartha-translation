  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: fr
  text: Que cela retombe sur la tête de Joab et sur toute la maison de son père[a] ! Qu’il ne manque jamais, dans la maison de Joab, quelqu’un atteint d’un écoulement corporel, d’une affection cutanée[b], quelqu’un qui tient un fuseau[c], qui tombe sous l’épée ou qui manque de pain !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « toute la maison de son père » ; cette expression peut désigner sa famille, son clan ou sa lignée paternelle.
    reason: explicitation de l’idiome familial hébreu
  - marker: b
    text: Le terme hébreu, traditionnellement rendu par « lépreux », peut désigner diverses affections cutanées et ne se limite pas à la lèpre au sens moderne.
    reason: précision lexicale sans diagnostic médical indu
  - marker: c
    text: Ou « quelqu’un qui s’appuie sur un bâton ». Le sens précis de l’expression hébraïque est incertain.
    reason: variante lexicale authentique
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: Que cela retombe sur la tête de
  rationale: La formule exprime ici le souhait que la responsabilité du sang versé et ses conséquences reviennent sur Joab. « Retomber sur la tête de » restitue naturellement l’idiome hébreu en français.
- source_word: כָּל בֵּית אָבִיו
  choice: toute sa famille
  rationale: Littéralement « toute la maison de son père » ; dans ce contexte, l’expression désigne la famille ou la lignée paternelle de Joab. « Toute sa famille » est naturel sans restreindre le sens au foyer immédiat.
- source_word: וְאַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: Que jamais ne disparaissent de la maison de Joab
  rationale: Le niphal de כרת, nié dans cette formule de malédiction, souhaite que de tels malheurs ne cessent jamais d’exister dans la lignée de Joab.
- source_word: זָב
  choice: un homme atteint d’un écoulement
  rationale: Désigne une personne souffrant d’un écoulement corporel persistant, avec des implications d’impureté rituelle dans le contexte biblique.
- source_word: מְצֹרָע
  choice: un homme atteint d’une grave maladie de peau
  rationale: Le terme hébreu couvre diverses affections cutanées graves et ne correspond pas nécessairement à la maladie de Hansen moderne. Cette formulation évite l’équivalence médicale trompeuse de « lépreux ».
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: un homme qui tient le fuseau
  rationale: פֶּלֶךְ désigne normalement un fuseau. L’image concrète est conservée sans imposer une interprétation de sa portée sociale ou physique ; une autre compréhension ancienne est signalée en note.
- source_word: נֹפֵל בַּחֶרֶב
  choice: un homme qui tombe par l’épée
  rationale: Conserve l’idiome hébreu solennel signifiant mourir sous les coups d’une arme.
- source_word: חֲסַר לָחֶם
  choice: un homme qui manque de pain
  rationale: Préserve l’image hébraïque du pain comme nourriture essentielle et moyen de subsistance.
theological_decisions:
- issue: Nature de la déclaration de David
  choice: Un souhait imprécatoire dirigé contre Joab et sa lignée
  alternative: Une simple prédiction de ce qui leur arrivera
  rationale: 'Les formes verbales et la construction négative ont ici une valeur jussive : David appelle le jugement sur Joab et souhaite la persistance de ces calamités dans sa maison.'
- issue: Référent implicite de יָחֻלוּ
  choice: « cela », renvoyant à la responsabilité du meurtre et à ses conséquences
  alternative: « qu’ils retombent », avec un référent pluriel non exprimé
  rationale: L’hébreu laisse le référent implicite. Le singulier neutre français conserve cette indétermination tout en reliant naturellement la formule au sang versé mentionné au verset précédent.
translation_notes:
  register: Français moderne, international et digne. La cadence imprécatoire est rendue par deux phrases exclamatives. La répétition de « un homme » clarifie que la malédiction énumère des membres successifs de la maison de Joab, tandis que les notes préservent les ambiguïtés lexicales réelles.
