  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אַבְנֵ֤ר אֶל דָּוִד֙ חֶבְר֔וֹן וְ/אִתּ֖/וֹ עֶשְׂרִ֣ים אֲנָשִׁ֑ים וַ/יַּ֨עַשׂ דָּוִ֧ד לְ/אַבְנֵ֛ר וְ/לַ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: fr
  text: Abner vint auprès de David à Hébron, accompagné de vingt hommes. David donna un festin[a] pour Abner et pour les hommes qui l’accompagnaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prépara un festin » ou « organisa un banquet ».
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint
  rationale: Le verbe בוא peut signifier « venir », « aller » ou « arriver » selon le point de vue. Le récit ayant pour point d’arrivée David à Hébron, « vint » convient naturellement.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: auprès de David à Hébron
  rationale: Le nom « Hébron », sans préposition explicite en hébreu, précise ici le lieu où se trouve David. Cette formulation conserve la destination personnelle et le lieu.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: accompagné de vingt hommes
  rationale: La proposition hébraïque est sans verbe. Cette tournure française rend naturellement la présence des vingt hommes avec Abner, tout en conservant « hommes » pour אֲנָשִׁים dans ce contexte.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: donna un festin
  rationale: L’expression idiomatique française « donner un festin » traduit naturellement עשה + משתה sans imposer une nuance précise entre préparer, organiser et offrir le repas.
- source_word: מִשְׁתֶּה
  choice: festin
  rationale: מִשְׁתֶּה désigne un festin ou un banquet, souvent associé à la boisson. « Festin » reste large et naturel sans expliciter excessivement cette dernière nuance.
- source_word: לְאַבְנֵר וְלָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: pour Abner et pour les hommes qui l’accompagnaient
  rationale: La répétition de « pour » reflète celle de la préposition ל, tandis que « qui l’accompagnaient » rend idiomatiquement אֲשֶׁר אִתּוֹ.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Vint » maintient la tonalité biblique sans archaïsme marqué; « accompagné de » allège la proposition nominale hébraïque. Le marqueur de note est placé après « festin », terme auquel la variante se rapporte.
