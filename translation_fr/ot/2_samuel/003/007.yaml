base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: fr
  text: 'Saül avait une concubine nommée Ritspa, fille d’Aya. Ish-Bosheth dit à Abner : « Pourquoi es-tu allé vers[a] la concubine de mon père ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « Pourquoi as-tu eu des relations avec la concubine de mon père ? » L’hébreu dit « aller vers », euphémisme courant pour désigner des relations sexuelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: Saül avait
  rationale: La construction avec ל exprime ici la possession. « Saül avait » est l’équivalent français naturel, sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: concubine
  rationale: Ce terme français conserve la catégorie sociale désignée par l’hébreu, sans la remplacer par une paraphrase interprétative.
- source_word: וּשְׁמָהּ רִצְפָּה
  choice: nommée Ritspa
  rationale: Formulation française fluide qui garde la fonction identificatrice de « et son nom était Ritspa ».
- source_word: בַת אַיָּה
  choice: fille d’Aya
  rationale: Rend directement le patronyme hébreu.
- source_word: וַיֹּאמֶר אֶל אַבְנֵר
  choice: Ish-Bosheth dit à Abner
  rationale: Le sujet grammatical est implicite en hébreu, mais le contexte immédiat identifie Ish-Bosheth. Le nommer évite une ambiguïté artificielle en français.
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et naturel.
- source_word: בָּאתָה אֶל
  choice: es-tu allé vers
  rationale: Conserve autant que possible l’image et l’euphémisme sexuel de l’expression hébraïque « aller/venir vers », tout en laissant une note en préciser le sens contextuel.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: la concubine de mon père
  rationale: Rend naturellement en français la chaîne possessive hébraïque.
