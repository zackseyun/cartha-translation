  to: 'Abner entra dans une violente colère à cause des paroles d’Ish-Bosheth et dit : « Suis-je donc une tête de chien appartenant à Juda[a] ? Jusqu’à ce jour, j’ai fait preuve de loyauté envers la maison de Saül, ton père, envers ses frères et ses amis, et je ne t’ai pas livré entre les mains de David. Et aujourd’hui, tu m’accuses d’une faute au sujet de cette femme ! »'
