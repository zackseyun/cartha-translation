  source_fidelity: La traduction rend avec justesse la colère intense d’Abner, sa défense rétrospective (« Jusqu’à ce jour »), sa loyauté envers la maison de Saül et l’accusation relative à la femme. Toutefois, « au service de Juda » interprète de manière trop précise l’expression hébraïque difficile אשר ליהודה, qui exprime plus littéralement l’appartenance ou le rattachement à Juda sans spécifier nécessairement un service.
  naturalness: Le français est moderne, fluide et soutenu. « Une tête de chien appartenant à Juda » reste volontairement étrange, à l’image de l’insulte hébraïque, tout en étant grammaticalement clair; la note en explicite la difficulté.
  terminology: « Maison de Saül », « loyauté », « livré entre les mains de David » et « faute » conviennent au contexte politique, juridique et narratif. Le nom Ish-Bosheth est cohérent avec le texte source et l’usage international.
