  text: וַ/יִּחַר֩ לְ/אַבְנֵ֨ר מְאֹ֜ד עַל דִּבְרֵ֣י אִֽישׁ בֹּ֗שֶׁת וַ/יֹּ֨אמֶר֙ הֲ/רֹ֨אשׁ כֶּ֥לֶב אָנֹ֘כִי֮ אֲשֶׁ֣ר לִֽ/יהוּדָה֒ הַ/יּ֨וֹם אֶֽעֱשֶׂה חֶ֜סֶד עִם בֵּ֣ית שָׁא֣וּל אָבִ֗י/ךָ אֶל אֶחָי/ו֙ וְ/אֶל מֵ֣רֵעֵ֔/הוּ וְ/לֹ֥א הִמְצִיתִ֖/ךָ בְּ/יַד דָּוִ֑ד וַ/תִּפְקֹ֥ד עָלַ֛/י עֲוֺ֥ן הָ/אִשָּׁ֖ה הַ/יּֽוֹם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: fr
  text: 'Abner entra dans une violente colère à cause des paroles d’Ish-Bosheth et dit : « Suis-je donc une tête de chien appartenant à Juda[a] ? Jusqu’à ce jour, j’ai fait preuve de loyauté envers la maison de Saül, ton père, envers ses frères et ses amis, et je ne t’ai pas livré entre les mains de David. Et aujourd’hui, tu m’accuses d’une faute au sujet de cette femme ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une tête de chien qui appartient à Juda ». L’expression insultante est difficile à interpréter ; elle peut désigner un homme méprisable rallié au camp de Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: Abner entra dans une violente colère
  rationale: L’expression idiomatique indique que la colère s’enflamme, et מְאֹד en marque l’intensité. La formulation française est naturelle et vigoureuse.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: à cause des paroles d’Ish-Bosheth
  rationale: עַל exprime ici la cause de la colère, tandis que דִּבְרֵי est conservé par « paroles ».
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: Suis-je donc une tête de chien au service de Juda ?
  rationale: « Tête de chien » préserve l’image insultante et difficile de l’hébreu. « Au service de Juda » rend naturellement l’idée d’appartenance ou d’alignement exprimée par אֲשֶׁר לִיהוּדָה sans supprimer son ambiguïté, signalée en note.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: Jusqu’à ce jour, j’ai fait preuve de loyauté
  rationale: Dans la défense rétrospective d’Abner, le premier הַיּוֹם englobe sa conduite antérieure jusqu’au présent et contraste avec le second « aujourd’hui ». חֶסֶד désigne ici une fidélité loyale et agissante plutôt qu’une simple bonté.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: envers la maison de Saül, ton père
  rationale: « Maison » conserve le sens dynastique, et « envers » convient en français avec « faire preuve de loyauté ».
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: envers ses frères et ses amis
  rationale: La traduction conserve le sens premier de « frères » tout en rendant מֵרֵעֵהוּ par le terme français courant « amis ».
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: je ne t’ai pas livré entre les mains de David
  rationale: Cette expression française conserve l’idiome sémitique de la remise au pouvoir d’un autre tout en restant immédiatement compréhensible.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: tu m’accuses d’une faute au sujet de cette femme
  rationale: פקד על associé à עָוֺן évoque le fait de demander compte ou de porter une accusation. Cette formulation préserve la portée judiciaire et morale sans déterminer si Abner reconnaît la faute.
theological_decisions:
- issue: Portée de חֶסֶד dans la fidélité d’Abner à la maison de Saül
  choice: loyauté
  alternative: fidélité à l’alliance
  rationale: Le contexte politique et relationnel exige davantage que « bonté », mais le texte ne nomme pas explicitement une alliance. « Loyauté » garde la force de חֶסֶד sans ajouter une qualification théologique plus précise que l’hébreu.
- issue: Culpabilité d’Abner concernant la femme
  choice: tu m’accuses d’une faute
  alternative: tu me demandes compte de la faute concernant cette femme
  rationale: La formulation présente la parole d’Ish-Bosheth comme une accusation sans trancher la question narrative et morale de la culpabilité réelle d’Abner.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La vive indignation d’Abner est conservée par la question rhétorique, le contraste entre « Jusqu’à ce jour » et « aujourd’hui », ainsi que l’exclamation finale. Le nom Ish-Bosheth suit la forme usuelle fondée sur l’hébreu.
