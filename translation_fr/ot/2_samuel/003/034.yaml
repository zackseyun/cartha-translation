  text: יָדֶ֣/ךָ לֹֽא אֲסֻר֗וֹת וְ/רַגְלֶ֨י/ךָ֙ לֹא לִ/נְחֻשְׁתַּ֣יִם הֻגָּ֔שׁוּ כִּ/נְפ֛וֹל לִ/פְנֵ֥י בְנֵֽי עַוְלָ֖ה נָפָ֑לְתָּ וַ/יֹּסִ֥פוּ כָל הָ/עָ֖ם לִ/בְכּ֥וֹת עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: fr
  text: 'Tes mains n’étaient pas liées,

    et tes pieds n’étaient pas pris dans des entraves de bronze.

    Tu es tombé comme on tombe devant des hommes malfaisants[a].


    Et tout le peuple pleura encore davantage sur lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant des fils d’injustice » ; autre traduction possible : « devant des hommes injustes ».'
    reason: L’expression בְּנֵי עַוְלָה est un idiome hébraïque. La note conserve sa forme littérale et signale une autre formulation française possible.
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: Tes mains n’étaient pas liées
  rationale: Le participe passif de אָסַר exprime l’état de quelqu’un qui a été attaché. « Liées » est naturel en français et maintient le contraste implicite avec un prisonnier.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: et tes pieds n’avaient pas été mis dans des entraves de bronze
  rationale: נְחֻשְׁתַּיִם désigne ici des entraves en bronze ou en cuivre. Le passif « avaient été mis » rend le hofal הֻגָּשׁוּ dans son emploi contextuel, sans reproduire littéralement et artificiellement l’idée d’« approcher » les pieds des entraves.
- source_word: כִּנְפוֹל
  choice: comme on tombe
  rationale: L’infinitif construit précédé de כְּ introduit une comparaison générale. Le pronom indéfini « on » donne une formulation française naturelle.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: devant des hommes malfaisants
  rationale: L’expression hébraïque « fils d’injustice » désigne idiomatiquement des hommes qui commettent le mal. « Hommes malfaisants » communique ce sens en français moderne, tandis que la forme littérale est signalée en note.
- source_word: נָפָלְתָּ
  choice: Tu es tombé
  rationale: Le parfait présente la chute comme un fait tragique accompli. Le passé composé convient au discours direct de lamentation en français actuel.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: Alors tout le peuple pleura encore davantage sur lui
  rationale: יָסַף suivi de l’infinitif indique que l’action reprend, continue ou s’intensifie. Dans ce contexte, après la complainte de David, « encore davantage » exprime naturellement l’intensification des pleurs, tout en conservant « sur lui » pour עָלָיו.
