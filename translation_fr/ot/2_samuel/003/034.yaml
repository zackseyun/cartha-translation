  terminology: « Entraves de bronze » rend bien נְחֻשְׁתַּיִם dans ce contexte. « Hommes malfaisants » communique naturellement l’idiome « fils d’injustice »; la note préserve à juste titre la formulation littérale. Aucun enjeu théologique particulier.
