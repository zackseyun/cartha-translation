base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: fr
  text: Des fils naquirent à David à Hébron, et son premier-né fut Amnon, fils d’Ahinoam de Jizréel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ו/ילדו
  choice: naquirent
  rationale: Le verbe est rendu de manière événementielle et naturelle en français. Le sujet postposé « des fils » respecte le sens du pluriel hébreu sans expliciter les mères comme sujet.
- source_word: לְ/דָוִד
  choice: à David
  rationale: 'La préposition ל exprime ici la relation parentale : ces fils naquirent à David.'
- source_word: בָּנִים
  choice: Des fils
  rationale: Le nom hébreu désigne spécifiquement des enfants de sexe masculin, et non des enfants en général.
- source_word: בְּ/חֶבְרוֹן
  choice: à Hébron
  rationale: La préposition ב est locative ; en français, « à » est l’usage naturel devant un nom de ville.
- source_word: וַ/יְהִי
  choice: et ... fut
  rationale: Cette formulation coordonne naturellement la précision qui suit sans surcharger le waw narratif.
- source_word: בְכוֹר/וֹ
  choice: son premier-né
  rationale: « Premier-né » conserve la notion d’ordre de naissance ainsi que ses possibles implications familiales et juridiques.
- source_word: אַמְנוֹן
  choice: Amnon
  rationale: Translittération française usuelle du nom propre.
- source_word: לַ/אֲחִינֹעַם
  choice: fils d’Ahinoam
  rationale: Dans cette liste généalogique, la préposition indique la maternité. « Fils d’Ahinoam » est clair et idiomatique en français, sans suggérer qu’Amnon serait né « à » sa mère au même sens que la formule précédente.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: de Jizréel
  rationale: Le gentilé féminin indique l’origine d’Ahinoam. « De Jizréel » est naturel en français moderne et conserve exactement cette information.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche de l’avis généalogique hébreu tout en évitant le gentilé français rare ou lourd « Jizréélite ». Aucun marqueur de note n’est nécessaire, puisque « de Jizréel » exprime directement et sans ambiguïté pertinente le féminin gentilice hébreu.
