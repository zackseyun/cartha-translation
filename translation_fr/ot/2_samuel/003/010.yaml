source:
  edition: WLC
  text: לְ/הַֽעֲבִ֥יר הַ/מַּמְלָכָ֖ה מִ/בֵּ֣ית שָׁא֑וּל וּ/לְ/הָקִ֞ים אֶת כִּסֵּ֣א דָוִ֗ד עַל יִשְׂרָאֵל֙ וְ/עַל יְהוּדָ֔ה מִ/דָּ֖ן וְ/עַד בְּאֵ֥ר שָֽׁבַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: fr
  text: pour faire passer le royaume hors de la maison de Saül et établir le trône de David sur Israël et sur Juda, depuis Dan jusqu’à Beer-Shéba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « depuis Dan jusqu’à Beer-Shéba » désigne tout le pays, du nord au sud.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: faire passer
  rationale: Le hiphil de עבר exprime ici le transfert du royaume d’un détenteur à un autre. « Faire passer » conserve l’image verbale de l’hébreu tout en restant naturel en français.
- source_word: הַמַּמְלָכָה
  choice: le royaume
  rationale: Le nom peut désigner le royaume ou l’exercice de la royauté. « Royaume » convient au transfert politique et préserve l’expression concrète du texte.
- source_word: מִבֵּית שָׁאוּל
  choice: de la maison de Saül
  rationale: « Maison » garde l’image biblique du foyer dynastique de Saül sans la réduire explicitement au seul concept de dynastie.
- source_word: וּלְהָקִים
  choice: et établir
  rationale: Au hiphil, קום signifie ici mettre fermement en place. « Établir » s’accorde naturellement avec le trône et avec le registre solennel du passage.
- source_word: אֶת כִּסֵּא דָוִד
  choice: le trône de David
  rationale: La traduction conserve l’image concrète du trône, qui représente l’autorité royale sans l’abstraire en « règne » ou en « royauté ».
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: sur Israël et sur Juda
  rationale: La répétition de « sur » reflète celle de עַל et souligne les deux ensembles politiques distincts.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: depuis Dan jusqu’à Beer-Shéba
  rationale: Cette formulation rend explicitement les deux limites géographiques et reproduit l’expression traditionnelle désignant toute l’étendue du pays du nord au sud.
theological_decisions:
- issue: Langage dynastique de la « maison de Saül » et image royale du « trône de David »
  choice: Conserver les images concrètes de la maison et du trône.
  alternative: Traduire par « dynastie de Saül » et « règne de David ».
  rationale: L’hébreu présente le transfert politique au moyen d’images dynastiques et royales établies. Les conserver maintient la texture du texte sans lui imposer une interprétation théologique ultérieure.
- issue: Complément implicite du transfert
  choice: Expliciter « à celle de David » pour rendre en français le mouvement de transfert annoncé dans le contexte immédiat.
  alternative: S’en tenir à « faire passer le royaume de la maison de Saül », sans indiquer le nouveau détenteur.
  rationale: Le verbe causatif et le parallèle avec l’établissement du trône de David rendent la destination certaine dans le contexte. L’explicitation évite en français une formulation suspendue, tout en conservant la maison comme image dynastique.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve les images bibliques de la maison et du trône, tandis que « depuis… jusqu’à… » rend clairement l’étendue géographique.
