base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: fr
  text: 'Joab et toute l’armée qui était avec lui arrivèrent, et ils informèrent Joab : « Abner, fils de Ner, est venu auprès du roi ; celui-ci l’a laissé repartir, et il s’en est allé en paix. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצָּבָא
  choice: l’armée
  rationale: Dans ce contexte militaire, le terme désigne les troupes placées sous le commandement de Joab.
- source_word: בָּאוּ
  choice: arrivèrent
  rationale: Le verbe indique ici l’arrivée de Joab et de ses troupes, formulation plus naturelle en français que le simple « vinrent ».
- source_word: וַיְשַׁלְּחֵהוּ
  choice: l’a laissé repartir
  rationale: Le piel de שלח peut signifier renvoyer ou laisser partir; le contexte souligne que David a congédié Abner librement.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: La locution conserve le sens de départ sain et sauf et sans hostilité, tout en reprenant l’expression biblique naturelle en français.
theological_decisions:
- issue: Référent du sujet dans « il l’a laissé repartir »
  choice: « le roi, qui l’a laissé repartir »
  alternative: « il l’a laissé repartir »
  rationale: L’explicitation grammaticale identifie naturellement le roi comme sujet sans ajouter d’interprétation théologique.
- issue: Portée de « en paix »
  choice: Conserver littéralement « en paix »
  alternative: « sain et sauf »
  rationale: La formulation garde la richesse possible de שָׁלוֹם, qui peut évoquer à la fois la sécurité et l’absence d’hostilité.
translation_notes:
  register: Français international moderne, narratif et digne. La formule hébraïque לֵאמֹר n’est pas rendue mécaniquement par « en disant »; les deux propositions coordonnées finales sont légèrement restructurées pour une lecture naturelle sans modifier les acteurs ni les événements.
