base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: fr
  text: Tout le peuple s’en rendit compte, et cela leur parut bon[a], comme tout ce que le roi avait fait était bon aux yeux de tout le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « cela leur plut ». Littéralement : « cela fut bon à leurs yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוּ
  choice: s’en rendit compte
  rationale: Le hiphil de נכר peut signifier reconnaître, constater ou discerner. Ici, le complément est implicite et renvoie à la sincérité du roi manifestée par sa conduite ; « s’en rendit compte » l’exprime naturellement sans expliciter davantage.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: cela fut bon à ses yeux
  rationale: Cette formulation conserve l’image de l’idiome hébreu יטב בעיני, qui exprime l’approbation ou le contentement, tout en restant intelligible en français.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: de même, tout ce que le roi avait fait
  rationale: « De même » rend la valeur comparative de כְּ, tandis que le plus-que-parfait situe naturellement en français les actes du roi avant la réaction du peuple.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte hébreu emploie le titre sans nommer David ; la traduction conserve ce choix narratif.
- source_word: טוֹב בְּעֵינֵי כָל־הָעָם
  choice: était bon aux yeux de tout le peuple
  rationale: Cette traduction maintient la répétition lexicale et l’image évaluative du texte hébreu plutôt que de les remplacer par une paraphrase.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le singulier collectif « ses yeux » reprend naturellement « tout le peuple ». La répétition de « bon aux yeux » est conservée afin de refléter la structure et l’insistance de l’hébreu.
