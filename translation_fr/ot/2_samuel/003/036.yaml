  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le peuple perçoit la chose en cause et l''approuve, en continuité avec son appréciation favorable des actes du roi. Le plus-que-parfait « avait fait » est défendable pour le parfait hébreu במסגרת de ce bilan narratif. Toutefois, « de même » force une articulation française peu naturelle et ne rend pas aussi souplement la comparaison introduite par כְּ.'
  naturalness: « Cela fut bon à ses yeux » est peu idiomatique en français moderne et le singulier possessif, après le collectif « tout le peuple », fait entendre un individu. « Cela leur parut bon » est naturel, conserve l'évaluation exprimée par l'hébreu et permet de maintenir la répétition de « bon ».
  terminology: « Le roi » respecte le titre hébreu sans ajouter le nom de David. Aucun terme théologique spécialisé n'est en jeu. L'ancre de note est conservée et la note est corrigée au pluriel, conformément à בעיניהם.
