base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: fr
  text: Quand Abner revint à Hébron, Joab l’entraîna à l’écart, à l’intérieur de la porte, pour lui parler en privé. Là, il le frappa au ventre[a], et Abner mourut à cause du sang d’Asaël, son frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu traditionnellement rendu par « à la cinquième côte »; il s’agit d’une expression idiomatique dont le sens précis est discuté, probablement la région abdominale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב exprime ici le retour d’Abner à Hébron après son départ; « revint » est naturel et précis.
- source_word: וַיַּטֵּהוּ
  choice: l’entraîna à l’écart
  rationale: Au hiphil, נטה peut signifier faire dévier ou détourner. Dans ce contexte, Joab amène Abner à quitter son trajet pour gagner un lieu retiré.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: à l’intérieur de la porte
  rationale: תּוֹךְ désigne l’intérieur ou le milieu, et שַׁעַר l’ensemble architectural de la porte ou son passage. Cette formulation reste proche de l’hébreu sans suggérer le simple battant d’une porte moderne.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: pour lui parler en privé
  rationale: בַּשֶּׁלִי est rare et difficile; il évoque probablement le calme, la discrétion ou l’isolement. « En privé » convient à la scène sans ajouter explicitement l’idée de tromperie.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: là, il le frappa au ventre
  rationale: חֹמֶשׁ désigne dans ces récits la région abdominale où le coup est mortel. « Au ventre » communique clairement ce sens, tandis que la traduction traditionnelle est signalée en note.
- source_word: וַיָּמָת
  choice: et Abner mourut
  rationale: La coordination suit la progression narrative de l’hébreu. La répétition du nom d’Abner évite en français toute hésitation sur le sujet.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: à cause du sang d’Asaël, son frère
  rationale: La préposition בְּ exprime ici la cause ou le motif. La formulation conserve l’image biblique du sang et la nuance de responsabilité ou de vengeance sans expliciter davantage que le texte.
