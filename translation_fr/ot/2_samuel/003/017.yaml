lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: Abner s’était entretenu avec
  rationale: La tournure hébraïque nominale signifie qu’Abner avait communiqué ou parlé avec les anciens. « S’était entretenu avec » restitue naturellement cette idée en français et convient à l’antériorité narrative.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: Depuis quelque temps déjà
  rationale: L’expression idiomatique renvoie au temps passé ou à une volonté déjà ancienne, plutôt qu’aux deux journées précises que suggérerait une traduction mot à mot.
- source_word: מְבַקְשִׁים אֶת דָּוִד לְמֶלֶךְ עֲלֵיכֶם
  choice: vous cherchez à avoir David pour roi
  rationale: Cette formulation conserve le sens actif de « chercher » et rend naturellement en français la construction « David comme roi sur vous ».
