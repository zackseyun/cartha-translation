  text: Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: fr
  text: 'Abner avait parlé avec les anciens d’Israël, en disant : « Depuis quelque temps déjà[a], vous cherchez à avoir David comme roi sur vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « hier comme avant-hier ». L’expression peut désigner les deux jours précédents ou, dans ce contexte, une période déjà écoulée.'
