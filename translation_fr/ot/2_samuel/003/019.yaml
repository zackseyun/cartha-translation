source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר גַּם אַבְנֵ֖ר בְּ/אָזְנֵ֣י בִנְיָמִ֑ין וַ/יֵּ֣לֶךְ גַּם אַבְנֵ֗ר לְ/דַבֵּ֞ר בְּ/אָזְנֵ֤י דָוִד֙ בְּ/חֶבְר֔וֹן אֵ֤ת כָּל אֲשֶׁר טוֹב֙ בְּ/עֵינֵ֣י יִשְׂרָאֵ֔ל וּ/בְ/עֵינֵ֖י כָּל בֵּ֥ית בִּנְיָמִֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: fr
  text: Abner parla aussi à Benjamin[a]. Puis Abner se rendit aussi à Hébron pour exposer à David tout ce qui paraissait bon à Israël et à toute la maison de Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux oreilles de Benjamin » ; c’est-à-dire à la tribu de Benjamin ou à ses représentants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: à
  rationale: L’expression hébraïque signifie littéralement « aux oreilles de », mais, avec le verbe « parler », le français idiomatique emploie simplement « parler à ». La note conserve l’image auditive du texte source.
- source_word: בִנְיָמִין
  choice: Benjamin
  rationale: Le nom désigne ici collectivement la tribu ou ses membres, comme dans l’hébreu, sans qu’il soit nécessaire d’expliciter « les Benjaminites ».
- source_word: לְדַבֵּר
  choice: pour exposer
  rationale: Dans la seconde proposition, le complément développé (« tout ce qui… ») rend « exposer » plus naturel en français que la répétition de « parler », tout en restant proche du sens de דבר.
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: Formulation française naturelle pour le lieu où Abner rencontre David.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: tout ce qui paraissait bon à
  rationale: Cette formulation rend l’idiome hébraïque « bon aux yeux de » sans suggérer nécessairement une approbation morale objective.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom national collectif correspond au texte hébreu et demeure naturel en français.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: toute la maison de Benjamin
  rationale: « Maison » préserve la nuance familiale et politico-tribale de בֵּית, plutôt que de la réduire explicitement à la seule notion de tribu.
- source_word: גַּם ... גַּם
  choice: aussi ... aussi
  rationale: Les deux occurrences sont conservées afin de rendre la structure additive et parallèle de l’hébreu.
- source_word: וַיְדַבֵּר ... וַיֵּלֶךְ
  choice: parla ... se rendit
  rationale: Les passés simples conviennent au registre narratif biblique actuel; « se rendit » exprime naturellement le déplacement vers Hébron.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est légèrement restructurée en deux phrases pour éviter une longue coordination peu naturelle. L’idiome « bon aux yeux de » est rendu par « paraissait bon à », ce qui maintient la dimension subjective du jugement. Le référent collectif « Benjamin » est conservé, avec clarification en note.
