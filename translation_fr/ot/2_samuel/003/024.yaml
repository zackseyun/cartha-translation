base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: fr
  text: 'Joab vint alors trouver le roi et lui dit : « Qu’as-tu fait ? Voilà qu’Abner est venu jusqu’à toi ! Pourquoi donc l’as-tu laissé repartir ? Il est bel et bien parti ![a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « il est allé, allant », tournure emphatique indiquant qu’il est réellement ou complètement parti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: Joab vint alors trouver le roi
  rationale: Le wayyiqtol fait progresser le récit ; « alors » marque naturellement la succession, tandis que « trouver le roi » rend de façon idiomatique le mouvement vers lui.
- source_word: מֶה עָשִׂיתָה
  choice: Qu’as-tu fait ?
  rationale: Le parfait désigne une action accomplie dont Joab reproche immédiatement les conséquences à David.
- source_word: הִנֵּה בָא אַבְנֵר אֵלֶיךָ
  choice: Voilà qu’Abner est venu jusqu’à toi !
  rationale: « Voilà que » conserve la force d’attention et de surprise de הִנֵּה ; « jusqu’à toi » souligne qu’Abner s’était rendu personnellement auprès du roi.
- source_word: לָמָּה זֶּה
  choice: Pourquoi donc
  rationale: « donc » restitue la force rhétorique et accusatrice de la combinaison, sans produire une tournure française artificielle.
- source_word: שִׁלַּחְתּוֹ
  choice: l’as-tu laissé repartir
  rationale: 'Dans ce contexte, le piel de שׁלח signifie renvoyer ou laisser partir. Cette formulation naturelle met en relief le reproche de Joab : David avait Abner auprès de lui et l’a relâché.'
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: Il est bel et bien parti
  rationale: L’infinitif absolu הָלוֹךְ renforce le verbe conjugué. « Bel et bien » exprime en français courant que le départ est certain et accompli.
