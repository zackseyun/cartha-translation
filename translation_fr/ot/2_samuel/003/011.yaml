  text: And he could no longer answer Abner a word[a], because he feared him.
translation:
  language: fr
  text: Il ne pouvait plus répondre un mot à Abner[a], car il le craignait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui répondre quoi que ce soit ». Littéralement, l’hébreu dit « répondre à Abner une parole ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל
  choice: put
  rationale: Le verbe exprime ici la capacité; au passé simple et sous la négation, « ne put » convient au récit.
- source_word: עוֹד
  choice: plus
  rationale: 'Avec la négation, עוֹד indique que la capacité ne subsiste plus: « ne… plus ».'
- source_word: לְהָשִׁיב
  choice: répondre
  rationale: Le hiphil de שוב signifie ici répondre ou répliquer.
- source_word: אֶת־אַבְנֵר
  choice: à Abner
  rationale: Bien qu’Abner soit marqué comme objet direct en hébreu, le verbe français « répondre » se construit naturellement avec « à ».
- source_word: דָּבָר
  choice: un mot
  rationale: « Répondre un mot à quelqu’un » conserve l’image concise de l’idiome hébreu tout en restant compréhensible en français.
- source_word: מִיִּרְאָתוֹ אֹתוֹ
  choice: parce qu’il avait peur de lui
  rationale: La préposition מִן introduit ici la cause; cette formulation française explicite naturellement que la peur d’Abner empêchait la réponse.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple maintient un registre biblique digne sans archaïsme marqué; l’imparfait « avait peur » décrit l’état qui motive l’incapacité.
