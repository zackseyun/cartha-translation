  source_fidelity: 'Le sens essentiel est bien rendu : incapacité de répondre à Abner, causée par la crainte qu’il inspirait. Toutefois, « ne put plus » présente l’incapacité comme un fait ponctuel (« ne réussit pas à »), tandis que לֹא יָכֹל עוֹד décrit plus naturellement un état continu : il n’était/ne pouvait désormais plus en mesure de répondre.'
