review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. La note actuelle décrit הוֹשִׁיעַ comme un impératif singulier et présente une lecture impérative adressée à David, mais cette analyse ne correspond pas de manière sûre à la forme ni à la syntaxe de la proposition telle qu'elle est traduite. En outre, le texte de la WLC habituellement attesté pour ce verset porte אוֹשִׁיעַ (« je sauverai »), ce qui confirme la première personne divine. La traduction principale « je sauverai » est donc à conserver, mais sans la note erronée. « Au sujet de David » est défendable contextuellement, puisque la parole citée désigne David à la troisième personne.
  naturalness: Le français est globalement naturel et d’un registre approprié. « Maintenant donc » est possible, mais « Maintenant, agissez donc » donne plus clairement la transition exhortative. « De l’emprise des Philistins et de celle de tous ses ennemis » rend explicitement et naturellement la double image hébraïque de la « main » hostile.
  terminology: « Yahvé », « mon serviteur » et « Israël » sont appropriés. « Par l’intermédiaire de David » transmet bien l’instrumentalité de בְּיַד; « par David » est plus concis tout en restant clair. « Sauverai » convient au vocabulaire de délivrance, sans ajouter d’interprétation confessionnelle.
  issues:
  - severity: high
    issue: La note de bas de page analyse la forme comme un impératif singulier et propose « Sauve mon peuple Israël ».
    rationale: Cette lecture n'est pas justifiée de manière fiable par le texte et ne correspond pas à la tradition textuelle massorétique normalement attestée ici, qui lit « je sauverai ». Elle crée une ambiguïté grammaticale et théologique inexistante ou, à tout le moins, non étayée par le texte fourni.
  - severity: medium
    issue: La note française ne reflète pas l'alternative documentée dans la piste d'audit anglaise.
    rationale: La piste anglaise traite une question d'agent grammatical (Yahvé ou David), non un impératif adressé à David. Puisque cette alternative elle-même ne repose pas solidement sur la forme massorétique usuelle, il vaut mieux ne pas conserver de note plutôt que de remplacer l'ambiguïté par une analyse fautive.
  - severity: low
    issue: La répétition de l'image de la « main » est quelque peu atténuée dans « du pouvoir des Philistins et de tous ses ennemis ».
    rationale: Une formulation avec « emprise » puis « celle » conserve plus nettement le parallélisme des deux groupes ennemis tout en restant idiomatique en français.
  revised_text: 'Maintenant, agissez donc, car Yahvé a dit au sujet de David : « Par David, mon serviteur, je sauverai mon peuple Israël de l’emprise des Philistins et de celle de tous ses ennemis. »'
  revised_footnotes: []
  revision_rationale: La correction retire la note grammaticalement non fondée, conserve Yahvé comme sujet explicite de « je sauverai », et maintient David comme l’instrument désigné par l’expression « par David, mon serviteur ». Le texte reste proche de l’hébreu, naturel en français international moderne et ne force aucune lecture doctrinale supplémentaire.
