revisions:
- from: 'Maintenant donc, agissez, car Yahvé a déclaré au sujet de David : « Par l’intermédiaire de David, mon serviteur, je sauverai mon peuple Israël du pouvoir des Philistins et de tous ses ennemis. »[a]'
  to: 'Maintenant, agissez donc, car Yahvé a dit au sujet de David : « Par David, mon serviteur, je sauverai mon peuple Israël de l’emprise des Philistins et de celle de tous ses ennemis. »'
  rationale: La correction retire la note grammaticalement non fondée, conserve Yahvé comme sujet explicite de « je sauverai », et maintient David comme l’instrument désigné par l’expression « par David, mon serviteur ». Le texte reste proche de l’hébreu, naturel en français international moderne et ne force aucune lecture doctrinale supplémentaire.
