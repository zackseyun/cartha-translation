base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: fr
  text: 'Maintenant, agissez donc, car Yahvé a dit au sujet de David : « Par David, mon serviteur, je sauverai mon peuple Israël de l’emprise des Philistins et de celle de tous ses ennemis. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Marque une transition pressante vers l’action; « donc » restitue la portée exhortative du tour hébreu.
- source_word: עֲשׂוּ
  choice: agissez
  rationale: Impératif masculin pluriel. Dans ce contexte, il appelle les interlocuteurs à mettre le projet à exécution; « agissez » est direct et naturel en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que substitution par un titre.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: a déclaré au sujet de David
  rationale: Même si אֶל signifie ordinairement « à », la parole citée porte ici sur David et le désigne à la troisième personne comme « mon serviteur »; « au sujet de » rend cette relation contextuelle sans suggérer artificiellement une adresse directe.
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: Par l’intermédiaire de David, mon serviteur
  rationale: L’expression בְּיַד marque ici l’agence ou le moyen. Cette formulation française conserve le rôle instrumental de David sans calquer maladroitement « par la main de ».
- source_word: הוֹשִׁיעַ
  choice: je sauverai
  rationale: Dans le fil de la déclaration divine, cette lecture exprime que Yahvé opérera le salut par David. La vocalisation massorétique peut toutefois être comprise comme un impératif singulier; cette tension est signalée en note.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: du pouvoir des Philistins
  rationale: Littéralement « de la main des Philistins »; dans ce contexte militaire, la main représente la domination ou le pouvoir hostile.
- source_word: וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: et de tous ses ennemis
  rationale: Rend naturellement la répétition de l’idée de délivrance hors du pouvoir ennemi. Le singulier collectif « ses » renvoie à « mon peuple Israël ».
theological_decisions:
- issue: Agent ultime du salut et fonction de David
  choice: Yahvé est présenté comme celui qui sauvera Israël par l’intermédiaire de David.
  alternative: 'Comprendre la forme vocalisée comme un impératif adressé à David : « Sauve mon peuple Israël… »'
  rationale: Le contexte introduit une déclaration de Yahvé et l’expression « par l’intermédiaire de David, mon serviteur » distingue naturellement l’action divine de l’instrument humain. Toutefois, la forme massorétique הוֹשִׁיעַ présente une réelle difficulté grammaticale et peut être lue comme un impératif; la note préserve cette tension au lieu de la supprimer.
- issue: Destinataire ou sujet de la déclaration introduite par אֶל דָּוִד
  choice: « au sujet de David »
  alternative: « à David »
  rationale: Le sens courant de la préposition favoriserait « à David », mais la citation parle de David à la troisième personne. Le contexte soutient donc ici le sens relationnel « au sujet de David », tout en laissant la difficulté liée à la forme verbale être documentée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Agissez » conserve la force de l’impératif pluriel; « par l’intermédiaire de » et « du pouvoir de » rendent clairement deux emplois différents de l’image hébraïque de la main. La note documente l’ambiguïté grammaticale et théologique réelle sans imposer une résolution confessionnelle.
