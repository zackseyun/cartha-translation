source:
  edition: WLC
  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: fr
  text: Quant à moi, aujourd’hui encore, je suis faible, bien que j’aie reçu l’onction royale[a]. Mais ces hommes, les fils de Tserouya, sont trop durs pour moi. Que Yahweh rende à celui qui fait le mal selon le mal qu’il a fait[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et oint roi ». L’adjectif traduit par « faible » peut aussi signifier « tendre » ou « délicat ». Ici, il semble exprimer la vulnérabilité de David malgré son onction comme roi.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Yahweh rendra à celui qui fait le mal selon le mal qu’il a fait. » La forme verbale hébraïque peut aussi être comprise comme un futur simple.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: faible
  rationale: Dans ce contexte, l’adjectif exprime la vulnérabilité et le manque d’autorité pratique de David plutôt que la tendresse morale; « faible » est clair et naturel en français moderne.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: bien que j’aie reçu l’onction royale
  rationale: La juxtaposition de la faiblesse de David et de son statut de roi a une valeur concessive. Cette formulation naturelle conserve l’idée qu’il a été oint comme roi sans suggérer qu’il est en train de recevoir l’onction.
- source_word: בְּנֵי צְרוּיָה
  choice: les fils de Tserouya
  rationale: Cette désignation familiale traditionnelle de Joab et de ses frères préserve la forme et la force rhétorique de l’hébreu.
- source_word: קָשִׁים מִמֶּנִּי
  choice: sont trop durs pour moi
  rationale: קָשִׁים évoque leur dureté ou leur caractère intraitable, tandis que מִמֶּנִּי indique qu’ils dépassent la capacité de David à les maîtriser. « Trop durs pour moi » conserve cette double portée.
- source_word: יְשַׁלֵּם
  choice: Que … rende
  rationale: L’imparfait hébreu peut exprimer ici un souhait ou une imprécation. Le subjonctif français rend naturellement l’appel de David à la justice divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: à celui qui fait le mal
  rationale: Cette formulation reproduit clairement et sans surinterprétation la tournure participiale hébraïque désignant l’auteur du mal.
- source_word: כְּרָעָתוֹ
  choice: selon le mal qu’il a fait
  rationale: Cette expression idiomatique communique une rétribution proportionnée à l’acte mauvais, tout en évitant le français peu naturel « selon son mal ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom divin; « Yahweh » en conserve la valeur de nom propre sans le remplacer par un titre.
- issue: Valeur de la déclaration finale de David
  choice: 'Souhait ou imprécation : « Que Yahweh rende… »'
  alternative: 'Prédiction : « Yahweh rendra… »'
  rationale: Le contexte permet de comprendre la forme verbale comme un appel à la justice divine, mais la valeur prédictive reste grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe met en relief le contraste entre la faiblesse présente de David et son statut royal. « Trop durs pour moi » conserve à la fois la dureté des fils de Tserouya et l’incapacité de David à les maîtriser. Les ambiguïtés de רַךְ et de יְשַׁלֵּם sont explicitement préservées en notes.
