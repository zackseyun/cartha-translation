source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל עֲבָדָ֑י/ו הֲ/ל֣וֹא תֵדְע֔וּ כִּי שַׂ֣ר וְ/גָד֗וֹל נָפַ֛ל הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: fr
  text: 'Puis le roi dit à ses serviteurs : « Ne savez-vous pas qu’un chef[a], un grand homme, est tombé aujourd’hui en Israël ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un prince », « un commandant » ou « un haut responsable ». Le mot hébreu שַׂר peut désigner diverses formes d’autorité politique ou militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait avancer le récit. « Puis » exprime naturellement cette progression en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du nom défini ; le contexte permet d’identifier David sans ajouter son nom.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עֶבֶד désigne couramment un serviteur, y compris dans un cadre royal. « Serviteurs » reste proche du terme hébreu sans préciser indûment leur fonction officielle.
- source_word: הֲלוֹא תֵדְעוּ
  choice: Ne savez-vous pas
  rationale: La particule interrogative associée à la négation introduit une question rhétorique qui attend une réponse affirmative.
- source_word: כִּי
  choice: que
  rationale: Ici, כִּי introduit le contenu de ce que les interlocuteurs sont censés savoir.
- source_word: שַׂר
  choice: chef
  rationale: שַׂר peut désigner un prince, un commandant, un dirigeant ou un haut responsable. Dans le cas d’Abner, « chef » exprime son rang politique et militaire sans lui attribuer nécessairement un titre princier.
- source_word: וְגָדוֹל
  choice: un grand homme
  rationale: L’adjectif גָּדוֹל est employé substantivement et souligne ici la stature et l’importance personnelle d’Abner. La juxtaposition « un chef, un grand homme » rend naturellement l’hébreu tout en conservant son emphase.
- source_word: נָפַל
  choice: est tombé
  rationale: « Tomber » est ici une manière élevée et intelligible de parler de la mort, qui conserve l’image de l’hébreu.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Rend naturellement l’expression hébraïque littérale « ce jour ».
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition בְּ situe la perte dans la sphère nationale d’Israël.
theological_decisions:
- issue: Nature du rang attribué à Abner par שַׂר
  choice: chef
  alternative: prince
  rationale: Le terme hébreu est assez large et ne contraint pas à comprendre un titre dynastique. « Chef » préserve l’importance politique et militaire d’Abner ainsi que l’ambiguïté lexicale du texte.
translation_notes:
  register: Français moderne, digne et accessible. La question rhétorique est conservée, de même que l’image solennelle de la mort comme une chute. La ponctuation appositive dans « un chef, un grand homme » reflète le double éloge hébreu sans alourdir la phrase.
