source:
  edition: WLC
  text: וַ/יְקֹנֵ֥ן הַ/מֶּ֛לֶךְ אֶל אַבְנֵ֖ר וַ/יֹּאמַ֑ר הַ/כְּ/מ֥וֹת נָבָ֖ל יָמ֥וּת אַבְנֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: fr
  text: 'Le roi prononça une complainte sur Abner et dit : « Abner devait-il mourir comme meurt un insensé[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Abner devait-il mourir comme la mort d’un insensé ? » Le terme hébreu peut désigner une personne moralement vile ou méprisable.'
    reason: La note signale à la fois la forme inhabituelle de la comparaison hébraïque et la nuance morale possible de נָבָל.
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: prononça une complainte
  rationale: Le verbe קונן désigne l’action de faire entendre une lamentation ou une complainte funèbre. Cette formulation française conserve le caractère formel et poétique du deuil sans réduire le verbe au sens général de « pleurer ».
- source_word: אֶל
  choice: sur
  rationale: Avec un verbe de lamentation, אֶל introduit ici la personne qui fait l’objet de la complainte. « Sur Abner » est idiomatique en français dans ce contexte.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le syntagme nominal défini est rendu directement, sans remplacer le titre par le nom de David.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Le verbe narratif ordinaire אמר introduit les paroles de la complainte; la traduction garde donc le simple verbe « dire ».
- source_word: הַכְּמוֹת
  choice: comme meurt
  rationale: L’expression compare la mort d’Abner à celle d’un insensé. « Comme meurt » restitue naturellement en français la construction comparative tout en gardant sa forme poétique.
- source_word: נָבָל
  choice: un insensé
  rationale: נָבָל évoque une personne déraisonnable, moralement vile ou méprisable, et non seulement quelqu’un qui manque d’intelligence. « Insensé » conserve la résonance biblique et la portée morale du terme.
- source_word: יָמוּת
  choice: devait-il mourir
  rationale: L’imparfait hébreu s’inscrit dans une interrogation rhétorique de lamentation. « Devait-il mourir » exprime en français la protestation douloureuse plutôt qu’une simple demande d’information.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Le nom propre est conservé sous sa forme française traditionnelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. « Prononça une complainte » marque le genre funèbre du propos; l’interrogation rhétorique conserve la douleur et la protestation du texte sans en résoudre davantage le sens.
