  text: וַ/אֲחִיתֹ֣פֶל רָאָ֗ה כִּ֣י לֹ֣א נֶעֶשְׂתָה֮ עֲצָת/וֹ֒ וַ/יַּחֲבֹ֣שׁ אֶֽת הַ/חֲמ֗וֹר וַ/יָּ֜קָם וַ/יֵּ֤לֶךְ אֶל בֵּית/וֹ֙ אֶל עִיר֔/וֹ וַ/יְצַ֥ו אֶל בֵּית֖/וֹ וַ/יֵּחָנַ֑ק וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קֶ֥בֶר אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: fr
  text: Quand Ahitophel vit que son conseil n’avait pas été suivi[a], il sella l’âne, se leva et partit chez lui, dans sa ville. Il donna ses instructions à sa maisonnée[b], puis se pendit[c] et mourut. Il fut enterré dans le tombeau de son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « que son conseil n’avait pas été mis à exécution ». Littéralement : « que son conseil n’avait pas été fait ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « Il mit sa maison en ordre ». L’hébreu dit plus littéralement qu’il donna des instructions à sa maison ou à sa maisonnée.
    reason: lexical_alternative
  - marker: c
    text: Ou « s’étrangla ». Le verbe peut désigner la mort par pendaison ou par strangulation ; dans ce contexte, il décrit le suicide d’Ahitophel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ ... לֹא נֶעֶשְׂתָה
  choice: son conseil n’avait pas été suivi
  rationale: Le tour signifie littéralement que son conseil « n’avait pas été fait ». En français, « n’avait pas été suivi » exprime naturellement que l’avis stratégique n’a pas été mis en œuvre, tout en laissant en note l’alternative plus proche de la forme hébraïque.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: il sella l’âne
  rationale: חבש, avec un âne, désigne le fait de le seller ou de le préparer pour le voyage. L’article défini hébreu est conservé sans introduire un possessif absent du texte.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: se leva et partit
  rationale: Cette formulation rend la succession narrative avec un français actuel et digne; « partit » convient mieux ici que le simple « alla » au départ d’un voyage.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: chez lui, dans sa ville
  rationale: Le second complément précise le premier. La formulation française conserve les deux éléments sans reproduire maladroitement le double אֶל.
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: Il donna ses instructions à sa maisonnée
  rationale: Le verbe צוה signifie « ordonner, donner des instructions » et בֵּיתוֹ peut désigner sa maison au sens de maisonnée. Cette traduction reste proche de la syntaxe hébraïque sans imposer l’interprétation idiomatique « mit ses affaires en ordre ».
- source_word: וַיֵּחָנַק
  choice: se pendit
  rationale: Le nifal est compris comme réfléchi dans ce récit de suicide. Le verbe peut évoquer la pendaison ou l’étranglement; « se pendit » est naturel en contexte, tandis que l’ambiguïté lexicale est signalée en note.
- source_word: בְּקֶבֶר אָבִיו
  choice: dans le tombeau de son père
  rationale: קֶבֶר peut désigner une tombe ou un tombeau. « Tombeau » convient au cadre d’une sépulture familiale et maintient la référence explicite au père.
theological_decisions:
- issue: Nature précise de la mort exprimée par וַיֵּחָנַק
  choice: se pendit
  alternative: s’étrangla
  rationale: Le contexte indique un acte suicidaire, mais le lexème ne permet pas de préciser avec une certitude absolue le mécanisme de la mort. Le texte principal emploie l’expression française la plus naturelle et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases suivent la progression sobre de l’hébreu tout en évitant des calques peu naturels. « Maisonnée » garde le sens collectif de בַּיִת et distingue les personnes du bâtiment; les notes préservent les ambiguïtés lexicales réelles.
