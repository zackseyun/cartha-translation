base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: fr
  text: 'Lorsque Houshaï arriva auprès d’Absalom, Absalom lui dit : « Ahitofel a parlé ainsi. Devons-nous suivre son avis[a] ? Sinon, parle, toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ferons-nous sa parole ? », c’est-à-dire : mettrons-nous son conseil à exécution ?'
    reason: La note conserve la formulation idiomatique et légèrement inhabituelle de l’hébreu derrière la traduction naturelle « suivre son avis ».
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva auprès de
  rationale: Dans ce récit, le verbe בוא fait avancer la narration et indique le mouvement de Houshaï vers Absalom. « Arriva auprès de » est naturel en français et rend אֶל sans suggérer nécessairement l’entrée dans un lieu.
- source_word: חוּשַׁי
  choice: Houshaï
  rationale: Translittération française usuelle et lisible du nom hébreu.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: lui dit
  rationale: Le français n’a pas besoin de reproduire séparément l’infinitif « en disant » ; « lui dit » rend naturellement l’introduction du discours.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: a parlé ainsi
  rationale: Cette formulation concise exprime le contenu ou la manière du conseil qui vient d’être donné, tout en gardant la valeur démonstrative de הַזֶּה.
- source_word: הֲנַעֲשֶׂה אֶת דְּבָרוֹ
  choice: Devons-nous suivre son avis ?
  rationale: La question est délibérative. Littéralement, l’hébreu demande s’il faut « faire sa parole », c’est-à-dire mettre à exécution le conseil d’Ahitofel ; « suivre son avis » transmet clairement cet idiome sans ajouter de précision étrangère au contexte.
- source_word: אִם אַיִן
  choice: Sinon
  rationale: Rend de façon concise et idiomatique l’alternative conditionnelle hébraïque.
- source_word: אַתָּה דַבֵּר
  choice: parle, toi
  rationale: Le pronom indépendant אַתָּה est emphatique. Le pronom disjoint placé après l’impératif conserve cette insistance en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le dialogue reste direct et concis ; « parle, toi » préserve l’emphase de l’hébreu sans développer la demande.
