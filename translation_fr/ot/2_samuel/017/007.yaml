  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: fr
  text: 'Alors Houshaï dit à Absalom : « Le conseil qu’Ahitophel a donné cette fois-ci n’est pas bon. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » en restitue naturellement la progression en français moderne.
- source_word: חוּשַׁי
  choice: Houshaï
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: à Absalom
  rationale: La préposition אֶל introduit ici le destinataire de la parole.
- source_word: לֹא טוֹבָה
  choice: n’est pas bon
  rationale: Rendu large et direct de l’évaluation hébraïque, sans la restreindre à « judicieux » ou « solide ».
- source_word: הָעֵצָה
  choice: le conseil
  rationale: עֵצָה désigne ici l’avis stratégique donné à Absalom ; « conseil » convient au contexte politique et militaire.
- source_word: אֲשֶׁר יָעַץ
  choice: qu’... a donné
  rationale: La tournure française idiomatique « donner un conseil » évite la répétition maladroite d’un équivalent comme « le conseil qu’il a conseillé » tout en conservant l’action accomplie.
- source_word: אֲחִיתֹפֶל
  choice: Ahitophel
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בַּפַּעַם הַזֹּאת
  choice: cette fois-ci
  rationale: Expression idiomatique qui conserve le contraste implicite avec d’autres occasions et rend précisément la portée circonstancielle de la phrase.
