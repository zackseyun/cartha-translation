  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: fr
  text: 'Alors Ahitofel dit à Absalom : « Permets-moi, je te prie, de choisir douze mille hommes, de me lever et de poursuivre David cette nuit. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Je veux choisir, je te prie, douze mille hommes, me lever et poursuivre David cette nuit. »'
    reason: La série de cohortatifs peut être rendue comme une demande portant sur l’ensemble des actions, ou plus directement par des formes à la première personne qui expriment la volonté d’Ahitofel.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » rend naturellement cette succession en français moderne.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Forme française usuelle du nom propre hébreu.
- source_word: אֶל־אַבְשָׁלֹם
  choice: à Absalom
  rationale: La préposition indique le destinataire de la parole; « Absalom » est la forme française usuelle du nom.
- source_word: אֶבְחֲרָה נָּא
  choice: Permets-moi, je te prie, de choisir
  rationale: Le cohortatif accompagné de נָא exprime ici une demande ou une proposition pressante mais polie. Cette formulation en conserve à la fois la force volitive et la nuance de politesse.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: douze mille hommes
  rationale: Traduction directe qui n’ajoute pas le terme plus précis de « soldats », même si le contexte est militaire.
- source_word: וְאָקוּמָה
  choice: de me lever
  rationale: Le cohortatif de קוּם prolonge la proposition d’Ahitofel. « Me lever » conserve l’image hébraïque tout en restant intelligible.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: et de poursuivre David
  rationale: רדף avec אַחֲרֵי désigne une poursuite. En français, « poursuivre David » exprime naturellement l’ensemble sans redondance.
- source_word: הַלָּיְלָה
  choice: cette nuit
  rationale: L’expression désigne la nuit présente; « cette nuit » est l’équivalent français naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la politesse de נָא, la valeur volitive des cohortatifs et le vocabulaire non spécifiquement militaire de אִישׁ.
