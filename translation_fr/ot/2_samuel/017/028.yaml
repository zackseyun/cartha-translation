lexical_decisions:
- source_word: מִשְׁכָּב
  choice: literie
  rationale: Le nom désigne ce sur quoi l’on se couche. Dans cette liste de fournitures, le collectif français « literie » rend naturellement la forme hébraïque au singulier sans imposer l’idée de cadres de lit.
- source_word: סַפּוֹת
  choice: bassins
  rationale: Le terme désigne vraisemblablement des récipients utilitaires, bassins ou grands bols. « Bassins » convient au contexte domestique, tandis que l’autre possibilité est conservée en note.
- source_word: כְלִי יוֹצֵר
  choice: récipients en terre cuite
  rationale: L’expression signifie littéralement « récipient(s) de potier » et désigne des objets en céramique. La formulation choisie est claire et idiomatique en français moderne.
- source_word: חִטִּים
  choice: blé
  rationale: Équivalent français usuel de cette céréale.
- source_word: שְׂעֹרִים
  choice: orge
  rationale: Équivalent français usuel de cette céréale.
- source_word: קֶמַח
  choice: farine
  rationale: Le terme désigne du grain moulu; « farine » est ici l’équivalent moderne le plus clair.
- source_word: קָלִי
  choice: grain grillé
  rationale: Ce produit alimentaire est du grain préparé par grillage. La traduction est naturelle et conserve la répétition du mot hébreu aux deux endroits.
- source_word: פּוֹל
  choice: fèves
  rationale: Le terme hébreu désigne vraisemblablement la fève, plutôt que les haricots au sens large.
- source_word: עֲדָשִׁים
  choice: lentilles
  rationale: Équivalent français usuel de la légumineuse nommée.
- source_word: קָלִי
  choice: grain grillé
  rationale: La seconde occurrence est rendue comme la première afin de préserver la répétition explicite du texte hébreu.
