base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: fr
  text: Jonathan et Ahimaats se tenaient à En-Roguel. Une servante allait les informer, et ils se rendaient ensuite auprès du roi David pour l’informer, car ils ne pouvaient pas être vus en entrant dans la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹמְדִים
  choice: se tenaient
  rationale: Le participe de עמד signifie littéralement « se tenant debout », mais, avec un lieu, il peut exprimer le fait de demeurer ou d’être posté quelque part. « Se tenaient » reste proche de l’image hébraïque tout en étant naturel en français.
- source_word: בְּעֵין רֹגֵל
  choice: près d’Èn-Roguel
  rationale: Le nom de lieu est translittéré. La préposition בְּ marque ici la localisation; « près de » convient au contexte géographique de la source située hors de la ville.
- source_word: הַשִּׁפְחָה
  choice: une servante
  rationale: שִׁפְחָה désigne spécifiquement une servante, éventuellement une esclave. « Une servante » exprime clairement son sexe et sa fonction sans préciser plus que le contexte son statut juridique; l’indéfini est naturel lors de son introduction dans le récit.
- source_word: וְהָלְכָה וְהִגִּידָה לָהֶם
  choice: allait les informer
  rationale: Dans cette description d’un dispositif de transmission, les formes verbales présentent une action prévue ou répétée. L’imparfait français rend naturellement ce fonctionnement, et « informer » convient à la remise d’un message.
- source_word: וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: puis eux allaient informer
  rationale: La séquence poursuit la chaîne prévue de communication. « Puis » explicite la succession portée par les verbes coordonnés, tandis que « eux » conserve le contraste avec la servante.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette construction titre-nom se rend naturellement en français par « le roi David ».
- source_word: כִּי לֹא יוּכְלוּ
  choice: car ils ne pouvaient pas
  rationale: כִּי introduit ici la raison du dispositif. « Car » conserve clairement cette relation explicative.
- source_word: לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: se montrer en entrant dans la ville
  rationale: Le nifal de ראה peut signifier « être vu » ou « se montrer/apparaître ». Le français « se montrer en entrant » conserve la nuance réflexive possible et indique que leur entrée dans la ville ne devait pas être remarquée.
