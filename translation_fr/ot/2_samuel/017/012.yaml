base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: fr
  text: Alors nous marcherons contre lui, dans l’un des endroits où on le trouvera, et nous nous poserons sur lui[a], comme la rosée tombe sur le sol. Il ne restera pas même un seul homme, ni de lui ni de tous les hommes qui sont avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous nous abattrons sur lui ». Le verbe hébreu signifie littéralement « se poser, se déposer, reposer sur »; dans cette image militaire, il évoque une armée qui couvre entièrement sa cible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: Alors nous marcherons contre lui
  rationale: Le verbe בוא signifie fondamentalement « venir », mais le contexte militaire et le complément introduit par אֶל donnent ici à l’approche une intention hostile. « Marcher contre lui » rend cette valeur sans transformer l’expression en attaque déjà accomplie.
- source_word: בְאַחַת הַמְּקוֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: dans l’un des endroits où il se trouvera
  rationale: Cette formulation conserve l’idée d’un endroit parmi plusieurs possibles. En français, « où il se trouvera » rend naturellement le passif hébreu נִמְצָא dans ce contexte.
- source_word: וְנַחְנוּ עָלָיו
  choice: et nous nous poserons sur lui
  rationale: Le verbe נוח signifie « se poser, se déposer, reposer ». Cette traduction préserve son contraste avec נפל, « tomber », employé ensuite pour la rosée, tout en maintenant l’image d’une force couvrante et écrasante.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: comme la rosée tombe sur le sol
  rationale: La traduction directe conserve la comparaison et le verbe distinct נפל, « tomber ».
- source_word: וְלֹא נוֹתַר ... גַּם אֶחָד
  choice: il ne restera pas même un seul survivant
  rationale: Le Niphal de יתר exprime ce qui reste ou survit. « Pas même un seul survivant » restitue l’insistance finale de גַּם אֶחָד et clarifie l’issue militaire.
- source_word: בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: De lui et de tous les hommes qui sont avec lui
  rationale: La construction étend explicitement la menace de David à l’ensemble des hommes qui l’accompagnent; « hommes » convient au groupe masculin armé visé dans le contexte.
theological_decisions: []
