base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: fr
  text: La femme prit alors une couverture, l’étendit sur l’ouverture du puits et répandit dessus du grain concassé. Ainsi, on ne remarqua rien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: אִשָּׁה peut désigner une femme ou une épouse. Ici, le récit présente cette personne comme la femme de la maison; « la femme » reste naturel et n’ajoute pas une relation conjugale non explicitée dans le verset.
- source_word: הַמָּסָךְ
  choice: une couverture
  rationale: מָסָךְ désigne ce qui couvre, notamment une tenture ou un écran. « Une couverture » conserve cette généralité sans préciser indûment la matière de l’objet.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: sur l’ouverture du puits
  rationale: L’expression signifie littéralement « sur la face du puits ». En français, « l’ouverture du puits » désigne clairement et naturellement la partie qui est recouverte.
- source_word: וַתִּשְׁטַח
  choice: répandit
  rationale: Le verbe שטח signifie étendre ou répandre quelque chose sur une surface. « Répandit » convient naturellement au grain placé sur la couverture.
- source_word: הָרִפוֹת
  choice: du grain concassé
  rationale: רִפוֹת désigne vraisemblablement des grains écrasés ou pilés. « Du grain concassé » est compréhensible en français moderne et préserve le détail agricole sans employer un terme rare.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: Ainsi, on ne remarqua rien
  rationale: La formulation hébraïque est littéralement « et aucune chose ne fut connue ». Dans cette scène de dissimulation, elle indique que rien ne fut découvert ou remarqué. « Ainsi » exprime naturellement le résultat contextuel sans présenter explicitement celui-ci comme le but de l’action.
