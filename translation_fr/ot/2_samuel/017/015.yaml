base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: fr
  text: 'Houshaï dit alors aux prêtres Tsadok et Abiatar : « Voici en substance[a] ce qu’Ahitofel a conseillé à Absalom et aux anciens d’Israël, et voici en substance ce que j’ai conseillé, moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ainsi et ainsi ». Cette expression hébraïque rapporte la teneur de paroles sans les répéter mot pour mot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit ; « alors » exprime naturellement cette succession en français moderne.
- source_word: חוּשַׁי
  choice: Houshaï
  rationale: Transcription française usuelle du nom hébreu.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: aux prêtres Tsadok et Abiatar
  rationale: Cette formulation française naturelle rattache clairement « prêtres » aux deux hommes, tout en conservant leurs noms.
- source_word: כָּזֹאת וְכָזֹאת
  choice: voici en substance
  rationale: L’expression hébraïque, littéralement « comme ceci et comme ceci », introduit un résumé de propos déjà tenus plutôt qu’une citation mot à mot. « Voici en substance » en rend le sens dans un français actuel et digne.
- source_word: יָעַץ
  choice: a conseillé
  rationale: Dans ce contexte politique et militaire, le verbe désigne l’action de donner un avis stratégique ; « conseiller » conserve ce sens sans lourdeur.
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: à Absalom et aux anciens d’Israël
  rationale: Le français construit naturellement « conseiller » avec « à » lorsqu’il signifie recommander une ligne d’action à quelqu’un.
- source_word: וְכָזֹאת וְכָזֹאת
  choice: et voici en substance
  rationale: La répétition identique maintient le parallélisme et le contraste entre l’avis d’Ahitofel et celui de Houshaï.
- source_word: יָעַצְתִּי אָנִי
  choice: ce que j’ai conseillé, moi
  rationale: Le pronom indépendant אָנִי met le locuteur en relief. La dislocation « moi » préserve cette insistance de façon naturelle en français.
