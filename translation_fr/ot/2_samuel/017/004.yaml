  yaml_path: translation/ot/2_samuel/017/004.yaml
  text: The proposal seemed good in the eyes of Absalom and in the eyes of all the elders of Israel[a].
translation:
  language: fr
  text: Cette proposition parut bonne aux yeux d’Absalom et aux yeux de tous les anciens d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Cette affaire fut jugée bonne par Absalom et par tous les anciens d’Israël. »'
    reason: Alternative lexicale qui reflète plus directement הַדָּבָר et la valeur évaluative de וַיִּישַׁר בְּעֵינֵי.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: parut bonne
  rationale: Le verbe ישר, associé à l’expression בְּעֵינֵי, indique ici qu’une chose paraît bonne, plaît ou reçoit l’approbation, sans nécessairement porter un jugement moral abstrait sur sa droiture.
- source_word: הַדָּבָר
  choice: cette proposition
  rationale: Dans le contexte narratif, le terme désigne le conseil qui vient d’être donné. « Cette proposition » explicite naturellement ce référent tout en restant dans le champ de sens de « parole, affaire, chose ».
- source_word: בְּעֵינֵי ... וּבְעֵינֵי
  choice: aux yeux de ... et aux yeux de
  rationale: La répétition conserve l’image et l’insistance de l’idiome hébreu, tout en restant claire et naturelle en français moderne.
- source_word: אַבְשָׁלֹם
  choice: Absalom
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: כָּל
  choice: tous
  rationale: Rend directement le quantificateur hébreu et porte ici sur l’ensemble des anciens mentionnés.
- source_word: זִקְנֵי
  choice: les anciens
  rationale: Le terme désigne les responsables reconnus d’Israël, et non simplement des hommes âgés. « Les anciens » est la désignation française habituelle et précise.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française standard du nom du peuple.
theological_decisions: []
