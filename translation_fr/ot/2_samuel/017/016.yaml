base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: fr
  text: 'Maintenant, envoyez vite prévenir David en lui disant : « Ne passe pas la nuit dans les plaines du désert[a] ; traverse sans faute, de peur que le roi et tout le peuple qui est avec lui ne soient engloutis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux gués du désert ». Le mot hébreu désigne habituellement des plaines ou des steppes désertiques, mais le contexte immédiat, qui insiste sur la traversée, peut évoquer les gués du Jourdain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque le passage à l’action urgente et conserve l’immédiateté du discours.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: envoyez vite quelqu’un
  rationale: L’impératif pluriel et l’expression d’urgence sont rendus naturellement ; l’objet implicite de « envoyer » est explicité au minimum en français.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: 'avertir David :'
  rationale: Dans ce contexte de danger imminent, « avertir » exprime naturellement la communication urgente. Les deux verbes coordonnés hébreux forment en français une seule construction idiomatique, et les deux-points remplacent la formule « en disant ».
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: Ne passe pas la nuit
  rationale: Rend directement et idiomatiquement le verbe לון, « passer la nuit, loger ».
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: dans les plaines du désert
  rationale: Le substantif עֲרָבוֹת désigne normalement des plaines ou steppes désertiques. Cette valeur lexicale est retenue sans imposer l’interprétation contextuelle « gués ».
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: traverse sans faute
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’ordre. « Sans faute » en restitue clairement la force en français moderne.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Construction française naturelle pour introduire le danger que l’ordre vise à éviter.
- source_word: יְבֻלַּע
  choice: ne soient engloutis
  rationale: Préserve l’image vive du passif de בלע tout en convenant à la menace militaire.
- source_word: לַמֶּלֶךְ וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: le roi et tout le peuple qui est avec lui
  rationale: Conserve le titre « le roi », le sens large de עָם et la proposition relative du texte source.
