  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : urgence, interdiction de passer la nuit, ordre emphatique de traverser et menace d’être « engloutis ». « Plaines du désert » est lexiquement préférable à « gués » pour עַרְבוֹת, dont l’identification précise demeure contextuellement discutée.'
