base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: fr
  text: Absalom établit Amasa à la tête de l’armée à la place de Joab. Amasa était fils d’un homme nommé Yitra, l’Israélite[a]. Cet homme s’était uni à Abigaïl, fille de Nahash et sœur de Tserouya, mère de Joab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Yitra, l’Israélite ». En 1 Chroniques 2.17, on lit « Yéter, l’Ismaélite ».
    reason: Variante textuelle dans le passage parallèle.
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: établit ... à la tête de l’armée
  rationale: Cette formulation française naturelle exprime la nomination d’Amasa comme chef de l’armée et rend l’autorité indiquée par עַל.
- source_word: תַּחַת יוֹאָב
  choice: à la place de Joab
  rationale: Dans ce contexte, תַּחַת marque le remplacement et non une position spatiale.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: fils d’un homme nommé Yitra
  rationale: La formulation conserve le caractère indéfini de אִישׁ tout en intégrant naturellement en français l’indication du nom.
- source_word: הַיִּשְׂרְאֵלִי
  choice: l’Israélite
  rationale: Le texte massorétique fourni porte « l’Israélite »; la variante de 1 Chroniques 2.17 est signalée en note sans corriger silencieusement le texte.
- source_word: אֲשֶׁר בָּא אֶל
  choice: qui s’était uni à
  rationale: L’expression hébraïque est ici un euphémisme désignant une union sexuelle. « S’était uni à » reste digne et compréhensible sans devenir inutilement explicite.
- source_word: אֲבִיגַל בַּת נָחָשׁ אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: Abigaïl, fille de Nahash et sœur de Tserouya, mère de Joab
  rationale: Cette syntaxe conserve les liens familiaux du texte hébreu tout en évitant une succession d’appositions difficile à suivre en français.
