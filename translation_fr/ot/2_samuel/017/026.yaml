  text: Israël et Absalom établirent leur camp dans le pays de Galaad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַן
  choice: établirent leur camp
  rationale: Le verbe חנה désigne l’installation d’un camp. Cette tournure est naturelle en français moderne et conserve le contexte militaire. Le pluriel rend l’accord avec les deux sujets coordonnés, malgré le singulier du verbe hébreu qui précède.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne ici collectivement les Israélites ralliés à Absalom. Le conserver sans explicitation respecte la formulation et la portée politique de l’hébreu.
- source_word: וְאַבְשָׁלֹם
  choice: et Absalom
  rationale: La conjonction associe Absalom à Israël comme sujet de l’action. La forme française usuelle du nom propre est conservée.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: dans le pays de Galaad
  rationale: אֶרֶץ suivi du nom géographique désigne le pays ou le territoire de Galaad. « Le pays de Galaad » est transparent, idiomatique et fidèle à l’expression source.
