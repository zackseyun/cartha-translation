review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement la séquence principale : après le départ d’un groupe précédemment mentionné, les messagers sortent du puits, avertissent David et lui transmettent l’ordre urgent de franchir les eaux, car Ahitofel a donné un conseil hostile. « Cours d’eau » est possible, mais réduit le pluriel hébreu « les eaux » et précise légèrement la nature de l’obstacle.'
  naturalness: La formulation est globalement naturelle. Toutefois, « Après leur départ, ils remontèrent » fait facilement comprendre que les mêmes personnes sont à la fois parties et remontées du puits. Le changement explicite de sujet vers « les messagers » reflète le contexte immédiat et évite cette ambiguïté française sans résoudre indûment l’antécédent du pronom hébreu.
  terminology: « Ahitofel », « le roi David », « Levez-vous » et « conseillé contre vous » conviennent au registre narratif moderne et soutenu. « Les eaux » conserve mieux l’expression hébraïque, sans identifier le Jourdain ni imposer « cours d’eau ».
  issues:
