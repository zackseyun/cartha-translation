    issue: Ambiguïté référentielle maladroite dans « Après leur départ, ils remontèrent du puits »
    rationale: En français, la reprise immédiate par « ils » tend à attribuer les deux actions au même groupe, alors que le contexte distingue ceux qui sont partis des messagers qui sortent du puits. Employer « les messagers » clarifie la syntaxe française sans ajouter de contenu substantiel.
  - severity: low
    issue: « le cours d’eau » singularise et concrétise légèrement « les eaux »
    rationale: Le texte hébreu porte « les eaux ». « Les eaux » maintient cette formulation sans désigner explicitement le Jourdain.
