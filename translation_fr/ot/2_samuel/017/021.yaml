base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: fr
  text: 'Après leur départ, les messagers remontèrent du puits, allèrent informer le roi David et lui dirent : « Levez-vous et traversez vite les eaux, car voici ce qu’Ahitofel a conseillé contre vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְּאֵר
  choice: le puits
  rationale: Correspond au sens ordinaire du nom hébreu et au lieu où les messagers s’étaient cachés dans le contexte immédiat.
- source_word: ק֣וּמוּ
  choice: Levez-vous
  rationale: Rend l’impératif pluriel de קום dans un français naturel et soutenu; David représente ici le groupe appelé à partir.
- source_word: אֶת הַמַּיִם
  choice: le cours d’eau
  rationale: Littéralement « les eaux »; dans le contexte, il s’agit de l’obstacle aquatique à franchir, probablement le Jourdain. « Cours d’eau » reste naturel sans expliciter un nom absent du texte.
- source_word: כִּי כָכָה יָעַץ עֲלֵיכֶם
  choice: car voici ce qu’Ahitofel a conseillé contre vous
  rationale: Préserve à la fois la formule ככה, le verbe « conseiller », et la nuance hostile de עֲלֵיכֶם dans ce contexte.
theological_decisions:
- issue: Nature exacte des « eaux » à traverser
  choice: Ne pas identifier explicitement le Jourdain dans le texte
  alternative: « traversez vite le Jourdain »
  rationale: Le contexte peut désigner le Jourdain, mais le verset hébreu dit seulement « les eaux »; la traduction évite donc d’ajouter une identification interprétative.
- issue: Portée du conseil d’Ahitofel
  choice: « conseillé contre vous »
  alternative: « conseillé à votre sujet »
  rationale: Le contexte rend le conseil hostile à David; « contre vous » conserve cette force sans détailler ici le contenu du plan.
translation_notes:
  register: Français international moderne, clair et digne. Le récit est resserré en une phrase fluide, sans perdre la succession des actions. Le vouvoiement pluriel convient à David et à ceux qui l’accompagnent.
