base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: fr
  text: Alors David et tout le peuple qui était avec lui se levèrent et traversèrent le Jourdain. À la lumière du matin[a], il n’en manquait pas un seul qui n’ait traversé le Jourdain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à la lumière du matin » ; l’expression hébraïque conserve l’image de la lumière matinale et indique le moment auquel la traversée était achevée.'
    reason: alternative lexicale et précision temporelle
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום signifie couramment « se lever ». Ce choix conserve le mouvement du récit sans ajouter l’idée plus interprétative de « partir ».
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: avec tout le peuple qui était avec lui
  rationale: « Peuple » rend הָעָם sans limiter indûment le groupe aux hommes adultes. La formulation française exprime naturellement que tous les accompagnateurs de David se mirent en mouvement avec lui.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: ils traversèrent le Jourdain
  rationale: עבר suivi du complément direct désigne ici simplement la traversée du fleuve. « Traversèrent » est précis et naturel en français actuel.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: À la lumière du matin
  rationale: Cette formulation conserve l’image explicite de la lumière (אוֹר) tout en indiquant le moment auquel la traversée était achevée. Une note signale la valeur plus littérale de עַד.
- source_word: עַד אַחַד לֹא נֶעְדָּר
  choice: il n’en manquait pas un seul
  rationale: 'La tournure rend l’insistance de עַד אַחַד et le sens de נֶעְדָּר : aucune personne du groupe ne manquait à l’appel.'
- source_word: אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: qui n’ait traversé le Jourdain
  rationale: 'Le subjonctif après « pas un seul qui » restitue naturellement en français la construction négative hébraïque : personne ne resta sans avoir traversé.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « avec lui » suit la structure du texte hébreu sans alourdir excessivement la phrase. La double formulation négative de la dernière proposition est conservée sous une forme idiomatique afin de préserver l’insistance du texte source.
