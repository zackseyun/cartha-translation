revisions:
- from: Je fondrai sur lui pendant qu’il est fatigué et découragé[a]. Je le frapperai de terreur ; alors tous ceux qui sont avec lui s’enfuiront, et je frapperai le roi seul.
  to: J’irai l’attaquer pendant qu’il est fatigué et découragé[a]. Je le terrifierai ; alors toute la troupe qui est avec lui s’enfuira, et je ne frapperai que le roi.
  rationale: La révision évite la nuance non nécessaire de soudaineté, rend explicitement le causatif de חרד dans un français courant, maintient la portée collective de הָעָם, et lève l’ambiguïté française concernant le roi comme unique cible. La note conserve l’image hébraïque et l’ambivalence force/courage de « faible des mains ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T16:08:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l’attaque projetée vise un adversaire fatigué et affaibli, sa mise en panique, la fuite de ses gens, puis le roi comme cible unique. « Je fondrai sur lui » ajoute toutefois une nuance de soudaineté que בוא על n’impose pas. La formulation finale « je frapperai le roi seul » est ambiguë en français : elle peut décrire le roi comme étant seul, plutôt que le roi comme unique cible.'
  naturalness: Le français est globalement naturel et de registre approprié. « Je le frapperai de terreur » est compréhensible, mais « je le terrifierai » rend plus directement et naturellement le causatif hébreu. « Toute la troupe qui est avec lui » conserve mieux la valeur collective de הָעָם que « tous ceux qui sont avec lui ».
  terminology: « Fatigué » rend bien יגע. « Découragé » est une interprétation recevable de רפה ידיים, et la note conserve justement l’image et l’amplitude force/courage. « Le roi » doit être maintenu sans nommer David.
  issues:
  - severity: medium
    issue: Ambiguïté de « je frapperai le roi seul »
    rationale: לבדו souligne que le roi est l’unique cible. En français, l’adjectif « seul » placé après « le roi » peut plutôt signifier que le roi est isolé. « Je ne frapperai que le roi » rend sans ambiguïté la focalisation de l’hébreu.
  - severity: low
    issue: Nuance ajoutée par « Je fondrai sur lui »
    rationale: Cette expression évoque normalement une attaque soudaine et impétueuse. Le verbe hébreu signifie d’abord venir contre/sur quelqu’un dans un contexte hostile, sans exiger cette nuance.
  revised_text: J’irai l’attaquer pendant qu’il est fatigué et découragé[a]. Je le terrifierai ; alors toute la troupe qui est avec lui s’enfuira, et je ne frapperai que le roi.
  revised_footnotes:
