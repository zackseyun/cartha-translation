  text: וְ/אָב֣וֹא עָלָ֗י/ו וְ/ה֤וּא יָגֵ֨עַ֙ וּ/רְפֵ֣ה יָדַ֔יִם וְ/הַֽחֲרַדְתִּ֣י אֹת֔/וֹ וְ/נָ֖ס כָּל הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וְ/הִכֵּיתִ֥י אֶת הַ/מֶּ֖לֶךְ לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: fr
  text: J’irai l’attaquer pendant qu’il est fatigué et découragé[a]. Je le terrifierai ; alors toute la troupe qui est avec lui s’enfuira, et je ne frapperai que le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faible des mains », expression évoquant une perte de force ou de courage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: Je fondrai sur lui
  rationale: בוא avec עַל exprime ici une arrivée hostile. « Fondre sur lui » rend naturellement l’idée d’une attaque soudaine tout en conservant l’image du mouvement.
- source_word: יָגֵעַ
  choice: fatigué
  rationale: L’adjectif désigne la fatigue résultant de l’effort ; « fatigué » est clair, actuel et adapté au contexte militaire.
- source_word: וּרְפֵה יָדַיִם
  choice: découragé[a]
  rationale: L’expression signifie littéralement « faible des mains » et évoque une perte de force ou de courage. « Découragé » en communique clairement la valeur idiomatique, tandis que la note conserve l’image hébraïque et son amplitude.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: Je le frapperai de terreur
  rationale: 'Le hifil de חרד a une valeur causative : faire trembler ou terrifier. Cette formulation française exprime cette causalité dans un registre digne et naturel.'
- source_word: וְנָס כָּל הָעָם אֲשֶׁר אִּתּוֹ
  choice: alors tous ceux qui sont avec lui s’enfuiront
  rationale: « Alors » explicite sans excès le rapport de conséquence suggéré par l’enchaînement. « Tous ceux » rend הָעָם naturellement dans ce contexte de groupe accompagnant David.
- source_word: וְהִכֵּיתִי
  choice: je frapperai
  rationale: נכה peut signifier frapper, abattre ou tuer selon le contexte. « Frapperai » préserve la formulation du texte sans rendre explicite une issue létale que le verbe seul ne formule pas nécessairement.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini et le titre sont conservés ; le contexte identifie David, mais le texte dit « le roi ».
- source_word: לְבַדּוֹ
  choice: seul
  rationale: Le terme souligne que le roi sera isolé et constituera l’unique cible de l’attaque.
