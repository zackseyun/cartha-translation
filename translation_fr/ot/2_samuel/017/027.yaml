  text: וַ/יְהִ֕י כְּ/ב֥וֹא דָוִ֖ד מַחֲנָ֑יְמָ/ה וְ/שֹׁבִ֨י בֶן נָחָ֜שׁ מֵ/רַבַּ֣ת בְּנֵֽי עַמּ֗וֹן וּ/מָכִ֤יר בֶּן עַמִּיאֵל֙ מִ/לֹּ֣א דְבָ֔ר וּ/בַרְזִלַּ֥י הַ/גִּלְעָדִ֖י מֵ/רֹגְלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: fr
  text: Lorsque David arriva à Mahanaïm, Shobi, fils de Nahash, de Rabba des Ammonites, Makir, fils d’Ammiel, de Lo-Debar, et Barzillaï, le Galaadite, de Roguelim,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Lorsque … arriva
  rationale: La construction narrative וַיְהִי suivie de כ avec l’infinitif construit de בוא introduit ici une circonstance temporelle. « Lorsque … arriva » la rend naturellement sans ajouter un marqueur comme « Or ».
- source_word: מַחֲנָיְמָה
  choice: à Mahanaïm
  rationale: Le ה directionnel indique un mouvement vers le lieu; en français, « à Mahanaïm » convient avec le verbe « arriver ».
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: Shobi, fils de Nahash
  rationale: Les noms propres sont translittérés et la relation patronymique est conservée explicitement.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: de Rabba des Ammonites
  rationale: Rabba est le nom de la ville, et « les Ammonites » rend naturellement la désignation ethnique בְּנֵי עַמּוֹן.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Makir, fils d’Ammiel
  rationale: Translittération française usuelle des noms et conservation du patronyme.
- source_word: מִלֹּא דְבָר
  choice: de Lo-Debar
  rationale: Le nom de lieu est translittéré; la préposition מִן marque la provenance.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzillaï, le Galaadite
  rationale: Le gentilé indique l’origine régionale de Barzillaï et se rend de façon concise par « le Galaadite ».
- source_word: מֵרֹגְלִים
  choice: de Roguelim
  rationale: Le nom de lieu est translittéré selon une forme adaptée au français, et la provenance exprimée par מִן est conservée.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La virgule finale est conservée parce que le verset forme une proposition suspendue dont l’action principale se poursuit au verset 28. Les appositions et indications de provenance suivent étroitement la structure hébraïque tout en restant lisibles en français.
