base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: fr
  text: Même un homme valeureux, dont le cœur est comme celui d’un lion, perdra complètement courage[a]. Car tout Israël sait que ton père est un vaillant guerrier et que ceux qui sont avec lui sont des hommes valeureux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète le verbe : « fondre, il fondra », une tournure intensive que l’on peut aussi rendre par « perdra assurément courage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל
  choice: l’homme valeureux
  rationale: L’expression signifie littéralement « fils de vaillance/force » et désigne ici un homme réputé pour son courage militaire. « Homme valeureux » est naturel et digne en français.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: dont le cœur est comme celui d’un lion
  rationale: Cette formulation conserve la comparaison explicite et l’image du lion présentes dans l’hébreu.
- source_word: הִמֵּס יִמָּס
  choice: sentira son courage fondre complètement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. Cette traduction garde la métaphore de la fonte tout en exprimant clairement, en français, la perte de courage.
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit ici la raison qui justifie l’affirmation précédente.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: tout Israël sait
  rationale: Traduction directe de la connaissance générale et établie exprimée par la construction hébraïque.
- source_word: גִבּוֹר
  choice: un vaillant guerrier
  rationale: Le terme présente David comme un homme puissant et aguerri dans un contexte militaire.
- source_word: וּבְנֵי חַיִל אֲשֶׁר אִתּוֹ
  choice: ceux qui sont avec lui sont des hommes valeureux
  rationale: La formulation conserve le lien lexical avec le singulier בֶּן חַיִל du début du verset et rend explicitement la proposition relative.
