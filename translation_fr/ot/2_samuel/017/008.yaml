  source_fidelity: La traduction rend correctement l’adresse à Absalom, la valeur militaire de גִּבֹּרִים, l’expression מָרֵי נֶפֶשׁ, l’opposition finale concernant le fait de passer la nuit avec la troupe, et le cadre rural de בַּשָּׂדֶה. Toutefois, l’hébreu emploie דאָב au masculin générique et le participe שַׁכּוּל est masculin ; « ourse » explicite une maternité que cette formulation précise ne marque pas. Il convient de conserver l’ambiguïté du texte source avec « ours ».
