  text: וַ/יֹּ֣אמֶר חוּשַׁ֗י אַתָּ֣ה יָ֠דַעְתָּ אֶת אָבִ֨י/ךָ וְ/אֶת אֲנָשָׁ֜י/ו כִּ֧י גִבֹּרִ֣ים הֵ֗מָּה וּ/מָרֵ֥י נֶ֨פֶשׁ֙ הֵ֔מָּה כְּ/דֹ֥ב שַׁכּ֖וּל בַּ/שָּׂדֶ֑ה וְ/אָבִ֨י/ךָ֙ אִ֣ישׁ מִלְחָמָ֔ה וְ/לֹ֥א יָלִ֖ין אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: fr
  text: 'Houshaï dit : « Tu connais ton père et ses hommes : ce sont de vaillants guerriers, pleins d’amertume[a], comme un ours privé de ses petits dans la campagne. De plus, ton père est un homme de guerre ; il ne passera pas la nuit avec les troupes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « amers d’âme » ; on pourrait aussi traduire « furieux » ou « féroces ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec le peuple » ; dans ce contexte, le mot désigne vraisemblablement les hommes qui constituent la troupe de David.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: de vaillants guerriers
  rationale: Le terme exprime force et vaillance, ici dans un contexte nettement militaire. Cette formulation est naturelle en français moderne.
- source_word: מָרֵי נֶפֶשׁ
  choice: pleins d’amertume
  rationale: La formulation conserve l’image intérieure de l’hébreu, littéralement liée à l’amertume de l’âme, tout en restant compréhensible ; le contexte lui donne une nuance de fureur dangereuse.
- source_word: כְּדֹב שַׁכּוּל
  choice: comme une ourse privée de ses petits
  rationale: Le féminin « ourse » rend explicite l’image maternelle impliquée par la perte des petits et transmet la férocité proverbiale de la comparaison.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: Dans ce contexte, שָׂדֶה désigne l’espace ouvert plutôt qu’un champ cultivé précis ; « dans la campagne » est idiomatique et naturel.
- source_word: אִישׁ מִלְחָמָה
  choice: un homme de guerre
  rationale: Rendu formel et intelligible qui caractérise David comme combattant expérimenté sans réduire l’expression au simple titre de « guerrier ».
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: il ne passera pas la nuit avec les troupes
  rationale: לין signifie passer la nuit ou loger. Dans le cadre militaire, הָעָם désigne ici vraisemblablement la troupe qui accompagne David.
- source_word: יָדַעְתָּ
  choice: Tu connais
  rationale: Le verbe porte ici sur la connaissance du caractère et des capacités du père d’Absalom et de ses hommes ; « connaître » convient mieux que « savoir » avec ces compléments personnels.
- source_word: אֲנָשָׁיו
  choice: ses hommes
  rationale: Traduction directe qui laisse le contexte militaire préciser qu’il s’agit des compagnons combattants de David.
