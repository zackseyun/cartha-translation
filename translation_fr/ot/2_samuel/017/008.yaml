  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé, ainsi que l’intensité de מָרֵי נֶפֶשׁ, sans employer le calque peu idiomatique « amers d’âme » dans le corps du texte. Les deux notes sont signalées par leurs marqueurs dans le texte principal.
