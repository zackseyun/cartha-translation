  terminology: « Houshaï », « vaillants guerriers », « homme de guerre » et « troupes » sont cohérents avec le contexte et ne surinterprètent pas les termes hébreux. La note a rend utilement compte du littéral et des nuances possibles ; la note b explique avec prudence le sens contextuel de « peuple ».
