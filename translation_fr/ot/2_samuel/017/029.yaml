base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: fr
  text: 'Ils apportèrent à David et au peuple qui était avec lui du miel, du lait caillé[a], des moutons[b] et du fromage de vache[c], pour qu’ils mangent. Car ils se dirent : « Le peuple a faim, est fatigué et a soif dans le désert. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du beurre ». Le terme hébreu peut désigner un produit laitier de façon plus large, mais il renvoie vraisemblablement ici à du lait caillé plutôt qu’au beurre moderne.
    reason: lexical_alternative
  - marker: b
    text: Ou « du petit bétail ». Le terme hébreu peut englober les moutons et les chèvres.
    reason: lexical_alternative
  - marker: c
    text: Le sens exact de l’expression hébraïque est incertain. Elle désigne probablement un produit laitier provenant du gros bétail; certains la rendent plus généralement par « produits laitiers » ou « lait caillé de vache ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: miel
  rationale: C’est le sens courant du terme; « sirop » demeure possible dans certains contextes, mais « miel » convient naturellement à cette liste de provisions.
- source_word: חֶמְאָה
  choice: lait caillé
  rationale: Le terme désigne vraisemblablement ici un produit laitier caillé plutôt que le beurre battu moderne.
- source_word: צֹאן
  choice: moutons
  rationale: Le mot peut englober les ovins et les caprins; « moutons » offre une formulation concise et naturelle, tandis qu’une note conserve la portée collective possible.
- source_word: שְׁפוֹת בָּקָר
  choice: fromage de vache
  rationale: La tournure hébraïque obscure paraît désigner un produit laitier provenant du gros bétail. Cette traduction reste concrète sans préciser indûment le procédé de fabrication.
- source_word: הִגִּישׁוּ
  choice: ils apportèrent
  rationale: Le verbe signifie littéralement « faire approcher » et, dans ce contexte d’approvisionnement, se rend naturellement par « apporter ».
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: à David et au peuple qui était avec lui
  rationale: Cette formulation reproduit clairement les deux destinataires et la proposition relative.
- source_word: לֶאֱכֹל
  choice: afin qu’ils aient de quoi manger
  rationale: L’infinitif exprime le but. Cette tournure française explicite naturellement que les provisions leur sont destinées comme nourriture.
- source_word: כִּי אָמְרוּ
  choice: En effet, ils s’étaient dit
  rationale: כִּי introduit la raison de l’action. Le plus-que-parfait restitue naturellement en français la réflexion antérieure à l’apport des vivres.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: a souffert de la faim, de la fatigue et de la soif
  rationale: Cette formulation idiomatique conserve les trois états coordonnés sans en augmenter l’intensité.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans ce récit, « désert » désigne naturellement en français une région sauvage et peu habitée, sans impliquer nécessairement une étendue de sable.
