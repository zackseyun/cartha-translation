  text: וְ/אִם אֶל עִיר֙ יֵֽאָסֵ֔ף וְ/הִשִּׂ֧יאוּ כָֽל יִשְׂרָאֵ֛ל אֶל הָ/עִ֥יר הַ/הִ֖יא חֲבָלִ֑ים וְ/סָחַ֤בְנוּ אֹת/וֹ֙ עַד הַ/נַּ֔חַל עַ֛ד אֲשֶֽׁר לֹא נִמְצָ֥א שָׁ֖ם גַּם צְרֽוֹר־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: fr
  text: Et s’il se retire dans une ville, tout Israël apportera des cordes à cette ville. Nous la traînerons jusqu’au ravin[a], jusqu’à ce qu’on n’y trouve plus même un caillou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au torrent » ou « jusqu’au lit du torrent ». Le mot hébreu peut désigner un cours d’eau, souvent saisonnier, ainsi que son lit ou le ravin qu’il traverse.
    reason: lexical_alternative
  - marker: b
    text: Ou « pas même une petite pierre ». Cette image hyperbolique évoque une destruction totale.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: se retire
  rationale: Le nifal de אסף décrit ici le repli de David dans une ville. « Se retire » exprime naturellement ce mouvement militaire sans préciser au-delà de l’hébreu qu’il y chercherait refuge.
- source_word: וְהִשִּׂיאוּ
  choice: apportera
  rationale: Dans ce contexte, la forme causative avec חֲבָלִים évoque le transport des cordes jusqu’à la ville. Le singulier s’accorde en français avec le collectif « tout Israël ».
- source_word: חֲבָלִים
  choice: des cordes
  rationale: Le terme désigne concrètement des cordes destinées, dans cette image hyperbolique, à tirer la ville.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: Nous la traînerons
  rationale: סחב signifie tirer ou traîner avec force. Le pronom est rendu selon son référent, « la ville », féminin en français, malgré le suffixe masculin de l’hébreu.
- source_word: הַנַּחַל
  choice: le ravin
  rationale: נחל peut désigner un torrent, son lit ou le ravin qu’il parcourt. « Ravin » rend clairement le relief visé, tandis qu’une note conserve les autres possibilités.
- source_word: גַּם צְרוֹר
  choice: plus même un caillou
  rationale: צְרוֹר désigne ici une petite pierre ou un caillou. La tournure exprime l’image hyperbolique d’une destruction si totale que rien ne resterait sur place.
