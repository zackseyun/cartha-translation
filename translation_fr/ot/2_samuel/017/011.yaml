base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: fr
  text: 'Mais voici mon conseil : que tout Israël se rassemble assurément auprès de toi, depuis Dan jusqu’à Beer-Shéba, aussi nombreux que le sable au bord de la mer, et que tu marches toi-même au combat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « et ta face allant au combat » ; cette expression souligne que tu dois t’y rendre toi-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָעַצְתִּי
  choice: Mais voici mon conseil
  rationale: Dans le contexte, כִּי introduit la contre-proposition de Houshaï, tandis que יָעַצְתִּי exprime l’acte de conseiller. Cette formulation française rend naturellement le contraste et la force du discours sans imposer au parfait hébreu une valeur temporelle artificielle.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: que … se rassemble sans faute
  rationale: L’infinitif absolu suivi du verbe de même racine renforce l’idée verbale. « Sans faute » restitue cette insistance dans un français naturel.
- source_word: עָלֶיךָ
  choice: auprès de toi
  rationale: Avec אסף, la préposition על indique ici le rassemblement auprès d’un chef ou autour de lui. « Auprès de toi » conserve cette nuance sans suggérer une attaque dirigée contre Absalom.
- source_word: כָל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Expression collective désignant l’ensemble du peuple mobilisé, ici envisagé comme force militaire.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: depuis Dan jusqu’à Beer-Shéba
  rationale: Cette formule géographique conventionnelle désigne toute l’étendue d’Israël, de son extrémité nord à son extrémité sud.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: aussi nombreux que le sable au bord de la mer
  rationale: La formulation explicite naturellement en français l’idée d’une multitude immense tout en conservant l’image hébraïque.
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: et que tu marches toi-même
  rationale: Littéralement, le texte parle de « ta face » allant, tournure qui souligne la présence personnelle d’Absalom. « Toi-même » en restitue l’emphase.
- source_word: בַּקְרָב
  choice: au combat
  rationale: קְרָב désigne ici l’affrontement militaire. Avec « marcher », « au combat » exprime naturellement le fait de prendre personnellement part à l’expédition.
theological_decisions: []
