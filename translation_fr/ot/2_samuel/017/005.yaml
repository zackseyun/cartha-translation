  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם קְרָ֣א נָ֔א גַּ֖ם לְ/חוּשַׁ֣י הָ/אַרְכִּ֑י וְ/נִשְׁמְעָ֥ה מַה בְּ/פִ֖י/ו גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: fr
  text: 'Alors Absalom dit : « Appelez aussi, je vous prie, Houshaï l''Arkite, et écoutons ce que lui aussi a à dire.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qui est dans sa bouche, lui aussi ». Cette expression signifie : « ce qu''il a à dire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit; « Alors » en restitue naturellement la valeur séquentielle.
- source_word: קְרָא נָא
  choice: Appelez ..., je vous prie
  rationale: L'impératif accompagné de נָא exprime ici une demande courtoise; cette tournure reste digne et naturelle en français.
- source_word: גַּם
  choice: aussi
  rationale: Le premier גַּם ajoute Houshaï au conseiller déjà entendu.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Houshaï l'Arkite
  rationale: Le nom propre et le gentilé sont translittérés selon des formes françaises transparentes et proches de l'hébreu.
- source_word: וְנִשְׁמְעָה
  choice: et écoutons
  rationale: La forme cohortative à la première personne du pluriel exprime une proposition ou une exhortation commune.
- source_word: מַה בְּפִיו
  choice: ce qu'il ... a à dire
  rationale: L'expression littérale « ce qui est dans sa bouche » désigne idiomatiquement les paroles ou l'avis de quelqu'un.
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: Cette formulation conserve l'insistance additive portée par le second גַּם.
