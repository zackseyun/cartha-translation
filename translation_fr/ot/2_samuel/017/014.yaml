  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: fr
  text: 'Absalom et tous les hommes d’Israël dirent : « Le conseil de Houshaï l’Arkite vaut mieux que celui d’Ahitofel. » En effet, Yahweh avait ordonné[a] de faire échouer le bon conseil d’Ahitofel, afin de faire venir sur Absalom le malheur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avait décidé de faire échouer ». Le verbe hébreu signifie souvent « commander » ou « ordonner »; ici, il exprime la détermination efficace de Yahweh concernant le conseil d’Ahitofel.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « malheur » peut aussi signifier « mal » ou « calamité »; ici, il désigne la ruine qui doit frapper Absalom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dirent
  rationale: Le sujet composé appelle le pluriel en français. Le passé simple convient au récit soutenu et fait avancer la narration.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: et tous les hommes d’Israël
  rationale: L’expression singulière à valeur collective désigne ici l’ensemble des hommes d’Israël présents; la formulation conserve cette référence genrée.
- source_word: טוֹבָה ... מֵעֲצַת
  choice: vaut mieux que
  rationale: L’adjectif prend une valeur comparative devant מִן. « Vaut mieux que » exprime naturellement l’évaluation d’un conseil en français.
- source_word: עֲצַת
  choice: le conseil de / celui de
  rationale: « Conseil » conserve à la fois le sens d’avis donné et celui de stratégie. La reprise par « celui » évite une répétition lourde sans perte de sens.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Houshaï l’Arkite
  rationale: Transcription française claire du nom propre et du gentilé hébreux.
- source_word: וַיהוָה
  choice: En effet, Yahweh
  rationale: La proposition explique la raison profonde du jugement formulé par Absalom et les hommes d’Israël. « En effet » rend cette relation explicative; le tétragramme est transcrit « Yahweh ».
- source_word: צִוָּה
  choice: avait décidé
  rationale: Le verbe signifie couramment « commander », mais décrit ici la détermination efficace de Yahweh à l’égard d’un conseil. « Avait décidé » reste naturel sans imposer une terminologie doctrinale particulière.
- source_word: לְהָפֵר
  choice: de faire échouer
  rationale: Le hiphil de פרר indique ici que le conseil est rendu inefficace ou mis en échec.
- source_word: הַטּוֹבָה
  choice: le bon
  rationale: La traduction directe maintient l’évaluation positive du conseil d’Ahitofel, malgré son échec voulu par Yahweh.
- source_word: לְבַעֲבוּר
  choice: afin de
  rationale: Cette locution exprime naturellement en français la finalité portée par l’hébreu.
- source_word: הָבִיא ... אֶל
  choice: faire venir ... sur
  rationale: Cette formulation conserve l’image causative et le mouvement exprimés par le verbe hébreu, tout en restant intelligible.
- source_word: הָרָעָה
  choice: le malheur
  rationale: Dans ce contexte, רָעָה désigne une calamité ou une issue funeste frappant Absalom, tout en gardant une part de la largeur sémantique de « mal ».
theological_decisions:
- issue: Traduction de יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin personnel; sa transcription le distingue d’un titre et suit directement l’hébreu.
- issue: Portée de צִוָּה לְהָפֵר
  choice: avait décidé de faire échouer
  alternative: avait ordonné de faire échouer
  rationale: La formulation affirme clairement la détermination souveraine et efficace de Yahweh sans préciser un intermédiaire non mentionné ni importer un système doctrinal.
- issue: Sens de הָרָעָה dans l’action divine
  choice: le malheur
  alternative: le mal / la calamité
  rationale: « Malheur » désigne ici le désastre qui doit atteindre Absalom. La note signale néanmoins l’étendue sémantique du terme hébreu au lieu d’effacer la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient le registre narratif biblique sans archaïsme marqué. Les deux notes rendent visibles les principales possibilités lexicales et préservent la tension entre la bonté stratégique du conseil d’Ahitofel, la décision divine de le faire échouer et le malheur destiné à Absalom.
