lexical_decisions:
- source_word: בָּא
  choice: arriva
  rationale: Le qal accompli de בוא exprime ici l’arrivée de David à la destination indiquée; « arriva » est naturel dans un récit français.
- source_word: מַחֲנָיְמָה
  choice: à Mahanaïm
  rationale: Le hé directionnel marque un mouvement vers ce lieu; avec « arriver », le français l’exprime naturellement par « à ».
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: traversa le Jourdain
  rationale: עבר avec le Jourdain comme complément direct désigne clairement la traversée du fleuve.
- source_word: הוּא וְכָל־אִישׁ יִשְׂרָאֵל עִמּוֹ
  choice: avec tous les hommes d’Israël
  rationale: La formulation française intègre naturellement l’accompagnement exprimé par « lui, et tous les hommes d’Israël avec lui », sans en modifier le référent collectif masculin.
