base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: fr
  text: 'Je ramènerai vers toi tout le peuple[a] : le retour de tous sera comme celui de l’homme que tu recherches; tout le peuple sera en paix.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de la proposition suivante est difficile; littéralement, il comporte les mots « comme le retour de tous, l’homme que tu recherches ». Le sens semble être que, si l’homme recherché est écarté, tous les autres reviendront.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Je ramènerai
  rationale: Le hifil de שׁוב exprime ici l’action de faire revenir le peuple; « ramener » rend naturellement cette valeur causative.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: עָם désigne le peuple ou l’ensemble des partisans concernés. « Peuple » conserve la formulation générale de l’hébreu sans préciser indûment « armée ».
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition indique la direction du retour vers Absalom; « vers toi » est naturel dans ce contexte.
- source_word: כְּשׁוּב הַכֹּל
  choice: quand tous reviendront
  rationale: La construction hébraïque est elliptique et difficile. Cette formulation conserve l’idée centrale du retour de tous sans reproduire une syntaxe obscure en français.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: l’homme que tu recherches
  rationale: La traduction maintient le singulier et la relative, qui désignent David comme la cible précise d’Ahitofel.
- source_word: כָל הָעָם יִהְיֶה שָׁלוֹם
  choice: Tout le peuple sera en paix
  rationale: שָׁלוֹם évoque ici la paix et la sécurité collectives après la fin du conflit; cette tournure est claire et idiomatique en français.
theological_decisions:
- issue: Sort implicite de « l’homme que tu recherches »
  choice: ne sera plus là
  alternative: sera mort / aura disparu
  rationale: Le contexte indique qu’Ahitofel compte tuer David, mais le texte hébreu de ce verset est elliptique. « Ne sera plus là » transmet l’opposition implicite entre le retour de tous et l’élimination du seul homme recherché, sans ajouter explicitement « mort » au texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La phrase principale privilégie une équivalence optimale afin de rendre intelligible l’ellipse hébraïque, tandis que la note conserve la difficulté réelle du texte source.
