base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: fr
  text: 'Les serviteurs d’Absalom vinrent chez la femme et lui dirent : « Où sont Ahimaats et Jonathan ? » Elle leur répondit : « Ils ont traversé le cours d’eau[a]. » Ils les cherchèrent, mais ne les trouvèrent pas, puis ils retournèrent à Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le ruisseau » ou « le canal ». L’expression hébraïque est inhabituelle, et la nature exacte du passage d’eau reste incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: les serviteurs d’Absalom
  rationale: עֶבֶד peut désigner un esclave, un serviteur ou un agent. Ici, il s’agit d’hommes au service d’Absalom; « serviteurs » convient au contexte sans préciser indûment leur statut.
- source_word: אֶל הָאִשָּׁה הַבַּיְתָה
  choice: à la maison de la femme
  rationale: Le hé directionnel de הַבַּיְתָה exprime le mouvement vers la maison. Cette formulation française rend naturellement l’arrivée au lieu où se trouve la femme, sans imposer qu’ils soient entrés dans la maison.
- source_word: אַיֵּה אֲחִימַעַץ וִיהוֹנָתָן
  choice: Où sont Ahimaats et Jonathan ?
  rationale: L’interrogatif porte sur le lieu où se trouvent les deux hommes; le pluriel est donc requis en français. « Ahimaats » est une transcription française usuelle du nom hébreu.
- source_word: עָבְרוּ
  choice: Ils ont traversé
  rationale: עבר signifie ici passer ou traverser. Le passé composé est naturel dans la réponse directe en français moderne.
- source_word: מִיכַל הַמָּיִם
  choice: le cours d’eau
  rationale: La forme hébraïque est inhabituelle et son interprétation exacte demeure incertaine. « Cours d’eau » conserve l’idée générale sans préciser s’il s’agit d’un ruisseau ou d’un canal.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: Ils les cherchèrent, mais ne les trouvèrent pas
  rationale: בקשׁ désigne ici la recherche des deux hommes. Le pronom objet, implicite en hébreu, est exprimé en français; « mais » rend naturellement l’échec de la recherche.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: puis ils retournèrent à Jérusalem
  rationale: שׁוב signifie revenir ou retourner. « Puis » marque la succession narrative sans transformer explicitement celle-ci en lien de cause à effet.
