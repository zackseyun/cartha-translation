- from: 'Voici qu’en ce moment même, il se tient caché dans l’une des fosses[a] ou dans quelque autre endroit. Si certains des hommes d’Absalom tombent dès le premier affrontement, quiconque l’apprendra dira : « Il y a eu un massacre[b] parmi les hommes qui suivent Absalom. »'
  to: 'Voici qu’en ce moment même, il est caché dans l’une des fosses[a] ou dans un autre endroit. Et, quand il tombera sur eux au début, quiconque l’apprendra dira : « Il y a eu un massacre[b] parmi les hommes qui suivent Absalom. »'
  rationale: La révision restitue l’action sous-entendue de David contre les hommes d’Absalom, sans imposer de détail supplémentaire sur la nature de l’engagement. Elle maintient les alternatives topographiques et militaires signalées par les notes et conserve les deux ancres de note.
