base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: fr
  text: 'Voici qu’en ce moment même, il est caché dans l’une des fosses[a] ou dans un autre endroit. Et, quand il tombera sur eux au début, quiconque l’apprendra dira : « Il y a eu un massacre[b] parmi les hommes qui suivent Absalom. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’un des creux »; le terme hébreu peut désigner des fosses, des dépressions ou des cachettes semblables dans le terrain.
    reason: lexical_alternative
  - marker: b
    text: Ou « une défaite » ou « un coup sévère ». Ici, le terme hébreu évoque un dur revers militaire, et non une épidémie.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: Voici qu’en ce moment même
  rationale: « Voici » attire vivement l’attention, tandis que « en ce moment même » rend l’insistance temporelle de עַתָּה dans un français naturel.
- source_word: נֶחְבָּא
  choice: il se tient caché
  rationale: Cette formulation rend l’état exprimé par le participe niphal sans préciser davantage qui l’a caché.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: dans l’une des fosses
  rationale: פְּחָתִים désigne des fosses, creux ou dépressions pouvant servir de cachettes; « fosses » est direct, avec l’ambiguïté topographique signalée en note.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: dans quelque autre endroit
  rationale: La tournure française exprime naturellement l’alternative indéfinie introduite par אוֹ.
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: Si certains des hommes d’Absalom tombent dès le premier affrontement
  rationale: Le tour נפל ב peut ici évoquer des pertes au sein du groupe. Le sujet implicite est explicité d’après la proposition finale, et « premier affrontement » restitue le cadre militaire de בַּתְּחִלָּה sans faire de « première attaque » une précision certaine.
- source_word: הַשֹּׁמֵעַ
  choice: quiconque l’apprendra
  rationale: Le participe avec article a une valeur générique. Dans ce contexte de propagation d’une nouvelle, « apprendre » est plus idiomatique que le littéral « entendre ».
- source_word: מַגֵּפָה
  choice: un massacre
  rationale: Dans ce contexte militaire, le mot désigne un coup sévère infligé à une troupe, avec des hommes abattus, et non une épidémie.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: les hommes qui suivent Absalom
  rationale: אַחֲרֵי exprime ici le ralliement à Absalom. « Les hommes » convient au groupe engagé dans l’action militaire, tout en restant accessible.
theological_decisions: []
