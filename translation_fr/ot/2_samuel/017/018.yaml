revisions:
- from: Mais un jeune homme les vit et avertit Absalom. Tous deux partirent alors rapidement et arrivèrent chez un homme à Bahourim. Celui-ci avait un puits dans sa cour, et ils descendirent là[a].
  to: Mais un jeune homme les vit et informa Absalom. Les deux hommes partirent rapidement et arrivèrent à la maison d’un homme, à Bahourim. Celui-ci avait un puits dans sa cour, et ils descendirent là[a].
  rationale: La révision remplace un verbe qui suggérait une mise en garde par un verbe neutre correspondant à « rapporter / informer », et elle désambiguïse le référent de « les deux » en français. Elle conserve l’implicitation du lieu de la descente dans le texte principal et l’alternative contextualisée en note.
