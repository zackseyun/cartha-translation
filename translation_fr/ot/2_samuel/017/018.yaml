    text: 'Ou : « ils descendirent dans le puits ».'
    reason: La formulation hébraïque dit littéralement « ils descendirent là »; le contexte permet d’expliciter que le lieu est le puits.
  revision_rationale: La révision remplace un verbe qui suggérait une mise en garde par un verbe neutre correspondant à « rapporter / informer », et elle désambiguïse le référent de « les deux » en français. Elle conserve l’implicitation du lieu de la descente dans le texte principal et l’alternative contextualisée en note.
