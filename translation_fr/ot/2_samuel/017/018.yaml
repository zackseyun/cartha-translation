base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: fr
  text: Mais un jeune homme les vit et informa Absalom. Les deux hommes partirent rapidement et arrivèrent à la maison d’un homme, à Bahourim. Celui-ci avait un puits dans sa cour, et ils descendirent là[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils descendirent dans le puits ».'
    reason: La formulation hébraïque dit littéralement « ils descendirent là »; le contexte permet d’expliciter que le lieu est le puits.
lexical_decisions:
- source_word: נַעַר
  choice: un jeune homme
  rationale: Le terme peut désigner un garçon, un jeune homme ou un serviteur. Ici, « jeune homme » convient à quelqu’un qui observe les messagers et va avertir Absalom, sans préciser indûment son statut.
- source_word: וַיַּגֵּד
  choice: avertit
  rationale: Dans ce contexte de poursuite et de danger, le hifil de נגד exprime le fait d’informer Absalom; « avertit » rend naturellement la portée de ce signalement en français.
- source_word: שְׁנֵיהֶם
  choice: tous deux
  rationale: Cette formulation française concise conserve la mention explicite des deux hommes.
- source_word: מְהֵרָה
  choice: rapidement
  rationale: Le mot employé adverbialement indique qu’ils agissent sans tarder.
- source_word: בֵּית אִישׁ
  choice: chez un homme
  rationale: En français courant, « arriver chez un homme » rend naturellement l’idée d’arriver à sa maison, sans alourdir la phrase.
- source_word: בְּבַחוּרִים
  choice: à Bahourim
  rationale: Bahourim est un nom de lieu; la préposition « à » est l’expression locative française naturelle pour une localité.
- source_word: בְאֵר
  choice: puits
  rationale: בְאֵר désigne normalement un puits. Rien dans ce verset n’impose le sens plus spécifique de « citerne ».
- source_word: בַּחֲצֵרוֹ
  choice: dans sa cour
  rationale: חָצֵר désigne ici l’espace clos attenant à la maison; « cour » est clair et idiomatique.
- source_word: וַיֵּרְדוּ שָׁם
  choice: ils descendirent là
  rationale: Cette traduction conserve le déictique שָׁם (« là ») et sa légère implicitation, tandis que le contexte permet de comprendre qu’ils descendent dans le puits.
