translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluidifiée par « chez un homme » et par la reprise « Celui-ci », tout en maintenant la progression et les détails du texte hébreu. Le marqueur de note est placé après l’expression qu’il éclaire.
