    issue: Rendu de נְקָמוֹת par « d’être vengé »
    rationale: Le texte source emploie le nom « vengeances », que le verbe français « être vengé » recatégorise. Un rendu nominal conserve mieux le lexique et permet à la note sur le pluriel de porter directement sur le mot traduit.
