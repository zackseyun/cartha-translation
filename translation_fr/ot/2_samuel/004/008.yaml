source:
  edition: WLC
  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: fr
  text: 'Ils apportèrent la tête d’Ish-Bosheth à David, à Hébron, et dirent au roi : « Voici la tête d’Ish-Bosheth, fils de Saül, ton ennemi, qui en voulait à ta vie. Aujourd’hui, Yahweh a accordé à mon seigneur le roi vengeance[a] contre Saül et sa descendance. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie le pluriel « vengeances », qui peut exprimer avec intensité la vengeance ou désigner des actes de vengeance.
    reason: alternative lexicale et indication de nombre
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Ils apportèrent
  rationale: Le wayyiqtol poursuit la séquence narrative. Le passé simple convient au récit français soutenu sans reproduire mécaniquement la conjonction initiale.
- source_word: רֹאשׁ
  choice: la tête
  rationale: Le contexte impose le sens physique et littéral du terme.
- source_word: אִישׁ בֹּשֶׁת
  choice: Ish-Bosheth
  rationale: Cette translittération suit la forme massorétique présente dans le verset, sans lui substituer la forme apparentée Eshbaal.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Forme française usuelle du nom de lieu.
- source_word: הִנֵּה
  choice: Voici
  rationale: Cette formule française actuelle conserve la fonction déictique de présentation.
- source_word: אֹיִבְךָ
  choice: ton ennemi
  rationale: Traduction directe du nom commun avec suffixe de deuxième personne du singulier.
- source_word: אֲשֶׁר בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: qui en voulait à ta vie
  rationale: Cette expression française naturelle rend l’idiome hébreu selon lequel quelqu’un cherche à prendre la vie d’un autre, tout en conservant la notion explicite de vie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: à mon seigneur le roi
  rationale: La formulation conserve l’adresse de cour et le suffixe de première personne du singulier.
- source_word: נְקָמוֹת
  choice: d’être vengé
  rationale: Cette tournure française exprime naturellement la vengeance accordée au bénéficiaire par Yahweh; une note signale le pluriel intensif ou concret de l’hébreu.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: de Saül et de sa descendance
  rationale: La préposition française « de » est requise par « être vengé de »; « descendance » rend le nom collectif זֶרַע sans en limiter le nombre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel / Jéhovah
  rationale: Le texte porte directement le tétragramme; sa translittération préserve le nom personnel sans lui substituer un titre.
- issue: Statut de l’affirmation selon laquelle Yahweh a accordé la vengeance
  choice: La conserver sans réserve comme parole directe des assassins
  alternative: Ajouter une marque de doute ou suggérer qu’ils invoquent abusivement l’approbation divine
  rationale: Le verset rapporte leur déclaration sans commentaire explicite. L’évaluation narrative vient de la réponse de David dans la suite; elle ne doit pas être anticipée dans la traduction.
- issue: Agent et bénéficiaire de la vengeance
  choice: Yahweh accorde au roi d’être vengé
  alternative: Le roi se venge avec l’aide de Yahweh
  rationale: La syntaxe présente Yahweh comme celui qui donne et le roi comme bénéficiaire. La traduction évite donc de faire du roi l’auteur direct de la vengeance.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif littéraire courant dans une traduction biblique. « Voici » et « en voulait à ta vie » évitent à la fois l’archaïsme et une explicitation brutale. Le marqueur [a] est placé immédiatement après le rendu de נְקָמוֹת, contrairement à son emplacement incohérent dans la couche de consultation anglaise.
