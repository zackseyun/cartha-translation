  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: fr
  text: Ils pénétrèrent jusqu’au milieu de la maison, en prenant du blé, et le frappèrent au ventre[a]. Puis Rékab et son frère Baana s’échappèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « sous la cinquième côte ». L’expression hébraïque désigne probablement, de façon plus générale, le ventre ou l’abdomen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה בָּאוּ
  choice: Ils pénétrèrent
  rationale: Dans ce récit, בוא accompagné de עַד תּוֹךְ exprime l’entrée jusqu’à l’intérieur. Le français « pénétrèrent » rend naturellement ce mouvement sans conserver un « voici » lourd et ambigu.
- source_word: עַד תּוֹךְ הַבַּיִת
  choice: jusqu’au cœur de la maison
  rationale: La formulation conserve l’idée d’avancer profondément à l’intérieur de la maison, exprimée par עַד et תּוֹךְ, dans un français courant et digne.
- source_word: לֹקְחֵי חִטִּים
  choice: en prenant du blé
  rationale: Le participe est rendu sans ajouter explicitement « comme s’ils », interprétation possible mais non formulée dans l’hébreu. La tournure française laisse subsister l’ellipse du texte.
- source_word: וַיַּכֻּהוּ
  choice: ils le frappèrent
  rationale: נכה désigne ici l’action de frapper. Le contexte conduit à la mort, mais traduire directement par « tuèrent » dépasserait la formulation de ce verset.
- source_word: אֶל הַחֹמֶשׁ
  choice: au ventre
  rationale: חֹמֶשׁ désigne vraisemblablement la région abdominale. « Au ventre » est naturel et précis, tandis que la traduction traditionnelle est signalée en note.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: Puis Rékab et Baana, son frère
  rationale: « Puis » marque naturellement la progression du récit. « Son frère » conserve le singulier hébreu et rattache la relation à Baana.
- source_word: נִמְלָטוּ
  choice: s’échappèrent
  rationale: Le niphal de מלט exprime le fait de parvenir à s’enfuir ou à se mettre hors de danger.
