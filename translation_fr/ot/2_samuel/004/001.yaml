  text: וַ/יִּשְׁמַ֣ע בֶּן שָׁא֗וּל כִּ֣י מֵ֤ת אַבְנֵר֙ בְּ/חֶבְר֔וֹן וַ/יִּרְפּ֖וּ יָדָ֑י/ו וְ/כָל יִשְׂרָאֵ֖ל נִבְהָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: fr
  text: Quand le fils de Saül apprit qu’Abner était mort à Hébron, il perdit courage[a], et tout Israël fut consterné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses mains faiblirent », expression qui peut évoquer la perte de force ou de courage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: le fils de Saül
  rationale: Conserve la désignation indirecte du texte hébreu sans introduire le nom d’Ish-Bosheth, absent de ce verset.
- source_word: כִּי מֵת אַבְנֵר
  choice: qu’Abner était mort
  rationale: כִּי introduit ici le contenu de ce qu’il apprend, et le plus-que-parfait français marque naturellement que la mort précède la nouvelle reçue.
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: En français, « à » est la préposition locative usuelle devant un nom de ville.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: il perdit courage[a]
  rationale: L’expression hébraïque dit littéralement que ses mains faiblirent et évoque la perte de force, d’assurance ou de résolution. La formulation française transmet clairement la valeur idiomatique, tandis que la note conserve l’image originale.
- source_word: וְכָל יִשְׂרָאֵל
  choice: et tout Israël
  rationale: Maintient la désignation nationale collective du texte source.
- source_word: נִבְהָלוּ
  choice: fut saisi d’effroi
  rationale: Le verbe exprime le trouble profond, l’épouvante ou la panique; cette formulation convient au sujet collectif « tout Israël ».
