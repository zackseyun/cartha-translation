  text: וַ/יַּ֨עַן דָּוִ֜ד אֶת רֵכָ֣ב וְ/אֶת בַּעֲנָ֣ה אָחִ֗י/ו בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֵֽרֹתִ֖י וַ/יֹּ֣אמֶר לָ/הֶ֑ם חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: fr
  text: 'Mais David répondit à Rékab et à son frère Baana, les fils de Rimmôn, le Béérotite : « Aussi vrai que Yahweh est vivant, lui qui m’a délivré de toute détresse, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le verbe ענה au wayyiqtol introduit couramment une réplique dans un récit; « répondit » conserve cette formule narrative.
- source_word: רֵכָב וְאֶת־בַּעֲנָה אָחִיו
  choice: Rékab et son frère Baana
  rationale: Le singulier אָחִיו désigne naturellement Baana comme frère de Rékab. Les noms propres sont translittérés en français.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: les fils de Rimmôn, le Béérotite
  rationale: La chaîne construite indique leur filiation, et le gentilé qualifie Rimmôn; cette formulation garde la structure et le sens de l’hébreu.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Formule française naturelle de serment qui conserve la solennité de l’expression hébraïque et rend explicitement le nom divin.
- source_word: פָּדָה
  choice: a délivré
  rationale: Dans ce contexte de dangers vécus par David, פדה exprime une délivrance hors de la détresse. « Délivré » est plus naturel ici que « racheté », sans effacer l’idée d’arrachement au péril.
- source_word: נַפְשִׁי
  choice: m’
  rationale: נפשׁי désigne ici David lui-même, sa vie exposée au danger; le pronom objet rend ce sens idiomatiquement en français.
- source_word: מִכָּל־צָרָה
  choice: de toute détresse
  rationale: « Toute détresse » préserve la portée globale de כָּל et le champ sémantique de צָרָה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de פָּדָה appliqué à David
  choice: délivré
  alternative: racheté
  rationale: Le contexte immédiat vise le secours reçu dans toutes les situations de détresse. « Délivré » conserve cette valeur contextuelle, tandis que « racheté » pourrait suggérer ici un paiement que le verset n’explicite pas.
translation_notes:
  register: Français moderne, international et digne. La formule de serment est rendue idiomatiquement. La phrase reste ouverte par une virgule, puisque le discours se poursuit au verset suivant.
