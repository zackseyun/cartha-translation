source:
  edition: WLC
  text: כִּ֣י הַ/מַּגִּיד֩ לִ֨/י לֵ/אמֹ֜ר הִנֵּה מֵ֣ת שָׁא֗וּל וְ/הֽוּא הָיָ֤ה כִ/מְבַשֵּׂר֙ בְּ/עֵינָ֔י/ו וָ/אֹחֲזָ֣/ה ב֔/וֹ וָ/אֶהְרְגֵ֖/הוּ בְּ/צִֽקְלָ֑ג אֲשֶׁ֥ר לְ/תִתִּ/י ל֖/וֹ בְּשֹׂרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: fr
  text: 'Quand quelqu’un m’a annoncé[a] : « Saül est mort ! », se croyant porteur d’une bonne nouvelle, je l’ai saisi et tué à Tsiklag. Voilà la récompense que je lui ai donnée pour sa nouvelle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « celui qui m’annonçait, en disant : “Voici, Saül est mort.” »'
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase est elliptique et ironique en hébreu : le messager espérait vraisemblablement une récompense, mais la seule « récompense » reçue fut la mort.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans le contexte, la conjonction introduit le cas précis auquel David fait référence; « Quand » rend naturellement cette valeur circonstancielle.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: quelqu’un m’a annoncé
  rationale: Le participe substantivé signifie littéralement « celui qui m’annonçait ». La formulation choisie est naturelle en français et le deux-points suffit à introduire les paroles rapportées.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: « Saül est mort ! »
  rationale: הִנֵּה attire vivement l’attention. En français actuel, l’exclamation restitue cette force plus naturellement que « Voici » devant cet énoncé.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: en pensant m’apporter une bonne nouvelle
  rationale: בְּעֵינָיו exprime le point de vue du messager, et כִמְבַשֵּׂר le présente comme porteur d’une bonne nouvelle. « m’ » explicite le destinataire déjà indiqué par le contexte sans modifier le sens.
- source_word: וָאֹחֲזָה בוֹ
  choice: je l’ai saisi
  rationale: « Saisir » conserve la force concrète de אָחַז dans un registre digne et direct.
- source_word: וָאֶהְרְגֵהוּ
  choice: et tué
  rationale: Le verbe signifie directement « tuer »; cette traduction évite d’ajouter une nuance judiciaire absente du terme lui-même.
- source_word: בְּצִקְלָג
  choice: à Tsiklag
  rationale: Translittération française moderne du nom de lieu; la préposition « à » convient à une ville.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: Voilà la récompense que je lui ai donnée pour sa nouvelle
  rationale: La proposition hébraïque est elliptique et ironique. Le contexte montre que la mise à mort tient lieu de paiement attendu pour l’annonce; « récompense » rend cette ironie intelligible sans la supprimer.
theological_decisions:
- issue: Caractère de la mise à mort du messager
  choice: « je l’ai saisi et tué »
  alternative: « je l’ai arrêté et fait exécuter »
  rationale: L’hébreu affirme l’action de David sans préciser ici une procédure judiciaire. La traduction n’importe donc ni arrestation formelle ni exécution institutionnelle.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe reste fluide tout en conservant le point de vue erroné du messager et l’ironie sombre de la dernière proposition.
