base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: fr
  text: Jonathan, fils de Saül, avait un fils qui était atteint aux deux pieds.[a] Il avait cinq ans lorsque la nouvelle concernant Saül et Jonathan arriva de Jizréel. Sa nourrice le prit dans ses bras et s’enfuit. Alors qu’elle se hâtait de fuir, il tomba et devint boiteux. Il s’appelait Mephibosheth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « frappé aux pieds » ; on peut aussi comprendre : « handicapé des deux pieds ».'
    reason: L’hébreu décrit une atteinte physique sans en préciser exactement la nature ; le duel peut viser les deux pieds.
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: atteint aux deux pieds
  rationale: L’expression désigne une personne frappée ou handicapée des pieds. « Atteint » reste digne et naturel; « aux deux pieds » rend la valeur du duel רַגְלָיִם sans surinterpréter la nature exacte de l’atteinte.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: Il avait cinq ans
  rationale: Formulation française idiomatique et exacte pour indiquer l’âge.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: lorsque la nouvelle concernant Saül et Jonathan arriva
  rationale: Rend naturellement la construction temporelle et maintient l’indétermination du texte quant au contenu précis de la nouvelle.
- source_word: מִיִּזְרְעֶאל
  choice: de Jizréel
  rationale: Rend directement la provenance géographique de la nouvelle.
- source_word: אֹמַנְתּוֹ
  choice: sa nourrice
  rationale: Le terme désigne la femme chargée de nourrir et d’élever l’enfant; « nourrice » est précis et courant dans ce contexte narratif.
- source_word: וַתִּשָּׂאֵהוּ
  choice: le prit dans ses bras
  rationale: Exprime naturellement le geste de soulever et d’emporter un enfant avant de fuir.
- source_word: וַתָּנֹס
  choice: s’enfuit
  rationale: Équivalent narratif direct du verbe de fuite.
- source_word: בְּחָפְזָהּ לָנוּס
  choice: dans la précipitation de la fuite
  rationale: Préserve la circonstance urgente ainsi que le rapport étroit entre la hâte et la fuite, dans un français fluide.
- source_word: וַיִּפֹּל
  choice: il tomba
  rationale: Le masculin singulier indique que l’enfant est le sujet.
- source_word: וַיִּפָּסֵחַ
  choice: devint boiteux
  rationale: Rend la valeur résultative ou inchoative du verbe après la chute, sans ajouter de diagnostic.
- source_word: וּשְׁמוֹ מְפִיבֹשֶׁת
  choice: Il s’appelait Mephibosheth
  rationale: Formulation française naturelle de l’identification nominal.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire évite les formulations aujourd’hui inutilement péjoratives tout en conservant clairement la réalité de l’atteinte physique. Le connecteur « Mais » marque naturellement en français le retournement entre la tentative de sauvetage et la chute, sans modifier le contenu factuel.
