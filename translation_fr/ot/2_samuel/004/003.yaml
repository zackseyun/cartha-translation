  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: fr
  text: Mais les habitants de Beéroth s’enfuirent à Guittaïm, et ils y résident comme résidents étrangers jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: s’enfuirent
  rationale: Le wayyiqtol qal de ברח exprime la fuite dans la trame narrative. Le passé simple convient au récit français et évite d’imposer un plus-que-parfait que la forme hébraïque n’exige pas.
- source_word: הַבְּאֵרֹתִים
  choice: les habitants de Beéroth
  rationale: Le gentilé pluriel désigne les gens originaires de Beéroth. Cette formulation est plus immédiatement compréhensible en français moderne qu’un gentilé rare comme « les Beérothites ».
- source_word: גִּתָּיְמָה
  choice: à Guittaïm
  rationale: Le nom de lieu porte le hé directionnel, qui marque un mouvement vers Guittaïm ; la préposition française « à » l’exprime naturellement.
- source_word: וַיִּהְיוּ שָׁם
  choice: y vécurent
  rationale: Avec le participe גָּרִים et la borne temporelle finale, la proposition décrit leur résidence durable en ce lieu. « Y vécurent » est naturel et garde le cadre narratif au passé.
- source_word: גָּרִים
  choice: comme résidents étrangers
  rationale: Le participe de גור désigne des personnes qui résident hors de leur lieu ou groupe d’origine, avec un statut de non-autochtones. « Résidents étrangers » rend ce sens plus clairement que l’archaïque « étrangers en séjour ».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française consacrée qui indique que la situation se prolonge jusqu’à l’époque du narrateur.
- source_word: וַ
  choice: Mais
  rationale: Dans ce contexte parenthétique, la conjonction introduit une précision qui contraste légèrement avec le rattachement de Beéroth à Benjamin mentionné auparavant.
theological_decisions: []
