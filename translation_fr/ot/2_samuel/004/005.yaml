  source_fidelity: Le texte rend correctement la séquence narrative וַיֵּלְכוּ … וַיָּבֹאוּ (« partirent et arrivèrent »), le complément de destination « chez Ish-Bosheth », l’indication temporelle כְּחֹם הַיּוֹם (« au plus chaud de la journée ») et la circonstance finale. « Les fils de Rimmôn » conserve à juste titre le sens familial le plus immédiat du contexte. « Repos de midi » restitue sans surinterprétation l’expression « coucher de midi ».
