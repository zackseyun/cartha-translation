  text: וַ/יֵּ֨לְכ֜וּ בְּנֵֽי רִמּ֤וֹן הַ/בְּאֵֽרֹתִי֙ רֵכָ֣ב וּ/בַעֲנָ֔ה וַ/יָּבֹ֨אוּ֙ כְּ/חֹ֣ם הַ/יּ֔וֹם אֶל בֵּ֖ית אִ֣ישׁ בֹּ֑שֶׁת וְ/ה֣וּא שֹׁכֵ֔ב אֵ֖ת מִשְׁכַּ֥ב הַֽ/צָּהֳרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: fr
  text: Les fils de Rimmôn le Béérotite, Rékab et Baana, partirent et arrivèrent chez Ish-Bosheth au plus chaud de la journée, tandis qu’il était couché pour son repos de midi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: Les fils de Rimmôn le Béérotite
  rationale: Le sens familial littéral de בְּנֵי est le plus naturel puisque Rékab et Baana sont nommés comme les fils de Rimmôn.
- source_word: רֵכָב וּבַעֲנָה
  choice: Rékab et Baana
  rationale: Translittération française moderne des noms hébreux, avec un accent signalant la voyelle initiale de Rékab.
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: partirent et arrivèrent
  rationale: Cette formulation française naturelle conserve les deux étapes de la narration sans donner à בוא le sens plus précis d’entrer.
- source_word: כְּחֹם הַיּוֹם
  choice: au plus chaud de la journée
  rationale: Rend idiomatiquement la période où la chaleur du jour est forte, sans la réduire précisément à midi.
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: chez Ish-Bosheth
  rationale: En français, arriver chez quelqu’un exprime naturellement l’arrivée à sa maison tout en conservant le référent du syntagme construit.
- source_word: וְהוּא שֹׁכֵב אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: tandis qu’il était couché pour son repos de midi
  rationale: La proposition circonstancielle indique l’état d’Ish-Bosheth à leur arrivée; «repos de midi» rend naturellement l’expression littérale «coucher de midi» sans imposer l’idée plus familière de sieste.
