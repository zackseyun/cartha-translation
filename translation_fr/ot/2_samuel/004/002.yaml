reference: 2 Samuel 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: fr
  text: 'Le fils de Saül avait deux hommes qui commandaient des bandes de pillards : l’un s’appelait Baana et l’autre Rékab. Ils étaient fils de Rimmôn, de Beéroth, et appartenaient aux descendants de Benjamin, car Beéroth aussi était considérée comme faisant partie de Benjamin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « était comptée comme appartenant à Benjamin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי גְדוּדִים
  choice: commandaient des bandes de pillards
  rationale: שָׂרֵי désigne des chefs ou commandants, et גְדוּדִים des bandes armées, souvent engagées dans des raids; cette formulation exprime naturellement leur fonction et le caractère irrégulier de ces troupes.
- source_word: בֶן שָׁאוּל
  choice: Le fils de Saül
  rationale: Le singulier renvoie au fils de Saül mentionné dans le contexte précédent, c’est-à-dire Ish-Bosheth, sans qu’il soit nécessaire de répéter son nom.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: l’un s’appelait ... et l’autre
  rationale: Rend de façon idiomatique en français la formule hébraïque littérale « le nom de l’un… et le nom du second », sans modifier l’identification des deux hommes.
- source_word: בְּנֵי רִמּוֹן הַבְּאֶרֹתִי
  choice: Ils étaient fils de Rimmôn, de Beéroth
  rationale: Le gentilé הַבְּאֶרֹתִי qualifie Rimmôn comme originaire de Beéroth. La tournure française évite le gentilé rare « Beérothite » tout en préservant cette relation syntaxique.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: appartenaient aux descendants de Benjamin
  rationale: L’expression hébraïque « parmi les fils de Benjamin » indique ici l’appartenance tribale; « descendants » est clair et naturel en français moderne.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: était considérée comme faisant partie de Benjamin
  rationale: Le niphal de חשׁב exprime le fait d’être compté ou considéré comme affilié, et עַל marque ici le rattachement à Benjamin.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La longue phrase hébraïque est légèrement restructurée en deux propositions pour rendre sans ambiguïté que Baana et Rékab sont les fils de Rimmôn, tandis que Rimmôn est originaire de Beéroth. Le connecteur initial ו n’est pas rendu par « Or » ou « Maintenant », puisqu’il assure ici la continuité narrative sans porter à lui seul une valeur temporelle explicite.
