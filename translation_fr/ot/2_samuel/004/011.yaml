base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: fr
  text: À plus forte raison, lorsque des hommes méchants ont tué un homme juste dans sa propre maison, sur son lit, ne dois-je pas maintenant vous demander compte de son sang[a] et vous faire disparaître du pays[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « réclamer son sang de vos mains » ; cet idiome hébreu signifie tenir quelqu’un pour responsable du sang versé.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « faire disparaître du pays » désigne l’élimination judiciaire des meurtriers, et non une simple purification rituelle.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: À plus forte raison, quand
  rationale: Dans le contexte, David raisonne du cas précédent, moins grave, au meurtre plus odieux d’Ish-Bosheth. Cette formulation française exprime clairement l’argument a fortiori.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: des hommes mauvais
  rationale: Cette expression conserve la condamnation morale portée par רְשָׁעִים dans un français actuel et naturel.
- source_word: הָרְגוּ
  choice: ont tué
  rationale: Le verbe hébreu courant signifie « tuer ». Le contexte montre qu’il s’agit d’un meurtre, mais le texte n’emploie pas ici un verbe lexicalement limité à cette notion.
- source_word: אִישׁ צַדִּיק
  choice: un homme juste
  rationale: « Juste » rend directement צַדִּיק et laisse au contexte sa nuance d’innocence à l’égard de cette mise à mort.
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: chez lui, sur son lit
  rationale: « Chez lui » exprime naturellement la maison propre de la victime, tandis que « sur son lit » suit précisément l’image hébraïque.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: ne dois-je pas vous demander compte de son sang
  rationale: La traduction conserve le motif concret du sang tout en rendant intelligiblement l’idiome juridique qui signifie tenir les meurtriers pour responsables.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: et vous faire disparaître du pays
  rationale: Dans ce contexte judiciaire, בער désigne l’élimination des coupables. Cette formulation est naturelle en français et évite de suggérer une simple purification rituelle.
theological_decisions:
- issue: Faut-il rendre l’idiome du sang par le vocabulaire de la vengeance ou par celui de la responsabilité judiciaire ?
  choice: Conserver « son sang » et rendre l’idiome par « vous demander compte »
  alternative: « venger son sang sur vous »
  rationale: L’hébreu met l’accent sur l’exigence de rendre compte du sang versé. La formulation retenue préserve cette texture juridique sans réduire l’acte de David à une vengeance personnelle.
translation_notes:
  register: Français international moderne, digne et accessible. L’exclamation après la proposition introduite par « À plus forte raison » restitue la force rhétorique avant la question judiciaire. Les marqueurs de notes sont placés auprès des expressions qu’ils expliquent.
