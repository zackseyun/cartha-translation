base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: fr
  text: Ils entrèrent dans la maison pendant qu’il était couché sur son lit, dans sa chambre[a]. Ils le frappèrent et le mirent à mort. Puis ils lui enlevèrent la tête[b], prirent sa tête et marchèrent toute la nuit par la route de l’Araba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la pièce où il dormait ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils lui coupèrent la tête » ; le verbe hébreu signifie plus littéralement « enlever » ou « retirer ».
    reason: lexical_alternative
  - marker: c
    text: L’Araba est la région de la dépression qui comprend la vallée du Jourdain et se prolonge vers le sud ; l’hébreu emploie ici un nom géographique.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: Ils entrèrent dans la maison
  rationale: Le verbe בוא suivi de הַבַּיִת exprime naturellement l’entrée dans la maison; « entrèrent » rend clairement le mouvement en français.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: pendant qu’il était couché sur son lit
  rationale: La proposition est circonstancielle; cette formulation en restitue la valeur temporelle sans raideur.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: dans sa chambre
  rationale: Littéralement, il s’agit de la chambre où il se couchait. « Sa chambre » est naturel et suffisamment précis, tandis qu’une note conserve la formulation plus explicite.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: Ils le frappèrent et le mirent à mort
  rationale: 'Les deux verbes hébreux restent distincts: נכה désigne les coups portés, puis le hifil de מות exprime explicitement la mise à mort.'
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: ils lui enlevèrent la tête
  rationale: Le hifil de סור signifie enlever ou retirer. La formulation française laisse le contexte impliquer la décapitation sans préciser artificiellement l’instrument ou le procédé.
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: l’emportèrent
  rationale: Le pronom reprend naturellement « la tête » et rend ici la prise en vue du transport. Cela évite en français une répétition pesante, tout en maintenant l’action distincte du verbe לקח.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: marchèrent toute la nuit par le chemin de l’Araba
  rationale: « Par le chemin de » restitue דֶּרֶךְ sans déterminer excessivement si le trajet longeait ou traversait la région. « Marchèrent » convient au déplacement narratif, sans exclure le sens plus général d’« aller ».
- source_word: הָעֲרָבָה
  choice: l’Araba
  rationale: Le terme fonctionne ici comme un nom géographique. La translittération française usuelle préserve ce statut; une note en explique la réalité géographique.
- source_word: כָּל הַלָּיְלָה
  choice: toute la nuit
  rationale: Expression temporelle française idiomatique correspondant directement à l’hébreu.
