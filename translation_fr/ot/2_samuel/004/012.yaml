  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: fr
  text: Alors David donna l’ordre aux jeunes hommes. Ils tuèrent les deux hommes, leur tranchèrent les mains et les pieds, puis les pendirent près du bassin[a], à Hébron. Quant à la tête d’Ish-Bosheth, ils la prirent et l’enterrèrent dans le tombeau d’Abner, à Hébron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au bassin ». La préposition hébraïque peut indiquer le lieu de la pendaison; elle peut aussi se comprendre dans un sens spatial plus strict, « au-dessus du bassin ».'
    reason: La préposition עַל admet une compréhension locative plus générale ou une compréhension spatiale plus stricte; la note préserve cette possibilité sans surdéterminer le sens.
lexical_decisions:
- source_word: וַיְצַו דָּוִד אֶת הַנְּעָרִים
  choice: Alors David donna un ordre aux jeunes hommes
  rationale: Le waw consécutif fait progresser le récit. « Donna un ordre » rend naturellement צוה, et « jeunes hommes » conserve le sens premier de נְעָרִים sans exclure leur fonction d’agents au service de David.
- source_word: וַיַּהַרְגוּם
  choice: Ils tuèrent les deux hommes
  rationale: הרג désigne directement l’action de tuer. L’ajout explicite de « les deux hommes » clarifie en français le référent du suffixe pluriel, à savoir les meurtriers mentionnés dans le contexte immédiat.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: leur coupèrent les mains et les pieds
  rationale: קצץ signifie « couper, retrancher ». La formulation française est directe et conserve les deux parties du corps expressément nommées.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: puis les pendirent près du bassin
  rationale: תלה signifie « pendre, suspendre ». Le complément d’objet est implicite en hébreu et repris en français. עַל peut ici marquer la proximité ou le lieu, tandis que son sens spatial plus strict reste signalé en note.
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: « À Hébron » est la tournure française naturelle pour situer les deux actions dans cette ville.
- source_word: וְאֵת רֹאשׁ אִישׁ בֹּשֶׁת לָקָחוּ
  choice: Quant à la tête d’Ish-Bosheth, ils la prirent
  rationale: La construction détachée avec וְאֵת met la tête au premier plan et marque un contraste avec le sort des corps. « Quant à » reproduit naturellement cet effet sans ajouter de jugement.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: et l’enterrèrent dans le tombeau d’Abner
  rationale: L’objet sous-entendu est la tête d’Ish-Bosheth. « Tombeau » convient à la sépulture nommée tout en rendant קבר avec dignité.
theological_decisions:
- issue: Qualification morale ou judiciaire de l’ordre de David
  choice: Décrire directement l’ordre, la mise à mort, la mutilation et l’exposition sans commentaire moral ajouté.
  alternative: Employer systématiquement un vocabulaire explicitement judiciaire, tel que « exécuter » ou « faire exécuter ».
  rationale: Le verset rapporte les actes avec une grande sobriété, mais ne formule pas lui-même leur évaluation théologique ou morale. La traduction conserve donc la tension et la dureté du récit.
translation_notes:
  register: Français international moderne, direct et digne. Le vocabulaire ne dissimule pas la violence du récit, mais évite aussi de lui ajouter une qualification absente de l’hébreu. La reprise « les deux hommes » lève une ambiguïté pronominale peu naturelle en français sans modifier le référent contextuel.
