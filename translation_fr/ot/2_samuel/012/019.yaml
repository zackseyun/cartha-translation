source:
  edition: WLC
  text: וַ/יַּ֣רְא דָּוִ֗ד כִּ֤י עֲבָדָי/ו֙ מִֽתְלַחֲשִׁ֔ים וַ/יָּ֥בֶן דָּוִ֖ד כִּ֣י מֵ֣ת הַ/יָּ֑לֶד וַ/יֹּ֨אמֶר דָּוִ֧ד אֶל עֲבָדָ֛י/ו הֲ/מֵ֥ת הַ/יֶּ֖לֶד וַ/יֹּ֥אמְרוּ מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: fr
  text: 'David vit que ses serviteurs chuchotaient entre eux et comprit que l’enfant était mort. Il leur dit : « L’enfant est-il mort ? » Ils répondirent : « Il est mort. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה exprime ici une perception visuelle qui conduit David à comprendre la situation ; « vit » est direct et naturel.
- source_word: מִתְלַחֲשִׁים
  choice: chuchotaient entre eux
  rationale: Le participe hitpael de לחש évoque des paroles échangées à voix basse ; « entre eux » rend naturellement la valeur réciproque suggérée par la forme.
- source_word: וַיָּבֶן
  choice: comprit
  rationale: בין désigne ici le discernement tiré d’indices observés. « Comprit » convient au registre narratif et reste proche de l’hébreu.
- source_word: מֵת
  choice: était mort / est-il mort / Il est mort
  rationale: Le terme exprime l’état de mort. Les variations de temps et de forme sont exigées par la syntaxe française dans le récit, la question directe et la réponse.
- source_word: הַיָּלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon ; dans ce contexte, il s’agit du très jeune fils de David, d’où « l’enfant ».
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עֶבֶד couvre plusieurs statuts. Ici, le contexte met en scène les gens attachés au service de la maison royale ; « serviteurs » préserve cette fonction sans préciser indûment leur statut juridique.
- source_word: הֲמֵת הַיֶּלֶד
  choice: L’enfant est-il mort ?
  rationale: La particule interrogative הֲ et le prédicat מֵת portent sur l’état de l’enfant. Cette formulation française est précise et naturelle.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: dit ... répondirent
  rationale: אמר signifie littéralement « dire ». Dans la seconde occurrence, « répondirent » explicite en français la fonction évidente de la réplique sans modifier son contenu.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, sobre et digne. La répétition hébraïque de « David » a été allégée par « Il leur dit » pour une narration française naturelle, tout en maintenant clairement les référents. Aucune note n’est nécessaire : contrairement à l’anglais, le français exige normalement un sujet dans la réponse (« Il est mort »), et cet ajout purement grammatical ne crée pas d’ambiguïté textuelle.'
