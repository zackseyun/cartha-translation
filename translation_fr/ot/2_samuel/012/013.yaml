  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל נָתָ֔ן חָטָ֖אתִי לַֽ/יהוָ֑ה וַ/יֹּ֨אמֶר נָתָ֜ן אֶל דָּוִ֗ד גַּם יְהוָ֛ה הֶעֱבִ֥יר חַטָּאתְ/ךָ֖ לֹ֥א תָמֽוּת־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: fr
  text: 'David dit alors à Nathan : « J’ai péché contre Yahweh. » Nathan dit à David : « Yahweh a lui aussi enlevé ton péché[a] ; tu ne mourras pas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a écarté ton péché ». Le verbe hébreu signifie littéralement « a fait passer » ; il exprime ici le retrait du péché ou de sa culpabilité.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu ne vas pas mourir ». L’hébreu dit simplement « tu ne mourras pas », sans préciser « être mis à mort », bien que le contexte juridique puisse évoquer une condamnation capitale.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: J’ai péché
  rationale: Le qatal qal à la première personne du singulier exprime l’acte accompli que David reconnaît maintenant. Le passé composé est naturel en français dans une confession ayant une portée présente.
- source_word: לַיהוָה
  choice: contre Yahweh
  rationale: Avec le verbe « pécher », la préposition ל exprime ici la relation envers celui qui a été offensé ; « pécher contre » est l’expression française idiomatique.
- source_word: גַּם
  choice: lui aussi
  rationale: Cette formulation conserve la valeur additive de גַּם et souligne la réponse de Yahweh à la confession de David sans préciser davantage le rapport logique.
- source_word: הֶעֱבִיר
  choice: a enlevé
  rationale: Le hifil de עבר signifie littéralement « faire passer ». Avec « ton péché » comme complément, il désigne ici son retrait ; « enlever » est clair et naturel sans expliquer le mécanisme du pardon.
- source_word: חַטָּאתְךָ
  choice: ton péché
  rationale: חַטָּאת peut désigner le péché, la culpabilité ou un sacrifice pour le péché. Ici, il reprend directement la faute que David vient d’avouer ; « ton péché » préserve ce lien.
- source_word: לֹא תָמוּת
  choice: tu ne mourras pas
  rationale: L’imparfait négatif de מות affirme simplement que David ne mourra pas. La traduction n’ajoute pas « être mis à mort », même si le contexte judiciaire peut suggérer cette nuance.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: David dit alors… Nathan dit
  rationale: « Alors » rend la progression du récit portée par le premier wayyiqtol. La seconde proposition reste fluide sans répéter mécaniquement une conjonction.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom divin personnel sans le remplacer par un titre.
- issue: Nature du retrait exprimé par הֶעֱבִיר חַטָּאתְךָ
  choice: a enlevé ton péché
  alternative: a écarté ton péché ; a fait passer ton péché
  rationale: Le verset affirme que Yahweh retire le péché de David et que celui-ci ne mourra pas, mais il n’expose pas ici le mécanisme de cette action. La traduction maintient cette réserve et la tension avec les conséquences annoncées dans le contexte.
- issue: Portée de לֹא תָמוּת
  choice: tu ne mourras pas
  alternative: tu ne seras pas mis à mort
  rationale: L’hébreu parle de ne pas mourir sans expliciter une exécution judiciaire. La formulation retenue préserve cette sobriété et n’impose pas une précision interprétative.
translation_notes:
  register: Français international moderne, digne et direct. Le dialogue garde la brièveté solennelle de l’hébreu. Le passé composé convient à l’aveu immédiat de David, tandis que le futur simple conserve la force déclarative de la réponse de Nathan.
