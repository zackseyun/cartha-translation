- from: 'Il dit : « Tant que l’enfant était encore en vie, j’ai jeûné et pleuré, car je me disais : “Qui sait ? Yahweh me fera peut-être grâce[a], et l’enfant vivra.” »'
  to: 'Il dit : « Lorsque l’enfant était encore vivant, j’ai jeûné et pleuré, car je me disais : “Qui sait ? Yahweh me fera peut-être grâce[a], et l’enfant vivra peut-être.” »'
  rationale: La révision remplace une tournure temporelle potentiellement conditionnelle par une formulation qui correspond plus précisément à בְּעוֹד, et rend explicite en français la possibilité qui concerne tant la faveur de Yahweh que la survie de l’enfant. Le nom divin, le registre et l’alternative lexicale de la note sont conservés.
