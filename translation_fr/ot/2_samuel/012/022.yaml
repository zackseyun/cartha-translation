  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: fr
  text: 'Il dit : « Lorsque l’enfant était encore vivant, j’ai jeûné et pleuré, car je me disais : “Qui sait ? Yahweh me fera peut-être grâce[a], et l’enfant vivra peut-être.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « me témoignera peut-être sa faveur ».'
    reason: Le verbe חנן peut être rendu par « faire grâce » ou « témoigner sa faveur » ; dans les deux cas, la formulation conserve l’incertitude exprimée par « Qui sait ? ».
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: Tant que l’enfant était encore en vie
  rationale: « Tant que » exprime la durée de l’état passé, tandis que « encore » rend son caractère continu et précaire dans le contexte.
- source_word: צַמְתִּי וָאֶבְכֶּה
  choice: j’ai jeûné et pleuré
  rationale: Les deux verbes ont ici leur sens courant et conviennent au registre solennel du deuil de David.
- source_word: כִּי אָמַרְתִּי
  choice: car je me disais
  rationale: כִּי introduit la raison du jeûne et des pleurs. L’imparfait pronominal français rend naturellement la réflexion intérieure répétée ou prolongée de David.
- source_word: מִי יוֹדֵעַ
  choice: Qui sait ?
  rationale: Cette tournure idiomatique exprime l’incertitude et l’espérance, sans présumer de la réponse divine.
- source_word: יְחָנֵּנִי
  choice: me fera peut-être grâce
  rationale: Le verbe חנן désigne l’octroi bienveillant d’une grâce ou d’une faveur. « Peut-être » explicite en français la modalité incertaine portée par « Qui sait ? ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: וְחַי הַיָּלֶד
  choice: et l’enfant vivra
  rationale: Le futur français exprime le résultat espéré. Son inclusion sous la question « Qui sait ? » maintient l’incertitude sans alourdir la phrase par une seconde occurrence de « peut-être ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Degré de certitude dans l’espérance de David
  choice: « Qui sait ? Yahweh me fera peut-être grâce, et l’enfant vivra. »
  alternative: « Yahweh me fera grâce, et l’enfant vivra. »
  rationale: מִי יוֹדֵעַ présente l’issue comme incertaine. La traduction conserve donc l’espérance de David sans la transformer en assurance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en employant une formulation naturelle pour la réflexion intérieure de David.
