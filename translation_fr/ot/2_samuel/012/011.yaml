source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי֩ מֵקִ֨ים עָלֶ֤י/ךָ רָעָה֙ מִ/בֵּיתֶ֔/ךָ וְ/לָקַחְתִּ֤י אֶת נָשֶׁ֨י/ךָ֙ לְ/עֵינֶ֔י/ךָ וְ/נָתַתִּ֖י לְ/רֵעֶ֑י/ךָ וְ/שָׁכַב֙ עִם נָשֶׁ֔י/ךָ לְ/עֵינֵ֖י הַ/שֶּׁ֥מֶשׁ הַ/זֹּֽאת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: fr
  text: 'Ainsi parle Yahvé : « Voici, je vais susciter contre toi un malheur venant de ta propre maison. Je prendrai tes femmes sous tes yeux et je les donnerai à ton prochain[a] ; il couchera avec tes femmes à la vue de ce soleil[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ton proche », « à ton compagnon ». Le mot hébreu peut désigner un proche, un compagnon, un associé ou un prochain.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la vue de ce soleil », c’est-à-dire ouvertement, au grand jour.
    reason: idiom_explanation
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahvé
  rationale: Rend la formule prophétique solennelle de façon naturelle en français et transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: הִנְנִי מֵקִים
  choice: Voici, je vais faire surgir
  rationale: « Voici » conserve la fonction d’appel à l’attention de הִנְנִי, tandis que la tournure prospective française exprime l’action divine imminente portée par le participe.
- source_word: רָעָה
  choice: le malheur
  rationale: Dans ce contexte judiciaire, le mot désigne une calamité infligée et non le mal moral.
- source_word: מִבֵּיתֶךָ
  choice: du sein même de ta maison
  rationale: Conserve l’image de la maison tout en indiquant clairement que le malheur naîtra à l’intérieur de la famille ou maisonnée de David.
- source_word: לְעֵינֶיךָ
  choice: sous tes yeux
  rationale: Expression française naturelle qui garde l’image concrète et l’idée que David en sera le témoin.
- source_word: לְרֵעֶךָ
  choice: à ton prochain
  rationale: Préserve le terme relationnel assez large, qui peut désigner un proche, un compagnon ou une personne de l’entourage, sans identifier explicitement son référent.
- source_word: וְשָׁכַב עִם נָשֶׁיךָ
  choice: il couchera avec elles
  rationale: « Coucher avec » restitue clairement mais sans crudité l’euphémisme sexuel hébreu ; le pronom évite une répétition lourde en français sans modifier le référent.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: à la vue de ce soleil
  rationale: Conserve l’image frappante et concrète du texte hébreu, plutôt que de la remplacer entièrement par l’expression interprétative « au grand jour ».
theological_decisions:
- issue: Sens de רָעָה dans l’annonce du jugement divin
  choice: malheur, au sens de calamité
  alternative: mal ou méchanceté
  rationale: Le contexte décrit un jugement désastreux que Dieu fait surgir contre David, sans attribuer à Dieu la production du mal moral.
- issue: Identité de רֵעַ
  choice: ne pas identifier le « prochain » dans le corps du texte
  alternative: expliciter « Absalom » ou « un proche »
  rationale: Le verset emploie un terme relationnel général et n’identifie pas ici la personne ; la traduction préserve cette indétermination même si le récit ultérieur permet un rapprochement.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique conserve une certaine solennité ; l’image inhabituelle de « ce soleil » est maintenue et expliquée en note. Les marqueurs [a] et [b] sont placés sur les expressions qu’ils éclairent.
