revisions:
- from: 'Ainsi parle Yahvé : « Voici, je vais faire surgir contre toi le malheur du sein même de ta maison. Je prendrai tes femmes sous tes yeux et je les donnerai à ton prochain[a] ; il couchera avec elles à la vue de ce soleil[b]. »'
  to: 'Ainsi parle Yahvé : « Voici, je vais susciter contre toi un malheur venant de ta propre maison. Je prendrai tes femmes sous tes yeux et je les donnerai à ton prochain[a] ; il couchera avec tes femmes à la vue de ce soleil[b]. »'
  rationale: La révision remplace une amplification stylistique de la provenance du malheur par « venant de ta propre maison », qui rend plus sobrement מִבֵּיתֶךָ. Elle rétablit aussi « tes femmes » dans la dernière proposition afin de reproduire la répétition explicite du référent dans l’hébreu, sans nuire à la fluidité.
