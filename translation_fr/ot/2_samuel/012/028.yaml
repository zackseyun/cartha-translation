base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: fr
  text: Maintenant, rassemble le reste des troupes, établis ton camp contre la ville et prends-la, de peur que je ne prenne moi-même la ville et qu’elle ne porte mon nom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et que mon nom soit appelé sur elle ». Cette expression indique que l’honneur de la prise de la ville serait attribué à Joab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers une mesure urgente; « Maintenant » est naturel en français moderne.
- source_word: אֱסֹף
  choice: rassemble
  rationale: L’impératif d’אסף désigne ici le rassemblement des forces disponibles.
- source_word: יֶתֶר הָעָם
  choice: le reste des troupes
  rationale: Dans le contexte du siège, עָם renvoie aux hommes de guerre restants plutôt qu’à l’ensemble de la population.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: établis ton camp contre la ville
  rationale: Cette formulation conserve le sens concret de חנה et la posture militaire exprimée par עַל, sans expliciter davantage que l’hébreu l’idée de siège.
- source_word: וְלָכְדָהּ
  choice: et prends-la
  rationale: לכד signifie prendre ou capturer une ville; « prendre une ville » est l’expression militaire française la plus naturelle.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Rend la proposition de prévention ou le résultat redouté introduit par פן, dans un registre soutenu mais courant.
- source_word: אֶלְכֹּד אֲנִי
  choice: je ne prenne moi-même
  rationale: Le pronom indépendant אֲנִי met le sujet en relief; « moi-même » restitue cette insistance.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: et qu’elle ne porte mon nom
  rationale: Rend naturellement l’idiome hébreu selon lequel le nom de Joab serait invoqué sur la ville, c’est-à-dire que sa conquête lui serait attribuée, avec une note conservant l’image littérale.
