  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וַ/יָּ֣מָת הַ/יָּ֑לֶד וַ/יִּֽרְאוּ֩ עַבְדֵ֨י דָוִ֜ד לְ/הַגִּ֥יד ל֣/וֹ כִּי מֵ֣ת הַ/יֶּ֗לֶד כִּ֤י אָֽמְרוּ֙ הִנֵּה֩ בִ/הְי֨וֹת הַ/יֶּ֜לֶד חַ֗י דִּבַּ֤רְנוּ אֵלָי/ו֙ וְ/לֹא שָׁמַ֣ע בְּ/קוֹלֵ֔/נוּ וְ/אֵ֨יךְ נֹאמַ֥ר אֵלָ֛י/ו מֵ֥ת הַ/יֶּ֖לֶד וְ/עָשָׂ֥ה רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: fr
  text: 'Le septième jour, l’enfant mourut. Les serviteurs de David avaient peur de lui annoncer que l’enfant était mort, car ils se disaient : « Quand l’enfant était encore en vie, nous lui avons parlé, mais il ne nous a pas écoutés. Comment pourrions-nous maintenant lui dire : “L’enfant est mort” ? Il pourrait faire du mal[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il pourrait commettre un mal », « Il pourrait mal réagir », ou peut-être « Il pourrait se faire du mal ». L’expression hébraïque est brève et ne précise pas l’action redoutée.'
    reason: Alternative lexicale nécessaire pour signaler l’ambiguïté réelle de וְעָשָׂה רָעָה.
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Le septième jour
  rationale: Cette formulation française exprime naturellement la transition temporelle du récit sans calquer inutilement « et il arriva ».
- source_word: וַיָּמָת הַיָּלֶד
  choice: l’enfant mourut
  rationale: יֶלֶד désigne ici l’enfant en bas âge; le passé simple convient au registre narratif digne.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד לְהַגִּיד לוֹ
  choice: Les serviteurs de David avaient peur de lui annoncer
  rationale: ירא exprime l’appréhension, et הגיד une annonce; « annoncer » convient naturellement à la nouvelle d’un décès.
- source_word: כִּי אָמְרוּ
  choice: car ils se disaient
  rationale: Le verbe introduit la délibération commune des serviteurs; « se disaient » rend ce contexte plus naturellement que le littéral « disaient ».
- source_word: הִנֵּה בִהְיוֹת הַיֶּלֶד חַי
  choice: Quand l’enfant était encore en vie
  rationale: הִנֵּה attire l’attention sur le constat, mais n’exige pas un équivalent lexical distinct en français; « encore » fait ressortir le contraste temporel.
- source_word: דִּבַּרְנוּ אֵלָיו וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: nous lui avons parlé, mais il ne nous a pas écoutés
  rationale: « Écouter notre voix » serait compréhensible mais peu idiomatique ici; « ne pas nous écouter » restitue fidèlement l’idée de refus de prêter attention.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: Comment pourrions-nous maintenant lui dire
  rationale: Le conditionnel traduit l’appréhension de la question rhétorique; « maintenant » explicite naturellement le contraste porté par la progression du discours.
- source_word: וְעָשָׂה רָעָה
  choice: Il pourrait faire du mal
  rationale: La formule reste sans objet exprimé et conserve donc l’indétermination de l’hébreu quant à l’acte redouté.
theological_decisions:
- issue: Portée de וְעָשָׂה רָעָה
  choice: Une action mauvaise ou dommageable laissée indéterminée
  alternative: Il pourrait se faire du mal; il pourrait commettre un mal; il pourrait mal réagir
  rationale: L’hébreu ne précise ni l’objet ni la nature de l’action. Le texte principal conserve cette ambiguïté au lieu d’imposer l’idée de suicide, de violence envers autrui ou d’une simple réaction émotionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple porte la narration, tandis que le discours direct reste courant. Les formulations archaïques telles que « voici » comme interjection obligatoire et le calque « écouter notre voix » ont été évitées.
