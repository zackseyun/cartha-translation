  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: fr
  text: Cependant[a], puisque tu as, par cette affaire, gravement méprisé les ennemis de Yahweh, le fils qui t’est né mourra certainement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'De nombreuses traductions rendent cette proposition ainsi : « tu as donné aux ennemis de Yahweh l’occasion de mépriser Yahweh » ou « de blasphémer ». Elles suivent une interprétation ou une correction du texte hébreu, qui est difficile ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: Cependant
  rationale: Marque une forte réserve après l’annonce précédente du pardon, dans un français moderne et digne.
- source_word: כִּי
  choice: puisque
  rationale: Introduit ici la cause de la conséquence annoncée.
- source_word: נִאֵץ נִאַצְתָּ
  choice: tu as gravement méprisé
  rationale: La construction infinitif absolu plus verbe conjugué intensifie l’idée verbale; « gravement » restitue cette insistance sans lourdeur.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: les ennemis de Yahweh
  rationale: Suit directement la syntaxe du texte massorétique, où le groupe nominal est l’objet du verbe, malgré la difficulté du sens.
- source_word: בַּדָּבָר הַזֶּה
  choice: par cette affaire
  rationale: דבר désigne ici l’affaire ou l’acte en cause; « affaire » peut englober tout l’épisode.
- source_word: גַּם
  choice: omis comme terme autonome
  rationale: Sa valeur additive ou emphatique est portée naturellement par l’enchaînement de la conséquence en français.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: le fils qui t’est né
  rationale: Préserve le sens masculin de בן et rend naturellement le participe passif.
- source_word: מוֹת יָמוּת
  choice: mourra certainement
  rationale: Restitue la certitude emphatique exprimée par l’infinitif absolu suivi de l’imparfait.
theological_decisions:
- issue: Rapport syntaxique de « les ennemis de Yahweh » avec le verbe
  choice: 'Lecture fondée sur le texte massorétique : David a gravement méprisé « les ennemis de Yahweh ».'
  alternative: 'Lecture interprétative ou corrigée : David a donné aux ennemis de Yahweh l’occasion de mépriser ou de blasphémer.'
  rationale: Le texte hébreu fourni présente le marqueur d’objet direct אֶת devant « les ennemis de Yahweh ». La traduction principale conserve donc cette lecture difficile sans la corriger silencieusement; la lecture courante est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Yahweh » conserve le nom divin. La formulation garde volontairement la difficulté syntaxique et théologique du texte massorétique.
