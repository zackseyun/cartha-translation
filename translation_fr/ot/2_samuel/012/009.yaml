source:
  edition: WLC
  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: fr
  text: Pourquoi as-tu méprisé la parole de Yahweh[a] en faisant ce qui est mal à ses yeux ? Tu as frappé Urie le Hittite avec l’épée, tu as pris sa femme pour en faire ta femme[b], et tu l’as tué par l’épée des Ammonites[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « traité avec mépris la parole de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu as pris sa femme pour toi comme femme »; la formulation souligne que David se l’est personnellement appropriée.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « par l’épée des fils d’Ammon »; David a causé la mort d’Urie par l’intermédiaire des Ammonites.'
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Interrogatif direct qui introduit l’accusation de Nathan avec naturel et force.
- source_word: בָּזִיתָ
  choice: as-tu méprisé
  rationale: Le verbe בזה exprime le mépris et le dédain, et non une simple désobéissance.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve l’expression hébraïque, qui peut englober ici le commandement et la volonté révélée de Dieu; le nom divin est rendu directement par « Yahweh ».
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: en faisant ce qui est mal à ses yeux
  rationale: Cette formulation française naturelle conserve le lien entre le mépris de la parole divine et l’acte mauvais, ainsi que l’image évaluative « à ses yeux ».
- source_word: אֵת אוּרִיָּה הַחִתִּי הִכִּיתָ בַחֶרֶב
  choice: Tu as frappé de l’épée Urie le Hittite
  rationale: « Frapper de l’épée » préserve נכה et la progression rhétorique avant le verbe explicite « tuer »; « Urie le Hittite » est la forme française traditionnelle et intelligible du nom et de l’ethnique.
- source_word: וְאֶת אִשְׁתּוֹ לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: tu as pris sa femme pour en faire ta femme
  rationale: La formulation garde à la fois l’appropriation personnelle et la destination matrimoniale, tout en évitant une redondance peu naturelle en français.
- source_word: וְאֹתוֹ הָרַגְתָּ
  choice: et tu l’as tué
  rationale: הרג est le verbe courant « tuer »; le contexte établit déjà clairement la culpabilité de David sans qu’il soit nécessaire de surtraduire par « assassiner ».
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: par l’épée des Ammonites
  rationale: La tournure conserve l’image répétée de l’épée et indique que David a causé la mort d’Urie par l’intermédiaire des forces ammonites.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le Tétragramme; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Nature de la culpabilité de David dans la mort d’Urie
  choice: « tu l’as tué par l’épée des Ammonites »
  alternative: « les Ammonites l’ont tué »
  rationale: Le sujet grammatical reste David. Le français doit donc préserver l’accusation de causalité morale directe tout en indiquant l’agence militaire ammonite.
translation_notes:
  register: Français international moderne, digne et direct. L’accusation prophétique reste énergique; les répétitions significatives de « femme » et d’« épée » sont conservées autant que le permet un français naturel. Tous les marqueurs de notes figurent dans le texte principal.
