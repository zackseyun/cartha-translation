  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: fr
  text: Car toi, tu as agi en secret, mais moi, je ferai cela devant tout Israël et devant le soleil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au grand jour ».'
    reason: alternative idiomatique
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison du jugement annoncé au verset précédent et conserve clairement la valeur explicative de la conjonction.
- source_word: עָשִׂיתָ בַסָּתֶר
  choice: tu as agi en secret
  rationale: Le verbe reste elliptique, comme en hébreu, sans préciser de nouveau la faute de David. « En secret » rend naturellement l’idée du lieu caché.
- source_word: וַאֲנִי
  choice: mais moi
  rationale: Le waw marque ici un contraste net entre l’action secrète de David et l’action publique annoncée par Dieu. Le pronom renforcé « moi » correspond à l’emphase de וַאֲנִי.
- source_word: אֶעֱשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: je ferai cela
  rationale: Rend directement la première personne et le futur de l’annonce, tout en évitant le tour peu naturel « je ferai cette chose ».
- source_word: נֶגֶד כָּל יִשְׂרָאֵל
  choice: devant tout Israël
  rationale: 'Conserve le sens spatial et public de נֶגֶד : l’acte aura lieu en présence de la nation entière.'
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: au grand jour[a]
  rationale: Rend en français courant la portée idiomatique de l’expression, celle d’une action accomplie ouvertement et en pleine lumière, tandis que la note préserve son image littérale.
theological_decisions:
- issue: Agent du jugement annoncé
  choice: 'Maintenir l’action divine à la première personne : « je ferai cela »'
  alternative: « je ferai en sorte que cela arrive »
  rationale: L’hébreu emploie un verbe direct à la première personne. Même si le jugement se réalise par des acteurs et des événements historiques, le texte attribue explicitement l’action à Dieu; il ne convient donc pas d’en atténuer l’affirmation.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme « toi… mais moi » fait ressortir le contraste entre le secret de la faute et la publicité du jugement. La formulation demeure concise et ne précise pas la faute au-delà de ce que dit le verset.
