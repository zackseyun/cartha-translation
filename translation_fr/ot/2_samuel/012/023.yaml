  terminology: « Jeûner », « mort », « faire revenir » et « revenir » sont appropriés. La conservation du lien verbal entre « faire revenir » et « reviendra » reflète utilement la racine שוב sans lourdeur. La note est exacte et n’oriente pas l’interprétation théologique.
