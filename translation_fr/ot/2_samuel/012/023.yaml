  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: fr
  text: Mais maintenant, il est mort. Pourquoi jeûnerais-je encore ? Puis-je le faire revenir ? Moi, j’irai vers lui[a], mais lui ne reviendra pas vers moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je vais vers lui ». Le participe hébreu peut exprimer un avenir certain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Ce marqueur discursif introduit le contraste entre le jeûne de David avant la mort de l’enfant et son comportement après celle-ci.
- source_word: מֵת
  choice: il est mort
  rationale: 'Le prédicat exprime ici l’état résultant : l’enfant est désormais mort.'
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: Pourquoi jeûnerais-je
  rationale: Le conditionnel présent rend naturellement en français la force de cette question rhétorique, sans calquer l’expression hébraïque.
- source_word: עוֹד
  choice: encore
  rationale: Dans la première occurrence, l’adverbe porte sur la poursuite du jeûne.
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: Puis-je le faire revenir ?
  rationale: Le hifil de שוב signifie « faire revenir ». Le contexte indique un retour à la vie, mais la formulation retenue préserve le lien lexical avec « reviendra » dans la proposition suivante. La valeur de עוֹד est naturellement comprise dans « revenir » en français.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: Moi, j’irai vers lui
  rationale: Le participe הֹלֵךְ peut exprimer un avenir tenu pour certain. Le pronom disjoint « Moi » conserve l’emphase explicite de אֲנִי et prépare le contraste avec « lui ».
- source_word: וְהוּא לֹא יָשׁוּב אֵלַי
  choice: mais lui ne reviendra pas vers moi
  rationale: L’imparfait hébreu a ici une valeur future. « Reviendra » maintient la reprise de שוב, tandis que « mais » explicite le contraste contextuel.
theological_decisions:
- issue: La déclaration de David implique-t-elle des retrouvailles conscientes avec l’enfant après la mort ?
  choice: Traduire simplement que David ira vers l’enfant, sans préciser la nature de cette destination.
  alternative: Comprendre soit que David mourra lui aussi et rejoindra le séjour des morts, soit que les deux personnes se retrouveront consciemment après la mort.
  rationale: L’hébreu affirme seulement que David ira vers l’enfant et que l’enfant ne reviendra pas vers lui. La traduction ne doit pas transformer cette formulation en doctrine plus précise sur l’état après la mort ou le sort des enfants décédés.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions rhétoriques restent directes. La répétition de « revenir » reflète la reprise de la même racine hébraïque, et l’opposition « moi… lui » conserve l’emphase du texte source.
