source:
  edition: WLC
  text: וַ/יִּלָּ֣חֶם יוֹאָ֔ב בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן וַ/יִּלְכֹּ֖ד אֶת עִ֥יר הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/026.yaml
  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: fr
  text: Joab combattit Rabba des Ammonites et s’empara de la cité royale[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la capitale ». L’hébreu dit littéralement « la ville de la royauté » ou « la ville du pouvoir royal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: combattit
  rationale: Le niphal de לחם désigne ici l’engagement dans le combat. En français, « combattit » est naturel avec le complément introduit directement par le nom de la ville et convient au contexte militaire.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Rabba des Ammonites
  rationale: « Rabba » est le nom propre de la ville, tandis que בְּנֵי עַמּוֹן est la désignation ethnique et géopolitique habituelle. « Des Ammonites » est clair en français moderne.
- source_word: וַיִּלְכֹּד
  choice: s’empara de
  rationale: Dans un contexte militaire, לכד signifie prendre, capturer ou s’emparer de. « S’empara de » convient idiomatiquement à la prise d’une ville.
- source_word: עִיר הַמְּלוּכָה
  choice: la cité royale
  rationale: L’expression signifie littéralement « la ville de la royauté/du pouvoir royal ». « La cité royale » reste proche de cette formulation sans imposer l’interprétation plus précise de « capitale ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique. « Cité royale » préserve l’ambiguïté de l’expression hébraïque, tandis que la note indique l’interprétation possible « capitale ».
