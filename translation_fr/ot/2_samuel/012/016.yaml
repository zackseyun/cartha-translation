source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ דָּוִ֛ד אֶת הָ/אֱלֹהִ֖ים בְּעַ֣ד הַ/נָּ֑עַר וַ/יָּ֤צָם דָּוִד֙ צ֔וֹם וּ/בָ֥א וְ/לָ֖ן וְ/שָׁכַ֥ב אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: fr
  text: David chercha Dieu en faveur de l’enfant[a]. David observa un jeûne[b], puis entra et passa la nuit couché à terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du garçon ». Le terme hébreu peut désigner un garçon ou, comme ici, un enfant encore très jeune.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « jeûna un jeûne » : l’hébreu emploie ensemble un verbe et un nom de même racine pour souligner l’action.'
    reason: source_form
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: chercha
  rationale: Le verbe בקש exprime ici une recherche pressante dirigée vers Dieu, dans un contexte de supplication. « Chercha » conserve la formulation hébraïque sans imposer le sens plus fort d’« implora ».
- source_word: אֶת־הָאֱלֹהִים
  choice: Dieu
  rationale: Le syntagme désigne directement celui que David cherche.
- source_word: בְּעַד
  choice: en faveur de
  rationale: Cette préposition exprime ici l’action accomplie dans l’intérêt de quelqu’un et laisse percevoir la dimension d’intercession.
- source_word: הַנַּעַר
  choice: l’enfant
  rationale: נער peut désigner un garçon, un jeune homme, un serviteur ou un enfant. Dans ce contexte, il s’agit du fils encore très jeune de David; « l’enfant » est donc le rendu français le plus naturel.
- source_word: וַיָּצָם ... צוֹם
  choice: observa un jeûne
  rationale: L’hébreu associe le verbe « jeûner » au nom apparenté « jeûne ». « Observa un jeûne » garde la présence du nom et une certaine insistance tout en restant idiomatique en français.
- source_word: וּבָא
  choice: entra
  rationale: בוא signifie ici entrer ou aller à l’intérieur. « Entra » préserve ce mouvement sans supposer explicitement un retour.
- source_word: וְלָן
  choice: passa la nuit
  rationale: לון désigne le fait de demeurer quelque part pendant la nuit.
- source_word: וְשָׁכַב אָרְצָה
  choice: couché à terre
  rationale: Cette expression décrit David étendu vers ou sur le sol. La tournure française relie naturellement cette posture au fait qu’il y passa la nuit.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition du nom « David » suit le relief narratif de l’hébreu. La dernière proposition est légèrement restructurée pour exprimer naturellement en français qu’il passa la nuit étendu sur le sol.
