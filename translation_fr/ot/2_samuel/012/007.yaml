  text: וַ/יֹּ֧אמֶר נָתָ֛ן אֶל דָּוִ֖ד אַתָּ֣ה הָ/אִ֑ישׁ כֹּה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י מְשַׁחְתִּ֤י/ךָֽ לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֥י הִצַּלְתִּ֖י/ךָ מִ/יַּ֥ד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: fr
  text: 'Alors Nathan dit à David : « Tu es cet homme ! Ainsi parle Yahweh, le Dieu d’Israël : C’est moi qui t’ai oint roi sur Israël, et c’est moi qui t’ai délivré de la main de Saül. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement en français la succession et le caractère décisif de la déclaration.
- source_word: אַתָּה הָאִישׁ
  choice: Cet homme, c’est toi !
  rationale: La tournure disloquée est naturelle et percutante en français, tout en rattachant explicitement David à l’homme de la parabole. Une note conserve la formulation plus littérale du texte hébreu.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule française consacrée pour l’introduction solennelle d’un message prophétique; elle préserve le registre formel de la formule hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct et idiomatique de la construction hébraïque, qui conserve le titre relationnel et historique.
- source_word: אָנֹכִי … וְאָנֹכִי
  choice: C’est moi qui … et c’est moi qui
  rationale: La répétition de cette structure rend l’insistance portée par le pronom indépendant répété en hébreu.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: je t’ai donné l’onction pour que tu sois roi
  rationale: Cette formulation explicite en français l’onction royale et sa finalité, sans réduire le verbe à une simple nomination politique.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: La préposition marque ici l’autorité royale exercée sur Israël.
- source_word: הִצַּלְתִּיךָ
  choice: je t’ai délivré
  rationale: « Délivré » exprime le fait d’arracher David à un pouvoir hostile sans ajouter un sens sotériologique étranger au contexte.
- source_word: מִיַּד שָׁאוּל
  choice: de la main de Saül
  rationale: La conservation de l’image hébraïque de la « main » évoque clairement le pouvoir ou l’emprise de Saül et reste compréhensible en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre du Dieu d’Israël au lieu de le remplacer par un titre.
- issue: Portée de l’onction royale
  choice: t’ai donné l’onction pour que tu sois roi
  alternative: t’ai consacré roi; t’ai nommé roi
  rationale: Le choix maintient à la fois le geste concret de l’onction et sa fonction d’établissement royal, sans imposer une interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, digne et oralement clair. La révélation accusatrice est formulée avec force; la formule prophétique garde sa solennité. La répétition « C’est moi qui » reproduit l’emphase du texte hébreu.
