  text: The rich man had very many sheep and cattle[a].
translation:
  language: fr
  text: Le riche avait un très grand nombre de moutons et de bovins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « Au riche, il y avait énormément de petit bétail et de gros bétail. »
    reason: La construction hébraïque avec לְ et הָיָה exprime la possession; la traduction principale la rend naturellement par « avait ».
lexical_decisions:
- source_word: לְעָשִׁיר
  choice: Le riche
  rationale: La construction לְ avec הָיָה exprime ici la possession. Dans le contraste narratif avec le pauvre, le groupe défini « le riche » est naturel en français.
- source_word: הָיָה
  choice: avait
  rationale: Bien que le verbe signifie littéralement « était », la construction existentielle et possessive avec לְ se rend idiomatiquement par « avait ».
- source_word: צֹאן
  choice: moutons
  rationale: Le terme collectif désigne le petit bétail, surtout les moutons et les chèvres. « Moutons » offre ici un équivalent courant, en contraste avec les bovins.
- source_word: וּבָקָר
  choice: et de bovins
  rationale: בָּקָר désigne le gros bétail. « Bovins » conserve la portée collective et convient à un français moderne international.
- source_word: הַרְבֵּה מְאֹד
  choice: un très grand nombre
  rationale: Cette tournure exprime une quantité fortement intensifiée. « Un très grand nombre » est naturel et préserve l'insistance de l'hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation possessive naturelle remplace le calque « il y avait au riche ». Le terme « bovins » est précis et largement compréhensible.
