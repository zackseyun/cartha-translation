  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: fr
  text: 'Yahweh envoya Nathan auprès de David. Nathan vint le trouver et lui dit : « Il y avait[a] deux hommes dans une ville : l’un était riche et l’autre pauvre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Deux hommes habitaient dans une ville. » L’hébreu dit plus littéralement : « Il y avait deux hommes dans une ville. »'
    reason: Alternative lexicale et précision sur la formulation existentielle de הָיוּ.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol de שׁלח exprime simplement l’action narrative d’envoyer ; « envoya » est précis et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֶת נָתָן
  choice: Nathan
  rationale: La marque de l’objet direct אֶת ne se traduit pas ; le nom propre est rendu sous sa forme française usuelle.
- source_word: אֶל דָּוִד
  choice: auprès de David
  rationale: Dans la construction française « envoyer quelqu’un auprès de quelqu’un », ce choix exprime naturellement la destination de la mission sans donner à אֶל le sens interprétatif de « contre ».
- source_word: וַיָּבֹא אֵלָיו
  choice: Nathan vint auprès de lui
  rationale: בוא suivi de אֶל indique ici que Nathan vient trouver David. La répétition du nom clarifie le référent en français.
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: Cette tournure française idiomatique conserve explicitement le complément indirect לוֹ.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: deux hommes
  rationale: אֲנָשִׁים désigne ici les deux personnages masculins de la parabole.
- source_word: הָיוּ
  choice: Il y avait
  rationale: Le verbe היה a ici une valeur existentielle ; « il y avait » la restitue directement et naturellement en français.
- source_word: בְּעִיר אֶחָת
  choice: dans une même ville
  rationale: Littéralement « dans une ville », avec אֶחָת (« une »). « Une même ville » fait comprendre sans lourdeur que les deux hommes se trouvent dans la ville évoquée, tout en restant proche de la formulation hébraïque.
- source_word: אֶחָד עָשִׁיר
  choice: l’un était riche
  rationale: Le français ajoute la copule requise par l’usage tout en conservant le contraste concis de la proposition nominale hébraïque.
- source_word: וְאֶחָד רָאשׁ
  choice: et l’autre pauvre
  rationale: רָאשׁ signifie « pauvre, indigent » ; « pauvre » rend le contraste direct avec עָשִׁיר, « riche ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le Tétragramme comme nom propre. « Yahweh » préserve ce nom au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. Les répétitions hébraïques sont conservées lorsqu’elles servent la clarté, tandis que les propositions nominales sont adaptées à la grammaire française.
