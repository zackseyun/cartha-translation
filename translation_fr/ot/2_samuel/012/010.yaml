id: 2SA.12.10
reference: 2 Samuel 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: fr
  text: Maintenant donc, l’épée ne s’éloignera jamais de ta maison[a], parce que tu m’as méprisé[b] et que tu as pris la femme d’Urie le Hittite pour en faire ta femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « maison » peut aussi désigner la maisonnée, la famille ou la dynastie.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tu m’as méprisé » : l’offense commise contre Urie et sa femme est présentée comme un mépris envers Dieu lui-même.'
    reason: theological_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Exprime à la fois la transition temporelle et la conséquence judiciaire découlant de l’accusation précédente.
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: ne s’éloignera jamais
  rationale: Rend naturellement en français la négation durable; סור indique ici que l’épée ne quittera pas la maison de David.
- source_word: חֶרֶב
  choice: l’épée
  rationale: Conserve l’image hébraïque de la violence armée et du jugement.
- source_word: מִבֵּיתְךָ
  choice: de ta maison
  rationale: Préserve la métaphore et l’ampleur du mot hébreu, qui peut viser la famille, la maisonnée ou la lignée royale.
- source_word: עֵקֶב כִּי
  choice: parce que
  rationale: Formulation française directe et naturelle de la relation causale.
- source_word: בְזִתָנִי
  choice: tu m’as méprisé
  rationale: Le verbe בזה exprime le mépris, et le suffixe de première personne désigne directement Dieu.
- source_word: וַתִּקַּח
  choice: tu as pris
  rationale: Rend l’action accomplie et coordonne naturellement les deux chefs d’accusation en français.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: la femme d’Urie le Hittite
  rationale: Maintient au premier plan le lien conjugal préexistant avec Urie.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: pour en faire ta femme
  rationale: Expression française idiomatique qui rend le but de la prise sans atténuer l’action de David.
theological_decisions:
- issue: Référent du pronom dans « tu m’as méprisé »
  choice: Conserver « m’ » comme référence directe à Dieu
  alternative: Expliciter « tu as méprisé la parole ou le commandement du Seigneur »
  rationale: L’hébreu porte explicitement un suffixe de première personne. Le texte présente ainsi l’offense commise contre Urie et sa femme comme un mépris envers Dieu lui-même.
- issue: Portée de « ta maison »
  choice: Traduire littéralement par « ta maison »
  alternative: « ta maisonnée », « ta famille » ou « ta dynastie »
  rationale: Le terme hébreu peut couvrir la famille, la maisonnée et la lignée royale; une formulation plus précise réduirait une ambiguïté réelle du texte.
- issue: Durée de la sentence
  choice: « ne s’éloignera jamais »
  alternative: « ne s’éloignera pas pour toujours » ou « ne quittera plus »
  rationale: La tournure française choisie restitue la portée durable de עַד עוֹלָם sans imposer une formulation maladroite ni définir au-delà du texte la nature exacte de cette durée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure causale et l’image de l’épée sont conservées; les ambiguïtés relatives à la portée de « maison » et à la durée du jugement ne sont pas artificiellement résolues.
