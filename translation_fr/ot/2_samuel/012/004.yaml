  to: Un voyageur[a] arriva chez l’homme riche. Celui-ci ne voulut prendre ni de son petit bétail ni de son gros bétail pour en préparer un repas au voyageur qui était arrivé chez lui. Il prit donc l’agnelle de l’homme pauvre et en prépara un repas pour l’homme qui était arrivé chez lui.
