base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: fr
  text: Un voyageur[a] arriva chez l’homme riche. Celui-ci ne voulut prendre ni de son petit bétail ni de son gros bétail pour en préparer un repas au voyageur qui était arrivé chez lui. Il prit donc l’agnelle de l’homme pauvre et en prépara un repas pour l’homme qui était arrivé chez lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un hôte » dans les deux occurrences de « voyageur ». Les deux termes hébreux employés dans ce verset sont proches par le sens, mais distincts : le premier désigne une personne en voyage, et le second peut désigner un voyageur reçu comme hôte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: voyageur
  rationale: Le nom désigne une personne en déplacement. « Voyageur » est naturel en français moderne et le distingue de l’hôte qui le reçoit.
- source_word: וַיַּחְמֹל
  choice: ne voulut pas prendre
  rationale: Le verbe signifie normalement « épargner » ou « avoir pitié », mais son objet n’est pas exprimé ici. En contexte, il indique que le riche répugne à prélever une bête sur ses propres animaux; cette formulation rend clairement cet emploi idiomatique.
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: de son petit ou de son gros bétail
  rationale: Les deux collectifs hébreux distinguent les ovins-caprins des bovins. La tournure française usuelle « petit et gros bétail » est adaptée avec « ou » sous la portée de la négation.
- source_word: לַעֲשׂוֹת
  choice: pour préparer un repas
  rationale: Dans ce contexte d’hospitalité, le verbe עשה signifie préparer de quoi manger. « Un repas » explicite naturellement l’objet implicite sans préciser indûment le mode de cuisson.
- source_word: לָאֹרֵחַ
  choice: au voyageur
  rationale: אָרֵחַ peut désigner un voyageur ou un hôte reçu. « Voyageur » maintient le lien sémantique avec הֵלֶךְ; l’alternative est signalée en note.
- source_word: כִּבְשַׂת
  choice: l’agnelle
  rationale: Le terme indique précisément une jeune brebis; « agnelle » conserve le sexe féminin et convient naturellement en français.
- source_word: הָאִישׁ הָרָאשׁ
  choice: l’homme pauvre
  rationale: רָאשׁ désigne ici une personne pauvre ou démunie. « Homme pauvre » rend clairement le contraste avec l’homme riche.
- source_word: וַיַּעֲשֶׂהָ
  choice: la prépara
  rationale: La reprise du verbe עשה est conservée par « prépara », avec le pronom féminin renvoyant à l’agnelle, sans ajouter un procédé culinaire absent de l’hébreu.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: qui était arrivé chez lui
  rationale: Les participes substantivés décrivent le visiteur venu auprès du riche. « Était arrivé chez lui » s’intègre naturellement au récit passé et exprime l’accueil au domicile.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite un calque maladroit de « épargna de prendre », conserve la distinction entre l’homme riche et l’homme pauvre, ainsi que la précision féminine d’« agnelle ». Le marqueur [a] figure dans le texte principal.
