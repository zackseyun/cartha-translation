  text: וַ/יִּשְׁלַ֥ח יוֹאָ֛ב מַלְאָכִ֖ים אֶל דָּוִ֑ד וַ/יֹּ֨אמֶר֙ נִלְחַ֣מְתִּי בְ/רַבָּ֔ה גַּם לָכַ֖דְתִּי אֶת עִ֥יר הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: fr
  text: 'Joab envoya alors des messagers à David pour lui dire : « J’ai combattu contre Rabba et j’ai aussi pris la ville des eaux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « la ville de l’eau », probablement la partie de Rabba qui contrôlait son approvisionnement en eau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya alors
  rationale: Le waw consécutif fait progresser le récit ; « alors » exprime naturellement la succession en français.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte humain et militaire, le mot désigne clairement des hommes chargés de transmettre un rapport.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: J’ai combattu contre Rabba
  rationale: Cette formulation française rend le combat dirigé contre la ville assiégée et conserve l’aspect accompli du parfait hébreu.
- source_word: רַבָּה
  choice: Rabba
  rationale: Le nom propre est translittéré sans ajouter l’identification « des Ammonites », déjà fournie par le contexte.
- source_word: גַּם
  choice: aussi
  rationale: « Aussi » conserve la valeur additive reliant la prise du secteur à l’action militaire précédente.
- source_word: לָכַדְתִּי
  choice: j’ai pris
  rationale: « Prendre » est naturel en français dans le langage militaire pour la conquête d’une ville ou d’un secteur fortifié.
- source_word: עִיר הַמָּיִם
  choice: la ville des eaux
  rationale: Ce calque intelligible préserve l’expression hébraïque et son ambiguïté au lieu de préciser sans certitude qu’il s’agit du quartier contrôlant l’approvisionnement en eau.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste naturelle tout en conservant l’expression inhabituelle « ville des eaux » et son incertitude référentielle.
