  text: וַ/יִּֽחַר אַ֥ף דָּוִ֛ד בָּ/אִ֖ישׁ מְאֹ֑ד וַ/יֹּ֨אמֶר֙ אֶל נָתָ֔ן חַי יְהוָ֕ה כִּ֣י בֶן מָ֔וֶת הָ/אִ֖ישׁ הָ/עֹשֶׂ֥ה זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: fr
  text: 'Alors la colère de David s’enflamma violemment contre cet homme. Il dit à Nathan : « Aussi vrai que Yahweh est vivant, l’homme qui a fait cela est fils de la mort[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « fils de la mort » désigne quelqu’un qui mérite de mourir ou qui est passible de mort.
    reason: Explication d’un idiome hébraïque conservé littéralement dans le texte.
lexical_decisions:
- source_word: וַיִּחַר אַף דָּוִד
  choice: la colère de David s’enflamma
  rationale: Cette formulation naturelle en français conserve l’image hébraïque d’une colère qui brûle, plutôt que de l’aplatir en « David se mit en colère ».
- source_word: בָּאִישׁ
  choice: contre cet homme
  rationale: La préposition désigne l’objet de la colère. Le démonstratif renvoie naturellement en français à l’homme de la parabole racontée juste avant.
- source_word: מְאֹד
  choice: violemment
  rationale: L’adverbe marque la très grande intensité de la colère. « Violemment » l’exprime sans la tournure peu naturelle « s’enflamma beaucoup ».
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette tournure française rend clairement et dignement la formule solennelle de serment, tout en conservant le nom divin.
- source_word: כִּי
  choice: assertion directe après la formule de serment
  rationale: Ici, כִּי introduit le contenu de la déclaration solennelle de David ; aucune conjonction française n’est nécessaire.
- source_word: בֶן מָוֶת
  choice: fils de la mort
  rationale: Le texte principal conserve l’expression imagée et juridiquement forte de l’hébreu ; une note en précise le sens idiomatique.
- source_word: הָאִישׁ הָעֹשֶׂה זֹאת
  choice: l’homme qui a fait cela
  rationale: La proposition relative rend clairement le participe hébreu qui caractérise le coupable par son acte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- issue: Traduction littérale ou idiomatique de בֶן מָוֶת
  choice: fils de la mort
  alternative: mérite la mort ; est passible de mort
  rationale: Conserver l’expression dans le texte maintient la force et la texture de l’hébreu sans trancher plus précisément la nuance juridique ; la note fournit le sens idiomatique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation sépare les deux propositions coordonnées afin d’éviter une phrase trop lourde. L’image de la colère qui s’enflamme et l’expression « fils de la mort » conservent la vigueur du texte hébreu.
