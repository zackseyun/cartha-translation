  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: fr
  text: Les anciens de sa maison se tinrent auprès de lui pour le relever de terre, mais il ne voulut pas et ne mangea pas de pain avec eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne mangea pas de pain avec eux » ; cette expression hébraïque désigne ici le fait de prendre de la nourriture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ זִקְנֵי בֵיתוֹ עָלָיו
  choice: Les anciens de sa maison se tinrent auprès de lui
  rationale: « Anciens de sa maison » conserve le sens concret de la tournure hébraïque, qui désigne ici vraisemblablement les responsables de la maison royale. Avec קום et עָלָיו, « se tinrent auprès de lui » restitue naturellement leur présence active autour de David sans imposer l’image potentiellement dominatrice de « au-dessus de lui ».
- source_word: לַהֲקִימוֹ מִן הָאָרֶץ
  choice: pour le relever de terre
  rationale: La forme causative de קום signifie faire se lever. « Relever » exprime ce mouvement avec concision, tandis que « de terre » convient à la posture de David prosterné.
- source_word: וְלֹא אָבָה
  choice: mais il ne voulut pas
  rationale: אָבָה exprime le consentement ou la volonté. « Il ne voulut pas » en préserve la nuance sans renforcer le texte par « il refusa ».
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: et ne prit aucune nourriture avec eux
  rationale: La construction signifie prendre ou manger de la nourriture. Le français idiomatique « prendre de la nourriture » transmet le sens de l’expression hébraïque sans donner à « pain » un sens trop étroit.
