  yaml_path: translation/ot/2_samuel/012/029.yaml
  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: fr
  text: David rassembla alors tout le peuple[a], marcha sur Rabba, l’attaqua et s’en empara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toute l’armée » ou « toutes les troupes »; littéralement en hébreu : « tout le peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: rassembla
  rationale: Dans ce récit, אסף signifie réunir des personnes. « Rassembla » est naturel et conserve le sens de base sans préciser davantage que l’hébreu l’organisation militaire.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: L’expression signifie littéralement « tout le peuple ». Dans le contexte, elle désigne vraisemblablement les forces combattantes de David, mais עָם n’est pas un terme militaire explicite; le texte principal préserve donc cette formulation.
- source_word: רַבָּתָה
  choice: sur Rabba
  rationale: Le nom de lieu porte le hé directionnel, qui indique un mouvement vers la ville. Après « marcher », le français idiomatique « marcher sur Rabba » exprime naturellement cette progression militaire.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: l’attaqua
  rationale: לחם avec ב désigne ici le fait de combattre contre la ville. « L’attaqua » rend clairement et avec concision l’action militaire en français narratif.
- source_word: וַיִּלְכְּדָהּ
  choice: s’en empara
  rationale: לכד signifie capturer ou prendre, notamment une ville. « S’en empara » est une tournure française naturelle et précise dans ce contexte militaire.
