source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: fr
  text: Mais le pauvre n’avait rien, sinon une seule petite agnelle qu’il avait achetée. Il la gardait en vie, et elle grandissait avec lui et avec ses fils. Elle mangeait de son morceau de pain, buvait dans sa coupe et se couchait contre lui[a] ; elle était pour lui comme une fille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « dans son sein » ou « dans son giron » ; le terme peut aussi évoquer les bras ou les genoux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: le pauvre
  rationale: Le nom désigne une personne pauvre ou démunie. « Le pauvre » forme un contraste naturel avec l’homme riche du contexte tout en conservant la référence masculine singulière.
- source_word: אֵין כֹּל כִּי אִם
  choice: n’avait rien, sinon
  rationale: Cette tournure exprime une absence totale assortie d’une seule exception.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: une seule petite agnelle
  rationale: כִּבְשָׂה désigne une jeune brebis; « agnelle » en précise naturellement le sexe, tandis que « une seule » et « petite » rendent אַחַת et קְטַנָּה et préservent la tonalité affective.
- source_word: אֲשֶׁר קָנָה
  choice: qu’il avait achetée
  rationale: קנה signifie ici acheter ou acquérir; « achetée » convient précisément au contexte.
- source_word: וַיְחַיֶּהָ
  choice: Il la gardait en vie
  rationale: Le hiphil de חיה signifie maintenir en vie ou faire vivre. Cette traduction conserve cette force sans la réduire au seul fait de l’élever.
- source_word: וַתִּגְדַּל
  choice: elle grandissait
  rationale: Le verbe décrit sa croissance au sein du foyer; l’imparfait français exprime naturellement cette situation progressive.
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: avec lui et avec ses fils
  rationale: « Ses fils » conserve le sens formel de בָּנָיו. L’idée de vie commune portée par יַחְדָּו ressort déjà de la construction « avec… et avec… »; une traduction séparée de « ensemble » serait lourde en français.
- source_word: מִפִּתּוֹ
  choice: de son morceau de pain
  rationale: פַּת désigne un morceau, souvent de pain. Cette formulation garde l’image concrète du partage de sa propre nourriture.
- source_word: מִכֹּסוֹ
  choice: dans sa coupe
  rationale: Le français dit naturellement boire « dans » une coupe, alors que la préposition hébraïque marque la provenance.
- source_word: בְחֵיקוֹ
  choice: contre lui
  rationale: חֵיק désigne le sein, la poitrine ou le giron. « Contre lui » rend naturellement en français moderne l’intimité physique de la scène sans fixer indûment une seule posture.
- source_word: תִשְׁכָּב
  choice: couchait
  rationale: שכב signifie être couché ou se coucher; « couchait » conserve l’image sans ajouter explicitement l’idée de sommeil.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: elle était pour lui comme une fille
  rationale: La formulation maintient la comparaison explicite et sa forte valeur affective.
theological_decisions:
- issue: Imagerie familiale et affective appliquée à l’agnelle
  choice: Conserver directement la proximité domestique et la comparaison avec une fille
  alternative: Atténuer le langage pour éviter une personnification marquée
  rationale: Le récit hébreu accentue délibérément l’attachement de l’homme à l’agnelle afin de renforcer la portée pathétique de la parabole.
- issue: Sens de בָּנָיו
  choice: ses fils
  alternative: ses enfants
  rationale: Le mot hébreu signifie formellement « ses fils ». Rien dans ce verset n’oblige à l’élargir à « enfants »; la traduction conserve donc le sens explicite du texte source.
- issue: Localisation exprimée par בְחֵיקוֹ
  choice: contre lui, avec une note sur les autres possibilités
  alternative: sur son sein / dans ses bras / sur ses genoux
  rationale: Le terme couvre une zone et une posture que le français ne restitue pas par un équivalent unique. Le texte principal garde l’affection et la proximité, tandis que la note préserve l’ambiguïté concrète.
translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits rendent la croissance et les habitudes répétées de l’agnelle. « Petite agnelle » et « comme une fille » préservent la tendresse voulue, sans mièvrerie.
