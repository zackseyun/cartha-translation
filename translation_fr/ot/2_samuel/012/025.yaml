source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח בְּ/יַד֙ נָתָ֣ן הַ/נָּבִ֔יא וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יְדִ֣ידְיָ֑הּ בַּ/עֲב֖וּר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: fr
  text: Il envoya un message par l’intermédiaire de Nathan le prophète[b], et il lui donna le nom de Yedidia[a], à cause de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yedidia signifie probablement « bien-aimé de Yahweh » ou « aimé de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de Nathan le prophète ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il envoya un message
  rationale: Le verbe signifie littéralement « envoyer ». Comme aucun objet n’est exprimé et que l’action passe par le prophète Nathan, « envoya un message » explicite sobrement la communication sous-entendue.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: par l’intermédiaire de Nathan le prophète
  rationale: L’expression signifie littéralement « par la main de » et marque ici l’intermédiaire ou l’agent. Cette formulation est naturelle en français moderne.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: il lui donna le nom de
  rationale: Littéralement « il appela son nom » ; l’expression idiomatique française exprime naturellement l’acte de nommer tout en restant proche de l’hébreu.
- source_word: יְדִידְיָהּ
  choice: Yedidia
  rationale: Translittération française du nom hébreu, dont le sens probable est signalé en note sans remplacer le nom propre dans le texte.
- source_word: בַּעֲבוּר
  choice: à cause de
  rationale: La préposition indique ici le motif ou la raison de l’attribution du nom. « À cause de » conserve cette relation sans préciser davantage sa nature.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Sujet des verbes « envoya » et « donna le nom »
  choice: Conserver le pronom « il » sans identifier explicitement le sujet dans la traduction
  alternative: Identifier Yahweh comme sujet des deux verbes, ou Nathan comme sujet du second
  rationale: Le contexte favorise Yahweh comme sujet initial, mais l’enchaînement hébreu ne nomme pas de nouveau le sujet et peut laisser ouverte l’agence précise dans l’attribution du nom. Le français maintient cette discrétion grammaticale.
- issue: Portée de « à cause de Yahweh »
  choice: Conserver une formulation causale générale
  alternative: « pour l’amour de Yahweh » ou « de la part de Yahweh »
  rationale: L’hébreu indique le motif sans en préciser entièrement la nuance. Une traduction plus développée résoudrait indûment cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Par l’intermédiaire de » rend clairement l’agence prophétique ; « lui donna le nom de » évite le calque peu naturel « appela son nom ». Les marqueurs sont placés auprès des expressions qu’ils expliquent.
