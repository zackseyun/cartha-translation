id: 2SA.12.24
reference: 2 Samuel 12:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: fr
  text: Puis David consola[a] Bethsabée, sa femme. Il alla vers elle et coucha avec elle[b]. Elle mit au monde un fils, et il lui donna le nom de Salomon. Yahweh l’aima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « réconforta ».'
    reason: lexical_alternative
  - marker: b
    text: Les expressions « aller vers elle » et « coucher avec elle » indiquent ici qu’ils eurent des relations sexuelles.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: consola
  rationale: Le piel de נחם désigne ici l’action d’apporter du réconfort après un deuil. « Consola » convient naturellement au contexte de la mort de l’enfant.
- source_word: בַּת שֶׁבַע
  choice: Bethsabée
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre biblique.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Le texte hébreu présente explicitement Bethsabée comme la femme de David; cette précision narrative est conservée.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: Il alla vers elle et coucha avec elle
  rationale: Cette formulation conserve les deux verbes et le caractère indirect mais intelligible de l’expression hébraïque désignant des relations sexuelles.
- source_word: וַתֵּלֶד בֵּן
  choice: Elle mit au monde un fils
  rationale: Équivalent français naturel et précis de l’expression hébraïque.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: il lui donna le nom de Salomon
  rationale: Rend naturellement l’idiome hébreu « appeler son nom ». Le sujet masculin singulier renvoie le plus naturellement à David.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel, plutôt que substitution par un titre.
- source_word: אֲהֵבוֹ
  choice: l’aima
  rationale: Le verbe אהב signifie directement « aimer », et le suffixe masculin renvoie au fils nouveau-né.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Objet de l’amour de Yahweh
  choice: Le pronom « l’ » renvoie au fils nouveau-né
  alternative: Expliciter « Yahweh aima l’enfant »
  rationale: Le suffixe hébreu est masculin singulier et renvoie naturellement à Salomon; le pronom français préserve la concision du texte.
translation_notes:
  register: Récit au passé simple, dans un français moderne, sobre et digne. La formulation conserve l’enchaînement narratif hébreu et son expression indirecte des relations sexuelles, tout en restant compréhensible.
