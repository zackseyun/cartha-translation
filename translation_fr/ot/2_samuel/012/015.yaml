revisions:
- from: Puis Nathan rentra chez lui. Yahweh frappa l’enfant que la femme d’Urie avait donné à David, et l’enfant tomba malade.[a]
  to: Puis Nathan s’en alla chez lui. Yahweh frappa l’enfant que la femme d’Urie avait enfanté à David, et l’enfant tomba malade.[a]
  rationale: La révision rend explicitement l’enfantement de la femme d’Urie, évite d’ajouter l’idée de retour dans le départ de Nathan et neutralise la note afin de ne pas anticiper la gravité décrite au verset suivant. Elle ne modifie ni l’agence divine explicite ni la désignation narrative de la mère.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T16:03:49Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte conserve la séquence narrative, l’attribution explicite de l’atteinte à Yahweh, la désignation intentionnelle « la femme d’Urie » et le fait que l’enfant devient malade. Toutefois, « que la femme d’Urie avait donné à David » est elliptique et peut se comprendre comme le don d’un enfant déjà né, plutôt que comme l’enfantement exprimé par יָלְדָה. « S’en alla chez lui » rend plus directement le simple mouvement de וַיֵּלֶךְ sans ajouter nécessairement l’idée de retour.
  naturalness: La phrase révisée est sobre, fluide et naturelle dans un récit biblique en français moderne. « Avait enfanté à David » est une tournure narrative claire qui rend explicitement l’enfantement sans nommer Bethsabée.
  terminology: « Yahweh », « Urie » et « l’enfant » sont cohérents avec les choix établis. La désignation relationnelle de la mère est préservée. La note proposée ne renforce pas indûment le degré de la maladie, que le verset suivant précisera.
  issues:
  - severity: medium
    issue: La formulation « que la femme d’Urie avait donné à David » ne rend pas explicitement le verbe « enfanter / mettre au monde ».
    rationale: Le relatif hébreu indique que la femme d’Urie a donné naissance à l’enfant pour David. En français, « donner [un enfant] à quelqu’un » peut évoquer un don ou une remise de l’enfant et demeure trop elliptique ici.
  - severity: low
    issue: « Rentra chez lui » explicite un retour qui n’est pas formulé par le verbe hébreu.
    rationale: Le contexte peut permettre cette nuance, mais « s’en alla chez lui » reproduit plus précisément le mouvement narratif sans ajout.
  - severity: low
    issue: La note actuelle qualifie la maladie de « gravement » ou « très sérieuse », ce que le verset ne précise pas explicitement.
    rationale: Le verbe indique que l’enfant devint malade; la gravité est développée au verset suivant. Une note plus neutre préserve cette progression.
  revised_text: Puis Nathan s’en alla chez lui. Yahweh frappa l’enfant que la femme d’Urie avait enfanté à David, et l’enfant tomba malade.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou : « devint malade ». Le verbe hébreu décrit l’enfant comme devenant malade.'
    reason: lexical_alternative
  revision_rationale: La révision rend explicitement l’enfantement de la femme d’Urie, évite d’ajouter l’idée de retour dans le départ de Nathan et neutralise la note afin de ne pas anticiper la gravité décrite au verset suivant. Elle ne modifie ni l’agence divine explicite ni la désignation narrative de la mère.
