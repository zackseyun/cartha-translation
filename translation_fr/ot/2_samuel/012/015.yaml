base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: fr
  text: Puis Nathan s’en alla chez lui. Yahweh frappa l’enfant que la femme d’Urie avait enfanté à David, et l’enfant tomba malade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devint malade ». Le verbe hébreu décrit l’enfant comme devenant malade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ נָתָן אֶל בֵּיתוֹ
  choice: Puis Nathan rentra chez lui
  rationale: Le wayyiqtol fait avancer le récit. « Rentra chez lui » exprime naturellement en français le déplacement de Nathan vers sa propre maison, sans changer le sens concret de בֵּיתוֹ.
- source_word: וַיִּגֹּף
  choice: frappa
  rationale: Le verbe נָגַף désigne ici une atteinte nuisible. « Frappa » conserve l’action directe et forte sans préciser au-delà du texte la nature du mal infligé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom divin personnel du texte hébreu plutôt que de le remplacer par un titre.
- source_word: הַיֶּלֶד
  choice: l’enfant
  rationale: Dans ce contexte, יֶלֶד désigne le jeune enfant de David; « l’enfant » est précis et naturel.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: que la femme d’Urie avait donné à David
  rationale: Cette formulation maintient la désignation délibérée « la femme d’Urie » et rend idiomatiquement l’idée qu’elle avait enfanté cet enfant pour David, sans introduire le nom de Bethsabée.
- source_word: וַיֵּאָנַשׁ
  choice: et l’enfant tomba malade
  rationale: Le verbe indique que l’enfant devint malade. La répétition de « l’enfant » évite l’ambiguïté du pronom français et « tomba malade » rend naturellement l’entrée dans cet état.
theological_decisions:
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom personnel divin; le conserver respecte directement la donnée hébraïque sans lui substituer un titre.
- issue: Agent de l’atteinte
  choice: Yahweh frappa l’enfant
  alternative: Yahweh affligea l’enfant
  rationale: L’hébreu attribue explicitement l’action à Yahweh. La traduction conserve cette attribution directe sans l’atténuer ni en expliquer la cause au-delà du texte.
- issue: Désignation de la mère
  choice: la femme d’Urie
  alternative: Bethsabée
  rationale: La formulation hébraïque évite ici son nom et rappelle son lien avec Urie; cette tension narrative et morale doit être préservée.
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition de « l’enfant » est retenue pour la clarté. Le nom « Urie » suit la forme française biblique courante; la syntaxe demeure accessible tout en conservant la force théologique du texte.
