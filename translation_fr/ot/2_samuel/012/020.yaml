  terminology: « Yahweh » suit le choix éditorial fourni et « maison de Yahweh » conserve l’expression hébraïque. « Se prosterna » rend le geste corporel sans réduire le verbe à l’adoration. La note alternative est appropriée; la typographie des guillemets est normalisée.
