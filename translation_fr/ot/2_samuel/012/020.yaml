base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: fr
  text: Alors David se releva de terre, se lava, s’enduisit d’huile et changea de vêtements. Il entra dans la maison de Yahweh et se prosterna[a]. Puis il rentra chez lui, demanda, et on lui servit du pain ; il mangea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adora » ; le verbe hébreu peut désigner le fait de se prosterner physiquement en signe de révérence ou d’adoration.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיָּקָם מֵהָאָרֶץ
  choice: se releva de terre
  rationale: Rend concrètement le fait que David se relève après être resté couché à même le sol dans le deuil.
- source_word: וַיִּרְחַץ
  choice: se lava
  rationale: רחץ peut désigner le fait de se laver ou de se baigner; «se lava» reste naturel et suffisamment large.
- source_word: וַיָּסֶךְ
  choice: s’enduisit d’huile
  rationale: סוך désigne ici l’application d’huile sur soi à la fin du deuil; cette formulation est plus transparente en français moderne que «s’oignit».
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: changea de vêtements
  rationale: Le nom singulier peut avoir un sens collectif; le pluriel français exprime naturellement l’action.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Conserve l’expression hébraïque désignant le sanctuaire ainsi que le nom divin personnel.
- source_word: וַיִּשְׁתָּחוּ
  choice: se prosterna
  rationale: Le verbe décrit l’abaissement corporel révérenciel et peut, selon le contexte, désigner l’adoration; «se prosterna» préserve cette amplitude.
- source_word: וַיִּשְׁאַל
  choice: À sa demande
  rationale: L’hébreu ne précise pas l’objet de la demande. La tournure française demeure fluide sans ajouter explicitement «à manger».
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: on lui servit du pain
  rationale: Le sujet pluriel reste indéfini; «servit» rend naturellement le fait de placer le pain à sa disposition.
- source_word: וַיֹּאכַל
  choice: il mangea
  rationale: Rend directement la conclusion de la chaîne narrative.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme; «Yahweh» conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de וַיִּשְׁתָּחוּ
  choice: se prosterna
  alternative: adora
  rationale: Le choix retenu conserve à la fois le geste physique et sa portée cultuelle possible sans réduire le verbe à une seule interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La succession rapide des actions du récit hébreu est conservée, tandis que «À sa demande» évite d’expliciter l’objet absent du verbe hébreu.
