base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: fr
  text: 'Ses serviteurs lui dirent : « Qu’est-ce donc que tu as fait là ? Tant que l’enfant était vivant, tu as jeûné et pleuré ; mais lorsque l’enfant est mort, tu t’es levé et tu as mangé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu as mangé du pain » ; expression hébraïque signifiant prendre de la nourriture ou manger un repas.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: Ses serviteurs lui dirent
  rationale: Le passé simple convient au récit biblique en français écrit et rend la progression narrative du waw consécutif. Dans le cadre de la cour royale, « serviteurs » est le terme contextuellement approprié pour עֲבָדָיו.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: Qu’est-ce donc que tu as fait là ?
  rationale: Cette formulation française naturelle conserve l’étonnement exprimé par la tournure hébraïque concrète, sans la réduire à une simple question en « pourquoi ».
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: Tant que l’enfant était vivant
  rationale: Dans ce contexte, la construction présente la situation antérieure qui contraste avec la mort de l’enfant. « Enfant » convient mieux que « garçon » puisqu’il s’agit du fils encore nourrisson de David.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: tu as jeûné et pleuré
  rationale: Traduction directe, naturelle et digne des deux verbes hébreux.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: mais dès que l’enfant est mort
  rationale: « Mais » explicite le contraste rhétorique, tandis que « dès que » rend naturellement la succession immédiate soulignée par les serviteurs.
- source_word: קַמְתָּ
  choice: tu t’es levé
  rationale: Rend directement קום dans ce contexte, où David se relève de terre.
- source_word: וַתֹּאכַל לָחֶם
  choice: tu as mangé
  rationale: L’expression hébraïque signifie idiomatiquement prendre de la nourriture ou un repas. Le français naturel emploie simplement « manger » ; la formulation concrète avec « pain » est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue garde l’étonnement des serviteurs, tandis que les temps verbaux distinguent naturellement l’introduction narrative des actions directement évoquées.
