  text: וְ/אֶת הַ/כִּבְשָׂ֖ה יְשַׁלֵּ֣ם אַרְבַּעְתָּ֑יִם עֵ֗קֶב אֲשֶׁ֤ר עָשָׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/עַ֖ל אֲשֶׁ֥ר לֹֽא חָמָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/006.yaml
  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: fr
  text: Il devra rendre quatre brebis pour la brebis, parce qu’il a fait cela et qu’il n’a eu aucune pitié[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il n’a pas épargné ». Le verbe hébreu peut souligner soit la pitié, soit le fait d’épargner.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: cette brebis
  rationale: כִּבְשָׂה désigne une jeune brebis. Le démonstratif français reprend naturellement l’animal précis dont il vient d’être question, tandis que « brebis » en conserve le sexe.
- source_word: יְשַׁלֵּם אַרְבַּעְתָּיִם
  choice: il devra rendre quatre brebis pour cette brebis
  rationale: Le piel de שׁלם exprime ici une restitution, et אַרְבַּעְתָּיִם une compensation quadruple. Cette formulation rend clairement en français moderne la portée judiciaire de la déclaration et la quantité exigée.
- source_word: עֵקֶב אֲשֶׁר
  choice: parce que
  rationale: La locution introduit le motif de la sentence ; « parce que » en est l’équivalent français le plus direct et naturel.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: il a fait cela
  rationale: Cette formulation idiomatique conserve le sens de l’expression hébraïque sans préciser davantage la nature de l’acte.
- source_word: לֹא חָמָל
  choice: il n’a éprouvé aucune pitié
  rationale: חמל peut exprimer la pitié qui conduit à épargner. La formulation retenue met en avant l’absence de pitié tout en laissant l’autre nuance en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « devra rendre » conserve le caractère judiciaire de la sentence, et l’explicitation « quatre brebis pour cette brebis » communique sans ambiguïté la restitution au quadruple.
