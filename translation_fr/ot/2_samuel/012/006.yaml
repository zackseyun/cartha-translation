  source_fidelity: La restitution quadruple (יְשַׁלֵּם אַרְבַּעְתָּיִם) est bien rendue par « rendre quatre brebis pour la brebis ». Le féminin de כִּבְשָׂה est conservé. « Aucune pitié » rend de manière juste לֹא חָמָל. Le démonstratif « cette » est possible en contexte, mais l’article défini correspond plus directement au texte source.
  naturalness: Le texte révisé est fluide, clair et d’un registre judiciaire naturel en français international moderne. « N’a eu aucune pitié » est un peu plus idiomatique que « n’a éprouvé aucune pitié », sans changement de sens.
  terminology: « Brebis » est le terme français approprié pour l’animal femelle. « Rendre quatre brebis » communique convenablement la restitution au quadruple. La note doit éviter de fixer un objet que l’hébreu ne formule pas explicitement avec חָמָל.
