  to: Il retira la couronne de la tête de leur roi[a]. Elle pesait un talent d’or et portait une pierre précieuse ; elle fut placée sur la tête de David[b]. Il emporta de la ville une très grande quantité de butin.
  rationale: La révision ne modifie pas le sens ; elle élimine seulement l’ambiguïté créée en français par le possessif « sa ». Le point-virgule remplace « puis » afin de relier les deux propositions sans marquer plus fortement que l’hébreu une succession temporelle. Les notes et leurs ancrages sont maintenus.
