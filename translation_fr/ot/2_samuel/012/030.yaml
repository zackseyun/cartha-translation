source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: fr
  text: Il retira la couronne de la tête de leur roi[a]. Elle pesait un talent d’or et portait une pierre précieuse ; elle fut placée sur la tête de David[b]. Il emporta de la ville une très grande quantité de butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la couronne de Milkom » (aussi transcrit « Malkam »), si מַלְכָּם est compris comme le nom du dieu ammonite plutôt que comme « leur roi ».
    reason: alternative_reading
  - marker: b
    text: Le talent était une unité de poids très élevée, souvent estimée à environ 34 kilogrammes, mais sa valeur exacte variait selon les époques et les régions.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: couronne
  rationale: Dans ce contexte royal, « couronne » est l’équivalent français naturel et précis.
- source_word: מַלְכָּם
  choice: leur roi
  rationale: La vocalisation et la morphologie du texte massorétique permettent de comprendre « leur roi »; l’autre lecture reconnue, Milkom, est conservée en note.
- source_word: מֵעַל רֹאשׁוֹ
  choice: de la tête
  rationale: La tournure « retira de la tête » rend naturellement en français le mouvement exprimé par מֵעַל, sans calque pesant.
- source_word: כִּכַּר זָהָב
  choice: un talent d’or
  rationale: « Talent » est le terme traditionnel désignant cette grande unité antique de poids; une note en donne une estimation.
- source_word: וְאֶבֶן יְקָרָה
  choice: portait une pierre précieuse
  rationale: L’hébreu est elliptique, littéralement « et une pierre précieuse ». « Portait » explicite sobrement le rapport entre la pierre et la couronne sans préciser son mode de fixation.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: puis elle fut placée sur la tête de David
  rationale: Cette formulation exprime naturellement le passage de la couronne sur la tête de David; « puis » restitue la progression narrative du waw.
- source_word: וּשְׁלַל הָעִיר
  choice: de la ville une très grande quantité de butin
  rationale: « Butin » est le terme courant pour les biens pris à la guerre; la construction française rend clairement l’abondance exprimée par הַרְבֵּה מְאֹד.
- source_word: הוֹצִיא
  choice: emporta
  rationale: Dans le contexte du butin retiré d’une ville conquise, « emporta » rend idiomatiquement le hiphil de יצא sans perdre l’idée de sortie.
theological_decisions:
- issue: מַלְכָּם peut désigner « leur roi » ou être compris comme le nom du dieu ammonite Milkom.
  choice: leur roi
  alternative: Milkom (aussi transcrit Malkam)
  rationale: La vocalisation massorétique et la syntaxe immédiate favorisent le sens commun « leur roi », dont la couronne est retirée de sa tête. La lecture comme nom divin étant ancienne et reconnue, elle est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, narratif et digne. Les formulations restent accessibles tout en conservant le terme historique « talent ». Les deux marqueurs de note [a] et [b] figurent dans le texte.
