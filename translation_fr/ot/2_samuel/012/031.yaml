base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: fr
  text: Il fit sortir les habitants qui s’y trouvaient et les affecta à des travaux avec des scies[a], des pics de fer et des haches de fer ; il les fit aussi travailler au four à briques.[b] Il agit de même envers toutes les villes des Ammonites.[c] Puis David et tout le peuple retournèrent à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les plaça sous la scie, sous des instruments tranchants de fer et sous des instruments de coupe en fer ». Le nom exact de certains outils et la construction de la phrase sont incertains.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est difficile. Traduction traditionnelle : « il les fit passer par le four à briques » ; certains y voient une description de leur mise à mort plutôt que de travaux forcés.'
    reason: alternative_reading
  - marker: c
    text: Comparer 1 Chroniques 20.3, récit parallèle dont la formulation est elle aussi difficile.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: fit sortir
  rationale: Le hifil de יצא exprime normalement l’action de faire sortir ou d’emmener dehors. « Fit sortir » conserve directement cette valeur causative.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: les habitants qui s’y trouvaient
  rationale: Littéralement « le peuple qui était en elle ». Dans le contexte d’une ville conquise, « les habitants » est naturel en français et ne précise pas indûment leur statut.
- source_word: וַיָּשֶׂם
  choice: les affecta à des travaux avec
  rationale: Le verbe signifie littéralement « plaça, mit ». Avec la liste d’outils, la formulation retenue exprime l’interprétation probable d’un travail forcé, tout en signalant en note la construction littérale plus dure et ambiguë.
- source_word: בַּמְּגֵרָה
  choice: avec des scies
  rationale: מְגֵרָה désigne une scie. Le singulier hébreu peut avoir une valeur collective ou instrumentale ; le pluriel convient naturellement à cette liste en français.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: des pics de fer
  rationale: Le terme rare peut désigner des instruments tranchants ou des traîneaux à dépiquer garnis de fer. « Pics de fer » fournit un équivalent plausible dans une liste d’outils, sans masquer l’incertitude lexicale, signalée en note.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: des haches de fer
  rationale: Le mot désigne vraisemblablement des instruments servant à couper. « Haches de fer » est concret et lisible, tandis que la note conserve une traduction plus générale.
- source_word: וְהֶעֱבִיר אֹתָם
  choice: il les fit aussi travailler
  rationale: Le sens littéral est « il les fit passer ». Dans cette construction difficile, le texte principal suit l’interprétation du travail imposé, qui donne un sens cohérent avec les outils et la fabrication de briques. La note maintient l’autre lecture possible.
- source_word: במלכן
  choice: aux fours à briques
  rationale: La forme transmise est difficile. Le contexte et le parallèle de 1 Chroniques 20.3 favorisent souvent un terme lié à la briqueterie. Le pluriel français est idiomatique pour désigner ce type de travail, sans exclure en note la traduction traditionnelle au singulier.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Il agit de même
  rationale: Cette formulation française rend la valeur récapitulative de l’expression et le caractère narratif de l’imparfait hébreu dans son contexte.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: envers toutes les villes des Ammonites
  rationale: « Ammonites » est l’ethnonyme français naturel pour בְנֵי עַמּוֹן.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: retournèrent à Jérusalem
  rationale: שוב suivi d’une destination signifie couramment « retourner ». Le pluriel s’accorde naturellement avec le sujet composé « David et tout le peuple ».
theological_decisions:
- issue: David a-t-il exécuté les captifs ammonites au moyen d’outils et d’un four, ou les a-t-il astreints à de durs travaux ?
  choice: Le texte principal présente une affectation au travail forcé avec des outils et aux fours à briques.
  alternative: On peut comprendre qu’il les plaça sous les scies et les instruments de fer, puis les fit passer par un four à briques, ce qui décrirait leur mise à mort.
  rationale: Les constructions avec וַיָּשֶׂם et וְהֶעֱבִיר, ainsi que la forme finale difficile, autorisent plusieurs analyses. Le contexte de soumission d’une population conquise et le parallèle de 1 Chroniques 20.3 soutiennent la lecture du travail forcé, mais pas au point de supprimer la lecture traditionnelle d’une exécution ; celle-ci est donc explicitement conservée en note.
translation_notes:
  register: Français international moderne, sobre et narratif. Le point-virgule distingue les deux volets du travail imposé sans fragmenter le verset. « Habitants », « affecta à des travaux » et « fours à briques » sont immédiatement compréhensibles, tandis que les notes préservent les ambiguïtés lexicales et la tension morale et théologique du texte hébreu.
