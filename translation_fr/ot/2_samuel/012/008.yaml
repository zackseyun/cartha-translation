base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: fr
  text: Je t’ai donné la maison de ton maître et les épouses de ton maître dans ton giron[a]. Je t’ai donné la maison d’Israël et de Juda. Et si cela avait été trop peu, je t’en aurais ajouté d’autres encore[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ton sein » ou « dans ton giron ». L’expression hébraïque évoque une réception intime ou une mise en possession.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme celles-ci et comme celles-là ». Cette expression hébraïque désigne d’autres choses encore du même ordre.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Je t’ai donné
  rationale: Le wayyiqtol de נתן poursuit l’énumération narrative des dons accordés à David ; le passé composé est naturel en français actuel.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: la maison de ton maître
  rationale: « Maison » conserve la polysémie de בַּיִת — demeure, maisonnée ou maison royale — tandis que « maître » distingue clairement le référent humain du Seigneur.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: les femmes de ton maître
  rationale: נָשִׁים peut désigner les femmes ou les épouses. « Femmes » préserve ici une part de cette latitude sans nier le contexte du harem royal.
- source_word: בְּחֵיקֶךָ
  choice: dans tes bras
  rationale: חֵיק désigne littéralement le sein ou le giron. « Dans tes bras » rend naturellement en français moderne l’image d’une réception intime ou d’une mise en possession.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: la maison d’Israël et de Juda
  rationale: Cette formulation conserve « maison » et son parallélisme avec la première proposition, sans expliciter de façon réductrice « royaume » ou « peuple ».
- source_word: וְאִם מְעָט
  choice: Et si cela avait été trop peu
  rationale: La tournure conditionnelle exprime l’hypothèse d’une insuffisance ; le plus-que-parfait et le conditionnel passé rendent naturellement cette relation en français.
- source_word: וְאֹסִפָה לְּךָ כָּהֵנָּה וְכָהֵנָּה
  choice: j’y aurais ajouté encore bien davantage
  rationale: Le hiphil de יסף indique un ajout, et la locution redoublée כָּהֵנָּה וְכָהֵנָּה exprime idiomatiquement une quantité supplémentaire indéterminée. La formulation française en restitue la force cumulative.
theological_decisions:
- issue: Le transfert des femmes de Saül pourrait-il être formulé comme une approbation divine explicite de relations conjugales ?
  choice: La traduction conserve l’affirmation du transfert et l’image de la proximité, sans ajouter d’approbation morale ni préciser la nature exacte des relations.
  alternative: « Je t’ai donné le harem de ton maître » ou « j’ai confié les femmes de ton maître à tes soins »
  rationale: Le premier choix préciserait excessivement la portée sexuelle ou institutionnelle du transfert ; le second l’atténuerait en simple garde. Le texte hébreu laisse subsister une tension qu’il convient de préserver.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de « maison » est maintenu, tandis que les idiomes hébreux sont rendus naturellement et signalés en notes.
