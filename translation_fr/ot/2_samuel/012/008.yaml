revisions:
- from: Je t’ai donné la maison de ton maître et j’ai mis les femmes de ton maître dans tes bras[a]. Je t’ai donné la maison d’Israël et de Juda. Et si cela avait été trop peu, j’y aurais ajouté encore bien davantage[b].
  to: Je t’ai donné la maison de ton maître et les épouses de ton maître dans ton giron[a]. Je t’ai donné la maison d’Israël et de Juda. Et si cela avait été trop peu, je t’en aurais ajouté d’autres encore[b].
  rationale: La révision rétablit la répétition du verbe « donner », rend נְשֵׁי par « épouses », plus précis dans ce contexte, et remplace l’interprétatif « dans tes bras » par « dans ton giron », proche du lexique hébreu. La dernière proposition maintient l’hypothèse irréelle et le caractère indéterminé de l’idiome, sans ajouter l’idée de quantité excessive. Les notes sont conservées avec une explication moins amplificatrice.
