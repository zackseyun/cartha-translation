  text: When David heard[a], he sent Joab and all the army of the mighty men.
translation:
  language: fr
  text: Quand David entendit, il envoya Joab et toute l’armée des vaillants guerriers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en comprenant « les vaillants guerriers » comme une apposition à « toute l’armée » : « toute l’armée, les vaillants guerriers ». L’hébreu permet les deux analyses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Quand David l’apprit
  rationale: Le verbe שׁמע signifie ici « entendre, apprendre ». « Quand » rend naturellement l’enchaînement narratif, et le pronom « l’ » reprend en français ce que David vient d’apprendre sans préciser davantage l’objet implicite.
- source_word: וַיִּשְׁלַח
  choice: il envoya
  rationale: Le verbe שׁלח au qal a le sens courant d’« envoyer » ; ce choix conserve la simplicité de l’hébreu.
- source_word: אֶת יוֹאָב
  choice: Joab
  rationale: La particule אֶת marque le complément d’objet direct et ne se traduit pas ; le nom propre est rendu sous sa forme française usuelle.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: et toute l’armée
  rationale: צָבָא désigne ici les forces militaires. « Toute l’armée » est clair, actuel et restitue כָּל.
- source_word: הַגִּבֹּרִים
  choice: les vaillants guerriers
  rationale: גִּבּוֹרִים désigne des hommes puissants ou valeureux, ici dans un contexte militaire. « Vaillants guerriers » exprime cette force sans affirmer qu’il s’agit nécessairement d’un corps d’élite institutionnel.
