  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנֻ֨סוּ֙ מִ/פְּנֵ֣י אֲבִישַׁ֔י וַ/יָּבֹ֖אוּ הָ/עִ֑יר וַ/יָּ֣שָׁב יוֹאָ֗ב מֵ/עַל֙ בְּנֵ֣י עַמּ֔וֹן וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: fr
  text: Quand les fils d’Ammon[a] virent qu’Aram[b] avait pris la fuite, ils s’enfuirent devant Abishaï et entrèrent dans la ville. Alors Joab se retira du combat contre les fils d’Ammon[c] et vint à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Ammonites » ; littéralement « les fils d’Ammon ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les Araméens » ; l’hébreu porte le nom collectif « Aram ».
    reason: lexical_alternative
  - marker: c
    text: L’expression signifie que Joab cessa de les combattre et se retira.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: les fils d’Ammon
  rationale: Cette traduction conserve l’expression de parenté hébraïque, naturelle dans un récit biblique français, tout en signalant en note l’équivalent ethnique courant « les Ammonites ».
- source_word: רָאוּ כִּי נָס אֲרָם
  choice: virent qu’Aram avait pris la fuite
  rationale: « Virent que » suit la perception exprimée en hébreu. Le plus-que-parfait marque l’antériorité de la fuite d’Aram par rapport à la réaction des Ammonites. « Prendre la fuite » rend naturellement le verbe נוּס.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom propre hébreu est conservé plutôt que remplacé par l’appellation historiquement moins précise « Syrie ». Il a ici un sens collectif, d’où la variante « les Araméens » en note.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: ils s’enfuirent devant Abishaï
  rationale: « Devant Abishaï » conserve l’image spatiale de מִפְּנֵי et exprime, dans ce contexte militaire, une retraite face à lui.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: entrèrent dans la ville
  rationale: Cette formulation française rend clairement le mouvement vers l’intérieur de la ville fortifiée sans préciser une ville que l’hébreu ne nomme pas.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: Alors Joab se retira du combat contre les fils d’Ammon
  rationale: Dans ce contexte militaire, שׁוּב avec מֵעַל indique que Joab se détourne de l’affrontement et se retire. Cette formulation évite le calque peu naturel « revint de dessus » tout en conservant la nuance hostile de l’expression.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: et revint à Jérusalem
  rationale: Après le retrait du champ de bataille, « revint » exprime naturellement le déplacement de Joab vers Jérusalem. Le contexte permet ce choix sans modifier la destination indiquée par l’hébreu.
