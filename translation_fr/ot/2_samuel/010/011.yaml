  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔/נִּי וְ/הָיִ֥תָה לִּ֖/י לִֽ/ישׁוּעָ֑ה וְ/אִם בְּנֵ֤י עַמּוֹן֙ יֶחֱזְק֣וּ מִמְּ/ךָ֔ וְ/הָלַכְתִּ֖י לְ/הוֹשִׁ֥יעַֽ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: fr
  text: 'Il dit : « Si les Araméens sont plus forts que moi, tu me porteras secours ; et si les Ammonites sont plus forts que toi, j’irai à ton secours. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרָם
  choice: les Araméens
  rationale: Dans ce contexte militaire, le nom collectif désigne naturellement les forces araméennes. Cette formulation française évite toute confusion avec la Syrie moderne.
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: sont plus forts
  rationale: Avec la préposition מן, le verbe חזק exprime ici une supériorité militaire. « Sont plus forts que » reste proche de la forme hébraïque tout en étant naturel en français.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: C’est la désignation française courante de ce groupe ethnique et politique.
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: tu viendras à mon secours
  rationale: L’expression idiomatique française rend la fonction de secours militaire exprimée par יְשׁוּעָה, sans lui donner ici un sens théologique abstrait.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: j’irai à ton secours
  rationale: Cette tournure conserve le mouvement exprimé par הלך et la finalité de sauvetage ou de soutien exprimée par ישׁע.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme de la coordination militaire est conservé par la répétition de « à mon/ton secours ».
