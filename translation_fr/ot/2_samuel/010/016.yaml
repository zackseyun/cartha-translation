  text: וַ/יִּשְׁלַ֣ח הֲדַדְעֶ֗זֶר וַ/יֹּצֵ֤א אֶת אֲרָם֙ אֲשֶׁר֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וַ/יָּבֹ֖אוּ חֵילָ֑ם וְ/שׁוֹבַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: fr
  text: Hadadézer envoya chercher les Araméens qui se trouvaient au-delà du Fleuve[a] et les fit sortir. Ils vinrent à Hélam, avec Shobak[b], chef de l’armée de Hadadézer, devant eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire probablement au-delà de l’Euphrate.
    reason: cultural_note
  - marker: b
    text: Ou « Shobach », autre translittération courante de ce nom.
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, « devant eux » signifie probablement qu’il les conduisait ou marchait à leur tête.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya chercher
  rationale: Le verbe signifie fondamentalement « envoyer ». Comme aucun complément n’est exprimé et que l’action suivante porte sur les Araméens, « envoya chercher » donne en français une coordination naturelle sans effacer l’acte d’envoyer.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: fit sortir les Araméens
  rationale: 'Le hifil de יצא exprime ici la causalité : Hadadézer fait sortir les forces araméennes. « Les fit sortir » conserve cette valeur sans ajouter explicitement « pour combattre ».'
- source_word: אֲרָם
  choice: les Araméens
  rationale: Dans ce contexte militaire, le terme désigne les gens ou les forces d’Aram. « Araméens » reflète directement l’hébreu et évite l’association anachronique que pourrait susciter « Syriens ».
- source_word: מֵעֵבֶר הַנָּהָר
  choice: au-delà du Fleuve
  rationale: L’hébreu dit littéralement « au-delà du Fleuve ». Le texte principal conserve cette désignation, tandis qu’une note identifie probablement le fleuve comme l’Euphrate.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: Ils vinrent à Hélam
  rationale: Le nom de lieu est translittéré, et le verbe courant בוא est rendu simplement par « venir ».
- source_word: וְשׁוֹבַךְ
  choice: Shobak
  rationale: Cette translittération suit la forme consonantique hébraïque. La variante française courante « Shobach » est signalée en note.
- source_word: שַׂר צְבָא
  choice: chef de l’armée
  rationale: L’expression désigne celui qui commande l’armée. « Chef de l’armée » est clair, actuel et digne en français.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: La traduction conserve le sens spatial littéral. Dans ce contexte militaire, l’expression peut impliquer que Shobak marchait à leur tête, possibilité précisée en note sans être imposée dans le texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, au registre narratif digne. La formulation reste proche des enchaînements hébreux tout en rendant naturelle l’action initiale. Les noms propres suivent des translittérations françaises lisibles, et l’ambiguïté de לִפְנֵיהֶם est maintenue dans le texte principal.
