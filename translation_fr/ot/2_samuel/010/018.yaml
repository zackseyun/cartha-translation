  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: fr
  text: Les Araméens s’enfuirent devant Israël. David tua parmi eux sept cents combattants sur chars[a] et quarante mille cavaliers. Il frappa aussi Shobak, chef de son armée[b], et celui-ci mourut là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sept cents chars » ou « sept cents hommes du corps de chars ». Le référent exact de l’hébreu est incertain. En 1 Chroniques 19.18, le texte porte « sept mille chars ».'
    reason: textual_variant
  - marker: b
    text: 'Le suffixe hébreu est au singulier : « son armée ». Il peut désigner l’armée de son maître ou, collectivement, celle des Araméens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: Les Araméens s’enfuirent devant Israël
  rationale: אֲרָם désigne ici collectivement le peuple araméen. « Devant Israël » rend naturellement l’idiome מִפְּנֵי dans un contexte de fuite militaire.
- source_word: וַיַּהֲרֹג דָּוִד מֵאֲרָם
  choice: David tua parmi eux
  rationale: הרג signifie directement « tuer ». Le pronom « eux » reprend les Araméens et rend avec fluidité מֵאֲרָם, littéralement « d’entre Aram ».
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: sept cents combattants sur chars
  rationale: רֶכֶב désigne le char ou le corps de chars. Dans un dénombrement de morts, la formulation française explicite sobrement le référent humain sans corriger le texte hébreu difficile.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: quarante mille cavaliers
  rationale: פָּרָשִׁים désigne des cavaliers ou des soldats de cavalerie ; « cavaliers » est direct et naturel.
- source_word: וְאֵת שׁוֹבַךְ
  choice: Shobak
  rationale: Transcription française lisible du nom propre selon la vocalisation massorétique.
- source_word: שַׂר צְבָאוֹ
  choice: chef de son armée
  rationale: שַׂר a ici le sens militaire de « chef » ou « commandant ». Le singulier « son » conserve fidèlement le suffixe hébreu, dont l’antécédent reste implicite.
- source_word: הִכָּה
  choice: frappa
  rationale: נכה signifie « frapper », souvent avec une issue mortelle. La proposition suivante précise explicitement la mort, ce qui permet de conserver la distinction avec הרג rendu plus haut par « tua ».
- source_word: וַיָּמָת שָׁם
  choice: et celui-ci mourut là
  rationale: « Celui-ci » désigne clairement Shobak, tandis que « là » conserve simplement שָׁם sans ajouter « sur place » ou « au combat ».
theological_decisions: []
translation_notes:
  register: 'Français international actuel, narratif et digne. Le passé simple convient au récit historique écrit. La traduction privilégie la clarté sans effacer les difficultés du texte : le sens collectif d’Aram est explicité, tandis que l’incertitude concernant רֶכֶב et l’antécédent du suffixe singulier est signalée en notes.'
