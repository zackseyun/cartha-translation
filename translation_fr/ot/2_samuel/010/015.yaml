  yaml_path: translation/ot/2_samuel/010/015.yaml
  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: fr
  text: Quand Aram[a] vit qu’il avait été vaincu devant Israël, les Araméens se rassemblèrent tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom propre singulier « Aram » désigne ici collectivement les Araméens. L’hébreu emploie ensuite un verbe au pluriel : « ils se rassemblèrent tous » ou « ils s’assemblèrent tous ensemble ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quand … vit
  rationale: Le waw consécutif fait progresser le récit; « Quand » exprime naturellement le rapport temporel avec le rassemblement qui suit.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom propre est conservé par translittération. Bien que singulier, il désigne ici collectivement le peuple ou les forces araméennes.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qu’Aram constate, et non la cause de l’action.
- source_word: נִגַּף
  choice: avait été vaincu
  rationale: Le nifal exprime une défaite militaire; cette formulation claire n’ajoute aucune précision sur la manière dont elle s’est produite.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le terme signifie littéralement « devant » et, dans ce contexte militaire, évoque une défaite face à Israël sans remplacer implicitement la préposition par « par ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre traditionnel est conservé.
- source_word: וַיֵּאָסְפוּ
  choice: les Araméens se rassemblèrent
  rationale: Le nifal signifie « se rassembler ». La reprise explicite « les Araméens » rend naturellement en français le passage hébreu du nom collectif singulier à un verbe pluriel.
- source_word: יָחַד
  choice: se rassemblèrent
  rationale: L’idée de יָחַד, « ensemble », est déjà naturellement comprise dans le verbe pronominal « se rassembler »; ajouter « ensemble » serait redondant en français.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le nom historique « Aram » est préservé, tandis que « les Araméens » évite en français une rupture grammaticale obscure entre le collectif singulier et le verbe hébreu pluriel.
