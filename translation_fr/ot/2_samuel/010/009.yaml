revisions:
- from: Joab vit que le front de bataille était dressé contre lui, devant et derrière. Il choisit, parmi tous les hommes d’élite d’Israël[a], ceux qu’il rangea en ordre de bataille face à Aram[b].
  to: Joab vit que le front de bataille était déployé contre lui, devant et derrière. Il choisit, parmi tous les hommes d’élite d’Israël[a], et les rangea en ordre de bataille face à Aram[b].
  rationale: 'La révision améliore deux collocations françaises sans changer le contenu : le front est « déployé » plutôt que « dressé », et les hommes sélectionnés sont repris par « les » plutôt que par la relative « ceux qu’il ». Les ancres et le contenu des notes sont conservés.'
