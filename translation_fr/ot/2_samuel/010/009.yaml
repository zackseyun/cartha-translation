    reason: cultural_note
  revision_rationale: 'La révision améliore deux collocations françaises sans changer le contenu : le front est « déployé » plutôt que « dressé », et les hommes sélectionnés sont repris par « les » plutôt que par la relative « ceux qu’il ». Les ancres et le contenu des notes sont conservés.'
