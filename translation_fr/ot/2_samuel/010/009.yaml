  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֤ה אֵלָי/ו֙ פְּנֵ֣י הַ/מִּלְחָמָ֔ה מִ/פָּנִ֖ים וּ/מֵֽ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כֹּל֙ בְּחוּרֵ֣י ב/ישראל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: fr
  text: Joab vit que le front de bataille était déployé contre lui, devant et derrière. Il choisit, parmi tous les hommes d’élite d’Israël[a], et les rangea en ordre de bataille face à Aram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « parmi tous les hommes choisis d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « Aram » désigne les forces araméennes.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Conserve le sens courant de ראה et le style narratif hébreu, tout en laissant le contexte exprimer la prise de conscience tactique.
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: le front de bataille
  rationale: Littéralement « la face de la bataille » ; dans ce contexte militaire, l’expression désigne le front ou la ligne de bataille.
- source_word: הָיְתָה אֵלָיו
  choice: était dressé contre lui
  rationale: Rend la disposition hostile du front de bataille vers Joab sans réduire l’expression à une simple localisation.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: devant et derrière
  rationale: Reproduit clairement et sobrement le contraste spatial qui indique que Joab est menacé des deux côtés.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: Il choisit, parmi tous les hommes d’élite d’Israël
  rationale: בְּחוּרֵי désigne ici des combattants choisis ou de premier ordre ; « hommes d’élite » est naturel en français militaire et מִכֹּל est explicitement conservé par « parmi tous ».
- source_word: וַיַּעֲרֹךְ
  choice: rangea en ordre de bataille
  rationale: Dans un contexte militaire, ערך signifie disposer ou ranger des troupes pour l’affrontement. Le pronom objet « ceux qu’il » explicite en français l’objet sous-entendu en hébreu.
- source_word: לִקְרַאת אֲרָם
  choice: face à Aram
  rationale: לקראת exprime ici la rencontre ou la confrontation militaire ; « face à » convient au contexte tout en conservant le nom collectif Aram.
- source_word: אֲרָם
  choice: Aram
  rationale: Conserve le nom propre hébreu plutôt que de lui substituer un nom géographique plus tardif ; dans ce passage, il désigne collectivement les forces araméennes.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’image hébraïque du « front de bataille » et la menace venant de l’avant comme de l’arrière, tout en explicitant sobrement la mise en ordre des hommes choisis.
