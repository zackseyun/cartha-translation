    issue: 'Collocation militaire légèrement raide : « le front de bataille était dressé »'
    rationale: En français, on déploie ou on établit plus naturellement un front de bataille ; « déployé contre lui » préserve la notion de positionnement hostile sans modifier le sens.
  - severity: low
    issue: Reprise lourde par « ceux qu’il rangea »
    rationale: Le texte hébreu coordonne la sélection et la mise en ordre des hommes. En français, « les rangea » exprime ce lien tout aussi explicitement et plus naturellement.
  revised_text: Joab vit que le front de bataille était déployé contre lui, devant et derrière. Il choisit, parmi tous les hommes d’élite d’Israël[a], et les rangea en ordre de bataille face à Aram[b].
  revised_footnotes:
