  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: fr
  text: Quand les Ammonites virent qu’ils s’étaient rendus odieux à David[a], ils envoyèrent recruter à leur solde les Araméens de Beth-Rehob et les Araméens de Tsoba, soit vingt mille fantassins, ainsi que le roi de Maaka avec mille hommes, et les hommes de Tob[b], au nombre de douze mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qu’ils étaient devenus une puanteur pour David ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou peut-être : « Ish-Tob », si l’expression hébraïque est comprise comme un nom de lieu ou de clan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: virent
  rationale: Le sens premier est « voir »; dans la construction « voir que », le verbe exprime naturellement la prise de conscience sans qu’il soit nécessaire de l’expliciter.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Cette désignation ethnique est plus naturelle en français moderne que le calque « les fils d’Ammon », tout en transmettant exactement le référent collectif.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: s’étaient rendus odieux à David
  rationale: Le verbe évoque littéralement une mauvaise odeur, mais signifie ici devenir repoussant ou odieux pour quelqu’un. La note conserve l’image concrète de l’hébreu.
- source_word: וַיִּשְׁלְחוּ וַיִּשְׂכְּרוּ
  choice: envoyèrent recruter à leur solde
  rationale: L’objet de « envoyèrent » reste implicite en hébreu. Cette formulation française relie naturellement les deux actions sans ajouter explicitement des messagers et rend le caractère rémunéré du recrutement militaire.
- source_word: אֲרַם בֵּית רְחוֹב וְאֶת אֲרַם צוֹבָא
  choice: les Araméens de Beth-Rehob et les Araméens de Tsoba
  rationale: « Araméens » correspond directement à l’ethnonyme hébreu et évite l’appellation traditionnelle mais historiquement moins précise « Syriens ».
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: vingt mille fantassins
  rationale: רַגְלִי désigne des combattants à pied; « fantassins » est précis, actuel et adapté au contexte militaire.
- source_word: מֶלֶךְ מַעֲכָה
  choice: le roi de Maaka
  rationale: La construction désigne le souverain du territoire de Maaka, et non un roi portant Maaka comme nom personnel.
- source_word: וְאִישׁ טוֹב
  choice: les hommes de Tob
  rationale: Dans ce contexte, la phrase est comprise comme une désignation des gens ou combattants de Tob. La possibilité d’y lire le nom composé « Ish-Tob » est signalée en note.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: au nombre de douze mille
  rationale: La formulation rend clairement l’effectif tout en évitant la répétition peu élégante de « hommes » immédiatement après « les hommes de Tob ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les ethnonymes et toponymes sont rendus sous des formes françaises transparentes. La syntaxe clarifie l’énumération militaire sans effacer l’image idiomatique ni l’incertitude textuelle autour de Tob.
