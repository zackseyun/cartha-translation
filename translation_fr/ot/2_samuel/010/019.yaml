base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: fr
  text: Quand tous les rois au service de Hadadézer virent qu’ils avaient été battus devant Israël, ils firent la paix avec Israël et se mirent au service d’Israël. Alors Aram n’osa plus venir au secours des Ammonites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: soumis à Hadadézer
  rationale: Le substantif עֶבֶד peut désigner des serviteurs ou des vassaux. Dans le cas de rois dépendant de Hadadézer, « soumis à » exprime naturellement cette relation politique sans la préciser au-delà du texte.
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: avaient été battus devant Israël
  rationale: Conserve le passif de נִגְּפוּ et rend littéralement l’expression לִפְנֵי sans transformer explicitement Israël en agent grammatical.
- source_word: וַיַּשְׁלִמוּ אֶת יִשְׂרָאֵל
  choice: ils firent la paix avec Israël
  rationale: Dans ce contexte militaire, la forme de שׁלם exprime l’établissement de relations pacifiques.
- source_word: וַיַּעַבְדוּם
  choice: se mirent à son service
  rationale: Le suffixe renvoie à Israël, envisagé collectivement. Cette formulation française claire conserve l’idée de sujétion ou de service sans imposer le terme plus technique « vassaux ».
- source_word: וַיִּרְאוּ אֲרָם לְהוֹשִׁיעַ עוֹד
  choice: les Araméens n’osèrent plus porter secours
  rationale: אֲרָם est un collectif désignant ici les forces ou peuples araméens. Le verbe ירא signifie « craindre »; en français, « ne plus oser » exprime naturellement la crainte qui empêche désormais l’action. הוֹשִׁיעַ a ici le sens contextuel de secourir militairement.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Équivalent français courant de l’expression littérale « fils d’Ammon » lorsqu’elle désigne le peuple.
