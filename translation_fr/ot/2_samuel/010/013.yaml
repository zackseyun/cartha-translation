  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: fr
  text: Alors Joab et le peuple qui était avec lui s’avancèrent pour combattre Aram[a], et les Araméens s’enfuirent devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Aram »; c’est-à-dire les forces araméennes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’avancèrent
  rationale: Le verbe נגשׁ signifie littéralement « s’approcher », mais, avec לַמִּלְחָמָה dans ce contexte militaire, il décrit une avancée en vue d’engager le combat. Le pluriel français accorde naturellement le verbe avec le sujet composé « Joab et le peuple ».
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: et le peuple qui était avec lui
  rationale: Cette formulation reste proche de l’hébreu עָם tout en étant intelligible. Dans le contexte, le terme désigne les hommes qui combattaient sous les ordres de Joab, sans que le texte emploie explicitement un mot signifiant « armée ».
- source_word: לַמִּלְחָמָה
  choice: pour combattre
  rationale: La préposition לְ avec מִלְחָמָה exprime ici le mouvement ou le but orienté vers le combat. « Pour combattre » restitue naturellement cette valeur en français moderne.
- source_word: בַּאֲרָם
  choice: Aram
  rationale: Le texte porte le nom propre singulier « Aram ». La construction française « combattre Aram » exprime l’hostilité sans ajouter un complément absent de l’hébreu; une note précise que le nom désigne ici les forces araméennes.
- source_word: וַיָּנֻסוּ
  choice: s’enfuirent
  rationale: נוּס désigne la fuite, et non nécessairement une retraite ordonnée. « S’enfuirent » en conserve la force.
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: L’expression hébraïque signifie littéralement fuir « de devant sa face ». « Devant lui » est l’équivalent idiomatique français et conserve le suffixe masculin singulier, qui renvoie à Joab.
- source_word: יוֹאָב
  choice: Joab
  rationale: Le nom personnel est rendu selon sa forme française biblique courante.
