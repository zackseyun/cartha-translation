base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: fr
  text: 'Les dignitaires des Ammonites dirent à Hanoun, leur seigneur : « Penses-tu que David honore ainsi ton père à tes yeux, en t’envoyant des hommes pour te consoler[a] ? N’est-ce pas plutôt afin d’examiner la ville, de l’espionner et de la renverser que David a envoyé ses serviteurs auprès de toi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ces hommes sont des envoyés venus présenter à Hanoun leurs condoléances après la mort de son père.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: les dignitaires des Ammonites
  rationale: שָׂרִים désigne ici les hauts responsables de la cour ammonite. « Dignitaires » restitue le cadre politique sans supposer qu’ils appartiennent tous à une famille princière.
- source_word: אֲדֹנֵיהֶם
  choice: leur seigneur
  rationale: Le terme est un titre humain d’autorité appliqué à Hanoun. La minuscule évite toute confusion avec un titre divin.
- source_word: הַמְכַבֵּד ... בְּעֵינֶיךָ
  choice: Crois-tu que David cherche à honorer
  rationale: La formulation rend naturellement en français la question sarcastique et l’idiome « à tes yeux », sans faire de l’accusation des dignitaires une affirmation du narrateur.
- source_word: מְנַחֲמִים
  choice: des hommes pour te consoler
  rationale: Le participe désigne les personnes envoyées pour apporter des consolations après un décès. Cette formulation est plus courante en français moderne que « consolateurs ».
- source_word: הֲלוֹא
  choice: N’est-ce pas plutôt
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative. « Plutôt » fait ressortir l’opposition soupçonneuse implicite dans le contexte.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: examiner la ville
  rationale: חקר exprime une recherche ou une inspection approfondie. « Examiner » convient à l’idée d’une reconnaissance menée sous couvert d’une ambassade.
- source_word: וּלְרַגְּלָהּ
  choice: l’espionner
  rationale: Le piel de רגל signifie espionner ou reconnaître un lieu. Le pronom reprend naturellement « la ville ».
- source_word: וּלְהָפְכָהּ
  choice: la renverser
  rationale: הפך peut signifier retourner, renverser ou bouleverser. Dans ce contexte hostile, « renverser » conserve l’image et l’intention militaire sans préciser indûment le degré de destruction.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עֲבָדִים désigne ici les hommes au service du roi David, envoyés comme représentants. « Serviteurs » préserve le rapport d’autorité du texte.
theological_decisions:
- issue: Le soupçon politique des dignitaires ne constitue pas une affirmation du narrateur
  choice: Conserver les deux questions rhétoriques et attribuer clairement l’accusation aux dignitaires ammonites.
  alternative: Transformer la seconde question en affirmation factuelle selon laquelle David aurait envoyé des espions.
  rationale: Le texte rapporte le soupçon des conseillers de Hanoun sans confirmer qu’il correspond aux véritables intentions de David.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Hanoun » suit une translittération française lisible. La répétition de « ville » au moyen des pronoms féminins conserve les trois objectifs successifs du texte hébreu.
