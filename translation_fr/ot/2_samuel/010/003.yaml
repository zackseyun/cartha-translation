  source_fidelity: Le projet rend correctement l’attribution des paroles aux responsables ammonites, le caractère rhétorique des deux questions et la série des trois buts hostiles. Toutefois, « cherche à honorer » ajoute l’idée de tentative, absente du participe hébreu, et ne rend pas explicitement l’idiome « à tes yeux » (בְּעֵינֶיךָ).
