  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַֽ/יַּעֲרֹ֕ךְ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: fr
  text: Il confia le reste des troupes au commandement d’Abishaï, son frère[a], puis il les rangea en ordre de bataille face aux Ammonites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donna entre les mains d’Abishaï, son frère » ; cette expression signifie qu’il confia les troupes à son autorité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Ammon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: le reste des troupes
  rationale: Littéralement « le reste du peuple » ; dans ce contexte militaire, הָעָם désigne les hommes constituant la force combattante. « Troupes » rend ce sens naturellement en français.
- source_word: נָתַן בְּיַד
  choice: plaça … sous le commandement de
  rationale: L’expression signifie littéralement « donner dans la main de » et indique ici que Joab confie les troupes à l’autorité d’Abishaï.
- source_word: אַבְשַׁי
  choice: Abishaï
  rationale: Translittération française usuelle du nom hébreu.
- source_word: אָחִיו
  choice: son frère
  rationale: Le texte identifie explicitement Abishaï comme le frère de Joab.
- source_word: וַיַּעֲרֹךְ
  choice: qui les rangea en ordre de bataille
  rationale: Dans un contexte militaire, ערך désigne la disposition de troupes en formation. Le relatif « qui » explicite naturellement en français que le sujet est Abishaï, le dernier personnage nommé.
- source_word: לִקְרַאת
  choice: face à
  rationale: La préposition exprime le mouvement ou la disposition en vue d’une rencontre ; le contexte militaire lui donne ici le sens de faire face à l’adversaire.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Littéralement « les fils d’Ammon ». « Les Ammonites » est l’équivalent ethnonymique naturel et non ambigu en français moderne.
