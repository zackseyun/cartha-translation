id: 2SA.10.12
reference: 2 Samuel 10:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: fr
  text: Sois fort, et montrons-nous forts[a] pour notre peuple et pour les villes de notre Dieu. Que Yahweh fasse ce qui est bon à ses yeux[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « soyons forts » ou « fortifions-nous ». Le verbe hébreu est à une forme réfléchie et évoque le fait de faire preuve de force ou de se fortifier.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et Yahweh fera ce qui est bon à ses yeux ». La forme hébraïque peut se comprendre comme un futur simple; elle est rendue ici comme un souhait exprimant la soumission à la volonté de Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Sois fort
  rationale: L’impératif qal masculin singulier adresse une exhortation directe à Joab. « Sois fort » conserve simplement la répétition de la racine חזק avec le verbe suivant.
- source_word: וְנִתְחַזַּק
  choice: et montrons-nous forts
  rationale: Le hitpael cohortatif à la première personne du pluriel exprime l’idée de faire preuve de force ou de se montrer fort. Cette formulation restitue la nuance réfléchie tout en restant naturelle dans un contexte militaire.
- source_word: בְּעַד
  choice: pour
  rationale: Dans ce contexte, la préposition indique que l’on agit en faveur de quelqu’un ou pour sa défense. « Pour » est concis et idiomatique.
- source_word: עַמֵּנוּ
  choice: notre peuple
  rationale: עַם désigne ici le peuple dans son ensemble, et non spécifiquement l’armée; le parallèle avec les villes confirme cette portée collective.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: les villes de notre Dieu
  rationale: Cette traduction reproduit naturellement la chaîne construite hébraïque et maintient le lien entre les villes et le Dieu d’Israël.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: Que Yahweh fasse ce qui est bon à ses yeux
  rationale: Après les exhortations, le yiqtol peut exprimer un souhait qui remet l’issue à Dieu. « Ce qui est bon à ses yeux » conserve sans l’aplanir l’expression idiomatique hébraïque.
theological_decisions:
- issue: Valeur modale de יַעֲשֶׂה
  choice: 'un souhait de soumission : « Que Yahweh fasse… »'
  alternative: 'une affirmation au futur : « Yahweh fera… »'
  rationale: Le contexte d’exhortation favorise une valeur volitive ou jussive, mais la forme yiqtol permet aussi une lecture comme futur simple; cette ambiguïté est signalée en note.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve dans le corps du texte le nom divin employé par la source hébraïque, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, direct et digne. La répétition de « fort/forts » reproduit celle de la racine hébraïque; « montrons-nous forts » garde la nuance réfléchie sans alourdir l’exhortation militaire.
