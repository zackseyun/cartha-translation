lexical_decisions:
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: le roi des Ammonites
  rationale: L’expression hébraïque signifie littéralement « le roi des fils d’Ammon »; « des Ammonites » est l’équivalent français naturel et précis.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Le verbe מָלַךְ désigne ici l’accession au pouvoir après la mort du roi précédent; « devint roi » exprime clairement cette valeur contextuelle.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Rend directement l’idée de succession exprimée par l’hébreu.
- source_word: חָנוּן
  choice: Hanoun
  rationale: Transcription française moderne du nom hébreu, avec « ou » pour la voyelle longue.
