  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗ד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר אֶת הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֖א חֵלָ֑אמָ/ה וַ/יַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד וַ/יִּלָּחֲמ֖וּ עִמּֽ/וֹס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: fr
  text: Quand David en fut informé, il rassembla tout Israël, traversa le Jourdain et arriva à Hélam. Les Araméens se rangèrent en ordre de bataille à la rencontre de David et combattirent contre lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: Quand David en fut informé
  rationale: Le passif impersonnel est préservé sans préciser qui transmet l'information; « en » reprend naturellement les événements rapportés dans le contexte.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: il rassembla tout Israël
  rationale: Cette formulation conserve le collectif large « tout Israël » sans ajouter explicitement « armée ».
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: traversa le Jourdain
  rationale: Traduction directe et idiomatique du mouvement de franchissement.
- source_word: וַיָּבֹא חֵלָמָה
  choice: et arriva à Hélam
  rationale: Le hé directionnel indique un mouvement vers Hélam; le contexte permet de rendre naturellement l'arrivée au lieu.
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: Les Araméens se rangèrent en ordre de bataille
  rationale: Le verbe a ici le sens militaire de disposer les troupes; le gentilé pluriel rend naturellement en français le collectif hébreu « Aram ».
- source_word: לִקְרַאת דָּוִד
  choice: à la rencontre de David
  rationale: La formulation reste proche du sens spatial de l'expression tout en laissant le contexte militaire signaler l'hostilité.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: et combattirent contre lui
  rationale: Bien que l'hébreu emploie littéralement une construction correspondant à « avec lui », celle-ci signifie ici livrer bataille contre lui; « contre » évite en français toute ambiguïté d'alliance.
