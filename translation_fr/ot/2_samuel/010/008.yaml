  text: וַ/יֵּֽצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הַ/שָּׁ֑עַר וַ/אֲרַ֨ם צוֹבָ֤א וּ/רְחוֹב֙ וְ/אִֽישׁ ט֣וֹב וּ/מַֽעֲכָ֔ה לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: fr
  text: Les fils d’Ammon[a] sortirent et se rangèrent en ordre de bataille à l’entrée de la porte, tandis qu’Aram de Tsoba, Rehob, les hommes de Tob[b] et Maaka se tenaient à part dans la campagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Ammonites ». L’hébreu dit littéralement « les fils d’Ammon ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Ish-Tob ». L’hébreu אִישׁ טוֹב peut se comprendre comme « les hommes de Tob » ou comme le nom de lieu « Ish-Tob ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Dans ce récit militaire, יצא décrit la sortie des troupes ammonites, vraisemblablement hors de la ville.
- source_word: בְּנֵי עַמּוֹן
  choice: les fils d’Ammon
  rationale: Cette formulation conserve la construction ethnonymique hébraïque tout en restant intelligible en français; l’équivalent courant « les Ammonites » est signalé en note.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: se rangèrent en ordre de bataille
  rationale: L’expression rend l’idée militaire d’organiser les troupes en formation pour le combat.
- source_word: פֶּתַח הַשָּׁעַר
  choice: à l’entrée de la porte
  rationale: פתח désigne ici l’ouverture ou l’entrée de la porte de la ville, lieu où les Ammonites prennent position.
- source_word: וַאֲרַם צוֹבָא
  choice: tandis qu’Aram de Tsoba
  rationale: « Aram » préserve le nom ancien sans l’identifier anachroniquement à la Syrie moderne; « tandis que » explicite sobrement le contraste de position entre les deux forces.
- source_word: וּרְחוֹב
  choice: Rehob
  rationale: Le nom propre est translittéré selon une forme française claire.
- source_word: וְאִישׁ טוֹב
  choice: les hommes de Tob
  rationale: La graphie hébraïque permet de comprendre « hommes de Tob », c’est-à-dire le contingent venu de Tob; la lecture comme nom de lieu composé reste possible et figure en note.
- source_word: וּמַעֲכָה
  choice: Maaka
  rationale: Le nom propre est translittéré sous une forme lisible qui représente la consonne gutturale médiane par k.
- source_word: לְבַדָּם
  choice: se tenaient à part
  rationale: Cette expression indique que les troupes alliées étaient positionnées séparément des Ammonites; le verbe « se tenaient » supplée naturellement en français la proposition nominale hébraïque.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שׂדה désigne le terrain ouvert hors de la ville; « dans la campagne » exprime naturellement le contraste spatial avec la porte sans ajouter l’idée plus appuyée de « rase campagne ».
