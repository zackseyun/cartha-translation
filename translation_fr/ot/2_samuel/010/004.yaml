base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: fr
  text: Alors Hanoun prit les serviteurs de David, leur rasa la moitié de leurs barbes, coupa leurs vêtements par le milieu, jusqu’aux fesses[a], puis les renvoya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au siège » ou « jusqu’aux parties intimes ». Le terme hébreu est rare, et la partie exacte du corps qu’il désigne fait débat. Le sens est que les vêtements furent coupés très court, de manière à les exposer à la honte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe narratif לקח a ici son sens courant, sans renforcer inutilement l’action par « saisit ».
- source_word: עַבְדֵי דָוִד
  choice: les serviteurs de David
  rationale: עבד peut désigner un serviteur, un esclave ou un agent royal. Dans ce contexte diplomatique, « serviteurs » convient sans préciser excessivement leur statut.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: leur rasa la moitié de la barbe
  rationale: La formulation indique que la moitié de la barbe de chacun fut rasée, geste destiné à les humilier.
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם בַּחֵצִי
  choice: coupa leurs vêtements à mi-hauteur
  rationale: כרת exprime l’action de couper, tandis que בַּחֵצִי situe la coupe au milieu. « À mi-hauteur » rend naturellement cette idée sans préciser le type exact de vêtement.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: jusqu’aux fesses
  rationale: Le terme rare שְׁתוֹת paraît désigner le siège, les fesses ou une partie intime voisine. « Fesses » exprime directement l’exposition humiliante tout en laissant la difficulté lexicale à la note.
- source_word: וַיְשַׁלְּחֵם
  choice: puis les renvoya
  rationale: שלח signifie ici les faire repartir après l’humiliation; « renvoya » est naturel dans la séquence narrative.
