base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: fr
  text: 'Quand on en informa David, il envoya des gens à leur rencontre[a], car ces hommes étaient profondément humiliés[b]. Le roi leur dit : « Restez à Jéricho jusqu’à ce que votre barbe ait repoussé, puis revenez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il envoya à leur rencontre ». L’hébreu ne précise pas qui David envoya.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « couverts de honte » ou « profondément déshonorés ». Le terme hébreu souligne la honte et l’humiliation subies.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Quand on en informa David
  rationale: Le sujet du verbe est indéfini en hébreu. Le pronom français « on » le rend naturellement sans inventer d’acteur précis; « en » renvoie à ce qui était arrivé aux hommes.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: il envoya des gens à leur rencontre
  rationale: L’hébreu dit littéralement qu’il « envoya à leur rencontre » sans nommer l’objet envoyé. Le français exige ici un complément; « des gens » exprime l’implication contextuelle sans préciser qu’il s’agissait de messagers officiels.
- source_word: כִּי הָיוּ הָאֲנָשִׁים נִכְלָמִים מְאֹד
  choice: car ces hommes étaient profondément humiliés
  rationale: כִּי introduit la raison de l’action de David. Le participe niphal de כלם évoque une humiliation ou une honte subie, et מְאֹד en marque l’intensité.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Le roi leur dit
  rationale: Le titre explicite « le roi » est conservé. « Leur » rend en français l’identité des destinataires évidente dans le contexte, sans modifier le sens.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Restez à Jéricho
  rationale: Dans ce contexte, ישׁב signifie demeurer temporairement plutôt que s’asseoir. « À Jéricho » est idiomatique pour le lieu où ils doivent séjourner.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: jusqu’à ce que votre barbe ait repoussé
  rationale: צמח signifie pousser. Le contexte antérieur montre qu’il s’agit d’attendre la repousse de la barbe rasée; le singulier français distributif « votre barbe » convient à un groupe d’hommes.
- source_word: וְשַׁבְתֶּם
  choice: puis revenez
  rationale: שׁוב signifie revenir ou retourner. « Puis » explicite naturellement la succession temporelle déjà indiquée par « jusqu’à ce que » et la conjonction hébraïque.
