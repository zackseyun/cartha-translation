  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כַּ/אֲשֶׁר֩ עָשָׂ֨ה אָבִ֤י/ו עִמָּדִ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֨ח דָּוִ֧ד לְ/נַחֲמ֛/וֹ בְּ/יַד עֲבָדָ֖י/ו אֶל אָבִ֑י/ו וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י דָוִ֔ד אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: fr
  text: 'David dit : « Je ferai preuve de bonté envers Hanoun, fils de Nahash, comme son père en a fait preuve envers moi. » David envoya donc ses serviteurs pour le consoler au sujet de son père[a]. Les serviteurs de David arrivèrent au pays des Ammonites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui présenter ses condoléances pour son père ». L’expression hébraïque désigne vraisemblablement des paroles de consolation à l’occasion de la mort de son père.'
    reason: Précise le sens funéraire probable de l’expression sans l’insérer de manière trop explicite dans le texte principal.
lexical_decisions:
- source_word: חֶסֶד
  choice: bonté
  rationale: Dans ce contexte de relations politiques et personnelles, le terme désigne une bienveillance loyale manifestée entre deux parties. « Bonté » convient aux deux occurrences sans imposer un sens exclusivement alliancé.
- source_word: עָשָׂה ... חֶסֶד
  choice: témoigner de la bonté
  rationale: Cette tournure française naturelle exprime l’action bienveillante indiquée par la construction hébraïque et permet de conserver le parallèle entre David et le père de Hanoun.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: Hanoun, fils de Nahash
  rationale: Les noms propres sont translittérés selon l’usage français, et « fils de » reproduit clairement la relation filiale.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » marque simplement et naturellement la comparaison et la réciprocité évoquées dans le texte.
- source_word: לְנַחֲמוֹ אֶל אָבִיו
  choice: le consoler au sujet de son père
  rationale: Cette formulation reste proche de l’expression hébraïque et préserve sa relative concision, tandis que la note explicite le contexte probable de deuil.
- source_word: בְּיַד עֲבָדָיו
  choice: envoya ses serviteurs
  rationale: Littéralement « par la main de ses serviteurs », l’expression hébraïque indique ici l’intermédiaire ou les agents de l’envoi. En français courant, « envoya ses serviteurs » en transmet naturellement le sens.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: le pays des Ammonites
  rationale: « Ammonites » est l’équivalent français usuel de l’ethnonyme littéralement formé comme « fils d’Ammon ».
