  text: וַ/יְחַלֵּ֨ק לְ/כָל הָ/עָ֜ם לְ/כָל הֲמ֣וֹן יִשְׂרָאֵל֮ לְ/מֵ/אִ֣ישׁ וְ/עַד אִשָּׁה֒ לְ/אִ֗ישׁ חַלַּ֥ת לֶ֨חֶם֙ אַחַ֔ת וְ/אֶשְׁפָּ֣ר אֶחָ֔ד וַ/אֲשִׁישָׁ֖ה אֶחָ֑ת וַ/יֵּ֥לֶךְ כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: fr
  text: Il distribua à tout le peuple, à toute la multitude d’Israël, aux hommes comme aux femmes[b], à chacun une miche de pain, une portion de viande[a] et un gâteau de raisins secs. Puis tout le peuple s’en alla, chacun chez soi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une mesure » ou « une portion ». Le mot hébreu אֶשְׁפָּר est rare. Beaucoup y voient ici une portion de viande, notamment à la lumière du récit parallèle en 1 Chroniques 16.3.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « depuis l’homme jusqu’à la femme » : cet idiome hébreu désigne l’ensemble des personnes rassemblées, hommes et femmes.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Il distribua
  rationale: Le piel de חלק décrit ici la distribution de portions à une foule. « Distribua » est naturel, précis et conserve l’action concrète.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: à tout le peuple, à toute la multitude d’Israël
  rationale: Les deux expressions, appositionnelles et emphatiques, sont maintenues afin de préserver la plénitude de l’hébreu.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: aux hommes comme aux femmes
  rationale: Cette formulation française naturelle exprime la portée inclusive de l’idiome hébreu, qui désigne les personnes des deux sexes présentes dans le rassemblement.
- source_word: לְאִישׁ
  choice: à chacun
  rationale: Le singulier distributif vise chaque personne, puisque le contexte vient d’inclure explicitement hommes et femmes.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: une miche de pain
  rationale: חַלָּה désigne ici un pain ou gâteau de pain. « Miche » donne une image concrète sans ajouter une forme non explicitée.
- source_word: אֶשְׁפָּר אֶחָד
  choice: une portion de viande
  rationale: Le terme rare אֶשְׁפָּר est incertain. Le contexte alimentaire et le parallèle de 1 Chroniques 16.3 favorisent l’idée d’une portion, probablement de viande, sans permettre davantage de précision.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: un gâteau de raisins secs
  rationale: אֲשִׁישָׁה désigne vraisemblablement un gâteau de fruits pressés, traditionnellement compris comme fait de raisins secs dans cet emploi biblique.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: Puis tout le peuple s’en alla, chacun chez soi
  rationale: La phrase décrit la dispersion du peuple après la distribution. « Chacun chez soi » restitue naturellement le singulier distributif sans donner l’impression que seuls les hommes sont concernés.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition emphatique « tout le peuple… toute la multitude d’Israël » est conservée. Les marqueurs de notes sont placés auprès des expressions qu’ils expliquent, et non selon leur position manifestement décalée dans la couche anglaise fournie.
