    issue: « il s’est couvert d’honneur »
    rationale: Cette formulation réflexive suggère que David s’est conféré l’honneur. Le niphal נִכְבַּד présente plutôt David comme honoré/glorieux, avec une louange sarcastique de Mikal.
  - severity: low
    issue: « un homme de rien »
    rationale: La formulation ne rend pas aussi clairement le partitif « l’un des רֵקִים ». « L’un de ces hommes sans valeur » le conserve et reste naturel.
  - severity: low
    issue: Note a imprécise sur les alternatives
    rationale: La note actuelle énumère « serviteurs » parmi les rendus possibles sans distinguer les deux termes hébreux et leurs genres. Une formulation plus précise éclaire le statut social sans brouiller le référent féminin de אמהות.
