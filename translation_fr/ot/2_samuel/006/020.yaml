  to: 'David revint ensuite pour bénir sa maisonnée. Mais Mikal, fille de Saül, sortit à la rencontre de David et dit : « Comme le roi d’Israël s’est montré glorieux aujourd’hui, en se découvrant aujourd’hui sous les yeux des servantes de ses serviteurs[a], comme l’un de ces hommes sans valeur se découvre sans aucune pudeur[b] ! »'
  rationale: La révision corrige la voix et le sens de l’expression sarcastique portant sur l’honneur du roi, rend plus explicitement le partitif de l’insulte finale, et clarifie la note relative aux femmes de statut dépendant. Elle conserve la répétition intentionnelle de « aujourd’hui », l’ambiguïté concernant l’exposition de David, les noms français établis et le ton sarcastique.
