base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: fr
  text: 'David revint ensuite pour bénir sa maisonnée. Mais Mikal, fille de Saül, sortit à la rencontre de David et dit : « Comme le roi d’Israël s’est montré glorieux aujourd’hui, en se découvrant aujourd’hui sous les yeux des servantes de ses serviteurs[a], comme l’un de ces hommes sans valeur se découvre sans aucune pudeur[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des esclaves de ses serviteurs ». L’hébreu désigne des femmes dépendantes de condition subordonnée ; « servantes » conserve la relation avec les serviteurs de David, tandis que « esclaves » explicite davantage leur statut.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne l’un de ceux qui sont jugés méprisables ou sans valeur. La répétition du verbe « se découvrir » renforce l’idée d’une exposition que Mikal présente comme éhontée.
    reason: lexical_and_rhetorical_clarification
lexical_decisions:
- source_word: לְבָרֵךְ
  choice: pour bénir
  rationale: L’infinitif exprime le but du retour de David. « Bénir » garde le sens religieux et relationnel du verbe sans préciser indûment la forme de la bénédiction.
- source_word: בֵּיתוֹ
  choice: sa maisonnée
  rationale: בַּיִת peut désigner la maison ou les personnes qui la composent. Puisque David revient pour les bénir, « maisonnée » exprime naturellement le référent collectif probable.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikal, fille de Saül
  rationale: Cette formulation conserve l’apposition et l’accent narratif porté sur l’identité saülide de Mikal.
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: Comme il s’est couvert d’honneur aujourd’hui
  rationale: Cette tournure conserve le champ lexical de l’honneur et laisse le contexte faire entendre l’ironie mordante de Mikal.
- source_word: נִגְלָה
  choice: en se découvrant
  rationale: Le niphal de גלה indique ici que David s’est rendu découvert ou visible. « Se découvrir » préserve l’ambiguïté sur le degré exact d’exposition.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Expression française naturelle qui garde l’idée d’une action publiquement visible.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: les servantes de ses serviteurs
  rationale: אמה désigne des femmes de condition dépendante, et עבד des serviteurs ou esclaves. « Servantes de ses serviteurs » préserve la relation génitivale et la hiérarchie sociale sans introduire en français une formulation inutilement heurtée.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: comme se découvrirait sans aucune pudeur
  rationale: La construction intensive souligne, dans la bouche de Mikal, le caractère éhonté de l’exposition. L’expression française rend cette intensité accusatrice.
- source_word: אַחַד הָרֵקִים
  choice: un homme de rien
  rationale: ריקים désigne des individus jugés vides, sans valeur ou méprisables. « Un homme de rien » est idiomatique, digne et nettement insultant sans être argotique.
theological_decisions:
- issue: Statut social exprimé par אַמְהוֹת עֲבָדָיו
  choice: les servantes de ses serviteurs
  alternative: les esclaves de ses esclaves
  rationale: Les deux noms peuvent désigner des personnes asservies, mais leur portée lexicale comprend aussi le service domestique et la dépendance. Le texte met surtout en relief le rang inférieur des femmes devant lesquelles David s’est découvert. La traduction retenue conserve cette hiérarchie tout en évitant de trancher plus précisément que le contexte.
- issue: Nature exacte de l’exposition de David
  choice: se découvrir
  alternative: s’exhiber / se dénuder
  rationale: Le verbe גלה évoque le fait de se découvrir, mais le verset ne précise pas explicitement le degré de nudité. La formulation retenue conserve cette ambiguïté et laisse intacte l’accusation sarcastique de Mikal.
translation_notes:
  register: Français international moderne, naturel et digne. Le sarcasme est rendu par une exclamation littéralement élogieuse dont le contexte inverse clairement la portée. La répétition de « aujourd’hui » est conservée parce qu’elle appartient à l’insistance du discours hébreu. Les termes concernant l’exposition et le statut social restent volontairement assez larges pour préserver les ambiguïtés du texte source.
