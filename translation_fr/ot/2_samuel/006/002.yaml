    issue: Le rendu « lui qui siège au-dessus des chérubins » ne traduit pas explicitement עָלָיו.
    rationale: Dans la séquence hébraïque, עָלָיו est le plus naturellement rapporté à l’arche. Le rattacher seulement à « au-dessus des chérubins » laisse de côté la relation des chérubins avec l’arche et résout la construction de manière insuffisamment fidèle.
  - severity: low
    issue: La note d propose « sur les chérubins », mais le texte principal « au-dessus des chérubins » ne rend pas la préposition hébraïque de la même manière.
    rationale: Le texte principal peut exprimer l’image d’intronisation, mais il est préférable de retenir la formulation directement soutenue par le texte et de réserver les autres articulations à la note.
