  source_fidelity: La formule de dénomination est rendue de façon recevable et sa densité est signalée. Toutefois, le pronom final עָלָיו (« sur elle/lui »), qui renvoie le plus naturellement à l’arche, est absorbé dans « au-dessus des chérubins ». Une traduction principale qui explicite les chérubins « sur elle » rend mieux tous les éléments du texte massorétique, sans nier les analyses concurrentes.
  naturalness: Le français est soutenu, clair et moderne. « Qui siège sur les chérubins qui sont sur elle » reste naturel dans un registre biblique accessible et évite de perdre le référent du pronom final.
  terminology: « Yahweh », « des armées », « l’arche de Dieu » et « chérubins » conviennent. La majuscule à « Nom » est cohérente avec la portée révérencielle de la formule, sans modifier son sens.
