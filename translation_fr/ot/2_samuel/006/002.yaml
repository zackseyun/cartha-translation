base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: fr
  text: David se leva et partit avec tout le peuple qui était avec lui, de Baalé-Juda[a], afin de faire monter de là l’arche de Dieu, sur laquelle est invoqué le Nom, le nom de Yahweh des armées[b][c], qui siège sur les chérubins qui sont sur elle[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Baala de Juda ». La forme hébraïque est inhabituelle et semble désigner un lieu associé à Qiryath-Yéarim.
    reason: alternative_reading
  - marker: b
    text: 'La formule hébraïque est très condensée. On peut aussi traduire : « qui est appelée du Nom, du nom de Yahweh des armées » ou « sur laquelle le nom de Yahweh des armées est invoqué ».'
    reason: lexical_alternative
  - marker: c
    text: Certaines traditions rendent « Yahweh » par « le SEIGNEUR » ou « l’Éternel », et transcrivent parfois le titre par « Sabaot ».
    reason: traditional_rendering
  - marker: d
    text: 'L’hébreu peut aussi être compris : « qui siège parmi les chérubins » ou « qui siège au-dessus des chérubins ». La construction finale est concise; le pronom peut renvoyer à l’arche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: se leva et partit
  rationale: Les deux verbes narratifs sont conservés. « Se leva » marque le commencement de l’action, tandis que « partit » exprime naturellement le déplacement en français.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: avec tout le peuple qui était avec lui
  rationale: Cette formulation maintient l’étendue du groupe accompagnant David sans alourdir la syntaxe.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: de Baalé-Juda
  rationale: Le groupe est compris comme un nom de lieu, conformément au mouvement « de là » qui suit. Sa forme inhabituelle et son lien probable avec Baala ou Qiryath-Yéarim sont signalés en note.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: afin de faire monter de là
  rationale: Le hifil de עלה signifie ici faire monter ou amener vers le haut. Cette expression conserve aussi le mouvement traditionnel de l’arche vers Jérusalem.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: C’est la désignation française naturelle et exacte de l’objet sacré dans ce récit.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: sur laquelle est invoqué le Nom
  rationale: La formule hébraïque est condensée. « Est invoqué le Nom » en préserve le caractère solennel et l’association de l’arche au nom divin, sans la réduire à une simple appellation.
- source_word: שֵׁם יְהוָה צְבָאוֹת
  choice: le nom de Yahweh des armées
  rationale: Le redoublement de « nom » dans l’hébreu est gardé. Le tétragramme est rendu par « Yahweh », et צְבָאוֹת par le terme transparent « armées ».
- source_word: יֹשֵׁב הַכְּרֻבִים עָלָיו
  choice: lui qui siège au-dessus des chérubins
  rationale: Dans le cadre symbolique de l’arche, ישׁב peut évoquer l’intronisation. « Au-dessus » rend naturellement la relation entre Yahweh, les chérubins et l’arche, tout en laissant les autres nuances en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; l’Éternel
  rationale: Le texte emploie directement le nom propre divin. « Yahweh » le distingue d’un titre et préserve sa fonction d’alliance.
- issue: Sens du titre צְבָאוֹת
  choice: des armées
  alternative: des puissances ; Sabaot
  rationale: « Des armées » traduit le sens courant du titre sans imposer que les armées soient uniquement terrestres ou célestes.
- issue: Formule condensée associant le Nom à l’arche
  choice: sur laquelle est invoqué le Nom, le nom de Yahweh des armées
  alternative: qui est appelée du Nom, du nom de Yahweh des armées
  rationale: La syntaxe hébraïque permet plusieurs articulations. Le texte principal exprime la formule d’invocation sans transformer l’arche en simple porteuse d’un nom; l’autre analyse est conservée en note.
- issue: Position de Yahweh par rapport aux chérubins
  choice: qui siège au-dessus des chérubins
  alternative: qui demeure entre les chérubins
  rationale: Le choix principal exprime l’image royale liée à l’arche, mais la portée locative et résidentielle du participe demeure possible et est indiquée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La cadence narrative hébraïque est conservée sans tournures archaïques. Les majuscules à « Nom » marquent sa valeur révérencielle dans ce contexte, tandis que les notes maintiennent les ambiguïtés syntaxiques et théologiques réelles.
