  text: וְ/דָוִ֣ד וְ/כָל בֵּ֣ית יִשְׂרָאֵ֗ל מְשַֽׂחֲקִים֙ לִ/פְנֵ֣י יְהוָ֔ה בְּ/כֹ֖ל עֲצֵ֣י בְרוֹשִׁ֑ים וּ/בְ/כִנֹּר֤וֹת וּ/בִ/נְבָלִים֙ וּ/בְ/תֻפִּ֔ים וּ/בִ/מְנַֽעַנְעִ֖ים וּֽ/בְ/צֶלְצֶלִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: fr
  text: 'David et toute la maison d’Israël célébraient[a] devant Yahweh, avec toutes sortes d’instruments en bois de cyprès[b] : lyres, harpes, tambourins, hochets[c] et cymbales.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jouaient » ou « se réjouissaient ». Le verbe hébreu peut désigner une activité joyeuse et festive.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec tous les bois de cyprès ». L’expression difficile désigne probablement divers instruments fabriqués dans ce bois; l’essence exacte de l’arbre est incertaine.'
    reason: textual_or_lexical_difficulty
  - marker: c
    text: L’identification exacte de cet instrument est incertaine; il pourrait s’agir de sistres ou d’un autre instrument que l’on secouait.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: célébraient
  rationale: Au piel, le verbe peut évoquer le jeu, la réjouissance ou une activité festive. « Célébraient » exprime naturellement la fête collective accompagnée d’instruments, sans réduire l’action à un simple jeu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: L’expression désigne une action accomplie en présence de Dieu. « Devant » conserve l’idiome hébreu de manière naturelle en français.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: avec toutes sortes d’instruments en bois de cyprès
  rationale: L’hébreu, littéralement « avec tous les bois de cyprès », est elliptique et difficile. Le contexte musical permet de rendre explicite le mot « instruments », tout en signalant cette explicitation en note.
- source_word: בְרוֹשִׁים
  choice: cyprès
  rationale: « Cyprès » est un équivalent courant, mais l’identification botanique exacte demeure incertaine.
- source_word: כִנֹּרוֹת
  choice: lyres
  rationale: Le kinnor était un instrument à cordes de type lyre; ce terme est plus précis que « harpe ».
- source_word: נְבָלִים
  choice: harpes
  rationale: Le nevel était un instrument à cordes distinct du kinnor. « Harpes » est une désignation conventionnelle et compréhensible, sans prétendre en fixer exactement la forme.
- source_word: תֻפִּים
  choice: tambourins
  rationale: Le terme désigne probablement des tambours sur cadre employés lors des fêtes; « tambourins » est l’équivalent français courant.
- source_word: מְנַעַנְעִים
  choice: hochets
  rationale: Ce mot rare semble désigner des instruments que l’on secoue. « Hochets » en rend clairement le fonctionnement, tandis qu’une identification plus technique reste incertaine.
- source_word: צֶלְצֶלִים
  choice: cymbales
  rationale: Le contexte et l’usage lexical soutiennent l’identification comme instruments métalliques entrechoqués.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: Cette traduction conserve l’expression collective de l’hébreu plutôt que de la réduire à « tout Israël ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin et évite de le remplacer par un titre.
- issue: Nature de l’activité exprimée par מְשַׂחֲקִים
  choice: célébraient
  alternative: jouaient / se réjouissaient
  rationale: Le contexte décrit une procession festive devant Yahweh. « Célébraient » garde la dimension religieuse et communautaire sans préciser indûment qu’ils jouaient eux-mêmes de chacun des instruments.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase garde « la maison d’Israël » et le nom Yahweh, tout en explicitant sobrement l’ellipse concernant les instruments. Les notes préservent les incertitudes réelles du vocabulaire hébreu.
