  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: fr
  text: L’arche de Yahweh resta pendant trois mois dans la maison d’Obed-Édom, le Guitthien[a]. Yahweh bénit Obed-Édom et toute sa maisonnée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le Guitthien », c’est-à-dire une personne originaire de Gath ou liée à cette ville.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « toute sa maison ». Le mot hébreu peut désigner au sens large sa famille ou l’ensemble de son établissement domestique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Avec l’arche pour sujet et une indication de durée, « resta » exprime naturellement la présence continue indiquée par ישׁב, sans personnifier excessivement l’arche.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Le groupe construit est rendu directement. « Arche » est le terme français établi dans ce contexte, et le nom divin est translittéré.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: la maison d’Obed-Édom
  rationale: Dans la première occurrence, בֵּית désigne le lieu concret où l’arche demeure; « maison » convient donc mieux que « maisonnée ».
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Édom
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: הַגִּתִּי
  choice: le Guittite
  rationale: Le gentilé hébreu est conservé sous sa forme française traditionnelle; une note précise son lien avec Gath.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: pendant trois mois
  rationale: « Pendant » rend idiomatiquement en français la durée exprimée en hébreu.
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Le verbe ברך signifie normalement « bénir »; le contexte ne justifie pas une paraphrase plus interprétative.
- source_word: וְאֶת כָּל בֵּיתוֹ
  choice: et toute sa maisonnée
  rationale: Dans cette seconde occurrence, בַּיִת peut désigner l’ensemble familial et domestique. « Maisonnée » restitue cette portée plus naturellement que le littéral « toute sa maison ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le préserve sans le remplacer par un titre.
- issue: Portée de כָּל בֵּיתוֹ
  choice: toute sa maisonnée
  alternative: toute sa maison
  rationale: L’expression peut englober la famille et l’établissement domestique. La traduction retenue rend ce sens probable tout en signalant dans une note l’alternative plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant une tournure pesante; la répétition de « Yahweh » est conservée. Les marqueurs de notes suivent immédiatement les expressions qu’ils expliquent.
