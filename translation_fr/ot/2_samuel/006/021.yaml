  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: fr
  text: 'David dit à Mikal : « C’est devant Yahweh — lui qui m’a choisi de préférence à ton père et à toute sa maison pour m’établir chef sur le peuple de Yahweh, sur Israël — que je me suis réjoui[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que j’ai dansé devant Yahweh ». Le verbe hébreu a un sens plus large et peut désigner une action joyeuse, festive ou enjouée.'
    reason: Préserve l’interprétation contextuelle possible de l’action comme danse, sans restreindre dans le texte principal le sens plus large du verbe hébreu.
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La locution exprime une action accomplie en présence de Yahweh. « Devant » est naturel en français et permet de conserver la mise en relief ainsi que la répétition conceptuelle du texte hébreu.
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: lui qui m’a choisi de préférence à ton père et à toute sa maison
  rationale: Après בחר, מן marque ici la préférence ou la sélection par contraste. « De préférence à » rend ce rapport plus naturellement que « au-dessus de » en français. « Maison » conserve le sens à la fois familial et dynastique.
- source_word: לְצַוֹּת אֹתִי נָגִיד
  choice: pour m’établir chef
  rationale: Dans cette construction liée à une fonction, צוה exprime la désignation ou l’établissement dans une charge. נָגִיד désigne un détenteur d’autorité; « chef » est clair, actuel et n’introduit pas la nuance héréditaire possible de « prince ».
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: sur le peuple de Yahweh, sur Israël
  rationale: La répétition de עַל est conservée, Israël venant préciser l’identité du peuple de Yahweh.
- source_word: וְשִׂחַקְתִּי
  choice: j’ai manifesté ma joie
  rationale: שׂחק peut désigner une conduite joyeuse, festive ou enjouée. Cette formulation française rend l’action publique et joyeuse sans la réduire nécessairement à la danse, exprimée plus précisément par d’autres verbes dans le contexte proche.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération préserve le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- issue: Nature exacte de l’action exprimée par שׂחק
  choice: j’ai manifesté ma joie
  alternative: j’ai dansé
  rationale: Le verbe a un sens plus large que la seule danse. Le texte principal préserve cette latitude sémantique, tandis que la lecture contextuelle traditionnelle « j’ai dansé » est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase clivée « C’est devant Yahweh… que » reproduit la forte mise en relief initiale de לִפְנֵי יְהוָה tout en restant idiomatique. Les tirets encadrent l’explication relative sans effacer la tension de la réponse de David.
