  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: fr
  text: Ils emportèrent de la maison d’Abinadab, qui se trouvait sur la colline[a], l’arche de Dieu, tandis qu’Ahio marchait devant l’arche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Guibéa ». Le mot hébreu גִּבְעָה peut désigner une « colline » ou être le nom de lieu « Guibéa ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Ils la transportèrent
  rationale: Le verbe נשׂא, au pluriel avec un suffixe masculin singulier renvoyant à l’arche, exprime ici son déplacement. « Transportèrent » reste naturel sans préciser à tort qu’elle était portée à la main.
- source_word: מִבֵּית אֲבִינָדָב
  choice: depuis la maison d’Abinadab
  rationale: La préposition מן indique le point de départ. « Depuis » convient au mouvement décrit, tout en conservant le lien direct avec la maison d’Abinadab.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: qui se trouvait sur la colline
  rationale: גִּבְעָה peut être le nom commun « colline » ou le toponyme « Guibéa ». Avec l’article, le sens commun est retenu dans le texte, sans éliminer l’autre lecture.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: avec l’arche de Dieu
  rationale: Traduction directe de l’accompagnement marqué par עִם et de l’expression אֲרוֹן הָאֱלֹהִים.
- source_word: וְאַחְיוֹ
  choice: tandis qu’Ahio
  rationale: Le nom propre est translittéré « Ahio ». « Tandis que » rend clairement la simultanéité liée au participe suivant, sans changer le rapport entre les actions.
- source_word: הֹלֵךְ
  choice: marchait
  rationale: Le participe décrit une action en cours pendant le transport. L’imparfait français restitue naturellement cette valeur durative.
- source_word: לִפְנֵי הָאָרוֹן
  choice: devant l’arche
  rationale: לִפְנֵי a ici son sens spatial ordinaire et situe Ahio en tête du déplacement.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’imparfait marque l’action continue d’Ahio; « transportèrent » évite de suggérer un portage manuel. L’ambiguïté géographique est conservée en note.
