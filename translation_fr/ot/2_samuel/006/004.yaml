    issue: Redondance référentielle incohérente dans « Ils la transportèrent ... avec l’arche de Dieu ».
    rationale: Le pronom féminin ne peut naturellement renvoyer qu’à l’arche, de sorte que la formulation française donne l’impression qu’elle est transportée avec elle-même. La formulation révisée exprime l’objet du transport directement, sans trancher au-delà du contexte.
  revised_text: Ils emportèrent de la maison d’Abinadab, qui se trouvait sur la colline[a], l’arche de Dieu, tandis qu’Ahio marchait devant l’arche.
