source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: fr
  text: Comme l’arche de Yahweh entrait dans la cité de David, Mikal, fille de Saül, regarda par la fenêtre. Elle vit le roi David bondir et tournoyer[a] devant Yahweh, et elle le méprisa dans son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les verbes hébreux décrivent des mouvements exubérants de célébration : David bondit et tournoie devant Yahweh.'
    reason: Précision lexicale sur deux verbes rares et expressifs.
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: Comme ... entrait
  rationale: La construction ouvre une scène en cours et situe temporellement le regard de Mikal. Cette formulation française restitue naturellement la valeur circonstancielle sans ajouter un événement distinct.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Le groupe construit est rendu directement, et le nom divin est translittéré afin de préserver le nom propre présent dans l’hébreu.
- source_word: עִיר דָּוִד
  choice: la cité de David
  rationale: Cette désignation géographique traditionnelle est conservée; « cité » convient au nom propre historique sans modifier son référent.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikal, fille de Saül
  rationale: L’apposition garde l’identification par la filiation, importante dans le récit, dans un français fluide.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: regarda par la fenêtre
  rationale: Le verbe décrit un regard porté depuis une ouverture, possiblement depuis un point élevé; « par la fenêtre » conserve l’image sans imposer la direction « vers le bas ».
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Ordre idiomatique du titre suivi du nom en français.
- source_word: מְפַזֵּז
  choice: bondir
  rationale: Le verbe rare évoque un mouvement vif et exubérant; « bondir » en conserve la force physique.
- source_word: וּמְכַרְכֵּר
  choice: tournoyer
  rationale: Le terme évoque un mouvement tournant; ce choix maintient la distinction avec le premier verbe au lieu de réduire les deux à « danser ».
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: elle le méprisa dans son cœur
  rationale: La formulation garde à la fois la force du mépris et son caractère intérieur explicitement exprimé en hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin propre. Sa translittération préserve cette donnée du texte source au lieu de la remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et narratif. Deux phrases évitent une accumulation lourde tout en conservant l’enchaînement des actions. Le marqueur [a] est placé après les verbes qu’il explique.
