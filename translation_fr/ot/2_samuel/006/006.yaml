  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן נָכ֑וֹן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶל אֲר֤וֹן הָֽ/אֱלֹהִים֙ וַ/יֹּ֣אחֶז בּ֔/וֹ כִּ֥י שָׁמְט֖וּ הַ/בָּקָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: fr
  text: Quand ils arrivèrent à l’aire de battage de Nakôn[a], Ouzza tendit la main vers l’arche de Dieu et la saisit, parce que les bœufs avaient trébuché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « l’aire de battage de Nakhôn » ou, moins probablement, « l’aire de battage stable (ou établie) ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avaient glissé »; le verbe peut aussi suggérer que les bœufs étaient sur le point de faire basculer l’arche.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: aire de battage
  rationale: Le nom désigne l’espace où l’on battait les céréales; « aire de battage » est l’équivalent français courant et précis.
- source_word: נָכוֹן
  choice: Nakôn
  rationale: La forme est comprise de préférence comme un nom propre associé à l’aire de battage. La vocalisation « Nakôn » distingue la consonne hébraïque כ de ח, généralement transcrite « kh ».
- source_word: וַיִּשְׁלַח ... אֶל
  choice: tendit la main vers
  rationale: Le verbe exprime ici le geste d’étendre la main en direction d’un objet; l’ajout explicite de « la main » est naturel en français et implicite dans le contexte.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: La désignation complète est conservée afin de rendre explicitement le syntagme hébreu.
- source_word: וַיֹּאחֶז בּוֹ
  choice: la saisit
  rationale: אחז signifie saisir ou tenir fermement. « La saisit » rend l’action de façon concise sans lui prêter une violence supplémentaire.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la cause immédiate du geste d’Ouzza.
- source_word: שָׁמְטוּ
  choice: avaient trébuché
  rationale: Dans ce contexte, le verbe évoque une perte d’appui ou de maîtrise. « Avaient trébuché » exprime naturellement en français l’événement qui provoque le geste, tout en laissant en note les autres possibilités lexicales.
- source_word: הַבָּקָר
  choice: les bœufs
  rationale: Dans le contexte du transport par char, il s’agit des bovins de trait; « bœufs » est plus précis que « bovins » ou « gros bétail ».
theological_decisions:
- issue: Cause du geste d’Ouzza
  choice: Ouzza agit parce que les bœufs avaient trébuché.
  alternative: Les bœufs avaient glissé, ou étaient sur le point de faire basculer l’arche.
  rationale: L’hébreu donne les bœufs comme sujet d’un verbe pouvant évoquer le glissement, le relâchement ou la chute, sans décrire précisément le mouvement de l’arche. La traduction principale conserve donc la cause immédiate sans expliciter davantage le mécanisme.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte la progression du récit; le plus-que-parfait marque naturellement en français la cause immédiatement antérieure. Les variantes lexicales réelles sont conservées en notes sans résoudre au-delà du texte la mécanique de l’incident.
