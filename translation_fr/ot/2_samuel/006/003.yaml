source:
  edition: WLC
  text: וַ/יַּרְכִּ֜בוּ אֶת אֲר֤וֹן הָֽ/אֱלֹהִים֙ אֶל עֲגָלָ֣ה חֲדָשָׁ֔ה וַ/יִּשָּׂאֻ֔/הוּ מִ/בֵּ֥ית אֲבִינָדָ֖ב אֲשֶׁ֣ר בַּ/גִּבְעָ֑ה וְ/עֻזָּ֣א וְ/אַחְי֗וֹ בְּנֵי֙ אֲבִ֣ינָדָ֔ב נֹהֲגִ֖ים אֶת הָ/עֲגָלָ֥ה חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: fr
  text: Ils placèrent l’arche de Dieu sur un chariot neuf et l’emportèrent de la maison d’Abinadab, qui se trouvait sur la colline[a]. Ouzza et Ahio, fils d’Abinadab, conduisaient le chariot neuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui se trouvait à Guibéa », si l’on comprend le terme hébreu comme un nom de lieu plutôt que comme une indication topographique.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: Ils placèrent ... sur
  rationale: Le causatif de רכב exprime ici le fait de faire monter ou de placer sur un véhicule. Cette formulation est naturelle en français et décrit précisément l’action.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: « Arche » est le terme français consacré pour ce coffre sacré et conserve sa référence cultuelle.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: sur un chariot neuf
  rationale: Dans ce contexte de mise en place sur un véhicule, « sur » rend idiomatiquement אֶל. « Chariot » convient à עֲגָלָה.
- source_word: וַיִּשָּׂאֻהוּ
  choice: l’emportèrent
  rationale: נשא signifie lever, porter ou emporter. « L’emportèrent » garde cette valeur tout en évitant de suggérer nécessairement un portage manuel, puisque l’arche repose sur le chariot.
- source_word: מִבֵּית אֲבִינָדָב
  choice: de la maison d’Abinadab
  rationale: Rendu direct de la construction hébraïque, dans un français naturel et digne.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: qui se trouvait sur la colline
  rationale: Le sens topographique est le plus immédiat, notamment avec l’article hébreu, mais l’éventuelle lecture comme nom de lieu est conservée en note.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: Ouzza et Ahio
  rationale: Translittérations françaises usuelles des noms propres.
- source_word: בְּנֵי אֲבִינָדָב
  choice: fils d’Abinadab
  rationale: בְּנֵי désigne naturellement ici les fils au sens familial immédiat.
- source_word: נֹהֲגִים
  choice: conduisaient
  rationale: Le participe de נהג peut signifier mener ou conduire. Avec le chariot comme complément, « conduisaient » est le choix le plus naturel.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: le chariot neuf
  rationale: La répétition du syntagme hébreu est maintenue pour préserver la forme et l’insistance narratives.
theological_decisions: []
