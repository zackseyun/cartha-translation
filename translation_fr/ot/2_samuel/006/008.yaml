  text: וַ/יִּ֣חַר לְ/דָוִ֔ד עַל֩ אֲשֶׁ֨ר פָּרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑ה וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: fr
  text: David se mit en colère parce que Yahweh avait fait irruption contre Ouzza[a], et il donna à ce lieu le nom de Perets-Ouzza, jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Perets-Ouzza » évoque une « brèche » ou une « irruption » concernant Ouzza. Le nom reprend la racine hébraïque du verbe traduit par « avait fait irruption ».
    reason: Le jeu de mots fondé sur la racine hébraïque פרץ ne peut pas être entièrement reproduit dans une traduction française naturelle.
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: David se mit en colère
  rationale: L’expression idiomatique avec חרה indique que la colère de David s’enflamma. « Se mit en colère » est naturel en français moderne et conserve le déclenchement de l’émotion.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: Yahweh s’était déchaîné contre Ouzza
  rationale: Le verbe פרץ évoque une irruption soudaine et destructrice. « S’était déchaîné contre » restitue cette force en français courant; le jeu étymologique entre le verbe, le nom et le toponyme est expliqué en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Il donna donc à ce lieu le nom de
  rationale: Formule française naturelle pour l’attribution d’un nom. « Donc » exprime le lien narratif porté ici par la coordination hébraïque.
- source_word: פֶּרֶץ עֻזָּה
  choice: Perets-Ouzza
  rationale: Le toponyme hébreu est translittéré; la note rend accessible sa signification et son écho avec le verbe précédent.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: qu’il porte encore aujourd’hui
  rationale: Cette formulation idiomatique rattache clairement la formule temporelle au nom donné au lieu.
theological_decisions:
- issue: Expression de l’action directe de Yahweh dans la mort d’Ouzza
  choice: Yahweh s’était déchaîné contre Ouzza
  alternative: Yahweh avait ouvert une brèche contre Ouzza
  rationale: Le texte attribue directement à Yahweh une intervention soudaine et destructrice. La traduction ne l’atténue pas en accident ou en simple conséquence, tout en évitant en français une métaphore de « brèche » difficile à comprendre sans explication.
- issue: Objet de la colère de David
  choice: parce que Yahweh s’était déchaîné contre Ouzza
  alternative: à cause de la brèche que Yahweh avait ouverte contre Ouzza
  rationale: La construction causale est conservée sans préciser davantage si la colère de David vise Yahweh, l’événement ou ses circonstances, afin de préserver la tension du texte.
translation_notes:
  register: Français international moderne, narratif et digne. « Se déchaîner contre » garde la violence soudaine du verbe hébreu sans introduire un moyen d’action absent du verset. Le nom propre est translittéré sous la forme française « Perets-Ouzza ».
