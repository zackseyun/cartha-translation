reference: 2 Samuel 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/דָוִ֛ד מְכַרְכֵּ֥ר בְּ/כָל עֹ֖ז לִ/פְנֵ֣י יְהוָ֑ה וְ/דָוִ֕ד חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: fr
  text: David dansait[a] de toute sa force devant Yahweh, et David portait un éphod[b] de lin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tournoyait » ou « bondissait » ; l’hébreu évoque un mouvement festif plein d’énergie.
    reason: lexical_alternative
  - marker: b
    text: L’éphod était un vêtement particulier associé au service sacerdotal ou au culte ; David porte ici un éphod fait de lin.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: dansait
  rationale: Le participe décrit un mouvement corporel énergique et festif. « Dansait » est clair et naturel en français, sans préciser indûment s’il tournoyait ou bondissait.
- source_word: בְּכָל עֹז
  choice: de toute sa force
  rationale: Cette expression marque l’intensité et l’engagement physique total. « De toute sa force » restitue directement cette idée en français courant.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant » ou « en présence de ». La formulation retenue est concise et conserve le cadre cultuel de la scène.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: חָגוּר
  choice: portait
  rationale: La forme décrit David revêtu ou ceint du vêtement. « Portait » est naturel en français moderne et évite l’archaïsme de « était ceint de ».
- source_word: אֵפוֹד
  choice: éphod
  rationale: L’éphod est un vêtement cultuel israélite spécifique sans équivalent français exact ; la translittération conserve le terme technique.
- source_word: בָּד
  choice: de lin
  rationale: Dans ce contexte, בָּד désigne la matière du vêtement. « De lin » rend le sens sans ajouter une qualité telle que « fin » qui n’est pas explicitée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le Tétragramme. « Yahweh » conserve ici le nom personnel de Dieu sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « David », présente dans l’hébreu, est conservée. Les marqueurs de notes sont placés immédiatement après les termes qu’ils éclairent.
