source:
  edition: WLC
  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: fr
  text: 'On rapporta au roi David : « Yahweh[a] a béni la maison d’Obed-Édom et tout ce qui lui appartient à cause de l’arche de Dieu. » David partit donc et fit monter l’arche de Dieu de la maison d’Obed-Édom à la cité de David, avec joie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom divin également rendu traditionnellement par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque et l’autre convention majeure de traduction du tétragramme.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On rapporta
  rationale: Le hophal passif ne nomme pas l’informateur. Le passif impersonnel hébreu est rendu par le pronom indéfini « on », naturel en français tout en maintenant l’agent indéterminé.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: au roi David
  rationale: Cette formulation française naturelle conserve à la fois le titre et le nom.
- source_word: לֵאמֹר
  choice: ': « … »'
  rationale: Plutôt qu’un calque lourd comme « en disant », les deux-points et le discours direct remplissent naturellement en français la fonction du marqueur de citation hébreu.
- source_word: בֵּרַךְ יְהוָה
  choice: Yahweh a béni
  rationale: Le passé composé présente l’action accomplie dont le résultat est pertinent au moment du rapport.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer silencieusement un titre.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: la maison d’Obed-Édom
  rationale: « Maison » conserve la portée concrète et familiale du terme hébreu, qui peut désigner le foyer et les biens qui lui sont liés.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: et tout ce qui lui appartient
  rationale: Expression française courante qui englobe les biens et ce qui relève de sa maisonnée sans préciser plus que l’hébreu.
- source_word: בַּעֲבוּר
  choice: à cause de
  rationale: La locution exprime directement le rapport causal entre la présence de l’arche et la bénédiction.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Rendu direct et traditionnel de l’expression hébraïque, sans explicitation ajoutée.
- source_word: וַיֵּלֶךְ דָּוִד
  choice: David partit donc
  rationale: « Donc » fait ressortir que David agit en réponse à la nouvelle, tandis que « partit » fait avancer naturellement le récit.
- source_word: וַיַּעַל אֶת אֲרוֹן הָאֱלֹהִים
  choice: fit monter l’arche de Dieu
  rationale: Le causatif exprime que David organise le transport de l’arche vers la cité de David; « monter » préserve la nuance directionnelle de עלה.
- source_word: בְּשִׂמְחָה
  choice: avec joie
  rationale: Formulation idiomatique et concise qui conserve la manière joyeuse dont l’arche fut transportée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre, tandis que la note signale le remplacement traditionnel par un titre sans imposer cette solution dans le texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe évite les calques hébraïques inutiles tout en conservant la causalité, la progression du récit et la répétition de « l’arche de Dieu ». Le nom Obed-Édom suit une graphie française lisible.
