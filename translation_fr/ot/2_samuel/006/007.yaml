  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔ה וַ/יַּכֵּ֥/הוּ שָׁ֛ם הָ/אֱלֹהִ֖ים עַל הַ/שַּׁ֑ל וַ/יָּ֣מָת שָׁ֔ם עִ֖ם אֲר֥וֹן הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: fr
  text: La colère de Yahweh s’enflamma contre Ouzza, et Dieu le frappa là à cause de cette faute[a]. Il mourut là, près de l’arche de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de son acte irréfléchi » ; peut-être : « parce qu’il avait étendu la main ». L’expression hébraïque est difficile et a été comprise de plusieurs manières.'
    reason: Lecture alternative d’une expression hébraïque rare et obscure.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: La colère … s’enflamma
  rationale: Cette formulation française naturelle conserve l’image hébraïque d’une colère qui brûle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּעֻזָּה
  choice: contre Ouzza
  rationale: Avec l’expression חרה אף, la préposition désigne la personne contre laquelle la colère est dirigée.
- source_word: וַיַּכֵּהוּ
  choice: le frappa
  rationale: Le verbe signifie couramment « frapper » ; la mort est énoncée séparément dans la proposition suivante.
- source_word: שָׁם
  choice: là
  rationale: Le mot est maintenu à ses deux occurrences afin de préserver l’insistance narrative sur le lieu.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Le texte passe du nom Yahweh à la désignation « Dieu » ; cette variation est conservée.
- source_word: עַל הַשַּׁל
  choice: à cause de cette faute
  rationale: Le substantif שַׁל est rare et obscur. « Faute » indique un acte répréhensible sans définir plus précisément sa nature, tandis que « cette » donne une tournure française naturelle au syntagme défini.
- source_word: וַיָּמָת
  choice: Il mourut
  rationale: Le passé simple convient au registre narratif biblique moderne et exprime directement la conséquence énoncée par le texte.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: près de l’arche de Dieu
  rationale: Dans ce contexte spatial, « près de » rend naturellement עִם sans suggérer un accompagnement.
theological_decisions:
- issue: La cause du jugement dans l’expression obscure עַל הַשַּׁל
  choice: à cause de cette faute
  alternative: à cause de son acte irréfléchi ; peut-être parce qu’il avait étendu la main
  rationale: Le terme hébreu est rare et son sens précis demeure discuté. Le texte principal signale une faute sans trancher entre erreur, irrévérence, précipitation ou geste de la main ; la note conserve les principales possibilités.
translation_notes:
  register: Français international actuel, clair et digne. Le passé simple maintient un ton narratif soutenu sans archaïsme. La répétition de « là » et la variation entre « Yahweh » et « Dieu » suivent délibérément l’hébreu.
