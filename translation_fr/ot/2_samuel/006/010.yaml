  text: וְ/לֹֽא אָבָ֣ה דָוִ֗ד לְ/הָסִ֥יר אֵלָ֛י/ו אֶת אֲר֥וֹן יְהוָ֖ה עַל עִ֣יר דָּוִ֑ד וַ/יַּטֵּ֣/הוּ דָוִ֔ד בֵּ֥ית עֹבֵֽד אֱד֖וֹם הַ/גִּתִּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: fr
  text: David ne voulut donc pas faire venir l’arche de Yahweh auprès de lui, dans la Cité de David[a] ; il la détourna vers la maison d’Obed-Édom, le Guitthien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à la Cité de David » ou « vers la Cité de David ». La préposition hébraïque peut exprimer la direction et suggérer ici un mouvement de montée.'
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire : « l’homme de Gath ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ne voulut pas
  rationale: Le verbe exprime ici l’absence de volonté ou de consentement. « Ne voulut pas » reste naturel en français sans renforcer indûment le sens en « refusa ».
- source_word: לְהָסִיר אֵלָיו
  choice: faire monter ... auprès de lui
  rationale: Le hiphil de סור exprime le déplacement de l’arche vers David; « faire monter » convient au mouvement vers la Cité de David, tandis que « auprès de lui » conserve אֵלָיו.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Le groupe construit est rendu directement, et le nom divin est translittéré afin de représenter le tétragramme.
- source_word: עַל עִיר דָוִד
  choice: dans la Cité de David
  rationale: Dans ce contexte de déplacement, עַל indique la destination et peut aussi suggérer une montée. « Dans » exprime naturellement l’entrée dans la ville; l’autre nuance est signalée en note.
- source_word: וַיַּטֵּהוּ
  choice: il la détourna
  rationale: נטה signifie ici diriger ailleurs ou détourner de la destination prévue. Le pronom féminin français reprend « l’arche ».
- source_word: בֵּית עֹבֵד אֱדום
  choice: la maison d’Obed-Édom
  rationale: בֵּית désigne vraisemblablement la demeure où l’arche fut accueillie, tout en pouvant englober la maisonnée.
- source_word: הַגִּתִּי
  choice: le Guittite
  rationale: Le gentilé hébreu est conservé sous sa forme française traditionnelle; son sens géographique est donné en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre, tout en évitant la forme moins probable « Jéhovah ».
translation_notes:
  register: Français international moderne, sobre et narratif. « Ne voulut pas » restitue la réticence sans introduire la force polémique de « refusa ». La répétition du nom de David est allégée dans la seconde proposition, conformément à l’usage naturel du français, sans perte de référent.
