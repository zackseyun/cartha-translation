id: 2SA.6.9
reference: 2 Samuel 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: fr
  text: 'Ce jour-là, David eut peur de Yahweh et dit : « Comment l’arche de Yahweh pourrait-elle venir jusqu’à moi ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Comment l’arche de Yahweh viendra-t-elle jusqu’à moi ? » La question peut exprimer une incertitude pratique ou la peur et le sentiment d’indignité de David après la mort d’Ouzza.'
    reason: La forme hébraïque au futur laisse ouverte la nuance exacte de la question.
lexical_decisions:
- source_word: וַיִּרָא
  choice: eut peur de
  rationale: Dans ce contexte, après la mort d’Ouzza, le qal de ירא avec Yahweh comme objet direct exprime une peur réelle. « Eut peur de » conserve cette force narrative sans réduire le terme à la seule révérence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle naturelle en français moderne, qui conserve la référence précise au jour de l’événement.
- source_word: אֵיךְ יָבֹא
  choice: Comment … pourrait-elle venir
  rationale: La formulation française exprime la possibilité mise en doute par David dans sa réaction de crainte. Elle reste compatible avec une interrogation pratique comme avec un sentiment d’indignité.
- source_word: אֵלַי
  choice: jusqu’à moi
  rationale: Rend directement la direction vers David sans ajouter « chez moi » ou « dans ma maison », précisions absentes de l’hébreu.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Rend clairement la construction possessive hébraïque tout en conservant le nom divin.
theological_decisions:
- issue: Sens de la question de David
  choice: Ne pas préciser si David exprime surtout une impossibilité pratique, sa peur ou son indignité
  alternative: Interpréter explicitement la question comme un refus ou comme une déclaration d’indignité
  rationale: Le contexte de la mort d’Ouzza donne à la question une forte charge de crainte, mais l’hébreu ne tranche pas entre incertitude pratique et sentiment d’indignité.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin; sa translittération le distingue d’un simple titre.
translation_notes:
  register: Français moderne, naturel et digne. Le passé simple convient au récit biblique sans être archaïque; « eut peur de » communique plus nettement la réaction immédiate que « craignit », qui pourrait être compris comme une simple révérence.
