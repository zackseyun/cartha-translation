base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: fr
  text: David et toute la maison d’Israël faisaient monter l’arche de Yahweh avec des cris d’acclamation[a] et au son du cor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une joyeuse clameur » ; le terme hébreu peut désigner une acclamation collective et jubilante.
    reason: lexical_alternative
  - marker: b
    text: Ou « au son de la trompe » ; le shofar est un instrument fait d’une corne, souvent d’une corne de bélier.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: faisaient monter
  rationale: Le participe hiphil exprime ici une action en cours dans le récit. L’imparfait français en conserve l’aspect progressif et « faire monter » rend le mouvement vers Jérusalem.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette traduction conserve l’image collective et familiale de l’expression hébraïque, tout en restant intelligible en français.
- source_word: אֲרוֹן יְהוָה
  choice: le coffre de Yahweh
  rationale: אֲרוֹן désigne concrètement un coffre. Ce choix demeure proche du sens hébreu, tandis que le nom divin est translittéré « Yahweh ».
- source_word: תְרוּעָה
  choice: cris d’acclamation
  rationale: Le terme peut évoquer une clameur, un cri collectif ou une acclamation joyeuse. Le pluriel français rend naturellement la scène et distingue ces voix humaines du son du cor mentionné ensuite.
- source_word: קוֹל שׁוֹפָר
  choice: au son du cor
  rationale: קוֹל signifie « son » et שׁוֹפָר désigne un instrument en corne, souvent une corne de bélier. « Cor » évite d’évoquer nécessairement une trompette métallique moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve ici le caractère de nom propre sans substituer un titre.
- issue: Désignation de l’objet sacré אֲרוֹן
  choice: coffre
  alternative: arche
  rationale: « Coffre » exprime le sens concret du mot hébreu sans ajouter de précision absente de ce verset. « Arche » est le terme religieux traditionnel, mais son sens est moins transparent en français actuel.
translation_notes:
  register: Français international moderne, fluide et digne. L’imparfait inscrit l’action dans son déroulement. « Au milieu des » rend naturellement l’accompagnement sonore exprimé par la préposition hébraïque, et les notes maintiennent les nuances lexicales sans alourdir le verset.
