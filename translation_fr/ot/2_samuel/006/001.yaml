lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: de nouveau
  rationale: L’expression idiomatique avec יסף et עוד marque ici la répétition de l’action; « de nouveau » est naturel en français narratif.
- source_word: אֶת כָּל
  choice: tous
  rationale: אֶת introduit le complément d’objet défini et כָּל en exprime la totalité; « tous » rend clairement cette portée.
- source_word: בָּחוּר
  choice: hommes d’élite
  rationale: Dans ce contexte de rassemblement d’un groupe nombreux, בָּחוּר peut désigner des hommes sélectionnés ou de choix; « hommes d’élite » exprime ce sens tout en laissant en note l’autre valeur possible, liée à la jeunesse.
- source_word: בְּיִשְׂרָאֵל
  choice: d’Israël
  rationale: Malgré la préposition ב, la construction désigne naturellement en français les hommes appartenant au peuple d’Israël ou choisis parmi lui.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: au nombre de trente mille
  rationale: Le nombre est rendu directement; « au nombre de » rattache clairement les trente mille aux hommes rassemblés.
