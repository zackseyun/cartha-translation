  text: David rassembla de nouveau tous les hommes choisis d’Israël[a], soit trente mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jeunes hommes » ou « les hommes d’élite ». Le terme hébreu peut évoquer la jeunesse ou le fait d’être choisi ; dans ce contexte de rassemblement, il peut désigner des hommes sélectionnés.
