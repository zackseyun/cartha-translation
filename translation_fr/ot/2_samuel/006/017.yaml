  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: fr
  text: Ils introduisirent l’arche de Yahweh et la placèrent à sa place, à l’intérieur de la tente que David avait dressée pour elle. Puis David offrit devant Yahweh des holocaustes et des sacrifices de paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être » pour l’hébreu שְׁלָמִים.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: אֲרוֹן désigne ici l’arche sacrée; le nom divin יְהוָה est translittéré « Yahweh » afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: וַיָּבִאוּ
  choice: On introduisit
  rationale: Le hifil de בוא exprime le fait de faire entrer l’arche dans le lieu préparé. Le sujet pluriel non précisé se rend naturellement en français par « on ».
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: et on la déposa à sa place
  rationale: יצג indique une mise en position délibérée. « Déposa » convient à l’arche sans suggérer qu’elle aurait été abandonnée.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: au milieu de la tente
  rationale: בְּתוֹךְ peut signifier « au milieu de » ou « à l’intérieur de ». La formulation retenue garde l’image spatiale de l’hébreu tout en restant naturelle.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: que David avait dressée pour elle
  rationale: נטה, appliqué à une tente, signifie la tendre ou la dresser. Le plus-que-parfait marque l’antériorité, et « pour elle » explicite le référent de לוֹ, l’arche.
- source_word: וַיַּעַל דָּוִד עֹלוֹת
  choice: David offrit des holocaustes
  rationale: Dans un contexte sacrificiel, עלה signifie offrir; עֹלוֹת désigne les sacrifices entièrement consumés, traditionnellement appelés « holocaustes » en français biblique.
- source_word: וּשְׁלָמִים
  choice: et des sacrifices de paix[a]
  rationale: שְׁלָמִים est un terme sacrificiel lié à la paix, au bien-être et à la communion. « Sacrifices de paix » reste reconnaissable, tandis qu’une note signale l’étendue sémantique.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie littéralement « devant » ou « en présence de »; « devant Yahweh » est concis et fidèle au cadre cultuel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; l’Éternel
  rationale: Le texte porte le tétragramme comme nom propre. La translittération « Yahweh » le distingue d’un titre et préserve sa fonction dans le texte source.
- issue: Sens sacrificiel de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion; sacrifices de bien-être
  rationale: Le terme peut évoquer à la fois paix, intégrité, bien-être et repas de communion. Le texte principal emploie une désignation traditionnelle sans réduire silencieusement cette richesse; la note conserve les autres possibilités.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au récit historique; « holocaustes » est conservé comme terme cultuel établi. Le sujet pluriel hébreu, non identifié dans ce verset, est rendu par le pronom indéfini « on » plutôt que par un « ils » sans antécédent immédiat.
