  naturalness: Le français est clair et d’un registre biblique moderne. « À l’intérieur de la tente » est plus idiomatique et plus précis ici; « placèrent » rend simplement l’action de mettre l’arche à l’endroit prévu.
  terminology: « Arche de Yahweh », « holocaustes » et « sacrifices de paix » sont des rendus établis et appropriés. La note fournit utilement les principales alternatives pour שְׁלָמִים.
