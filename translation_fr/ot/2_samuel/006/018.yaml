id: 2SA.6.18
reference: 2 Samuel 6:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: fr
  text: Quand David eut fini d’offrir l’holocauste et les sacrifices de communion, il bénit le peuple au nom de Yahweh des armées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahweh des armées ». Le terme hébreu peut aussi évoquer les troupes ou puissances célestes.'
    reason: Le titre divin possède une portée plus large que les seules armées humaines.
lexical_decisions:
- source_word: וַיְכַל
  choice: eut fini
  rationale: Le verbe marque l’achèvement de l’action précédente; le passé antérieur exprime naturellement en français cette antériorité dans le récit.
- source_word: מֵהַעֲלוֹת
  choice: d’offrir
  rationale: Dans ce contexte sacrificiel, l’infinitif causatif de עלה désigne l’action de faire monter l’offrande, donc de l’offrir.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: עֹלָה est le terme sacrificiel courant pour une offrande entièrement consumée; « holocauste » est ici le terme français biblique précis et concis.
- source_word: וְהַשְּׁלָמִים
  choice: et les sacrifices de communion
  rationale: שְׁלָמִים désigne des sacrifices associés à la paix, au bien-être et à la communion. « Sacrifices de communion » rend clairement leur caractère partagé sans réduire le terme à une seule nuance.
- source_word: וַיְבָרֶךְ
  choice: il bénit
  rationale: Le verbe ברך signifie directement « bénir » dans cette construction.
- source_word: אֶת־הָעָם
  choice: le peuple
  rationale: עָם désigne ici l’ensemble du peuple rassemblé.
- source_word: בְּשֵׁם
  choice: au nom de
  rationale: Cette tournure française exprime naturellement l’autorité ou le nom invoqué dans la bénédiction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: צְבָאוֹת signifie littéralement « armées » ou « troupes » et, dans le titre divin, peut englober les puissances célestes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre tout en évitant de le remplacer silencieusement par un titre.
- issue: Portée du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh des puissances
  rationale: « Des armées » suit le sens lexical direct, tandis que la note signale que le pluriel peut viser plus largement les troupes ou puissances, notamment célestes.
- issue: Sens de שְׁלָמִים
  choice: sacrifices de communion
  alternative: sacrifices de paix
  rationale: Le terme réunit des nuances de paix, de bien-être et de communion sacrificielle. Le choix retient la dimension relationnelle sans nier les autres nuances possibles.
translation_notes:
  register: Français international moderne, naturel et digne. La structure temporelle conserve l’achèvement des sacrifices avant la bénédiction; la terminologie cultuelle reste précise sans alourdir la phrase.
