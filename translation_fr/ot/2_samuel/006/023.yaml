  text: וּ/לְ/מִיכַל֙ בַּת שָׁא֔וּל לֹֽא הָ֥יָה לָ֖/הּ יָ֑לֶד עַ֖ד י֥וֹם מוֹתָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: fr
  text: Quant à Mikal, fille de Saül, elle n’eut pas d’enfant jusqu’au jour de sa mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendance » ; le nom hébreu peut désigner un enfant de manière générale, pas nécessairement un fils.
    reason: Alternative lexicale
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: Quant à Mikal
  rationale: La combinaison de la conjonction et de la préposition introduit Mikal comme thème de la phrase. « Quant à Mikal » rend naturellement cet idiome en français et marque le lien narratif.
- source_word: בַּת שָׁאוּל
  choice: fille de Saül
  rationale: Le groupe construit identifie simplement Mikal par sa filiation. Cette formulation est naturelle et proche de la structure hébraïque.
- source_word: לֹא הָיָה לָהּ
  choice: elle n’eut pas
  rationale: L’hébreu exprime la possession par « il n’y eut pas pour elle ». Le français emploie naturellement le verbe « avoir » ; le passé simple convient au registre narratif digne.
- source_word: יָלֶד
  choice: d’enfant
  rationale: Le nom singulier peut désigner un enfant sans préciser son sexe. « Enfant » évite de restreindre indûment le sens à un fils.
- source_word: עַד יוֹם מוֹתָהּ
  choice: jusqu’au jour de sa mort
  rationale: Cette traduction conserve de près l’expression temporelle hébraïque tout en restant claire et idiomatique en français.
theological_decisions:
- issue: Portée de « jusqu’au jour de sa mort »
  choice: Conserver directement la formule temporelle, qui affirme que Mikal resta sans enfant toute sa vie.
  alternative: Reformuler explicitement par « elle resta sans enfant toute sa vie ».
  rationale: La formulation retenue préserve l’expression hébraïque sans suggérer une naissance après la mort ni lui attribuer une portée théologique que le texte n’énonce pas.
translation_notes:
  register: Français moderne, clair et digne. « Mikal » suit une translittération française courante du nom hébreu. Le passé simple maintient le registre narratif biblique sans archaïsme lexical.
