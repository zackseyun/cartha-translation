source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֧י צָעֲד֛וּ נֹשְׂאֵ֥י אֲרוֹן יְהוָ֖ה שִׁשָּׁ֣ה צְעָדִ֑ים וַ/יִּזְבַּ֥ח שׁ֖וֹר וּ/מְרִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: fr
  text: Quand les porteurs de l’arche de Yahweh eurent fait six pas, il sacrifia un bœuf et une bête engraissée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « un veau engraissé »; l’hébreu dit plus généralement « une bête engraissée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: « Arche » est le terme cultuel établi, et le nom divin est rendu directement par « Yahweh ».
- source_word: וַיְהִי כִּי
  choice: Quand
  rationale: La construction introduit ici la circonstance temporelle du récit; « quand » est naturel et fidèle.
- source_word: צָעֲדוּ נֹשְׂאֵי
  choice: les porteurs … eurent fait
  rationale: Le participe désigne ceux qui transportent l’arche, tandis que le verbe exprime leur progression par pas. Le passé antérieur marque naturellement l’action accomplie avant le sacrifice.
- source_word: שִׁשָּׁה צְעָדִים
  choice: six pas
  rationale: « Six pas » rend directement la mesure du déplacement sans précision supplémentaire.
- source_word: וַיִּזְבַּח
  choice: il sacrifia
  rationale: Le verbe singulier renvoie le plus naturellement à David dans le contexte immédiat.
- source_word: שׁוֹר
  choice: un bœuf
  rationale: Le mot désigne un bovin; « bœuf » est une traduction traditionnelle et naturelle dans ce contexte sacrificiel.
- source_word: מְרִיא
  choice: une bête engraissée
  rationale: Le terme désigne un animal engraissé sans préciser explicitement son espèce; cette traduction conserve cette généralité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: La forme « Yahweh » représente directement le nom propre divin et évite de le remplacer par un titre.
- issue: Sujet implicite de וַיִּזְבַּח
  choice: il, renvoyant naturellement à David
  alternative: on sacrifia
  rationale: Le verbe hébreu est au masculin singulier et le contexte fait de David le référent le plus naturel, sans que son nom soit répété dans ce verset.
translation_notes:
  register: Français international moderne, digne et fluide. « Porteurs » convient au contexte cérémoniel; « eurent fait six pas » conserve la succession narrative. La note maintient la distinction entre le sens général de l’hébreu et son interprétation traditionnelle plus précise.
