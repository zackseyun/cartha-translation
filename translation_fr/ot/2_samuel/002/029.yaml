  text: וְ/אַבְנֵ֣ר וַֽ/אֲנָשָׁ֗י/ו הָֽלְכוּ֙ בָּֽ/עֲרָבָ֔ה כֹּ֖ל הַ/לַּ֣יְלָה הַ/ה֑וּא וַ/יַּעַבְר֣וּ אֶת הַ/יַּרְדֵּ֗ן וַ/יֵּֽלְכוּ֙ כָּל הַ/בִּתְר֔וֹן וַ/יָּבֹ֖אוּ מַחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: fr
  text: Abner et ses hommes marchèrent dans l’Araba pendant toute cette nuit-là, traversèrent le Jourdain, parcoururent tout le Bitron[a] et arrivèrent à Mahanaïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « parcoururent toute la région des ravins » ou « toute la région des gorges » ; le terme hébreu Bitron peut être un nom de lieu ou une désignation géographique descriptive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: dans l’Araba
  rationale: Le nom peut désigner la dépression géographique de l’Araba, et non simplement une plaine. Dans cet itinéraire, la valeur géographique est vraisemblable ; la translittération évite de réduire le terme à un relief générique.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: pendant toute cette nuit-là
  rationale: Cette formulation française exprime naturellement la durée couvrant la nuit entière tout en conservant la valeur démonstrative de l’hébreu.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: traversèrent le Jourdain
  rationale: Avec le Jourdain comme objet direct, le verbe עבר désigne clairement le franchissement du fleuve.
- source_word: כָּל הַבִּתְרוֹן
  choice: parcoururent tout le Bitron
  rationale: הַבִּתְרוֹן peut être un nom de lieu ou de région, mais son sens précis reste incertain. Conserver « Bitron » dans le texte principal évite d’imposer une identification géographique conjecturale ; une note présente l’autre possibilité.
- source_word: מַחֲנָיִם
  choice: Mahanaïm
  rationale: Il s’agit d’un nom de lieu, rendu par une translittération française usuelle.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: marchèrent… parcoururent… arrivèrent
  rationale: 'La succession conserve la progression du récit : déplacement prolongé, traversée d’une région, puis arrivée à destination, dans un français naturel.'
- source_word: וַאֲנָשָׁיו
  choice: ses hommes
  rationale: L’expression signifie littéralement « ses hommes ». Dans ce contexte militaire, elle désigne la troupe d’Abner sans expliciter davantage que l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms géographiques sont translittérés lorsque leur valeur toponymique est probable. La note est placée après « Bitron », le terme auquel elle se rapporte.
