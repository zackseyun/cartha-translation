  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֗וּל בְּ/מָלְכ/וֹ֙ עַל יִשְׂרָאֵ֔ל וּ/שְׁתַּ֥יִם שָׁנִ֖ים מָלָ֑ךְ אַ֚ךְ בֵּ֣ית יְהוּדָ֔ה הָי֖וּ אַחֲרֵ֥י דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: fr
  text: Ish-Bosheth[a], fils de Saül, avait quarante ans lorsqu’il commença à régner sur Israël, et il régna deux ans. Mais la maison de Juda[b] suivit David[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte massorétique donne ici le nom Ish-Bosheth; comparer la forme Eshbaal dans des traditions apparentées.
    reason: alternative_reading
  - marker: b
    text: Littéralement « la maison de Juda », expression collective désignant la tribu ou le royaume de Juda.
    reason: lexical_alternative
  - marker: c
    text: Ou « resta fidèle à David » ou « prit le parti de David ». L’hébreu dit littéralement « étaient derrière David », expression marquant l’allégeance.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: avait quarante ans
  rationale: Il s’agit de la tournure hébraïque habituelle pour indiquer l’âge; cette formulation en donne naturellement le sens en français.
- source_word: אִישׁ בֹּשֶׁת
  choice: Ish-Bosheth
  rationale: Le texte massorétique porte ici ce nom. La translittération française le conserve, tandis qu’une note signale la forme apparentée Eshbaal attestée dans d’autres traditions.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il commença à régner
  rationale: La construction indique le moment où l’âge du roi est donné. Cette formulation française correspond au style des notices royales.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Dans ce contexte royal, עַל exprime l’autorité exercée sur un peuple.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: et il régna deux ans
  rationale: Cette traduction directe conserve la structure et la sobriété de la formule hébraïque sur la durée du règne.
- source_word: אַךְ
  choice: Mais
  rationale: La particule marque ici le contraste entre le règne d’Ish-Bosheth sur Israël et l’allégeance de Juda à David.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: La traduction conserve l’expression collective hébraïque, qui désigne la tribu ou l’entité politique de Juda.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: suivit David
  rationale: Littéralement « fut derrière David », l’expression idiomatique indique le soutien ou l’allégeance. « Suivit David » préserve l’image tout en restant intelligible.
