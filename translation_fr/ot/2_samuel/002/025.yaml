source:
  edition: WLC
  text: וַ/יִּֽתְקַבְּצ֤וּ בְנֵֽי בִנְיָמִן֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּהְי֖וּ לַ/אֲגֻדָּ֣ה אֶחָ֑ת וַ/יַּ֣עַמְד֔וּ עַ֥ל רֹאשׁ גִּבְעָ֖ה אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: fr
  text: Alors les fils de Benjamin se rassemblèrent derrière Abner[a], formèrent un seul groupe[b] et prirent position au sommet d’une colline.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la suite d’Abner ». L’expression hébraïque peut indiquer aussi bien une position dans l’espace (« derrière ») que le fait de suivre quelqu’un ou de se rallier à lui.
    reason: lexical_alternative
  - marker: b
    text: Ou « une seule troupe » ou « une seule formation ». Le terme hébreu désigne un ensemble uni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: se rassemblèrent
  rationale: Le hitpael de קבץ exprime ici un rassemblement collectif. « Se rassemblèrent » est naturel en français et convient au regroupement militaire décrit.
- source_word: בְנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: Cette formulation conserve l’expression de parenté hébraïque tout en restant claire dans un registre biblique moderne.
- source_word: אַחֲרֵי אַבְנֵר
  choice: derrière Abner
  rationale: אַחֲרֵי peut désigner une position spatiale ou le fait de suivre un chef. « Derrière Abner » préserve l’image spatiale sans exclure l’idée de ralliement.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: un seul groupe
  rationale: אֲגֻדָּה désigne un ensemble uni ou une troupe. « Un seul groupe » rend clairement l’unité produite par leur rassemblement.
- source_word: וַיַּעַמְדוּ
  choice: prirent position
  rationale: Dans ce contexte de combat, עמד indique qu’ils s’établissent à un endroit pour faire face, plutôt qu’une simple posture debout.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: au sommet d’une colline
  rationale: Dans cet emploi topographique, רֹאשׁ signifie « sommet ». L’article indéfini rend naturellement אֶחָת, qui individualise ici une colline sans imposer l’expression peu idiomatique « une seule colline ».
