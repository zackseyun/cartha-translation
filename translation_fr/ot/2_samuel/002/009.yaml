base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: fr
  text: Il l’établit roi sur Galaad, sur les Ashourites[a], sur Jizréel, sur Éphraïm, sur Benjamin et sur tout Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte une forme difficile, littéralement « l’Ashourite »; certains y voient « Aser », désignant la tribu ou le territoire d’Aser.
    reason: Lecture ou interprétation alternative d’une forme hébraïque difficile.
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: Il l’établit roi
  rationale: Le hiphil de מלך avec suffixe masculin singulier exprime l’action de faire de quelqu’un un roi ou de l’installer comme roi. « L’établit roi » est naturel en français et conserve cette valeur causative.
- source_word: אֶל / עַל
  choice: sur
  rationale: Avec l’établissement d’un roi et les territoires ou populations énumérés, « sur » exprime naturellement l’étendue de son autorité, malgré l’alternance des prépositions hébraïques.
- source_word: הַגִּלְעָד
  choice: Galaad
  rationale: Forme française traditionnelle et largement reconnue du nom de cette région.
- source_word: הָאֲשׁוּרִי
  choice: les Ashourites
  rationale: Le texte massorétique porte une forme gentilice singulière avec article, susceptible d’un sens collectif. La traduction conserve cette lecture difficile dans le texte et signale en note l’interprétation « Asher ».
- source_word: יִזְרְעֶאל
  choice: Jizréel
  rationale: Forme française courante du nom de lieu.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Forme française courante du nom tribal.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Forme française établie du nom tribal.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: tout Israël
  rationale: Cette formulation concise et idiomatique rend la totalité explicitement marquée par כֻּלֹּה.
