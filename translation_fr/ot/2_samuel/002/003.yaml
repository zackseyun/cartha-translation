  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: fr
  text: David fit aussi monter les hommes qui étaient avec lui, chacun avec sa maisonnée, et ils s’installèrent dans les localités d’Hébron[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les villes d’Hébron ». L’hébreu peut désigner les localités rattachées au territoire d’Hébron plutôt que le seul centre urbain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: les hommes qui étaient avec lui
  rationale: Le possessif de אֲנָשָׁיו est déjà explicité naturellement par la relative אֲשֶׁר עִמּוֹ. « Les hommes » conserve le référent masculin et désigne les compagnons de David sans lourdeur.
- source_word: הֶעֱלָה
  choice: fit aussi monter
  rationale: Le hiphil de עלה exprime ici le fait de faire monter ou d’emmener vers les hauteurs. « Fit monter » préserve cette nuance géographique, et « aussi » rend la coordination avec l’action précédente.
- source_word: אִישׁ וּבֵיתוֹ
  choice: chacun avec les siens
  rationale: אִישׁ a une valeur distributive, tandis que בֵּיתוֹ désigne la maisonnée. L’expression française naturelle « chacun avec les siens » inclut les membres du foyer sans suggérer le bâtiment.
- source_word: וַיֵּשְׁבוּ
  choice: ils s’installèrent
  rationale: Dans ce contexte de déplacement, ישב indique l’établissement dans un lieu plutôt que la simple position assise ou un séjour passager.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: dans les localités de la région d’Hébron
  rationale: Le pluriel עָרֵי peut désigner les villes ou agglomérations rattachées à Hébron. « Localités de la région d’Hébron » exprime clairement l’appartenance territoriale probable sans faire croire à plusieurs villes portant le même nom.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Forme française traditionnelle et courante du nom propre biblique.
theological_decisions: []
