  text: וַ/יֹּ֧סֶף ע֣וֹד אַבְנֵ֗ר לֵ/אמֹר֙ אֶל עֲשָׂהאֵ֔ל ס֥וּר לְ/ךָ֖ מֵ/אַֽחֲרָ֑/י לָ֤/מָּה אַכֶּ֨/כָּה֙ אַ֔רְצָ/ה וְ/אֵיךְ֙ אֶשָּׂ֣א פָנַ֔/י אֶל יוֹאָ֖ב אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: fr
  text: 'Abner dit encore à Asaël : « Détourne-toi, cesse de me poursuivre. Pourquoi devrais-je te frapper et t’étendre à terre ? Et comment pourrais-je ensuite regarder ton frère Joab en face[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comment pourrais-je lever mon visage vers Joab, ton frère ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... לֵאמֹר
  choice: dit encore
  rationale: Cette tournure indique qu’Abner prend de nouveau la parole. « Dit encore » restitue naturellement sa valeur itérative.
- source_word: סוּר לְךָ מֵאַחֲרַי
  choice: Détourne-toi, cesse de me poursuivre
  rationale: סוּר exprime l’action de se détourner, tandis que מֵאַחֲרַי signifie littéralement « de derrière moi » et, dans ce contexte, « de me poursuivre ». La formulation française conserve à la fois le mouvement et le sens contextuel.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: Pourquoi devrais-je te frapper et t’étendre à terre ?
  rationale: Le verbe נכה signifie ici « frapper », et אַרְצָה précise le résultat ou la direction, « à terre ». Cette traduction garde l’image concrète sans expliciter la mort, qui est fortement suggérée mais non directement énoncée.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: Et comment pourrais-je ensuite regarder ... en face ?
  rationale: L’expression signifie littéralement « lever mon visage » et évoque la possibilité d’affronter quelqu’un sans honte. L’idiome français « regarder en face » en communique naturellement le sens, tandis que la note conserve l’image hébraïque.
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: ton frère Joab
  rationale: La relation fraternelle avec Asaël est rendue explicitement, en suivant l’ordre naturel du français.
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  choice: Asaël / Abner / Joab
  rationale: Les noms propres suivent leurs formes françaises bibliques usuelles.
theological_decisions: []
