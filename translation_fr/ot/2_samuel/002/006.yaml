revisions:
- from: Et maintenant, que Yahweh agisse envers vous avec amour fidèle et fidélité[a] ! Moi aussi, je vous ferai ce bien[c], puisque vous avez fait cela[b].
  to: Et maintenant, que Yahweh vous témoigne de son amour fidèle et de sa fidélité[a] ! Moi aussi, je vous accorderai cette faveur[c], puisque vous avez fait cela[b].
  rationale: La révision remplace deux tournures calquées par des équivalents français naturels. Elle maintient l’optatif, le parallélisme entre Yahweh et David, la causalité finale, le nom Yahweh et la distinction lexicale entre l’amour fidèle de Yahweh et la faveur que David promet. Les ancres de notes restent attachées aux éléments auxquels elles se rapportent.
