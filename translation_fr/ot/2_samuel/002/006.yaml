source:
  edition: WLC
  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: fr
  text: Et maintenant, que Yahweh vous témoigne de son amour fidèle et de sa fidélité[a] ! Moi aussi, je vous accorderai cette faveur[c], puisque vous avez fait cela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh vous témoignera son amour fidèle et sa fidélité. » Le verbe hébreu peut exprimer soit un souhait de bénédiction, soit une affirmation au futur.'
    reason: alternative_reading
  - marker: b
    text: '« Cela » désigne l’acte mentionné au verset précédent : ils ont enterré Saül.'
    reason: cross_reference
  - marker: c
    text: 'Ou : « je vous ferai ce bien ». L’hébreu dit littéralement « ce bien » ; « cette bonté » est aussi possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Cette formulation garde à la fois la continuité avec le verset précédent et la transition vers la bénédiction de David.
- source_word: יַעַשׂ ... עִמָּכֶם
  choice: que ... agisse envers vous
  rationale: L’imparfait préfixé se comprend naturellement ici comme un souhait de bénédiction. « Agir envers vous » conserve le verbe général עשה et la relation exprimée par עִם.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Cette expression rend la bonté loyale et durable évoquée par חֶסֶד sans imposer explicitement une interprétation technique de type alliance.
- source_word: אֱמֶת
  choice: fidélité
  rationale: Dans l’association חֶסֶד וֶאֱמֶת, le mot désigne surtout la fiabilité et la constance relationnelles, plutôt que la vérité abstraite.
- source_word: וְגַם אָנֹכִי
  choice: Moi aussi
  rationale: Le pronom exprimé et la particule additive soulignent la réponse personnelle et correspondante de David.
- source_word: אֶעֱשֶׂה אִתְּכֶם הַטּוֹבָה הַזֹּאת
  choice: je vous ferai ce bien
  rationale: La formulation conserve la répétition du verbe עשה et le sens littéral de הַטּוֹבָה, « le bien », tout en exprimant naturellement le bénéficiaire en français.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: puisque vous avez fait cela
  rationale: La proposition donne le motif de la faveur promise par David et renvoie à l’acte relaté au verset précédent.
theological_decisions:
- issue: Valeur de l’imparfait יַעַשׂ
  choice: 'Un souhait ou une bénédiction : « que Yahweh agisse… »'
  alternative: 'Une affirmation au futur : « Yahweh agira… »'
  rationale: Dans ce contexte, David bénit les hommes de Yabesh-Galaad pour leur loyauté envers Saül. La valeur jussive convient bien, mais la note préserve la possibilité grammaticale d’une déclaration future.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme entre l’action souhaitée de Yahweh et la réponse promise par David. « Amour fidèle et fidélité » maintient la distinction entre חֶסֶד et אֱמֶת, tandis que les notes signalent l’ambiguïté verbale et les principales possibilités lexicales.
