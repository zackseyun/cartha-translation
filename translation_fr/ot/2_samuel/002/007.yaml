  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: fr
  text: Et maintenant, que vos mains soient fortes[a] et soyez des hommes vaillants, car votre seigneur Saül est mort, et la maison de Juda m’a aussi oint pour être leur roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que vos mains soient fortes ». L’expression appelle ici au courage et à la fermeté.'
    reason: La note conserve l’image corporelle du texte hébreu tout en en indiquant la valeur idiomatique.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Le texte hébreu contient explicitement עַתָּה, « maintenant », précédé de la conjonction וְ. La traduction conserve donc cette transition discursive et temporelle.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: que vos mains soient fortes
  rationale: Cette formulation conserve l’image concrète de l’expression hébraïque tout en restant intelligible en français. Dans le contexte, elle appelle à la fermeté et au courage.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: et soyez des hommes vaillants
  rationale: היה a ici une valeur exhortative. בְּנֵי חַיִל désigne des hommes courageux, capables et valeureux, souvent dans un contexte militaire.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: car votre seigneur Saül est mort
  rationale: « Car » rend la valeur explicative de כִּי. « Seigneur » exprime ici le rang et l’autorité politique de Saül, sans référence à la divinité.
- source_word: וְגַם אֹתִי
  choice: De plus, … m’
  rationale: La tournure française marque l’ajout d’un second fait destiné à encourager les destinataires. Le pronom objet אֹתִי est rendu par « m’ » devant le verbe.
- source_word: מָשְׁחוּ
  choice: a consacré par l’onction
  rationale: Le verbe משׁח désigne l’acte d’oindre pour établir officiellement quelqu’un dans une fonction. La formulation explicite le sens institutionnel de l’onction sans le réduire à une simple nomination.
- source_word: בֵית יְהוּדָה
  choice: la maison de Juda
  rationale: La traduction garde la désignation collective littérale de la tribu ou du groupe familial de Juda, familière au registre biblique français.
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: pour régner sur elle
  rationale: La formulation rend la fonction royale et la relation d’autorité exprimées par l’hébreu. Le singulier collectif « elle » reprend naturellement « la maison de Juda » en français, là où l’hébreu emploie un pronom pluriel selon le sens collectif.
theological_decisions:
- issue: Expression masculine לִבְנֵי חַיִל
  choice: des hommes vaillants
  alternative: des gens courageux ; soyez courageux
  rationale: Le masculin est explicite dans l’expression hébraïque et convient au contexte où David s’adresse aux hommes de Yabesh-Galaad. La traduction ne neutralise donc pas cette donnée du texte.
- issue: Titre humain אֲדֹנֵיכֶם
  choice: votre seigneur
  alternative: votre maître ; votre souverain
  rationale: Le mot qualifie ici Saül comme détenteur d’une autorité humaine et politique. La minuscule et le contexte empêchent de le confondre avec un titre divin.
- issue: Portée de וְגַם
  choice: De plus
  alternative: la maison de Juda aussi
  rationale: L’adverbe introduit vraisemblablement un fait supplémentaire après l’annonce de la mort de Saül. « De plus » préserve cette relation sans imposer que « aussi » porte exclusivement sur la maison de Juda.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure exhortative et l’image hébraïque des « mains fortes » sont conservées; une note en précise le sens. La phrase est divisée en deux pour éviter une coordination trop lourde et rendre clairement les deux motifs avancés par David.
