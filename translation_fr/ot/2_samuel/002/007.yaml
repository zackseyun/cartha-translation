  source_fidelity: 'Révision nécessaire : le texte hébreu contient explicitement וְעַתָּה (« Et maintenant »), que le projet rend correctement. En revanche, « consacré par l’onction pour régner sur elle » explicite et reformule davantage que nécessaire מָשְׁחוּ ... לְמֶלֶךְ עֲלֵיהֶם. Une formulation directe doit conserver l’onction et la fonction royale, ainsi que la référence sémantiquement plurielle aux membres de Juda.'
