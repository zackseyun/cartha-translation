source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: fr
  text: Mais Abner, fils de Ner et chef de l’armée de Saül, prit Ish-Bosheth[a], fils de Saül, et le fit passer à Mahanaïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ish-Bosheth est appelé Eshbaal en 1 Chroniques 8.33 et 9.39.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: Mais Abner
  rationale: La conjonction וְ peut signifier « et », mais « mais » rend ici le contraste narratif avec le verset précédent, où la maison de Juda établit David comme roi.
- source_word: בֶּן נֵר
  choice: fils de Ner
  rationale: Rendu direct et naturel de la construction filiale hébraïque.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: chef de l’armée de Saül
  rationale: שַׂר צָבָא désigne le responsable militaire suprême; cette formulation française claire conserve le lien explicite avec Saül.
- source_word: לָקַח
  choice: prit
  rationale: Le sens courant est « prendre ». Le contexte immédiat ne justifie pas un verbe plus contraignant comme « saisir ».
- source_word: אֶת אִישׁ בֹּשֶׁת
  choice: Ish-Bosheth
  rationale: Le nom du texte massorétique est translittéré plutôt que traduit. La forme parallèle Eshbaal est signalée en note.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: l’emmena
  rationale: Le hiphil de עבר exprime le fait de faire passer ou de conduire quelqu’un de l’autre côté. « L’emmena » est idiomatique en français et convient au déplacement vers Mahanaïm sans préciser un itinéraire que le verset ne donne pas.
- source_word: מַחֲנָיִם
  choice: Mahanaïm
  rationale: Le nom de lieu est translittéré selon un usage français courant, avec le tréma qui indique que les voyelles se prononcent séparément.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en évitant les tournures inutilement archaïques; les noms propres sont translittérés de façon cohérente.
