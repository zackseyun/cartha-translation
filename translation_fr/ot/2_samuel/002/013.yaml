base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: fr
  text: Joab, fils de Tserouya, et les serviteurs de David sortirent et se rencontrèrent près du bassin[a] de Gabaon. Les uns s’assirent d’un côté du bassin, et les autres de l’autre côté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réservoir de Gabaon » ; le mot hébreu peut désigner un bassin aménagé ou un réservoir d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Joab
  rationale: Le waw poursuit simplement le récit; en français, l’enchaînement est naturel sans « Et » initial.
- source_word: בֶּן צְרוּיָה
  choice: fils de Tserouya
  rationale: Rend directement la désignation familiale. La forme « Tserouya » représente naturellement le nom hébreu en français.
- source_word: וְ/עַבְדֵי דָוִד
  choice: et les serviteurs de David
  rationale: Conserve le terme עבד sans le préciser excessivement comme « soldats », même si le contexte est militaire.
- source_word: יָצְאוּ
  choice: sortirent
  rationale: Rend simplement le verbe courant יצא, sans ajouter l’idée plus précise de marcher au combat.
- source_word: וַֽ/יִּפְגְּשׁוּ/ם
  choice: et les rencontrèrent
  rationale: Le suffixe objet renvoie à Abner et aux hommes d’Ish-Bosheth mentionnés au verset précédent.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: près du bassin de Gabaon
  rationale: בְּרֵכָה désigne un bassin ou réservoir; « près de » convient à la disposition des deux groupes sur ses côtés.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: Préserve l’adverbe, qui indique que les deux groupes se trouvent réunis au même lieu.
- source_word: וַ/יֵּשְׁבוּ
  choice: s’assirent
  rationale: Rend le sens concret de ישב dans cette scène, sans surinterpréter leur positionnement tactique.
- source_word: אֵלֶּה ... וְ/אֵלֶּה
  choice: les uns ... et les autres
  rationale: Expression française naturelle qui maintient le contraste démonstratif entre les deux groupes.
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: d’un côté du bassin ... de l’autre côté
  rationale: Rend clairement l’idiome spatial hébreu qui place les groupes sur les côtés opposés du même bassin.
