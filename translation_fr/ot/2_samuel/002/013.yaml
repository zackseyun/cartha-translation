  to: Joab, fils de Tserouya, et les serviteurs de David sortirent et se rencontrèrent près du bassin[a] de Gabaon. Les uns s’assirent d’un côté du bassin, et les autres de l’autre côté.
  rationale: La révision remplace une expression française ambiguë par « se rencontrèrent », qui rend la rencontre des deux partis et intègre naturellement la valeur contextuelle de « ensemble ». Elle déplace aussi l’ancre de la note au premier emploi du terme expliqué, sans modifier le sens du passage.
