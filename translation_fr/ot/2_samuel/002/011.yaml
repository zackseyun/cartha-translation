  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
translation:
  language: fr
  text: David régna à Hébron sur la maison de Juda pendant sept ans et six mois[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le nombre des jours pendant lesquels David fut roi à Hébron sur la maison de Juda fut de sept ans et six mois. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: pendant
  rationale: L’expression hébraïque, littéralement « le nombre des jours fut », indique ici la durée du règne. La tournure française avec « pendant » transmet naturellement cette valeur, tandis que la note conserve la forme littérale.
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: David régna
  rationale: La construction signifie que David fut roi durant la période indiquée. Le verbe « régner » est idiomatique en français et exprime clairement la fonction royale sans ajouter d’information.
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: Pour une ville, le français emploie naturellement « à » afin d’indiquer le lieu où David exerça son règne.
- source_word: עַל בֵּית יְהוּדָה
  choice: sur la maison de Juda
  rationale: Cette traduction maintient « maison », qui désigne ici la collectivité rattachée à Juda, et conserve la relation d’autorité exprimée par עַל.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: sept ans et six mois
  rationale: Rendu direct et naturel de la durée donnée par l’hébreu.
