- from: 'Alors Joab sonna de la corne[a]. Tout le peuple s’arrêta : ils ne poursuivirent plus Israël et ne continuèrent plus à combattre.'
  to: Alors Joab souffla dans la corne[a]. Tous s’arrêtèrent ; ils ne poursuivirent plus Israël et ne combattirent plus.
  rationale: La révision améliore l’idiomaticité française sans modifier le sens. Elle conserve « Israël » comme dans l’hébreu, maintient l’arrêt de tous les hommes de Joab et exprime les deux négations finales sans trancher indûment entre l’idée de continuer ou de reprendre le combat.
