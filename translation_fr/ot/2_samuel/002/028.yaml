  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: fr
  text: Alors Joab souffla dans la corne[a]. Tous s’arrêtèrent ; ils ne poursuivirent plus Israël et ne combattirent plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le shofar » ; le shofar est une corne utilisée comme instrument de signalisation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: sonna
  rationale: Avec בַּשּׁוֹפָר, le verbe תקע désigne l’action de souffler dans l’instrument pour donner un signal. « Sonna » est idiomatique en français et met en avant la fonction de signal.
- source_word: בַּשּׁוֹפָר
  choice: de la corne
  rationale: שׁוֹפָר désigne une corne employée comme instrument de signalisation. « Corne » conserve la nature de l’objet sans préciser qu’il s’agit nécessairement d’une corne de bélier.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: Tout le peuple s’arrêta
  rationale: עמד signifie littéralement « se tenir debout », mais exprime ici l’arrêt d’une troupe en mouvement. Le singulier français s’accorde naturellement avec le collectif « tout le peuple ».
- source_word: הָעָם
  choice: le peuple
  rationale: L’hébreu porte « le peuple ». Dans le contexte, il s’agit des hommes placés sous les ordres de Joab, mais le terme général est conservé.
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: ne poursuivirent plus Israël
  rationale: רדף אחרי signifie « poursuivre », et la négation avec עוֹד donne le sens de « ne plus ». La formulation est directe et fidèle.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé tel quel, malgré son emploi contextuel pour désigner la force israélite conduite par Abner.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: et ne continuèrent plus à combattre
  rationale: יסף suivi de l’infinitif exprime le fait de continuer ou d’ajouter une action. Avec la négation et עוֹד, la phrase indique que le combat ne se poursuivit pas.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. La formulation conserve « le peuple » et « Israël », conformément à l’hébreu, tout en rendant explicitement l’arrêt suggéré par עמד dans ce contexte militaire.
