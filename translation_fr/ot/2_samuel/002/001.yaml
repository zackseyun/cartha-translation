base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: fr
  text: 'Après cela, David consulta Yahweh[a] : « Dois-je monter dans l’une des villes de Juda ? » Yahweh lui répondit : « Monte. » David demanda : « Où dois-je monter ? » Yahweh répondit : « À Hébron. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette formulation naturelle conserve la transition temporelle du récit sans reproduire lourdement la formule hébraïque « et il arriva après cela ».
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consulta Yahweh
  rationale: Avec la préposition ב et le nom divin, le verbe שׁאל exprime ici la recherche d’une direction divine plutôt qu’une simple question. « Consulter » rend ce sens clairement en français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: לֵאמֹר
  choice: introduit par les deux-points
  rationale: En français, les deux-points introduisent naturellement le contenu direct de la consultation; traduire séparément par « en disant » serait plus lourd.
- source_word: הַאֶעֱלֶה
  choice: Dois-je monter
  rationale: Cette question exprime une demande de direction ou d’autorisation. « Monter » conserve l’orientation géographique et permet de maintenir la répétition du verbe hébreu.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: dans l’une des villes de Juda
  rationale: La préposition et le mouvement évoquent l’entrée dans l’une des villes du territoire de Juda; cette tournure est idiomatique en français.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif reprend exactement le verbe de la question de David; la traduction conserve cette répétition significative.
- source_word: אָנָה
  choice: Où
  rationale: L’adverbe interroge sur la destination. « Où dois-je monter ? » est naturel en français et garde le même verbe.
- source_word: חֶבְרֹנָה
  choice: À Hébron
  rationale: Le hé directionnel attaché au nom de lieu indique un mouvement vers Hébron, rendu naturellement par « à ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel, tandis qu’une note signale le rendu traditionnel sans confondre nom et titre.
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste direct et fluide. La triple reprise de « monter » reflète la répétition de עלה dans l’hébreu, tandis que « consulta » explicite sobrement la recherche d’une direction divine.
