base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: fr
  text: 'Joab dit : « Aussi vrai que Dieu est vivant, si tu n’avais pas parlé, alors, dès le matin, le peuple se serait retiré[a], chacun cessant de poursuivre son frère[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « serait monté ». Dans ce contexte militaire, le verbe peut évoquer le fait de rompre la poursuite et de se retirer.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chacun, de derrière son frère ». L’expression évoque ici le fait de ne plus suivre ou poursuivre son frère.'
    reason: literal_rendering
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: Aussi vrai que Dieu est vivant
  rationale: Formule de serment hébraïque rendue par une expression française naturelle, solennelle et fidèle à l’affirmation de la vie de Dieu.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: si tu n’avais pas parlé
  rationale: La construction exprime une condition irréelle dans le passé. Le complément de « parlé » reste implicite, comme en hébreu.
- source_word: כִּי אָז מֵהַבֹּקֶר
  choice: alors, dès le matin
  rationale: « Alors » marque la conséquence de la condition; « dès le matin » conserve l’idée temporelle portée par מִן avec « matin », sans imposer une paraphrase explicative.
- source_word: נַעֲלָה
  choice: se seraient retirés
  rationale: Le sens premier est « monter », mais, dans ce contexte militaire, le mouvement décrit vraisemblablement la rupture du combat ou de la poursuite. Une note conserve le sens littéral.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: chacun cessant de poursuivre son frère
  rationale: La tournure littérale, « chacun de derrière son frère », indique ici que chaque combattant abandonne la poursuite de son compatriote israélite. « Son frère » préserve la force relationnelle du texte.
