  source_fidelity: La poursuite, le point d’arrivée et les repères géographiques sont rendus avec fidélité. En revanche, le wayyiqtol וְהַשֶּׁמֶשׁ בָּאָה relate le coucher du soleil comme un événement narratif; l’imparfait « se couchait » et « lorsqu’ » le transforment en arrière-plan simultané et imposent une relation temporelle plus étroite que le texte ne l’exprime.
  naturalness: Le français est globalement naturel et de registre narratif approprié. Le passé simple coordonné rend plus exactement et tout aussi naturellement la succession narrative hébraïque. « Sur la route qui mène au désert de Gabaon » est plus idiomatique et explicite que « sur le chemin du désert de Gabaon », tout en conservant le sens routier de דֶּרֶךְ.
  terminology: Les formes Joab, Abishaï, Abner, Amma, Guiah et Gabaon sont cohérentes avec un usage biblique français. « Colline », « en face de » et « désert » conviennent. Les notes sont ancrées aux expressions qu’elles concernent et préservent les nuances géographiques.
