base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: fr
  text: Joab et Abishaï poursuivirent Abner. Le soleil se coucha, et ils arrivèrent jusqu’à la colline d’Amma, qui est en face de Guiah[a], sur la route qui mène au désert de Gabaon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Guiah » ; l’expression hébraïque peut désigner une position devant un lieu ou en face de lui.
    reason: lexical_alternative
  - marker: b
    text: Ou « en direction du désert de Gabaon » ; l’hébreu peut mettre l’accent sur la direction plutôt que sur la route elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: poursuivirent Abner
  rationale: Le verbe רדף suivi de אַחֲרֵי exprime ici une poursuite hostile. En français, « poursuivre Abner » rend naturellement l’ensemble sans reproduire la préposition hébraïque.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: Le soleil se couchait
  rationale: Littéralement, le soleil « venait », tournure hébraïque désignant son coucher. L’imparfait français présente naturellement la circonstance temporelle pendant laquelle ils atteignent la colline.
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: lorsqu’ils arrivèrent à
  rationale: Avec un lieu, עַד indique le point atteint. « Arrivèrent à » est idiomatique en français; « lorsqu’ » explicite sobrement le rapport circonstanciel entre le coucher du soleil et leur arrivée.
- source_word: גִּבְעַת אַמָּה
  choice: la colline d’Amma
  rationale: Le syntagme construit désigne une colline associée au nom propre Amma.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: qui se trouve en face de Guiah
  rationale: עַל־פְּנֵי peut situer un lieu devant ou vis-à-vis d’un autre. « En face de » conserve cette relation géographique sans lui attribuer une orientation cardinale absente du texte.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: sur le chemin du désert de Gabaon
  rationale: דֶּרֶךְ désigne un chemin ou une route. La formulation française garde ouverte la relation précise entre le chemin, le désert et Gabaon, tout en restant lisible.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: Joab / Abishaï / Abner / Amma / Guiah / Gabaon
  rationale: Les noms sont rendus selon des formes françaises bibliques reconnaissables, avec translittération adaptée pour les toponymes moins établis.
