base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: fr
  text: 'Les hommes de Juda vinrent, et là ils oignirent David comme roi sur la maison de Juda. Ils informèrent David : « Ce sont les hommes de Yabesh de Galaad qui ont enterré Saül[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « Les hommes de Yabesh de Galaad ont enterré Saül. »'
    reason: La proposition relative hébraïque peut recevoir une force identificatrice ou se rendre comme une affirmation simple.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le verbe בוא décrit ici l’arrivée des hommes de Juda; « vinrent » convient au mouvement narratif sans préciser davantage le point de vue.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: les hommes de Juda
  rationale: אַנְשֵׁי désigne explicitement des hommes, probablement les représentants masculins de Juda dans cette scène.
- source_word: וַיִּמְשְׁחוּ
  choice: donnèrent l’onction à
  rationale: En contexte royal, משׁח désigne l’acte d’oindre un roi. Cette formulation française conserve sa portée politique et religieuse.
- source_word: לְמֶלֶךְ עַל בֵּית יְהוּדָה
  choice: pour qu’il soit roi sur la maison de Juda
  rationale: La tournure exprime clairement l’établissement de David comme roi et conserve l’image collective de la « maison de Juda ».
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: On informa David
  rationale: Le hiphil de נגד signifie informer ou rapporter. Une formulation française directe évite le calque lourd « ils dirent à David en disant »; le sujet hébreu n’étant pas exprimé, « on » préserve cette indétermination.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: les hommes de Yabesh en Galaad
  rationale: « Yabesh en Galaad » rend le nom géographique de manière transparente en français tout en distinguant la ville de sa région.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: Ce sont … qui ont enterré Saül
  rationale: La construction clivée rend naturellement en français la valeur identificatrice possible de la proposition relative, sans changer l’identité des acteurs.
theological_decisions:
- issue: Langage collectif masculin dans אַנְשֵׁי
  choice: « hommes » dans les deux occurrences
  alternative: « gens », « habitants » ou « responsables »
  rationale: Le terme hébreu est lexicalement masculin. Le contexte peut viser des représentants ou acteurs masculins, mais le texte ne les qualifie pas plus précisément.
- issue: Portée de בֵּית יְהוּדָה
  choice: conserver « la maison de Juda »
  alternative: « Juda » ou « la tribu de Juda »
  rationale: « Maison » préserve l’image hébraïque et la dimension dynastique, tribale ou collective, sans réduire l’expression à un territoire ni la préciser au-delà du texte.
- issue: Force identificatrice de אֲשֶׁר
  choice: « Ce sont les hommes … qui »
  alternative: « les hommes … ont enterré Saül »
  rationale: La formulation principale rend la lecture identificatrice suggérée par le contexte; la note conserve la possibilité syntaxique d’une déclaration plus simple.
translation_notes:
  register: Français international moderne, narratif et digne. « Donner l’onction » reste accessible tout en préservant le vocabulaire royal biblique. Le nom יָבֵישׁ est transcrit « Yabesh » et גִּלְעָד selon la forme française traditionnelle « Galaad ».
