base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/019.yaml
  text: Asahel pursued Abner[a], and he did not turn to the right or to the left from following Abner.
translation:
  language: fr
  text: Asaël poursuivit Abner et, en le suivant[a], ne dévia ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Asaël poursuivit Abner et ne se détourna, en allant, ni à droite ni à gauche de derrière Abner. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: poursuivit
  rationale: Le verbe רדף exprime ici une poursuite active et soutenue. « Poursuivit » est naturel dans un récit et conserve cette force.
- source_word: אַחֲרֵי אַבְנֵר
  choice: Abner
  rationale: Après « poursuivit », le français construit normalement le nom comme complément direct, sans rendre séparément la préposition אַחֲרֵי.
- source_word: וְלֹא נָטָה
  choice: ne se détourna pas
  rationale: נטה décrit ici le fait de quitter une direction ou de s’écarter d’un trajet. « Ne se détourna pas » rend clairement l’image du mouvement.
- source_word: לָלֶכֶת עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: pour aller à droite ou à gauche
  rationale: Cette formulation française restitue l’infinitif de mouvement et l’expression hébraïque désignant tout écart d’un côté ou de l’autre.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: de lui
  rationale: Dans ce contexte, l’expression signifie qu’Asaël ne cesse pas de suivre Abner. Le pronom évite une répétition lourde tout en gardant Abner comme point de référence.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: Asaël / Abner
  rationale: Les noms propres suivent leurs formes françaises bibliques usuelles.
