  text: וַ/תְּהִ֧י הַ/מִּלְחָמָ֛ה קָשָׁ֥ה עַד מְאֹ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּנָּ֤גֶף אַבְנֵר֙ וְ/אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: fr
  text: Ce jour-là, la bataille fut extrêmement acharnée, et Abner et les hommes d’Israël furent battus devant les serviteurs de David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, les « serviteurs de David » désignent les hommes qui étaient à son service, notamment ses combattants.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: la bataille
  rationale: Dans cette scène, le terme désigne l’affrontement précis plutôt qu’une guerre prolongée.
- source_word: קָשָׁה עַד מְאֹד
  choice: extrêmement acharnée
  rationale: קָשָׁה exprime ici la dureté ou la violence du combat, tandis que עַד מְאֹד en renforce fortement le degré. « Extrêmement acharnée » est naturel en français dans un contexte militaire.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend directement et naturellement l’expression temporelle hébraïque.
- source_word: וַיִּנָּגֶף
  choice: furent battus
  rationale: Le niphal de נָגַף indique dans ce contexte une défaite militaire. Le pluriel français s’accorde naturellement avec le sujet composé.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Translittération française traditionnelle du nom propre.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: et les hommes d’Israël
  rationale: Reproduit le sens explicite de אַנְשֵׁי et désigne ici les combattants placés sous l’autorité d’Abner.
- source_word: לִפְנֵי
  choice: devant
  rationale: Conserve l’idiome militaire hébraïque de la défaite « devant » une force adverse.
- source_word: עַבְדֵי דָוִד
  choice: les serviteurs de David
  rationale: Rendu formellement proche du texte; dans ce cadre politique et militaire, il s’agit des hommes au service de David.
