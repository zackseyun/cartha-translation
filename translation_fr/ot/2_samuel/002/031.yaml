  text: וְ/עַבְדֵ֣י דָוִ֗ד הִכּוּ֙ מִ/בִּנְיָמִ֔ן וּ/בְ/אַנְשֵׁ֖י אַבְנֵ֑ר שְׁלֹשׁ מֵא֧וֹת וְ/שִׁשִּׁ֛ים אִ֖ישׁ מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/031.yaml
  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: fr
  text: Mais les serviteurs de David frappèrent trois cent soixante hommes parmi les Benjaminites et les hommes d’Abner, et ceux-ci moururent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et les serviteurs de David… » Le mot hébreu peut simplement signifier « et » ; « mais » souligne ici le contraste avec le bilan des pertes donné au verset précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: Mais les serviteurs de David
  rationale: Le וְ narratif peut signifier « et » ou prendre ici une valeur contrastive. « Mais » fait ressortir le contraste avec les pertes de David rapportées au verset précédent. « Serviteurs » conserve le rapport de service exprimé par עֲבָדִים sans suggérer nécessairement l’esclavage.
- source_word: הִכּוּ
  choice: frappèrent
  rationale: 'Le verbe נכה désigne l’action de frapper ou d’abattre. Le rendre par « frappèrent », puis traduire séparément מֵתוּ, préserve les deux éléments distincts de l’hébreu : l’attaque et son issue mortelle.'
- source_word: מִ/בִּנְיָמִן
  choice: parmi les Benjaminites
  rationale: La préposition מִן indique ici le groupe dont provenaient les victimes. « Parmi les Benjaminites » est naturel en français et explicite la référence tribale.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: et les hommes d’Abner
  rationale: La formulation désigne les hommes placés sous le commandement d’Abner. Dans la construction française avec « parmi », la coordination « parmi les Benjaminites et les hommes d’Abner » rend naturellement le second groupe sans imposer une distinction plus précise que l’hébreu.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: trois cent soixante hommes
  rationale: Traduction directe du nombre et du nom collectif singulier אִישׁ, qui exige le pluriel en français après ce nombre.
- source_word: מֵתוּ
  choice: et ceux-ci moururent
  rationale: L’hébreu énonce explicitement qu’ils moururent après avoir été frappés. Cette proposition conserve cette information au lieu de la fondre dans le seul verbe « tuer ».
theological_decisions: []
