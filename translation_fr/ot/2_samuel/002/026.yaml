base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: fr
  text: 'Alors Abner appela Joab et lui dit : « L’épée dévorera-t-elle sans fin ? Ne sais-tu pas qu’à la fin ce sera amer ? Jusqu’à quand attendras-tu pour dire au peuple de cesser de poursuivre ses frères[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « de cesser de suivre leurs frères ». L’expression hébraïque signifie littéralement « de derrière/après leurs frères » et peut évoquer le fait de suivre ou, dans ce contexte militaire, de poursuivre.'
    reason: L’hébreu מֵאַחֲרֵי permet une nuance entre « suivre » et « poursuivre » ; la note conserve cette possibilité sans calque français.
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: sans fin
  rationale: Dans cette question rhétorique, l’expression désigne une continuation indéfinie. « Sans fin » est naturel en français et conserve la force de l’interpellation.
- source_word: תֹּאכַל חֶרֶב
  choice: l’épée dévorera
  rationale: La formulation conserve la personnification hébraïque de l’épée qui « mange » et rend cette image avec le verbe français naturel « dévorer ».
- source_word: מָרָה
  choice: amère
  rationale: « Amère » maintient la métaphore du texte et qualifie naturellement l’issue douloureuse de la poursuite des combats.
- source_word: בָּאַחֲרוֹנָה
  choice: l’issue
  rationale: Dans ce contexte, l’expression temporelle renvoie au résultat final. « L’issue sera amère » exprime ce sens en français courant sans perdre l’idée de conséquence ultime.
- source_word: וְעַד מָתַי
  choice: Jusqu’à quand attendras-tu pour
  rationale: Littéralement « et jusqu’à quand ne diras-tu pas » ; cette tournure française rend clairement le reproche portant sur le délai avant l’intervention de Joab.
- source_word: לֹא תֹאמַר לָעָם
  choice: dire au peuple
  rationale: אמר signifie ici « dire » avec une instruction indirecte. Cette traduction n’introduit pas la nuance plus forte de « commander ».
- source_word: לָשׁוּב
  choice: de cesser
  rationale: Le verbe signifie « revenir, faire demi-tour ». Avec un complément introduit par מֵאַחֲרֵי, « cesser de poursuivre » exprime naturellement l’arrêt et le retrait demandés dans la situation militaire.
- source_word: מֵאַחֲרֵי
  choice: de poursuivre
  rationale: L’expression signifie littéralement « de derrière/après ». Dans le contexte d’un combat et d’une retraite, « poursuivre » explicite justement sa valeur contextuelle.
- source_word: אֲחֵיהֶם
  choice: ses frères
  rationale: Le suffixe pluriel renvoie distributivement aux membres du peuple. En français, « le peuple… ses frères » est naturel et préserve la force familiale du terme hébreu.
