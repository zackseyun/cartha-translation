  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: fr
  text: 'David envoya des messagers aux hommes de Yabesh-Galaad et leur dit : « Vous êtes bénis par Yahweh[a], puisque vous avez fait preuve de cette bonté[b] envers votre seigneur, Saül, en l’ensevelissant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formule est une bénédiction ; elle peut aussi être rendue : « Que Yahweh vous bénisse » ou « Vous êtes bénis de la part de Yahweh ».'
    reason: ambiguïté grammaticale et lexicale
  - marker: b
    text: Le mot hébreu ḥésèd peut désigner la bonté, la loyauté ou l’amour fidèle.
    reason: étendue sémantique
lexical_decisions:
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Dans ce récit, le terme désigne les agents humains envoyés par David, et non des êtres célestes.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: les hommes de Yabesh en Galaad
  rationale: Le texte hébreu porte explicitement le pluriel masculin « hommes de »; « en Galaad » situe naturellement la ville en français.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: Vous êtes bénis par Yahweh
  rationale: Le participe passif בְּרֻכִים est rendu comme une déclaration plutôt que transformé sans nécessité en souhait. « Par Yahweh » exprime naturellement la source de la bénédiction, tout en signalant en note une autre compréhension possible de לַיהוָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: חֶסֶד
  choice: bonté
  rationale: Le mot désigne ici l’acte concret de bonté loyale accompli envers Saül par son ensevelissement; une note conserve sa gamme sémantique plus large.
- source_word: אֲדֹנֵיכֶם
  choice: votre seigneur
  rationale: Le terme présente Saül comme le souverain auquel les hommes de Yabesh étaient liés.
- source_word: עִם שָׁאוּל
  choice: à votre seigneur Saül
  rationale: Après « témoigner cette bonté », le français appelle naturellement la préposition « à »; Saül est mis en apposition à « votre seigneur ».
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: et que vous l’avez enseveli
  rationale: Cette formulation rattache clairement l’ensevelissement à l’acte de bonté déjà accompli et conserve le registre digne du récit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre; « Yahweh » le conserve sans lui substituer un titre.
- issue: Force de la formule בְּרֻכִים אַתֶּם לַיהוָה
  choice: 'déclaration : « Vous êtes bénis par Yahweh »'
  alternative: 'souhait : « Que Yahweh vous bénisse »; relation : « Vous êtes bénis devant Yahweh »'
  rationale: La forme hébraïque est un participe passif, ce qui favorise une déclaration. La fonction de bénédiction et la nuance de la préposition לְ permettent toutefois d’autres formulations, signalées en note.
translation_notes:
  register: Français international moderne, narratif et digne. « Enseveli » maintient un registre légèrement soutenu adapté au contexte funéraire sans être archaïque. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
