revisions:
- from: 'David envoya des messagers aux hommes de Yabesh en Galaad et leur dit : « Vous êtes bénis par Yahweh[a], puisque vous avez témoigné cette bonté[b] à votre seigneur Saül et que vous l’avez enseveli. »'
  to: 'David envoya des messagers aux hommes de Yabesh-Galaad et leur dit : « Vous êtes bénis par Yahweh[a], puisque vous avez fait preuve de cette bonté[b] envers votre seigneur, Saül, en l’ensevelissant. »'
  rationale: La révision conserve la déclaration bénédictive, le nom divin et la nuance de ḥésèd, tout en rétablissant le toponyme Yabesh-Galaad, en améliorant la syntaxe française et en corrigeant la présentation de l’alternative dans la note a.
