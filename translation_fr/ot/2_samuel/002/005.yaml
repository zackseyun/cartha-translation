    issue: Le nom de lieu est rendu « Yabesh en Galaad ».
    rationale: אַנְשֵׁי יָבֵישׁ גִּלְעָד désigne les hommes de Jabesh-Gilead/Yabesh-Galaad. « En Galaad » interprète le second élément comme une localisation plutôt que de conserver le toponyme traditionnel.
  - severity: medium
    issue: « Vous avez témoigné cette bonté à » est maladroit.
    rationale: Le verbe « témoigner » ne se construit pas naturellement ainsi dans ce sens. « Vous avez fait preuve de cette bonté envers » restitue clairement עֲשִׂיתֶם הַחֶסֶד ... עִם.
  - severity: low
    issue: La note a propose « devant Yahweh » comme lecture plus littérale.
    rationale: Cette paraphrase n’est pas la représentation la plus directe de la préposition dans cette formule ; elle risque d’introduire une nuance spatiale ou cultuelle absente du texte.
