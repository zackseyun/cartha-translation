  text: וַ/יַּ֤עַל שָׁם֙ דָּוִ֔ד וְ/גַ֖ם שְׁתֵּ֣י נָשָׁ֑י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: fr
  text: 'David y monta, ainsi que ses deux femmes : Ahinoam de Jizréel et Abigaïl, femme de Nabal de Carmel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: y monta
  rationale: Le verbe עלה exprime une montée vers le lieu indiqué dans le contexte, tandis que שָׁם est naturellement repris en français par « y ».
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: avec ses deux femmes
  rationale: Dans ce récit de déplacement, « avec » rend naturellement le fait que les deux femmes accompagnent David. Le nombre et le lien conjugal sont conservés.
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: Ahinoam de Jizréel
  rationale: Le gentilé féminin indique l'origine ou l'appartenance géographique d'Ahinoam. La tournure « de Jizréel » est claire et idiomatique en français moderne.
- source_word: וַאֲבִיגַיִל
  choice: et Abigaïl
  rationale: La conjonction coordonne simplement le nom de la seconde femme.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: femme de Nabal de Carmel
  rationale: La formulation conserve l'identification littéraire d'Abigaïl par son mariage avec Nabal, tout en rattachant naturellement le gentilé « de Carmel » à Nabal.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Y monta » préserve à la fois la direction ascendante et le renvoi au lieu mentionné au verset précédent. Les gentilés hébreux sont rendus par des compléments d'origine, plus immédiatement compréhensibles que « Jizréélite » ou « Carmélite ».
