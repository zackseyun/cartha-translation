  text: וַֽ/יַּחֲזִ֜קוּ אִ֣ישׁ בְּ/רֹ֣אשׁ רֵעֵ֗/הוּ וְ/חַרְבּ/וֹ֙ בְּ/צַ֣ד רֵעֵ֔/הוּ וַֽ/יִּפְּל֖וּ יַחְדָּ֑ו וַ/יִּקְרָא֙ לַ/מָּק֣וֹם הַ/ה֔וּא חֶלְקַ֥ת הַצֻּרִ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: fr
  text: Chacun saisit son adversaire par la tête, son épée dans le flanc de l’autre, et ils tombèrent ensemble. C’est pourquoi on appela cet endroit, qui se trouve à Gabaon, Helqath-Hatsourim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Helqath-Hatsourim est la transcription du nom hébreu de ce lieu. Son sens exact est incertain ; on a notamment proposé « Champ des flancs », « Champ des tranchants » ou d’autres traductions semblables.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ אִישׁ
  choice: Chacun saisit
  rationale: Le singulier distributif אִישׁ décrit l’action réciproque de chaque combattant, tandis que חזק exprime ici une prise énergique dans un combat.
- source_word: בְּרֹאשׁ רֵעֵהוּ
  choice: son adversaire par la tête
  rationale: רֹאשׁ signifie littéralement « tête ». Dans cette scène de duel, רֵעַ désigne l’homme opposé à chacun plutôt qu’un ami ; « adversaire » rend clairement la relation contextuelle.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: son épée dans le flanc de l’autre
  rationale: La proposition hébraïque est sans verbe et produit une image brève et saisissante. Cette formulation conserve cette ellipse sans préciser si l’épée fut poussée, plantée ou se trouvait déjà dans le flanc. צַד est rendu par « flanc » dans ce contexte corporel.
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: et ils tombèrent ensemble
  rationale: La coordination poursuit directement le récit, et יַחְדָּו souligne que les deux hommes tombèrent au même moment.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: C’est pourquoi on appela cet endroit
  rationale: Le singulier hébreu à sujet non précisé se rend naturellement en français par « on appela ». « C’est pourquoi » explicite sobrement le lien narratif entre l’affrontement et le nom donné au lieu.
- source_word: חֶלְקַת הַצֻּרִים
  choice: Helqath-Hatsourim
  rationale: Le nom de lieu est translittéré, car son étymologie et son sens exact restent incertains. La graphie retenue reste lisible en français tout en reflétant les consonnes hébraïques.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: qui se trouve à Gabaon
  rationale: La proposition relative situe l’endroit nommé. « Gabaon » est la forme française traditionnelle et largement reconnue du toponyme.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la concision violente de l’hébreu, notamment sa proposition sans verbe concernant l’épée. Le marqueur de note est placé après le nom de lieu auquel la note se rapporte.
