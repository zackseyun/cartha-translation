source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: fr
  text: Alors Abner, fils de Ner, et les serviteurs d’Ish-Bosheth[a], fils de Saül, partirent de Mahanaïm pour Gabaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même homme est appelé « Eshbaal » en 1 Chroniques 8.33 et 9.39.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Alors … partirent
  rationale: Le waw consécutif fait avancer le récit; « Alors » rend naturellement cette progression. Bien que le verbe hébreu soit au singulier, le sujet coordonné comprend Abner et les serviteurs; le pluriel est donc requis en français.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner, fils de Ner
  rationale: Les noms propres sont translittérés selon l’usage français moderne, et le patronyme est rendu directement.
- source_word: וְעַבְדֵי
  choice: les serviteurs de
  rationale: עֶבֶד peut désigner des serviteurs, des agents ou des hommes attachés à un chef. « Serviteurs » conserve la portée du terme sans préciser indûment leur fonction militaire ou politique.
- source_word: אִישׁ בֹּשֶׁת
  choice: Ish-Bosheth
  rationale: Le texte massorétique porte Ish-Bosheth. La forme Eshbaal, attestée dans les Chroniques, est signalée en note sans remplacer la lecture de Samuel.
- source_word: בֶּן שָׁאוּל
  choice: fils de Saül
  rationale: Traduction directe du patronyme qui identifie Ish-Bosheth.
- source_word: מִמַּחֲנַיִם
  choice: de Mahanaïm
  rationale: La préposition מִן marque le point de départ; le toponyme est translittéré selon une forme française claire.
- source_word: גִּבְעֹנָה
  choice: pour Gabaon
  rationale: Le hé directionnel indique un mouvement vers Gabaon. Après « partirent de », « pour Gabaon » exprime naturellement la destination en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les formes Saül, Mahanaïm et Gabaon suivent l’usage biblique français courant; Ish-Bosheth reste proche de la forme hébraïque du texte de Samuel. La note est placée après le nom auquel elle se rapporte.
