source:
  edition: WLC
  text: וְ/יוֹאָ֗ב שָׁ֚ב מֵ/אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּקְבֹּ֖ץ אֶת כָּל הָ/עָ֑ם וַ/יִּפָּ֨קְד֜וּ מֵ/עַבְדֵ֥י דָוִ֛ד תִּשְׁעָֽה עָשָׂ֥ר אִ֖ישׁ וַ/עֲשָׂה אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: fr
  text: Joab revint de la poursuite d’Abner et rassembla tous ses hommes. Lorsqu’on les compta, il manquait dix-neuf hommes parmi les serviteurs de David, sans compter Asaël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dix-neuf hommes, et Asaël »; Asaël s’ajoute donc aux dix-neuf.'
    reason: La note signale la coordination littérale de l’hébreu et précise que le total des pertes mentionnées est de vingt hommes.
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: revint de la poursuite d’Abner
  rationale: שׁוּב signifie couramment « revenir »; dans ce contexte militaire, מֵאַחֲרֵי indique que Joab cesse de poursuivre Abner. Cette formulation française reste proche de l’expression hébraïque tout en étant naturelle.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: et rassembla tous ses hommes
  rationale: עָם signifie littéralement « peuple », mais désigne ici la troupe placée sous les ordres de Joab. « Tous ses hommes » exprime clairement ce référent militaire sans employer le terme plus technique « troupes ».
- source_word: וַיִּפָּקְדוּ
  choice: Lorsqu’on les compta
  rationale: Le nifal de פקד désigne ici le fait d’être recensé ou compté. La tournure impersonnelle française restitue naturellement le passif hébreu et introduit le constat des pertes.
- source_word: מֵעַבְדֵי דָוִד
  choice: parmi les serviteurs de David
  rationale: עֲבָדִים signifie « serviteurs » et peut désigner, dans un cadre royal et militaire, les hommes au service de David. Le choix conserve la transparence lexicale du terme.
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: dix-neuf hommes
  rationale: Traduction directe du nombre cardinal suivi de אִישׁ, appropriée à ce contexte militaire.
- source_word: וַעֲשָׂה אֵל
  choice: sans compter Asaël
  rationale: La suite consonantique représente le nom propre Asaël, graphiquement segmenté dans la forme fournie. L’hébreu coordonne Asaël aux dix-neuf hommes comme perte supplémentaire; « sans compter » rend ce rapport sans laisser croire qu’il fait partie des dix-neuf.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Tous ses hommes » clarifie le sens militaire contextuel de עָם; « serviteurs de David » conserve en revanche le terme relationnel du texte source.
