  text: וַ/יִּשְׂאוּ֙ אֶת עֲשָׂהאֵ֔ל וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/קֶ֣בֶר אָבִ֔י/ו אֲשֶׁ֖ר בֵּ֣ית לָ֑חֶם וַ/יֵּלְכ֣וּ כָל הַ/לַּ֗יְלָה יוֹאָב֙ וַֽ/אֲנָשָׁ֔י/ו וַ/יֵּאֹ֥ר לָ/הֶ֖ם בְּ/חֶבְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: fr
  text: Ils emportèrent Asaël et l’enterrèrent dans le tombeau de son père[a], qui se trouvait à Bethléem. Puis Joab et ses hommes marchèrent toute la nuit, et le jour se leva sur eux à Hébron[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tombe de son père ». Le mot hébreu קֶבֶר peut désigner une tombe ou un tombeau, notamment un lieu de sépulture familial.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque dit littéralement : « il devint clair pour eux à Hébron ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: Ils emportèrent
  rationale: Dans ce contexte funéraire, נשׂא désigne le transport du corps d’Asaël. « Emportèrent » est naturel en français et exprime le déplacement du corps sans lourdeur.
- source_word: עֲשָׂהאֵל
  choice: Asaël
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: וַיִּקְבְּרֻהוּ
  choice: l’enterrèrent
  rationale: קבר est le verbe courant signifiant « enterrer ». Ce choix est clair et naturel en français moderne.
- source_word: בְּקֶבֶר אָבִיו
  choice: dans le tombeau de son père
  rationale: קֶבֶר peut désigner une tombe ou un tombeau. « Tombeau » convient bien à la possible idée d’un lieu de sépulture familial, sans exclure l’autre sens, signalé en note.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: qui se trouvait à Bethléem
  rationale: Le verbe implicite est explicité pour produire une relative naturelle en français. « À Bethléem » situe le tombeau dans cette localité.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: marchèrent toute la nuit
  rationale: הלך exprime ici un déplacement prolongé. « Marchèrent » convient au groupe en déplacement dans ce récit militaire, sans imposer l’idée plus précise d’une marche organisée.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: Joab et ses hommes
  rationale: Rendu direct de l’hébreu, naturel dans le contexte d’une troupe sous le commandement de Joab.
- source_word: וַיֵּאֹר לָהֶם
  choice: le jour se leva sur eux
  rationale: L’expression rend idiomatiquement l’hébreu « il devint clair pour eux » tout en conservant l’image de la lumière du jour qui les rejoint.
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: Translittération française usuelle du toponyme et construction locative naturelle.
