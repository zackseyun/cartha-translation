base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: fr
  text: Mais il refusa de se détourner. Alors Abner le frappa au ventre[a] avec l’extrémité arrière de la lance, et celle-ci ressortit derrière lui. Asaël tomba là et mourut sur place. Tous ceux qui arrivaient à l’endroit où Asaël était tombé et était mort s’arrêtaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu חֹמֶשׁ est traditionnellement rendu par « cinquième côte » dans certaines anciennes traductions; dans ce contexte, il désigne probablement plus généralement le ventre ou l’abdomen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: il refusa de se détourner
  rationale: Le verbe מאן exprime un refus, tandis que סור désigne le fait de s’écarter ou de se détourner. Cette formulation reste proche de l’image concrète de l’hébreu tout en étant naturelle en français.
- source_word: וַיַּכֵּהוּ
  choice: le frappa
  rationale: Rendu narratif direct et courant du verbe נכה.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: avec l’extrémité arrière de la lance
  rationale: L’expression désigne la partie arrière de la lance, par opposition à sa pointe. « L’extrémité arrière » est clair pour un lectorat général et évite un terme technique.
- source_word: אֶל הַחֹמֶשׁ
  choice: au ventre
  rationale: חֹמֶשׁ est un terme anatomique difficile. Dans ce contexte guerrier, il semble désigner largement la région abdominale; « au ventre » est concret, naturel et n’impose pas l’interprétation traditionnelle de la « cinquième côte ».
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: celle-ci ressortit derrière lui
  rationale: La formulation conserve la description hébraïque de la lance qui traverse le corps et ressort par-derrière, sans préciser davantage que le texte source.
- source_word: וַיִּפָּל שָׁם
  choice: Asaël tomba là
  rationale: Le nom explicite l’antécédent en français, tandis que « tomba là » suit simplement la séquence narrative hébraïque.
- source_word: וַיָּמָת תַּחְתָּו
  choice: mourut sur place
  rationale: 'תחתיו a ici une valeur idiomatique: il mourut là même où il tomba. « Sur place » en restitue naturellement le sens.'
- source_word: כָּל הַבָּא
  choice: tous ceux qui arrivaient
  rationale: Le participe précédé de כל a une portée distributive. L’imparfait français convient à la réaction répétée de chaque nouvel arrivant.
- source_word: וַיַּעֲמֹדוּ
  choice: s’arrêtaient
  rationale: Dans ce contexte, עמד décrit ceux qui cessent d’avancer en arrivant devant le corps. « S’arrêtaient » exprime clairement ce mouvement interrompu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation privilégie des mots immédiatement compréhensibles, sans atténuer la violence du récit ni préciser au-delà de l’hébreu la trajectoire de la lance.
