  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: fr
  text: 'Abner dit à Joab : « Que les jeunes hommes se lèvent donc et s’affrontent[a] devant nous. » Joab répondit : « Qu’ils se lèvent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « s’affrontent » peut aussi signifier « jouent » ou « se divertissent ». Dans ce contexte, il désigne une joute entre les deux groupes.
    reason: Préserver l’étendue de sens du verbe hébreu שׂחק tout en indiquant la valeur suggérée par le contexte narratif.
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: les jeunes hommes
  rationale: Le terme désigne ici les membres jeunes des deux groupes armés; « jeunes hommes » est naturel et évite le sens trop juvénile de « garçons ».
- source_word: וִישַׂחֲקוּ
  choice: et s’affrontent
  rationale: Le verbe peut évoquer le jeu ou le divertissement, mais le contexte immédiat décrit une confrontation organisée qui devient mortelle. « S’affrontent » rend cette valeur contextuelle sans préciser indûment la forme du combat.
- source_word: נָא
  choice: donc
  rationale: La particule nuance l’invitation ou la proposition. Ici, « donc » donne à la demande sa tonalité incitative sans la rendre excessivement polie.
- source_word: לְפָנֵינוּ
  choice: devant nous
  rationale: Traduction directe de l’expression spatiale, qui présente Abner et Joab comme spectateurs de l’affrontement.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation conserve le parallélisme entre la proposition d’Abner et l’accord bref de Joab.
