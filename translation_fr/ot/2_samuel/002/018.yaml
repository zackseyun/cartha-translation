base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: fr
  text: 'Les trois fils de Tserouya étaient là : Joab, Abishaï et Asaël. Asaël était rapide à la course, comme l’une des gazelles dans la campagne.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rapide comme l’un des cerfs dans la campagne » ; le mot hébreu peut désigner plus largement un animal sauvage apparenté au cerf, mais « gazelle » est probablement plus précis ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: étaient là
  rationale: La proposition indique simplement la présence des trois hommes sur les lieux; cette tournure française est directe et naturelle.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: les trois fils de Tserouya
  rationale: L’article défini convient au groupe précis et connu que le texte nomme ensuite.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: Joab, Abishaï et Asaël
  rationale: Les noms propres suivent des formes françaises usuelles et restent reconnaissables.
- source_word: קַל בְּרַגְלָיו
  choice: courait aussi vite
  rationale: L’expression hébraïque décrit l’agilité et la rapidité à la course. Une traduction idiomatique évite le calque peu naturel « rapide de ses pieds ».
- source_word: כְּאַחַד הַצְּבָיִם
  choice: que l’une des gazelles
  rationale: צְבִי désigne ici très probablement la gazelle, animal proverbialement rapide; la comparaison est formulée naturellement en français.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שָׂדֶה évoque ici l’espace ouvert où vivent les animaux sauvages plutôt qu’un champ cultivé précis.
