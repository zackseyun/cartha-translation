  terminology: Les formes Tserouya, Joab, Abishaï et Asaël sont cohérentes. « Gazelles » est le choix précis le plus probable pour צְבִי dans ce contexte. La note proposée est ajustée afin d’éviter de qualifier les gazelles de « cervidés », catégorie zoologique trop étroite et techniquement inexacte.
