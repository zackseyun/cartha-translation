  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: fr
  text: 'Abner se retourna et dit : « Est-ce bien toi, Asaël ? » Il répondit : « C’est moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: se retourna
  rationale: Le verbe פנה signifie ici qu’Abner se tourne pendant la poursuite. « Se retourna » est naturel en français et convient au complément spatial qui suit.
- source_word: אַחֲרָיו
  choice: intégré à « se retourna »
  rationale: L’expression désigne l’arrière d’Abner. En français, « se retourna derrière lui » serait maladroit ou ambigu ; le verbe pronominal exprime naturellement le mouvement vers l’arrière.
- source_word: הֲאַתָּה זֶה
  choice: Est-ce bien toi
  rationale: La combinaison du pronom et du démonstratif sert à vérifier l’identité. « Est-ce bien toi » restitue cette nuance de reconnaissance en français courant sans traduire mécaniquement le démonstratif.
- source_word: עֲשָׂהאֵל
  choice: Asaël
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: אָנֹכִי
  choice: C’est moi
  rationale: Le pronom indépendant constitue à lui seul une réponse d’identification. « C’est moi » est la réponse idiomatique française correspondante.
