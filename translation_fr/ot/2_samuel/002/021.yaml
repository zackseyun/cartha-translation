base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: fr
  text: 'Abner lui dit : « Détourne-toi vers ta droite ou vers ta gauche, saisis-toi de l’un des jeunes hommes et prends son équipement[a]. » Mais Asaël ne voulut pas cesser de le poursuivre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son armure ». Le terme hébreu désigne probablement l’équipement retiré à un combattant vaincu, mais l’objet exact reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה לְךָ
  choice: Écarte-toi
  rationale: Dans le contexte de la poursuite, l’impératif demande à Asaël de dévier de sa trajectoire. « Écarte-toi » exprime naturellement ce mouvement en français.
- source_word: עַל יְמִינְךָ אוֹ עַל שְׂמֹאלֶךָ
  choice: sur ta droite ou sur ta gauche
  rationale: Cette formulation conserve les suffixes de deuxième personne et l’opposition directionnelle de l’hébreu.
- source_word: וֶאֱחֹז לְךָ
  choice: saisis-toi
  rationale: Le verbe אחז signifie saisir ou s’emparer de. La forme pronominale française rend ici naturellement la nuance d’intérêt personnel portée par לְךָ.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: l’un des jeunes hommes
  rationale: « Jeunes hommes » reste proche du sens lexical de נְעָרִים sans préciser indûment leur rang militaire.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: prends son équipement
  rationale: חֲלִצָה désigne vraisemblablement ce que l’on dépouille d’un combattant, probablement son équipement ou son armure. « Équipement » convient au contexte martial tout en évitant une précision incertaine.
- source_word: וְלֹא אָבָה
  choice: ne voulut pas
  rationale: אבה exprime le consentement ou la volonté. « Ne voulut pas » est une tournure française naturelle qui en conserve la nuance.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: cesser de le poursuivre
  rationale: Littéralement, l’expression évoque le fait de se détourner de derrière lui. Dans cette scène, elle signifie qu’Asaël refuse d’abandonner sa poursuite.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond à l’adresse directe au singulier. La répétition hébraïque de לְךָ (« pour toi ») n’est pas reproduite mécaniquement, car « saisis-toi » en exprime déjà la nuance et « prends son équipement » reste naturel dans le contexte.
