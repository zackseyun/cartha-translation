translation_notes:
  register: Français international actuel, narratif et digne. La syntaxe est fluidifiée tout en conservant l’effectif symétrique et l’affiliation des deux groupes. Les ambiguïtés pertinentes du nom Ish-Bosheth et du terme désignant les serviteurs sont signalées en notes.
