base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: fr
  text: 'Ils se levèrent donc et s’avancèrent, au nombre de douze : douze pour Benjamin et pour Ish-Bosheth, fils de Saül[a], et douze d’entre les serviteurs de David[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu « Ish-Bosheth » ; la forme apparentée « Eshbaal » apparaît ailleurs dans la tradition de l’Ancien Testament.
    reason: alternative_reading
  - marker: b
    text: Ou « d’entre les hommes de David ». Dans ce contexte royal et militaire, le mot hébreu traduit par « serviteurs » peut désigner des hommes attachés à son service.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Ils se levèrent
  rationale: Le verbe קום marque ici l’action suivante du récit. « Se levèrent » conserve la séquence narrative et reste naturel dans ce contexte solennel.
- source_word: וַיַּעַבְרוּ
  choice: s’avancèrent
  rationale: עבר peut désigner le fait de passer, de traverser ou de s’avancer vers un emplacement. Dans cette scène de confrontation, « s’avancèrent » exprime naturellement leur mouvement vers le lieu convenu sans préciser indûment qu’ils franchissent un cours d’eau.
- source_word: בְמִסְפָּר
  choice: en nombre égal
  rationale: L’expression indique un effectif compté, avec douze hommes de chaque côté. La formulation française explicite sobrement cette correspondance numérique.
- source_word: לְבִנְיָמִן וּלְאִישׁ בֹּשֶׁת
  choice: pour Benjamin et pour Ish-Bosheth
  rationale: La préposition ל marque ici vraisemblablement le camp ou l’appartenance. « Pour » préserve cette relation sans la réduire à la seule origine géographique ou tribale.
- source_word: בֶּן שָׁאוּל
  choice: fils de Saül
  rationale: Traduction directe de la désignation filiale, nécessaire pour identifier Ish-Bosheth.
- source_word: מֵעַבְדֵי דָוִד
  choice: parmi les serviteurs de David
  rationale: עבדים signifie littéralement « serviteurs » et peut, dans ce cadre royal et militaire, désigner les hommes au service de David. « Parmi » rend naturellement la provenance exprimée par מִן.
