  text: וְ/עָבַ֣דְתָּ לּ֣/וֹ אֶֽת הָ/אֲדָמָ֡ה אַתָּה֩ וּ/בָנֶ֨י/ךָ וַ/עֲבָדֶ֜י/ךָ וְ/הֵבֵ֗אתָ וְ/הָיָ֨ה לְ/בֶן אֲדֹנֶ֤י/ךָ לֶּ֨חֶם֙ וַ/אֲכָל֔/וֹ וּ/מְפִיבֹ֨שֶׁת֙ בֶּן אֲדֹנֶ֔י/ךָ יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל שֻׁלְחָנִ֑/י וּ/לְ/צִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים וְ/עֶשְׂרִ֥ים עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: fr
  text: Tu cultiveras pour lui la terre, toi, tes fils et tes esclaves, et tu en rentreras la récolte, afin que le fils de ton maître ait du pain[a] et qu’il en mange. Mais Méphibosheth, le fils de ton maître, mangera toujours du pain à ma table. Or Tsiba avait quinze fils et vingt esclaves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « pain » peut aussi désigner la nourriture ou les provisions en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת־הָאֲדָמָה
  choice: vous cultiverez pour lui les terres
  rationale: Avec אֲדָמָה comme complément, עבד désigne ici le travail agricole. « Cultiver les terres » est naturel en français et maintient le bénéficiaire exprimé par לּוֹ.
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ
  choice: toi, tes fils et tes esclaves
  rationale: Le contexte décrit la main-d’œuvre attachée à la maison de Tsiba. « Esclaves » rend explicitement le statut servile de עֲבָדִים, plutôt que de suggérer de simples employés.
- source_word: וְהֵבֵאתָ
  choice: tu en rentreras la récolte
  rationale: Le verbe signifie littéralement « faire venir, apporter ». Le contexte agricole permet d’expliciter son objet implicite par « la récolte » ; « rentrer la récolte » est idiomatique.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: afin que le fils de ton maître ait du pain et qu’il en mange
  rationale: Cette formulation reproduit la finalité de la production agricole et conserve לֶחֶם sous la forme « pain », tout en rendant naturellement en français le pronom objet hébreu.
- source_word: יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: mangera toujours à ma table
  rationale: L’expression française « manger à ma table » rend naturellement l’idiome hébreu de la table royale. La répétition littérale de « pain » serait possible, mais moins naturelle ici sans ajouter de sens.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: Or Tsiba avait quinze fils et vingt esclaves
  rationale: La proposition nominale hébraïque fournit une information d’arrière-plan ; « avait » explicite en français la relation possessive sous-entendue. « Esclaves » conserve le statut social indiqué par עֲבָדִים.
