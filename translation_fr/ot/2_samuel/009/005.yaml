  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: fr
  text: Le roi David envoya le chercher chez Makir, fils d’Ammiel, à Lo-Debar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « envoya et le prit de la maison de Makir, fils d’Ammiel, de Lo-Debar ». La suite des verbes hébreux (« envoya » puis « prit ») peut se rendre idiomatiquement en français par « envoya le chercher ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya donc quelqu’un chercher
  rationale: Le verbe signifie littéralement « envoya ». En français, l’ajout de « quelqu’un » explicite naturellement l’agent sous-entendu, tandis que « chercher » se comprend avec le verbe suivant dans cette construction narrative.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette formulation française naturelle conserve le titre défini et le nom propre en apposition.
- source_word: וַיִּקָּחֵהוּ
  choice: chercher l’homme
  rationale: Le verbe לקח signifie d’abord « prendre », mais, après « envoya », la séquence indique ici que David le fait prendre pour qu’on le lui amène. « Chercher » rend cette action de manière idiomatique sans préciser explicitement une destination absente de l’hébreu. « L’homme » reprend clairement le référent masculin du contexte.
- source_word: מִבֵּית
  choice: chez
  rationale: בַּיִת peut désigner la maison ou le foyer. Dans ce contexte, « chez Makir » exprime naturellement en français le lieu où l’homme résidait tout en laissant ouverte la nuance entre demeure et maisonnée.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Makir, fils d’Ammiel
  rationale: Les noms sont translittérés selon un usage biblique français courant, et le lien de filiation exprimé par בֶּן est conservé.
- source_word: מִלּוֹ דְבָר
  choice: à Lo-Debar
  rationale: Il s’agit d’un nom de lieu. En français, « à Lo-Debar » situe naturellement la maison de Makir; le second מִן hébreu marque l’origine, mais répéter « de » serait maladroit après « chez ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La formulation privilégie une équivalence optimale : elle rend idiomatiquement la séquence hébraïque « envoya » + « prit » et emploie « chez » pour préserver l’ambiguïté de בַּיִת entre maison et foyer. Le marqueur de note est placé immédiatement après le verset.'
