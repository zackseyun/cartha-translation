base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: fr
  text: 'La maison de Saül avait un serviteur nommé Tsiba. On le fit venir auprès de David. Le roi lui demanda : « Es-tu Tsiba ? » Il répondit : « Ton serviteur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « Je suis ton serviteur. » La réponse hébraïque est elliptique : « Ton serviteur. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבֵית שָׁאוּל עֶבֶד
  choice: La maison de Saül avait un serviteur
  rationale: La construction prépositionnelle exprime ici la possession ou l’appartenance. Cette formulation est naturelle en français et rend עֶבֶד par « serviteur », terme adapté à un homme attaché à la maison de Saül sans préciser davantage son statut juridique.
- source_word: וּשְׁמוֹ צִיבָא
  choice: nommé Tsiba
  rationale: Formulation française concise et idiomatique qui conserve la fonction d’identification du tour hébreu « et son nom était Tsiba ».
- source_word: וַיִּקְרְאוּ לוֹ אֶל־דָּוִד
  choice: On le fit venir auprès de David
  rationale: Le verbe קרא dans cette construction indique qu’on convoque quelqu’un en présence de David. Le sujet pluriel indéfini est naturellement rendu par « on ».
- source_word: הַאַתָּה צִיבָא
  choice: Est-ce bien toi, Tsiba ?
  rationale: Le pronom explicite donne à la question une nuance de vérification ou d’identification, que « bien » restitue naturellement.
- source_word: עַבְדֶּךָ
  choice: Ton serviteur
  rationale: La réponse hébraïque est elliptique et déférente. L’ellipse est conservée en français plutôt que complétée silencieusement par « Je suis ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le récit reste fluide, tandis que la réponse finale conserve la brièveté et la déférence de l’hébreu.
