base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: fr
  text: 'David lui dit : « N’aie pas peur, car je ferai assurément preuve de bonté[a] envers toi en raison de Jonathan, ton père. Je te rendrai toutes les terres de Saül, ton grand-père[b], et tu mangeras toujours à ma table[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un amour fidèle », « d’une bonté fidèle » ou « d’une loyauté d’alliance ». Le mot hébreu ḥésed exprime ici une bienveillance fidèle fondée sur un engagement relationnel.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Saül, ton père ». En hébreu, « père » peut aussi désigner un ancêtre ; Saül était le grand-père de Mephibosheth.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « tu mangeras toujours du pain à ma table », expression évoquant des repas et une prise en charge durables, ainsi que la communion de table.'
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Formulation directe, naturelle et actuelle de l’impératif négatif, qui conserve la valeur rassurante de l’hébreu.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: car je te témoignerai assurément
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’affirmation; « assurément » restitue cette insistance sans calque maladroit.
- source_word: חֶסֶד
  choice: bonté
  rationale: Dans ce contexte, le mot désigne une bienveillance fidèle qui se concrétise envers Mephibosheth en raison de Jonathan. « Bonté » est naturel dans le récit, tandis qu’une note conserve les nuances de fidélité et de loyauté.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: à cause de Jonathan, ton père
  rationale: « À cause de » exprime clairement le motif relationnel de l’action de David, sans ajouter une interprétation absente du texte.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: Je te rendrai
  rationale: Le hiphil de שוב exprime ici la restitution d’un bien; « rendre » est précis et idiomatique en français.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: toutes les terres de Saül
  rationale: Le singulier שָׂדֶה peut avoir un sens collectif et désigner le domaine foncier; le pluriel français « terres » communique naturellement cette portée.
- source_word: שָׁאוּל אָבִיךָ
  choice: Saül, ton grand-père
  rationale: אָב peut désigner un ancêtre. Puisque Mephibosheth est le fils de Jonathan, Saül est ici son grand-père; la note signale la formulation littérale afin de préserver l’information linguistique.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: tu mangeras toujours à ma table
  rationale: « Manger à ma table » rend naturellement l’expression hébraïque « manger du pain à ma table » et évoque les repas, la provision durable et la communion de table.
theological_decisions:
- issue: Nuance relationnelle et conventionnelle de חֶסֶד
  choice: bonté dans le texte, avec les nuances « amour fidèle », « bonté fidèle » et « loyauté d’alliance » en note
  alternative: amour fidèle / bonté fidèle / loyauté d’alliance
  rationale: La bonté de David découle de son engagement envers Jonathan. Le choix principal reste accessible sans effacer la richesse relationnelle du terme, explicitée en note.
- issue: Sens généalogique de אָב appliqué à Saül
  choice: grand-père
  alternative: père
  rationale: Le contexte généalogique établit que Saül est le grand-père de Mephibosheth. Cette précision évite une contradiction apparente, tandis que la note préserve le sens littéral et l’amplitude sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, digne et narratif. Le tutoiement correspond au discours direct singulier. La formulation évite les archaïsmes, conserve l’intensité de la promesse et rend explicitement la relation généalogique sans masquer la lettre hébraïque, documentée en note.
