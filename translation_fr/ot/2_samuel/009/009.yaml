source:
  edition: WLC
  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: fr
  text: 'Alors le roi appela Tsiba, serviteur de Saül[a], et lui dit : « Tout ce qui appartenait à Saül et à toute sa maison[b], je l’ai donné au fils de ton maître[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jeune homme de Saül » ou « homme attaché au service de Saül » ; ici, נַעַר désigne probablement un serviteur ou un homme de la maison.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à toute sa maison » ; l’expression peut désigner la maisonnée de Saül et l’ensemble des biens qui lui étaient rattachés.
    reason: lexical_alternative
  - marker: c
    text: Le « fils de ton maître » est Mephibosheth. Il était le fils de Jonathan et donc le petit-fils de Saül ; en hébreu, « fils » peut aussi désigner un descendant.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: serviteur
  rationale: Dans ce contexte de maison royale, le terme désigne vraisemblablement la fonction de Tsiba comme serviteur ou homme attaché à la maison de Saül, plutôt que son âge.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: Tout ce qui appartenait à Saül
  rationale: La tournure hébraïque exprime la possession ; cette formulation est claire et naturelle en français moderne.
- source_word: וּלְכָל בֵּיתוֹ
  choice: et à toute sa maison
  rationale: « Maison » conserve l’étendue sémantique de בַּיִת, qui peut englober la famille, la maisonnée et les biens qui lui sont rattachés.
- source_word: נָתַתִּי
  choice: je l’ai donné
  rationale: Le passé composé présente le don comme un acte accompli dont les effets demeurent au moment où David parle.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: au fils de ton maître
  rationale: La formulation reste proche de l’hébreu ; « maître » désigne ici le supérieur de Tsiba et « fils » peut avoir le sens plus large de descendant.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: Alors le roi appela… et lui dit
  rationale: « Alors » rend la progression narrative, tandis que « lui dit » exprime naturellement en français le complément indirect hébreu.
theological_decisions:
- issue: Identification du « fils de ton maître »
  choice: Maintien de l’expression littérale dans le texte, avec une note identifiant Mephibosheth
  alternative: Remplacer directement par « Mephibosheth » ou « le descendant de ton maître »
  rationale: L’hébreu dit « fils » et laisse l’identification dépendre du contexte narratif ; la traduction préserve cette formulation sans masquer que Mephibosheth est le petit-fils de Saül.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme narratif est fluide, tout en conservant les expressions « toute sa maison » et « fils de ton maître », dont la portée est précisée en notes.
