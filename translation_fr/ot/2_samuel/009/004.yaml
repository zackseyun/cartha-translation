  yaml_path: translation/ot/2_samuel/009/004.yaml
  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: fr
  text: 'Le roi lui demanda : « Où est-il ? » Tsiba répondit au roi : « Le voici dans la maison de Makir, fils d’Ammiel, à Lo-Debar. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: demanda / répondit
  rationale: Le verbe hébreu signifie littéralement « dit », mais le contexte interrogatif puis la réplique rendent naturellement les valeurs « demanda » et « répondit » en français.
- source_word: הִנֵּה
  choice: Il est
  rationale: La particule présentative attire l’attention sur l’information donnée. Dans ce dialogue, une formulation directe est plus naturelle que « Voici » ou « Regarde », sans modifier le contenu.
- source_word: בֵּית מָכִיר
  choice: dans la maison de Makir
  rationale: Rend directement la construction hébraïque et peut désigner le domicile ou la maisonnée de Makir.
- source_word: בְּלוֹ דְבָר
  choice: à Lo-Debar
  rationale: Translittération moderne du nom de lieu, avec la préposition française appropriée.
