  yaml_path: translation/ot/2_samuel/009/008.yaml
  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: fr
  text: 'Il se prosterna et dit : « Qu’est-ce que ton serviteur, pour que tu te sois tourné vers[a] un chien mort comme moi[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « te tourner vers » ; l’expression peut aussi signifier « prêter attention à » ou « considérer » et évoque ici une attention bienveillante.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « un chien mort » marque ici un abaissement extrême : le locuteur se présente comme quelqu’un de tout à fait insignifiant et indigne d’attention.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: Il se prosterna
  rationale: Le verbe שׁחה à cette forme désigne un geste physique d’abaissement respectueux. « Se prosterner » exprime clairement ce geste sans en faire nécessairement un acte d’adoration.
- source_word: מֶה עַבְדֶּךָ
  choice: Qu’est ton serviteur
  rationale: Cette formulation conserve l’interrogation littérale et l’extrême humilité de l’hébreu. « Serviteur » convient à l’autodésignation respectueuse dans un contexte royal, sans insister indûment sur un statut d’esclave.
- source_word: כִּי
  choice: pour que
  rationale: 'Dans cette question rhétorique, כִּי introduit ce qui motive l’étonnement : « Qu’est ton serviteur, pour que… ? » Cette tournure est naturelle en français et maintient le lien syntaxique.'
- source_word: פָנִיתָ אֶל
  choice: tu te sois tourné vers
  rationale: Le choix préserve l’image concrète de l’hébreu, tout en laissant entendre l’attention bienveillante accordée par le roi.
- source_word: הַכֶּלֶב הַמֵּת
  choice: un chien mort
  rationale: L’expression traduit l’image hébraïque d’un être tenu pour totalement insignifiant et méprisable. L’article hébreu se rend naturellement ici par l’indéfini français.
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: comme moi
  rationale: La formule relie directement l’image du « chien mort » au locuteur et conserve la force de son abaissement volontaire.
