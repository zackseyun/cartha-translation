base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: fr
  text: Mephibosheth avait un jeune fils, qui s’appelait Mica. Tous ceux qui vivaient dans la maison de Tsiba[a] étaient les serviteurs[b] de Mephibosheth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute la maisonnée de Tsiba ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « serviteurs » peut aussi signifier « esclaves », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: Mefibosheth avait
  rationale: La construction hébraïque avec ל exprime ici la possession (« à Mefibosheth était… »). « Mefibosheth avait » est son équivalent idiomatique naturel en français.
- source_word: בֵּן קָטָן
  choice: un jeune fils
  rationale: קָטָן décrit ici le jeune âge ou la petitesse de l’enfant. « Un jeune fils » est clair et naturel sans suggérer seulement sa taille.
- source_word: וּ/שְׁמ֣/וֹ מִיכָא
  choice: qui s’appelait Mika
  rationale: Cette formulation française rend naturellement l’identification du fils, littéralement « et son nom était Mika », sans en modifier le sens.
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: Tous ceux qui vivaient dans la maison de Tsiba
  rationale: מוֹשַׁב renvoie ici collectivement aux personnes qui demeuraient dans la maison de Tsiba. La formulation explicite ce référent humain tout en conservant l’image de l’habitation.
- source_word: עֲבָדִים
  choice: serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs ou des esclaves. Dans ce contexte d’organisation domestique et de service, « serviteurs » convient au texte principal, tandis qu’une note préserve l’autre possibilité lexicale.
- source_word: לִ/מְפִיבֹשֶׁת
  choice: de Mefibosheth
  rationale: Après « les serviteurs », le français emploie naturellement « de » pour exprimer la relation de service marquée en hébreu par ל, sans préciser davantage le statut juridique.
