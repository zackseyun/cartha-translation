  text: וַ/יֹּ֣אמֶר הַ/מֶּ֗לֶךְ הַ/אֶ֨פֶס ע֥וֹד אִישׁ֙ לְ/בֵ֣ית שָׁא֔וּל וְ/אֶעֱשֶׂ֥ה עִמּ֖/וֹ חֶ֣סֶד אֱלֹהִ֑ים וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ ע֛וֹד בֵּ֥ן לִ/יהוֹנָתָ֖ן נְכֵ֥ה רַגְלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: fr
  text: 'Le roi dit : « Reste-t-il encore quelqu’un de la maison de Saül, afin que je lui témoigne la bonté de Dieu[a] ? » Tsiba répondit au roi : « Il reste encore un fils de Jonathan, atteint d’une infirmité aux deux pieds[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fidélité bienveillante de Dieu » ou « une bonté digne de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « boiteux des deux pieds ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: Reste-t-il encore quelqu’un
  rationale: Cette formulation rend la question idiomatique portant sur l’existence éventuelle d’un survivant, sans introduire en français l’ambiguïté d’une double négation.
- source_word: לְבֵית שָׁאוּל
  choice: de la maison de Saül
  rationale: « Maison » conserve ici le sens familial et dynastique du terme hébreu.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: afin que je lui témoigne
  rationale: Avec חֶסֶד, « témoigner » exprime naturellement en français l’action bienveillante envisagée, tandis que « afin que » rend la nuance volitive.
- source_word: חֶסֶד אֱלֹהִים
  choice: la bonté de Dieu
  rationale: Cette traduction conserve le génitif hébreu et la portée ouverte de חֶסֶד, qui peut évoquer bonté, attachement fidèle et loyauté d’alliance.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: Il reste encore un fils de Jonathan
  rationale: La formulation maintient l’accent hébreu sur la présence d’un descendant survivant.
- source_word: נְכֵה רַגְלָיִם
  choice: atteint d’une infirmité aux deux pieds
  rationale: Expression actuelle, claire et respectueuse désignant une déficience physique affectant la mobilité; « deux » explicite ici le pluriel hébreu naturel.
theological_decisions:
- issue: Portée de חֶסֶד אֱלֹהִים
  choice: la bonté de Dieu
  alternative: la fidélité bienveillante de Dieu; une bonté digne de Dieu
  rationale: Le génitif peut désigner une bonté venant de Dieu, caractéristique de Dieu ou d’une qualité exceptionnelle. Le texte principal préserve cette amplitude sans imposer une lecture confessionnelle plus étroite; la note signale la nuance de fidélité loyale.
translation_notes:
  register: Français international moderne, naturel et digne. « Tsiba » suit une translittération française courante. La description du handicap évite un terme aujourd’hui souvent perçu comme péjoratif tout en gardant le sens physique précis du texte.
