  text: וַ֠/יָּבֹא מְפִיבֹ֨שֶׁת בֶּן יְהוֹנָתָ֤ן בֶּן שָׁאוּל֙ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו וַ/יִּשְׁתָּ֑חוּ וַ/יֹּ֤אמֶר דָּוִד֙ מְפִיבֹ֔שֶׁת וַ/יֹּ֖אמֶר הִנֵּ֥ה עַבְדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: fr
  text: 'Mefibosheth, fils de Jonathan et petit-fils de Saül, vint auprès de David. Il tomba face contre terre et se prosterna. David dit : « Mefibosheth ! » Il répondit : « Me voici, ton serviteur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: fils de Jonathan et petit-fils de Saül
  rationale: Le second בֶּן exprime ici la filiation sur deux générations. « Petit-fils » rend naturellement et sans ambiguïté la relation en français.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: Il tomba face contre terre
  rationale: Cette expression française naturelle restitue l’idée de tomber sur son visage, dans une posture d’abaissement.
- source_word: וַיִּשְׁתָּחוּ
  choice: et se prosterna
  rationale: Le verbe désigne l’acte de s’incliner profondément ou de se prosterner devant un supérieur.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: Me voici, ton serviteur
  rationale: Dans cette réponse de disponibilité et de déférence, הִנֵּה se rend idiomatiquement par « Me voici »; le tutoiement correspond à l’adresse directe singulière de l’hébreu.
theological_decisions:
- issue: Nature de la prosternation devant David
  choice: se prosterna
  alternative: adora
  rationale: Le contexte décrit l’hommage rendu à un roi humain. « Se prosterner » conserve le geste sans lui attribuer nécessairement le sens cultuel que pourrait suggérer « adorer ».
translation_notes:
  register: Français moderne, digne et narratif. Le nom est transcrit « Mefibosheth », forme courante dans de nombreuses Bibles françaises. La coordination a été légèrement structurée en trois phrases pour une lecture naturelle, sans perte de contenu.
