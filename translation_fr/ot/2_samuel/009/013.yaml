  text: וּ/מְפִיבֹ֗שֶׁת יֹשֵׁב֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֣י עַל שֻׁלְחַ֥ן הַ/מֶּ֛לֶךְ תָּמִ֖יד ה֣וּא אֹכֵ֑ל וְ/ה֥וּא פִסֵּ֖חַ שְׁתֵּ֥י רַגְלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: fr
  text: Mephibosheth habitait à Jérusalem, car il mangeait constamment à la table du roi. Il était boiteux des deux pieds.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: habitait
  rationale: Avec un nom de ville, le participe de ישׁב désigne ici le fait de résider. « Habitait » est naturel en français narratif et conserve l’aspect duratif.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de la résidence de Mephibosheth à Jérusalem. « Car » exprime clairement ce lien causal sans alourdir la phrase.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: la table du roi
  rationale: Cette formulation française naturelle conserve l’image hébraïque de la table royale, avec ses connotations de provision et d’accueil.
- source_word: תָּמִיד
  choice: constamment
  rationale: Le terme exprime ici une pratique régulière et continue. « Constamment » rend cette continuité sans suggérer qu’il mangeait littéralement à tout instant.
- source_word: אֹכֵל
  choice: mangeait
  rationale: Le participe indique une action habituelle; l’imparfait français convient naturellement à cette valeur itérative dans un récit au passé.
- source_word: פִסֵּחַ
  choice: boiteux
  rationale: L’adjectif désigne une personne atteinte de claudication. « Boiteux » est l’équivalent direct et reste moins interprétatif que des formulations générales sur le handicap.
- source_word: שְׁתֵּי רַגְלָיו
  choice: des deux pieds
  rationale: La formulation respecte la mention précise des « deux pieds » dans l’hébreu tout en étant idiomatique en français.
- source_word: וְהוּא
  choice: Il était
  rationale: La proposition ajoute une description récapitulative. Deux phrases assurent un enchaînement français fluide sans donner au waw une valeur temporelle absente du texte.
