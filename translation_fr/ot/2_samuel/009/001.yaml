  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: fr
  text: 'David dit : « Reste-t-il encore quelqu’un de la famille de Saül à qui je puisse témoigner de la bonté[a], par égard pour Jonathan ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « amour loyal », « bonté fidèle » ou « loyauté fidèle » ; le mot hébreu désigne souvent une bonté marquée par la fidélité et la loyauté, et non un simple sentiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe אמר est le verbe narratif courant pour introduire une parole. Même si la parole qui suit est une question, « dit » traduit formellement et naturellement l’hébreu.
- source_word: הֲכִי יֶשׁ עוֹד
  choice: Reste-t-il encore quelqu’un
  rationale: La tournure interrogative associée à יֶשׁ עוֹד demande si quelqu’un subsiste encore. Cette formulation est idiomatique en français et prépare naturellement le complément familial.
- source_word: אֲשֶׁר נוֹתַר לְבֵית שָׁאוּל
  choice: de la famille de Saül
  rationale: בית désigne ici la maison au sens de famille ou lignée, et נותר celui qui en reste. « Quelqu’un de la famille de Saül » restitue clairement l’idée sans suggérer un bâtiment.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: envers qui je puisse agir avec bonté
  rationale: עשה avec חסד forme une expression signifiant exercer ou témoigner de la bonté. « Agir avec bonté envers » conserve l’idée d’une action concrète et la nuance de visée portée par la proposition.
- source_word: חֶסֶד
  choice: bonté
  rationale: Dans ce contexte relationnel, « bonté » est clair et naturel. Le terme hébreu peut aussi exprimer un amour loyal et une fidélité liée à un engagement, nuance conservée en note.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: à cause de Jonathan
  rationale: בַּעֲבוּר indique le motif ou la considération qui fonde l’action. « À cause de Jonathan » est direct et naturel, sans exclure l’idée que David agit par égard pour lui.
theological_decisions:
- issue: Portée de חֶסֶד dans l’action projetée par David envers la famille de Saül
  choice: Traduire par « bonté » dans le texte et signaler en note la dimension de loyauté fidèle
  alternative: « amour loyal », « amour fidèle » ou « fidélité à l’alliance »
  rationale: Le contexte présente une faveur concrète motivée par Jonathan et probablement liée à l’engagement de David envers lui. « Bonté » reste naturelle sans réduire explicitement le terme à une catégorie théologique, tandis que la note préserve sa richesse relationnelle et possiblement conventionnelle.
translation_notes:
  register: Français moderne, international et digne. « Famille de Saül » rend le sens familial et dynastique de « maison » de façon immédiatement compréhensible. La structure interrogative demeure fluide à l’oral comme à l’écrit.
