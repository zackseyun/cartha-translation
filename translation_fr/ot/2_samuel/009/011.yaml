source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ כְּ/כֹל֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ אֶת עַבְדּ֔/וֹ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וּ/מְפִיבֹ֗שֶׁת אֹכֵל֙ עַל שֻׁלְחָנִ֔/י כְּ/אַחַ֖ד מִ/בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: fr
  text: 'Tsiba dit au roi : « Ton serviteur fera tout ce que mon seigneur le roi lui ordonnera. » Et Mefibosheth mangeait à ma table[a], comme l’un des fils du roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ma table ». Le texte hébreu passe ici à la première personne, vraisemblablement selon la perspective de David. Certaines versions ont : « à la table du roi ».'
    reason: La formulation du texte massorétique crée un changement de personne abrupt; la note préserve à la fois la forme hébraïque et l’autre compréhension courante.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Formule narrative usuelle introduisant les paroles de Tsiba.
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: tout ce que … ordonnera
  rationale: Rend la totalité exprimée par כְּכֹל אֲשֶׁר et la valeur prospective de l’imparfait dans cette promesse d’obéissance.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Conserve la formule respectueuse propre au langage de cour, dans un français digne et naturel.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: lui / ton serviteur
  rationale: « Serviteur » convient ici à l’autodésignation de cour. Le pronom « lui » évite en français la répétition lourde de « son serviteur » sans modifier le référent.
- source_word: כֵּן יַעֲשֶׂה
  choice: fera
  rationale: 'La formulation française intègre naturellement la corrélation hébraïque dans la promesse : « fera tout ce que… ».'
- source_word: אֹכֵל
  choice: mangeait
  rationale: L’imparfait français exprime bien l’état ou la pratique durable indiquée par le participe hébreu.
- source_word: עַל שֻׁלְחָנִי
  choice: à ma table
  rationale: Conserve le suffixe de première personne du texte massorétique, malgré le changement de perspective difficile.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: comme l’un des fils du roi
  rationale: Reproduit clairement la comparaison et le statut accordé à Mefibosheth.
theological_decisions:
- issue: Identité du locuteur dans « à ma table »
  choice: 'Maintenir la première personne : « à ma table »'
  alternative: « à la table du roi »
  rationale: Le texte massorétique porte explicitement שֻׁלְחָנִי, « ma table ». La traduction préserve ce changement de perspective au lieu de le résoudre silencieusement; une note signale la difficulté.
translation_notes:
  register: Français international moderne, narratif et digne. « Tsiba » et « Mefibosheth » suivent des translittérations françaises usuelles. La déclaration de Tsiba est restructurée légèrement pour éviter un calque pesant, tout en conservant sa déférence et sa promesse intégrale d’obéissance.
