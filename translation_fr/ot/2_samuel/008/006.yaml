source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: fr
  text: David établit des garnisons dans l’Aram de Damas[a]. Aram passa au service de David et lui apporta un tribut[b]. Yahweh donna la victoire à David partout où il alla[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la Syrie de Damas ». Le nom hébreu est « Aram » ; cette traduction le conserve au lieu de lui substituer le nom traditionnel « Syrie ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Aram devint pour David des serviteurs, porteurs d’un présent ». Le mot hébreu peut désigner un présent, une offrande ou un tribut ; ici, il s’agit probablement du paiement imposé à un peuple vassal.'
    reason: lexical_alternative
  - marker: c
    text: Ou « Yahweh sauva (ou délivra) David partout où il alla ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: établit
  rationale: Dans ce contexte militaire et administratif, שׂים signifie mettre ou placer. « Établit » exprime naturellement en français l’installation durable de garnisons.
- source_word: נְצִבִים
  choice: des garnisons
  rationale: Le terme peut désigner des postes, des responsables ou des troupes stationnées. Le contexte de conquête favorise le sens militaire « garnisons ».
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: dans l’Aram de Damas
  rationale: « Aram » conserve le nom ethnogéographique hébreu, tandis que le complément « de Damas » identifie le royaume araméen centré sur cette ville.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: Aram passa au service de David
  rationale: La tournure française rend la soumission politique exprimée par le pluriel עֲבָדִים sans suggérer à tort que le territoire lui-même serait plusieurs serviteurs individuels.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: lui apporta un tribut
  rationale: מִנְחָה peut désigner un don, une offrande ou un tribut. Dans une relation de vassalité entre peuples, « tribut » est le sens contextuel le plus probable.
- source_word: וַיֹּשַׁע
  choice: donna la victoire
  rationale: Le hiphil de ישׁע décrit ici l’intervention salvatrice de Dieu dans les campagnes militaires de David. « Donna la victoire » communique clairement ce sens contextuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: partout où il alla
  rationale: Cette expression idiomatique indique que l’aide divine accompagnait David dans toutes ses entreprises, sans limiter explicitement le propos à ses marches militaires.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le conserve comme nom propre au lieu de le remplacer par un titre traditionnel.
- issue: Sens de עֲבָדִים dans un contexte de vassalité politique
  choice: passa au service de David
  alternative: devint soumis à David / devint serviteur de David
  rationale: Le contexte décrit la sujétion d’un royaume qui paie tribut. La formulation retenue maintient l’idée de service tout en restant naturelle avec le sujet collectif « Aram ».
- issue: Portée salvatrice de וַיֹּשַׁע
  choice: donna la victoire à David
  alternative: sauva / délivra David
  rationale: Le contexte immédiat est militaire, ce qui rend « donna la victoire » précis et naturel. Une note conserve toutefois les sens plus généraux du verbe afin de ne pas masquer sa portée lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases sont légèrement segmentées pour la lisibilité. Le nom « Aram » et le nom divin « Yahweh » sont conservés, tandis que les notes signalent les équivalents traditionnels et les principales ambiguïtés lexicales.
