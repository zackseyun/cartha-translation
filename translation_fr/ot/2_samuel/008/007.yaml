  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: fr
  text: David prit les boucliers d’or qui appartenaient aux serviteurs de Hadadézer et les apporta à Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les boucliers en or ». Selon une interprétation minoritaire, le terme peut désigner des « carquois ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Dans le récit, לקח signifie couramment « prendre ». « Prit » reste naturel et suffisamment large sans ajouter explicitement l’idée plus forte de saisie violente.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: les boucliers d’or
  rationale: Le terme שׁלטים désigne traditionnellement ici des boucliers ou des pièces d’armure défensive, ce qui convient au contexte de butin militaire. La construction « boucliers d’or » reproduit de près le groupe construit hébreu; « carquois » demeure une proposition lexicale minoritaire.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: qui appartenaient à
  rationale: Dans ce contexte, la tournure exprime vraisemblablement la possession ou l’association plutôt qu’une simple localisation.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: les serviteurs de Hadadézer
  rationale: עבדים peut désigner des serviteurs, des fonctionnaires ou des esclaves. Ici, « serviteurs » conserve une portée assez large et convient à des hommes au service du roi.
- source_word: וַיְבִיאֵם
  choice: et les apporta
  rationale: Au hiphil, בוא signifie couramment « apporter » ou « amener ». Le pronom « les » renvoie aux boucliers, objets inanimés.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
