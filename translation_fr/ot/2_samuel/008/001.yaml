base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: fr
  text: Après cela, David battit les Philistins et les soumit. David prit Metheg-Amma[a] aux mains des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression hébraïque difficile, littéralement « le mors de la ville mère ». Elle pourrait désigner de manière imagée le contrôle de la ville principale. En 1 Chroniques 18.1, le passage parallèle parle de « Gath et des localités qui en dépendent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette formulation naturelle marque la succession narrative sans reproduire inutilement le tour hébreu « et il arriva ».
- source_word: וַיַּךְ
  choice: battit
  rationale: Dans ce contexte militaire, נכה désigne une attaque victorieuse. « Battit » garde la force du verbe et évite de faire double emploi avec « soumit ».
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française usuelle de ce peuple.
- source_word: וַיַּכְנִיעֵם
  choice: les soumit
  rationale: Le hifil de כנע exprime ici la mise en sujétion militaire et politique.
- source_word: וַיִּקַּח ... מִיַּד
  choice: leur arracha
  rationale: L’expression combine « prendre » et « de la main de », image hébraïque du pouvoir ou de la possession. « Leur arracha » en restitue naturellement le sens dynamique en français.
- source_word: מֶתֶג הָאַמָּה
  choice: Metheg-Amma
  rationale: L’expression est obscure et peut fonctionner comme un nom propre ou comme une image signifiant littéralement « le mors de la ville mère ». La translittération évite de trancher silencieusement entre des interprétations incertaines; la note expose les principales possibilités.
