  text: וַ/יִּשְׁמַ֕ע תֹּ֖עִי מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔ד אֵ֖ת כָּל חֵ֥יל הֲדַדְעָֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/009.yaml
  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: fr
  text: Lorsque Toï, roi de Hamath, apprit que David avait défait toute l’armée de Hadadézer,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le passage parallèle de 1 Chroniques 18.9, le nom du roi est Toû. Le texte hébreu de ce verset porte Toï.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Dans ce récit, le verbe שׁמע indique que Toï reçoit une nouvelle. « Apprit » est plus naturel ici en français que le littéral « entendit », sans ajouter d’interprétation.
- source_word: תֹּעִי
  choice: Toï
  rationale: Le texte massorétique de ce verset porte la forme Toï. Le tréma rend clairement la séparation des voyelles en français; la forme parallèle Toû est signalée en note.
- source_word: מֶלֶךְ חֲמָת
  choice: roi de Hamath
  rationale: Traduction directe de la chaîne construite qui indique la fonction royale de Toï et son royaume.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de la nouvelle apprise par Toï, et non la cause de son action.
- source_word: הִכָּה
  choice: avait défait
  rationale: Dans ce contexte militaire, נכה décrit la mise en déroute ou la défaite infligée à une armée. « Avait défait » conserve la force militaire du verbe tout en restant idiomatique en français; le plus littéral « avait frappé » serait maladroit avec « armée ».
- source_word: אֵת כָּל חֵיל
  choice: toute l’armée
  rationale: חַיִל désigne ici l’ensemble des forces militaires. « Toute l’armée » est clair, actuel et respecte la valeur collective de l’expression.
- source_word: הֲדַדְעָזֶר
  choice: Hadadézer
  rationale: Transcription française usuelle du nom propre, avec un accent qui guide naturellement la prononciation.
