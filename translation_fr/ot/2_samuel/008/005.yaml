base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: fr
  text: Les Araméens de Damas[a] vinrent aider Hadadézer[b], roi de Tsoba, et David abattit vingt-deux mille hommes araméens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « Aram de Damas ». Aram désigne ici le peuple ou le royaume araméen centré sur Damas, et non la Syrie au sens moderne.
    reason: lexical_alternative
  - marker: b
    text: Le nom Hadadézer apparaît aussi sous la forme Hadarézer dans certains passages et certaines traductions.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: vinrent
  rationale: Le wayyiqtol de בוא poursuit le récit. Le pluriel français s’accorde avec « les Araméens », explicitation naturelle du nom collectif אֲרַם.
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: les Araméens de Damas
  rationale: אֲרַם désigne ici le peuple ou le royaume araméen centré sur Damas. Cette formulation est plus naturelle en français que « Aram de Damas » et évite l’anachronisme possible de « Syrie ».
- source_word: לַעְזֹר
  choice: aider
  rationale: עזר signifie directement « aider, secourir » ; « aider » est clair et courant.
- source_word: לַהֲדַדְעֶזֶר
  choice: Hadadézer
  rationale: Transcription française du nom tel qu’il apparaît dans le texte hébreu de ce verset ; la variante Hadarézer est signalée en note.
- source_word: מֶלֶךְ צוֹבָה
  choice: roi de Tsoba
  rationale: Le groupe construit hébreu est rendu directement par le titre en apposition. « Tsoba » suit une transcription française transparente.
- source_word: וַיַּךְ
  choice: abattit
  rationale: Dans ce contexte militaire, נכה exprime une frappe entraînant la mort. « Abattit » conserve cette force sans réduire le verbe au sens plus général de « vainquit ».
- source_word: בַּאֲרָם
  choice: parmi les Araméens
  rationale: Avec נכה et le dénombrement d’hommes qui suit, בְּ désigne le groupe au sein duquel David frappe. « Parmi les Araméens » est idiomatique et garde le lien avec אֲרַם.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: vingt-deux mille hommes
  rationale: Le texte comporte explicitement אִישׁ, « homme ». Le contexte est militaire, mais « soldats » serait une précision interprétative absente du syntagme.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Les Araméens de Damas » privilégie l’intelligibilité sans remplacer le nom ancien par « Syriens ». « Abattit » rend la violence du contexte militaire, tandis que « hommes » respecte l’expression explicite du texte hébreu.
