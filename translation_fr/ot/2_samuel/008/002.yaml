  text: וַ/יַּ֣ךְ אֶת מוֹאָ֗ב וַֽ/יְמַדְּדֵ֤/ם בַּ/חֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣/ם אַ֔רְצָ/ה וַ/יְמַדֵּ֤ד שְׁנֵֽי חֲבָלִים֙ לְ/הָמִ֔ית וּ/מְלֹ֥א הַ/חֶ֖בֶל לְ/הַחֲי֑וֹת וַ/תְּהִ֤י מוֹאָב֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נֹשְׂאֵ֥י מִנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: fr
  text: Il frappa Moab et mesura les Moabites au cordeau[a], après les avoir fait étendre à terre. Il mesura deux longueurs de cordeau pour les mettre à mort, et une longueur entière de cordeau pour les laisser vivre[b]. Ainsi, les Moabites devinrent les serviteurs de David et lui apportèrent un tribut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une corde » ou « avec une corde à mesurer » .
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu décrit David mesurant les Moabites étendus à terre : deux portions mesurées sont destinées à la mise à mort, et une portion entière à la survie. Le texte implique ainsi que certains furent exécutés et d’autres épargnés.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: Il frappa
  rationale: Le verbe נכה signifie couramment « frapper ». Ce choix conserve l’action militaire concrète sans expliciter davantage que l’hébreu l’idée de défaite.
- source_word: מוֹאָב
  choice: Moab / les Moabites
  rationale: « Moab » désigne d’abord le peuple comme entité collective ; « les Moabites » rend ensuite naturellement en français le suffixe pluriel et les personnes couchées au sol.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: mesura les Moabites avec un cordeau
  rationale: Le piel de מדד signifie « mesurer », et חבל désigne ici une corde servant à mesurer. « Cordeau » exprime clairement cette fonction instrumentale.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: après les avoir fait coucher par terre
  rationale: La tournure causative indique que les captifs furent couchés au sol pour l’opération de mesure. Cette formulation est naturelle et garde le caractère concret de la scène.
- source_word: וַיְמַדֵּד שְׁנֵי חֲבָלִים
  choice: Il mesura deux longueurs de cordeau
  rationale: La formulation évoque deux portions déterminées au moyen du cordeau, sans imposer l’idée de deux cordes matérielles distinctes.
- source_word: לְהָמִית
  choice: pour la mort
  rationale: Cette formulation brève préserve la rudesse de l’hébreu et présente la destination des deux portions sans atténuer l’exécution impliquée.
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: et une pleine longueur de cordeau pour laisser en vie
  rationale: מְלֹא indique une mesure complète sans numeral exprimé ; le hiphil de חיה signifie « laisser en vie » ou « maintenir en vie ».
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: les Moabites devinrent les serviteurs de David
  rationale: Le passage décrit une soumission politique. « Serviteurs » reste proche de עֲבָדִים sans surinterpréter la relation comme un esclavage individuel.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: lui apportèrent un tribut
  rationale: Dans ce contexte royal et politique, מִנְחָה désigne un tribut plutôt qu’une offrande cultuelle.
theological_decisions:
- issue: Nature du traitement infligé aux Moabites dans la scène de mesure
  choice: Conserver concrètement la mesure au cordeau et l’affectation à la mort ou à la vie.
  alternative: Comprendre le cordeau comme une simple image de la soumission, ou préciser directement que deux tiers furent exécutés et un tiers épargné.
  rationale: L’hébreu décrit une procédure concrète et brutale. La traduction n’en atténue pas la violence, mais ne transforme pas non plus en fractions explicites ce que le texte exprime au moyen de longueurs de cordeau.
translation_notes:
  register: Français international moderne, digne et direct. Le mot « cordeau » est courant dans le sens d’une corde servant à tracer ou mesurer. La syntaxe garde la sobriété et la dureté du récit hébreu sans ajouter d’évaluation morale ni de précision arithmétique absente du texte.
