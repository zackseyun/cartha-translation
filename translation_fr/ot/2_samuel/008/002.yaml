  naturalness: « Au cordeau » et « les avoir fait étendre à terre » sont plus idiomatiques et sobres dans un français moderne de registre biblique que « avec un cordeau » et « fait coucher par terre ».
  terminology: « Moab », « Moabites », « cordeau », « serviteurs » et « tribut » conviennent. « Cordeau » désigne bien une corde ou ligne de mesure dans ce contexte.
