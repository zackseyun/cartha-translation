  text: וַ/יַּ֤עַשׂ דָּוִד֙ שֵׁ֔ם בְּ/שֻׁב֕/וֹ מֵ/הַכּוֹת֥/וֹ אֶת אֲרָ֖ם בְּ/גֵיא מֶ֑לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/013.yaml
  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: fr
  text: 'David se fit un nom à son retour, après avoir battu Aram dans la vallée du Sel : dix-huit mille hommes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins ainsi que le passage parallèle en 1 Chroniques 18.12 indiquent « Édom » plutôt qu’« Aram ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִד שֵׁם
  choice: David se fit un nom
  rationale: L’expression française « se faire un nom » restitue naturellement l’idiome hébreu « faire un nom », au sens d’acquérir une grande renommée, tout en en conservant l’image.
- source_word: בְּשֻׁבוֹ
  choice: à son retour
  rationale: La préposition avec l’infinitif construit et son suffixe a ici une valeur temporelle. « À son retour » est concis, naturel et adapté au récit.
- source_word: מֵהַכּוֹתוֹ
  choice: après avoir battu
  rationale: La construction indique l’action après laquelle David revint. « Battu » rend נכה dans son sens militaire sans imposer que les dix-huit mille aient tous été tués.
- source_word: אֶת אֲרָם
  choice: Aram
  rationale: Le texte massorétique fourni nomme Aram. La translittération évite l’anachronisme potentiel de « Syrie » et respecte la forme du texte source.
- source_word: בְּגֵיא מֶלַח
  choice: dans la vallée du Sel
  rationale: Cette formulation rend directement la préposition ב et le nom géographique, dans un français naturel.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: dix-huit mille hommes
  rationale: L’hébreu ne précise pas le nom compté. « Hommes » explicite sobrement les combattants sous-entendus par le contexte militaire, sans ajouter « tués ».
theological_decisions:
- issue: Identité de l’ennemi vaincu
  choice: Aram dans le texte principal
  alternative: Édom
  rationale: Le texte massorétique de 2 Samuel 8.13 porte « Aram », tandis que certains témoins et le parallèle de 1 Chroniques 18.12 soutiennent « Édom ». Le texte principal suit la source hébraïque fournie et la note préserve l’importante variante sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, digne et accessible. L’idiome « se fit un nom » préserve l’image hébraïque. La ponctuation rattache clairement le nombre au résultat militaire, tout en évitant d’affirmer explicitement que les dix-huit mille hommes furent tués.
