  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: fr
  text: Alors Toï envoya son fils Yoram auprès du roi David pour prendre de ses nouvelles et le bénir, parce qu’il avait combattu Hadadézer et l’avait vaincu, car Hadadézer était en guerre avec Toï ; et Yoram avait[a] avec lui des objets en argent, en or et en bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa main se trouvaient » ; c’est-à-dire qu’il portait ces objets avec lui.'
    reason: Conserve la formulation concrète de l’hébreu tout en expliquant l’expression française idiomatique.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors … envoya
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: תֹּעִי
  choice: Toï
  rationale: Translittération française du nom hébreu dans Samuel, distincte de la forme parallèle de Chroniques.
- source_word: יֽוֹרָם בְּנוֹ
  choice: son fils Yoram
  rationale: Ordre naturel en français, sans perte d’information.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: pour prendre de ses nouvelles
  rationale: Rend idiomatiquement l’action de s’enquérir du bien-être de quelqu’un.
- source_word: וּלְבָרֲכוֹ
  choice: et le bénir
  rationale: Conserve le sens premier de ברך, tout en laissant le contexte diplomatique suggérer la félicitation.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: parce qu’il avait combattu Hadadézer et l’avait vaincu
  rationale: Le ב marque ici l’opposition ; dans ce contexte militaire, נכה indique que David a défait Hadadézer, sans nécessairement signifier qu’il l’a tué.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: car Hadadézer avait été en guerre avec Toï
  rationale: Formulation française naturelle qui rend l’expression hébraïque comprimée « homme de guerres avec Toï ».
- source_word: וּבְיָדוֹ הָיוּ
  choice: Yoram apportait
  rationale: Littéralement « dans sa main se trouvaient » ; le contexte de l’ambassade indique qu’il portait ces présents. Le nom explicite évite l’ambiguïté du pronom français.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: des objets en argent, en or et en bronze
  rationale: כְּלִי est un terme générique ; « objets » convient mieux que « vases » sans préciser indûment leur nature. נְחֹשֶׁת désigne ici le bronze.
