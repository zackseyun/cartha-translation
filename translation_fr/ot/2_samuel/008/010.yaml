revisions:
- from: Alors Toï envoya son fils Yoram auprès du roi David pour prendre de ses nouvelles et le bénir, parce qu’il avait combattu Hadadézer et l’avait vaincu, car Hadadézer avait été en guerre avec Toï. Yoram apportait des objets en argent, en or et en bronze.
  to: Alors Toï envoya son fils Yoram auprès du roi David pour prendre de ses nouvelles et le bénir, parce qu’il avait combattu Hadadézer et l’avait vaincu, car Hadadézer était en guerre avec Toï ; et Yoram avait[a] avec lui des objets en argent, en or et en bronze.
  rationale: La révision préserve la progression narrative, le sens diplomatique de l’envoi et la victoire de David, tout en rendant plus directement la dernière proposition hébraïque. La note signale sans surcharge l’écart entre l’expression idiomatique française et la formulation littérale.
