base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: fr
  text: De Bétah et de Bérotaï[a][b], villes de Hadadézer, le roi David prit une très grande quantité de bronze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le récit parallèle de 1 Chroniques 18.8 appelle ces lieux Tibhath et Koun; le texte hébreu de ce verset porte Bétah et Bérotaï.
    reason: cross_reference
  - marker: b
    text: Ou « Bérotha », d’après une forme apparentée du nom de lieu retenue dans certaines traductions.
    reason: lexical_alternative
  - marker: c
    text: Ou « cuivre »; le terme hébreu peut désigner le cuivre ou le bronze selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּטַח
  choice: De Bétah
  rationale: La préposition מִן indique la provenance. Le toponyme suit la forme du texte hébreu de ce verset; la différence avec le récit parallèle est signalée en note.
- source_word: וּמִבֵּרֹתַי
  choice: et de Bérotaï
  rationale: La coordination et la provenance sont rendues directement, et le toponyme est translittéré d’après la forme massorétique בֵּרֹתַי.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: villes de Hadadézer
  rationale: La chaîne construite exprime l’appartenance ou l’association de ces villes au domaine de Hadadézer.
- source_word: לָקַח
  choice: prit
  rationale: Le sens premier est « prendre ». Ce choix conserve la sobriété de l’hébreu sans préciser indûment s’il s’agit de saisir un butin ou d’emporter des réserves.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette formulation correspond à l’usage naturel et digne du français moderne.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme peut désigner le cuivre ou le bronze. « Bronze » convient au contexte ancien et à l’emploi ultérieur de ce métal selon le récit parallèle, tandis que l’autre possibilité est conservée en note.
- source_word: הַרְבֵּה מְאֹד
  choice: une très grande quantité de
  rationale: Cette expression française restitue clairement l’intensification quantitative de l’hébreu dans un style naturel.
