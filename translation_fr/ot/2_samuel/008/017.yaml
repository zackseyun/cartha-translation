  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: fr
  text: Tsadok, fils d’Ahitoub, et Ahimélek, fils d’Abiatar, étaient prêtres[a], et Seraya était secrétaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être « hauts fonctionnaires » ou « dignitaires royaux » : certains comprennent ici le terme hébreu dans un sens administratif plus large, puisque le passage énumère les responsables de David.'
    reason: lexical_alternative
  - marker: b
    text: Ou « scribe ». Le terme hébreu désigne un fonctionnaire chargé de l’écriture ou de l’administration.
    reason: lexical_alternative
