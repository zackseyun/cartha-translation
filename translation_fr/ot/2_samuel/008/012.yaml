  text: מֵ/אֲרָ֤ם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵ֑ק וּ/מִ/שְּׁלַ֛ל הֲדַדְעֶ֥זֶר בֶּן רְחֹ֖ב מֶ֥לֶךְ צוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/012.yaml
  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: fr
  text: d’Aram[a], de Moab, des Ammonites[b], des Philistins, d’Amalec, ainsi que du butin de Hadadézer[c], fils de Rehob, roi de Tsoba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Aram », traditionnellement traduit par « Syrie ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des fils d’Ammon ».'
    reason: lexical_alternative
  - marker: c
    text: Dans certains passages, ce nom est écrit « Hadarézer ».
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: d’Aram
  rationale: Le nom propre hébreu désigne la région et le peuple araméens. « Aram » préserve le nom du texte plutôt que de lui substituer l’appellation géopolitique plus tardive « Syrie ».
- source_word: וּמִמּוֹאָב
  choice: de Moab
  rationale: Le nom propre de la nation ou du territoire est rendu directement selon sa forme française usuelle.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: des Ammonites
  rationale: L’expression signifie littéralement « des fils d’Ammon »; « les Ammonites » en transmet naturellement le référent ethnique en français moderne.
- source_word: וּמִפְּלִשְׁתִּים
  choice: des Philistins
  rationale: L’ethnonyme reçoit sa forme française standard.
- source_word: וּמֵעֲמָלֵק
  choice: d’Amalec
  rationale: L’hébreu emploie le nom propre Amalec, et non une forme gentilique explicite; la traduction conserve cette formulation.
- source_word: וּמִשְּׁלַל
  choice: ainsi que du butin
  rationale: שָׁלָל désigne les biens emportés à la guerre. « Butin » est naturel et précis; « ainsi que » clarifie le dernier élément de l’énumération sans en modifier le sens.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadézer
  rationale: La transcription suit la forme consonantique de ce verset, adaptée à l’usage typographique français.
- source_word: בֶּן רְחֹב
  choice: fils de Rehob
  rationale: La construction filiale est rendue directement et sans explicitation supplémentaire.
- source_word: מֶלֶךְ צוֹבָה
  choice: roi de Tsoba
  rationale: Le titre royal est traduit directement et le nom de lieu est transcrit sous une forme française courante.
theological_decisions: []
translation_notes:
  register: Phrase conçue comme la continuation syntaxique du verset précédent. Registre actuel et digne, avec des noms propres transcrits selon l’usage français. La formulation « du butin de Hadadézer » conserve la relation concise et potentiellement ouverte exprimée par l’hébreu, sans préciser davantage que le texte la provenance ou la possession.
