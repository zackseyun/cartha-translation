  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: fr
  text: Il établit des garnisons en Édom ; dans tout Édom, il établit des garnisons, et tout Édom fut assujetti à David[a]. Yahweh donna la victoire à David partout où il alla[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout Édom devint des serviteurs de David ». Le nom du pays désigne collectivement ses habitants ; on peut aussi traduire : « tous les Édomites devinrent les serviteurs de David ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Yahweh sauva (ou délivra) David partout où il alla ». Dans ce contexte militaire, le verbe évoque la victoire accordée par Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: établit
  rationale: Le verbe שׂים signifie « mettre, placer, établir ». Avec des garnisons, « établir » est naturel en français et n’ajoute pas une précision absente du texte.
- source_word: נְצִבִים
  choice: garnisons
  rationale: Dans ce contexte de conquête et de contrôle territorial, le terme désigne vraisemblablement des forces ou postes établis sur place. « Garnisons » rend bien le sens militaire probable, tout en laissant « gouverneurs » comme possibilité lexicale moins probable.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: en Édom / dans tout Édom
  rationale: La préposition marque ici le lieu, et בְכָל exprime l’étendue à l’ensemble du territoire.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: tout Édom fut assujetti à David
  rationale: Le nom pluriel עֲבָדִים exprime ici une condition de service ou de sujétion imposée après une conquête. « Fut assujetti » restitue naturellement le rapport politique sans imposer le sens plus étroit de l’esclavage individuel. « Tout Édom » conserve l’emploi collectif du nom du pays pour sa population.
- source_word: וַיּוֹשַׁע
  choice: donna la victoire
  rationale: Le hiphil de ישׁע peut signifier sauver, délivrer ou donner la victoire. Dans ce résumé militaire, « donna la victoire » exprime clairement le sens contextuel tout en maintenant Yahweh comme agent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: partout où il alla
  rationale: Cette formulation française naturelle conserve la portée générale de l’expression sans ajouter l’idée plus précise de marcher au combat.
theological_decisions:
- issue: Sens de la sujétion d’Édom
  choice: tout Édom fut assujetti à David
  alternative: tous les Édomites devinrent les serviteurs de David / tout Édom devint esclave de David
  rationale: Le contexte est celui d’une domination nationale après une conquête. La formulation choisie conserve cette force politique tout en évitant de trancher en faveur de l’esclavage individuel.
- issue: Portée de וַיּוֹשַׁע
  choice: Yahweh donna la victoire à David
  alternative: Yahweh sauva ou délivra David
  rationale: Le cadre militaire favorise le sens de victoire, mais une note préserve les sens plus littéraux de salut et de délivrance.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le Tétragramme comme nom personnel ; « Yahweh » le conserve au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « en Édom / dans tout Édom » est conservée parce qu’elle appartient à la structure emphatique de l’hébreu. Le passé simple convient au registre narratif biblique sans être archaïque.
