  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: fr
  text: Joab, fils de Tserouya, était à la tête de l’armée[a], et Josaphat, fils d’Ahiloud, était archiviste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commandait l’armée ».
    reason: lexical_alternative
  - marker: b
    text: L’« archiviste » était un fonctionnaire royal chargé de garder la trace des affaires et d’en rendre compte au roi. On pourrait aussi traduire par « secrétaire » ou « chroniqueur ».
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: était à la tête de l’armée
  rationale: Dans cette liste de fonctions, la préposition עַל exprime l’autorité exercée sur l’armée. « Était à la tête de l’armée » rend naturellement cette responsabilité sans préciser plus que l’hébreu la nature exacte du commandement.
- source_word: מַזְכִּיר
  choice: archiviste
  rationale: Le terme désigne ici un haut fonctionnaire royal chargé de conserver la mémoire des affaires et vraisemblablement d’en rendre compte au roi. « Archiviste » est concis et moins susceptible que « secrétaire » d’évoquer uniquement un emploi administratif moderne.
- source_word: בֶּן
  choice: fils de
  rationale: Dans l’identification généalogique des fonctionnaires, le sens direct « fils de » convient au style formel de la liste.
- source_word: וְ / וִ
  choice: et
  rationale: La conjonction coordonne simplement les deux membres de la liste; « et » conserve cette structure.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: Joab / Tserouya / Josaphat / Ahiloud
  rationale: Ces formes suivent des conventions françaises courantes de translittération et d’usage biblique.
