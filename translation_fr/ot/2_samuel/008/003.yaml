  text: וַ/יַּ֣ךְ דָּוִ֔ד אֶת הֲדַדְעֶ֥זֶר בֶּן רְחֹ֖ב מֶ֣לֶךְ צוֹבָ֑ה בְּ/לֶכְתּ֕/וֹ לְ/הָשִׁ֥יב יָד֖/וֹ בִּֽ/נְהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: fr
  text: David battit Hadadézer, fils de Rehob[a], roi de Tsoba, alors que celui-ci allait rétablir son autorité[b] près du Fleuve[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Hadadézer » ; certaines traditions textuelles et le passage parallèle de 1 Chroniques portent « Hadarézer ».'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « ramener sa main ». On pourrait aussi comprendre : « reprendre le contrôle » ou « rétablir sa domination ».'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit vraisemblablement de l’Euphrate.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: battit
  rationale: Dans ce contexte militaire, נכה indique que David frappe et défait son adversaire. « Battit » rend naturellement l'issue du combat sans préciser à tort qu'Hadadézer fut tué.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadézer
  rationale: Translittération française de la forme du WLC; la variante « Hadarézer » est signalée en note.
- source_word: בֶּן רְחֹב
  choice: fils de Rehob
  rationale: Rend directement le patronyme hébreu, avec une translittération française sobre du nom propre.
- source_word: מֶלֶךְ צוֹבָה
  choice: roi de Tsoba
  rationale: Rend directement la chaîne construite; « Tsoba » est une translittération française usuelle et transparente.
- source_word: בְּלֶכְתּוֹ
  choice: alors que celui-ci allait
  rationale: L'infinitif construit précédé de ב exprime ici la circonstance temporelle. « Celui-ci » rattache clairement l'action à Hadadézer, comme le suggère le contexte, sans alourdir la phrase.
- source_word: לְהָשִׁיב
  choice: rétablir
  rationale: Le hiphil de שוב signifie faire revenir ou restaurer. « Rétablir » convient à l'autorité politique ou militaire en cause.
- source_word: יָדוֹ
  choice: son autorité
  rationale: Littéralement « sa main »; dans ce contexte politico-militaire, la main représente la puissance, l'emprise ou l'autorité. « Autorité » reste lisible sans définir trop précisément la nature de cette domination.
- source_word: בִּנְהַר
  choice: près du Fleuve
  rationale: נהר employé avec détermination désigne vraisemblablement ici le grand Fleuve, c'est-à-dire l'Euphrate. La majuscule maintient cette désignation traditionnelle, tandis que la note donne l'identification probable. La préposition ב peut ici être rendue spatialement par « près de ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste concise. Le verbe « battit » garde la force militaire sans impliquer la mort du roi. L'expression idiomatique « ramener sa main » est explicitée dans le texte par « rétablir son autorité », et son ambiguïté est conservée en note.
