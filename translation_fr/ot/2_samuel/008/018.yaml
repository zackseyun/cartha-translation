  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵ֥י דָוִ֖ד כֹּהֲנִ֥ים הָיֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: fr
  text: Benaya, fils de Yehoyada, était à la tête des Kérétiens et des Pélétiens ; les fils de David étaient prêtres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hauts fonctionnaires » ou « dignitaires de la cour ». Le mot hébreu est le terme habituel pour « prêtres », mais certains lui donnent ici un sens plus large lié à la cour, puisque le contexte concerne l’administration royale.
    reason: Signaler une interprétation contextuelle possible tout en conservant dans le texte le sens lexical ordinaire.
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya, fils de Yehoyada
  rationale: Les noms propres sont translittérés selon des formes françaises lisibles et proches de l’hébreu.
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: les Kérétiens et les Pélétiens
  rationale: Ces désignations de groupes sont translittérées sans préciser de manière interprétative leur origine ethnique ou leur fonction militaire.
- source_word: '[prédicat sous-entendu avec בְנָיָהוּ… וְהַכְּרֵתִי וְהַפְּלֵתִי]'
  choice: commandait
  rationale: L’hébreu présente une construction nominale elliptique dans une liste de responsables. Le français exige un prédicat; « commandait » exprime naturellement la responsabilité de Benaya à l’égard de ces deux groupes, conformément au contexte administratif et au parallèle de 2 Samuel 20.23.
- source_word: כֹּהֲנִים
  choice: prêtres
  rationale: C’est le sens lexical habituel du mot hébreu. La traduction le conserve dans le texte principal afin de ne pas effacer la tension historique et théologique du passage.
- source_word: הָיוּ
  choice: étaient
  rationale: Le verbe היה fonctionne ici comme copule. « Étaient » rend directement sa valeur, sans lui substituer l’interprétation « exerçaient les fonctions de ».
theological_decisions:
- issue: Les fils de David sont qualifiés de כֹּהֲנִים
  choice: Conserver « prêtres » dans le texte principal.
  alternative: « hauts fonctionnaires » ou « dignitaires de la cour »
  rationale: Bien que les fils de David ne soient pas normalement présentés comme prêtres au sens cultuel lévitique, le terme hébreu est le mot ordinaire pour « prêtres ». Le traduire ainsi préserve la formulation et la tension du texte; les sens administratifs proposés par certains sont signalés en note sans être imposés.
translation_notes:
  register: Français international moderne, clair et digne. « Quant aux » distingue naturellement la seconde proposition de la chaîne précédente. Les translittérations « Kérétiens » et « Pélétiens » restent proches de l’hébreu et se prononcent aisément en français.
