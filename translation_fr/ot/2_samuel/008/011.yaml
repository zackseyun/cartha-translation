id: 2SA.8.11
reference: 2 Samuel 8:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם אֹתָ֕/ם הִקְדִּ֛ישׁ הַ/מֶּ֥לֶךְ דָּוִ֖ד לַֽ/יהוָ֑ה עִם הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ אֲשֶׁ֣ר הִקְדִּ֔ישׁ מִ/כָּל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר כִּבֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: fr
  text: Le roi David les consacra eux aussi[b] à Yahweh, avec l’argent et l’or qu’il avait consacrés, provenant de toutes les nations qu’il avait soumises[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conquises ». Le verbe hébreu peut désigner le fait de placer des peuples sous son autorité par la force.
    reason: lexical_alternative
  - marker: b
    text: Le pronom « les » renvoie aux objets mentionnés au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: les consacra eux aussi
  rationale: « Eux aussi » exprime la valeur additive de גַּם tout en conservant le pronom אֹתָם, dont le référent reste à chercher dans le verset précédent.
- source_word: הִקְדִּישׁ
  choice: consacra
  rationale: Dans le contexte de biens réservés à Dieu, « consacrer » rend le fait de les affecter au domaine sacré sans alourdir la formulation.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Formulation française naturelle du titre royal suivi du nom propre.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte hébreu emploie directement le nom divin יהוה ; « Yahweh » le représente comme nom propre.
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: avec l’argent et l’or
  rationale: « Avec » rend simplement l’association exprimée par עִם ; les articles définis sont conservés naturellement en français.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: qu’il avait consacrés
  rationale: Le plus-que-parfait indique naturellement que cette consécration était antérieure au geste rapporté ici ; l’accord au pluriel renvoie à l’argent et à l’or.
- source_word: מִכָּל הַגּוֹיִם
  choice: provenant de toutes les nations
  rationale: Cette formulation rend explicitement la provenance marquée par מִן et évite de rattacher maladroitement les nations au seul verbe « consacrer ».
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: qu’il avait soumises
  rationale: « Soumettre » conserve la portée militaire et politique de כּבש sans imposer l’idée plus précise d’une annexion durable.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset porte le tétragramme comme nom propre. « Yahweh » préserve cette fonction et distingue le nom divin d’un titre.
- issue: Portée de כִּבֵּשׁ
  choice: avait soumises
  alternative: avait conquises
  rationale: Le verbe peut désigner la mise sous domination par la force. « Soumises » maintient cette idée tout en laissant ouverte la forme exacte du contrôle exercé.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’enchaînement hébreu tout en évitant une relative ambiguë. Les marqueurs sont placés immédiatement après les éléments qu’ils expliquent.
