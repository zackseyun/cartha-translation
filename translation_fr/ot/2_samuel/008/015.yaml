  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖ד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י דָוִ֗ד עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: fr
  text: David régna sur tout Israël, et David rendait la justice et pratiquait la droiture envers tout son peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le verbe מלך décrit ici l’exercice de la royauté dans une formule récapitulative, et non simplement l’accession au trône.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sur tout Israël
  rationale: La préposition עַל avec מלך désigne le peuple ou le territoire gouverné; cette formulation conserve aussi la portée globale de כָּל.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: il rendait… et faisait respecter
  rationale: La construction ויהי suivie d’un participe exprime une activité habituelle et continue; l’imparfait français en rend naturellement l’aspect.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans ce contexte royal, le terme désigne l’administration juste du pouvoir, et non un simple verdict judiciaire.
- source_word: וּצְדָקָה
  choice: faisait respecter le droit
  rationale: צְדָקָה évoque ici la rectitude et ce qui est juste. Cette expression française naturelle maintient sa distinction sémantique avec מִשְׁפָּט sans employer l’abstrait potentiellement religieux « justice » deux fois.
- source_word: לְכָל עַמּוֹ
  choice: pour tout son peuple
  rationale: ל peut indiquer les bénéficiaires de l’action royale; « pour » exprime naturellement une gouvernance exercée en faveur de l’ensemble du peuple, tandis que le possessif traduit le suffixe hébreu.
theological_decisions:
- issue: Traduction du couple royal מִשְׁפָּט וּצְדָקָה
  choice: rendait la justice et faisait respecter le droit
  alternative: pratiquait la justice et la droiture
  rationale: 'La formulation retenue conserve les deux dimensions complémentaires de la royauté idéale: l’administration de la justice et le maintien de ce qui est droit. Elle évite de fondre les deux termes en une seule idée, tout en restant idiomatique en français moderne.'
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait exprime l’action habituelle signalée par la construction hébraïque. La répétition du nom « David » dans le second membre n’est pas reproduite, car le pronom assure en français une continuité naturelle sans perte de sens.
