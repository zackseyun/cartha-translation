    issue: 'Construction non idiomatique : « David lui captura 1 700 cavaliers »'
    rationale: En français moderne, « capturer » ne se construit pas naturellement avec un datif de dépossession (« lui captura »). Le texte indique que David prit ces hommes à Hadadézer ; « David lui prit » exprime clairement ce rapport.
  - severity: low
    issue: La note b présente « toute la force de chars » comme une traduction littérale.
    rationale: רכב signifie ici littéralement « les chars » / « tout le charroi », même si le contexte impose que l’action vise les chevaux. La note doit éviter de présenter une interprétation militaire comme une littéralité.
