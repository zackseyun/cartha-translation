  text: וַ/יִּלְכֹּ֨ד דָּוִ֜ד מִמֶּ֗/נּוּ אֶ֤לֶף וּ/שְׁבַע מֵאוֹת֙ פָּרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: fr
  text: David lui prit 1 700 cavaliers et 20 000 soldats à pied[a]. Puis David coupa les jarrets à tous les chevaux des chars[b], mais il en laissa suffisamment pour 100 chars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu de Samuel porte « 1 700 cavaliers ». Le passage parallèle de 1 Chroniques 18.4 porte « 7 000 cavaliers ».
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « tous les chars ». L’action décrite consiste à couper les jarrets des chevaux qui tiraient les chars.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: captura
  rationale: Le verbe לכד désigne couramment la prise ou la capture au combat; « captura » convient au contexte militaire.
- source_word: מִמֶּנּוּ
  choice: lui
  rationale: Le suffixe hébreu est au singulier et renvoie dans le contexte à Hadadézer.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1 700 cavaliers
  rationale: פָּרָשִׁים désigne des hommes montés, c’est-à-dire des cavaliers. Le chiffre suit le texte massorétique de Samuel.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20 000 soldats à pied
  rationale: Cette formulation naturelle rend le sens militaire de l’expression littérale « homme de pied » et maintient le contraste avec les cavaliers.
- source_word: וַיְעַקֵּר
  choice: coupa les jarrets
  rationale: Dans ce contexte, עקר décrit la mise hors d’usage des chevaux par section des tendons des jarrets.
- source_word: אֶת כָּל הָרֶכֶב
  choice: tous les chevaux des chars
  rationale: רֶכֶב signifie littéralement la force de chars ou les chars, mais l’action de couper les jarrets vise nécessairement leurs chevaux; le référent implicite est explicité.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: mais il en laissa suffisamment pour 100 chars
  rationale: Le hiphil de יתר signifie laisser subsister ou réserver. La formulation française conserve le pronom du texte et exprime naturellement la quantité nécessaire à cent chars.
