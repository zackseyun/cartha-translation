base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/008.yaml
  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: fr
  text: 'Alors le roi dit à la femme : « Va chez toi. Quant à moi, je donnerai des ordres à ton sujet[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ta faveur ». La préposition hébraïque peut être comprise de plusieurs façons ; le roi annonce qu’il donnera des instructions concernant la femme ou son affaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Rend directement le nom défini hébreu.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Dans le contexte, il s’agit de la femme de Teqoa qui s’adresse à David ; « femme » est ici le sens contextuel naturel.
- source_word: לְכִי
  choice: Va
  rationale: Impératif féminin singulier de הלך, adressé à la femme.
- source_word: לְבֵיתֵךְ
  choice: chez toi
  rationale: Littéralement « vers ta maison » ; « chez toi » est la formulation française courante pour demander à quelqu’un de retourner à son domicile.
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant met le sujet en relief ; « Quant à moi » conserve cette insistance avec naturel.
- source_word: אֲצַוֶּה
  choice: je donnerai des ordres
  rationale: Le piel de צוה signifie « ordonner, donner des ordres » ; cette formulation convient à la parole royale et préserve l’idée d’autorité.
- source_word: עָלָיִךְ
  choice: à ton sujet
  rationale: Avec צוה, la préposition עַל peut désigner la personne ou l’affaire visée par les ordres. « À ton sujet » conserve cette portée sans supposer explicitement qu’ils seront donnés en sa faveur.
