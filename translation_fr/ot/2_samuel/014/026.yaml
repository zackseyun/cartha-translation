base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: fr
  text: 'Chaque fois qu’il se coupait les cheveux — il le faisait à la fin de chaque année, parce qu’ils lui pesaient —, il pesait les cheveux de sa tête : deux cents sicles selon l’étalon royal[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la pierre du roi », c’est-à-dire selon le poids étalon royal.'
    reason: Note lexicale et culturelle expliquant l’emploi de la « pierre » comme poids de référence.
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: Chaque fois qu’il se coupait les cheveux
  rationale: La construction temporelle et le contexte indiquent une action répétée. « Se couper les cheveux » est naturel en français et évite de suggérer nécessairement un rasage complet; « les cheveux » explicite l’objet implicite dans « la tête ».
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים אֲשֶׁר יְגַלֵּחַ
  choice: il les coupait à la fin de chaque année
  rationale: L’expression idiomatique décrit ici un intervalle régulier, compris comme annuel, et l’imparfait rend l’action habituelle.
- source_word: כִּי כָבֵד עָלָיו
  choice: parce qu’ils lui pesaient
  rationale: Cette formulation conserve l’image hébraïque du poids tout en étant idiomatique; le pluriel renvoie naturellement aux cheveux en français.
- source_word: וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: il pesait les cheveux de sa tête
  rationale: L’imparfait correspond à la pratique répétée, tandis que « les cheveux de sa tête » garde l’insistance explicite de l’hébreu.
- source_word: מָאתַיִם שְׁקָלִים
  choice: deux cents sicles
  rationale: Le sicle est ici une unité de poids, non une monnaie; le terme traditionnel français préserve l’unité ancienne sans imposer une conversion moderne incertaine.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: selon l’étalon royal
  rationale: « Pierre » désigne concrètement un poids servant d’étalon. La traduction communique clairement la fonction de cette pierre-poids, et la note conserve le sens littéral.
