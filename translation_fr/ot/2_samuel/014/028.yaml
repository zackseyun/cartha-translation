  text: וַ/יֵּ֧שֶׁב אַבְשָׁל֛וֹם בִּ/ירוּשָׁלִַ֖ם שְׁנָתַ֣יִם יָמִ֑ים וּ/פְנֵ֥י הַ/מֶּ֖לֶךְ לֹ֥א רָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/028.yaml
  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
translation:
  language: fr
  text: Absalom resta à Jérusalem pendant deux années entières, sans voir le visage du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « voir le visage du roi » évoque le fait d’être reçu personnellement par le roi ou d’avoir accès à lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Dans ce contexte narratif, ישׁב exprime le séjour prolongé d’Absalom à Jérusalem. « Resta » est naturel en français et souligne que sa situation perdure.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition locative se rend naturellement par « à » devant le nom d’une ville.
- source_word: שְׁנָתַיִם יָמִים
  choice: deux années entières
  rationale: L’expression hébraïque, littéralement « deux années, jours », désigne une durée complète. « Deux années entières » en restitue la valeur idiomatique sans reproduire une tournure obscure en français.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: et il ne vit pas le roi
  rationale: Littéralement, Absalom « ne vit pas le visage du roi ». En contexte royal, voir le visage du roi signifie être reçu personnellement par lui. La formulation française conserve le verbe « voir » et l’absence de rencontre sans attribuer explicitement une cause que la proposition hébraïque ne formule pas.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Deux années entières » rend l’idiome temporel hébreu, tandis que « il ne vit pas le roi » évite le calque peu naturel « voir le visage du roi »; la note conserve l’image originale et sa portée contextuelle.
