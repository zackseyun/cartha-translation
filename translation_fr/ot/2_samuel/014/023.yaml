  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: fr
  text: Joab se leva, alla à Gueshour et amena[a] Absalom à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ramena Absalom à Jérusalem ». Le contexte indique qu’Absalom revenait d’exil, mais l’idée de retour n’est pas explicitement exprimée par le verbe hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום fait progresser le récit et décrit Joab qui se lève pour agir. « Se leva » conserve cette image sans la réduire au simple départ.
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: Dans ce récit, הלך exprime simplement le déplacement; « alla » est direct et naturel.
- source_word: גְּשׁוּרָה
  choice: à Gueshour
  rationale: Le hé directionnel indique un mouvement vers Gueshour. La graphie « Gueshour » est adaptée à la lecture française.
- source_word: וַיָּבֵא
  choice: amena
  rationale: Le hifil de בוא signifie « faire venir, amener ». « Amena » rend le verbe sans ajouter explicitement l'idée de retour, même si celle-ci ressort du contexte.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalom
  rationale: La particule marque Absalom comme complément d'objet direct; le nom suit sa forme française traditionnelle.
- source_word: יְרוּשָׁלִָם
  choice: à Jérusalem
  rationale: Avec « amener », le français exprime naturellement la destination par « à », relation déjà indiquée par la syntaxe hébraïque.
- source_word: וַ
  choice: donc / et
  rationale: Le premier enchaînement est rendu par « donc » pour marquer la conséquence narrative, puis les actions coordonnées par « et », dans un français fluide.
