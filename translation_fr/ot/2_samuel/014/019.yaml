revisions:
- from: 'Le roi demanda : « La main de Joab est-elle avec toi dans toute cette affaire ? » La femme répondit : « Aussi vrai que tu es vivant, mon seigneur le roi, il est impossible de s’écarter à droite ou à gauche de tout ce qu’a dit mon seigneur le roi. Oui, c’est ton serviteur Joab qui m’a donné ses ordres et qui a mis toutes ces paroles dans la bouche de ta servante. »'
  to: 'Le roi demanda : « Joab est-il impliqué avec toi dans toute cette affaire[a] ? » La femme répondit : « Aussi vrai que tu es vivant, mon seigneur le roi, personne ne peut s’écarter à droite ou à gauche de tout ce qu’a dit mon seigneur le roi. Car c’est ton serviteur Joab qui m’a ordonné de le faire et qui a mis toutes ces paroles dans la bouche de ta servante. »'
  rationale: La question est rendue dans un français clair tout en signalant en note l’image hébraïque de la « main ». La réponse conserve les images directionnelles et celle des paroles placées dans la bouche, mais remplace l’ajout « Oui » par « Car », qui reflète mieux la liaison explicative du texte hébreu. « M’a ordonné de le faire » exprime explicitement le commandement de Joab et son rapport au stratagème.
