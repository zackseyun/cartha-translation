  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ הֲ/יַ֥ד יוֹאָ֛ב אִתָּ֖/ךְ בְּ/כָל זֹ֑את וַ/תַּ֣עַן הָ/אִשָּׁ֣ה וַ/תֹּ֡אמֶר חֵֽי נַפְשְׁ/ךָ֩ אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אִם אִ֣שׁ לְ/הֵמִ֣ין וּ/לְ/הַשְׂמִ֗יל מִ/כֹּ֤ל אֲשֶׁר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי עַבְדְּ/ךָ֤ יוֹאָב֙ ה֣וּא צִוָּ֔/נִי וְ/ה֗וּא שָׂ֚ם בְּ/פִ֣י שִׁפְחָֽתְ/ךָ֔ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: fr
  text: 'Le roi demanda : « Joab est-il impliqué avec toi dans toute cette affaire[a] ? » La femme répondit : « Aussi vrai que tu es vivant, mon seigneur le roi, personne ne peut s’écarter à droite ou à gauche de tout ce qu’a dit mon seigneur le roi. Car c’est ton serviteur Joab qui m’a ordonné de le faire et qui a mis toutes ces paroles dans la bouche de ta servante. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La main de Joab est-elle avec toi ? » L’expression évoque son intervention ou son implication dans cette affaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: La main de Joab est-elle avec toi
  rationale: Conserve l’image hébraïque de la « main », qui évoque ici l’intervention, l’influence ou la participation de Joab, tout en restant intelligible en français.
- source_word: בְּכָל זֹאת
  choice: dans toute cette affaire
  rationale: Renvoie naturellement à l’ensemble du stratagème et de la situation évoqués dans le contexte.
- source_word: חֵי נַפְשְׁךָ
  choice: Aussi vrai que tu es vivant
  rationale: Rend naturellement en français la formule de serment hébraïque, littéralement « par la vie de ton âme ».
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: il est impossible de s’écarter à droite ou à gauche
  rationale: Préserve la métaphore directionnelle tout en exprimant clairement l’idée que le jugement du roi ne peut être esquivé ou contredit.
- source_word: מִכֹּל אֲשֶׁר דִּבֶּר
  choice: de tout ce qu’a dit
  rationale: Le complément introduit par מִן indique ici le point à partir duquel on ne peut dévier.
- source_word: עַבְדְּךָ יוֹאָב
  choice: ton serviteur Joab
  rationale: « Serviteur » convient à l’expression de cour et évite de suggérer à tort un statut servile au sens strict.
- source_word: צִוָּנִי
  choice: m’a donné ses ordres
  rationale: Exprime l’autorité du commandement de Joab dans un français actuel et naturel.
- source_word: שָׂם בְּפִי
  choice: a mis ... dans la bouche de
  rationale: Conserve l’image vive de l’hébreu selon laquelle Joab a fourni à la femme les paroles à prononcer.
- source_word: שִׁפְחָתְךָ
  choice: ta servante
  rationale: Respecte le féminin et la formule d’humilité employée par la femme devant le roi.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: Le contexte porte sur le discours précis que Joab lui a fait prononcer ; « paroles » est donc plus précis que « choses ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. La répétition courtisane de « mon seigneur le roi » est maintenue, ainsi que les images hébraïques de la main, de la droite et de la gauche, et des paroles mises dans la bouche. Aucun marqueur de note n’est requis, puisque les idiomes restent compréhensibles dans le texte et que la formule de serment est rendue directement par un équivalent français naturel.
