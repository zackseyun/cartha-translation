base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: fr
  text: 'Alors le roi répondit à la femme : « Je t’en prie, ne me cache rien de ce que je te demande. » La femme dit : « Que mon seigneur le roi parle, de grâce. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: En français narratif, « répondit » rend naturellement la séquence des deux verbes hébreux sans le pléonasme lourd « répondit et dit ».
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du titre défini.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le terme désigne ici la femme de Teqoa, sans relation conjugale impliquée.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי
  choice: S’il te plaît, ne me cache rien
  rationale: « S’il te plaît » restitue la nuance de supplication de נָא, tandis que « cacher » exprime clairement l’idée de dissimuler ou retenir une information.
- source_word: דָּבָר אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: rien de ce que je vais te demander
  rationale: Après une négation, « rien de ce que » est idiomatique en français. Le futur proche convient à la question que le roi s’apprête à poser, tout en gardant la valeur contextuelle du participe hébreu.
- source_word: יְדַבֶּר נָא
  choice: Que ... parle, je te prie
  rationale: Cette tournure conserve le jussif à la troisième personne et la déférence de la femme, là où un impératif direct serait plus naturel mais moins formel.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: La formule garde l’adresse courtoise de cour et le titre royal sans surinterpréter אֲדֹנִי.
