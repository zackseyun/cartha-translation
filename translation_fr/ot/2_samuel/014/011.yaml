base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: fr
  text: 'Elle dit alors : « Que le roi daigne se souvenir de Yahweh, ton Dieu, afin que le vengeur du sang n’ajoute pas à la destruction et qu’ils ne détruisent pas mon fils. » Le roi répondit : « Aussi vrai que Yahweh est vivant, pas un seul cheveu de ton fils ne tombera à terre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: Que le roi daigne se souvenir
  rationale: Le jussif accompagné de נָא exprime une requête déférente. « Daigne » conserve cette politesse solennelle sans transformer la phrase en simple futur.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est transcrit « Yahweh », et le possessif singulier est conservé dans l’appel personnel adressé au roi.
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: afin que le vengeur du sang ne multiplie pas les destructions
  rationale: La formulation garde la valeur causative ou multiplicative de רבה et l’action destructrice de שׁחת, tout en produisant une phrase française compréhensible. La syntaxe hébraïque est difficile, et cette traduction évite de réduire silencieusement l’expression au seul sens de « continuer ».
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: Cette expression rend le rôle juridique et familial du proche chargé de venger le sang versé, sans l’assimiler à un simple meurtrier.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: et qu’on ne fasse pas disparaître mon fils
  rationale: Le pronom indéfini « on » rend naturellement le sujet pluriel non précisé. « Faire disparaître » exprime ici l’élimination totale visée par le verbe שׁמד.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formule française naturelle conserve le caractère solennel de l’énoncé juré hébreu.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: pas un seul cheveu de ton fils ne tombera à terre
  rationale: Après la formule de serment, אִם porte une négation emphatique. L’idiome français préserve la promesse de protection complète.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre et maintient l’appel de la femme au Dieu d’Israël sans le remplacer par un titre.
- issue: Portée de la promesse royale
  choice: Conserver l’idiome absolu du cheveu qui ne tombera pas
  alternative: 'Expliciter : « ton fils sera entièrement protégé »'
  rationale: L’image hébraïque exprime une protection complète, mais le texte ne précise pas ici tous les moyens ni toutes les implications juridiques de l’engagement. L’idiome conserve cette tension.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le tutoiement reflète le singulier hébreu dans « ton Dieu » et « ton fils ». « Que le roi daigne » marque la déférence de la femme; la réponse du roi reste solennelle et ferme.
