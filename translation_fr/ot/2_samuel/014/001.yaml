  text: וַ/יֵּ֖דַע יוֹאָ֣ב בֶּן צְרֻיָ֑ה כִּֽי לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: fr
  text: Joab, fils de Tserouya, comprit que le cœur du roi était tourné vers Absalom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le roi languissait après Absalom ». L’expression hébraïque est concise et peut aussi signifier, plus généralement, que le cœur du roi était porté vers Absalom. Certains la comprennent négativement : « le cœur du roi était contre Absalom » ; toutefois, la suite du récit favorise une inclination positive.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: savait
  rationale: Le wayyiqtol de ידע fait avancer le récit. « Savait » exprime directement la connaissance de Joab sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Joab, fils de Tserouya
  rationale: Le groupe construit est rendu naturellement en français; les noms propres suivent une translittération française usuelle.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce que Joab savait.
- source_word: לֵב הַמֶּלֶךְ
  choice: le cœur du roi
  rationale: « Cœur » conserve l’image hébraïque et peut désigner les sentiments, la volonté ou la disposition intérieure.
- source_word: עַל
  choice: était tourné vers
  rationale: La formulation hébraïque est elliptique. « Était tourné vers » conserve son orientation générale sans préciser excessivement s’il s’agit de désir, d’affection, de préoccupation ou d’hostilité.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Translittération française traditionnelle du nom propre.
theological_decisions:
- issue: Ambiguïté de la disposition du roi envers Absalom
  choice: le cœur du roi était tourné vers Absalom
  alternative: le roi languissait après Absalom ; le cœur du roi était contre Absalom
  rationale: L’hébreu est concis et n’explicite pas la nature positive ou négative de cette disposition. La traduction principale en préserve autant que possible l’ambiguïté, tandis que la note signale les principales interprétations; le contexte qui suit favorise toutefois une inclination positive.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation « le cœur du roi était tourné vers » reste compréhensible tout en conservant l’image et l’ambiguïté de l’hébreu.
