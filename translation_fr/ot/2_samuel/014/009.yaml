source:
  edition: WLC
  text: וַ/תֹּ֜אמֶר הָ/אִשָּׁ֤ה הַ/תְּקוֹעִית֙ אֶל הַ/מֶּ֔לֶךְ עָלַ֞/י אֲדֹנִ֥/י הַ/מֶּ֛לֶךְ הֶ/עָוֺ֖ן וְ/עַל בֵּ֣ית אָבִ֑/י וְ/הַ/מֶּ֥לֶךְ וְ/כִסְא֖/וֹ נָקִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: fr
  text: 'Alors la femme de Tekoa dit au roi : « Que la faute[a] retombe sur moi, mon seigneur le roi, et sur la maison de mon père ! Le roi et son trône, eux, sont innocents. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la culpabilité » ou « la responsabilité » ; le mot hébreu peut désigner la faute elle-même, l’état de culpabilité ou les conséquences qui en découlent.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: la femme de Tekoa
  rationale: Le gentilé féminin l’identifie par son lieu d’origine. Cette formulation est plus naturelle en français moderne que « la Tékoïte » tout en conservant l’identification géographique.
- source_word: עָלַי
  choice: sur moi
  rationale: La préposition avec suffixe de première personne est placée en tête pour insister sur la prise en charge personnelle de la responsabilité. « Que la faute retombe sur moi » rend cette emphase dans un français naturel.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette formule conserve l’adresse respectueuse de cour ainsi que le titre royal.
- source_word: הֶעָוֺן
  choice: la faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou la responsabilité et ses conséquences. Ici, « la faute » reste assez large pour préserver cette amplitude dans un contexte judiciaire.
- source_word: וְעַל בֵּית אָבִי
  choice: et sur la maison de mon père
  rationale: La traduction garde l’image hébraïque de la « maison du père », qui désigne la maisonnée ou la lignée familiale dans sa portée sociale et juridique.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: Le roi et son trône, eux
  rationale: 'Le redoublement pronominal « eux » exprime naturellement le contraste implicite : la responsabilité incombe à la femme et à sa maison, non au roi ni à son autorité royale.'
- source_word: נָקִי
  choice: sont innocents
  rationale: L’adjectif exprime ici l’absence de culpabilité ou de responsabilité. Le pluriel français s’accorde naturellement avec le sujet composé.
theological_decisions:
- issue: Formule d’exonération royale
  choice: Le roi et son trône, eux, sont innocents
  alternative: Le roi et son trône sont exempts de toute faute
  rationale: L’énoncé porte sur la responsabilité juridique ou morale dans cette affaire, et non sur une perfection morale générale du roi. « Innocents » conserve cette portée judiciaire sans introduire une affirmation doctrinale plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Que la faute retombe sur moi » restitue la prise en charge emphatique exprimée par la proposition nominale hébraïque, tandis que « mon seigneur le roi » conserve le registre de cour. Le contraste final est marqué sans surinterpréter la portée de l’innocence royale.
