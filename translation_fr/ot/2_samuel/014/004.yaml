source:
  edition: WLC
  text: וַ֠/תֹּאמֶר הָ/אִשָּׁ֤ה הַ/תְּקֹעִית֙ אֶל הַ/מֶּ֔לֶךְ וַ/תִּפֹּ֧ל עַל אַפֶּ֛י/הָ אַ֖רְצָ/ה וַ/תִּשְׁתָּ֑חוּ וַ/תֹּ֖אמֶר הוֹשִׁ֥עָ/ה הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: fr
  text: 'La femme de Teqoa s’adressa au roi[a]. Elle tomba face contre terre et se prosterna, puis elle dit : « Sauve-moi[b], ô roi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « la femme teqoïte ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte simplement « Sauve, ô roi ! » ; le complément « moi », sous-entendu, est explicité en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: la femme de Teqoa
  rationale: L’adjectif d’origine désigne cette femme par sa ville. « La femme de Teqoa » est naturel en français moderne et conserve l’identification géographique.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: s’adressa au roi
  rationale: Le verbe אָמַר signifie couramment « dire ». Ici, « s’adressa au roi » rend naturellement la première prise de parole, tout en permettant de traduire le second וַתֹּאמֶר par « elle dit » avant la citation directe.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: Elle tomba face contre terre
  rationale: Cette expression rend clairement l’image hébraïque d’une chute sur le visage en direction du sol et exprime la posture de profonde supplication.
- source_word: וַתִּשְׁתָּחוּ
  choice: se prosterna
  rationale: Le verbe décrit ici un geste corporel d’hommage et de supplication. « Se prosterner » est précis sans faire de la scène un acte de culte.
- source_word: הוֹשִׁיעָה
  choice: Sauve-moi
  rationale: L’impératif de יָשַׁע appelle au secours ou à la délivrance. Le complément « moi », implicite dans la requête adressée au roi, est nécessaire à une formulation française naturelle et conserve l’urgence de l’appel.
- source_word: הַמֶּלֶךְ
  choice: ô roi
  rationale: Dans cette apostrophe, « ô roi » rend la forme d’adresse solennelle et pressante de l’hébreu sans ajouter « mon », absent du texte.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le récit conserve la succession des gestes de supplication, tandis que « s’adressa » évite la répétition lourde de « dit… dit » en français. L’apostrophe « ô roi » maintient la solennité de la requête.
