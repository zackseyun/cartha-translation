base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: fr
  text: Car le roi écoutera pour délivrer sa servante de la main de l’homme qui cherche à nous détruire, mon fils et moi, ensemble, loin de l’héritage de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner l’héritage accordé par Dieu au sein d’Israël, ou l’héritage qui appartient à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison ou l’assurance qui découle des paroles précédentes.
- source_word: יִשְׁמַע
  choice: écoutera
  rationale: Dans ce contexte de requête royale, שמע implique non seulement entendre, mais prêter une oreille favorable, sans qu’il soit nécessaire de rendre explicitement « exaucera ».
- source_word: לְהַצִּיל
  choice: afin de délivrer
  rationale: L’infinitif hiphil de נצל exprime le fait d’arracher quelqu’un à un danger; « délivrer » conserve la gravité et le lien de but avec l’écoute du roi.
- source_word: אֲמָתוֹ
  choice: sa servante
  rationale: Le nom hébreu est féminin et constitue ici une formule de déférence employée par la femme devant le roi.
- source_word: מִכַּף הָאִישׁ
  choice: de la main de l’homme
  rationale: La traduction conserve l’image hébraïque de la « main » comme pouvoir ou emprise, image également naturelle en français biblique courant.
- source_word: לְהַשְׁמִיד אֹתִי וְאֶת־בְּנִי יַחַד
  choice: qui veut nous faire disparaître ensemble, mon fils et moi
  rationale: Cette formulation française rend le dessein hostile exprimé par l’infinitif et identifie clairement les deux personnes visées, tout en conservant l’accent de יַחַד.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: de l’héritage de Dieu
  rationale: Cette traduction proche de l’hébreu préserve l’ambiguïté entre l’héritage accordé par Dieu et ce qui constitue son propre héritage.
theological_decisions:
- issue: Sens de « l’héritage de Dieu »
  choice: Conserver la formulation ouverte « l’héritage de Dieu »
  alternative: « l’héritage accordé par Dieu » ou « le peuple qui appartient à Dieu »
  rationale: Le contexte évoque l’extinction d’une lignée et son retranchement de sa place en Israël, mais l’hébreu permet aussi de comprendre l’héritage comme ce qui appartient à Dieu. Le texte principal ne tranche donc pas.
translation_notes:
  register: Français moderne, digne et accessible. « Sa servante » maintient la déférence de la parole adressée au roi et rend explicitement le féminin de l’hébreu. La légère rupture entre « sa servante » et « mon fils et moi » reproduit le passage de la formule de cour à la parole personnelle.
