  text: וַ/יִּפֹּל֩ יוֹאָ֨ב אֶל פָּנָ֥י/ו אַ֛רְצָ/ה וַ/יִּשְׁתַּ֖חוּ וַ/יְבָ֣רֶךְ אֶת הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר יוֹאָ֡ב הַ/יּוֹם֩ יָדַ֨ע עַבְדְּ/ךָ֜ כִּי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁר עָשָׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר עבד/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: fr
  text: 'Joab se jeta alors face contre terre, se prosterna et bénit le roi. Puis il dit : « Aujourd’hui, ton serviteur sait que j’ai trouvé grâce à tes yeux, mon seigneur le roi, puisque le roi a accédé à la demande de son serviteur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a fait la parole de son serviteur » ou « a exécuté la parole de son serviteur ».'
    reason: La traduction principale explicite le sens contextuel de l’expression hébraïque, tandis que la note en conserve la formulation littérale.
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: se jeta face contre terre
  rationale: Cette formulation française naturelle restitue le mouvement et la posture de l’expression hébraïque, littéralement orientée « vers son visage, à terre ».
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna
  rationale: Dans ce contexte de cour, le verbe décrit un geste d’hommage devant un supérieur humain ; « se prosterna » conserve la force du geste sans le présenter comme un acte d’adoration divine.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: bénit le roi
  rationale: Le piel de ברך avec une personne pour objet signifie ici « bénir ». Cette traduction reste proche de l’hébreu, même si le contexte comporte aussi une nuance de gratitude.
- source_word: יָדַע עַבְדְּךָ
  choice: ton serviteur sait
  rationale: Le parfait exprime ici une certitude désormais acquise. Le présent français convient à la déclaration de Joab, et « ton serviteur » conserve la formule de déférence royale.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: j’ai trouvé grâce à tes yeux
  rationale: Cette tournure préserve l’image idiomatique hébraïque tout en demeurant claire et traditionnelle en français moderne.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: La formule rend le respect dû au souverain sans introduire de connotation cultuelle.
- source_word: אֲשֶׁר
  choice: puisque
  rationale: Le relatif introduit ici le fait qui fonde la certitude exprimée par Joab ; « puisque » en rend naturellement la valeur causale.
- source_word: עָשָׂה הַמֶּלֶךְ אֶת־דְּבַר עַבְדּוֹ
  choice: le roi a accédé à la demande de son serviteur
  rationale: L’expression signifie littéralement que le roi « a fait la parole » de son serviteur. Dans le contexte, elle indique qu’il a donné suite à sa requête ; la note conserve la forme littérale.
theological_decisions:
- issue: Nature de la prosternation devant le roi
  choice: « se prosterna », comme geste d’hommage royal
  alternative: « adora » le roi
  rationale: Le contexte décrit une marque de soumission et de respect envers un souverain humain, sans affirmer un acte de culte.
- issue: Interprétation de « faire la parole de son serviteur »
  choice: « a accédé à la demande de son serviteur »
  alternative: « a fait la parole de son serviteur »
  rationale: La traduction principale exprime le sens contextuel sans préciser davantage la nature de la demande ; la note signale l’expression littérale et préserve ainsi sa forme inhabituelle.
translation_notes:
  register: Français international moderne, digne et accessible. Les formules de cour (« ton serviteur », « mon seigneur le roi ») sont conservées pour rendre la déférence de Joab. Le tutoiement correspond au singulier hébreu de l’adresse au roi et évite d’introduire un vouvoiement absent du texte source.
