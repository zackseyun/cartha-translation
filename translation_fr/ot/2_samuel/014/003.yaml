  yaml_path: translation/ot/2_samuel/014/003.yaml
  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: fr
  text: Va ensuite trouver le roi et parle-lui ainsi. Joab mit les paroles dans la bouche de cette femme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « mettre les paroles dans la bouche » signifie ici que Joab fournit à cette femme les paroles qu’elle devait dire.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: Va ensuite trouver
  rationale: Dans cette suite d’instructions adressées à une femme, le parfait avec waw a une valeur directive et séquentielle. « Va ensuite trouver » exprime naturellement le déplacement vers la personne visée.
- source_word: אֶל־הַמֶּלֶךְ
  choice: le roi
  rationale: La préposition אֶל indique un mouvement vers le roi; en français, « trouver le roi » rend idiomatiquement l’ensemble du mouvement sans suggérer une simple localisation.
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: et parle-lui
  rationale: דבר avec אֶל signifie couramment « parler à ». L’impératif français conserve ici la force directive de la séquence.
- source_word: כַּדָּבָר הַזֶּה
  choice: ainsi
  rationale: Dans ce contexte, l’expression indique la manière ou le contenu du discours préparé. « Ainsi » est concis, naturel et ne réduit pas artificiellement דָּבָר à un seul « mot ».
- source_word: וַיָּשֶׂם
  choice: mit
  rationale: שׂים signifie « mettre, placer ». « Mit » préserve l’image concrète de l’expression hébraïque.
- source_word: אֶת־הַדְּבָרִים
  choice: les paroles
  rationale: Le pluriel désigne les propos précis fournis par Joab. « Les paroles » convient mieux que l’abstrait « le message » et s’accorde avec l’image de la bouche.
- source_word: בְּפִיהָ
  choice: dans la bouche
  rationale: La traduction conserve l’expression imagée hébraïque selon laquelle Joab fournit à la femme ce qu’elle doit dire; une note en explicite le sens dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’impératif rend clairement l’instruction adressée à la femme; « ainsi » évite une formulation pesante, tandis que l’image hébraïque de la bouche est conservée et expliquée.
