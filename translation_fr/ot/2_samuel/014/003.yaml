  source_fidelity: La séquence directive est bien rendue par « Va ... et parle-lui ainsi ». L’expression « mettre les paroles dans la bouche » préserve correctement l’image et le sens de l’hébreu. Toutefois, le pronom « lui » dans la seconde phrase peut grammaticalement renvoyer au roi, alors que le suffixe hébreu désigne sans ambiguïté la femme.
  naturalness: Le français est naturel, sobre et adapté au registre narratif. La reprise explicite « de cette femme » lève l’ambiguïté sans alourdir indûment le texte.
  terminology: « Le roi », « parler », « paroles » et « bouche » sont appropriés. La note devrait expliciter l’idiome sans surinterpréter son degré de précision.
