  naturalness: La révision est naturelle en français moderne international, concise et adaptée au ton direct et autoritaire du roi. « Ne te touchera plus » est idiomatique dans ce contexte et la note explicite l’éventuelle portée hostile.
  terminology: « Le roi », « amène-le-moi » et « ne te touchera plus » correspondent respectivement à הַמֶּלֶךְ, au hiphil causatif de בוא, et à la construction לֹא יֹסִיף עוֹד לָגַעַת. La note conserve sans surinterprétation l’ambiguïté de נגע.
