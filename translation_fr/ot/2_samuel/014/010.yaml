  yaml_path: translation/ot/2_samuel/014/010.yaml
  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: fr
  text: 'Le roi dit : « Quiconque te parlera, amène-le-moi, et il ne te touchera plus[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne s’en prendra plus à toi ». Le verbe hébreu signifie littéralement « toucher »; dans ce contexte, il peut désigner une intervention hostile ou un tort, et non un simple contact physique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Rend directement le nom défini et convient au contexte narratif.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: si quelqu’un te parle
  rationale: Le participe substantivé désigne toute personne qui viendrait lui parler dans ce contexte; cette formulation française exprime naturellement la portée ouverte de l’instruction.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: amène-le-moi
  rationale: Le hiphil de בוא a ici le sens causatif de faire venir quelqu’un, naturellement rendu par « amener ».
- source_word: וְלֹא יֹסִיף עוֹד
  choice: il ne… plus
  rationale: La combinaison de יסף et עוד indique la cessation ou la non-répétition de l’action.
- source_word: לָגַעַת בָּךְ
  choice: s’en prendre à toi
  rationale: Bien que נגע signifie littéralement « toucher », le contexte de protection contre une intervention hostile favorise en français l’expression « s’en prendre à », sans préciser indûment la forme du tort.
