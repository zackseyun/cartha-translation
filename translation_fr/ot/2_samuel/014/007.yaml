  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: fr
  text: 'Et voici que toute la famille s’est dressée contre ta servante et a dit : « Livre-nous celui qui a frappé son frère, afin que nous le mettions à mort pour la vie de son frère qu’il a tué ; nous ferons aussi périr l’héritier. » Ils éteindraient ainsi la braise qui me reste[a], ne laissant à mon mari ni nom ni descendance sur la face de la terre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon dernier charbon ardent ». L’hébreu emploie l’image d’une braise encore vive pour évoquer le dernier espoir de survie d’une lignée familiale.
    reason: lexical_alternative
  - marker: b
    text: L’expression « ni nom ni descendance » évoque la disparition de la mémoire familiale d’un homme et de sa lignée survivante, et non simplement la perte de sa réputation.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁפְחָתֶךָ
  choice: ta servante
  rationale: Le nom désigne explicitement une servante et sert ici d’auto-désignation déférente devant le roi. Le français permet de conserver naturellement le genre et l’humilité de l’expression.
- source_word: קָמָה ... עַל
  choice: s’est dressée contre
  rationale: Cette tournure rend l’action hostile exprimée par l’idiome hébreu, et non une simple position debout.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: toute la famille
  rationale: Le terme peut viser la famille étendue ou le clan. « Toute la famille » reste accessible et conserve l’étendue collective sans surdéterminer la structure sociale.
- source_word: תְּנִי
  choice: Livre-nous
  rationale: Dans ce contexte judiciaire et familial, il s’agit de remettre le fils aux personnes qui réclament sa mort. Le pronom « nous », implicite dans la situation d’énonciation, rend la demande idiomatique en français.
- source_word: מַכֵּה אָחִיו
  choice: celui qui a frappé son frère
  rationale: 'Le participe de נכה ne doit pas être rendu d’emblée par « meurtrier » : la proposition suivante précise que le coup a causé la mort. La progression du texte est ainsi préservée.'
- source_word: וּנְמִתֵהוּ
  choice: afin que nous le mettions à mort
  rationale: Le cohortatif exprime l’action projetée. « Mettre à mort » convient au ton judiciaire sans imposer la notion plus technique d’une exécution officielle.
- source_word: בְּנֶפֶשׁ אָחִיו
  choice: pour la vie de son frère
  rationale: La formulation conserve de près l’idiome de rétribution vie pour vie et sa tension juridique.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: nous supprimerons aussi l’héritier
  rationale: « Supprimer » exprime ici l’élimination violente du fils survivant, tandis que « aussi » garde l’idée que sa qualité d’héritier constitue un enjeu supplémentaire.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: Ils éteindraient ainsi la braise qui me reste
  rationale: La métaphore de la braise encore vive représente le dernier descendant et l’ultime espoir de continuité de la maison. Elle est conservée dans le texte plutôt qu’explicitée à sa place.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: ni nom ni descendance
  rationale: « Nom » préserve la mémoire et l’identité familiale ; dans ce contexte, שְׁאֵרִית désigne ce qui subsisterait de la lignée. « Descendance » communique naturellement cette portée en français.
theological_decisions:
- issue: Rétribution pour la mort du frère et possible intérêt successoral de la famille
  choice: Conserver côte à côte la justification « pour la vie de son frère » et l’annonce de la suppression de « l’héritier »
  alternative: Présenter explicitement les parents soit comme de légitimes vengeurs du sang, soit comme uniquement motivés par l’héritage
  rationale: Le verset laisse entendre à la fois une revendication de rétribution et la conséquence intéressée de l’élimination de l’héritier. La traduction ne tranche pas au-delà de ce que dit le récit.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » conserve la fonction présentative de וְהִנֵּה sans archaïsme excessif. Le discours direct reste grave mais compréhensible, et la métaphore centrale de la braise est maintenue.
