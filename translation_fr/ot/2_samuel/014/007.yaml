  to: 'Et voici que toute la famille s’est dressée contre ta servante et a dit : « Livre-nous celui qui a frappé son frère, afin que nous le mettions à mort pour la vie de son frère qu’il a tué ; nous ferons aussi périr l’héritier. » Ils éteindraient ainsi la braise qui me reste[a], ne laissant à mon mari ni nom ni descendance sur la face de la terre[b].'
