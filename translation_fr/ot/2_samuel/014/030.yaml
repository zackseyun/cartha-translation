base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: fr
  text: 'Alors Absalom dit à ses serviteurs : « Voyez, le champ de Joab est juste à côté du mien[a], et il y a là de l’orge. Allez y mettre le feu. » Les serviteurs d’Absalom mirent le feu au champ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le champ de Joab est à ma main », expression qui signifie qu’il est voisin de la propriété d’Absalom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקַת
  choice: champ
  rationale: Dans ce contexte agricole, le nom désigne une parcelle cultivée appartenant à Joab. « Champ » est le terme français le plus naturel.
- source_word: אֶל יָדִי
  choice: juste à côté du mien
  rationale: L’expression signifie littéralement « à ma main », mais décrit ici la proximité immédiate entre deux propriétés.
- source_word: שְׂעֹרִים
  choice: orge
  rationale: Le pluriel hébreu désigne collectivement l’orge cultivée dans le champ; le français emploie naturellement le singulier collectif.
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: y mettre le feu / mirent le feu au champ
  rationale: Le hifil de יצת exprime l’action d’allumer ou d’incendier. Ces formulations françaises conservent le sens causatif et évitent une répétition maladroite.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: ses serviteurs / les serviteurs d’Absalom
  rationale: עבד peut désigner des esclaves, des serviteurs ou des agents. Le contexte ne précise pas leur statut juridique; « serviteurs » préserve cette latitude.
- source_word: רְאוּ
  choice: Voyez
  rationale: L’impératif attire l’attention des serviteurs sur le champ voisin et convient à un registre narratif digne et naturel.
- source_word: לְכוּ
  choice: Allez
  rationale: Impératif direct de mouvement précédant l’ordre d’incendier le champ.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’explicitation du sujet « Absalom » évite l’ambiguïté du pronom à l’ouverture du verset isolé, conformément au contexte immédiat. Le marqueur [a] est placé après l’expression qu’il explique.
