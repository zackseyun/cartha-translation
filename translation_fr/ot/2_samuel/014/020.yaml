  text: לְ/בַ/עֲב֤וּר סַבֵּב֙ אֶת פְּנֵ֣י הַ/דָּבָ֔ר עָשָׂ֛ה עַבְדְּ/ךָ֥ יוֹאָ֖ב אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/אדֹנִ֣/י חָכָ֗ם כְּ/חָכְמַת֙ מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים לָ/דַ֖עַת אֶֽת כָּל אֲשֶׁ֥ר בָּ/אָֽרֶץ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: fr
  text: C’est afin de donner une autre tournure à l’affaire[a] que ton serviteur Joab a fait cela. Mais mon seigneur est sage, d’une sagesse semblable à celle d’un ange de Dieu[b], pour connaître tout ce qui se passe dans le pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faire tourner la face de l’affaire ». On pourrait aussi traduire : « retourner l’affaire » ou « changer l’aspect de l’affaire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de l’ange de Dieu ».'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Ou : « sur la terre ». Dans ce contexte, « le pays » désigne probablement le territoire ou le royaume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: C’est afin de
  rationale: La locution introduit le but. Cette tournure française rend clairement la visée intentionnelle tout en s’intégrant naturellement à la phrase emphatique.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: donner une autre tournure à l’affaire
  rationale: L’expression conserve l’idée hébraïque de faire tourner ou changer la « face » d’une affaire, sans produire en français un calque obscur. Elle peut évoquer aussi bien une modification de la présentation que de l’orientation du dossier.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: a fait cela
  rationale: Rendu français direct et naturel, qui évite la répétition lourde d’« affaire » tout en gardant le sens du verbe et de son complément.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Cette formule respecte l’adresse déférente employée à la cour, sans mettre indûment l’accent sur le statut servile.
- source_word: וַאדֹנִי חָכָם
  choice: Mais mon seigneur est sage
  rationale: « Mais » marque la transition légèrement contrastive entre l’explication de la manœuvre de Joab et l’éloge de la perspicacité du roi.
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: d’une sagesse semblable à celle d’un ange de Dieu
  rationale: Le comparatif est maintenu explicitement. L’indéfini français convient à une comparaison de qualité, tandis qu’une note signale la possibilité formelle de « l’ange de Dieu ».
- source_word: לָדַעַת
  choice: pour connaître
  rationale: L’infinitif hébreu exprime ici la capacité ou le résultat associé à la sagesse; le français « pour connaître » en conserve la construction sans trancher davantage.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: tout ce qui se passe dans le pays
  rationale: Dans ce contexte royal, אֶרֶץ désigne vraisemblablement le territoire ou le royaume. « Ce qui se passe » explicite naturellement en français les réalités que le roi est censé connaître, sans lui attribuer nécessairement une connaissance universelle.
theological_decisions:
- issue: Portée de la comparaison avec l’ange de Dieu
  choice: Une comparaison honorifique exprimant une sagesse et une perspicacité extraordinaires
  alternative: Une comparaison hyperbolique suggérant un savoir quasi divin
  rationale: Le texte compare la sagesse du roi à celle d’un ange de Dieu, mais n’identifie pas David à un être céleste et ne lui attribue pas explicitement l’omniscience.
- issue: Détermination de מַלְאַךְ הָאֱלֹהִים
  choice: un ange de Dieu
  alternative: l’ange de Dieu
  rationale: En français, l’indéfini rend naturellement la valeur comparative et évite de désigner sans certitude un ange particulier. La détermination grammaticale possible de la chaîne construite est néanmoins conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le langage déférent de la cour ainsi que la comparaison élevée, sans transformer celle-ci en affirmation ontologique ni en attribution explicite d’omniscience.
