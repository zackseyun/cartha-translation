  yaml_path: translation/ot/2_samuel/014/027.yaml
  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
translation:
  language: fr
  text: Absalom eut trois fils et une fille. Elle s’appelait Tamar et était très belle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « une femme belle d’apparence ».'
    reason: La note préserve la formulation explicite de l’hébreu, qui décrit Tamar comme une femme belle quant à son apparence, tandis que le texte principal emploie une expression française naturelle.
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: naquirent à Absalom
  rationale: Le nifal de ילד avec ל marque ici la naissance et la filiation. Cette tournure concise reste naturelle dans un registre narratif français digne.
- source_word: שְׁלוֹשָׁה בָנִים וּבַת אַחַת
  choice: trois fils et une fille
  rationale: La traduction conserve la distinction explicite entre les fils et la fille ainsi que les nombres du texte hébreu.
- source_word: וּשְׁמָהּ תָּמָר
  choice: Elle s’appelait Tamar
  rationale: Le suffixe féminin renvoie à la fille qui vient d’être mentionnée. « Elle s’appelait » est l’expression idiomatique moderne équivalant à « son nom était ».
- source_word: הִיא הָיְתָה אִשָּׁה יְפַת מַרְאֶה
  choice: elle était d’une grande beauté
  rationale: L’expression hébraïque qualifie son apparence physique. Cette formulation française est naturelle et rend clairement le sens sans ajouter de trait absent du texte.
