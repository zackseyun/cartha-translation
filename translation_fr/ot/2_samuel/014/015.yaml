  to: Et maintenant que je suis venue parler de cette affaire au roi, mon seigneur, c’est parce que le peuple m’a effrayée[a]. Ta servante s’est dit qu’elle demanderait au roi la permission de parler ; peut-être le roi donnera-t-il suite à la parole de sa servante[b].
  rationale: La première phrase est corrigée pour exprimer l’explication introduite par l’hébreu sans créer une condition. La seconde rend explicitement, en français naturel, la parole par laquelle la servante envisage de demander à parler au roi, avec la nuance suppliante de נא. « Donner suite à la parole » conserve la portée générale de עשה tout en évitant un calque français peu naturel.
