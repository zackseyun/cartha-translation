source:
  edition: WLC
  text: וְ֠/עַתָּה אֲשֶׁר בָּ֜אתִי לְ/דַבֵּ֨ר אֶל הַ/מֶּ֤לֶךְ אֲדֹנִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּ֥י יֵֽרְאֻ֖/נִי הָ/עָ֑ם וַ/תֹּ֤אמֶר שִׁפְחָֽתְ/ךָ֙ אֲדַבְּרָה נָּ֣א אֶל הַ/מֶּ֔לֶךְ אוּלַ֛י יַעֲשֶׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר אֲמָתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: fr
  text: Et maintenant que je suis venue parler de cette affaire au roi, mon seigneur, c’est parce que le peuple m’a effrayée[a]. Ta servante s’est dit qu’elle demanderait au roi la permission de parler ; peut-être le roi donnera-t-il suite à la parole de sa servante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le peuple m’a fait peur ». Le verbe hébreu a ici un sens causatif : ce n’est pas le peuple qui a peur d’elle.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le roi fera la parole de sa servante ». L’expression peut désigner le fait de donner suite à sa parole ou à sa requête.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et la transition vers l’explication présente.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר ... כִּי
  choice: si je suis venue parler… c’est parce que
  rationale: Cette construction française rend naturellement la relation explicative entre la venue de la femme et la crainte causée par le peuple.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: au roi mon seigneur
  rationale: Maintient le titre royal et la formule de déférence sans alourdir le français.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: de cette affaire
  rationale: דָּבָר désigne ici l’affaire ou la requête exposée au roi, et non un simple mot.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: c’est parce que le peuple m’a fait peur
  rationale: 'Le piel de ירא a ici une valeur causative : le peuple a provoqué sa peur.'
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: Ta servante s’est dit
  rationale: La femme parle d’elle-même avec la déférence attendue à la cour ; « s’est dit » introduit naturellement en français la délibération citée.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: Je vais donc parler au roi
  rationale: Le cohortatif avec נָא exprime ici une résolution présentée avec modestie ; « donc » évite de transformer artificiellement cette parole intérieure en demande adressée à un interlocuteur.
- source_word: אוּלַי
  choice: peut-être
  rationale: Conserve sans la réduire l’incertitude exprimée par la femme.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: peut-être le roi fera-t-il ce que lui demande sa servante
  rationale: Rend en français idiomatique l’expression « faire la parole de sa servante », c’est-à-dire donner effet à sa parole ou à sa requête, tout en conservant la formulation prudente.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le discours de cour reste respectueux sans employer de tournures archaïques. Les deux désignations hébraïques féminines de servante (שִׁפְחָה et אָמָה) sont rendues par « servante », car le contexte ne demande pas de marquer une distinction.
