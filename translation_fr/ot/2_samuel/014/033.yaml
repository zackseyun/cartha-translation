base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: fr
  text: Joab se rendit donc auprès du roi et lui fit son rapport. Alors le roi fit appeler Absalom[a]. Celui-ci se présenta devant le roi et se prosterna devant lui, face contre terre. Puis le roi donna un baiser à Absalom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « convoqua Absalom ».'
    reason: lexical_alternative
  - marker: b
    text: Ce baiser du roi marque probablement une réconciliation ou un retour en faveur, bien que le texte dise seulement qu’il lui donna un baiser.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: Joab se rendit donc auprès du roi
  rationale: בוא décrit le déplacement de Joab vers le roi. « Se rendit auprès du roi » est naturel en français dans une scène de cour et évite l’ambiguïté possible de « vint » hors d’un point de vue explicitement établi.
- source_word: וַיַּגֵּד לוֹ
  choice: lui fit son rapport
  rationale: Le hiphil de נגד signifie ici rapporter ou informer. « Lui fit son rapport » convient au cadre royal sans ajouter le contenu, que l’hébreu ne précise pas.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: le roi fit appeler Absalom
  rationale: Dans ce contexte, קרא אל indique que le roi fait venir Absalom auprès de lui. Le sujet implicite est naturellement le roi, tandis que « fit appeler » exprime clairement la convocation sans lourdeur.
- source_word: וַיִּשְׁתַּחוּ לוֹ עַל־אַפָּיו אַרְצָה
  choice: se prosterna devant lui, face contre terre
  rationale: שחה désigne une profonde marque de respect; עַל־אַפָּיו אַרְצָה en décrit la posture physique. Cette formulation française restitue à la fois le geste et son orientation vers le roi.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: לפני situe Absalom en présence du roi. Dans la phrase française, cette idée est déjà exprimée par « se présenta devant le roi » et n’a pas besoin d’être répétée après « se prosterna ».
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: le roi donna un baiser à Absalom
  rationale: נשק désigne un baiser réel. « Donna un baiser » est plus précis que « embrassa », qui peut aussi évoquer une étreinte en français moderne, et n’explicite pas la portée symbolique du geste.
theological_decisions:
- issue: Portée du baiser du roi
  choice: Décrire littéralement le baiser sans affirmer dans le texte principal une réconciliation complète.
  alternative: Présenter le geste comme un signe formel de réconciliation ou de rétablissement d’Absalom.
  rationale: Le récit peut suggérer un retour en faveur ou une réconciliation, mais l’hébreu affirme seulement que le roi donna un baiser à Absalom. La traduction conserve cette réserve narrative et signale l’interprétation probable en note.
translation_notes:
  register: Français international moderne, narratif et digne. Les enchaînements « alors », « celui-ci » et « puis » clarifient les sujets implicites de l’hébreu sans modifier la progression du récit. La répétition hébraïque de « devant le roi » est légèrement allégée pour une lecture naturelle, tout en conservant pleinement la scène d’audience et la prosternation.
