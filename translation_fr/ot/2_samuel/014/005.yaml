  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: fr
  text: 'Le roi lui demanda[a] : « Qu’est-ce qui ne va pas ? » Elle répondit : « En vérité, je suis veuve[b], et mon mari est mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qu’y a-t-il pour toi ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Hélas, je suis veuve. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  choice: Qu’est-ce qui ne va pas ?
  rationale: L’expression idiomatique signifie littéralement « quoi pour toi ? » et demande ce qui arrive à la personne ou ce qui la trouble. Cette formulation est naturelle en français moderne tout en conservant la portée personnelle de la question.
- source_word: אֲבָל
  choice: En vérité
  rationale: Ici, la particule a une valeur affirmative ou emphatique plutôt qu’adversative. « En vérité » rend cette insistance sans introduire un contraste absent.
- source_word: אִשָּׁה אַלְמָנָה
  choice: je suis veuve
  rationale: Le syntagme hébreu « une femme veuve » se rend naturellement en français par « je suis veuve ».
- source_word: וַיָּמָת אִישִׁי
  choice: mon mari est mort
  rationale: Dans ce contexte, אִישִׁי désigne le mari. Le passé composé exprime directement l’événement rapporté et son résultat présent.
- source_word: הַמֶּלֶךְ
  choice: Le roi
  rationale: Traduction directe du nom défini.
- source_word: וַתֹּאמֶר
  choice: Elle répondit
  rationale: Bien que le verbe signifie littéralement « elle dit », « elle répondit » explicite naturellement en français la relation avec la question précédente sans changer le sens.
