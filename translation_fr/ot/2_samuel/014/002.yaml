  register: Français international moderne, naturel et digne. Le discours direct emploie le tutoiement, conforme à l’adresse au singulier en hébreu. « Teqoa » suit une translittération française courante; « femme sage » conserve l’ambiguïté entre sagesse, intelligence pratique et habileté.
