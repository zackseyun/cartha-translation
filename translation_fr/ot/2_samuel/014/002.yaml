base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: fr
  text: 'Joab envoya chercher à Teqoa une femme sage. Il lui dit : « Je t’en prie, fais semblant d’être en deuil[a] : mets des vêtements de deuil, ne t’enduis pas d’huile[b], et présente-toi comme une femme qui est depuis de nombreux jours en deuil d’un mort[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sois en deuil » ou « prends l’apparence d’une femme en deuil ». Le verbe hébreu signifie « être en deuil », mais le contexte montre que Joab lui demande d’en jouer le rôle.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ne t’oins pas d’huile ». L’application d’huile sur le corps faisait partie des soins ordinaires et pouvait évoquer le bien-être ou la fête. S’en abstenir était un signe de deuil.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « comme une femme qui, depuis de nombreux jours, est en deuil pour un mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: Teqoa
  rationale: Translittération française usuelle du nom de lieu, conservant le qoph par « q ».
- source_word: אִשָּׁה חֲכָמָה
  choice: une femme sage
  rationale: « Sage » préserve la portée large de חֲכָמָה, qui peut inclure ici intelligence pratique et habileté, sans réduire le terme à la ruse.
- source_word: הִתְאַבְּלִי נָא
  choice: Je t’en prie, fais semblant d’être en deuil
  rationale: Le verbe signifie littéralement « être en deuil », tandis que le contexte montre qu’il s’agit d’endosser ce rôle dans une mise en scène. « Fais semblant » explicite cette valeur pragmatique.
- source_word: בִגְדֵי אֵבֶל
  choice: des vêtements de deuil
  rationale: Expression naturelle et proche de l’hébreu « vêtements de deuil ».
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: ne te parfume pas d’huile
  rationale: סוך désigne l’application d’huile sur le corps, pratique de toilette et de bien-être. « Se parfumer d’huile » communique cette coutume plus naturellement que le terme cultuel possible « oindre ».
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: qui porte depuis longtemps le deuil d’un mort
  rationale: « Depuis longtemps » rend l’expression durative זֶה יָמִים רַבִּים, et « porter le deuil » exprime naturellement l’état continu indiqué par le participe.
