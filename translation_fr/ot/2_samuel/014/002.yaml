  source_fidelity: Le sens général est bien rendu, y compris la mise en scène du deuil, explicitée de façon légitime par le contexte. Toutefois, « se parfumer d’huile » réduit indûment l’application d’huile à l’usage de parfum ; l’hébreu mentionne l’onction ou l’application d’huile comme soin corporel, sans préciser qu’elle est parfumée.
  naturalness: Le français est fluide et d’un registre approprié. « Ne t’enduis pas d’huile » est à la fois plus exact et suffisamment naturel dans ce contexte. « Depuis de nombreux jours » rend plus précisément l’expression temporelle hébraïque que « depuis longtemps ».
  terminology: « Teqoa », « femme sage » et « vêtements de deuil » conviennent. « Être en deuil d’un mort » conserve l’indéfini de מֵת sans identifier la personne décédée.
