- from: 'Joab envoya donc chercher à Teqoa une femme sage. Il lui dit : « Je t’en prie, fais semblant d’être en deuil[a] : mets des vêtements de deuil, ne te parfume pas d’huile[b], et présente-toi comme une femme qui porte depuis longtemps le deuil d’un mort[c]. »'
  to: 'Joab envoya chercher à Teqoa une femme sage. Il lui dit : « Je t’en prie, fais semblant d’être en deuil[a] : mets des vêtements de deuil, ne t’enduis pas d’huile[b], et présente-toi comme une femme qui est depuis de nombreux jours en deuil d’un mort[c]. »'
