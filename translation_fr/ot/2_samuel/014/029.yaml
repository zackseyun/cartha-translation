base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: fr
  text: Absalom envoya donc chercher Joab afin que celui-ci l’envoie auprès du roi, mais Joab ne voulut pas venir auprès de lui. Absalom envoya de nouveau chercher Joab, pour la deuxième fois, mais Joab ne voulut pas venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: Absalom fit donc appeler Joab
  rationale: Dans cette construction, Absalom envoie vraisemblablement un message à Joab pour le faire venir. « fit appeler » exprime naturellement cette valeur contextuelle sans confondre cet envoi initial avec la mission envisagée auprès du roi.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: pour que celui-ci l’envoie auprès du roi
  rationale: Le pronom sujet implicite renvoie à Joab et le complément « l’ » à Absalom. La formulation conserve le rôle de médiateur de Joab et traduit אֶל par l’expression française naturelle « auprès de » pour l’accès à une personne royale.
- source_word: וְלֹא אָבָה לָבוֹא אֵלָיו
  choice: mais Joab ne voulut pas venir le voir
  rationale: אָבָה signifie consentir ou vouloir. « ne voulut pas » conserve cette nuance sans renforcer le texte en « refusa ». Le nom « Joab » lève en français une ambiguïté pronominale gênante, tandis que « venir le voir » rend naturellement la direction vers Absalom.
- source_word: וַיִּשְׁלַח עוֹד שֵׁנִית
  choice: Absalom le fit appeler encore une deuxième fois
  rationale: « encore une deuxième fois » représente à la fois עוֹד et שֵׁנִית et maintient l’insistance légèrement redondante de l’hébreu.
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: fit donc appeler… mais… fit appeler encore… mais
  rationale: La répétition et les contrastes du récit hébreu sont conservés afin de faire ressortir l’insistance d’Absalom et la non-coopération persistante de Joab.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les référents des pronoms sont explicités seulement là où le français risquerait de faire croire que Joab devait envoyer une tierce personne au roi ou qu’Absalom refusait de venir. La répétition de la seconde convocation est volontairement maintenue.
