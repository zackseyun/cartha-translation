    rationale: Cette expression est naturelle, mais « voir » n’est pas exprimé dans l’hébreu, qui indique seulement le déplacement vers Absalom. « Venir auprès de lui » est plus proche du texte.
  - severity: medium
    issue: « encore une deuxième fois »
    rationale: La redondance cherche à refléter l’hébreu, mais elle n’est pas idiomatique. « De nouveau … pour la deuxième fois » conserve les deux éléments de répétition sans maladresse.
