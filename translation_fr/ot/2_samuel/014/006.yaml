base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: fr
  text: Ta servante avait deux fils[a]. Tous les deux se sont battus dans un champ, et personne n’était là pour les séparer[b]. Alors l’un a frappé l’autre et l’a tué.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est une manière humble, pour cette femme, de parler d’elle-même devant le roi.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il n’y avait personne pour délivrer entre eux », c’est-à-dire personne pour intervenir et les séparer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: Ta servante
  rationale: שִׁפְחָה désigne une servante et sert ici de formule féminine de déférence envers le roi. « Ta servante » est naturel, digne et conserve le genre de la locutrice.
- source_word: שְׁנֵי בָנִים
  choice: deux fils
  rationale: בָנִים désigne ici précisément deux descendants masculins.
- source_word: וַיִּנָּצוּ שְׁנֵיהֶם
  choice: Tous les deux se sont battus
  rationale: Le verbe נצה exprime ici un affrontement, probablement physique; l’issue mortelle favorise « se sont battus » plutôt que le plus faible « se sont disputés ».
- source_word: בַּשָּׂדֶה
  choice: dans les champs
  rationale: Dans ce contexte narratif, « dans les champs » rend naturellement le lieu ouvert ou la campagne exprimés par בַּשָּׂדֶה.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: sans que personne soit là pour les séparer
  rationale: מַצִּיל signifie littéralement une personne qui délivre ou arrache au danger; entre deux combattants, il s’agit de quelqu’un qui intervient pour les séparer.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: Alors l’un a frappé l’autre
  rationale: נכה signifie « frapper ». Cette traduction conserve la progression du récit sans préciser indûment la nature ou le nombre des coups.
- source_word: וַיָּמֶת אֹתוֹ
  choice: et l’a tué
  rationale: 'La construction avec le pronom objet a ici un sens causatif: il a causé sa mort. « L’a tué » est l’expression française directe et naturelle.'
