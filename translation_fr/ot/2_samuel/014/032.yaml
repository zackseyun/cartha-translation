  text: וַ/יֹּ֣אמֶר אַבְשָׁל֣וֹם אֶל יוֹאָ֡ב הִנֵּ֣ה שָׁלַ֣חְתִּי אֵלֶ֣י/ךָ לֵ/אמֹ֡ר בֹּ֣א הֵ֠נָּה וְ/אֶשְׁלְחָה֩ אֹתְ/ךָ֨ אֶל הַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר לָ֤/מָּה בָּ֨אתִי֙ מִ/גְּשׁ֔וּר ט֥וֹב לִ֖/י עֹ֣ד אֲנִי שָׁ֑ם וְ/עַתָּ֗ה אֶרְאֶה֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/אִם יֶשׁ בִּ֥/י עָוֺ֖ן וֶ/הֱמִתָֽ/נִי־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: fr
  text: 'Absalom dit à Joab : « Écoute, je t’ai fait dire : “Viens ici, pour que je t’envoie auprès du roi, pour dire : ‘Pourquoi suis-je venu de Gueshour ? Il vaudrait mieux pour moi être encore là-bas[a].’” Maintenant, que je voie le visage du roi[b] ! Et s’il y a en moi quelque faute, qu’il me mette à mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition hébraïque est elliptique ; on peut aussi comprendre : « Il aurait mieux valu pour moi rester là-bas. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que je voie le visage du roi », expression qui signifie être admis en sa présence.'
    reason: idiom_explanation
lexical_decisions:
- source_word: הִנֵּה
  choice: Écoute
  rationale: Marque naturellement, en français actuel, l’appel d’Absalom à l’attention de Joab, sans l’archaïsme de « voici » dans cet emploi.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: je t’ai fait dire
  rationale: Dans ce contexte, Absalom a envoyé un message à Joab. Cette tournure française exprime clairement la transmission d’une convocation.
- source_word: בֹּא הֵנָּה
  choice: Viens ici
  rationale: Reproduit directement l’impératif et l’adverbe déictique.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: pour que je t’envoie auprès du roi
  rationale: Le cohortatif exprime ici le but de la convocation. « Auprès du roi » convient à l’idée d’une mission auprès de lui.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: Pourquoi suis-je revenu de Gueshour ?
  rationale: Le passé composé conserve le lien avec la situation présente. « Revenu » rend naturellement le mouvement depuis le lieu d’exil, sans suggérer qu’Absalom aurait été ramené contre son gré.
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: Il vaudrait mieux pour moi être encore là-bas
  rationale: La formulation garde le caractère comparatif et l’idée d’être toujours à Gueshour, tout en complétant en français la proposition elliptique de l’hébreu.
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Signale le passage de la plainte à l’exigence sans introduire un lien causal absent du texte.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: que je voie le visage du roi
  rationale: Conserve l’image hébraïque tout en formulant naturellement la demande énergique d’Absalom.
- source_word: עָוֺן
  choice: quelque faute
  rationale: Le nom peut désigner la faute et la culpabilité qui en découle. Cette expression convient au contexte judiciaire sans imposer une terminologie doctrinale plus étroite.
- source_word: וֶהֱמִתָנִי
  choice: qu’il me mette à mort
  rationale: Rend de manière idiomatique et solennelle la forme causative du verbe « mourir ».
theological_decisions:
- issue: Portée de עָוֺן
  choice: s’il y a en moi quelque faute
  alternative: si je suis coupable
  rationale: La traduction retenue préserve la formulation nominale et la tension entre faute commise et culpabilité, au lieu de réduire le propos à un verdict déjà formulé.
translation_notes:
  register: Français international moderne, direct et digne. Le discours emboîté reste lisible grâce à une ponctuation hiérarchisée. L’image du « visage du roi » est conservée dans le texte et expliquée en note.
