base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: fr
  text: 'Alors la femme dit : « Pourquoi donc as-tu conçu une telle chose contre le peuple de Dieu ? Car, en prononçant cette parole, le roi est comme un coupable[a], puisque le roi n’a pas fait revenir son exilé[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est semblable à un coupable » ; par son propre jugement, le roi se place dans la situation d’un coupable.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « son banni ». L’expression peut désigner celui qui est banni loin de lui ou celui qu’il a lui-même banni.'
    reason: source_ambiguity
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: as-tu conçu
  rationale: Le verbe peut exprimer le fait de penser, projeter ou concevoir. Ici, « conçu » garde l’idée d’une politique délibérée sans surcharger le texte d’une intention malveillante explicite.
- source_word: עַל עַם אֱלֹהִים
  choice: contre le peuple de Dieu
  rationale: Avec חָשַׁב et dans ce contexte de reproche, עַל a une valeur adverse. La formulation conserve aussi la portée collective explicite de l’hébreu.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: En prononçant cette parole, le roi
  rationale: 'Le מ devant l’infinitif peut indiquer la circonstance ou le moyen : par son propre jugement, le roi s’implique lui-même.'
- source_word: כְּאָשֵׁם
  choice: se rend comme coupable
  rationale: « Comme » préserve la comparaison marquée par כְּ, tandis que « se rend » exprime naturellement en français l’effet accusateur de la parole prononcée.
- source_word: לְבִלְתִּי הָשִׁיב
  choice: puisque ... ne fait pas revenir
  rationale: La construction donne le motif de l’accusation. Le présent rend l’état de fait reproché au roi, sans exclure la portée résultative.
- source_word: נִדְּחוֹ
  choice: celui qu’il a banni
  rationale: Cette formulation naturelle conserve le singulier et rend la relation indiquée par le suffixe. Une note signale l’ambiguïté possible entre possession et agent du bannissement.
theological_decisions:
- issue: Portée de « le peuple de Dieu »
  choice: Conserver exactement la désignation collective « le peuple de Dieu ».
  alternative: Préciser « Israël » ou réduire la référence à Absalom et à la maison royale.
  rationale: L’hébreu formule le reproche en termes collectifs et théologiques. Le contexte concerne Absalom, mais la traduction ne doit pas réduire la portée rhétorique du propos.
- issue: Degré de culpabilité exprimé par כְּאָשֵׁם
  choice: 'Préserver la comparaison : « comme coupable ».'
  alternative: 'Affirmer directement : « le roi est coupable » ou « se condamne lui-même ».'
  rationale: La préposition comparative כְּ doit rester perceptible. Le raisonnement implique une auto-incrimination, mais le texte l’exprime sous forme comparative.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement correspond à l’adresse directe au roi dans le récit. La répétition de « le roi » est maintenue afin de préserver l’insistance rhétorique de l’hébreu.
