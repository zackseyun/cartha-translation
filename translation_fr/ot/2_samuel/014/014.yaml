  variant: modern international French
source:
  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: fr
  text: 'Car nous devons tous mourir : nous sommes comme de l’eau répandue à terre, qu’on ne peut plus recueillir. Pourtant, Dieu n’ôte pas la vie[a] ; il conçoit des plans afin que celui qui est banni ne reste pas éloigné de lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu ne favorise personne. » La proposition hébraïque est difficile et peut être comprise autrement.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « afin que le banni ne soit pas chassé loin de lui. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui soutient l’appel de la femme et maintient le lien argumentatif avec le contexte précédent.
- source_word: מוֹת נָמוּת
  choice: nous devons tous mourir
  rationale: L’infinitif absolu suivi de l’imparfait souligne la certitude inéluctable de la mort. Cette formulation française naturelle rend cette force sans reproduire servilement l’expression hébraïque.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: nous sommes comme de l’eau répandue à terre
  rationale: L’image évoque le caractère irréversible de la mort. « Répandue à terre » s’accorde naturellement avec l’impossibilité de recueillir ensuite cette eau.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: qu’on ne peut plus recueillir
  rationale: Le nifal exprime ici la non-récupération de l’eau. « Ne peut plus » fait ressortir l’irréversibilité suggérée par l’image et le contexte.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Pourtant, Dieu n’ôte pas la vie
  rationale: La proposition est difficile. Dans le contexte de la mort et du rappel du banni, נֶפֶשׁ désigne vraisemblablement la vie ou la personne vivante, et נָשָׂא est compris au sens d’ôter. « Pourtant » marque le contraste avec la mortalité humaine.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: il conçoit des plans
  rationale: La construction avec des mots de même racine exprime une action réfléchie et intentionnelle. Cette formulation actuelle conserve l’idée de planification.
- source_word: לְבִלְתִּי יִדַּח
  choice: afin que … ne reste pas éloigné
  rationale: Le nifal de נדח peut décrire le fait d’être chassé ou banni. Dans ce contexte de restauration, cette formulation exprime l’état d’éloignement et sa cessation visée.
- source_word: מִמֶּנּוּ נִדָּח
  choice: celui qui est banni … de lui
  rationale: La formulation restitue le singulier hébreu et maintient explicitement la relation personnelle exprimée par מִמֶּנּוּ.
theological_decisions:
- issue: Sens de וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Dieu n’ôte pas la vie
  alternative: Dieu ne favorise personne
  rationale: Le sens retenu s’intègre au contraste entre la mort irréversible des humains et l’action divine en faveur du banni. Toutefois, l’hébreu est difficile et peut être compris comme une déclaration sur l’impartialité divine ; cette ambiguïté est conservée en note.
- issue: Portée de לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח
  choice: afin que celui qui est banni ne reste pas éloigné de lui
  alternative: afin que le banni ne soit pas chassé loin de lui
  rationale: Le texte principal met en relief la restauration d’une personne déjà bannie, ce qui convient au contexte. La solution plus directement passive reste possible et figure en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme proverbial de l’image est préservé, tandis que les deux difficultés réelles de l’hébreu sont signalées sans imposer une résolution confessionnelle.
