source:
  edition: WLC
  text: וּ/כְ/אַבְשָׁל֗וֹם לֹא הָיָ֧ה אִישׁ יָפֶ֛ה בְּ/כָל יִשְׂרָאֵ֖ל לְ/הַלֵּ֣ל מְאֹ֑ד מִ/כַּ֤ף רַגְל/וֹ֙ וְ/עַ֣ד קָדְקֳד֔/וֹ לֹא הָ֥יָה ב֖/וֹ מֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: fr
  text: Dans tout Israël, aucun homme n’était aussi beau qu’Absalom, qui recevait de très grands éloges[a]. De la plante de ses pieds au sommet de son crâne, il n’avait aucun défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui était extrêmement loué ». L’expression hébraïque souligne le degré exceptionnel des éloges suscités par son apparence.
    reason: alternative_lexicale
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: qu’Absalom
  rationale: Dans cette construction comparative, le préfixe כְּ rattache Absalom au constat qu’aucun homme ne l’égalait; le français l’intègre naturellement après « aussi beau ».
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: Dans tout Israël, aucun homme n’était aussi beau
  rationale: 'La tournure négative exprime ici une comparaison superlative: personne en Israël n’égalait Absalom par sa beauté.'
- source_word: יָפֶה
  choice: beau
  rationale: « Beau » est le terme français courant et digne pour décrire l’apparence physique remarquable d’un homme.
- source_word: לְהַלֵּל מְאֹד
  choice: qui recevait de très grands éloges
  rationale: Cette formulation conserve l’idée d’éloges exprimés et l’intensité de מְאֹד, sans réduire le propos à une simple appréciation intérieure.
- source_word: מִכַּף רַגְלוֹ
  choice: De la plante de ses pieds
  rationale: Avec « pied », כַּף désigne idiomatiquement la plante; le pluriel est naturel en français dans cette expression corporelle.
- source_word: וְעַד קָדְקֳדוֹ
  choice: au sommet de son crâne
  rationale: קָדְקֹד désigne le sommet de la tête ou du crâne; cette formulation préserve les deux extrémités du mérisme corporel.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: il n’avait aucun défaut
  rationale: מוּם désigne ici un défaut ou une imperfection physique; « aucun défaut » est clair et naturel tout en gardant le sens corporel donné par le contexte.
