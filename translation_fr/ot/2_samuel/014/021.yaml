base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: fr
  text: 'Alors le roi dit à Joab : « Vois donc, j’ai fait cela. Va ramener le jeune homme, Absalom. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit; « Alors » exprime naturellement la succession en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le titre défini de l’hébreu est conservé sans lui substituer le nom propre.
- source_word: הִנֵּה נָא
  choice: Voilà
  rationale: Dans ce contexte, la combinaison attire l’attention sur la décision que le roi vient d’annoncer. « Voilà » en rend la force discursive dans un français actuel, sans l’archaïsme de « voici donc ».
- source_word: עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: j’ai fait ce que tu demandais
  rationale: Le sens contextuel est que le roi accède à la démarche de Joab. Cette formulation est naturelle; la traduction plus formelle figure en note afin de préserver l’indétermination de l’expression hébraïque.
- source_word: וְלֵךְ
  choice: Va donc
  rationale: Le waw relie l’acquiescement du roi à l’ordre qui en découle; « donc » exprime ici cette conséquence sans lourdeur.
- source_word: הָשֵׁב
  choice: ramener
  rationale: 'Le hiphil de שוב est causatif: Joab doit faire revenir Absalom. « Ramener » exprime précisément cette valeur.'
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Absalom étant adulte, « jeune homme » respecte le contexte et la nuance relationnelle.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalom
  rationale: Le nom propre est translittéré selon l’usage français. La reprise appositionnelle de l’hébreu est conservée par « le jeune homme, Absalom ».
