  source_fidelity: La formulation principale « j’ai fait ce que tu demandais » explicite une implication contextuelle légitime, mais elle remplace l’expression volontairement générale « j’ai fait cette chose / cela ». La note ne compense pas entièrement cette précision ajoutée dans le texte. « Vois donc, j’ai fait cela » conserve l’appel d’attention de הִנֵּה נָא et l’indétermination de עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה.
  naturalness: « Vois donc » est un tour narratif direct, compréhensible en français international moderne, et « Va ramener le jeune homme, Absalom » est naturel tout en préservant la double désignation.
  terminology: « le roi », « Joab », « ramener », « le jeune homme » et « Absalom » sont appropriés. « Ramener » rend bien le hiphil causatif de שוב.
