  - severity: low
    issue: Note devenue inutile après restitution de l’expression générale
    rationale: Une fois « j’ai fait cela » rétabli dans le texte, il n’est plus nécessaire de créer une note pour signaler une alternative contextuelle qui ajouterait précisément ce que le texte ne dit pas explicitement.
