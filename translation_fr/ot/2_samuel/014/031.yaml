  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: fr
  text: 'Alors Joab se leva, se rendit chez Absalom et lui dit : « Pourquoi tes serviteurs ont-ils mis le feu au champ qui m’appartient ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Alors Joab se leva
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, et « se leva » conserve l’idée du mouvement initial sans archaïsme marqué.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: se rendit chez Absalom
  rationale: Le hé directionnel de הַבָּיְתָה indique le déplacement vers la maison. Dans ce contexte, « chez Absalom » exprime naturellement en français l’arrivée à sa résidence.
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Équivalent direct, courant et idiomatique de l’interrogatif hébreu.
- source_word: הִצִּיתוּ
  choice: ont-ils mis le feu
  rationale: Le hifil de יצת exprime l’action de mettre en feu ou d’incendier. « Mettre le feu à » restitue clairement la valeur causative.
- source_word: עֲבָדֶךָ
  choice: tes serviteurs
  rationale: Malgré la forme nominale singulière collective, le verbe pluriel indique plusieurs personnes. « Serviteurs » convient au cadre social du récit sans renforcer inutilement la nuance de servitude par « esclaves ».
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: au champ qui m’appartient
  rationale: חֶלְקָה désigne une parcelle ou une étendue cultivable, tandis que אֲשֶׁר לִי en affirme explicitement la possession. Cette formulation française reste naturelle tout en conservant la structure sémantique de l’hébreu.
- source_word: בָּאֵשׁ
  choice: le feu
  rationale: La préposition beth marque ici le moyen, littéralement « avec le feu ». La locution française « mettre le feu à » en donne l’équivalent idiomatique.
