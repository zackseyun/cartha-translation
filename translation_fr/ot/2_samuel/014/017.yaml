  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: fr
  text: 'Alors ta servante a dit : « Je t’en prie, que la parole de mon seigneur le roi apporte l’apaisement ! Car mon seigneur le roi est comme l’ange de Dieu[a], capable d’entendre le bien et le mal[b]. Que Yahweh ton Dieu soit avec toi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un messager de Dieu » ; le mot hébreu peut désigner un messager humain ou un ange.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « entendre le bien et le mal » ; l’expression signifie probablement discerner ou juger ce qui est bien et ce qui est mal.
    reason: idiom_explanation
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: ta servante
  rationale: Le nom désigne explicitement une servante et constitue ici une formule féminine d’humilité devant le roi. Le français permet d’en conserver naturellement le genre.
- source_word: יִהְיֶה נָּא
  choice: Que … apporte donc
  rationale: La tournure volitive accompagnée de נָא exprime une requête respectueuse. « Que » et « donc » en rendent la nuance suppliante sans lourdeur.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: la parole de mon seigneur le roi
  rationale: דָּבָר peut désigner une parole, une affaire ou une décision. « Parole » conserve l’image hébraïque tout en évoquant ici le prononcé royal attendu.
- source_word: לִמְנוּחָה
  choice: apporte l’apaisement
  rationale: Le nom מְנוּחָה évoque le repos, la tranquillité ou le soulagement. « Apaisement » convient à l’effet attendu de la parole du roi dans ce différend.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: comme l’ange de Dieu
  rationale: מַלְאָךְ peut signifier « messager » ou « ange ». Dans cette comparaison exaltée portant sur la perception exceptionnelle du roi, « ange » est le sens contextuel le plus probable; une note conserve l’autre possibilité.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: pour entendre le bien et le mal
  rationale: La traduction garde le verbe concret « entendre » et la paire coordonnée du texte hébreu, sans réduire silencieusement l’expression à une seule interprétation judiciaire. Une note en explicite la portée idiomatique probable.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: Que Yahweh ton Dieu
  rationale: Le nom divin יהוה est translittéré « Yahweh », et le possessif de deuxième personne est conservé.
- source_word: יְהִי עִמָּךְ
  choice: soit avec toi
  rationale: Le jussif exprime ici un souhait ou une bénédiction, naturellement rendu en français par « Que … soit avec toi ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le Tétragramme; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Sens de מַלְאָךְ dans la comparaison royale
  choice: ange
  alternative: messager
  rationale: Le contexte présente le roi comme doté d’une perception hors du commun, ce qui favorise « ange »; la polysémie réelle du terme est toutefois signalée en note.
- issue: Portée de « entendre le bien et le mal »
  choice: conserver l’expression concrète dans le texte
  alternative: discerner le bien du mal
  rationale: La formulation hébraïque peut évoquer la capacité de percevoir, d’évaluer ou de juger. La traduction principale en préserve la tension, tandis que la note indique le sens idiomatique probable.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement reflète les formes hébraïques au singulier adressées au roi. « Mon seigneur le roi » et « ta servante » maintiennent le registre de cour et l’attitude déférente de la locutrice.
