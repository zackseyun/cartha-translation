    issue: Construction française peu naturelle de « comme l’ange de Dieu pour entendre le bien et le mal »
    rationale: Le syntagme « pour entendre » se comprend spontanément comme un but en français. L’hébreu attribue plutôt au roi une faculté comparable à celle de l’ange de Dieu. « Capable d’entendre » rend cette relation sans remplacer silencieusement « entendre » par une interprétation unique telle que « juger ».
