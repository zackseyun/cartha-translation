  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: fr
  text: 'Alors la femme dit : « Je vous en prie, que votre servante puisse dire un mot à mon seigneur le roi. » Il dit : « Parlez. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit; « Alors » rend naturellement cette succession en français.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Dans ce contexte, le terme désigne simplement la femme qui s’adresse au roi.
- source_word: תְּדַבֶּר נָא
  choice: Je t’en prie, que … puisse dire
  rationale: L’imparfait à valeur jussive accompagné de נָא formule une demande respectueuse; cette tournure conserve la déférence envers le roi.
- source_word: שִׁפְחָתְךָ
  choice: ta servante
  rationale: Le nom est explicitement féminin et constitue ici une formule d’humilité; le français naturel permet d’en conserver directement le genre et le sens.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: à mon seigneur le roi
  rationale: אדון est ici un titre honorifique humain; « mon seigneur le roi » garde la solennité de l’adresse de cour sans lui donner un sens divin.
- source_word: דָּבָר
  choice: un mot
  rationale: Le nom peut signifier « parole », « chose » ou « affaire »; « dire un mot » restitue l’expression concise et polie dans un français idiomatique.
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Dans cet échange direct, « répondit » rend naturellement la fonction contextuelle du verbe « dit », sans modifier le contenu de la réponse.
- source_word: דַּבֵּרִי
  choice: Parle
  rationale: L’impératif féminin singulier est rendu par l’impératif français bref et direct.
