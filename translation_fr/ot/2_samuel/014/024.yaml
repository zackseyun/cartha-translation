source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ יִסֹּ֣ב אֶל בֵּית֔/וֹ וּ/פָנַ֖/י לֹ֣א יִרְאֶ֑ה וַ/יִּסֹּ֤ב אַבְשָׁלוֹם֙ אֶל בֵּית֔/וֹ וּ/פְנֵ֥י הַ/מֶּ֖לֶךְ לֹ֥א רָאָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: fr
  text: 'Mais le roi dit : « Qu’il regagne sa maison et qu’il ne voie pas mon visage[a]. » Absalom regagna donc sa maison et ne vit pas le visage du roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « voir mon visage » et « voir le visage du roi » ; expression qui signifie être en présence de quelqu’un ou être reçu par lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: qu’il regagne / regagna
  rationale: Dans ce contexte, le verbe indique qu’Absalom est renvoyé vers sa propre maison plutôt qu’admis auprès du roi. « Regagner » exprime naturellement ce déplacement imposé et permet de conserver la répétition du verbe hébreu.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: « Maison » rend directement בַּיִת, tandis que le suffixe possessif est exprimé par « sa ». Cette formulation reste concrète sans ajouter l’idée plus affective de « chez lui ».
- source_word: וּפָנַי לֹא יִרְאֶה
  choice: et qu’il ne voie pas mon visage
  rationale: La tournure au subjonctif rend l’ordre du roi. Le mot « visage » est conservé afin de préserver l’image hébraïque et sa reprise dans la narration.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: et ne vit pas le visage du roi
  rationale: La formulation littérale maintient la répétition rhétorique de « visage » et le lien précis entre l’ordre royal et son exécution.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Équivalent français courant et direct de מֶלֶךְ.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Translittération française conventionnelle du nom propre.
- source_word: וַיֹּאמֶר
  choice: Mais le roi dit
  rationale: '« Mais » fait ressortir le contraste contextuel : malgré le retour d’Absalom à Jérusalem, le roi lui refuse encore une audience.'
theological_decisions:
- issue: Conserver l’expression « voir mon visage / le visage du roi » ou expliciter l’accès à la présence royale
  choice: Conserver littéralement l’expression dans le texte principal
  alternative: « qu’il ne se présente pas devant moi » / « il ne fut pas admis auprès du roi »
  rationale: La formulation concrète préserve l’idiome hébreu, sa répétition et la tension narrative, sans préciser davantage que le texte la nature sociale ou officielle du refus.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de l’hébreu est conservé par la répétition de « regagner sa maison » et de l’expression « voir le visage ».
