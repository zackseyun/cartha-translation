  text: וָ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥תָ/ה אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤תִֽי לְ/ךָ֙ שֵׁ֣ם גָּד֔וֹל כְּ/שֵׁ֥ם הַ/גְּדֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: fr
  text: J’ai été avec toi partout où tu es allé, et j’ai retranché tous tes ennemis de devant toi. Je te ferai[c] un grand nom[a], comme le nom des grands[b] qui sont sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande renommée ». En hébreu, le « nom » peut désigner la réputation ou la renommée.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme le nom des grands hommes qui sont sur la terre ».
    reason: alternative_reading
  - marker: c
    text: Ou « Je t’ai fait un grand nom ». La forme hébraïque peut être comprise comme un accompli, mais le contexte de promesse favorise ici le futur.
    reason: temporal_ambiguity
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: J’ai été avec toi
  rationale: Le passé composé exprime naturellement en français la présence et le soutien de Dieu au cours du passé de David, tout en gardant la formulation simple de l’hébreu.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: partout où tu es allé
  rationale: Cette tournure française idiomatique rend la portée globale de l’expression hébraïque sans en limiter le sens aux seuls lieux.
- source_word: וָאַכְרִתָה
  choice: j’ai retranché
  rationale: Le verbe conserve l’image forte de כרת, « couper, retrancher », plutôt que de la remplacer par une formulation plus interprétative comme « éliminer ».
- source_word: מִפָּנֶיךָ
  choice: de devant toi
  rationale: La formulation préserve l’image spatiale hébraïque de l’éloignement des ennemis hors de la présence ou du chemin de David.
- source_word: וְעָשִׂיתִי לְךָ
  choice: Je te ferai
  rationale: Dans ce discours de promesse, le futur français rend bien le passage des actions passées de Dieu à ce qu’il accomplira pour David; « te » exprime naturellement la nuance bénéficiaire de לְךָ.
- source_word: שֵׁם גָּדוֹל
  choice: un grand nom
  rationale: « Nom » conserve l’image biblique et ses résonances intertextuelles, tout en pouvant désigner ici la réputation ou la renommée.
- source_word: כְּשֵׁם הַגְּדֹלִים
  choice: comme le nom des grands
  rationale: La répétition de « nom » respecte le parallélisme hébraïque; « les grands » reste général et n’impose pas un genre que l’expression ne met pas nécessairement en avant.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: qui sont sur la terre
  rationale: Dans cette comparaison étendue aux personnages renommés, « la terre » convient mieux que « le pays », qui pourrait suggérer un territoire particulier.
theological_decisions:
- issue: Valeur temporelle de וְעָשִׂיתִי dans le contexte de la promesse divine
  choice: Je te ferai un grand nom
  alternative: Je t’ai fait un grand nom
  rationale: Bien que la forme soit un qatal, le mouvement du discours passe du rappel des actes passés à une promesse; le futur rend cette progression, appuyée par le parallèle de 1 Chroniques 17.8. Une note signale néanmoins l’autre analyse grammaticale possible.
translation_notes:
  register: Français international moderne, digne et lisible. La traduction garde les images bibliques « retrancher », « devant toi » et « un grand nom », tout en employant une syntaxe française naturelle.
