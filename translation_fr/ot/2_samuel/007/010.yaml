  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: fr
  text: Je désignerai un lieu pour mon peuple Israël et je l’y planterai, afin qu’il habite à sa place et ne soit plus troublé. Les malfaiteurs[a] ne continueront plus à l’opprimer comme autrefois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’injustice ». Autres traductions possibles : « les hommes pervers » ou « les gens malfaisants ».'
    reason: L’expression hébraïque בְנֵי עַוְלָה est un idiome désignant des auteurs de mal ; la note en préserve la forme littérale et les nuances lexicales.
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: Je fixerai un lieu
  rationale: שׂים signifie fondamentalement « placer, établir ». Avec מָקוֹם, « fixer un lieu » exprime naturellement l’attribution divine d’un emplacement stable sans préciser davantage que l’hébreu.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: pour mon peuple, pour Israël
  rationale: La reprise de לְ est conservée afin de rendre l’apposition emphatique de l’hébreu et d’identifier explicitement le peuple comme Israël.
- source_word: וּנְטַעְתִּיו
  choice: et je l’y planterai
  rationale: Le masculin singulier renvoie au collectif « mon peuple, Israël ». Le pronom adverbial « y » rend explicite en français le rapport avec le lieu mentionné, tandis que « planter » préserve la métaphore agricole.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: Il habitera chez lui
  rationale: Le singulier maintient la personnification collective de l’hébreu. Dans ce contexte, תַּחְתָּיו désigne l’installation durable à sa place; « chez lui » en donne un équivalent français naturel sans suggérer une subordination spatiale.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: et ne sera plus troublé
  rationale: רגז peut évoquer le tremblement, l’agitation ou le bouleversement. Le passif français exprime ici la déstabilisation causée par des ennemis, tout en gardant une certaine amplitude sémantique.
- source_word: בְנֵי עַוְלָה
  choice: les hommes injustes
  rationale: L’expression signifie littéralement « fils d’injustice/de perversité » et désigne idiomatiquement ceux qui pratiquent le mal. « Les hommes injustes » conserve la référence masculine explicite tout en restant compréhensible en français moderne; la forme littérale est signalée en note.
- source_word: לְעַנּוֹתוֹ
  choice: à l’opprimer
  rationale: Au piel, ענה peut signifier affliger, humilier ou opprimer. Dans le contexte d’agresseurs qui déstabilisent Israël, « opprimer » exprime clairement l’action hostile prolongée.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: comme autrefois
  rationale: Cette expression compare la sécurité promise aux périodes antérieures d’oppression. « Comme autrefois » est concis et naturel.
theological_decisions:
- issue: Israël comme collectif exprimé au masculin singulier
  choice: 'Maintenir le singulier en français : « je l’y planterai », « il habitera », « l’opprimer »'
  alternative: 'Employer le pluriel notionnel : « je les planterai », « ils habiteront », « les opprimer »'
  rationale: Les suffixes et le verbe hébreux sont au masculin singulier et personnifient Israël comme un peuple collectif. Le français accepte naturellement ce singulier avec l’antécédent « mon peuple »; le conserver rapproche la traduction de la forme source sans introduire de conclusion doctrinale.
- issue: Valeur de תַּחְתָּיו
  choice: chez lui
  alternative: sous lui / à sa place
  rationale: Une traduction spatiale littérale telle que « sous lui » serait obscure et risquerait de créer une relation de domination absente du contexte. « Chez lui » rend l’idée d’une installation stable dans le lieu assigné tout en évitant de surdéfinir ce lieu.
- issue: Expression בְנֵי עַוְלָה
  choice: les hommes injustes, avec la formulation littérale en note
  alternative: les fils d’injustice / les malfaiteurs
  rationale: La traduction principale doit être immédiatement intelligible tout en respectant la référence humaine masculine de l’expression. La note conserve l’image sémitique et l’éventail lexical « injustice, perversité ».
translation_notes:
  register: 'Français international moderne, digne et accessible. Le rythme suit les trois mouvements du verset : attribution et plantation du lieu, habitation paisible, fin de l’oppression. Le singulier collectif est conservé parce qu’il est à la fois naturel en français avec « peuple » et formellement proche de l’hébreu.'
