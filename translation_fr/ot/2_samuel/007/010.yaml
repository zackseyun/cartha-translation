  source_fidelity: 'Le sens général est bien rendu : Dieu attribue un lieu à Israël, l’y établit durablement, et met fin à l’oppression. Toutefois, « chez lui » est un peu plus domestique et moins précis que l’expression de stabilité « à sa place » ; « les hommes injustes » évoque surtout des personnes qui commettent une injustice, alors que בני עוולה désigne plus nettement des malfaiteurs ou des gens pervers.'
  naturalness: Le singulier collectif est naturel avec « mon peuple Israël ». « Je désignerai un lieu » est plus idiomatique et plus exact ici que « je fixerai un lieu ». « Afin qu’il habite à sa place » exprime clairement la relation de but/résultat de la séquence hébraïque.
  terminology: « Malfaiteurs » est l’équivalent français moderne le plus naturel pour l’idiome בני עוולה, sans effacer la formulation littérale, qui est conservée en note. « Opprimer » convient à ענה au piel dans ce contexte.
