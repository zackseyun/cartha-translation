  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: fr
  text: 'Maintenant donc, voici ce que tu diras à mon serviteur David : « Voici ce que dit Yahweh des armées : C’est moi qui t’ai pris au pâturage[a], derrière le troupeau, pour que tu sois chef[b] de mon peuple, d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’enclos ». Le mot hébreu peut désigner un pâturage ou le lieu où demeure un troupeau.
    reason: lexical_alternative
  - marker: b
    text: Ou « dirigeant » ou « prince ». Le terme hébreu désigne quelqu’un établi à la tête du peuple, sans employer précisément le titre de « roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois la valeur temporelle et la transition logique du discours.
- source_word: כֹּה תֹאמַר
  choice: voici ce que tu diras
  rationale: Formulation idiomatique et actuelle de la formule de messager, en conservant la force directive.
- source_word: לְעַבְדִּי לְדָוִד
  choice: à mon serviteur David
  rationale: « Serviteur » convient ici à la désignation honorifique de David dans sa relation à Dieu; l’apposition est formulée naturellement en français.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend naturellement la formule solennelle de proclamation.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par son sens courant sans préciser indûment s’il s’agit d’armées terrestres ou célestes.
- source_word: אֲנִי לְקַחְתִּיךָ
  choice: C’est moi qui t’ai pris
  rationale: La tournure clivée met en relief le pronom אֲנִי et souligne l’initiative divine.
- source_word: מִן הַנָּוֶה
  choice: au pâturage
  rationale: נָוֶה peut désigner le lieu où demeure ou paît le troupeau; « pâturage » est clair et naturel dans ce contexte.
- source_word: מֵאַחַר הַצֹּאן
  choice: derrière le troupeau
  rationale: Rendu proche de l’image hébraïque littérale, qui décrit David marchant derrière les bêtes en berger.
- source_word: לִהְיוֹת נָגִיד
  choice: pour que tu sois chef
  rationale: Exprime le but et rend נָגִיד comme une fonction de direction sans lui substituer le titre plus précis de « roi ».
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: de mon peuple, d’Israël
  rationale: Le double complément maintient la reprise emphatique de עַל tout en restant lisible en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom divin sans le remplacer par un titre.
- issue: Sens de עֶבֶד appliqué à David
  choice: serviteur
  alternative: esclave
  rationale: Dans cette adresse divine, le terme fonctionne comme une désignation relationnelle et honorifique; « esclave » mettrait au premier plan une nuance sociale qui n’est pas centrale ici.
- issue: Portée du titre נָגִיד
  choice: chef
  alternative: prince, dirigeant, souverain
  rationale: Le terme indique un homme établi à la tête du peuple, avec une portée royale possible, mais ne correspond pas simplement au titre « roi »; « chef » conserve cette relative ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La parole divine est mise entre guillemets français. « Yahweh des armées » privilégie la transparence lexicale; « derrière le troupeau » conserve l’image pastorale, et la reprise finale garde une part de la cadence hébraïque.
