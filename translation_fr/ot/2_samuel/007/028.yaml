  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י יְהוִ֗ה אַתָּה הוּא֙ הָֽ/אֱלֹהִ֔ים וּ/דְבָרֶ֖י/ךָ יִהְי֣וּ אֱמֶ֑ת וַ/תְּדַבֵּר֙ אֶֽל עַבְדְּ/ךָ֔ אֶת הַ/טּוֹבָ֖ה הַ/זֹּֽאת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: fr
  text: Et maintenant, Seigneur Yahweh, c’est toi qui es Dieu. Tes paroles sont vraies[a], et tu as parlé à ton serviteur de ce bienfait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes paroles seront vraies » ; littéralement : « tes paroles seront vérité ». Le terme peut aussi exprimer leur fiabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « Seigneur » et le nom divin יהוה par « Yahweh », ce qui conserve distinctement les deux éléments de l’adresse hébraïque sans produire la répétition « Seigneur SEIGNEUR ».
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: c’est toi qui es Dieu
  rationale: La tournure française met en valeur l’insistance produite par les deux pronoms hébreux tout en restant naturelle dans une prière.
- source_word: דְבָרֶיךָ יִהְיוּ אֱמֶת
  choice: tes paroles sont vraies
  rationale: Le pluriel de דְבָרֶיךָ est conservé. Le présent exprime ici naturellement la vérité et la fiabilité permanentes des paroles divines, tandis qu’une note signale la valeur formellement inaccomplie de יִהְיוּ et la force nominale de אֱמֶת.
- source_word: וַתְּדַבֵּר
  choice: tu as annoncé
  rationale: Dans ce contexte, le verbe « parler » porte sur un bienfait communiqué auparavant à David. « Annoncé » rend cette construction plus naturellement en français sans la préciser d’emblée comme une promesse.
- source_word: אֶל עַבְדְּךָ
  choice: à ton serviteur
  rationale: Dans la prière royale, עֶבֶד désigne David dans sa relation de service et de dépendance envers Dieu ; « serviteur » convient mieux que « esclave » à cet emploi.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: ce bienfait
  rationale: L’adjectif substantivé signifie littéralement « cette bonne [chose] ». « Ce bienfait » en restitue le caractère favorable avec davantage de naturel que « cette bonne chose », sans le réduire explicitement à une promesse ou à une bénédiction.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le texte porte directement le nom divin יהוה. « Yahweh » le conserve comme nom propre, tandis que « Seigneur » rend אֲדֹנָי ; cette solution évite de confondre les deux termes.
- issue: Insistance de אַתָּה הוּא הָאֱלֹהִים
  choice: c’est toi qui es Dieu
  alternative: tu es Dieu
  rationale: La construction emphatique affirme l’identité de Dieu sans introduire une précision doctrinale absente du texte. La forme clivée française préserve cette insistance.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe et soutenue de la prière biblique. « Bienfait » évite la lourdeur de « bonne chose » tout en maintenant la portée assez large de l’hébreu.
