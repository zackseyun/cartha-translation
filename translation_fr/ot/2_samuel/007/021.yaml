base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: fr
  text: À cause de ta parole[a] et selon ton cœur[b], tu as accompli toute cette grande œuvre[c], pour la faire connaître à ton serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour ta parole »; dans ce contexte, « ta parole » peut aussi se comprendre comme « ta promesse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon ton cœur », c’est-à-dire selon ta propre intention ou volonté.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie un nom abstrait au singulier : « toute cette grandeur »; on pourrait aussi traduire : « toutes ces grandes choses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: À cause de ta parole
  rationale: בַּעֲבוּר exprime ici la cause ou le fondement. « À cause de » en garde la force causale, tandis que « ta parole » préserve l’étendue de דָּבָר, qui peut évoquer dans ce contexte la parole prononcée ou la promesse de Dieu.
- source_word: וּכְלִבְּךָ
  choice: et selon ton cœur
  rationale: Cette formulation conserve la métaphore hébraïque du cœur comme siège de l’intention, de la volonté et du dessein, sans la réduire à une seule interprétation.
- source_word: עָשִׂיתָ
  choice: tu as accompli
  rationale: Le passé composé convient à une action accomplie dont les effets demeurent présents. « Accomplir » s’associe naturellement à l’œuvre évoquée tout en gardant le sens général de עשה.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: toute cette grandeur
  rationale: Le singulier abstrait de l’hébreu est conservé. Il rassemble l’ensemble de l’action divine en une manifestation unifiée de grandeur, plutôt que de le transformer sans nécessité en plusieurs « grandes choses ».
- source_word: לְהוֹדִיעַ
  choice: pour la faire connaître
  rationale: La tournure causative rend le hiphil de ידע, « faire connaître ». Le pronom « la » reprend naturellement « cette grandeur », implicite comme objet de la connaissance dans la formulation hébraïque.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans cette prière royale, « serviteur » rend adéquatement l’autodésignation humble de David devant Dieu; « esclave » mettrait ici au premier plan une nuance que le contexte ne souligne pas.
theological_decisions:
- issue: Sens de « ta parole » dans le contexte de l’alliance
  choice: ta parole
  alternative: ta promesse; ce que tu as dit
  rationale: Le contexte permet de comprendre la parole de Dieu comme une promesse, mais l’hébreu emploie le terme plus large דָּבָר. Le conserver évite de restreindre le sens tout en laissant entendre sa portée d’engagement.
- issue: Langage anthropomorphique appliqué à Dieu
  choice: selon ton cœur
  alternative: selon ta volonté; conformément à ton dessein
  rationale: La traduction maintient l’image propre au texte pour parler de l’intention intérieure de Dieu, au lieu de la remplacer par une abstraction théologique.
- issue: Caractère unifié de l’action divine
  choice: toute cette grandeur
  alternative: toutes ces grandes choses; toute cette grande œuvre
  rationale: Le singulier abstrait présente ce que Dieu a fait comme une seule manifestation de grandeur. Le préserver maintient cette possibilité sans imposer une pluralisation interprétative.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. La syntaxe reste proche de l’hébreu tout en étant naturelle; les métaphores de « parole » et de « cœur », ainsi que le singulier abstrait « grandeur », sont volontairement préservés.
