  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: fr
  text: 'Car toi, Yahweh des armées, Dieu d’Israël, tu as révélé ceci à ton serviteur[a] en disant : « Je te bâtirai une maison[b]. » C’est pourquoi ton serviteur a trouvé le courage[c] de t’adresser cette prière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu as découvert l’oreille de ton serviteur », expression hébraïque signifiant que Dieu lui a fait une révélation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Je bâtirai une maison pour toi. » Dans ce contexte, « maison » évoque aussi une dynastie.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « a trouvé son cœur », c’est-à-dire qu’il a trouvé le courage ou la résolution de prier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré « Yahweh ». « Des armées » rend צְבָאוֹת en français actuel tout en conservant l’ampleur du titre divin, qui peut évoquer les puissances célestes et terrestres.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Rendu direct de la construction hébraïque, qui préserve l’identification d’alliance.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: tu as révélé ceci à ton serviteur
  rationale: Littéralement, l’hébreu dit « tu as découvert l’oreille de ton serviteur ». Le texte principal exprime naturellement le sens de cette locution de révélation, tandis que la note en conserve la forme concrète.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette prière royale, « serviteur » traduit naturellement la posture d’humilité et de dépendance de David devant Dieu.
- source_word: לֵאמֹר
  choice: en disant
  rationale: La formule introductive de citation est maintenue explicitement.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: Je te bâtirai une maison
  rationale: Cette formulation naturelle reste proche de l’hébreu et conserve à « maison » sa résonance à la fois architecturale et dynastique.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: La locution marque le lien logique entre la révélation divine et la prière de David.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: a trouvé le courage
  rationale: La locution signifie littéralement « a trouvé son cœur » et exprime le courage ou la résolution d’oser prier. La formulation choisie est claire en français moderne.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: de t’adresser cette prière
  rationale: Cette tournure française rend naturellement l’idée de prier Dieu en lui présentant précisément cette prière.
theological_decisions:
- issue: Formule idiomatique de révélation
  choice: tu as révélé ceci à ton serviteur
  alternative: tu as découvert l’oreille de ton serviteur
  rationale: La traduction principale communique le sens sans conserver une locution opaque en français ; la note permet néanmoins de vérifier l’image hébraïque.
- issue: Sens de « maison »
  choice: maison
  alternative: temple ou dynastie
  rationale: Le contexte de l’alliance davidique donne au mot une résonance dynastique, sans abolir son sens ordinaire. Le préciser par « temple » ou « dynastie » résoudrait indûment la richesse du terme.
- issue: Expression du courage dans la prière
  choice: a trouvé le courage
  alternative: a trouvé son cœur
  rationale: Le calque serait obscur en français. Le choix retenu communique la résolution de David sans transformer l’expression en affirmation doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement argumentatif de la prière et les termes théologiquement chargés sans archaïsmes inutiles.
