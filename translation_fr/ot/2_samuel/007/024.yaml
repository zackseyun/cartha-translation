  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: fr
  text: Tu as établi pour toi ton peuple Israël, afin qu’il soit ton peuple pour toujours, et toi, Yahweh[a], tu es devenu leur Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte le nom divin YHWH, ici rendu par « Yahweh ».
    reason: alternative_reading
  - marker: b
    text: Ou « tu as été leur Dieu ». Le verbe hébreu peut décrire un état ; dans ce contexte, « tu es devenu » souligne l’établissement de la relation d’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: tu as établi
  rationale: Le verbe כון dans cette forme exprime l’action d’affermir ou d’établir durablement. « Établir » convient au contexte de la constitution d’Israël comme peuple de Dieu.
- source_word: לְךָ ... לְךָ לְעָם
  choice: pour toi ... afin qu’il soit ton peuple
  rationale: La répétition de לְךָ souligne l’appartenance d’Israël à Yahweh. Cette formulation française conserve cette réciprocité d’alliance sans reproduire lourdement chaque préposition.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ton peuple Israël
  rationale: Rend directement l’expression hébraïque, où « Israël » précise l’identité du peuple appartenant à Yahweh.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française naturelle qui traduit la durée permanente indiquée par l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: tu es devenu leur Dieu
  rationale: Dans ce contexte, היה avec ל exprime l’établissement de la relation d’alliance. Le français « devenir » en fait ressortir la dimension inaugurale, tout en signalant en note la lecture stative possible.
theological_decisions:
- issue: Réciprocité de la formule d’alliance
  choice: ton peuple ... tu es devenu leur Dieu
  alternative: ton peuple ... tu as été leur Dieu
  rationale: 'La traduction maintient les deux pôles de la formule d’alliance : Israël appartient à Yahweh et Yahweh est son Dieu. « Es devenu » met en valeur l’établissement de cette relation dans le contexte, sans exclure la valeur stative possible de l’hébreu.'
- issue: Représentation du tétragramme
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’emploi de « Yahweh » préserve le nom personnel יהוה présent dans le texte hébreu et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « ton peuple » conserve l’insistance de l’hébreu et la structure réciproque de l’alliance ; le pronom accentué « toi » rend וְאַתָּה.
