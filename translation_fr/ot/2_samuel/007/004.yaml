  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: fr
  text: 'Mais cette nuit-là, la parole de Yahweh fut adressée à Nathan :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Mais, cette nuit-là
  rationale: Le premier וַיְהִי fait avancer le récit. Dans le contexte, « Mais » exprime naturellement le contraste avec l’approbation donnée par Nathan au verset précédent, tandis que בַּלַּיְלָה הַהוּא devient idiomatiquement « cette nuit-là ».
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: la parole de Yahweh fut adressée
  rationale: La tournure hébraïque est une formule prophétique de révélation. « Fut adressée » rend clairement la venue de la parole à son destinataire sans réduire דָּבָר à un simple « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte source.
- source_word: אֶל נָתָן
  choice: à Nathan
  rationale: אֶל indique ici le destinataire de la révélation ; « à Nathan » est la formulation française naturelle.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction et évitent le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le nom propre divin. « Yahweh » en préserve la fonction de nom personnel sans lui substituer un titre.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve la « parole » comme terme de révélation, marque le contraste narratif par « Mais » et rend לֵאמֹר par une ponctuation française naturelle.
