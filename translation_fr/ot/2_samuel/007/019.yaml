base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: fr
  text: 'Et cela encore t’a paru peu de chose, Seigneur DIEU : tu as aussi parlé de la maison[a] de ton serviteur pour un avenir lointain[b]. Et telle est l’instruction de l’homme[c], Seigneur DIEU.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu signifie littéralement « maison » et peut désigner ici la maisonnée ou la dynastie.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour ce qui est lointain » ; l’expression renvoie ici à un avenir éloigné.
    reason: lexical_alternative
  - marker: c
    text: 'La dernière proposition hébraïque est difficile. Littéralement, « telle est l’instruction de l’homme ». On peut aussi comprendre : « telle est la loi ou la règle de l’homme », « telle est l’instruction concernant l’humanité » ou « telle est la charte pour l’humanité ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: Et cela encore t’a paru peu de chose
  rationale: La tournure garde l’idée de petitesse exprimée par קטן et rend naturellement en français l’idiome évaluatif « à tes yeux », sans suggérer que la promesse était insuffisante en elle-même.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur DIEU
  rationale: Le composé associe le titre אֲדֹנָי au nom divin יהוה. « DIEU » en capitales évite l’inélégant « Seigneur SEIGNEUR » tout en signalant conventionnellement le tétragramme.
- source_word: וַתְּדַבֵּר גַּם אֶל
  choice: tu as aussi parlé de
  rationale: Avec אֶל, le verbe peut introduire ce à quoi ou ce dont Dieu parle. Ici, « parler de » convient au contenu de la promesse concernant la maison de David.
- source_word: בֵּית עַבְדְּךָ
  choice: la maison de ton serviteur
  rationale: « Maison » conserve le terme source et son possible double sens de maisonnée et de dynastie.
- source_word: לְמֵרָחוֹק
  choice: pour un avenir lointain
  rationale: L’expression de l’éloignement a ici une valeur temporelle et vise ce qui doit arriver longtemps après David.
- source_word: תּוֹרַת
  choice: instruction
  rationale: תורה peut désigner une instruction, une règle ou une loi. « Instruction » maintient une portée assez large dans cette proposition notoirement difficile.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: L’expression peut viser l’homme ou l’humanité. « L’être humain » rend le singulier collectif sans limiter indûment le sens au sexe masculin.
theological_decisions:
- issue: Sens de la proposition difficile וְזֹאת תּוֹרַת הָאָדָם
  choice: Et telle est l’instruction pour l’être humain
  alternative: 'Et telle est la loi de l’homme ; ou : et telle est la charte pour l’humanité'
  rationale: La syntaxe et la portée théologique de la proposition sont disputées. Le texte principal reste proche de ses éléments lexicaux, tandis que la note conserve d’autres analyses possibles sans imposer une lecture dynastique ou messianique particulière.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement correspond au discours direct adressé à Dieu. La formulation conserve le mot « maison » et l’ambiguïté de la proposition finale, avec les précisions nécessaires en notes.
