  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: fr
  text: C’est pourquoi tu es grand, Seigneur Yahweh[a], car nul n’est comme toi, et il n’y a pas de Dieu en dehors de toi[b], d’après tout ce que nous avons entendu de nos propres oreilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu associe ici le titre « Seigneur » au nom divin YHWH, rendu « Yahweh ».
    reason: cultural_note
  - marker: b
    text: 'Ou : « et il n’y a aucun dieu excepté toi » ; « en dehors de toi » traduit une expression qui signifie aussi « excepté toi » ou « à part toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Introduit la conclusion tirée des actes divins évoqués dans la prière précédente et conserve clairement la valeur logique de l’expression hébraïque.
- source_word: גָּדַלְתָּ
  choice: tu es grand
  rationale: Le parfait qal peut exprimer l’état reconnu qui résulte de ce qui précède. Cette formulation française naturelle garde la force doxologique sans expliciter indûment « tu t’es montré grand ».
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression artificielle « Seigneur SEIGNEUR ».
- source_word: כִּי
  choice: ':'
  rationale: Les deux-points expriment naturellement en français que les propositions suivantes donnent le fondement de la déclaration précédente.
- source_word: אֵין כָּמוֹךָ
  choice: personne n’est comme toi
  rationale: Reproduit directement l’affirmation hébraïque de l’incomparabilité de Dieu dans un français actuel et digne.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: et il n’y a pas de Dieu en dehors de toi
  rationale: 'זוּלָתֶךָ marque l’exclusion : « excepté toi », « en dehors de toi ». La formulation conserve la confession directe de l’unicité divine.'
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: d’après tout ce que nous avons entendu de nos propres oreilles
  rationale: « D’après » garde le rapport au témoignage reçu, tandis que « de nos propres oreilles » restitue avec naturel l’expression emphatique hébraïque.
theological_decisions:
- issue: Traduction du nom divin יהוה dans le titre composé אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU ; Souverain Seigneur
  rationale: Le texte juxtapose le titre « Seigneur » et le nom personnel divin. « Seigneur Yahweh » préserve cette distinction et rend explicitement le nom de l’alliance sans ajouter une interprétation confessionnelle particulière.
- issue: Portée de אֵין אֱלֹהִים זוּלָתֶךָ
  choice: il n’y a pas de Dieu en dehors de toi
  alternative: il n’y a aucun dieu excepté toi
  rationale: La formulation principale exprime l’exclusivité divine telle que l’affirme le texte, sans développer cette confession en système philosophique. La note conserve l’autre possibilité de rendre אֱלֹהִים comme nom commun.
translation_notes:
  register: Français international actuel, digne et accessible. « C’est pourquoi » marque nettement l’inférence ; « de nos propres oreilles » conserve l’insistance de l’idiome hébraïque tout en restant naturel. Les deux notes sont signalées dans le texte par [a] et [b].
