revisions:
- from: Quand le roi se fut installé dans sa maison[a] et que Yahweh lui eut accordé le repos de tous les côtés, en le délivrant de tous ses ennemis,
  to: Quand le roi habitait dans sa maison[a] et que Yahweh lui avait accordé du repos de tous côtés, face à tous ses ennemis,
  rationale: La révision remplace l’idée ponctuelle d’installation par la résidence durable exprimée par יָשַׁב. Elle conserve « repos » pour הֵנִיחַ et rend les deux compléments « de tous côtés » et « face à tous ses ennemis » sans ajouter une délivrance explicitement absente du texte. La proposition demeure volontairement inachevée, car sa suite se trouve au verset 2.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T15:59:48Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction conserve correctement le titre « le roi », le nom divin « Yahweh », « maison » pour בַּיִת et le caractère ouvert de la phrase. Toutefois, « se fut installé » décrit davantage l’installation que le fait de résider exprimé par יָשַׁב. Surtout, « en le délivrant » reformule le repos accordé comme une délivrance et introduit un moyen ou une action qui n’est pas explicitement formulé dans le texte.
  naturalness: Le français est globalement soutenu et lisible. « Le repos de tous les côtés, en le délivrant de tous ses ennemis » est néanmoins moins naturel et lie deux compléments de manière ambiguë. « Habiter » et « accorder du repos ... face à » donnent une formulation plus directe.
  terminology: « Yahweh » est cohérent avec la décision éditoriale et « maison » préserve utilement le réseau lexical du chapitre. « Repos » doit être maintenu; « face à tous ses ennemis » rend naturellement en français la relation exprimée par « de tous ses ennemis », sans ajouter l’idée explicite de délivrance.
  issues:
  - severity: medium
    issue: « se fut installé » pour יָשַׁב
    rationale: Le verbe hébreu décrit ici la résidence établie du roi, non son installation comme événement ponctuel. « habitait » rend mieux cette valeur.
  - severity: medium
    issue: « en le délivrant de tous ses ennemis »
    rationale: Cette tournure explicite une délivrance comme modalité de l’action divine, alors que l’hébreu dit que Yahweh avait donné au roi du repos venant de tous ses ennemis. Elle devrait être remplacée par une expression qui conserve « repos » et la relation aux ennemis sans l’expliciter.
