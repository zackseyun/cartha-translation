source:
  edition: WLC
  text: וַ/יְהִ֕י כִּי יָשַׁ֥ב הַ/מֶּ֖לֶךְ בְּ/בֵית֑/וֹ וַ/יהוָ֛ה הֵנִֽיחַ ל֥/וֹ מִ/סָּבִ֖יב מִ/כָּל אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: fr
  text: Quand le roi habitait dans sa maison[a] et que Yahweh lui avait accordé du repos de tous côtés, face à tous ses ennemis,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son palais ». L’hébreu dit littéralement « dans sa maison » ; ce terme est conservé ici, car il prépare aussi le jeu de sens sur la « maison » dans la suite du chapitre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Quand
  rationale: La formule narrative introduit la circonstance temporelle de la scène. « Quand » est naturel en français moderne et n’ajoute pas un marqueur tel que « Or » ou « alors », absent du texte source.
- source_word: יָשַׁב
  choice: se fut installé
  rationale: Dans ce contexte, le verbe décrit une résidence établie plutôt que l’action physique de s’asseoir. Le plus-que-parfait marque naturellement l’état déjà établi avant la parole du verset suivant.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le titre défini est conservé sans remplacer son référent par le nom de David.
- source_word: בְּבֵיתוֹ
  choice: dans sa maison
  rationale: « Maison » rend directement בַּיִת et préserve le jeu de sens important sur la « maison » dans la suite du chapitre; « palais » expliciterait la résidence royale au prix de cette continuité lexicale.
- source_word: וַיהוָה
  choice: et Yahweh
  rationale: La coordination hébraïque est conservée, et le nom divin est translittéré sous la forme française « Yahweh ».
- source_word: הֵנִיחַ לוֹ
  choice: lui eut accordé le repos
  rationale: La forme causative exprime le fait que Yahweh procure le repos ou la tranquillité. « Accorder le repos » conserve cette causalité dans un français digne et idiomatique.
- source_word: מִסָּבִיב
  choice: de tous les côtés
  rationale: L’expression indique une sécurité environnante complète.
- source_word: מִכָּל אֹיְבָיו
  choice: en le délivrant de tous ses ennemis
  rationale: La préposition מִן peut indiquer ici ce dont le roi est mis au repos. Cette formulation française évite l’expression peu naturelle « le repos de tous ses ennemis » et rend clairement la source de la tranquillité sans supposer que tous les ennemis ont été détruits.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre ni adopter la forme traditionnelle « Jéhovah ».
- issue: Nuance de résidence royale dans בַּיִת
  choice: maison
  alternative: palais
  rationale: Bien que « palais » convienne au contexte royal, « maison » reste au plus près de l’hébreu et préserve la tension littéraire et théologique du chapitre entre la maison de David, la maison destinée à Yahweh et la dynastie promise.
- issue: Nature du repos accordé au roi
  choice: repos de tous les côtés, en le délivrant de tous ses ennemis
  alternative: tranquillité face à tous ses ennemis
  rationale: Le rendu garde l’image biblique du « repos » et sa provenance divine, sans préciser au-delà du texte la manière dont les ennemis ont cessé de menacer David.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase reste ouverte par une virgule, conformément au fait que le verset 1 forme la proposition circonstancielle dont la suite arrive au verset 2. Les temps composés rendent l’antériorité narrative de manière idiomatique.
