source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל הַ/מֶּ֔לֶךְ כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ לֵ֣ךְ עֲשֵׂ֑ה כִּ֥י יְהוָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: fr
  text: 'Nathan dit au roi : « Va, fais tout ce qui est dans ton cœur[a], car Yahweh est avec toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce que tu as à cœur ». En hébreu, le cœur peut désigner ici l’intention, la volonté ou le projet intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple fait avancer naturellement le récit en français et rend la valeur narrative du waw consécutif sans surcharger la liaison.
- source_word: נָתָן
  choice: Nathan
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶל הַמֶּלֶךְ
  choice: au roi
  rationale: L’hébreu emploie le nom commun défini « le roi » et ne nomme pas David dans ce verset.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: tout ce qui est dans ton cœur
  rationale: Cette formulation conserve l’image hébraïque du cœur comme siège de l’intention, de la volonté et de la réflexion, sans la réduire au seul sentiment.
- source_word: לֵךְ עֲשֵׂה
  choice: Va, fais
  rationale: Les deux impératifs expriment une permission et un encouragement directs. La formulation concise reproduit leur vigueur.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison donnée par Nathan; « car » convient au registre narratif digne tout en restant clair.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: עִמָּךְ
  choice: est avec toi
  rationale: La traduction directe préserve à la fois l’idée de présence et sa portée théologique, sans expliciter indûment un soutien ou une approbation.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en conserve la fonction de nom personnel sans lui substituer un titre.
- issue: Portée de l’affirmation « Yahweh est avec toi »
  choice: Conserver la formulation sans l’expliciter
  alternative: Yahweh te soutient / Yahweh approuve ton projet
  rationale: La suite du récit montre que la présence de Yahweh ne signifie pas nécessairement l’approbation de toute initiative de David. La traduction maintient donc la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct demeure bref et énergique. L’expression « dans ton cœur » conserve l’image sémitique tout en étant éclairée par une note.
