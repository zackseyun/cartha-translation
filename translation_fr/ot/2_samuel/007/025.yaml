  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: fr
  text: Et maintenant, Yahweh Dieu, fais subsister pour toujours la parole[a] que tu as prononcée au sujet de ton serviteur et de sa maison[b], et fais comme tu l’as dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la promesse ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « sa maison » désigne sa lignée royale, sa dynastie, et non seulement les personnes de son foyer.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Le nom divin יהוה est translittéré « Yahweh », tandis que אֱלֹהִים est rendu par le titre courant « Dieu » ; l’ensemble forme ici une apostrophe directe.
- source_word: הַדָּבָר
  choice: la parole
  rationale: דָּבָר désigne ici ce que Dieu a déclaré au sujet de David et de sa maison. « La parole » conserve l’expression hébraïque sans expliciter d’emblée son caractère de promesse.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette prière royale, עֶבֶד exprime l’humble service de David devant Dieu ; « serviteur » convient au contexte mieux que « esclave ».
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: Le terme בַּיִת garde l’image centrale de la « maison » tout en désignant ici la lignée royale, donc la dynastie de David.
- source_word: הָקֵם
  choice: fais subsister
  rationale: Le hiphil impératif de קום demande à Dieu de faire tenir fermement et durablement sa parole. « Fais subsister » restitue cette image avec un complément abstrait, sans confondre ce verbe avec l’accomplissement exprimé ensuite.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression indique une durée perpétuelle ; « pour toujours » est clair et naturel en français moderne.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: et fais ce que tu as dit
  rationale: Cette formulation conserve la simplicité de עשה et le lien explicite entre l’action demandée et la parole antérieure de Dieu.
theological_decisions:
- issue: Faut-il expliciter דָּבָר comme une « promesse » dans ce contexte d’alliance ?
  choice: la parole
  alternative: la promesse
  rationale: Le contexte donne bien à cette parole la force d’une promesse, mais l’hébreu emploie le terme plus large דָּבָר. Le texte principal préserve cette formulation et la note signale l’interprétation contextuelle.
- issue: Faut-il rendre בֵּיתוֹ directement par « dynastie » ?
  choice: sa maison
  alternative: sa dynastie
  rationale: Le sens dynastique est essentiel dans 2 Samuel 7, mais « maison » maintient le jeu de sens structurant du chapitre entre demeure, famille et lignée royale. Une note en précise ici la portée.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement convient à la prière biblique en français courant. « Fais subsister » conserve l’idée hébraïque de faire tenir fermement la parole, tandis que la dernière proposition reste concise et naturelle.
