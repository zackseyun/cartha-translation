  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת לְ֠/מִ/יּוֹם הַעֲלֹתִ֞/י אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶֽהְיֶה֙ מִתְהַלֵּ֔ךְ בְּ/אֹ֖הֶל וּ/בְ/מִשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: fr
  text: Car je n’ai pas habité dans une maison depuis le jour où j’ai fait monter les fils d’Israël[a] hors d’Égypte jusqu’à ce jour ; j’ai été en déplacement dans une tente et dans un tabernacle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites » ; traduction traditionnelle : « les enfants d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot rendu par « tabernacle » peut aussi signifier « demeure » ou « lieu d’habitation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: j’ai habité
  rationale: ישׁב désigne ici le fait d’habiter ou de résider. « Habiter » est naturel en français moderne et convient à la période qui va de la sortie d’Égypte jusqu’au moment présent du récit.
- source_word: בְּבַיִת
  choice: dans une maison
  rationale: Le nom n’est pas défini en hébreu. « Maison » conserve le sens ordinaire du mot sans introduire explicitement l’interprétation « temple ».
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: depuis le jour où j’ai fait monter
  rationale: La locution marque le point de départ temporel, et le hifil de עלה exprime l’action divine de faire monter, formulation caractéristique de la sortie d’Égypte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction reflète directement le masculin pluriel construit de l’hébreu. Une note signale les formulations françaises plus idiomatiques qui désignent collectivement le même peuple.
- source_word: מִמִּצְרַיִם
  choice: hors d’Égypte
  rationale: Avec « faire monter », « hors d’Égypte » exprime clairement le mouvement de sortie indiqué par la préposition מִן.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule temporelle française naturelle qui conserve la continuité depuis l’exode jusqu’au présent du discours.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: je suis allé de lieu en lieu
  rationale: La construction avec le participe hitpael exprime une mobilité prolongée. « Aller de lieu en lieu » rend cette idée sans suggérer une simple marche à pied.
- source_word: בְּאֹהֶל
  choice: dans une tente
  rationale: « Tente » est le sens concret ordinaire du nom et évoque le caractère transportable de la présence divine.
- source_word: וּבְמִשְׁכָּן
  choice: et dans un tabernacle
  rationale: מִשְׁכָּן peut désigner une demeure ou le sanctuaire mobile. « Tabernacle » garde ici le terme cultuel traditionnel tout en maintenant distincts les deux noms hébreux.
theological_decisions:
- issue: Rendu genré de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Le texte principal conserve la forme masculine explicite de l’hébreu sans nier que l’expression désigne collectivement le peuple ; la note fournit les équivalents collectifs courants.
- issue: Terminologie cultuelle de מִשְׁכָּן
  choice: un tabernacle
  alternative: une demeure ; un sanctuaire mobile
  rationale: Le contexte concerne le sanctuaire transportable antérieur au temple. « Tabernacle » préserve ce cadre historique et cultuel, tandis que la note maintient visible le sens lexical plus large de « demeure ».
- issue: Relation entre la tente et le tabernacle
  choice: dans une tente et dans un tabernacle
  alternative: avec une tente et une demeure ; dans une tente servant de demeure
  rationale: La traduction maintient la coordination des deux substantifs du texte hébreu plutôt que de décider silencieusement s’ils désignent deux réalités ou deux aspects d’une même réalité.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. « Habité » est préféré à « demeuré » pour éviter l’ambiguïté avec le nom « demeure ». Le point-virgule rend le contraste contextuel sans transformer la conjonction hébraïque en opposition trop appuyée.
