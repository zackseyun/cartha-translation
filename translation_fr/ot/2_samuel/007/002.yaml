    issue: Relation spatiale de בְּתוֹךְ rendue par « sous »
    rationale: בְּתוֹךְ indique l’intérieur ou le milieu, non une position sous une couverture. La correction en « au milieu des tentures » conserve l’image d’un abri textile et la relation exprimée par l’hébreu.
