  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל נָתָ֣ן הַ/נָּבִ֔יא רְאֵ֣ה נָ֔א אָנֹכִ֥י יוֹשֵׁ֖ב בְּ/בֵ֣ית אֲרָזִ֑ים וַֽ/אֲרוֹן֙ הָֽ/אֱלֹהִ֔ים יֹשֵׁ֖ב בְּ/ת֥וֹךְ הַ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: fr
  text: 'Le roi dit au prophète Nathan : « Vois donc ! Moi, j’habite une maison en bois de cèdre, tandis que l’arche de Dieu demeure au milieu des tentures[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu d’une tenture ». Le terme hébreu désigne une toile ou une tenture de tente, notamment celles qui servaient de couvertures au tabernacle.
    reason: Alternative lexicale ; le singulier hébreu peut désigner une tenture particulière ou avoir une valeur collective.
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Le roi dit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple rend naturellement cette progression sans qu’il soit nécessaire d’ajouter « et ».
- source_word: נָתָן הַנָּבִיא
  choice: au prophète Nathan
  rationale: Cette formulation française naturelle conserve le nom propre et le titre apposé.
- source_word: רְאֵה נָא
  choice: Vois donc !
  rationale: « Vois » traduit l’impératif, et « donc » rend ici la particule נָא comme une invitation insistante à considérer la situation, plutôt que comme une supplication.
- source_word: אָנֹכִי יוֹשֵׁב
  choice: Moi, j’habite
  rationale: Le pronom détaché « Moi » conserve l’emphase du pronom indépendant אָנֹכִי, tandis que « habiter » exprime ici le sens résidentiel de ישׁב.
- source_word: בְּבֵית אֲרָזִים
  choice: une maison en bois de cèdre
  rationale: La précision « en bois de » indique clairement que le cèdre est le matériau de construction ou de revêtement et évite l’ambiguïté d’une maison située parmi des cèdres.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: tandis que l’arche de Dieu
  rationale: Le waw introduit ici un contraste entre la demeure du roi et celle de l’arche ; « tandis que » le rend naturellement.
- source_word: יֹשֵׁב בְּתוֹךְ הַיְרִיעָה
  choice: demeure sous une toile de tente
  rationale: « demeure » maintient le parallèle verbal avec l’habitation du roi. יְרִיעָה désigne une toile, tenture ou couverture de tente ; « sous une toile de tente » restitue concrètement cet abri provisoire sans généraliser simplement en « tente ».
theological_decisions:
- issue: Description de l’abri de l’arche
  choice: sous une toile de tente
  alternative: dans une tente ; au milieu des tentures
  rationale: Le texte nomme spécifiquement une יְרִיעָה, et non le sanctuaire ou la tente en général. La traduction conserve cette image concrète sans importer une théologie ultérieure du Temple.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. Le contraste entre la résidence royale et l’abri de l’arche est conservé, ainsi que l’emphase de « Moi ».
