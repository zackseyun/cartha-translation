  revision_rationale: La révision remplace « sous une toile de tente », qui affaiblit et modifie la valeur de בְּתוֹךְ, par « au milieu des tentures ». Elle maintient le contraste entre la maison royale et l’abri textile de l’arche, tout en signalant en note l’ambiguïté liée au singulier hébreu.
