  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֵ֤ךְ וְ/אָֽמַרְתָּ֙ אֶל עַבְדִּ֣/י אֶל דָּוִ֔ד כֹּ֖ה אָמַ֣ר יְהוָ֑ה הַ/אַתָּ֛ה תִּבְנֶה לִּ֥/י בַ֖יִת לְ/שִׁבְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: fr
  text: 'Va dire à mon serviteur David : « Voici ce que dit Yahweh : Est-ce toi qui me bâtiras une maison pour que j’y habite[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Me bâtirais-tu une maison pour que j’y habite ? » La question hébraïque est emphatique et rhétorique.'
    reason: La syntaxe permet une formulation centrée soit explicitement sur « toi », soit sur la nuance rhétorique du projet attribué à David.
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Va dire
  rationale: 'L’impératif suivi du parfait à valeur injonctive forme en français une consigne naturelle et directe : « Va dire ».'
- source_word: עַבְדִּי אֶל דָּוִד
  choice: à mon serviteur David
  rationale: « Serviteur » convient au titre honorifique royal et théologique appliqué à David; l’apposition sans répétition de la préposition est naturelle en français.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle conserve la force de la formule prophétique de messager, tandis que « Yahweh » rend directement le nom divin.
- source_word: הַאַתָּה
  choice: Est-ce toi qui
  rationale: Le pronom explicite précédé de l’interrogatif porte une emphase que rend clairement la tournure française « Est-ce toi qui ».
- source_word: תִּבְנֶה לִּי בַיִת
  choice: me bâtiras une maison
  rationale: « Maison » conserve le terme hébreu et le jeu littéraire avec la « maison » que Yahweh promettra à David; « bâtir » convient au registre de la construction monumentale.
- source_word: לְשִׁבְתִּי
  choice: pour que j’y habite
  rationale: L’infinitif construit exprime ici le but. Le pronom « y » reprend naturellement « maison » en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de בַיִת
  choice: maison
  alternative: temple
  rationale: Même si le bâtiment envisagé est un sanctuaire, « maison » préserve l’expression hébraïque et le jeu théologique central du chapitre entre la maison destinée à Dieu et la maison promise à David.
- issue: Force de la question הַאַתָּה תִּבְנֶה
  choice: Est-ce toi qui me bâtiras… ?
  alternative: Me bâtirais-tu… ?
  rationale: La formulation retenue maintient l’emphase sur « toi » et laisse entendre la portée rhétorique sans transformer la question en affirmation explicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici ce que dit » évite l’archaïsme de « Ainsi parle » tout en maintenant le registre prophétique. « Bâtir » soutient le ton littéraire et le jeu sur la maison sans être obscur.
