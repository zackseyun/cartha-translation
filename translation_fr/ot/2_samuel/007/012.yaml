base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: fr
  text: Quand tes jours seront accomplis et que tu te coucheras auprès de tes ancêtres[a], je susciterai après toi un descendant[b], issu de ton propre corps[c], et j’affermirai son royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « avec tes pères » : expression hébraïque évoquant la mort et le fait de rejoindre ses ancêtres.'
    reason: cultural_note
  - marker: b
    text: Le mot hébreu peut désigner la descendance collectivement ou un descendant qui la représente.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « qui sortira de tes entrailles », expression indiquant qu’il s’agira de ta propre descendance biologique.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: Quand tes jours seront accomplis
  rationale: כִּי introduit ici la circonstance temporelle à venir. Cette formulation conserve l’image hébraïque des jours qui arrivent à leur plénitude ainsi que le ton solennel.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: et que tu te coucheras auprès de tes ancêtres
  rationale: La traduction garde la métaphore hébraïque de la mort tout en employant « ancêtres », plus naturel et inclusif en français moderne que le calque « pères ».
- source_word: וַהֲקִימֹתִי
  choice: je susciterai
  rationale: Le hifil de קום, avec la descendance comme complément, exprime l’action de faire surgir un successeur. « Susciter » convient au contexte dynastique sans se confondre avec l’affermissement du royaume exprimé ensuite.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: זֶרַע peut désigner une postérité collectivement ou un descendant représentatif. « Descendance » maintient mieux cette amplitude que « descendant ».
- source_word: אַחֲרֶיךָ
  choice: après toi
  rationale: La locution marque simplement la succession temporelle et dynastique.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: qui sera issue de ton propre corps
  rationale: La formulation communique clairement la filiation biologique exprimée littéralement par une sortie des parties intérieures, sans employer un terme archaïque comme « reins ».
- source_word: וַהֲכִינֹתִי
  choice: et j’affermirai
  rationale: Le hifil de כון signifie rendre ferme, assurer ou établir. « Affermir » conserve cette nuance et distingue le verbe de וַהֲקִימֹתִי.
- source_word: מַמְלַכְתּוֹ
  choice: son royaume
  rationale: מַמְלָכָה désigne ici le royaume ou la souveraineté du successeur promis. « Royaume » est clair et naturel dans ce contexte dynastique.
theological_decisions:
- issue: Portée de זַרְעֲךָ dans la promesse faite à David
  choice: ta descendance
  alternative: ton descendant
  rationale: Le nom hébreu peut fonctionner collectivement ou renvoyer à un représentant singulier. « Descendance » préserve cette tension, tandis que le singulier « son royaume » reflète la grammaire du texte sans limiter explicitement la promesse à une seule portée.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la mort est conservée sous une forme compréhensible; le vocabulaire dynastique reste soutenu sans archaïsmes inutiles. Les notes explicitent les idiomes et l’ambiguïté réelle de זֶרַע.
