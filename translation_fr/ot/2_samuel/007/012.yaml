  to: Quand tes jours seront accomplis et que tu te coucheras auprès de tes ancêtres[a], je susciterai après toi un descendant[b], issu de ton propre corps[c], et j’affermirai son royaume.
  rationale: Le remplacement de « ta descendance » par « un descendant » résout l’incohérence grammaticale et référentielle française avec « issu » et « son royaume », tout en restant fidèle à la présentation singulière du successeur dans le verset. La note b préserve explicitement l’ambiguïté sémantique de זֶרַע et évite de trancher sa portée théologique ou dynastique au-delà du texte.
