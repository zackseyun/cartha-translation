id: 2SA.7.13
reference: 2 Samuel 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: fr
  text: C’est lui qui bâtira une maison pour mon nom[a], et j’affermirai pour toujours le trône de son royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un temple pour mon nom ». L’hébreu dit littéralement « une maison pour mon nom », ce qui préserve le jeu de sens du chapitre entre un sanctuaire et une dynastie.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: C’est lui qui
  rationale: Le pronom indépendant explicite le sujet et peut porter une légère mise en relief. Cette tournure française naturelle la conserve sans surcharger le texte.
- source_word: יִבְנֶה
  choice: bâtira
  rationale: L’imparfait qal a ici une valeur future dans le contexte de la promesse. « Bâtira » convient aussi naturellement à une maison ou à un sanctuaire.
- source_word: בַּיִת
  choice: une maison
  rationale: Le nom signifie littéralement « maison ». Le contexte désigne le sanctuaire, mais ce choix préserve le jeu de sens du chapitre entre la maison-sanctuaire et la maison-dynastie.
- source_word: לִשְׁמִי
  choice: pour mon nom
  rationale: Cette traduction directe conserve l’expression théologique hébraïque sans l’expliciter indûment.
- source_word: וְכֹנַנְתִּי
  choice: et j’affermirai
  rationale: Le parfait avec conjonction poursuit ici la promesse avec une valeur future. « Affermir » exprime l’idée de rendre stable et durable dans un contexte royal.
- source_word: אֶת כִּסֵּא
  choice: le trône
  rationale: Dans le contexte royal, כִּסֵּא désigne directement le trône; le marqueur d’objet אֶת n’est pas rendu séparément.
- source_word: מַמְלַכְתּוֹ
  choice: de son royaume
  rationale: Le terme désigne le royaume ou la domination royale. « De son royaume » complète naturellement « le trône ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette locution exprime ici la permanence de la promesse. « Pour toujours » en restitue clairement toute la portée.
theological_decisions:
- issue: Faut-il traduire בַּיִת littéralement par « maison » ou l’interpréter par « temple »?
  choice: maison
  alternative: temple
  rationale: 'Le référent immédiat est le sanctuaire que bâtira le fils de David, mais le chapitre repose sur le double sens de « maison » : sanctuaire et dynastie. Le texte principal préserve cette tension littéraire et théologique.'
- issue: Quelle force donner à עַד עוֹלָם dans la promesse davidique?
  choice: pour toujours
  alternative: pour très longtemps
  rationale: Dans ce contexte d’alliance, l’expression présente la permanence de la royauté promise; il ne convient pas d’en réduire la portée à une durée simplement indéfinie.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est lui qui » rend l’explicitation du sujet; « maison » maintient le jeu de sens central, avec « temple » signalé en note.
