  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: fr
  text: et depuis le jour où j’ai établi des juges sur mon peuple Israël. Je t’ai accordé du repos, loin de tous tes ennemis. Yahweh t’annonce aussi que Yahweh te fera une maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, « maison » désigne probablement une dynastie, tout en faisant écho au désir de David de bâtir une maison, c’est-à-dire un temple, pour Yahweh. On pourrait aussi traduire : « Yahweh te bâtira une maison ».'
    reason: Préciser le double sens de בַּיִת et signaler une autre traduction possible de יַעֲשֶׂה.
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: et depuis le jour
  rationale: « Depuis » exprime naturellement en français le point de départ temporel, tandis que « et » maintient le lien avec la phrase précédente.
- source_word: צִוִּיתִי שֹׁפְטִים
  choice: j’ai établi des juges
  rationale: Dans ce contexte, צוה désigne l’institution ou la désignation des juges, et non un simple ordre qui leur serait adressé.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sur mon peuple Israël
  rationale: La préposition עַל marque ici l’autorité exercée par les juges sur Israël.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: Je t’ai accordé le repos en te délivrant de tous tes ennemis
  rationale: Le hiphil de נוח signifie donner ou accorder le repos. La formulation explicite le sens relationnel de מִן sans suggérer que David se repose littéralement « de » personnes.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: Yahweh t’annonce aussi
  rationale: נגד au hiphil signifie annoncer ou déclarer. « Aussi » rend la valeur connective de וְ et marque le nouvel élément de l’annonce divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: que Yahweh te fera une maison
  rationale: Cette formulation reste proche de עשה et conserve le jeu intentionnel sur « maison », qui peut évoquer à la fois un édifice et une lignée dynastique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette fonction au lieu de lui substituer un titre.
- issue: Sens de בַּיִת dans la promesse faite à David
  choice: maison, avec son ambiguïté dynastique
  alternative: dynastie / maison royale / temple
  rationale: Le passage joue sur le projet de David de bâtir une maison pour Dieu et sur la promesse de Dieu de faire une maison à David. Traduire seulement par « dynastie » supprimerait ce jeu littéraire et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « te fera une maison », légèrement marqué, est conservé afin de respecter le verbe hébreu et de ne pas effacer l’ambiguïté centrale du mot « maison ».
