    issue: « en te délivrant de tous tes ennemis »
    rationale: Cette reformulation introduit « délivrer », alors que le hiphil de נוח exprime directement le fait de donner/accorder le repos, « de/loin de tous tes ennemis ». Il est préférable de conserver l’image du repos dans le texte.
  - severity: low
    issue: Citation alternative incomplète dans la note
    rationale: La citation « te bâtira une maison » omet le sujet explicite et se lit moins bien comme traduction autonome. La formulation complète « Yahweh te bâtira une maison » est plus claire.
