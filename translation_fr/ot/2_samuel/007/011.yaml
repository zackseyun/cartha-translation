  to: et depuis le jour où j’ai établi des juges sur mon peuple Israël. Je t’ai accordé du repos, loin de tous tes ennemis. Yahweh t’annonce aussi que Yahweh te fera une maison[a].
  rationale: La révision élimine l’explicitation de la délivrance afin de rendre directement le repos que Yahweh accorde à David face à tous ses ennemis. Elle conserve « aussi », lecture possible du waw conjonctif dans cette annonce, ainsi que « fera une maison », qui maintient l’ambiguïté voulue de בַּיִת. La note est seulement complétée pour que l’alternative soit une phrase française autonome.
