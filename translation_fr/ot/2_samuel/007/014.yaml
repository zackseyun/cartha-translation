source:
  edition: WLC
  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: fr
  text: Je serai pour lui un père, et il sera pour moi un fils. Quand il commettra une faute, je le corrigerai avec le bâton des hommes et avec les coups des êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Je serai pour lui un père
  rationale: La construction relationnelle avec ל est conservée; cette formulation reste naturelle en français et fait écho à la proposition réciproque qui suit.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: et il sera pour moi un fils
  rationale: Cette formulation préserve le parallélisme de la formule d’alliance sans la lisser en « il sera mon fils ».
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: Quand il fera le mal
  rationale: « Quand » exprime la circonstance temporelle introduite par אֲשֶׁר sans accentuer artificiellement une condition; « fera le mal » rend clairement et sobrement l’idée de faute morale portée par עוה.
- source_word: וְהֹכַחְתִּיו
  choice: je le corrigerai
  rationale: Le hiphil de יכח désigne ici une correction disciplinaire, comme le confirment les images du bâton et des coups; « corriger » est actuel et n’implique pas seulement une réprimande verbale.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: avec le bâton des hommes
  rationale: La métaphore du bâton est maintenue, ainsi que l’ambiguïté entre une correction humaine ordinaire et une correction administrée par des agents humains.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: et avec les coups des fils d’Adam
  rationale: « Coups » rend concrètement נגע dans ce contexte. « Fils d’Adam » reproduit l’expression hébraïque et son lien lexical avec l’humanité, tandis qu’une formulation française plus idiomatique est donnée en note.
theological_decisions:
- issue: Portée de la promesse de filiation dans la lignée royale de David et son emploi messianique ultérieur
  choice: Traduire le verset selon son sens historique immédiat concernant le descendant royal de David, sans ajouter d’interprétation messianique explicite.
  alternative: Rendre le texte principal comme une annonce directement et exclusivement messianique.
  rationale: Le passage concerne d’abord le descendant et la dynastie de David. Sa formulation peut recevoir un emploi messianique ultérieur, mais la traduction ne doit pas introduire dans l’hébreu une précision christologique qui n’y est pas explicitée.
- issue: Valeur temporelle ou conditionnelle de אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: Quand il fera le mal
  alternative: S’il fait le mal
  rationale: La formulation temporelle suit la construction hébraïque et conserve la perspective d’une correction en cas de faute sans transformer explicitement la proposition en condition hypothétique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme relationnel « pour lui un père / pour moi un fils » et les métaphores disciplinaires sont conservés. « Fils d’Adam » garde la forme imagée de l’hébreu; la note en explicite le sens générique.
