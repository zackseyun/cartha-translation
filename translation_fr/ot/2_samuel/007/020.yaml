  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: fr
  text: Que pourrait encore te dire David ? Toi, tu connais ton serviteur, Seigneur Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: Que pourrait encore te dire David ?
  rationale: La tournure יסף + עוד + infinitif signifie ici, de manière idiomatique, « dire encore » ou « dire de plus ». Le conditionnel « pourrait » rend naturellement la portée rhétorique de la question, tandis que « te dire » conserve l’adresse directe.
- source_word: וְאַתָּה
  choice: Toi, tu
  rationale: Le pronom hébreu explicite met le destinataire en relief. La dislocation « Toi, tu » reproduit cette insistance dans un français naturel; la conjonction est rendue par l’enchaînement du discours plutôt que par un « et » peu fluide.
- source_word: יָדַעְתָּ
  choice: connais
  rationale: Le parfait hébreu décrit ici une connaissance établie et actuelle; le présent français convient le mieux.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette prière royale, le mot עבד est une autodésignation humble devant Dieu. « Serviteur » convient mieux au contexte que « esclave », sans nier la relation de dépendance exprimée par l’hébreu.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « Seigneur » et le nom divin יהוה par « Yahweh », ce qui distingue les deux éléments du titre composé et préserve le nom propre présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה dans le titre אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU; Seigneur, l’Éternel
  rationale: « Seigneur Yahweh » représente directement les deux termes hébreux sans transformer le nom divin en titre ni produire la répétition « Seigneur SEIGNEUR ». Cette formulation reste intelligible en français moderne et conserve la valeur du nom d’alliance.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond au singulier hébreu de l’adresse à Dieu. La question rhétorique est formulée avec naturel, et l’emphase du pronom וְאַתָּה est conservée par « Toi, tu ».
