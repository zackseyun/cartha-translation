  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: fr
  text: Et qui est comme ton peuple, comme Israël, l’unique nation sur la terre que Dieu est allé racheter pour en faire son peuple, pour se faire un nom et pour accomplir pour vous de grandes et redoutables œuvres[a] pour ton pays, devant ton peuple que tu as racheté pour toi hors d’Égypte[b], des nations et de leurs dieux ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des œuvres grandes et terribles ». Le terme hébreu peut qualifier des actes qui inspirent le saisissement, la crainte ou l’effroi.
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset est difficile en hébreu. On peut aussi comprendre : « hors d’Égypte, des nations et de son dieu » ou « hors d’Égypte, des nations et des dieux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: Et qui est comme ton peuple, comme Israël
  rationale: Conserve la question rhétorique d’incomparabilité ainsi que la reprise emphatique qui identifie le peuple à Israël.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: l’unique nation sur la terre
  rationale: Exprime la singularité d’Israël parmi les nations sans réduire אֶחָד à un simple article indéfini.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: que Dieu soit allé
  rationale: Le singulier « Dieu » convient au contexte, tandis que « soit allé » garde l’image concrète du déplacement divin et s’intègre à la relative après une expression d’unicité.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: racheter pour en faire son peuple
  rationale: « Racheter » rend פדה; la tournure française exprime naturellement le résultat visé, à savoir la constitution d’un peuple appartenant à Dieu.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: pour se faire un nom
  rationale: Rend naturellement l’expression hébraïque désignant l’acquisition d’une renommée par des actes remarquables.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: pour accomplir en votre faveur
  rationale: Maintient explicitement le pluriel לָכֶם, qui s’adresse collectivement au peuple, malgré le retour immédiat au singulier dans « ton pays ».
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: des œuvres grandes et redoutables
  rationale: « Œuvres » convient à des interventions divines; « redoutables » préserve l’idée d’actes suscitant à la fois crainte et saisissement.
- source_word: לְאַרְצְךָ
  choice: pour ton pays
  rationale: Le singulier hébreu est conservé et « pays » désigne ici naturellement le territoire d’Israël.
- source_word: מִפְּנֵי עַמְּךָ
  choice: devant ton peuple
  rationale: Conserve la valeur spatiale de מִפְּנֵי sans ajouter explicitement un verbe tel que « chasser », absent de ce verset.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: que tu as racheté pour toi hors d’Égypte
  rationale: Reprend « racheter » pour le second emploi de פדה et maintient l’idée d’appartenance exprimée par לְּךָ.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: des nations et de leurs dieux
  rationale: 'Lecture contextuellement cohérente de la finale comprimée: les nations et leurs dieux sont associés à ce qui est ôté devant Israël; la difficulté grammaticale demeure signalée en note.'
theological_decisions:
- issue: Nombre et référent de אֱלֹהִים
  choice: « Dieu » au singulier, désignant le Dieu d’Israël
  alternative: « des dieux » au pluriel
  rationale: Malgré la forme morphologiquement plurielle, le contexte présente le Dieu d’Israël comme l’auteur unique du rachat; le singulier français rend ce sens sans introduire un polythéisme étranger au discours.
- issue: Alternance entre לָכֶם au pluriel et les suffixes au singulier
  choice: « en votre faveur » puis « ton pays / ton peuple »
  alternative: Uniformiser tous les pronoms au singulier ou au pluriel
  rationale: Le texte massorétique passe réellement du pluriel au singulier. La traduction conserve cette variation plutôt que de la corriger silencieusement.
- issue: Finale difficile גּוֹיִם וֵאלֹהָיו
  choice: « des nations et de leurs dieux »
  alternative: « d’Égypte, des nations et de son dieu » ou « d’Égypte, des nations et des dieux »
  rationale: La lecture principale s’accorde avec le contexte du rachat et de l’éviction des peuples devant Israël, mais les autres analyses possibles sont maintenues en note afin de ne pas masquer l’incertitude syntaxique.
translation_notes:
  register: Français international moderne, digne et lisible. La longue période et les reprises sont conservées pour refléter la prière solennelle, tout en employant des formulations idiomatiques. L’alternance source entre « votre » et « ton » est volontairement maintenue.
