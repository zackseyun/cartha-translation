  terminology: « Racheter » rend bien פדה dans les deux occurrences; « se faire un nom » est idiomatique; « grandes et redoutables » conserve l’idée d’actes inspirant crainte et saisissement. « Nations et leurs dieux » demeure une résolution française recevable de la finale comprimée, avec les autres analyses signalées en note.
