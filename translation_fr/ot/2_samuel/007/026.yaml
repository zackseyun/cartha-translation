    rationale: « Yahweh des armées » peut se lire en français comme si Yahweh était déterminé par les armées. L’apposition « Yahweh, le Dieu des armées » rend clairement le titre hébreu et s’intègre mieux à la phrase.
  - severity: medium
    issue: « Dieu sur Israël » est trop calqué
    rationale: La préposition עַל exprime ici vraisemblablement l’autorité. « Dieu qui règne sur Israël » rend cette relation dans un français naturel, sans la remplacer par la relation possessive plus étroite de « Dieu d’Israël ».
  - severity: low
    issue: Lien de la citation à la grandeur du nom insuffisamment explicite
    rationale: לֵאמֹר introduit la parole par laquelle le nom est reconnu grand. « Afin que l’on dise » restitue naturellement cette relation.
