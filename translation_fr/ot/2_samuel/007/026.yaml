source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: fr
  text: 'Que ton nom soit grand à jamais, afin que l’on dise : « Yahweh, le Dieu des armées, est Dieu qui règne sur Israël ! » Que la maison[a] de ton serviteur David soit affermie devant toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, la « maison » de David désigne sa famille royale, c’est-à-dire sa dynastie, et non simplement un bâtiment.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: Que … soit grand
  rationale: Dans cette prière, l’imparfait à valeur volitive exprime un souhait. Le qal est rendu directement par « soit grand », sans lui imposer un passif absent de la forme hébraïque.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Cette formulation conserve l’idiome hébreu, où le nom peut évoquer la renommée et l’identité révélée, sans expliciter une seule de ces nuances.
- source_word: עַד עוֹלָם
  choice: à jamais
  rationale: Expression française naturelle et digne qui rend la durée perpétuelle.
- source_word: לֵאמֹר
  choice: et que l’on dise
  rationale: Le français explicite naturellement le sujet indéfini sous-entendu de la formule citationnelle et rattache la confession qui suit au souhait exprimé.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, tandis que « des armées » conserve l’image du titre צְבָאוֹת sans la limiter explicitement aux seules armées humaines.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: est Dieu sur Israël
  rationale: Cette formulation garde la préposition עַל et sa nuance probable d’autorité, au lieu de la remplacer par le plus interprétatif « Dieu d’Israël ».
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: Que la maison de ton serviteur David
  rationale: « Maison » préserve le terme concret et le jeu de sens central du chapitre, tout en portant ici son sens dynastique. La tournure optative convient à la prière.
- source_word: יִהְיֶה נָכוֹן
  choice: soit affermie
  rationale: Avec היה, נָכוֹן exprime l’idée d’une réalité rendue ferme, stable et durable. « Soit affermie » convient à la maison dynastique.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Traduction directe qui conserve la dimension relationnelle de ce qui subsiste en présence de Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie le nom divin lui-même. La translittération « Yahweh » le distingue d’un titre et préserve sa fonction de nom d’alliance.
- issue: Rapport de Dieu à Israël dans אֱלֹהִים עַל יִשְׂרָאֵל
  choice: Dieu sur Israël
  alternative: le Dieu d’Israël ; Dieu pour Israël
  rationale: La traduction retenue préserve la construction avec עַל et sa nuance de souveraineté, sans convertir silencieusement la relation en possession ou en faveur.
- issue: Sens de « maison » dans la promesse faite à David
  choice: Conserver « maison » dans le texte et préciser son sens dynastique en note
  alternative: dynastie ; lignée
  rationale: Le mot בַּיִת signifie bien « maison », mais désigne ici la famille royale et sa continuité. Le conserver maintient le jeu de mots de 2 Samuel 7 entre la maison bâtie pour Dieu et celle que Dieu établit pour David.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure en deux souhaits est conservée. « Que l’on dise » rend la formule hébraïque de citation de façon idiomatique ; « Dieu sur Israël », légèrement marqué en français, maintient délibérément la nuance d’autorité de la préposition hébraïque.
