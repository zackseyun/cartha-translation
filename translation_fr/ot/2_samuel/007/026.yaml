  verdict: revise
  source_fidelity: Le texte rend correctement les deux souhaits, « ton nom », « à jamais », la maison dynastique de David et « devant toi ». La valeur de souveraineté de עַל dans « Dieu sur Israël » est conservée, mais la formulation française actuelle est inutilement heurtée. Le titre יְהוָה צְבָאוֹת est plus fidèlement et plus naturellement rendu comme un groupe appositif (« Yahweh, le Dieu des armées ») que par « Yahweh des armées ».
  naturalness: « Dieu sur Israël » et « Yahweh des armées » ne sont pas naturels en français international moderne. « Dieu qui règne sur Israël » communique explicitement, sans surinterprétation confessionnelle, la relation d’autorité portée par עַל. « Afin que l’on dise » rend avec fluidité le lien de לֵאמֹר à la grandeur du nom.
  terminology: « Yahweh » est maintenu. « Le Dieu des armées » est un titre français clair pour צְבָאוֹת, sans réduire les armées à des forces humaines. « Maison » est conservé et sa portée dynastique est utilement expliquée en note.
