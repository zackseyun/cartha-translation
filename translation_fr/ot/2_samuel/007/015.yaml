  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: fr
  text: Mais mon amour fidèle[a] ne s’éloignera pas de lui, comme je l’ai retiré à Saül, que j’ai retiré de devant toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma bonté », « ma bienveillance » ou « ma loyauté envers l’alliance ». Le mot hébreu désigne ici un amour loyal et durable dans le cadre d’une relation d’alliance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « que j’ai retiré de devant toi ». L’expression peut évoquer la destitution de Saül par rapport à David, et non seulement son éloignement physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: ma fidélité
  rationale: Dans ce contexte d’alliance, חֶסֶד exprime l’attachement loyal et durable de Dieu. « Ma fidélité » est naturel en français et conserve la dimension relationnelle et alliancielle du terme.
- source_word: יָסוּר
  choice: ne se retirera pas
  rationale: Le verbe סור peut signifier « s’écarter », « se retirer » ou « être ôté ». Avec « ma fidélité » comme sujet, « ne se retirera pas » rend naturellement l’idée de cessation ou d’éloignement tout en maintenant le lien lexical avec les formes causatives qui suivent.
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: La préposition מן avec suffixe exprime ici la séparation d’avec le fils ou descendant royal promis. « De lui » est précis et idiomatique.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » introduit simplement et fidèlement la comparaison avec ce qui est arrivé à Saül.
- source_word: הֲסִרֹתִי
  choice: j’ai retirée / j’ai retiré
  rationale: 'Le hiphil de סור a un sens causatif : « retirer », « écarter ». La répétition de « retirer » conserve le jeu lexical hébreu : Dieu a retiré sa fidélité à Saül et a retiré Saül de devant David.'
- source_word: מֵעִם שָׁאוּל
  choice: à Saül
  rationale: Avec le verbe français « retirer », la tournure « retirer quelque chose à quelqu’un » exprime naturellement la séparation indiquée par מֵעִם.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: que j’ai retiré de devant toi
  rationale: Cette formulation garde l’image hébraïque de מִלְּפָנֶיךָ, « de devant toi », sans préciser au-delà du texte de quelle manière Saül a été écarté par rapport à David.
theological_decisions:
- issue: Portée de חֶסֶד dans le contexte de l’alliance davidique
  choice: « ma fidélité »
  alternative: « mon amour fidèle », « ma bonté », « ma loyauté envers l’alliance »
  rationale: Le verset oppose la faveur loyale et durable accordée à la lignée de David à celle qui a été retirée à Saül. « Fidélité » préserve cette force relationnelle et alliancielle sans imposer une formule doctrinale plus étroite.
- issue: Sens de « de devant toi »
  choice: Conserver l’expression « de devant toi »
  alternative: « de ta présence », « de devant ta face », « de sa royauté devant toi »
  rationale: L’hébreu décrit clairement la destitution de Saül en relation avec David, mais ne développe pas ici le sens exact de l’image. La formulation retenue préserve cette ouverture au lieu de la résoudre par une paraphrase.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition de « retirer » est volontaire : elle reflète les trois occurrences de la même racine hébraïque et distingue clairement, grâce aux accords, la fidélité retirée (« retirée ») de Saül retiré (« retiré »).'
