    issue: Rendu de חַסְדִּי par « ma fidélité »
    rationale: Bien que défendable, « fidélité » désigne plus spontanément une qualité de constance que l’amour loyal, bienveillant et durable que le contexte attribue à Dieu envers le descendant. « Mon amour fidèle » rend plus explicitement la portée relationnelle de חֶסֶד.
  - severity: low
    issue: Collocation « ma fidélité ne se retirera pas de lui »
    rationale: La phrase est intelligible, mais son idiomaticité est moindre. Avec « amour fidèle », « ne s’éloignera pas de lui » est plus fluide et conserve l’idée de non-départ portée par יָסוּר.
