source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: fr
  text: 'Partout où j’ai marché au milieu de tous les fils d’Israël, ai-je jamais adressé une parole à l’une des tribus d’Israël[a], à laquelle j’avais ordonné de faire paître mon peuple Israël, en disant : « Pourquoi ne m’avez-vous pas construit une maison de cèdre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de 2 Samuel porte « l’une des tribus d’Israël » ; le passage parallèle de 1 Chroniques 17.6 porte « l’un des juges d’Israël », ce qui désigne vraisemblablement les dirigeants chargés de faire paître le peuple.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: j’ai marché
  rationale: Conserve la métaphore concrète du déplacement de Dieu au milieu de son peuple, plutôt que de la réduire à une simple résidence.
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: Partout où… au milieu de tous les fils d’Israël
  rationale: « Partout où » rend naturellement la construction idiomatique en accord avec l’image de la marche; « au milieu de » exprime la présence parmi le peuple.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend formellement l’expression hébraïque masculine qui sert ici de désignation nationale traditionnelle.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: ai-je jamais adressé une parole
  rationale: La question rhétorique et l’emploi apparenté de « parole/parler » renforcent la négation; « jamais » en restitue la force en français naturel.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: l’une des tribus d’Israël
  rationale: Suit le texte massorétique de Samuel, qui porte « tribus », sans introduire dans le corps du texte la leçon parallèle « juges ».
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: à qui j’avais ordonné de faire paître
  rationale: Préserve la métaphore pastorale. Le plus-que-parfait marque naturellement l’antériorité de l’ordre en français.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: mon peuple Israël
  rationale: Conserve l’apposition et l’idée d’appartenance à Dieu.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Maintient explicitement la formule hébraïque qui introduit la citation.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: Pourquoi ne m’avez-vous pas construit une maison en bois de cèdre ?
  rationale: Le pluriel « avez-vous » reflète la forme hébraïque; « maison en bois de cèdre » indique clairement le matériau en français moderne.
theological_decisions:
- issue: Désignation nationale genrée
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: La forme masculine de l’hébreu est conservée comme désignation traditionnelle, sans neutralisation silencieuse.
- issue: Tension textuelle entre « tribus » et une désignation de dirigeants
  choice: l’une des tribus d’Israël
  alternative: l’un des juges ou dirigeants d’Israël
  rationale: Le texte massorétique de 2 Samuel porte « tribus ». Le parallèle de 1 Chroniques 17.6 et la proposition relative évoquant la mission pastorale expliquent l’autre lecture, signalée en note plutôt qu’intégrée au texte.
- issue: Référent de la proposition relative
  choice: à qui j’avais ordonné de faire paître
  alternative: par l’intermédiaire de laquelle j’avais ordonné de faire paître
  rationale: La formulation maintient l’étrangeté du lien grammatical avec « tribus » et la tension qui suggère des responsables, sans remplacer la leçon reçue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe rhétorique et la métaphore pastorale sont conservées; la légère tension entre « tribus » et le relatif personnel reste perceptible et reçoit une note textuelle.
