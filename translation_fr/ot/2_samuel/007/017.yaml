source:
  edition: WLC
  text: כְּ/כֹל֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וּ/כְ/כֹ֖ל הַ/חִזָּי֣וֹן הַ/זֶּ֑ה כֵּ֛ן דִּבֶּ֥ר נָתָ֖ן אֶל דָּוִֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: fr
  text: Conformément à toutes ces paroles et à toute cette vision[a], Nathan parla ainsi à David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « révélation ». Le terme hébreu désigne une révélation prophétique, souvent reçue sous forme de vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: Conformément à toutes
  rationale: La préposition כְּ exprime ici la conformité, et כֹּל la totalité. « Conformément à toutes » rend ce rapport avec naturel en français.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans le contexte d’un message divin transmis par Nathan, « paroles » préserve la dimension verbale de דְּבָרִים mieux que « choses » ou « faits ».
- source_word: וּכְכֹל
  choice: et à toute
  rationale: La coordination et la répétition de la construction hébraïque sont maintenues, tout en évitant une formulation française inutilement lourde.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: cette vision
  rationale: חִזָּיוֹן désigne une vision de nature prophétique. « Vision » en est l’équivalent direct et conserve le mode de révélation indiqué par le texte.
- source_word: כֵּן
  choice: ainsi
  rationale: כֵּן reprend les deux groupes initiaux et indique que Nathan transmit fidèlement leur contenu. La position finale de « ainsi » produit une phrase française naturelle.
- source_word: דִּבֶּר
  choice: parla
  rationale: Le passé simple convient au récit biblique français dans un registre actuel et digne, tandis que « parla » rend directement le verbe דבר.
- source_word: נָתָן
  choice: Nathan
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: אֶל דָּוִד
  choice: à David
  rationale: La préposition אֶל indique ici le destinataire de la parole; « à David » est la traduction française directe.
theological_decisions:
- issue: Nature de la révélation prophétique exprimée par חִזָּיוֹן
  choice: vision
  alternative: révélation
  rationale: « Vision » traduit directement le terme hébreu et conserve l’indication d’une révélation reçue sous forme visionnaire, sans la réduire à un message générique ni ajouter une précision absente.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle de l’hébreu est conservée par « à toutes ces paroles et à toute cette vision », tandis que « parla ainsi » restitue naturellement la reprise effectuée par כֵּן.
