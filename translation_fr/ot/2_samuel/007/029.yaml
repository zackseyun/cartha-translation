base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: fr
  text: Et maintenant, daigne bénir la maison de ton serviteur[b], afin qu’elle subsiste pour toujours devant toi. Car toi, Seigneur Yahweh[a], tu as parlé, et par ta bénédiction la maison de ton serviteur sera bénie pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Adonaï YHWH », combinaison du titre « Seigneur » et du nom divin Yahweh.
    reason: alternative_reading
  - marker: b
    text: Ici, « maison » peut aussi désigner la maisonnée ou la dynastie de David.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל וּבָרֵךְ
  choice: daigne bénir
  rationale: Le verbe הוֹאֵל exprime ici le consentement bienveillant demandé à Dieu. « Daigne bénir » restitue naturellement en français la supplication respectueuse, sans réduire le verbe à un simple auxiliaire.
- source_word: בֵּית עַבְדְּךָ
  choice: la maison de ton serviteur
  rationale: '« Maison » préserve la polysémie de בַּיִת : maison, maisonnée et lignée dynastique. Le contexte davidique donne une portée dynastique au terme sans qu’il faille l’expliciter dans le texte.'
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: afin qu’elle subsiste pour toujours devant toi
  rationale: Littéralement « pour être à toujours devant toi ». « Subsiste » exprime l’existence durable visée par la prière tout en conservant « devant toi ».
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Cette forme conserve à la fois le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression française ambiguë « Seigneur SEIGNEUR ».
- source_word: דִּבַּרְתָּ
  choice: tu as parlé
  rationale: Le passé composé rend l’action accomplie dont la parole demeure le fondement actuel de la confiance de David.
- source_word: וּמִבִּרְכָתְךָ
  choice: et par ta bénédiction
  rationale: 'La préposition מִן indique ici la source ou le moyen : la bénédiction durable de la maison procède de la bénédiction divine.'
- source_word: יְבֹרַךְ
  choice: sera bénie
  rationale: L’imparfait passif hébreu exprime naturellement ici l’état futur certain fondé sur la parole de Dieu.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression française actuelle et solennelle rend clairement la durée indéfinie et durable du terme עוֹלָם.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le texte associe explicitement le titre « Seigneur » au nom propre divin. Garder « Yahweh » rend visible cette combinaison et suit directement la donnée hébraïque.
- issue: Portée de « maison » dans la promesse faite à David
  choice: maison
  alternative: dynastie
  rationale: Le contexte concerne la descendance royale de David, mais le mot hébreu conserve aussi les sens de maisonnée et de maison. Traduire « dynastie » résoudrait une polysémie littéraire et théologique que le texte maintient.
- issue: Force de הוֹאֵל dans la prière
  choice: daigne
  alternative: veuille bien
  rationale: « Daigne » exprime le consentement gracieux sollicité et convient au registre digne d’une prière. « Veuille bien » serait également possible, mais légèrement plus diffus.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu. « Daigne » conserve le ton respectueux de la supplication; « subsiste » évite le calque raide « soit devant toi » tout en restant proche du sens.
