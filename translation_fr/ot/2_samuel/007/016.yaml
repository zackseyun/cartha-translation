  text: וְ/נֶאְמַ֨ן בֵּיתְ/ךָ֧ וּ/מַֽמְלַכְתְּ/ךָ֛ עַד עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽסְאֲ/ךָ֔ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: fr
  text: Ta maison[a] et ton royaume seront affermis pour toujours devant toi[b] ; ton trône sera établi pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « maison » désigne probablement la maison royale, c’est-à-dire la dynastie.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « devant toi » ; certains témoins textuels lisent « devant moi ».
    reason: textual_variant
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: seront affermis
  rationale: Le nifal de אמן exprime ici ce qui est rendu ferme, assuré et durable. « Seront affermis » conserve cette valeur tout en restant naturel en français et en se distinguant de נָכוֹן dans la seconde proposition.
- source_word: בֵּיתְךָ
  choice: ta maison
  rationale: Dans le contexte d’une promesse royale, בַּיִת peut désigner la maison dynastique. Le terme concret « maison » est conservé dans le texte, tandis que son sens probable est précisé en note.
- source_word: וּמַמְלַכְתְּךָ
  choice: et ton royaume
  rationale: מַמְלָכָה désigne ici le royaume ou la souveraineté royale. « Royaume » rend directement le terme et s’accorde avec « maison » et « trône ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: L’expression marque une durée perpétuelle. Sa répétition est conservée afin de respecter l’insistance de l’hébreu.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Le texte hébreu fourni porte le suffixe de deuxième personne masculine singulière, « devant toi ». La variante « devant moi » est signalée en note.
- source_word: כִּסְאֲךָ
  choice: ton trône
  rationale: Le mot désigne le siège royal et, par métonymie, l’autorité et la continuité de la royauté.
- source_word: יִהְיֶה נָכוֹן
  choice: sera établi
  rationale: Avec היה, נָכוֹן exprime un état de fermeté et de stabilité. « Sera établi » est idiomatique et maintient une variation mesurée par rapport à « seront affermis ».
theological_decisions:
- issue: Portée dynastique de la promesse et possible signification messianique
  choice: Conserver « maison », « royaume » et « trône » dans leur sens royal et dynastique immédiat, sans expliciter une interprétation messianique dans le texte.
  alternative: Traduire « maison » par « dynastie » ou formuler le verset de façon à signaler explicitement un accomplissement messianique.
  rationale: Le verset promet d’abord la continuité de la lignée royale de David. Les termes hébreux permettent une portée théologique plus large, mais la traduction ne doit pas imposer cette interprétation.
- issue: Variation textuelle entre « devant toi » et « devant moi »
  choice: Retenir « devant toi », conformément au texte hébreu fourni, et placer « devant moi » en note.
  alternative: Lire « devant moi » dans le texte principal, selon certains témoins textuels et le contexte du discours divin.
  rationale: La leçon du texte source doit rester prioritaire, tandis que la variante significative mérite d’être préservée sans être tranchée silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme royal est conservé, de même que la répétition de « pour toujours ». Le pluriel « seront affermis » rend naturellement en français le sujet composé « ta maison et ton royaume ».
