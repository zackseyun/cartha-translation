  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: fr
  text: 'Alors le roi David entra, s’assit devant Yahweh et dit : « Qui suis-je, Seigneur Yahweh, et qu’est-ce que ma maison[a], pour que tu m’aies amené jusqu’ici ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « maison » peut désigner la famille, la maisonnée ou la lignée de David. Le même mot joue un rôle central dans tout le chapitre.
    reason: Clarifier la polysémie de בֵּיתִי et préserver le jeu littéraire et dynastique sur la « maison ».
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entra
  rationale: Le verbe בוא décrit ici le déplacement de David vers le lieu où il se tient devant Yahweh. « Entra » conserve ce mouvement concret sans préciser un lieu que le texte ne nomme pas.
- source_word: וַיֵּשֶׁב
  choice: s’assit
  rationale: Dans cette scène, ישב désigne naturellement la posture physique adoptée par David avant sa prière.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend sobrement l’idée de présence exprimée par לִפְנֵי, tandis que le nom divin est conservé sous la forme « Yahweh ».
- source_word: מִי אָנֹכִי
  choice: Qui suis-je
  rationale: Cette formulation française naturelle garde la force rhétorique et l’expression d’humilité de l’hébreu.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Cette traduction distingue le titre אֲדֹנָי du nom divin יְהוִה et évite de les fondre en une seule appellation.
- source_word: וּמִי בֵיתִי
  choice: et qu’est-ce que ma maison
  rationale: L’hébreu emploie littéralement « qui », mais le français demande ici « qu’est-ce que ». Le mot « maison » est maintenu afin de préserver le motif littéraire central du chapitre.
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
  choice: tu m’aies conduit jusqu’ici
  rationale: La tournure exprime le fait que Dieu a fait parvenir David à sa situation présente. « Conduit jusqu’ici » est idiomatique et conserve à la fois l’action divine et l’idée de progression.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. « Yahweh » le représente directement et permet aussi de rendre distinctement le titre composé אֲדֹנָי יְהוִה par « Seigneur Yahweh ».
- issue: Portée du mot בַּיִת appliqué à David
  choice: ma maison
  alternative: ma famille / ma maisonnée / ma dynastie
  rationale: Dans tout 2 Samuel 7, « maison » relie le projet de David concernant le sanctuaire à la promesse divine concernant sa lignée. Le maintien du terme préserve cette polysémie sans réduire le sens à la seule famille ou à la seule dynastie.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu sans devenir raide. « Alors » assure la continuité narrative; la répétition de « Yahweh » préserve les deux occurrences du nom divin.
