  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: fr
  text: 'Ahitofel dit à Absalom : « Aie des relations avec les concubines de ton père[a], qu’il a laissées pour garder le palais. Tout Israël apprendra alors que tu es devenu odieux à ton père[b], et tous ceux qui sont avec toi en seront enhardis[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « va/entre auprès de », euphémisme courant pour désigner des relations sexuelles.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu évoque littéralement le fait de devenir infect ou nauséabond, d’où le sens figuré de devenir odieux.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « les mains de tous ceux qui sont avec toi seront fortifiées », expression signifiant qu’ils reprendront courage et assurance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: Aie des relations avec
  rationale: Dans ce contexte, l’expression est un euphémisme désignant des relations sexuelles. La formulation française en communique clairement le sens sans crudité; une note conserve l’image hébraïque.
- source_word: פִּלַגְשֵׁי
  choice: concubines
  rationale: « Concubines » est le terme français précis pour des femmes ayant dans la maisonnée royale un statut conjugal reconnu mais inférieur à celui d’une épouse principale.
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: qu’il a laissées pour garder le palais
  rationale: Le verbe שמר exprime ici la garde ou la surveillance. Dans ce récit royal, « palais » rend naturellement הַבָּיִת, la résidence de David.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: Tout Israël apprendra alors
  rationale: Le contexte donne à la proposition une valeur consécutive et future. « Tout Israël » désigne collectivement le peuple.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: tu t’es rendu odieux à ton père
  rationale: Le niphal de באש évoque le fait de devenir infect, offensant ou odieux. Cette formulation conserve la force relationnelle et politique de l’expression sans imposer une traduction littérale peu naturelle.
- source_word: וְחָזְקוּ יְדֵי
  choice: en seront enhardis
  rationale: L’expression idiomatique signifie que leur résolution et leur courage seront affermis. La note signale l’image concrète des mains fortifiées.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: tous ceux qui sont avec toi
  rationale: Cette traduction conserve la formulation relationnelle de l’hébreu sans la réduire explicitement à une catégorie politique comme « partisans ».
theological_decisions:
- issue: Euphémisme sexuel dans un conseil politique royal
  choice: Aie des relations avec les concubines de ton père
  alternative: Va vers les concubines de ton père
  rationale: L’acte sexuel doit être compris comme le signe public d’une rupture irréversible avec David. Le français explicite sobrement l’euphémisme hébreu sans obscurcir ni dramatiser le propos.
- issue: Force de l’expression נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: tu t’es rendu odieux à ton père
  alternative: tu seras devenu infect aux yeux de ton père
  rationale: La formulation retenue préserve l’idée d’une répulsion grave entre Absalom et David tout en restant digne et naturelle; la note maintient l’image olfactive du verbe hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste ferme sans devenir cru. « Palais » contextualise la résidence royale; « enhardis » conserve la nuance de courage accru tout en évitant un calque opaque de l’idiome des mains fortifiées.
