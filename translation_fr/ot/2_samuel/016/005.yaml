base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: fr
  text: Quand le roi David arriva à Bahourim, voici qu’un homme sortit de là. Il était du clan de la maison de Saül et s’appelait Shiméï, fils de Guéra. Il ne cessait de sortir en maudissant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe « sortir » et peut évoquer une action continue ou répétée : « il sortait sans cesse en maudissant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: Quand le roi David arriva à Bahourim
  rationale: Le waw suivi de l’accompli fait progresser le récit, tandis que עַד marque l’arrivée au lieu. « Quand » introduit naturellement en français la circonstance temporelle de la scène suivante.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure conserve la vivacité de הִנֵּה, qui attire l’attention sur l’apparition soudaine du personnage.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: un homme sortit de là
  rationale: Le participe présente l’homme au moment où il sort. Le passé simple convient au fil narratif français, et « de là » préserve le repère spatial de l’hébreu sans préciser davantage son référent.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: du clan de la maison de Saül
  rationale: מִשְׁפָּחָה désigne ici un groupe de parenté, rendu par « clan », tandis que « maison de Saül » maintient la portée familiale et dynastique de בֵּית.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: il s’appelait Shiméï, fils de Guéra
  rationale: Formulation française naturelle qui conserve intégralement la formule d’identification.
- source_word: יֹצֵא יָצוֹא וּמְקַלֵּל
  choice: Il s’avançait en lançant des malédictions
  rationale: Le participe renforcé par l’infinitif absolu décrit une action soutenue ou répétée, accompagnée de malédictions. « S’avançait » rend idiomatiquement le mouvement continu dans la scène, tandis que la note signale la forme plus littérale liée au verbe « sortir ».
