    issue: « qui donc peut lui demander » ajoute « lui » et remplace « dire » par « demander ».
    rationale: וּמִי יֹאמַר signifie littéralement « et qui dira ? ». Le contexte permet de comprendre l’interpellation, mais le texte ne précise pas « à lui » ; « qui donc peut dire » maintient la concision et la portée rhétorique de l’hébreu.
  - severity: low
    issue: La note alternative reprend inutilement la question finale dans la citation alternative.
    rationale: L’alternative concerne l’analyse des particules כי / וכי, non le contenu de la question rhétorique. La note doit isoler clairement la variante de liaison sans donner l’impression que la question fait partie d’une formulation différente.
