  to: 'Mais le roi dit : « Qu’ai-je à faire avec vous, fils de Tserouya ? S’il maudit parce que Yahweh lui a dit : “Maudis David”, qui donc peut dire : “Pourquoi as-tu fait ainsi ?” »[a]'
