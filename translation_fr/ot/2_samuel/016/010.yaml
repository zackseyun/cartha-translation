base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: fr
  text: 'Mais le roi dit : « Qu’ai-je à faire avec vous, fils de Tserouya ? S’il maudit parce que Yahweh lui a dit : “Maudis David”, qui donc peut dire : “Pourquoi as-tu fait ainsi ?” »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car il maudit, puisque Yahweh lui a dit : “Maudis David.” » Les particules hébraïques peuvent aussi être comprises dans un sens explicatif plutôt que conditionnel.'
    reason: Lecture alternative des particules hébraïques syntaxiquement ambiguës.
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Qu’ai-je à faire avec vous ?
  rationale: Cette expression idiomatique marque ici la prise de distance et le reproche. Cette formulation en restitue la force dans un français naturel.
- source_word: בְּנֵי צְרֻיָה
  choice: fils de Tserouya
  rationale: Le groupe construit désigne Joab et Abishaï par le nom de leur mère. « Tserouya » suit une translittération française courante.
- source_word: יְקַלֵּל / קַלֵּל
  choice: maudit / Maudis
  rationale: Le même verbe français maintient le lien lexical entre l’action présente et l’ordre cité, tout en convenant aux injures chargées de malédiction dans ce contexte.
- source_word: כִּי ... וְכִי
  choice: S’il… parce que
  rationale: Les particules sont difficiles à interpréter. Le texte principal exprime une hypothèse suivie de sa cause, tandis que la note conserve la lecture explicative possible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אָמַר לוֹ
  choice: lui a dit
  rationale: Le passé composé relie naturellement en français la parole divine antérieure à la malédiction en cours.
- source_word: וּמִי יֹאמַר
  choice: qui donc peut lui demander
  rationale: La question est rhétorique et porte sur le droit ou la capacité de contester l’acte. « donc » met en évidence la conséquence du raisonnement.
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: Pourquoi as-tu fait cela ?
  rationale: Cette formulation concise et actuelle rend directement la contestation citée.
theological_decisions:
- issue: Intervention divine dans la malédiction prononcée par Shimeï
  choice: David envisage que Yahweh ait effectivement ordonné à Shimeï de maudire David.
  alternative: Présenter l’action comme une simple permission divine, ou comme un ordre divin catégorique sans cadre hypothétique.
  rationale: L’hébreu attribue à Yahweh la parole « Maudis David », tout en l’insérant dans une formulation dont la valeur conditionnelle ou explicative demeure discutée. La traduction et la note préservent cette tension sans préciser si l’ordre implique une approbation morale.
translation_notes:
  register: Français international moderne, digne et direct. Le dialogue garde sa vigueur rhétorique sans archaïsmes. Le marqueur de note est placé à la fin de la parole afin de signaler que l’alternative concerne l’enchaînement de toute la proposition.
