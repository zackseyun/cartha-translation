source:
  edition: WLC
  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: fr
  text: Peut-être que Yahweh verra mon affliction[a] et que Yahweh me rendra du bien à la place de la malédiction qu’il prononce contre moi aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la forme écrite : « mon iniquité ».'
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: Peut-être que
  rationale: Exprime l’incertitude mêlée d’espérance de David sans transformer son souhait en assurance.
- source_word: יִרְאֶה
  choice: verra
  rationale: Conserve l’image concrète du verbe ראה; avec la préposition ב, le contexte implique que Yahweh remarquera et considérera la détresse de David.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: ב/עונ/י
  choice: mon affliction
  rationale: Suit la lecture traditionnelle (qeré), qui cadre avec l’humiliation présente de David, tout en signalant en note la forme écrite (ketiv).
- source_word: וְהֵשִׁיב ... לִי טוֹבָה
  choice: me rendra du bien
  rationale: Le hiphil de שוב associé à טוֹבָה exprime ici un retour favorable ou une compensation; cette formulation est naturelle en français et garde l’idée de rétribution bénéfique.
- source_word: תַּחַת
  choice: en échange de
  rationale: Rend la relation de substitution ou de compensation entre le bien espéré et la malédiction subie.
- source_word: קִלְלָתוֹ
  choice: la malédiction qu’il prononce contre moi
  rationale: Explicite naturellement en français la valeur active du nom et le référent du suffixe, dans le contexte des paroles hostiles de Shiméï.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Rend avec naturel l’expression temporelle emphatique en français moderne.
theological_decisions:
- issue: Lecture de ב/עונ/י selon le ketiv-qeré
  choice: mon affliction
  alternative: ma faute
  rationale: Le qeré et le contexte immédiat favorisent la détresse ou l’affliction de David, tandis que la forme consonantique écrite peut se lire « ma faute ». La variante est conservée en note afin de ne pas effacer la tension textuelle.
- issue: Nature du bien espéré de Yahweh
  choice: me rendra du bien
  alternative: me récompensera par du bien
  rationale: La formulation retenue exprime une compensation favorable sans suggérer trop fortement un mérite moral ou une doctrine précise de la récompense.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Yahweh » est conservée comme dans l’hébreu. « Malédiction qu’il prononce » évite le tour moins naturel « son action de maudire » tout en gardant la valeur active du terme.
