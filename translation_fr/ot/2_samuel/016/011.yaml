  text: וַ/יֹּ֨אמֶר דָּוִ֤ד אֶל אֲבִישַׁי֙ וְ/אֶל כָּל עֲבָדָ֔י/ו הִנֵּ֥ה בְנִ֛/י אֲשֶׁר יָצָ֥א מִ/מֵּעַ֖/י מְבַקֵּ֣שׁ אֶת נַפְשִׁ֑/י וְ/אַ֨ף כִּֽי עַתָּ֜ה בֶּן הַ/יְמִינִ֗י הַנִּ֤חוּ ל/וֹ֙ וִֽ/יקַלֵּ֔ל כִּ֥י אָֽמַר ל֖/וֹ יְהוָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: fr
  text: 'David dit alors à Abishaï et à tous ses serviteurs : « Voyez ! Mon fils, sorti de mes entrailles, cherche à m’ôter la vie. À plus forte raison, maintenant, ce Benjaminite ! Laissez-le tranquille et qu’il maudisse, car Yahweh le lui a dit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « car Yahweh lui a dit ». L’hébreu ne précise pas ici ce que Yahweh lui a dit, mais le contexte renvoie à l’acte de maudire.'
    reason: La note préserve l’ellipse du texte source et distingue celle-ci de l’explicitation naturelle apportée par le pronom « le » dans le texte principal.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voyez !
  rationale: L’interjection attire fortement l’attention sur la comparaison que David va établir. « Voyez ! » est naturel en français moderne et conserve cette valeur déictique.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: Mon propre fils, issu de moi
  rationale: Cette formulation conserve l’idée vive de descendance corporelle sans attribuer littéralement un « ventre maternel » à David ni produire une expression française maladroite.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: cherche à m’ôter la vie
  rationale: L’expression hébraïque signifie ici chercher à prendre la vie de quelqu’un. Cette tournure française rend clairement le sens tout en gardant le vocabulaire de la vie.
- source_word: וְאַף כִּי עַתָּה
  choice: À plus forte raison, maintenant
  rationale: 'La locution marque un raisonnement comparatif : si le propre fils de David cherche sa vie, l’hostilité d’un Benjaminite est d’autant moins surprenante.'
- source_word: בֶּן הַיְמִינִי
  choice: ce Benjaminite
  rationale: L’expression désigne un membre de la tribu de Benjamin. « Benjaminite » est la désignation française concise et habituelle.
- source_word: הַנִּחוּ לוֹ
  choice: Laissez-le tranquille
  rationale: L’impératif pluriel s’adresse aux hommes de David et leur ordonne de ne pas intervenir. La formulation est actuelle et idiomatique.
- source_word: וִיקַלֵּל
  choice: et qu’il maudisse
  rationale: 'Cette forme poursuit l’impératif avec une valeur permissive : David autorise Shiméï à continuer son action sans que ses hommes l’en empêchent.'
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: car Yahweh le lui a dit
  rationale: La formulation garde l’attribution directe à Yahweh et laisse implicite, comme l’hébreu, le contenu de ce qui a été dit. Le pronom « le » rattache naturellement cette parole à l’acte de maudire, tandis que la note signale la forme plus littérale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: La parole de David présente-t-elle la malédiction de Shiméï comme un ordre direct de Yahweh ou comme une simple permission providentielle ?
  choice: « car Yahweh le lui a dit »
  alternative: « car Yahweh le lui a permis »
  rationale: L’hébreu emploie le verbe « dire » et attribue directement l’action à Yahweh dans les paroles de David. La traduction ne réduit donc pas cette affirmation à une simple permission et préserve la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve la vigueur rhétorique de David, notamment par « Voyez ! » et « À plus forte raison », sans archaïsmes inutiles. Le marqueur [a] est placé à l’endroit exact qu’éclaire la note.
