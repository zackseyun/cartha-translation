  text: וְ/דָוִ֗ד עָבַ֤ר מְעַט֙ מֵֽ/הָ/רֹ֔אשׁ וְ/הִנֵּ֥ה צִיבָ֛א נַ֥עַר מְפִי בֹ֖שֶׁת לִ/קְרָאת֑/וֹ וְ/צֶ֨מֶד חֲמֹרִ֜ים חֲבֻשִׁ֗ים וַ/עֲלֵי/הֶם֩ מָאתַ֨יִם לֶ֜חֶם וּ/מֵאָ֧ה צִמּוּקִ֛ים וּ/מֵ֥אָה קַ֖יִץ וְ/נֵ֥בֶל יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: fr
  text: Quand David eut dépassé de peu le sommet[a], voici que Tsiba, le serviteur[b] de Mefibosheth, venait à sa rencontre avec une paire d’ânes sellés. Sur eux se trouvaient deux cents pains, cent grappes de raisins secs, cent fruits d’été[c] et une outre de vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « un peu depuis la tête »; « tête » désigne ici le sommet de la colline ou de la montagne.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « serviteur » peut aussi signifier « jeune homme » ou « assistant ».
    reason: lexical_alternative
  - marker: c
    text: Il s’agit peut-être plus précisément de figues, mais le terme hébreu a le sens plus large de « fruits d’été ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: avait dépassé de peu le sommet
  rationale: Dans ce contexte topographique, רֹאשׁ (« tête ») désigne le sommet. Cette formulation française exprime naturellement que David venait de passer au-delà.
- source_word: וְהִנֵּה
  choice: quand il vit
  rationale: Le marqueur attire l’attention sur l’apparition soudaine de Tsiba. En narration française actuelle, « quand il vit » en restitue la vivacité sans archaïsme.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: le serviteur de Mefibosheth
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. La relation connue entre Tsiba et Mefibosheth favorise ici « serviteur », tout en signalant l’ambiguïté en note.
- source_word: צֶמֶד חֲמֹרִים
  choice: deux ânes
  rationale: צֶמֶד désigne une paire. « Deux ânes » est précis et plus naturel en français que « une paire d’ânes ».
- source_word: חֲבֻשִׁים
  choice: sellés
  rationale: Le participe décrit ici des ânes préparés et équipés pour le déplacement ou le transport; « sellés » convient au contexte.
- source_word: מָאתַיִם לֶחֶם
  choice: deux cents pains
  rationale: Le nom collectif לֶחֶם est compté ici en unités; « pains » rend clairement cette construction.
- source_word: צִמּוּקִים
  choice: paquets de raisins secs
  rationale: Le terme désigne vraisemblablement des raisins secs agglomérés ou pressés. « Paquets » conserve l’idée d’unités comptables sans imposer la forme précise de gâteaux.
- source_word: קַיִץ
  choice: fruits d’été
  rationale: Le mot désigne largement les fruits de la saison estivale, même si des figues peuvent être visées dans ce contexte. La traduction ne restreint pas indûment le sens.
- source_word: נֵבֶל יָיִן
  choice: une outre de vin
  rationale: נֵבֶל désigne ici un récipient souple destiné au vin; « outre » est le terme français exact et usuel dans ce contexte ancien.
