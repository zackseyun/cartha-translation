  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: fr
  text: 'Alors le roi dit à Tsiba : « Voici, tout ce qui appartient à Mephibosheth est à toi. » Tsiba répondit : « Je me prosterne devant toi. Puissé-je trouver grâce à tes yeux, mon seigneur le roi ! »'
