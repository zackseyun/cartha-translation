  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל חוּשַׁ֔י זֶ֥ה חַסְדְּ/ךָ֖ אֶת רֵעֶ֑/ךָ לָ֥/מָּה לֹֽא הָלַ֖כְתָּ אֶת רֵעֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: fr
  text: 'Absalom dit à Houshaï : « Est-ce là ta fidélité envers ton ami[a] ? Pourquoi n’es-tu pas allé avec ton ami ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta bonté » ou « ton attachement fidèle » pour « ta fidélité » (hébreu חֶסֶד).
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: ta fidélité
  rationale: חֶסֶד peut exprimer la bonté, l’attachement fidèle ou la loyauté. Ici, Absalom reproche à Houshaï de ne pas avoir suivi David ; « fidélité » rend naturellement cette dimension relationnelle et politique sans introduire explicitement un sens théologique d’alliance.
- source_word: רֵעֶךָ
  choice: ton ami / lui
  rationale: רֵעַ désigne couramment un ami, un compagnon ou un proche. La première occurrence est rendue par « ton ami » ; à la seconde, le pronom « lui » évite une répétition lourde en français tout en gardant clairement David comme référent.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: Pourquoi n’es-tu pas parti avec lui ?
  rationale: הלך avec אֶת exprime ici le fait d’aller avec quelqu’un. « Partir avec » convient au contexte de la fuite de David et reste simple et idiomatique.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: Est-ce donc là ta fidélité envers ton ami ?
  rationale: La proposition nominale hébraïque a la force d’une question rhétorique indignée. « Est-ce donc là… ? » restitue cette force, tandis que « envers » exprime la conduite à l’égard de l’ami.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe narratif standard signifie « dire ». Le caractère interrogatif est porté par les paroles citées.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La tournure « Est-ce donc là… ? » conserve le ton accusateur de la question rhétorique. Le pronom « lui » dans la seconde question allège la répétition sans créer d’ambiguïté dans ce bref contexte.
