  naturalness: Le français est moderne, clair et d’un registre approprié. « Et te voilà » est vivant sans être familier. L’explicitation de Saül dans la proposition relative améliore nettement la clarté référentielle.
  terminology: « Yahweh », « maison de Saül », « royaume », « malheur » et « homme de sang » sont cohérents avec le texte source et avec un français international moderne. Les notes conservent utilement les possibilités de « sang(s) » et de רָעָה sans présenter l’accusation de Shimeï comme un jugement narratorial.
