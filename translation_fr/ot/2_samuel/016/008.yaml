base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: fr
  text: Yahweh a fait retomber sur toi tout le sang de la maison de Saül[a], à la place duquel tu as régné. Yahweh a livré le royaume entre les mains d’Absalom, ton fils. Et te voilà dans ton malheur[b], car tu es un homme de sang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les sangs de la maison de Saül ». L’expression peut aussi se traduire par « tout le sang versé dans la maison de Saül » ou « toute la culpabilité de la maison de Saül liée au sang versé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans ton mal ». Le terme hébreu peut désigner le mal moral aussi bien qu’un malheur ou un désastre subi ; ici, il évoque probablement le malheur qui frappe David.'
    reason: lexical_alternative
  - marker: c
    text: '« Un homme de sang » désigne un homme marqué par le sang versé, la violence ou la culpabilité qui en découle. On pourrait aussi traduire : « un homme sanguinaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: a fait retomber sur toi
  rationale: Le hiphil de שוב exprime ici le fait de faire revenir quelque chose sur David. « A fait retomber sur toi » conserve l’image hébraïque et sa portée de rétribution sans la réduire à une simple idée de paiement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כֹּל דְּמֵי בֵית שָׁאוּל
  choice: tout le sang de la maison de Saül
  rationale: Littéralement « tous les sangs » ; l’expression peut évoquer le sang versé ou la culpabilité liée à ce sang. La formulation française conserve cette densité, avec une note explicative.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: à la place de qui tu as régné
  rationale: 'תחתיו marque ici la succession : David a régné à la place de Saül.'
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: a livré le royaume entre les mains de
  rationale: Cette tournure française rend naturellement l’idiome de remise au pouvoir ou au contrôle de quelqu’un, tout en conservant l’image des mains.
- source_word: וְהִנְּךָ
  choice: Et te voilà
  rationale: Rend de façon actuelle et vive la particule qui attire l’attention sur la situation présente de David.
- source_word: בְּרָעָתֶךָ
  choice: dans ton malheur
  rationale: רעה peut désigner soit le mal moral, soit le malheur subi. Le contexte immédiat favorise le désastre qui frappe David, sans effacer l’autre possibilité.
- source_word: אִישׁ דָּמִים
  choice: un homme de sang
  rationale: Cette expression concise conserve l’idiome hébreu et peut désigner un homme marqué par la violence ou coupable d’avoir versé le sang.
theological_decisions:
- issue: Valeur de בְּרָעָתֶךָ
  choice: dans ton malheur
  alternative: dans ton mal
  rationale: Shimeï présente la détresse actuelle de David comme une rétribution divine. La traduction rend son accusation sans transformer celle-ci en jugement explicite du narrateur ; la note maintient l’ambiguïté lexicale.
- issue: Portée de l’accusation אִישׁ דָּמִים
  choice: un homme de sang
  alternative: un homme sanguinaire / un homme coupable de meurtre
  rationale: La formulation retenue évite de préciser au-delà du texte si l’accusation porte surtout sur la violence, le sang versé ou la culpabilité qui en découle.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin ; la translittération le distingue d’un simple titre.
translation_notes:
  register: Français international moderne, digne et accessible. « Et te voilà » évite l’archaïsme de « voici » ou « regarde » dans ce contexte. La structure est divisée en trois phrases pour une lecture naturelle, sans perdre l’enchaînement accusatoire de l’hébreu.
