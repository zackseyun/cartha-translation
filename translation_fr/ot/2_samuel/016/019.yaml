  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: fr
  text: Et deuxièmement, qui devrais-je servir ? N’est-ce pas devant son fils[a] ? Comme j’ai servi devant ton père, ainsi je serai devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque répétée « devant son fils… devant ton père… devant toi » appartient au langage de la cour et désigne le fait de servir auprès d’un roi ou sous son autorité.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: Et, deuxièmement
  rationale: Cette expression introduit le deuxième argument de Houshaï ; « deuxièmement » en restitue naturellement la fonction discursive.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: qui devrais-je servir ?
  rationale: Dans ce contexte de cour royale, עבד désigne le service et l’allégeance ; le conditionnel rend naturellement la force de la question rhétorique.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: Ne serait-ce pas en présence de son fils ?
  rationale: הֲלוֹא appelle une réponse affirmative, tandis que « en présence de » conserve l’image répétée de לִפְנֵי sans réduire silencieusement l’expression à « son fils ».
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: Comme j’ai servi en présence de ton père
  rationale: La formulation garde à la fois le verbe « servir » et l’expression de cour לִפְנֵי, qui évoque le service auprès du roi.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: ainsi je serai en ta présence
  rationale: L’hébreu emploie היה, « être », au lieu de répéter עבד ; la traduction préserve ce changement ainsi que le parallélisme des trois occurrences de לִפְנֵי.
