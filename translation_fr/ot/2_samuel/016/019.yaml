translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement correspond à l’adresse directe d’Houshaï à Absalom. La répétition de « en présence de » conserve l’idiome de cour et le parallélisme de l’hébreu, explicités par la note.
