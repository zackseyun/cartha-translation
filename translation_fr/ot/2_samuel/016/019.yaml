revisions:
- from: Et, deuxièmement, qui devrais-je servir ? Ne serait-ce pas en présence de son fils[a] ? Comme j’ai servi en présence de ton père, ainsi je serai en ta présence.
  to: Et deuxièmement, qui devrais-je servir ? N’est-ce pas devant son fils[a] ? Comme j’ai servi devant ton père, ainsi je serai devant toi.
