    issue: « en présence de » ne rend pas adéquatement l’idiome de cour לִפְנֵי.
    rationale: Cette expression française signifie d’abord « en présence physique de » et peut atténuer l’idée d’être en service ou en audience devant le roi. « Devant » conserve mieux la formulation hébraïque répétée et son cadre de cour, que la note peut éclairer.
  - severity: low
    issue: La tournure « Ne serait-ce pas » affaiblit légèrement la force de הֲלוֹא.
    rationale: La particule introduit une question qui attend une réponse affirmative. « N’est-ce pas » est plus direct et naturel ici.
  - severity: low
    issue: La ponctuation de « Et, deuxièmement » est maladroite.
    rationale: La virgule après « Et » ne se justifie pas en français. La suppression de la virgule fluidifie la transition.
