  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר בָּ֞א חוּשַׁ֧י הָ/אַרְכִּ֛י רֵעֶ֥ה דָוִ֖ד אֶל אַבְשָׁל֑וֹם וַ/יֹּ֤אמֶר חוּשַׁי֙ אֶל אַבְשָׁלֹ֔ם יְחִ֥י הַ/מֶּ֖לֶךְ יְחִ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: fr
  text: 'Lorsque Houshaï l’Arkien, l’ami de David, arriva auprès d’Absalom, il lui dit : « Vive le roi ! Vive le roi ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Que le roi vive ! » L’hébreu est une acclamation royale.'
    reason: Alternative lexicale explicitant plus littéralement la valeur jussive de l’expression hébraïque.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: Cette tournure introduit naturellement en français moderne l’événement suivant, sans reproduire lourdement la formule narrative hébraïque.
- source_word: בָּא
  choice: arriva auprès de
  rationale: Le verbe exprime ici l’arrivée de Houshaï auprès d’Absalom; cette formulation rend clairement le mouvement et la rencontre.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Houshaï l’Arkite
  rationale: Le nom propre et le gentilé sont translittérés selon des formes françaises bibliques claires et usuelles.
- source_word: רֵעֶה דָוִד
  choice: l’ami de David
  rationale: Cette expression naturelle conserve le lien personnel et politique indiqué par le groupe construit hébreu.
- source_word: וַיֹּאמֶר חוּשַׁי אֶל אַבְשָׁלֹם
  choice: il lui dit
  rationale: Les référents viennent d’être explicitement nommés; les pronoms évitent une répétition pesante sans créer d’ambiguïté en français.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Vive le roi !
  rationale: Cette formule française idiomatique rend la valeur jussive et la force d’une acclamation royale.
- source_word: יְחִי הַמֶּלֶךְ (répété)
  choice: Vive le roi ! Vive le roi !
  rationale: La répétition hébraïque est conservée pour restituer l’insistance publique de l’acclamation et l’ambiguïté narrative de la loyauté de Houshaï.
theological_decisions:
- issue: Ambiguïté de l’acclamation adressée par Houshaï à Absalom
  choice: Conserver telle quelle l’acclamation royale, sans signaler explicitement l’ironie ni la ruse
  alternative: Ajouter une formulation indiquant que Houshaï parle avec ironie ou dans l’intention de tromper Absalom
  rationale: Le verset présente les paroles comme une acclamation royale ordinaire. Le contexte plus large laisse percevoir la stratégie de Houshaï, mais la traduction doit préserver cette tension sans imposer une interprétation dans ses paroles.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise, conserve la répétition rhétorique de l’hébreu et place la note après l’ensemble de l’acclamation à laquelle elle se rapporte.
