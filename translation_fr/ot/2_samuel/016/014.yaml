  text: וַ/יָּבֹ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ עֲיֵפִ֑ים וַ/יִּנָּפֵ֖שׁ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: fr
  text: Le roi et tout le peuple qui l’accompagnait arrivèrent fatigués, et il reprit des forces là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et ils reprirent des forces là ». Le verbe hébreu est au singulier (« il reprit des forces »), mais il peut être compris comme se rapportant collectivement au roi et à tout le peuple.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arrivèrent
  rationale: Le verbe בוא exprime ici l’arrivée au terme du déplacement. Le singulier hébreu précède un sujet composé et se rend naturellement au pluriel en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du titre défini; le texte ne remplace pas le titre par le nom de David.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: et tout le peuple qui l’accompagnait
  rationale: Cette formulation restitue explicitement la proposition relative tout en restant naturelle en français moderne.
- source_word: עֲיֵפִים
  choice: épuisés
  rationale: L’adjectif pluriel désigne la grande fatigue physique du roi et de ceux qui sont avec lui.
- source_word: וַיִּנָּפֵשׁ
  choice: il reprit des forces
  rationale: Le verbe est morphologiquement au singulier et évoque le fait de reprendre souffle ou de se remettre. Le pronom « il » préserve cette forme sans décider silencieusement que le verbe est collectif.
- source_word: שָׁם
  choice: là
  rationale: Rendu simple et idiomatique de l’adverbe de lieu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Reprit des forces » conserve l’idée de récupération exprimée par וַיִּנָּפֵשׁ. Le singulier du verbe final est maintenu dans le texte, tandis que la lecture collective est signalée en note.
