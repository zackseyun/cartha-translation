  text: וְ/אַבְשָׁל֗וֹם וְ/כָל הָ/עָם֙ אִ֣ישׁ יִשְׂרָאֵ֔ל בָּ֖אוּ יְרוּשָׁלִָ֑ם וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: fr
  text: Absalom et tout le peuple, les hommes d’Israël[a], arrivèrent à Jérusalem. Ahitophel était avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tout le peuple, chaque homme d’Israël » ou « tout le peuple, les hommes d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֗וֹם
  choice: Absalom
  rationale: Le nom propre suit sa forme française traditionnelle. Le waw coordonne la scène au contexte précédent, mais il n’est pas nécessaire de le rendre par un « et » initial en français courant.
- source_word: וְ/כָל הָ/עָם֙ אִ֣ישׁ יִשְׂרָאֵ֔ל
  choice: et tout le peuple, les hommes d’Israël
  rationale: « Tout le peuple » rend naturellement כָל־הָעָם. L’apposition « les hommes d’Israël » conserve la formulation collective masculine אִישׁ יִשְׂרָאֵל ainsi que sa légère ambiguïté syntaxique.
- source_word: בָּ֖אוּ
  choice: arrivèrent
  rationale: Avec Jérusalem comme destination, « arrivèrent à » exprime naturellement le verbe בוא dans ce récit; « vinrent à » resterait possible, mais serait moins idiomatique sans point de vue explicite.
- source_word: יְרוּשָׁלִָ֑ם
  choice: à Jérusalem
  rationale: La préposition française « à » convient naturellement après « arriver ».
- source_word: וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ
  choice: Ahitofel était avec lui
  rationale: Le français supplée le verbe « était » dans cette proposition nominale. En contexte, « lui » renvoie naturellement à Absalom, sans que le texte hébreu répète son nom.
