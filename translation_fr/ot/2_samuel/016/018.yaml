source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: fr
  text: 'Houshaï dit à Absalom : « Non ! C’est à celui que Yahweh, ce peuple et tous les hommes d’Israël ont choisi que j’appartiendrai[a], et c’est auprès de lui que je resterai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte consonantique porte « non », tandis que la tradition de lecture donne « à lui » : littéralement, « je serai à lui ».'
    reason: textual_variant
lexical_decisions:
- source_word: לֹא כִּי
  choice: Non ! C’est à…
  rationale: La tournure exprime un refus énergique suivi d’une correction ou d’une explication. Cette formulation française garde la vigueur de la réplique sans alourdir la phrase.
- source_word: אֲשֶׁר בָּחַר
  choice: celui que … ont choisi
  rationale: Le parfait בָּחַר présente le choix comme accompli, tandis que le relatif laisse volontairement ouverte l’identité de la personne visée, élément important de la réponse équivoque de Houshaï.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: וְהָעָם הַזֶּה
  choice: ce peuple
  rationale: Cette expression conserve le collectif singulier et le démonstratif du texte hébreu.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: et tous les hommes d’Israël
  rationale: Cette formulation naturelle en français conserve la référence masculine explicite et la portée collective de l’expression hébraïque.
- source_word: לוֹ אֶהְיֶה / לא אֶהְיֶה
  choice: j’appartiendrai
  rationale: La tradition de lecture donne « je serai à lui ». En français, « j’appartiendrai » exprime naturellement cette déclaration d’allégeance tout en laissant l’antécédent ambigu.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: et c’est auprès de lui que je resterai
  rationale: Dans ce contexte, יָשַׁב désigne le fait de demeurer auprès de quelqu’un et de continuer à le servir, non la simple action de s’asseoir.
theological_decisions:
- issue: Identité de celui que Yahweh et Israël ont choisi
  choice: Conserver l’antécédent indéterminé de « celui » et de « lui »
  alternative: Identifier explicitement Absalom ou David
  rationale: 'La déclaration de Houshaï repose sur une ambiguïté intentionnelle : Absalom peut se croire désigné, alors que les paroles peuvent aussi viser David. La traduction ne doit pas trancher ce que le texte laisse ouvert.'
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom propre divin; sa translittération préserve cette distinction.
translation_notes:
  register: Français international moderne, naturel et digne. La construction clivée « C’est à celui que… » rend l’allégeance clairement sans identifier la personne visée. « Auprès de lui » convient mieux au contexte de fidélité politique que le littéral « avec lui je m’assiérai ».
