base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: fr
  text: Il lança des pierres sur David et sur tous les serviteurs du roi David[a], tandis que tout le peuple et tous les vaillants guerriers se tenaient à sa droite et à sa gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il lapida David et tous les serviteurs du roi David. » Le verbe hébreu peut être traduit plus littéralement ainsi, mais « lapider » peut évoquer une mise à mort organisée plutôt que des jets de pierres hostiles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: Il lança des pierres sur
  rationale: Le piel de סקל, accompagné de בָּאֲבָנִים, décrit ici le fait de jeter des pierres contre quelqu’un. Cette formulation concrète évite que « lapider » soit compris exclusivement comme une exécution officielle.
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: עבד désigne ici ceux qui sont au service du roi. « Serviteurs » conserve l’étendue du terme sans imposer le sens plus étroit d’esclaves ou de fonctionnaires.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: du roi David
  rationale: Cette formulation française naturelle conserve le titre royal et le nom personnel.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: עם a son sens large de peuple ou groupe accompagnant David; le contexte ne permet pas de le limiter aux seules troupes.
- source_word: הַגִּבֹּרִים
  choice: les vaillants guerriers
  rationale: גִּבּוֹרִים désigne des hommes reconnus pour leur force ou leur bravoure, souvent dans un cadre militaire. « Vaillants guerriers » exprime clairement cette nuance en français actuel.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: à sa droite et à sa gauche
  rationale: Le suffixe renvoie le plus naturellement à David; la formule décrit les gens et les guerriers disposés de part et d’autre de lui.
theological_decisions: []
