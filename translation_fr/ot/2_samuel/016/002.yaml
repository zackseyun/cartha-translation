  - severity: medium
    issue: « Celui qui sera épuisé » intensifie et temporalise indûment הַיָּעֵף.
    rationale: L’adjectif substantivé signifie « celui qui est fatigué / le fatigué », avec une valeur générique. « Fatigué » préserve mieux son degré lexical.
  - severity: low
    issue: Le marqueur de note sur les fruits d’été est éloigné de l’expression qu’il explique.
    rationale: La note b porte sur הַקַּיִץ (« fruits d’été »), tandis que la note a porte sur « jeunes gens »; les ancres doivent suivre les expressions concernées.
