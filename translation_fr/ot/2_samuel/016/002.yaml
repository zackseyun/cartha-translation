base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: fr
  text: 'Le roi demanda à Tsiba : « À quoi tout cela doit-il servir ? » Tsiba répondit : « Les ânes sont destinés à servir de montures à la maison du roi ; le pain et les fruits d’été[b], pour que les jeunes gens[a] mangent ; et le vin, pour que celui qui est fatigué dans le désert boive. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des serviteurs » ou « des assistants ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les produits de l’été ». Le terme hébreu peut désigner plus largement les fruits ou produits récoltés pendant l’été.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: À quoi tout cela doit-il servir ?
  rationale: L’expression signifie littéralement « Que sont ceux-ci pour toi ? ». Dans le contexte, le roi demande à quelle fin Tsiba a apporté ces provisions ; la formulation française exprime naturellement cette demande sans en préciser indûment le motif.
- source_word: הַחֲמוֹרִים לְבֵית הַמֶּלֶךְ לִרְכֹּב
  choice: Les ânes serviront de montures à la maison du roi
  rationale: « Maison du roi » conserve l’expression hébraïque désignant ici les membres de la maisonnée ou de la suite royale. « Serviront de montures » rend clairement l’infinitif de but לִרְכֹּב.
- source_word: הַלֶּחֶם
  choice: le pain
  rationale: Le sens lexical direct est retenu, puisque les fruits sont mentionnés séparément.
- source_word: הַקַּיִץ
  choice: les fruits d’été
  rationale: Le terme désigne des fruits ou produits récoltés en été sans en préciser l’espèce ; « fruits d’été » préserve cette généralité.
- source_word: הַנְּעָרִים
  choice: les jeunes gens
  rationale: Le mot peut désigner de jeunes hommes, des serviteurs ou des assistants. La traduction formelle « jeunes gens » préserve cette latitude, avec l’autre lecture signalée en note.
- source_word: הַיָּעֵף
  choice: celui qui sera épuisé
  rationale: L’adjectif substantivé singulier désigne de façon générique la personne épuisée. Cette formulation conserve le singulier et rend naturellement l’idée dans la situation envisagée.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région sauvage et peu habitée. « Désert » est naturel dans ce récit, sans exiger l’idée d’une étendue exclusivement sablonneuse.
