  verdict: revise
  source_fidelity: Le sens général est fidèle, mais les futurs (« serviront », « seront ») ne rendent pas au mieux la présentation immédiate des usages par Tsiba. « Épuisé » est plus fort que l’hébreu הַיָּעֵף (« fatigué », « las »), et la note sur les fruits doit être ancrée à « fruits d’été ».
  naturalness: Le français est globalement clair et digne. Le présent (« sont destinés ») est plus naturel dans cette réponse explicative, et « pour que ... mangent / boive » exprime clairement les infinitifs de but hébreux.
  terminology: « Tsiba », « ânes », « maison du roi », « pain », « fruits d’été », « jeunes gens » et « désert » conviennent. « Maison du roi » conserve utilement l’ambiguïté entre maisonnée et suite royale; aucune interprétation confessionnelle n’est introduite.
