    issue: Temps verbal de la comparaison
    rationale: « comme si l’on avait consulté Dieu » transforme une comparaison habituelle ou générique en hypothèse d’une consultation déjà accomplie. « comme si l’on consultait Dieu » conserve mieux la portée de l’imparfait hébreu générique.
  - severity: medium
    issue: Formulation de la note lexicale
    rationale: « comme lorsqu’on consulte une parole de Dieu » n’est pas une expression française naturelle et peut laisser entendre que l’on consulte un énoncé plutôt que Dieu. La note doit présenter la littéralité avec une brève explication de l’idiome.
