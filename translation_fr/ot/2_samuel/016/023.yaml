  text: וַ/עֲצַ֣ת אֲחִיתֹ֗פֶל אֲשֶׁ֤ר יָעַץ֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם כַּ/אֲשֶׁ֥ר יִשְׁאַל בִּ/דְבַ֣ר הָ/אֱלֹהִ֑ים כֵּ֚ן כָּל עֲצַ֣ת אֲחִיתֹ֔פֶל גַּם לְ/דָוִ֖ד גַּ֥ם לְ/אַבְשָׁלֹֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: fr
  text: En ce temps-là, les conseils qu’Ahitofel donnait étaient reçus comme si l’on consultait Dieu[a]. Il en allait ainsi de tous les conseils d’Ahitofel, aussi bien pour David que pour Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « comme lorsqu’on interroge par la parole de Dieu ». L’expression désigne la recherche d’une réponse ou d’une direction divine. La comparaison souligne la très haute estime dans laquelle étaient tenus les conseils d’Ahitofel.'
    reason: Alternative lexicale et clarification de l’expression hébraïque idiomatique בִּדְבַר הָאֱלֹהִים.
lexical_decisions:
- source_word: עֲצַת אֲחִיתֹפֶל אֲשֶׁר יָעַץ
  choice: les conseils qu’Ahitofel donnait
  rationale: Cette formulation française naturelle conserve le lien entre le nom « conseils » et le verbe « donnait », tout en rendant la valeur habituelle suggérée par le contexte.
- source_word: בַּיָּמִים הָהֵם
  choice: En ce temps-là
  rationale: Expression temporelle courante et digne, équivalente à « en ces jours-là » mais plus naturelle en français moderne.
- source_word: כַּאֲשֶׁר יִשְׁאַל בִּדְבַר הָאֱלֹהִים
  choice: comme si l’on avait consulté Dieu
  rationale: Rend l’idée idiomatique de rechercher une réponse ou une direction auprès de Dieu. La note signale la possibilité de représenter plus explicitement דָּבָר, « parole/chose ».
- source_word: כֵּן כָּל עֲצַת אֲחִיתֹפֶל
  choice: Il en allait ainsi de tous les conseils d’Ahitofel
  rationale: Reproduit la reprise emphatique du texte hébreu dans une syntaxe française claire.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: aussi bien pour David que pour Absalom
  rationale: La construction corrélative rend le double גַּם…גַּם et « pour » exprime naturellement les destinataires ou bénéficiaires des conseils.
theological_decisions:
- issue: Portée de la comparaison avec la consultation de Dieu
  choice: Le texte décrit la manière dont les conseils d’Ahitofel étaient reçus, sans les identifier à une révélation inspirée.
  alternative: Comprendre que ses conseils fonctionnaient pratiquement comme un oracle divin.
  rationale: La comparaison introduite par כַּאֲשֶׁר doit rester une comparaison. « étaient reçus comme si » exprime l’autorité exceptionnelle qui leur était accordée sans affirmer qu’ils venaient réellement de Dieu.
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « les conseils » convient mieux à l’affirmation générale et à la reprise « tous les conseils ». « En ce temps-là » évite un calque inutile de « en ces jours-là ».
