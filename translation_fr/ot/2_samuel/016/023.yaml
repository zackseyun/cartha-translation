- from: En ce temps-là, les conseils qu’Ahitofel donnait étaient reçus comme si l’on avait consulté Dieu[a]. Il en allait ainsi de tous les conseils d’Ahitofel, aussi bien pour David que pour Absalom.
  to: En ce temps-là, les conseils qu’Ahitofel donnait étaient reçus comme si l’on consultait Dieu[a]. Il en allait ainsi de tous les conseils d’Ahitofel, aussi bien pour David que pour Absalom.
  rationale: La révision limite les changements au temps de la comparaison et à la note. Elle conserve l’interprétation contextuelle selon laquelle les conseils étaient reçus avec une autorité comparable à celle d’une consultation de Dieu, tout en évitant de présenter cette consultation comme une action antérieure achevée ou de confondre les conseils avec une révélation.
