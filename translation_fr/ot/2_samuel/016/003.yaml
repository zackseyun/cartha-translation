base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: fr
  text: 'Le roi demanda : « Et où est le fils de ton maître ? » Tsiba répondit au roi : « Eh bien, il est toujours à Jérusalem[a], car il a dit : “Aujourd’hui, la maison d’Israël me rendra le royaume de mon père.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il demeure à Jérusalem ». Le participe hébreu peut exprimer le fait de résider ou de rester sur place, et pas seulement celui d’être assis.
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Le roi demanda
  rationale: Dans ce contexte interrogatif, « demanda » rend naturellement le verbe « dire » sans modifier sa fonction narrative.
- source_word: וְאַיֵּה בֶּן אֲדֹנֶיךָ
  choice: Et où est le fils de ton maître ?
  rationale: Conserve le lien marqué par וְ et rend אֲדֹנֶיךָ par le terme social courant « ton maître ».
- source_word: צִיבָא
  choice: Tsiba
  rationale: Transcription française usuelle du nom hébreu.
- source_word: הִנֵּה יוֹשֵׁב בִּירוּשָׁלַםִ
  choice: Il reste à Jérusalem
  rationale: Le participe יוֹשֵׁב désigne ici le fait de demeurer ou de rester sur place, plutôt que l'action littérale d'être assis. Le français naturel n'exige pas de rendre הִנֵּה par une interjection distincte.
- source_word: כִּי אָמַר
  choice: car il a dit
  rationale: כִּי introduit la raison avancée par Tsiba, et le parfait אָמַר rapporte les paroles attribuées au fils de son maître.
- source_word: הַיּוֹם יָשִׁיבוּ לִי
  choice: Aujourd’hui, … me rendra
  rationale: Le hiphil de שׁוב exprime ici la restitution; le sujet collectif « la maison d’Israël » commande naturellement le singulier en français.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Maintient l'expression collective et nationale du texte hébreu.
- source_word: אֵת מַמְלְכוּת אָבִי
  choice: le royaume de mon père
  rationale: « Royaume » est clair et naturel, tout en conservant la relation explicite « de mon père ».
theological_decisions:
- issue: Véracité de l’accusation rapportée par Tsiba
  choice: Rapporter directement les paroles que Tsiba attribue au fils de son maître, sans les cautionner ni les mettre explicitement en doute.
  alternative: Ajouter une prise de distance telle que « il prétend avoir dit » ou « selon Tsiba ».
  rationale: L’hébreu rapporte simplement la déclaration de Tsiba. La traduction laisse au contexte narratif le soin d’en permettre l’évaluation.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste naturel; la formulation conserve l’expression biblique « la maison d’Israël » sans archaïsme inutile.
