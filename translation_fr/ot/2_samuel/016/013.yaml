base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: fr
  text: David et ses hommes poursuivaient leur chemin, tandis que Shiméï avançait sur le versant de la montagne, en face de David. Tout en marchant, il lançait des malédictions, jetait des pierres dans sa direction[a] et projetait de la poussière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en face de lui », comme dans la proposition précédente.'
    reason: La répétition de לְעֻמָּתוֹ est significative en hébreu, mais sa reproduction exacte donnerait en français une tournure maladroite avec le jet de pierres.
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: poursuivaient leur chemin
  rationale: דֶּרֶךְ désigne le chemin ou la route. Avec וַיֵּלֶךְ dans ce récit, cette formulation française exprime naturellement la progression continue de David et de ses hommes.
- source_word: בְּצֵלַע הָהָר
  choice: sur le versant de la montagne
  rationale: צֵלַע désigne le côté ou le flanc, et הָהָר la montagne ou hauteur. « Sur le versant de la montagne » rend concrètement la position de Shiméï par rapport au chemin.
- source_word: לְעֻמָּתוֹ
  choice: en face de David / dans sa direction
  rationale: L’expression indique une position ou une orientation correspondante, en face de quelqu’un. Le nom « David » lève une ambiguïté pronominale en français ; à la seconde occurrence, « dans sa direction » convient naturellement au jet de pierres tout en conservant l’orientation vers lui.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: avançait ... Tout en marchant
  rationale: La répétition des formes de הלך souligne une action en cours. La reprise française du mouvement préserve cet effet duratif sans lourdeur excessive.
- source_word: וַיְקַלֵּל
  choice: il lançait des malédictions
  rationale: Le piel de קלל signifie « maudire ». La formulation retenue exprime ici une action hostile répétée et s’intègre au mouvement continu de la scène.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: jetait des pierres
  rationale: סקל avec אֲבָנִים décrit ici le fait de lancer des pierres. « Lapidait » pourrait suggérer à tort une exécution judiciaire formelle.
- source_word: וְעִפַּר בֶּעָפָר
  choice: projetait de la poussière
  rationale: Le jeu étymologique hébreu associe le verbe et le nom עפר. Il ne peut être reproduit naturellement en français, mais « projetait de la poussière » restitue clairement le geste agressif.
- source_word: וַאֲנָשָׁיו
  choice: ses hommes
  rationale: Dans ce contexte, אֲנָשִׁים désigne les hommes qui accompagnent David ; « ses hommes » est concis et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits rendent les actions simultanées et continues, tandis que la répétition de l’idée de marche conserve l’insistance de l’hébreu. « Shiméï » suit une graphie française usuelle.
