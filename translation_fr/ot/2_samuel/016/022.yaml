  text: וַ/יַּטּ֧וּ לְ/אַבְשָׁל֛וֹם הָ/אֹ֖הֶל עַל הַ/גָּ֑ג וַ/יָּבֹ֤א אַבְשָׁלוֹם֙ אֶל פִּֽלַגְשֵׁ֣י אָבִ֔י/ו לְ/עֵינֵ֖י כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: fr
  text: Et l’on dressa la tente pour Absalom sur le toit, et Absalom alla vers les concubines de son père sous les yeux de tout Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: on dressa
  rationale: Le verbe נטה désigne ici l’action de déployer ou de monter une tente. « Dresser » est l’expression française naturelle dans ce contexte.
- source_word: הָאֹהֶל
  choice: la tente
  rationale: L’article hébreu rend le nom défini. Il s’agit de la tente préparée pour l’acte public conseillé au verset précédent.
- source_word: עַל הַגָּג
  choice: sur le toit
  rationale: Cette traduction directe conserve le lieu élevé et visible de la scène.
- source_word: וַיָּבֹא ... אֶל
  choice: entra auprès de
  rationale: Cette formulation conserve l’euphémisme sexuel hébreu tout en restant intelligible dans un registre biblique français digne.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: les concubines de son père
  rationale: Cette formulation rend directement la relation construite en hébreu et son enjeu familial et royal.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: sous les yeux de tout Israël
  rationale: L’expression rend naturellement l’image littérale des « yeux » et souligne le caractère public et attesté de l’acte.
theological_decisions:
- issue: Rendu de l’euphémisme sexuel dans le contexte de l’usurpation royale
  choice: Conserver l’euphémisme avec « entra auprès des concubines »
  alternative: « eut des relations avec les concubines » ou « coucha avec les concubines »
  rationale: Le texte rapporte un acte d’appropriation sexuelle publique lié à la rébellion d’Absalom. Le maintien de l’euphémisme préserve la gravité et la retenue littéraire de l’hébreu sans rendre le sens purement spatial.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu, mais naturelle. « Sous les yeux de » rend clairement la publicité de l’acte sans explicitation doctrinale.
