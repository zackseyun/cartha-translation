revisions:
- from: On dressa donc la tente pour Absalom sur le toit, et Absalom entra auprès des concubines de son père sous les yeux de tout Israël.
  to: Et l’on dressa la tente pour Absalom sur le toit, et Absalom alla vers les concubines de son père sous les yeux de tout Israël.
  rationale: La révision remplace l’inférence « donc » par la coordination narrative du texte source et emploie une expression française biblique plus naturelle pour l’euphémisme sexuel. Le lieu, les personnes concernées et la publicité de l’acte sont conservés sans explicitation doctrinale.
