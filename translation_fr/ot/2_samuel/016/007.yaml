source:
  edition: WLC
  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: fr
  text: 'Et Shimeï disait, en le maudissant : « Va-t’en, va-t’en, homme de sang[a] et homme indigne[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « homme des sangs ». Cette expression hébraïque peut désigner un homme responsable de sang versé ou coupable de meurtre.
    reason: lexical_alternative
  - marker: b
    text: Ou « vaurien » ou « homme pervers ». Ici, le terme hébreu traduit par « indigne » est une insulte exprimant la bassesse morale ; il ne désigne pas nécessairement le nom propre « Bélial ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כֹה אָמַר
  choice: Et voici ce que … disait
  rationale: Cette tournure française introduit naturellement les paroles qui suivent et rend la valeur de כֹה (« ainsi, voici ce que »). L’imparfait présente les paroles prononcées pendant la malédiction.
- source_word: שִׁמְעִי
  choice: Shimeï
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: בְּ/קַֽלְל/וֹ
  choice: en le maudissant
  rationale: La préposition avec l’infinitif construit exprime ici une action concomitante; le suffixe masculin singulier désigne David dans le contexte.
- source_word: צֵא צֵא
  choice: Va-t’en ! Va-t’en !
  rationale: L’impératif répété exprime avec force le rejet et l’ordre de partir. « Va-t’en » est plus naturel en français moderne que le calque spatial « Sors ».
- source_word: אִישׁ הַ/דָּמִים
  choice: Homme de sang
  rationale: Cette expression conserve l’image et la construction hébraïques sans préciser abusivement si l’accusation porte sur la soif de tuer, les meurtres commis ou la culpabilité liée au sang versé.
- source_word: וְ/אִישׁ הַ/בְּלִיָּעַל
  choice: et homme indigne
  rationale: « Homme indigne » rend l’insulte morale exprimant la bassesse ou l’absence de valeur, tout en conservant la répétition de אִישׁ et le parallélisme des deux accusations.
theological_decisions:
- issue: Sens de בְּלִיַּעַל
  choice: Nom commun qualificatif rendu par « homme indigne »
  alternative: « vaurien », « homme pervers » ou « homme de Bélial »
  rationale: Dans ce contexte de l’Ancien Testament, le mot constitue une insulte désignant un homme moralement vil ou sans valeur. Le rendre par le nom propre « Bélial » importerait une personnification démoniaque plus tardive que le texte n’impose pas.
- issue: Portée de אִישׁ הַדָּמִים
  choice: Conserver l’expression ouverte « homme de sang »
  alternative: « homme sanguinaire » ou « homme coupable d’effusions de sang »
  rationale: L’expression hébraïque peut évoquer le sang versé ou la culpabilité qui en découle. « Sanguinaire » préciserait le tempérament ou l’intention, tandis qu’une paraphrase sur la culpabilité trancherait davantage que l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. La répétition énergique de l’impératif ainsi que celle du mot « homme » préservent la violence verbale et le parallélisme de l’hébreu. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
