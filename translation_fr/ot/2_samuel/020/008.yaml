base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: fr
  text: Alors qu’ils étaient près de la grande pierre qui se trouve à Gabaon, Amasa se présenta devant eux[a]. Joab portait sa tenue militaire[b] et, par-dessus, une ceinture avec une épée attachée à sa taille, dans son fourreau. Au moment où il s’avança, elle[c] tomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vint devant eux » ; on peut aussi comprendre : « vint à leur rencontre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « son vêtement » ou « la tenue qu’il portait ». Le mot hébreu peut désigner une tenue distinctive, notamment militaire.'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu est au féminin ; son sujet est très probablement l’épée.
    reason: referent_clarification
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה
  choice: Lorsqu’ils furent près de la grande pierre
  rationale: Avec une indication de lieu, עִם peut exprimer la proximité. « Près de » est naturel en français et convient au cadre narratif.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: qui se trouve à Gabaon
  rationale: La relative localise la pierre. Le présent convient en français pour désigner un repère géographique.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: Amasa se présenta devant eux
  rationale: Cette formulation garde le sens spatial de לִפְנֵי tout en exprimant naturellement l’arrivée d’Amasa, sans décider s’il venait précisément à leur rencontre.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: Joab portait sa tenue militaire
  rationale: מַד peut désigner une tenue distinctive, notamment militaire. Le contexte armé favorise « tenue militaire », tandis qu’une note conserve l’alternative plus générale.
- source_word: וְעָלָיו חֲגוֹר
  choice: et, par-dessus, une ceinture
  rationale: La formulation rend la superposition de la ceinture et de la tenue sans employer le terme vieilli « ceindre ».
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: à laquelle une épée dans son fourreau était attachée à sa taille
  rationale: La phrase rend explicitement le lien entre la ceinture, l’épée, la taille et le fourreau, tout en restant proche de la syntaxe hébraïque.
- source_word: וְהוּא יָצָא
  choice: Au moment où il s’avança
  rationale: יצא signifie littéralement « sortir », mais peut décrire ici le mouvement de Joab vers l’avant. « S’avança » est plus naturel dans cette scène tout en conservant l’idée de mouvement.
- source_word: וַתִּפֹּל
  choice: elle tomba
  rationale: Le verbe hébreu est au féminin singulier et renvoie très probablement à חֶרֶב, « l’épée ». Le pronom français maintient la cohésion du récit.
