source:
  edition: WLC
  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: fr
  text: 'Il se trouvait là un vaurien[a] nommé Shéba, fils de Bikri, un Benjaminite. Il sonna du shofar[b] et dit : « Nous n’avons aucune part en David, aucun héritage dans le fils de Jessé ! Chacun à ses tentes[c], Israël ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme pervers », « un homme sans valeur » ; littéralement « un homme de Bélial » — expression qui désigne ici un individu vil ou rebelle.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne le shofar, une corne servant à donner un signal public, traditionnellement une corne de bélier.
    reason: cultural_note
  - marker: c
    text: 'Littéralement « chacun à ses tentes » : formule appelant chaque personne à regagner son foyer ou son camp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: Il se trouvait là
  rationale: Dans cette construction narrative, le niphal de קרא avec שָׁם a une valeur existentielle. Cette formulation française introduit naturellement le personnage sans suggérer qu’il aurait été « appelé ».
- source_word: אִישׁ בְּלִיַּעַל
  choice: un vaurien
  rationale: L’expression caractérise ici un homme vil, sans valeur morale ou rebelle. « Vaurien » est idiomatique, vigoureux et n’importe pas dans le récit les associations démonologiques ultérieures du nom « Bélial ».
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Shéba, fils de Bikri
  rationale: Les noms sont translittérés selon un usage français clair, et la filiation est conservée.
- source_word: אִישׁ יְמִינִי
  choice: un Benjaminite
  rationale: La formule indique l’appartenance tribale; « Benjaminite » est le terme français courant.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: Il sonna du cor
  rationale: Le שׁוֹפָר est une corne utilisée comme instrument de signal. « Sonner du cor » est naturel en français et plus précis que « trompette ».
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: Nous n’avons aucune part en David
  rationale: « Part » conserve le sens politique et relationnel de חֵלֶק ainsi que la formulation métaphorique de l’hébreu.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: aucun héritage dans le fils de Jessé
  rationale: « Héritage » préserve les résonances foncières et d’allotissement de נַחֲלָה, tandis que « le fils de Jessé » maintient la manière dépréciative de désigner David sans son titre royal.
- source_word: אִישׁ לְאֹהָלָיו
  choice: Chacun à ses tentes
  rationale: Cette tournure conserve l’image littérale et la force de slogan de l’idiome distributif, tout en étant compréhensible en français.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom est conservé comme vocatif final dans le cri de ralliement.
theological_decisions:
- issue: Faut-il comprendre בְּלִיַּעַל comme un nom propre (« Bélial ») ou comme une caractérisation morale ?
  choice: 'Terme descriptif : « un vaurien »'
  alternative: « un homme de Bélial » ou « un homme pervers »
  rationale: Dans ce récit, l’expression qualifie la conduite et la valeur morale de Shéba; rien n’impose d’y voir un nom démonologique. Le rendu descriptif évite d’introduire une conception théologique plus tardive.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde le ton abrupt d’un cri de rupture politique. « Shéba » et « Bikri » suivent une translittération française lisible; « Benjaminite » exprime clairement l’appartenance tribale.
