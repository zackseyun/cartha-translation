base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: fr
  text: 'Il s’approcha d’elle, et la femme lui dit : « Es-tu Joab ? » Il dit : « C’est moi. » Elle lui dit : « Écoute les paroles de ta servante[a]. » Il dit : « J’écoute. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton esclave ». Le terme hébreu est féminin et sert ici d’autodésignation humble et déférente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: Il s’approcha d’elle
  rationale: Le qal de קרב exprime ici un mouvement physique vers la femme. « S’approcha d’elle » est naturel en français et conserve explicitement la direction marquée par אֵלֶיהָ.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Dans ce contexte narratif, אִשָּׁה désigne simplement la femme qui parle, sans indiquer qu’elle est une épouse.
- source_word: הַאַתָּה יוֹאָב
  choice: Es-tu Joab ?
  rationale: L’interrogatif suivi du pronom indépendant demande directement l’identité de l’interlocuteur.
- source_word: אָנִי
  choice: Oui, c’est moi
  rationale: Le pronom isolé constitue une réponse affirmative d’identification. Cette formulation idiomatique française explicite l’affirmation impliquée sans modifier son sens.
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif de שמע appelle ici une attention volontaire ; « Écoute » convient mieux que le plus passif « Entends » en français actuel.
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Le pluriel construit de דָּבָר est rendu formellement par « les paroles de », ce qui préserve la forme et la dignité du discours.
- source_word: אֲמָתֶךָ
  choice: ta servante
  rationale: אָמָה est un nom féminin de servante, employé ici comme autodésignation humble. « Ta servante » conserve le genre, la relation sociale et la déférence dans un français naturel.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: J’écoute
  rationale: Le participe avec le pronom emphatique exprime l’attention présente et continue. « J’écoute » est la réponse française la plus concise et idiomatique.
