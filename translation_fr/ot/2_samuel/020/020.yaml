base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/020.yaml
  text: Joab answered and said[a], “Far be it from me, far be it, if I should swallow up or destroy!”
translation:
  language: fr
  text: 'Joab répondit : « Loin de moi ! Loin de moi l’idée d’engloutir ou de détruire ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: Joab répondit
  rationale: La formule narrative hébraïque associe littéralement « répondit » et « dit ». En français actuel, « répondit » exprime naturellement l’ensemble sans lourdeur.
- source_word: חָלִילָה חָלִילָה לִי
  choice: Loin de moi, loin de moi l’idée de
  rationale: Cette tournure française rend le rejet énergique exprimé par l’interjection répétée, tout en conservant son redoublement emphatique.
- source_word: אִם ... וְאִם
  choice: de ... ou de
  rationale: Après la formule de vive répudiation, la construction infinitive française est plus naturelle qu’un calque conditionnel en « si », et « ou » relie clairement les deux actes rejetés.
- source_word: אֲבַלַּע
  choice: engloutir
  rationale: Le verbe בלע signifie littéralement « avaler ». « Engloutir » conserve cette image vive et convient naturellement à la menace pesant sur une ville.
- source_word: אַשְׁחִית
  choice: détruire
  rationale: Le hifil de שׁחת exprime ici l’action de détruire ou de causer la ruine ; « détruire » est direct et adapté au contexte militaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition hébraïque est maintenue pour préserver la force de la dénégation, tandis que la double formule narrative « répondit et dit » est resserrée selon l’usage français.
