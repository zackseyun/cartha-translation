  text: אָנֹכִ֕י שְׁלֻמֵ֖י אֱמוּנֵ֣י יִשְׂרָאֵ֑ל אַתָּ֣ה מְבַקֵּ֗שׁ לְ/הָמִ֨ית עִ֤יר וְ/אֵם֙ בְּ/יִשְׂרָאֵ֔ל לָ֥/מָּה תְבַלַּ֖ע נַחֲלַ֥ת יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: fr
  text: Je fais partie des gens paisibles et fidèles d’Israël. Tu cherches à faire périr une ville, une mère en Israël[a]. Pourquoi engloutirais-tu l’héritage de Yahvé ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une ville qui est une mère en Israël », probablement au sens d’une ville importante ou protectrice au sein d’Israël.'
    reason: Alternative syntaxique et explicitation de la métaphore.
lexical_decisions:
- source_word: שְׁלֻמֵי
  choice: des gens paisibles
  rationale: Le pluriel construit désigne ici un groupe caractérisé par la paix. « Je fais partie des gens paisibles » restitue cette nuance collective de façon naturelle, sans réduire l’expression à l’état intérieur de la locutrice.
- source_word: אֱמוּנֵי
  choice: fidèles
  rationale: Le terme qualifie des personnes dignes de confiance et constantes dans leur loyauté. « Fidèles » conserve sa portée sociale et possiblement covenantale tout en s’accordant naturellement avec « paisibles ».
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: tu cherches à faire périr
  rationale: La construction exprime une intention active de causer la mort. Avec « une ville » pour objet, « faire périr » est idiomatique en français et reste plus proche du verbe מות que le terme plus général « détruire ».
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: une ville, une mère en Israël
  rationale: 'La juxtaposition préserve l’image hébraïque et son ambiguïté syntaxique : la ville peut être présentée en apposition comme une mère en Israël. Une formulation explicative est donnée en note.'
- source_word: תְבַלַּע
  choice: engloutirais-tu
  rationale: Le verbe signifie littéralement « avaler, engloutir ». « Engloutir » maintient l’image vive de l’anéantissement sans la remplacer par une explication.
- source_word: נַחֲלַת יְהוָה
  choice: l’héritage de Yahvé
  rationale: « Héritage » rend la valeur territoriale et covenantale de נחלה, tandis que la relation génitive affirme qu’Israël appartient à Yahvé.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente explicitement le nom divin et correspond à l’usage du projet.
theological_decisions:
- issue: Sens métaphorique de « mère en Israël »
  choice: 'Conserver la métaphore dans le texte principal : « une ville, une mère en Israël »'
  alternative: « une ville qui est une mère en Israël » ou « une ville importante en Israël »
  rationale: L’hébreu permet de comprendre « mère » comme une apposition décrivant le rôle éminent ou protecteur de la ville. Le texte principal garde cette image et sa tension syntaxique, tandis que la note explicite la lecture probable sans l’imposer.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse personnelle de la femme à Joab. « Faire périr » convient à une ville tout en gardant la notion de mort; « engloutir » préserve l’image poétique du texte hébreu.
