  text: וְ/אִישׁ֙ עָמַ֣ד עָלָ֔י/ו מִֽ/נַּעֲרֵ֖י יוֹאָ֑ב וַ/יֹּ֗אמֶר מִי֩ אֲשֶׁ֨ר חָפֵ֧ץ בְּ/יוֹאָ֛ב וּ/מִ֥י אֲשֶׁר לְ/דָוִ֖ד אַחֲרֵ֥י יוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: fr
  text: 'Un des jeunes hommes[a] de Joab se tenait au-dessus de lui et dit : « Quiconque est favorable à Joab et quiconque est pour David, qu’il suive Joab[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs » ou « hommes de suite ». Le terme hébreu désigne ici des subordonnés de Joab.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « derrière Joab » ; dans ce contexte, il s’agit d’un appel à se rallier à lui et à le suivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Un
  rationale: אִישׁ désigne ici un individu indéfini appartenant au groupe des hommes de Joab ; « Un des… » est naturel en français.
- source_word: עָמַד עָלָיו
  choice: se tenait au-dessus de lui
  rationale: עמד avec על peut signifier se tenir au-dessus de quelqu’un ou près de lui. Le contexte immédiat, où Amasa gît sur le chemin, favorise l’image d’un homme posté au-dessus de lui.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: des jeunes hommes de Joab
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un homme de suite. « Jeunes hommes » garde le sens transparent du terme tout en convenant au contexte militaire.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: Quiconque est favorable à Joab
  rationale: חָפֵץ exprime le plaisir, le désir ou la faveur. Dans ce cri de ralliement, « être favorable à » rend l’idée de soutien sans la réduire à une émotion.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: et quiconque est pour David
  rationale: La préposition לְ marque ici l’appartenance ou l’allégeance ; « être pour David » exprime naturellement cette loyauté politique et militaire.
- source_word: אַחֲרֵי יוֹאָב
  choice: qu’il suive Joab
  rationale: L’expression signifie littéralement « derrière Joab ». Dans cet appel à l’action, elle invite les hommes à se ranger derrière lui et à le suivre ; le français demande un verbe explicite.
theological_decisions: []
