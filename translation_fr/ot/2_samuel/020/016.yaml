  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: fr
  text: 'Alors une femme sage appela depuis la ville : « Écoutez ! Écoutez ! Je vous en prie, dites à Joab : “Approche jusqu’ici, afin que je te parle.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: une femme pleine de sagesse
  rationale: Rend naturellement l’expression hébraïque « femme sage » tout en soulignant qu’elle se distingue par sa sagesse, sans lui attribuer un titre officiel.
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: Écoutez ! Écoutez !
  rationale: Conserve l’impératif pluriel répété et son caractère pressant.
- source_word: אִמְרוּ נָא
  choice: Dites, je vous prie
  rationale: Le pluriel s’adresse aux personnes à portée de voix ; נָא marque ici une demande polie et insistante.
- source_word: קְרַב עַד הֵנָּה
  choice: Approche jusqu’ici
  rationale: Préserve le mouvement demandé ainsi que la nuance de limite ou de point d’arrivée portée par עַד.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: que je te parle
  rationale: Formulation française naturelle exprimant le but de l’approche demandée ; le singulier masculin vise Joab.
