  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אֲבִישַׁ֔י עַתָּ֗ה יֵ֧רַֽע לָ֛/נוּ שֶׁ֥בַע בֶּן בִּכְרִ֖י מִן אַבְשָׁל֑וֹם אַ֠תָּה קַ֞ח אֶת עַבְדֵ֤י אֲדֹנֶ֨י/ךָ֙ וּ/רְדֹ֣ף אַחֲרָ֔י/ו פֶּן מָ֥צָא ל֛/וֹ עָרִ֥ים בְּצֻר֖וֹת וְ/הִצִּ֥יל עֵינֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: fr
  text: 'David dit alors à Abishaï : « Maintenant, Shéba, fils de Bikri, nous fera plus de mal qu''Absalom. Toi, prends les serviteurs de ton seigneur et poursuis-le, de peur qu''il ne trouve pour lui des villes fortifiées et qu''il échappe à nos regards[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L''hébreu dit littéralement quelque chose comme « délivrer nos yeux » : il s''agit de se dérober à nos regards ou de nous échapper.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: nous fera plus de mal
  rationale: Le verbe exprime ici le tort ou les dommages causés, plutôt que le mal moral abstrait; cette formulation française conserve naturellement la comparaison avec Absalom.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Shéba, fils de Bikri
  rationale: Les noms propres sont translittérés selon un usage français clair; l'apposition filiale est explicitée par une virgule.
- source_word: מִן אַבְשָׁלוֹם
  choice: qu'Absalom
  rationale: La préposition marque la comparaison; le français n'a pas besoin d'ajouter « ne l'a fait » pour que celle-ci soit intelligible.
- source_word: אַתָּה קַח
  choice: Toi, prends
  rationale: Le pronom indépendant est conservé afin de rendre l'insistance de l'ordre adressé personnellement à Abishaï.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: les serviteurs de ton seigneur
  rationale: Cette traduction préserve le rapport hiérarchique et le fait que David est le seigneur d'Abishaï, sans imposer ici le sens plus étroit d'« esclaves ».
- source_word: וּרְדֹף אַחֲרָיו
  choice: et poursuis-le
  rationale: Dans ce contexte militaire, « poursuivre » rend naturellement le verbe et sa construction, sans reproduire inutilement l'hébraïsme « poursuivre après ».
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette construction française courante exprime fidèlement l'appréhension ou le but négatif introduit par פֶּן.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: qu'il ne trouve pour lui des villes fortifiées
  rationale: « Trouve » conserve le sens direct de מָצָא, tandis que « pour lui » maintient le datif d'avantage, malgré une tournure légèrement marquée en français.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: et qu'il échappe à nos regards
  rationale: L'expression hébraïque est idiomatique, littéralement proche de « délivrer/arracher nos yeux ». La formulation retenue exprime l'idée de se dérober à la vue tout en gardant l'image du regard.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « De peur que… ne » et « seigneur » maintiennent une légère élévation adaptée au récit royal. Le pronom emphatique « Toi » et le datif « pour lui » conservent des traits significatifs de l'hébreu sans rendre l'ensemble obscur.
