base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: fr
  text: La femme se rendit auprès de tout le peuple avec sagesse. Ils coupèrent la tête de Shéba, fils de Bikri, et la lancèrent à Joab. Alors Joab sonna de la trompe, et ils se dispersèrent loin de la ville, chacun regagna sa tente[a]. Joab retourna à Jérusalem auprès du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun à ses tentes », formule consacrée signifiant que chacun retourne chez lui ou à son campement.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל כָּל הָעָם
  choice: La femme alla parler à tout le peuple
  rationale: 'בוא peut signifier « venir » ou « aller » selon le point de vue. « Alla » convient au mouvement narratif. Le verbe « parler » est explicité par le contexte immédiat : elle se rend auprès du peuple pour lui communiquer son conseil.'
- source_word: בְּחָכְמָתָהּ
  choice: avec sagesse
  rationale: Cette formulation naturelle conserve la valeur modale ou instrumentale de בְּ et souligne que la femme agit avec sagesse.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: Ils coupèrent la tête
  rationale: Rendu direct et naturel de l’action de trancher la tête, sans atténuer la violence du récit.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Shéba, fils de Bikri
  rationale: Transcription française claire des noms propres et rendu conventionnel du patronyme hébreu.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: la lancèrent à Joab
  rationale: Le pronom reprend naturellement « la tête » en français ; « lancèrent à » exprime la direction indiquée par אֶל.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Joab sonna de la trompe
  rationale: Le sujet singulier implicite est Joab. « Trompe » rend le שׁוֹפָר comme instrument à vent servant de signal, sans suggérer nécessairement une trompette moderne.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: ses hommes se dispersèrent, quittant la ville
  rationale: Le sujet pluriel désigne contextuellement les hommes de Joab qui assiégeaient la ville. « Quittant la ville » exprime idiomatiquement l’éloignement depuis leur position contre elle.
- source_word: אִישׁ לְאֹהָלָיו
  choice: chacun rentrant chez lui
  rationale: Littéralement « chacun à ses tentes » ; il s’agit d’une formule consacrée désignant le retour de chacun à son lieu de résidence ou à son campement.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: Joab, lui, retourna à Jérusalem auprès du roi
  rationale: « Lui » marque naturellement le contraste entre la dispersion des hommes et le retour personnel de Joab vers le roi.
