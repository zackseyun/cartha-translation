  to: La femme se rendit auprès de tout le peuple avec sagesse. Ils coupèrent la tête de Shéba, fils de Bikri, et la lancèrent à Joab. Alors Joab sonna de la trompe, et ils se dispersèrent loin de la ville, chacun regagna sa tente[a]. Joab retourna à Jérusalem auprès du roi.
  rationale: La révision retire les explicitations non requises (« parler », « ses hommes ») et rend le retrait par « loin de la ville », formulation qui respecte mieux la portée de מֵעַל הָעִיר sans décider si les personnes étaient dans la ville ou devant elle. Elle rétablit aussi « tente » dans le texte, tout en conservant la note culturelle.
