    issue: « alla parler » explicite un verbe absent du texte source.
    rationale: וַתָּבוֹא signifie « alla/vint » ; le contexte rend plausible qu'elle s'adresse au peuple, mais le verset ne l'énonce pas et l'ajout n'est pas nécessaire en français.
  - severity: medium
    issue: « ses hommes » et « quittant la ville » surdéterminent la scène.
    rationale: Le pluriel n'est pas lexicalement précisé comme « ses hommes », et מֵעַל הָעִיר évoque le retrait loin/de dessus la ville, probablement depuis la position de siège, non nécessairement une sortie de la ville.
  - severity: low
    issue: « chacun rentrant chez lui » remplace l'image des tentes dans le corps du texte.
    rationale: La note compense ce choix, mais « chacun regagna sa tente » est naturel et maintient la formulation source, y compris son caractère idiomatique.
