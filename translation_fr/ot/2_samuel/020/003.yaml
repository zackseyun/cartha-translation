  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: fr
  text: David arriva dans sa maison à Jérusalem. Le roi prit les dix femmes, les concubines qu’il avait laissées pour garder la maison, et les mit sous garde[a]. Il pourvut à leurs besoins, mais n’eut pas de relations avec elles[b]. Elles restèrent ainsi enfermées jusqu’au jour de leur mort, vivant comme des veuves[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans une maison de garde » ou « de détention ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « il ne vint pas vers elles », euphémisme désignant ici les relations sexuelles.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « un veuvage de vivantes ». Elles vivaient comme des veuves alors que David, leur mari, était encore vivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: בַּיִת peut désigner une maison, un palais ou une maisonnée. « Sa maison » conserve la formulation hébraïque sans imposer « palais », plus interprétatif.
- source_word: פִּלַגְשִׁים
  choice: concubines
  rationale: Le terme désigne des femmes ayant un statut conjugal reconnu mais inférieur dans la maison royale; « concubines » est l’équivalent français usuel et précis.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: avait laissées pour garder la maison
  rationale: La formulation conserve le sens de surveillance ou de garde exprimé par שׁמר, tout en restant naturelle en français.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: un lieu sous garde
  rationale: L’expression signifie littéralement « maison de garde/détention ». « Un lieu sous garde » communique à la fois la mise à l’écart et la surveillance sans préciser indûment la nature du bâtiment.
- source_word: וַיְכַלְכְּלֵם
  choice: il pourvut à leurs besoins
  rationale: Le verbe exprime le fait de nourrir, soutenir ou entretenir matériellement; cette tournure française rend clairement la prise en charge continue.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: n’eut plus de relations avec elles
  rationale: בוא אל est ici un euphémisme conventionnel pour les relations sexuelles. La traduction en explicite le sens en français courant; « plus » exprime la cessation impliquée par leur statut antérieur de concubines et par le contexte.
- source_word: צְרֻרוֹת
  choice: restèrent enfermées
  rationale: Le participe passif décrit un état durable de réclusion. « Restèrent enfermées » conserve cette valeur résultative et durative ainsi que la dureté du récit.
- source_word: עַד יוֹם מֻתָן
  choice: jusqu’au jour de leur mort
  rationale: Traduction directe de la construction nominale hébraïque.
- source_word: אַלְמְנוּת חַיּוּת
  choice: vivant comme des veuves
  rationale: L’expression inhabituelle évoque un veuvage vécu alors que le mari est encore en vie. Cette formulation naturelle maintient le paradoxe, expliqué en note.
theological_decisions:
- issue: Portée morale et sociale du traitement des concubines par David
  choice: Décrire sans atténuer ni justifier les actes et leurs conséquences
  alternative: Présenter la mesure comme une simple protection, ou ajouter une condamnation morale explicite absente du verset
  rationale: Le texte rapporte sobrement la mise sous garde, l’entretien matériel, la cessation des relations sexuelles et la réclusion jusqu’à la mort. La traduction en conserve la dureté sans ajouter de jugement doctrinal.
- issue: Sens de l’expression décrivant leur état final
  choice: Conserver l’image paradoxale de femmes vivant comme des veuves
  alternative: Réduire l’expression à « célibataires » ou à « abandonnées »
  rationale: « Veuvage de leur vivant » indique que David demeure vivant, mais qu’elles vivent désormais dans une condition analogue à celle de veuves; l’image théologiquement et socialement tendue ne doit pas être aplatie.
translation_notes:
  register: Français international moderne, sobre et digne. Le récit demeure direct et ne masque ni la réclusion des femmes ni leur situation paradoxale. Les termes techniques ou les hébraïsmes peu naturels sont expliqués en notes plutôt qu’imposés dans le corps du texte.
