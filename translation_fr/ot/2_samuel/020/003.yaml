  naturalness: Le français est sobre et moderne. « Les mit sous garde » est plus idiomatique et plus précis que « les plaça dans un lieu sous garde ». « Elles restèrent ainsi enfermées » rend naturellement l’état durable indiqué par le participe passif.
  terminology: « Concubines » est le terme usuel et approprié. « Pourvut à leurs besoins » rend correctement l’entretien matériel. « N’eut pas de relations avec elles » explicite avec sobriété l’euphémisme hébreu, sans l’ajout interprétatif de « plus ». La note sur le « veuvage » doit signaler que le paradoxe concerne David, encore vivant.
