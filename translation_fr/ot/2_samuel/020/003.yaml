revisions:
- from: David arriva dans sa maison à Jérusalem. Le roi prit les dix femmes, les concubines qu’il avait laissées pour garder la maison, et les plaça dans un lieu sous garde[a]. Il pourvut à leurs besoins, mais n’eut plus de relations avec elles[b]. Elles restèrent donc enfermées jusqu’au jour de leur mort, vivant comme des veuves[c].
  to: David arriva dans sa maison à Jérusalem. Le roi prit les dix femmes, les concubines qu’il avait laissées pour garder la maison, et les mit sous garde[a]. Il pourvut à leurs besoins, mais n’eut pas de relations avec elles[b]. Elles restèrent ainsi enfermées jusqu’au jour de leur mort, vivant comme des veuves[c].
  rationale: La révision remplace une expression qui pouvait décrire seulement un bâtiment surveillé par « les mit sous garde », qui rend la mise en détention/séclusion et la surveillance sans préciser indûment le type de lieu. Elle retire « plus », ajout contextuellement plausible mais non explicite, et clarifie dans la note le paradoxe du « veuvage » alors que David demeure vivant.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T16:12:17Z'
