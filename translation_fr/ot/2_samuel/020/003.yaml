    rationale: Le contexte permet d’inférer une cessation, mais le mot « plus » n’est pas exprimé par וַאֲלֵיהֶם לֹא בָא. Le retrancher conserve l’implicite du texte.
  - severity: low
    issue: Explication de la note c
    rationale: « De leur vivant » peut laisser indéterminé le référent de l’expression paradoxale. La note doit préciser que David, leur mari, était toujours vivant.
