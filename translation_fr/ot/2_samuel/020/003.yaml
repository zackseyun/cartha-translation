    issue: « dans un lieu sous garde »
    rationale: Cette formulation peut signifier que le lieu était surveillé, sans exprimer clairement que les femmes étaient mises en détention ou sous garde. Le syntagme hébreu בֵּית מִשְׁמֶרֶת désigne une maison/un lieu de garde ou de détention.
