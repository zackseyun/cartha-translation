source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹאָב֙ לַ/עֲמָשָׂ֔א הֲ/שָׁל֥וֹם אַתָּ֖ה אָחִ֑/י וַ/תֹּ֜חֶז יַד יְמִ֥ין יוֹאָ֛ב בִּ/זְקַ֥ן עֲמָשָׂ֖א לִ/נְשָׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: fr
  text: 'Joab dit à Amasa[a] : « Vas-tu bien, mon frère ? » Puis, de la main droite, Joab saisit Amasa par la barbe pour l’embrasser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Saisir la barbe et embrasser quelqu’un étaient des gestes associés à une salutation familière ; dans ce contexte, Joab s’en sert pour tromper Amasa.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם אַתָּה
  choice: Vas-tu bien
  rationale: Cette tournure française naturelle rend l’expression idiomatique par laquelle Joab s’enquiert du bien-être d’Amasa, sans la réduire à un simple bonjour.
- source_word: אָחִי
  choice: mon frère
  rationale: Le possessif est explicite en hébreu. L’expression conserve à la fois le terme de parenté et la cordialité feinte de Joab.
- source_word: וַתֹּחֶז
  choice: saisit
  rationale: Le verbe exprime l’action de prendre fermement ou de tenir. « Saisit » convient au geste précis sans expliciter par avance la violence du verset suivant.
- source_word: יַד יְמִין יוֹאָב
  choice: de la main droite, Joab
  rationale: Cette formulation idiomatique conserve le détail explicite selon lequel Joab accomplit le geste de la main droite.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: Amasa par la barbe
  rationale: En français, « saisir quelqu’un par la barbe » exprime naturellement la relation syntaxique du texte hébreu.
- source_word: לִנְשָׁק לוֹ
  choice: pour l’embrasser
  rationale: 'L’infinitif précédé de ל indique ici le but : Joab saisit la barbe d’Amasa afin de l’embrasser.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La question idiomatique « Vas-tu bien ? » reste immédiatement compréhensible, tandis que « mon frère » et le détail de la main droite préservent la proximité formelle avec l’hébreu.
