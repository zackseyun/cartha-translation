  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: fr
  text: 'Le roi dit alors à Amasa : « Convoque pour moi les hommes de Juda[a] dans un délai de trois jours, et toi, reste ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie une expression collective masculine, littéralement « l’homme de Juda ». Le contexte désigne probablement les hommes de Juda aptes à être mobilisés, sans toutefois les appeler explicitement « guerriers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait avancer le récit ; « alors » exprime naturellement cette succession en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne David dans le contexte, sans qu’il soit nécessaire de remplacer le titre par son nom propre.
- source_word: הַזְעֶק
  choice: Convoque
  rationale: L’impératif à la forme causative exprime ici un appel public destiné à rassembler ou mobiliser un groupe. « Convoque » restitue ce sens avec concision.
- source_word: לִי
  choice: pour moi
  rationale: Le datif indique que la convocation doit être faite pour le compte du roi.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: les hommes de Juda
  rationale: אִישׁ est au singulier dans une expression collective. Le contexte évoque probablement les hommes mobilisables, mais le texte ne dit pas explicitement « guerriers ».
- source_word: שְׁלֹשֶׁת יָמִים
  choice: dans un délai de trois jours
  rationale: Dans cet ordre royal, l’expression indique vraisemblablement le délai accordé pour effectuer la convocation, et non une durée pendant laquelle convoquer.
- source_word: וְאַתָּה
  choice: et toi
  rationale: Le pronom exprimé porte une emphase. « Et toi » conserve à la fois la coordination et la mise en relief sans renforcer artificiellement le contraste.
- source_word: פֹּה
  choice: ici
  rationale: Rendu direct et idiomatique de l’adverbe de lieu.
- source_word: עֲמֹד
  choice: reste
  rationale: Bien que le verbe signifie littéralement « se tenir debout », il demande ici à Amasa de demeurer sur place ; « reste » exprime naturellement ce sens contextuel.
