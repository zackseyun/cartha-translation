source:
  edition: WLC
  text: וְ/גַ֗ם עִירָא֙ הַ/יָּ֣אִרִ֔י הָיָ֥ה כֹהֵ֖ן לְ/דָוִֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/026.yaml
  text: And Ira the Jairite also was priest to David[a].
translation:
  language: fr
  text: Ira le Jaïrite était lui aussi prêtre auprès de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « haut fonctionnaire » ou « conseiller royal » ; le mot hébreu signifie littéralement « prêtre », mais, dans certains contextes royaux, il peut désigner un haut dignitaire de la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: lui aussi
  rationale: La conjonction et la particule additive marquent à la fois la continuité de la liste et l’ajout. En français, « lui aussi » restitue naturellement cette nuance sans alourdir la phrase.
- source_word: עִירָא
  choice: Ira
  rationale: Le nom propre est translittéré plutôt que traduit.
- source_word: הַיָּאִרִי
  choice: le Yaïrite
  rationale: La forme adjectivale désigne vraisemblablement l’appartenance à un groupe ou la descendance de Yaïr. « le Yaïrite » reste concis et conforme à l’usage biblique français.
- source_word: הָיָה
  choice: était
  rationale: Dans cette liste de responsables, le parfait de היה a une valeur copulative simple et ne signifie pas nécessairement « devint ».
- source_word: כֹהֵן
  choice: prêtre
  rationale: Le sens lexical premier est « prêtre ». Même si le terme peut éventuellement désigner ici une haute fonction de cour, conserver « prêtre » dans le texte principal préserve l’ambiguïté de l’hébreu.
- source_word: לְדָוִד
  choice: auprès de David
  rationale: La préposition ל exprime ici une relation ou un service envers David. « auprès de David » est naturel en français et laisse ouverte la nature exacte de la fonction.
theological_decisions:
- issue: Sens de כֹהֵן dans le contexte de la cour royale
  choice: Conserver « prêtre » dans le texte principal
  alternative: « haut fonctionnaire » ou « conseiller royal »
  rationale: Certains comprennent le terme comme le titre non cultuel d’un dignitaire de la cour, notamment parce que des proches du roi sont ailleurs appelés כֹּהֲנִים. Toutefois, son sens ordinaire demeure « prêtre ». Le texte principal garde donc ce sens sans trancher la question, tandis que la note signale l’interprétation administrative.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation brève respecte le caractère administratif du verset. « Yaïrite » suit une translittération française claire, et « auprès de David » évite de préciser indûment la nature de la relation.
