  text: כַּ/אֲשֶׁ֥ר הֹגָ֖ה מִן הַֽ/מְסִלָּ֑ה עָבַ֤ר כָּל אִישׁ֙ אַחֲרֵ֣י יוֹאָ֔ב לִ/רְדֹּ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: fr
  text: Dès qu’on l’eut retiré de la route principale[a], tous les hommes se mirent en route à la suite de Joab pour poursuivre Shéba, fils de Bikri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la route » ou « de la chaussée ». Le mot hébreu peut désigner une route aménagée ou une voie principale.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Dès que
  rationale: Introduit la proposition temporelle et rend naturellement l’enchaînement immédiat des actions dans le récit.
- source_word: הֹגָה
  choice: on l’eut retiré
  rationale: Le hophal exprime une action causée et subie. Le pronom renvoie, d’après le contexte précédent, à Amasa ou à son corps, sans ajouter « corps » au texte.
- source_word: מִן הַמְסִלָּה
  choice: de la grand-route
  rationale: מְסִלָּה peut désigner une route aménagée ou principale. « Grand-route » conserve ce sens marqué tout en restant clair dans ce contexte.
- source_word: עָבַר
  choice: continuèrent
  rationale: Dans le contexte, le verbe indique que les soldats reprennent leur progression une fois l’obstacle retiré; « continuèrent » rend ce mouvement sans suggérer qu’ils ne font que passer à côté.
- source_word: כָּל אִישׁ
  choice: tous les hommes
  rationale: Le singulier distributif hébreu désigne collectivement les hommes de la troupe; le pluriel est la formulation française la plus naturelle.
- source_word: אַחֲרֵי יוֹאָב
  choice: à suivre Joab
  rationale: Exprime clairement que la troupe avance derrière Joab; cette formulation s’intègre naturellement avec « continuèrent ».
- source_word: לִרְדֹּף
  choice: pour poursuivre
  rationale: L’infinitif marque le but de la progression et le verbe « poursuivre » convient au contexte militaire.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Shéba, fils de Bikri
  rationale: Conserve directement le patronyme hébreu dans une forme française claire et usuelle.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le plus-que-parfait antérieur « l’eut retiré » marque avec précision l’action achevée avant la reprise de la poursuite. Le référent implicite du pronom est conservé sans explicitation interprétative.
