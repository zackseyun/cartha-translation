- from: 'Puis elle dit : « Autrefois, on avait coutume de dire : “Qu’on consulte donc à Abel[a] !” Et ainsi, on mettait fin à l’affaire[b]. »'
  to: 'Puis elle dit : « Autrefois, on disait bien : “Qu’on consulte donc à Abel[a]”, et ainsi on réglait l’affaire[b]. »'
  rationale: La révision rend plus explicitement l’insistance de la première construction hébraïque par « on disait bien » et relie grammaticalement les deux membres du proverbe. Elle conserve l’indétermination du sujet avec « on », le caractère locatif de « à Abel », ainsi que le sens de conclusion exprimé par le dernier verbe. Les notes restent ancrées aux mêmes éléments et l’alternative signale les nuances lexicales sans affirmer une solution interprétative unique.
