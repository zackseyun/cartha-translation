  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: fr
  text: 'Puis elle dit : « Autrefois, on disait bien : “Qu’on consulte donc à Abel[a]”, et ainsi on réglait l’affaire[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Abel » est la forme abrégée d’Abel-Beth-Maaka, la ville assiégée dans ce récit.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « Puis elle dit : “Autrefois, on disait bien : ‘Qu’on se renseigne donc à Abel’, et ainsi on menait l’affaire à son terme.” » L’hébreu emploie dans les deux propositions des constructions emphatiques formées d’un infinitif absolu et d’un verbe conjugué. Le dernier verbe peut aussi être rendu plus littéralement par « achever » ou « mener à son terme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: Puis elle dit
  rationale: Le wayyiqtol poursuit la séquence narrative, tandis que לֵאמֹר introduit le discours direct et se rend naturellement par la ponctuation française.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: on avait coutume de dire
  rationale: L’infinitif absolu suivi de l’imparfait exprime ici une parole répétée ou établie; la tournure impersonnelle française convient à la maxime rapportée.
- source_word: בָרִאשֹׁנָה
  choice: Autrefois
  rationale: L’adverbe renvoie à une pratique des temps passés plutôt qu’à la première étape d’une procédure.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: Qu’on consulte donc
  rationale: L’infinitif absolu avec l’imparfait renforce le verbe שאל. « donc » restitue sobrement l’insistance dans une formule proverbiale, tandis que « consulter » correspond au recours à Abel pour obtenir un avis.
- source_word: בְּאָבֵל
  choice: à Abel
  rationale: Abel désigne ici la ville d’Abel-Beth-Maaka sous sa forme abrégée; « à Abel » est idiomatique pour une consultation effectuée dans cette ville.
- source_word: וְכֵן הֵתַמּוּ
  choice: Et ainsi, on mettait fin à l’affaire
  rationale: וְכֵן indique le résultat ou la manière, et le hiphil de תמם signifie faire parvenir quelque chose à son terme. L’imparfait français s’accorde avec la coutume passée décrite.
