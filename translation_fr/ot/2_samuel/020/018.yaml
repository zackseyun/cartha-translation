  source_fidelity: 'Le sens général est fidèle : la femme cite une formule ancienne associant Abel à la consultation et à la conclusion d’une affaire. Toutefois, « on avait coutume de dire » affaiblit légèrement l’intensité de l’infinitif absolu (דַּבֵּר יְדַבְּרוּ), et la ponctuation actuelle isole artificiellement la seconde proposition de la maxime citée. « On disait bien » rend plus directement l’insistance sans surinterpréter le texte. « Consulter à Abel » conserve le complément locatif et le sens contextuel de rechercher un avis.'
  naturalness: La révision emploie une formulation française moderne, fluide et digne. « Autrefois, on disait bien » est plus idiomatique et moins lourd que « Autrefois, on avait coutume de dire ». La coordination en une seule maxime (« ..., et ainsi ... ») rend clairement la relation exprimée par וְכֵן.
  terminology: « Abel » et « Abel-Beth-Maaka » sont correctement rendus. « Consulter » convient dans ce contexte de recours à une ville réputée pour son conseil, sans imposer une interprétation institutionnelle. « Régler l’affaire » exprime naturellement l’idée de mener une affaire à son terme; la note préserve les possibilités plus littérales.
