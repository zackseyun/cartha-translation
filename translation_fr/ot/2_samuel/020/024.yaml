lexical_decisions:
- source_word: אֲדֹרָם
  choice: Adoram
  rationale: Nom propre translittéré sous sa forme française usuelle dans les traductions bibliques.
- source_word: עַל
  choice: était responsable de
  rationale: Dans ce contexte administratif, la préposition exprime l’autorité exercée sur un service; cette formulation restitue naturellement la proposition nominale hébraïque.
- source_word: הַמַּס
  choice: les travaux forcés
  rationale: Dans l’administration royale, מַס désigne ici une prestation de travail obligatoire imposée par l’État, plutôt qu’un impôt ordinaire.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre.
- source_word: בֶּן אֲחִילוּד
  choice: fils d’Ahiloud
  rationale: Rendu direct de la construction patronymique hébraïque.
- source_word: הַמַּזְכִּיר
  choice: archiviste
  rationale: Le titre désigne un haut fonctionnaire royal chargé des registres et des mémorandums; « archiviste » est clair en français moderne sans le présenter simplement comme un historien.
