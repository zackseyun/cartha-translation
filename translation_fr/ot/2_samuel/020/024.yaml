  text: Adoram était responsable de la corvée[a], et Josaphat, fils d’Ahiloud, était archiviste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des travaux forcés » ou « de la prestation obligatoire »; le terme hébreu désigne un travail obligatoire imposé par l’État, et non un impôt ordinaire.
