  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: fr
  text: Et Sheva était secrétaire[a], et Tsadok et Abiatar étaient prêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « scribe ». Le terme hébreu peut désigner un scribe royal ou un secrétaire ; « secrétaire » précise ici qu’il s’agit d’une fonction administrative.
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: Sheva
  rationale: Le nom propre est translittéré directement d’après la forme consonantique du texte massorétique. Les formes relevées dans des listes parallèles peuvent refléter une variante du nom, mais elles ne sont pas introduites dans le corps du verset.
- source_word: סֹפֵר
  choice: secrétaire
  rationale: Dans cette liste de responsables royaux, le terme désigne un scribe exerçant une fonction administrative. « Secrétaire » exprime clairement cette charge en français moderne, tandis que « scribe » reste une traduction lexicale possible.
- source_word: צָדוֹק
  choice: Tsadok
  rationale: Translittération française courante du nom propre hébreu.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Translittération française courante du nom propre hébreu.
- source_word: כֹּהֲנִים
  choice: prêtres
  rationale: Traduction usuelle du pluriel hébreu désignant les ministres du culte; ici, le mot indique la fonction de Tsadok et d’Abiatar.
- source_word: וְ
  choice: et
  rationale: La conjonction répétée relie les personnes et leurs fonctions dans la liste; sa seconde occurrence est conservée pour respecter la structure hébraïque.
