source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ עֲמָשָׂ֖א לְ/הַזְעִ֣יק אֶת יְהוּדָ֑ה ו/ייחר מִן הַ/מּוֹעֵ֖ד אֲשֶׁ֥ר יְעָדֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/005.yaml
  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
translation:
  language: fr
  text: Amasa partit donc convoquer Juda[a], mais il dépassa le délai que David lui avait fixé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mobiliser Juda ». Le verbe hébreu évoque un appel urgent à se rassembler et, dans ce contexte, comprend probablement une mobilisation militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Dans ce récit, « partit » rend naturellement le déplacement entrepris par Amasa en vue d’accomplir sa mission.
- source_word: לְהַזְעִיק
  choice: convoquer
  rationale: Le hifil de זעק désigne ici le fait d’appeler d’urgence un groupe à se rassembler. « Convoquer » garde le caractère officiel et pressant sans expliciter à tort toute la nuance militaire.
- source_word: אֶת יְהוּדָה
  choice: Juda
  rationale: Le nom désigne collectivement la population ou les hommes de Juda. Le français peut conserver cette formulation concise, comme l’hébreu.
- source_word: וייחר
  choice: il dépassa le délai
  rationale: Dans ce contexte, אחר exprime le fait d’être en retard par rapport à une échéance; cette tournure s’accorde naturellement avec מִן הַמּוֹעֵד.
- source_word: מִן הַמּוֹעֵד
  choice: le délai
  rationale: מוֹעֵד désigne ici le temps fixé. « Le délai » exprime clairement en français l’échéance imposée dans le verset précédent.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: que David lui avait fixé
  rationale: יעד signifie fixer ou assigner un moment. L’identification de David comme sujet, explicite dans le contexte immédiat, évite l’ambiguïté référentielle peu naturelle du français « qu’il lui avait fixé ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la concision hébraïque, tandis que « David » explicite le référent contextuel du sujet de יעד. Le marqueur [a] figure bien dans le texte principal.
