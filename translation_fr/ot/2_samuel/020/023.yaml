  text: וְ/יוֹאָ֕ב אֶ֥ל כָּל הַ/צָּבָ֖א יִשְׂרָאֵ֑ל וּ/בְנָיָה֙ בֶּן יְה֣וֹיָדָ֔ע עַל ה/כרי וְ/עַל הַ/פְּלֵתִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: fr
  text: Joab commandait toute l’armée d’Israël, et Benaya, fils de Yehoyada, commandait les Kariens[a] et les Peléthiens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « les Kariens ». Selon une lecture traditionnelle, on peut aussi lire « les Kéréthiens ».
    reason: Variante lexicale et textuelle touchant le nom du groupe.
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Joab
  rationale: Le nom propre est translittéré selon l’usage français. La conjonction ouvre ici un nouvel élément d’une liste administrative et n’exige pas nécessairement un « et » en tête de phrase.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: commandait toute l’armée d’Israël
  rationale: Dans cette formule administrative sans verbe exprimé, אֶל indique la fonction d’autorité de Joab. « Commandait » rend naturellement cette relation, tandis que כָּל et צָבָא sont respectivement rendus par « toute » et « l’armée ».
- source_word: וּ/בְנָיָה בֶּן יְהוֹיָדָע
  choice: et Benaya, fils de Yehoyada
  rationale: Les noms sont translittérés sous des formes lisibles en français, et la filiation est conservée directement.
- source_word: עַל ה/כרי
  choice: commandait les Kéréthiens[a]
  rationale: עַל marque ici l’autorité exercée sur un corps constitué. « Kéréthiens » suit l’identification traditionnelle du nom de groupe, tout en signalant en note l’incertitude de la forme consonantique transmise.
- source_word: וְ/עַל הַ/פְּלֵתִי
  choice: et les Peléthiens
  rationale: La seconde expression dépend du même verbe « commandait ». Le nom du groupe est translittéré selon une forme française courante.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et administratif. « Commandait » évite une tournure artificielle comme « était sur » tout en conservant le parallélisme des deux charges. Les graphies Benaya, Yehoyada, Kéréthiens et Peléthiens privilégient une translittération claire pour un lectorat francophone international.
