source:
  edition: WLC
  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: fr
  text: Ainsi, tous les hommes d’Israël[a] montèrent, quittant David pour suivre Séba, fils de Bikri[b], tandis que les hommes de Juda s’attachèrent à leur roi, depuis le Jourdain jusqu’à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chaque homme d’Israël »; cette expression masculine au singulier a un sens collectif.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « montèrent de derrière David, derrière Séba ». Cette formulation peut exprimer le passage de l’allégeance à David à celle de Séba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: quittèrent
  rationale: Le verbe signifie littéralement « monter », mais peut, dans un récit, exprimer un départ. Ici, associé à מֵאַחֲרֵי דָוִד, il décrit l’abandon de David; « quittèrent » rend naturellement le mouvement sans ajouter l’idée plus précise d’une révolte.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: L’hébreu porte littéralement « chaque homme d’Israël ». Le pluriel collectif est idiomatique en français et conserve la référence masculine explicite du texte.
- source_word: מֵאַחֲרֵי דָוִד ... אַחֲרֵי שֶׁבַע
  choice: quittèrent David pour suivre Séba
  rationale: 'La répétition de אַחֲרֵי, « derrière/après », présente un transfert d’allégeance: ils cessent de suivre David et se mettent à suivre Séba.'
- source_word: וְאִישׁ יְהוּדָה
  choice: tandis que les hommes de Juda
  rationale: Le singulier morphologique a ici une valeur collective. « Tandis que » explicite sobrement le contraste entre la défection d’Israël et l’attachement de Juda.
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: restèrent attachés à leur roi
  rationale: דבק évoque le fait de s’attacher fermement à quelqu’un. Cette formulation conserve l’image tout en exprimant clairement la fidélité persistante des hommes de Juda.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלָם
  choice: depuis le Jourdain jusqu’à Jérusalem
  rationale: La construction מִן ... וְעַד marque l’étendue du trajet. « Depuis ... jusqu’à » la restitue sans amplification.
theological_decisions:
- issue: Nature de l’action des hommes d’Israël
  choice: Présenter le passage comme l’abandon de David au profit de Séba
  alternative: Traduire seulement le mouvement physique par « montèrent »
  rationale: Le parallélisme « de derrière David ... derrière Séba » indique un changement d’allégeance, sans qu’il soit nécessaire d’ajouter un terme doctrinal ou politique plus chargé comme « apostasièrent » ou « se révoltèrent ».
translation_notes:
  register: Français international moderne, naturel et digne. Les noms propres suivent les formes françaises usuelles « Séba » et « Bikri ». Le contraste entre Israël et Juda est rendu clairement, sans surinterpréter la portée politique ou théologique de l’épisode.
