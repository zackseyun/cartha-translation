source:
  edition: WLC
  text: לֹא כֵ֣ן הַ/דָּבָ֗ר כִּ֡י אִישׁ֩ מֵ/הַ֨ר אֶפְרַ֜יִם שֶׁ֧בַע בֶּן בִּכְרִ֣י שְׁמ֗/וֹ נָשָׂ֤א יָד/וֹ֙ בַּ/מֶּ֣לֶךְ בְּ/דָוִ֔ד תְּנֽוּ אֹת֣/וֹ לְ/בַדּ֔/וֹ וְ/אֵלְכָ֖ה מֵ/עַ֣ל הָ/עִ֑יר וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל יוֹאָ֔ב הִנֵּ֥ה רֹאשׁ֛/וֹ מֻשְׁלָ֥ךְ אֵלֶ֖י/ךָ בְּעַ֥ד הַ/חוֹמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: fr
  text: '« Ce n’est pas de cela qu’il s’agit. Mais un homme de la région montagneuse d’Éphraïm[b], nommé Shéba, fils de Bikri, a levé la main contre le roi, contre David[a]. Livrez-le, lui seul, et je me retirerai de la ville. » La femme dit à Joab : « Voici : sa tête te sera jetée par-dessus la muraille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « s’est révolté contre le roi, contre David ». L’expression hébraïque signifie littéralement « a levé la main ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « de la montagne d’Éphraïm »; l’expression désigne habituellement la région montagneuse d’Éphraïm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: Ce n’est pas de cela qu’il s’agit
  rationale: Cette formulation française naturelle exprime la réfutation de ce que la femme vient de supposer, sans calquer lourdement l’ordre des mots hébreux.
- source_word: כִּי
  choice: Mais
  rationale: Après la négation, la conjonction introduit ici l’explication corrective.
- source_word: מֵהַר אֶפְרַיִם
  choice: de la région montagneuse d’Éphraïm
  rationale: L’expression désigne vraisemblablement la région montagneuse d’Éphraïm plutôt qu’un sommet unique.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: nommé Shéba, fils de Bikri
  rationale: Rend naturellement en français la formule hébraïque d’identification tout en conservant la filiation.
- source_word: נָשָׂא יָדוֹ
  choice: a levé la main
  rationale: Conserve l’image concrète de l’idiome hébreu, dont le contexte indique un acte de rébellion hostile.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: contre le roi, contre David
  rationale: La répétition de « contre » reflète celle de la préposition hébraïque et maintient l’apposition emphatique.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: Livrez-le, lui seul
  rationale: Exprime clairement que Joab exige la remise du seul coupable, avec l’insistance portée par לְבַדּוֹ.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: et je me retirerai de la ville
  rationale: Dans le contexte du siège, il s’agit de lever la pression militaire et de s’éloigner de la ville, non d’en sortir.
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec dignité l’annonce emphatique et imminente faite par la femme.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: sa tête te sera jetée par-dessus la muraille
  rationale: Le participe passif introduit par הִנֵּה prend ici naturellement une valeur de futur imminent; « par-dessus » convient à l’action décrite.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe du dialogue reste vive, tandis que l’idiome hébreu « lever la main » et la répétition « contre le roi, contre David » sont conservés afin de ne pas effacer la force rhétorique du texte.
