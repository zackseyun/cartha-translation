  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: fr
  text: Il parcourut toutes les tribus d’Israël jusqu’à Abel et Beth-Maaka, et tous les Bérites[a] se rassemblèrent et le suivirent eux aussi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « tous les Bérites ». Certaines traductions lisent « tous les Bikrites », en reliant ce groupe à Shéba, fils de Bikri ; le texte massorétique soutient plus directement « Bérites ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « vinrent eux aussi derrière lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Il parcourut
  rationale: Le verbe עבר décrit ici un déplacement à travers un territoire; « parcourut » rend naturellement cette progression.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: toutes les tribus d’Israël
  rationale: Avec « parcourut », le complément désigne l’ensemble des territoires tribaux traversés.
- source_word: אָבֵלָה וּבֵית מַעֲכָה
  choice: jusqu’à Abel et Beth-Maaka
  rationale: Le hé directionnel de אָבֵלָה indique le but du déplacement; les deux éléments sont conservés séparément comme dans le texte massorétique.
- source_word: וְכָל הַבֵּרִים
  choice: puis tous les Bérites
  rationale: La vocalisation massorétique soutient directement un gentilé correspondant à « Bérites »; « puis » explicite sobrement la progression narrative du waw.
- source_word: ויקלהו
  choice: se rassemblèrent
  rationale: La forme transmise est graphiquement difficile, mais le contexte et la lecture traditionnelle וַיִּקָּהֲלוּ indiquent l’idée de se réunir.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: et le suivirent eux aussi
  rationale: Littéralement, ils « vinrent eux aussi derrière lui »; en contexte, l’expression signifie qu’ils se joignirent à sa marche.
