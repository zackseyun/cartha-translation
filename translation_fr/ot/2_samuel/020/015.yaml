base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: fr
  text: Ils vinrent l’assiéger à Abel-Beth-Maaka[a]. Ils élevèrent une rampe de siège contre la ville, et elle fut dressée contre l’ouvrage défensif[b]. Tous les hommes qui étaient avec Joab s’acharnaient à le détruire afin d’abattre la muraille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « l’assiéger », avec un pronom masculin qui vise probablement Shéba, même si c’est la ville qui subit le siège. On pourrait aussi traduire : « mettre le siège devant elle ».'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu peut désigner un rempart, une levée ou un autre ouvrage défensif extérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils vinrent
  rationale: Rend naturellement le verbe narratif בוא au wayyiqtol et marque l’arrivée des troupes.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: l’assiéger
  rationale: צור avec עַל signifie couramment « assiéger ». Le suffixe masculin singulier est conservé et vise vraisemblablement Shéba, poursuivi jusque dans la ville.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: dans Abel-Beth-Maaka
  rationale: Translittération française claire du nom de lieu, traité comme un nom composé traditionnel.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: Ils élevèrent une rampe de siège
  rationale: שׁפך, littéralement « verser », décrit ici l’amoncellement de matériaux; סֹלְלָה désigne une levée ou rampe de siège.
- source_word: אֶל הָעִיר
  choice: contre la ville
  rationale: Dans ce contexte militaire, « contre » exprime naturellement la direction et la fonction hostile de la rampe.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: et celle-ci atteignait l’ouvrage défensif
  rationale: Le verbe féminin renvoie naturellement à la rampe. חֵל désigne une défense extérieure, sans qu’on puisse en préciser avec certitude la forme exacte. « Atteignait » exprime que la rampe était établie au contact de cette défense.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: Tous les hommes qui étaient avec Joab
  rationale: La construction elliptique avec אֶת exprime ici l’association. Dans le contexte, הָעָם désigne les hommes ou troupes de Joab.
- source_word: מַשְׁחִיתִם
  choice: s’employaient à démolir la muraille
  rationale: Le participe masculin pluriel décrit une action destructive en cours. Le suffixe objet est explicité par « la muraille », conformément au but énoncé ensuite, sans introduire un référent différent.
- source_word: לְהַפִּיל הַחוֹמָה
  choice: pour la faire tomber
  rationale: Le hifil de נפל signifie « faire tomber ». Le pronom évite une répétition lourde tout en gardant le sens causatif.
