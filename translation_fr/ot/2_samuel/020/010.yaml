review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement la vigilance d’Amasa, l’épée tenue par Joab, le coup fatal, l’effusion des entrailles et la poursuite de Shéba. Toutefois, « Il n’eut pas à le frapper une seconde fois » ajoute une notion de nécessité ou de non-besoin qui n’est pas exprimée par וְלֹא שָׁנָה לוֹ (« il ne le frappa pas de nouveau »). La variante traditionnelle de חֹמֶשׁ mérite aussi une note, puisque le sens anatomique précis reste discuté.
  naturalness: Le registre est naturel, sobre et adapté à un récit narratif grave. « N’était pas sur ses gardes » exprime plus directement le sens contextuel de נִשְׁמַר que « ne se méfia pas », qui peut suggérer plus spécifiquement un soupçon absent du texte.
  terminology: « Épée », « ventre », « entrailles », « poursuivirent » et les formes françaises des noms sont appropriés. Une note sur « ventre » préserve l’incertitude lexicale sans imposer la lecture traditionnelle.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « Il n’eut pas à le frapper une seconde fois ».
    rationale: Le texte hébreu énonce que Joab ne répéta pas le coup; il ne formule pas qu’un second coup n’était pas nécessaire. La formulation révisée conserve l’ellipse explicitée sans ajouter cette nuance modale.
  - severity: low
    issue: Absence de note pour le sens discuté de חֹמֶשׁ.
    rationale: Le choix « ventre » est très plausible dans ce contexte, mais la lecture traditionnelle « cinquième côte » demeure attestée. Une note brève permet de signaler cette alternative.
