  text: וַ/עֲמָשָׂ֨א לֹֽא נִשְׁמַ֜ר בַּ/חֶ֣רֶב אֲשֶׁ֣ר בְּ/יַד יוֹאָ֗ב וַ/יַּכֵּ/הוּ֩ בָ֨/הּ אֶל הַ/חֹ֜מֶשׁ וַ/יִּשְׁפֹּ֨ךְ מֵעָ֥י/ו אַ֛רְצָ/ה וְ/לֹא שָׁ֥נָה ל֖/וֹ וַ/יָּמֹ֑ת וְ/יוֹאָב֙ וַ/אֲבִישַׁ֣י אָחִ֔י/ו רָדַ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: fr
  text: Mais Amasa n’était pas sur ses gardes face à l’épée que Joab tenait à la main. Joab le frappa avec elle au ventre[a], et ses entrailles se répandirent à terre. Il ne le frappa pas une seconde fois, et Amasa mourut. Puis Joab et son frère Abishaï poursuivirent Shéba, fils de Bikri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la cinquième côte ». Le terme hébreu désigne plus probablement ici, de manière générale, le ventre ou l’abdomen.
    reason: alternative lexicale
lexical_decisions:
- source_word: נִשְׁמַר
  choice: ne se méfia pas
  rationale: Le nifal de שׁמר exprime ici le fait de ne pas être sur ses gardes face à l’arme de Joab. « Ne se méfia pas » est naturel en français et convient au contexte de tromperie.
- source_word: חֶרֶב
  choice: épée
  rationale: Équivalent français courant de חֶרֶב, adapté au contexte narratif.
- source_word: בְּיַד יוֹאָב
  choice: que Joab avait à la main
  rationale: Rend concrètement et naturellement l’emplacement de l’arme, sans transformer la tournure en indication d’agent.
- source_word: וַיַּכֵּהוּ בָהּ
  choice: Joab l’en frappa
  rationale: נכה signifie largement « frapper ». La formulation conserve cette généralité tout en indiquant clairement que Joab emploie l’épée.
- source_word: אֶל הַחֹמֶשׁ
  choice: au ventre
  rationale: Dans ces récits de Samuel, חֹמֶשׁ désigne vraisemblablement la région abdominale. « Au ventre » est clair et naturel, sans reprendre l’interprétation traditionnelle mais incertaine de la « cinquième côte ».
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: ses entrailles se répandirent à terre
  rationale: Cette traduction conserve l’image explicite et grave de l’hébreu. « Entrailles » est précis sans être familier, et « à terre » rend אַרְצָה.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: Il n’eut pas à le frapper une seconde fois
  rationale: L’hébreu dit littéralement qu’il ne répéta pas pour lui, le coup étant sous-entendu. Cette formulation française explicite l’ellipse et souligne qu’un seul coup fut fatal.
- source_word: וַיָּמֹת
  choice: Amasa mourut
  rationale: La répétition du nom évite toute ambiguïté pronominale en français et restitue simplement l’issue de la séquence.
- source_word: רָדַף אַחֲרֵי
  choice: poursuivirent
  rationale: Terme courant du registre militaire et narratif pour une poursuite.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Shéba, fils de Bikri
  rationale: Les noms propres sont translittérés selon des formes françaises lisibles; la virgule clarifie l’apposition.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La violence explicite du texte est conservée sans vocabulaire familier. La syntaxe est légèrement segmentée pour la clarté, et le nom d’Amasa est répété afin d’éviter une ambiguïté entre les deux hommes.
