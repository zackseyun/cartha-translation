  revised_footnotes:
  - marker: a
    text: Ou « à la cinquième côte ». Le terme hébreu désigne plus probablement ici, de manière générale, le ventre ou l’abdomen.
    reason: alternative lexicale
  revision_rationale: La révision remplace la tournure modale par l’énoncé narratif direct correspondant à l’hébreu, affine le rendu de l’absence de vigilance et ajoute une note pour l’alternative lexicale disputée relative à « ventre ».
