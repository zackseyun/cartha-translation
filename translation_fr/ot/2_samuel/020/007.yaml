base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: fr
  text: Les hommes de Joab, les Kéréthiens, les Péléthiens et tous les vaillants guerriers sortirent à sa suite. Ils sortirent de Jérusalem pour poursuivre Shéba, fils de Bikri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: partirent à sa suite
  rationale: Cette expression rend naturellement l’idée de sortir en suivant quelqu’un, tout en conservant l’ambiguïté contextuelle du pronom « sa ».
- source_word: אַנְשֵׁי יוֹאָב
  choice: les hommes de Joab
  rationale: Le groupe construit désigne les hommes placés sous l’autorité de Joab ; cette formulation est claire et proche de l’hébreu.
- source_word: הַכְּרֵתִי
  choice: les Kérétiens
  rationale: Le nom du groupe est translittéré plutôt que traduit de manière conjecturale ; « Kérétiens » reflète directement la consonne hébraïque כ.
- source_word: הַפְּלֵתִי
  choice: les Pélétiens
  rationale: Le nom propre collectif, régulièrement associé aux Kérétiens, est conservé par translittération.
- source_word: כָל הַגִּבֹּרִים
  choice: tous les vaillants guerriers
  rationale: גִּבּוֹרִים désigne ici des hommes réputés pour leur force et leur valeur militaire ; cette expression rend les deux nuances dans un français naturel.
- source_word: וַיֵּצְאוּ מִירוּשָׁלִַם
  choice: Ils sortirent de Jérusalem
  rationale: La reprise du verbe « sortir » respecte la répétition hébraïque et indique clairement le point de départ.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: pour poursuivre
  rationale: Le verbe exprime une poursuite active ; « poursuivre » est l’équivalent français direct et idiomatique.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Shéba, fils de Bikri
  rationale: La formule patronymique hébraïque est rendue explicitement, avec des translittérations françaises lisibles des noms propres.
