  variant: modern international French
source:
  edition: WLC
  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: fr
  text: Amasa se roulait dans le sang au milieu de la route[a]. Quand l’homme vit que tout le peuple s’arrêtait, il déplaça Amasa de la route dans le champ et jeta un vêtement sur lui, car il voyait que tous ceux qui arrivaient près de lui s’arrêtaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se débattait dans le sang ». Le verbe hébreu évoque littéralement le fait de se rouler sur soi-même, ici probablement les mouvements d’Amasa grièvement blessé.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: se roulait
  rationale: Le participe hitpolèl de גלל décrit littéralement un mouvement de roulement sur soi-même. « Se roulait » conserve cette image sans préciser au-delà de l’hébreu si le mouvement était volontaire ou convulsif.
- source_word: בַּדָּם
  choice: dans le sang
  rationale: L’article hébreu est conservé naturellement en français. Le texte ne précise pas explicitement « son sang ».
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: au milieu de la route
  rationale: מְסִלָּה désigne ici une voie aménagée et publique. « Route » est plus naturel en français moderne que « chaussée » ou « grand-route » dans ce contexte narratif.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: L’article défini désigne l’homme chargé de surveiller le corps d’Amasa dans le contexte immédiat.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: que tout le peuple s’arrêtait
  rationale: עמד exprime ici l’arrêt provoqué par la vue d’Amasa. L’imparfait rend le processus répété ou collectif observé par l’homme.
- source_word: וַיַּסֵּב
  choice: il déplaça
  rationale: Le hifil de סבב indique qu’il fit passer Amasa à l’écart. « Déplaça » reste neutre sur la manière concrète de le transporter.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: de la route dans le champ
  rationale: La construction marque le point de départ puis la destination; « dans le champ » explicite naturellement le mouvement vers celui-ci.
- source_word: בֶּגֶד
  choice: un vêtement
  rationale: בֶּגֶד est un terme général pour une pièce d’habillement; « manteau » serait trop précis.
- source_word: כָּל הַבָּא עָלָיו
  choice: tous ceux qui arrivaient près de lui
  rationale: L’expression désigne ceux qui arrivaient à l’endroit où gisait Amasa. Cette formulation évite le possible sens hostile de « tomber sur lui ».
- source_word: וְעָמָד
  choice: s’arrêtaient
  rationale: La répétition de עמד reprend le motif de l’arrêt des passants et se rend clairement par le même verbe français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concrète et sobre, sans ajouter qu’Amasa était déjà mort ni préciser que le sang était nécessairement le sien.
