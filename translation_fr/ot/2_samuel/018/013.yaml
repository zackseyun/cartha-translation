  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: fr
  text: Ou bien, si j’avais mis sa vie en péril par traîtrise — et aucune affaire ne reste cachée au roi —, toi-même, tu te serais tenu à l’écart.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: j’avais agi traîtreusement au péril de sa vie
  rationale: L’expression associe l’idée d’agir avec fausseté ou déloyauté à la vie d’Absalom. « Au péril de sa vie » restitue naturellement la portée de בְנַפְשׁוֹ sans affirmer explicitement que le geste aurait nécessairement causé sa mort.
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: et rien n’échappe au roi
  rationale: Formulation française idiomatique qui conserve l’idée qu’aucune affaire ni aucun fait ne peut rester caché au roi.
- source_word: תִּתְיַצֵּב מִנֶּגֶד
  choice: tu te serais tenu à l’écart
  rationale: Le verbe exprime le fait de se placer ou de rester en retrait, sans venir en aide. Cette traduction préserve le reproche adressé à Joab sans surinterpréter son action.
theological_decisions:
- issue: Nature exacte de l’acte hypothétique contre Absalom
  choice: agir traîtreusement au péril de sa vie
  alternative: porter atteinte à sa vie par traîtrise
  rationale: Le texte permet une nuance entre déloyauté envers la vie d’Absalom et atteinte directe à celle-ci. La formulation retenue conserve cette tension et évite de préciser au-delà de l’hébreu.
translation_notes:
  register: Français moderne, digne et oralement fluide. La phrase hypothétique garde son mouvement argumentatif, et l’incise sur la connaissance du roi est marquée par des tirets.
