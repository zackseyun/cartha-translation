base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: fr
  text: Ils prirent Absalom et le jetèrent dans la forêt, dans la grande fosse. Ils dressèrent au-dessus de lui un très grand tas de pierres. Tout Israël s’enfuit, chacun vers sa tente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « chacun vers sa tente » signifie que tous se dispersèrent pour rentrer chez eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils prirent
  rationale: Le verbe לקח a ici son sens narratif courant « prendre » ; rien n’impose une idée plus forte comme « saisir ».
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: le jetèrent
  rationale: שלך exprime ici l’action brutale de jeter le corps ; « jeter » est direct, naturel et conserve l’indignité de la scène.
- source_word: בַיַּעַר אֶל הַפַּחַת הַגָּדוֹל
  choice: dans la grande fosse, dans la forêt
  rationale: פחת désigne une fosse ou une excavation, tandis que יער désigne la forêt. La formulation française clarifie le rapport spatial sans modifier le sens.
- source_word: וַיַּצִּבוּ עָלָיו
  choice: Ils élevèrent sur lui
  rationale: Le verbe יצב, avec le tas de pierres pour complément, évoque sa mise en place au-dessus du corps. « Élever » restitue naturellement cette construction.
- source_word: גַּל אֲבָנִים גָּדוֹל מְאֹד
  choice: un très grand tas de pierres
  rationale: גל אבנים est littéralement un tas ou amas de pierres ; « très grand » rend l’intensification produite par מְאֹד.
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  choice: Puis tout Israël s’enfuit
  rationale: Le nom collectif « tout Israël » est conservé. נוס signifie normalement « fuir » ; « puis » assure ici un enchaînement narratif naturel.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: chacun vers sa tente
  rationale: « Chacun » restitue la valeur distributive de אִישׁ sans lourdeur en français. « Vers sa tente » conserve l’image hébraïque, tout en laissant la note expliciter sa valeur idiomatique.
theological_decisions:
- issue: Portée collective de וְכָל יִשְׂרָאֵל
  choice: tout Israël
  alternative: tous les Israélites
  rationale: Le texte emploie le nom collectif national. La traduction le maintient sans préciser au-delà du contexte quel camp est ainsi désigné.
- issue: Expression distributive masculine אִישׁ לְאֹהָלוֹ
  choice: chacun vers sa tente
  alternative: chaque homme vers sa tente
  rationale: En français moderne, « chacun » rend exactement la distribution individuelle sans imposer une insistance de genre étrangère à la fonction idiomatique de la formule.
- issue: Sens littéral ou idiomatique de לְאֹהָלוֹ
  choice: vers sa tente
  alternative: chez soi
  rationale: Le texte principal conserve l’image concrète de la tente. La note signale que la formule peut désigner plus largement le retour de chacun chez soi.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en évitant les tournures archaïques. La répétition de « dans » distingue clairement la fosse du cadre forestier.
