base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: fr
  text: 'Ahimaats, fils de Tsadok, dit encore à Joab : « Quoi qu’il arrive[a], laisse-moi, je t’en prie, courir moi aussi à la suite du Koushite. » Joab répondit : « Pourquoi veux-tu courir, mon fils, puisque tu n’as aucune nouvelle qui te vaudra une récompense[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Advienne que pourra. »'
    reason: lexical_alternative
  - marker: b
    text: 'La proposition hébraïque est difficile. On peut aussi comprendre : « tu n’as aucune nouvelle qui sera bien accueillie » ou « tu ne recevras pas de récompense pour la nouvelle ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: insista encore
  rationale: L’expression signifie littéralement qu’Ahimaats « ajouta encore » à parler. Dans le contexte d’une demande répétée, « insista encore » exprime naturellement la reprise pressante de sa requête.
- source_word: וִיהִי מָה
  choice: Quoi qu’il arrive
  rationale: Cette formule idiomatique marque la détermination d’Ahimaats indépendamment des conséquences. La traduction retenue est courante en français moderne et ne précise pas quelles conséquences sont envisagées.
- source_word: אָרֻצָה נָּא
  choice: laisse-moi, je t’en prie, courir
  rationale: Le cohortatif accompagné de נָא exprime une demande volontaire, polie mais insistante. Cette tournure française en restitue la force sans raideur.
- source_word: גַם אֲנִי
  choice: moi aussi
  rationale: L’expression souligne qu’Ahimaats veut courir en plus du messager déjà envoyé.
- source_word: הַכּוּשִׁי
  choice: le Koushite
  rationale: « Koushite » transpose directement l’ethnonyme lié à Koush et évite de l’identifier de façon anachronique à un Éthiopien au sens moderne.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: Pourquoi veux-tu courir
  rationale: La question exprime l’objection étonnée de Joab. Cette formulation idiomatique en français rend l’intention du tour hébreu sans reproduire maladroitement son démonstratif.
- source_word: בְּנִי
  choice: mon fils
  rationale: Cette adresse conserve le ton personnel, possiblement affectueux ou condescendant, sans supposer une filiation littérale.
- source_word: וּלְכָה אֵין בְּשׂוֹרָה מֹצֵאת
  choice: puisque tu n’as aucune nouvelle qui te vaudra une récompense
  rationale: La proposition hébraïque est elliptique et difficile. Dans le contexte, elle indique vraisemblablement qu’Ahimaats ne possède pas de nouvelle dont la transmission lui procurera un résultat favorable, notamment une récompense.
theological_decisions:
- issue: Portée de la proposition finale difficile
  choice: La traduction principale évoque une récompense que la nouvelle ne vaudra pas au messager.
  alternative: « tu n’as aucune nouvelle qui sera bien accueillie » ou « cette nouvelle ne te rapportera rien »
  rationale: L’hébreu permet plusieurs manières de comprendre le résultat favorable absent. La note maintient cette incertitude au lieu de présenter l’interprétation économique comme certaine.
translation_notes:
  register: Français international moderne, naturel et digne. « Ahimaats », « Tsadok » et « Koushite » suivent des translittérations françaises usuelles. Le dialogue conserve l’insistance d’Ahimaats et le ton personnel de Joab, tandis qu’une note signale explicitement l’incertitude de la dernière proposition.
