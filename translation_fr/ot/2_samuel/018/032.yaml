base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: fr
  text: 'Le roi demanda au Koushite : « Le jeune Absalom va-t-il bien[a] ? » Le Koushite répondit : « Que les ennemis de mon seigneur le roi et tous ceux qui se dressent contre toi pour te faire du mal[b] soient comme ce jeune homme ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Le jeune Absalom est-il sain et sauf ? » L’hébreu emploie le mot shalom, qui désigne plus largement la paix, le bien-être ou la sécurité.'
    reason: lexical_alternative
  - marker: b
    text: 'Le Koushite répond indirectement : ses paroles laissent entendre qu’Absalom a subi le sort réservé aux ennemis du roi, sans annoncer explicitement sa mort.'
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: le Koushite
  rationale: Le gentilé désigne un homme originaire de Koush. « Koushite » conserve cette indication géographique sans l’assimiler trop précisément à une identité ethnique moderne.
- source_word: הֲשָׁלוֹם לַנַּעַר לְאַבְשָׁלוֹם
  choice: Le jeune Absalom va-t-il bien ?
  rationale: שָׁלוֹם porte ici sur l’état, le bien-être ou la sécurité d’Absalom. La formulation française est naturelle tout en gardant un sens plus large que la seule survie.
- source_word: לַנַּעַר / כַנַּעַר
  choice: le jeune Absalom / ce jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Absalom étant adulte, « jeune homme » convient mieux que « garçon » ; la première occurrence est allégée en français par « le jeune Absalom ».
- source_word: יִהְיוּ כַנַּעַר
  choice: qu’ils soient comme ce jeune homme
  rationale: Le jussif exprime un souhait imprécatoire. Cette tournure conserve aussi la réponse indirecte du messager, sans expliciter brutalement la mort d’Absalom.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: les ennemis de mon seigneur le roi
  rationale: Cette formulation maintient l’adresse respectueuse et solennelle de la cour royale.
- source_word: קָמוּ עָלֶיךָ לְרָעָה
  choice: qui se dressent contre toi pour te faire du mal
  rationale: קום על exprime une opposition hostile ou une révolte, et לְרָעָה indique une intention nuisible. La traduction française rend clairement les deux éléments.
- source_word: וַיֹּאמֶר
  choice: demanda / répondit
  rationale: Le verbe hébreu signifie littéralement « dit ». Dans ce dialogue, les verbes français « demanda » et « répondit » rendent naturellement la fonction de chaque prise de parole sans en modifier le contenu.
theological_decisions:
- issue: La réponse indirecte concernant la mort d’Absalom
  choice: 'Conserver l’allusion : « soient comme ce jeune homme »'
  alternative: Expliciter qu’Absalom est mort
  rationale: Le texte hébreu ne déclare pas directement la mort d’Absalom dans cette réplique. Il formule une imprécation qui permet au roi de comprendre son sort ; expliciter davantage supprimerait cette tension narrative.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste solennel sans archaïsmes. « Koushite » préserve le gentilé hébreu, et la formulation finale maintient l’indirection rhétorique de l’original.
