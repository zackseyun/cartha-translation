  text: וַ/יַּרְא֙ אִ֣ישׁ אֶחָ֔ד וַ/יַּגֵּ֖ד לְ/יוֹאָ֑ב וַ/יֹּ֗אמֶר הִנֵּה֙ רָאִ֣יתִי אֶת אַבְשָׁלֹ֔ם תָּל֖וּי בָּ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: fr
  text: 'Un homme le vit et en informa Joab. Il dit : « Regarde ! J’ai vu Absalom suspendu dans le térébinthe[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le chêne ». Le mot hébreu אֵלָה peut désigner un térébinthe et se traduit parfois plus généralement par « chêne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: Un homme
  rationale: En français narratif, « un homme » rend naturellement le singulier masculin et la valeur indéfinie de l’expression hébraïque, sans donner à אֶחָד une insistance absente du contexte.
- source_word: וַיַּרְא
  choice: le vit
  rationale: 'Le pronom « le » explicite sobrement l’objet sous-entendu du verbe : la situation d’Absalom décrite ensuite.'
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: le rapporta à Joab
  rationale: « Rapporta » convient au contexte d’un homme transmettant à son supérieur ce qu’il vient de voir et rend le verbe נגד plus précisément que le simple « dit ».
- source_word: הִנֵּה
  choice: Regarde !
  rationale: Cette interjection moderne conserve la fonction de הִנֵּה, qui attire vivement l’attention de l’interlocuteur, sans recourir à l’archaïque « voici » au début de cette déclaration.
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le passé composé est la forme française naturelle pour rapporter une observation récente dont le résultat importe dans la situation présente.
- source_word: תָּלוּי
  choice: suspendu
  rationale: Le participe passif décrit l’état d’Absalom. « Suspendu » évite de suggérer à tort une exécution par pendaison, tout en conservant l’image du texte.
- source_word: בָּאֵלָה
  choice: dans le térébinthe
  rationale: אֵלָה désigne probablement un térébinthe. La préposition « dans » convient à quelqu’un retenu au milieu des branches plutôt que simplement accroché au tronc.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la succession des actions en hébreu, tout en divisant la longue coordination pour une lecture française fluide. Le terme botanique précis « térébinthe » est conservé et expliqué en note.
