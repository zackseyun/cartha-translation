  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: fr
  text: Alors dix jeunes hommes, ceux qui portaient les armes de Joab, encerclèrent Absalom, le frappèrent et le tuèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: encerclèrent
  rationale: Le verbe סבב décrit ici le mouvement tactique par lequel les hommes se placent autour d’Absalom. « Encerclèrent » est naturel et précis en français.
- source_word: עֲשָׂרָה נְעָרִים
  choice: dix jeunes hommes
  rationale: נְעָרִים désigne ici des hommes jeunes affectés au service militaire de Joab, et non des enfants. La traduction conserve ce sens sans préciser indûment leur rang.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: ceux qui portaient les armes de Joab
  rationale: L’expression signifie littéralement « ceux qui portaient l’équipement ou les armes de Joab ». Cette formulation française évite le possible contresens de « porte-armure » et ne réduit pas nécessairement les dix hommes à un office technique particulier.
- source_word: וַיַּכּוּ
  choice: le frappèrent
  rationale: Le verbe נכה exprime ici l’action physique de porter des coups. « Frappèrent » en conserve la portée sans employer un terme archaïque.
- source_word: וַיְמִיתֻהוּ
  choice: le tuèrent
  rationale: À la forme causative, מות signifie faire mourir, donc tuer. La traduction directe respecte la conclusion explicite de la séquence.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: La forme française traditionnelle et courante du nom biblique est conservée.
