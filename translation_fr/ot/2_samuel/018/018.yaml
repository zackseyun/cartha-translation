base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: fr
  text: 'Absalom avait pris et dressé pour lui-même, de son vivant, une stèle qui se trouve dans la vallée du Roi, car il disait : « Je n’ai pas de fils pour perpétuer le souvenir de mon nom. » Il donna son propre nom à la stèle, et on l’appelle encore aujourd’hui « monument d’Absalom »[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « main d’Absalom ». Ici, le mot « main » désigne un monument commémoratif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לוֹ
  choice: avait fait ériger pour lui-même
  rationale: L’expression décrit l’initiative d’Absalom et l’érection de la stèle. Cette formulation française naturelle rend l’ensemble verbal sans l’étrangeté de « prendre une stèle et la dresser ».
- source_word: בְחַיּו
  choice: de son vivant
  rationale: Expression française concise et idiomatique correspondant à l’action accomplie pendant la vie d’Absalom.
- source_word: מַצֶּבֶת
  choice: stèle
  rationale: Le terme désigne une pierre dressée, ici à fonction commémorative. « Stèle » conserve cette image concrète.
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: dans la vallée du Roi
  rationale: Traduction directe et naturelle du nom de lieu hébreu.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: pour perpétuer le souvenir de mon nom
  rationale: 'Rend le but exprimé par l’hébreu : faire en sorte que son nom demeure dans la mémoire.'
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: Il donna donc son propre nom à la stèle
  rationale: Restitue clairement l’idiome hébreu selon lequel Absalom nomme la stèle d’après lui-même.
- source_word: וַיִּקָּרֵא לָהּ
  choice: on l’appelle encore aujourd’hui
  rationale: Le tour impersonnel français traduit naturellement le passif hébreu et, avec « encore aujourd’hui », souligne la continuité du nom.
- source_word: יַד אַבְשָׁלוֹם
  choice: monument d’Absalom
  rationale: Dans ce contexte, יָד (« main » au sens premier) désigne idiomatiquement un monument commémoratif. Le sens littéral inhabituel est signalé en note.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: encore aujourd’hui
  rationale: Formule française courante exprimant que cette appellation subsistait au moment de la rédaction.
