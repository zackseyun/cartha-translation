base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: fr
  text: 'Mais il dit : « Quoi qu’il arrive, laisse-moi courir ! »[a] Joab lui dit : « Cours ! » Alors Ahimaas courut par la route de la plaine[b] et dépassa le Koushite[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Advienne que pourra, je courrai. » L’expression hébraïque est idiomatique et souligne qu’Ahimaas tient à courir quoi qu’il arrive.'
    reason: alternative_reading
  - marker: b
    text: La « plaine » désigne probablement la plaine du Jourdain, mais l’hébreu ne précise pas davantage le lieu.
    reason: cultural_note
  - marker: c
    text: 'Ou : « devança le Koushite » ; dans ce contexte, le verbe hébreu signifie qu’Ahimaas l’a rattrapé puis est passé devant lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: 'Mais il insista : « Quoi qu’il arrive, laisse-moi courir ! »'
  rationale: L’expression hébraïque est idiomatique et, dans ce dialogue, traduit l’insistance d’Ahimaas pour obtenir la permission de courir malgré les risques ou l’issue. Cette formulation française conserve la valeur concessive et la force volitive sans transformer la phrase en simple déclaration.
- source_word: רוּץ
  choice: Cours !
  rationale: L’impératif direct de רוץ est rendu naturellement et sans ajout.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: par la route de la plaine
  rationale: דֶּרֶךְ désigne une route ou un chemin, tandis que הַכִּכָּר désigne ici la plaine, probablement celle du Jourdain. Le texte principal conserve toutefois la désignation générale de l’hébreu.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: et dépassa le Koushite
  rationale: Dans le contexte d’une course, עבר suivi d’un complément d’objet indique qu’Ahimaas passe devant le messager koushite, donc le dépasse. « Dépassa » exprime clairement ce mouvement sans affirmer davantage que le texte.
- source_word: הַכּוּשִׁי
  choice: le Koushite
  rationale: Le terme désigne un homme originaire de Koush. « Koushite » préserve cette désignation ethnique et géographique ancienne, plutôt que de l’assimiler au terme moderne « Éthiopien ».
- source_word: אֲחִימַעַץ
  choice: Ahimaas
  rationale: Forme française lisible du nom propre hébreu, conforme à une translittération usuelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste vif et naturel. « Joab » explicite le référent du pronom hébreu afin d’éviter une ambiguïté artificielle en français. Les désignations anciennes « Ahimaas » et « Koushite » sont conservées sous une forme accessible.
