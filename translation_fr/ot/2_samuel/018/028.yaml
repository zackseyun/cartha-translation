source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אֲחִימַ֗עַץ וַ/יֹּ֤אמֶר אֶל הַ/מֶּ֨לֶךְ֙ שָׁל֔וֹם וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ לְ/אַפָּ֖י/ו אָ֑רְצָ/ה וַ/יֹּ֗אמֶר בָּרוּךְ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֤ר סִגַּר֙ אֶת הָ֣/אֲנָשִׁ֔ים אֲשֶׁר נָשְׂא֥וּ אֶת יָדָ֖/ם בַּֽ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: fr
  text: 'Ahimaats appela le roi : « Paix[a] ! » Puis il se prosterna devant le roi, le visage contre terre, et dit : « Béni soit Yahweh, ton Dieu, qui a livré[b] les hommes qui avaient levé la main contre mon seigneur le roi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout va bien ! » Ici, le mot hébreu shalom peut annoncer que la situation est bonne ou que les nouvelles sont favorables, et pas seulement servir de salutation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a remis entre les mains ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: lança
  rationale: Dans cette scène de messager, le verbe indique qu’Ahimaats élève la voix pour s’adresser au roi. « Lança au roi » est naturel en français et garde la vivacité narrative.
- source_word: שָׁלוֹם
  choice: Paix !
  rationale: Le mot peut être une salutation, mais, dans le contexte d’un rapport militaire, il peut aussi annoncer que tout va bien ou que les nouvelles sont bonnes. « Paix ! » conserve sa brièveté et son ambiguïté.
- source_word: וַיִּשְׁתַּחוּ
  choice: il se prosterna
  rationale: Le verbe décrit ici un geste corporel d’hommage, explicité par la mention du visage contre terre. « Se prosterner » est précis, courant et digne.
- source_word: לְאַפָּיו אָרְצָה
  choice: le visage contre terre
  rationale: Cette expression décrit une prosternation complète. La formulation française est concrète et naturelle.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: Béni soit Yahweh, ton Dieu
  rationale: « Béni soit » restitue la formule doxologique hébraïque. Le tutoiement correspond à la deuxième personne singulière et convient au discours direct adressé au roi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: סִגַּר
  choice: a livré
  rationale: Dans ce contexte militaire, le verbe signifie remettre ou livrer quelqu’un au pouvoir d’un autre. « A livré » est idiomatique et laisse ouverte la nuance « a remis entre les mains ».
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le masculin pluriel désigne les adversaires précis impliqués dans la révolte. « Les hommes » reste proche du texte.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: avaient levé la main contre
  rationale: La formulation conserve l’image hébraïque d’un geste hostile ou rebelle sans la réduire au seul concept de rébellion.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: contre mon seigneur le roi
  rationale: Il s’agit d’une formule de déférence de cour. « Mon seigneur le roi » en conserve le registre sans suggérer la relation moderne évoquée par « mon maître ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: « Yahweh » représente le nom personnel dans le texte source et évite de le remplacer par un titre. Ce choix est traductionnel et n’ajoute aucune précision doctrinale.
- issue: Portée de סִגַּר dans l’issue de la bataille
  choice: a livré
  alternative: a remis entre les mains / a enfermé
  rationale: Le contexte favorise l’idée que Dieu a livré les adversaires au pouvoir du camp royal. La traduction n’explicite ni leur sort individuel ni un mécanisme théologique absent du verset.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant les répétitions de « roi », la posture concrète d’Ahimaats et l’image de la main levée. Le nom Ahimaats suit une graphie française usuelle.
