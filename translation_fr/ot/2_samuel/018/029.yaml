  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ שָׁל֥וֹם לַ/נַּ֖עַר לְ/אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר אֲחִימַ֡עַץ רָאִיתִי֩ הֶ/הָמ֨וֹן הַ/גָּד֜וֹל לִ֠/שְׁלֹחַ אֶת עֶ֨בֶד הַ/מֶּ֤לֶךְ יוֹאָב֙ וְ/אֶת עַבְדֶּ֔/ךָ וְ/לֹ֥א יָדַ֖עְתִּי מָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: fr
  text: 'Le roi demanda : « Le jeune homme Absalom va-t-il bien ? » Ahimaats répondit : « J’ai vu une grande agitation[a] quand Joab a envoyé le serviteur du roi et ton serviteur, mais je n’ai pas su de quoi il s’agissait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande foule » ou « un grand tumulte » ; le terme hébreu peut désigner une foule, du bruit ou une agitation tumultueuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: va-t-il bien ?
  rationale: Dans cette question, שָׁלוֹם porte sur le bien-être d’Absalom. Cette formulation française naturelle conserve la portée générale du terme sans la réduire à la seule sécurité physique.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: le jeune homme Absalom
  rationale: נַעַר désigne ici un jeune homme. La formulation garde l’expression indirecte et chargée d’affection par laquelle David parle de son fils.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: une grande agitation
  rationale: הָמוֹן peut évoquer une foule, du bruit ou du tumulte. « Une grande agitation » rend bien l’idée d’un mouvement confus sans préciser au-delà de ce qu’Ahimaats affirme avoir perçu.
- source_word: לִשְׁלֹחַ
  choice: quand Joab a envoyé
  rationale: L’infinitif construit avec לְ reçoit ici une valeur circonstancielle que le français exprime naturellement par une proposition temporelle.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: le serviteur du roi
  rationale: עֶבֶד peut désigner un esclave ou un serviteur. Dans ce contexte de service royal officiel, « serviteur » convient sans accentuer un statut juridique qui n’est pas au premier plan.
- source_word: וְאֶת עַבְדֶּךָ
  choice: et ton serviteur
  rationale: La traduction conserve la formule de déférence par laquelle Ahimaats se désigne lui-même devant le roi.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: mais je n’ai pas su de quoi il s’agissait
  rationale: L’hébreu est elliptique, littéralement « je ne savais pas quoi ». La formulation française explicite seulement le complément implicite et reste naturelle.
