  to: 'Mais le peuple répondit : « Tu ne dois pas sortir. Car si nous prenons la fuite, ils ne feront pas attention à nous[a] ; et si la moitié d’entre nous meurt, ils ne feront pas attention à nous. Car maintenant, tu comptes autant que dix mille d’entre nous[b]. Il vaut donc mieux que tu nous viennes en aide depuis la ville[c]. »'
