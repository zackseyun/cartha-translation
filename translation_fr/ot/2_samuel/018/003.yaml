base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: fr
  text: 'Mais le peuple répondit : « Tu ne dois pas sortir. Car si nous prenons la fuite, ils ne feront pas attention à nous[a] ; et si la moitié d’entre nous meurt, ils ne feront pas attention à nous. Car maintenant, tu comptes autant que dix mille d’entre nous[b]. Il vaut donc mieux que tu nous viennes en aide depuis la ville[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ne dirigeront pas leur cœur vers nous », expression qui signifie ici qu’ils ne concentreront pas leur attention sur nous.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car maintenant tu es comme dix mille d’entre nous ».'
    reason: lexical_alternative
  - marker: c
    text: La dernière proposition signifie probablement que David doit rester dans la ville afin de pouvoir fournir du soutien ou des renforts en cas de besoin.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: Tu ne dois pas sortir avec nous
  rationale: L’imparfait hébreu nié exprime ici une interdiction ou une vive exhortation. « Tu ne dois pas » en restitue naturellement la force. « Avec nous » explicite dans ce contexte militaire le sens de « sortir » sans modifier l’action visée.
- source_word: כִּי אִם נֹס נָנוּס
  choice: Car si nous prenons la fuite
  rationale: La construction associant infinitif absolu et verbe conjugué donne du relief à l’action. L’expression française « prendre la fuite » transmet ce relief plus naturellement qu’un redoublement littéral.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: ils ne se soucieront pas de nous
  rationale: Littéralement, l’ennemi ne « placera pas son cœur vers nous ». Dans ce contexte, l’expression signifie qu’il n’accordera pas d’importance aux troupes en l’absence de David.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: et si la moitié d’entre nous meurt
  rationale: La traduction conserve le verbe simple « mourir » plutôt que d’introduire l’interprétation contextuelle « être tué ».
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: Car, à présent, tu comptes autant que dix mille d’entre nous
  rationale: La formulation exprime la valeur stratégique incomparable de David. « Compter autant que » reste proche de la comparaison hébraïque tout en étant idiomatique en français.
- source_word: וְעַתָּה טוֹב
  choice: Il vaut donc mieux maintenant
  rationale: טוֹב désigne ici la conduite préférable. « Il vaut mieux » rend clairement cette nuance comparative, tandis que « maintenant » conserve l’adverbe temporel.
- source_word: מֵעִיר לְעָזִיר
  choice: que tu sois prêt à nous porter secours depuis la ville
  rationale: La proposition présente David comme une source d’aide depuis la ville. « Être prêt à » explicite avec mesure la disponibilité militaire impliquée par le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’adresse directe au roi dans ce récit ancien. La répétition de « ils ne se soucieront pas de nous » et les deux indications temporelles sont conservées pour respecter la structure et l’insistance de l’hébreu.
