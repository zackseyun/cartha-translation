    rationale: Le texte hébreu interdit simplement à David de « sortir » ; le contexte permet de comprendre qu’il s’agit de sortir avec l’armée, mais cette précision n’est pas exprimée.
  - severity: medium
    issue: Ajout de « sois prêt à » dans la proposition finale
    rationale: Le terme difficile לְעָזִיר renvoie à l’aide/secours, mais n’énonce pas explicitement l’idée d’être prêt. Il vaut mieux conserver une formulation d’aide depuis la ville, avec une note signalant la portée probablement militaire.
  - severity: low
    issue: « Ne se soucieront pas de nous »
    rationale: Cette formulation peut évoquer l’absence de compassion, alors que l’idiome « mettre le cœur vers » désigne ici le fait de prêter attention ou de concentrer son intérêt sur eux.
