  text: וַ/יֹּ֧אמֶר ל֣/וֹ יוֹאָ֗ב לֹא֩ אִ֨ישׁ בְּשֹׂרָ֤ה אַתָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וּ/בִשַּׂרְתָּ֖ בְּ/י֣וֹם אַחֵ֑ר וְ/הַ/יּ֤וֹם הַ/זֶּה֙ לֹ֣א תְבַשֵּׂ֔ר כִּֽי על בֶּן הַ/מֶּ֖לֶךְ מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: fr
  text: 'Joab lui dit : « Ce n’est pas toi qui annonceras la nouvelle aujourd’hui[a]. Tu l’annonceras un autre jour, mais aujourd’hui tu ne l’annonceras pas, car le fils du roi est mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ce n’est pas toi qui porteras une bonne nouvelle aujourd’hui ». Le terme hébreu peut désigner une nouvelle, souvent heureuse, mais il concerne ici la mort du fils du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: Ce n’est pas toi qui annonceras la nouvelle
  rationale: La tournure française exprime naturellement le rôle de porteur de nouvelle sans reproduire littéralement l’idiome hébreu « homme de nouvelle ». Le singulier « la nouvelle » convient à l’annonce précise attendue dans ce contexte.
- source_word: וּבִשַּׂרְתָּ
  choice: Tu l’annonceras
  rationale: Le parfait à valeur prospective, opposé à « aujourd’hui », indique qu’Ahimaats pourra remplir cette fonction une autre fois. Le futur français garde cette nuance sans ajouter explicitement une permission absente de la forme.
- source_word: תְבַשֵּׂר
  choice: tu ne l’annonceras pas
  rationale: L’imparfait hébreu nié prend ici une force prohibitive dans la parole de Joab. Le futur négatif français exprime naturellement cet ordre.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction dans un registre narratif digne et courant.
- source_word: בֶּן הַמֶּלֶךְ
  choice: le fils du roi
  rationale: Rend directement et naturellement la chaîne construite hébraïque.
- source_word: מֵת
  choice: est mort
  rationale: Préserve la formulation brève et l’état résultant exprimé par l’hébreu.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Équivalent idiomatique moderne de la locution répétée « ce jour-ci ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition du verbe « annoncer » reflète celle de la racine hébraïque בשׂר, tandis que le pronom « l’ » évite une lourdeur inutile.
