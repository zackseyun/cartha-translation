  text: וַ/תְּהִי שָׁ֧ם הַ/מִּלְחָמָ֛ה נפצית עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יֶּ֤רֶב הַ/יַּ֨עַר֙ לֶ/אֱכֹ֣ל בָּ/עָ֔ם מֵ/אֲשֶׁ֥ר אָכְלָ֛ה הַ/חֶ֖רֶב בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: fr
  text: Là, la bataille s’étendit sur toute la région[a], et, ce jour-là, la forêt dévora plus d’hommes que l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se dispersa sur toute la région ». Le participe hébreu peut insister sur la dispersion du combat à travers le territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: s’étendit
  rationale: Le participe niphal de פוץ exprime ici la dispersion de la bataille sur une vaste zone. « S’étendit » rend naturellement cette extension géographique en français.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: sur toute la région
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire où se déroule le combat, non la terre entière. « Sur toute la région » est idiomatique et conserve l’idée d’une large étendue.
- source_word: וַיֶּרֶב ... לֶאֱכֹל
  choice: dévora plus
  rationale: La construction avec רבה, l’infinitif « dévorer » et la comparaison introduite par מֵאֲשֶׁר indique que la forêt causa davantage de morts. Cette formulation préserve la métaphore et la force comparative.
- source_word: הַיַּעַר
  choice: la forêt
  rationale: יַעַר désigne une zone boisée; « la forêt » est le terme français courant et conserve la personnification du récit.
- source_word: בָּעָם
  choice: d’hommes
  rationale: Dans le contexte militaire, « d’hommes » exprime naturellement les personnes appartenant aux troupes, sans suggérer que tout le peuple serait concerné.
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  choice: que l’épée
  rationale: La comparaison est explicite. L’ellipse française évite une répétition lourde tout en maintenant la personnification de l’épée et le sens de « dévorer ».
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Formulation narrative française naturelle et précise pour la locution temporelle hébraïque.
