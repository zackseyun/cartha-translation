source:
  edition: WLC
  text: וַ/יִּפְקֹ֣ד דָּוִ֔ד אֶת הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ וַ/יָּ֣שֶׂם עֲלֵי/הֶ֔ם שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֥י מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/001.yaml
  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: fr
  text: David passa en revue les hommes qui étaient avec lui[a] et nomma à leur tête des chefs de milliers et des chefs de centaines[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dénombra » ou « inspecta » ; le verbe hébreu peut désigner une revue militaire, et pas seulement un comptage.
    reason: lexical_alternative
  - marker: b
    text: Les « milliers » et les « centaines » peuvent désigner des effectifs ou des unités militaires organisées selon ces nombres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: passa en revue
  rationale: Dans ce contexte militaire, פקד désigne le recensement ou l'inspection organisée des hommes, et non un simple dénombrement. « Passer en revue » exprime naturellement cette action en français.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: les hommes qui étaient avec lui
  rationale: עם signifie littéralement « peuple », mais désigne ici la force rassemblée auprès de David. « Les hommes » rend clairement le référent militaire sans aller jusqu'à « armée » ou « troupes », termes plus interprétatifs.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: nomma à leur tête
  rationale: La construction שׂים על indique que David établit des responsables sur eux. Cette formulation française actuelle exprime clairement la nomination et l'autorité.
- source_word: שָׂרֵי
  choice: chefs
  rationale: שׂר désigne un responsable investi d'autorité. « Chefs » convient au cadre militaire tout en préservant la portée assez large du terme hébreu.
- source_word: אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: des chefs de milliers et des chefs de centaines
  rationale: La traduction numérique conserve la formule militaire hébraïque et son parallélisme. Les nombres peuvent aussi évoquer des unités de cette importance, ambiguïté signalée en note.
theological_decisions: []
