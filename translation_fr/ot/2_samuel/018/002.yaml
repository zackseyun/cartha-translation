source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: fr
  text: 'David envoya les troupes : un tiers sous le commandement de Joab[a], un tiers sous celui d’Abishaï, fils de Tserouya et frère de Joab, et un tiers sous celui d’Ittaï le Guittite. Le roi dit aux troupes : « Moi aussi, je sortirai avec vous, c’est certain. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « dans la main de », expression qui signifie ici « sous l’autorité ou le commandement de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: envoya
  rationale: Dans ce contexte militaire, le verbe désigne l’envoi des forces au combat. « Envoya » est naturel en français et suffisamment précis avec le complément « les troupes ».
- source_word: הָעָם
  choice: les troupes
  rationale: Littéralement « le peuple », mais le contexte immédiat désigne les combattants de David. « Les troupes » rend clairement ce référent militaire.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: un tiers
  rationale: La forme répétée désigne chacune des trois divisions de l’armée. « Un tiers » conserve clairement cette répartition tripartite.
- source_word: בְּיַד
  choice: sous le commandement de
  rationale: L’expression signifie littéralement « dans la main de » et indique ici l’autorité militaire. « Sous le commandement de » explicite naturellement l’idiome en français.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abishaï, fils de Tserouya et frère de Joab
  rationale: Cette formulation conserve les deux indications familiales dans un français fluide et non ambigu.
- source_word: אִתַּי הַגִּתִּי
  choice: Ittaï le Guittite
  rationale: Translittération française usuelle du nom et du gentilé, qui identifie Ittaï comme originaire de Gath.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Le roi dit
  rationale: Le waw narratif assure la succession du récit sans exiger la conservation mécanique de « et » en français.
- source_word: יָצֹא אֵצֵא
  choice: je sortirai … c’est certain
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. L’ajout de « c’est certain » en fin de proposition restitue cette insistance de manière naturelle.
- source_word: גַּם אֲנִי
  choice: Moi aussi
  rationale: 'La locution associe l’idée d’adjonction portée par גַּם à l’insistance du pronom explicite אֲנִי : le roi affirme qu’il accompagnera lui aussi les troupes.'
- source_word: עִמָּכֶם
  choice: avec vous
  rationale: Traduction directe de la préposition avec suffixe, exprimant l’accompagnement au combat.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire militaire est explicite sans être technique. La répétition hébraïque de בְּיַד est rendue par « sous celui de » après sa première explicitation afin d’éviter une lourdeur, tandis que l’emphase finale est conservée.
