source:
  edition: WLC
  text: וַ/יִּקָּרֵא֙ אַבְשָׁל֔וֹם לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וְ/אַבְשָׁל֞וֹם רֹכֵ֣ב עַל הַ/פֶּ֗רֶד וַ/יָּבֹ֣א הַ/פֶּ֡רֶד תַּ֣חַת שׂוֹבֶךְ֩ הָ/אֵלָ֨ה הַ/גְּדוֹלָ֜ה וַ/יֶּחֱזַ֧ק רֹאשׁ֣/וֹ בָ/אֵלָ֗ה וַ/יֻּתַּן֙ בֵּ֤ין הַ/שָּׁמַ֨יִם֙ וּ/בֵ֣ין הָ/אָ֔רֶץ וְ/הַ/פֶּ֥רֶד אֲשֶׁר תַּחְתָּ֖י/ו עָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: fr
  text: Absalom se trouva face aux serviteurs de David. Il montait le mulet, et celui-ci passa sous les branches enchevêtrées d’un grand térébinthe[a]. La tête d’Absalom resta prise dans le térébinthe, et il demeura suspendu entre ciel et terre, tandis que le mulet qui était sous lui continuait son chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un grand chêne ». Le mot hébreu אֵלָה peut aussi être rendu de façon plus générale par « grand arbre », mais « térébinthe » est ici le choix lexical le plus précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי
  choice: se trouva face à
  rationale: Le niphal de קרא avec לִפְנֵי exprime ici une rencontre fortuite plutôt qu’intentionnelle. « Se trouva face à » restitue naturellement ce caractère incident en français.
- source_word: עַבְדֵי דָוִד
  choice: les serviteurs de David
  rationale: עֲבָדִים peut désigner les serviteurs, les hommes ou les subordonnés du roi. « Serviteurs » conserve la forme lexicale sans imposer ici la nuance d’esclavage.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: Il montait le mulet
  rationale: La tournure rend naturellement le participe hébreu et conserve l’article défini de הַפֶּרֶד.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: sous les branches enchevêtrées d’un grand térébinthe
  rationale: שׂוֹבֶךְ évoque une masse dense ou entrelacée de branches. אֵלָה désigne probablement le térébinthe, choix plus précis qu’un terme générique, tandis que « grand » rend גְּדוֹלָה.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: La tête d’Absalom resta prise dans le térébinthe
  rationale: Littéralement, sa tête « tint fermement » ou « fut retenue » dans l’arbre. « Resta prise » exprime clairement le blocage involontaire sans préciser, comme le fait la tradition populaire, qu’il s’agissait de ses cheveux.
- source_word: וַיֻּתַּן
  choice: il demeura suspendu
  rationale: Le passif de נתן signifie littéralement « il fut placé/laissé ». Dans le contexte, il décrit l’état de suspension qui en résulte; « demeura suspendu » est idiomatique et fidèle à cet effet.
- source_word: בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: entre ciel et terre
  rationale: Cette expression française naturelle préserve la formule hébraïque et son ton narratif élevé.
- source_word: עָבָר
  choice: continuait son chemin
  rationale: Le verbe indique que le mulet poursuit son mouvement après qu’Absalom est retenu. Cette formulation est plus naturelle en français que « passa » répété.
theological_decisions:
- issue: Ce qui retient Absalom dans l’arbre
  choice: la tête d’Absalom resta prise
  alternative: ses cheveux restèrent pris
  rationale: Le texte hébreu dit explicitement רֹאשׁוֹ, « sa tête », et ne mentionne pas ses cheveux. La traduction ne complète donc pas le récit à partir d’une interprétation traditionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement restructurées pour éviter une accumulation lourde de coordinations, tout en maintenant la progression du texte hébreu. Le référent « Absalom » est répété afin d’éviter toute ambiguïté entre l’homme et le mulet.
