  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ סֹ֖ב הִתְיַצֵּ֣ב כֹּ֑ה וַ/יִּסֹּ֖ב וַֽ/יַּעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/030.yaml
  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: fr
  text: 'Le roi lui dit[a] : « Écarte-toi et tiens-toi ici. » Il s’écarta et se tint là.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tourne-toi et tiens-toi ici. » Le verbe hébreu désigne de manière générale l’action de tourner, mais, dans ce contexte, il signifie probablement se mettre de côté pour laisser la place au messager suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר introduit ici les paroles directes; « dit » est la formulation narrative naturelle en français.
- source_word: הַמֶּלֶךְ
  choice: Le roi
  rationale: Le nom défini désigne le roi déjà présent dans le récit.
- source_word: סֹב
  choice: Écarte-toi
  rationale: L’impératif de סבב exprime un mouvement de côté dans ce contexte, afin de laisser place au messager suivant. « Écarte-toi » est naturel sans préciser excessivement le mouvement.
- source_word: הִתְיַצֵּב
  choice: tiens-toi
  rationale: Le hitpael de יצב signifie se placer ou se tenir à un endroit déterminé; « tiens-toi » convient à un ordre direct.
- source_word: כֹּה
  choice: ici
  rationale: Dans cette consigne spatiale, l’adverbe indique l’endroit où l’homme doit se tenir.
- source_word: וַיִּסֹּב
  choice: Il s’écarta
  rationale: Cette traduction reprend le sens contextuel du même verbe que dans l’ordre précédent et maintient le lien lexical.
- source_word: וַיַּעֲמֹד
  choice: resta là
  rationale: עמד signifie littéralement « se tint » ou « resta debout ». En français, « resta là » rend naturellement l’exécution de l’ordre sans la répétition peu idiomatique de « se tenir ».
