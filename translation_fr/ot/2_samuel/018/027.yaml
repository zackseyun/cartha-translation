  text: וַ/יֹּ֨אמֶר֙ הַ/צֹּפֶ֔ה אֲנִ֤י רֹאֶה֙ אֶת מְרוּצַ֣ת הָ/רִאשׁ֔וֹן כִּ/מְרֻצַ֖ת אֲחִימַ֣עַץ בֶּן צָד֑וֹק וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אִֽישׁ ט֣וֹב זֶ֔ה וְ/אֶל בְּשׂוֹרָ֥ה טוֹבָ֖ה יָבֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: fr
  text: 'Le guetteur dit : « La course du premier est comme celle d’Ahimaats, fils de Tsadok. » Le roi dit : « C’est un homme de bien, et il arrive avec une bonne nouvelle[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il viendra avec une bonne nouvelle » ; le verbe hébreu peut aussi être compris au futur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: le guetteur
  rationale: Le participe substantivé désigne celui qui observe depuis son poste de garde. « Le guetteur » est naturel en français moderne et convient au cadre narratif.
- source_word: מְרוּצַת הָרִאשׁוֹן ... כִּמְרֻצַת
  choice: À sa façon de courir, le premier ressemble à
  rationale: 'Cette formulation idiomatique conserve l’idée centrale du nom hébreu « course » : le guetteur reconnaît le premier homme à sa manière de courir.'
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: Ahimaats, fils de Tsadok
  rationale: Les noms sont translittérés selon un usage français courant, et בֶּן est rendu explicitement par « fils de ».
- source_word: אִישׁ טוֹב זֶה
  choice: C’est un homme de bien
  rationale: L’expression rend naturellement le jugement positif porté sur l’homme, sans préciser au-delà du texte s’il vise surtout son caractère ou sa fiabilité.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: et il arrive avec une bonne nouvelle
  rationale: Cette traduction rend idiomatiquement le mouvement du messager porteur d’une annonce favorable. Le yiqtol peut avoir ici une valeur présente dans le dialogue immédiat, tout en permettant une lecture au futur signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure littérale « la course du premier est comme la course d’Ahimaats » a été rendue de façon plus naturelle sans perdre l’idée d’une identification par la manière de courir.
