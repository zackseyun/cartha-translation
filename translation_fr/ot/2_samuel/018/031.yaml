- from: 'Et voici que le Koushite[a] arriva. Le Koushite dit : « Que mon seigneur le roi reçoive la bonne nouvelle ! En effet, Yahweh t’a fait justice aujourd’hui en te délivrant du pouvoir de tous ceux qui se sont dressés contre toi. »[b]'
  to: 'Et voici que le Koushite[a] arriva. Le Koushite dit : « Que mon seigneur le roi reçoive la bonne nouvelle ! En effet, Yahweh t’a aujourd’hui rendu justice[b] en te délivrant du pouvoir de tous ceux qui se sont dressés contre toi. »'
