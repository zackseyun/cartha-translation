  text: וְ/הִנֵּ֥ה הַ/כּוּשִׁ֖י בָּ֑א וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִתְבַּשֵּׂר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי שְׁפָטְ/ךָ֤ יְהוָה֙ הַ/יּ֔וֹם מִ/יַּ֖ד כָּל הַ/קָּמִ֥ים עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: fr
  text: 'Et voici que le Koushite[a] arriva. Le Koushite dit : « Que mon seigneur le roi reçoive la bonne nouvelle ! En effet, Yahweh t’a aujourd’hui rendu justice[b] en te délivrant du pouvoir de tous ceux qui se sont dressés contre toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’homme de Koush ». Le terme hébreu désigne une personne originaire de Koush, région souvent associée à la Nubie au sud de l’Égypte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « En effet, Yahweh a aujourd’hui prononcé le jugement en ta faveur contre tous ceux qui se sont dressés contre toi. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la vivacité du marqueur narratif hébreu tout en employant une tournure naturelle en français moderne.
- source_word: הַכּוּשִׁי
  choice: le Koushite
  rationale: Rend l’ethnonyme hébreu avec son article, sans l’identifier de façon anachroniquement précise à un Éthiopien au sens moderne.
- source_word: יִתְבַּשֵּׂר
  choice: Que mon seigneur le roi reçoive la bonne nouvelle !
  rationale: Le hitpael à valeur jussive exprime ici le souhait solennel du messager que le roi accueille l’heureuse annonce.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Formule respectueuse de cour, naturelle et digne en français, sans connotation divine dans ce contexte.
- source_word: שְׁפָטְךָ
  choice: t’a fait justice
  rationale: 'Exprime le sens judiciaire favorable du verbe : Yahweh a statué en faveur de David et l’a ainsi délivré de ses adversaires.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: מִיַּד
  choice: en te délivrant du pouvoir de
  rationale: Restitue le sens de l’expression hébraïque « de la main de » dans une formulation française claire ; la « main » représente ici le pouvoir hostile.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: tous ceux qui se sont dressés contre toi
  rationale: Préserve l’image verbale du soulèvement hostile, particulièrement appropriée au contexte de la rébellion.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; la transcription « Yahweh » préserve le caractère personnel du nom divin.
- issue: Portée judiciaire de שְׁפָטְךָ
  choice: t’a fait justice
  alternative: a prononcé le jugement en ta faveur
  rationale: La formulation retenue maintient la dimension judiciaire tout en exprimant naturellement en français que le jugement de Yahweh est favorable au roi ; la note conserve une autre formulation possible.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours conserve la déférence de la cour royale. « Et voici que » marque l’arrivée soudaine du messager ; « fait justice » préserve la tension entre jugement judiciaire et délivrance sans réduire le verbe à une simple victoire militaire.
