  naturalness: Le français est globalement naturel et de registre narratif soutenu. « vous donner cet ordre, à toi » mêle toutefois improprement le pluriel et le singulier. « Protégez-moi le jeune homme Absalom » rend plus idiomatiquement le datif d'intérêt que « Protégez pour moi ».
  terminology: Les noms Joab, Abishaï, Ittaï et Absalom sont appropriés. « Le jeune homme Absalom » rend plus directement נער que « le jeune Absalom », tout en conservant la note sur la difficulté du texte massorétique.
