  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: fr
  text: 'Mais l’homme dit à Joab : « Même si je pesais mille pièces d’argent sur mes paumes[a], je ne porterais pas la main sur le fils du roi. En effet, nous avons entendu le roi vous donner cet ordre, à vous, Joab, Abishaï et Ittaï : “Protégez-moi le jeune homme Absalom[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pesant mille d’argent sur mes paumes ». Il s’agit de recevoir une forte somme d’argent pesée.'
    reason: lexical_alternative
  - marker: b
    text: 'La fin du texte hébreu est difficile; littéralement, elle comporte « Protégez מי le jeune homme, Absalom ». Beaucoup comprennent, d’après 18.5 : « Protégez-moi le jeune homme Absalom. »'
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: Même si l’on pesait pour moi mille pièces d’argent dans mes mains
  rationale: La formulation conserve l’image ancienne de l’argent pesé et placé dans les mains comme paiement. « Pièces d’argent » évite de préciser une unité que l’hébreu ne nomme pas explicitement.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: je ne porterais pas la main sur
  rationale: Cette expression française naturelle garde l’image de la main tout en exprimant clairement une action violente contre quelqu’un.
- source_word: בֶּן הַמֶּלֶךְ
  choice: le fils du roi
  rationale: Traduction directe et idiomatique du groupe construit hébreu.
- source_word: בְאָזְנֵינוּ
  choice: nous avons entendu
  rationale: Cette formulation rend naturellement l’idiome hébreu « à nos oreilles » et souligne que les hommes ont personnellement entendu l’ordre.
- source_word: צִוָּה
  choice: donner cet ordre
  rationale: Le verbe exprime un commandement autoritaire du roi; cette tournure s’intègre naturellement à la syntaxe française.
- source_word: שִׁמְרוּ
  choice: Protégez
  rationale: Dans ce contexte, le verbe signifie veiller à la sécurité d’Absalom plutôt que simplement le surveiller.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: pour moi le jeune Absalom
  rationale: Le texte massorétique est difficile. Cette traduction suit le sens contextuel de 2 Samuel 18.5 tout en signalant l’incertitude en note.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: L’article défini désigne l’homme précis déjà présent dans la scène.
- source_word: וְלֹא אָנֹכִי
  choice: Même si… je ne… pas
  rationale: La construction concessive et le pronom emphatique sont rendus par un refus conditionnel fortement marqué et naturel en français.
theological_decisions:
- issue: La teneur exacte de l’ordre royal à la fin du verset
  choice: Protégez pour moi le jeune Absalom
  alternative: Protégez le jeune Absalom / Qui est avec le jeune Absalom ?
  rationale: La leçon massorétique est grammaticalement difficile; le contexte immédiat, notamment 18.5, favorise l’idée que le roi demande qu’Absalom soit épargné pour lui. L’incertitude textuelle reste explicitement signalée.
translation_notes:
  register: Français international moderne, digne et narratif. Les noms propres suivent les formes françaises courantes « Joab », « Abishaï », « Ittaï » et « Absalom ». La syntaxe privilégie la clarté orale sans effacer l’image hébraïque du paiement pesé ni la difficulté textuelle finale.
