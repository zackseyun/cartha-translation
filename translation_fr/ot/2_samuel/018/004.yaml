base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: fr
  text: 'Le roi leur dit : « Je ferai ce qui vous paraît bon. » Puis le roi se tint près de la porte, et tout le peuple sortit par centaines et par milliers.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire en formations organisées par centaines et par milliers.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: ce qui vous paraît bon
  rationale: L’expression hébraïque signifie littéralement « ce qui sera bon à vos yeux » et exprime ici le jugement ou l’approbation. La formulation française conserve cette nuance sans être artificielle.
- source_word: אֶעֱשֶׂה
  choice: Je ferai
  rationale: Rendu direct du verbe עשה à l’inaccompli, exprimant ici l’engagement du roi à suivre leur avis.
- source_word: אֶל יַד הַשַּׁעַר
  choice: à côté de la porte de la ville
  rationale: Littéralement « à la main de la porte », locution indiquant une position juste à côté. « De la ville » explicite le sens contextuel de שַׁעַר sans suggérer une simple porte de bâtiment.
- source_word: וְכָל הָעָם
  choice: tout le peuple
  rationale: Même si le contexte est militaire, l’hébreu dit « tout le peuple ». Ce choix respecte le terme source, tandis que la suite indique son organisation en unités.
- source_word: יָצְאוּ
  choice: sortait
  rationale: יצא signifie simplement « sortir ». L’imparfait, associé à « tandis que », présente le défilé des troupes devant le roi sans introduire l’idée plus précise de marcher, absente du verbe.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: par centaines et par milliers
  rationale: La formulation reproduit la structure numérique hébraïque et désigne, dans ce contexte, une organisation en unités militaires.
theological_decisions: []
