source:
  edition: WLC
  text: וַ/אֲחִימַ֤עַץ בֶּן צָדוֹק֙ אָמַ֔ר אָר֣וּצָה נָּ֔א וַ/אֲבַשְּׂרָ֖ה אֶת הַ/מֶּ֑לֶךְ כִּי שְׁפָט֥/וֹ יְהוָ֖ה מִ/יַּ֥ד אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: fr
  text: 'Alors Ahimaats, fils de Tsadok, dit : « Laisse-moi courir, je te prie, pour porter la nouvelle au roi[a] : Yahweh lui a rendu justice en le délivrant de ses ennemis[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « annoncer la bonne nouvelle au roi » : le verbe hébreu peut désigner l''annonce d''une nouvelle favorable.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « Yahweh l’a jugé de la main de ses ennemis »; le sens est qu’il a statué en sa faveur et l’a soustrait à leur pouvoir.
    reason: lexical_and_syntactic_clarification
lexical_decisions:
- source_word: וַאֲחִימַעַץ בֶּן־צָדוֹק אָמַר
  choice: Alors Ahimaats, fils de Tsadok, dit
  rationale: Le waw fait progresser le récit; « Alors » rend naturellement cette succession. Les noms sont translittérés selon des formes françaises usuelles.
- source_word: אָרוּצָה נָּא
  choice: Laisse-moi courir, je te prie
  rationale: Le cohortatif exprime la volonté ou la demande, et נָא en atténue poliment la force.
- source_word: וַאֲבַשְּׂרָה אֶת־הַמֶּלֶךְ
  choice: pour porter la nouvelle au roi
  rationale: Le piel de בשׂר désigne l'annonce d'une nouvelle, souvent favorable. La formulation reste naturelle sans donner au verbe un sens technique ultérieur.
- source_word: כִּי
  choice: ':'
  rationale: Dans ce discours, la proposition peut préciser le contenu de la nouvelle aussi bien que son motif. Les deux-points conservent cette souplesse en français.
- source_word: שְׁפָטוֹ יְהוָה
  choice: Yahweh lui a rendu justice
  rationale: שׁפט avec un bénéficiaire exprime ici une décision ou une intervention judiciaire en faveur du roi; cette traduction garde la dimension de justification judiciaire.
- source_word: מִיַּד אֹיְבָיו
  choice: en le délivrant de ses ennemis
  rationale: Littéralement « de la main de ses ennemis »; la formulation explicite en français l'idée d'être soustrait à leur pouvoir tout en indiquant comment justice lui a été rendue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée judiciaire et salvatrice de שְׁפָטוֹ ... מִיַּד
  choice: lui a rendu justice en le délivrant
  alternative: l’a délivré / a jugé en sa faveur
  rationale: La formulation maintient ensemble la justification judiciaire exprimée par שׁפט et la délivrance hors du pouvoir des ennemis, sans réduire l'une à l'autre.
translation_notes:
  register: Français international moderne, digne et narratif. « Je te prie » conserve la politesse de נָא sans archaïsme marqué. La tournure principale privilégie une expression idiomatique tout en préservant la tension entre justice rendue et délivrance.
