base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: fr
  text: 'Alors le guetteur cria et en informa le roi. Le roi dit : « S’il est seul, il a une nouvelle à annoncer. » Et il continuait de s’approcher.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: la sentinelle
  rationale: Le participe substantivé désigne l’homme posté pour surveiller. « La sentinelle » est naturel dans ce contexte militaire et convient à la scène de guet.
- source_word: וַיִּקְרָא
  choice: cria
  rationale: Le verbe indique ici que la sentinelle élève la voix pour annoncer ce qu’elle voit. « Cria » est concis et naturel.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: informa le roi
  rationale: Le hiphil de נגד signifie annoncer ou rapporter une information. « Informa le roi » exprime clairement cette fonction sans lourdeur.
- source_word: אִם לְבַדּוֹ
  choice: S’il est seul
  rationale: Cette traduction reproduit directement la condition solitaire du coureur sans ajouter au texte un verbe de mouvement.
- source_word: בְּשׂוֹרָה בְּפִיו
  choice: il apporte une bonne nouvelle
  rationale: בְּשׂוֹרָה peut désigner une nouvelle et prend souvent une nuance favorable dans ce type de récit. L’expression française idiomatique remplace l’image hébraïque littérale « une nouvelle dans sa bouche », peu naturelle en français.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: l’homme continuait à s’approcher
  rationale: La construction infinitive exprime une progression continue. Cette formulation française en rend naturellement l’aspect duratif.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. « La sentinelle » conserve le cadre militaire; « il apporte une bonne nouvelle » privilégie une expression française naturelle tout en signalant en note l’ambiguïté lexicale de l’hébreu.
