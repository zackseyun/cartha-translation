source:
  edition: WLC
  text: וַ/יֵּצֵ֥א הָ/עָ֛ם הַ/שָּׂדֶ֖ה לִ/קְרַ֣את יִשְׂרָאֵ֑ל וַ/תְּהִ֥י הַ/מִּלְחָמָ֖ה בְּ/יַ֥עַר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: fr
  text: Les troupes sortirent dans la campagne à la rencontre d’Israël[a], et la bataille eut lieu dans la forêt d’Éphraïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le peuple » ; ici, le terme désigne les combattants de David, d’où « les troupes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: les troupes
  rationale: Le nom signifie couramment « le peuple », mais, dans ce contexte militaire, il désigne les combattants de David. « Les troupes » exprime naturellement ce sens contextuel.
- source_word: הַשָּׂדֶה
  choice: dans la campagne
  rationale: שָׂדֶה peut désigner un champ ou la campagne. Avec « sortir », la formulation évoque ici le déplacement vers le terrain où l’affrontement aura lieu, sans imposer l’idée d’un champ cultivé.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Cette expression signifie aller à la rencontre de quelqu’un. Le contexte militaire suffit à indiquer le caractère hostile de la rencontre, sans devoir traduire explicitement « contre ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé tel quel. Dans le contexte, il désigne les forces israélites ralliées à Absalom, mais le texte hébreu dit simplement « Israël ».
- source_word: הַמִּלְחָמָה
  choice: la bataille
  rationale: Bien que le terme puisse aussi signifier « guerre », il désigne ici l’affrontement précis raconté dans ce passage.
- source_word: וַתְּהִי
  choice: eut lieu
  rationale: Littéralement « fut » ou « advint » ; avec « la bataille », « eut lieu » est une formulation française naturelle et fidèle à l’événement décrit.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: dans la forêt d’Éphraïm
  rationale: La construction hébraïque désigne la « forêt d’Éphraïm ». La traduction conserve le nom du lieu sans tenter de résoudre les questions géographiques que le verset ne précise pas.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en étant idiomatique ; « à la rencontre d’Israël » préserve la formulation du texte sans expliciter davantage l’identité des forces adverses.
