base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: fr
  text: 'Alors Joab dit au Koushite[a] : « Va dire au roi ce que tu as vu. » Le Koushite s’inclina devant Joab et courut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Koushi », si le mot est compris comme un nom propre ; traditionnellement : « l’Éthiopien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: le Koushite
  rationale: Le terme hébreu est compris comme un gentilé désignant un homme originaire de Koush. « Koushite » est plus transparent et moins chargé d’associations géographiques modernes que le traditionnel « Éthiopien »; il reste toutefois possible d’y voir le nom propre « Koushi ».
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif de הלך exprime ici un ordre simple de se rendre auprès du roi.
- source_word: הַגֵּד
  choice: dire
  rationale: Le hifil impératif de נגד signifie faire connaître ou rapporter. « Dire au roi » est naturel en français moderne dans ce discours direct.
- source_word: אֲשֶׁר רָאִיתָה
  choice: ce que tu as vu
  rationale: Cette formulation idiomatique conserve le sens de la proposition relative hébraïque et la pertinence immédiate de ce qui a été observé.
- source_word: וַיִּשְׁתַּחוּ
  choice: s’inclina devant
  rationale: Le verbe décrit un geste corporel de profond respect. « S’inclina devant » évite de préciser sans nécessité une prosternation complète ou de suggérer un acte cultuel.
- source_word: וַיָּרֹץ
  choice: partit en courant
  rationale: Le verbe רוץ signifie courir. Cette tournure naturelle indique à la fois le départ du messager et sa course, sans affaiblir le mouvement du récit.
- source_word: וַיֹּאמֶר
  choice: Alors Joab dit
  rationale: « Alors » rend naturellement la progression narrative portée par le waw consécutif.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le discours reste direct et concis; « Koushite » préserve la désignation ancienne sans l’assimiler trop rapidement à une nationalité moderne.
