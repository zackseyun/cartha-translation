base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: fr
  text: 'Le roi donna cet ordre à Joab, à Abishaï et à Ittaï : « Par égard pour moi, traitez avec douceur le jeune homme, Absalom[a]. » Et tout le peuple entendit le roi donner cet ordre à tous les chefs au sujet d’Absalom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pour moi, allez doucement avec le jeune homme — Absalom. » L’hébreu formule de manière très concise l’appel personnel du roi et l’identification d’Absalom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Le roi donna cet ordre
  rationale: צוה exprime un commandement ayant autorité. Cette tournure française est naturelle dans le récit et conserve sa force.
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: à Joab, à Abishaï et à Ittaï
  rationale: Les noms propres sont translittérés selon les usages français; la répétition du marqueur d’objet hébreu devient la préposition française requise par « donner un ordre ».
- source_word: לֵאמֹר
  choice: ': « … »'
  rationale: L’infinitif quotatif est rendu naturellement par les deux-points et le discours direct, sans « en disant », inutile en français courant.
- source_word: לְאַט
  choice: traitez avec douceur
  rationale: L’adverbe exprime ici douceur et retenue dans la manière de traiter Absalom; une locution verbale est nécessaire en français.
- source_word: לִי
  choice: Par égard pour moi
  rationale: Le datif exprime l’intérêt personnel et l’appel affectif de David, plutôt qu’un simple bénéficiaire.
- source_word: לַנַּעַר
  choice: le jeune
  rationale: נַעַר peut désigner un garçon ou un jeune homme. Devant le nom d’Absalom, « le jeune Absalom » conserve la tendresse paternelle sans le présenter comme un enfant.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalom
  rationale: Le second ל précise l’identité du « jeune » dans une construction hébraïque resserrée; le français naturel place directement le nom en apposition.
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: Tout le peuple entendit
  rationale: הָעָם signifie littéralement « le peuple »; le contexte permet de comprendre qu’il s’agit ici des hommes présents, sans imposer « troupes ».
- source_word: בְּצַוֹּת הַמֶּלֶךְ
  choice: le roi donner … ses ordres
  rationale: L’infinitif construit avec ב indique la circonstance concomitante. Après « entendit », l’infinitif français rend directement cette relation.
- source_word: כָּל הַשָּׂרִים
  choice: tous les chefs
  rationale: שָׂרִים désigne les responsables militaires dans ce contexte; « chefs » est clair, actuel et suffisamment large.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: au sujet d’Absalom
  rationale: La locution signifie « concernant, au sujet de » et ne précise pas davantage le contenu des ordres.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est allégée là où le français n’emploie pas naturellement les formules quotatives hébraïques. Le marqueur [a] conserve l’ambiguïté et la concision inhabituelle de לְאַט לִי לַנַּעַר לְאַבְשָׁלוֹם.
