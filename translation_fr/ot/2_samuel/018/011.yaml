base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: fr
  text: 'Joab dit à l’homme qui lui avait fait ce rapport : « Eh bien, tu l’as vu ! Pourquoi ne l’as-tu pas frappé là, à terre ? Et j’aurais été tenu[a] de te donner dix pièces d’argent[b] et une ceinture. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et je t’aurais donné ». L’expression hébraïque signifie plus littéralement : « il m’aurait incombé de te donner ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dix d’argent » ; l’unité précise n’est pas indiquée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: qui lui avait fait ce rapport
  rationale: Le participe substantivé désigne l’homme qui venait d’informer Joab. Le plus-que-parfait rend naturellement l’antériorité du rapport dans ce contexte.
- source_word: וְהִנֵּה רָאִיתָ
  choice: Tu l’as donc vu !
  rationale: Cette formulation française exprime la réaction insistante de Joab et la valeur déictique de וְהִנֵּה, sans recourir à l’archaïque « voici » dans cet emploi.
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: ne l’as-tu pas frappé là, à terre
  rationale: « Frappé » conserve le sens concret de נכה sans remplacer explicitement le verbe par « tuer »; « là, à terre » représente les deux éléments שָׁם et אָרְצָה.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: Et j’aurais été tenu de te donner
  rationale: La construction עָלַי avec l’infinitif exprime ce qui aurait incombé à Joab. « Être tenu de » garde cette nuance d’obligation tout en restant idiomatique en français.
- source_word: עֲשָׂרָה כֶסֶף
  choice: dix pièces d’argent
  rationale: L’hébreu dit littéralement « dix d’argent » sans nommer l’unité. « Pièces » complète naturellement l’expression sans imposer « sicles » ni supposer des monnaies frappées.
- source_word: חֲגֹרָה אֶחָת
  choice: une ceinture
  rationale: « Ceinture » est l’équivalent moderne et clair de חֲגֹרָה; « une » rend naturellement le numéral אֶחָת en français.
