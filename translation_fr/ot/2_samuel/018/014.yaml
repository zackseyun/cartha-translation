source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב לֹא כֵ֖ן אֹחִ֣ילָה לְ/פָנֶ֑י/ךָ וַ/יִּקַּח֩ שְׁלֹשָׁ֨ה שְׁבָטִ֜ים בְּ/כַפּ֗/וֹ וַ/יִּתְקָעֵ/ם֙ בְּ/לֵ֣ב אַבְשָׁל֔וֹם עוֹדֶ֥/נּוּ חַ֖י בְּ/לֵ֥ב הָ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: fr
  text: 'Joab dit : « Je ne vais pas m’attarder ainsi devant toi. » Puis il prit trois épieux[a] dans sa main et les planta dans le cœur d’Absalom, alors que celui-ci était encore vivant au cœur du térébinthe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trois bâtons » ou « trois verges ». Le terme hébreu peut désigner un bâton, une verge ou un sceptre ; dans ce contexte, il s’agit vraisemblablement d’armes servant à transpercer.
    reason: lexical_alternative
  - marker: b
    text: Ou « du chêne ». Le terme hébreu אֵלָה désigne souvent un térébinthe, mais il est parfois rendu plus généralement par « chêne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה לְפָנֶיךָ
  choice: je ne vais pas m’attarder ainsi devant toi
  rationale: Le hiphil de יחל exprime ici l’attente ou le délai. « S’attarder » rend naturellement le refus de Joab de prolonger la situation, tandis que « devant toi » conserve l’expression hébraïque לְפָנֶיךָ.
- source_word: שְׁבָטִים
  choice: épieux
  rationale: Le mot désigne habituellement des bâtons, des verges ou des sceptres, mais le contexte militaire et l’action de les enfoncer dans le cœur indiquent ici des armes pointues. « Épieux » exprime cette fonction sans masquer l’éventail lexical, signalé en note.
- source_word: וַיִּתְקָעֵם
  choice: les planta
  rationale: Le verbe תקע décrit une action énergique consistant à enfoncer ou planter un objet. « Les planta » est direct, violent et naturel en français.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: dans le cœur d’Absalom
  rationale: La traduction conserve la désignation anatomique explicite du texte hébreu plutôt que de la généraliser en « poitrine ».
- source_word: עוֹדֶנּוּ חַי
  choice: alors que celui-ci était encore vivant
  rationale: Cette formulation souligne clairement qu’Absalom n’était pas encore mort lorsque Joab le frappa.
- source_word: בְּלֵב הָאֵלָה
  choice: au cœur du térébinthe
  rationale: אֵלָה désigne généralement le térébinthe. « Au cœur » conserve l’image hébraïque et son écho littéraire avec « le cœur d’Absalom ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste directe et conserve le parallèle saisissant entre le cœur d’Absalom et le cœur de l’arbre.
