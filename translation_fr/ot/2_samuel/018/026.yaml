base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: fr
  text: 'Le guetteur aperçut alors un autre homme qui courait. Il appela le gardien de la porte et dit : « Regarde ! Un homme court seul. » Le roi dit : « Lui aussi apporte des nouvelles[a][b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est un messager » ; le participe hébreu peut désigner quelqu’un qui apporte un message ou un rapport.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « apporte une bonne nouvelle » ; le verbe hébreu désigne souvent l’annonce d’une nouvelle favorable, sans l’exiger ici.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: le guetteur
  rationale: Le participe de צפה désigne celui qui observe depuis son poste. « Guetteur » convient au contexte de la porte de la ville et reste naturel en français moderne.
- source_word: אִישׁ אַחֵר
  choice: un autre homme
  rationale: Cette formulation indique simplement qu’un second homme, distinct du premier coureur, apparaît.
- source_word: רָץ
  choice: qui courait
  rationale: Le participe présente l’homme en pleine course au moment où le guetteur l’aperçoit ; l’imparfait rend naturellement cet aspect en français.
- source_word: הַשֹּׁעֵר
  choice: le gardien de la porte
  rationale: Dans le cadre d’une porte de ville, cette expression est claire et plus actuelle que « portier ».
- source_word: הִנֵּה
  choice: Regarde !
  rationale: La particule attire vivement l’attention sur ce qui est visible. « Regarde ! » en restitue la force sans archaïsme.
- source_word: לְבַדּוֹ
  choice: tout seul
  rationale: L’expression souligne que l’homme court isolément, et non au sein d’un groupe.
- source_word: גַּם זֶה
  choice: Lui aussi
  rationale: Cette tournure française naturelle conserve l’idée que le second coureur appartient à la même catégorie que le premier.
- source_word: מְבַשֵּׂר
  choice: apporte des nouvelles
  rationale: Le participe piel de בשׂר désigne quelqu’un qui apporte une annonce, souvent favorable. La traduction retenue n’impose pas que la nouvelle soit bonne.
