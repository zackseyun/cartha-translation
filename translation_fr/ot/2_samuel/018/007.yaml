  text: וַ/יִּנָּ֤גְפוּ שָׁם֙ עַ֣ם יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וַ/תְּהִי שָׁ֞ם הַ/מַּגֵּפָ֧ה גְדוֹלָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא עֶשְׂרִ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: fr
  text: 'Là, le peuple d’Israël fut battu devant les serviteurs de David, et, ce jour-là, le carnage fut considérable : vingt mille hommes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vingt mille ». Le mot « hommes » est ajouté pour préciser le sens dans ce contexte de bataille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: fut battu
  rationale: Le nifal de נָגַף exprime ici une défaite militaire. « Fut battu » rend clairement ce sens sans affirmer que chaque membre du peuple fut tué.
- source_word: עַם יִשְׂרָאֵל
  choice: le peuple d’Israël
  rationale: Cette traduction conserve la formulation hébraïque, tout en laissant le contexte indiquer qu’il s’agit des forces israélites engagées dans la bataille.
- source_word: לִפְנֵי
  choice: devant
  rationale: Dans un récit militaire, לִפְנֵי peut indiquer qu’une armée est battue devant son adversaire. « Devant » préserve cette tournure concise.
- source_word: עַבְדֵי דָוִד
  choice: les serviteurs de David
  rationale: עֶבֶד peut désigner un serviteur, un officier ou un homme attaché au service d’un roi. La traduction formelle conserve ce statut sans le réduire explicitement à celui de soldats.
- source_word: הַמַּגֵּפָה
  choice: le carnage
  rationale: מַגֵּפָה peut désigner un fléau, un coup ou les pertes provoquées par une frappe. Dans ce contexte de bataille et avec le nombre qui suit, « carnage » exprime naturellement les pertes meurtrières.
- source_word: גְדוֹלָה
  choice: considérable
  rationale: L’adjectif signifie « grand ». Avec « carnage », « considérable » est une formulation française naturelle et digne qui souligne l’ampleur des pertes.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Rendu temporel direct et idiomatique en français moderne.
- source_word: עֶשְׂרִים אָלֶף
  choice: vingt mille hommes
  rationale: L’hébreu donne seulement « vingt mille ». « Hommes » est ajouté pour expliciter les personnes comptées dans ce contexte militaire, et cette précision est signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La traduction reste proche de la syntaxe hébraïque, notamment avec « le peuple d’Israël » et « les serviteurs de David », tout en employant « carnage » pour rendre naturellement la violence meurtrière de מַגֵּפָה dans ce contexte.
