  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: fr
  text: Alors Joab sonna du cor[a], et les troupes cessèrent de poursuivre Israël[b], parce que Joab retint les troupes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la trompe ». Le mot hébreu shofar désigne une corne servant à donner des signaux, souvent une corne de bélier.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit ici des forces israélites ralliées à Absalom.
    reason: cultural_note
  - marker: c
    text: Ou « empêcha les troupes de continuer » ; le verbe hébreu peut aussi signifier « épargner ». Dans ce contexte, il indique probablement que Joab arrêta ses hommes et mit fin à la poursuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: sonna
  rationale: Avec שׁוֹפָר comme complément, תקע signifie faire retentir ou sonner un instrument de signalisation. « Sonna » est naturel en français et convient au contexte militaire.
- source_word: בַּשֹּׁפָר
  choice: de la trompe
  rationale: Le שׁוֹפָר est une corne utilisée pour donner des signaux, souvent une corne de bélier. « Trompe » conserve le caractère concret de l’instrument tout en étant idiomatique dans ce récit.
- source_word: וַיָּשָׁב הָעָם מִרְדֹף
  choice: les troupes cessèrent de poursuivre
  rationale: שׁוב suivi de מִן et de l’infinitif exprime ici l’interruption et le retour après une action. Dans ce cadre militaire, הָעָם désigne les combattants de Joab; « les troupes » rend ce référent clairement sans ajouter une précision absente du texte.
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte nomme simplement Israël comme objet de la poursuite. Le nom est conservé dans le texte principal, tandis qu’une note précise son référent contextuel.
- source_word: כִּי
  choice: parce que
  rationale: כִּי introduit la raison pour laquelle la poursuite prit fin. « Parce que » exprime explicitement ce rapport causal en français contemporain.
- source_word: חָשַׂךְ
  choice: retint
  rationale: חשׂך peut signifier retenir, empêcher, préserver ou épargner. Dans le contexte immédiat, Joab arrête ses propres troupes; « retint » transmet ce sens sans attribuer explicitement un motif de clémence.
- source_word: אֶת הָעָם
  choice: les troupes
  rationale: Comme dans la proposition précédente, הָעָם désigne la force combattante commandée par Joab. La répétition de « les troupes » reflète la répétition hébraïque et évite une référence pronominale équivoque.
