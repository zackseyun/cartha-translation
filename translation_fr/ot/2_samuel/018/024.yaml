  text: וְ/דָוִ֥ד יוֹשֵׁ֖ב בֵּין שְׁנֵ֣י הַ/שְּׁעָרִ֑ים וַ/יֵּ֨לֶךְ הַ/צֹּפֶ֜ה אֶל גַּ֤ג הַ/שַּׁ֨עַר֙ אֶל הַ֣/חוֹמָ֔ה וַ/יִּשָּׂ֤א אֶת עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִ֖ישׁ רָ֥ץ לְ/בַדּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: fr
  text: David était assis entre les deux portes[a]. Le guetteur monta sur le toit de la porte, près de la muraille. Il leva les yeux, regarda, et voici qu’un homme courait seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre les deux bâtiments des portes ». L’hébreu dit littéralement « entre les deux portes » et désigne probablement l’espace situé à l’intérieur d’un passage fortifié.
    reason: Alternative lexicale et précision architecturale possible.
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: était assis
  rationale: Le participe décrit la posture continue de David à ce moment du récit ; l’imparfait français en rend naturellement l’aspect duratif.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: entre les deux portes
  rationale: Cette traduction suit littéralement l’hébreu sans préciser une configuration architecturale que le texte ne donne pas explicitement.
- source_word: הַצֹּפֶה
  choice: le guetteur
  rationale: Le terme désigne l’homme chargé d’observer depuis les fortifications ; « guetteur » est courant et adapté au contexte.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: sur le toit de la porte, près de la muraille
  rationale: La formulation indique la montée vers le toit de la structure de la porte en relation avec la muraille, sans imposer une reconstitution architecturale trop précise.
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: Il leva les yeux
  rationale: L’expression française conserve l’image de l’idiome hébreu tout en restant naturelle.
- source_word: וַיַּרְא וְהִנֵּה
  choice: regarda, et voici que
  rationale: Cette tournure rend à la fois l’acte d’observer et la présentation soudaine de ce qui apparaît à la vue du guetteur.
- source_word: אִישׁ רָץ לְבַדּוֹ
  choice: un homme courait seul
  rationale: « Homme » respecte le référent masculin explicite ; l’imparfait rend le participe décrivant la course en cours, et « seul » exprime sobrement לְבַדּוֹ.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’enchaînement hébreu tout en évitant les lourdeurs ; « et voici que » conserve l’effet visuel et soudain de הִנֵּה.
