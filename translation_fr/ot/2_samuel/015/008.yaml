  text: כִּי נֵ֨דֶר֙ נָדַ֣ר עַבְדְּ/ךָ֔ בְּ/שִׁבְתִּ֥/י בִ/גְשׁ֛וּר בַּ/אֲרָ֖ם לֵ/אמֹ֑ר אִם ישיב יְשִׁיבֵ֤/נִי יְהוָה֙ יְר֣וּשָׁלִַ֔ם וְ/עָבַדְתִּ֖י אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: fr
  text: 'Car ton serviteur avait fait un vœu lorsqu’il habitait à Gueshour, en Aram. Il avait dit : « Si Yahweh me ramène vraiment à Jérusalem[a], je servirai Yahweh[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe « ramener » par une répétition : littéralement, « si Yahweh me ramène, oui, me ramène » — ou « me ramène à coup sûr ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je rendrai un culte à Yahweh ». Le verbe hébreu peut désigner le service rendu à Dieu dans le culte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: avait fait un vœu
  rationale: L’hébreu emploie un accusatif interne, littéralement « avait voué un vœu ». Le français naturel dit « faire un vœu » ; le plus-que-parfait situe ce vœu avant la demande formulée dans le contexte narratif.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans une adresse au roi, il s’agit d’une formule conventionnelle de déférence par laquelle le locuteur parle de lui-même.
- source_word: בְּשִׁבְתִּי
  choice: lorsqu’il habitait
  rationale: L’infinitif construit avec préposition exprime le cadre temporel et une situation durable. Le passage à la troisième personne dans la proposition introduite par « car » est naturel en français après « ton serviteur », tandis que la citation reprend la première personne.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: à Gueshour, en Aram
  rationale: Cette formulation situe clairement Gueshour dans la région d’Aram sans préciser davantage le rapport géopolitique.
- source_word: לֵאמֹר
  choice: Il avait dit
  rationale: La formule hébraïque introduit le contenu du vœu. Une nouvelle phrase est plus naturelle qu’un participe tel que « disant » en français actuel.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: Si Yahweh me ramène vraiment
  rationale: Le texte consonantique et la lecture massorétique signalée emploient une répétition du verbe שוב pour renforcer la condition. « vraiment » restitue cette insistance sans tournure artificielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: je servirai Yahweh
  rationale: Le verbe עבד désigne le service rendu à Dieu et peut inclure le culte. « Servir » conserve cette portée plus large sans réduire le sens au seul acte cultuel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme ; la translittération conserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de עבד appliqué à Dieu
  choice: servir Yahweh
  alternative: rendre un culte à Yahweh
  rationale: « Servir » maintient la tension entre service, fidélité et culte présente dans le verbe hébreu, tandis que « rendre un culte » en limiterait davantage la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite le calque « vouer un vœu » et le participe lourd « disant », tout en conservant la déférence de « ton serviteur », l’insistance verbale hébraïque en note et l’ambivalence cultuelle de « servir ».
