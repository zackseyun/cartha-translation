source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: fr
  text: 'Absalom disait : « Ah ! si seulement on m’établissait juge dans le pays ! Toute personne ayant un litige ou une affaire à faire juger viendrait alors me trouver, et je lui rendrais justice[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je lui donnerais raison » ou « je le déclarerais dans son droit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Absalom disait
  rationale: Dans ce contexte décrivant la conduite habituelle d’Absalom, l’imparfait français exprime naturellement la répétition du discours.
- source_word: מִי יְשִׂמֵנִי
  choice: Ah ! si seulement on m’établissait
  rationale: Littéralement « Qui m’établira ? », la formule a ici la valeur d’un souhait rhétorique. La tournure française conserve cet élan sans introduire de sujet précis.
- source_word: שֹׁפֵט
  choice: juge
  rationale: Le terme désigne ici celui qui tranche des litiges; « juge » convient directement au contexte judiciaire.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: « Pays » rend naturellement le territoire concerné sans lui donner le sens plus matériel de « terre ».
- source_word: כָּל אִישׁ
  choice: toute personne
  rationale: Le masculin singulier hébreu est employé de manière générique. « Toute personne » en restitue clairement la portée en français moderne.
- source_word: רִיב וּמִשְׁפָּט
  choice: un litige ou une affaire à faire juger
  rationale: La paire évoque une contestation et une cause soumise à décision. Cette formulation garde les deux éléments tout en évitant une répétition peu naturelle.
- source_word: וְעָלַי יָבוֹא
  choice: viendrait alors me trouver
  rationale: Le conditionnel rend la conséquence imaginée du souhait d’Absalom; « me trouver » exprime naturellement le fait de s’adresser à lui.
- source_word: וְהִצְדַּקְתִּיו
  choice: je lui rendrais justice
  rationale: Le hiphil de צדק peut signifier déclarer quelqu’un juste, lui donner raison ou le justifier. Dans ce cadre judiciaire, « rendre justice » est clair et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et oralement fluide. L’imparfait présente les paroles répétées d’Absalom; le conditionnel structure la situation hypothétique. L’exclamation « Ah ! si seulement » conserve la force souhaitante de la question rhétorique hébraïque.
