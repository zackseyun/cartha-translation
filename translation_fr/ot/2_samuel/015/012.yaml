  text: וַ/יִּשְׁלַ֣ח אַ֠בְשָׁלוֹם אֶת אֲחִיתֹ֨פֶל הַ/גִּֽילֹנִ֜י יוֹעֵ֣ץ דָּוִ֗ד מֵֽ/עִיר/וֹ֙ מִ/גִּלֹ֔ה בְּ/זָבְח֖/וֹ אֶת הַ/זְּבָחִ֑ים וַ/יְהִ֤י הַ/קֶּ֨שֶׁר֙ אַמִּ֔ץ וְ/הָ/עָ֛ם הוֹלֵ֥ךְ וָ/רָ֖ב אֶת אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: fr
  text: Absalom fit venir Ahitofel de Guilo[a], conseiller de David, de sa ville, Guilo, pendant qu’Absalom offrait les sacrifices. La conspiration prit de l’ampleur[b], et le peuple était de plus en plus nombreux aux côtés d’Absalom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Absalom envoya Ahitofel, le Guilonite » ; plus littéralement, l’hébreu dit « envoya Ahitofel », mais, dans ce contexte, il s’agit probablement de le faire venir pour qu’il se joigne à la révolte.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « La conspiration devint forte » ; autre traduction possible : « Le complot prit de l’ampleur ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le peuple allait et devenait nombreux avec Absalom », expression qui décrit un soutien augmentant continuellement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: fit venir
  rationale: Avec une personne comme complément et dans le contexte du recrutement pour la révolte, le verbe signifie vraisemblablement qu’Absalom envoya chercher Ahitofel. « Fit venir » exprime naturellement cette convocation en français.
- source_word: הַגִּלֹנִי
  choice: de Guilo
  rationale: Le gentilé désigne l’origine d’Ahitofel. En français courant, « de Guilo » est plus transparent que le rare « Guilonite », tout en conservant l’identification géographique.
- source_word: יוֹעֵץ דָּוִד
  choice: conseiller de David
  rationale: Cette formulation rend directement la relation construite en hébreu et le rôle politique d’Ahitofel auprès de David.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: depuis sa ville, Guilo
  rationale: La formulation conserve à la fois le nom commun « sa ville » et le toponyme explicatif « Guilo ».
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: pendant qu’il offrait les sacrifices
  rationale: La préposition suivie de l’infinitif construit marque une action simultanée. La tournure française reste naturelle et maintient le sens cultuel de la racine זבח.
- source_word: הַקֶּשֶׁר
  choice: la conspiration
  rationale: Dans le contexte de la révolte organisée d’Absalom, « conspiration » exprime clairement un complot politique concerté.
- source_word: אַמִּץ
  choice: prit de l’ampleur
  rationale: Associé à וַיְהִי, l’adjectif décrit le renforcement progressif de la conspiration. « Prit de l’ampleur » rend cette progression avec naturel.
- source_word: הוֹלֵךְ וָרָב
  choice: devinrent de plus en plus nombreux
  rationale: La construction hébraïque exprime une augmentation continue. Cette tournure française en restitue clairement l’aspect progressif.
- source_word: הָעָם
  choice: les gens
  rationale: Dans ce contexte, le collectif désigne les personnes qui rejoignent Absalom. « Les gens » évite de suggérer que tout le peuple était déjà acquis à sa cause.
- source_word: אֶת אַבְשָׁלוֹם
  choice: qui se ralliaient à Absalom
  rationale: Ici, אֶת marque l’association. La formulation explicite idiomatiquement en français l’alignement politique impliqué par le contexte.
