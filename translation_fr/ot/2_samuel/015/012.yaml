    rationale: Pour rendre מֵעִירוֹ, « de sa ville » est la collocation française habituelle et reste proche du texte source.
  - severity: low
    issue: La relative « qui se ralliaient » explicite l’association politique plus que le texte
    rationale: L’hébreu dit littéralement que le peuple augmentait « avec Absalom ». Une formulation avec « aux côtés d’Absalom » conserve l’association sans introduire une relative interprétative.
