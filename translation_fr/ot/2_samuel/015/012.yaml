  to: Absalom fit venir Ahitofel de Guilo[a], conseiller de David, de sa ville, Guilo, pendant qu’Absalom offrait les sacrifices. La conspiration prit de l’ampleur[b], et le peuple était de plus en plus nombreux aux côtés d’Absalom[c].
