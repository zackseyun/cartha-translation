  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: fr
  text: 'Absalom se levait de bon matin et se tenait au bord du chemin qui menait à la porte. Chaque fois qu’un homme avait un litige et venait trouver le roi pour qu’il rende son jugement[a], Absalom l’appelait et lui demandait : « De quelle ville es-tu ? » L’homme répondait : « Ton serviteur vient de l’une des tribus d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait une affaire judiciaire » au lieu de « avait un litige » ; le mot hébreu רִיב peut désigner un différend, une plainte ou une affaire portée devant un juge.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: se levait de bon matin
  rationale: Le verbe exprime le fait de se lever tôt. L’imparfait français rend naturellement l’action habituelle suggérée par le contexte itératif.
- source_word: וְעָמַד
  choice: se tenait
  rationale: Le sens fondamental est « se tenir debout ». Dans ce contexte, « se tenait » décrit naturellement la position qu’Absalom prenait de façon répétée.
- source_word: עַל יַד
  choice: au bord de
  rationale: L’expression idiomatique signifie « à côté de, près de ». Avec une route, « au bord de » fournit une formulation française naturelle tout en conservant la relation spatiale.
- source_word: דֶּרֶךְ הַשָּׁעַר
  choice: la route qui menait à la porte de la ville
  rationale: Le syntagme désigne la voie d’accès à la porte. L’ajout explicatif « de la ville » clarifie pour le lecteur moderne qu’il s’agit de la porte urbaine, sans modifier le référent.
- source_word: וַיְהִי כָּל הָאִישׁ אֲשֶׁר יִהְיֶה לּוֹ רִיב
  choice: Chaque fois qu’un homme avait un litige
  rationale: La construction présente une situation récurrente. רִיב peut désigner un différend, une plainte ou une affaire judiciaire ; « litige » convient au contexte juridique sans préciser indûment la nature du dossier.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: venait trouver le roi pour qu’il rende son jugement
  rationale: מִשְׁפָּט renvoie ici à une décision judiciaire. Cette tournure explicite naturellement en français le but de la venue auprès du roi.
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: Absalom l’appelait
  rationale: Le verbe signifie appeler ou interpeller. L’imparfait maintient le caractère habituel et évite l’idée plus forte d’une convocation officielle.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: De quelle ville es-tu ?
  rationale: Traduction directe, idiomatique et fidèle de la question sur la ville d’origine.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: vient de l’une des tribus d’Israël
  rationale: La réponse indique l’origine tribale. « Vient de » restitue clairement en français la préposition hébraïque.
- source_word: עַבְדֶּךָ
  choice: Ton serviteur
  rationale: Le terme sert ici de formule respectueuse par laquelle l’homme parle de lui-même. « Serviteur » préserve ce registre sans imposer le sens social plus précis d’« esclave ».
