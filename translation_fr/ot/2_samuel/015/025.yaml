base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: fr
  text: 'Le roi dit à Sadoc : « Ramène l’arche de Dieu dans la ville. Si je trouve grâce aux yeux de Yahweh, il me ramènera et me fera voir l’arche et sa demeure[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il me fera voir Dieu et sa demeure » ; l’hébreu peut être compris comme renvoyant à Dieu et à sa demeure, bien que l’antécédent immédiat soit « l’arche de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: Ramène
  rationale: L’impératif hiphil de שׁוב ordonne à Sadoc de faire retourner l’arche. « Ramène » exprime naturellement en français ce mouvement causatif vers la ville.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Le texte porte explicitement אֱלֹהִים, « Dieu », et non le tétragramme ; la formulation n’est donc pas harmonisée avec l’expression « arche de Yahweh ».
- source_word: הָעִיר
  choice: dans la ville
  rationale: Le nom défini a ici une valeur directionnelle déterminée par le verbe de retour. « Dans la ville » indique clairement la destination sans ajouter un lieu plus précis que l’hébreu.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: Si je trouve grâce aux yeux de Yahweh
  rationale: Cette formulation conserve l’image de l’idiome hébreu et sa nuance relationnelle, sans la réduire à « si je plais à Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la distinction présente dans le verset entre יְהוָה et אֱלֹהִים.
- source_word: וֶהֱשִׁבַנִי
  choice: il me ramènera
  rationale: Le hiphil de שׁוב avec suffixe de première personne exprime le fait de faire revenir David, ici à Jérusalem.
- source_word: וְהִרְאַנִי
  choice: et me fera voir
  rationale: Le hiphil de ראה signifie littéralement « faire voir ». Cette tournure française reste naturelle tout en conservant la valeur causative.
- source_word: אֹתוֹ
  choice: l’arche
  rationale: L’antécédent immédiat est « l’arche de Dieu ». La répétition du nom est plus claire en français qu’un pronom, tandis qu’une note signale que la morphologie hébraïque permet aussi un référent centré sur Dieu.
- source_word: נָוֵהוּ
  choice: sa demeure
  rationale: נָוֶה désigne une demeure ou un lieu d’habitation. « Sa demeure » préserve la concision et évite de préciser « temple », qui serait anachronique à ce stade du récit.
theological_decisions:
- issue: Référent de אֹתוֹ וְאֶת־נָוֵהוּ (« lui et sa demeure »)
  choice: Le texte principal comprend l’expression comme désignant l’arche et le lieu où elle demeure.
  alternative: L’expression peut désigner Dieu et sa demeure.
  rationale: « L’arche de Dieu » est l’antécédent immédiat et fournit la lecture syntaxique la plus naturelle. Toutefois, l’arche représente la présence divine, et les formes masculines de l’hébreu peuvent soutenir une lecture centrée sur Dieu. La note conserve cette ambiguïté théologique sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu, notamment dans « trouver grâce aux yeux de », tandis que « Ramène » et « me fera voir » rendent clairement les formes causatives. Le nom divin est rendu par « Yahweh ».
