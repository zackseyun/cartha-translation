  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: fr
  text: 'Les serviteurs du roi dirent au roi : « Pour tout ce que choisira mon seigneur le roi, voici tes serviteurs. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: dirent
  rationale: Le wayyiqtol de אמר introduit directement les paroles; le passé simple convient au registre narratif français.
- source_word: עַבְדֵי הַמֶּלֶךְ / עֲבָדֶיךָ
  choice: les serviteurs du roi / tes serviteurs
  rationale: « Serviteurs » convient à ces hommes attachés au service royal sans imposer ici le sens plus étroit d’esclaves, tout en conservant la répétition du terme hébreu עבד.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: à faire tout ce que choisira
  rationale: Cette formulation naturelle exprime leur entière disponibilité à suivre le choix du roi, tout en gardant le verbe « choisir » correspondant à בחר.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette adresse respectueuse préserve le langage de cour et la déférence du texte hébreu.
- source_word: הִנֵּה
  choice: nous sommes prêts
  rationale: Dans ce contexte, הִנֵּה présente les serviteurs comme immédiatement disponibles; « nous sommes prêts » en communique naturellement la portée pragmatique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et naturel. La reprise « Nous, tes serviteurs » restitue l’insistance de la présentation hébraïque, tandis que « sommes prêts à faire » explicite sobrement la disponibilité impliquée par הִנֵּה sans modifier le choix laissé au roi.
