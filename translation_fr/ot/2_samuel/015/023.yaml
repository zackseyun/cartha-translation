  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: fr
  text: Tout le pays pleurait à grands cris, tandis que tout le peuple traversait. Le roi traversa lui aussi la vallée du Cédron[a], et tout le peuple passait sur le chemin qui mène au désert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La vallée du Cédron : traditionnellement « le torrent du Cédron ». Le mot hébreu נַחַל peut désigner un oued, un ravin ou un cours d’eau saisonnier.'
    reason: cultural_note
  - marker: b
    text: 'L’expression hébraïque est condensée. Autre traduction possible : « par le chemin du désert » ; elle peut aussi évoquer le mouvement en direction du désert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: tout le pays
  rationale: Dans ce contexte, אָרֶץ désigne le pays ou la région, envisagé collectivement avec ses habitants, et non la terre entière. La personnification « tout le pays pleurait » conserve l’image hébraïque et reste naturelle en français.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: pleurait à grands cris
  rationale: L’expression signifie littéralement « pleurant d’une grande voix ». « À grands cris » rend de façon idiomatique le caractère audible et intense de la lamentation.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: עָם désigne ici l’ensemble de ceux qui accompagnent David, sans les réduire aux seuls soldats.
- source_word: עֹבְרִים / עֹבֵר
  choice: traversait / traversa
  rationale: Le verbe עבר évoque ici le franchissement du Cédron et le déplacement continu du groupe. L’imparfait décrit la progression du peuple, tandis que le passé simple présente le passage du roi comme une action narrative précise.
- source_word: בְּנַחַל קִדְרוֹן
  choice: la vallée du Cédron
  rationale: נַחַל peut désigner un ravin, un oued ou son cours d’eau saisonnier. « Vallée du Cédron » est une désignation géographique claire en français moderne sans imposer la présence permanente d’un ruisseau.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: en direction du chemin du désert
  rationale: La construction hébraïque est concise et quelque peu ambiguë. Cette formulation conserve à la fois l’idée de direction et la mention explicite du chemin, sans préciser davantage que le texte source.
