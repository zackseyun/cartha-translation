  source_fidelity: 'La structure et les termes principaux sont bien rendus : le titre « le roi », le gentilé « le Guittite », les deux impératifs et l’ambiguïté du référent de « le roi » sont conservés. Toutefois, « viendrais-tu » transforme le verbe hébreu « aller » en « venir ». « Pourquoi irais-tu, toi aussi, avec nous ? » conserve plus exactement le mouvement exprimé, tout en restant naturel en français.'
  naturalness: Le registre est fluide, actuel et narratif. « Pourquoi irais-tu, toi aussi, avec nous ? » est tout aussi idiomatico-naturel que la formulation du projet et respecte mieux le verbe source. La formulation « un exilé loin de chez toi » est intelligible, mais l’ajout après une virgule rend plus lisible son rapport à la formulation hébraïque condensée.
  terminology: « Ittaï le Guittite », « étranger » et « exilé » conviennent au français biblique moderne. La note sur « avec le roi » préserve correctement un référent non explicité. La note sur « vers ton lieu » signale à juste titre la difficulté de לִמְקוֹמֶךָ sans trancher indûment son sens.
