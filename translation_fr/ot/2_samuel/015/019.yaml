base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: fr
  text: 'Alors le roi dit à Ittaï le Guittite : « Pourquoi irais-tu, toi aussi, avec nous ? Retourne et reste avec le roi[a], car tu es un étranger et, de plus, un exilé, loin de chez toi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « avec le roi » peut désigner l’autorité royale qui demeure à Jérusalem ; l’hébreu ne précise pas de quel roi il s’agit.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « et aussi exilé vers ton lieu ». La formulation hébraïque est condensée et souligne peut-être à la fois la condition d’exilé d’Ittaï et son lien avec le lieu qui est le sien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » rend naturellement cette progression en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le titre hébreu est conservé sans remplacer celui-ci par le nom de David.
- source_word: אִתַּי הַגִּתִּי
  choice: Ittaï le Guittite
  rationale: Le nom propre est translittéré et le gentilé désignant un homme de Gath est rendu selon l’usage biblique français.
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: Pourquoi viendrais-tu, toi aussi, avec nous ?
  rationale: Le conditionnel français exprime ici naturellement la question à valeur délibérative ou prospective de l’imparfait hébreu ; « toi aussi » préserve l’insistance de גַּם אַתָּה.
- source_word: שׁוּב וְשֵׁב
  choice: Retourne et reste
  rationale: Les deux impératifs sont conservés. ישׁב signifie ici demeurer plutôt que s’asseoir littéralement.
- source_word: עִם הַמֶּלֶךְ
  choice: avec le roi
  rationale: La formulation littérale est maintenue afin de ne pas identifier explicitement le roi visé, puisque l’hébreu ne le nomme pas.
- source_word: נָכְרִי
  choice: un étranger
  rationale: Le terme désigne clairement une personne qui n’est pas originaire du pays ou du groupe concerné.
- source_word: וְגַם גֹּלֶה
  choice: et, de plus, un exilé
  rationale: גֹּלֶה désigne une personne déplacée ou en exil ; « de plus » rend la valeur cumulative de וְגַם.
- source_word: לִמְקוֹמֶךָ
  choice: loin de chez toi
  rationale: Dans cette formulation très condensée, le contexte décrit Ittaï comme déplacé par rapport au lieu qui est le sien. Cette traduction idiomatique évite le peu naturel « exilé vers ton lieu », tandis qu’une note signale la construction littérale.
theological_decisions:
- issue: Référent de « le roi » dans « reste avec le roi »
  choice: Conserver « avec le roi » sans identifier le référent dans le texte principal.
  alternative: « avec le roi Absalom », « avec le roi à Jérusalem » ou « avec moi, le roi »
  rationale: Le texte hébreu répète le titre sans donner de nom. Maintenir cette ambiguïté évite d’imposer une interprétation contextuelle.
- issue: Rapport de l’exilé à son lieu d’origine
  choice: Rendre le statut de déplacement par « un exilé loin de chez toi », avec une note sur la formulation hébraïque.
  alternative: « un exilé vers ton propre lieu » ou « un exilé dans ton lieu »
  rationale: La préposition לְ signifie formellement « vers/à », mais la tournure est comprimée et difficile. Le contexte suggère l’éloignement du lieu propre à Ittaï, sans permettre de préciser davantage s’il s’agit de sa patrie ou de son domicile.
translation_notes:
  register: Français international actuel, digne et accessible. Le discours direct reste concis ; le conditionnel « viendrais-tu » restitue sans lourdeur la nuance prospective de la question. Les ambiguïtés portant sur « le roi » et sur לִמְקוֹמֶךָ sont conservées ou signalées plutôt que résolues silencieusement.
