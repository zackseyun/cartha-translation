  text: וַ/יִּשְׁלַ֤ח אַבְשָׁלוֹם֙ מְרַגְּלִ֔ים בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּ/שָׁמְעֲ/כֶם֙ אֶת ק֣וֹל הַ/שֹּׁפָ֔ר וַ/אֲמַרְתֶּ֕ם מָלַ֥ךְ אַבְשָׁל֖וֹם בְּ/חֶבְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: fr
  text: 'Absalom envoya des espions dans toutes les tribus d’Israël avec cette consigne : « Dès que vous entendrez le son de la trompe, proclamez : “Absalom est devenu roi à Hébron !” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: secrètement des hommes
  rationale: Le terme désigne habituellement des espions, mais ici ces hommes sont surtout des agents clandestins chargés de transmettre un mot d’ordre. Cette formulation naturelle conserve l’idée de secret sans suggérer qu’ils avaient pour mission principale de recueillir des renseignements.
- source_word: כְּשָׁמְעֲכֶם
  choice: Dès que vous entendrez
  rationale: La construction temporelle avec כְּ exprime ici le signal qui doit déclencher immédiatement la proclamation.
- source_word: קוֹל הַשֹּׁפָר
  choice: le son de la trompe
  rationale: Le שׁוֹפָר est une trompe, généralement faite d’une corne animale. « Trompe » est plus précis dans ce contexte ancien que le moderne « trompette ».
- source_word: וַאֲמַרְתֶּם
  choice: proclamez
  rationale: Le littéral « dites » a ici une portée publique et collective; « proclamez » rend clairement la fonction du mot d’ordre.
- source_word: מָלַךְ
  choice: est devenu roi
  rationale: Le verbe au qatal peut annoncer l’accession à la royauté. Cette traduction rend la proclamation de l’avènement d’Absalom sans imposer la nuance durative de « règne ».
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: La préposition marque ici le lieu où la royauté d’Absalom est proclamée ou inaugurée.
theological_decisions:
- issue: Statut de la royauté d’Absalom
  choice: est devenu roi
  alternative: règne
  rationale: Le texte rapporte le slogan ordonné par Absalom, non une validation divine ou narrative de sa légitimité. « Est devenu roi » traduit l’annonce d’une accession revendiquée tout en laissant cette tension intacte.
translation_notes:
  register: Français international moderne, narratif et digne. « Avec cette consigne » explicite naturellement la fonction de לֵאמֹר. Les guillemets emboîtés distinguent l’ordre d’Absalom de la proclamation imposée.
