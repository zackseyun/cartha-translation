base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: fr
  text: Les prêtres Sadoc et Abiatar ne sont-ils pas là avec toi ? Tout ce que tu apprendras de la maison du roi, tu le rapporteras aux prêtres Sadoc et Abiatar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל הַדָּבָר
  choice: Tout ce que
  rationale: Dans ce contexte de transmission de renseignements, cette tournure française exprime naturellement « toute chose / toute affaire que » sans alourdir la phrase.
- source_word: תִּשְׁמַע
  choice: tu apprendras
  rationale: Le verbe signifie littéralement « tu entendras », mais désigne ici les informations dont Houshaï prendra connaissance; « apprendre » est idiomatique en français.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: de la maison du roi
  rationale: Conserve l'image hébraïque, qui peut désigner la résidence royale aussi bien que son entourage institutionnel.
- source_word: תַּגִּיד
  choice: tu le rapporteras
  rationale: Rend l'action de communiquer les renseignements reçus à Sadoc et Abiatar.
