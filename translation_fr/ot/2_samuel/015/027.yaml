base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: fr
  text: 'Puis le roi dit au prêtre Tsadok : « Es-tu un voyant[a] ? Retourne en paix dans la ville ; que vos deux fils soient avec vous : Ahimaats, ton fils, et Jonathan, fils d’Abiatar. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Tu vois, n’est-ce pas ? » L’hébreu peut désigner Tsadok comme un « voyant » ou poser une question sur le fait de voir ou de percevoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Puis le roi dit
  rationale: Le wayyiqtol fait progresser le récit ; « Puis » rend naturellement cet enchaînement en français.
- source_word: הֲרוֹאֶה אַתָּה
  choice: Es-tu voyant ?
  rationale: La forme peut désigner un « voyant » ou exprimer une question relative au fait de voir ou de comprendre. Le texte principal conserve la lecture nominale sans masquer l’autre possibilité, signalée en note.
- source_word: שֻׁבָה הָעִיר
  choice: Retourne dans la ville
  rationale: L’impératif de שוב, avec hé directionnel, appelle un mouvement de retour ; le français exprime naturellement la destination par « dans la ville ».
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: Cette formulation garde le champ lexical de שָׁלוֹם et peut évoquer à la fois un retour paisible et un retour sain et sauf.
- source_word: שְׁנֵי בְנֵיכֶם אִתְּכֶם
  choice: avec vos deux fils
  rationale: 'Les suffixes sont au pluriel : David s’adresse à Tsadok en incluant Abiatar. « Vos deux fils » respecte ce changement de nombre, les deux fils étant ensuite identifiés.'
- source_word: וַאֲחִימַעַץ בִּנְךָ וִיהוֹנָתָן בֶּן־אֶבְיָתָר
  choice: ton fils Ahimaats et Jonathan, fils d’Abiatar
  rationale: 'La formulation conserve l’identification parallèle : Ahimaats est le fils de Tsadok, Jonathan celui d’Abiatar.'
theological_decisions:
- issue: Fonction éventuelle de Tsadok comme voyant
  choice: « Es-tu voyant ? » dans le texte, avec l’ambiguïté en note
  alternative: « Tu vois bien, n’est-ce pas ? » ou « Le vois-tu ? »
  rationale: L’hébreu permet plusieurs analyses. Aucune fonction prophétique précise ni simple perception physique ne doit être imposée sans réserve.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms suivent des translittérations françaises usuelles. Le passage du singulier (« ton fils ») au pluriel (« vos deux fils », « avec vous ») est préservé afin de refléter l’adresse qui inclut Tsadok et Abiatar.
