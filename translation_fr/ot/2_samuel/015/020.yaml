source:
  edition: WLC
  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: fr
  text: Tu n’es arrivé qu’hier, et aujourd’hui, te ferais-je errer avec nous, alors que moi-même, je vais je ne sais où[a] ? Retourne et ramène avec toi tes frères[b]. Que l’amour fidèle et la fidélité soient avec toi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tandis que moi, je vais là où je vais ». Cette tournure hébraïque exprime ici le caractère incertain de la fuite de David.'
    reason: lexical_alternative
  - marker: b
    text: « Tes frères » peut désigner les proches, les compatriotes ou les compagnons d’Ittaï venus avec lui.
    reason: cultural_note
  - marker: c
    text: L’hébreu porte simplement « amour fidèle et fidélité », sans verbe exprimé. Le contexte permet d’y voir un souhait de bénédiction.
    reason: textual_or_grammatical_note
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: Tu es arrivé hier seulement
  rationale: L’infinitif construit avec suffixe se rend naturellement par une proposition verbale. « Hier seulement » exprime le caractère très récent de l’arrivée d’Ittaï, sur lequel David insiste.
- source_word: אֲנוּעֲךָ
  choice: te ferais-je errer
  rationale: La forme causative de נוע évoque le fait d’entraîner Ittaï dans une fuite instable et sans destination assurée.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: alors que moi-même, je vais je ne sais où
  rationale: La formulation hébraïque est elliptique et ouverte. Cette expression française garde l’incertitude de la fuite de David sans lui attribuer une destination précise.
- source_word: שׁוּב וְהָשֵׁב
  choice: Retourne et ramène
  rationale: 'Le premier verbe est un impératif simple, tandis que le second est causatif : Ittaï doit repartir et faire repartir ceux qui l’accompagnent.'
- source_word: אַחֶיךָ
  choice: tes frères
  rationale: Le terme signifie littéralement « frères ». Il peut désigner ici les proches, compatriotes ou compagnons d’Ittaï, mais le lien exprimé par l’hébreu est conservé dans le texte.
- source_word: חֶסֶד וֶאֱמֶת
  choice: l’amour fidèle et la fidélité
  rationale: Le binôme exprime une bonté loyale et une fiabilité constante. « Amour fidèle » restitue la portée relationnelle de חֶסֶד, et « fidélité » la solidité de אֱמֶת dans ce contexte.
theological_decisions:
- issue: Valeur de la formule nominale חֶסֶד וֶאֱמֶת en fin de verset
  choice: Que l’amour fidèle et la fidélité soient avec toi
  alternative: amour fidèle et fidélité ; que le Seigneur agisse envers toi avec amour fidèle et fidélité
  rationale: L’hébreu ne comporte pas de verbe explicite. Le contexte d’adieu permet de comprendre la formule comme un souhait de bénédiction, mais la traduction n’ajoute pas explicitement Dieu comme sujet, puisqu’il n’est pas nommé dans le texte massorétique.
translation_notes:
  register: Français international actuel, digne et directement intelligible. L’inversion interrogative conserve le ton de la question de David. « Je vais je ne sais où » est idiomatique en français tout en signalant l’incertitude présente dans l’expression hébraïque. Aucun référent divin absent de l’hébreu n’est ajouté dans la bénédiction finale.
