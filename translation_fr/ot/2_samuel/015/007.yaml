base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: fr
  text: 'Au bout de quarante ans[a], Absalom dit au roi : « Laisse-moi aller m’acquitter à Hébron du vœu que j’ai fait au SEIGNEUR. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins anciens portent « quatre ans » ; le texte hébreu traditionnel porte « quarante ans ».
    reason: La variante « quatre ans » atténue une difficulté chronologique importante, mais le texte source WLC lit « quarante ans » ; elle doit donc être signalée sans correction silencieuse.
lexical_decisions:
- source_word: מִקֵּץ
  choice: Au bout de
  rationale: Rend naturellement l’idée temporelle d’une période arrivée à son terme.
- source_word: וַאֲשַׁלֵּם אֶת־נִדְרִי
  choice: accomplir le vœu que j’ai fait
  rationale: Le verbe שׁלם exprime ici l’exécution ou l’acquittement d’un vœu ; « accomplir un vœu » est une formulation française claire et usuelle.
- source_word: לַיהוָה
  choice: au SEIGNEUR
  rationale: Rend le tétragramme divin par la convention française en petites capitales, sans le confondre avec le titre ordinaire « Seigneur ».
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: Dans le contexte immédiat, Hébron désigne naturellement le lieu où Absalom demande à se rendre pour accomplir son vœu.
theological_decisions:
- issue: Durée de quarante ans
  choice: Conserver « quarante ans » dans le texte
  alternative: « quatre ans » d’après certains témoins anciens
  rationale: Le texte massorétique fourni porte explicitement « quarante ». La difficulté chronologique et la variante ancienne sont signalées en note plutôt que résolues silencieusement.
- issue: Nom divin יהוה
  choice: SEIGNEUR
  alternative: YHWH / Yahvé / l’Éternel
  rationale: Cette convention française reconnaissable représente le nom divin tout en évitant d’imposer une vocalisation reconstruite.
translation_notes:
  register: Français moderne, courant et digne. La demande « Permets-moi » restitue la particule de politesse נָא sans lourdeur. L’ordre de la phrase place « à Hébron » après « aller » afin d’éviter l’ambiguïté peu naturelle selon laquelle le vœu aurait nécessairement été prononcé à Hébron.
