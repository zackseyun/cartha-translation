  text: וַ/יָּ֨שֶׁב צָד֧וֹק וְ/אֶבְיָתָ֛ר אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים יְרוּשָׁלִָ֑ם וַ/יֵּשְׁב֖וּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/029.yaml
  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: fr
  text: Ainsi, Sadoc et Abiatar ramenèrent l’arche de Dieu à Jérusalem et y restèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ramenèrent
  rationale: 'Le hiphil de שׁוב a ici un sens causatif et transitif : Sadoc et Abiatar font revenir l’arche, c’est-à-dire qu’ils la ramènent. « Ramenèrent » est naturel et précis en français.'
- source_word: צָדוֹק וְאֶבְיָתָר
  choice: Sadoc et Abiatar
  rationale: Formes françaises traditionnelles et largement reconnues de ces noms propres bibliques.
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Reproduit l’expression hébraïque exacte sans ajouter « de l’alliance », absent de ce verset.
- source_word: יְרוּשָׁלָם
  choice: à Jérusalem
  rationale: La préposition française explicite la destination impliquée par le verbe de retour et le nom de lieu.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: et y restèrent
  rationale: Dans ce contexte narratif, ישׁב indique qu’ils demeurèrent sur place. « Y restèrent » est idiomatique, clair et évite la lourdeur de « restèrent là » après la mention de Jérusalem.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La formulation conserve la concision de l’hébreu et l’expression exacte « l’arche de Dieu ».
