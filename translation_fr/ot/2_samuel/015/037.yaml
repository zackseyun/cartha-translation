  text: וַ/יָּבֹ֥א חוּשַׁ֛י רֵעֶ֥ה דָוִ֖ד הָ/עִ֑יר וְ/אַבְשָׁלֹ֔ם יָבֹ֖א יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: fr
  text: Ainsi, Houshaï, l’ami de David, entra dans la ville, au moment où Absalom entrait dans Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et Absalom entra dans Jérusalem ». La conjonction hébraïque peut être comprise comme un simple « et », et le verbe peut être rendu au passé simple.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva dans
  rationale: Le verbe בוא exprime ici l’arrivée ou l’entrée. Avec « la ville », « arriva dans » rend naturellement le mouvement vers l’intérieur sans surinterpréter.
- source_word: חוּשַׁי
  choice: Houshaï
  rationale: Transcription française usuelle du nom hébreu.
- source_word: רֵעֶה דָוִד
  choice: l’ami de David
  rationale: רֵעֶה désigne un ami, un compagnon ou un proche. « Ami » est direct et n’impose pas la fonction plus précise de conseiller.
- source_word: הָעִיר
  choice: la ville
  rationale: Le nom commun défini est conservé; le contexte l’identifie à Jérusalem sans que le texte remplace ici le nom commun par le nom propre.
- source_word: וְאַבְשָׁלֹם יָבֹא
  choice: au moment où Absalom entrait
  rationale: Après le wayyiqtol initial, le yiqtol יָבֹא peut présenter une action concomitante ou d’arrière-plan. Cette formulation française rend clairement le chevauchement temporel tout en signalant en note la lecture séquentielle possible.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française standard du nom de lieu.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Au moment où » évite l’ambiguïté stylistique de « comme » et exprime la concomitance suggérée par le changement de forme verbale. Le marqueur de note est placé après la proposition concernée.
