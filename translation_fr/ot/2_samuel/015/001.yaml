  text: וַֽ/יְהִי֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יַּ֤עַשׂ ל/וֹ֙ אַבְשָׁל֔וֹם מֶרְכָּבָ֖ה וְ/סֻסִ֑ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: fr
  text: Après cela, Absalom se procura[a] un char, des chevaux et cinquante hommes qui couraient devant lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se fit » ou « se pourvut de ». Le verbe hébreu peut exprimer ici le fait de faire ou de se procurer quelque chose.
    reason: lexical_alternative
  - marker: b
    text: Ces cinquante hommes courant devant Absalom constituent une escorte comparable à celle d’un roi et donnent publiquement de l’éclat à son cortège.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette formulation française naturelle conserve le lien temporel exprimé par la formule narrative hébraïque sans la reproduire de manière pesante.
- source_word: וַיַּעַשׂ לוֹ
  choice: se procura
  rationale: Dans ce contexte, עשה avec לו peut désigner le fait de faire, d’obtenir ou de se pourvoir de quelque chose. « Se procura » rend naturellement la nuance réflexive et convient à l’ensemble formé par le char, les chevaux et l’escorte.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: La forme française traditionnelle et largement reconnue du nom hébreu est conservée.
- source_word: מֶרְכָּבָה
  choice: un char
  rationale: Le nom désigne directement un char. Ajouter « royal » rendrait explicite une portée politique que le texte laisse implicite.
- source_word: וְסֻסִים
  choice: des chevaux
  rationale: Le pluriel indéfini traduit simplement le terme hébreu et s’intègre naturellement à l’énumération française.
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: et cinquante hommes
  rationale: Après un nombre, אִישׁ sert ici à compter des personnes de sexe masculin. La coordination maintient ces hommes dans l’ensemble qu’Absalom se constitue.
- source_word: רָצִים
  choice: qui couraient
  rationale: Le participe hébreu décrit l’action ou la fonction continue de ces hommes. La proposition relative est idiomatique en français et conserve l’image concrète.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: L’expression indique que les hommes se déplaçaient en avant d’Absalom dans son cortège.
theological_decisions:
- issue: Portée politique du cortège d’Absalom
  choice: Décrire le char, les chevaux et les coureurs sans qualifier explicitement le cortège de royal.
  alternative: Absalom se constitua un cortège de style royal.
  rationale: L’équipement évoque une mise en scène royale et l’ambition d’Absalom, mais le texte hébreu se limite à décrire ce qu’il se procure. La traduction laisse donc au lecteur la portée implicite de la scène.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise et narrative; elle préserve l’énumération hébraïque ainsi que la portée politique implicite de la scène.
