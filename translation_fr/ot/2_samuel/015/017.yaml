- from: Le roi sortit, accompagné de tout le peuple à pied, et ils s’arrêtèrent à la maison éloignée[a].
  to: Le roi sortit, suivi de tout le peuple, et ils s’arrêtèrent à la maison éloignée[a].
  rationale: La révision remplace une formulation française ambiguë par « suivi de tout le peuple », qui restitue le lien de suite exprimé par l’idiome בְּרַגְלָיו sans affirmer que le roi ou le groupe marchait nécessairement à pied. Elle conserve la traduction prudente de בֵּית הַמֶּרְחָק et sa note d’ambiguïté.
  reviewer_model: gpt-5.6-terra
