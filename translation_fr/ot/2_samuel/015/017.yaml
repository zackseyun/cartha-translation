  yaml_path: translation/ot/2_samuel/015/017.yaml
  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: fr
  text: Le roi sortit, suivi de tout le peuple, et ils s’arrêtèrent à la maison éloignée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être un nom de lieu : « Beth-Merhaq ». L’expression hébraïque peut se comprendre comme « maison de l’éloignement » ; beaucoup y voient une désignation de la dernière maison, à l’extrémité de la ville.'
    reason: Lecture alternative d’une expression hébraïque qui peut être descriptive ou constituer un nom de lieu.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le qal narratif de יצא exprime ici le fait de sortir ou de partir; « sortit » reste direct et naturel dans ce contexte.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne David dans le contexte; la traduction usuelle convient.
- source_word: וְכָל הָעָם
  choice: tout le peuple
  rationale: עָם désigne l’ensemble de ceux qui accompagnent le roi, sans permettre de les réduire aux seuls soldats.
- source_word: בְּרַגְלָיו
  choice: accompagné de … à pied
  rationale: L’expression signifie littéralement « à ses pieds » et évoque ceux qui suivent le roi, vraisemblablement à pied. Cette formulation française restitue à la fois l’accompagnement et le mode de déplacement.
- source_word: וַיַּעַמְדוּ
  choice: ils s’arrêtèrent
  rationale: Dans un récit de déplacement, עמד indique naturellement que le groupe s’arrête, plutôt que le simple fait de se tenir debout.
- source_word: בֵּית הַמֶּרְחָק
  choice: à la maison éloignée
  rationale: La traduction conserve le sens littéral de « maison de l’éloignement » sans imposer l’interprétation plus précise de « dernière maison »; la possibilité d’un nom de lieu est signalée en note.
