  rationale: La révision remplace deux formulations françaises peu naturelles tout en préservant la valeur habituelle du récit, la portée collective de « tout Israël », le cadre judiciaire et la métaphore critique du texte hébreu. La note demeure correctement ancrée après l’expression idiomatique qu’elle explique.
