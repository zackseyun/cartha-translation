  text: וַ/יַּ֨עַשׂ אַבְשָׁל֜וֹם כַּ/דָּבָ֤ר הַ/זֶּה֙ לְ/כָל יִשְׂרָאֵ֔ל אֲשֶׁר יָבֹ֥אוּ לַ/מִּשְׁפָּ֖ט אֶל הַ/מֶּ֑לֶךְ וַ/יְגַנֵּב֙ אַבְשָׁל֔וֹם אֶת לֵ֖ב אַנְשֵׁ֥י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: fr
  text: Absalom agissait ainsi avec tous les Israélites qui venaient demander justice au roi. C’est ainsi qu’Absalom volait le cœur des hommes d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gagnait le cœur des hommes d’Israël ». L’hébreu dit littéralement « volait le cœur », image qui suggère qu’Absalom gagnait leur loyauté de manière furtive ou manipulatrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אַבְשָׁלוֹם כַּדָּבָר הַזֶּה
  choice: Absalom agissait ainsi
  rationale: L’imparfait français exprime naturellement la conduite répétée décrite par le récit, tandis que « ainsi » renvoie aux gestes rapportés au verset précédent.
- source_word: לְכָל יִשְׂרָאֵל אֲשֶׁר יָבֹאוּ
  choice: envers tous ceux d’Israël qui venaient
  rationale: « Envers » marque les personnes visées par la conduite d’Absalom. « Ceux d’Israël » conserve la portée collective sans faire de « tout Israël » l’antécédent grammatical d’un relatif singulier.
- source_word: לַמִּשְׁפָּט אֶל הַמֶּלֶךְ
  choice: trouver le roi pour obtenir un jugement
  rationale: מִשְׁפָּט désigne ici une décision judiciaire. « Obtenir un jugement » rend clairement le but de leur venue sans élargir le terme au concept général de justice.
- source_word: וַיְגַנֵּב ... אֶת לֵב
  choice: volait le cœur
  rationale: Le verbe גנב signifie littéralement « voler ». Le maintien de la métaphore conserve l’idée d’une loyauté acquise de manière furtive ou manipulatrice; le singulier collectif « le cœur » suit de près l’hébreu et reste intelligible en français.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: des hommes d’Israël
  rationale: Le substantif אַנְשֵׁי est explicitement masculin. « Hommes d’Israël » en conserve la forme, même si l’expression peut représenter plus largement la population.
theological_decisions:
- issue: Portée de l’expression masculine אַנְשֵׁי יִשְׂרָאֵל
  choice: les hommes d’Israël
  alternative: le peuple d’Israël / les Israélites
  rationale: Le texte hébreu emploie le nom masculin « hommes ». La traduction le préserve sans décider que l’expression exclut nécessairement toute portée représentative plus large.
- issue: Valeur morale de l’idiome « voler le cœur »
  choice: conserver la métaphore dans le texte
  alternative: gagner le cœur / gagner la faveur
  rationale: Une paraphrase positive comme « gagner le cœur » atténuerait la nuance de furtivité et de manipulation portée par גנב. La métaphore laisse subsister la force critique du récit.
translation_notes:
  register: Français moderne, courant et digne. L’imparfait souligne l’habitude. La métaphore hébraïque volontairement marquante est conservée, puis explicitée en note.
