  yaml_path: translation/ot/2_samuel/015/009.yaml
  text: The king said to him, “Go in peace.” So he arose and went to Hebron.
translation:
  language: fr
  text: 'Le roi lui dit : « Va en paix. » Alors il se leva et partit pour Hébron.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe narratif אמר introduit ici une parole directe ; « dit » est l’équivalent français le plus simple et naturel.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne David dans le contexte, mais conserver « le roi » respecte l’expression hébraïque sans explicitation inutile.
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif de הלך appelle le verbe courant « aller » ; « Va » convient naturellement à cette formule de congé.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: La locution exprime un départ accompagné de paix ou d’une bénédiction ; « Va en paix » est idiomatique et reste proche de la construction hébraïque.
- source_word: וַיָּקָם
  choice: il se leva
  rationale: Le qal de קום marque le fait de se lever avant de partir ; « se leva » est naturel dans un récit français de registre digne.
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Après « il se leva », « partit » rend clairement le mouvement de départ et évite la répétition de « aller », tout en exprimant le sens contextuel de הלך.
- source_word: חֶבְרוֹנָה
  choice: pour Hébron
  rationale: Le hé directionnel indique un mouvement vers Hébron ; en français, « partir pour Hébron » exprime naturellement cette destination.
