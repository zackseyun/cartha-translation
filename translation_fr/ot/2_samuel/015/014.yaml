  source_fidelity: 'Le sens général est fidèle : David ordonne une fuite immédiate devant Absalom, redoute d’être rejoint, l’arrivée d’un malheur et l’attaque de la ville par l’épée. Toutefois, « aucun de nous n’échappera » transforme légèrement l’absence d’issue pour le groupe en une affirmation explicite qu’aucun individu ne survivra ou ne s’échappera. « Il n’y aura pour nous aucun moyen d’échapper » rend plus directement פְלֵיטָה sans cette surdétermination.'
