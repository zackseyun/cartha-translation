  text: וַ/יֹּ֣אמֶר דָּ֠וִד לְ/כָל עֲבָדָ֨י/ו אֲשֶׁר אִתּ֤/וֹ בִ/ירוּשָׁלִַ֨ם֙ ק֣וּמוּ וְ/נִבְרָ֔חָה כִּ֛י לֹא תִֽהְיֶה לָּ֥/נוּ פְלֵיטָ֖ה מִ/פְּנֵ֣י אַבְשָׁל֑וֹם מַהֲר֣וּ לָ/לֶ֗כֶת פֶּן יְמַהֵ֤ר וְ/הִשִּׂגָ֨/נוּ֙ וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה וְ/הִכָּ֥ה הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: fr
  text: 'Alors David dit à tous ses serviteurs qui étaient avec lui à Jérusalem : « Debout ! Fuyons, car il n’y aura pour nous aucun moyen d’échapper à Absalom. Hâtez-vous de partir, de peur qu’il ne nous rattrape rapidement, ne fasse tomber le malheur sur nous et ne passe la ville au fil de l’épée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne frappe la ville à la bouche de l’épée ». Cette expression hébraïque désigne une attaque meurtrière, un massacre par l’épée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans le contexte de la cour royale, le terme désigne naturellement les serviteurs, officiers et gens attachés à David, sans imposer le statut plus précis d’esclaves.
- source_word: קוּמוּ וְנִבְרָחָה
  choice: Debout ! Fuyons
  rationale: L’impératif suivi du cohortatif exprime un appel urgent à se mettre en mouvement, David s’incluant dans la fuite.
- source_word: פְלֵיטָה
  choice: aucun de nous n’échappera
  rationale: Cette formulation française naturelle rend l’absence totale d’échappatoire ou de survivant ayant pu fuir, sans suggérer explicitement une délivrance divine.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: Hâtez-vous de partir
  rationale: L’impératif et l’infinitif marquent l’urgence d’un départ immédiat; « partir » est plus idiomatique en français que le calque « aller ».
- source_word: פֶּן יְמַהֵר וְהִשִּׂגָנוּ
  choice: de peur qu’il ne nous rattrape rapidement
  rationale: « De peur que » conserve la valeur préventive de פֶּן, tandis que « rattraper » convient à une poursuite.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: ne fasse tomber le malheur sur nous
  rationale: Ici רָעָה désigne une calamité plutôt qu’un mal moral; la tournure conserve l’image d’un malheur causé contre eux.
- source_word: וְהִכָּה הָעִיר לְפִי חָרֶב
  choice: ne passe la ville au fil de l’épée
  rationale: Cette expression française consacrée rend l’idiome hébreu « à la bouche de l’épée » et indique le massacre de la population par l’épée.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le discours conserve l’urgence militaire par des phrases brèves et des impératifs. « Hâtez-vous » et « au fil de l’épée » relèvent d’un registre légèrement soutenu mais restent largement compréhensibles.
