  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אַבְשָׁל֔וֹם רְאֵ֥ה דְבָרֶ֖/ךָ טוֹבִ֣ים וּ/נְכֹחִ֑ים וְ/שֹׁמֵ֥עַ אֵין לְ/ךָ֖ מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: fr
  text: 'Absalom lui dit alors : « Regarde, ce que tu avances est bon et juste[a], mais personne n’est mandaté par le roi pour t’entendre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « ta cause est bonne et juste ». Le mot hébreu peut signifier « parole », « affaire » ou, dans un contexte judiciaire, « cause » ou « requête ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il n’y a pour toi personne qui écoute de la part du roi » ; il s’agit de quelqu’un chargé par le roi d’entendre la cause.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: Absalom lui dit alors
  rationale: Le wayyiqtol fait progresser le récit. « Alors » rend naturellement cette succession en français, tandis que « lui » conserve le complément pronominal.
- source_word: רְאֵה
  choice: Regarde
  rationale: L’impératif sert ici à attirer l’attention de l’interlocuteur. « Regarde » est direct, actuel et naturel.
- source_word: דְבָרֶךָ
  choice: ce que tu avances
  rationale: דָּבָר peut désigner une parole, une affaire ou, dans ce contexte judiciaire, les éléments d’une cause. Cette formulation française reste naturelle tout en évitant de réduire le terme à un sens trop précis.
- source_word: טוֹבִים וּנְכֹחִים
  choice: bon et juste
  rationale: « Bon » conserve l’évaluation générale de טוֹב, et « juste » exprime ici l’idée de droiture, de correction ou de bien-fondé portée par נָכוֹחַ.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: mais il n’y a personne, de la part du roi, pour t’entendre
  rationale: La tournure conserve l’image hébraïque d’un « auditeur » venant de la part du roi. Dans ce cadre judiciaire, « entendre » peut désigner l’examen d’une cause, sans préciser dans le texte principal une fonction officielle non explicitement nommée.
