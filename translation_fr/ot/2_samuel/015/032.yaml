  text: וַ/יְהִ֤י דָוִד֙ בָּ֣א עַד הָ/רֹ֔אשׁ אֲשֶֽׁר יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵ/אלֹהִ֑ים וְ/הִנֵּ֤ה לִ/קְרָאת/וֹ֙ חוּשַׁ֣י הָ/אַרְכִּ֔י קָר֨וּעַ֙ כֻּתָּנְתּ֔/וֹ וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: fr
  text: Lorsque David arriva au sommet, là où il se prosternait devant Dieu[a], voici[b] que Houshaï l’Arkite vint à sa rencontre, sa tunique déchirée et de la terre sur la tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu peut désigner soit une action passée, soit une pratique habituelle : « là où il avait coutume de se prosterner devant Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: « Voici » traduit un marqueur narratif hébreu qui souligne l’apparition soudaine de Houshaï.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: le sommet
  rationale: Littéralement « la tête » ; dans ce contexte topographique, le mot désigne le haut ou le sommet du lieu.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: là où il se prosternait devant Dieu
  rationale: Le verbe exprime littéralement l’action de se prosterner et, avec Dieu comme complément, désigne un acte d’adoration. L’imparfait français conserve une certaine ouverture entre une action passée située dans le récit et une pratique habituelle.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française, digne mais encore courante dans le récit, restitue le marqueur hébreu qui attire soudain l’attention sur l’arrivée de Houshaï.
- source_word: לִקְרָאתוֹ
  choice: vint à sa rencontre
  rationale: La locution indique un mouvement en vue d’une rencontre ; le verbe « vint » est naturellement explicité en français d’après le contexte.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Houshaï l’Arkite
  rationale: Le nom propre est translittéré en français moderne et le gentilé est rendu sous la forme traditionnelle « Arkite ».
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: la tunique déchirée
  rationale: כֻּתֹּנֶת désigne un vêtement de type tunique, et קָרוּעַ en décrit l’état résultant, signe de deuil ou de détresse.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: et de la terre sur la tête
  rationale: אֲדָמָה signifie proprement « sol, terre ». « De la terre » préserve cette valeur plus large que « poussière » et reste naturel dans ce geste de deuil.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Se prosterner devant Dieu » garde l’image concrète de l’hébreu tout en exprimant clairement l’adoration ; « voici que » conserve la vivacité narrative sans devenir excessivement archaïque.
