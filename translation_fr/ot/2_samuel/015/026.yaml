  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: fr
  text: 'Mais s’il dit : « Je ne trouve aucun plaisir en toi[a] », me voici ; qu’il fasse de moi ce qui lui semble bon[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne prends pas plaisir en toi. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce qui est bon à ses yeux » ; expression signifiant « ce qui lui semble bon ».'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: La conjonction introduit ici l’éventualité opposée à celle du verset précédent ; « Mais s’il » rend à la fois le contraste et la condition.
- source_word: כֹּה יֹאמַר
  choice: il dit
  rationale: כֹּה introduit idiomatiquement les paroles citées, sans nécessiter d’équivalent distinct en français. L’imparfait hébreu exprime une éventualité future, que le présent français rend naturellement après « si ».
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: Je ne trouve aucun plaisir en toi
  rationale: חפץ ב exprime le plaisir ou la satisfaction que l’on trouve en quelqu’un. Cette formulation conserve la portée relationnelle et évaluative du verbe sans lui donner un sens physique ou seulement volitif.
- source_word: הִנְנִי
  choice: me voici
  rationale: Formule conventionnelle de présentation de soi, elle exprime ici la disponibilité et la soumission. « Me voici » est naturel, sobre et fidèle à cette force.
- source_word: יַעֲשֶׂה לִּי
  choice: qu’il fasse de moi
  rationale: La forme verbale exprime l’acceptation de l’action divine. Le subjonctif français rend cette soumission volontaire sans transformer l’énoncé en simple prédiction.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: ce qui lui semble bon
  rationale: L’expression hébraïque « ce qui est bon à ses yeux » désigne ce que quelqu’un juge bon. La formulation retenue transmet clairement cet idiome en français moderne, tandis que la note en conserve l’image littérale.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Maintenir les pronoms « il » et « lui », qui renvoient à l’Éternel d’après le contexte
  alternative: Remplacer les pronoms par « l’Éternel » ou employer des majuscules de révérence
  rationale: L’hébreu emploie des formes pronominales sans répéter le nom divin. Les conserver respecte cette formulation et évite d’ajouter une convention typographique absente de la source.
- issue: Portée de la déclaration « me voici »
  choice: La rendre comme une expression de disponibilité et de soumission
  alternative: L’expliciter par « je me soumets » ou « je suis prêt »
  rationale: L’explicitation lèverait une richesse de sens que la formule hébraïque laisse ouverte ; « me voici » permet de préserver à la fois la présence, la disponibilité et l’acceptation.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue clairement les paroles rapportées. « Me voici » conserve une formule biblique encore intelligible aujourd’hui, tandis que l’idiome final est rendu naturellement dans le texte et expliqué en note.
