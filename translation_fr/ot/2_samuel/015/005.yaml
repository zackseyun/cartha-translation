  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: fr
  text: Et chaque fois qu’un homme s’approchait pour se prosterner devant lui[a], Absalom lui tendait la main, lui prenait la main et l’embrassait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui rendre hommage ». Le verbe hébreu peut désigner un geste respectueux de prosternation, sans nécessairement parler d’adoration au sens religieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Et chaque fois que… Absalom…
  rationale: Dans ce contexte narratif, la construction introduit une action habituelle et répétée. « Chaque fois que » l’exprime naturellement en français.
- source_word: בִּקְרָב אִישׁ
  choice: qu’un homme s’approchait
  rationale: Le verbe exprime le fait de s’approcher, et אִישׁ est conservé au masculin singulier conformément à la formulation hébraïque.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: pour se prosterner devant lui
  rationale: Le verbe désigne un geste physique d’abaissement ou de prosternation en signe de respect ou d’hommage, sans impliquer nécessairement un culte religieux.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: lui tendait la main
  rationale: Cette expression française naturelle rend l’action d’étendre la main vers la personne. Le pronom « lui » explicite la direction déjà indiquée par le contexte.
- source_word: וְהֶחֱזִיק לוֹ
  choice: le saisissait
  rationale: Le hifil de חזק signifie ici prendre ou retenir quelqu’un. « Saisissait » préserve la vigueur du geste sans lui donner nécessairement un caractère hostile.
- source_word: וְנָשַׁק לוֹ
  choice: et l’embrassait
  rationale: Le verbe signifie simplement « embrasser »; dans le contexte, il s’agit d’un geste social et politique de faveur.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. Le nom « Absalom » est repris dans la principale pour éviter l’ambiguïté des pronoms français et rendre clairement la succession des gestes. La valeur habituelle de la phrase hébraïque est conservée par l’imparfait et « chaque fois que ».
