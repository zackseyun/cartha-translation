translation_notes:
  register: Français international moderne, sobre et digne. Les imparfaits installent la scène et rendent les actions en cours. La répétition hébraïque de la montée est volontairement maintenue, malgré son caractère marqué en français, afin de préserver l’emphase et la vive progression du récit.
