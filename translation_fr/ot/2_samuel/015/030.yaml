  text: וְ/דָוִ֡ד עֹלֶה֩ בְ/מַעֲלֵ֨ה הַ/זֵּיתִ֜ים עֹלֶ֣ה וּ/בוֹכֶ֗ה וְ/רֹ֥אשׁ ל/וֹ֙ חָפ֔וּי וְ/ה֖וּא הֹלֵ֣ךְ יָחֵ֑ף וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ חָפוּ֙ אִ֣ישׁ רֹאשׁ֔/וֹ וְ/עָל֥וּ עָלֹ֖ה וּ/בָכֹֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: fr
  text: David gravissait la montée du mont des Oliviers[a], montant et pleurant, la tête couverte ; il marchait pieds nus. Tous ceux qui étaient avec lui se couvrirent chacun la tête[b], et ils montèrent en pleurant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la montée des Oliviers » ; l’expression désigne la montée du mont des Oliviers.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chaque homme se couvrit la tête » ; l’hébreu emploie un singulier distributif.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « ils montèrent, montant et pleurant » ; la répétition souligne et prolonge l’action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: la montée des Oliviers
  rationale: מַעֲלֵה désigne une montée, une pente ou le chemin qui monte. « des Oliviers » conserve ici le toponyme traditionnel sans ajouter dans le corps du verset le mot « mont », absent de la formulation hébraïque.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: montait ... il montait en pleurant
  rationale: Le participe répété présente une action en cours et donne à la scène un caractère vif et prolongé. L’imparfait français et la répétition rendent cette valeur durative.
- source_word: בֹּכֶה
  choice: en pleurant
  rationale: « Pleurer » exprime directement l’action physique et émotionnelle, sans lui ajouter la nuance plus formelle d’une lamentation rituelle.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: la tête couverte
  rationale: Cette formulation naturelle conserve l’état décrit par חָפוּי sans préciser de quelle manière la tête était couverte.
- source_word: יָחֵף
  choice: pieds nus
  rationale: Équivalent français moderne, courant et précis.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: tous ceux qui étaient avec lui
  rationale: Le contexte désigne l’ensemble des personnes accompagnant David. Cette formulation reste générale et n’impose pas un sens exclusivement militaire.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: se couvrirent chacun la tête
  rationale: 'אִישׁ a ici une fonction distributive : chaque personne accomplit le geste. « Chacun » en préserve clairement la portée.'
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: ils montaient, montant et pleurant
  rationale: Le verbe suivi de formes infinitives crée une répétition emphatique et une progression prolongée. La tournure française garde cette insistance inhabituelle plutôt que de l’effacer entièrement.
