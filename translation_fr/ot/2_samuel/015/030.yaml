  source_fidelity: La montée est plus clairement rendue comme « la montée du mont des Oliviers », correspondant à la construction topographique hébraïque et à l’usage français établi. La dernière proposition doit conserver le verbe narratif au passé (« ils montèrent »), plutôt que l’imparfait du brouillon, tout en signalant la répétition emphatique des formes hébraïques.
  naturalness: « Ils montaient, montant et pleurant » est à la fois lourd et grammaticalement peu naturel en français moderne. « Ils montèrent en pleurant » est fluide; la note explique explicitement la répétition source que le français ne peut reproduire sans maladresse. La révision conserve le caractère de deuil de la scène.
  terminology: « Mont des Oliviers » est le toponyme français usuel. « La tête couverte » et « pieds nus » sont exacts et de registre sobre. « Tous ceux qui étaient avec lui » conserve l’extension non spécifiquement militaire de הָעָם.
