  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: fr
  text: 'Alors David dit à Ittaï : « Va, traverse. » Ittaï le Guitthien traversa donc avec tous ses hommes et tous les enfants qui étaient avec lui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: Va, traverse
  rationale: Les deux impératifs sont conservés avec une formulation française directe et naturelle. Le contexte indique le franchissement du torrent du Cédron, sans qu’il soit nécessaire d’ajouter ici un complément absent de l’hébreu.
- source_word: הַגִּתִּי
  choice: le Guitthien
  rationale: Gentilé biblique traditionnel désignant un homme de Gath; il permet de distinguer l’origine d’Ittaï sans paraphrase.
- source_word: הַטַּף
  choice: les enfants
  rationale: Le terme collectif désigne les jeunes enfants ou personnes à charge accompagnant le groupe. « Les enfants » est ici plus naturel en français que « les petits », tout en conservant le sens contextuel.
