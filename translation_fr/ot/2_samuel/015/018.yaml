revisions:
- from: Tous ses serviteurs passaient à ses côtés. Tous les Kérétiens, tous les Pélétiens et tous les Guitiens — six cents hommes qui l’avaient accompagné à pied depuis Gath[a] — passaient devant le roi.
  to: Tous ses serviteurs passaient à ses côtés. Tous les Kérétiens, tous les Pélétiens et tous les Gathites — six cents hommes qui étaient venus avec lui depuis Gath[a] — passaient devant le roi.
  rationale: La révision évite de réduire dans le texte le syntagme hébreu lié au « pied » à une simple indication de déplacement, tout en conservant son image et ses lectures possibles dans la note. Elle corrige aussi la formulation du littéral dans la note et emploie un gentilé français plus clair pour les gens de Gath.
