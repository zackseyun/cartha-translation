base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: fr
  text: Tous ses serviteurs passaient à ses côtés. Tous les Kérétiens, tous les Pélétiens et tous les Gathites — six cents hommes qui étaient venus avec lui depuis Gath[a] — passaient devant le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui l’avaient suivi depuis Gath ». L’hébreu dit littéralement « qui étaient venus à son pied depuis Gath » ; cette expression peut désigner des hommes venus à la suite de quelqu’un, et peut aussi évoquer le fait de l’accompagner à pied.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme peut désigner des serviteurs, des hommes attachés au roi ou des fonctionnaires. « Serviteurs » conserve son sens fondamental sans préciser indûment leur charge.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: passaient à ses côtés
  rationale: L’expression עַל יָד situe les serviteurs à côté de David. Le pluriel français rend naturellement cette proximité spatiale.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: les Kérétiens et les Pélétiens
  rationale: Ces désignations de groupes au service de David sont translittérées plutôt qu’interprétées.
- source_word: הַגִּתִּים
  choice: les Guitiens
  rationale: Ce gentilé désigne les gens originaires de Gath; la forme française traditionnelle et transparente « Guitiens » est conservée.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: six cents hommes
  rationale: אִישׁ sert ici à compter des hommes; « soldats » expliciterait une fonction militaire que le groupe nominal n’énonce pas directement.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: qui l’avaient accompagné à pied depuis Gath
  rationale: La tournure littérale liée au « pied » évoque le fait de venir à pied avec quelqu’un ou de l’accompagner dans sa suite. Cette formulation garde les deux éléments sans devenir obscure.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: passaient devant le roi
  rationale: עַל פְּנֵי signifie ici « devant, en présence de » dans la scène du défilé; la formulation française demeure naturelle et spatialement précise.
