  - severity: medium
    issue: La note donne « avec son pied » comme littéral.
    rationale: Cette formulation ne correspond pas à la construction hébraïque et est peu intelligible en français. « À son pied » est le littéral pertinent, avec une explication de l'usage idiomatique.
  - severity: low
    issue: « Guitiens » est une translittération française incertaine.
    rationale: « Gathites » est une forme plus immédiatement reconnaissable pour les habitants de Gath et demeure une désignation non interprétative.
