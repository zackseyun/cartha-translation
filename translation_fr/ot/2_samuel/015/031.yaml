source:
  edition: WLC
  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: fr
  text: 'On informa David en ces termes : « Ahitofel est parmi les conspirateurs aux côtés d’Absalom. » David dit : « Yahweh, je t’en prie, rends insensé le conseil[a] d’Ahitofel ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fais échouer le conseil d’Ahitofel ». L’hébreu demande plus littéralement que son conseil soit rendu insensé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: On informa David
  rationale: Le hiphil de נגד signifie ici « informer, rapporter ». La tournure impersonnelle avec « on » restitue naturellement en français l’absence de sujet explicite.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule introduit directement le contenu rapporté sans reproduire le calque peu naturel « en disant ».
- source_word: בַּקֹּשְׁרִים
  choice: parmi les conspirateurs
  rationale: Le participe pluriel substantivé désigne concrètement le groupe de ceux qui conspirent.
- source_word: עִם
  choice: aux côtés d’Absalom
  rationale: Cette expression rend l’association politique indiquée par עִם, plus clairement que le simple « avec » dans ce contexte.
- source_word: סַכֶּל
  choice: rends insensé
  rationale: Le piel impératif demande que le conseil soit rendu insensé ou déraisonnable. Cette formulation conserve l’image hébraïque, tandis que la note donne le sens fonctionnel possible.
- source_word: נָא
  choice: je t’en prie
  rationale: נא marque ici une supplication pressante. « Je t’en prie » convient à une prière directe et reste naturel en français moderne.
- source_word: עֲצַת
  choice: le conseil
  rationale: עֵצָה désigne ici l’avis stratégique donné par Ahitofel. Le singulier français conserve la forme et la portée du texte hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans une adresse directe
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. La translittération préserve le nom personnel sans lui substituer un titre.
- issue: Effet demandé sur le conseil d’Ahitofel
  choice: rends insensé le conseil
  alternative: fais échouer le conseil
  rationale: Le texte demande littéralement que le conseil soit rendu insensé, tout en pouvant impliquer son échec. Le corps du texte conserve l’image et la note signale l’interprétation fonctionnelle.
translation_notes:
  register: Français international moderne, digne et direct. « En ces termes » évite un hébraïsme lourd, tandis que la prière brève garde son urgence. Les noms propres suivent des formes françaises usuelles, sauf le nom divin translittéré « Yahweh ».
