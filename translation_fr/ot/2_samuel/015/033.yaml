  text: וַ/יֹּ֥אמֶר ל֖/וֹ דָּוִ֑ד אִ֚ם עָבַ֣רְתָּ אִתִּ֔/י וְ/הָיִ֥תָ עָלַ֖/י לְ/מַשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/033.yaml
  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: fr
  text: 'David lui dit : « Si tu continues la route avec moi[a], tu seras un fardeau pour moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Si tu traverses avec moi, tu seras un fardeau pour moi. » Le verbe hébreu peut signifier plus littéralement « passer » ou « traverser ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: David lui dit
  rationale: Le waw consécutif fait progresser le récit. En français narratif naturel, le passé simple rend cette progression sans qu’il soit nécessaire d’ajouter « et » ou « alors ».
- source_word: לוֹ
  choice: lui
  rationale: Le pronom hébreu est conservé sans expliciter son référent, Houshaï, qui ressort du contexte immédiat mais n’est pas nommé dans ce verset.
- source_word: אִם
  choice: Si
  rationale: Introduit directement la condition et correspond à l’expression française la plus simple et naturelle.
- source_word: עָבַרְתָּ אִתִּי
  choice: tu continues la route avec moi
  rationale: עבר signifie fondamentalement « passer, traverser » et, dans ce contexte de déplacement, évoque le fait de poursuivre le chemin en compagnie de David. Cette formulation française est naturelle tout en maintenant l’idée de mouvement continu.
- source_word: וְהָיִתָ עָלַי
  choice: tu seras … pour moi
  rationale: La construction היה avec על exprime ici l’effet pesant que la présence de Houshaï aurait sur David. La syntaxe française demande une reformulation idiomatique.
- source_word: לְמַשָּׂא
  choice: un fardeau
  rationale: מַשָּׂא désigne une charge ou un poids à porter. « Fardeau » convient au sens figuré personnel et garde l’image de quelque chose qui pèse.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Continues la route » explicite sobrement l’idée contextuelle de poursuivre le déplacement; la note conserve la valeur plus littérale du verbe.
