lexical_decisions:
- source_word: וַיָּבֹא הַמַּגִּיד
  choice: Un messager vint trouver
  rationale: Le participe défini désigne celui qui apporte la nouvelle; en français, l’indéfini introduit naturellement ce nouveau participant. « Vint trouver » rend le mouvement vers David et fait avancer le récit.
- source_word: לֵאמֹר
  choice: et lui dit
  rationale: Cette tournure française naturelle introduit le discours direct tout en rendant la fonction de l’infinitif hébreu.
- source_word: הָיָה לֶב אִישׁ יִשְׂרָאֵל אַחֲרֵי
  choice: Les hommes d’Israël ont rallié
  rationale: L’expression littérale du cœur qui est ou devient « derrière » quelqu’un décrit ici un transfert d’adhésion politique. « Ont rallié » communique clairement ce mouvement d’allégeance, tandis que la note conserve l’image hébraïque.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le singulier collectif אִישׁ renvoie ici aux hommes d’Israël, vraisemblablement envisagés dans leur rôle politique ou militaire; la formulation garde cette précision de genre.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Forme française traditionnelle et courante du nom propre.
