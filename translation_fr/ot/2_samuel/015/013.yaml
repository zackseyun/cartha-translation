  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: fr
  text: 'Un messager vint trouver David et lui dit : « Les hommes d’Israël se sont ralliés à Absalom.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le cœur des hommes d’Israël est derrière Absalom », expression qui indique leur loyauté ou leur allégeance envers lui.'
