    issue: La formulation « Les hommes d’Israël ont rallié Absalom » est ambiguë et moins idiomatique.
    rationale: En français, « rallier quelqu’un » peut signifier l’amener à sa cause ou le rejoindre selon le contexte. « Se rallier à Absalom » exprime clairement l’adhésion des Israélites à Absalom, qui est le sens de l’idiome hébreu.
  - severity: low
    issue: La note qualifie de littérale une formulation comprenant « est passé derrière ».
    rationale: Le texte hébreu dit littéralement que « le cœur ... est/était derrière Absalom »; « est passé » explicite un changement qui relève de l’interprétation de l’idiome plutôt que de la formulation littérale.
