base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: fr
  text: Le roi sortit, et toute sa maisonnée le suivit à pied[a]. Le roi laissa dix femmes, des concubines, pour garder la maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « à ses pieds ». L’expression peut indiquer qu’ils le suivaient à pied.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא décrit ici le départ concret du roi dans la suite narrative. « Sortit » en conserve le mouvement sans ajouter l'idée d'abandon.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte hébreu emploie le titre défini plutôt que le nom de David; la traduction le conserve.
- source_word: וְכָל בֵּיתוֹ
  choice: et toute sa maisonnée
  rationale: בַּיִת désigne ici les personnes appartenant à la maison du roi. « Maisonnée » distingue ce groupe de la maison physique mentionnée à la fin du verset.
- source_word: בְּרַגְלָיו
  choice: le suivit à pied
  rationale: Littéralement « à ses pieds », l'expression indique dans ce contexte que la maisonnée allait derrière le roi à pied. La formulation française restitue naturellement les deux aspects.
- source_word: וַיַּעֲזֹב
  choice: laissa
  rationale: עזב signifie ici laisser sur place. « Abandonna » introduirait une nuance affective ou morale trop forte.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: dix femmes, des concubines
  rationale: Cette apposition conserve les deux substantifs hébreux et précise naturellement que ces femmes étaient des concubines.
- source_word: לִשְׁמֹר
  choice: pour garder
  rationale: שׁמר peut signifier garder, surveiller ou entretenir. « Garder » préserve cette amplitude et convient à la résidence laissée sur place.
- source_word: הַבָּיִת
  choice: la maison
  rationale: Le mot désigne ici la résidence royale, par contraste avec la maisonnée qui accompagne le roi. « Maison » reste plus proche du texte que l'interprétation « palais ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La répétition de « le roi » est maintenue comme dans l'hébreu. « Maisonnée » puis « maison » rend la distinction contextuelle entre les personnes de la maison royale et la résidence elle-même.
