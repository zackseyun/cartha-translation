base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: fr
  text: 'Mais si tu retournes dans la ville et dis à Absalom : « Je serai ton serviteur, ô roi ; de même que j’ai été autrefois le serviteur de ton père, je serai maintenant ton serviteur », alors tu feras échouer en ma faveur le conseil d’Ahitofel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאָז
  choice: autrefois
  rationale: Le terme renvoie ici au passé, à l’époque où Houshaï servait David ; « autrefois » est naturel et fidèle dans ce contexte.
- source_word: וְהֵפַרְתָּ
  choice: tu feras échouer
  rationale: Le verbe exprime l’action de rendre inopérant ou de faire avorter un projet ; cette tournure convient naturellement au « conseil » d’Ahitofel.
- source_word: עֲצַת
  choice: le conseil
  rationale: Le singulier hébreu désigne ici le plan ou la stratégie recommandée par Ahitofel, sans qu’il soit nécessaire de le mettre au pluriel.
