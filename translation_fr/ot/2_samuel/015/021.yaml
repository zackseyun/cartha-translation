base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: fr
  text: 'Ittaï répondit au roi : « Aussi vrai que Yahweh est vivant et que mon seigneur le roi est vivant, partout où sera mon seigneur le roi, que ce soit pour la mort ou pour la vie, ton serviteur sera là. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת הַמֶּלֶךְ וַיֹּאמַר
  choice: Ittaï répondit au roi
  rationale: Le doublet narratif hébreu « répondit… et dit » est rendu naturellement en français par « répondit », sans perte de contenu discursif.
- source_word: חַי יְהוָה וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: Aussi vrai que Yahweh est vivant et que mon seigneur le roi est vivant
  rationale: Cette formulation française conserve le parallélisme et la force solennelle de la formule de serment hébraïque.
- source_word: כִּי אִם
  choice: '[force exprimée par la déclaration solennelle qui suit]'
  rationale: Dans ce contexte de serment, la locution renforce l’assertion. Le français n’exige pas un adverbe supplémentaire après la formule « Aussi vrai que… ».
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: partout où sera
  rationale: Rend de façon naturelle la localisation ouverte exprimée en hébreu, tout en gardant la référence à la présence future du roi.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: que ce soit pour mourir ou pour vivre
  rationale: Conserve l’ordre hébreu, la construction alternative et l’engagement total d’Ittaï, en français courant et digne.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans cette adresse au roi, le mot est une autodésignation déférente; « serviteur » convient mieux ici que « esclave ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » maintient le nom personnel divin conformément à la politique fournie, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le serment conserve son parallélisme. « Mon seigneur le roi » et « ton serviteur » maintiennent la déférence de la scène sans archaïsme excessif.
