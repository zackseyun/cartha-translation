source:
  edition: WLC
  text: וְ/הִנֵּ֨ה גַם צָד֜וֹק וְ/כָֽל הַ/לְוִיִּ֣ם אִתּ֗/וֹ נֹֽשְׂאִים֙ אֶת אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים וַ/יַּצִּ֨קוּ֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יַּ֖עַל אֶבְיָתָ֑ר עַד תֹּ֥ם כָּל הָ/עָ֖ם לַ/עֲב֥וֹר מִן הָ/עִֽיר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: fr
  text: Et voici Zadok, lui aussi, avec tous les lévites qui étaient avec lui, portant l’arche de l’alliance de Dieu. Ils déposèrent l’arche de Dieu[b], et Abiathar monta[c], jusqu’à ce que tout le peuple ait fini de sortir de la ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Jérusalem.
    reason: cross_reference
  - marker: b
    text: 'Ou : « Ils placèrent l’arche de Dieu. » Le verbe hébreu peut désigner le fait de la déposer ou de la mettre en place.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « monta »; la nuance narrative précise de ce mouvement reste incertaine.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Marque vivement l’apparition d’un nouvel élément dans la scène, dans un français digne mais encore courant.
- source_word: גַם צָדוֹק
  choice: Zadok, lui aussi
  rationale: Rend explicitement la valeur additive de גַם sans alourdir la phrase.
- source_word: כָל הַלְוִיִּם אִתּוֹ
  choice: tous les lévites qui étaient avec lui
  rationale: Rend naturellement le groupe nominal et rattache « avec lui » à Zadok.
- source_word: נֹשְׂאִים
  choice: portant
  rationale: Le participe décrit l’action simultanée des lévites de manière directe.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: l’arche de l’alliance de Dieu
  rationale: Conserve toute la chaîne construite et la mention explicite de l’alliance.
- source_word: וַיַּצִּקוּ
  choice: Ils déposèrent
  rationale: Dans ce contexte, le verbe désigne vraisemblablement l’action de poser l’arche; la variante « placèrent » est signalée en note.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: Abiathar monta
  rationale: Préserve le sens premier de עלה et l’incertitude quant au mouvement exact dans la scène.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: jusqu’à ce que tout le peuple ait fini de sortir
  rationale: Exprime naturellement l’achèvement du passage; avec מִן הָעִיר, « sortir de la ville » rend clairement le mouvement depuis celle-ci.
- source_word: מִן הָעִיר
  choice: de la ville
  rationale: Conserve la désignation générique du texte hébreu plutôt que de substituer directement « Jérusalem ».
theological_decisions:
- issue: Identification de « la ville »
  choice: Maintenir « la ville » dans le texte
  alternative: Jérusalem
  rationale: Le contexte désigne Jérusalem, mais l’hébreu dit seulement « la ville »; l’identification est donc donnée en note.
- issue: Sens de וַיַּעַל אֶבְיָתָר
  choice: « Abiathar monta »
  alternative: « Abiathar s’avança » ou une interprétation liée à une activité sacerdotale
  rationale: Le verbe signifie d’abord monter. La traduction ne résout pas une nuance narrative incertaine ni n’introduit une activité cultuelle non explicitée.
- issue: Sens contextuel de וַיַּצִּקוּ
  choice: « Ils déposèrent »
  alternative: « Ils placèrent »
  rationale: Le contexte suggère que l’arche est posée, tout en laissant ouverte la nuance plus générale de positionnement dans une note.
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici » conserve la fonction de mise en relief de וְהִנֵּה sans employer l’archaïque « voici que » ou une interjection trop familière. Les répétitions relatives à l’arche sont maintenues, conformément au texte hébreu.
