  text: רְאוּ֙ אָנֹכִ֣י מִתְמַהְמֵ֔הַּ ב/עברות הַ/מִּדְבָּ֑ר עַ֣ד בּ֥וֹא דָבָ֛ר מֵ/עִמָּ/כֶ֖ם לְ/הַגִּ֥יד לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/028.yaml
  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: fr
  text: Voyez, je vais attendre[a] aux gués[b] du désert jusqu’à ce qu’un message de votre part vienne m’informer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je m’attarde » ou « je tarde ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aux passages du désert ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Voyez
  rationale: L’impératif pluriel sert à attirer directement l’attention des interlocuteurs. « Voyez » en conserve la force sans développer le texte.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom indépendant souligne le sujet. En français, cette insistance est portée naturellement par la tournure directe, sans ajouter le lourd « moi-même ».
- source_word: מִתְמַהְמֵהַּ
  choice: je vais attendre
  rationale: Le participe hitpael exprime le fait de s’attarder ou de demeurer sur place. Dans ce contexte, David reste intentionnellement dans l’attente de nouvelles; « je vais attendre » en rend clairement la fonction tout en signalant l’alternative en note.
- source_word: בְּעַבְרוֹת
  choice: aux gués
  rationale: Le pluriel désigne des lieux de passage, probablement des gués dans le contexte de la fuite. « Aux gués » est précis et idiomatique; « aux passages » reste possible et figure en note.
- source_word: הַמִּדְבָּר
  choice: du désert
  rationale: מִדְבָּר désigne une région sauvage ou aride, sans impliquer nécessairement une étendue de sable. « Désert » est ici la formulation française concise et traditionnelle.
- source_word: עַד בּוֹא דָבָר
  choice: jusqu’à ce qu’un message … vienne
  rationale: דָבָר désigne ici une parole transmise, donc un message ou une nouvelle. Cette formulation française restitue naturellement l’idée de son arrivée.
- source_word: מֵעִמָּכֶם
  choice: de votre part
  rationale: L’expression indique que le message proviendra des destinataires. « De votre part » est plus naturel en français que le calque « de chez vous ».
- source_word: לְהַגִּיד לִי
  choice: m’informer
  rationale: L’infinitif hiphil de נגד signifie faire savoir ou rapporter. « M’informer » convient au contexte d’un message transmis à David.
