base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: fr
  text: Deux cents hommes de Jérusalem, qui avaient été invités, partirent avec Absalom en toute innocence[a], sans rien savoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans méfiance », « en toute simplicité » ou « avec intégrité » ; dans ce contexte, l’expression peut indiquer qu’ils ne soupçonnaient rien et ignoraient le projet d’Absalom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת אַבְשָׁלוֹם הָלְכוּ
  choice: accompagnèrent Absalom
  rationale: Avec אֶת employé au sens de « avec », הָלְכוּ décrit ici le fait d’aller avec Absalom. « Accompagnèrent Absalom » exprime naturellement cette relation en français.
- source_word: מָאתַיִם אִישׁ
  choice: deux cents hommes
  rationale: Le syntagme hébreu compte explicitement des hommes et désigne ici un groupe masculin.
- source_word: מִירוּשָׁלִַם
  choice: de Jérusalem
  rationale: La préposition מִן indique la provenance.
- source_word: קְרֻאִים
  choice: Ils avaient été invités
  rationale: Le participe passif de קרא signifie qu’ils avaient été appelés ou conviés. Dans ce contexte, « invités » est précis sans ajouter explicitement l’idée de « convives ».
- source_word: וְהֹלְכִים לְתֻמָּם
  choice: et allaient en toute innocence
  rationale: Le participe décrit leur disposition pendant le déplacement. לְתֻמָּם peut évoquer l’innocence, l’intégrité ou la simplicité; la proposition suivante privilégie ici l’idée qu’ils ne soupçonnaient rien.
- source_word: וְלֹא יָדְעוּ כָּל דָּבָר
  choice: sans rien savoir
  rationale: Cette formulation française naturelle conserve la portée générale de « ils ne savaient aucune chose » et explique leur innocence sans préciser dans le texte ce que l’hébreu laisse implicite.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La première phrase évite une construction lourde calquée sur l’hébreu; la seconde conserve le lien entre l’invitation, l’innocence des hommes et leur ignorance. Le complément implicite de « savoir » n’est pas explicité dans le corps du texte.
