source:
  edition: WLC
  text: הִנֵּה שָׁ֤ם עִמָּ/ם֙ שְׁנֵ֣י בְנֵי/הֶ֔ם אֲחִימַ֣עַץ לְ/צָד֔וֹק וִ/יהוֹנָתָ֖ן לְ/אֶבְיָתָ֑ר וּ/שְׁלַחְתֶּ֤ם בְּ/יָדָ/ם֙ אֵלַ֔/י כָּל דָּבָ֖ר אֲשֶׁ֥ר תִּשְׁמָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: fr
  text: 'Voici, leurs deux fils sont là avec eux : Ahimaats, fils de Tsadok, et Jonathan, fils d’Abiathar. Vous me transmettrez par leur intermédiaire[a] toute information[b] que vous entendrez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par leur main » ; expression hébraïque signifiant « par leur moyen » ou « par leur intermédiaire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tout ce que vous entendrez » ou « toute affaire dont vous entendrez parler ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: L’interjection attire l’attention sur la présence des deux fils. « Voici » conserve cette valeur présentative dans un registre français digne et naturel.
- source_word: שָׁם עִמָּם
  choice: sont là avec eux
  rationale: Cette formulation rend à la fois l’indication de lieu שָׁם et l’accompagnement exprimé par עִמָּם.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: leurs deux fils
  rationale: Le groupe construit désigne naturellement les deux fils des prêtres mentionnés dans le contexte.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: Ahimaats, fils de Tsadok, et Jonathan, fils d’Abiathar
  rationale: Dans ce contexte, le לְ indique l’appartenance familiale déjà annoncée par « leurs deux fils ». L’explicitation est nécessaire pour que le français soit immédiatement intelligible.
- source_word: וּשְׁלַחְתֶּם
  choice: Vous me transmettrez
  rationale: La forme verbale coordonnée a ici une valeur directive. Avec le complément אֵלַי, « vous me transmettrez » exprime naturellement l’ordre d’acheminer les renseignements jusqu’à David.
- source_word: בְּיָדָם
  choice: par leur intermédiaire
  rationale: Littéralement « par leur main », cette expression hébraïque désigne l’agent ou le moyen de transmission. L’équivalent idiomatique français évite une formulation opaque.
- source_word: כָּל דָּבָר
  choice: toute information
  rationale: דָּבָר peut signifier « parole », « chose », « affaire » ou « information ». Dans ce contexte de collecte et de transmission de renseignements, « toute information » rend clairement le sens sans le limiter à un rapport formel.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: que vous entendrez
  rationale: La traduction conserve le sens direct de שׁמע et laisse ouverte la manière dont les prêtres recevront ces renseignements.
