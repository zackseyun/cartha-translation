  text: Elyahba the Shaalbonite[a], the sons of Jashen, Jonathan.
translation:
  language: fr
  text: Éliahba le Shaalbonite[a], les fils de Yashen, Jonathan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu est concis et difficile ici : littéralement, « Éliahba le Shaalbonite, les fils de Yashen, Jonathan ». Certains interprètes supposent une irrégularité textuelle et reconstituent la liste autrement, par exemple en faisant de Jonathan l’un des « fils de Yashen ». La présente traduction conserve le texte hébreu tel qu’il a été transmis, sans le corriger.'
    reason: textual_variant
lexical_decisions:
- source_word: אֶלְיַחְבָּא
  choice: Éliahba
  rationale: Nom propre translittéré selon une forme naturelle en français, avec accent initial pour guider la prononciation.
- source_word: הַשַּׁעַלְבֹנִי
  choice: le Shaalbonite
  rationale: Gentilé défini désignant un homme originaire de Shaalbon ou lié à cette localité; la forme française conserve clairement le rapport au nom de lieu.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Pluriel construit de « fils ». Malgré la difficulté créée par le singulier « Jonathan » qui suit, la traduction conserve explicitement le pluriel transmis par le texte hébreu.
- source_word: יָשֵׁן
  choice: Yashen
  rationale: Le terme est traité comme un nom propre dans la construction « les fils de Yashen », sans correction conjecturale.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle et immédiatement reconnaissable de ce nom propre hébreu.
