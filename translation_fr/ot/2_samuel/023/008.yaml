  text: אֵ֛לֶּה שְׁמ֥וֹת הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד יֹשֵׁ֨ב בַּשֶּׁ֜בֶת תַּחְכְּמֹנִ֣י רֹ֣אשׁ הַ/שָּׁלִשִׁ֗י ה֚וּא עֲדִינ֣/וֹ ה/עצנ/ו עַל שְׁמֹנֶ֥ה מֵא֛וֹת חָלָ֖ל בְּ/פַ֥עַם אחד׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: fr
  text: 'Voici les noms des vaillants guerriers de David : Yosheb-Bashébeth[a], le Tahkemonite, chef des Trois[b]. C’était Adino l’Etsnite[c], contre huit cents hommes tués en une seule fois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu de ce verset est difficile. « Yosheb-Bashébeth » suit le texte massorétique ; le passage parallèle de 1 Chroniques 11.11 porte « Yashobéam, fils de Hakmoni » (ou « le Hakmonite »).
    reason: textual_variant
  - marker: b
    text: Ou « chef des Trente », d’après certains témoins anciens et certaines interprétations ; le texte massorétique vocalisé porte « chef des Trois ».
    reason: alternative_reading
  - marker: c
    text: L’hébreu porte « Adino l’Etsnite », expression très difficile. Beaucoup la comprennent plutôt comme une proposition signifiant approximativement « il brandit sa lance » ou « il leva sa lance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: les vaillants guerriers
  rationale: Le terme désigne ici des combattants remarquables par leur force et leur bravoure. Cette formulation est claire en français moderne et convient à la liste des héros militaires de David.
- source_word: אֲשֶׁר לְדָוִד
  choice: de David
  rationale: 'Le lamed marque l’appartenance ou l’association : ces guerriers faisaient partie du groupe attaché à David.'
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: Yosheb-Bashébeth
  rationale: La forme difficile du texte massorétique est conservée comme nom propre, sans l’harmoniser silencieusement avec 1 Chroniques 11.11.
- source_word: תַּחְכְּמֹנִי
  choice: le Tahkemonite
  rationale: Translittération naturelle en français de la désignation du texte de Samuel; la forme différente du parallèle des Chroniques est signalée en note.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: chef des Trois
  rationale: Ce rendu suit la vocalisation massorétique et désigne vraisemblablement le chef du groupe d’élite mentionné dans le contexte, tout en signalant la variante « des Trente ».
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: Adino l’Etsnite
  rationale: La phrase étant extrêmement obscure, elle est conservée sous la forme d’un nom et d’une désignation conformément au texte massorétique pointé; l’analyse verbale conjecturale est donnée en note.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: il affronta huit cents hommes, qu’il tua
  rationale: Dans ce contexte guerrier, עַל exprime l’action hostile et חָלָל désigne des hommes tués. L’ajout syntaxique minimal d’un verbe rend en français intelligible la proposition elliptique et difficile de l’hébreu.
- source_word: בְּפַעַם אֶחָד
  choice: en une seule fois
  rationale: L’expression indique qu’il s’agit d’une seule occasion ou d’un seul affrontement.
