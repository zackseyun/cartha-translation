source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: fr
  text: 'Voici les dernières paroles de David :


    Oracle[a] de David, fils de Jessé,

    oracle de l’homme élevé au plus haut rang,

    de l’oint du Dieu de Jacob[b],

    du doux chantre d’Israël[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « oracle » peut aussi se rendre par « déclaration » ou « parole solennelle » ; il introduit souvent une proclamation solennelle ou prophétique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’oint du Dieu de Jacob ». Ici, l’expression désigne directement David comme roi consacré par Dieu, tout en conservant une résonance royale et messianique.'
    reason: alternative_reading
  - marker: c
    text: 'L’hébreu est très condensé. On peut aussi comprendre : « le chantre apprécié des chants d’Israël » ou « le favori des chants d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: paroles
  rationale: Dans cette introduction à une déclaration poétique, « paroles » rend naturellement le sens de mots prononcés, plutôt que le sens plus général de « choses » ou « affaires ».
- source_word: הָאַחֲרֹנִים
  choice: dernières
  rationale: Associé à « paroles », le terme présente ce qui suit comme les paroles finales ou conclusives de David.
- source_word: נְאֻם
  choice: oracle
  rationale: Ce terme introduit une proclamation solennelle, souvent prophétique. « Oracle » conserve ce registre élevé et sa répétition dans le texte hébreu.
- source_word: בֶּן יִשַׁי
  choice: fils de Jessé
  rationale: Rendu direct de la désignation patronymique.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: Le nom désigne ici un homme, avec une possible nuance de vigueur ou d’importance que le contexte honorifique laisse entendre sans devoir l’expliciter.
- source_word: הֻקַם עָל
  choice: élevé très haut
  rationale: Le passif de קום accompagné de עָל exprime ici l’élévation ou l’exaltation. Cette formulation conserve l’image verticale sans réduire l’expression au seul concept abstrait d’« exalté ».
- source_word: מְשִׁיחַ
  choice: celui qui a reçu l’onction
  rationale: Cette formulation française claire rend la personne ointe par Dieu tout en évitant l’emploi peu courant de « l’oint » et sans transformer automatiquement le mot en titre messianique.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: du Dieu de Jacob
  rationale: Rendu direct de la chaîne construite hébraïque.
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: du doux chantre d’Israël
  rationale: Cette formulation poétique et consacrée en français exprime David comme auteur ou interprète apprécié des chants d’Israël, tandis qu’une note conserve l’ambiguïté de la construction hébraïque.
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: « Voici » introduit naturellement une nouvelle section et présente les paroles qui suivent. Il ne lui ajoute pas une valeur temporelle équivalente à « maintenant ».
theological_decisions:
- issue: Faut-il rendre מְשִׁיחַ comme un titre messianique ?
  choice: celui qui a reçu l’onction du Dieu de Jacob
  alternative: le Messie du Dieu de Jacob ; l’oint du Dieu de Jacob
  rationale: Dans le contexte immédiat, l’expression décrit David, roi établi par l’onction divine. Le rendu choisi maintient la portée royale et la résonance messianique du terme sans identifier directement David au Messie comme titre eschatologique.
- issue: Comment comprendre נְעִים זְמִרוֹת יִשְׂרָאֵל ?
  choice: le doux chantre d’Israël
  alternative: le chantre apprécié des chants d’Israël ; le favori des chants d’Israël
  rationale: La construction hébraïque est très condensée et permet plus d’une analyse. Le texte principal retient le sens traditionnel lié au chant de David, tandis que la note signale une formulation plus littérale afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international moderne, solennel et poétique. La disposition en lignes met en valeur les membres parallèles de la déclaration. « Chantre » est légèrement littéraire, mais reste intelligible dans ce contexte biblique et rend mieux la dignité poétique que « chanteur ».
