translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement fluidifiée en deux phrases pour éviter une longue coordination, tout en maintenant le contraste temporel. L’étrangeté du premier groupe numérique n’est pas corrigée dans le corps du texte; elle est explicitée en note.
