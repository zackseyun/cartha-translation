  text: וַ/יֵּרְד֨וּ שלשים מֵ/הַ/שְּׁלֹשִׁ֣ים רֹ֗אשׁ וַ/יָּבֹ֤אוּ אֶל קָצִיר֙ אֶל דָּוִ֔ד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וְ/חַיַּ֣ת פְּלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: fr
  text: Alors, trente parmi les trente chefs[a] descendirent et vinrent, au temps de la moisson[b], auprès de David, à la grotte d’Adoullam, tandis qu’une troupe de Philistins[c] campait dans la vallée des Rephaïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte écrit hébreu (ketiv) dit littéralement : « trente parmi les trente, chef »; l’expression est difficile. La qeré massorétique lit « trois parmi les trente chefs ». Le texte écrit peut aussi être compris comme désignant des membres des « Trente », les guerriers d’élite de David.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « pendant la moisson ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu חַיַּת פְּלִשְׁתִּים signifie littéralement « être vivant/animal des Philistins »; l’expression désigne ici, de manière idiomatique, une troupe ou un détachement militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: descendirent
  rationale: Le verbe ירד exprime un déplacement vers le bas. « Descendirent » conserve ce sens directionnel dans un registre narratif digne et naturel.
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: trente des trente chefs
  rationale: Le texte consonantique transmis est difficile et comprimé. Cette formulation en conserve la donnée numérique et l’ambiguïté plutôt que de la corriger silencieusement; une note signale les autres compréhensions possibles.
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Avec les compléments introduits par אֶל et orientés vers David, « vinrent » convient naturellement au mouvement vers la destination.
- source_word: אֶל קָצִיר
  choice: au temps de la moisson
  rationale: Bien que la préposition signifie littéralement « vers », l’expression est vraisemblablement temporelle ici. « Au temps de la moisson » rend clairement cet emploi sans ajouter de précision absente du texte.
- source_word: אֶל דָּוִד
  choice: auprès de David
  rationale: Cette traduction exprime l’arrivée à l’endroit où se trouve David sans ajouter l’idée explicite d’une rencontre.
- source_word: אֶל מְעָרַת עֲדֻלָּם
  choice: à la grotte d’Adoullam
  rationale: Le groupe construit désigne directement la grotte associée à Adoullam. La translittération française traditionnelle reste intelligible.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: une troupe de Philistins
  rationale: חַיָּה désigne littéralement un être vivant ou un animal, mais prend ici un sens collectif et militaire. « Troupe » communique cet emploi idiomatique sans image trompeuse.
- source_word: חֹנָה
  choice: campait
  rationale: Le participe de חנה décrit une situation de campement en cours, rendue naturellement à l’imparfait comme arrière-plan du récit.
- source_word: בְּעֵמֶק רְפָאִים
  choice: dans la vallée des Rephaïm
  rationale: Le nom géographique est conservé par translittération; « vallée des Rephaïm » est une forme française claire et usuelle.
