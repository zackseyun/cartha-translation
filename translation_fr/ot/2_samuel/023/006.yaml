source:
  edition: WLC
  text: וּ/בְלִיַּ֕עַל כְּ/ק֥וֹץ מֻנָ֖ד כֻּלָּ֑/הַם כִּֽי לֹ֥א בְ/יָ֖ד יִקָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: fr
  text: Mais les vauriens sont tous comme des épines rejetées[a], car on ne peut pas les prendre à la main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu beliyya‘al désigne probablement ici des personnes mauvaises ou sans valeur, et non le nom propre tardif « Bélial ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: les vauriens
  rationale: Le nom désigne ici collectivement des personnes mauvaises ou sans valeur, et non le nom propre tardif « Bélial ». « Les vauriens » rend naturellement la référence personnelle et péjorative.
- source_word: כְּקוֹץ
  choice: comme des épines
  rationale: Le singulier hébreu a une valeur collective dans cette comparaison; le pluriel français s’accorde naturellement avec le groupe visé.
- source_word: מֻנָד
  choice: rejetées
  rationale: Le participe passif évoque ce qui est repoussé ou écarté. « Rejetées » convient à l’image des épines et laisse ouverte la nuance précise du geste.
- source_word: כֻּלָּהֶם
  choice: tous
  rationale: Conserve la portée totalisante et distributive de l’hébreu.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison qui explique la comparaison avec les épines.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: on ne peut pas les prendre à la main
  rationale: La tournure impersonnelle française rend clairement le fait que de telles épines ne se saisissent pas directement avec la main; « à la main » est ici idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme imagé, la référence collective et la relation explicative entre les deux propositions.
