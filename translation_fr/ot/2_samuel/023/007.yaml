source:
  edition: WLC
  text: וְ/אִישׁ֙ יִגַּ֣ע בָּ/הֶ֔ם יִמָּלֵ֥א בַרְזֶ֖ל וְ/עֵ֣ץ חֲנִ֑ית וּ/בָ/אֵ֕שׁ שָׂר֥וֹף יִשָּׂרְפ֖וּ בַּ/שָּֽׁבֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: fr
  text: Mais quiconque les[c] touche doit se munir de fer et d’une hampe de lance[a] ; on les brûlera complètement au feu, sur place[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « doit s’équiper de fer et d’un bois de lance » ; littéralement : « doit être rempli de fer et de bois de lance ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « on les brûlera bel et bien au feu là où ils se trouvent ». L’hébreu renforce le verbe « brûler » au moyen d’un infinitif absolu.
    reason: lexical_alternative
  - marker: c
    text: Le pronom « les » renvoie aux hommes indignes du verset précédent, comparés à des épines.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישׁ
  choice: Mais quiconque
  rationale: Le singulier אִישׁ a ici une valeur générique. « Quiconque » l’exprime naturellement en français moderne, tandis que « mais » relie ce vers à l’image contrastée des épines au verset précédent.
- source_word: יִגַּע בָּהֶם
  choice: les touche
  rationale: נגע signifie couramment « toucher ». Ce sens direct convient à l’image d’épines dangereuses sans préciser indûment « saisir » ou « frapper ».
- source_word: יִמָּלֵא
  choice: doit se munir
  rationale: Le niphal de מלא signifie littéralement « être rempli », mais, avec les instruments qui suivent, il décrit ici le fait de s’en équiper. « Se munir » garde cette idée sans ajouter une arme de fer déterminée.
- source_word: בַרְזֶל
  choice: de fer
  rationale: Le texte dit simplement « fer » et ne nomme pas l’outil. La traduction conserve cette généralité.
- source_word: וְעֵץ חֲנִית
  choice: et d’une hampe de lance
  rationale: 'Littéralement « bois de lance » : il s’agit de la partie en bois, c’est-à-dire la hampe, plutôt que de la pointe.'
- source_word: וּבָאֵשׁ
  choice: au feu
  rationale: La préposition ב marque ici le moyen de destruction. « Brûler au feu » restitue naturellement cette valeur instrumentale.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: on les brûlera complètement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. Le sujet pluriel non exprimé est rendu par le français indéfini « on », et « complètement » communique l’intensification.
- source_word: בַּשָּׁבֶת
  choice: sur place
  rationale: 'Dans ce contexte, la forme rare est comprise adverbialement : les épines sont brûlées là où elles se trouvent. « Sur place » reste concis tout en signalant le lieu.'
theological_decisions:
- issue: Référent du pronom בָּהֶם (« les »)
  choice: Conserver le pronom dans le texte et expliquer son référent en note
  alternative: Remplacer directement par « ces vauriens » ou « ces épines »
  rationale: Le pronom renvoie à l’image du verset précédent, où les hommes indignes sont comparés à des épines. Le conserver préserve à la fois le lien grammatical et la tension métaphorique.
translation_notes:
  register: Français international moderne, digne et lisible. « Hampe de lance » rend concrètement l’élément en bois ; « se munir » évite le tour littéral peu naturel « être rempli ». La ponctuation par point-virgule distingue l’approche prudente des épines de leur destruction finale.
