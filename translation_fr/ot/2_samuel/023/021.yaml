  text: וְ/הוּא הִכָּה֩ אֶת אִ֨ישׁ מִצְרִ֜י אשר מַרְאֶ֗ה וּ/בְ/יַ֤ד הַ/מִּצְרִי֙ חֲנִ֔ית וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: fr
  text: Il abattit aussi un Égyptien[a], un homme d’apparence impressionnante. L’Égyptien avait une lance à la main. Il descendit vers lui avec un bâton[b], arracha la lance de la main de l’Égyptien et le tua avec sa propre lance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un bel homme » ou « un homme d’allure remarquable ». L’expression hébraïque se rapporte de façon générale à l’apparence de l’Égyptien. Certains, sous l’influence du passage parallèle en 1 Chroniques 11.23, y voient une allusion à sa haute stature.
    reason: lexical_alternative
  - marker: b
    text: Ou « une massue » ou « une verge ». Le mot hébreu שֵׁבֶט peut désigner, selon le contexte, un bâton, une verge, un sceptre ou une massue.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: abattit
  rationale: Dans ce contexte guerrier, נכה désigne le fait de frapper et de terrasser. « Abattit » résume l’exploit sans remplacer le verbe explicite « tua » qui vient ensuite.
- source_word: אִישׁ מִצְרִי
  choice: un Égyptien
  rationale: Cette formulation naturelle en français rend pleinement la désignation ethnique sans la lourdeur de « un homme égyptien ».
- source_word: אשר מַרְאֶה
  choice: un homme d’apparence impressionnante
  rationale: La tournure hébraïque est elliptique et porte largement sur l’aspect visible. Cette traduction n’impose ni la beauté ni une stature exceptionnelle.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: L’Égyptien avait une lance à la main
  rationale: Rendu idiomatique de la construction possessive, qui conserve l’image concrète de la lance tenue en main.
- source_word: וַיֵּרֶד אֵלָיו
  choice: Il descendit vers lui
  rationale: ירד signifie littéralement « descendre » et peut décrire ici un mouvement contre l’adversaire. Le français conserve cette donnée spatiale sans la surinterpréter.
- source_word: בַּשָּׁבֶט
  choice: avec un bâton
  rationale: שֵׁבֶט peut désigner un bâton, une verge, un sceptre ou une massue. « Bâton » est ici le terme français le plus large et le moins interprétatif.
- source_word: וַיִּגְזֹל
  choice: arracha
  rationale: גזל exprime une prise par la force. « Arracha » restitue bien l’action énergique exercée sur l’arme tenue par l’adversaire.
- source_word: וַיַּהַרְגֵהוּ
  choice: le tua
  rationale: הרג est le verbe courant signifiant tuer ; cette traduction est directe, claire et moderne.
- source_word: בַּחֲנִיתוֹ
  choice: avec sa propre lance
  rationale: Le suffixe renvoie naturellement à l’Égyptien, à qui la lance vient d’être arrachée. « Sa propre lance » rend le référent explicite et souligne le renversement de situation.
- source_word: וְהוּא
  choice: Il … aussi
  rationale: La conjonction et le pronom poursuivent l’énumération des exploits. « Aussi » restitue naturellement cette valeur additive.
