  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: fr
  text: il est comme la lumière du matin quand le soleil se lève[a], un matin sans nuages ; à l’éclat, après la pluie[b], l’herbe sort de terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et comme la lumière du matin ». La ligne hébraïque est elliptique et poursuit la description du dirigeant au verset précédent.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « de l’éclat, de la pluie, l’herbe de la terre ». Cette formulation poétique très condensée évoque la végétation qui apparaît dans la clarté après la pluie ; le rapport exact entre les expressions reste implicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: il est comme la lumière
  rationale: La conjonction et la préposition comparative introduisent une comparaison qui prolonge la description du dirigeant juste au verset précédent. Le français explicite le sujet sous-entendu afin que la phrase soit naturelle.
- source_word: בֹּקֶר
  choice: matin
  rationale: « Matin » convient aux deux occurrences et conserve leur reprise poétique.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: quand le soleil se lève
  rationale: Le verbe peut évoquer le fait de briller ou de se lever. Cette formulation française exprime naturellement la scène de l’aurore sans exclure l’idée de rayonnement.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: un matin sans nuages
  rationale: Traduction directe et naturelle de l’image hébraïque.
- source_word: מִנֹּגַהּ
  choice: sous l’éclat
  rationale: נֹגַהּ désigne l’éclat ou la clarté. « Sous l’éclat » conserve l’image lumineuse tout en évitant le français peu idiomatique « de l’éclat ».
- source_word: מִמָּטָר
  choice: après la pluie
  rationale: Le préfixe מִן signifie littéralement « de, depuis ». Dans cette image naturelle condensée, « après la pluie » exprime de manière intelligible la situation dans laquelle la végétation paraît, sans prétendre lever toute l’ambiguïté syntaxique.
- source_word: דֶּשֶׁא
  choice: l’herbe
  rationale: Le terme désigne l’herbe ou la jeune végétation. « L’herbe » est simple et concret ; l’idée de croissance est portée par « sort de terre ».
- source_word: מֵאָרֶץ
  choice: sort de terre
  rationale: L’hébreu dit littéralement « herbe de la terre ». Le verbe « sort », sous-entendu dans la poésie nominale, rend naturellement l’apparition de la végétation en français.
theological_decisions:
- issue: Sujet implicite de la comparaison
  choice: Expliciter « il est », en renvoyant au dirigeant juste du verset 3.
  alternative: 'Conserver le fragment impersonnel : « et comme la lumière du matin… »'
  rationale: La ligne hébraïque est elliptique, mais son référent est fourni par le contexte immédiat. L’ajout du pronom clarifie la syntaxe française sans ajouter d’affirmation théologique.
- issue: Rapport syntaxique dans le dernier membre
  choice: Rendre l’image par « sous l’éclat, après la pluie, l’herbe sort de terre » et signaler en note la formulation hébraïque comprimée.
  alternative: « De l’éclat, de la pluie, l’herbe de la terre » ou « par la clarté après la pluie, l’herbe sort de terre ».
  rationale: Les prépositions hébraïques et l’absence de verbe rendent le rapport exact incertain. Le texte français reste imagé et lisible, tandis que la note préserve l’ambiguïté de l’original au lieu d’imposer un lien causal précis.
translation_notes:
  register: Français international moderne, sobre et poétique. La formulation explicite seulement ce qui est nécessaire à une phrase française naturelle, tandis que les notes rendent visibles l’ellipse initiale et la syntaxe comprimée du dernier membre.
