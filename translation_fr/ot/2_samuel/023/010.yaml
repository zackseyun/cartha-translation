  text: ה֣וּא קָם֩ וַ/יַּ֨ךְ בַּ/פְּלִשְׁתִּ֜ים עַ֣ד כִּֽי יָגְעָ֣ה יָד֗/וֹ וַ/תִּדְבַּ֤ק יָד/וֹ֙ אֶל הַ/חֶ֔רֶב וַ/יַּ֧עַשׂ יְהוָ֛ה תְּשׁוּעָ֥ה גְדוֹלָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/הָ/עָ֛ם יָשֻׁ֥בוּ אַחֲרָ֖י/ו אַךְ לְ/פַשֵּֽׁט׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: fr
  text: Il se leva et frappa les Philistins jusqu’à ce que sa main se fatigue. Sa main resta collée à l’épée[a]. Ce jour-là, Yahweh accorda une grande victoire[b]. Le peuple revint à sa suite, uniquement pour dépouiller les morts[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sa main s’attacha à l’épée ». L’image peut évoquer une prise devenue impossible à relâcher sous l’effet de l’épuisement, mais le texte n’en précise pas le mécanisme.
    reason: ambiguïté de l’image hébraïque
  - marker: b
    text: Ou « une grande délivrance » ou « un grand salut ». Le terme hébreu peut désigner largement le fait d’être délivré ou sauvé ; ici, il s’agit de la délivrance décisive accordée par Yahweh dans la bataille.
    reason: alternative lexicale
  - marker: c
    text: 'Littéralement « uniquement pour dépouiller » : il s’agit de retirer aux combattants tombés leurs armes, leur équipement et leurs biens après la bataille.'
    reason: note culturelle et complément implicite
lexical_decisions:
- source_word: קָם
  choice: se leva
  rationale: Le qal de קום marque ici le passage résolu à l’action. « Se leva » demeure naturel et proche de l’hébreu.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: abattit les Philistins
  rationale: Dans ce récit de bataille, נכה désigne des coups portés avec un effet meurtrier. « Abattit » exprime cette force sans développer la scène.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: jusqu’à ce que sa main se fatigue
  rationale: יגע exprime l’épuisement. Cette formulation française conserve l’image corporelle précise du texte.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: sa main … reste attachée à l’épée
  rationale: דבק signifie s’attacher, adhérer ou rester fermement lié. Le choix préserve l’image vive sans imposer une explication médicale telle qu’une crampe.
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Yahweh accorda une grande victoire
  rationale: Avec תְּשׁוּעָה comme complément, עשה exprime ici l’action divine qui produit la délivrance. « Accorda » est idiomatique en français et maintient clairement l’initiative divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin représente directement le tétragramme, plutôt que de lui substituer un titre.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: une grande victoire
  rationale: Dans le contexte militaire immédiat, « victoire » rend le résultat concret, tandis qu’une note conserve les sens plus larges de délivrance et de salut.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: Le peuple revint à sa suite
  rationale: La formulation indique que le peuple rejoignit le combattant après son action décisive, sans ajouter au texte le terme « troupes ».
- source_word: אַךְ לְפַשֵּׁט
  choice: uniquement pour dépouiller les morts
  rationale: פשט désigne ici le fait de retirer aux combattants tombés leurs armes, leur équipement et leurs biens; אַךְ limite à cela l’intervention du peuple.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Portée de תְּשׁוּעָה dans un récit de bataille
  choice: victoire
  alternative: délivrance ou salut
  rationale: Le contexte immédiat favorise le résultat militaire concret, sans effacer la portée plus large du mot, signalée en note, ni l’attribution explicite de cette victoire à Yahweh.
translation_notes:
  register: Français international moderne, digne et narratif. Les phrases restent directes, avec « Yahweh » pour le nom divin. « Reste attachée » conserve l’étrangeté expressive de l’hébreu, tandis que les notes explicitent les ambiguïtés sans les résoudre abusivement.
