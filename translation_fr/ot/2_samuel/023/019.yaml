  text: מִן הַ/שְּׁלֹשָׁה֙ הֲ/כִ֣י נִכְבָּ֔ד וַ/יְהִ֥י לָ/הֶ֖ם לְ/שָׂ֑ר וְ/עַד הַ/שְּׁלֹשָׁ֖ה לֹא בָֽא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: fr
  text: N’était-il pas plus honoré que les Trois[a] ? Il devint donc leur chef, mais il n’atteignit pas le rang des Trois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « N’était-il pas honoré parmi les Trois ? » La construction hébraïque peut se comprendre sans comparaison explicite. La présente traduction retient le sens comparatif.'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, il n’atteignit pas le rang ou la position des « Trois », le groupe le plus prestigieux parmi les vaillants guerriers de David.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: que les Trois
  rationale: Après נִכְבָּד, מִן se comprend naturellement dans un sens comparatif. La majuscule signale qu’il s’agit du groupe d’élite connu sous ce nom.
- source_word: הֲכִי
  choice: N’était-il pas
  rationale: La combinaison interrogative introduit une question rhétorique qui attend une réponse affirmative; cette tournure est naturelle en français.
- source_word: נִכְבָּד
  choice: plus honoré
  rationale: Le niphal de כבד exprime ici l’honneur ou l’estime dont quelqu’un jouit; le comparatif convient à la construction avec מִן.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: Il devint donc leur chef
  rationale: שַׂר désigne un responsable ou commandant. « Chef » reste naturel et suffisamment large, sans préciser outre mesure la fonction militaire exacte.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: mais il n’atteignit pas le rang des Trois
  rationale: L’expression décrit ici non un déplacement physique, mais le fait de ne pas parvenir au statut du groupe d’élite. L’ajout explicatif de « le rang » rend cet idiome clair en français.
