  text: Abi-albon the Arbathite[a], Azmaveth the Barhumite[b];
translation:
  language: fr
  text: Abi-Albon, l’Arbathite[a] ; Azmaveth, le Barhumite[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « Abialbon », écrit en un seul mot.
    reason: lexical_alternative
  - marker: b
    text: « Barhumite » suit le texte massorétique ; certains rattachent cette désignation à Bahourim et traduisent « Baharumite ».
