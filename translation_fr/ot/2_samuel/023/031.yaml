lexical_decisions:
- source_word: אֲבִי עַלְבוֹן
  choice: Abi-Albon
  rationale: Nom propre transcrit plutôt que traduit. Le trait d’union rend visibles les deux éléments du nom hébreu, tout en restant naturel en français.
- source_word: הָעַרְבָתִי
  choice: l’Arbathite
  rationale: Gentilé défini désignant vraisemblablement un homme originaire d’Arbath ou d’un lieu apparenté. La transcription préserve cette désignation géographique sans trancher en faveur d’un lien direct avec l’Araba.
- source_word: עַזְמָוֶת
  choice: Azmaveth
  rationale: Transcription conventionnelle du nom propre hébreu, avec « th » pour la consonne finale selon l’usage biblique français courant.
- source_word: הַבַּרְחֻמִי
  choice: le Barhumite
  rationale: Gentilé défini transcrit conformément à la vocalisation du texte massorétique. La forme garde distincte l’éventuelle identification avec Bahourim.
