  text: עֲשָׂה אֵ֥ל אֲחִֽי יוֹאָ֖ב בַּ/שְּׁלֹשִׁ֑ים אֶלְחָנָ֥ן בֶּן דֹּד֖וֹ בֵּ֥ית לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/024.yaml
  text: Asahel the brother of Joab was among the Thirty[a]; Elhanan son of Dodo of Bethlehem.
translation:
  language: fr
  text: Asaël, frère de Joab, était parmi les Trente ; Elhanan, fils de Dodo[a], de Bethléem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Dodo » ; le passage parallèle de 1 Chroniques 11.26 porte « Dodaï ».'
    reason: Signaler la variante de nom transmise dans le passage parallèle sans modifier le texte massorétique de 2 Samuel.
lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: Asaël
  rationale: Le nom personnel עֲשָׂהאֵל, écrit ici en deux éléments, est rendu selon sa forme française usuelle.
- source_word: אֲחִי יוֹאָב
  choice: frère de Joab
  rationale: Cette formulation naturelle en français exprime directement la relation familiale indiquée par la chaîne construite hébraïque.
- source_word: בַּשְּׁלֹשִׁים
  choice: parmi les Trente
  rationale: La préposition ב indique ici l’appartenance au groupe défini des « Trente » ; « parmi » rend cette inclusion avec naturel.
- source_word: אֶלְחָנָן
  choice: Elhanan
  rationale: Translittération française claire du nom propre hébreu.
- source_word: בֶּן דֹּדֹו
  choice: fils de Dodo
  rationale: Le texte massorétique porte דֹּדֹו, compris ici comme le nom personnel Dodo, sans harmonisation avec la forme signalée dans la tradition parallèle.
- source_word: בֵּית לָחֶם
  choice: de Bethléem
  rationale: Dans cette liste de noms, la tournure indique naturellement l’origine géographique d’Elhanan.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule conserve la structure elliptique de la liste hébraïque, où le second guerrier est simplement nommé après Asaël.
