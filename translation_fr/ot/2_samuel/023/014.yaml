  yaml_path: translation/ot/2_samuel/023/014.yaml
  text: David was then in the stronghold[a], and the garrison of the Philistines was then at Bethlehem.
translation:
  language: fr
  text: David se trouvait alors dans la forteresse, et le poste militaire des Philistins était alors à Bethléem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: alors … alors
  rationale: L’adverbe temporel est répété dans l’hébreu. La répétition reste naturelle en français et conserve l’insistance temporelle du verset.
- source_word: מְצוּדָה
  choice: forteresse
  rationale: Le terme désigne ici un lieu défendable où David s’était retranché. « Forteresse » rend clairement la valeur militaire et topographique sans préciser indûment le type de construction.
- source_word: מַצַּב
  choice: poste militaire
  rationale: Dans ce contexte philistin, le mot désigne vraisemblablement un poste occupé par des soldats ou la troupe qui y est stationnée. « Poste militaire » préserve cette légère ambiguïté mieux que « garnison », qui peut désigner surtout les soldats.
- source_word: פְּלִשְׁתִּים
  choice: Philistins
  rationale: Forme française usuelle du nom de ce peuple.
- source_word: בֵּית לָחֶם
  choice: Bethléem
  rationale: Forme française usuelle du nom de lieu.
- source_word: וְ
  choice: et
  rationale: La coordination simple de l’hébreu est conservée sans expliciter une relation circonstancielle comme « tandis que ».
