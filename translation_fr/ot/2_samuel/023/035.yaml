  yaml_path: translation/ot/2_samuel/023/035.yaml
  text: Hezro the Carmelite[a], Paarai the Arbite[c][b];
translation:
  language: fr
  text: Hetsro, de Carmel[a] ; Paaraï, d’Arab[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le Carmélite », c’est-à-dire un homme originaire de Carmel, sans rapport avec l’ordre religieux apparu bien plus tard.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « l’Arabite ». Le terme hébreu désigne vraisemblablement un homme originaire d’un lieu nommé Arab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חצרו
  choice: Hetsro
  rationale: Nom propre translittéré selon une forme française qui distingue les consonnes hébraïques et évite de reprendre mécaniquement la forme anglaise.
- source_word: הַכַּרְמְלִי
  choice: de Carmel
  rationale: Le gentilé désigne ici l’origine géographique. Cette formulation française est naturelle et ne risque pas d’évoquer l’ordre religieux carmélite, bien plus tardif.
- source_word: פַּעֲרַי
  choice: Paaraï
  rationale: Translittération française du nom propre, avec tréma pour signaler que les voyelles finales se prononcent séparément.
- source_word: הָאַרְבִּי
  choice: d’Arab
  rationale: Le gentilé indique vraisemblablement l’origine dans un lieu nommé Arab; la formulation géographique est plus transparente en français qu’un gentilé rare comme « Arabite ».
theological_decisions: []
