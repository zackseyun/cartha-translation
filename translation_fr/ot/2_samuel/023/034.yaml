  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
translation:
  language: fr
  text: Eliphéleth, fils d’Ahasbaï, fils du Maacathien[a] ; Éliam, fils d’Ahitophel, le Gilonite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Eliphéleth, fils d’Ahasbaï le Maacathien ; Éliam, fils d’Ahitophel, le Gilonite. » La relation entre les termes de cette liste peut être comprise de ces deux manières, notamment en comparaison avec la liste parallèle de 1 Chroniques 11.35-36.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  choice: Éliphéleth
  rationale: Translittération française usuelle du nom hébreu, avec accents facilitant une prononciation naturelle.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette liste de noms, le terme indique naturellement une filiation et se rend de façon transparente par « fils de ».
- source_word: אֲחַסְבַּי
  choice: Ahasbaï
  rationale: Translittération directe du nom propre hébreu selon les conventions françaises.
- source_word: הַמַּעֲכָתִי
  choice: le Maacathien
  rationale: Le gentilé hébreu avec article désigne une appartenance ethnique ou régionale ; « le Maacathien » conserve cette forme plutôt que de paraphraser par « originaire de Maaca ».
- source_word: אֱלִיעָם
  choice: Éliam
  rationale: Translittération française courante du nom propre hébreu.
- source_word: אֲחִיתֹפֶל
  choice: Ahitophel
  rationale: Translittération française courante du nom propre hébreu.
- source_word: הַגִּלֹנִי
  choice: le Guilonite
  rationale: Le gentilé dérivé de Guilo est rendu sous sa forme française traditionnelle, qui conserve l’adjectif identitaire de l’hébreu.
