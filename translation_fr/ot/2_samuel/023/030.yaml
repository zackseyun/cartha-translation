lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: Benaya
  rationale: Nom propre rendu selon sa forme française biblique usuelle, à partir de l’hébreu Benayāhou.
- source_word: פִּרְעָתֹנִי
  choice: de Piraton
  rationale: L’adjectif d’origine indique que Benaya venait de Piraton ; cette tournure est plus naturelle en français moderne que « le Piratonite ».
- source_word: הִדַּי
  choice: Hiddaï
  rationale: Translittération du nom propre tel qu’il figure dans le texte massorétique de Samuel.
- source_word: מִנַּחֲלֵי
  choice: des ravins de
  rationale: נַחַל désigne souvent un ravin ou le lit, parfois temporaire, d’un cours d’eau. « Ravins » convient au relief évoqué tout en restant naturel en français.
- source_word: גָעַשׁ
  choice: Gaash
  rationale: Nom géographique translittéré, sans le traduire.
