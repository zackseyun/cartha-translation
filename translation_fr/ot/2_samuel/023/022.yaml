  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: fr
  text: Voilà ce que fit Benaya, fils de Yehoyada, et il était renommé parmi les trois vaillants guerriers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains comprennent ici « les trente », en rapprochant ce verset de la liste plus large des guerriers de David ; le texte hébreu porte « les trois ».
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Voilà ce que fit
  rationale: Le démonstratif reprend les exploits racontés juste avant. Cette tournure française rend naturellement la valeur récapitulative de l’hébreu.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya, fils de Yehoyada
  rationale: Les noms propres sont translittérés sous une forme lisible en français, et la relation construite est rendue simplement par « fils de ».
- source_word: וְלוֹ שֵׁם
  choice: et il se fit un nom
  rationale: Littéralement, « et à lui [était] un nom ». « Il se fit un nom » conserve l’image hébraïque tout en exprimant clairement l’acquisition d’une renommée à la suite de ces exploits.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: parmi les trois vaillants guerriers
  rationale: Le texte massorétique porte explicitement « les trois ». Dans ce contexte militaire, גִּבֹּרִים désigne des guerriers d’élite; « vaillants guerriers » en rend à la fois la fonction et la valeur.
