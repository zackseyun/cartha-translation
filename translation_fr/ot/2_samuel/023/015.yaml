base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: fr
  text: 'David éprouva un vif désir et dit : « Qui me donnera à boire de l’eau du puits de Bethléem qui est près de la porte[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus explicite : « Si seulement quelqu’un me donnait à boire de l’eau du puits de Bethléem, près de la porte ! » En hébreu, la question « Qui me donnera… ? » exprime ici un vif désir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: éprouva un vif désir
  rationale: Le hitpael de אוה exprime un désir intense. Cette formulation française naturelle en conserve la force sans préciser davantage l’objet du désir avant les paroles de David.
- source_word: וַיֹּאמַר
  choice: dit
  rationale: Le verbe hébreu est le verbe courant pour « dire » ; il ne précise ni que David parle en lui-même ni qu’il s’exclame.
- source_word: מִי
  choice: Qui me donnera
  rationale: La tournure interrogative hébraïque introduit ici l’expression d’un souhait. La conserver respecte la forme du texte tout en restant intelligible en français.
- source_word: יַשְׁקֵנִי מַיִם
  choice: me donnera à boire de l’eau
  rationale: Le hiphil de שקה signifie donner à boire ou faire boire. La formulation retenue est idiomatique et garde la valeur causative.
- source_word: מִבֹּאר
  choice: du puits
  rationale: בְּאֵר désigne normalement un puits plutôt qu’une citerne.
- source_word: בֵּית לֶחֶם
  choice: Bethléem
  rationale: Forme française usuelle du nom de lieu biblique.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: qui est près de la porte
  rationale: La proposition identifie le puits situé à proximité de la porte de la ville ; « près de » est clair et évite de suggérer qu’il se trouve à l’intérieur même de la porte.
