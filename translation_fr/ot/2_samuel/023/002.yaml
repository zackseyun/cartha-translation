  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: fr
  text: L’Esprit de Yahweh a parlé par moi[a], et sa parole était sur ma langue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par mon intermédiaire ». La préposition hébraïque peut ici indiquer l’intermédiaire par lequel la parole est transmise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: L’Esprit de Yahweh
  rationale: Dans ce contexte de parole prophétique, רוּחַ désigne au mieux l’Esprit comme agent de la révélation; le nom divin יְהוָה est rendu par « Yahweh ».
- source_word: דִּבֶּר
  choice: a parlé
  rationale: Le verbe désigne l’acte de parler. Le passé composé est naturel en français moderne dans cette déclaration rétrospective.
- source_word: בִּי
  choice: par moi
  rationale: La préposition ב peut marquer ici l’intermédiaire ou l’instrument. « Par moi » reste proche de la forme hébraïque, tandis que « à travers moi » est signalé en note comme autre traduction possible.
- source_word: וּמִלָּתוֹ
  choice: et sa parole
  rationale: מִלָּה signifie « parole » ou « énoncé ». « Parole » conserve à la fois la concision et la portée de la parole divine.
- source_word: עַל לְשׁוֹנִי
  choice: était sur ma langue
  rationale: Cette formulation conserve l’image hébraïque tout en demeurant intelligible et naturelle en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin sans le remplacer par un titre.
- issue: Sens de רוּחַ dans ce contexte
  choice: Esprit
  alternative: souffle; vent
  rationale: Le contexte présente une action divine de parole prophétique. « Esprit » exprime ce sens sans développer davantage l’identité ou le mode d’action de cet agent.
- issue: Valeur de la préposition ב dans בִּי
  choice: par moi
  alternative: à travers moi; en moi
  rationale: Le parallélisme avec « sa parole était sur ma langue » favorise une valeur instrumentale, mais la note préserve l’autre formulation naturelle « à travers moi ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique et l’image « sur ma langue » sont conservées; le passé composé évite une tournure inutilement archaïque.
