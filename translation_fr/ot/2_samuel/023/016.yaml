  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: fr
  text: Alors les trois vaillants guerriers firent une percée dans le camp des Philistins. Ils puisèrent de l’eau au puits de Bethléem, près de la porte, puis l’emportèrent et l’apportèrent à David. Mais il ne voulut pas la boire[a] ; il la répandit pour le SEIGNEUR[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne voulut pas les boire ». L’hébreu emploie un suffixe pluriel, probablement parce que le mot « eau » y a une forme plurielle.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut évoquer le versement d’une libation. Le geste de David peut ainsi avoir une portée de dédicace au SEIGNEUR.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: se frayèrent un passage à travers
  rationale: Le verbe exprime l’idée de fendre ou de forcer un passage. Cette formulation restitue naturellement en français la percée des guerriers au milieu du camp ennemi.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: les trois vaillants guerriers
  rationale: גִּבּוֹרִים désigne ici les combattants renommés de David. « Vaillants guerriers » garde cette valeur quasi technique tout en restant naturel en français moderne.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: à travers le camp des Philistins
  rationale: La préposition et le contexte militaire indiquent que les trois hommes traversent de force le camp philistin.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: ils puisèrent de l’eau
  rationale: שׁאב est le verbe courant pour puiser de l’eau, notamment dans un puits.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: au puits de Bethléem, près de la porte
  rationale: La formulation identifie le puits associé à Bethléem et le situe à la porte ou dans ses environs immédiats. « Près de la porte » est idiomatique sans imposer une précision topographique excessive.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: puis la transportèrent et l’apportèrent à David
  rationale: Les deux verbes successifs, porter puis apporter, sont conservés afin de rendre la progression et l’insistance du récit hébreu.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: il ne voulut pas la boire
  rationale: אָבָה porte sur la volonté ou le consentement. Le français emploie naturellement le singulier pour l’eau, tandis qu’une note signale le suffixe pluriel hébreu.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: il la répandit
  rationale: נסך décrit concrètement l’action de verser un liquide et peut avoir une portée cultuelle. Le texte principal conserve l’action concrète sans définir trop précisément le statut rituel du geste.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: Le lamed marque ici la destination ou la dédicace du geste. « Pour le SEIGNEUR » préserve cette orientation sans transformer explicitement l’acte en une catégorie sacrificielle précise. Le tétragramme est rendu selon la convention française « le SEIGNEUR ».
theological_decisions:
- issue: Nature du geste de David lorsqu’il répand l’eau
  choice: Un geste concret de dédicace au SEIGNEUR, avec une possible valeur de libation
  alternative: Un simple refus symbolique de boire, sans portée cultuelle
  rationale: Le verbe נסך possède régulièrement des connotations rituelles, et la mention explicite « pour le SEIGNEUR » donne au geste une portée dédicatoire. Toutefois, le récit ne définit pas formellement l’acte comme un sacrifice réglementé ; le texte principal reste donc concret et la note expose la nuance cultuelle.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent accessibles sans effacer les répétitions significatives de l’hébreu. « SEIGNEUR » en petites capitales typographiques est représenté ici en capitales pour signaler le nom divin יהוה.
