  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: fr
  text: 'Car ma maison n’est pas ainsi avec Dieu[a] ; pourtant, il a conclu avec moi une alliance éternelle, ordonnée en tout point et préservée. Car c’est là tout mon salut et tout mon désir : ne fera-t-il pas germer tout cela[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ma maison n’est-elle pas ainsi avec Dieu ? » Beaucoup comprennent l’ouverture comme une question rhétorique positive plutôt que comme une déclaration négative.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « oui, il fera certainement germer tout cela. » La proposition finale est difficile en hébreu et peut se comprendre soit comme une question rhétorique, soit comme une affirmation appuyée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: À l’ouverture, la conjonction relie cette parole à ce qui précède et introduit une explication. Ses autres occurrences sont rendues selon leur fonction dans la phrase.
- source_word: לֹא כֵן
  choice: n’est pas ainsi
  rationale: Cette formulation proche de l’hébreu conserve la négation du texte massorétique et ne précise pas artificiellement ce que recouvre « ainsi ».
- source_word: בֵּיתִי
  choice: ma maison
  rationale: « Maison » peut désigner à la fois la maisonnée de David et sa dynastie ; garder ce terme préserve cette amplitude.
- source_word: עִם אֵל
  choice: avec Dieu
  rationale: La préposition עִם signifie naturellement « avec » et maintient ici la dimension relationnelle de l’expression.
- source_word: בְרִית עוֹלָם
  choice: une alliance éternelle
  rationale: Cette expression française courante dans le registre biblique rend la durée indéfinie et permanente exprimée par עוֹלָם.
- source_word: שָׂם לִי
  choice: il a conclu avec moi
  rationale: Bien que le verbe signifie littéralement « placer », « conclure une alliance avec quelqu’un » est l’expression française naturelle correspondant à cet emploi contextuel.
- source_word: עֲרוּכָה בַכֹּל
  choice: ordonnée en tout point
  rationale: La traduction exprime l’idée d’une alliance entièrement disposée ou mise en ordre, tout en restant concise.
- source_word: וּשְׁמֻרָה
  choice: et préservée
  rationale: Le participe passif présente l’alliance comme gardée et protégée ; « préservée » en restitue clairement le résultat durable.
- source_word: כָל יִשְׁעִי
  choice: tout mon salut
  rationale: « Salut » garde la portée large de יֵשַׁע, qui peut aussi évoquer la délivrance.
- source_word: וְכָל חֵפֶץ
  choice: tout mon désir
  rationale: חֵפֶץ peut exprimer le désir, le plaisir ou ce à quoi l’on prend plaisir. « Désir » convient au parallélisme sans réduire le terme à une émotion passagère.
- source_word: כִּי לֹא יַצְמִיחַ
  choice: ne la fera-t-il pas germer ?
  rationale: La question rhétorique donne à la négation une force affirmative, tandis que « faire germer » conserve l’image végétale et la valeur causative du verbe צמח. Le pronom renvoie globalement à l’alliance, comprise comme portant le salut et le désir de David, sans développer davantage l’ellipse hébraïque.
theological_decisions:
- issue: Sens de l’ouverture כִּי לֹא כֵן בֵּיתִי עִם אֵל
  choice: « Car ma maison n’est pas ainsi avec Dieu »
  alternative: « Ma maison n’est-elle pas ainsi avec Dieu ? »
  rationale: Le texte hébreu vocalisé présente formellement une négation, mais la proposition est difficile et peut être comprise comme une question rhétorique positive. Le corps du texte conserve la lecture négative et la note signale l’autre analyse sans effacer la tension avec l’affirmation de l’alliance.
- issue: Valeur de la proposition finale כִּי לֹא יַצְמִיחַ
  choice: 'Une question rhétorique positive : « ne la fera-t-il pas germer ? »'
  alternative: 'Une affirmation forte : « oui, il la fera certainement germer » ; ou une négation déclarative : « car il ne la fera pas germer »'
  rationale: La syntaxe est condensée et discutée. La question rhétorique s’accorde avec l’assurance exprimée par l’alliance éternelle, tout en conservant la forme négative de l’hébreu. La note présente l’affirmation forte, très proche quant au sens, sans faire de cette interprétation une certitude grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire biblique essentiel (« maison », « alliance », « salut ») est conservé, tandis que la syntaxe reste naturelle. Les ambiguïtés réelles des première et dernière propositions sont maintenues dans le texte et documentées en notes.
