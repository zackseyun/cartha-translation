revisions:
- from: 'Car ma maison n’est pas ainsi avec Dieu[a] ; pourtant, il a conclu avec moi une alliance éternelle, ordonnée en tout point et préservée. Car elle est tout mon salut et tout mon désir : ne la fera-t-il pas germer[b] ?'
  to: 'Car ma maison n’est pas ainsi avec Dieu[a] ; pourtant, il a conclu avec moi une alliance éternelle, ordonnée en tout point et préservée. Car c’est là tout mon salut et tout mon désir : ne fera-t-il pas germer tout cela[b] ?'
  rationale: La révision se limite à la dernière proposition. Elle évite de faire de l’alliance le seul référent possible du verbe hébreu sans objet exprimé, tout en gardant la question rhétorique, l’image de la germination et l’assurance contextuelle. « C’est là » rend naturellement en français la valeur déictique que l’anglais exprime par « this », sans modifier le sens de la proposition nominale hébraïque.
