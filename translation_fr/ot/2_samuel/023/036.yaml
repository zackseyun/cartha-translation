  rationale: La préposition מִן peut exprimer l’origine ou l’association. En français, « de Tsoba » reste naturel dans cette liste tout en préservant cette latitude sémantique.
- source_word: בָּנִי
  choice: Bani
  rationale: Translittération directe du nom propre.
- source_word: הַגָּדִי
  choice: le Gadite
  rationale: Le gentilé désigne un membre de la tribu de Gad ou un homme originaire de son territoire ; « le Gadite » est concis et traditionnel en français biblique.
