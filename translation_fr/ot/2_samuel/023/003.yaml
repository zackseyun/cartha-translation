  variant: modern international French
source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: fr
  text: 'Le Dieu d’Israël a parlé,

    le Rocher d’Israël m’a dit :

    « Celui qui gouverne les êtres humains[a] avec justice,

    qui gouverne dans la crainte de Dieu[b], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’être humain » ; le terme hébreu אָדָם peut désigner collectivement l’humanité.'
    reason: lexical_alternative
  - marker: b
    text: 'Cette parole peut aussi être comprise dans un sens messianique : elle décrit alors le roi idéal, dont l’accomplissement ultime se trouve dans le Messie.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: a parlé
  rationale: Le parfait introduit solennellement la parole divine. Le passé composé exprime naturellement en français une déclaration prononcée dont l’autorité demeure présente.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Le Dieu d’Israël
  rationale: Cette construction hébraïque désigne le Dieu d’Israël ; l’article est requis en français courant.
- source_word: לִי דִבֶּר
  choice: m’a dit
  rationale: 'Le suffixe de première personne est compris comme destinataire de la parole : Dieu s’adresse à David. « M’a parlé » serait également possible, mais « m’a dit » introduit plus naturellement le contenu cité.'
- source_word: צוּר יִשְׂרָאֵל
  choice: le Rocher d’Israël
  rationale: La métaphore divine est conservée comme titre, avec sa valeur de stabilité, de force et de protection.
- source_word: מוֹשֵׁל
  choice: Celui qui gouverne
  rationale: Le participe qal a ici une portée générale et principielle. Cette formulation conserve mieux cette valeur qu’un simple substantif comme « un dirigeant ».
- source_word: בָּאָדָם
  choice: les êtres humains
  rationale: אָדָם désigne ici collectivement l’humanité soumise à l’autorité du gouvernant. « Les êtres humains » est inclusif, précis et naturel en français moderne.
- source_word: צַדִּיק
  choice: avec justice
  rationale: Bien que le mot soit formellement adjectival (« juste »), la formulation poétique condensée le rattache à l’exercice du pouvoir. « Avec justice » rend clairement cette fonction sans transformer le vers en identification nominale.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: qui gouverne dans la crainte de Dieu
  rationale: La seconde expression participiale précise la manière dont le pouvoir est exercé. « Dans la crainte de Dieu » conserve l’idée biblique de respect révérenciel et de responsabilité devant Dieu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le terme désigne ici le Dieu unique et appelle le singulier en français.
theological_decisions:
- issue: Lecture royale générale ou messianique
  choice: Le texte principal présente la parole comme une description générale du gouvernant juste.
  alternative: On peut aussi y voir une portée messianique, l’idéal royal trouvant son accomplissement ultime dans le Messie.
  rationale: L’hébreu énonce l’idéal du juste gouvernement sans nommer explicitement le Messie. La traduction ne tranche donc pas dans le texte principal, tandis qu’une note signale la portée messianique possible.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes conserve le caractère poétique et la formulation volontairement condensée de l’hébreu. La phrase reste ouverte par une virgule, car elle se poursuit au verset suivant.
