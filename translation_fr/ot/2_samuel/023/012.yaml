  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: fr
  text: Mais il prit position au milieu du champ, le défendit et battit les Philistins. Yahweh accomplit une grande délivrance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande victoire » ou « un grand salut ». Le terme hébreu peut exprimer chacune de ces idées; ici, il désigne l’intervention salvatrice de Yahweh dans le combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: il prit position
  rationale: Le hitpael de יצב exprime le fait de se placer délibérément et de tenir sa position. « Prendre position » convient naturellement au contexte militaire.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: au milieu du champ
  rationale: חֶלְקָה désigne ici une parcelle de terre. « Champ » est clair et idiomatique dans ce récit de combat, tandis que « au milieu » rend directement בְּתוֹךְ.
- source_word: וַיַּצִּילֶהָ
  choice: le défendit
  rationale: נצל signifie sauver ou délivrer. Le suffixe féminin renvoie à la parcelle; dans ce contexte, « défendre le champ » exprime clairement qu'il l'arrache au contrôle ennemi.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: battit les Philistins
  rationale: נכה, dans un contexte guerrier, peut signifier frapper ou vaincre. « Battit » conserve le sens martial sans suggérer nécessairement que chaque Philistin fut tué.
- source_word: וַיַּעַשׂ יְהוָה
  choice: Yahweh accorda
  rationale: Avec תְּשׁוּעָה comme complément, עשה indique que Yahweh produit ou accomplit la délivrance. « Accorda » est une formulation française naturelle qui maintient pleinement l'initiative divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que par un titre, afin de représenter le nom divin présent dans le texte hébreu.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: une grande victoire
  rationale: תְּשׁוּעָה peut désigner le salut, la délivrance ou la victoire. Dans ce récit militaire, « grande victoire » communique le plus directement le résultat concret de l'intervention salvatrice de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: L'hébreu emploie directement le tétragramme. « Yahweh » préserve ici le caractère personnel du nom divin au lieu de lui substituer un titre.
- issue: Sens de תְּשׁוּעָה dans un contexte militaire
  choice: victoire
  alternative: délivrance; salut
  rationale: Le contexte immédiat décrit l'issue d'un combat, ce qui favorise « victoire ». La note conserve toutefois les autres valeurs possibles du terme et souligne que cette victoire constitue l'action salvatrice de Yahweh.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concise et martiale. Le pronom « le » reprend naturellement « champ », bien que le nom hébreu correspondant soit féminin. Le marqueur de note est placé après « victoire », terme auquel porte l'alternative lexicale.
