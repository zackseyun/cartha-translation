  text: וַ/אֲבִישַׁ֞י אֲחִ֣י יוֹאָ֣ב בֶּן צְרוּיָ֗ה ה֚וּא רֹ֣אשׁ ה/שלשי וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל וְ/ל/וֹ שֵׁ֖ם בַּ/שְּׁלֹשָֽׁה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: fr
  text: Abishaï[a], frère de Joab et fils de Tserouya, était le chef des Trois. Il brandit sa lance contre trois cents hommes et les tua[b] ; il se fit un nom parmi les Trois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici « chef des Trois ». En raison du passage parallèle de 1 Chroniques 11.20 et d’incertitudes textuelles dans cette section, certains comprennent plutôt « chef des Trente ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « Il leva sa lance contre trois cents hommes tués. » L’hébreu est concis : littéralement, « il éveilla / leva sa lance contre trois cents transpercés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: le chef des Trois
  rationale: רֹאשׁ désigne le chef ou la tête d’un groupe. Malgré l’incertitude textuelle et le parallèle de 1 Chroniques 11.20, la forme massorétique et בַּשְּׁלֹשָׁה à la fin du verset favorisent ici « les Trois ».
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: Il brandit sa lance
  rationale: Le verbe עורר signifie littéralement éveiller, soulever ou mettre en mouvement. Avec « lance » comme complément dans un contexte guerrier, « brandir » exprime naturellement l’action sans en effacer l’image.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: contre trois cents hommes et les tua
  rationale: La formulation hébraïque est condensée et parle littéralement de « trois cents transpercés/tués ». La traduction explicite en français le résultat implicite de l’attaque, tandis qu’une note conserve la tournure plus littérale.
- source_word: וְלוֹ שֵׁם
  choice: il se fit un nom
  rationale: L’expression signifie littéralement qu’« un nom était à lui », c’est-à-dire qu’il acquit réputation ou renom. « Se faire un nom » conserve l’image hébraïque dans un français idiomatique.
- source_word: בַּשְּׁלֹשָׁה
  choice: parmi les Trois
  rationale: La préposition בְּ suivie du nombre situe ici Abishaï par rapport à ce groupe d’élite ; « parmi » rend clairement cette relation.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: Abishaï ... Joab ... Tserouya
  rationale: Les noms propres sont translittérés selon des formes françaises courantes et reconnaissables.
