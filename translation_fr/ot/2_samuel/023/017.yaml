base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: fr
  text: 'Il dit : « Loin de moi, Yahweh[a], de faire cela ! Boirais-je le sang des hommes qui sont allés au péril de leur vie[b] ? » Il ne voulut donc pas boire cette eau. Voilà ce que firent les trois vaillants guerriers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Loin de moi devant Yahweh de faire cela ! »'
    reason: ambiguïté_syntaxique
  - marker: b
    text: 'Littéralement : « avec leur vie ». La tournure signifie qu’ils se sont exposés à un danger mortel. La question est elliptique en hébreu et peut aussi se traduire plus littéralement : « Est-ce le sang des hommes qui sont allés avec leur vie ? »'
    reason: alternative_lexicale_et_syntaxique
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: Loin de moi, Yahweh, l’idée de faire cela !
  rationale: חָלִילָה exprime une vive répulsion ou un refus catégorique. La formulation française conserve cette force et traite יְהוָה comme une apostrophe possible, sans transformer la phrase en souhait jussif (« Que Yahweh m’en garde »).
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: Boirais-je le sang de ces hommes
  rationale: La proposition hébraïque est elliptique et interrogative. Le verbe « boire », fourni par le contexte, rend clairement l’idée que David assimile cette eau au sang des hommes.
- source_word: בְּנַפְשׁוֹתָם
  choice: au péril de leur vie
  rationale: Littéralement « avec leur vie » ; dans ce contexte, l’expression indique qu’ils se sont exposés à un danger mortel.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Il ne voulut donc pas boire cette eau
  rationale: אָבָה porte sur la volonté ou le consentement. « Cette eau » explicite naturellement en français le référent contextuel du suffixe hébreu.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: les trois vaillants guerriers
  rationale: Dans ce récit, גִּבֹּרִים désigne les combattants d’élite de David ; « vaillants guerriers » en exprime le sens dans un français moderne et digne.
theological_decisions:
- issue: Valeur syntaxique de יְהוָה dans חָלִילָה לִּי יְהוָה
  choice: 'Apostrophe : « Loin de moi, Yahweh »'
  alternative: « Loin de moi devant Yahweh » ou « Que Yahweh m’en garde »
  rationale: L’apostrophe est une lecture plausible qui conserve directement le nom divin. Une note signale la possibilité de comprendre l’expression comme un refus formulé devant Yahweh, sans imposer une résolution dogmatique.
- issue: Assimilation de l’eau au sang des hommes
  choice: « Boirais-je le sang de ces hommes »
  alternative: « Est-ce le sang de ces hommes… ? »
  rationale: David ne déclare pas que l’eau est littéralement du sang ; son interrogation exprime le coût humain et le danger mortel liés à son obtention. La note conserve la forme plus littérale et elliptique.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite les archaïsmes, tout en gardant la vigueur du refus de David et l’ellipse rhétorique de l’hébreu.
