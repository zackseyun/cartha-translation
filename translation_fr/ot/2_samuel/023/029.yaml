lexical_decisions:
- source_word: חֵלֶב
  choice: Héleb
  rationale: Nom propre translittéré sous une forme française lisible ; l’accent aide à conserver la première voyelle distincte.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu naturel et direct du marqueur de filiation dans cette liste de noms.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Translittération française sobre du nom propre, sans h final non prononcé.
- source_word: הַנְּטֹפָתִי
  choice: de Netofa
  rationale: Le gentilé indique l’origine ou l’appartenance ; cette formulation est plus naturelle en français moderne que « le Netofatite ».
- source_word: אִתַּי
  choice: Ittaï
  rationale: Translittération française qui marque la séparation des voyelles finales.
- source_word: רִיבַי
  choice: Ribaï
  rationale: Translittération française lisible qui représente la finale du nom hébreu.
- source_word: מִגִּבְעַת
  choice: de Guibéa
  rationale: La préposition מִן exprime ici l’origine ; « de » convient naturellement dans une liste nominative.
- source_word: בְּנֵי בִנְיָמִן
  choice: des descendants de Benjamin
  rationale: Rend l’expression littérale « fils de Benjamin » dans son sens collectif et tribal sans ambiguïté sur une filiation immédiate.
