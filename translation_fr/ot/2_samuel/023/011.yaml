base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: fr
  text: Après lui venait Shamma, fils d’Agué, le Hararite. Les Philistins se rassemblèrent pour le combat[a]. Il y avait là une parcelle du champ pleine de lentilles, et le peuple s’enfuit devant les Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile. Elle peut signifier « pour le combat » ; d’autres la comprennent comme « en troupe » ou y voient un nom de lieu, « à Léhi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Après lui venait
  rationale: Rend la succession dans la liste de façon naturelle en français; le verbe « venait » est suppléé pour former une phrase idiomatique.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: Shamma, fils d’Agué, le Hararite
  rationale: Translittère les noms et conserve « Hararite » comme désignation d’origine ou de clan sans la préciser indûment.
- source_word: וַיֵּאָסְפוּ פְלִשְׁתִּים
  choice: Les Philistins se rassemblèrent
  rationale: Le pronominal français exprime naturellement le rassemblement du groupe.
- source_word: לַחַיָּה
  choice: pour le combat
  rationale: Expression hébraïque difficile; le contexte militaire et le parallèle de 1 Chroniques 11.13 favorisent une indication du but du rassemblement, tout en signalant l’incertitude en note.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: une parcelle de champ
  rationale: « Parcelle » restitue le terrain délimité désigné par חֶלְקָה, tandis que « de champ » garde le rapport construit.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: pleine de lentilles
  rationale: Traduction directe qui n’ajoute pas explicitement l’idée de plantation.
- source_word: וְהָעָם
  choice: le peuple
  rationale: Conserve le terme général hébreu sans l’identifier plus précisément aux soldats.
- source_word: נָס מִפְּנֵי
  choice: s’enfuit devant
  rationale: Tour français naturel qui maintient l’image d’une fuite face aux Philistins.
