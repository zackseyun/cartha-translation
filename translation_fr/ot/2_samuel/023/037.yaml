  yaml_path: translation/ot/2_samuel/023/037.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, armor-bearer of Joab son of Zeruiah;
translation:
  language: fr
  text: Tsélek l’Ammonite, Naharaï de Bééroth, porteur d’armes de Joab, fils de Tserouya ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶלֶק
  choice: Çélek
  rationale: Nom propre translittéré selon des conventions françaises modernes, avec une initiale qui représente le son consonantique hébreu.
- source_word: הָעַמֹּנִי
  choice: l’Ammonite
  rationale: Gentilé français courant désignant l’origine ethnique ou nationale de Çélek.
- source_word: נַחְרַי
  choice: Naharaï
  rationale: Translittération française qui rend les voyelles du texte massorétique et distingue naturellement les deux dernières voyelles.
- source_word: הַבְּאֵרֹתִי
  choice: de Bééroth
  rationale: Le gentilé hébreu indique l’origine géographique. La tournure française « de Bééroth » est plus naturelle et immédiatement compréhensible qu’un gentilé rare.
- source_word: נשאי כְּלֵי
  choice: porteur d’armes
  rationale: La forme consonantique transmise, comprise comme un participe de נשׂא avec כְּלֵי, désigne celui qui porte l’équipement militaire d’un chef. « Porteur d’armes » conserve le sens sans suggérer uniquement une armure défensive.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Joab, fils de Tserouya
  rationale: Reproduction directe de l’identification familiale, avec la ponctuation naturelle d’une liste française.
