  text: ו/אחר/ו אֶלְעָזָ֥ר בֶּן דדי בֶּן אֲחֹחִ֑י בִּ/שְׁלֹשָׁ֨ה גברים עִם דָּוִ֗ד בְּ/חָֽרְפָ֤/ם בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: fr
  text: Après lui venait Éléazar, fils de Dodo[a], fils d’Ahohi, l’un des trois hommes vaillants qui étaient avec David, lorsqu’ils défièrent[b] les Philistins, rassemblés là pour le combat, et les hommes d’Israël montèrent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils de Dodaï, fils d’un Ahohite ».
    reason: lexical_alternative
  - marker: b
    text: Ou « insultèrent ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « et les hommes d’Israël montèrent » ; dans ce contexte, cela peut signifier qu’ils se retirèrent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: Après lui venait
  rationale: Introduit le vaillant suivant dans la série; le verbe « venait » complète naturellement en français cette proposition d’identification sans verbe explicite.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Transcription française courante du nom hébreu.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: fils de Dodo, fils d’Ahohi
  rationale: Traite Dodo et Ahohi comme des noms propres conformément à une lecture possible du texte consonantique, tout en signalant en note l’analyse alternative du second terme comme gentilé.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: l’un des trois vaillants
  rationale: Exprime clairement l’appartenance d’Éléazar au groupe des trois; « vaillants » rend la valeur héroïque et militaire de גברים dans ce contexte.
- source_word: עִם דָּוִד
  choice: aux côtés de David
  rationale: Rend naturellement en français l’association et l’accompagnement exprimés par עִם.
- source_word: בְּ/חָֽרְפָם
  choice: lorsqu’ils provoquèrent
  rationale: Dans ce contexte militaire, חרף désigne une provocation outrageante ou un défi lancé à l’ennemi. « Provoquèrent » conserve cette nuance sans réduire le terme à une simple insulte.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française usuelle du nom de ce peuple.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: qui s’étaient rassemblés là pour combattre
  rationale: Le nifal de אסף décrit ici le rassemblement des Philistins; la relative identifie clairement son sujet en français.
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: tandis que les hommes d’Israël étaient montés
  rationale: Conserve le sens premier de עלה, « monter », ainsi que l’arrière-plan temporel du récit. Une note indique que, dans ce contexte de bataille, l’expression peut désigner un retrait.
