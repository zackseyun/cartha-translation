base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: fr
  text: Benaya, fils de Yehoyada, était le fils d’un homme valeureux de Qabseel, célèbre par ses nombreux exploits. Il abattit les deux ariels de Moab[a]. Il descendit dans une fosse et y abattit le lion, un jour de neige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu אֲרִאֵל (ariel) est incertain ici. Il pourrait désigner des « hommes semblables à des lions », des « héros », ou être un titre ou un nom ; le texte conserve donc la forme « ariels ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: un homme valeureux
  rationale: Dans cette liste d’exploits guerriers, l’expression décrit vraisemblablement la vigueur et la bravoure plutôt que le simple fait d’être vivant. « Homme valeureux » est naturel et digne en français.
- source_word: רַב פְּעָלִים
  choice: célèbre par ses nombreux exploits
  rationale: L’expression désigne une personne remarquable par l’abondance et l’importance de ses actions. Cette formulation française en rend le sens élogieux et concret.
- source_word: מִקַּבְצְאֵל
  choice: de Qabseel
  rationale: Le préfixe מִן indique ici l’origine géographique. « De Qabseel » est plus fluide en français que « venant de Qabseel » dans cette généalogie concise.
- source_word: הִכָּה
  choice: abattit
  rationale: Dans ce récit guerrier, « abattre » exprime clairement l’action violente de נכה sans recourir à un archaïsme.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: les deux Ariels de Moab
  rationale: Le sens de אֲרִאֵל est incertain. La translittération préserve cette difficulté au lieu d’imposer « héros », « hommes semblables à des lions » ou « fils d’Ariel ».
- source_word: יָרַד
  choice: descendit
  rationale: Le verbe conserve le mouvement vers le bas, important puisque Benaya pénètre dans une fosse.
- source_word: הָאֲרִי
  choice: un lion
  rationale: Le nom désigne clairement un lion. L’article hébreu peut naturellement se rendre par l’indéfini en français lors de la première mention de l’animal.
- source_word: בְּתוֹךְ הַבֹּאר
  choice: au fond d’une fosse
  rationale: בּוֹר peut désigner une fosse ou une citerne. « Fosse » convient au contexte sans supposer un usage précis; « au fond » rend idiomatiquement l’idée de pénétrer à l’intérieur.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: un jour de neige
  rationale: Cette expression française naturelle conserve le cadre temporel d’une journée marquée par la neige.
