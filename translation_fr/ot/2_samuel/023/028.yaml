lexical_decisions:
- source_word: צַלְמוֹן
  choice: Zalmon
  rationale: Nom propre translittéré au plus près de la forme consonantique hébraïque dans ce contexte ; « Salmon » reste une variante attestée.
- source_word: הָאֲחֹחִי
  choice: l’Ahohite
  rationale: Le gentilé précédé de l’article sert ici de désignation clanique ; cette forme concise respecte le style de la liste sans expliciter de manière incertaine une filiation.
- source_word: מַהְרַי
  choice: Maharaï
  rationale: Translittération française du nom propre, avec tréma pour signaler que les deux voyelles finales se prononcent séparément.
- source_word: הַנְּטֹפָתִי
  choice: le Netophatite
  rationale: Le gentilé avec article indique une origine géographique ou une appartenance clanique ; la formulation conserve cette ambiguïté et le caractère concis de la liste.
