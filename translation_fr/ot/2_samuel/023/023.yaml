  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: fr
  text: Il était honoré parmi les Trente[a], mais il n’atteignit pas le rang des Trois[b]. David le plaça à la tête de sa garde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il était plus honoré que les Trente ». La construction hébraïque peut être comprise comme une comparaison plutôt que comme l’inclusion dans le groupe.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « mais il ne vint pas jusqu’aux Trois », c’est-à-dire qu’il n’atteignit pas le rang de ces trois guerriers d’élite.
    reason: lexical_alternative
  - marker: c
    text: Hébreu « à/vers sa mishmaath ». L’expression peut aussi signifier « à la tête de son commandement » ou « sur sa garde » ; « garde » correspond au sens militaire probable dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים
  choice: parmi les Trente
  rationale: Dans cette liste de guerriers, la préposition מִן peut situer Benaya au sein du groupe, tout en permettant aussi une lecture comparative; la majuscule signale un groupe reconnu dans le récit.
- source_word: נִכְבָּד
  choice: était honoré
  rationale: Le niphal de כבד exprime ici l’honneur ou l’estime dont il jouissait, en conservant la nuance passive de l’hébreu.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: mais il n’atteignit pas le rang des Trois
  rationale: Littéralement, il «ne vint pas jusqu’aux Trois»; dans ce contexte de classement militaire, la formulation française explicite naturellement l’idée de ne pas parvenir à leur rang.
- source_word: וַיְשִׂמֵהוּ דָוִד
  choice: David le plaça
  rationale: שׂים signifie mettre ou placer et, dans ce contexte de responsabilité confiée, «plaça» reste naturel tout en demeurant proche de l’image hébraïque.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: à la tête de sa garde personnelle
  rationale: מִשְׁמַעַת peut désigner le commandement, la charge ou le groupe soumis à l’autorité de quelqu’un. Le contexte militaire favorise «garde personnelle», sans exclure les autres sens possibles signalés en note.
