  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: fr
  text: 'Alors toutes les tribus d’Israël vinrent trouver David à Hébron[a] et lui dirent : « Nous voici : nous sommes de tes os et de ta chair[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers Hébron » ; la forme hébraïque du nom « Hébron » porte une terminaison indiquant la direction.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ton os et ta chair » ; formule de parenté exprimant un lien de sang étroit ou une identité familiale commune.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Alors … vinrent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession narrative, et « vinrent » rend simplement בוא.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: toutes les tribus d’Israël
  rationale: Cette formulation conserve le sens collectif et national de l’expression hébraïque.
- source_word: אֶל דָּוִד
  choice: trouver David
  rationale: Dans « vinrent trouver David », la préposition אֶל garde son idée de mouvement vers une personne, sous une forme française naturelle.
- source_word: חֶבְרוֹנָה
  choice: à Hébron
  rationale: La terminaison directionnelle du nom de lieu peut signifier « vers Hébron ». Puisque le mouvement vers David est déjà exprimé par « vinrent trouver », « à Hébron » situe naturellement la rencontre tout en laissant une note signaler la forme hébraïque.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: et lui dirent
  rationale: La formule hébraïque habituelle introduisant un discours est rendue sans reproduire lourdement « dirent en disant ». Le pronom « lui » explicite en français le destinataire déjà indiqué par le contexte.
- source_word: הִנְנוּ
  choice: Nous sommes bien
  rationale: הִנֵּה avec le suffixe de première personne attire l’attention sur l’identité affirmée. Dans cette proposition nominale, « bien » transmet l’insistance de façon plus naturelle que l’interjection littérale « voici » ou « regarde ».
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: tes os et ta chair
  rationale: La traduction conserve l’ordre et l’image corporelle de l’hébreu, qui expriment une parenté et une solidarité étroites. Le pluriel « os » est l’expression française naturelle pour le collectif hébreu עֶצֶם dans cette formule.
- source_word: אֲנָחְנוּ
  choice: nous sommes
  rationale: La proposition nominale hébraïque exige en français l’ajout de la copule « sommes ».
theological_decisions:
- issue: Portée familiale et politique de la formule de parenté
  choice: « Nous sommes bien tes os et ta chair »
  alternative: « Nous sommes de ta famille » ou « Nous sommes de ton peuple »
  rationale: La formulation littérale préserve à la fois la métaphore familiale, l’affirmation d’une identité commune et sa portée politique dans la reconnaissance de David, sans réduire le propos à une simple alliance ni ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans archaïsme excessif. L’image hébraïque est maintenue dans le texte, avec son sens culturel expliqué en note.
