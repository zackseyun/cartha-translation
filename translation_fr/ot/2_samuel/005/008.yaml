  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: fr
  text: 'David dit ce jour-là : « Quiconque frappe les Jébusites et atteint le conduit d’eau[a], ainsi que les boiteux et les aveugles que David déteste[b]. » C’est pourquoi l’on dit : « Ni aveugle ni boiteux n’entrera dans la maison[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la canalisation », « la gouttière » ou « le tunnel ». Le terme hébreu désigne probablement un élément du système d’eau, mais son sens précis est incertain.
    reason: lexical_alternative
  - marker: b
    text: La syntaxe hébraïque de cette proposition est difficile. Certains comprennent « les boiteux et les aveugles » comme une reprise de la provocation des Jébusites au verset précédent, plutôt que comme l’objet direct du défi lancé par David.
    reason: alternative_reading
  - marker: c
    text: 'Ou « dans le palais » : dans ce contexte, le mot traduit par « maison » peut désigner la résidence royale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: Quiconque frappe les Jébusites
  rationale: כָּל suivi du participe exprime ici un défi indéfini. Le gentilé singulier יְבֻסִי a un sens collectif, naturellement rendu au pluriel en français.
- source_word: וְיִגַּע בַּצִּנּוֹר
  choice: et atteint le conduit d’eau
  rationale: נגע signifie couramment « toucher » ou « atteindre ». « Atteint » convient au contexte militaire sans ajouter un sens violent, tandis que « conduit d’eau » rend l’interprétation topographique probable de צִנּוֹר sans masquer son incertitude.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הַעִוְרִים
  choice: ainsi que les boiteux et les aveugles
  rationale: Les adjectifs sont substantivés et pluriels. « Ainsi que » conserve leur rattachement à la proposition précédente tout en laissant perceptible la syntaxe abrupte de l’hébreu.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: que David déteste de toute son âme
  rationale: Cette formulation française naturelle conserve l’image intensive de נֶפֶשׁ דָּוִד (« l’âme de David ») et le sens fort du verbe שנא, sans atténuer la difficulté du texte.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: C’est pourquoi l’on dit
  rationale: La tournure introduit une parole proverbiale et garde le sujet indéfini du verbe hébreu.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: Ni aveugle ni boiteux
  rationale: Les deux singuliers ont ici une portée générique. La construction française avec « ni… ni… » exprime naturellement cette valeur dans une phrase négative.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: n’entrera dans la maison
  rationale: « Entrer dans » rend naturellement le mouvement exprimé par בוא אֶל. « Maison » conserve la largeur sémantique de בַּיִת sans imposer l’interprétation « palais ».
theological_decisions:
- issue: L’attribution à David de la haine envers « les boiteux et les aveugles »
  choice: Conserver l’attribution difficile dans le texte principal sans l’adoucir.
  alternative: Comprendre ces mots comme la reprise de la provocation des Jébusites au verset précédent, ou paraphraser pour ne pas attribuer cette haine à David.
  rationale: Le texte massorétique est syntaxiquement difficile, mais sa formulation ne doit être ni corrigée silencieusement ni étendue en affirmation doctrinale générale sur le handicap.
- issue: Portée de l’interdiction proverbiale concernant la maison
  choice: Traduire la parole telle quelle, sans préciser une interdiction cultuelle.
  alternative: Interpréter « la maison » comme le temple ou comme le palais royal.
  rationale: Le verset ne nomme pas explicitement le temple. Le contexte peut suggérer une résidence royale, mais cette identification reste interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase volontairement abrupte du discours direct reflète la syntaxe comprimée et incertaine de l’hébreu. Les termes concernant le handicap sont descriptifs et non euphémisés, conformément au texte source.
