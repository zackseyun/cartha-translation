  source_fidelity: La structure narrative et les verbes de mouvement (« montèrent », « descendit ») rendent fidèlement le texte hébreu. Toutefois, « consacrer ... par l’onction » explicite et interprète davantage que מָשַׁח, qui se rend directement par « oindre ».
  naturalness: Le texte est globalement fluide en français moderne. « Oindre David comme roi » est à la fois plus concis, idiomatique dans un contexte biblique et plus proche de l’original que « consacrer David par l’onction comme roi ».
  terminology: « Philistins », « roi sur Israël », « à la recherche de David » et « place forte » conviennent. Le terme « oindre » préserve le vocabulaire royal et rituel du texte sans en développer l’implication.
