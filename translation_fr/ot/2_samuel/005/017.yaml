base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: fr
  text: Quand les Philistins apprirent qu’on avait oint David comme roi sur Israël, ils montèrent tous à la recherche de David. David l’apprit et descendit à la place forte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la forteresse ». Le terme hébreu désigne un lieu fortifié.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Nom traditionnel et immédiatement reconnaissable de ce peuple en français biblique moderne.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que les Philistins apprennent.
- source_word: מָשְׁחוּ
  choice: on avait consacré David par l’onction
  rationale: Le plus-que-parfait marque l’antériorité de l’onction par rapport à la nouvelle reçue; la tournure impersonnelle conserve l’absence de sujet exprimé en hébreu, tandis que «par l’onction» rend explicite le geste concret de משׁח.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: comme roi sur Israël
  rationale: «Comme roi» est naturel après «consacrer par l’onction», et «sur Israël» conserve l’idée d’autorité royale portée par עַל.
- source_word: וַיַּעֲלוּ כָל פְּלִשְׁתִּים
  choice: ils montèrent tous
  rationale: La traduction garde le mouvement ascendant de עלה ainsi que l’insistance de כָל, sans ajouter l’idée non exprimée d’une marche militaire.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: à la recherche de David
  rationale: Cette formulation conserve la portée assez large de בקש; le contexte suggère une intention hostile sans que le verbe précise s’il s’agit de capturer ou de tuer David.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: David l’apprit
  rationale: Le pronom «l’» restitue naturellement en français le contenu implicite de ce que David entend.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Rend directement le mouvement descendant exprimé par ירד.
- source_word: הַמְּצוּדָה
  choice: la place forte
  rationale: מצודה désigne un lieu fortifié servant de refuge ou de position défensive; «place forte» est clair, actuel et suffisamment général.
