revisions:
- from: Quand les Philistins apprirent qu’on avait consacré David par l’onction comme roi sur Israël, ils montèrent tous à la recherche de David. David l’apprit et descendit à la place forte[a].
  to: Quand les Philistins apprirent qu’on avait oint David comme roi sur Israël, ils montèrent tous à la recherche de David. David l’apprit et descendit à la place forte[a].
  rationale: La révision remplace la périphrase interprétative « consacré ... par l’onction » par « oint », l’équivalent direct de מָשַׁח. Le reste de la traduction conserve adéquatement l’ordre narratif, l’ampleur de la mobilisation philistine, l’intention non spécifiée de leur recherche et l’ambiguïté topographique du terme מצודה.
