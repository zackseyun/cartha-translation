language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: fr
  text: David reconnut que Yahweh l’avait établi roi sur Israël et qu’il avait élevé son royaume en faveur de son peuple Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en faveur du peuple de David, Israël », si le pronom « son » renvoie à David plutôt qu’à Yahweh.'
    reason: Lecture alternative concernant l’antécédent du pronom hébreu.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: reconnut
  rationale: Le verbe ידע exprime ici le fait de savoir ou de prendre pleinement conscience. « Reconnut » convient au récit et peut inclure l’idée que David discerna l’action de Yahweh, sans ajouter une explication absente de l’hébreu.
- source_word: הֱכִינוֹ
  choice: l’avait établi
  rationale: Le hiphil de כון signifie rendre ferme, affermir ou établir. Dans ce contexte royal, « l’avait établi » exprime naturellement la consolidation divine de David dans sa fonction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel יהוה au lieu de le remplacer par un titre.
- source_word: לְמֶלֶךְ
  choice: roi
  rationale: Avec le verbe « établir », le français dit naturellement « établir quelqu’un roi ». Cette formulation rend la fonction indiquée par לְ sans lourdeur.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Dans un contexte de royauté, עַל indique l’autorité exercée sur un peuple.
- source_word: נִשֵּׂא
  choice: avait élevé
  rationale: Le verbe נשׂא exprime l’élévation. « Avait élevé » conserve cette image et son sens d’exaltation dans le contexte royal.
- source_word: מַמְלַכְתּוֹ
  choice: son royaume
  rationale: ממלכה peut désigner le royaume, la royauté ou le règne. « Son royaume » est direct et conserve l’étendue possible du terme hébreu.
- source_word: בַּעֲבוּר
  choice: en faveur de
  rationale: L’expression indique ici le bénéficiaire ou le but de l’élévation du royaume. « En faveur de » rend ce sens dans un français naturel et digne.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: son peuple Israël
  rationale: Cette formulation garde l’apposition hébraïque et laisse grammaticalement possible que « son » renvoie à Yahweh ou à David, bien que Yahweh soit l’antécédent le plus probable.
theological_decisions:
- issue: Antécédent du suffixe dans עַמּוֹ (« son peuple »)
  choice: 'Dans le texte principal, « son » est compris en premier lieu comme renvoyant à Yahweh : Israël est le peuple de Yahweh.'
  alternative: 'Le suffixe peut être compris comme renvoyant à David : Israël est alors le peuple placé sous son autorité royale.'
  rationale: Yahweh est le sujet qui établit David et élève son royaume, et l’expression biblique présente souvent Israël comme le peuple de Yahweh. Toutefois, la morphologie du pronom ne tranche pas à elle seule entre Yahweh et David; une note préserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et narratif. Le plus-que-parfait marque que David reconnaît des actes déjà accomplis par Yahweh. « Élevé son royaume » conserve volontairement l’image hébraïque plutôt que de la remplacer par une paraphrase plus interprétative.
