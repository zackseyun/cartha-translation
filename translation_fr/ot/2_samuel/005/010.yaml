  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: fr
  text: David devenait de plus en plus grand[a], et Yahweh, le Dieu des armées, était avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « David allait grandissant. » La tournure hébraïque exprime une croissance continue et accentuée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד הָלוֹךְ וְגָדוֹל
  choice: David ne cessait de gagner en puissance
  rationale: La combinaison du verbe conjugué וַיֵּלֶךְ avec l’infinitif absolu הָלוֹךְ et וְגָדוֹל exprime une progression continue. Cette formulation française restitue naturellement cette continuité ainsi que l’accroissement de l’importance et de la puissance de David dans le contexte, sans réduire l’expression à un simple déplacement.
- source_word: דָּוִד
  choice: David
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui conserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: צְבָאוֹת désigne des armées ou des troupes organisées. « Le Dieu des armées » reste concret et suffisamment large pour ne pas préciser si ces armées sont terrestres, célestes, ou les unes et les autres.
- source_word: עִמּוֹ
  choice: était avec lui
  rationale: Traduction directe de la préposition avec suffixe pronominal, exprimant la présence et l’appui de Dieu auprès de David.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée du titre אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  alternative: le Dieu des puissances célestes
  rationale: Le texte ne précise pas la nature des צְבָאוֹת. La traduction retenue conserve cette amplitude et évite de limiter le titre aux seules armées célestes.
- issue: Nature de l’accroissement de David
  choice: gagner en puissance
  alternative: devenir de plus en plus grand
  rationale: Dans ce contexte royal, l’expression concerne vraisemblablement l’essor de David en importance et en puissance, non sa taille physique. La note conserve toutefois la formulation plus littérale et son amplitude.
translation_notes:
  register: Français international moderne, clair et digne. « Ne cessait de gagner en puissance » est idiomatique et restitue la progression continue du texte hébreu ; le titre « Dieu des armées » garde la force concrète et l’indétermination du terme source.
