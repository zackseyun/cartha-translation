  text: וַ/יִּשְׁאַ֤ל דָּוִד֙ בַּֽ/יהוָ֔ה וַ/יֹּ֖אמֶר לֹ֣א תַעֲלֶ֑ה הָסֵב֙ אֶל אַ֣חֲרֵי/הֶ֔ם וּ/בָ֥אתָ לָ/הֶ֖ם מִ/מּ֥וּל בְּכָאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: fr
  text: 'David consulta donc Yahweh, qui lui répondit : « Ne monte pas. Contourne-les par derrière et attaque-les en face des arbres à baume[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « arbres de baca » ; traditionnellement « mûriers ». L’espèce exacte désignée par le terme hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consulta ... Yahweh
  rationale: Avec la préposition ב et le nom divin, שׁאל désigne ici le fait de rechercher la direction de Dieu. « Consulter Yahweh » est naturel en français et convient au contexte militaire.
- source_word: לֹא תַעֲלֶה
  choice: Ne monte pas
  rationale: L’impératif négatif rend directement l’interdiction exprimée en hébreu; « monter » conserve aussi le vocabulaire de déplacement militaire sans le préciser excessivement.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: Contourne-les, passe derrière eux
  rationale: Cette formulation claire restitue le mouvement tactique consistant à faire le tour de l’ennemi pour gagner ses arrières.
- source_word: וּבָאתָ לָהֶם
  choice: puis arrive sur eux
  rationale: Dans ce contexte militaire, בוא avec ל indique une arrivée dirigée contre l’adversaire. La formulation conserve l’image hébraïque sans ajouter explicitement un verbe comme « attaquer ».
- source_word: מִמּוּל
  choice: en face de
  rationale: Le terme marque une position vis-à-vis d’un repère, ici les arbres; « en face de » préserve ce rapport spatial.
- source_word: בְּכָאִים
  choice: arbres à baume
  rationale: L’identification botanique reste incertaine. « Arbres à baume » représente une interprétation lexicale courante, tandis que d’autres possibilités sont signalées en note.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Identification du locuteur dans וַיֹּאמֶר
  choice: qui lui répondit
  alternative: et il dit
  rationale: Dans la séquence où David consulte Yahweh, Yahweh est naturellement le sujet implicite de la réponse. La relative française évite que le pronom « il » soit compris comme renvoyant à David.
translation_notes:
  register: Français moderne, sobre et digne. Le discours direct demeure concis et militaire. Le marqueur de note est placé après le terme botanique concerné, et non après le nom divin.
