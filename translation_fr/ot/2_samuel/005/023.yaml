  source_fidelity: 'Le sens essentiel est bien rendu : David consulte Yahweh, reçoit l''interdiction de « monter », doit manœuvrer vers l''arrière des ennemis, puis venir contre eux en face des בְּכָאִים. Le nom divin est correctement conservé. « Passe derrière eux » explicite de manière acceptable le mouvement indiqué par הָסֵב אֶל־אַחֲרֵיהֶם.'
  naturalness: « Arrive sur eux » est compréhensible dans un contexte militaire, mais demeure moins idiomatique et un peu imprécis en français moderne. « Attaque-les » exprime naturellement la valeur hostile de וּבָאתָ לָהֶם dans ce contexte. « Contourne-les par derrière » est plus fluide que la succession « Contourne-les, passe derrière eux », sans perdre le mouvement tactique.
  terminology: « Yahweh » est cohérent avec le tétragramme. « Arbres à baume » est une option lexicalement possible, à condition de maintenir une note qui signale l'incertitude botanique. La note doit employer la tournure française naturelle « arbres de baca ».
