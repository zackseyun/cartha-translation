  naturalness: Le français est clair, narratif et de registre approprié. « Ils disaient ainsi » est intelligible mais un peu pesant ; « Ils disaient » conserve la reprise rhétorique sans ajouter de nuance.
  terminology: « Jébusites », « aveugles » et « boiteux » sont des rendus exacts et sobres. Les termes relatifs au handicap sont conservés parce qu’ils appartiennent à la raillerie rapportée, sans que la traduction les cautionne.
