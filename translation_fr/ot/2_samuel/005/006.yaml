base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: fr
  text: 'Le roi et ses hommes allèrent à Jérusalem, chez les Jébusites qui habitaient le pays. Ceux-ci dirent[a] à David : « Tu n’entreras pas ici, car même les aveugles et les boiteux te repousseront[b] ! » Ils disaient : « David n’entrera pas ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « il dit à David » ; ce singulier peut désigner collectivement les habitants jébusites.
    reason: ambiguïté grammaticale
  - marker: b
    text: 'L’hébreu contient littéralement une formulation difficile, que l’on peut rendre : « à moins que les aveugles et les boiteux ne te repoussent ». La syntaxe et la portée précises de la clause sont discutées. Elle semble exprimer une provocation : les Jébusites jugeaient la ville si sûre que même des aveugles et des boiteux pourraient empêcher David d’y entrer.'
    reason: difficulté textuelle et solution interprétative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: allèrent
  rationale: Le verbe הלך fait avancer le récit et signifie simplement « aller » ; « marchèrent contre » préciserait excessivement la nuance militaire.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: le roi et ses hommes
  rationale: Cette formulation conserve la portée assez large de אֲנָשָׁיו sans réduire nécessairement le groupe à des soldats.
- source_word: אֶל הַיְבֻסִי יוֹשֵׁב הָאָרֶץ
  choice: vers les Jébusites qui habitaient le pays
  rationale: אֶל signifie fondamentalement « vers, à » ; le singulier gentilique et le participe ont ici une valeur collective, rendue naturellement au pluriel en français.
- source_word: וַיֹּאמֶר
  choice: Ceux-ci dirent
  rationale: Le texte hébreu porte formellement le singulier « il dit », mais son sujet collectif est le peuple jébusite. Le pluriel explicite le sens contextuel, tandis qu’une note conserve la forme de l’hébreu.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Tu n’entreras pas ici
  rationale: Dans le contexte d’une ville fortifiée, « entrer » exprime naturellement le mouvement implicite sans transformer la déclaration en interdiction juridique.
- source_word: כִּי אִם הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: car même les aveugles et les boiteux te repousseront
  rationale: 'La construction hébraïque est difficile. Cette traduction restitue la force vraisemblable de la provocation : la place serait si sûre que même ses défenseurs aveugles et boiteux suffiraient à écarter David. La note signale la formulation plus littérale.'
- source_word: לֵאמֹר לֹא יָבוֹא דָוִד הֵנָּה
  choice: 'Ils disaient ainsi : « David n’entrera pas ici. »'
  rationale: La reprise conserve le second לֵאמֹר et la répétition rhétorique de la certitude affichée par les Jébusites.
theological_decisions:
- issue: Mention des personnes aveugles et boiteuses dans une parole de mépris
  choice: Conserver « les aveugles et les boiteux » comme contenu concret de la provocation rapportée
  alternative: Paraphraser par « même les plus faibles parmi nous »
  rationale: Le narrateur rapporte les paroles hostiles des Jébusites. Une généralisation atténuerait le texte et masquerait son langage réel sans nécessité linguistique.
- issue: Sujet singulier ou collectif de וַיֹּאמֶר
  choice: Employer le pluriel contextuel « Ceux-ci dirent » et signaler le singulier hébreu en note
  alternative: Traduire formellement « Il dit à David »
  rationale: Le référent collectif jébusite est clair, mais la note préserve l’ambiguïté grammaticale au lieu de la faire disparaître.
translation_notes:
  register: Français international moderne, narratif et digne. Le choix « allèrent » reste sobre ; « entrer ici » convient à une place fortifiée. La répétition finale, un peu marquée en français, est maintenue parce qu’elle appartient à la rhétorique de l’hébreu.
