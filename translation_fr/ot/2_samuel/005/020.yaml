revisions:
- from: 'David se rendit donc à Baal-Peratsim[a] et là, il les frappa. Il dit : « Yahweh a ouvert une brèche parmi mes ennemis devant moi, comme une brèche ouverte par les eaux[b]. » C’est pourquoi il donna à ce lieu le nom de Baal-Peratsim.'
  to: 'David se rendit donc à Baal-Peratsim[a], et là il les frappa. Il dit : « Yahweh a fait irruption contre mes ennemis devant moi, comme des eaux qui font irruption[b]. » C’est pourquoi il donna à ce lieu le nom de Baal-Peratsim.'
  rationale: La révision corrige l’orientation de l’action divine (« contre mes ennemis ») et remplace une image française artificielle par une formulation naturelle qui reproduit autant que possible la répétition lexicale de l’hébreu. Elle préserve le nom de lieu, l’ambiguïté inhérente à son explication et l’attribution de la victoire à Yahweh.
