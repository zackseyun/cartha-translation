base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: fr
  text: 'David se rendit donc à Baal-Peratsim[a], et là il les frappa. Il dit : « Yahweh a fait irruption contre mes ennemis devant moi, comme des eaux qui font irruption[b]. » C’est pourquoi il donna à ce lieu le nom de Baal-Peratsim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Baal-Peratsim » évoque probablement le « maître des irruptions » ou des « brèches » et reprend le mot employé dans la déclaration de David : Yahweh a « fait irruption » contre ses ennemis.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « comme le déferlement des eaux ». L’hébreu emploie ici un mot de la même famille que le verbe rendu par « a fait irruption » et que le nom « Baal-Peratsim » ; la répétition française cherche à conserver ce jeu de mots.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-Peratsim
  rationale: Le nom de lieu est translittéré plutôt que traduit. La forme « Peratsim » laisse aussi percevoir le jeu de mots avec פָּרַץ et פֶּרֶץ, rendu en français par « brèche ».
- source_word: וַיַּכֵּם
  choice: il les frappa
  rationale: Le verbe נכה exprime ici une action militaire violente. « Il les frappa » en conserve la force sans ajouter explicitement qu’ils furent tous tués.
- source_word: פָּרַץ
  choice: a ouvert une brèche
  rationale: Cette expression rend l’idée de rupture ou d’irruption et permet de maintenir le lien lexical avec פֶּרֶץ dans la comparaison ainsi qu’avec le nom Baal-Peratsim.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de rendre le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Traduction directe et naturelle du nom muni du suffixe de première personne.
- source_word: לְפָנַי
  choice: devant moi
  rationale: La formulation conserve l’image spatiale du texte hébreu et convient au contexte militaire.
- source_word: כְּפֶרֶץ מָיִם
  choice: comme une brèche ouverte par les eaux
  rationale: La formulation préserve la répétition de l’idée de brèche, essentielle au jeu de mots du verset, tout en évoquant la force irrésistible des eaux.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: il donna à ce lieu le nom de
  rationale: Cette tournure française naturelle exprime fidèlement l’acte de nommer sans reproduire servilement l’idiome hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le nom propre divin. « Yahweh » le représente directement et évite de remplacer le nom par un titre.
- issue: Agent et image de la victoire
  choice: Yahweh ouvre lui-même une brèche parmi les ennemis
  alternative: Yahweh disperse ou défait les ennemis
  rationale: La traduction conserve l’image concrète de la rupture et attribue explicitement la victoire à Yahweh, comme le fait le texte hébreu, sans réduire la métaphore à une simple défaite militaire.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le nom de lieu est translittéré sous la forme « Baal-Peratsim ». La répétition de « brèche » est volontaire : malgré une légère lourdeur, elle conserve le jeu de mots structurant de l’hébreu.'
