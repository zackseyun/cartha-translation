  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּשָּׂאֵ֥/ם דָּוִ֖ד וַ/אֲנָשָֽׁי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: fr
  text: Ils laissèrent là leurs idoles[b], et David et ses hommes les emportèrent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Chroniques 14.12 ajoute que David donna l’ordre de brûler les idoles. Ici, le texte hébreu de Samuel dit seulement que David et ses hommes les emportèrent.
    reason: cross_reference
  - marker: b
    text: Ou « leurs images ». Le terme hébreu désigne ici des représentations cultuelles ; « idoles » en explicite le sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: ils laissèrent
  rationale: Le verbe עזב signifie couramment « laisser » ou « abandonner ». Ici, « laissèrent » décrit naturellement les Philistins en fuite qui laissent leurs objets derrière eux.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe locatif שָׁם est rendu directement et naturellement par « là ».
- source_word: עֲצַבֵּיהֶם
  choice: leurs idoles
  rationale: Le nom désigne ici les représentations cultuelles des Philistins. « Idoles » explicite leur fonction religieuse, tandis que la variante plus formelle « statues » est signalée en note.
- source_word: וַיִּשָּׂאֵם
  choice: les emportèrent
  rationale: נשא peut signifier « soulever », « porter » ou « emporter ». Dans ce récit, « les emportèrent » exprime clairement le déplacement des idoles sans préciser indûment ce qui leur arriva ensuite.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: David et ses hommes
  rationale: Cette formulation suit directement l’hébreu et désigne naturellement les hommes qui accompagnaient David, sans imposer le terme plus interprétatif « soldats ».
theological_decisions:
- issue: Rapport avec le récit parallèle de 1 Chroniques 14.12, qui précise que les idoles furent brûlées
  choice: Traduire le texte massorétique de 2 Samuel par « les emportèrent », sans l’harmoniser avec les Chroniques
  alternative: Introduire dans le corps du verset leur destruction par le feu
  rationale: Le texte hébreu de Samuel dit seulement que David et ses hommes emportèrent les idoles. Le renseignement supplémentaire des Chroniques est conservé en note, sans être importé dans ce verset.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple maintient le registre dignifié du récit biblique tout en restant immédiatement compréhensible. Les marqueurs de note sont placés après les segments précis auxquels ils se rapportent.
