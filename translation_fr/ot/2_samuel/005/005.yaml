  text: בְּ/חֶבְרוֹן֙ מָלַ֣ךְ עַל יְהוּדָ֔ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֗ךְ שְׁלֹשִׁ֤ים וְ/שָׁלֹשׁ֙ שָׁנָ֔ה עַ֥ל כָּל יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: fr
  text: À Hébron, il régna sur Juda pendant sept ans et six mois. À Jérusalem, il régna pendant trente-trois ans sur tout Israël et Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: À Hébron
  rationale: La préposition בְּ indique ici le lieu. En français courant, « à Hébron » est la formulation naturelle avec un nom de ville.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe au qatal récapitule la durée du règne de David plutôt que son accession au trône; « régna » en conserve précisément le sens.
- source_word: עַל יְהוּדָה
  choice: sur Juda
  rationale: Avec מָלַךְ, la préposition עַל désigne le peuple ou le territoire soumis à l'autorité royale.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: pendant sept ans et six mois
  rationale: « Pendant » explicite naturellement en français la durée exprimée par le complément hébreu, sans en modifier le contenu.
- source_word: וּבִירוּשָׁלַם
  choice: À Jérusalem
  rationale: La préposition indique le second lieu du règne. Une nouvelle phrase rend clairement le parallélisme sans devoir reproduire mécaniquement la conjonction hébraïque.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: pendant trente-trois ans
  rationale: La quantité est rendue selon l'usage numérique naturel du français moderne.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: sur tout Israël et Juda
  rationale: La traduction maintient les deux désignations politiques du texte hébreu. « Tout » porte grammaticalement sur Israël, conformément à l'ordre et à la syntaxe de la formulation source.
