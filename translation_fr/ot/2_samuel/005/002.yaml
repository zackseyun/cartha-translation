  text: גַּם אֶתְמ֣וֹל גַּם שִׁלְשׁ֗וֹם בִּ/הְי֨וֹת שָׁא֥וּל מֶ֨לֶךְ֙ עָלֵ֔י/נוּ אַתָּ֗ה הייתה מוציא ו/ה/מבי אֶת יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר יְהוָ֜ה לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּ֛ה תִּהְיֶ֥ה לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: fr
  text: 'Autrefois déjà[a], lorsque Saül était roi sur nous, c’était toi qui faisais sortir Israël et qui le faisais rentrer[b]. Yahweh t’a dit : « Tu feras paître mon peuple, Israël, et tu seras chef[c] d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « hier et avant-hier » ; expression hébraïque signifiant « autrefois » ou « depuis déjà un certain temps ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu faisais sortir et entrer Israël » ; expression hébraïque désignant la conduite du peuple dans ses activités, particulièrement lors des campagnes militaires.'
    reason: lexical_alternative
  - marker: c
    text: Ou « dirigeant » ; le terme hébreu employé ici n’est pas le mot habituel pour « roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: Déjà auparavant
  rationale: L’expression signifie littéralement « hier et avant-hier », mais fonctionne ici comme un idiome désignant le temps passé. « Déjà auparavant » exprime aussi que David exerçait ce rôle avant son accession présente.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: lorsque Saül était roi sur nous
  rationale: La construction introduit une proposition temporelle. « Roi sur nous » conserve la formulation et le point de vue des anciens d’Israël.
- source_word: אַתָּה
  choice: c’était toi
  rationale: Le pronom indépendant est emphatique ; la tournure clivée française en restitue naturellement l’insistance.
- source_word: הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: qui faisais sortir Israël et qui le ramenais
  rationale: La traduction garde l’image hébraïque des sorties et des retours tout en employant une syntaxe française naturelle. Dans le contexte, la formule évoque la conduite du peuple, notamment lors des campagnes militaires.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: תִרְעֶה
  choice: Tu conduiras mon peuple Israël comme un berger
  rationale: Cette formulation conserve la métaphore pastorale appliquée au gouvernement royal tout en restant immédiatement compréhensible en français moderne.
- source_word: נָגִיד
  choice: chef
  rationale: Le terme désigne un dirigeant établi à la tête du peuple et n’est pas le mot hébreu habituel pour « roi ». « Chef » maintient cette distinction sans la connotation dynastique moderne de « prince ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin ; « Yahweh » préserve sa fonction de nom propre.
- issue: Métaphore royale de תִרְעֶה
  choice: Tu conduiras mon peuple Israël comme un berger
  alternative: Tu gouverneras mon peuple Israël
  rationale: Le maintien de l’image du berger conserve la conception biblique du roi chargé de guider et de protéger le peuple de Dieu, sans réduire le verbe à l’exercice abstrait du pouvoir.
- issue: Distinction entre נָגִיד et le terme courant pour « roi »
  choice: chef
  alternative: roi
  rationale: Le choix évite d’assimiler silencieusement נָגִיד à מֶלֶךְ et préserve la nuance d’un dirigeant désigné ou établi.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe souligne le rôle antérieur de David, tandis que les images hébraïques de la sortie et du retour ainsi que celle du berger sont conservées sans lourdeur littérale.
