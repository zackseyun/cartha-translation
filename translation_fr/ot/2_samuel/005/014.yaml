  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: fr
  text: 'Voici les noms de ceux qui lui naquirent à Jérusalem : Shammoua, Shobab, Nathan et Salomon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule présentative introduit naturellement une liste en français moderne ; la conjonction initiale n’a pas besoin d’être rendue séparément.
- source_word: שְׁמוֹת
  choice: les noms
  rationale: Le pluriel construit introduit directement l’énumération des noms.
- source_word: הַיִּלֹּדִים
  choice: ceux qui naquirent
  rationale: Le participe passif signifie littéralement « ceux qui furent enfantés / qui naquirent ». Cette formulation préserve la valeur participiale sans préciser « fils » au-delà de la forme hébraïque.
- source_word: לוֹ
  choice: lui
  rationale: Avec le verbe naître, le pronom marque ici la filiation ; « qui lui naquirent » est une tournure française concise et digne.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Le syntagme prépositionnel indique le lieu de naissance ; le français emploie normalement « à » devant un nom de ville.
- source_word: שַׁמּוּעַ
  choice: Shammoua
  rationale: Translittération adaptée aux conventions phonétiques françaises, notamment « ou » pour /u/.
- source_word: שׁוֹבָב
  choice: Shobab
  rationale: Translittération directe du nom propre, compatible avec l’usage biblique français.
- source_word: נָתָן
  choice: Nathan
  rationale: Forme biblique française établie du nom hébreu.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme biblique française traditionnelle et immédiatement reconnaissable du nom hébreu.
