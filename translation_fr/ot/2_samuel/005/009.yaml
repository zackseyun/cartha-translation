source:
  edition: WLC
  text: וַ/יֵּ֤שֶׁב דָּוִד֙ בַּ/מְּצֻדָ֔ה וַ/יִּקְרָא לָ֖/הּ עִ֣יר דָּוִ֑ד וַ/יִּ֤בֶן דָּוִד֙ סָבִ֔יב מִן הַ/מִּלּ֖וֹא וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: fr
  text: David s’installa dans la forteresse et l’appela « Cité de David ». Puis David bâtit tout autour, depuis le Millo vers l’intérieur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « depuis le Millo et vers l’intérieur ». Le « Millo » désignait probablement un ouvrage connu ou un remblai en terrasses à Jérusalem.'
    reason: La nature exacte du Millo et la relation syntaxique entre מִן הַמִּלּוֹא et וָבָיְתָה restent incertaines.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: s’installa
  rationale: Le verbe ישב peut signifier habiter ou s’établir. Dans ce contexte, « s’installa » exprime naturellement que David établit sa résidence dans la forteresse conquise, sans archaïsme.
- source_word: בַּמְּצֻדָה
  choice: dans la forteresse
  rationale: מְצֻדָה désigne un lieu fortifié. « Forteresse » est clair, courant et conserve le sens militaire et défensif.
- source_word: וַיִּקְרָא לָהּ
  choice: l’appela
  rationale: La construction קרא + ל indique ici l’attribution d’un nom. « L’appela » suit directement la formulation hébraïque.
- source_word: עִיר דָּוִד
  choice: Cité de David
  rationale: Il s’agit d’une désignation géographique devenue un nom propre. La majuscule et la forme « Cité de David » sont naturelles en français biblique moderne.
- source_word: וַיִּבֶן
  choice: bâtit
  rationale: בנה signifie fondamentalement « bâtir ». Ce choix évite de préciser sans preuve textuelle qu’il aurait fortifié ou rebâti les lieux.
- source_word: סָבִיב
  choice: tout autour
  rationale: סָבִיב exprime l’idée d’un aménagement sur le pourtour; « tout autour » en restitue naturellement l’étendue.
- source_word: מִן הַמִּלּוֹא
  choice: depuis le Millo
  rationale: מִלּוֹא paraît être un terme topographique ou architectural connu, mais son référent exact reste débattu. La translittération préserve cette incertitude.
- source_word: וָבָיְתָה
  choice: vers l’intérieur
  rationale: La forme directionnelle indique vraisemblablement un mouvement vers la partie intérieure. Cette traduction conserve le sens spatial probable sans identifier à tort une maison précise.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « S’installa » est plus naturel que « demeura » dans ce récit; « bâtit » garde la sobriété du verbe hébreu. La note conserve l’incertitude topographique et syntaxique.
