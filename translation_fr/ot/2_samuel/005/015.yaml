lexical_decisions:
- source_word: יִבְחָר
  choice: Yibhar
  rationale: Nom propre translittéré selon une forme proche de l’hébreu; le yod initial est rendu par « Y » en français.
- source_word: אֱלִישׁוּעַ
  choice: Élishoua
  rationale: Nom propre translittéré dans une graphie française lisible; la finale gutturale ʿayin n’est pas représentée dans l’orthographe courante.
- source_word: נֶפֶג
  choice: Néfeg
  rationale: Nom propre translittéré directement, avec un accent facilitant la prononciation française.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Nom propre translittéré selon une graphie française naturelle, avec « Y » pour le yod initial; le ʿayin final n’est pas noté.
- source_word: וְ
  choice: et
  rationale: La conjonction préfixée relie les noms. En français courant, elle est rendue par des virgules puis un seul « et » avant le dernier nom.
