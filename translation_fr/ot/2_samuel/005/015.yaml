  text: Yibhar[a], Élishoua, Néfeg et Yafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète la conjonction « et » devant chaque nom : « et Yibhar, et Élishoua, et Néfeg, et Yafia ».'
