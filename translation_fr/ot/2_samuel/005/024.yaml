source:
  edition: WLC
  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: fr
  text: Quand tu entendras un bruit de pas à la cime des arbres à baume[a], alors agis avec décision, car Yahweh sera sorti devant toi pour frapper le camp des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des arbres de Baka » ; l’espèce d’arbre désignée par le mot hébreu est incertaine. Des traductions anciennes parlent parfois de mûriers.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: Quand tu entendras
  rationale: 'La construction avec היה suivie de l’infinitif construit introduit la circonstance future : « quand tu entendras ». Le futur français convient au contexte de l’instruction.'
- source_word: קוֹל צְעָדָה
  choice: un bruit de pas
  rationale: קוֹל désigne un son ou un bruit, et צְעָדָה l’action de marcher ou des pas. « Bruit de pas » reste concret et préserve l’étrangeté du signe entendu dans les arbres.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: au sommet des arbres à baume
  rationale: רָאשֵׁי désigne ici la partie supérieure des arbres. L’identification botanique de בְּכָאִים est incertaine ; « arbres à baume » est une équivalence lexicale courante, avec l’incertitude signalée en note.
- source_word: אָז תֶּחֱרָץ
  choice: alors agis avec décision
  rationale: Dans ce contexte, חרץ appelle une action énergique et résolue. Cette formulation garde l’urgence sans réduire le sens à la seule rapidité.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: Yahweh sera sorti devant toi
  rationale: Le parfait יָצָא présente l’action divine comme déjà engagée au moment où le signe sera entendu. Le futur antérieur rend ce rapport temporel en français, tandis que « devant toi » conserve l’image de Yahweh précédant David au combat.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: pour frapper le camp des Philistins
  rationale: נכה signifie frapper dans un contexte militaire, et מַחֲנֶה désigne littéralement le camp, avec une possible portée collective sur les forces qui y sont rassemblées.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » rend le nom propre divin sans le remplacer par un titre.
- issue: Temporalité de l’action divine יָצָא
  choice: sera sorti
  alternative: sortira / est sorti
  rationale: Le parfait hébreu, situé après la circonstance future, indique que Yahweh aura déjà pris les devants lorsque David percevra le signe. Le futur antérieur préserve cette nuance sans transformer le verset en affirmation générale.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse singulière à David. La formulation conserve l’image inhabituelle du bruit de pas dans la cime des arbres et le mouvement de Yahweh précédant David au combat.
