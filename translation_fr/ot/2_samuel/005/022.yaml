base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/022.yaml
  text: And the Philistines came up again and spread out in the Valley of Rephaim[a].
translation:
  language: fr
  text: Les Philistins montèrent de nouveau et se déployèrent dans la vallée des Rephaïm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’étendirent »; le verbe hébreu décrit probablement les Philistins prenant position dans toute la vallée. Il peut aussi être compris au sens de « lancèrent un raid ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: montèrent de nouveau
  rationale: La construction יסף avec עוֹד et l’infinitif exprime la répétition de l’action. « Montèrent de nouveau » restitue naturellement le mouvement militaire vers les hauteurs sans calquer la tournure hébraïque.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation ethnique française usuelle.
- source_word: וַיִּנָּטְשׁוּ
  choice: se déployèrent
  rationale: Dans ce contexte militaire, le verbe décrit vraisemblablement des troupes qui prennent position sur une certaine étendue. « Se déployèrent » rend ce sens avec précision tout en conservant dans une note les autres possibilités lexicales.
- source_word: בְּעֵמֶק רְפָאִים
  choice: dans la vallée des Rephaïm
  rationale: עֵמֶק désigne une vallée, et רְפָאִים est conservé comme nom propre selon sa forme française traditionnelle.
