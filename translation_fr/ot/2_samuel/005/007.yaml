  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: fr
  text: Mais David s’empara de la place forte de Sion[a], c’est-à-dire la Cité de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « forteresse de Sion ». Le terme hébreu désigne un lieu fortifié.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: s’empara de
  rationale: Le verbe לכד désigne couramment la prise d’un lieu. « S’empara de » est naturel en français moderne et convient au contexte militaire.
- source_word: וַ
  choice: Mais
  rationale: Le waw fait progresser le récit tout en marquant ici un contraste avec l’assurance des Jébusites au verset précédent. « Mais » rend clairement cette relation discursive.
- source_word: מְצֻדַת
  choice: place forte
  rationale: Le nom מצודה désigne un lieu fortifié et défendable. « Place forte » conserve cette portée sans préciser indûment le type d’ouvrage.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom propre צִיּוֹן.
- source_word: הִיא
  choice: c’est-à-dire
  rationale: Le pronom indépendant introduit ici une identification appositionnelle entre la place forte de Sion et la Cité de David. « C’est-à-dire » en exprime naturellement la valeur explicative.
- source_word: עִיר דָּוִד
  choice: la Cité de David
  rationale: Cette formulation rend la relation génitivale et correspond à une désignation géographique établie en français.
