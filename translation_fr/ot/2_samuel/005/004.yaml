  text: David was thirty years old when he began to reign[b][a], and he reigned forty years.
translation:
  language: fr
  text: David avait trente ans lorsqu’il devint roi[a], et il régna quarante ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsqu’il commença à régner ».
