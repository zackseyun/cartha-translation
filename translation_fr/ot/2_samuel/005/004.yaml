lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: avait trente ans
  rationale: L’expression hébraïque, littéralement « fils de trente ans », est une tournure idiomatique indiquant l’âge. La formulation française naturelle en transmet exactement le sens.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition בְּ suivie de l’infinitif construit de מלך et du suffixe de troisième personne marque ici le moment de l’accession à la royauté. Cette formulation française est naturelle et conserve la valeur temporelle de la formule royale.
- source_word: מָלָךְ
  choice: il régna
  rationale: Le verbe מלך désigne l’exercice de la royauté. « Il régna » est la formulation précise et traditionnelle dans ce résumé de règne.
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarante ans
  rationale: Le groupe formé du nombre et du nom indique directement la durée du règne.
- source_word: דָּוִד
  choice: David
  rationale: Le nom propre est rendu selon sa forme française conventionnelle.
