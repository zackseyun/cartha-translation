base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: fr
  text: 'David consulta Yahweh en disant : « Dois-je monter contre les Philistins ? Les livreras-tu entre mes mains[a] ? » Yahweh dit à David : « Monte, car je livrerai assurément les Philistins entre tes mains. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les remettras-tu en mon pouvoir ? » L’expression hébraïque « livrer entre les mains » signifie couramment accorder la victoire sur un ennemi.'
    reason: Précision sur l’idiome hébraïque et indication d’une traduction possible.
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: consulta
  rationale: Dans ce contexte, le verbe שׁאל désigne une demande de direction adressée à Dieu. « Consulta » exprime cette démarche sans préciser un moyen rituel absent du texte.
- source_word: בַּיהוָה / יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu directement par « Yahweh », afin de préserver le nom d’alliance présent dans le texte hébreu.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Cette formule introduit le contenu de la consultation de David et conserve de façon naturelle la structure du discours hébreu.
- source_word: הַאֶעֱלֶה
  choice: Dois-je monter
  rationale: La tournure rend la valeur délibérative de la question. « Monter » conserve le verbe עלה sans expliciter davantage que le texte la nature de l’action militaire.
- source_word: אֶל פְּלִשְׁתִּים
  choice: contre les Philistins
  rationale: Dans ce contexte militaire, la préposition אֶל indique un mouvement hostile en direction des Philistins ; « contre » est l’expression française naturelle.
- source_word: הֲתִתְּנֵם ... בְּיָדִי
  choice: Les livreras-tu entre mes mains
  rationale: La formulation conserve l’image hébraïque de la remise de l’ennemi entre les mains de David, idiome qui signifie que Dieu lui accordera la victoire.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif reprend le même verbe עלה que dans la question de David, ce qui préserve la répétition lexicale du texte.
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: car je livrerai assurément
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la promesse ; « assurément » restitue cette emphase en français courant et digne.
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Le même idiome est traduit de manière identique dans la réponse de Yahweh, préservant le parallélisme avec la question de David.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme. « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
- issue: Sens de la remise des Philistins entre les mains de David
  choice: Conserver l’image « entre mes/tes mains » et en expliquer le sens militaire en note
  alternative: Traduire directement par « me/te donner la victoire sur eux »
  rationale: L’image hébraïque est intelligible en français et maintient la formulation concrète du texte, tandis que la note signale son sens idiomatique sans réduire la phrase à une paraphrase.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression hébraïque, tout en employant des questions naturelles en français. La répétition de « monter » et l’image des « mains » sont conservées.
