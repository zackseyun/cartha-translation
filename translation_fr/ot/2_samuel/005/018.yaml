  text: וּ/פְלִשְׁתִּ֖ים בָּ֑אוּ וַ/יִּנָּטְשׁ֖וּ בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/018.yaml
  text: And the Philistines came and spread out in the Valley of Rephaim[a].
translation:
  language: fr
  text: Les Philistins arrivèrent et se déployèrent dans la vallée des Refaïm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se répandirent dans la vallée des Refaïm ».'
    reason: Alternative lexicale pour וַיִּנָּטְשׁוּ, qui peut évoquer des troupes s’étendant sur une zone sans préciser aussi nettement une manœuvre organisée.
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Les Philistins
  rationale: Le waw assure ici la continuité narrative sans devoir être rendu explicitement en français; פְלִשְׁתִּים est l’ethnonyme usuel « Philistins ».
- source_word: בָּאוּ
  choice: arrivèrent
  rationale: Le qal accompli de בוא exprime leur venue sur les lieux; « arrivèrent » est naturel dans ce contexte militaire et narratif.
- source_word: וַ/יִּנָּטְשׁוּ
  choice: se déployèrent
  rationale: Dans ce contexte militaire, נטשׁ décrit l’occupation étendue du terrain. « Se déployèrent » rend clairement cette idée, tout en signalant en note l’alternative moins technique « se répandirent ».
- source_word: בְּ/עֵמֶק
  choice: dans la vallée des
  rationale: La préposition ב est locative et עֵמֶק signifie « vallée ». La construction française naturelle du nom de lieu est « vallée des Refaïm ».
- source_word: רְפָאִים
  choice: Refaïm
  rationale: Dans עֵמֶק רְפָאִים, le terme appartient à un nom géographique et est donc translittéré plutôt que traduit.
