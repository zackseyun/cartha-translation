base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: fr
  text: David fit ainsi, comme Yahweh le lui avait ordonné. Il battit les Philistins depuis Guéba[a] jusqu’aux abords de Guézer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu massorétique porte « Guéba ». Certaines traductions retiennent un autre nom de lieu en raison d’une variante textuelle ou du récit parallèle.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « jusqu’à ton arrivée à Guézer », expression qui désigne ici l’approche ou les environs de Guézer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִד כֵּן
  choice: David fit ainsi
  rationale: L’expression française rend naturellement et avec concision l’idée que David exécuta les instructions reçues.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: exactement comme … le lui avait ordonné
  rationale: « Exactement comme » souligne la conformité de l’action de David à l’ordre antérieur, tandis que le plus-que-parfait respecte l’enchaînement narratif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיַּךְ
  choice: il battit
  rationale: Dans ce contexte militaire, נכה désigne la défaite infligée à l’ennemi. « Battit » est idiomatique, actuel et n’impose pas l’idée que chaque adversaire fut tué.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française usuelle de ce peuple.
- source_word: מִגֶּבַע
  choice: depuis Guéba
  rationale: Le texte massorétique porte גֶּבַע, Guéba. Cette forme est conservée malgré les variantes ou harmonisations présentes dans certaines traditions.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: jusqu’aux abords de Guézer
  rationale: La tournure hébraïque, littéralement « jusqu’à ton arrivée à Guézer », indique ici l’approche ou les environs immédiats de la ville. « Aux abords » en restitue clairement la portée géographique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le nom personnel divin. « Yahweh » le préserve explicitement sans le remplacer par un titre, tout en évitant d’ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. La première phrase conserve la concision du récit; la seconde emploie un vocabulaire militaire clair sans archaïsme. Les appels de note sont placés auprès des expressions qu’ils expliquent.
