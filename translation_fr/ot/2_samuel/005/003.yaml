source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹ֣ת לָ/הֶם֩ הַ/מֶּ֨לֶךְ דָּוִ֥ד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֧וּ אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: fr
  text: Ainsi, tous les anciens d’Israël vinrent trouver le roi à Hébron. Le roi David conclut avec eux une alliance[a] à Hébron devant Yahvé[b], et ils oignirent David comme roi sur Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « coupa une alliance », expression qui signifie « conclut une alliance ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en présence de Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent trouver
  rationale: Le verbe בוא exprime ici le déplacement vers le roi; « vinrent trouver » rend naturellement en français la venue auprès d’une personne.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: tous les anciens d’Israël
  rationale: Cette formulation conserve à la fois la totalité exprimée par כָּל et le rôle collectif de direction désigné par זִקְנֵי.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: le roi à Hébron
  rationale: La finale directionnelle de חֶבְרוֹנָה indique un mouvement vers Hébron; la formulation française précise naturellement que le roi s’y trouve.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: conclut une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance ». « Conclure une alliance » en restitue le sens solennel et idiomatique en français.
- source_word: לָהֶם
  choice: avec eux
  rationale: Dans la construction avec כּרת ברית, la relation entre les parties se rend naturellement par « avec eux ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: « Devant » préserve la formulation concise et formelle de l’hébreu, tout en pouvant désigner la présence divine comme témoin de l’alliance.
- source_word: וַיִּמְשְׁחוּ
  choice: ils oignirent
  rationale: Dans ce contexte royal, משׁח désigne précisément l’acte d’oindre; le terme français conserve sa portée rituelle et politique.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: comme roi sur Israël
  rationale: Cette tournure exprime clairement l’établissement de David dans la royauté et son autorité sur Israël.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette construction titre-nom est la manière naturelle de rendre l’apposition hébraïque en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: « Yahvé » représente le nom divin plutôt que de le remplacer par un titre; cette forme est courante et immédiatement reconnaissable en français.
- issue: Portée de בְּרִית
  choice: alliance
  alternative: accord ou traité
  rationale: « Alliance » conserve la solennité ainsi que la portée politique et théologique du terme dans le contexte de l’établissement royal de David.
- issue: Sens de לִפְנֵי יְהוָה
  choice: devant Yahvé
  alternative: en présence de Yahvé
  rationale: « Devant Yahvé » reste proche de la formulation hébraïque sans exclure le sens de présence divine; la variante explicative est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit historique écrit. La structure est légèrement aérée en deux phrases pour éviter une accumulation lourde, tout en conservant la succession narrative et la répétition d’Hébron présente dans l’hébreu.
