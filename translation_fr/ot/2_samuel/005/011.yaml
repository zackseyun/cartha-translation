  variant: modern international French
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: fr
  text: Hiram, roi de Tyr, envoya à David des messagers, du bois de cèdre, des artisans travaillant le bois et des artisans travaillant la pierre pour les murs[a]. Ils construisirent une maison[b] pour David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «des maçons». L’expression hébraïque mentionne à la fois la «pierre» et le «mur».
    reason: lexical_alternative
  - marker: b
    text: Ou «un palais». L’hébreu dit littéralement «une maison», terme qui peut désigner un palais dans un contexte royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Équivalent narratif courant et direct du verbe שׁלח.
- source_word: חִירָם
  choice: Hiram
  rationale: Transcription française usuelle du nom propre.
- source_word: מֶלֶךְ צֹר
  choice: roi de Tyr
  rationale: Rend directement la chaîne construite désignant le titre et le royaume de Hiram.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Conserve le sens large du terme, qui peut désigner ici des envoyés diplomatiques sans l’imposer explicitement.
- source_word: וַעֲצֵי אֲרָזִים
  choice: du bois de cèdre
  rationale: Rend naturellement l’expression hébraïque désignant du bois de construction provenant de cèdres, sans préciser indûment sa forme.
- source_word: חָרָשֵׁי עֵץ
  choice: des artisans travaillant le bois
  rationale: Préserve le sens général d’artisans spécialisés dans le bois; «charpentiers» serait potentiellement trop restrictif.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: des artisans travaillant la pierre pour les murs
  rationale: La formulation garde les deux éléments explicites de l’hébreu, «pierre» et «mur», tout en restant intelligible en français.
- source_word: וַיִּבְנוּ
  choice: Ils construisirent
  rationale: Le pluriel renvoie naturellement aux ouvriers mentionnés; le passé simple convient au registre narratif biblique digne et actuel.
- source_word: בַיִת
  choice: une maison
  rationale: Conserve le sens premier du mot hébreu; dans ce contexte royal, il peut toutefois s’agir d’un palais, possibilité signalée en note.
- source_word: לְדָוִד
  choice: pour David
  rationale: Rend simplement le datif de bénéficiaire.
theological_decisions: []
