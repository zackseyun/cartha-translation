  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: fr
  text: David prit encore des concubines et des épouses à Jérusalem[a], après son arrivée d’Hébron, et d’autres fils et filles lui naquirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de Jérusalem ». Cette expression peut aussi préciser le lieu d’où David prit ces femmes après s’y être installé.'
    reason: La note préserve la formulation plus littérale et l’ambiguïté géographique, sans ajouter que ces femmes étaient habitantes de Jérusalem.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח désigne ici le fait de prendre des femmes comme concubines ou épouses. « Prit » conserve la formulation directe de l’hébreu sans ajouter d’évaluation.
- source_word: עוֹד
  choice: encore
  rationale: Dans ses deux occurrences, l’adverbe exprime l’ajout. « Encore » est naturel en français et indique que David avait déjà des concubines, des épouses et des enfants.
- source_word: פִּלַגְשִׁים וְנָשִׁים
  choice: des concubines et des épouses
  rationale: La traduction maintient la distinction explicite entre les deux catégories. « Épouses » précise ici le sens conjugal de נָשִׁים et évite l’ambiguïté de « femmes » en français moderne.
- source_word: מִירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition מִן signifie formellement « de/depuis », mais dans ce contexte elle peut désigner le lieu où David prit ces femmes. « À Jérusalem » donne le sens contextuel probable, tandis que la note conserve la forme hébraïque et son autre interprétation possible.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: après son arrivée d’Hébron
  rationale: Cette formulation française naturelle conserve la relation temporelle et le point de départ exprimé par מֵחֶבְרוֹן.
- source_word: וַיִּוָּלְדוּ עוֹד לְדָוִד
  choice: il eut encore
  rationale: L’hébreu dit littéralement que d’autres enfants « naquirent à David ». La tournure « il eut encore » exprime naturellement en français la même relation de filiation sans suggérer que David les mit lui-même au monde.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: L’expression conserve les deux termes précis de l’hébreu au lieu de les généraliser en « enfants ».
theological_decisions:
- issue: Description narrative de la polygamie de David
  choice: Rapporter l’action sans commentaire moral ajouté.
  alternative: Employer une formulation qui exprime l’approbation ou la condamnation de cette pratique.
  rationale: Le verset décrit les actes de David et les naissances qui suivent, sans porter ici de jugement moral explicite. La traduction ne doit ni approuver ni condamner ce que le texte se contente de rapporter.
translation_notes:
  register: Français international moderne, clair et digne. « Épouses » distingue nettement les femmes mariées des concubines. La phrase reste narrative et neutre, sans moralisation ajoutée.
