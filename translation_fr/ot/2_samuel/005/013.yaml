review_pass:
  verdict: revise
  source_fidelity: Le texte principal rend correctement la distinction בין concubines et épouses, la succession après l’arrivée d’Hébron et l’ajout d’enfants. « À Jérusalem » est une contextualisation recevable de מִירוּשָׁלִַם, à condition que la note conserve sans extrapolation la possibilité plus formelle « de Jérusalem ». La formulation « il eut » est idiomatique, mais efface la voix passive de la formule de naissance; « lui naquirent » la préserve mieux.
  naturalness: Le français est clair et de registre narratif digne. « D’autres fils et filles lui naquirent » reste naturel dans un français biblique moderne et reflète plus directement la formulation source que « il eut encore des fils et des filles ».
  terminology: « Concubines » et « épouses » maintiennent à juste titre les deux catégories explicites du texte hébreu. Aucun commentaire moral ne doit être ajouté.
  issues:
  - severity: medium
    issue: La note affirme que les femmes auraient été prises « parmi les habitantes de Jérusalem ».
    rationale: Le syntagme מִירוּשָׁלִַם indique littéralement « de Jérusalem »; il peut concerner le lieu associé à l’action, mais ne dit pas que les femmes étaient habitantes de la ville. Cette précision introduit une information non exprimée.
  - severity: low
    issue: « Il eut encore des fils et des filles » reformule la naissance passive en possession/paternité.
    rationale: La reformulation est compréhensible, mais le texte dit que des fils et des filles furent/nacquirent à David. Une tournure française conservant la naissance rend plus précisément la forme source.
  revised_text: David prit encore des concubines et des épouses à Jérusalem[a], après son arrivée d’Hébron, et d’autres fils et filles lui naquirent.
  revised_footnotes:
