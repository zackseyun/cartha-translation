base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: fr
  text: Après la mort de Saül, David, revenu après avoir frappé les Amalécites[a], resta deux jours à Tsiklag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Amalec », nom collectif désignant le peuple amalécite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Après
  rationale: La formule narrative introduit ici la circonstance temporelle sans qu’il soit nécessaire d’ajouter un « Or » ou un « Il arriva » peu naturel.
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: Après la mort de Saül
  rationale: Cette formulation naturelle conserve le cadre temporel nominal de l’hébreu.
- source_word: וְדָוִד שָׁב
  choice: David, revenu
  rationale: Le participe détaché exprime naturellement en français une action déjà accomplie avant le séjour de David à Tsiklag.
- source_word: מֵהַכּוֹת
  choice: après avoir frappé
  rationale: Le verbe conserve l’idée d’une action militaire violente sans préciser au-delà du texte s’il s’agit d’une destruction totale.
- source_word: אֶת הָעֲמָלֵק
  choice: les Amalécites[a]
  rationale: Le singulier collectif « Amalec » désigne ici le peuple amalécite ; le pluriel français est immédiatement compréhensible.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Le contexte limite le séjour à deux jours ; « resta » convient mieux que « habita ».
- source_word: בְּצִקְלָג
  choice: à Tsiklag
  rationale: Forme française usuelle du nom de lieu, avec la préposition idiomatique pour un séjour dans une ville.
- source_word: יָמִים שְׁנָיִם
  choice: deux jours
  rationale: Rend directement l’accusatif hébreu de durée.
