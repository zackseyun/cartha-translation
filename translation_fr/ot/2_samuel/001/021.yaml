id: 2SA.1.21
reference: 2 Samuel 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: fr
  text: 'Montagnes de Guilboa,

    qu’il n’y ait sur vous ni rosée ni pluie,

    ni champs d’offrandes[a] !

    Car là fut souillé le bouclier des vaillants,

    le bouclier de Saül,

    non enduit d’huile[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ni champs fertiles », « ni champs de prémices » ou « ni champs de contributions sacrées ». L’expression hébraïque est difficile, et le mot traduit par « offrandes » désigne souvent ce qui est mis à part pour Dieu.
    reason: lexical_alternative
  - marker: b
    text: La formule finale se rapporte très probablement au bouclier, que l’on enduisait d’huile pour le préparer et l’entretenir. La proximité du nom de Saül peut toutefois faire entendre un écho à son statut d’« oint ».
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: Montagnes de Guilboa
  rationale: Le syntagme construit sert d’apostrophe directe à la région montagneuse de Guilboa. « Montagnes » rend simplement הָרֵי, sans ajouter une particule vocative absente de l’hébreu.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: qu’il n’y ait sur vous ni rosée ni pluie
  rationale: Cette tournure optative exprime naturellement en français la malédiction formulée avec אַל et conserve l’adresse directe aux montagnes.
- source_word: וּשְׂדֵי תְרוּמֹת
  choice: ni champs d’offrandes
  rationale: L’expression hébraïque est difficile. תְרוּמוֹת désigne souvent des contributions ou offrandes mises à part pour Dieu. Le texte retient ce sens transparent sans imposer la paraphrase interprétative « champs fertiles »; les principales autres possibilités figurent en note.
- source_word: כִּי שָׁם
  choice: Car là
  rationale: Introduit avec concision la raison de la malédiction et convient au registre poétique de la lamentation.
- source_word: נִגְעַל
  choice: fut souillé
  rationale: Le niphal de געל peut évoquer la souillure, la profanation ou le rejet. « Fut souillé » exprime ici le déshonneur du bouclier tombé au combat sans préciser davantage que l’hébreu.
- source_word: מָגֵן גִּבּוֹרִים
  choice: le bouclier des vaillants
  rationale: גִּבּוֹרִים désigne des hommes puissants ou de vaillants guerriers. « Les vaillants » est concis, intelligible et adapté à la poésie funèbre.
- source_word: מָגֵן שָׁאוּל
  choice: le bouclier de Saül
  rationale: 'La répétition appositionnelle est conservée : le bouclier des vaillants est ensuite identifié plus précisément comme celui de Saül.'
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: non enduit d’huile
  rationale: Dans ce contexte, la formule décrit très probablement le bouclier qui n’est plus traité avec de l’huile, pratique connue pour l’entretien des boucliers. « Enduit » est plus naturel en français pour un objet que « oint », tout en conservant l’image concrète.
theological_decisions:
- issue: Rapport possible entre מָשִׁיחַ et le titre théologique « oint/Messie »
  choice: 'La formule est rendue comme décrivant le bouclier : « non enduit d’huile »'
  alternative: 'Comprendre la formule comme une allusion à Saül en tant qu’oint, par exemple : « le bouclier de Saül, l’oint d’huile » ou « le bouclier de Saül, qui n’était plus l’oint »'
  rationale: La construction avec בַּשָּׁמֶן (« avec/de l’huile ») et le contexte immédiat du bouclier favorisent le sens ordinaire d’un objet enduit d’huile. La traduction évite donc d’introduire ici un titre messianique ou une affirmation théologique que la syntaxe ne requiert pas, tout en signalant l’enjeu en note.
translation_notes:
  register: Français international moderne, digne et poétique, avec des vers brefs qui reproduisent le mouvement de la lamentation. La répétition de « bouclier » et l’adresse aux montagnes sont conservées. Les formulations volontairement inhabituelles mais significatives de l’hébreu ne sont pas lissées sans signalement.
