base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: fr
  text: 'David lui demanda : « Que s’est-il passé ? Dis-le-moi, je t’en prie. » Il répondit : « Le peuple a fui le combat, et un grand nombre de gens du peuple sont tombés et sont morts[a]. Saül et son fils Jonathan sont morts eux aussi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte d’un combat, « tomber » signifie couramment être abattu. Les mots « sont morts » en précisent ici l’issue.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: Que s’est-il passé ?
  rationale: Cette formulation française naturelle rend l’expression idiomatique qui signifie littéralement « Qu’est devenue la chose ? » ou « Quelle a été l’affaire ? » et demande ici le récit des événements.
- source_word: הַגֶּד נָא לִי
  choice: Dis-le-moi, je t’en prie
  rationale: L’impératif signifie « raconte/annonce-moi », tandis que נָא marque une demande pressante ou courtoise. La formulation retenue conserve les deux nuances.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: Le peuple a fui le combat
  rationale: נָס signifie « fuir » et הָעָם désigne collectivement le peuple ou les hommes engagés. « Le combat » rend naturellement מִלְחָמָה dans ce contexte militaire.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם
  choice: et beaucoup d’hommes sont tombés
  rationale: Dans un récit de bataille, נפל est une expression courante pour ceux qui tombent frappés. « Beaucoup d’hommes » explicite naturellement qu’il s’agit de membres du peuple sans ajouter une catégorie militaire absente du texte.
- source_word: וַיָּמֻתוּ
  choice: et sont morts
  rationale: Le verbe énonce explicitement la mort après « sont tombés ». Les deux verbes sont conservés afin de respecter l’insistance du texte hébreu.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: Saül et son fils Jonathan sont morts eux aussi
  rationale: Le passé composé rend directement le parfait hébreu dans ce récit rapporté. « Eux aussi » restitue וְגַם, et « son fils » est maintenu explicitement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste direct et naturel. La répétition « sont tombés et sont morts » est volontairement conservée, car elle correspond à deux verbes distincts dans l’hébreu et souligne l’ampleur du désastre.
