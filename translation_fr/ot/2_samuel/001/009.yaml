  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲמָד נָ֤א עָלַ/י֙ וּ/מֹ֣תְתֵ֔/נִי כִּ֥י אֲחָזַ֖/נִי הַ/שָּׁבָ֑ץ כִּֽי כָל ע֥וֹד נַפְשִׁ֖/י בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: fr
  text: 'Il me dit : « S’il te plaît, tiens-toi au-dessus de moi et tue-moi, car l’angoisse m’a saisi[a] : je suis encore en vie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les crampes » ou « les convulsions m’ont saisi ». Le mot hébreu traduit par « angoisse » est rare, et son sens exact est incertain.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « car aussi longtemps que ma vie est en moi ». Ou : « car ma vie est encore en moi ». La conjonction peut aussi être comprise dans un sens concessif : « bien que je sois encore en vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Il me dit
  rationale: Le wayyiqtol poursuit simplement le récit. Le passé simple convient au registre narratif français et le pronom reprend naturellement Saül dans le contexte.
- source_word: עֲמָד נָא עָלַי
  choice: S’il te plaît, tiens-toi au-dessus de moi
  rationale: « Tiens-toi » rend עמד, נָא marque la supplication polie, et « au-dessus de moi » conserve la valeur spatiale de עַל dans la situation d’un homme tombé ou blessé.
- source_word: וּמֹתְתֵנִי
  choice: et donne-moi la mort
  rationale: La forme causative demande directement qu’on le fasse mourir. « Donne-moi la mort » est naturel, explicite et digne, sans la tonalité familière que pourrait avoir « achève-moi ».
- source_word: אֲחָזַנִי
  choice: m’a saisi
  rationale: Le verbe אחז exprime une prise forte ou soudaine; « saisir » en préserve la vigueur.
- source_word: הַשָּׁבָץ
  choice: l’angoisse
  rationale: Ce nom rare est de sens incertain. « Angoisse » reste volontairement général et évite de préciser sans certitude un symptôme physiologique.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: bien que ma vie soit encore tout entière en moi
  rationale: נפש désigne ici la vie animée plutôt qu’une « âme » au sens technique. « Bien que » exprime la relation concessive suggérée par le contexte, tandis que « tout entière » conserve כָל, souvent estompé dans les traductions idiomatiques.
theological_decisions:
- issue: Sens de נֶפֶשׁ
  choice: ma vie
  alternative: mon âme
  rationale: Dans cette déclaration d’un blessé encore vivant, le terme renvoie à la vie qui demeure en lui; « âme » risquerait d’introduire une distinction anthropologique absente du propos.
- issue: Valeur de כִּי dans la dernière proposition
  choice: bien que
  alternative: car
  rationale: 'La conjonction peut formellement être causale, mais le contexte soutient une nuance concessive : il demande la mort alors même que sa vie demeure en lui. La note signale la traduction plus littérale afin de préserver l’ambiguïté.'
translation_notes:
  register: Français international moderne, narratif et digne. La supplication reste directe sans être familière. Les deux notes conservent l’incertitude du terme rare הַשָּׁבָץ et l’ambiguïté syntaxique de la dernière proposition.
