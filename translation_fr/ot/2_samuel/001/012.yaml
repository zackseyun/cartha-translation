base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: fr
  text: Ils se lamentèrent, pleurèrent et jeûnèrent jusqu’au soir pour Saül, pour Jonathan, son fils, pour le peuple de Yahweh et pour la maison d’Israël, parce qu’ils étaient tombés par l’épée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: Ils se lamentèrent
  rationale: Le verbe ספד désigne la lamentation funèbre. « Se lamentèrent » restitue cette expression de deuil et la distingue de l’action de pleurer mentionnée ensuite.
- source_word: וַיִּבְכּוּ
  choice: pleurèrent
  rationale: בכה signifie directement « pleurer ». Ce choix simple et solennel préserve la progression des gestes de deuil.
- source_word: וַיָּצֻמוּ
  choice: jeûnèrent
  rationale: צום désigne l’abstention de nourriture dans un contexte de deuil ou de dévotion. « Jeûnèrent » est le terme français direct.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Cette formulation naturelle marque fidèlement le terme de la période de deuil.
- source_word: עַל
  choice: sur
  rationale: La préposition répétée introduit ici les personnes et les groupes au sujet desquels le deuil est mené. La tournure « se lamenter sur » conserve cette relation et la répétition rhétorique de l’hébreu.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Jonathan son fils
  rationale: Cette formulation conserve l’apposition hébraïque, qui identifie Jonathan comme le fils de Saül, sans ajouter d’explication.
- source_word: עַם יְהוָה
  choice: le peuple de Yahweh
  rationale: Le syntagme construit est rendu de façon transparente et conserve le nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette expression collective traditionnelle conserve l’image familiale et corporative de l’hébreu.
- source_word: כִּי
  choice: parce que
  rationale: כִּי introduit ici la raison du deuil ; « parce que » exprime clairement ce rapport causal.
- source_word: נָפְלוּ
  choice: ils étaient tombés
  rationale: נפל signifie « tomber » et sert ici à évoquer la mort au combat. Le plus-que-parfait français situe ces morts avant les gestes de deuil.
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: La traduction conserve l’image hébraïque de l’épée comme instrument de la mort violente, sans la réduire à la paraphrase « au combat ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » en conserve la fonction de nom personnel, tandis que « le Seigneur » lui substituerait un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la série ternaire des gestes de deuil ainsi que la répétition de « sur », qui structure les quatre objets de la lamentation. « Maison d’Israël » est maintenu comme idiome collectif biblique encore intelligible.
