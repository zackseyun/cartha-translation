  text: וַ/יִּקְרָ֣א דָוִ֗ד לְ/אַחַד֙ מֵֽ/הַ/נְּעָרִ֔ים וַ/יֹּ֖אמֶר גַּ֣שׁ פְּגַע בּ֑/וֹ וַ/יַּכֵּ֖/הוּ וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: fr
  text: 'Alors David appela l’un des jeunes hommes et lui dit : « Approche, frappe-le. » Il le frappa, et celui-ci mourut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Dans ce récit, קרא signifie appeler quelqu’un auprès de soi. « Appela » est direct et naturel, sans ajouter la formalité de « convoqua ».
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: l’un des jeunes hommes
  rationale: נְעָרִים peut désigner des jeunes gens, des serviteurs ou des hommes de la suite. La traduction retenue conserve le sens lexical d’âge ou de statut sans imposer une fonction précise.
- source_word: גַּשׁ
  choice: Approche
  rationale: L’impératif de נגשׁ signifie s’approcher ou venir près. « Approche » convient naturellement à l’ordre bref donné ici.
- source_word: פְּגַע בּוֹ
  choice: frappe-le à mort
  rationale: פגע avec ב peut exprimer le fait de frapper ou d’attaquer quelqu’un. Le contexte d’exécution rend l’intention mortelle certaine, tandis que cette formulation conserve l’image d’un coup plutôt que de remplacer le verbe par le simple « tue-le ».
- source_word: וַיַּכֵּהוּ
  choice: Il le frappa
  rationale: נכה est le verbe courant pour frapper. La traduction maintient la succession hébraïque entre l’action et son résultat, énoncé séparément.
- source_word: וַיָּמֹת
  choice: et l’homme mourut
  rationale: מות signifie mourir. Le nom « l’homme » clarifie en français que le sujet est l’Amalécite, et non le jeune homme qui vient de le frapper.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique. La brièveté des impératifs et la succession de l’action puis de la mort sont préservées.
