lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: Il se retourna
  rationale: L’expression signifie littéralement qu’il se tourna derrière lui. « Il se retourna » en rend naturellement le sens spatial en français.
- source_word: וַיִּרְאֵנִי
  choice: et me vit
  rationale: Le verbe ראה avec le suffixe de première personne signifie directement « me vit ».
- source_word: וַיִּקְרָא אֵלַי
  choice: Il m’appela
  rationale: קרא avec אֶל exprime ici l’action d’appeler quelqu’un. Cette formulation reste naturelle sans introduire l’idée plus forte de convocation.
- source_word: וָאֹמַר
  choice: et je répondis
  rationale: Le sens lexical est « je dis », mais dans cet échange « je répondis » exprime naturellement la fonction du verbe en français, sans modifier le contenu.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: Formule française consacrée et naturelle pour la réponse de disponibilité exprimée par הִנֵּנִי.
