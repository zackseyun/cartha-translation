base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: fr
  text: Saül et Jonathan, bien-aimés et charmants durant leur vie, ne furent pas séparés, même dans la mort. Ils furent plus rapides que les aigles[a], plus forts que les lions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les vautours » : le mot hébreu peut désigner plus largement un grand oiseau de proie.'
    reason: lexical_alternative
  - marker: b
    text: Ou « plus puissants que les lions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Saül et Jonathan
  rationale: Formes françaises usuelles des noms bibliques.
- source_word: הַנֶּאֱהָבִים
  choice: aimés
  rationale: Le participe passif de אהב décrit ceux qui étaient aimés; « aimés » reste direct, digne et naturel.
- source_word: וְהַנְּעִימִם
  choice: agréables
  rationale: נעים exprime ce qui est plaisant ou agréable. Ce choix préserve le parallélisme poétique sans imposer l’idée de beauté physique ou de vertu morale.
- source_word: בְּחַיֵּיהֶם
  choice: durant leur vie
  rationale: Expression temporelle naturelle en français, mise en parallèle avec « dans leur mort ».
- source_word: וּבְמוֹתָם לֹא נִפְרָדוּ
  choice: ne furent pas séparés dans leur mort
  rationale: Conserve la forme passive du nifal, le singulier collectif « mort » et le parallélisme de l’hébreu.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: Ils étaient plus rapides que les aigles
  rationale: Dans cette comparaison, קלל évoque la rapidité; נשר désigne un grand rapace, traditionnellement et naturellement rendu ici par « aigles ».
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: plus forts que les lions
  rationale: גבר exprime ici la force ou la supériorité; « plus forts » est clair et idiomatique en français moderne.
theological_decisions:
- issue: Tonalité de la lamentation de David sur Saül et Jonathan
  choice: Conserver l’éloge poétique et honorifique de Saül et Jonathan sans y ajouter de jugement moral.
  alternative: Atténuer l’éloge à cause des fautes antérieures de Saül, ou l’intensifier jusqu’à en faire une idéalisation morale.
  rationale: Le verset appartient à une lamentation funèbre et célèbre ensemble Saül et Jonathan. La traduction doit préserver cette tension avec le récit plus large sans la résoudre.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme de la lamentation est conservé, avec des formulations compréhensibles sans archaïsme marqué.
