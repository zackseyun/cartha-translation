  text: וַ/יֹּ֣אמֶר דָּוִ֔ד אֶל הַ/נַּ֖עַר הַ/מַּגִּ֣יד ל֑/וֹ אֵ֣יךְ יָדַ֔עְתָּ כִּי מֵ֥ת שָׁא֖וּל וִ/יהֽוֹנָתָ֥ן בְּנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: fr
  text: 'David dit alors au jeune homme qui lui avait apporté la nouvelle : « Comment sais-tu que Saül et son fils Jonathan sont morts ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit. « dit alors » exprime naturellement en français la succession narrative.
- source_word: הַנַּעַר
  choice: au jeune homme
  rationale: נַעַר désigne ici un jeune homme assez âgé pour rapporter des événements survenus au combat ; « garçon » serait trop juvénile et « serviteur » ajouterait un statut non explicite.
- source_word: הַמַּגִּיד לוֹ
  choice: qui lui avait apporté la nouvelle
  rationale: Le participe identifie le jeune homme comme celui qui fait le récit à David. Le plus-que-parfait situe naturellement en français ce rapport avant la question, tandis que « apporter la nouvelle » rend le sens contextuel de נגד sans lourdeur.
- source_word: אֵיךְ
  choice: Comment
  rationale: אֵיךְ introduit une question sur le fondement ou le moyen de la connaissance ; « Comment » conserve simplement cette portée.
- source_word: יָדַעְתָּ
  choice: sais-tu
  rationale: Bien que la forme hébraïque soit un accompli, le français emploie naturellement le présent pour l'état actuel de connaissance résultant d'une information antérieure.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce qui est su.
- source_word: מֵת
  choice: sont morts
  rationale: Le verbe hébreu est au singulier malgré le sujet composé. Le français exige le pluriel ; « sont morts » exprime à la fois l'événement et son résultat.
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: Saül et son fils Jonathan
  rationale: Les noms suivent les conventions françaises usuelles, et le suffixe de בְּנוֹ rattache explicitement Jonathan à Saül.
