  text: וַ/יֹּ֕אמֶר לְ/לַמֵּ֥ד בְּנֵֽי יְהוּדָ֖ה קָ֑שֶׁת הִנֵּ֥ה כְתוּבָ֖ה עַל סֵ֥פֶר הַ/יָּשָֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: fr
  text: 'et dit d’enseigner aux fils de Juda « L’Arc »[a]. Voici ce qui est écrit dans le Livre du Juste :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu qéšet signifie « arc ». Il peut désigner le titre « L’Arc » de la complainte qui suit, ou être compris comme une instruction concernant le tir à l’arc.
    reason: Préserve l’ambiguïté syntaxique et sémantique du terme hébreu tout en conservant dans le texte la lecture contextuellement probable d’un titre.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: et ordonna
  rationale: Dans ce contexte, le verbe « dire » introduit une instruction; « ordonna » rend naturellement la force directive sans ajouter de contenu.
- source_word: לְלַמֵּד
  choice: d’enseigner
  rationale: Rend directement l’infinitif causatif « enseigner ».
- source_word: בְּנֵי יְהוּדָה
  choice: aux fils de Juda
  rationale: Conserve l’expression collective hébraïque et sa tonalité historique.
- source_word: קָשֶׁת
  choice: « L’Arc »
  rationale: Le mot signifie « arc ». Les guillemets et la majuscule le présentent comme le titre probable de la complainte, tout en préservant la concision de l’hébreu.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve le marqueur déictique qui attire l’attention sur la source écrite.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Livre du Juste
  rationale: Traduit le titre hébreu plutôt que de translittérer le nom; « le Juste » maintient l’ambiguïté du qualificatif substantivé.
theological_decisions:
- issue: Fonction de « L’Arc »
  choice: Le présenter comme le titre probable de ce qui doit être enseigné
  alternative: Comprendre qu’il fallait enseigner le tir à l’arc aux fils de Juda
  rationale: La syntaxe permet une certaine tension, mais le contexte immédiat de la complainte et la mention de sa consignation dans un livre favorisent nettement la lecture comme titre. Les guillemets indiquent cette lecture sans développer une interprétation dans le corps du texte.
translation_notes:
  register: Français moderne, digne et lisible. La tournure conserve la structure du verset et son introduction à la complainte. « Voici, cela est écrit » est légèrement solennel, en accord avec le registre biblique, sans archaïsme marqué.
