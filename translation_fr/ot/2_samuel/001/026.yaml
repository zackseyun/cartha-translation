source:
  edition: WLC
  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: fr
  text: Je suis dans l’angoisse à ton sujet, mon frère Jonathan ! Tu m’étais très cher. Ton amour pour moi était merveilleux, surpassant l’amour des femmes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plus que l’amour des femmes » ou « surpassant l’amour donné par les femmes ». La comparaison poétique en hébreu ne précise pas exactement la nature de l’amour comparé.'
    reason: Alternative lexicale et préservation de l’ambiguïté du comparatif hébreu.
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: Je suis dans l’angoisse à cause de toi
  rationale: Cette formulation exprime la détresse personnelle de David dans le contexte de la complainte. « À cause de toi » rend naturellement עַל sans préciser davantage si la douleur porte sur Jonathan lui-même ou sur sa mort.
- source_word: אָחִי
  choice: mon frère
  rationale: La traduction littérale conserve le langage d’intimité et d’appartenance employé par David, sans le réduire à « ami ».
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française usuelle du nom propre.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: Tu m’étais très cher
  rationale: Le verbe exprime ce qui est agréable, délicieux ou précieux. Cette tournure française naturelle communique l’affection profonde du texte sans lui imposer une catégorie romantique.
- source_word: נִפְלְאָתָה
  choice: était merveilleux
  rationale: Le terme qualifie l’amour de Jonathan d’extraordinaire ou de merveilleux; « merveilleux » conserve la force admirative de la complainte.
- source_word: אַהֲבָתְךָ לִי
  choice: Ton amour pour moi
  rationale: « Amour » rend directement אַהֲבָה, tandis que « pour moi » est la formulation idiomatique française du rapport marqué par לִי.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: surpassant l’amour des femmes
  rationale: Le comparatif מִן indique ici un dépassement. « L’amour des femmes » reste volontairement général et conserve l’ambiguïté quant à savoir s’il s’agit de l’amour éprouvé par les femmes ou de l’amour envers elles.
theological_decisions:
- issue: Nature de la comparaison avec « l’amour des femmes »
  choice: Conserver la comparaison littérale sans définir la nature sexuelle, romantique, conjugale ou amicale de cet amour.
  alternative: Préciser soit l’amour que donnent les femmes, soit l’amour éprouvé envers les femmes, soit l’amour conjugal.
  rationale: L’hébreu affirme que l’amour de Jonathan surpasse « l’amour des femmes », mais ne détermine pas explicitement le sens de ce génitif ni une catégorie moderne de relation. La traduction préserve cette tension interprétative.
translation_notes:
  register: Français international moderne, digne et adapté à une complainte poétique. « Tu m’étais très cher » évite la raideur de « tu m’étais très agréable » tout en restant sobre. Le point d’exclamation marque l’intensité de l’adresse sans surcharger le verset.
