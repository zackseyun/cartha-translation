  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וְ/הִנֵּה֩ אִ֨ישׁ בָּ֤א מִן הַֽ/מַּחֲנֶה֙ מֵ/עִ֣ם שָׁא֔וּל וּ/בְגָדָ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשׁ֑/וֹ וַ/יְהִי֙ בְּ/בֹא֣/וֹ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: fr
  text: Le troisième jour, voici qu’un homme arriva du camp, d’auprès de Saül[a], les vêtements déchirés et de la terre sur la tête[b]. Lorsqu’il arriva auprès de David, il tomba à terre et se prosterna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du côté de Saül ». L’expression hébraïque marque l’association ou la proximité avec Saül, sans indiquer nécessairement que Saül avait envoyé cet homme.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « de la terre sur sa tête » : c’était un signe conventionnel de chagrin ou de deuil.'
    reason: cultural_note
  - marker: c
    text: Le verbe peut désigner un geste de profond respect, de soumission ou d’hommage, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: Équivalent temporel direct et naturel, sans ajouter « après » ou un autre repère absent de l’hébreu.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Conserve la présentation vive introduite par הִנֵּה sans lui attribuer explicitement une nuance de soudaineté.
- source_word: אִישׁ בָּא
  choice: un homme arriva
  rationale: Rend le référent masculin singulier et la venue de l’homme dans un français narratif courant.
- source_word: מִן הַמַּחֲנֶה מֵעִם שָׁאוּל
  choice: du camp, d’auprès de Saül
  rationale: Préserve à la fois la provenance du camp et l’association ou la proximité exprimée par מֵעִם, sans affirmer que Saül avait personnellement envoyé l’homme.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: les vêtements déchirés
  rationale: Formulation moderne et claire décrivant l’apparence de deuil de l’homme.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: de la terre sur la tête
  rationale: Rend directement אֲדָמָה, « terre, sol », tout en conservant le geste culturel sans le paraphraser dans le corps du texte.
- source_word: בְּבֹאוֹ אֶל דָּוִד
  choice: Lorsqu’il arriva auprès de David
  rationale: Rend naturellement la proposition temporelle formée avec l’infinitif construit.
- source_word: וַיִּפֹּל אַרְצָה
  choice: il tomba à terre
  rationale: Reproduit le mouvement vers le sol indiqué par la forme directionnelle אַרְצָה.
- source_word: וַיִּשְׁתָּחוּ
  choice: et se prosterna
  rationale: Exprime le geste physique de profond abaissement sans décider à lui seul s’il s’agit de respect, de soumission ou d’hommage.
theological_decisions:
- issue: Portée du geste exprimé par וַיִּשְׁתָּחוּ
  choice: se prosterna
  alternative: lui rendit hommage
  rationale: Le contexte indique un geste envers David, mais le verbe décrit d’abord une prosternation et ne doit pas être chargé d’une notion cultuelle ni réduit sans nécessité à une interprétation sociale précise.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » maintient la vivacité du récit biblique sans archaïsme excessif. « Vêtements » et « à terre » restent accessibles, tandis que « se prosterna » conserve la précision du geste et son ambiguïté contextuelle.
