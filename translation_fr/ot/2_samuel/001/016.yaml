  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד דמי/ך עַל רֹאשֶׁ֑/ךָ כִּ֣י פִ֗י/ךָ עָנָ֤ה בְ/ךָ֙ לֵ/אמֹ֔ר אָנֹכִ֥י מֹתַ֖תִּי אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: fr
  text: 'David lui dit alors : « Ton sang est sur ta tête[a], car ta propre bouche a témoigné contre toi en disant[b] : “C’est moi qui ai tué l’oint de Yahweh.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ton sang sur ta tête. » Cette formule hébraïque attribue à cet homme la responsabilité de sa mort.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ta bouche a porté témoignage contre toi en déclarant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: David lui dit alors
  rationale: Le waw consécutif fait avancer le récit; « alors » exprime naturellement la succession, et « lui » rend explicitement אֵלָיו.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: Que ton sang retombe sur ta tête
  rationale: Cette formule judiciaire attribue à l’homme la responsabilité de sa propre mort. La formulation française conserve l’image hébraïque et son caractère de sentence.
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui justifie la sentence de David et convient au ton judiciaire.
- source_word: פִּיךָ עָנָה בְךָ
  choice: ta propre bouche a témoigné contre toi
  rationale: Le contexte est judiciaire; ענה ב signifie ici porter témoignage contre quelqu’un. « propre » souligne l’auto-incrimination portée par la mention de la bouche.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Introduit directement le contenu du témoignage.
- source_word: אָנֹכִי
  choice: C’est moi qui
  rationale: La tournure clivée restitue naturellement en français l’emphase du pronom indépendant.
- source_word: מֹתַתִּי
  choice: ai tué
  rationale: Le verbe exprime le fait de causer la mort; « tuer » est direct, naturel et adapté à l’aveu rapporté.
- source_word: מְשִׁיחַ יְהוָה
  choice: celui que Yahweh avait consacré par l’onction
  rationale: Dans ce contexte royal, מְשִׁיחַ désigne Saül comme roi consacré. Cette formulation traduit le sens du titre sans suggérer indûment qu’il s’agit ici du Messie eschatologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme comme nom personnel du Dieu d’Israël; « Yahweh » le conserve comme tel.
- issue: Rendu de מְשִׁיחַ dans le contexte royal
  choice: celui que Yahweh avait consacré par l’onction
  alternative: l’oint de Yahweh; le messie de Yahweh
  rationale: Le terme désigne ici Saül en sa qualité de roi consacré. Le traduire par une proposition explicite préserve ce sens sans importer automatiquement des associations christologiques ultérieures.
- issue: Valeur de דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: sentence attribuant à l’Amalécite la responsabilité de sa mort
  alternative: simple constat de culpabilité liée au sang versé
  rationale: Le contexte immédiat présente ses propres paroles comme le fondement de sa condamnation; l’expression garde néanmoins sa forme imagée plutôt que d’être réduite à une paraphrase juridique.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve le ton judiciaire, l’image du sang sur la tête et l’emphase de l’aveu. Le titre royal est explicité avec sobriété pour rester compréhensible sans ajouter de lecture confessionnelle.
