  source_fidelity: La formulation « Que ton sang retombe sur ta tête » transforme la formule nominale hébraïque de constat judiciaire (litt. « ton sang sur ta tête ») en souhait et ajoute l’idée de “retomber”, absente du texte. « Celui que Yahweh avait consacré par l’onction » explicite correctement le sens général, mais le parfait français « avait consacré » et la périphrase s’éloignent inutilement du titre concis מְשִׁיחַ יְהוָה.
  naturalness: Le français est globalement fluide et le registre judiciaire est approprié. « Ton sang est sur ta tête » est une conservation volontaire et intelligible de l’image juridique; une note en explique le sens. « L’oint de Yahweh » est à la fois naturel dans un contexte biblique et plus fidèle au titre hébreu.
  terminology: « Yahweh » rend correctement le tétragramme. « L’oint de Yahweh » traduit le titre royal sans lui imposer un sens messianique ultérieur et sans l’expliciter par une action passée non formulée dans l’hébreu.
