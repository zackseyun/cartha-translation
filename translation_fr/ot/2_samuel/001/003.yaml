  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: fr
  text: 'David lui dit : « D’où viens-tu ? » Il lui dit : « Je me suis échappé du camp d’Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: D’où
  rationale: Cette tournure interrogative porte sur le lieu d’origine ou de provenance. « D’où viens-tu ? » est l’expression française naturelle et fidèle.
- source_word: תָּבוֹא
  choice: viens-tu
  rationale: Bien que la forme hébraïque soit un inaccompli, la question directe concerne ici la provenance immédiate de l’homme. Le présent français est idiomatique dans « D’où viens-tu ? ».
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: du camp d’Israël
  rationale: מַחֲנֶה désigne ici un campement militaire. La formulation retenue conserve la construction hébraïque sans alourdir le français.
- source_word: נִמְלָטְתִּי
  choice: Je me suis échappé
  rationale: Le niphal de מלט exprime le fait d’échapper avec succès à une situation dangereuse. Le passé composé convient au récit d’un événement récent dont le résultat demeure pertinent.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: dit… dit
  rationale: Le texte hébreu emploie deux fois le même verbe courant. Conserver « dit » dans les deux propositions respecte cette répétition tout en restant clair en français.
- source_word: דָּוִד
  choice: David
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
