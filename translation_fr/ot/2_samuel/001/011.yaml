  yaml_path: translation/ot/2_samuel/001/011.yaml
  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: fr
  text: Alors David saisit ses vêtements et les déchira[a]. Tous les hommes qui étaient avec lui firent de même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « son vêtement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: saisit
  rationale: Dans cette construction, le verbe décrit le geste de prendre fermement son vêtement avant de le déchirer. « Saisit » restitue cette action physique avec naturel et sans expliciter davantage le motif.
- source_word: בִּבְגָדוֹ
  choice: ses vêtements
  rationale: Le texte hébreu emploie formellement le singulier, mais le français utilise naturellement le pluriel dans l’expression liée au déchirement des vêtements. Une note conserve l’information sur la forme littérale.
- source_word: וַיִּקְרָעֵם
  choice: les déchira
  rationale: « Déchira » est le terme courant et digne pour ce geste de deuil. Le pronom pluriel correspond à la formulation française « ses vêtements » et rejoint le suffixe pluriel du texte hébreu.
- source_word: וְגַם
  choice: firent de même
  rationale: La conjonction et la particule additive étendent aux compagnons de David l’action qui vient d’être décrite. « Firent de même » rend clairement et naturellement cette ellipse.
- source_word: כָּל הָאֲנָשִׁים
  choice: tous les hommes
  rationale: Le nom hébreu désigne ici les hommes présents auprès de David; la traduction en conserve la référence précise.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui étaient avec lui
  rationale: Cette formulation directe restitue fidèlement la proposition relative qui identifie les compagnons de David.
