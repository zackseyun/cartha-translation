  source_fidelity: La préposition מִן est rendue de manière trop interprétative par « devant ». Dans cette image poétique, elle introduit ce dont l’arc et l’épée ne se retirent/ne reviennent pas. « Du sang …, de la graisse … » conserve plus directement la construction et l’image hébraïque. « Hommes abattus » est possible, mais « combattants tués » situe plus clairement חֲלָלִים dans le contexte martial.
  naturalness: Le français révisé reste poétique et intelligible. La dislocation initiale « Du sang …, de la graisse … » reproduit le parallélisme concentré de l’original sans imposer une relation explicative absente du texte.
  terminology: « Graisse » conserve le sens concret de חֵלֶב; la note signale avec mesure sa possible valeur de « partie la plus riche ». « Guerriers » convient à גִּבּוֹרִים. « Ne reculait pas » et « ne revenait pas à vide » rendent les personnifications et les deux verbes sans surinterprétation.
