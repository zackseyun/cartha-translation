base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: fr
  text: Du sang des combattants tués, de la graisse[a] des guerriers, l’arc de Jonathan ne reculait pas[b], et l’épée de Saül ne revenait pas à vide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Graisse » peut aussi évoquer la partie la plus riche ou la meilleure, ce qui renforce l’image du succès au combat.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne se retirait pas ». Le verbe hébreu peut exprimer l’idée de se retirer ou de revenir en arrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: devant le sang des hommes abattus
  rationale: La préposition מִן exprime ici l’éloignement implicite dans le fait de ne pas reculer. « Devant le sang » donne en français naturel le complément de « ne reculait pas », tandis que חֲלָלִים désigne les hommes tombés sous les coups au combat.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: devant la graisse des guerriers
  rationale: חֵלֶב est conservé dans son sens concret de « graisse », image rude de la poésie guerrière, sans la réduire d’office à une abstraction comme « la partie la plus précieuse ». גִּבּוֹרִים désigne ici des combattants puissants ou valeureux, d’où « guerriers ».
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: l’arc de Jonathan
  rationale: Le complément avec « de » rend naturellement l’état construit hébreu et convient au registre poétique français.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: ne reculait pas
  rationale: נסוג avec אָחוֹר évoque le retrait ou le recul. Le français « ne reculait pas » préserve la personnification martiale de l’arc sans redondance.
- source_word: וְחֶרֶב שָׁאוּל
  choice: et l’épée de Saül
  rationale: Cette formulation rend directement l’état construit et maintient le parallélisme avec « l’arc de Jonathan ».
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: ne revenait pas à vide
  rationale: L’expression indique que l’épée ne revenait pas sans résultat. « À vide » conserve la concision et la personnification poétique de l’hébreu.
theological_decisions: []
translation_notes:
  register: Registre poétique, digne et martial. La syntaxe française rattache explicitement les deux compléments introduits par מִן au verbe « reculer », tout en conservant les images concrètes et le parallélisme du texte hébreu.
