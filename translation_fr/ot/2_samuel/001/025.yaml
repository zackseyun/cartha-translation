source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבֹּרִ֔ים בְּ/ת֖וֹךְ הַ/מִּלְחָמָ֑ה יְה֣וֹנָתָ֔ן עַל בָּמוֹתֶ֖י/ךָ חָלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: fr
  text: Comment les vaillants sont tombés au cœur du combat ! Jonathan, tué sur tes hauteurs[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes hauts lieux ». Le mot hébreu peut désigner des lieux élevés ; ici, il évoque probablement les hauteurs du territoire auquel le chant funèbre s’adresse poétiquement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment
  rationale: Introduit une exclamation de lamentation plutôt qu’une demande d’information ; « Comment » conserve la force poétique et le refrain du chant funèbre.
- source_word: נָפְלוּ
  choice: sont tombés
  rationale: Le parfait hébreu présente la chute comme accomplie ; le passé composé est naturel en français et garde la vivacité de la lamentation.
- source_word: גִבֹּרִים
  choice: les vaillants
  rationale: Désigne ici des hommes remarquables par leur bravoure guerrière. « Les vaillants » garde la portée substantivée et poétique sans imposer un grade militaire.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: au cœur du combat
  rationale: Rend l’idée d’être au milieu même de l’affrontement, dans un français actuel et poétique.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française conventionnelle du nom propre.
- source_word: עַל
  choice: sur
  rationale: Préposition locative simple et naturelle en français.
- source_word: בָּמוֹתֶיךָ
  choice: tes hauteurs
  rationale: Conserve l’image d’un terrain élevé ainsi que le suffixe masculin singulier de deuxième personne, sans introduire d’emblée la connotation cultuelle possible de « hauts lieux ».
- source_word: חָלָל
  choice: tué
  rationale: Le terme désigne ici quelqu’un qui a été frappé à mort. La formulation elliptique « Jonathan, tué… » respecte la syntaxe poétique sans ajouter un verbe absent.
theological_decisions:
- issue: Référent du suffixe de deuxième personne dans « tes hauteurs »
  choice: Conserver l’adresse poétique au masculin singulier sans préciser explicitement son référent
  alternative: Expliciter une adresse au pays ou aux montagnes d’Israël
  rationale: Le contexte suggère une apostrophe poétique au territoire d’Israël, mais l’hébreu ne nomme pas ici le référent. « Tes hauteurs » préserve cette ambiguïté et évite d’identifier le possessif directement à Jonathan.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme exclamatif et l’ellipse de l’hébreu sont conservés ; « au cœur du combat » privilégie une expression naturelle sans affaiblir l’idée de בְּתוֹךְ.
