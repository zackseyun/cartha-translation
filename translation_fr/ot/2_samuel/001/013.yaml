  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל הַ/נַּ֨עַר֙ הַ/מַּגִּ֣יד ל֔/וֹ אֵ֥י מִ/זֶּ֖ה אָ֑תָּה וַ/יֹּ֕אמֶר בֶּן אִ֛ישׁ גֵּ֥ר עֲמָלֵקִ֖י אָנֹֽכִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: fr
  text: 'David dit au jeune homme qui lui avait rapporté la nouvelle : « D’où viens-tu ? » Il répondit : « Je suis le fils d’un Amalécite résidant comme étranger[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis le fils d’un résident étranger, un Amalécite. » L’expression hébraïque peut décrire le père comme un Amalécite résidant comme étranger ou rattacher plus largement le jeune homme, par sa naissance, à un Amalécite qui vivait comme étranger dans le pays.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר désigne ici un jeune homme, sans imposer le sens de serviteur, qui n’est pas explicite dans ce verset.
- source_word: הַמַּגִּיד לוֹ
  choice: qui lui avait apporté la nouvelle
  rationale: Le participe de נגד présente le jeune homme comme celui qui a transmis le récit à David. Cette formulation est naturelle en français et convient au contexte narratif.
- source_word: אֵי מִזֶּה
  choice: D’où es-tu ?
  rationale: Cette tournure interrogative demande l’origine de l’interlocuteur. « D’où es-tu ? » est concise, actuelle et fidèle.
- source_word: בֶּן אִישׁ
  choice: le fils d’un
  rationale: L’expression construit une identification par filiation. Le mot אִישׁ n’a pas besoin d’être rendu séparément par « homme » en français.
- source_word: גֵּר
  choice: immigré
  rationale: גֵּר désigne une personne non originaire du lieu qui y réside. « Immigré » exprime clairement cette situation en français moderne, tandis que « résident étranger » est conservé en note comme possibilité plus formelle.
- source_word: עֲמָלֵקִי
  choice: amalécite
  rationale: Adjectif ethnique correspondant à Amalec ; « amalécite » est la forme française conventionnelle.
- source_word: אָנֹכִי
  choice: Je suis
  rationale: Le pronom indépendant marque explicitement l’auto-identification ; la copule est nécessaire dans la formulation française.
theological_decisions:
- issue: Rapport entre גֵּר, עֲמָלֵקִי et l’identité du locuteur
  choice: le fils d’un immigré amalécite
  alternative: le fils d’un résident étranger, un Amalécite
  rationale: L’hébreu permet de comprendre l’expression comme la description du père, immigré d’origine amalécite, tout en laissant une certaine latitude quant à la manière dont l’ascendance amalécite et le statut de résident étranger sont articulés. La traduction principale reste concise et la note conserve l’autre lecture sans trancher davantage.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé composé « avait apporté » situe clairement le rapport antérieur à la question de David. « Immigré » est courant et intelligible ; la note préserve la formulation plus formelle « résident étranger » ainsi que l’ambiguïté de la construction hébraïque.
