language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: fr
  text: Ne l’annoncez pas à Gath ; ne proclamez pas la nouvelle[a] dans les rues d’Ascalon, de peur que les filles des Philistins ne se réjouissent, de peur que les filles des incirconcis[b] n’exultent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’annoncez pas la nouvelle » / « n’en apportez pas la nouvelle ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « les filles des incirconcis » reprend littéralement une désignation méprisante liée à l’identité d’alliance et appliquée ici aux Philistins.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: l’annoncez
  rationale: Le verbe נגד signifie ici « dire, rapporter, annoncer ». Le pronom « l’ » reprend naturellement, en français, la nouvelle implicite de la mort de Saül et de Jonathan.
- source_word: בְגַת
  choice: à Gath
  rationale: La préposition locative devant un nom de ville se rend idiomatiquement par « à » en français.
- source_word: תְּבַשְּׂרוּ
  choice: proclamez la nouvelle
  rationale: Au piel, בשר désigne l’action d’apporter ou d’annoncer une nouvelle. « Proclamer la nouvelle » conserve ici le caractère public de l’annonce et le parallélisme poétique.
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: dans les rues d’Ascalon
  rationale: חוּצוֹת peut désigner les rues ou les places ouvertes d’une ville. « Dans les rues » est naturel en français et souligne la publicité de l’annonce.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française exprime avec naturel la crainte ou le résultat à éviter et reproduit la structure répétée de l’hébreu.
- source_word: תִּשְׂמַחְנָה
  choice: se réjouissent
  rationale: שמח exprime la joie ; « se réjouir » convient au registre élevé de la lamentation.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: les filles des Philistins
  rationale: La traduction littérale préserve l’image poétique des femmes philistines célébrant publiquement la nouvelle.
- source_word: תַּעֲלֹזְנָה
  choice: exultent
  rationale: עלז exprime une joie vive et triomphante. « Exulter » maintient l’intensification par rapport à « se réjouir ».
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: les filles des incirconcis
  rationale: La formulation littérale conserve la désignation polémique, ethnique et religieuse employée dans le texte, sans la généraliser ni l’atténuer.
theological_decisions:
- issue: Rendu de la désignation d’alliance עֲרֵלִים
  choice: les incirconcis
  alternative: les païens / les impurs
  rationale: Le terme hébreu renvoie explicitement à l’absence de circoncision et, par là, à l’identité d’alliance. Le rendre littéralement préserve sa portée théologique et sa force rhétorique sans introduire une interprétation plus générale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition « de peur que » et le contraste entre « se réjouissent » et « exultent » conservent le parallélisme et la progression poétique de la lamentation.
