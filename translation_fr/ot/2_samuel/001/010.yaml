source:
  edition: WLC
  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: fr
  text: Alors je me suis tenu au-dessus de lui et je l’ai mis à mort, car je savais qu’il ne resterait pas en vie après sa chute.[a] Puis j’ai pris le diadème qu’il avait sur la tête et le bracelet qu’il portait au bras,[b] et je les ai apportés ici à mon seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit du récit que l’Amalécite fait à David. Comparer 1 Samuel 31.4-5 pour le récit antérieur de la mort de Saül.
    reason: cross_reference
  - marker: b
    text: Le terme hébreu désigne un ornement porté au bras ; on pourrait aussi traduire par « bracelet de bras ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: je me suis tenu au-dessus de lui
  rationale: La tournure décrit la position de l’Amalécite auprès de Saül tombé. « Au-dessus de lui » rend naturellement עַל sans suggérer qu’il se tenait littéralement sur son corps.
- source_word: וַאֲמֹתְתֵהוּ
  choice: je l’ai mis à mort
  rationale: La forme causative de מות exprime explicitement que le locuteur affirme avoir causé la mort de Saül. « Mis à mort » conserve la gravité du récit.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה אַחֲרֵי נִפְלוֹ
  choice: car je savais qu’il ne resterait pas en vie après sa chute
  rationale: Cette formulation conserve le motif donné par le locuteur ainsi que le rapport temporel exprimé par « après sa chute », sans préciser davantage la nature de celle-ci.
- source_word: הַנֵּזֶר
  choice: le diadème
  rationale: נֵזֶר désigne ici l’insigne royal porté sur la tête. « Diadème » est précis et reste compréhensible en français courant.
- source_word: וְאֶצְעָדָה אֲשֶׁר עַל זְרֹעוֹ
  choice: le bracelet qu’il portait au bras
  rationale: אֶצְעָדָה désigne un ornement porté au bras. La formulation française indique son emplacement sans le limiter au poignet.
- source_word: וָאֲבִיאֵם אֶל אֲדֹנִי הֵנָּה
  choice: je les ai apportés ici à mon seigneur
  rationale: Le passé composé convient au discours direct en français, tandis que « ici » conserve le repère déictique הֵנָּה. « Mon seigneur » marque l’adresse respectueuse à David sans en faire un titre divin.
theological_decisions:
- issue: Le récit de la mort de Saül
  choice: Présenter sans l’atténuer l’affirmation de l’Amalécite selon laquelle il a mis Saül à mort.
  alternative: Modifier la formulation pour en faire explicitement un mensonge ou l’harmoniser avec 1 Samuel 31.4-5.
  rationale: Le verset rapporte les paroles de l’Amalécite. La traduction doit préserver son affirmation telle quelle et laisser subsister la tension narrative avec le récit antérieur.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste sobre et formel. Le passé composé est employé conformément à l’usage narratif oral contemporain, et la tension entre ce témoignage et 1 Samuel 31 n’est pas résolue dans le corps du texte.
