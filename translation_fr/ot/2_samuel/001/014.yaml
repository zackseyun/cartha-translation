source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: fr
  text: 'Alors David lui dit : « Comment[a] n’as-tu pas eu peur de porter la main sur l’oint de Yahweh[b] pour le faire périr ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi n’as-tu pas eu peur… ? » Le mot hébreu signifie littéralement « Comment ? » et exprime ici un reproche indigné.'
    reason: lexical_alternative
  - marker: b
    text: « L’oint de Yahweh » désigne ici le roi que Yahweh avait consacré par l’onction, c’est-à-dire Saül.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » en restitue naturellement la succession en français moderne.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom renvoie au messager amalécite ; la construction française « lui dit » est directe et idiomatique.
- source_word: אֵיךְ
  choice: Comment
  rationale: Conserve la forme littérale de l’interpellation hébraïque et son reproche empreint de stupeur, sans la réduire au causal « Pourquoi ».
- source_word: לֹא יָרֵאתָ
  choice: n’as-tu pas eu peur
  rationale: Rend naturellement en français la crainte devant l’acte sacrilège envisagé.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: porter la main sur
  rationale: Cette locution française claire et courante restitue l’idiome hébreu désignant une action hostile ou violente contre quelqu’un.
- source_word: לְשַׁחֵת
  choice: pour le faire périr
  rationale: Dans ce contexte, le verbe vise la mise à mort de Saül. « Faire périr » exprime cette valeur tout en conservant davantage que « tuer » la force destructive de שׁחת.
- source_word: מְשִׁיחַ
  choice: l’oint
  rationale: Le terme désigne ici Saül en tant que roi consacré par onction, sans en faire directement un titre messianique ultérieur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte explicitement le tétragramme ; « Yahweh » préserve le nom personnel tout en évitant de le remplacer par un titre.
- issue: Sens de מְשִׁיחַ appliqué à Saül
  choice: l’oint de Yahweh
  alternative: le messie de Yahweh / celui que Yahweh a consacré par l’onction
  rationale: Dans ce récit historique, le mot qualifie le roi consacré par onction. « L’oint » maintient le lien lexical avec l’onction sans imposer ici une identification christologique directe.
- issue: Force de לְשַׁחֵת
  choice: pour le faire périr
  alternative: pour le détruire / pour le tuer
  rationale: Le contexte implique bien la mort de Saül, mais la formulation choisie conserve la nuance destructive du verbe sans l’aplatir entièrement en « tuer ».
translation_notes:
  register: Français international moderne, digne et accessible. La question conserve le « Comment ? » hébreu et sa stupeur accusatrice. « Porter la main sur » rend naturellement l’idiome hébreu, tandis que « l’oint » garde la terminologie de l’onction royale.
