  text: וַ/יְקֹנֵ֣ן דָּוִ֔ד אֶת הַ/קִּינָ֖ה הַ/זֹּ֑את עַל שָׁא֖וּל וְ/עַל יְהוֹנָתָ֥ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/017.yaml
  text: Then David sang this lament over Saul and over Jonathan his son,[a]
translation:
  language: fr
  text: 'Alors David prononça cette complainte[a] sur Saül et sur Jonathan, fils de Saül :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « entonna cette complainte ». Le verbe et le nom hébreux apparentés forment une expression solennelle qui désigne l’action de prononcer une lamentation funèbre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: Alors David prononça
  rationale: Le verbe קונן désigne l’action d’exprimer solennellement une lamentation, souvent sous une forme poétique. « Prononça » restitue cette mise en voix sans ajouter explicitement l’idée de chant.
- source_word: הַקִּינָה הַזֹּאת
  choice: cette complainte
  rationale: קִינָה désigne une lamentation formelle, notamment pour des morts. « Complainte » convient au contexte funèbre et au passage poétique qui suit ; le démonstratif הַזֹּאת est rendu directement par « cette ».
- source_word: עַל
  choice: sur
  rationale: Dans ce contexte, עַל introduit les personnes qui font l’objet de la lamentation. « Sur » conserve la formulation concise et traditionnelle sans réduire le sens à un simple sujet de discours.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française usuelle du nom propre.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française usuelle du nom propre.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le suffixe pronominal présente Jonathan comme le fils de Saül. La formulation française conserve cette relation dans l’ordre du texte hébreu.
- source_word: וַ
  choice: Alors
  rationale: Le waw associé à la forme narrative fait progresser le récit. « Alors » marque naturellement la succession en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Complainte » maintient la dimension formelle et poétique du deuil, tandis que « prononça » évite d’affirmer plus précisément un chant ou une composition, nuances que l’hébreu ne tranche pas à lui seul. Le deux-points annonce le poème qui suit.
