  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: fr
  text: Ta splendeur[a], Israël, gît tuée sur tes hauteurs[b] ! Comme les vaillants sont tombés !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu צְבִי peut aussi se traduire par « beauté » ou « éclat » ; certains le comprennent plus concrètement comme « gazelle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tes hauts lieux ». « Hauteurs » est retenu ici pour préserver le sens topographique sans suggérer nécessairement des lieux de culte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: Ta splendeur
  rationale: צְבִי peut désigner la beauté, l’éclat ou la splendeur, et parfois une gazelle. Dans cette complainte sur Saül et Jonathan, le sens figuré convient le mieux. Le possessif explicite en français fait ressortir l’adresse directe à Israël, en accord avec « tes hauteurs ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé sous sa forme française usuelle. La ponctuation marque naturellement le vocatif, sans recourir au « ô » aujourd’hui plus soutenu.
- source_word: עַל בָּמוֹתֶיךָ
  choice: sur tes hauteurs
  rationale: La préposition indique le lieu, et בָּמוֹתֶיךָ évoque ici les reliefs élevés d’Israël. « Hauteurs » préserve la portée topographique et poétique sans imposer une référence à des lieux de culte.
- source_word: חָלָל
  choice: gît tuée
  rationale: חָלָל désigne une personne tuée. « Gît tuée » rend de façon idiomatique et solennelle son état sur les hauteurs; le féminin s’accorde avec « splendeur ».
- source_word: אֵיךְ נָפְלוּ
  choice: Comment … sont-ils tombés
  rationale: אֵיךְ introduit l’exclamation propre à une complainte, tandis que le parfait נָפְלוּ constate la chute accomplie avec un effet encore présent. L’inversion maintient une diction poétique naturelle en français.
- source_word: גִבּוֹרִים
  choice: les vaillants
  rationale: גִבּוֹרִים peut désigner les puissants, les héros ou les guerriers. « Les vaillants » conserve la largeur poétique du terme et convient au refrain funèbre.
