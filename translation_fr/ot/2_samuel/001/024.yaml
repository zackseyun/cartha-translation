base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: fr
  text: 'Filles d’Israël, pleurez sur Saül,

    lui qui vous vêtait d’écarlate avec des parures somptueuses[a],

    lui qui mettait des ornements d’or[b] sur vos vêtements.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’écarlate, dans le luxe » ou « d’écarlate, avec des délices ». Le mot hébreu est rare et peut évoquer le luxe, les délices ou de riches parures.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des bijoux d’or ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: Filles d’Israël
  rationale: Conserve l’interpellation directe et l’image poétique de l’hébreu, sans l’aplanir en « femmes d’Israël ».
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: pleurez sur Saül
  rationale: Dans ce chant funèbre, אֶל indique l’objet de la lamentation. « Pleurez sur » exprime naturellement en français l’appel à prendre le deuil de Saül.
- source_word: הַמַּלְבִּשְׁכֶם
  choice: lui qui vous vêtait
  rationale: Le participe substantivé renvoie à Saül. L’imparfait évoque son action habituelle ou passée et convient au contexte de lamentation.
- source_word: שָׁנִי
  choice: écarlate
  rationale: Équivalent français courant du tissu ou colorant rouge précieux désigné par le terme hébreu.
- source_word: עִם עֲדָנִים
  choice: et de parures somptueuses
  rationale: Le mot rare עֲדָנִים évoque le luxe, les délices ou une riche parure. Cette formulation s’intègre naturellement à l’idée de vêtir tout en laissant l’incertitude lexicale signalée en note.
- source_word: הַמַּעֲלֶה
  choice: lui qui mettait
  rationale: Le participe de עלה a ici le sens contextuel de faire monter ou de placer quelque chose sur un vêtement.
- source_word: עֲדִי זָהָב
  choice: des ornements d’or
  rationale: Rend le rapport construit entre la parure et l’or, dans un registre poétique mais compréhensible.
- source_word: עַל לְבוּשְׁכֶן
  choice: sur vos vêtements
  rationale: Traduction directe et naturelle de la préposition עַל et du nom collectif לְבוּשׁ.
