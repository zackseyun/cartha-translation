  text: 'Il m’a demandé : « Qui es-tu ? » Je lui ai répondu[a] : « Je suis Amalécite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte formellement « et il lui dit » ; d’après le contexte, le sens est « et je lui répondis », puisque l’homme rapporte sa propre réponse à Saül.
