lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Il m’a demandé
  rationale: Le verbe signifie littéralement « il m’a dit », mais puisqu’il introduit une question directe, « il m’a demandé » est plus naturel en français et conserve exactement la fonction de l’énoncé.
- source_word: מִי אַתָּה
  choice: Qui es-tu ?
  rationale: La proposition nominale hébraïque est rendue par la tournure interrogative française courante avec le verbe être.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Je lui ai répondu
  rationale: Le texte massorétique porte formellement « et il lui dit », mais le contexte du récit exige que l’Amalécite rapporte sa propre réponse à Saül. « Répondu » exprime naturellement le lien avec la question précédente; l’écart formel est signalé en note.
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: Je suis Amalécite
  rationale: Le gentilé prédicatif s’emploie normalement sans article en français moderne après « être » lorsqu’il désigne l’appartenance à un peuple.
