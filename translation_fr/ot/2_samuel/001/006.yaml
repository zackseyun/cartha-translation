revisions:
- from: 'Le jeune homme qui lui faisait ce récit répondit : « Je me trouvais par hasard[a] sur le mont Guilboa. Et voici que Saül s’appuyait sur sa lance, tandis que les chars et les cavaliers le serraient de près[b][c]. »'
  to: 'Le jeune homme qui lui rapportait la nouvelle dit : « Je me trouvais par hasard[a] sur le mont Guilboa. Et voici que Saül s’appuyait sur sa lance, et voici que les chars et les cavaliers[b] le serraient de près[c]. »'
  rationale: La révision corrige l’incohérence grammaticale de la note a, rend les deux marqueurs hébreux וְהִנֵּה par « et voici que », et emploie « rapportait la nouvelle » pour le participe désignant le messager. Elle ne tranche pas entre une poursuite imminente et un rattrapage déjà accompli, conformément à l’ambiguïté lexicale de הִדְבִּקֻהוּ.
