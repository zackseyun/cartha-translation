base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: fr
  text: 'Le jeune homme qui lui rapportait la nouvelle dit : « Je me trouvais par hasard[a] sur le mont Guilboa. Et voici que Saül s’appuyait sur sa lance, et voici que les chars et les cavaliers[b] le serraient de près[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque insiste sur le caractère fortuit de sa présence : « Je me suis trouvé par hasard sur le mont Guilboa. »'
    reason: lexical_alternative
  - marker: b
    text: Ou « les chars et les hommes à cheval » ou « les chars et la cavalerie ».
    reason: lexical_alternative
  - marker: c
    text: Ou « l’avaient rattrapé » ou « le poursuivaient de très près ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר הַמַּגִּיד לוֹ
  choice: Le jeune homme qui lui faisait ce récit
  rationale: נַעַר désigne ici un jeune homme, et le participe de נגד l’identifie comme celui qui rapporte les événements à David. « Faisait ce récit » convient naturellement au cadre narratif.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: Je me trouvais par hasard
  rationale: La construction associant infinitif absolu et verbe conjugué souligne le caractère fortuit de sa présence. Cette formulation française restitue l’idiome sans lourdeur.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: sur le mont Guilboa
  rationale: Rendu géographique traditionnel et naturel en français pour הַר suivi d’un nom propre.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: הִנֵּה attire vivement l’attention sur la scène. « Et voici que » en conserve la force narrative dans un registre digne et actuel.
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: s’appuyait sur sa lance
  rationale: Le participe niphal de שען exprime l’action de prendre physiquement appui; חֲנִית désigne une lance.
- source_word: הָרֶכֶב
  choice: les chars
  rationale: רֶכֶב peut être collectif (« les chars de guerre », « la charrerie »). « Les chars » est clair, naturel et accessible.
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: les cavaliers
  rationale: L’expression désigne les hommes montés. « Cavaliers » est l’équivalent français courant dans ce contexte militaire.
- source_word: הִדְבִּקֻהוּ
  choice: le serraient de près
  rationale: Le hiphil de דבק peut signifier rattraper, atteindre ou poursuivre de très près. La formulation préserve l’image d’une menace pressante sans imposer l’idée que la capture était déjà accomplie.
