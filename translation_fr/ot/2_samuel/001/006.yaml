translation_notes:
  register: Français international moderne, narratif et digne. La tournure « voici que » maintient la vivacité de הִנֵּה sans recourir à l’archaïque « voici ». Les marqueurs de notes sont placés dans le texte, et les nuances lexicales de la poursuite sont conservées.
