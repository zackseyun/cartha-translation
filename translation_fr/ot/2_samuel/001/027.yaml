  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: fr
  text: Comment sont tombés les héros ! Et les armes de guerre ont péri[a][b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les équipements de guerre » ou « l’armement ». L’expression hébraïque peut désigner largement le matériel militaire, et pas seulement les armes offensives.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « les armes de guerre » peut désigner métaphoriquement Saül et Jonathan eux-mêmes, considérés comme la force guerrière d’Israël ; elle peut aussi être comprise au sens propre.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment
  rationale: Introduit ici une exclamation de lamentation, non une demande d’information, et reprend naturellement le refrain du chant.
- source_word: נָפְלוּ
  choice: sont tombés
  rationale: Le passé composé exprime en français actuel le résultat tragique constaté dans la lamentation.
- source_word: גִבּוֹרִים
  choice: les héros
  rationale: Le terme désigne des hommes puissants ou de vaillants guerriers. « Les héros » convient à Saül et Jonathan et conserve la brièveté ainsi que l’élévation poétique.
- source_word: וַיֹּאבְדוּ
  choice: ont péri
  rationale: Le verbe peut signifier périr, disparaître ou être perdu. « Ont péri » maintient le parallélisme funèbre avec « sont tombés » sans supprimer l’ambiguïté entre personnes et matériel.
- source_word: כְּלֵי מִלְחָמָה
  choice: les armes de guerre
  rationale: La locution signifie littéralement les objets ou équipements de guerre. Cette formulation française est naturelle et permet une lecture aussi bien concrète que métaphorique.
theological_decisions:
- issue: Référent de כְּלֵי מִלְחָמָה
  choice: Conserver « les armes de guerre » dans le texte et signaler la lecture métaphorique en note.
  alternative: Traduire explicitement par « les guerriers » ou identifier Saül et Jonathan.
  rationale: Le contexte peut faire de Saül et Jonathan eux-mêmes la force militaire d’Israël, mais l’hébreu conserve aussi la possibilité d’un sens matériel. Le texte ne doit pas trancher silencieusement.
translation_notes:
  register: Style poétique, solennel et accessible. La tournure exclamative conserve le refrain de la lamentation. L’inversion interrogative est employée avec un point d’exclamation pour marquer l’exclamation de douleur plutôt qu’une véritable question.
