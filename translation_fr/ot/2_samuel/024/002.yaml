base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: fr
  text: 'Le roi dit donc à Joab, le chef de l’armée qui était avec lui : « Parcours toutes les tribus d’Israël, de Dan à Beer-Shéba, et recensez[a][b] le peuple, afin que je connaisse le nombre du peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faites le dénombrement du peuple ». Le verbe hébreu peut désigner le fait de compter ou d’enregistrer des personnes, parfois en vue d’une mobilisation militaire.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe ici d’un ordre au singulier (« parcours »), adressé à Joab, à un ordre au pluriel (« recensez »), qui peut inclure les hommes chargés de l’accompagner.
    reason: source_grammar
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit donc
  rationale: Le waw consécutif fait progresser le récit. « Donc » marque naturellement l’enchaînement avec le verset précédent sans alourdir la phrase.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte hébreu emploie le titre défini plutôt que le nom de David ; la traduction conserve ce choix.
- source_word: שַׂר הַחַיִל
  choice: le chef de l’armée
  rationale: שַׂר désigne ici le responsable militaire, et חַיִל l’armée ou les forces. Cette formulation est claire et actuelle.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui était avec lui
  rationale: La proposition relative identifie Joab comme se trouvant auprès du roi, sans ajouter de précision absente de l’hébreu.
- source_word: שׁוּט נָא
  choice: Parcours donc
  rationale: שׁוּט exprime le déplacement à travers un territoire. La particule נָא atténue légèrement l’ordre ; dans ce commandement royal, « donc » restitue cette nuance plus naturellement que « s’il te plaît ».
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: toutes les tribus d’Israël
  rationale: Avec le verbe de mouvement « parcourir », le complément direct est idiomatique en français et exprime un passage à travers l’ensemble des territoires tribaux.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: depuis Dan jusqu’à Beer-Shéba
  rationale: La formule géographique qui désigne l’étendue du pays est conservée sans l’expliciter dans le corps du texte.
- source_word: וּפִקְדוּ
  choice: et recensez
  rationale: פקד désigne ici le dénombrement ou l’enregistrement de la population, avec une possible nuance de mobilisation. « Recenser » convient au contexte administratif tout en laissant cette nuance ouverte.
- source_word: אֶת הָעָם
  choice: le peuple
  rationale: עָם signifie « peuple » et ne désigne pas explicitement les seuls combattants, malgré le cadre militaire.
- source_word: וְיָדַעְתִּי
  choice: afin que je sache
  rationale: Dans le contexte, la forme exprime le but recherché par le roi. Cette tournure est naturelle en français.
- source_word: מִסְפַּר הָעָם
  choice: combien il compte de personnes
  rationale: Cette formulation rend naturellement l’idée du « nombre du peuple » en français moderne, sans réduire le peuple aux soldats.
theological_decisions:
- issue: Portée de הָעָם dans un contexte militaire et administratif
  choice: le peuple
  alternative: les hommes en état de combattre / les troupes
  rationale: Joab est chef de l’armée et le recensement peut avoir une visée militaire, mais l’hébreu emploie עָם, terme général pour le peuple. La traduction ne restreint donc pas la population visée.
- issue: Changement du singulier au pluriel dans les impératifs
  choice: « Parcours » au singulier, puis « recensez » au pluriel
  alternative: uniformiser au singulier (« parcours… recense ») ou reformuler (« fais recenser »)
  rationale: Le changement de nombre est présent dans le texte hébreu et peut faire intervenir Joab avec ses assistants. Le conserver, accompagné d’une note, évite de résoudre silencieusement cette tension grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le titre « le roi », la formule géographique traditionnelle et le changement de nombre des impératifs. « Beer-Shéba » suit une translittération française courante.
