base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: fr
  text: Ils arrivèrent à la ville fortifiée de Tyr et dans toutes les villes des Hivites et des Cananéens. Puis ils partirent pour le Néguev de Juda[a], à Beer-Shéba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sud de Juda ». Le mot hébreu néguev peut désigner soit la région appelée le Néguev, soit, plus généralement, la partie méridionale d’un territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: la ville fortifiée de Tyr
  rationale: מִבְצָר désigne un lieu fortifié ou une forteresse. En apposition avec Tyr, « la ville fortifiée de Tyr » exprime naturellement qu’il s’agit de Tyr considérée comme place forte, sans réduire le terme à une citadelle particulière.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: et dans toutes les villes des Hivites et des Cananéens
  rationale: Le verbe de mouvement précédent régit aussi cette étape de l’itinéraire. Les ethnonymes hébreux au singulier collectif sont rendus par les pluriels français usuels.
- source_word: וַיֵּצְאוּ
  choice: Puis ils partirent
  rationale: יצא signifie fondamentalement « sortir » ou « partir ». Dans cet itinéraire, « partirent » marque naturellement la reprise du déplacement tout en conservant l’idée d’un départ vers l’étape suivante.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: vers le Néguev de Juda
  rationale: נֶגֶב peut désigner soit le sud en général, soit la région géographique du Néguev. Le contexte d’itinéraire favorise ici le nom de région, tout en laissant l’autre possibilité en note.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-Shéba
  rationale: Forme française courante du nom de lieu, avec accents facilitant sa prononciation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Jusqu’à Beer-Shéba » explicite naturellement le point d’aboutissement de cette étape de l’itinéraire.
