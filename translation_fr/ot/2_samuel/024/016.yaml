source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: fr
  text: 'Quand l’ange étendit la main vers Jérusalem pour la détruire, Yahweh renonça au malheur[a] et dit à l’ange qui détruisait le peuple : « Assez ! Retire maintenant ta main. » L’ange de Yahweh se trouvait alors près de l’aire de battage d’Arauna le Jébusien[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « renonça au sujet du malheur ». Ici, le mot hébreu désigne un malheur ou un désastre, et non le mal moral.
    reason: lexical_alternative
  - marker: b
    text: Arauna est appelé Ornân dans le récit parallèle de 1 Chroniques 21.15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: étendit la main
  rationale: Cette expression rend naturellement l’idiome hébreu tout en conservant l’image concrète de la main mise en mouvement pour agir.
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: Dans ce récit, le terme désigne l’agent céleste qui exécute le jugement; « ange » convient donc mieux que le terme générique « messager ».
- source_word: לְשַׁחֲתָהּ
  choice: pour la détruire
  rationale: L’infinitif exprime ici l’action destructrice dirigée contre Jérusalem; le pronom féminin renvoie clairement à la ville.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: Yahweh renonça au malheur
  rationale: « Renonça » exprime l’arrêt du jugement en cours sans attribuer à Dieu une faute morale. Dans ce contexte, רָעָה désigne un malheur ou un désastre, non le mal moral.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver sa fonction de nom propre dans le texte hébreu.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: qui détruisait le peuple
  rationale: La proposition relative rend naturellement en français le participe hébreu et maintient son sens actif et continu.
- source_word: רַב
  choice: Assez !
  rationale: L’interjection brève restitue la force immédiate de l’ordre divin.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: Retire maintenant ta main
  rationale: La formulation conserve l’image de la main tout en exprimant clairement l’ordre de cesser l’action.
- source_word: וּמַלְאַךְ יְהוָה
  choice: L’ange de Yahweh
  rationale: La traduction maintient la désignation textuelle sans trancher l’identité théologique précise de cette figure.
- source_word: הָיָה עִם
  choice: se trouvait alors près de
  rationale: Dans ce cadre locatif, עִם indique la proximité; cette tournure est naturelle en français narratif.
- source_word: גֹּרֶן
  choice: aire de battage
  rationale: Il s’agit du terme agricole français courant pour l’endroit où l’on battait et vannait les céréales.
- source_word: הָאֹרְנָה
  choice: Arauna
  rationale: Cette forme française représente le nom employé dans le texte de Samuel, tandis que le récit parallèle des Chroniques emploie une autre forme.
theological_decisions:
- issue: Langage anthropopathique en וַיִּנָּחֶם יְהוָה
  choice: Yahweh renonça au malheur
  alternative: Yahweh regretta le malheur / revint sur le malheur
  rationale: Le choix retenu décrit fidèlement l’interruption du jugement sans suggérer une faute morale de Dieu ni effacer la présentation narrative d’un changement dans son action.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: une manifestation divine / un ange créé
  rationale: Le verset nomme cette figure sans définir davantage son identité. La traduction conserve donc l’ambiguïté théologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le récit reste concret, notamment par la répétition de l’image de la main. Le nom divin est rendu par « Yahweh », et l’ambiguïté concernant l’identité de son ange demeure ouverte.
