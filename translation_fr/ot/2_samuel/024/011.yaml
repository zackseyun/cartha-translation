id: 2SA.24.11
reference: 2 Samuel 24:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֥קָם דָּוִ֖ד בַּ/בֹּ֑קֶר וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל גָּ֣ד הַ/נָּבִ֔יא חֹזֵ֥ה דָוִ֖ד לֵ/אמֹֽרפ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: fr
  text: 'Quand David se leva le matin, la parole de Yahweh était parvenue[a] à Gad, le prophète, le voyant de David, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « la parole de Yahweh fut à Gad »; on pourrait aussi traduire : « parvint à Gad ».'
    reason: La construction הָיָה אֶל est une formule prophétique dont la relation temporelle avec la proposition précédente n’est pas entièrement explicite.
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le wayyiqtol de קום fait progresser le récit. « Se leva » est l’équivalent français naturel dans ce contexte.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Cette expression temporelle indique le moment où David se leva; « le matin » est idiomatique en français moderne.
- source_word: וּדְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la portée révélatrice de la formule prophétique, tandis que « Yahweh » rend directement le nom divin יהוה.
- source_word: הָיָה אֶל
  choice: était parvenue à
  rationale: 'Dans les formules prophétiques, l’expression signifie que la parole divine est communiquée à quelqu’un. Le plus-que-parfait rend la relation temporelle probable : la parole avait déjà été adressée à Gad lorsque David se leva, tout en signalant en note la formulation hébraïque plus littérale.'
- source_word: גָּד
  choice: Gad
  rationale: Le nom propre est transcrit selon l’usage français courant.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: נָבִיא désigne normalement un prophète; cette traduction directe conserve le titre de fonction.
- source_word: חֹזֵה דָוִד
  choice: le voyant de David
  rationale: « Voyant » est le terme français traditionnel et précis pour חֹזֶה, distinct de « prophète ». Le complément « de David » conserve sans l’expliciter davantage la relation exprimée par l’état construit.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette tournure française introduit naturellement le discours direct qui commence au verset suivant.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin sans le remplacer par un titre.
- issue: Rapport temporel entre le lever de David et la parole adressée à Gad
  choice: 'plus-que-parfait : « était parvenue »'
  alternative: 'passé simple : « parvint »; formulation littérale : « fut à »'
  rationale: Le contexte permet de comprendre que Gad avait reçu la parole avant ou au moment où David se leva. Le plus-que-parfait exprime cette lecture probable, tandis que la note préserve la forme plus littérale et l’ambiguïté de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition des titres « le prophète, le voyant de David » est conservée afin de respecter la distinction du texte entre נָבִיא et חֹזֶה. Le deux-points indique que la parole rapportée se poursuit au verset suivant.
