  text: וַ/יַּעַבְר֖וּ אֶת הַ/יַּרְדֵּ֑ן וַ/יַּחֲנ֣וּ בַ/עֲרוֹעֵ֗ר יְמִ֥ין הָ/עִ֛יר אֲשֶׁ֛ר בְּ/תוֹךְ הַ/נַּ֥חַל הַ/גָּ֖ד וְ/אֶל יַעְזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: fr
  text: Ils traversèrent le Jourdain et campèrent à Aroër, à droite de la ville[a] qui se trouve au milieu de la vallée de Gad[b], en direction de Yazer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la droite de la ville ». Certains comprennent cette indication géographique comme « au sud de la ville », mais l’hébreu dit simplement « à droite ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au milieu du ravin de Gad » ou « au milieu de l’oued de Gad ». Le terme hébreu peut désigner une vallée, un ravin ou le lit d’un cours d’eau saisonnier.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « jusqu’à Yazer » ou « vers Yazer ». La préposition hébraïque peut indiquer soit une direction, soit un déplacement aboutissant au lieu mentionné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: Ils traversèrent le Jourdain
  rationale: Le verbe עבר, avec « le Jourdain » comme complément direct dans un récit de déplacement, signifie naturellement franchir le fleuve. « Traversèrent » est idiomatique et précis.
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: et campèrent à Aroër
  rationale: חנה désigne l’action d’établir un camp. Avec un nom de lieu, la préposition ב indique ici le lieu de l’étape, naturellement rendu par « à ».
- source_word: יְמִין הָעִיר
  choice: à droite de la ville
  rationale: ימין signifie littéralement « droite » ou « côté droit ». La formulation spatiale du texte est conservée sans l’interpréter automatiquement comme une indication du sud.
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: qui se trouve au milieu de la vallée de Gad
  rationale: La proposition relative se rapporte naturellement à « la ville ». נחל peut désigner une vallée, un ravin ou le lit d’un cours d’eau saisonnier ; « vallée » est clair en français tout en laissant la variante en note.
- source_word: וְאֶל יַעְזֵר
  choice: en direction de Yazer
  rationale: La préposition אל peut exprimer aussi bien la direction que l’arrivée. « En direction de » évite d’affirmer que le groupe atteignit Yazer dans ce verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms propres suivent les formes françaises bibliques courantes « Jourdain », « Aroër » et « Yazer ». La syntaxe garde les précisions géographiques et leurs ambiguïtés sans les harmoniser.
