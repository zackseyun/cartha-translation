source:
  edition: WLC
  text: וַ/יַּ֤עַל דָּוִד֙ כִּ/דְבַר גָּ֔ד כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: fr
  text: David monta, conformément à la parole de Gad, comme Yahweh l’avait ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime un mouvement vers le haut. « Monta » conserve cette nuance directionnelle dans un français narratif naturel.
- source_word: דָּוִד
  choice: David
  rationale: Forme française usuelle du nom propre.
- source_word: כִּדְבַר
  choice: conformément à la parole de
  rationale: La tournure כ + דבר signifie « selon la parole de ». « Conformément à la parole de » conserve explicitement דבר et indique que David agit suivant l’instruction transmise par Gad.
- source_word: גָּד
  choice: Gad
  rationale: Forme française usuelle du nom du prophète.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction marque ici la correspondance entre la parole de Gad et l’ordre de Yahweh. « Comme » restitue cette relation sans suraccentuer le texte.
- source_word: צִוָּה
  choice: l’avait ordonné
  rationale: Le plus-que-parfait rend clairement l’antériorité de l’ordre de Yahweh par rapport à l’action de David. Le pronom objet est nécessaire en français et renvoie naturellement à David.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve ici le nom personnel, sans le remplacer par un titre.
- issue: Sujet implicite de l’ordre divin
  choice: l’avait ordonné
  alternative: avait ordonné
  rationale: L’hébreu ne précise pas l’objet de צִוָּה, mais le contexte immédiat implique que Yahweh avait donné cet ordre à David, par l’intermédiaire de Gad. Le pronom « l’ » est requis par l’usage français sans ajouter une identification nominale absente de l’hébreu.
translation_notes:
  register: 'Français international moderne, sobre et digne. La syntaxe conserve la chaîne de médiation du texte : David suit la parole de Gad, laquelle correspond à l’ordre de Yahweh. « Donc » rend la progression narrative de וַ sans alourdir la phrase.'
