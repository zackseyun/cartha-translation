base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: fr
  text: 'Après que David eut recensé le peuple[a], son cœur le frappa[b]. David dit à Yahweh : « J’ai gravement péché en faisant cela. Et maintenant, Yahweh, enlève, je t’en prie, la culpabilité de ton serviteur[c], car j’ai agi de façon vraiment insensée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « compté le peuple » ou « fait le dénombrement du peuple ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le cœur de David le frappa »; cette expression évoque une vive atteinte intérieure ou une conscience troublée.'
    reason: cultural_note
  - marker: c
    text: Ou « la faute de ton serviteur ». Le mot hébreu peut désigner la faute, la culpabilité ou, parfois, la peine qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: son cœur le frappa
  rationale: Cette formulation conserve l’image hébraïque selon laquelle le cœur de David le « frappe », tout en restant intelligible en français; la note en explicite la valeur idiomatique.
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: Après que David eut recensé le peuple
  rationale: La construction française exprime clairement que la réaction intérieure de David survient après le dénombrement. « Recenser » convient à un comptage officiel de la population sans surcharger le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: חָטָאתִי מְאֹד
  choice: J’ai gravement péché
  rationale: « Gravement » restitue l’intensif מְאֹד dans une confession naturelle et solennelle.
- source_word: הַעֲבֶר נָא
  choice: enlève, je t’en prie
  rationale: Le causatif de עבר demande ici que la culpabilité soit ôtée. « Je t’en prie » rend la particule de supplication נָא.
- source_word: עֲוֹן עַבְדְּךָ
  choice: la culpabilité de ton serviteur
  rationale: Dans cette prière suivant l’aveu du péché, « culpabilité » exprime naturellement le fardeau moral que David demande à Dieu d’enlever, tout en laissant une note signaler l’étendue sémantique du terme.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: car j’ai agi de façon vraiment insensée
  rationale: La formulation rend la valeur verbale de l’action insensée ainsi que l’intensité de מְאֹד, dans un français actuel.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Sens de עָוֹן dans la supplication de David
  choice: culpabilité
  alternative: faute; iniquité; peine liée à la faute
  rationale: Le contexte associe confession et demande d’enlèvement. « Culpabilité » maintient le sens moral et relationnel sans réduire le mot à la seule peine, tandis que la note conserve son amplitude possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve l’image frappante de l’idiome hébreu, expliquée en note, et emploie « Yahweh » pour le nom divin. La syntaxe initiale a été réorganisée sans modifier la succession temporelle afin d’éviter une tournure artificielle en français.
