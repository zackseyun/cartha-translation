  text: וַ/יָּבֹ֨אוּ֙ הַ/גִּלְעָ֔דָ/ה וְ/אֶל אֶ֥רֶץ תַּחְתִּ֖ים חָדְשִׁ֑י וַ/יָּבֹ֨אוּ֙ דָּ֣נָ/ה יַּ֔עַן וְ/סָבִ֖יב אֶל צִידֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: fr
  text: Ils arrivèrent en Galaad et dans le pays de Tahtim-Hodshi[a]. Puis ils arrivèrent à Dan-Yaan[b] et passèrent par les environs jusqu’à Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu Tahtim-Hodshi est obscur. Certains proposent, par correction ou interprétation du texte, « le pays des Hittites, vers Qadesh » ou une expression semblable, mais l’identification du lieu demeure incertaine.
    reason: alternative_reading
  - marker: b
    text: Dan-Yaan est probablement un nom de lieu, mais son emplacement exact demeure incertain.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: ils arrivèrent
  rationale: Le wayyiqtol de בוא marque ici les étapes successives d’un itinéraire. « Arrivèrent » exprime naturellement le déplacement jusqu’aux lieux indiqués, et la répétition rend la progression du récit hébreu.
- source_word: הַגִּלְעָדָה
  choice: en Galaad
  rationale: Le hé directionnel indique un mouvement vers la région de Galaad. En français géographique courant, « en Galaad » est idiomatique.
- source_word: אֶרֶץ
  choice: le pays de
  rationale: אֶרֶץ désigne ici un territoire ou une région, non la terre en général.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: Tahtim-Hodshi
  rationale: L’expression hébraïque est obscure et probablement toponymique. La translittération évite d’introduire dans le texte une conjecture géographique.
- source_word: דָּנָה יַּעַן
  choice: à Dan-Yaan
  rationale: La séquence est vraisemblablement un nom de lieu. Le hé directionnel de דָּנָה est rendu par « à »; « Yaan » transpose יען sans imposer une identification incertaine.
- source_word: וְסָבִיב
  choice: et firent le tour
  rationale: סָבִיב évoque un mouvement circulaire ou un détour par les environs. L’ajout du verbe exigé par le français explicite le mouvement sans préciser davantage son tracé.
- source_word: אֶל צִידוֹן
  choice: jusqu’à Sidon
  rationale: La préposition אֶל introduit le point vers lequel se poursuit le déplacement; avec « firent le tour », « jusqu’à » donne une formulation française naturelle.
