base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: fr
  text: 'Alors David dit à l’Éternel, lorsqu’il vit l’ange frapper le peuple : « C’est moi qui ai péché, c’est moi qui ai mal agi. Mais ces brebis, qu’ont-elles fait ? Que ta main s’abatte, je t’en prie, sur moi et sur la maison de mon père ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et immédiatement reconnaissable du tétragramme, sans ajouter de note inutile dans ce verset.
- source_word: הִנֵּה אָנֹכִי
  choice: C’est moi qui
  rationale: Dans cet aveu contrastif, cette tournure française naturelle restitue l’insistance de הִנֵּה et du pronom אָנֹכִי.
- source_word: הֶעֱוֵיתִי
  choice: ai mal agi
  rationale: Exprime distinctement l’idée d’avoir commis le mal, en parallèle avec « ai péché », sans surcharger la formulation.
- source_word: הַצֹּאן
  choice: ces brebis
  rationale: Conserve l’image pastorale par laquelle David désigne le peuple, plutôt que de l’expliciter.
- source_word: תְּהִי נָא יָדְךָ בִּי
  choice: Que ta main s’abatte donc sur moi
  rationale: « La main » désigne ici l’action punitive de Dieu; « s’abatte » rend ce sens contextuel en français naturel, tandis que « donc » porte la nuance suppliante de נָא.
- source_word: בְבֵית אָבִי
  choice: sur la maison de mon père
  rationale: Conserve l’expression familiale et dynastique hébraïque sans la réduire à la seule maisonnée matérielle.
theological_decisions:
- issue: Responsabilité de David et souffrance du peuple
  choice: Conserver l’aveu appuyé de David et sa question concernant les brebis
  alternative: Reformuler pour expliquer ou justifier le jugement divin
  rationale: Le texte maintient une tension entre la faute confessée par David et le châtiment frappant le peuple; la traduction ne doit pas résoudre cette tension.
- issue: Portée de « la maison de mon père »
  choice: Garder la formulation littérale
  alternative: Préciser « ma famille » ou « ma dynastie »
  rationale: L’hébreu peut englober la famille et la lignée; la formulation retenue préserve cette amplitude.
translation_notes:
  register: Français moderne, digne et oralement fluide. L’insistance de la confession est rendue par la répétition « C’est moi ». L’image des brebis et la métaphore de la main divine sont conservées.
