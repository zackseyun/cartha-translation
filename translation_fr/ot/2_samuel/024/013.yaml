  - severity: low
    issue: « Donc », « ces paroles » et « bien » ajoutent des précisions absentes du texte source.
    rationale: Ces ajouts ne changent pas fortement le sens, mais une traduction d’équivalence optimale peut les éviter.
  - severity: low
    issue: Le futur « ils te poursuivront » atténue la valeur concomitante du participe רֹדְפֶךָ.
    rationale: Le présent « ils te poursuivent » exprime plus directement la poursuite durant les trois mois de fuite.
