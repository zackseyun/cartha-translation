- from: 'Gad vint donc trouver David et lui rapporta ces paroles. Il lui dit : « Veux-tu que sept années de famine s’abattent sur ton pays[a] ? Ou préfères-tu fuir pendant trois mois devant tes adversaires[b], tandis qu’ils te poursuivront ? Ou bien veux-tu qu’il y ait trois jours d’épidémie[c] dans ton pays ? Maintenant, réfléchis bien et vois quelle réponse je dois rapporter à celui qui m’a envoyé. »'
  to: 'Gad vint auprès de David et l’en informa. Il lui dit : « Sept années de famine viendront-elles dans ton pays[a] ? Ou fuiras-tu pendant trois mois devant tes adversaires[b], tandis qu’ils te poursuivent ? Ou y aura-t-il trois jours d’épidémie[c] dans ton pays ? Maintenant, réfléchis et vois quelle réponse je dois rapporter à celui qui m’a envoyé. »'
  rationale: La révision élimine les ajouts interprétatifs et rend les trois propositions comme les interrogations directes du texte hébreu. Elle conserve la divergence textuelle avec 1 Chroniques en note, sans harmoniser le texte principal, et maintient les ancres de notes sur les termes concernés.
