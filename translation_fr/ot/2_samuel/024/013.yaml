  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: fr
  text: 'Gad vint auprès de David et l’en informa. Il lui dit : « Sept années de famine viendront-elles dans ton pays[a] ? Ou fuiras-tu pendant trois mois devant tes adversaires[b], tandis qu’ils te poursuivent ? Ou y aura-t-il trois jours d’épidémie[c] dans ton pays ? Maintenant, réfléchis et vois quelle réponse je dois rapporter à celui qui m’a envoyé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage parallèle de 1 Chroniques 21.12 porte « trois années de famine » au lieu de « sept années ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « tes ennemis ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « peste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גָד אֶל דָּוִד
  choice: Gad vint donc trouver David
  rationale: La tournure rend naturellement en français l’arrivée de Gad auprès de David, tout en conservant la progression narrative du wayyiqtol.
- source_word: וַיַּגֶּד לוֹ
  choice: lui rapporta ces paroles
  rationale: Le hifil de נגד signifie annoncer ou rapporter. « Ces paroles » explicite sobrement le contenu transmis sans ajouter d’interprétation.
- source_word: הֲתָבוֹא לְךָ שֶׁבַע שָׁנִים רָעָב בְּאַרְצֶךָ
  choice: Veux-tu que sept années de famine s’abattent sur ton pays ?
  rationale: La question présente un choix à David. « S’abattent » exprime naturellement la venue d’une calamité en français; « famine » désigne une pénurie collective, et non la simple faim.
- source_word: שְׁלֹשָׁה חֳדָשִׁים נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: fuir pendant trois mois devant tes adversaires
  rationale: La proposition hébraïque est elliptique. Cette formulation rétablit en français courant l’idée de David en fuite durant trois mois, sans préciser davantage la nature du conflit.
- source_word: צָרֶיךָ
  choice: tes adversaires
  rationale: צַר peut désigner un adversaire ou un ennemi. « Adversaires » conserve le sens hostile tout en laissant « ennemis » comme variante légitime.
- source_word: וְהוּא רֹדְפֶךָ
  choice: tandis qu’ils te poursuivront
  rationale: Le pronom hébreu est formellement singulier, mais il reprend vraisemblablement de manière collective les adversaires au pluriel. Le pluriel français assure une référence naturelle.
- source_word: שְׁלֹשֶׁת יָמִים דֶּבֶר
  choice: trois jours d’épidémie
  rationale: דֶּבֶר désigne une épidémie meurtrière ou une peste. « Épidémie » est précis et immédiatement compréhensible en français moderne.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: Maintenant, réfléchis bien et vois
  rationale: Les deux impératifs invitent David à considérer la situation et à décider. « Réfléchis bien » communique la fonction de דַּע plus naturellement que le calque « sache ».
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: quelle réponse je dois rapporter à celui qui m’a envoyé
  rationale: השיב דבר est une expression idiomatique signifiant rapporter une réponse. La formulation française conserve aussi la référence non explicitée à l’envoyeur de Gad.
theological_decisions:
- issue: Divergence numérique avec le récit parallèle de 1 Chroniques 21.12
  choice: Conserver « sept années de famine » dans le texte principal
  alternative: « trois années de famine », selon 1 Chroniques 21.12
  rationale: Le texte massorétique de 2 Samuel 24.13 porte « sept ». Le traduire tel quel et signaler le parallèle en note préserve les données textuelles et la tension canonique sans harmonisation conjecturale.
- issue: Identité de « celui qui m’a envoyé »
  choice: Ne pas expliciter son identité dans le texte
  alternative: « le Seigneur, qui m’a envoyé »
  rationale: Le contexte identifie l’envoyeur, mais le verset hébreu emploie seulement « celui qui m’a envoyé ». La traduction conserve cette formulation plutôt que d’ajouter un nom divin absent de la phrase.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions sont formulées comme les trois choix proposés à David. Le texte évite les archaïsmes, tout en maintenant la solennité du message prophétique et les ambiguïtés pertinentes de l’hébreu.
