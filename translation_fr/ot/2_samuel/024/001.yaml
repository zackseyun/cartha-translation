  text: וַ/יֹּ֨סֶף֙ אַף יְהוָ֔ה לַ/חֲר֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת אֶת דָּוִ֤ד בָּ/הֶם֙ לֵ/אמֹ֔ר לֵ֛ךְ מְנֵ֥ה אֶת יִשְׂרָאֵ֖ל וְ/אֶת יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: fr
  text: 'La colère de Yahweh s’enflamma de nouveau contre Israël[a], et il incita David contre eux en disant : « Va[b], compte Israël et Juda. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En 1 Chroniques 21.1, Satan se dressa contre Israël et incita David à dénombrer Israël. Le texte principal suit ici le sujet le plus naturel de l’hébreu de 2 Samuel et conserve la tension entre les deux récits au lieu de les harmoniser.
    reason: cross_reference
  - marker: b
    text: 'Ou : « dénombre » ou « fais un recensement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַחֲרוֹת
  choice: s’enflamma de nouveau
  rationale: La construction exprime le renouvellement de l’action, tandis que l’idiome חרה אף présente la colère comme un feu qui s’embrase. Cette formulation conserve la métaphore dans un français naturel.
- source_word: אַף
  choice: la colère
  rationale: Bien que le mot désigne littéralement le nez, il exprime ici idiomatiquement la colère.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּיִשְׂרָאֵל
  choice: contre Israël
  rationale: Dans cet idiome, la préposition indique que la colère est dirigée contre Israël.
- source_word: וַיָּסֶת
  choice: il poussa
  rationale: Le hifil de סות signifie inciter, provoquer ou pousser à agir. « Poussa » est clair et naturel tout en gardant la force causative.
- source_word: בָּהֶם
  choice: contre eux
  rationale: Le syntagme est difficile; « contre eux » conserve son lien avec Israël et indique que l’acte demandé aura le peuple pour objet et lui sera préjudiciable, sans explicitation excessive.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Cette formule introduit directement les paroles qui suivent.
- source_word: לֵךְ
  choice: Va
  rationale: Rendu direct et naturel de l’impératif.
- source_word: מְנֵה
  choice: compte
  rationale: Le verbe signifie compter ou dénombrer; « compte » reste concis et permet de signaler en note l’idée de recensement.
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: Israël et Juda
  rationale: Les deux noms propres sont conservés sans ajout explicatif, conformément au texte hébreu.
theological_decisions:
- issue: L’agent qui pousse David, en comparaison avec 1 Chroniques 21.1
  choice: et il poussa David
  alternative: et quelqu’un poussa David; ou « Satan poussa David », par harmonisation avec 1 Chroniques 21.1
  rationale: Le sujet le plus naturel de וַיָּסֶת est Yahweh, sujet de la proposition précédente. La traduction suit donc la syntaxe ordinaire de 2 Samuel et conserve la tension avec le récit parallèle au lieu de l’harmoniser.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la colère qui s’enflamme est préservée; la tournure difficile « contre eux » reste proche de l’hébreu. Les marqueurs [a] et [b] figurent dans le texte principal.
