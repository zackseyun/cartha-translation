source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: fr
  text: Là, David construisit un autel pour Yahweh et offrit des holocaustes et des sacrifices de communion[a]. Alors Yahweh se laissa fléchir en faveur du pays[b], et le fléau qui frappait Israël fut arrêté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de paix ».
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu évoque l’accueil favorable d’une supplication ; littéralement, « Yahweh se laissa implorer pour le pays ». On peut aussi comprendre : « Yahweh exauça la prière en faveur du pays ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם
  choice: Là, David construisit
  rationale: Rend directement le verbe narratif et l’adverbe locatif, qui renvoie à l’aire d’Arauna.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: un autel pour Yahweh
  rationale: « Pour » exprime naturellement la destination ou la consécration de l’autel; le nom divin est translittéré.
- source_word: וַיַּעַל עֹלוֹת
  choice: offrit des holocaustes
  rationale: « Holocauste » est le terme sacrificiel français établi pour עֹלָה et implique déjà l’offrande entièrement consumée.
- source_word: וּשְׁלָמִים
  choice: des sacrifices de communion
  rationale: Cette expression française actuelle met en valeur la dimension de communion de שְׁלָמִים sans suggérer que ces sacrifices produisaient la paix; « sacrifices de paix » demeure possible.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Yahweh se laissa fléchir en faveur du pays
  rationale: Le niphal de עתר exprime une réponse favorable à une supplication implicite. La formulation conserve cette valeur sans ajouter explicitement une prière absente de la proposition.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: le fléau qui frappait Israël fut arrêté
  rationale: La relative explicite naturellement מֵעַל (« sur, au-dessus de ») tout en maintenant le passif de עצר.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération conserve le nom propre de l’alliance présent dans le texte hébreu, sans le remplacer par un titre.
- issue: Portée de וַיֵּעָתֵר ... לָאָרֶץ
  choice: se laissa fléchir en faveur du pays
  alternative: exauça la prière en faveur du pays; répondit favorablement au pays
  rationale: Le verbe encode une réponse favorable à une supplication, mais celle-ci n’est pas explicitement nommée ici. Le choix garde à la fois cette nuance et l’objet « le pays ».
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsmes. Les deux marqueurs [a] et [b] figurent dans le texte principal.
