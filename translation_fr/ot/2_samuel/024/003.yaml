  text: וַ/יֹּ֨אמֶר יוֹאָ֜ב אֶל הַ/מֶּ֗לֶךְ וְ/יוֹסֵ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֶל הָ/עָ֜ם כָּ/הֵ֤ם וְ/כָ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים וְ/עֵינֵ֥י אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ רֹא֑וֹת וַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ לָ֥/מָּה חָפֵ֖ץ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: fr
  text: 'Mais Joab dit au roi : « Que Yahweh, ton Dieu, rende le peuple cent fois plus nombreux qu’il ne l’est, et que mon seigneur le roi le voie de ses propres yeux[a] ! Mais pourquoi mon seigneur le roi désire-t-il cela ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et que les yeux de mon seigneur le roi voient ». L’hébreu ne précise pas ce qu’ils voient ; Joab souhaite que le roi vive assez longtemps pour être témoin d’un tel accroissement.'
    reason: L’objet du verbe est implicite en hébreu, et la tournure française explicite légèrement le sens.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Joab dit
  rationale: Le waw fait avancer le récit, mais la réponse de Joab s’oppose ici à l’ordre royal ; « Mais » rend naturellement cette valeur adversative.
- source_word: וְיוֹסֵף יְהוָה אֱלֹהֶיךָ
  choice: Que Yahweh ton Dieu rende… plus nombreux
  rationale: La tournure exprime un souhait de multiplication. En français, « rendre… plus nombreux » communique idiomatiquement l’idée d’ajouter au peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֶל הָעָם
  choice: le peuple
  rationale: עָם désigne largement le peuple ; le contexte du recensement ne justifie pas de restreindre le sens à « armée ».
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: cent fois plus nombreux qu’il ne l’est
  rationale: Cette formulation française rend l’expression idiomatique de multiplication à partir de l’effectif présent.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: et que mon seigneur le roi le voie de ses propres yeux
  rationale: La formulation naturelle en français conserve le souhait que le roi vive assez longtemps pour être témoin de cet accroissement, tout en signalant en note que l’objet du verbe reste implicite en hébreu.
- source_word: חָפֵץ בַּדָּבָר הַזֶּה
  choice: prend-il plaisir à cette entreprise
  rationale: חָפֵץ exprime le plaisir ou la satisfaction éprouvée à l’égard de la chose envisagée ; « entreprise » renvoie naturellement au projet de recensement sans en préciser davantage la nature.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre du Dieu d’Israël ; la translittération préserve ce nom au lieu de lui substituer un titre.
- issue: Portée de la bénédiction formulée par Joab
  choice: Un souhait que le peuple soit multiplié et que David en soit témoin
  alternative: Une prédiction certaine d’un accroissement futur
  rationale: Le contexte et la forme de la proposition favorisent une bénédiction ou un souhait, sans transformer les paroles de Joab en prophétie certaine.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au suffixe hébreu singulier dans « ton Dieu », tandis que « mon seigneur le roi » conserve la formule de respect de la cour. « Cette entreprise » évite l’expression peu naturelle « cette chose » tout en maintenant la référence au recensement.
