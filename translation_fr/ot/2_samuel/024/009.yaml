  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל הַ/מֶּ֑לֶךְ וַ/תְּהִ֣י יִשְׂרָאֵ֡ל שְׁמֹנֶה֩ מֵא֨וֹת אֶ֤לֶף אִֽישׁ חַ֨יִל֙ שֹׁ֣לֵֽף חֶ֔רֶב וְ/אִ֣ישׁ יְהוּדָ֔ה חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: fr
  text: 'Joab remit au roi le chiffre du recensement du peuple : Israël comptait huit cent mille hommes vaillants qui tiraient l’épée[a], et les hommes de Juda étaient cinq cent mille hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le passage parallèle de 1 Chroniques 21.5 donne des totaux différents : 1 100 000 pour Israël et 470 000 pour Juda. La traduction suit ici le texte hébreu de 2 Samuel sans harmoniser les chiffres.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: le chiffre du recensement du peuple
  rationale: La formulation conserve la chaîne nominale hébraïque tout en restant naturelle en français. « Recensement » convient au dénombrement effectué dans ce chapitre.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: Israël comptait
  rationale: Le verbe introduit le total obtenu. « Israël comptait » exprime naturellement en français la valeur résultative de l’hébreu collectif.
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: huit cent mille
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: אִישׁ חַיִל
  choice: vaillants guerriers
  rationale: Dans ce contexte de recensement militaire, l’expression désigne des hommes forts et aptes au combat. « Vaillants guerriers » conserve la nuance de valeur militaire sans réduire le sens à la seule condition physique.
- source_word: שֹׁלֵף חֶרֶב
  choice: sachant manier l’épée
  rationale: L’expression signifie littéralement « tirant l’épée » et désigne ici des hommes aptes à combattre. Le rendu français garde l’image concrète de l’épée tout en exprimant clairement la capacité militaire.
- source_word: וְאִישׁ יְהוּדָה
  choice: et les hommes de Juda
  rationale: Le singulier אִישׁ a ici une valeur collective. Le pluriel français rend clairement le groupe dénombré.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: étaient cinq cent mille
  rationale: Le nom « hommes », déjà exprimé dans « les hommes de Juda », n’a pas besoin d’être répété après le nombre en français. La construction demeure fidèle au total explicite de l’hébreu.
theological_decisions:
- issue: Écart numérique avec le passage parallèle de 1 Chroniques 21.5
  choice: 'Traduire le texte massorétique de 2 Samuel tel qu’il se présente : huit cent mille pour Israël et cinq cent mille pour Juda.'
  alternative: Harmoniser les chiffres avec 1 Chroniques, ou expliquer l’écart par l’inclusion ou l’exclusion de certaines catégories de soldats.
  rationale: La traduction ne doit pas résoudre par conjecture l’écart entre les deux récits. Elle présente fidèlement les chiffres du texte hébreu de 2 Samuel et signale le parallèle en note.
translation_notes:
  register: Français international moderne, clair et digne. « Remit », « recensement » et « manier l’épée » maintiennent une tonalité narrative soutenue mais accessible. Le texte évite aussi bien le jargon administratif excessif que les tournures archaïques.
