  - severity: low
    issue: Ajout de « y » dans « y bâtir un autel »
    rationale: Le texte hébreu exprime l’achat de l’aire puis le but de bâtir un autel, sans adverbe locatif explicite. L’omission préserve plus strictement la formulation source.
