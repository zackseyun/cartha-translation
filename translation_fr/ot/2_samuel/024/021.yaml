  text: וַ/יֹּ֣אמֶר אֲרַ֔וְנָה מַדּ֛וּעַ בָּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אֶל עַבְדּ֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד לִ/קְנ֧וֹת מֵ/עִמְּ/ךָ֣ אֶת הַ/גֹּ֗רֶן לִ/בְנ֤וֹת מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וְ/תֵעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: fr
  text: 'Arauna dit : « Pourquoi mon seigneur le roi vient-il chez son serviteur[a] ? » David répondit : « Pour acheter auprès de toi l’aire de battage, pour bâtir un autel à Yahweh, afin que le fléau soit écarté du peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « son serviteur » : Arauna parle de lui-même à la troisième personne par déférence envers le roi. On pourrait traduire selon le sens : « ton serviteur ».'
    reason: La formulation hébraïque courtoise peut paraître ambiguë ou inhabituelle en français moderne.
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Interrogatif direct et naturel qui demande le motif de la venue du roi.
- source_word: בָּא
  choice: vient-il
  rationale: Dans ce dialogue immédiat, le présent français exprime naturellement la venue actuelle du roi, sans imposer une valeur temporelle étrangère au parfait hébreu.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Conserve l’adresse déférente et le titre royal dans un français soutenu mais compréhensible.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Reproduit la troisième personne de l’hébreu, forme de référence à soi-même propre au langage courtois.
- source_word: לִקְנוֹת מֵעִמְּךָ
  choice: pour t’acheter
  rationale: Rend clairement l’achat auprès d’Arauna et s’intègre naturellement à la réponse elliptique de David.
- source_word: הַגֹּרֶן
  choice: l’aire de battage
  rationale: Désignation française usuelle du lieu agricole où l’on battait et vannait les céréales.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: y bâtir un autel
  rationale: L’ajout pronominal « y » explicite naturellement en français que l’autel sera bâti sur l’aire, implication claire du contexte.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Conserve le nom divin personnel יהוה et rend la destination cultuelle de l’autel.
- source_word: וְתֵעָצַר הַמַּגֵּפָה
  choice: afin que le fléau … cesse
  rationale: Exprime la finalité ou le résultat recherché sans présenter son accomplissement comme déjà certain; « cesse » rend idiomatiquement le passif hébreu dans ce contexte.
- source_word: מֵעַל הָעָם
  choice: qui frappe le peuple
  rationale: 'Transposition idiomatique de l’image spatiale « de dessus le peuple » : le fléau pèse sur le peuple et l’atteint.'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Force de וְתֵעָצַר après l’expression du but
  choice: afin que … cesse
  alternative: et le fléau cessera
  rationale: Le contexte présente le but recherché par la construction de l’autel; la traduction évite de transformer cette intention en prédiction catégorique.
translation_notes:
  register: Français international moderne, digne et narratif. Le vouvoiement implicite de la cour est rendu par le titre déférent, tandis que David tutoie Arauna, conformément à l’asymétrie sociale perceptible dans les formes hébraïques.
