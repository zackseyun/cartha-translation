id: 2SA.24.15
reference: 2 Samuel 24:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: fr
  text: Alors Yahweh envoya une épidémie sur Israël, depuis le matin jusqu’au temps fixé[a]. Parmi le peuple, soixante-dix mille hommes moururent, de Dan jusqu’à Beer-Shéba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au moment fixé ». L’expression hébraïque peut désigner un temps déterminé ; ici, le sens « jusqu’au temps du rassemblement » est moins probable.
    reason: Préserver l’ambiguïté de עֵת מוֹעֵד et signaler une autre interprétation lexicalement possible.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: envoya
  rationale: Littéralement « donna », mais avec דֶּבֶר le français naturel exprime l’action par « envoyer une épidémie » ; l’agent divin demeure explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, plutôt que substitution par un titre.
- source_word: דֶּבֶר
  choice: épidémie
  rationale: Terme moderne et intelligible pour une maladie contagieuse meurtrière ; « peste » pourrait suggérer trop précisément une maladie particulière.
- source_word: בְּיִשְׂרָאֵל
  choice: sur Israël
  rationale: Rend naturellement la calamité qui frappe la nation.
- source_word: מֵהַבֹּקֶר וְעַד עֵת מוֹעֵד
  choice: depuis le matin jusqu’au temps fixé
  rationale: Conserve le point de départ et l’idée d’une échéance déterminée, sans préciser qui l’a fixée.
- source_word: וַיָּמָת מִן הָעָם
  choice: Parmi le peuple, … moururent
  rationale: Exprime idiomatiquement que les morts furent pris parmi le peuple, tout en rendant le verbe hébreu de manière directe.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: de Dan jusqu’à Beer-Shéba
  rationale: Reproduit l’expression géographique couvrant toute l’étendue d’Israël.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: soixante-dix mille hommes
  rationale: Préserve le substantif masculin אִישׁ employé distributivement après le nombre.
theological_decisions:
- issue: Action divine dans le jugement
  choice: Yahweh envoya une épidémie sur Israël
  alternative: Yahweh permit qu’une épidémie frappe Israël
  rationale: L’hébreu attribue directement l’action à Yahweh et ne contient aucun verbe signifiant « permettre » ; cette tension n’est donc pas atténuée.
- issue: Sens de עֵת מוֹעֵד
  choice: jusqu’au temps fixé
  alternative: jusqu’au temps du rassemblement
  rationale: Dans ce contexte narratif, מוֹעֵד désigne vraisemblablement une échéance déterminée. La possibilité lexicale moins probable d’un temps de rassemblement est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. « Épidémie » évite l’ambiguïté moderne de « peste », tandis que « hommes » conserve la forme masculine du texte source.
