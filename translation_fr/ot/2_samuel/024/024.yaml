  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אֲרַ֗וְנָה לֹ֚א כִּֽי קָנ֨וֹ אֶקְנֶ֤ה מֵ/אֽוֹתְ/ךָ֙ בִּ/מְחִ֔יר וְ/לֹ֧א אַעֲלֶ֛ה לַ/יהוָ֥ה אֱלֹהַ֖/י עֹל֣וֹת חִנָּ֑ם וַ/יִּ֨קֶן דָּוִ֤ד אֶת הַ/גֹּ֨רֶן֙ וְ/אֶת הַ/בָּקָ֔ר בְּ/כֶ֖סֶף שְׁקָלִ֥ים חֲמִשִּֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: fr
  text: 'Mais le roi dit à Arauna : « Non ! Je te l’achèterai bel et bien, contre paiement. Je n’offrirai pas à Yahweh, mon Dieu, des holocaustes qui ne me coûtent rien[a]. » David acheta donc l’aire de battage et les bovins[b] pour cinquante sicles d’argent[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « des holocaustes gratuitement » ou « pour rien ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le bétail » ou « les bœufs ». Le terme hébreu peut désigner collectivement les bovins ou, selon le contexte, les animaux employés pour le travail et les sacrifices.'
    reason: lexical_alternative
  - marker: c
    text: En 1 Chroniques 21.25, David paie six cents sicles d’or pour le site. Ici, les cinquante sicles d’argent concernent l’aire de battage et les bovins.
    reason: cross_reference
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Translittération française naturelle de la forme hébraïque propre au livre de Samuel. « Ornân » appartient à la formulation parallèle des Chroniques et n’est pas substitué ici.
- source_word: קָנוֹ אֶקְנֶה
  choice: je te l’achèterai bel et bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Bel et bien » restitue cette insistance dans un français courant et digne.
- source_word: בִּמְחִיר
  choice: contre paiement
  rationale: Le terme désigne le prix ou la contrepartie d’un achat. Cette formulation conserve clairement l’idée d’une transaction sans imposer la notion d’un prix particulier ou négocié.
- source_word: אַעֲלֶה
  choice: je n’offrirai pas
  rationale: À la forme causative, עלה employé avec des sacrifices signifie les faire monter sur l’autel, donc les offrir.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu directement par « Yahweh », conformément à sa fonction de nom propre dans le texte.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe de première personne est conservé et exprime la relation personnelle affirmée par David.
- source_word: עֹלוֹת
  choice: des holocaustes
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée sur l’autel.
- source_word: חִנָּם
  choice: qui ne me coûtent rien
  rationale: Le mot signifie littéralement « gratuitement » ou « pour rien ». Dans ce contexte d’achat refusé comme don, cette formulation explicite naturellement le coût assumé par David sans modifier son propos.
- source_word: הַגֹּרֶן
  choice: l’aire de battage
  rationale: Rendu concret et usuel du lieu agricole où l’on battait et vannait les céréales.
- source_word: הַבָּקָר
  choice: les bovins
  rationale: Le nom collectif désigne le gros bétail, notamment les bovins. « Bovins » évite de préciser sans nécessité s’il s’agit uniquement de bœufs de travail.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: pour cinquante sicles d’argent
  rationale: Formulation française conventionnelle qui conserve à la fois le poids monétaire et la matière du paiement.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme comme nom propre. « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction d’appellation personnelle.
- issue: Portée de חִנָּם dans la déclaration de David
  choice: des holocaustes qui ne me coûtent rien
  alternative: des holocaustes gratuitement / pour rien
  rationale: Le contexte oppose le don proposé par Arauna à l’achat exigé par David. La traduction exprime cette implication contextuelle, tandis que la note conserve le sens plus littéral et son ambiguïté potentielle.
translation_notes:
  register: Français international moderne, direct et solennel. Le discours conserve l’insistance de l’hébreu sans tournure archaïque. « Sicle », terme biblique établi, est maintenu plutôt que converti en une mesure moderne incertaine.
