source:
  edition: WLC
  text: וַ/יַּשְׁקֵ֣ף אֲרַ֗וְנָה וַ/יַּ֤רְא אֶת הַ/מֶּ֨לֶךְ֙ וְ/אֶת עֲבָדָ֔י/ו עֹבְרִ֖ים עָלָ֑י/ו וַ/יֵּצֵ֣א אֲרַ֔וְנָה וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ אַפָּ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: fr
  text: Arauna regarda au-dehors et vit le roi et ses serviteurs qui s’avançaient vers lui[a]. Alors Arauna sortit et se prosterna devant le roi, le visage contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui passaient près de lui » ou « qui s’approchaient de lui »; l’expression hébraïque décrit littéralement leur déplacement par rapport à Arauna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: regarda au-dehors
  rationale: Le verbe évoque un regard porté depuis un point d’observation ou une ouverture; cette formulation conserve cette nuance sans se réduire au simple fait de voir.
- source_word: וַיַּרְא
  choice: vit
  rationale: 'Rend directement ראה et maintient la progression narrative: Arauna regarde, puis aperçoit effectivement le groupe.'
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans un cadre royal, le terme peut désigner les serviteurs ou membres de la suite du roi. « Serviteurs » demeure le rendu le plus direct sans préciser indûment leur fonction.
- source_word: עֹבְרִים עָלָיו
  choice: qui s’avançaient vers lui
  rationale: L’expression décrit le déplacement du roi et de ses serviteurs par rapport à Arauna. Dans le contexte de leur arrivée à son aire, « s’avançaient vers lui » exprime naturellement le mouvement tout en évitant de suggérer qu’ils ne faisaient que passer à côté.
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Rendu narratif naturel de יצא, cohérent avec Arauna qui observait depuis son emplacement avant d’aller à la rencontre du roi.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna
  rationale: Le verbe désigne ici un geste corporel d’hommage devant un roi humain. « Se prosterna » correspond en outre à la précision que son visage touche le sol, sans présenter ce geste comme un acte d’adoration divine.
- source_word: אַפָּיו אָרְצָה
  choice: le visage contre terre
  rationale: Cette expression française rend clairement l’idiome hébreu décrivant une prosternation complète, le visage dirigé vers le sol.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Translittération française usuelle de la forme du nom présente dans Samuel; « Ornân » appartient à la forme parallèle des Chroniques.
theological_decisions:
- issue: Nature du geste d’Arauna devant le roi
  choice: Hommage civil exprimé par « se prosterna devant le roi »
  alternative: « adora le roi »
  rationale: Le verbe hébreu peut servir pour l’adoration ou pour la déférence envers une personne. Ici, son objet est le roi David dans une rencontre humaine; le rendu choisi décrit le geste sans lui attribuer une portée cultuelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le nom « Arauna » suit la forme de Samuel. La répétition du nom dans la seconde phrase conserve la netteté narrative de l’hébreu. La note préserve l’ambiguïté spatiale de עֹבְרִים עָלָיו.
