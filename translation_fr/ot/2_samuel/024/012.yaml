  text: הָל֞וֹךְ וְ/דִבַּרְתָּ֣ אֶל דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁלֹ֕שׁ אָנֹכִ֖י נוֹטֵ֣ל עָלֶ֑י/ךָ בְּחַר לְ/ךָ֥ אַֽחַת מֵ/הֶ֖ם וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: fr
  text: 'Va parler à David : « Voici ce que dit Yahweh : Je mets devant toi trois choses[a]. Choisis-en une, et je te la ferai subir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « trois »; le nom est sous-entendu. On pourrait aussi traduire « trois possibilités » ou « trois options ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ אֶל־דָּוִד
  choice: Va parler à David et dis-lui
  rationale: La construction infinitif absolu plus verbe conjugué renforce l’ordre. Cette formulation française rend naturellement le déplacement suivi de la mission de parole, sans reproduire lourdement la syntaxe hébraïque.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formule de messager prophétique rendue dans un français actuel et digne; le nom divin est translittéré « Yahweh ».
- source_word: שָׁלֹשׁ
  choice: trois possibilités
  rationale: L’hébreu porte seulement le numéral féminin « trois », sans nom exprimé. Le contexte immédiat d’un choix entre elles permet de rendre naturellement l’ellipse par « possibilités », tout en la signalant en note.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: Je place devant toi
  rationale: Dans ce contexte, Dieu présente à David trois possibilités de jugement parmi lesquelles il doit choisir. « Placer devant toi » communique cette présentation sans faire croire que les trois seront toutes imposées.
- source_word: בְּחַר־לְךָ אַחַת מֵהֶם
  choice: Choisis-en une pour toi-même
  rationale: « Choisis-en une » rend l’expression partitive; « pour toi-même » conserve le datif לְךָ et souligne la responsabilité personnelle de David.
- source_word: וְאֶעֱשֶׂה־לָּךְ
  choice: et je te la ferai subir
  rationale: Le contexte est celui d’un jugement défavorable. Cette formulation restitue clairement la valeur adverse de לְךָ, là où « je la ferai pour toi » serait trompeur en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » en conserve la fonction de nom divin sans lui substituer un titre.
- issue: Portée des trois jugements proposés
  choice: trois possibilités placées devant David
  alternative: trois choses déposées sur David
  rationale: La suite ordonne à David d’en choisir une; la traduction évite donc de suggérer que les trois jugements lui seront tous imposés, tout en conservant la gravité de celui qui sera exécuté.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique reste solennelle sans archaïsme. Le discours direct est ponctué selon l’usage français, et le féminin de « une » est naturellement rattaché à « possibilités ».
