  source_fidelity: 'La structure essentielle est bien rendue : ordre adressé à Gad, formule de messager divin, trois éléments à choisir, puis exécution de l’élément choisi. Toutefois, « et dis-lui » dédouble inutilement « parler à David » et « trois possibilités » interprète l’ellipse hébraïque plus fortement que nécessaire. « Trois choses » conserve l’indétermination du substantif absent tout en restant idiomatique.'
  naturalness: 'Le français est globalement clair et moderne. « Va parler à David : » est plus direct et plus naturel que « Va parler à David et dis-lui : ». « Choisis-en une » exprime naturellement le choix personnel sans l’alourdissement peu idiomatique de « pour toi-même ».'
  terminology: « Yahweh » rend correctement le Tétragramme conformément au choix fourni. « Voici ce que dit Yahweh » convient à la formule prophétique כֹּה אָמַר. « Je mets devant toi » suit l’orientation contextuelle attestée par l’injonction de choisir, sans prétendre que les trois jugements seront tous imposés.
