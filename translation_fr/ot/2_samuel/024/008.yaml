  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: fr
  text: Ils parcoururent tout le pays et, au bout de neuf mois et vingt jours, ils arrivèrent à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: ils parcoururent
  rationale: Le verbe שׁוט exprime un déplacement à travers une étendue. « Parcoururent » est naturel en français et convient à l’itinéraire du recensement, sans suggérer une errance sans but.
- source_word: בְּכָל הָאָרֶץ
  choice: tout le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire parcouru, non la terre entière. Avec « parcoururent », « tout le pays » rend naturellement l’idée d’étendue complète portée par בְּכָל.
- source_word: וַיָּבֹאוּ
  choice: ils revinrent
  rationale: בוא signifie « venir » ou « arriver ». Comme Jérusalem est le point de départ implicite de la mission dans le contexte immédiat, « revinrent » exprime idiomatiquement le retour à destination sans modifier le déroulement narratif.
- source_word: מִקְצֵה
  choice: au bout de
  rationale: L’expression marque le terme d’une période écoulée. « Au bout de » est l’équivalent français courant et précis.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: neuf mois et vingt jours
  rationale: Rendu direct et idiomatique de la durée indiquée en hébreu.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
