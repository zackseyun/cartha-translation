base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: fr
  text: 'Arauna dit alors à David : « Que mon seigneur le roi prenne ce qui lui paraît bon[a] et l’offre en sacrifice. Voici les bœufs pour l’holocauste, ainsi que les traîneaux à battre le grain et le matériel des bœufs[b] pour servir de bois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qui est bon à ses yeux ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est générale et peut désigner l’ensemble de l’équipement en bois associé aux bœufs, destiné ici à servir de combustible.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: prenne … et l’offre en sacrifice
  rationale: Les imparfaits ont ici une valeur d’invitation respectueuse. « Offre en sacrifice » exprime clairement le sens cultuel de עלה, tandis que le pronom reprend naturellement ce que le roi choisira.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette formule conserve l’adresse déférente et le titre royal dans un français digne et naturel.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: ce qui lui paraît bon
  rationale: Cette formulation rend naturellement l’idiome hébreu tout en conservant le passage à la troisième personne pour parler respectueusement au roi.
- source_word: רְאֵה
  choice: Voici
  rationale: Dans ce contexte de présentation des biens offerts, « Voici » fonctionne naturellement comme marqueur attirant l’attention.
- source_word: הַבָּקָר
  choice: les bœufs
  rationale: Le contexte des instruments de battage indique des bovins de trait; « bœufs » est précis et courant.
- source_word: לָעֹלָה
  choice: pour l’holocauste
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée et correspond au contexte sacrificiel.
- source_word: הַמֹּרִגִּים
  choice: les traîneaux à battre le grain
  rationale: מורג désigne un instrument de battage de type traîneau ou planche; cette expression descriptive est intelligible pour le lecteur moderne.
- source_word: כְלֵי הַבָּקָר
  choice: le matériel des bœufs
  rationale: כְּלִי est un terme large désignant ici l’équipement associé aux bœufs. Cette traduction évite de préciser sans certitude qu’il s’agit uniquement des jougs.
- source_word: לָעֵצִים
  choice: pour servir de bois
  rationale: La formule indique que les instruments en bois fourniront le combustible du sacrifice; cette traduction explicite sobrement leur fonction.
theological_decisions: []
