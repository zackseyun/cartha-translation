  naturalness: Le français est globalement naturel, digne et accessible. « Tombons, de grâce » est une formulation actuelle et soutenue qui évite l’ambiguïté pragmatique de « Tombons, je t’en prie ». Le pluriel « compassions », moins courant dans la conversation, demeure clair et convient au registre scripturaire; la note fournit l’alternative idiomatique au singulier.
  terminology: « Yahweh » est cohérent avec le tétragramme. « Entre les mains » est l’équivalent idiomatique français approprié de l’expression hébraïque, et « des hommes » conserve le contraste générique אדם/Yahweh sans lui imposer de lecture doctrinale. Les ancres de notes correspondent bien aux expressions commentées dans le texte français.
