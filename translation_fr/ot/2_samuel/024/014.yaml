  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד נִפְּלָה נָּ֤א בְ/יַד יְהוָה֙ כִּֽי רַבִּ֣ים רחמ/ו וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: fr
  text: 'Alors David dit à Gad : « Je suis dans une très grande détresse. Tombons, de grâce, entre les mains de Yahweh, car ses compassions sont nombreuses[a] ; mais que je ne tombe pas entre les mains des hommes[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car nombreuses sont ses compassions » ; on peut aussi traduire : « car sa compassion est abondante ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « dans la main de l’homme », c’est-à-dire sous le pouvoir ou l’autorité des êtres humains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Je suis dans une très grande détresse
  rationale: La construction adjectivale avec לִי exprime la détresse personnelle de David. Cette formulation française est naturelle et conserve l’intensité de מְאֹד.
- source_word: נִפְּלָה נָּא
  choice: Tombons, je t’en prie
  rationale: Le cohortatif à la première personne du pluriel associe David au peuple menacé par le jugement. נָא marque une supplication, rendue ici par « je t’en prie ».
- source_word: בְיַד יְהוָה
  choice: entre les mains de Yahweh
  rationale: L’expression désigne le fait d’être livré au pouvoir de quelqu’un. Le pluriel idiomatique français « entre les mains » exprime naturellement cette idée, tandis que le nom divin est conservé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre.
- source_word: כִּי רַבִּים רחמיו
  choice: car sa compassion est immense
  rationale: Le français emploie naturellement le singulier collectif « compassion ». « Immense » communique l’abondance exprimée par רַבִּים sans donner au pluriel hébreu une tournure française artificielle.
- source_word: וּבְיַד אָדָם
  choice: mais… entre les mains des hommes
  rationale: אָדָם désigne ici les êtres humains par contraste avec Yahweh. « Les hommes » conserve ce contraste tout en rendant naturellement l’idiome en français.
- source_word: אַל אֶפֹּלָה
  choice: que je ne tombe pas
  rationale: La négation avec la première personne exprime le souhait pressant de David. Le passage du pluriel « tombons » au singulier « je ne tombe pas » est maintenu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme ; sa transcription préserve le caractère personnel du nom divin.
- issue: Contraste entre la main de Yahweh et celle de l’être humain
  choice: entre les mains des hommes
  alternative: dans la main de l’homme
  rationale: La formulation choisie rend en français actuel l’idée d’être sous le pouvoir humain, sans effacer le contraste théologique entre la compassion divine et le pouvoir des humains.
- issue: Variation entre le pluriel et le singulier dans les verbes
  choice: « Tombons » puis « que je ne tombe pas »
  alternative: uniformiser à la première personne du singulier
  rationale: Le texte hébreu passe réellement de la première personne du pluriel à la première personne du singulier. Cette tension est conservée plutôt que résolue.
translation_notes:
  register: Français international actuel, digne et accessible. L’idiome « entre les mains » privilégie une expression française naturelle, tandis que les notes signalent la forme plus littérale de l’hébreu. Le contraste volontaire entre « tombons » et « que je ne tombe pas » est préservé.
