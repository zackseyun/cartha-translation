source:
  edition: WLC
  text: הַ/כֹּ֗ל נָתַ֛ן אֲרַ֥וְנָה הַ/מֶּ֖לֶךְ לַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל הַ/מֶּ֔לֶךְ יְהוָ֥ה אֱלֹהֶ֖י/ךָ יִרְצֶֽ/ךָס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: fr
  text: 'Arauna, le roi, donna tout cela au roi[a]. Puis Arauna dit au roi : « Que Yahweh, ton Dieu, te soit favorable[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Arauna, le roi ». Certaines traductions omettent ce titre inattendu ou comprennent autrement la construction.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « t’accepte », « t’accueille favorablement » ou « prenne plaisir en toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: tout cela
  rationale: L’expression désigne l’ensemble des biens qu’Arauna vient de proposer pour le sacrifice; « tout cela » renvoie naturellement à l’offre précédente.
- source_word: נָתַן
  choice: donna
  rationale: Dans ce récit, la forme accomplie exprime simplement l’action passée d’offrir ou de donner ces biens à David.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Forme française courante du nom dans le livre de Samuel; la forme « Ornân » du récit parallèle des Chroniques n’est pas importée ici.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le titre apposé à Arauna est conservé, malgré son caractère inattendu, afin de ne pas corriger silencieusement le texte hébreu.
- source_word: לַמֶּלֶךְ
  choice: au roi
  rationale: La préposition ל marque ici le destinataire, David, à qui les biens sont offerts.
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Cette formulation française fait progresser naturellement le récit tout en représentant la coordination narrative hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier indique que la parole s’adresse directement à David.
- source_word: יִרְצֶךָ
  choice: t’accueille favorablement
  rationale: Le verbe רצה exprime ici l’agrément ou l’accueil favorable; cette tournure préserve à la fois la personne comme objet du verbe et la nuance de faveur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel sans lui substituer un titre.
- issue: Titre « le roi » appliqué à Arauna
  choice: Conserver « Arauna, le roi » dans le texte principal
  alternative: Arauna donna tout cela au roi
  rationale: Le texte massorétique porte explicitement l’apposition « Arauna le roi ». Son étrangeté historique ou contextuelle ne justifie pas de la supprimer.
- issue: Portée de יִרְצֶךָ
  choice: Que Yahweh… t’accueille favorablement
  alternative: Qu’il t’accepte; qu’il prenne plaisir en toi; qu’il te soit favorable
  rationale: Le choix conserve l’idée d’acceptation favorable sans préciser au-delà du texte si celle-ci vise surtout David, son offrande ou sa démarche.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient à la narration biblique soutenue sans archaïsme excessif. Le tutoiement reflète l’adresse masculine singulière. La ponctuation met en évidence l’apposition inhabituelle « le roi » sans la résoudre.
