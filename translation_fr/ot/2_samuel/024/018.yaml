source:
  edition: WLC
  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: fr
  text: 'Ce jour-là, Gad vint trouver David et lui dit : « Monte et dresse un autel à Yahvé sur l’aire de battage d’Arauna le Jébusien.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le passage parallèle, ce nom apparaît sous la forme « Ornân » (1 Chroniques 21.18).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint trouver
  rationale: Le qal narratif de בוא signifie « venir ». Avec אֶל־דָּוִד, « vint trouver David » est naturel en français et n’ajoute pas l’idée d’entrer.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend directement la désignation temporelle hébraïque dans un français courant.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה conserve le mouvement ascendant exprimé par l’hébreu.
- source_word: הָקֵם
  choice: dresse
  rationale: Le hiphil de קום signifie ici faire tenir debout, ériger. « Dresser un autel » est idiomatique et plus proche du verbe source que « construire ».
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le ל marque ici la destination ou la consécration de l’autel. « À Yahvé » conserve cette relation et rend explicitement le nom divin.
- source_word: בְּגֹרֶן
  choice: sur l’aire de battage
  rationale: Dans ce contexte spatial, ב désigne l’emplacement où l’autel doit être dressé; « sur » convient naturellement en français.
- source_word: ארניה
  choice: Arauna
  rationale: Cette translittération française représente la forme du nom propre transmise dans Samuel, sans la remplacer par la forme parallèle « Ornân » des Chroniques.
- source_word: הַיְבֻסִי
  choice: le Jébusien
  rationale: Rendu français usuel du gentilé qui précise l’appartenance ethnique d’Arauna.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre de Dieu. « Yahvé » le rend comme tel plutôt que de lui substituer un titre, tout en suivant l’usage français moderne.
- issue: Valeur de ל dans לַיהוָה
  choice: un autel à Yahvé
  alternative: un autel pour Yahvé
  rationale: « À Yahvé » exprime naturellement la consécration ou la destination sans trancher plus précisément la nuance souple de la préposition hébraïque.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. La formulation reste concise et suit l’ordre logique de l’hébreu.
