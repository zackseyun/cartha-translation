base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: fr
  text: David l’appela[a]. Urie mangea et but en sa présence, et David l’enivra. Le soir, Urie sortit pour se coucher sur sa couche, avec les serviteurs de son maître[b], mais il ne descendit pas chez lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « David le fit appeler » ou « David le convoqua ».'
    reason: lexical_alternative
  - marker: b
    text: Son maître est ici David.
    reason: referent_clarification
  - marker: c
    text: 'Littéralement : « il ne descendit pas à sa maison ». Le verbe « descendre » est conservé en raison de sa répétition dans le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: David le fit appeler
  rationale: La construction קרא ל peut exprimer le fait d’appeler ou de faire venir quelqu’un. « Le fit appeler » convient au cadre royal et évite de préciser sans nécessité qu’il s’agissait d’une invitation conviviale.
- source_word: לְפָנָיו
  choice: en sa présence
  rationale: Littéralement « devant lui ». En français actuel, « en sa présence » exprime clairement qu’Urie mange et boit devant David.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: David l’enivra
  rationale: La forme causative indique que David fit en sorte qu’Urie devienne ivre. La répétition du nom clarifie le sujet sans atténuer sa responsabilité.
- source_word: בָעֶרֶב
  choice: Le soir
  rationale: Formulation narrative naturelle qui marque l’étape suivante de la scène.
- source_word: לִשְׁכַּב בְּמִשְׁכָּבוֹ
  choice: pour se coucher à sa place
  rationale: מִשְׁכָּב peut désigner un lit ou un lieu où l’on couche. « À sa place » évite de suggérer qu’Urie possédait là un lit personnel et convient au couchage parmi les serviteurs.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: avec les serviteurs de son maître
  rationale: « Son maître » désigne David du point de vue d’Urie. Cette formulation moderne conserve le rapport hiérarchique du texte.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: mais il ne descendit pas chez lui
  rationale: Le verbe directionnel ירד, important dans le contexte immédiat, est conservé. « Chez lui » rend naturellement בֵּיתוֹ sans effacer l’idée de maison.
