review_pass:
  verdict: revise
  source_fidelity: La chaîne narrative est globalement bien rendue, ainsi que l’idiome sexuel et la valeur rituelle de la proposition participiale. Toutefois, « envoya donc des messagers pour la prendre » transforme la coordination hébraïque (« envoya... et prit ») en but et laisse entendre que David lui-même devait la prendre. La formulation française la plus claire et fidèle au sens contextuel est « envoya des messagers et la fit venir ».
  naturalness: Le français est soutenu, clair et adapté à un récit biblique moderne. « La fit venir » est plus idiomatique et non ambigu que « pour la prendre » dans ce contexte. « Or, elle se purifiait de son impureté » conserve utilement la coloration rituelle et la fonction d’arrière-plan.
  terminology: « Messagers », « coucher avec elle » et « impureté » conviennent. La note existante porte sur un point lexical secondaire, alors que l’ambiguïté textuellement importante signalée par l’audit anglais concerne la portée temporelle de « se purifiait »; l’ancre doit donc être déplacée vers cette proposition.
  issues:
  - severity: medium
    issue: La tournure « envoya donc des messagers pour la prendre » modifie la structure et crée une ambiguïté de sujet.
    rationale: L’hébreu enchaîne deux actions attribuées à David; dans le contexte, il envoie des messagers et fait amener Bethsabée. « Pour la prendre » est une construction finale moins fidèle à cette coordination et peut suggérer que David est l’agent direct de l’action attendue.
  - severity: medium
    issue: La note alternative requise pour la proposition de purification est absente; la note actuelle est ancrée sur « prendre ».
    rationale: Le participe hébreu peut fonctionner comme indication d’arrière-plan (« elle se purifiait ») ou, selon une autre compréhension, comme action déjà accomplie (« elle s’était purifiée »). Cette ambiguïté pertinente doit être conservée par une note ancrée à la proposition concernée.
  revised_text: David envoya des messagers et la fit venir. Elle vint auprès de lui, et il coucha avec elle. Or, elle se purifiait de son impureté[a]. Puis elle retourna chez elle.
  revised_footnotes:
  - marker: a
    text: 'Ou : « elle s’était purifiée de son impureté ». L’hébreu peut être compris comme une remarque d’arrière-plan sur une purification rituelle, vraisemblablement après les règles.'
    reason: alternative_reading
  revision_rationale: La révision rend explicitement, en français naturel, l’effet contextuel de l’envoi des messagers sans attribuer aux messagers un rôle que le texte ne formule pas directement ni ajouter d’évaluation morale. Elle conserve le vocabulaire de pureté rituelle et déplace la note vers l’ambiguïté réelle de la proposition participiale, conformément à l’audit anglais.
