  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: fr
  text: David envoya des messagers et la fit venir. Elle vint auprès de lui, et il coucha avec elle. Or, elle se purifiait de son impureté[a]. Puis elle retourna chez elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle s’était purifiée de son impureté ». L’hébreu peut être compris comme une remarque d’arrière-plan sur une purification rituelle, vraisemblablement après les règles.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד מַלְאָכִים
  choice: David envoya donc des messagers
  rationale: « Messagers » rend directement מַלְאָכִים sans préciser indûment leur fonction. Le passé simple convient au récit soutenu, et « donc » marque naturellement la progression narrative de וַ־.
- source_word: וַיִּקָּחֶהָ
  choice: pour la prendre
  rationale: Le verbe לָקַח signifie fondamentalement « prendre ». La tournure avec « pour » relie naturellement l'envoi des messagers à leur mission, tout en conservant la formulation brève et lourde de sens du texte hébreu.
- source_word: וַתָּבֹוא אֵלָיו
  choice: Elle vint auprès de lui
  rationale: Cette formulation rend le verbe de mouvement et אֵלָיו sans ajouter de nuance sexuelle ou volontaire absente de l'expression elle-même.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: il coucha avec elle
  rationale: « Coucher avec » est l'équivalent français courant et digne de l'idiome hébreu désignant une relation sexuelle.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: Or, elle se purifiait de son impureté
  rationale: Le participe hitpael exprime ici une purification rituelle en cours ou donnée comme arrière-plan. « Impureté » conserve la catégorie cultuelle de טֻמְאָה, tandis que « Or » signale la valeur incidente de la proposition.
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: Puis elle retourna chez elle
  rationale: « Retourna chez elle » est l'expression française naturelle pour le retour à sa propre maison; « puis » rend clairement la reprise de la séquence narrative.
theological_decisions:
- issue: Valeur et fonction de la proposition relative à la pureté rituelle
  choice: 'La rendre comme une remarque d''arrière-plan au moyen de l''imparfait : « Or, elle se purifiait de son impureté. »'
  alternative: « Elle s'était purifiée de son impureté. »
  rationale: La construction participiale hébraïque se prête naturellement à une information circonstancielle ou d'arrière-plan, mais une lecture indiquant une purification déjà accomplie reste possible. Le vocabulaire doit demeurer rituel, sans transformer la proposition en jugement moral ni trancher la question de la responsabilité des personnages.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre littéraire accessible du récit biblique; l'imparfait distingue la remarque circonstancielle de la chaîne principale des actions. La formulation reste sobre et ne précise ni consentement ni contrainte au-delà de ce que dit explicitement l'hébreu.
