revisions:
- from: David envoya donc des messagers pour la prendre[a]. Elle vint auprès de lui, et il coucha avec elle. Or, elle se purifiait de son impureté. Puis elle retourna chez elle.
  to: David envoya des messagers et la fit venir. Elle vint auprès de lui, et il coucha avec elle. Or, elle se purifiait de son impureté[a]. Puis elle retourna chez elle.
  rationale: La révision rend explicitement, en français naturel, l’effet contextuel de l’envoi des messagers sans attribuer aux messagers un rôle que le texte ne formule pas directement ni ajouter d’évaluation morale. Elle conserve le vocabulaire de pureté rituelle et déplace la note vers l’ambiguïté réelle de la proposition participiale, conformément à l’audit anglais.
