  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: fr
  text: Le messager partit, arriva auprès de David et lui rapporta tout ce que Joab l’avait envoyé lui communiquer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tout ce que Joab l’avait envoyé [faire] ». Le verbe « envoyer » est employé de façon elliptique; dans le contexte, il désigne ce que Joab avait chargé le messager de communiquer à David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce contexte humain et militaire, מַלְאָךְ désigne celui qui transmet un message, et non un être céleste.
- source_word: וַיֵּלֶךְ וַיָּבֹא
  choice: partit, arriva auprès de David
  rationale: 'Les deux verbes successifs font avancer le récit : le messager se met en route puis atteint sa destination. « Arriva auprès de David » est naturel en français et évite la lourdeur de « alla et vint ».'
- source_word: וַיַּגֵּד לְדָוִד
  choice: lui rapporta
  rationale: Le hiphil de נגד signifie ici communiquer ou rapporter une information. « Lui rapporta » convient au contexte d’un compte rendu militaire.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure française exprime naturellement la totalité du contenu transmis.
- source_word: שְׁלָחוֹ יוֹאָב
  choice: Joab l’avait chargé de lui dire
  rationale: L’hébreu dit littéralement « Joab l’avait envoyé », mais le contexte implique l’envoi avec un message à communiquer. L’explicitation donne en français une phrase complète sans changer le sens contextuel.
- source_word: לְדָוִד
  choice: David
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
