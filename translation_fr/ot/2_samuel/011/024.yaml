  text: ו/יראו ה/מוראים אֶל עֲבָדֶ֨/ךָ֙ מֵ/עַ֣ל הַ/חוֹמָ֔ה וַ/יָּמ֖וּתוּ מֵ/עַבְדֵ֣י הַ/מֶּ֑לֶךְ וְ/גַ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: fr
  text: Les archers ont tiré sur tes serviteurs du haut de la muraille, et certains des serviteurs du roi sont morts. Ton serviteur Urie le Hittite est mort lui aussi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire la fin par « a péri ». L’hébreu emploie une forme qui peut décrire Urie comme étant mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: Les archers ont tiré
  rationale: Le verbe ירה désigne ici l’action de tirer, et le participe הַמּוֹרִים les tireurs; «les archers» exprime naturellement le sens militaire en français.
- source_word: אֶל עֲבָדֶיךָ
  choice: sur tes serviteurs
  rationale: Après «tirer», אֶל se rend idiomatiquement par «sur». «Tes serviteurs» conserve le langage déférent de la cour royale.
- source_word: מֵעַל הַחוֹמָה
  choice: du haut de la muraille
  rationale: Cette formulation française naturelle indique que les archers tiraient depuis une position située sur la partie haute de la muraille.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: et certains des serviteurs du roi sont morts
  rationale: 'La préposition מִן a ici une valeur partitive: seule une partie des serviteurs du roi a péri.'
- source_word: וְגַם
  choice: lui aussi
  rationale: Cette tournure restitue la valeur additive et met en relief la mort d’Urie comme point culminant du rapport.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: Ton serviteur Urie le Hittite
  rationale: «Ton serviteur» maintient la formule déférente; «Urie» et «le Hittite» sont les formes françaises usuelles.
- source_word: מֵת
  choice: est mort
  rationale: La forme hébraïque décrit l’état résultant de la mort; «est mort» est à la fois naturel en français et plus proche de cette nuance que «a péri».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement conserve l’adresse directe au roi propre au discours hébreu, tandis que «serviteurs» maintient le registre de cour et le rapport hiérarchique.
