  yaml_path: translation/ot/2_samuel/011/019.yaml
  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: fr
  text: 'Il ordonna au messager : « Quand tu auras fini de rapporter au roi toutes les nouvelles de la bataille,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Il donna cet ordre
  rationale: Le verbe צוה exprime ici un ordre ou des instructions faisant autorité. Cette tournure est naturelle en français narratif et conserve cette force.
- source_word: הַמַּלְאָךְ
  choice: au messager
  rationale: Dans ce contexte militaire, מַלְאָךְ désigne clairement un messager humain chargé de transmettre un compte rendu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement le discours direct et rendent la fonction narrative de לֵאמֹר sans le calque pesant « en disant ».
- source_word: כְּכַלּוֹתְךָ
  choice: Quand tu auras fini
  rationale: La préposition כ avec l’infinitif construit et le suffixe introduit une proposition temporelle; le futur antérieur convient à la succession des actions en français.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: tout ce qui s’est passé pendant la bataille
  rationale: Littéralement, l’expression évoque toutes les paroles, choses ou affaires de la bataille. Dans ce contexte de rapport militaire, cette formulation française naturelle désigne l’ensemble des événements à communiquer sans employer le calque obscur « toutes les paroles ».
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: de rapporter au roi
  rationale: L’infinitif « parler » avec אֶל désigne ici la transmission au roi du compte rendu de la bataille; « rapporter » exprime clairement cette fonction en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste ouverte, comme dans le verset hébreu, puisque l’ordre se poursuit au verset suivant.
