  register: Français international moderne, clair et digne. Le récit conserve le ton direct d’un rapport militaire. « En rase campagne » exprime idiomatiquement la sortie hors de la ville vers le terrain découvert, tandis que les notes préservent les ambiguïtés lexicales réelles.
