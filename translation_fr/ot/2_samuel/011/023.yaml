  text: וַ/יֹּ֤אמֶר הַ/מַּלְאָךְ֙ אֶל דָּוִ֔ד כִּֽי גָבְר֤וּ עָלֵ֨י/נוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּצְא֥וּ אֵלֵ֖י/נוּ הַ/שָּׂדֶ֑ה וַ/נִּהְיֶ֥ה עֲלֵי/הֶ֖ם עַד פֶּ֥תַח הַ/שָּֽׁעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: fr
  text: 'Le messager dit à David : « Les hommes étaient plus forts que nous[a] et sont sortis contre nous en rase campagne ; mais nous les avons repoussés[b] jusqu’à l’entrée de la porte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ont emporté sur nous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nous avons été sur eux » ; dans ce contexte militaire, l’expression peut désigner une contre-offensive ou le fait de repousser l’ennemi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce récit militaire, le terme désigne un courrier humain envoyé pour faire son rapport, et non un être angélique.
- source_word: כִּי
  choice: introduit directement le contenu du discours
  rationale: Après « dit à David », le français naturel n’exige pas de conjonction supplémentaire ; la proposition qui suit donne le contenu du rapport.
- source_word: גָבְרוּ עָלֵינוּ
  choice: étaient plus forts que nous
  rationale: Cette formulation rend la valeur comparative de גבר avec עַל tout en restant naturelle dans un rapport de bataille. La possibilité « l’ont emporté sur nous » est signalée en note.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le substantif hébreu signifie simplement « les hommes ». Le contexte indique qu’il s’agit des combattants ennemis, sans qu’il soit nécessaire d’ajouter « soldats ».
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: sont sortis contre nous en rase campagne
  rationale: La traduction exprime le mouvement des défenseurs hors de la ville, la valeur hostile de אֵלֵינוּ et le lieu ouvert où l’affrontement s’est déroulé.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: nous les avons repoussés
  rationale: Littéralement, « nous avons été sur/contre eux » ; dans ce contexte militaire et avant la limite spatiale qui suit, l’expression décrit une contre-offensive qui refoule l’ennemi.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: jusqu’à l’entrée de la porte
  rationale: La formulation conserve les deux éléments du texte hébreu, « entrée/ouverture » et « porte », et marque clairement le terme de la poursuite.
theological_decisions: []
