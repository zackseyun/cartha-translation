  text: וַ/יְהִ֣י לְ/עֵ֣ת הָ/עֶ֗רֶב וַ/יָּ֨קָם דָּוִ֜ד מֵ/עַ֤ל מִשְׁכָּב/וֹ֙ וַ/יִּתְהַלֵּךְ֙ עַל גַּ֣ג בֵּית הַ/מֶּ֔לֶךְ וַ/יַּ֥רְא אִשָּׁ֛ה רֹחֶ֖צֶת מֵ/עַ֣ל הַ/גָּ֑ג וְ/הָ֣/אִשָּׁ֔ה טוֹבַ֥ת מַרְאֶ֖ה מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: fr
  text: Vers le soir[a], David se leva de son lit et se promena sur le toit de la maison du roi[b]. Depuis le toit, il vit une femme qui se baignait. Cette femme était très belle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Il arriva, au temps du soir » ou « Et il arriva, au temps du soir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la maison du roi »; on pourrait aussi traduire par « le palais royal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: Vers le soir
  rationale: La formule hébraïque introduit une nouvelle scène dans la suite du récit et en précise le moment. « Vers le soir » est naturel en français moderne tout en conservant la valeur temporelle; la tournure plus formelle et littérale est signalée en note.
- source_word: וַיָּקָם דָּוִד מֵעַל מִשְׁכָּבוֹ
  choice: David se leva de son lit
  rationale: קום désigne ici le fait de se lever, et מִשְׁכָּב le lieu où l’on est couché. « Lit » convient au contexte et reste plus naturel que « couche ».
- source_word: וַיִּתְהַלֵּךְ
  choice: se promena
  rationale: La forme hitpael peut évoquer un déplacement prolongé ou répété. « Se promena » rend ce mouvement sans imposer une nuance de loisir aussi marquée que « flâna ».
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: sur le toit de la maison du roi
  rationale: Cette formulation suit de près l’hébreu « maison du roi ». Le mot « palais » serait idiomatique dans le contexte, mais il explicite davantage que le texte source.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: il vit une femme qui se baignait
  rationale: Le participe רֹחֶצֶת présente l’action comme en cours. « Qui se baignait » est une formulation française claire et naturelle, sans préciser indûment la manière dont elle se lavait.
- source_word: מֵעַל הַגָּג
  choice: Depuis le toit
  rationale: La locution indique naturellement le point d’observation de David. Placée en tête de phrase, elle conserve le détail spatial sans laisser entendre que la femme se trouvait nécessairement sur un toit.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: très belle
  rationale: L’expression signifie littéralement qu’elle était très agréable ou belle d’apparence. En français, « très belle » rend naturellement cette appréciation visuelle sans la lourdeur de « très belle d’apparence ».
theological_decisions:
- issue: Emplacement de la femme au moment où elle se baignait
  choice: Ne pas préciser où elle se trouvait; rattacher « depuis le toit » au regard de David.
  alternative: Comprendre que la femme se baignait sur un toit.
  rationale: La syntaxe place מֵעַל הַגָּג après « une femme qui se baignait », mais le contexte immédiat présente déjà David sur le toit et permet naturellement d’y voir son point d’observation. Le français retenu évite d’ajouter au récit un emplacement non explicitement attribué à la femme.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont volontairement simples et fluides. « Maison du roi » conserve l’image hébraïque, tandis que « se promena » exprime la durée suggérée par la forme verbale sans registre archaïque.
