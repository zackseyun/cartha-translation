base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: fr
  text: Quand Urie arriva auprès de lui, David demanda comment allaient Joab et les troupes[a], et comment se déroulait la guerre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le peuple » ; dans ce contexte, il s’agit des troupes.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète la même expression pour Joab, les troupes et la guerre : littéralement, « David demanda au sujet du bien-être de Joab, du bien-être des troupes et du bien-être de la guerre ».'
    reason: source_idiom
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Dans ce contexte narratif, « arriva » exprime naturellement le déplacement d’Urie jusqu’auprès de David.
- source_word: אֵלָיו
  choice: auprès de lui
  rationale: La préposition אֶל marque ici le mouvement vers David. « Auprès de lui » est naturel en français et garde David comme référent du pronom.
- source_word: וַיִּשְׁאַל
  choice: demanda
  rationale: Le verbe שׁאל introduit les questions de David sur la situation au front. « Demanda » est courant, clair et digne.
- source_word: לִשְׁלוֹם
  choice: comment allaient / comment se déroulait
  rationale: Dans cette construction, שָׁלוֹם désigne l’état ou la bonne marche de ce dont on prend des nouvelles. La formulation idiomatique française varie selon qu’il s’agit de personnes ou de la guerre, tandis qu’une note conserve le parallélisme hébreu.
- source_word: יוֹאָב
  choice: Joab
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre.
- source_word: הָעָם
  choice: les troupes
  rationale: Le sens premier est « le peuple », mais le contexte militaire désigne les hommes engagés dans la campagne sous les ordres de Joab.
- source_word: הַמִּלְחָמָה
  choice: la guerre
  rationale: מִלְחָמָה peut désigner une bataille ou la guerre. Ici, « la guerre » convient à la campagne militaire en cours sans la réduire à un seul affrontement.
