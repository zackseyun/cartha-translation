source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/א֣וּרִיָּ֔ה רֵ֥ד לְ/בֵיתְ/ךָ֖ וּ/רְחַ֣ץ רַגְלֶ֑י/ךָ וַ/יֵּצֵ֤א אֽוּרִיָּה֙ מִ/בֵּ֣ית הַ/מֶּ֔לֶךְ וַ/תֵּצֵ֥א אַחֲרָ֖י/ו מַשְׂאַ֥ת הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: fr
  text: 'David dit à Urie : « Descends chez toi et lave-toi les pieds[a]. » Urie sortit de la maison du roi, et un présent du roi[b] fut envoyé à sa suite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Lave-toi les pieds » peut aussi évoquer le fait de se délasser ou de s’installer chez soi après un déplacement.
    reason: cultural_note
  - marker: b
    text: Ou « une portion du roi ». Le terme hébreu peut désigner quelque chose que l’on porte ou que l’on envoie, notamment une portion ou un présent.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: Descends
  rationale: L’impératif de ירד exprime littéralement un mouvement vers le bas, probablement du palais vers la maison d’Urie. « Descends » conserve cette nuance directionnelle sans l’expliquer davantage.
- source_word: לְבֵיתְךָ
  choice: chez toi
  rationale: Le nom בַּיִת signifie « maison », mais, après un verbe de mouvement, « chez toi » est l’expression française naturelle pour désigner le domicile du destinataire.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: et lave-toi les pieds
  rationale: Cette traduction conserve l’image concrète de l’hébreu. Dans le contexte, l’expression peut évoquer le délassement et l’installation chez soi, possibilité signalée en note plutôt qu’intégrée à la traduction.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: de la maison du roi
  rationale: La formulation suit directement l’hébreu. « Du palais » serait idiomatique et contextuellement plausible, mais préciserait davantage la nature du bâtiment.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: un présent du roi
  rationale: מַשְׂאֵת peut désigner ce qui est porté ou envoyé, notamment un présent ou une portion. « Présent » convient naturellement à l’objet envoyé par le roi, tandis que l’autre sens est conservé en note.
- source_word: אַחֲרָיו
  choice: à sa suite
  rationale: L’expression indique que l’envoi suit Urie. « À sa suite » restitue ce rapport de manière naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La traduction garde l’expression concrète « lave-toi les pieds » et la formulation « maison du roi », tout en employant « chez toi » pour un français idiomatique. La tournure passive « fut envoyé » évite de personnifier maladroitement le présent tout en rendant explicite le mouvement exprimé par le verbe hébreu.
