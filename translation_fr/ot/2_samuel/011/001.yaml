  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: fr
  text: Au tournant de l’année[a], à l’époque où les messagers partent[b], David envoya Joab, ses serviteurs avec lui, et tout Israël. Ils ravagèrent les Ammonites et assiégèrent Rabba. Mais David resta à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « au retour de l’année » ; l’expression désigne probablement le printemps, saison habituelle des campagnes militaires.
    reason: Note culturelle et précision de l’idiome hébreu.
  - marker: b
    text: On peut aussi lire « à l’époque où les rois partent en campagne », lecture favorisée par le contexte militaire et par le passage parallèle de 1 Chroniques 20.1. Le texte hébreu fourni porte « messagers ».
    reason: Variante textuelle et interprétative significative.
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: Au tournant de l’année
  rationale: L’expression évoque littéralement le retour ou le tournant de l’année. Cette formulation conserve l’image temporelle de l’hébreu sans remplacer directement celle-ci par son interprétation probable, le printemps.
- source_word: לְעֵת צֵאת הַמַּלְאכִים
  choice: à l’époque où les messagers partent
  rationale: Le texte massorétique fourni porte מַלְאָכִים, « messagers ». La traduction suit donc en priorité cette forme attestée, tandis que la variante « rois », favorisée par le contexte militaire et le parallèle de 1 Chroniques 20.1, est signalée en note.
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Équivalent narratif courant et précis de שׁלח.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme désigne largement des personnes au service du roi; « serviteurs » préserve cette étendue sans les identifier exclusivement à des officiers ou à des soldats.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: La formulation collective de l’hébreu est conservée; dans ce contexte, elle vise vraisemblablement les forces combattantes d’Israël.
- source_word: וַיַּשְׁחִתוּ
  choice: ravagèrent
  rationale: Le hiphil de שׁחת exprime ici une action destructrice. « Ravagèrent » convient au contexte militaire sans suggérer nécessairement un anéantissement total.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Gentilé français naturel correspondant à l’expression hébraïque « fils d’Ammon ».
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: assiégèrent Rabba
  rationale: Rend directement et naturellement l’action de mettre la ville en état de siège.
- source_word: יוֹשֵׁב
  choice: resta
  rationale: Le participe signifie littéralement « demeurant/assis ». Dans le contraste narratif, « resta » exprime naturellement que David ne partit pas avec l’armée.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Forme française usuelle du nom de lieu.
theological_decisions:
- issue: Lecture de לְעֵת צֵאת הַמַּלְאכִים
  choice: à l’époque où les messagers partent
  alternative: à l’époque où les rois partent en campagne
  rationale: Le texte hébreu fourni comporte la forme « messagers ». La lecture « rois » est cependant bien attestée comme correction ou variante, soutenue par le contexte guerrier et par 1 Chroniques 20.1. Le texte principal respecte le témoin source, et la note conserve l’autre lecture ainsi que la tension narrative qu’elle produit.
translation_notes:
  register: Français international moderne, sobre et narratif. « Au tournant de l’année » garde l’image hébraïque tout en restant intelligible; les verbes au passé simple donnent au récit une dignité littéraire naturelle. La coordination « Joab, avec ses serviteurs, et tout Israël » conserve les groupes nommés dans l’hébreu sans expliciter au-delà du texte.
