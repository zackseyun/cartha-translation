base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/006.yaml
  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: fr
  text: 'David envoya dire à Joab : « Envoie-moi Urie le Hittite. » Et Joab envoya Urie à David.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: David fit donc dire à Joab
  rationale: Le verbe שׁלח signifie littéralement « envoyer ». Comme aucun objet n’est exprimé et que l’ordre suit immédiatement, « fit dire » rend naturellement en français l’envoi d’un message, sans supposer la présence d’un messager déterminé.
- source_word: שְׁלַח אֵלַי
  choice: Envoie-moi
  rationale: L’impératif שְׁלַח suivi de אֵלַי exprime directement l’ordre d’envoyer Urie auprès de David. « Envoie-moi » est idiomatique et n’ajoute pas l’idée d’un retour absente de l’hébreu.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: Urie le Hittite
  rationale: « Urie » est la forme française traditionnelle et actuelle du nom; « le Hittite » rend le gentilé חִתִּי. Le marqueur d’objet direct אֶת n’est pas traduit.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: Et Joab envoya Urie à David
  rationale: La reprise du verbe « envoyer » conserve la répétition du texte hébreu et « Et » maintient l’enchaînement narratif marqué par le waw consécutif.
