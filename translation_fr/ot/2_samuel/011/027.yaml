    issue: « l’accueillit chez lui » pour וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
    rationale: « Accueillir » peut suggérer une hospitalité ou une réception bienveillante et ne rend pas explicitement le mouvement vers la maison de David. « La fit entrer dans sa maison » préserve mieux l’action et évite cette nuance ajoutée.
  - severity: low
    issue: Position de l’ancre de note
    rationale: La note explique l’expression évaluative « était mal aux yeux de Yahweh », non le nom « Yahweh » isolément. L’ancre est donc placée après « mal ».
