revisions:
- from: Quand la période de deuil fut terminée, David la fit chercher et l’accueillit chez lui. Elle devint sa femme et lui donna un fils. Mais ce que David avait fait était mal aux yeux de Yahweh[a].
  to: Quand la période de deuil fut terminée, David envoya la chercher et la fit entrer dans sa maison. Elle devint sa femme et mit au monde un fils. Mais ce que David avait fait était mal[a] aux yeux de Yahweh.
  rationale: La révision remplace une formulation qui introduisait la nuance d’« accueil » par une formulation française naturelle qui rend plus directement l’envoi de David et l’entrée de la femme dans sa maison. « Mit au monde un fils » exprime explicitement la naissance sans changer le sens. La note est conservée, avec une ancre rattachée à l’expression qu’elle commente.
