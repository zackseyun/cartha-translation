  text: וַ/יַּעֲבֹ֣ר הָ/אֵ֗בֶל וַ/יִּשְׁלַ֨ח דָּוִ֜ד וַ/יַּאַסְפָ֤/הּ אֶל בֵּית/וֹ֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ בֵּ֑ן וַ/יֵּ֧רַע הַ/דָּבָ֛ר אֲשֶׁר עָשָׂ֥ה דָוִ֖ד בְּ/עֵינֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: fr
  text: Quand la période de deuil fut terminée, David envoya la chercher et la fit entrer dans sa maison. Elle devint sa femme et mit au monde un fils. Mais ce que David avait fait était mal[a] aux yeux de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « déplut à Yahweh ». Littéralement : « était mal aux yeux de Yahweh » ; cette expression énonce le jugement moral de Dieu sur l’acte de David.'
    reason: Préciser l’expression hébraïque et signaler une traduction idiomatique possible sans en atténuer la portée morale.
lexical_decisions:
- source_word: וַיַּעֲבֹר הָאֵבֶל
  choice: Quand la période de deuil fut terminée
  rationale: Le verbe signifie littéralement « passer », mais avec le deuil comme sujet, cette formulation française exprime naturellement la fin de la période rituelle de deuil.
- source_word: וַיִּשְׁלַח דָּוִד וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: David la fit chercher et l’accueillit chez lui
  rationale: La formulation rend la succession « David envoya » puis « la recueillit/la fit entrer dans sa maison » sans employer le calque peu naturel « la rassembla ». « L’accueillit chez lui » exprime ici son intégration à la maison de David, précisée aussitôt par le mariage.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: Elle devint sa femme
  rationale: La construction hébraïque marque un changement de statut et le résultat matrimonial.
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: lui donna un fils
  rationale: Expression française courante pour la naissance d’un fils, qui conserve la relation indiquée par le complément hébreu לוֹ.
- source_word: וַיֵּרַע הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: ce que David avait fait était mal
  rationale: Cette traduction conserve la force morale de רָעַע et ne réduit pas le jugement à un simple mécontentement divin.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La métaphore hébraïque de l’évaluation est naturelle en français et le nom divin est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Force du jugement moral porté sur l’acte de David
  choice: était mal aux yeux de Yahweh
  alternative: déplut à Yahweh
  rationale: Le texte formule un jugement moral explicite. « Déplut » est possible comme équivalent idiomatique, mais peut paraître plus subjectif et affaiblir la condamnation.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. Le verset reste concis, conserve l’enchaînement des actions et fait ressortir le contraste introduit par « Mais » entre la nouvelle situation domestique de David et le jugement de Yahweh.
