  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: fr
  text: 'Et si la colère du roi monte et qu’il te dise : « Pourquoi vous êtes-vous approchés de la ville pour combattre ? Ne saviez-vous pas ce qu’on lancerait du haut de la muraille[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qu’on tirerait depuis la muraille ». Le verbe hébreu peut désigner le tir ou, plus largement, le lancement de projectiles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Et si
  rationale: La tournure introduit une éventualité dans les instructions de Joab tout en maintenant le lien avec le récit.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: la colère du roi monte
  rationale: Cette formulation conserve l’image de la colère qui monte, portée par עלה, dans un français naturel.
- source_word: וְאָמַר לְךָ
  choice: et qu’il te dise
  rationale: Le subjonctif s’intègre naturellement à la condition projetée introduite par « si ».
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: vous êtes-vous approchés de la ville
  rationale: Le verbe נגשׁ exprime l’action de s’approcher; la formulation conserve le reproche sans ajouter explicitement une proximité excessive.
- source_word: לְהִלָּחֵם
  choice: pour combattre
  rationale: L’infinitif indique ici le but de l’approche et se rend clairement par « pour combattre ».
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Ne saviez-vous pas
  rationale: La question négative garde sa force rhétorique et appelle implicitement une réponse affirmative.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: ce qu’on lancerait
  rationale: ירה peut désigner le fait de tirer ou, plus largement, de lancer des projectiles. « Lancer » préserve cette amplitude lexicale, importante dans le contexte immédiat.
- source_word: מֵעַל הַחוֹמָה
  choice: du haut de la muraille
  rationale: Cette expression rend explicitement מֵעַל, « depuis le dessus », et « muraille » convient à l’ouvrage défensif d’une ville.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le discours direct conserve le ton de reproche anticipé. Le pronom indéfini « on » rend le sujet non exprimé du verbe hébreu sans préciser inutilement l’identité des défenseurs.
