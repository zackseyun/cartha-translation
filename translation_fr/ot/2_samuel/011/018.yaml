  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: fr
  text: Joab envoya alors un messager faire rapport à David de tout ce qui concernait la bataille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toutes les paroles de la bataille ». Cette expression peut désigner tout ce qui concernait la bataille, c’est-à-dire le rapport complet des événements.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya alors un messager
  rationale: Le verbe signifie littéralement « envoya ». Son complément est sous-entendu ici, mais le verset suivant précise qu’il s’agit du messager chargé de transmettre le rapport. L’explicitation donne en français une phrase naturelle sans changer le référent contextuel.
- source_word: יוֹאָב
  choice: Joab
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַיַּגֵּד לְדָוִד
  choice: informer David
  rationale: Le hiphil de נגד exprime l’action d’annoncer, de raconter ou de faire un rapport. Avec l’envoi d’un messager, « informer David » rend naturellement la relation entre les deux verbes.
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: de tous les détails de la bataille
  rationale: Littéralement, l’expression dit « toutes les paroles/choses de la bataille ». Dans ce récit, דִּבְרֵי désigne l’ensemble des faits à rapporter; « tous les détails » en restitue clairement le sens tout en conservant l’idée d’un compte rendu complet.
- source_word: הַמִּלְחָמָה
  choice: la bataille
  rationale: מִלְחָמָה peut désigner la guerre ou le combat, mais le contexte immédiat concerne une opération militaire précise; « bataille » convient donc mieux ici.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite le calque peu naturel « les paroles de la bataille »; elle explicite le messager, identifié dès le verset suivant, et conserve par la note l’image et l’étendue sémantique de l’hébreu.
