  text: וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר לֹֽא יָרַ֥ד אוּרִיָּ֖ה אֶל בֵּית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה הֲ/ל֤וֹא מִ/דֶּ֨רֶךְ֙ אַתָּ֣ה בָ֔א מַדּ֖וּעַ לֹֽא יָרַ֥דְתָּ אֶל בֵּיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: fr
  text: 'On informa David[a] : « Urie n’est pas descendu chez lui. » Alors David dit à Urie : « N’arrives-tu pas d’un voyage[b] ? Pourquoi n’es-tu pas descendu chez toi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un verbe au pluriel sans préciser qui transmit l’information.
    reason: textual_clarity
  - marker: b
    text: 'Littéralement : « du chemin » ou « de la route »; l’expression désigne le fait de revenir d’un déplacement ou d’un voyage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: 'On informa David :'
  rationale: Le pluriel hébreu indéfini se rend naturellement en français par « on ». Le verbe נגד au hiphil signifie informer, annoncer ou rapporter; les deux-points rendent sans lourdeur la fonction introductive de לֵאמֹר.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: Urie n’est pas descendu chez lui
  rationale: « Descendre » conserve le sens concret de ירד et sa répétition dans le verset. « Chez lui » exprime naturellement en français le mouvement vers sa propre maison.
- source_word: וַיֹּאמֶר דָּוִד
  choice: Alors David dit
  rationale: « Alors » marque sobrement la progression et la conséquence narratives portées par le waw consécutif.
- source_word: הֲלוֹא
  choice: N’arrives-tu pas
  rationale: La question négative attend une réponse affirmative. Cette formulation française en conserve la force rhétorique sans ajouter d’insistance étrangère au texte.
- source_word: מִדֶּרֶךְ אַתָּה בָא
  choice: arrives-tu pas d’un voyage
  rationale: דֶּרֶךְ désigne littéralement le chemin ou la route, mais l’expression évoque ici le fait d’avoir voyagé. « Arriver d’un voyage » est actuel et naturel, tout en gardant l’ambiguïté sur la nature précise du déplacement.
- source_word: מַדּוּעַ לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: Pourquoi n’es-tu pas descendu chez toi ?
  rationale: La formulation conserve la répétition de ירד et la correspondance entre « chez lui » et « chez toi », importante pour le mouvement du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le texte conserve « descendre chez lui/chez toi » afin de respecter l’image spatiale et la répétition hébraïques, tout en employant « chez lui » plutôt que le calque moins naturel « vers sa maison ».
