  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה שֵׁ֥ב בָּ/זֶ֛ה גַּם הַ/יּ֖וֹם וּ/מָחָ֣ר אֲשַׁלְּחֶ֑/ךָּ וַ/יֵּ֨שֶׁב אוּרִיָּ֧ה בִ/ירוּשָׁלִַ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא וּ/מִֽ/מָּחֳרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: fr
  text: 'David dit alors à Urie : « Reste ici encore aujourd’hui, et demain je t’enverrai. » Urie resta donc à Jérusalem ce jour-là et le lendemain.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait avancer le récit ; « alors » exprime naturellement cette succession en français.
- source_word: שֵׁב בָּזֶה
  choice: Reste ici
  rationale: Dans ce contexte, ישׁב désigne le fait de demeurer temporairement sur place, et בָּזֶה a le sens idiomatique de « ici ».
- source_word: גַּם הַיּוֹם
  choice: encore aujourd’hui
  rationale: גַּם ajoute l’idée que le séjour doit se prolonger pendant cette journée aussi ; « encore aujourd’hui » est naturel et précis en français.
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: et demain je te laisserai repartir
  rationale: שׁלח signifie envoyer ou laisser partir. Ici, David promet à Urie son départ de Jérusalem ; « laisser repartir » rend clairement ce sens contextuel sans suggérer un renvoi disciplinaire.
- source_word: וַיֵּשֶׁב
  choice: resta donc
  rationale: Le verbe reprend ישׁב de l’ordre précédent. « donc » marque naturellement que le séjour d’Urie résulte de la parole de David.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: En français, la préposition usuelle devant le nom de cette ville est « à ».
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: ce jour-là et le lendemain
  rationale: L’expression désigne le jour en question ainsi que le jour suivant. Cette formulation est claire, moderne et fidèle à la coordination hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « reste/resta » conserve le lien lexical de l’hébreu, tandis que « laisserai repartir » exprime idiomatiquement le départ promis à Urie.
