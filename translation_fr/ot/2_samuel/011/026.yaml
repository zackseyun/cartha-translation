  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: fr
  text: Quand la femme d’Urie apprit qu’Urie, son mari, était mort[a], elle pleura son mari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’Urie, son mari, était décédé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: apprit
  rationale: Dans ce récit, שׁמע désigne le fait de recevoir une nouvelle. « Apprit » est plus naturel en français que « entendit » sans complément indiquant la source, tout en conservant le sens.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: la femme d’Urie
  rationale: Le groupe construit est rendu naturellement en français et maintient la désignation relationnelle du texte hébreu.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de la nouvelle apprise.
- source_word: מֵת
  choice: était mort
  rationale: La forme exprime l’état de mort d’Urie. « Était mort » convient naturellement après « apprit que »; « était décédé » reste une possibilité de registre plus soutenu.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: son mari Urie
  rationale: Cette formulation conserve le nom et l’identification explicite d’Urie comme son mari, dans un ordre idiomatique en français moderne.
- source_word: וַתִּסְפֹּד
  choice: elle porta le deuil
  rationale: ספד désigne les manifestations de deuil ou la lamentation pour un mort. « Porter le deuil » exprime clairement l’acte de deuil dans un registre digne et courant.
- source_word: עַל
  choice: de
  rationale: Avec « porter le deuil », le français idiomatique emploie « de » pour rendre la relation exprimée par עַל.
- source_word: בַּעְלָהּ
  choice: son mari
  rationale: Dans ce contexte conjugal, בַּעַל signifie simplement « mari »; les sens « maître » ou « propriétaire » ne conviennent pas ici.
