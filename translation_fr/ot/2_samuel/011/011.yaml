  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: fr
  text: 'Urie dit à David : « L’arche, Israël et Juda séjournent sous des abris provisoires[a] ; mon seigneur Joab et les serviteurs de mon seigneur campent en rase campagne. Et moi, j’irais chez moi pour manger, boire et coucher avec ma femme[b] ? Par ta vie et par la vie de ton âme[c], je ne ferai pas une chose pareille ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous des huttes » ou « sous des abris temporaires » ; le mot désigne des installations provisoires.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « Devrais-je donc aller chez moi… ? » La question rhétorique exprime le refus indigné d’Urie.'
    reason: alternative_reading
  - marker: c
    text: 'Formule de serment hébraïque, littéralement : « Par ta vie et par la vie de ton âme, si je fais cette chose… » Dans ce type de serment, la proposition introduite par « si » équivaut à une forte négation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: l’arche
  rationale: L’hébreu porte simplement le nom défini « l’arche ». Cette formulation conserve cette sobriété sans ajouter « de Dieu » ou « de l’alliance », absents du verset.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: séjournent sous des abris provisoires
  rationale: סֻכּוֹת désigne ici des huttes ou abris temporaires. « Séjournent sous des abris provisoires » exprime naturellement leur caractère temporaire dans le contexte militaire.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’un titre humain de respect appliqué à Joab, et non du nom divin.
- source_word: עַל פְּנֵי הַשָּׂדֶה חֹנִים
  choice: campent en rase campagne
  rationale: L’expression décrit un campement exposé dans la campagne. « En rase campagne » rend l’idée idiomatiquement sans reproduire le calque « sur la face du champ ».
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: Et moi, j’irais chez moi
  rationale: Le conditionnel interrogatif français restitue la protestation rhétorique d’Urie et le contraste fortement marqué par וַאֲנִי.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: pour manger, boire et coucher avec ma femme
  rationale: « Coucher avec » conserve clairement et dignement l’euphémisme sexuel du texte, tandis que la série coordonnée reste naturelle en français.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: Par ta vie et par la vie de ton âme
  rationale: Cette formulation garde les deux membres de la formule solennelle et maintient נֶפֶשׁ comme « âme », sans réduire silencieusement le redoublement.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: je ne ferai pas une chose pareille
  rationale: Après une formule de serment, אִם introduit une imprécation elliptique et exprime ainsi un refus énergique. Une traduction littérale par « si je fais » serait incomplète et trompeuse en français.
