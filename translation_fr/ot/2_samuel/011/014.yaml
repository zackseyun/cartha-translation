  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: fr
  text: Le matin, David écrivit une lettre à Joab et l’envoya par Urie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Le matin
  rationale: La formule narrative introduit l’événement suivant et situe celui-ci dans le temps. En français courant, « Le matin » rend naturellement l’enchaînement sans alourdir le récit par « il arriva que ».
- source_word: וַיִּכְתֹּב
  choice: écrivit
  rationale: Équivalent narratif direct et usuel du verbe hébreu signifiant écrire.
- source_word: סֵפֶר
  choice: une lettre
  rationale: Le nom peut désigner plus largement un écrit ou un document, mais le contexte d’un message adressé à Joab et confié à un porteur appelle naturellement « une lettre ».
- source_word: אֶל יוֹאָב
  choice: à Joab
  rationale: La préposition marque ici le destinataire de la lettre.
- source_word: וַיִּשְׁלַח
  choice: l’envoya
  rationale: Le pronom reprend naturellement « une lettre » en français et rend le verbe d’envoi dans la continuité du récit.
- source_word: בְּיַד אוּרִיָּה
  choice: par l’intermédiaire d’Urie
  rationale: Littéralement « par la main d’Urie », locution hébraïque indiquant ici que la lettre fut remise à Urie pour qu’il la porte. « Par l’intermédiaire de » conserve l’idée d’agence et l’ironie tragique tout en restant naturel en français.
