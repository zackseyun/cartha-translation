  naturalness: La formulation actuelle « Que cette affaire ne soit pas mauvaise à tes yeux » est compréhensible mais très calquée et peu idiomatique en français moderne. « Ne considère pas cette affaire comme mauvaise » reste proche du sens tout en étant plus naturel. « L’un comme l’autre » évite la nuance surtout temporelle que peut introduire « tantôt… tantôt… ».
  terminology: « Messager », « affaire », « épée », « attaque », « ville » et « encourager » conviennent au registre narratif biblique moderne. « Intensifie ton attaque » est plus idiomatique que « Renforce ton attaque » tout en conservant la force de l’impératif hébreu.
