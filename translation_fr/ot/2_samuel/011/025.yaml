source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: fr
  text: 'Alors David dit au messager : « Voici ce que tu diras à Joab : “Ne considère pas cette affaire comme mauvaise[a], car l’épée dévore l’un comme l’autre[b]. Intensifie ton attaque contre la ville et démolis-la. Et encourage-le[c].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que cette affaire ne te déplaise pas. » Littéralement : « Que cette affaire ne soit pas mauvaise à tes yeux. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « car ainsi et ainsi l’épée dévore » ; l’expression indique ici que l’épée frappe celui-ci comme celui-là.'
    reason: idiom_explanation
  - marker: c
    text: 'Ou : « Et fortifie-le. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce contexte narratif, le terme désigne un envoyé humain chargé de transmettre une nouvelle, non un être angélique.
- source_word: כֹּה תֹאמַר
  choice: Tu diras ceci
  rationale: Cette formulation française naturelle conserve la fonction de la formule hébraïque introduisant les paroles à transmettre.
- source_word: אַל יֵרַע בְּעֵינֶיךָ אֶת הַדָּבָר הַזֶּה
  choice: Que cette affaire ne soit pas mauvaise à tes yeux
  rationale: Le calque intelligible maintient l’expression hébraïque et sa possible coloration morale, plutôt que de réduire le sens au seul déplaisir.
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: car l’épée dévore tantôt l’un, tantôt l’autre
  rationale: « Dévore » préserve la métaphore vive du verbe, tandis que « tantôt l’un, tantôt l’autre » exprime naturellement la variation indifférenciée de l’idiome כָּזֹה וְכָזֶה.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ אֶל הָעִיר
  choice: Renforce ton attaque contre la ville
  rationale: Dans le cadre d’un siège, « attaque » rend naturellement מִלְחָמָה avec le verbe « renforcer », sans perdre l’idée d’intensifier l’action militaire.
- source_word: וְהָרְסָהּ
  choice: et démolis-la
  rationale: Le verbe signifie abattre ou démolir; ce choix conserve concrètement l’image de la destruction de la ville.
- source_word: וְחַזְּקֵהוּ
  choice: Puis encourage-le
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à Joab; « encourager » exprime en français courant l’action de le fortifier moralement.
theological_decisions:
- issue: Portée morale de אַל יֵרַע בְּעֵינֶיךָ
  choice: Conserver « ne soit pas mauvaise à tes yeux » dans le texte
  alternative: « ne te déplaise pas »
  rationale: La formulation retenue préserve l’ambiguïté entre jugement moral et mécontentement personnel, sans atténuer silencieusement la manière dont David présente la mort d’Urie.
- issue: Référent de וְחַזְּקֵהוּ
  choice: Comprendre le suffixe comme visant Joab
  alternative: 'Traduction plus littérale et moins interprétative : « fortifie-le »'
  rationale: Joab est l’antécédent masculin singulier explicite et le destinataire du message; le texte ne justifie pas d’introduire un autre référent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe du discours rapporté reste claire, tandis que les images hébraïques importantes (« mauvaise à tes yeux », « l’épée dévore ») sont conservées et expliquées en notes.
