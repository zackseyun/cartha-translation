source:
  edition: WLC
  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: fr
  text: '« Qui a frappé Abimélek, fils de Yeroubbesheth[a] ? N’est-ce pas une femme qui a jeté sur lui, du haut de la muraille, une meule supérieure[b], si bien qu’il est mort à Tébets[c] ? Pourquoi vous êtes-vous approchés de la muraille ? » Alors tu diras : « Ton serviteur Urie le Hittite est mort lui aussi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici « Yeroubbesheth » ; comparer Juges 9:1, où le nom est « Yeroubbaal ».
    reason: alternative_reading
  - marker: b
    text: 'Ou : « un morceau de meule » ; l’expression hébraïque désigne probablement la meule supérieure.'
    reason: lexical_alternative
  - marker: c
    text: Voir Juges 9:53-54 pour l’épisode auquel il est fait allusion.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: a frappé
  rationale: Conserve le sens concret de נכה et évite de gommer la tension avec Juges 9:54, où Abimélek, mortellement blessé par la femme, est ensuite achevé par son porteur d’armes.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  choice: Abimélek, fils de Yeroubbesheth
  rationale: Suit le texte massorétique, qui porte ici Yeroubbesheth, sans l’harmoniser silencieusement avec Yeroubbaal en Juges 9.
- source_word: הֲלוֹא
  choice: N’est-ce pas
  rationale: Rend naturellement en français la question négative qui appelle une réponse affirmative.
- source_word: פֶּלַח רֶכֶב
  choice: une meule supérieure
  rationale: רֶכֶב désigne vraisemblablement la pierre mobile ou supérieure d’un moulin; la note conserve la possibilité que פֶּלַח mette plutôt l’accent sur un morceau de cette pierre.
- source_word: מֵעַל הַחוֹמָה
  choice: du haut de la muraille
  rationale: Exprime clairement le mouvement depuis une position située au-dessus de la muraille.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: si bien qu’il est mort à Tébets
  rationale: Rend l’enchaînement résultatif naturel en français tout en conservant le lieu.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל הַחוֹמָה
  choice: Pourquoi vous êtes-vous approchés de la muraille ?
  rationale: Reproduit sobrement le verbe « s’approcher » et l’adresse au pluriel, sans ajouter un degré de proximité absent de l’hébreu.
- source_word: וְאָמַרְתָּ
  choice: Alors tu diras
  rationale: Marque la suite de l’instruction donnée au messager, qui est interpellé au singulier.
- source_word: גַּם עַבְדְּךָ
  choice: Ton serviteur… lui aussi
  rationale: Conserve la valeur additive de גַּם et le registre de subordination propre à une adresse au roi.
theological_decisions:
- issue: Responsabilité immédiate de la mort d’Abimélek
  choice: « a frappé »
  alternative: « a tué » ou « a abattu »
  rationale: Le récit parallèle attribue à la femme le coup mortel, mais précise qu’un porteur d’armes achève ensuite Abimélek. La formulation retenue garde cette tension narrative au lieu de la résoudre.
translation_notes:
  register: Français international moderne, narratif et digne. Les questions conservent le ton de reproche anticipé par David. Les noms propres suivent une translittération française claire, et tous les appels de note sont placés immédiatement après l’élément concerné.
