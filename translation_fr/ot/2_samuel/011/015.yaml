id: 2SA.11.15
reference: 2 Samuel 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֥ב בַּ/סֵּ֖פֶר לֵ/אמֹ֑ר הָב֣וּ אֶת אֽוּרִיָּ֗ה אֶל מוּל֙ פְּנֵ֤י הַ/מִּלְחָמָה֙ הַֽ/חֲזָקָ֔ה וְ/שַׁבְתֶּ֥ם מֵ/אַחֲרָ֖י/ו וְ/נִכָּ֥ה וָ/מֵֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: fr
  text: 'Il écrivit dans la lettre : « Placez Urie en première ligne, là où le combat est le plus acharné[a], puis retirez-vous de derrière lui, afin qu’il soit frappé et qu’il meure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au premier rang du combat le plus violent ».'
    reason: La construction hébraïque peut être rendue plus littéralement en insistant soit sur la position au front, soit sur l’endroit où les combats sont les plus intenses.
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Il écrivit
  rationale: Le wayyiqtol poursuit le récit par une action passée successive ; le passé simple convient au registre narratif français.
- source_word: בַּסֵּפֶר
  choice: dans la lettre
  rationale: Dans ce contexte, סֵפֶר désigne le message écrit confié à Urie, et non un livre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu de la lettre sans calquer la formule hébraïque « en disant ».
- source_word: הָבוּ אֶת אֽוּרִיָּה
  choice: Placez Urie
  rationale: L’impératif pluriel donne l’ordre d’assigner Urie à une position précise ; « placez » garde un registre digne et naturel.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: en première ligne, là où le combat est le plus acharné
  rationale: La formulation rend l’exposition directe au front exprimée par מוּל פְּנֵי et l’intensité du combat exprimée par הַחֲזָקָה.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: puis retirez-vous de derrière lui
  rationale: שׁוּב signifie ici se replier ou se retirer ; « de derrière lui » conserve l’image tactique de l’abandon d’Urie par ceux qui le soutiennent.
- source_word: וְנִכָּה
  choice: afin qu’il soit frappé
  rationale: Le nifal exprime le fait de subir un coup. La tournure passive conserve cette nuance sans fusionner ce verbe avec la mort mentionnée ensuite.
- source_word: וָמֵת
  choice: et qu’il meure
  rationale: Le second verbe reste explicite, comme en hébreu, et manifeste l’issue mortelle recherchée.
theological_decisions:
- issue: Valeur de la séquence finale וְנִכָּה וָמֵת
  choice: afin qu’il soit frappé et qu’il meure
  alternative: et il sera frappé et mourra
  rationale: Dans cet ordre tactique, les formes coordonnées expriment naturellement le résultat voulu par le retrait. La traduction indique cette intention sans réduire les deux verbes à « tuer ».
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. La formulation évite un calque lourd de לֵאמֹר et conserve séparément l’action d’être frappé et celle de mourir. Le marqueur de note est placé sur l’expression réellement concernée.
