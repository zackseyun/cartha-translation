  text: וַ/יִּשְׁלַ֣ח דָּוִ֔ד וַ/יִּדְרֹ֖שׁ לָֽ/אִשָּׁ֑ה וַ/יֹּ֗אמֶר הֲ/לוֹא זֹאת֙ בַּת שֶׁ֣בַע בַּת אֱלִיעָ֔ם אֵ֖שֶׁת אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: fr
  text: 'David envoya quelqu’un se renseigner sur cette femme. On lui répondit : « N’est-ce pas Bethsabée, fille d’Éliam et femme d’Urie le Hittite ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד
  choice: David envoya quelqu’un
  rationale: Le verbe « envoyer » peut s’employer sans complément exprimé en hébreu ; en français, « quelqu’un » explicite naturellement l’agent envoyé sans l’identifier.
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: se renseigner sur cette femme
  rationale: דרשׁ avec ל peut ici exprimer l’action de demander des renseignements au sujet d’une personne. Le démonstratif reprend naturellement la femme aperçue dans le contexte.
- source_word: וַיֹּאמֶר
  choice: On lui répondit
  rationale: Le sujet grammatical n’est pas exprimé. La tournure impersonnelle préserve cette indétermination et évite d’attribuer la parole à David. « répondit » convient au contexte d’une demande de renseignements.
- source_word: הֲלוֹא
  choice: N’est-ce pas
  rationale: Conserve la forme de question rhétorique ou confirmative du texte hébreu.
- source_word: בַּת שֶׁבַע
  choice: Bethsabée
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: femme d’Urie le Hittite
  rationale: Rend directement le lien matrimonial et l’appartenance ethnique indiqués par l’hébreu.
theological_decisions:
- issue: Identité du locuteur de וַיֹּאמֶר
  choice: 'Sujet indéterminé : « On lui répondit »'
  alternative: « Il dit » ou « quelqu’un dit »
  rationale: L’hébreu ne nomme pas explicitement le locuteur. Dans le déroulement narratif, la réponse provient vraisemblablement de la personne envoyée ou interrogée ; la formulation choisie ne tranche pas son identité.
- issue: Fonction de la question sur l’identité de Bethsabée
  choice: Maintien de la question confirmative
  alternative: 'Transformer en affirmation : « C’est Bethsabée… »'
  rationale: La question hébraïque souligne les informations portées à la connaissance de David, notamment le fait qu’elle est mariée, sans réduire la tension narrative.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide tout en conservant l’indétermination du locuteur et la question confirmative de l’hébreu.
