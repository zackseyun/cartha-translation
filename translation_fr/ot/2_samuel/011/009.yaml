  text: וַ/יִּשְׁכַּ֣ב אוּרִיָּ֗ה פֶּ֚תַח בֵּ֣ית הַ/מֶּ֔לֶךְ אֵ֖ת כָּל עַבְדֵ֣י אֲדֹנָ֑י/ו וְ/לֹ֥א יָרַ֖ד אֶל בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: fr
  text: Mais Urie dormit[a] à l’entrée de la maison du roi[b], avec tous les serviteurs de son maître[c], et il ne descendit pas chez lui[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se coucha » ou « passa la nuit ». Le verbe hébreu peut désigner le fait de se coucher ou de dormir ; ici, il indique qu’Urie resta là pour la nuit.
    reason: lexical_alternative
  - marker: b
    text: Ou « du palais ». Littéralement, « de la maison du roi ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de son seigneur ». Le terme hébreu désigne ici David, le supérieur d’Urie.
    reason: lexical_alternative
  - marker: d
    text: Ou « et il ne rentra pas chez lui ». Littéralement, « et il ne descendit pas à sa maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: dormit
  rationale: Le verbe שׁכב peut signifier « se coucher » ou « dormir ». Dans ce contexte narratif, « dormit » exprime naturellement qu’Urie passa la nuit à cet endroit, sans effacer l’alternative lexicale.
- source_word: פֶּתַח
  choice: à l’entrée
  rationale: פֶּתַח désigne une ouverture, une entrée ou un seuil. « À l’entrée » est naturel en français et ne précise pas indûment qu’il s’agit du battant d’une porte.
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: Cette traduction conserve l’expression concrète de l’hébreu, littéralement « la maison du roi », tout en signalant en note son sens fonctionnel possible de « palais ».
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: avec tous les serviteurs de son seigneur
  rationale: Dans ce contexte, אֵת exprime l’association. « Avec » rend cette relation simplement. « Serviteurs » convient au personnel royal sans affirmer un statut servile plus précis que le récit.
- source_word: אֲדֹנָיו
  choice: son seigneur
  rationale: אדון signifie « seigneur » ou « maître ». Ici, le terme désigne David comme supérieur d’Urie; la minuscule évite toute confusion avec un titre divin.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: et il ne descendit pas chez lui
  rationale: « Descendit » conserve le mouvement exprimé par ירד, tandis que « chez lui » rend naturellement en français l’idée d’aller à sa propre maison.
