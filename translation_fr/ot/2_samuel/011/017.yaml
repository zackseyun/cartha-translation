  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י הָ/עִיר֙ וַ/יִּלָּחֲמ֣וּ אֶת יוֹאָ֔ב וַ/יִּפֹּ֥ל מִן הָ/עָ֖ם מֵ/עַבְדֵ֣י דָוִ֑ד וַ/יָּ֕מָת גַּ֖ם אוּרִיָּ֥ה הַ/חִתִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: fr
  text: Les hommes de la ville sortirent et livrèrent combat à Joab. Certains des serviteurs de David tombèrent[a] ; Urie le Hittite mourut lui aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il tomba d’entre le peuple, d’entre les serviteurs de David » ; cette tournure partitive signifie que certains hommes au service de David tombèrent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Le verbe יצא exprime le fait de sortir. En français, « sortirent » convient naturellement sans imposer une distinction de perspective entre « vinrent » et « allèrent ».
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: Traduction directe de la construction génitivale ; le contexte militaire indique qu’il s’agit de combattants masculins.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: livrèrent combat à Joab
  rationale: Cette formulation française naturelle exprime l’affrontement hostile indiqué par l’idiome hébreu, sans développer explicitement « Joab et ses troupes ».
- source_word: וַיִּפֹּל
  choice: tombèrent
  rationale: Le singulier hébreu a ici une valeur collective. « Tombèrent » conserve l’image militaire traditionnelle sans la réduire explicitement à « furent tués ».
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: certains des serviteurs de David
  rationale: Les deux expressions introduites par מן ont une valeur partitive et désignent des membres des forces de David. La formulation évite en français une répétition obscure tout en conservant l’appartenance au service de David.
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: Urie le Hittite mourut lui aussi
  rationale: « Lui aussi » rend la valeur additive et emphatique de גַּם, qui souligne qu’Urie figurait également parmi les morts.
