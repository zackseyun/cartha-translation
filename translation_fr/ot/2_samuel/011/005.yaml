  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: fr
  text: 'La femme devint enceinte[a]. Elle envoya dire à David[b] : « Je suis enceinte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « La femme conçut. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « elle envoya et informa David » ; le moyen par lequel elle lui fit parvenir le message n’est pas précisé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Le verbe הרה décrit ici l’entrée dans l’état de grossesse. « Devint enceinte » restitue naturellement en français la valeur événementielle de la forme verbale.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: אִשָּׁה peut signifier « femme » ou « épouse ». Dans cette proposition, le texte renvoie à Bethsabée sans expliciter sa relation conjugale; « la femme » reste donc au plus près de la formulation hébraïque.
- source_word: וַתִּשְׁלַח וַתַּגֵּד
  choice: elle envoya quelqu’un informer
  rationale: L’hébreu enchaîne littéralement « elle envoya et elle informa ». Le complément humain implicite de « envoya » est rendu pour produire un français naturel sans préciser l’identité du messager.
- source_word: לְדָוִד
  choice: David
  rationale: Forme française usuelle du nom biblique דָוִד.
- source_word: הָרָה אָנֹכִי
  choice: Je suis enceinte
  rationale: L’adjectif prédicatif הָרָה accompagné du pronom אָנֹכִי exprime l’état présent; « Je suis enceinte » est direct, exact et naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve « la femme », plutôt que « l’épouse », et explicite seulement le minimum nécessaire pour rendre idiomatique l’envoi du message.
