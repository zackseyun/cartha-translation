  text: וַ/יְהִ֕י בִּ/שְׁמ֥וֹר יוֹאָ֖ב אֶל הָ/עִ֑יר וַ/יִּתֵּן֙ אֶת א֣וּרִיָּ֔ה אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יָדַ֔ע כִּ֥י אַנְשֵׁי חַ֖יִל שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/016.yaml
  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: fr
  text: Pendant que Joab surveillait la ville, il plaça Urie à l’endroit où il savait que se trouvaient de redoutables guerriers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁמֹר
  choice: pendant que … surveillait
  rationale: L’infinitif construit avec ב introduit une proposition temporelle. Dans le contexte du siège, « surveillait » exprime l’observation militaire de la ville sans imposer le sens plus précis d’« assiéger ».
- source_word: אֶל הָעִיר
  choice: la ville
  rationale: Avec שׁמר, la ville constitue ici l’objet ou la cible de la surveillance. Le français emploie naturellement le verbe « surveiller » sans préposition.
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: il plaça Urie
  rationale: נתן signifie littéralement « donner, mettre ». Dans ce contexte de déploiement militaire, « plaça » rend la décision tactique de Joab tout en restant proche du sens lexical.
- source_word: הַמָּקוֹם
  choice: l’endroit
  rationale: מקום désigne un lieu déterminé. « L’endroit » est naturel en français et convient à cette position tactique.
- source_word: יָדַע
  choice: il savait
  rationale: Le sens courant de ידע est « savoir, connaître ». L’imparfait s’accorde avec l’état de connaissance qui motive le placement d’Urie.
- source_word: אַנְשֵׁי חַיִל
  choice: de redoutables guerriers
  rationale: Dans ce contexte, l’expression désigne des combattants capables et puissants. « Redoutables guerriers » communique leur dangerosité militaire sans les confondre avec un corps d’élite particulier de David.
- source_word: שָׁם
  choice: se trouvaient
  rationale: L’adverbe locatif « là » est naturellement intégré en français par la tournure « à l’endroit où … se trouvaient ».
- source_word: וַיְהִי
  choice: pendant que
  rationale: וַיְהִי fait progresser le récit et introduit ici la circonstance temporelle. La subordination française suffit, sans la formule lourde « il arriva que ».
