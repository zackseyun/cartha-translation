base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: fr
  text: 'Abishaï, fils de Tserouya, répondit : « À cause de cela[a], Shimeï ne devrait-il pas être mis à mort, puisqu’il a maudit l’oint de Yahweh ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En retour de cela ». L’expression hébraïque demande si cet acte doit entraîner la mise à mort de Shimeï.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: En français narratif, « répondit » exprime naturellement la formule hébraïque redondante « répondit et dit » sans lourdeur.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abishaï, fils de Tserouya
  rationale: Translittération française claire des noms, avec maintien de l’identification familiale du texte hébreu.
- source_word: הֲתַחַת זֹאת
  choice: À cause de cela
  rationale: Cette tournure conserve le sens causal de l’idiome et laisse entendre que l’acte évoqué pourrait entraîner l’exécution de Shimeï.
- source_word: לֹא יוּמַת
  choice: ne devrait-il pas être mis à mort
  rationale: Le hophal de מות indique qu’on fait mourir quelqu’un, ici dans un cadre punitif, plutôt qu’une simple mort.
- source_word: כִּי קִלֵּל
  choice: puisqu’il a maudit
  rationale: כִּי introduit le motif avancé par Abishaï, tandis que « maudit » conserve la gravité de קלל et le lien avec le récit antérieur.
- source_word: מְשִׁיחַ יְהוָה
  choice: celui que Yahweh a consacré par l’onction
  rationale: Cette formulation naturelle rend le participe passif מְשִׁיחַ et explicite sans surcharge qu’il s’agit d’une personne établie par l’onction de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom divin personnel conformément à la couche de consultation fournie.
- issue: Sens de מְשִׁיחַ יְהוָה
  choice: celui que Yahweh a consacré par l’onction
  alternative: l’oint de Yahweh
  rationale: Le choix conserve la référence immédiate au roi consacré sans transformer ici le titre en désignation christologique technique; « l’oint de Yahweh » reste une traduction plus formelle possible.
translation_notes:
  register: Français international moderne, digne et accessible. La double formule hébraïque « répondit et dit » est resserrée en « répondit ». Les graphies Abishaï, Tserouya et Shimeï suivent un usage français lisible.
