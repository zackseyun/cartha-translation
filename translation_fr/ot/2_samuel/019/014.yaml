  text: וְ/לַֽ/עֲמָשָׂא֙ תֹּֽמְר֔וּ הֲ/ל֛וֹא עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם לֹ֠א שַׂר צָבָ֞א תִּהְיֶ֧ה לְ/פָנַ֛/י כָּל הַ/יָּמִ֖ים תַּ֥חַת יוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: fr
  text: 'Vous direz à Amasa : « N’es-tu pas mon os et ma chair ? Que Dieu me traite ainsi, et qu’il y ajoute encore, si tu n’es pas, tous les jours[a], chef de l’armée à mon service, à la place de Joab ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les jours »; dans ce contexte, l’expression désigne une charge exercée de façon durable.'
    reason: Précision sur la portée idiomatique de כָּל הַיָּמִים.
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: Vous direz à Amasa
  rationale: Le verbe à la deuxième personne du pluriel transmet l’instruction adressée aux intermédiaires de David. Le futur français conserve naturellement cette valeur directive.
- source_word: הֲלוֹא
  choice: N’es-tu pas
  rationale: La tournure garde la question rhétorique qui attend une réponse affirmative.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: de mes os et de ma chair
  rationale: Cette formulation conserve l’image concrète de la parenté, plutôt que de la réduire à « mon parent ».
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Que Dieu me traite ainsi, et qu’il y ajoute encore
  rationale: La formule solennelle de serment est conservée sans expliciter la sanction que l’hébreu laisse indéterminée.
- source_word: אִם לֹא
  choice: si tu n’es pas
  rationale: Dans la formule de serment, ces mots introduisent l’engagement affirmé avec force. La structure conditionnelle de l’hébreu demeure visible en français.
- source_word: שַׂר צָבָא
  choice: chef de l’armée
  rationale: Expression moderne et digne désignant le commandant militaire suprême.
- source_word: תִּהְיֶה לְפָנַי
  choice: tu n’es pas … à mon service
  rationale: Littéralement « tu ne seras pas devant moi ». Dans ce contexte royal, l’expression indique une fonction exercée auprès du roi et sous son autorité; « à mon service » en communique naturellement le sens.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Le rendu littéral préserve la formulation hébraïque et son idée de durée continue; une note précise sa portée idiomatique dans le contexte d’une nomination.
- source_word: תַּחַת יוֹאָב
  choice: à la place de Joab
  rationale: Ici, תַּחַת exprime le remplacement et non la subordination.
theological_decisions:
- issue: Nombre et référent de אֱלֹהִים dans la formule de serment
  choice: Dieu
  alternative: des dieux
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici au singulier le Dieu d’Israël, conformément à l’usage hébreu et au contexte.
translation_notes:
  register: Français international moderne, solennel mais accessible. L’image de parenté et la formule de serment restent proches de l’hébreu; « à mon service » rend idiomatiquement לְפָנַי. Le marqueur de note est placé sur l’expression qu’il explique.
