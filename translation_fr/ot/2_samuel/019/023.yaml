base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: fr
  text: 'David dit : « Qu’ai-je à faire avec vous, fils de Tserouya, pour qu’aujourd’hui vous soyez pour moi un adversaire[a] ? Mettra-t-on quelqu’un à mort en Israël aujourd’hui ? Ne sais-je donc pas qu’aujourd’hui je suis roi sur Israël ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un adversaire pour moi ». Le mot hébreu traduit ici par « adversaire » peut aussi être transcrit « satan » ; il s’agit dans ce contexte d’un nom commun signifiant « adversaire » ou « opposant ».'
    reason: Préciser la valeur de שָׂטָן et éviter de le confondre avec le nom propre « Satan ».
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Qu’ai-je à faire avec vous
  rationale: Cette tournure française naturelle exprime la prise de distance et le reproche portés par l’expression idiomatique hébraïque, sans la reproduire servilement.
- source_word: בְּנֵי צְרוּיָה
  choice: fils de Tserouya
  rationale: La désignation familiale concrète est conservée dans l’adresse directe à Joab et Abishaï.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: pour qu’aujourd’hui vous vous posiez en adversaires contre moi
  rationale: Le nom שָׂטָן est ici un nom commun désignant ceux qui s’opposent à David. La formulation française rend le rôle d’opposants assumé en ce jour, sans importer le nom propre « Satan ».
- source_word: יוּמַת אִישׁ
  choice: Mettra-t-on quelqu’un à mort
  rationale: La forme verbale exprime la mise à mort, vraisemblablement judiciaire. « Quelqu’un » rend naturellement l’emploi générique de אִישׁ dans cette question générale.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Ne sais-je donc pas
  rationale: La question rhétorique hébraïque, qui appelle une réponse affirmative, est conservée en français.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: roi sur Israël
  rationale: « Sur » correspond directement à la préposition עַל et souligne l’autorité royale présente de David.
theological_decisions:
- issue: Sens de שָׂטָן
  choice: nom commun « adversaire »
  alternative: le nom propre « Satan »
  rationale: Dans ce récit, le mot qualifie l’opposition des fils de Tserouya à la décision royale. Le comprendre comme un nom propre introduirait une référence démonologique que le contexte immédiat ne justifie pas.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques et la répétition d’« aujourd’hui » sont maintenues. La formulation « vous vous posiez en adversaires » conserve l’idée d’une opposition active tout en restant idiomatique.
