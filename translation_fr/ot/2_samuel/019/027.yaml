  text: וַ/יֹּאמַ֕ר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ עַבְדִּ֣/י רִמָּ֑/נִי כִּֽי אָמַ֨ר עַבְדְּ/ךָ֜ אֶחְבְּשָׁה לִּ/י֩ הַ/חֲמ֨וֹר וְ/אֶרְכַּ֤ב עָלֶ֨י/הָ֙ וְ/אֵלֵ֣ךְ אֶת הַ/מֶּ֔לֶךְ כִּ֥י פִסֵּ֖חַ עַבְדֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: fr
  text: 'Il a calomnié ton serviteur auprès de mon seigneur le roi[a]. En effet, ton serviteur avait dit : « Je sellerai moi-même l’âne, je le monterai et j’irai avec le roi », car ton serviteur est boiteux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a trompé ton serviteur » ou « Il a trahi ton serviteur ». Le verbe hébreu peut désigner la tromperie ou un comportement déloyal ; « calomnié » convient ici puisque le contexte porte sur un rapport mensonger fait au roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמָּנִי
  choice: Il a calomnié ton serviteur
  rationale: Le piel de רמה peut exprimer la tromperie ou un agissement déloyal. Ici, le contexte porte sur une présentation mensongère de Mephibosheth au roi ; « calomnié » rend cette accusation précise tout en signalant en note les sens plus larges possibles.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte de maison royale, il s’agit du serviteur personnel de Mephibosheth. « Serviteur » est naturel et n’accentue pas indûment le statut servile.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette formule respecte le ton déférent de l’adresse royale et conserve les deux éléments de l’hébreu.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: Je sellerai moi-même l’âne
  rationale: La première personne à valeur volitive exprime ici l’intention. « Je sellerai » la rend directement ; « moi-même » traduit la nuance bénéficiaire ou personnelle de לִי sans suggérer nécessairement que Mephibosheth devait accomplir matériellement toute l’action sans aide.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: je le monterai
  rationale: Le français emploie naturellement le pronom masculin pour « l’âne », malgré le suffixe grammatical féminin de l’hébreu. La coordination préserve la suite des intentions.
- source_word: וְאֵלֵךְ אֶת הַמֶּלֶךְ
  choice: et j’irai avec le roi
  rationale: Avec אֶת, le verbe exprime ici l’accompagnement plutôt qu’un déplacement en direction du roi.
- source_word: פִסֵּחַ
  choice: boiteux
  rationale: Le terme décrit concrètement une infirmité locomotrice. « Boiteux » est exact, courant et moins péjoratif que certaines formulations plus anciennes.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Il s’agit de la formule conventionnelle par laquelle le locuteur parle humblement de lui-même devant le roi.
