  text: So the people slipped into the city that day, as people who are ashamed slip away when they flee in battle.
translation:
  language: fr
  text: Ce jour-là, le peuple entra furtivement dans la ville, comme des gens couverts de honte se glissent lorsqu’ils fuient au combat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: entra furtivement / le font
  rationale: La forme pronominale de גנב évoque ici le fait de se glisser sans se faire remarquer. « Entra furtivement » rend naturellement le premier emploi; dans la comparaison, « le font » évite une répétition française pesante tout en conservant l’image.
- source_word: הַנִּכְלָמִים
  choice: couverts de honte
  rationale: Le participe désigne ceux qui éprouvent honte ou humiliation; cette expression française garde la force de leur état.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: lorsqu’ils fuient le combat
  rationale: Rend directement la fuite dans le contexte d’un affrontement militaire; « le combat » est ici plus idiomatique que « la guerre ».
