  text: וַ/יְהִ֤י כָל הָ/עָם֙ נָד֔וֹן בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מֶּ֜לֶךְ הִצִּילָ֣/נוּ מִ/כַּ֣ף אֹיְבֵ֗י/נוּ וְ/ה֤וּא מִלְּטָ֨/נוּ֙ מִ/כַּ֣ף פְּלִשְׁתִּ֔ים וְ/עַתָּ֛ה בָּרַ֥ח מִן הָ/אָ֖רֶץ מֵ/עַ֥ל אַבְשָׁלֽוֹם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: fr
  text: 'Dans toutes les tribus d’Israël, le peuple tout entier débattait[a] en disant : « Le roi nous a délivrés de la main de nos ennemis et nous a sauvés de la main des Philistins[b] ; mais maintenant, il a fui le pays à cause d’Absalom[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était en pleine discussion » ou « se disputait ». L’hébreu évoque un débat généralisé, voire une controverse, et non une simple conversation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de la main de nos ennemis » et « de la main des Philistins ». Dans cet idiome hébreu, la « main » représente le pouvoir ou l’emprise.
    reason: lexical_alternative
  - marker: c
    text: Ou « loin d’Absalom » ou « sous la pression d’Absalom ». L’expression est idiomatique et peut désigner une fuite loin de lui ou provoquée par sa présence ou sa pression.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: débattait
  rationale: Le participe niphal décrit ici une controverse ou une délibération publique persistante. « Débattait » garde cette force sans suggérer nécessairement une querelle violente.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: Dans toutes les tribus d’Israël
  rationale: La tournure exprime l’étendue du débat à l’ensemble des tribus et se place naturellement en tête de phrase en français.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule usuelle introduisant le contenu des paroles rapportées.
- source_word: הִצִּילָנוּ
  choice: nous a délivrés
  rationale: Le verbe désigne l’action d’arracher à un danger ou à une domination ; « délivrés » convient au contexte politique et militaire.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: de la main de nos ennemis
  rationale: La métaphore hébraïque de la main comme pouvoir ou emprise reste intelligible et digne en français.
- source_word: מִלְּטָנוּ
  choice: nous a sauvés
  rationale: Ce choix rend l’idée d’échapper au danger tout en distinguant le verbe du précédent, dont le sens est proche.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: de la main des Philistins
  rationale: La répétition de « la main » conserve le parallélisme expressif de l’hébreu.
- source_word: וְעַתָּה
  choice: mais maintenant
  rationale: La conjonction introduit ici un contraste entre les délivrances passées accomplies par David et sa fuite présente.
- source_word: בָּרַח
  choice: il a fui
  rationale: Le passé composé exprime naturellement en français une action accomplie dont les conséquences demeurent présentes.
- source_word: מִן הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial et politique, « le pays » est plus idiomatique en français que « la terre ».
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: à cause d’Absalom
  rationale: Après un verbe de fuite, cette expression indique que la présence ou la pression d’Absalom a provoqué le départ ; la note conserve les possibilités plus littérales.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le collectif עָם est rendu par « le peuple tout entier » avec un verbe au singulier. La métaphore de la « main » et le parallélisme des deux délivrances sont conservés, tandis que l’expression idiomatique finale est clarifiée dans le texte et documentée en note.
