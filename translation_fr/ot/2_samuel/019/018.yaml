base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: fr
  text: Et avec lui, mille hommes de Benjamin, ainsi que Tsiba, serviteur de la maison de Saül, avec ses quinze fils et ses vingt serviteurs. Ils traversèrent le Jourdain devant le roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence du roi » ou « en avant du roi ». L’expression hébraïque peut indiquer soit la présence, soit une position en avant.
    reason: L’expression לִפְנֵי הַמֶּלֶךְ est ambiguë quant à la relation spatiale; la traduction principale conserve cette ambiguïté.
lexical_decisions:
- source_word: אֶלֶף אִישׁ עִמּוֹ מִבִּנְיָמִן
  choice: avec lui, mille hommes de Benjamin
  rationale: La formulation conserve le lien avec la personne mentionnée dans le contexte précédent et exprime naturellement l’appartenance tribale des mille hommes.
- source_word: צִיבָא
  choice: Tsiba
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: serviteur de la maison de Saül
  rationale: Dans ce contexte, נַעַר désigne la fonction de serviteur ou d’intendant plutôt que l’âge; «maison» préserve la dimension familiale et dynastique.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו וְעֶשְׂרִים עֲבָדָיו אִתּוֹ
  choice: accompagné de ses quinze fils et de ses vingt serviteurs
  rationale: Cette formulation française rend clairement que les fils et les serviteurs sont avec Tsiba, sans alourdir l’énumération.
- source_word: וְצָלְחוּ הַיַּרְדֵּן
  choice: Ils traversèrent le Jourdain
  rationale: Le verbe indique ici le passage du fleuve; «traversèrent» est précis, naturel et adapté au récit.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: «Devant» conserve autant que possible l’ambiguïté spatiale de l’hébreu, qui peut évoquer la présence du roi ou une position en avant de lui.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase commence en continuité avec le verset précédent. Le marqueur de note est placé après «devant le roi», expression à laquelle porte réellement l’ambiguïté.
