base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: fr
  text: 'Alors le roi dit : « Que Kimham traverse avec moi. Je ferai pour lui ce qui te semblera bon, et tout ce que tu voudras me demander[a], je le ferai pour toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce que tu choisiras de m’imposer ». L’hébreu est elliptique, littéralement : « tout ce que tu choisiras sur moi ».'
    reason: 'Préserve l’ellipse et l’ambiguïté de l’expression hébraïque tout en gardant dans le texte la compréhension contextuelle naturelle : une demande faite au roi.'
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Alors le roi dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » marque naturellement la succession en français.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: Que Kimham traverse avec moi
  rationale: L’imparfait hébreu a ici une valeur jussive. Cette formulation rend la décision ou l’invitation du roi et conserve le verbe « traverser », important dans le contexte du passage du Jourdain.
- source_word: כִּמְהָם
  choice: Kimham
  rationale: Translittération française simple du nom propre hébreu.
- source_word: וַאֲנִי אֶעֱשֶׂה לּוֹ
  choice: Je ferai pour lui
  rationale: Le verbe עשה reste général ; la traduction évite de préciser indûment la nature du bienfait promis.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: ce qui te semblera bon
  rationale: Cette expression française naturelle transmet le jugement ou le souhait de l’interlocuteur, sans conserver artificiellement l’image hébraïque des yeux.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: tout ce que tu voudras me demander
  rationale: L’expression hébraïque est elliptique, littéralement « tout ce que tu choisiras sur moi ». Dans le contexte, elle désigne ce que Barzillaï voudra demander au roi ou lui faire prendre en charge.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: je le ferai pour toi
  rationale: Le pronom « le » reprend naturellement en français tout ce que Barzillaï pourrait demander, tout en conservant la promesse personnelle du roi.
