  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: fr
  text: 'Joab entra dans la maison, auprès du roi[a], et lui dit : « Aujourd’hui, tu as couvert de honte tous tes serviteurs, eux qui ont sauvé aujourd’hui ta vie[b], celle de tes fils et de tes filles, celle de tes femmes et celle de tes concubines. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison » désigne probablement ici la résidence royale, c’est-à-dire le palais.
    reason: cultural_note
  - marker: b
    text: L’hébreu emploie à plusieurs reprises le mot rendu ici par « vie », et non un terme désignant spécifiquement l’âme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: dans la maison
  rationale: Rend littéralement le lieu indiqué par l’hébreu, tout en signalant en note que le contexte suggère la résidence royale.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: tu as couvert de honte
  rationale: Expression française naturelle qui conserve la valeur causative et publique de la honte, sans reproduire artificiellement l’expression concrète « la face de ».
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Préserve le rapport au roi sans limiter ces hommes aux seuls fonctionnaires ou soldats.
- source_word: הַמְמַלְּטִים
  choice: eux qui ont sauvé
  rationale: Le participe désigne ceux qui ont délivré de la mort; « sauver » convient au complément « vie ».
- source_word: נַפְשְׁךָ / נֶפֶשׁ
  choice: ta vie / celle de
  rationale: נפש désigne ici la vie physique menacée, non une âme immatérielle. La reprise par « celle de » restitue sobrement la répétition hébraïque.
- source_word: פִּלַגְשֶׁיךָ
  choice: tes concubines
  rationale: Terme français précis pour des femmes liées au roi par une union reconnue mais de statut inférieur à celui des épouses.
theological_decisions:
- issue: Désignation des membres féminins de la maison royale
  choice: tes femmes et tes concubines
  alternative: tes épouses et tes femmes de second rang
  rationale: La traduction maintient les catégories sociales distinctes du texte sans les atténuer ni y ajouter un jugement moral.
- issue: Sens de נפש
  choice: vie
  alternative: âme
  rationale: Dans ce contexte de délivrance d’un danger mortel, le mot désigne clairement la vie des personnes; traduire par « âme » introduirait une distinction anthropologique étrangère au passage.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation « entra auprès du roi, dans la maison » conserve l’ordre appositionnel inhabituel de l’hébreu tout en restant intelligible. Le rythme de l’énumération familiale est maintenu sans lourdeur excessive.
