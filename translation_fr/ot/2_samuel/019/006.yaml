  to: 'Joab entra dans la maison, auprès du roi[a], et lui dit : « Aujourd’hui, tu as couvert de honte tous tes serviteurs, eux qui ont sauvé aujourd’hui ta vie[b], celle de tes fils et de tes filles, celle de tes femmes et celle de tes concubines. »'
