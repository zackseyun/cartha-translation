    issue: Ordre et rattachement de « auprès du roi, dans la maison »
    rationale: Le texte hébreu situe Joab auprès du roi dans la maison. En français, placer d’abord « dans la maison » clarifie que Joab y entre pour rejoindre le roi.
  - severity: low
    issue: Ancre de la note sur נֶפֶשׁ
    rationale: La note b explique la répétition de « vie », mais son ancre après « concubines » semble la rattacher à ce seul terme. Elle doit être placée à la première occurrence de « vie ».
