  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: fr
  text: 'L’homme d’Israël répondit à l’homme de Juda : « J’ai dix parts sur le roi[a] et, même sur David, j’ai plus de droits que toi[b]. Pourquoi donc as-tu fait si peu de cas de moi ? N’ai-je pas été le premier à proposer de ramener mon roi[c] ? » Mais les hommes de Juda parlèrent plus durement que les hommes d’Israël[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « J’ai dix mains dans le roi. » Dans cet idiome, les « mains » sont des parts ou des droits, probablement en référence aux dix tribus du Nord face à Juda.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « et, même sur David, ma part est plus grande que la tienne ». L’hébreu est elliptique et peut exprimer une part ou un droit supérieur.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Ma parole n’a-t-elle pas été la première pour ramener mon roi ? »'
    reason: alternative_reading
  - marker: d
    text: 'Littéralement : « Mais la parole de l’homme de Juda fut plus dure que la parole de l’homme d’Israël. » Les deux singuliers ont ici un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: l’homme d’Israël / l’homme de Juda
  rationale: Le singulier hébreu désigne ici, de manière représentative, le porte-parole de chacun des deux groupes. Le français conserve ce singulier dans le dialogue, puis emploie naturellement le pluriel collectif dans la conclusion.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: J’ai dix parts sur le roi
  rationale: יָדוֹת signifie littéralement « mains », mais désigne ici des parts, c’est-à-dire un droit ou une revendication. « Dix parts » garde l’image comptable et évoque les dix tribus du Nord sans rendre l’idiome opaque.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: et, même sur David, j’ai plus de droits que toi
  rationale: 'La construction hébraïque est elliptique : littéralement, « et même en David, moi plus que toi ». Le contexte indique une comparaison des droits revendiqués sur David, plutôt qu’une affirmation générale de supériorité.'
- source_word: הֱקִלֹּתַנִי
  choice: as-tu fait si peu de cas de moi
  rationale: Le hifil de קלל exprime le fait de tenir quelqu’un pour peu de chose ou de le traiter comme négligeable. Cette formulation française restitue l’offense sans la renforcer jusqu’à la haine.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: N’ai-je pas été le premier à proposer de ramener mon roi ?
  rationale: La proposition hébraïque est elliptique, et דָבָר peut désigner une parole, une affaire ou une proposition. La traduction exprime clairement la priorité revendiquée dans l’initiative du retour du roi.
- source_word: מַלְכִּי
  choice: mon roi
  rationale: Le suffixe de première personne est explicite et souligne l’attachement personnel ainsi que la revendication du porte-parole d’Israël.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: les hommes de Juda parlèrent plus durement que les hommes d’Israël
  rationale: קשׁה marque ici la dureté ou la violence du discours. La formulation verbale est plus naturelle en français que le calque « la parole fut plus dure », tandis que les pluriels rendent le sens collectif de אִישׁ.
