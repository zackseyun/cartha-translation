  text: וַ/יַּעֲבֹ֧ר כָּל הָ/עָ֛ם אֶת הַ/יַּרְדֵּ֖ן וְ/הַ/מֶּ֣לֶךְ עָבָ֑ר וַ/יִּשַּׁ֨ק הַ/מֶּ֤לֶךְ לְ/בַרְזִלַּי֙ וַ/יְבָ֣רֲכֵ֔/הוּ וַ/יָּ֖שָׁב לִ/מְקֹמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: fr
  text: Tout le peuple traversa le Jourdain, et le roi le traversa aussi. Le roi embrassa Barzillaï et le bénit, puis il retourna chez lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet de « retourna » est très probablement Barzillaï, bien que l’hébreu puisse grammaticalement laisser planer une ambiguïté.
    reason: ambiguïté du référent
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: traversa
  rationale: Le verbe עבר décrit ici le franchissement du Jourdain. « Traverser » est le terme français courant et précis.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: עַם désigne largement le peuple rassemblé autour du roi, sans limiter nécessairement le groupe aux seuls soldats.
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Cette forme française traditionnelle et actuelle désigne naturellement le fleuve sans qu’il soit nécessaire d’ajouter « fleuve ».
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: et le roi le traversa aussi
  rationale: Le pronom « le » reprend clairement le Jourdain, tandis que « aussi » restitue naturellement la répétition hébraïque et indique que le roi effectua lui-même la traversée.
- source_word: וַיִּשַּׁק
  choice: embrassa
  rationale: Dans ce contexte d’affection et d’adieu, « embrasser » exprime naturellement en français le geste indiqué par נשק.
- source_word: לְבַרְזִלַּי
  choice: Barzillaï
  rationale: Translittération française usuelle du nom propre, avec le tréma signalant la prononciation des voyelles finales en syllabes distinctes.
- source_word: וַיְבָרֲכֵהוּ
  choice: le bénit
  rationale: Le verbe ברך signifie explicitement « bénir ». La traduction conserve donc le langage de bénédiction sans le réduire à une simple formule d’adieu.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: puis il retourna chez lui
  rationale: « Retourna chez lui » rend naturellement l’idée de revenir à son lieu. Le pronom « il » préserve l’ambiguïté grammaticale du sujet, bien que le contexte favorise Barzillaï.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition du franchissement est conservée sans lourdeur. Le dernier pronom maintient l’ambiguïté formelle de l’hébreu, expliquée en note plutôt que résolue silencieusement.
