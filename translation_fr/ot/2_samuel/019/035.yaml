  text: וַ/יֹּ֥אמֶר בַּרְזִלַּ֖י אֶל הַ/מֶּ֑לֶךְ כַּ/מָּ֗ה יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י כִּי אֶעֱלֶ֥ה אֶת הַ/מֶּ֖לֶךְ יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: fr
  text: 'Barzillaï dit au roi : « Combien d’années me reste-t-il à vivre pour que je monte avec le roi à Jérusalem ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Combien sont les jours des années de ma vie, pour que je monte avec le roi à Jérusalem ? »'
    reason: Préserve la formulation hébraïque cumulative « les jours des années de ma vie », plus formelle que l’expression française idiomatique du texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר est la formule narrative ordinaire, rendue naturellement par « dit ».
- source_word: בַּרְזִלַּי
  choice: Barzillaï
  rationale: Translittération française traditionnelle et reconnaissable du nom propre.
- source_word: אֶל הַמֶּלֶךְ
  choice: au roi
  rationale: L’hébreu emploie le nom commun défini « le roi » sans ajouter le nom de David.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיַּי
  choice: Combien me reste-t-il encore d’années à vivre
  rationale: Cette formulation française naturelle exprime la question rhétorique portant sur le peu de vie qui reste à Barzillaï. La tournure hébraïque plus littérale est conservée en note.
- source_word: כִּי
  choice: pour que
  rationale: Dans cette question rhétorique, כִּי relie la durée de vie restante à la possibilité de monter avec le roi; « pour que » restitue naturellement cette nuance consécutive ou finale sans la surdéterminer.
- source_word: אֶעֱלֶה
  choice: je monte
  rationale: עלה évoque normalement la montée vers Jérusalem; le présent français après « pour que » convient à la valeur modale du contexte.
- source_word: אֶת הַמֶּלֶךְ
  choice: avec le roi
  rationale: 'Ici, אֶת a une valeur d’accompagnement: Barzillaï envisage d’accompagner le roi, non de le prendre comme objet direct.'
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville.
