  register: Français international moderne, digne et accessible. Le tutoiement est conservé dans l’adresse au roi, conformément à l’usage courant des traductions bibliques françaises et à la morphologie de la deuxième personne du singulier. La formulation maintient les images de la « maison » familiale et de la table royale, tout en explicitant sobrement leur portée.
