base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: fr
  text: En effet, toute la maison de mon père n’était composée que d’hommes passibles de mort devant mon seigneur le roi[a]. Pourtant, tu as placé ton serviteur parmi ceux qui mangent à ta table. Quel droit ai-je donc encore[b] de faire appel encore au roi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des hommes de mort », c’est-à-dire des hommes passibles de mort ou susceptibles d’être exécutés.'
    reason: lexical_alternative
  - marker: b
    text: Ici, le mot hébreu traduit par « droit » désigne une juste revendication ou un titre à réclamer quelque chose, et non principalement la justice morale personnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: En effet, ... n’était composée que de
  rationale: Cette tournure rend la limitation emphatique de la construction hébraïque tout en restant naturelle en français.
- source_word: כָּל בֵּית אָבִי
  choice: toute la maison de mon père
  rationale: « Maison » conserve l’image hébraïque de la famille ou maisonnée étendue et demeure intelligible dans un registre biblique moderne.
- source_word: אַנְשֵׁי מָוֶת
  choice: hommes passibles de mort
  rationale: L’expression désigne des personnes exposées à une condamnation à mort, et non des hommes déjà morts. « Passibles de mort » préserve la nuance juridique sans affirmer plus précisément qu’ils méritaient moralement l’exécution.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: devant mon seigneur le roi
  rationale: La préposition marque ici la situation de la famille au regard du jugement royal; « devant » exprime naturellement cette relation.
- source_word: וַתָּשֶׁת
  choice: Pourtant, tu as placé
  rationale: « Placé » correspond au sens concret du verbe; « pourtant » explicite le contraste porté par le contexte et la conjonction.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Il s’agit ici d’une formule de déférence adressée au roi plutôt que d’une précision sur le statut juridique d’esclave.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: parmi ceux qui mangent à ta table
  rationale: Cette formulation claire conserve l’image sociale de l’admission parmi les personnes entretenues ou honorées à la table royale.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: Quel droit ai-je donc encore
  rationale: Dans ce contexte, צְדָקָה désigne une juste revendication ou un titre à réclamer quelque chose, plutôt que la vertu morale abstraite.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: de faire appel au roi
  rationale: Le verbe évoque un cri de plainte ou de requête. « Faire appel » restitue ici sa fonction de recours adressé au roi dans un français naturel, sans suggérer nécessairement un cri à voix haute.
