  variant: modern international French
source:
  edition: WLC
  text: וּ/בַרְזִלַּי֙ זָקֵ֣ן מְאֹ֔ד בֶּן שְׁמֹנִ֖ים שָׁנָ֑ה וְ/הֽוּא כִלְכַּ֤ל אֶת הַ/מֶּ֨לֶךְ֙ בְּ/שִׁיבָת֣/וֹ בְ/מַחֲנַ֔יִם כִּֽי אִ֛ישׁ גָּד֥וֹל ה֖וּא מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: fr
  text: 'Barzillaï était très âgé : il avait quatre-vingts ans. Il avait pourvu aux besoins du roi pendant le séjour de celui-ci à Mahanaïm, car c’était un homme très important[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme très riche » ou « un homme très influent ». L’expression hébraïque, littéralement « un homme très grand », peut désigner la richesse, le rang social ou l’influence.
    reason: La portée de גָּדוֹל est large dans ce contexte et ne doit pas être réduite sans indication à la seule richesse.
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: était très âgé
  rationale: L’adjectif est employé comme prédicat et intensifié par מְאֹד. « Très âgé » est naturel en français moderne et convient au registre narratif.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: il avait quatre-vingts ans
  rationale: Littéralement « fils de quatre-vingts ans » ; l’expression idiomatique française donne directement l’âge.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: avait pourvu aux besoins du roi
  rationale: Le verbe כלכל exprime ici le fait d’entretenir matériellement quelqu’un ou de lui fournir ce qui lui est nécessaire.
- source_word: בְּשִׁיבָתוֹ
  choice: pendant le séjour de celui-ci
  rationale: ישב désigne ici le fait de demeurer ou de séjourner. « Celui-ci » rattache naturellement le suffixe au roi, antécédent immédiat, sans suggérer une intronisation.
- source_word: בְמַחֲנַיִם
  choice: à Mahanaïm
  rationale: Translittération française usuelle du nom de lieu.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: c’était un homme très important
  rationale: La formule hébraïque, littéralement « il était un homme très grand », peut évoquer à la fois les moyens matériels, le rang et l’influence. « Très important » en conserve mieux l’étendue que le seul adjectif « riche ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La première proposition coordonnée en hébreu est rendue sans ajouter un marqueur temporel absent du texte. Les deux indications d’âge sont conservées, avec une ponctuation qui évite une lourde répétition.
