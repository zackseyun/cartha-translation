base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: fr
  text: Le roi revint et arriva jusqu’au Jourdain. Juda était venu à Guilgal pour aller à la rencontre du roi et lui faire traverser le Jourdain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faire traverser le roi ».'
    reason: La reprise de « le roi » dans l’hébreu est remplacée dans le texte par le pronom « lui » pour produire un français naturel.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le qal wayyiqtol de שוב décrit le retour de David après sa fuite; « revint » convient naturellement au récit.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: arriva jusqu’au Jourdain
  rationale: עַד présente le Jourdain comme le point atteint, sans laisser entendre que le roi l’a déjà traversé.
- source_word: וִיהוּדָה
  choice: Juda
  rationale: Le nom propre désigne collectivement la tribu ou la population de Juda, conformément à la formulation concise de l’hébreu.
- source_word: בָּא
  choice: était venu
  rationale: Le qatal fournit ici vraisemblablement une information d’arrière-plan par rapport à l’arrivée du roi; le plus-que-parfait français exprime clairement cette relation.
- source_word: הַגִּלְגָּלָה
  choice: à Guilgal
  rationale: Le hé directionnel marque le mouvement vers Guilgal; « à Guilgal » est l’expression française naturelle.
- source_word: לָלֶכֶת לִקְרַאת
  choice: pour aller à la rencontre de
  rationale: Cette formulation conserve les deux éléments de l’expression hébraïque et sa valeur de but.
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: lui faire traverser le Jourdain
  rationale: Le hiphil de עבר est causatif. « Faire traverser » rend ce sens sans préciser abusivement le moyen employé.
