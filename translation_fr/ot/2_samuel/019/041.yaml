  source_fidelity: Le sens directionnel vers Guilgal et la valeur causative de וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ sont bien identifiés. Toutefois, « passa jusqu’à Guilgal » est peu idiomatique et ne rend pas clairement le déplacement vers ce lieu; « Tout le peuple ... fit » neutralise en outre le pluriel du verbe hébreu.
