  text: וַ/יַּעֲבֹ֤ר הַ/מֶּ֨לֶךְ֙ הַ/גִּלְגָּ֔לָ/ה וְ/כִמְהָ֖ן עָבַ֣ר עִמּ֑/וֹ וְ/כָל עַ֤ם יְהוּדָה֙ ו/יעברו אֶת הַ/מֶּ֔לֶךְ וְ/גַ֕ם חֲצִ֖י עַ֥ם יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: fr
  text: Puis le roi se rendit à Guilgal, et Kimham passa avec lui. Tous les gens de Juda firent traverser le roi[a], ainsi que la moitié du peuple d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « accompagnèrent le roi pour la traversée ». Le verbe hébreu, employé avec un complément d’objet direct, peut ici exprimer le fait de faire traverser quelqu’un ou de l’aider à traverser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passa
  rationale: Dans ce contexte, עבר décrit la traversée du Jourdain. Le verbe « passer » reste naturel en français et le complément suivant indique la destination.
- source_word: הַגִּלְגָּלָה
  choice: jusqu’à Guilgal
  rationale: Le hé directionnel marque un mouvement en direction de Guilgal. « Jusqu’à Guilgal » rend cette orientation sans imposer que la ville elle-même soit le point précis de la traversée.
- source_word: וְכִמְהָן
  choice: et Kimham
  rationale: Le nom propre est translittéré sous la forme française courante « Kimham ».
- source_word: עָבַר עִמּוֹ
  choice: passa avec lui
  rationale: La répétition de עבר est conservée afin de maintenir le lien narratif avec le déplacement du roi.
- source_word: וְכָל עַם יְהוּדָה
  choice: Tout le peuple de Juda
  rationale: Cette formulation transparente désigne ici les gens de Juda engagés dans l’accueil et le retour du roi.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: fit passer le roi
  rationale: 'Avec un objet direct, עבר prend ici une valeur causative : le peuple aide le roi à traverser ou assure son passage. « Fit passer » conserve directement cette construction.'
- source_word: וְגַם
  choice: ainsi que
  rationale: Cette locution exprime naturellement en français l’ajout du second groupe sans alourdir la coordination.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: la moitié du peuple d’Israël
  rationale: La traduction maintient la donnée quantitative et la distinction politique entre Juda et Israël.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La répétition du verbe « passer » reflète celle de l’hébreu, tandis que « fit passer » en conserve la nuance causative. Le nom Guilgal suit la forme française biblique usuelle.
