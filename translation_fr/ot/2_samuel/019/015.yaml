  source_fidelity: Le texte rend fidèlement וַיַּט אֶת־לְבַב (« il inclina/gagna le cœur ») sans expliciter le moyen de cette influence. « Tous les hommes de Juda » reflète correctement le singulier distributif כָּל־אִישׁ יְהוּדָה. « Comme s’ils n’étaient qu’un seul homme » conserve l’image d’une unanimité collective exprimée par כְּאִישׁ אֶחָד. L’ordre donné au roi, « Reviens, toi et tous tes serviteurs », correspond au texte hébreu et à l’audit anglais.
