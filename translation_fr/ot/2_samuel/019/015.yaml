  terminology: « Juda », « roi » et « serviteurs » sont appropriés au contexte monarchique. Le maintien de « cœur » préserve l’expression anthropologique du texte sans imposer une lecture doctrinale. Aucun terme théologique ou nom propre ne demande de modification.
