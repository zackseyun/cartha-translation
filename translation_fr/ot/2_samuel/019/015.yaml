  text: וַ/יַּ֛ט אֶת לְבַ֥ב כָּל אִישׁ יְהוּדָ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וַֽ/יִּשְׁלְחוּ֙ אֶל הַ/מֶּ֔לֶךְ שׁ֥וּב אַתָּ֖ה וְ/כָל עֲבָדֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/015.yaml
  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: fr
  text: 'Il gagna le cœur de tous les hommes de Juda comme s’ils n’étaient qu’un seul homme. Ils envoyèrent alors dire au roi : « Reviens, toi et tous tes serviteurs. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: Il gagna le cœur
  rationale: L’expression indique qu’il amena les hommes de Juda à se rallier à lui. « Gagna le cœur » rend naturellement en français cette influence persuasive sans préciser un moyen que l’hébreu ne donne pas.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: de tous les hommes de Juda
  rationale: Le singulier distributif hébreu désigne collectivement l’ensemble des hommes de Juda ; le pluriel est plus idiomatique en français.
- source_word: כְּאִישׁ אֶחָד
  choice: comme s’ils n’étaient qu’un seul homme
  rationale: Cette formulation française conserve l’image hébraïque et souligne leur unanimité.
- source_word: שׁוּב
  choice: Reviens
  rationale: L’impératif masculin singulier s’adresse directement au roi et demande son retour.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Le terme désigne ici les personnes au service ou à la suite du roi ; « serviteurs » préserve le vocabulaire de cour et sa portée générale.
theological_decisions:
- issue: Nature de l’action exercée sur le cœur des hommes de Juda
  choice: « gagna le cœur »
  alternative: « inclina le cœur »
  rationale: Le texte attribue au sujet une influence décisive, sans décrire une action divine intérieure ni une contrainte. Le choix retenu évite de surinterpréter le mécanisme tout en exprimant le ralliement obtenu.
translation_notes:
  register: Français moderne, courant et digne. La première phrase conserve l’image du cœur et celle de l’unité « comme un seul homme », tandis que la seconde adopte une tournure idiomatique pour l’envoi du message.
