  text: אַחַ֣/י אַתֶּ֔ם עַצְמִ֥/י וּ/בְשָׂרִ֖/י אַתֶּ֑ם וְ/לָ֧/מָּה תִהְי֛וּ אַחֲרֹנִ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: fr
  text: Vous êtes mes frères[a], vous êtes mon os et ma chair[b]. Alors, pourquoi seriez-vous les derniers à ramener le roi[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens dans ce contexte : « mes proches parents » ; littéralement : « mes frères ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mon os et ma chair », expression qui désigne une proche parenté de sang.'
    reason: cultural_note
  - marker: c
    text: David parle ici de lui-même à la troisième personne en disant « le roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: mes frères
  rationale: Le terme signifie littéralement « mes frères ». Dans ce contexte, David s’adresse aux membres de la tribu de Juda comme à ses proches parents; le rendu concret est conservé, avec une note explicitant la valeur de parenté.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: mes os et ma chair
  rationale: Cette expression concrète désigne une étroite parenté de sang. Le français conserve l’image hébraïque et la coordination des deux noms.
- source_word: וְלָמָה
  choice: Alors, pourquoi
  rationale: La conjonction introduit ici une question persuasive fondée sur l’affirmation de parenté qui précède; « Alors » rend naturellement cette valeur inférentielle.
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: seriez-vous les derniers
  rationale: L’imparfait hébreu a ici une portée rhétorique et exhortative. Le conditionnel français exprime naturellement l’étonnement et le reproche implicite sans transformer la question en simple prédiction.
- source_word: לְהָשִׁיב
  choice: à ramener
  rationale: Le hifil de שוב signifie « faire revenir, ramener ». Avec « le roi » comme complément, « ramener » est direct et idiomatique.
- source_word: אֶת־הַמֶּלֶךְ
  choice: le roi
  rationale: L’hébreu emploie la troisième personne. La conserver respecte la forme du discours royal de David plutôt que de la convertir en « me ramener ».
theological_decisions:
- issue: La troisième personne dans l’expression « le roi »
  choice: Conserver « le roi »
  alternative: « me ramener, moi, le roi »
  rationale: Le texte hébreu présente explicitement « le roi » comme objet. La traduction préserve cette formulation et laisse au contexte l’identification du roi à David.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe persuasive de l’appel est naturelle, tandis que les images hébraïques de parenté et la troisième personne royale sont conservées.
