translation_notes:
  register: Français moderne, digne et direct. Le tutoiement royal (« ton serviteur ») suit l’usage narratif français courant dans ce contexte ancien. La formulation conserve la modestie et la question rhétorique de Barzillaï sans surinterpréter la nature de la récompense.
