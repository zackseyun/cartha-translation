  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: fr
  text: Car ton serviteur ne traversera le Jourdain avec le roi que sur une courte distance. Pourquoi le roi m’accorderait-il cette récompense[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « me rendrait-il un tel bienfait ? » En hébreu, le verbe et le nom apparenté sont formés sur la même racine (גמל), ce qui souligne l’idée de rétribution ou de retour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: Car … ne fera que … un peu
  rationale: כִּי introduit ici la justification du refus, tandis que מְעַט limite la portée de l’accompagnement. Cette tournure française rend naturellement les deux éléments.
- source_word: יַעֲבֹר
  choice: fera … traverser
  rationale: L’imparfait hébreu exprime ici l’action envisagée dans le contexte du discours. Le futur français convient à cette intention poliment formulée.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans une adresse au roi, il s’agit d’une formule conventionnelle d’humilité plutôt que d’une insistance sur l’esclavage.
- source_word: אֶת הַ/יַּרְדֵּן
  choice: traverser … le Jourdain
  rationale: Avec עבר, le syntagme désigne la traversée du fleuve. La construction transitive est naturelle en français.
- source_word: אֶת הַ/מֶּלֶךְ
  choice: avec le roi
  rationale: אֶת fonctionne ici comme préposition d’accompagnement, et non comme marque de l’objet direct.
- source_word: וְ/לָמָּה
  choice: Pourquoi … ?
  rationale: La conjonction introduit une question rhétorique exprimant le refus courtois d’une faveur royale; il n’est pas nécessaire de rendre וְ séparément en français.
- source_word: יִגְמְלֵ/נִי
  choice: m’accorderait-il
  rationale: Le verbe גמל évoque ici le fait de traiter quelqu’un en retour ou de le récompenser. « Accorder » s’associe naturellement à « récompense » tout en évitant une répétition lourde.
- source_word: הַ/גְּמוּלָה הַ/זֹּאת
  choice: une telle récompense
  rationale: Le nom désigne une rétribution ou une faveur accordée en retour. « Une telle récompense » exprime naturellement la valeur contextuelle de la construction définie avec le démonstratif.
