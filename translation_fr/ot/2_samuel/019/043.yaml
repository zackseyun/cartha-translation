  text: וַ/יַּעַן֩ כָּל אִ֨ישׁ יְהוּדָ֜ה עַל אִ֣ישׁ יִשְׂרָאֵ֗ל כִּֽי קָר֤וֹב הַ/מֶּ֨לֶךְ֙ אֵלַ֔/י וְ/לָ֤/מָּה זֶּה֙ חָרָ֣ה לְ/ךָ֔ עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה הֶ/אָכ֤וֹל אָכַ֨לְנוּ֙ מִן הַ/מֶּ֔לֶךְ אִם נִשֵּׂ֥את נִשָּׂ֖א לָֽ/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: fr
  text: 'Alors tous les hommes de Juda répondirent aux hommes d’Israël[a] : « C’est parce que le roi est notre proche parent[b]. Pourquoi donc vous êtes-vous irrités à ce sujet ? Avons-nous seulement mangé aux frais du roi ? Ou avons-nous reçu quelque présent[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « à l’homme d’Israël » ; le singulier a ici un sens collectif.
    reason: Précision grammaticale sur le singulier collectif.
  - marker: b
    text: L’hébreu dit littéralement « le roi est proche de moi » ; il s’agit probablement d’une proximité familiale ou tribale.
    reason: Préserver la portée possible de קָרוֹב et signaler la formulation littérale.
  - marker: c
    text: 'La dernière expression hébraïque est difficile. Elle peut aussi se comprendre : « quelque chose nous a-t-il été apporté ou donné ? »'
    reason: Signaler l’ambiguïté de אִם נִשֵּׂאת נִשָּׂא לָנוּ et l’interprétation contextuelle retenue.
lexical_decisions:
- source_word: וַיַּעַן
  choice: Alors ... répondirent
  rationale: Le wayyiqtol fait progresser le récit et introduit une réplique; « Alors » rend naturellement cette succession en français.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: tous les hommes de Juda
  rationale: Le singulier distributif hébreu désigne collectivement les hommes de Juda; le pluriel est la formulation française naturelle.
- source_word: עַל אִישׁ יִשְׂרָאֵל
  choice: aux hommes d’Israël
  rationale: Après ענה, עַל indique ici la partie à laquelle la réponse est adressée. Le singulier collectif hébreu est rendu naturellement au pluriel.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: C’est parce que le roi est notre proche parent
  rationale: קָרוֹב exprime vraisemblablement la proximité familiale ou tribale. Le passage du singulier collectif « moi » à « notre » convient en français au groupe de Juda qui parle.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: Pourquoi donc vous êtes-vous irrités à ce sujet ?
  rationale: חָרָה est un idiome de colère; « s’irriter » conserve une tonalité digne. « À ce sujet » rend עַל הַדָּבָר הַזֶּה sans lourdeur.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: Avons-nous seulement mangé aux frais du roi ?
  rationale: L’infinitif absolu avec le verbe conjugué renforce la question; « seulement » en restitue l’insistance. « Aux frais du roi » exprime ici l’idée d’un avantage matériel reçu de lui.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: Ou avons-nous reçu quelque présent ?
  rationale: La clause hébraïque est difficile. Dans le parallélisme, elle nie probablement qu’un avantage ou présent leur ait été attribué; cette formulation française reste prudente et naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les pluriels collectifs rendent naturellement l’échange entre Juda et Israël. La dernière question conserve par une note de décision, plutôt que par une formulation artificielle, la difficulté de l’hébreu.
