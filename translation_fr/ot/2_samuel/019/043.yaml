    rationale: La formulation « Ou avons-nous reçu quelque présent ? » est une interprétation plausible du parallélisme, mais אִם נִשֵּׂאת נִשָּׂא לָנוּ est textuellement difficile. Une note à cet endroit préserve l’incertitude sans alourdir le texte courant.
