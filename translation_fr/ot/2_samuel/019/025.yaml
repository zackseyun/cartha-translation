source:
  edition: WLC
  text: וּ/מְפִבֹ֨שֶׁת֙ בֶּן שָׁא֔וּל יָרַ֖ד לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וְ/לֹא עָשָׂ֨ה רַגְלָ֜י/ו וְ/לֹא עָשָׂ֣ה שְׂפָמ֗/וֹ וְ/אֶת בְּגָדָי/ו֙ לֹ֣א כִבֵּ֔ס לְ/מִן הַ/יּוֹם֙ לֶ֣כֶת הַ/מֶּ֔לֶךְ עַד הַ/יּ֖וֹם אֲשֶׁר בָּ֥א בְ/שָׁלֽוֹם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: fr
  text: Mefibosheth, fils de Saül, descendit à la rencontre du roi. Il n’avait pris soin ni de ses pieds[a] ni de sa moustache[b], et il n’avait pas lavé ses vêtements depuis le jour où le roi était parti jusqu’au jour où celui-ci revint sain et sauf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’avait pas fait ses pieds ». L’expression évoque probablement l’absence de soins ordinaires apportés aux pieds.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il n’avait pas entretenu les poils de sa lèvre supérieure ». Le terme hébreu désigne précisément la région de la lèvre supérieure, et non nécessairement toute la barbe.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « revint en paix ». L’expression hébraïque peut aussi signifier qu’il revint sans dommage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: descendit
  rationale: Le verbe indique littéralement un mouvement vers le bas; le français conserve cette donnée géographique sans préciser un point de vue absent du contexte immédiat.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: à la rencontre du roi
  rationale: Expression française naturelle correspondant à l’idée de se déplacer pour rencontrer quelqu’un.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: Il n’avait pris soin ni de ses pieds
  rationale: L’hébreu dit littéralement « faire ses pieds ». La formulation retenue exprime une négligence des soins ordinaires tout en évitant de préciser un geste incertain.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: ni de sa moustache
  rationale: שָׂפָם désigne la région pileuse de la lèvre supérieure. Répéter « prendre soin de » préserve l’indétermination du verbe עשה plutôt que d’imposer l’idée précise de tailler.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: et il n’avait pas lavé ses vêtements
  rationale: כבס désigne clairement le lavage des vêtements; cette tournure est courante et précise en français moderne.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: depuis le jour où le roi était parti
  rationale: La construction temporelle marque le point de départ de la période; « était parti » est naturel dans ce récit au passé.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: jusqu’au jour où celui-ci revint sain et sauf
  rationale: בשלום peut évoquer une venue en paix ou une arrivée sans dommage. « Sain et sauf » rend ici naturellement la sécurité du retour, tandis qu’une note conserve l’autre nuance.
