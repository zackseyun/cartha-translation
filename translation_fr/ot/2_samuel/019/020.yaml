  to: 'Il dit au roi : « Que mon seigneur ne me tienne pas pour coupable[a] et ne se souvienne pas de la faute que ton serviteur a commise le jour où mon seigneur le roi a quitté Jérusalem, sans que le roi ne la prenne à cœur[b]. »'
