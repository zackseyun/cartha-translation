  text: וַ/יֹּ֣אמֶר אֶל הַ/מֶּ֗לֶךְ אַל יַחֲשָׁב לִ֣/י אֲדֹנִ/י֮ עָוֺן֒ וְ/אַל תִּזְכֹּ֗ר אֵ֚ת אֲשֶׁ֣ר הֶעֱוָ֣ה עַבְדְּ/ךָ֔ בַּ/יּ֕וֹם אֲשֶׁר יָׄצָ֥ׄאׄ אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ מִ/ירֽוּשָׁלִָ֑ם לָ/שׂ֥וּם הַ/מֶּ֖לֶךְ אֶל לִבּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: fr
  text: 'Il dit au roi : « Que mon seigneur ne me tienne pas pour coupable[a] et ne se souvienne pas de la faute que ton serviteur a commise le jour où mon seigneur le roi a quitté Jérusalem, sans que le roi ne la prenne à cœur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne compte pas de faute à mon compte » ou « ne m’impute pas de faute ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la mette sur son cœur » ; cette expression peut signifier y attacher de l’importance ou la garder contre quelqu’un.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: ne me tienne pas pour coupable
  rationale: L’expression hébraïque évoque littéralement le fait de compter ou d’imputer une faute à quelqu’un. Cette formulation française garde la portée judiciaire et relationnelle de la supplication sans recourir à un vocabulaire trop technique.
- source_word: תִּזְכֹּר
  choice: se souvienne
  rationale: Le verbe est rendu directement. Dans le contexte, se souvenir implique que le roi pourrait tenir compte de la faute et agir en conséquence, mais cette implication n’est pas explicitée davantage que dans l’hébreu.
- source_word: אֲשֶׁר הֶעֱוָה עַבְדְּךָ
  choice: du mal que ton serviteur a fait
  rationale: Le hifil de עוה désigne ici une mauvaise action. « Le mal que… a fait » exprime clairement l’aveu, tandis que « ton serviteur » conserve la déférence de l’adresse à la cour.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: a quitté Jérusalem
  rationale: Dans ce contexte narratif, cette expression rend naturellement le départ du roi hors de la ville, sans alourdir le français par un calque.
- source_word: לָשׂוּם הַמֶּלֶךְ אֶל לִבּוֹ
  choice: au point que le roi le prenne à cœur
  rationale: L’idiome signifie mettre une chose sur son cœur, donc lui accorder une importance durable ou la garder contre quelqu’un. « Prendre à cœur » en conserve l’image et la force.
- source_word: אֲדֹנִי / הַמֶּלֶךְ
  choice: mon seigneur / le roi
  rationale: Ces titres distincts et leur répétition sont maintenus afin de préserver le ton déférent et la manière indirecte de parler au souverain.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. La répétition courtisane de « mon seigneur », « ton serviteur » et « le roi » est conservée. La construction « au point que » laisse subsister le lien syntaxique un peu ouvert entre le souvenir de la faute et le fait de la prendre à cœur.
