base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: fr
  text: Barzillaï le Galaadite était descendu de Roguelim. Il traversa le Jourdain avec le roi pour prendre congé de lui au Jourdain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il descendit de Roguelim et traversa avec le roi le Jourdain pour le reconduire. » La construction hébraïque permet diverses manières de rendre l’accompagnement du roi lors de la traversée et la prise de congé au Jourdain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: Barzillaï
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: הַגִּלְעָדִי
  choice: le Galaadite
  rationale: Le gentilé désigne l’origine régionale de Barzillaï; cette forme est concise et traditionnelle en français moderne.
- source_word: יָרַד מֵרֹגְלִים
  choice: était descendu de Roguelim
  rationale: Le plus-que-parfait situe naturellement cette venue avant l’action narrative suivante; « descendre » conserve l’image spatiale de l’hébreu.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: Il traversa le Jourdain avec le roi
  rationale: עבר exprime ici la traversée; bien que אֶת marque ordinairement l’objet direct, le contexte indique que Barzillaï accompagne le roi dans la traversée.
- source_word: לְשַׁלְּחוֹ
  choice: pour l’accompagner jusqu’au moment de son départ
  rationale: L’infinitif exprime le but. La formulation française rend l’idée de conduire quelqu’un en prenant congé, sans réduire le sens à un simple adieu verbal.
- source_word: אֶת בַּיַּרְדֵּן
  choice: au bord du Jourdain
  rationale: Le syntagme final, textuellement difficile, semble localiser la prise de congé au Jourdain; « au bord » fournit une expression française naturelle tout en évitant de répéter une seconde traversée.
