base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/031.yaml
  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: fr
  text: 'Méphibosheth dit au roi : « Qu’il prenne même tout, puisque mon seigneur le roi est rentré sain et sauf chez lui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר est la formule narrative ordinaire et se rend naturellement par « dit ».
- source_word: מְפִיבֹשֶׁת
  choice: Méphibosheth
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: אֶל הַמֶּלֶךְ
  choice: au roi
  rationale: Conserve le titre défini du texte hébreu sans ajouter le nom de David.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: Qu’il prenne même tout
  rationale: L’imparfait a ici une valeur jussive de concession, tandis que גַּם souligne que Méphibosheth abandonne jusqu’à la totalité du bien contesté.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: puisque
  rationale: Dans ce contexte, la locution introduit le motif de la concession tout en reposant sur un fait désormais accompli; « puisque » exprime clairement cette relation causale.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Préserve la formule respectueuse de cour sans la moderniser excessivement.
- source_word: בְּשָׁלוֹם
  choice: sain et sauf
  rationale: Dans le contexte du retour du roi après une crise, l’expression désigne son retour en sécurité et sans dommage; cette tournure française est naturelle.
- source_word: אֶל בֵּיתוֹ
  choice: chez lui
  rationale: Rend idiomatiquement le retour du roi à sa propre demeure, sans surcharger la formulation française.
