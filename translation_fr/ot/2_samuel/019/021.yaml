base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: fr
  text: Car ton serviteur sait qu’il a péché. Et voici que je suis venu aujourd’hui le premier de toute la maison de Joseph[a][b], pour descendre à la rencontre de mon seigneur le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « maison de Joseph » désigne ici les tribus issues de Joseph, notamment les groupes du Nord associés à Éphraïm et Manassé.
    reason: cultural_note
  - marker: b
    text: 'Ou : « le premier venu de toute la maison de Joseph ». La construction hébraïque peut indiquer qu’il fut le premier, parmi tout le groupe de Joseph, à descendre à la rencontre du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison donnée par Shiméï à l’appui de sa demande et assure naturellement le lien avec le contexte précédent.
- source_word: יָדַע עַבְדְּךָ
  choice: ton serviteur sait
  rationale: Conserve l’autodésignation déférente propre au langage de cour et rend l’accompli hébreu comme un état présent de pleine conscience.
- source_word: חָטָאתִי
  choice: j’ai péché
  rationale: Préserve la portée morale du verbe חטא et présente la faute passée comme reconnue dans le présent.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Garde la fonction déictique et emphatique de l’expression dans un français digne et encore courant.
- source_word: בָאתִי הַיּוֹם רִאשׁוֹן
  choice: je suis venu aujourd’hui le premier
  rationale: Exprime le résultat présent de la venue et rend רִאשׁוֹן comme un prédicatif lié au locuteur.
- source_word: לְכָל בֵּית יוֹסֵף
  choice: de toute la maison de Joseph
  rationale: Conserve la désignation collective traditionnelle et l’idée que le locuteur est le premier au sein de cet ensemble, tout en signalant en note l’autre analyse possible de לְ.
- source_word: לָרֶדֶת לִקְרַאת
  choice: pour descendre à la rencontre de
  rationale: Maintient la notion topographique de descente et rend idiomatiquement le mouvement vers le roi.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Reproduit le titre royal déférent sans l’alourdir ni en modifier la portée.
theological_decisions:
- issue: Portée de « maison de Joseph »
  choice: Maintien de la désignation « maison de Joseph » dans le texte
  alternative: Remplacer par « tribus du Nord » ou « maison d’Éphraïm »
  rationale: Le texte hébreu emploie une désignation tribale collective dont l’étendue exacte dépend du contexte; la traduction ne doit pas la réduire silencieusement à une seule identification.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement dans « ton serviteur » suit l’adresse directe au roi et reste compatible avec la forte déférence exprimée par le titre « mon seigneur le roi ». « Et voici » conserve l’appel d’attention de l’hébreu sans recourir à une tournure excessivement archaïque.
