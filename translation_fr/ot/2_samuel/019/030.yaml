  text: וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה תְּדַבֵּ֥ר ע֖וֹד דְּבָרֶ֑י/ךָ אָמַ֕רְתִּי אַתָּ֣ה וְ/צִיבָ֔א תַּחְלְק֖וּ אֶת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: fr
  text: 'Alors le roi lui dit : « Pourquoi continuer à parler de ton affaire ? J’ai décidé[a] : toi et Tsiba, vous vous partagerez les terres[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « J’ai dit. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le champ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: Alors le roi lui dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » marque naturellement la succession en français.
- source_word: לָמָּה תְּדַבֵּר עוֹד
  choice: Pourquoi continuer à parler
  rationale: La tournure rend la poursuite du discours et l’impatience perceptible du roi, sans l’accentuer indûment.
- source_word: דְּבָרֶיךָ
  choice: de ton affaire
  rationale: Dans ce contexte de litige, דְּבָרֶיךָ désigne l’affaire ou les prétentions de l’interlocuteur plutôt que ses seules paroles.
- source_word: אָמַרְתִּי
  choice: J’ai décidé
  rationale: Littéralement « j’ai dit » ; ici, la parole royale a valeur de décision arrêtée. La note conserve le rendu formel.
- source_word: אַתָּה וְצִיבָא
  choice: toi et Tsiba
  rationale: Le pronom est maintenu pour l’emphase, et « Tsiba » représente directement la consonne initiale צ en français.
- source_word: תַּחְלְקוּ
  choice: vous vous partagerez
  rationale: L’inaccompli exprime ici la décision ou directive du roi ; le futur français en restitue l’autorité tout en restant naturel.
- source_word: הַשָּׂדֶה
  choice: les terres
  rationale: Le singulier collectif désigne vraisemblablement le domaine foncier en litige ; « les terres » est idiomatique, tandis que la note conserve le sens littéral.
