base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: fr
  text: 'Ainsi, ce jour-là, la victoire se transforma en deuil pour tout le peuple[a], car, ce jour-là, le peuple entendit dire[b] : « Le roi est affligé pour son fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce jour-là, la délivrance fut changée en deuil ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le peuple entendit ce jour-là, disant » ; tournure hébraïque introduisant une information rapportée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: la victoire
  rationale: Dans ce contexte militaire, תְּשׁוּעָה désigne l’issue favorable du combat. « Victoire » est naturel en français, tandis que « salut » risquerait une connotation théologique absente ici et que « délivrance » mettrait davantage l’accent sur le secours.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: se transforma en deuil
  rationale: La tournure hébraïque exprime le passage paradoxal de la victoire au deuil. Cette formulation française rend clairement ce renversement sans surinterpréter son mécanisme.
- source_word: אֵבֶל
  choice: deuil
  rationale: אֵבֶל évoque un deuil manifeste et collectif, ce qui convient mieux à la scène publique que le terme plus intérieur « chagrin ».
- source_word: הָעָם
  choice: le peuple
  rationale: Même si le contexte vise notamment les combattants de David, l’hébreu emploie le terme général עָם. « Le peuple » en préserve l’étendue possible.
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: car le peuple avait entendu dire
  rationale: La construction שָׁמַע + לֵאמֹר introduit ici une information rapportée. « Entendre dire » est l’équivalent idiomatique français de l’hébreu littéral « entendre, en disant ».
- source_word: נֶעֱצַב
  choice: est accablé de chagrin
  rationale: Le niphal de עצב décrit le roi comme profondément peiné ou affligé. « Accablé de chagrin » garde la force affective du terme dans un français naturel et digne.
- source_word: עַל בְּנוֹ
  choice: à cause de son fils
  rationale: Avec עצב, עַל indique la personne qui occasionne le chagrin. « À cause de son fils » est clair tout en laissant le contexte préciser qu’il s’agit de sa mort.
