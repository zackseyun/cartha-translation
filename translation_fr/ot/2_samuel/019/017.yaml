  text: וַ/יְמַהֵ֗ר שִׁמְעִ֤י בֶן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אֲשֶׁ֖ר מִ/בַּֽחוּרִ֑ים וַ/יֵּ֨רֶד֙ עִם אִ֣ישׁ יְהוּדָ֔ה לִ/קְרַ֖את הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: fr
  text: Shiméï, fils de Guéra, le Benjaminite originaire de Bahourim, se dépêcha et descendit avec les hommes de Juda[a] à la rencontre du roi David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec l’homme de Juda » ; le singulier est compris ici dans un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: se dépêcha
  rationale: Le verbe exprime la hâte ou l’empressement. « Se dépêcha » est naturel en français moderne et conserve la dynamique du récit.
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: Shiméï, fils de Guéra
  rationale: Les noms sont translittérés selon leurs formes françaises usuelles, et « fils de » reproduit clairement le patronyme hébreu.
- source_word: בֶּן הַיְמִינִי
  choice: le Benjaminite
  rationale: Dans ce contexte, l’expression désigne l’appartenance tribale de Shiméï plutôt qu’un second patronyme immédiat.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: originaire de Bahourim
  rationale: La proposition relative indique le lieu d’origine de Shiméï. Cette formulation appositive est concise et naturelle en français.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe décrit littéralement un mouvement vers le bas, probablement topographique. « Descendit » en conserve le sens concret.
- source_word: עִם אִישׁ יְהוּדָה
  choice: avec les hommes de Juda
  rationale: Bien que אִישׁ soit morphologiquement singulier, l’expression peut avoir une valeur collective. Le contexte d’un groupe venu à la rencontre du roi favorise le pluriel français, tout en signalant la forme littérale en note.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: La préposition exprime un déplacement en vue d’une rencontre. « À la rencontre de » rend directement ce mouvement intentionnel.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette construction est idiomatique en français et conserve à la fois le titre royal et le nom propre.
