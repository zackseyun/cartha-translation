  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: fr
  text: 'Le roi se couvrit le visage[a] et cria d’une voix forte : « Mon fils Absalom ! Absalom, mon fils, mon fils ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se voila le visage ». Le verbe hébreu évoque le fait de se couvrir le visage dans le deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: se couvrit
  rationale: Le verbe désigne ici l’action de couvrir ou d’envelopper, avec « son visage » comme complément. « Se couvrit le visage » est naturel en français et convient au contexte de deuil sans préciser indûment la manière.
- source_word: פָּנָיו
  choice: le visage
  rationale: Dans cette construction avec la marque de l’objet direct, le sens concret « son visage » est requis. En français, le possessif se rend naturellement par l’article défini après le verbe pronominal.
- source_word: וַיִּזְעַק
  choice: cria
  rationale: Le verbe exprime un cri puissant. « Cria » conserve l’intensité tout en laissant le contexte indiquer qu’il s’agit d’un cri de douleur, sans ajouter la nuance plus interprétative de « se lamenta ».
- source_word: קוֹל גָּדוֹל
  choice: d’une voix forte
  rationale: Cette tournure rend naturellement l’expression hébraïque « d’une grande voix » tout en préservant son insistance sur le volume du cri.
- source_word: בְּנִי
  choice: mon fils
  rationale: Le nom masculin singulier avec suffixe de première personne désigne précisément Absalom comme fils de David. La répétition est conservée pour rendre la force du deuil.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: repetition of אַבְשָׁלוֹם / בְּנִי
  choice: « Mon fils Absalom ! Absalom, mon fils, mon fils ! »
  rationale: Toutes les répétitions de l’hébreu sont maintenues. La ponctuation française fait entendre la lamentation sans lisser sa formulation brisée et insistante.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche de l’hébreu, tandis que « se couvrit le visage » et « d’une voix forte » assurent une expression idiomatique. La répétition émotionnelle est intégralement préservée.
