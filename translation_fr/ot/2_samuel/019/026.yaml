base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: fr
  text: 'Lorsqu’il arriva à Jérusalem à la rencontre du roi, le roi lui dit : « Pourquoi n’es-tu pas parti avec moi, Mefibosheth ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Lorsqu’il
  rationale: La formule narrative introduit ici une circonstance temporelle. « Lorsqu’il » rend naturellement l’enchaînement sans conserver le tour hébraïque plus lourd « il arriva que ».
- source_word: בָא יְרוּשָׁלַם
  choice: arriva à Jérusalem
  rationale: בוא exprime ici l’arrivée à Jérusalem. « Arriva à » est naturel en français et explicite correctement le mouvement vers la ville.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: à la rencontre du roi
  rationale: לקראת désigne le mouvement ou la démarche en vue de rencontrer quelqu’un. Cette expression française conserve cette nuance mieux que le simple « pour rencontrer ».
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: le roi lui dit
  rationale: Le sujet explicite répété dans l’hébreu est maintenu, tout en adoptant l’ordre naturel du français.
- source_word: לָמָּה לֹא הָלַכְתָּ עִמִּי
  choice: Pourquoi n’es-tu pas parti avec moi
  rationale: הלך signifie littéralement « aller », mais, dans ce contexte, David évoque son départ antérieur. « Partir avec moi » conserve ce point de vue et sonne plus naturellement en français que « aller avec moi ».
- source_word: מְפִיבֹשֶׁת
  choice: Mefibosheth
  rationale: Translittération française moderne du nom hébreu, sans accent ajouté absent de la forme source.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. « À la rencontre du roi » garde la nuance directionnelle de l’hébreu, tandis que « parti avec moi » exprime naturellement en français le verbe de mouvement depuis la perspective du départ de David.
