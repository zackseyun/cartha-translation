  text: בֶּן שְׁמֹנִ֣ים שָׁנָה֩ אָנֹכִ֨י הַ/יּ֜וֹם הַ/אֵדַ֣ע בֵּין ט֣וֹב לְ/רָ֗ע אִם יִטְעַ֤ם עַבְדְּ/ךָ֙ אֶת אֲשֶׁ֤ר אֹכַל֙ וְ/אֶת אֲשֶׁ֣ר אֶשְׁתֶּ֔ה אִם אֶשְׁמַ֣ע ע֔וֹד בְּ/ק֖וֹל שָׁרִ֣ים וְ/שָׁר֑וֹת וְ/לָ/מָּה֩ יִֽהְיֶ֨ה עַבְדְּ/ךָ֥ עוֹד֙ לְ/מַשָּׂ֔א אֶל אֲדֹנִ֖/י הַ/מֶּֽלֶךְ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: fr
  text: J’ai aujourd’hui quatre-vingts ans. Puis-je encore distinguer le bien du mal[a] ? Ton serviteur peut-il encore goûter ce que je mange et ce que je bois ? Puis-je encore entendre la voix des chanteurs et des chanteuses ? Pourquoi donc ton serviteur serait-il encore une charge pour mon seigneur le roi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « discerner ce qui est bon de ce qui est mauvais ». L’expression hébraïque peut désigner le discernement moral ou pratique ; ici, le contexte de la vieillesse et de l’affaiblissement des sens suggère plus largement une diminution de la faculté de juger.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: J’ai aujourd’hui quatre-vingts ans
  rationale: L’hébreu emploie l’expression idiomatique « fils de quatre-vingts ans » pour indiquer l’âge. La tournure française retenue est naturelle et conserve הַיּוֹם, « aujourd’hui ».
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: Puis-je encore distinguer le bien du mal ?
  rationale: ידע בין exprime ici la capacité de discerner ou de distinguer. « Le bien du mal » préserve la formulation hébraïque traditionnelle tout en laissant ouverte sa portée morale ou pratique; « encore » explicite naturellement le déclin lié à l’âge dans cette série de questions.
- source_word: אִם יִטְעַם עַבְדְּךָ
  choice: Ton serviteur peut-il encore goûter
  rationale: Dans ce contexte, אִם introduit une question rhétorique plutôt qu’une simple condition. טעם désigne la faculté de goûter, et « ton serviteur » rend l’auto-désignation respectueuse adressée au roi.
- source_word: אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: ce qu’il mange et ce qu’il boit
  rationale: Le passage à la troisième personne suit naturellement l’auto-désignation « ton serviteur » en français et évite une rupture grammaticale, sans modifier le référent.
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: Puis-je encore entendre la voix des chanteurs et des chanteuses ?
  rationale: La traduction conserve עוֹד, « encore », ainsi que la distinction explicite entre les formes masculine et féminine שָׁרִים et שָׁרוֹת.
- source_word: לְמַשָּׂא
  choice: une charge
  rationale: Le nom désigne ici métaphoriquement un poids ou un fardeau imposé au roi. « Une charge » est idiomatique en français pour une personne dont il faudrait s’occuper.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Formule de cour adressée à un roi humain; « seigneur » reste donc en minuscule.
theological_decisions:
- issue: Portée de טוֹב לְרָע
  choice: le bien du mal
  alternative: ce qui est bon de ce qui est mauvais
  rationale: La formulation retenue correspond étroitement aux termes hébreux et préserve leur possible dimension morale, tandis que le contexte de vieillesse permet aussi une lecture plus générale portant sur le jugement pratique. La note signale cette amplitude sans la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques et l’adresse respectueuse au roi sont conservées. La répétition de « encore » souligne la perte des facultés évoquée dans le texte, et les chanteurs comme les chanteuses restent explicitement mentionnés.
