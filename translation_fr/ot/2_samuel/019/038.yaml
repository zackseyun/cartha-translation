  text: יָֽשָׁב נָ֤א עַבְדְּ/ךָ֙ וְ/אָמֻ֣ת בְּ/עִירִ֔/י עִ֛ם קֶ֥בֶר אָבִ֖/י וְ/אִמִּ֑/י וְ/הִנֵּ֣ה עַבְדְּ/ךָ֣ כִמְהָ֗ם יַֽעֲבֹר֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/עֲשֵׂה ל֕/וֹ אֵ֥ת אֲשֶׁר ט֖וֹב בְּ/עֵינֶֽי/ךָ־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: fr
  text: 'Que ton serviteur retourne, je te prie, afin que je meure dans ma ville, près de la tombe de mon père et de ma mère.[a] Mais voici ton serviteur Kimham : qu’il traverse avec mon seigneur le roi, et fais pour lui ce qui est bon à tes yeux.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec la tombe de mon père et de ma mère »; dans ce contexte, le sens est probablement « près de la tombe », en vue d’une sépulture dans le lieu familial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce qui te semblera bon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: Que … retourne, je te prie
  rationale: Le qal de שׁוּב exprime ici le retour, tandis que נָא donne à la demande une nuance polie. Cette tournure conserve à la fois la valeur jussive et la déférence du propos.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette adresse respectueuse de Barzillaï au roi, le terme fonctionne comme une formule de déférence plutôt que comme une mise en avant du statut d’esclave.
- source_word: וְאָמֻת
  choice: afin que je meure
  rationale: Après la demande de retour, la conjonction suivie de l’imparfait peut naturellement exprimer le but. « Afin que » rend clairement ce rapport sans effacer la proximité formelle avec une simple coordination.
- source_word: בְּעִירִי
  choice: dans ma ville
  rationale: La formulation française rend directement le suffixe possessif de première personne sans ajouter l’insistance de « ma propre ville », absente de l’hébreu.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: près de la tombe de mon père et de ma mère
  rationale: עִם signifie ordinairement « avec », mais le contexte funéraire appelle ici une relation de proximité. « Près de » exprime naturellement le désir de mourir au lieu de sépulture familial; une note conserve la formulation plus littérale.
- source_word: וְהִנֵּה
  choice: Mais voici
  rationale: הִנֵּה a une valeur présentative. « Mais » fait ressortir le contraste contextuel entre le retour demandé par Barzillaï et la proposition concernant Kimham.
- source_word: כִמְהָם
  choice: Kimham
  rationale: Le nom propre est translittéré selon une forme française simple et proche de l’hébreu.
- source_word: יַעֲבֹר עִם
  choice: qu’il traverse avec
  rationale: L’imparfait a ici une valeur jussive. « Traverse » maintient le motif narratif du passage du Jourdain.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette formule conserve le registre respectueux et cérémonieux de l’adresse au roi.
- source_word: וַעֲשֵׂה לוֹ
  choice: et fais pour lui
  rationale: La construction de עשה avec ל peut désigner ce que l’on fait en faveur de quelqu’un. « Pour lui » évite l’ambiguïté potentiellement négative de « fais-lui ».
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: ce qui est bon à tes yeux
  rationale: Cette traduction garde l’image idiomatique hébraïque tout en restant claire en français moderne.
theological_decisions: []
