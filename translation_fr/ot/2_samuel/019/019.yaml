  text: וְ/עָבְרָ֣ה הָ/עֲבָרָ֗ה לַֽ/עֲבִיר֙ אֶת בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/לַ/עֲשׂ֥וֹת הַ/טּ֖וֹב ב/עינ/ו וְ/שִׁמְעִ֣י בֶן גֵּרָ֗א נָפַל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ בְּ/עָבְר֖/וֹ בַּ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: fr
  text: Le bac traversa pour faire passer la maison du roi[b] et faire ce qui lui plaisait[c]. Shiméï, fils de Guéra, se jeta aux pieds du roi au moment où celui-ci traversait le Jourdain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ici, « la maison du roi » désigne les membres de la maison royale ou la suite du roi, et non un bâtiment.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « faire le bien à ses yeux », c’est-à-dire faire ce qui lui plaisait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: le bac
  rationale: Le nom désigne ici le moyen utilisé pour traverser le fleuve, probablement un bac. Ce terme est concret et naturel en français.
- source_word: וְעָבְרָה
  choice: traversa
  rationale: Le parfait qal féminin singulier s'accorde avec הָעֲבָרָה. Le passé simple convient à la progression narrative sans imposer un plus-que-parfait.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: pour faire passer la maison du roi
  rationale: Le hiphil exprime la causation, « faire passer ». « Maison du roi » conserve l'expression hébraïque, avec une note précisant son sens collectif dans ce contexte.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: et faire ce qui lui plairait
  rationale: Cette formulation rend naturellement l'idiome hébreu littéral « faire le bien à ses yeux », c'est-à-dire agir selon le bon plaisir du roi.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: se jeta aux pieds du roi
  rationale: L'expression décrit ici un geste volontaire d'humiliation et de supplication. La tournure française communique clairement cette posture sans développer davantage le texte.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: au moment où celui-ci traversait le Jourdain
  rationale: L'infinitif construit marque le temps. « Celui-ci » rattache prudemment le suffixe masculin singulier au roi, antécédent masculin le plus proche.
theological_decisions:
- issue: Référent du suffixe dans בְּעָבְרוֹ
  choice: le roi
  alternative: Shiméï
  rationale: Le roi est l'antécédent masculin singulier explicite le plus proche et la scène décrit son passage du Jourdain. Le texte hébreu permet néanmoins une certaine ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, narratif et digne. « Bac » est courant et précis; « se jeta aux pieds » exprime naturellement la supplication. Les marqueurs suivent l'ordre d'apparition dans le verset.
