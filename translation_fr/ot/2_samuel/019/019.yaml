    issue: Conditionnel injustifié dans « faire ce qui lui plairait »
    rationale: L’hébreu porte l’infinitif וְלַעֲשׂוֹת, coordonné à « faire passer », suivi de l’idiome « ce qui est bon à ses yeux ». Il ne marque pas une éventualité ou une conséquence conditionnelle. « Faire ce qui lui plaisait » rend le sens idiomatique sans ajouter cette modalité.
