  text: וְ/הַ/מֶּ֣לֶךְ דָּוִ֗ד שָׁ֠לַח אֶל צָד֨וֹק וְ/אֶל אֶבְיָתָ֥ר הַ/כֹּהֲנִים֮ לֵ/אמֹר֒ דַּבְּר֞וּ אֶל זִקְנֵ֤י יְהוּדָה֙ לֵ/אמֹ֔ר לָ֤/מָּה תִֽהְיוּ֙ אַֽחֲרֹנִ֔ים לְ/הָשִׁ֥יב אֶת הַ/מֶּ֖לֶךְ אֶל בֵּית֑/וֹ וּ/דְבַר֙ כָּל יִשְׂרָאֵ֔ל בָּ֥א אֶל הַ/מֶּ֖לֶךְ אֶל בֵּיתֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: fr
  text: 'Le roi David fit dire aux prêtres Tsadok et Abiatar : « Parlez aux anciens de Juda en ces termes : “Pourquoi seriez-vous les derniers à ramener le roi dans sa demeure, alors que la parole de tout Israël[a] est parvenue au roi, dans sa demeure ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le message », « la proposition » ou « la requête de tout Israël ». L’expression hébraïque traduite par « la parole de tout Israël » est large et peut désigner une communication, une proposition ou une demande des tribus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: envoya un message à
  rationale: Avec אֶל suivi des destinataires, le verbe décrit ici l’envoi d’une communication. Cette formulation naturelle évite de laisser entendre que David convoque les prêtres.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Rend naturellement en français l’apposition hébraïque tout en conservant le titre royal.
- source_word: צָדוֹק וְאֶבְיָתָר הַכֹּהֲנִים
  choice: aux prêtres Tsadok et Abiatar
  rationale: L’antéposition de « prêtres » est idiomatique en français et identifie clairement leur fonction.
- source_word: דַּבְּרוּ אֶל
  choice: Parlez à
  rationale: Conserve la forme explicite du commandement hébreu sans la réduire au simple verbe « dire ».
- source_word: זִקְנֵי יְהוּדָה
  choice: les anciens de Juda
  rationale: Expression française courante pour les responsables politiques et communautaires désignés par le syntagme construit hébreu.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: Pourquoi seriez-vous les derniers
  rationale: Le conditionnel rend bien la question rhétorique et sa force d’exhortation, plutôt qu’une simple prédiction.
- source_word: לְהָשִׁיב
  choice: à ramener
  rationale: 'Exprime le sens causatif de שוב : il s’agit de faire revenir David après la révolte.'
- source_word: אֶת הַמֶּלֶךְ אֶל בֵּיתוֹ
  choice: le roi dans sa demeure
  rationale: « Demeure » conserve le sens large de בַּיִת comme résidence ou maison royale, sans préciser indûment « palais ».
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: alors que la parole de tout Israël
  rationale: « Parole » préserve l’étendue sémantique de דָּבָר, qui peut désigner une déclaration, un message, une proposition ou une requête. « Alors que » explicite sobrement le rapport contextuel entre les deux propositions.
- source_word: בָּא אֶל הַמֶּלֶךְ אֶל בֵּיתוֹ
  choice: est parvenue au roi, jusque dans sa demeure
  rationale: Le passé composé marque l’accompli pertinent dans le discours. « Jusque dans » rend le mouvement exprimé par אֶל tout en donnant en français un sens intelligible à la répétition de « sa demeure ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure de discours rapporté est maintenue, tandis que « envoya un message » évite une tournure française lourde. La répétition de « demeure », présente dans l’hébreu, est conservée malgré sa légère saillance stylistique. Les translittérations « Tsadok » et « Abiatar » suivent des formes françaises transparentes.
