review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement les principaux éléments du verset. Toutefois, « envoya un message » explicite un objet absent de l’hébreu, et « jusque dans sa demeure » renforce indûment le second אֶל (« jusqu’à »). La note doit aussi être ancrée sur l’expression qu’elle explique et éviter de présenter l’« appel » comme le seul sens possible.
  naturalness: Le français est globalement naturel et de registre approprié. « Fit dire aux prêtres » est une formulation idiomatique qui respecte mieux l’absence d’objet explicite après « envoya ». « Dans sa demeure » maintient la répétition du lieu sans la surcharge de « jusque ».
  terminology: « Le roi David », « prêtres », « anciens de Juda », « ramener » et « demeure » conviennent. Les formes Tsadok et Abiatar sont acceptables en français international. « Parole » conserve utilement l’ampleur de דָּבָר.
  issues:
  - severity: medium
    issue: « envoya un message » ajoute un objet explicite qui n’est pas formulé dans le texte hébreu.
    rationale: שָׁלַח אֶל introduit les destinataires sans nommer le message ni les messagers. « Fit dire aux prêtres » est une tournure française naturelle qui transmet l’acte de communication sans lexicaliser « message » comme objet du verbe.
  - severity: medium
    issue: « jusque dans sa demeure » est plus marqué que l’hébreu.
    rationale: Le second אֶל répète l’indication de destination ou de localisation liée à la demeure du roi; « jusque dans » suggère une insistance ou une pénétration que le texte ne marque pas nécessairement.
  - severity: low
    issue: L’appel de note est placé sur « demeure », alors que la note porte sur « la parole de tout Israël ».
    rationale: L’ancre doit suivre l’expression hébraïque expliquée, afin que le lien entre la note et le terme ambigu soit clair.
  - severity: low
    issue: La note décrit l’« appel des tribus invitant David à revenir » de façon trop déterminée.
    rationale: Le contexte peut orienter vers une demande ou une proposition, mais דְּבַר garde une portée large; la note doit préserver cette latitude.
