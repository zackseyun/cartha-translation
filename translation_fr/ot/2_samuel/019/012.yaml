revisions:
- from: 'Le roi David envoya un message aux prêtres Tsadok et Abiatar : « Parlez aux anciens de Juda et dites-leur : “Pourquoi seriez-vous les derniers à ramener le roi dans sa demeure, alors que la parole de tout Israël est parvenue au roi, jusque dans sa demeure[a] ?” »'
  to: 'Le roi David fit dire aux prêtres Tsadok et Abiatar : « Parlez aux anciens de Juda en ces termes : “Pourquoi seriez-vous les derniers à ramener le roi dans sa demeure, alors que la parole de tout Israël[a] est parvenue au roi, dans sa demeure ?” »'
  rationale: La révision supprime l’objet « message » ajouté après « envoya », atténue l’intensification non nécessaire de « jusque dans », et replace l’appel de note sur l’expression ambiguë qu’il éclaire. Elle conserve la structure du discours, la répétition de la demeure du roi et l’ambiguïté lexicale de דָּבָר.
