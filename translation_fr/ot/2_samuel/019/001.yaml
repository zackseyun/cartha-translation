  text: וַ/יִּרְגַּ֣ז הַ/מֶּ֗לֶךְ וַ/יַּ֛עַל עַל עֲלִיַּ֥ת הַ/שַּׁ֖עַר וַ/יֵּ֑בְךְּ וְ/כֹ֣ה אָמַ֣ר בְּ/לֶכְתּ֗/וֹ בְּנִ֤/י אַבְשָׁלוֹם֙ בְּנִ֣/י בְנִ֣/י אַבְשָׁל֔וֹם מִֽי יִתֵּ֤ן מוּתִ/י֙ אֲנִ֣י תַחְתֶּ֔י/ךָ אַבְשָׁל֖וֹם בְּנִ֥/י בְנִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: fr
  text: 'Alors le roi fut profondément bouleversé. Il monta dans la pièce située au-dessus de la porte et pleura. Tout en marchant, il disait : « Mon fils Absalom ! Mon fils, mon fils Absalom ! Si seulement j’étais mort à ta place ! Absalom, mon fils, mon fils ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: fut profondément bouleversé
  rationale: Le verbe רגז peut évoquer le tremblement, l’agitation ou un profond trouble. Dans ce contexte de deuil, « profondément bouleversé » rend naturellement l’intensité émotionnelle sans réduire le terme à une réaction physique.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: la pièce située au-dessus de la porte
  rationale: עֲלִיָּה désigne une pièce haute; le complément הַשַּׁעַר indique ici la porte monumentale de la ville ou de l’enceinte. Cette formulation conserve clairement la disposition architecturale.
- source_word: וַיֵּבְךְּ
  choice: pleura
  rationale: Le verbe בכה désigne le fait de pleurer; « pleura » convient au registre narratif digne du passage.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: Tout en marchant, il disait
  rationale: L’infinitif avec suffixe situe les paroles pendant son déplacement, tandis que l’imparfait français « disait » suggère que la lamentation accompagne sa marche et peut être répétée.
- source_word: בְּנִי
  choice: mon fils
  rationale: Toutes les répétitions sont maintenues, car elles portent le rythme et la force affective de la lamentation.
- source_word: מִי יִתֵּן
  choice: Si seulement
  rationale: L’expression hébraïque, littéralement « qui donnera ? », est un idiome optatif. « Si seulement » en restitue directement le souhait irréalisable en français moderne.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: j’étais mort à ta place
  rationale: La construction exprime le souhait rétrospectif que David soit mort en remplacement d’Absalom; le plus-que-parfait français rend ce contrefactuel.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: La forme française traditionnelle et largement reconnue du nom biblique est conservée.
theological_decisions: []
