base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: fr
  text: 'On rapporta à Joab : « Voici que le roi pleure et porte le deuil d’Absalom. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On rapporta
  rationale: Le hophal exprime une information communiquée à Joab sans en nommer l’auteur. La tournure française avec « on » conserve cet agent indéterminé tout en restant naturelle.
- source_word: לְיוֹאָב
  choice: à Joab
  rationale: La préposition et le nom propre sont rendus directement.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette tournure attire l’attention sur le contenu du rapport et préserve la vivacité de la particule hébraïque dans un registre français digne et actuel.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le titre défini employé dans le texte est conservé plutôt que remplacé par le nom de David.
- source_word: בֹּכֶה
  choice: pleure
  rationale: Le présent français rend naturellement l’action en cours exprimée par le participe hébreu.
- source_word: וַיִּתְאַבֵּל
  choice: porte le deuil
  rationale: Le verbe hitpael de אבל désigne l’action de prendre ou de porter le deuil. Cette expression française conserve son sens de deuil lié à une mort, sans le réduire à une tristesse générale.
- source_word: עַל אַבְשָׁלֹם
  choice: d’Absalom
  rationale: Avec un verbe de deuil, עַל indique la personne qui en est l’objet ou la cause. En français, « porter le deuil de quelqu’un » est la formulation idiomatique correspondante.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le titre « le roi », l’agent indéterminé du rapport et l’idée précise de deuil, sans explicitation théologique ajoutée.
