  text: וַ/יֹּ֧אמֶר הַ/מֶּ֛לֶךְ אֶל שִׁמְעִ֖י לֹ֣א תָמ֑וּת וַ/יִּשָּׁ֥בַֽע ל֖/וֹ הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: fr
  text: 'Le roi dit à Shiméï : « Tu ne mourras pas[a]. » Et le roi le lui jura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « Tu ne seras pas mis à mort. » L’hébreu dit littéralement : « Tu ne mourras pas », expression qui peut avoir ici la valeur d’une promesse royale de ne pas le faire exécuter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר fait avancer le récit. En français, le passé simple exprime naturellement cette succession narrative sans qu’il soit nécessaire de rendre וַ par « et ».
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne le roi déjà connu dans le contexte.
- source_word: אֶל שִׁמְעִי
  choice: à Shiméï
  rationale: La préposition אֶל indique ici le destinataire des paroles. « Shiméï » est une translittération française usuelle du nom propre.
- source_word: לֹא תָמוּת
  choice: Tu ne mourras pas
  rationale: Le verbe à l’inaccompli précédé de la négation exprime ici une assurance ou une décision royale solennelle. Cette traduction conserve la formulation directe de l’hébreu sans préciser explicitement qu’il s’agit d’une exemption d’exécution.
- source_word: וַיִּשָּׁבַע
  choice: jura
  rationale: Le niphal de שבע signifie « jurer, prêter serment ». Le passé simple convient à la narration et « jura » reste concis et naturel.
- source_word: לוֹ
  choice: le lui
  rationale: Le pronom renvoie à Shiméï. Dans « le lui jura », « lui » rend le bénéficiaire du serment, tandis que « le » reprend naturellement en français la promesse qui vient d’être formulée.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple maintient la dignité du récit biblique tout en restant courant à l’écrit. La formulation littérale « Tu ne mourras pas » préserve l’ambiguïté entre une assurance générale de survie et une grâce royale concernant l’exécution.
