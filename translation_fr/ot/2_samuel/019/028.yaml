  text: וַ/יְרַגֵּ֣ל בְּ/עַבְדְּ/ךָ֔ אֶל אֲדֹנִ֖/י הַ/מֶּ֑לֶךְ וַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים וַ/עֲשֵׂ֥ה הַ/טּ֖וֹב בְּ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: fr
  text: Il a calomnié ton serviteur auprès de mon seigneur le roi. Mais mon seigneur le roi est comme l’ange de Dieu ; fais donc ce qui te paraît bon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: Il a calomnié
  rationale: Le verbe רגל au piel signifie ici porter des accusations malveillantes ou calomnier quelqu’un ; cette formulation naturelle conserve la gravité de l’acte.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: comme l’ange de Dieu
  rationale: Traduction formelle qui préserve l’expression hébraïque et sa portée honorifique sans préciser davantage la nature de la comparaison.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: fais donc ce qui te paraît bon
  rationale: L’idiome hébreu « ce qui est bon à tes yeux » exprime ce que le roi juge bon ; « te paraît bon » est idiomatique en français moderne, tandis que « donc » rend l’enchaînement introduit par le waw.
theological_decisions:
- issue: Identité et fonction de « l’ange de Dieu »
  choice: Conserver littéralement « l’ange de Dieu »
  alternative: « un ange de Dieu » ou une explicitation telle que « capable de discerner comme un ange de Dieu »
  rationale: L’hébreu porte l’article et ne développe pas le point précis de la comparaison. La traduction maintient cette ambiguïté sans imposer une interprétation théologique.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au roi dans le cadre narratif biblique. La ponctuation sépare clairement l’accusation de la déclaration de confiance dans le jugement royal.
