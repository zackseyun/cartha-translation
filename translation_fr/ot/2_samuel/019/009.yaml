source:
  edition: WLC
  text: וַ/יָּ֥קָם הַ/מֶּ֖לֶךְ וַ/יֵּ֣שֶׁב בַּ/שָּׁ֑עַר וּֽ/לְ/כָל הָ/עָ֞ם הִגִּ֣ידוּ לֵ/אמֹ֗ר הִנֵּ֤ה הַ/מֶּ֨לֶךְ֙ יוֹשֵׁ֣ב בַּ/שַּׁ֔עַר וַ/יָּבֹ֤א כָל הָ/עָם֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/יִשְׂרָאֵ֔ל נָ֖ס אִ֥ישׁ לְ/אֹהָלָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: fr
  text: 'Alors le roi se leva et s’assit à la porte de la ville[a]. On annonça à tout le peuple : « Voici que le roi est assis à la porte de la ville. » Alors tout le peuple se présenta devant le roi. Mais Israël avait fui[b], chacun vers sa tente[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La porte d’une ville était aussi un lieu public où l’on rendait la justice et traitait les affaires de la communauté.
    reason: cultural_note
  - marker: b
    text: 'Ou : « Et Israël avait fui ». La conjonction hébraïque peut simplement signifier « et »; « mais » met ici en relief le contraste dans le récit.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « chacun vers sa tente », expression qui évoque la dispersion de chacun vers son lieu d’habitation ou son territoire familial.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: Alors le roi se leva
  rationale: Le wayyiqtol de קום fait avancer le récit. « Se leva » est naturel, digne et fidèle au mouvement exprimé.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: et s’assit à la porte de la ville
  rationale: ישב désigne ici le fait de prendre place publiquement. En français, « à la porte de la ville » rend naturellement le complexe de la porte urbaine évoqué par בַּשַּׁעַר.
- source_word: הִגִּידוּ לֵאמֹר
  choice: On annonça à tout le peuple
  rationale: Le sujet pluriel est indéfini. Le pronom « on » restitue cette valeur impersonnelle sans imposer des messagers précis; la formule française évite de reproduire lourdement le quotatif « en disant ».
- source_word: הִנֵּה
  choice: Voici que
  rationale: La particule attire l’attention sur la présence visible du roi. « Voici que » conserve cette fonction déictique dans un registre narratif actuel et digne.
- source_word: יוֹשֵׁב
  choice: est assis
  rationale: Le participe décrit l’état présent et observable du roi; « est assis » en restitue naturellement l’aspect continu.
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: Alors tout le peuple se présenta devant le roi
  rationale: בוא לפני indique que le peuple vient en présence du roi. « Se présenta devant » convient à cette scène publique sans lui attribuer une cérémonie plus précise.
- source_word: וְיִשְׂרָאֵל נָס
  choice: Mais Israël avait fui
  rationale: Le qatal נָס fournit ici l’arrière-plan antérieur à la scène immédiate. « Avait fui » exprime cette antériorité, tandis que « mais » rend le contraste contextuel porté par וְ sans prétendre que la conjonction soit intrinsèquement adversative.
- source_word: אִישׁ לְאֹהָלָיו
  choice: chacun vers sa tente
  rationale: Le distributif masculin אִישׁ est rendu par le masculin « chacun ». L’image de la tente est conservée plutôt que remplacée par « maison », afin de préserver l’idiome hébreu.
theological_decisions:
- issue: Expression distributive masculine אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: « Chacun » est grammaticalement masculin et restitue la distribution individuelle sans alourdir la phrase. Le texte ne précise pas davantage la composition du groupe.
- issue: Valeur de la conjonction וְ devant יִשְׂרָאֵל
  choice: Mais Israël avait fui
  alternative: Et Israël avait fui
  rationale: Le contexte autorise une lecture contrastive, mais la conjonction hébraïque reste polyvalente. L’alternative plus formelle est donc signalée en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide à l’oral comme à l’écrit. « Porte de la ville » explicite sobrement le cadre urbain implicite, et l’idiome de la tente est maintenu avec une note explicative.
