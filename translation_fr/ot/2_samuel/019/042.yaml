review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris le reproche politique exprimé par « voler ». Toutefois, « sa maison » risque de désigner un bâtiment plutôt que la maisonnée royale, et « qui étaient avec lui » ajoute une explicitation relative moins directe que le syntagme hébreu final.
  naturalness: « Or voici que » et surtout « t’ont-ils dérobé » ont une coloration littéraire ou archaïsante peu naturelle en français international moderne. « Et voici » et « t’ont-ils enlevé » sont plus fluides; une note peut conserver la métaphore lexicale de « voler ».
  terminology: « Maisonnée » rend ici ביתו avec plus de précision contextuelle que « maison ». « Hommes d’Israël », « hommes de Juda » et « hommes de David » conservent utilement les collectifs masculins du texte source.
  issues:
  - severity: medium
    issue: « sa maison » est ambigu en français moderne.
    rationale: ביתו désigne ici le foyer, la famille et le personnel du roi, non son bâtiment; « sa maisonnée » évite cette lecture inappropriée.
  - severity: medium
    issue: « t’ont-ils dérobé » est peu idiomatique dans le français moderne.
    rationale: Le verbe peut se comprendre, mais son emploi avec une personne est marqué. « T’ont-ils enlevé » est naturel; la note signale que l’hébreu dit littéralement « volé » et conserve ainsi la force accusatrice.
  - severity: low
    issue: La note a associe הִנֵּה à une « arrivée soudaine ».
    rationale: Le marqueur attire l’attention, mais n’affirme pas à lui seul la soudaineté.
  - severity: low
    issue: « qui étaient avec lui » est une paraphrase relative du groupe final.
    rationale: « Avec lui » conserve plus directement la brièveté et l’ambiguïté référentielle du suffixe hébreu, David étant le roi dans ce contexte.
