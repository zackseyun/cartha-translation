base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: fr
  text: 'Et voici[a] que tous les hommes d’Israël vinrent auprès du roi et lui dirent : « Pourquoi nos frères, les hommes de Juda, t’ont-ils enlevé[b] et ont-ils fait traverser le Jourdain au roi, à sa maisonnée et à tous les hommes de David avec lui ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Or voici ». L’expression hébraïque attire l’attention sur ce qui suit.'
    reason: discourse_marker
  - marker: b
    text: 'Littéralement : « t’ont-ils volé ». L’hébreu emploie le verbe ordinaire signifiant « voler » comme accusation métaphorique : les hommes de Juda se sont approprié le retour du roi sans associer les autres Israélites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici
  rationale: Rend le marqueur discursif qui attire l’attention et introduit vivement cette nouvelle scène, dans un français narratif digne et naturel.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: Le singulier אִישׁ a ici une valeur collective; cette traduction conserve le langage masculin représentatif et le parallèle avec Juda.
- source_word: בָּאִים אֶל הַמֶּלֶךְ
  choice: vinrent auprès du roi
  rationale: Le participe prend naturellement une valeur narrative; « auprès du roi » exprime l’arrivée devant lui sans suggérer seulement un déplacement abstrait.
- source_word: גְּנָבוּךָ
  choice: t’ont dérobé
  rationale: Conserve la métaphore accusatrice du verbe ordinaire « voler », tout en convenant à une personne soustraite politiquement aux autres tribus.
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: nos frères, les hommes de Juda
  rationale: Préserve à la fois le lien fraternel invoqué dans la querelle interne et la valeur collective de אִישׁ.
- source_word: וַיַּעֲבִרוּ
  choice: ont fait traverser
  rationale: Rend explicitement la forme causative du verbe עבר, sans ajouter l’idée plus interprétative d’une escorte.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: « Maison » maintient la portée souple de בַּיִת, qui peut désigner ici la famille et la maisonnée royales, sans la réduire au seul bâtiment.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: et à tous les hommes de David qui étaient avec lui
  rationale: Rattache naturellement ce groupe aux personnes que Juda a fait traverser et explicite en français la relation exprimée par עִמּוֹ.
