  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל בַּרְזִלָּ֑י אַתָּה֙ עֲבֹ֣ר אִתִּ֔/י וְ/כִלְכַּלְתִּ֥י אֹתְ/ךָ֛ עִמָּדִ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: fr
  text: 'Le roi dit à Barzillaï : « Toi, traverse avec moi, et je pourvoirai à tes besoins auprès de moi à Jérusalem. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit naturellement le récit. En français, le passé simple suffit sans qu’il soit nécessaire de reproduire mécaniquement la conjonction hébraïque.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne le roi, David, sans que le texte hébreu emploie ici son nom.
- source_word: בַּרְזִלָּי
  choice: Barzillaï
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: אַתָּה עֲבֹר
  choice: Toi, traverse
  rationale: Le pronom indépendant אַתָּה met le destinataire en relief; « Toi » conserve cette insistance avant l’impératif masculin singulier.
- source_word: אִתִּי
  choice: avec moi
  rationale: Expression simple d’accompagnement, liée à la traversée du Jourdain dans le contexte.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: et je pourvoirai à tes besoins
  rationale: כלכל exprime ici l’entretien matériel ou la prise en charge des besoins. Cette formulation est naturelle en français moderne et garde la portée concrète du verbe.
- source_word: עִמָּדִי
  choice: auprès de moi
  rationale: Cette expression marque la présence de Barzillaï dans l’entourage du roi. « Auprès de moi » évite la répétition lourde de « avec moi » tout en restant proche du sens.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Avec une ville, le français idiomatique rend ici la préposition ב par « à ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. L’insistance du pronom hébreu est conservée par « Toi ». La proposition royale est formulée clairement sans développer au-delà du texte la nature exacte de la prise en charge.
