review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens sont bien rendus : Absalom est présenté comme celui qui a reçu l’onction sur le peuple, sa mort au combat est constatée, puis le peuple est interpellé sur son silence concernant le retour du roi. « Pour régner sur nous » transforme toutefois légèrement la relation d’investiture exprimée par « sur nous » en finalité ; « comme roi sur nous » la restitue plus directement.'
  naturalness: Le français est naturel, soutenu et accessible. « Gardez-vous le silence quand il s’agit de faire revenir le roi » exprime idiomatiquement le lien entre le silence et l’action attendue.
  terminology: « Consacré par l’onction » évite l’archaïsme de « oint » tout en conservant l’acte d’onction. L’ajout de « comme roi » explicite, sans le surinterpréter, le sens royal de l’onction dans ce contexte.
  issues:
