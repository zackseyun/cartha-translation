source:
  edition: WLC
  text: וְ/אַבְשָׁלוֹם֙ אֲשֶׁ֣ר מָשַׁ֣חְנוּ עָלֵ֔י/נוּ מֵ֖ת בַּ/מִּלְחָמָ֑ה וְ/עַתָּ֗ה לָ/מָ֥ה אַתֶּ֛ם מַחֲרִשִׁ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: fr
  text: Absalom, que nous avions consacré par l’onction comme roi sur nous, est mort au combat. Et maintenant, pourquoi gardez-vous le silence quand il s’agit de faire revenir le roi ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: Absalom
  rationale: Le waw assure la continuité du discours. En français, il n’est pas nécessaire de le rendre devant le nom, puisque l’enchaînement reste clair sans conjonction.
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: que nous avions consacré par l’onction pour régner sur nous
  rationale: Cette formulation conserve l’acte concret et politiquement significatif de l’onction royale, tout en exprimant naturellement en français la fonction indiquée par עָלֵינוּ. Le plus-que-parfait situe cette action avant la mort d’Absalom.
- source_word: מֵת בַּמִּלְחָמָה
  choice: est mort au combat
  rationale: Le parfait présente la mort comme un fait accompli dont la conséquence demeure actuelle. « Est mort » est naturel dans ce discours, et « au combat » rend idiomatiquement l’expression hébraïque.
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La formule conserve à la fois la continuité avec l’affirmation précédente et le passage à sa conséquence pratique, sans ajouter un lien logique plus explicite que l’hébreu.
- source_word: מַחֲרִשִׁים
  choice: gardez-vous le silence
  rationale: 'Le participe décrit l’attitude persistante des destinataires : ils ne prennent pas la parole en faveur du retour du roi. Cette traduction évite de réduire le sens à une simple hésitation.'
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: quand il s’agit de faire revenir le roi
  rationale: Le hiphil de שׁוב signifie faire revenir ou ramener. La tournure française relie naturellement l’infinitif au fait de garder le silence, sans remplacer le mouvement concret du retour par l’idée plus abstraite de restauration.
theological_decisions:
- issue: Portée de l’onction donnée à Absalom
  choice: conserver explicitement l’onction royale
  alternative: « que nous avions établi comme roi sur nous »
  rationale: Le récit emploie le verbe habituel de l’onction malgré le statut contesté d’Absalom. Le traduire explicitement préserve la tension politique et religieuse du texte sans légitimer ni condamner l’acte par une glose.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Consacré par l’onction » évite l’archaïsme isolé de « oint » tout en maintenant l’image source; « faire revenir le roi » conserve la formulation politique du texte sans nommer David.
