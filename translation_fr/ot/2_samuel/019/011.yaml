    issue: Nuance de « pour régner sur nous »
    rationale: Cette tournure présente l’onction comme orientée vers un but (« pour régner »), alors que le texte dit plus directement qu’Absalom avait été oint « sur nous », c’est-à-dire dans une position royale sur le peuple. « Comme roi sur nous » est plus proche de cette relation tout en restant naturel.
  revised_text: Absalom, que nous avions consacré par l’onction comme roi sur nous, est mort au combat. Et maintenant, pourquoi gardez-vous le silence quand il s’agit de faire revenir le roi ?
