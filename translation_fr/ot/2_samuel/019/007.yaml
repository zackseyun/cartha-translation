  text: לְ/אַֽהֲבָה֙ אֶת שֹׂ֣נְאֶ֔י/ךָ וְ/לִ/שְׂנֹ֖א אֶת אֹהֲבֶ֑י/ךָ כִּ֣י הִגַּ֣דְתָּ הַ/יּ֗וֹם כִּ֣י אֵ֤ין לְ/ךָ֙ שָׂרִ֣ים וַ/עֲבָדִ֔ים כִּ֣י יָדַ֣עְתִּי הַ/יּ֗וֹם כִּ֠י לא אַבְשָׁל֥וֹם חַי֙ וְ/כֻלָּ֤/נוּ הַ/יּוֹם֙ מֵתִ֔ים כִּי אָ֖ז יָשָׁ֥ר בְּ/עֵינֶֽי/ךָ־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: fr
  text: en aimant ceux qui te haïssent et en haïssant ceux qui t’aiment. En effet, tu as montré aujourd’hui que chefs et serviteurs ne comptent pas pour toi[a]. Car je sais aujourd’hui que, si Absalom était vivant et que nous étions tous morts aujourd’hui[b], cela te semblerait juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu as déclaré aujourd’hui que tu n’as ni chefs ni serviteurs ». Cette tournure signifie ici qu’ils ne comptent pas à tes yeux.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « si seulement Absalom était vivant et que nous étions tous morts aujourd’hui ». Joab formule une accusation contrefactuelle particulièrement sévère, et non une citation des paroles de David.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: en aimant ceux qui te haïssent
  rationale: Les participes substantivés gardent leur valeur verbale, tandis que le gérondif français s’insère naturellement dans la réprimande commencée au verset précédent.
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: et en haïssant ceux qui t’aiment
  rationale: Cette formulation reproduit le parallélisme et l’opposition lexicale avec le premier membre.
- source_word: הִגַּדְתָּ
  choice: tu as montré
  rationale: Dans ce contexte, le comportement de David a manifesté publiquement son jugement; « montré » rend mieux cette portée que le seul « déclaré ».
- source_word: שָׂרִים וַעֲבָדִים
  choice: chefs et serviteurs
  rationale: « Chefs » convient au cadre militaire et politique sans réduire nécessairement שָׂרִים aux seuls commandants; « serviteurs » désigne largement les hommes au service du roi.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: chefs et serviteurs ne comptent pas pour toi
  rationale: La tournure existentielle hébraïque exprime ici leur absence de valeur aux yeux de David, non leur inexistence littérale.
- source_word: יָדַעְתִּי הַיּוֹם
  choice: je sais maintenant
  rationale: Le parfait a une valeur présente; « maintenant » évite une répétition lourde d’« aujourd’hui » tout en exprimant la conclusion tirée des événements du jour.
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: si Absalom était vivant et que nous soyons tous morts aujourd’hui
  rationale: Le contexte impose une accusation contrefactuelle; la construction française avec « si » la rend clairement sans la transformer en affirmation factuelle.
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: cela te semblerait juste
  rationale: Cette expression française naturelle conserve la notion de ce qui est tenu pour juste aux yeux de quelqu’un.
theological_decisions:
- issue: Portée de l’accusation de Joab
  choice: Présenter les paroles comme une accusation contrefactuelle formulée par Joab
  alternative: Les présenter comme une déclaration littérale de David ou comme l’expression certaine de son désir
  rationale: Le texte rapporte l’interprétation polémique que Joab donne au deuil de David; il ne dit pas que David a lui-même formulé ce souhait.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement convient au dialogue personnel entre Joab et David. Le parallélisme « aimant… haïssant » est conservé, tandis que les idiomes hébreux sont rendus dans un français intelligible.
