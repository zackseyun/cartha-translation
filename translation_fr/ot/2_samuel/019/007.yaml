  to: en aimant ceux qui te haïssent et en haïssant ceux qui t’aiment. En effet, tu as montré aujourd’hui que chefs et serviteurs ne comptent pas pour toi[a]. Car je sais aujourd’hui que, si Absalom était vivant et que nous étions tous morts aujourd’hui[b], cela te semblerait juste.
