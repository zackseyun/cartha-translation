base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: fr
  text: 'Maintenant, lève-toi, sors et parle au cœur de tes serviteurs[a]. Car je le jure par Yahweh : si tu ne sors pas, pas un seul homme ne restera avec toi cette nuit. Cela sera pour toi pire que tous les malheurs qui t’ont frappé depuis ta jeunesse jusqu’à maintenant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parle au cœur de tes serviteurs »; cette expression hébraïque signifie leur parler avec bienveillance, de manière rassurante ou persuasive.'
    reason: L’image littérale est conservée dans le texte, tandis que la note en précise le sens idiomatique.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque une transition urgente dans le discours, avec une formulation directe et naturelle en français.
- source_word: קוּם צֵא
  choice: lève-toi, sors
  rationale: Conserve les deux impératifs et leur mouvement concret, dans un français actuel.
- source_word: וְדַבֵּר עַל־לֵב
  choice: parle au cœur de
  rationale: Préserve l’image hébraïque, qui évoque ici une parole bienveillante, rassurante ou persuasive; la note en explicite la portée.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans ce contexte royal et politique, le terme désigne les hommes au service du roi ou ses sujets, sans insister sur un statut d’esclave.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: Car je le jure par Yahweh
  rationale: Rend naturellement la déclaration solennelle de serment et conserve le nom divin.
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: si tu ne sors pas
  rationale: Exprime clairement la condition négative qui introduit la menace formulée sous serment.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: pas un seul homme ne restera avec toi cette nuit
  rationale: « Pas un seul homme » garde l’insistance de אִישׁ, tandis que « restera » restitue ici le sens contextuel de passer la nuit ou demeurer auprès de quelqu’un.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: Cela sera pour toi pire que tous les malheurs
  rationale: Le comparatif est porté par la construction avec מִן; « malheurs » désigne ici les adversités subies plutôt qu’un mal moral.
- source_word: אֲשֶׁר בָּאָה עָלֶיךָ
  choice: qui t’ont frappé
  rationale: Formulation française naturelle pour des malheurs survenus à quelqu’un, sans modifier la portée cumulative du texte.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: depuis ta jeunesse jusqu’à maintenant
  rationale: Conserve explicitement les deux limites temporelles de l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
