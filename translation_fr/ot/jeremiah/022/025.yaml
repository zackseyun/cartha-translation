source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ךָ בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשֶׁ֔/ךָ וּ/בְ/יַ֛ד אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶ֑ם וּ/בְ/יַ֛ד נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַ֥ד הַ/כַּשְׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/025.yaml
  text: And I will give you into the hand of those who seek your life[a], into the hand of those before whom you are afraid, into the hand of Nebuchadnezzar king of Babylon[b], and into the hand of the Chaldeans.
translation:
  language: fr
  text: Je te livrerai entre les mains de ceux qui en veulent à ta vie, entre les mains de ceux que tu redoutes, entre les mains de Nabuchodonosor[a], roi de Babylone, et entre les mains des Chaldéens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme hébraïque du nom correspond plus précisément à « Nabuchodretsar ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « les Chaldéens » peut aussi être rendu par « les Babyloniens », le terme pouvant désigner plus largement les forces de Babylone.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: Je te livrerai
  rationale: Avec un complément de personne suivi de בְּיַד, le verbe נתן exprime ici la remise de quelqu’un au pouvoir d’autrui. « Livrer » rend naturellement cet idiome en français.
- source_word: בְּיַד
  choice: entre les mains de
  rationale: Cette expression marque le passage sous le pouvoir d’un autre. La répétition est conservée afin de respecter l’insistance rhétorique de l’hébreu.
- source_word: מְבַקְשֵׁי נַפְשֶׁךָ
  choice: ceux qui en veulent à ta vie
  rationale: Dans ce contexte hostile, נֶפֶשׁ désigne la vie de la personne. Cette tournure française actuelle conserve l’idée d’une menace mortelle sans introduire la notion d’âme immatérielle.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: ceux que tu redoutes
  rationale: Le verbe גור exprime ici la crainte ou l’effroi. « Redouter » restitue avec concision la force de l’expression hébraïque.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: La forme française conventionnelle du nom est retenue dans le texte pour être immédiatement reconnaissable; la forme plus proche de l’hébreu est signalée en note.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Traduction directe et naturelle de la chaîne construite hébraïque.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: « Chaldéens » conserve la désignation du texte source; dans ce contexte, elle peut viser plus largement les forces babyloniennes, possibilité indiquée en note.
