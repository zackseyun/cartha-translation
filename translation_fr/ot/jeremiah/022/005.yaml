    rationale: Le texte hébreu dit littéralement « par moi-même j’ai juré ... que cette maison sera une dévastation ». « Je le jure » ajoute un pronom objet non exprimé et la virgule avant « cette maison » ne marque pas clairement que la proposition est le contenu du serment. « Je jure par moi-même ... que » est plus fidèle et grammaticalement net.
  - severity: low
    issue: Rendu de לְחָרְבָּה
    rationale: « Un lieu dévasté » est possible, mais paraphrase légèrement le nom « ruine/dévastation ». « Une ruine » est à la fois plus proche du terme source et naturel après « deviendra ».
