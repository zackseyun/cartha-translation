revisions:
- from: Mais si vous n’écoutez pas ces paroles, je le jure par moi-même — déclaration de Yahweh —, cette maison deviendra un lieu dévasté.[a]
  to: Mais si vous n’écoutez pas ces paroles, je jure par moi-même — déclaration de Yahweh — que cette maison deviendra une ruine.[a]
  rationale: La révision rend explicitement, par « que », la proposition qui constitue le contenu du serment, sans ajouter le pronom objet « le ». Elle remplace la paraphrase « un lieu dévasté » par « une ruine », rendu plus direct de חָרְבָּה et plus idiomatique dans cette construction. La note maintient l’information contextuelle sur le palais sans substituer une interprétation au terme hébreu du texte principal.
