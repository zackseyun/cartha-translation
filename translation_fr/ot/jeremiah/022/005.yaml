source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמְע֔וּ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה בִּ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּי לְ/חָרְבָּ֥ה יִֽהְיֶ֖ה הַ/בַּ֥יִת הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/005.yaml
  text: But if you do not listen to these words[a], I swear by myself, declares Yahweh, that this house will become a ruin.
translation:
  language: fr
  text: Mais si vous n’écoutez pas ces paroles, je jure par moi-même — déclaration de Yahweh — que cette maison deviendra une ruine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un lieu dévasté ». Dans ce contexte, « cette maison » désigne probablement le palais royal, celui du roi de Juda.
    reason: Indique une possibilité de rendu pour חָרְבָּה et précise le référent contextuel probable de הַבַּיִת הַזֶּה, tout en conservant « maison » dans le texte afin de ne pas lever son ambiguïté.
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition en contraste avec ce qui précède; « Mais si » rend naturellement cette valeur adversative.
- source_word: לֹא תִשְׁמְעוּ
  choice: vous n’écoutez pas
  rationale: שׁמע peut signifier entendre, écouter ou obéir. « Écouter » conserve l’image auditive tout en suggérant qu’il faut tenir compte des paroles.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans ce contexte de proclamation prophétique, « paroles » rend clairement דְּבָרִים.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: je le jure par moi-même
  rationale: Rend la formule de serment divine de façon idiomatique et solennelle; le pronom « le » permet un français naturel sans ajouter de contenu précis.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Formule prophétique formelle qui distingue l’incise de l’énoncé principal et conserve le nom divin.
- source_word: לְחָרְבָּה
  choice: un lieu dévasté
  rationale: חָרְבָּה désigne un état ou un lieu de dévastation. Cette formulation est naturelle en français et évite l’idée plus étroite d’un simple bâtiment en ruine.
- source_word: יִהְיֶה הַבַּיִת הַזֶּה
  choice: cette maison deviendra
  rationale: « Deviendra » exprime naturellement le résultat annoncé; « maison » conserve le terme hébreu sans trancher dans le texte son référent contextuel précis.
theological_decisions:
- issue: Temps et force de la formule de serment divine
  choice: je le jure par moi-même
  alternative: j’ai juré par moi-même
  rationale: Le parfait hébreu peut avoir ici une valeur performative. Le présent français préserve l’immédiateté et la solennité du serment sans en modifier la portée.
- issue: Référent de « cette maison »
  choice: cette maison
  alternative: ce palais
  rationale: Le contexte vise vraisemblablement la maison royale ou le palais du roi de Juda, mais בַּיִת signifie formellement « maison ». Le texte principal conserve donc cette ambiguïté, précisée en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste directe et solennelle. L’incise « déclaration de Yahweh » préserve le caractère formel de la formule prophétique, tandis que « n’écoutez pas » évite de résoudre explicitement שׁמע en « n’obéissez pas ».
