reference: Jeremiah 22:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אֵ֤ין עֵינֶ֨י/ךָ֙ וְ/לִבְּ/ךָ֔ כִּ֖י אִם עַל בִּצְעֶ֑/ךָ וְ/עַ֤ל דַּֽם הַ/נָּקִי֙ לִ/שְׁפּ֔וֹךְ וְ/עַל הָ/עֹ֥שֶׁק וְ/עַל הַ/מְּרוּצָ֖ה לַ/עֲשֽׂוֹת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/017.yaml
  text: But your eyes and your heart are set on nothing except your dishonest gain[a], on shedding innocent blood, and on practicing oppression and extortion.
translation:
  language: fr
  text: Mais tes yeux et ton cœur ne sont tournés que vers ton profit malhonnête, vers le sang innocent à répandre, et vers l’oppression et la violence[a] à commettre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’oppression et l’extorsion à pratiquer ». Le terme hébreu traduit par « violence » est rare et peut désigner plus largement une conduite violente ou impitoyable.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... כִּי אִם
  choice: ne sont tournés que vers
  rationale: Cette tournure française exprime naturellement l’orientation exclusive indiquée par la construction hébraïque, tout en s’accordant avec la métaphore des yeux et du cœur.
- source_word: עֵינֶיךָ וְלִבְּךָ
  choice: tes yeux et ton cœur
  rationale: 'La traduction littérale conserve l’image hébraïque : les yeux évoquent l’attention et les visées, tandis que le cœur désigne notamment la volonté et les intentions.'
- source_word: בִּצְעֶךָ
  choice: ton profit malhonnête
  rationale: Le nom désigne ici un gain recherché ou obtenu injustement. « Profit malhonnête » garde à la fois l’idée d’enrichissement et sa condamnation morale.
- source_word: דַּם הַנָּקִי
  choice: le sang innocent
  rationale: Cette expression française consacrée rend fidèlement l’expression hébraïque désignant le sang de personnes qui ne méritent pas la mort.
- source_word: לִשְׁפּוֹךְ
  choice: à répandre
  rationale: L’infinitif dépend de « le sang innocent » et exprime l’acte visé. « Répandre le sang » est idiomatique dans ce contexte de meurtre.
- source_word: הָעֹשֶׁק
  choice: l’oppression
  rationale: Le terme couvre l’exploitation, la spoliation et l’abus de pouvoir; « oppression » conserve cette portée sociale assez large.
- source_word: הַמְּרוּצָה
  choice: la violence
  rationale: Ce nom rare semble désigner une conduite violente ou impitoyable. « Violence » convient au contexte sans donner au terme un sens économique trop étroit; son incertitude est signalée en note.
- source_word: לַעֲשׂוֹת
  choice: à commettre
  rationale: Avec « oppression » et « violence », « commettre » est plus naturel en français que le littéral « faire » et décrit la mise en œuvre de ces actes.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et directement compréhensible. La structure répétitive avec « vers » conserve l’insistance de l’hébreu, malgré une légère solennité. La métaphore des yeux et du cœur est maintenue.
