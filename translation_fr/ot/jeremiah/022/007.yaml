source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֥י עָלֶ֛י/ךָ מַשְׁחִתִ֖ים אִ֣ישׁ וְ/כֵלָ֑י/ו וְ/כָֽרְתוּ֙ מִבְחַ֣ר אֲרָזֶ֔י/ךָ וְ/הִפִּ֖ילוּ עַל הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/007.yaml
  text: And I will set apart destroyers against you[a], each with his weapons[c][b]; they will cut down the choicest of your cedars and cast them into the fire.
translation:
  language: fr
  text: Je mettrai à part des destructeurs contre toi[a], chacun avec ses armes[b]. Ils abattront les meilleurs de tes cèdres et les jetteront au feu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je consacrerai contre toi des destructeurs. » L’hébreu emploie le verbe souvent traduit par « consacrer » ou « sanctifier » ; ici, il signifie que Dieu met des agents à part pour exécuter le jugement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chacun avec ses instruments ». Le mot hébreu peut désigner des objets, du matériel, des instruments ou des armes.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « sur le feu ». « Au feu » exprime plus naturellement en français le sens de l’action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: Je mettrai à part
  rationale: Le verbe קדשׁ évoque normalement la consécration ou la mise à part. Ici, Dieu réserve des agents à l’exécution du jugement. « Mettre à part » conserve cette résonance sans suggérer que les destructeurs seraient moralement saints.
- source_word: מַשְׁחִתִים
  choice: des destructeurs
  rationale: Le participe substantivé désigne ceux qui causent la destruction. « Destructeurs » est direct, naturel et adapté au contexte de jugement.
- source_word: עָלֶיךָ
  choice: contre toi
  rationale: Dans ce contexte hostile, la préposition עַל a le sens de « contre ».
- source_word: אִישׁ וְכֵלָיו
  choice: chacun avec ses armes
  rationale: אִישׁ a ici une valeur distributive après le pluriel. כְּלִי peut désigner divers objets, instruments ou armes ; le contexte d’une action destructrice favorise « armes », tout en laissant une note signaler le sens plus large.
- source_word: וְכָרְתוּ
  choice: Ils abattront
  rationale: Pour des arbres, כרת signifie les couper ou les abattre. « Abattre » est précis et idiomatique en français.
- source_word: מִבְחַר אֲרָזֶיךָ
  choice: les plus beaux de tes cèdres
  rationale: מִבְחַר désigne ce qui est choisi, excellent ou de premier choix. Cette formulation exprime naturellement en français la qualité supérieure des cèdres.
- source_word: וְהִפִּילוּ עַל הָאֵשׁ
  choice: et les jetteront au feu
  rationale: L’hébreu dit littéralement qu’ils les feront tomber « sur le feu ». « Jeter au feu » rend naturellement le résultat visé tout en restant proche de l’image.
theological_decisions:
- issue: Maintien du langage de consécration dans un oracle de jugement
  choice: « Je mettrai à part »
  alternative: « Je consacrerai » ou « Je désignerai »
  rationale: « Mettre à part » préserve la tension créée par l’emploi d’un verbe cultuel pour des agents de destruction, sans donner à entendre qu’ils possèdent une sainteté morale. « Désigner » affaiblirait cette résonance, tandis que « consacrer » pourrait être mal compris.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste ferme et solennelle sans archaïsme. Le pronom singulier « toi » conserve l’adresse au palais ou à la maison royale dans le contexte immédiat.
