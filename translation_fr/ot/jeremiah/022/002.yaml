  text: וְ/אָֽמַרְתָּ֙ שְׁמַ֣ע דְּבַר יְהוָ֔ה מֶ֣לֶךְ יְהוּדָ֔ה הַ/יֹּשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד אַתָּ֤ה וַ/עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֔ הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/002.yaml
  text: and say[a], ‘Hear the word of Yahweh, O king of Judah, who sits on the throne of David—you, your servants, and your people who enter through these gates.’
translation:
  language: fr
  text: 'Tu diras : « Écoute la parole de Yahweh, roi de Juda, qui siège sur le trône de David, toi, tes serviteurs[a] et ton peuple, qui entrez par ces portes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes fonctionnaires ».'
    reason: Dans un contexte de cour royale, עֲבָדֶיךָ peut désigner les serviteurs du roi au sens large ou, plus précisément, ses fonctionnaires.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Tu diras
  rationale: Le parfait consécutif poursuit l’instruction du verset précédent. Le futur français exprime naturellement l’ordre transmis au prophète.
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif est au singulier et s’adresse d’abord au roi. « Écoute » rend l’appel prophétique sans le réduire au seul sens d’obéir.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la portée prophétique et révélatrice de דָּבָר, tandis que le nom divin est transcrit directement.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le groupe nominal est compris comme un vocatif en adresse directe. En français, les virgules suffisent sans imposer le « ô » plus littéraire.
- source_word: הַיֹּשֵׁב עַל כִּסֵּא דָוִד
  choice: toi qui sièges sur le trône de David
  rationale: « Siéger » est naturel pour l’exercice de la royauté et préserve la portée dynastique du trône de David.
- source_word: אַתָּה וַעֲבָדֶיךָ וְעַמְּךָ
  choice: toi, tes serviteurs et ton peuple
  rationale: Le pronom indépendant souligne le roi avant d’élargir les destinataires. « Serviteurs » garde l’étendue sémantique du terme hébreu, qui peut aussi désigner des agents royaux.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: qui entrez par ces portes
  rationale: Le participe pluriel qualifie l’ensemble des destinataires. « Entrer par » est la tournure française naturelle pour un déplacement à travers des portes.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. Sa transcription préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de l’appel à écouter
  choice: Impératif singulier adressé au roi, puis élargissement explicite aux serviteurs et au peuple
  alternative: Impératif pluriel adressé d’emblée à tous
  rationale: שְׁמַע est morphologiquement singulier, tandis que la suite nomme ensuite le roi, ses serviteurs et son peuple. La traduction conserve cette progression.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond aux formes hébraïques de deuxième personne et à l’adresse prophétique directe. La syntaxe conserve le passage du roi seul à l’ensemble formé par le roi, ses serviteurs et son peuple.
