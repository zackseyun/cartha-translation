  text: אֶ֥רֶץ אֶ֖רֶץ אָ֑רֶץ שִׁמְעִ֖י דְּבַר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/029.yaml
  text: Land[a], land, land, hear the word of Yahweh.
translation:
  language: fr
  text: Terre[a], terre, terre, écoute la parole de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pays, pays, pays »; le mot hébreu peut désigner aussi bien un pays ou un territoire que la terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ / אָרֶץ
  choice: terre
  rationale: Le nom peut désigner la terre au sens de pays ou de territoire, ainsi que la terre au sens plus large. Dans cette triple apostrophe, « terre » reste naturel en français, conserve la force prophétique et laisse subsister l’étendue sémantique de l’hébreu.
- source_word: שִׁמְעִי
  choice: écoute
  rationale: L’impératif féminin singulier s’adresse à אֶרֶץ, nom féminin. « Écoute » exprime ici l’attention requise devant la proclamation prophétique; « obéis » expliciterait excessivement une implication possible.
- source_word: דְּבַר
  choice: parole
  rationale: « Parole de Yahweh » rend directement la formule prophétique et en conserve la solennité; « message » serait plus explicatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens de l’apostrophe אֶרֶץ répétée trois fois
  choice: Terre, terre, terre
  alternative: Pays, pays, pays
  rationale: Le contexte peut viser le pays de Juda, mais le mot hébreu garde une portée plus large. « Terre » préserve cette ambiguïté et la personnification sans imposer une localisation explicite.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin lui-même; sa translittération évite de remplacer ce nom par un titre.
translation_notes:
  register: Français international actuel, sobre et solennel. La triple répétition est conservée telle quelle pour maintenir l’insistance rhétorique du texte hébreu.
