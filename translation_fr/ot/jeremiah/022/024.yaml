source:
  edition: WLC
  text: חַי אָנִי֮ נְאֻם יְהוָה֒ כִּ֣י אִם יִהְיֶ֞ה כָּנְיָ֤הוּ בֶן יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה חוֹתָ֖ם עַל יַ֣ד יְמִינִ֑/י כִּ֥י מִ/שָּׁ֖ם אֶתְּקֶֽ/נְךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/024.yaml
  text: As I live[a], declares Yahweh, even if Coniah son of Jehoiakim, king of Judah, were a signet ring on my right hand[b], even from there I would tear you off.
translation:
  language: fr
  text: « Aussi vrai que je suis vivant, déclare Yahweh, même si Konia[a], fils de Jojakim, roi de Juda, était un anneau à cachet à ma main droite[b], même de là, je t’arracherais. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu Konia ; ailleurs, ce roi est aussi appelé Jékonias.
    reason: alternative_reading
  - marker: b
    text: Ou « sceau » ou « cachet ». L’image est celle d’un sceau personnel porté à la main, symbole d’autorité et objet précieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Cette formule française naturelle conserve la force solennelle du serment divin fondé sur la vie même de Dieu.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique avec dignité et lisibilité, tout en conservant le nom divin.
- source_word: כִּי אִם יִהְיֶה
  choice: même si … était
  rationale: Exprime l’hypothèse concessive forte du texte hébreu sans la transformer en affirmation factuelle.
- source_word: כָּנְיָהוּ
  choice: Konias
  rationale: Transcrit la forme abrégée du nom employée dans ce verset, sans l’harmoniser avec la forme plus longue Jékonias.
- source_word: חוֹתָם
  choice: anneau à cachet
  rationale: Désigne clairement un sceau personnel porté à la main, image d’autorité, de valeur et de proximité.
- source_word: עַל יַד יְמִינִי
  choice: à ma main droite
  rationale: Formulation française naturelle qui préserve l’emplacement précis de l’image.
- source_word: כִּי מִשָּׁם אֶתְּקֶנְךָּ
  choice: je t’en arracherais
  rationale: Le pronom adverbial « en » reprend la main droite, tandis que « arracher » restitue la violence de נתק et le conditionnel s’accorde avec l’hypothèse concessive.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; sa translittération conserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Forme du nom כָּנְיָהוּ
  choice: Konias
  alternative: Jékonias
  rationale: La traduction conserve la forme particulière présente ici, tout en signalant en note l’autre forme sous laquelle le roi est connu.
- issue: Valeur de la construction concessive כִּי אִם
  choice: même si … était
  alternative: quand bien même … serait
  rationale: 'Le tour retenu préserve la tension de l’image hypothétique: même dans la position la plus précieuse et la plus sûre, le roi serait rejeté.'
translation_notes:
  register: Français international actuel, solennel mais accessible. La syntaxe conserve l’hypothèse concessive et le passage soudain à la deuxième personne (« je t’en arracherais »), présent dans l’hébreu. Tous les marqueurs de note figurent dans le texte.
