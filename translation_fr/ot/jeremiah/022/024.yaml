revisions:
- from: « Aussi vrai que je suis vivant[a], déclare Yahweh, même si Konias, fils de Jojakim, roi de Juda, était un anneau à cachet à ma main droite[b], je t’en arracherais. »
  to: « Aussi vrai que je suis vivant, déclare Yahweh, même si Konia[a], fils de Jojakim, roi de Juda, était un anneau à cachet à ma main droite[b], même de là, je t’arracherais. »
  rationale: La révision corrige la forme française du nom, place la note comparative à son ancre pertinente et rend explicitement l’emphase de « même de là ». Elle maintient la syntaxe hypothétique, la force du serment, le nom divin et le passage rhétorique de la troisième à la deuxième personne.
