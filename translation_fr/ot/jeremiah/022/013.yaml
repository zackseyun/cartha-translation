id: JER.22.13
reference: Jeremiah 22:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֣וֹי בֹּנֶ֤ה בֵית/וֹ֙ בְּֽ/לֹא צֶ֔דֶק וַ/עֲלִיּוֹתָ֖י/ו בְּ/לֹ֣א מִשְׁפָּ֑ט בְּ/רֵעֵ֨/הוּ֙ יַעֲבֹ֣ד חִנָּ֔ם וּ/פֹעֲל֖/וֹ לֹ֥א יִתֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/013.yaml
  text: Woe to him who builds his house without righteousness[a], and his upper rooms without justice[c][b], who makes his neighbor work for nothing and does not give him his wages.
translation:
  language: fr
  text: Malheur à celui qui bâtit sa maison sans respecter la justice[a], et ses chambres à l’étage sans respecter le droit[b] ; qui fait travailler son prochain pour rien et ne lui donne pas son salaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi être rendu par « droiture » ou « ce qui est juste » ; son sens recoupe en partie celui de « droit » dans le membre de phrase suivant.
    reason: lexical_alternative
  - marker: b
    text: « Chambres à l’étage » peut aussi se traduire par « pièces hautes » ou « étages supérieurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Introduit une dénonciation prophétique avec une force naturelle et traditionnelle en français.
- source_word: בֹּנֶה בֵיתוֹ
  choice: celui qui bâtit sa maison
  rationale: Le participe est rendu comme une description caractéristique ; « maison » conserve le terme hébreu sans préciser « palais », bien que le contexte soit royal.
- source_word: בְּלֹא צֶדֶק
  choice: sans respecter la justice
  rationale: צֶדֶק évoque ici une conduite conforme à ce qui est juste. Cette formulation française exprime naturellement la manière moralement injuste de bâtir, tout en maintenant une distinction avec מִשְׁפָּט.
- source_word: וַעֲלִיּוֹתָיו
  choice: et ses chambres à l’étage
  rationale: Désigne les pièces hautes d’une demeure importante ; la formulation est claire en français moderne sans imposer une structure architecturale trop précise.
- source_word: בְּלֹא מִשְׁפָּט
  choice: sans respecter le droit
  rationale: מִשְׁפָּט désigne ici le droit ou la juste exigence due à autrui, notamment au travailleur.
- source_word: בְּרֵעֵהוּ יַעֲבֹד חִנָּם
  choice: qui fait travailler son prochain pour rien
  rationale: La construction indique qu’il emploie ou assujettit autrui sans contrepartie ; « son prochain » garde la portée relationnelle de רֵעַ.
- source_word: וּפֹעֲלוֹ לֹא יִתֶּן לוֹ
  choice: et ne lui donne pas son salaire
  rationale: פֹּעַל peut désigner le travail ou sa rétribution ; avec « donner », le contexte d’exploitation exige ici le sens de salaire dû.
theological_decisions:
- issue: Distinction entre צֶדֶק et מִשְׁפָּט
  choice: justice … droit
  alternative: droiture … justice
  rationale: Les deux termes hébreux se recouvrent partiellement. « Justice … droit » préserve leur parallélisme sans les confondre et met en relief le manquement moral puis le déni concret de ce qui est dû.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme prophétique est conservé, avec une ponctuation qui rend clairement la dénonciation et ses motifs.
