source:
  edition: WLC
  text: כִּ֗י בִּ/מְק֛וֹם אֲשֶׁר הִגְל֥וּ אֹת֖/וֹ שָׁ֣ם יָמ֑וּת וְ/אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לֹֽא יִרְאֶ֥ה עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/012.yaml
  text: For in the place where they have exiled him[a], there he will die, and he will never see this land again.
translation:
  language: fr
  text: Car c’est là, dans le lieu où on l’a exilé[a], qu’il mourra, et il ne reverra plus ce pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « où on l’a conduit en exil ». Le verbe hébreu désigne précisément le fait de contraindre quelqu’un à partir en exil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’injonction précédente; « Car » rend naturellement cette valeur explicative.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: dans le lieu où
  rationale: Rend directement la construction locative hébraïque tout en restant naturel en français.
- source_word: הִגְלוּ אֹתוֹ
  choice: on l’a exilé
  rationale: Le hiphil de גלה exprime le fait de contraindre quelqu’un à partir en exil. Le pronom indéfini « on » conserve ici l’indétermination du sujet pluriel hébreu sans suggérer un groupe précis.
- source_word: שָׁם
  choice: là-bas
  rationale: Conserve l’insistance locative du texte hébreu; l’antéposition de « il mourra là-bas » donne en français une formulation claire et digne.
- source_word: יָמוּת
  choice: il mourra
  rationale: Le futur simple rend clairement l’annonce exprimée par l’imparfait hébreu.
- source_word: וְאֶת־הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Dans ce contexte, אָרֶץ désigne la patrie dont le roi est éloigné. « Ce pays » est plus naturel que « cette terre » en français moderne, sans préciser davantage que l’hébreu.
- source_word: לֹא יִרְאֶה עוֹד
  choice: il ne reverra plus
  rationale: Cette tournure française exprime avec naturel qu’il ne verra jamais de nouveau le pays, tout en conservant le caractère définitif de l’exil.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition spatiale de l’hébreu est préservée par « là-bas, dans le lieu où », tandis que « on » maintient l’identité indéterminée des responsables de l’exil.
