source:
  edition: WLC
  text: דָּ֛ן דִּין עָנִ֥י וְ/אֶבְי֖וֹן אָ֣ז ט֑וֹב הֲ/לוֹא הִ֛יא הַ/דַּ֥עַת אֹתִ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/016.yaml
  text: He defended the cause of the poor and needy[a]; then it was well[b]. Is not that what it means to know me? declares Yahweh.
translation:
  language: fr
  text: Il faisait droit au pauvre et à l’indigent[a] ; alors, c’était bien[b]. N’est-ce pas là me connaître ? — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il jugeait la cause du pauvre et de l’indigent ». L’expression hébraïque relève du vocabulaire judiciaire et désigne le fait de faire droit à leur cause.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « alors, [c’était] bien » ou « alors, [c’était] bon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן דִּין
  choice: défendait la cause
  rationale: 'L’association du verbe et du nom apparenté forme une expression judiciaire : il s’agit de prendre en charge et de faire prévaloir la cause des personnes vulnérables, non de porter un simple jugement mental.'
- source_word: עָנִי וְאֶבְיוֹן
  choice: du pauvre et de l’indigent
  rationale: « Pauvre » rend la vulnérabilité sociale de עָנִי, tandis qu’« indigent » conserve la nuance de profond dénuement portée par אֶבְיוֹן.
- source_word: אָז טוֹב
  choice: alors, tout allait bien
  rationale: Cette formulation française naturelle conserve la valeur temporelle ou consécutive de אָז et le constat favorable exprimé elliptiquement par טוֹב.
- source_word: הֲלוֹא הִיא הַדַּעַת אֹתִי
  choice: N’est-ce pas cela, me connaître ?
  rationale: La question rhétorique attend une réponse affirmative. L’infinitif détaché rend naturellement le nom verbal hébreu tout en gardant le lien direct entre la connaissance de Dieu et l’exercice de la justice.
- source_word: נְאֻם יְהוָה
  choice: — déclaration de Yahweh
  rationale: Cette formule conserve la solennité de la formule prophétique et rend le tétragramme par le nom personnel « Yahweh ».
theological_decisions:
- issue: Sens de « connaître » Yahweh dans ce contexte
  choice: Une connaissance relationnelle de Yahweh qui se manifeste concrètement par la justice envers les pauvres et les indigents
  alternative: Une connaissance principalement intellectuelle de Dieu, ou l’affirmation que toute connaissance de Dieu se réduit à l’éthique sociale
  rationale: Le verset présente la défense des vulnérables comme une manifestation concrète de la connaissance de Yahweh, sans préciser qu’elle en épuiserait tout le contenu.
translation_notes:
  register: Français international moderne, clair et digne. « Défendait la cause » exprime naturellement la portée judiciaire de l’expression hébraïque ; la note conserve une traduction plus formelle. La ponctuation met en relief la question rhétorique sans en atténuer la tension théologique.
