source:
  edition: WLC
  text: וְ/הֵֽטַלְתִּ֣י אֹתְ/ךָ֗ וְ/אֶֽת אִמְּ/ךָ֙ אֲשֶׁ֣ר יְלָדַ֔תְ/ךָ עַ֚ל הָ/אָ֣רֶץ אַחֶ֔רֶת אֲשֶׁ֥ר לֹֽא יֻלַּדְתֶּ֖ם שָׁ֑ם וְ/שָׁ֖ם תָּמֽוּתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/026.yaml
  text: And I will hurl you and your mother who gave birth to you into another land[a], where you were not born, and there you will die.
translation:
  language: fr
  text: Je te précipiterai, toi et ta mère qui t’a mis au monde, sur une autre terre[a], où vous n’êtes pas nés, et c’est là que vous mourrez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe du singulier (« te », « t’ ») au pluriel (« vous n’êtes pas nés », « vous mourrez »), car le roi est ensuite considéré avec sa mère.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: Je te précipiterai
  rationale: Le hiphil exprime ici l’action énergique de jeter ou de projeter. « Précipiter » conserve la violence du jugement tout en restant naturel et digne en français.
- source_word: אֹתְךָ וְאֶת אִמְּךָ
  choice: toi et ta mère
  rationale: Rend directement les deux compléments coordonnés et prépare le passage grammatical du singulier au pluriel dans la suite du verset.
- source_word: אֲשֶׁר יְלָדַתְךָ
  choice: qui t’a mis au monde
  rationale: La proposition relative qualifie la mère. Cette formulation rend explicitement et naturellement le verbe « enfanter » en français moderne.
- source_word: עַל הָאָרֶץ אַחֶרֶת
  choice: sur une autre terre
  rationale: Avec le verbe « précipiter », עַל garde naturellement son image spatiale de mouvement vers une surface ou un territoire. « Terre » préserve la portée territoriale du terme hébreu.
- source_word: אֲשֶׁר לֹא יֻלַּדְתֶּם שָׁם
  choice: où vous n’êtes pas nés
  rationale: Le verbe passif est au pluriel et englobe le roi et sa mère. Le présent composé français exprime idiomatiquement l’état résultant de leur naissance hors de cette terre.
- source_word: וְשָׁם תָּמֽוּתוּ
  choice: et c’est là que vous mourrez
  rationale: Le verbe reste au pluriel et vise les deux personnes. La tournure « c’est là que » souligne naturellement le lieu annoncé avec certitude.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et solennel. Le tutoiement singulier désigne d’abord le roi; le pluriel devient explicite quand le texte inclut ensemble le roi et sa mère. L’image énergique du rejet en exil est conservée sans ajouter d’interprétation.
