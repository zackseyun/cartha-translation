  text: כִּ֤י אִם עָשׂוֹ֙ תַּֽעֲשׂ֔וּ אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הַ/בַּ֣יִת הַ/זֶּ֡ה מְלָכִים֩ יֹשְׁבִ֨ים לְ/דָוִ֜ד עַל כִּסְא֗/וֹ רֹֽכְבִים֙ בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֔ים ה֥וּא ו/עבד/ו וְ/עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/004.yaml
  text: For if you truly do this thing[a], then kings sitting on David’s throne will enter through the gates of this house, riding in chariots and on horses—he, his servants[b], and his people.
translation:
  language: fr
  text: Car si vous mettez vraiment cette parole en pratique[a], alors des rois qui siègent sur le trône de David entreront par les portes de cette maison, en chars et à cheval, chacun avec ses serviteurs[b] et son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette affaire » ou « cette chose ». Le mot hébreu דָּבָר peut désigner une parole, une affaire ou une chose.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lui, ses serviteurs et son peuple ». Le singulier est employé distributivement après le pluriel « rois », au sens de chaque roi accompagné des siens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: Conserve à la fois le lien logique avec le contexte précédent et la force conditionnelle de l’énoncé.
- source_word: עָשׂוֹ תַּעֲשׂוּ
  choice: vous mettez vraiment … en pratique
  rationale: L’infinitif absolu renforce le verbe; « vraiment » exprime cette insistance, tandis que « mettre en pratique » convient naturellement à une parole ou consigne.
- source_word: הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: דָּבָר peut désigner une parole, une affaire ou une chose. Ici, il renvoie à l’injonction précédente; « cette parole » garde le lien verbal sans exclure son contenu concret.
- source_word: וּבָאוּ בְשַׁעֲרֵי הַבַּיִת הַזֶּה
  choice: entreront par les portes de ce palais
  rationale: Le mouvement par les portes justifie « entreront par ». Dans le contexte de la maison du roi, « palais » explicite naturellement le référent de בַּיִת.
- source_word: מְלָכִים יֹשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: des rois qui siègent sur le trône de David
  rationale: Rend l’expression dynastique sans ajouter explicitement « descendants » ni imposer une interprétation messianique.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: montés sur des chars et sur des chevaux
  rationale: Expression française naturelle pour une procession royale; le singulier hébreu « char » a ici une valeur générique ou collective.
- source_word: הוּא וַעֲבָדָיו וְעַמּוֹ
  choice: chacun avec ses serviteurs et son peuple
  rationale: Le singulier hébreu reprend distributivement le pluriel « rois ». « Chacun » préserve clairement cette discordance signifiante en français.
theological_decisions:
- issue: Portée de la promesse concernant le trône de David
  choice: Présenter la continuité de la royauté davidique dans son cadre conditionnel immédiat.
  alternative: Formuler explicitement une promesse messianique ou parler de « rois de la lignée de David ».
  rationale: Le verset évoque directement des rois siégeant sur le trône de David et conditionne leur entrée à l’obéissance; il ne convient pas de résoudre dans la traduction les prolongements théologiques possibles.
translation_notes:
  register: Français international moderne, digne et accessible. « Palais » clarifie le contexte royal; « chacun » conserve la construction distributive de l’hébreu sans produire une discordance obscure en français.
