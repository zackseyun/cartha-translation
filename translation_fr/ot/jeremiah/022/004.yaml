review_pass:
  verdict: revise
  source_fidelity: 'Le sens conditionnel et emphatique de כִּי אִם et de l’infinitif absolu est bien rendu par « Car si vous mettez vraiment … en pratique ». La référence à des rois davidique est correctement maintenue sans lecture messianique imposée. « Chacun avec ses serviteurs et son peuple » rend de façon intelligible la reprise distributive au singulier. En revanche, « montés sur des chars » est moins exact et moins idiomatique : on est monté dans un char, mais sur un cheval.'
  naturalness: Le français est moderne, clair et d’un registre approprié. La formulation « en chars et à cheval » est à la fois idiomatique et plus précise pour la double construction hébraïque « dans le char / sur les chevaux ».
  terminology: « Palais » est contextuellement défendable pour הַבַּיִת dans l’allocution au palais royal, mais « cette maison » reproduit plus directement le terme source et laisse le référent contextuel sans le surinterpréter. « Trône de David » et « serviteurs » sont appropriés.
  issues:
  - severity: low
    issue: « montés sur des chars et sur des chevaux »
    rationale: En français, on dit normalement être « dans un char » et « à cheval ». « En chars et à cheval » conserve la distinction des moyens de transport exprimée par l’hébreu et améliore l’idiome.
  - severity: low
    issue: « ce palais » pour « cette maison »
    rationale: Le contexte permet de comprendre le palais royal, mais le texte hébreu dit littéralement « cette maison ». Employer « cette maison » préserve le terme source tout en restant naturel dans le contexte.
