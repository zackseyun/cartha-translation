revisions:
- from: Car si vous mettez vraiment cette parole en pratique[a], alors des rois qui siègent sur le trône de David entreront par les portes de ce palais, montés sur des chars et sur des chevaux, chacun avec ses serviteurs[b] et son peuple.
  to: Car si vous mettez vraiment cette parole en pratique[a], alors des rois qui siègent sur le trône de David entreront par les portes de cette maison, en chars et à cheval, chacun avec ses serviteurs[b] et son peuple.
  rationale: La révision corrige l’expression française relative aux chars et aux chevaux, et remplace « palais » par « maison » afin de suivre de plus près le lexique hébreu sans perdre le contexte royal. Les notes existantes restent exactes et leurs ancres demeurent correctement placées.
