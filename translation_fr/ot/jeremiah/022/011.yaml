id: JER.22.11
reference: Jeremiah 22:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה אֶל שַׁלֻּ֨ם בֶּן יֹאשִׁיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה הַ/מֹּלֵךְ֙ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו אֲשֶׁ֥ר יָצָ֖א מִן הַ/מָּק֣וֹם הַ/זֶּ֑ה לֹֽא יָשׁ֥וּב שָׁ֖ם עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/011.yaml
  text: 'For thus says Yahweh concerning Shallum son of Josiah[a], king of Judah, who reigned in place of Josiah his father, who went out from this place: He shall never return there again.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahvé au sujet de Shallum[a], fils de Josias, roi de Juda, qui a régné à la place de son père Josias et qui a quitté ce lieu : Il n’y reviendra plus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Shallum » ; la préposition hébraïque peut introduire une adresse directe, mais elle semble ici désigner le sujet de l’oracle.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que dit
  rationale: כִּי rattache cet oracle à ce qui précède avec une valeur explicative (« Car »), tandis que la formule prophétique כֹה אָמַר est rendue dans un français actuel et solennel par « voici ce que dit ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » translittère le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: au sujet de
  rationale: Après la formule prophétique, אֶל peut introduire la personne visée par l’oracle. « Au sujet de » convient au contexte, tout en laissant l’autre lecture en note.
- source_word: שַׁלֻּם בֶּן יֹאשִׁיָּהוּ
  choice: Shallum, fils de Josias
  rationale: Le nom propre est translittéré et la filiation est conservée directement.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Traduction directe du titre royal.
- source_word: הַמֹּלֵךְ תַּחַת יֹאשִׁיָּהוּ אָבִיו
  choice: qui a régné à la place de son père Josias
  rationale: Le participe et תַּחַת présentent Shallum comme celui qui a exercé la royauté à la place de son père; le passé composé est naturel dans ce récit français.
- source_word: אֲשֶׁר יָצָא מִן הַמָּקוֹם הַזֶּה
  choice: et qui a quitté ce lieu
  rationale: « Quitter ce lieu » restitue naturellement le mouvement de sortie exprimé par יָצָא מִן, sans préciser un lieu que le verset ne nomme pas.
- source_word: לֹא יָשׁוּב שָׁם עוֹד
  choice: Il n’y reviendra plus
  rationale: La négation avec עוֹד exprime ici l’absence définitive de retour; cette formulation française en rend clairement la force.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: Yahweh ou le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahvé » est une forme française reconnue qui le conserve comme nom, sans le remplacer par un titre.
- issue: Destinataire ou sujet de l’oracle introduit par אֶל
  choice: au sujet de Shallum
  alternative: à Shallum
  rationale: Le contexte présente une déclaration concernant le sort de Shallum, formulée ensuite à la troisième personne. La traduction principale retient donc « au sujet de », tandis que la possibilité plus littérale d’une adresse est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, mais évite les tournures artificielles; la reprise de « Josias » clarifie naturellement l’antécédent de « son père ».
