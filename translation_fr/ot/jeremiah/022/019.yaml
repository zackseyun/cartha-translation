source:
  edition: WLC
  text: קְבוּרַ֥ת חֲמ֖וֹר יִקָּבֵ֑ר סָח֣וֹב וְ/הַשְׁלֵ֔ךְ מֵ/הָ֖לְאָה לְ/שַׁעֲרֵ֥י יְרוּשָׁלִָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/019.yaml
  text: He will be buried with the burial of a donkey—dragged off and thrown out beyond the gates of Jerusalem[a][b].
translation:
  language: fr
  text: 'Il sera enterré comme on enterre un âne : traîné et jeté au-delà des portes de Jérusalem[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il sera enterré de l’enterrement d’un âne »; autre traduction possible : « Il aura la sépulture d’un âne ».'
    reason: lexical_alternative
  - marker: b
    text: Cette image évoque l’évacuation déshonorante du corps hors de la ville, plutôt qu’un ensevelissement accompagné des honneurs habituels.
    reason: cultural_note
lexical_decisions:
- source_word: קְבוּרַת חֲמוֹר
  choice: comme on enterre un âne
  rationale: La tournure française exprime naturellement le rapport de comparaison porté par la construction hébraïque « sépulture d’un âne », sans suggérer que l’homme serait enterré avec un âne.
- source_word: יִקָּבֵר
  choice: il sera enterré
  rationale: Le nifal inaccompli de קבר appelle ici un futur passif, naturel dans cette annonce prophétique.
- source_word: סָחוֹב
  choice: traîné
  rationale: L’infinitif absolu dépeint le traitement humiliant du corps. Le participe français s’intègre à l’explication qui suit les deux-points sans ajouter une direction absente du mot lui-même.
- source_word: וְהַשְׁלֵךְ
  choice: et jeté
  rationale: Le verbe שלך au hifil exprime l’action de jeter ou de rejeter; « jeté » conserve la force brutale et la coordination avec « traîné ».
- source_word: מֵהָלְאָה לְשַׁעֲרֵי
  choice: au-delà des portes de
  rationale: Cette expression rend le mouvement vers un lieu situé plus loin que les portes, donc hors de la ville, sans surcharger le texte.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
theological_decisions:
- issue: Nature de la comparaison avec l’ensevelissement d’un âne
  choice: Une évacuation déshonorante du corps, comparable au sort réservé à un âne
  alternative: Une simple indication littérale du mode d’ensevelissement, sans accent particulier sur le déshonneur
  rationale: La suite « traîné et jeté au-delà des portes » fait ressortir l’absence d’obsèques honorables. Cette portée reste expliquée en note plutôt qu’ajoutée explicitement au verset.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux-points rendent clairement le développement descriptif de la seconde proposition. « Comme on enterre un âne » évite le calque peu naturel « de l’enterrement d’un âne », tout en maintenant la comparaison et sa dureté.
