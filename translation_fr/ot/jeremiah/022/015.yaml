revisions:
- from: Penses-tu régner parce que tu rivalises par le cèdre[a] ? Ton père ne mangeait-il pas et ne buvait-il pas, tout en pratiquant le droit et la justice[b] ? Alors, tout allait bien pour lui.
  to: Est-ce parce que tu rivalises dans l’emploi du cèdre[a] que tu règnes ? Ton père n’a-t-il pas mangé et bu, et pratiqué le droit et la justice[b] ? Alors, il s’en est bien trouvé.
  rationale: La révision remplace une tournure française peu idiomatique par une formulation qui explicite sobrement la sphère probable de la rivalité, sans présenter cette interprétation contextuelle comme certaine; la note conserve donc les principales options. Elle rétablit aussi le passé narratif des actions du père et la simple coordination présente dans l’hébreu. Les marqueurs de note restent attachés aux expressions concernées.
