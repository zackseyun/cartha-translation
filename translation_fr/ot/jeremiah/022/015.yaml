id: JER.22.15
reference: Jeremiah 22:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/תִֽמְלֹ֔ךְ כִּ֥י אַתָּ֖ה מְתַחֲרֶ֣ה בָ/אָ֑רֶז אָבִ֜י/ךָ הֲ/ל֧וֹא אָכַ֣ל וְ/שָׁתָ֗ה וְ/עָשָׂ֤ה מִשְׁפָּט֙ וּ/צְדָקָ֔ה אָ֖ז ט֥וֹב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/015.yaml
  text: Do you reign because you compete in cedar? Did not your father eat and drink and do justice and righteousness? Then it was well with him[a][b].
translation:
  language: fr
  text: Est-ce parce que tu rivalises dans l’emploi du cèdre[a] que tu règnes ? Ton père n’a-t-il pas mangé et bu, et pratiqué le droit et la justice[b] ? Alors, il s’en est bien trouvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est rare. On pourrait aussi traduire : « tu rivalises avec le cèdre », « tu rivalises à coups de cèdre » ou « tu t’empresses d’employer du cèdre ». Elle évoque probablement une rivalité royale affichée par des constructions lambrissées de cèdre.'
    reason: lexical_alternative
  - marker: b
    text: « Le droit et la justice » peut aussi se traduire par « la justice et la droiture ».
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתִמְלֹךְ
  choice: Penses-tu régner
  rationale: L’imparfait qal à valeur interrogative met en cause le fondement de la royauté du destinataire. « Penses-tu régner » rend naturellement en français la portée rhétorique sans réduire la question à l’avenir.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici le motif supposé de la prétention à régner.
- source_word: מְתַחֲרֶה בָאָרֶז
  choice: tu rivalises par le cèdre
  rationale: Le verbe rare évoque vraisemblablement une rivalité ostentatoire, exprimée par l’emploi du cèdre dans les constructions royales. La formulation conserve l’étrangeté et l’ambiguïté de l’expression hébraïque, explicitées en note.
- source_word: אָבִיךָ
  choice: ton père
  rationale: Traduction directe de la relation filiale, probablement une allusion à Josias dans le contexte.
- source_word: הֲלוֹא אָכַל וְשָׁתָה
  choice: Ton père ne mangeait-il pas et ne buvait-il pas
  rationale: La question rhétorique attend une réponse affirmative. Les imparfaits français présentent la manière de vivre habituelle du père sans suggérer l’excès.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: tout en pratiquant le droit et la justice
  rationale: « Pratiquer » exprime l’action concrète, tandis que le couple « droit et justice » garde la distinction entre מִשְׁפָּט et צְדָקָה et leur portée morale et publique.
- source_word: אָז טוֹב לוֹ
  choice: Alors, tout allait bien pour lui
  rationale: « Alors » marque le résultat, et cette tournure française naturelle conserve le sens évaluatif de טוֹב לוֹ.
theological_decisions:
- issue: Rendu du couple מִשְׁפָּט וּצְדָקָה
  choice: le droit et la justice
  alternative: la justice et la droiture
  rationale: « Le droit et la justice » est un couple français naturel qui distingue l’exercice du jugement équitable de la conduite conforme à ce qui est juste. La note conserve « droiture », qui met davantage en relief la dimension morale de צְדָקָה.
translation_notes:
  register: Français international actuel, digne et accessible. La première question garde volontairement une légère étrangeté afin de ne pas effacer l’expression hébraïque rare; la note en précise les principales possibilités. Le parallélisme rhétorique et le lien de conséquence introduit par « Alors » sont maintenus.
