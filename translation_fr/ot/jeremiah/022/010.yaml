  text: אַל תִּבְכּ֣וּ לְ/מֵ֔ת וְ/אַל תָּנֻ֖דוּ ל֑/וֹ בְּכ֤וּ בָכוֹ֙ לַֽ/הֹלֵ֔ךְ כִּ֣י לֹ֤א יָשׁוּב֙ ע֔וֹד וְ/רָאָ֖ה אֶת אֶ֥רֶץ מוֹלַדְתּֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/010.yaml
  text: Do not weep for the dead[a], and do not mourn for him. Weep bitterly for the one going away[b], for he will never return or see the land of his birth.
translation:
  language: fr
  text: Ne pleurez pas celui qui est mort et ne le plaignez pas. Pleurez, pleurez celui qui s’en va[a], car il ne reviendra plus et ne reverra pas le pays où il est né.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, « celui qui s’en va » désigne le roi emmené en exil.
    reason: cultural_note
lexical_decisions:
- source_word: תִּבְכּוּ
  choice: pleurez
  rationale: Le verbe בכה signifie couramment « pleurer » et convient au contexte solennel de lamentation.
- source_word: לְמֵת
  choice: celui qui est mort
  rationale: Cette formulation conserve le singulier du texte hébreu et reste naturelle en français moderne.
- source_word: תָּנֻדוּ לוֹ
  choice: ne vous lamentez pas sur lui
  rationale: Dans un contexte funèbre, נוד peut exprimer la lamentation ou les manifestations de deuil, sans qu’il soit nécessaire de préciser un geste particulier.
- source_word: בְּכוּ בָכוֹ
  choice: Pleurez, oui, pleurez
  rationale: L’impératif suivi de l’infinitif absolu renforce l’ordre. La reprise avec « oui » rend cette insistance tout en conservant l’image verbale.
- source_word: לַהֹלֵךְ
  choice: celui qui s’en va
  rationale: Cette traduction préserve l’expression littérale et son ambiguïté, tandis que le contexte indique un départ en exil.
- source_word: לֹא יָשׁוּב עוֹד
  choice: il ne reviendra plus
  rationale: La tournure française rend naturellement le caractère définitif du non-retour exprimé par עוֹד sous la négation.
- source_word: וְרָאָה
  choice: et ne reverra pas
  rationale: Le second verbe reste sous la portée de la négation précédente. « Revoir » exprime idiomatiquement le fait de voir de nouveau sa terre natale.
- source_word: אֶרֶץ מוֹלַדְתּוֹ
  choice: le pays où il est né
  rationale: Cette formulation claire rend à la fois l’idée de territoire contenue dans אֶרֶץ et celle du lieu de naissance exprimée par מוֹלֶדֶת.
