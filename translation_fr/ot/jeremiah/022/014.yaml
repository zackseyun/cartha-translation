  text: הָ/אֹמֵ֗ר אֶבְנֶה לִּ/י֙ בֵּ֣ית מִדּ֔וֹת וַ/עֲלִיּ֖וֹת מְרֻוָּחִ֑ים וְ/קָ֤רַֽע ל/וֹ֙ חַלּוֹנָ֔/י וְ/סָפ֣וּן בָּ/אָ֔רֶז וּ/מָשׁ֖וֹחַ בַּ/שָּׁשַֽׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/014.yaml
  text: who says[a], ‘I will build myself a spacious house with roomy upper chambers,’ and cuts out windows for it, paneling it with cedar and painting it red.
translation:
  language: fr
  text: 'qui dit : « Je me construirai une vaste maison, avec de spacieuses chambres à l’étage. » Il y ouvre des fenêtres, la lambrisse de cèdre et la peint en rouge[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la peint au vermillon », peut-être du cinabre, un coûteux pigment rouge.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: qui dit
  rationale: Le participe avec article a une valeur substantivale et poursuit la description de l’homme dénoncé au verset précédent ; « qui dit » assure naturellement cette continuité.
- source_word: אֶבְנֶה לִּי
  choice: Je me construirai
  rationale: Le לִּי exprime l’intérêt personnel ; la tournure pronominale française rend de façon naturelle cette visée égoïste.
- source_word: בֵּית מִדּוֹת
  choice: une vaste maison
  rationale: L’expression désigne une maison aux dimensions imposantes. « Vaste » reste précis sans introduire l’idée plus interprétative de « palais » ou de « demeure luxueuse ».
- source_word: וַעֲלִיּוֹת מְרֻוָּחִים
  choice: avec de spacieuses chambres à l’étage
  rationale: עֲלִיּוֹת désigne des pièces situées en hauteur et מְרֻוָּחִים leur caractère spacieux ou bien aéré. La formulation choisie est claire en français moderne.
- source_word: וְקָרַע לוֹ חַלּוֹנָי
  choice: Il y ouvre des fenêtres
  rationale: קָרַע évoque littéralement le fait de fendre ou de pratiquer des ouvertures. « Ouvrir des fenêtres » est idiomatique en contexte architectural, et « y » rapporte vraisemblablement l’action à la maison.
- source_word: וְסָפוּן בָּאָרֶז
  choice: la lambrisse de cèdre
  rationale: סָפוּן indique un revêtement architectural. « Lambrisser » exprime précisément l’action de couvrir intérieurement de panneaux de bois.
- source_word: וּמָשׁוֹחַ בַּשָּׁשַׁר
  choice: la peint en rouge
  rationale: מָשׁוֹחַ signifie ici enduire ou peindre, et שָׁשַׁר désigne un pigment rouge dont l’identification exacte demeure discutée. Le texte principal reste compréhensible, tandis que la note conserve la précision possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le passage demeure syntaxiquement rattaché au verset précédent par « qui dit ». Le vocabulaire architectural est concret sans archaïsme excessif ; la possible identification technique du pigment est réservée à la note.
