id: JER.22.8
reference: Jeremiah 22:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָֽבְרוּ֙ גּוֹיִ֣ם רַבִּ֔ים עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אָֽמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/עִ֥יר הַ/גְּדוֹלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/008.yaml
  text: And many nations will pass by this city[a], and each man will say to his neighbor[b], ‘Why has Yahweh done thus to this great city?’
translation:
  language: fr
  text: 'De nombreuses nations passeront devant cette ville[a], et chacun dira à son voisin : « Pourquoi Yahweh a-t-il fait cela à cette grande ville ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « passeront près de cette ville » ou « passeront à côté de cette ville ».'
    reason: La préposition hébraïque עַל avec le verbe « passer » peut évoquer un mouvement devant la ville, à proximité d’elle ou à côté d’elle.
lexical_decisions:
- source_word: וְעָבְרוּ
  choice: passeront
  rationale: Dans cette suite prophétique, le parfait précédé de וְ reçoit naturellement une valeur future.
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: « Nations » conserve le sens collectif et international du terme dans ce contexte de jugement.
- source_word: עַל הָעִיר הַזֹּאת
  choice: près de cette ville
  rationale: Après עבר, עַל peut décrire un déplacement à côté ou au-delà d’un lieu ; cette formulation évite de suggérer un passage à l’intérieur de la ville.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: chacun dira à son prochain
  rationale: Cette expression distributive désigne des personnes qui se parlent l’une à l’autre ; « chacun… son prochain » en conserve la forme singulière et réciproque dans un français naturel.
- source_word: עַל מֶה
  choice: Pourquoi
  rationale: Équivalent français idiomatique de l’interrogation causale hébraïque.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Yahweh a-t-il traité ainsi
  rationale: Le verbe עשה avec כָּכָה décrit ici ce que Yahweh a fait subir à la ville ; « traité ainsi » est naturel en français tout en gardant la gravité de la question.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin présent dans le texte hébreu.
- source_word: לָעִיר הַגְּדוֹלָה הַזֹּאת
  choice: cette grande ville
  rationale: « Grande » peut exprimer aussi bien l’importance que la taille et convient au ton solennel du passage.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; sa transcription préserve le nom propre sans le remplacer par un titre.
- issue: Portée de l’expression distributive אִישׁ אֶל רֵעֵהוּ
  choice: chacun dira à son prochain
  alternative: ils se demanderont les uns aux autres
  rationale: Le choix conserve la structure distributive masculine singulière du texte tout en restant intelligible ; il ne limite pas nécessairement la scène à un groupe exclusivement masculin.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et orale dans la question rapportée, tandis que « de nombreuses nations » et « cette grande ville » maintiennent le registre prophétique solennel.
