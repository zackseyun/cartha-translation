  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲשׂ֤וּ מִשְׁפָּט֙ וּ/צְדָקָ֔ה וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עָשׁ֑וֹק וְ/גֵר֩ יָת֨וֹם וְ/אַלְמָנָ֤ה אַל תֹּנוּ֙ אַל תַּחְמֹ֔סוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֥וֹם הַ/זֶּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/003.yaml
  text: 'Thus says Yahweh: Do justice and righteousness[a], and deliver the robbed person from the hand of the oppressor. Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence[c][b], and do not shed innocent blood in this place.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Pratiquez le droit et la justice[a] ; délivrez la personne dépouillée du pouvoir de l’oppresseur. Ne maltraitez pas l’étranger résidant, l’orphelin ni la veuve ; ne commettez pas de violence[b]. Ne versez pas de sang innocent en ce lieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Faites ce qui est juste et droit. » L’hébreu emploie deux termes complémentaires qui concernent l’exercice équitable du droit et une conduite conforme à la justice.'
    reason: lexical_alternative
  - marker: b
    text: 'Le second interdit ne comporte pas de complément explicite en hébreu. Il peut viser les personnes mentionnées juste avant : « Ne maltraitez pas l’étranger résidant, l’orphelin ni la veuve et ne leur faites pas violence. »'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique solennelle et naturelle en français ; le nom divin est translittéré conformément au texte hébreu.
- source_word: עֲשׂוּ מִשְׁפָּט וּצְדָקָה
  choice: Pratiquez le droit et la justice
  rationale: Conserve les deux termes coordonnés tout en employant une tournure française idiomatique. « Le droit » souligne l’exercice juste du jugement et « la justice » la conduite droite.
- source_word: וְהַצִּילוּ גָזוּל
  choice: délivrez la personne dépouillée
  rationale: Exprime l’intervention active exigée par le hiphil de נצל et maintient l’attention sur la victime désignée par le participe passif גָזוּל.
- source_word: מִיַּד עָשׁוֹק
  choice: du pouvoir de l’oppresseur
  rationale: Rend explicitement l’idiome hébreu « de la main de », où la main représente ici l’emprise ou le pouvoir.
- source_word: גֵר
  choice: l’immigré
  rationale: Désigne clairement, en français actuel, un non-Israélite établi parmi le peuple et socialement vulnérable, sans l’archaïsme d’« étranger en séjour ».
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: Terme français courant pour la personne privée de protection parentale, notamment paternelle dans le contexte social ancien.
- source_word: אַל תֹּנוּ
  choice: Ne maltraitez pas
  rationale: Rend l’idée de tort et d’oppression sans créer une répétition trop étroite avec « oppresseur » dans la proposition précédente.
- source_word: אַל תַּחְמֹסוּ
  choice: ne leur faites aucune violence
  rationale: Préserve le second interdit distinct et l’idée de violence ou de tort brutal portée par חמס.
- source_word: דָם נָקִי
  choice: sang innocent
  rationale: Expression directe et consacrée qui conserve la force juridique et morale de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin ; sa translittération le distingue du titre אֲדֹנָי et suit l’orientation fournie.
- issue: Relation entre מִשְׁפָּט et צְדָקָה
  choice: le droit et la justice
  alternative: ce qui est juste et droit
  rationale: Le maintien de deux substantifs respecte le parallélisme et l’ampleur éthique de la paire sans la réduire à une seule notion.
- issue: Portée de אַל תַּחְמֹסוּ
  choice: ne leur faites aucune violence
  alternative: ne commettez aucune violence
  rationale: Le texte hébreu n’énonce pas de complément après ce second verbe. Le pronom « leur » présente, de façon naturelle mais interprétative, les trois groupes vulnérables comme son objet ; cette portée est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs pluriels s’adressent aux responsables et, plus largement, à la communauté. « Immigré » est retenu pour גֵר ; la note syntaxique préserve l’ambiguïté réelle de la portée du second interdit.
