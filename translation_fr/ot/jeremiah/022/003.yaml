  naturalness: Le français est moderne, clair et d’un registre approprié. « Pratiquez le droit et la justice » et « délivrez la personne dépouillée du pouvoir de l’oppresseur » sont naturels. « Immigré » peut évoquer les catégories administratives contemporaines et est moins précis ici qu’« étranger résidant », qui indique à la fois l’origine non israélite et l’établissement durable.
  terminology: « Yahweh », « droit et justice », « orphelin », « veuve » et « sang innocent » sont appropriés. « Étranger résidant » est préférable à « immigré » pour גֵר dans ce contexte antique. « Ne commettez pas de violence » conserve le second verbe sans lui imposer un objet absent du texte.
