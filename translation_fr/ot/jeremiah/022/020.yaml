source:
  edition: WLC
  text: עֲלִ֤י הַ/לְּבָנוֹן֙ וּֽ/צְעָ֔קִי וּ/בַ/בָּשָׁ֖ן תְּנִ֣י קוֹלֵ֑/ךְ וְ/צַֽעֲקִי֙ מֵֽ/עֲבָרִ֔ים כִּ֥י נִשְׁבְּר֖וּ כָּל מְאַהֲבָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/020.yaml
  text: Go up to Lebanon and cry out[a]; raise your voice in Bashan; cry out from Abarim[b], for all your lovers are shattered.
translation:
  language: fr
  text: Monte au Liban et crie ; dans le Basan, élève la voix ; crie depuis les Abarim[a], car tous tes amants ont été brisés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis les passages » ou « depuis les régions d’au-delà ». L’hébreu peut être compris comme un nom commun, mais, dans cette série avec le Liban et le Basan, il désigne probablement Abarim comme nom de lieu.
    reason: lexical_alternative
  - marker: b
    text: « Tes amants » est une métaphore prophétique désignant probablement les alliés ou partenaires politiques étrangers de Juda ou de Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי
  choice: Monte
  rationale: Impératif qal féminin singulier de עלה. « Monte » rend directement le mouvement ascendant et l’adresse personnifiée à Jérusalem/Juda.
- source_word: הַלְּבָנוֹן
  choice: au Liban
  rationale: Nom géographique bien établi en français ; la préposition française exprime naturellement la destination après « monter ».
- source_word: וּצְעָקִי / וְצַעֲקִי
  choice: et pousse des cris / pousse des cris
  rationale: Les deux impératifs répétés de צעק sont rendus de la même manière afin de conserver le parallélisme et l’urgence de l’hébreu, sans imposer exclusivement l’idée de deuil.
- source_word: וּבַבָּשָׁן
  choice: dans le Bashân
  rationale: Rendu locatif direct du nom de région ; l’accent circonflexe aide à distinguer la translittération traditionnelle française.
- source_word: תְּנִי קוֹלֵךְ
  choice: élève la voix
  rationale: Équivalent français naturel de l’idiome hébreu littéral « donne ta voix », indiquant une proclamation forte.
- source_word: מֵעֲבָרִים
  choice: depuis les Abarim
  rationale: Dans la série Liban–Bashân–Abarim, le terme est vraisemblablement un toponyme désignant les monts ou la région d’Abarim. L’ambiguïté lexicale est signalée en note.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français la raison de cet appel à crier.
- source_word: נִשְׁבְּרוּ
  choice: ont été brisés
  rationale: Le niphal parfait de שבר exprime ici l’état résultant de la ruine subie par les « amants ». « Brisés » conserve l’image hébraïque et sa force sans expliciter davantage le mode de leur défaite.
- source_word: כָּל מְאַהֲבָיִךְ
  choice: tous tes amants
  rationale: Conserve à la fois la totalité exprimée par כָּל et la métaphore prophétique de מְאַהֲבָיִךְ, plutôt que de la remplacer dans le texte par l’interprétation « alliés ».
theological_decisions:
- issue: Référent métaphorique de « tes amants »
  choice: Maintenir « tes amants » dans le texte principal, avec une note indiquant le sens politique probable.
  alternative: Traduire directement « tous tes alliés ».
  rationale: La métaphore amoureuse appartient à la rhétorique prophétique et porte une tension littéraire et théologique que la traduction ne doit pas effacer. Dans ce contexte, elle vise probablement les partenaires ou alliés étrangers de Juda/Jérusalem.
- issue: Identité de la destinataire féminine
  choice: Conserver les formes féminines singulières (« Monte », « tes ») sans ajouter de nom.
  alternative: Expliciter « Jérusalem » ou « Juda » dans le texte.
  rationale: L’hébreu s’adresse à une figure féminine singulière dont l’identité ressort du contexte. Ne pas l’expliciter ici évite de résoudre dans la traduction ce que le verset laisse implicite.
translation_notes:
  register: Français international actuel, poétique mais accessible. Le parallélisme des trois appels et la répétition de « pousse des cris » sont maintenus. Les toponymes sont rendus selon des formes françaises reconnaissables, et les métaphores de l’hébreu restent visibles.
