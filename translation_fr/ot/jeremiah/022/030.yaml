source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כִּתְב֞וּ אֶת הָ/אִ֤ישׁ הַ/זֶּה֙ עֲרִירִ֔י גֶּ֖בֶר לֹא יִצְלַ֣ח בְּ/יָמָ֑י/ו כִּי֩ לֹ֨א יִצְלַ֜ח מִ/זַּרְע֗/וֹ אִ֚ישׁ יֹשֵׁב֙ עַל כִּסֵּ֣א דָוִ֔ד וּ/מֹשֵׁ֥ל ע֖וֹד בִּ/יהוּדָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/030.yaml
  text: 'Thus says Yahweh: Write this man down as childless[a], a man who will not prosper in his days; for none of his offspring will prosper[b] to sit on the throne of David and rule again in Judah.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Inscrivez que cet homme est sans enfants[a], un homme qui ne réussira pas durant sa vie ; car aucun de ses descendants ne réussira[b] à siéger sur le trône de David et à régner de nouveau sur Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « comme privé d’héritier ». L’hébreu dit « sans enfants », mais la suite montre que l’accent porte sur la succession dynastique : aucun de ses descendants ne réussira sur le trône de David.'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, aucun descendant de Yekonia ne régnerait avec succès comme roi davidique en Juda.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel, conformément à la politique du projet, plutôt que de le remplacer par un titre.
- source_word: כִּתְבוּ
  choice: Inscrivez
  rationale: L’impératif pluriel évoque ici une consignation ou un enregistrement officiel ; « inscrivez » rend cette portée administrative avec naturel.
- source_word: עֲרִירִי
  choice: sans enfants
  rationale: Rend le sens lexical direct tout en laissant la proposition suivante préciser que le jugement porte sur la succession dynastique.
- source_word: לֹא יִצְלַח בְּיָמָיו
  choice: ne réussira pas durant sa vie
  rationale: צלח exprime la réussite ou le succès ; « durant sa vie » transmet naturellement l’hébreu littéral « dans ses jours ».
- source_word: מִזַּרְעוֹ
  choice: de ses descendants
  rationale: Le nom collectif זרע désigne ici la descendance ; « descendants » est clair et idiomatique en français moderne.
- source_word: אִישׁ יֹשֵׁב עַל כִּסֵּא דָוִד וּמֹשֵׁל עוֹד בִּיהוּדָה
  choice: à siéger sur le trône de David et à régner de nouveau sur Juda
  rationale: Cette formulation relie la réussite à l’exercice futur de la royauté davidique et conserve les deux images du texte hébreu.
theological_decisions:
- issue: Sens de « sans enfants » malgré l’existence connue de descendants de Yekonia
  choice: Conserver « sans enfants » dans le texte et expliquer en note sa portée dynastique contextuelle.
  alternative: Traduire directement « sans héritier » ou comprendre l’expression comme une malédiction hyperbolique.
  rationale: La suite du verset définit le jugement en termes de succession au trône de David, sans nécessairement nier toute descendance biologique.
- issue: Portée de la dernière proposition sur la royauté davidique
  choice: Comprendre qu’aucun descendant ne réussira à occuper le trône de David et à régner de nouveau sur Juda.
  alternative: Présenter séparément l’absence d’accession au trône et l’absence de règne, ou limiter l’énoncé à la seule vie du roi.
  rationale: La syntaxe associe le verbe de réussite à la fonction royale décrite ensuite ; le jugement vise la continuation réussie de sa lignée royale en Juda.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve le ton solennel de l’oracle, tout en remplaçant l’hébraïsme « dans ses jours » par « durant sa vie ». Les notes préservent la tension entre le sens lexical de עֲרִירִי et sa portée dynastique dans le contexte.
