source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה רֵ֖ד בֵּֽית מֶ֣לֶךְ יְהוּדָ֑ה וְ/דִבַּרְתָּ֣ שָׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/001.yaml
  text: 'Thus says Yahweh: Go down to the house of the king of Judah[c][b][a], and speak there this word:'
translation:
  language: fr
  text: 'Ainsi parle Yahweh[a] : Descends au palais du roi de Juda[b] et prononce là cette parole[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Voici ce que dit Yahweh. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à la maison du roi de Juda »; il s’agit vraisemblablement du palais royal.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « ce message ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formule française conserve la cadence solennelle de la formule prophétique tout en restant claire et actuelle. Le présent rend sa fonction d’introduction immédiate du discours.
- source_word: רֵד
  choice: Descends
  rationale: L’impératif préserve explicitement le mouvement vers le bas exprimé par ירד, sans l’atténuer en un simple « va ».
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: au palais du roi de Juda
  rationale: Le mot בַּיִת signifie littéralement « maison », mais désigne ici très probablement la résidence royale. « Palais » communique naturellement ce référent en français; la formulation littérale est signalée en note.
- source_word: וְדִבַּרְתָּ שָׁם
  choice: et prononce là
  rationale: La forme verbale coordonnée prolonge l’impératif. « Prononce » convient à la transmission orale d’une parole prophétique sans renforcer indûment le sens en « proclame ».
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: דָּבָר désigne ici l’énoncé prophétique qui suit. « Parole » garde le singulier et l’idiome biblique, tandis que « message » demeure une possibilité contextuelle.
theological_decisions:
- issue: Transcription du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre; la vocalisation historique exacte reste toutefois discutée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formule prophétique garde une solennité naturelle. « Descends » conserve l’indication spatiale de l’hébreu, et les guillemets ouvrent la parole divine dont le contenu se poursuit au verset suivant.
