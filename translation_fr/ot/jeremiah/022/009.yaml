  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם וַ/יִּֽשְׁתַּחֲו֛וּ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/יַּעַבְדֽוּ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/009.yaml
  text: And they will say[b][a], ‘Because they abandoned the covenant of Yahweh their God and bowed down to other gods and served them.’
translation:
  language: fr
  text: 'Et l’on répondra : « Parce qu’ils ont abandonné l’alliance de Yahweh, leur Dieu, se sont prosternés devant d’autres dieux et les ont servis. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Et l’on répondra
  rationale: Dans le dialogue ouvert au verset précédent, le pluriel hébreu indéfini se rend naturellement en français par « l’on »; « répondra » explicite la fonction contextuelle de la parole sans en changer le contenu.
- source_word: עַל אֲשֶׁר
  choice: C’est parce que
  rationale: Cette tournure française exprime clairement la cause introduite par l’expression hébraïque et convient à une réponse à la question précédente.
- source_word: עָזְבוּ
  choice: ils ont abandonné
  rationale: « Abandonner » exprime clairement la rupture et la déloyauté envers l’alliance, sans archaïsme.
- source_word: בְּרִית
  choice: l’alliance
  rationale: Terme français établi pour la relation d’engagement désignée ici par בְּרִית.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Malgré la forme morphologiquement plurielle du nom, la construction désigne ici le Dieu unique d’Israël dans la formule d’alliance.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: ils se sont prosternés
  rationale: Conserve l’image concrète de la prosternation et sa valeur cultuelle dans ce contexte.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: devant d’autres dieux
  rationale: Après le verbe « se prosterner », « devant » est idiomatique en français et désigne clairement les destinataires de l’hommage.
- source_word: וַיַּעַבְדוּם
  choice: et les ont servis
  rationale: Préserve la distinction lexicale entre se prosterner et servir tout en laissant apparaître la portée cultuelle du second verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Lien entre prosternation et service des autres dieux
  choice: deux actes coordonnés décrivant l’idolâtrie
  alternative: fusionner les deux verbes en « adorer »
  rationale: Le maintien des deux verbes respecte la formulation hébraïque et sa progression, sans réduire les deux expressions à un seul terme interprétatif.
translation_notes:
  register: Français international moderne, naturel et digne. La construction clivée « C’est parce que… que… » rend explicitement le rapport causal avec la question du verset précédent. Aucun archaïsme ni vocabulaire confessionnel particulier.
