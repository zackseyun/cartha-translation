  source_fidelity: 'La proposition conserve les éléments lexicaux essentiels : abandon de l’alliance, Yahweh leur Dieu, prosternation devant d’autres dieux et service rendu à ceux-ci. Toutefois, la construction clivée « C’est parce qu’ils ont abandonné … qu’ils se sont prosternés … » réorganise la syntaxe : elle fait de la prosternation et du service la conséquence de l’abandon, alors que l’hébreu coordonne les trois actes comme motifs du jugement évoqué au verset précédent.'
  naturalness: Le français est généralement moderne et fluide. Une réponse introduite directement par « Parce qu’ils… » est idiomatique dans ce contexte et permet de conserver la coordination des trois verbes sans alourdir la phrase.
  terminology: « Alliance », « Yahweh », « leur Dieu », « se sont prosternés » et « les ont servis » sont exacts, naturels et conservent la distinction entre les deux verbes cultuels hébreux. « Devant d’autres dieux » convient bien avec « se prosterner ».
