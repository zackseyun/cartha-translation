language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דִּבַּ֤רְתִּי אֵלַ֨יִ/ךְ֙ בְּ/שַׁלְוֺתַ֔יִ/ךְ אָמַ֖רְתְּ לֹ֣א אֶשְׁמָ֑ע זֶ֤ה דַרְכֵּ/ךְ֙ מִ/נְּעוּרַ֔יִ/ךְ כִּ֥י לֹֽא שָׁמַ֖עַתְּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/021.yaml
  text: I spoke to you in your prosperity[a], but you said, ‘I will not listen.’ This has been your way from your youth[b], for you have not listened to my voice.
translation:
  language: fr
  text: 'Je t’ai parlé quand tu vivais dans la prospérité[a], mais tu as dit : « Je n’écouterai pas. » Telle est ta conduite depuis ta jeunesse, car tu n’as pas écouté ma voix.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’aisance » ou « dans la sécurité ». Le terme hébreu peut désigner une tranquillité aisée, la sécurité ou la prospérité.
    reason: lexical_alternative
  - marker: b
    text: Ici comme plus haut, « écouter » peut aussi se traduire par « obéir » ; dans ce contexte, le verbe hébreu peut exprimer les deux idées.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי אֵלַיִךְ
  choice: Je t’ai parlé
  rationale: Rend directement l’adresse passée de YHWH à la destinataire féminine singulière, sans expliciter son identité.
- source_word: בְּשַׁלְוֺתַיִךְ
  choice: quand tu vivais dans la prospérité
  rationale: שַׁלְוָה peut désigner l’aisance tranquille, la sécurité ou la prospérité. Cette formulation naturelle exprime ici une situation durable sans ajouter l’idée morale de complaisance.
- source_word: לֹא אֶשְׁמָע
  choice: Je n’écouterai pas
  rationale: Préserve le sens concret d’écouter tout en laissant entendre l’implication d’obéir portée par שׁמע dans ce contexte.
- source_word: זֶה דַרְכֵּךְ
  choice: Telle est ta conduite
  rationale: Le nom דֶּרֶךְ désigne ici la manière habituelle d’agir. « Conduite » est idiomatique en français et s’accorde naturellement avec « depuis ta jeunesse ».
- source_word: מִנְּעוּרַיִךְ
  choice: depuis ta jeunesse
  rationale: Expression française naturelle pour un comportement qui remonte à la jeunesse et se poursuit.
- source_word: לֹא שָׁמַעַתְּ בְּקוֹלִי
  choice: tu n’as pas écouté ma voix
  rationale: Conserve la répétition de שׁמע et l’image hébraïque de la voix, sans réduire l’expression au seul concept d’obéissance.
theological_decisions:
- issue: Identité de la destinataire féminine personnifiée
  choice: Conserver le tutoiement au féminin implicite sans nommer Jérusalem ou Juda dans le texte
  alternative: Identifier explicitement la destinataire comme Jérusalem, Juda ou la maison royale
  rationale: Les formes hébraïques sont au féminin singulier, mais le verset ne nomme pas la destinataire. Ne pas l’expliciter préserve l’adresse directe et l’ambiguïté contextuelle.
- issue: Portée de שׁמע
  choice: Traduire par « écouter » aux deux occurrences
  alternative: Traduire par « obéir »
  rationale: Le verbe peut unir audition attentive et obéissance. « Écouter » préserve l’image et la répétition, tandis qu’une note signale la portée possible d’obéissance.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse singulière directe. La reprise d’« écouter » rend la répétition hébraïque, et « ma voix » en maintient l’image.
