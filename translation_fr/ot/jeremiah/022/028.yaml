  text: הַ/עֶ֨צֶב נִבְזֶ֜ה נָפ֗וּץ הָ/אִ֤ישׁ הַ/זֶּה֙ כָּנְיָ֔הוּ אִ֨ם כְּלִ֔י אֵ֥ין חֵ֖פֶץ בּ֑/וֹ מַדּ֤וּעַ הֽוּטֲלוּ֙ ה֣וּא וְ/זַרְע֔/וֹ וְ/הֻ֨שְׁלְכ֔וּ עַל הָ/אָ֖רֶץ אֲשֶׁ֥ר לֹא יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/028.yaml
  text: Is this man Coniah a despised[a], broken vessel[b], or a vessel in which there is no delight? Why have he and his offspring been hurled out and cast into a land that they did not know?
translation:
  language: fr
  text: Cet homme, Conia, est-il un objet façonné[a], méprisé et brisé, ou un vase dont personne ne veut ? Pourquoi ont-ils été jetés au loin, lui et sa descendance, puis précipités dans un pays qu’ils ne connaissaient pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une idole » ou « une image ». Le mot hébreu désigne un objet façonné et peut notamment s’employer pour une idole ; le parallèle avec « vase » évoque ici un objet que l’on peut briser et jeter.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶצֶב
  choice: un objet façonné[a]
  rationale: Le nom peut désigner un objet fabriqué, notamment une image ou une idole. « Objet façonné » conserve cette valeur sans imposer l’idée de poterie, suggérée mais non exprimée directement par le mot.
- source_word: נִבְזֶה נָפוּץ
  choice: méprisé et brisé
  rationale: « Méprisé » garde le sens passif de rejet et de honte ; dans l’image d’un objet ou d’un vase, « brisé » exprime naturellement la destruction indiquée par נָפוּץ.
- source_word: כָּנְיָהוּ
  choice: Conias
  rationale: Forme française traditionnelle et reconnaissable correspondant à la forme hébraïque courte du nom royal, distincte ici de Jéconias.
- source_word: כְּלִי אֵין חֵפֶץ בּוֹ
  choice: un vase auquel personne ne prend plaisir
  rationale: « Vase » convient à l’image concrète d’un récipient, tandis que « auquel personne ne prend plaisir » préserve la notion de plaisir ou d’agrément exprimée par חֵפֶץ, sans ajouter explicitement l’idée d’inutilité.
- source_word: הוּטֲלוּ ... וְהֻשְׁלְכוּ
  choice: ont-ils été jetés au loin ... puis précipités
  rationale: Les deux passifs successifs expriment une expulsion violente. La formulation française maintient leur redoublement tout en rendant l’enchaînement naturel.
- source_word: הוּא וְזַרְעוֹ
  choice: lui et sa descendance
  rationale: « Descendance » rend le sens familial collectif de זֶרַע dans un français moderne et digne.
- source_word: עַל הָאָרֶץ אֲשֶׁר לֹא יָדָעוּ
  choice: dans un pays qu’ils ne connaissaient pas
  rationale: Dans ce contexte d’exil, עַל הָאָרֶץ indique la terre de destination. « Pays » convient mieux que « terre » à la relative qui suit.
