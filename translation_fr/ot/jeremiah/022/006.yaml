  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל בֵּית֙ מֶ֣לֶךְ יְהוּדָ֔ה גִּלְעָ֥ד אַתָּ֛ה לִ֖/י רֹ֣אשׁ הַ/לְּבָנ֑וֹן אִם לֹ֤א אֲשִֽׁיתְ/ךָ֙ מִדְבָּ֔ר עָרִ֖ים לֹ֥א נושבה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/006.yaml
  text: 'For thus says Yahweh concerning the house of the king of Judah: You are Gilead to me[a], the summit of Lebanon; surely I will make you a wilderness[c][b], cities not inhabited.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh au sujet de la maison du roi de Juda : Tu es pour moi comme Galaad, comme le sommet du Liban[a] ; certainement, je ferai de toi un désert, des villes inhabitées[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Galaad tu es pour moi, tête du Liban ». « Tête » peut ici désigner le sommet ou exprimer la hauteur et la prééminence.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une formule emphatique proche d’un serment, littéralement : « si je ne fais pas de toi un désert… »'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « des villes sans habitants ». La construction hébraïque est elliptique et décrit vraisemblablement les villes laissées sans habitants à la suite du jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et préserve sa distinction d’avec les titres tels que « Seigneur ».
- source_word: עַל בֵּית מֶלֶךְ יְהוּדָה
  choice: au sujet de la maison du roi de Juda
  rationale: « Maison » conserve la portée possible du terme hébreu, qui peut viser le palais, la maisonnée ou l’établissement royal, sans limiter prématurément le sens.
- source_word: גִּלְעָד אַתָּה לִי
  choice: Tu es pour moi comme Galaad
  rationale: L’ajout de « comme » explicite en français la valeur métaphorique de l’énoncé nominal, tandis que « pour moi » maintient la relation exprimée par לִי.
- source_word: רֹאשׁ הַלְּבָנוֹן
  choice: le sommet du Liban
  rationale: רֹאשׁ signifie littéralement « tête »; dans cette image géographique, « sommet » est naturel et conserve l’idée de hauteur et de prééminence.
- source_word: אִם לֹא
  choice: certainement
  rationale: La tournure introduit ici une déclaration emphatique proche d’un serment, non une condition ordinaire.
- source_word: אֲשִׁיתְךָ מִדְבָּר
  choice: je te réduirai en désert
  rationale: La formulation française exprime naturellement le changement d’état annoncé par שׂים avec l’attribut מִדְבָּר et la désolation qui en résulte.
- source_word: עָרִים לֹא נוֹשָׁבָה
  choice: en villes sans habitants
  rationale: Rend l’expression appositionnelle difficile de l’hébreu comme une seconde image du résultat du jugement, sans en masquer l’ellipse.
theological_decisions:
- issue: Image valorisante suivie de l’annonce du jugement
  choice: Conserver Galaad et le sommet du Liban comme images de valeur ou d’élévation, puis marquer le retournement par « Pourtant »
  alternative: Comprendre les noms géographiques comme des allusions plus concrètes aux régions boisées et aux cèdres associés au palais
  rationale: Le verset juxtapose le statut élevé de la maison royale aux conséquences certaines du jugement. La traduction préserve cette tension sans définir trop précisément la portée symbolique des lieux.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique reste solennelle sans archaïsmes. « Yahweh » suit la convention du projet pour le nom divin; « maison » conserve l’ambiguïté entre palais, maisonnée et institution royale.
