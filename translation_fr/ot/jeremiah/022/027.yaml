source:
  edition: WLC
  text: וְ/עַל הָ/אָ֗רֶץ אֲשֶׁר הֵ֛ם מְנַשְּׂאִ֥ים אֶת נַפְשָׁ֖/ם לָ/שׁ֣וּב שָׁ֑ם שָׁ֖מָּ/ה לֹ֥א יָשֽׁוּבוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/027.yaml
  text: But to the land to which they lift up their soul to return[a], there they will not return.
translation:
  language: fr
  text: Mais quant au pays où ils désirent ardemment retourner[a], ils n’y retourneront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers lequel ils élèvent leur âme pour y retourner ». L’expression hébraïque « élever son âme » traduit un désir profond, une vive aspiration.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הָאָרֶץ
  choice: Mais quant au pays
  rationale: La conjonction et la préposition introduisent un thème en contraste avec le verset précédent. « Quant au pays » rend naturellement cette mise en relief, tandis que « mais » marque le contraste.
- source_word: אֲשֶׁר
  choice: où
  rationale: Le relatif rattache au « pays » la destination du retour. En français, « où retourner » est plus naturel que « vers lequel retourner ».
- source_word: מְנַשְּׂאִים אֶת נַפְשָׁם
  choice: ils désirent ardemment
  rationale: L’expression littérale « élever leur âme » exprime ici une aspiration intense. « Désirer ardemment » en communique le sens en français actuel sans conserver un calque obscur.
- source_word: לָשׁוּב שָׁם
  choice: retourner
  rationale: Le lieu est déjà exprimé par le relatif « où » ; répéter « là » dans la relative alourdirait inutilement le français.
- source_word: שָׁמָּה לֹא יָשׁוּבוּ
  choice: ils n’y retourneront pas
  rationale: Le pronom adverbial « y » reprend explicitement le pays et conserve l’insistance de l’hébreu sur la destination, tout en gardant la répétition du verbe « retourner ».
