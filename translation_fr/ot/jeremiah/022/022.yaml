base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/022.yaml
  text: All your shepherds the wind will shepherd[a], and your lovers will go into captivity[b]; then you will surely be ashamed and humiliated because of all your evil.
translation:
  language: fr
  text: Tous tes bergers, le vent les emportera[a], et tes amants iront en captivité[b]. Alors tu auras honte et tu seras humiliée à cause de toute ta méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vent dispersera tous tes dirigeants ». En hébreu, « bergers » et le verbe rendu ici par « emportera » viennent de la même racine, littéralement liée à l’action de paître; ce jeu de mots ironique présente les bergers comme étant eux-mêmes menés par le vent.
    reason: lexical_alternative
  - marker: b
    text: Dans le langage prophétique, les « amants » désignent notamment les alliés politiques de Juda et ses attachements infidèles.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעַיִךְ
  choice: tes bergers
  rationale: Le participe de רעה désigne littéralement des « bergers » et, par métaphore, les dirigeants de Juda. « Bergers » conserve l’image prophétique sans en réduire d’emblée le référent aux seuls chefs politiques.
- source_word: תִּרְעֶה רוּחַ
  choice: le vent les mènera paître
  rationale: Le verbe reprend la racine רעה déjà présente dans « bergers ». La formulation française conserve autant que possible cette ironie pastorale, tandis que la note signale le sens contextuel possible de dispersion.
- source_word: מְאַהֲבַיִךְ
  choice: tes amants
  rationale: Le terme garde la métaphore prophétique des attachements infidèles de Juda, notamment ses alliances politiques, au lieu de la remplacer par l’explication « alliés ».
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: partiront en captivité
  rationale: La formulation suit de près l’expression hébraïque « aller en captivité » tout en restant naturelle en français.
- source_word: כִּי אָז
  choice: Alors
  rationale: Dans ce contexte, la locution introduit la conséquence du jugement annoncé. « Alors » restitue clairement cette progression.
- source_word: תֵּבֹשִׁי וְנִכְלַמְתְּ
  choice: tu seras couverte de honte et d’humiliation
  rationale: Cette formulation distingue les deux termes hébreux étroitement liés, בוש et נכלם, et exprime naturellement en français l’état de honte et d’abaissement.
- source_word: מִכֹּל רָעָתֵךְ
  choice: à cause de toute ta méchanceté
  rationale: La préposition a ici une valeur causale. « Méchanceté » exprime le mal moral imputé à la destinataire, tandis que « toute » conserve la portée globale de כֹּל.
theological_decisions:
- issue: Métaphores de l’infidélité politique et spirituelle de Juda
  choice: Conserver « bergers » et « amants » dans le texte principal.
  alternative: Remplacer les images par « dirigeants » et « alliés ».
  rationale: Les métaphores portent l’accusation prophétique et maintiennent ensemble ses dimensions politique, morale et spirituelle. Les expliciter directement dans le texte en réduirait la force et résoudrait inutilement leur portée.
- issue: Jeu de mots entre les bergers et l’action du vent
  choice: Rendre l’image par « le vent les mènera paître » et expliquer en note le sens possible de dispersion.
  alternative: Traduire directement « le vent dispersera tous tes dirigeants ».
  rationale: L’hébreu répète la racine pastorale רעה de façon ironique. La traduction retenue préserve cette tension imagée sans exclure l’idée contextuelle que le vent les emporte ou les disperse.
translation_notes:
  register: Français international actuel, digne et accessible. Le féminin singulier (« tu seras couverte ») correspond à la destinataire personnifiée, vraisemblablement Jérusalem. La structure détachée « Tous tes bergers, le vent les… » permet de conserver l’ordre emphatique de l’hébreu sans rendre la phrase obscure.
