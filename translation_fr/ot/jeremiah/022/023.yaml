  text: ישבתי בַּ/לְּבָנ֔וֹן מקננתי בָּֽ/אֲרָזִ֑ים מַה נֵּחַנְתְּ֙ בְּ/בֹא לָ֣/ךְ חֲבָלִ֔ים חִ֖יל כַּ/יֹּלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/023.yaml
  text: You who dwell in Lebanon[a], who nest in the cedars, how you will groan when pangs come upon you[b], pain like that of a woman giving birth.
translation:
  language: fr
  text: Toi qui habites au Liban[a], qui fais ton nid parmi les cèdres, comme tu gémiras[b] quand les douleurs t’assailliront, une souffrance comme celle d’une femme qui accouche !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Liban et les cèdres évoquent probablement le palais royal construit avec du bois de cèdre du Liban, et présentent les dirigeants de Juda comme installés dans une sécurité hautaine.
    reason: cultural_note
  - marker: b
    text: 'Ou : « comme tu seras prise en pitié ». Le verbe hébreu est difficile ; certains lui donnent ici le sens d’être prise en pitié plutôt que celui de pousser des gémissements.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ישבתי
  choice: toi qui habites
  rationale: Le contexte et les formes féminines singulières qui suivent montrent que le texte interpelle une destinataire personnifiée. ישב exprime ici le fait d’habiter plutôt que la position assise.
- source_word: בַּלְּבָנוֹן
  choice: au Liban
  rationale: La tournure locative est conservée sans trancher dans le texte entre lieu réel, image de hauteur et évocation du palais royal construit en bois du Liban.
- source_word: מקננתי
  choice: qui fais ton nid
  rationale: Cette formulation garde la métaphore vive de קנן et suggère une installation en sécurité.
- source_word: בָּאֲרָזִים
  choice: parmi les cèdres
  rationale: Le pluriel concret est maintenu. « Parmi » est naturel en français avec l’image du nid, tout en laissant ouverte une possible allusion aux constructions en bois de cèdre.
- source_word: מַה
  choice: comme
  rationale: מַה introduit ici une exclamation d’intensité et non une question. « Comme » rend naturellement cet emploi en français.
- source_word: נֵּחַנְתְּ
  choice: tu gémiras
  rationale: Le verbe est difficile, mais le sens de gémir convient au contexte immédiat des douleurs de l’accouchement. L’autre analyse, « tu seras prise en pitié », est signalée en note.
- source_word: בְּבֹא לָךְ
  choice: quand … t’assailliront
  rationale: L’infinitif avec בְּ marque la circonstance temporelle. « T’assailliront » exprime idiomatiquement la venue soudaine des douleurs sans modifier l’image.
- source_word: חֲבָלִים
  choice: les douleurs
  rationale: Dans le voisinage explicite de l’accouchement, le nom désigne des douleurs ou contractions plutôt que des liens ou cordes.
- source_word: חִיל
  choice: douleur
  rationale: Le terme évoque l’angoisse douloureuse et le tremblement. Le singulier français reprend cette souffrance en apposition aux douleurs précédentes.
- source_word: כַּיֹּלֵדָה
  choice: semblable à celle d’une femme qui accouche
  rationale: La comparaison avec une femme en train d’accoucher est exprimée clairement dans un français moderne et digne.
