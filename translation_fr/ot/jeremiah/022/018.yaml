revisions:
- from: 'C’est pourquoi, voici ce que dit Yahweh au sujet de Joïaqim, fils de Josias, roi de Juda : On ne se lamentera pas sur lui[a] en disant : « Hélas, mon frère ! Hélas, sœur[b] ! » On ne se lamentera pas sur lui en disant : « Hélas, seigneur[c] ! Hélas, sa majesté[d] ! »'
  to: 'C’est pourquoi, voici ce que dit Yahweh au sujet de Joïaqim, fils de Josias, roi de Juda : On ne fera pas de lamentation pour lui[a] en disant : « Hélas, mon frère ! Hélas, ma sœur[b] ! » On ne fera pas de lamentation pour lui en disant : « Hélas, seigneur[c] ! Hélas, sa majesté[d] ! »'
  rationale: La révision élimine deux calques qui nuisaient au français moderne tout en maintenant la portée funéraire de ספד et les formules répétées de lamentation. Elle fournit « ma » dans l’apostrophe française pour l’idiome, mais la note préserve explicitement l’ambiguïté formelle et la dissymétrie de l’hébreu. Les ancres restent séquentielles et chacune correspond à une note existante.
