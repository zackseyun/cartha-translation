  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אֶל יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָחִ֖/י וְ/ה֣וֹי אָח֑וֹת לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָד֖וֹן וְ/ה֥וֹי הֹדֹֽ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/018.yaml
  text: 'Therefore thus says Yahweh concerning Jehoiakim son of Josiah[a], king of Judah: They will not lament for him, saying, “Alas, my brother!” or “Alas, sister!” They will not lament for him, saying, “Alas, lord!” or “Alas[d][c][b], his majesty!”'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh au sujet de Joïaqim, fils de Josias, roi de Juda : On ne fera pas de lamentation pour lui[a] en disant : « Hélas, mon frère ! Hélas, ma sœur[b] ! » On ne fera pas de lamentation pour lui en disant : « Hélas, seigneur[c] ! Hélas, sa majesté[d] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « On ne se lamentera pas pour lui ». Le verbe hébreu désigne spécialement une lamentation funèbre publique.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement « sœur », sans le possessif explicite présent dans « mon frère ». Le français emploie « ma sœur » dans cette apostrophe pour une formulation naturelle.
    reason: lexical_alternative
  - marker: c
    text: Le titre hébreu peut désigner un maître, un supérieur ou un souverain.
    reason: lexical_alternative
  - marker: d
    text: Ou « Hélas, sa splendeur ! » Le terme hébreu évoque la majesté, l’éclat ou la splendeur du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence de l’oracle précédent et conserve l’enchaînement argumentatif.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Rend naturellement en français moderne la formule prophétique de messager tout en conservant le nom divin.
- source_word: אֶל
  choice: au sujet de
  rationale: Dans ce contexte de jugement, la préposition introduit la personne visée par l’oracle plutôt qu’un destinataire directement interpellé.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Joïaqim, fils de Josias, roi de Juda
  rationale: Emploie les formes françaises usuelles des noms bibliques et maintient toute l’identification royale.
- source_word: לֹא יִסְפְּדוּ לוֹ
  choice: On ne se lamentera pas sur lui
  rationale: Le verbe ספד désigne particulièrement les lamentations funèbres; la tournure impersonnelle française rend naturellement le pluriel indéfini.
- source_word: הוֹי
  choice: Hélas
  rationale: Interjection de plainte adaptée au contexte de lamentation funèbre.
- source_word: אָחִי
  choice: mon frère
  rationale: Le suffixe de première personne du singulier est explicite dans l’hébreu.
- source_word: אָחוֹת
  choice: sœur
  rationale: À la différence de אָחִי, le mot ne porte ici aucun suffixe possessif; la traduction conserve cette dissymétrie.
- source_word: אָדוֹן
  choice: seigneur
  rationale: Titre donné à un supérieur ou à un souverain; la minuscule évite de le confondre avec un titre divin.
- source_word: הֹדֹה
  choice: sa majesté
  rationale: Le nom הוֹד évoque la majesté ou la splendeur, et le suffixe renvoie au roi défunt; cette expression conserve la forme étonnante de la plainte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- issue: Dissymétrie entre אָחִי et אָחוֹת
  choice: « mon frère » mais « sœur »
  alternative: « mon frère » et « ma sœur »
  rationale: Seul le premier terme porte un suffixe possessif. Le texte principal garde cette différence au lieu de régulariser silencieusement le parallélisme.
- issue: Sens de הֹדֹה dans la lamentation royale
  choice: sa majesté
  alternative: sa splendeur
  rationale: « Sa majesté » exprime le prestige royal tout en maintenant le suffixe de troisième personne; la note conserve le sens plus directement lexical de « splendeur ».
translation_notes:
  register: Français international moderne, digne et lisible. La formule « voici ce que dit » évite un archaïsme inutile, tandis que les cris de deuil conservent leur caractère solennel. Les étrangetés significatives de l’hébreu — absence de possessif avec « sœur » et lamentation sur « sa majesté » — ne sont pas lissées.
