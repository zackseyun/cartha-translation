source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם תָּפֵ֨רוּ֙ אֶת בְּרִיתִ֣/י הַ/יּ֔וֹם וְ/אֶת בְּרִיתִ֖/י הַ/לָּ֑יְלָה וּ/לְ/בִלְתִּ֛י הֱי֥וֹת יֽוֹמָם וָ/לַ֖יְלָה בְּ/עִתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/020.yaml
  text: 'Thus says Yahweh: If you can break my covenant with the day and my covenant with the night[a], so that day and night will not be at their appointed time[b],'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh : « Si vous pouvez rompre mon alliance avec le jour et mon alliance avec la nuit[a], de sorte que le jour et la nuit ne se produisent pas au moment qui leur est fixé[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si vous rompez mon alliance avec le jour et mon alliance avec la nuit. » L’hébreu formule simplement la condition ; « pouvez » en explicite la portée rhétorique dans ce contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de sorte qu’il n’y ait pas le jour et la nuit au moment qui leur est fixé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formulation prophétique naturelle en français moderne. Le tétragramme est transcrit « Yahweh » afin de rendre explicitement le nom divin.
- source_word: אִם תָּפֵרוּ
  choice: Si vous pouvez rompre
  rationale: Le hiphil de הפר signifie « rompre, annuler, violer », notamment une alliance. L’ajout de « pouvez » explicite avec naturel la portée rhétorique et l’impossibilité suggérée par le contexte, tandis qu’une note conserve la formulation conditionnelle plus stricte.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français usuel pour ברית et maintient l’image juridique et relationnelle du texte.
- source_word: הַיּוֹם וְאֶת בְּרִיתִי הַלָּיְלָה
  choice: avec le jour et mon alliance avec la nuit
  rationale: La répétition de « mon alliance » et le parallélisme entre le jour et la nuit sont conservés.
- source_word: וּלְבִלְתִּי הֱיוֹת
  choice: de sorte que… ne soient plus là
  rationale: Cette tournure exprime la conséquence et reste proche du verbe « être », sans introduire explicitement une idée de mouvement absente de l’hébreu.
- source_word: יוֹמָם וָלַיְלָה
  choice: le jour et la nuit
  rationale: Le couple désigne ici la succession régulière du jour et de la nuit plutôt qu’une simple durée adverbiale.
- source_word: בְּעִתָּם
  choice: au moment qui leur est fixé
  rationale: עֵת désigne le temps déterminé ou approprié; cette traduction souligne l’ordre régulier établi pour le jour et la nuit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre et sa portée d’alliance sans le remplacer par un titre.
- issue: Valeur de la condition אִם תָּפֵרוּ
  choice: Si vous pouvez rompre
  alternative: Si vous rompez
  rationale: Le contexte présente une condition impossible afin d’affirmer la certitude de la promesse divine. « Pouvez » rend cette force rhétorique, tandis que la note signale la traduction formellement plus directe.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule parce que la proposition conditionnelle se poursuit au verset suivant. La répétition rhétorique de « mon alliance » est maintenue.
