  rationale: La révision remplace « ne soient plus là » par « ne se produisent pas », afin de supprimer l’idée non exprimée de cessation tout en gardant la conséquence envisagée par la condition et le caractère régulier du couple « jour et nuit ». La phrase demeure volontairement inachevée, puisque sa suite se trouve au verset suivant.
