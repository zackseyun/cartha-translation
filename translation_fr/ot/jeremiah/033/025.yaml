source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם לֹ֥א בְרִיתִ֖/י יוֹמָ֣ם וָ/לָ֑יְלָה חֻקּ֛וֹת שָׁמַ֥יִם וָ/אָ֖רֶץ לֹא שָֽׂמְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/025.yaml
  text: 'Thus says Yahweh: If I have not established my covenant with day and night[a], the fixed order of heaven and earth—'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Si je n’ai pas établi mon alliance avec le jour et la nuit, ni fixé les lois du ciel et de la terre[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les prescriptions du ciel et de la terre » ; le mot hébreu peut désigner des lois, des prescriptions ou un ordre fixé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique traditionnelle, naturelle et digne en français. Le nom divin est transcrit « Yahweh ».
- source_word: אִם לֹא
  choice: Si je n’ai pas… si je n’ai pas
  rationale: La reprise de « si je n’ai pas » rend explicite la portée conditionnelle de אִם לֹא sur les deux propositions coordonnées et préserve la phrase laissée en suspens jusqu’au verset suivant.
- source_word: בְרִיתִי יוֹמָם וָלָיְלָה
  choice: mon alliance avec le jour et la nuit
  rationale: « Alliance » conserve le vocabulaire théologique de בְּרִית et son écho dans le contexte; « avec » exprime naturellement en français le rapport au jour et à la nuit.
- source_word: חֻקּוֹת שָׁמַיִם וָאָרֶץ
  choice: les lois du ciel et de la terre
  rationale: חֻקּוֹת désigne ici les règles fixées qui gouvernent l’ordre créé. « Lois » reste proche de l’image juridique de l’hébreu tout en étant intelligible dans un contexte cosmologique.
- source_word: לֹא שָׂמַתִּי
  choice: si je n’ai pas fixé
  rationale: שׂים signifie littéralement mettre ou placer; avec חֻקּוֹת, « fixer les lois » rend clairement l’établissement durable de l’ordre cosmique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom propre plutôt que de le remplacer par un titre.
- issue: Rapport entre l’alliance avec le jour et la nuit et les lois cosmiques
  choice: Deux propositions conditionnelles étroitement parallèles
  alternative: Une seule expression où « les lois du ciel et de la terre » explique directement « mon alliance »
  rationale: La syntaxe hébraïque permet une certaine ambiguïté. La répétition française de « si je n’ai pas » fait ressortir le parallélisme probable sans effacer la proximité conceptuelle entre l’alliance et l’ordre cosmique.
translation_notes:
  register: Français international moderne, au registre prophétique digne. Le tiret final signale que la condition se poursuit au verset 26. La formulation conserve « alliance » et l’imagerie juridique de l’ordre créé.
