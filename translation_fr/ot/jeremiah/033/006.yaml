id: JER.33.6
reference: Jeremiah 33:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִ֧י מַעֲלֶה לָּ֛/הּ אֲרֻכָ֥ה וּ/מַרְפֵּ֖א וּ/רְפָאתִ֑י/ם וְ/גִלֵּיתִ֣י לָ/הֶ֔ם עֲתֶ֥רֶת שָׁל֖וֹם וֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/006.yaml
  text: Behold[a], I am bringing her healing and cure, and I will heal them, and I will reveal to them an abundance of peace and truth.
translation:
  language: fr
  text: Voici, je lui apporterai guérison et remède ; je les guérirai et je leur révélerai une abondance de paix et de vérité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidélité ». Le terme hébreu peut exprimer la vérité, la fiabilité ou la fidélité.
    reason: Alternative lexicale préservant l’étendue sémantique de אֱמֶת.
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Cette formule déictique introduit solennellement une annonce divine. « Voici » conserve la force prophétique dans un français digne et naturel.
- source_word: מַעֲלֶה
  choice: je vais apporter
  rationale: Le participe hiphil exprime ici une action divine imminente qui fait advenir la guérison. « Je vais apporter » en rend naturellement la valeur active et prochaine.
- source_word: לָּהּ
  choice: lui
  rationale: Le pronom féminin singulier renvoie à la ville, envisagée comme une personne. Le français emploie naturellement le pronom indirect « lui » avec « apporter ».
- source_word: אֲרֻכָה
  choice: guérison
  rationale: Le nom évoque la cicatrisation d’une blessure ou le rétablissement. « Guérison » maintient clairement l’image médicale.
- source_word: מַרְפֵּא
  choice: remède
  rationale: Associé à אֲרֻכָה, ce terme peut désigner la guérison, la santé ou ce qui guérit. « Remède » distingue les deux termes voisins sans répétition artificielle.
- source_word: וּרְפָאתִים
  choice: je les guérirai
  rationale: Le parfait prophétique décrit l’action promise comme future. Le suffixe masculin pluriel est conservé afin de rendre le passage de la ville personnifiée à ses habitants.
- source_word: וְגִלֵּיתִי
  choice: je révélerai
  rationale: Le verbe signifie dévoiler ou faire connaître. « Révéler » convient naturellement à l’objet abstrait qui suit.
- source_word: עֲתֶרֶת
  choice: une abondance de
  rationale: Le nom exprime la profusion ou la plénitude. « Une abondance de » est clair et évite de le confondre avec un autre nom hébreu pouvant signifier « couronne ».
- source_word: שָׁלוֹם
  choice: paix
  rationale: Le terme recouvre aussi le bien-être et l’intégrité, mais « paix » convient à cette promesse prophétique et à son association avec אֱמֶת.
- source_word: וֶאֱמֶת
  choice: vérité
  rationale: Le terme peut désigner la vérité, la fiabilité ou la fidélité. « Vérité » est retenu dans le texte, tandis que « fidélité » est signalé comme autre nuance possible.
theological_decisions:
- issue: Passage du féminin singulier au pluriel
  choice: Le pronom « lui » renvoie à la ville personnifiée, puis « les » et « leur » à ses habitants.
  alternative: Uniformiser les pronoms pour faire renvoyer toute la phrase à la seule ville.
  rationale: L’hébreu passe délibérément du féminin singulier au masculin pluriel. Conserver ce changement respecte la dynamique entre la cité personnifiée et le peuple qui l’habite.
- issue: Étendue sémantique de אֱמֶת
  choice: « vérité » dans le texte principal
  alternative: « fidélité » ou « fiabilité »
  rationale: Le contexte n’impose pas de réduire le terme à une seule de ses nuances. La note préserve une autre lecture légitime sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient le ton solennel de l’annonce prophétique ; la ponctuation rend lisible la progression de la promesse sans effacer les reprises du texte hébreu.
