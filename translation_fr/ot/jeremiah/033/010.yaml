base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/010.yaml
  text: 'Thus says the LORD: Yet in this place, of which you say, ‘It is a waste, without man or beast,’ in the cities of Judah and in the streets of Jerusalem that are desolate, without man or inhabitant or beast, there shall again be heard'
translation:
  language: fr
  text: 'Ainsi parle le SEIGNEUR : Dans ce lieu dont vous dites : « Il est dévasté, sans êtres humains ni bétail », dans les villes de Juda et dans les rues de Jérusalem, désolées, sans êtres humains, sans habitants et sans bétail, on entendra de nouveau'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, en petites capitales dans la mise en forme éditoriale.
- source_word: עוֹד יִשָּׁמַע
  choice: on entendra de nouveau
  rationale: Reproduit la tournure passive impersonnelle et garde la phrase ouverte sur son complément au verset suivant.
- source_word: חָרֵב
  choice: dévasté
  rationale: Exprime l’état de ruine et d’abandon du lieu, plutôt qu’un simple espace vide.
- source_word: אָדָם
  choice: êtres humains
  rationale: Ici, le nom collectif désigne l’humanité ou la présence humaine, en contraste avec le bétail.
- source_word: בְּהֵמָה
  choice: bétail
  rationale: Désigne les animaux domestiques ou les bestiaux dans cette description de dépeuplement.
- source_word: חֻצוֹת
  choice: rues
  rationale: Dans le cadre urbain de Jérusalem, le terme désigne naturellement les espaces extérieurs et les rues.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit une convention biblique française familière sans introduire une vocalisation discutée dans le corps du texte.
- issue: Portée de la promesse finale
  choice: 'Maintenir la proposition inachevée : « on entendra de nouveau »'
  alternative: Ajouter par anticipation ce qui sera entendu
  rationale: Le texte hébreu du verset 10 s’achève ainsi et reçoit son complément au verset 11; il convient de ne pas l’importer ici.
translation_notes:
  register: Français moderne, courant et digne. La répétition de « sans » et la longue structure syntaxique sont conservées parce qu’elles portent l’insistance rhétorique de l’hébreu. Aucun marqueur de note n’est requis.
