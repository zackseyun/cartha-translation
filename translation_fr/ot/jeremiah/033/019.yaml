source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/019.yaml
  text: And the word of Yahweh came to Jeremiah, saying,
translation:
  language: fr
  text: 'La parole de Yahweh fut adressée à Jérémie en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule narrative, le waw consécutif avec היה introduit la venue de la parole. En français, « la parole fut adressée » exprime naturellement l’événement sans recourir au calque lourd « et il arriva ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « parole » conserve le caractère établi et révélatoire de l’expression, mieux que le terme plus interprétatif « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente directement le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de la parole divine; « à » est son équivalent français naturel dans la tournure « adresser une parole à quelqu’un ».
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: « Jérémie » est la forme française établie de ce nom propre.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif introduit le discours direct qui suit. « En ces termes » est une formule française actuelle et digne qui remplit cette fonction sans le calque peu naturel « disant ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le Tétragramme. « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la formule prophétique traditionnelle « la parole de Yahweh » tout en rendant idiomatiquement la construction hébraïque. Le deux-points annonce le discours du verset suivant.
