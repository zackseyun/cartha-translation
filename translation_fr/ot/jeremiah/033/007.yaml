review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : le hiphil de שוב avec שְׁבוּת exprime une restauration, et « je les rebâtirai comme autrefois » correspond à וּבְנִתִים כָּרִאשֹׁנָה. Toutefois, « la situation » est trop vague pour l’idiome hébreu, qui vise le sort, la condition ou la prospérité restaurée d’un peuple.'
  naturalness: « Rétablir le sort de » est une formulation française claire, naturelle dans le registre prophétique et plus précise que « rétablir la situation de ». « Comme autrefois » convient bien au français moderne.
  terminology: Juda et Israël sont correctement nommés. La note actuelle qualifie de « plus littérales » deux formulations qui sont plutôt des interprétations du sens de l’idiome. La note révisée distingue la formulation littérale de ses sens possibles, sans trancher indûment l’ambiguïté.
