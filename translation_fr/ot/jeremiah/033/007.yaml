  text: וַ/הֲשִֽׁבֹתִי֙ אֶת שְׁב֣וּת יְהוּדָ֔ה וְ/אֵ֖ת שְׁב֣וּת יִשְׂרָאֵ֑ל וּ/בְנִתִ֖י/ם כְּ/בָ/רִֽאשֹׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/007.yaml
  text: And I will restore the fortunes of Judah and the fortunes of Israel[a], and I will rebuild them as at the first.
translation:
  language: fr
  text: Je rétablirai le sort de Juda et celui d’Israël[a], et je les rebâtirai comme autrefois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « je ferai revenir la captivité de Juda et la captivité d’Israël » ; l’expression peut aussi signifier « rétablir le sort » ou « ramener les captifs ».
    reason: Alternative lexicale reflétant l’ambiguïté de l’expression hébraïque שְׁבוּת et son arrière-plan d’exil.
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי
  choice: Je rétablirai
  rationale: 'Le hiphil de שוב a ici une valeur causative : faire revenir, ramener ou restaurer. Avec שְׁבוּת, « rétablirai » exprime naturellement le renversement de la détresse et de l’exil.'
- source_word: שְׁבוּת
  choice: la situation
  rationale: Dans l’expression idiomatique הֵשִׁיב שְׁבוּת, le mot peut désigner plus largement la condition ou le sort d’un peuple, sans se limiter à la captivité. « Rétablir la situation » rend cette restauration globale en français naturel, tandis que les sens liés aux captifs et à l’exil sont conservés en note.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française usuelle du nom du royaume et du peuple.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom national, ici associé à Juda pour embrasser l’ensemble du peuple.
- source_word: וּבְנִתִים
  choice: et je les rebâtirai
  rationale: בנה signifie bâtir et, dans ce contexte de restauration après la dévastation, « rebâtir » exprime clairement le rétablissement. Le suffixe masculin pluriel renvoie collectivement à Juda et à Israël.
- source_word: כְּבָרִאשֹׁנָה
  choice: comme autrefois
  rationale: L’expression compare la restauration promise à l’état antérieur. « Comme autrefois » est actuel, digne et fidèle à cette valeur comparative.
theological_decisions:
- issue: Portée de שְׁבוּת dans l’oracle de restauration
  choice: rétablir la situation
  alternative: ramener les captifs / mettre fin à la captivité
  rationale: L’expression peut évoquer le retour d’exil tout en désignant une restauration nationale plus complète. Le texte principal préserve cette ampleur, et la note maintient explicitement les lectures plus concrètes liées à la captivité.
translation_notes:
  register: Français international moderne, clair et digne. « La situation » évite l’expression moins naturelle « restaurer le sort » tout en gardant la portée globale de la promesse; la note préserve les possibilités plus littérales.
