    issue: « la situation » affaiblit l’idiome de restauration
    rationale: Le terme français est générique et peut désigner n’importe quel état de choses. « Le sort » conserve mieux la portée collective de שְׁבוּת, y compris la restauration de la condition et de la prospérité, sans réduire le texte au seul retour d’exil.
  - severity: medium
    issue: La note présente des interprétations comme des rendus « plus littéraux »
    rationale: « Ramener les captifs » et « mettre fin à la captivité » explicitent des lectures possibles de l’idiome, mais ne sont pas, sous cette forme, une traduction strictement littérale de l’expression hébraïque. Il convient de signaler l’ambiguïté de manière exacte.
  revised_text: Je rétablirai le sort de Juda et celui d’Israël[a], et je les rebâtirai comme autrefois.
