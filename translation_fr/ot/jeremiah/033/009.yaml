  text: וְ/הָ֣יְתָה לִּ֗/י לְ/שֵׁ֤ם שָׂשׂוֹן֙ לִ/תְהִלָּ֣ה וּ/לְ/תִפְאֶ֔רֶת לְ/כֹ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ אֲשֶׁ֨ר יִשְׁמְע֜וּ אֶת כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֤ר אָֽנֹכִי֙ עֹשֶׂ֣ה אֹתָ֔/ם וּ/פָחֲד֣וּ וְ/רָֽגְז֗וּ עַ֤ל כָּל הַ/טּוֹבָה֙ וְ/עַ֣ל כָּל הַ/שָּׁל֔וֹם אֲשֶׁ֥ר אָֽנֹכִ֖י עֹ֥שֶׂה לָּֽ/הּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/009.yaml
  text: And she will be to me a name of joy[a], a praise and a glory before all the nations of the earth, who will hear of all the good that I am doing for them. And they will fear and tremble because of all the good and because of all the peace that I am bringing to her.
translation:
  language: fr
  text: Elle sera pour moi un sujet de joie, de louange et de gloire aux yeux de toutes les nations de la terre. Elles entendront parler de tout le bien que je fais pour eux. Elles seront saisies de crainte et trembleront à cause de tout le bien et de toute la paix[a] que je lui accorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la prospérité » ou « tout le bien-être » ; le mot hébreu shalom désigne la paix, le bien-être et la plénitude.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְהָיְתָה לִּי
  choice: Elle sera pour moi
  rationale: Le verbe est au féminin singulier, et le pronom final לָּהּ confirme un référent féminin, très probablement la ville de Jérusalem. « Elle » conserve cette personnification.
- source_word: לְשֵׁם שָׂשׂוֹן לִתְהִלָּה וּלְתִפְאֶרֶת
  choice: un sujet de joie, de louange et de gloire
  rationale: שֵׁם peut évoquer le nom ou la renommée. La tournure française « un sujet de » exprime naturellement que la ville restaurée fera connaître la joie, la louange et la gloire de Dieu, sans alourdir le texte par un calque peu idiomatique.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: devant toutes les nations de la terre
  rationale: 'La préposition לְ marque ici la relation ou l''exposition publique : la restauration sera connue aux yeux de toutes les nations.'
- source_word: אֲשֶׁר יִשְׁמְעוּ
  choice: Elles entendront parler de
  rationale: « Entendre parler de » est l'expression française naturelle pour apprendre la nouvelle des bienfaits accomplis par Dieu.
- source_word: אֶת כָּל הַטּוֹבָה אֲשֶׁר אָנֹכִי עֹשֶׂה אֹתָם
  choice: tout le bien que je fais pour eux
  rationale: Le masculin « eux » distingue les bénéficiaires évoqués dans le contexte des nations, nom féminin en français, tout en conservant le pronom pluriel hébreu plutôt que d'expliciter davantage son référent.
- source_word: וּפָחֲדוּ וְרָגְזוּ
  choice: Elles seront saisies de crainte et trembleront
  rationale: פחד exprime la crainte et רגז le tremblement ou l'agitation. Cette formulation garde l'intensité de la réaction sans décider s'il s'agit uniquement de terreur ou d'une crainte mêlée d'émerveillement.
- source_word: עַל כָּל הַטּוֹבָה וְעַל כָּל הַשָּׁלוֹם
  choice: à cause de tout le bien et de toute la paix
  rationale: עַל a ici une valeur causale. « Paix » rend directement שָׁלוֹם, dont la portée plus large est signalée en note.
- source_word: אֲשֶׁר אָנֹכִי עֹשֶׂה לָּהּ
  choice: que je lui accorde
  rationale: Littéralement, Dieu « fait » cette paix pour elle. Avec « paix » comme complément, « accorder » donne en français le sens naturel tout en gardant Dieu comme auteur du bienfait.
theological_decisions:
- issue: Nature de la réaction des nations devant la restauration divine
  choice: une crainte intense accompagnée de tremblement
  alternative: la terreur hostile, ou seulement l'émerveillement révérenciel
  rationale: Les deux verbes hébreux permettent une réaction de peur, de bouleversement ou de crainte révérencielle. Puisque celle-ci est provoquée par le bien et la paix accordés par Dieu, la traduction conserve cette tension sans la réduire à une seule nuance.
- issue: Référent du pronom masculin pluriel אֹתָם
  choice: conserver le pronom « eux »
  alternative: expliciter « les habitants de la ville » ou rattacher le pronom aux nations
  rationale: Le contexte antérieur fournit un groupe humain masculin pluriel, tandis que la ville est personnifiée au féminin. Le maintien du pronom respecte la cohésion du texte et évite d'introduire une précision absente de l'hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification féminine de Jérusalem est maintenue. Les répétitions « tout le bien » et « toute la paix » conservent l'insistance rhétorique de l'hébreu.
