    rationale: Le syntagme hébreu לְכָל גּוֹיֵי הָאָרֶץ situe la renommée/restauration par rapport à toutes les nations. En français, « aux yeux de toutes les nations » rend naturellement cette dimension de reconnaissance publique; « devant » peut suggérer une scène spatiale ou une comparution.
