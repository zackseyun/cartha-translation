source:
  edition: WLC
  text: בָּאִ֗ים לְ/הִלָּחֵם֙ אֶת הַ/כַּשְׂדִּ֔ים וּ/לְ/מַלְאָ/ם֙ אֶת פִּגְרֵ֣י הָ/אָדָ֔ם אֲשֶׁר הִכֵּ֥יתִי בְ/אַפִּ֖/י וּ/בַ/חֲמָתִ֑/י וַ/אֲשֶׁ֨ר הִסְתַּ֤רְתִּי פָנַ/י֙ מֵ/הָ/עִ֣יר הַ/זֹּ֔את עַ֖ל כָּל רָעָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/005.yaml
  text: They are coming to fight against the Chaldeans but only to fill them with the corpses of the men whom I struck down in my anger and in my wrath[c][b][a], and from this city I have hidden my face because of all their evil.
translation:
  language: fr
  text: Ils viennent combattre les Chaldéens[a] et remplir ces lieux[b] des cadavres de personnes que j’ai frappées dans ma colère et ma fureur. J’ai détourné mon visage de cette ville à cause de toute leur méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Babyloniens ». L’hébreu dit « les Chaldéens ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les remplir ». Le pronom renvoie probablement aux maisons ou aux ouvrages défensifs mentionnés au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: בָּאִים
  choice: Ils viennent
  rationale: Le participe qal masculin pluriel exprime ici une action en cours ou imminente. Le présent français convient naturellement au contexte.
- source_word: לְהִלָּחֵם אֶת הַכַּשְׂדִּים
  choice: combattre les Chaldéens
  rationale: L’infinitif de לחם avec אֶת désigne un affrontement hostile dirigé contre les Chaldéens; « combattre » rend ce sens sans lourdeur.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le texte emploie l’ethnonyme précis. « Babyloniens » est explicatif et figure donc en note.
- source_word: וּלְמַלְאָם
  choice: mais ce ne sera que pour remplir ces lieux
  rationale: Le suffixe masculin pluriel signifie littéralement « les remplir » et renvoie probablement aux maisons ou ouvrages défensifs du verset précédent. La tournure française exprime la valeur résultative sinistre du contexte sans faire des Chaldéens l’antécédent du pronom.
- source_word: פִּגְרֵי הָאָדָם
  choice: de cadavres humains
  rationale: פגר désigne crûment des cadavres, tandis que אָדָם est ici collectif. « Cadavres humains » préserve à la fois la force du terme et l’étendue non spécifiquement masculine de l’expression.
- source_word: אֲשֶׁר הִכֵּיתִי
  choice: ceux que j’ai frappés
  rationale: נכה signifie « frapper » et implique ici la mort, déjà rendue explicite par « cadavres ». Le verbe conserve l’image du texte sans redondance.
- source_word: בְאַפִּי וּבַחֲמָתִי
  choice: dans ma colère et ma fureur
  rationale: Les deux termes de jugement, proches mais distincts, sont conservés afin de rendre l’intensification hébraïque.
- source_word: וַאֲשֶׁר הִסְתַּרְתִּי פָנַי מֵהָעִיר הַזֹּאת
  choice: J’ai détourné mon visage de cette ville
  rationale: Cette formulation conserve l’idiome anthropomorphique biblique du retrait de la faveur divine. « Détourné » est plus naturel en français que « caché mon visage » dans cette construction.
- source_word: עַל כָּל רָעָתָם
  choice: à cause de tout le mal qu’ils ont fait
  rationale: עַל a ici une valeur causale. L’explicitation verbale rend clairement le suffixe pluriel de רָעָתָם et produit un français courant.
theological_decisions:
- issue: Jugement divin et langage anthropomorphique
  choice: 'Conserver la parole divine directe: « j’ai frappés dans ma colère et ma fureur » et « J’ai détourné mon visage ».'
  alternative: Atténuer le passage en parlant impersonnellement d’une catastrophe ou paraphraser entièrement l’image du visage détourné.
  rationale: Le texte attribue explicitement le jugement à Dieu et emploie une image biblique importante pour le retrait de sa faveur. La traduction ne doit ni adoucir ni expliquer à outrance cette tension.
- issue: Portée de אָדָם
  choice: cadavres humains
  alternative: cadavres des hommes
  rationale: אָדָם peut désigner collectivement les êtres humains. Le contexte parle des morts de la ville sans exiger que l’expression soit limitée aux hommes de sexe masculin; la formulation retenue préserve cette portée.
- issue: Relation entre les deux infinitifs
  choice: « mais ce ne sera que pour » comme valeur résultative contextuelle
  alternative: « et pour remplir » selon la coordination formelle
  rationale: La conjonction hébraïque coordonne formellement les infinitifs, mais le contexte présente le remplissage de cadavres comme l’issue funeste de la tentative de combat. La traduction principale rend cette force; la note signale le sens littéral du suffixe sans supprimer l’ambiguïté de son antécédent.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme demeure solennel sans archaïsmes. La dureté des images de guerre et du jugement divin est conservée; les ambiguïtés lexicales importantes sont signalées en notes.
