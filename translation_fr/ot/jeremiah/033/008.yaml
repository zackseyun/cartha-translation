revisions:
- from: Je les purifierai de toute la culpabilité dont ils se sont chargés en péchant contre moi[a], et je pardonnerai toutes les fautes qu’ils ont commises contre moi et par lesquelles ils se sont révoltés contre moi[b].
  to: Je les purifierai de toute leur faute commise contre moi[a], et je pardonnerai toutes les fautes qu’ils ont commises contre moi et par lesquelles ils se sont révoltés contre moi[b].
  rationale: La révision remplace une paraphrase interprétative par une formulation qui rattache explicitement leur faute à leur péché contre Dieu. Elle conserve la distinction lexicale générale du verset, le registre moderne international et les deux ancrages de note. La note a préserve l’ambiguïté sémantique de עָוֹן sans imposer le sens de « culpabilité » dans le corps du texte.
