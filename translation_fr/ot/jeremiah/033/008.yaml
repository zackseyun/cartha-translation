source:
  edition: WLC
  text: וְ/טִ֣הַרְתִּ֔י/ם מִ/כָּל עֲוֺנָ֖/ם אֲשֶׁ֣ר חָֽטְאוּ לִ֑/י וְ/סָלַחְתִּ֗י ל/כול עֲוֺנֽוֹתֵי/הֶם֙ אֲשֶׁ֣ר חָֽטְאוּ לִ֔/י וַ/אֲשֶׁ֖ר פָּ֥שְׁעוּ בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/008.yaml
  text: And I will cleanse them from all their guilt by which they have sinned against me[b][a], and I will forgive all their guilty deeds by which they have sinned against me and by which they have rebelled against me.
translation:
  language: fr
  text: Je les purifierai de toute leur faute commise contre moi[a], et je pardonnerai toutes les fautes qu’ils ont commises contre moi et par lesquelles ils se sont révoltés contre moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute leur culpabilité ». Le mot hébreu peut désigner aussi bien la faute que la culpabilité qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la fin de la phrase répète deux propositions relatives : « dont ils ont péché contre moi et dont ils se sont révoltés contre moi ».'
    reason: source_structure
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Je les purifierai
  rationale: Le piel de טהר exprime l’action de purifier ou de rendre pur. « Purifier » convient à la restauration morale et cultuelle évoquée, tout en restant naturel en français moderne.
- source_word: מִכָּל עֲוֺנָם
  choice: de toute la culpabilité dont ils se sont chargés
  rationale: עָוֹן peut désigner à la fois la faute et la culpabilité qui en découle. Cette formulation française rend le singulier collectif et explicite naturellement le lien avec leurs péchés sans réduire le terme à la seule faute commise.
- source_word: אֲשֶׁר חָטְאוּ לִי
  choice: en péchant contre moi
  rationale: חטא avec ל indique ici un péché dirigé contre Dieu. La tournure participiale exprime en français idiomatique le rapport entre leur culpabilité et leurs actes.
- source_word: וְסָלַחְתִּי
  choice: et je pardonnerai
  rationale: סלח est le verbe usuel du pardon accordé par Dieu ; « pardonner » en est l’équivalent français direct et courant.
- source_word: לְכָל עֲוֺנוֹתֵיהֶם
  choice: toutes les fautes qu’ils ont commises
  rationale: Le pluriel עֲוֺנוֹת désigne ici leurs multiples actes coupables. « Fautes » reste accessible et maintient une distinction avec « pécher » et « se révolter ».
- source_word: וַאֲשֶׁר פָּשְׁעוּ בִי
  choice: et par lesquelles ils se sont révoltés contre moi
  rationale: פשע décrit une transgression prenant la forme d’une rébellion contre une autorité légitime. « Se révolter contre » préserve cette force relationnelle.
theological_decisions:
- issue: Différenciation des termes עון, חטא et פשע
  choice: Employer « culpabilité », « pécher », « fautes » et « se révolter » selon le contexte.
  alternative: Traduire uniformément ces termes par le vocabulaire du « péché » ou rendre עון partout par « iniquité ».
  rationale: 'L’hébreu superpose des notions apparentées mais distinctes : faute et culpabilité, acte de pécher, puis rébellion. La traduction en conserve la texture sans imposer de système doctrinal.'
- issue: Portée sémantique de עָוֹן dans la première proposition
  choice: Retenir « culpabilité » tout en signalant « faute » en note.
  alternative: Retenir uniquement « faute » ou « iniquité ».
  rationale: Après טהר, le sens de culpabilité souillant la communauté est particulièrement pertinent, mais le terme hébreu demeure ambigu et peut aussi désigner la faute elle-même.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite « iniquité », devenu peu courant, tout en conservant la distinction entre culpabilité, faute, péché et rébellion. Les deux marqueurs de note figurent dans le texte.
