  text: גַּם בְּרִיתִ֤/י תֻפַר֙ אֶת דָּוִ֣ד עַבְדִּ֔/י מִ/הְיֽוֹת ל֥/וֹ בֵ֖ן מֹלֵ֣ךְ עַל כִּסְא֑/וֹ וְ/אֶת הַ/לְוִיִּ֥ם הַ/כֹּהֲנִ֖ים מְשָׁרְתָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/021.yaml
  text: then my covenant with David my servant may also be broken[a], so that he would not have a son reigning on his throne, and with the Levitical priests, my ministers.
translation:
  language: fr
  text: alors mon alliance avec David, mon serviteur, pourra, elle aussi, être rompue, de sorte qu’il n’ait aucun fils régnant sur son trône ; il en ira de même de mon alliance avec les prêtres lévites[a], qui sont à mon service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les Lévites, les prêtres ». L’hébreu juxtapose les deux noms et peut se comprendre comme une apposition.'
    reason: La note préserve l’ordre et la construction appositionnelle possibles du texte hébreu, tandis que « prêtres lévites » fournit une expression française idiomatique.
lexical_decisions:
- source_word: גַּם
  choice: elle aussi
  rationale: 'Dans l’apodose liée au verset précédent, גַּם marque la correspondance additive : l’alliance pourrait, elle aussi, être rompue. Cette tournure est naturelle en français.'
- source_word: בְּרִיתִי תֻפַר אֶת דָּוִד עַבְדִּי
  choice: mon alliance avec David, mon serviteur, pourra […] être rompue
  rationale: « Alliance » conserve la portée juridique et théologique de בְּרִית ; le hophal תֻפַר est rendu au passif, et אֶת après « alliance » exprime ici la relation avec David.
- source_word: מִהְיוֹת לוֹ בֵן מֹלֵךְ
  choice: au point qu’il n’ait plus de fils régnant
  rationale: מִן suivi de l’infinitif exprime ici la conséquence de la rupture envisagée. « Fils » conserve le langage dynastique concret du texte, tandis que « régnant » rend le participe מֹלֵךְ.
- source_word: עַל כִּסְאוֹ
  choice: sur son trône
  rationale: Expression française normale correspondant à l’image hébraïque de l’exercice de la royauté.
- source_word: וְאֶת הַלְוִיִּם הַכֹּהֲנִים
  choice: il en ira de même de mon alliance avec les prêtres lévites
  rationale: Le verbe et « mon alliance » sont explicités par ellipse afin que la coordination hébraïque soit claire en français. « Prêtres lévites » exprime naturellement l’identification du groupe sacerdotal, tandis qu’une note préserve la construction appositionnelle possible.
- source_word: מְשָׁרְתָי
  choice: qui sont à mon service
  rationale: Cette formulation rend le service cultuel exprimé par le participe de שׁרת sans donner à « ministres » un sens institutionnel moderne étranger au contexte.
theological_decisions:
- issue: Promesse dynastique faite à David
  choice: « fils régnant sur son trône »
  alternative: « descendant régnant sur son trône » ou « héritier sur son trône »
  rationale: Le texte emploie concrètement « fils ». Le conserver maintient le lien verbal avec la promesse davidique sans imposer au verset une interprétation messianique ultérieure.
- issue: Identification du groupe sacerdotal
  choice: « les prêtres lévites » dans le texte principal
  alternative: « les lévites, les prêtres »
  rationale: L’hébreu permet une lecture appositionnelle. La formulation principale est claire et idiomatique en français, tandis que la note conserve la forme plus littérale et l’ambiguïté syntaxique.
- issue: Portée de la coordination finale
  choice: expliciter « il en ira de même de mon alliance »
  alternative: coordonner directement « et avec les prêtres lévites »
  rationale: Le texte hébreu sous-entend la reprise de la rupture de l’alliance. L’explicitation évite en français de rattacher à tort les prêtres au fils ou au trône, sans modifier la portée de l’énoncé.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure conditionnelle héritée du contexte est signalée par « alors ». La reprise elliptique de l’alliance dans le dernier membre est explicitée pour la clarté, sans résoudre au-delà du texte l’identité exacte du groupe sacerdotal.
