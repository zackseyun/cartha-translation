    rationale: מִהְיוֹת לוֹ בֵּן מֹלֵךְ signifie littéralement qu’il n’y aurait pas pour lui « un fils régnant ». Dans ce contexte hypothétique, « plus » peut suggérer la perte d’une situation antérieure non explicitée. « Aucun fils régnant » rend naturellement la négation française sans cette addition.
  - severity: low
