  rationale: La révision retire l’implication temporelle non exprimée par « plus », clarifie la négation de l’héritier royal et corrige la note afin qu’elle reflète fidèlement l’ordre des mots hébreux. Elle conserve l’explicitation française de la seconde relation d’alliance, nécessaire pour éviter un rattachement syntaxique erroné des prêtres au membre précédent.
