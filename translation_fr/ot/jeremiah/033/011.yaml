source:
  edition: WLC
  text: ק֣וֹל שָׂשׂ֞וֹן וְ/ק֣וֹל שִׂמְחָ֗ה ק֣וֹל חָתָן֮ וְ/ק֣וֹל כַּלָּה֒ ק֣וֹל אֹמְרִ֡ים הוֹדוּ֩ אֶת יְהוָ֨ה צְבָא֜וֹת כִּֽי ט֤וֹב יְהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ מְבִאִ֥ים תּוֹדָ֖ה בֵּ֣ית יְהוָ֑ה כִּֽי אָשִׁ֧יב אֶת שְׁבוּת הָ/אָ֛רֶץ כְּ/בָ/רִאשֹׁנָ֖ה אָמַ֥ר יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/011.yaml
  text: the sound of joy and the sound of gladness[a], the sound of the bridegroom and the sound of the bride, the sound of those saying, ‘Give thanks to Yahweh of hosts, for Yahweh is good, for his steadfast love endures forever,’ and of those bringing a thank offering into the house of Yahweh. For I will restore the fortunes of the land as at first[b], says Yahweh.
translation:
  language: fr
  text: 'le son de la joie et le son de l’allégresse, la voix du marié et la voix de la mariée, la voix de ceux qui disent : « Rendez grâce à Yahweh des armées, car Yahweh est bon, car son amour fidèle dure pour toujours[a] », et de ceux qui apportent une offrande de reconnaissance à la maison de Yahweh. Car je rétablirai la situation du pays comme autrefois[b], dit Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « sa bonté dure pour toujours », « sa miséricorde dure pour toujours » ou « sa fidélité à l’alliance dure pour toujours ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je ramènerai les captifs du pays ». L’expression hébraïque peut évoquer le retour des captifs ou, plus largement, le rétablissement de la situation du pays.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: les cris de / la voix de
  rationale: Le mot peut désigner une voix ou un son. « Cris » convient aux manifestations de joie, tandis que « voix » convient aux personnes qui parlent et au couple de mariés; la répétition conserve le rythme du texte hébreu.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: joie et allégresse
  rationale: Ce binôme français naturel maintient deux termes distincts et le registre festif du texte.
- source_word: חָתָן וְכַלָּה
  choice: le marié et la mariée
  rationale: Équivalents modernes et courants qui préservent la formule nuptiale.
- source_word: הוֹדוּ
  choice: Rendez grâce
  rationale: Dans cette formule liturgique, le verbe exprime l’action de remercier et de louer Dieu; « rendre grâce » convient aussi au lien avec l’offrande de reconnaissance mentionnée ensuite.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Cette formulation conserve le nom divin et rend directement le titre צְבָאוֹת sans le remplacer par une interprétation telle que « Tout-Puissant ».
- source_word: לְעוֹלָם חַסְדּוֹ
  choice: son amour fidèle dure pour toujours
  rationale: חֶסֶד associe amour, bonté et fidélité relationnelle. « Amour fidèle » en exprime les dimensions principales sans réduire le terme à une seule nuance.
- source_word: תּוֹדָה
  choice: une offrande de reconnaissance
  rationale: Puisque cette תּוֹדָה est apportée à la maison de Yahweh, le sens cultuel d’offrande ou de sacrifice de reconnaissance est le plus probable.
- source_word: אָשִׁיב אֶת שְׁבוּת הָאָרֶץ
  choice: je rétablirai la situation du pays
  rationale: La formule hébraïque peut viser le retour des captifs ou, plus largement, le rétablissement du pays. La traduction choisie garde cette portée générale dans un français naturel.
- source_word: כְּבָרִאשֹׁנָה
  choice: comme autrefois
  rationale: Cette expression rend succinctement l’idée d’un retour à l’état antérieur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de la formule de restauration שְׁבוּת
  choice: rétablir la situation du pays
  alternative: ramener les captifs du pays; mettre fin à la captivité du pays
  rationale: Le contexte décrit une restauration globale — vie sociale, mariages, culte et actions de grâce. La formulation générale ne nie pas le retour des captifs, mais évite de limiter à celui-ci une expression hébraïque susceptible d’avoir un sens plus large.
- issue: Nuance de חֶסֶד
  choice: amour fidèle
  alternative: bonté; miséricorde; fidélité à l’alliance
  rationale: Le terme réunit plusieurs nuances qui ne trouvent pas d’équivalent français unique. Le texte principal retient une expression large, et la note signale les principales possibilités.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « la voix » maintient la cadence prophétique; « marié » et « mariée » sont préférés aux termes plus anciens « époux » et « épouse » dans cette scène de noces. Le verset commence sans majuscule afin de respecter sa continuité syntaxique probable avec le verset précédent.
