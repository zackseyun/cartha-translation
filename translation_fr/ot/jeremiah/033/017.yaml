  source_fidelity: 'Le sens dynastique de לֹא יִכָּרֵת לְדָוִד est bien rendu, ainsi que « maison d’Israël ». Toutefois, « David ne manquera jamais d’un homme » peut suggérer qu’un homme manque à David personnellement. La construction impersonnelle française rend plus nettement l’idiome hébreu : un homme ne fera jamais défaut à David pour occuper le trône.'
  naturalness: « Car ainsi parle Yahweh » est une formule prophétique française naturelle, sobre et proche de la formule hébraïque. « Il ne manquera jamais à David un homme pour siéger… » est clair, idiomatique et conserve le registre royal.
  terminology: « Yahweh », « trône » et « maison d’Israël » sont cohérents avec le texte source et le registre biblique. « Un homme » maintient le singulier masculin de אִישׁ sans introduire l’interprétation plus étroite de « descendant ».
