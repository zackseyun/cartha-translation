  text: כִּי כֹ֖ה אָמַ֣ר יְהוָ֑ה לֹֽא יִכָּרֵ֣ת לְ/דָוִ֔ד אִ֕ישׁ יֹשֵׁ֖ב עַל כִּסֵּ֥א בֵֽית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/017.yaml
  text: 'For thus says Yahweh: David shall never lack a man to sit on the throne of the house of Israel[a][b].'
translation:
  language: fr
  text: 'Car ainsi parle Yahweh : Il ne manquera jamais à David un homme pour siéger sur le trône de la maison d’Israël[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne sera pas retranché à David un homme siégeant sur le trône de la maison d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus simplement : « sur le trône d’Israël ». L’hébreu porte « la maison d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit cette déclaration divine comme le fondement ou l’explication de la promesse précédente.
- source_word: כֹה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Cette formulation rend naturellement en français moderne la formule prophétique du messager, tout en conservant le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom propre divin et sa portée d’alliance sans le remplacer par un titre.
- source_word: לֹא יִכָּרֵת לְדָוִד
  choice: David ne manquera jamais
  rationale: L’expression signifie littéralement qu’un homme ne sera pas « retranché pour David » ; dans cet idiome dynastique, elle affirme que David ne sera jamais privé d’un représentant royal.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier. « Descendant » expliciterait une implication du contexte au lieu de traduire directement le terme.
- source_word: יֹשֵׁב עַל כִּסֵּא
  choice: pour siéger sur le trône
  rationale: Le participe décrit la fonction royale exercée par cet homme ; la tournure infinitive est idiomatique après « ne manquera jamais d’un homme ».
- source_word: בֵית יִשְׂרָאֵל
  choice: de la maison d’Israël
  rationale: Le maintien de « maison » préserve l’expression nationale et communautaire exacte de l’hébreu.
theological_decisions:
- issue: La promesse dynastique faite à David
  choice: Le verset promet la permanence de la lignée royale davidique sans préciser ici son mode d’accomplissement historique ou messianique.
  alternative: Comprendre le texte soit comme une promesse limitée aux successions royales immédiates, soit exclusivement comme une prédiction du roi messianique final.
  rationale: La traduction conserve la formulation dynastique ouverte du texte hébreu et n’impose pas un mécanisme particulier d’accomplissement.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique est naturelle sans devenir familière ; le vocabulaire royal et l’expression « maison d’Israël » conservent la solennité et la précision du texte source.
