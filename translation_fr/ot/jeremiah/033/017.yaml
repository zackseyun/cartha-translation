  to: 'Car ainsi parle Yahweh : Il ne manquera jamais à David un homme pour siéger sur le trône de la maison d’Israël[a][b].'
  rationale: La révision remplace la construction personnelle potentiellement ambiguë par la tournure impersonnelle française « il ne manquera jamais à David », qui exprime explicitement qu’un homme appelé à régner ne fera pas défaut à David. « Ainsi parle » restitue avec concision la formule prophétique כֹה אָמַר. Aucun accomplissement historique ou messianique particulier n’est introduit.
