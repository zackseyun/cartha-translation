  text: בַּ/יָּמִ֤ים הָ/הֵם֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וִ/ירוּשָׁלִַ֖ם תִּשְׁכּ֣וֹן לָ/בֶ֑טַח וְ/זֶ֥ה אֲשֶׁר יִקְרָא לָ֖/הּ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/016.yaml
  text: 'In those days Judah will be saved[a], and Jerusalem will dwell securely[b]; and this is what she will be called: ‘Yahweh is our righteousness.’'
translation:
  language: fr
  text: 'En ces jours-là, Juda sera sauvé, et Jérusalem habitera en sécurité. Et voici comment on l’appellera[a] : « Yahweh est notre justice[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « voici le nom qu’on lui donnera ». Le pronom féminin hébreu renvoie à Jérusalem.'
    reason: lexical_alternative
  - marker: b
    text: Jérémie 23.6 applique cette même désignation au roi davidique à venir ; ici, la grammaire l’applique à Jérusalem, probablement en écho à cette promesse antérieure.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Formule temporelle prophétique naturelle en français, qui situe la promesse dans la période future annoncée.
- source_word: תִּוָּשַׁע
  choice: sera sauvé
  rationale: Le niphal de ישׁע exprime ici le fait d’être sauvé ou délivré. « Sera sauvé » conserve la voix passive et la portée théologique du secours divin.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française usuelle du nom du peuple et du royaume.
- source_word: וִירוּשָׁלִַם
  choice: et Jérusalem
  rationale: Forme française usuelle du nom de la ville, avec maintien de la coordination.
- source_word: תִּשְׁכּוֹן לָבֶטַח
  choice: habitera en sécurité
  rationale: שׁכן évoque une habitation stable, tandis que לבטח exprime la sécurité. La formulation est claire et naturelle en français moderne.
- source_word: וְזֶה אֲשֶׁר יִקְרָא לָהּ
  choice: Et voici comment on l’appellera
  rationale: La tournure hébraïque introduit une désignation. Le pronom féminin renvoie grammaticalement à Jérusalem ; la construction impersonnelle française rend naturellement l’actif hébreu sans imposer l’identité de celui qui donne le nom.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre, conformément à la présence explicite du tétragramme dans le texte source.
- source_word: צִדְקֵנוּ
  choice: est notre justice
  rationale: Le nom צֶדֶק avec suffixe de première personne du pluriel signifie « notre justice ». L’ajout de « est » explicite en français la valeur prédicative de la formule nominale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans la formule de désignation
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le nom divin. Sa transcription préserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Référent de la formule de désignation par rapport à Jérémie 23.6
  choice: La désignation s’applique ici à Jérusalem
  alternative: Comprendre directement la formule comme le titre du roi davidique à venir
  rationale: Le suffixe féminin לָהּ renvoie grammaticalement à Jérusalem. L’écho manifeste de Jérémie 23.6 est signalé en note sans effacer la différence de référent entre les deux passages.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant une tournure artificielle ; « habitera en sécurité » conserve l’idée d’une résidence stable et sûre.
