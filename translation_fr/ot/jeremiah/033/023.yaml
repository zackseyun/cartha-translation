  text: And the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé[a] fut adressée à Jérémie en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; également transcrit « Yahweh » ou « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et ses principales transcriptions possibles.
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, la construction narrative avec היה s’intègre naturellement à l’expression « la parole… fut adressée », sans recourir au calque archaïque « il arriva que ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule דְּבַר יְהוָה, « la parole » demeure le rendu français traditionnel, transparent et fidèle à la portée révélatrice du message divin.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme un nom propre, selon sa forme française courante, plutôt que remplacé par un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole et s’exprime naturellement par « à » dans la tournure française « être adressé à ».
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Le nom propre est rendu selon sa forme française consacrée.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le discours divin qui suit. « En ces termes » est une formulation française naturelle qui prépare directement la citation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: YHWH ou Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » conserve le caractère personnel du nom divin dans une forme française largement reconnue, sans lui substituer le titre « le Seigneur ».
translation_notes:
  register: Français international moderne, sobre et digne. La formule prophétique est rendue de manière idiomatique tout en conservant « la parole » et le nom divin comme éléments distinctifs.
