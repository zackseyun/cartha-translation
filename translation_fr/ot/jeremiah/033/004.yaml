  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל עַל בָּתֵּי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/עַל בָּתֵּ֖י מַלְכֵ֣י יְהוּדָ֑ה הַ/נְּתֻצִ֕ים אֶל הַ/סֹּלְל֖וֹת וְ/אֶל הֶ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/004.yaml
  text: 'For thus says Yahweh, the God of Israel, concerning the houses of this city and the houses of the kings of Judah that are being torn down for the siege ramps and for the sword:'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh, le Dieu d’Israël, au sujet des maisons de cette ville et des maisons des rois de Juda[a], que l’on démolit pour se défendre contre les rampes de siège[b] et contre l’épée[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des palais des rois de Juda ».
    reason: lexical_alternative
  - marker: b
    text: Ou « aux remblais de siège » ou « aux ouvrages de siège ».
    reason: lexical_alternative
  - marker: c
    text: Dans l’hébreu, « l’épée » peut désigner la guerre ou le massacre.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la parole précédente et conserve la valeur causale ou explicative du connecteur.
- source_word: כֹה אָמַר
  choice: voici ce que dit
  rationale: Formule prophétique rendue dans un français actuel et naturel, sans perdre sa solennité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement et naturellement la chaîne construite hébraïque.
- source_word: עַל
  choice: au sujet de
  rationale: Introduit ici le thème de la déclaration divine plutôt qu’une action hostile.
- source_word: בָּתֵּי הָעִיר הַזֹּאת
  choice: les maisons de cette ville
  rationale: Conserve la structure du texte et la désignation contextuelle de Jérusalem.
- source_word: בָּתֵּי מַלְכֵי יְהוּדָה
  choice: les maisons des rois de Juda
  rationale: Préserve la répétition de בָּתֵּי; dans ce contexte royal, « palais » reste une possibilité signalée en note.
- source_word: הַנְּתֻצִים
  choice: que l’on démolit
  rationale: Le participe passif décrit les bâtiments soumis à la démolition; la tournure impersonnelle française exprime naturellement le procès sans nommer les agents.
- source_word: אֶל
  choice: pour faire face à
  rationale: Dans ce contexte militaire, la préposition peut exprimer l’orientation ou la destination de la démolition. Cette formulation indique l’emploi défensif probable sans préciser si les matériaux ou l’espace dégagé sont en cause.
- source_word: הַסֹּלְלוֹת
  choice: les rampes de siège
  rationale: Désigne les remblais ou ouvrages élevés par les assiégeants; « rampes de siège » est concret et compréhensible.
- source_word: הֶחָרֶב
  choice: l’épée
  rationale: Conserve l’image hébraïque, où l’épée peut représenter la guerre ou le massacre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel et l’usage retenu par le projet.
- issue: Fonction de la démolition des maisons
  choice: pour faire face aux rampes de siège et à l’épée
  alternative: démolies vers/contre les rampes de siège et l’épée
  rationale: La syntaxe indique une orientation militaire, mais ne précise pas exactement comment la démolition sert la défense. Le français choisi garde cette relative indétermination au lieu d’ajouter une explication matérielle absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est rendue idiomatiquement; les images militaires et la répétition de « maisons » sont conservées. Le deux-points final maintient le lien syntaxique avec la suite.
