  text: כֹּֽה אָמַ֥ר יְהוָ֖ה עֹשָׂ֑/הּ יְהוָ֗ה יוֹצֵ֥ר אוֹתָ֛/הּ לַ/הֲכִינָ֖/הּ יְהוָ֥ה שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/002.yaml
  text: 'Thus says Yahweh[a], who made it[c][b], Yahweh who formed it to establish it—Yahweh is his name:'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, qui l’a faite[a], Yahweh qui l’a façonnée pour l’établir — Yahweh est son nom :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « qui la fait, Yahweh qui la façonne pour l’établir ». Les participes hébreux peuvent exprimer une action présente ou continue. Les suffixes sont féminins en hébreu, mais leur référent n’est pas précisé dans ce verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique française naturelle et digne, au présent performatif, qui correspond à l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent trois fois dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: עֹשָׂהּ
  choice: lui qui l’a faite
  rationale: Rend le participe de עשה avec son suffixe féminin singulier. Le passé s’accorde avec la séquence de création et d’établissement, tandis que le pronom laisse le référent implicite.
- source_word: יוֹצֵר אוֹתָהּ
  choice: lui qui l’a façonnée
  rationale: « Façonner » exprime la formation intentionnelle portée par יצר et conserve le suffixe féminin sans nommer son référent.
- source_word: לַהֲכִינָהּ
  choice: pour l’établir
  rationale: Le hiphil de כון indique ici l’action de rendre stable ou d’établir; « pour » exprime naturellement la visée indiquée par ל.
- source_word: שְׁמוֹ
  choice: est son nom
  rationale: Conserve la structure solennelle de la proposition hébraïque d’identification.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le Tétragramme; sa transcription préserve le nom personnel et sa triple répétition.
- issue: Référent des suffixes féminins singuliers
  choice: Pronoms féminins « l’… faite » et « façonnée », sans antécédent ajouté
  alternative: Employer un masculin neutre en français ou préciser « la ville », « la terre » ou une autre réalité
  rationale: L’hébreu marque le féminin mais n’identifie pas ici le référent. La traduction conserve ce trait et l’ambiguïté au lieu d’introduire une interprétation.
- issue: Valeur temporelle des participes עֹשָׂהּ et יוֹצֵר
  choice: 'Passé composé : « a faite… a façonnée »'
  alternative: 'Présent : « la fait… la façonne »'
  rationale: Le passé composé donne en contexte une lecture naturelle de l’œuvre menée en vue de son établissement, mais les participes hébreux permettent aussi une valeur présente ou continue, signalée en note.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La répétition de « Yahweh » et la structure de la déclaration sont conservées. L’accord féminin rend les suffixes hébreux tout en maintenant leur référent implicite.
