language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא יִסָּפֵר֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/לֹ֥א יִמַּ֖ד ח֣וֹל הַ/יָּ֑ם כֵּ֣ן אַרְבֶּ֗ה אֶת זֶ֨רַע֙ דָּוִ֣ד עַבְדִּ֔/י וְ/אֶת הַ/לְוִיִּ֖ם מְשָׁרְתֵ֥י אֹתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/022.yaml
  text: As the host of heaven cannot be counted and the sand of the sea cannot be measured[d][c][b][a], so I will multiply the offspring of David my servant and the Levites who minister to me.
translation:
  language: fr
  text: De même que l’armée des cieux[a] ne peut être dénombrée et que le sable de la mer ne peut être mesuré, de même je multiplierai la descendance[b] de David, mon serviteur, et les Lévites qui sont à mon service[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne la multitude céleste, qui comprend souvent les étoiles.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « la semence de David » ; autre traduction possible : « les descendants de David ».'
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction possible : « qui assurent mon service » ; l’hébreu peut désigner un service cultuel continu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְבָא הַשָּׁמַיִם
  choice: l’armée des cieux
  rationale: Cette expression conserve l’image collective de l’hébreu צָבָא, qui désigne ici la multitude céleste, notamment les étoiles, sans la réduire explicitement à celles-ci.
- source_word: לֹא יִסָּפֵר
  choice: ne peut être dénombrée
  rationale: Le niphal de ספר exprime ici l’impossibilité de compter ou de dénombrer cette multitude. « Dénombrée » convient au registre soutenu mais accessible du passage.
- source_word: חוֹל הַיָּם
  choice: le sable de la mer
  rationale: Traduction directe d’une image hébraïque courante évoquant une quantité immense.
- source_word: לֹא יִמַּד
  choice: ne peut être mesuré
  rationale: Le niphal de מדד signifie « être mesuré ». La formulation maintient le parallélisme avec « ne peut être dénombrée ».
- source_word: כֵּן אַרְבֶּה
  choice: de même je multiplierai
  rationale: La locution comparative כֵּן reprend la comparaison initiale, tandis que le hiphil de רבה signifie « rendre nombreux, multiplier ».
- source_word: זֶרַע דָּוִד
  choice: la descendance de David
  rationale: זֶרַע est un nom collectif pouvant désigner la semence, la postérité ou les descendants. « Descendance » est naturel en français et préserve la valeur collective.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte royal et relationnel, « serviteur » rend mieux le statut de David auprès de Dieu que « esclave ».
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation tribale consacrée et immédiatement compréhensible en français.
- source_word: מְשָׁרְתֵי אֹתִי
  choice: qui sont à mon service
  rationale: Le participe de שׁרת désigne un service continu, notamment cultuel. Cette formulation reste naturelle tout en laissant le contexte préciser la nature du service.
theological_decisions:
- issue: Rapport entre la descendance davidique et les Lévites dans la promesse
  choice: La promesse porte parallèlement sur la multiplication de la descendance de David et sur celle des Lévites au service de Dieu.
  alternative: On pourrait préciser que les Lévites sont exclusivement des ministres du temple dans l’horizon historique de Jérémie, ou expliciter une lecture messianique ultérieure de la promesse.
  rationale: L’hébreu coordonne deux compléments directs du verbe « multiplier ». La traduction maintient ce parallélisme sans imposer au verset une résolution doctrinale ou canonique qu’il n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, digne et lisible. Le double « de même » rend explicitement la structure comparative de l’hébreu. « L’armée des cieux » conserve l’expression imagée du texte source, tandis que la note en précise la portée. La syntaxe coordonne clairement les deux groupes promis à la multiplication.
