base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/026.yaml
  text: then I would also reject the offspring of Jacob and of David my servant[a], not taking from his offspring rulers over the offspring of Abraham, Isaac, and Jacob[b]. For I will restore their fortunes and have compassion on them.
translation:
  language: fr
  text: alors je rejetterais aussi la descendance de Jacob et celle de David, mon serviteur[a], sans prendre parmi sa descendance des gouvernants pour gouverner la descendance d’Abraham, d’Isaac et de Jacob. Car je rétablirai leur situation[b] et j’aurai compassion d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la semence de Jacob » et, dans tout le verset, « semence » au lieu de « descendance ». Le mot hébreu זֶרַע est un singulier collectif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je ramènerai leurs captifs » ou « je les ferai revenir d’exil ». L’expression hébraïque peut désigner précisément le retour d’exil ou, plus largement, le rétablissement d’une situation favorable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: alors… aussi
  rationale: Le verset poursuit l’apodose de la condition formulée au verset précédent. « Alors… aussi » rend à la fois la conséquence et la valeur additive.
- source_word: זֶרַע יַעֲקוֹב וְדָוִד עַבְדִּי
  choice: la descendance de Jacob et celle de David, mon serviteur
  rationale: זֶרַע est un singulier collectif. « Descendance » est naturel en français et « celle de » explicite la coordination sans modifier le sens.
- source_word: אֶמְאַס
  choice: je rejetterais
  rationale: Le conditionnel marque l’apodose irréelle héritée du verset précédent. « Rejeter » convient au contexte d’alliance mieux que « mépriser ».
- source_word: מִקַּחַת מִזַּרְעוֹ
  choice: sans prendre dans la descendance de ce dernier
  rationale: La tournure rend la construction infinitive avec מִן. « Ce dernier » identifie David comme l’antécédent le plus proche tout en évitant une répétition lourde.
- source_word: מֹשְׁלִים אֶל
  choice: des hommes pour gouverner
  rationale: Le participe pluriel désigne des personnes qui exercent l’autorité, et אֶל introduit ici la sphère sur laquelle elles gouvernent.
- source_word: אשוב אֶת שְׁבוּתָם
  choice: je rétablirai leur situation
  rationale: L’expression idiomatique peut désigner le retour d’exil ou, plus largement, le renversement de leur malheur. Cette formulation française conserve cette amplitude.
- source_word: וְרִחַמְתִּים
  choice: et j’aurai compassion d’eux
  rationale: Cette expression conserve la dimension affective de רחם dans un registre biblique actuel et digne.
theological_decisions:
- issue: Valeur conditionnelle reportée du verset précédent
  choice: 'Employer le conditionnel : « je rejetterais »'
  alternative: 'Employer le futur simple : « je rejetterai »'
  rationale: Le verset 26 achève la proposition conditionnelle irréelle commencée au verset 25. Le conditionnel évite de présenter à tort le rejet comme une annonce future.
- issue: Antécédent du suffixe dans מִזַּרְעוֹ
  choice: 'Le rapporter à David : « la descendance de ce dernier »'
  alternative: Le rapporter à Jacob ou à Israël collectivement
  rationale: David est l’antécédent masculin singulier le plus proche, et le contexte porte sur des gouvernants issus de sa lignée pour régner sur le peuple des patriarches.
translation_notes:
  register: Français international moderne, clair et digne. Le conditionnel maintient le lien logique avec le verset précédent. Les répétitions de « descendance » reflètent le terme hébreu récurrent, tandis que « de ce dernier » rend explicite le référent davidique.
