id: JER.33.14
reference: Jeremiah 33:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וַ/הֲקִֽמֹתִי֙ אֶת הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבַּ֛רְתִּי אֶל בֵּ֥ית יִשְׂרָאֵ֖ל וְ/עַל בֵּ֥ית יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/014.yaml
  text: Look[a], days are coming, declares Yahweh, when I will fulfill the good word that I spoke to the house of Israel and the house of Judah.
translation:
  language: fr
  text: Voici que des jours viennent — déclaration de Yahweh — où j’accomplirai la bonne parole[a] que j’ai prononcée au sujet de la maison d’Israël et de la maison de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la bonne promesse ». Littéralement : « la bonne parole ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Formule d’attention naturelle et digne en français moderne, qui conserve la force annonciatrice de l’hébreu.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Reproduit de près la formule prophétique hébraïque tout en restant idiomatique en français.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique nominale avec solennité, sans la réduire à un simple « dit Yahweh ».
- source_word: וַהֲקִמֹתִי
  choice: j’accomplirai
  rationale: Le hiphil de קום, avec une parole pour objet, exprime ici le fait de la faire tenir, c’est-à-dire de la réaliser.
- source_word: הַדָּבָר הַטּוֹב
  choice: la bonne parole
  rationale: Conserve le sens littéral de דָּבָר et son lien lexical avec « que j’ai prononcée », sans expliciter d’emblée « promesse ».
- source_word: דִּבַּרְתִּי
  choice: j’ai prononcée
  rationale: Rend l’acte de parler tout en s’accordant naturellement avec « parole » en français.
- source_word: אֶל בֵּית יִשְׂרָאֵל וְעַל בֵּית יְהוּדָה
  choice: au sujet de la maison d’Israël et de la maison de Juda
  rationale: La coordination des prépositions אֶל et עַל permet ici une compréhension référentielle commune. « Au sujet de » convient à la parole concernant les deux maisons sans suggérer qu’elle leur fut nécessairement adressée directement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Sens de הַדָּבָר הַטּוֹב
  choice: la bonne parole
  alternative: la bonne promesse
  rationale: « Parole » conserve la formulation et l’écho lexical de l’hébreu; « promesse » exprime correctement le sens contextuel, mais l’interprète davantage.
- issue: Rapport de la parole à Israël et à Juda
  choice: au sujet de la maison d’Israël et de la maison de Juda
  alternative: à la maison d’Israël et à la maison de Juda
  rationale: L’hébreu emploie deux prépositions différentes, אֶל puis עַל. Le rendu retenu donne une relation cohérente en français sans reproduire artificiellement cette variation ni affirmer plus précisément les destinataires.
translation_notes:
  register: Français international moderne, solennel mais accessible. La tournure prophétique « Voici que des jours viennent » et l’incise « déclaration de Yahweh » conservent la dignité et le rythme de l’original.
