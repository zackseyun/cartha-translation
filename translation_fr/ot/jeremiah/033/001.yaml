id: JER.33.1
reference: Jeremiah 33:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶֽל יִרְמְיָ֖הוּ שֵׁנִ֑ית וְ/הוּא֙ עוֹדֶ֣/נּוּ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/001.yaml
  text: And the word of Yahweh came to Jeremiah a second time while he was still confined in the court of the guard[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh fut adressée à Jérémie une deuxième fois, alors qu’il était encore détenu dans la cour de la garde[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la cour de la prison ». L’expression hébraïque désigne probablement une cour de détention surveillée ou l’enceinte d’un poste de garde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: La parole de Yahweh fut adressée à Jérémie
  rationale: Cette formulation française naturelle conserve la formule prophétique et rend le mouvement de la parole vers le prophète sans calquer lourdement l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: שֵׁנִית
  choice: une deuxième fois
  rationale: Cette expression marque précisément la séquence indiquée par l’adverbe hébreu, plus nettement que « de nouveau ».
- source_word: וְהוּא עוֹדֶנּוּ עָצוּר
  choice: alors qu’il était encore détenu
  rationale: La tournure restitue naturellement la circonstance temporelle; « détenu » exprime la contrainte sans préciser excessivement son statut juridique.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: dans la cour de la garde
  rationale: « Cour » rend חָצֵר et « garde » conserve la référence probable à une enceinte surveillée servant à la détention, sans l’identifier catégoriquement à une prison formelle.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles qui suivent et évitent le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la formule prophétique hébraïque, tandis que les deux-points rendent idiomatiquement לֵאמֹר. Le terme « détenu » évite à la fois l’archaïsme et une précision juridique absente du texte.
