base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/018.yaml
  text: And the Levitical priests will never lack a man before me to offer burnt offerings, burn grain offerings, and make sacrifices continually[a].
translation:
  language: fr
  text: Et les prêtres lévitiques ne manqueront jamais d’un homme devant moi pour offrir des holocaustes, faire fumer des offrandes végétales et présenter des sacrifices continuellement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jérémie 33.14-26 est absent de l’ancienne version grecque du livre de Jérémie.
    reason: textual_variant
lexical_decisions:
- source_word: וְלַכֹּהֲנִים הַלְוִיִּם
  choice: Et les prêtres lévitiques
  rationale: Le groupe sacerdotal est le thème et le bénéficiaire de la promesse. En français, il n’est pas nécessaire de rendre séparément la préposition préfixée לַ־.
- source_word: לֹא יִכָּרֵת אִישׁ
  choice: ne manqueront jamais d’un homme
  rationale: Dans cette tournure, כרת exprime le fait que la lignée sacerdotale ne sera jamais privée d’un représentant en service, et non qu’un individu précis ne mourra pas ou ne sera pas retranché.
- source_word: מִלְּפָנַי
  choice: qui se tienne devant moi
  rationale: La formule désigne le service sacerdotal accompli dans la présence de Dieu. L’ajout idiomatique de « se tienne » relie clairement l’expression à « un homme ».
- source_word: מַעֲלֶה עוֹלָה
  choice: pour offrir des holocaustes
  rationale: « Holocaustes » est le terme français établi pour les sacrifices entièrement consumés. Le pluriel générique convient à la continuité du service.
- source_word: וּמַקְטִיר מִנְחָה
  choice: faire fumer des offrandes végétales
  rationale: Le verbe décrit l’action de faire monter en fumée l’offrande sur l’autel. « Offrandes végétales » rend מִנְחָה dans son emploi cultuel sans la limiter aux seules céréales.
- source_word: וְעֹשֶׂה זֶּבַח
  choice: et présenter des sacrifices
  rationale: La formulation française exprime naturellement l’accomplissement d’un sacrifice et maintient le parallélisme de la série cultuelle.
- source_word: כָּל הַיָּמִים
  choice: continuellement
  rationale: L’adverbe restitue la durée permanente indiquée par l’expression hébraïque, sans le calque peu naturel « tous les jours » dans ce contexte.
theological_decisions:
- issue: Sens de לֹא יִכָּרֵת אִישׁ dans la promesse de continuité sacerdotale
  choice: ne manqueront jamais d’un homme
  alternative: aucun homme ne sera retranché
  rationale: Le contexte porte sur la continuité d’une lignée et de son service. La traduction idiomatique évite de laisser entendre l’immortalité ou la préservation absolue d’un prêtre individuel, tout en conservant la force permanente de la promesse.
- issue: Identification exprimée par הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévitiques
  alternative: les prêtres, les Lévites
  rationale: Cette formulation conserve l’identification des prêtres comme lévitiques sans imposer une reconstruction historique ou confessionnelle plus précise.
- issue: Valeur des participes מַעֲלֶה, מַקְטִיר et עֹשֶׂה
  choice: une série infinitive décrivant le service de l’homme présent devant Dieu
  alternative: 'des propositions relatives répétées : « qui offre…, qui fait fumer…, qui présente… »'
  rationale: Après « qui se tienne devant moi », les infinitifs introduits par « pour » expriment naturellement les fonctions continues du représentant sacerdotal. Ils ne signalent pas ici la cause de sa présence, mais la nature du service promis.
translation_notes:
  register: Français international moderne, digne et accessible. « Prêtres lévitiques » et « holocaustes » conservent le vocabulaire biblique courant; « faire fumer » maintient l’image concrète du rite. Le marqueur [a] figure dans le texte principal.
