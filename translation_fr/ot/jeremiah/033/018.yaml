  terminology: « Prêtres lévitiques », « holocaustes », « offrandes végétales » et « sacrifices » conviennent au registre biblique français et rendent les catégories cultuelles sans imposer d’interprétation confessionnelle. La note textuelle est exacte et son ancrage est correct.
