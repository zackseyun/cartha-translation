reference: Jeremiah 33:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/עָרֵ֨י הָ/הָ֜ר בְּ/עָרֵ֤י הַ/שְּׁפֵלָה֙ וּ/בְ/עָרֵ֣י הַ/נֶּ֔גֶב וּ/בְ/אֶ֧רֶץ בִּנְיָמִ֛ן וּ/בִ/סְבִיבֵ֥י יְרוּשָׁלִַ֖ם וּ/בְ/עָרֵ֣י יְהוּדָ֑ה עֹ֣ד תַּעֲבֹ֧רְנָה הַ/צֹּ֛אן עַל יְדֵ֥י מוֹנֶ֖ה אָמַ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/013.yaml
  text: In the cities of the hill country[a], in the cities of the lowland, and in the cities of the Negeb, and in the land of Benjamin, and around Jerusalem, and in the cities of Judah, the flocks will again pass under the hands of the one who counts them[c][b], says Yahweh.
translation:
  language: fr
  text: Dans les villes de la région montagneuse, dans les villes de la plaine[a] et dans les villes du Néguev[b], sur le territoire de Benjamin, aux alentours de Jérusalem et dans les villes de Juda, les troupeaux passeront de nouveau sous la main de celui qui les compte[c], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Shéphéla », région de basses collines située entre les montagnes de Juda et la plaine côtière.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Sud » ; le Néguev est la région méridionale de Juda.
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque évoque un berger qui compte les bêtes à mesure qu’elles passent sous sa main.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעָרֵי הָהָר
  choice: dans les villes de la région montagneuse
  rationale: הָהָר désigne ici la région montagneuse de Juda plutôt qu’une montagne particulière. « Région montagneuse » rend clairement cette valeur géographique.
- source_word: הַשְּׁפֵלָה
  choice: le Bas-Pays
  rationale: Le terme désigne la Shéphéla, région de basses collines située entre les montagnes de Juda et la plaine côtière. « Bas-Pays » conserve son caractère régional, avec une note explicative.
- source_word: הַנֶּגֶב
  choice: le Néguev
  rationale: Il s’agit du nom d’une région méridionale. La forme française usuelle « Néguev » préserve cette valeur de nom propre.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: le territoire de Benjamin
  rationale: Dans ce contexte géographique, « territoire » exprime naturellement la terre rattachée à Benjamin.
- source_word: סְבִיבֵי יְרוּשָׁלִַם
  choice: aux alentours de Jérusalem
  rationale: Cette expression française naturelle désigne les zones qui entourent la ville.
- source_word: עָרֵי יְהוּדָה
  choice: les villes de Juda
  rationale: « Villes » reprend de manière cohérente le terme répété עָרֵי dans l’énumération.
- source_word: עֹד
  choice: de nouveau
  rationale: Dans ce contexte de rétablissement, עֹד annonce la reprise future d’une activité interrompue.
- source_word: תַּעֲבֹרְנָה הַצֹּאן
  choice: les troupeaux passeront
  rationale: צֹאן est un collectif qui englobe le petit bétail, notamment les moutons et les chèvres. « Troupeaux » rend cette portée sans la limiter aux seuls moutons.
- source_word: עַל יְדֵי מוֹנֶה
  choice: sous la main de celui qui les compte
  rationale: La formulation conserve l’image pastorale des bêtes qui défilent sous la main du berger afin d’être comptées, tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » restitue le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Image du rétablissement exprimée par le comptage des troupeaux
  choice: Conserver l’image concrète des troupeaux qui passent sous la main de celui qui les compte.
  alternative: Paraphraser en disant que les troupeaux seront de nouveau recensés ou soigneusement gardés.
  rationale: Le texte présente le retour à une vie pastorale normale comme signe de rétablissement. Maintenir l’image permet au lecteur d’en percevoir la portée sans lui imposer une interprétation théologique supplémentaire.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme; sa translittération préserve le caractère personnel du nom divin.
translation_notes:
  register: Français international actuel, clair et digne. L’énumération géographique et l’image pastorale concrète de l’hébreu sont conservées. Les noms régionaux moins transparents sont expliqués en notes.
