revisions:
- from: 'Ainsi parle Yahweh des armées : Une fois encore, il y aura dans ce lieu, qui est dévasté, sans être humain ni bête[a], et dans toutes ses villes, un pâturage pour les bergers[b], où ils feront reposer leurs troupeaux.'
  to: 'Ainsi parle Yahweh des armées : une fois encore, il y aura dans ce lieu, qui est dévasté, sans être humain ni bête[a], et dans toutes ses villes, un lieu de séjour pour les bergers[b], où des bergers feront reposer leurs troupeaux.'
  rationale: 'La révision remplace « pâturage pour les bergers », qui inverse légèrement la relation sémantique, par « lieu de séjour pour les bergers », sens bien attesté de נְוֵה dans ce contexte pastoral. Elle maintient la promesse au futur et le causatif : les bergers font reposer leurs troupeaux. La note sur la formule de dépeuplement est également rendue plus exacte.'
