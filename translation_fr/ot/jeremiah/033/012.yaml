source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ ע֞וֹד יִֽהְיֶ֣ה בַּ/מָּק֣וֹם הַ/זֶּ֗ה הֶ/חָרֵ֛ב מֵֽ/אֵין אָדָ֥ם וְ/עַד בְּהֵמָ֖ה וּ/בְ/כָל עָרָ֑י/ו נְוֵ֣ה רֹעִ֔ים מַרְבִּצִ֖ים צֹֽאן־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/012.yaml
  text: 'Thus says Yahweh of hosts: Yet again there will be in this place[a], which is desolate, without man or beast, and in all its cities, a pasture of shepherds[c][b], where they make flocks lie down.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : une fois encore, il y aura dans ce lieu, qui est dévasté, sans être humain ni bête[a], et dans toutes ses villes, un lieu de séjour pour les bergers[b], où des bergers feront reposer leurs troupeaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « sans humain jusqu’à la bête » ; formule exprimant une dévastation totale.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « un pâturage de bergers » ou « un enclos pour les bergers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par un français actuel et concret, sans limiter les armées aux seules réalités terrestres.
- source_word: עוֹד
  choice: Une fois encore
  rationale: Exprime le retour futur d'une réalité pastorale après la dévastation et convient naturellement à la promesse de restauration.
- source_word: בַּמָּקוֹם הַזֶּה הֶחָרֵב
  choice: dans ce lieu, qui est dévasté
  rationale: Respecte la localisation et la valeur descriptive du participe, tout en restant naturel en français.
- source_word: מֵאֵין אָדָם וְעַד בְּהֵמָה
  choice: sans être humain ni bête
  rationale: Rend la formule de dépeuplement total sans employer « homme » dans un sens générique potentiellement ambigu en français moderne.
- source_word: וּבְכָל עָרָיו
  choice: et dans toutes ses villes
  rationale: Le suffixe renvoie au territoire désigné par « ce lieu »; le possessif français en préserve le lien.
- source_word: נְוֵה רֹעִים
  choice: un pâturage pour les bergers
  rationale: Dans le contexte du repos des troupeaux, נְוֵה désigne naturellement un lieu pastoral; « pour les bergers » exprime clairement la relation construite.
- source_word: מַרְבִּצִים צֹאן
  choice: où ils feront reposer leurs troupeaux
  rationale: Préserve la valeur causative du participe hifil et explicite naturellement que les bergers font coucher ou reposer le petit bétail.
theological_decisions:
- issue: Portée de אָדָם dans la formule de dépeuplement
  choice: être humain
  alternative: homme
  rationale: אָדָם désigne ici les humains par opposition aux bêtes, non les seuls hommes de sexe masculin; « être humain » garde cette portée sans modifier le sens théologique.
- issue: Désignation divine יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le Seigneur des armées
  rationale: La translittération conserve le nom propre de l'alliance présent dans le texte source; « des armées » maintient l'ampleur du titre sans la préciser indûment.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe prophétique est conservée sans lourdeur excessive; « fera reposer » maintient l'image concrète du berger qui installe son troupeau.
