source:
  edition: WLC
  text: קְרָ֥א אֵלַ֖/י וְ/אֶעֱנֶ֑/ךָּ וְ/אַגִּ֧ידָה לְּ/ךָ֛ גְּדֹל֥וֹת וּ/בְצֻר֖וֹת לֹ֥א יְדַעְתָּֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/003.yaml
  text: Call to me[a], and I will answer you, and I will tell you great and hidden things that you have not known.
translation:
  language: fr
  text: Appelle-moi, et je te répondrai. Je te révélerai des choses grandes et inaccessibles[a] que tu ne connais pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « cachées » ou « fortifiées » : le terme hébreu évoque ce qui est retranché et hors d’accès.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא אֵלַי
  choice: Appelle-moi
  rationale: L’impératif qal suivi de אֵלַי invite directement le destinataire à s’adresser à Dieu. « Appelle-moi » est naturel en français actuel et n’ajoute pas l’intensité qu’impliquerait « Crie vers moi ».
- source_word: וְאֶעֱנֶךָ
  choice: et je te répondrai
  rationale: Le verbe ענה signifie ici répondre à l’appel. Le futur français exprime clairement la réponse promise.
- source_word: וְאַגִּידָה לְּךָ
  choice: Je te révélerai
  rationale: Le hiphil de נגד signifie dire, annoncer ou faire connaître. « Révélerai » convient au contexte, où Dieu rend accessibles au prophète des réalités qu’il ignore, sans transformer celles-ci en mystères ésotériques.
- source_word: גְּדֹלוֹת
  choice: des choses grandes
  rationale: L’adjectif féminin pluriel est employé substantivement. « Des choses grandes » conserve sa portée large et le parallélisme de la phrase.
- source_word: וּבְצֻרוֹת
  choice: et inaccessibles
  rationale: Le terme dérivé de בצר évoque ce qui est fortifié, retranché ou hors d’accès. « Inaccessibles » préserve mieux cette image que le seul mot « cachées » tout en restant intelligible en français moderne.
- source_word: לֹא יְדַעְתָּם
  choice: que tu ne connais pas
  rationale: Le parfait indique que ces choses ne sont pas entrées dans la connaissance du destinataire. Dans cette promesse directe, le présent français est plus idiomatique que « que tu n’as pas connues » et garde l’accent sur son ignorance actuelle.
theological_decisions:
- issue: Portée de וּבְצֻרוֹת dans le contexte d’une révélation divine
  choice: Employer « inaccessibles » dans le texte principal
  alternative: « cachées » ou, plus littéralement, « fortifiées »
  rationale: La promesse concerne des réalités auxquelles le prophète n’a pas accès par lui-même. « Inaccessibles » maintient la métaphore d’un accès barré sans réduire le terme à une notion abstraite de mystère; les autres nuances sont signalées en note.
translation_notes:
  register: Français international moderne, direct et digne. La seconde phrase est séparée de la première pour alléger la coordination hébraïque répétée. « Des choses grandes » conserve la formulation ample de l’original, tandis qu’« inaccessibles » en maintient l’image concrète.
