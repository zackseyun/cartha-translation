revisions:
- from: N’as-tu pas vu ce que dit ce peuple ? « Les deux familles[a] que Yahweh avait choisies, il les a rejetées[b] ! » Ainsi, ces gens méprisent mon peuple, au point de ne plus le considérer comme une nation à leurs yeux[c].
  to: 'N’as-tu pas vu ce que ce peuple a dit : « Les deux familles[a] que Yahweh a choisies, il les a rejetées[b] ! » Et ils méprisent mon peuple, au point de ne plus le considérer comme une nation à leurs yeux[c].'
  rationale: La révision rétablit la valeur perfective de « ont dit », retire la nuance non marquée de « ces gens » et ajuste la note littérale. Elle maintient l’interprétation prudente de la dernière proposition comme relevant du regard méprisant des interlocuteurs, sans identifier les « deux familles » ni imposer une conclusion sur le statut objectif du peuple.
