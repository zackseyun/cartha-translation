  text: הֲ/ל֣וֹא רָאִ֗יתָ מָֽה הָ/עָ֤ם הַ/זֶּה֙ דִּבְּר֣וּ לֵ/אמֹ֔ר שְׁתֵּ֣י הַ/מִּשְׁפָּח֗וֹת אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה בָּ/הֶ֖ם וַ/יִּמְאָסֵ֑/ם וְ/אֶת עַמִּ/י֙ יִנְאָצ֔וּ/ן מִֽ/הְי֥וֹת ע֖וֹד גּ֥וֹי לִ/פְנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/024.yaml
  text: Have you not seen what this people have spoken[a], saying, ‘The two families that Yahweh chose—he has rejected them’? Thus they despise my people[c][b], so that they should no longer be a nation before them.
translation:
  language: fr
  text: 'N’as-tu pas vu ce que ce peuple a dit : « Les deux familles[a] que Yahweh a choisies, il les a rejetées[b] ! » Et ils méprisent mon peuple, au point de ne plus le considérer comme une nation à leurs yeux[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les deux clans » ou « les deux maisons ». L’hébreu ne précise pas de quels deux groupes il s’agit.
    reason: lexical_alternative
  - marker: b
    text: Ou « il les a repoussées » ou « il les a prises en aversion ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « de n’être plus une nation devant eux » ; l’expression peut signifier « à leurs yeux » ou « selon leur jugement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא רָאִיתָ
  choice: N’as-tu pas vu
  rationale: Conserve la question rhétorique adressée à une seule personne et son attente d’une réponse affirmative.
- source_word: מָה הָעָם הַזֶּה דִּבְּרוּ לֵאמֹר
  choice: ce que dit ce peuple
  rationale: Rend naturellement en français actuel la formule hébraïque « ce que ce peuple a parlé, en disant ». Le présent convient à des propos en circulation sans imposer une chronologie précise.
- source_word: שְׁתֵּי הַמִּשְׁפָּחוֹת
  choice: les deux familles
  rationale: מִשְׁפָּחוֹת désigne des familles ou des clans. Le terme général « familles » maintient l’indétermination du référent.
- source_word: אֲשֶׁר בָּחַר יְהוָה בָּהֶם
  choice: que Yahweh avait choisies
  rationale: Le plus-que-parfait situe naturellement le choix avant le rejet allégué. « Yahweh » transcrit le nom divin personnel יהוה.
- source_word: וַיִּמְאָסֵם
  choice: il les a rejetées
  rationale: מָאַס exprime le rejet ou le fait de repousser avec aversion. « Rejeter » est clair et conserve la force de l’accusation.
- source_word: וְאֶת עַמִּי יִנְאָצוּן
  choice: Ainsi, ces gens méprisent mon peuple
  rationale: נָאַץ exprime le mépris. « Ces gens » reprend sans ambiguïté les membres du collectif « ce peuple », sujet pluriel du verbe hébreu.
- source_word: מִהְיוֹת עוֹד גּוֹי לִפְנֵיהֶם
  choice: au point de ne plus le considérer comme une nation à leurs yeux
  rationale: Cette formulation relie la négation du statut national au regard méprisant des locuteurs, tout en rendant לִפְנֵיהֶם par l’expression idiomatique « à leurs yeux ».
theological_decisions:
- issue: Identité des « deux familles »
  choice: Le texte conserve l’expression générale « les deux familles » sans les identifier.
  alternative: Les identifier à Israël et Juda, ou aux lignées de David et de Lévi.
  rationale: Le verset ne précise pas lui-même leur identité. Le contexte permet plusieurs lectures, qu’il ne convient pas de trancher dans la traduction.
- issue: Portée de la proposition finale
  choice: 'Elle décrit le jugement méprisant porté par les locuteurs : ils ne considèrent plus le peuple comme une nation.'
  alternative: Affirmer que le peuple a objectivement cessé d’être une nation, ou exprimer le souhait qu’il cesse de l’être.
  rationale: לִפְנֵיהֶם signifie littéralement « devant eux » et peut désigner leur regard ou leur estimation. La formulation choisie évite de transformer leur mépris en constat objectif.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et le discours cité sont clairement distingués. « Ces gens » évite l’accord heurté entre le collectif singulier « ce peuple » et le verbe hébreu au pluriel. Les notes préservent les ambiguïtés lexicales et référentielles sans imposer une identification théologique.
