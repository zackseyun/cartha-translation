  text: בַּ/יָּמִ֤ים הָ/הֵם֙ וּ/בָ/עֵ֣ת הַ/הִ֔יא אַצְמִ֥יחַ לְ/דָוִ֖ד צֶ֣מַח צְדָקָ֑ה וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/015.yaml
  text: In those days and at that time I will cause a righteous Branch to sprout for David[b][a], and he will execute justice and righteousness in the land.
translation:
  language: fr
  text: En ces jours-là et en ce temps-là, je ferai pousser pour David un Germe de justice[b][a], et il exercera le droit et la justice dans le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un Germe juste »; autre traduction possible : « un Germe équitable ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme « Germe » fait probablement écho au roi issu de David qui est promis en Jérémie 23,5.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Rend directement la formule temporelle, avec un français naturel et solennel.
- source_word: וּבָעֵת הַהִיא
  choice: et en ce temps-là
  rationale: Conserve la seconde indication temporelle au lieu de fusionner les deux expressions.
- source_word: אַצְמִיחַ
  choice: je ferai pousser
  rationale: Le hiphil est causatif et l'expression française maintient l'image végétale.
- source_word: לְדָוִד
  choice: pour David
  rationale: Respecte la relation exprimée par ל sans expliciter indûment « la maison de David ».
- source_word: צֶמַח
  choice: Germe
  rationale: « Germe » désigne une jeune pousse et convient à l'image dynastique de Jérémie; la majuscule signale discrètement l'emploi probable comme désignation royale.
- source_word: צְדָקָה
  choice: juste
  rationale: Dans צֶמַח צְדָקָה, l'adjectif donne un français idiomatique tout en conservant la qualité morale du dirigeant annoncé.
- source_word: וְעָשָׂה
  choice: et il exercera
  rationale: Le futur découle du contexte prophétique; « exercer » s'associe naturellement au droit et à la justice.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte royal, le terme évoque l'ordre juste et son administration, sans se limiter à un jugement ponctuel.
- source_word: וּצְדָקָה
  choice: et la justice
  rationale: Conserve la paire hébraïque tout en produisant une formulation française claire et usuelle.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Le contexte de Jérémie vise vraisemblablement le territoire de Juda ou d'Israël plutôt que la terre entière.
theological_decisions:
- issue: Portée royale ou messianique de צֶמַח
  choice: Employer « Germe » avec une majuscule comme désignation probable du roi davidique promis.
  alternative: Employer « germe » avec une minuscule comme simple métaphore végétale.
  rationale: Le parallèle étroit avec Jérémie 23.5 soutient la valeur de désignation royale, tandis que la note permet de ne pas transformer cette lecture contextuelle en ajout explicite.
- issue: Valeur temporelle de וְעָשָׂה
  choice: 'Traduire au futur : « il exercera ».'
  alternative: 'Employer un passé formel : « il a exercé » ou « il exerça ».'
  rationale: La forme poursuit la promesse future introduite par « je ferai pousser »; un passé français induirait ici une chronologie trompeuse.
- issue: Rapport syntaxique dans צֶמַח צְדָקָה
  choice: Traduire « un Germe juste ».
  alternative: Traduire « un Germe de justice ».
  rationale: La construction permet une qualification attributive ou une relation nominale; le texte principal privilégie le français le plus naturel, et la note conserve l'ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « en ces jours-là et en ce temps-là » est volontairement conservée. « Germe » maintient la métaphore végétale et « exercera le droit et la justice » restitue naturellement la fonction royale.
