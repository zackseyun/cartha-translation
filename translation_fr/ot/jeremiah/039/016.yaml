  text: הָל֣וֹךְ וְ/אָמַרְתָּ֡ לְ/עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י לֵ/אמֹ֗ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֩ מבי אֶת דְּבָרַ֜/י אֶל הָ/עִ֥יר הַ/זֹּ֛את לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/הָי֥וּ לְ/פָנֶ֖י/ךָ בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/016.yaml
  text: 'Go and say to Ebed-melech the Cushite[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am bringing my words against this city for harm and not for good[b], and they will come to pass before you on that day.’'
translation:
  language: fr
  text: 'Va dire à Ébed-Mélek, le Koushite[a] : « Voici ce que dit Yahweh des armées, le Dieu d’Israël : Je fais venir mes paroles contre cette ville, pour son malheur et non pour son bien[b]. Elles se réaliseront sous tes yeux ce jour-là. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Éthiopien ». L’hébreu dit « le Koushite », c’est-à-dire un homme originaire de Koush.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour le désastre et non pour le bien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Va dire
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’ordre. « Va dire » en restitue naturellement la force en français.
- source_word: לְעֶבֶד מֶלֶךְ
  choice: à Ébed-Mélek
  rationale: Le groupe fonctionne ici comme un nom propre, transcrit avec une graphie adaptée au français.
- source_word: הַכּוּשִׁי
  choice: le Koushite
  rationale: Cette forme rend directement l’ethnonyme hébreu sans l’identifier de façon anachronique à un territoire moderne.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formulation française actuelle et digne de la formule prophétique de messager.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est transcrit, et « des armées » exprime en français courant le titre צְבָאוֹת sans le limiter explicitement aux seules armées humaines.
- source_word: הִנְנִי מֵבִיא אֶת דְּבָרַי
  choice: Je vais accomplir mes paroles
  rationale: Le participe exprime une action imminente et certaine. Avec des paroles annoncées, « accomplir » rend idiomatiquement leur mise à exécution tout en conservant le pluriel.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: contre cette ville
  rationale: Dans ce contexte de jugement, אֶל marque la direction hostile des paroles vers la ville.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: pour son malheur et non pour son bien
  rationale: רָעָה désigne ici le malheur ou le désastre, non le mal moral; le parallélisme avec « bien » est conservé.
- source_word: וְהָיוּ לְפָנֶיךָ בַּיּוֹם הַהוּא
  choice: Elles se réaliseront sous tes yeux ce jour-là
  rationale: Littéralement, les paroles « seront devant toi »; en contexte, elles deviendront réalité en présence d’Ébed-Mélek. « Sous tes yeux » préserve cet aspect visuel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription le distingue du titre אֲדֹנָי et évite de le remplacer silencieusement par un titre.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » reste proche du lexème et préserve l’idée des forces placées sous l’autorité divine, sans élargir explicitement le titre à tout l’univers.
- issue: Sens de « elles seront devant toi »
  choice: Elles se réaliseront sous tes yeux
  alternative: elles seront devant toi
  rationale: La tournure hébraïque peut être conservée littéralement, mais le contexte indique que les paroles de jugement deviendront des événements dont le destinataire sera témoin. Le rendu choisi explicite seulement cette valeur contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe prophétique reste solennelle sans archaïsmes. Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondants.
