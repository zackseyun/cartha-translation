    issue: Le verbe « accomplir » remplace « faire venir / amener » pour מֵבִיא.
    rationale: Le texte dit que Yahweh fait venir ses paroles contre la ville; « accomplir » explicite leur effet, mais ne rend pas directement l’action exprimée par le participe hébreu.
  - severity: low
    issue: La note b propose « bonheur » pour טוֹבָה.
    rationale: Dans le verset, le contraste est entre malheur/désastre et bien. « Bonheur » est plus subjectif et ne correspond pas aussi exactement au terme français retenu dans le texte.
