source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית הַ/מֶּ֨לֶךְ֙ וְ/אֶת בֵּ֣ית הָ/עָ֔ם שָׂרְפ֥וּ הַ/כַּשְׂדִּ֖ים בָּ/אֵ֑שׁ וְ/אֶת חֹמ֥וֹת יְרוּשָׁלִַ֖ם נָתָֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/008.yaml
  text: The Chaldeans burned the king’s house and the houses of the people with fire[b][a], and they tore down the walls of Jerusalem.
translation:
  language: fr
  text: Les Chaldéens[b] brûlèrent le palais royal[a] et les maisons du peuple, et ils démolirent les murailles de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison du roi ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme « Chaldéens » désigne ici les forces babyloniennes.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: le palais royal
  rationale: Littéralement « la maison du roi » ; dans ce contexte royal, l’expression désigne naturellement le palais. La traduction retenue est claire et idiomatique en français moderne, tandis que la note conserve la forme hébraïque.
- source_word: בֵּית הָעָם
  choice: les maisons du peuple
  rationale: 'Le singulier construit avec le collectif « peuple » se comprend ici distributivement : il s’agit des habitations de la population. Cette formulation n’ajoute aucune distinction sociale absente de l’hébreu.'
- source_word: שָׂרְפוּ ... בָּאֵשׁ
  choice: brûlèrent
  rationale: Le verbe exprime directement l’action de brûler. En français, ajouter « par le feu » serait redondant après « brûlèrent », sans apporter d’information au sens.
- source_word: הַכַּשְׂדִּים
  choice: Les Chaldéens
  rationale: Ce choix reproduit le terme ethnique du texte hébreu plutôt que de le remplacer par son équivalent contextuel « les Babyloniens ».
- source_word: חֹמוֹת יְרוּשָׁלִַם
  choice: les murailles de Jérusalem
  rationale: « Murailles » désigne clairement les fortifications de la ville et rend naturellement le pluriel hébreu dans ce contexte.
- source_word: נָתָצוּ
  choice: démolirent
  rationale: Le verbe hébreu désigne l’action délibérée d’abattre une construction. « Démolirent » est précis, naturel et adapté à des fortifications.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique. « Chaldéens » conserve la désignation du texte source ; le contexte les identifie aux forces babyloniennes. La répétition hébraïque « brûlèrent par le feu » n’est pas reproduite, car elle serait inutilement lourde en français.
