  text: וּ/מִן הָ/עָ֣ם הַ/דַּלִּ֗ים אֲשֶׁ֤ר אֵין לָ/הֶם֙ מְא֔וּמָה הִשְׁאִ֛יר נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים בְּ/אֶ֣רֶץ יְהוּדָ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם כְּרָמִ֥ים וִֽ/יגֵבִ֖ים בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/010.yaml
  text: But Nebuzaradan the captain of the guard left some of the poorest of the people[a], who had nothing, in the land of Judah, and on that day he gave them vineyards and fields.
translation:
  language: fr
  text: Mais Nebouzaradan, le commandant de la garde, laissa dans le pays de Juda quelques-uns des pauvres du peuple, ceux qui ne possédaient rien. Ce jour-là, il leur donna des vignobles et des champs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens du mot hébreu est incertain : on peut aussi comprendre « citernes » ou « pressoirs à vin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הָעָם הַדַּלִּים
  choice: Mais […] une partie des plus pauvres du peuple
  rationale: 'La préposition מִן a ici une valeur partitive : Nebouzaradan en laisse certains parmi les pauvres du peuple. « Mais » marque naturellement le contraste avec le sort du reste de la population.'
- source_word: אֲשֶׁר אֵין לָהֶם מְאוּמָה
  choice: ceux qui ne possédaient rien
  rationale: Cette formulation française naturelle exprime leur dénuement total tout en rattachant clairement la proposition aux personnes laissées dans le pays.
- source_word: הִשְׁאִיר
  choice: laissa
  rationale: Le hifil de שׁאר signifie ici faire rester ou laisser sur place; « laissa » convient au contexte de la déportation.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebouzaradan
  rationale: Translittération française usuelle du nom propre.
- source_word: רַב טַבָּחִים
  choice: le commandant de la garde
  rationale: Le titre désigne un haut responsable babylonien chargé de la garde; cette traduction fonctionnelle évite les littéralismes trompeurs comme « chef des exécuteurs ».
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: Rend explicitement la dimension territoriale de אֶרֶץ.
- source_word: כְּרָמִים
  choice: des vignes
  rationale: Équivalent direct et idiomatique du terme hébreu.
- source_word: וִיגֵבִים
  choice: des champs
  rationale: Le mot hébreu est rare et incertain. « Champs » convient au contexte d’une attribution de biens agricoles, mais les autres interprétations anciennes ou proposées sont signalées en note.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle française courante. Une nouvelle phrase allège la longue structure hébraïque sans modifier la relation narrative.
