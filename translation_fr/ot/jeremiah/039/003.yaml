source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ כֹּ֚ל שָׂרֵ֣י מֶֽלֶךְ בָּבֶ֔ל וַ/יֵּשְׁב֖וּ בְּ/שַׁ֣עַר הַ/תָּ֑וֶךְ נֵרְגַ֣ל שַׂר אֶ֠צֶר סַֽמְגַּר נְב֞וּ שַׂר סְכִ֣ים רַב סָרִ֗יס נֵרְגַ֤ל שַׂר אֶ֨צֶר֙ רַב מָ֔ג וְ/כָל שְׁאֵרִ֔ית שָׂרֵ֖י מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/003.yaml
  text: 'Then all the officials of the king of Babylon came in and sat in the Middle Gate: Nergal-sharezer[a], Samgar-nebu, Sarsechim the Rab-saris, Nergal-sharezer the Rab-mag[d][c][b], and all the rest of the officials of the king of Babylon.'
translation:
  language: fr
  text: 'Alors tous les hauts fonctionnaires du roi de Babylone entrèrent et s’assirent à la porte du Milieu[a] : Nergal-Saréser, Samgar-Nébou, Sarsekim, le rab-saris[b][c], Nergal-Saréser, le rab-mag[d], et tous les autres hauts fonctionnaires du roi de Babylone.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut aussi se traduire par « dans la porte du Milieu », la porte pouvant désigner un ensemble architectural où l’on pouvait siéger.
    reason: lexical_alternative
  - marker: b
    text: La suite « Samgar-Nébou, Sarsekim, le rab-saris » est difficile. On peut répartir autrement les noms et les titres, par exemple en comprenant « Samgar » comme un titre ou « Sarsekim » comme un titre ou une fonction plutôt que comme un nom de personne.
    reason: alternative_reading
  - marker: c
    text: « Rab-saris » est un titre babylonien, traditionnellement compris au sens de « chef des eunuques » ou de « haut responsable de la cour ».
    reason: cultural_note
  - marker: d
    text: « Rab-mag » est un titre babylonien qui désignait peut-être un « chef des mages » ou un haut responsable des rites.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: entrèrent
  rationale: Dans le contexte de la prise de Jérusalem, בוא indique naturellement l’entrée dans la ville. « Entrèrent » est clair et concis.
- source_word: כֹּל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: tous les hauts fonctionnaires du roi de Babylone
  rationale: שָׂרֵי désigne ici des dignitaires ou responsables de haut rang; « hauts fonctionnaires » évite de les identifier exclusivement comme princes ou chefs militaires.
- source_word: וַיֵּשְׁבוּ
  choice: s’assirent
  rationale: Le sens concret de ישׁב est conservé sans expliciter davantage la prise de position ou l’exercice de l’autorité.
- source_word: בְּשַׁעַר הַתָּוֶךְ
  choice: à la porte du Milieu
  rationale: Le français emploie naturellement « à la porte » pour situer des personnes dans l’espace de la porte. La majuscule signale qu’il s’agit vraisemblablement du nom ou de la désignation d’une porte précise.
- source_word: נֵרְגַל שַׂר אֶצֶר
  choice: Nergal-Saréser
  rationale: Translittération française usuelle et lisible de ce nom babylonien.
- source_word: סַמְגַּר נְבוּ
  choice: Samgar-Nébou
  rationale: La translittération suit la vocalisation massorétique tout en laissant ouverte la difficulté de segmentation de la suite des noms et titres.
- source_word: שַׂר סְכִים
  choice: Sarsekim
  rationale: Le texte massorétique permet de le lire comme un nom propre. La translittération évite de trancher avec excès une séquence textuellement difficile.
- source_word: רַב סָרִיס
  choice: le rab-saris
  rationale: Ce titre babylonien est translittéré afin de ne pas imposer l’équivalence incertaine « chef des eunuques »; une note en explique le sens possible.
- source_word: רַב מָג
  choice: le rab-mag
  rationale: La translittération préserve le titre ancien et évite les associations anachroniques que pourrait susciter « mage » dans le texte principal.
- source_word: וְכָל שְׁאֵרִית שָׂרֵי מֶלֶךְ בָּבֶל
  choice: ainsi que tous les autres hauts fonctionnaires du roi de Babylone
  rationale: « Tous les autres » rend naturellement שְׁאֵרִית dans cette liste de dignitaires nommés puis non nommés.
theological_decisions: []
