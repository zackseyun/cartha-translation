  variant: modern international French
source:
  edition: WLC
  text: בַּ/שָּׁנָ֣ה הַ֠/תְּשִׁעִית לְ/צִדְקִיָּ֨הוּ מֶלֶךְ יְהוּדָ֜ה בַּ/חֹ֣דֶשׁ הָ/עֲשִׂרִ֗י בָּ֠א נְבוּכַדְרֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֤ל וְ/כָל חֵיל/וֹ֙ אֶל יְר֣וּשָׁלִַ֔ם וַ/יָּצֻ֖רוּ עָלֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/001.yaml
  text: In the ninth year of Zedekiah king of Judah[a], in the tenth month, Nebuchadnezzar king of Babylon came to Jerusalem with all his army, and they laid siege to it.
translation:
  language: fr
  text: La neuvième année du règne de Sédécias, roi de Juda, au dixième mois, Nabuchodonosor[a], roi de Babylone, arriva à Jérusalem avec toute son armée, et ils l’assiégèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici la forme « Neboukadrètsar »; le nom est traditionnellement rendu « Nabuchodonosor » en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הַתְּשִׁעִית לְצִדְקִיָּהוּ
  choice: La neuvième année du règne de Sédécias
  rationale: La préposition לְ indique ici l’année du règne de Sédécias. L’ajout explicatif « du règne de » donne en français naturel le sens de la formule chronologique hébraïque.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rendu direct du groupe nominal hébreu désignant le titre royal.
- source_word: בַּחֹדֶשׁ הָעֲשִׂרִי
  choice: au dixième mois
  rationale: Formulation chronologique courante qui conserve l’absence, dans le texte, du nom du mois.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor[a]
  rationale: « Nabuchodonosor » est la forme française traditionnelle et immédiatement reconnaissable; la forme plus proche de l’hébreu est signalée en note.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rendu français direct du titre royal.
- source_word: בָּא
  choice: arriva
  rationale: Le verbe בוא signifie venir ou arriver. « Arriva » convient au récit et n’ajoute pas au verbe lui-même une nuance militaire déjà rendue par le contexte.
- source_word: וְכָל חֵילוֹ
  choice: avec toute son armée
  rationale: Dans ce contexte militaire, חַיִל désigne l’armée ou les forces armées; « avec » exprime naturellement l’accompagnement marqué par la coordination hébraïque.
- source_word: אֶל יְרוּשָׁלִַם
  choice: à Jérusalem
  rationale: אֶל indique fondamentalement le mouvement vers un lieu. L’action hostile est précisée par le verbe suivant, sans qu’il soit nécessaire de la charger dans la préposition.
- source_word: וַיָּצֻרוּ עָלֶיהָ
  choice: et ils l’assiégèrent
  rationale: Le verbe צור signifie ici assiéger. Le pluriel renvoie naturellement au roi et à son armée, tandis que le pronom féminin hébreu désigne Jérusalem.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formule « du règne de » explicite l’usage chronologique hébreu sans modifier l’information. Le changement du singulier « arriva » au pluriel « ils l’assiégèrent » est conservé.
