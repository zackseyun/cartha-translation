  text: וַ/יִּרְדְּפ֨וּ חֵיל כַּשְׂדִּ֜ים אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֣גוּ אֶת צִדְקִיָּהוּ֮ בְּ/עַֽרְב֣וֹת יְרֵחוֹ֒ וַ/יִּקְח֣וּ אֹת֗/וֹ וַֽ֠/יַּעֲלֻ/הוּ אֶל נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל רִבְלָ֖תָ/ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יְדַבֵּ֥ר אִתּ֖/וֹ מִשְׁפָּטִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/005.yaml
  text: But the army of the Chaldeans pursued them and overtook Zedekiah in the plains of Jericho. They seized him and brought him up to Nebuchadnezzar king of Babylon at Riblah[a], in the land of Hamath, and he passed sentence on him.
translation:
  language: fr
  text: Mais l’armée des Chaldéens les poursuivit et rattrapa Sédécias dans les plaines de Jéricho. Ils le saisirent et le conduisirent auprès de Nabuchodonosor[a], roi de Babylone, à Ribla, dans le pays de Hamath. Nabuchodonosor prononça alors des jugements contre lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici une forme du nom correspondant plus exactement à « Nabuchodrétsar » ; « Nabuchodonosor », forme française courante, est employé dans le texte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « parla avec lui des jugements » ; l’expression peut aussi se rendre par « prononça sa sentence contre lui ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: l’armée des Chaldéens
  rationale: חֵיל désigne ici une force militaire, et כַּשְׂדִּים est conservé par « Chaldéens », terme ethnique et politique plus proche de l’hébreu que « Babyloniens ».
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵיהֶם
  choice: les poursuivit
  rationale: Le verbe רדף avec אַחֲרֵי exprime directement la poursuite. Le singulier français s’accorde avec le nom collectif « l’armée ».
- source_word: וַיַּשִּׂגוּ
  choice: rattrapa
  rationale: Dans le contexte d’une fuite, נשׂג signifie rejoindre ou rattraper les fugitifs. « Rattrapa » est naturel et précis en français actuel.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: dans les plaines de Jéricho
  rationale: עֲרָבוֹת désigne les plaines ou steppes de la vallée du Jourdain. « Plaines » est clair et non technique.
- source_word: וַיִּקְחוּ אֹתוֹ
  choice: Ils le saisirent
  rationale: Bien que לקח signifie littéralement « prendre », le contexte militaire de capture justifie « saisirent » sans ajouter d’idée étrangère.
- source_word: וַיַּעֲלֻהוּ אֶל
  choice: le conduisirent auprès de
  rationale: עלה peut marquer un déplacement vers un lieu plus élevé. En français, « conduisirent auprès de » rend naturellement le transfert du prisonnier sans imposer une formulation géographique lourde.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: « Nabuchodonosor » est la forme française traditionnelle et immédiatement reconnaissable du nom. La forme plus proche de la graphie hébraïque du verset est signalée en note.
- source_word: רִבְלָתָה
  choice: à Ribla
  rationale: La terminaison directive ou locative est naturellement rendue par la préposition « à »; « Ribla » est la forme française courante du toponyme.
- source_word: בְּאֶרֶץ חֲמָת
  choice: dans le pays de Hamath
  rationale: אֶרֶץ signifie ici « pays » ou « territoire ». « Pays de Hamath » conserve la désignation géographique de manière naturelle.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: Celui-ci prononça alors des jugements contre lui
  rationale: La formulation conserve le pluriel מִשְׁפָּטִים et sa portée judiciaire. « Celui-ci » clarifie que le sujet est Nabuchodonosor, tandis que la note préserve l’expression hébraïque inhabituelle et l’équivalent idiomatique possible.
theological_decisions:
- issue: Portée de וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: prononça alors des jugements contre lui
  alternative: prononça sa sentence contre lui
  rationale: Le contexte indique une décision judiciaire, mais le texte hébreu emploie le pluriel « jugements » et une construction littéralement proche de « parler des jugements avec lui ». Le texte principal conserve cette pluralité sans déterminer davantage la nature ou le nombre des condamnations.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique. Les pronoms pluriels après « l’armée » reflètent le passage de la force collective aux soldats qui saisissent Sédécias; « Celui-ci » évite ensuite toute ambiguïté sur l’auteur des jugements.
