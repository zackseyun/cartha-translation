  terminology: « Chaldéens », « Sédécias », « Nabuchodonosor », « Ribla » et « Hamath » sont appropriés au français biblique international contemporain. La note sur la forme hébraïque du nom est pertinente. La note sur l’idiome judiciaire conserve l’ambiguïté formelle sans imposer une interprétation doctrinale.
