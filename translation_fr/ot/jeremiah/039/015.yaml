  text: וְ/אֶֽל יִרְמְיָ֖הוּ הָיָ֣ה דְבַר יְהוָ֑ה בִּֽ/הְיֹת֣/וֹ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/015.yaml
  text: The word of Yahweh had come to Jeremiah while he was confined in the court of the guard[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh était venue à Jérémie pendant qu’il était détenu dans la cour du corps de garde[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la cour de la garde ».
    reason: Formulation plus littérale de l’expression hébraïque חֲצַר הַמַּטָּרָה; « corps de garde » explicite idiomatiquement en français le lieu associé à la garde.
lexical_decisions:
- source_word: וְ/אֶל יִרְמְיָהוּ
  choice: à Jérémie
  rationale: Le français place naturellement le destinataire après le verbe. La conjonction initiale assure la continuité narrative sans exiger ici un « et » explicite.
- source_word: הָיָה דְבַר יְהוָה
  choice: La parole de Yahweh était venue
  rationale: « La parole de Yahweh » conserve la formule prophétique. Le plus-que-parfait marque que cette révélation avait eu lieu dans la situation de détention rappelée rétrospectivement.
- source_word: בִּ/הְיֹת/וֹ עָצוּר
  choice: pendant qu’il était détenu
  rationale: La construction infinitive exprime une circonstance temporelle continue. « Détenu » rend la privation de liberté sans préciser excessivement son statut juridique.
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: dans la cour de la garde
  rationale: Cette expression désigne la cour associée au corps de garde, où Jérémie était maintenu sous surveillance.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles divines qui suivent et évitent le calque peu idiomatique « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin; sa translittération préserve son caractère de nom propre sans le remplacer par un titre.
- issue: Valeur temporelle de הָיָה dans la formule prophétique
  choice: était venue
  alternative: vint
  rationale: Le plus-que-parfait convient à la reprise rétrospective de cette révélation, tandis que le passé simple reste grammaticalement possible si l’on lit la notice comme une simple progression narrative.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la tournure prophétique tout en employant une ponctuation française naturelle pour introduire la suite du discours.
