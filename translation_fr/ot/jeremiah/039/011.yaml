id: JER.39.11
reference: Jeremiah 39:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְצַ֛ו נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַֽל יִרְמְיָ֑הוּ בְּ/יַ֛ד נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/011.yaml
  text: Nebuchadnezzar king of Babylon gave orders concerning Jeremiah through Nebuzaradan[a], the captain of the guard, saying,
translation:
  language: fr
  text: 'Nabuchodonosor, roi de Babylone, donna des ordres au sujet de Jérémie par l’intermédiaire de Nebouzaradan, chef de la garde[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef des exécuteurs » ; littéralement « chef des tueurs » ou « chef des bouchers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna des ordres
  rationale: Le verbe צוה exprime ici l’action de commander. « Donna des ordres » est naturel en français et introduit adéquatement le contenu de l’ordre au verset suivant.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et largement reconnue du nom royal, même si la graphie hébraïque de ce verset correspond plus directement à « Nabuchodrétsar ».
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rend directement la chaîne construite qui indique le titre et le royaume de Nabuchodonosor.
- source_word: עַל יִרְמְיָהוּ
  choice: au sujet de Jérémie
  rationale: Avec צוה, la préposition עַל désigne ici la personne concernée par les instructions, et non leur destinataire direct.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression idiomatique indique l’agent ou le médiateur par lequel l’ordre est transmis.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebouzaradan
  rationale: Translittération française claire et usuelle du nom propre.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Dans le contexte royal et militaire, ce titre désigne le haut responsable de la garde ou des exécuteurs du roi. La valeur plus littérale est signalée en note.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif quotatif introduit le contenu de l’ordre donné au verset suivant. En français moderne, les deux-points rendent naturellement cette fonction sans ajouter un « en disant » pesant.
