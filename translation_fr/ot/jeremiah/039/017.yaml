  text: וְ/הִצַּלְתִּ֥י/ךָ בַ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ בְּ/יַ֣ד הָֽ/אֲנָשִׁ֔ים אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/017.yaml
  text: But I will deliver you on that day[a], declares Yahweh[b], and you will not be given into the hand of the men of whom you are afraid.
translation:
  language: fr
  text: Mais ce jour-là, je te délivrerai[a], déclare Yahweh, et tu ne seras pas livré aux mains des hommes que tu redoutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je te sauverai » ou « je te secourrai ». Le verbe hébreu désigne ici le fait d’arracher quelqu’un à un danger.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: Mais… je te délivrerai
  rationale: Le hiphil de נצל exprime ici l’action d’arracher quelqu’un à un danger. « Délivrer » conserve ce sens concret sans lui imposer une portée sotériologique. La conjonction est rendue par « Mais » en raison du contraste contextuel.
- source_word: בַיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle française naturelle correspondant directement à l’hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » rend dignement la formule prophétique נְאֻם, tandis que le nom divin est translittéré « Yahweh ».
- source_word: וְלֹא תִנָּתֵן
  choice: et tu ne seras pas livré
  rationale: Le niphal de נתן est passif. Dans ce contexte hostile, « être livré » est plus idiomatique en français que « être donné ».
- source_word: בְּיַד הָאֲנָשִׁים
  choice: aux mains des hommes
  rationale: Le pluriel français « aux mains de » conserve l’image hébraïque tout en exprimant naturellement le fait de tomber sous le pouvoir de quelqu’un.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: que tu redoutes
  rationale: גור avec מִפְּנֵי exprime ici la crainte éprouvée devant ces hommes. « Redouter » restitue le caractère intense de cette peur de façon concise et naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « livré aux mains » conserve l’image concrète de l’hébreu sans lourdeur. Le placement de « ce jour-là » suit un ordre français naturel.
