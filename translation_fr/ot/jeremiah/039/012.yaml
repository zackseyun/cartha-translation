  text: קָחֶ֗/נּוּ וְ/עֵינֶ֨י/ךָ֙ שִׂ֣ים עָלָ֔י/ו וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֣וּמָה רָּ֑ע כִּ֗י אם כַּֽ/אֲשֶׁר֙ יְדַבֵּ֣ר אֵלֶ֔י/ךָ כֵּ֖ן עֲשֵׂ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/012.yaml
  text: Take him, keep your eyes on him, and do him no harm; rather, do with him just as he speaks to you.
translation:
  language: fr
  text: Prends-le, veille sur lui et ne lui fais aucun mal ; mais fais avec lui comme il te dira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָחֶנּוּ
  choice: Prends-le
  rationale: Rend directement l’impératif « prends-le », dans le contexte d’une prise en charge plutôt que d’une capture.
- source_word: וְעֵינֶיךָ שִׂים עָלָיו
  choice: veille sur lui
  rationale: L’expression idiomatique « pose tes yeux sur lui » demande ici une surveillance attentive et bienveillante; « veille sur lui » est naturel en français.
- source_word: וְאַל תַּעַשׂ לוֹ מְאוּמָה רָע
  choice: ne lui fais aucun mal
  rationale: Reproduit clairement la négation absolue et le sens de רָע dans cette construction.
- source_word: כַּאֲשֶׁר יְדַבֵּר אֵלֶיךָ
  choice: comme il te le demandera
  rationale: דבר אל peut littéralement signifier « parler à », mais dans cet ordre donné au sujet de Jérémie, la parole attendue exprime ce qu’il demandera qu’on fasse pour lui.
- source_word: כֵּן עֲשֵׂה עִמּוֹ
  choice: agis envers lui
  rationale: Rend עשה עם de façon idiomatique tout en conservant l’idée de traiter Jérémie conformément à sa parole.
theological_decisions:
- issue: Nature de l’attention portée à Jérémie
  choice: veille sur lui
  alternative: garde les yeux sur lui
  rationale: Le contexte indique une protection attentive, sans ajouter de contenu doctrinal; la formulation retenue évite en français l’éventuelle nuance soupçonneuse de « garder les yeux sur ».
- issue: Force logique de כִּי אִם
  choice: Au contraire
  alternative: mais plutôt
  rationale: La locution oppose l’interdiction de lui faire du mal à l’ordre positif d’accéder à sa parole; « Au contraire » exprime cette correction sans surinterprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe impérative reste concise. Aucun marqueur de note n’est requis.
