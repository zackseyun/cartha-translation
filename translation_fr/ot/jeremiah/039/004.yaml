  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר רָ֠אָ/ם צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כֹ֣ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַֽ֠/יִּבְרְחוּ וַ/יֵּצְא֨וּ לַ֤יְלָה מִן הָ/עִיר֙ דֶּ֚רֶךְ גַּ֣ן הַ/מֶּ֔לֶךְ בְּ/שַׁ֖עַר בֵּ֣ין הַ/חֹמֹתָ֑יִם וַ/יֵּצֵ֖א דֶּ֥רֶךְ הָ/עֲרָבָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/004.yaml
  text: And when Zedekiah king of Judah and all the men of war saw them[a], they fled and went out by night from the city by way of the king’s garden, through the gate between the two walls[b]; and he went out by way of the Arabah.
translation:
  language: fr
  text: Lorsque Sédécias, roi de Juda, et tous les hommes de guerre les virent, ils s’enfuirent et sortirent de la ville, de nuit, en empruntant le chemin du jardin du roi, par la porte entre les deux murailles. Puis il sortit[a] par le chemin de l’Araba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici « il sortit », au singulier, bien que certaines traductions emploient « ils sortirent » pour harmoniser cette proposition avec les verbes précédents au pluriel.
    reason: Changement grammatical de nombre conservé dans la traduction.
  - marker: b
    text: Ou « la plaine » ou « la vallée du Jourdain ».
    reason: Autres traductions possibles du terme géographique עֲרָבָה.
lexical_decisions:
- source_word: רָאָם
  choice: les virent
  rationale: Le suffixe pronominal masculin pluriel attaché au verbe signifie « les » et renvoie naturellement, dans le contexte, aux forces babyloniennes mentionnées auparavant.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les hommes de guerre
  rationale: Cette formulation conserve la structure et le sens militaire de l’hébreu tout en restant compréhensible dans un registre narratif digne.
- source_word: וַיִּבְרְחוּ
  choice: ils s’enfuirent
  rationale: Rend directement le mouvement de fuite exprimé par ברח et convient au rythme du récit.
- source_word: וַיֵּצְאוּ לַיְלָה
  choice: sortirent de nuit
  rationale: Reproduit de manière concise l’idiome hébreu et son indication temporelle.
- source_word: דֶּרֶךְ גַּן הַמֶּלֶךְ
  choice: par le chemin du jardin du roi
  rationale: דֶּרֶךְ indique ici l’itinéraire suivi sans préciser de façon certaine s’il traversait le jardin ou le longeait.
- source_word: בְּשַׁעַר בֵּין הַחֹמֹתָיִם
  choice: en passant par la porte entre les deux murailles
  rationale: Le duel חֹמֹתַיִם est explicitement rendu par « les deux murailles », et la tournure française exprime clairement le passage par la porte.
- source_word: וַיֵּצֵא
  choice: Puis il sortit
  rationale: Le verbe du texte massorétique est au singulier. La traduction conserve ce changement de nombre au lieu de l’harmoniser avec les verbes pluriels précédents.
- source_word: הָעֲרָבָה
  choice: l’Araba
  rationale: Dans ce contexte géographique, le terme désigne vraisemblablement la région de l’Araba; la translittération évite de réduire indûment le nom à une simple « plaine ».
