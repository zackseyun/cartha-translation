  to: Lorsque Sédécias, roi de Juda, et tous les hommes de guerre les virent, ils s’enfuirent et sortirent de la ville, de nuit, en empruntant le chemin du jardin du roi, par la porte entre les deux murailles. Puis il sortit[a] par le chemin de l’Araba[b].
  rationale: La révision conserve la structure narrative et l’ambiguïté référentielle du singulier final, tout en rendant explicitement la valeur routière de דֶּרֶךְ dans « par le chemin de l’Araba ». Elle améliore également la fluidité de la première indication d’itinéraire sans ajouter de détail topographique.
