base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/014.yaml
  text: So they sent and took Jeremiah from the court of the guard, and they entrusted him to Gedaliah son of Ahikam, son of Shaphan, to bring him home. So he lived among the people.
translation:
  language: fr
  text: Ils envoyèrent donc prendre Jérémie dans la cour de la garde et le confièrent à Guedalia, fils d’Ahiqam, fils de Shafan, afin qu’il le fasse sortir et le conduise à la maison[a]. Jérémie demeura ainsi au milieu du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour le faire sortir vers la maison ». Le texte hébreu ne précise pas de quelle maison il s’agit.'
    reason: Signaler à la fois le mouvement de sortie exprimé par le verbe hébreu et l’ambiguïté réelle de l’expression « la maison », sans imposer un propriétaire.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְחוּ
  choice: Ils envoyèrent donc prendre
  rationale: Cette formulation française naturelle conserve la succession des deux verbes hébreux, « envoyer » et « prendre », sans suggérer inutilement la violence.
- source_word: חֲצַר הַמַּטָּרָה
  choice: la cour de la garde
  rationale: Rend directement l’expression désignant la cour servant de lieu de détention ou placée sous garde.
- source_word: וַיִּתְּנוּ אֹתוֹ אֶל
  choice: le confièrent à
  rationale: Dans ce contexte, le verbe « donner » suivi de la personne à qui Jérémie est remis exprime une prise en charge; « confier » est idiomatique sans ajouter une idée doctrinale.
- source_word: לְהוֹצִיאֵהוּ אֶל הַבָּיִת
  choice: afin qu’il le conduise à la maison
  rationale: Formulation lisible qui garde l’expression définie « la maison » et évite de préciser sans certitude à qui elle appartient.
- source_word: וַיֵּשֶׁב בְּתוֹךְ הָעָם
  choice: Jérémie demeura ainsi au milieu du peuple
  rationale: « Demeurer » reflète le verbe ישׁב dans son sens résidentiel, et la répétition du nom clarifie en français le sujet du verbe.
theological_decisions:
- issue: Identification de « la maison »
  choice: à la maison[a]
  alternative: chez lui / dans sa maison
  rationale: L’hébreu dit littéralement « vers la maison » sans identifier explicitement son propriétaire. Le texte principal et la note préservent cette indétermination au lieu de décider qu’il s’agit nécessairement de la maison de Jérémie ou de celle de Guedalia.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes françaises courantes. La syntaxe reste proche de l’enchaînement hébreu tout en étant naturelle pour un lectorat contemporain.
