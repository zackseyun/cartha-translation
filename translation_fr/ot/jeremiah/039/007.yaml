  text: וְ/אֶת עֵינֵ֥י צִדְקִיָּ֖הוּ עִוֵּ֑ר וַ/יַּאַסְרֵ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם לָ/בִ֥יא אֹת֖/וֹ בָּבֶֽלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/007.yaml
  text: He blinded Zedekiah’s eyes and bound him with bronze shackles to bring him to Babylon[a].
translation:
  language: fr
  text: Il aveugla Sédécias et le lia avec des entraves de bronze pour l’emmener à Babylone[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des chaînes de bronze » ou « avec des fers de bronze ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ
  choice: les yeux à Sédécias
  rationale: Le groupe construit désigne concrètement les yeux de Sédécias. Après « faire crever », la tournure avec « à » est naturelle en français moderne et évite une formulation possessive lourde.
- source_word: עִוֵּר
  choice: fit crever les yeux
  rationale: Le verbe signifie rendre aveugle. Dans ce contexte de violence judiciaire, cette expression française directe et idiomatique rend l’action concrète sans ajouter de détail sur la méthode.
- source_word: וַיַּאַסְרֵהוּ
  choice: le fit attacher
  rationale: Le verbe אסר signifie attacher ou lier. La construction causative française maintient naturellement le même sujet que l’action précédente, tout en exprimant l’immobilisation physique précisée par les entraves.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: avec des entraves de bronze
  rationale: Le terme désigne des liens ou instruments de contention en bronze. « Entraves » est précis, compréhensible et assez large pour ne pas trancher indûment entre chaînes et fers.
- source_word: לָבִיא אֹתוֹ
  choice: pour l’emmener
  rationale: L’infinitif exprime ici le but. « Pour l’emmener » est naturel puisque le déplacement est envisagé depuis le lieu de la scène vers Babylone.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le hé directionnel marque un mouvement vers Babylone, rendu normalement en français par « à Babylone » après « emmener ».
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve la violence concrète du texte sans amplification, et la note maintient l’étendue lexicale du terme désignant les liens de bronze.
