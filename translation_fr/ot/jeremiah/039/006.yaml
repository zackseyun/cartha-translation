  rationale: La révision remplace un terme qui impose une modalité précise de mise à mort par un terme français violent mais non anatomiquement spécifique, et explicite le référent du pronom hébreu. La répétition de « le roi de Babylone », la force de la scène et l’alternative lexicale pour « notables » sont conservées.
