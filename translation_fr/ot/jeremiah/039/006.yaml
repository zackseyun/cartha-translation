  text: וַ/יִּשְׁחַט֩ מֶ֨לֶךְ בָּבֶ֜ל אֶת בְּנֵ֧י צִדְקִיָּ֛הוּ בְּ/רִבְלָ֖ה לְ/עֵינָ֑י/ו וְ/אֵת֙ כָּל חֹרֵ֣י יְהוּדָ֔ה שָׁחַ֖ט מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/006.yaml
  text: The king of Babylon slaughtered the sons of Zedekiah at Riblah before his eyes[a], and the king of Babylon slaughtered all the nobles of Judah.
translation:
  language: fr
  text: Le roi de Babylone massacra les fils de Sédécias à Ribla, sous les yeux de Sédécias, et le roi de Babylone massacra tous les notables de Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsables de Juda ».
    reason: Alternative lexicale possible pour חֹרֵי יְהוּדָה, qui peut désigner des hommes de haut rang ou des dirigeants.
lexical_decisions:
- source_word: וַיִּשְׁחַט / שָׁחַט
  choice: égorgea
  rationale: Le verbe désigne un abattage ou une mise à mort violente. « Égorgea » conserve ici la brutalité de la scène, contrairement au plus neutre « tua ».
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction directe du groupe construit. La répétition est maintenue comme dans l’hébreu, plutôt que de remplacer la seconde occurrence par un pronom.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: les fils de Sédécias
  rationale: « Fils » rend directement la référence masculine de בְּנֵי.
- source_word: בְּרִבְלָה
  choice: à Ribla
  rationale: La préposition « à » convient naturellement en français pour situer l’exécution dans cette ville.
- source_word: לְעֵינָיו
  choice: sous ses yeux
  rationale: Cette expression idiomatique indique avec force que Sédécias fut témoin de la mise à mort.
- source_word: כָּל
  choice: tous
  rationale: « Tous » convient au groupe collectif désigné et préserve la portée globale du terme hébreu.
- source_word: חֹרֵי יְהוּדָה
  choice: les notables de Juda
  rationale: Dans ce contexte, חֹרִים désigne les hommes de haut rang de Juda. « Notables » exprime naturellement leur statut social et politique, tout en laissant « responsables » comme possibilité contextuelle.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française habituelle du nom territorial et politique.
