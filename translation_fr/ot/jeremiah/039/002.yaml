base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/002.yaml
  text: In the eleventh year of Zedekiah[a], in the fourth month, on the ninth day of the month, the city was breached.
translation:
  language: fr
  text: Dans la onzième année du règne de Sédécias, au quatrième mois, le neuvième jour du mois, une brèche fut ouverte dans la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: dans la onzième année
  rationale: La préposition ב introduit le cadre temporel. Cette formulation française restitue clairement l’année de règne indiquée par le contexte.
- source_word: לְ/צִדְקִיָּהוּ
  choice: du règne de Sédécias
  rationale: Le ל rattache l’année à Sédécias. L’ajout explicatif « du règne » exprime naturellement en français la datation royale implicite sans modifier le sens.
- source_word: בַּ/חֹדֶשׁ הָ/רְבִיעִי
  choice: au quatrième mois
  rationale: La désignation ordinale du mois est conservée, sans la convertir en mois du calendrier moderne.
- source_word: בְּ/תִשְׁעָה לַ/חֹדֶשׁ
  choice: le neuvième jour du mois
  rationale: Le mot « jour », implicite dans l’idiome hébreu, est exprimé pour obtenir un français clair et naturel.
- source_word: הָבְקְעָה
  choice: une brèche fut ouverte dans
  rationale: Le nifal de בקע décrit l’ouverture d’une brèche dans les défenses. La formulation française rend clairement le sens militaire tout en conservant la voix passive.
- source_word: הָ/עִיר
  choice: la ville
  rationale: Le nom défini est traduit littéralement; Jérusalem est identifiable par le contexte et n’a pas besoin d’être explicitée ici.
