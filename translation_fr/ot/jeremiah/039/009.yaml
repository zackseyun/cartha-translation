source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֣ר נָפְל֣וּ עָלָ֔י/ו וְ/אֵ֛ת יֶ֥תֶר הָ/עָ֖ם הַ/נִּשְׁאָרִ֑ים הֶגְלָ֛ה נְבֽוּזַר אֲדָ֥ן רַב טַבָּחִ֖ים בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/009.yaml
  text: As for the rest of the people who remained in the city[a], and the deserters who had gone over to him, together with the rest of the people who remained, Nebuzaradan, the captain of the guard[c][b], carried away to Babylon.
translation:
  language: fr
  text: Quant au reste du peuple qui était demeuré dans la ville, à ceux qui s’étaient ralliés à lui[a], ainsi qu’au reste du peuple qui était demeuré[b], Nebouzaradan, chef de la garde[c], les déporta à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie littéralement l’expression « ceux qui étaient tombés à lui », avec répétition du verbe « tomber ». Dans ce contexte militaire, cette expression signifie passer dans le camp adverse ou se rallier à quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu répète « le reste du peuple qui était demeuré ». Cette répétition a été conservée.
    reason: textual_form
  - marker: c
    text: Le titre rendu par « chef de la garde » est littéralement apparenté à l’expression « chef des égorgeurs ». Il désignait un haut responsable royal et militaire babylonien.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: le reste du peuple
  rationale: Cette expression rend directement l’idée de ce qui reste d’un groupe et demeure naturelle en français moderne.
- source_word: הַנִּשְׁאָרִים
  choice: qui était demeuré
  rationale: Le participe nifal désigne ceux qui étaient restés. Le singulier collectif s’accorde naturellement avec « le reste du peuple » sans préciser qu’il s’agit nécessairement de survivants.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Traduction locative simple et précise.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עָלָיו
  choice: ceux qui s’étaient ralliés à lui
  rationale: Dans un contexte militaire, l’expression idiomatique signifie passer dans le camp de quelqu’un. « Se rallier à » est clair et digne, tandis que « lui » préserve le référent implicite du texte hébreu.
- source_word: וְאֵת יֶתֶר הָעָם הַנִּשְׁאָרִים
  choice: ainsi qu’au reste du peuple qui était demeuré
  rationale: La formulation conserve la répétition présente dans l’hébreu au lieu de fusionner les deux groupes.
- source_word: הֶגְלָה
  choice: les déporta
  rationale: Le hifil de גלה exprime l’action forcée d’emmener en exil. « Déporta » est concis, intelligible et convient au contexte historique; le pronom « les » reprend en français les objets antéposés.
- source_word: נְבוּזַר אֲדָן
  choice: Nebouzaradan
  rationale: Translittération française usuelle du nom propre.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Il s’agit d’un titre officiel royal et militaire. Cette traduction fonctionnelle évite le contresens que produirait une traduction littérale comme « chef des égorgeurs ».
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française courante du nom de lieu.
theological_decisions:
- issue: Référent du pronom dans עָלָיו (« à lui »)
  choice: Conserver « à lui » sans identifier explicitement la personne.
  alternative: « aux Babyloniens » ou « au roi de Babylone »
  rationale: Le référent se déduit du contexte narratif, mais il n’est pas nommé dans ce verset. L’expliciter lèverait une ambiguïté grammaticale réelle du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’antéposition des groupes concernés et la répétition de l’hébreu, tout en employant « les » devant « déporta » pour assurer une syntaxe française naturelle.
