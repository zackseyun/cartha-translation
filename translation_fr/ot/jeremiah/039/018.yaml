  text: כִּ֤י מַלֵּט֙ אֲמַלֶּטְ/ךָ֔ וּ/בַ/חֶ֖רֶב לֹ֣א תִפֹּ֑ל וְ/הָיְתָ֨ה לְ/ךָ֤ נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל כִּֽי בָטַ֥חְתָּ בִּ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/018.yaml
  text: For I will surely rescue you[a], and you will not fall by the sword. Your life will be yours as plunder, because you have trusted in me[b], declares Yahweh.
translation:
  language: fr
  text: 'Car je te délivrerai assurément[a] : tu ne tomberas pas par l’épée. Ta vie sera ton butin[b], parce que tu as mis ta confiance en moi, déclare Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce ici le verbe par un infinitif absolu : « je te délivrerai certainement » ou « je ne manquerai pas de te délivrer ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ta vie sera pour toi comme un butin ». Cette image guerrière signifie que tu échapperas au danger en conservant la vie.'
    reason: cultural_note
lexical_decisions:
- source_word: מַלֵּט אֲמַלֶּטְךָ
  choice: oui, je te délivrerai
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la promesse. « Oui » restitue cette insistance dans un français naturel, tandis que « délivrer » convient au sauvetage physique immédiat.
- source_word: וּבַחֶרֶב לֹא תִפֹּל
  choice: et tu ne tomberas pas sous l’épée
  rationale: Le verbe נפל signifie littéralement « tomber » et désigne ici le fait d’être abattu à la guerre. Cette formulation conserve l’image hébraïque tout en restant intelligible.
- source_word: וְהָיְתָה לְךָ נַפְשְׁךָ לְשָׁלָל
  choice: Tu auras ta vie pour butin
  rationale: Cette tournure récurrente chez Jérémie signifie que la personne échappera au danger avec sa seule vie, comme un butin remporté au milieu de la guerre. La traduction préserve cette métaphore.
- source_word: נַפְשְׁךָ
  choice: ta vie
  rationale: Dans ce contexte de survie, נֶפֶשׁ désigne la vie de la personne et non spécifiquement une âme immatérielle.
- source_word: לְשָׁלָל
  choice: pour butin
  rationale: « Butin » conserve la métaphore guerrière et s’intègre naturellement à l’expression française « avoir sa vie pour butin ».
- source_word: כִּי בָטַחְתָּ בִּי
  choice: parce que tu as mis ta confiance en moi
  rationale: בטח exprime une confiance fondée sur l’appui et la sécurité. Le passé composé présente cette confiance déjà manifestée comme le motif de la promesse.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: נְאֻם introduit une déclaration prophétique solennelle. La formulation demeure naturelle en français et le nom divin est rendu directement par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Sens de נֶפֶשׁ dans l’expression « ta נֶפֶשׁ pour butin »
  choice: vie
  alternative: âme
  rationale: La promesse concerne la survie physique au milieu d’un désastre militaire. « Vie » rend le sens contextuel sans introduire une affirmation anthropologique étrangère au passage.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement reflète l’adresse individuelle masculine du texte hébreu. La métaphore guerrière et l’insistance verbale sont conservées, avec des notes explicatives brèves.
