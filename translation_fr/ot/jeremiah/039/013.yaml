  text: וַ/יִּשְׁלַ֞ח נְבֽוּזַרְאֲדָ֣ן רַב טַבָּחִ֗ים וּ/נְבֽוּשַׁזְבָּ רַב סָרִ֔יס וְ/נֵרְגַ֥ל שַׂר אֶ֖צֶר רַב מָ֑ג וְ/כֹ֖ל רַבֵּ֥י מֶֽלֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/013.yaml
  text: Nebuzaradan the captain of the guard[a], Nebushazban the chief officer, Nergal-sharezer the chief magus[c][b], and all the chief officials of the king of Babylon sent word.
translation:
  language: fr
  text: Puis Nebouzaradan, chef de la garde, Neboushazban, haut fonctionnaire[b], Nergal-Sarétsèr, chef des mages[c], ainsi que tous les hauts fonctionnaires du roi de Babylone, envoyèrent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est au singulier, littéralement « il envoya », bien que plusieurs dignitaires soient énumérés. Son objet n’est pas exprimé; le verset suivant poursuit l’action commencée.
    reason: textual_note
  - marker: b
    text: Le titre peut aussi être rendu par « chef des eunuques » ou « haut dignitaire de la cour ».
    reason: lexical_alternative
  - marker: c
    text: « Chef des mages » traduit un titre de la cour babylonienne, traditionnellement transcrit « Rab-Mag ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoyèrent
  rationale: Le verbe שׁלח signifie simplement « envoyer ». L’objet reste sous-entendu en hébreu et l’action se poursuit au verset suivant ; conserver cette ellipse évite de préciser sans preuve s’il s’agit d’hommes, d’un ordre ou d’un message.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Ce titre de cour d’arrière-plan akkadien désigne le commandant de la garde royale, plutôt qu’un « chef des bouchers » au sens littéral.
- source_word: רַב סָרִיס
  choice: haut fonctionnaire
  rationale: סָרִיס peut désigner un eunuque ou, plus largement, un dignitaire de la cour. « Haut fonctionnaire » exprime le rang sans trancher une incertitude concernant le statut physique du personnage.
- source_word: נְבוּשַׁזְבָּ
  choice: Neboushazban
  rationale: Translittération française du nom propre hébreu.
- source_word: וְנֵרְגַל שַׂר אֶצֶר
  choice: Nergal-Sarétsèr
  rationale: Le groupe constitue un nom propre d’origine akkadienne ; la forme choisie suit une translittération française lisible.
- source_word: רַב מָג
  choice: chef des mages
  rationale: Ce titre babylonien est rendu par son sens probable plutôt que conservé sous la forme non traduite « Rab-Mag ».
- source_word: וְכֹל רַבֵּי מֶלֶךְ בָּבֶל
  choice: ainsi que tous les hauts fonctionnaires du roi de Babylone
  rationale: רַבֵּי désigne ici les principaux dignitaires ou responsables de la cour, et non nécessairement des princes de sang royal.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La longue énumération administrative de l’hébreu est conservée, tandis que « ainsi que » clarifie naturellement le dernier élément. L’ellipse finale est volontaire afin de respecter la syntaxe et l’enchaînement avec le verset suivant.
