base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/022.yaml
  text: And with you I will shatter man and woman; and with you I will shatter old man and youth; and with you I will shatter young man and virgin.
translation:
  language: fr
  text: Avec toi, je fracasserai l’homme et la femme ; avec toi, je fracasserai le vieillard et le jeune ; avec toi, je fracasserai le jeune homme et la vierge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּי בְךָ
  choice: Par toi, je fracasserai
  rationale: Le verbe נפץ exprime une action violente de mise en pièces ; « fracasser » en conserve la force. בְךָ désigne ici l’instrument employé, d’où « par toi ».
- source_word: אִישׁ וְאִשָּׁה
  choice: l’homme et la femme
  rationale: Traduction directe du couple de termes, qui présente deux catégories humaines complémentaires.
- source_word: זָקֵן וָנָעַר
  choice: le vieillard et le jeune
  rationale: זקן désigne l’homme âgé. נער est volontairement rendu par le substantif large « le jeune », sans le confondre avec בחור dans le membre suivant.
- source_word: בָּחוּר וּבְתוּלָה
  choice: le jeune homme et la jeune fille
  rationale: בחור désigne typiquement un homme dans la vigueur de la jeunesse ; בתולה une jeune femme non mariée, souvent avec la nuance de virginité. Dans cette paire parallèle, « jeune fille » est naturel et évite une formulation clinique, sans imposer le terme français « vierge ».
theological_decisions:
- issue: Identité du « toi » employé comme instrument
  choice: Conserver le pronom sans explicitation
  alternative: Ajouter « Babylone » ou « mon marteau » dans le verset
  rationale: Le référent dépend du contexte antérieur ; le texte hébreu de ce verset ne le répète pas. L’expliciter ici résoudrait une relation contextuelle que le verset laisse pronominale.
translation_notes:
  register: Français moderne, sobre et dignifié. La triple reprise de « Par toi, je fracasserai » maintient l’anaphore, le rythme et la violence rhétorique de l’hébreu. Aucun marqueur de note n’est requis.
