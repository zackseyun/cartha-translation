  text: וַ/תִּרְעַ֥שׁ הָ/אָ֖רֶץ וַ/תָּחֹ֑ל כִּ֣י קָ֤מָה עַל בָּבֶל֙ מַחְשְׁב֣וֹת יְהוָ֔ה לָ/שׂ֞וּם אֶת אֶ֧רֶץ בָּבֶ֛ל לְ/שַׁמָּ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/029.yaml
  text: And the earth quakes and writhes, for the plans of Yahweh have arisen against Babylon, to make the land of Babylon a desolation, without inhabitant.
translation:
  language: fr
  text: La terre tremble et se tord de douleur, car les plans de Yahweh se dressent contre Babylone, pour faire du pays de Babylone une désolation, sans habitant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: tremble
  rationale: Le verbe רעשׁ exprime une secousse violente; « tremble » convient à la réaction de la terre dans ce contexte de jugement.
- source_word: וַתָּחֹל
  choice: se tord de douleur
  rationale: Le verbe חול évoque ici les convulsions et la douleur, notamment celles de l’enfantement; cette formulation conserve l’image corporelle sans archaïsme.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Les deux verbes de bouleversement favorisent ici une portée cosmique, tandis que אֶרֶץ בָּבֶל désigne ensuite explicitement le territoire babylonien.
- source_word: מַחְשְׁבוֹת
  choice: les plans
  rationale: Dans ce contexte, le terme désigne des intentions arrêtées et destinées à être exécutées, plutôt que de simples pensées.
- source_word: קָמָה עַל
  choice: se dressent contre
  rationale: Cette traduction garde l’image du lever ou de la mise en action hostile des plans divins contre Babylone.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans le remplacer par un titre.
- source_word: לָשׂוּם
  choice: il veut faire de
  rationale: L’infinitif exprime le but des plans de Yahweh; l’explicitation pronominale produit une phrase française naturelle sans modifier l’agent.
- source_word: לְשַׁמָּה
  choice: un lieu dévasté
  rationale: שַׁמָּה désigne un état de dévastation ou de désolation; « un lieu dévasté » est idiomatique en français moderne.
- source_word: מֵאֵין יוֹשֵׁב
  choice: où personne n’habite
  rationale: Cette tournure française rend clairement l’absence totale d’habitants exprimée par l’idiome hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source porte le nom propre divin; « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Portée de הָאָרֶץ au début du verset
  choice: la terre
  alternative: le pays
  rationale: Le langage de tremblement et de convulsion permet une lecture cosmique, contrastant avec la désignation locale explicite « le pays de Babylone » dans la seconde partie.
translation_notes:
  register: Français international moderne, poétique et digne. Le présent restitue la vivacité de la séquence prophétique. L’image physique de la terre en convulsions est conservée, tandis que la dernière proposition est formulée de manière naturelle et immédiatement compréhensible.
