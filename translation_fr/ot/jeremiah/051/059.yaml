source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יִרְמְיָ֣הוּ הַ/נָּבִ֗יא אֶת שְׂרָיָ֣ה בֶן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ בְּ/לֶכְתּ֞/וֹ אֶת צִדְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בָּבֶ֔ל בִּ/שְׁנַ֥ת הָ/רְבִעִ֖ית לְ/מָלְכ֑/וֹ וּ/שְׂרָיָ֖ה שַׂ֥ר מְנוּחָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/059.yaml
  text: This is the word that Jeremiah the prophet commanded Seraiah son of Neriah[a], son of Mahseiah, when he went with Zedekiah king of Judah to Babylon, in the fourth year of his reign. Now Seraiah was the quartermaster.
translation:
  language: fr
  text: Voici l’ordre que le prophète Jérémie donna à Seraya, fils de Nériya et petit-fils de Mahséya, lorsqu’il se rendit à Babylone avec Sédécias, roi de Juda, la quatrième année du règne de celui-ci. Seraya était responsable des haltes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsable du logement ». Le titre hébreu est rare et son sens précis est incertain; il peut désigner un fonctionnaire chargé des lieux de repos, de l’hébergement ou de l’organisation du voyage.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר צִוָּה
  choice: Voici l’ordre que ... donna
  rationale: דָּבָר peut désigner une parole, une affaire ou un ordre. Avec צִוָּה, « Voici l’ordre que ... donna » exprime naturellement en français la consigne confiée à Seraya sans affaiblir la force du verbe.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Identification directe, formulée selon l’ordre naturel du français.
- source_word: שְׂרָיָה בֶן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: Seraya, fils de Nériya et petit-fils de Mahséya
  rationale: Le second בֶן rattache Mahséya à Nériya; « petit-fils » rend clairement la généalogie en français courant.
- source_word: בְּלֶכְתּוֹ אֶת צִדְקִיָּהוּ ... בָּבֶל
  choice: lorsqu’il se rendit à Babylone avec Sédécias
  rationale: בְּלֶכְתּוֹ exprime la circonstance temporelle; אֶת a ici une valeur comitative, et Babylone est la destination implicite du déplacement.
- source_word: בִּשְׁנַת הָרְבִעִית לְמָלְכוֹ
  choice: la quatrième année du règne de celui-ci
  rationale: Formule de datation royale; « de celui-ci » désambiguïse naturellement le référent, Sédécias.
- source_word: שַׂר מְנוּחָה
  choice: responsable des haltes
  rationale: Titre administratif rare et incertain. מְנוּחָה évoque le repos ou le lieu de repos; dans le contexte d’un voyage, cette formulation peut désigner la responsabilité des étapes, logements ou dispositions de repos, tout en évitant une précision excessive.
