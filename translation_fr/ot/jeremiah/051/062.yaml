source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ יְהוָה֙ אַתָּ֨ה דִבַּ֜רְתָּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ לְ/הַכְרִית֔/וֹ לְ/בִלְתִּ֤י הֱיֽוֹת בּ/וֹ֙ יוֹשֵׁ֔ב לְ/מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה כִּֽי שִׁמְמ֥וֹת עוֹלָ֖ם תִּֽהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/062.yaml
  text: and say[a], ‘O Yahweh, you yourself have spoken concerning this place, to cut it off so that no inhabitant will be in it, from man to beast[c][b]; for it will become everlasting desolations.’
translation:
  language: fr
  text: 'et tu diras : « Yahweh, c’est toi qui as parlé au sujet de ce lieu, afin de le détruire[a], pour qu’il n’y ait aucun habitant, ni être humain ni bête[b] ; car il deviendra un lieu de désolation perpétuelle[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin de le retrancher » ou « de le couper » ; le verbe désigne ici une destruction décisive.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis l’être humain jusqu’à la bête », formule exprimant un dépeuplement total, touchant humains et animaux.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « des désolations perpétuelles » ; le nom hébreu est au pluriel. Autre traduction possible : « des désolations pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: et tu diras
  rationale: Le qatal à valeur injonctive, relié à la suite d’instructions par וְ, se rend naturellement par un futur de commandement en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, conformément à la présence explicite du tétragramme dans le texte hébreu.
- source_word: אַתָּה דִבַּרְתָּ
  choice: c’est toi qui as parlé
  rationale: La tournure clivée rend naturellement l’insistance portée par le pronom indépendant אַתָּה.
- source_word: דִבַּרְתָּ אֶל הַמָּקוֹם הַזֶּה
  choice: tu as parlé au sujet de ce lieu
  rationale: Dans ce contexte de jugement, אֶל introduit ce sur quoi porte la parole; « au sujet de » évite de surinterpréter la préposition par « contre ».
- source_word: לְהַכְרִיתוֹ
  choice: afin de le détruire
  rationale: Le hiphil de כרת signifie ici retrancher ou faire disparaître. « Détruire » exprime clairement le résultat visé en français, tandis qu’une note conserve l’image littérale.
- source_word: לְבִלְתִּי הֱיוֹת בּוֹ יוֹשֵׁב
  choice: pour qu’il n’y ait plus aucun habitant
  rationale: Cette formulation rend la finalité ou le résultat exprimé par לְבִלְתִּי et garde l’idée nominale de יוֹשֵׁב. « Plus » convient au jugement de dépeuplement annoncé.
- source_word: לְמֵאָדָם וְעַד בְּהֵמָה
  choice: ni être humain ni bête
  rationale: Cette coordination française naturelle communique la totalité du dépeuplement couverte par la formule hébraïque, sans limiter אָדָם aux hommes de sexe masculin.
- source_word: שִׁמְמוֹת עוֹלָם
  choice: un lieu dévasté pour toujours
  rationale: La formulation idiomatique française exprime l’état durable de désolation. Une note signale la forme nominale plurielle plus littérale.
- source_word: תִּהְיֶה
  choice: il deviendra
  rationale: Le verbe היה annonce ici l’état résultant du lieu; « deviendra » le fait ressortir naturellement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom propre sans lui substituer un titre.
- issue: Portée générique de אָדָם dans la formule de dépeuplement
  choice: être humain
  alternative: homme
  rationale: אָדָם désigne ici l’être humain par opposition à la bête. « Être humain » préserve cette portée générique sans modifier le sens théologique de la formule.
- issue: Durée exprimée par עוֹלָם
  choice: pour toujours
  alternative: perpétuel
  rationale: Dans cette annonce de jugement, עוֹלָם indique une désolation durable ou indéfiniment prolongée. « Pour toujours » conserve la force du texte sans préciser davantage la nature métaphysique de cette durée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de la prière tout en évitant les calques peu naturels. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
