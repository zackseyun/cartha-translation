source:
  edition: WLC
  text: וְ/רִנְּנ֤וּ עַל בָּבֶל֙ שָׁמַ֣יִם וָ/אָ֔רֶץ וְ/כֹ֖ל אֲשֶׁ֣ר בָּ/הֶ֑ם כִּ֧י מִ/צָּפ֛וֹן יָבוֹא לָ֥/הּ הַ/שּׁוֹדְדִ֖ים נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/048.yaml
  text: Then heaven and earth[a], and all that is in them, will shout for joy over Babylon, for from the north destroyers will come against her[c][b], declares Yahweh.
translation:
  language: fr
  text: Alors le ciel et la terre, et tout ce qu’ils contiennent, pousseront des cris de joie au sujet de Babylone[a], car les dévastateurs viendront du nord contre elle[b] — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chanteront de joie au sujet de Babylone ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « viendront à elle » ; le contexte indique une venue hostile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִנְּנוּ
  choice: pousseront des cris de joie
  rationale: Le verbe רנן exprime une manifestation sonore de joie ou de triomphe. Cette formulation en conserve la force vocale et reste naturelle en français.
- source_word: עַל בָּבֶל
  choice: au sujet de Babylone
  rationale: Avec un verbe de joie, עַל peut désigner l’objet ou le motif de la réjouissance. « Au sujet de » préserve cette latitude sans déterminer explicitement si la joie porte sur Babylone elle-même ou sur sa chute.
- source_word: שָׁמַיִם וָאָרֶץ וְכֹל אֲשֶׁר בָּהֶם
  choice: le ciel et la terre, et tout ce qu’ils contiennent
  rationale: Cette formulation rend le mérisme hébreu désignant l’ensemble de la création, avec une tournure française claire et actuelle.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de la réjouissance cosmique.
- source_word: מִצָּפוֹן
  choice: du nord
  rationale: Traduction directionnelle directe, qui conserve le motif récurrent chez Jérémie d’un jugement venant du nord.
- source_word: יָבוֹא לָהּ
  choice: viendront contre elle
  rationale: L’hébreu dit littéralement « viendront à elle », mais l’identité des arrivants et le contexte indiquent une venue hostile. « Contre elle » rend naturellement cette valeur contextuelle.
- source_word: הַשּׁוֹדְדִים
  choice: des dévastateurs
  rationale: Le participe substantivé de שׁדד désigne ceux qui ravagent, détruisent ou pillent. « Dévastateurs » conserve cette portée générale sans la réduire au seul pillage.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: Cette tournure solennelle rend la formule prophétique nominale נְאֻם et reproduit directement le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahvé » est la forme française traditionnelle et immédiatement reconnaissable du nom divin, plutôt qu’un titre substitutif.
- issue: Objet de la joie de la création
  choice: au sujet de Babylone
  alternative: sur Babylone / à cause de Babylone
  rationale: La préposition עַל permet plusieurs nuances. La formulation retenue ne précise pas davantage que l’hébreu si la réjouissance vise Babylone, sa chute ou le jugement exercé contre elle.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique est conservé. « Pousser des cris de joie » maintient l’image sonore du verbe hébreu, tandis que « déclaration de Yahvé » garde la solennité de la formule prophétique.
