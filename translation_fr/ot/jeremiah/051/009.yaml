source:
  edition: WLC
  text: רפאנו אֶת בָּבֶל֙ וְ/לֹ֣א נִרְפָּ֔תָה עִזְב֕וּ/הָ וְ/נֵלֵ֖ךְ אִ֣ישׁ לְ/אַרְצ֑/וֹ כִּֽי נָגַ֤ע אֶל הַ/שָּׁמַ֨יִם֙ מִשְׁפָּטָ֔/הּ וְ/נִשָּׂ֖א עַד שְׁחָקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/009.yaml
  text: We tried to heal Babylon[a], but she was not healed. Leave her, and let each one go to his own land[c][b], for her judgment has reached to heaven and has been lifted up to the skies.
translation:
  language: fr
  text: Nous avons essayé de guérir Babylone[a], mais elle n’a pas été guérie. Abandonnez-la, et partons, chacun vers son pays, car son jugement[b] a atteint le ciel et a été élevé jusqu’aux nuages[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Nous avons guéri Babylone »; dans le contexte, il s’agit d’une tentative de guérison qui a échoué.'
    reason: lexical_alternative
  - marker: b
    text: Ou « sa sentence » ou « son châtiment »; le terme hébreu peut désigner une décision judiciaire aussi bien que sa sanction.
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu désigne les nuages élevés ou les hauteurs du ciel.
    reason: cultural_note
lexical_decisions:
- source_word: רפאנו
  choice: Nous avons essayé de guérir
  rationale: Le qal accompli signifie littéralement « nous avons guéri », mais la proposition suivante indique que les soins ont échoué. « Avons essayé de guérir » rend naturellement cette tentative sans suggérer une guérison réussie.
- source_word: נִרְפָּתָה
  choice: n’a pas été guérie
  rationale: Le nifal accompli féminin singulier est rendu au passif, ce qui maintient le parallèle avec le premier membre de phrase sans ajouter explicitement une impossibilité.
- source_word: עִזְבוּהָ
  choice: Abandonnez-la
  rationale: L’impératif pluriel avec suffixe féminin appelle les interlocuteurs à quitter définitivement Babylone; « abandonnez-la » convient à la gravité du contexte.
- source_word: וְנֵלֵךְ
  choice: et partons
  rationale: Le cohortatif à la première personne du pluriel exprime une exhortation à laquelle le locuteur s’associe. « Partons » conserve cette valeur, contrairement à une formulation limitée à la troisième personne.
- source_word: אִישׁ לְאַרְצוֹ
  choice: chacun vers son pays
  rationale: L’expression est littéralement « un homme vers son pays », mais אישׁ a ici une valeur distributive. « Chacun vers son pays » est idiomatique et conserve le singulier distributif.
- source_word: מִשְׁפָּטָהּ
  choice: son jugement
  rationale: מִשְׁפָּט peut désigner le jugement, la sentence ou la sanction judiciaire. « Son jugement » préserve l’ampleur du champ sémantique et la tension entre décision et châtiment.
- source_word: נָגַע אֶל הַשָּׁמַיִם
  choice: a atteint le ciel
  rationale: נגע avec אֶל décrit ici ce qui parvient jusqu’au ciel. Le singulier collectif « le ciel » est la tournure française naturelle.
- source_word: וְנִשָּׂא עַד שְׁחָקִים
  choice: et s’est élevé jusqu’aux nuages
  rationale: Le nifal de נשׂא décrit une élévation, tandis que שְׁחָקִים évoque les nuages ou les hauteurs du ciel. La formulation garde le parallélisme vertical sans surinterpréter l’image.
theological_decisions:
- issue: Sens du « jugement » de Babylone qui atteint le ciel
  choice: Conserver « son jugement », image judiciaire dont le référent précis reste ouvert entre décision prononcée et châtiment encouru.
  alternative: « sa condamnation », « son châtiment » ou « son crime »
  rationale: Dans le contexte de la chute annoncée de Babylone, מִשְׁפָּט possède une force judiciaire et punitive. Le traduire par « jugement » évite de l’identifier exclusivement soit au péché de Babylone, soit à la peine qui lui est infligée.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs et le cohortatif sont distingués (« Abandonnez-la » / « partons »). Le parallélisme poétique entre le ciel et les nuages est maintenu, tandis que les ambiguïtés judiciaire et imagée sont signalées en notes.
