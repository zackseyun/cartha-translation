  text: וּ/פֶן יֵרַ֤ךְ לְבַבְ/כֶם֙ וְ/תִֽירְא֔וּ בַּ/שְּׁמוּעָ֖ה הַ/נִּשְׁמַ֣עַת בָּ/אָ֑רֶץ וּ/בָ֧א בַ/שָּׁנָ֣ה הַ/שְּׁמוּעָ֗ה וְ/אַחֲרָ֤י/ו בַּ/שָּׁנָה֙ הַ/שְּׁמוּעָ֔ה וְ/חָמָ֣ס בָּ/אָ֔רֶץ וּ/מֹשֵׁ֖ל עַל מֹשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/046.yaml
  text: And do not let your heart grow faint[a], and do not fear the report heard in the land; a report will come in one year, and after it in the next year another report, and violence in the land[c][b], ruler against ruler.
translation:
  language: fr
  text: 'Que votre cœur ne défaille pas[a], et ne craignez pas la nouvelle[b] entendue dans le pays : une nouvelle viendra au cours d’une année, puis, l’année suivante, une autre nouvelle ; il y aura de la violence dans le pays, dirigeant contre dirigeant[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que votre cœur ne devienne pas mou. » L’expression signifie perdre courage ou devenir faible.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner une « rumeur » ou un « bruit », c’est-à-dire une information qui circule, confirmée ou non.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dirigeant sur un dirigeant » ou « un dirigeant au-dessus d’un autre ». La formule peut évoquer un conflit entre dirigeants, une domination ou des changements successifs de pouvoir.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפֶן
  choice: Que… ne… pas
  rationale: La particule פן introduit ici une mise en garde négative. Cette tournure française conserve la valeur d’avertissement sans imposer un lien causal absent du verset isolé.
- source_word: יֵרַךְ לְבַבְכֶם
  choice: votre cœur ne défaille pas
  rationale: רכך signifie littéralement devenir mou ou faible ; associé au cœur, il évoque la perte de courage. « Défaillir » garde l’image tout en restant naturel et digne.
- source_word: וְתִירְאוּ
  choice: et ne craignez pas
  rationale: Le qal de ירא exprime directement la crainte ; la portée négative de פן se prolonge dans ce second verbe.
- source_word: בַּשְּׁמוּעָה הַנִּשְׁמַעַת בָּאָרֶץ
  choice: la nouvelle qui se répandra dans le pays
  rationale: שְׁמוּעָה peut désigner une nouvelle, une rumeur ou un bruit. Le participe passif נִשְׁמַעַת signifie littéralement « qui est entendue » ; « qui se répandra » rend naturellement l’idée de nouvelles circulant dans le pays, sans préjuger de leur véracité.
- source_word: וּבָא בַשָּׁנָה הַשְּׁמוּעָה
  choice: une nouvelle arrivera une année
  rationale: Le texte annonce l’arrivée de nouvelles au fil des années. L’indéfini français restitue la première occurrence dans une série.
- source_word: וְאַחֲרָיו בַּשָּׁנָה הַשְּׁמוּעָה
  choice: puis une autre l’année suivante
  rationale: אַחֲרָיו marque ce qui vient après la première nouvelle. « Une autre » et « suivante » explicitent sobrement la succession exprimée par la répétition hébraïque.
- source_word: וְחָמָס בָּאָרֶץ
  choice: il y aura de la violence dans le pays
  rationale: חָמָס désigne la violence, le tort ou l’injustice brutale. « Violence » est ici le rendu le plus direct ; l’ajout de « il y aura » complète naturellement la proposition nominale en français.
- source_word: וּמֹשֵׁל עַל מֹשֵׁל
  choice: un dirigeant s’élèvera contre un autre
  rationale: מֹשֵׁל désigne celui qui gouverne. עַל peut signifier « sur » ou, dans un contexte conflictuel, « contre ». Le verbe « s’élèvera » produit une phrase française idiomatique tout en laissant la note signaler l’autre lecture possible.
theological_decisions:
- issue: Sens de מֹשֵׁל עַל מֹשֵׁל
  choice: un dirigeant s’élèvera contre un autre
  alternative: un dirigeant succédera à un autre / un dirigeant dominera un autre
  rationale: Le contexte de violence favorise l’opposition entre dirigeants, mais la préposition עַל permet aussi une relation de domination ou une succession politique. La note préserve cette ambiguïté sans la transformer en affirmation doctrinale.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le rythme de la répétition des nouvelles est conservé, tandis que les ellipses nominales hébraïques sont légèrement complétées pour obtenir une syntaxe française naturelle.
