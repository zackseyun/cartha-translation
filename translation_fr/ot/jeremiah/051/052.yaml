source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וּ/פָקַדְתִּ֖י עַל פְּסִילֶ֑י/הָ וּ/בְ/כָל אַרְצָ֖/הּ יֶאֱנֹ֥ק חָלָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/052.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will punish her carved images, and throughout all her land the wounded will groan.
translation:
  language: fr
  text: C’est pourquoi — déclaration de Yahweh — voici que des jours viennent où je punirai ses images sculptées[a] ; dans tout son pays, les victimes transpercées[b] gémiront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses idoles ». Le terme hébreu désigne précisément des images cultuelles sculptées.
    reason: lexical_alternative
  - marker: b
    text: Ou « les tués ». Le terme hébreu désigne habituellement des personnes transpercées ou tuées ; le verbe « gémiront » et certaines traditions anciennes peuvent favoriser ici le sens de blessés.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conclusion tirée du jugement annoncé dans le contexte précédent, dans un français naturel et soutenu.
- source_word: הִנֵּה
  choice: voici que
  rationale: Conserve la valeur déictique et solennelle du marqueur prophétique sans archaïsme excessif.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Reproduit l’idiome prophétique et l’absence d’article dans l’hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique comme une parole solennelle et autorisée, tout en conservant le nom divin.
- source_word: וּפָקַדְתִּי עַל
  choice: j’interviendrai contre
  rationale: Dans ce contexte de jugement, פקד על exprime une intervention punitive. Cette formulation en préserve la force judiciaire sans effacer la portée plus large du verbe.
- source_word: פְּסִילֶיהָ
  choice: ses statues sculptées
  rationale: Rend concrètement des images cultuelles taillées, plutôt que de substituer directement le terme interprétatif « idoles ».
- source_word: וּבְכָל אַרְצָהּ
  choice: dans tout son pays
  rationale: Exprime clairement l’étendue du désastre sur l’ensemble du territoire de Babylone.
- source_word: יֶאֱנֹק
  choice: gémiront
  rationale: Correspond au gémissement causé par une souffrance intense et convient au contexte des victimes de guerre.
- source_word: חָלָל
  choice: les blessés
  rationale: Le nom peut désigner ceux qui sont transpercés, blessés ou tués. Le verbe « gémir » favorise ici le sens de blessés encore vivants; le singulier hébreu est collectif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Portée de פקד על dans une annonce de jugement
  choice: j’interviendrai contre
  alternative: je punirai
  rationale: Le contexte implique clairement un châtiment, mais la formulation retenue préserve aussi la latitude sémantique du verbe hébreu, qui désigne une intervention ou une visite entraînant ici le jugement.
- issue: Sens de חָלָל avec le verbe « gémir »
  choice: les blessés
  alternative: les morts / ceux qui ont été tués
  rationale: חָלָל désigne souvent les victimes tombées au combat, mais il peut aussi viser les transpercés ou blessés. Puisqu’ils gémissent, le contexte immédiat favorise des blessés vivants sans supprimer l’arrière-plan mortel du terme.
translation_notes:
  register: Français international moderne, digne et prophétique. La tournure « voici que » maintient la solennité du discours; « déclaration de Yahweh » rend la formule d’oracle sans employer une expression archaïque. Le point-virgule préserve les deux mouvements parallèles de l’annonce.
