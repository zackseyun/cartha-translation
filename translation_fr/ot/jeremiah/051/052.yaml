    issue: « les blessés » pour חָלָל
    rationale: חָלָל désigne habituellement les transpercés ou les tués, et non simplement les blessés. La cohérence avec « gémiront » permet une lecture de survivants blessés, mais ne justifie pas d’effacer la nuance de victime frappée à mort. Une formulation inclusive accompagnée d’une note préserve l’ambiguïté.
  - severity: low
    issue: « j’interviendrai contre » pour וּפָקַדְתִּי עַל
    rationale: Dans cette annonce de jugement contre les images de Babylone, le verbe exprime une visitation punitive. « Je punirai » rend plus clairement la force judiciaire présente dans le contexte.
  - severity: low
    issue: « statues sculptées »
    rationale: L’expression est légèrement redondante et « statues » peut restreindre les פסילים à des statues plutôt qu’à l’ensemble des images taillées. « Images sculptées » est plus exact et plus souple.
