- from: C’est pourquoi, voici que des jours viennent — déclaration de Yahweh — où j’interviendrai contre ses statues sculptées[a] ; et, dans tout son pays, les blessés gémiront.
  to: C’est pourquoi — déclaration de Yahweh — voici que des jours viennent où je punirai ses images sculptées[a] ; dans tout son pays, les victimes transpercées[b] gémiront.
  rationale: La révision corrige la restriction sémantique de חָלָל tout en reconnaissant, sans la trancher artificiellement, la tension créée par « gémiront ». Elle renforce aussi la portée punitive de פקד על et améliore la précision idiomatique de la désignation des images cultuelles.
