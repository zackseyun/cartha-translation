  verdict: revise
  source_fidelity: La traduction de חָלָל par « les blessés » restreint indûment un terme qui désigne normalement des personnes transpercées ou tuées, particulièrement dans un contexte guerrier. Le verbe « gémir » crée une réelle tension, et des traditions anciennes ont compris ici des blessés ; il convient donc de conserver cette ambiguïté par une formulation plus proche du terme hébreu et par une note. « Je punirai » rend plus explicitement la valeur judiciaire de פקד על que « j’interviendrai contre ».
  naturalness: La formulation révisée reste naturelle en français international moderne. « Images sculptées » est plus idiomatique et moins redondant que « statues sculptées », tout en conservant le caractère matériel et cultuel des פסילים. Le déplacement de « déclaration de Yahweh » donne une syntaxe prophétique plus fluide.
  terminology: « Yahweh » conserve le tétragramme. « Images sculptées » rend פסילים sans imposer d’emblée « idoles ». « Victimes transpercées » préserve mieux la portée de חלל que « blessés », tandis que la note signale l’alternative « tués » et la difficulté contextuelle.
