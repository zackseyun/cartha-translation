  terminology: « Yahweh des armées », « par lui-même », « hommes » et « clameur » conviennent. « Clameur » rend הֵידָד sans imposer dans le texte principal la précision interprétative de cri de guerre ou de victoire. Les notes conservent correctement les alternatives pertinentes.
