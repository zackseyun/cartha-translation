  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת בְּ/נַפְשׁ֑/וֹ כִּ֣י אִם מִלֵּאתִ֤י/ךְ אָדָם֙ כַּ/יֶּ֔לֶק וְ/עָנ֥וּ עָלַ֖יִ/ךְ הֵידָֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/014.yaml
  text: 'Yahweh of hosts has sworn by himself: Surely I will fill you with men[a], like locusts[c][b], and they will raise over you a shout.'
translation:
  language: fr
  text: 'Yahweh des armées a juré par lui-même[a] :


    « Oui, je te remplirai d’hommes, aussi nombreux que des sauterelles[b],


    et ils élèveront sur toi une clameur[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par sa propre vie ». L’hébreu dit littéralement « par sa nephesh », formule de serment qui renvoie à sa propre personne ou à sa propre vie.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme de jeunes sauterelles » ou « comme un essaim de sauterelles ». Le mot hébreu peut désigner une espèce ou un stade de la sauterelle.
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, il s’agit vraisemblablement d’un cri de guerre ou de victoire lancé contre Babylone.
    reason: cultural_note
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: a juré
  rationale: Le nifal de שׁבע est la tournure habituelle pour prêter serment. Le passé composé exprime un serment accompli dont la portée demeure actuelle.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Cette formulation conserve le nom divin et la dimension militaire du titre צְבָאוֹת sans en limiter explicitement la portée.
- source_word: בְּנַפְשׁוֹ
  choice: par lui-même
  rationale: Dans cette formule de serment, נֶפֶשׁ renvoie à la personne ou à la vie de celui qui jure. « Par lui-même » rend clairement et naturellement l’auto-attestation divine.
- source_word: כִּי אִם
  choice: Oui
  rationale: Dans le cadre d’un serment, cette locution introduit avec insistance ce qui est affirmé, plutôt qu’une véritable condition.
- source_word: מִלֵּאתִיךְ
  choice: je te remplirai
  rationale: Le suffixe féminin singulier désigne Babylone personnifiée. Dans le contenu du serment, le futur français rend la portée prophétique de la forme.
- source_word: אָדָם
  choice: d’hommes
  rationale: Le collectif désigne ici les assaillants humains qui envahiront Babylone; « hommes » maintient le contraste avec les sauterelles.
- source_word: כַּיֶּלֶק
  choice: comme de sauterelles
  rationale: יֶלֶק désigne une espèce ou un stade de la sauterelle. Le pluriel français communique naturellement l’image d’une multitude envahissante.
- source_word: וְעָנוּ
  choice: ils pousseront
  rationale: Avec un cri pour complément, ענה exprime ici l’émission d’une clameur; « pousser un cri » est idiomatique en français.
- source_word: עָלַיִךְ
  choice: contre toi
  rationale: Dans le contexte de l’assaut contre Babylone, עַל marque l’orientation hostile de la clameur.
- source_word: הֵידָד
  choice: un cri
  rationale: Le terme désigne une forte clameur, susceptible d’être guerrière, victorieuse ou liée à d’autres contextes. La traduction générale préserve cette amplitude.
theological_decisions:
- issue: Formule du serment divin
  choice: Yahweh des armées a juré par lui-même
  alternative: Yahweh des armées a juré par sa propre vie
  rationale: L’hébreu emploie littéralement « par sa nephesh ». « Par lui-même » exprime le sens idiomatique sans réduire נֶפֶשׁ à une conception particulière de l’âme, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement féminin singulier conserve l’adresse directe à Babylone personnifiée. La formulation garde le nom divin « Yahweh », l’image de l’invasion de sauterelles et l’indétermination lexicale de הֵידָד dans le texte principal.
