base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/031.yaml
  text: Runner runs to meet runner[a], and messenger to meet messenger[b], to tell the king of Babylon that his city has been captured from end to end.
translation:
  language: fr
  text: Un coureur court à la rencontre d’un autre coureur[a], et un messager court à la rencontre d’un autre messager, pour annoncer au roi de Babylone que sa ville a été prise d’un bout à l’autre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Un coureur court à la rencontre d’un coureur. » La répétition des termes hébreux souligne l’urgence et la succession rapide des arrivées.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a été prise depuis une extrémité ». L’expression hébraïque peut désigner une prise commençant à une extrémité de la ville ; dans le contexte, elle peut aussi évoquer sa conquête dans toute son étendue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָץ / יָרוּץ
  choice: Un coureur court
  rationale: La répétition du nom-participe et du verbe de même racine produit un effet vif et pressant. Le français peut la conserver sans devenir obscur.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Cette expression rend le mouvement vers quelqu’un et convient à la succession rapide des porteurs de nouvelles.
- source_word: וּמַגִּיד ... מַגִּיד
  choice: et un messager à la rencontre d’un autre messager
  rationale: מַגִּיד désigne ici celui qui fait connaître une nouvelle. « Messager » est naturel dans ce contexte, et l’ellipse du verbe reproduit la structure hébraïque.
- source_word: לְהַגִּיד
  choice: pour annoncer
  rationale: « Annoncer » exprime clairement la transmission officielle et urgente de la nouvelle au roi.
- source_word: לְמֶלֶךְ בָּבֶל
  choice: au roi de Babylone
  rationale: Traduction directe et naturelle du complément hébreu.
- source_word: נִלְכְּדָה
  choice: a été prise
  rationale: Le niphal de לכד décrit la ville saisie ou conquise. « A été prise » est idiomatique en français dans un contexte militaire.
- source_word: עִירוֹ
  choice: sa ville
  rationale: Le suffixe possessif renvoie explicitement au roi de Babylone et doit être conservé.
- source_word: מִקָּצֶה
  choice: d’un bout à l’autre
  rationale: Dans le contexte de la chute de Babylone, cette formulation exprime naturellement l’étendue de la prise, tout en signalant en note la lecture plus formelle « depuis une extrémité ».
