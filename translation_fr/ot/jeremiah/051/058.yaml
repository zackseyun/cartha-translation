id: JER.51.58
reference: Jeremiah 51:58
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת חֹ֠מוֹת בָּבֶ֤ל הָֽ/רְחָבָה֙ עַרְעֵ֣ר תִּתְעַרְעָ֔ר וּ/שְׁעָרֶ֥י/הָ הַ/גְּבֹהִ֖ים בָּ/אֵ֣שׁ יִצַּ֑תּוּ וְ/יִֽגְע֨וּ עַמִּ֧ים בְּ/דֵי רִ֛יק וּ/לְאֻמִּ֥ים בְּ/דֵי אֵ֖שׁ וְ/יָעֵֽפוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/058.yaml
  text: 'Thus says Yahweh of hosts: Babylon’s broad wall shall be utterly razed[a], and her high gates shall be burned with fire. Peoples labor for emptiness, and nations for the fire[b], and they grow weary.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : La large muraille de Babylone sera entièrement rasée[a], et ses hautes portes seront incendiées. Les peuples travaillent pour le néant, les nations pour le feu, et ils s’épuisent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera complètement mise à nu ». Le tour hébreu intensifie un verbe qui évoque la mise à nu; appliqué à une muraille, il indique ici sa destruction totale.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par un terme français actuel qui garde l’idée des armées célestes ou terrestres sans la restreindre.
- source_word: חֹמוֹת בָּבֶל הָרְחָבָה
  choice: la large muraille de Babylone
  rationale: Le pluriel morphologique חֹמוֹת peut désigner collectivement le système de fortifications; le singulier collectif s’accorde avec l’adjectif singulier הָרְחָבָה et reste naturel en français.
- source_word: עַרְעֵר תִּתְעַרְעָר
  choice: sera entièrement rasée
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action; « entièrement rasée » exprime dans ce contexte la mise à nu et la destruction complète de la muraille.
- source_word: וּשְׁעָרֶיהָ הַגְּבֹהִים בָּאֵשׁ יִצַּתּוּ
  choice: et ses hautes portes seront incendiées
  rationale: « Hautes portes » traduit directement le syntagme, tandis que « seront incendiées » rend naturellement en français l’idée qu’elles seront livrées au feu.
- source_word: וְיִגְעוּ עַמִּים בְּדֵי רִיק
  choice: Les peuples travaillent pour le néant
  rationale: Préserve le parallélisme poétique et le sens d’un labeur dont le résultat est vide et futile.
- source_word: וּלְאֻמִּים בְּדֵי אֵשׁ
  choice: les nations pour le feu
  rationale: 'Maintient l’ellipse saisissante de l’hébreu: le travail des nations finit dans le feu ou lui sert de proie, sans expliciter davantage l’image.'
- source_word: וְיָעֵפוּ
  choice: et ils s’épuisent
  rationale: Exprime le fait de devenir las ou épuisé et clôt naturellement la progression du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération représente explicitement le nom propre du texte hébreu plutôt que de le remplacer par un titre.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » reste proche du sens lexical et préserve l’ouverture quant à la nature des armées visées, sans introduire une interprétation cosmique plus large.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme prophétique et le parallélisme final sont conservés; l’ellipse « pour le feu » demeure volontairement ouverte.
