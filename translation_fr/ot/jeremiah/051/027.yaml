source:
  edition: WLC
  text: שְׂאוּ נֵ֣ס בָּ/אָ֗רֶץ תִּקְע֨וּ שׁוֹפָ֤ר בַּ/גּוֹיִם֙ קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ גּוֹיִ֔ם הַשְׁמִ֧יעוּ עָלֶ֛י/הָ מַמְלְכ֥וֹת אֲרָרַ֖ט מִנִּ֣י וְ/אַשְׁכְּנָ֑ז פִּקְד֤וּ עָלֶ֨י/הָ֙ טִפְסָ֔ר הַֽעֲלוּ ס֖וּס כְּ/יֶ֥לֶק סָמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/027.yaml
  text: Raise a banner in the land[a]; blow a trumpet among the nations. Consecrate nations against her; summon against her the kingdoms of Ararat, Minni, and Ashkenaz. Appoint a marshal against her[d][c][b]; bring up horses like bristling locusts.
translation:
  language: fr
  text: Dressez un étendard dans le pays[a] ; sonnez du cor parmi les nations. Consacrez des nations contre elle[b] ; convoquez contre elle les royaumes d’Ararat, de Minni et d’Ashkenaz. Désignez contre elle un chef militaire[c] ; faites avancer les chevaux comme des sauterelles hérissées[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dressez un signal » ; le terme hébreu peut désigner un étendard ou un signal élevé bien en vue.
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « consacrer » relève du langage de la guerre : il s’agit de mettre des forces à part et de les préparer au combat, avec une possible dimension sacrale.'
    reason: cultural_note
  - marker: c
    text: Le terme hébreu est rare et désigne un fonctionnaire ou un officier ; on pourrait aussi traduire par « commandant » ou « officier recruteur ».
    reason: lexical_alternative
  - marker: d
    text: Ou « comme des sauterelles velues » ou « rugueuses » ; l’expression hébraïque est rare et imagée.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: Dressez un étendard
  rationale: נֵס désigne un signal visible, souvent un étendard militaire dressé pour rallier ou avertir. « Dressez un étendard » est naturel en français et conserve cette fonction publique.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner la terre ou un pays. Le contexte d’une mobilisation militaire dans une région favorise « dans le pays », tout en laissant l’étendue exacte dépendre du contexte.
- source_word: תִּקְעוּ שׁוֹפָר
  choice: sonnez du cor
  rationale: Le שׁוֹפָר est un cor utilisé pour donner l’alarme ou appeler au rassemblement. « Sonnez du cor » rend l’objet et sa fonction sans l’assimiler à une trompette moderne.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les peuples étrangers mobilisés contre Babylone. « Parmi les nations » exprime la diffusion internationale de l’appel.
- source_word: קַדְּשׁוּ עָלֶיהָ גּוֹיִם
  choice: Consacrez des nations contre elle
  rationale: Dans un contexte guerrier, קדשׁ signifie mettre à part ou consacrer en vue du combat. Le verbe « consacrer » préserve la dimension sacrale sans expliciter davantage que l’hébreu.
- source_word: הַשְׁמִיעוּ עָלֶיהָ
  choice: convoquez contre elle
  rationale: La forme causative de שמע signifie littéralement faire entendre ou annoncer. Avec les royaumes nommés comme complément, « convoquez » exprime naturellement l’appel à la guerre suggéré par le contexte.
- source_word: מַמְלְכוֹת אֲרָרַט מִנִּי וְאַשְׁכְּנָז
  choice: les royaumes d’Ararat, de Minni et d’Ashkenaz
  rationale: Les noms régionaux sont translittérés, et la construction française avec « de » rend clairement le rapport entre les royaumes et les territoires nommés.
- source_word: פִּקְדוּ עָלֶיהָ טִפְסָר
  choice: Désignez contre elle un chef militaire
  rationale: טִפְסָר est un terme rare désignant un haut fonctionnaire ou un officier, probablement dans un cadre militaire. « Chef militaire » reste clair sans lui attribuer un grade trop précis.
- source_word: הַעֲלוּ סוּס
  choice: faites avancer les chevaux
  rationale: Le hiphil de עלה peut décrire la mise en mouvement ou la montée de forces armées. « Faites avancer » convient à la mobilisation des chevaux en français courant.
- source_word: כְּיֶלֶק סָמָר
  choice: comme des sauterelles hérissées
  rationale: יֶלֶק désigne une espèce ou un stade de sauterelle, tandis que סָמָר évoque ce qui est hérissé, rude ou velu. Cette formulation conserve l’image rare et frappante du texte.
theological_decisions:
- issue: La portée sacrale du verbe קדשׁ dans un appel à la guerre
  choice: Consacrez des nations contre elle
  alternative: Préparez des nations à la guerre sainte contre elle
  rationale: « Consacrez » maintient la tension entre mise à part rituelle et préparation militaire, tandis que « guerre sainte » interpréterait explicitement une notion que l’hébreu ne formule pas ici comme telle.
