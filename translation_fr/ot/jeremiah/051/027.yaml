  register: Français moderne, international et soutenu sans archaïsmes inutiles. Les impératifs conservent le rythme pressant de la proclamation. Les noms propres suivent les formes françaises bibliques usuelles. Les termes rares ou ambigus sont rendus clairement dans le texte et documentés en notes plutôt que résolus de manière excessive.
