  text: עָלָ֥ה עַל בָּבֶ֖ל הַ/יָּ֑ם בַּ/הֲמ֥וֹן גַּלָּ֖י/ו נִכְסָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/042.yaml
  text: The sea has come up against Babylon[b][a]; she is covered with the multitude of its waves.
translation:
  language: fr
  text: La mer s’est élevée contre Babylone[a] ; elle a été couverte par la multitude de ses vagues[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « mer » représente ici, de façon imagée, la force irrésistible qui s’abat sur Babylone ; la traduction conserve cette métaphore.
    reason: cultural_note
  - marker: b
    text: 'Ou : « par le tumulte de ses vagues ». Le mot hébreu peut évoquer une grande masse ou multitude, ainsi que le bruit et l’agitation tumultueuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עַל
  choice: a déferlé contre
  rationale: Le parfait qal de עלה exprime une montée, et עַל prend ici une valeur hostile. « Déferler contre » rend naturellement en français le mouvement menaçant de la mer sans supprimer la métaphore.
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française usuelle du nom de lieu.
- source_word: הַיָּם
  choice: La mer
  rationale: Le nom est défini. La métaphore de la mer est conservée plutôt que remplacée par l’identité supposée de la force ennemie.
- source_word: בַּהֲמוֹן
  choice: par le tumulte
  rationale: הָמוֹן peut désigner une multitude, une masse, une agitation ou un bruit tumultueux. Avec les vagues, « tumulte » préserve à la fois l’idée d’agitation et celle de fracas, tout en laissant subsister l’ambiguïté lexicale.
- source_word: גַּלָּיו
  choice: de ses vagues
  rationale: Le suffixe masculin singulier renvoie grammaticalement à « la mer » ; en français, le possessif s’accorde avec le nom possédé « vagues ».
- source_word: נִכְסָתָה
  choice: elle est submergée
  rationale: Le niphal parfait féminin singulier de כסה signifie « être couverte ». « Submergée » convient à l’image maritime et maintient Babylone comme référent féminin personnifié.
theological_decisions:
- issue: Identification de la mer
  choice: Conserver « la mer » dans le texte
  alternative: Expliciter une armée ou des peuples envahisseurs
  rationale: Le verset formule lui-même le jugement au moyen d’une image. L’interpréter directement comme une force militaire réduirait une ambiguïté poétique que l’hébreu conserve.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Déferlé » et « submergée » donnent cohérence à l’image maritime ; « tumulte » préserve la polyvalence de הָמוֹן. Les deux appels de note figurent dans le texte, au point précis qu’ils éclairent.
