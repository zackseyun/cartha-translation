  naturalness: « La mer s’est élevée contre Babylone » est une formulation poétique mais claire en français moderne et conserve le mouvement menaçant. « Elle a été couverte par la multitude de ses vagues » est naturel dans un registre prophétique soutenu et maintient la personnification féminine de Babylone.
