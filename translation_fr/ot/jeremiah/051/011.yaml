source:
  edition: WLC
  text: הָבֵ֣רוּ הַ/חִצִּים֮ מִלְא֣וּ הַ/שְּׁלָטִים֒ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ מַלְכֵ֣י מָדַ֔י כִּֽי עַל בָּבֶ֥ל מְזִמָּת֖/וֹ לְ/הַשְׁחִיתָ֑/הּ כִּֽי נִקְמַ֤ת יְהוָה֙ הִ֔יא נִקְמַ֖ת הֵיכָלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/011.yaml
  text: Sharpen the arrows[a]; fill the shields. Yahweh has stirred up the spirit of the kings of Media, because his plan is against Babylon, to destroy her; for it is the vengeance of Yahweh[b], vengeance for his temple.
translation:
  language: fr
  text: Aiguisez les flèches, remplissez les carquois[a] ! Yahweh a suscité l’esprit des rois des Mèdes, car son projet contre Babylone est de la détruire. En effet, c’est la vengeance de Yahweh, la vengeance pour son temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner des « boucliers ». La formulation « remplissez les boucliers » est difficile; « carquois » convient mieux au contexte des flèches.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבֵרוּ
  choice: Aiguisez
  rationale: Dans ce contexte militaire, l’impératif appelle à préparer les flèches, probablement en les affûtant ou en les polissant. « Aiguisez » exprime naturellement cette préparation en français.
- source_word: הַחִצִּים
  choice: les flèches
  rationale: Équivalent direct et courant du nom hébreu défini au pluriel.
- source_word: מִלְאוּ הַשְּׁלָטִים
  choice: saisissez les boucliers
  rationale: שְׁלָטִים désigne normalement des boucliers. Le sens strict de מִלְאוּ est « remplissez », mais cette formulation est obscure avec « boucliers » ; « saisissez » restitue l’appel à s’en équiper pour le combat, tout en signalant l’incertitude en note.
- source_word: הֵעִיר
  choice: a éveillé
  rationale: Le hiphil de עור exprime ici le fait de susciter ou de mettre en mouvement. « A éveillé » conserve l’image hébraïque et convient à « l’esprit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: רוּחַ
  choice: l’esprit
  rationale: Le mot désigne ici la disposition intérieure ou l’élan qui pousse les rois à agir. « Esprit » conserve l’étendue sémantique du terme hébreu.
- source_word: מַלְכֵי מָדַי
  choice: les rois des Mèdes
  rationale: « Les Mèdes » est la désignation française naturelle du peuple mentionné par l’hébreu.
- source_word: מְזִמָּתוֹ
  choice: son projet
  rationale: Le nom exprime un dessein intentionnel. « Projet » est clair et ne renforce pas inutilement la nuance négative que peut parfois porter le mot.
- source_word: לְהַשְׁחִיתָהּ
  choice: de la détruire
  rationale: Le suffixe féminin renvoie à Babylone. Le pronom français « la » respecte naturellement ce genre sans imposer une personnification plus marquée que l’original.
- source_word: נִקְמַת יְהוָה
  choice: la vengeance de Yahweh
  rationale: La construction nominal est conservée, avec sa solennité et son attribution explicite de la vengeance à Yahweh.
- source_word: נִקְמַת הֵיכָלוֹ
  choice: la vengeance pour son temple
  rationale: La répétition de « vengeance » est maintenue. « Pour son temple » indique que la destruction de Babylone répond à ce qui a été fait au temple.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin au lieu de le remplacer par un titre.
- issue: Agent de la mobilisation des rois mèdes
  choice: Yahweh a éveillé leur esprit
  alternative: Les rois des Mèdes se sont mis en mouvement
  rationale: La forme causative attribue explicitement à Yahweh l’impulsion qui les met en action ; la traduction conserve cette causalité sans la réduire à une simple permission.
- issue: Sens de la vengeance liée au temple
  choice: vengeance pour son temple
  alternative: vengeance de son temple
  rationale: Le texte associe étroitement la vengeance au temple sans expliciter entièrement la relation. « Pour son temple » indique qu’il s’agit de venger sa profanation ou sa destruction, sans faire du temple l’agent de la vengeance.
translation_notes:
  register: Français international moderne, direct et solennel. Les impératifs sont vifs, la répétition finale de « vengeance » est conservée, et l’ambiguïté de l’expression concernant les boucliers ou les carquois est signalée sans alourdir le texte principal.
