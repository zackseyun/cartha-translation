  variant: modern international French
source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/015.yaml
  text: He made the earth by his power[a], he established the world by his wisdom, and by his understanding he stretched out the heavens.
translation:
  language: fr
  text: Il a fait la terre par sa puissance, il a affermi le monde[a] par sa sagesse, et il a étendu les cieux par son intelligence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde habité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: a fait
  rationale: Le participe peut désigner l’action créatrice caractéristique de Dieu. Le passé composé exprime naturellement en français l’acte de création évoqué ici, tout en s’accordant avec le verbe accompli de la dernière proposition.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le cadre cosmique et le parallèle avec les cieux indiquent la terre entière plutôt qu’un territoire particulier.
- source_word: בְּכֹחוֹ
  choice: par sa puissance
  rationale: La préposition בְּ a ici une valeur instrumentale; «puissance» rend directement כֹּחַ dans ce contexte de création.
- source_word: מֵכִין
  choice: a affermi
  rationale: La forme hiphil de כון évoque l’établissement ferme et stable du monde; «affermi» conserve mieux cette nuance que le seul verbe «établi».
- source_word: תֵּבֵל
  choice: le monde
  rationale: תֵּבֵל désigne le monde ordonné, souvent envisagé comme habité. «Le monde» est la formulation française la plus naturelle; la nuance plus explicite est signalée en note.
- source_word: בְּחָכְמָתוֹ
  choice: par sa sagesse
  rationale: La préposition est instrumentale, et «sagesse» est l’équivalent naturel de חָכְמָה.
- source_word: וּבִתְבוּנָתוֹ
  choice: et, par son intelligence
  rationale: «Intelligence» distingue תְּבוּנָה de la «sagesse» de la proposition précédente et en restitue l’idée de compréhension ou de discernement.
- source_word: נָטָה
  choice: a déployé
  rationale: Dans les textes de création, נטה décrit l’action d’étendre les cieux. «Déployé» est actuel, poétique et naturel en français.
- source_word: שָׁמָיִם
  choice: les cieux
  rationale: Le pluriel «les cieux» convient à la forme hébraïque et à la portée cosmique du verset.
theological_decisions:
- issue: Valeur temporelle des deux participes hébreux suivis d’un verbe à l’accompli
  choice: 'Rendre les trois actions au passé composé: «a fait… a affermi… a déployé».'
  alternative: 'Employer le présent pour les participes: «fait… affermit…», puis le passé pour «a déployé».'
  rationale: Les participes peuvent présenter Dieu comme celui qui accomplit ces œuvres de manière caractéristique, mais le passage célèbre ici ses actes créateurs. Le passé composé donne une phrase française cohérente sans ajouter de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme ternaire est conservé, de même que la distinction entre «sagesse» et «intelligence». Le marqueur de note est placé après le mot auquel la variante se rapporte.
