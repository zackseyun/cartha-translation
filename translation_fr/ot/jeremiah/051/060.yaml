reference: Jeremiah 51:60
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב יִרְמְיָ֗הוּ אֵ֧ת כָּל הָ/רָעָ֛ה אֲשֶׁר תָּב֥וֹא אֶל בָּבֶ֖ל אֶל סֵ֣פֶר אֶחָ֑ד אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה הַ/כְּתֻבִ֖ים אֶל בָּבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/060.yaml
  text: And Jeremiah wrote in a single scroll all the disaster that would come upon Babylon—all these words written against Babylon[a].
translation:
  language: fr
  text: Jérémie écrivit dans un seul rouleau tout le malheur qui devait s’abattre sur Babylone, toutes ces paroles écrites au sujet de Babylone[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre Babylone ». La préposition hébraïque peut indiquer ici que ces paroles ont Babylone pour objet ou qu’elles sont dirigées contre elle.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: écrivit
  rationale: Le wayyiqtol narratif de כתב exprime simplement l’action d’écrire; « écrivit » convient au récit en français soutenu mais courant.
- source_word: אֵת כָּל הָרָעָה
  choice: tout le malheur
  rationale: Dans ce contexte de jugement prophétique, רָעָה désigne la calamité qui frappe, non le mal moral. « Malheur » est naturel et garde la portée collective du singulier hébreu.
- source_word: אֲשֶׁר תָּבוֹא אֶל בָּבֶל
  choice: qui devait s’abattre sur Babylone
  rationale: Le sens littéral est « qui viendrait vers/sur Babylone »; en contexte de calamité, « s’abattre sur » exprime naturellement l’impact hostile en français.
- source_word: אֶל סֵפֶר אֶחָד
  choice: dans un seul rouleau
  rationale: סֵפֶר désigne ici vraisemblablement un rouleau ou document écrit, plutôt qu’un livre au sens moderne; אֶחָד souligne qu’il s’agit d’un seul rouleau.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דְּבָרִים renvoie ici aux paroles prophétiques précédentes; « paroles » conserve cette dimension verbale et textuelle.
- source_word: הַכְּתֻבִים
  choice: écrites
  rationale: Le participe passif qualifie directement les « paroles » et se rend avec concision par « écrites ».
- source_word: אֶל בָּבֶל
  choice: au sujet de Babylone
  rationale: Avec des paroles écrites, אֶל peut indiquer leur orientation ou leur objet. « Au sujet de » préserve une formulation large, tandis que le contexte permet aussi le sens plus adversatif « contre ».
theological_decisions:
- issue: Orientation des paroles prophétiques envers Babylone
  choice: au sujet de Babylone
  alternative: contre Babylone
  rationale: La préposition אֶל est souple. Le contexte de jugement favorise une nuance hostile, mais la préposition seule n’impose pas de résoudre cette nuance; le texte principal reste large et la variante contextuelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Rouleau » respecte le cadre matériel ancien; « s’abattre sur » rend idiomatiquement l’arrivée d’une calamité. La reprise finale, légèrement appositive, conserve la structure cumulative de l’hébreu.
