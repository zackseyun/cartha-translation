id: JER.51.30
reference: Jeremiah 51:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָדְלוּ֩ גִבּוֹרֵ֨י בָבֶ֜ל לְ/הִלָּחֵ֗ם יָֽשְׁבוּ֙ בַּ/מְּצָד֔וֹת נָשְׁתָ֥ה גְבוּרָתָ֖/ם הָי֣וּ לְ/נָשִׁ֑ים הִצִּ֥יתוּ מִשְׁכְּנֹתֶ֖י/הָ נִשְׁבְּר֥וּ בְרִיחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/030.yaml
  text: The warriors of Babylon have stopped fighting; they sit in the strongholds[a]. Their strength has failed; they have become like women. Her dwellings are set on fire; her bars are broken.
translation:
  language: fr
  text: Les guerriers de Babylone ont cessé de combattre ; ils restent dans les forteresses. Leur force s’est épuisée ; ils sont devenus des femmes[a]. On a incendié ses demeures ; les barres de ses portes ont été brisées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils sont devenus des femmes ». Il s’agit d’une raillerie guerrière de l’époque pour exprimer la perte de courage ou de force au combat.'
    reason: Explication d’une image culturelle ancienne susceptible d’être comprise littéralement ou comme une affirmation générale sur les femmes.
lexical_decisions:
- source_word: חָדְלוּ
  choice: ont cessé
  rationale: Le qal accompli exprime l’arrêt de l’action ; « ont cessé de combattre » est naturel et fidèle.
- source_word: גִבּוֹרֵי בָבֶל
  choice: les guerriers de Babylone
  rationale: Dans ce contexte militaire, גִבּוֹרִים désigne les combattants valeureux ou puissants de Babylone.
- source_word: לְהִלָּחֵם
  choice: de combattre
  rationale: Après חָדְלוּ, l’infinitif désigne l’activité à laquelle ils ont renoncé.
- source_word: יָשְׁבוּ בַּמְּצָדוֹת
  choice: ils restent dans les forteresses
  rationale: ישׁב peut signifier s’asseoir, demeurer ou rester ; ici, il décrit leur retrait passif dans des places fortifiées.
- source_word: נָשְׁתָה גְבוּרָתָם
  choice: leur force s’est épuisée
  rationale: Le verbe évoque une force tarie ou épuisée ; cette formulation conserve l’image de l’affaiblissement total.
- source_word: הָיוּ לְנָשִׁים
  choice: ils sont devenus des femmes
  rationale: La formulation garde la vigueur et la forme de la raillerie guerrière ancienne, sans la transformer silencieusement en simple paraphrase.
- source_word: הִצִּיתוּ מִשְׁכְּנֹתֶיהָ
  choice: On a incendié ses demeures
  rationale: L’hébreu emploie un pluriel actif dont le sujet n’est pas exprimé. Le pronom indéfini français conserve cette absence d’identification.
- source_word: נִשְׁבְּרוּ בְרִיחֶיהָ
  choice: les barres de ses portes ont été brisées
  rationale: בְּרִיחִים désigne les barres ou verrous qui ferment notamment les portes d’une ville ; l’explicitation « de ses portes » rend clairement la fonction défensive.
theological_decisions:
- issue: Portée de הָיוּ לְנָשִׁים
  choice: ils sont devenus des femmes
  alternative: ils sont devenus comme des femmes
  rationale: Il s’agit d’une raillerie prophétique fondée sur les représentations guerrières de l’époque et décrivant la perte de courage ou de puissance, non d’un changement littéral de sexe. Le texte principal préserve toutefois la formulation abrupte de l’hébreu, tandis que la note en explique la portée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme bref et les propositions parallèles conservent la vigueur de l’oracle. Le féminin singulier de « ses » renvoie à Babylone personnifiée.
