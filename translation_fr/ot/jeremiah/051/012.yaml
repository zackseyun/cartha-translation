  text: אֶל חוֹמֹ֨ת בָּבֶ֜ל שְׂאוּ נֵ֗ס הַחֲזִ֨יקוּ֙ הַ/מִּשְׁמָ֔ר הָקִ֨ימוּ֙ שֹֽׁמְרִ֔ים הָכִ֖ינוּ הָ/אֹֽרְבִ֑ים כִּ֚י גַּם זָמַ֣ם יְהוָ֔ה גַּם עָשָׂ֕ה אֵ֥ת אֲשֶׁר דִּבֶּ֖ר אֶל יֹשְׁבֵ֥י בָבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/012.yaml
  text: Against the walls of Babylon[a], lift up a signal; strengthen the watch; station watchmen; prepare the ambushes[c][b]. For Yahweh has both planned and done what he spoke against the inhabitants of Babylon.
translation:
  language: fr
  text: Contre les murailles de Babylone, dressez un signal[a] ! Renforcez la garde, postez des sentinelles, préparez les embuscades[b] ! Car Yahweh a projeté et accompli ce qu’il a dit aux habitants de Babylone[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « levez une bannière » ou « dressez un étendard ». Le mot hébreu נֵס désigne un signal élevé, notamment dans un contexte militaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « préparez ceux qui se tiennent en embuscade ». L’hébreu peut désigner soit les hommes embusqués, soit les embuscades elles-mêmes.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ce qu’il a dit aux habitants de Babylone » ; dans ce contexte, il s’agit d’une parole de jugement dirigée contre eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חוֹמֹת בָּבֶל
  choice: Face aux murailles de Babylone
  rationale: אֶל exprime ici la direction vers les murailles dans un contexte militaire. « Face aux » conserve cette orientation sans expliciter outre mesure l’idée d’hostilité.
- source_word: שְׂאוּ נֵס
  choice: dressez un signal
  rationale: נֵס désigne un signe visible élevé, souvent une bannière ou un étendard militaire. « Signal » reste clair et assez large pour préserver cette gamme de sens.
- source_word: הַחֲזִיקוּ הַמִּשְׁמָר
  choice: Renforcez la garde
  rationale: Le hifil de חזק signifie ici renforcer, tandis que מִשְׁמָר désigne le dispositif de garde ou de surveillance.
- source_word: הָקִימוּ שֹׁמְרִים
  choice: postez des sentinelles
  rationale: Le hifil de קום avec שֹׁמְרִים évoque la mise en place de personnes chargées de surveiller. « Poster des sentinelles » est idiomatique dans un cadre militaire.
- source_word: הָכִינוּ הָאֹרְבִים
  choice: préparez les embuscades
  rationale: הָאֹרְבִים peut désigner les hommes embusqués ou, par extension, les embuscades elles-mêmes. Le choix retenu est naturel en français, et l’ambiguïté est signalée en note.
- source_word: כִּי גַּם זָמַם יְהוָה גַּם עָשָׂה
  choice: Car Yahweh a décidé et accompli
  rationale: La construction corrélative גַּם…גַּם associe le dessein à sa réalisation. « Décidé et accompli » restitue avec concision le passage du projet à l’acte.
- source_word: אֵת אֲשֶׁר דִּבֶּר אֶל יֹשְׁבֵי בָבֶל
  choice: ce qu’il avait annoncé aux habitants de Babylone
  rationale: אֶל signifie normalement « à, vers ». La traduction maintient cette valeur directionnelle, tout en laissant la note préciser que la parole est, dans le contexte, un jugement visant Babylone.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle en français plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme, nom propre du Dieu d’Israël. Sa translittération préserve cette distinction sans ajouter une interprétation confessionnelle.
- issue: Destinataire ou cible de la parole divine
  choice: annoncé aux habitants de Babylone
  alternative: déclaré contre les habitants de Babylone
  rationale: La préposition אֶל a naturellement le sens de « à », mais le contexte est celui d’une parole de jugement dirigée contre Babylone. Le texte principal conserve la syntaxe hébraïque, tandis que la note expose la portée contextuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La série d’impératifs brefs conserve le rythme militaire du texte hébreu. Les termes « garde », « sentinelles » et « embuscades » sont courants et précis.
