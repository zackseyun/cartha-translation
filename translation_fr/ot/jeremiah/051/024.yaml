source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֨י לְ/בָבֶ֜ל וּ/לְ/כֹ֣ל יוֹשְׁבֵ֣י כַשְׂדִּ֗ים אֵ֧ת כָּל רָעָתָ֛/ם אֲשֶׁר עָשׂ֥וּ בְ/צִיּ֖וֹן לְ/עֵֽינֵי/כֶ֑ם נְאֻ֖ם יְהוָֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/024.yaml
  text: And I will repay Babylon and all the inhabitants of Chaldea for all their evil that they have done in Zion before your eyes[a], declares Yahweh.
translation:
  language: fr
  text: Je ferai payer à Babylone et à tous les habitants de la Chaldée tout le mal qu’ils ont fait dans Sion sous vos yeux[a], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le tort qu’ils ont causé ». Le terme hébreu peut mettre l’accent soit sur le mal moral, soit sur les actes nuisibles eux-mêmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Je ferai payer
  rationale: Le piel de שׁלם exprime ici une rétribution en réponse aux actes commis. « Je ferai payer » est naturel en français moderne et conserve la force judiciaire de la formule.
- source_word: לְבָבֶל
  choice: à Babylone
  rationale: Nom propre rendu selon sa forme française usuelle; le complément indirect s’accorde avec « faire payer à ».
- source_word: וּלְכֹל יוֹשְׁבֵי כַשְׂדִּים
  choice: et à tous les habitants de la Chaldée
  rationale: יוֹשְׁבֵי désigne ceux qui habitent un lieu; « habitants de la Chaldée » rend clairement et dignement le sens territorial de כַשְׂדִּים dans ce contexte.
- source_word: אֵת כָּל רָעָתָם
  choice: tout le mal
  rationale: רָעָה peut désigner à la fois le mal moral et les actes nuisibles. « Tout le mal » préserve cette amplitude sans réduire le terme à la seule méchanceté ni au seul dommage.
- source_word: אֲשֶׁר עָשׂוּ בְצִיּוֹן
  choice: qu’ils ont fait dans Sion
  rationale: La traduction conserve le sens ordinaire de ב, « dans », et présente les actes comme commis sur place sans transformer explicitement Sion en complément hostile.
- source_word: לְעֵינֵיכֶם
  choice: sous vos yeux
  rationale: Expression française naturelle et vive pour des faits dont les destinataires ont été les témoins directs.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique solennelle נְאֻם tout en conservant le nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du tétragramme, qui préserve ici le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom propre sans importer une substitution traditionnelle par un titre.
- issue: Portée de רָעָה
  choice: tout le mal
  alternative: tout le tort
  rationale: Le contexte de jugement permet une lecture à la fois morale et factuelle. « Mal » maintient cette tension, tandis que « tort » mettrait surtout l’accent sur le préjudice.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve les rapports du texte hébreu tout en évitant une formulation archaïque. « Chaldée » est retenu comme nom géographique français traditionnel et encore intelligible.
