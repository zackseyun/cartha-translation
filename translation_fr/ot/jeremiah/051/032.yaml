base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/032.yaml
  text: The crossings have been seized[a], the marshes have been burned with fire[c][b], and the men of war are terrified.
translation:
  language: fr
  text: Les points de passage ont été pris[a], les marais ont été brûlés par le feu, et les hommes de guerre sont saisis de panique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gués ont été pris ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבָּרוֹת
  choice: les points de passage
  rationale: מַעְבָּרוֹת désigne des lieux où l’on traverse, probablement ici des passages fluviaux stratégiques autour de Babylone. « Points de passage » reste naturel et plus large que « gués ».
- source_word: נִתְפָּשׂוּ
  choice: ont été pris
  rationale: Le nifal de תפש exprime le fait d’être pris ou occupé. « Ont été pris » conserve la voix passive et convient à un compte rendu militaire.
- source_word: הָאֲגַמִּים
  choice: les marais
  rationale: אֲגַמִּים peut désigner des étendues d’eau marécageuses ou des zones humides. « Marais » correspond au contexte géographique et à ce qui peut être incendié, notamment sa végétation.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: ont été incendiés
  rationale: L’hébreu emploie un actif pluriel à sujet indéfini, littéralement « ils ont brûlé par le feu ». Le passif français maintient la série de calamités et « incendiés » rend naturellement l’idée sans la redondance de « brûlés par le feu ».
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les hommes de guerre
  rationale: L’expression signifie littéralement « les hommes de la guerre ». Ce choix conserve sa forme masculine et son registre militaire.
- source_word: נִבְהָלוּ
  choice: sont saisis de panique
  rationale: Le nifal de בהל évoque l’effroi, l’affolement ou la consternation soudaine. « Sont saisis de panique » restitue clairement cette intensité en français actuel.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La construction en trois propositions conserve le rythme du rapport de catastrophe. Une seule note est retenue pour l’ambiguïté stratégique de מַעְבָּרוֹת ; les autres choix sont rendus naturellement dans le texte sans surcharge.
