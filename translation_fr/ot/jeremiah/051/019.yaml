  rationale: La révision conserve l’ellipse difficile du texte massorétique en signalant entre crochets le sujet contextuellement sous-entendu, au lieu d’introduire sans marque « Jacob » ou « Israël ». Elle rend directement le titre divin et emploie « héritage », terme français plus exact dans ce contexte.
