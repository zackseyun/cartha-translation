  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲק֗וֹב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/שֵׁ֖בֶט נַחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/019.yaml
  text: Not like these is the Portion of Jacob[a], for he is the one who formed everything, and Israel is the tribe of his inheritance[c][b]; Yahweh of Armies is his name.
translation:
  language: fr
  text: La part de Jacob[a] n’est pas comme celles-ci, car c’est lui qui façonne tout, et [Jacob est] la tribu de son héritage[b]. Yahvé des armées est son nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « la part qui appartient à Jacob ». Dans le contexte, elle désigne plus probablement Yahvé comme la part attribuée à Jacob.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et la tribu de son héritage ». Le texte hébreu ne donne pas de sujet explicite dans ce membre; « Jacob » est sous-entendu d’après le contexte. Le parallèle en Jérémie 10.16 porte explicitement « Israël est la tribu de son héritage », mais « Israël » ne figure pas dans le texte hébreu de ce verset.'
    reason: textual_and_syntactic_clarification
  - marker: c
    text: 'Traduction traditionnelle : « le Seigneur des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כְאֵלֶּה
  choice: ne ressemble pas à ces choses
  rationale: Le démonstratif pluriel renvoie directement aux idoles du contexte. « Ces choses » conserve leur dépréciation implicite sans les désigner comme des personnes.
- source_word: חֵלֶק יַעֲקֹב
  choice: la part de Jacob
  rationale: La formule désigne vraisemblablement Yahvé comme la part attribuée à Jacob, par opposition aux idoles. Le français garde toutefois la structure concise et son ambiguïté grammaticale.
- source_word: יוֹצֵר הַכֹּל
  choice: celui qui a tout façonné
  rationale: Le participe יוֹצֵר évoque l’action de former ou façonner. Cette formulation actuelle souligne le contraste entre le Créateur et les idoles façonnées par des humains.
- source_word: וְשֵׁבֶט נַחֲלָתוֹ
  choice: et Jacob est la tribu qui constitue son patrimoine
  rationale: שֵׁבֶט signifie ici « tribu », et נַחֲלָה désigne ce qui appartient en propre, le patrimoine ou domaine attribué. Le sujet « Jacob » est repris du membre précédent pour rendre en français une proposition intelligible, sans importer le nom « Israël » absent du texte hébreu fourni.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le Dieu des armées
  rationale: « Yahvé » rend directement le nom divin. L’ajout explicatif « le Dieu » produit une expression française naturelle, tandis que « des armées » rend צְבָאוֹת de façon transparente pour le lecteur moderne.
- source_word: שְׁמוֹ
  choice: tel est son nom
  rationale: Cette tournure française restitue naturellement la proposition nominale hébraïque et son caractère solennel.
theological_decisions:
- issue: Sens de « la part de Jacob »
  choice: Comprendre principalement Yahvé comme la part attribuée à Jacob, tout en conservant la formulation ambiguë
  alternative: Comprendre la phrase comme désignant une part possédée par Jacob
  rationale: Le contraste avec les idoles et la proposition « c’est lui qui a tout façonné » favorisent fortement l’identification de la « part » à Yahvé, mais la construction nominale hébraïque autorise formellement les deux lectures.
- issue: Sujet sous-entendu de וְשֵׁבֶט נַחֲלָתוֹ
  choice: Reprendre « Jacob » comme sujet en français
  alternative: Ajouter « Israël » d’après Jérémie 10.16 et certaines versions anciennes, ou conserver le syntagme nominal incomplet
  rationale: Le texte massorétique fourni ne contient pas le nom « Israël ». La reprise de « Jacob » explicite le rapport logique nécessaire en français sans harmoniser silencieusement ce verset avec son parallèle.
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur ou Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahvé » le représente directement et reste une forme française largement intelligible.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. « Façonné » conserve l’image artisanale du verbe hébreu; « patrimoine » exprime ici un bien propre reçu ou possédé, non un simple héritage futur. Les notes signalent les deux principales difficultés du texte sans harmoniser silencieusement avec Jérémie 10.16.
