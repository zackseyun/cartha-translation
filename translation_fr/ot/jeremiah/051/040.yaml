  text: אֽוֹרִידֵ֖/ם כְּ/כָרִ֣ים לִ/טְב֑וֹחַ כְּ/אֵילִ֖ים עִם עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/040.yaml
  text: I will bring them down like lambs to the slaughter[a], like rams with male goats.
translation:
  language: fr
  text: Je les ferai descendre comme des agneaux pour être abattus[a], comme des béliers avec des boucs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme de jeunes béliers » pour כָּרִים.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹרִידֵם
  choice: Je les ferai descendre
  rationale: Le hifil de ירד exprime l’action de faire descendre ou de conduire vers le bas. Cette formulation conserve la valeur causative et s’accorde avec l’image d’animaux menés à l’abattage.
- source_word: כְּכָרִים
  choice: comme des agneaux
  rationale: כָּרִים peut désigner des agneaux ou de jeunes béliers. « Agneaux » est naturel dans ce contexte et évoque clairement des animaux conduits à l’abattage, sans effacer l’autre possibilité, signalée en note.
- source_word: לִטְבֹחַ
  choice: pour être abattus
  rationale: L’infinitif construit de טבח désigne l’action d’abattre. La tournure française exprime naturellement la destination funeste des animaux sans ajouter de détail absent de l’hébreu.
- source_word: כְּאֵילִים
  choice: comme des béliers
  rationale: אֵילִים désigne directement des béliers; le terme français conserve l’image animale et la distinction lexicale avec כָּרִים.
- source_word: עִם עַתּוּדִים
  choice: avec des boucs
  rationale: עַתּוּדִים désigne des chèvres mâles. « Boucs » est le terme français courant, précis et idiomatique.
