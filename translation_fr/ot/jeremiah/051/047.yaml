  text: לָ/כֵן֙ הִנֵּ֣ה יָמִ֣ים בָּאִ֔ים וּ/פָקַדְתִּי֙ עַל פְּסִילֵ֣י בָבֶ֔ל וְ/כָל אַרְצָ֖/הּ תֵּב֑וֹשׁ וְ/כָל חֲלָלֶ֖י/הָ יִפְּל֥וּ בְ/תוֹכָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/047.yaml
  text: Therefore, look, days are coming when I will punish the carved images of Babylon, and all her land will be put to shame, and all her slain will fall in her midst.
translation:
  language: fr
  text: C’est pourquoi, voici que des jours viennent où je punirai les images sculptées de Babylone ; toute sa terre sera humiliée, et tous ses morts tomberont au milieu d’elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement la conséquence introduite par l’hébreu.
- source_word: הִנֵּה יָמִים בָּאִים
  choice: voici que des jours viennent
  rationale: Conserve la formule prophétique et sa force d’annonce dans un français digne et compréhensible.
- source_word: וּפָקַדְתִּי עַל
  choice: j’interviendrai contre
  rationale: Le verbe פקד avec עַל indique ici une intervention punitive; cette traduction en conserve la portée sans réduire le sens à un seul mécanisme de châtiment.
- source_word: פְּסִילֵי בָבֶל
  choice: les statues sculptées de Babylone
  rationale: פְּסִילִים désigne des représentations taillées ou sculptées, dans ce contexte des idoles; le rendu concret évite d’ajouter au texte un qualificatif explicatif.
- source_word: תֵּבוֹשׁ
  choice: sera couvert de honte
  rationale: Rend l’idée d’humiliation publique attachée à בוש; le sujet collectif « tout son pays » est conservé.
- source_word: חֲלָלֶיהָ
  choice: ceux qu’on y aura tués
  rationale: חלל désigne des personnes tuées ou transpercées, souvent des victimes tombées au combat; la formulation française reste naturelle et évite l’ambiguïté de « ses tués ».
- source_word: בְתוֹכָהּ
  choice: au milieu d’elle
  rationale: Conserve la personnification féminine de Babylone et la correspondance pronominale de l’hébreu.
theological_decisions:
- issue: Nature des statues sculptées de Babylone
  choice: Traduction concrète « statues sculptées »
  alternative: « idoles » ou « images taillées »
  rationale: Le contexte implique des objets cultuels, mais le terme source décrit d’abord des représentations sculptées; le choix conserve cette précision sans explicitation confessionnelle.
- issue: Portée de פקד dans l’action divine
  choice: « j’interviendrai contre »
  alternative: « je punirai » ou « je demanderai des comptes à »
  rationale: Dans ce contexte de jugement, l’intervention est punitive. Le rendu choisi préserve toutefois la largeur sémantique du verbe hébreu.
translation_notes:
  register: Français international moderne, prophétique et solennel sans archaïsmes. La répétition de « tout » et la personnification de Babylone sont maintenues; la seconde phrase allège la longue coordination hébraïque sans modifier sa progression.
