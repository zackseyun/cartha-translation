revisions:
- from: C’est pourquoi, voici que des jours viennent où j’interviendrai contre les statues sculptées de Babylone. Tout son pays sera couvert de honte, et tous ceux qu’on y aura tués tomberont au milieu d’elle.
  to: C’est pourquoi, voici que des jours viennent où je punirai les images sculptées de Babylone ; toute sa terre sera humiliée, et tous ses morts tomberont au milieu d’elle.
  rationale: La révision conserve l’annonce prophétique et la personnification féminine de Babylone, tout en rendant plus explicitement le jugement de פקד על. Elle rétablit aussi la relation possessive de « ses morts » et le locatif final « au milieu d’elle », sans explicitation doctrinale ni note nécessaire.
