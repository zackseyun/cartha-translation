source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלֶ֜י/ךָ הַ֤ר הַ/מַּשְׁחִית֙ נְאֻם יְהוָ֔ה הַ/מַּשְׁחִ֖ית אֶת כָּל הָ/אָ֑רֶץ וְ/נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וְ/גִלְגַּלְתִּ֨י/ךָ֙ מִן הַ/סְּלָעִ֔ים וּ/נְתַתִּ֖י/ךָ לְ/הַ֥ר שְׂרֵפָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/025.yaml
  text: Behold, I am against you, O destroying mountain, declares Yahweh, which destroys the whole earth. I will stretch out my hand against you, and roll you down from the crags, and make you a burned mountain.
translation:
  language: fr
  text: Me voici contre toi, montagne dévastatrice, déclare Yahweh, toi qui dévastes toute la terre[a]. J’étendrai ma main contre toi, je te ferai rouler du haut des rochers et je ferai de toi une montagne brûlée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le pays ». Le mot hébreu peut désigner soit un pays, soit la terre entière, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « une montagne en feu » ou « une montagne consumée par le feu ». L’expression hébraïque est concise et peut mettre l’accent soit sur l’embrasement, soit sur l’état qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: Me voici contre toi
  rationale: Cette tournure conserve la solennité de הִנְנִי et exprime clairement l’opposition introduite par אֵלֶיךָ.
- source_word: הַר הַמַּשְׁחִית
  choice: montagne dévastatrice
  rationale: « Montagne » maintient l’image métaphorique appliquée à Babylone, tandis que « dévastatrice » conserve la force active du participe.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » rend naturellement la formule prophétique, et « Yahweh » représente directement le nom divin.
- source_word: הַמַּשְׁחִית אֶת כָּל הָאָרֶץ
  choice: toi qui dévastes toute la terre
  rationale: La proposition relative reproduit la répétition du participe et identifie la montagne par son action. « Terre » garde ici la portée universelle du discours, sans effacer l’autre sens possible de אֶרֶץ.
- source_word: וְנָטִיתִי אֶת יָדִי עָלֶיךָ
  choice: J’étendrai ma main contre toi
  rationale: Cette formulation préserve l’image biblique de l’action divine en jugement et l’idée explicite d’hostilité.
- source_word: וְגִלְגַּלְתִּיךָ מִן הַסְּלָעִים
  choice: je te ferai rouler du haut des rochers
  rationale: Le causatif français « ferai rouler » exprime naturellement le mouvement subi; « du haut des rochers » rend explicite en français le mouvement depuis les hauteurs rocheuses suggéré par l’image.
- source_word: וּנְתַתִּיךָ לְהַר שְׂרֵפָה
  choice: je ferai de toi une montagne brûlée
  rationale: Cette traduction conserve la construction résultative et rend שְׂרֵפָה par l’état produit, tout en signalant en note la formulation compacte et ambiguë.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le Tétragramme; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Portée de הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: Le contexte présente Babylone comme une puissance dévastant largement les nations; « terre » préserve cette rhétorique étendue, tandis qu’une note maintient l’ambiguïté lexicale.
- issue: Nature de la « montagne »
  choice: maintien de la métaphore
  alternative: interprétation explicite comme Babylone
  rationale: Le verset s’adresse métaphoriquement à Babylone sans la nommer ici; traduire l’image plutôt que son référent évite de résoudre ce que le texte exprime poétiquement.
translation_notes:
  register: Français international moderne, solennel et direct. L’apostrophe prophétique et les images concrètes du texte hébreu sont conservées; la répétition de « contre toi » maintient son insistance rhétorique.
