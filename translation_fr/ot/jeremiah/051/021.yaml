  text: וְ/נִפַּצְתִּ֣י בְ/ךָ֔ ס֖וּס וְ/רֹֽכְב֑/וֹ וְ/נִפַּצְתִּ֣י בְ/ךָ֔ רֶ֖כֶב וְ/רֹכְבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/021.yaml
  text: And with you I shattered horse and rider[c][b][a]; and with you I shattered chariot and rider.
translation:
  language: fr
  text: Par toi[b], j’ai fracassé[a] le cheval et son cavalier ; par toi, j’ai fracassé le char[c] et son conducteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai brisé en morceaux » ; le verbe hébreu évoque une destruction violente.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec toi » ou « au moyen de toi » ; la préposition hébraïque exprime ici le moyen ou l’instrument.
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut aussi désigner collectivement les chars, mais la construction au singulier favorise ici « le char ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: j’ai fracassé
  rationale: Le piel de נָפַץ exprime une mise en pièces violente. « J’ai fracassé » conserve la force de l’image guerrière et se répète naturellement en français.
- source_word: בְךָ
  choice: par toi
  rationale: Dans ce contexte, la préposition בְּ marque le moyen ou l’instrument. « Par toi » maintient Dieu comme sujet de l’action et l’interlocuteur comme instrument, sans préciser davantage son identité.
- source_word: סוּס
  choice: le cheval
  rationale: Le nom signifie simplement « cheval ». Le contexte est militaire, mais l’ajout de « de guerre » serait plus explicite que l’hébreu.
- source_word: רֹכְבוֹ
  choice: son cavalier
  rationale: Le participe désigne celui qui monte. Avec « cheval », « son cavalier » est le rendu français le plus naturel et conserve le suffixe possessif.
- source_word: רֶכֶב
  choice: le char
  rationale: רֶכֶב peut désigner un char ou, collectivement, les chars. Ici, le singulier accompagné de « son conducteur » favorise « le char ».
- source_word: רֹכְבוֹ
  choice: son conducteur
  rationale: Le même participe signifie littéralement celui qui monte ou conduit. Avec un char, « son conducteur » est naturel sans introduire le terme plus spécialisé « aurige ».
theological_decisions:
- issue: L’interlocuteur comme instrument du jugement divin
  choice: « Par toi, j’ai fracassé »
  alternative: « Avec toi, j’ai fracassé » ou « au moyen de toi, j’ai fracassé »
  rationale: Les verbes à la première personne présentent Dieu comme l’auteur de l’action, tandis que בְךָ indique l’instrument. Le rendu préserve cette relation sans identifier l’interlocuteur à l’intérieur du verset.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure parallèle de l’hébreu et la répétition de « par toi, j’ai fracassé » sont conservées. Les articles définis rendent naturellement en français les catégories militaires exprimées sans article en hébreu.
