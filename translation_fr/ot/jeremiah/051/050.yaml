id: JER.51.50
reference: Jeremiah 51:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פְּלֵטִ֣ים מֵ/חֶ֔רֶב הִלְכ֖וּ אַֽל תַּעֲמֹ֑דוּ זִכְר֤וּ מֵֽ/רָחוֹק֙ אֶת יְהוָ֔ה וִ/ירֽוּשָׁלִַ֖ם תַּעֲלֶ֥ה עַל לְבַבְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/050.yaml
  text: You who have escaped the sword[a], go; do not stand still. Remember Yahweh from far away, and let Jerusalem come upon your heart.
translation:
  language: fr
  text: Vous qui avez échappé à l’épée, partez, ne vous arrêtez pas ! De loin, souvenez-vous de Yahweh, et que Jérusalem vous revienne au cœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « que Jérusalem monte sur votre cœur », expression qui évoque le souvenir et la préoccupation intérieure. On peut aussi traduire : « que Jérusalem vous vienne à l’esprit ».'
    reason: La note signale l’image hébraïque et son autre rendu idiomatique possible.
lexical_decisions:
- source_word: פְּלֵטִים מֵחֶרֶב
  choice: Vous qui avez échappé à l’épée
  rationale: Le participe passif pluriel employé comme adresse désigne ceux qui ont survécu à la violence guerrière; cette formulation rend clairement l’interpellation.
- source_word: הִלְכוּ אַל תַּעֲמֹדוּ
  choice: partez, ne vous arrêtez pas
  rationale: Dans ce contexte de fuite, les impératifs appellent à poursuivre son départ sans s’attarder; «partez» et «ne vous arrêtez pas» sont naturels en français moderne.
- source_word: זִכְרוּ מֵרָחוֹק
  choice: De loin, souvenez-vous
  rationale: La place de «De loin» conserve sa portée possible sur l’acte de se souvenir tout en évoquant l’éloignement géographique.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre «Yahweh», conformément à sa fonction de nom divin dans le texte source.
- source_word: וִירוּשָׁלִַם תַּעֲלֶה עַל לְבַבְכֶם
  choice: que Jérusalem vous revienne au cœur
  rationale: L’hébreu dit littéralement que Jérusalem «monte sur votre cœur». La formulation française préserve l’image du cœur et exprime naturellement le souvenir ainsi que l’attachement intérieur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme; la translittération maintient le caractère personnel et distinctif du nom sans lui substituer un titre.
- issue: Portée de מֵרָחוֹק («de loin»)
  choice: Rattachement à «souvenez-vous de Yahweh»
  alternative: Comprendre l’expression comme une indication générale de la situation des fugitifs éloignés
  rationale: L’ordre des mots favorise le lien avec l’impératif «souvenez-vous», mais la construction garde une certaine souplesse; la traduction évite de préciser davantage.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement pluriel est rendu par «vous». La ponctuation souligne l’urgence des impératifs sans ajouter de contenu.
