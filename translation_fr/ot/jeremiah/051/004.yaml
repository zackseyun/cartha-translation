  text: And the slain will fall in the land of the Chaldeans[b][a], and the pierced in her streets.
translation:
  language: fr
  text: Des tués tomberont dans le pays des Chaldéens[a], et des transpercés dans ses rues[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en Chaldée » ou « dans le pays des Babyloniens ». L’hébreu dit littéralement « dans le pays des Chaldéens ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sur ses places » ou « dans ses lieux ouverts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפְלוּ
  choice: tomberont
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction annonce naturellement en français l’issue future du jugement.
- source_word: חֲלָלִים
  choice: des victimes
  rationale: Le nom désigne des personnes tuées ou mortellement blessées. « Victimes » est naturel en français et évite la tournure peu idiomatique « les tués », tout en conservant le sens collectif.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: dans le pays des Chaldéens
  rationale: Cette formulation reproduit l’ethnonyme explicite et la construction hébraïque sans lui substituer d’emblée « Babyloniens » ou « Chaldée ».
- source_word: וּמְדֻקָּרִים
  choice: et des hommes transpercés
  rationale: Le participe passif évoque des personnes percées par une arme. L’ajout de « hommes » rend la substantivation naturelle en français et maintient le parallélisme avec les victimes.
- source_word: בְּחוּצוֹתֶיהָ
  choice: dans ses rues
  rationale: Le terme peut désigner les rues, les places ou les espaces ouverts d’une ville. « Rues » est ici le rendu français le plus naturel; le possessif féminin renvoie au pays ou à la ville personnifiée.
