  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּ֥עַל נְשִׂאִ֖ים מִ/קְצֵה אָ֑רֶץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יֹּ֥צֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/016.yaml
  text: At the sound of his voice, a multitude of waters is in the heavens; he makes clouds rise from the ends of the earth; he makes lightning for the rain, and brings out the wind from his storehouses.
translation:
  language: fr
  text: Quand il fait entendre sa voix, il y a un tumulte d’eaux dans le ciel ; il fait monter les nuages[a] des extrémités de la terre ; il produit les éclairs pour la pluie et fait sortir le vent de ses réserves[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vapeurs » ou « les brumes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de ses trésors » ou « de ses entrepôts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: Quand il fait entendre sa voix
  rationale: Littéralement, « au son de son donner [sa voix] ». La tournure française rend naturellement l’idiome hébreu נתן קול sans préciser explicitement que la voix est le tonnerre.
- source_word: הֲמוֹן מַיִם
  choice: les eaux grondent
  rationale: הֲמוֹן peut évoquer une masse, une abondance ou un tumulte sonore. Dans ce tableau d’orage, « grondent » restitue naturellement la dimension acoustique tout en gardant les eaux comme sujet de l’image.
- source_word: בַּשָּׁמַיִם
  choice: dans le ciel
  rationale: Dans ce contexte météorologique, שָׁמַיִם désigne naturellement le ciel. Le singulier collectif est courant en français moderne.
- source_word: נְשִׂאִים
  choice: les nuages
  rationale: Le terme peut désigner des nuages, des brumes ou des vapeurs. « Nuages » convient le mieux au contexte de pluie et d’éclairs ; l’autre possibilité est signalée en note.
- source_word: מִקְצֵה אָרֶץ
  choice: des extrémités de la terre
  rationale: Cette expression biblique désigne les régions les plus lointaines du monde. La formulation conserve l’image spatiale hébraïque.
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  choice: il produit les éclairs pour la pluie
  rationale: La traduction conserve le lien exprimé par ל entre les éclairs et la pluie, sans le réduire à une simple simultanéité. Le présent rend l’action caractéristique décrite dans ce passage poétique.
- source_word: וַיֹּצֵא רוּחַ
  choice: fait sortir le vent
  rationale: Le contexte météorologique détermine ici le sens « vent » de רוּחַ. La formulation préserve l’image d’un vent tiré d’un lieu où il était gardé.
- source_word: מֵאֹצְרֹתָיו
  choice: de ses réserves
  rationale: אֹצָר désigne un dépôt, une réserve ou un trésor. « Réserves » est clair en français actuel et conserve l’idée de lieux divins où le vent est tenu en réserve.
theological_decisions:
- issue: Représentation poétique de la maîtrise divine des phénomènes météorologiques
  choice: Conserver les eaux dans le ciel, les nuages qui montent, les éclairs liés à la pluie et le vent tiré des réserves divines.
  alternative: Reformuler le verset comme une affirmation générale selon laquelle Dieu provoque les orages.
  rationale: Le texte hébreu affirme la souveraineté de Dieu par des images cosmologiques et météorologiques concrètes. Les conserver évite aussi bien de les rationaliser que de les transformer en description scientifique.
- issue: Identification de la voix divine au tonnerre
  choice: Traduire « sa voix » sans ajouter « tonnerre ».
  alternative: Traduire ou expliciter « sa voix de tonnerre ».
  rationale: Le contexte peut suggérer le tonnerre, mais le texte dit « sa voix ». La traduction maintient cette tension poétique et théologique sans explicitation interprétative.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe en quatre mouvements garde le rythme poétique du verset. « Les eaux grondent » privilégie une expression française naturelle qui rend la valeur tumultueuse possible de הֲמוֹן.
