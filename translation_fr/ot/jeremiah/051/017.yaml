source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/017.yaml
  text: Every man is made brutish[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is falsehood, and there is no breath in them.
translation:
  language: fr
  text: Tout être humain est abruti, dépourvu de connaissance ; tout artisan du métal est couvert de honte à cause de son idole, car son image coulée est un mensonge, et il n’y a en elles aucun souffle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun esprit ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit » ; ici, « souffle » souligne que les idoles sont sans vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: est abruti
  rationale: Le niphal de בער exprime ici l’état d’une personne devenue obtuse ou privée de discernement. « Est abruti » garde la vigueur accusatrice du langage prophétique sans employer le plus plat « est stupide ».
- source_word: כָּל אָדָם
  choice: tout être humain
  rationale: אָדָם désigne ici l’être humain de manière générique. Cette formulation française naturelle conserve la portée universelle et distributive de l’hébreu.
- source_word: מִדַּעַת
  choice: privé de connaissance
  rationale: 'Le מִן a ici une valeur privative : l’être humain est présenté comme dépourvu de connaissance.'
- source_word: הֹבִישׁ
  choice: est couvert de honte
  rationale: Le hiphil de בוש exprime le fait d’être exposé à la honte ou déshonoré ; cette tournure française rend la force causative dans le contexte.
- source_word: צֹרֵף
  choice: artisan du métal
  rationale: Le participe désigne celui qui fond, affine ou travaille le métal. Le contexte de fabrication d’idoles favorise le terme générique « artisan du métal ».
- source_word: מִפָּסֶל
  choice: par son idole
  rationale: פֶּסֶל désigne une image cultuelle ou idole, et מִן indique ici ce qui occasionne la honte.
- source_word: שֶׁקֶר
  choice: mensonge
  rationale: Le nom qualifie directement l’image coulée comme une réalité fausse et trompeuse ; « mensonge » restitue la concision et la vigueur de l’hébreu.
- source_word: נִסְכּוֹ
  choice: son image coulée
  rationale: Le terme désigne une représentation fabriquée par coulage du métal. « Image coulée » distingue naturellement celle-ci de l’idole mentionnée auparavant.
- source_word: וְלֹא רוּחַ בָּם
  choice: il n’y a en elles aucun souffle
  rationale: רוּחַ peut désigner le souffle, le vent ou l’esprit. Dans cette dénonciation d’idoles inertes, « souffle » met clairement en avant leur absence de vie ; le pluriel renvoie collectivement aux représentations idolâtres.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: tout être humain
  alternative: tout homme
  rationale: Le singulier אָדָם a ici une valeur représentative et universelle. En français moderne, « tout être humain » exprime cette portée sans faire croire que seuls les hommes de sexe masculin sont visés.
- issue: Sens de רוּחַ dans la polémique contre les idoles
  choice: souffle
  alternative: esprit
  rationale: Le contexte oppose implicitement les idoles aux êtres vivants. « Souffle » rend donc au mieux l’idée d’absence de vie, tout en signalant en note l’autre sens possible du mot hébreu.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme et le ton accusateur de l’oracle sont conservés. « Est abruti » est volontairement fort, tandis que « artisan du métal » reste accessible et évite de préciser indûment le type de métal.
