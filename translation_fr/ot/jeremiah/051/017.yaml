revisions:
- from: Tout être humain est abruti, privé de connaissance ; tout artisan du métal est couvert de honte par son idole, car son image coulée est mensonge, et il n’y a en elles aucun souffle[a].
  to: Tout être humain est abruti, dépourvu de connaissance ; tout artisan du métal est couvert de honte à cause de son idole, car son image coulée est un mensonge, et il n’y a en elles aucun souffle[a].
  rationale: La révision précise que l'idole est la cause de la honte du métallurgiste, conformément à la construction hébraïque, et effectue deux ajustements mineurs pour un français plus idiomatique. Elle préserve le ton de dénonciation prophétique, l'ambiguïté lexicale de רוּחַ en note, et le pluriel final du texte source.
