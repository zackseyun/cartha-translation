source:
  edition: WLC
  text: בְּ/חֻמָּ֞/ם אָשִׁ֣ית אֶת מִשְׁתֵּי/הֶ֗ם וְ/הִשְׁכַּרְתִּי/ם֙ לְמַ֣עַן יַעֲלֹ֔זוּ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/039.yaml
  text: When they are heated, I will set out their drink and make them drunk, so that they may exult, then sleep an everlasting sleep and not wake up, declares Yahweh.
translation:
  language: fr
  text: Quand ils seront échauffés, je leur servirai à boire[a] et je les enivrerai, afin qu’ils exultent et s’endorment d’un sommeil perpétuel[b] et ne se réveillent pas — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « je leur préparerai un festin » ou « un banquet » : le terme hébreu peut désigner un banquet où l’on boit.'
    reason: lexical_alternative
  - marker: b
    text: Le « sommeil perpétuel » est ici une image hébraïque de la mort irréversible sous le jugement ; littéralement, « un sommeil de perpétuité ».
    reason: cultural_note
lexical_decisions:
- source_word: בְּחֻמָּם
  choice: Quand ils seront échauffés
  rationale: La préposition ב avec le nom « chaleur » et le suffixe de 3e personne du pluriel a ici une valeur circonstancielle et temporelle. « Échauffés » conserve l’image tout en pouvant évoquer l’excitation passionnée ou festive sans la préciser abusivement.
- source_word: אָשִׁית אֶת מִשְׁתֵּיהֶם
  choice: je leur servirai leur boisson
  rationale: שׂים signifie placer ou disposer; avec מִשְׁתֶּה, « servir leur boisson » est naturel en français et maintient le lien immédiat avec l’enivrement. Le nom peut aussi désigner un banquet où l’on boit.
- source_word: וְהִשְׁכַּרְתִּים
  choice: et je les enivrerai
  rationale: Le hiphil de שׁכר exprime le fait de rendre ivre. « Enivrer » est direct, digne et conserve explicitement l’action divine.
- source_word: לְמַעַן יַעֲלֹזוּ
  choice: afin qu’ils exultent
  rationale: לְמַעַן introduit le but; עלז exprime une joie intense. « Exulter » garde le registre prophétique et la possible ironie du contexte.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: puis s’endorment d’un sommeil perpétuel
  rationale: « Puis » rend la progression vers le sommeil sans supprimer la coordination. « Sommeil perpétuel » reproduit la métaphore hébraïque de שְׁנַת עוֹלָם et évite de la réduire directement au mot « mort ».
- source_word: וְלֹא יָקִיצוּ
  choice: et ne se réveillent pas
  rationale: La formulation française courante conserve littéralement l’image du sommeil et du réveil.
- source_word: נְאֻם יְהוָה
  choice: — déclaration de Yahweh
  rationale: La formule prophétique נְאֻם est rendue avec solennité, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée de שְׁנַת עוֹלָם dans ce jugement
  choice: un sommeil perpétuel
  alternative: une mort sans réveil
  rationale: La métaphore est conservée afin de maintenir la force poétique et la tension du texte. Une note explique qu’elle désigne ici une mort irréversible sans imposer au verset une doctrine plus développée de l’au-delà.
- issue: Nuance séquentielle de וְיָשְׁנוּ
  choice: puis s’endorment
  alternative: et s’endorment
  rationale: Le contexte décrit une progression de l’exultation provoquée par l’ivresse au sommeil fatal. « Puis » explicite légèrement cet enchaînement, tandis que la simple coordination demeure possible.
translation_notes:
  register: Français international moderne, naturel et digne, avec maintien de l’imagerie prophétique. Le futur après « quand » suit l’usage français. « Échauffés » conserve volontairement une certaine ambiguïté entre chaleur, excitation et ardeur festive.
