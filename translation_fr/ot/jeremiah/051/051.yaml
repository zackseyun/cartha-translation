source:
  edition: WLC
  text: בֹּ֚שְׁנוּ כִּֽי שָׁמַ֣עְנוּ חֶרְפָּ֔ה כִּסְּתָ֥ה כְלִמָּ֖ה פָּנֵ֑י/נוּ כִּ֚י בָּ֣אוּ זָרִ֔ים עַֽל מִקְדְּשֵׁ֖י בֵּ֥ית יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/051.yaml
  text: We are ashamed, for we have heard reproach; disgrace has covered our faces, for foreigners have come against the holy places of the house of the LORD.
translation:
  language: fr
  text: Nous avons honte, car nous avons entendu des insultes ; l’humiliation couvre nos visages, car des étrangers sont venus contre les lieux saints de la maison du SEIGNEUR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּשְׁנוּ
  choice: Nous sommes couverts de honte
  rationale: Exprime naturellement en français l’état de honte indiqué par le verbe hébreu, tout en faisant écho à l’image du visage couvert dans la proposition suivante.
- source_word: חֶרְפָּה
  choice: les insultes
  rationale: Dans ce contexte, le terme désigne l’outrage verbal et le déshonneur entendu ; « insultes » rend clairement cette dimension.
- source_word: כְלִמָּה
  choice: l’humiliation
  rationale: Conserve la distinction avec la honte de la première proposition et traduit le déshonneur public qui marque le visage.
- source_word: זָרִים
  choice: des étrangers
  rationale: Rend le sens ordinaire de personnes étrangères au peuple et au sanctuaire, sans préciser davantage leur identité.
- source_word: בָּאוּ ... עַל
  choice: ont pénétré dans
  rationale: Dans le contexte de la profanation du sanctuaire, la construction indique que les étrangers sont venus jusque dans les lieux saints ; cette formulation française exprime clairement l’intrusion.
- source_word: מִקְדְּשֵׁי
  choice: les lieux saints
  rationale: Le pluriel hébreu est préservé et peut désigner les espaces sacrés du temple.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française traditionnelle pour représenter le tétragramme, avec petites capitales simulées par les majuscules.
theological_decisions:
- issue: Nature de l’atteinte portée au sanctuaire
  choice: « ont pénétré dans les lieux saints »
  alternative: « sont venus contre les lieux saints »
  rationale: Le contexte immédiat est celui d’une profanation par intrusion. Le français « venir contre » serait peu naturel et pourrait suggérer seulement une attaque extérieure, tandis que l’hébreu בוא על peut ici décrire l’arrivée hostile jusque dans l’espace sacré.
- issue: Référent du pluriel מִקְדְּשֵׁי
  choice: « les lieux saints »
  alternative: « les sanctuaires »
  rationale: « Lieux saints » maintient le pluriel sans laisser entendre plusieurs temples distincts et convient à la maison du SEIGNEUR.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme poétique est conservé, ainsi que le pluriel « lieux saints ». Aucun marqueur de note n’est nécessaire.
