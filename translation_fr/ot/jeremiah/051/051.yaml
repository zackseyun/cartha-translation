  source_fidelity: La première proposition rend correctement בֹּשְׁנוּ, mais « ont pénétré dans » interprète de manière trop précise la construction בָּאוּ ... עַל, qui exprime ici une venue hostile contre les lieux saints. Le pluriel « nos visages » reflète mieux פָּנֵינוּ.
  naturalness: Le registre est solennel et accessible. « Nous avons honte » est plus direct et idiomatique que « Nous sommes couverts de honte » tout en conservant le sens. La formulation « sont venus contre » maintient volontairement la relation hostile du texte sans ajouter l’idée d’une pénétration effective.
  terminology: « insultes », « humiliation », « étrangers », « lieux saints » et « SEIGNEUR » sont appropriés. « Lieux saints » conserve le pluriel de מִקְדְּשֵׁי sans postuler plusieurs temples.
  issues:
