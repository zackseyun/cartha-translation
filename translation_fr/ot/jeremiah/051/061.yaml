  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ אֶל שְׂרָיָ֑ה כְּ/בֹאֲ/ךָ֣ בָבֶ֔ל וְֽ/רָאִ֔יתָ וְֽ/קָרָ֔אתָ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/061.yaml
  text: And Jeremiah said to Seraiah[a], “When you come to Babylon, see that you read all these words.”
translation:
  language: fr
  text: 'Jérémie dit à Seraïa : « Quand tu arriveras à Babylone, veille à lire toutes ces paroles[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu verras et tu liras toutes ces paroles ». Ici, « tu verras » signifie probablement « veille à » ou « prends soin de ».'
    reason: La note préserve la formulation hébraïque et l’ambiguïté de וְרָאִיתָ tout en justifiant le rendu idiomatique du texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit la narration. En français, le passé simple rend naturellement cette succession sans qu’il soit nécessaire d’ajouter « et ».
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶל שְׂרָיָה
  choice: à Seraya
  rationale: La préposition marque le destinataire; « Seraya » est une translittération française claire du nom propre.
- source_word: כְּבֹאֲךָ בָבֶל
  choice: Quand tu arriveras à Babylone
  rationale: La construction כ + infinitif construit avec suffixe a une valeur temporelle. « Arriver à » est ici plus idiomatique en français que « venir à ».
- source_word: וְרָאִיתָ
  choice: veille à
  rationale: 'Littéralement « et tu verras »; devant l’action de lire, le verbe a vraisemblablement une force injonctive: prendre soin de faire quelque chose.'
- source_word: וְקָרָאתָ
  choice: lire
  rationale: Dans le contexte d’un rouleau écrit, קרא désigne la lecture, probablement à voix haute; le français « lire » garde cette possibilité sans la préciser indûment.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: Dans ce contexte prophétique écrit, « paroles » rend דברים plus précisément que « choses » et conserve sa portée verbale.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Tutoiement conservé parce que l’hébreu s’adresse directement à un seul homme. Syntaxe naturelle, avec une note pour la formulation plus littérale.
