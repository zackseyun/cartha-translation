source:
  edition: WLC
  text: שכנתי עַל מַ֣יִם רַבִּ֔ים רַבַּ֖ת אֽוֹצָרֹ֑ת בָּ֥א קִצֵּ֖/ךְ אַמַּ֥ת בִּצְעֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/013.yaml
  text: You who dwell by many waters[a], rich in treasures, your end has come[b], the measure of your greed.
translation:
  language: fr
  text: 'Toi qui habites près de nombreuses eaux[a], riche en trésors, ta fin est arrivée : la mesure de ton gain malhonnête[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur de nombreuses eaux ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la coudée de ton gain malhonnête » ; l’expression désigne probablement la mesure ou la limite de ce gain.
    reason: lexical_alternative
lexical_decisions:
- source_word: שכנתי
  choice: Toi qui habites
  rationale: Le participe féminin singulier s’adresse directement à Babylone personnifiée et décrit une situation durable. Cette tournure rend le vocatif naturellement en français.
- source_word: עַל מַיִם רַבִּים
  choice: près des grandes eaux
  rationale: עַל peut signifier « sur », « au-dessus de » ou « près de ». Dans le contexte d’une ville entourée de cours d’eau, « près des grandes eaux » est naturel tout en conservant l’image géographique.
- source_word: רַבַּת אֹצָרוֹת
  choice: riche en trésors
  rationale: רַבַּת exprime ici l’abondance. « Riche en trésors » communique clairement à la fois leur profusion et leur valeur.
- source_word: בָּא קִצֵּךְ
  choice: ta fin est arrivée
  rationale: L’accompli présente la fin annoncée comme certaine et déjà arrivée; cette formulation garde la force de l’oracle.
- source_word: אַמַּת
  choice: la mesure de
  rationale: Le nom signifie littéralement « coudée », mais désigne vraisemblablement ici une mesure ou une limite assignée. Le sens concret est signalé en note.
- source_word: בִּצְעֵךְ
  choice: tes gains malhonnêtes
  rationale: בֶּצַע désigne souvent un profit recherché ou acquis de manière injuste, violente ou cupide. « Gains malhonnêtes » conserve à la fois l’idée de profit et sa portée morale sans réduire le terme à un état intérieur.
theological_decisions:
- issue: Destinataire personnifié
  choice: Le verset s’adresse directement à Babylone comme à une ville personnifiée au féminin singulier.
  alternative: Une habitante générique ou l’ensemble de la population.
  rationale: Les formes féminines singulières et le contexte de l’oracle soutiennent l’adresse à la ville personnifiée; la traduction n’ajoute aucun nom absent du verset.
- issue: Rapport entre la fin et la « coudée » du gain
  choice: La seconde expression précise la limite désormais atteinte des gains malhonnêtes.
  alternative: Conserver uniquement l’image obscure de « la coudée de ton gain » sans explicitation dans le texte.
  rationale: « Mesure » rend une extension contextuelle plausible de אַמָּה tout en maintenant en note la formulation littérale et l’ambiguïté de l’expression.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier respecte l’adresse prophétique à la ville personnifiée. « Grandes eaux » conserve l’expression imagée, tandis que les notes préservent les principales possibilités lexicales.
