  text: כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת בָּבֶ֔ל וְ/אִבַּ֥ד מִמֶּ֖/נָּה ק֣וֹל גָּד֑וֹל וְ/הָמ֤וּ גַלֵּי/הֶם֙ כְּ/מַ֣יִם רַבִּ֔ים נִתַּ֥ן שְׁא֖וֹן קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/055.yaml
  text: For Yahweh is devastating Babylon and destroying from her the great sound[a]. Their waves roar like many waters[b]; the noise of their voice is given.
translation:
  language: fr
  text: Car Yahweh dévaste Babylone et en fait disparaître un grand bruit[a]. Leurs vagues grondent comme de grandes eaux[b] ; le fracas de leur voix retentit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une voix forte » ou « un grand bruit ». Il peut s’agir du tumulte de Babylone.
    reason: lexical_alternative
  - marker: b
    text: Le pronom « leurs » traduit directement le masculin pluriel hébreu. Ces vagues peuvent représenter les assaillants de Babylone, mais leur référent reste implicite.
    reason: referent_ambiguity
  - marker: c
    text: 'L’hébreu dit littéralement : « le fracas de leur voix est donné », expression signifiant qu’un bruit puissant se fait entendre.'
    reason: idiom
lexical_decisions:
- source_word: שֹׁדֵד
  choice: dévaste
  rationale: Le participe présente l’action de Yahweh comme en cours ou imminente. « Dévaste » exprime naturellement la violence du jugement sans restreindre le sens au seul pillage.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וְאִבַּד מִמֶּנָּה
  choice: et fait disparaître de chez elle
  rationale: La tournure rend l’action causative et conserve la personnification féminine de Babylone exprimée par le suffixe hébreu.
- source_word: קוֹל גָּדוֹל
  choice: le grand vacarme
  rationale: קוֹל peut désigner une voix, un son ou un bruit. Dans cette scène de destruction urbaine, « vacarme » restitue l’intensité de גָּדוֹל sans imposer l’idée d’un discours articulé.
- source_word: וְהָמוּ
  choice: grondent
  rationale: Le verbe évoque un mouvement tumultueux accompagné d’un bruit puissant. Avec des vagues pour sujet, « grondent » est idiomatique en français.
- source_word: גַלֵּיהֶם
  choice: leurs vagues
  rationale: Le suffixe hébreu est à la troisième personne du masculin pluriel. La traduction le conserve sans identifier explicitement le groupe auquel il renvoie.
- source_word: כְּמַיִם רַבִּים
  choice: comme des eaux puissantes
  rationale: L’expression décrit une masse d’eau abondante et imposante. « Eaux puissantes » transmet en français naturel sa force ainsi que son ampleur.
- source_word: נִתַּן שְׁאוֹן קוֹלָם
  choice: le fracas de leur voix retentit
  rationale: L’hébreu emploie littéralement une tournure passive, « le fracas de leur voix est donné ». « Retentit » en exprime idiomatiquement le sens tout en gardant l’image sonore.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme nom au lieu de lui substituer un titre, sans ajouter d’interprétation confessionnelle.
- issue: Identification des vagues et de leur voix
  choice: Maintenir le pronom masculin pluriel sans préciser son référent
  alternative: Identifier explicitement les vagues aux assaillants de Babylone
  rationale: Le contexte peut évoquer les armées qui submergent Babylone, mais ce verset ne nomme pas directement le référent du suffixe. La traduction préserve donc l’ambiguïté de l’hébreu.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation conserve la personnification de Babylone, l’image des vagues et l’ambiguïté du pronom pluriel, tout en rendant idiomatiquement la dernière proposition.
