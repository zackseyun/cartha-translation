  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי רָב֙ אֶת רִיבֵ֔/ךְ וְ/נִקַּמְתִּ֖י אֶת נִקְמָתֵ֑/ךְ וְ/הַחֲרַבְתִּי֙ אֶת יַמָּ֔/הּ וְ/הֹבַשְׁתִּ֖י אֶת מְקוֹרָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/036.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to plead your case and take vengeance for you[c][b]; I will dry up her sea and make her spring dry.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh : « Voici, je vais défendre ta cause et te venger. Je mettrai à sec sa mer et je tarirai sa source. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le lien de conséquence avec le contexte précédent.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Rend la formule prophétique dans un français actuel tout en conservant le nom divin.
- source_word: הִנְנִי
  choice: 'Me voici : je vais'
  rationale: « Me voici » préserve la présentation déictique; « je vais » rend l’action imminente introduite dans ce contexte sans alourdir la phrase.
- source_word: רָב אֶת רִיבֵךְ
  choice: défendre ta cause
  rationale: Rend clairement l’expression juridique formée du verbe ריב et de son nom apparenté.
- source_word: וְנִקַּמְתִּי אֶת נִקְמָתֵךְ
  choice: et te venger
  rationale: 'Exprime avec concision la construction apparentée et son sens judiciaire: Yahweh exercera la vengeance en faveur de l’interlocutrice.'
- source_word: וְהַחֲרַבְתִּי אֶת יַמָּהּ
  choice: Je mettrai à sec sa mer
  rationale: Avec la mer comme objet, le verbe causatif décrit l’assèchement; « mettre à sec » convient à l’image et au registre.
- source_word: וְהֹבַשְׁתִּי אֶת מְקוֹרָהּ
  choice: je tarirai sa source
  rationale: Le causatif de יבש signifie rendre sec; « tarir » est idiomatique en français pour une source, et מָקוֹר désigne ici une source ou un point d’origine des eaux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Référent des suffixes féminins dans « sa mer » et « sa source »
  choice: Conserver le possessif féminin implicite sans expliciter le référent
  alternative: Expliciter « la mer de Babylone » et « sa source »
  rationale: L’hébreu personnifie Babylone au féminin, mais le possessif français « sa » ne marque pas le genre du possesseur. Ne pas ajouter « Babylone » préserve la formulation et l’ancrage contextuel du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La construction juridique est rendue sans jargon, le parallélisme des deux images d’assèchement est conservé par deux verbes français naturels, et aucune note n’est nécessaire pour l’intelligibilité du verset.
