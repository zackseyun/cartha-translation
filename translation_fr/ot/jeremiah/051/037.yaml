  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיְתָה֩ בָבֶ֨ל לְ/גַלִּ֧ים מְעוֹן תַּנִּ֛ים שַׁמָּ֥ה וּ/שְׁרֵקָ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/037.yaml
  text: And Babylon will become heaps[a], a haunt of jackals, a horror and a hissing[c][b], with no inhabitant.
translation:
  language: fr
  text: Babylone deviendra des monceaux de ruines[a], un repaire de chacals[b], un objet d’épouvante et de sifflements[c], sans aucun habitant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des monceaux » ; le nom hébreu est au pluriel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon certaines traductions anciennes : « dragons » ; dans ce contexte de désolation, le terme hébreu désigne plus probablement des chacals.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de coups de sifflet » ; il s’agit vraisemblablement d’une marque de dérision ou de consternation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: deviendra
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction exprime le résultat futur d’un changement d’état ; « deviendra » rend cette transition.
- source_word: בָבֶל
  choice: Babylone
  rationale: Forme française usuelle du nom de lieu.
- source_word: לְגַלִּים
  choice: des monceaux de ruines
  rationale: Le nom hébreu est au pluriel et évoque ici des amas produits par la destruction. Cette formulation conserve à la fois le nombre et l’image.
- source_word: מְעוֹן
  choice: un repaire
  rationale: Dans le contexte d’une ville dévastée occupée par des animaux sauvages, « repaire » est plus évocateur et naturel que le neutre « demeure ».
- source_word: תַּנִּים
  choice: chacals
  rationale: Dans les tableaux prophétiques de désolation, le terme désigne vraisemblablement des chacals plutôt que les « dragons » des traductions anciennes.
- source_word: שַׁמָּה
  choice: un objet d’épouvante
  rationale: Le nom désigne une dévastation qui provoque l’effroi ou la stupeur ; la formulation explicite la réaction suscitée sans la confondre avec les ruines elles-mêmes.
- source_word: וּשְׁרֵקָה
  choice: et de sifflements
  rationale: Le mot évoque les sifflements poussés devant un lieu dévasté, probablement en signe de dérision ou de consternation.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sans aucun habitant
  rationale: Cette expression rend avec concision l’absence totale de personnes habitant le lieu.
