  text: וְ/הָיָה֙ כְּ/כַלֹּ֣תְ/ךָ֔ לִ/קְרֹ֖א אֶת הַ/סֵּ֣פֶר הַ/זֶּ֑ה תִּקְשֹׁ֤ר עָלָי/ו֙ אֶ֔בֶן וְ/הִשְׁלַכְתּ֖/וֹ אֶל תּ֥וֹךְ פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/063.yaml
  text: And when you finish reading this scroll[a], tie a stone to it and throw it into the midst of the Euphrates[b],
translation:
  language: fr
  text: Quand tu auras fini de lire ce rouleau[a], attache-y une pierre et jette-le au milieu de l’Euphrate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce livre ». Le mot hébreu סֵפֶר peut désigner plus généralement un écrit ou un document, mais il s’agit probablement ici d’un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּתְךָ לִקְרֹא
  choice: Quand tu auras fini de lire
  rationale: La formule וְהָיָה suivie de כְ et de l’infinitif construit introduit ici une circonstance future. Le futur antérieur français exprime naturellement l’achèvement de la lecture avant les deux ordres suivants.
- source_word: אֶת הַסֵּפֶר הַזֶּה
  choice: ce rouleau
  rationale: סֵפֶר désigne un écrit et peut se traduire par « livre », mais, dans ce contexte ancien, il s’agit vraisemblablement d’un rouleau.
- source_word: תִּקְשֹׁר עָלָיו אֶבֶן
  choice: attache-y une pierre
  rationale: קשר signifie « attacher, lier » et עָלָיו indique que la pierre doit être fixée au rouleau. La tournure avec « y » évite une répétition tout en restant claire en français.
- source_word: וְהִשְׁלַכְתּוֹ
  choice: et jette-le
  rationale: Le hiphil de שלך exprime l’action de jeter. Le pronom masculin singulier reprend naturellement « rouleau ».
- source_word: אֶל תּוֹךְ פְּרָת
  choice: au milieu de l’Euphrate
  rationale: אֶל־תּוֹךְ indique un mouvement vers l’intérieur ou le milieu de quelque chose; « au milieu de » conserve cette image sans la lourdeur de « au cœur de ».
