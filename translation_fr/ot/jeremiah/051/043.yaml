  source_fidelity: La version rend fidèlement le sens général du verset, y compris la personnification féminine de Babylone et le caractère générique de « fils d’homme ». Cependant, « une étendue dévastée » atténue le substantif hébreu « désolation », et « aride et désertique » fusionne les deux substantifs distincts צִיָּה (« terre aride/desséchée ») et עֲרָבָה (« steppe »). La révision les conserve explicitement. Elle évite aussi de faire dépendre les deux dernières propositions uniquement de « terre », alors que les pronoms hébreux sont au pluriel et renvoient naturellement aux villes.
  naturalness: La formulation révisée demeure naturelle en français international moderne. « Une désolation » est sobre et idiomatique dans le registre prophétique ; la reprise par « y » évite une relative lourde tout en conservant l’idée qu’aucun habitant ni passant ne se trouve dans ces lieux.
  terminology: « Désolation », « terre aride » et « steppe » correspondent de manière distincte aux termes hébreux. « Aucun être humain » rend correctement בֶּן־אָדָם dans son emploi générique, sans lui attribuer une portée titulaires ou théologique.
