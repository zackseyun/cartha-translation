  text: הָי֤וּ עָרֶ֨י/הָ֙ לְ/שַׁמָּ֔ה אֶ֖רֶץ צִיָּ֣ה וַ/עֲרָבָ֑ה אֶ֗רֶץ לֹֽא יֵשֵׁ֤ב בָּ/הֵן֙ כָּל אִ֔ישׁ וְ/לֹֽא יַעֲבֹ֥ר בָּ/הֵ֖ן בֶּן אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/043.yaml
  text: Her cities have become a desolation[a], a dry land and a desert, a land where no one lives[c][b], and through which no son of man passes.
translation:
  language: fr
  text: Ses villes[a] sont devenues une désolation[b], une terre aride et une steppe[c] ; personne n’y habite, et aucun être humain n’y passe[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le suffixe hébreu est féminin singulier : Babylone est personnifiée comme une femme.'
    reason: contextual_clarification
  - marker: b
    text: Ou « un lieu de désolation » ; le terme peut aussi évoquer l’effroi causé par la dévastation.
    reason: lexical_alternative
  - marker: c
    text: Ou « une terre desséchée et une steppe ».
    reason: lexical_alternative
  - marker: d
    text: L’hébreu dit littéralement « aucun homme » puis « aucun fils d’homme » ; ces deux expressions désignent ici, de manière générale, les habitants et les voyageurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֶיהָ
  choice: Ses villes
  rationale: Le suffixe féminin singulier renvoie à Babylone, personnifiée comme une femme dans le contexte. « Ses villes » conserve naturellement cette relation en français.
- source_word: לְשַׁמָּה
  choice: une étendue dévastée
  rationale: שַׁמָּה désigne ici l’état de dévastation produit par le jugement. Cette formulation française s’accorde naturellement avec le pluriel « villes » tout en conservant le prédicat hébreu au singulier.
- source_word: אֶרֶץ צִיָּה וַעֲרָבָה
  choice: une terre aride et désertique
  rationale: צִיָּה évoque une terre desséchée, tandis que עֲרָבָה désigne une plaine aride ou une région désertique. La formulation retenue est claire et restitue les deux aspects sans technicisme inutile.
- source_word: לֹא יֵשֵׁב בָּהֵן כָּל אִישׁ
  choice: où personne n’habite
  rationale: La négation avec אִישׁ a une portée générique. « Personne » exprime idiomatiquement en français l’absence totale d’habitants.
- source_word: וְלֹא יַעֲבֹר בָּהֵן בֶּן אָדָם
  choice: et où aucun être humain ne passe
  rationale: בֶּן אָדָם est ici une expression générique désignant un humain, non un titre christologique. « Être humain » en transmet le sens tout en distinguant le voyageur de l’habitant mentionné auparavant.
theological_decisions:
- issue: Portée de l’expression בֶּן אָדָם
  choice: aucun être humain
  alternative: aucun fils d’homme
  rationale: Dans ce contexte, l’expression désigne de façon générique tout être humain qui pourrait traverser le pays. Une traduction littérale risquerait en français de suggérer à tort un titre théologique particulier.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression poétique du texte hébreu — villes dévastées, terre aride, absence d’habitants et de voyageurs — tout en évitant les calques peu naturels.
