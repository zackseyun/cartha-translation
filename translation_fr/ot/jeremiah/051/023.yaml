base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/023.yaml
  text: And with you I shattered the shepherd and his flock[a]; and with you I shattered the farmer and his team[c][b]; and with you I shattered governors and deputies.
translation:
  language: fr
  text: Par toi, j’ai fracassé le berger et son troupeau ; par toi, j’ai fracassé le cultivateur et son attelage[a] ; par toi, j’ai fracassé les gouverneurs et les adjoints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa paire d’animaux sous le joug ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: j’ai fracassé
  rationale: Le verbe נָפַץ exprime une destruction violente, l’action de briser en morceaux. « J’ai fracassé » en conserve la force et sa répétition restitue la cadence hébraïque.
- source_word: בְךָ
  choice: par toi
  rationale: 'La préposition בְּ a ici une valeur instrumentale : dans le contexte, Babylone est l’instrument employé pour frapper les autres.'
- source_word: רֹעֶה
  choice: le berger
  rationale: Le terme désigne ici naturellement un berger au sens concret, dans une série de personnes associées à leur groupe ou à leur activité.
- source_word: עֶדְרוֹ
  choice: son troupeau
  rationale: עֵדֶר désigne un troupeau ; cette traduction forme en français l’association naturelle avec « berger ».
- source_word: אִכָּר
  choice: le cultivateur
  rationale: Le nom désigne celui qui travaille la terre. « Cultivateur » est précis, actuel et convient mieux au cadre ancien que le terme plus général « agriculteur ».
- source_word: צִמְדּוֹ
  choice: son attelage
  rationale: צֶמֶד peut désigner une paire d’animaux liés sous le joug ou l’attelage ainsi formé. « Son attelage » rend clairement la réalité agricole sans réduire le mot au seul joug matériel.
- source_word: פַּחוֹת
  choice: les gouverneurs
  rationale: פַּחוֹת désigne des gouverneurs ou dirigeants provinciaux ; « gouverneurs » est une formulation concise et reconnue.
- source_word: סְגָנִים
  choice: leurs adjoints
  rationale: סְגָנִים désigne des responsables de rang subordonné. « Adjoints » fait ressortir leur rang par rapport aux gouverneurs sans imposer un titre administratif trop précis.
theological_decisions: []
translation_notes:
  register: Français moderne, soutenu mais accessible. La triple répétition de « par toi, j’ai fracassé » préserve le parallélisme et la vigueur rhétorique de l’hébreu. Le possessif pluriel dans « leurs adjoints » explicite en français le suffixe absent après le second nom dans l’hébreu, où les deux catégories administratives sont coordonnées.
