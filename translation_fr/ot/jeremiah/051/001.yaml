id: JER.51.1
reference: Jeremiah 51:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מֵעִ֣יר עַל בָּבֶ֔ל וְ/אֶל יֹשְׁבֵ֖י לֵ֣ב קָמָ֑י ר֖וּחַ מַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/001.yaml
  text: 'Thus says Yahweh: Behold[a], I am stirring up against Babylon, and against the inhabitants of Leb-kamai[b], a destroying wind.'
translation:
  language: fr
  text: 'Ainsi parle YHWH : « Voici que je suscite contre Babylone et contre les habitants de Leb-Qamaï[a] un vent destructeur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Leb-Qamaï » est probablement un nom codé de la Chaldée, obtenu au moyen du chiffre atbash. On pourrait aussi comprendre littéralement : « le cœur de mes adversaires ».'
    reason: alternative_reading
  - marker: b
    text: Ou « un esprit destructeur » ; le mot hébreu peut signifier « vent », « esprit » ou « souffle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: YHWH
  rationale: La forme consonantique traditionnelle préserve le nom divin distinct du titre « Seigneur » et convient à un français biblique moderne sans imposer une vocalisation incertaine.
- source_word: הִנְנִי
  choice: Voici que je
  rationale: Cette tournure attire l’attention sur l’intervention imminente de Dieu tout en restant naturelle et digne en français.
- source_word: מֵעִיר
  choice: fais se lever
  rationale: Le participe hiphil exprime ici la mise en mouvement d’un agent de jugement. « Faire se lever » conserve cette valeur causative.
- source_word: עַל / אֶל
  choice: contre
  rationale: Dans ce contexte de jugement, les deux prépositions indiquent la direction hostile de l’action.
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française usuelle du nom de lieu.
- source_word: יֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe substantivé désigne collectivement ceux qui habitent le lieu.
- source_word: לֵב קָמָי
  choice: Leb-Qamaï
  rationale: L’expression fonctionne vraisemblablement comme un nom codé de la Chaldée au moyen de l’atbash. La translittération préserve ce trait du texte, tandis que le sens littéral possible est signalé en note.
- source_word: רוּחַ
  choice: vent
  rationale: Associé au participe « destructeur » dans cet oracle contre Babylone, le sens météorologique et imagé est le plus naturel, sans exclure le sens « esprit ».
- source_word: מַשְׁחִית
  choice: destructeur
  rationale: Le participe hiphil qualifie le vent par son action dévastatrice; l’adjectif français garde cette force active.
theological_decisions:
- issue: Sens personnel ou météorologique de רוּחַ
  choice: vent
  alternative: esprit
  rationale: Le contexte immédiat présente YHWH mettant en mouvement un instrument de jugement contre Babylone; l’image du vent convient le mieux, mais la polysémie hébraïque demeure réelle et est conservée en note.
translation_notes:
  register: Français international moderne, clair et solennel. La formule prophétique « Ainsi parle YHWH » garde la dignité du registre biblique; la syntaxe reste proche de l’hébreu sans devenir artificielle.
