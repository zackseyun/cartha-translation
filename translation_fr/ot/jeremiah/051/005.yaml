source:
  edition: WLC
  text: כִּ֠י לֹֽא אַלְמָ֨ן יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ מֵֽ/אֱלֹהָ֔י/ו מֵֽ/יְהוָ֖ה צְבָא֑וֹת כִּ֤י אַרְצָ/ם֙ מָלְאָ֣ה אָשָׁ֔ם מִ/קְּד֖וֹשׁ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/005.yaml
  text: For Israel and Judah are not widowed from their God[a], from Yahweh of Armies[b], though their land is full of guilt against the Holy One of Israel.
translation:
  language: fr
  text: Car Israël et Juda ne sont pas veufs de leur Dieu[a], de Yahvé des armées[b], bien que leur pays soit plein de culpabilité envers le Saint d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne sont pas veufs de leur Dieu » ; l’image exprime qu’ils n’ont pas été laissés sans lui.'
    reason: clarification_metaphor
  - marker: b
    text: 'Traduction traditionnelle : « le Seigneur des armées » ou « le Seigneur des puissances ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « contre le Saint d’Israël ». La préposition hébraïque peut être comprise de plusieurs manières ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָן
  choice: privés
  rationale: Le terme évoque littéralement l’état de veuvage ou la perte du conjoint. En français, « ne sont pas privés de leur Dieu » conserve clairement l’idée de ne pas avoir été laissés sans lui, tout en évitant la tournure peu naturelle « ne sont pas veufs de leur Dieu ». La métaphore littérale est signalée en note.
- source_word: מֵאֱלֹהָיו מֵיְהוָה צְבָאוֹת
  choice: de leur Dieu, de Yahvé, le maître des armées
  rationale: La répétition de מִן exprime ici la séparation dont Israël et Juda ne sont pas victimes. Le suffixe hébreu est formellement singulier, mais les deux collectivités coordonnées appellent naturellement « leur » en français. « Maître des armées » rend le titre צְבָאוֹת de façon intelligible sans limiter les armées à une seule catégorie.
- source_word: כִּי
  choice: Car
  rationale: Le premier כִּי introduit l’explication de l’appel qui précède dans le contexte.
- source_word: כִּי
  choice: bien que
  rationale: 'Le second כִּי reçoit une valeur concessive : la culpabilité du pays contraste avec le fait qu’Israël et Juda ne sont pas privés de leur Dieu.'
- source_word: אַרְצָם
  choice: leur pays
  rationale: Ici אֶרֶץ désigne le territoire habité d’Israël et de Juda ; « pays » est naturel en français moderne.
- source_word: מָלְאָה אָשָׁם
  choice: soit rempli de fautes
  rationale: אָשָׁם désigne ici la culpabilité ou les offenses, non un sacrifice de réparation. « Fautes » s’accorde naturellement avec l’image d’un pays qui en est rempli.
- source_word: מִקְּדֹשׁ יִשְׂרָאֵל
  choice: envers le Saint d’Israël
  rationale: La préposition מִן est difficile ici. « Envers » exprime la relation des fautes au Saint d’Israël sans trancher aussi fortement que « contre » ; cette autre possibilité est conservée en note.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Ce titre prophétique traditionnel et transparent est conservé.
theological_decisions:
- issue: Valeur concessive ou causale du second כִּי
  choice: « bien que leur pays soit rempli de fautes »
  alternative: « car leur pays est rempli de fautes »
  rationale: La lecture concessive préserve le contraste entre la fidélité persistante de Dieu envers Israël et Juda et leur culpabilité réelle. Une lecture causale créerait un rapport logique difficile, comme si leur culpabilité expliququait qu’ils ne soient pas privés de Dieu.
- issue: Relation exprimée par מִן dans מִקְּדֹשׁ יִשְׂרָאֵל
  choice: « envers le Saint d’Israël »
  alternative: « contre le Saint d’Israël » ou « devant le Saint d’Israël »
  rationale: L’hébreu permet plusieurs nuances. « Envers » maintient la culpabilité en relation avec Dieu sans imposer une idée d’hostilité explicite ; la lecture « contre » reste indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le calque peu idiomatique « veufs de leur Dieu » dans le corps du texte, tout en préservant l’image dans une note. Le nom divin est transcrit « Yahvé ». Les marqueurs [a] et [b] figurent tous deux dans le texte.
