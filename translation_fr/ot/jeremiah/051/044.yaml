  text: וּ/פָקַדְתִּ֨י עַל בֵּ֜ל בְּ/בָבֶ֗ל וְ/הֹצֵאתִ֤י אֶת בִּלְע/וֹ֙ מִ/פִּ֔י/ו וְ/לֹֽא יִנְהֲר֥וּ אֵלָ֛י/ו ע֖וֹד גּוֹיִ֑ם גַּם חוֹמַ֥ת בָּבֶ֖ל נָפָֽלָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/044.yaml
  text: And I will punish Bel in Babylon[a], and I will bring out of his mouth what he has swallowed; nations will no longer stream to him[b]. Even the wall of Babylon has fallen.
translation:
  language: fr
  text: Je châtierai Bel à Babylone et je ferai sortir de sa bouche ce qu’il a englouti. Les nations n’afflueront plus vers lui. Même la muraille de Babylone est tombée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tombera ». En hébreu, un événement futur certain peut être présenté comme déjà accompli.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָקַדְתִּי עַל
  choice: J’interviendrai contre
  rationale: Avec עַל, פקד annonce ici une intervention judiciaire de Dieu. Cette formulation française conserve la portée de jugement sans réduire le verbe à la seule idée de châtiment.
- source_word: בֵּל בְּבָבֶל
  choice: Bel à Babylone
  rationale: Bel est le nom-titre de la divinité babylonienne; le ב locatif situe son culte à Babylone.
- source_word: וְהֹצֵאתִי אֶת בִּלְעוֹ מִפִּיו
  choice: je ferai sortir de sa bouche ce qu’il a englouti
  rationale: La tournure causative de יצא et l’image concrète de l’engloutissement sont conservées naturellement en français.
- source_word: וְלֹא יִנְהֲרוּ אֵלָיו עוֹד גּוֹיִם
  choice: Les nations n’afflueront plus vers lui
  rationale: Le verbe נהר représente les peuples comme un courant se dirigeant vers Bel; « affluer » garde cette image tout en restant idiomatique.
- source_word: גַּם חוֹמַת בָּבֶל נָפָלָה
  choice: Même la muraille de Babylone est tombée
  rationale: גם introduit un élément culminant; le parfait נָפָלָה est rendu au passé composé pour préserver l’effet prophétique d’un événement futur présenté comme déjà accompli.
theological_decisions:
- issue: Référent des pronoms dans les images de l’engloutissement et de l’afflux
  choice: Les pronoms renvoient à Bel.
  alternative: Ils pourraient être compris plus largement comme renvoyant à Babylone personnifiée.
  rationale: Bel est l’antécédent immédiat, et l’enchaînement décrit son humiliation; la chute de son prestige implique en même temps celle du centre religieux babylonien.
- issue: Valeur temporelle de נָפָלָה
  choice: « est tombée », parfait prophétique
  alternative: « tombera », futur explicite
  rationale: Le parfait hébreu présente vraisemblablement la chute encore future comme certaine. Le passé composé français maintient cette tension rhétorique.
translation_notes:
  register: Français international moderne, clair et digne. « Affluer » conserve l’image d’un courant de peuples sans nécessiter de note; « muraille » convient mieux que « mur » aux défenses d’une ville antique.
