source:
  edition: WLC
  text: וְ/לֹֽא יִקְח֤וּ מִמְּ/ךָ֙ אֶ֣בֶן לְ/פִנָּ֔ה וְ/אֶ֖בֶן לְ/מֽוֹסָד֑וֹת כִּֽי שִׁמְמ֥וֹת עוֹלָ֛ם תִּֽהְיֶ֖ה נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/026.yaml
  text: And they will not take from you a stone for a corner or a stone for foundations[a], for you will be everlasting desolations[b], declares Yahweh.
translation:
  language: fr
  text: On ne prendra de toi aucune pierre d’angle ni aucune pierre destinée aux fondations[a], car tu seras pour toujours un lieu dévasté[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pierre angulaire » ; littéralement « une pierre pour un angle ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « des dévastations perpétuelles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְחוּ
  choice: on ne prendra
  rationale: Le qal inaccompli à la 3e personne du pluriel avec négation a ici une valeur future. Le pronom indéfini « on » rend naturellement en français un sujet pluriel non précisé.
- source_word: מִמְּךָ
  choice: de toi
  rationale: Le suffixe masculin singulier renvoie à Babylone personnifiée et préserve l’adresse directe.
- source_word: אֶבֶן לְפִנָּה
  choice: une pierre pour un angle
  rationale: Cette formulation conserve l’expression concrète et légèrement ouverte de l’hébreu, sans imposer le terme technique « pierre angulaire ».
- source_word: וְאֶבֶן לְמוֹסָדוֹת
  choice: ni aucune pierre pour les fondations
  rationale: Le pluriel מוֹסָדוֹת est conservé, ainsi que l’image de pierres réemployées pour bâtir.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle aucune pierre ne sera récupérée.
- source_word: שִׁמְמוֹת עוֹלָם
  choice: un désert à jamais
  rationale: Le français idiomatique emploie volontiers le singulier collectif « un désert » pour un lieu entièrement dévasté; « à jamais » exprime la durée indéfinie de עוֹלָם. Une note signale la forme plurielle littérale.
- source_word: תִּהְיֶה
  choice: tu seras
  rationale: Le qal inaccompli de היה exprime directement l’état futur annoncé, sans qu’il soit nécessaire d’ajouter explicitement l’idée de devenir.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formule prophétique solennelle; le nom divin est translittéré afin de conserver le tétragramme présent dans le texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée temporelle de עוֹלָם
  choice: à jamais
  alternative: pour toujours / perpétuel
  rationale: La traduction exprime une dévastation durable et sans terme annoncé, tout en évitant de développer au-delà de la portée contextuelle du terme.
translation_notes:
  register: Français international moderne, sobre et prophétique. La tournure « on ne prendra » évite un lourd « ils ne prendront » sans antécédent explicite. Les images architecturales et l’adresse à Babylone sont maintenues.
