id: JER.51.33
reference: Jeremiah 51:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בַּת בָּבֶ֕ל כְּ/גֹ֖רֶן עֵ֣ת הִדְרִיכָ֑/הּ ע֣וֹד מְעַ֔ט וּ/בָ֥אָה עֵֽת הַ/קָּצִ֖יר לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/033.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: The daughter of Babylon is like a threshing floor at the time it is trodden; yet a little while, and the time of harvest will come for her.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahvé des armées, le Dieu d’Israël :

    « La fille de Babylone est comme une aire de battage

    au moment où on la foule[a].

    Encore un peu de temps,

    et le temps de la moisson viendra pour elle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au moment de la fouler ». Le verbe hébreu ne précise pas qui accomplit l’action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre, dans une forme courante et lisible en français.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend directement le pluriel hébreu dans le titre divin sans préciser s’il s’agit d’armées célestes ou terrestres.
- source_word: בַּת בָּבֶל
  choice: La fille de Babylone
  rationale: Conserve la personnification prophétique de Babylone au lieu de la réduire au seul nom de la ville.
- source_word: כְּגֹרֶן
  choice: est comme une aire de battage
  rationale: Préserve la comparaison et son image agricole concrète.
- source_word: עֵת הִדְרִיכָהּ
  choice: au moment où on la foule
  rationale: Le pronom indéfini « on » restitue naturellement le sujet non exprimé du verbe hébreu, tandis que « la » maintient le suffixe féminin et le lien avec l’aire de battage personnifiée en Babylone.
- source_word: עוֹד מְעַט
  choice: Encore un peu de temps
  rationale: Expression française naturelle qui communique l’imminence annoncée par l’hébreu.
- source_word: וּבָאָה עֵת הַקָּצִיר לָהּ
  choice: et le temps de la moisson viendra pour elle
  rationale: Conserve la métaphore de la moisson, le mouvement d’arrivée et le pronom datif appliqué à Babylone.
theological_decisions:
- issue: Portée métaphorique du battage et de la moisson
  choice: Maintenir les images agricoles sans expliciter le jugement dans le corps du texte.
  alternative: Traduire ou développer ces images comme une annonce directe de destruction.
  rationale: Dans l’oracle contre Babylone, ces images évoquent le jugement imminent, mais la traduction doit préserver la formulation imagée et sa tension plutôt que d’en imposer l’interprétation.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La disposition en lignes met en valeur le parallélisme prophétique. « Aire de battage », « fouler » et « moisson » conservent le réseau d’images agricoles du texte hébreu.
