  text: אֵ֚יךְ נִלְכְּדָ֣ה שֵׁשַׁ֔ךְ וַ/תִּתָּפֵ֖שׂ תְּהִלַּ֣ת כָּל הָ/אָ֑רֶץ אֵ֣יךְ הָיְתָ֧ה לְ/שַׁמָּ֛ה בָּבֶ֖ל בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/041.yaml
  text: How Sheshak has been captured[c][b][a], and the praise of the whole earth seized! How Babylon has become a desolation among the nations!
translation:
  language: fr
  text: 'Comment Shéshak[a] a-t-elle été prise,

    et la gloire de toute la terre[b] saisie !

    Comment Babylone est-elle devenue une désolation[c] parmi les nations !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shéshak est généralement compris comme un nom codé désignant Babylone.
    reason: alternative_reading
  - marker: b
    text: Ou « la louange de toute la terre » ou « la fierté de toute la terre ».
    reason: lexical_alternative
  - marker: c
    text: Ou « un objet d’horreur »; le terme hébreu peut évoquer à la fois la dévastation et l’horreur qu’elle suscite.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment
  rationale: Introduit ici une exclamation de stupeur et de lamentation, et non une véritable question sur la manière. « Comment » conserve cette force rhétorique en français.
- source_word: נִלְכְּדָה
  choice: a-t-elle été prise
  rationale: Le niphal de לכד exprime la prise ou la capture. Le passé composé convient à l’événement accompli dont le résultat suscite l’étonnement.
- source_word: שֵׁשַׁךְ
  choice: Shéshak
  rationale: Le nom présent dans le texte hébreu est translittéré plutôt que remplacé par son référent probable, Babylone. L’accent facilite une prononciation française proche de la forme hébraïque.
- source_word: וַתִּתָּפֵשׂ
  choice: saisie
  rationale: Le verbe תפשׂ signifie saisir ou capturer. Le participe passif elliptique en français maintient le parallélisme avec « a-t-elle été prise » et la vigueur de l’image.
- source_word: תְּהִלַּת כָּל הָאָרֶץ
  choice: la gloire de toute la terre
  rationale: תְּהִלָּה signifie d’abord « louange », mais peut désigner ce qui fait l’objet de louange, donc la gloire ou la fierté. « La gloire de toute la terre » est naturelle ici sans masquer l’alternative lexicale, signalée en note.
- source_word: הָיְתָה לְשַׁמָּה
  choice: est-elle devenue un lieu dévasté
  rationale: שַׁמָּה évoque une dévastation qui provoque l’horreur ou la stupeur. « Un lieu dévasté » rend clairement l’état de ruine; la nuance de réaction est conservée en note.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les peuples ou nations en général. « Parmi les nations » est précis, naturel et dépourvu de connotation théologique ultérieure.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en trois lignes met en valeur les deux exclamations parallèles. Le féminin de « prise » reprend la ville implicitement désignée par Shéshak et prépare l’identification explicite avec Babylone dans le second mouvement.
