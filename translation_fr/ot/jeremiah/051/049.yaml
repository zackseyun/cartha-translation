id: JER.51.49
reference: Jeremiah 51:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם בָּבֶ֕ל לִ/נְפֹּ֖ל חַֽלְלֵ֣י יִשְׂרָאֵ֑ל גַּם לְ/בָבֶ֥ל נָפְל֖וּ חַֽלְלֵ֥י כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/049.yaml
  text: Babylon also must fall for the slain of Israel[a], just as the slain of all the earth have fallen for Babylon.
translation:
  language: fr
  text: Babylone aussi doit tomber à cause de ceux d’Israël qui ont été tués[a], tout comme tous ceux qui ont été tués sur toute la terre sont tombés à cause de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Babylone aussi est tombée, ô morts d’Israël. » La syntaxe hébraïque du premier membre est condensée et peut être comprise de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: aussi / tout comme
  rationale: La particule établit une correspondance entre les deux membres du verset; « aussi » puis « tout comme » rendent ce parallélisme naturellement en français.
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française traditionnelle et courante du nom géographique.
- source_word: לִנְפֹּל
  choice: doit tomber
  rationale: L’infinitif précédé de ל est elliptique. « Doit tomber » exprime ici la chute destinée à Babylone dans le contexte du jugement prophétique, sans masquer l’ambiguïté syntaxique signalée en note.
- source_word: חַלְלֵי
  choice: les morts
  rationale: Le terme désigne les personnes tuées, notamment à la guerre. « Les morts » est naturel en français et convient aux deux occurrences.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom du peuple.
- source_word: לְבָבֶל
  choice: à cause de Babylone
  rationale: La préposition ל exprime vraisemblablement ici le rapport causal entre Babylone et la mort des peuples; cette formulation française clarifie ce rapport tout en maintenant le parallèle avec le premier membre.
- source_word: נָפְלוּ
  choice: sont tombés
  rationale: Le parfait présente comme accomplie la mort attribuée à la violence de Babylone; le passé composé est idiomatique en français.
- source_word: חַלְלֵי כָל הָאָרֶץ
  choice: les morts de toute la terre
  rationale: אָרֶץ peut signifier « pays » ou « terre ». Dans l’oracle contre la puissance impériale de Babylone, la portée universelle convient au contexte, tout en restant proche de l’expression hébraïque.
theological_decisions:
- issue: Portée de אָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: Le contexte met les morts d’Israël en regard des nombreuses victimes de la violence impériale de Babylone. La portée plus large, « terre », correspond mieux à cette rhétorique, sans exclure l’autre sens lexical possible.
- issue: Sens causal ou relationnel de ל dans les deux membres
  choice: à cause de
  alternative: pour
  rationale: En français moderne, « à cause de » exprime clairement que la chute de Babylone répond aux morts d’Israël et que les morts des peuples sont imputables à Babylone. Le simple « pour » serait plus formellement proche, mais sensiblement moins clair.
- issue: Syntaxe comprimée du premier membre
  choice: Babylone doit tomber à cause des morts d’Israël
  alternative: Babylone aussi est tombée, ô morts d’Israël
  rationale: La lecture principale comprend לִנְפֹּל comme annonçant la chute nécessaire de Babylone en réponse aux victimes israélites. La construction hébraïque demeure difficile; l’autre analyse est donc conservée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est rendu explicitement, tandis que l’ambiguïté réelle de la première proposition est préservée dans une note.
