  text: אֶֽל יִדְרֹ֤ךְ ידרך הַ/דֹּרֵךְ֙ קַשְׁתּ֔/וֹ וְ/אֶל יִתְעַ֖ל בְּ/סִרְיֹנ֑/וֹ וְ/אַֽל תַּחְמְלוּ֙ אֶל בַּ֣חֻרֶ֔י/הָ הַחֲרִ֖ימוּ כָּל צְבָאָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/003.yaml
  text: Let not the archer bend his bow[a], and let him not rise up in his armor. Do not spare her young men[c][b]; devote all her army to destruction.
translation:
  language: fr
  text: Que l’archer ne bande pas son arc[a] et qu’il ne se lève pas dans son armure[b]. N’épargnez pas ses jeunes hommes ; vouez toute son armée à la destruction[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que le tireur à l’arc tende son arc ». Le début du texte hébreu est difficile et comporte une répétition ; son analyse syntaxique est discutée.
    reason: alternative_reading
  - marker: b
    text: Ou « dans sa cuirasse » ou « dans sa cotte de mailles » ; le mot hébreu désigne une protection corporelle militaire.
    reason: lexical_alternative
  - marker: c
    text: L’expression traduit un terme hébreu qui signifie mettre des personnes ou des choses sous l’interdit, en les vouant à la destruction dans le cadre du jugement divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל / וְאֶל / וְאַל
  choice: Que… ne… pas / qu’il ne… pas / N’… pas
  rationale: Avec les formes verbales employées ici, ces particules sont comprises comme introduisant des interdictions. Cette lecture donne une suite cohérente d’ordres négatifs, tout en laissant en note l’ambiguïté du début du verset.
- source_word: יִדְרֹךְ ... הַדֹּרֵךְ קַשְׁתּוֹ
  choice: l’archer ne bande pas son arc
  rationale: L’expression דָּרַךְ קֶשֶׁת désigne l’action de bander ou de tendre un arc. « Bander son arc » est précis, naturel en français et conserve l’image militaire.
- source_word: יִתְעַל
  choice: se dresse
  rationale: La forme exprime le fait de se lever ou de se hausser, vraisemblablement pour combattre. « Se dresse » rend cette action sans en préciser excessivement les circonstances.
- source_word: בְּסִרְיֹנוֹ
  choice: revêtu de sa cuirasse
  rationale: סִרְיוֹן désigne une protection corporelle militaire, peut-être une cotte de mailles ou une armure d’écailles. « Cuirasse » est un terme français clair, avec les autres possibilités signalées en note.
- source_word: תַּחְמְלוּ
  choice: N’épargnez pas
  rationale: Dans cet oracle guerrier, le verbe חמל exprime concrètement le fait d’épargner, même s’il peut aussi signifier avoir pitié.
- source_word: בַּחֻרֶיהָ
  choice: ses jeunes hommes
  rationale: בָּחוּר désigne normalement un jeune homme dans la force de l’âge. Le contexte permet d’entendre qu’ils sont aptes au combat sans traduire directement « guerriers ».
- source_word: הַחֲרִימוּ
  choice: vouez ... à la destruction
  rationale: Le hifil de חרם signifie mettre sous l’interdit, ici en vouant à la destruction. Cette formulation conserve la portée particulière du terme au-delà du simple verbe « détruire ».
- source_word: כָּל צְבָאָהּ
  choice: toute son armée
  rationale: צָבָא désigne ici l’ensemble des forces militaires. « Armée » est le collectif le plus direct en français moderne.
theological_decisions:
- issue: Sens du vocabulaire de חרם dans un oracle de jugement
  choice: vouez toute son armée à la destruction
  alternative: détruisez entièrement toute son armée / mettez toute son armée sous l’interdit
  rationale: La traduction retenue préserve le lien entre mise sous l’interdit et destruction dans le jugement divin, sans réduire le terme à une simple action militaire ni lui ajouter une interprétation doctrinale.
- issue: Ambiguïté syntaxique de l’ouverture du verset
  choice: interdiction adressée à l’archer
  alternative: ordre de bander l’arc contre celui qui le bande
  rationale: La vocalisation et la répétition du texte hébreu rendent l’ouverture difficile. La lecture prohibitive s’accorde avec la suite des interdictions, mais l’autre analyse syntaxique demeure possible et est donc explicitement conservée en note.
translation_notes:
  register: Français international moderne, sobre et solennel. Les impératifs restent directs. « Bander son arc », « se dresser » et « cuirasse » conservent l’imagerie militaire sans archaïsme excessif ; la difficulté réelle de l’hébreu initial est signalée plutôt que résolue silencieusement.
