source:
  edition: WLC
  text: מַפֵּץ אַתָּ֣ה לִ֔/י כְּלֵ֖י מִלְחָמָ֑ה וְ/נִפַּצְתִּ֤י בְ/ךָ֙ גּוֹיִ֔ם וְ/הִשְׁחַתִּ֥י בְ/ךָ֖ מַמְלָכֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/020.yaml
  text: You are my war club[a], my weapon of battle; with you I shatter nations[b], and with you I destroy kingdoms.
translation:
  language: fr
  text: Tu es ma massue[a], mon arme de guerre. Par toi, je briserai des nations[b] ; par toi, je détruirai des royaumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hache de guerre » ou « marteau » ; le mot hébreu désigne une arme servant à fracasser.
    reason: lexical_alternative
  - marker: b
    text: Le « tu » est au singulier. Son référent n’est pas nommé dans ce verset ; selon leur compréhension du contexte, les interprètes y voient notamment Babylone, Cyrus ou l’empire médo-perse, ou encore Israël/Jacob.
    reason: alternative_reading
lexical_decisions:
- source_word: מַפֵּץ
  choice: massue de guerre
  rationale: Le nom désigne un instrument qui sert à fracasser. « Massue de guerre » restitue l’image martiale sans préciser indûment qu’il s’agit d’une hache ou d’un marteau.
- source_word: לִי
  choice: pour moi
  rationale: Le datif hébreu exprime ici le rapport de possession ou de service. « Pour moi » reste proche de la forme source et souligne que l’interlocuteur sert d’instrument à Dieu.
- source_word: כְּלֵי מִלְחָמָה
  choice: une arme de combat
  rationale: L’expression signifie littéralement « instrument(s) de guerre ». Le singulier français s’accorde naturellement avec l’interlocuteur singulier et fonctionne en apposition à « massue ».
- source_word: נִפַּצְתִּי
  choice: je fracasse
  rationale: Le piel exprime une action violente de mise en pièces. Le présent rend la vigueur de la déclaration prophétique et fait écho à la massue.
- source_word: בְּךָ
  choice: par toi
  rationale: La préposition marque l’instrument. « Par toi » exprime clairement l’action accomplie au moyen de l’interlocuteur, tout en conservant la répétition hébraïque.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Dans ce contexte politique et militaire, « nations » est le terme moderne le plus direct.
- source_word: הִשְׁחַתִּי
  choice: je détruis
  rationale: Le hiphil de שׁחת indique ici la destruction causée par le locuteur. « Je détruis » préserve le parallélisme énergique.
- source_word: מַמְלָכוֹת
  choice: des royaumes
  rationale: Le mot désigne des royaumes ou domaines royaux ; « royaumes » correspond directement au contexte politique.
theological_decisions:
- issue: Identité de l’interlocuteur singulier
  choice: Conserver le « tu » singulier sans identifier son référent dans le texte.
  alternative: Identifier explicitement l’interlocuteur à Babylone, à Cyrus ou aux Mèdes et aux Perses, ou encore à Israël/Jacob.
  rationale: Le verset hébreu ne nomme pas lui-même l’interlocuteur. La traduction maintient donc l’ambiguïté réelle du texte au lieu d’imposer une interprétation contextuelle disputée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme et la répétition de « par toi » sont conservés. « Massue de guerre » garde l’image concrète et violente du texte sans adopter un terme archaïque ni résoudre l’identité de l’interlocuteur.
