  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : Yahvé manifeste publiquement la צדקות du peuple, puis les locuteurs s’exhortent à faire connaître à Sion l’œuvre de leur Dieu. « Notre bon droit » exprime de façon recevable la valeur de vindication dans ce contexte. La note conserve à juste titre la possibilité d’un sens lié à la justice ou aux actes justes.'
  naturalness: Le français est globalement naturel et de registre approprié. « À Sion » est toutefois plus idiomatique et conventionnel que « dans Sion » pour le lieu de la proclamation. « L’œuvre de Yahvé, notre Dieu » rend directement le syntagme nominal hébreu et convient au registre biblique moderne.
