  to: Yahvé a fait paraître notre bon droit[a]. Venez, racontons à Sion l’œuvre de Yahvé, notre Dieu.
  rationale: La révision conserve le choix contextuel « notre bon droit », qui rend la dimension de vindication sans attribuer nécessairement des mérites moraux au peuple. Elle remplace dans la note une alternative française inadéquate par « nos droits reconnus », qui exprime la possibilité d’une vindication au pluriel, et emploie « à Sion » ainsi que « l’œuvre » pour une formulation plus idiomatique et plus proche de la construction nominale hébraïque.
