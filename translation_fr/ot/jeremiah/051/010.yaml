  text: הוֹצִ֥יא יְהוָ֖ה אֶת צִדְקֹתֵ֑י/נוּ בֹּ֚אוּ וּ/נְסַפְּרָ֣ה בְ/צִיּ֔וֹן אֶֽת מַעֲשֵׂ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/010.yaml
  text: Yahweh has brought forth our vindication. Come[a], and let us recount in Zion the work of Yahweh our God.
translation:
  language: fr
  text: Yahvé a fait paraître notre bon droit[a]. Venez, racontons à Sion l’œuvre de Yahvé, notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos actes de justice », « notre justice » ou « nos droits reconnus ». Le pluriel hébreu peut désigner des actes de justice ou la reconnaissance publique du bon droit d’une cause.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: a fait paraître
  rationale: Le hiphil de יצא signifie littéralement « faire sortir ». Ici, il évoque la manifestation publique du bon droit; « faire paraître » conserve cette idée dans un français naturel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante du tétragramme préserve le nom divin plutôt que de lui substituer un titre.
- source_word: צִדְקֹתֵינוּ
  choice: notre bon droit
  rationale: Le pluriel hébreu peut désigner des actes justes ou les manifestations de la justice d’une cause. Dans le contexte du jugement de Babylone et de la délivrance de Sion, « notre bon droit » exprime naturellement la justification publique de la cause du peuple sans attribuer nécessairement à celui-ci des mérites moraux.
- source_word: בֹּאוּ
  choice: Venez
  rationale: L’impératif masculin pluriel lance une invitation collective; « Venez » en rend directement la force.
- source_word: וּנְסַפְּרָה
  choice: racontons
  rationale: La forme cohortative exprime une exhortation à raconter ou proclamer ensemble. « Racontons » est actuel et conserve l’idée d’exposer l’action accomplie.
- source_word: בְצִיּוֹן
  choice: dans Sion
  rationale: La préposition ב est locative. « Dans Sion » conserve la représentation de la ville comme lieu où l’action de Dieu sera racontée.
- source_word: מַעֲשֵׂה
  choice: ce qu’a fait
  rationale: Le substantif singulier désigne l’œuvre ou l’acte de Yahvé. La tournure verbale est plus naturelle en français tout en gardant l’étendue générale de son intervention.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Traduction directe du nom avec suffixe possessif, qui conserve l’expression de la relation d’alliance.
theological_decisions:
- issue: Sens de צִדְקֹתֵינוּ dans le contexte
  choice: notre bon droit
  alternative: nos actes justes; notre justice; nos justifications
  rationale: Le contexte célèbre l’intervention publique de Dieu en faveur de son peuple. « Notre bon droit » privilégie la dimension judiciaire et relationnelle, tandis que la note maintient l’ambiguïté réelle du pluriel hébreu entre justice, actes justes et justification d’une cause.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste concise et exhortative. « Yahvé » suit l’usage français pour le nom divin; la note préserve la polysémie théologiquement importante de צִדְקֹתֵינוּ.
