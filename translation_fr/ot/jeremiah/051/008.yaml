  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פִּתְאֹ֛ם נָפְלָ֥ה בָבֶ֖ל וַ/תִּשָּׁבֵ֑ר הֵילִ֣ילוּ עָלֶ֗י/הָ קְח֤וּ צֳרִי֙ לְ/מַכְאוֹבָ֔/הּ אוּלַ֖י תֵּרָפֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/008.yaml
  text: Suddenly Babylon has fallen and been shattered[a]. Wail over her! Take balm for her pain; perhaps she may be healed.
translation:
  language: fr
  text: Soudain, Babylone est tombée et s’est brisée. Lamentez-vous sur elle ! Prenez du baume[a] pour sa douleur ; peut-être sera-t-elle guérie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résine médicinale ». Le mot hébreu désigne un baume résineux utilisé comme remède.
    reason: Précision lexicale sur la nature du צֳרִי.
lexical_decisions:
- source_word: פִּתְאֹם
  choice: Soudain
  rationale: Cet adverbe exprime le caractère brusque et inattendu de la chute ; « soudain » est naturel en français moderne.
- source_word: נָפְלָה
  choice: est tombée
  rationale: Le parfait qal féminin singulier annonce la chute de Babylone comme un fait accompli dont le résultat est présent dans la scène prophétique.
- source_word: בָבֶל
  choice: Babylone
  rationale: Forme française courante du nom de la ville et de l’empire.
- source_word: וַתִּשָּׁבֵר
  choice: et s’est brisée
  rationale: Le nifal de שׁבר décrit Babylone réduite à l’état de chose brisée. La tournure pronominale française conserve cette valeur résultative sans préciser un agent absent du texte.
- source_word: הֵילִילוּ
  choice: Lamentez-vous
  rationale: L’impératif pluriel appelle à une lamentation bruyante. « Lamentez-vous » convient au registre prophétique tout en restant compréhensible ; « hurlez » risquerait d’évoquer surtout un cri animal.
- source_word: עָלֶיהָ
  choice: sur elle
  rationale: Avec un verbe de lamentation, עַל désigne ici la personne ou la réalité sur laquelle porte le deuil.
- source_word: קְחוּ
  choice: Prenez
  rationale: Équivalent direct et naturel de l’impératif pluriel לקח.
- source_word: צֳרִי
  choice: baume
  rationale: Le terme désigne une substance résineuse employée comme remède. « Baume » est clair, concis et maintient l’image médicinale.
- source_word: לְמַכְאוֹבָהּ
  choice: pour sa douleur
  rationale: מַכְאוֹב peut désigner la douleur, la souffrance ou le mal. « Douleur » reste lexicalement direct sans transformer explicitement le mal en blessure.
- source_word: אוּלַי
  choice: peut-être
  rationale: Le mot marque une possibilité incertaine, et non l’assurance d’une guérison.
- source_word: תֵּרָפֵא
  choice: guérira-t-elle
  rationale: Le nifal imparfait féminin singulier exprime la possibilité que Babylone soit guérie ; « peut-être » porte explicitement la modalité en français.
theological_decisions:
- issue: Personnification féminine de Babylone
  choice: Conserver la personnification au féminin avec « elle », « sa » et « guérira-t-elle »
  alternative: Traiter Babylone de manière impersonnelle ou reformuler en parlant uniquement de la ville
  rationale: Les formes hébraïques sont constamment au féminin singulier et présentent Babylone comme une femme souffrante susceptible d’être soignée. La traduction préserve cette image sans en résoudre la tension ironique ou théologique.
- issue: Possibilité incertaine de la guérison
  choice: « peut-être guérira-t-elle »
  alternative: « elle guérira peut-être » ou une formulation affirmant qu’elle guérira
  rationale: אוּלַי maintient expressément l’incertitude. La traduction ne transforme donc pas l’espoir rhétorique en promesse certaine.
translation_notes:
  register: Français international moderne, sobre et prophétique. Les impératifs restent directs, la métaphore médicale est conservée, et la syntaxe brève souligne la soudaineté de la catastrophe.
