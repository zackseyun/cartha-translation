source:
  edition: WLC
  text: חֲמָסִ֤/י וּ/שְׁאֵרִ/י֙ עַל בָּבֶ֔ל תֹּאמַ֖ר יֹשֶׁ֣בֶת צִיּ֑וֹן וְ/דָמִ/י֙ אֶל יֹשְׁבֵ֣י כַשְׂדִּ֔ים תֹּאמַ֖ר יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/035.yaml
  text: “My violence and my flesh be upon Babylon,” says the inhabitant of Zion[b][a]. “And my blood be upon the inhabitants of Chaldea,” says Jerusalem.
translation:
  language: fr
  text: « Que la violence qui m’a été faite, ainsi qu’à ma chair[a], retombe sur Babylone ! » dira l’habitante de Sion. « Que mon sang retombe sur les habitants de la Chaldée[b] ! » dira Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et mon corps ». Le mot hébreu est traditionnellement compris ici au sens de « chair », mais d’autres analyses ont été proposées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vers les habitants de la Chaldée » ; le verbe « retombe » est sous-entendu d’après le membre de phrase parallèle.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי
  choice: la violence qui m’a été faite
  rationale: חָמָס désigne la violence, le tort ou l’outrage. Dans cette plainte imprécatoire, le suffixe de première personne indique naturellement la violence subie par Sion, et non celle qu’elle aurait commise.
- source_word: וּשְׁאֵרִי
  choice: ainsi qu’à ma chair
  rationale: Le sens traditionnel « chair » convient au parallèle avec « mon sang ». La formulation française rattache la chair à la violence subie, sans remplacer l’image corporelle par le terme plus général « corps ».
- source_word: עַל בָּבֶל
  choice: retombe sur Babylone
  rationale: 'La proposition nominale a ici une valeur imprécatoire : Sion demande que la culpabilité ou les conséquences de la violence reviennent sur Babylone. « Retombe sur » exprime naturellement cette force judiciaire en français.'
- source_word: תֹּאמַר
  choice: dira
  rationale: L’imparfait hébreu peut annoncer la parole que prononcera la ville personnifiée. Le futur français conserve cette valeur sans transformer explicitement la forme en impératif.
- source_word: יֹשֶׁבֶת צִיּוֹן
  choice: l’habitante de Sion
  rationale: Le participe féminin singulier personnifie Sion comme une femme qui y habite. Cette traduction suit la formulation précise du texte plutôt que d’introduire l’expression différente « fille de Sion ».
- source_word: וְדָמִי
  choice: mon sang
  rationale: דָּם avec le suffixe de première personne évoque ici le sang versé de Jérusalem, en parallèle avec la violence corporelle du premier membre.
- source_word: אֶל יֹשְׁבֵי כַשְׂדִּים
  choice: retombe sur les habitants de la Chaldée
  rationale: Bien que אֶל signifie normalement « vers », le parallélisme avec עַל בָּבֶל permet de restituer le même souhait imprécatoire et son verbe sous-entendu.
- source_word: כַשְׂדִּים
  choice: la Chaldée
  rationale: Après « habitants de », le nom est compris territorialement. « Chaldée » donne en français une construction claire et traditionnelle.
theological_decisions:
- issue: Portée de l’imprécation
  choice: Exprimer une demande de rétribution par « retombe sur »
  alternative: 'Conserver une proposition nominale littérale : « ma violence et ma chair sur Babylone »'
  rationale: L’hébreu omet le verbe, mais le contexte et le parallélisme signalent un souhait de justice. La traduction explicite cette force sans préciser si ce qui retombe est la culpabilité, le châtiment ou les conséquences.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les exclamations rendent la force de l’imprécation ; la personnification féminine de Sion et de Jérusalem est conservée.
