  text: וְ/שִׁלַּחְתִּ֨י לְ/בָבֶ֤ל זָרִים֙ וְ/זֵר֔וּ/הָ וִ/יבֹקְק֖וּ אֶת אַרְצָ֑/הּ כִּֽי הָי֥וּ עָלֶ֛י/הָ מִ/סָּבִ֖יב בְּ/י֥וֹם רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/002.yaml
  text: And I will send strangers against Babylon, and they will winnow her and empty her land, for they will be against her from every side in the day of disaster.
translation:
  language: fr
  text: J’enverrai contre Babylone des étrangers[a] qui la vanneront[b] et videront son pays, car ils seront contre elle de tous côtés au jour du malheur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gens venus d’ailleurs ». Le mot hébreu désigne ici des personnes étrangères à Babylone.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se traduire par « disperser », mais l’image du vannage est probablement intentionnelle.
    reason: lexical_alternative
  - marker: c
    text: Le « jour du malheur » est le moment où la calamité s’abat sur Babylone; il ne s’agit pas ici du mal au sens moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: J’enverrai
  rationale: Le parfait qal à la première personne, dans cet oracle prophétique, annonce ici une action future certaine.
- source_word: לְבָבֶל
  choice: contre Babylone
  rationale: La préposition indique la destination, mais le contexte hostile justifie en français « contre Babylone » plutôt que le simple « à Babylone ».
- source_word: זָרִים
  choice: des étrangers
  rationale: Le terme désigne des personnes extérieures à Babylone; « étrangers » conserve sa portée sans préciser abusivement leur identité.
- source_word: וְזֵרוּהָ
  choice: qui la vanneront
  rationale: Le verbe évoque le vannage, qui sépare et disperse le grain; cette image agricole est conservée.
- source_word: וִיבֹקְקוּ אֶת־אַרְצָהּ
  choice: et videront son pays
  rationale: בקק exprime l’action de vider, avec ici l’idée d’une dévastation qui laisse le territoire dépeuplé et dépouillé.
- source_word: הָיוּ עָלֶיהָ מִסָּבִיב
  choice: ils viendront contre elle de tous côtés
  rationale: Cette formulation française naturelle rend l’hostilité et l’encerclement exprimés par l’hébreu, tout en donnant au parfait sa valeur future dans le contexte.
- source_word: בְּיוֹם רָעָה
  choice: au jour du malheur
  rationale: רָעָה désigne ici la calamité qui frappe Babylone, et non le mal moral.
theological_decisions: []
