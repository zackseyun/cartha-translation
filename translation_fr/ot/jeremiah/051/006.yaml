  text: נֻ֣סוּ מִ/תּ֣וֹךְ בָּבֶ֗ל וּ/מַלְּטוּ֙ אִ֣ישׁ נַפְשׁ֔/וֹ אַל תִּדַּ֖מּוּ בַּ/עֲוֺנָ֑/הּ כִּי֩ עֵ֨ת נְקָמָ֥ה הִיא֙ לַֽ/יהוָ֔ה גְּמ֕וּל ה֥וּא מְשַׁלֵּ֖ם לָֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/006.yaml
  text: Flee from the midst of Babylon[a], and let each man save his life. Do not be cut off in her iniquity, for this is the time of Yahweh's vengeance; he is repaying her what she deserves.
translation:
  language: fr
  text: 'Fuyez du milieu de Babylone, et que chacun sauve sa vie ! Ne périssez pas dans sa faute[a], car c’est le temps de la vengeance de Yahvé : il lui rend ce qu’elle mérite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « Ne soyez pas anéantis à cause de sa faute » ou « Ne soyez pas détruits pour sa culpabilité ». L’hébreu peut évoquer le fait d’être impliqué dans la faute de Babylone, ou le jugement subi en raison de cette faute.'
    reason: 'Ambiguïté lexicale et syntaxique de אַל תִּדַּמּוּ בַּעֲוֺנָהּ : le terme עָוֹן peut désigner la faute, la culpabilité ou la peine qui en résulte.'
lexical_decisions:
- source_word: נֻסוּ
  choice: Fuyez
  rationale: L’impératif pluriel exprime un ordre direct et urgent de prendre la fuite.
- source_word: מִתּוֹךְ בָּבֶל
  choice: du milieu de Babylone
  rationale: Préserve l’image de personnes sortant de l’intérieur même de Babylone, dans un français naturel.
- source_word: וּמַלְּטוּ אִישׁ נַפְשׁוֹ
  choice: et que chacun sauve sa vie
  rationale: Rend naturellement l’expression hébraïque où chaque personne doit mettre sa propre vie à l’abri.
- source_word: אַל תִּדַּמּוּ
  choice: Ne soyez pas anéantis
  rationale: Le niphal exprime ici vraisemblablement une destruction subie dans le jugement; « anéantis » conserve la valeur passive et la force de la menace.
- source_word: בַּעֲוֺנָהּ
  choice: à cause de sa faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou la peine qui en découle. La préposition peut évoquer soit la participation à la faute de Babylone, soit la destruction provoquée par cette faute; le choix principal convient bien au contexte de jugement, tandis que la note conserve l’ambiguïté.
- source_word: עֵת נְקָמָה הִיא לַיהוָה
  choice: c’est pour Yahvé le temps de la vengeance
  rationale: Conserve la construction avec ל et présente ce moment comme celui où Yahvé exerce la rétribution.
- source_word: גְּמוּל הוּא מְשַׁלֵּם לָהּ
  choice: il lui rend ce qu’elle mérite
  rationale: Expression française idiomatique qui rend l’idée de juste rétribution sans répéter artificiellement « rétribution » et « rétribuer ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahvé » représente le nom divin en français et suit l’orientation fournie, sans le remplacer par un titre.
- issue: Rapport entre la faute de Babylone et la destruction annoncée
  choice: à cause de sa faute
  alternative: dans sa faute
  rationale: L’hébreu permet de comprendre que les fugitifs seraient détruits à cause de la faute de Babylone ou qu’ils partageraient sa faute et son jugement. La formulation principale souligne la causalité contextuelle, et la note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’impératif initial et le point d’exclamation rendent l’urgence. « Chacun » évite une lourdeur genrée tout en conservant la portée distributive de אִישׁ. La formulation garde la tension entre culpabilité et châtiment au moyen d’une note explicite.
