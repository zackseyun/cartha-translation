id: JER.51.56
reference: Jeremiah 51:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ בָ֨א עָלֶ֤י/הָ עַל בָּבֶל֙ שׁוֹדֵ֔ד וְ/נִלְכְּדוּ֙ גִּבּוֹרֶ֔י/הָ חִתְּתָ֖ה קַשְּׁתוֹתָ֑/ם כִּ֣י אֵ֧ל גְּמֻל֛וֹת יְהוָ֖ה שַׁלֵּ֥ם יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/056.yaml
  text: For a destroyer has come against her[a], against Babylon, and her warriors have been captured; their bows are shattered. For Yahweh is a God of recompense[c][b]; he will surely repay.
translation:
  language: fr
  text: Car un dévastateur[a] est venu contre elle, contre Babylone. Ses guerriers ont été capturés, leurs arcs ont été brisés. Car Yahweh est un Dieu de rétribution[b] ; il rendra assurément ce qui est dû.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un pillard » ou « celui qui ravage ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un Dieu de vengeance ». Le terme hébreu évoque le fait de rendre ou de payer en retour.
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוֹדֵד
  choice: un dévastateur
  rationale: Le participe désigne celui qui dévaste ou pille. « Dévastateur » convient au contexte militaire sans réduire l’action au seul pillage.
- source_word: בָא עָלֶיהָ עַל בָּבֶל
  choice: est venu contre elle, contre Babylone
  rationale: 'La répétition de עַל est conservée : « contre Babylone » explicite avec emphase le référent de « elle ».'
- source_word: וְנִלְכְּדוּ
  choice: ont été capturés
  rationale: Le nifal exprime ici le fait d’être pris ou capturé et appelle une formulation passive.
- source_word: גִּבּוֹרֶיהָ
  choice: ses guerriers
  rationale: Littéralement « ses hommes forts » ; dans ce contexte de bataille, le mot désigne les combattants de Babylone.
- source_word: חִתְּתָה קַשְּׁתוֹתָם
  choice: leurs arcs ont été brisés
  rationale: Le verbe évoque la destruction des arcs. « Brisés » restitue clairement l’image de leur mise hors d’usage.
- source_word: אֵל גְּמֻלוֹת
  choice: un Dieu qui rétribue
  rationale: Cette formulation naturelle exprime l’idée de juste retour ou de rétribution, sans limiter le terme à la vengeance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: il rendra certainement à chacun ce qui lui revient
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’affirmation. La formulation française exprime à la fois cette certitude et l’idée de rétribution portée par le verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » en conserve la fonction de nom personnel plutôt que de lui substituer un titre.
- issue: Nuance du jugement divin dans אֵל גְּמֻלוֹת
  choice: un Dieu qui rétribue
  alternative: un Dieu de vengeance ; un Dieu des rétributions
  rationale: L’hébreu souligne le fait de rendre en retour, selon les actes. Le choix retenu préserve la dimension judiciaire sans réduire le sens à la vengeance.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « contre elle, contre Babylone » conserve l’emphase hébraïque. Le rythme bref des propositions maintient la vigueur de l’annonce de jugement.
