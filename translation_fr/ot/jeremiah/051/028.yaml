id: JER.51.28
reference: Jeremiah 51:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קַדְּשׁ֨וּ עָלֶ֤י/הָ גוֹיִם֙ אֶת מַלְכֵ֣י מָדַ֔י אֶת פַּחוֹתֶ֖י/הָ וְ/אֶת כָּל סְגָנֶ֑י/הָ וְ/אֵ֖ת כָּל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/028.yaml
  text: Consecrate the nations against her—the kings of Media[a], her governors and all her prefects[c][b], and every land of his dominion.
translation:
  language: fr
  text: 'Consacrez[a] les nations contre elle : les rois de Médie[b], ses gouverneurs et tous ses préfets, ainsi que tous les pays où s’exerce sa domination[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « consacrer » signifie mettre à part et mobiliser pour une guerre revêtant un caractère sacré.
    reason: cultural_note
  - marker: b
    text: 'Ou : « les rois des Mèdes ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu passe de suffixes féminins dans « ses gouverneurs » et « ses préfets » à un suffixe masculin singulier dans « sa domination ». Ce dernier peut renvoyer au souverain de la Médie en tant que représentant, mais le référent demeure ambigu.
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Consacrez
  rationale: Dans ce contexte militaire, l’impératif de קדשׁ signifie mettre à part et préparer pour une guerre revêtant un caractère sacré. « Consacrez » conserve cette nuance religieuse et martiale.
- source_word: עָלֶיהָ
  choice: contre elle
  rationale: Dans ce contexte d’attaque contre Babylone, עַל exprime une orientation hostile.
- source_word: גוֹיִם
  choice: les nations
  rationale: « Les nations » désigne naturellement les puissances étrangères appelées au combat.
- source_word: מַלְכֵי מָדַי
  choice: les rois de Médie
  rationale: Cette formulation moderne conserve la référence géopolitique et la pluralité du texte hébreu.
- source_word: פַּחוֹתֶיהָ
  choice: ses gouverneurs
  rationale: פֶּחָה désigne des dirigeants provinciaux. Le possessif reprend ici naturellement la Médie, représentée par un nom féminin en hébreu comme en français.
- source_word: סְגָנֶיהָ
  choice: tous ses préfets
  rationale: סְגָן désigne des responsables subalternes. « Préfets » maintient la distinction avec les gouverneurs et la nuance administrative.
- source_word: כָּל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: tous les pays où s’exerce sa domination
  rationale: Cette tournure française exprime l’étendue territoriale du pouvoir sans déterminer artificiellement le référent du possessif masculin singulier hébreu.
theological_decisions:
- issue: Changement de genre dans les suffixes pronominaux
  choice: Conserver l’ambiguïté référentielle dans le texte et signaler en note le passage des suffixes féminins au suffixe masculin singulier.
  alternative: Uniformiser tous les possessifs en les rapportant explicitement à la Médie, ou attribuer explicitement le dernier au roi de Médie.
  rationale: L’hébreu rattache d’abord les gouverneurs et les préfets à un référent féminin, puis emploie un suffixe masculin singulier avec « domination ». Comme les possessifs français ne marquent pas le genre du possesseur, une note est nécessaire pour rendre visible cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe impérative conserve la solennité de l’appel militaire, tandis que les termes administratifs restent accessibles et distincts.
