  yaml_path: translation/ot/jeremiah/051/038.yaml
  text: Together they roar like young lions[a]; they growl like lion cubs.
translation:
  language: fr
  text: Tous ensemble, ils rugissent comme de jeunes lions ; ils grondent[a] comme des lionceaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils poussent des cris rauques ». Le verbe hébreu peut désigner un cri animal rude ; ici, « grondent » s’accorde naturellement avec le parallélisme des lions qui rugissent.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְדָּו
  choice: Tous ensemble
  rationale: L’adverbe exprime une action collective. « Tous ensemble » est naturel en français et souligne que le groupe agit à l’unisson.
- source_word: כְּפִרִים
  choice: de jeunes lions
  rationale: Le nom désigne couramment de jeunes lions déjà vigoureux. Cette formulation claire préserve l’image léonine.
- source_word: יִשְׁאָגוּ
  choice: ils rugissent
  rationale: שאג est le verbe usuel pour le rugissement du lion ; « rugir » en est l’équivalent français direct.
- source_word: נָעֲרוּ
  choice: ils grondent
  rationale: Dans ce contexte animal, le verbe évoque un cri rude. « Gronder » convient à la vocalisation des lionceaux et reste distinct de « rugir », tout en laissant place à l’autre possibilité « pousser des cris rauques ».
- source_word: גֹרֵי אֲרָיוֹת
  choice: des lionceaux
  rationale: Le groupe nominal désigne les petits des lions. « Lionceaux » est précis, actuel et maintient une légère distinction avec les « jeunes lions » du premier membre.
