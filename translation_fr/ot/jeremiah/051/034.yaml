source:
  edition: WLC
  text: אכל/נו הממ/נו נְבוּכַדְרֶאצַּר֮ מֶ֣לֶךְ בָּבֶל֒ הציג/נו כְּלִ֣י רִ֔יק בלע/נו כַּ/תַּנִּ֔ין מִלָּ֥א כְרֵשׂ֖/וֹ מֵֽ/עֲדָנָ֑/י הדיח/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/034.yaml
  text: Nebuchadnezzar king of Babylon has devoured me[a]; he has crushed me. He has set me down like an empty vessel; he has swallowed me like a sea monster; he has filled his belly with my delicacies[c][b]; he has cast me out.
translation:
  language: fr
  text: Nabuchodonosor, roi de Babylone, m’a dévorée ; il m’a broyée. Il m’a déposée comme un vase vide ; il m’a engloutie comme un monstre marin[a]. Il s’est rempli le ventre de mes mets délicats[b], puis il m’a rejetée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un dragon » ou « comme un grand serpent ». Le mot hébreu peut désigner diverses créatures reptiliennes ou monstrueuses ; l’image de l’engloutissement favorise ici « monstre marin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de mes délices » ou « de mes biens précieux ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, le verbe peut aussi signifier « chasser » ou « expulser ». Dans la suite de l’image alimentaire, « rejeter » peut suggérer que le monstre se débarrasse de sa victime après s’être rassasié, sans que le texte dise explicitement « vomir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אכלנו (אכל)
  choice: m’a dévorée
  rationale: Le verbe signifie littéralement « manger, dévorer ». « Dévorer » conserve la violence de l’image. L’accord féminin rend la personnification de Jérusalem, qui parle ici.
- source_word: הממנו (המם)
  choice: il m’a broyée
  rationale: Le verbe exprime la mise en déroute, la dévastation ou l’anéantissement. « Broyée » s’intègre naturellement à la série d’images violentes sans réduire le sens à la seule confusion.
- source_word: הציגנו (יצג, hiphil)
  choice: il m’a déposée comme
  rationale: Le hiphil présente concrètement la victime placée ou laissée dans l’état d’un objet vidé. « Déposée comme » préserve cette image plutôt que de la remplacer par « il a fait de moi ».
- source_word: כְּלִי רִיק
  choice: un vase vide
  rationale: כְּלִי désigne largement un objet ou récipient. « Vase » garde un registre poétique digne, tandis que « vide » rend directement רִיק.
- source_word: בלענו (בלע)
  choice: il m’a engloutie
  rationale: Le verbe signifie « avaler ». « Engloutir » restitue en français l’action entière et violente suggérée par le monstre dévorant.
- source_word: כַּתַּנִּין
  choice: comme un monstre marin
  rationale: תַּנִּין peut désigner un grand serpent, un dragon ou un monstre associé aux eaux. Dans cette scène d’engloutissement, « monstre marin » communique clairement l’image sans les associations modernes trop précises de « dragon ».
- source_word: מִלָּא כְרֵשׂוֹ
  choice: il s’est rempli le ventre
  rationale: כָּרֵשׂ désigne le ventre ou l’estomac. La formulation française conserve l’image grotesque de la voracité du conquérant.
- source_word: מֵעֲדָנָי
  choice: de mes mets délicats
  rationale: מַעֲדַנִּים peut désigner des délices, des mets raffinés ou des biens précieux et agréables. « Mets délicats » prolonge l’image alimentaire tout en évoquant ce que Babylone a pillé.
- source_word: הדיחנו (דוח/נדח, hiphil)
  choice: puis il m’a rejetée
  rationale: Le verbe peut exprimer l’expulsion ou le fait de chasser. « Rejetée » maintient le lien possible avec l’image de l’ingestion, sans imposer explicitement l’idée de vomissement.
theological_decisions:
- issue: Identité et nombre de la voix poétique
  choice: 'Une Jérusalem personnifiée parle au singulier féminin : « me… dévorée »'
  alternative: 'Une collectivité parlant au pluriel : « nous »'
  rationale: Le contexte immédiat donne la parole à Sion/Jérusalem pour dénoncer la violence de Babylone. Le singulier personnifié rend cette voix poétique de façon cohérente, tout en signalant dans une note la difficulté formelle transmise par la présentation hébraïque.
translation_notes:
  register: Français international moderne, poétique et digne. Les phrases brèves et parallèles conservent l’accumulation accusatrice de l’hébreu. Le féminin marque la personnification de Jérusalem. « Vase » est employé au sens large de récipient, et non au seul sens décoratif moderne.
