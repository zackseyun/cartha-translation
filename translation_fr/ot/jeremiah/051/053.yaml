source:
  edition: WLC
  text: כִּֽי תַעֲלֶ֤ה בָבֶל֙ הַ/שָּׁמַ֔יִם וְ/כִ֥י תְבַצֵּ֖ר מְר֣וֹם עֻזָּ֑/הּ מֵ/אִתִּ֗/י יָבֹ֧אוּ שֹׁדְדִ֛ים לָ֖/הּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/053.yaml
  text: Though Babylon should ascend to the heavens[a], and though she should fortify her lofty stronghold, destroyers will come to her from me[b], declares Yahweh.
translation:
  language: fr
  text: Même si Babylone monte jusqu’au ciel, même si elle fortifie la hauteur de sa puissance[a], c’est de moi que viendront contre elle des dévastateurs[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la hauteur de sa force » ou « la hauteur de sa puissance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des pillards ». Le terme hébreu peut désigner ceux qui ravagent en pillant aussi bien qu’en détruisant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי ... וְכִי
  choice: Même si… même si
  rationale: 'Dans ce contexte, les deux particules introduisent des propositions concessives parallèles : aucune mesure extrême prise par Babylone ne pourra empêcher le jugement annoncé.'
- source_word: תַעֲלֶה ... הַשָּׁמַיִם
  choice: montait jusqu’au ciel
  rationale: Le verbe signifie « monter » et l’expression décrit de manière hyperbolique l’élévation de Babylone. Le singulier collectif « ciel » est idiomatique en français.
- source_word: תְבַצֵּר מְרוֹם עֻזָּהּ
  choice: fortifiait sa citadelle haut perchée
  rationale: Le verbe désigne l’action de fortifier ou de rendre inaccessible. Dans ce contexte militaire, la « hauteur de sa force » évoque concrètement une position défensive élevée ; la note conserve la formulation plus littérale.
- source_word: מֵאִתִּי
  choice: c’est de moi que viendront
  rationale: La tournure souligne que Yahweh est la source et l’instigateur de la venue des dévastateurs, tout en conservant le sens direct de la préposition hébraïque.
- source_word: שֹׁדְדִים
  choice: dévastateurs
  rationale: Le terme désigne des personnes qui ravagent en détruisant et en pillant. « Dévastateurs » exprime le sens large, tandis que « pillards » reste une autre traduction possible.
- source_word: לָהּ
  choice: contre elle
  rationale: Bien que la préposition puisse être rendue formellement par « vers elle », le contexte hostile appelle naturellement « contre elle » en français ; le pronom féminin reprend Babylone personnifiée.
- source_word: נְאֻם
  choice: déclare
  rationale: Formule prophétique solennelle introduisant une déclaration divine ; « déclare » est actuel, clair et digne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsme. Le parallélisme concessif de l’hébreu est conservé par la répétition de « même si ». La formulation garde l’image verticale et militaire tout en restant immédiatement compréhensible.
