  text: וְ֠/הִשְׁכַּרְתִּי שָׂרֶ֨י/הָ וַ/חֲכָמֶ֜י/הָ פַּחוֹתֶ֤י/הָ וּ/סְגָנֶ֨י/הָ֙ וְ/גִבּוֹרֶ֔י/הָ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/057.yaml
  text: And I will make her officials drunk—her wise men[a], her governors, her deputies, and her warriors—and they will sleep an everlasting sleep and not wake up, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: fr
  text: Je ferai boire jusqu’à l’ivresse ses chefs, ses sages, ses gouverneurs, ses hauts fonctionnaires et ses guerriers ; ils dormiront d’un sommeil éternel et ne se réveilleront pas, déclare le Roi, dont le nom est Yahweh des armées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁכַּרְתִּי
  choice: Je ferai boire … jusqu’à l’ivresse
  rationale: Le hiphil de שׁכר est causatif. Cette formulation française naturelle exprime l’action de rendre ivre sans suggérer seulement que les intéressés boiront d’eux-mêmes.
- source_word: שָׂרֶיהָ
  choice: ses chefs
  rationale: שׂר désigne ici les dirigeants ou hauts responsables de Babylone. « Chefs » est clair, large et n’implique pas qu’il s’agisse de princes de sang royal.
- source_word: חֲכָמֶיהָ
  choice: ses sages
  rationale: Le terme désigne les hommes réputés pour leur sagesse, probablement des conseillers de la cour. « Sages » est direct et naturel en français biblique moderne.
- source_word: פַּחוֹתֶיהָ
  choice: ses gouverneurs
  rationale: פּחה désigne un gouverneur administratif. « Gouverneurs » conserve cette valeur sans imposer le titre plus spécifique de « satrapes ».
- source_word: סְגָנֶיהָ
  choice: ses hauts fonctionnaires
  rationale: סגן désigne des responsables administratifs de rang subordonné. « Hauts fonctionnaires » est intelligible et distingue ce groupe des gouverneurs, tout en évitant le faux sens possible de « députés » en français moderne.
- source_word: גִבּוֹרֶיהָ
  choice: ses guerriers
  rationale: גבור désigne ici les hommes puissants ou valeureux dans un cadre militaire. « Guerriers » communique clairement cette dimension.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: ils dormiront d’un sommeil éternel
  rationale: La traduction conserve l’image hébraïque du sommeil pour la mort et rend la force de עוֹלָם sans l’aplatir en une simple mention de la mort.
- source_word: וְלֹא יָקִיצוּ
  choice: dont ils ne se réveilleront pas
  rationale: Cette formulation française maintient explicitement la métaphore du sommeil et exprime son caractère irréversible dans le contexte.
- source_word: נְאֻם
  choice: déclare
  rationale: « Déclare » rend naturellement la formule prophétique d’énoncé autoritatif.
- source_word: הַמֶּלֶךְ
  choice: le Roi
  rationale: Le mot fonctionne comme un titre divin dans la formule finale. La majuscule signale cet emploi titulaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans l’hébreu au lieu de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette expression restitue le sens concret de צְבָאוֹת et reste plus transparente pour le lecteur moderne que « des puissances » ou l’ancien « des armées célestes », plus interprétatif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre sans lui substituer un titre ni adopter la forme traditionnelle française « l’Éternel », qui traduit interprétativement plutôt qu’elle ne translittère.
- issue: Portée du « sommeil éternel »
  choice: Conserver la métaphore de la mort comme sommeil irréversible dans ce jugement
  alternative: ils mourront pour toujours / ils mourront et ne ressusciteront jamais
  rationale: L’hébreu parle de sommeil et d’absence de réveil. La traduction garde cette image sans en tirer une affirmation doctrinale plus précise sur la résurrection ou l’état final.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’énumération solennelle des élites babyloniennes et la métaphore du sommeil. « Faire boire jusqu’à l’ivresse » est préféré au plus raide « enivrer »; « hauts fonctionnaires » évite le sens parlementaire moderne de « députés ». Aucun appel de note n’est nécessaire.
