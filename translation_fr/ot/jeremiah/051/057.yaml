  to: Je ferai boire jusqu’à l’ivresse ses chefs, ses sages, ses gouverneurs, ses hauts fonctionnaires et ses guerriers ; ils dormiront d’un sommeil éternel et ne se réveilleront pas, déclare le Roi, dont le nom est Yahweh des armées.
