id: JER.51.7
reference: Jeremiah 51:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כּוֹס זָהָ֤ב בָּבֶל֙ בְּ/יַד יְהוָ֔ה מְשַׁכֶּ֖רֶת כָּל הָ/אָ֑רֶץ מִ/יֵּינָ/הּ֙ שָׁת֣וּ גוֹיִ֔ם עַל כֵּ֖ן יִתְהֹלְל֥וּ גוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/007.yaml
  text: Babylon was a golden cup in the hand of Yahweh[a], making all the earth drunk. Nations drank from her wine[b]; therefore the nations have gone mad.
translation:
  language: fr
  text: Babylone était une coupe d’or dans la main de Yahweh[a], elle qui enivrait toute la terre. Les nations ont bu de son vin ; c’est pourquoi elles sont devenues folles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « elles se comportent en insensées » ou « elles sont prises de frénésie ». Dans ce contexte d’ivresse, le verbe hébreu évoque probablement la folie ou la frénésie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס זָהָב
  choice: une coupe d’or
  rationale: Rend naturellement l’expression hébraïque et conserve l’image de Babylone comme instrument d’un jugement qui enivre.
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: בְּיַד יְהוָה
  choice: dans la main de Yahweh
  rationale: Conserve l’image hébraïque de la main, qui présente Babylone comme un instrument tenu et employé par Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin YHWH au lieu de lui substituer un titre.
- source_word: מְשַׁכֶּרֶת
  choice: elle qui enivrait
  rationale: Le participe féminin renvoie à Babylone, personnifiée, et exprime une action causative ou continue. Cette tournure évite qu’en français le participe « enivrant » semble qualifier la main de Yahweh.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: Le contexte international, confirmé par la mention des nations, favorise « terre » plutôt que « pays ».
- source_word: מִיֵּינָהּ שָׁתוּ גוֹיִם
  choice: Les nations ont bu de son vin
  rationale: Reproduit la métaphore et rattache naturellement le suffixe féminin à Babylone personnifiée.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Exprime clairement et naturellement le rapport de conséquence.
- source_word: יִתְהֹלְלוּ גוֹיִם
  choice: elles sont devenues folles
  rationale: Dans le contexte de l’ivresse, le verbe exprime vraisemblablement la folie ou la frénésie. Le pronom reprend les nations sans répétition pesante.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre tout en signalant en note la convention traditionnelle.
- issue: Rapport entre la souveraineté de Yahweh et l’action de Babylone
  choice: Conserver l’image de Babylone comme coupe dans la main de Yahweh
  alternative: Expliciter Babylone comme simple puissance politique ou comme agent direct du jugement divin
  rationale: La métaphore affirme à la fois l’action dévastatrice de Babylone et sa place dans la main de Yahweh, sans préciser davantage la nature de cette instrumentalité.
- issue: Effet du vin de Babylone sur les nations
  choice: elles sont devenues folles
  alternative: elles se comportent en insensées / elles sont prises de frénésie
  rationale: Le contexte d’ivresse privilégie la folie ou la frénésie, mais la formulation française choisie ne cherche pas à définir plus précisément si l’état est subi ou manifesté par leur conduite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les images fortes de la coupe, de la main, du vin et de l’ivresse, tout en levant une ambiguïté grammaticale que créerait en français un simple participe placé après « la main de Yahweh ».
