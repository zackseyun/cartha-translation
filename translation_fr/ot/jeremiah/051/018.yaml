source:
  edition: WLC
  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/018.yaml
  text: They are vanity[a], a work of delusion[b]; at the time of their punishment they will perish.
translation:
  language: fr
  text: Ils ne sont que néant, une œuvre trompeuse[a] ; quand viendra le temps de leur châtiment[b], ils périront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une œuvre de tromperie », « une œuvre dérisoire » ou « une œuvre qui égare ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « au temps de leur visitation ». Le terme peut désigner une intervention ou un jugement ; dans ce contexte, il s’agit vraisemblablement d’une intervention punitive.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: néant
  rationale: Dans la polémique contre les idoles, le terme exprime leur inconsistance, leur vacuité et leur inutilité. « Néant » rend cette force avec concision en français moderne.
- source_word: הֵמָּה
  choice: Ils ne sont que
  rationale: Le pronom indépendant donne du relief à l’affirmation. La tournure française « ne sont que » exprime naturellement la valeur dépréciative de la proposition nominale.
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: une œuvre trompeuse
  rationale: Le singulier de מַעֲשֵׂה est conservé, tandis que תַּעְתֻּעִים désigne ce qui égare, trompe ou prête à la dérision. « Trompeuse » convient à la polémique sans exclure les autres nuances.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: quand viendra le temps de leur châtiment
  rationale: La formulation rend naturellement la valeur temporelle et le sens judiciaire probable de פְּקֻדָּה dans ce contexte, tout en signalant en note le sens plus général d’« intervention » ou de « visite ».
- source_word: יֹאבֵדוּ
  choice: ils périront
  rationale: Le verbe אבד est ici intransitif et annonce la disparition des idoles. « Périront » en conserve directement la force.
theological_decisions:
- issue: Nature de la polémique contre les idoles
  choice: Les idoles sont présentées comme inconsistantes et trompeuses, destinées à périr lors du jugement.
  alternative: L’expression peut surtout les présenter comme une œuvre dérisoire ou ridicule.
  rationale: Le contexte des oracles contre les idoles associe leur vacuité à leur disparition au moment de l’intervention judiciaire, sans imposer une explication doctrinale supplémentaire.
- issue: Sens de פְּקֻדָּה
  choice: châtiment
  alternative: visite, intervention ou règlement de comptes
  rationale: Dans ce contexte de jugement, la visite est punitive. La traduction principale explicite cette valeur, tandis que la note préserve l’étendue sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu, mais « quand viendra » évite une tournure pesante. Les deux notes maintiennent les ambiguïtés lexicales importantes.
