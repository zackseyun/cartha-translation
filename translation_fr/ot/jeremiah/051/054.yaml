  yaml_path: translation/ot/jeremiah/051/054.yaml
  text: The sound of a cry comes from Babylon[a], and great destruction from the land of the Chaldeans.
translation:
  language: fr
  text: Un cri s’élève de Babylone[a], et une grande destruction vient du pays des Chaldéens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le son d’un cri vient de Babylone, et une grande ruine du pays des Chaldéens. »'
    reason: 'Alternative lexicale et syntaxique : קול peut être rendu par « son », et שבר par « ruine ». L’hébreu est elliptique et ne comporte pas de verbe exprimé.'
lexical_decisions:
- source_word: ק֥וֹל זְעָקָ֖ה
  choice: Le bruit d’un cri
  rationale: קוֹל désigne ici un son ou un bruit perceptible, et זְעָקָה un cri de détresse. « Le bruit d’un cri » conserve l’image auditive et reste naturel en français.
- source_word: מִ/בָּבֶ֑ל
  choice: vient de Babylone
  rationale: La préposition מִן marque la provenance. Le verbe « vient » est ajouté pour former une phrase française complète sans modifier le sens de la proposition hébraïque sans verbe.
- source_word: וְ/שֶׁ֥בֶר גָּד֖וֹל
  choice: et celui d’un grand désastre
  rationale: שֶׁבֶר peut évoquer la rupture, l’effondrement ou la ruine catastrophique. « Désastre » exprime ici l’ampleur de la calamité; « celui » reprend « le bruit » et rend explicite le parallélisme elliptique.
- source_word: מֵ/אֶ֥רֶץ כַּשְׂדִּֽים
  choice: du pays des Chaldéens
  rationale: Le texte désigne littéralement le territoire associé au peuple chaldéen. « Pays des Chaldéens » préserve cette formulation ethnogéographique.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation garde le parallélisme auditif du verset tout en explicitant avec mesure l’ellipse de l’hébreu.
