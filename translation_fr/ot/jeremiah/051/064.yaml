source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כָּ֠כָה תִּשְׁקַ֨ע בָּבֶ֤ל וְ/לֹֽא תָקוּם֙ מִ/פְּנֵ֣י הָ/רָעָ֗ה אֲשֶׁ֧ר אָנֹכִ֛י מֵבִ֥יא עָלֶ֖י/הָ וְ/יָעֵ֑פוּ עַד הֵ֖נָּה דִּבְרֵ֥י יִרְמְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/064.yaml
  text: And you shall say[a], ‘Thus Babylon will sink and will not rise because of the disaster that I am bringing upon her, and they will grow weary.’ Up to this point are the words of Jeremiah.
translation:
  language: fr
  text: 'Puis tu diras : « Ainsi Babylone sombrera et ne se relèvera pas, à cause du désastre que je fais venir sur elle. Et ils s’épuiseront[a]. » Ici prennent fin les paroles de Jérémie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils se fatigueront » ou « ils défailliront ». Le sujet du verbe au pluriel n’est pas précisé ; il peut renvoyer aux habitants de Babylone ou à d’autres personnes associées à sa chute.
    reason: Variante lexicale et ambiguïté du référent
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Puis tu diras
  rationale: Le parfait qal à la 2e personne masculine singulière, précédé de la conjonction, poursuit la série d’instructions. « Puis tu diras » exprime naturellement en français cette valeur injonctive et séquentielle.
- source_word: כָּכָה
  choice: Ainsi
  rationale: Cet adverbe déictique introduit l’interprétation solennelle du geste symbolique.
- source_word: תִּשְׁקַע בָּבֶל
  choice: Babylone sombrera
  rationale: Le verbe שׁקע décrit l’action de s’enfoncer. « Sombrera » conserve l’image du rouleau jeté dans l’Euphrate tout en annonçant la chute de la ville.
- source_word: וְלֹא תָקוּם
  choice: et ne se relèvera pas
  rationale: קום contraste ici avec l’enfoncement. « Se relever » maintient cette opposition et convient aussi à la chute d’une puissance.
- source_word: מִפְּנֵי הָרָעָה
  choice: à cause du désastre
  rationale: מִפְּנֵי a ici une valeur causale. Dans ce contexte de jugement, רָעָה désigne un malheur ou une catastrophe, non le mal moral.
- source_word: אֲשֶׁר אָנֹכִי מֵבִיא עָלֶיהָ
  choice: que je fais venir sur elle
  rationale: Le participe מֵבִיא présente l’action divine comme engagée ou imminente. Cette formulation conserve aussi le féminin renvoyant à Babylone.
- source_word: וְיָעֵפוּ
  choice: Et ils s’épuiseront
  rationale: Le verbe יעף exprime la fatigue, l’épuisement ou la défaillance. Le pluriel, en rupture avec Babylone au féminin singulier, est conservé sans identifier explicitement son référent.
- source_word: עַד הֵנָּה דִּבְרֵי יִרְמְיָהוּ
  choice: Ici prennent fin les paroles de Jérémie
  rationale: Cette formule fonctionne comme une notice finale. La tournure française rend clairement et dignement la clôture du recueil.
theological_decisions:
- issue: Sens de הָרָעָה dans une annonce de jugement divin
  choice: désastre
  alternative: mal ; malheur ; calamité
  rationale: Le contexte parle de la catastrophe infligée à Babylone. « Désastre » préserve la gravité du jugement sans faire de הָרָעָה une affirmation selon laquelle Dieu produirait le mal moral.
- issue: Référent du pluriel וְיָעֵפוּ
  choice: Maintien du pronom indéterminé « ils »
  alternative: les habitants de Babylone s’épuiseront
  rationale: L’hébreu passe soudainement du féminin singulier au masculin pluriel sans nommer le sujet. L’expliciter dans le texte résoudrait une ambiguïté réelle, probablement orientée vers les habitants ou défenseurs de Babylone.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste accessible, tandis que « sombrera », « se relèvera » et la formule finale conservent la force imagée et la dignité du registre prophétique.
