source:
  edition: WLC
  text: צְא֤וּ מִ/תּוֹכָ/הּ֙ עַמִּ֔/י וּ/מַלְּט֖וּ אִ֣ישׁ אֶת נַפְשׁ֑/וֹ מֵ/חֲר֖וֹן אַף יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/045.yaml
  text: Come out from her midst[a], my people, and let each man save his life from the burning anger of Yahweh.
translation:
  language: fr
  text: Sortez du milieu d’elle, mon peuple ! Que chacun sauve sa vie de l’ardente colère de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’ardeur de la colère de Yahweh » ; l’expression hébraïque évoque littéralement la chaleur de sa colère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאוּ מִתּוֹכָהּ
  choice: Sortez du milieu d’elle
  rationale: L’impératif pluriel appelle à quitter la ville personnifiée. « Du milieu d’elle » conserve à la fois la spatialité de l’expression et le suffixe féminin qui renvoie à Babylone dans le contexte.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Cette adresse conserve le possessif et sa portée d’appartenance à Dieu.
- source_word: וּמַלְּטוּ אִישׁ אֶת נַפְשׁוֹ
  choice: Que chacun sauve sa vie
  rationale: אִישׁ a ici une valeur distributive. En français courant, « chacun » exprime naturellement cette valeur sans laisser croire que seuls les hommes sont visés. נֶפֶשׁ désigne ici la vie, non une âme immatérielle.
- source_word: מֵחֲרוֹן אַף
  choice: de l’ardente colère
  rationale: Cette formulation préserve l’image de chaleur portée par חָרוֹן tout en restant naturelle et digne en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » en conserve la fonction de nom propre.
- issue: Portée de אִישׁ dans la construction distributive
  choice: chacun
  alternative: chaque homme
  rationale: Bien que le nom hébreu soit masculin singulier, sa fonction est distributive et représentative. « Chacun » restitue cette portée en français moderne sans modifier le référent.
translation_notes:
  register: Français international moderne, direct et solennel. L’exclamation marque l’urgence des impératifs. La personnification féminine de Babylone est conservée par « d’elle ».
