  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹ֠תֵן אֶת פַּרְעֹ֨ה חָפְרַ֤ע מֶֽלֶךְ מִצְרַ֨יִם֙ בְּ/יַ֣ד אֹֽיְבָ֔י/ו וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשׁ֑/וֹ כַּ/אֲשֶׁ֨ר נָתַ֜תִּי אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה בְּ/יַ֨ד נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל אֹיְב֖/וֹ וּ/מְבַקֵּ֥שׁ נַפְשֽׁ/וֹ׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/030.yaml
  text: 'Thus says Yahweh: Behold[a], I am giving Pharaoh Hophra king of Egypt into the hand of his enemies and into the hand of those seeking his life, just as I gave Zedekiah king of Judah into the hand of Nebuchadnezzar king of Babylon, his enemy and the one seeking his life.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Voici, je vais livrer le pharaon Hophra, roi d’Égypte, aux mains de ses ennemis et de ceux qui cherchent à lui ôter la vie, tout comme j’ai livré Sédécias, roi de Juda, aux mains de Nebucadretsar[a], roi de Babylone, son ennemi, celui qui cherchait à lui ôter la vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Nebucadretsar » ; nom traditionnellement rendu « Nabuchodonosor » en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Reproduit la formule prophétique solennelle et rend explicitement le nom divin.
- source_word: הִנְנִי נֹתֵן
  choice: Voici, je vais livrer
  rationale: « Voici » conserve la force présentative de הִנְנִי ; « je vais livrer » exprime naturellement en français la valeur imminente et certaine du participe נֹתֵן dans cette construction.
- source_word: פַּרְעֹה חָפְרַע
  choice: le pharaon Hophra
  rationale: Conserve la forme hébraïque du nom royal plutôt que son équivalent grec historique Apriès.
- source_word: בְּיַד
  choice: aux mains de
  rationale: Préserve l’image hébraïque de la main comme expression du pouvoir et convient à la répétition structurante du verset.
- source_word: מְבַקְשֵׁי נַפְשׁוֹ
  choice: ceux qui cherchent à lui ôter la vie
  rationale: Exprime clairement la portée meurtrière de l’idiome tout en gardant l’idée de rechercher la vie de quelqu’un.
- source_word: כַּאֲשֶׁר
  choice: tout comme
  rationale: Marque nettement le parallèle entre le sort de Hophra et celui de Sédécias.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebucadretsar
  rationale: Transcrit la forme consonantique attestée dans le texte hébreu du verset ; la forme française traditionnelle est signalée en note.
- source_word: אֹיְבוֹ וּמְבַקֵּשׁ נַפְשׁוֹ
  choice: son ennemi, qui cherchait à lui ôter la vie
  rationale: Les deux expressions singulières qualifient Nebucadretsar ; la relative française rend naturellement leur rapport appositionnel sans confondre celui-ci avec les ennemis pluriels de Hophra.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Conserve le nom propre divin conformément à l’orientation du projet, sans le remplacer par un titre.
- issue: Rapport entre « son ennemi » et « celui qui cherchait sa vie »
  choice: 'Une relative qualifie Nebucadretsar : « son ennemi, qui cherchait à lui ôter la vie »'
  alternative: 'Deux désignations coordonnées : « son ennemi et celui qui cherchait à lui ôter la vie »'
  rationale: Le texte hébreu coordonne deux expressions singulières qui ont le même référent. La relative évite de suggérer en français deux personnes différentes tout en conservant les deux caractérisations.
translation_notes:
  register: Français international moderne, solennel mais accessible. La tournure prophétique « Ainsi parle » et l’image « aux mains de » maintiennent la dignité et les échos du texte hébreu ; « ôter la vie » rend l’idiome de façon claire sans brutalité paraphrastique.
