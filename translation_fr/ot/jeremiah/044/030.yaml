revisions:
- from: 'Ainsi parle Yahweh : « Voici, je vais livrer le pharaon Hophra, roi d’Égypte, aux mains de ses ennemis et de ceux qui cherchent à lui ôter la vie, tout comme j’ai livré Sédécias, roi de Juda, aux mains de Nebucadretsar[a], roi de Babylone, son ennemi, qui cherchait à lui ôter la vie. »'
  to: 'Ainsi parle Yahweh : « Voici, je vais livrer le pharaon Hophra, roi d’Égypte, aux mains de ses ennemis et de ceux qui cherchent à lui ôter la vie, tout comme j’ai livré Sédécias, roi de Juda, aux mains de Nebucadretsar[a], roi de Babylone, son ennemi, celui qui cherchait à lui ôter la vie. »'
  rationale: La révision se limite à la dernière apposition afin de conserver explicitement les deux caractérisations coordonnées de Nebucadretsar dans le texte hébreu. Le reste de la traduction et la note sont sûrs, naturels et fidèles.
