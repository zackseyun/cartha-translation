  text: לֹ֣א דֻכְּא֔וּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א יָרְא֗וּ וְ/לֹֽא הָלְכ֤וּ בְ/תֽוֹרָתִ/י֙ וּ/בְ/חֻקֹּתַ֔/י אֲשֶׁר נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם וְ/לִ/פְנֵ֥י אֲבוֹתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/010.yaml
  text: They have not been humbled to this day[a], and they have not feared[b], and they have not walked in my law and in my statutes that I set before you and before your fathers.
translation:
  language: fr
  text: Jusqu’à ce jour, ils n’ont pas été humiliés[a], ils n’ont éprouvé aucune crainte et ils n’ont pas marché selon ma loi et selon mes prescriptions, que j’ai mises devant vous et devant vos pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « n’ont pas été brisés », « ne sont pas devenus contrits » ; dans ce contexte, on pourrait comprendre : « ne se sont pas repentis ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « vos ancêtres » ; le terme hébreu signifie littéralement « vos pères » et désigne ici les générations antérieures.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֻכְּאוּ
  choice: n’ont pas été abaissés
  rationale: Le pual de דכא exprime le fait d’être écrasé, abaissé ou rendu contrit. « Ont été abaissés » conserve la forme passive et la portée morale possible sans expliciter indûment le repentir.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Jusqu’à ce jour
  rationale: Rend naturellement l’expression temporelle hébraïque et souligne que cette attitude persiste au moment où Dieu parle.
- source_word: יָרְאוּ
  choice: n’ont éprouvé aucune crainte
  rationale: Le verbe ירא peut évoquer aussi bien la peur que la crainte révérencielle. Cette formulation française conserve cette amplitude sans ajouter un complément absent de l’hébreu.
- source_word: הָלְכוּ בְתוֹרָתִי
  choice: n’ont pas marché selon ma loi
  rationale: « Marcher » maintient la métaphore biblique de la conduite, tandis que « selon » exprime naturellement en français la norme indiquée par la préposition ב.
- source_word: וּבְחֻקֹּתַי
  choice: et mes prescriptions
  rationale: חֻקִּים désigne des règles établies ou prescrites. « Prescriptions » garde le registre juridique et s’accorde naturellement avec « loi ».
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: que j’ai mises devant vous
  rationale: La tournure rend l’idiome נתן לפני, qui présente la loi et les prescriptions comme placées devant les destinataires pour guider leur conduite.
- source_word: וְלִפְנֵי אֲבוֹתֵיכֶם
  choice: et devant vos pères
  rationale: Les suffixes sont sans ambiguïté à la deuxième personne du pluriel. « Vos pères » conserve en outre la forme masculine du texte, tout en désignant les générations antérieures.
theological_decisions:
- issue: Faut-il traduire דֻכְּאוּ par un terme explicite de repentance ?
  choice: ils n’ont pas été abaissés
  alternative: ils ne se sont pas repentis ; ils ne sont pas devenus contrits ; ils n’ont pas été brisés
  rationale: Le contexte implique le refus de répondre aux jugements de Dieu, mais le verbe ne signifie pas explicitement « se repentir ». La traduction retenue préserve donc l’image et la tension du texte.
- issue: Nature de la crainte exprimée par ירא
  choice: ils n’ont éprouvé aucune crainte
  alternative: ils n’ont pas eu peur ; ils n’ont pas révéré Dieu
  rationale: L’absence de complément permet à la crainte d’inclure à la fois la peur face au jugement et la révérence envers Dieu. La traduction ne tranche pas artificiellement entre ces nuances.
- issue: Personne grammaticale dans לִפְנֵיכֶם et אֲבוֹתֵיכֶם
  choice: devant vous et devant vos pères
  alternative: devant eux et devant leurs pères
  rationale: Les deux suffixes hébreux sont à la deuxième personne masculine plurielle. Le passage de « ils » à « vous » reflète donc l’adresse directe du texte et ne doit pas être harmonisé en troisième personne.
translation_notes:
  register: Français international actuel, sobre et digne. La répétition hébraïque de la négation est légèrement allégée pour une lecture naturelle, tandis que la métaphore de la marche, la voix passive de דֻכְּאוּ et le passage grammatical de la troisième à la deuxième personne sont conservés.
