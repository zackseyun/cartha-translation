source:
  edition: WLC
  text: מִ/פְּנֵי֩ אֲשֶׁ֨ר קִטַּרְתֶּ֜ם וַ/אֲשֶׁ֧ר חֲטָאתֶ֣ם לַ/יהוָ֗ה וְ/לֹ֤א שְׁמַעְתֶּם֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/בְ/תֹרָת֧/וֹ וּ/בְ/חֻקֹּתָ֛י/ו וּ/בְ/עֵדְוֺתָ֖י/ו לֹ֣א הֲלַכְתֶּ֑ם עַל כֵּ֞ן קָרָ֥את אֶתְ/כֶ֛ם הָ/רָעָ֥ה הַ/זֹּ֖את כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/023.yaml
  text: Because you burned incense and sinned against Yahweh[a], and did not listen to the voice of Yahweh or walk in his law, his statutes, and his testimonies, therefore this disaster has come upon you[d][c][b], as it is this day.
translation:
  language: fr
  text: Parce que vous avez brûlé de l’encens[a], péché contre Yahweh, n’avez pas écouté la voix de Yahweh et n’avez pas suivi sa loi[b], ses prescriptions ni ses témoignages, c’est pourquoi ce malheur vous a atteints[c], comme on le voit aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offert de l’encens ». Le verbe hébreu désigne l’action de faire fumer de l’encens ou une offrande sacrificielle.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « loi » peut aussi signifier « enseignement » ou « instruction ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ce désastre s’est abattu sur vous ». Le terme hébreu peut signifier « mal » ou, comme ici, « malheur, calamité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי אֲשֶׁר
  choice: Parce que
  rationale: Introduit directement la cause du jugement dans un français naturel.
- source_word: קִטַּרְתֶּם
  choice: vous avez brûlé de l’encens
  rationale: Rend le geste cultuel consistant à faire fumer de l’encens ou une offrande; une note conserve l’alternative plus générale.
- source_word: חֲטָאתֶם לַיהוָה
  choice: péché contre Yahweh
  rationale: Le complément en ל marque ici la personne contre laquelle le péché est commis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: שְׁמַעְתֶּם בְּקוֹל יְהוָה
  choice: vous n’avez pas écouté la voix de Yahweh
  rationale: Conserve l’expression hébraïque et sa portée d’obéissance sans la réduire à une explicitation.
- source_word: וּבְתוֹרָתוֹ
  choice: sa loi
  rationale: Dans cette série de termes liés à l’alliance, « loi » est clair et concis; « enseignement » reste possible.
- source_word: וּבְחֻקֹּתָיו
  choice: ses prescriptions
  rationale: Terme français courant et digne pour les règles fixées ou prescrites.
- source_word: וּבְעֵדְוֹתָיו
  choice: ses témoignages
  rationale: Préserve la distinction lexicale du troisième terme de la série, malgré son registre plus formel.
- source_word: לֹא הֲלַכְתֶּם
  choice: vous n’avez pas suivi
  rationale: Rend naturellement en français la métaphore hébraïque de marcher selon des commandements.
- source_word: עַל כֵּן
  choice: ce malheur vous a frappés
  rationale: La conséquence est marquée par la construction française de la phrase; le verbe « frapper » exprime idiomatiquement l’arrivée de la calamité.
- source_word: קָרָאת אֶתְכֶם הָרָעָה הַזֹּאת
  choice: ce malheur vous a frappés
  rationale: רָעָה désigne ici une calamité plutôt qu’un mal moral; « frapper » rend l’événement de façon naturelle.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Explicite sobrement que l’état présent atteste le jugement annoncé.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette donnée sans lui substituer un titre.
- issue: Sens de רָעָה dans le contexte du jugement
  choice: malheur
  alternative: désastre
  rationale: Le mot désigne ici la calamité subie, non le mal moral; « malheur » reste proche du champ lexical hébraïque et naturel en français.
- issue: Portée de שמע בקול
  choice: écouter la voix de Yahweh
  alternative: obéir à Yahweh
  rationale: Le rendu choisi conserve l’image et l’ambivalence entre écoute et obéissance effective.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition causale est conservée pour refléter la structure hébraïque; « suivre » évite le calque peu naturel « marcher dans » tout en exprimant la conduite. Tous les marqueurs de notes figurent dans le texte.
