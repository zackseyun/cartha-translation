source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הַשְׁכֵּ֥ים וְ/שָׁלֹ֖חַ לֵ/אמֹ֑ר אַל נָ֣א תַעֲשׂ֗וּ אֵ֛ת דְּבַֽר הַ/תֹּעֵבָ֥ה הַ/זֹּ֖את אֲשֶׁ֥ר שָׂנֵֽאתִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/004.yaml
  text: Yet I sent to you all my servants the prophets[a], rising early and sending them, saying[b], 'Please do not do this abominable thing that I hate.'
translation:
  language: fr
  text: 'Pourtant, je vous ai envoyé tous mes serviteurs, les prophètes, sans relâche[a], en leur disant : « Je vous en prie, ne faites pas cette chose abominable[b] que je déteste. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « me levant tôt et envoyant », expression qui évoque un envoi répété, empressé et persévérant.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « cette chose détestable » ; autre traduction possible : « cette abomination ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Pourtant, je vous ai envoyé
  rationale: 'Le waw fait progresser le récit, mais le contexte donne à l’envoi une légère valeur adversative : malgré le refus du peuple, Dieu a continué d’envoyer ses messagers.'
- source_word: כָּל עֲבָדַי הַנְּבִיאִים
  choice: tous mes serviteurs, les prophètes
  rationale: La formulation conserve les deux substantifs en apposition et présente les prophètes comme des serviteurs mandatés par Dieu.
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: je n’ai cessé de les envoyer
  rationale: Cette expression idiomatique, littéralement liée au fait de se lever tôt pour envoyer, exprime une action répétée, empressée et persistante. Le rendu français en communique naturellement la portée, tandis que la note en préserve l’image.
- source_word: לֵאמֹר
  choice: pour vous dire
  rationale: Introduit naturellement en français le contenu du message transmis par les prophètes.
- source_word: אַל נָא תַעֲשׂוּ
  choice: Je vous en prie, ne faites pas
  rationale: אַל marque l’interdiction et נָא lui donne la nuance d’une supplication pressante, rendue par « Je vous en prie ».
- source_word: דְּבַר הַתּוֹעֵבָה הַזֹּאת
  choice: cette chose abominable
  rationale: דבר désigne ici une chose ou un acte, et תועבה exprime ce qui est profondément odieux, notamment dans le contexte de l’idolâtrie. Le choix conserve la forte réprobation morale et religieuse.
- source_word: אֲשֶׁר שָׂנֵאתִי
  choice: que je déteste
  rationale: Le parfait hébreu exprime ici l’attitude ferme et constante de Dieu envers cette pratique ; le présent français en restitue la portée actuelle et durable.
theological_decisions:
- issue: Expression de l’opposition divine à la pratique idolâtre
  choice: que je déteste
  alternative: que j’ai détestée / qui m’est odieuse
  rationale: Le texte attribue directement à Dieu une aversion ferme pour la pratique qualifiée d’abominable. Le rendu en conserve la force sans ajouter de catégorie doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « envoyer » maintient le lien avec le texte hébreu, tandis que « je n’ai cessé de » rend intelligible son idiome. La supplication divine est explicitement conservée par « Je vous en prie ».
