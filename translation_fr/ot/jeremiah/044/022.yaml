id: JER.44.22
reference: Jeremiah 44:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא יוּכַל֩ יְהוָ֨ה ע֜וֹד לָ/שֵׂ֗את מִ/פְּנֵי֙ רֹ֣עַ מַעַלְלֵי/כֶ֔ם מִ/פְּנֵ֥י הַ/תּוֹעֵבֹ֖ת אֲשֶׁ֣ר עֲשִׂיתֶ֑ם וַ/תְּהִ֣י אַ֠רְצְ/כֶם לְ/חָרְבָּ֨ה וּ/לְ/שַׁמָּ֧ה וְ/לִ/קְלָלָ֛ה מֵ/אֵ֥ין יוֹשֵׁ֖ב כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/022.yaml
  text: And Yahweh could no longer bear it because of the evil of your deeds[a], because of the abominations that you committed. So your land became a ruin, a desolation, and a curse, without inhabitant[c][b], as it is this day.
translation:
  language: fr
  text: Yahweh ne pouvait plus le supporter, à cause de la méchanceté de vos actes et des choses abominables que vous aviez commises. Ainsi, votre pays est devenu un champ de ruines, un lieu dévasté[a] et un objet de malédiction[b], sans aucun habitant, comme c’est le cas aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi évoquer un spectacle qui inspire l’épouvante ou la stupeur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « une malédiction » : le pays devient un exemple cité dans des formules de malédiction.'
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et préserve sa fonction dans le texte hébreu.
- source_word: וְלֹא יוּכַל ... עוֹד לָשֵׂאת
  choice: ne pouvait plus le supporter
  rationale: Rend naturellement l’expression idiomatique « ne plus pouvoir porter/supporter », qui marque ici la fin de la patience face aux actes dénoncés.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition a ici une valeur causale, répétée devant les deux motifs.
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: la méchanceté de vos actes
  rationale: Conserve la structure génitivale et la forte qualification morale de רֹעַ.
- source_word: הַתּוֹעֵבֹת אֲשֶׁר עֲשִׂיתֶם
  choice: les choses abominables que vous aviez commises
  rationale: « Choses abominables » restitue la force cultuelle et morale du terme; le plus-que-parfait situe ces actes avant l’incapacité désormais déclarée de les supporter.
- source_word: וַתְּהִי אַרְצְכֶם
  choice: Ainsi, votre pays est devenu
  rationale: Explicite en français le rapport de conséquence porté par la progression narrative.
- source_word: לְחָרְבָּה
  choice: un champ de ruines
  rationale: Expression française naturelle évoquant nettement un territoire ravagé, sans réduire le terme à des bâtiments en ruine.
- source_word: וּלְשַׁמָּה
  choice: un lieu dévasté
  rationale: Retient en texte principal l’idée de désolation, tout en signalant en note la nuance possible d’épouvante ou de stupeur.
- source_word: וְלִקְלָלָה
  choice: un objet de malédiction
  rationale: Indique que le pays sert d’exemple ou de formule dans les malédictions, plutôt que de suggérer simplement qu’il prononce une malédiction.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sans aucun habitant
  rationale: Rend de façon concise et idiomatique l’absence totale de résidents.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Formulation française courante qui exprime l’état constatable au moment où parle le prophète.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom personnel sans le remplacer par un titre.
- issue: Limite exprimée par « ne pouvait plus le supporter »
  choice: Conserver l’expression anthropopathique du texte
  alternative: Paraphraser par « avait décidé de punir »
  rationale: Le verset présente la fin de la patience divine sous l’image de ce qui ne peut plus être supporté; il ne faut pas résoudre cette tension par une paraphrase doctrinale.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase garde la forte causalité du texte, mais coordonne les deux motifs pour éviter une répétition lourde. Les marqueurs [a] et [b] figurent immédiatement après les expressions concernées.
