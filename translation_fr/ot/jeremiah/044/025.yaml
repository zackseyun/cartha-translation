  to: 'Ainsi parle le Seigneur des armées, le Dieu d’Israël : Vous et vos femmes, vous avez parlé de vos bouches et, de vos mains, tenu parole en disant : « Nous tiendrons assurément les vœux que nous avons faits : offrir de l’encens à la Reine du ciel et lui verser des libations. » Maintenez donc vos vœux et accomplissez donc vos vœux !'
  rationale: Révision limitée à la fidélité du pluriel, à l’idiome français et à la précision terminologique. La répétition finale est conservée afin de refléter les deux impératifs intensifs hébreux, sans présenter leur valeur rhétorique comme une approbation du culte décrit.
