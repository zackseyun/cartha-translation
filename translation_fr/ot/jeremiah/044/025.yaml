base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/025.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: You and your wives have spoken with your mouths and fulfilled it with your hands, saying, ‘We will surely carry out our vows that we have vowed, to burn incense to the Queen of Heaven and to pour out drink offerings to her.’ Go ahead, confirm your vows and carry out your vows.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur des armées, le Dieu d’Israël : Vous et vos femmes, vous avez parlé de vos bouches et, de vos mains, tenu parole en disant : « Nous tiendrons assurément les vœux que nous avons faits : offrir de l’encens à la Reine du ciel et lui verser des libations. » Maintenez donc vos vœux et accomplissez donc vos vœux !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: le Seigneur des armées
  rationale: Rend le nom divin selon l’usage français traditionnel et צְבָאוֹת de manière formelle, naturelle et digne.
- source_word: וּבִידֵיכֶם מִלֵּאתֶם
  choice: accompli de vos mains
  rationale: Conserve le contraste rhétorique entre la bouche et les mains, ainsi que l’idée de mettre effectivement à exécution les paroles prononcées.
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: Nous tiendrons certainement
  rationale: L’infinitif absolu suivi du verbe conjugué exprime l’insistance; « certainement » la restitue sans lourdeur excessive.
- source_word: לְקַטֵּר
  choice: offrir de l’encens
  rationale: Dans ce contexte cultuel, le verbe désigne l’action de faire fumer ou d’offrir de l’encens.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: à la Reine du ciel
  rationale: Reproduit le titre de la divinité féminine visée, sans en préciser l’identité au-delà du texte.
- source_word: וּלְהַסֵּךְ לָהּ נְסָכִים
  choice: et lui verser des offrandes liquides
  rationale: Exprime clairement le geste cultuel de verser des libations dans un français accessible.
- source_word: הָקֵים תָּקִימְנָה ... וְעָשֹׂה תַעֲשֶׂינָה
  choice: confirmez vos vœux et tenez-les
  rationale: Les deux constructions intensives sont rendues comme une injonction appuyée; la variation évite une répétition française maladroite tout en conservant les deux verbes hébreux.
theological_decisions:
- issue: Force de l’impératif final
  choice: « Eh bien, confirmez vos vœux et tenez-les ! » comme injonction rhétorique
  alternative: « Accomplissez donc vos vœux » comme approbation littérale
  rationale: Dans le contexte du jugement prophétique, ces impératifs ne légitiment pas le culte de la Reine du ciel; ils reprennent avec une force ironique ou judiciaire la résolution des interlocuteurs, sans expliciter cette nuance dans le corps du texte.
- issue: Identité de la « Reine du ciel »
  choice: Conserver uniquement le titre
  alternative: Identifier la figure à une divinité précise du Proche-Orient ancien
  rationale: Le verset ne donne pas cette identification; la traduction préserve donc la réserve du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « de votre bouche / de vos mains » est maintenu. Le pluriel féminin des impératifs hébreux finaux est naturellement inclus dans le français contextuel; il vise les femmes mentionnées, sans qu’une note soit indispensable.
