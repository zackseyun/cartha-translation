base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/024.yaml
  text: Then Jeremiah said to all the people and to all the women[a], “Hear the word of Yahweh, all Judah who are in the land of Egypt.”
translation:
  language: fr
  text: 'Jérémie dit alors à tout le peuple et à toutes les femmes : « Écoutez la parole de Yahweh, vous tous de Juda qui êtes dans le pays d’Égypte[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tout Juda qui se trouve dans le pays d’Égypte ».

      '
    reason: Alternative plus littérale pour la désignation collective כָּל יְהוּדָה.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le wayyiqtol fait progresser le récit. « Puis … dit » exprime naturellement cette succession en français.
- source_word: אֶל כָּל הָעָם וְאֶל כָּל הַנָּשִׁים
  choice: à tout le peuple et à toutes les femmes
  rationale: עָם désigne collectivement le peuple, tandis que נָשִׁים signifie ici « femmes » plutôt que « épouses », conformément au rôle explicite des femmes dans le contexte.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel appelle les destinataires à prêter attention. « Écoutez » est plus idiomatique en français actuel que « Entendez » tout en conservant la force de la sommation prophétique.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette formulation conserve l’expression prophétique traditionnelle דְּבַר et rend le nom divin comme un nom propre.
- source_word: כָּל יְהוּדָה
  choice: vous tous, gens de Juda
  rationale: L’expression désigne collectivement la communauté judéenne interpellée. Cette formulation rend explicite l’adresse directe sans réduire Juda au seul territoire.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: qui êtes dans le pays d’Égypte
  rationale: La proposition relative qualifie les destinataires et conserve la formulation géographique développée « pays d’Égypte ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de כָּל יְהוּדָה
  choice: vous tous, gens de Juda
  alternative: tout Juda
  rationale: Dans cette adresse, « Juda » fonctionne comme une désignation collective de la communauté judéenne vivant en Égypte. Le choix principal rend cette valeur humaine et l’accord pluriel naturel, tandis que la note conserve la forme collective plus littérale.
