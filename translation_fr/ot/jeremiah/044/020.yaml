  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ אֶל כָּל הָ/עָ֑ם עַל הַ/גְּבָרִ֤ים וְ/עַל הַ/נָּשִׁים֙ וְ/עַל כָּל הָ/עָ֔ם הָ/עֹנִ֥ים אֹת֛/וֹ דָּבָ֖ר לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/020.yaml
  text: Then Jeremiah said to all the people—to the men[a], to the women, and to all the people who were answering him, saying,
translation:
  language: fr
  text: 'Alors Jérémie dit à tout le peuple, aux hommes, aux femmes et à tous ceux du peuple qui lui répondaient[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte littéralement : « qui lui répondaient une parole ». Le nom « parole » appartient à une tournure de réponse et n’a pas besoin d’être exprimé en français.'
    reason: La tournure hébraïque est compacte et inclut le nom דָּבָר, « parole, propos », que le français exprime naturellement par le seul verbe « répondre ».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: אֶל כָּל הָעָם
  choice: à tout le peuple
  rationale: Rend directement le groupe prépositionnel et le sens collectif de עָם.
- source_word: עַל הַגְּבָרִים וְעַל הַנָּשִׁים
  choice: aux hommes, aux femmes
  rationale: Dans cette reprise en apposition, עַל précise les destinataires déjà désignés ; la répétition de « aux » conserve la structure et les deux groupes explicitement nommés.
- source_word: וְעַל כָּל הָעָם
  choice: et à tous ceux
  rationale: La formulation française évite l’étrange répétition de « tout le peuple » tout en conservant l’élargissement de l’auditoire exprimé par le second כָּל הָעָם.
- source_word: הָעֹנִים אֹתוֹ דָּבָר
  choice: qui lui répondaient
  rationale: Le participe est rendu par l’imparfait, qui décrit les personnes en train de répondre. דָּבָר appartient ici à l’idiome hébreu de la réponse et n’exige pas l’ajout peu naturel de « une parole » dans le texte.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit idiomatiquement en français les paroles directes qui suivent au verset suivant.
