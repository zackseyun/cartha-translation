source:
  edition: WLC
  text: וַ/יַּעֲנ֣וּ אֶֽת יִרְמְיָ֗הוּ כָּל הָ/אֲנָשִׁ֤ים הַ/יֹּֽדְעִים֙ כִּֽי מְקַטְּר֤וֹת נְשֵׁי/הֶם֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וְ/כָל הַ/נָּשִׁ֥ים הָ/עֹמְד֖וֹת קָהָ֣ל גָּד֑וֹל וְ/כָל הָ/עָ֛ם הַ/יֹּשְׁבִ֥ים בְּ/אֶֽרֶץ מִצְרַ֖יִם בְּ/פַתְר֥וֹס לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/015.yaml
  text: Then all the men who knew that their wives were burning incense to other gods[a], and all the women who were standing by—a great assembly—and all the people who were living in the land of Egypt, in Pathros, answered Jeremiah, saying,
translation:
  language: fr
  text: 'Alors tous les hommes qui savaient que leurs femmes brûlaient de l’encens pour d’autres dieux, toutes les femmes qui se tenaient là — une grande assemblée — et tout le peuple qui habitait dans le pays d’Égypte, à Patros, répondirent à Jérémie :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: répondirent
  rationale: Dans ce contexte narratif, le verbe introduit la réponse collective adressée à Jérémie.
- source_word: כָּל הָאֲנָשִׁים
  choice: tous les hommes
  rationale: Le terme désigne ici les hommes, distingués des femmes mentionnées ensuite et présentés comme les maris de celles qui offrent l’encens.
- source_word: הַיֹּדְעִים
  choice: qui savaient
  rationale: Le participe attributif identifie les hommes qui étaient au courant de l’activité de leurs femmes.
- source_word: מְקַטְּרוֹת
  choice: brûlaient de l’encens
  rationale: Le piel de קטר désigne couramment l’action cultuelle de faire brûler de l’encens.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: pour d’autres dieux
  rationale: La préposition peut marquer le destinataire ou le bénéficiaire du rite; « pour » est naturel en français et conserve cette orientation cultuelle.
- source_word: וְכָל הַנָּשִׁים הָעֹמְדוֹת
  choice: toutes les femmes présentes
  rationale: Littéralement, elles sont « debout »; dans ce contexte, le participe souligne surtout leur présence sur les lieux, rendue naturellement en français.
- source_word: קָהָל גָּדוֹל
  choice: une grande assemblée
  rationale: קהל désigne un groupe réuni; « assemblée » conserve le caractère collectif et formel du terme.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: Le syntagme élargit la désignation à l’ensemble de la population concernée.
- source_word: הַיֹּשְׁבִים
  choice: qui habitait
  rationale: Dans une indication géographique, ישב exprime le fait de résider; le singulier s’accorde naturellement avec le collectif « peuple ».
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: en Égypte
  rationale: Le français idiomatique exprime le lieu sans reproduire mécaniquement « dans le pays de », sans perte de sens.
- source_word: בְּפַתְרוֹס
  choice: dans la région de Patros
  rationale: Patros désigne la Haute-Égypte, mais le nom propre est conservé; « région » clarifie la relation géographique sans remplacer le toponyme.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Avant le discours direct qui suit, les deux-points rendent naturellement en français la formule hébraïque d’introduction « en disant ».
