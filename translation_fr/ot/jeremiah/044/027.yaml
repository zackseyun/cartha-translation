  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁקֵ֧ד עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/תַמּוּ֩ כָל אִ֨ישׁ יְהוּדָ֜ה אֲשֶׁ֧ר בְּ/אֶֽרֶץ מִצְרַ֛יִם בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב עַד כְּלוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/027.yaml
  text: Behold[a], I am watching over them for harm and not for good, and every man of Judah who is in the land of Egypt will come to an end by the sword and by famine[c][b], until they are consumed.
translation:
  language: fr
  text: Voici, je veille sur eux pour leur malheur et non pour leur bien. Tous les hommes de Juda[a] qui se trouvent au pays d’Égypte périront par l’épée et par la famine, jusqu’à leur disparition complète.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout homme de Juda »; le singulier hébreu a ici une valeur distributive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Introduit avec solennité une déclaration divine et conserve la force d’appel à l’attention de la formule prophétique.
- source_word: שֹׁקֵד עֲלֵיהֶם
  choice: je veille sur eux
  rationale: Rend l’idée d’une attention vigilante et continue. Le sens défavorable est précisé par la proposition suivante, sans être ajouté au verbe lui-même.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: pour leur malheur et non pour leur bien
  rationale: « Malheur » désigne ici une calamité infligée en jugement, et non le mal moral; la formulation maintient l’antithèse directe avec « bien ».
- source_word: וְתַמּוּ
  choice: périront
  rationale: Exprime naturellement en français la fin des personnes visées dans le contexte de l’épée et de la famine, tout en conservant la gravité du verbe.
- source_word: כָל אִישׁ יְהוּדָה
  choice: tous les hommes de Juda
  rationale: Reproduit le masculin du syntagme hébreu et sa portée distributive dans un français naturel.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרַיִם
  choice: qui se trouvent au pays d’Égypte
  rationale: Conserve l’expression géographique complète tout en formulant idiomatiquement la présence du groupe en Égypte.
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: par l’épée et par la famine
  rationale: Maintient la formule de jugement fréquente chez Jérémie ainsi que sa valeur instrumentale.
- source_word: עַד כְּלוֹתָם
  choice: jusqu’à leur disparition complète
  rationale: Rend l’idée d’achèvement total portée par כלה et le suffixe pluriel, avec une formulation claire et digne.
theological_decisions:
- issue: Le langage du jugement divin et le sens de רָעָה
  choice: pour leur malheur
  alternative: pour leur faire du mal; pour le désastre
  rationale: Dans ce contexte, רָעָה désigne l’issue calamiteuse du jugement, non un mal moral attribué à Dieu. « Leur malheur » conserve néanmoins la sévérité et la tension du texte.
- issue: La portée de כָל אִישׁ יְהוּדָה
  choice: tous les hommes de Juda
  alternative: toute personne de Juda; tout homme de Juda
  rationale: Le texte emploie un masculin singulier distributif. Le pluriel français en restitue naturellement la portée collective sans neutraliser la forme masculine.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Voici » maintient le registre prophétique; « veille sur eux » conserve l’écho lexical propre à Jérémie, tandis que le contexte immédiat en inverse toute connotation protectrice. La répétition sémantique entre « périront » et « jusqu’à leur disparition complète » reflète l’insistance du texte hébreu sur l’anéantissement du groupe.
