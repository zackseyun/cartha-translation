  source_fidelity: 'Le texte rend fidèlement les éléments essentiels de l’hébreu : l’introduction solennelle הִנְנִי (« Voici »), la vigilance active de שֹׁקֵד (« je veille »), l’orientation vers le malheur plutôt que le bien, le groupe des hommes de Juda en Égypte, ainsi que les instruments de jugement, l’épée et la famine. « Jusqu’à leur disparition complète » exprime de façon recevable la finalité de עַד כְּלוֹתָם sans atténuer la force du propos.'
