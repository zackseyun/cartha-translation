  text: וַ/תִּתַּ֤ךְ חֲמָתִ/י֙ וְ/אַפִּ֔/י וַ/תִּבְעַר֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרֽוּשָׁלִָ֑ם וַ/תִּהְיֶ֛ינָה לְ/חָרְבָּ֥ה לִ/שְׁמָמָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/006.yaml
  text: So my wrath and my anger were poured out and burned in the cities of Judah and in the streets of Jerusalem[a], and they became a ruin and a desolation, as they are this day.
translation:
  language: fr
  text: Ainsi, ma fureur et ma colère se sont déversées et ont brûlé dans les villes de Juda et dans les rues de Jérusalem[a] ; elles sont devenues des ruines et une désolation, comme elles le sont aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les places » ou « les espaces ouverts de Jérusalem ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתַּךְ
  choice: se sont déversées
  rationale: Conserve la métaphore d’une colère répandue. L’accord au pluriel avec « ma fureur et ma colère » est naturel en français, bien que le verbe hébreu soit au féminin singulier avant le sujet composé.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: חֵמָה évoque une ardente indignation ; « fureur » rend cette intensité et se distingue du terme parallèle אַף.
- source_word: וְאַפִּי
  choice: et ma colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère. « Colère » est clair et naturel dans ce parallélisme.
- source_word: וַתִּבְעַר
  choice: ont brûlé
  rationale: Préserve l’image concrète de בער, sans la réduire à une formulation abstraite telle que « ont frappé ».
- source_word: בְּעָרֵי יְהוּדָה
  choice: dans les villes de Juda
  rationale: La préposition ב localise ici l’action et le nom construit désigne directement les villes du territoire de Juda.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: et dans les rues de Jérusalem
  rationale: חֻצוֹת peut désigner les rues, les places ou les espaces ouverts. « Rues » convient au contexte urbain, tandis que l’autre possibilité est signalée en note.
- source_word: וַתִּהְיֶינָה
  choice: celles-ci sont devenues
  rationale: Le féminin pluriel renvoie collectivement aux villes et aux rues mentionnées. Le démonstratif clarifie la reprise en français sans imposer un référent abstrait singulier.
- source_word: לְחָרְבָּה לִשְׁמָמָה
  choice: ruines et lieux dévastés
  rationale: Rend les deux états résultants, חָרְבָּה et שְׁמָמָה, dans un français actuel. Le pluriel s’accorde avec les lieux collectivement désignés.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Rend l’idiome qui appelle la situation présente comme constat visible, dans une tournure française naturelle.
theological_decisions:
- issue: Langage du jugement divin
  choice: Maintien des images concrètes de la fureur et de la colère qui se déversent et brûlent.
  alternative: Paraphraser par « mon châtiment s’est abattu » ou « mon jugement les a frappées ».
  rationale: L’hébreu présente le jugement comme l’action personnelle de Dieu au moyen de métaphores fortes. Les conserver respecte la portée théologique du texte sans ajouter d’explication doctrinale.
- issue: Référent du verbe féminin pluriel final
  choice: Reprise collective des villes et des rues par « celles-ci » et par deux compléments attributifs pluriels.
  alternative: 'Employer un singulier impersonnel : « tout est devenu un champ de ruines ».'
  rationale: Le féminin pluriel hébreu renvoie naturellement aux réalités géographiques précédentes ; le conserver évite d’aplanir la syntaxe en un état abstrait.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores prophétiques sont conservées ; le point-virgule marque le passage de l’action divine à son résultat visible.
