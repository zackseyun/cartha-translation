source:
  edition: WLC
  text: וְ/לֹ֨א יִהְיֶ֜ה פָּלִ֤יט וְ/שָׂרִיד֙ לִ/שְׁאֵרִ֣ית יְהוּדָ֔ה הַ/בָּאִ֥ים לָ/גֽוּר שָׁ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לָ/שׁ֣וּב אֶ֣רֶץ יְהוּדָ֗ה אֲשֶׁר הֵ֜מָּה מְנַשְּׂאִ֤ים אֶת נַפְשָׁ/ם֙ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת שָׁ֔ם כִּ֥י לֹֽא יָשׁ֖וּבוּ כִּ֥י אִם פְּלֵטִֽים־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/014.yaml
  text: So there will be no fugitive or survivor for the remnant of Judah who are coming to sojourn there in the land of Egypt and then to return to the land of Judah[a], to which they are lifting up their soul to return and dwell there; for they will not return, except for fugitives.
translation:
  language: fr
  text: Il n’y aura donc, parmi le reste de Juda — ceux qui sont venus séjourner là, en Égypte — ni rescapé ni survivant qui retourne au pays de Juda, où ils aspirent de toute leur âme[a] à revenir pour y habiter. Car ils n’y retourneront pas, sauf des rescapés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils élèvent leur âme », expression qui signifie qu’ils aspirent profondément à y retourner.'
    reason: L’idiome hébreu est rendu de façon naturelle dans le texte, tandis que la note en préserve l’image littérale.
lexical_decisions:
- source_word: פָּלִיט / פְּלֵטִים
  choice: rescapé / rescapés
  rationale: Le terme désigne celui qui échappe à un désastre. « Rescapé » convient au contexte de jugement et maintient la reprise lexicale entre le début et la fin du verset.
- source_word: שָׂרִיד
  choice: survivant
  rationale: Le mot désigne celui qui reste vivant après une catastrophe. « Survivant » le distingue naturellement de פָּלִיט.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: le reste de Juda
  rationale: Cette expression décrit ici les Judéens demeurés après les désastres précédents, sans leur attribuer implicitement une fidélité particulière.
- source_word: הַבָּאִים לָגוּר שָׁם
  choice: venu séjourner là
  rationale: Le participe caractérise collectivement le reste de Juda qui s’est rendu en Égypte; « séjourner » conserve la nuance de résidence étrangère ou provisoire portée par גור.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: en Égypte
  rationale: En français courant, le nom du pays suffit à rendre naturellement l’expression hébraïque « au pays d’Égypte », sans perte référentielle.
- source_word: וְלָשׁוּב אֶרֶץ יְהוּדָה
  choice: avec l’intention de retourner ensuite au pays de Juda
  rationale: Dans la syntaxe du verset, l’infinitif exprime leur projet ultérieur plutôt que le but immédiat de leur venue en Égypte. Cette formulation rend la séquence sans suggérer qu’ils viennent en Égypte afin de retourner en Juda.
- source_word: מְנַשְּׂאִים אֶת נַפְשָׁם
  choice: désirent de toute leur âme
  rationale: L’expression littérale « élèvent leur âme » est un idiome de désir ou d’aspiration. La traduction conserve le mot « âme » tout en rendant clairement le sens en français.
- source_word: לָשׁוּב לָשֶׁבֶת שָׁם
  choice: retourner habiter
  rationale: Les deux infinitifs indiquent le retour espéré et l’établissement dans le pays; la formulation est naturelle et conserve les deux idées.
- source_word: כִּי לֹא יָשׁוּבוּ כִּי אִם פְּלֵטִים
  choice: Ils n’y retourneront pas, à l’exception de quelques rescapés
  rationale: La proposition affirme la non-réalisation du projet, puis ménage explicitement l’exception des personnes qui échapperont au désastre. « Quelques » explicite avec retenue la portée naturellement restreinte de l’exception plurielle.
theological_decisions:
- issue: Portée théologique de « le reste de Juda »
  choice: Employer l’expression dans son sens descriptif et historique.
  alternative: « Le reste fidèle de Juda » ou une autre formulation impliquant une approbation divine.
  rationale: Le contexte vise les Judéens installés en Égypte et placés sous le jugement; le texte ne les qualifie pas de fidèles.
- issue: Tension entre l’absence de rescapé et l’exception finale
  choice: Conserver l’affirmation forte suivie de l’exception explicite.
  alternative: Harmoniser les deux membres en affaiblissant soit « ni rescapé », soit « à l’exception de quelques rescapés ».
  rationale: La tension appartient au texte hébreu et ne doit pas être supprimée; l’exception finale précise qu’un nombre restreint échappera et retournera.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase a été restructurée pour éviter l’ambiguïté selon laquelle les Judéens seraient venus en Égypte dans le but direct de retourner en Juda. Le marqueur [a] figure dans le texte principal.
