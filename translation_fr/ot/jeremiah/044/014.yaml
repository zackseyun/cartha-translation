    text: 'Littéralement : « ils élèvent leur âme », expression qui signifie qu’ils aspirent profondément à y retourner.'
    reason: L’idiome hébreu est rendu de façon naturelle dans le texte, tandis que la note en préserve l’image littérale.
  revision_rationale: La révision supprime l’ajout non marqué « quelques », clarifie que les Judéens en question sont les membres du reste venus séjourner en Égypte, et exprime le retour espéré mais refusé comme dans l’hébreu. Elle conserve l’exception finale et donc la tension rhétorique du verset.
