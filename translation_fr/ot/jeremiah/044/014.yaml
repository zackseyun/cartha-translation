revisions:
- from: Il n’y aura donc ni rescapé ni survivant parmi le reste de Juda venu séjourner là, en Égypte, avec l’intention de retourner ensuite au pays de Juda, où ils désirent de toute leur âme[a] retourner habiter. Ils n’y retourneront pas, à l’exception de quelques rescapés.
  to: Il n’y aura donc, parmi le reste de Juda — ceux qui sont venus séjourner là, en Égypte — ni rescapé ni survivant qui retourne au pays de Juda, où ils aspirent de toute leur âme[a] à revenir pour y habiter. Car ils n’y retourneront pas, sauf des rescapés.
  rationale: La révision supprime l’ajout non marqué « quelques », clarifie que les Judéens en question sont les membres du reste venus séjourner en Égypte, et exprime le retour espéré mais refusé comme dans l’hébreu. Elle conserve l’exception finale et donc la tension rhétorique du verset.
