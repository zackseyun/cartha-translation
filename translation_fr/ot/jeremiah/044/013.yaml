source:
  edition: WLC
  text: וּ/פָקַדְתִּ֗י עַ֤ל הַ/יּֽוֹשְׁבִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי עַל יְרֽוּשָׁלִָ֑ם בַּ/חֶ֥רֶב בָּ/רָעָ֖ב וּ/בַ/דָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/013.yaml
  text: And I will punish those who dwell in the land of Egypt[a], just as I punished Jerusalem, with the sword, with famine[b], and with pestilence.
translation:
  language: fr
  text: Je punirai les habitants du pays d’Égypte[a], comme j’ai puni Jérusalem, par l’épée, la famine et la peste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je demanderai des comptes aux habitants du pays d’Égypte ». Le verbe hébreu peut signifier « visiter », « s’occuper de » ou « demander des comptes à » ; dans ce contexte de jugement, il exprime une intervention punitive.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’épidémie ». Le terme hébreu désigne une pestilence ou une maladie épidémique meurtrière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי ... פָּקַדְתִּי
  choice: Je punirai ... j’ai puni
  rationale: Dans ce contexte explicite de jugement, פקד a un sens punitif. « Punir » exprime clairement ce sens en français moderne, tandis que « visiter » serait opaque.
- source_word: הַיֹּשְׁבִים
  choice: ceux qui habitent
  rationale: Le participe de ישב désigne les personnes qui résident dans le pays; cette formulation conserve sa valeur verbale dans un français naturel.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: en Égypte
  rationale: Le français idiomatique dit naturellement « en Égypte »; le mot אֶרֶץ n’exige pas ici la formulation plus lourde « dans le pays d’Égypte ».
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » marque clairement le parallèle entre le jugement des résidents d’Égypte et celui de Jérusalem.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: par l’épée, la famine et la peste
  rationale: La préposition ב marque ici le moyen. Cette formulation préserve la triade prophétique traditionnelle tout en restant fluide en français.
- source_word: דֶּבֶר
  choice: peste
  rationale: Dans les formules prophétiques de jugement, le terme désigne une maladie épidémique meurtrière; « peste » est concis et usuel dans ce contexte biblique.
theological_decisions:
- issue: Portée judiciaire du verbe פקד
  choice: Rendre explicitement par « punir »
  alternative: « intervenir contre » ou, plus littéralement, « visiter »
  rationale: L’épée, la famine et la peste montrent que l’intervention évoquée est punitive. « Punir » explicite la force contextuelle sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « punir » reflète celle du verbe hébreu; la série finale est rendue sans répéter « par » afin d’obtenir une cadence française naturelle.
