  rationale: La révision supprime l’ajout interprétatif concernant l’accord des maris, emploie des formulations cultuelles françaises plus directes et maintient l’ambiguïté relative à la façon dont les gâteaux représentaient la déesse. La répétition des libations, présente dans l’hébreu, est conservée.
