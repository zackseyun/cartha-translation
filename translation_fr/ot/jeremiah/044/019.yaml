source:
  edition: WLC
  text: וְ/כִֽי אֲנַ֤חְנוּ מְקַטְּרִים֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הֲ/מִֽ/בַּלְעֲדֵ֣י אֲנָשֵׁ֗י/נוּ עָשִׂ֨ינוּ לָ֤/הּ כַּוָּנִים֙ לְ/הַ֣עֲצִבָ֔/ה וְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/019.yaml
  text: And when we burned incense to the Queen of Heaven and poured out drink offerings to her[a], was it apart from our husbands that we made cakes for her, to depict her, and poured out drink offerings to her?
translation:
  language: fr
  text: Et quand nous brûlions de l’encens à la Reine du ciel et que nous lui versions des libations, est-ce sans nos maris que nous lui faisions des gâteaux pour la représenter[a] et que nous lui versions des libations ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la figurer », ou « pour faire son image ». L’hébreu évoque probablement des gâteaux façonnés à l’image de la déesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Et quand
  rationale: Dans le contexte, la locution poursuit la défense des femmes et évoque une pratique passée, plutôt qu’une véritable condition.
- source_word: מְקַטְּרִים
  choice: faisions brûler de l’encens
  rationale: Le piel de קטר désigne couramment, en contexte cultuel, l’action de faire brûler de l’encens ou de produire une offrande fumante.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: pour la Reine du ciel
  rationale: Cette formulation conserve le titre cultuel païen attesté dans Jérémie, sans identification supplémentaire.
- source_word: וּלְהַסֵּךְ לָהּ נְסָכִים
  choice: et lui versions des offrandes de vin
  rationale: Le verbe exprime l’action de verser, et נְסָכִים désigne des libations; « offrandes de vin » est naturel et immédiatement compréhensible en français.
- source_word: הֲמִבַּלְעֲדֵי אֲנָשֵׁינוּ
  choice: est-ce sans l’accord de nos maris
  rationale: Dans la bouche des femmes, אֲנָשֵׁינוּ renvoie vraisemblablement à leurs maris. « Sans l’accord » exprime ici qu’elles n’agissaient pas indépendamment d’eux, sans prétendre qu’ils accomplissaient eux-mêmes chaque geste.
- source_word: עָשִׂינוּ לָהּ כַּוָּנִים
  choice: nous lui préparions des gâteaux
  rationale: כַּוָּנִים désigne des gâteaux façonnés employés dans cette pratique cultuelle; « préparions » convient naturellement à leur fabrication.
- source_word: לְהַעֲצִבָהּ
  choice: pour la représenter
  rationale: L’infinitif avec suffixe indique probablement que les gâteaux figuraient ou représentaient la déesse, tout en laissant ouverte la forme exacte de cette représentation.
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: et que nous lui versions des offrandes de vin
  rationale: La formule répétée est rendue de manière cohérente avec sa première occurrence.
theological_decisions:
- issue: Sens du titre païen מְלֶכֶת הַשָּׁמַיִם
  choice: Reine du ciel
  alternative: reine des cieux
  rationale: La traduction conserve le titre de la divinité tel qu’il est employé par les locutrices, sans y importer d’associations religieuses ultérieures.
- issue: Degré d’implication des maris
  choice: sans l’accord de nos maris
  alternative: à l’insu de nos maris / sans nos maris
  rationale: Le texte affirme que les femmes n’agissaient pas indépendamment de leurs maris, mais ne précise pas exactement si ceux-ci participaient, autorisaient ou savaient seulement; la formulation choisie exprime leur assentiment sans leur attribuer tous les actes.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait restitue la pratique habituelle évoquée dans le contexte. « Offrandes de vin » privilégie la clarté ordinaire par rapport au terme plus technique « libations ».
