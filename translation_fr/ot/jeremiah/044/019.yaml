    issue: « sans l’accord de nos maris » surinterprète מִבַּלְעֲדֵי אֲנָשֵׁינוּ.
    rationale: L’expression affirme que les femmes n’agissaient pas sans leurs maris, mais ne distingue pas entre présence, participation, connaissance ou autorisation. « Sans nos maris » préserve cette indétermination.
  - severity: low
    issue: Destination cultuelle et expression rituelle à lisser.
    rationale: « à la Reine du ciel » correspond directement au lamed hébreu dans ce contexte, et « brûlions de l’encens » est plus naturel que « faisions brûler de l’encens ».
