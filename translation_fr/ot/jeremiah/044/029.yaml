source:
  edition: WLC
  text: וְ/זֹאת לָ/כֶ֤ם הָ/אוֹת֙ נְאֻם יְהוָ֔ה כִּֽי פֹקֵ֥ד אֲנִ֛י עֲלֵי/כֶ֖ם בַּ/מָּק֣וֹם הַ/זֶּ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּי֩ ק֨וֹם יָק֧וּמוּ דְבָרַ֛/י עֲלֵי/כֶ֖ם לְ/רָעָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/029.yaml
  text: And this will be the sign for you[a], declares Yahweh, that I am punishing you in this place, so that you may know that my words will surely stand against you for harm.
translation:
  language: fr
  text: '« Voici pour vous le signe, déclare Yahweh : je vais vous punir dans ce lieu, afin que vous sachiez que mes paroles s’accompliront à coup sûr contre vous, pour votre malheur.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mes paroles se dresseront certainement contre vous, pour le malheur ». On peut aussi comprendre : « mes paroles se réaliseront certainement contre vous, pour votre désastre ».'
    reason: La construction intensive קוֹם יָקוּמוּ signifie que les paroles tiendront ferme ou se réaliseront avec certitude; לְרָעָה peut désigner le malheur, le désastre ou le tort subi.
lexical_decisions:
- source_word: וְזֹאת לָכֶם הָאוֹת
  choice: Voici pour vous le signe
  rationale: La tournure présentative « voici » rend naturellement la proposition nominale hébraïque et conserve l’idée d’un signe donné aux destinataires.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formulation française rend la formule prophétique solennelle tout en transcrivant directement le nom divin.
- source_word: כִּי פֹקֵד אֲנִי עֲלֵיכֶם
  choice: je vais vous punir
  rationale: Dans ce contexte explicite de jugement, פקד désigne une intervention punitive. Le futur proche exprime une action annoncée comme imminente sans alourdir la phrase.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: dans ce lieu
  rationale: Traduction directe qui conserve la référence déictique et le registre prophétique.
- source_word: לְמַעַן תֵּדְעוּ
  choice: afin que vous sachiez
  rationale: « Afin que » restitue clairement la valeur de but de לְמַעַן dans un français digne et courant.
- source_word: כִּי קוֹם יָקוּמוּ
  choice: que … s’accompliront à coup sûr
  rationale: L’infinitif absolu associé au verbe conjugué marque la certitude. Avec « mes paroles » comme sujet, « s’accomplir » est idiomatique; « à coup sûr » conserve l’intensification.
- source_word: דְבָרַי עֲלֵיכֶם
  choice: mes paroles … contre vous
  rationale: Le pluriel de דְבָרַי est maintenu, et « contre vous » exprime la portée hostile de עֲלֵיכֶם dans ce contexte judiciaire.
- source_word: לְרָעָה
  choice: pour votre malheur
  rationale: Ici, רָעָה désigne l’issue funeste du jugement plutôt qu’un mal moral. « Pour votre malheur » conserve la valeur adverse et s’intègre naturellement à la phrase.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Sens de לְרָעָה
  choice: pour votre malheur
  alternative: pour le mal; pour votre désastre
  rationale: Dans ce contexte, l’expression décrit la conséquence funeste du jugement divin et non une qualité morale attribuée à Dieu.
- issue: Force de קוֹם יָקוּמוּ
  choice: s’accompliront à coup sûr
  alternative: se dresseront certainement; subsisteront bel et bien
  rationale: La traduction principale communique l’accomplissement certain des paroles, tandis que la note conserve l’image verbale plus littérale et l’ambiguïté possible entre établissement et réalisation.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La syntaxe reste proche de la progression hébraïque, tandis que « s’accompliront à coup sûr » rend idiomatiquement la construction intensive. Le tutoiement pluriel est exprimé par « vous ».
