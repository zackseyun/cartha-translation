source:
  edition: WLC
  text: הֲ/ל֣וֹא אֶת הַ/קִּטֵּ֗ר אֲשֶׁ֨ר קִטַּרְתֶּ֜ם בְּ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/חֻצ֣וֹת יְרוּשָׁלִַ֔ם אַתֶּ֧ם וַ/אֲבֽוֹתֵי/כֶ֛ם מַלְכֵי/כֶ֥ם וְ/שָׂרֵי/כֶ֖ם וְ/עַ֣ם הָ/אָ֑רֶץ אֹתָ/ם֙ זָכַ֣ר יְהוָ֔ה וַֽ/תַּעֲלֶ֖ה עַל לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/021.yaml
  text: Was it not the incense that you burned in the cities of Judah and in the streets of Jerusalem—you and your fathers[a], your kings and your officials, and the people of the land—that Yahweh remembered, and it came up upon his heart?
translation:
  language: fr
  text: N’est-ce pas l’encens que vous avez brûlé dans les villes de Juda et dans les rues de Jérusalem — vous, vos ancêtres, vos rois, vos responsables et le peuple du pays — que Yahweh s’est rappelé et qui lui est monté au cœur[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et qui est monté sur son cœur » ; cette expression évoque ce qui vient intérieurement à la mémoire et à l’attention de Yahweh.'
    reason: L’expression hébraïque est intelligible mais inhabituelle en français ; la note explicite son sens sans effacer l’image dans le texte.
lexical_decisions:
- source_word: הֲלוֹא
  choice: N’est-ce pas
  rationale: Introduit une question rhétorique qui appelle l’assentiment, tout en restant naturel en français.
- source_word: הַקִּטֵּר אֲשֶׁר קִטַּרְתֶּם
  choice: l’encens que vous avez brûlé
  rationale: Conserve l’objet cultuel et l’action de le brûler sans paraphrase excessive.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: dans les villes de Juda et dans les rues de Jérusalem
  rationale: Rend directement les deux indications de lieu; « rues » est ici le sens contextuel le plus naturel de חֻצוֹת.
- source_word: אַתֶּם וַאֲבוֹתֵיכֶם מַלְכֵיכֶם וְשָׂרֵיכֶם וְעַם הָאָרֶץ
  choice: vous, vos ancêtres, vos rois, vos hauts fonctionnaires et le peuple du pays
  rationale: Préserve toute l’énumération. « Ancêtres » est plus clair en français moderne que « pères »; « hauts fonctionnaires » évite que « princes » soit compris comme désignant uniquement des membres de la famille royale.
- source_word: זָכַר יְהוָה
  choice: Yahweh s’est rappelé
  rationale: Rend le verbe זכר dans une construction française idiomatique et conserve le nom divin.
- source_word: וַתַּעֲלֶה עַל לִבּוֹ
  choice: et qui lui est monté au cœur
  rationale: Préserve l’image anthropomorphique et le mouvement exprimé par le verbe hébreu, sans attribuer à Yahweh l’action de faire monter la chose.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le caractère de nom propre.
- issue: Image anthropomorphique עַל לִבּוֹ
  choice: qui lui est monté au cœur
  alternative: qui lui est revenu à l’esprit
  rationale: Le choix retient l’image hébraïque du cœur et sa tension théologique plutôt que de la réduire à une simple opération mentale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la question rhétorique, l’énumération solennelle et l’image concrète du cœur.
