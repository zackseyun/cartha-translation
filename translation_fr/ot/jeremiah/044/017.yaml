source:
  edition: WLC
  text: כִּ֩י עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶֽת כָּל הַ/דָּבָ֣ר אֲשֶׁר יָצָ֣א מִ/פִּ֗י/נוּ לְ/קַטֵּ֞ר לִ/מְלֶ֣כֶת הַ/שָּׁמַיִם֮ וְ/הַסֵּֽיךְ לָ֣/הּ נְסָכִים֒ כַּ/אֲשֶׁ֨ר עָשִׂ֜ינוּ אֲנַ֤חְנוּ וַ/אֲבֹתֵ֨י/נוּ֙ מְלָכֵ֣י/נוּ וְ/שָׂרֵ֔י/נוּ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָ֑ם וַ/נִּֽשְׂבַּֽע לֶ֨חֶם֙ וַ/נִּֽהְיֶ֣ה טוֹבִ֔ים וְ/רָעָ֖ה לֹ֥א רָאִֽינוּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/017.yaml
  text: 'But we will certainly do every word that has gone out from our mouth: to burn incense to the Queen of Heaven and to pour out drink offerings to her[a], just as we and our fathers, our kings and our officials, did in the cities of Judah and in the streets of Jerusalem; then we had plenty of bread, prospered[b], and saw no disaster.'
translation:
  language: fr
  text: 'Mais nous accomplirons bel et bien tout ce qui est sorti de notre bouche : offrir de l’encens à la Reine du ciel et lui verser des libations, comme nous l’avons fait, nous et nos ancêtres, nos rois et nos dignitaires, dans les villes de Juda et dans les rues de Jérusalem. Nous avions alors du pain à satiété, nous vivions bien et nous ne connaissions aucun malheur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Mais
  rationale: Dans le contexte, la particule introduit la réplique résolument opposée des locuteurs à la parole transmise par Jérémie.
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: nous accomplirons bel et bien
  rationale: L’infinitif absolu intensifie le verbe conjugué. « Bel et bien » rend naturellement en français moderne cette ferme détermination.
- source_word: כָּל הַדָּבָר אֲשֶׁר יָצָא מִפִּינוּ
  choice: tout ce que notre bouche a déclaré
  rationale: L’expression désigne tout ce que les locuteurs ont eux-mêmes prononcé, vraisemblablement comme engagement. Cette formulation conserve l’image concrète de la bouche sans être servile.
- source_word: לְקַטֵּר
  choice: offrir de l’encens
  rationale: En contexte cultuel, le verbe désigne l’action de faire fumer une offrande, notamment de l’encens. « Offrir de l’encens » est clair et naturel.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: à la Reine du ciel
  rationale: La formulation rend directement le titre de la divinité vénérée par les locuteurs, sans l’atténuer ni l’approuver.
- source_word: וְהַסֵּיךְ לָהּ נְסָכִים
  choice: et lui verser des libations
  rationale: « Libations » désigne précisément les offrandes liquides versées dans un cadre cultuel et reste compréhensible en français courant soigné.
- source_word: אֲנַחְנוּ וַאֲבֹתֵינוּ מְלָכֵינוּ וְשָׂרֵינוּ
  choice: nous et nos ancêtres, nos rois et nos hauts fonctionnaires
  rationale: « Ancêtres » communique ici le sens collectif de אבותינו. Dans ce contexte gouvernemental, שרים désigne des dignitaires ou responsables supérieurs ; « hauts fonctionnaires » évite le sens dynastique plus étroit de « princes ».
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: dans les villes de Juda et dans les rues de Jérusalem
  rationale: חֻצוֹת peut désigner les rues ou les places publiques ; « rues » offre ici une traduction naturelle et suffisamment large.
- source_word: וַנִּשְׂבַּע לֶחֶם
  choice: nous avions du pain à satiété
  rationale: Cette formulation conserve à la fois l’image du pain et le sens littéral d’être rassasié, sans élargir automatiquement « pain » à toute nourriture.
- source_word: וַנִּהְיֶה טוֹבִים
  choice: nous vivions bien
  rationale: L’hébreu dit littéralement que les locuteurs étaient « bien ». « Nous vivions bien » convient au contexte de bien-être matériel sans imposer le sens plus précis de prospérité économique.
- source_word: וְרָעָה לֹא רָאִינוּ
  choice: nous ne connaissions aucun malheur
  rationale: רָעָה désigne ici une calamité plutôt que le mal moral. « Connaître un malheur » rend idiomatiquement l’hébreu « voir un malheur ».
theological_decisions:
- issue: Rendu du titre d’une divinité faisant l’objet d’un culte idolâtre
  choice: Reine du ciel
  alternative: reine des cieux
  rationale: Le titre hébreu est traduit directement comme désignation de la divinité invoquée. La majuscule indique un titre propre dans ce contexte narratif, sans suggérer que le texte approuve ce culte.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve le ton défiant et assuré de la réponse, ainsi que la succession des affirmations concernant l’abondance, le bien-être et l’absence de calamité. Aucun appel de note n’est requis.
