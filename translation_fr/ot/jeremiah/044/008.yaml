source:
  edition: WLC
  text: לְ/הַכְעִסֵ֨/נִי֙ בְּ/מַעֲשֵׂ֣י יְדֵי/כֶ֔ם לְ/קַטֵּ֞ר לֵ/אלֹהִ֤ים אֲחֵרִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם אֲשֶׁר אַתֶּ֥ם בָּאִ֖ים לָ/ג֣וּר שָׁ֑ם לְמַ֨עַן֙ הַכְרִ֣ית לָ/כֶ֔ם וּ/לְמַ֤עַן הֱיֽוֹתְ/כֶם֙ לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כֹ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/008.yaml
  text: provoking me to anger by the works of your hands[a], by burning incense to other gods in the land of Egypt, where you are going to sojourn[c][b], so that you may cut yourselves off and so that you may become a curse and a reproach among all the nations of the earth.
translation:
  language: fr
  text: en provoquant ma colère par les œuvres de vos mains, en brûlant de l’encens pour d’autres dieux dans le pays d’Égypte, où vous allez séjourner comme étrangers[a], afin de vous retrancher vous-mêmes[b] et de devenir un objet de malédiction[c] et d’opprobre parmi toutes les nations de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « où vous venez pour séjourner ». Le verbe peut souligner le fait d’habiter dans un pays en qualité d’étranger.
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « afin de causer votre propre destruction » ou « afin que vous soyez retranchés ». Le jugement de Dieu est implicite dans le contexte, mais aucun sujet nouveau n’est exprimé ici.'
    reason: alternative_reading
  - marker: c
    text: 'Ou « une malédiction » : il peut s’agir d’un peuple cité comme exemple dans des formules de malédiction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַכְעִסֵנִי
  choice: en m’irritant
  rationale: L’infinitif causatif avec suffixe de première personne exprime l’action de provoquer la colère de Dieu. « En m’irritant » est naturel et conserve le lien circonstanciel avec les actes qui suivent.
- source_word: בְּמַעֲשֵׂי יְדֵיכֶם
  choice: par les œuvres de vos mains
  rationale: La formulation garde l’image hébraïque, qui peut viser à la fois leurs actes et ce qu’ils ont fabriqué, sans préciser davantage que le texte.
- source_word: לְקַטֵּר
  choice: en brûlant de l’encens
  rationale: Dans ce contexte cultuel, le piel de קטר désigne naturellement l’action de faire brûler de l’encens, tout en pouvant plus largement évoquer une offrande consumée.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: pour d’autres dieux
  rationale: « D’autres dieux » rend directement אֲחֵרִים sans ajouter la notion interprétative de dieux étrangers.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: dans le pays d’Égypte
  rationale: Cette formulation rend explicitement אֶרֶץ et demeure idiomatique en français.
- source_word: אֲשֶׁר אַתֶּם בָּאִים לָגוּר שָׁם
  choice: où vous êtes venus séjourner comme étrangers
  rationale: Le participe בָּאִים peut décrire leur venue en cours ou désormais accomplie selon le cadre narratif; « êtes venus » convient au contexte. גור comporte la nuance d’un séjour en qualité d’étranger, explicitée ici pour rester claire en français moderne.
- source_word: לְמַעַן הַכְרִית לָכֶם
  choice: afin de vous retrancher vous-mêmes
  rationale: La construction avec לָכֶם peut recevoir une force réflexive ou préjudicielle. Cette traduction préserve leur responsabilité et l’image de כרת sans introduire un sujet divin non exprimé dans la proposition.
- source_word: וּלְמַעַן הֱיוֹתְכֶם
  choice: et de devenir
  rationale: L’infinitif de היה décrit l’entrée dans l’état nommé ensuite; « devenir » est concis et naturel.
- source_word: לִקְלָלָה
  choice: un objet de malédiction
  rationale: Le nom peut désigner une malédiction ou ceux que l’on cite dans des formules de malédiction. La formulation explicite ce sens social sans suggérer qu’ils prononcent eux-mêmes une malédiction.
- source_word: וּלְחֶרְפָּה
  choice: de honte
  rationale: חרפה couvre la honte, l’opprobre et le mépris public. « De honte » forme en français un complément coordonné naturel après « un objet ».
- source_word: בְּכֹל גּוֹיֵי הָאָרֶץ
  choice: parmi toutes les nations de la terre
  rationale: Le pluriel universel favorise ici le sens large de הָאָרֶץ, « la terre », et בְּ marque la sphère au sein de laquelle ils seront ainsi considérés.
theological_decisions:
- issue: Agent et valeur de לְמַעַן הַכְרִית לָכֶם
  choice: 'Lecture réflexive et résultative : « afin de vous retrancher vous-mêmes »'
  alternative: « afin que vous soyez retranchés » ou « afin que je vous retranche »
  rationale: L’hébreu ne formule pas explicitement un nouveau sujet. La lecture réflexive maintient la culpabilité du peuple et l’ambiguïté entre la conséquence de ses actes et le jugement divin indiqué par le contexte, sans insérer « je » dans la proposition.
- issue: Valeur de לְמַעַן
  choice: « afin de », en conservant la tension entre finalité et résultat
  alternative: « de sorte que »
  rationale: La construction peut exprimer la finalité envisagée rhétoriquement ou le résultat auquel leur conduite aboutit. Le français « afin de » garde la formulation accusatrice du texte, tandis qu’une note signale la portée résultative possible du second membre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les images « œuvres de vos mains » et « retrancher », tout en explicitant la nuance de résidence étrangère portée par גור. Les trois appels de note sont placés immédiatement après les expressions concernées.
