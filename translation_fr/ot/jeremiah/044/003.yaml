base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/003.yaml
  text: because of their evil that they did to provoke me to anger[a], by going to burn incense and to serve other gods[b], whom they had not known—they, you, and your fathers.
translation:
  language: fr
  text: à cause du mal qu’ils ont commis pour provoquer ma colère, en allant brûler de l’encens et servir d’autres dieux[a] qu’ils n’avaient pas connus — eux, vous et vos pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adorer d’autres dieux ». Le verbe hébreu peut désigner le service religieux ou le culte.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu se termine par une énumération emphatique : « eux, vous et vos pères ».'
    reason: source_form
lexical_decisions:
- source_word: מִפְּנֵי רָעָתָם אֲשֶׁר עָשׂוּ
  choice: à cause du mal qu’ils ont commis
  rationale: מִפְּנֵי a ici une valeur causale. « Le mal » exprime la faute morale, et « commis » donne en français naturel le sens de עָשׂוּ dans ce contexte.
- source_word: לְהַכְעִסֵנִי
  choice: pour provoquer ma colère
  rationale: Le hifil de כעס exprime l’action de susciter la colère. Cette formulation conserve la force causative sans alourdir la phrase.
- source_word: לָלֶכֶת לְקַטֵּר
  choice: en allant brûler de l’encens
  rationale: L’infinitif לָלֶכֶת introduit la manière par laquelle ils ont provoqué Dieu, tandis que קטר désigne ici l’offrande cultuelle d’encens.
- source_word: לַעֲבֹד לֵאלֹהִים אֲחֵרִים
  choice: servir d’autres dieux
  rationale: עבד désigne le service rendu à une divinité et inclut la dévotion cultuelle; « servir » préserve mieux son étendue que le seul verbe « adorer ».
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: qu’ils n’avaient pas connus
  rationale: « Connaître » maintient la formulation et la possible nuance relationnelle de ידע sans la remplacer par une interprétation telle que « reconnaître ».
- source_word: הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם
  choice: ni eux, ni vous, ni vos pères
  rationale: Cette reprise négative rend clairement en français la liste emphatique et appositionnelle qui précise le sujet de « n’avaient pas connus ».
theological_decisions:
- issue: Langage du service idolâtre
  choice: servir d’autres dieux
  alternative: adorer d’autres dieux
  rationale: Le terme עבד couvre le service, la loyauté et le culte rendus à une divinité. « Servir » conserve cette largeur sémantique.
- issue: Interprétation de la connaissance des autres dieux
  choice: qu’ils n’avaient pas connus
  alternative: qu’ils n’avaient pas reconnus
  rationale: La traduction littérale « connus » préserve l’ambiguïté relationnelle de ידע et n’introduit pas l’idée plus précise de reconnaissance ou de légitimation.
- issue: Terme de parenté וַאֲבֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: « Vos pères » reproduit le terme masculin et le langage intergénérationnel du texte source, tout en restant intelligible en français biblique moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien causal avec le contexte précédent, le mouvement exprimé par « en allant » et l’emphase finale de l’hébreu. Les marqueurs [a] et [b] figurent tous deux dans le texte.
