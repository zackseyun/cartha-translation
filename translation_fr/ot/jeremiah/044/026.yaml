source:
  edition: WLC
  text: לָ/כֵן֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה כָּל יְהוּדָ֕ה הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הִנְ/נִ֨י נִשְׁבַּ֜עְתִּי בִּ/שְׁמִ֤/י הַ/גָּדוֹל֙ אָמַ֣ר יְהוָ֔ה אִם יִהְיֶה֩ ע֨וֹד שְׁמִ֜/י נִקְרָ֣א בְּ/פִ֣י כָּל אִ֣ישׁ יְהוּדָ֗ה אֹמֵ֛ר חַי אֲדֹנָ֥/י יְהוִ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/026.yaml
  text: 'Therefore hear the word of Yahweh[a], all Judah who dwell in the land of Egypt: Behold, I have sworn by my great name, says Yahweh, that my name shall no longer be called upon by the mouth of any man of Judah in all the land of Egypt, saying, ‘As the Lord GOD lives.’'
translation:
  language: fr
  text: 'C’est pourquoi, écoutez la parole de Yahweh, vous tous, gens de Juda qui habitez en Égypte : « Voici, j’ai juré par mon grand nom, déclare Yahweh, que mon nom ne sera plus prononcé par la bouche d’aucun homme de Juda[a], dans tout le pays d’Égypte, en disant : “Aussi vrai que le Seigneur Yahweh est vivant !” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « mon nom ne sera plus appelé dans la bouche d’aucun homme de Juda ». Il s’agit ici de prononcer le nom de Dieu dans une formule de serment.'
    reason: Précision sur un idiome hébreu et sur sa portée dans le contexte immédiat.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conclusion tirée du jugement qui précède, dans une formulation française claire et soutenue.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: écoutez la parole de Yahweh
  rationale: L’impératif pluriel appelle à prêter attention à la proclamation prophétique; « parole » conserve le poids de la formule hébraïque.
- source_word: כָּל יְהוּדָה הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: vous tous, gens de Juda qui habitez en Égypte
  rationale: Rend l’adresse collective à la communauté judéenne résidant en Égypte dans un français naturel, sans réduire Juda au seul territoire.
- source_word: הִנְנִי נִשְׁבַּעְתִּי בִּשְׁמִי הַגָּדוֹל
  choice: Voici, j’ai juré par mon grand nom
  rationale: « Voici » maintient la solennité de הִנְנִי, et le passé composé exprime l’acte accompli du serment divin.
- source_word: אִם יִהְיֶה עוֹד
  choice: ne sera plus
  rationale: Après la formule de serment, אִם porte ici une négation emphatique que le français doit expliciter.
- source_word: שְׁמִי נִקְרָא בְּפִי
  choice: mon nom ne sera plus prononcé par la bouche
  rationale: Conserve la voix passive et l’image orale de l’hébreu; le contexte et la formule qui suit indiquent l’emploi du nom divin dans un serment.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: aucun homme de Juda
  rationale: Reproduit le masculin singulier distributif de אִישׁ sous la négation, tout en identifiant l’appartenance à Juda.
- source_word: חַי אֲדֹנָי יְהוִה
  choice: Aussi vrai que le Seigneur Yahweh est vivant !
  rationale: Formule française idiomatique de serment qui conserve le titre אֲדֹנָי et le nom divin יהוה.
theological_decisions:
- issue: Transcription du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie le tétragramme comme nom propre; sa transcription préserve cette fonction, notamment dans la formule de serment.
- issue: Interprétation de l’expression שְׁמִי נִקְרָא בְּפִי
  choice: prononciation du nom divin dans un serment
  alternative: invocation générale du nom divin
  rationale: La proposition participiale « en disant » introduit immédiatement une formule de serment, ce qui précise l’usage visé sans exclure l’image littérale de la bouche.
- issue: Portée de כָּל אִישׁ יְהוּדָה
  choice: aucun homme de Juda
  alternative: personne de Juda
  rationale: Le choix conserve la forme masculine singulière et sa force distributive, sans tirer de conclusion doctrinale sur la portée globale du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère solennel de l’oracle et du serment divin, tandis que « vous tous, gens de Juda » évite une adresse collective peu naturelle en français.
