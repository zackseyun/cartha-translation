  text: וּ/מִן אָ֡ז חָדַ֜לְנוּ לְ/קַטֵּ֨ר לִ/מְלֶ֧כֶת הַ/שָּׁמַ֛יִם וְ/הַסֵּֽךְ לָ֥/הּ נְסָכִ֖ים חָסַ֣רְנוּ כֹ֑ל וּ/בַ/חֶ֥רֶב וּ/בָ/רָעָ֖ב תָּֽמְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/018.yaml
  text: But from the time we stopped burning incense to the Queen of Heaven and pouring out drink offerings to her[a], we have lacked everything[c][b], and we have been consumed by the sword and by famine.
translation:
  language: fr
  text: Mais depuis que nous avons cessé de brûler de l’encens pour la Reine du ciel[a] et de lui verser des libations, nous avons manqué de tout, et nous avons péri par l’épée et par la famine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Reine du ciel » est ici le titre de la déesse adorée par ces gens.
    reason: cultural_note
  - marker: b
    text: 'Ou : « nous avons été anéantis » ou « nous avons été réduits à rien » ; le verbe hébreu évoque le fait d’arriver à sa fin ou de périr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן אָז
  choice: Mais depuis que
  rationale: La tournure marque le point de départ temporel, tandis que « Mais » rend l’opposition argumentative avec le contexte.
- source_word: חָדַלְנוּ לְקַטֵּר
  choice: nous avons cessé de faire brûler de l’encens
  rationale: חָדַל exprime la cessation, et קטר désigne ici l’action cultuelle de faire brûler de l’encens ou une offrande produisant de la fumée.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: pour la Reine du ciel
  rationale: La formule est conservée comme titre de la divinité invoquée dans ce discours. Le singulier « ciel » est la forme idiomatique française du titre.
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: et de lui verser des libations
  rationale: « Verser des libations » exprime naturellement en français le geste rituel désigné par le verbe et son complément.
- source_word: חָסַרְנוּ כֹל
  choice: nous manquons de tout
  rationale: La formule hébraïque exprime une privation totale. Le présent français décrit naturellement la situation qui dure depuis l’arrêt évoqué.
- source_word: וּבַחֶרֶב וּבָרָעָב תָּמְנוּ
  choice: et nous périssons par l’épée et la famine
  rationale: תמם indique ici qu’un groupe est mené à sa fin ou dépérit. Le présent rend le bilan collectif encore en cours dans la bouche des survivants, sans imposer l’idée que chacun est déjà mort.
theological_decisions:
- issue: Sens du titre מְלֶכֶת הַשָּׁמַיִם
  choice: Reine du ciel, titre de la déesse adorée ici
  alternative: reine des cieux
  rationale: Le titre hébreu est rendu directement et replacé par une note dans son cadre idolâtre, sans lui attribuer une association théologique postérieure.
- issue: Portée de תָּמְנוּ appliqué aux locuteurs encore vivants
  choice: nous périssons
  alternative: nous avons péri / nous avons été anéantis
  rationale: Le pluriel peut exprimer le sort collectif du peuple, dont les présents locuteurs sont les survivants. La traduction conserve l’idée d’un dépérissement conduisant à la fin sans effacer cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Libations » conserve le vocabulaire cultuel tout en restant courant dans les traductions bibliques. La phrase garde le raisonnement causal des locuteurs sans l’approuver.
