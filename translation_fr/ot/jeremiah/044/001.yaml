source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ אֶ֚ל כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הַ/יֹּשְׁבִ֤ים בְּ/מִגְדֹּל֙ וּ/בְ/תַחְפַּנְחֵ֣ס וּ/בְ/נֹ֔ף וּ/בְ/אֶ֥רֶץ פַּתְר֖וֹס לֵ/אמֹֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/001.yaml
  text: The word that came to Jeremiah concerning all the Judeans living in the land of Egypt[a], those living in Migdol and in Tahpanhes and in Noph and in the land of Pathros, saying,
translation:
  language: fr
  text: 'La parole qui fut adressée à Jérémie au sujet de tous les Judéens qui résidaient dans le pays d’Égypte, ceux qui habitaient à Migdol, à Tahpanès, à Noph[a] et dans le pays de Patros, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noph est le nom hébreu de la ville égyptienne plus connue sous le nom de Memphis.
    reason: Identification historique du toponyme hébreu pour le lecteur moderne.
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans les introductions prophétiques, דָּבָר désigne couramment une communication divine. « La parole » conserve la formule biblique sans expliciter davantage que l’hébreu.
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: qui fut adressée à Jérémie
  rationale: Cette formulation française rend naturellement l’idiome prophétique indiquant qu’une parole est parvenue au prophète.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: au sujet de tous les Judéens
  rationale: Le second אֶל peut désigner ici les personnes concernées ou destinataires. « Au sujet de » s’accorde naturellement avec la construction française, tandis que « Judéens » garde la référence historique aux gens de Juda.
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: qui résidaient dans le pays d’Égypte
  rationale: Le participe exprime une résidence durable. « Résidaient » est actuel et précis, et « pays » conserve אֶרֶץ.
- source_word: הַיֹּשְׁבִים
  choice: ceux qui habitaient
  rationale: La répétition du participe introduit la liste plus précise des lieux de résidence et reste fluide en français.
- source_word: מִגְדֹּל
  choice: Migdol
  rationale: Transcription usuelle du nom de lieu.
- source_word: תַחְפַּנְחֵס
  choice: Tahpanès
  rationale: Forme française traditionnelle et lisible du nom de lieu hébreu.
- source_word: נֹף
  choice: Nof
  rationale: Le texte hébreu emploie Nof. Le texte principal conserve ce nom, tandis qu’une note donne l’identification plus connue, Memphis.
- source_word: אֶרֶץ פַּתְרוֹס
  choice: le pays de Patros
  rationale: Cette formulation conserve explicitement אֶרֶץ, « pays », au lieu de réduire l’expression au seul toponyme.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule introduit naturellement en français le discours qui commence au verset suivant, tout en rendant la fonction de לֵאמֹר.
theological_decisions:
- issue: Rapport de la parole aux Judéens d’Égypte
  choice: au sujet de tous les Judéens
  alternative: à tous les Judéens
  rationale: La répétition de אֶל permet de comprendre les Judéens comme destinataires ou comme personnes concernées. Le choix retenu suit la structure où la parole vient d’abord à Jérémie, sans imposer une précision théologique absente du contexte immédiat.
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve le caractère d’introduction prophétique, avec des toponymes translittérés selon des formes françaises usuelles. Le marqueur de note est placé immédiatement après « Nof », terme qu’il explique.
