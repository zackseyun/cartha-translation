reference: Jeremiah 44:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַתֶּ֣ם רְאִיתֶ֗ם אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֖ל כָּל עָרֵ֣י יְהוּדָ֑ה וְ/הִנָּ֤/ם חָרְבָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וְ/אֵ֥ין בָּ/הֶ֖ם יוֹשֵֽׁב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: You yourselves have seen all the disaster that I brought on Jerusalem and on all the cities of Judah. And behold, they are a ruin this day[b], and there is no one living in them.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh des armées, le Dieu d’Israël : « Vous avez vous-mêmes vu tout le malheur[a] que j’ai fait venir sur Jérusalem et sur toutes les villes de Juda. Et voici qu’elles sont aujourd’hui en ruines[b], et personne n’y habite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la calamité ». Ici, le mot hébreu désigne un désastre résultant du jugement, et non le mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ou « elles sont aujourd’hui dévastées » ou « elles sont aujourd’hui une désolation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française actuelle restitue naturellement la formule solennelle du messager prophétique sans archaïsme inutile.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, et « des armées » rend צְבָאוֹת de manière intelligible tout en conservant l’ampleur du titre traditionnel.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et naturelle de la chaîne construite hébraïque.
- source_word: אַתֶּם רְאִיתֶם
  choice: Vous avez vous-mêmes vu
  rationale: « Vous-mêmes » rend l’insistance produite par le pronom sujet explicite אַתֶּם, tandis que le passé composé exprime une expérience constatée dont les effets demeurent visibles.
- source_word: כָּל הָרָעָה
  choice: tout le malheur
  rationale: Dans ce contexte, רָעָה désigne la calamité destructrice du jugement, non le mal moral. « Malheur » garde la gravité du terme sans attribuer à Dieu une faute morale.
- source_word: הֵבֵאתִי עַל
  choice: que j’ai fait venir sur
  rationale: La tournure causative explicite de l’hébreu est conservée, notamment l’affirmation que Yahweh a lui-même fait venir le désastre.
- source_word: עָרֵי יְהוּדָה
  choice: les villes de Juda
  rationale: « Villes » est ici une traduction française conventionnelle et suffisamment large de עָרִים.
- source_word: וְהִנָּם
  choice: Et voici qu’elles
  rationale: « Voici que » conserve la fonction déictique de הִנֵּה, qui attire l’attention sur l’état désormais visible de Jérusalem et des villes.
- source_word: חָרְבָּה
  choice: ne sont … que ruines
  rationale: Cette expression idiomatique française garde la force nominale de « ruine, dévastation » et l’applique naturellement à l’ensemble pluriel évoqué.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: « Aujourd’hui » rend naturellement l’expression littérale « ce jour-ci » sans lui ajouter la nuance durative de « jusqu’à ce jour ».
- source_word: וְאֵין בָּהֶם יוֹשֵׁב
  choice: et personne n’y habite
  rationale: Formulation française concise et directe pour l’absence de tout habitant dans ces lieux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin. Sa translittération préserve cette fonction plutôt que de lui substituer un titre.
- issue: Dieu comme auteur du désastre
  choice: « le malheur que j’ai fait venir »
  alternative: « le malheur qui s’est abattu »
  rationale: La première personne causative הֵבֵאתִי attribue explicitement à Yahweh la venue du jugement. La traduction conserve cette tension théologique au lieu de l’atténuer par une tournure impersonnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique demeure solennelle, tandis que « aujourd’hui », « personne n’y habite » et « ne sont que ruines » évitent un tour inutilement archaïque. Les deux appels de note [a] et [b] sont placés immédiatement après les expressions qu’ils éclairent.
