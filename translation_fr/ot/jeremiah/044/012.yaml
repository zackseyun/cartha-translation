source:
  edition: WLC
  text: וְ/לָקַחְתִּ֞י אֶת שְׁאֵרִ֣ית יְהוּדָ֗ה אֲשֶׁר שָׂ֨מוּ פְנֵי/הֶ֜ם לָ/ב֣וֹא אֶֽרֶץ מִצְרַיִם֮ לָ/ג֣וּר שָׁם֒ וְ/תַ֨מּוּ כֹ֜ל בְּ/אֶ֧רֶץ מִצְרַ֣יִם יִפֹּ֗לוּ בַּ/חֶ֤רֶב בָּֽ/רָעָב֙ יִתַּ֔מּוּ מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב יָמֻ֑תוּ וְ/הָיוּ֙ לְ/אָלָ֣ה לְ/שַׁמָּ֔ה וְ/לִ/קְלָלָ֖ה וּ/לְ/חֶרְפָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/012.yaml
  text: And I will take the remnant of Judah who have set their faces to enter the land of Egypt to sojourn there[a], and they will all come to an end in the land of Egypt. They will fall by the sword and by famine; from the least even to the greatest, they will come to an end. By the sword and by famine they will die, and they will become an oath, a horror, a curse, and a reproach.
translation:
  language: fr
  text: Je prendrai le reste de Juda, ceux qui ont résolu d’entrer en Égypte pour y séjourner. Ils périront tous en Égypte. Ils tomberont par l’épée et par la famine ; du plus petit au plus grand, ils périront. Ils mourront par l’épée et par la famine. Ils deviendront une formule de malédiction[a], un sujet d’effroi, une malédiction et un objet de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un serment de malédiction ». Le mot hébreu אָלָה peut désigner un serment qui appelle une malédiction, ou une formule de malédiction.
    reason: Précision lexicale sur אָלָה et maintien de sa distinction avec le terme suivant, קְלָלָה, rendu par « malédiction ».
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Je prendrai
  rationale: Le verbe לקח signifie normalement « prendre ». Le contexte lui donne une portée judiciaire sans qu’il soit nécessaire d’expliciter « saisir pour punir ».
- source_word: שְׁאֵרִית יְהוּדָה
  choice: le reste de Juda
  rationale: « Le reste » désigne naturellement en français ceux de Juda qui ont survécu aux catastrophes précédentes.
- source_word: אֲשֶׁר שָׂמוּ פְנֵיהֶם
  choice: ceux qui ont résolu
  rationale: L’expression hébraïque signifie se tourner résolument vers une action. « Ont résolu » transmet cette détermination en français actuel sans calquer l’image peu naturelle « ont tourné leur visage ».
- source_word: לָבוֹא אֶרֶץ מִצְרַיִם
  choice: d’entrer en Égypte
  rationale: בוא suivi du nom du pays exprime ici l’entrée dans le territoire.
- source_word: לָגוּר שָׁם
  choice: pour y séjourner en étrangers
  rationale: גור désigne le séjour de personnes qui ne sont pas chez elles, nuance que le seul verbe « habiter » effacerait.
- source_word: וְתַמּוּ כֹל
  choice: Tous arriveront à leur fin
  rationale: תם exprime l’achèvement total ou la disparition. Cette formulation conserve l’idée d’une fin collective et prépare les deux moyens de jugement précisés ensuite.
- source_word: יִפֹּלוּ בַּחֶרֶב בָּרָעָב יִתַּמּוּ
  choice: ils tomberont par l’épée et seront anéantis par la famine
  rationale: La syntaxe massorétique associe naturellement « tomber » à l’épée et « arriver à leur fin » à la famine. « Seront anéantis » rend ici le résultat de תם sans produire en français une répétition maladroite.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: Du plus petit au plus grand
  rationale: Cette expression méristique inclut toutes les catégories, quel que soit leur rang ou leur importance.
- source_word: בַּחֶרֶב וּבָרָעָב יָמֻתוּ
  choice: ils mourront par l’épée et par la famine
  rationale: מות est le verbe ordinaire « mourir »; les deux compléments indiquent les causes du décès.
- source_word: לְאָלָה
  choice: une formule de malédiction
  rationale: אָלָה peut désigner un serment qui appelle une malédiction. « Formule de malédiction » exprime ce sens tout en évitant de le confondre avec קְלָלָה, rendu ensuite simplement par « malédiction ».
- source_word: לְשַׁמָּה
  choice: un sujet d’effroi
  rationale: Le terme évoque un état désolant qui suscite stupeur ou horreur; cette expression est idiomatique et garde l’effet produit sur les témoins.
- source_word: וְלִקְלָלָה
  choice: une malédiction
  rationale: קְלָלָה est le terme direct pour une malédiction et demeure distinct de אָלָה.
- source_word: וּלְחֶרְפָּה
  choice: un objet de honte
  rationale: חֶרְפָּה désigne le déshonneur, la honte ou l’opprobre subi publiquement.
theological_decisions:
- issue: Force et répétition des annonces de jugement
  choice: Conserver explicitement la fin collective, l’épée, la famine et la mort
  alternative: Résumer par « ils périront tous »
  rationale: Le texte accumule les annonces de jugement et nomme à plusieurs reprises leurs moyens. La traduction ne les atténue pas et n’ajoute aucune interprétation doctrinale.
- issue: Rapport entre אָלָה et קְלָלָה
  choice: Distinguer « formule de malédiction » de « malédiction »
  alternative: Traduire les deux termes par « malédiction » ou rendre אָלָה par « serment » sans précision
  rationale: Les deux mots appartiennent au même champ du langage de malédiction mais ne sont pas identiques. La formulation choisie et la note maintiennent à la fois leur proximité et leur distinction.
translation_notes:
  register: Français international actuel, digne et direct. Les expressions trop archaïques comme « opprobre » et les calques hébraïques peu naturels comme « ont tourné leur visage » ont été évités. La ponctuation explicite la structure du texte massorétique sans en réduire la force.
