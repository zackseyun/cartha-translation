revisions:
- from: 'Je prendrai le reste de Juda, ceux qui ont résolu d’entrer en Égypte pour y séjourner en étrangers. Tous arriveront à leur fin en Égypte : ils tomberont par l’épée et seront anéantis par la famine. Du plus petit au plus grand, ils mourront par l’épée et par la famine. Ils deviendront une formule de malédiction[a], un sujet d’effroi, une malédiction et un objet de honte.'
  to: Je prendrai le reste de Juda, ceux qui ont résolu d’entrer en Égypte pour y séjourner. Ils périront tous en Égypte. Ils tomberont par l’épée et par la famine ; du plus petit au plus grand, ils périront. Ils mourront par l’épée et par la famine. Ils deviendront une formule de malédiction[a], un sujet d’effroi, une malédiction et un objet de honte.
  rationale: La révision rétablit l’application des deux instruments, l’épée et la famine, dans les deux déclarations où ils figurent dans l’hébreu. Elle préserve également la répétition de la racine תם par « périront », sans sacrifier la lisibilité française. La note conserve l’ambiguïté lexicale d’אָלָה et sa distinction d’avec קְלָלָה.
