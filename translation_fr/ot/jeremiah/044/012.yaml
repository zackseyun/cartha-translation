review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement l’annonce de jugement, la détermination à aller en Égypte, ainsi que la série finale de quatre conséquences. Toutefois, elle répartit indûment les deux instruments du jugement : le texte hébreu associe « l’épée et la famine » à « ils tomberont », puis les répète avec « ils mourront »; il ne dit pas qu’ils tomberont par l’épée mais seraient anéantis seulement par la famine. La répétition de תם doit aussi être conservée dans la mesure où le français le permet.'
  naturalness: Le français est globalement actuel et soutenu. « Séjourner en étrangers » est toutefois un peu pesant; « séjourner » suffit dans ce contexte à conserver l’idée d’un établissement non autochtone. La reformulation proposée reste directe et naturelle.
  terminology: « Le reste de Juda », « l’épée », « la famine » et « honte » sont appropriés. « Formule de malédiction » permet de distinguer אָלָה de קְלָלָה, mais la note doit préciser que le premier terme peut désigner une formule de serment assortie d’une malédiction, sans réduire le sens à une seule analyse contestable.
  issues:
  - severity: high
    issue: Répartition fautive de l’épée et de la famine
    rationale: « Ils tomberont par l’épée et seront anéantis par la famine » attribue respectivement un moyen différent à chacun des deux verbes. En hébreu, « par l’épée et par la famine » accompagne « ils tomberont », tandis que la paire est répétée avec « ils mourront » à la fin du membre suivant.
  - severity: medium
    issue: La répétition du verbe תם est effacée au second emploi
    rationale: « Seront anéantis » remplace le second emploi par une expression différente et, combiné à la répartition erronée des instruments, modifie la structure rhétorique. Employer « périront » aux deux occurrences conserve la répétition de façon idiomatique.
  - severity: low
    issue: « Séjourner en étrangers » est peu idiomatique
    rationale: La tournure est compréhensible, mais le complément « en étrangers » alourdit le français. « Séjourner » rend déjà adéquatement גור dans ce contexte.
  revised_text: Je prendrai le reste de Juda, ceux qui ont résolu d’entrer en Égypte pour y séjourner. Ils périront tous en Égypte. Ils tomberont par l’épée et par la famine ; du plus petit au plus grand, ils périront. Ils mourront par l’épée et par la famine. Ils deviendront une formule de malédiction[a], un sujet d’effroi, une malédiction et un objet de honte.
  revised_footnotes:
  - marker: a
    text: Ou « un serment de malédiction ». Le mot hébreu אָלָה peut désigner un serment qui appelle une malédiction, ou une formule de malédiction.
    reason: Précision lexicale sur אָלָה et maintien de sa distinction avec le terme suivant, קְלָלָה, rendu par « malédiction ».
  revision_rationale: La révision rétablit l’application des deux instruments, l’épée et la famine, dans les deux déclarations où ils figurent dans l’hébreu. Elle préserve également la répétition de la racine תם par « périront », sans sacrifier la lisibilité française. La note conserve l’ambiguïté lexicale d’אָלָה et sa distinction d’avec קְלָלָה.
