  text: וְ/עַתָּ֡ה כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָ/מָה֩ אַתֶּ֨ם עֹשִׂ֜ים רָעָ֤ה גְדוֹלָה֙ אֶל נַפְשֹׁ֣תֵ/כֶ֔ם לְ/הַכְרִ֨ית לָ/כֶ֧ם אִישׁ וְ/אִשָּׁ֛ה עוֹלֵ֥ל וְ/יוֹנֵ֖ק מִ/תּ֣וֹךְ יְהוּדָ֑ה לְ/בִלְתִּ֛י הוֹתִ֥יר לָ/כֶ֖ם שְׁאֵרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/007.yaml
  text: 'And now[a], thus says Yahweh, the God of hosts, the God of Israel: Why are you doing this great evil against yourselves, to cut off from among Judah man and woman, child and infant, leaving yourselves no remnant?'
translation:
  language: fr
  text: 'Et maintenant, ainsi parle Yahweh, le Dieu des armées, le Dieu d’Israël : Pourquoi vous faites-vous un si grand mal[a], jusqu’à retrancher du milieu de Juda hommes et femmes, enfants et nourrissons, sans vous laisser aucun reste ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi commettez-vous un si grand mal contre vous-mêmes ? » Le mot hébreu רָעָה peut désigner aussi bien le mal moral que le tort ou le désastre ; les deux idées sont étroitement liées ici.'
    reason: Alternative lexicale préservant l’ambiguïté de רָעָה et la relation exprimée par אֶל נַפְשֹׁתֵכֶם.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu au lieu de le remplacer par un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: Cette formulation française naturelle conserve l’image des forces ou armées contenue dans צְבָאוֹת, sans préciser qu’elles seraient terrestres ou célestes.
- source_word: עֹשִׂים רָעָה גְדוֹלָה אֶל נַפְשֹׁתֵכֶם
  choice: vous faites-vous un si grand mal
  rationale: La tournure réfléchie rend idiomatiquement אֶל נַפְשֹׁתֵכֶם. Le mot « mal » garde à la fois la dimension morale de רָעָה et celle du tort destructeur que les destinataires s’infligent.
- source_word: לְהַכְרִית
  choice: au point de retrancher
  rationale: « Retrancher » conserve la métaphore forte de כרת tout en présentant la disparition des groupes énumérés comme l’aboutissement de leur conduite.
- source_word: אִישׁ וְאִשָּׁה
  choice: hommes et femmes
  rationale: Le pluriel français exprime naturellement la portée distributive et exhaustive des singuliers hébreux.
- source_word: עוֹלֵל וְיוֹנֵק
  choice: enfants et nourrissons
  rationale: « Enfants » désigne les petits enfants et « nourrissons » rend celui qui tète, en conservant la gradation d’âge.
- source_word: מִתּוֹךְ יְהוּדָה
  choice: de Juda
  rationale: Dans ce contexte d’élimination d’une population, « retrancher de Juda » exprime avec concision la suppression du milieu de Juda.
- source_word: שְׁאֵרִית
  choice: reste
  rationale: « Reste » est un terme français clair qui conserve aussi la résonance prophétique du groupe survivant.
theological_decisions:
- issue: Ambiguïté de רָעָה entre faute morale et tort subi
  choice: un si grand mal
  alternative: un tort si grave
  rationale: « Mal » permet de maintenir ensemble la culpabilité de l’acte et ses conséquences autodestructrices, sans réduire le sens à une seule dimension.
- issue: Portée de שְׁאֵרִית
  choice: aucun reste
  alternative: aucun survivant
  rationale: « Reste » préserve le terme prophétique et sa portée collective sans expliciter indûment qu’il ne s’agit que de survivants individuels.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique « ainsi parle » est conservée, tandis que les couples au pluriel évitent une formulation artificielle en français.
