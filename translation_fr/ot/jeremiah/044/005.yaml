  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹא הִטּ֣וּ אֶת אָזְנָ֔/ם לָ/שׁ֖וּב מֵ/רָֽעָתָ֑/ם לְ/בִלְתִּ֥י קַטֵּ֖ר לֵ/אלֹהִ֥ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/005.yaml
  text: But they did not listen or incline their ear to turn from their evil[a], so as not to make offerings to other gods.
translation:
  language: fr
  text: Mais ils n’ont pas écouté et n’ont pas prêté l’oreille pour se détourner de leur mauvaise conduite et ne plus brûler de l’encens pour d’autres dieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: écouté
  rationale: Dans ce reproche prophétique, le verbe exprime le refus de prêter attention et d’obéir, non une simple absence de perception auditive. « Écouté » conserve cette portée sans expliciter excessivement l’idée d’obéissance.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: prêté l’oreille
  rationale: Cette expression française naturelle garde l’image hébraïque de l’oreille tendue et exprime une attention réceptive.
- source_word: לָשׁוּב
  choice: se détourner
  rationale: Avec מִן, שׁוב indique ici l’abandon d’une conduite mauvaise. « Se détourner » rend clairement ce mouvement sans introduire dans le texte le terme théologique plus chargé « se repentir ».
- source_word: מֵרָעָתָם
  choice: du mal qu’ils faisaient
  rationale: רָעָה peut désigner le mal, la méchanceté ou une conduite mauvaise. Cette formulation française concrète le référent comportemental du contexte sans le limiter à un seul acte.
- source_word: לְבִלְתִּי קַטֵּר
  choice: ne plus faire brûler de l’encens
  rationale: לְבִלְתִּי exprime ici le but négatif, tandis que קטר désigne littéralement l’action cultuelle de produire une fumée sacrificielle, souvent en brûlant de l’encens. « Ne plus » indique naturellement la cessation visée.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: pour d’autres dieux
  rationale: Dans ce contexte cultuel, la préposition ל marque le destinataire ou le bénéficiaire de l’offrande. « Pour d’autres dieux » est idiomatique et précis en français.
theological_decisions:
- issue: Portée du verbe cultuel קטר dans le contexte de l’idolâtrie
  choice: faire brûler de l’encens pour d’autres dieux
  alternative: présenter des offrandes à d’autres dieux
  rationale: Le sens concret de קטר est conservé, car le texte évoque l’émission d’une fumée cultuelle et peut désigner spécifiquement l’encens. La traduction plus générale « présenter des offrandes » est contextuellement possible, mais elle effacerait cette image sans nécessité.
- issue: Relation syntaxique des infinitifs לָשׁוּב et לְבִלְתִּי קַטֵּר
  choice: deux aspects du changement de conduite auquel ils auraient dû consentir
  alternative: le refus de brûler de l’encens comme seul contenu explicatif du fait de se détourner du mal
  rationale: La coordination française « pour se détourner… et ne plus… » respecte le parallélisme des deux expressions de but tout en laissant entendre que le culte idolâtre constitue une manifestation centrale de leur mal.
translation_notes:
  register: Français international moderne, clair et digne. « Prêter l’oreille » maintient la métaphore solennelle de l’hébreu, tandis que « le mal qu’ils faisaient » évite le caractère abstrait ou archaïsant de « leur mal ».
