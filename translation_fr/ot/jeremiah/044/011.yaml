id: JER.44.11
reference: Jeremiah 44:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י שָׂ֥ם פָּנַ֛/י בָּ/כֶ֖ם לְ/רָעָ֑ה וּ/לְ/הַכְרִ֖ית אֶת כָּל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/011.yaml
  text: 'Therefore[a], this is what Yahweh of Armies, the God of Israel, says: Behold, I am setting my face against you for harm[b], to cut off all Judah.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahvé des armées[a], le Dieu d’Israël : « Voici, je tourne ma face contre vous pour votre malheur[b] et pour retrancher tout Juda. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On traduit aussi traditionnellement : « le SEIGNEUR des armées ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « malheur » désigne le désastre du jugement, et non le mal moral.
    reason: lexical_clarification
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du réquisitoire qui précède, tout en conservant la valeur déductive de l’hébreu.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de messager dans un français actuel, clair et solennel.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Transcrit le nom divin et traduit צְבָאוֹת de façon transparente, sans réduire le titre aux seules armées terrestres.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction hébraïque qui identifie le Dieu d’Israël.
- source_word: הִנְנִי שָׂם פָּנַי בָּכֶם
  choice: Je vais tourner ma face contre vous
  rationale: « Je vais » exprime la résolution divine imminente signalée par הִנְנִי et le participe; « tourner ma face contre vous » conserve la métaphore hébraïque d’une opposition résolue.
- source_word: לְרָעָה
  choice: pour votre malheur
  rationale: Dans ce contexte judiciaire, רָעָה désigne le malheur ou le désastre infligé, non le mal moral; l’ajout de « votre » rend clairement la destination du jugement.
- source_word: וּלְהַכְרִית
  choice: et retrancher
  rationale: Conserve l’image et la gravité du hiphil de כרת, qui signifie faire disparaître ou éliminer.
- source_word: כָּל יְהוּדָה
  choice: tout Juda
  rationale: Maintient la formulation collective et concise de l’hébreu sans décider explicitement entre le peuple et l’entité appelée Juda.
theological_decisions:
- issue: Traduction du titre divin יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  alternative: le SEIGNEUR des armées
  rationale: Le texte porte explicitement le nom divin; « Yahvé » le représente au lieu de le remplacer par un titre, tandis que « des armées » conserve la portée du qualificatif צְבָאוֹת.
- issue: Sens de רָעָה appliqué à l’action divine
  choice: malheur
  alternative: mal
  rationale: Le contexte annonce un désastre judiciaire. « Malheur » évite de suggérer que Dieu se voue au mal moral, sans atténuer la menace du jugement.
translation_notes:
  register: Français international moderne, clair et solennel. La formule prophétique reste digne sans archaïsme excessif; la métaphore de la face et le collectif « tout Juda » sont préservés afin de ne pas effacer les images ni l’ambiguïté du texte source.
