source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר דִּבַּ֥רְתָּ אֵלֵ֖י/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה אֵינֶ֥/נּוּ שֹׁמְעִ֖ים אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/016.yaml
  text: As for the word that you have spoken to us in the name of Yahweh[a], we will not listen to you.
translation:
  language: fr
  text: Quant à la parole que tu nous as adressée au nom de Yahweh, nous ne t’écouterons pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous ne t’obéirons pas ». Le verbe hébreu peut exprimer à la fois le fait d’écouter et celui de tenir compte de ce qui est dit ; ici, le refus d’écouter implique clairement un refus d’obéir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: la parole
  rationale: דָּבָר peut désigner une parole, une affaire ou un message. Ici, il s’agit de la déclaration prophétique de Jérémie ; « la parole » conserve le lien direct avec l’acte de parler.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֵלֵינוּ
  choice: que tu nous as adressée
  rationale: Le parfait décrit la parole déjà prononcée. En français, « adresser une parole à quelqu’un » exprime naturellement דִּבֵּר אֶל tout en maintenant que Jérémie s’est tourné vers ses auditeurs.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: L’expression indique que Jérémie parle sous l’autorité de Dieu et en son nom. La formulation française est directe et idiomatique, et le nom divin est translittéré.
- source_word: אֵינֶנּוּ שֹׁמְעִים אֵלֶיךָ
  choice: nous ne t’écouterons pas
  rationale: La construction négative avec participe exprime ici un refus ferme. Le futur français rend bien cette valeur volontaire ; « écouter » préserve le sens lexical immédiat de שׁמע, tandis que le contexte implique aussi le refus d’obéir.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom propre plutôt que de lui substituer un titre.
- issue: Portée de שׁמע dans le rejet d’une parole prophétique
  choice: écouter
  alternative: obéir
  rationale: Dans ce contexte, le verbe englobe le fait de prêter attention et de tenir compte de la parole. « Écouter » garde l’image verbale du texte sans réduire l’ambiguïté, tandis qu’une note signale la nuance d’obéissance.
translation_notes:
  register: Français international actuel, digne et direct. « Quant à » rend la mise en relief initiale de « la parole ». Le tutoiement correspond à la deuxième personne du singulier adressée à Jérémie.
