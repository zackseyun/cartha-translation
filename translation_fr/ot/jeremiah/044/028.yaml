source:
  edition: WLC
  text: וּ/פְלִיטֵ֨י חֶ֜רֶב יְשֻׁב֨וּ/ן מִן אֶ֧רֶץ מִצְרַ֛יִם אֶ֥רֶץ יְהוּדָ֖ה מְתֵ֣י מִסְפָּ֑ר וְֽ/יָדְע֞וּ כָּל שְׁאֵרִ֣ית יְהוּדָ֗ה הַ/בָּאִ֤ים לְ/אֶֽרֶץ מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם דְּבַר מִ֥י יָק֖וּם מִמֶּ֥/נִּי וּ/מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/028.yaml
  text: And a few survivors of the sword will return from the land of Egypt to the land of Judah[a], and all the remnant of Judah who came to the land of Egypt to sojourn there will know whose word will stand[b], mine or theirs.
translation:
  language: fr
  text: 'Quelques rescapés de l’épée reviendront du pays d’Égypte au pays de Juda, peu nombreux[a]. Tout le reste de Juda qui est venu au pays d’Égypte pour y vivre en étrangers saura quelle parole s’accomplira[b] : la mienne ou la leur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des rescapés de l’épée […] peu nombreux » ; l’hébreu place « peu nombreux » après la mention du retour en Juda.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la parole de qui tiendra » ; autre traduction : « quelle parole se réalisera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִיטֵי חֶרֶב
  choice: Quelques rescapés de l’épée
  rationale: « Rescapés » exprime ceux qui ont échappé au désastre, tandis que « de l’épée » conserve l’image hébraïque de la mort violente et du jugement.
- source_word: יְשֻׁבוּן
  choice: reviendront
  rationale: Le qal de שוב indique simplement le retour, ici dans un énoncé prédictif.
- source_word: מִן אֶרֶץ מִצְרַיִם אֶרֶץ יְהוּדָה
  choice: du pays d’Égypte au pays de Juda
  rationale: La formulation conserve la répétition de אֶרֶץ tout en restant naturelle en français.
- source_word: מְתֵי מִסְפָּר
  choice: peu nombreux
  rationale: L’expression idiomatique désigne un groupe réduit, aisément dénombrable. Sa place en fin de proposition respecte davantage l’ordre et l’accent du texte hébreu.
- source_word: וְיָדְעוּ
  choice: Alors ... saura
  rationale: Le futur exprime la connaissance acquise à l’issue des événements; « alors » rend naturellement la progression logique du waw sans la surinterpréter.
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: tout le reste de Juda
  rationale: « Reste » est le terme français courant et traditionnel pour שְׁאֵרִית dans le langage prophétique.
- source_word: הַבָּאִים לְאֶרֶץ מִצְרַיִם לָגוּר שָׁם
  choice: ceux qui sont venus au pays d’Égypte pour y séjourner en étrangers
  rationale: « Sont venus » suit בוא; « séjourner en étrangers » rend la situation de résidents étrangers exprimée par גור, plutôt qu’une simple habitation.
- source_word: דְּבַר מִי יָקוּם
  choice: quelle parole se réalisera
  rationale: Dans ce contexte de prédictions opposées, קום appliqué à une parole signifie qu’elle se confirme ou s’accomplit. Cette tournure est naturelle en français; la note conserve la métaphore littérale.
- source_word: מִמֶּנִּי וּמֵהֶם
  choice: la mienne ou la leur
  rationale: Les pronoms renvoient à « parole ». Les possessifs français rendent explicitement et sobrement le contraste.
theological_decisions:
- issue: Formule de confirmation prophétique
  choice: 'quelle parole se réalisera : la mienne ou la leur'
  alternative: 'quelle parole tiendra : la mienne ou la leur'
  rationale: Le texte oppose la parole du Seigneur aux affirmations ou attentes des Judéens réfugiés en Égypte. « Se réalisera » exprime l’accomplissement sans préciser davantage la nature de leurs paroles, tandis que la note préserve la métaphore hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. « Pays d’Égypte » et « pays de Juda » préservent le parallélisme hébreu. « Séjourner en étrangers » maintient la nuance juridique et sociale de גור sans employer l’archaïsme « séjourner comme étrangers ».
