source:
  edition: WLC
  text: הַֽ/שְׁכַחְתֶּם֩ אֶת רָע֨וֹת אֲבוֹתֵי/כֶ֜ם וְ/אֶת רָע֣וֹת מַלְכֵ֣י יְהוּדָ֗ה וְ/אֵת֙ רָע֣וֹת נָשָׁ֔י/ו וְ/אֵת֙ רָעֹ֣תֵ/כֶ֔ם וְ/אֵ֖ת רָעֹ֣ת נְשֵׁי/כֶ֑ם אֲשֶׁ֤ר עָשׂוּ֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/009.yaml
  text: Have you forgotten the evil deeds of your fathers[a], the evil deeds of the kings of Judah, the evil deeds of their wives, your own evil deeds, and the evil deeds of your wives[b], which they did in the land of Judah and in the streets of Jerusalem?
translation:
  language: fr
  text: Avez-vous oublié les mauvaises actions de vos pères, les mauvaises actions des rois de Juda, les mauvaises actions de leurs femmes[a], vos mauvaises actions[b] et les mauvaises actions de vos femmes, qu’ils ont commises dans le pays de Juda et dans les rues de Jérusalem ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses femmes ». Le suffixe singulier semble avoir ici une valeur collective ou distributive après « les rois de Juda » ; d’où « leurs femmes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vos maux » ou « vos méfaits ». Le terme est rendu par « mauvaises actions » parce que le verset parle d’actes qu’ils ont commis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכַחְתֶּם
  choice: Avez-vous oublié
  rationale: Le passé composé interrogatif exprime naturellement en français un oubli passé dont les conséquences morales demeurent présentes, tout en conservant la force du reproche rhétorique.
- source_word: רָעוֹת / רָעֹתֵיכֶם
  choice: les mauvaises actions / les vôtres
  rationale: Le pluriel désigne ici des actes répréhensibles, comme le confirme אֲשֶׁר עָשׂוּ (« qu’ils ont faits »). « Mauvaises actions » est clair et concret; les reprises pronominales évitent une répétition lourde sans effacer la série hébraïque.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Cette traduction directe préserve le terme de parenté masculin et la dimension générationnelle de l’accusation. « Ancêtres » serait possible, mais moins formellement proche.
- source_word: מַלְכֵי יְהוּדָה
  choice: les rois de Juda
  rationale: Rendu génitival direct, idiomatique en français biblique moderne.
- source_word: נָשָׁיו
  choice: leurs femmes
  rationale: Le suffixe est morphologiquement singulier (« ses femmes »), mais après le pluriel « les rois de Juda », il paraît avoir une valeur collective ou distributive. Le français exige naturellement le pluriel « leurs » pour ce référent.
- source_word: נְשֵׁיכֶם
  choice: vos femmes
  rationale: Traduction directe du nom avec suffixe de deuxième personne du pluriel.
- source_word: אֲשֶׁר עָשׂוּ
  choice: toutes ces actions commises
  rationale: La relative hébraïque porte vraisemblablement sur l’ensemble des mauvaises actions énumérées. Cette formulation française explicite son antécédent global et rend idiomatiquement עשה dans un contexte moral.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: « Pays » rend naturellement אֶרֶץ dans ce cadre géographique tout en gardant sa résonance territoriale.
- source_word: בְּחֻצוֹת יְרוּשָׁלִָם
  choice: dans les rues de Jérusalem
  rationale: « Rues » est l’équivalent français courant de חֻצוֹת pour les espaces publics urbains; « places » reste possible selon le contexte.
theological_decisions:
- issue: Sens moral de רָעוֹת
  choice: « mauvaises actions »
  alternative: « maux », « méfaits » ou « actes mauvais »
  rationale: Le contexte énumère des actes coupables et les rattache au verbe « faire ». Le choix concret maintient l’accusation morale sans transformer le mot en notion abstraite.
- issue: Terme générationnel אֲבוֹתֵיכֶם
  choice: « vos pères »
  alternative: « vos ancêtres »
  rationale: « Vos pères » conserve le marquage masculin et la force familiale du texte, sans élargir silencieusement le référent.
- issue: Référence collective de נָשָׁיו
  choice: « leurs femmes »
  alternative: « ses femmes »
  rationale: Le suffixe hébreu est au singulier, mais son antécédent contextuel est « les rois de Juda ». Le pluriel français représente probablement le sens distributif, tandis qu’une note conserve la forme littérale et l’ambiguïté grammaticale.
- issue: Portée de אֲשֶׁר עָשׂוּ
  choice: La relative récapitule l’ensemble des mauvaises actions énumérées.
  alternative: La relative pourrait grammaticalement sembler se rattacher surtout au dernier élément de la liste.
  rationale: Le pluriel verbal et la structure cumulative favorisent une portée récapitulative. « Toutes ces actions » la rend claire sans attribuer chaque acte à un groupe autre que celui déjà nommé.
translation_notes:
  register: Français international moderne, digne et accessible. La série hébraïque est conservée, mais allégée par « celles » et « les vôtres » afin d’éviter cinq répétitions pesantes de « mauvaises actions ». Le mot « femmes » rend נָשִׁים sans imposer une nuance absente du texte; dans ce contexte familial, il signifie les épouses.
