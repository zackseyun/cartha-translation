base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/003.yaml
  text: 'And I will appoint over them four kinds[a], declares Yahweh: the sword to kill, the dogs to drag away[b], and the birds of the heavens and the beasts of the earth to devour and destroy.'
translation:
  language: fr
  text: '« Je désignerai contre eux quatre catégories[a] — déclaration de Yahweh — : l’épée pour tuer, les chiens pour traîner, les oiseaux du ciel et les bêtes de la terre pour dévorer et détruire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quatre familles » ou « quatre clans » ; le terme désigne ici quatre catégories d’agents du jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיהֶם
  choice: Je désignerai contre eux
  rationale: Le verbe פקד avec עַל peut exprimer l’idée de charger ou d’assigner des agents contre quelqu’un. « Désignerai contre eux » conserve cette nuance sans réduire le verbe au seul sens de « punir ».
- source_word: אַרְבַּע מִשְׁפָּחוֹת
  choice: quatre catégories[a]
  rationale: מִשְׁפָּחוֹת signifie normalement « familles » ou « clans », mais désigne ici, de façon figurée, quatre classes d’agents du jugement. « Catégories » rend clairement cette fonction classificatoire, tandis que la note conserve l’image hébraïque.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule prophétique solennelle présente ce qui précède comme une déclaration divine. La formulation nominale reste proche de l’hébreu et convient au registre prophétique.
- source_word: הַחֶרֶב לַהֲרֹג
  choice: l’épée pour tuer
  rationale: Traduction directe de l’infinitif de but; « tuer » est actuel, clair et digne.
- source_word: הַכְּלָבִים לִסְחֹב
  choice: les chiens pour traîner au loin
  rationale: סחב signifie tirer ou traîner. « Au loin » fait entendre l’éloignement impliqué par l’action sans introduire explicitement les « cadavres », qui ne sont pas nommés dans le texte.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: Expression française naturelle correspondant à l’hébreu littéral « oiseaux des cieux ».
- source_word: בֶּהֱמַת הָאָרֶץ
  choice: les bêtes de la terre
  rationale: Cette formulation conserve l’ampleur et le registre de l’expression hébraïque sans préciser indûment qu’il s’agit uniquement d’animaux sauvages.
- source_word: לֶאֱכֹל וּלְהַשְׁחִית
  choice: pour dévorer et détruire
  rationale: Dans ce contexte de jugement et de dépouilles, « dévorer » rend la force de אכל. « Détruire » conserve le second infinitif et la progression du verset.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe en liste conserve le rythme prophétique; le tiret détache la formule d’oracle sans alourdir la phrase.
