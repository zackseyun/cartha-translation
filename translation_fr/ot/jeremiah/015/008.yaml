  text: עָֽצְמוּ לִ֤/י אַלְמְנֹתָ/ו֙ מֵ/ח֣וֹל יַמִּ֔ים הֵבֵ֨אתִי לָ/הֶ֥ם עַל אֵ֛ם בָּח֖וּר שֹׁדֵ֣ד בַּֽ/צָּהֳרָ֑יִם הִפַּ֤לְתִּי עָלֶ֨י/הָ֙ פִּתְאֹ֔ם עִ֖יר וּ/בֶהָלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/008.yaml
  text: Their widows have become more numerous to me than the sand of the seas. I have brought against them, against the mother of a young man, a destroyer at noon; I have suddenly made city and terrors fall upon her.
translation:
  language: fr
  text: À mes yeux, leurs veuves sont devenues plus nombreuses que le sable des mers. J’ai fait venir contre eux, contre la mère d’un jeune homme, un dévastateur en plein midi. J’ai soudain fait tomber sur elle la cité et les terreurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte littéralement « la cité et les terreurs ». Certaines traductions, suivant une correction conjecturale, rendent plutôt « l’angoisse et les terreurs » ou une expression semblable.
    reason: La leçon massorétique עִיר (« cité, ville ») donne un sens difficile; la note informe le lecteur sans remplacer le texte attesté par une conjecture.
lexical_decisions:
- source_word: עָצְמוּ
  choice: sont devenues… plus nombreuses
  rationale: Le verbe exprime ici l’accroissement en nombre ou la multiplication; cette formulation française restitue naturellement le parfait hébreu.
- source_word: שֹׁדֵד
  choice: un dévastateur
  rationale: Le terme désigne celui qui ravage ou détruit; « dévastateur » convient au contexte de guerre et de mort.
- source_word: בַּצָּהֳרָיִם
  choice: en plein midi
  rationale: Rend l’idée d’une attaque survenant à midi, donc ouvertement et à un moment inattendu.
- source_word: עִיר
  choice: la cité
  rationale: Le texte massorétique porte littéralement « ville/cité ». La traduction maintient cette leçon difficile sans la corriger conjecturalement en « angoisse ».
- source_word: בֶהָלוֹת
  choice: les terreurs
  rationale: Le pluriel indique des épouvantes, affolements ou terreurs soudaines; « terreurs » préserve la force et le nombre.
theological_decisions:
- issue: Référent de « la mère du jeune homme »
  choice: Conserver la formulation singulière et son rattachement syntaxique au dévastateur envoyé contre eux
  alternative: Interpréter explicitement la mère comme une figure collective de Jérusalem ou comme toute mère de jeune homme
  rationale: L’hébreu reste condensé et ambigu; expliciter une identification collective ou individuelle dépasserait le texte.
- issue: Leçon difficile עִיר (« cité »)
  choice: Traduire le texte massorétique par « la cité »
  alternative: Adopter une conjecture telle que « angoisse », « détresse » ou « excitation »
  rationale: La WLC atteste עִיר. Même si la syntaxe et le sens sont difficiles, il convient de préserver la tension du texte reçu et de signaler l’alternative en note.
translation_notes:
  register: Français international moderne, sobre et dignifié. La structure répétitive « contre eux, contre la mère… » conserve la densité de l’hébreu. « En plein midi » est idiomatique sans affaiblir l’image. La ponctuation répartit les trois déclarations divines tout en maintenant leur enchaînement.
