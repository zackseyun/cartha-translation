  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/נְתַתִּ֜י/ךָ לָ/עָ֣ם הַ/זֶּ֗ה לְ/חוֹמַ֤ת נְחֹ֨שֶׁת֙ בְּצוּרָ֔ה וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הוֹשִֽׁיעֲ/ךָ֥ וּ/לְ/הַצִּילֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/020.yaml
  text: And I will make you to this people a fortified wall of bronze; they will fight against you[a], but they will not prevail over you, for I am with you to save you and to deliver you, declares Yahweh.
translation:
  language: fr
  text: Je ferai de toi, face à ce peuple, une muraille de bronze fortifiée. Ils te feront la guerre, mais ils ne l’emporteront pas sur toi, car je suis avec toi pour te sauver et te délivrer — déclaration de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: Je ferai de toi
  rationale: Avec לְ suivi d’un nom attribut, נתן exprime ici l’établissement dans un rôle ou un état. « Je ferai de toi » rend naturellement cette valeur en français.
- source_word: לָעָם הַזֶּה
  choice: face à ce peuple
  rationale: Le לְ marque la relation entre Jérémie et le peuple. « Face à » reste neutre quant à la fonction exacte de la muraille tout en convenant au contexte d’opposition.
- source_word: לְחוֹמַת נְחֹשֶׁת בְּצוּרָה
  choice: une muraille de bronze fortifiée
  rationale: חוֹמָה désigne une muraille; נְחֹשֶׁת, le bronze; et בְּצוּרָה qualifie la muraille comme fortifiée ou imprenable. La formulation conserve l’image de solidité.
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: Ils te feront la guerre
  rationale: לחם avec אֶל signifie combattre contre quelqu’un. Cette expression française est naturelle et garde la force du langage guerrier.
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: mais ils ne l’emporteront pas sur toi
  rationale: יכל avec לְ exprime ici l’incapacité à vaincre ou à prévaloir contre Jérémie. « Ne l’emporteront pas sur toi » en restitue le sens idiomatique.
- source_word: כִּי אִתְּךָ אֲנִי
  choice: car je suis avec toi
  rationale: כִּי introduit le motif de l’échec des adversaires et de la protection promise.
- source_word: לְהוֹשִׁיעֲךָ
  choice: pour te sauver
  rationale: ישע signifie sauver ou secourir. « Sauver » maintient son vocabulaire biblique général.
- source_word: וּלְהַצִּילֶךָ
  choice: et te délivrer
  rationale: נצל évoque l’action d’arracher au danger ou de délivrer. Le choix préserve la paire de verbes distincts du texte hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם est une formule solennelle d’énoncé prophétique; « déclaration de » en garde le caractère formel, et le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Nature de la promesse faite à Jérémie
  choice: Les adversaires combattront Jérémie sans réussir à le vaincre
  alternative: Dieu empêcherait toute attaque contre Jérémie
  rationale: Le verset promet non l’absence de conflit, mais la présence salvatrice de Dieu au milieu d’un conflit réel; les deux propositions sont donc maintenues dans leur tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Muraille » convient mieux que « mur » à l’image défensive de חוֹמָה. La ponctuation sépare nettement la métaphore initiale, le conflit annoncé et son fondement théologique.
