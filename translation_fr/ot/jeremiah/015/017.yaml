reference: Jeremiah 15:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא יָשַׁ֥בְתִּי בְ/סוֹד מְשַׂחֲקִ֖ים וָֽ/אֶעְלֹ֑ז מִ/פְּנֵ֤י יָֽדְ/ךָ֙ בָּדָ֣ד יָשַׁ֔בְתִּי כִּֽי זַ֖עַם מִלֵּאתָֽ/נִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/017.yaml
  text: I did not sit in the company of those who laugh[a], nor did I rejoice; because of your hand I sat alone[c][b], for you filled me with indignation.
translation:
  language: fr
  text: Je ne me suis pas assis dans le cercle de ceux qui riaient[a], et je ne me suis pas réjoui. À cause de ta main[b], je suis resté assis seul, car tu m’as rempli d’indignation[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la compagnie de ceux qui s’amusaient » ou « dans le cercle de ceux qui faisaient la fête ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant ta main » ; l’expression peut signifier « à cause de ta main » ou « sous la pression de ta main ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de colère », « de fureur » ou « de courroux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: je ne me suis pas assis / je suis resté assis
  rationale: Le verbe ישׁב peut signifier « s’asseoir », « demeurer » ou « rester ». Le choix conserve l’image concrète et la répétition du texte hébreu, tout en employant « rester assis » dans la seconde proposition pour un français naturel.
- source_word: בְסוֹד
  choice: dans le cercle de
  rationale: סוֹד désigne ici un cercle intime, un groupe ou une compagnie, plutôt qu’un conseil institutionnel. « Dans le cercle de » préserve la nuance relationnelle et sociale.
- source_word: מְשַׂחֲקִים
  choice: ceux qui riaient
  rationale: Le participe de שׂחק peut évoquer le rire, le jeu ou la gaieté. « Ceux qui riaient » reste transparent et n’impose pas la nuance plus étroite de moquerie.
- source_word: וָאֶעְלֹז
  choice: et je ne me suis pas réjoui
  rationale: עלז exprime la joie vive ou l’exultation. La négation de la première proposition est reprise en français, conformément au parallélisme et au sens contextuel.
- source_word: מִפְּנֵי יָדְךָ
  choice: à cause de ta main
  rationale: L’expression signifie littéralement « de devant ta main » et présente vraisemblablement la main de Dieu comme sa puissance contraignante. La formulation retenue exprime le rapport causal sans supprimer l’image de la main.
- source_word: בָּדָד
  choice: seul
  rationale: בָּדָד indique l’isolement ou la mise à part. « Seul » en restitue sobrement la force affective.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison de l’isolement du prophète. « Car » rend clairement ce lien explicatif.
- source_word: זַעַם
  choice: indignation
  rationale: זַעַם peut désigner l’indignation, la colère ou la fureur, souvent associée au jugement divin. « Indignation » conserve la gravité du terme sans préciser excessivement sa nuance psychologique ou judiciaire.
- source_word: מִלֵּאתָנִי
  choice: tu m’as rempli
  rationale: Le verbe מלא signifie « remplir ». Le passé composé convient au récit poétique en français moderne et maintient la causalité directe exprimée par l’hébreu.
theological_decisions:
- issue: Sens de « ta main » dans l’isolement de Jérémie
  choice: Conserver la métaphore de la main divine tout en marquant qu’elle est la cause de l’isolement.
  alternative: Paraphraser la main comme la contrainte, la protection ou la présence de Dieu.
  rationale: Le contexte suggère la puissance ou la pression liée à l’appel prophétique, mais le texte ne définit pas complètement cette image. La traduction préserve donc sa tension théologique.
- issue: Portée de זַעַם
  choice: Employer « indignation » dans le texte principal.
  alternative: Employer « colère », « fureur » ou « courroux ».
  rationale: Le terme peut évoquer la colère divine que porte le prophète, mais la syntaxe dit que Dieu en remplit Jérémie. « Indignation » laisse ouverte la relation exacte entre l’émotion du prophète et le jugement de Dieu.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de l’image « s’asseoir » est maintenue pour refléter la structure hébraïque. Les formulations confessionnelles ou interprétations doctrinales trop précises sont évitées.
