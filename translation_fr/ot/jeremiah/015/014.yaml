  text: וְ/הַֽעֲבַרְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ בְּ/אֶ֖רֶץ לֹ֣א יָדָ֑עְתָּ כִּֽי אֵ֛שׁ קָדְחָ֥ה בְ/אַפִּ֖/י עֲלֵי/כֶ֥ם תּוּקָֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/014.yaml
  text: And I will make your enemies pass into a land you have not known[a], for a fire has been kindled in my anger; it will burn against you.
translation:
  language: fr
  text: Je ferai passer tes ennemis dans un pays que tu n’as jamais connu[a], car un feu s’est allumé dans ma colère ; il brûlera contre vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, d’après certaines versions anciennes et le passage parallèle de Jérémie 17.4 : « Je te ferai servir tes ennemis dans un pays que tu n’as jamais connu. » Le texte consonantique hébreu porte ici « tes ennemis », mais l’autre lecture peut provenir d’une vocalisation différente ou d’un texte hébreu sous-jacent différent.'
    reason: textual_variant
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: Je ferai passer
  rationale: Le hiphil de עבר exprime ici une action causative. Cette formulation garde cette valeur tout en restant naturelle en français.
- source_word: אֶת אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Le texte massorétique porte explicitement le nom pluriel « ennemis » avec un suffixe de deuxième personne du masculin singulier.
- source_word: בְּאֶרֶץ לֹא יָדָעְתָּ
  choice: dans un pays que tu n’as jamais connu
  rationale: Après un verbe de déplacement, בְּ peut indiquer l’entrée dans un lieu. Le passé composé avec « jamais » restitue naturellement la valeur d’expérience du parfait hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du jugement annoncé.
- source_word: אֵשׁ קָדְחָה
  choice: un feu s’est allumé
  rationale: L’image concrète du feu est conservée, et le passé composé rend l’action accomplie du parfait sans imposer un passif absent de l’hébreu.
- source_word: בְאַפִּי
  choice: dans ma colère
  rationale: אַף désigne littéralement le nez, mais exprime idiomatiquement la colère dans ce contexte.
- source_word: עֲלֵיכֶם תּוּקָד
  choice: il brûlera contre vous
  rationale: Le futur rend l’inaccompli hébreu et « contre vous » exprime la portée hostile du feu de jugement. Le pluriel « vous » préserve le changement de nombre du texte.
theological_decisions:
- issue: Passage du singulier (« tes ennemis », « tu ») au pluriel (« vous »)
  choice: Conserver le singulier dans la première proposition et le pluriel dans la dernière
  alternative: Uniformiser tous les pronoms au singulier ou au pluriel
  rationale: L’hébreu passe du suffixe singulier aux suffixes pluriels, peut-être de Jérémie ou d’un singulier représentatif à l’ensemble du peuple. La traduction maintient cette tension au lieu de l’harmoniser.
- issue: Lecture « tes ennemis » ou « te faire servir tes ennemis »
  choice: 'Traduire le texte consonantique massorétique : « tes ennemis »'
  alternative: « Je te ferai servir tes ennemis »
  rationale: Le texte hébreu transmis lit « tes ennemis ». Certaines versions anciennes et le parallèle de Jérémie 17.4 soutiennent cependant l’autre lecture, qui est signalée en note sans être introduite dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image prophétique du feu et le changement intentionnel de nombre grammatical, tout en évitant une tournure artificiellement archaïque.
