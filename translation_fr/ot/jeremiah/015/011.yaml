source:
  edition: WLC
  text: אָמַ֣ר יְהוָ֔ה אִם לֹ֥א שרות/ך לְ/ט֑וֹב אִם ל֣וֹא הִפְגַּ֣עְתִּֽי בְ/ךָ֗ בְּ/עֵ֥ת רָעָ֛ה וּ/בְ/עֵ֥ת צָרָ֖ה אֶת הָ/אֹיֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/011.yaml
  text: Yahweh said[a], “Surely I have set you free for good[b]; surely I have made the enemy plead with you in a time of disaster and in a time of distress.”
translation:
  language: fr
  text: 'Yahweh dit : « Oui, je t’ai libéré[a] pour ton bien ; oui, j’ai amené l’ennemi à te supplier[b] au temps du malheur et au temps de la détresse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de la première proposition est incertain. On peut aussi comprendre : « Oui, je t’ai relâché pour ton bien », ou, en analysant autrement la forme : « Oui, j’ai fortifié le reste pour le bien. »'
    reason: textual_variant
  - marker: b
    text: 'Ou : « Oui, je suis intervenu en ta faveur auprès de l’ennemi au temps du malheur et au temps de la détresse. »'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom propre de l’alliance sous sa forme française courante dans le projet.
- source_word: אִם לֹא ... אִם לוא
  choice: oui ... oui
  rationale: Dans ce contexte, la tournure a une valeur d’affirmation solennelle plutôt que de condition ; « oui » exprime naturellement cette insistance en français.
- source_word: שרותך
  choice: je t’ai libéré
  rationale: La forme hébraïque est difficile et peut être comprise de plusieurs manières. « Je t’ai libéré » rend une interprétation probable liée à la délivrance, sans cacher les autres possibilités, signalées en note.
- source_word: לְטוֹב
  choice: pour ton bien
  rationale: Exprime clairement le résultat bénéfique indiqué par la préposition et le nom.
- source_word: הִפְגַּעְתִּי בְךָ
  choice: j’ai amené ... à te supplier
  rationale: Le hiphil de פגע peut ici décrire le fait d’amener l’ennemi à adresser une supplication à Jérémie ; cette lecture convient au contexte de sa future justification.
- source_word: אֶת הָאֹיֵב
  choice: l’ennemi
  rationale: Rend directement le singulier défini, qui peut avoir une portée collective.
- source_word: בְּעֵת רָעָה
  choice: au temps du malheur
  rationale: רָעָה désigne ici une situation funeste plutôt que le mal moral ; « malheur » est naturel et digne.
- source_word: וּבְעֵת צָרָה
  choice: et au temps de la détresse
  rationale: Préserve le parallélisme et la nuance d’oppression ou d’angoisse portée par צָרָה.
theological_decisions:
- issue: Interprétation d’une promesse à Jérémie dont l’hébreu est difficile et discuté
  choice: Le verset affirme que Dieu a libéré Jérémie pour son bien et amènera l’ennemi à le supplier dans le malheur.
  alternative: La première proposition peut évoquer la fortification du reste pour le bien ; la seconde peut signifier que Dieu intervient ou intercède en faveur de Jérémie auprès de l’ennemi.
  rationale: La lecture retenue s’accorde avec la syntaxe possible et avec le contexte de la justification de Jérémie. Les ambiguïtés authentiques sont néanmoins conservées en notes et ne sont pas transformées en certitudes doctrinales.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est maintenu, tandis que les deux principales incertitudes lexicales sont explicitées en notes.
