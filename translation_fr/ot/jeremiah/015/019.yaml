base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/019.yaml
  text: 'Therefore[a], this is what Yahweh says: If you return, I will restore you, and you will stand before me. If you bring out the precious from the worthless, you will be as my mouth. They will turn to you[c][b], but you must not turn to them.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh :


    « Si tu reviens, je te rétablirai[a],


    et tu te tiendras devant moi.


    Si tu extrais ce qui est précieux de ce qui est sans valeur[b],


    tu seras comme ma bouche[c].


    Eux, ils se tourneront vers toi,


    mais toi, ne te tourne pas vers eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Si tu retournes, je te ferai revenir. » L’hébreu reprend le même verbe, « revenir » ou « retourner », pour la réponse de Jérémie et pour l’action de Yahweh qui le rétablit.'
    reason: lexical_alternative
  - marker: b
    text: 'Cette image désigne probablement le fait de distinguer, dans ses paroles, ce qui est digne de ce qui ne l’est pas ; voir la proposition suivante : « tu seras comme ma bouche ».'
    reason: lexical_alternative
  - marker: c
    text: 'Autrement dit : « tu seras mon porte-parole ». Littéralement : « tu seras comme ma bouche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Cette locution marque naturellement en français la conséquence et relie la réponse de Yahweh à la plainte précédente.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Formulation française actuelle qui conserve la formule solennelle du messager prophétique et rend le nom divin par sa translittération.
- source_word: אִם תָּשׁוּב וַאֲשִׁיבְךָ
  choice: Si tu reviens, je te rétablirai
  rationale: « Reviens » préserve l’image large de שׁוב sans la réduire au seul repentir. « Je te rétablirai » exprime la forme causative du second emploi et convient à la restauration relationnelle et prophétique, tandis qu’une note signale la répétition hébraïque.
- source_word: לְפָנַי תַּעֲמֹד
  choice: tu te tiendras devant moi
  rationale: Rend directement l’image hébraïque, qui peut impliquer le service et l’acceptation sans les expliciter dans le texte.
- source_word: וְאִם תּוֹצִיא יָקָר מִזּוֹלֵל
  choice: Si tu extrais ce qui est précieux de ce qui est sans valeur
  rationale: « Extrais » garde l’idée de faire sortir, et le contraste entre le précieux et le sans-valeur demeure concret sans imposer une interprétation exclusivement morale ou sociale.
- source_word: כְּפִי תִהְיֶה
  choice: tu seras comme ma bouche
  rationale: Conserve la métaphore frappante de l’hébreu au lieu de la remplacer dans le texte par « mon porte-parole ».
- source_word: יָשֻׁבוּ הֵמָּה אֵלֶיךָ וְאַתָּה לֹא תָשׁוּב אֲלֵיהֶם
  choice: Eux, ils se tourneront vers toi, mais toi, tu ne te tourneras pas vers eux
  rationale: Les pronoms détachés « eux » et « toi » rendent le contraste emphatique. La répétition de « se tourner » reflète celle de שׁוב et l’indicatif conserve la lecture la plus probable de l’imparfait comme promesse suivie d’une interdiction contextuelle.
theological_decisions:
- issue: Nature du retour et du rétablissement de Jérémie
  choice: Maintenir l’appel à « revenir » et la promesse de rétablissement dans sa fonction devant Yahweh.
  alternative: Traduire explicitement par « si tu te repens » ou comprendre uniquement une nouvelle confirmation de sa mission prophétique.
  rationale: Le contexte permet d’entendre à la fois une correction de l’attitude et des paroles de Jérémie et son rétablissement comme prophète. Le français conserve cette tension sans qualifier précisément sa faute.
- issue: Sens de l’extraction du précieux hors de ce qui est sans valeur
  choice: Conserver l’image générale dans le texte, avec une note indiquant son application probable aux paroles de Jérémie.
  alternative: Paraphraser par « si tu prononces des paroles dignes plutôt que des paroles indignes » ou y voir la séparation des fidèles et des impies.
  rationale: La proposition suivante, « tu seras comme ma bouche », favorise une interprétation liée à la parole prophétique, mais la métaphore hébraïque reste plus large et ne doit pas être réduite silencieusement.
- issue: Force de יָשֻׁבוּ
  choice: 'Le comprendre comme une annonce : « ils se tourneront vers toi ».'
  alternative: 'Le rendre comme une permission ou une injonction : « qu’ils se tournent vers toi ».'
  rationale: Dans ce contexte de promesse et de contraste, l’indicatif est naturel, tout en évitant de préciser au-delà du texte la manière dont le peuple se tournera vers Jérémie.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et les pronoms emphatiques ont été conservés. Les métaphores de « se tenir devant » Yahweh et d’être « comme sa bouche » restent visibles dans le texte principal, tandis que les explications interprétatives sont placées en notes.
