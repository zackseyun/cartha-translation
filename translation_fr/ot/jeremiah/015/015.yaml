source:
  edition: WLC
  text: אַתָּ֧ה יָדַ֣עְתָּ יְהוָ֗ה זָכְרֵ֤/נִי וּ/פָקְדֵ֨/נִי֙ וְ/הִנָּ֤קֶם לִ/י֙ מֵ/רֹ֣דְפַ֔/י אַל לְ/אֶ֥רֶךְ אַפְּ/ךָ֖ תִּקָּחֵ֑/נִי דַּ֕ע שְׂאֵתִ֥/י עָלֶ֖י/ךָ חֶרְפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/015.yaml
  text: You know[a], O Yahweh; remember me and attend to me, and take vengeance for me on my persecutors. In your patience do not take me away[d][c][b]; know that for your sake I bear reproach.
translation:
  language: fr
  text: 'Tu le sais, Yahweh : souviens-toi de moi, interviens en ma faveur[a] et venge-moi de mes persécuteurs[b]. Dans ta patience, ne m’enlève pas[c]. Sache que je supporte l’opprobre à cause de toi[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prends soin de moi », « prête attention à moi » ou « visite-moi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « fais-moi justice contre ceux qui me poursuivent ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Ne me prends pas dans/à cause de la longueur de ta colère. » L’expression désigne la lenteur à se mettre en colère, donc la patience. La relation exacte entre cette patience et la demande de Jérémie demeure concise et peut aussi se comprendre : « À cause de ta lenteur à la colère, ne m’enlève pas ».'
    reason: lexical_alternative
  - marker: d
    text: Ou « Sache que je porte l’opprobre pour toi » ou « à cause de toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin sous la forme « Yahweh », conformément à l’usage du projet et à la distinction présente dans l’hébreu.
- source_word: זָכְרֵנִי
  choice: souviens-toi de moi
  rationale: Rend directement l’impératif de זכר, dont le contexte de prière implique un souvenir qui conduit à l’action sans qu’il soit nécessaire d’expliciter davantage.
- source_word: וּפָקְדֵנִי
  choice: interviens en ma faveur
  rationale: פקד peut signifier visiter, prendre en considération ou s’occuper de quelqu’un. Ici, le parallélisme avec « souviens-toi de moi » et l’appel à la vengeance indiquent une intervention bienveillante, que cette formulation exprime naturellement.
- source_word: וְהִנָּקֶם לִי מֵרֹדְפַי
  choice: venge-moi de mes persécuteurs
  rationale: Préserve la force judiciaire de נקם et présente Dieu comme celui auquel Jérémie demande de faire justice, sans atténuer la tension du texte.
- source_word: מֵרֹדְפַי
  choice: mes persécuteurs
  rationale: רדף désigne littéralement ceux qui poursuivent Jérémie; dans ce contexte hostile, « persécuteurs » communique clairement la nature de cette poursuite.
- source_word: אַל לְאֶרֶךְ אַפְּךָ תִּקָּחֵנִי
  choice: Dans ta patience, ne me laisse pas être emporté
  rationale: 'אֶרֶךְ אַף est l’expression idiomatique de la lenteur à la colère, donc de la patience. La tournure passive causative rend le sens contextuel probable : Jérémie demande que le délai accordé à ses ennemis ne conduise pas à sa disparition, tout en signalant en note la formulation plus directe.'
- source_word: דַּע
  choice: Sache
  rationale: Rend l’impératif et maintient l’écho lexical avec l’ouverture « Tu le sais ».
- source_word: שְׂאֵתִי
  choice: je supporte
  rationale: Le verbe נשׂא exprime ici le fait de porter ou d’endurer l’opprobre; « supporter » est naturel en français dans ce contexte.
- source_word: עָלֶיךָ חֶרְפָּה
  choice: c’est à cause de toi que je supporte les insultes
  rationale: עָלֶיךָ rattache l’opprobre subi par Jérémie à Yahweh et à son service. « À cause de toi » conserve ce rapport causal ou relationnel sans le préciser davantage.
theological_decisions:
- issue: Nature de l’appel de Jérémie à la rétribution divine
  choice: « venge-moi de mes persécuteurs »
  alternative: « fais-moi justice contre ceux qui me poursuivent »
  rationale: נקם appelle explicitement la vengeance ou la rétribution exercée par Dieu. La traduction conserve cette tension théologique au lieu de la réduire à une simple demande de réconfort ou de la transformer en déclaration doctrinale.
- issue: Effet de la patience divine sur le sort de Jérémie
  choice: « Dans ta patience, ne me laisse pas être emporté »
  alternative: « À cause de ta lenteur à la colère, ne m’emporte pas »
  rationale: La syntaxe hébraïque est concise et difficile. Le contexte suggère que Jérémie craint de périr pendant que Dieu use de patience envers ses persécuteurs. Le texte principal rend ce sens probable, tandis que la note conserve l’ambiguïté de la formulation littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu. « Insultes » est retenu dans le texte pour sa clarté courante, tandis que « opprobre » figure en note afin de conserver une équivalence plus formelle. Les quatre appels de note [a] à [d] apparaissent dans le texte principal.
