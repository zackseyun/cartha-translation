  source_fidelity: 'Le texte rend fidèlement les impératifs successifs et la demande de rétribution divine. Toutefois, « ne me laisse pas être emporté » introduit une causation passive (« laisse ») qui n’est pas exprimée par תִּקָּחֵנִי, lequel s’adresse directement à Dieu : « ne me prends/ne m’enlève pas ». Une formulation directe conserve mieux la concision et l’ambiguïté du texte hébreu.'
  naturalness: Le français est généralement naturel, digne et accessible. « Dans ta patience, ne m’enlève pas » est plus direct et plus proche de l’original que la tournure passive proposée. « Supporter l’opprobre » convient au registre prophétique tout en restant compréhensible dans un français international moderne.
  terminology: « Yahweh » suit le choix du projet. « Interviens en ma faveur » exprime convenablement פקד dans ce contexte; la note préserve des possibilités lexicales. « Venge-moi de mes persécuteurs » maintient la force de נקם, sans atténuation doctrinale. « Opprobre » rend plus précisément חרפה que « insultes », qui en réduisait quelque peu la portée à des paroles insultantes.
