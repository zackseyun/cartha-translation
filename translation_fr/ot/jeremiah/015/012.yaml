  yaml_path: translation/ot/jeremiah/015/012.yaml
  text: Can iron break iron from the north[b][a], and bronze?
translation:
  language: fr
  text: Le fer peut-il briser le fer du nord[a] et le bronze[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est concis. L’expression « fer du nord » peut désigner un fer particulièrement résistant.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « bronze » peut aussi désigner le cuivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָרֹעַ
  choice: peut-il briser
  rationale: La particule interrogative הֲ et le verbe issu de רעע forment ici une question rhétorique. Avec des métaux pour sujet et complément, le verbe évoque l’action de briser plutôt que celle de faire le mal.
- source_word: בַּרְזֶל
  choice: fer
  rationale: Équivalent français courant et précis du nom désignant le fer.
- source_word: בַּרְזֶל מִצָּפוֹן
  choice: le fer venu du nord
  rationale: Cette formulation reste proche de l’expression hébraïque et peut désigner un fer particulièrement résistant associé au nord, sans rendre cette interprétation plus explicite que le texte source.
- source_word: וּנְחֹשֶׁת
  choice: et le bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. Dans ce contexte métallurgique, « bronze » est le choix traditionnel et vraisemblable, tandis que l’autre possibilité est signalée en note.
