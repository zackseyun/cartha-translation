source:
  edition: WLC
  text: וּ/נְתַתִּ֣י/ם ל/זועה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ בִּ֠/גְלַל מְנַשֶּׁ֤ה בֶן יְחִזְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַ֥ל אֲשֶׁר עָשָׂ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/004.yaml
  text: And I will make them a horror to all the kingdoms of the earth[a], because of Manasseh son of Hezekiah, king of Judah, because of what he did in Jerusalem.
translation:
  language: fr
  text: Je ferai d’eux un objet d’effroi pour tous les royaumes de la terre[a], à cause de Manassé, fils d’Ézéchias et roi de Juda, à cause de ce qu’il a fait à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une cause d’épouvante » ou « un objet d’horreur ». Le nom hébreu désigne ce qui provoque tremblement, effroi ou horreur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: Je ferai d’eux
  rationale: Avec le complément introduit par ל, נתן exprime ici le fait de rendre quelqu’un ou d’en faire quelque chose. Cette tournure française restitue naturellement ce sens résultatif.
- source_word: לְזַוֲעָה
  choice: un objet d’effroi
  rationale: Le nom évoque ce qui provoque tremblement, épouvante ou horreur. « Objet d’effroi » indique clairement que le peuple deviendra, aux yeux des royaumes, une cause d’épouvante, sans réduire le terme à une seule nuance.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: pour tous les royaumes de la terre
  rationale: Le ל marque ici la relation avec les royaumes devant lesquels ils deviendront un objet d’effroi. « Pour » est naturel en français dans cette construction.
- source_word: בִּגְלַל
  choice: à cause de
  rationale: La locution a un sens causal explicite et rattache directement le jugement à Manassé.
- source_word: מְנַשֶּׁה בֶן יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Manassé, fils d’Ézéchias et roi de Juda
  rationale: Les noms propres suivent leurs formes françaises usuelles. La coordination rend sans ambiguïté les deux qualifications de Manassé.
- source_word: עַל אֲשֶׁר עָשָׂה
  choice: à cause de ce qu’il a fait
  rationale: La formule précise le motif causal en renvoyant aux actes de Manassé. La répétition de « à cause de » conserve l’insistance de l’hébreu.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Le français emploie normalement « à » avec le nom de cette ville.
theological_decisions:
- issue: Le jugement collectif de Juda lié aux actes de Manassé
  choice: Conserver le lien causal explicite entre le jugement annoncé et ce que Manassé a fait à Jérusalem
  alternative: Présenter Manassé comme un simple arrière-plan historique ou atténuer la causalité
  rationale: Le texte répète deux expressions causales et attribue expressément le jugement aux actes de Manassé. La traduction maintient cette tension théologique sans chercher à la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. « Objet d’effroi » conserve la force du terme hébreu tout en restant idiomatique; la répétition causale est volontaire afin de refléter la structure du texte source.
