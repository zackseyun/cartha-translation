source:
  edition: WLC
  text: אֻמְלְלָ֞ה יֹלֶ֣דֶת הַ/שִּׁבְעָ֗ה נָפְחָ֥ה נַפְשָׁ֛/הּ באה שִׁמְשָׁ֛/הּ בְּ/עֹ֥ד יוֹמָ֖ם בּ֣וֹשָׁה וְ/חָפֵ֑רָה וּ/שְׁאֵֽרִיתָ֗/ם לַ/חֶ֧רֶב אֶתֵּ֛ן לִ/פְנֵ֥י אֹיְבֵי/הֶ֖ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/009.yaml
  text: She who bore seven has withered away[a]; she has breathed out her life. Her sun has gone down while it was still day. She is ashamed and humiliated. And the remnant of them I will give to the sword before their enemies[c][b], declares Yahweh.
translation:
  language: fr
  text: Celle qui a mis au monde sept enfants dépérit[a] ; elle rend son dernier souffle[b]. Son soleil se couche alors qu’il fait encore jour[c]. Elle est honteuse et humiliée. Quant à ceux qui resteront, je les livrerai à l’épée devant leurs ennemis, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se flétrit ». L’hébreu évoque une femme qui dépérit après avoir été pleinement féconde.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle exhale sa vie » ou « son âme ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « son soleil se couche alors qu’il fait encore jour », image poétique d’une fin prématurée.'
    reason: cultural_note
lexical_decisions:
- source_word: אֻמְלְלָה
  choice: dépérit
  rationale: Le verbe exprime le dépérissement et l’affaiblissement. « Dépérit » est naturel en français et garde la force poétique de l’effondrement.
- source_word: יֹלֶדֶת הַשִּׁבְעָה
  choice: celle qui avait mis au monde sept enfants
  rationale: La formulation explicite le sens implicite de « celle qui enfante les sept » tout en conservant le chiffre sept et l’image d’une fécondité autrefois accomplie.
- source_word: נָפְחָה נַפְשָׁהּ
  choice: elle rend son dernier souffle
  rationale: Cette expression française naturelle conserve l’image concrète du souffle qui s’éteint et communique clairement la mort.
- source_word: באה שִׁמְשָׁהּ בְּעוֹד יוֹמָם
  choice: Son soleil se couche alors qu’il fait encore jour
  rationale: Cette traduction préserve la métaphore hébraïque d’une fin prématurée, sans la réduire à une simple explication.
- source_word: בּוֹשָׁה וְחָפֵרָה
  choice: Elle est couverte de honte et d’humiliation
  rationale: Le doublet exprime à la fois la honte éprouvée et l’abaissement public ; cette tournure française en maintient l’intensité.
- source_word: וּשְׁאֵרִיתָם
  choice: Quant à ceux qui resteront
  rationale: Cette formulation moderne rend clairement le groupe survivant visé par le nom collectif hébreu.
- source_word: לַחֶרֶב אֶתֵּן
  choice: je les livrerai à l’épée
  rationale: « Livrer à l’épée » restitue naturellement la formule hébraïque de jugement et son idée de mort violente.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: devant leurs ennemis
  rationale: La traduction garde le sens littéral de présence et d’exposition face aux ennemis.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » convient à la formule prophétique solennelle, tandis que « Yahweh » représente directement le nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le Tétragramme ; sa transcription préserve ici le caractère personnel du nom divin sans substituer un titre.
- issue: Référent féminin et reste collectif
  choice: Maintenir le passage de « elle » à « ceux qui resteront »
  alternative: Harmoniser tous les pronoms autour d’un même référent explicite
  rationale: Le texte passe de la figure féminine de la mère féconde au reste collectif. La traduction conserve ce mouvement sans identifier davantage la femme ou le groupe.
translation_notes:
  register: Français international actuel, digne et poétique. Les images du souffle, du soleil et de l’épée sont conservées ; les formulations archaïques sont évitées. Les marqueurs [a], [b] et [c] figurent tous dans le texte dans l’ordre correspondant aux notes.
