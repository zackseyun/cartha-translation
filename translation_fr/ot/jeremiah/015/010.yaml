reference: Jeremiah 15:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֽוֹי לִ֣/י אִמִּ֔/י כִּ֣י יְלִדְתִּ֗/נִי אִ֥ישׁ רִ֛יב וְ/אִ֥ישׁ מָד֖וֹן לְ/כָל הָ/אָ֑רֶץ לֹֽא נָשִׁ֥יתִי וְ/לֹא נָֽשׁוּ בִ֖/י כֻּלֹּ֥/ה מְקַלְלַֽו/נִי־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/010.yaml
  text: Woe to me[a], my mother, because you bore me, a man of strife and a man of contention to all the land. I have not lent, nor have they lent to me[b], yet every one of them curses me.
translation:
  language: fr
  text: Malheur à moi, ma mère, parce que tu m’as mis au monde, un homme de querelle, un homme de discorde pour tout le pays[a] ! Je n’ai prêté à personne, et personne ne m’a prêté[b] ; pourtant, tous me maudissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toute la terre ».
    reason: alternative_reading
  - marker: b
    text: L’hébreu évoque vraisemblablement les rapports de prêt et de dette. Jérémie affirme n’avoir fourni aucun motif social ordinaire à une telle hostilité.
    reason: cultural_note
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: Malheur à moi
  rationale: Cette exclamation conserve la force du cri de détresse hébreu tout en restant claire et digne en français moderne.
- source_word: אִמִּי
  choice: ma mère
  rationale: L’apostrophe directe est maintenue afin de préserver l’intensité personnelle de la plainte.
- source_word: כִּי יְלִדְתִּנִי
  choice: Pourquoi m’as-tu mis au monde
  rationale: Dans cette lamentation, כִּי peut introduire la situation déplorée avec une nuance interrogative implicite. La formulation française exprime naturellement la plainte sans en modifier le fond.
- source_word: אִישׁ רִיב וְאִישׁ מָדוֹן
  choice: un homme de querelle et de discorde
  rationale: Les deux substantifs proches sont conservés pour rendre l’intensification rhétorique, sans présenter Jérémie comme nécessairement responsable des conflits.
- source_word: לְכָל הָאָרֶץ
  choice: pour tout le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne probablement le pays de Juda. La préposition « pour » conserve la relation quelque peu ouverte exprimée par לְ.
- source_word: לֹא נָשִׁיתִי וְלֹא נָשׁוּ בִי
  choice: Je n’ai pas prêté, et l’on ne m’a pas prêté
  rationale: 'La symétrie de l’hébreu est gardée : Jérémie n’a été ni créancier ni débiteur, motifs ordinaires d’animosité sociale.'
- source_word: כֻּלֹּה מְקַלְלַוּנִי
  choice: tous me maudissent
  rationale: Le présent rend naturellement l’action générale ou persistante du participe hébreu, tandis que « tous » conserve la portée collective.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre entière
  rationale: Le contexte de Jérémie favorise le pays de Juda plutôt qu’une affirmation universelle. L’autre sens lexical demeure signalé en note.
- issue: Responsabilité de Jérémie dans les querelles
  choice: homme de querelle et de discorde
  alternative: homme querelleur
  rationale: 'La formulation nominale préserve l’ambiguïté : Jérémie est au centre des conflits, sans que le texte affirme nécessairement qu’il les provoque par un tempérament querelleur.'
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe de lamentation conserve l’apostrophe à la mère et le parallélisme central. « L’on » évite une répétition plus lourde tout en gardant la construction impersonnelle du français courant soigné.
