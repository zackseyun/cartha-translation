source:
  edition: WLC
  text: לָ֣/מָּה הָיָ֤ה כְאֵבִ/י֙ נֶ֔צַח וּ/מַכָּתִ֖/י אֲנוּשָׁ֑ה֙ מֵֽאֲנָה֙ הֵֽרָפֵ֔א הָי֨וֹ תִֽהְיֶ֥ה לִ/י֙ כְּמ֣וֹ אַכְזָ֔ב מַ֖יִם לֹ֥א נֶאֱמָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/018.yaml
  text: Why has my pain become perpetual[a], and my wound incurable, refusing to be healed? Will you indeed be to me like a deceptive brook, like waters that are not reliable?
translation:
  language: fr
  text: Pourquoi ma douleur est-elle sans fin, et ma blessure incurable, refusant d’être guérie ? Seras-tu vraiment pour moi comme un ruisseau trompeur[a], comme des eaux auxquelles on ne peut se fier ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un ruisseau qui tarit » : l’image hébraïque est celle d’un cours d’eau qui semble promettre de l’eau, mais sur lequel on ne peut compter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֵבִי
  choice: ma douleur
  rationale: Le terme désigne la douleur ou la souffrance et convient à la plainte personnelle de Jérémie, sans limiter celle-ci au domaine physique.
- source_word: נֶצַח
  choice: sans fin
  rationale: Dans ce contexte, le mot exprime une durée qui semble ne jamais cesser. « Sans fin » est naturel en français moderne et conserve l'intensité de la plainte.
- source_word: מַכָּתִי
  choice: ma blessure
  rationale: Le vocabulaire de la guérison qui suit favorise le sens de « blessure » plutôt que celui de « coup ».
- source_word: אֲנוּשָׁה
  choice: incurable
  rationale: L'adjectif décrit ici une blessure grave, apparemment sans remède, ce que confirme la proposition relative à la guérison.
- source_word: מֵאֲנָה הֵרָפֵא
  choice: refusant de guérir
  rationale: Cette formulation garde la personnification frappante de la blessure tout en étant idiomatique en français.
- source_word: הָיוֹ תִהְיֶה לִי
  choice: Seras-tu vraiment pour moi
  rationale: L'infinitif absolu avec le verbe conjugué renforce la question. « Vraiment » restitue son caractère insistant et incrédule.
- source_word: אַכְזָב
  choice: un ruisseau trompeur
  rationale: Le mot évoque une eau qui déçoit l'attente, notamment un cours d'eau temporaire qui se tarit. « Trompeur » conserve l'accusation audacieuse du texte.
- source_word: מַיִם לֹא נֶאֱמָנוּ
  choice: des eaux auxquelles on ne peut se fier
  rationale: Cette expression rend clairement l'idée d'eaux non fiables tout en préservant le vocabulaire relationnel de la confiance associé à la racine אמן.
theological_decisions:
- issue: La plainte adressée directement à Dieu
  choice: 'Maintenir la question accusatrice à la deuxième personne : « Seras-tu vraiment pour moi… ? »'
  alternative: Atténuer la plainte afin de ne pas sembler attribuer à Dieu un manque de fiabilité.
  rationale: L'hébreu adresse à Dieu une plainte directe et audacieuse. La traduction conserve cette tension théologique sans l'expliquer ni l'adoucir.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement préserve l'adresse directe à Dieu. La métaphore du ruisseau et la répétition explicative des eaux non fiables sont maintenues.
