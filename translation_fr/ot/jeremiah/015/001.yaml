source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אִם יַעֲמֹ֨ד מֹשֶׁ֤ה וּ/שְׁמוּאֵל֙ לְ/פָנַ֔/י אֵ֥ין נַפְשִׁ֖/י אֶל הָ/עָ֣ם הַ/זֶּ֑ה שַׁלַּ֥ח מֵֽ/עַל פָּנַ֖/י וְ/יֵצֵֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/001.yaml
  text: Then Yahweh said to me[a], “Even if Moses and Samuel were to stand before me, my soul would not be toward this people. Send them away from before me[b], and let them go out.”
translation:
  language: fr
  text: 'Alors Yahweh me dit : « Même si Moïse et Samuel se tenaient devant moi, mon âme ne serait pas tournée vers ce peuple[a]. Renvoie-les loin de ma présence[b], et qu’ils s’en aillent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression évoque la disposition personnelle de Yahweh. On pourrait rendre plus idiomatiquement : « je n’aurais aucun égard pour ce peuple » ou « mon cœur ne serait pas tourné vers ce peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de devant moi », c’est-à-dire hors de ma présence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve ici le nom propre hébreu plutôt que de lui substituer un titre.
- source_word: אִם יַעֲמֹד
  choice: Même si … se tenaient
  rationale: אִם introduit ici une hypothèse concessive et emphatique ; l’imparfait français après « même si » rend naturellement cette éventualité irréelle ou inefficace.
- source_word: יַעֲמֹד … לְפָנַי
  choice: se tenaient devant moi
  rationale: Cette formulation garde l’image hébraïque et sa possible portée d’intercession sans expliciter dans le texte ce que le verbe ne dit pas directement.
- source_word: מֹשֶׁה וּשְׁמוּאֵל
  choice: Moïse et Samuel
  rationale: Formes françaises usuelles des noms bibliques.
- source_word: אֵין נַפְשִׁי אֶל־הָעָם הַזֶּה
  choice: mon âme ne se tournerait pas vers ce peuple
  rationale: Cette formulation conserve נַפְשִׁי, « mon âme / ma personne », ainsi que l’orientation exprimée par אֶל, tout en restant intelligible en français actuel.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier collectif préserve la désignation nationale et communautaire de l’hébreu.
- source_word: שַׁלַּח
  choice: Renvoie-les
  rationale: L’impératif signifie fondamentalement « envoyer, faire partir, renvoyer ». Le pronom pluriel reprend naturellement les membres du peuple et prépare le verbe pluriel suivant.
- source_word: מֵעַל פָּנַי
  choice: loin de ma présence
  rationale: Cette expression française rend le sens spatial et relationnel de l’hébreu, littéralement « de devant ma face », sans lourdeur excessive.
- source_word: וְיֵצֵאוּ
  choice: et qu’ils s’en aillent
  rationale: Le subjonctif à valeur injonctive rend la continuation jussive après l’impératif, tout en conservant l’idée de départ.
theological_decisions:
- issue: Expression anthropomorphique נַפְשִׁי (« mon âme ») appliquée à Yahweh
  choice: Conserver « mon âme » et l’image d’une orientation refusée envers le peuple.
  alternative: « je n’aurais aucun égard pour ce peuple » ou « je ne serais pas favorable à ce peuple »
  rationale: L’hébreu décrit vivement la disposition personnelle de Yahweh. Garder cette image préserve la tension du texte sans tirer de conclusion spéculative sur la nature divine.
- issue: Portée intercessrice de Moïse et Samuel se tenant devant Yahweh
  choice: Traduire littéralement l’action par « se tenaient devant moi ».
  alternative: « intercédaient auprès de moi » ou « plaidaient devant moi »
  rationale: Moïse et Samuel sont associés à l’intercession, mais le texte dit seulement qu’ils se tiennent devant Yahweh. La traduction ne rend donc pas explicite une implication contextuelle.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste naturelle tout en conservant les images hébraïques importantes (« se tenir devant », « mon âme »). Les impératifs finaux ont une force nette adaptée à l’annonce du jugement.
