source:
  edition: WLC
  text: וְ/הָיָ֛ה כִּֽי יֹאמְר֥וּ אֵלֶ֖י/ךָ אָ֣נָה נֵצֵ֑א וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה אֲשֶׁ֨ר לַ/מָּ֤וֶת לַ/מָּ֨וֶת֙ וַ/אֲשֶׁ֤ר לַ/חֶ֨רֶב֙ לַ/חֶ֔רֶב וַ/אֲשֶׁ֤ר לָֽ/רָעָב֙ לָֽ/רָעָ֔ב וַ/אֲשֶׁ֥ר לַ/שְּׁבִ֖י לַ/שֶּֽׁבִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/002.yaml
  text: 'And it shall be[a], when they say to you, ‘Where shall we go?’ then you shall say to them, ‘Thus says Yahweh: Those for death, to death; and those for the sword, to the sword; and those for famine, to famine; and those for captivity[b], to captivity.’'
translation:
  language: fr
  text: 'Quand ils te diront : « Où irons-nous ? », tu leur diras : « Ainsi parle Yahweh : Ceux qui sont pour la mort, à la mort ; ceux qui sont pour l’épée, à l’épée ; ceux qui sont pour la famine, à la famine ; ceux qui sont pour la captivité[a], à la captivité. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « exil », selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La construction introduit une circonstance future attendue. En français, « Quand » rend naturellement cette valeur sans alourdir la phrase par un calque tel que « Et il arrivera que, lorsque ».
- source_word: אָנָה נֵצֵא
  choice: Où irons-nous ?
  rationale: Le verbe יצא signifie littéralement « sortir », mais ici la question porte naturellement sur la destination. « Où irons-nous ? » conserve le sens sans produire le français peu idiomatique « Où sortirons-nous ? ».
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: tu leur répondras
  rationale: Le verbe signifie formellement « tu leur diras », mais puisqu’il introduit la réponse à leur question, « répondras » exprime clairement sa fonction contextuelle.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique traditionnelle et digne en français ; le présent « parle » communique la parole divine proclamée.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: À la mort, ceux qui sont pour la mort
  rationale: Cette formulation garde la répétition abrupte et la répartition inexpliquée du texte hébreu, sans ajouter « destinés » ou « voués ».
- source_word: חֶרֶב
  choice: épée
  rationale: Le terme concret évoque la mort violente, notamment par la guerre ; « épée » préserve l’image prophétique au lieu de l’expliciter en « guerre ».
- source_word: רָעָב
  choice: famine
  rationale: Le mot désigne ici une calamité collective et une catégorie de jugement, non la simple faim individuelle.
- source_word: שְׁבִי / שֶּׁבִי
  choice: captivité
  rationale: « Captivité » reproduit le parallélisme des quatre sorts ; « exil » demeure une possibilité contextuelle signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. La translittération « Yahweh » le distingue d’un titre et suit la couche de consultation fournie.
- issue: Ordre et portée de la formule répétée du jugement
  choice: À la mort, ceux qui sont pour la mort ; à l’épée, ceux qui sont pour l’épée…
  alternative: Ceux qui sont destinés à mourir mourront ; ceux qui sont destinés à l’épée périront par l’épée…
  rationale: Le texte hébreu reste elliptique et ne précise ni nomination préalable ni verbe d’accomplissement. La traduction conserve donc sa cadence sévère et son ambiguïté au lieu d’ajouter « destinés », « voués » ou « périront ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le déplacement des compléments (« À la mort… ») conserve l’ordre et la cadence de l’hébreu tout en restant intelligible. La répétition volontaire n’est pas lissée.
