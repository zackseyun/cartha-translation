source:
  edition: WLC
  text: חֵילְ/ךָ֧ וְ/אוֹצְרוֹתֶ֛י/ךָ לָ/בַ֥ז אֶתֵּ֖ן לֹ֣א בִ/מְחִ֑יר וּ/בְ/כָל חַטֹּאותֶ֖י/ךָ וּ/בְ/כָל גְּבוּלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/013.yaml
  text: Your wealth and your treasures I will give as plunder[a], without price, because of all your sins[b], throughout all your territory.
translation:
  language: fr
  text: Tes richesses et tes trésors, je les livrerai au pillage, sans paiement[a], à cause de tous tes péchés[b], dans l’ensemble de ton territoire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pas pour un prix », c’est-à-dire sans paiement ni compensation.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « avec tous tes péchés et dans toutes tes frontières ». Ici, la première expression est comprise comme indiquant la cause, et la seconde l’étendue du jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילְךָ
  choice: tes richesses
  rationale: חַיִל peut désigner la force, une armée ou des ressources matérielles. Son parallélisme avec « tes trésors » et le contexte de confiscation favorisent ici le sens économique.
- source_word: וְאוֹצְרוֹתֶיךָ
  choice: et tes trésors
  rationale: Le terme désigne des biens mis en réserve ou les lieux où ils sont conservés. « Trésors » nomme naturellement ici les biens livrés au pillage.
- source_word: לָבַז
  choice: au pillage
  rationale: Avec נתן, cette expression signifie couramment livrer quelque chose comme butin. « Livrer au pillage » est idiomatique et conserve la force de l’annonce.
- source_word: אֶתֵּן
  choice: je les livrerai
  rationale: L’imparfait hébreu à la première personne annonce l’action à venir. « Livrerai » rend mieux que le simple « donnerai » l’idée de remise aux pillards exprimée par le complément.
- source_word: לֹא בִמְחִיר
  choice: sans contrepartie
  rationale: Littéralement « pas pour un prix ». Dans ce contexte, les biens sont abandonnés sans paiement ni compensation.
- source_word: וּבְכָל חַטֹּאותֶיךָ
  choice: à cause de tous tes péchés
  rationale: Dans cette annonce de jugement, la préposition ב peut avoir une valeur causale. Cette formulation exprime clairement le motif de la perte, tout en signalant en note la formulation hébraïque plus littérale.
- source_word: וּבְכָל גְּבוּלֶיךָ
  choice: sur tout ton territoire
  rationale: גְּבוּל peut désigner une frontière, des limites ou le territoire qu’elles délimitent. Ici, l’expression indique l’étendue géographique complète du jugement.
theological_decisions:
- issue: Valeur des groupes prépositionnels finaux dans l’annonce de jugement
  choice: La perte des richesses survient à cause des péchés et s’étend à tout le territoire.
  alternative: 'Traduire plus littéralement : « et avec tous tes péchés, et dans toutes tes frontières », sans expliciter le lien causal.'
  rationale: Le contexte d’oracle de jugement permet de comprendre le premier ב comme causal et le second comme locatif ou distributif. La traduction rend ce rapport intelligible sans ajouter de contenu doctrinal, tandis que la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier suit les formes hébraïques de deuxième personne du singulier. « Livrer au pillage » restitue naturellement l’expression hébraïque, et « sur tout ton territoire » évite le calque peu idiomatique « dans toutes tes frontières ».
