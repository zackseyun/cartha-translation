  terminology: « Richesses », « trésors » et « livrer au pillage » sont des choix justes. Le tutoiement singulier correspond à la morphologie hébraïque. La note doit signaler que le lien causal est une interprétation contextuelle de la préposition, non une explicitation lexicalement obligatoire.
