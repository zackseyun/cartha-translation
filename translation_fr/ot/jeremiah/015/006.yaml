  text: אַ֣תְּ נָטַ֥שְׁתְּ אֹתִ֛/י נְאֻם יְהוָ֖ה אָח֣וֹר תֵּלֵ֑כִי וָ/אַ֨ט אֶת יָדִ֤/י עָלַ֨יִ/ךְ֙ וָֽ/אַשְׁחִיתֵ֔/ךְ נִלְאֵ֖יתִי הִנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/006.yaml
  text: You have forsaken me[a], declares Yahweh; you keep going backward. So I have stretched out my hand against you and destroyed you[b]; I am weary of relenting.
translation:
  language: fr
  text: « Tu m’as abandonné, déclare Yahweh ; tu vas sans cesse en arrière[a]. J’ai donc étendu ma main contre toi et je t’ai détruite. Je suis las de me raviser[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en arrière tu vas ». L’image du cheminement en arrière exprime ici un éloignement persistant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de renoncer au châtiment » ou « de revenir sur un jugement annoncé ». Le verbe hébreu peut désigner le fait de se raviser à l’égard d’un jugement.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתְּ
  choice: tu m’as abandonné
  rationale: Le verbe exprime l’abandon ou le délaissement. « Abandonné » restitue naturellement en français la force relationnelle et accusatrice du propos.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique est rendue dans un français actuel et solennel, tandis que le nom divin יהוה est translittéré « Yahweh ».
- source_word: אָחוֹר תֵּלֵכִי
  choice: tu continues à reculer
  rationale: Littéralement, « en arrière tu vas ». La formulation conserve l’image du déplacement en arrière et la valeur continue ou caractéristique de l’imparfait.
- source_word: וָאַט אֶת־יָדִי עָלַיִךְ
  choice: J’ai donc étendu ma main contre toi
  rationale: « Étendre la main contre » conserve l’image hébraïque d’une intervention hostile. « Donc » explicite sobrement le lien de conséquence indiqué par le contexte.
- source_word: וָאַשְׁחִיתֵךְ
  choice: je t’ai détruite
  rationale: Le hifil de שׁחת exprime ici la destruction ou la ruine. L’accord féminin respecte la forme hébraïque de l’adresse.
- source_word: נִלְאֵיתִי הִנָּחֵם
  choice: Je suis las de revenir sur ma décision
  rationale: לאה marque la lassitude. Dans ce contexte de jugement, נחם désigne le fait de revenir sur une mesure annoncée ou d’y renoncer, sans impliquer une repentance morale.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom propre présent dans le texte hébreu au lieu de lui substituer un titre.
- issue: Sens de הִנָּחֵם appliqué à Dieu
  choice: revenir sur ma décision
  alternative: renoncer au châtiment / me raviser
  rationale: Ce choix exprime le retrait d’un jugement annoncé sans suggérer une faute morale en Dieu. La note maintient l’éventail sémantique du verbe et la tension du passage.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement et les accords féminins reproduisent l’adresse hébraïque à une entité féminine, vraisemblablement Juda ou Jérusalem. La métaphore de la main étendue et celle du recul sont conservées.
