base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/021.yaml
  text: And I will deliver you from the hand of evil men[c][b][a], and I will redeem you from the grasp of the ruthless.
translation:
  language: fr
  text: Je te délivrerai de la main des méchants[a], et je te libérerai de l’emprise des violents[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des hommes mauvais ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des hommes impitoyables ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: Je te délivrerai
  rationale: Le hiphil de נצל exprime l’action d’arracher quelqu’un au danger, de le délivrer ou de le sauver. « Délivrer » convient au registre prophétique et à la construction avec מִן.
- source_word: מִיַּד
  choice: de la main de
  rationale: יָד signifie littéralement « main » et désigne ici, par métonymie, le pouvoir ou la domination. L’image hébraïque reste naturelle en français.
- source_word: רָעִים
  choice: des hommes mauvais
  rationale: L’adjectif masculin pluriel est employé comme substantif et désigne des adversaires humains moralement mauvais. « Hommes mauvais » conserve cette référence explicite sans ajouter l’idée plus précise de culpabilité que pourrait suggérer « méchants ».
- source_word: וּפְדִתִיךָ
  choice: et je te libérerai
  rationale: פדה signifie délivrer, libérer ou racheter quelqu’un soumis à une puissance. Dans ce parallélisme de sauvetage, « libérer » est naturel et évite de suggérer explicitement le paiement d’un prix, absent du contexte immédiat.
- source_word: מִכַּף
  choice: de l’emprise de
  rationale: כַּף désigne littéralement la paume ou la main, puis la prise exercée sur quelqu’un. « Emprise » restitue clairement l’idée de domination hostile tout en variant naturellement par rapport à « main ».
- source_word: עָרִצִים
  choice: des violents
  rationale: עָרִיץ qualifie des personnes redoutables, brutales ou oppressives. « Violents » rend directement leur caractère menaçant sans les définir nécessairement comme des dirigeants politiques.
theological_decisions:
- issue: Portée du verbe פדה
  choice: je te libérerai
  alternative: je te rachèterai
  rationale: Le verbe peut porter une dimension de rachat, mais le contexte immédiat met surtout en parallèle deux actes de délivrance. « Libérer » préserve ce sens contextuel; la possibilité de « racheter » est signalée en note.
- issue: Référence humaine du masculin pluriel רָעִים
  choice: des hommes mauvais
  alternative: des méchants
  rationale: Le masculin pluriel substantivé renvoie ici aux adversaires humains de Jérémie. La formulation retenue maintient cette référence sans neutraliser le texte ni lui attribuer une catégorie plus étroite.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme hébreu est conservé, de même que l’image de la « main » dans le premier membre; « emprise » explicite naturellement l’image distincte de la paume ou prise dans le second.
