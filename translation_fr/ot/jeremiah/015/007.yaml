  text: וָ/אֶזְרֵ֥/ם בְּ/מִזְרֶ֖ה בְּ/שַׁעֲרֵ֣י הָ/אָ֑רֶץ שִׁכַּ֤לְתִּי אִבַּ֨דְתִּי֙ אֶת עַמִּ֔/י מִ/דַּרְכֵי/הֶ֖ם לוֹא שָֽׁבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/007.yaml
  text: I winnowed them with a winnowing fork at the gates of the land[a]; I bereaved, I destroyed my people[b]; they did not turn back from their ways.
translation:
  language: fr
  text: Je les ai vannés avec une fourche à vanner aux portes du pays[a] ; j’ai privé mon peuple de ses enfants, je l’ai fait périr ; ils ne se sont pas détournés de leurs voies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux portes de la terre ». Le mot hébreu peut désigner le pays ou la terre ; ici, le contexte du jugement de Juda favorise « pays ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils ne sont pas revenus de leurs voies ». Le verbe hébreu signifie « revenir » ou « faire demi-tour » et peut aussi exprimer, dans un contexte prophétique, l’idée de repentance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶזְרֵם
  choice: Je les ai vannés
  rationale: Le verbe זרה évoque ici le vannage ou la dispersion du grain. « Vannés » conserve l’image agricole, que précise l’instrument mentionné ensuite.
- source_word: בְּמִזְרֶה
  choice: avec une fourche à vanner
  rationale: מִזְרֶה désigne un instrument servant au vannage. Cette formulation concrète et compréhensible préserve l’image du texte hébreu.
- source_word: בְּשַׁעֲרֵי הָאָרֶץ
  choice: aux portes du pays
  rationale: « Aux portes » rend naturellement la valeur locative. Dans le contexte du jugement de Juda, « pays » convient mieux que « terre », sans exclure l’autre sens possible de אֶרֶץ.
- source_word: שִׁכַּלְתִּי
  choice: j’ai privé mon peuple de ses enfants
  rationale: Le verbe signifie causer la perte d’enfants ou rendre sans enfants. L’objet « mon peuple », exprimé dans la proposition suivante, est repris pour produire un français naturel sans atténuer le jugement.
- source_word: אִבַּדְתִּי אֶת־עַמִּי
  choice: je l’ai fait périr
  rationale: La forme causative de אבד exprime le fait de faire périr ou de détruire. Le pronom reprend « mon peuple » et évite une répétition lourde en français.
- source_word: מִדַּרְכֵיהֶם
  choice: de leurs voies
  rationale: « Voies » conserve l’image hébraïque tout en évoquant clairement leur conduite ou leur manière de vivre.
- source_word: לֹא שָׁבוּ
  choice: ils ne sont pas revenus
  rationale: שׁוּב signifie revenir ou faire demi-tour et peut, en contexte prophétique, évoquer la repentance. « Ne sont pas revenus » préserve cette amplitude sémantique.
theological_decisions:
- issue: Faut-il rendre שׁוּב par un terme explicitement pénitentiel ?
  choice: ils ne sont pas revenus de leurs voies
  alternative: ils ne se sont pas détournés de leur conduite / ils ne se sont pas repentis de leurs voies
  rationale: L’hébreu emploie le verbe général « revenir », souvent chargé d’une portée morale dans les prophètes. La traduction retenue maintient l’image et la tension théologique sans la réduire à un terme doctrinal technique.
translation_notes:
  register: Français moderne, digne et accessible. L’image agricole du vannage est conservée, tandis que les deux verbes de jugement restent nettement distincts. Les points-virgules reproduisent la progression solennelle des propositions sans surcharger la phrase.
