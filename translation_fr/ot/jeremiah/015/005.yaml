  text: כִּ֠י מִֽי יַחְמֹ֤ל עָלַ֨יִ/ךְ֙ יְר֣וּשָׁלִַ֔ם וּ/מִ֖י יָנ֣וּד לָ֑/ךְ וּ/מִ֣י יָס֔וּר לִ/שְׁאֹ֥ל לְ/שָׁלֹ֖ם לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/005.yaml
  text: For who will have compassion on you[a], Jerusalem? And who will mourn for you? And who will turn aside to ask about your welfare?
translation:
  language: fr
  text: Car qui aura compassion de toi[a], Jérusalem ? Et qui te plaindra ? Et qui fera un détour pour prendre de tes nouvelles ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aura pitié de toi… te témoignera de la sympathie… s’arrêtera pour s’enquérir de ton bien-être ».'
    reason: Alternatives lexicales possibles pour חמל, נוד et l’expression שאל לשלום.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification du jugement énoncé auparavant et conserve naturellement sa valeur explicative.
- source_word: מִי
  choice: qui
  rationale: Le pronom interrogatif est répété trois fois dans l’hébreu pour produire une série de questions rhétoriques.
- source_word: יַחְמֹל עָלַיִךְ
  choice: aura compassion de toi
  rationale: חמל avec על exprime ici la pitié ou la compassion envers Jérusalem dans sa détresse, plutôt que l’idée de l’épargner.
- source_word: יָנוּד לָךְ
  choice: te plaindra
  rationale: נוד peut désigner un geste ou une manifestation de commisération. « Te plaindra » exprime clairement cette sympathie douloureuse sans imposer le geste précis, qui reste incertain.
- source_word: יָסוּר
  choice: fera un détour
  rationale: סור évoque le fait de se détourner de son chemin ; dans ce contexte, quelqu’un interrompt sa route afin de s’enquérir de Jérusalem.
- source_word: לִשְׁאֹל לְשָׁלֹם לָךְ
  choice: pour prendre de tes nouvelles
  rationale: L’expression idiomatique signifie s’enquérir de l’état ou du bien-être de quelqu’un. « Prendre de tes nouvelles » est naturel en français moderne et garde la dimension relationnelle de la formule.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Les trois interrogations et l’adresse directe à Jérusalem sont conservées. « Faire un détour » maintient l’image du passant qui quitte son chemin, tandis que « prendre de tes nouvelles » rend idiomatiquement la demande concernant le shalom de Jérusalem.
