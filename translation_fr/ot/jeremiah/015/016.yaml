source:
  edition: WLC
  text: נִמְצְא֤וּ דְבָרֶ֨י/ךָ֙ וָ/אֹ֣כְלֵ֔/ם וַ/יְהִ֤י דברי/ך לִ֔/י לְ/שָׂשׂ֖וֹן וּ/לְ/שִׂמְחַ֣ת לְבָבִ֑/י כִּֽי נִקְרָ֤א שִׁמְ/ךָ֙ עָלַ֔/י יְהוָ֖ה אֱלֹהֵ֥י צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/016.yaml
  text: Your words were found[a], and I ate them, and your words became for me a joy and the delight of my heart, for your name is called over me, O Yahweh, God of hosts.
translation:
  language: fr
  text: Tes paroles ont été trouvées, et je les ai mangées ; tes paroles ont été pour moi une joie et l’allégresse de mon cœur, car ton nom est invoqué sur moi[a], Yahweh, Dieu des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement dit, de façon plus idiomatique : « je porte ton nom ».'
    reason: L’expression hébraïque dit littéralement que le nom de Yahweh est appelé ou invoqué sur le locuteur ; elle exprime son identification à ce nom, sans que le texte principal réduise l’image à cette explicitation.
lexical_decisions:
- source_word: נִמְצְאוּ
  choice: ont été trouvées
  rationale: Le niphal passif de מצא est conservé sans transformer implicitement le prophète en sujet actif. Cette formulation garde aussi l’idée que les paroles se sont présentées à sa rencontre, même si le français demeure volontairement aussi marqué que l’hébreu.
- source_word: דְבָרֶיךָ
  choice: tes paroles
  rationale: Le pluriel hébreu est maintenu dans ses deux occurrences.
- source_word: וָאֹכְלֵם
  choice: je les ai mangées
  rationale: La métaphore concrète de l’ingestion est conservée, sans l’intensifier par « dévorées » ni l’expliquer par une paraphrase.
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחַת לְבָבִי
  choice: ma joie et l’allégresse de mon cœur
  rationale: Les deux termes proches sont distingués naturellement en français tout en préservant leur parallélisme et la dimension intérieure du second.
- source_word: נִקְרָא שִׁמְךָ עָלַי
  choice: ton nom est invoqué sur moi
  rationale: La voix passive et la préposition spatiale עַל sont conservées. « Invoqué » rend en français le fait de prononcer ou d’appeler le nom sur quelqu’un, tandis qu’une note explicite le sens d’appartenance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Dieu des armées
  rationale: Cette traduction garde l’image et la pluralité de צְבָאוֹת sans limiter explicitement ces armées aux seules réalités terrestres ou célestes.
theological_decisions:
- issue: L’expression d’appartenance נִקְרָא שִׁמְךָ עָלַי
  choice: ton nom est invoqué sur moi
  alternative: je suis appelé de ton nom / je porte ton nom
  rationale: Le texte principal préserve l’image hébraïque d’un nom prononcé sur une personne, qui signale son identification et son appartenance, sans réduire cette image à une seule explicitation.
- issue: Le nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La traduction conserve le nom propre présent dans le texte source au lieu de lui substituer un titre.
translation_notes:
  register: Français international actuel, digne et lisible. Le rythme parallèle et la métaphore vive de l’ingestion sont conservés. La formulation « ont été trouvées » reste légèrement marquée afin de respecter la voix passive du texte hébreu, et « invoqué sur moi » préserve délibérément son idiome théologique.
