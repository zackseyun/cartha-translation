  revision_rationale: La révision remplace une tournure causative par « ont été pour moi », qui correspond plus étroitement au prédicat hébreu tout en restant naturelle. La note est simplifiée afin d’éliminer une formulation française non idiomatique et de conserver une seule équivalence claire. Le passif initial et l’idiome « invoqué sur moi » sont maintenus pour préserver la forme et la tension sémantique du texte source.
