  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת כָּ֣כָה אֶשְׁבֹּ֞ר אֶת הָ/עָ֤ם הַ/זֶּה֙ וְ/אֶת הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֤ר יִשְׁבֹּר֙ אֶת כְּלִ֣י הַ/יּוֹצֵ֔ר אֲשֶׁ֛ר לֹֽא יוּכַ֥ל לְ/הֵרָפֵ֖ה ע֑וֹד וּ/בְ/תֹ֣פֶת יִקְבְּר֔וּ מֵ/אֵ֥ין מָק֖וֹם לִ/קְבּֽוֹר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/011.yaml
  text: 'And you shall say to them[a], ‘Thus says Yahweh of hosts: In this way I will break this people and this city, as one breaks a potter’s vessel, which cannot be repaired again[b]; and in Topheth they will bury because there is no place else to bury.’'
translation:
  language: fr
  text: 'Tu leur diras : « Ainsi parle Yahweh des armées : C’est ainsi que je briserai ce peuple et cette ville, comme on brise un objet façonné par un potier[a], qui ne peut plus être réparé[b]. On enterrera à Topheth, faute de place pour enterrer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un terme général pouvant désigner divers objets ou récipients fabriqués par un potier, et non nécessairement une jarre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui ne peut plus être guéri »; pour un objet brisé, le sens est « réparé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Tu leur diras
  rationale: Le futur français rend naturellement le qatal à valeur injonctive dans la suite des ordres adressés à Jérémie.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique française consacrée, au présent, qui reste proche de l’hébreu tout en étant naturelle.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, et « des armées » rend צְבָאוֹת de façon compréhensible sans préciser indûment s’il s’agit d’armées célestes ou terrestres.
- source_word: כָּכָה
  choice: C’est ainsi que
  rationale: Cette tournure renvoie au geste symbolique consistant à briser l’objet et distingue cet adverbe du כֹּה qui introduit la parole divine.
- source_word: אֶשְׁבֹּר ... יִשְׁבֹּר
  choice: je briserai ... on brise
  rationale: La répétition de « briser » conserve le lien verbal et l’image centrale du texte hébreu.
- source_word: כְּלִי הַיּוֹצֵר
  choice: un objet façonné par un potier
  rationale: כְּלִי est un terme général désignant un objet ou récipient; « objet » évite de le réduire sans preuve à une jarre précise, tandis que « façonné par un potier » exprime naturellement la relation hébraïque.
- source_word: לֹא יוּכַל לְהֵרָפֵה עוֹד
  choice: qui ne peut plus être réparé
  rationale: רפא signifie littéralement « guérir », mais appliqué à un objet brisé, « réparer » est l’équivalent idiomatique; « ne ... plus » rend עוֹד.
- source_word: וּבְתֹפֶת יִקְבְּרוּ
  choice: On enterrera à Topheth
  rationale: Le pronom indéfini « on » conserve la forme active et l’objet implicite du verbe hébreu. « À » convient naturellement en français à ce nom de lieu.
- source_word: מֵאֵין מָקוֹם לִקְבּוֹר
  choice: faute de place pour enterrer
  rationale: Cette formulation concise restitue la valeur causale de l’expression et ne fournit pas un complément d’objet que l’hébreu laisse implicite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération le distingue du titre אֲדֹנָי et préserve sa fonction dans la formule prophétique.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » conserve l’image et l’ambiguïté du pluriel hébreu, sans transformer le titre en une interprétation cosmique plus large.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve le parallélisme de « briser », l’objet implicite de « enterrer » et la différence entre la formule introductive « Ainsi parle » et le renvoi au geste symbolique « C’est ainsi que ».
