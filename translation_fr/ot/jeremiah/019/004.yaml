source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָבֻ֗/נִי וַֽ/יְנַכְּר֞וּ אֶת הַ/מָּק֤וֹם הַ/זֶּה֙ וַ/יְקַטְּרוּ ב/וֹ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁ֧ר לֹֽא יְדָע֛וּ/ם הֵ֥מָּה וַ/אֲבֽוֹתֵי/הֶ֖ם וּ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מָֽלְא֛וּ אֶת הַ/מָּק֥וֹם הַ/זֶּ֖ה דַּ֥ם נְקִיִּֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/004.yaml
  text: Because they have forsaken me and made this place unrecognizable[a], and have burned incense in it to other gods whom neither they nor their fathers nor the kings of Judah had known, and they have filled this place with the blood of innocents[b],
translation:
  language: fr
  text: Parce qu’ils m’ont abandonné, qu’ils ont traité ce lieu comme un lieu étranger[a], qu’ils y ont brûlé de l’encens à d’autres dieux, que ni eux, ni leurs ancêtres, ni les rois de Juda n’avaient connus, et qu’ils ont rempli ce lieu du sang d’innocents[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont profané ce lieu ». Littéralement, le verbe évoque le fait de rendre étranger ou de traiter comme étranger.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « du sang d’innocents » ; on peut aussi traduire : « de sang innocent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: Introduit naturellement en français la cause du jugement annoncé.
- source_word: עֲזָבֻנִי
  choice: ils m’ont abandonné
  rationale: « Abandonner » exprime clairement la rupture relationnelle et cultuelle portée par עזב, dans un français actuel et digne.
- source_word: וַיְנַכְּרוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: ils ont rendu ce lieu étranger
  rationale: Conserve l’image centrale du piel de נכר, qui évoque le fait de rendre étranger ou méconnaissable, sans substituer d’emblée l’interprétation « profaner ».
- source_word: וַיְקַטְּרוּ בוֹ
  choice: ils y ont brûlé de l’encens
  rationale: קטר désigne ici l’acte cultuel consistant à faire brûler de l’encens ou une offrande fumigène; cette formulation est précise et naturelle.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: pour d’autres dieux
  rationale: Rend directement l’expression hébraïque sans ajouter la nuance « étrangers », absente de l’adjectif עצמו.
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: que ... n’avaient connus
  rationale: Le plus-que-parfait marque l’absence de connaissance ou de reconnaissance antérieure de ces dieux; l’accord au masculin pluriel convient à l’antécédent « dieux ».
- source_word: הֵמָּה וַאֲבוֹתֵיהֶם וּמַלְכֵי יְהוּדָה
  choice: ni eux, ni leurs ancêtres, ni les rois de Juda
  rationale: La triple construction avec « ni » distribue clairement la négation sur chacun des groupes et traduit אבות par le terme inclusif et contemporain « ancêtres ».
- source_word: וּמָלְאוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: ils ont rempli ce lieu
  rationale: Le passé composé convient à l’accusation portant sur des actes accomplis dont les effets motivent le jugement.
- source_word: דַּם נְקִיִּם
  choice: du sang d’innocents
  rationale: Préserve la référence personnelle du pluriel hébreu, plutôt que de l’atténuer dans l’expression plus idiomatique « sang innocent ».
theological_decisions:
- issue: Sens de נכר appliqué à « ce lieu »
  choice: rendu ce lieu étranger
  alternative: profané ce lieu; traité ce lieu comme un lieu étranger; rendu ce lieu méconnaissable
  rationale: La traduction retient l’image de l’étrangeté ou de l’aliénation portée par le verbe, en lien avec le culte d’autres dieux, tout en signalant en note les principales possibilités contextuelles sans trancher abusivement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase reste ouverte par une virgule, puisque le verset expose la cause du jugement et se poursuit syntaxiquement dans le contexte. La répétition de « ce lieu » est conservée pour respecter l’insistance du texte hébreu.
