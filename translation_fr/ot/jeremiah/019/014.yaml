id: JER.19.14
reference: Jeremiah 19:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֤א יִרְמְיָ֨הוּ֙ מֵֽ/הַ/תֹּ֔פֶת אֲשֶׁ֨ר שְׁלָח֧/וֹ יְהוָ֛ה שָׁ֖ם לְ/הִנָּבֵ֑א וַֽ/יַּעֲמֹד֙ בַּ/חֲצַ֣ר בֵּית יְהוָ֔ה וַ/יֹּ֖אמֶר אֶל כָּל הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/014.yaml
  text: Then Jeremiah came from Topheth[a], where Yahweh had sent him to prophesy, and he stood in the court of the house of Yahweh and said to all the people,
translation:
  language: fr
  text: 'Jérémie revint alors de Topheth[a], où Yahweh l’avait envoyé prophétiser. Il se tint dans la cour de la maison de Yahweh et dit à tout le peuple :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Topheth est le lieu associé au geste prophétique et à l’oracle précédents de Jérémie dans ce chapitre.
    reason: Renvoi au contexte immédiat du chapitre.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: revint
  rationale: Le verbe בוא peut signifier « venir » ou « aller » selon le point de vue. Le contexte indique que Jérémie revient de Topheth vers l’enceinte du temple; « revint » rend naturellement ce mouvement en français.
- source_word: מֵהַתֹּפֶת
  choice: de Topheth
  rationale: Topheth est un nom de lieu; l’article hébreu est naturellement omis devant ce nom propre en français.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה שָׁם
  choice: où Yahweh l’avait envoyé
  rationale: Le relatif et l’adverbe שָׁם désignent Topheth comme le lieu de la mission. Le plus-que-parfait marque clairement l’antériorité de l’envoi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme explicite du texte hébreu.
- source_word: לְהִנָּבֵא
  choice: prophétiser
  rationale: Le verbe français courant « prophétiser » rend directement l’infinitif niphal de נבא sans ajouter d’explication.
- source_word: וַיַּעֲמֹד
  choice: il se tint
  rationale: « Se tenir » exprime naturellement la position debout dans un registre narratif digne, sans ajouter l’insistance de « prendre position ».
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: dans la cour de la maison de Yahweh
  rationale: « Cour » rend חצר, tandis que « maison de Yahweh » conserve la chaîne construite hébraïque et son appellation cultuelle.
- source_word: וַיֹּאמֶר אֶל כָּל הָעָם
  choice: et dit à tout le peuple
  rationale: Cette formulation rend directement אמר et préserve l’étendue de כָּל הָעָם sans préciser davantage l’auditoire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie directement le tétragramme; la translittération préserve le nom propre et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation finale par deux-points signale que les paroles de Jérémie commencent au verset suivant.
