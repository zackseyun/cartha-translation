source:
  edition: WLC
  text: וְ/יָצָ֨אתָ֙ אֶל גֵּ֣יא בֶן הִנֹּ֔ם אֲשֶׁ֕ר פֶּ֖תַח שַׁ֣עַר ה/חרסות וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דְּבָרִ֖ים אֲשֶׁר אֲדַבֵּ֥ר אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/002.yaml
  text: and go out to the Valley of Ben Hinnom[a], which is at the entrance of the Potsherd Gate, and proclaim there the words that I will speak to you.
translation:
  language: fr
  text: Sors en direction de la vallée de Ben-Hinnom, qui se trouve à l’entrée de la porte des Tessons[a], et proclame là les paroles que je te dirai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu de cette porte est incertain. On peut aussi traduire « porte de la Poterie » ou conserver plus formellement le nom « porte de Harsith ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָאתָ
  choice: Va
  rationale: Dans cette suite d’instructions, la forme verbale a valeur d’ordre. « Va » rend naturellement cette force en français ; la destination introduite par אֶל exprime ici le déplacement vers la vallée.
- source_word: גֵּיא בֶן הִנֹּם
  choice: la vallée de Ben-Hinnom
  rationale: Le nom de lieu est conservé sans recourir à « géhenne », qui introduirait des associations postérieures absentes du passage. Le trait d’union présente naturellement Ben-Hinnom comme nom propre en français.
- source_word: אֲשֶׁר פֶּתַח שַׁעַר הַחַרְסוּת
  choice: à l’entrée de la porte des Tessons[a]
  rationale: פֶּתַח שַׁעַר désigne l’entrée de la porte. « Porte des Tessons » exprime l’interprétation probable du nom hébreu en lien avec la poterie, tout en signalant son incertitude par une note.
- source_word: וְקָרָאתָ
  choice: et proclame
  rationale: Dans un contexte prophétique, קרא désigne une déclaration publique. « Proclame » en restitue mieux la portée que le simple « dis ».
- source_word: שָׁם
  choice: là
  rationale: Équivalent direct de l’adverbe locatif, renvoyant au lieu où Jérémie doit se rendre.
- source_word: אֶת־הַדְּבָרִים
  choice: les paroles
  rationale: « Paroles » conserve le sens concret de דְּבָרִים et son lien avec ce que Dieu va dire, sans le réduire à l’idée plus générale de « message ».
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: que je te dirai
  rationale: Cette formulation française naturelle exprime fidèlement la parole future adressée à Jérémie. Répéter « parler » après « paroles » serait plus lourd.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’impératif direct restitue la suite d’ordres, tandis que « proclame » conserve la solennité de la mission prophétique. Le nom Ben-Hinnom est maintenu comme toponyme.
