  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מבי אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל כָּל עָרֶ֔י/הָ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלֶ֑י/הָ כִּ֤י הִקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֖י שְׁמ֥וֹעַ אֶת דְּבָרָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/015.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Behold, I am bringing on this city and on all its towns all the disaster that I have spoken against it[c][b], because they have stiffened their neck so as not to hear my words.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées, le Dieu d’Israël : « Voici que je fais venir sur cette ville et sur toutes ses villes[a] tout le malheur[b] que j’ai annoncé contre elle, parce qu’ils ont raidi la nuque[c] pour ne pas écouter mes paroles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ses localités ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toute la calamité » ; ici, le mot hébreu désigne le désastre amené comme jugement, non le mal moral.
    reason: lexical_alternative
  - marker: c
    text: Image hébraïque exprimant un refus obstiné d’écouter et d’obéir.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré « Yahweh ». « Des armées » rend צְבָאוֹת sans limiter le titre aux seules armées humaines et conserve la solennité du titre prophétique.
- source_word: הִנְנִי מֵבִיא
  choice: voici que je fais venir
  rationale: הִנְנִי souligne l’imminence et la solennité de l’action divine; le participe causatif de בוא est rendu par « je fais venir ».
- source_word: כָּל עָרֶיהָ
  choice: toutes ses villes
  rationale: La formulation conserve le suffixe possessif hébreu et la portée possible de עָרִים, qui peut désigner des villes ou des localités rattachées à la ville principale.
- source_word: כָּל הָרָעָה
  choice: tout le malheur
  rationale: Dans ce contexte de jugement, רָעָה désigne le malheur ou la calamité qui survient, et non le mal moral.
- source_word: דִּבַּרְתִּי עָלֶיהָ
  choice: que j’ai annoncé contre elle
  rationale: « Annoncé contre elle » exprime naturellement en français la parole prophétique de jugement, tout en gardant la ville comme antécédent singulier.
- source_word: הִקְשׁוּ אֶת עָרְפָּם
  choice: ils ont raidi leur nuque
  rationale: La traduction conserve l’image corporelle hébraïque de l’obstination plutôt que de la remplacer entièrement par son interprétation.
- source_word: לְבִלְתִּי שְׁמוֹעַ אֶת דְּבָרָי
  choice: pour ne pas écouter mes paroles
  rationale: Cette formulation reproduit clairement le rapport de but ou de résultat exprimé par l’hébreu et rend שׁמע par l’idée d’une écoute attentive et obéissante.
theological_decisions:
- issue: Rendu du nom et du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le Seigneur de l’univers
  rationale: La traduction garde le nom personnel divin présent dans le texte et conserve l’image des armées, sans substituer un titre ni imposer une interprétation cosmologique plus large.
- issue: Nature de רָעָה dans l’acte de jugement
  choice: malheur
  alternative: mal
  rationale: Le contexte décrit une calamité annoncée et amenée sur la ville. « Malheur » évite de faire dire que Dieu apporte le mal moral, tout en maintenant la dimension judiciaire du passage.
translation_notes:
  register: Français international moderne, sobre et solennel. La tournure prophétique « Ainsi parle » et l’expression « voici que » préservent la gravité de l’énoncé, tandis que la syntaxe reste accessible. L’idiome de la nuque raidie est maintenu dans le texte et expliqué en note.
