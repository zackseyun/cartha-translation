base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/005.yaml
  text: They have built the high places of Baal to burn their sons in the fire as burnt offerings to Baal—something I did not command or speak[a], nor did it arise in my heart.
translation:
  language: fr
  text: Ils ont construit les hauts lieux de Baal pour brûler leurs fils dans le feu en holocaustes à Baal — ce que je n’ai ni ordonné ni dit[a], et qui ne m’est jamais venu au cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que je n’ai pas mentionné ». Littéralement, la suite dit : « qui n’est pas montée sur mon cœur ».'
    reason: Signale une nuance possible de דִבַּרְתִּי et donne le calque de l’idiome hébreu, tandis que le texte principal conserve l’image du cœur dans un français plus naturel.
lexical_decisions:
- source_word: וּבָנוּ
  choice: Ils ont construit
  rationale: Le qatal qal, dans cette accusation prophétique, désigne une action accomplie dont les effets demeurent; le passé composé convient naturellement en français.
- source_word: בָּמוֹת
  choice: les hauts lieux
  rationale: Terme français traditionnel et encore intelligible pour des lieux de culte, souvent idolâtres; il conserve la désignation cultuelle sans la réduire à de simples sanctuaires.
- source_word: הַבַּעַל / לַבָּעַל
  choice: Baal / à Baal
  rationale: Baal fonctionne ici comme nom propre; l’article hébreu du premier emploi ne se transpose pas naturellement en français.
- source_word: לִשְׂרֹף
  choice: pour brûler
  rationale: L’infinitif construit avec ל exprime le but de l’édification des hauts lieux.
- source_word: בְּנֵיהֶם
  choice: leurs fils
  rationale: Le texte dit précisément « leurs fils »; cette spécificité est conservée plutôt que généralisée en « enfants ».
- source_word: בָּאֵשׁ
  choice: dans le feu
  rationale: Rend naturellement la préposition ב dans ce contexte sacrificiel.
- source_word: עֹלוֹת
  choice: en holocaustes
  rationale: « Holocaustes » est le terme sacrificiel français précis pour des offrandes entièrement consumées; « en » explicite la fonction prédicative du nom.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: chose que je n’avais ... ordonnée
  rationale: Le relatif reprend toute la pratique décrite. Le plus-que-parfait situe clairement l’absence antérieure de commandement divin par rapport à leur acte.
- source_word: וְלֹא דִבַּרְתִּי
  choice: ni dite
  rationale: Rend sobrement le verbe דבר sans ajouter un complément absent; en français, « ordonnée ni dite » signifie que Dieu ne l’a ni prescrite ni même énoncée.
- source_word: וְלֹא עָלְתָה עַל לִבִּי
  choice: et qui ne m’était pas montée au cœur
  rationale: Calque français compréhensible qui maintient l’image hébraïque de ce qui « monte sur/au cœur », au lieu de la résoudre entièrement en une formulation cognitive comme « venir à l’esprit ».
theological_decisions:
- issue: Expression anthropomorphique concernant la disposition intérieure de Dieu
  choice: qui ne m’était pas montée au cœur
  alternative: qui ne m’était pas venue à l’esprit
  rationale: Le texte hébreu parle du cœur. La traduction conserve cette image et sa tension théologique, sans la transformer en affirmation plus étroite portant uniquement sur la cognition divine.
- issue: Portée de la proposition relative אֲשֶׁר
  choice: « chose » reprend la pratique sacrificielle décrite dans son ensemble
  alternative: faire porter le relatif uniquement sur les holocaustes
  rationale: La syntaxe permet de comprendre la proposition comme une condamnation de tout l’acte décrit; « chose » garde cette portée naturelle sans surdéfinir un antécédent grammatical unique.
translation_notes:
  register: Français international moderne, digne et direct. « Hauts lieux » et « holocaustes » conservent le vocabulaire cultuel précis. La tournure « montée au cœur » est volontairement imagée afin de préserver l’anthropomorphisme hébreu; la note fournit le calque plus strict et une variante lexicale.
