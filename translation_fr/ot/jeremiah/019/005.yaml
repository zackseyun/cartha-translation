revisions:
- from: Ils ont construit les hauts lieux de Baal pour brûler leurs fils dans le feu en holocaustes à Baal — chose que je n’avais ni ordonnée ni dite[a], et qui ne m’était pas montée au cœur.
  to: Ils ont construit les hauts lieux de Baal pour brûler leurs fils dans le feu en holocaustes à Baal — ce que je n’ai ni ordonné ni dit[a], et qui ne m’est jamais venu au cœur.
  rationale: La révision remplace les plus-que-parfaits non requis par des passés composés correspondant mieux aux parfaits hébreux et améliore l’idiome final. Elle préserve la référence au cœur, donc l’expression anthropomorphique et sa portée ouverte, sans imposer l’interprétation plus cognitive de « venir à l’esprit ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’ensemble est fidèle : les hauts lieux voués à Baal, l’immolation des fils, le caractère d’holocaustes, et la triple désaveu divin sont bien rendus. Toutefois, les plus-que-parfaits français (« n’avais... », « m’était... ») introduisent un repérage temporel que les parfaits hébreux négatifs n’imposent pas. Le passé composé rend plus directement l’affirmation divine. L’idiome final doit aussi être formulé de manière plus naturelle en français sans effacer l’image du « cœur ».'
  naturalness: « Qui ne m’était pas montée au cœur » est un calque lourd et peu idiomatique en français moderne. « Qui ne m’est jamais venue au cœur » reste imagé, digne et compréhensible, tout en évitant une formulation qui peut distraire du sens. « Chose que » est possible, mais « ce que » est plus fluide ici.
  terminology: « Hauts lieux », « Baal », « leurs fils » et « holocaustes » sont exacts et appropriés au registre biblique. « Holocaustes » conserve le terme sacrificiel technique; son emploi est clairement déterminé par le contexte cultuel antique. La note doit donner littéralement l’idiome hébreu au présent/perfect français plutôt que reprendre le plus-que-parfait du texte précédent.
  issues:
  - severity: medium
    issue: Temps verbaux français inutilement décalés
    rationale: « Je n’avais ni ordonnée ni dite » et « ne m’était pas montée » situent l’absence de commandement avant un autre passé de référence. Le texte hébreu formule directement le désaveu; « je n’ai ni ordonné ni dit » et « ne m’est jamais venue » sont plus fidèles et plus nets.
  - severity: medium
    issue: Calque peu naturel de l’idiome du cœur
    rationale: « Monter au cœur » n’est pas une tournure française courante dans ce sens. « Venir au cœur » maintient l’image affective/anthropomorphique sans la réduire explicitement à « venir à l’esprit ».
  - severity: low
    issue: Note littérale temporellement incohérente avec la source
    rationale: La note donne « n’était pas montée », alors que l’hébreu emploie un parfait. La forme « n’est pas montée sur mon cœur » présente mieux le calque littéral.
  revised_text: Ils ont construit les hauts lieux de Baal pour brûler leurs fils dans le feu en holocaustes à Baal — ce que je n’ai ni ordonné ni dit[a], et qui ne m’est jamais venu au cœur.
  revised_footnotes:
