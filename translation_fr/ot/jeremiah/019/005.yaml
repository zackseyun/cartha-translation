    text: 'Ou : « ce que je n’ai pas mentionné ». Littéralement, la suite dit : « qui n’est pas montée sur mon cœur ».'
    reason: Signale une nuance possible de דִבַּרְתִּי et donne le calque de l’idiome hébreu, tandis que le texte principal conserve l’image du cœur dans un français plus naturel.
  revision_rationale: La révision remplace les plus-que-parfaits non requis par des passés composés correspondant mieux aux parfaits hébreux et améliore l’idiome final. Elle préserve la référence au cœur, donc l’expression anthropomorphique et sa portée ouverte, sans imposer l’interprétation plus cognitive de « venir à l’esprit ».
