source:
  edition: WLC
  text: וְ/הָי֞וּ בָּתֵּ֣י יְרוּשָׁלִַ֗ם וּ/בָתֵּי֙ מַלְכֵ֣י יְהוּדָ֔ה כִּ/מְק֥וֹם הַ/תֹּ֖פֶת הַ/טְּמֵאִ֑ים לְ/כֹ֣ל הַ/בָּתִּ֗ים אֲשֶׁ֨ר קִטְּר֜וּ עַל גַּגֹּֽתֵי/הֶם֙ לְ/כֹל֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/הַסֵּ֥ךְ נְסָכִ֖ים לֵ/אלֹהִ֥ים אֲחֵרִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/013.yaml
  text: The houses of Jerusalem and the houses of the kings of Judah will become like the unclean place of Topheth—all the houses on whose rooftops they burned incense to all the host of heaven and poured out drink offerings to other gods[a][b].
translation:
  language: fr
  text: 'Les maisons de Jérusalem et celles des rois de Juda deviendront, comme le lieu de Tofeth[a], impures : toutes les maisons sur les toits desquelles on a brûlé de l’encens à toute l’armée du ciel[b] et versé des libations à d’autres dieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se comprendre : « deviendront comme le lieu impur de Tofeth ».'
    reason: ambiguïté syntaxique
  - marker: b
    text: L’expression « armée du ciel » désigne ici les astres auxquels un culte était rendu.
    reason: note culturelle
lexical_decisions:
- source_word: וְהָיוּ
  choice: deviendront
  rationale: Avec la comparaison introduite par כְּ, le verbe היה exprime ici l’entrée dans un nouvel état résultant du jugement, et non une simple existence.
- source_word: בָּתֵּי יְרוּשָׁלִַם וּבָתֵּי מַלְכֵי יְהוּדָה
  choice: Les maisons de Jérusalem et celles des rois de Juda
  rationale: La formulation conserve le nom ordinaire « maisons » et le parallélisme de l’hébreu, sans préciser de manière interprétative « palais ».
- source_word: כִּמְקוֹם הַתֹּפֶת
  choice: comme le lieu de Tofeth
  rationale: Le nom מָקוֹם est rendu explicitement; Tofeth est conservé comme nom de lieu.
- source_word: הַטְּמֵאִים
  choice: impures
  rationale: Le pluriel hébreu s’accorde le plus naturellement avec les maisons. « Impures » préserve la dimension cultuelle et morale du terme sans la réduire à une souillure matérielle.
- source_word: לְכֹל הַבָּתִּים אֲשֶׁר
  choice: toutes les maisons sur les toits desquelles
  rationale: 'Le לְ introduit vraisemblablement une précision en apposition: il s’agit de toutes les maisons où les actes cultuels décrits ont eu lieu.'
- source_word: קִטְּרוּ עַל גַּגֹּתֵיהֶם
  choice: sur les toits desquelles on a fait brûler de l’encens
  rationale: Cette traduction rend le geste cultuel du piel de קטר et la localisation explicite sur les toits, dans un français naturel.
- source_word: לְכֹל צְבָא הַשָּׁמַיִם
  choice: pour toute l’armée du ciel
  rationale: L’expression consacrée est conservée, tandis qu’une note précise qu’elle désigne ici les corps célestes objets d’un culte astral.
- source_word: וְהַסֵּךְ נְסָכִים
  choice: et versé des libations
  rationale: « Libations » exprime naturellement en français les offrandes liquides versées dans un cadre cultuel.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: à d’autres dieux
  rationale: Traduction directe qui conserve la caractérisation prophétique de ces destinataires comme d’autres divinités.
theological_decisions:
- issue: Rapport de הַטְּמֵאִים avec les maisons ou avec le lieu de Tofeth
  choice: « deviendront impures, comme le lieu de Tofeth »
  alternative: « deviendront comme le lieu impur de Tofeth »
  rationale: La forme plurielle הַטְּמֵאִים renvoie grammaticalement aux maisons, mais la syntaxe hébraïque est assez resserrée pour avoir suscité l’autre compréhension. Le texte principal respecte le nombre massorétique et la note conserve l’alternative.
- issue: Référence des « maisons des rois de Juda »
  choice: Maintien du terme littéral « maisons »
  alternative: « palais des rois de Juda »
  rationale: Même s’il peut s’agir de résidences royales, le texte emploie le nom courant « maisons »; ne pas le préciser évite une expansion interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. « Tofeth », « armée du ciel » et « libations » maintiennent le registre biblique et cultuel; les notes expliquent l’ambiguïté syntaxique et la référence culturelle sans alourdir le verset.
