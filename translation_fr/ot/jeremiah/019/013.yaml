revisions:
- from: 'Les maisons de Jérusalem et celles des rois de Juda deviendront impures, comme le lieu de Tofeth[a] : toutes les maisons sur les toits desquelles on a fait brûler de l’encens pour toute l’armée du ciel[b] et versé des libations à d’autres dieux.'
  to: 'Les maisons de Jérusalem et celles des rois de Juda deviendront, comme le lieu de Tofeth[a], impures : toutes les maisons sur les toits desquelles on a brûlé de l’encens à toute l’armée du ciel[b] et versé des libations à d’autres dieux.'
  rationale: La révision corrige la relation de destination (« à toute l’armée »), simplifie le rendu du geste cultuel et améliore la lisibilité de l’accord pluriel d’« impures ». La note a maintient explicitement l’autre analyse syntaxique attestée par la tradition de traduction, sans l’imposer au texte principal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:42Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement l’annonce de transformation, les deux catégories de maisons, Tofeth, le culte rendu à l’armée du ciel et les libations à d’autres dieux. La position de « impures » reflète de façon défendable le pluriel hébreu, tout en conservant en note l’analyse selon laquelle « impur » qualifie le lieu de Tofeth. En revanche, la préposition « pour » devant le destinataire du culte doit être « à ».
  naturalness: '« Deviendront impures, comme le lieu de Tofeth » est compréhensible, mais l’ordre « deviendront, comme le lieu de Tofeth, impures » est plus net en français : il montre que « impures » est le prédicat pluriel des maisons. « On a brûlé de l’encens » est plus direct et naturel que « on a fait brûler de l’encens » pour le verbe cultuel.'
  terminology: « Maisons », « Tofeth », « impures », « armée du ciel » et « libations » conviennent au registre biblique moderne. « À toute l’armée du ciel » exprime correctement le destinataire des offrandes; la note culturelle explicite utilement la référence astrale.
  issues:
  - severity: medium
    issue: Préposition du destinataire cultuel
    rationale: 'Le texte français dit « de l’encens pour toute l’armée du ciel », alors que לְ marque ici le destinataire : l’encens est brûlé « à toute l’armée du ciel ».'
  - severity: low
    issue: Formulation du prédicat « impures »
    rationale: La construction initiale peut momentanément faire attendre que « impures » qualifie « le lieu ». Déplacer l’incise comparative rend explicite que l’adjectif pluriel se rapporte aux maisons, sans trancher contre la lecture alternative signalée en note.
  - severity: low
    issue: Périphrase « on a fait brûler »
    rationale: Le verbe hébreu désigne directement l’action de brûler de l’encens. « On a brûlé de l’encens » est plus fidèle et plus idiomatique.
  revised_text: 'Les maisons de Jérusalem et celles des rois de Juda deviendront, comme le lieu de Tofeth[a], impures : toutes les maisons sur les toits desquelles on a brûlé de l’encens à toute l’armée du ciel[b] et versé des libations à d’autres dieux.'
  revised_footnotes:
