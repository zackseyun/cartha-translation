    reason: ambiguïté syntaxique
  - marker: b
    text: L’expression « armée du ciel » désigne ici les astres auxquels un culte était rendu.
    reason: note culturelle
  revision_rationale: La révision corrige la relation de destination (« à toute l’armée »), simplifie le rendu du geste cultuel et améliore la lisibilité de l’accord pluriel d’« impures ». La note a maintient explicitement l’autre analyse syntaxique attestée par la tradition de traduction, sans l’imposer au texte principal.
