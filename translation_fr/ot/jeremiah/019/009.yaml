source:
  edition: WLC
  text: וְ/הַֽאֲכַלְתִּ֞י/ם אֶת בְּשַׂ֣ר בְּנֵי/הֶ֗ם וְ/אֵת֙ בְּשַׂ֣ר בְּנֹתֵי/הֶ֔ם וְ/אִ֥ישׁ בְּשַׂר רֵעֵ֖/הוּ יֹאכֵ֑לוּ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֧יקוּ לָ/הֶ֛ם אֹיְבֵי/הֶ֖ם וּ/מְבַקְשֵׁ֥י נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/009.yaml
  text: And I will make them eat the flesh of their sons and the flesh of their daughters[b][a], and each will eat the flesh of his neighbor in the siege and in the distress with which their enemies and those who seek their life will afflict them.
translation:
  language: fr
  text: Je leur ferai manger la chair de leurs fils et la chair de leurs filles. Chacun mangera la chair de son prochain lors du siège et de la détresse que leur infligeront leurs ennemis et ceux qui cherchent à leur ôter la vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui cherchent leur vie » ; cette expression hébraïque désigne ceux qui cherchent à les tuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲכַלְתִּים
  choice: Je leur ferai manger
  rationale: Le hifil de אכל exprime ici la causation. Cette tournure française naturelle conserve l’action directe de Dieu dans l’annonce du jugement, sans l’atténuer en simple permission.
- source_word: בְּשַׂר
  choice: la chair
  rationale: « Chair » correspond précisément au terme hébreu et préserve toute la violence de l’image; « viande » l’atténuerait indûment.
- source_word: בְּנֵיהֶם ... בְּנֹתֵיהֶם
  choice: leurs fils ... leurs filles
  rationale: L’hébreu distingue expressément les fils et les filles; la traduction maintient ce parallélisme.
- source_word: וְאִישׁ
  choice: Chacun
  rationale: אִישׁ a ici une valeur distributive. « Chacun » rend cette fonction clairement et naturellement en français sans ajouter un contraste de sexe absent de la portée contextuelle.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: « Prochain » convient au membre de la même communauté visé ici et reste plus exact que « ami », qui supposerait une relation affective.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: au cours du siège et dans la détresse
  rationale: מָצוֹר désigne la situation de siège, tandis que מָצוֹק évoque l’oppression et la détresse extrêmes. La formulation française distingue naturellement les deux réalités.
- source_word: אֲשֶׁר יָצִיקוּ לָהֶם
  choice: auxquels les soumettront
  rationale: Le verbe צוק exprime l’idée de serrer, d’acculer ou d’infliger une pression. « Soumettre au siège et à la détresse » restitue cette force tout en reliant clairement la proposition relative aux deux noms précédents.
- source_word: וּמְבַקְשֵׁי נַפְשָׁם
  choice: et ceux qui cherchent à leur ôter la vie
  rationale: L’expression hébraïque signifie rechercher la vie de quelqu’un dans l’intention de le tuer. La traduction en explicite le sens idiomatique sans rendre נֶפֶשׁ par le doctrinalement trompeur « âme ».
theological_decisions:
- issue: L’action divine dans le jugement
  choice: « Je leur ferai manger » conserve la construction causative et présente Dieu comme celui qui fait advenir ce jugement.
  alternative: « Je les laisserai manger » ou une autre formulation purement permissive.
  rationale: Le hifil à la première personne exprime une causalité directe. La traduction ne doit pas adoucir la tension théologique du texte prophétique.
- issue: Le sens anthropologique de נֶפֶשׁ
  choice: « cherchent à leur ôter la vie »
  alternative: « cherchent leur âme » ou, plus littéralement, « cherchent leur vie »
  rationale: Dans cet idiome, נֶפֶשׁ désigne la vie menacée, non une âme immatérielle considérée séparément. La formulation retenue communique l’intention homicide sans importer une anthropologie étrangère au contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « la chair » est maintenue pour préserver l’insistance terrible de l’hébreu. « Chacun » donne une expression naturelle à la valeur distributive de אִישׁ.
