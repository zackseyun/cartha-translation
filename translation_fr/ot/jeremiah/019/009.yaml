- from: Je leur ferai manger la chair de leurs fils et la chair de leurs filles. Chacun mangera la chair de son prochain, au cours du siège et dans la détresse auxquels les soumettront leurs ennemis et ceux qui cherchent à leur ôter la vie.[a]
  to: Je leur ferai manger la chair de leurs fils et la chair de leurs filles. Chacun mangera la chair de son prochain lors du siège et de la détresse que leur infligeront leurs ennemis et ceux qui cherchent à leur ôter la vie.[a]
  rationale: La révision corrige uniquement la construction française de la proposition relative. Elle remplace la combinaison maladroite « au cours du siège et dans la détresse auxquels les soumettront » par « lors du siège et de la détresse que leur infligeront », qui conserve les deux réalités du texte source et la pression que leur font subir les ennemis. La note est conservée et son ancrage demeure associé à l’explication de l’idiome « chercher leur vie ».
