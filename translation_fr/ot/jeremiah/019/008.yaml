review_pass:
  verdict: revise
  source_fidelity: La structure et les images du texte hébreu sont globalement bien rendues. Toutefois, « près d’elle » atténue le sens usuel de « passer devant/par la ville », et « à la vue de » introduit une précision visuelle qui n’est pas exprimée par על (« à cause de / devant »). « Désolation » rend plus directement שַׁמָּה que « lieu dévasté » tout en conservant l’ambivalence entre ruine et spectacle effrayant.
  naturalness: La révision reste naturelle en français international moderne. « Une désolation et un objet de sifflements » convient au registre prophétique et conserve le parallélisme des deux noms. « Seront frappés de stupeur » est idiomatique sans réduire la réaction à une émotion précise.
  terminology: « Désolation » rend le nom שַׁמָּה; « objet de sifflements » et « siffleront » préservent l’image de שרק sans imposer la seule nuance de mépris. « Coups » rend מַכּוֹת de manière plus directement liée à l’idée de frappes ou calamités infligées que « plaies ».
  issues:
