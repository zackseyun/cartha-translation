    issue: « Près d’elle » et « à la vue de » sont interprétatifs.
    rationale: Le premier affaiblit légèrement le passage « devant/par elle »; le second ajoute l’idée explicite de vision là où על marque plus largement le motif ou la circonstance de la réaction.
  - severity: low
    issue: « Un lieu dévasté » explicite seulement l’état de ruine de שַׁמָּה.
    rationale: « Une désolation » est plus proche du nom hébreu et laisse mieux entendre le caractère saisissant de la ruine, développé dans la note.
