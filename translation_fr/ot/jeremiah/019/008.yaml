  text: וְ/שַׂמְתִּי֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את לְ/שַׁמָּ֖ה וְ/לִ/שְׁרֵקָ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכֹּתֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/008.yaml
  text: And I will make this city a horror and an object of hissing[b][a]; everyone who passes by it will be appalled and will hiss because of all its wounds.
translation:
  language: fr
  text: Je ferai de cette ville une désolation et un objet de sifflements[a]. Tous ceux qui passeront devant elle seront frappés de stupeur et siffleront[b] à cause de tous les coups qui l’auront frappée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un lieu dévasté et un objet de sifflements ». Le premier nom hébreu évoque la ruine de la ville et l’effroi qu’elle suscite.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « seront consternés et siffleront ». Le verbe hébreu peut exprimer la stupeur devant une ruine; le sifflement peut être un signe de consternation ou de dérision.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Je ferai de
  rationale: Avec לְ suivi de noms exprimant le résultat, שׂים signifie ici « faire de » plutôt que simplement « placer ».
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Rend directement le nom défini accompagné du démonstratif.
- source_word: לְשַׁמָּה
  choice: un lieu dévasté
  rationale: שַׁמָּה évoque à la fois la dévastation et l’effroi qu’elle suscite. La formulation retenue exprime clairement l’état de la ville sans exclure cette réaction, signalée en note.
- source_word: וְלִשְׁרֵקָה
  choice: un objet de sifflements
  rationale: Le nom désigne ce qui provoque des sifflements, probablement de mépris ou de stupeur. Cette traduction conserve l’image concrète hébraïque.
- source_word: כֹּל עֹבֵר עָלֶיהָ
  choice: Tous ceux qui passeront près d’elle
  rationale: La tournure participiale a une portée générale. « Près d’elle » rend naturellement en français le passage à proximité de la ville.
- source_word: יִשֹּׁם
  choice: seront consternés
  rationale: Dans ce contexte de jugement et de ruine, שׁמם exprime une réaction de stupeur horrifiée; « consternés » garde cette force.
- source_word: וְיִשְׁרֹק
  choice: siffleront
  rationale: שרק peut signifier siffler, avec une nuance de dérision ou de stupeur dans les annonces prophétiques de jugement. Le verbe concret est conservé et sa portée est précisée en note.
- source_word: עַל כָּל מַכֹּתֶיהָ
  choice: à la vue de toutes ses plaies
  rationale: מַכָּה peut désigner un coup, une blessure, une plaie ou un fléau. « Plaies » présente vivement la ville comme frappée, tandis que « à la vue de » exprime naturellement la cause de la réaction.
