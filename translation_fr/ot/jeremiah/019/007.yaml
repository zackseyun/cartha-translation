source:
  edition: WLC
  text: וּ֠/בַקֹּתִי אֶת עֲצַ֨ת יְהוּדָ֤ה וִ/ירוּשָׁלִַ֨ם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הִפַּלְתִּ֤י/ם בַּ/חֶ֨רֶב֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/נָתַתִּ֤י אֶת נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/007.yaml
  text: And I will frustrate the plan of Judah and Jerusalem in this place[a], and I will make them fall by the sword before their enemies and by the hand of those who seek their life[c][b], and I will give their corpses as food to the birds of the heavens and to the beasts of the earth.
translation:
  language: fr
  text: Je ferai échouer le projet[a] de Juda et de Jérusalem en ce lieu. Je les ferai tomber par l’épée devant leurs ennemis et par la main de ceux qui cherchent à leur ôter la vie[b]. Je livrerai leurs cadavres en pâture aux oiseaux du ciel et aux bêtes de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le conseil » ou « le dessein » de Juda et de Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui cherchent leur vie », c’est-à-dire ceux qui cherchent à les tuer.'
    reason: hebrew_idiom
lexical_decisions:
- source_word: וּבַקֹּתִי
  choice: Je ferai échouer
  rationale: Le causatif de בקק exprime ici l’action de vider de son effet, de réduire à néant. « Faire échouer » rend naturellement l’anéantissement du projet sans atténuer l’action divine.
- source_word: עֲצַת
  choice: les projets
  rationale: עֵצָה peut désigner un conseil, un dessein ou un projet. Le pluriel français exprime naturellement l’ensemble des desseins attribués à Juda et à Jérusalem, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: Juda et Jérusalem
  rationale: Formes françaises usuelles des noms propres, qui maintiennent l’association du royaume et de sa capitale.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Rendu locatif fidèle, dans un registre biblique digne mais encore courant.
- source_word: וְהִפַּלְתִּים
  choice: Je les ferai tomber
  rationale: Préserve explicitement la valeur causative du hiphil de נפל.
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: Expression instrumentale traditionnelle et exacte, évoquant la mort violente ou guerrière.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: devant leurs ennemis
  rationale: Conserve le sens spatial et relationnel de לִפְנֵי sans ajout interprétatif.
- source_word: וּבְיַד מְבַקְשֵׁי נַפְשָׁם
  choice: par la main de ceux qui en veulent à leur vie
  rationale: « Par la main de » conserve l’image hébraïque de l’agence, et « en veulent à leur vie » communique l’intention meurtrière tout en restant proche de l’expression « chercher leur vie ».
- source_word: וְנָתַתִּי
  choice: je livrerai
  rationale: Dans ce contexte, נתן signifie remettre ou donner les corps comme nourriture. « Livrer » est idiomatique en français et conserve l’action délibérée.
- source_word: נִבְלָתָם
  choice: leurs cadavres
  rationale: נְבֵלָה désigne ici les corps morts laissés sans sépulture. « Cadavres » est précis pour des êtres humains.
- source_word: לְמַאֲכָל
  choice: en pâture
  rationale: Expression française naturelle et forte pour des cadavres donnés comme nourriture aux oiseaux et aux bêtes.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ
  choice: aux oiseaux du ciel et aux bêtes de la terre
  rationale: Reproduit le parallélisme ciel-terre et le registre solennel de la formule hébraïque.
theological_decisions:
- issue: Agent de l’acte de jugement
  choice: 'Maintien de la série à la première personne : « Je ferai… Je les ferai… je livrerai »'
  alternative: Formulation permissive telle que « je laisserai leurs ennemis les faire tomber »
  rationale: Les verbes hébreux présentent explicitement Dieu comme l’agent du jugement. Une formulation seulement permissive atténuerait cette affirmation.
translation_notes:
  register: Français international moderne, solennel sans archaïsmes excessifs. « En ce lieu », « par l’épée » et « en pâture » maintiennent la gravité poétique du jugement. Les répétitions à la première personne et le parallélisme du texte source sont conservés.
