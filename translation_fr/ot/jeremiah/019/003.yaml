  text: וְ/אָֽמַרְתָּ֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה מַלְכֵ֣י יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ עַל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר כָּל שֹׁמְעָ֖/הּ תִּצַּ֥לְנָה אָזְנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/003.yaml
  text: 'And say, ‘Hear the word of the LORD, O kings of Judah and inhabitants of Jerusalem. Thus says the LORD of hosts, the God of Israel: Behold, I am bringing disaster on this place, at which everyone who hears of it—his ears will tingle.’'
translation:
  language: fr
  text: 'Tu diras : « Écoutez la parole du SEIGNEUR, rois de Juda et habitants de Jérusalem ! Voici ce que dit le SEIGNEUR des armées, le Dieu d’Israël : Je vais faire venir sur ce lieu un malheur tel que les oreilles de quiconque en entendra parler tinteront. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française courante, en petites capitales dans la mise en page finale.
- source_word: יְהוָה צְבָאוֹת
  choice: le SEIGNEUR des armées
  rationale: Traduction formelle de l’expression hébraïque, qui conserve son titre traditionnel sans préciser indûment la nature des armées.
- source_word: רָעָה
  choice: un malheur
  rationale: Dans ce contexte de jugement annoncé, le terme désigne une calamité ou un désastre, non le mal moral abstrait.
- source_word: תִּצַּלְנָה אָזְנָיו
  choice: ses oreilles en tinteront
  rationale: Conserve l’image idiomatique hébraïque d’un choc si terrible que les oreilles en résonnent.
theological_decisions:
- issue: Annonce divine du jugement
  choice: Je vais faire venir sur ce lieu un malheur
  alternative: Je fais venir sur ce lieu un malheur
  rationale: Le participe hébreu après הִנְנִי présente une action imminente et résolue ; le futur proche français restitue naturellement cette force.
- issue: Identité du SEIGNEUR
  choice: le SEIGNEUR des armées, le Dieu d’Israël
  alternative: l’Éternel des armées, le Dieu d’Israël
  rationale: Préserve les deux désignations du texte sans les fusionner ni leur ajouter une interprétation confessionnelle.
translation_notes:
  register: Français moderne, solennel et oral, adapté à une proclamation prophétique. L’apostrophe sans « ô » évite un archaïsme inutile. La reprise pronominale « ses oreilles » reste naturelle tout en reflétant la formulation distributive de l’hébreu.
