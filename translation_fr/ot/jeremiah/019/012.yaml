revisions:
- from: 'Voilà ce que je ferai à ce lieu, déclare Yahweh, ainsi qu’à ses habitants : je rendrai cette ville pareille à Topheth[a].'
  to: C’est ainsi que j’agirai à l’égard de ce lieu, déclare Yahweh, et de ses habitants, en rendant cette ville semblable à Topheth[a].
  rationale: La révision rend plus directement la valeur de כֵּן (« C’est ainsi »), conserve le caractère général de עשה (« agir ») et relie la proposition finale à l’infinitif hébreu sans trancher sa nuance exacte. Elle préserve également la comparaison non explicitée avec Topheth.
