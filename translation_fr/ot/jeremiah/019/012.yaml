  text: כֵּֽן אֶעֱשֶׂ֞ה לַ/מָּק֥וֹם הַ/זֶּ֛ה נְאֻם יְהוָ֖ה וּ/לְ/יֽוֹשְׁבָ֑י/ו וְ/לָ/תֵ֛ת אֶת הָ/עִ֥יר הַ/זֹּ֖את כְּ/תֹֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/012.yaml
  text: So I will do to this place[a], declares Yahweh, and to its inhabitants, making this city like Topheth.
translation:
  language: fr
  text: C’est ainsi que j’agirai à l’égard de ce lieu, déclare Yahweh, et de ses habitants, en rendant cette ville semblable à Topheth[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Topheth était un site de la vallée de Ben-Hinnom associé à des sacrifices d’enfants et, par la suite, à la profanation et au jugement. La comparaison annonce que Jérusalem deviendra, elle aussi, un lieu d’horreur et d’impureté.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: Voilà ce que
  rationale: Cette tournure française naturelle reprend l’action symbolique et l’annonce précédentes, tout en conservant la valeur consécutive de l’hébreu.
- source_word: אֶעֱשֶׂה לַמָּקוֹם הַזֶּה
  choice: je ferai à ce lieu
  rationale: Le verbe עשה reste général, et la préposition ל désigne ici ce qui subira l’action annoncée. La formulation préserve cette construction sans expliciter davantage son caractère hostile.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formule prophétique solennelle et idiomatique, avec transcription directe du nom divin.
- source_word: וּלְיֹשְׁבָיו
  choice: ainsi qu’à ses habitants
  rationale: Rend clairement le second complément affecté par l’action, dans un français fluide.
- source_word: וְלָתֵת אֶת הָעִיר הַזֹּאת כְּתֹפֶת
  choice: je rendrai cette ville pareille à Topheth
  rationale: L’infinitif לָתֵת précise l’action et son résultat. « Rendre… pareille à » exprime naturellement la comparaison marquée par כְּ sans ajouter la nature exacte de la ressemblance.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de la comparaison avec Topheth
  choice: pareille à Topheth
  alternative: un lieu d’horreur et d’impureté comme Topheth
  rationale: Le texte ne précise pas explicitement sous quel aspect Jérusalem ressemblera à Topheth. La traduction maintient cette tension et laisse le contexte ainsi que la note éclairer l’image.
translation_notes:
  register: Français international moderne, direct et solennel. La structure en deux propositions clarifie la fonction de l’infinitif hébreu sans atténuer la gravité de l’oracle.
