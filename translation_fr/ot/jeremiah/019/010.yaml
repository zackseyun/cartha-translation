  text: Then you shall break the flask before the eyes of the men who are going with you[a].
translation:
  language: fr
  text: Puis tu briseras la cruche sous les yeux des hommes qui t’accompagnent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁבַרְתָּ
  choice: Puis tu briseras
  rationale: Le parfait qal à la 2e personne masculine singulière, précédé du waw, poursuit ici la série d’instructions prophétiques. Le futur français exprime naturellement cette consigne séquentielle.
- source_word: הַבַּקְבֻּק
  choice: la cruche
  rationale: Le terme désigne un récipient en terre cuite, vraisemblablement à col étroit. « Cruche » est concret, courant en français et convient au geste symbolique décrit dans le contexte.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression conserve l’image hébraïque des yeux tout en rendant naturellement l’idée d’un acte accompli en présence visible de témoins.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le nom hébreu est explicitement masculin et renvoie aux hommes désignés dans le contexte immédiat.
- source_word: הַהֹלְכִים אוֹתָךְ
  choice: qui t’accompagnent
  rationale: Le participe exprime l’action en cours de ceux qui vont avec Jérémie. « Qui t’accompagnent » est une formulation française naturelle et précise.
