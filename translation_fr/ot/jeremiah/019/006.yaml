  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יִקָּרֵא֩ לַ/מָּק֨וֹם הַ/זֶּ֥ה ע֛וֹד הַ/תֹּ֖פֶת וְ/גֵ֣יא בֶן הִנֹּ֑ם כִּ֖י אִם גֵּ֥יא הַ/הֲרֵגָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/006.yaml
  text: Therefore, look, days are coming, declares the LORD, when this place will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter.
translation:
  language: fr
  text: C’est pourquoi, voici que des jours viennent — déclare le SEIGNEUR — où cet endroit ne sera plus appelé le Topheth ni la vallée de Ben-Hinnom, mais la vallée du Massacre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence introduite par le terme hébreu.
- source_word: הִנֵּה
  choice: voici que
  rationale: Conserve la fonction d’appel à l’attention tout en formant une tournure française naturelle avec « des jours viennent ».
- source_word: נְאֻם יְהוָה
  choice: déclare le SEIGNEUR
  rationale: Rend la formule prophétique comme une déclaration solennelle et représente le tétragramme selon la convention française en petites capitales.
- source_word: הַתֹּפֶת
  choice: le Tofeth
  rationale: Translittération française courante du nom propre.
- source_word: גֵיא בֶן הִנֹּם
  choice: la vallée de Ben-Hinnom
  rationale: Conserve le nom géographique hébreu sans l’interpréter.
- source_word: גֵּיא הַהֲרֵגָה
  choice: la vallée du Massacre
  rationale: « Massacre » rend avec force le substantif désignant la tuerie et convient au nouveau nom annoncé.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé / l’Éternel
  rationale: La convention en petites capitales distingue le tétragramme tout en restant largement compréhensible et sans imposer une vocalisation discutée.
- issue: Coordination des deux anciens noms sous la négation
  choice: ne sera plus appelé le Tofeth ni la vallée de Ben-Hinnom
  alternative: ne sera plus appelé le Tofeth et la vallée de Ben-Hinnom
  rationale: L’hébreu coordonne les deux désignations par וְ, mais, dans une proposition négative française, « ni » est la forme idiomatique de cette coordination; il ne transforme pas les noms en options concurrentes.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure prophétique et l’image du changement de nom sont conservées sans explicitation interprétative.
