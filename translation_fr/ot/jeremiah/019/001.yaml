id: JER.19.1
reference: Jeremiah 19:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הָל֛וֹךְ וְ/קָנִ֥יתָ בַקְבֻּ֖ק יוֹצֵ֣ר חָ֑רֶשׂ וּ/מִ/זִּקְנֵ֣י הָ/עָ֔ם וּ/מִ/זִּקְנֵ֖י הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/001.yaml
  text: 'Thus says Yahweh: Go and buy a potter’s earthenware flask[a], and take some of the elders of the people and some of the elders of the priests[b],'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh : « Va acheter une cruche en terre cuite façonnée par un potier[a], et emmène avec toi quelques-uns des anciens du peuple et quelques-uns des anciens des prêtres[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une jarre en terre cuite » ou « une bouteille en terre cuite ». Le mot hébreu désigne un récipient façonné, vraisemblablement à col étroit.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « d’entre les anciens du peuple et d’entre les anciens des prêtres ». Le verbe « emmène » est sous-entendu; Jérémie doit prendre des représentants de chacun des deux groupes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette tournure française naturelle conserve la solennité de la formule prophétique et rend le nom divin comme un nom propre.
- source_word: הָלוֹךְ וְקָנִיתָ
  choice: Va acheter
  rationale: L’infinitif absolu employé comme impératif, suivi du verbe coordonné, forme en français un ordre unique et direct.
- source_word: בַקְבֻּק
  choice: cruche
  rationale: Le terme désigne un récipient façonné, vraisemblablement à col étroit. « Cruche » est courant et concret, tandis que la note conserve les autres possibilités.
- source_word: יוֹצֵר חָרֶשׂ
  choice: en terre cuite façonnée par un potier
  rationale: Cette formulation exprime à la fois la matière du récipient et le travail du potier, sans la lourdeur d’un calque.
- source_word: וּמִזִּקְנֵי הָעָם וּמִזִּקְנֵי הַכֹּהֲנִים
  choice: et emmène avec toi quelques-uns des anciens du peuple et quelques-uns des anciens des prêtres
  rationale: Le verbe « emmène » est implicite dans l’hébreu; « quelques-uns » rend la valeur partitive de מִן et indique qu’il s’agit de représentants des deux groupes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique reste solennelle; les ajouts nécessaires à l’ellipse hébraïque sont formulés naturellement et signalés en note.
