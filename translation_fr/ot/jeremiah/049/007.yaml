  text: לֶ/אֱד֗וֹם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הַ/אֵ֥ין ע֛וֹד חָכְמָ֖ה בְּ/תֵימָ֑ן אָבְדָ֤ה עֵצָה֙ מִ/בָּנִ֔ים נִסְרְחָ֖ה חָכְמָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/007.yaml
  text: 'Concerning Edom: Thus says Yahweh of hosts: Is there no longer wisdom in Teman? Has counsel perished from the prudent? Has their wisdom become corrupted?[a][b]'
translation:
  language: fr
  text: 'Au sujet d’Édom. Voici ce que dit Yahweh des armées :


    « N’y a-t-il plus de sagesse à Témân ?

    Le conseil a-t-il disparu chez les hommes avisés[a] ?

    Leur sagesse s’est-elle corrompue[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez ceux qui savent discerner ». Le terme hébreu désigne des personnes capables de comprendre, et non des « fils ».
    reason: lexical_alternative
  - marker: b
    text: Ou « leur sagesse s’est-elle gâtée ? » Le verbe hébreu évoque quelque chose qui s’altère, se corrompt ou tourne mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאֱדוֹם
  choice: Au sujet d’Édom
  rationale: Dans cette rubrique prophétique, le préfixe ל introduit le peuple visé par l’oracle. Cette formulation naturelle conserve la neutralité de la préposition sans imposer « contre ».
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend en français moderne et digne la formule consacrée du messager prophétique.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » représente explicitement le tétragramme, tandis que « des armées » conserve l’imagerie militaire et céleste de צְבָאוֹת.
- source_word: הַאֵין עוֹד חָכְמָה
  choice: N’y a-t-il plus de sagesse
  rationale: La question avec עוֹד porte sur la persistance de la sagesse ; « ne… plus » exprime clairement qu’elle semble avoir cessé d’exister.
- source_word: בְּתֵימָן
  choice: à Témân
  rationale: Témân est ici un lieu d’Édom réputé pour sa sagesse ; « à » est la préposition locative française la plus naturelle pour une ville ou une localité.
- source_word: אָבְדָה עֵצָה
  choice: Le conseil a-t-il disparu
  rationale: אָבַד exprime la perte ou la disparition, et עֵצָה désigne ici la capacité de donner un conseil judicieux.
- source_word: מִבָּנִים
  choice: chez les hommes avisés
  rationale: La forme renvoie à ceux qui comprennent ou discernent, et non aux « fils ». « Hommes avisés » est idiomatique et convient au parallélisme sur la sagesse.
- source_word: נִסְרְחָה
  choice: s’est-elle corrompue
  rationale: Le verbe évoque ce qui s’altère, se gâte ou devient mauvais. « Se corrompre » préserve cette image de détérioration dans un registre digne.
- source_word: חָכְמָתָם
  choice: leur sagesse
  rationale: Le suffixe possessif renvoie aux sages ou, plus largement, aux Édomites évoqués dans l’oracle ; le français conserve cette portée contextuelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend visible le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Référent du possessif dans חָכְמָתָם
  choice: leur sagesse
  alternative: la sagesse des hommes avisés
  rationale: Le pronom hébreu reste susceptible de viser les hommes avisés immédiatement mentionnés ou, plus largement, Édom et ses sages. Le possessif français préserve cette légère ambiguïté.
translation_notes:
  register: Français international moderne, sobre et prophétique. Les trois questions parallèles sont disposées en lignes pour faire ressortir leur progression. « Avisés » évite le contresens biologique de « fils », et « corrompue » maintient l’image concrète d’une sagesse qui s’est dégradée.
