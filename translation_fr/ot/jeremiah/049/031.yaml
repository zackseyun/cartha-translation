source:
  edition: WLC
  text: ק֣וּמוּ עֲל֗וּ אֶל גּ֥וֹי שְׁלֵ֛יו יוֹשֵׁ֥ב לָ/בֶ֖טַח נְאֻם יְהוָ֑ה לֹא דְלָתַ֧יִם וְ/לֹֽא בְרִ֛יחַ ל֖/וֹ בָּדָ֥ד יִשְׁכֹּֽנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/031.yaml
  text: Rise up[a], go up against a nation at ease, dwelling securely, declares Yahweh, that has no doors or bars[b]; they dwell alone.
translation:
  language: fr
  text: Levez-vous, montez contre une nation tranquille[a], qui habite en sécurité, déclare Yahweh. Elle n’a ni portes ni verrou[b] ; ils habitent seuls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « paisible » ou « insouciante ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pas de portes ni de verrou pour elle ». L’image évoque une population sans dispositifs défensifs, qui se croit en sécurité.'
    reason: cultural_note
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Levez-vous
  rationale: Impératif pluriel de קום ; cette formulation naturelle conserve la force de l’appel militaire.
- source_word: עֲל֗וּ אֶל
  choice: montez contre
  rationale: Dans cet oracle de guerre, עלה avec אֶל exprime une avancée hostile ; « montez contre » reste proche de l’image hébraïque sans expliciter davantage par « attaquez ».
- source_word: גּ֥וֹי שְׁלֵ֛יו
  choice: une nation tranquille
  rationale: גוי désigne ici une entité collective et politique ; שָׁלֵו évoque le calme et l’aisance, avec une possible nuance d’insouciance conservée en note.
- source_word: יוֹשֵׁ֥ב לָבֶ֖טַח
  choice: qui habite en sécurité
  rationale: Le participe décrit une situation durable ; la tournure française rend naturellement l’idée d’une population établie sans crainte.
- source_word: נְאֻם יְהוָ֑ה
  choice: déclare Yahweh
  rationale: La formule prophétique est rendue de façon solennelle et actuelle, tandis que le nom divin est translittéré.
- source_word: לֹא דְלָתַ֧יִם וְלֹֽא בְרִ֛יחַ ל֖וֹ
  choice: Elle n’a ni portes ni verrous
  rationale: La négation coordonnée est naturellement rendue par « ni… ni » ; le pluriel « verrous » convient en français aux dispositifs fermant des portes, tout en préservant l’image concrète.
- source_word: בָּדָ֥ד יִשְׁכֹּֽנוּ
  choice: ses habitants demeurent à l’écart
  rationale: Le pluriel verbal renvoie aux membres de la nation. « À l’écart » exprime l’isolement géographique ou social sans imposer le sens affectif que pourrait prendre « seuls ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve ici le nom divin personnel plutôt que de le remplacer par un titre.
- issue: Portée de la sécurité décrite
  choice: Conserver à la fois la tranquillité et la vulnérabilité implicite
  alternative: Rendre explicitement la nation comme insouciante ou sans fortifications
  rationale: Le texte juxtapose שְׁלֵו, לָבֶטַח et l’absence de portes et de verrou sans qualifier directement cette confiance d’orgueilleuse ni expliquer entièrement l’image ; la traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et lisible. Les impératifs gardent le ton militaire de l’oracle. « Demeurent » maintient un registre légèrement élevé sans archaïsme ; « à l’écart » préserve l’ambiguïté de בָּדָד entre isolement et autonomie.
