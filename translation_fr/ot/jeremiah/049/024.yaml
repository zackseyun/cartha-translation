source:
  edition: WLC
  text: רָפְתָ֥ה דַמֶּ֛שֶׂק הִפְנְתָ֥ה לָ/נ֖וּס וְ/רֶ֣טֶט הֶחֱזִ֑יקָה צָרָ֧ה וַ/חֲבָלִ֛ים אֲחָזַ֖תָּ/ה כַּ/יּוֹלֵדָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/024.yaml
  text: Damascus has become feeble[a]; she has turned to flee, and trembling has seized her. Distress and labor pains have taken hold of her[c][b], like a woman giving birth.
translation:
  language: fr
  text: Damas est devenue faible[a] ; elle s’est retournée pour fuir, et le tremblement l’a saisie[b]. La détresse et les douleurs l’ont empoignée[c], comme une femme qui accouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’est affaiblie » ou « a perdu courage ». Le verbe hébreu peut évoquer la perte de force ou de courage.
    reason: lexical_alternative
  - marker: b
    text: Ou « la terreur l’a saisie ». Le nom hébreu désigne plus littéralement un tremblement, probablement provoqué par la peur.
    reason: lexical_alternative
  - marker: c
    text: Ou « les douleurs de l’accouchement l’ont empoignée ». La comparaison qui suit indique qu’il s’agit ici de douleurs liées à l’enfantement.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָפְתָה
  choice: est devenue faible
  rationale: Le verbe רפה exprime ici l’affaiblissement ou la perte de courage. Cette formulation reste proche de l’hébreu sans préciser indûment s’il s’agit surtout de force physique ou morale.
- source_word: דַמֶּשֶׂק
  choice: Damas
  rationale: Forme française usuelle du nom de lieu.
- source_word: הִפְנְתָה לָנוּס
  choice: elle s’est retournée pour fuir
  rationale: Reproduit le mouvement exprimé par הפנה suivi de l’infinitif נוס, dans un français naturel.
- source_word: וְרֶטֶט
  choice: mais le tremblement
  rationale: רטט désigne un tremblement ou frémissement, vraisemblablement causé par la peur. « Tremblement » conserve l’image corporelle ; la conjonction « mais » rend ici la progression adversative naturelle en français.
- source_word: הֶחֱזִיקָה
  choice: l’a saisie
  rationale: Le hiphil de חזק exprime ici une prise ferme. « Saisir » convient naturellement au tremblement personnifié.
- source_word: צָרָה
  choice: La détresse
  rationale: צָרָה peut désigner la détresse, l’angoisse ou l’épreuve. « Détresse » préserve cette portée assez large.
- source_word: וַחֲבָלִים
  choice: et les douleurs
  rationale: חבלים peut désigner des douleurs ou, dans ce contexte, des douleurs d’enfantement. La comparaison finale rend la référence obstétricale manifeste sans devoir la répéter dans le corps du verset.
- source_word: אֲחָזַתָּה
  choice: l’ont empoignée
  rationale: אחז signifie saisir ou agripper. Le pronom féminin maintient la personnification de Damas.
- source_word: כַּיּוֹלֵדָה
  choice: comme une femme qui accouche
  rationale: Le participe de ילד représente une femme en train d’enfanter. Cette formulation est claire et actuelle.
theological_decisions: []
