source:
  edition: WLC
  text: לָ/כֵ֛ן יִפְּל֥וּ בַחוּרֶ֖י/הָ בִּ/רְחֹבֹתֶ֑י/הָ וְ/כָל אַנְשֵׁ֨י הַ/מִּלְחָמָ֤ה יִדַּ֨מּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/026.yaml
  text: Therefore her young men will fall in her streets[a], and all the men of war will be silenced on that day[c][b], declares Yahweh of Armies.
translation:
  language: fr
  text: C’est pourquoi ses jeunes hommes tomberont dans ses rues[a], et tous les hommes de guerre seront réduits au silence en ce jour-là[b], déclare Yahweh des armées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ses places » ou « dans ses espaces ouverts ».
    reason: lexical_alternative
  - marker: b
    text: Ou « périront » ou « seront anéantis ». Le verbe hébreu peut évoquer le fait d’être réduit au silence, immobilisé ou conduit à la ruine.
    reason: lexical_alternative
  - marker: c
    text: 'Rendu traditionnel : « le SEIGNEUR des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement la conséquence du jugement annoncé dans le contexte précédent.
- source_word: יִפְּלוּ
  choice: tomberont
  rationale: Conserve l’image hébraïque de ceux qui tombent au combat, sans expliciter davantage qu’ils seront tués.
- source_word: בַחוּרֶיהָ
  choice: ses jeunes hommes
  rationale: Désigne des hommes dans la force de l’âge, notamment aptes au combat.
- source_word: בִּרְחֹבֹתֶיהָ
  choice: dans ses rues
  rationale: רְחוֹב peut désigner une rue large, une place ou un espace public ouvert ; « rues » est naturel dans cette scène de guerre urbaine, tandis que la note conserve les autres possibilités.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les hommes de guerre
  rationale: Rend de manière transparente l’expression hébraïque désignant les combattants et en conserve la référence masculine.
- source_word: יִדַּמּוּ
  choice: seront réduits au silence
  rationale: Préserve l’image centrale du verbe, qui peut évoquer le silence, l’immobilisation ou la ruine ; le contexte permet aussi le sens « périr », signalé en note.
- source_word: בַּיּוֹם הַהוּא
  choice: en ce jour-là
  rationale: Formule temporelle naturelle et courante dans le discours prophétique français.
- source_word: נְאֻם
  choice: déclare
  rationale: Rend clairement la formule prophétique qui authentifie la parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé directement par le tétragramme, plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Restitue le sens martial du titre hébreu, particulièrement pertinent dans ce contexte de jugement guerrier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même ; sa transcription préserve cette distinction au lieu de le remplacer silencieusement par un titre.
- issue: Rendu du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR des armées
  rationale: « Des armées » garde la force militaire de צְבָאוֹת, tandis que la note indique le rendu traditionnel fondé sur la substitution du nom divin.
- issue: Portée de יִדַּמּוּ dans un oracle de jugement
  choice: seront réduits au silence
  alternative: périront
  rationale: Le choix principal conserve la métaphore et l’ambiguïté du verbe ; l’alternative explicite l’issue funeste fortement suggérée par le contexte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe prophétique reste solennelle sans archaïsmes ; les images militaires et l’ambiguïté du verbe יִדַּמּוּ sont conservées.
