source:
  edition: WLC
  text: נֻ֤סוּ הָפְנוּ֙ הֶעְמִ֣יקוּ לָ/שֶׁ֔בֶת יֹשְׁבֵ֖י דְּדָ֑ן כִּ֣י אֵ֥יד עֵשָׂ֛ו הֵבֵ֥אתִי עָלָ֖י/ו עֵ֥ת פְּקַדְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/008.yaml
  text: Flee[a], turn back, dwell deep, inhabitants of Dedan, for I have brought Esau’s calamity upon him[c][b], the time when I punish him.
translation:
  language: fr
  text: Fuyez, faites demi-tour, enfoncez-vous profondément pour vous y établir, habitants de Dedân, car j’ai fait venir sur Ésaü[a] sa calamité, le temps où je le châtie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ésaü » désigne ici Édom, le peuple issu d’Ésaü.
    reason: cultural_note
  - marker: b
    text: 'Ou : « le temps de mon intervention contre lui » ; le verbe hébreu désigne ici une intervention ayant valeur de jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ
  choice: Fuyez
  rationale: Impératif pluriel direct de נוס, naturel et vigoureux dans une annonce prophétique de jugement.
- source_word: הָפְנוּ
  choice: faites demi-tour
  rationale: Exprime ici le mouvement de retrait qui suit l’ordre de fuir, plutôt qu’un simple changement de direction.
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: retirez-vous dans les profondeurs pour y habiter
  rationale: Conserve l’image hébraïque d’un établissement en profondeur tout en faisant comprendre le retrait vers un lieu éloigné ou difficile d’accès.
- source_word: יֹשְׁבֵי דְּדָן
  choice: habitants de Dedân
  rationale: Rendu direct et idiomatique de la construction nominale hébraïque.
- source_word: אֵיד עֵשָׂו
  choice: le désastre qui est destiné à Ésaü
  rationale: אֵיד désigne un désastre ou une calamité. La tournure française permet d’éviter l’ambiguïté maladroite de « son désastre » tout en gardant Ésaü comme référent explicite.
- source_word: הֵבֵאתִי עָלָיו
  choice: je fais venir sur Ésaü
  rationale: Le parfait prophétique annonce le jugement comme certain; le présent français convient à une action imminente et solennellement décrétée. Le nom est répété pour clarifier le pronom.
- source_word: עֵת פְּקַדְתִּיו
  choice: le temps où j’interviens contre lui
  rationale: פקד, dans ce contexte judiciaire, indique une intervention punitive. « Interviens contre » préserve davantage la portée du verbe que le seul « punis » sans rendre la visitation neutre.
theological_decisions:
- issue: Sens de פקד dans un oracle de jugement
  choice: j’interviens contre lui
  alternative: je le punis / le temps de mon intervention contre lui
  rationale: Le contexte impose une intervention divine punitive. La formulation retenue conserve la notion plus large d’intervention ou de visitation tout en marquant clairement son caractère hostile.
- issue: Référent d’Ésaü
  choice: Conserver « Ésaü » dans le texte
  alternative: Edom
  rationale: Le texte hébreu nomme Ésaü. Il convient de préserver cette métonymie traditionnelle et d’expliquer en note qu’elle désigne ici Edom, ses descendants.
translation_notes:
  register: Français international moderne, solennel mais accessible. La série d’impératifs et l’image du retrait « dans les profondeurs » sont conservées. Les deux marqueurs de note figurent dans le texte principal.
