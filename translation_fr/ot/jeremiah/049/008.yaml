revisions:
- from: Fuyez, faites demi-tour, retirez-vous dans les profondeurs pour y habiter, habitants de Dedân, car je fais venir sur Ésaü le désastre qui lui est destiné[a], le temps où j’interviens contre lui[b].
  to: Fuyez, faites demi-tour, enfoncez-vous profondément pour vous y établir, habitants de Dedân, car j’ai fait venir sur Ésaü[a] sa calamité, le temps où je le châtie[b].
  rationale: La révision retire l’expansion interprétative « qui lui est destiné », rend le parfait prophétique de façon plus proche et améliore la fluidité de l’expression décrivant le retrait. Elle conserve l’ordre des éléments, la métonymie « Ésaü », le registre prophétique et les deux ancres de notes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:20Z'
review_pass:
  verdict: revise
  source_fidelity: La tournure « le désastre qui lui est destiné » ajoute l’idée de destination, absente de אֵיד עֵשָׂו, qui signifie littéralement « la calamité d’Ésaü ». Le parfait hébreu הֵבֵאתִי est mieux rendu ici par « j’ai fait venir », qui conserve sa forme tout en pouvant exprimer la certitude prophétique. Les impératifs et l’image d’un retrait vers un lieu profond ou inaccessible sont par ailleurs correctement représentés.
  naturalness: « Retirez-vous dans les profondeurs pour y habiter » est compréhensible, mais « enfoncez-vous profondément pour vous y établir » est plus idiomatique en français moderne tout en gardant l’image du texte. La séquence finale reste volontairement compacte, comme l’apposition hébraïque.
  terminology: « Dedân » et « Ésaü » sont des formes françaises recevables. « Calamité » rend bien אֵיד dans un oracle de jugement. « Châtie » explicite de manière sobre la valeur punitive de פקד dans ce contexte, sans effacer la note sur « intervention ».
  issues:
  - severity: medium
    issue: Ajout de « qui lui est destiné »
    rationale: Cette formulation interprète la calamité comme étant destinée à Ésaü, alors que l’hébreu dit simplement « la calamité d’Ésaü ». Elle doit être supprimée afin de ne pas ajouter une nuance absente de la source.
  - severity: low
    issue: Rendu présent de הֵבֵאתִי
    rationale: « Je fais venir » est possible comme présent prophétique, mais « j’ai fait venir » correspond plus directement au parfait hébreu et préserve sa force déclarative.
  - severity: low
    issue: Formulation du retrait profond
    rationale: « Dans les profondeurs » peut suggérer un lieu abstrait ou souterrain. « Enfoncez-vous profondément » conserve plus naturellement l’idiome de retrait vers un endroit caché ou inaccessible.
  revised_text: Fuyez, faites demi-tour, enfoncez-vous profondément pour vous y établir, habitants de Dedân, car j’ai fait venir sur Ésaü[a] sa calamité, le temps où je le châtie[b].
  revised_footnotes:
  - marker: a
    text: « Ésaü » désigne ici Édom, le peuple issu d’Ésaü.
    reason: cultural_note
  - marker: b
    text: 'Ou : « le temps de mon intervention contre lui » ; le verbe hébreu désigne ici une intervention ayant valeur de jugement.'
    reason: lexical_alternative
  revision_rationale: La révision retire l’expansion interprétative « qui lui est destiné », rend le parfait prophétique de façon plus proche et améliore la fluidité de l’expression décrivant le retrait. Elle conserve l’ordre des éléments, la métonymie « Ésaü », le registre prophétique et les deux ancres de notes.
