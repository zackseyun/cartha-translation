  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִ֠נֵּה אֲשֶׁר אֵ֨ין מִשְׁפָּטָ֜/ם לִ/שְׁתּ֤וֹת הַ/כּוֹס֙ שָׁת֣וֹ יִשְׁתּ֔וּ וְ/אַתָּ֣ה ה֔וּא נָקֹ֖ה תִּנָּקֶ֑ה לֹ֣א תִנָּקֶ֔ה כִּ֥י שָׁתֹ֖ה תִּשְׁתֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/012.yaml
  text: 'For thus says Yahweh: Behold[a], those who were not sentenced to drink the cup will surely drink, and are you the one who will go unpunished? You will not go unpunished[c][b], for you will surely drink.'
translation:
  language: fr
  text: 'Car ainsi parle Yahweh : Voici, ceux qui n’étaient pas tenus de boire la coupe[a] la boiront certainement. Et toi, serais-tu pour autant acquitté[b] ? Tu ne seras pas acquitté, car tu la boiras certainement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « coupe » est une image prophétique du jugement que Dieu fait subir aux nations.
    reason: metaphor_clarification
  - marker: b
    text: 'Ou : « resterais-tu impuni ? Tu ne resteras pas impuni ». Le verbe peut aussi signifier « être acquitté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel, conformément à l’usage du projet, plutôt que de le remplacer par un titre.
- source_word: הִנֵּה
  choice: non rendu séparément
  rationale: En français moderne, la force présentative et solennelle est portée naturellement par les deux-points et l’énoncé qui suit ; « voici » immédiatement après « voici ce que dit » serait lourd et redondant.
- source_word: אֲשֶׁר אֵין מִשְׁפָּטָם לִשְׁתּוֹת הַכּוֹס
  choice: ceux qui n’étaient pas destinés à boire la coupe
  rationale: מִשְׁפָּטָם peut désigner ce qui leur revenait selon le jugement, leur lot ou leur dû. « Destinés » conserve l’idée d’une attribution judiciaire sans affirmer trop précisément qu’une sentence formelle avait été prononcée.
- source_word: הַכּוֹס
  choice: la coupe
  rationale: Conserve littéralement l’image prophétique, sans ajouter dans le texte « de colère » ou « de jugement ».
- source_word: שָׁתוֹ יִשְׁתּוּ
  choice: la boiront certainement
  rationale: L’infinitif absolu accompagné du verbe conjugué exprime ici la certitude et l’intensité de l’action.
- source_word: וְאַתָּה הוּא נָקֹה תִּנָּקֶה
  choice: Et toi, serais-tu donc épargné ?
  rationale: La tournure interrogative garde l’adresse emphatique et provocatrice. « Épargné » rend naturellement en contexte le fait de ne pas subir la peine.
- source_word: לֹא תִנָּקֶה
  choice: Tu ne seras pas épargné
  rationale: Le niphal de נקה peut signifier être tenu pour innocent, être acquitté ou rester impuni. « Épargné » s’accorde au contexte de jugement tout en restant idiomatique.
- source_word: כִּי שָׁתֹה תִּשְׁתֶּה
  choice: car tu la boiras certainement
  rationale: Reproduit l’insistance de l’infinitif absolu ; le pronom « la » est naturel en français et renvoie clairement à la coupe.
theological_decisions:
- issue: Portée métaphorique de « la coupe »
  choice: Conserver « la coupe » sans explicitation dans le texte principal.
  alternative: « la coupe du jugement » ou « la coupe de la colère »
  rationale: L’hébreu dit seulement « la coupe ». Le contexte indique un jugement imposé par Dieu, mais l’expliciter dans le corps du verset ajouterait une précision absente de la formulation source.
- issue: Sens judiciaire de נקה
  choice: « être épargné » dans le texte, avec l’alternative judiciaire en note.
  alternative: « être acquitté » ou « rester impuni »
  rationale: Le terme autorise une lecture judiciaire. La traduction principale exprime naturellement l’absence d’exemption du châtiment, tandis que la note préserve explicitement les autres nuances.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « boire » et l’intensification par « certainement » conservent l’insistance hébraïque. L’adresse à Édom demeure confrontatrice sans archaïsme.
