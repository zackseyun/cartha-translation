revisions:
- from: 'Car voici ce que dit Yahweh : Ceux qui n’étaient pas destinés à boire la coupe la boiront certainement. Et toi, serais-tu donc épargné ? Tu ne seras pas épargné[a], car tu la boiras certainement[b].'
  to: 'Car ainsi parle Yahweh : Voici, ceux qui n’étaient pas tenus de boire la coupe[a] la boiront certainement. Et toi, serais-tu pour autant acquitté[b] ? Tu ne seras pas acquitté, car tu la boiras certainement.'
  rationale: La révision rend explicitement הִנֵּה, remplace une formulation orientée vers le destin par une expression qui conserve la nuance de dû ou d’obligation judiciaire de מִשְׁפָּט, et adopte « acquitté » pour le vocabulaire de נקה. Elle conserve l’ambiguïté interprétative dans la note et replace l’ancre de la note métaphorique sur « coupe ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:24Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la certitude emphatique des deux constructions infinitif absolu + verbe fini (« boiront certainement », « boiras certainement ») et conserve littéralement l’image de la coupe. Toutefois, « destinés » atténue et déplace la nuance משפט, qui renvoie ici à ce qui est juridiquement dû ou assigné, et « épargné » est moins précis que le vocabulaire judiciaire de נקה. La particule הִנֵּה mérite aussi d’être représentée, même brièvement.
  naturalness: 'Le français est globalement fluide et de registre approprié. « Ainsi parle Yahweh : Voici » est une formulation prophétique naturelle et permet de rendre à la fois כֹּה אָמַר et הִנֵּה sans la redondance de « Voici ce que dit ... : Voici ». « Serais-tu pour autant acquitté ? » est direct et idiomatique dans ce contexte judiciaire.'
  terminology: « Yahweh » et « la coupe » sont correctement maintenus. « Acquitté » restitue plus exactement le niphal de נקה, tout en laissant en note l’équivalent contextuel « rester impuni ». « Ceux qui n’étaient pas tenus de boire la coupe » conserve sans surinterprétation l’idée de ce qui ne leur était pas juridiquement dû.
  issues:
  - severity: medium
    issue: La particule הִנֵּה n’est pas rendue.
    rationale: Les deux-points font déjà partie de la construction « voici ce que dit » et ne portent pas de manière identifiable la force déictique de הִנֵּה. « Voici » après la formule d’introduction la restitue naturellement.
  - severity: medium
    issue: « N’étaient pas destinés à boire » est trop orienté vers le destin.
    rationale: מִשְׁפָּט évoque le droit, le jugement ou ce qui est dû, plutôt qu’une simple destination. « N’étaient pas tenus de boire » préserve mieux la portée judiciaire sans imposer « condamnés ».
  - severity: medium
    issue: « Épargné » affaiblit la nuance judiciaire de נקה et la note sur la coupe est ancrée après « certainement » plutôt qu’à « coupe ».
    rationale: נקה au niphal signifie être déclaré innocent, acquitté, ou ne pas être puni. « Acquitté » est le rendu principal le plus proche; l’alternative contextuelle peut être signalée. Une note expliquant l’image de la coupe doit être attachée au mot qu’elle explique.
  revised_text: 'Car ainsi parle Yahweh : Voici, ceux qui n’étaient pas tenus de boire la coupe[a] la boiront certainement. Et toi, serais-tu pour autant acquitté[b] ? Tu ne seras pas acquitté, car tu la boiras certainement.'
  revised_footnotes:
  - marker: a
    text: La « coupe » est une image prophétique du jugement que Dieu fait subir aux nations.
    reason: metaphor_clarification
  - marker: b
    text: 'Ou : « resterais-tu impuni ? Tu ne resteras pas impuni ». Le verbe peut aussi signifier « être acquitté ».'
    reason: lexical_alternative
  revision_rationale: La révision rend explicitement הִנֵּה, remplace une formulation orientée vers le destin par une expression qui conserve la nuance de dû ou d’obligation judiciaire de מִשְׁפָּט, et adopte « acquitté » pour le vocabulaire de נקה. Elle conserve l’ambiguïté interprétative dans la note et replace l’ancre de la note métaphorique sur « coupe ».
