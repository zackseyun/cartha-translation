  text: נֻסוּ֩ נֻּ֨דוּ מְאֹ֜ד הֶעְמִ֧יקוּ לָ/שֶׁ֛בֶת יֹשְׁבֵ֥י חָצ֖וֹר נְאֻם יְהוָ֑ה כִּֽי יָעַ֨ץ עֲלֵי/כֶ֜ם נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עֵצָ֔ה וְ/חָשַׁ֥ב עלי/הם מַחֲשָׁבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/030.yaml
  text: Flee! Wander far away! Dwell deep[a], inhabitants of Hazor, declares Yahweh[b], for Nebuchadnezzar king of Babylon has taken counsel against you and devised a plan against you.
translation:
  language: fr
  text: Fuyez ! Partez très loin ! Allez vous établir dans des lieux reculés[a], habitants de Hatsor — oracle de Yahweh —, car Nabuchodonosor, roi de Babylone, a tenu conseil contre vous et conçu un plan contre eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « allez habiter en profondeur ». Cette expression invite à s’établir dans des endroits éloignés ou cachés.'
    reason: cultural_note
  - marker: b
    text: L’hébreu passe ici de « contre vous » à « contre eux ».
    reason: textual_note
lexical_decisions:
- source_word: נֻסוּ
  choice: Fuyez !
  rationale: Impératif pluriel direct de נוס ; « fuyez » exprime clairement l'ordre d'échapper au danger.
- source_word: נֻּדוּ מְאֹד
  choice: Partez très loin !
  rationale: נוד commande un déplacement au loin, intensifié par מְאֹד. Cette formulation française naturelle distingue ce commandement du précédent sans suggérer nécessairement une errance prolongée.
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: Retirez-vous dans des lieux reculés
  rationale: L'expression signifie littéralement rendre profond le fait d'habiter ; elle évoque ici l'installation dans des endroits éloignés ou cachés. La traduction restitue l'image idiomatique sans produire un français obscur.
- source_word: יֹשְׁבֵי חָצוֹר
  choice: habitants de Hatsor
  rationale: Le participe construit désigne les habitants du lieu. « Hatsor » translittère le nom propre חָצוֹר.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Formule prophétique solennelle qui présente les paroles comme un oracle divin ; le nom propre יהוה est rendu par « Yahweh ».
- source_word: יָעַץ ... עֵצָה
  choice: a tenu conseil
  rationale: Le couple verbe-nom souligne une délibération intentionnelle. « Tenir conseil » en conserve le champ sémantique dans un français naturel.
- source_word: עֲלֵיכֶם
  choice: contre vous
  rationale: Dans ce contexte d'hostilité militaire, la préposition על prend une valeur adversative.
- source_word: וְחָשַׁב ... מַחֲשָׁבָה
  choice: et conçu un plan
  rationale: La construction avec deux mots de même racine accentue l'élaboration volontaire du projet ; cette formulation française en communique naturellement le sens.
- source_word: עליהם
  choice: contre eux
  rationale: Le texte massorétique passe explicitement de la deuxième personne du pluriel à la troisième personne du pluriel ; la traduction conserve ce changement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, rendu ici comme nom divin plutôt que remplacé par un titre.
- issue: Changement de personne grammaticale à la fin du verset
  choice: Conserver « contre vous » puis « contre eux »
  alternative: Harmoniser les deux expressions en « contre vous »
  rationale: Le texte hébreu reçu contient ce passage de la deuxième à la troisième personne. Le conserver respecte son ambiguïté rhétorique ou textuelle sans la résoudre silencieusement.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs brefs conservent l'urgence prophétique. « Retirez-vous dans des lieux reculés » privilégie la clarté tout en signalant l'expression hébraïque dans une note. Le changement final de pronom est volontairement préservé.
