    issue: L’infinitif « habiter / s’établir » n’est pas explicite dans « Retirez-vous dans des lieux reculés ».
    rationale: הֶעְמִיקוּ לָשֶׁבֶת associe l’idée d’aller/procurer une habitation en profondeur à l’acte d’habiter. Une formulation qui mentionne l’établissement préserve mieux cette composante sans forcer un littéralisme opaque.
  - severity: low
    issue: La note a traduit l’expression par « approfondissez votre habitation », formulation trop concrète et potentiellement trompeuse.
    rationale: Le tour hébreu est idiomatique et évoque l’installation dans un lieu profond, caché ou reculé; il ne commande pas de creuser ou d’approfondir matériellement une habitation.
