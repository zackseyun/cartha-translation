  text: אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ לֹ֥א יַשְׁאִ֖רוּ עֽוֹלֵל֑וֹת אִם גַּנָּבִ֥ים בַּ/לַּ֖יְלָה הִשְׁחִ֥יתוּ דַיָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/009.yaml
  text: If grape gatherers came to you[a], would they not leave gleanings? If thieves came by night, they would destroy only enough for themselves.
translation:
  language: fr
  text: Si des vendangeurs venaient chez toi, ne laisseraient-ils pas quelques grappes à glaner ? Si des voleurs venaient pendant la nuit, ils ne détruiraient que ce qu’il leur faut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque traduite par « ce qu’il leur faut » signifie littéralement « leur assez ». On pourrait aussi comprendre : « ils ne détruiraient que jusqu’à en avoir assez » ou « seulement ce qui leur suffirait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit dans les deux propositions une comparaison hypothétique à valeur rhétorique ; « si » conserve cette force conditionnelle.
- source_word: בֹּצְרִים
  choice: des vendangeurs
  rationale: Désigne précisément ceux qui récoltent les raisins ; « vendangeurs » est le terme français naturel et exact.
- source_word: בָּאוּ לָךְ
  choice: venaient chez toi
  rationale: Rend simplement le mouvement vers Édom sans expliciter davantage l’hostilité, que le contexte permet de comprendre.
- source_word: לֹא יַשְׁאִירוּ עוֹלֵלוֹת
  choice: ne laisseraient-ils pas quelques grappes à glaner ?
  rationale: La question rhétorique exprime l’attente implicite du texte. עוֹלֵלוֹת désigne les raisins laissés après la vendange ; la formulation française explicite naturellement cette image agricole.
- source_word: גַּנָּבִים בַּלַּיְלָה
  choice: des voleurs venaient pendant la nuit
  rationale: « Voleurs » convient mieux que « brigands », et « pendant la nuit » conserve l’idée d’une venue nocturne furtive.
- source_word: הִשְׁחִיתוּ
  choice: ils ne détruiraient
  rationale: Le hifil de שׁחת exprime l’action de détruire ou de ravager. La négation française, sous-entendue par la comparaison rhétorique, rend clairement l’idée d’une dévastation limitée.
- source_word: דַיָּם
  choice: que ce qu’il leur faut
  rationale: L’expression signifie littéralement « leur suffisance » ou « leur assez » ; cette tournure idiomatique indique que les voleurs limiteraient leurs dégâts à ce qui leur suffit.
