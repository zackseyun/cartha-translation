source:
  edition: WLC
  text: כִּֽי הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖י/ךָ בַּ/גּוֹיִ֑ם בָּז֖וּי בָּ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/015.yaml
  text: For look, I have made you small among the nations, despised among men.
translation:
  language: fr
  text: Car voici, je t’ai rendu petit parmi les nations, méprisé parmi les hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: כִּי introduit ici la raison de l’annonce précédente, tandis que הִנֵּה attire solennellement l’attention sur ce que Dieu déclare.
- source_word: קָטֹן נְתַתִּיךָ
  choice: je t’ai rendu petit
  rationale: Le tour hébreu avec נָתַן et l’attribut קָטֹן signifie littéralement que Dieu a placé ou rendu Édom petit, c’est-à-dire peu important, sans préciser davantage la nature de cet abaissement.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: 'Traduction directe de la relation exprimée par בְּ : Édom est rendu petit au sein ou aux yeux de l’ensemble des nations.'
- source_word: בָּזוּי בָּאָדָם
  choice: méprisé parmi les humains
  rationale: בָּזוּי est un participe passif, « méprisé ». Le singulier collectif אָדָם désigne ici l’humanité ou les êtres humains en général; « les humains » est inclusif et actuel.
theological_decisions:
- issue: Agent divin de l’abaissement
  choice: 'Conserver la première personne : « je t’ai rendu »'
  alternative: 'Formulation passive : « tu as été rendu petit »'
  rationale: Le texte attribue explicitement à Dieu l’action exprimée par נְתַתִּיךָ; une tournure passive atténuerait cette affirmation.
- issue: Valeur temporelle de נְתַתִּיךָ
  choice: 'Passé composé : « je t’ai rendu »'
  alternative: 'Présent performatif ou futur : « je te rends / je te rendrai »'
  rationale: Le qatal présente l’acte comme accompli ou arrêté. Le passé composé français conserve cette perspective sans exclure une déclaration prophétique dont l’exécution est certaine.
translation_notes:
  register: Français moderne, international et digne. « Car voici » garde à la fois le lien logique et l’appel solennel à l’attention. « Humains » rend le collectif אָדָם sans limiter le propos aux seuls hommes de sexe masculin.
