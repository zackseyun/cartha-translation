  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים אשוב אֶת שבית עֵילָ֖ם נְאֻם יְהוָֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/039.yaml
  text: But in the latter days I will restore the fortunes of Elam[a], declares Yahweh.
translation:
  language: fr
  text: Mais dans les derniers jours, je rétablirai la situation d’Élam[a], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ramènerai les captifs d’Élam ». La formule hébraïque de restauration peut désigner précisément un retour de captivité ou, plus largement, le rétablissement de la situation d’un peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Mais
  rationale: La formule introduit ici le retournement futur qui suit l’annonce du jugement. « Mais » rend naturellement cette transition adversative en français sans conserver inutilement le tour « il arrivera que ».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: dans les derniers jours
  rationale: Cette expression prophétique désigne un temps futur et peut avoir une portée eschatologique. « Dans les derniers jours » en préserve le poids et l’ambiguïté sans préciser davantage le calendrier.
- source_word: אשוב אֶת שבית
  choice: je rétablirai la situation
  rationale: Avec שְׁבוּת, le verbe שׁוּב forme une formule de restauration pouvant évoquer le retour de captivité aussi bien qu’un rétablissement plus général. Cette formulation française reste naturelle et suffisamment large.
- source_word: עֵילָם
  choice: Élam
  rationale: Translittération française usuelle du nom du peuple et de la région.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » conserve la solennité de la formule prophétique, tandis que « Yahweh » rend le nom divin personnel יְהוָה plutôt que de lui substituer un titre.
theological_decisions:
- issue: Portée prophétique ou eschatologique de בְּאַחֲרִית הַיָּמִים
  choice: dans les derniers jours
  alternative: dans les temps à venir ; à la fin des jours
  rationale: Le texte donne à l’expression un poids prophétique, mais ne définit pas assez précisément l’époque visée pour justifier un scénario eschatologique particulier.
- issue: Sens de la formule אשוב אֶת שבית עֵילָם
  choice: rétablissement au sens large de la situation d’Élam
  alternative: retour de captivité ou retour des captifs d’Élam
  rationale: La formule hébraïque peut viser concrètement le retour des déportés, mais aussi plus largement le renversement du jugement et la restauration du peuple. Le texte principal conserve cette ampleur, et la note signale la lecture plus étroite.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe est concise comme dans l’oracle hébreu. « Les derniers jours » conserve la résonance prophétique, et « rétablirai la situation » évite de limiter sans preuve la promesse au seul retour physique des captifs.
