id: JER.49.11
reference: Jeremiah 49:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָזְבָ֥/ה יְתֹמֶ֖י/ךָ אֲנִ֣י אֲחַיֶּ֑ה וְ/אַלְמְנֹתֶ֖י/ךָ עָלַ֥/י תִּבְטָֽחוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/011.yaml
  text: Leave your fatherless children; I will keep them alive[a]. And let your widows trust in me.
translation:
  language: fr
  text: 'Laisse tes enfants sans père : moi, je les garderai en vie[a] ; et que tes veuves mettent leur confiance en moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les ferai vivre ». Le verbe hébreu peut exprimer le fait de donner la vie ou de maintenir en vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְבָה
  choice: Laisse
  rationale: L’impératif qal masculin singulier signifie « laisser », avec ici la nuance possible de laisser derrière soi ou de confier. « Laisse » conserve la force directe sans durcir inutilement en « abandonne ».
- source_word: יְתֹמֶיךָ
  choice: tes enfants sans père
  rationale: יָתוֹם désigne particulièrement l’enfant privé de père. Cette formulation naturelle préserve cette précision, tandis qu’« orphelins » peut suggérer en français la perte des deux parents.
- source_word: אֲנִי
  choice: moi, je
  rationale: Le pronom indépendant explicite met le locuteur en relief. « Moi, je » rend cette insistance en français courant et digne.
- source_word: אֲחַיֶּה
  choice: je les garderai en vie
  rationale: Le piel de חיה exprime ici l’action de faire vivre ou de maintenir en vie. La formulation retenue restitue clairement cette valeur causative.
- source_word: וְאַלְמְנֹתֶיךָ
  choice: et que tes veuves
  rationale: Le nom signifie « veuves » ; avec la forme verbale qui suit, la proposition se lit naturellement comme une exhortation ou une invitation.
- source_word: עָלַי
  choice: en moi
  rationale: Avec בטח, la préposition עַל introduit l’objet de la confiance. « Mettre leur confiance en moi » est l’expression idiomatique française appropriée.
- source_word: תִּבְטָחוּ
  choice: mettent leur confiance
  rationale: La forme qal, féminin pluriel, s’accorde avec « veuves » et peut avoir une valeur jussive. Cette tournure conserve cette valeur sans la transformer en simple affirmation.
theological_decisions:
- issue: Identité du locuteur et promesse de protection divine au sein d’un oracle contre Édom
  choice: Conserver la parole directe et emphatique du locuteur divin, qui promet de maintenir en vie les enfants sans père et invite les veuves à se confier en lui.
  alternative: Formuler une assurance générale de survie sans souligner l’intervention personnelle du locuteur.
  rationale: Dans le contexte, le locuteur est le SEIGNEUR. Le pronom emphatique אֲנִי et la première personne doivent rester visibles. La traduction maintient ainsi la tension entre le jugement prononcé contre Édom et le souci exprimé pour les personnes vulnérables, sans développer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond à l’adresse masculine singulière de l’hébreu. Le point-virgule distingue les deux propositions tout en maintenant leur unité.
