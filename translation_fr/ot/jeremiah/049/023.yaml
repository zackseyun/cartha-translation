base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/023.yaml
  text: 'Concerning Damascus: Hamath and Arpad are put to shame[a], for they have heard bad news; they melt away. There is anxiety like the sea; it cannot be quiet.'
translation:
  language: fr
  text: 'Au sujet de Damas : Hamath et Arpad sont couvertes de honte, car elles ont appris une mauvaise nouvelle. Elles fondent. L’inquiétude est comme la mer[a] : elle ne peut se calmer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile ; littéralement : « dans/sur la mer, inquiétude ; se calmer, elle ne le peut pas ». Le vers peut signifier soit que l’inquiétude est semblable à la mer qui ne peut être calme, soit qu’il y a de l’inquiétude dans ou sur la mer et qu’elle ne peut être apaisée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַמֶּשֶׂק
  choice: Au sujet de Damas
  rationale: Dans le titre de cet oracle, la préposition לְ introduit le thème. « Au sujet de » reste plus neutre que « contre », même si le contexte est celui du jugement.
- source_word: בּוֹשָׁה חֲמָת וְאַרְפָּד
  choice: Hamath et Arpad sont couvertes de honte
  rationale: Le verbe, féminin singulier en hébreu, accompagne ici deux noms de villes dans une formulation collective. Le féminin pluriel français convient aux villes personnifiées et exprime leur humiliation publique.
- source_word: שְׁמֻעָה רָעָה
  choice: une mauvaise nouvelle
  rationale: L’expression désigne l’annonce d’un malheur. Cette traduction naturelle conserve la portée générale du rapport sans préciser indûment son contenu.
- source_word: נָמֹגוּ
  choice: Elles se liquéfient de peur
  rationale: Le verbe évoque littéralement le fait de fondre ou de se dissoudre, et figurativement la perte de courage. L’ajout « de peur » explicite naturellement en français la valeur métaphorique sans effacer l’image.
- source_word: בַּיָּם דְּאָגָה
  choice: Leur inquiétude est comme la mer
  rationale: Le texte hébreu est difficile. Cette lecture comprend בַּיָּם comme une comparaison implicite et relie l’agitation à la mer, conformément à la proposition suivante sur l’impossibilité de s’apaiser.
- source_word: הַשְׁקֵט לֹא יוּכָל
  choice: elle ne peut s’apaiser
  rationale: La tournure exprime l’incapacité à être calme. Le pronom peut renvoyer à l’inquiétude personnifiée, tout en maintenant l’image de la mer agitée.
