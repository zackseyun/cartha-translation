  text: מַה תִּתְהַֽלְלִי֙ בָּֽ/עֲמָקִ֔ים זָ֣ב עִמְקֵ֔/ךְ הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה הַ/בֹּֽטְחָה֙ בְּ/אֹ֣צְרֹתֶ֔י/הָ מִ֖י יָב֥וֹא אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/004.yaml
  text: Why do you boast in the valleys[a], your valley flowing away, O faithless daughter, who trusts in her treasures, saying, ‘Who will come against me?’
translation:
  language: fr
  text: 'Pourquoi te vantes-tu de tes vallées, de ta vallée ruisselante[a], fille rebelle, toi qui te fies à tes trésors et qui dis : « Qui viendra contre moi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. On peut aussi comprendre : « ta vallée où coule l’eau », « ta vallée débordante » ou « ta vallée fertile ». Elle évoque peut-être les ressources naturelles ou la position défensive qui donnaient à la ville un sentiment de sécurité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלְלִי
  choice: te vantes-tu
  rationale: Le hitpael de הלל exprime ici l’exaltation de soi. « Se vanter » est naturel en français moderne et conserve le ton de reproche.
- source_word: בָּעֲמָקִים
  choice: de tes vallées
  rationale: Le nom désigne concrètement des vallées. La préposition « de » dépend naturellement de « se vanter » en français; le possessif, explicité par le contexte d’adresse et par « ta vallée » qui suit, rend la formulation idiomatique.
- source_word: זָב עִמְקֵךְ
  choice: de ta vallée ruisselante[a]
  rationale: L’expression hébraïque est difficile. « Ruisselante » conserve l’image de ce qui coule sans décider s’il s’agit précisément d’abondance d’eau, de débordement ou de fertilité. La reprise avec « de » rattache l’apposition au verbe « se vanter ».
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: fille rebelle
  rationale: שׁוֹבֵבָה évoque celle qui se détourne et se montre rétive. « Rebelle » est actuel, digne et conserve la portée morale sans imposer le vocabulaire confessionnel de l’apostasie.
- source_word: הַבֹּטְחָה בְּאֹצְרֹתֶיהָ
  choice: toi qui te fies à tes trésors
  rationale: « Se fier à » exprime la confiance mal placée; « trésors » garde le sens concret de richesses accumulées. La deuxième personne harmonise en français la proposition participiale avec l’apostrophe féminine.
- source_word: מִי יָבֹוא אֵלָי
  choice: Qui viendra contre moi ?
  rationale: « Venir contre » préserve le mouvement exprimé par בוא et rend la valeur hostile que le contexte donne à אֶל, sans expliciter davantage par « attaquer ».
theological_decisions:
- issue: Personnification féminine d’Ammon
  choice: Conserver l’image de la « fille » interpellée à la deuxième personne.
  alternative: Remplacer la personnification par « peuple rebelle » ou par le nom d’Ammon.
  rationale: Le féminin singulier structure la rhétorique prophétique du texte hébreu; le conserver évite de neutraliser cette image.
- issue: Portée de שׁוֹבֵבָה
  choice: « rebelle »
  alternative: « infidèle », « égarée » ou « apostate »
  rationale: « Rebelle » maintient la tension entre égarement et révolte sans réduire le terme à l’infidélité conjugale ni affirmer explicitement une apostasie complète.
translation_notes:
  register: Français international moderne, avec une apostrophe prophétique soutenue mais immédiatement compréhensible. Le parallélisme et la personnification féminine sont conservés; la syntaxe est légèrement explicitée pour rester naturelle en français.
