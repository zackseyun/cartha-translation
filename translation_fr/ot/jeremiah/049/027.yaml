  text: וְ/הִצַּ֥תִּי אֵ֖שׁ בְּ/חוֹמַ֣ת דַּמָּ֑שֶׂק וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בֶּן הֲדָֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/027.yaml
  text: And I will kindle a fire in the wall of Damascus[a], and it will consume the palaces of Ben-hadad.
translation:
  language: fr
  text: J’allumerai un feu dans la muraille de Damas[a], et il consumera les palais de Ben-Hadad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre la muraille de Damas ». La préposition hébraïque peut avoir une nuance spatiale légèrement différente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: Je mettrai le feu
  rationale: Le hifil à la première personne exprime l’action causative directe du locuteur divin. « Mettre le feu » est naturel en français moderne tout en conservant cette causalité.
- source_word: אֵשׁ
  choice: le feu
  rationale: Après « mettre », l’expression idiomatique française « mettre le feu » rend naturellement l’hébreu sans exiger l’article indéfini employé en anglais.
- source_word: בְּחוֹמַת
  choice: à la muraille de
  rationale: La préposition ב peut ici désigner le lieu ou la cible du feu. « À la muraille » préserve cette légère indétermination spatiale; une autre lecture possible est signalée en note.
- source_word: דַּמָּשֶׂק
  choice: Damas
  rationale: Forme française usuelle du nom de lieu.
- source_word: וְאָכְלָה
  choice: et il dévorera
  rationale: Le verbe, littéralement « manger », a le feu pour sujet et décrit sa puissance destructrice. « Dévorera » conserve cette image avec force et naturel; le pronom masculin suit le genre français de « feu ».
- source_word: אַרְמְנוֹת
  choice: les palais
  rationale: Le terme désigne des palais ou résidences royales fortifiées. « Palais » convient au contexte dynastique de Ben-Hadad sans réduire le mot à de simples forteresses.
- source_word: בֶּן הֲדָד
  choice: Ben-Hadad
  rationale: Transcription française biblique claire du nom ou titre royal composé.
theological_decisions:
- issue: Locuteur divin implicite et agent du jugement
  choice: 'Conserver la première personne directe : « Je mettrai »'
  alternative: Ajouter « Le Seigneur dit » ou identifier explicitement Dieu
  rationale: Le contexte identifie déjà le locuteur divin. L’ajout d’une identification absente de ce verset alourdirait et expliciterait indûment le texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Mettre le feu » est idiomatique sans être familier; « dévorera » maintient l’image vigoureuse du feu. Le marqueur [a] est placé immédiatement après « Damas ».
