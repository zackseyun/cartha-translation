  rationale: 'La révision corrige uniquement deux nuances : elle rend le verbe de vol sans le limiter au vol plané et elle retire l’intensification non nécessaire de « en plein ». Elle maintient l’ambiguïté concernant l’identité de l’assaillant et l’ensemble des choix toponymiques et terminologiques du projet.'
