review_pass:
  verdict: revise
  source_fidelity: La structure, le sujet masculin implicite, l’image de l’aigle, Botsra, les guerriers d’Édom et la comparaison avec une femme en travail sont fidèlement rendus. Toutefois, « planera » restreint וְיִדְאֶה à un vol plané, alors que le verbe désigne plus largement le fait de voler. « Prendra son envol » rend le mouvement de vol sans introduire la descente de « fondre sur » ni la restriction de « planer ».
  naturalness: Le français est globalement naturel et d’un registre prophétique sobre. « Une femme en travail » est plus direct et plus neutre que « une femme en plein travail », dont « en plein » ajoute une intensification non exprimée par l’hébreu.
  terminology: « Voici », « aigle », « Botsra », « guerriers d’Édom » et « cœur » sont appropriés. La note conserve avec justesse l’alternative lexicale « vautour » pour נֶשֶׁר, sans trancher indûment le débat.
  issues:
  - severity: medium
    issue: « planera » pour וְיִדְאֶה
    rationale: Le verbe hébreu signifie voler/prendre son vol; « planera » évoque plus précisément le vol plané et réduit inutilement le sens. « Prendra son envol » est fidèle et idiomatique.
  - severity: low
    issue: « en plein travail » ajoute une nuance d’intensité
    rationale: L’expression française est compréhensible, mais « en plein » n’est pas requis par מְצֵרָה. « En travail » conserve l’image de la femme en couches avec davantage de sobriété.
  revised_text: 'Voici[a] : comme un aigle, il s’élèvera, prendra son envol et déploiera ses ailes sur Botsra. En ce jour-là, le cœur des guerriers d’Édom sera comme celui d’une femme en travail.'
  revised_footnotes:
