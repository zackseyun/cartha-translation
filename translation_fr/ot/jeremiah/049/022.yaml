source:
  edition: WLC
  text: הִנֵּ֤ה כַ/נֶּ֨שֶׁר֙ יַעֲלֶ֣ה וְ/יִדְאֶ֔ה וְ/יִפְרֹ֥שׂ כְּנָפָ֖י/ו עַל בָּצְרָ֑ה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י אֱדוֹם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/022.yaml
  text: Behold[a], like an eagle he will rise up and swoop down and spread his wings over Bozrah, and the heart of Edom’s warriors on that day will become like the heart of a woman in labor.
translation:
  language: fr
  text: 'Voici[a] : comme un aigle, il s’élèvera, prendra son envol et déploiera ses ailes sur Botsra. En ce jour-là, le cœur des guerriers d’Édom sera comme celui d’une femme en travail.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un vautour » ; le mot hébreu peut désigner plus largement un grand rapace.
    reason: Alternative lexicale authentique pour נֶשֶׁר.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la formule prophétique qui attire solennellement l’attention, dans un français actuel et digne.
- source_word: כַנֶּשֶׁר
  choice: comme un aigle
  rationale: נֶשֶׁר désigne un grand rapace et peut aussi être compris comme un vautour; « aigle » est la traduction conventionnelle et convient à l’image menaçante.
- source_word: יַעֲלֶה
  choice: il s’élèvera
  rationale: Rend directement le mouvement ascendant sans préciser l’identité du sujet implicite.
- source_word: וְיִדְאֶה
  choice: planera
  rationale: Le verbe évoque le vol ou le vol plané rapide. « Planera » respecte ce mouvement sans ajouter explicitement une descente absente du verbe.
- source_word: וְיִפְרֹשׂ כְּנָפָיו
  choice: et déploiera ses ailes
  rationale: Expression française naturelle qui conserve l’image de l’oiseau étendant ses ailes.
- source_word: עַל בָּצְרָה
  choice: sur Botsra
  rationale: « Sur » correspond à l’image des ailes déployées au-dessus de la ville; Botsra est la forme française usuelle du toponyme.
- source_word: לֵב גִּבּוֹרֵי אֱדוֹם
  choice: le cœur des guerriers d’Édom
  rationale: « Guerriers » rend le sens militaire de גִּבּוֹרֵי, tandis que « cœur » préserve l’expression anthropologique hébraïque sans la réduire à la seule notion de courage.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formulation prophétique idiomatique qui conserve le repère temporel démonstratif.
- source_word: וְהָיָה
  choice: sera
  rationale: Rend sobrement le verbe « être »; le contexte suffit à indiquer l’état produit par la menace.
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: comme celui d’une femme en plein travail
  rationale: Le pronom « celui » évite la répétition de « cœur », tandis que « en plein travail » exprime naturellement la détresse liée aux douleurs de l’accouchement.
theological_decisions:
- issue: Identité de l’assaillant comparé à un aigle
  choice: Maintien du pronom masculin singulier « il » sans identification explicite
  alternative: Identifier le roi de Babylone, Nabuchodonosor, YHWH ou une puissance envahissante indéterminée
  rationale: Le contexte peut orienter vers l’envahisseur babylonien, mais le verset laisse son sujet implicite. La traduction conserve cette ouverture littéraire et théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve l’élan de l’oracle et son imagerie, sans identifier le sujet implicite ni expliciter la peur au-delà de la comparaison hébraïque.
