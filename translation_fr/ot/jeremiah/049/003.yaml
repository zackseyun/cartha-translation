id: JER.49.3
reference: Jeremiah 49:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵילִ֨ילִי חֶשְׁבּ֜וֹן כִּ֣י שֻׁדְּדָה עַ֗י צְעַקְנָה֮ בְּנ֣וֹת רַבָּה֒ חֲגֹ֣רְנָה שַׂקִּ֔ים סְפֹ֕דְנָה וְ/הִתְשׁוֹטַ֖טְנָה בַּ/גְּדֵר֑וֹת כִּ֤י מַלְכָּ/ם֙ בַּ/גּוֹלָ֣ה יֵלֵ֔ךְ כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יַחְדָּֽיו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/003.yaml
  text: Wail[a], Heshbon, for Ai is devastated! Cry out, daughters of Rabbah! Put on sackcloth, mourn, and wander about among the walls, for their king will go into exile, together with his priests and his officials.
translation:
  language: fr
  text: Lamente-toi, Heshbon, car Aï est dévastée ! Criez, filles de Rabba ! Revêtez-vous de toile de sac, prenez le deuil et errez çà et là parmi les murs, car leur roi[a] partira en exil, avec ses prêtres et ses chefs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Milkom partira en exil » (également transcrit « Malkam »), si l’hébreu désigne ici le dieu des Ammonites plutôt que « leur roi ».
    reason: Lecture alternative du texte consonantique et préservation d’une ambiguïté théologiquement significative.
lexical_decisions:
- source_word: הֵילִילִי
  choice: Lamente-toi
  rationale: Impératif féminin singulier de ילל, adressé à la ville personnifiée. « Lamente-toi » exprime un cri de détresse dans un français actuel et digne.
- source_word: חֶשְׁבּוֹן
  choice: Heshbon
  rationale: Nom de lieu translittéré selon l’usage international.
- source_word: שֻׁדְּדָה
  choice: est dévastée
  rationale: Le passif de שׁדד évoque une dévastation violente, souvent accompagnée de pillage. « Est dévastée » conserve cette portée sans préciser indûment destruction totale ou pillage.
- source_word: עַי
  choice: Aï
  rationale: Le texte massorétique donne ce nom de lieu. La graphie française « Aï » évite une prononciation trompeuse.
- source_word: צְעַקְנָה
  choice: Criez
  rationale: Impératif féminin pluriel de צעק, qui désigne ici un cri de détresse ou de lamentation.
- source_word: בְּנוֹת רַבָּה
  choice: filles de Rabba
  rationale: Conserve l’image hébraïque des « filles », pouvant désigner les habitantes ou les localités dépendantes de Rabba; les impératifs féminins et le contexte de deuil soutiennent l’adresse personnifiée.
- source_word: חֲגֹרְנָה שַׂקִּים
  choice: Revêtez-vous de toile de sac
  rationale: Rend clairement l’expression rituelle de deuil sans conserver le littéralisme peu naturel « ceignez-vous de sacs ».
- source_word: סְפֹדְנָה
  choice: prenez le deuil
  rationale: ספד désigne la lamentation funèbre ou le deuil public. Cette formulation française s’intègre naturellement à la série d’impératifs.
- source_word: וְהִתְשׁוֹטַטְנָה
  choice: errez çà et là
  rationale: La forme intensive ou itérative évoque des déplacements agités et répétés; « çà et là » en fait entendre le caractère désordonné.
- source_word: בַּגְּדֵרוֹת
  choice: parmi les murs
  rationale: גדרות peut désigner des murs, clôtures ou enceintes. Dans cette lamentation urbaine, « parmi les murs » convient au contexte tout en restant moins précis que « murailles ».
- source_word: מַלְכָּם
  choice: leur roi
  rationale: La vocalisation massorétique indique « leur roi ». Le texte consonantique permet aussi d’y reconnaître le nom du dieu ammonite Milkom; cette autre lecture est signalée en note.
- source_word: בַּגּוֹלָה יֵלֵךְ
  choice: partira en exil
  rationale: Formule courante de déportation. « Partira en exil » est idiomatique et conserve le mouvement exprimé par יֵלֵךְ.
- source_word: שָׂרָיו
  choice: ses chefs
  rationale: שׂרים désigne des responsables, princes ou hauts fonctionnaires. « Chefs » reste assez large pour ne pas imposer une fonction administrative précise.
theological_decisions:
- issue: 'מַלְכָּם : roi humain ou dieu ammonite Milkom'
  choice: leur roi
  alternative: Milkom (également transcrit Malkam), dieu des Ammonites
  rationale: La vocalisation du texte massorétique soutient « leur roi », et les possessifs de « ses prêtres et ses chefs » s’accordent avec cette lecture. Comme le texte consonantique permet aussi le nom de la divinité ammonite et que le contexte peut soutenir cette interprétation, l’autre lecture est conservée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les villes sont personnifiées au féminin, conformément aux formes impératives hébraïques. La succession brève des impératifs conserve l’urgence et le rythme de la lamentation prophétique.
