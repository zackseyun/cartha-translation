  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֡ן הִנֵּה֩ יָמִ֨ים בָּאִ֜ים נְאֻם יְהוָ֗ה וְ֠/הִשְׁמַעְתִּי אֶל רַבַּ֨ת בְּנֵי עַמּ֜וֹן תְּרוּעַ֣ת מִלְחָמָ֗ה וְ/הָֽיְתָה֙ לְ/תֵ֣ל שְׁמָמָ֔ה וּ/בְנֹתֶ֖י/הָ בָּ/אֵ֣שׁ תִּצַּ֑תְנָה וְ/יָרַ֧שׁ יִשְׂרָאֵ֛ל אֶת יֹרְשָׁ֖י/ו אָמַ֥ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/002.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will cause the battle cry to be heard against Rabbah of the Ammonites, and it will become a desolate mound, and its daughter towns will be set on fire. Then Israel will dispossess those who dispossessed him[c][b], says Yahweh.
translation:
  language: fr
  text: C’est pourquoi, voici que des jours viennent — oracle de Yahweh — où je ferai retentir contre Rabba des Ammonites le cri de guerre[a]. Elle deviendra un tertre désolé, et les villes qui dépendent d’elle[b] seront incendiées. Alors Israël dépossédera ceux qui l’avaient dépossédé[c], dit Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la clameur de la guerre » ou « l’alarme de guerre ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses filles », expression désignant les petites villes ou localités dépendant d’une ville principale.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu emploie deux formes de la même racine : Israël « dépossédera » ceux qui l’avaient « dépossédé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence du jugement annoncé au verset précédent.
- source_word: הִנֵּה יָמִים בָּאִים
  choice: voici que des jours viennent
  rationale: Conserve la formule prophétique et sa force d’annonce, dans un registre soutenu mais compréhensible.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Distingue cette formule prophétique solennelle de אָמַר, rendu plus loin par « dit ».
- source_word: וְהִשְׁמַעְתִּי
  choice: je ferai retentir
  rationale: Exprime la valeur causative du hiphil tout en restant idiomatique en français.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Rabba des Ammonites
  rationale: Rend naturellement le nom de la capitale et l’appartenance ethnique exprimée par « fils d’Ammon ».
- source_word: תְּרוּעַת מִלְחָמָה
  choice: le cri de guerre
  rationale: Évoque clairement une clameur ou un signal martial sans préciser indûment s’il s’agit d’un cri humain ou d’une alarme.
- source_word: וְהָיְתָה לְתֵל שְׁמָמָה
  choice: Elle deviendra un monceau désolé
  rationale: Préserve l’image concrète de la ville réduite à un tertre ou amas de ruines, sans employer le terme archéologique « tell ».
- source_word: וּבְנֹתֶיהָ
  choice: les villes qui dépendent d’elle
  rationale: Rend le sens de l’expression idiomatique « ses filles » en explicitant le lien entre la ville principale et les localités environnantes.
- source_word: בָּאֵשׁ תִּצַּתְנָה
  choice: seront incendiées
  rationale: Traduction concise et naturelle du passif indiquant qu’elles seront mises à feu.
- source_word: וְיָרַשׁ יִשְׂרָאֵל אֶת יֹרְשָׁיו
  choice: Israël dépossédera ceux qui l’avaient dépossédé
  rationale: Reproduit le jeu sur la même racine verbale et conserve Israël comme antécédent collectif singulier.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Suffixe masculin singulier de יֹרְשָׁיו appliqué à Israël
  choice: l’avaient dépossédé
  alternative: les avaient dépossédés
  rationale: Le pronom singulier respecte la présentation grammaticale d’Israël comme entité collective, sans transformer le référent en pluriel.
- issue: Rapport temporel entre les deux actes de dépossession
  choice: ceux qui l’avaient dépossédé
  alternative: ceux qui le dépossèdent
  rationale: 'Le plus-que-parfait rend clairement le renversement annoncé: Israël dépossédera ceux qui l’ont auparavant privé de son territoire. Le texte hébreu ne marque toutefois pas explicitement ce temps relatif.'
translation_notes:
  register: Français international moderne, digne et prophétique. La ponctuation met en relief la formule d’oracle sans alourdir la phrase. « Rabba » est traitée au féminin comme une ville. Le vocabulaire reste concret et accessible, tout en conservant les images et le jeu verbal de l’hébreu.
