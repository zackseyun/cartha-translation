  text: שְׁמוּעָ֤ה שָׁמַ֨עְתִּי֙ מֵ/אֵ֣ת יְהוָ֔ה וְ/צִ֖יר בַּ/גּוֹיִ֣ם שָׁל֑וּחַ הִֽתְקַבְּצוּ֙ וּ/בֹ֣אוּ עָלֶ֔י/הָ וְ/ק֖וּמוּ לַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/014.yaml
  text: 'I have heard a report from Yahweh[a], and a messenger has been sent among the nations: “Gather yourselves, and come against her[b], and rise up for battle.”'
translation:
  language: fr
  text: 'J’ai entendu une nouvelle venant de Yahweh, et un messager[a] a été envoyé parmi les nations : « Rassemblez-vous, venez contre elle[b] et levez-vous pour le combat ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, pour « messager » : « envoyé » ou « ambassadeur ».'
    reason: lexical_alternative
  - marker: b
    text: Le pronom « elle » désigne Édom, personnifié au féminin dans le contexte.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁמוּעָה שָׁמַעְתִּי
  choice: J’ai reçu une nouvelle
  rationale: La construction associe le nom « nouvelle, information entendue » au verbe « entendre ». Une traduction littérale par « j’ai entendu une nouvelle » est possible, mais « j’ai reçu une nouvelle » exprime naturellement en français la réception d’une information sans modifier le sens.
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: מֵאֵת indique la source ou la provenance. « De la part de » convient à une communication transmise et le nom divin est rendu par « Yahweh ».
- source_word: צִיר
  choice: un messager
  rationale: Le mot peut désigner un messager, un envoyé ou un ambassadeur. « Messager » reste clair et suffisamment large; les nuances diplomatiques possibles sont signalées en note.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: La préposition בְּ et le pluriel גּוֹיִם désignent ici les peuples environnants. « Parmi les nations » conserve cette portée sans connotation théologique ultérieure.
- source_word: שָׁלוּחַ
  choice: a été envoyé
  rationale: Le participe passif présente le messager comme ayant été dépêché. Le passé composé est naturel dans ce compte rendu prophétique.
- source_word: הִתְקַבְּצוּ
  choice: Rassemblez-vous
  rationale: L’impératif pluriel à valeur réfléchie appelle les nations à se regrouper. « Rassemblez-vous » est direct, actuel et fidèle.
- source_word: וּבֹאוּ עָלֶיהָ
  choice: venez contre elle
  rationale: Avec בוא, la préposition עַל exprime ici un mouvement hostile. La formulation conserve le pronom féminin du texte hébreu plutôt que de remplacer celui-ci dans le corps du verset.
- source_word: וְקוּמוּ לַמִּלְחָמָה
  choice: levez-vous pour le combat
  rationale: La traduction garde le mouvement exprimé par קום et rend מִלְחָמָה par « combat », adapté à cet appel militaire immédiat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Référent du pronom féminin עָלֶיהָ
  choice: elle, avec clarification en note
  alternative: Édom
  rationale: Le texte hébreu emploie un pronom féminin, dont le contexte identifie le référent à Édom personnifié. Garder « elle » préserve la forme et la personnification du texte.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les impératifs conservent la vigueur de la convocation militaire. Les deux marqueurs de note figurent dans le texte principal.
