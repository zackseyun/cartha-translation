source:
  edition: WLC
  text: לִ/בְנֵ֣י עַמּ֗וֹן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/בָנִ֥ים אֵין֙ לְ/יִשְׂרָאֵ֔ל אִם יוֹרֵ֖שׁ אֵ֣ין ל֑/וֹ מַדּ֗וּעַ יָרַ֤שׁ מַלְכָּ/ם֙ אֶת גָּ֔ד וְ/עַמּ֖/וֹ בְּ/עָרָ֥י/ו יָשָֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/001.yaml
  text: 'Concerning the sons of Ammon[a], thus says Yahweh: Does Israel have no sons? Does he have no heir? Why then has Milcom taken possession of Gad, and his people settled in its cities?'
translation:
  language: fr
  text: 'Au sujet des fils d’Ammon, ainsi parle Yahvé :


    « Israël n’a-t-il pas de fils ?

    N’a-t-il pas d’héritier ?

    Pourquoi donc Milkom[a] a-t-il pris possession de Gad,

    et son peuple s’est-il installé dans ses villes ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se lire « leur roi » : « Pourquoi donc leur roi a-t-il pris possession de Gad… ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי עַמּוֹן
  choice: Au sujet des fils d’Ammon
  rationale: La préposition ל introduit ici le destinataire ou le thème de l’oracle. « Au sujet de » convient à ce titre prophétique, tandis que « fils d’Ammon » conserve l’expression hébraïque et reste intelligible en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » restitue le nom divin plutôt que de lui substituer un titre.
- source_word: הֲבָנִים אֵין לְיִשְׂרָאֵל
  choice: Israël n’a-t-il pas de fils ?
  rationale: La question rhétorique est rendue naturellement. « Fils » préserve la référence aux descendants susceptibles d’hériter.
- source_word: אִם יוֹרֵשׁ אֵין לוֹ
  choice: N’a-t-il pas d’héritier ?
  rationale: Dans ce contexte, אִם poursuit l’interrogation rhétorique. Le singulier « héritier » correspond à יוֹרֵשׁ et maintient le motif juridique de l’héritage.
- source_word: מַדּוּעַ יָרַשׁ
  choice: Pourquoi donc … a-t-il pris possession de
  rationale: ירש désigne ici l’appropriation d’un territoire. « Prendre possession de » conserve le lien avec l’héritage sans suggérer une transmission légitime.
- source_word: מַלְכָּם
  choice: Milkom
  rationale: La vocalisation massorétique permet d’y reconnaître le dieu ammonite Milkom. La lecture également possible « leur roi » est signalée en note afin de ne pas supprimer l’ambiguïté du texte.
- source_word: אֶת גָּד
  choice: Gad
  rationale: Le texte nomme simplement Gad; le contexte indique qu’il s’agit de son territoire tribal.
- source_word: וְעַמּוֹ בְּעָרָיו יָשָׁב
  choice: et pourquoi son peuple s’est-il installé dans ses villes ?
  rationale: « S’est installé » exprime naturellement l’occupation durable indiquée par ישב. Les suffixes masculins singuliers sont conservés par « son » et « ses », sans expliciter davantage que l’hébreu l’antécédent de « ses villes ».
theological_decisions:
- issue: Lecture de מַלְכָּם
  choice: Milkom, le dieu des Ammonites
  alternative: leur roi
  rationale: Les consonnes hébraïques admettent les deux analyses. La vocalisation reçue et le contexte de l’oracle contre Ammon favorisent le nom divin « Milkom », mais l’autre lecture demeure textuellement possible et est donc conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions rhétoriques et le parallélisme poétique sont conservés. Le nom divin est rendu par « Yahvé », forme française usuelle.
