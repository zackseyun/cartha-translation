revisions:
- from: Je ferai venir contre Élam les quatre vents des quatre extrémités du ciel[a], et je les disperserai à tous ces vents. Il n’y aura aucune nation où n’iront les gens d’Élam ainsi dispersés[b].
  to: Je ferai venir contre Élam les quatre vents venant des quatre extrémités du ciel[a], et je les disperserai à tous ces vents. Il n’y aura aucune nation où les exilés d’Élam n’iront pas[b].
  rationale: La révision explicite que les vents viennent des extrémités du ciel, conformément à la préposition hébraïque, et remplace la paraphrase finale par un terme français naturel qui rend les personnes chassées d’Élam. La répétition intentionnelle de « vents » et la portée universelle de la double négation sont conservées.
