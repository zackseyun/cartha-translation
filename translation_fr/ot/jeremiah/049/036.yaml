  text: וְ/הֵבֵאתִ֨י אֶל עֵילָ֜ם אַרְבַּ֣ע רוּח֗וֹת מֵֽ/אַרְבַּע֙ קְצ֣וֹת הַ/שָּׁמַ֔יִם וְ/זֵ֣רִתִ֔י/ם לְ/כֹ֖ל הָ/רֻח֣וֹת הָ/אֵ֑לֶּה וְ/לֹֽא יִהְיֶ֣ה הַ/גּ֔וֹי אֲשֶׁ֛ר לֹֽא יָב֥וֹא שָׁ֖ם נִדְּחֵ֥י עולם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/036.yaml
  text: I will bring against Elam the four winds from the four ends of the heavens[a], and I will scatter them to all these winds[b]. There will be no nation to which the outcasts of Elam will not go.
translation:
  language: fr
  text: Je ferai venir contre Élam les quatre vents venant des quatre extrémités du ciel[a], et je les disperserai à tous ces vents. Il n’y aura aucune nation où les exilés d’Élam n’iront pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des quatre coins du ciel ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les bannis d’Élam » ou « les dispersés d’Élam ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶל עֵילָם
  choice: Je ferai venir contre Élam
  rationale: Le hifil de בוא avec אֶל peut exprimer l’action de faire venir vers ou contre quelqu’un. Le contexte de jugement justifie « contre », sans effacer l’idée de mouvement.
- source_word: אַרְבַּע רוּחוֹת
  choice: les quatre vents
  rationale: רוּחוֹת désigne ici les vents correspondant aux différentes directions, comme le confirme la mention des quatre extrémités du ciel.
- source_word: מֵאַרְבַּע קְצוֹת הַשָּׁמַיִם
  choice: des quatre extrémités du ciel
  rationale: קְצוֹת signifie les bouts ou extrémités. Le singulier collectif français « ciel » rend naturellement הַשָּׁמַיִם dans cette expression.
- source_word: וְזֵרִתִים
  choice: et je les disperserai
  rationale: זרה peut évoquer le vannage, mais désigne ici l’action de disperser un peuple. « Disperser » convient au registre prophétique et reste naturel.
- source_word: לְכֹל הָרֻחוֹת הָאֵלֶּה
  choice: à tous ces vents
  rationale: La formulation conserve l’image des vents déjà introduite, au lieu de l’expliciter par « directions ».
- source_word: וְלֹא יִהְיֶה הַגּוֹי אֲשֶׁר לֹא יָבוֹא שָׁם
  choice: Il n’y aura aucune nation où n’iront
  rationale: Cette construction française préserve la double négation hébraïque et la portée universelle de la dispersion, tout en exprimant le mouvement vers les nations.
- source_word: נִדְּחֵי עֵילָם
  choice: les gens d’Élam ainsi dispersés
  rationale: נִדְּחֵי désigne ceux qui ont été chassés, bannis ou dispersés. Cette formulation relie clairement le groupe à l’action précédente et évite le sens social moderne parfois dominant de « exclus ».
theological_decisions: []
