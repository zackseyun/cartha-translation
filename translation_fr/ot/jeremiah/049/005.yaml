    issue: « Me voici » pour הִנְנִי מֵבִיא
    rationale: Dans cette construction prophétique, הִנְנִי signifie idiomatiquement « Voici que je... » / « Voici, je... », en introduisant une action imminente. « Me voici » peut se comprendre comme une réponse de présence et est donc moins précis.
  - severity: low
    issue: « personne ne rassemblera le fuyard »
    rationale: Bien que défendable littéralement, cette expression est peu naturelle en français et peut donner l’impression qu’il s’agit d’un seul individu identifié. « celui qui fuit » conserve le singulier substantivé du texte tout en restant fluide; la note maintient les autres possibilités.
