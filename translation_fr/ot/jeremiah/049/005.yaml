source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא עָלַ֜יִ/ךְ פַּ֗חַד נְאֻם אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת מִ/כָּל סְבִיבָ֑יִ/ךְ וְ/נִדַּחְתֶּם֙ אִ֣ישׁ לְ/פָנָ֔י/ו וְ/אֵ֥ין מְקַבֵּ֖ץ לַ/נֹּדֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/005.yaml
  text: Behold[a], I am bringing terror upon you from all around you, declares the Lord GOD of hosts, and each man will be driven out before him[b], with no one to gather the fugitive.
translation:
  language: fr
  text: Voici, je fais venir sur toi, de tous côtés, la terreur — déclaration du Seigneur Yahweh des armées. Vous serez chassés, chacun droit devant soi[a], et personne ne rassemblera celui qui fuit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacun devant lui ». L’expression hébraïque est concise et peut décrire une fuite désordonnée où chacun se précipite sans se soucier des autres.
    reason: lexical_alternative
  - marker: b
    text: Ou « celui qui erre » ou « le fuyard ».
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי מֵבִיא
  choice: 'Me voici : je fais venir'
  rationale: 'La construction avec הִנְנִי et le participe présente avec solennité une action divine imminente. « Me voici : je fais venir » en conserve la vivacité prophétique.'
- source_word: פַּחַד
  choice: la terreur
  rationale: Dans ce contexte de jugement, le mot désigne une peur intense et paralysante plutôt qu’une simple crainte.
- source_word: מִכָּל סְבִיבַיִךְ
  choice: de tous côtés
  rationale: Cette expression idiomatique évoque une menace qui surgit de tout l’environnement de la personne interpellée.
- source_word: וְנִדַּחְתֶּם
  choice: Vous serez chassés
  rationale: Le niphal de נדח exprime ici le fait d’être repoussé et dispersé par la force.
- source_word: אִישׁ לְפָנָיו
  choice: chacun droit devant soi
  rationale: La formule hébraïque, très concise, a une valeur distributive et décrit vraisemblablement une fuite individuelle précipitée. « Chacun » rend naturellement cette portée sans imposer en français un masculin référentiel inutile.
- source_word: וְאֵין מְקַבֵּץ
  choice: et personne ne rassemblera
  rationale: La proposition souligne qu’aucun secours ne viendra regrouper les personnes dispersées.
- source_word: לַנֹּדֵד
  choice: le fuyard
  rationale: Le participe substantivé au singulier désigne celui qui est contraint de fuir ou d’errer; « le fuyard » conserve le singulier et convient au contexte.
theological_decisions:
- issue: Traduction de נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: déclaration du Seigneur Yahweh des armées
  alternative: oracle du Seigneur Yahweh, Dieu des armées
  rationale: « Déclaration » garde la fonction solennelle de נְאֻם; « Yahweh » représente explicitement le nom divin יהוה, tandis que « des armées » maintient sans l’expliciter l’ambivalence traditionnelle de צְבָאוֹת.
- issue: Portée de אִישׁ dans la formule distributive
  choice: chacun
  alternative: chaque homme
  rationale: Ici, אִישׁ fonctionne distributivement au sein d’un groupe en fuite. « Chacun » exprime exactement cette individualisation en français courant sans transformer une forme grammaticale masculine en précision biologique absente du contexte.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le passage du singulier « sur toi » au pluriel « vous serez chassés » est conservé, car il reflète le changement de nombre du texte hébreu. Les marqueurs de notes sont placés sur les expressions auxquelles les variantes se rapportent.
