id: JER.49.6
reference: Jeremiah 49:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אָשִׁ֛יב אֶת שְׁב֥וּת בְּנֵֽי עַמּ֖וֹן נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/006.yaml
  text: But afterward I will restore the fortunes of the people of Ammon[a], declares Yahweh.
translation:
  language: fr
  text: Mais après cela, je rétablirai la situation du peuple d’Ammon[a], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ramènerai les captifs du peuple d’Ammon ». L’expression hébraïque peut désigner la fin d’une captivité ou, plus largement, un rétablissement de la situation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Mais après cela
  rationale: L’expression est temporelle (« après cela »), tandis que « mais » marque naturellement le passage, dans le contexte, du jugement à la restauration.
- source_word: אָשִׁיב
  choice: je rétablirai
  rationale: Le hiphil de שׁוב signifie ici « ramener » ou « rétablir »; avec שְׁבוּת, « rétablirai » rend naturellement la formule de restauration.
- source_word: אֶת שְׁבוּת
  choice: la situation
  rationale: Dans la formule הֵשִׁיב אֶת־שְׁבוּת, le terme peut désigner le renversement de la captivité ou, plus largement, le rétablissement d’une situation favorable. « La situation » conserve cette portée générale sans exclure le retour de captivité.
- source_word: בְּנֵי עַמּוֹן
  choice: du peuple d’Ammon
  rationale: Littéralement « des fils d’Ammon »; la formulation choisie exprime clairement en français moderne le sens collectif, ethnique et national.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: נְאֻם est une formule prophétique solennelle, rendue naturellement par « déclare »; le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Promesse de restauration d’Ammon après le jugement
  choice: Présenter comme réelle la restauration future du peuple d’Ammon, sans en préciser davantage la nature ni l’étendue.
  alternative: Limiter la promesse à une restauration strictement politique, ou l’interpréter exclusivement de façon spirituelle.
  rationale: L’hébreu annonce un acte futur de restauration concernant le peuple d’Ammon, mais n’en définit ni les modalités ni l’ampleur. La traduction maintient cette réserve et la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « après cela » respecte la séquence temporelle, et « déclare Yahweh » conserve le caractère solennel de la formule prophétique.
