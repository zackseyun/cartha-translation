  source_fidelity: 'Le projet rend fidèlement les principales images et les questions rhétoriques : le lion, les fourrés du Jourdain, le pâturage sûr, la fuite soudaine, l’établissement d’un homme choisi et l’incomparabilité du locuteur. Une légère retouche rend plus idiomatique en français le mouvement provenant des fourrés et l’établissement « sur lui/à sa tête » sans modifier l’ambiguïté référentielle du texte hébreu.'
  naturalness: Le registre est moderne et soutenu. « Il montera des fourrés » est toutefois moins naturel et peut faire entendre que le lion gravit les fourrés plutôt qu’il en sort. « Il montera depuis les fourrés » conserve le mouvement ascendant tout en indiquant clairement le point de départ. « J’y établirai » est également plus fluide que « j’établirai sur ce lieu ».
  terminology: « Fourrés du Jourdain », « pâturage sûr », « convoquera » et « berger » sont des choix justes et cohérents. Les notes conservent les alternatives importantes de גאון et יעד. « Berger » maintient à bon droit l’image sans la réduire à un titre politique.
