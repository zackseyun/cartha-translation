  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤יעָה אֲרִיצֶ֨/נּוּ מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יֹעִידֶ֔/נִּי וּ/מִי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/019.yaml
  text: Look[a], like a lion he will come up from the thicket of the Jordan against a secure pasture; for in an instant I will make him run from it, and I will appoint over it whomever is chosen. For who is like me[b], and who will summon me? And who is the shepherd who can stand before me?
translation:
  language: fr
  text: 'Voici[a] : tel un lion, il montera depuis les fourrés du Jourdain contre un pâturage sûr. Car, en un instant, je le ferai fuir de là, et j’y établirai celui qui est choisi. En effet, qui est comme moi ? Qui me convoquera[b] ? Et quel berger pourrait tenir devant moi ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’orgueil/la majesté du Jourdain » ; cette expression hébraïque désigne probablement la végétation dense et luxuriante de ses rives.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Qui me fixera un rendez-vous ? » ; l’expression peut aussi avoir une nuance judiciaire : « Qui m’assignera ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force déictique et l’immédiateté de l’annonce dans un français actuel et digne.
- source_word: כְּאַרְיֵה יַעֲלֶה
  choice: tel un lion, il montera
  rationale: Maintient la comparaison explicite et le mouvement ascendant exprimé par עלה.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: des fourrés du Jourdain
  rationale: Dans cet idiome récurrent de Jérémie, גאון désigne vraisemblablement la végétation luxuriante des rives du Jourdain, habitat des lions. Le sens plus littéral est signalé en note.
- source_word: נְוֵה אֵיתָן
  choice: un pâturage sûr
  rationale: נוה évoque un pâturage ou un lieu d’habitation, tandis que איתן exprime la solidité et la sécurité.
- source_word: כִּי אַרְגִּיעָה
  choice: Car, en un instant
  rationale: Rend la valeur adverbiale de soudaineté du hifil de רגע sans ajouter de contenu absent du texte.
- source_word: אֲרִיצֶנּוּ מֵעָלֶיהָ
  choice: je le ferai fuir de là
  rationale: Préserve la valeur causative du verbe. « De là » évite une discordance artificielle de genre en français tout en renvoyant au lieu visé.
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: et j’établirai sur ce lieu celui qui est choisi
  rationale: Le syntagme hébreu est condensé. Cette formulation conserve l’idée d’un individu choisi et celle de son établissement sur le lieu, sans préciser davantage l’identité de celui qui choisit.
- source_word: מִי כָמוֹנִי
  choice: qui est comme moi ?
  rationale: Traduit directement la formule rhétorique d’incomparabilité.
- source_word: וּמִי יֹעִידֶנִּי
  choice: Qui me convoquera ?
  rationale: Le hifil de יעד peut désigner le fait d’assigner ou de convoquer quelqu’un à une rencontre, éventuellement dans un cadre judiciaire. « Convoquera » conserve cette force sans imposer un scénario précis.
- source_word: רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  choice: quel berger pourrait tenir devant moi ?
  rationale: Garde la métaphore du berger, qui peut évoquer un dirigeant, et exprime la capacité mise en cause par la question rhétorique.
theological_decisions:
- issue: Identité du locuteur à la première personne
  choice: Conserver « je/moi » sans ajouter « le Seigneur » dans le verset.
  alternative: Identifier explicitement le locuteur comme le Seigneur.
  rationale: Le contexte présente un oracle divin, mais ce verset emploie la première personne sans répéter le nom divin. La traduction respecte cette forme.
- issue: Sens métaphorique de רֹעֶה
  choice: Traduire littéralement par « berger ».
  alternative: Expliciter par « chef » ou « dirigeant ».
  rationale: Le terme peut désigner un souverain, mais l’image pastorale appartient au texte et maintient une tension expressive qu’une explicitation supprimerait.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Les images du lion, du pâturage et du berger sont conservées. La syntaxe rhétorique reste vive, tandis que les principales ambiguïtés lexicales sont indiquées en notes.
