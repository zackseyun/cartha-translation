source:
  edition: WLC
  text: וְ/הַחְתַּתִּ֣י אֶת עֵ֠ילָם לִ/פְנֵ֨י אֹיְבֵי/הֶ֜ם וְ/לִ/פְנֵ֣י מְבַקְשֵׁ֣י נַפְשָׁ֗/ם וְ/הֵבֵאתִ֨י עֲלֵי/הֶ֧ם רָעָ֛ה אֶת חֲר֥וֹן אַפִּ֖/י נְאֻם יְהוָ֑ה וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/037.yaml
  text: I will shatter Elam before their enemies and before those who seek their life[a]. I will bring disaster on them, my burning anger, declares Yahweh[c][b], and I will send the sword after them until I have consumed them.
translation:
  language: fr
  text: Je briserai Élam[a] devant leurs ennemis et devant ceux qui cherchent à leur ôter la vie[b]. Je ferai venir sur eux le malheur[c], mon ardente colère — déclaration de Yahweh —, et j’enverrai l’épée à leur poursuite jusqu’à ce que je les aie anéantis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je sèmerai la terreur parmi Élam » ou « je consternerai Élam ». Le verbe hébreu peut souligner la panique provoquée ou l’effondrement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui cherchent leur vie », expression qui désigne ceux qui cherchent à les tuer.
    reason: lexical_alternative
  - marker: c
    text: Ou « le désastre » ou « la calamité ». Ici, le terme hébreu désigne le malheur du jugement, non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחְתַּתִּי
  choice: Je briserai
  rationale: Le hiphil de חתת peut exprimer l’action de briser, d’épouvanter ou de consterner. « Je briserai » conserve ici à la fois l’idée d’effondrement militaire et celle de terreur, sans réduire le jugement à une simple émotion.
- source_word: עֵילָם
  choice: Élam
  rationale: Translittération française usuelle du nom propre.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: devant ses ennemis
  rationale: לִפְנֵי signifie ici « devant, en présence de ». Le français emploie le singulier collectif « ses », car Élam désigne le peuple ou le pays, tandis que l’hébreu passe au pluriel pour ses membres.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: ceux qui en veulent à sa vie
  rationale: Expression française naturelle qui rend l’idiome hébreu « ceux qui cherchent leur vie », c’est-à-dire ceux qui cherchent à les tuer, tout en gardant le motif de la vie recherchée.
- source_word: וְהֵבֵאתִי עֲלֵיהֶם רָעָה
  choice: Je ferai venir sur eux le malheur
  rationale: Dans ce contexte de jugement prophétique, רָעָה désigne une calamité infligée plutôt qu’un mal moral. « Malheur » est naturel, digne et laisse entendre le désastre annoncé.
- source_word: אֶת חֲרוֹן אַפִּי
  choice: mon ardente colère
  rationale: Cette expression conserve la métaphore de la chaleur portée par חֲרוֹן et la force de la colère divine.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique solennelle נְאֻם sans la confondre avec le simple verbe « dire », et restitue directement le nom divin.
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת־הַחֶרֶב
  choice: j’enverrai l’épée à leur poursuite
  rationale: Préserve l’image vive de l’épée personnifiée envoyée derrière eux, avec un français plus naturel que « après eux ».
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: jusqu’à ce que je les anéantisse
  rationale: כלה exprime ici l’achèvement total du jugement. « Anéantisse » communique clairement cette portée dans le contexte, sans employer le tour ambigu « les finir ».
theological_decisions:
- issue: Sens de רָעָה appliqué à l’action divine
  choice: le malheur
  alternative: le mal ; le désastre ; la calamité
  rationale: Le contexte militaire et judiciaire indique un malheur ou une calamité, non une faute morale commise par Dieu. Ce choix traduit le sens contextuel sans neutraliser la sévérité du jugement.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte le Tétragramme. « Yahweh » restitue le nom propre et suit la convention demandée, sans remplacer celui-ci par un titre.
- issue: Alternance grammaticale entre Élam et les pronoms pluriels
  choice: « sa vie » puis « sur eux / leur / les »
  alternative: harmoniser entièrement au singulier ou au pluriel
  rationale: L’hébreu nomme Élam comme entité collective, puis renvoie à ses membres au pluriel. Le français conserve autant que possible cette tension collective sans rendre la phrase artificielle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde les images fortes de l’hébreu — Élam brisé, colère ardente, épée lancée à la poursuite — et maintient le passage du collectif singulier aux référents pluriels. Les tirets isolent naturellement la formule prophétique.
