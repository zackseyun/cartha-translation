  to: Je briserai Élam[a] devant leurs ennemis et devant ceux qui cherchent à leur ôter la vie[b]. Je ferai venir sur eux le malheur[c], mon ardente colère — déclaration de Yahweh —, et j’enverrai l’épée à leur poursuite jusqu’à ce que je les aie anéantis.
  rationale: La révision rétablit les référents pluriels explicitement présents dans le texte hébreu, sans supprimer Élam comme collectif. Elle ajoute la note nécessaire sur le verbe initial, dont le champ sémantique n’autorise pas à présenter « briserai » comme seul sens possible. Les notes sont renumérotées et ancrées à leurs termes respectifs. Aucune modification doctrinale n’est introduite.
