base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/029.yaml
  text: They will take their tents and their flocks; they will carry off their tent curtains and all their goods and their camels[a], and they will cry out against them, “Terror on every side!”
translation:
  language: fr
  text: 'Ils prendront leurs tentes et leurs troupeaux ; ils emporteront les tentures de leurs tentes, tous leurs biens et leurs chameaux, et ils crieront à leur sujet[a] : « Terreur de tous côtés ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils crieront contre eux » ou « ils crieront sur eux ». L’expression hébraïque peut désigner un cri lancé sur eux, à leur sujet ou contre eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵיהֶם
  choice: leurs tentes
  rationale: אֹהֶל désigne naturellement les habitations mobiles des populations nomades évoquées dans ce contexte.
- source_word: צֹאנָם
  choice: leurs troupeaux
  rationale: צֹאן désigne collectivement le petit bétail, notamment moutons et chèvres ; « troupeaux » conserve cette portée.
- source_word: יִקָּחוּ
  choice: ils prendront
  rationale: Le qal de לקח signifie couramment « prendre » ; le contexte militaire fait entendre l’idée de saisie sans qu’il soit nécessaire de la renforcer dans la traduction.
- source_word: יְרִיעוֹתֵיהֶם
  choice: leurs tentures
  rationale: יְרִיעָה désigne une pièce d’étoffe servant de rideau ou de couverture de tente. Après « leurs tentes », « leurs tentures » est clair et concis.
- source_word: כָּל־כְּלֵיהֶם
  choice: tous leurs biens
  rationale: כְּלִי peut désigner des objets, ustensiles, équipements ou effets ; dans cette liste de butin, « biens » restitue naturellement le sens collectif.
- source_word: גְּמַלֵּיהֶם
  choice: leurs chameaux
  rationale: Traduction directe du pluriel de גָּמָל avec suffixe possessif.
- source_word: יִשְׂאוּ לָהֶם
  choice: ils emporteront
  rationale: נשא exprime ici le fait d’emporter comme butin. Le datif לָהֶם peut indiquer leur profit, nuance suffisamment portée par le contexte français.
- source_word: וְקָרְאוּ עֲלֵיהֶם
  choice: et l’on criera à leur sujet
  rationale: קרא על peut introduire un cri lancé sur, contre ou au sujet de personnes. La tournure impersonnelle respecte l’absence de sujet explicitement exprimé et préserve la latitude de la préposition.
- source_word: מָגוֹר מִסָּבִיב
  choice: Terreur de tous côtés !
  rationale: Cette formule récurrente chez Jérémie décrit une terreur environnante. « De tous côtés » est idiomatique en français et conserve son caractère frappant.
