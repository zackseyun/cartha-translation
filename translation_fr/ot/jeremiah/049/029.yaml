  - severity: low
    issue: Référent des « tentures » légèrement implicite.
    rationale: יַלִיעוֹת désigne ici des panneaux, rideaux ou couvertures de tente. « Les tentures de leurs tentes » explicite le référent contextuel et évite que « tentures » soit compris comme un décor fixe.
