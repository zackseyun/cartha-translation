source:
  edition: WLC
  text: וְ/הָיְתָ֨ה חָצ֜וֹר לִ/מְע֥וֹן תַּנִּ֛ים שְׁמָמָ֖ה עַד עוֹלָ֑ם לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/033.yaml
  text: Hazor will become a haunt of jackals[a], a desolation forever; no man will dwell there[b], and no son of man will sojourn in it.
translation:
  language: fr
  text: Hatsor deviendra un repaire de chacals[a], une désolation à jamais. Aucun homme n’y habitera[b], et aucun fils d’homme n’y séjournera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une demeure pour les chacals ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « aucun homme… aucun fils d’homme » ; autrement dit, aucun être humain n’y vivra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: deviendra
  rationale: 'Dans ce discours prophétique, la forme exprime naturellement le résultat futur d’un changement d’état : Hatsor sera transformée en lieu désolé.'
- source_word: חָצוֹר
  choice: Hatsor
  rationale: Nom propre de lieu, translittéré selon l’usage français courant.
- source_word: לִמְעוֹן
  choice: un repaire de
  rationale: מָעוֹן désigne un lieu d’habitation. « Repaire » rend naturellement l’image d’animaux sauvages occupant une ville en ruine, tandis que la note conserve la formulation plus littérale.
- source_word: תַּנִּים
  choice: chacals
  rationale: Dans les formules prophétiques décrivant des ruines, le terme désigne vraisemblablement des chacals plutôt que des créatures mythiques.
- source_word: שְׁמָמָה
  choice: une désolation
  rationale: Cette formulation conserve la force nominale du terme hébreu et le caractère solennel de la formule de jugement.
- source_word: עַד עוֹלָם
  choice: à jamais
  rationale: Expression française concise et digne pour une durée indéfiniment prolongée dans ce contexte de jugement.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: Aucun homme n’y habitera
  rationale: יָשַׁב signifie habiter ou demeurer. « Homme » conserve le substantif masculin singulier אִישׁ, employé ici avec une portée générique.
- source_word: וְלֹא יָגוּר בָּהּ
  choice: et aucun fils d’homme n’y séjournera
  rationale: גוּר évoque le séjour ou la résidence, souvent temporaire ou étrangère, et se distingue ainsi de « habiter » dans le membre parallèle.
- source_word: בֶּן אָדָם
  choice: fils d’homme
  rationale: 'La traduction littérale maintient le parallélisme et l’expression hébraïque, tandis que la note en explicite ici le sens générique : aucun être humain.'
theological_decisions:
- issue: Langage masculin désignant l’humanité dans la formule de jugement
  choice: Conserver « aucun homme » et « aucun fils d’homme » dans le texte principal
  alternative: « personne… aucun être humain »
  rationale: L’hébreu emploie אִישׁ et בֶּן אָדָם au masculin singulier avec une portée représentative. La traduction conserve cette forme sans nier son sens générique, explicité en note.
translation_notes:
  register: Français international moderne, sobre et solennel. « Repaire » rend concrètement l’image de la ville ruinée occupée par des animaux sauvages ; « désolation à jamais » conserve la cadence prophétique. Le parallélisme hébreu entre « homme » et « fils d’homme » est maintenu et clarifié par une note.
