id: JER.49.38
reference: Jeremiah 49:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י כִסְאִ֖/י בְּ/עֵילָ֑ם וְ/הַאֲבַדְתִּ֥י מִ/שָּׁ֛ם מֶ֥לֶךְ וְ/שָׂרִ֖ים נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/038.yaml
  text: And I will set my throne in Elam[a], and I will destroy from there king and officials[b], declares Yahweh.
translation:
  language: fr
  text: Je placerai mon trône en Élam[a], et j’en ferai disparaître le roi et les chefs[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’établirai mon trône en Élam ». Le verbe hébreu peut signifier « mettre », « placer » ou « établir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les dirigeants » ou « les dignitaires ». Le terme hébreu désigne des personnes de haut rang exerçant une autorité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Je placerai
  rationale: Le verbe שׂוּם signifie couramment « mettre » ou « placer ». « Placerai » rend naturellement l’action sans ajouter l’idée d’une installation nécessairement permanente.
- source_word: כִסְאִי
  choice: mon trône
  rationale: כִּסֵּא désigne ici le trône royal ou judiciaire. L’image concrète de la souveraineté et du jugement divins est conservée.
- source_word: בְּעֵילָם
  choice: en Élam
  rationale: La préposition בְּ est locative dans ce contexte. « En Élam » évite d’introduire le sens adversatif « contre Élam », qui n’est pas exprimé directement.
- source_word: וְהַאֲבַדְתִּי מִשָּׁם
  choice: j’en ferai disparaître
  rationale: Le hiphil de אבד exprime le fait de causer la perte ou la disparition, tandis que מִשָּׁם indique l’éloignement hors de ce lieu. Cette tournure française rend ensemble les deux éléments avec clarté.
- source_word: מֶלֶךְ
  choice: le roi
  rationale: Bien que le nom hébreu soit sans article, le français demande naturellement l’article défini pour désigner la fonction royale d’Élam dans ce contexte.
- source_word: וְשָׂרִים
  choice: et les chefs
  rationale: שָׂרִים désigne les hauts responsables, dirigeants ou dignitaires. « Chefs » est actuel, large et fidèle au rang politique visé.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique est rendue de façon concise et solennelle, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. La translittération conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de l’image « mon trône »
  choice: Conserver l’image concrète du trône
  alternative: mon règne ou mon tribunal
  rationale: Le trône peut évoquer à la fois la souveraineté et le jugement de Dieu. La traduction préserve cette richesse sans réduire l’image à une seule interprétation.
- issue: Force de והאבדתי משם
  choice: j’en ferai disparaître
  alternative: je détruirai là-bas
  rationale: La formulation retenue conserve la valeur causative du verbe et la notion d’éloignement exprimée par מִשָּׁם, sans préciser indûment le mode de cette disparition.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste accessible tout en conservant l’image royale du texte hébreu et la formule prophétique finale.
