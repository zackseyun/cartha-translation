  text: אֵ֥יךְ לֹֽא עֻזְּבָ֖ה עִ֣יר תהלה קִרְיַ֖ת מְשׂוֹשִֽׂ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/025.yaml
  text: How is the city of praise not abandoned[b][a], the city of my joy?
translation:
  language: fr
  text: Comment se fait-il que la ville célébrée, la cité de ma joie[a], n’ait pas été abandonnée ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « ma joie » ; l’identité du locuteur n’est pas certaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment se fait-il que
  rationale: Cette tournure française rend la question exclamative et l’étonnement de la lamentation sans la réduire à une demande strictement causale (« pourquoi »).
- source_word: לֹא עֻזְּבָה
  choice: elle n’ait pas été abandonnée
  rationale: Le parfait passif féminin singulier s’accorde avec « ville ». Après « Comment se fait-il que », le subjonctif passé est naturel en français et conserve explicitement la négation surprenante de l’hébreu.
- source_word: עִיר תהלה
  choice: la ville célébrée
  rationale: תהלה désigne littéralement la louange et, appliqué à une ville, la présente naturellement comme louée ou renommée. « Ville célébrée » garde ce lien lexical dans un français idiomatique.
- source_word: קִרְיַת
  choice: la cité
  rationale: La reprise par « cité » maintient l’apposition poétique et évite une répétition lourde de « ville ».
- source_word: מְשׂוֹשִׂי
  choice: qui faisait ma joie
  rationale: Le nom exprime la joie ou l’allégresse et porte un suffixe de première personne. La formulation conserve ce « ma » tout en étant naturelle pour décrire une cité chère au locuteur.
theological_decisions:
- issue: Identité du locuteur dans « ma joie »
  choice: Conserver la première personne sans identifier le locuteur
  alternative: Remplacer par « sa joie » ou attribuer explicitement les mots à Damas, à ses habitants ou à Dieu
  rationale: Le suffixe hébreu est clairement à la première personne, mais le contexte ne tranche pas avec certitude l’identité de la voix qui se lamente. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la forme interrogative-exclamative et la négation inhabituelle de l’hébreu. « Ville célébrée » rend l’idée d’une ville faisant l’objet de louanges, tandis que « cité » maintient le parallélisme poétique.
