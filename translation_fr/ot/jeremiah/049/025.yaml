- from: Comment se fait-il qu’elle n’ait pas été abandonnée, la ville célébrée, la cité qui faisait ma joie[a] ?
  to: Comment se fait-il que la ville célébrée, la cité de ma joie[a], n’ait pas été abandonnée ?
