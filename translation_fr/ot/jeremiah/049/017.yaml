revisions:
- from: Édom deviendra un lieu dévasté[a] ; tous ceux qui passeront près d’elle seront consternés et siffleront[b] devant toutes ses blessures.
  to: Édom deviendra un lieu de désolation[a] ; tous ceux qui passeront devant elle seront consternés et siffleront à cause de toutes ses blessures[b].
  rationale: 'La révision resserre la fidélité aux relations spatiales et causales du texte hébreu, tout en conservant le registre moderne, la personnification féminine d’Édom et l’ambiguïté du sifflement. Les deux appels de note restent correctement ancrés : [a] au terme de désolation et [b] au verbe « siffleront ».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:23Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’annonce future, Édom, la réaction de stupeur et le sifflement. Toutefois, « passer près d’elle » est moins précis que l’hébreu עֹבֵר עָלֶיהָ, qui décrit ceux qui passent devant/à côté d’elle. « Lieu de désolation » rend plus directement לְשַׁמָּה que « lieu dévasté », en conservant la notion de désolation devenue objet de stupeur. Pour la dernière expression, « à cause de toutes ses blessures » exprime naturellement en français la réaction suscitée par les coups/plaies d’Édom.
  naturalness: La formulation révisée reste moderne et fluide. « Passer devant elle » est idiomatique et plus net. « Lieu de désolation » appartient à un registre biblique sobre, tout en restant compréhensible en français international. « À cause de toutes ses blessures » évite le lien un peu imprécis de « devant toutes ses blessures ».
  terminology: Édom est la forme française usuelle. « Désolation » reflète le champ sémantique de שַׁמָּה (ruine, dévastation et spectacle effrayant). « Consternés » convient à יִשֹּׁם. « Siffleront » est fidèle à יִשְׁרֹק; la note explique sans imposer un sens unique entre stupeur et dérision. « Blessures » est une restitution recevable de מַכּוֹת, littéralement « coups », dans cette image de jugement.
  issues:
  - severity: medium
    issue: « près d’elle » atténue le rapport spatial de עֹבֵר עָלֶיהָ.
    rationale: La formule peut signifier simplement passer à proximité, tandis que « passer devant elle » rend plus directement des passants confrontés à l’état d’Édom.
  - severity: low
    issue: « un lieu dévasté » est moins proche du substantif abstrait לְשַׁמָּה que « un lieu de désolation ».
    rationale: Le second conserve plus clairement l’idée de désolation et la connotation d’objet de stupéfaction, que la note peut expliciter.
  - severity: low
    issue: « devant toutes ses blessures » ne rend pas nettement la relation exprimée par עַל.
    rationale: Dans ce contexte, le sifflement est provoqué par les coups ou plaies d’Édom; « à cause de » exprime ce lien de manière naturelle.
  revised_text: Édom deviendra un lieu de désolation[a] ; tous ceux qui passeront devant elle seront consternés et siffleront à cause de toutes ses blessures[b].
  revised_footnotes:
  - marker: a
    text: Ou « un spectacle effroyable ». Le terme hébreu évoque à la fois la dévastation et l’effroi qu’elle provoque.
    reason: lexical_alternative
  - marker: b
    text: Ce sifflement est un signe de stupéfaction ou de dérision.
    reason: cultural_clarification
  revision_rationale: 'La révision resserre la fidélité aux relations spatiales et causales du texte hébreu, tout en conservant le registre moderne, la personnification féminine d’Édom et l’ambiguïté du sifflement. Les deux appels de note restent correctement ancrés : [a] au terme de désolation et [b] au verbe « siffleront ».'
