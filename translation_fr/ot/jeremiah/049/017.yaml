  text: וְ/הָיְתָ֥ה אֱד֖וֹם לְ/שַׁמָּ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/017.yaml
  text: Edom will become a desolation[b][a]; everyone who passes by her will be appalled and will whistle at all her wounds.
translation:
  language: fr
  text: Édom deviendra un lieu de désolation[a] ; tous ceux qui passeront devant elle seront consternés et siffleront à cause de toutes ses blessures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un spectacle effroyable ». Le terme hébreu évoque à la fois la dévastation et l’effroi qu’elle provoque.
    reason: lexical_alternative
  - marker: b
    text: Ce sifflement est un signe de stupéfaction ou de dérision.
    reason: cultural_clarification
lexical_decisions:
- source_word: וְהָיְתָה
  choice: deviendra
  rationale: Dans ce contexte prophétique, la forme exprime un état futur résultant ; « deviendra » le rend naturellement en français.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Nom propre traditionnel du peuple et du territoire.
- source_word: לְשַׁמָּה
  choice: un lieu dévasté
  rationale: Le nom évoque à la fois la dévastation et l’effroi qu’elle inspire. « Un lieu dévasté » exprime clairement l’état du pays, tandis qu’une note conserve la nuance de spectacle effroyable.
- source_word: כָּל עֹבֵר עָלֶיהָ
  choice: tous ceux qui passeront près d’elle
  rationale: La construction collective est rendue idiomatiquement au pluriel. Le pronom féminin maintient la personnification hébraïque du territoire.
- source_word: יִשֹּׁם
  choice: seront consternés
  rationale: Le verbe décrit la réaction de stupeur horrifiée provoquée par la dévastation ; « consternés » convient au registre et au contexte.
- source_word: וְיִשְׁרֹק
  choice: siffleront
  rationale: Le verbe désigne l’émission d’un son aigu exprimant ici la stupéfaction ou la dérision. Le sens culturel étant moins évident en français moderne, il est précisé en note.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: devant toutes ses blessures
  rationale: מַכּוֹת désigne littéralement des coups, puis les blessures ou ravages qui en résultent. « Devant » présente ces blessures comme la cause du geste des passants.
theological_decisions: []
