base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/018.yaml
  text: As when Sodom and Gomorrah and their neighboring towns were overthrown[a], says Yahweh, no man will dwell there[b], and no son of man will sojourn in her.
translation:
  language: fr
  text: Comme lors du bouleversement de Sodome, de Gomorrhe et des villes voisines[a], dit Yahweh, personne n’y habitera, et aucun être humain n’y séjournera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Comme lors du renversement de Sodome, de Gomorrhe et des villes voisines. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: Comme lors du bouleversement de
  rationale: Le préfixe כְּ exprime la comparaison, et מַהְפֵּכָה un renversement catastrophique. Cette formulation française conserve le caractère comparatif sans alourdir la phrase.
- source_word: סְדֹם וַעֲמֹרָה וּשְׁכֵנֶיהָ
  choice: Sodome, de Gomorrhe et des villes voisines
  rationale: שְׁכֵנֶיהָ désigne ici les localités voisines associées à Sodome et Gomorrhe. « Villes voisines » explicite naturellement ce référent collectif.
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: La formule prophétique est rendue au présent en français, et le nom divin יהוה est transcrit « Yahweh ».
- source_word: יֵשֵׁב
  choice: habitera
  rationale: Dans ce contexte de désolation, ישׁב signifie habiter ou demeurer. « Habitera » est naturel et garde la nuance résidentielle.
- source_word: אִישׁ
  choice: personne
  rationale: Le nom masculin singulier a ici une portée générique dans une formule de dépeuplement. « Personne » exprime clairement l’absence absolue d’habitants.
- source_word: יָגוּר
  choice: séjournera
  rationale: גור désigne le fait de résider ou séjourner, souvent sans établissement permanent. « Séjournera » maintient une distinction avec « habitera ».
- source_word: בָּהּ
  choice: y
  rationale: Le suffixe féminin singulier renvoie au lieu visé par l’oracle. Le pronom adverbial « y » est la manière naturelle de l’exprimer en français sans imposer une personnification peu idiomatique.
- source_word: בֶּן אָדָם
  choice: être humain
  rationale: L’expression signifie idiomatiquement un humain ou un mortel dans ce contexte, sans valeur de titre messianique. « Être humain » conserve le parallélisme sémantique avec אִישׁ tout en étant clair.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de אִישׁ et de בֶּן אָדָם
  choice: personne… aucun être humain
  alternative: aucun homme… aucun fils d’homme
  rationale: Dans cette formule de désolation, les deux expressions ont une portée humaine générique. Le rendu idiomatique évite en outre que « fils d’homme » soit compris à tort comme un titre messianique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’hébreu, tandis que les expressions anthropologiques sont rendues idiomatiquement. Le parallélisme entre habiter et séjourner est maintenu.
