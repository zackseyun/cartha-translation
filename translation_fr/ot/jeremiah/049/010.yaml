  text: כִּֽי אֲנִ֞י חָשַׂ֣פְתִּי אֶת עֵשָׂ֗ו גִּלֵּ֨יתִי֙ אֶת מִסְתָּרָ֔י/ו וְ/נֶחְבָּ֖ה לֹ֣א יוּכָ֑ל שֻׁדַּ֥ד זַרְע֛/וֹ וְ/אֶחָ֥י/ו וּ/שְׁכֵנָ֖י/ו וְ/אֵינֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/010.yaml
  text: For I have stripped Esau bare[a]; I have uncovered his hiding places, and he will not be able to hide himself. His offspring, his brothers, and his neighbors are destroyed[b], and he is no more.
translation:
  language: fr
  text: Car moi, j’ai mis Ésaü à nu[a] ; j’ai découvert ses cachettes, et il ne pourra pas se cacher. Sa descendance a été dévastée ; ses frères et ses voisins aussi, et lui-même n’est plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Ésaü » désigne ici le peuple issu d’Ésaü, c’est-à-dire Édom.
    reason: cross_reference
lexical_decisions:
- source_word: חָשַׂפְתִּי
  choice: j’ai mis … à nu
  rationale: Le verbe évoque l’exposition produite par le retrait de ce qui couvrait. « Mettre à nu » restitue naturellement cette image en français.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Le texte hébreu emploie le nom personnel Ésaü, ici comme désignation métonymique d’Édom ; le nom source est conservé.
- source_word: גִּלֵּיתִי
  choice: j’ai découvert
  rationale: Le verbe signifie dévoiler ou mettre au jour. « Découvrir » maintient l’image concrète d’exposition et convient à des cachettes.
- source_word: מִסְתָּרָיו
  choice: ses cachettes
  rationale: Le nom désigne des lieux où l’on se dissimule, plutôt que des secrets abstraits. « Cachettes » est précis et courant.
- source_word: וְנֶחְבָּה לֹא יוּכָל
  choice: il ne pourra pas se cacher
  rationale: La construction exprime l’incapacité à se dissimuler. Le sujet masculin singulier renvoie naturellement à Ésaü, représentant ici Édom.
- source_word: שֻׁדַּד
  choice: sont dévastés
  rationale: Le verbe peut exprimer le pillage violent ou la dévastation. « Dévastés » conserve cette force sans réduire le sens au seul fait de piller.
- source_word: זַרְעוֹ
  choice: sa descendance
  rationale: Le singulier collectif désigne les descendants. « Descendance » est naturel en français et garde la valeur collective.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le terme familial littéral est conservé ; dans cet oracle national, il peut aussi inclure des peuples apparentés.
- source_word: שְׁכֵנָיו
  choice: ses voisins
  rationale: Le mot désigne ceux qui habitent à proximité et peut, dans ce contexte, viser les peuples voisins. La traduction garde sa valeur lexicale directe.
- source_word: וְאֵינֶנּוּ
  choice: et lui-même n’est plus
  rationale: L’expression marque la disparition avec une solennelle finalité. « Lui-même » clarifie que le pronom revient à Ésaü après l’énumération.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication ou le motif du jugement annoncé.
theological_decisions:
- issue: Référent d’« Ésaü » dans un oracle contre Édom
  choice: Conserver le nom personnel « Ésaü » tout en signalant en note son emploi pour le peuple d’Édom.
  alternative: Traduire directement par « Édom ».
  rationale: Le texte source dit explicitement « Ésaü ». Préserver ce nom maintient la formulation prophétique et la relation ancestrale sans substituer une interprétation dans le corps du texte.
- issue: Portée de שֻׁדַּד sur la descendance, les frères et les voisins
  choice: Faire porter « sont dévastés » sur les trois groupes énumérés.
  alternative: Limiter explicitement le verbe à « sa descendance » et laisser les deux autres groupes dans une construction elliptique avec « ne sont plus ».
  rationale: Le verbe hébreu est au singulier, en accord immédiat avec le collectif « descendance », mais la suite coordonnée est syntaxiquement abrupte. La formulation française retient la lecture contextuelle reflétée par la consultation anglaise, tout en évitant de changer le contenu du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de l’exposition (« mis à nu », « découvert ses cachettes », « ne pourra pas se cacher ») est préservé. La dernière proposition conserve la brièveté et la finalité solennelle de l’hébreu.
