revisions:
- from: Car moi, j’ai mis Ésaü à nu[a] ; j’ai découvert ses cachettes, et il ne pourra pas se cacher. Sa descendance, ses frères et ses voisins sont dévastés[b], et lui-même n’est plus.
  to: Car moi, j’ai mis Ésaü à nu[a] ; j’ai découvert ses cachettes, et il ne pourra pas se cacher. Sa descendance a été dévastée ; ses frères et ses voisins aussi, et lui-même n’est plus.
  rationale: La dernière phrase est ajustée pour respecter le singulier de « sa descendance » et l’ellipse qui suit en hébreu, sans nier que frères et voisins participent au désastre annoncé. La note b est harmonisée avec cette syntaxe et avec la plage sémantique du verbe hébreu.
