  yaml_path: translation/ot/jeremiah/049/013.yaml
  text: For I have sworn by myself, declares the LORD, that Bozrah will become a horror, a reproach, a ruin, and a curse, and all her cities will become everlasting ruins.
translation:
  language: fr
  text: Car j’ai juré par moi-même — déclaration de l’Éternel — que Botsra deviendra un sujet de stupeur, d’opprobre, de dévastation et de malédiction, et que toutes ses villes deviendront des ruines perpétuelles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: je le jure par moi-même
  rationale: Rend explicitement l’objet implicite du serment et conserve l’idée solennelle que Dieu prend sa propre personne à témoin.
- source_word: נְאֻם יְהוָה
  choice: déclaration de l’Éternel
  rationale: Formule prophétique nominale et solennelle; « l’Éternel » est une convention française courante pour le tétragramme.
- source_word: לְשַׁמָּה
  choice: un objet de stupeur
  rationale: Le terme désigne une dévastation qui suscite l’effroi ou la stupeur; cette tournure préserve ici l’effet produit sur les témoins.
- source_word: לְחֶרְפָּה
  choice: de honte
  rationale: Exprime l’opprobre et la condition honteuse de la ville; la coordination française permet une formulation naturelle.
- source_word: לְחֹרֶב
  choice: une ruine
  rationale: Rend l’état de dévastation sans confondre le mot avec חָרְבוֹת, employé ensuite au pluriel.
- source_word: לִקְלָלָה
  choice: une malédiction
  rationale: Conserve l’idée que le sort de Botsra servira de formule ou d’exemple de malédiction.
- source_word: כָל־עָרֶיהָ
  choice: toutes les villes qui en dépendent
  rationale: Le suffixe féminin renvoie à Botsra; en contexte territorial, il s’agit naturellement des villes qui lui sont rattachées plutôt que de villes physiquement contenues en elle.
- source_word: לְחָרְבוֹת עוֹלָם
  choice: des ruines pour toujours
  rationale: Traduction directe de la durée indéfinie ou perpétuelle annoncée, dans un français naturel.
theological_decisions:
- issue: Le nom divin יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé
  rationale: Suit une convention française largement comprise sans ajouter de précision doctrinale; le titre signale le tétragramme dans cette formule prophétique.
- issue: Portée de עוֹלָם
  choice: pour toujours
  alternative: des ruines perpétuelles
  rationale: Préserve la force temporelle du texte sans tenter de déterminer théologiquement si l’expression doit être comprise de manière absolue ou selon l’horizon prophétique.
translation_notes:
  register: Français international moderne, solennel et lisible. La structure accumulative du jugement est conservée, avec une ponctuation qui met en relief la formule prophétique.
