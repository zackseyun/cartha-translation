  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל אֱד֔וֹם וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל יֹשְׁבֵ֣י תֵימָ֑ן אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נְוֵ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/020.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Edom[a], and his thoughts that he has devised against the inhabitants of Teman: Surely the little ones of the flock will drag them away[b]; surely he will make their pasture desolate over them.'
translation:
  language: fr
  text: 'C’est pourquoi, écoutez le dessein que Yahweh a conçu contre Édom, et les projets qu’il a formés contre les habitants de Témân : assurément, même les plus petits du troupeau[a] les traîneront au loin ; assurément, il dévastera leur pâturage sous leurs yeux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les plus jeunes du troupeau » ou « les moins importants du troupeau ». L’expression désigne probablement, de façon imagée, les assaillants les plus faibles ou les moins importants.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur demeure » ou « leur enclos ». Littéralement, l’hébreu dit « il dévastera leur pâturage sur eux » ; la préposition peut exprimer que cette désolation s’abat sur eux ou se produit devant eux.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’oracle précédent.
- source_word: עֲצַת יְהוָה אֲשֶׁר יָעַץ
  choice: le dessein que Yahweh a conçu
  rationale: « Dessein » exprime ici une décision délibérée, tandis que « conçu » rend le verbe apparenté sans produire une répétition maladroite.
- source_word: מַחְשְׁבוֹתָיו אֲשֶׁר חָשַׁב
  choice: les projets qu’il a formés
  rationale: Préserve la distinction lexicale avec עֵצָה tout en exprimant l’intention réfléchie.
- source_word: יֹשְׁבֵי תֵימָן
  choice: les habitants de Témân
  rationale: Rendu direct et courant de la construction hébraïque.
- source_word: אִם לֹא
  choice: oui
  rationale: La locution a ici une valeur emphatique ou quasi juratoire, non celle d’une condition littérale.
- source_word: יִסְחָבוּם
  choice: les traîneront au loin
  rationale: Conserve l’image énergique de personnes emmenées en étant traînées.
- source_word: צְעִירֵי הַצֹּאן
  choice: même les plus petits du troupeau
  rationale: Conserve l’image pastorale et la possibilité que l’expression désigne les plus jeunes, les plus faibles ou les moins importants.
- source_word: נְוֵהֶם
  choice: leur pâturage
  rationale: Le nom peut désigner un pâturage, une demeure ou un enclos ; « pâturage » maintient la cohérence de l’image du troupeau.
- source_word: עֲלֵיהֶם
  choice: à cause d’eux
  rationale: Dans cette construction, la préposition peut exprimer le rapport de la désolation aux personnes entraînées ; une note conserve le sens spatial plus littéral.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Identification des « plus petits du troupeau »
  choice: Conserver l’image sans identifier explicitement ses référents
  alternative: les assaillants les plus faibles ou les moins importants
  rationale: Le contexte suggère une métaphore, mais le texte ne précise pas formellement qui sont ces « petits » ; l’ambiguïté est donc maintenue.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme prophétique est conservé, ainsi que l’image du troupeau. L’accentuation « même » explicite la portée rhétorique probable de « les plus petits » sans remplacer la métaphore par son interprétation.
