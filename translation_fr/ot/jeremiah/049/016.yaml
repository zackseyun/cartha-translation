source:
  edition: WLC
  text: תִּֽפְלַצְתְּ/ךָ֞ הִשִּׁ֤יא אֹתָ/ךְ֙ זְד֣וֹן לִבֶּ֔/ךָ שֹֽׁכְנִי֙ בְּ/חַגְוֵ֣י הַ/סֶּ֔לַע תֹּפְשִׂ֖י מְר֣וֹם גִּבְעָ֑ה כִּֽי תַגְבִּ֤יהַ כַּ/נֶּ֨שֶׁר֙ קִנֶּ֔/ךָ מִ/שָּׁ֥ם אֽוֹרִידְ/ךָ֖ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/016.yaml
  text: The terror you inspire has deceived you[a], the arrogance of your heart— you who dwell in the clefts of the rock, who occupy the height of the hill. Though you make your nest as high as the eagle, from there I will bring you down[c][b], declares Yahweh.
translation:
  language: fr
  text: La terreur que tu inspires[a] t’a trompé, de même que l’arrogance de ton cœur[b], toi qui habites dans les crevasses du rocher[c] et occupes le haut de la colline. Même si tu places ton nid aussi haut que celui de l’aigle, je t’en ferai descendre, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta terreur » ou « ton caractère redoutable » ; l’hébreu peut désigner la terreur associée à Édom ou celle qu’il inspire.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’orgueil de ton cœur ».
    reason: lexical_alternative
  - marker: c
    text: L’expression évoque les forteresses montagneuses d’Édom, qui semblaient inaccessibles.
    reason: cultural_note
lexical_decisions:
- source_word: תִּפְלַצְתְּךָ
  choice: la terreur que tu inspires
  rationale: Le terme peut désigner la terreur ou le caractère redoutable associé à Édom. Cette formulation exprime naturellement en français la terreur provoquée chez autrui tout en signalant l’ambiguïté en note.
- source_word: הִשִּׁיא אֹתָךְ
  choice: t’a trompé
  rationale: Le hifil de נשׁא exprime ici l’action de tromper ou d’égarer. « T’a trompé » est direct et idiomatique.
- source_word: זְדוֹן לִבֶּךָ
  choice: l’arrogance de ton cœur
  rationale: זָדוֹן évoque l’orgueil insolent ou présomptueux. La formulation conserve l’expression anthropologique hébraïque « de ton cœur ».
- source_word: שֹׁכְנִי בְּחַגְוֵי הַסֶּלַע
  choice: toi qui habites dans les crevasses du rocher
  rationale: Le participe a une valeur descriptive et quasi vocative. « Crevasses du rocher » conserve l’image des refuges montagneux.
- source_word: תֹּפְשִׂי מְרוֹם גִּבְעָה
  choice: et occupes les hauteurs de la colline
  rationale: Dans ce contexte d’habitation fortifiée, תפשׂ signifie tenir ou occuper une position. Le pluriel français « les hauteurs » rend naturellement מְרוֹם comme lieu élevé.
- source_word: כִּי תַגְבִּיהַ כַּנֶּשֶׁר קִנֶּךָ
  choice: Même si tu places ton nid aussi haut que celui de l’aigle
  rationale: כִּי reçoit ici une valeur concessive. Le hifil de גבה indique que le nid est placé en hauteur; l’ajout de « celui » évite en français de comparer directement la hauteur du nid à l’aigle lui-même.
- source_word: מִשָּׁם אוֹרִידְךָ
  choice: je t’en ferai descendre
  rationale: Le hifil de ירד signifie faire descendre. Le pronom « en » reprend naturellement le lieu élevé en français.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique est rendue de manière concise, et le nom divin est translittéré conformément à sa forme personnelle dans le texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom divin personnel sans le remplacer par un titre.
- issue: Nature de la sécurité d’Édom
  choice: Conserver l’imagerie géographique d’une position montagneuse tenue pour inaccessible
  alternative: Interpréter le verset uniquement comme une description psychologique ou lui donner directement une portée eschatologique
  rationale: Les crevasses, les hauteurs et le nid de l’aigle fondent l’oracle sur la sécurité géographique et l’arrogance d’Édom, sans exclure la portée morale du jugement.
- issue: Rapport entre תִּפְלַצְתְּךָ et זְדוֹן לִבֶּךָ
  choice: Présenter la terreur inspirée et l’arrogance du cœur comme deux réalités qui trompent Édom
  alternative: Lire « l’arrogance de ton cœur » comme une simple apposition définissant entièrement « ta terreur »
  rationale: La syntaxe hébraïque est compacte et permet une relation appositionnelle ou coordonnée. « Ainsi que » donne une phrase française intelligible sans effacer l’association étroite des deux expressions.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier maintient l’adresse directe à Édom. La ponctuation et les reprises pronominales privilégient une lecture orale fluide tout en conservant l’imagerie et la tension du texte hébreu.
