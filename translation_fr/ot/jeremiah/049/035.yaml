id: JER.49.35
reference: Jeremiah 49:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י שֹׁבֵ֖ר אֶת קֶ֣שֶׁת עֵילָ֑ם רֵאשִׁ֖ית גְּבוּרָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/035.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am breaking the bow of Elam, the chief of their might.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : « Voici, je vais briser l’arc d’Élam, l’élément principal de leur force[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur force principale » ou « le soutien essentiel de leur force ».
    reason: Alternative lexicale pour רֵאשִׁית גְּבוּרָתָם, dont la formulation peut désigner la composante majeure ou le principal soutien de la force d’Élam.
lexical_decisions:
- source_word: כֹּה
  choice: Ainsi
  rationale: Formule prophétique française consacrée et naturelle pour introduire un oracle divin.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par un terme français actuel qui garde la dimension militaire du titre sans la limiter explicitement aux seules armées célestes.
- source_word: הִנְנִי שֹׁבֵר
  choice: Voici, je vais briser
  rationale: « Voici » marque l’insistance de הִנְנִי, tandis que « je vais briser » exprime naturellement l’action imminente ou certaine portée par la construction avec le participe.
- source_word: קֶשֶׁת עֵילָם
  choice: l’arc d’Élam
  rationale: Traduction littérale de l’image militaire, sans expliciter davantage la réputation d’Élam pour le tir à l’arc.
- source_word: רֵאשִׁית גְּבוּרָתָם
  choice: principal élément de leur puissance
  rationale: Rend l’apposition comme désignant l’arc en tant que composante première ou majeure de la puissance militaire d’Élam, tout en signalant en note les autres nuances possibles.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; la translittération préserve le nom propre au lieu de lui substituer un titre.
- issue: Portée de רֵאשִׁית appliqué à la puissance d’Élam
  choice: principal élément de leur puissance
  alternative: leur force principale / le soutien essentiel de leur puissance
  rationale: La syntaxe appositionnelle est préservée sans trancher définitivement entre l’idée de partie éminente, de force principale et de soutien majeur.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique est conservée avec « Ainsi parle », tandis que « je vais briser » évite la raideur de « me voici brisant » et communique l’imminence de l’action.
