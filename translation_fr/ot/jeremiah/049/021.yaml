  text: מִ/קּ֣וֹל נִפְלָ֔/ם רָעֲשָׁ֖ה הָ/אָ֑רֶץ צְעָקָ֕ה בְּ/יַם ס֖וּף נִשְׁמַ֥ע קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/021.yaml
  text: At the sound of their fall the earth quakes[a]; their cry is heard at the Red Sea.
translation:
  language: fr
  text: Au bruit de leur chute, la terre tremble ; leur cri est entendu à la mer des Roseaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « mer Rouge ». L’hébreu dit littéralement « mer des Roseaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Au bruit de
  rationale: La préposition מִן avec קוֹל peut indiquer la source ou l’occasion. « Au bruit de » exprime naturellement en français la réaction provoquée par ce bruit.
- source_word: נִפְלָם
  choice: leur chute
  rationale: Le terme vient de נפל, « tomber ». « Chute » conserve l’image de l’effondrement sans préciser davantage s’il s’agit d’une défaite ou d’une destruction.
- source_word: רָעֲשָׁה הָאָרֶץ
  choice: la terre tremble
  rationale: רעשׁ désigne une secousse ou un tremblement. « La terre tremble » restitue avec naturel la force de l’image, tandis que הָאָרֶץ reçoit ici sa portée large plutôt que le sens local de « pays ».
- source_word: צְעָקָה ... נִשְׁמַע קוֹלָהּ
  choice: leur cri se fait entendre
  rationale: צְעָקָה signifie « cri » ou « clameur », et le suffixe féminin de קוֹלָהּ renvoie naturellement à ce nom. Cette formulation française évite une répétition pesante tout en conservant le lien syntaxique.
- source_word: בְּיַם סוּף
  choice: jusqu’à la mer des Roseaux
  rationale: יַם סוּף signifie littéralement « mer des Roseaux ». Dans ce contexte, בְּ marque le lieu où le cri est entendu ; « jusqu’à » rend explicitement et naturellement la portée considérable du son sans modifier son point d’arrivée.
- source_word: נִשְׁמַע
  choice: se fait entendre
  rationale: 'Le niphal de שׁמע a ici un sens passif : le cri est audible. « Se fait entendre » est idiomatique et soutenu en français.'
