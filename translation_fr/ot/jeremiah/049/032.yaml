  text: וְ/הָי֨וּ גְמַלֵּי/הֶ֜ם לָ/בַ֗ז וַ/הֲמ֤וֹן מִקְנֵי/הֶם֙ לְ/שָׁלָ֔ל וְ/זֵרִתִ֥י/ם לְ/כָל ר֖וּחַ קְצוּצֵ֣י פֵאָ֑ה וּ/מִ/כָּל עֲבָרָ֛י/ו אָבִ֥יא אֶת אֵידָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/032.yaml
  text: Their camels will become plunder[a], and their many livestock spoil. I will scatter to every wind those who cut the corners of their hair, and from all sides of them I will bring their disaster[b], declares Yahweh.
translation:
  language: fr
  text: Leurs chameaux deviendront du butin, et leurs nombreux troupeaux, une prise de guerre. Je disperserai à tous les vents ceux qui se coupent les cheveux aux tempes[a] ; je ferai venir sur eux, de toutes parts[b], leur désastre, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, expression difficile : « ceux qui ont le bord ou le coin coupé ». Elle peut désigner des personnes qui taillaient les bords de leur chevelure, peut-être aux tempes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de tous côtés » ou « de tout autour d’eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְמַלֵּיהֶם
  choice: leurs chameaux
  rationale: Le terme désigne clairement les chameaux ; cette formulation est précise et naturelle en français moderne.
- source_word: לָבַז
  choice: du butin
  rationale: Le mot évoque ce dont l’ennemi s’empare ; « butin » convient au contexte militaire.
- source_word: הֲמוֹן מִקְנֵיהֶם
  choice: leurs nombreux troupeaux
  rationale: הֲמוֹן exprime la multitude et מִקְנֶה le bétail ; « nombreux troupeaux » rend naturellement les deux éléments.
- source_word: לְשָׁלָל
  choice: une prise de guerre
  rationale: Cette expression garde une légère distinction avec בַז, ici rendu par « butin », tout en exprimant clairement la saisie par l’ennemi.
- source_word: וְזֵרִתִים
  choice: je disperserai
  rationale: Le verbe décrit ici la dispersion du peuple sous l’effet du jugement.
- source_word: לְכָל רוּחַ
  choice: à tous les vents
  rationale: La formulation conserve l’image hébraïque intelligible d’une dispersion dans toutes les directions.
- source_word: קְצוּצֵי פֵאָה
  choice: ceux qui se coupent les cheveux aux tempes
  rationale: L’expression vise une pratique distinctive consistant à tailler les bords de la chevelure, probablement aux tempes, sans qu’il faille la préciser davantage.
- source_word: מִכָּל עֲבָרָיו
  choice: de tous côtés
  rationale: La locution indique que le malheur viendra de toutes les directions ; cette tournure est naturelle en français.
- source_word: אָבִיא אֶת אֵידָם
  choice: je ferai venir sur eux leur malheur
  rationale: אֵיד désigne une calamité dans un contexte de jugement. La construction française exprime clairement que Yahweh la fait venir sur eux.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique est rendue avec solennité, et le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Identification de קְצוּצֵי פֵאָה
  choice: ceux qui se coupent les cheveux aux tempes
  alternative: ceux qui se rasent le pourtour de la tête
  rationale: Le choix garde la référence probable à une coiffure distinctive sans identifier avec certitude une pratique ethnique ou religieuse précise.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre « butin » et « prise de guerre » est conservé, ainsi que l’image « à tous les vents ». La syntaxe de la seconde moitié est légèrement réorganisée pour être idiomatique sans effacer le sens du suffixe hébreu.
