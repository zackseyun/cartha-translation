source:
  edition: WLC
  text: לְ/קֵדָ֣ר וּֽ/לְ/מַמְלְכ֣וֹת חָצ֗וֹר אֲשֶׁ֤ר הִכָּה֙ נבוכדראצור מֶֽלֶךְ בָּבֶ֔ל כֹּ֖ה אָמַ֣ר יְהוָ֑ה ק֚וּמוּ עֲל֣וּ אֶל קֵדָ֔ר וְ/שָׁדְד֖וּ אֶת בְּנֵי קֶֽדֶם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/028.yaml
  text: 'Concerning Kedar and the kingdoms of Hazor[a], which Nebuchadnezzar king of Babylon struck down: Thus says Yahweh: Rise up, go up against Kedar[b], and plunder the people of the east.'
translation:
  language: fr
  text: 'Au sujet de Qédar et des royaumes de Hatsor, que Nabuchodonosor[a], roi de Babylone, frappa. Ainsi parle Yahweh :

    « Levez-vous, montez contre Qédar

    et pillez les peuples de l’Orient[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La graphie hébraïque employée ici est plus proche de « Nebucadretsar » ; « Nabuchodonosor » est la forme française traditionnelle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils de l’Orient », expression désignant les populations des déserts orientaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקֵדָר
  choice: Au sujet de Qédar
  rationale: Dans une rubrique prophétique, la préposition לְ introduit couramment le sujet de l’oracle. « Au sujet de » est naturel et évite d’y voir prématurément une indication de direction.
- source_word: וּלְמַמְלְכוֹת חָצוֹר
  choice: et des royaumes de Hatsor
  rationale: Le pluriel מַמְלְכוֹת est conservé. « Hatsor » désigne ici des entités ou groupes du désert associés à ce nom, sans imposer l’identification avec la seule ville cananéenne.
- source_word: אֲשֶׁר הִכָּה
  choice: que … frappa
  rationale: Le verbe נכה exprime ici une action militaire. « Frappa » en conserve la force et la formulation sobre, sans préciser davantage s’il s’agit d’attaquer ou de vaincre.
- source_word: נבוכדראצור
  choice: Nabuchodonosor
  rationale: La forme française traditionnelle et largement reconnue du nom royal est retenue dans le texte, tandis qu’une note signale que la graphie hébraïque de ce verset est plus proche de « Nebucadretsar ».
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formulation française, digne et concise, rend la formule du messager prophétique. Le nom divin יהוה est transcrit « Yahweh ».
- source_word: קוּמוּ
  choice: Levez-vous
  rationale: L’impératif pluriel est conservé dans une formulation française actuelle et énergique.
- source_word: עֲלוּ אֶל קֵדָר
  choice: montez contre Qédar
  rationale: עלה suivi de אֶל peut, dans un contexte militaire, désigner une marche contre un adversaire. L’impératif suivant, « pillez », confirme ici ce sens hostile.
- source_word: וְשָׁדְדוּ
  choice: et pillez
  rationale: שׁדד désigne couramment le pillage dans un contexte guerrier. « Pillez » est direct, naturel et conserve la force de l’ordre.
- source_word: בְּנֵי קֶדֶם
  choice: les peuples de l’Orient
  rationale: L’expression signifie littéralement « les fils de l’Orient » et désigne idiomatiquement les populations des régions désertiques orientales. Le pluriel « peuples » convient au caractère collectif de l’expression.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La présentation poétique met en relief l’ordre divin. Les noms propres suivent des formes françaises reconnaissables, avec une note lorsque la graphie hébraïque mérite d’être signalée.
