  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא אֶל עֵילָ֑ם בְּ/רֵאשִׁ֗ית מַלְכ֛וּת צִדְקִיָּ֥ה מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/034.yaml
  text: 'The word of Yahweh that came to Jeremiah the prophet concerning Elam[a], at the beginning of the reign of Zedekiah king of Judah, saying:'
translation:
  language: fr
  text: 'La parole de Yahweh qui fut adressée à Jérémie, le prophète, au sujet d’Élam[a], au début du règne de Sédécias, roi de Juda :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre Élam ». La préposition hébraïque peut introduire un oracle portant sur une nation ou dirigé contre elle.
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message reçu de Dieu. « Parole » conserve la force et la forme traditionnelle de la formule, tandis que « Yahweh » rend directement le nom divin.
- source_word: אֲשֶׁר הָיָה … אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: qui fut adressée au prophète Jérémie
  rationale: Littéralement, la parole « fut » vers Jérémie. La tournure française « fut adressée à » exprime naturellement la réception de la révélation tout en conservant explicitement le titre « prophète ».
- source_word: אֶל עֵילָם
  choice: au sujet d’Élam
  rationale: Avec une nation dans un titre d’oracle, אֶל peut signifier que la parole porte sur elle ou qu’elle est dirigée contre elle. « Au sujet de » préserve ici la formulation la plus neutre; l’autre possibilité figure en note.
- source_word: בְּרֵאשִׁית מַלְכוּת
  choice: au début du règne
  rationale: מַלְכוּת désigne ici la période durant laquelle le roi exerce le pouvoir, et non son royaume territorial.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Sédécias, roi de Juda
  rationale: Les formes françaises usuelles des noms bibliques sont employées, avec l’apposition royale clairement marquée.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles qui suivent. En français contemporain, les deux-points remplissent naturellement cette fonction sans la lourdeur de « en ces termes ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin personnel. Sa translittération préserve cette distinction plutôt que de lui substituer un titre.
- issue: Orientation de l’oracle introduit par אֶל עֵילָם
  choice: au sujet d’Élam
  alternative: contre Élam
  rationale: La préposition peut introduire aussi bien le thème que la cible d’un oracle. Le texte principal conserve la lecture neutre et la note signale la portée hostile possible.
translation_notes:
  register: Français international moderne, digne et fluide. La formule prophétique reste reconnaissable; les noms bibliques suivent leurs formes françaises usuelles. Les deux-points rendent idiomatiquement לֵאמֹר et annoncent l’oracle du verset suivant.
