    issue: « à qui me paraît bon » ne rend pas correctement לַאֲשֶׁר יָשַׁר בְּעֵינָי.
    rationale: La construction française signifie normalement « à celui qui me semble bon », donc décrit la personne bénéficiaire. L’expression hébraïque qualifie ce qui est droit/bon au jugement de Dieu et marque sa libre décision quant à l’attribution de la terre. « à qui bon me semble » rend idiomatiquement cette portée.
  revised_text: C’est moi qui ai fait la terre, l’humanité[a] et les animaux qui sont à la surface de la terre, par ma grande puissance et par mon bras étendu, et je la donne à qui bon me semble.
