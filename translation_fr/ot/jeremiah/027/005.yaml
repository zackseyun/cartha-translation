  rationale: 'Une seule correction sûre est nécessaire: remplacement de « à qui me paraît bon » par « à qui bon me semble ». Cette formulation préserve le point de vue du locuteur et sa liberté de donner, sans affirmer que les destinataires sont eux-mêmes bons ou justes. Le reste du texte et la note sont conservés.'
