source:
  edition: WLC
  text: אָנֹכִ֞י עָשִׂ֣יתִי אֶת הָ/אָ֗רֶץ אֶת הָ/אָדָ֤ם וְ/אֶת הַ/בְּהֵמָה֙ אֲשֶׁר֙ עַל פְּנֵ֣י הָ/אָ֔רֶץ בְּ/כֹחִ/י֙ הַ/גָּד֔וֹל וּ/בִ/זְרוֹעִ֖/י הַ/נְּטוּיָ֑ה וּ/נְתַתִּ֕י/הָ לַ/אֲשֶׁ֖ר יָשַׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/005.yaml
  text: I myself made the earth[a], mankind, and the animals that are on the face of the earth, by my great power and by my outstretched arm, and I give it to whomever is right in my eyes.
translation:
  language: fr
  text: C’est moi qui ai fait la terre, l’humanité[a] et les animaux qui sont à la surface de la terre, par ma grande puissance et par mon bras étendu, et je la donne à qui bon me semble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’homme »; le singulier hébreu peut désigner ici l’ensemble du genre humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי עָשִׂיתִי
  choice: C’est moi qui ai fait
  rationale: Le pronom indépendant אָנֹכִי souligne le sujet déjà contenu dans le verbe. La tournure française « C’est moi qui » restitue naturellement cette insistance; « fait » traduit עשה sans lui substituer le vocabulaire plus spécifique de « créer ».
- source_word: הָאָרֶץ
  choice: la terre
  rationale: L’association avec l’humanité et les animaux, puis la reprise « à la surface de la terre », indique ici la terre dans son ensemble plutôt qu’un territoire particulier.
- source_word: הָאָדָם
  choice: l’humanité
  rationale: Le singulier collectif avec article désigne ici le genre humain dans une énumération d’ampleur universelle. « L’humanité » est naturel en français moderne et conserve cette portée collective sans suggérer un individu masculin particulier.
- source_word: הַבְּהֵמָה
  choice: les animaux
  rationale: Le nom hébreu singulier a une valeur collective. Le pluriel français général « les animaux » convient mieux au contexte que « le bétail », trop restreint.
- source_word: אֲשֶׁר עַל־פְּנֵי הָאָרֶץ
  choice: qui sont à la surface de la terre
  rationale: Cette formulation garde l’image spatiale de l’hébreu tout en étant plus idiomatique en français actuel que le calque « sur la face de la terre ».
- source_word: בְּכֹחִי הַגָּדוֹל
  choice: par ma grande puissance
  rationale: La préposition ב indique ici le moyen; « par » le rend clairement et « puissance » exprime bien כֹּחַ dans ce contexte.
- source_word: וּבִזְרוֹעִי הַנְּטוּיָה
  choice: et par mon bras étendu
  rationale: La traduction conserve l’anthropomorphisme biblique et le parallélisme instrumental avec « par ma grande puissance ».
- source_word: וּנְתַתִּיהָ
  choice: et je la donne
  rationale: Dans ce contexte déclaratif, l’accompli peut exprimer la souveraine faculté de Dieu comme réalité générale. Le présent français communique cette autorité durable. Le pronom féminin reprend naturellement « la terre ».
- source_word: לַאֲשֶׁר יָשַׁר בְּעֵינָי
  choice: à qui me paraît bon
  rationale: Cette tournure française rend l’idiome de ce qui est droit ou bon aux yeux du locuteur, sans laisser entendre que le bénéficiaire serait moralement juste en lui-même.
theological_decisions:
- issue: Valeur générique de הָאָדָם dans un contexte de création
  choice: l’humanité
  alternative: l’homme
  rationale: Le contexte englobe la terre, le genre humain et les animaux. « L’humanité » exprime clairement la valeur représentative du singulier hébreu; une note conserve l’information formelle selon laquelle l’hébreu dit littéralement « l’homme ».
- issue: Sens de יָשַׁר בְּעֵינַי
  choice: à qui me paraît bon
  alternative: à qui est droit à mes yeux
  rationale: L’idiome concerne le choix souverain de Dieu selon ce qu’il juge bon, non une affirmation non ambiguë de la justice morale du bénéficiaire. La traduction française garde cette perspective sans développer une interprétation doctrinale.
- issue: Valeur temporelle de וּנְתַתִּיהָ
  choice: je la donne
  alternative: je l’ai donnée
  rationale: Le propos fonde la prérogative actuelle de Dieu sur son œuvre créatrice. Le présent rend naturellement la portée générale du parfait hébreu dans ce contexte, tout en reconnaissant que la forme peut aussi être traduite par un accompli.
translation_notes:
  register: Français international moderne, digne et accessible. La construction emphatique « C’est moi qui » restitue l’insistance initiale. La phrase garde le parallélisme solennel des deux compléments de moyen, tout en évitant des calques peu naturels.
