id: JER.27.6
reference: Jeremiah 27:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָֽנֹכִי֙ נָתַ֨תִּי֙ אֶת כָּל הָ/אֲרָצ֣וֹת הָ/אֵ֔לֶּה בְּ/יַ֛ד נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַבְדִּ֑/י וְ/גַם֙ אֶת חַיַּ֣ת הַ/שָּׂדֶ֔ה נָתַ֥תִּי ל֖/וֹ לְ/עָבְדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/006.yaml
  text: And now I have given all these lands into the hand of Nebuchadnezzar king of Babylon[a], my servant[b]; and I have also given him the beasts of the field to serve him.
translation:
  language: fr
  text: Et maintenant, moi, j’ai livré tous ces pays au pouvoir de Nabuchodonosor, roi de Babylone[a], mon serviteur[b] ; je lui ai même donné les animaux sauvages pour qu’ils le servent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom du roi est aussi transcrit « Nebucadnetsar » dans certaines traductions.
    reason: lexical_alternative
  - marker: b
    text: Ici, « mon serviteur » signifie que Dieu se sert de Nabuchodonosor comme de son instrument, non qu’il approuve moralement sa conduite.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec le contexte précédent et la valeur temporelle du marqueur discursif.
- source_word: אָנֹכִי נָתַתִּי
  choice: moi, j’ai livré
  rationale: Le pronom indépendant אָנֹכִי met le sujet divin en relief. « Livrer » exprime ici naturellement le transfert de territoires sous l’autorité d’un souverain.
- source_word: כָּל הָאֲרָצוֹת הָאֵלֶּה
  choice: tous ces pays
  rationale: Dans ce contexte géopolitique, אֲרָצוֹת désigne les territoires ou pays environnants ; « pays » est naturel en français moderne.
- source_word: בְּיַד
  choice: au pouvoir de
  rationale: Rend clairement l’idiome hébreu de la remise « dans la main » de quelqu’un, c’est-à-dire sous son contrôle.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabuchodonosor, roi de Babylone
  rationale: Emploie la forme française usuelle du nom royal et traduit directement le titre et le royaume.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Préserve l’affirmation que le roi païen agit comme instrument au service de Dieu, sans suggérer nécessairement une approbation morale.
- source_word: וְגַם
  choice: je lui ai même donné
  rationale: '« Même » fait ressortir la portée additive et surprenante de גַם : les animaux sont eux aussi soumis à son autorité.'
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: Expression française courante pour le collectif hébreu désignant les animaux vivant hors de la sphère domestique.
- source_word: לְעָבְדוֹ
  choice: pour qu’ils le servent
  rationale: Exprime la finalité ou le résultat de la donation tout en conservant le verbe « servir » du texte source.
theological_decisions:
- issue: Nabuchodonosor qualifié de serviteur de Dieu
  choice: mon serviteur
  alternative: mon esclave
  rationale: Le contexte présente Nabuchodonosor comme l’instrument souverainement employé par Dieu. « Serviteur » conserve cette tension théologique sans transformer le terme en indication de statut social ni impliquer une approbation morale.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « moi, j’ai livré » conserve l’emphase du pronom hébreu ; « au pouvoir de » explicite naturellement l’idiome בְּיַד sans en modifier le sens.
