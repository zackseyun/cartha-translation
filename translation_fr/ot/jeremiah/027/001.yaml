lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: Au début du règne
  rationale: Rend naturellement l’expression temporelle et comprend מַמְלֶכֶת comme la période d’exercice du pouvoir royal.
- source_word: יְהוֹיָקִם בֶּן יֹאושִׁיָּהוּ
  choice: Joïaqim, fils de Josias
  rationale: Emploie les formes françaises usuelles des noms propres et conserve explicitement la filiation.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Traduction directe du titre royal et du territoire concerné.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל יִרְמְיָה
  choice: cette parole fut adressée à Jérémie
  rationale: Expression française naturelle qui conserve la formule prophétique et le terme « parole », moins interprétatif que « message ».
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: Exprime clairement la provenance de la parole et translittère le nom divin.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles qui suivent et rendent la fonction discursive de l’infinitif hébreu sans le calque lourd « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération représente le nom divin présent dans le texte hébreu, sans le remplacer par un titre.
- issue: Difficulté historique entre Joïaqim et le contexte du chapitre
  choice: Conserver « Joïaqim » dans le texte
  alternative: Sédécias
  rationale: Le texte massorétique fourni porte יְהוֹיָקִם. La difficulté contextuelle est signalée en note plutôt que résolue par une correction conjecturale.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est conservée sans calque syntaxique inutile; les deux-points préparent la citation du verset suivant.
