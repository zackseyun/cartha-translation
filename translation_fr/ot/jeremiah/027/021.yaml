id: JER.27.21
reference: Jeremiah 27:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עַל הַ/כֵּלִ֗ים הַ/נּֽוֹתָרִים֙ בֵּ֣ית יְהוָ֔ה וּ/בֵ֥ית מֶֽלֶךְ יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/021.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel, concerning the vessels that remain in the house of Yahweh, in the house of the king of Judah[b], and in Jerusalem:'
translation:
  language: fr
  text: 'Car voici ce que dit Yahvé des armées, le Dieu d’Israël, au sujet des objets qui restent dans la maison de Yahvé[a], dans la maison du roi de Juda[b] et à Jérusalem :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le temple de Yahvé ».
    reason: « Maison de Yahvé » désigne ici le Temple.
  - marker: b
    text: Ou « dans le palais du roi de Juda ».
    reason: Dans ce contexte royal, le mot hébreu traduit littéralement par « maison » peut désigner le palais.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction relie cette déclaration à ce qui précède en introduisant son fondement ; « Car » conserve cette fonction argumentative.
- source_word: כֹה אָמַר
  choice: voici ce que dit
  rationale: Cette tournure française naturelle rend la formule prophétique et sa force actuelle sans transformer le parfait hébreu en simple récit passé.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Cette formulation conserve le nom divin et rend le titre צְבָאוֹת de façon concise, sans limiter explicitement les armées aux seules forces terrestres.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction hébraïque et de ce titre relationnel.
- source_word: עַל
  choice: au sujet de
  rationale: La préposition introduit ici le thème de la parole divine, non une action hostile dirigée contre les objets.
- source_word: הַכֵּלִים
  choice: les objets
  rationale: כֵּלִים désigne largement les objets ou articles du sanctuaire ; « objets » reste clair et évite de les réduire aux seuls récipients.
- source_word: הַנּוֹתָרִים
  choice: qui restent
  rationale: Le participe désigne les objets demeurés sur place après les déportations antérieures.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: La traduction garde l’image littérale de la « maison », tout en signalant en note son référent concret, le Temple.
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: dans la maison du roi de Juda
  rationale: Le choix conserve la répétition de בַּיִת dans l’hébreu ; « palais » est une explicitation possible indiquée en note.
- source_word: וִירוּשָׁלִָם
  choice: et à Jérusalem
  rationale: La localisation est exprimée naturellement en français par « à Jérusalem », dans la série des lieux où les objets sont restés.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa translittération française usuelle préserve cette valeur plutôt que de lui substituer un titre.
- issue: Portée du titre צְבָאוֹת
  choice: des armées
  alternative: le maître des armées
  rationale: « Des armées » garde la forme concise et l’ampleur potentielle du titre hébreu sans préciser si ces armées sont célestes, terrestres ou les deux.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est rendue idiomatiquement, tandis que la répétition hébraïque de « maison » et le nom divin sont conservés. Les deux-points maintiennent la phrase ouverte sur la parole annoncée au verset suivant.
