  text: וְ/אֶל הַ/כֹּהֲנִים֩ וְ/אֶל כָּל הָ/עָ֨ם הַ/זֶּ֜ה דִּבַּ֣רְתִּי לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י נְבִֽיאֵי/כֶ֗ם הַֽ/נִּבְּאִ֤ים לָ/כֶם֙ לֵ/אמֹ֔ר הִנֵּ֨ה כְלֵ֧י בֵית יְהוָ֛ה מוּשָׁבִ֥ים מִ/בָּבֶ֖לָ/ה עַתָּ֣ה מְהֵרָ֑ה כִּ֣י שֶׁ֔קֶר הֵ֖מָּה נִבְּאִ֥ים לָ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/016.yaml
  text: 'And to the priests and to all this people I spoke[a], saying, “Thus says Yahweh: Do not listen to the words of your prophets who are prophesying to you, saying, ‘Behold, the vessels of the house of Yahweh are being brought back from Babylon now, quickly,’ for they are prophesying falsely to you.”'
translation:
  language: fr
  text: 'J’ai parlé aux prêtres et à tout ce peuple en ces termes : « Ainsi parle Yahweh : N’écoutez pas les paroles de vos prophètes qui vous prophétisent ceci : “Voici que les objets de la maison de Yahweh vont être ramenés de Babylone très bientôt[a].” Car ils vous prophétisent un mensonge. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « maintenant, rapidement ». Cette expression souligne le retour imminent annoncé par ces prophètes.'
    reason: La formulation hébraïque compacte est difficile à reproduire idiomatiquement en français tout en conservant ses deux marqueurs d’imminence.
lexical_decisions:
- source_word: וְאֶל הַכֹּהֲנִים וְאֶל כָּל הָעָם הַזֶּה
  choice: J’ai aussi parlé aux prêtres et à tout ce peuple
  rationale: « Aussi » marque naturellement en français la continuité introduite par וְ, tandis que « aux prêtres et à tout ce peuple » conserve les deux groupes destinataires et le collectif singulier עָם.
- source_word: דִּבַּרְתִּי לֵאמֹר
  choice: en ces termes
  rationale: Cette tournure française actuelle et digne rend la formule hébraïque « j’ai parlé en disant » sans en reproduire la lourdeur.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Conserve la formule prophétique solennelle et rend explicitement le nom divin יהוה par « Yahweh ».
- source_word: אַל תִּשְׁמְעוּ אֶל דִּבְרֵי נְבִיאֵיכֶם
  choice: N’écoutez pas les paroles de vos prophètes
  rationale: Rend directement l’interdiction de prêter attention à leurs paroles tout en conservant le possessif « vos ».
- source_word: הַנִּבְּאִים לָכֶם לֵאמֹר
  choice: qui vous font cette prophétie
  rationale: Exprime l’activité prophétique en cours et introduit naturellement en français le contenu de leur annonce.
- source_word: כְלֵי בֵית יְהוָה
  choice: les objets de la maison de Yahweh
  rationale: כְּלִים désigne ici les objets ou ustensiles cultuels emportés; « objets » est plus clair en français moderne que « vases » et « maison » préserve l’expression hébraïque.
- source_word: מוּשָׁבִים מִבָּבֶלָה עַתָּה מְהֵרָה
  choice: vont être ramenés de Babylone très bientôt
  rationale: Le passif de שוב indique que les objets seront ramenés; la tournure périphrastique française communique l’imminence affirmée par les faux prophètes. La formulation littérale inhabituelle est signalée en note.
- source_word: כִּי שֶׁקֶר הֵמָּה נִבְּאִים לָכֶם
  choice: Car c’est un mensonge qu’ils vous prophétisent
  rationale: Préserve le substantif singulier שֶׁקֶר et l’idée qu’ils adressent cette fausse prophétie au peuple, sans réduire le propos à une simple erreur.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Nature de l’annonce des prophètes
  choice: c’est un mensonge qu’ils vous prophétisent
  alternative: ce qu’ils vous prophétisent est faux
  rationale: Le choix maintient la force nominale de שֶׁקֶר et l’accusation explicite du texte sans préciser au-delà du verset leurs intentions subjectives.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative est légèrement réorganisée pour être naturelle, tandis que la formule prophétique « Ainsi parle Yahweh » demeure solennelle. Les guillemets imbriqués distinguent la parole de Yahweh de la citation des prophètes.
