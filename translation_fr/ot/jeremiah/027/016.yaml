  to: 'J’ai parlé aux prêtres et à tout ce peuple en ces termes : « Ainsi parle Yahweh : N’écoutez pas les paroles de vos prophètes qui vous prophétisent ceci : “Voici que les objets de la maison de Yahweh vont être ramenés de Babylone très bientôt[a].” Car ils vous prophétisent un mensonge. »'
