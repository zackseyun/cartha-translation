id: JER.27.11
reference: Jeremiah 27:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/גּ֗וֹי אֲשֶׁ֨ר יָבִ֧יא אֶת צַוָּאר֛/וֹ בְּ/עֹ֥ל מֶֽלֶךְ בָּבֶ֖ל וַֽ/עֲבָד֑/וֹ וְ/הִנַּחְתִּ֤י/ו עַל אַדְמָת/וֹ֙ נְאֻם יְהוָ֔ה וַֽ/עֲבָדָ֖/הּ וְ/יָ֥שַׁב בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/011.yaml
  text: But the nation that brings its neck under the yoke of the king of Babylon and serves him[a], I will let remain on its own land, declares Yahweh[b], and it will till it and dwell in it.
translation:
  language: fr
  text: Mais la nation qui placera son cou sous le joug du roi de Babylone et le servira, je la laisserai demeurer sur sa terre[a] — déclaration de Yahweh —, et elle la cultivera[b] et y habitera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je la laisserai sur sa terre »; le verbe peut aussi évoquer le repos ou la tranquillité accordés sur cette terre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « elle la travaillera », c’est-à-dire qu’elle travaillera la terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹי
  choice: la nation
  rationale: Dans ce contexte de soumission politique à Babylone, גּוֹי désigne une nation plutôt qu’un simple groupe de personnes.
- source_word: יָבִיא אֶת צַוָּארוֹ בְּעֹל
  choice: placera son cou sous le joug
  rationale: Cette formulation conserve l’image concrète du texte hébreu tout en restant naturelle en français moderne.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction directe de la chaîne construite hébraïque.
- source_word: וַעֲבָדוֹ
  choice: et le servira
  rationale: Le verbe exprime ici le service imposé ou la sujétion politique envers le roi de Babylone.
- source_word: וְהִנַּחְתִּיו עַל אַדְמָתוֹ
  choice: je la laisserai demeurer sur sa terre
  rationale: Le hiphil exprime le fait de permettre à la nation de rester sur son propre territoire, avec une possible nuance de repos ou de tranquillité.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette tournure rend la formule prophétique solennelle נְאֻם tout en conservant le nom divin.
- source_word: וַעֲבָדָהּ
  choice: et elle la cultivera
  rationale: Le suffixe féminin renvoie à la terre; avec un terrain pour objet, עבד signifie le travailler ou le cultiver.
- source_word: וְיָשַׁב בָּהּ
  choice: et y habitera
  rationale: Le pronom adverbial « y » renvoie naturellement à la terre et ישב exprime ici le fait d’y habiter.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » le rend comme nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. L’image concrète du cou placé sous le joug est conservée; « déclaration de Yahweh » maintient le ton prophétique. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
