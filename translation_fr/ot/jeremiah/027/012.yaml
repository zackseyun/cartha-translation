base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/012.yaml
  text: And to Zedekiah king of Judah I spoke all these words[a], saying, “Bring your necks under the yoke of the king of Babylon, and serve him and his people[b], and live.”
translation:
  language: fr
  text: 'J’ai aussi adressé à Sédécias, roi de Juda, toutes ces paroles : « Placez votre cou sous le joug du roi de Babylone, servez-le, lui et son peuple, et vivez[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et vous vivrez » ou « afin que vous viviez ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: J’ai aussi adressé à Sédécias, roi de Juda
  rationale: La construction avec אֶל et דִּבַּרְתִּי désigne le destinataire de la parole. « J’ai adressé » est naturel en français et « aussi » rend la continuité marquée par וְ.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: Dans ce contexte, כְּכָל introduit le contenu correspondant à ce qui précède. « Toutes ces paroles » conserve דְּבָרִים sans imposer le calque peu naturel « selon toutes ces paroles ».
- source_word: הָבִיאוּ אֶת צַוְּארֵיכֶם בְּעֹל
  choice: Placez votre cou sous le joug
  rationale: L’impératif hiphil de בוא signifie littéralement « faites entrer/apportez ». L’expression française « placer son cou sous le joug » restitue clairement l’image et la soumission politique. Le singulier collectif « votre cou » est idiomatique avec un destinataire pluriel.
- source_word: מֶלֶךְ בָּבֶל
  choice: du roi de Babylone
  rationale: Rendu direct de la construction génitivale hébraïque.
- source_word: וְעִבְדוּ אֹתוֹ וְעַמּוֹ
  choice: servez-le, lui et son peuple
  rationale: עבד exprime ici le service ou l’assujettissement politique. La dislocation « servez-le, lui et son peuple » indique naturellement en français que le roi et son peuple sont tous deux compléments de « servez ».
- source_word: וִחְיוּ
  choice: et vous vivrez
  rationale: Après les impératifs précédents, l’impératif וִחְיוּ peut exprimer la conséquence promise. « Et vous vivrez » est naturel en français, tout en laissant une note signaler le rendu formel possible.
theological_decisions:
- issue: Soumission politique au pouvoir babylonien
  choice: Conserver le commandement concret de servir le roi de Babylone et son peuple.
  alternative: Transformer le passage en appel général à l’humilité ou à une soumission spirituelle.
  rationale: Le texte vise historiquement et politiquement Sédécias et Juda sous la domination babylonienne. Il ne faut ni atténuer ni spiritualiser cette tension.
- issue: Valeur de וִחְיוּ après une série d’impératifs
  choice: « et vous vivrez », compris comme conséquence
  alternative: « et vivez », impératif formel, ou « afin que vous viviez », valeur finale
  rationale: La forme hébraïque permet une lecture impérative, mais la séquence peut naturellement exprimer le résultat. La traduction principale privilégie le français idiomatique sans cacher l’autre possibilité, donnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image concrète du cou sous le joug et la portée politique du commandement. Le discours direct est introduit par deux-points plutôt que par un calque de לֵאמֹר.
