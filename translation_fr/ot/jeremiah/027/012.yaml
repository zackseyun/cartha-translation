  terminology: « Sédécias », « Juda », « Babylone », « joug » et « servir » sont exacts et cohérents. « Toutes ces paroles » est une expression française naturelle qui rend convenablement la référence aux paroles précédentes, sans le calque lourd « selon toutes ces paroles ».
