id: JER.27.8
reference: Jeremiah 27:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/גּ֜וֹי וְ/הַ/מַּמְלָכָ֗ה אֲשֶׁ֨ר לֹֽא יַעַבְד֤וּ אֹת/וֹ֙ אֶת נְבוּכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/אֵ֨ת אֲשֶׁ֤ר לֹֽא יִתֵּן֙ אֶת צַוָּאר֔/וֹ בְּ/עֹ֖ל מֶ֣לֶךְ בָּבֶ֑ל בַּ/חֶרֶב֩ וּ/בָ/רָעָ֨ב וּ/בַ/דֶּ֜בֶר אֶפְקֹ֨ד עַל הַ/גּ֤וֹי הַ/הוּא֙ נְאֻם יְהוָ֔ה עַד תֻּמִּ֥/י אֹתָ֖/ם בְּ/יָדֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/008.yaml
  text: And it shall be that the nation or the kingdom that will not serve him[a], Nebuchadnezzar king of Babylon, and that will not put its neck under the yoke of the king of Babylon, I will punish that nation with the sword, with famine, and with pestilence, declares Yahweh[c][b], until I have finished them by his hand.
translation:
  language: fr
  text: Il arrivera que la nation ou le royaume[a] qui ne servira pas Nabuchodonosor, roi de Babylone, et qui ne mettra pas sa nuque sous le joug du roi de Babylone[b], je punirai cette nation par l’épée, par la famine et par la peste — déclaration de Yahvé — jusqu’à ce que je les aie achevés par sa main[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la nation et le royaume ». Les deux termes forment ici un avertissement distributif visant tout pays qui refuse la domination babylonienne.'
    reason: lexical_alternative
  - marker: b
    text: Mettre sa nuque sous un joug est une image de la soumission à la domination du roi de Babylone.
    reason: cultural_note
  - marker: c
    text: 'Ou : « jusqu’à ce que je les mène à leur fin par sa main ». « Sa main » désigne Nabuchodonosor comme instrument du jugement.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: La nation ou le royaume qui…
  rationale: La formule introduit ici la conséquence à venir. En français, l’intégrer directement à la construction conditionnelle portée par la relative produit une phrase naturelle sans affaiblir la solennité prophétique.
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: la nation ou le royaume
  rationale: 'Bien que l’hébreu relie littéralement les deux termes par « et », l’avertissement a une portée distributive : toute entité politique qui refuse la domination babylonienne est visée.'
- source_word: יַעַבְדוּ אֹתוֹ אֶת נְבוּכַדְנֶאצַּר
  choice: ne servira pas Nabuchodonosor
  rationale: Dans ce contexte, עבד désigne le service imposé et la soumission politique à un souverain. Le nom qui suit identifie directement le référent du pronom hébreu.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et couramment reconnue du nom du roi de Babylone.
- source_word: יִתֵּן אֶת צַוָּארוֹ בְּעֹל
  choice: ne placera pas sa nuque sous le joug
  rationale: Cette formulation conserve l’image concrète du texte hébreu tout en exprimant clairement la soumission à une domination étrangère.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: par l’épée, la famine et la peste
  rationale: Rend directement la triade récurrente des jugements dans Jérémie, avec un vocabulaire français clair et digne.
- source_word: אֶפְקֹד עַל
  choice: je punirai
  rationale: פקד suivi de על exprime ici une intervention punitive. « Je punirai » en communique directement le sens.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: Formule prophétique solennelle qui présente les paroles comme l’oracle ou la déclaration divine.
- source_word: עַד תֻּמִּי אֹתָם
  choice: jusqu’à ce que j’en finisse avec eux
  rationale: La tournure française exprime l’idée de mener leur châtiment à son terme sans préciser davantage que l’hébreu la manière de leur disparition.
- source_word: בְּיָדוֹ
  choice: par sa main
  rationale: 'Conserve l’expression hébraïque de l’agentivité : Nabuchodonosor sera l’instrument par lequel le jugement sera exécuté.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahvé » est une forme française reconnue qui le représente comme nom propre plutôt que de le remplacer par un titre.
- issue: Portée de עַד תֻּמִּי אֹתָם
  choice: jusqu’à ce que j’en finisse avec eux
  alternative: jusqu’à ce que je les anéantisse
  rationale: Le verbe indique que Dieu mènera leur jugement à son terme. La traduction retenue préserve la gravité du propos sans imposer une précision sur le mode ou l’étendue de la destruction que la forme hébraïque ne tranche pas à elle seule.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. La métaphore de la nuque sous le joug et l’expression concrète « par sa main » sont conservées. La reprise « cette nation-là » reflète le singulier hébreu après la paire distributive « nation ou royaume », tandis que « eux » renvoie collectivement à ses habitants.
