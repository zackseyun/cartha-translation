revisions:
- from: La nation ou le royaume[a] qui ne servira pas Nabuchodonosor, roi de Babylone, et qui ne placera pas sa nuque sous le joug du roi de Babylone[b], je punirai cette nation-là par l’épée, la famine et la peste — déclaration de Yahvé — jusqu’à ce que j’en finisse avec eux par sa main[c].
  to: Il arrivera que la nation ou le royaume[a] qui ne servira pas Nabuchodonosor, roi de Babylone, et qui ne mettra pas sa nuque sous le joug du roi de Babylone[b], je punirai cette nation par l’épée, par la famine et par la peste — déclaration de Yahvé — jusqu’à ce que je les aie achevés par sa main[c].
  rationale: La révision rétablit la formule introductive du texte hébreu, améliore l’idiome de l’image du joug et remplace une expression française familière et sémantiquement imprécise. Le pluriel « les » est maintenu, conformément à l’objet pluriel hébreu, bien que l’avertissement soit formulé au singulier distributif. Les notes restent ancrées aux expressions qu’elles expliquent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:17Z'
review_pass:
  verdict: revise
  source_fidelity: La proposition initiale omet la formule d’ouverture וְהָיָה (« Il arrivera que »), qui introduit explicitement la conséquence prophétique. « J’en finisse avec eux » est trop familier et peut suggérer l’exaspération plutôt que l’achèvement destructeur du jugement. La révision conserve la paire distributive et l’image du joug, ainsi que l’ambiguïté collective du pronom pluriel final.
  naturalness: « Il arrivera que » et « mettra sa nuque sous le joug » sont naturels dans un français moderne soutenu. « Jusqu’à ce que je les aie achevés » est plus précis et plus solennel que « j’en finisse avec eux », sans recourir à un archaïsme.
  terminology: « Nabuchodonosor », « Babylone », « Yahvé », « épée », « famine », « peste » et « joug » conviennent à l’usage biblique français moderne. « Déclaration de Yahvé » restitue fidèlement la formule prophétique נאם יהוה.
  issues:
  - severity: medium
    issue: Omission de la formule initiale וְהָיָה.
    rationale: La phrase française commence directement par le sujet, alors que l’hébreu introduit l’énoncé par une formule événementielle et prospective. « Il arrivera que » la rend clairement sans lourdeur.
  - severity: medium
    issue: « Jusqu’à ce que j’en finisse avec eux » est trop idiomatique et insuffisamment précis.
    rationale: Cette expression peut évoquer le fait d’en avoir assez de quelqu’un. Le verbe תמם dans ce contexte de jugement indique l’achèvement des ennemis; « les aie achevés » rend cette portée avec une gravité appropriée.
  - severity: low
    issue: « Placera sa nuque sous le joug » est moins idiomatique que « mettra sa nuque sous le joug ».
    rationale: « Mettre sous le joug » est la collocation française habituelle et maintient l’image corporelle de l’hébreu.
  revised_text: Il arrivera que la nation ou le royaume[a] qui ne servira pas Nabuchodonosor, roi de Babylone, et qui ne mettra pas sa nuque sous le joug du roi de Babylone[b], je punirai cette nation par l’épée, par la famine et par la peste — déclaration de Yahvé — jusqu’à ce que je les aie achevés par sa main[c].
