  rationale: La révision conserve toutes les ambiguïtés pertinentes du texte hébreu, notamment l’extension dynastique de « son fils et le fils de son fils » et la référence à Babylone dans « son propre pays ». Elle clarifie la coordination des objets de « serviront » et rend le renversement final dans un français moderne, politique et naturel, tout en maintenant une note pour la construction hébraïque concise.
