  text: וְ/עָבְד֤וּ אֹת/וֹ֙ כָּל הַ/גּוֹיִ֔ם וְ/אֶת בְּנ֖/וֹ וְ/אֶֽת בֶּן בְּנ֑/וֹ עַ֣ד בֹּא עֵ֤ת אַרְצ/וֹ֙ גַּם ה֔וּא וְ/עָ֤בְדוּ ב/וֹ֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדֹלִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/007.yaml
  text: All the nations will serve him[a], and his son, and his grandson, until the time of his own land comes[c][b]; then many nations and great kings will make even him serve them.
translation:
  language: fr
  text: Toutes les nations le serviront, ainsi que son fils et le fils de son fils[a], jusqu’à ce que vienne le temps fixé pour son propre pays[b]. Alors, de nombreuses nations et de grands rois le soumettront, lui aussi, à leur domination[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son fils et le fils de son fils ». Cette expression peut désigner la continuité dynastique sans nécessairement préciser une généalogie stricte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jusqu’à ce que vienne le temps de son pays », c’est-à-dire le temps fixé concernant le propre pays de Babylone.'
    reason: lexical_alternative
  - marker: c
    text: 'La formulation hébraïque indique qu’ils le mettront à leur tour sous leur domination ou à leur service. Une traduction plus littérale serait : « se serviront de lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ אֹתוֹ
  choice: le serviront
  rationale: Dans ce contexte politique, עבד désigne la sujétion à un souverain ou à un empire. « Le serviront » exprime naturellement cette relation de vassalité.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם renvoie ici aux entités politiques soumises à Babylone ; « nations » convient au cadre géopolitique.
- source_word: וְאֶת בְּנוֹ וְאֶת בֶּן בְּנוֹ
  choice: son fils et le fils de son fils
  rationale: Cette formulation conserve l’expression hébraïque et son idée de succession dynastique, sans préciser davantage le lien généalogique.
- source_word: עַד בֹּא עֵת אַרְצוֹ
  choice: jusqu’à ce que vienne le temps fixé pour son propre pays
  rationale: La tournure hébraïque est condensée. « Le temps fixé pour » rend le moment destiné au pays de Babylone, tandis que « son propre pays » explicite sobrement la référence réflexive.
- source_word: גַּם הוּא
  choice: Alors, lui aussi
  rationale: '« Lui aussi » préserve l’emphase de גַּם הוּא et souligne le renversement : celui que les nations servaient sera à son tour soumis.'
- source_word: וְעָבְדוּ בוֹ
  choice: l’asserviront
  rationale: Avec la préposition ב, la construction indique ici qu’on lui imposera le service ou qu’on l’utilisera comme serviteur. « L’asserviront » exprime clairement ce renversement sans suggérer que les nations le serviront.
- source_word: גּוֹיִם רַבִּים וּמְלָכִים גְּדֹלִים
  choice: de nombreuses nations et de grands rois
  rationale: Cette traduction conserve le parallélisme et la portée politique de l’hébreu.
theological_decisions:
- issue: Le renversement du sort de Babylone dans la dernière proposition
  choice: Après le temps fixé pour son pays, le souverain babylonien ou l’empire qu’il représente sera lui-même soumis par de nombreuses nations et de grands rois.
  alternative: 'Traduction plus littérale : « de nombreuses nations et de grands rois se serviront de lui » ou « lui imposeront le service ».'
  rationale: Le contexte annonce la domination temporaire de Babylone, puis son jugement. La construction וְעָבְדוּ בוֹ exprime donc au mieux une inversion de la relation de service, tout en laissant ouverte la portée exacte de la métaphore politique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’emphase de « lui aussi », le caractère dynastique de l’expression hébraïque et la légère ambiguïté de la dernière construction, expliquée en note.
