  source_fidelity: 'Le sens général est fidèle : les nations sont soumises au souverain babylonien et à sa succession, jusqu’au temps fixé pour son pays, après quoi il est à son tour soumis. La dernière proposition doit toutefois exprimer plus clairement, en français, que les nations et les grands rois le placent sous leur domination. « L’asserviront » est possible, mais plus fort et moins précis que la relation politique de service/sujétion visée ici.'
  naturalness: 'La séquence « le serviront, lui, son fils et le fils de son fils » est ambiguë et peu naturelle : elle peut momentanément faire de « lui » une apposition plutôt que le premier objet coordonné. « Le serviront, ainsi que son fils et le fils de son fils » rend la coordination sans alourdir le texte. La place de « lui aussi » est également améliorée.'
  terminology: « Nations », « serviront », « fils » et « le fils de son fils » conviennent au contexte politique et dynastique. « Soumettront à leur domination » rend naturellement le renversement de la sujétion sans introduire l’idée plus spécifique et plus lourde d’esclavage attachée à « asservir ».
