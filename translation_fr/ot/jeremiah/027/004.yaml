source:
  edition: WLC
  text: וְ/צִוִּיתָ֣ אֹתָ֔/ם אֶל אֲדֹֽנֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כֹּ֥ה תֹֽאמְר֖וּ אֶל אֲדֹֽנֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/004.yaml
  text: 'And command them to say to their masters[a], ‘Thus says Yahweh of hosts, the God of Israel: Thus you shall say to your masters,’'
translation:
  language: fr
  text: 'Tu leur ordonneras de dire à leurs souverains[a] : « Voici ce que dit Yahweh des armées, le Dieu d’Israël : Voici ce que vous direz à vos souverains : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs seigneurs » / « vos seigneurs ». Le mot désigne ici les rois auxquels les envoyés sont soumis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתָ אֹתָם
  choice: Tu leur ordonneras
  rationale: Le parfait avec waw poursuit ici la séquence d’instructions adressées à Jérémie. Le futur français exprime naturellement cette directive, et le pronom « leur » reprend les envoyés du contexte.
- source_word: אֶל אֲדֹנֵיהֶם / אֶל אֲדֹנֵיכֶם
  choice: à leurs souverains / à vos souverains
  rationale: אדון désigne ici les rois dont relèvent les envoyés. « Souverains » exprime clairement l’autorité politique humaine et évite la confusion avec le titre divin « Seigneur ».
- source_word: לֵאמֹר
  choice: de transmettre ceci
  rationale: L’infinitif introduit le contenu du message. Cette formulation française rend explicitement et naturellement la mission confiée aux envoyés sans modifier son contenu.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique de messager rendue dans un français actuel et digne, avec le présent conventionnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel, plutôt que substitution par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Le terme désigne des armées ou multitudes organisées. « Yahweh des armées » conserve l’image du titre hébreu dans un français compréhensible.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la chaîne construite hébraïque.
- source_word: כֹּה תֹּאמְרוּ
  choice: Voici ce que vous direz
  rationale: Le futur garde la valeur directive de la deuxième personne du pluriel adressée aux envoyés.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Sens de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » reste proche du sens lexical et conserve l’imagerie militaire ou céleste, tandis que « de l’univers » interpréterait plus largement le titre.
- issue: Rendu de אֲדֹנֵיהֶם appliqué aux rois étrangers
  choice: souverains
  alternative: seigneurs
  rationale: Le contexte vise les autorités politiques humaines des envoyés. « Souverains » évite une possible confusion avec un titre divin sans ajouter de particularité confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de la formule « Voici ce que… » et le changement de « leurs » à « vos » sont conservés, car ils reflètent la structure du discours hébreu. Le deux-points final indique que le message se poursuit au verset suivant.
