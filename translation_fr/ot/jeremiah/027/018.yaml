reference: Jeremiah 27:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם נְבִאִ֣ים הֵ֔ם וְ/אִם יֵ֥שׁ דְּבַר יְהוָ֖ה אִתָּ֑/ם יִפְגְּעוּ נָא֙ בַּֽ/יהוָ֣ה צְבָא֔וֹת לְ/בִלְתִּי בֹ֜אוּ הַ/כֵּלִ֣ים הַ/נּוֹתָרִ֣ים בְּ/בֵית יְהוָ֗ה וּ/בֵ֨ית מֶ֧לֶךְ יְהוּדָ֛ה וּ/בִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/018.yaml
  text: But if they are prophets[a], and if the word of Yahweh is with them, let them now plead with Yahweh of hosts that the vessels remaining in the house of Yahweh, in the house of the king of Judah[c][b], and in Jerusalem may not go to Babylon.
translation:
  language: fr
  text: Mais s’ils sont prophètes, et si la parole de Yahweh est avec eux, qu’ils supplient Yahweh des armées[a] afin que les objets qui restent dans la maison de Yahweh, dans la maison du roi de Juda[b] et à Jérusalem ne soient pas emportés à Babylone[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’ils intercèdent auprès de Yahweh des armées ». Le verbe hébreu peut désigner une supplication ou une intercession.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le palais du roi de Juda ». L’hébreu dit littéralement « dans la maison du roi de Juda ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « ne viennent pas à Babylone »; avec des objets, le français emploie naturellement le passif « ne soient pas emportés à Babylone ».
    reason: translation_clarity
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’ils
  rationale: La conjonction introduit ici un défi conditionnel opposé aux prétentions des prophètes évoqués dans le contexte. « Mais s’ils » rend naturellement cette nuance adversative.
- source_word: נְבִאִים
  choice: prophètes
  rationale: Équivalent français courant et précis du terme hébreu.
- source_word: דְּבַר יְהוָה אִתָּם
  choice: la parole de Yahweh est avec eux
  rationale: Cette formulation conserve l’expression existentielle et relationnelle de l’hébreu sans la réduire à la simple possession d’un message.
- source_word: יִפְגְּעוּ נָא בַּיהוָה צְבָאוֹת
  choice: qu’ils supplient donc Yahweh des armées
  rationale: Avec la préposition ב, פגע peut exprimer une supplication ou une intercession. « Supplient » est naturel et garde l’intensité de la demande; « donc » rend ici l’insistance de נָא dans ce défi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin personnel représenté par le tétragramme.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Rend directement le nom divin et le pluriel צְבָאוֹת, tout en conservant l’imagerie du titre hébreu.
- source_word: לְבִלְתִּי בֹאוּ
  choice: pour que ... ne soient pas emportés
  rationale: La construction exprime le but de la supplication. Le passif explicite naturellement en français le déplacement forcé des objets vers Babylone, implicite dans le contexte, sans modifier le résultat envisagé.
- source_word: הַכֵּלִים הַנּוֹתָרִים
  choice: les objets qui restent
  rationale: כֵּלִים désigne largement des objets ou ustensiles du Temple et du palais. « Objets » évite de suggérer uniquement des récipients, tandis que « qui restent » rend le participe hébreu.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: « Maison » reproduit le terme בֵּית et maintient le parallèle avec la maison du roi; dans ce contexte, il s’agit du Temple.
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: dans la maison du roi de Juda
  rationale: Le texte massorétique coordonne cette expression à la précédente sans répéter explicitement la préposition. Le français la restitue pour la clarté et conserve la répétition de « maison ».
- source_word: וּבִירוּשָׁלַם
  choice: et à Jérusalem
  rationale: Rend directement le dernier complément de lieu de l’énumération.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le hé directionnel indique un mouvement vers Babylone; « à Babylone » est idiomatique avec « emportés ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » maintient la distinction entre le nom personnel de Dieu et un titre, sans ajouter d’interprétation confessionnelle.
- issue: Portée de יִפְגְּעוּ dans un contexte prophétique
  choice: qu’ils supplient
  alternative: qu’ils intercèdent
  rationale: Le passage met à l’épreuve les prétendus prophètes en les invitant à adresser une demande pressante à Dieu. « Supplient » conserve cette force sans faire d’« intercession » un terme technique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle et le défi rhétorique sont conservés. « Maison » maintient le parallélisme hébreu, tandis que « objets » et « ne soient pas emportés » assurent une lecture naturelle sans limiter indûment le sens de כֵּלִים.
