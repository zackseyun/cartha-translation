  verdict: revise
  source_fidelity: Le sens global est bien rendu, notamment le contraste initial, l’interdiction d’écouter et la valeur prédictive de « Vous ne servirez pas ». Toutefois, « ceux qui ont des rêves » affaiblit la fonction divinatoire que le terme hébreu, littéralement « vos rêves », prend vraisemblablement dans cette série de praticiens. La formulation révisée explicite sobrement la métonymie sans prétendre définir une technique précise.
  naturalness: La phrase proposée est compréhensible, mais l’enchaînement « vos devins, ceux qui ont des rêves, ceux qui lisent les présages ni vos sorciers » manque de parallélisme et la coordination finale est maladroite en français. Une série uniformément introduite par « ni » est plus nette. « Tous vous disent » rattache sans ambiguïté le message à l’ensemble des catégories.
  terminology: « Devins », « lecteurs de présages » et « sorciers » conviennent au registre prophétique moderne. « Ceux qui se réclament de rêves » évite le sens moderne courant de « rêveurs » tout en restant proche de la métonymie du texte; la note conserve la formulation littérale et l’incertitude lexicale.
  issues:
