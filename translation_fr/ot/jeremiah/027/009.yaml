    issue: Rendu de חֲלֹמֹתֵיכֶם par « ceux qui ont des rêves »
    rationale: Cette expression peut désigner n’importe quelles personnes ayant des rêves et ne rend pas suffisamment leur rôle dans une liste de spécialistes consultés. « Ceux qui se réclament de rêves » transmet plus naturellement la fonction probable, tandis que la note maintient le littéral « vos rêves ».
  - severity: low
    issue: Coordination de la liste et portée de la relative
    rationale: La succession sans « ni » répété, suivie de « ni vos sorciers, qui vous disent », est moins fluide et peut faire rattacher « qui vous disent » aux seuls sorciers. La révision établit clairement une liste complète et attribue le message à tous ses membres.
