  text: וְ֠/אַתֶּם אַל תִּשְׁמְע֨וּ אֶל נְבִיאֵי/כֶ֜ם וְ/אֶל קֹֽסְמֵי/כֶ֗ם וְ/אֶל֙ חֲלֹמֹ֣תֵי/כֶ֔ם וְ/אֶל עֹֽנְנֵי/כֶ֖ם וְ/אֶל כַּשָּׁפֵי/כֶ֑ם אֲשֶׁר הֵ֞ם אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֥לֶךְ בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/009.yaml
  text: But you[a], do not listen to your prophets, your diviners, your dreamers, your soothsayers, or your sorcerers, who are saying to you, ‘You will not serve the king of Babylon.’
translation:
  language: fr
  text: 'Mais vous, n’écoutez ni vos prophètes, ni vos devins, ni ceux qui se réclament de rêves[a], ni vos lecteurs de présages, ni vos sorciers. Tous vous disent : « Vous ne servirez pas le roi de Babylone. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vos rêves ». Dans cette liste de personnes consultées, le terme semble désigner, par métonymie, ceux qui se réclament de rêves révélateurs.'
    reason: Alternative lexicale et conservation de la formulation inhabituelle de l’hébreu.
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mais vous
  rationale: La conjonction suivie du pronom indépendant marque ici un contraste; « Mais vous » le rend naturellement en français.
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: n’écoutez pas
  rationale: Avec אֶל, le verbe שׁמע signifie écouter ou prêter attention à quelqu’un. Cette formulation conserve l’interdiction sans la renforcer en « n’obéissez pas ».
- source_word: נְבִיאֵיכֶם
  choice: vos prophètes
  rationale: Traduction directe qui conserve le possessif et n’ajoute pas le qualificatif interprétatif « faux ».
- source_word: קֹסְמֵיכֶם
  choice: vos devins
  rationale: Le terme désigne ceux qui pratiquent la divination; « devins » est concis, courant et approprié au registre prophétique.
- source_word: חֲלֹמֹתֵיכֶם
  choice: ceux qui ont des rêves[a]
  rationale: La forme hébraïque signifie littéralement « vos rêves », mais, au milieu d’une liste de personnes consultées, elle paraît désigner par métonymie ceux qui se réclament de rêves. La formulation française rend cette fonction sans employer « rêveurs », qui évoquerait surtout des personnes distraites ou idéalistes.
- source_word: עֹנְנֵיכֶם
  choice: ceux qui lisent les présages
  rationale: Le terme désigne des praticiens qui tirent des signes ou des présages. Cette expression moderne reste compréhensible sans imposer une méthode technique précise.
- source_word: כַּשָּׁפֵיכֶם
  choice: vos sorciers
  rationale: Le mot renvoie à la pratique de la sorcellerie ou de la magie; « sorciers » est la correspondance française la plus directe dans ce contexte.
- source_word: אֲשֶׁר הֵם אֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: qui vous disent
  rationale: Cette tournure introduit simplement en français le contenu du message répété par ces personnes.
- source_word: לֹא תַעַבְדוּ
  choice: Vous ne servirez pas
  rationale: 'Dans ce discours rapporté, l’inaccompli est compris comme une annonce: ces conseillers prétendent que l’assujettissement à Babylone n’aura pas lieu. Une traduction impérative, « Ne servez pas », modifierait le sens.'
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction directe de la chaîne construite, claire et idiomatique en français.
theological_decisions:
- issue: Désignation de praticiens dont le message s’oppose à celui transmis par Jérémie
  choice: Conserver les désignations du texte sans ajouter « faux » ou « prétendus »
  alternative: Traduire « vos faux prophètes » ou « vos prétendus prophètes »
  rationale: Le verset les nomme sans qualificatif, tandis que l’interdiction de les écouter et le contexte établissent leur manque de fiabilité. Ajouter un qualificatif résoudrait explicitement ce que le texte laisse au contexte.
- issue: Valeur de לֹא תַעַבְדוּ dans les paroles rapportées
  choice: 'Le comprendre comme une prédiction: « Vous ne servirez pas »'
  alternative: 'Le comprendre comme une défense: « Ne servez pas »'
  rationale: Après « qui vous disent », la forme exprime vraisemblablement leur promesse trompeuse que les nations n’auront pas à servir le roi de Babylone; cette lecture préserve l’opposition avec l’avertissement prophétique du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Les expressions descriptives « ceux qui ont des rêves » et « ceux qui lisent les présages » évitent des termes français ambigus ou excessivement techniques, tout en maintenant le parallélisme de la liste.
