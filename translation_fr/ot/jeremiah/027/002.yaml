  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֵלַ֔/י עֲשֵׂ֣ה לְ/ךָ֔ מוֹסֵר֖וֹת וּ/מֹט֑וֹת וּ/נְתַתָּ֖/ם עַל צַוָּארֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/002.yaml
  text: 'Thus said Yahweh to me: “Make for yourself bonds and yoke-bars[a], and put them on your neck.”'
translation:
  language: fr
  text: 'Ainsi m’a parlé Yahvé : « Fabrique-toi des liens et des barres de joug[a], puis mets-les sur ton cou. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des liens et des barres de joug » ; on peut aussi comprendre : « des courroies et des jougs ».'
    reason: La nature exacte des deux éléments du dispositif de joug demeure sujette à une certaine variation lexicale.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה אֵלַי
  choice: Ainsi m’a parlé Yahvé
  rationale: Cette tournure française naturelle conserve la formule prophétique et rend le parfait dans le cadre narratif de la parole adressée à Jérémie.
- source_word: עֲשֵׂה לְךָ
  choice: Fabrique-toi
  rationale: L’impératif et le datif réfléchi sont rendus de façon concise et idiomatique.
- source_word: מוֹסֵרוֹת
  choice: liens
  rationale: Le terme désigne des attaches ou courroies appartenant au dispositif du joug; « liens » en conserve la portée concrète sans la préciser indûment.
- source_word: מֹטוֹת
  choice: barres de joug
  rationale: Le mot désigne ici les barres du joug plutôt que nécessairement l’ensemble du joug; cette traduction garde la précision de l’hébreu.
- source_word: וּנְתַתָּם
  choice: puis mets-les
  rationale: Le parfait coordonné prolonge l’ordre précédent. « Puis » exprime naturellement la succession des gestes.
- source_word: עַל צַוָּארֶךָ
  choice: sur ton cou
  rationale: Rendu locatif direct, courant et fidèle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente le nom propre en français moderne tout en évitant de le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et accessible. La formule prophétique garde une légère solennité; le vocabulaire concret du geste symbolique est préservé.
