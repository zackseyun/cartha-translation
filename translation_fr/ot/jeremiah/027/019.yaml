id: JER.27.19
reference: Jeremiah 27:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֶל הָֽ/עַמֻּדִ֔ים וְ/עַל הַ/יָּ֖ם וְ/עַל הַ/מְּכֹנ֑וֹת וְ/עַל֙ יֶ֣תֶר הַ/כֵּלִ֔ים הַ/נּוֹתָרִ֖ים בָּ/עִ֥יר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/019.yaml
  text: 'For thus says Yahweh of Armies concerning the pillars[a], the Sea, the stands[b], and the rest of the vessels that remain in this city:'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh des armées au sujet des colonnes, de la Mer[a], des supports[b] et du reste des objets qui sont encore dans cette ville :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Mer » était le grand bassin de bronze faisant partie du mobilier du Temple.
    reason: cultural_note
  - marker: b
    text: 'Ou : « bases » ou « socles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la déclaration précédente et marque naturellement le lien logique en français.
- source_word: כֹה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de messager dans un français actuel et digne.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et traduit le titre צְבָאוֹת selon son sens concret, sans recourir à l’expression traditionnelle mais peu transparente « des armées célestes » ou « des puissances ».
- source_word: אֶל / וְעַל
  choice: au sujet de
  rationale: Les prépositions introduisent ici les objets concernés par la déclaration, et non des destinataires inanimés auxquels elle serait adressée.
- source_word: הָעַמֻּדִים
  choice: les colonnes
  rationale: Désigne les grandes colonnes du Temple ; « colonnes » est le terme architectural français le plus direct.
- source_word: הַיָּם
  choice: la Mer
  rationale: Désigne par son nom le grand bassin du Temple ; la majuscule signale qu’il s’agit d’un élément particulier du mobilier cultuel.
- source_word: הַמְּכֹנוֹת
  choice: les supports
  rationale: Terme suffisamment large pour les structures ou bases mobiles portant les bassins du Temple, sans préciser au-delà de l’hébreu.
- source_word: יֶתֶר הַכֵּלִים
  choice: le reste des objets
  rationale: כֵּלִים est un terme large désignant ici les objets du Temple ; « objets » évite de le limiter aux récipients ou aux ustensiles.
- source_word: הַנּוֹתָרִים
  choice: qui sont encore
  rationale: 'Exprime naturellement la valeur du participe : ces objets demeurent dans la ville après les déportations précédentes.'
- source_word: בָּעִיר הַזֹּאת
  choice: dans cette ville
  rationale: Rendu locatif direct ; dans le contexte, la ville est Jérusalem.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme ; sa transcription préserve ici le nom propre divin sans le remplacer par un titre.
- issue: Rendu du titre צְבָאוֹת
  choice: des armées
  alternative: des puissances
  rationale: « Des armées » maintient le sens concret et pluriel du titre hébreu sans lui imposer une interprétation plus abstraite.
translation_notes:
  register: Français international moderne, clair et soutenu. La syntaxe prophétique est rendue idiomatiquement par « voici ce que dit ». Le deux-points final est conservé, car la déclaration se poursuit dans les versets suivants.
