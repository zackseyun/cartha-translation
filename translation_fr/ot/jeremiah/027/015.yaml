source:
  edition: WLC
  text: כִּ֣י לֹ֤א שְׁלַחְתִּי/ם֙ נְאֻם יְהוָ֔ה וְ/הֵ֛ם נִבְּאִ֥ים בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר לְמַ֨עַן הַדִּיחִ֤/י אֶתְ/כֶם֙ וַ/אֲבַדְתֶּ֔ם אַתֶּ֕ם וְ/הַ/נְּבִאִ֖ים הַֽ/נִּבְּאִ֥ים לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/015.yaml
  text: For I did not send them[a], declares Yahweh, and they are prophesying falsely in my name, so that I may drive you out[b], and you will perish—you and the prophets who are prophesying to you.
translation:
  language: fr
  text: Car je ne les ai pas envoyés, déclare Yahweh, et ils prophétisent faussement en mon nom, afin que je vous chasse et que vous périssiez, vous et les prophètes qui vous prophétisent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que je vous bannisse » ; le verbe hébreu peut exprimer l’idée de chasser, d’expulser ou de bannir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’avertissement précédent et conserve clairement le lien explicatif.
- source_word: לֹא שְׁלַחְתִּים
  choice: je ne les ai pas envoyés
  rationale: Le parfait qal avec suffixe masculin pluriel désigne une action niée antérieure à la prise de parole; le passé composé est naturel en français moderne.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique avec dignité tout en conservant le nom divin יהוה.
- source_word: וְהֵם נִבְּאִים בִּשְׁמִי לַשָּׁקֶר
  choice: et ils prophétisent mensongèrement en mon nom
  rationale: Le participe exprime une activité en cours. « Mensongèrement » rend la valeur adverbiale de לַשָּׁקֶר sans atténuer l’accusation, et « en mon nom » conserve l’expression d’autorité revendiquée.
- source_word: לְמַעַן
  choice: afin que
  rationale: Préserve la formulation forte de but ou de résultat visé, sans réduire la tension théologique du texte.
- source_word: הַדִּיחִי אֶתְכֶם
  choice: je vous chasse
  rationale: Dans le contexte du jugement et de l’exil, le hiphil de נדח évoque l’expulsion ou le bannissement plutôt qu’un simple égarement.
- source_word: וַאֲבַדְתֶּם
  choice: et que vous périssiez
  rationale: La coordination avec « afin que » appelle le subjonctif en français; « périr » conserve l’idée générale de ruine sans préciser indûment son mode.
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: les prophètes qui prophétisent pour vous
  rationale: Conserve la répétition emphatique du nom et du participe; « pour vous » rend לָכֶם comme désignant les destinataires ou bénéficiaires prétendus de leurs prophéties.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Rapport entre les fausses prophéties et le jugement divin introduit par לְמַעַן
  choice: afin que je vous chasse et que vous périssiez
  alternative: de sorte que je vous chasserai et que vous périrez
  rationale: La formulation finale du texte hébreu est maintenue afin de ne pas effacer la tension entre l’action trompeuse des prophètes et le jugement souverain de Dieu; la lecture purement consécutive demeure possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La coordination hébraïque est conservée par « et »; la phrase garde volontairement la forte expression de finalité du texte source.
