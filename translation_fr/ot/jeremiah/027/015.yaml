revisions:
- from: Car je ne les ai pas envoyés, déclare Yahweh, et ils prophétisent mensongèrement en mon nom, afin que je vous chasse[a] et que vous périssiez, vous et les prophètes qui prophétisent pour vous.
  to: Car je ne les ai pas envoyés, déclare Yahweh, et ils prophétisent faussement en mon nom, afin que je vous chasse et que vous périssiez, vous et les prophètes qui vous prophétisent[a].
  rationale: La révision rend לָכֶם par « vous » plutôt que « pour vous », afin de préserver le sens de destinataires. Elle emploie « faussement », plus naturel, et resserre la note lexicale sur les sens contextuellement pertinents du verbe נדח. L’ancre de note est déplacée à la fin de la proposition contenant « chasse », ce qui évite de l’insérer au milieu de la coordination française.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle au texte massorétique : Yahweh nie avoir envoyé ces prophètes, dénonce leur prophétie mensongère en son nom et annonce l’expulsion suivie de la perte du peuple et de ses prophètes. La finale לָכֶם désigne les destinataires des prophéties ; « pour vous » risque d’indiquer un bénéfice ou une action accomplie en leur faveur.'
  naturalness: La phrase est claire et de registre prophétique soutenu. « Prophétisent faussement » est plus idiomatique en français moderne international que « prophétisent mensongèrement ». « Qui vous prophétisent » conserve de façon acceptable la répétition emphatique de l’hébreu et rend plus exactement le complément « à vous ».
  terminology: « Yahweh », « en mon nom », « chasser » et « périr » sont appropriés. La note proposée doit éviter « disperser », qui est moins directement justifié ici que les sens d’expulsion, de bannissement ou de mise au dehors.
  issues:
  - severity: medium
    issue: « pour vous » dans la dernière proposition
    rationale: 'Le לָכֶם hébreu se comprend ici comme « à vous » : les prophètes s’adressent au peuple. « Pour vous » peut suggérer qu’ils prophétisent en faveur du peuple, nuance qui n’est pas exprimée par le texte.'
  - severity: low
    issue: « mensongèrement »
    rationale: Le mot est correct, mais « faussement » est plus naturel dans l’usage moderne tout en rendant exactement la valeur de לַשָּׁקֶר.
  - severity: low
    issue: 'Note : « disperser »'
    rationale: La note anglaise et le contexte soutiennent « chasser / bannir / expulser ». « Disperser » peut être une conséquence de l’exil, mais n’est pas l’alternative lexicale la plus précise pour ce verbe dans ce verset.
