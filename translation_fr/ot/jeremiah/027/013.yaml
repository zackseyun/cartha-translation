  text: לָ֤/מָּה תָמ֨וּתוּ֙ אַתָּ֣ה וְ/עַמֶּ֔/ךָ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר֙ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה אֶל הַ/גּ֕וֹי אֲשֶׁ֥ר לֹֽא יַעֲבֹ֖ד אֶת מֶ֥לֶךְ בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/013.yaml
  text: Why will you and your people die by the sword, by famine, and by pestilence, just as the LORD has spoken concerning the nation that will not serve the king of Babylon?
translation:
  language: fr
  text: Pourquoi toi et ton peuple mourriez-vous par l’épée, par la famine et par la peste, comme l’Éternel l’a déclaré au sujet de la nation qui ne servira pas le roi de Babylone ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה תָמוּתוּ
  choice: Pourquoi mourriez-vous
  rationale: La question hébraïque avertit d’une conséquence évitable plutôt que de demander simplement la cause d’une mort certaine. Le conditionnel français rend naturellement cette force exhortative.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: par l’épée, par la famine et par la peste
  rationale: Conserve la triade traditionnelle de jugements et la répétition de la préposition, dans un français clair et solennel.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Rend la comparaison ou la conformité exprimée par le terme hébreu sans ajouter une insistance absente du texte source.
- source_word: דִּבֶּר
  choice: a déclaré
  rationale: Dans ce contexte prophétique, « déclarer » exprime une parole divine prononcée et faisant autorité, tout en restant naturel en français.
- source_word: יַעֲבֹד אֶת־מֶלֶךְ בָּבֶל
  choice: servira le roi de Babylone
  rationale: « Servir » préserve l’étendue du verbe hébreu, qui peut désigner ici la soumission politique et le service imposé.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé
  rationale: « l’Éternel » est une forme française biblique largement reconnue qui signale le nom divin sans imposer une vocalisation discutée.
- issue: Portée temporelle de לֹא יַעֲבֹד
  choice: qui ne servira pas
  alternative: qui refuse de servir
  rationale: Le futur français suit la forme verbale hébraïque et laisse ouverte la nuance entre refus présent et non-soumission future, sans ajouter explicitement l’idée de refus.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier « toi » vise le roi, tandis que « mourriez-vous » inclut le roi et son peuple. La formulation conserve la question rhétorique et la série épée-famine-peste.
