  text: כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֣ים לָ/כֶ֑ם לְמַ֨עַן הַרְחִ֤יק אֶתְ/כֶם֙ מֵ/עַ֣ל אַדְמַתְ/כֶ֔ם וְ/הִדַּחְתִּ֥י אֶתְ/כֶ֖ם וַ/אֲבַדְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/010.yaml
  text: For they are prophesying lies to you[a], in order to remove you from your land; and I will drive you out[c][b], and you will perish.
translation:
  language: fr
  text: Car ils vous prophétisent des mensonges[a], afin de vous éloigner de votre terre[b] ; je vous chasserai[c], et vous périrez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le mensonge » ou « la fausseté ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin de vous tenir loin de votre terre ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu passe ici à une action divine explicite : « et je vous chasserai, et vous périrez ».'
    reason: cross_reference
lexical_decisions:
- source_word: שֶׁקֶר
  choice: des mensonges
  rationale: Le nom peut désigner le mensonge, la fausseté ou des paroles mensongères. Le pluriel français est ici naturel avec « prophétiser » tout en conservant l’idée de tromperie.
- source_word: נִבְּאִים לָכֶם
  choice: ils vous prophétisent
  rationale: Le participe niphal de נבא exprime ici une activité en cours. La tournure transitive avec pronom indirect est claire et idiomatique en français.
- source_word: לְמַעַן הַרְחִיק אֶתְכֶם מֵעַל אַדְמַתְכֶם
  choice: afin de vous éloigner de votre terre
  rationale: לְמַעַן introduit le but ou le résultat visé, tandis que le hiphil de רחק exprime l’éloignement causé. « Terre » convient au contexte territorial de l’exil.
- source_word: וְהִדַּחְתִּי אֶתְכֶם
  choice: et moi, je vous chasserai
  rationale: Le hiphil de נדח indique l’action de chasser ou bannir. Le pronom tonique « moi » met en relief le passage à l’intervention divine explicite sans ajouter un nouvel agent au texte.
- source_word: וַאֲבַדְתֶּם
  choice: et vous périrez
  rationale: אבד exprime ici la perte ou la ruine pouvant aller jusqu’à la mort. « Périr » conserve la gravité de l’énoncé sans en préciser indûment les modalités.
theological_decisions:
- issue: L’agent dans la succession du mensonge et du jugement
  choice: 'Les prophètes annoncent des mensonges dans le but ou avec le résultat d’éloigner le peuple, puis Dieu déclare explicitement : « moi, je vous chasserai ».'
  alternative: Comprendre les faux prophètes comme les agents implicites de l’ensemble de l’éloignement et de l’expulsion.
  rationale: La syntaxe hébraïque distingue l’infinitif causatif après לְמַעַן de la première personne explicite וְהִדַּחְתִּי. La traduction maintient ce changement d’agent et la tension qu’il produit.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule fait ressortir le passage des prophéties mensongères à l’action divine, tandis que « moi » rend sensible l’agent explicite en hébreu.
