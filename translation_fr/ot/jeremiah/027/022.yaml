id: JER.27.22
reference: Jeremiah 27:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּבֶ֥לָ/ה יוּבָ֖אוּ וְ/שָׁ֣מָּ/ה יִֽהְי֑וּ עַ֠ד י֣וֹם פָּקְדִ֤/י אֹתָ/ם֙ נְאֻם יְהוָ֔ה וְ/הַֽעֲלִיתִי/ם֙ וַ/הֲשִׁ֣יבֹתִ֔י/ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/022.yaml
  text: They will be brought to Babylon[a], and there they will remain until the day I attend to them, declares Yahweh[b]. Then I will bring them up and restore them to this place.
translation:
  language: fr
  text: Ils seront emmenés à Babylone et ils y resteront jusqu’au jour où je m’occuperai d’eux[a], déclare Yahweh. Alors je les ferai remonter[b] et je les ramènerai en ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « je les visiterai » ou « j’interviendrai à leur égard ». Selon le contexte, cette intervention peut être favorable ou punitive ; ici, la suite annonce une restauration.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « je les ferai monter ». Cette expression évoque ici le retour depuis l’exil vers le pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le ה directionnel indique un mouvement vers Babylone ; « à Babylone » est la formulation française naturelle.
- source_word: יוּבָאוּ
  choice: seront emmenés
  rationale: 'Le hophal de בוא exprime ici une action passive : les objets seront transportés par d’autres.'
- source_word: וְשָׁמָּה יִהְיוּ
  choice: et ils y resteront
  rationale: Avec l’adverbe locatif, היה exprime naturellement ici le maintien dans ce lieu, et non la simple existence.
- source_word: פָּקְדִי אֹתָם
  choice: je m’occuperai d’eux
  rationale: פקד peut désigner une visite ou une intervention, favorable ou punitive. Cette formulation française préserve une certaine ouverture sémantique, tandis que la suite immédiate indique une issue favorable.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formule prophétique rendue de façon naturelle et solennelle ; le nom divin est translittéré.
- source_word: וְהַעֲלִיתִים
  choice: je les ferai remonter
  rationale: Le hiphil de עלה signifie littéralement « faire monter » ou « faire remonter » et conserve l’image du retour depuis l’exil.
- source_word: וַהֲשִׁיבֹתִים
  choice: je les ramènerai
  rationale: Le hiphil de שוב avec un complément d’objet exprime le fait de faire revenir ou de ramener.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Le texte dit précisément « ce lieu » ; il n’est pas nécessaire d’expliciter Jérusalem ou le pays.
theological_decisions:
- issue: Valeur de פקד dans un contexte de restauration
  choice: « je m’occuperai d’eux », compris dans le contexte comme une intervention favorable
  alternative: « je les visiterai » ou « j’interviendrai en leur faveur »
  rationale: Le verbe peut évoquer aussi bien une intervention judiciaire qu’une intervention favorable. La traduction évite d’introduire l’idée de châtiment, exclue par la promesse qui suit, sans rendre le verbe plus explicitement favorable que l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « Emmenés » convient aux objets du sanctuaire évoqués dans le contexte. La répétition « ferai remonter… ramènerai » conserve les deux verbes hébreux distincts et leur nuance.
