  text: אֲשֶׁ֣ר לֹֽא לְקָחָ֗/ם נְבֽוּכַדְנֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל בַּ֠/גְלוֹת/וֹ אֶת יְכָונְיָ֨ה בֶן יְהוֹיָקִ֧ים מֶֽלֶךְ יְהוּדָ֛ה מִ/ירֽוּשָׁלִַ֖ם בָּבֶ֑לָ/ה וְ/אֵ֛ת כָּל חֹרֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/020.yaml
  text: which Nebuchadnezzar king of Babylon did not take when he exiled Jeconiah son of Jehoiakim[a], king of Judah, from Jerusalem to Babylon[c][b], along with all the nobles of Judah and Jerusalem.
translation:
  language: fr
  text: que Nabuchodonosor, roi de Babylone, n’avait pas emportés lorsqu’il déporta[c] de Jérusalem à Babylone Jéconias[a], fils de Joïakim et roi de Juda, ainsi que tous les notables[b] de Juda et de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Yekonya; ce nom est aussi transcrit Jekonia.'
    reason: lexical_alternative
  - marker: b
    text: Ou « dignitaires » ou « hauts responsables ».
    reason: lexical_alternative
  - marker: c
    text: Ou « emmena en exil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לֹא לְקָחָם
  choice: que … n’avait pas emportés
  rationale: Le relatif renvoie aux objets mentionnés au verset précédent. Le plus-que-parfait exprime naturellement en français l’action antérieure à la déportation, et « emporter » convient à des objets transportés comme butin.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabuchodonosor, roi de Babylone
  rationale: « Nabuchodonosor » est la forme française traditionnelle et largement reconnue du nom royal; le titre est rendu directement.
- source_word: בַּגְלוֹתוֹ
  choice: lorsqu’il déporta
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle. « Déporta » rend de façon concise l’envoi forcé en exil sans préciser davantage le procédé.
- source_word: יְכָונְיָה בֶן יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Jéconias, fils de Joïakim et roi de Juda
  rationale: Les formes françaises usuelles des noms sont retenues. La coordination évite de laisser entendre que Joïakim, plutôt que Jéconias, porte ici le titre de roi de Juda.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: de Jérusalem à Babylone
  rationale: Les deux indications directionnelles marquent clairement le point de départ et la destination.
- source_word: וְאֵת כָּל חֹרֵי יְהוּדָה וִירוּשָׁלִָם
  choice: ainsi que tous les notables de Juda et de Jérusalem
  rationale: Dans ce contexte politique et social, חֹרֵי désigne les hommes de haut rang. « Notables » est naturel en français et laisse ouverte la question de leur fonction officielle précise.
theological_decisions: []
