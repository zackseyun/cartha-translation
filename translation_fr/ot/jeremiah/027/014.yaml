source:
  edition: WLC
  text: וְ/אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י הַ/נְּבִאִ֗ים הָ/אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֣לֶךְ בָּבֶ֑ל כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֥ים לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/014.yaml
  text: And do not listen to the words of the prophets who are saying to you[a], ‘You will not serve the king of Babylon,’ for they are prophesying a lie to you.
translation:
  language: fr
  text: 'Et n’écoutez pas les paroles des prophètes qui vous disent : « Vous ne servirez pas le roi de Babylone[a] », car ce qu’ils vous prophétisent est un mensonge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne servez pas le roi de Babylone. » La forme hébraïque peut exprimer une interdiction, mais, dans ce contexte, elle désigne probablement la fausse prédiction des prophètes selon laquelle Juda ne serait pas soumis à Babylone.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַל תִּשְׁמְעוּ
  choice: Et n’écoutez pas
  rationale: וְ relie l’exhortation au contexte précédent, tandis que אַל suivi de l’inaccompli exprime une défense. « Écouter » rend ici l’idée de prêter attention et d’accorder foi.
- source_word: אֶל דִּבְרֵי הַנְּבִאִים
  choice: les paroles des prophètes
  rationale: Cette formulation conserve l’expression hébraïque centrée sur les paroles prononcées, tout en restant naturelle en français.
- source_word: הָאֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: qui vous disent
  rationale: Le participe décrit leur discours en cours ou répété. « Qui vous disent » est idiomatique et évite la lourdeur d’une répétition de « dire ».
- source_word: לֹא תַעַבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: Vous ne servirez pas le roi de Babylone
  rationale: Dans ce discours prophétique rapporté, l’inaccompli se comprend le mieux comme une prédiction niant la future soumission à Babylone. Le sens de עבד avec un roi est ici « servir », avec la nuance d’être assujetti.
- source_word: כִּי שֶׁקֶר הֵם נִבְּאִים לָכֶם
  choice: car c’est un mensonge qu’ils vous prophétisent
  rationale: כִּי introduit la raison de ne pas les écouter. La construction française met clairement שֶׁקֶר (« mensonge ») en relation avec leur activité prophétique et garde le singulier hébreu.
theological_decisions:
- issue: Nature du message des faux prophètes
  choice: Comprendre « Vous ne servirez pas le roi de Babylone » comme une fausse prédiction.
  alternative: 'Comprendre la phrase comme une défense : « Ne servez pas le roi de Babylone. »'
  rationale: Dans le contexte, Jérémie met en garde contre des prophètes qui nient la domination babylonienne. Toutefois, la forme hébraïque peut aussi exprimer une interdiction; cette ambiguïté réelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de l’hébreu sans être artificielle; « c’est un mensonge qu’ils vous prophétisent » conserve l’accent porté sur le caractère mensonger de l’oracle.
