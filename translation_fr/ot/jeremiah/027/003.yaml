source:
  edition: WLC
  text: וְ/שִׁלַּחְתָּ/ם֩ אֶל מֶ֨לֶךְ אֱד֜וֹם וְ/אֶל מֶ֣לֶךְ מוֹאָ֗ב וְ/אֶל מֶ֨לֶךְ֙ בְּנֵ֣י עַמּ֔וֹן וְ/אֶל מֶ֥לֶךְ צֹ֖ר וְ/אֶל מֶ֣לֶךְ צִיד֑וֹן בְּ/יַ֤ד מַלְאָכִים֙ הַ/בָּאִ֣ים יְרוּשָׁלִַ֔ם אֶל צִדְקִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/003.yaml
  text: And send them to the king of Edom[a], the king of Moab, the king of the Ammonites, the king of Tyre, and the king of Sidon, by the hand of the messengers who are coming to Jerusalem to Zedekiah king of Judah.
translation:
  language: fr
  text: Tu les enverras au roi d’Édom, au roi de Moab, au roi des Ammonites[a], au roi de Tyr et au roi de Sidon, par l’intermédiaire des messagers qui viennent à Jérusalem auprès de Sédécias, roi de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « fils d’Ammon », c’est-à-dire les Ammonites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתָּם
  choice: Tu les enverras
  rationale: Le piel accompli à la deuxième personne masculine singulière, avec suffixe objet pluriel, poursuit ici une série d’instructions. Le futur français exprime naturellement cette directive tout en conservant sa forme séquentielle.
- source_word: מֶלֶךְ
  choice: roi de
  rationale: L’état construit introduit chaque territoire ou peuple gouverné; la répétition de « roi » préserve la structure solennelle de l’énumération.
- source_word: בְּנֵי עַמּוֹן
  choice: Ammonites
  rationale: L’expression signifie littéralement « fils d’Ammon », mais fonctionne ici comme une désignation ethnique. « Ammonites » est la formulation française courante; le sens littéral est signalé en note.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: Littéralement « par la main de », cet idiome marque ici l’intermédiaire ou l’agent. La formulation retenue est naturelle en français et adaptée à l’envoi diplomatique.
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Le terme désigne des personnes envoyées avec un message. « Messagers » conserve sa portée générale sans préciser indûment leur rang diplomatique.
- source_word: הַבָּאִים
  choice: qui viennent
  rationale: Le participe avec article caractérise les messagers en train de venir ou d’arriver; le présent français en maintient la valeur participiale.
- source_word: אֶל צִדְקִיָּהוּ
  choice: auprès de Sédécias
  rationale: La préposition אֶל indique la personne vers laquelle les messagers se rendent. « Auprès de » évite en français l’enchaînement ambigu « à Jérusalem à Sédécias ».
theological_decisions:
- issue: Rendu de l’expression ethnique masculine בְּנֵי עַמּוֹן
  choice: Ammonites dans le texte, avec le littéral en note
  alternative: fils d’Ammon
  rationale: Dans cette liste géopolitique, l’expression hébraïque sert de nom de peuple. Le français idiomatique « Ammonites » communique cette fonction sans effacer la forme littérale, conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. L’énumération répétitive est conservée, tandis que les idiomes hébreux sont rendus naturellement. Le futur à valeur injonctive s’inscrit dans le ton des instructions prophétiques.
