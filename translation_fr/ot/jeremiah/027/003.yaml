  naturalness: Le français est moderne, clair et d’un registre biblique sobre. La répétition de « au roi de » conserve utilement la structure solennelle de l’hébreu. « À Jérusalem auprès de Sédécias » évite une double construction en « à » maladroite tout en gardant les deux compléments de destination.
