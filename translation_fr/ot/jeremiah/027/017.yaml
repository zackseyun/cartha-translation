  text: אַל תִּשְׁמְע֣וּ אֲלֵי/הֶ֔ם עִבְד֥וּ אֶת מֶֽלֶךְ בָּבֶ֖ל וִֽ/חְי֑וּ לָ֧/מָּה תִֽהְיֶ֛ה הָ/עִ֥יר הַ/זֹּ֖את חָרְבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/017.yaml
  text: Do not listen to them[a]. Serve the king of Babylon and live[b]. Why should this city become a ruin?
translation:
  language: fr
  text: Ne les écoutez pas[a]. Servez le roi de Babylone et vivez. Pourquoi cette ville deviendrait-elle une ruine[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne leur obéissez pas ». Le verbe hébreu peut signifier aussi bien écouter que tenir compte de ce qui est dit et y obéir.
    reason: lexical_alternative
  - marker: b
    text: Ou « dévastée ». Le mot hébreu évoque la dévastation et l’état de ruine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֲלֵיהֶם
  choice: Ne les écoutez pas
  rationale: Avec אֶל, le verbe שׁמע signifie ici écouter quelqu’un, avec la nuance possible de lui prêter attention ou de lui obéir. La formulation française reste naturelle et conserve cette portée contextuelle.
- source_word: עִבְדוּ
  choice: Servez
  rationale: Le verbe עבד exprime ici le service et la soumission politique au roi de Babylone. « Servez » garde l’ampleur du terme hébreu.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Cette traduction directe du groupe construit est claire et courante en français.
- source_word: וִחְיוּ
  choice: et vivez
  rationale: La coordination de deux impératifs est conservée. Le second exprime aussi la conséquence attendue de la soumission, sans que cette relation soit explicitée davantage que dans l’hébreu.
- source_word: לָמָּה תִהְיֶה
  choice: Pourquoi … deviendrait-elle
  rationale: Le conditionnel présent rend naturellement en français la question rhétorique portant sur une conséquence future évitable, tandis que « devenir » exprime le passage à l’état annoncé.
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Rendu idiomatique et direct de la construction démonstrative hébraïque.
- source_word: חָרְבָּה
  choice: un lieu dévasté
  rationale: Le substantif désigne un état ou un lieu de dévastation. Cette formulation française est naturelle et maintient sa valeur nominale.
theological_decisions: []
