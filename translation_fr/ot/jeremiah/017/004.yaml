  text: וְ/שָׁמַטְתָּ֗ה וּ/בְ/ךָ֙ מִ/נַּחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וְ/הַעֲבַדְתִּ֨י/ךָ֙ אֶת אֹ֣יְבֶ֔י/ךָ בָּ/אָ֖רֶץ אֲשֶׁ֣ר לֹֽא יָדָ֑עְתָּ כִּֽי אֵ֛שׁ קְדַחְתֶּ֥ם בְּ/אַפִּ֖/י עַד עוֹלָ֥ם תּוּקָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/004.yaml
  text: And you[a] yourself will let go of your inheritance that I gave you, and I will make you serve your enemies in a land that you have not known; for you have kindled a fire in my anger[d][c][b]—it will burn forever.
translation:
  language: fr
  text: 'Et tu devras toi-même renoncer à l’héritage que je t’ai donné, et je te ferai servir tes ennemis dans un pays que tu n’as pas connu ; car vous avez allumé un feu dans ma colère[b][c] : il brûlera pour toujours[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: L’hébreu passe ici du singulier (« tu ») au pluriel (« vous »), peut-être de Juda personnifié à l’ensemble du peuple.
    reason: alternative_reading
  - marker: c
    text: Ou « dans ma fureur ». Littéralement, l’hébreu dit « dans mon nez », expression idiomatique qui désigne la colère.
    reason: lexical_alternative
  - marker: d
    text: Ou « perpétuellement » ou « pour une durée indéfinie ». Selon le contexte, le mot hébreu עוֹלָם peut exprimer une durée permanente, très longue ou sans terme précisé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַטְתָּה וּבְךָ
  choice: tu abandonneras toi-même
  rationale: Le verbe שׁמט évoque l’action de lâcher, de laisser tomber ou de renoncer à quelque chose. « Abandonneras » exprime naturellement ici la perte contrainte de l’héritage, tandis que « toi-même » rend l’insistance difficile de וּבְךָ sans introduire une causalité absente du texte.
- source_word: מִנַּחֲלָתְךָ
  choice: l’héritage
  rationale: נחלה désigne l’héritage ou la possession reçue, ici notamment le pays accordé par Dieu. « Héritage » conserve sa portée territoriale et liée à l’alliance.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: que je t’ai donné
  rationale: Traduction directe et naturelle de la proposition relative ; le passé composé convient au français moderne.
- source_word: וְהַעֲבַדְתִּיךָ אֶת אֹיְבֶיךָ
  choice: je te ferai servir tes ennemis
  rationale: La forme causative de עבד signifie « faire servir ». Cette formulation conserve la contrainte du jugement et prend « tes ennemis » comme complément direct.
- source_word: בָּאָרֶץ אֲשֶׁר לֹא יָדָעְתָּ
  choice: dans un pays que tu n’as pas connu
  rationale: ידע exprime ici la connaissance ou la familiarité acquise par expérience. La formulation garde l’étrangeté du pays d’exil.
- source_word: אֵשׁ קְדַחְתֶּם
  choice: vous avez allumé un feu
  rationale: קדח signifie allumer ou attiser un feu. Le pronom « vous » préserve explicitement le passage de la deuxième personne du singulier au pluriel.
- source_word: בְּאַפִּי
  choice: dans ma colère
  rationale: אַף signifie littéralement « nez » ou « narine », mais fonctionne couramment comme un idiome hébreu désignant la colère. « Dans ma colère » reste proche de la construction source tout en étant intelligible.
- source_word: עַד עוֹלָם תּוּקָד
  choice: il brûlera pour toujours
  rationale: Le sujet implicite renvoie au feu. עַד עוֹלָם exprime une durée persistante ou indéfinie et se rend naturellement ici par « pour toujours ».
theological_decisions:
- issue: Passage de la deuxième personne du singulier au pluriel
  choice: Maintenir « tu » dans les premières propositions, puis « vous avez allumé ».
  alternative: Uniformiser tout le verset au singulier ou au pluriel.
  rationale: Le changement grammatical appartient au texte hébreu et peut faire passer de Juda personnifié au peuple pris collectivement. Le conserver évite de résoudre silencieusement cette tension rhétorique.
- issue: Portée temporelle de עַד עוֹלָם dans une déclaration de jugement
  choice: Traduire par « pour toujours » dans le texte principal.
  alternative: « perpétuellement » ou « pour une durée indéfinie »
  rationale: La formule présente ici le jugement comme durable et sans terme indiqué. La note signale toutefois que עוֹלָם peut, selon le contexte, désigner une durée indéfinie plutôt qu’une éternité au sens philosophique.
- issue: Image du feu dans la colère divine
  choice: Conserver la formulation métaphorique « un feu dans ma colère ».
  alternative: Expliciter par « le feu de ma colère » ou paraphraser comme une colère ardente.
  rationale: La syntaxe hébraïque maintient une relation qui peut sembler inhabituelle entre le feu allumé et la colère divine. La traduction ne précise pas davantage que la source la nature exacte de cette relation.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme prophétique est conservé par une phrase ample, et l’alternance visible entre « tu » et « vous » reproduit la tension grammaticale de l’hébreu. « Pays » est préféré à « terre » pour désigner clairement le territoire étranger, tandis que « héritage » maintient la portée territoriale et théologique de נחלה.
