  variant: modern international French
source:
  edition: WLC
  text: וְ֠/הָיָה אִם שָׁמֹ֨עַ תִּשְׁמְע֤וּ/ן אֵלַ/י֙ נְאֻם יְהוָ֔ה לְ/בִלְתִּ֣י הָבִ֣יא מַשָּׂ֗א בְּ/שַׁעֲרֵ֛י הָ/עִ֥יר הַ/זֹּ֖את בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וּ/לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת לְ/בִלְתִּ֥י עֲשֽׂוֹת ב/ה כָּל מְלָאכָֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/024.yaml
  text: And it shall be[a], if you truly listen to me, declares Yahweh, by not bringing a load through the gates of this city on the Sabbath day, and by keeping the Sabbath day holy, by not doing any work on it[b],
translation:
  language: fr
  text: 'Et voici ce qui arrivera : si vous m’écoutez vraiment, déclare Yahweh, en ne faisant passer aucune charge par les portes de cette ville le jour du sabbat, en respectant le caractère sacré du jour du sabbat et en ne faisant aucun travail dans cette ville,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Et voici ce qui arrivera
  rationale: Introduit de façon naturelle en français la conséquence de la condition, laquelle se poursuit au verset suivant.
- source_word: אִם שָׁמֹעַ תִּשְׁמְעוּן אֵלַי
  choice: si vous m’écoutez vraiment
  rationale: Le redoublement hébreu renforce le verbe. « Écoutez vraiment » conserve à la fois l’image de l’écoute et sa portée d’obéissance.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique avec solennité et conserve le nom divin.
- source_word: לְבִלְתִּי הָבִיא מַשָּׂא
  choice: en ne faisant passer aucune charge
  rationale: Dans ce contexte, il s’agit du transport d’une charge. La tournure causative française convient au mouvement à travers les portes.
- source_word: בְּשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: par les portes de cette ville
  rationale: « Par » exprime naturellement le passage au moyen des portes de la ville.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: Conserve l’expression explicite « jour du sabbat » dans un français courant.
- source_word: וּלְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: en gardant saint le jour du sabbat
  rationale: Exprime le fait de considérer et de maintenir ce jour comme saint, sans recourir au terme plus technique « sanctifier ».
- source_word: לְבִלְתִּי עֲשׂוֹת בָהּ כָּל מְלָאכָה
  choice: en n’y faisant aucun travail
  rationale: Rend directement l’interdiction de toute activité de travail pendant ce jour.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre divin.
- issue: Portée de שׁמע
  choice: écoutez vraiment
  alternative: obéissez fidèlement
  rationale: Le verbe implique ici l’obéissance, mais le choix principal conserve son sens lexical d’écoute tandis que les propositions suivantes précisent l’obéissance attendue.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule parce que la conséquence de la condition apparaît au verset suivant. Le parallélisme des trois propositions infinitives est conservé par « en… ».
