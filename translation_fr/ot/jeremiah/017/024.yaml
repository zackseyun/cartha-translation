review_pass:
  verdict: revise
  source_fidelity: La proposition principale rend bien la condition et l’intensif de שָׁמֹעַ תִּשְׁמְעוּן. Toutefois, le suffixe de בָּהּ est féminin et renvoie le plus naturellement à « cette ville » (עִיר, féminin), non à « le jour du sabbat » (יוֹם, masculin). « N’y » peut en français être rattaché au jour tout juste mentionné et masque ce référent important.
  naturalness: Le français est globalement clair et de registre approprié. « Garder saint le jour du sabbat » est compréhensible, mais peu idiomatique en français international moderne; « en respectant le caractère sacré du jour du sabbat » exprime naturellement le sens de קדשׁ dans ce contexte.
  terminology: « Yahweh », « sabbat », « charge » et « travail » conviennent. « Charge » conserve utilement le sens concret de מַשָּׂא sans réduire indûment le terme à du commerce.
  issues:
  - severity: medium
    issue: Référent de « n’y » insuffisamment explicite
    rationale: Le suffixe hébreu בָּהּ est féminin. Il vise vraisemblablement « cette ville » plutôt que « le jour du sabbat », qui est masculin. Le français doit rendre ce référent explicitement afin de ne pas transférer l’interdiction de travailler de la ville au jour.
  - severity: low
    issue: « en gardant saint » est peu naturel
    rationale: La tournure est calquée sur une formulation biblique traditionnelle. Une expression moderne telle que « en respectant le caractère sacré » conserve le sens de traiter le sabbat comme saint.
  revised_text: 'Et voici ce qui arrivera : si vous m’écoutez vraiment, déclare Yahweh, en ne faisant passer aucune charge par les portes de cette ville le jour du sabbat, en respectant le caractère sacré du jour du sabbat et en ne faisant aucun travail dans cette ville,'
  revised_footnotes: []
