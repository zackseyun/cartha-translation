  text: כִּסֵּ֣א כָב֔וֹד מָר֖וֹם מֵֽ/רִאשׁ֑וֹן מְק֖וֹם מִקְדָּשֵֽׁ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/012.yaml
  text: A glorious throne[a], exalted from the beginning, is the place of our sanctuary.
translation:
  language: fr
  text: Un trône de gloire[a], élevé dès le commencement, est le lieu de notre sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un trône de gloire, en hauteur dès le commencement, est le lieu de notre sanctuaire » ; peut-être aussi : « Ô trône de gloire, élevé dès le commencement, lieu de notre sanctuaire ! » L’hébreu est très condensé et permet plusieurs analyses syntaxiques.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּסֵּא
  choice: trône
  rationale: Le nom désigne couramment un siège royal ou le siège du pouvoir. « Trône » conserve la force royale et théologique de l’image.
- source_word: כָבוֹד
  choice: de gloire
  rationale: Le complément nominal reproduit au plus près la construction hébraïque כִּסֵּא כָבוֹד et en préserve le registre élevé.
- source_word: מָרוֹם
  choice: élevé
  rationale: Le terme évoque la hauteur et peut ici qualifier le trône. « Élevé » exprime naturellement l’élévation, tout en laissant résonner l’idée de majesté.
- source_word: מֵרִאשׁוֹן
  choice: dès le commencement
  rationale: Cette formulation idiomatique conserve l’idée d’une origine ancienne ou primordiale.
- source_word: מְקוֹם
  choice: lieu
  rationale: Traduction directe du sens fondamental, sans ajouter l’idée interprétative de demeure.
- source_word: מִקְדָּשֵׁנוּ
  choice: notre sanctuaire
  rationale: « Sanctuaire » exprime clairement le lieu saint et le possessif rend le suffixe de première personne du pluriel.
theological_decisions:
- issue: Relation syntaxique entre les propositions nominales
  choice: Le verset est formulé comme une phrase nominale identifiant le trône de gloire, élevé dès le commencement, au lieu du sanctuaire.
  alternative: « Trône de gloire, élevé dès le commencement, lieu de notre sanctuaire ! » ou « Un trône de gloire, en hauteur dès le commencement, est le lieu de notre sanctuaire. »
  rationale: L’hébreu, très condensé et sans verbe exprimé, autorise plusieurs analyses. Le texte principal retient une identification syntaxiquement plausible, tandis que la note préserve les autres lectures sans trancher indûment.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « trône de gloire » conserve la construction nominale et le relief poétique de l’hébreu ; la note signale explicitement son ambiguïté syntaxique.
