id: JER.17.10
reference: Jeremiah 17:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֧י יְהוָ֛ה חֹקֵ֥ר לֵ֖ב בֹּחֵ֣ן כְּלָי֑וֹת וְ/לָ/תֵ֤ת לְ/אִישׁ֙ כ/דרכ/ו כִּ/פְרִ֖י מַעֲלָלָֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/010.yaml
  text: I[a], Yahweh, search the heart[b], testing the kidneys, to give to each man according to his way, according to the fruit of his deeds.
translation:
  language: fr
  text: Moi, Yahweh, je sonde le cœur et j’examine les reins[a], pour rendre à chacun[b] selon sa conduite, selon le fruit de ses actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les reins », considérés en hébreu ancien comme le siège des pensées et des sentiments les plus intimes.
    reason: cultural_note
  - marker: b
    text: 'Littéralement « à un homme »; le masculin singulier a ici une portée représentative: il s’agit de chaque personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: חֹקֵר לֵב
  choice: je sonde le cœur
  rationale: « Sonder » exprime une investigation profonde et continue; « cœur » conserve l’image anthropologique biblique de la pensée, de la volonté et de la vie intérieure.
- source_word: בֹּחֵן כְּלָיוֹת
  choice: j’examine les reins
  rationale: « Examiner » rend l’évaluation exprimée par le participe, tandis que « reins » maintient l’image concrète hébraïque, expliquée en note.
- source_word: וְלָתֵת
  choice: pour rendre
  rationale: L’infinitif indique ici la finalité de cet examen. En contexte judiciaire, « rendre » est plus naturel en français que « donner » tout en gardant l’idée de rétribution.
- source_word: לְאִישׁ
  choice: à chacun
  rationale: Le masculin singulier hébreu a une portée représentative et distributive. « À chacun » est idiomatique en français et n’exclut personne.
- source_word: כדרכו
  choice: selon sa conduite
  rationale: Le littéral « selon sa voie » désigne ici la manière de vivre; « conduite » transmet clairement ce sens moral en français moderne.
- source_word: כִּפְרִי מַעֲלָלָיו
  choice: selon le fruit de ses actes
  rationale: La métaphore du fruit est conservée, ainsi que la portée morale des actions accomplies.
theological_decisions:
- issue: Imagerie anthropologique du jugement divin
  choice: Conserver « cœur » et « reins », avec une note explicative pour « reins ».
  alternative: Traduire abstraitement par « pensée » et « sentiments profonds ».
  rationale: Les images corporelles hébraïques présentent la connaissance exhaustive que Dieu a de l’être intérieur. Les conserver évite d’imposer une psychologie moderne au texte.
- issue: Portée de לְאִישׁ
  choice: Employer « à chacun ».
  alternative: Employer « à chaque homme ».
  rationale: Dans ce contexte, le masculin singulier a une valeur générique. « À chacun » restitue naturellement en français sa portée distributive et universelle sans ajouter d’interprétation.
- issue: Rapport entre l’examen divin et la rétribution
  choice: Traduire l’infinitif par « pour rendre ».
  alternative: « et donner » ou « afin de donner ».
  rationale: « Pour » garde la nuance de finalité ou de résultat sans trancher plus précisément que ne le permet la construction hébraïque; « rendre » convient au contexte de justice rétributive.
translation_notes:
  register: Français international moderne, digne et accessible. La structure à la première personne et le parallélisme du texte hébreu sont préservés. « Sonder », « conduite » et « actes » restent naturels sans effacer la gravité judiciaire du verset.
