id: JER.17.2
reference: Jeremiah 17:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ/זְכֹּ֤ר בְּנֵי/הֶם֙ מִזְבְּחוֹתָ֔/ם וַ/אֲשֵׁרֵי/הֶ֖ם עַל עֵ֣ץ רַֽעֲנָ֑ן עַ֖ל גְּבָע֥וֹת הַ/גְּבֹהֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/002.yaml
  text: As their children remember their altars and their Asherim beside every green tree[a], on the high hills,
translation:
  language: fr
  text: Tandis que leurs enfants se souviennent de leurs autels et de leurs ashéras[a], près des arbres verdoyants, sur les hautes collines,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs poteaux d’Ashéra » ou « leurs poteaux sacrés ». Le terme hébreu désigne des objets cultuels associés à Ashéra.
    reason: Alternative lexicale préservant l’incertitude sur la forme exacte de ces objets.
lexical_decisions:
- source_word: כִּי
  choice: Tandis que
  rationale: Introduit ici une proposition circonstancielle liée au verset précédent. « Tandis que » conserve ce lien sans imposer une causalité forte.
- source_word: זְכֹּר
  choice: se souviennent
  rationale: Rend directement l’idée de garder ou rappeler à la mémoire; la construction est comprise verbalement avec « leurs enfants » comme sujet.
- source_word: בְּנֵיהֶם
  choice: leurs enfants
  rationale: בנים peut désigner les fils ou, plus largement, les enfants et descendants; le terme inclusif convient au contexte.
- source_word: מִזְבְּחוֹתָם
  choice: leurs autels
  rationale: Traduction directe du terme cultuel, avec maintien du possessif.
- source_word: וַאֲשֵׁרֵיהֶם
  choice: leurs ashéras
  rationale: La translittération préserve l’ambiguïté du terme hébreu, qui désigne des objets cultuels associés à Ashéra, sans préciser indûment leur forme.
- source_word: עַל עֵץ רַעֲנָן
  choice: près des arbres verdoyants
  rationale: עַל exprime ici vraisemblablement la proximité; le singulier hébreu peut avoir une valeur collective, et רַעֲנָן évoque une végétation fraîche et luxuriante.
- source_word: עַל גְּבָעוֹת הַגְּבֹהוֹת
  choice: sur les hautes collines
  rationale: Expression naturelle qui conserve à la fois la localisation élevée et l’arrière-plan des lieux de culte.
theological_decisions:
- issue: Sens de אֲשֵׁרִים dans un contexte idolâtre
  choice: leurs ashéras
  alternative: leurs poteaux d’Ashéra; leurs poteaux sacrés
  rationale: Le mot peut désigner divers objets cultuels associés à la déesse Ashéra, souvent compris comme des poteaux ou symboles en bois. La translittération évite de trancher une question matérielle que le texte ne précise pas.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par une virgule, conformément à sa continuité syntaxique avec le verset suivant. « Ashéras » est employé comme nom commun francisé au pluriel et expliqué en note.
