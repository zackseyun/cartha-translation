reference: Jeremiah 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אָר֤וּר הַ/גֶּ֨בֶר֙ אֲשֶׁ֣ר יִבְטַ֣ח בָּֽ/אָדָ֔ם וְ/שָׂ֥ם בָּשָׂ֖ר זְרֹע֑/וֹ וּ/מִן יְהוָ֖ה יָס֥וּר לִבּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/005.yaml
  text: 'Thus says Yahweh: Cursed is the man who trusts in man and makes flesh his strength[b][a], whose heart turns away from Yahweh.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Maudit est l’homme[b] qui met sa confiance dans l’être humain, qui fait de la chair sa force[a] et dont le cœur se détourne de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui fait de la chair son bras ». Dans cette image, le bras représente la force ou la puissance.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « l’homme » est au masculin singulier, employé ici dans un sens représentatif.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formule conserve la cadence solennelle de la formule prophétique tout en restant naturelle en français moderne.
- source_word: אָרוּר הַגֶּבֶר
  choice: Maudit est l’homme
  rationale: « Maudit est » présente une déclaration, comme l’hébreu, plutôt qu’un souhait. « L’homme » conserve la forme masculine singulière représentative de גֶּבֶר.
- source_word: אֲשֶׁר יִבְטַח בָּאָדָם
  choice: qui met sa confiance dans l’être humain
  rationale: « Met sa confiance » exprime naturellement la confiance placée en quelqu’un. « L’être humain » rend ici אָדָם et maintient le contraste entre l’appui humain et Yahweh, tout en distinguant ce mot de גֶּבֶר.
- source_word: וְשָׂם בָּשָׂר זְרֹעוֹ
  choice: qui fait de la chair sa force
  rationale: La traduction garde « chair », image de la fragilité mortelle, mais rend זְרוֹעַ selon son sens métaphorique de force ou de puissance. Le sens littéral « bras » est signalé en note.
- source_word: וּמִן יְהוָה יָסוּר לִבּוֹ
  choice: et dont le cœur se détourne de Yahweh
  rationale: « Cœur » préserve l’anthropologie biblique, qui englobe la volonté et l’allégeance intérieure. « Se détourne » rend clairement le mouvement d’éloignement exprimé par סוּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
theological_decisions:
- issue: Masculin singulier à valeur représentative
  choice: l’homme
  alternative: la personne
  rationale: Le texte emploie הַגֶּבֶר, masculin singulier, dans un avertissement de portée générale. La traduction conserve cette forme sans limiter l’application du propos aux seuls hommes, ce que précise la note.
- issue: Image du « bras » humain
  choice: sa force
  alternative: son bras
  rationale: זְרוֹעוֹ signifie littéralement « son bras », mais le bras représente ici la force ou la puissance sur laquelle on s’appuie. « Sa force » communique l’idée en français naturel, tandis qu’une note préserve l’image originale.
translation_notes:
  register: Français international moderne, sobre et solennel. La structure conserve la cadence d’un oracle prophétique. « Chair » maintient l’image biblique de la fragilité humaine, tandis que « sa force » évite en français une formulation anatomique opaque.
