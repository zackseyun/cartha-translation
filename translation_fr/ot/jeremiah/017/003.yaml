base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/003.yaml
  text: My mountain in the field—your wealth[a], all your treasures[c][b], and your high places because of sin throughout all your territory—I will give as plunder.
translation:
  language: fr
  text: Ma montagne dans la campagne[a] — tes richesses[b], tous tes trésors et tes hauts lieux, à cause du péché dans tout ton territoire[c] — je les livrerai au pillage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formule hébraïque est difficile. On peut aussi comprendre : « Ô ma montagne dans la campagne ! » Elle peut faire référence à la montagne du Seigneur, c’est-à-dire à Sion ou Jérusalem, mais peut aussi évoquer plus largement une région montagneuse.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu peut aussi signifier « ta puissance », « tes ressources » ou, moins probablement ici, « ton armée ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu peut aussi se traduire : « pour le péché dans tout ton territoire » ou « dans le péché, dans tout ton territoire ». Le rattachement exact de cette expression est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָרִי בַּשָּׂדֶה
  choice: Ma montagne dans la campagne
  rationale: La traduction conserve l’image concrète et le possessif du texte hébreu sans identifier explicitement la montagne à Sion ou à Jérusalem. « Dans la campagne » rend naturellement בַּשָּׂדֶה tout en maintenant l’ambiguïté de la formule.
- source_word: חֵילְךָ
  choice: tes richesses
  rationale: חַיִל peut désigner la force, les ressources, les biens ou une armée. Le parallélisme avec « tous tes trésors » et la mention du pillage favorisent ici le sens économique.
- source_word: כָל אוֹצְרוֹתֶיךָ
  choice: tous tes trésors
  rationale: Le nom peut désigner des trésors, des réserves ou des dépôts. Puisqu’il s’agit de ce qui sera livré au pillage, « trésors » est clair et contextuellement approprié.
- source_word: לָבַז אֶתֵּן
  choice: je les livrerai au pillage
  rationale: Cette formulation française naturelle exprime l’idée de donner ou d’abandonner quelque chose comme butin, tout en conservant la force de l’annonce de jugement.
- source_word: בָּמֹתֶיךָ
  choice: tes hauts lieux
  rationale: « Hauts lieux » est le terme français traditionnel et concis pour les sites de culte aménagés sur les hauteurs, souvent condamnés dans les écrits prophétiques.
- source_word: בְּחַטָּאת
  choice: à cause du péché commis
  rationale: La préposition בְּ est comprise dans un sens causal. L’ajout de « commis » rend la tournure idiomatique en français sans préciser indûment la nature du péché.
- source_word: בְּכָל גְּבוּלֶיךָ
  choice: dans tout ton territoire
  rationale: גְּבוּל peut désigner une frontière ou le territoire qu’elle délimite. Ici, « dans tout ton territoire » exprime clairement l’étendue géographique.
theological_decisions:
- issue: Référent et fonction de « ma montagne dans la campagne »
  choice: Conserver la formule comme un élément placé en tête de la liste de ce que Dieu livrera au pillage, probablement sa montagne, Sion-Jérusalem.
  alternative: 'Comprendre la formule comme une apostrophe : « Ô ma montagne dans la campagne ! », ou comme une désignation plus générale de la région montagneuse.'
  rationale: L’hébreu est syntaxiquement difficile. Le possessif « ma » et le contexte de Jérémie rendent plausible une allusion à la montagne de l’Éternel, mais le texte principal ne remplace pas l’image par « Sion » ou « Jérusalem » et la note signale l’autre analyse.
- issue: Rapport de « à cause du péché » au reste du verset
  choice: Comprendre l’expression comme la cause du jugement qui atteint les biens et les hauts lieux dans tout le territoire.
  alternative: Traduire plus formellement « pour le péché » ou « dans le péché », éventuellement en rattachant plus étroitement l’expression aux seuls hauts lieux.
  rationale: Le sens causal convient au contexte d’un oracle de jugement, mais la note maintient l’ambiguïté de la préposition hébraïque et du rattachement syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la mise en relief initiale et l’accumulation du texte hébreu, avec des tirets pour rendre sa structure inhabituelle sans l’aplanir. Les termes « hauts lieux » et « pillage » conservent respectivement la portée cultuelle et judiciaire du passage.
