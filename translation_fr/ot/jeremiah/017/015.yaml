id: JER.17.15
reference: Jeremiah 17:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּה הֵ֕מָּה אֹמְרִ֖ים אֵלָ֑/י אַיֵּ֥ה דְבַר יְהוָ֖ה יָ֥בוֹא נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/015.yaml
  text: Look[a], they are saying to me, “Where is the word of Yahweh? Let it come now!”
translation:
  language: fr
  text: 'Voici qu’ils me disent : « Où est la parole de Yahweh[a] ? Qu’elle vienne donc ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message de Yahweh ». L’expression hébraïque est la formule prophétique habituelle pour désigner une parole ou un oracle divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette tournure attire l’attention sur la situation présente tout en restant naturelle et digne en français moderne.
- source_word: הֵמָּה אֹמְרִים
  choice: ils me disent
  rationale: Le participe exprime une parole en cours ou répétée ; le présent français la rend sobrement sans imposer une répétition que le contexte seul permet d’inférer.
- source_word: אֵלַי
  choice: me
  rationale: La préposition indique que ces paroles sont adressées à Jérémie ; « contre moi » surinterpréterait leur ton hostile.
- source_word: אַיֵּה
  choice: Où est
  rationale: Rend directement l’interrogatif portant ici sur la présence ou la réalisation attendue de la parole annoncée.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Conserve la formule prophétique habituelle, qui peut désigner une parole, un message ou un oracle divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: יָבוֹא נָא
  choice: Qu’elle vienne donc !
  rationale: Le jussif exprime un défi railleur, et « donc » restitue ici la force insistante de נָא sans lui donner une politesse absente du contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » en préserve le caractère de nom propre.
- issue: Sens de la venue de la parole annoncée
  choice: Qu’elle vienne donc !
  alternative: Qu’elle se réalise donc !
  rationale: Le français retenu conserve l’image hébraïque de la parole qui « vient » et son ambiguïté entre proclamation et accomplissement, au lieu de la résoudre explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. Les guillemets et la ponctuation rendent clairement la citation railleuse ; « Voici que » garde la fonction d’appel à l’attention de הִנֵּה sans archaïsme marqué.
