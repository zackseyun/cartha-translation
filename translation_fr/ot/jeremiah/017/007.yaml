  source_fidelity: 'Le sens fondamental est bien rendu : la béatitude porte sur l’homme qui place sa confiance en Yahweh, Yahweh étant lui-même l’objet ou le fondement de cette confiance. Toutefois, « se confier en » n’est pas l’expression la plus naturelle en français moderne et peut évoquer le fait de se livrer à quelqu’un. « Mettre sa confiance en » rend plus nettement בטח ב. La note conserve à juste titre la possibilité d’une lecture à nuance future de וְהָיָה.'
  naturalness: « Béni est l’homme » convient au registre biblique moderne et solennel. Le remplacement de « se confie en » par « met sa confiance en » améliore sensiblement l’usage courant sans affaiblir le registre. « Yahweh est son assurance » est recevable dans ce contexte et exprime que Yahweh est celui sur qui repose la confiance.
  terminology: « Béni », « l’homme » et « Yahweh » sont appropriés. « Assurance » est un équivalent possible de מִבְטָח dans ce parallélisme avec בטח; la note explique utilement la formulation plus littérale et la possible nuance temporelle.
