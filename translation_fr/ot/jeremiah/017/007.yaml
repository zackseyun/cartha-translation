source:
  edition: WLC
  text: בָּר֣וּךְ הַ/גֶּ֔בֶר אֲשֶׁ֥ר יִבְטַ֖ח בַּֽ/יהוָ֑ה וְ/הָיָ֥ה יְהוָ֖ה מִבְטַחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/007.yaml
  text: Blessed is the man who trusts in Yahweh[b][a], and whose trust is Yahweh.
translation:
  language: fr
  text: Béni est l’homme qui met sa confiance en Yahweh et dont Yahweh est l’assurance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et Yahweh est son assurance ». On peut aussi traduire : « et Yahweh sera son assurance ».'
    reason: La tournure hébraïque permet une formulation plus littérale et peut recevoir une nuance future; la note préserve cette ambiguïté.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni
  rationale: Le participe passif employé adjectivement exprime la bénédiction, avec une portée plus objective et théologique que « heureux ».
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: Le nom est masculin singulier et possède ici une valeur représentative et proverbiale; la traduction conserve cette forme sans exclure la portée générale de l’énoncé.
- source_word: יִבְטַח בַּיהוָה
  choice: qui se confie en Yahweh
  rationale: Le verbe בטח avec la préposition ב exprime le fait de placer sa confiance en quelqu’un; « se confier en » est direct et naturel en français.
- source_word: וְהָיָה יְהוָה מִבְטַחוֹ
  choice: et dont Yahweh est l’assurance
  rationale: Cette formulation française exprime naturellement que Yahweh est celui sur qui repose la confiance de l’homme, tout en conservant le lien lexical entre le verbe בטח et le nom מִבְטָח.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter directement le tétragramme hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le nom propre divin; « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Valeur générique du masculin גֶּבֶר
  choice: l’homme
  alternative: la personne
  rationale: La forme masculine singulière du texte est conservée, tout en étant comprise ici dans son emploi proverbial représentatif.
- issue: Valeur temporelle et relationnelle de וְהָיָה
  choice: dont Yahweh est l’assurance
  alternative: et Yahweh sera son assurance
  rationale: Dans cette déclaration sapientielle, la proposition décrit naturellement l’état caractéristique de l’homme béni. La forme hébraïque peut toutefois être rendue avec une nuance future, signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. L’ordre marqué « Béni est l’homme » conserve la force déclarative de l’hébreu sans réduire בָּרוּךְ au sentiment subjectif exprimé par « heureux ».
