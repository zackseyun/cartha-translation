id: JER.17.8
reference: Jeremiah 17:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/עֵ֣ץ שָׁת֣וּל עַל מַ֗יִם וְ/עַל יוּבַל֙ יְשַׁלַּ֣ח שָֽׁרָשָׁ֔י/ו וְ/לֹ֤א ירא כִּֽי יָבֹ֣א חֹ֔ם וְ/הָיָ֥ה עָלֵ֖/הוּ רַֽעֲנָ֑ן וּ/בִ/שְׁנַ֤ת בַּצֹּ֨רֶת֙ לֹ֣א יִדְאָ֔ג וְ/לֹ֥א יָמִ֖ישׁ מֵ/עֲשׂ֥וֹת פֶּֽרִי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/008.yaml
  text: He will be like a tree planted by water[a], that sends out its roots by a stream; it does not fear when heat comes, and its leaf remains green. In a year of drought it is not anxious[b], and it does not cease from bearing fruit.
translation:
  language: fr
  text: Il sera comme un arbre planté près de l’eau, qui étend ses racines vers un cours d’eau[a]. Il ne craint pas quand vient la chaleur, et son feuillage reste verdoyant. Dans une année de sécheresse, il ne s’inquiète pas et ne cesse de porter du fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers un canal » ou « vers un chenal »; le mot hébreu peut désigner un cours d’eau naturel ou aménagé.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵץ
  choice: comme un arbre
  rationale: Rend naturellement en français la comparaison introduite par כְּ.
- source_word: שָׁתוּל
  choice: planté
  rationale: Le participe passif évoque un arbre délibérément établi à cet endroit; « planté » est exact et idiomatique.
- source_word: עַל מַיִם
  choice: près de l’eau
  rationale: Dans ce contexte spatial, עַל indique la proximité d’une source d’eau plutôt qu’une position littérale « sur » l’eau.
- source_word: יוּבַל
  choice: un cours d’eau
  rationale: Le nom désigne un chenal où l’eau s’écoule, naturel ou aménagé; « cours d’eau » préserve cette largeur de sens.
- source_word: יְשַׁלַּח שָׁרָשָׁיו
  choice: étend ses racines
  rationale: Le piel de שׁלח décrit ici des racines qui se déploient; cette formulation conserve l’image sans lourdeur.
- source_word: לֹא ירא
  choice: il ne craint rien
  rationale: Le texte consonantique et le contexte soutiennent la lecture traditionnelle יִרָא, « craindre »; la formulation maintient la personnification de l’arbre.
- source_word: כִּי יָבֹא חֹם
  choice: quand vient la chaleur
  rationale: כִּי a ici une valeur temporelle naturelle en contexte.
- source_word: עָלֵהוּ רַעֲנָן
  choice: son feuillage reste verdoyant
  rationale: רַעֲנָן associe verdeur, fraîcheur et vigueur. « Reste » explicite naturellement la continuité impliquée par le contexte, après l’arrivée de la chaleur.
- source_word: וּבִשְׁנַת בַּצֹּרֶת
  choice: Dans une année de sécheresse
  rationale: Formulation proverbiale naturelle qui reflète fidèlement le groupe construit hébreu.
- source_word: לֹא יִדְאָג
  choice: il ne s’inquiète pas
  rationale: דאג exprime l’inquiétude ou le souci anxieux; cette traduction est courante et conserve la personnification.
- source_word: לֹא יָמִישׁ מֵעֲשׂוֹת פֶּרִי
  choice: ne cesse de porter du fruit
  rationale: מוּשׁ suivi de מִן et de l’infinitif exprime ici le fait de ne pas abandonner ou cesser une activité.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La personnification de l’arbre est conservée par « ne craint rien » et « ne s’inquiète pas ». « Feuillage » est préféré au singulier littéral « feuille » pour une image naturelle en français, tandis que « verdoyant » conserve les nuances de fraîcheur et de vigueur de רַעֲנָן.
