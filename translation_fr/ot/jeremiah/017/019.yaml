  text: כֹּה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָלֹ֤ךְ וְ/עָֽמַדְתָּ֙ בְּ/שַׁ֣עַר בְּנֵֽי עם אֲשֶׁ֨ר יָבֹ֤אוּ ב/וֹ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֖ר יֵ֣צְאוּ ב֑/וֹ וּ/בְ/כֹ֖ל שַׁעֲרֵ֥י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/019.yaml
  text: 'Thus Yahweh said to me: Go and stand in the gate of the people[a], by which the kings of Judah enter and by which they go out, and in all the gates of Jerusalem.'
translation:
  language: fr
  text: 'Voici ce que Yahweh m’a dit : « Va te tenir à la porte du peuple[a], par laquelle les rois de Juda entrent et sortent, ainsi qu’à toutes les portes de Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la porte des fils du peuple » ; il peut s’agir du nom d’une porte particulière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה אֵלַי
  choice: Ainsi m’a parlé Yahweh
  rationale: Formule prophétique concise et digne, qui conserve le nom divin et présente naturellement le destinataire en français.
- source_word: הָלֹךְ וְעָמַדְתָּ
  choice: Va te tenir
  rationale: Rend la valeur impérative de l’infinitif absolu suivi du verbe conjugué, dans un français naturel.
- source_word: בְּשַׁעַר בְּנֵי עָם
  choice: à la porte du Peuple
  rationale: Le syntagme hébreu, littéralement « porte des fils du peuple », est obscur et pourrait être le nom d’une porte. La majuscule signale prudemment cette possibilité sans la trancher.
- source_word: אֲשֶׁר יָבֹאוּ בוֹ מַלְכֵי יְהוּדָה וַאֲשֶׁר יֵצְאוּ בוֹ
  choice: celle par laquelle les rois de Juda entrent et sortent
  rationale: Reproduit clairement la fonction de passage de la porte; la coordination française évite une répétition lourde sans perdre le sens.
- source_word: וּבְכֹל שַׁעֲרֵי יְרוּשָׁלִָם
  choice: puis à toutes les portes de Jérusalem
  rationale: « Puis » explicite naturellement que le prophète doit également se rendre aux autres portes; « à » convient au lieu où il doit se poster.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
- issue: Identification de בְּנֵי עָם
  choice: la porte du Peuple, avec note
  alternative: la porte des fils du peuple
  rationale: L’expression est incertaine et peut désigner une porte particulière. Le texte principal reste intelligible, tandis que la note préserve la forme littérale et l’ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. Le discours divin est placé entre guillemets français. La formulation évite le calque peu naturel « dans la porte » tout en gardant l’idée du lieu où Jérémie doit se poster.
