  text: וְ/אָמַרְתָּ֣ אֲ֠לֵי/הֶם שִׁמְע֨וּ דְבַר יְהוָ֜ה מַלְכֵ֤י יְהוּדָה֙ וְ/כָל יְהוּדָ֔ה וְ/כֹ֖ל יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/020.yaml
  text: And say to them[a], “Hear the word of Yahweh, you kings of Judah, and all Judah, and all the inhabitants of Jerusalem who enter through these gates.”
translation:
  language: fr
  text: 'Tu leur diras : « Écoutez la parole de Yahweh[a], rois de Juda, vous tous les Judéens, et vous tous, habitants de Jérusalem, qui entrez par ces portes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et sa traduction traditionnelle.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Tu leur diras
  rationale: Le parfait avec waw poursuit l’instruction prophétique donnée dans le contexte. Le futur français exprime naturellement l’ordre, et le pronom « leur » rend אֲלֵיהֶם sans lourdeur.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel. « Écoutez » est l’équivalent français naturel dans une proclamation prophétique et implique l’attention ainsi que l’obéissance.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la formule prophétique et le poids de la communication divine; le nom personnel est translittéré « Yahweh ».
- source_word: מַלְכֵי יְהוּדָה
  choice: rois de Juda
  rationale: Le groupe nominal est employé comme vocatif. En français, la simple juxtaposition après l’impératif marque clairement l’interpellation.
- source_word: וְכָל יְהוּדָה
  choice: vous tous, gens de Juda
  rationale: « Juda » désigne ici par métonymie la population du royaume. L’explicitation « gens de Juda » évite que le français moderne comprenne seulement le territoire, tandis que « vous tous » maintient l’adresse directe et la totalité exprimée par כָל.
- source_word: וְכֹל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: et vous tous, habitants de Jérusalem
  rationale: Le participe substantivé désigne les personnes qui résident à Jérusalem. « Habitants » est précis, courant et digne; « vous tous » maintient la coordination vocative.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: qui entrez par ces portes
  rationale: Le participe qualifie les habitants interpellés. Avec un verbe de mouvement, « entrer par » rend idiomatiquement le passage au moyen des portes.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom personnel. « Yahweh » le représente directement, tandis qu’une note signale la substitution traditionnelle française sans confondre le nom avec un titre.
- issue: Portée de וְכָל יְהוּדָה
  choice: vous tous, gens de Juda
  alternative: tout Juda
  rationale: Dans cette suite de destinataires humains, « Juda » désigne vraisemblablement collectivement la population. L’explicitation rend cette métonymie intelligible sans limiter le groupe à une catégorie particulière.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’adresse directe est conservée par « rois de Juda » et par la répétition de « vous tous », qui clarifie les groupes coordonnés. La ponctuation maintient la parole citée comme proclamation solennelle.
