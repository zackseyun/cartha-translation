revisions:
- from: Ils viendront des villes de Juda, des environs de Jérusalem, du territoire de Benjamin, du Bas-Pays[a], de la région montagneuse et du Néguev[b]. Ils apporteront des holocaustes, des sacrifices, des offrandes de céréales et de l’oliban[c] ; ils apporteront aussi des offrandes de reconnaissance[d] à la maison de Yahweh[e].
  to: Ils viendront des villes de Juda, des environs de Jérusalem, du territoire de Benjamin, de la Shéphéla[a], de la région montagneuse et du Néguev[b], en apportant des holocaustes, des sacrifices, des offrandes de céréales et de l’oliban[c], ainsi que des sacrifices de reconnaissance[d] à la maison de Yahweh[e].
  rationale: La révision adopte « Shéphéla », toponyme français usuel pour la région désignée par הַשְּׁפֵלָה, et conserve une explication géographique en note. Elle rend תּוֹדָה par « sacrifices de reconnaissance », formulation cultuelle adaptée à la liste des offrandes, sans exclure en note l’alternative traditionnelle « sacrifices d’action de grâce ». Les deux participes hébreux sont rendus naturellement par « en apportant » et « ainsi que », sans ajout de sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:35Z'
