id: JER.17.26
reference: Jeremiah 17:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בָ֣אוּ מֵ/עָרֵֽי יְ֠הוּדָה וּ/מִ/סְּבִיב֨וֹת יְרוּשָׁלִַ֜ם וּ/מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מִן הַ/שְּׁפֵלָ֤ה וּ/מִן הָ/הָר֙ וּ/מִן הַ/נֶּ֔גֶב מְבִאִ֛ים עוֹלָ֥ה וְ/זֶ֖בַח וּ/מִנְחָ֣ה וּ/לְבוֹנָ֑ה וּ/מְבִאֵ֥י תוֹדָ֖ה בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/026.yaml
  text: And they will come from the cities of Judah and from the areas around Jerusalem[a], and from the land of Benjamin, and from the lowland, and from the hill country, and from the Negeb, bringing burnt offerings and sacrifices, grain offerings and frankincense[c][b], and bringing thank offerings to the house of Yahweh.
translation:
  language: fr
  text: Ils viendront des villes de Juda, des environs de Jérusalem, du territoire de Benjamin, de la Shéphéla[a], de la région montagneuse et du Néguev[b], en apportant des holocaustes, des sacrifices, des offrandes de céréales et de l’oliban[c], ainsi que des sacrifices de reconnaissance[d] à la maison de Yahweh[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Shéphéla » est la région de basses collines située entre la plaine côtière et les montagnes de Juda.
    reason: cultural_note
  - marker: b
    text: Le Néguev est la région méridionale de Juda ; le mot hébreu peut aussi signifier « le sud ».
    reason: lexical_alternative
  - marker: c
    text: L’oliban est une résine aromatique utilisée comme encens.
    reason: cultural_note
  - marker: d
    text: Ou « des sacrifices d’action de grâce ». Le terme désigne ici une offrande cultuelle exprimant la reconnaissance.
    reason: lexical_alternative
  - marker: e
    text: La « maison de Yahweh » désigne ici le temple.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאוּ
  choice: Ils viendront
  rationale: Dans ce contexte prophétique, le parfait coordonné exprime naturellement en français la conséquence future annoncée. Le pronom reprend les personnes évoquées dans le contexte.
- source_word: מֵעָרֵי יְהוּדָה
  choice: des villes de Juda
  rationale: עָרִים désigne ici les villes ou localités de la région de Juda ; « villes de Juda » est clair et idiomatique.
- source_word: וּמִסְּבִיבוֹת יְרוּשָׁלַם
  choice: des environs de Jérusalem
  rationale: סְבִיבוֹת désigne les zones qui entourent un lieu ; « environs » rend ce sens géographique avec concision.
- source_word: וּמֵאֶרֶץ בִּנְיָמִן
  choice: du territoire de Benjamin
  rationale: אֶרֶץ renvoie ici à la région attribuée à Benjamin ; « territoire » évite de suggérer un pays indépendant.
- source_word: הַשְּׁפֵלָה
  choice: le Bas-Pays
  rationale: Le terme est un nom géographique désignant la zone de basses collines à l’ouest des montagnes de Juda. « Bas-Pays » traduit sa valeur descriptive tout en signalant une région déterminée.
- source_word: הָהָר
  choice: la région montagneuse
  rationale: Dans cette liste régionale, le singulier הָהָר désigne les hautes terres de Juda plutôt qu’une montagne isolée.
- source_word: הַנֶּגֶב
  choice: le Néguev
  rationale: Le mot fonctionne ici comme le nom de la région méridionale de Juda ; la translittération conserve cette valeur toponymique.
- source_word: מְבִאִים
  choice: Ils apporteront
  rationale: Le participe décrit ce que feront les personnes en venant. Une nouvelle proposition verbale donne une formulation française naturelle sans perdre le lien avec leur venue.
- source_word: עוֹלָה
  choice: des holocaustes
  rationale: Le terme désigne l’offrande entièrement consumée sur l’autel. Le pluriel français exprime la valeur collective du singulier hébreu dans cette procession de nombreux adorateurs.
- source_word: זֶבַח
  choice: des sacrifices
  rationale: Dans cette énumération cultuelle, le nom désigne les sacrifices d’animaux abattus ; le pluriel rend sa portée collective.
- source_word: מִנְחָה
  choice: des offrandes de céréales
  rationale: En contexte cultuel, מִנְחָה désigne couramment l’offrande végétale, principalement faite de farine ou de céréales.
- source_word: לְבוֹנָה
  choice: de l’oliban
  rationale: לְבוֹנָה désigne précisément la résine aromatique appelée oliban, et non l’encens au sens générique.
- source_word: וּמְבִאֵי תוֹדָה
  choice: ils apporteront aussi des offrandes de reconnaissance
  rationale: תּוֹדָה peut exprimer la reconnaissance ou l’action de grâce et, en contexte cultuel, désigner une offrande correspondante. La formulation conserve cette dimension sacrificielle sans réduire le terme à une simple parole de louange.
- source_word: בֵּית יְהוָה
  choice: à la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque qui désigne ici le temple, tandis que « Yahweh » rend le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans remplacer celui-ci par un titre.
- issue: Sens cultuel de תוֹדָה
  choice: offrandes de reconnaissance
  alternative: actions de grâce / louanges
  rationale: Le contexte énumère des dons et sacrifices apportés au temple, ce qui favorise un sens cultuel. Une note maintient toutefois visible la possibilité d’un sens plus général de reconnaissance ou d’action de grâce.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms géographiques sont rendus de manière reconnaissable, avec des notes lorsque leur sens régional risque d’être méconnu. La répétition « ils apporteront » reflète les deux constructions participiales du texte hébreu tout en clarifiant la longue énumération.
