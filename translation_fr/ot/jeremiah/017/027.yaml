  text: וְ/אִם לֹ֨א תִשְׁמְע֜וּ אֵלַ֗/י לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת וּ/לְ/בִלְתִּ֣י שְׂאֵ֣ת מַשָּׂ֗א וּ/בֹ֛א בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/הִצַּ֧תִּי אֵ֣שׁ בִּ/שְׁעָרֶ֗י/הָ וְ/אָֽכְלָ֛ה אַרְמְנ֥וֹת יְרוּשָׁלִַ֖ם וְ/לֹ֥א תִכְבֶּֽה־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/027.yaml
  text: But if you do not listen to me[a], to keep the Sabbath day holy, and not to carry a load and bring it in through the gates of Jerusalem on the Sabbath day, then I will kindle a fire in its gates, and it will consume the palaces of Jerusalem[b], and it will not be quenched.
translation:
  language: fr
  text: Mais si vous ne m’écoutez pas, si vous ne consacrez pas le jour du sabbat et si vous portez une charge en la faisant entrer par les portes de Jérusalem le jour du sabbat, alors j’allumerai un feu dans ses portes. Ce feu dévorera les palais de Jérusalem et ne s’éteindra pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: vous ne m’écoutez pas
  rationale: שׁמע avec אֶל signifie écouter en prêtant attention, avec une implication d’obéissance. « Écouter » conserve l’image auditive sans expliciter excessivement cette implication.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: si vous ne consacrez pas le jour du sabbat
  rationale: Le piel de קדשׁ exprime la mise à part comme saint. « Consacrer » est naturel et dignifié, et garde explicitement l’idée de sainteté attachée au jour.
- source_word: וּלְבִלְתִּי שְׂאֵת מַשָּׂא
  choice: si vous ne vous abstenez pas de porter une charge
  rationale: שׂאת מַשָּׂא désigne littéralement le fait de soulever ou porter une charge. La tournure « s’abstenir de » rend clairement la construction négative coordonnée.
- source_word: וּבֹא בְּשַׁעֲרֵי יְרוּשָׁלִַם
  choice: et de la faire entrer par les portes de Jérusalem
  rationale: Le contexte fournit comme objet implicite la charge précédemment mentionnée. « Faire entrer » exprime le mouvement de transport à travers les portes sans suggérer seulement l’entrée de la personne.
- source_word: וְהִצַּתִּי אֵשׁ
  choice: alors j’allumerai un feu
  rationale: Le hiphil de יצת signifie allumer ou mettre le feu. « Alors » marque naturellement l’apodose de la condition hébraïque.
- source_word: בִּשְׁעָרֶיהָ
  choice: à ses portes
  rationale: Le suffixe féminin renvoie à Jérusalem. En français courant, le possessif « ses » conserve ce renvoi sans imposer une personnification marquée.
- source_word: וְאָכְלָה אַרְמְנוֹת יְרוּשָׁלִַם
  choice: Il dévorera les palais de Jérusalem
  rationale: Le feu est sujet du verbe « manger, dévorer ». « Dévorer » conserve l’image vive de l’hébreu; אַרְמְנוֹת désigne ici des palais ou résidences fortifiées.
- source_word: וְלֹא תִכְבֶּה
  choice: et ne s’éteindra pas
  rationale: Le qal de כבה signifie s’éteindre ou être éteint. La forme pronominale française est idiomatique et préserve l’absence d’agent exprimé.
theological_decisions:
- issue: Terminologie du sabbat
  choice: le jour du sabbat
  alternative: le sabbat
  rationale: L’hébreu comporte explicitement יוֹם, « jour ». Le conserver reflète la formulation source sans ajout doctrinal.
- issue: Relation entre écouter et obéir
  choice: écoutez
  alternative: obéissez
  rationale: Le contexte implique l’obéissance, mais le verbe source conserve une image auditive. « Écouter » laisse subsister cette richesse sémantique sans résoudre l’implicite.
- issue: Structure conditionnelle du jugement
  choice: alors j’allumerai un feu
  alternative: et j’allumerai un feu
  rationale: Le waw ouvre ici la conséquence de la proposition conditionnelle. « Alors » rend cette relation explicite en français sans modifier la portée du jugement.
- issue: Portée de la formule sur le feu
  choice: ne s’éteindra pas
  alternative: personne ne pourra l’éteindre
  rationale: L’hébreu n’exprime aucun agent. La traduction retenue évite d’ajouter une affirmation explicite sur l’incapacité humaine, tout en gardant la force de la formule prophétique.
translation_notes:
  register: Français international moderne, solennel mais accessible. La phrase hébraïque est légèrement segmentée pour la lisibilité. La répétition « jour du sabbat » est maintenue, et l’image du feu qui « dévore » est conservée.
