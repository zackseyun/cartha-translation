review_pass:
  verdict: revise
  source_fidelity: 'La construction négative de la proposition conditionnelle est mal rendue par « si vous ne vous abstenez pas de porter une charge » : cette formulation transforme l’injonction source de ne pas porter en une condition autonome formulée de façon indirecte et lourde. Le sens global reste proche, mais une formulation directe est plus fidèle. « Dans ses portes » rend plus précisément le locatif hébreu que « à ses portes ».'
  naturalness: Le français du projet est généralement moderne et solennel. La succession de trois propositions introduites par « si » est toutefois pesante, et la double négation avec « ne vous abstenez pas » nuit à la clarté.
  terminology: '« Jour du sabbat », « consacrer », « charge », « palais » et « ne s’éteindra pas » sont adéquats. La note proposant « citadelles » et « résidences fortifiées » n’est pas nécessaire dans le texte français : « palais » est une traduction usuelle et sûre de אַרְמְנוֹת dans ce contexte.'
  issues:
  - severity: medium
    issue: Rendu indirect et syntaxiquement lourd de la défense de porter une charge
    rationale: « Si vous ne vous abstenez pas de porter » signifie bien, par implication, qu’ils portent une charge, mais ne reproduit pas naturellement la formulation hébraïque coordonnée « ne pas porter une charge ». Une proposition directe avec « si vous portez » rend la condition en français sans double négation.
  - severity: low
    issue: Locatif de « ses portes »
    rationale: La préposition בְּ signifie « dans ». « À ses portes » peut évoquer un feu placé devant les portes; « dans ses portes » conserve plus exactement l’image du feu qui prend aux portes de la ville.
  revised_text: Mais si vous ne m’écoutez pas, si vous ne consacrez pas le jour du sabbat et si vous portez une charge en la faisant entrer par les portes de Jérusalem le jour du sabbat, alors j’allumerai un feu dans ses portes. Ce feu dévorera les palais de Jérusalem et ne s’éteindra pas.
