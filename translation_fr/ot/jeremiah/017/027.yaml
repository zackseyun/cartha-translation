revisions:
- from: Mais si vous ne m’écoutez pas, si vous ne consacrez pas le jour du sabbat et si vous ne vous abstenez pas de porter une charge et de la faire entrer par les portes de Jérusalem le jour du sabbat, alors j’allumerai un feu à ses portes. Il dévorera les palais[a] de Jérusalem et ne s’éteindra pas.
  to: Mais si vous ne m’écoutez pas, si vous ne consacrez pas le jour du sabbat et si vous portez une charge en la faisant entrer par les portes de Jérusalem le jour du sabbat, alors j’allumerai un feu dans ses portes. Ce feu dévorera les palais de Jérusalem et ne s’éteindra pas.
  rationale: La révision rend explicitement et naturellement en français les deux manquements visés par la condition — ne pas consacrer le sabbat et porter une charge à travers les portes — tout en conservant la répétition de « jour du sabbat », la conséquence introduite par « alors » et l’image du feu qui dévore les palais. La note lexicale est supprimée, car aucune ambiguïté déterminante ne requiert ici de note.
