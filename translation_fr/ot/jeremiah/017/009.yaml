id: JER.17.9
reference: Jeremiah 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָקֹ֥ב הַ/לֵּ֛ב מִ/כֹּ֖ל וְ/אָנֻ֣שׁ ה֑וּא מִ֖י יֵדָעֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/009.yaml
  text: The heart is more deceitful than anything else[c][b][a], and desperately sick—who can know it?
translation:
  language: fr
  text: 'Le cœur[a] est plus trompeur que tout et il est gravement malade[b] : qui peut le connaître ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, le mot « cœur » désigne la personne intérieure, notamment ses pensées, sa volonté et ses désirs, et non seulement ses émotions.
    reason: cultural_note
  - marker: b
    text: Ou « incurable ». Le terme hébreu décrit un état extrêmement grave, qui peut être considéré comme sans remède.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָקֹב
  choice: trompeur
  rationale: L’adjectif exprime ici la tromperie ou la tortuosité morale. « Trompeur » est naturel en français et conserve cette portée sans introduire l’idée différente de simple complexité.
- source_word: הַלֵּב
  choice: le cœur
  rationale: Dans l’anthropologie hébraïque, le cœur désigne la personne intérieure, notamment la pensée, la volonté et les désirs. Le terme biblique traditionnel est conservé, avec une note qui en précise l’étendue.
- source_word: מִכֹּל
  choice: plus trompeur que tout
  rationale: La construction comparative מן avec כֹּל donne naturellement « plus… que tout » et garde la force superlative de l’hébreu.
- source_word: וְאָנֻשׁ
  choice: et il est gravement malade
  rationale: אָנֻשׁ décrit un état grave, désespéré ou incurable. Cette formulation conserve l’image de la maladie sans remplacer celle-ci par la qualification interprétative « mauvais » ou « pervers ».
- source_word: הוּא
  choice: il est
  rationale: Le pronom hébreu est explicitement rendu par « il », qui reprend naturellement « le cœur » en français.
- source_word: מִי
  choice: qui
  rationale: Le simple interrogatif « qui » reproduit avec concision la force rhétorique de l’hébreu.
- source_word: יֵדָעֶנּוּ
  choice: peut le connaître
  rationale: ידע signifie fondamentalement « connaître ». Ce choix reste proche de l’hébreu tout en exprimant l’impossibilité de sonder pleinement le cœur.
theological_decisions:
- issue: Portée anthropologique du « cœur »
  choice: Conserver « cœur » pour désigner la personne intérieure dans son ensemble.
  alternative: « esprit », « être intérieur »
  rationale: « Cœur » préserve l’anthropologie biblique sans limiter le mot aux émotions; une note explicite sa portée cognitive, volontaire et affective.
- issue: Sens de אָנֻשׁ
  choice: Rendre le terme par une maladie grave.
  alternative: « incurable », « désespérément mauvais »
  rationale: L’hébreu présente d’abord une image pathologique. « Gravement malade » maintient la tension entre maladie et corruption morale, tandis que « mauvais » abandonnerait la métaphore et qu’« incurable » en fixerait plus fortement l’issue.
translation_notes:
  register: Français international moderne, naturel et digne. La structure reste concise et proche du parallélisme hébreu; les deux propositions sont reliées explicitement pour une lecture française fluide.
