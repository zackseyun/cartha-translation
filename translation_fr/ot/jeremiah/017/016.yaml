source:
  edition: WLC
  text: וַ/אֲנִ֞י לֹא אַ֣צְתִּי מֵ/רֹעֶ֣ה אַחֲרֶ֗י/ךָ וְ/י֥וֹם אָנ֛וּשׁ לֹ֥א הִתְאַוֵּ֖יתִי אַתָּ֣ה יָדָ֑עְתָּ מוֹצָ֣א שְׂפָתַ֔/י נֹ֥כַח פָּנֶ֖י/ךָ הָיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/016.yaml
  text: But as for me[a], I did not hurry away from being a shepherd after you, and I did not desire the day of disaster; you know. What came from my lips was before your face.
translation:
  language: fr
  text: 'Quant à moi, je ne me suis pas hâté de cesser d’être berger à ta suite, et je n’ai pas désiré le jour du désastre[a]. Tu le sais : ce qui est sorti de mes lèvres était devant toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jour du malheur » ou « le jour funeste ». L’expression hébraïque évoque littéralement un jour gravement atteint ou incurable ; elle désigne probablement ici un jour de désastre ou de jugement.
    reason: Alternative lexicale et conservation de l’image hébraïque.
lexical_decisions:
- source_word: אַצְתִּי
  choice: je ne me suis pas hâté d’abandonner
  rationale: Le verbe אוץ exprime l’idée de se hâter ou de presser. Avec מִן, la formulation française indique que Jérémie ne s’est pas empressé de se détourner de sa mission, sans réduire le verbe à un simple refus.
- source_word: מֵרֹעֶה אַחֲרֶיךָ
  choice: ma tâche de berger à ta suite
  rationale: « Berger » conserve l’image hébraïque appliquée au service de Jérémie, tandis que « à ta suite » rend אַחֲרֶיךָ et maintient l’idée qu’il exerce cette tâche en suivant Dieu. « Ma tâche » permet une formulation française naturelle sans substituer le titre interprétatif de « prophète ».
- source_word: יוֹם אָנושׁ
  choice: le jour du désastre
  rationale: אָנושׁ désigne ce qui est gravement atteint, incurable ou funeste. Dans ce contexte, l’expression vise vraisemblablement un jour de calamité ou de jugement; « désastre » communique ce sens en français actuel, tandis que l’image littérale est signalée en note.
- source_word: הִתְאַוֵּיתִי
  choice: je n’ai pas désiré
  rationale: Le hitpael de אוה exprime le désir ou l’aspiration. « Désirer » est direct et laisse intacte la dénégation de Jérémie.
- source_word: מוֹצָא שְׂפָתַי
  choice: ce qui est sorti de mes lèvres
  rationale: Cette formulation conserve l’image concrète de מוֹצָא, « sortie », tout en étant compréhensible comme une référence aux paroles prononcées.
- source_word: נֹכַח פָּנֶיךָ
  choice: devant toi
  rationale: L’expression signifie littéralement « en face de ton visage ». « Devant toi » est naturel en français et garde le sens de paroles prononcées en présence de Dieu.
- source_word: אַתָּה יָדָעְתָּ
  choice: Tu le sais
  rationale: Le parfait hébreu sert ici d’appel à la connaissance actuelle de Dieu. Le pronom explicite donne à l’affirmation l’insistance du texte source.
theological_decisions:
- issue: Portée métaphorique de רֹעֶה dans la description que Jérémie donne de lui-même
  choice: Conserver l’image du « berger » au service de Dieu.
  alternative: Remplacer l’image par « prophète » ou rendre seulement « te suivre ».
  rationale: Le texte hébreu emploie explicitement le vocabulaire du berger. Le conserver évite d’imposer un titre ministériel plus précis que le texte et maintient l’image de la responsabilité confiée à Jérémie.
- issue: Sens du « jour » que Jérémie affirme ne pas avoir désiré
  choice: Rendre יוֹם אָנושׁ par « le jour du désastre » et indiquer en note sa coloration littérale.
  alternative: « le jour de la maladie », « le jour funeste » ou « le jour du malheur ».
  rationale: Le contexte évoque probablement la calamité annoncée, mais l’adjectif garde une image de mal incurable ou de grave atteinte. La traduction principale communique le sens contextuel sans effacer cette nuance, conservée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les deux dénégations de Jérémie, puis son appel direct à la connaissance de Dieu. L’image du berger et celle des paroles sorties des lèvres sont maintenues, tandis que « devant toi » évite le calque peu naturel « devant ta face ».
