revisions:
- from: alors des rois et des hauts fonctionnaires entreront par les portes de cette ville. Ils siégeront sur le trône de David et se déplaceront en char ou à cheval — eux, leurs hauts fonctionnaires, les hommes de Juda[a] et les habitants de Jérusalem. Cette ville restera habitée pour toujours.
  to: alors des rois et des hauts responsables entreront par les portes de cette ville, siégeant sur le trône de David, allant en chars et à cheval — eux, leurs hauts responsables, les hommes de Juda[a] et les habitants de Jérusalem — ; et cette ville sera habitée pour toujours.
  rationale: La révision conserve la syntaxe participiale et l’enchaînement de l’énumération hébraïque, restitue la coordination « en chars et à cheval » et remplace une désignation institutionnelle trop moderne par un terme français plus neutre. La note existante est exacte et son ancre reste correctement placée.
