review_pass:
  verdict: revise
  source_fidelity: La structure globale et les référents sont bien rendus. Toutefois, « ou à cheval » remplace la coordination hébraïque par une alternative et « se déplaceront » atténue le verbe רכבים, qui décrit le fait de monter/aller en char et à cheval. La nouvelle phrase « Ils siégeront » introduit en outre un antécédent collectif qui rend plus saillante une difficulté syntaxique sans la préserver aussi directement que la construction participiale du texte source.
  naturalness: Le français est généralement clair et de registre approprié. « Hauts fonctionnaires » est toutefois quelque peu administratif et moderne pour des שרים dans un contexte monarchique ancien. « Hauts responsables » est plus souple et international. Une phrase continue avec des participes et une reprise par tirets rend naturellement l’énumération hébraïque.
  terminology: « Trône de David », « Juda », « Jérusalem », « hommes de Juda » et « habitée pour toujours » sont adéquats. « Hauts responsables » rend שרים sans supposer une noblesse héréditaire ni une administration moderne.
  issues:
  - severity: medium
    issue: « se déplaceront en char ou à cheval »
    rationale: Le texte hébreu coordonne explicitement char(s) et chevaux (וּבַסּוּסִים). Le « ou » français interprète cette coordination comme une alternative distributive, tandis que « se déplaceront » est moins précis que le participe « montés/allant ». Il est préférable de conserver « en chars et à cheval ».
  - severity: medium
    issue: « Ils siégeront » après une première phrase
    rationale: Cette reprise fait de façon particulièrement explicite des rois et des hauts fonctionnaires le sujet collectif de l’action de siéger. Le participe pluriel hébreu suit bien les deux noms, mais la portée sémantique royale de « trône de David » crée une difficulté. Une construction participiale maintient plus fidèlement la syntaxe compacte et l’ambiguïté relative du source.
  - severity: low
    issue: « hauts fonctionnaires »
    rationale: Le terme évoque facilement une fonction publique moderne. « Hauts responsables » conserve l’idée d’autorités de rang élevé dans un cadre monarchique ancien.
  revised_text: alors des rois et des hauts responsables entreront par les portes de cette ville, siégeant sur le trône de David, allant en chars et à cheval — eux, leurs hauts responsables, les hommes de Juda[a] et les habitants de Jérusalem — ; et cette ville sera habitée pour toujours.
  revised_footnotes:
  - marker: a
    text: Ou « les gens de Juda ». L’hébreu dit littéralement « l’homme de Juda », expression employée ici dans un sens collectif.
    reason: Alternative lexicale et explication de l’emploi collectif du singulier hébreu.
  revision_rationale: La révision conserve la syntaxe participiale et l’enchaînement de l’énumération hébraïque, restitue la coordination « en chars et à cheval » et remplace une désignation institutionnelle trop moderne par un terme français plus neutre. La note existante est exacte et son ancre reste correctement placée.
