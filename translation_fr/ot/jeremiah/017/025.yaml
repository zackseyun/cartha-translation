source:
  edition: WLC
  text: וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הָ/עִ֣יר הַ/זֹּ֡את מְלָכִ֣ים וְ/שָׂרִ֡ים יֹשְׁבִים֩ עַל כִּסֵּ֨א דָוִ֜ד רֹכְבִ֣ים בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֗ים הֵ֚מָּה וְ/שָׂ֣רֵי/הֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/יָשְׁבָ֥ה הָֽ/עִיר הַ/זֹּ֖את לְ/עוֹלָֽם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/025.yaml
  text: then kings and officials will enter through the gates of this city[a], sitting on the throne of David, riding in chariots and on horses—they and their officials, the men of Judah and the inhabitants of Jerusalem—and this city will be inhabited forever.
translation:
  language: fr
  text: alors des rois et des hauts responsables entreront par les portes de cette ville, siégeant sur le trône de David, allant en chars et à cheval — eux, leurs hauts responsables, les hommes de Juda[a] et les habitants de Jérusalem — ; et cette ville sera habitée pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens de Juda ». L’hébreu dit littéralement « l’homme de Juda », expression employée ici dans un sens collectif.
    reason: Alternative lexicale et explication de l’emploi collectif du singulier hébreu.
lexical_decisions:
- source_word: וּבָאוּ
  choice: alors ... entreront
  rationale: Le verbe exprime la venue, mais la mention des portes appelle naturellement « entreront ». « Alors » marque en français la conséquence de la condition énoncée au verset précédent.
- source_word: בְשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: par les portes de cette ville
  rationale: Avec בוא, la préposition indique ici le passage par les portes pour entrer dans la ville.
- source_word: מְלָכִים וְשָׂרִים
  choice: des rois et des hauts fonctionnaires
  rationale: שָׂרִים désigne des responsables de haut rang. « Hauts fonctionnaires » est actuel et n'impose pas l'idée de princes héréditaires.
- source_word: יֹשְׁבִים עַל כִּסֵּא דָוִד
  choice: Ils siégeront sur le trône de David
  rationale: « Siéger sur le trône » conserve l'image royale et exprime naturellement en français la fonction dynastique du participe hébreu.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: se déplaceront en char ou à cheval
  rationale: Cette formulation française distingue naturellement les deux modes de déplacement. Le « ou » est distributif et évite de suggérer qu'une même personne utilise simultanément un char et un cheval.
- source_word: הֵמָּה וְשָׂרֵיהֶם
  choice: eux, leurs hauts fonctionnaires
  rationale: Le pronom emphatique reprend les rois, tandis que la répétition de שָׂרִים est rendue de façon cohérente.
- source_word: אִישׁ יְהוּדָה
  choice: les hommes de Juda
  rationale: Le singulier masculin « homme de Juda » a une valeur collective. Le texte principal conserve cette forme masculine, et une note signale la traduction collective possible.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלָ͏ִם
  choice: et les habitants de Jérusalem
  rationale: Expression collective courante, claire et fidèle pour désigner la population résidente de Jérusalem.
- source_word: וְיָשְׁבָה הָעִיר הַזֹּאת
  choice: Cette ville restera habitée
  rationale: Lorsque יָשַׁב a une ville pour sujet, il signifie qu'elle demeure peuplée ou habitée. « Restera » rend ici la continuité promise.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Équivalent français courant qui conserve la portée durable de l'expression hébraïque.
theological_decisions:
- issue: La référence dynastique au trône de David
  choice: Conserver explicitement « le trône de David ».
  alternative: Paraphraser par « le pouvoir royal de la dynastie de David ».
  rationale: L'image du trône porte la signification royale et alliance­lle du passage. La traduction la maintient sans lui ajouter une interprétation christologique explicite.
- issue: La portée de אִישׁ יְהוּדָה
  choice: Traduire dans le texte « les hommes de Juda ».
  alternative: « les gens de Juda » ou « la population de Juda ».
  rationale: Le nom hébreu est masculin singulier, employé collectivement. La formulation retenue préserve cette donnée tout en signalant l'autre rendu possible en note.
- issue: Les titulaires du trône de David
  choice: Employer une nouvelle phrase, « Ils siégeront », dont l'antécédent grammatical comprend les rois et les hauts fonctionnaires.
  alternative: Restreindre explicitement l'action de siéger aux seuls rois.
  rationale: Le participe hébreu est au pluriel et suit les deux groupes sans marquer formellement une restriction. La traduction ne tranche donc pas silencieusement l'attachement syntaxique, même si le trône concerne au premier chef la royauté.
translation_notes:
  register: Français international moderne, clair et digne. « Siéger sur le trône » maintient l'image royale dans une tournure naturelle. Le tiret structure l'énumération étendue sans effacer les reprises du texte hébreu.
