  edition: WLC
  text: וְ/לֹ֣א שָֽׁמְע֔וּ וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֣י שומע וּ/לְ/בִלְתִּ֖י קַ֥חַת מוּסָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/023.yaml
  text: But they did not listen[a], and they did not incline their ear[c][b], but stiffened their neck so as not to hear and not to accept discipline.
translation:
  language: fr
  text: Mais ils n’ont pas écouté[a] ni tendu l’oreille, mais ils ont raidi la nuque[b] pour ne pas entendre et ne pas accepter la correction[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entendu » ou « obéi ». Le verbe hébreu peut prendre ces sens selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ils ont raidi la nuque », image hébraïque d’une résistance obstinée.
    reason: cultural_note
  - marker: c
    text: Ou « l’instruction » ou « la discipline ». Le terme hébreu associe formation et correction.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: n’ont pas écouté
  rationale: Le verbe שׁמע peut exprimer le fait d’entendre, d’écouter ou d’obéir. Ici, son parallélisme avec « tendre l’oreille » et le refus de la correction favorisent « écouter », qui implique l’attention sans expliciter davantage l’obéissance.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: ni tendu l’oreille
  rationale: Cette expression rend naturellement en français l’image hébraïque de l’oreille que l’on incline pour prêter attention.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: Ils ont raidi leur nuque
  rationale: La formulation conserve la métaphore corporelle hébraïque de l’entêtement et de la résistance, sans la remplacer dans le texte par une simple explication.
- source_word: לְבִלְתִּי שׁומע
  choice: pour ne pas entendre
  rationale: לבלתי marque ici le but ou l’effet recherché. « Pour ne pas entendre » conserve cette relation avec le raidissement de la nuque et maintient la gamme sémantique de שׁמע.
- source_word: וּלְבִלְתִּי קַחַת מוּסָר
  choice: et ne pas accepter la correction
  rationale: « Accepter » exprime le refus actif de recevoir ce qui est proposé, tandis que « correction » conserve ici la dimension corrective de מוּסָר.
- source_word: מוּסָר
  choice: correction
  rationale: מוּסָר peut désigner l’instruction, la discipline ou la correction. Dans ce reproche prophétique, « correction » rend clairement sa portée corrective et formatrice sans évoquer seulement une sanction.
theological_decisions:
- issue: Rendu de l’image de l’obstination
  choice: Conserver « ont raidi leur nuque »
  alternative: « se sont montrés obstinés » ou « se sont entêtés »
  rationale: L’image hébraïque est intelligible avec une note brève et maintient les résonances du langage prophétique sur la résistance du peuple.
- issue: Valeur de שׁמע dans le reproche prophétique
  choice: Employer « écouter » dans la première proposition et « entendre » dans la proposition finale
  alternative: Répéter « entendre » ou traduire par « obéir » dans les deux cas
  rationale: Ce choix respecte l’étendue sémantique du verbe et l’ambiguïté entre perception, attention et réponse, sans imposer partout le sens plus fort d’obéir.
- issue: Portée de לבלתי après le raidissement de la nuque
  choice: Traduire par « pour ne pas »
  alternative: « de sorte qu’ils n’entendent pas »
  rationale: La construction peut toucher au but ou au résultat. « Pour ne pas » suit au plus près la forme hébraïque tout en laissant percevoir le caractère volontaire de la résistance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour éviter l’accumulation de coordinations, tout en conservant l’enchaînement logique. « Tendre l’oreille » est idiomatique en français; la métaphore plus sémitique de la nuque raidie est maintenue et expliquée en note.
