id: JER.17.22
reference: Jeremiah 17:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא תוֹצִ֨יאוּ מַשָּׂ֤א מִ/בָּֽתֵּי/כֶם֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וְ/כָל מְלָאכָ֖ה לֹ֣א תַֽעֲשׂ֑וּ וְ/קִדַּשְׁתֶּם֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת כַּ/אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/022.yaml
  text: Do not carry a load out of your houses on the Sabbath day[a], and do not do any work, but sanctify the Sabbath day[b], just as I commanded your fathers.
translation:
  language: fr
  text: Ne transportez aucune charge hors de vos maisons le jour du sabbat[a] et ne faites aucun travail, mais sanctifiez le jour du sabbat, comme je l’ai ordonné à vos pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Ne faites sortir aucune charge de vos maisons le jour du sabbat. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression « vos pères » désigne les générations antérieures d’Israël auxquelles Dieu avait donné ce commandement.
    reason: cultural_note
lexical_decisions:
- source_word: תוֹצִיאוּ מַשָּׂא מִבָּתֵּיכֶם
  choice: transportez aucune charge hors de vos maisons
  rationale: Le hifil de יצא exprime le fait de faire sortir, et מַשָּׂא désigne ici quelque chose que l’on porte. « Transporter une charge hors de » rend naturellement l’action concrète dans le contexte de l’interdiction sabbatique.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: Cette formulation conserve explicitement יוֹם (« jour ») tout en restant naturelle en français moderne.
- source_word: מְלָאכָה
  choice: travail
  rationale: Dans les prescriptions relatives au sabbat, le terme désigne le travail ou l’activité interdite ce jour-là.
- source_word: וְקִדַּשְׁתֶּם
  choice: sanctifiez
  rationale: Le piel de קדש signifie mettre à part comme saint ou traiter comme saint. « Sanctifiez » en garde directement la portée cultuelle et théologique.
- source_word: כַּאֲשֶׁר צִוִּיתִי
  choice: comme je l’ai ordonné
  rationale: Rend clairement le rapport avec le commandement divin antérieur.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Le nom hébreu est un terme de parenté masculin désignant ici les générations antérieures d’Israël.
theological_decisions:
- issue: Expression de la sanctification du sabbat
  choice: sanctifiez le jour du sabbat
  alternative: considérez le jour du sabbat comme saint
  rationale: « Sanctifiez » reflète directement le verbe hébreu et préserve l’idée de mise à part comme sainte sans préciser davantage la manière de l’observer.
- issue: Désignation des générations antérieures
  choice: vos pères
  alternative: vos ancêtres
  rationale: La traduction conserve le terme masculin du texte source; une note précise qu’il vise les générations antérieures d’Israël.
translation_notes:
  register: Français international moderne, clair et digne. « Sanctifiez » relève d’un registre soutenu mais demeure courant dans le contexte biblique; il préserve avec précision la force du verbe hébreu.
