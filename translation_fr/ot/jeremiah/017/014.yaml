source:
  edition: WLC
  text: רְפָאֵ֤/נִי יְהוָה֙ וְ/אֵ֣רָפֵ֔א הוֹשִׁיעֵ֖/נִי וְ/אִוָּשֵׁ֑עָה כִּ֥י תְהִלָּתִ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/014.yaml
  text: Heal me[a], O Yahweh, and I will be healed; save me, and I will be saved[b], for you are my praise.
translation:
  language: fr
  text: Guéris-moi, Yahweh, et je serai guéri ; sauve-moi, et je serai sauvé, car tu es ma louange[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « car c’est toi que je loue ». L’hébreu dit littéralement : « car tu es ma louange ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאֵנִי
  choice: Guéris-moi
  rationale: L’impératif de רפא avec suffixe de première personne appelle une traduction directe qui conserve les résonances physiques, morales et spirituelles du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְאֵרָפֵא
  choice: et je serai guéri
  rationale: Le niphal exprime le résultat attendu de l’action divine et maintient la reprise du même radical qu’en français.
- source_word: הוֹשִׁיעֵנִי
  choice: sauve-moi
  rationale: Le hiphil de ישׁע peut évoquer le salut ou la délivrance. « Sauve-moi » en conserve l’étendue sans préciser indûment la nature du péril.
- source_word: וְאִוָּשֵׁעָה
  choice: et je serai sauvé
  rationale: Cette forme passive reprend exactement la demande précédente et préserve le parallélisme poétique.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit naturellement en français le motif de la demande.
- source_word: תְהִלָּתִי
  choice: ma louange
  rationale: La formulation nominale compacte traduit littéralement l’hébreu et en préserve l’ambiguïté poétique, plutôt que de la résoudre par « celui que je loue ».
- source_word: אָתָּה
  choice: tu es
  rationale: Le pronom indépendant est emphatique ; placé après « car », le français « tu es » rend naturellement la prédication.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. « Yahweh » le représente directement, sans remplacer le nom par un titre.
- issue: Portée de ישׁע
  choice: sauve-moi / je serai sauvé
  alternative: délivre-moi / je serai délivré
  rationale: Le verbe peut viser une délivrance concrète aussi bien qu’un salut plus large. « Sauver » conserve cette amplitude sémantique.
- issue: Sens de תְהִלָּתִי
  choice: tu es ma louange
  alternative: tu es celui que je loue
  rationale: La traduction nominale respecte la concision et la tension poétique de l’hébreu, tandis que l’alternative explicite une relation que le texte laisse sous forme métaphorique.
translation_notes:
  register: Français moderne, international et digne, avec parallélisme étroit entre les deux demandes. Le vocatif sans « ô » évite un archaïsme inutile. Le point-virgule reproduit le balancement poétique.
