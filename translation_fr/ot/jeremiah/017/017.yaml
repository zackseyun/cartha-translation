id: JER.17.17
reference: Jeremiah 17:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּֽהְיֵה לִ֖/י לִ/מְחִתָּ֑ה מַֽחֲסִ/י אַ֖תָּה בְּ/י֥וֹם רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/017.yaml
  text: Do not be a terror to me[b][a]; you are my refuge in the day of disaster.
translation:
  language: fr
  text: Ne sois pas pour moi une cause d’effroi[a] ; tu es mon refuge au jour du malheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sujet de terreur », « une cause de consternation » ou « une ruine ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « malheur » désigne une calamité ou une détresse, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיֵה
  choice: Ne sois pas
  rationale: La particule négative suivie de l’inaccompli exprime ici une supplication négative. « Ne sois pas » en garde la force directe et priante.
- source_word: לִי
  choice: pour moi
  rationale: La préposition ל avec le suffixe de première personne indique ici la relation ou l’effet subi ; « pour moi » est naturel en français avec « une cause d’effroi ».
- source_word: לִמְחִתָּה
  choice: une cause d’effroi
  rationale: מְחִתָּה peut évoquer l’effroi, la consternation ou la ruine. « Une cause d’effroi » exprime naturellement que le locuteur supplie Dieu de ne pas devenir pour lui une source de terreur, sans effacer la portée plus destructrice possible du terme.
- source_word: מַחֲסִי
  choice: mon refuge
  rationale: מַחֲסֶה désigne un refuge ou un abri. « Mon refuge » convient au registre de la prière et demeure clair en français moderne.
- source_word: אַתָּה
  choice: tu es
  rationale: Le pronom indépendant est emphatique ; le français exige ici la copule. Le tutoiement convient à l’adresse directe à Dieu dans la prière biblique.
- source_word: בְּיוֹם רָעָה
  choice: au jour du malheur
  rationale: L’expression désigne le temps de l’adversité. « Au jour du malheur » est idiomatique, digne et indique une calamité plutôt qu’un mal moral.
theological_decisions:
- issue: 'Sens de רָעָה : mal moral ou calamité'
  choice: malheur
  alternative: mal, calamité, détresse
  rationale: Dans ce contexte de refuge et de jugement, רָעָה désigne l’adversité ou la calamité, non une faute morale. « Malheur » préserve cette valeur sans résoudre plus précisément la nature de l’épreuve.
- issue: Portée de מְחִתָּה
  choice: une cause d’effroi
  alternative: un sujet de terreur, une cause de consternation, une ruine
  rationale: Le mot couvre un champ allant de l’effroi à l’effondrement ou à la ruine. La traduction principale rend la relation personnelle exprimée par לִי, tandis que la note conserve l’ambiguïté lexicale authentique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la brièveté et le parallélisme de la prière hébraïque, avec un tutoiement direct de Dieu.
