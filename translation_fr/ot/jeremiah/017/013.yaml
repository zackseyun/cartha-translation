id: JER.17.13
reference: Jeremiah 17:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִקְוֵ֤ה יִשְׂרָאֵל֙ יְהוָ֔ה כָּל עֹזְבֶ֖י/ךָ יֵבֹ֑שׁוּ יסור/י בָּ/אָ֣רֶץ יִכָּתֵ֔בוּ כִּ֥י עָזְב֛וּ מְק֥וֹר מַֽיִם חַיִּ֖ים אֶת יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/013.yaml
  text: O Yahweh[a], the hope of Israel, all who forsake you will be put to shame; those who turn away from you will be written in the earth, because they have forsaken Yahweh[c][b], the fountain of living waters.
translation:
  language: fr
  text: Yahvé, espérance d’Israël, tous ceux qui t’abandonnent seront couverts de honte. Ceux qui se détournent de moi[a] seront inscrits sur la terre[b], car ils ont abandonné Yahvé, la source d’eau vive[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui se détournent de toi ». L’hébreu est textuellement difficile; le texte principal conserve la lecture massorétique à la première personne.
    reason: textual_variant
  - marker: b
    text: Ou « dans le pays ». L’expression peut évoquer une inscription passagère dans le sol, par opposition à un souvenir durable.
    reason: lexical_alternative
  - marker: c
    text: L’« eau vive » est une eau fraîche et courante provenant d’une source, et non une eau stagnante.
    reason: cultural_note
lexical_decisions:
- source_word: מִקְוֵה
  choice: espérance
  rationale: Dans cette adresse à Yahvé, le nom a son sens figuré d’« espérance » ou d’« objet d’espérance », plutôt que son sens concret lié à un rassemblement d’eaux.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: עֹזְבֶיךָ
  choice: ceux qui t’abandonnent
  rationale: Le participe désigne ceux qui se caractérisent par l’abandon; « abandonner » exprime naturellement en français la force relationnelle de עזב.
- source_word: יֵבֹשׁוּ
  choice: seront couverts de honte
  rationale: Cette formulation exprime le résultat public et judiciaire du verbe, au-delà d’un simple sentiment intérieur de honte.
- source_word: יסורי
  choice: ceux qui se détournent de moi
  rationale: La forme textuellement difficile est rendue selon la lecture massorétique à la première personne, sans l’harmoniser avec la deuxième personne précédente.
- source_word: בארץ
  choice: sur la terre
  rationale: « Sur la terre » conserve l’image d’une inscription précaire dans le sol, tout en laissant possible le sens plus large de « dans le pays ».
- source_word: יִכָּתֵבוּ
  choice: seront inscrits
  rationale: Le passif est conservé; « inscrits » rend clairement l’image d’un nom ou d’un souvenir fixé par écrit.
- source_word: מְקוֹר מַיִם חַיִּים
  choice: la source d’eau vive
  rationale: « Source » correspond au jaillissement naturel de מְקוֹר; l’expression française « eau vive » désigne naturellement une eau fraîche et courante tout en conservant la portée métaphorique.
theological_decisions:
- issue: Changement de personne dans « ceux qui se détournent de moi »
  choice: Maintenir « de moi » dans le texte principal
  alternative: « ceux qui se détournent de toi »
  rationale: La tradition massorétique présente une difficulté textuelle et un passage de la deuxième à la première personne. Le conserver respecte la tension du texte au lieu de l’harmoniser silencieusement.
- issue: Image de la source d’eau vive
  choice: Conserver la métaphore littérale
  alternative: Expliciter par « la source d’eau qui donne la vie »
  rationale: L’expression décrit d’abord une eau fraîche et courante, mais possède aussi une résonance théologique et intertextuelle qu’une paraphrase réduirait.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’adresse solennelle et le parallélisme poétique. « Yahvé » est employé comme forme française du nom divin; « eau vive » est idiomatique en français et conserve l’image hébraïque.
