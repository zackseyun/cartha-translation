id: JER.17.21
reference: Jeremiah 17:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִשָּׁמְר֖וּ בְּ/נַפְשֽׁוֹתֵי/כֶ֑ם וְ/אַל תִּשְׂא֤וּ מַשָּׂא֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וַ/הֲבֵאתֶ֖ם בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/021.yaml
  text: 'Thus says Yahweh: Take care for yourselves[b][a], and do not carry a load on the Sabbath day or bring it in through the gates of Jerusalem.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Veillez bien sur vous-mêmes[a] : ne portez aucune charge[b] le jour du sabbat et n’en faites entrer aucune par les portes de Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « veillez sur vos vies » ou « sur vos personnes ». L’expression hébraïque appelle chacun à exercer sur lui-même une vigilance attentive.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « fardeau ». Il s’agit probablement ici de quelque chose que l’on transporte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle en français et dotée d’une cadence solennelle sans être archaïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הִשָּׁמְרוּ בְּנַפְשׁוֹתֵיכֶם
  choice: Veillez bien sur vous-mêmes
  rationale: Rend l’impératif réfléchi et l’idée de vigilance attentive. « Bien » renforce naturellement en français l’expression idiomatique hébraïque comportant נֶפֶשׁ, sans introduire une distinction moderne entre l’âme et le corps.
- source_word: וְאַל תִּשְׂאוּ
  choice: ne portez aucune
  rationale: Dans ce contexte, נשׂא désigne concrètement le fait de transporter quelque chose. La tournure négative avec « aucune » est idiomatique en français.
- source_word: מַשָּׂא
  choice: charge
  rationale: Désigne ici vraisemblablement un objet ou un ensemble de biens transportés; « charge » conserve aussi la nuance possible de « fardeau » sans paraître d’abord métaphorique.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: Rendu explicite et naturel de la désignation temporelle hébraïque.
- source_word: וַהֲבֵאתֶם
  choice: et n’en faites entrer aucune
  rationale: Le second acte reste sous la portée de l’interdiction. Le pronom « en » reprend « charge », et « faire entrer » exprime clairement le mouvement vers l’intérieur de la ville.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: par les portes de Jérusalem
  rationale: Exprime naturellement en français le passage par les portes pour entrer dans la ville.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. La transcription « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Sens de נַפְשׁוֹתֵיכֶם dans l’exhortation
  choice: sur vous-mêmes
  alternative: sur vos vies / sur vos personnes
  rationale: Dans cette construction, le terme participe à une expression de vigilance personnelle. Le traduire directement par « âmes » risquerait d’imposer une lecture anthropologique étrangère au contexte; une note conserve néanmoins la forme littérale et son éventail de sens.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le rythme de l’oracle prophétique, évite « âme » dans le corps du texte afin de ne pas surinterpréter נֶפֶשׁ, et conserve la portée concrète de l’interdiction sabbatique.
