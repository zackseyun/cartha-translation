source:
  edition: WLC
  text: יֵבֹ֤שׁוּ רֹדְפַ/י֙ וְ/אַל אֵבֹ֣שָׁה אָ֔נִי יֵחַ֣תּוּ הֵ֔מָּה וְ/אַל אֵחַ֖תָּה אָ֑נִי הָבִ֤יא עֲלֵי/הֶם֙ י֣וֹם רָעָ֔ה וּ/מִשְׁנֶ֥ה שִׁבָּר֖וֹן שָׁבְרֵֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/018.yaml
  text: Let my pursuers be put to shame[a], but let me not be put to shame; let them be dismayed, but let me not be dismayed. Bring upon them a day of disaster[c][b], and shatter them with double destruction.
translation:
  language: fr
  text: Que ceux qui me poursuivent soient couverts de honte[a], mais que moi, je ne sois pas couvert de honte ! Qu’ils soient consternés, mais que moi, je ne sois pas consterné ! Fais venir sur eux un jour de malheur[b] et brise-les par une double destruction[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes persécuteurs ». L’hébreu signifie littéralement « ceux qui me poursuivent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un jour de désastre » ou « un jour de calamité ». Il s’agit ici d’un malheur, non du mal moral.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « brise-les d’une double brisure ». Cette expression peut aussi se comprendre comme une destruction redoublée.
    reason: literal_rendering
lexical_decisions:
- source_word: יֵבֹשׁוּ / אֵבֹשָׁה
  choice: soient / sois couvert(s) de honte
  rationale: Le verbe בושׁ peut exprimer la honte, la disgrâce ou la déconvenue. « Être couvert de honte » rend ici la honte subie et la confusion publique tout en conservant le parallélisme.
- source_word: רֹדְפַי
  choice: ceux qui me poursuivent
  rationale: Cette formulation garde le sens concret de רדף, « poursuivre », sans imposer la nuance plus spécialisée de « persécuteurs ».
- source_word: יֵחַתּוּ / אֵחַתָּה
  choice: soient / sois terrifié(s)
  rationale: Au niphal, חתת peut évoquer l’effondrement intérieur, la consternation ou la terreur. « Terrifié » préserve la force du terme et convient à son parallélisme avec la honte.
- source_word: הָבִיא עֲלֵיהֶם
  choice: Fais venir sur eux
  rationale: Le hifil impératif de בוא avec עַל signifie faire venir quelque chose sur quelqu’un. Cette traduction conserve la demande directement adressée à Dieu.
- source_word: יוֹם רָעָה
  choice: un jour de malheur
  rationale: Dans ce contexte, רָעָה désigne une calamité ou un désastre, et non le mal moral. « Jour de malheur » est naturel et garde la portée de jugement sans la préciser excessivement.
- source_word: מִשְׁנֶה
  choice: double
  rationale: מִשְׁנֶה indique ici le double ou une mesure redoublée et intensifie le substantif suivant.
- source_word: שִׁבָּרוֹן / שָׁבְרֵם
  choice: brise-les d’une double brisure
  rationale: La traduction maintient le jeu étymologique entre le nom שִׁבָּרוֹן et le verbe שׁבר. Bien que marquée en français, elle restitue l’image insistante et violente de l’hébreu.
theological_decisions:
- issue: Demande imprécatoire de jugement
  choice: Conserver la prière directe et sévère de Jérémie contre ceux qui le poursuivent.
  alternative: Atténuer l’imprécation en simple demande de justification ou de protection.
  rationale: L’hébreu emploie des formes volitives et des impératifs adressés à Dieu. La traduction doit préserver la tension théologique entre la justification du prophète et sa demande d’un jugement destructeur, sans en adoucir la force.
translation_notes:
  register: Français moderne, digne et directement compréhensible. La reprise « mais que moi » souligne le contraste emphatique marqué par les pronoms hébreux. Le parallélisme et la force de l’imprécation sont conservés. La formulation littérale finale est volontairement saisissante; la note en explicite le sens.
