  terminology: « Ceux qui me poursuivent », « couverts de honte », « jour de malheur » et « double destruction » conviennent à un français international moderne et ne surinterprètent pas le texte. L’imprécation demeure une demande directe de jugement, sans atténuation doctrinale.
