  register: Français international moderne, clair et digne, avec une cadence poétique sobre. « Steppe aride » évite la répétition immédiate de « désert » tout en rendant le paysage de l’עֲרָבָה. Les ambiguïtés botanique, géographique et sémantique sont conservées en notes.
