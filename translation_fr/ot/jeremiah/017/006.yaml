  text: וְ/הָיָה֙ כְּ/עַרְעָ֣ר בָּֽ/עֲרָבָ֔ה וְ/לֹ֥א יִרְאֶ֖ה כִּי יָב֣וֹא ט֑וֹב וְ/שָׁכַ֤ן חֲרֵרִים֙ בַּ/מִּדְבָּ֔ר אֶ֥רֶץ מְלֵחָ֖ה וְ/לֹ֥א תֵשֵֽׁב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/006.yaml
  text: He will be like a shrub in the desert[a], and he will not see when good comes. He will dwell in parched places in the wilderness[c][b], in a salt land that is not inhabited.
translation:
  language: fr
  text: 'Il sera comme un arbuste dans la steppe aride[a] : il ne verra pas venir le bien[b]. Il habitera dans des lieux desséchés du désert, dans une terre salée inhabitée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Araba », si le terme désigne ici la région géographique précise plutôt qu’une étendue aride en général.
    reason: alternative_reading
  - marker: b
    text: Ou « comme un genévrier », « comme un tamaris » ou « comme un buisson stérile »; l’identification exacte de la plante hébraïque est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַרְעָר
  choice: comme un arbuste
  rationale: Le terme désigne une plante ou un arbuste des régions arides, mais l’espèce exacte reste incertaine. « Arbuste » préserve l’image sans imposer une identification botanique discutée.
- source_word: בָּעֲרָבָה
  choice: dans la steppe aride
  rationale: עֲרָבָה peut désigner soit l’Araba comme région précise, soit une plaine désertique et aride. Le sens environnemental général convient bien à la comparaison poétique, tandis que la note conserve la lecture géographique.
- source_word: וְלֹא יִרְאֶה כִּי יָבוֹא טוֹב
  choice: il ne verra pas venir le bonheur
  rationale: Cette formulation conserve l’image littérale de « voir » et la valeur large de טוֹב, sans la réduire à la seule prospérité matérielle. Elle peut suggérer qu’il ne percevra pas le bien ou n’en bénéficiera pas.
- source_word: וְשָׁכַן
  choice: Il habitera
  rationale: « Habiter » rend naturellement שׁכן et convient au registre poétique et prophétique.
- source_word: חֲרֵרִים
  choice: les lieux desséchés
  rationale: Le mot évoque des endroits brûlés, arides ou stériles. « Desséchés » communique clairement cette désolation sans préciser indûment la nature du terrain.
- source_word: בַּמִּדְבָּר
  choice: du désert
  rationale: מִדְבָּר désigne ici un territoire sauvage et aride. « Désert » est naturel en français dans cette description.
- source_word: אֶרֶץ מְלֵחָה
  choice: une terre salée
  rationale: La formule décrit un sol marqué par le sel et donc impropre à la vie; la traduction reste concise et imagée.
- source_word: וְלֹא תֵשֵׁב
  choice: où personne ne vit
  rationale: Le verbe féminin se rapporte à la terre. Cette relative idiomatique exprime clairement qu’elle est inhabitée.
theological_decisions: []
