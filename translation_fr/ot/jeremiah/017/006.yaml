  - severity: low
    issue: « Le bonheur » est plus étroit que le terme hébreu טוֹב.
    rationale: טוֹב peut désigner le bien, le bonheur ou la prospérité selon le contexte. « Le bien » conserve l’ambiguïté du texte; la prospérité peut être proposée en note.
