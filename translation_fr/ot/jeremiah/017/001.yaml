source:
  edition: WLC
  text: חַטַּ֣את יְהוּדָ֗ה כְּתוּבָ֛ה בְּ/עֵ֥ט בַּרְזֶ֖ל בְּ/צִפֹּ֣רֶן שָׁמִ֑יר חֲרוּשָׁה֙ עַל ל֣וּחַ לִבָּ֔/ם וּ/לְ/קַרְנ֖וֹת מִזְבְּחוֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/001.yaml
  text: The sin of Judah is written with an iron stylus[a]; with a diamond point it is engraved on the tablet of their heart and on the horns of your altars.
translation:
  language: fr
  text: Le péché de Juda est écrit avec un stylet de fer ; avec une pointe de diamant[a], il est gravé sur la tablette de leur cœur et sur les cornes de vos autels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pointe d’une matière extrêmement dure » ; l’identification exacte du שָׁמִיר est incertaine. Le mot désigne ici une substance très dure utilisée pour graver.
    reason: Alternative lexicale et incertitude quant à la matière désignée.
lexical_decisions:
- source_word: חַטַּאת
  choice: péché
  rationale: Dans ce réquisitoire prophétique, le nom désigne la faute morale de Juda plutôt qu’un sacrifice pour le péché.
- source_word: כְּתוּבָה
  choice: est écrit
  rationale: Le participe passif décrit un état résultant et durable ; cette formulation française le rend naturellement.
- source_word: עֵט בַּרְזֶל
  choice: stylet de fer
  rationale: Le contexte évoque un instrument rigide servant à inscrire ou graver, non un stylo moderne ; « fer » préserve l’image concrète.
- source_word: צִפֹּרֶן שָׁמִיר
  choice: pointe de diamant
  rationale: צִפֹּרֶן désigne ici la pointe fonctionnelle de l’outil, et שָׁמִיר une matière extrêmement dure, d’identification précise incertaine.
- source_word: חֲרוּשָׁה
  choice: il est gravé
  rationale: Le participe passif intensifie l’image de l’écriture en évoquant une inscription profondément incisée.
- source_word: לוּחַ לִבָּם
  choice: la tablette de leur cœur
  rationale: « Tablette » conserve la métaphore de l’inscription, tandis que le singulier collectif « leur cœur » suit de près l’hébreu.
- source_word: קַרְנוֹת מִזְבְּחוֹתֵיכֶם
  choice: les cornes de vos autels
  rationale: Les « cornes » sont les saillies cultuelles des autels ; le possessif à la deuxième personne conserve l’adresse directe de l’hébreu.
theological_decisions:
- issue: Passage de la troisième à la deuxième personne
  choice: Conserver « leur cœur » puis « vos autels »
  alternative: Uniformiser en « leurs autels »
  rationale: Le texte massorétique passe de la description de Juda à l’interpellation directe. Maintenir cette rupture préserve la vigueur prophétique et une tension réelle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme de l’hébreu ainsi que le changement volontaire de personne grammaticale.
