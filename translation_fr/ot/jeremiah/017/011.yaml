review_pass:
  verdict: revise
  source_fidelity: La structure proverbiale et les termes principaux sont bien rendus. Toutefois, « ce qu’elle n’a pas pondu » explicite un objet (« ce que ») absent de l’hébreu, qui dit plus littéralement que la perdrix couve sans avoir mis bas/pondu. Une formulation sans objet préserve mieux l’ambiguïté de l’image aviaire disputée. Le singulier collectif hébreu עֹשֶׁר est plus directement rendu par « la richesse », sujet singulier de « l’abandonnera ».
  naturalness: 'Le français est globalement naturel et d’un registre biblique moderne. « Couver sans avoir pondu » est plus idiomatique et plus sobre que « couve ce qu’elle n’a pas pondu ». La note actuelle contient une difficulté de sens : on ne « fait [pas] éclore » des petits; ce sont les œufs qui éclosent.'
  terminology: « Perdrix », « richesses acquises injustement », « au milieu de ses jours » et « insensé » conviennent. « Insensé » conserve utilement la portée morale de נָבָל. La suppression de « ne sera qu’ » évite une insistance restrictive qui n’est pas explicitement exprimée dans le texte source.
  issues:
  - severity: medium
    issue: Objet explicité dans l’image de la perdrix
    rationale: « Ce qu’elle n’a pas pondu » transforme la juxtaposition hébraïque « couve et n’a pas pondu » en une relative qui précise que l’objet couvé est constitué d’œufs étrangers. Cette lecture est possible, mais le comportement exact visé est incertain; il vaut mieux ne pas l’imposer dans le texte principal.
  - severity: medium
    issue: Alternative de note biologiquement et idiomatiquement imprécise
    rationale: '« Des petits qu’elle n’a pas fait éclore » ne convient pas bien : ce sont des œufs qui éclosent, et l’alternative entend rendre l’idée d’une nichée que l’oiseau n’a pas produite. Une formulation avec « qu’elle n’a pas mise au monde » évite cette confusion.'
  - severity: low
    issue: Renforcement non nécessaire dans « il ne sera qu’un insensé »
    rationale: Le verbe יהיה signifie simplement « il sera/deviendra »; « ne... que » ajoute une nuance restrictive ou rhétorique non requise.
  revised_text: 'Comme une perdrix qui couve sans avoir pondu[a], ainsi est celui qui acquiert des richesses injustement : au milieu de ses jours, la richesse l’abandonnera, et à sa fin, il sera un insensé.'
