- from: 'Comme une perdrix qui couve ce qu’elle n’a pas pondu[a], ainsi est celui qui acquiert des richesses injustement : au milieu de ses jours, elles l’abandonneront, et à sa fin, il ne sera qu’un insensé.'
  to: 'Comme une perdrix qui couve sans avoir pondu[a], ainsi est celui qui acquiert des richesses injustement : au milieu de ses jours, la richesse l’abandonnera, et à sa fin, il sera un insensé.'
  rationale: La révision conserve l’image et le sens du proverbe tout en évitant de fixer dans le texte principal une explication zoologique contestée. Elle corrige également l’alternative de note, rend le collectif « richesse » au singulier comme en hébreu, et supprime une emphase non explicitée.
