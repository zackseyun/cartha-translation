source:
  edition: WLC
  text: קֹרֵ֤א דָגַר֙ וְ/לֹ֣א יָלָ֔ד עֹ֥שֶׂה עֹ֖שֶׁר וְ/לֹ֣א בְ/מִשְׁפָּ֑ט בַּ/חֲצִ֤י ימ/ו יַעַזְבֶ֔/נּוּ וּ/בְ/אַחֲרִית֖/וֹ יִהְיֶ֥ה נָבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/011.yaml
  text: 'Like a partridge that gathers a brood it did not hatch[a], so is one who makes wealth unjustly: in the middle of his days it will leave him, and in his end he will be a fool.'
translation:
  language: fr
  text: 'Comme une perdrix qui couve sans avoir pondu[a], ainsi est celui qui acquiert des richesses injustement : au milieu de ses jours, la richesse l’abandonnera, et à sa fin, il sera un insensé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme une perdrix qui rassemble une nichée qu’elle n’a pas mise au monde. » Le comportement précis de l’oiseau auquel renvoie le proverbe est incertain; l’idée est que ce qui n’a pas été acquis légitimement ne restera pas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא
  choice: perdrix
  rationale: Dans ce contexte aviaire, le mot désigne traditionnellement la perdrix plutôt que « celui qui appelle »; le verbe de couvaison confirme ce sens zoologique.
- source_word: דָגַר
  choice: couve
  rationale: Le verbe évoque l’action d’un oiseau qui couve ou rassemble une nichée. « Couver » est naturel en français et conserve l’image sans préciser indûment le comportement exact.
- source_word: וְלֹא יָלָד
  choice: ce qu’elle n’a pas pondu
  rationale: Littéralement, le texte parle de ce que l’oiseau n’a pas engendré. Avec « couver », « ne pas avoir pondu » exprime idiomatiquement l’image des œufs étrangers, tout en signalant en note l’autre compréhension possible.
- source_word: עֹשֶׂה עֹשֶׁר
  choice: celui qui acquiert des richesses
  rationale: La tournure hébraïque signifie littéralement « faire des richesses ». « Acquérir des richesses » rend clairement l’idée d’accumulation ou d’obtention en français actuel.
- source_word: וְלֹא בְמִשְׁפָּט
  choice: injustement
  rationale: מִשְׁפָּט désigne ici ce qui est juste ou conforme au droit; l’adverbe français restitue naturellement la fonction de l’expression.
- source_word: בַּחֲצִי יָמָיו
  choice: au milieu de ses jours
  rationale: Cette formulation proche de l’hébreu indique que cela survient avant l’achèvement d’une vie entière, tout en gardant la tonalité proverbiale.
- source_word: יַעַזְבֶנּוּ
  choice: elles l’abandonneront
  rationale: Le sujet logique est « les richesses ». Le français exige le pluriel, même si l’hébreu emploie le singulier collectif עֹשֶׁר, « richesse ».
- source_word: וּבְאַחֲרִיתוֹ
  choice: à sa fin
  rationale: Le suffixe renvoie personnellement à l’homme; « à sa fin » préserve cette référence et peut viser l’issue de sa vie.
- source_word: נָבָל
  choice: un insensé
  rationale: Le terme désigne une folie morale et spirituelle, non un simple manque d’intelligence. « Insensé » conserve cette portée dans un registre biblique encore intelligible.
theological_decisions:
- issue: Interprétation de l’image de la perdrix
  choice: Une perdrix couve ce qu’elle n’a pas pondu, image d’une possession illégitime qui finit par échapper à celui qui se l’est appropriée.
  alternative: Une perdrix rassemble des petits qu’elle n’a pas fait éclore.
  rationale: Le comportement précis évoqué demeure incertain. La traduction principale suit l’interprétation de la couvaison d’œufs étrangers, tandis que la note conserve l’autre lecture sans modifier la pointe certaine du proverbe.
- issue: Référent de יַעַזְבֶנּוּ (« l’abandonnera »)
  choice: Les richesses injustement acquises abandonneront l’homme.
  alternative: L’homme abandonnera ses richesses.
  rationale: 'La construction hébraïque et la logique du proverbe favorisent « la richesse » comme sujet du verbe : le gain mal acquis ne demeure pas auprès de son possesseur.'
translation_notes:
  register: Français moderne, international et digne, avec une structure proverbiale conservée. « Au milieu de ses jours » maintient la couleur poétique de l’hébreu; « insensé » exprime la dimension morale de נָבָל.
