source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֗א נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים עָמַ֛ד לִ/פְנֵ֥י מֶֽלֶךְ בָּבֶ֖ל בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/012.yaml
  text: In the fifth month[a], on the tenth day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan the captain of the guard, who stood before the king of Babylon[c][b], came to Jerusalem.
translation:
  language: fr
  text: Au cinquième mois, le dixième jour du mois — c’était la dix-neuvième année du règne de Nabuchodonosor, roi de Babylone — Nebouzaradan, chef de la garde[a], qui se tenait au service du roi de Babylone[b], vint à Jérusalem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « chef des exécuteurs » ou « chef des bouchers »; ce titre désigne vraisemblablement un haut officier chargé de la garde royale.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « se tenir devant le roi » désigne ici le fait de servir officiellement en sa présence.
    reason: cultural_note
  - marker: c
    text: L’hébreu porte littéralement « dans Jérusalem »; avec le verbe « venir », le français dit naturellement « à Jérusalem ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: Au cinquième mois
  rationale: La conjonction initiale assure la continuité narrative, qu’il n’est pas nécessaire d’expliciter en français. La formule conserve la désignation hébraïque du mois.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: le dixième jour du mois
  rationale: Cette formulation française explicite naturellement le jour sous-entendu dans la date hébraïque.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבוּכַדְרֶאצַּר
  choice: c’était la dix-neuvième année du règne de Nabuchodonosor
  rationale: Le pronom reprend la date, et le lamed introduit la datation selon les années de règne. L’ajout de « du règne » rend cette relation claire et idiomatique en français.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Le sens lexical littéral évoque le chef des exécuteurs ou des bouchers, mais le syntagme fonctionne ici comme un titre de haut officier royal. « Chef de la garde » est clair, digne et contextuellement approprié; le sens littéral est signalé en note.
- source_word: עָמַד לִפְנֵי מֶלֶךְ בָּבֶל
  choice: qui se tenait au service du roi de Babylone
  rationale: La traduction maintient l’image de « se tenir devant » tout en explicitant sa valeur idiomatique de service officiel à la cour.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Après un verbe de mouvement, « vint à Jérusalem » est l’expression française naturelle, bien que la préposition hébraïque signifie formellement « dans/en ».
