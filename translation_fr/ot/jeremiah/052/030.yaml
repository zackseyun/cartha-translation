base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/030.yaml
  text: In the twenty-third year of Nebuchadnezzar[a], Nebuzaradan the captain of the guard carried away 745 Judeans[c][b]. All the persons were 4,600.
translation:
  language: fr
  text: La vingt-troisième année du règne de Nebucadnetsar, Nebouzaradan, chef de la garde, déporta[a] 745 Judéens[b]. Le nombre total des personnes était de 4 600[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « emmena en exil » ou « fit partir en exil ». Le verbe hébreu signifie littéralement « faire aller en exil ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici « personnes » (littéralement « âmes ») comme terme de dénombrement.
    reason: lexical_alternative
  - marker: c
    text: Ce total récapitule les personnes déportées mentionnées aux versets 28 à 30.
    reason: cross_reference
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ וְעֶשְׂרִים לִנְבוּכַדְרֶאצַּר
  choice: La vingt-troisième année du règne de Nebucadnetsar
  rationale: La mention explicite du règne rend naturellement en français la préposition לְ qui rattache l’année au règne de Nebucadnetsar.
- source_word: הֶגְלָה
  choice: déporta
  rationale: Le hiphil de גלה signifie ici faire partir en exil. « Déporta » exprime clairement cette action dans un récit historique.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebouzaradan
  rationale: Translittération française courante du nom propre babylonien.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Équivalent fonctionnel établi pour ce titre officiel; il évite le littéralisme trompeur « chef des bourreaux » tout en convenant au contexte militaire et administratif.
- source_word: יְהוּדִים
  choice: Judéens
  rationale: Dans ce cadre historique et géographique, le terme désigne les gens de Juda; « Judéens » conserve mieux cette nuance que « Juifs ».
- source_word: נֶפֶשׁ / כָּל נֶפֶשׁ
  choice: personnes / le nombre total des personnes
  rationale: Dans ces dénombrements, נֶפֶשׁ désigne des individus. La formule française rend clairement l’emploi comptable et la fonction récapitulative de כָּל נֶפֶשׁ.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה / אַרְבַּעַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 745 / 4 600
  rationale: Les chiffres arabes facilitent la lecture; l’espace suit la typographie française pour les milliers.
