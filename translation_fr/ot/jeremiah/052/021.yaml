  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ/עַמּוּדִ֗ים שְׁמֹנֶ֨ה עֶשְׂרֵ֤ה אַמָּה֙ קומה הָ/עַמֻּ֣ד הָ/אֶחָ֔ד וְ/ח֛וּט שְׁתֵּים עֶשְׂרֵ֥ה אַמָּ֖ה יְסֻבֶּ֑/נּוּ וְ/עָבְי֛/וֹ אַרְבַּ֥ע אַצְבָּע֖וֹת נָבֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/021.yaml
  text: As for the pillars[a], the height of each pillar was eighteen cubits, and a line of twelve cubits would go around it; its thickness was four fingers, and it was hollow.
translation:
  language: fr
  text: Quant aux colonnes, chacune avait dix-huit coudées de haut. Un cordon de douze coudées en faisait le tour. Son épaisseur était de quatre doigts[a], et elle était creuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quatre largeurs de doigt ». L’hébreu dit littéralement « quatre doigts », selon une ancienne unité de mesure fondée sur le corps humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעַמּוּדִים
  choice: Quant aux colonnes
  rationale: Le waw suivi du nom défini introduit ici les colonnes comme nouveau sujet dans un inventaire descriptif. « Quant aux » rend naturellement cette transition sans ajouter de contenu.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה קומה הָעַמֻּד הָאֶחָד
  choice: chacune avait dix-huit coudées de haut
  rationale: Littéralement, « dix-huit coudées était la hauteur de la colonne, l’une ». Dans ce contexte où les deux colonnes sont décrites collectivement, « chacune » indique clairement que la mesure vaut pour chaque colonne.
- source_word: חוּט
  choice: cordon
  rationale: חוּט désigne un fil ou un cordon. « Cordon » conserve l’image concrète d’un lien entourant la colonne et convient au relevé de sa circonférence.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה יְסֻבֶּנּוּ
  choice: Un cordon de douze coudées en faisait le tour
  rationale: Le verbe סבב avec suffixe exprime l’action d’entourer la colonne. Cette formulation française restitue naturellement la mesure de sa circonférence.
- source_word: וְעָבְיוֹ
  choice: Son épaisseur
  rationale: Le terme désigne l’épaisseur de la paroi de la colonne, et non son diamètre total.
- source_word: אַרְבַּע אַצְבָּעוֹת
  choice: quatre doigts
  rationale: L’hébreu dit littéralement « quatre doigts », mesure corporelle ancienne. Le maintien de l’expression concrète est accompagné d’une note explicative.
- source_word: נָבוּב
  choice: elle était creuse
  rationale: Le terme décrit la colonne comme creuse. Une proposition complète est naturelle en français et rend clairement le caractère prédicatif du mot.
