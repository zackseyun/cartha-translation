  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר לְ/בֵית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת כָּל נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/017.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze Sea that was in the house of Yahweh[b], and carried all their bronze to Babylon.
translation:
  language: fr
  text: Les Chaldéens[b] brisèrent les colonnes de bronze qui appartenaient à la maison de Yahweh, ainsi que les supports[a] et la mer de bronze qui se trouvait dans la maison de Yahweh, puis ils emportèrent à Babylone tout le bronze de ces objets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bases »; le terme hébreu désigne les supports des installations du temple.
    reason: lexical_alternative
  - marker: b
    text: Les « Chaldéens » désignent ici les forces babyloniennes.
    reason: historical_clarification
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: les colonnes de bronze
  rationale: « Colonnes » est naturel pour les grands éléments du temple; dans ce contexte, נְחֹשֶׁת désigne conventionnellement le bronze plutôt que le cuivre pur.
- source_word: אֲשֶׁר לְבֵית יְהוָה
  choice: qui appartenaient à la maison de Yahweh
  rationale: Le לְ marque ici vraisemblablement l’appartenance ou la destination, ce qui maintient la distinction avec בְּבֵית, « dans la maison », employé ensuite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: הַמְּכֹנוֹת
  choice: les supports
  rationale: Le terme désigne les structures servant de bases aux installations du temple; « supports » est clair en français moderne sans ajouter dans le corps du texte le détail contextuel qu’ils étaient mobiles.
- source_word: יָם הַנְּחֹשֶׁת
  choice: la Mer de bronze
  rationale: « Mer » est l’appellation traditionnelle et reconnaissable du grand bassin du temple; la majuscule signale qu’il s’agit du nom de cet objet particulier.
- source_word: אֲשֶׁר בְּבֵית יְהוָה
  choice: qui se trouvait dans la maison de Yahweh
  rationale: L’accord singulier rattache naturellement la proposition relative à la Mer de bronze, son antécédent immédiat, tout en respectant בְּ, « dans ».
- source_word: שִׁבְּרוּ
  choice: brisèrent
  rationale: Dans le contexte, le verbe indique que les grands objets furent mis en pièces afin d’en transporter le métal; « brisèrent » l’exprime sobrement.
- source_word: כַשְׂדִּים
  choice: les Chaldéens
  rationale: Ce choix conserve la désignation historique précise du texte hébreu plutôt que de la remplacer directement par « Babyloniens ».
- source_word: וַיִּשְׂאוּ
  choice: ils emportèrent
  rationale: Le verbe décrit ici le transport du métal comme butin; « emportèrent » est idiomatique et précis.
- source_word: כָּל נְחֻשְׁתָּם
  choice: tout le bronze de ces objets
  rationale: Le suffixe renvoie aux objets énumérés. Cette formulation explicite naturellement en français ce référent sans suggérer que les Chaldéens en étaient propriétaires.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: La terminaison directionnelle indique un mouvement vers Babylone, rendu idiomatiquement par « à Babylone » après « emportèrent ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve, tandis que « le Seigneur » substituerait un titre liturgique au nom.
- issue: Rapport des colonnes à la maison de Yahweh
  choice: qui appartenaient à la maison de Yahweh
  alternative: qui étaient dans la maison de Yahweh
  rationale: Le לְ permet une relation d’appartenance ou de destination et contraste avec le בְּ explicitement locatif de la proposition suivante. Le choix retenu préserve cette nuance sans exclure que les colonnes se trouvaient dans l’enceinte du temple.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique écrit. La syntaxe conserve l’inventaire du texte tout en clarifiant le référent du suffixe dans « tout le bronze de ces objets ». Tous les appels de note figurent auprès du terme qu’ils expliquent.
