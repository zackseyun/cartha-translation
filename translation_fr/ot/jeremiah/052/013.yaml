  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית הַ/גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/013.yaml
  text: He burned the house of Yahweh[a], the house of the king, and all the houses of Jerusalem[c][b]; every great house he burned with fire.
translation:
  language: fr
  text: Il brûla la maison de Yahweh[a], la maison du roi[b] et toutes les maisons de Jérusalem ; il brûla au feu toute grande maison[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temple de Yahweh ». L’hébreu dit littéralement « la maison de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le palais du roi » ou « le palais royal ». L’hébreu dit littéralement « la maison du roi ».
    reason: lexical_alternative
  - marker: c
    text: Ou « toute grande demeure » ou « toute maison importante ». L’hébreu dit littéralement « toute grande maison ».
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Il brûla
  rationale: Le wayyiqtol qal de שׂרף fait avancer le récit. Le passé simple convient au registre narratif soutenu en français, tandis que la conjonction initiale peut être absorbée naturellement.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’expression hébraïque littérale « maison de YHWH » et son parallélisme avec « maison du roi ». « Temple » explicite le référent mais constitue une interprétation.
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: Cette formulation reproduit littéralement l’hébreu et maintient la répétition rhétorique de בֵּית. Le palais royal est bien le référent probable, mais « palais » est plus explicite que le texte source.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: toutes les maisons de Jérusalem
  rationale: La formulation rend directement le pluriel et la relation génitive de l’hébreu, dans un français clair et naturel.
- source_word: כָּל בֵּית הַגָּדוֹל
  choice: toute grande maison
  rationale: Le singulier précédé de כָּל a ici une valeur distributive. « Grande » préserve l’ambiguïté de גָּדוֹל entre dimension matérielle et importance sociale.
- source_word: שָׂרַף בָּאֵשׁ
  choice: il la brûla par le feu
  rationale: La formulation conserve la reprise emphatique du verbe « brûler » ainsi que la mention explicite du feu, au lieu de les réduire à « incendia » ou « brûla entièrement ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le rend comme nom propre sans le remplacer par un titre ; « Yahvé » est une translittération française traditionnelle possible.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au récit biblique sans archaïsme lexical marqué. Le parallélisme autour de « maison » et la reprise emphatique finale sont volontairement conservés.
