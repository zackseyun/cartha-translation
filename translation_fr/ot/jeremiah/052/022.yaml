    issue: La distinction « l’un des chapiteaux » est absente.
    rationale: הָאַחַת qualifie le chapiteau comme l’un de la paire. « Ce chapiteau » est idiomatique, mais ne traduit plus cette précision et pourrait simplement reprendre le chapiteau déjà mentionné.
  - severity: low
    issue: Le sens ornemental de « grenades » n’est pas signalé.
    rationale: Dans ce contexte architectural, רִמּוֹנִים désigne des motifs décoratifs en forme de grenade. Une note courte prévient une lecture concrète inadéquate tout en préservant le rendu littéral dans le texte.
  revised_text: Sur lui se trouvait un chapiteau en bronze ; la hauteur de l’un des chapiteaux était de cinq coudées. Un treillis et des grenades[a] entouraient le chapiteau, le tout en bronze. Le second pilier avait les mêmes ornements, avec des grenades.
