  text: וְ/כֹתֶ֨רֶת עָלָ֜י/ו נְחֹ֗שֶׁת וְ/קוֹמַ֨ת הַ/כֹּתֶ֥רֶת הָ/אַחַת֮ חָמֵ֣שׁ אַמּוֹת֒ וּ/שְׂבָכָ֨ה וְ/רִמּוֹנִ֧ים עַֽל הַ/כּוֹתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י וְ/רִמּוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/022.yaml
  text: And on it was a bronze capital[a], and the height of the one capital was five cubits, with latticework and pomegranates on the capital all around, all of bronze. And the second pillar had the same[b], with pomegranates.
translation:
  language: fr
  text: Sur lui se trouvait un chapiteau en bronze ; la hauteur de l’un des chapiteaux était de cinq coudées. Un treillis et des grenades[a] entouraient le chapiteau, le tout en bronze. Le second pilier avait les mêmes ornements, avec des grenades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire des ornements en forme de grenade.
    reason: note_culturelle
lexical_decisions:
- source_word: כֹתֶרֶת
  choice: chapiteau
  rationale: Dans ce contexte architectural, le mot désigne la partie ornementale placée au sommet d’un pilier. « Chapiteau » est le terme français moderne précis.
- source_word: עָלָיו
  choice: au sommet
  rationale: Le suffixe renvoie au pilier mentionné dans le contexte précédent. Cette formulation exprime naturellement la position du chapiteau en français.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte des objets ouvragés du temple, le terme désigne vraisemblablement le bronze plutôt que le cuivre pur.
- source_word: קוֹמַת
  choice: hauteur
  rationale: Le mot indique ici la dimension verticale mesurée du chapiteau.
- source_word: הָאַחַת
  choice: ce chapiteau
  rationale: Littéralement « le chapiteau, l’un [des deux] » ; le démonstratif produit une phrase française naturelle sans introduire artificiellement l’idée de premier.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinq coudées
  rationale: L’unité ancienne du texte source est conservée.
- source_word: שְׂבָכָה
  choice: treillis
  rationale: Le terme désigne un ouvrage décoratif en forme de réseau ; « treillis » est concret, courant et adapté à l’architecture.
- source_word: רִמּוֹנִים
  choice: grenades
  rationale: Le mot signifie littéralement « grenades » et désigne ici des ornements ayant cette forme.
- source_word: סָבִיב
  choice: entouraient
  rationale: Cette formulation rend la disposition circulaire des ornements autour du chapiteau.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: le tout en bronze
  rationale: Formulation concise indiquant que l’ensemble décoratif mentionné était en bronze.
- source_word: וְכָאֵלֶּה לָעַמּוּד הַשֵּׁנִי
  choice: Le second pilier avait les mêmes ornements
  rationale: L’hébreu est elliptique, littéralement « et de tels [éléments] pour le second pilier ». « Ornements » explicite sobrement le référent sans modifier le sens.
