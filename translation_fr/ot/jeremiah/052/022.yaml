revisions:
- from: Au sommet se trouvait un chapiteau en bronze, et la hauteur de ce chapiteau était de cinq coudées. Un treillis et des grenades entouraient le chapiteau, le tout en bronze. Le second pilier avait les mêmes ornements, avec des grenades.
  to: Sur lui se trouvait un chapiteau en bronze ; la hauteur de l’un des chapiteaux était de cinq coudées. Un treillis et des grenades[a] entouraient le chapiteau, le tout en bronze. Le second pilier avait les mêmes ornements, avec des grenades.
  rationale: La révision rétablit la nuance de הָאַחַת par « l’un des chapiteaux », sans imposer l’interprétation « le premier ». Elle conserve les choix architecturaux et matériels du projet, et ajoute une note ancrée sur « grenades » pour expliciter sobrement leur fonction décorative dans le contexte.
