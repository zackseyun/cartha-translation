revisions:
- from: La neuvième année du règne de Sédécias, le dixième mois, le dixième jour du mois, Nabuchodonosor[a], roi de Babylone, vint attaquer Jérusalem avec toute son armée. Ils établirent leur camp face à la ville et construisirent tout autour d’elle un ouvrage de siège[b].
  to: La neuvième année du règne de Sédécias, le dixième mois, le dixième jour du mois, Nabuchodonosor[a], roi de Babylone, vint contre Jérusalem, lui et toute son armée. Ils campèrent contre elle et construisirent tout autour d’elle un ouvrage de siège[b].
  rationale: La révision retire l’explicitation non nécessaire « attaquer » et restitue plus précisément le mouvement hostile vers Jérusalem. Elle préserve aussi l’emphase portant sur le roi et toutes ses forces, ainsi que l’ambiguïté lexicale de דָּיֵק. Les marqueurs de notes restent correctement ancrés au nom et au terme de siège concernés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'La date, l’identification contextuelle de Sédécias, le nom royal, le campement et l’encerclement sont correctement rendus. Toutefois, « vint attaquer » explicite davantage que בָּא ... עַל (« vint contre ») : le contexte est hostile, mais l’attaque n’est pas exprimée par le verbe lui-même. La coordination emphatique « lui et toute son armée » mérite aussi d’être conservée plus directement.'
  naturalness: Le français est globalement clair et d’un registre narratif approprié. « Vint contre Jérusalem » et « ils campèrent contre elle » sont des formulations sobres, naturelles dans une narration biblique moderne, et plus proches de la construction hébraïque que « vint attaquer » et « établirent leur camp face à la ville ».
  terminology: « Nabuchodonosor » est la forme française usuelle; la note signale correctement la forme hébraïque plus proche de « Nabuchodrétsar ». « Ouvrage de siège » maintient utilement l’incertitude lexicale de דָּיֵק; la note en donne des possibilités concrètes sans imposer une interprétation unique.
  issues:
  - severity: medium
    issue: « vint attaquer Jérusalem » surinterprète le verbe de mouvement.
    rationale: בָּא signifie « vint »; la préposition עַל indique la direction hostile (« contre »). Même si le siège établit le contexte militaire, « attaquer » ajoute une action que cette proposition ne formule pas explicitement.
  - severity: low
    issue: La formule « avec toute son armée » atténue l’apposition emphatique « lui et toute son armée ».
    rationale: Le sens demeure proche, mais la reprise explicite du roi et de l’ensemble de ses forces reflète mieux הוּא וְכָל־חֵילוֹ.
  - severity: low
    issue: « face à la ville » est moins directement hostile que עָלֶיהָ.
    rationale: Dans ce contexte, « contre elle » conserve mieux la valeur adversative de la préposition tout en restant idiomatique.
  revised_text: La neuvième année du règne de Sédécias, le dixième mois, le dixième jour du mois, Nabuchodonosor[a], roi de Babylone, vint contre Jérusalem, lui et toute son armée. Ils campèrent contre elle et construisirent tout autour d’elle un ouvrage de siège[b].
  revised_footnotes:
