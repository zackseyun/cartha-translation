    text: La forme hébraïque du nom correspond plus précisément à « Nabuchodrétsar »; « Nabuchodonosor » est la forme française traditionnelle.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner des « travaux de siège », un « rempart » ou une « terrasse de siège ».
    reason: lexical_alternative
  revision_rationale: La révision retire l’explicitation non nécessaire « attaquer » et restitue plus précisément le mouvement hostile vers Jérusalem. Elle préserve aussi l’emphase portant sur le roi et toutes ses forces, ainsi que l’ambiguïté lexicale de דָּיֵק. Les marqueurs de notes restent correctement ancrés au nom et au terme de siège concernés.
