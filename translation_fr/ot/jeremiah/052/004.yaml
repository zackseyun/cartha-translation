base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/004.yaml
  text: And in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, Nebuchadnezzar king of Babylon came—he and all his army—against Jerusalem[b], and they encamped against it and built a siege wall around it.
translation:
  language: fr
  text: La neuvième année du règne de Sédécias, le dixième mois, le dixième jour du mois, Nabuchodonosor[a], roi de Babylone, vint contre Jérusalem, lui et toute son armée. Ils campèrent contre elle et construisirent tout autour d’elle un ouvrage de siège[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme hébraïque du nom correspond plus précisément à « Nabuchodrétsar »; « Nabuchodonosor » est la forme française traditionnelle.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner des « travaux de siège », un « rempart » ou une « terrasse de siège ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁנָה הַתְּשִׁעִית לְמָלְכוֹ
  choice: La neuvième année du règne de Sédécias
  rationale: La formule indique la neuvième année du règne du roi mentionné au verset précédent. La répétition explicite de « Sédécias » évite en français une ouverture pronominale ambiguë tout en respectant la référence contextuelle.
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: le dixième mois, le dixième jour du mois
  rationale: Rendu direct de la date hébraïque, sans substituer un nom de mois absent du texte.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable; une note signale que la graphie hébraïque est plus proche de « Nabuchodrétsar ».
- source_word: בָּא ... עַל יְרוּשָׁלַםִ
  choice: vint attaquer Jérusalem
  rationale: Dans ce contexte militaire, עַל marque un mouvement hostile. « Vint attaquer » exprime naturellement en français la valeur conjointe du verbe de mouvement et de la préposition.
- source_word: הוּא וְכָל חֵילוֹ
  choice: avec toute son armée
  rationale: Le texte souligne que le roi vient accompagné de l’ensemble de ses forces. Cette formulation est naturelle en français tout en conservant cette information.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: Ils établirent leur camp face à la ville
  rationale: Le pluriel englobe le roi et son armée. « Face à la ville » rend la position hostile sans employer le pronom potentiellement équivoque « elle ».
- source_word: דָּיֵק סָבִיב
  choice: un ouvrage de siège tout autour d’elle
  rationale: דָּיֵק désigne une structure ou des travaux destinés au siège, possiblement un rempart ou une terrasse. Le terme générique « ouvrage de siège » préserve cette latitude sémantique, tandis que סָבִיב exprime l’encerclement.
