source:
  edition: WLC
  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֣י הַ/מִּלְחָמָ֡ה יִבְרְחוּ֩ וַ/יֵּצְא֨וּ מֵ/הָ/עִ֜יר לַ֗יְלָה דֶּ֜רֶךְ שַׁ֤עַר בֵּין הַ/חֹמֹתַ֨יִם֙ אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּלְכ֖וּ דֶּ֥רֶךְ הָ/עֲרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/007.yaml
  text: Then the city was breached[a], and all the men of war fled and went out of the city by night by way of the gate between the two walls, which was by the king’s garden, while the Chaldeans were all around the city[c][b]; and they went by way of the Arabah.
translation:
  language: fr
  text: Alors une brèche fut ouverte dans la ville. Tous les combattants s’enfuirent et sortirent de la ville de nuit par la porte située entre les deux murailles, près du jardin du roi, alors que les Chaldéens[c] entouraient la ville de tous côtés. Ils prirent le chemin de l’Araba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: L’« Araba » désigne la région de la dépression du Jourdain. Certaines traductions rendent ce nom par « la plaine ».
    reason: cultural_note
  - marker: c
    text: « Chaldéens » est le nom ethnique hébreu souvent employé pour désigner les forces babyloniennes.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: une brèche fut ouverte dans la ville
  rationale: Le nifal de בקע décrit l’ouverture d’une brèche lors du siège. Cette formulation française est naturelle et conserve la valeur passive, sans préciser explicitement que la muraille est le sujet implicite.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les combattants
  rationale: Rend naturellement l’expression hébraïque « hommes de guerre » dans un récit militaire, sans lourdeur archaïsante.
- source_word: יִבְרְחוּ וַיֵּצְאוּ
  choice: s’enfuirent et sortirent
  rationale: Les formes s’inscrivent dans la succession narrative passée; les deux verbes sont maintenus.
- source_word: לַיְלָה
  choice: pendant la nuit
  rationale: Expression française courante qui rend la circonstance temporelle de la fuite.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: par la porte située entre les deux murailles
  rationale: דֶּרֶךְ indique ici l’itinéraire; le duel חֹמֹתַיִם est explicitement rendu par « deux murailles ».
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: près du jardin du roi
  rationale: עַל a ici une valeur locative de proximité; « près de » évite le contresens spatial « sur ».
- source_word: וְכַשְׂדִּים עַל הָעִיר סָבִיב
  choice: tandis que les Chaldéens encerclaient la ville
  rationale: La proposition fournit la circonstance de la fuite. « Encerclaient » exprime naturellement סָבִיב sans ajouter que la ville était entièrement close.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: Ils prirent le chemin de l’Araba
  rationale: דֶּרֶךְ marque l’itinéraire, tandis que « Araba » conserve le nom de la région géographique plutôt que de le réduire au terme générique « plaine ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Combattants » évite l’archaïsme de « hommes de guerre ». Les marqueurs suivent les notes effectivement retenues; aucune note [a] n’est incluse, car l’alternative anglaise associée ne correspond pas clairement à l’ambiguïté syntaxique de ce texte hébreu.
