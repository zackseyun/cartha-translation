revisions:
- from: Alors une brèche fut ouverte dans la ville. Tous les combattants s’enfuirent et sortirent de la ville pendant la nuit par la porte située entre les deux murailles, près du jardin du roi, tandis que les Chaldéens[c] encerclaient la ville. Ils prirent le chemin de l’Araba[b].
  to: Alors une brèche fut ouverte dans la ville. Tous les combattants s’enfuirent et sortirent de la ville de nuit par la porte située entre les deux murailles, près du jardin du roi, alors que les Chaldéens[c] entouraient la ville de tous côtés. Ils prirent le chemin de l’Araba[b].
  rationale: 'Révision limitée à deux formulations : « de nuit » resserre la valeur circonstancielle du texte source, et « entouraient la ville de tous côtés » rend la présence des Chaldéens autour de la ville sans surinterpréter la construction comme une action progressive. Les notes et leurs marqueurs sont conservés.'
