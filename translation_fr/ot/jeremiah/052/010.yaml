  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁחַ֧ט מֶֽלֶךְ בָּבֶ֛ל אֶת בְּנֵ֥י צִדְקִיָּ֖הוּ לְ/עֵינָ֑י/ו וְ/גַ֛ם אֶת כָּל שָׂרֵ֥י יְהוּדָ֖ה שָׁחַ֥ט בְּ/רִבְלָֽתָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/010.yaml
  text: Then the king of Babylon slaughtered the sons of Zedekiah before his eyes[a], and he also slaughtered all the officials of Judah at Riblah.
translation:
  language: fr
  text: Le roi de Babylone égorgea les fils de Sédécias sous ses yeux. Il égorgea aussi tous les dignitaires de Juda[a] à Ribla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les chefs de Juda » ou « tous les princes de Juda ». Le terme hébreu שָׂרֵי peut désigner de hauts dirigeants, des dignitaires ou des princes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: égorgea
  rationale: Le verbe שׁחט désigne l’abattage ou la mise à mort, souvent avec une nuance violente. « Égorgea » conserve ici la brutalité de l’exécution et convient au récit au passé simple.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Rend directement et naturellement la relation construite en hébreu.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: les fils de Sédécias
  rationale: בְּנֵי désigne précisément les fils, plutôt que les enfants au sens large.
- source_word: לְעֵינָיו
  choice: sous ses yeux
  rationale: Cette expression française naturelle conserve l’image hébraïque et souligne que Sédécias assista personnellement à l’exécution.
- source_word: וְגַם
  choice: Il… aussi
  rationale: « Aussi » préserve la valeur additive de גַם ; la reprise du sujet dans une nouvelle phrase rend le récit clair en français.
- source_word: כָּל שָׂרֵי יְהוּדָה
  choice: tous les dignitaires de Juda
  rationale: שָׂרֵי peut désigner des chefs, hauts responsables, dignitaires ou princes. « Dignitaires » évoque naturellement les membres de l’élite dirigeante sans imposer l’idée de princes héréditaires.
- source_word: שָׁחַט
  choice: égorgea
  rationale: La répétition du même verbe conserve la répétition lexicale et la violence du texte hébreu.
- source_word: בְּרִבְלָתָה
  choice: à Ribla
  rationale: Ribla est un nom de lieu ; « à » est la préposition locative française habituelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Égorgea » maintient la dureté du verbe hébreu, tandis que « dignitaires » reste accessible et évite de préciser indûment le statut exact des שָׂרֵי.
