  text: בַּ/חֹ֤דֶשׁ הָֽ/רְבִיעִי֙ בְּ/תִשְׁעָ֣ה לַ/חֹ֔דֶשׁ וַ/יֶּחֱזַ֥ק הָ/רָעָ֖ב בָּ/עִ֑יר וְ/לֹא הָיָ֥ה לֶ֖חֶם לְ/עַ֥ם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/006.yaml
  text: In the fourth month[a], on the ninth day of the month, the famine became severe in the city, and there was no bread for the people of the land.
translation:
  language: fr
  text: Au quatrième mois, le neuvième jour du mois, la famine s’aggrava dans la ville, et il n’y avait pas de pain pour le peuple du pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les gens du peuple ». L’expression hébraïque rendue par « peuple du pays » peut, selon le contexte, désigner plus précisément la population ordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרְבִיעִי
  choice: Au quatrième mois
  rationale: La formule hébraïque indique une date. « De l’année » n’est pas exprimé dans le texte source et n’est donc pas ajouté.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: le neuvième jour du mois
  rationale: Cette formulation française explicite naturellement le jour sous-entendu dans la formule de datation hébraïque.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: la famine s’aggrava
  rationale: Le verbe חזק signifie littéralement « devenir fort »; avec « famine » pour sujet, il décrit son intensification. « S’aggrava » est naturel et précis en français.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Le lieu est désigné simplement comme « la ville »; le contexte l’identifie à Jérusalem sans qu’il soit nécessaire d’ajouter son nom.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: et il n’y avait plus de pain
  rationale: לֶחֶם désigne littéralement le pain, même s’il peut représenter plus largement la nourriture. « Plus » convient au contexte d’une famine qui s’aggrave et rend idiomatiquement l’absence désormais constatée.
- source_word: לְעַם הָאָרֶץ
  choice: pour le peuple du pays
  rationale: La traduction littérale préserve la portée potentiellement large de l’expression hébraïque, qui peut aussi désigner plus précisément la population ordinaire selon le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation conserve l’image concrète du pain et l’ambiguïté sociale de « peuple du pays ». Le marqueur de note est placé après l’expression qu’il explique.
