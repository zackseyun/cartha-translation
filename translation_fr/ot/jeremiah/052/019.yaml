base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/019.yaml
  text: And the bowls[a], the firepans, the basins, the pots, the lampstands, the cups, and the vessels for pouring—whatever was gold, gold, and whatever was silver[d][c][b], silver—the captain of the guard took.
translation:
  language: fr
  text: Le chef des gardes emporta les coupes[a], les braseros[b], les bassins, les marmites, les porte-lampes, les coupelles et les ustensiles à verser[c] — ce qui était en or, en or, et ce qui était en argent, en argent[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bols ». La distinction exacte entre plusieurs noms de récipients du temple dans cette liste est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « les encensoirs ».
    reason: lexical_alternative
  - marker: c
    text: 'Le sens précis du terme hébreu est incertain; autres traductions possibles : « les aiguières » ou « les récipients pour les libations ».'
    reason: lexical_alternative
  - marker: d
    text: L’hébreu répète littéralement « or, or » et « argent, argent », probablement pour mettre ces matières en relief dans l’inventaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים
  choice: les coupes
  rationale: Le terme désigne probablement des récipients cultuels en forme de coupe ou de bol. « Coupes » convient à l’inventaire tout en laissant à la note l’incertitude sur la distinction exacte entre ces objets.
- source_word: הַמַּחְתּוֹת
  choice: les braseros
  rationale: Ces ustensiles servaient à transporter des braises, notamment dans le service du sanctuaire. « Braseros » est concret; « encensoirs » reste possible mais précise davantage la fonction.
- source_word: הַמִּזְרָקוֹת
  choice: les bassins
  rationale: Le mot désigne des récipients rituels, souvent employés dans le cadre des sacrifices. « Bassins » est naturel et n’impose pas une fonction trop précise.
- source_word: הַסִּירוֹת
  choice: les marmites
  rationale: Le nom désigne des pots ou récipients. « Marmites » est un terme courant et concret adapté à cet inventaire.
- source_word: הַמְּנֹרוֹת
  choice: les porte-lampes
  rationale: מְנוֹרָה désigne le support portant les lampes plutôt que les lampes seules. « Porte-lampes » rend clairement l’objet sans introduire le terme culturel plus spécifique « menorahs ».
- source_word: הַכַּפּוֹת
  choice: les godets
  rationale: Dans les inventaires du sanctuaire, le terme peut désigner de petits récipients, coupes ou cuillers. « Godets » permet de le distinguer du premier terme de la liste sans prétendre déterminer exactement sa forme.
- source_word: הַמְּנַקִיּוֹת
  choice: les récipients pour les libations
  rationale: Ce terme rare désigne vraisemblablement des ustensiles servant à verser. La formulation fonctionnelle est intelligible et conserve en note l’incertitude lexicale.
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: ce qui était en or, en or, et ce qui était en argent, en argent
  rationale: La répétition inhabituelle de l’hébreu est conservée, car elle produit un effet emphatique et caractéristique d’un inventaire.
- source_word: לָקַח
  choice: les emporta
  rationale: Le verbe signifie littéralement « prit ». Dans ce contexte de saisie et de déplacement du mobilier du temple, « emporta » exprime naturellement l’action sans la charger d’une qualification supplémentaire.
- source_word: רַב טַבָּחִים
  choice: le chef des gardes
  rationale: Ce titre babylonien désigne un haut officier. « Chef des gardes » est clair et idiomatique; le sens étymologique possible « chef des exécuteurs » est signalé en note.
