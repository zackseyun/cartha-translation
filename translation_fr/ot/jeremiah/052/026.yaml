source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אוֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אוֹתָ֛/ם אֶל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/026.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: fr
  text: Nebouzaradan, chef de la garde[a], les prit et les conduisit au roi de Babylone, à Ribla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « chef des égorgeurs ». Dans ce contexte royal, ce titre désigne le commandant de la garde et peut aussi impliquer des fonctions d’exécution.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie couramment « prendre » dans ce récit. « Prit » reste direct sans ajouter la nuance plus forte de « saisit ».
- source_word: אוֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux responsables mentionnés au verset précédent.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebouzaradan
  rationale: Translittération française usuelle et immédiatement reconnaissable du nom propre.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Littéralement, le titre associe « chef » à un terme désignant des hommes chargés d’abattre, des exécuteurs ou des gardes. Dans le cadre royal, « chef de la garde » exprime naturellement la fonction sans réduire indûment celle-ci aux exécutions.
- source_word: וַיֹּלֶךְ
  choice: conduisit
  rationale: La forme causative de הלך, avec un objet et une destination, peut signifier « amener » ou « conduire ». Pour des prisonniers escortés jusqu’au roi, « conduisit » est naturel en français.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: auprès du roi de Babylone
  rationale: La préposition אֶל marque le mouvement vers le roi. « Auprès du » rend ici la présentation ou l’acheminement jusqu’à lui, sans imposer le sens plus interprétatif de « devant ».
- source_word: רִבְלָתָה
  choice: à Ribla
  rationale: La terminaison directionnelle peut signaler un mouvement vers Ribla, mais le contexte permet naturellement de comprendre que le roi de Babylone s’y trouvait.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de l’ordre et du sens hébreux tout en évitant le calque obscur « chef des massacreurs ». Le nom Ribla suit la forme française courante.
