  source_fidelity: 'Le sens de l’hébreu est bien rendu : le roi babylonien parle favorablement à Yehoyakîn et élève sa position royale au-dessus de celle des autres rois présents à Babylone. Toutefois, dans la formulation française, « son trône » peut se rapporter au sujet (« il », le roi de Babylone) plutôt qu’à Yehoyakîn, objet de l’action précédente. Une légère explicitation évite cette ambiguïté sans modifier le sens.'
  naturalness: Le français est fluide et de registre approprié. « Au-dessus de ceux des rois » est naturel, mais l’explicitation du possesseur du trône améliore nettement la lisibilité dans un verset isolé.
  terminology: « Bienveillance », « trône », « rois » et « Babylone » conviennent au contexte royal. La note restitue adéquatement la possibilité plus littérale de « bonnes choses ».
