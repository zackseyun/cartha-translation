  rationale: La révision se limite à désambiguïser le possesseur de « trône ». Yehoyakîn est le destinataire explicitement nommé dans le contexte immédiat (v. 31) et celui dont le rang est élevé dans ce verset. La construction « au-dessus de ceux des rois » conserve l’image des trônes des autres rois.
