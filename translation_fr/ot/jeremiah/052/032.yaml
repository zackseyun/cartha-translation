  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a].
translation:
  language: fr
  text: Il lui parla avec bienveillance et plaça le trône de Yehoyakîn au-dessus de ceux des rois qui étaient avec lui à Babylone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il lui parla de bonnes choses », c’est-à-dire qu’il lui parla favorablement, avec bienveillance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: Il lui parla avec bienveillance
  rationale: דבר avec אֵת signifie ici « parler à », tandis que טֹבוֹת, adjectif féminin pluriel employé adverbialement, indique des paroles favorables ou bienveillantes. Cette formulation est naturelle en français tout en conservant le sens de l’hébreu.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: plaça son trône
  rationale: נתן avec « son trône » évoque ici l’attribution ou le positionnement de la place royale. « Plaça » préserve l’image concrète sans réduire l’expression à une simple promotion abstraite.
- source_word: כִּסְאוֹ
  choice: son trône
  rationale: כִּסֵּא peut désigner un siège ou un trône ; le contexte royal et la comparaison avec d’autres rois justifient « trône ».
- source_word: מִמַּעַל לְכִסֵּא מְלָכִים
  choice: plus haut que ceux des rois
  rationale: La tournure exprime une position supérieure, concrète et honorifique. Le pronom « ceux » reprend naturellement « trône » en français et rend distributivement les trônes des différents rois.
- source_word: אֲשֶׁר אִתּוֹ בְּבָבֶל
  choice: qui étaient avec lui à Babylone
  rationale: La proposition relative désigne les rois présents auprès du souverain babylonien. En français, « à Babylone » est l’usage idiomatique pour la ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Avec bienveillance » restitue l’expression hébraïque sans lourdeur ; « plaça son trône plus haut » conserve à la fois l’image de la disposition des sièges et l’idée de supériorité de rang.
