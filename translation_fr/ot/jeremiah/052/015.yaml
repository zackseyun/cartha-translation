base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/015.yaml
  text: And some of the poorest of the people[a], and the rest of the people who remained in the city, and the deserters who had defected to the king of Babylon, and the rest of the craftsmen—Nebuzaradan, the captain of the guard[c][b], carried into exile.
translation:
  language: fr
  text: Nebouzaradan, le chef de la garde, déporta une partie des plus pauvres du peuple[a], le reste de la population qui était demeurée dans la ville, ceux qui avaient fait défection et s’étaient ralliés au roi de Babylone[b], ainsi que le reste des artisans[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelques-uns des gens les plus modestes du peuple ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui étaient tombés… vers le roi de Babylone » ; il s’agit d’une expression désignant ceux qui étaient passés dans son camp.'
    reason: lexical_alternative
  - marker: c
    text: 'Le mot hébreu est difficile. Autre traduction possible : « le reste de la multitude ». Comparer 2 Rois 25.11, récit parallèle de cette déportation.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָעָם
  choice: une partie des plus pauvres du peuple
  rationale: Cette formulation rend le sens partitif de מִן et la pauvreté ou l’humble condition exprimée par דַּלּוֹת, dans un français naturel.
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: le reste de la population qui était demeurée dans la ville
  rationale: « Le reste » traduit יֶתֶר, tandis que la relative conserve explicitement l’idée de ceux qui étaient restés dans la ville.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ אֶל מֶלֶךְ בָּבֶל
  choice: ceux qui avaient fait défection et s’étaient ralliés au roi de Babylone
  rationale: Le redoublement hébreu est rendu par deux expressions françaises complémentaires. Dans ce contexte politico-militaire, נפל אל désigne le fait de passer dans le camp du souverain babylonien.
- source_word: יֶתֶר הָאָמֹון
  choice: le reste des artisans
  rationale: Le sens de אָמוֹן est incertain. « Artisans » convient au contexte des déportations et à une interprétation ancienne et répandue, mais l’autre lecture possible est signalée en note.
- source_word: הֶגְלָה
  choice: déporta
  rationale: Le hiphil de גלה signifie faire partir en exil. « Déporta » est précis, sobre et naturel dans un récit historique.
- source_word: רַב טַבָּחִים
  choice: le chef de la garde
  rationale: Bien que le titre évoque littéralement le chef des exécuteurs, il désigne ici un haut officier royal chargé de la garde et des exécutions. « Chef de la garde » en communique clairement la fonction.
