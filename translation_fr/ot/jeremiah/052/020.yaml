revisions:
- from: Quant aux deux colonnes, à l’unique Mer, et aux douze bœufs de bronze[a] qui se trouvaient sous les supports, que le roi Salomon avait faits pour la maison de Yahweh, le poids du bronze de tous ces objets ne fut pas établi[b].
  to: Quant aux deux colonnes, à la Mer et aux douze bœufs de bronze[a] qui se trouvaient sous les supports que le roi Salomon avait faits pour la maison de Yahweh, il n’y eut pas de pesée pour le bronze de tous ces objets[b].
  rationale: La révision rattache sans ambiguïté l’œuvre de Salomon aux supports, conformément à la syntaxe hébraïque. Elle remplace une tournure française moins naturelle par « la Mer », tout en conservant la désignation technique du bassin, et rend plus directement la clause finale sans trancher entre absence de pesée et poids hors de portée. Les notes sont ajustées pour une terminologie française plus naturelle et un ancrage explicatif approprié.
