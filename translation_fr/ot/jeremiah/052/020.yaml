  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם אֶחָד֙ וְ/הַ/בָּקָ֞ר שְׁנֵים עָשָׂ֤ר נְחֹ֨שֶׁת֙ אֲשֶׁר תַּ֣חַת הַ/מְּכֹנ֔וֹת אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֻשְׁתָּ֖/ם כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/020.yaml
  text: As for the two pillars[a], the one Sea, and the twelve bronze oxen that were under the stands[b], which King Solomon had made for the house of Yahweh—there was no weighing the bronze of all these vessels.
translation:
  language: fr
  text: Quant aux deux colonnes, à la Mer et aux douze bœufs de bronze[a] qui se trouvaient sous les supports que le roi Salomon avait faits pour la maison de Yahweh, il n’y eut pas de pesée pour le bronze de tous ces objets[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les douze taureaux de bronze ». Le terme hébreu peut désigner du gros bétail; dans ce contexte, « bœufs » est le rendu habituel.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il n’y avait pas de poids pour leur bronze ». Cela peut signifier que le bronze ne fut pas pesé ou que son poids était impossible à déterminer.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: les deux colonnes
  rationale: עַמּוּדִים désigne les deux grandes colonnes du temple. « Colonnes » est le terme architectural courant et précis en français moderne.
- source_word: הַיָּם אֶחָד
  choice: l’unique Mer
  rationale: יָם est ici le nom du grand bassin du temple. La majuscule signale cet emploi technique, et « unique » conserve la mention numérale de l’inventaire sans produire la tournure raide « la Mer, une ».
- source_word: וְהַבָּקָר שְׁנֵים עָשָׂר נְחֹשֶׁת
  choice: les douze bœufs de bronze
  rationale: בָּקָר désigne ici les figures de bovins servant de supports; « bœufs » est naturel dans ce contexte. נְחֹשֶׁת est rendu par « bronze », terme moderne approprié.
- source_word: אֲשֶׁר תַּחַת הַמְּכֹנוֹת
  choice: qui se trouvaient sous les supports
  rationale: מְכֹנוֹת désigne des structures servant de bases ou de supports. « Supports » reste clair sans préciser davantage leur forme ou leur mobilité.
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: que le roi Salomon avait faits
  rationale: Le plus-que-parfait situe naturellement leur fabrication avant les événements racontés. Le masculin pluriel peut reprendre l’ensemble des objets énumérés.
- source_word: לְבֵית יְהוָה
  choice: pour la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque de בֵית, tandis que « Yahweh » représente directement le nom divin יְהוָה.
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֻשְׁתָּם
  choice: le poids du bronze de tous ces objets ne fut pas établi
  rationale: La formulation française restitue l’idée qu’aucun poids n’était disponible ou déterminé, sans décider dans le texte principal si le bronze ne fut simplement pas pesé ou si sa masse était incalculable.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: tous ces objets
  rationale: כֵּלִים est un terme général. « Objets » convient mieux que « récipients » à une liste comprenant des colonnes, une grande cuve et des figures bovines.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe conserve le caractère d’inventaire du verset, tandis que « l’unique Mer » identifie clairement le bassin cultuel. Les deux marqueurs de note sont placés sur les expressions qu’ils expliquent.
