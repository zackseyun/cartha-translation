  text: There were ninety-six pomegranates toward the outside[a]; all the pomegranates on the lattice all around were one hundred.
translation:
  language: fr
  text: Il y avait quatre-vingt-seize grenades vers l’extérieur[a] ; toutes les grenades du treillis, tout autour, étaient au nombre de cent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « du côté extérieur », « dans une direction » ou peut-être « du côté exposé au vent ». Le terme hébreu est difficile ; quatre-vingt-seize semblent être comptées d’un côté, tandis que leur nombre total autour du treillis était de cent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִמֹּנִים
  choice: grenades
  rationale: Le mot désigne littéralement des grenades, ici des ornements en forme de grenade. Le terme concret est conservé sans explicitation dans le texte.
- source_word: תִּשְׁעִים וְשִׁשָּׁה
  choice: quatre-vingt-seize
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: רוּחָה
  choice: du côté extérieur
  rationale: Le terme directionnel est difficile dans ce contexte architectural. Cette formulation exprime prudemment l’idée probable du côté tourné vers l’extérieur, sans masquer l’incertitude signalée en note.
- source_word: כָּל הָרִמּוֹנִים מֵאָה
  choice: au total, il y avait cent grenades
  rationale: Cette tournure française naturelle fait ressortir le décompte total indiqué par כָּל et le nombre cent.
- source_word: הַשְּׂבָכָה
  choice: le treillis
  rationale: Le mot désigne l’ouvrage en réseau ornant les chapiteaux des colonnes ; « treillis » est précis, concis et courant.
- source_word: סָבִיב
  choice: tout autour
  rationale: Rend naturellement l’idée d’une disposition sur toute la circonférence.
