  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/002.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that Jehoiakim had done.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh[a], conformément à tout ce qu’avait fait Joïaqim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux yeux de Yahweh » ; expression hébraïque courante signifiant « selon le jugement de Yahweh » ou « au regard de Yahweh ».'
    reason: explication_d_un_idiotisme
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה fait progresser le récit. En français, le passé simple rend naturellement cette succession narrative sans exiger un « et » initial.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’expression עשה הרע désigne une conduite jugée mauvaise ; « faire ce qui est mal » est idiomatique et conserve sa portée morale.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression hébraïque d’évaluation signifie « selon le jugement de » ou « au regard de », tout en conservant ici sa métaphore transparente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, plutôt que remplacé par le titre « le Seigneur ».
- source_word: כְּכֹל אֲשֶׁר
  choice: exactement comme
  rationale: La tournure exprime une conformité complète au comportement de Joiaqim. « Exactement comme » restitue naturellement en français la force comparative de כְּ et la totalité marquée par כֹּל.
- source_word: עָשָׂה
  choice: avait fait
  rationale: Le plus-que-parfait français indique naturellement que la conduite de Joiaqim sert de modèle antérieur, sans modifier le rapport temporel implicite du contexte.
- source_word: יְהוֹיָקִים
  choice: Joiaqim
  rationale: Cette forme française courante du nom biblique correspond à la translittération de l’hébreu יְהוֹיָקִים.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve sa fonction de nom propre sans lui substituer un titre.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque ; « aux yeux de » conserve l’image hébraïque tout en restant immédiatement compréhensible.
