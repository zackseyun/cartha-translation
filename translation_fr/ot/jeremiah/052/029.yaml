lexical_decisions:
- source_word: בִּשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: Dans la dix-huitième année
  rationale: La construction indique une date de règne. Le cardinal hébreu a ici une valeur ordinale, rendue naturellement en français par « dix-huitième ».
- source_word: לִנְבוּכַדְרֶאצַּר
  choice: de Nabuchodonosor
  rationale: Le לְ introduit la personne dont on compte les années de règne ; « de Nabuchodonosor » est la formulation française usuelle.
- source_word: מִירוּשָׁלִַם
  choice: de Jérusalem
  rationale: La préposition מִן marque la provenance. La formulation conserve cette valeur sans ajouter au verset hébreu un verbe explicite de déportation.
- source_word: נֶפֶשׁ
  choice: personnes
  rationale: Bien que le mot signifie littéralement « âme » ou « être vivant », il sert ici à compter des individus. « personnes » est clair et naturel en français.
- source_word: שְׁמֹנֶה מֵאוֹת שְׁלֹשִׁים וּשְׁנָיִם
  choice: '832'
  rationale: Le nombre hébreu correspond sans ambiguïté à 800 + 30 + 2 ; les chiffres conviennent au caractère récapitulatif de cette liste.
