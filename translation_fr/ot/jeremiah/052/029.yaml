  text: 'Dans la dix-huitième année de Nabuchodonosor : de Jérusalem, 832 personnes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « 832 âmes ». Le mot hébreu נֶפֶשׁ, souvent traduit par « âme », sert ici à compter des personnes.'
