base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/009.yaml
  text: They captured the king and brought him up to the king of Babylon at Riblah in the land of Hamath[a], and he passed sentence on him.
translation:
  language: fr
  text: Ils capturèrent le roi et l’amenèrent auprès du roi de Babylone, à Ribla, dans le pays de Hamath, et le roi de Babylone prononça contre lui des jugements[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « il parla avec lui des jugements ». Cette expression désigne ici des décisions judiciaires prononcées contre lui; on pourrait aussi traduire : « il rendit des jugements contre lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: Ils capturèrent
  rationale: Le verbe תפשׂ exprime ici la saisie du roi dans un contexte militaire. « Capturèrent » est précis et naturel en français moderne.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: La désignation définie renvoie au roi de Juda déjà présent dans le contexte, sans qu’il soit nécessaire d’ajouter son nom.
- source_word: וַיַּעֲלוּ אֹתוֹ אֶל
  choice: et l’amenèrent auprès de
  rationale: Le causatif de עלה signifie littéralement « faire monter ». Dans ce récit, « amenèrent auprès de » restitue naturellement le transfert du prisonnier devant l’autorité babylonienne sans imposer en français une indication topographique incertaine.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Rendu direct et idiomatique de la construction hébraïque.
- source_word: רִבְלָתָה
  choice: à Ribla
  rationale: Le suffixe directionnel ou locatif est rendu naturellement par « à »; le toponyme est translittéré selon l’usage français.
- source_word: בְּאֶרֶץ חֲמָת
  choice: dans le pays de Hamath
  rationale: אֶרֶץ peut désigner un pays ou un territoire. « Pays de Hamath » conserve la formulation géographique traditionnelle tout en restant claire.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: Celui-ci prononça contre lui ses jugements
  rationale: La formulation conserve le pluriel מִשְׁפָּטִים et la portée judiciaire de l’expression. « Celui-ci » indique naturellement que le sujet est le roi de Babylone, tandis que la note préserve la tournure hébraïque inhabituelle.
