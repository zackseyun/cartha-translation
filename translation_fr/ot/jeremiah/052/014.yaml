source:
  edition: WLC
  text: וְ/אֶת כָּל חֹמ֥וֹת יְרוּשָׁלִַ֖ם סָבִ֑יב נָֽתְצוּ֙ כָּל חֵ֣יל כַּשְׂדִּ֔ים אֲשֶׁ֖ר אֶת רַב טַבָּחִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/014.yaml
  text: And all the walls around Jerusalem were broken down by all the army of the Chaldeans that was with the captain of the guard[a][b].
translation:
  language: fr
  text: Toute l’armée des Chaldéens[a] qui était avec le chef de la garde[b] démolit toutes les murailles qui entouraient Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Babyloniens ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chef des exécuteurs » ; ce titre désignait probablement le commandant de la garde royale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹמוֹת
  choice: murailles
  rationale: Le pluriel désigne ici les ouvrages défensifs de Jérusalem; « murailles » est naturel et précis en français.
- source_word: סָבִיב
  choice: qui entouraient Jérusalem
  rationale: Cette formulation idiomatique exprime l’étendue circulaire indiquée par l’adverbe hébreu et rattache clairement celui-ci aux murailles.
- source_word: נָתְצוּ
  choice: démolit
  rationale: Le verbe נתץ signifie abattre ou démolir une construction. L’actif français suit directement le verbe hébreu pluriel, avec le collectif « armée » rendu au singulier.
- source_word: חֵיל
  choice: armée
  rationale: Dans ce contexte, חֵיל désigne la force militaire chaldéenne.
- source_word: כַּשְׂדִּים
  choice: Chaldéens
  rationale: La traduction conserve l’ethnonyme hébreu; « Babyloniens » est donné en note comme équivalent contextuel.
- source_word: אֲשֶׁר אֶת
  choice: qui accompagnait
  rationale: La construction exprime l’association de l’armée avec l’officier; « accompagnait » est concise et naturelle sans préciser davantage la relation hiérarchique.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Ce titre désigne un haut officier babylonien responsable de la garde royale; cette formulation intelligible évite le sens français potentiellement trompeur de « capitaine » tout en conservant la fonction probable.
