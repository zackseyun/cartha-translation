revisions:
- from: Sa pension[a], une pension régulière, lui était accordée par le roi de Babylone, selon ses besoins quotidiens, jour après jour, jusqu’au jour de sa mort, tous les jours de sa vie.
  to: 'Son entretien[a], un entretien régulier, lui était accordé par le roi de Babylone : une portion pour chaque jour, jour après jour, jusqu’au jour de sa mort, tous les jours de sa vie.'
  rationale: La révision supprime l’idée non exprimée de besoins individuels et rend l’idiome quotidien par « une portion pour chaque jour, jour après jour ». « Entretien » conserve le sens administratif de provision ou de subsistance, tandis que la répétition du nom et l’expression finale maintiennent l’emphase du texte hébreu.
