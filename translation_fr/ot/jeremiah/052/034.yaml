  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַת֩ תָּמִ֨יד נִתְּנָה לּ֜/וֹ מֵ/אֵ֧ת מֶֽלֶךְ בָּבֶ֛ל דְּבַר י֥וֹם בְּ/יוֹמ֖/וֹ עַד י֣וֹם מוֹת֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/034.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king of Babylon, a daily portion day by day, until the day of his death, all the days of his life.
translation:
  language: fr
  text: 'Son entretien[a], un entretien régulier, lui était accordé par le roi de Babylone : une portion pour chaque jour, jour après jour, jusqu’au jour de sa mort, tous les jours de sa vie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ration », « provision », « part » ou « allocation ». Le terme hébreu désigne ici l’entretien matériel attribué à Yehoyakîn par le roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: pension
  rationale: Dans ce contexte royal, le nom désigne l’entretien matériel attribué à Yehoyakîn. « Pension » exprime naturellement en français une allocation régulière destinée à sa subsistance, sans réduire le terme à un simple repas.
- source_word: תָּמִיד
  choice: régulière
  rationale: Le mot indique ici la continuité et la régularité de l’entretien accordé. « Régulière » convient idiomatiquement à « pension » et évite l’expression peu naturelle « pension continuelle ».
- source_word: נִתְּנָה
  choice: lui était accordée
  rationale: L’imparfait passif rend la valeur de la forme hébraïque et la durée de la disposition. « Accordée » convient au cadre d’une pension royale.
- source_word: מֵאֵת מֶלֶךְ בָּבֶל
  choice: par le roi de Babylone
  rationale: מֵאֵת marque la provenance et, avec un passif, peut naturellement désigner l’agent. En français, « par le roi » est plus idiomatique que « de la part du roi » dans cette phrase.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: selon ses besoins quotidiens, jour après jour
  rationale: L’expression désigne ce qui est fixé ou requis pour chaque jour. Cette formulation conserve à la fois l’idée de la part quotidienne et la répétition distributive du texte hébreu.
- source_word: עַד יוֹם מוֹתוֹ
  choice: jusqu’au jour de sa mort
  rationale: La traduction garde la formulation complète et la cadence de l’hébreu.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: tous les jours de sa vie
  rationale: Cette expression française transparente reproduit fidèlement l’idiome hébreu et son insistance finale.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition finale est conservée pour respecter l’insistance du texte, tandis que les tournures administratives sont rendues de façon naturelle.
