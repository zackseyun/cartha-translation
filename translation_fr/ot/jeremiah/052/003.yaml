  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָֽיְתָה֙ בִּ/ירוּשָׁלִַ֣ם וִֽ/יהוּדָ֔ה עַד הִשְׁלִיכ֥/וֹ אוֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/003.yaml
  text: For because of the anger of Yahweh it came to pass in Jerusalem and Judah[a], until he cast them out from before his face[b]; and Zedekiah rebelled against the king of Babylon.
translation:
  language: fr
  text: Car c’est à cause de la colère de Yahweh que cela arriva à Jérusalem et en Juda, jusqu’à ce qu’il les expulse de sa présence[a]. Sédécias se révolta contre le roi de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant sa face » ; c’est-à-dire de sa présence.'
    reason: L’expression hébraïque emploie l’image de la face de Yahweh pour désigner sa présence.
lexical_decisions:
- source_word: כִּי עַל אַף יְהוָה
  choice: Car c’est à cause de la colère de Yahweh
  rationale: כִּי introduit l’explication donnée par le verset, et עַל אַף exprime ici la cause liée à la colère divine. La tournure clivée est naturelle en français et maintient clairement le rapport causal.
- source_word: הָיְתָה
  choice: que cela arriva
  rationale: Le verbe féminin singulier n’a pas de sujet explicite dans la proposition. « Cela arriva » reprend sobrement la situation décrite par le contexte sans préciser davantage ce que l’hébreu laisse implicite.
- source_word: בִּירוּשָׁלִַם וִיהוּדָה
  choice: à Jérusalem et en Juda
  rationale: Les prépositions françaises usuelles distinguent naturellement la ville de Jérusalem et le territoire de Juda.
- source_word: עַד הִשְׁלִיכוֹ אוֹתָם
  choice: jusqu’à ce qu’il les rejette
  rationale: Le hifil de שׁלך indique une expulsion énergique. « Rejeter » conserve la gravité du jugement sans imposer un détail matériel absent du texte.
- source_word: מֵעַל פָּנָיו
  choice: loin de sa présence
  rationale: Cette formulation française rend le sens idiomatique de l’expression hébraïque tout en conservant, dans une note, son image littérale.
- source_word: וַיִּמְרֹד צִדְקִיָּהוּ בְּמֶלֶךְ בָּבֶל
  choice: Sédécias se révolta contre le roi de Babylone
  rationale: Avec מרד, la préposition בְּ marque la personne contre laquelle on se révolte. « Se révolter contre » est précis et idiomatique en français.
theological_decisions:
- issue: Lien entre la colère divine et le sort de Jérusalem et de Juda
  choice: Présenter explicitement la colère de Yahweh comme la cause de ce qui arriva, jusqu’au rejet loin de sa présence.
  alternative: Atténuer ce lien en présentant les événements comme un simple enchaînement historique.
  rationale: Le texte hébreu affirme expressément la causalité au moyen de עַל אַף יְהוָה. La traduction conserve cette affirmation sans expliquer pourquoi Yahweh est en colère ni ajouter une interprétation doctrinale.
- issue: Sujet implicite de הָיְתָה
  choice: Employer le pronom neutre « cela ».
  alternative: Préciser le sujet par « ce malheur », « cette destruction » ou « ces événements ».
  rationale: L’hébreu ne nomme pas ici le sujet. « Cela » préserve cette indétermination et renvoie naturellement au contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe explicative reste proche de l’hébreu tout en évitant un calque lourd. Le nom divin est translittéré « Yahweh », et l’ambiguïté du sujet de הָיְתָה est maintenue par « cela ».
