  rationale: La révision remplace une expression qui affaiblissait légèrement l’idée d’expulsion et ajoutait une notion de distance. Elle maintient le sujet implicite par « cela », le lien causal explicite et l’image hébraïque en note, sans résoudre davantage l’ellipse syntaxique du texte source.
