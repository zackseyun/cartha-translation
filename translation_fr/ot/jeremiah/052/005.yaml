  text: So the city came under siege until the eleventh year of King Zedekiah.
translation:
  language: fr
  text: La ville fut donc assiégée jusqu’à la onzième année du règne du roi Sédécias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: La ville resta donc assiégée
  rationale: Littéralement, la ville « entra/vint dans le siège ». En contexte, l’expression indique qu’elle demeura en état de siège durant la période qui aboutit à la onzième année. « Resta assiégée » est naturel en français et s’accorde avec le récit parallèle de 2 Rois 25.2.
- source_word: עַד עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: jusqu’à la onzième année
  rationale: Rend directement la limite temporelle exprimée par עַד.
- source_word: לַמֶּלֶךְ צִדְקִיָּהוּ
  choice: du règne du roi Sédécias
  rationale: Le datif hébreu signifie ici « en ce qui concerne le roi Sédécias », c’est-à-dire la onzième année de son règne. L’explicitation évite en français l’ambiguïté de « la onzième année du roi ».
