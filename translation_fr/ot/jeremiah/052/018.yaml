source:
  edition: WLC
  text: וְ/אֶת הַ֠/סִּרוֹת וְ/אֶת הַ/יָּעִ֨ים וְ/אֶת הַֽ/מְזַמְּר֜וֹת וְ/אֶת הַ/מִּזְרָקֹ֣ת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ם לָקָֽחוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/018.yaml
  text: They took away the pots[a], the shovels, the snuffers, the basins, the dishes[c][b], and all the bronze vessels with which they ministered.
translation:
  language: fr
  text: Ils emportèrent les marmites, les pelles, les mouchettes[a], les bassins, les coupes, ainsi que tous les ustensiles de bronze avec lesquels on assurait le service[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les instruments pour tailler les mèches ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec lesquels on servait ». Le verbe hébreu désigne souvent l’accomplissement d’un service cultuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּרוֹת
  choice: les marmites
  rationale: Le nom désigne couramment des récipients ou marmites; ce terme concret et naturel convient à l’inventaire du Temple sans préciser davantage leur usage.
- source_word: הַיָּעִים
  choice: les pelles
  rationale: Il s’agit d’instruments servant à retirer les cendres ou les braises; « pelles » est clair et usuel dans ce contexte cultuel.
- source_word: הַמְזַמְּרוֹת
  choice: les mouchettes
  rationale: Dans les listes d’ustensiles du Temple, le terme désigne vraisemblablement des instruments servant à tailler les mèches des lampes. « Mouchettes » est le terme français précis, avec une note donnant une formulation plus transparente.
- source_word: הַמִּזְרָקֹת
  choice: les bassins
  rationale: Ces récipients pouvaient recevoir ou servir à répandre des liquides, notamment dans le rituel sacrificiel; « bassins » garde cette nuance sans surinterprétation.
- source_word: הַכַּפּוֹת
  choice: les coupes
  rationale: Le mot peut désigner de petits récipients, bols, coupes ou objets en forme de cuillère. « Coupes » préserve ici une identification assez large et naturelle.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: tous les ustensiles de bronze
  rationale: Dans cet inventaire, כְּלֵי désigne des objets utilitaires, et נְחֹשֶׁת le bronze employé pour le mobilier du Temple.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: avec lesquels on assurait le service
  rationale: Le verbe שרת évoque ici le service cultuel. La tournure impersonnelle française conserve le sujet indéfini de l’hébreu tout en restant naturelle.
- source_word: לָקָחוּ
  choice: Ils emportèrent
  rationale: Le contexte est celui de l’enlèvement des objets du Temple; « emportèrent » exprime naturellement ce mouvement sans ajouter de précision absente du texte.
theological_decisions:
- issue: Nuance cultuelle du verbe שרת
  choice: on assurait le service
  alternative: on s’en servait
  rationale: La traduction retenue conserve la possibilité d’un service sacré ou liturgique, tandis que l’alternative risquerait de réduire le verbe au simple emploi matériel des objets.
translation_notes:
  register: Français moderne, sobre et digne. Le vocabulaire reste concret pour la liste d’objets; « mouchettes », terme moins courant mais précis, est explicité en note. La formulation « assurer le service » maintient la nuance cultuelle sans préciser qui officiait.
