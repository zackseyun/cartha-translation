base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/028.yaml
  text: 'These are the people whom Nebuchadnezzar carried away captive: in the seventh year[b][a], 3,023 Judeans.'
translation:
  language: fr
  text: 'Voici ceux que Nebucadnetsar déporta : la septième année, 3 023 Judéens[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Juifs » ; ici, le terme désigne les gens de Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הָעָם
  choice: Voici les gens
  rationale: La forme hébraïque est au singulier (« ce peuple »), mais elle introduit ici un relevé numérique. « Voici les gens » restitue naturellement en français cette fonction de présentation.
- source_word: הֶגְלָה
  choice: déporta
  rationale: Le hiphil de גלה exprime le fait de contraindre des personnes à partir en exil. « Déporta » rend avec concision le déplacement forcé dans ce contexte historique.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebucadnetsar
  rationale: Forme française usuelle du nom du roi babylonien.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: dans la septième année
  rationale: Le nombre cardinal est employé avec une valeur ordinale; cette tournure conserve l'absence, dans le verset, d'un complément explicite précisant de quel règne il s'agit.
- source_word: יְהוּדִים
  choice: Judéens
  rationale: Dans ce contexte historique, le terme désigne les gens du royaume ou du territoire de Juda. « Judéens » préserve mieux cette nuance géographique et politique que « Juifs ».
- source_word: שְׁלֹשֶׁת אֲלָפִים וְעֶשְׂרִים וּשְׁלֹשָׁה
  choice: 3 023
  rationale: Le nombre hébreu est additif et sans ambiguïté. Les chiffres, avec l'espacement typographique français, conviennent à ce relevé.
