  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖ה כֹּהֵ֣ן הַ/מִּשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/024.yaml
  text: And the captain of the guard took Seraiah the chief priest[a], and Zephaniah the second priest[c][b], and the three keepers of the threshold.
translation:
  language: fr
  text: Le chef de la garde prit Seraïa, le prêtre en chef[a], Sophonie, le prêtre en second[b], et les trois gardiens du seuil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grand prêtre ». Le titre hébreu signifie littéralement « le prêtre en chef » ou « le prêtre principal ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le prêtre adjoint ».
    reason: lexical_alternative
  - marker: c
    text: Ou « les portiers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Dans le contexte de la cour néo-babylonienne, cette expression désigne l’officier qui commande la garde royale. « Chef de la garde » rend naturellement la fonction sans traduire littéralement l’image des « égorgeurs ».
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe signifie normalement « prendre ». Ici, il implique une prise en détention, mais « prit » conserve la sobriété et la portée narrative de l’hébreu.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Translittération française moderne du nom hébreu.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: le prêtre en chef
  rationale: Littéralement « le prêtre, la tête/le chef ». « Prêtre en chef » reflète étroitement le titre hébreu tout en restant naturel en français.
- source_word: צְפַנְיָה
  choice: Sophonie
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: כֹּהֵן הַמִּשְׁנֶה
  choice: le prêtre en second
  rationale: Le terme מִשְׁנֶה indique le second rang ou une fonction d’adjoint. « Prêtre en second » préserve la hiérarchie officielle sans préciser davantage que le texte.
- source_word: שְׁלֹשֶׁת
  choice: les trois
  rationale: Le construit hébreu introduit trois personnes définies par la fonction qui suit.
- source_word: שֹׁמְרֵי הַסַּף
  choice: gardiens du seuil
  rationale: Rend directement l’image hébraïque de ceux qui gardent le seuil, probablement des fonctionnaires chargés des accès du Temple.
theological_decisions:
- issue: Titre de Seraya
  choice: prêtre en chef
  alternative: grand prêtre
  rationale: Le texte emploie רֹאשׁ, « tête/chef ». La traduction principale garde cette formulation, tandis que la note signale le titre fonctionnel traditionnel possible.
- issue: Rang de Sophonie
  choice: prêtre en second
  alternative: prêtre adjoint
  rationale: La formulation retenue préserve l’expression hiérarchique de l’hébreu sans définir précisément les attributions de la charge.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit étroitement l’hébreu tout en demeurant fluide; les titres officiels conservent leur légère ambiguïté grâce aux notes.
