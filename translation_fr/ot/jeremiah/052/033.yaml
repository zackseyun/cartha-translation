- from: Il quitta ses vêtements de prison[a] et prit constamment ses repas en sa présence, tous les jours de sa vie[b].
  to: Il quitta ses vêtements de prison[a] et prit régulièrement ses repas devant lui, tous les jours de sa vie[b].
  rationale: La révision remplace « constamment » par « régulièrement », qui correspond mieux à la valeur contextuelle de תָּמִיד, et reformule la première note pour prévenir une ambiguïté française. Le texte conserve les pronoms non explicités et ne transforme pas « devant lui » en une affirmation plus interprétative telle que « à la table du roi ».
