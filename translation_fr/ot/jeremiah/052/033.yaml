  text: וְ/שִׁנָּ֕ה אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם לְ/פָנָ֛י/ו תָּמִ֖יד כָּל יְמֵ֥י חַיָּֽ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/033.yaml
  text: And he changed out of his prison clothes and ate bread before him continually all the days of his life[a][b].
translation:
  language: fr
  text: Il quitta ses vêtements de prison[a] et prit régulièrement ses repas devant lui, tous les jours de sa vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « il changea de vêtements, abandonnant ceux de sa détention ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il mangea du pain devant lui » ; il s’agit vraisemblablement de repas pris en présence du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּה אֵת בִּגְדֵי כִלְאוֹ
  choice: Il quitta ses vêtements de prison
  rationale: Le verbe שׁנה signifie ici « changer ». Avec « les vêtements de son emprisonnement », le français naturel « quitta ses vêtements de prison » exprime qu’il cessa de les porter, sans ajouter explicitement quels vêtements les remplacèrent.
- source_word: וְאָכַל לֶחֶם
  choice: prit ses repas
  rationale: Littéralement « mangea du pain » ; dans ce contexte, l’expression désigne le fait de prendre ses repas. Le rendu idiomatique évite de laisser entendre que son alimentation se limitait au pain.
- source_word: לְפָנָיו
  choice: en sa présence
  rationale: Littéralement « devant lui ». « En sa présence » conserve le sens de la formule hébraïque sans préciser davantage que le texte s’il mangeait à la table du roi.
- source_word: תָּמִיד
  choice: constamment
  rationale: תָּמִיד exprime ici une continuité ou une régularité durable. « Constamment » préserve cette portée en lien avec la période qui suit.
- source_word: כָּל יְמֵי חַיָּו
  choice: tous les jours de sa vie
  rationale: Rendu direct de la formule hébraïque, qui conserve sa cadence et indique toute la durée de sa vie restante dans le contexte.
