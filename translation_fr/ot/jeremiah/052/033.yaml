  verdict: revise
  source_fidelity: 'Le sens général est fidèle : le verset dit que le prisonnier abandonna/changa ses vêtements de détention et mangea régulièrement devant le roi pour le reste de sa vie. Toutefois, « constamment » risque d’évoquer une action ininterrompue, alors que תָּמִיד, renforcé par « tous les jours de sa vie », exprime ici une pratique durable et régulière. La note a doit aussi éviter « changea les vêtements », qui peut suggérer qu’il les modifia plutôt qu’il changea de tenue.'
  naturalness: « Il quitta ses vêtements de prison » est clair et naturel. « prit constamment ses repas » est moins idiomatique et sémantiquement trop absolu en français moderne ; « prit régulièrement ses repas » rend mieux l’idée dans ce contexte. « devant lui » est direct, naturel et respecte l’ambiguïté pronominale du texte.
  terminology: « Vêtements de prison » et « prendre ses repas » conviennent au registre moderne international. La note littérale conserve utilement « mangea du pain devant lui ».
