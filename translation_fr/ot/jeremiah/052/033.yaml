  - severity: low
    issue: La formulation de la note a est ambiguë en français.
    rationale: « Il changea les vêtements de son emprisonnement » peut se comprendre comme une modification des vêtements. « Il changea de vêtements, abandonnant ceux de sa détention » explicite l’alternative formelle sans changer le sens.
