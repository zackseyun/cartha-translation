base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/011.yaml
  text: Then he blinded Zedekiah’s eyes[a], bound him with bronze shackles, and the king of Babylon brought him to Babylon and put him in the house of custody until the day of his death.
translation:
  language: fr
  text: Puis il aveugla Sédécias et l’enchaîna avec des entraves de bronze. Le roi de Babylone l’emmena à Babylone et le plaça dans la maison de détention[a] jusqu’au jour de sa mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans une prison ». L’hébreu porte littéralement : « dans la maison de détention ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ עִוֵּר
  choice: il aveugla Sédécias
  rationale: L’hébreu dit littéralement qu’il « aveugla les yeux de Sédécias ». En français actuel, « aveugler les yeux » serait maladroit et redondant; « aveugla Sédécias » exprime naturellement et sans atténuation le geste décrit.
- source_word: וַיַּאַסְרֵהוּ
  choice: l’attacha
  rationale: Le verbe אסר signifie ici « attacher, lier ». Le complément qui suit précise le moyen de contention.
- source_word: בַנְחֻשְׁתַּיִם
  choice: avec des entraves de bronze
  rationale: Le terme désigne des liens ou dispositifs de contention en bronze. « Entraves » convient au contexte carcéral et conserve la mention précise du matériau.
- source_word: וַיְבִאֵהוּ מֶלֶךְ בָּבֶל בָּבֶלָה
  choice: l’emmena à Babylone
  rationale: La forme causative de בוא signifie « faire venir, amener ». Dans ce contexte de prisonnier, « emmener » est naturel en français, et la terminaison directionnelle de בָּבֶלָה est rendue par « à Babylone ».
- source_word: בֵּית הַפְּקֻדֹּת
  choice: la maison de détention
  rationale: Cette expression désigne vraisemblablement un lieu où une personne est gardée ou détenue. « Maison de détention » préserve l’image et la structure de l’hébreu sans préciser davantage que le texte; « prison » est donné en note comme équivalent idiomatique.
- source_word: עַד יוֹם מוֹתוֹ
  choice: jusqu’au jour de sa mort
  rationale: Cette formulation conserve l’expression explicite et solennelle de l’hébreu plutôt que de la réduire à « jusqu’à sa mort » ou « jusqu’à ce qu’il meure ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La formulation reste proche de la structure hébraïque tout en évitant les tournures peu naturelles; « maison de détention » maintient l’expression concrète du texte, éclairée par une note.
