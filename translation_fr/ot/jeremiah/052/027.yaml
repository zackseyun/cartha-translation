source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה אוֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/027.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[a]. So Judah was taken into exile from its land.
translation:
  language: fr
  text: Le roi de Babylone les frappa et les mit à mort à Ribla, dans le pays de Hamath. Ainsi, Juda fut emmené en exil hors de son pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Juda partit en exil hors de son pays. » Le verbe hébreu est à la voix active, mais le contexte décrit une déportation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה אוֹתָם
  choice: les frappa
  rationale: Le verbe נכה désigne ici une action violente et punitive. « Les frappa » reste distinct du verbe suivant, qui précise leur mise à mort.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Rend naturellement la construction hébraïque tout en conservant le titre et le nom du royaume.
- source_word: וַיְמִתֵם
  choice: les mit à mort
  rationale: La forme causative de מות signifie « faire mourir ». « Mit à mort » en préserve la force sans imposer l'idée plus précise d'une procédure judiciaire formelle.
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  choice: à Ribla, dans le pays de Hamath
  rationale: Traduction locative claire et traditionnelle des deux indications géographiques.
- source_word: וַיִּגֶל יְהוּדָה
  choice: Juda fut emmené en exil
  rationale: Le verbe est morphologiquement actif, mais le contexte est celui d'une déportation forcée. Cette formulation française exprime ce résultat sans remplacer « Juda » par une explicitation comme « les habitants de Juda ».
- source_word: מֵעַל אַדְמָתוֹ
  choice: loin de son pays
  rationale: La préposition מֵעַל exprime l'éloignement d'un lieu, et אֲדָמָה désigne ici le sol ou le pays de Juda. « Son » correspond naturellement en français au suffixe masculin singulier renvoyant à Juda.
theological_decisions:
- issue: Voix active du verbe וַיִּגֶל et caractère forcé de l'exil
  choice: Juda fut emmené en exil
  alternative: Juda partit en exil
  rationale: La traduction principale rend explicite la déportation suggérée par le contexte babylonien, tandis que la note conserve la possibilité d'une traduction plus formellement active.
- issue: Suffixe masculin singulier dans אַדְמָתוֹ
  choice: son pays
  alternative: le pays de Juda
  rationale: En français, « Juda » est masculin et « son pays » reproduit sans difficulté le lien grammatical du suffixe hébreu, sans lui attribuer de portée doctrinale.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste proche de l'hébreu, tout en distinguant clairement les deux verbes « frappa » et « mit à mort ». Le nom géographique « Ribla » suit l'usage français courant.
