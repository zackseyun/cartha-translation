  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ן מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מַלְכֻת֗/וֹ אֶת רֹאשׁ֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּצֵ֥א אוֹת֖/וֹ מִ/בֵּ֥ית ה/כליא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/031.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-fifth day of the month, that Evil-merodach king of Babylon, in the first year of his reign[b], lifted up the head of Jehoiachin king of Judah and brought him out from the prison.
translation:
  language: fr
  text: La trente-septième année après l’exil de Jékonias, roi de Juda, le vingt-cinquième jour du douzième mois, Évil-Merodak, roi de Babylone, la première année de son règne, releva la tête de Jékonias, roi de Juda[a], et le fit sortir de la prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « releva la tête de » signifie ici qu’il lui accorda sa faveur ou le réhabilita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: La trente-septième année…
  rationale: La formule narrative hébraïque est intégrée à une phrase française naturelle; l’ouverture temporelle suffit à marquer le nouvel épisode.
- source_word: לְגָלוּת
  choice: de l’exil
  rationale: « Exil » exprime clairement la période comptée depuis la déportation, dans un français moderne.
- source_word: יְהוֹיָכִין
  choice: Jékonias
  rationale: Forme française biblique usuelle du nom du roi.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ בְּעֶשְׂרִים וַחֲמִשָּׁה לַחֹדֶשׁ
  choice: le vingt-cinquième jour du douzième mois
  rationale: Restitution idiomatique et précise de la formule de datation hébraïque.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Évil-Merodak
  rationale: Transcription française traditionnelle et reconnaissable du nom royal.
- source_word: בִּשְׁנַת מַלְכֻתוֹ
  choice: dans l’année où il devint roi
  rationale: Cette traduction suit littéralement la formulation propre à Jérémie 52:31 sans imposer « la première année », précision issue du passage parallèle.
- source_word: נָשָׂא אֶת רֹאשׁ
  choice: releva la tête de
  rationale: L’idiome hébreu est conservé afin de préserver son image et son possible sens de restauration ou de faveur; une note l’explicite.
- source_word: וַיֹּצֵא אוֹתוֹ
  choice: et le fit sortir
  rationale: Le causatif hébreu est rendu directement, sans remplacer l’action par l’interprétation « libéra ».
- source_word: מִבֵּית הַכְּלִיא
  choice: de prison
  rationale: Équivalent français naturel de « maison de détention ».
theological_decisions:
- issue: Sens de l’expression « relever la tête »
  choice: Conserver l’idiome dans le texte et l’expliquer en note
  alternative: « accorda sa faveur à » ou « réhabilita »
  rationale: L’expression peut signaler une faveur ou un relèvement de statut; la traduction évite de réduire sa portée à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe chronologique est allégée sans perdre les éléments du texte hébreu. « Dans l’année où il devint roi » respecte la formulation du WLC et évite d’importer explicitement « la première année » depuis 2 Rois 25.27.
