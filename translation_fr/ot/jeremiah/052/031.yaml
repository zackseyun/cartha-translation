    issue: Rendu de בִּשְׁנַת מַלְכֻתוֹ
    rationale: « Dans l’année où il devint roi » explicite l’accession, alors que la formule hébraïque est une datation de règne. Dans ce contexte, « la première année de son règne » est le rendu français le plus précis et correspond au sens établi par le parallèle textuel, sans modifier l’événement.
  - severity: low
    issue: Formulation temporelle initiale
    rationale: « La trente-septième année de l’exil » peut se comprendre, mais « la trente-septième année après l’exil » exprime plus nettement en français le calcul des années depuis la déportation.
  - severity: low
    issue: Complément de lieu avec « fit sortir »
    rationale: '« De la prison » est l’expression légèrement plus naturelle et explicite pour rendre « de la maison de détention ». '
