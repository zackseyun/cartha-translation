id: JER.52.1
reference: Jeremiah 52:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירֽוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/001.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem[b]. His mother’s name was Hamutal the daughter of Jeremiah of Libnah.
translation:
  language: fr
  text: Sédécias avait vingt et un ans lorsqu’il devint roi[a], et il régna onze ans à Jérusalem. Sa mère s’appelait Hamoutal ; elle était fille de Jérémie, de Libna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsqu’il commença à régner ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que Jérémie était originaire de Libna, ou y était établi.
    reason: ambiguity
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: avait vingt et un ans
  rationale: L’expression hébraïque est une tournure idiomatique indiquant l’âge ; cette formulation est naturelle et précise en français moderne.
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition ב avec l’infinitif construit de מלך situe l’âge de Sédécias au moment de son accession au trône.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté ; « régna » en est l’équivalent français usuel et précis.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition locative naturelle devant un nom de ville est « à ».
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette formulation restitue naturellement en français l’idiome hébreu « le nom de sa mère était ».
- source_word: חמיטל
  choice: Hamoutal
  rationale: Translittération française courante du nom hébreu, avec « ou » pour le son /u/.
- source_word: בַּת יִרְמְיָהוּ
  choice: elle était fille de Jérémie
  rationale: La tournure explicite le lien filial sans alourdir la phrase ; « Jérémie » est la forme française conventionnelle du nom.
- source_word: מִלִּבְנָה
  choice: de Libna
  rationale: Le מן hébreu indique ici l’origine ou le rattachement géographique de Jérémie ; « de Libna » conserve cette concision et cette légère latitude.
