  text: וּ/מִ/דַּלּ֣וֹת הָ/אָ֔רֶץ הִשְׁאִ֕יר נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים לְ/כֹרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/016.yaml
  text: But some of the poorest of the land Nebuzaradan[a], the captain of the guard[b], left as vinedressers and farmers.
translation:
  language: fr
  text: Mais Nebouzaradan, chef de la garde[a], laissa quelques-uns des plus pauvres du pays comme vignerons et travailleurs agricoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef des exécuteurs » ; le titre hébreu signifie littéralement « chef des tueurs » et désigne probablement une fonction officielle de la cour ou de l’armée.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme vignerons et laboureurs » ; le second terme hébreu, rare, désigne des travailleurs agricoles et peut évoquer plus précisément ceux qui labourent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָאָרֶץ
  choice: Mais… une partie des plus pauvres du pays
  rationale: Le מִן exprime ici une valeur partitive. « Mais » rend le contraste avec les déportations évoquées dans le contexte, tandis que « du pays » désigne Juda.
- source_word: הִשְׁאִיר
  choice: laissa
  rationale: Le hiphil de שׁאר signifie « laisser, laisser subsister ». « Laissa » reste concis sans préciser indûment le motif.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebouzaradan
  rationale: Translittération française courante du nom propre.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Il s’agit vraisemblablement d’un titre officiel babylonien. Cette formulation naturelle indique la fonction sans imposer le sens littéral potentiellement trompeur de « chef des exécuteurs ».
- source_word: לְכֹרְמִים
  choice: pour travailler dans les vignes
  rationale: Le לְ marque la fonction assignée, et כֹּרְמִים désigne ceux qui cultivent ou entretiennent les vignes.
- source_word: וּלְיֹגְבִים
  choice: et dans les champs
  rationale: Le terme rare désigne des travailleurs agricoles, probablement ceux qui labourent ou cultivent le sol. La formulation retenue est claire tout en évitant une précision incertaine.
