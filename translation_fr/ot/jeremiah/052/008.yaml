  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥יגוּ אֶת צִדְקִיָּ֖הוּ בְּ/עַֽרְבֹ֣ת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/008.yaml
  text: But the army of the Chaldeans pursued the king and overtook Zedekiah in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: fr
  text: Mais l’armée des Chaldéens poursuivit le roi et rattrapa Sédécias dans les plaines de Jéricho[a]. Toute son armée se dispersa loin de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les steppes de Jéricho ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: l’armée des Chaldéens
  rationale: חֵיל désigne ici une force militaire, et כַּשְׂדִּים est rendu par le terme historique et formellement correspondant « Chaldéens ».
- source_word: וַיִּרְדְּפוּ אַחֲרֵי הַמֶּלֶךְ
  choice: poursuivit le roi
  rationale: En français, « poursuivre » intègre naturellement le sens de אַחֲרֵי dans ce contexte de traque militaire.
- source_word: וַיַּשִּׂיגוּ אֶת צִדְקִיָּהוּ
  choice: rattrapa Sédécias
  rationale: נשׂג indique que les poursuivants rejoignent celui qu’ils pourchassent; « rattraper » est précis et naturel en français moderne.
- source_word: בְּעַרְבֹת יְרֵחוֹ
  choice: dans les plaines de Jéricho
  rationale: עֲרָבוֹת peut désigner des plaines ou des steppes; « plaines » est clair et courant, tandis que l’autre nuance est conservée en note.
- source_word: וְכָל חֵילוֹ נָפֹצוּ
  choice: Toute son armée se dispersa
  rationale: Le verbe hébreu est au pluriel avec un sujet collectif. Le français traite naturellement « armée » au singulier, et la tournure pronominale exprime la désagrégation des troupes sans imposer un agent.
- source_word: מֵעָלָיו
  choice: loin de lui
  rationale: La préposition exprime ici l’éloignement et la séparation d’avec Sédécias; « loin de lui » est idiomatique et conserve cette relation personnelle.
