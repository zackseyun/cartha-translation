source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר הָיָ֥ה פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/שִׁבְעָ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת סֹפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בְּ/ת֥וֹךְ הָ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/025.yaml
  text: And from the city he took one court official who had been appointed over the men of war[a], and seven men from those who saw the king’s face, who were found in the city, and the scribe of the commander of the army, who mustered the people of the land, and sixty men from the people of the land who were found within the city.
translation:
  language: fr
  text: De la ville, il prit un fonctionnaire de la cour qui était chargé des hommes de guerre, sept hommes parmi ceux qui avaient accès au roi[a] et qui se trouvaient dans la ville, le secrétaire du chef de l’armée, qui recrutait le peuple du pays, ainsi que soixante hommes du peuple du pays qui se trouvaient à l’intérieur de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parmi ceux qui voyaient le visage du roi » ; expression de cour désignant ceux qui étaient admis en sa présence ou faisaient partie de son entourage personnel.'
    reason: Précise l’idiome hébreu et conserve l’ambiguïté entre accès privilégié et fonction d’entourage.
lexical_decisions:
- source_word: סָרִיס
  choice: fonctionnaire de la cour
  rationale: Le terme peut désigner un eunuque ou, plus largement, un haut fonctionnaire royal. Le contexte précise sa responsabilité militaire, mais non son statut physique.
- source_word: פָקִיד
  choice: qui était chargé de
  rationale: Cette formulation naturelle exprime la fonction de surveillance ou l’autorité déléguée indiquée par le nom hébreu.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: hommes de guerre
  rationale: Cette expression conserve l’idiome militaire hébreu tout en restant claire dans un registre narratif soutenu.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: parmi ceux qui avaient accès au roi
  rationale: L’expression signifie littéralement « ceux qui voyaient le visage du roi » et désigne des courtisans bénéficiant d’un accès direct au souverain. Le sens idiomatique figure dans le texte, et l’image littérale est signalée en note.
- source_word: סֹפֵר שַׂר הַצָּבָא
  choice: le secrétaire du chef de l’armée
  rationale: סֹפֵר peut désigner un scribe ou un secrétaire administratif. Ici, il s’agit vraisemblablement de l’agent attaché au commandant de l’armée.
- source_word: הַמַּצְבִּא
  choice: qui recrutait
  rationale: Le participe hiphil de צבא évoque ici la levée ou l’enrôlement de personnes pour le service militaire. « Recrutait » est naturel en français moderne sans exclure une conscription.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: La traduction formelle préserve une expression susceptible de désigner la population du pays avec une nuance sociopolitique, sans la réduire aux seules classes populaires.
- source_word: בְּתוֹךְ הָעִיר
  choice: à l’intérieur de la ville
  rationale: Cette formulation française naturelle conserve l’insistance locative de l’hébreu.
