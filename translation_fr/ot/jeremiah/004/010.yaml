source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה אָכֵן֩ הַשֵּׁ֨א הִשֵּׁ֜אתָ לָ/עָ֤ם הַ/זֶּה֙ וְ/לִ/ירוּשָׁלִַ֣ם לֵ/אמֹ֔ר שָׁל֖וֹם יִהְיֶ֣ה לָ/כֶ֑ם וְ/נָגְעָ֥ה חֶ֖רֶב עַד הַ/נָּֽפֶשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/010.yaml
  text: Then I said[a], “Ah, Lord Yahweh, surely you have greatly deceived this people and Jerusalem, saying[b], ‘You will have peace,’ while the sword has reached to the soul.”
translation:
  language: fr
  text: 'Alors j’ai dit : « Ah ! Seigneur Yahvé, tu as vraiment trompé[a] ce peuple et Jérusalem en leur disant : “Vous aurez la paix”, alors que l’épée est parvenue jusqu’à la vie même[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu associe l’infinitif absolu au verbe conjugué pour renforcer l’affirmation. On pourrait aussi traduire : « tu as complètement trompé » ou « tu as gravement induit en erreur ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le mot hébreu peut désigner la « vie », l’« âme » ou la « gorge ». Ici, l’expression signifie probablement que l’épée a atteint le point de menacer la vie elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Cette interjection exprime abruptement la consternation ou la plainte de Jérémie. « Ah ! » est naturel en français actuel, tandis que « Hélas ! » donnerait une tonalité plus soutenue et archaïsante.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahvé
  rationale: Le titre composé associe אֲדֹנָי, « Seigneur », au nom divin YHWH. « Seigneur Yahvé » évite l’expression redondante « Seigneur SEIGNEUR » et représente explicitement le nom divin.
- source_word: הַשֵּׁא הִשֵּׁאתָ
  choice: tu as vraiment trompé
  rationale: Le verbe נשׁא signifie ici « tromper, induire en erreur ». L’infinitif absolu joint au verbe conjugué renforce l’affirmation ; « vraiment » en restitue naturellement l’insistance sans atténuer l’accusation.
- source_word: לָעָם הַזֶּה וְלִירוּשָׁלִַם
  choice: ce peuple et Jérusalem
  rationale: La préposition ל introduit les deux objets du verbe. Jérusalem est conservée à côté du peuple comme ville personnifiée.
- source_word: לֵאמֹר
  choice: en leur disant
  rationale: Cette formulation introduit naturellement en français le contenu de la parole adressée au peuple et à Jérusalem. Le pronom « leur » explicite les destinataires déjà nommés.
- source_word: שָׁלוֹם יִהְיֶה לָכֶם
  choice: Vous aurez la paix
  rationale: שָׁלוֹם désigne ici la paix, la sécurité et le bien-être. La formulation française est directe et conserve le futur de l’hébreu.
- source_word: וְנָגְעָה חֶרֶב
  choice: alors que l’épée a atteint
  rationale: נגע peut signifier « toucher » ou « atteindre ». « A atteint » exprime l’arrivée effective de l’épée, et « alors que » fait ressortir le contraste saisissant avec l’annonce de paix.
- source_word: עַד הַנָּפֶשׁ
  choice: leur vie même
  rationale: נֶפֶשׁ peut désigner la vie, la personne, l’âme ou, dans certains contextes, la gorge. Ici, l’expression indique vraisemblablement que l’épée menace ou atteint la vie elle-même. « Leur vie même » est idiomatique tout en gardant la force de l’image.
theological_decisions:
- issue: Faut-il atténuer l’affirmation selon laquelle Dieu a trompé le peuple ?
  choice: 'Conserver l’accusation directe : « tu as vraiment trompé »'
  alternative: « tu as laissé tromper ce peuple » ou « tu as gravement induit ce peuple en erreur »
  rationale: La construction hébraïque attribue directement l’action à Dieu et la souligne. Puisqu’il s’agit de la plainte formulée par Jérémie, la traduction conserve cette tension théologique sans introduire une explication harmonisante.
- issue: Comment rendre נֶפֶשׁ sans imposer une anthropologie particulière ?
  choice: « leur vie même »
  alternative: « leur âme même » ou « leur gorge »
  rationale: Dans ce contexte de menace mortelle, le mot renvoie probablement à la vie elle-même. « Vie » évite de réduire le terme à une distinction philosophique entre corps et âme, tandis qu’une note signale l’éventail lexical.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe conserve la plainte abrupte de Jérémie, l’accusation sans atténuation et le contraste entre la paix annoncée et l’épée déjà parvenue jusqu’à la vie.
