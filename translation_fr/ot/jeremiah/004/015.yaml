  text: כִּ֛י ק֥וֹל מַגִּ֖יד מִ/דָּ֑ן וּ/מַשְׁמִ֥יעַ אָ֖וֶן מֵ/הַ֥ר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/015.yaml
  text: For a voice is declaring from Dan[b][a], and proclaiming disaster from the hill country of Ephraim.
translation:
  language: fr
  text: Car une voix annonce depuis Dan et proclame le malheur[a] depuis la région montagneuse d’Éphraïm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la calamité » ou « la détresse » ; dans d’autres contextes, le mot hébreu peut aussi signifier « le mal » ou « la perversité ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis la montagne d’Éphraïm » ; l’expression désigne vraisemblablement la région montagneuse d’Éphraïm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le motif de l’avertissement dans le contexte, tout en conservant la valeur connective de l’hébreu.
- source_word: קוֹל
  choice: une voix
  rationale: Rend littéralement l’image vive d’une voix qui transmet une annonce; « bruit » ou « nouvelle » seraient possibles, mais moins proches de la formulation hébraïque.
- source_word: מַגִּיד
  choice: annonce
  rationale: Le participe hébreu présente l’annonce comme actuelle et saisissante. Le présent français en restitue naturellement l’immédiateté.
- source_word: מִדָּן
  choice: depuis Dan
  rationale: Dan est le point géographique septentrional d’où se propage l’annonce de l’invasion.
- source_word: וּמַשְׁמִיעַ
  choice: et proclame
  rationale: La forme causative signifie littéralement « fait entendre ». « Proclame » exprime une annonce publique et maintient le parallélisme avec « annonce ».
- source_word: אָוֶן
  choice: le malheur
  rationale: Selon le contexte, le mot peut désigner le mal, la détresse ou la calamité. Ici, la menace militaire imminente favorise le sens de malheur ou de désastre sans lui donner un sens moral.
- source_word: מֵהַר אֶפְרָיִם
  choice: depuis la région montagneuse d’Éphraïm
  rationale: L’expression géographique désigne vraisemblablement le territoire montagneux d’Éphraïm plutôt qu’un sommet isolé. Cette formulation est naturelle en français et explicite la portée régionale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et prophétique. Le présent de narration conserve l’immédiateté des participes hébreux sans produire une tournure artificielle en français. Le parallélisme entre « annonce » et « proclame » est maintenu.
