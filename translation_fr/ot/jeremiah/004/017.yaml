source:
  edition: WLC
  text: כְּ/שֹׁמְרֵ֣י שָׂדַ֔י הָי֥וּ עָלֶ֖י/הָ מִ/סָּבִ֑יב כִּי אֹתִ֥/י מָרָ֖תָה נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/017.yaml
  text: Like watchmen of a field[a], they are against her all around, because she has rebelled against me, declares Yahweh.
translation:
  language: fr
  text: Comme des gardiens d’un champ[a], ils sont contre elle de tous côtés, car elle s’est révoltée contre moi — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des gardiens de la campagne » ou « comme ceux qui gardent un champ ». L’image est celle de personnes qui surveillent un champ ; elle est appliquée ici à des ennemis postés tout autour de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֹׁמְרֵי
  choice: Tels des gardiens
  rationale: Le préfixe כְּ marque la comparaison, et le participe pluriel de שׁמר désigne ceux qui surveillent ou gardent. « Gardiens » convient naturellement à l’image sans lui donner un sens militaire plus précis que l’hébreu.
- source_word: שָׂדַי
  choice: d’un champ
  rationale: שׂדה désigne ordinairement un champ. Le singulier est conservé, tout comme l’image concrète de gardiens postés autour d’un terrain cultivé.
- source_word: הָיוּ עָלֶיהָ מִסָּבִיב
  choice: ils l’encerclent
  rationale: La forme accomplie הָיוּ, dans ce discours prophétique, présente la situation avec vivacité. « Ils l’encerclent » exprime naturellement la présence hostile tout autour d’elle, sans limiter l’action au passé.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la cause du jugement. « Car » garde ici un ton digne et reste courant en français.
- source_word: אֹתִי מָרָתָה
  choice: elle s’est révoltée contre moi
  rationale: מרה exprime la rébellion ou l’insoumission envers quelqu’un. Le passé composé rend l’accompli hébreu et son résultat présent.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: La formule prophétique solennelle נְאֻם est rendue sans la réduire au simple verbe « dire », tandis que le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Référent du pronom féminin singulier עָלֶיהָ / מָרָתָה
  choice: Le pronom « elle » demeure sans référent explicité dans le verset.
  alternative: Préciser « Jérusalem », « la fille de Sion » ou « Juda ».
  rationale: L’hébreu laisse ici l’antécédent implicite. Conserver le féminin préserve la personnification et évite de trancher au-delà du texte du verset.
- issue: Valeur temporelle de הָיוּ
  choice: 'Présent français : « ils l’encerclent ».'
  alternative: « Ils étaient autour d’elle » ou « ils se sont placés contre elle ».
  rationale: Dans le discours prophétique, l’accompli peut présenter comme effective une action annoncée ou imminente. Le présent restitue la vigueur de la scène tout en laissant le contexte déterminer sa temporalité.
translation_notes:
  register: Français international moderne, naturel et digne. L’image agricole est conservée, tandis que « ils l’encerclent » rend explicitement et avec concision la disposition hostile tout autour d’elle. Le nom divin est rendu par « Yahweh » conformément à la couche de consultation fournie.
