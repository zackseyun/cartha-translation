    issue: « gagnons les villes fortifiées » est ambigu en français.
    rationale: Le verbe « gagner » avec un complément de lieu peut être compris comme « conquérir/remporter » des villes. L’hébreu appelle la population à aller vers/dans les villes fortifiées comme refuge, non à les conquérir.
