  text: הַגִּ֣ידוּ בִֽ/יהוּדָ֗ה וּ/בִ/ירוּשָׁלִַ֨ם֙ הַשְׁמִ֔יעוּ וְ/אִמְר֕וּ ו/תקעו שׁוֹפָ֖ר בָּ/אָ֑רֶץ קִרְא֤וּ מַלְאוּ֙ וְ/אִמְר֔וּ הֵאָסְפ֥וּ וְ/נָב֖וֹאָה אֶל עָרֵ֥י הַ/מִּבְצָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/005.yaml
  text: 'Declare it in Judah[a], and proclaim it in Jerusalem, and say: Blow the trumpet in the land. Cry aloud, fill the air, and say: Gather yourselves[d][c][b], and let us go into the fortified cities.'
translation:
  language: fr
  text: 'Annoncez-le en Juda, faites-le entendre à Jérusalem et dites : « Sonnez du cor dans le pays ! Criez à pleine voix[a] et dites : Rassemblez-vous, allons dans les villes fortifiées ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis et inhabituel : littéralement « Criez, remplissez ». Il peut évoquer un cri poussé de toute sa force ou l’alarme répandue partout.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Annoncez-le
  rationale: Le hifil impératif pluriel de נגד appelle une déclaration publique. Le pronom « le », absent mais implicite en hébreu, rend la tournure naturelle en français.
- source_word: בִיהוּדָה
  choice: en Juda
  rationale: La préposition ב indique ici le lieu ou la sphère où l’annonce doit être faite.
- source_word: הַשְׁמִיעוּ
  choice: faites-le entendre
  rationale: Cette traduction conserve la valeur causative du hifil de שמע et le parallélisme avec « Annoncez-le ».
- source_word: וְתִקְעוּ שׁוֹפָר
  choice: Sonnez du cor
  rationale: Le שׁוֹפָר est un cor servant notamment à donner l’alarme. « Sonner du cor » est précis, naturel et évite de l’assimiler à une trompette moderne.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire de Juda; « pays » est plus idiomatique en français que « terre ».
- source_word: קִרְאוּ מַלְאוּ
  choice: Criez à pleine voix
  rationale: La suite impérative est elliptique et difficile. מַלְאוּ, littéralement « remplissez », semble intensifier l’appel public; « à pleine voix » transmet cette force sans introduire un objet conjectural comme « l’air » ou « le pays ».
- source_word: הֵאָסְפוּ
  choice: Rassemblez-vous
  rationale: L’impératif nifal de אסף fonctionne comme un appel à se réunir; la forme pronominale française en garde la nuance réflexive.
- source_word: וְנָבוֹאָה
  choice: gagnons
  rationale: Le cohortatif à la première personne du pluriel exprime une exhortation collective. « Gagnons » rend naturellement le mouvement vers un lieu de refuge.
- source_word: אֶל עָרֵי הַמִּבְצָר
  choice: les villes fortifiées
  rationale: L’expression désigne des villes protégées par des fortifications. Avec « gagner », la destination exprimée par אֶל ne requiert pas de préposition en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La série d’impératifs et les points d’exclamation conservent l’urgence de l’alarme. « Cor » traduit concrètement le shofar, tandis que « gagnons les villes fortifiées » exprime de façon idiomatique la recherche immédiate d’un refuge.
