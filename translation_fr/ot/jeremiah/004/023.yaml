source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת הָ/אָ֔רֶץ וְ/הִנֵּה תֹ֖הוּ וָ/בֹ֑הוּ וְ/אֶל הַ/שָּׁמַ֖יִם וְ/אֵ֥ין אוֹרָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/023.yaml
  text: I looked at the earth[a], and behold, it was formless and empty; and at the heavens, and they had no light.
translation:
  language: fr
  text: 'J’ai regardé la terre[a] : elle était informe et vide ; les cieux : ils étaient sans lumière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici la formule tohu vabohu, traditionnellement rendue par « informe et vide » ou « déserte et vide » ; elle fait écho à Genèse 1.2.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: J’ai regardé
  rationale: Le qal accompli à la première personne de ראה introduit ici les tableaux successifs d’une vision. « J’ai regardé » restitue naturellement en français cette observation prophétique répétée.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner un pays ou la terre. Son association avec « les cieux » et l’écho de Genèse 1.2 favorisent ici la portée cosmique de « la terre », sans exclure l’arrière-plan historique de la dévastation du pays.
- source_word: וְהִנֵּה
  choice: ponctuation par deux-points
  rationale: Plutôt qu’un « voici » assez marqué en français courant, les deux-points donnent à voir le constat qui surgit dans la vision et conservent la force présentative de הִנֵּה.
- source_word: תֹהוּ וָבֹהוּ
  choice: informe et vide
  rationale: Cette formule claire et digne conserve l’écho direct de Genèse 1.2 et l’image d’une création ramenée au désordre et à la désolation.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Dans le parallélisme cosmique avec « la terre », « les cieux » rend mieux le pluriel hébreu et la portée du passage que le terme plus restreint « ciel ».
- source_word: וְאֵין אוֹרָם
  choice: ils n’avaient plus de lumière
  rationale: Le suffixe de אוֹרָם renvoie aux cieux. « Ils n’avaient plus de lumière » exprime naturellement leur obscurité dans ce tableau de dé-création; « plus » rend le contraste avec l’ordre créé, tout en laissant ouverte la manière dont la lumière a disparu.
theological_decisions:
- issue: Écho de Genèse 1.2 dans un oracle de jugement
  choice: Conserver l’imagerie cosmique de dé-création avec « la terre », « informe et vide », « les cieux » et l’absence de lumière.
  alternative: Lire principalement « la terre » comme « le pays » de Juda dévasté.
  rationale: La formule תֹהוּ וָבֹהוּ et le couple terre-cieux évoquent fortement Genèse 1.2. La traduction préserve cette portée littéraire et théologique sans nier que l’oracle vise aussi historiquement Juda.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise de « J’ai regardé » rend explicite le mouvement de la vision suggéré par la syntaxe hébraïque, tandis que les deux-points remplacent un « voici » potentiellement moins naturel.
