revisions:
- from: 'J’ai regardé la terre[a] : elle était informe et vide. J’ai regardé les cieux : ils n’avaient plus de lumière.'
  to: 'J’ai regardé la terre[a] : elle était informe et vide ; les cieux : ils étaient sans lumière.'
  rationale: La révision supprime l’implication non exprimée par le texte source selon laquelle la lumière aurait cessé d’être présente. Elle conserve l’imagerie de dé-création, l’écho de Genèse 1.2 et un français moderne, tout en liant les deux membres à l’unique vision du prophète.
  reviewer_model: gpt-5.6-terra
