  text: הִנֵּ֣ה כַּ/עֲנָנִ֣ים יַעֲלֶ֗ה וְ/כַ/סּוּפָה֙ מַרְכְּבוֹתָ֔י/ו קַלּ֥וּ מִ/נְּשָׁרִ֖ים סוּסָ֑י/ו א֥וֹי לָ֖/נוּ כִּ֥י שֻׁדָּֽדְנוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/013.yaml
  text: Look[a], he comes up like clouds, and his chariots are like the whirlwind; his horses are swifter than eagles. Woe to us, for we are ruined!
translation:
  language: fr
  text: Voici qu’il s’élève comme des nuages, et ses chars sont comme un tourbillon ; ses chevaux sont plus rapides que des aigles.[a] Malheur à nous, car nous sommes dévastés !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vautours » ; le mot hébreu נְשָׁרִים peut désigner plus largement de grands rapaces ou oiseaux charognards, bien que « aigles » soit ici la traduction traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Regardez !
  rationale: Cette interjection déictique attire avec urgence l’attention sur la menace qui approche ; « Regardez ! » est immédiat et naturel en français moderne.
- source_word: כַּעֲנָנִים
  choice: comme des nuages
  rationale: Le préfixe comparatif est rendu directement, et le pluriel conserve l’image d’une masse menaçante en mouvement.
- source_word: יַעֲלֶה
  choice: il monte
  rationale: Le verbe עלה signifie monter ou s’avancer vers le haut. « Il monte » préserve cette valeur directionnelle sans expliciter davantage l’identité de l’envahisseur.
- source_word: וְכַסּוּפָה
  choice: et ... comme un tourbillon
  rationale: סוּפָה désigne une violente tempête ou un tourbillon ; ce dernier terme conserve la vigueur de l’image prophétique.
- source_word: מַרְכְּבוֹתָיו
  choice: ses chars
  rationale: Traduction directe ; le contexte militaire suffit sans ajouter « de guerre ».
- source_word: קַלּוּ מִנְּשָׁרִים
  choice: sont plus rapides que des aigles
  rationale: Dans ce contexte, קלל exprime la rapidité, et מן marque la comparaison. La formulation française rend clairement le comparatif.
- source_word: נְשָׁרִים
  choice: aigles
  rationale: נשר peut désigner plusieurs grands rapaces ou oiseaux charognards. « Aigles » est la traduction traditionnelle et convient à l’image de vitesse, tandis que l’autre possibilité est signalée en note.
- source_word: סוּסָיו
  choice: ses chevaux
  rationale: Traduction directe de la forme nominale avec suffixe possessif.
- source_word: אוֹי לָנוּ
  choice: Malheur à nous
  rationale: Cette formule conserve la force d’un cri collectif de lamentation devant un désastre imminent.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison du cri de lamentation.
- source_word: שֻׁדָּדְנוּ
  choice: nous sommes dévastés
  rationale: Le passif de שׁדד évoque le fait d’être violemment ravagé ou dépouillé. « Dévastés » garde cette violence sans impliquer nécessairement une annihilation totale.
