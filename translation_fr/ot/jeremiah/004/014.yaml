source:
  edition: WLC
  text: כַּבְּסִ֨י מֵ/רָעָ֤ה לִבֵּ/ךְ֙ יְר֣וּשָׁלִַ֔ם לְמַ֖עַן תִּוָּשֵׁ֑עִי עַד מָתַ֛י תָּלִ֥ין בְּ/קִרְבֵּ֖/ךְ מַחְשְׁב֥וֹת אוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/014.yaml
  text: Wash your heart from evil[a], Jerusalem, so that you may be saved. How long will wicked thoughts lodge within you?
translation:
  language: fr
  text: Lave ton cœur du mal, Jérusalem, afin que tu sois sauvée. Jusqu’à quand des pensées mauvaises[a] séjourneront-elles en toi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes projets malfaisants ».'
    reason: 'Alternative lexicale : מַחְשְׁבוֹת peut désigner des pensées, des projets ou des desseins, et אוֹן leur attribue un caractère mauvais ou coupable.'
lexical_decisions:
- source_word: כַּבְּסִי
  choice: Lave
  rationale: Le verbe désigne concrètement l’action de laver, notamment du linge. « Lave ton cœur » conserve l’image vigoureuse de la purification intérieure sans ajouter un résultat absent de la formulation hébraïque.
- source_word: מֵרָעָה
  choice: de tout mal
  rationale: Dans cet appel à purifier le cœur, le sens moral de רָעָה convient mieux que celui de « malheur ». La préposition מִן exprime ici l’éloignement ou l’élimination; « de tout mal » est idiomatique en français.
- source_word: לִבֵּךְ
  choice: ton cœur
  rationale: Le cœur représente ici la vie intérieure, notamment la pensée et la volonté. Le maintien de « cœur » préserve l’anthropologie et la métaphore hébraïques.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: La ville est directement interpellée et personnifiée au féminin singulier, ce que reprend ensuite « sauvée ».
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution exprime clairement le but dans un registre français courant et digne.
- source_word: תִּוָּשֵׁעִי
  choice: tu sois sauvée
  rationale: Le nifal de ישׁע peut désigner le salut ou la délivrance. « Sauvée » conserve cette amplitude et s’accorde avec Jérusalem personnifiée.
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Équivalent français naturel de la formule temporelle hébraïque, avec sa force de reproche pressant.
- source_word: תָּלִין
  choice: séjourneront-elles
  rationale: Le verbe évoque le fait de loger ou de passer la nuit. « Séjourner » garde l’image de pensées installées à l’intérieur de Jérusalem tout en restant intelligible en français.
- source_word: בְּקִרְבֵּךְ
  choice: en toi
  rationale: Puisque Jérusalem est personnifiée et qu’il est question de pensées, « en toi » exprime naturellement leur présence intérieure.
- source_word: מַחְשְׁבוֹת אוֹנֵךְ
  choice: des pensées mauvaises
  rationale: מַחְשְׁבוֹת peut signifier pensées, projets ou desseins, tandis que אוֹן leur donne ici une qualification morale. La formulation principale privilégie le mouvement intérieur du contexte, sans exclure l’idée de projets, signalée en note.
theological_decisions:
- issue: Portée de תִּוָּשֵׁעִי dans le contexte prophétique
  choice: tu sois sauvée
  alternative: tu sois délivrée
  rationale: Le contexte concerne la menace du jugement et la possibilité d’y échapper par la repentance. « Sauvée » ne limite pas le propos à une délivrance seulement temporelle et ne lui impose pas non plus un sens sotériologique plus développé que celui du texte.
- issue: Nature des מַחְשְׁבוֹת אוֹנֵךְ
  choice: des pensées mauvaises
  alternative: tes projets malfaisants
  rationale: L’expression peut viser aussi bien des pensées intérieures que des projets ou desseins coupables. Le texte retient « pensées » en raison du parallèle avec le cœur, tandis que la note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier et les formes féminines rendent l’adresse à Jérusalem personnifiée. La métaphore concrète du lavage du cœur ainsi que celle de pensées qui séjournent au-dedans sont conservées.
