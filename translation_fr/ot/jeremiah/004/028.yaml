  variant: modern international French
source:
  edition: WLC
  text: עַל זֹאת֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/קָדְר֥וּ הַ/שָּׁמַ֖יִם מִ/מָּ֑עַל עַ֤ל כִּי דִבַּ֨רְתִּי֙ זַמֹּ֔תִי וְ/לֹ֥א נִחַ֖מְתִּי וְ/לֹא אָשׁ֥וּב מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/028.yaml
  text: Because of this the earth will mourn[a], and the heavens above will grow dark, because I have spoken, I have purposed, and I have not relented[c][b], nor will I turn back from it.
translation:
  language: fr
  text: À cause de cela, la terre prendra le deuil[a], et les cieux d’en haut s’assombriront, car j’ai parlé, j’ai formé mon dessein[b] ; je ne me suis pas ravisé[c] et je ne reviendrai pas sur mon dessein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le pays prendra le deuil ». Le mot hébreu peut désigner la terre entière ou un pays ; son parallèle avec « les cieux d’en haut » favorise ici « la terre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « j’ai pris ma décision », « j’ai projeté » ou « j’ai résolu d’agir ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je n’ai pas changé d’avis » ou « je n’ai pas renoncé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: À cause de cela
  rationale: Rend naturellement la valeur causale de la locution et rattache le deuil cosmique au jugement annoncé.
- source_word: תֶּאֱבַל
  choice: prendra le deuil
  rationale: Exprime de manière idiomatique la lamentation personnifiée de la terre, avec un registre digne.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le parallélisme avec « les cieux, là-haut » favorise la portée cosmique, sans exclure que le jugement vise d’abord le pays de Juda.
- source_word: וְקָדְרוּ
  choice: s’assombriront
  rationale: Traduit l’entrée dans l’obscurité ou la morosité et convient à l’imagerie cosmique.
- source_word: הַשָּׁמַיִם מִמָּעַל
  choice: les cieux, là-haut
  rationale: Conserve le registre élevé de שָׁמַיִם et rend מִמָּעַל en français naturel.
- source_word: דִבַּרְתִּי
  choice: j’ai parlé
  rationale: Préserve la solennité de la parole divine et la formulation directe de l’hébreu.
- source_word: זַמֹּתִי
  choice: j’ai formé mon dessein
  rationale: Rend une intention délibérée et arrêtée sans réduire le terme à une simple idée passagère.
- source_word: וְלֹא נִחַמְתִּי
  choice: je n’ai pas renoncé
  rationale: Dans ce contexte, נחם désigne le fait de renoncer au jugement annoncé ou de revenir sur celui-ci, non un repentir moral.
- source_word: וְלֹא אָשׁוּב מִמֶּנָּה
  choice: je ne reviendrai pas sur ma décision
  rationale: Exprime clairement l’idée de ne pas se détourner du dessein arrêté; le référent exact du suffixe féminin reste implicite dans l’hébreu.
theological_decisions:
- issue: Sens de נחם appliqué à Dieu
  choice: je n’ai pas renoncé
  alternative: je n’ai pas changé d’avis
  rationale: « Renoncé » exprime ici le maintien du jugement annoncé sans suggérer un repentir pour faute morale. Une note conserve l’autre nuance possible.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte immédiat vise Juda, mais le parallélisme entre terre et cieux donne à l’image une dimension cosmique qu’il convient de préserver.
- issue: Référent de מִמֶּנָּה
  choice: ma décision
  alternative: cela / ce dessein
  rationale: Le suffixe féminin peut renvoyer à l’action ou à la décision annoncée. « Ma décision » rend le sens en français sans préciser la nature du jugement au-delà du contexte.
translation_notes:
  register: 'Français moderne, international et soutenu sans archaïsme. Le rythme conserve la progression solennelle de l’hébreu : réaction cosmique, parole divine, dessein arrêté et absence de retour en arrière.'
