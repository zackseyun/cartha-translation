  naturalness: « La terre prendra le deuil » est une personnification française idiomatique. « Les cieux d’en haut » convient mieux au registre du passage que « les cieux, là-haut ». « Je ne me suis pas ravisé » est naturel dans ce contexte et explicite sans introduire une interprétation doctrinale.
  terminology: « Terre » est approprié, avec une note pour « pays ». « Dessein » rend bien זמם dans un registre prophétique. « Se raviser » rend ici נחם comme retrait d’une décision annoncée, sans le réduire à un repentir moral. « Revenir sur mon dessein » reflète le mouvement de שׁוב tout en gardant le référent contextuellement ouvert.
