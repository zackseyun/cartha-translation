  naturalness: '« Voilà ton mal — quelle amertume ! » est intelligible, mais « quelle amertume » ne qualifie pas explicitement le « mal » et affaiblit l’enchaînement du texte hébreu. « C’est là ton mal : qu’il est amer ! » est naturel dans un registre biblique moderne et conserve l’exclamation.'
  terminology: « Conduite », « actes », « mal » et « cœur » sont appropriés. Le tutoiement conserve l’adresse féminine singulière à Juda personnifiée sans ajouter d’identification interprétative.
