source:
  edition: WLC
  text: דַּרְכֵּ/ךְ֙ וּ/מַ֣עֲלָלַ֔יִ/ךְ עָשׂ֥וֹ אֵ֖לֶּה לָ֑/ךְ זֹ֤את רָעָתֵ/ךְ֙ כִּ֣י מָ֔ר כִּ֥י נָגַ֖ע עַד לִבֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/018.yaml
  text: Your way and your deeds have brought these things upon you. This is your evil[a]—how bitter it is! For it has reached your heart.
translation:
  language: fr
  text: 'Ta conduite et tes actes t’ont attiré tout cela. C’est là ton mal[a] : qu’il est amer ! Car il a atteint ton cœur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton malheur » ou « ton désastre ». Le mot hébreu peut désigner le mal moral ou le malheur qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵּךְ
  choice: ta conduite
  rationale: דֶּרֶךְ désigne littéralement le chemin, mais aussi, par métaphore, la manière de vivre. Dans cette association avec les actes, « ta conduite » exprime naturellement ce sens en français moderne.
- source_word: וּמַעֲלָלַיִךְ
  choice: et tes actes
  rationale: מַעֲלָלִים désigne les actes ou les agissements, avec ici une portée morale. « Tes actes » reste sobre et directement compréhensible.
- source_word: עָשׂוֹ אֵלֶּה לָךְ
  choice: t’ont attiré tout cela
  rationale: L’expression signifie littéralement que la conduite et les actes ont « fait ces choses » à Juda. « T’ont attiré tout cela » rend clairement et naturellement le rapport de cause à conséquence.
- source_word: זֹאת רָעָתֵךְ
  choice: Voilà ton mal
  rationale: רָעָה peut désigner le mal moral aussi bien que le malheur qui en résulte. Le français « ton mal » maintient cette tension sémantique sans choisir exclusivement entre faute et désastre.
- source_word: כִּי מָר
  choice: quelle amertume !
  rationale: כִּי peut introduire ici une explication ou renforcer une exclamation, et מָר signifie « amer ». La tournure exclamative restitue avec naturel l’intensité de l’hébreu.
- source_word: כִּי נָגַע עַד לִבֵּךְ
  choice: Car il a atteint ton cœur
  rationale: נגע signifie toucher ou atteindre. Avec עַד לֵב, l’image est celle d’un mal qui parvient jusqu’au plus profond de la personne; « a atteint ton cœur » conserve cette image sans l’expliciter davantage.
theological_decisions:
- issue: Sens de רָעָה dans זֹאת רָעָתֵךְ
  choice: « ton mal », afin de préserver à la fois la faute de Juda et le malheur qui en découle
  alternative: « ton malheur » ou « ton désastre »
  rationale: Le contexte affirme que la conduite de Juda a produit ce qui lui arrive. Un choix exclusivement moral ou exclusivement calamiteux réduirait la tension du terme hébreu; « mal » permet de maintenir le lien entre culpabilité et conséquence.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier féminin de l’hébreu, adressé à Juda personnifiée, est rendu sans ajouter de précision absente du verset.
