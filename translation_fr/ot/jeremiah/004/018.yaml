  rationale: Révision limitée de la seconde phrase afin de rendre explicitement la prédication « ton mal ... il est amer » et de préserver la force exclamative de כִּי מָר. La première phrase, le terme volontairement ambigu « mal », le parfait « a atteint » et la note lexicale sont maintenus.
