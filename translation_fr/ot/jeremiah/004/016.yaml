id: JER.4.16
reference: Jeremiah 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַזְכִּ֣ירוּ לַ/גּוֹיִ֗ם הִנֵּה֙ הַשְׁמִ֣יעוּ עַל יְרוּשָׁלִַ֔ם נֹצְרִ֥ים בָּאִ֖ים מֵ/אֶ֣רֶץ הַ/מֶּרְחָ֑ק וַֽ/יִּתְּנ֛וּ עַל עָרֵ֥י יְהוּדָ֖ה קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/016.yaml
  text: 'Declare it to the nations: ‘Look[a], proclaim it concerning Jerusalem: Watchers are coming from a distant land, and they raise their voice against the cities of Judah.’'
translation:
  language: fr
  text: 'Annoncez-le aux nations : « Voyez, faites-le savoir au sujet de Jérusalem : des guetteurs[a] arrivent d’un pays lointain et font retentir leur voix contre les villes de Juda. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assiégeants ». Le mot hébreu désigne littéralement des personnes qui surveillent ou montent la garde, mais, dans ce contexte, il peut évoquer des forces ennemies qui encerclent une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּירוּ
  choice: Annoncez-le
  rationale: Le hiphil impératif pluriel de זכר peut exprimer l’idée de faire mention ou de porter à la connaissance. Dans ce contexte d’alerte publique, « Annoncez-le » est naturel et conserve la force de l’ordre.
- source_word: לַגּוֹיִם
  choice: aux nations
  rationale: Le ל préfixé indique ici les destinataires de l’annonce. « Nations » rend גּוֹיִם sans connotation néotestamentaire importée.
- source_word: הִנֵּה
  choice: Voyez
  rationale: La particule attire vivement l’attention. « Voyez » garde cette fonction déictique dans un français moderne et digne.
- source_word: הַשְׁמִיעוּ עַל יְרוּשָׁלִַם
  choice: faites-le savoir au sujet de Jérusalem
  rationale: Le hiphil de שמע signifie faire entendre ou annoncer. Avec עַל, « au sujet de Jérusalem » restitue prudemment l’objet de la proclamation sans anticiper sa teneur hostile.
- source_word: נֹצְרִים
  choice: guetteurs
  rationale: Le terme issu de נצר désigne littéralement ceux qui surveillent ou montent la garde. « Guetteurs » préserve cette image, tandis que le contexte permet d’y reconnaître des forces hostiles.
- source_word: בָּאִים
  choice: arrivent
  rationale: Le participe présente leur venue comme en cours ou imminente. Le présent français « arrivent » exprime naturellement cette approche.
- source_word: מֵאֶרֶץ הַמֶּרְחָק
  choice: d’un pays lointain
  rationale: La tournure rend la provenance géographiquement éloignée et conserve le singulier collectif de l’hébreu.
- source_word: וַיִּתְּנוּ ... קוֹלָם
  choice: font retentir leur voix
  rationale: L’expression hébraïque signifie littéralement « donner leur voix », c’est-à-dire la faire entendre avec force. « Font retentir leur voix » conserve l’image et son intensité.
- source_word: עַל עָרֵי יְהוּדָה
  choice: contre les villes de Juda
  rationale: Dans ce contexte militaire, עַל prend une valeur hostile que « contre » rend clairement.
