source:
  edition: WLC
  text: הִמֹּ֣לוּ לַ/יהֹוָ֗ה וְ/הָסִ֨רוּ֙ עָרְל֣וֹת לְבַבְ/כֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/004.yaml
  text: Circumcise yourselves to Yahweh[a], and remove the foreskins of your hearts, men of Judah and inhabitants of Jerusalem, lest my wrath go out like fire and burn, with no one to quench it[b], because of the evil of your deeds.
translation:
  language: fr
  text: Circoncisez-vous pour Yahweh et ôtez les prépuces de vos cœurs[a], hommes de Juda et habitants de Jérusalem, de peur que ma fureur ne jaillisse comme un feu et ne brûle, sans que personne l’éteigne, à cause de la méchanceté de vos actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « ôtez les prépuces de vos cœurs » applique au cœur le signe de la circoncision : elle appelle à une fidélité intérieure à l’alliance et à la repentance.'
    reason: cultural_note
lexical_decisions:
- source_word: הִמֹּלוּ לַיהוָה
  choice: Faites-vous circoncire pour Yahweh
  rationale: L’impératif nifal pluriel de מול prend ici naturellement un sens réfléchi. « Pour Yahweh » exprime l’orientation et la consécration indiquées par ל sans effacer l’image concrète de la circoncision.
- source_word: וְהָסִרוּ עָרְלוֹת לְבַבְכֶם
  choice: et ôtez les prépuces de vos cœurs
  rationale: La formulation conserve l’image corporelle, volontairement saisissante, et le pluriel du texte hébreu. « Ôtez » rend le sens causatif de סור avec naturel.
- source_word: אִישׁ יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: hommes de Juda et habitants de Jérusalem
  rationale: אִישׁ a ici une portée collective ou distributive, tandis que le participe substantivé désigne les résidents de Jérusalem.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française introduit clairement la conséquence redoutée et convient au registre solennel de l’avertissement prophétique.
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: ma fureur ne jaillisse comme un feu
  rationale: חֵמָה désigne une colère intense. Avec יצא et l’image du feu, « jaillisse » est idiomatique et conserve l’idée d’une fureur qui se déchaîne.
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: et ne brûle sans que personne puisse l’éteindre
  rationale: La traduction maintient l’image du feu et rend explicitement, sans en changer le sens, l’absence de quiconque capable de l’éteindre.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיכֶם
  choice: à cause de la méchanceté de vos actes
  rationale: מִפְּנֵי exprime ici la cause; רֹעַ qualifie moralement les actes désignés par מַעַלְלִים.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le nom propre divin. « Yahweh » le distingue d’un titre et préserve sa fonction d’appellation d’alliance.
- issue: Métaphore de la circoncision du cœur
  choice: Conserver littéralement « les prépuces de vos cœurs »
  alternative: purifiez vos cœurs
  rationale: L’image applique au cœur le signe corporel de l’alliance. La paraphraser supprimerait une partie de sa force prophétique et de sa résonance théologique.
- issue: Portée de אִישׁ יְהוּדָה
  choice: hommes de Juda
  alternative: gens de Juda / peuple de Juda
  rationale: Le nom est masculin et employé collectivement; la traduction retenue préserve cette forme sans exclure la portée communautaire de l’appel.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe prophétique et l’image concrète sont conservées; « fureur » et « jaillisse » rendent naturellement l’intensité et le mouvement de l’hébreu.
