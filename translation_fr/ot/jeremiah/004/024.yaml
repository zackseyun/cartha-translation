  text: רָאִ֨יתִי֙ הֶֽ/הָרִ֔ים וְ/הִנֵּ֖ה רֹעֲשִׁ֑ים וְ/כָל הַ/גְּבָע֖וֹת הִתְקַלְקָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/024.yaml
  text: I looked at the mountains[a], and behold, they were quaking, and all the hills were shaken.
translation:
  language: fr
  text: J’ai regardé les montagnes, et voici qu’elles tremblaient, et toutes les collines vacillaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתִי
  choice: J’ai regardé
  rationale: Le qal accompli à la première personne s’inscrit dans la série de visions du passage. « J’ai regardé » rend naturellement l’acte d’observer, tandis que « j’ai vu » reste possible.
- source_word: הֶהָרִים
  choice: les montagnes
  rationale: הָרִים désigne normalement les montagnes et maintient le contraste topographique avec גְּבָעוֹת, « collines ».
- source_word: וְהִנֵּה
  choice: ':'
  rationale: Dans ce récit visionnaire, les deux-points rendent en français actuel la fonction présentative et la soudaineté de הִנֵּה sans recourir à l’archaïsme « voici » au milieu de la phrase.
- source_word: רֹעֲשִׁים
  choice: elles tremblaient
  rationale: Le participe de רעשׁ évoque une secousse, souvent de type sismique. « Tremblaient » est clair, vivant et idiomatique.
- source_word: וְכָל
  choice: et toutes
  rationale: Avec le pluriel défini, כָּל a ici un sens collectif naturellement rendu par « toutes ».
- source_word: הַגְּבָעוֹת
  choice: les collines
  rationale: גְּבָעוֹת désigne des collines, distinctes des montagnes de la proposition précédente.
- source_word: הִתְקַלְקָלוּ
  choice: vacillaient
  rationale: La forme hitpael décrit ici une forte instabilité ou un mouvement désordonné. « Vacillaient » préserve cette nuance mieux qu’une simple répétition de « tremblaient » et n’impose pas un sens passif absent de la forme hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et dignifié. Le parallélisme poétique entre montagnes et collines est conservé, avec deux verbes distincts pour rendre les nuances des deux termes hébreux.
