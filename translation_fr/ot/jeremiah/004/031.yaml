source:
  edition: WLC
  text: כִּי֩ ק֨וֹל כְּ/חוֹלָ֜ה שָׁמַ֗עְתִּי צָרָה֙ כְּ/מַבְכִּירָ֔ה ק֧וֹל בַּת צִיּ֛וֹן תִּתְיַפֵּ֖חַ תְּפָרֵ֣שׂ כַּפֶּ֑י/הָ אֽוֹי נָ֣א לִ֔/י כִּֽי עָיְפָ֥ה נַפְשִׁ֖/י לְ/הֹרְגִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/031.yaml
  text: 'For I have heard a sound like a woman in labor[a], distress like one giving birth to her first child— the sound of Daughter Zion gasping for breath, spreading out her hands: “Woe is me[c][b], for my life is faint before killers.”'
translation:
  language: fr
  text: 'Car j’entends une voix semblable à celle d’une femme en travail, une angoisse semblable à celle d’une femme qui accouche pour la première fois[a][b] : c’est la voix de la fille de Sion, qui halète et tend les mains : « Ah, malheur à moi ! Ma vie défaille[c] devant ceux qui tuent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cri » ou « un son » ; le même mot hébreu est repris dans « la voix de la fille de Sion ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu évoque une femme qui accouche pour la première fois, image de douleurs particulièrement intenses.
    reason: cultural_note
  - marker: c
    text: Le mot hébreu peut aussi se traduire par « mon âme » ou « ma personne » ; dans ce contexte de menace mortelle, il peut désigner la vie de la personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: voix
  rationale: Le terme peut désigner une voix, un cri ou un son. « Voix » convient à la première impression auditive et se reprend naturellement quand la fille de Sion est identifiée comme celle qui parle.
- source_word: כְּחוֹלָה
  choice: comme celle d’une femme en travail
  rationale: Dans cette image prophétique, le terme évoque les douleurs de l’accouchement plutôt qu’une maladie générale. La formulation française est claire et idiomatique.
- source_word: צָרָה
  choice: l’angoisse
  rationale: Le nom exprime ici la détresse aiguë liée à l’image des douleurs de l’enfantement. « Angoisse » conserve à la fois l’intensité physique et émotionnelle.
- source_word: כְּמַבְכִּירָה
  choice: d’une femme qui met au monde son premier enfant
  rationale: La forme renvoie à un premier accouchement ou à la naissance du premier-né. La traduction explicite l’image sans la surinterpréter.
- source_word: בַּת צִיּוֹן
  choice: la fille de Sion
  rationale: Cette expression prophétique personnifie Sion ou Jérusalem sous les traits d’une femme. La tournure française traditionnelle reste compréhensible et préserve la personnification.
- source_word: תִּתְיַפֵּחַ
  choice: elle halète
  rationale: Le verbe décrit une respiration pénible ou haletante. « Elle halète » est bref, concret et naturel.
- source_word: תְּפָרֵשׂ כַּפֶּיהָ
  choice: elle tend les mains
  rationale: L’expression décrit les paumes ou les mains étendues dans la détresse, l’appel ou la supplication. « Tendre les mains » restitue le geste sans en imposer une interprétation précise.
- source_word: אוֹי נָא לִי
  choice: Malheur à moi !
  rationale: Cette exclamation exprime une lamentation urgente. Le français garde sa force et sa gravité.
- source_word: עָיְפָה נַפְשִׁי
  choice: Ma vie s’épuise
  rationale: נפש peut désigner la vie, la personne ou l’âme, tandis que le verbe exprime l’épuisement ou la défaillance. Dans un contexte de menace mortelle, « ma vie » désigne concrètement la personne menacée sans introduire une distinction anthropologique étrangère au passage.
- source_word: לְהֹרְגִים
  choice: face aux meurtriers
  rationale: Le participe désigne ceux qui tuent, et la préposition situe la fille de Sion en leur présence ou à leur merci. « Face aux meurtriers » est naturel et conserve cette relation sans préciser indûment la causalité.
theological_decisions:
- issue: Personnification de Sion
  choice: la fille de Sion, présentée comme une femme qui parle et souffre
  alternative: la fille de Jérusalem ou une désignation non personnifiée de la population
  rationale: Le texte personnifie explicitement Sion. La traduction maintient cette image prophétique sans lui imposer une identification allégorique supplémentaire.
- issue: Sens de נֶפֶשׁ sous une menace de mort
  choice: ma vie
  alternative: mon âme ou tout mon être
  rationale: Dans ce contexte, נֶפֶשׁ désigne la personne vivante exposée à la mort. « Ma vie » préserve ce sens concret et évite d’importer une conception particulière de l’âme distincte du corps.
translation_notes:
  register: Français international actuel, poétique mais accessible. Le rythme progresse de l’impression auditive à l’identification de la fille de Sion, puis à sa plainte directe. Les termes « femme en travail », « halète » et « tend les mains » gardent la force corporelle de l’image sans archaïsme inutile.
