  - severity: low
    issue: « Meurtriers » peut être plus spécifique que le participe הֹרְגִים.
    rationale: Le mot désigne d’abord « ceux qui tuent ». Dans ce contexte violent, « meurtriers » est possible, mais « ceux qui tuent » préserve mieux l’absence de qualification supplémentaire.
