language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ו/אתי שָׁד֜וּד מַֽה תַּעֲשִׂ֗י כִּֽי תִלְבְּשִׁ֨י שָׁנִ֜י כִּי תַעְדִּ֣י עֲדִי זָהָ֗ב כִּֽי תִקְרְעִ֤י בַ/פּוּךְ֙ עֵינַ֔יִ/ךְ לַ/שָּׁ֖וְא תִּתְיַפִּ֑י מָאֲסוּ בָ֥/ךְ עֹגְבִ֖ים נַפְשֵׁ֥/ךְ יְבַקֵּֽשׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/030.yaml
  text: And you[a], devastated one, what will you do? Though you dress in scarlet, though you adorn yourself with ornaments of gold, though you enlarge your eyes with paint, you beautify yourself in vain. Your lovers despise you[b]; they seek your life.
translation:
  language: fr
  text: Et toi, dévastée[a], que vas-tu faire ? Tu as beau t’habiller d’écarlate, te parer de bijoux en or et agrandir tes yeux avec du fard[b], c’est en vain que tu te fais belle. Tes amants te méprisent ; ils cherchent à te tuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pillée » ou « détruite ». L’hébreu s’adresse à une figure féminine singulière, vraisemblablement Jérusalem ou Sion personnifiée.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « déchirer tes yeux avec du poukh ». Le poukh était un fard sombre pour les yeux, souvent appelé khôl et parfois identifié à l’antimoine.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁדוּד
  choice: femme dévastée
  rationale: Le participe passif, au féminin singulier, qualifie directement la figure féminine interpellée. « Femme dévastée » rend à la fois le genre grammatical et l’état de ruine sans préciser indûment qu’il s’agit de pillage seulement.
- source_word: מַה תַּעֲשִׂי
  choice: que vas-tu faire ?
  rationale: L’imparfait 2e personne féminin singulier prend ici une valeur future dans une question rhétorique liée à la crise imminente.
- source_word: שָׁנִי
  choice: écarlate
  rationale: Équivalent français usuel et précis de la couleur ou de l’étoffe teinte désignée par שָׁנִי.
- source_word: תַעְדִּי עֲדִי זָהָב
  choice: te parer de bijoux en or
  rationale: Cette formulation française naturelle conserve le verbe réfléchi d’ornementation et le nom désignant les parures.
- source_word: תִקְרְעִי בַפּוּךְ עֵינַיִךְ
  choice: agrandir tes yeux avec du fard
  rationale: Littéralement, l’expression évoque le fait de « déchirer » ou d’ouvrir largement les yeux au moyen du poukh. Le français idiomatique exprime ici l’effet cosmétique recherché sans donner une image physique trompeuse.
- source_word: פּוּךְ
  choice: fard
  rationale: Terme courant et accessible pour le cosmétique sombre appliqué autour des yeux ; la note donne les précisions culturelles et lexicales.
- source_word: לַשָּׁוְא תִּתְיַפִּי
  choice: c’est en vain que tu te fais belle
  rationale: Rend clairement la futilité de l’embellissement tout en conservant la valeur réfléchie du verbe.
- source_word: מָאֲסוּ בָךְ עֹגְבִים
  choice: Tes amants te méprisent
  rationale: « Amants » maintient la métaphore relationnelle, notamment celle des alliances infidèles dans le contexte prophétique, tandis que « méprisent » rend la force de מאס.
- source_word: נַפְשֵׁךְ יְבַקֵּשׁוּ
  choice: ils cherchent à te tuer
  rationale: L’expression hébraïque « chercher la vie de quelqu’un » signifie chercher à lui ôter la vie. La traduction explicite ce sens en français naturel.
theological_decisions:
- issue: Personnification prophétique de Jérusalem/Sion au féminin singulier
  choice: Conserver explicitement l’adresse féminine par « femme dévastée », sans ajouter le nom de Jérusalem ou de Sion.
  alternative: Ajouter « Jérusalem » ou « fille de Sion », ou laisser le genre implicite avec seulement « toi qui es dévastée ».
  rationale: La morphologie hébraïque impose une destinataire féminine singulière, mais le verset ne la nomme pas. Cette solution préserve la personnification sans introduire une identification explicite absente du texte.
- issue: Portée de נַפְשֵׁךְ יְבַקֵּשׁוּ
  choice: Rendre l’idiome par « ils cherchent à te tuer ».
  alternative: Traduire formellement « ils en veulent à ta vie » ou « ils cherchent ta vie ».
  rationale: Le sens contextuel est une intention homicide, non une recherche abstraite de l’âme. La formulation choisie est nette sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, courant et digne. La répétition hébraïque de כִּי est rendue idiomatiquement par « tu as beau… » avec une série coordonnée, ce qui conserve la valeur concessive et prépare naturellement « c’est en vain ». Le tutoiement maintient l’adresse prophétique directe.
