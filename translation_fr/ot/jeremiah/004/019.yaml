  text: מֵעַ֣/י מֵעַ֨/י אחולה קִיר֥וֹת לִבִּ֛/י הֹֽמֶה לִּ֥/י לִבִּ֖/י לֹ֣א אַחֲרִ֑ישׁ כִּ֣י ק֤וֹל שׁוֹפָר֙ שמעתי נַפְשִׁ֔/י תְּרוּעַ֖ת מִלְחָמָֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/019.yaml
  text: My inward parts[a], my inward parts! I writhe in pain! O walls of my heart! My heart pounds within me; I cannot keep silent, for you, my soul, have heard the sound of the trumpet[c][b], the battle cry.
translation:
  language: fr
  text: Mes entrailles, mes entrailles ! Je me tords de douleur ! Ô parois de mon cœur ! Mon cœur s’agite en moi ; je ne peux rester silencieux, car tu as entendu, ô mon âme, le son du cor, le cri de guerre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « car mon âme a entendu ». L’expression traduite par « cri de guerre » peut également désigner le signal d’alarme de guerre ou la clameur du combat.'
    reason: ambiguïté syntaxique et alternatives lexicales
lexical_decisions:
- source_word: מֵעַי
  choice: mes entrailles
  rationale: Le terme désigne littéralement les organes internes et, dans la poésie, le siège d’une profonde détresse. « Mes entrailles » conserve en français l’image viscérale et sa répétition expressive.
- source_word: אחולה
  choice: je me tords de douleur
  rationale: La forme issue de חול/חיל évoque les contorsions causées par la douleur, voire celles de l’enfantement ; cette formulation rend à la fois la souffrance physique et l’angoisse.
- source_word: קִירוֹת לִבִּי
  choice: parois de mon cœur
  rationale: קִירוֹת signifie littéralement « murs, parois ». « Parois de mon cœur » préserve la métaphore corporelle inhabituelle sans l’aplanir en « profondeurs » ou « chambres ».
- source_word: הֹמֶה לִּי לִבִּי
  choice: mon cœur s’agite en moi
  rationale: המה exprime le tumulte, le grondement ou l’agitation. « S’agite en moi » maintient cette amplitude sémantique sans réduire nécessairement l’image à des battements cardiaques.
- source_word: לֹא אַחֲרִישׁ
  choice: je ne peux pas garder le silence
  rationale: Dans ce cri de détresse motivé par ce qui a été entendu, la formulation exprime naturellement l’impossibilité ressentie de rester silencieux.
- source_word: קוֹל שׁוֹפָר
  choice: le son du cor
  rationale: Le שׁוֹפָר est un cor, traditionnellement fait d’une corne de bélier. « Le son du cor » rend explicitement קוֹל et évite de l’assimiler à une trompette moderne.
- source_word: שמעתי נַפְשִׁי
  choice: tu as entendu, ô mon âme
  rationale: L’ordre des mots permet de comprendre נַפְשִׁי comme une adresse à soi-même. La traduction conserve cette brusque apostrophe tout en restant idiomatique en français.
- source_word: תְּרוּעַת מִלְחָמָה
  choice: le cri de guerre
  rationale: תְּרוּעָה peut désigner un cri, une sonnerie ou un signal d’alarme. Avec « guerre », « cri de guerre » est concis et vivant, tandis que la note signale les autres nuances possibles.
theological_decisions:
- issue: Valeur syntaxique de נַפְשִׁי
  choice: 'apostrophe intérieure : « tu as entendu, ô mon âme »'
  alternative: 'sujet emphatique : « mon âme a entendu »'
  rationale: L’hébreu permet les deux lectures. Le texte principal retient l’adresse à soi-même, qui préserve la rupture émotionnelle, et la note maintient explicitement l’autre analyse.
translation_notes:
  register: Français international moderne, poétique et digne. La ponctuation brève conserve l’intensité haletante de l’hébreu. Les métaphores corporelles sont maintenues, et « cor » précise la nature du שׁוֹפָר sans alourdir le verset.
