id: JER.4.20
reference: Jeremiah 4:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שֶׁ֤בֶר עַל שֶׁ֨בֶר֙ נִקְרָ֔א כִּ֥י שֻׁדְּדָ֖ה כָּל הָ/אָ֑רֶץ פִּתְאֹם֙ שֻׁדְּד֣וּ אֹהָלַ֔/י רֶ֖גַע יְרִיעֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/020.yaml
  text: Disaster upon disaster is proclaimed[a], for the whole land is devastated. Suddenly my tents are devastated[b], my curtains in a moment.
translation:
  language: fr
  text: Désastre sur désastre est annoncé, car tout le pays[a] est dévasté. Soudain, mes tentes sont dévastées ; en un instant, mes tentures[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la terre ». Le mot hébreu אֶרֶץ peut désigner soit un pays, soit la terre ; ici, le contexte favorise le pays frappé par le jugement.
    reason: alternative_reading
  - marker: b
    text: Les « tentures » sont les pièces d’étoffe qui forment ou couvrent une tente ; l’image est celle d’une habitation soudainement détruite.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר עַל שֶׁבֶר
  choice: Désastre sur désastre
  rationale: L’expression répétée évoque des calamités qui s’accumulent. « Désastre sur désastre » conserve la structure et l’intensité poétiques de l’hébreu sans suggérer une simple cassure matérielle.
- source_word: נִקְרָא
  choice: est annoncé
  rationale: Le nifal de קרא exprime ici une annonce ou un cri rendu public. La tournure passive maintient la forme du texte source tout en restant naturelle en français.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’annonce du désastre et relie clairement les deux propositions.
- source_word: שֻׁדְּדָה / שֻׁדְּדוּ
  choice: est dévasté / sont dévastées
  rationale: Le verbe שׁדד peut évoquer le pillage ou la mise à sac, mais le contexte insiste sur le résultat destructeur. La répétition de « dévasté » reproduit le lien lexical entre le pays et les tentes.
- source_word: כָּל הָאָרֶץ
  choice: tout le pays
  rationale: אֶרֶץ peut désigner la terre entière ou un pays. Dans le contexte immédiat du jugement visant Juda et Jérusalem, « tout le pays » est le sens le plus probable.
- source_word: פִּתְאֹם
  choice: Soudain
  rationale: Cet adverbe souligne le caractère abrupt de la dévastation.
- source_word: אֹהָלַי
  choice: mes tentes
  rationale: La traduction littérale conserve l’image d’une habitation renversée sans décider si elle doit aussi être comprise métaphoriquement.
- source_word: רֶגַע
  choice: en un instant
  rationale: Le nom employé comme indication de temps exprime ici l’extrême rapidité de l’événement.
- source_word: יְרִיעֹתַי
  choice: mes tentures
  rationale: Le terme désigne les pièces d’étoffe formant ou couvrant une tente. « Tentures » préserve l’image concrète, explicitée en note.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: tout le pays
  alternative: toute la terre
  rationale: Le contexte de Jérémie 4 favorise le pays de Juda comme référent immédiat, mais le mot hébreu autorise aussi « terre » ; cette ambiguïté est signalée en note.
- issue: Identité du locuteur dans « mes tentes »
  choice: Ne pas l’expliciter
  alternative: Identifier explicitement le locuteur à Jérusalem, au peuple ou au prophète
  rationale: Le verset ne nomme pas directement le locuteur. Conserver la première personne sans ajout préserve l’ambiguïté poétique et théologique.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe poétique proche de l’hébreu. La phrase nominale finale (« mes tentures ! ») conserve l’ellipse du texte source, où le verbe précédent reste sous-entendu.
