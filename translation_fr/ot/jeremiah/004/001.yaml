source:
  edition: WLC
  text: אִם תָּשׁ֨וּב יִשְׂרָאֵ֧ל נְאֻם יְהוָ֛ה אֵלַ֖/י תָּשׁ֑וּב וְ/אִם תָּסִ֧יר שִׁקּוּצֶ֛י/ךָ מִ/פָּנַ֖/י וְ/לֹ֥א תָנֽוּד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/001.yaml
  text: If you return[a], O Israel, declares Yahweh, to me you should return; if you remove your detestable things from before me and do not wander about[c][b],
translation:
  language: fr
  text: « Si tu reviens, Israël — déclaration de Yahvé —, reviens à moi[a] ; si tu éloignes de devant moi tes objets abominables[b] et que tu ne vagabondes pas[c], »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Si tu reviens, Israël — déclaration de Yahvé —, tu reviendras à moi. » Le second verbe hébreu peut être compris comme une exhortation ou comme l’annonce du résultat du retour.'
    reason: alternative_reading
  - marker: b
    text: 'L’expression désigne souvent des objets cultuels répugnants, en particulier des idoles ; on pourrait aussi traduire : « tes abominations » ou, plus explicitement, « tes idoles ».'
    reason: lexical_alternative
  - marker: c
    text: 'Autres traductions possibles : « et que tu ne chancelles pas » ou « et que tu ne t’égares pas ». Le verbe hébreu peut évoquer l’errance aussi bien que l’instabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תָּשׁוּב
  choice: Si tu reviens
  rationale: La proposition conditionnelle et le sens large de שוב, « revenir, retourner », sont conservés sans réduire l’appel à une repentance uniquement intérieure.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: La position du nom indique une apostrophe directe. En français moderne, le nom seul exprime naturellement le vocatif, sans ajouter « ô ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: Cette formulation solennelle rend la formule prophétique נְאֻם et conserve le nom divin יהוה sous la forme française « Yahvé ».
- source_word: אֵלַי תָּשׁוּב
  choice: reviens à moi
  rationale: L’impératif français restitue naturellement la portée exhortative probable du second verbe tout en conservant la répétition de « revenir ».
- source_word: תָּסִיר
  choice: tu éloignes
  rationale: Le hifil exprime ici l’action d’écarter ou d’enlever. « Éloigner de devant moi » reste naturel tout en préservant l’image spatiale.
- source_word: שִׁקּוּצֶיךָ
  choice: tes objets abominables
  rationale: Le terme exprime une profonde répulsion et désigne souvent des objets idolâtriques. « Objets abominables » garde cette valeur sans expliciter d’emblée « idoles ».
- source_word: מִפָּנַי
  choice: de devant moi
  rationale: Cette traduction conserve l’image hébraïque de ce qui se trouve devant la face ou dans la présence de Dieu.
- source_word: וְלֹא תָנוּד
  choice: et que tu cesses d’errer
  rationale: Le verbe נוד peut évoquer l’errance, le déplacement instable ou l’hésitation. Cette formulation convient à l’appel au retour sans préciser excessivement la métaphore.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente en français moderne le nom propre divin plutôt que de le remplacer par un titre.
- issue: Valeur du second תָּשׁוּב
  choice: 'exhortation : « reviens à moi »'
  alternative: 'conséquence ou promesse : « tu reviendras à moi »'
  rationale: La répétition crée un appel rhétorique au véritable retour vers Dieu. L’hébreu non vocalement distinctif permet toutefois une lecture à valeur future ou résultative, signalée en note.
- issue: Référence de שִׁקּוּצֶיךָ
  choice: 'terme large : « objets abominables »'
  alternative: 'interprétation contextuelle : « idoles »'
  rationale: Le contexte cultuel rend les idoles très probables, mais le choix principal ne réduit pas le champ du terme hébreu.
translation_notes:
  register: Français international moderne, sobre et prophétique. Le tutoiement correspond à l’adresse au peuple d’Israël envisagé comme un interlocuteur singulier. Les tirets isolent la formule d’oracle sans alourdir la phrase. La virgule finale signale que la construction se poursuit au verset suivant.
