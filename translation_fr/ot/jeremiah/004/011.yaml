  text: בָּ/עֵ֣ת הַ/הִ֗יא יֵאָמֵ֤ר לָֽ/עָם הַ/זֶּה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם ר֣וּחַ צַ֤ח שְׁפָיִים֙ בַּ/מִּדְבָּ֔ר דֶּ֖רֶךְ בַּת עַמִּ֑/י ל֥וֹא לִ/זְר֖וֹת וְ/ל֥וֹא לְ/הָבַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/011.yaml
  text: 'At that time it will be said to this people and to Jerusalem: “A scorching wind from the bare heights in the wilderness comes toward the daughter of my people—not for winnowing and not for cleansing.”'
translation:
  language: fr
  text: 'En ce temps-là, on dira à ce peuple et à Jérusalem : « Un vent brûlant vient des hauteurs dénudées du désert vers la fille de mon peuple, non pour vanner ni pour purifier.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nettoyer » ; l’expression évoque le nettoyage du grain après le vannage.'
    reason: Indique la nuance agricole possible de לְהָבַר sans modifier l'ambiguïté ni anticiper le développement du jugement au verset suivant.
lexical_decisions:
- source_word: רוּחַ צַח
  choice: un vent brûlant
  rationale: צַח évoque ici un vent desséchant, ardent ou violent; « brûlant » rend naturellement son effet dans le contexte du jugement.
- source_word: שְׁפָיִים
  choice: les hauteurs dénudées
  rationale: Le terme désigne des hauteurs ou collines exposées, sans végétation; cette formulation conserve le relief et l'aridité de l'image.
- source_word: דֶּרֶךְ בַּת עַמִּי
  choice: vers la fille de mon peuple
  rationale: דֶּרֶךְ exprime ici la direction, « vers »; « la fille de mon peuple » préserve la personnification hébraïque.
- source_word: לִזְרוֹת
  choice: vanner
  rationale: Le verbe renvoie au vannage du grain par le vent, image agricole précise et intelligible.
- source_word: לְהָבַר
  choice: nettoyer
  rationale: Le sens contextuel est celui de purifier ou nettoyer le grain après le vannage; « nettoyer » conserve l'image agricole sans surinterprétation théologique.
theological_decisions:
- issue: Fonction du vent annoncé
  choice: non pour vanner, ni pour nettoyer
  alternative: non pour purifier, mais pour détruire
  rationale: Le texte nie deux usages agricoles normaux du vent sans énoncer encore explicitement la destruction; la traduction préserve cette tension au lieu d'expliciter prématurément le jugement.
translation_notes:
  register: Français moderne, digne et accessible. La structure d'annonce prophétique et la personnification « fille de mon peuple » sont conservées; la ponctuation allège légèrement la coordination hébraïque.
