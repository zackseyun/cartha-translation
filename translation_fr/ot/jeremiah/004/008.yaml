  to: À cause de cela, revêtez-vous de vêtements de deuil en toile de sac[a] ; lamentez-vous et poussez des cris de douleur, car l’ardente colère[b] de Yahweh ne s’est pas détournée de nous.
  rationale: La révision clarifie le référent culturel de שַׂקִּים (« vêtements de deuil en toile de sac ») et rend סִפְדוּ par un impératif de lamentation plus direct. Elle conserve la causalité, la succession des impératifs, l’image de la colère brûlante, le nom Yahweh et l’inclusion de « nous ».
