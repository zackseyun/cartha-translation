review_pass:
  verdict: revise
  source_fidelity: Le sens causal, les impératifs de deuil, l’image de la colère ardente et le suffixe « de nous » sont correctement rendus. Toutefois, « sacs » seul est ambigu en français et ne désigne pas clairement le vêtement de deuil que signifie שַׂקִּים dans ce contexte. « Des vêtements de deuil en toile de sac » explicite justement cette réalité sans supprimer l’image. « Lamentez-vous » rend plus directement סִפְדוּ que l’expression idiomatique « prenez le deuil ».
  naturalness: La phrase est globalement fluide. « Revêtez-vous de sacs » est toutefois peu naturel et peut évoquer des sacs ordinaires. « Prenez le deuil » est compréhensible, mais moins immédiatement approprié comme impératif de lamentation que « lamentez-vous ». La coordination « lamentez-vous et poussez des cris » préserve bien l’intensification des deux verbes.
  terminology: « Yahweh » respecte la décision de rendre le tétragramme comme nom propre. « Ardente colère » est fidèle à חֲרוֹן אַף et idiomatique dans un registre biblique moderne. La note doit correspondre à la formulation révisée et l’ancre a doit rester placée sur l’expression concernée.
  issues:
  - severity: medium
    issue: « revêtez-vous de sacs »
    rationale: En français moderne, « sacs » peut désigner des contenants plutôt que le tissu ou le vêtement rituel de deuil. Le contexte de שַׂקִּים appelle une formulation qui identifie clairement les vêtements de toile de sac.
  - severity: low
    issue: « prenez le deuil »
    rationale: Cette expression peut désigner l’adoption d’un état de deuil, mais סִפְדוּ commande plus directement la lamentation. « Lamentez-vous » est plus précis et conserve le parallélisme avec le cri de douleur.
