source:
  edition: WLC
  text: עַל זֹ֛את חִגְר֥וּ שַׂקִּ֖ים סִפְד֣וּ וְ/הֵילִ֑ילוּ כִּ֥י לֹא שָׁ֛ב חֲר֥וֹן אַף יְהֹוָ֖ה מִמֶּֽ/נּוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/008.yaml
  text: Because of this[a], put on sackcloth; mourn and wail[b], for the burning anger of Yahweh has not turned away from us.
translation:
  language: fr
  text: À cause de cela, revêtez-vous de vêtements de deuil en toile de sac[a] ; lamentez-vous et poussez des cris de douleur, car l’ardente colère[b] de Yahweh ne s’est pas détournée de nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceignez-vous de sacs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la violente colère ». L’hébreu évoque littéralement une colère brûlante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: À cause de cela
  rationale: Cette expression introduit la raison des impératifs qui suivent et conserve naturellement la valeur causale de l’hébreu.
- source_word: חִגְרוּ שַׂקִּים
  choice: revêtez-vous de sacs
  rationale: Le verbe signifie littéralement « ceindre, attacher autour de soi » ; dans ce contexte, il s’agit de porter des sacs comme vêtements de deuil. La formulation retenue reste claire tout en préservant l’image biblique.
- source_word: סִפְדוּ
  choice: prenez le deuil
  rationale: Le verbe désigne la lamentation liée au deuil. « Prenez le deuil » exprime ici l’action de se livrer aux rites et aux manifestations du deuil.
- source_word: וְהֵילִילוּ
  choice: et poussez des cris de douleur
  rationale: Le verbe évoque des lamentations fortes et audibles. Cette expression est naturelle en français moderne et distingue ce cri du verbe précédent.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif des ordres précédents ; « car » marque clairement ce rapport explicatif.
- source_word: לֹא שָׁב
  choice: ne s’est pas détournée
  rationale: Cette traduction conserve l’image de שׁוב, « revenir, se détourner », ainsi que l’accompli hébreu, sans l’interpréter simplement comme un apaisement.
- source_word: חֲרוֹן אַף
  choice: l’ardente colère
  rationale: L’expression hébraïque décrit une colère qui brûle. « Ardente colère » préserve cette métaphore de la chaleur dans un registre digne et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: מִמֶּנּוּ
  choice: de nous
  rationale: Le suffixe hébreu est à la première personne du pluriel ; le prophète s’inclut avec le peuple exposé au jugement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; la traduction conserve donc le nom divin au lieu de lui substituer un titre.
- issue: Sujet implicite de לֹא שָׁב
  choice: La colère ne s’est pas détournée
  alternative: Yahweh n’est pas revenu de son ardente colère
  rationale: L’ordre des mots fait naturellement de « l’ardente colère de Yahweh » le sujet de שָׁב. Cette lecture préserve aussi la personnification de la colère sans expliciter davantage que l’hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme des trois impératifs et la métaphore de la colère ardente sont conservés ; la ponctuation rend clairement la progression de l’appel au deuil vers sa cause.
