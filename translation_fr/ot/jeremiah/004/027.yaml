  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה שְׁמָמָ֥ה תִהְיֶ֖ה כָּל הָ/אָ֑רֶץ וְ/כָלָ֖ה לֹ֥א אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/027.yaml
  text: 'For thus says Yahweh: The whole land will be a desolation[b][a], yet I will not make a full end.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh : « Tout le pays[a] sera dévasté, mais je ne le détruirai pas entièrement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Toute la terre ». Le mot hébreu peut désigner un pays ou la terre ; ici, le contexte du jugement contre Juda favorise « pays », même si les images environnantes ont une portée plus vaste.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « je ne ferai pas une destruction totale ». Le texte maintient la tension entre une dévastation terrible et l’absence d’un anéantissement total.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication divine de la vision précédente et conserve le lien logique avec le contexte.
- source_word: כֹה אָמַר
  choice: voici ce que dit
  rationale: Formulation prophétique naturelle en français moderne, tout en gardant la solennité de la formule de messager.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: שְׁמָמָה תִהְיֶה
  choice: deviendra un lieu dévasté
  rationale: Exprime l’état futur de ruine et la transition annoncée, dans un français idiomatique.
- source_word: כָּל הָאָרֶץ
  choice: Tout le pays
  rationale: Le contexte immédiat vise le territoire de Juda, bien que אֶרֶץ puisse aussi désigner la terre au sens plus large.
- source_word: וְכָלָה לֹא אֶעֱשֶׂה
  choice: mais je ne le détruirai pas entièrement
  rationale: Rend clairement l’idée d’une dévastation sévère sans anéantissement total, sans calquer l’expression hébraïque de manière obscure.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: pays
  alternative: terre entière / terre
  rationale: Le jugement concerne immédiatement Juda et son territoire. Une note conserve toutefois la portée potentiellement plus vaste du terme et les résonances cosmiques du contexte.
- issue: Sens de וְכָלָה לֹא אֶעֱשֶׂה
  choice: je ne le détruirai pas entièrement
  alternative: je ne mettrai pas une fin complète
  rationale: La formulation française maintient la tension entre un jugement dévastateur et le refus d’un anéantissement absolu.
translation_notes:
  register: Français international moderne, digne et accessible. Les guillemets signalent la parole divine après la formule prophétique. « Lieu dévasté » évite le tour peu naturel « une désolation », tandis que « pas entièrement » communique clairement la réserve divine.
