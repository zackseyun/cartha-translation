source:
  edition: WLC
  text: רָאִ֕יתִי וְ/הִנֵּ֖ה אֵ֣ין הָ/אָדָ֑ם וְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם נָדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/025.yaml
  text: I looked[a], and behold, there was no man, and all the birds of the heavens had fled.
translation:
  language: fr
  text: 'Je regardai : voici, il n’y avait aucun être humain, et tous les oiseaux du ciel s’étaient enfuis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתִי
  choice: Je regardai
  rationale: Le qal accompli à la première personne s’inscrit dans la formule visionnaire répétée du contexte. « Je regardai » exprime l’observation successive du prophète, tout en gardant un registre narratif digne.
- source_word: וְהִנֵּה
  choice: voici
  rationale: הִנֵּה attire vivement l’attention sur la scène constatée. Après les deux-points, « voici » restitue naturellement cette fonction en français.
- source_word: אֵין הָאָדָם
  choice: il n’y avait plus aucun être humain
  rationale: אֵין exprime l’absence, tandis que הָאָדָם est ici un singulier générique désignant l’humanité présente dans le paysage. « Aucun être humain » est précis et idiomatique ; « plus » rend l’état de disparition suggéré par la scène de dévastation sans attribuer au terme une restriction masculine.
- source_word: וְכָל עוֹף הַשָּׁמַיִם
  choice: et tous les oiseaux du ciel
  rationale: עוֹף désigne ici collectivement les oiseaux, et שָׁמַיִם, dans cette expression, correspond naturellement au « ciel » visible en français moderne.
- source_word: נָדָדוּ
  choice: s’étaient enfuis
  rationale: Le verbe נדד évoque l’éloignement ou la fuite. Le plus-que-parfait marque naturellement que leur départ précède le constat du prophète.
theological_decisions:
- issue: Sens générique de הָאָדָם
  choice: aucun être humain
  alternative: personne / aucun homme
  rationale: Avec l’article et dans cette description de désolation, אָדָם représente l’être humain en général, non un homme particulier ni exclusivement les personnes de sexe masculin. « Être humain » conserve cette portée collective sans réduire le sens.
translation_notes:
  register: Français international moderne, naturel et solennel. Le passé simple convient à la série de visions prophétiques ; les deux-points rendent l’effet présentatif de וְהִנֵּה sans recourir au plus archaïque « et voici ». Aucun appel de note n’est nécessaire.
