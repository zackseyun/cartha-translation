source:
  edition: WLC
  text: רָאִ֕יתִי וְ/הִנֵּ֥ה הַ/כַּרְמֶ֖ל הַ/מִּדְבָּ֑ר וְ/כָל עָרָ֗י/ו נִתְּצוּ֙ מִ/פְּנֵ֣י יְהוָ֔ה מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/026.yaml
  text: I looked[a], and behold, the fruitful land was a wilderness, and all its cities were torn down before Yahweh[b], before his fierce anger.
translation:
  language: fr
  text: 'Je regardai, et voici : la terre fertile[a] était un désert, et toutes ses villes étaient démolies devant Yahweh[b], devant son ardente colère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le Carmel ». Le terme désigne probablement ici, de manière générale, une terre fertile ou cultivée plutôt que la région particulière du mont Carmel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à cause de Yahweh, à cause de son ardente colère ». L’hébreu répète littéralement une expression signifiant « de devant la face de ».'
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: Je regardai
  rationale: Dans cette série de visions prophétiques, ראה présente ce que le prophète observe. « Je regardai » conserve la formule à la première personne et le mouvement de la vision.
- source_word: וְהִנֵּה
  choice: et voici
  rationale: הִנֵּה attire brusquement l’attention sur la scène perçue. « Et voici » en garde la vivacité dans un registre biblique encore compréhensible aujourd’hui.
- source_word: הַכַּרְמֶל
  choice: la terre fertile
  rationale: כַּרְמֶל peut désigner le Carmel ou, comme nom commun, une terre fertile et cultivée. Le contraste direct avec הַמִּדְבָּר favorise ici le sens commun, sans effacer l’autre possibilité.
- source_word: הַמִּדְבָּר
  choice: un lieu désert
  rationale: מִדְבָּר désigne une région inculte ou désolée, et non nécessairement un désert de sable. « Un lieu désert » rend naturellement cet état de dévastation.
- source_word: וְכָל עָרָיו
  choice: et toutes ses villes
  rationale: Le suffixe masculin singulier renvoie vraisemblablement au territoire évoqué par הַכַּרְמֶל. En français, « ses villes » maintient ce lien sans personnification forcée.
- source_word: נִתְּצוּ
  choice: avaient été démolies
  rationale: Le nifal de נתץ exprime la destruction ou la démolition de constructions. Le plus-que-parfait présente naturellement en français l’état résultant constaté dans la vision.
- source_word: מִפְּנֵי יְהוָה
  choice: devant Yahweh
  rationale: מִפְּנֵי signifie littéralement « de devant la face de » et peut aussi marquer la cause. « Devant Yahweh » préserve l’image hébraïque, tandis qu’une note signale le sens causal possible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la forme française « Yahweh », qui conserve le nom divin plutôt que de le remplacer par un titre.
- source_word: מִפְּנֵי חֲרוֹן אַפּוֹ
  choice: devant son ardente colère
  rationale: L’expression חֲרוֹן אַף évoque une colère brûlante. « Ardente colère » restitue cette intensité et conserve la répétition de מִפְּנֵי par « devant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. Employer « Yahweh » préserve le nom propre et évite de lui substituer silencieusement un titre.
- issue: Valeur de מִפְּנֵי dans la scène de jugement
  choice: devant
  alternative: à cause de
  rationale: La traduction principale garde l’image de la présence ou de la face divine ainsi que la répétition hébraïque; la note conserve l’interprétation causale, plausible dans ce contexte de jugement.
translation_notes:
  register: Français international moderne, digne et lisible. « Je regardai » et « et voici » maintiennent le rythme de la vision prophétique sans archaïsmes plus lourds. La répétition « devant… devant… » reproduit la structure insistante de l’hébreu.
