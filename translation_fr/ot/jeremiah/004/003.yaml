  text: כִּי כֹ֣ה אָמַ֣ר יְהֹוָ֗ה לְ/אִ֤ישׁ יְהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/אַֽל תִּזְרְע֖וּ אֶל קוֹצִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/003.yaml
  text: 'For thus says Yahweh to the men of Judah and to Jerusalem: Break up for yourselves unplowed ground[a], and do not sow among thorns.'
translation:
  language: fr
  text: 'Car ainsi parle le SEIGNEUR aux hommes de Juda et à Jérusalem : « Labourez-vous une terre en friche[a], et ne semez pas parmi les épines. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un champ nouveau ». L’hébreu désigne une terre en jachère ou non encore labourée, qui doit être préparée avant les semailles.
    reason: Alternative lexicale et précision de l’image agricole.
lexical_decisions:
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme par la convention française courante en capitales, respectueuse de la tradition de lecture juive et immédiatement compréhensible.
- source_word: לְאִישׁ יְהוּדָה
  choice: aux hommes de Juda
  rationale: Le singulier אִישׁ a ici une valeur collective. « Aux hommes de Juda » conserve sa forme masculine et collective sans transformer explicitement Juda en « peuple ».
- source_word: וְלִירוּשָׁלִַם
  choice: et à Jérusalem
  rationale: Conserve la désignation directe de la ville et laisse intacte la métonymie visant ses habitants.
- source_word: נִירוּ לָכֶם נִיר
  choice: Défrichez-vous un terrain neuf
  rationale: « Défricher » exprime naturellement l'action de préparer une terre encore inculte; la construction pronominale rend la nuance de לָכֶם. « Terrain neuf » évoque une terre à ouvrir avant les semailles.
- source_word: וְאַל תִּזְרְעוּ
  choice: et ne semez pas
  rationale: « Semer » correspond précisément au geste agricole exprimé par זרע et maintient l'impératif négatif.
- source_word: אֶל קוֹצִים
  choice: parmi les épines
  rationale: Dans ce contexte agricole, אֶל désigne l'espace où tomberait la semence; « parmi » est idiomatique et préserve l'image des épines.
theological_decisions:
- issue: Portée métaphorique des ordres agricoles
  choice: Conserver directement l'image agricole sans expliciter la repentance dans le texte principal.
  alternative: Paraphraser en mentionnant la préparation du cœur ou l'abandon du péché.
  rationale: L'hébreu énonce l'image et non son interprétation. La conserver évite de résoudre dans la traduction sa portée spirituelle implicite.
translation_notes:
  register: Français international moderne, digne et direct. La tournure « Défrichez-vous » conserve la valeur bénéficiaire ou réflexive de לָכֶם, tandis que la note explicite l’autre formulation naturelle de נִיר.
