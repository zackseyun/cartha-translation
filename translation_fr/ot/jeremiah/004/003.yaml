    issue: « terrain neuf » pour נִיר
    rationale: Cette expression est compréhensible, mais elle peut évoquer un terrain nouvellement acquis ou créé. Le terme hébreu vise le sol en jachère ou qui doit être labouré avant les semailles. Une formulation explicite sur la friche conserve mieux l’image agricole.
  - severity: low
    issue: Incohérence entre le texte principal et la note
    rationale: La note propose « une terre en friche » comme alternative, alors que cette expression est plus directement fidèle au sens de נִיר que « terrain neuf ». Après correction du texte principal, la note doit offrir une véritable variante lexicale.
