source:
  edition: WLC
  text: כִּ֣י אֱוִ֣יל עַמִּ֗/י אוֹתִ/י֙ לֹ֣א יָדָ֔עוּ בָּנִ֤ים סְכָלִים֙ הֵ֔מָּה וְ/לֹ֥א נְבוֹנִ֖ים הֵ֑מָּה חֲכָמִ֥ים הֵ֨מָּה֙ לְ/הָרַ֔ע וּ/לְ/הֵיטִ֖יב לֹ֥א יָדָֽעוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/022.yaml
  text: For my people are foolish; they do not know me. They are foolish children[a], and they have no understanding. They are wise to do evil, but they do not know how to do good.
translation:
  language: fr
  text: Car mon peuple est insensé ; ils ne me connaissent pas. Ce sont des enfants stupides[a], sans discernement. Ils sont habiles à faire le mal, mais ils ne savent pas faire le bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils stupides » ; ici, le mot « fils » désigne collectivement les membres du peuple.'
    reason: Alternative lexicale et précision sur la valeur collective du masculin hébreu.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication causale de la vision de jugement qui précède.
- source_word: אֱוִיל עַמִּי
  choice: mon peuple est insensé
  rationale: « Insensé » exprime une folie morale et spirituelle, et le possessif conserve la force tragique de l’expression.
- source_word: אוֹתִי לֹא יָדָעוּ
  choice: ils ne me connaissent pas
  rationale: Le verbe désigne ici une connaissance relationnelle et fidèle de Dieu ; la formulation simple préserve cette richesse sans l’expliciter excessivement.
- source_word: בָּנִים סְכָלִים
  choice: des enfants stupides
  rationale: « Enfants » rend le collectif sans le limiter aux hommes ; « stupides », plus incisif qu’« insensé », conserve la rudesse et la progression rhétorique de l’hébreu.
- source_word: וְלֹא נְבוֹנִים הֵמָּה
  choice: dépourvus d’intelligence
  rationale: Exprime l’absence de discernement, en contraste avec leur habileté paradoxale à faire le mal.
- source_word: חֲכָמִים הֵמָּה לְהָרַע
  choice: Ils sont habiles à faire le mal
  rationale: « Habiles » rend la compétence pratique et l’ironie du texte sans donner à « sages » un sens positif trompeur en français.
- source_word: וּלְהֵיטִיב לֹא יָדָעוּ
  choice: mais ils ne savent pas faire le bien
  rationale: Le français naturel « savoir faire » exprime ici la capacité pratique et morale indiquée par l’infinitif avec יָדַע.
theological_decisions:
- issue: Nature de la connaissance de Dieu
  choice: « ils ne me connaissent pas »
  alternative: « ils ne me reconnaissent pas » ou simple connaissance intellectuelle
  rationale: Dans le discours prophétique, connaître Dieu comporte une dimension relationnelle, morale et liée à l’alliance. Le texte conserve néanmoins le verbe non explicité afin de préserver sa portée.
- issue: Portée de בָּנִים
  choice: « enfants »
  alternative: « fils »
  rationale: Le masculin pluriel désigne collectivement le peuple et n’est pas limité aux personnes de sexe masculin.
- issue: Ironie de חֲכָמִים appliqué au mal
  choice: « habiles à faire le mal »
  alternative: « sages pour faire le mal »
  rationale: « Habiles » communique la compétence pratique visée et maintient l’ironie, tandis que « sages pour faire le mal » serait moins naturel et pourrait brouiller le contraste moral.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve le parallélisme accusateur du verset. « Stupides » est volontairement rude pour refléter סְכָלִים, tandis qu’« insensé » rend la nuance morale de אֱוִיל.
