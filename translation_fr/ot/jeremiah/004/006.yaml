  text: שְׂאוּ נֵ֣ס צִיּ֔וֹנָ/ה הָעִ֖יזוּ אַֽל תַּעֲמֹ֑דוּ כִּ֣י רָעָ֗ה אָנֹכִ֛י מֵבִ֥יא מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/006.yaml
  text: Raise a signal toward Zion[a]. Take refuge; do not stand still, for I am bringing disaster from the north[c][b], and great destruction.
translation:
  language: fr
  text: Levez un étendard vers Sion[a] ! Mettez-vous à l’abri, ne vous arrêtez pas, car je fais venir du nord un désastre[b] et une grande destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Levez un signal vers Sion. »'
    reason: lexical_alternative
  - marker: b
    text: Ici, « désastre » désigne une calamité, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: Dressez un signal
  rationale: L’expression désigne l’action d’élever un signal servant à avertir ou à rallier. « Dressez un signal » est naturel en français et conserve cette fonction.
- source_word: צִיּוֹנָה
  choice: en direction de Sion
  rationale: Le hé directionnel exprime une orientation vers Sion, nuance que rend explicitement « en direction de ».
- source_word: הָעִיזוּ
  choice: Cherchez refuge
  rationale: L’impératif hiphil de עוז appelle vraisemblablement à se mettre à l’abri. Cette formulation garde l’urgence sans ajouter nécessairement l’idée explicite de fuite.
- source_word: אַל תַּעֲמֹדוּ
  choice: ne vous arrêtez pas
  rationale: Dans la suite d’ordres urgents, le verbe interdit de rester sur place ou de tarder. « Ne vous arrêtez pas » est idiomatique et direct.
- source_word: רָעָה
  choice: un désastre
  rationale: Dans ce contexte de jugement prophétique, le nom désigne une calamité plutôt qu’un mal moral.
- source_word: אָנֹכִי מֵבִיא
  choice: je fais venir
  rationale: Le pronom emphatique et le participe présentent Dieu comme l’agent direct d’un événement imminent ou déjà en marche.
- source_word: מִצָּפוֹן
  choice: du nord
  rationale: Rend simplement et fidèlement l’origine géographique de la menace.
- source_word: שֶׁבֶר גָּדוֹל
  choice: une grande destruction
  rationale: שֶׁבֶר évoque ici la ruine ou l’effondrement causé par le jugement. « Grande destruction » convient au parallélisme avec « désastre ».
theological_decisions:
- issue: Sens de רָעָה lorsque Dieu en est l’agent
  choice: un désastre
  alternative: un mal ; un malheur
  rationale: Le contexte annonce une calamité de jugement venant du nord. « Désastre » maintient l’affirmation de l’action divine sans faire entendre que Dieu produit le mal moral.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les impératifs brefs conservent l’urgence prophétique ; la ponctuation distingue l’ordre initial de l’appel pressant à chercher refuge.
