revisions:
- from: Dressez un signal en direction de Sion[a] ! Cherchez refuge, ne vous arrêtez pas, car je fais venir du nord un désastre[b], une grande destruction.
  to: Levez un étendard vers Sion[a] ! Mettez-vous à l’abri, ne vous arrêtez pas, car je fais venir du nord un désastre[b] et une grande destruction.
  rationale: La révision remplace une expression française peu idiomatique par la formulation usuelle pour l’élévation d’un נֵס, améliore l’urgence naturelle du second impératif et rétablit la coordination explicite du texte hébreu. Elle maintient la nuance directionnelle, l’agent divin, et l’ambiguïté prudente de הָעִיזוּ.
