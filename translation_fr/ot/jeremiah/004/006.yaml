review_pass:
  verdict: revise
  source_fidelity: Le sens des impératifs, l’orientation vers Sion, l’origine septentrionale de la calamité et la coordination avec « une grande destruction » sont bien rendus. « Dressez un signal » n’est toutefois pas une collocation française naturelle pour נשׂא נֵס, qui évoque l’élévation d’un étendard ou signal visible. La coordination finale doit être explicitée par « et », conformément au waw hébreu.
  naturalness: « Levez un étendard vers Sion » est idiomatique, clair dans un contexte d’alerte, et conserve le registre prophétique. « Mettez-vous à l’abri » rend avec naturel l’appel urgent de הָעִיזוּ sans imposer une interprétation plus étroite.
  terminology: « Étendard » restitue adéquatement נֵס; la note conserve « signal » comme possibilité fonctionnelle. « Désastre » convient à רָעָה dans ce contexte et évite de lui attribuer le sens de mal moral. La note est resserrée afin de ne pas présenter « jugement » comme une glose lexicalement nécessaire au verset isolé.
  issues:
  - severity: medium
    issue: Collocation française de « Dressez un signal »
    rationale: En français moderne, on ne « dresse » pas habituellement un signal. Le verbe hébreu avec נֵס désigne l’action de lever/élever un étendard ou un signal visuel.
  - severity: low
    issue: Absence de conjonction entre les deux réalités annoncées
    rationale: Le waw de וְשֶׁבֶר גָּדוֹל coordonne « désastre » et « grande destruction »; « et » rend cette relation plus nettement que la virgule.
  - severity: low
    issue: Formulation de la note sur « désastre »
    rationale: « Jugement » est contextuellement défendable, mais n’est pas requis par le lexème dans ce verset; la note peut préciser le contraste avec le mal moral sans ajouter cette glose.
  revised_text: Levez un étendard vers Sion[a] ! Mettez-vous à l’abri, ne vous arrêtez pas, car je fais venir du nord un désastre[b] et une grande destruction.
