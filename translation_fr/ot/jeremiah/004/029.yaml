  text: מִ/קּ֨וֹל פָּרָ֜שׁ וְ/רֹ֣מֵה קֶ֗שֶׁת בֹּרַ֨חַת֙ כָּל הָ/עִ֔יר בָּ֚אוּ בֶּ/עָבִ֔ים וּ/בַ/כֵּפִ֖ים עָל֑וּ כָּל הָ/עִ֣יר עֲזוּבָ֔ה וְ/אֵין יוֹשֵׁ֥ב בָּ/הֵ֖ן אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/029.yaml
  text: At the sound of the horseman and the archer[a], every city flees; they go into the thickets and climb up among the rocks. Every city is abandoned[d][c][b], and no man dwells in them.
translation:
  language: fr
  text: Au bruit du cavalier et de l’archer[a], chaque ville prend la fuite ; ses habitants gagnent les fourrés[b] et montent sur les rochers. Chaque ville est abandonnée, et personne n’y habite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À cause du bruit du cavalier et de l’archer ». La préposition hébraïque peut indiquer soit l’occasion, soit la cause.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « fourrés » est incertain. Certains le comprennent comme « nuages », mais le contexte de lieux où se cacher favorise l’idée d’un couvert végétal dense.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et pas un homme n’habite en elles ».'
    reason: literal_rendering
lexical_decisions:
- source_word: מִקּוֹל
  choice: Au bruit de
  rationale: La préposition מִן peut ici marquer l’occasion ou la cause. « Au bruit de » restitue naturellement l’immédiateté de la panique tout en laissant la nuance causale en arrière-plan.
- source_word: פָּרָשׁ
  choice: du cavalier
  rationale: Le singulier a une valeur représentative dans cette scène militaire. « Cavalier » est courant et plus direct que « homme à cheval ».
- source_word: וְרֹמֵה קֶשֶׁת
  choice: et de l’archer
  rationale: L’expression signifie littéralement « celui qui lance/tire avec l’arc ». « Archer » en donne l’équivalent militaire naturel.
- source_word: בֹּרַחַת כָּל הָעִיר
  choice: chaque ville prend la fuite
  rationale: כָּל avec le singulier peut être distributif. La reprise de כָּל הָעִיר et les références pronominales plurielles dans le verset favorisent l’idée que toutes les villes se vident successivement.
- source_word: בָּאוּ
  choice: ses habitants gagnent
  rationale: Le pluriel renvoie naturellement à la population de chaque ville. L’explicitation légère « ses habitants » évite en français une rupture de nombre obscure après « chaque ville », tandis que « gagnent » exprime leur mouvement vers un refuge.
- source_word: בֶּעָבִים
  choice: les fourrés
  rationale: Le terme est incertain et pourrait formellement évoquer les « nuages », mais le parallèle avec les rochers et le contexte de fuite favorisent ici un couvert végétal dense.
- source_word: וּבַכֵּפִים עָלוּ
  choice: et montent parmi les rochers
  rationale: כֵּפִים désigne des rochers ou escarpements, et עלה exprime la montée. La formulation conserve l’image sans préciser indûment qu’ils escaladent des falaises.
- source_word: עֲזוּבָה
  choice: est abandonnée
  rationale: Le terme décrit l’état résultant de l’évacuation complète de la ville. « Abandonnée » est clair, actuel et fidèle.
- source_word: וְאֵין יוֹשֵׁב בָּהֵן אִישׁ
  choice: et plus personne n’y habite
  rationale: Littéralement, « et il n’y a pas un homme qui habite en elles ». Dans cette tournure négative, אִישׁ a une portée générique ; « plus personne » rend naturellement l’absence totale d’habitants, tandis que « plus » fait ressortir le résultat de la fuite.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et imagé. Le balancement entre la fuite, les refuges naturels et les villes désertées est conservé. L’explicitation « ses habitants » clarifie le passage du singulier collectif « chaque ville » aux verbes hébreux au pluriel, sans ajouter de nouvel acteur.
