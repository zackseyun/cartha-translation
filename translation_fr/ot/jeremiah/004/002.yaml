  text: וְ/נִשְׁבַּ֨עְתָּ֙ חַי יְהוָ֔ה בֶּ/אֱמֶ֖ת בְּ/מִשְׁפָּ֣ט וּ/בִ/צְדָקָ֑ה וְ/הִתְבָּ֥רְכוּ ב֛/וֹ גּוֹיִ֖ם וּ/ב֥/וֹ יִתְהַלָּֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/002.yaml
  text: and if you swear[a], ‘As Yahweh lives,’ in truth, in justice, and in righteousness, then nations will bless themselves in him[c][b], and in him they will boast.
translation:
  language: fr
  text: 'et si tu jures : « Yahweh est vivant ! »[a], en vérité, selon le droit et avec justice, alors les nations se béniront en lui[b][c] et se glorifieront en lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formule hébraïque traditionnelle de serment ; on pourrait aussi traduire : « Par la vie de Yahweh ! »'
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « les nations seront bénies en lui ». Le verbe hébreu peut être compris au sens réflexif (« se béniront ») ou, peut-être, avec une valeur proche du passif.'
    reason: lexical_alternative
  - marker: c
    text: 'Le pronom « lui » est ambigu dans ce contexte : il peut désigner Israël ou Juda rétabli, mais certains comprennent qu’il renvoie à Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּעְתָּ
  choice: et si tu jures
  rationale: Le parfait niphal avec waw poursuit la séquence conditionnelle amorcée au verset précédent. « Si tu jures » exprime naturellement cette condition en français.
- source_word: חַי יְהוָה
  choice: « Yahweh est vivant ! »
  rationale: Cette formulation garde la forme de la formule hébraïque de serment tout en restant intelligible en français moderne.
- source_word: בֶּאֱמֶת
  choice: avec vérité
  rationale: Le nom אֱמֶת qualifie ici la sincérité et la véracité du serment; la tournure nominale préserve le parallélisme de la série.
- source_word: בְּמִשְׁפָּט
  choice: avec équité
  rationale: מִשְׁפָּט évoque ici l'exercice de ce qui est juste et conforme au droit. « Équité » permet de le distinguer de צְדָקָה dans la même série.
- source_word: וּבִצְדָקָה
  choice: et avec justice
  rationale: צְדָקָה désigne la conduite droite et juste. « Justice » est naturel et dignifié en français, tout en gardant une nuance distincte d'« équité ».
- source_word: וְהִתְבָּרְכוּ
  choice: alors les nations se béniront
  rationale: Le hitpael de ברך reçoit ici son sens réflexif naturel. La formulation conserve aussi l'écho possible aux promesses de bénédiction concernant les nations.
- source_word: בּוֹ
  choice: en lui
  rationale: La préposition ב avec le suffixe masculin singulier est rendue littéralement afin de ne déterminer ni la relation exacte ni le référent implicite.
- source_word: גּוֹיִם
  choice: les nations
  rationale: « Nations » est le sens collectif courant de גּוֹיִם dans ce contexte prophétique.
- source_word: יִתְהַלָּלוּ
  choice: se glorifieront
  rationale: Le hitpael de הלל peut signifier tirer gloire ou fierté de quelqu'un. « Se glorifier en » convient au complément בּוֹ et conserve le parallélisme avec « se béniront en lui ».
theological_decisions:
- issue: Référent du pronom dans « en lui »
  choice: Maintenir le pronom masculin singulier sans expliciter son référent.
  alternative: Traduire « en Yahweh » ou « en Israël/Juda ».
  rationale: L'hébreu ne nomme pas explicitement le référent du suffixe. Le contexte peut orienter vers Israël/Juda rétabli, tandis que Yahweh demeure une autre compréhension possible. Le texte français conserve donc cette ambiguïté.
- issue: Valeur du hitpael de ברך
  choice: « se béniront »
  alternative: « seront bénies »
  rationale: La forme peut être comprise comme réflexive ou, éventuellement, avec une valeur proche du passif. Le sens réflexif respecte plus directement la morphologie sans exclure l'arrière-plan théologique de la bénédiction des nations.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La cadence ternaire de l'hébreu est conservée. « Équité » et « justice » distinguent les deux termes hébreux voisins, tandis que les tournures réflexives maintiennent le parallélisme de la seconde moitié.
