  source_fidelity: Le sens météorologique et judiciaire est bien rendu. Toutefois, לִי signifie d’abord « à moi »; « pour moi » introduit plus directement l’idée de service ou d’intérêt. « Viendra à moi » est plus fidèle tout en conservant la brièveté et l’ambiguïté de l’hébreu. La note a doit aussi refléter exactement les possibilités de la construction elliptique.
  naturalness: « Un vent trop puissant pour cela » et « je prononcerai des jugements contre eux » sont naturels dans un registre biblique moderne. « Viendra à moi » est plus idiomatique et moins interprétatif que « viendra pour moi ».
  terminology: « Vent », « jugements » et « contre eux » conviennent au contexte. « Trop puissant » rend de façon recevable l’intensité impliquée par מָלֵא; « trop fort » serait possible, mais n’est pas nécessaire.
