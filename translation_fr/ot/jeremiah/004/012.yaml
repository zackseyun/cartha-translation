reference: Jeremiah 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ר֧וּחַ מָלֵ֛א מֵ/אֵ֖לֶּה יָ֣בוֹא לִ֑/י עַתָּ֕ה גַּם אֲנִ֛י אֲדַבֵּ֥ר מִשְׁפָּטִ֖ים אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/012.yaml
  text: A wind too full for these will come for me[b][a]; now I myself will also speak judgments against them.
translation:
  language: fr
  text: Un vent trop puissant pour cela viendra à moi[a]. Maintenant, moi aussi, je prononcerai des jugements contre eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Un vent plein venant de ceux-ci viendra à moi » ou « Un vent plus fort que ceux-ci viendra à moi ». L’expression hébraïque est concise et peut évoquer la comparaison, la provenance ou la destination.
    reason: lexical_alternative
  - marker: b
    text: Ou « moi aussi, je leur annoncerai mes sentences ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: vent
  rationale: Le contexte immédiat est météorologique et prolonge l’image du vent évoquée au verset précédent.
- source_word: מָלֵא
  choice: trop puissant
  rationale: Littéralement « plein » ; appliqué au vent et mis en contraste avec le vannage et le nettoyage du verset précédent, le terme indique ici une intensité excessive pour ces tâches.
- source_word: מֵאֵלֶּה
  choice: pour cela
  rationale: La construction elliptique avec מִן peut exprimer une comparaison, une provenance ou un rapport de destination. « Pour cela » rattache naturellement l’expression aux tâches du verset précédent sans masquer l’ambiguïté, signalée en note.
- source_word: יָבוֹא לִי
  choice: viendra pour moi
  rationale: 'Cette traduction conserve la formulation compacte « à/pour moi » et laisse ouverte la nuance précise : direction, intérêt ou mise au service du locuteur divin.'
- source_word: עַתָּה
  choice: maintenant
  rationale: Équivalent temporel direct et naturel.
- source_word: גַּם אֲנִי
  choice: moi aussi
  rationale: Cette tournure restitue à la fois la valeur additive de גַּם et l’insistance portée par le pronom indépendant.
- source_word: אֲדַבֵּר
  choice: je prononcerai
  rationale: Le verbe signifie littéralement « parler », mais avec « jugements » comme complément, « prononcer » rend en français courant la portée judiciaire de l’expression.
- source_word: מִשְׁפָּטִים
  choice: des jugements
  rationale: Le pluriel désigne ici des décisions ou sentences judiciaires, plutôt que la justice comme notion abstraite.
- source_word: אוֹתָם
  choice: contre eux
  rationale: Même si la forme hébraïque est celle du marqueur d’objet direct avec suffixe, « contre eux » exprime idiomatiquement en français la cible hostile de ces jugements.
theological_decisions:
- issue: Identité du locuteur dans « pour moi » et « moi aussi »
  choice: Le Seigneur parle et annonce un vent destructeur venant pour lui, puis ses jugements contre le peuple.
  alternative: Le prophète pourrait parler à la première personne dans une partie du verset, ou « pour moi » pourrait n’exprimer qu’une simple direction.
  rationale: Le contexte environnant présente une parole divine de jugement. La traduction ne développe toutefois pas le texte en ajoutant explicitement « le Seigneur », et conserve ainsi la forme hébraïque.
translation_notes:
  register: Français moderne, digne et accessible. « Trop puissant » traduit idiomatiquement l’image littérale d’un vent « plein », tandis que les notes maintiennent l’ambiguïté inhabituelle de la construction hébraïque.
