id: JER.4.9
reference: Jeremiah 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה יֹאבַ֥ד לֵב הַ/מֶּ֖לֶךְ וְ/לֵ֣ב הַ/שָּׂרִ֑ים וְ/נָשַׁ֨מּוּ֙ הַ/כֹּ֣הֲנִ֔ים וְ/הַ/נְּבִיאִ֖ים יִתְמָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/009.yaml
  text: And it will happen on that day[a], declares Yahweh, that the heart of the king and the heart of the officials will perish, and the priests will be appalled, and the prophets will be astonished.
translation:
  language: fr
  text: « En ce jour-là, déclare Yahweh, le roi et les dirigeants perdront courage[a] ; les prêtres seront atterrés et les prophètes stupéfaits. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le cœur du roi et le cœur des dirigeants disparaîtront » ; le cœur représente ici le courage ou la résolution.'
    reason: Précise l’image hébraïque et conserve l’alternative lexicale.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette tournure française naturelle conserve la formule prophétique annonçant un événement futur ; le futur des verbes principaux en explicite la portée.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend avec concision et solennité la formule prophétique, tout en conservant le nom divin.
- source_word: יֹאבַד לֵב הַמֶּלֶךְ וְלֵב הַשָּׂרִים
  choice: le roi et les dirigeants perdront courage
  rationale: Dans ce contexte de panique provoquée par le désastre, לֵב désigne la résolution ou le courage, tandis que אבד exprime sa disparition. La formulation française communique naturellement l’image, dont la forme littérale est signalée en note.
- source_word: הַשָּׂרִים
  choice: les dirigeants
  rationale: Le terme désigne les responsables qui exercent l’autorité auprès du roi ; « dirigeants » convient au contexte sans supposer une noblesse héréditaire.
- source_word: וְנָשַׁמּוּ הַכֹּהֲנִים
  choice: les prêtres seront atterrés
  rationale: Le nifal de שמם exprime ici la consternation et l’effroi devant une catastrophe.
- source_word: וְהַנְּבִיאִים יִתְמָהוּ
  choice: et les prophètes stupéfaits
  rationale: תמה exprime la stupeur et l’étonnement déconcerté ; l’ellipse de « seront » allège la phrase sans modifier le sens.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » conserve le nom propre et suit la convention du projet.
- issue: Sens de la disparition du « cœur »
  choice: perdront courage
  alternative: le cœur du roi et le cœur des dirigeants disparaîtront
  rationale: Le contexte annonce l’effondrement de la résolution des autorités. La traduction principale exprime ce sens idiomatique sans effacer la métaphore hébraïque, conservée dans la note.
translation_notes:
  register: Français international actuel, sobre et digne. Le futur maintient la portée prophétique ; le point-virgule fait ressortir la succession des réactions des autorités civiles et religieuses.
