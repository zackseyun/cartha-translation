  text: עָלָ֤ה אַרְיֵה֙ מִֽ/סֻּבְּכ֔/וֹ וּ/מַשְׁחִ֣ית גּוֹיִ֔ם נָסַ֖ע יָצָ֣א מִ/מְּקֹמ֑/וֹ לָ/שׂ֤וּם אַרְצֵ/ךְ֙ לְ/שַׁמָּ֔ה עָרַ֥יִ/ךְ תִּצֶּ֖ינָה מֵ/אֵ֥ין יוֹשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/007.yaml
  text: A lion has come up from his thicket[a], and a destroyer of nations has set out; he has gone out from his place to make your land a desolation. Your cities will be laid waste[b], without inhabitant.
translation:
  language: fr
  text: Un lion est sorti de son fourré[a], et un destructeur de nations s’est mis en marche ; il a quitté son lieu pour réduire ton pays à la désolation. Tes villes deviendront des ruines, sans habitant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son repaire ». Le terme hébreu désigne un couvert dense ou des broussailles enchevêtrées d’où sort un lion.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Tes villes seront dévastées, sans personne pour y habiter. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: monte
  rationale: Le parfait prophétique présente l’avancée comme déjà engagée; le présent français rend la scène vive et convient au mouvement vers le pays.
- source_word: אַרְיֵה
  choice: un lion
  rationale: Conserve la métaphore directrice de l’envahisseur sans l’expliciter dans le corps du texte.
- source_word: מִסֻּבְּכוֹ
  choice: de son fourré
  rationale: Le nom désigne un couvert dense ou des broussailles enchevêtrées d’où surgit le lion.
- source_word: מַשְׁחִית גּוֹיִם
  choice: celui qui détruit les nations
  rationale: Rend naturellement en français le participe en apposition au lion, tout en gardant sa valeur descriptive.
- source_word: נָסַע
  choice: s’est mis en route
  rationale: Le verbe peut évoquer la levée du camp; cette formulation communique clairement le départ d’une force en marche.
- source_word: יָצָא מִמְּקֹמוֹ
  choice: Il est sorti de sa demeure
  rationale: Préserve le mouvement hors de son propre lieu; «demeure» est naturel et assez large pour ne pas préciser indûment une base militaire.
- source_word: לָשׂוּם אַרְצֵךְ לְשַׁמָּה
  choice: pour faire de ton pays un lieu dévasté
  rationale: Exprime le but ou le résultat et conserve le registre prophétique de la dévastation.
- source_word: עָרַיִךְ תִּצֶּינָה
  choice: Tes villes seront dévastées
  rationale: Le verbe décrit des villes rendues désolées ou ruinées; cette tournure française reste directe et cohérente avec la proposition précédente.
- source_word: מֵאֵין יוֹשֵׁב
  choice: privées de tout habitant
  rationale: Rend l’absence complète de résident tout en conservant le singulier collectif de l’hébreu.
