review_pass:
  verdict: revise
  source_fidelity: La métaphore et la progression de l’envahisseur sont bien préservées. Toutefois, « monte de son fourré » suggère plus naturellement une ascension qu’une sortie hors d’un couvert. « Est sorti de son fourré » rend clairement le mouvement exprimé par עָלָה מִסֻּבְּכוֹ. « Réduire ton pays à la désolation » restitue plus directement לָשׂוּם ... לְשַׁמָּה que « faire ... un lieu dévasté ».
  naturalness: La révision emploie un français moderne, clair et de registre prophétique sobre. « Destructeur de nations » garde la valeur descriptive du participe sans introduire une désignation indûment définie. « Deviendront des ruines » rend naturellement le verbe intransitif appliqué aux villes.
  terminology: « Fourré », « destructeur de nations », « désolation » et « sans habitant » conservent les images et le registre du texte hébreu. « Lieu » est maintenu pour מקום sans interpréter ce lieu comme une demeure ou une base militaire.
  issues:
  - severity: medium
    issue: Sens spatial de « monte de son fourré »
    rationale: En français, cette formulation peut évoquer un lion qui grimpe depuis un fourré, alors que le contexte et la préposition מן décrivent sa sortie de son couvert.
  - severity: low
    issue: « Lieu dévasté » affaiblit le nom abstrait « désolation »
    rationale: שַׁמָּה désigne l’état de désolation; « réduire ... à la désolation » le restitue de manière plus directe et idiomatique.
  - severity: low
    issue: « Celui qui détruit les nations » est plus défini que nécessaire
    rationale: Le participe hébreu est descriptif et apposé au lion; « un destructeur de nations » conserve plus exactement cette indétermination.
  revised_text: Un lion est sorti de son fourré[a], et un destructeur de nations s’est mis en marche ; il a quitté son lieu pour réduire ton pays à la désolation. Tes villes deviendront des ruines, sans habitant[b].
  revised_footnotes:
