- from: Un lion monte de son fourré[a], et celui qui détruit les nations s’est mis en route. Il est sorti de sa demeure pour faire de ton pays un lieu dévasté. Tes villes seront dévastées, privées de tout habitant[b].
  to: Un lion est sorti de son fourré[a], et un destructeur de nations s’est mis en marche ; il a quitté son lieu pour réduire ton pays à la désolation. Tes villes deviendront des ruines, sans habitant[b].
  rationale: Révision limitée visant à lever une ambiguïté française sur le mouvement du lion, à rendre explicitement le substantif hébreu « désolation », et à conserver la valeur descriptive non définie de « destructeur de nations ». Les deux notes, leurs ancres et leur portée lexicale sont conservées.
