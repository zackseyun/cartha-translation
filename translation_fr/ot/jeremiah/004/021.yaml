  text: עַד מָתַ֖י אֶרְאֶה נֵּ֑ס אֶשְׁמְעָ֖ה ק֥וֹל שׁוֹפָֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/021.yaml
  text: How long must I see the signal flag and hear the sound of the trumpet?[a][b]
translation:
  language: fr
  text: Jusqu’à quand devrai-je voir le signal[a] et entendre le son du cor[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bannière », « l’étendard » ou simplement « le signe ». Le mot hébreu désigne un signe élevé, notamment un signal militaire.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne un cor, souvent fait d’une corne de bélier, utilisé pour donner l’alarme ou appeler au rassemblement.
    reason: cultural_note
lexical_decisions:
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Formule idiomatique de plainte temporelle qui conserve la force rhétorique de l’hébreu.
- source_word: אֶרְאֶה
  choice: devrai-je voir
  rationale: Dans ce contexte de lamentation, l’imparfait exprime une expérience pénible qui se prolonge; « devrai-je » en rend naturellement le poids sans transformer la question en simple futur.
- source_word: נֵּס
  choice: le signal
  rationale: Le nom désigne un signe élevé, souvent une bannière servant de signal militaire. « Signal » exprime clairement sa fonction tout en préservant l’éventail concret du terme, précisé en note.
- source_word: אֶשְׁמְעָה
  choice: et entendre
  rationale: Le verbe est coordonné au précédent et partage naturellement en français la valeur modale de « devrai-je », sans répétition lourde.
- source_word: קוֹל
  choice: le son
  rationale: Avec שׁוֹפָר, le mot désigne ce qui est entendu; « le son du cor » est idiomatique et précis.
- source_word: שׁוֹפָר
  choice: cor
  rationale: Le terme hébreu désigne un instrument à vent, souvent fait d’une corne de bélier, servant notamment à donner l’alarme ou à rassembler. « Cor » évite de suggérer trop directement la trompette métallique moderne.
