base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/009.yaml
  text: Gedaliah son of Ahikam[a], son of Shaphan, swore to them and to their men, saying, “Do not be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.”
translation:
  language: fr
  text: 'Guedalia, fils d’Ahikam, fils de Shafân, leur jura, ainsi qu’à leurs hommes : « N’ayez pas peur de servir les Chaldéens[a]. Demeurez dans le pays, servez le roi de Babylone, et tout ira bien pour vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Babyloniens ». Le texte hébreu dit « les Chaldéens », terme souvent employé pour désigner le pouvoir babylonien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: leur fit un serment
  rationale: Le nifal de שׁבע exprime ici un engagement solennel sous serment. Cette formulation est naturelle en français et conserve la force formelle de l’acte.
- source_word: לָהֶם ... וּלְאַנְשֵׁיהֶם
  choice: à eux et à leurs hommes
  rationale: אַנְשֵׁי désigne leurs hommes ou leurs partisans. « Leurs hommes » préserve l’indétermination du texte sans les identifier nécessairement comme des soldats.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français actuel, les deux-points introduisent naturellement les paroles qui suivent, sans qu’il soit nécessaire de calquer l’infinitif hébreu par « en disant ».
- source_word: אַל תִּירְאוּ מֵעֲבֹד הַכַּשְׂדִּים
  choice: N’ayez pas peur de servir les Chaldéens
  rationale: La construction avec מִן après le verbe de crainte est rendue idiomatiquement par « avoir peur de ». L’infinitif « servir » conserve le sens de soumission politique.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le texte hébreu emploie la désignation historique et ethnique « Chaldéens », souvent appliquée au pouvoir babylonien. Elle est conservée dans le texte, avec une explication en note.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Restez dans le pays
  rationale: ישׁב peut signifier habiter, demeurer ou rester. Dans ce contexte, Guedalia exhorte ses interlocuteurs à ne pas quitter le pays ; « restez » rend clairement cette nuance sans exclure l’idée d’y vivre.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: servez le roi de Babylone
  rationale: עבד décrit ici le service ou la soumission politique envers un souverain. « Servir » conserve cette portée.
- source_word: וְיִיטַב לָכֶם
  choice: et tout ira bien pour vous
  rationale: Cette tournure française naturelle exprime l’issue favorable contenue dans l’idiome hébreu.
