source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הֲ/יָדֹ֤עַ תֵּדַע֙ כִּ֞י בַּעֲלִ֣יס מֶ֣לֶךְ בְּנֵֽי עַמּ֗וֹן שָׁלַח֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה לְ/הַכֹּתְ/ךָ֖ נָ֑פֶשׁ וְ/לֹא הֶאֱמִ֣ין לָ/הֶ֔ם גְּדַלְיָ֖הוּ בֶּן אֲחִיקָֽם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/014.yaml
  text: And they said to him[b][a], “Do you really know that Baalis king of the Ammonites has sent Ishmael son of Nethaniah to strike you down?” But Gedaliah son of Ahikam did not believe them.
translation:
  language: fr
  text: 'Ils lui dirent : « Sais-tu vraiment que Baalis, roi des Ammonites, a envoyé Ismaël, fils de Netania, pour t’ôter la vie[a] ? » Mais Guedalia, fils d’Ahikam, ne les crut pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pour te frapper quant à la vie » ; cette expression signifie ici « pour te tuer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדֹעַ תֵּדַע
  choice: Sais-tu vraiment
  rationale: La construction avec infinitif absolu et verbe conjugué renforce le verbe « savoir ». « Vraiment » en rend naturellement l’emphase en français, sans imposer l’idée plus étroite de certitude absolue.
- source_word: בַּעֲלִיס
  choice: Baalis
  rationale: Translittération usuelle et transparente du nom propre.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: roi des Ammonites
  rationale: Rendu français idiomatique du groupe construit signifiant littéralement « roi des fils d’Ammon ».
- source_word: שָׁלַח
  choice: a envoyé
  rationale: Le passé composé convient au discours direct et exprime une action antérieure dont la menace demeure actuelle.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismaël, fils de Netania
  rationale: Forme française claire des noms propres et de la filiation.
- source_word: לְהַכֹּתְךָ נָפֶשׁ
  choice: pour t’ôter la vie
  rationale: Cette tournure française naturelle rend l’expression hébraïque littéralement liée au fait de frapper la vie ou la personne, ici avec le sens de tuer.
- source_word: הֶאֱמִין לָהֶם
  choice: ne les crut pas
  rationale: Dans ce contexte, le verbe signifie accorder foi à leur avertissement plutôt que leur faire confiance au sens relationnel.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: Guedalia, fils d’Ahikam
  rationale: Forme française claire des noms propres et de la filiation.
theological_decisions: []
