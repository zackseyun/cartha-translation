  text: וַ/יָּבֵ֥א וַ/יַּ֛עַשׂ יְהוָ֖ה כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּֽי חֲטָאתֶ֤ם לַֽ/יהוָה֙ וְ/לֹֽא שְׁמַעְתֶּ֣ם בְּ/קוֹל֔/וֹ וְ/הָיָ֥ה לָ/כֶ֖ם דבר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/003.yaml
  text: And Yahweh has brought it about and has done just as he said[a], because you sinned against Yahweh and did not listen to his voice[b]; therefore this thing has happened to you.
translation:
  language: fr
  text: Yahweh l’a fait venir et a agi comme il l’avait dit, parce que vous avez péché contre Yahweh et que vous n’avez pas écouté sa voix[a]. Voilà pourquoi cette chose vous est arrivée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous ne lui avez pas obéi ». En hébreu, « écouter la voix » implique souvent l’obéissance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce malheur vous est arrivé ». Dans ce contexte, « cette chose » peut désigner plus précisément la calamité qui vient d’être décrite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: l’a fait venir
  rationale: 'Le hifil de בוא a ici un sens causatif : Yahweh a fait venir l’événement ou le malheur évoqué par le contexte. Le pronom « l’ » reprend implicitement ce référent, comme en hébreu.'
- source_word: וַיַּעַשׂ
  choice: a agi
  rationale: עשה signifie couramment « faire » ou « agir ». « A agi comme il l’avait annoncé » est naturel en français et évite la tournure lourde « a fait comme il avait dit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte source plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: comme il l’avait annoncé
  rationale: Le verbe דבר renvoie ici à la parole antérieure de Yahweh, désormais accomplie. « Annoncé » exprime naturellement ce rapport en français sans préciser davantage le mode de révélation.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la cause du jugement.
- source_word: חֲטָאתֶם לַיהוָה
  choice: vous avez péché contre Yahweh
  rationale: En français, « pécher contre » rend naturellement l’offense dirigée contre Yahweh.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלוֹ
  choice: vous n’avez pas écouté sa voix
  rationale: La traduction conserve l’image hébraïque de l’écoute tout en laissant entendre, dans ce contexte, le refus d’obéir.
- source_word: וְהָיָה לָכֶם דבר הַזֶּה
  choice: cette chose vous est arrivée
  rationale: La formulation rend l’idiome hébreu et conserve le terme général דבר, dont le référent contextuel est le malheur subi.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur de שׁמע בקולו
  choice: vous n’avez pas écouté sa voix
  alternative: vous ne lui avez pas obéi
  rationale: L’expression idiomatique comporte une idée d’obéissance, mais la traduction retenue préserve l’image et la nuance du texte source.
- issue: Degré de précision de דבר הזה
  choice: cette chose
  alternative: ce malheur
  rationale: Le contexte vise clairement la calamité annoncée, mais דבר demeure lexicalement général. Le texte principal conserve cette ouverture et la note indique la lecture contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe causale est explicite sans être pesante. « Voilà pourquoi » rend naturellement le résultat exprimé par la dernière proposition. Les notes conservent les principales nuances lexicales de l’hébreu.
