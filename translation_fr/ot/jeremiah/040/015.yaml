  text: וְ/יוֹחָנָ֣ן בֶּן קָרֵ֡חַ אָמַ֣ר אֶל גְּדַלְיָהוּ֩ בַ/סֵּ֨תֶר בַּ/מִּצְפָּ֜ה לֵ/אמֹ֗ר אֵ֤לְכָה נָּא֙ וְ/אַכֶּה֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וְ/אִ֖ישׁ לֹ֣א יֵדָ֑ע לָ֧/מָּה יַכֶּ֣/כָּה נֶּ֗פֶשׁ וְ/נָפֹ֨צוּ֙ כָּל יְהוּדָ֔ה הַ/נִּקְבָּצִ֣ים אֵלֶ֔י/ךָ וְ/אָבְדָ֖ה שְׁאֵרִ֥ית יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/015.yaml
  text: Then Johanan son of Kareah said privately to Gedaliah at Mizpah[a], saying, “Please let me go and strike down Ishmael son of Nethaniah, and no one will know. Why should he take your life, so that all the Judahites who are gathered to you would be scattered[c][b], and the remnant of Judah would perish?”
translation:
  language: fr
  text: 'Alors Yohanan, fils de Qaréah, dit en secret à Guedalia, à Mitspa[a] : « Laisse-moi, je te prie, aller abattre Ismaël, fils de Netania. Personne ne le saura. Pourquoi te tuerait-il, si bien que tous les Judéens rassemblés auprès de toi seraient dispersés et que le reste de Juda périrait ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dit confidentiellement à Guedalia, à Mitspa » ; l’hébreu peut décrire une parole tenue en secret.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: en secret
  rationale: Le syntagme désigne ici la manière confidentielle dont Yohanan s’adresse à Guedalia; « en secret » reste proche du sens concret de סֵתֶר tout en étant naturel en français.
- source_word: בַמִּצְפָּה
  choice: à Mitspa
  rationale: La préposition française « à » convient à la localisation dans cette ville; le nom propre est translittéré sous la forme française courante Mitspa.
- source_word: אֵלְכָה נָּא
  choice: Laisse-moi, je te prie, aller
  rationale: Le cohortatif accompagné de נָא exprime une proposition pressante mais polie. Cette formulation en restitue clairement la valeur volitive.
- source_word: וְאַכֶּה
  choice: abattre
  rationale: Dans ce contexte de meurtre prémédité, נכה vise une mise à mort. « Abattre » conserve l’image du coup tout en rendant l’issue envisagée.
- source_word: וְאִישׁ לֹא יֵדָע
  choice: Personne ne le saura
  rationale: אִישׁ a ici une portée générique. « Personne » est l’équivalent idiomatique moderne; le pronom « le » explicite naturellement que l’acte demeurera inconnu.
- source_word: לָמָּה יַכֶּכָּה נֶּפֶשׁ
  choice: Pourquoi te tuerait-il
  rationale: La tournure hébraïque est comprimée, littéralement proche de « pourquoi te frapperait-il — vie/personne ? ». Dans le contexte, elle signifie clairement ôter la vie, sans qu’il soit nécessaire de reproduire une syntaxe obscure en français.
- source_word: וְנָפֹצוּ
  choice: seraient dispersés
  rationale: Le verbe décrit la dispersion projetée du groupe à la suite de la mort de Guedalia; le conditionnel français exprime cette conséquence éventuelle.
- source_word: כָּל יְהוּדָה
  choice: tous les Judéens
  rationale: Le contexte vise les habitants ou ressortissants de Juda plutôt que le territoire. « Judéens » est historiquement précis.
- source_word: הַנִּקְבָּצִים אֵלֶיךָ
  choice: rassemblés auprès de toi
  rationale: Le participe décrit ceux qui se sont regroupés autour de Guedalia et sous son autorité; « auprès de toi » garde la nuance directionnelle et relationnelle.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: le reste de Juda
  rationale: « Le reste » rend naturellement שְׁאֵרִית et désigne la population survivante de Juda, sans surcharger la phrase d’une terminologie spécialisée.
- source_word: וְאָבְדָה
  choice: périrait
  rationale: אבד évoque ici la disparition ou la ruine de la communauté survivante; « périrait » rend cette gravité et s’accorde avec la conséquence hypothétique.
theological_decisions:
- issue: Portée de שְׁאֵרִית יְהוּדָה
  choice: le reste de Juda
  alternative: le reste survivant de Juda
  rationale: Le verset parle concrètement de la communauté demeurée après la catastrophe. La traduction conserve le motif biblique du « reste » sans ajouter « survivant », déjà impliqué par le contexte.
translation_notes:
  register: Français international moderne, digne et narratif. Les noms propres suivent des formes françaises bibliques reconnaissables. La syntaxe évite le calque « disant » après un verbe de parole et conserve la progression rhétorique de l’avertissement.
