translation_notes:
  register: Français international moderne, digne et direct. « Regarde » rend les marqueurs הִנֵּה et רְאֵה sans archaïsme. Le tutoiement correspond aux formes hébraïques singulières et à l’adresse personnelle faite à Jérémie.
