  to: 'Et maintenant, regarde : aujourd’hui, je t’ai libéré des chaînes que tu avais aux mains. Si tu veux venir avec moi à Babylone, viens, et je veillerai sur toi[a]. Mais si tu ne veux pas venir avec moi à Babylone, n’y viens pas. Regarde, tout le pays est devant toi : va là où tu juges bon et juste d’aller[b][c].'
