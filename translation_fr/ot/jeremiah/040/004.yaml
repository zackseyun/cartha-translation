    rationale: Le mot hébreu désigne littéralement la main, avec une extension possible au bras. Le contexte permet des entraves, mais ne requiert pas l’anatomie plus précise des poignets.
  - severity: high
    issue: « n’y va pas » élargit l’interdiction
    rationale: 'חֲדָל renvoie à l’action immédiatement proposée : venir avec le responsable à Babylone. « N’y va pas » peut signifier que Jérémie ne doit pas aller à Babylone du tout. « N’y viens pas » conserve le mouvement vers le locuteur et sa proposition.'
  - severity: low
