  text: וְ/עַתָּ֞ה הִנֵּ֧ה פִתַּחְתִּ֣י/ךָ הַ/יּ֗וֹם מִֽן הָ/אזִקִּים֮ אֲשֶׁ֣ר עַל יָדֶ/ךָ֒ אִם ט֨וֹב בְּ/עֵינֶ֜י/ךָ לָ/ב֧וֹא אִתִּ֣/י בָבֶ֗ל בֹּ֚א וְ/אָשִׂ֤ים אֶת עֵינִ/י֙ עָלֶ֔י/ךָ וְ/אִם רַ֧ע בְּ/עֵינֶ֛י/ךָ לָ/בֽוֹא אִתִּ֥/י בָבֶ֖ל חֲדָ֑ל רְאֵה֙ כָּל הָ/אָ֣רֶץ לְ/פָנֶ֔י/ךָ אֶל ט֨וֹב וְ/אֶל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֥כֶת שָׁ֖מָּ/ה לֵֽךְ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/004.yaml
  text: And now, look, today I have freed you from the chains on your hands. If you want to come with me to Babylon, come, and I will look after you[a]. But if you do not want to come with me to Babylon, do not. Look, the whole land is before you; go wherever seems good and right to you[b][c].
translation:
  language: fr
  text: 'Et maintenant, regarde : aujourd’hui, je t’ai libéré des chaînes que tu avais aux mains. Si tu veux venir avec moi à Babylone, viens, et je veillerai sur toi[a]. Mais si tu ne veux pas venir avec moi à Babylone, n’y viens pas. Regarde, tout le pays est devant toi : va là où tu juges bon et juste d’aller[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je poserai mon œil sur toi », expression qui indique ici une attention bienveillante et protectrice.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie les expressions « bon/mauvais à tes yeux » au début du verset et « bon et droit à tes yeux » à la fin. Elles renvoient à ce qui paraît bon, mauvais, droit ou approprié au destinataire.
    reason: lexical_alternative
  - marker: c
    text: 'La fin de la phrase dit littéralement : « pour aller là-bas, va », tournure qui souligne la permission insistante d’y aller.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתַּחְתִּיךָ
  choice: je t’ai libéré
  rationale: Le verbe signifie littéralement « ouvrir », mais, avec une personne comme objet et la mention des chaînes, il exprime ici la libération d’une entrave.
- source_word: הָאזִקִּים אֲשֶׁר עַל־יָדֶךָ
  choice: des chaînes qui étaient à tes poignets
  rationale: Le nom désigne des entraves de prisonnier. יָד peut désigner la main ou, plus largement, le membre supérieur ; « poignets » rend naturellement l’emplacement des chaînes sans suggérer qu’elles reposaient simplement sur les mains.
- source_word: אִם־טוֹב בְּעֵינֶיךָ / וְאִם־רַע בְּעֵינֶיךָ
  choice: si tu veux / si tu ne veux pas
  rationale: L’expression idiomatique « bon/mauvais à tes yeux » indique ici la préférence personnelle. Cette formulation est claire et naturelle en français moderne.
- source_word: וְאָשִׂים אֶת־עֵינִי עָלֶיךָ
  choice: je veillerai sur toi
  rationale: Littéralement « je poserai mon œil sur toi » ; dans ce contexte, l’image exprime une attention favorable et protectrice.
- source_word: חֲדָל
  choice: n’y va pas
  rationale: L’impératif demande de renoncer à l’action proposée. Le complément implicite, aller à Babylone avec le responsable, est explicité par le pronom « y ».
- source_word: כָּל־הָאָרֶץ לְפָנֶיךָ
  choice: tout le pays est devant toi
  rationale: Traduction proche qui exprime la liberté de choisir sa destination dans le pays.
- source_word: אֶל־טוֹב וְאֶל־הַיָּשָׁר בְּעֵינֶיךָ
  choice: là où bon te semble, là où tu juges juste d’aller
  rationale: La formulation conserve les deux appréciations, « bon » et « droit/juste », tout en rendant naturellement l’expression « à tes yeux ».
- source_word: לָלֶכֶת שָׁמָּה לֵךְ
  choice: va là où… d’aller
  rationale: La répétition hébraïque de l’idée d’aller produit une permission insistante. Le français la restitue par l’impératif direct et la construction de destination, avec une note signalant la forme littérale.
