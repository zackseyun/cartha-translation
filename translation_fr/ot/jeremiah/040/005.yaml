  text: וְ/עוֹדֶ֣/נּוּ לֹֽא יָשׁ֗וּב וְ/שֻׁ֡בָ/ה אֶל גְּדַלְיָ֣ה בֶן אֲחִיקָ֣ם בֶּן שָׁפָ֡ן אֲשֶׁר֩ הִפְקִ֨יד מֶֽלֶךְ בָּבֶ֜ל בְּ/עָרֵ֣י יְהוּדָ֗ה וְ/שֵׁ֤ב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם א֠וֹ אֶל כָּל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֖כֶת לֵ֑ךְ וַ/יִּתֶּן ל֧/וֹ רַב טַבָּחִ֛ים אֲרֻחָ֥ה וּ/מַשְׂאֵ֖ת וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/005.yaml
  text: But since he still had not gone back[a], he said, “Go back to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and live with him among the people[c][b]; or go wherever it seems right in your eyes to go.” Then the captain of the guard gave him provisions and a gift and sent him away.
translation:
  language: fr
  text: 'Mais, comme Jérémie n’était toujours pas revenu[a], Nebouzaradan lui dit : « Retourne auprès de Guedalia, fils d’Ahiqam et petit-fils de Shafan, que le roi de Babylone a établi responsable des villes de Juda, et reste auprès de lui au milieu du peuple. Ou bien, va partout où bon te semble. » Puis le chef de la garde lui donna des vivres[b] et un présent[c], et le laissa partir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début du verset est difficile en hébreu. On peut aussi comprendre : « Alors qu’il n’était pas encore revenu : “Retourne auprès de Guedalia…” »'
    reason: alternative_reading
  - marker: b
    text: Ou « des rations ».
    reason: lexical_alternative
  - marker: c
    text: Ou « un don », « une allocation » ou « une portion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹדֶנּוּ לֹא יָשׁוּב
  choice: Mais comme Jérémie ne revenait toujours pas
  rationale: Le début du verset est syntaxiquement difficile et elliptique. Cette formulation exprime naturellement qu’aucun retour n’avait encore eu lieu, tout en signalant l’autre compréhension possible en note.
- source_word: וְשֻׁבָה
  choice: Retourne
  rationale: L’impératif de שוב appelle Jérémie à revenir auprès de Guedalia ; « retourne » est direct et idiomatique.
- source_word: אֶל גְּדַלְיָה בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: auprès de Guedalia, fils d’Ahiqam et petit-fils de Shafan
  rationale: La seconde filiation est explicitée en français par « petit-fils », ce qui évite une succession lourde de « fils de » sans modifier la généalogie.
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בְּעָרֵי יְהוּדָה
  choice: que le roi de Babylone a établi responsable des villes de Juda
  rationale: Le hifil de פקד indique ici une nomination à une fonction administrative. « Établi responsable » restitue cette autorité sans préciser davantage le titre.
- source_word: וְשֵׁב אִתּוֹ בְּתוֹךְ הָעָם
  choice: et reste auprès de lui au milieu du peuple
  rationale: ישב peut signifier s’asseoir, demeurer, habiter ou rester. « Reste auprès de lui » convient à l’invitation adressée à Jérémie, tandis que « au milieu du peuple » conserve l’image hébraïque.
- source_word: אוֹ אֶל כָּל הַיָּשָׁר בְּעֵינֶיךָ לָלֶכֶת לֵךְ
  choice: Ou bien, va partout où bon te semble
  rationale: Cette tournure française naturelle rend l’expression idiomatique « ce qui est droit à tes yeux » et la liberté de destination, sans suggérer un jugement moral absolu.
- source_word: רַב טַבָּחִים
  choice: le chef de la garde
  rationale: Dans ce contexte, ce titre babylonien désigne le haut responsable militaire chargé des prisonniers et des mesures prises après la conquête. « Chef de la garde » est clair et traditionnel sans retenir le sens littéral possible de « chef des exécuteurs ».
- source_word: אֲרֻחָה
  choice: des vivres
  rationale: Le nom désigne une provision alimentaire ou une ration. « Des vivres » convient au contexte du départ de Jérémie.
- source_word: וּמַשְׂאֵת
  choice: un présent
  rationale: Le terme peut désigner ce qui est porté, une portion, une allocation ou un don. En parallèle avec les vivres, « un présent » rend probablement une gratification supplémentaire tout en laissant les autres possibilités en note.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: et le laissa partir
  rationale: Le verbe signifie envoyer ou renvoyer. Dans le contexte de la libération de Jérémie, « le laissa partir » exprime naturellement qu’il fut relâché.
theological_decisions:
- issue: Sujet implicite et formulation elliptique au début du verset
  choice: Nommer Jérémie et Nebouzaradan dans la traduction courante
  alternative: '« Alors qu’il n’était pas encore revenu : “Retourne auprès de Guedalia…” »'
  rationale: L’hébreu passe abruptement de la proposition difficile à l’impératif sans verbe de parole exprimé. Le contexte immédiat identifie Jérémie comme destinataire et Nebouzaradan comme locuteur. Les noms rendent la scène intelligible, tandis que la note conserve l’ambiguïté textuelle.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe narrative est clarifiée par l’ajout contextuel des noms de Jérémie et de Nebouzaradan. Les idiomes sont rendus naturellement, tandis que l’image « au milieu du peuple » est conservée. Les trois appels de note figurent au point précis auquel chacun se rapporte.
