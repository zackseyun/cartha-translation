- from: 'Mais comme Jérémie ne revenait toujours pas[a], Nebouzaradan lui dit : « Retourne auprès de Guedalia, fils d’Ahiqam et petit-fils de Shafan, que le roi de Babylone a établi responsable des villes de Juda, et reste auprès de lui au milieu du peuple. Ou bien, va partout où bon te semble. » Puis le chef de la garde lui donna des vivres[b] et un présent[c], et le laissa partir.'
  to: 'Mais, comme Jérémie n’était toujours pas revenu[a], Nebouzaradan lui dit : « Retourne auprès de Guedalia, fils d’Ahiqam et petit-fils de Shafan, que le roi de Babylone a établi responsable des villes de Juda, et reste auprès de lui au milieu du peuple. Ou bien, va partout où bon te semble. » Puis le chef de la garde lui donna des vivres[b] et un présent[c], et le laissa partir.'
  rationale: 'Une seule correction sûre est nécessaire : le remplacement de l''imparfait « ne revenait toujours pas » par le plus-que-parfait « n’était toujours pas revenu ». Cette modification préserve l''ambiguïté signalée en note, mais évite d''attribuer au texte une nuance durative ou volitive qui n''est pas requise. Les autres choix sont fidèles, idiomatiques et correctement documentés par les notes.'
