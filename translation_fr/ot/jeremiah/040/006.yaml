  text: וַ/יָּבֹ֧א יִרְמְיָ֛הוּ אֶל גְּדַלְיָ֥ה בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֵּ֤שֶׁב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם הַ/נִּשְׁאָרִ֖ים בָּ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/006.yaml
  text: So Jeremiah went to Gedaliah son of Ahikam at Mizpah[a], and he lived with him among the people who were left in the land.
translation:
  language: fr
  text: Jérémie se rendit donc auprès de Guedalia, fils d’Ahiqam, à Mitspa, et il habita avec lui parmi le peuple resté dans le pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui avaient été laissés ».
    reason: 'Alternative lexicale : le participe niphal peut désigner ceux qui restaient ou ceux qui avaient été laissés.'
lexical_decisions:
- source_word: וַיָּבֹא
  choice: se rendit
  rationale: Dans ce récit de déplacement, בוא indique que Jérémie va rejoindre Guedalia. « Se rendit auprès de » est naturel en français et exprime clairement le mouvement vers une personne.
- source_word: גְּדַלְיָה בֶן אֲחִיקָם
  choice: Guedalia, fils d’Ahiqam
  rationale: Les noms propres sont translittérés selon l’usage biblique français courant, et le patronyme hébreu est conservé.
- source_word: הַמִּצְפָּתָה
  choice: à Mitspa
  rationale: La terminaison directionnelle signale un mouvement vers Mitspa, mais après « auprès de Guedalia », le français présente naturellement Mitspa comme le lieu où celui-ci se trouve.
- source_word: וַיֵּשֶׁב
  choice: il habita
  rationale: Dans ce contexte, ישב désigne le fait de demeurer ou de vivre quelque part, et non simplement de s’asseoir.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: La formule renvoie naturellement à Guedalia et exprime l’association de Jérémie avec lui.
- source_word: בְּתוֹךְ הָעָם
  choice: parmi les gens
  rationale: « Parmi » rend naturellement le sens social de בְּתוֹךְ, tandis que « les gens » désigne ici la population sans lourdeur.
- source_word: הַנִּשְׁאָרִים
  choice: qui étaient restés
  rationale: Le participe niphal décrit ceux qui demeuraient encore dans le pays. Cette formulation évite d’introduire le terme théologiquement plus chargé de « reste ».
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Cette traduction conserve l’expression hébraïque sans préciser explicitement « Juda », que le contexte permet toutefois d’identifier.
theological_decisions:
- issue: Risque de donner à הַנִּשְׁאָרִים le sens technique de « reste »
  choice: les gens qui étaient restés
  alternative: le reste du peuple
  rationale: L’hébreu emploie ici un participe descriptif plutôt qu’un substantif technique. La traduction retenue préserve le sens immédiat sans ajouter une portée théologique non explicitée.
translation_notes:
  register: Français moderne, international et digne. « Se rendit auprès de » évite la répétition maladroite de deux compléments introduits par « à ». Le marqueur de note est placé après l’expression qu’il explique, contrairement à son emplacement manifestement décalé dans la couche de consultation anglaise.
