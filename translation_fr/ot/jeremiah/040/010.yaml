source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִ֤י יֹשֵׁב֙ בַּ/מִּצְפָּ֔ה לַֽ/עֲמֹד֙ לִ/פְנֵ֣י הַ/כַּשְׂדִּ֔ים אֲשֶׁ֥ר יָבֹ֖אוּ אֵלֵ֑י/נוּ וְ/אַתֶּ֡ם אִסְפוּ֩ יַ֨יִן וְ/קַ֜יִץ וְ/שֶׁ֗מֶן וְ/שִׂ֨מוּ֙ בִּ/כְלֵי/כֶ֔ם וּ/שְׁב֖וּ בְּ/עָרֵי/כֶ֥ם אֲשֶׁר תְּפַשְׂתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/010.yaml
  text: As for me[a], behold, I am staying at Mizpah to stand before the Chaldeans who come to us. But you, gather wine, summer fruit, and oil, put them in your containers[b], and dwell in your cities that you have taken.
translation:
  language: fr
  text: 'Quant à moi, me voici : je reste à Mitspa pour me tenir devant[b] les Chaldéens[a] qui viendront chez nous. Quant à vous, recueillez du vin, des fruits d’été et de l’huile, mettez-les dans vos récipients et habitez dans les villes dont vous avez pris possession.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Babyloniens ».
    reason: lexical_alternative
  - marker: b
    text: « Me tenir devant » peut aussi évoquer ici le fait de se présenter devant eux ou d’exercer une fonction officielle auprès d’eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: me voici
  rationale: Conserve la force déictique et emphatique de la formule hébraïque dans un français naturel et digne.
- source_word: יֹשֵׁב
  choice: je reste
  rationale: Le participe désigne ici le fait de demeurer sur place, et non la posture assise.
- source_word: לַעֲמֹד לִפְנֵי
  choice: pour me tenir devant
  rationale: Maintient l’image hébraïque sans trancher entre la présence devant une autorité et une fonction officielle de représentation ou de service.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Rend directement l’ethnonyme hébreu; dans ce contexte, il désigne la puissance babylonienne.
- source_word: יָבֹאוּ אֵלֵינוּ
  choice: qui viendront chez nous
  rationale: Le futur exprime naturellement la venue attendue des autorités chaldéennes à Mitspa.
- source_word: אִסְפוּ
  choice: recueillez
  rationale: Ce verbe convient à la collecte des trois produits énumérés sans imposer un procédé agricole précis.
- source_word: קַיִץ
  choice: des fruits d’été
  rationale: Préserve la valeur saisonnière du nom sans le limiter aux figues.
- source_word: שִׂימוּ בִּכְלֵיכֶם
  choice: mettez-les dans vos récipients
  rationale: « Récipients » garde le sens large de כְּלִי sans préciser indûment la forme ou la matière.
- source_word: וּשְׁבוּ
  choice: habitez
  rationale: Dans ce contexte, le verbe signifie résider dans les villes plutôt que s’asseoir.
- source_word: תְּפַשְׂתֶּם
  choice: dont vous avez pris possession
  rationale: Exprime la prise de contrôle des villes sans ajouter une violence militaire qui n’est pas explicitée par le contexte immédiat.
theological_decisions:
- issue: Portée de « se tenir devant » les Chaldéens
  choice: Conserver l’expression imagée dans le texte et signaler sa possible portée officielle en note.
  alternative: Traduire directement par « vous représenter auprès des Chaldéens » ou « être à leur service ».
  rationale: L’hébreu permet une nuance de présence, de service ou de représentation officielle; la traduction ne doit pas résoudre cette ambiguïté de façon prématurée.
translation_notes:
  register: Français international actuel, lisible et digne. « Me voici » conserve l’emphase hébraïque; « Mitspa » suit la forme française biblique usuelle. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
