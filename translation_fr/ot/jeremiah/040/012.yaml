revisions:
- from: Alors tous les Judéens[a] revinrent de tous les endroits où ils avaient été dispersés[b]. Ils arrivèrent au pays de Juda, auprès de Guedalia, à Mitspa, et récoltèrent du vin et des fruits d’été[c] en très grande quantité.
  to: Alors tous les Judéens[a] revinrent de tous les lieux où ils avaient été chassés[b]. Ils arrivèrent au pays de Juda, auprès de Guedalia, à Mitspa, et amassèrent une très grande quantité de vin et de fruits d’été[c].
  rationale: La révision rend explicitement la nuance passive de déplacement subi portée par נדחו et emploie un verbe français qui convient à la fois au vin et aux fruits sans imposer l’idée, plus étroite, de récolte. La structure narrative, les noms et l’intensité quantitative du texte hébreu sont conservés.
