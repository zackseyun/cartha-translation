base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/012.yaml
  text: Then all the Judeans returned from all the places where they had been driven[a], and they came to the land of Judah, to Gedaliah at Mizpah[c][b], and gathered a very great abundance of wine and summer fruit.
translation:
  language: fr
  text: Alors tous les Judéens[a] revinrent de tous les lieux où ils avaient été chassés[b]. Ils arrivèrent au pays de Juda, auprès de Guedalia, à Mitspa, et amassèrent une très grande quantité de vin et de fruits d’été[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les Juifs ». Le terme hébreu peut désigner les habitants de Juda et, par extension, les Juifs ; ici, « Judéens » souligne le cadre historique lié au pays de Juda.
    reason: lexical_alternative
  - marker: b
    text: Ou « où ils avaient été bannis » ou « dispersés ».
    reason: lexical_alternative
  - marker: c
    text: Les « fruits d’été » sont des produits saisonniers recueillis en été ou vers la fin de l’été.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: revinrent
  rationale: Le verbe שוב décrit ici le retour concret des personnes déplacées vers le pays de Juda.
- source_word: כָל הַיְּהוּדִים
  choice: tous les Judéens
  rationale: Dans ce cadre historique et géographique, le terme désigne les gens de Juda; « Judéens » évite d’effacer cette nuance, tout en signalant « Juifs » en note.
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: où ils avaient été dispersés
  rationale: Le niphal de נדח peut exprimer le fait d’être chassé, banni ou dispersé. « Dispersés » est naturel en français et préserve l’idée d’un déplacement subi.
- source_word: וַיָּבֹאוּ אֶרֶץ יְהוּדָה
  choice: Ils arrivèrent au pays de Juda
  rationale: Cette formulation française rend naturellement le mouvement vers le territoire de Juda.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּתָה
  choice: auprès de Guedalia, à Mitspa
  rationale: La formulation indique à la fois que les revenants rejoignent Guedalia et que celui-ci se trouve à Mitspa.
- source_word: וַיַּאַסְפוּ
  choice: récoltèrent
  rationale: Dans le contexte du vin et des fruits saisonniers, אסף désigne leur collecte agricole; « récoltèrent » est plus idiomatique ici que « rassemblèrent ».
- source_word: יַיִן
  choice: du vin
  rationale: Traduction courante et directe de יין.
- source_word: וָקַיִץ
  choice: des fruits d’été
  rationale: קיץ désigne les fruits ou produits saisonniers récoltés en été ou à la fin de l’été.
- source_word: הַרְבֵּה מְאֹד
  choice: en très grande quantité
  rationale: Cette expression restitue de façon naturelle l’intensification quantitative de l’hébreu.
