  to: Ismaël, fils de Netania, Yohanan et Yonatan, fils de Qaréah, Seraya, fils de Tanhoumeth, les fils d’Éfaï le Netophatite[a], et Yezania, fils du Maakatite[b], vinrent auprès de Guedalia, à Mitspa, eux et leurs hommes.
  rationale: La révision restitue explicitement la formule finale « eux et leurs hommes » et retire de la note b un rapprochement onomastique non suffisamment fondé. Les noms, les patronymes, le gentilé et l’incertitude de la transcription d’Éfaï sont par ailleurs conservés, de même que les ancres de notes appropriées.
