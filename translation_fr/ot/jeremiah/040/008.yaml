base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/008.yaml
  text: Then Ishmael son of Nethaniah[a], and Johanan and Jonathan the sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite[b], and Jezaniah son of the Maacathite—they and their men—came to Gedaliah at Mizpah.
translation:
  language: fr
  text: Ismaël, fils de Netania, Yohanan et Yonatan, fils de Qaréah, Seraya, fils de Tanhoumeth, les fils d’Éfaï le Netophatite[a], et Yezania, fils du Maakatite[b], vinrent auprès de Guedalia, à Mitspa, eux et leurs hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu peut aussi être transcrit « Ofaï »; sa forme est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le nom Yezania peut aussi être transcrit « Yezaniahou ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל גְּדַלְיָה הַמִּצְפָּתָה
  choice: Ils vinrent auprès de Guedalia à Mitspa
  rationale: Le verbe בוא exprime ici le déplacement vers Guedalia; la forme directive de «Mitspa» indique le lieu vers lequel ils se rendent. «Auprès de» évite de faire de Guedalia le simple terme abstrait du mouvement et reste naturel en français.
- source_word: וְיִשְׁמָעֵאל בֶּן נְתַנְיָהוּ
  choice: Ismaël, fils de Netania
  rationale: Transcription française courante des noms bibliques et maintien explicite du patronyme hébreu.
- source_word: וְיוֹחָנָן וְיוֹנָתָן בְּנֵי קָרֵחַ
  choice: Yohanan et Yonatan, fils de Qaréah
  rationale: Le pluriel בְּנֵי rattache clairement les deux hommes à Qaréah. Les graphies choisies distinguent les deux noms hébreux et les transcrivent de manière cohérente.
- source_word: וּשְׂרָיָה בֶן תַּנְחֻמֶת
  choice: Seraya, fils de Tanhoumeth
  rationale: Le patronyme est conservé sous sa forme explicite; les noms sont adaptés à une lecture française moderne.
- source_word: וּבְנֵי עופי הַנְּטֹפָתִי
  choice: les fils d’Éfaï le Netophatite[a]
  rationale: Le texte consonantique transmis est rendu comme un nom propre, «Éfaï», tandis que le gentilé est conservé. La construction laisse grammaticalement «le Netophatite» qualifier Éfaï, comme en hébreu.
- source_word: וִיזַנְיָהוּ בֶּן הַמַּעֲכָתִי
  choice: Yezania, fils du Maakatite[b]
  rationale: Le nom est transcrit dans une forme française lisible; הַמַּעֲכָתִי est un gentilé substantivé désignant le père par son origine.
- source_word: הֵמָּה וְאַנְשֵׁיהֶם
  choice: avec leurs hommes
  rationale: Cette finale récapitulative indique que chacun des chefs nommés est accompagné de ses hommes. L’intégration en fin de phrase rend l’hébreu idiomatique sans perdre l’information.
theological_decisions: []
