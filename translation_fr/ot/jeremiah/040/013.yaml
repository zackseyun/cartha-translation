reference: Jeremiah 40:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/כָל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר בַּ/שָּׂדֶ֑ה בָּ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/013.yaml
  text: And Johanan son of Kareah[a], and all the commanders of the forces who were in the open country, came to Gedaliah at Mizpah.
translation:
  language: fr
  text: Yohanân, fils de Qaréah, et tous les chefs des troupes qui se trouvaient dans la campagne[a] vinrent trouver Guedalia à Mitspa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les champs ». L’expression hébraïque peut désigner littéralement le champ ou les champs, ou plus largement la campagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֽוֹחָנָן
  choice: Yohanân
  rationale: Le waw assure ici la continuité narrative et n’a pas besoin d’être rendu explicitement en français. Le nom hébreu est translittéré sous une forme lisible qui conserve sa consonne initiale.
- source_word: בֶּן קָרֵחַ
  choice: fils de Qaréah
  rationale: Rend directement le patronyme hébreu; la graphie « Qaréah » distingue la consonne initiale hébraïque de celle de Yohanân.
- source_word: וְ/כָל שָׂרֵי הַ/חֲיָלִים
  choice: et tous les chefs des troupes
  rationale: שָׂרֵי désigne des responsables ou commandants, et חֲיָלִים les forces militaires; « chefs des troupes » est naturel, actuel et adapté au contexte.
- source_word: אֲשֶׁר בַּ/שָּׂדֶה
  choice: qui se trouvaient dans la campagne
  rationale: Le singulier collectif שָּׂדֶה peut désigner le champ au sens littéral ou, plus largement ici, la campagne hors des centres habités. Une note préserve l’alternative plus littérale.
- source_word: בָּ֥אוּ אֶל גְּדַלְיָהוּ
  choice: vinrent trouver Guedalia
  rationale: בוא exprime un déplacement vers Guedalia. « Vinrent trouver » évite la tournure lourde « vinrent auprès de » et indique naturellement qu’ils se rendirent auprès de lui.
- source_word: הַ/מִּצְפָּתָ/ה
  choice: à Mitspa
  rationale: Le hé directionnel marque le mouvement vers Mitspa; dans la syntaxe française, « à Mitspa » situe Guedalia au lieu où le groupe vient le trouver tout en conservant la valeur de destination.
theological_decisions: []
