  text: וְ/גַ֣ם כָּֽל הַ/יְּהוּדִ֡ים אֲשֶׁר בְּ/מוֹאָ֣ב וּ/בִ/בְנֵֽי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וַ/אֲשֶׁ֤ר בְּ/כָל הָֽ/אֲרָצוֹת֙ שָֽׁמְע֔וּ כִּֽי נָתַ֧ן מֶֽלֶךְ בָּבֶ֛ל שְׁאֵרִ֖ית לִֽ/יהוּדָ֑ה וְ/כִי֙ הִפְקִ֣יד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/011.yaml
  text: Also[a], all the Judeans who were in Moab, among the Ammonites, in Edom, and in all the other lands heard that the king of Babylon had left a remnant for Judah and had appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: fr
  text: Tous les Judéens qui se trouvaient en Moab, chez les Ammonites, en Édom et dans tous les pays apprirent eux aussi que le roi de Babylone avait laissé un reste[a] à Juda et qu’il avait établi sur eux Guedalia, fils d’Ahiqam, fils de Shafân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des survivants ». Le terme hébreu peut désigner plus généralement ceux qui sont restés en vie après une catastrophe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: eux aussi
  rationale: Cette tournure conserve la valeur additive du groupe hébreu tout en l’intégrant naturellement au sujet en français.
- source_word: כָּל הַיְּהוּדִים
  choice: tous les Judéens
  rationale: Dans ce contexte territorial et exilique, « Judéens » désigne clairement les gens rattachés à Juda, sans privilégier le sens religieux plus tardif que peut évoquer « Juifs ».
- source_word: אֲשֶׁר בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדֹם וַאֲשֶׁר בְּכָל הָאֲרָצוֹת
  choice: qui se trouvaient en Moab, chez les Ammonites, en Édom et dans tous les autres pays
  rationale: « Chez les Ammonites » rend idiomatiquement le nom de peuple בְּנֵי עַמּוֹן. « Autres » explicite naturellement l’élargissement au-delà des régions déjà nommées, sans modifier le sens.
- source_word: שָׁמְעוּ
  choice: apprirent
  rationale: Dans ce contexte de transmission d’une nouvelle, « apprirent » exprime naturellement le sens de « entendirent dire ».
- source_word: כִּי נָתַן מֶלֶךְ בָּבֶל שְׁאֵרִית לִיהוּדָה
  choice: que le roi de Babylone avait laissé un reste pour Juda
  rationale: « Avait laissé » rend la valeur contextuelle de נָתַן après la catastrophe. « Un reste » maintient le terme prophétique important שְׁאֵרִית, tandis que « pour Juda » conserve la relation exprimée par לִיהוּדָה sans la préciser davantage.
- source_word: וְכִי הִפְקִיד עֲלֵיהֶם
  choice: et qu’il avait établi sur eux
  rationale: Le hiphil de פקד indique ici que Guedalia a été placé en position d’autorité. « Établi sur eux » conserve cette relation de gouvernement dans un registre biblique clair.
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: Guedalia, fils d’Ahiqam et petit-fils de Shafân
  rationale: Les formes françaises usuelles des noms sont retenues. « Petit-fils de Shafân » communique sans ambiguïté la chaîne généalogique et évite la répétition potentiellement équivoque de « fils de » en français courant.
theological_decisions:
- issue: Traduction de שְׁאֵרִית
  choice: un reste
  alternative: des survivants
  rationale: « Un reste » préserve la résonance lexicale et canonique du terme dans la littérature prophétique, sans imposer ici une interprétation doctrinale. La note signale son sens historique concret de personnes demeurées en vie.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la portée générale de « tous », les lieux de dispersion et la relation d’autorité, tout en évitant un calque lourd de la syntaxe hébraïque.
