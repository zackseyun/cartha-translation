translation_notes:
  register: 'Français international moderne, narratif et digne. La phrase reste ouverte par une virgule parce que le verset 7 forme une proposition temporelle dont la principale apparaît au verset 8. Les noms propres suivent des formes françaises transparentes : Guedalia et Ahiqam.'
