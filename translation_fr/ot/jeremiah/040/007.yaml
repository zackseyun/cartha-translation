  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים אֲשֶׁ֣ר בַּ/שָּׂדֶ֗ה הֵ֚מָּה וְ/אַנְשֵׁי/הֶ֔ם כִּֽי הִפְקִ֧יד מֶֽלֶךְ בָּבֶ֛ל אֶת גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם בָּ/אָ֑רֶץ וְ/כִ֣י הִפְקִ֣יד אִתּ֗/וֹ אֲנָשִׁ֤ים וְ/נָשִׁים֙ וָ/טָ֔ף וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ מֵ/אֲשֶׁ֥ר לֹֽא הָגְל֖וּ בָּבֶֽלָ/ה־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/007.yaml
  text: When all the commanders of the forces who were in the open country[a], they and their men, heard that the king of Babylon had appointed Gedaliah son of Ahikam over the land, and that he had entrusted to him men, women, children, and some of the poorest of the land, from those who had not been exiled to Babylon[c][b],
translation:
  language: fr
  text: Lorsque tous les chefs des troupes qui se trouvaient dans la campagne[a], eux et leurs hommes, apprirent que le roi de Babylone avait établi Guedalia, fils d’Ahikam, à la tête du pays et qu’il lui avait confié des hommes, des femmes, des enfants et quelques-uns des plus pauvres du pays, parmi ceux qui n’avaient pas été déportés à Babylone[c][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en rase campagne » ; littéralement « dans le champ ».
    reason: lexical_alternative
  - marker: b
    text: Ou « quelques-uns des humbles du pays » ou « des pauvres du pays ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ceux qu’ils n’avaient pas déportés à Babylone » ; les agents ne sont pas nommés.
    reason: source_ambiguity
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: les chefs des troupes
  rationale: שָׂרֵי désigne des chefs ou responsables, et הַחֲיָלִים des forces militaires. « Chefs des troupes » est naturel en français moderne sans préciser indûment leur grade.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: Littéralement « dans le champ » ; dans ce contexte narratif, l’expression désigne le territoire ouvert, hors des centres urbains. « Dans la campagne » rend cet emploi idiomatique.
- source_word: וְאַנְשֵׁיהֶם
  choice: et leurs hommes
  rationale: Traduction directe qui convient au cadre militaire tout en évitant de préciser que tous étaient nécessairement des soldats réguliers.
- source_word: הִפְקִיד
  choice: avait établi
  rationale: À la première occurrence, le verbe exprime la désignation officielle de Guedalia à une fonction d’autorité.
- source_word: בָּאָרֶץ
  choice: à la tête du pays
  rationale: Avec הִפְקִיד, la préposition marque ici le domaine placé sous son autorité. Cette formulation française exprime clairement la juridiction sans ajouter de titre.
- source_word: הִפְקִיד אִתּוֹ
  choice: lui avait confié
  rationale: À la seconde occurrence, le verbe indique que des personnes sont remises à la charge de Guedalia ; « confié » rend naturellement cette nuance.
- source_word: אֲנָשִׁים וְנָשִׁים וָטָף
  choice: les hommes, les femmes, les enfants
  rationale: טָף désigne les petits enfants ou, plus largement, les enfants. La formulation est claire et actuelle.
- source_word: מִדַּלַּת הָאָרֶץ
  choice: une partie des petites gens du pays
  rationale: La préposition מִן a une valeur partitive, tandis que דַּלַּת désigne la population de condition humble. « Petites gens » conserve la dimension sociale sans limiter le sens à la seule pauvreté économique.
- source_word: מֵאֲשֶׁר לֹא הָגְלוּ בָּבֶלָה
  choice: ceux qui n’avaient pas été déportés à Babylone
  rationale: L’hébreu emploie un actif pluriel à sujet non exprimé, littéralement « ceux qu’ils n’avaient pas déportés ». Le passif français préserve le sens sans identifier les agents.
- source_word: וַיִּשְׁמְעוּ
  choice: Lorsque … apprirent
  rationale: Le wayyiqtol poursuit le récit, mais la phrase se prolonge syntaxiquement au verset suivant. « Lorsque » rend cette subordination sans ajouter un marqueur tel que « or » ou « alors ».
