  text: וַ/יִּקַּ֥ח רַב טַבָּחִ֖ים לְ/יִרְמְיָ֑הוּ וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֣ה אֱלֹהֶ֗י/ךָ דִּבֶּר֙ אֶת הָ/רָעָ֣ה הַ/זֹּ֔את אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/002.yaml
  text: Then the captain of the guard took Jeremiah and said to him[b][a], “Yahweh your God spoke this disaster against this place.”
translation:
  language: fr
  text: 'Le chef de la garde[a] prit alors Jérémie et lui dit : « Yahweh, ton Dieu, a annoncé ce malheur[b] contre ce lieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « chef des bouchers » ou « des exécuteurs » ; elle désigne couramment un titre officiel rendu par « chef de la garde ».
    reason: Note culturelle et lexicale sur רַב טַבָּחִים.
  - marker: b
    text: Le terme hébreu peut aussi signifier « désastre », « calamité » ou « mal », selon le contexte.
    reason: Note lexicale sur רָעָה.
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: le chef de la garde
  rationale: Il s’agit d’un titre officiel babylonien. Cette formulation française est naturelle et reconnue, tandis que le sens littéral lié aux exécuteurs est signalé en note.
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe signifie fondamentalement « prendre » et peut ici évoquer la prise en charge ou la mise en présence de Jérémie sans préciser davantage le geste.
- source_word: לְיִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française usuelle du nom propre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription courante en français du nom divin, qui préserve son caractère de nom propre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier marque l’adresse personnelle à Jérémie; le tutoiement convient au discours direct biblique en français actuel.
- source_word: דִּבֶּר
  choice: avait annoncé
  rationale: Dans le contexte d’un malheur désormais accompli, « avait annoncé » rend naturellement l’idée de parole déclarée antérieurement, tout en conservant le rapport au discours divin.
- source_word: הָרָעָה הַזֹּאת
  choice: ce malheur
  rationale: Ici רָעָה désigne une calamité ou un désastre frappant Jérusalem, plutôt que le mal moral. « Malheur » conserve néanmoins une part de l’étendue sémantique du terme.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: contre ce lieu
  rationale: Avec l’annonce d’un jugement, אֶל indique ici la direction hostile de la parole; « contre » est idiomatique et « ce lieu » garde la formulation du texte.
theological_decisions:
- issue: Sens de רָעָה dans une déclaration attribuée à Yahweh
  choice: ce malheur
  alternative: ce désastre ; ce mal
  rationale: Le contexte vise la catastrophe judiciaire annoncée contre Jérusalem. « Malheur » évite d’attribuer explicitement le mal moral à Dieu, sans effacer la tension lexicale du mot hébreu; les autres sens possibles sont indiqués en note.
translation_notes:
  register: Français international moderne, digne et direct. Le passé antérieur du discours est rendu par le plus-que-parfait « avait annoncé », naturel puisque la catastrophe annoncée s’est déjà produite. Une seule note rassemble les précisions sur le titre babylonien et sur l’ambiguïté de רָעָה.
