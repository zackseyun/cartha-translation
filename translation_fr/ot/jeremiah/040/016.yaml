  yaml_path: translation/ot/jeremiah/040/016.yaml
  text: But Gedaliah son of Ahikam said to Johanan son of Kareah, “Do not do this thing, for you are speaking a lie about Ishmael.”
translation:
  language: fr
  text: 'Mais Guedalia, fils d’Ahikam, dit à Yohanan, fils de Qaréah : « Ne fais pas cela, car ce que tu dis au sujet d’Ismaël est faux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תעש אֶת־הַדָּבָר הַזֶּה
  choice: Ne fais pas cela
  rationale: Expression française naturelle qui restitue l’interdiction littérale « ne fais pas cette chose » sans lourdeur.
- source_word: כִּי שֶׁקֶר אַתָּה דֹבֵר אֶל־יִשְׁמָעֵאל
  choice: car ce que tu dis au sujet d’Ismaël est faux
  rationale: שֶׁקֶר désigne ici une affirmation mensongère ou fausse. La tournure française conserve l’accusation nette sans imposer que Yohanan mente sciemment. אֶל est compris contextuellement au sens de « au sujet de », puisque Yohanan parle à Guedalia d’Ismaël.
