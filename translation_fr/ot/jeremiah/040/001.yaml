source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה אַחַ֣ר שַׁלַּ֣ח אֹת֗/וֹ נְבוּזַרְאֲדָ֛ן רַב טַבָּחִ֖ים מִן הָֽ/רָמָ֑ה בְּ/קַחְתּ֣/וֹ אֹת֗/וֹ וְ/הֽוּא אָס֤וּר בָּֽ/אזִקִּים֙ בְּ/ת֨וֹךְ כָּל גָּל֤וּת יְרוּשָׁלִַ֨ם֙ וִֽ/יהוּדָ֔ה הַ/מֻּגְלִ֖ים בָּבֶֽלָ/ה־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/001.yaml
  text: 'The word that came to Jeremiah from Yahweh after Nebuzaradan[a], the captain of the guard, had sent him away from Ramah, when he had taken him while he was bound in chains among all the exiles of Jerusalem and Judah who were being exiled to Babylon:'
translation:
  language: fr
  text: 'La parole qui fut adressée à Jérémie de la part de Yahweh, après que Nebouzaradan, chef de la garde[a], l’eut laissé partir de Rama, lorsqu’il le prit alors que Jérémie était lié de chaînes parmi tous les déportés de Jérusalem et de Juda que l’on déportait à Babylone :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef des exécuteurs ». Le titre hébreu désigne littéralement le chef de ceux qui mettent à mort, probablement un haut responsable de la garde royale chargé notamment des exécutions.
    reason: Alternative lexicale et explication d’un titre administratif ancien.
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Conserve la formule prophétique traditionnelle et le caractère de message divin du terme.
- source_word: הָיָה אֶל
  choice: fut adressée à
  rationale: Rend naturellement en français l’expression prophétique selon laquelle la parole divine parvient au prophète.
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: Exprime explicitement la provenance de la parole et translittère le nom divin.
- source_word: אַחַר שַׁלַּח אֹתוֹ
  choice: après que… l’eut laissé partir
  rationale: Le verbe peut signifier envoyer ou relâcher; dans ce contexte de captivité, « laisser partir » reste naturel sans surinterpréter le statut juridique.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Rend de façon intelligible le titre d’un haut officier royal; le sens plus littéral lié aux exécutions est signalé en note.
- source_word: בְּקַחְתּוֹ אֹתוֹ
  choice: lorsqu’il l’avait pris
  rationale: Conserve la valeur temporelle de la construction hébraïque et situe cette action avant la libération mentionnée.
- source_word: וְהוּא אָסוּר בָּאזִקִּים
  choice: alors que Jérémie était lié de chaînes
  rationale: Exprime la circonstance; la répétition du nom de Jérémie évite l’ambiguïté des pronoms en français.
- source_word: בְּתוֹךְ כָּל גָּלוּת
  choice: parmi tous les déportés
  rationale: Le nom collectif désigne ici concrètement l’ensemble des personnes emmenées en exil.
- source_word: הַמֻּגְלִים בָּבֶלָה
  choice: que l’on déportait à Babylone
  rationale: Le tour impersonnel français préserve le passif hébreu et l’action en cours.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve ici le nom propre divin sans le remplacer par un titre.
- issue: Rapport temporel entre la prise de Jérémie et sa libération
  choice: Situer la prise antérieurement à la libération tout en conservant la construction temporelle
  alternative: 'Reformuler explicitement : « après l’avoir trouvé parmi les déportés »'
  rationale: Le texte dit littéralement que Nebouzaradan l’avait « pris »; la traduction ne remplace pas ce verbe par une interprétation contextuelle plus précise.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase demeure ouverte par un deux-points, comme la formule introductive hébraïque qui se poursuit dans le contexte. « Jérémie » est répété une fois pour lever une ambiguïté pronominale propre au français.
