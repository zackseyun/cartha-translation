  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא אֶל פְּלִשְׁתִּ֑ים בְּ/טֶ֛רֶם יַכֶּ֥ה פַרְעֹ֖ה אֶת עַזָּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/001.yaml
  text: This is the word of Yahweh that came to Jeremiah the prophet concerning the Philistines[b][a], before Pharaoh struck Gaza.
translation:
  language: fr
  text: La parole de Yahweh[b] qui fut adressée au prophète Jérémie au sujet des Philistins[a], avant que le pharaon ne frappe Gaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre les Philistins ». La préposition hébraïque peut introduire le sujet ou la cible d’un oracle et, dans un contexte de jugement, prendre une nuance hostile.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu commence par une construction relative qui sert de titre. On pourrait aussi rendre le début par : « Voici la parole de Yahweh qui fut adressée… »'
    reason: structural_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה
  choice: La parole de Yahweh qui fut adressée
  rationale: La tournure française conserve la construction relative du titre hébreu tout en rendant naturellement la formule prophétique selon laquelle la parole divine est adressée à un prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: au prophète Jérémie
  rationale: La préposition indique ici le destinataire de la parole révélée; « Jérémie » est la forme française usuelle du nom.
- source_word: אֶל פְּלִשְׁתִּים
  choice: au sujet des Philistins
  rationale: Dans un titre d’oracle, אֶל peut introduire le peuple concerné. Cette formulation reste ouverte, sans imposer d’emblée le sens adversatif que le contexte de jugement peut suggérer.
- source_word: בְּטֶרֶם
  choice: avant que
  rationale: Cette locution marque clairement l’antériorité de la parole prophétique par rapport à l’événement mentionné.
- source_word: יַכֶּה
  choice: ne frappe
  rationale: Le verbe נכה signifie couramment « frapper » ou « vaincre ». Le subjonctif après « avant que », accompagné du ne explétif, est naturel en français soutenu sans modifier la négation.
- source_word: פַרְעֹה
  choice: le pharaon
  rationale: Le nom commun avec article correspond naturellement en français au titre royal hébreu dans ce contexte.
- source_word: עַזָּה
  choice: Gaza
  rationale: Il s’agit de la forme française usuelle du nom de lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de אֶל devant « les Philistins »
  choice: au sujet des Philistins
  alternative: contre les Philistins
  rationale: La préposition peut signaler le thème ou la cible d’un oracle. Le contexte est hostile, mais le titre lui-même permet une formulation plus générale; l’autre lecture est donc signalée en note.
translation_notes:
  register: Français international actuel, clair et digne. La formulation garde le caractère de titre de l’hébreu. Le « ne » de « avant que… ne frappe » est explétif et n’exprime aucune négation.
