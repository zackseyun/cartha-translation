source:
  edition: WLC
  text: ה֗וֹי חֶ֚רֶב לַֽ/יהוָ֔ה עַד אָ֖נָה לֹ֣א תִשְׁקֹ֑טִי הֵאָֽסְפִי֙ אַל תַּעְרֵ֔/ךְ הֵרָגְעִ֖י וָ/דֹֽמִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/006.yaml
  text: Ah, sword of the LORD, how long will you not be quiet? Return to your sheath; rest and be still.
translation:
  language: fr
  text: Ah ! Épée du SEIGNEUR, jusqu’à quand ne t’apaiseras-tu pas ? Rentre dans ton fourreau ; repose-toi et garde le silence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Ah !
  rationale: Cette interjection exprime ici une plainte ou une lamentation adressée à l’épée ; « Ah ! » conserve cette force sans imposer nécessairement l’idée de malheur contenue dans « Hélas ! ».
- source_word: חֶרֶב לַיהוָה
  choice: épée du SEIGNEUR
  rationale: Le syntagme désigne l’épée associée à YHWH, instrument de son jugement. « Du SEIGNEUR » restitue naturellement la relation exprimée par לַ en français.
- source_word: עַד־אָנָה לֹא תִשְׁקֹטִי
  choice: jusqu’à quand ne resteras-tu pas tranquille ?
  rationale: La formulation conserve la question négative et la personnification féminine de l’épée, tout en employant un français compréhensible.
- source_word: הֵאָסְפִי אֶל־תַּעְרֵךְ
  choice: Rentre dans ton fourreau
  rationale: L’expression hébraïque signifie littéralement « rassemble-toi/retire-toi vers ton fourreau ». « Rentre dans ton fourreau » en transmet naturellement l’image et l’impératif.
- source_word: הֵרָגְעִי וָדֹמִּי
  choice: repose-toi et garde le silence
  rationale: Les deux impératifs demandent à l’épée de s’immobiliser et de se taire. Cette traduction maintient leur parallélisme sans les réduire à une seule idée.
theological_decisions:
- issue: Relation entre l’épée et YHWH
  choice: « épée du SEIGNEUR »
  alternative: « épée pour le SEIGNEUR »
  rationale: Dans le contexte, l’épée personnifiée exécute le jugement divin. Le génitif français laisse ouverte la nuance précise d’appartenance ou de mission sans présenter l’épée comme une offrande destinée au SEIGNEUR.
translation_notes:
  register: Français moderne, digne et direct. L’adresse poétique à l’épée est conservée, ainsi que les trois injonctions successives. Les majuscules de « SEIGNEUR » signalent selon la convention biblique française que le texte hébreu porte le nom divin YHWH.
