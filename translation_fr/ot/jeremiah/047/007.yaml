- from: Comment pourrais-tu rester tranquille, puisque Yahweh lui a donné cet ordre ? Contre Ashkelon et contre le littoral — c’est là qu’il lui a fixé sa mission[a][b].
  to: Comment pourrais-tu rester tranquille, alors que Yahweh lui a ordonné d’aller contre Ashkelon et contre le littoral ? C’est là qu’il l’a destinée[a][b].
