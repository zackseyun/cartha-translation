source:
  edition: WLC
  text: אֵ֣יךְ תִּשְׁקֹ֔טִי וַֽ/יהוָ֖ה צִוָּה לָ֑/הּ אֶֽל אַשְׁקְל֛וֹן וְ/אֶל ח֥וֹף הַ/יָּ֖ם שָׁ֥ם יְעָדָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/007.yaml
  text: How can you be quiet when Yahweh has commanded it? Against Ashkelon and against the seacoast—there he has appointed it[a][b].
translation:
  language: fr
  text: Comment pourrais-tu rester tranquille, alors que Yahweh lui a ordonné d’aller contre Ashkelon et contre le littoral ? C’est là qu’il l’a destinée[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, les suffixes pronominaux sont au féminin singulier et renvoient à l’épée personnifiée au verset précédent.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vers Ashkelon et vers le rivage de la mer » ; la préposition signifie littéralement « vers », mais, dans ce contexte, elle indique la destination hostile de l’épée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment pourrais-tu
  rationale: Introduit une question rhétorique exprimant l’impossibilité pour l’épée de rester inactive; le conditionnel est naturel en français.
- source_word: תִּשְׁקֹטִי
  choice: rester tranquille
  rationale: Le féminin singulier s’adresse à l’épée personnifiée du verset précédent; l’expression évoque la cessation de son action.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: צִוָּה לָהּ
  choice: lui a donné cet ordre
  rationale: Préserve le pronom féminin singulier renvoyant à l’épée et rend naturellement l’idée de commandement en français.
- source_word: אֶל אַשְׁקְלוֹן וְאֶל חוֹף הַיָּם
  choice: Contre Ashkelon et contre le littoral
  rationale: Dans ce contexte guerrier, אֶל indique la destination hostile de l’épée; « littoral » rend idiomatiquement חוֹף הַיָּם.
- source_word: שָׁם
  choice: c’est là
  rationale: Reprend avec emphase les deux lieux qui viennent d’être nommés.
- source_word: יְעָדָהּ
  choice: il lui a fixé sa mission
  rationale: Rend le sens d’assigner ou de destiner à une tâche, tout en maintenant le référent féminin de l’épée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription le distingue d’un simple titre.
- issue: Référent des suffixes féminins singuliers
  choice: Pronoms féminins renvoyant à l’épée personnifiée
  alternative: Employer un pronom neutre ou reformuler sans pronom
  rationale: Le français permet de conserver naturellement le genre grammatical d’« épée » et donc la personnification héritée du verset 6.
- issue: Valeur directionnelle ou hostile de אֶל
  choice: contre
  alternative: vers
  rationale: La mission confiée à l’épée est hostile dans le contexte, mais une note conserve la valeur plus littérale possible de la préposition.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification de l’épée est conservée par les pronoms féminins. Le tiret marque la reprise emphatique de la mission divine.
