id: JER.47.3
reference: Jeremiah 47:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/קּ֗וֹל שַֽׁעֲטַת֙ פַּרְס֣וֹת אַבִּירָ֔י/ו מֵ/רַ֣עַשׁ לְ/רִכְבּ֔/וֹ הֲמ֖וֹן גַּלְגִּלָּ֑י/ו לֹֽא הִפְנ֤וּ אָבוֹת֙ אֶל בָּנִ֔ים מֵֽ/רִפְי֖וֹן יָדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/003.yaml
  text: At the sound of the stamping of the hooves of his mighty horses[a], at the rumbling of his chariots, at the roar of his wheels, fathers do not turn to their sons because of the helplessness of their hands.
translation:
  language: fr
  text: Au bruit du martèlement des sabots de ses puissants chevaux, au grondement de ses chars, au fracas de ses roues, les pères ne se tournent pas vers leurs fils, parce que leurs mains sont sans force[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause de la faiblesse de leurs mains » ; cette expression décrit la perte de force ou de courage provoquée par la panique.'
    reason: Explication d’un idiome hébreu et indication de sa forme littérale.
lexical_decisions:
- source_word: מִקּוֹל שַׁעֲטַת פַּרְסוֹת
  choice: Au bruit du martèlement des sabots
  rationale: « Au bruit de » rend naturellement la valeur déclenchante de מִן avec קוֹל. « Martèlement » conserve l’accent auditif de שַׁעֲטַת, tandis que « sabots » traduit concrètement פַּרְסוֹת.
- source_word: אַבִּירָיו
  choice: ses puissants chevaux
  rationale: Dans ce contexte militaire et en association immédiate avec les sabots, אַבִּירָיו désigne les chevaux vigoureux de l’envahisseur plutôt que des « puissants » humains.
- source_word: מֵרַעַשׁ לְרִכְבּוֹ
  choice: au grondement de ses chars
  rationale: רַעַשׁ évoque un bruit qui ébranle ou un grondement. Le singulier collectif רִכְבּוֹ est rendu par le pluriel français « ses chars ».
- source_word: הֲמוֹן גַּלְגִּלָּיו
  choice: au fracas de ses roues
  rationale: הֲמוֹן exprime ici un bruit tumultueux et puissant. « Fracas » convient au mouvement des roues et maintient la progression sonore du verset.
- source_word: לֹא הִפְנוּ אָבוֹת אֶל בָּנִים
  choice: les pères ne se tournent pas vers leurs fils
  rationale: La formulation conserve le mouvement exprimé par פנה ainsi que les termes de parenté masculins précis du texte hébreu.
- source_word: מֵרִפְיוֹן יָדָיִם
  choice: parce que leurs mains sont sans force
  rationale: Cette expression rend intelligible l’image idiomatique de mains devenues faibles ou inertes sous l’effet de la terreur, sans supprimer l’image corporelle.
theological_decisions:
- issue: Termes de parenté genrés
  choice: les pères ... leurs fils
  alternative: les pères ... leurs enfants
  rationale: Le texte hébreu emploie explicitement אָבוֹת (« pères ») et בָּנִים (« fils »). La traduction préserve cette précision au lieu de la généraliser.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le rythme ternaire (« au bruit… au grondement… au fracas… ») reproduit l’accumulation sonore du texte hébreu. L’image des mains est conservée dans le texte et explicitée en note.
