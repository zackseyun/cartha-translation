  variant: modern international French
source:
  edition: WLC
  text: עַל הַ/יּ֗וֹם הַ/בָּא֙ לִ/שְׁד֣וֹד אֶת כָּל פְּלִשְׁתִּ֔ים לְ/הַכְרִ֤ית לְ/צֹר֙ וּ/לְ/צִיד֔וֹן כֹּ֖ל שָׂרִ֣יד עֹזֵ֑ר כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת פְּלִשְׁתִּ֔ים שְׁאֵרִ֖ית אִ֥י כַפְתּֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/004.yaml
  text: because of the day that is coming to devastate all the Philistines[a], to cut off from Tyre and Sidon every surviving helper. For Yahweh is devastating the Philistines, the remnant of the island of Caphtor.
translation:
  language: fr
  text: à cause du jour qui vient pour dévaster tous les Philistins, pour priver Tyr et Sidon de tout allié qui leur reste. Car Yahweh dévaste les Philistins, le reste de l’île de Caphtor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le reste de la région côtière de Caphtor ».
    reason: אִי peut désigner une île ou une région côtière.
lexical_decisions:
- source_word: עַל הַיּוֹם הַבָּא
  choice: à cause du jour qui vient
  rationale: Dans ce contexte, עַל introduit la cause de la détresse décrite au verset précédent. La tournure « qui vient » conserve la valeur participiale de הַבָּא dans un français naturel.
- source_word: לִשְׁדֹד / שֹׁדֵד
  choice: dévaster / dévaste
  rationale: Le verbe שׁדד évoque une action violente de pillage et de dévastation. « Dévaster » convient au jugement frappant un peuple entier sans réduire le sens au seul pillage.
- source_word: אֶת כָּל פְּלִשְׁתִּים
  choice: tous les Philistins
  rationale: Le pluriel désigne directement le peuple philistin plutôt que son territoire.
- source_word: לְהַכְרִית
  choice: retrancher
  rationale: « Retrancher » conserve l’image de הכרית et son sens d’élimination ou de suppression dans un contexte de jugement.
- source_word: לְצֹר וּלְצִידוֹן כֹּל שָׂרִיד עֹזֵר
  choice: retrancher de Tyr et de Sidon tout allié survivant
  rationale: Le ל devant les noms de villes est compris avec הכרית comme indiquant ceux auxquels l’aide est retirée. « Allié » exprime ici naturellement la fonction de עֹזֵר, tandis que « survivant » rend שָׂרִיד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: שְׁאֵרִית אִי כַפְתּוֹר
  choice: le reste de l’île de Caphtor
  rationale: שְׁאֵרִית signifie « reste » et אִי peut désigner une île ou une région côtière. « Île » est retenu dans le texte, avec l’autre possibilité signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le tétragramme comme nom propre; « Yahweh » en préserve la fonction sans le remplacer par un titre.
- issue: Sens géographique de אִי dans אִי כַפְתּוֹר
  choice: île
  alternative: région côtière
  rationale: אִי admet les deux sens. « Île » est une lecture directe et traditionnelle en rapport avec Caphtor, mais l’ambiguïté géographique réelle est conservée en note.
- issue: Relation de לְצֹר וּלְצִידוֹן avec לְהַכְרִית
  choice: retrancher de Tyr et de Sidon tout allié survivant
  alternative: retrancher pour Tyr et Sidon tout survivant qui apporte son aide
  rationale: La construction peut susciter une hésitation quant à la relation précise du ל. Le contexte favorise l’idée que Tyr et Sidon seront privées de tout secours philistin restant.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme de « dévaster / dévaste » reproduit la répétition de la racine hébraïque שׁדד. « Retrancher » garde la vigueur judiciaire de l’expression sans adopter une formulation archaïque excessive.
