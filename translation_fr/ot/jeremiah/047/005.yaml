  text: בָּ֤אָה קָרְחָה֙ אֶל עַזָּ֔ה נִדְמְתָ֥ה אַשְׁקְל֖וֹן שְׁאֵרִ֣ית עִמְקָ֑/ם עַד מָתַ֖י תִּתְגּוֹדָֽדִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/005.yaml
  text: Baldness has come upon Gaza[a]; Ashkelon has been silenced, the remnant of their valley[c][b]. How long will you gash yourself?
translation:
  language: fr
  text: La calvitie est venue sur Gaza ; Ascalon est réduite au silence, le reste de leur vallée.[a] Jusqu’à quand te feras-tu des entailles ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le reste de leur vallée ». Certaines versions anciennes ou une vocalisation différente ont conduit à d’autres interprétations, notamment « le reste des Anakim ». Le verbe traduit par « réduite au silence » peut aussi signifier « retranchée », « anéantie » ou « détruite ».'
    reason: alternative_reading_and_lexical_alternative
  - marker: b
    text: Dans l’ancien Proche-Orient, se faire des entailles était une pratique de deuil.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְחָה
  choice: la calvitie
  rationale: Le nom désigne la calvitie, ici comme signe conventionnel de deuil et de désastre. Le rendre directement préserve l’image hébraïque sans préciser si elle résulte d’un rasage.
- source_word: בָּאָה ... אֶל עַזָּה
  choice: Gaza est gagnée par
  rationale: Cette formulation française naturelle exprime l’arrivée menaçante de la calvitie sur Gaza, plutôt qu’un simple déplacement vers la ville.
- source_word: נִדְמְתָה
  choice: est réduite au silence
  rationale: Le nifal de דמה peut évoquer le silence, l’anéantissement ou la destruction. Cette traduction conserve l’image du silence tout en laissant entendre la ruine dans le contexte guerrier.
- source_word: שְׁאֵרִית
  choice: elle qui reste
  rationale: La tournure rend le sens de « reste » ou « survivante » tout en reliant naturellement l’apposition féminine à Ascalon.
- source_word: עִמְקָם
  choice: leur vallée
  rationale: Le texte massorétique vocalisé se comprend naturellement comme « leur vallée ». D’autres traditions de lecture sont signalées en note sans remplacer le texte reçu.
- source_word: תִּתְגּוֹדָדִי
  choice: te feras-tu des entailles
  rationale: La forme réfléchie désigne des incisions pratiquées sur soi en signe de deuil. « Se faire des entailles » est clair, actuel et moins susceptible d’évoquer une blessure accidentelle.
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Cette formule française directe conserve la forme temporelle et rhétorique de l’hébreu.
theological_decisions: []
