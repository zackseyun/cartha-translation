  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנֵּה מַ֜יִם עֹלִ֤ים מִ/צָּפוֹן֙ וְ/הָיוּ֙ לְ/נַ֣חַל שׁוֹטֵ֔ף וְ/יִשְׁטְפוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֣שְׁבֵי בָ֑/הּ וְ/זָֽעֲקוּ֙ הָֽ/אָדָ֔ם וְ/הֵילִ֕ל כֹּ֖ל יוֹשֵׁ֥ב הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/002.yaml
  text: 'Thus says the LORD: Behold, waters are rising from the north, and they will become an overflowing torrent; they will overflow the land and its fullness, the city and those who dwell in it. Then mankind will cry out, and every inhabitant of the land will wail.'
translation:
  language: fr
  text: 'Ainsi parle le SEIGNEUR :


    Voici que des eaux montent du nord ;

    elles deviendront un torrent impétueux.

    Elles inonderont le pays et tout ce qu’il contient,

    la ville et ceux qui l’habitent.

    Les humains pousseront des cris,

    et tous les habitants du pays se lamenteront.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française courante, avec les petites capitales représentées ici par des capitales.
- source_word: מַיִם עֹלִים מִצָּפוֹן
  choice: des eaux montent du nord
  rationale: Conserve l’image prophétique des eaux envahissantes et la provenance septentrionale.
- source_word: לְנַחַל שׁוֹטֵף
  choice: un torrent qui déborde
  rationale: נחל désigne ici un cours d’eau torrentiel, et שׁוטף exprime son caractère débordant ou dévastateur.
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: le pays et tout ce qu’il contient
  rationale: Formulation française naturelle qui garde l’idée hébraïque du pays avec sa plénitude, c’est-à-dire tout ce qui le remplit.
- source_word: הָאָדָם
  choice: les humains
  rationale: Le singulier collectif avec l’article désigne l’humanité ou les gens en général, plutôt qu’un homme particulier.
- source_word: הֵילִל
  choice: se lamentent
  rationale: Exprime le cri prolongé de détresse ou la lamentation indiqué par le verbe.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit une convention de traduction française largement reconnue sans imposer une vocalisation reconstruite du tétragramme.
- issue: Portée collective de הָאָדָם
  choice: les humains
  alternative: l’homme / les hommes
  rationale: Préserve la valeur collective et inclusive du terme dans ce contexte de jugement général.
translation_notes:
  register: Style prophétique solennel mais clair, avec parallélisme poétique conservé. Le présent « deviennent » reproduit la succession vive des formes hébraïques ; « submergent » évite la répétition française tout en maintenant l’image de l’inondation.
