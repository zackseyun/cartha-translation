  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑ה אַ֠חֲרֵי שְׁב֞וֹר חֲנַנְיָ֤ה הַ/נָּבִיא֙ אֶת הַ/מּוֹטָ֔ה מֵ/עַ֗ל צַוַּ֛אר יִרְמְיָ֥ה הַ/נָּבִ֖יא לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/012.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after Hananiah the prophet had broken the yoke from off the neck of Jeremiah the prophet, saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh fut adressée à Jérémie, après que le prophète Hanania eut brisé le joug[a] qui était sur le cou du prophète Jérémie, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la barre du joug » ; le nom hébreu peut désigner plus précisément la pièce de bois transversale du joug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָה
  choice: Alors la parole de Yahweh fut adressée à Jérémie
  rationale: La formule française « la parole… fut adressée à » rend naturellement l’arrivée de la parole divine, tandis que « Alors » marque la progression du récit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אַחֲרֵי שְׁבוֹר
  choice: après que… eut brisé
  rationale: Le plus-que-parfait antérieur exprime clairement que l’action de Hanania précède la parole adressée à Jérémie.
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: le prophète Hanania
  rationale: Cette formulation française naturelle conserve le titre apposé au nom.
- source_word: הַמּוֹטָה
  choice: le joug
  rationale: « Joug » est clair dans le contexte du geste prophétique, tout en laissant une note préciser que le nom hébreu peut viser plus particulièrement sa barre de bois.
- source_word: מֵעַל צַוַּאר
  choice: qui se trouvait sur le cou de
  rationale: La proposition relative restitue la position du joug avant son retrait sans la lourdeur d’un calque comme « de dessus le cou ».
- source_word: יִרְמְיָה הַנָּבִיא
  choice: du prophète Jérémie
  rationale: La répétition du titre, présente en hébreu, est maintenue et souligne la confrontation entre les deux prophètes.
- source_word: לֵאמֹר
  choice: 'Elle disait :'
  rationale: Cette tournure introduit naturellement en français le contenu de la parole divine donné au verset suivant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; « Yahweh » en préserve la valeur de nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La structure narrative et la répétition de « prophète » sont conservées, tandis que les formulations trop calquées de l’hébreu sont évitées.
