id: JER.28.8
reference: Jeremiah 28:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/נְּבִיאִ֗ים אֲשֶׁ֨ר הָי֧וּ לְ/פָנַ֛/י וּ/לְ/פָנֶ֖י/ךָ מִן הָֽ/עוֹלָ֑ם וַ/יִּנָּ֨בְא֜וּ אֶל אֲרָצ֤וֹת רַבּוֹת֙ וְ/עַל מַמְלָכ֣וֹת גְּדֹל֔וֹת לְ/מִלְחָמָ֖ה וּ/לְ/רָעָ֥ה וּ/לְ/דָֽבֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/008.yaml
  text: The prophets who were before me and before you from ancient times prophesied against many lands and against great kingdoms[b][a], of war and disaster and plague.
translation:
  language: fr
  text: Les prophètes qui ont vécu avant moi et avant toi, depuis les temps anciens[a], ont prophétisé contre de nombreux pays et contre de grands royaumes, annonçant la guerre, le malheur et la peste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis un passé lointain ». L’expression hébraïque désigne ici les temps reculés, pas nécessairement l’éternité.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’épidémie »; le terme hébreu désigne une maladie contagieuse meurtrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּבִיאִים
  choice: Les prophètes
  rationale: Nom pluriel défini, rendu directement et naturellement.
- source_word: אֲשֶׁר הָיוּ לְפָנַי וּלְפָנֶיךָ
  choice: qui ont vécu avant moi et avant toi
  rationale: L’expression est temporelle. « Ont vécu avant » évite une lecture spatiale tout en conservant le parallélisme hébreu.
- source_word: מִן הָעוֹלָם
  choice: depuis les temps anciens
  rationale: Dans ce contexte, עוֹלָם désigne un passé lointain, non l’éternité.
- source_word: וַיִּנָּבְאוּ
  choice: ont prophétisé
  rationale: Équivalent courant du verbe נבא dans un contexte prophétique.
- source_word: אֶל אֲרָצוֹת רַבּוֹת וְעַל מַמְלָכוֹת גְּדֹלוֹת
  choice: contre de nombreux pays et contre de grands royaumes
  rationale: La série de fléaux qui suit indique des oracles de jugement; « contre » rend ici la portée adversative des deux constructions prépositionnelles.
- source_word: לְמִלְחָמָה וּלְרָעָה וּלְדָבֶר
  choice: annonçant la guerre, le malheur et la peste
  rationale: Les prépositions introduisent le contenu des prophéties. « Annonçant » rend la relation clairement en français; רָעָה désigne ici une calamité, et דָבֶר une épidémie meurtrière.
theological_decisions:
- issue: Portée des prépositions dans les oracles prophétiques
  choice: ont prophétisé contre de nombreux pays et contre de grands royaumes
  alternative: ont prophétisé au sujet de nombreux pays et de grands royaumes
  rationale: Le contexte immédiat et la triade « guerre, malheur et peste » orientent vers des oracles hostiles de jugement, sans nier que les prépositions puissent ailleurs avoir un sens plus neutre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme « avant moi et avant toi » et explicite par « annonçant » le lien entre la prophétie et les trois calamités.
