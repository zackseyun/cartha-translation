  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אָמֵ֕ן כֵּ֖ן יַעֲשֶׂ֣ה יְהוָ֑ה יָקֵ֤ם יְהוָה֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֣ר נִבֵּ֗אתָ לְ/הָשִׁ֞יב כְּלֵ֤י בֵית יְהוָה֙ וְ/כָל הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל אֶל הַ/מָּק֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/006.yaml
  text: Then Jeremiah the prophet said[a], “Amen! May Yahweh do so; may Yahweh fulfill your words that you have prophesied, to bring back the vessels of the house of Yahweh and all the exiles from Babylon to this place.”
translation:
  language: fr
  text: 'Alors le prophète Jérémie dit : « Amen ! Que Yahweh agisse ainsi ! Que Yahweh fasse s’accomplir[a] les paroles que tu as prophétisées, en faisant revenir de Babylone en ce lieu les objets de la maison de Yahweh et tous les exilés ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confirme » ou « établisse ». Le verbe hébreu évoque le fait de faire tenir des paroles, c’est-à-dire de les rendre effectives.
    reason: Alternative lexicale permettant de conserver l’image et l’étendue sémantique du verbe hébreu קום au hiphil.
lexical_decisions:
- source_word: אָמֵן
  choice: Amen
  rationale: La forme familière « Amen » conserve à la fois la couleur hébraïque et la valeur de souhait ou d’assentiment dans ce contexte.
- source_word: כֵּן יַעֲשֶׂה
  choice: Que … agisse ainsi
  rationale: 'Les formes verbales ont ici une valeur volitive après « Amen » : Jérémie exprime un souhait plutôt qu’une prédiction.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin dans le projet, qui rend directement le tétragramme hébreu.
- source_word: יָקֵם
  choice: fasse s’accomplir
  rationale: Le hiphil de קום signifie ici faire tenir ou rendre effectives des paroles ; cette tournure française en exprime naturellement le sens dans un contexte prophétique.
- source_word: דְּבָרֶיךָ אֲשֶׁר נִבֵּאתָ
  choice: les paroles que tu as prophétisées
  rationale: La formulation garde le pluriel concret de l’hébreu et relie la déclaration antérieure de Hanania au souhait présent de Jérémie.
- source_word: לְהָשִׁיב
  choice: en faisant revenir
  rationale: Le causatif gouverne à la fois les objets du sanctuaire et les exilés ; « faire revenir » convient aux deux compléments.
- source_word: כְּלֵי בֵית יְהוָה
  choice: les objets de la maison de Yahweh
  rationale: « Objets » désigne clairement les biens ou ustensiles du sanctuaire, tandis que « maison de Yahweh » préserve la désignation hébraïque du temple.
- source_word: כָל־הַגּוֹלָה
  choice: tous les exilés
  rationale: Le nom singulier collectif désigne l’ensemble de la communauté déportée ; le pluriel est naturel et clair en français.
- source_word: אֶל־הַמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Cette formulation conserve la référence déictique sans préciser davantage que le texte hébreu.
theological_decisions:
- issue: Valeur de la réponse de Jérémie
  choice: 'Un souhait : « Que Yahweh… »'
  alternative: 'Une affirmation au futur : « Yahweh agira… »'
  rationale: Après « Amen », les imparfaits ont très probablement une valeur jussive. Jérémie souhaite que l’annonce favorable se réalise sans pour autant la reconnaître comme une prophétie certaine.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin ; sa transcription le distingue d’un titre et préserve sa fonction dans le passage.
- issue: Portée de לְהָשִׁיב
  choice: Le retour concerne les objets et tous les exilés
  alternative: Limiter explicitement le retour aux seuls objets du temple
  rationale: La syntaxe coordonne « les objets de la maison de Yahweh » et « tous les exilés » sous le même infinitif causatif.
translation_notes:
  register: Français international moderne, digne et accessible. Les exclamations rendent le caractère fervent du souhait sans transformer les paroles de Jérémie en affirmation certaine. La répétition de « Yahweh » est conservée comme dans l’hébreu.
