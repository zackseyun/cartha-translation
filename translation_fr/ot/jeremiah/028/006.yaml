  source_fidelity: 'Le texte rend fidèlement la structure et le sens de l’hébreu : « Amen », suivi de deux souhaits volitifs ; l’accomplissement des paroles de Hanania ; puis le retour, depuis Babylone, des objets de la maison de Yahweh et de l’ensemble des exilés vers « ce lieu ». La portée commune de « en faisant revenir » est claire et ne restreint pas indûment l’infinitif hébreu au seul premier complément.'
  naturalness: Le français est moderne, compréhensible et conserve un registre biblique digne sans archaïsme excessif. « En ce lieu » est légèrement soutenu, mais naturel dans ce contexte et utile pour garder la désignation déictique sans expliciter « Jérusalem » ou « le temple ».
  terminology: « Yahweh » rend uniformément le tétragramme conformément au choix du projet. « Amen », « paroles », « maison de Yahweh », « exilés » et « faire revenir » sont appropriés. « Objets de la maison de Yahweh » est un rendu suffisamment large et exact de כְּלֵי, sans imposer une identification technique plus étroite.
