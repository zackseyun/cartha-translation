source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁנָתַ֣יִם יָמִ֗ים אֲנִ֤י מֵשִׁיב֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֶֽת כָּל כְּלֵ֖י בֵּ֣ית יְהוָ֑ה אֲשֶׁ֨ר לָקַ֜ח נְבוּכַדנֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה וַ/יְבִיאֵ֖/ם בָּבֶֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/003.yaml
  text: Within two years[a], I will bring back to this place all the vessels of the house of Yahweh[d][c][b], which Nebuchadnezzar king of Babylon took from this place and brought to Babylon.
translation:
  language: fr
  text: D’ici deux ans[a], je ramènerai en ce lieu tous les objets de la maison de Yahweh[b], que Nabuchodonosor, roi de Babylone, a pris de ce lieu et les a emportés à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « encore deux années de jours », expression hébraïque signifiant « d’ici deux ans ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « tous les ustensiles » ou « tous les récipients de la maison de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: D’ici deux ans
  rationale: L’expression idiomatique indique le délai restant avant l’accomplissement annoncé. « D’ici deux ans » est naturel en français et conserve cette valeur temporelle.
- source_word: מֵשִׁיב
  choice: je ramènerai
  rationale: Le hifil de שוב exprime ici le retour concret des objets vers le lieu indiqué; le participe a une valeur future dans cette déclaration prophétique.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Rendu direct de la désignation déictique, avec un registre digne et courant.
- source_word: כָּל כְּלֵי בֵּית יְהוָה
  choice: tous les objets de la maison de Yahweh
  rationale: כְּלֵי désigne collectivement les objets, récipients et ustensiles du sanctuaire. « Objets » est ici plus largement compréhensible que « vases » et n’en restreint pas la nature.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר לָקַח
  choice: que ... a pris
  rationale: Le verbe לקח signifie simplement « prendre »; cette formulation évite d’intensifier explicitement l’idée de pillage.
- source_word: נְבוּכַדנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du roi babylonien.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rendu direct de la construction hébraïque en apposition au nom propre.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: de ce lieu
  rationale: Préserve le parallélisme spatial avec « en ce lieu ».
- source_word: וַיְבִיאֵם בָּבֶל
  choice: et emportés à Babylone
  rationale: Le pronom objet hébreu est représenté par l’accord de « emportés », qui renvoie explicitement aux objets; « emporter » rend naturellement le déplacement depuis le lieu où se tient le locuteur vers Babylone.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve sans remplacer le nom propre par un titre; « Jéhovah » repose sur une vocalisation hybride traditionnelle.
translation_notes:
  register: Français international moderne, clair et digne. « Maison de Yahweh » conserve l’expression hébraïque plutôt que de l’expliciter par « temple ». Le passé composé convient au récit enchâssé dans la parole prophétique, tandis que le futur simple marque nettement la promesse annoncée.
