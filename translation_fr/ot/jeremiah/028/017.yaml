  text: וַ/יָּ֛מָת חֲנַנְיָ֥ה הַ/נָּבִ֖יא בַּ/שָּׁנָ֣ה הַ/הִ֑יא בַּ/חֹ֖דֶשׁ הַ/שְּׁבִיעִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/017.yaml
  text: And Hananiah the prophet died in that year[a], in the seventh month.
translation:
  language: fr
  text: Et le prophète Hanania mourut cette année-là, au septième mois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol qal de מוּת exprime simplement la mort dans la progression du récit. Le passé simple convient au registre narratif français, et la conjonction initiale est rendue par « Et ».
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Translittération française usuelle du nom hébreu, sans traduire le nom propre.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Le texte emploie le titre ordinaire נָבִיא sans qualificatif péjoratif. Le contexte condamne Hanania, mais le verset ne dit pas explicitement « faux prophète ».
- source_word: בַּשָּׁנָה הַהִיא
  choice: cette année-là
  rationale: Expression française naturelle et précise pour l’hébreu « en cette/cette année-là », avec sa valeur anaphorique, sans ajouter l’idée explicite de « même ».
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: au septième mois
  rationale: Rendu direct et idiomatique de la locution temporelle hébraïque.
theological_decisions:
- issue: Faut-il qualifier explicitement Hanania de faux prophète ?
  choice: Conserver « le prophète »
  alternative: « le faux prophète »
  rationale: Même si le récit présente ses paroles comme mensongères, ce verset emploie seulement le titre « prophète ». Ajouter « faux » introduirait dans la traduction une interprétation que la formulation de ce verset ne porte pas explicitement.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple maintient une narration biblique naturelle sans archaïsme lexical. Aucune note n’est nécessaire, puisque « cette année-là » rend directement בַּשָּׁנָה הַהִיא et évite l’ajout de « même ».
