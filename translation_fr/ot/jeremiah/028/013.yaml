  text: הָלוֹךְ֩ וְ/אָמַרְתָּ֨ אֶל חֲנַנְיָ֜ה לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה מוֹטֹ֥ת עֵ֖ץ שָׁבָ֑רְתָּ וְ/עָשִׂ֥יתָ תַחְתֵּי/הֶ֖ן מֹט֥וֹת בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/013.yaml
  text: 'Go and say to Hananiah, saying, ‘Thus says the LORD: You have broken wooden yoke-bars, but you have made iron yoke-bars in their place.’'
translation:
  language: fr
  text: 'Va dire à Hanania : « Voici ce que dit le SEIGNEUR : Tu as brisé des barres de joug en bois, et tu as fait à leur place des barres de joug en fer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Va dire
  rationale: L’infinitif absolu suivi du verbe conjugué exprime ici un ordre de mouvement et de parole; « Va dire » est naturel et fidèle en français.
- source_word: מֹטֹת עֵץ
  choice: des barres de joug en bois
  rationale: מֹטוֹת désigne ici les barres du joug évoqué dans le contexte, et non le joug de façon indifférenciée.
- source_word: וְעָשִׂיתָ תַחְתֵּיהֶן
  choice: mais tu les as remplacées par
  rationale: Rend idiomatiquement l’idée littérale de « faire à leur place », tout en conservant le contraste entre le bois brisé et le fer qui lui succède.
- source_word: מֹטוֹת בַּרְזֶל
  choice: des barres de joug en fer
  rationale: Maintient le parallélisme précis avec les barres en bois.
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La forme en petites capitales suit l’usage biblique français courant pour signaler le nom divin sans imposer une vocalisation reconstruite.
- issue: Agent implicite dans « tu les as remplacées »
  choice: Conserver Hanania comme sujet grammatical
  alternative: « elles seront remplacées »
  rationale: Le texte hébreu emploie explicitement la deuxième personne du singulier; la traduction préserve cette formulation sans expliquer davantage le rapport entre l’acte de Hanania et le jugement divin.
translation_notes:
  register: Français moderne, clair et digne. La formule לֵאמֹר n’est pas reproduite par un lourd « en disant » après « Va dire », car les deux-points et le discours direct en expriment naturellement la fonction.
