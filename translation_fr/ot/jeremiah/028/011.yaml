  text: וַ/יֹּ֣אמֶר חֲנַנְיָה֩ לְ/עֵינֵ֨י כָל הָ/עָ֜ם לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ כָּ֣כָה אֶשְׁבֹּ֞ר אֶת עֹ֣ל נְבֻֽכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֗ל בְּ/עוֹד֙ שְׁנָתַ֣יִם יָמִ֔ים מֵ/עַ֕ל צַוַּ֖אר כָּל הַ/גּוֹיִ֑ם וַ/יֵּ֛לֶךְ יִרְמְיָ֥ה הַ/נָּבִ֖יא לְ/דַרְכּֽ/וֹ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/011.yaml
  text: 'And Hananiah said in the sight of all the people[a], saying[b], “Thus says Yahweh: In this way I will break the yoke of Nebuchadnezzar king of Babylon from upon the neck of all the nations within two years.” Then Jeremiah the prophet went on his way.'
translation:
  language: fr
  text: 'Hanania déclara sous les yeux de tout le peuple[a] : « Ainsi parle Yahweh : C’est ainsi[b] que, d’ici deux ans, je briserai le joug de Nabuchodonosor, roi de Babylone, qui est sur le cou de toutes les nations. » Puis le prophète Jérémie poursuivit son chemin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant tout le peuple ».'
    reason: lexical_alternative
  - marker: b
    text: « C’est ainsi » renvoie probablement au geste symbolique par lequel Hanania a brisé le joug.
    reason: cultural_note
lexical_decisions:
- source_word: לְעֵינֵי
  choice: devant tout le peuple
  rationale: L’expression signifie que la déclaration est faite publiquement, en présence de tous. « Devant » est naturel en français tout en conservant l’idée de visibilité publique.
- source_word: כֹּה ... כָּכָה
  choice: Voici ce que dit ... C’est ainsi
  rationale: La première expression introduit la formule prophétique; la seconde renvoie vraisemblablement au geste symbolique par lequel Hanania vient de briser le joug.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription française usuelle du nom divin représenté par le tétragramme.
- source_word: אֶשְׁבֹּר
  choice: je briserai
  rationale: L’imparfait hébreu a ici une valeur future dans la déclaration prophétique; « briser » convient à l’image concrète du joug rompu.
- source_word: עֹל
  choice: joug
  rationale: Terme français courant et traditionnel pour l’objet concret, qui représente ici la domination politique babylonienne.
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: d’ici deux ans
  rationale: Cette tournure française exprime naturellement une échéance ne dépassant pas deux ans, valeur probable de l’expression hébraïque.
- source_word: מֵעַל צַוַּאר
  choice: l’enlèverai du cou de
  rationale: Le verbe « briser » gouverne d’abord le joug; l’ajout « l’enlèverai » rend clairement et naturellement en français la préposition indiquant que le joug sera ôté de dessus le cou.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: Dans ce contexte international, le terme désigne les nations soumises à Babylone, sans la connotation théologique plus tardive de « païens ».
- source_word: וַיֵּלֶךְ ... לְדַרְכּוֹ
  choice: Puis le prophète Jérémie poursuivit son chemin
  rationale: Cette formulation idiomatique exprime le départ de Jérémie et la continuation de sa route sans surinterpréter son attitude.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Statut de la parole prononcée par Hanania
  choice: Conserver la formule « Voici ce que dit Yahweh » sans authentifier la prophétie
  alternative: Qualifier explicitement cette parole de fausse prophétie dans le verset
  rationale: Le narrateur rapporte ici les paroles de Hanania. Leur évaluation ressort du contexte, mais ne doit pas être ajoutée au texte de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct est allégé de l’hébraïsme redondant « dit… en disant ». La métaphore du joug et du cou demeure explicite, tandis que la syntaxe est rendue naturelle en français.
