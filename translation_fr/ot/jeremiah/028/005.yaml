id: JER.28.5
reference: Jeremiah 28:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אֶל חֲנַנְיָ֖ה הַ/נָּבִ֑יא לְ/עֵינֵ֤י הַ/כֹּֽהֲנִים֙ וּ/לְ/עֵינֵ֣י כָל הָ/עָ֔ם הָ/עֹמְדִ֖ים בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/005.yaml
  text: Then Jeremiah the prophet said to Hananiah the prophet in the sight of the priests and in the sight of all the people who were standing in the house of Yahweh:[a][b]
translation:
  language: fr
  text: 'Alors le prophète Jérémie dit au prophète Hanania, sous les yeux des prêtres et sous les yeux de tout le peuple qui se tenait dans la maison de Yahvé[a][b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant les prêtres et devant tout le peuple ».
    reason: lexical_alternative
  - marker: b
    text: La « maison de Yahvé » désigne ici le Temple.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement en français la succession narrative.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Formulation française naturelle qui conserve explicitement le titre défini.
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: au prophète Hanania
  rationale: « Hanania » est la forme française courante du nom. Le titre « prophète » est maintenu comme dans l’hébreu, sans préjuger ici de l’authenticité de son message.
- source_word: לְעֵינֵי … וּלְעֵינֵי
  choice: sous les yeux de … et sous les yeux de
  rationale: Cette expression rend l’image littérale des « yeux » et souligne le caractère public de la déclaration. La répétition de l’hébreu est conservée.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent direct du nom défini au pluriel.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: עָם désigne ici l’ensemble du peuple présent, et non une foule quelconque.
- source_word: הָעֹמְדִים
  choice: qui se tenait
  rationale: Le participe décrit le peuple présent sur place. Le singulier suit en français le nom collectif « peuple », tandis que « se tenait » conserve l’idée de présence debout sans lourdeur.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahvé
  rationale: « Maison » préserve l’expression hébraïque, qui désigne ici le Temple, et le nom divin est rendu directement par « Yahvé ».
theological_decisions:
- issue: Désignation de Hanania comme prophète
  choice: Conserver « le prophète » pour Hanania
  alternative: Qualifier Hanania de faux prophète
  rationale: Le texte hébreu lui donne explicitement le titre הַנָּבִיא. La traduction préserve cette tension narrative et ne devance pas le jugement porté par la suite du récit.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme. « Yahvé » représente directement le nom divin et le distingue d’un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition rhétorique de « sous les yeux de » est volontairement maintenue. Les deux occurrences de « prophète » sont conservées, ainsi que l’expression concrète « maison de Yahvé ».
