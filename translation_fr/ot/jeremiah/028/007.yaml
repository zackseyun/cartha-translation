source:
  edition: WLC
  text: אַךְ שְׁמַֽע נָא֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֣ר בְּ/אָזְנֶ֑י/ךָ וּ/בְ/אָזְנֵ֖י כָּל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/007.yaml
  text: Yet please hear this word that I am speaking in your hearing and in the hearing of all the people:[a]
translation:
  language: fr
  text: Cependant, écoute, je te prie, cette parole que je prononce à tes oreilles et aux oreilles de tout le peuple :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à tes oreilles et aux oreilles de tout le peuple ». Cette expression signifie que la parole est adressée de manière audible à toi comme à tout le peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Cependant
  rationale: La particule introduit ici une réserve contrastant avec l’acquiescement du verset précédent. « Cependant » rend ce pivot avec dignité et naturel.
- source_word: שְׁמַע נָא
  choice: écoute, je te prie
  rationale: L’impératif שְׁמַע appelle à une écoute attentive, tandis que נָא donne à l’exhortation une nuance pressante et courtoise.
- source_word: הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: דָּבָר peut désigner une parole, une affaire ou un message. Dans cette prise de parole prophétique, « parole » conserve à la fois le caractère verbal et la portée solennelle de l’expression.
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר
  choice: que je prononce
  rationale: Le participe דֹּבֵר décrit l’action en cours. En français, « que je prononce » exprime naturellement la parole adressée à cet instant.
- source_word: בְּאָזְנֶיךָ וּבְאָזְנֵי כָּל הָעָם
  choice: devant toi et devant tout le peuple
  rationale: Littéralement « à tes oreilles et aux oreilles de tout le peuple ». « Devant » rend idiomatiquement la dimension d’audition directe et publique, tandis que la note préserve l’image hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement correspond à l’adresse masculine singulière de בְּאָזְנֶיךָ. La répétition hébraïque de « aux oreilles » est explicitée en note, tandis que le texte principal adopte une formulation française naturelle.
