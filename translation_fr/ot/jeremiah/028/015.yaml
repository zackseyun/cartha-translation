  text: וַ/יֹּ֨אמֶר יִרְמְיָ֧ה הַ/נָּבִ֛יא אֶל חֲנַנְיָ֥ה הַ/נָּבִ֖יא שְׁמַֽע נָ֣א חֲנַנְיָ֑ה לֹֽא שְׁלָחֲ/ךָ֣ יְהוָ֔ה וְ/אַתָּ֗ה הִבְטַ֛חְתָּ אֶת הָ/עָ֥ם הַ/זֶּ֖ה עַל שָֽׁקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/015.yaml
  text: 'Then Jeremiah the prophet said to Hananiah the prophet[a], “Listen, please, Hananiah: Yahweh has not sent you[b], and you have made this people trust in a lie.”'
translation:
  language: fr
  text: 'Alors le prophète Jérémie dit au prophète Hanania : « Écoute, je t’en prie, Hanania ! Yahweh ne t’a pas envoyé, et toi, tu as amené ce peuple à placer sa confiance dans un mensonge. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement la succession narrative en français.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Le titre défini est conservé pour Jérémie comme pour Hanania, ce qui maintient l’identification appositive et la tension liée au statut prophétique revendiqué par Hanania.
- source_word: שְׁמַע נָא
  choice: Écoute donc
  rationale: L’impératif שְׁמַע est rendu directement, tandis que « donc » restitue avec naturel la nuance pressante de la particule נָא sans donner ici à la phrase une politesse artificielle.
- source_word: לֹא שְׁלָחֲךָ יְהוָה
  choice: Yahweh ne t’a pas envoyé
  rationale: Le passé composé convient à l’accusation portant sur l’absence de mandat divin et conserve sa portée présente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre, conformément au tétragramme du texte hébreu.
- source_word: הִבְטַחְתָּ
  choice: tu as amené … à mettre sa confiance
  rationale: Cette formulation française rend la valeur causative du hiphil de בטח tout en conservant l’idée de confiance plutôt que de la réduire au simple fait de croire une affirmation.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le collectif singulier hébreu et son démonstratif sont conservés naturellement.
- source_word: עַל שָׁקֶר
  choice: dans un mensonge
  rationale: La formulation désigne le fondement ou l’objet trompeur de la confiance. Le singulier concret « un mensonge » correspond à שָׁקֶר.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve sa fonction de nom propre sans le remplacer par un titre traditionnel.
- issue: Statut prophétique de Hanania
  choice: au prophète Hanania
  alternative: à Hanania, qui se disait prophète
  rationale: L’hébreu lui applique explicitement le titre « le prophète ». La traduction le conserve sans résoudre par une paraphrase la tension que l’accusation de Jérémie crée dans le contexte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de l’hébreu, tout en évitant les tournures causatives peu naturelles en français.
