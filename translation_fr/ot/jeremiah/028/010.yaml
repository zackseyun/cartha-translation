  terminology: « Hanania », « Jérémie » et « prophète » sont appropriés en français. « Barre du joug » conserve la précision matérielle sans assimiler sans reste le terme hébreu à l’ensemble du joug. La note maintient les possibilités lexicales pertinentes.
