  text: Then Hananiah the prophet took the yoke from the neck of Jeremiah the prophet and broke it[a].
translation:
  language: fr
  text: Alors le prophète Hanania prit du cou du prophète Jérémie la barre du joug et la brisa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le joug » ou « la barre ». Le terme hébreu peut désigner la pièce de bois d’un joug ; le contexte décrit le joug symbolique porté par Jérémie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie ici simplement « prendre » dans la progression narrative. « Saisit » ajouterait une vigueur qui n’est pas explicitement exprimée.
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Transcription française courante du nom hébreu.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Traduction usuelle de נָבִיא. Le titre est conservé après Hanania comme après Jérémie afin de respecter la formulation et l’accent rhétorique de l’hébreu.
- source_word: הַמּוֹטָה
  choice: la barre du joug
  rationale: מוֹטָה désigne une barre ou pièce de bois associée au joug. « Barre du joug » rend le terme avec précision tout en maintenant le lien clair avec l’acte symbolique du contexte.
- source_word: מֵעַל
  choice: qui était sur
  rationale: La construction française explicite naturellement la position de la barre avant son retrait, correspondant au sens littéral « de dessus ».
- source_word: צַוַּאר
  choice: le cou
  rationale: Équivalent français courant de צַוַּאר.
- source_word: יִרְמְיָה
  choice: Jérémie
  rationale: Forme française traditionnelle et largement reconnue du nom.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: et la brisa
  rationale: שׁבר signifie « briser, casser ». « Brisa » convient à un objet en bois et le pronom féminin reprend naturellement « la barre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « prophète » est maintenue. « Barre du joug » privilégie la précision concrète sans perdre le symbole central du contexte.
