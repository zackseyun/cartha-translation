source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מְשַֽׁלֵּֽחֲ/ךָ֔ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה הַ/שָּׁנָה֙ אַתָּ֣ה מֵ֔ת כִּֽי סָרָ֥ה דִבַּ֖רְתָּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/016.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am sending you away from the face of the earth. This year you will die[b], because you have spoken rebellion against Yahweh.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh : Voici, je vais te retirer de la surface de la terre[a]. Cette année, tu mourras, car tu as tenu des propos de révolte[b] contre Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de dessus la face du sol ». Cette expression hébraïque évoque ici la disparition du monde des vivants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car tu as parlé d’apostasie — ou de défiance — contre Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime clairement la conséquence du jugement annoncé dans le contexte précédent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de messager dans un français actuel et digne.
- source_word: הִנְנִי מְשַׁלֵּחֲךָ
  choice: Je vais te retirer
  rationale: L’hébreu souligne l’action imminente de Dieu. Dans ce contexte de mort, « retirer » exprime naturellement l’éloignement annoncé sans ajouter l’idée plus forte de destruction.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface de la terre
  rationale: Conserve l’image hébraïque tout en employant une expression française naturelle; la phrase suivante précise qu’il s’agit de la mort.
- source_word: הַשָּׁנָה אַתָּה מֵת
  choice: Cette année, tu mourras
  rationale: Le contexte donne à la proposition nominale une valeur prédictive; le futur français communique clairement cette annonce.
- source_word: סָרָה דִבַּרְתָּ אֶל יְהוָה
  choice: tu as tenu des propos de révolte contre Yahweh
  rationale: « Propos de révolte » conserve à la fois le verbe général « parler » et le caractère rebelle du nom סָרָה, sans transformer explicitement ces paroles en prédication ni imposer le sens technique d’apostasie.
theological_decisions:
- issue: Portée de l’expression désignant le retrait de la surface de la terre
  choice: Une condamnation à mort, exprimée par une image que la proposition suivante explicite
  alternative: Un bannissement ou un exil hors du pays
  rationale: « Cette année, tu mourras » indique que le retrait annoncé est la disparition du monde des vivants, et non une simple déportation.
- issue: Sens de סָרָה
  choice: révolte
  alternative: apostasie ou défiance
  rationale: « Révolte » garde la dénonciation d’une opposition à Yahweh sans introduire la nuance doctrinale plus technique que peut porter « apostasie ».
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le tutoiement correspond à l’adresse directe faite à Hanania. L’image hébraïque est maintenue sous une forme idiomatique, et l’ambiguïté de סָרָה est signalée en note.
