id: JER.28.2
reference: Jeremiah 28:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר שָׁבַ֞רְתִּי אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: I have broken the yoke of the king of Babylon.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées[a], le Dieu d’Israël : J’ai brisé le joug du roi de Babylone.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh des puissances ». Le titre hébreu évoque les forces placées sous le commandement de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Rend la formule prophétique consacrée de façon solennelle, naturelle et actuelle en français ; le présent exprime l’autorité permanente de la proclamation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, au lieu de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Dans le titre divin, désigne les forces placées sous le commandement de Dieu ; cette formulation est claire en français moderne tout en conservant l’image militaire.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite qui identifie Yahweh comme le Dieu d’Israël.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit le contenu du discours ; les deux-points remplissent naturellement cette fonction en français.
- source_word: שָׁבַרְתִּי
  choice: J’ai brisé
  rationale: Le parfait présente l’action comme accomplie ; le passé composé en communique l’achèvement et la portée présente dans la déclaration de Hanania.
- source_word: עֹל
  choice: le joug
  rationale: Conserve la métaphore concrète et contextuelle de l’assujettissement politique.
- source_word: מֶלֶךְ בָּבֶל
  choice: du roi de Babylone
  rationale: Rend directement la construction hébraïque et identifie clairement le pouvoir impérial concerné.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: de l’univers / des puissances
  rationale: « Des armées » maintient l’image des forces sous le commandement divin sans préciser indûment s’il s’agit exclusivement de forces célestes ou terrestres.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique conserve sa solennité ; la métaphore du joug et l’aspect accompli de la déclaration sont maintenus.
