id: JER.28.9
reference: Jeremiah 28:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/נָּבִ֕יא אֲשֶׁ֥ר יִנָּבֵ֖א לְ/שָׁל֑וֹם בְּ/בֹא֙ דְּבַ֣ר הַ/נָּבִ֗יא יִוָּדַע֙ הַ/נָּבִ֔יא אֲשֶׁר שְׁלָח֥/וֹ יְהוָ֖ה בֶּ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/009.yaml
  text: As for the prophet who prophesies peace[a], when the word of that prophet comes to pass[c][b], then that prophet will be known as one whom Yahweh has truly sent.
translation:
  language: fr
  text: Quant au prophète qui prophétise la paix[a], c’est lorsque la parole de ce prophète s’accomplira[b] que l’on reconnaîtra que Yahweh l’a véritablement envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bien-être » ou « la prospérité ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lorsque viendra la parole de ce prophète »; il s’agit ici de la réalisation du message prophétique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: le prophète / ce prophète
  rationale: L’article défini est présent en hébreu. La reprise par « ce prophète » est naturelle en français et désigne clairement celui dont le message est mis à l’épreuve.
- source_word: יִנָּבֵא
  choice: prophétise
  rationale: Le niphal de נבא est le verbe habituel pour l’activité prophétique. « Prophétise » conserve le registre du texte sans réduire le sens à une simple prédiction.
- source_word: לְשָׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם peut aussi désigner le bien-être ou la prospérité. « La paix » convient au contexte de Jérémie 28 et conserve l’expression biblique usuelle, tandis qu’une note signale l’étendue sémantique.
- source_word: בְּבֹא דְּבַר הַנָּבִיא
  choice: lorsque la parole de ce prophète s’accomplira
  rationale: Littéralement, la construction dit « quand viendra la parole du prophète ». Dans ce contexte, la venue de la parole désigne sa réalisation; « s’accomplira » rend ce sens clairement en français.
- source_word: יִוָּדַע
  choice: l’on reconnaîtra
  rationale: Le niphal de ידע indique que l’identité ou l’authenticité du prophète deviendra manifeste. « L’on reconnaîtra » exprime naturellement ce résultat en français.
- source_word: שְׁלָחוֹ יְהוָה
  choice: Yahweh l’a envoyé
  rationale: La proposition hébraïque affirme l’envoi du prophète par Yahweh. La formulation française évite une lourde répétition tout en conservant explicitement l’agent divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: בֶּאֱמֶת
  choice: véritablement
  rationale: L’adverbe porte sur l’authenticité de l’envoi divin. « Véritablement envoyé » est idiomatique et préserve le sens de « en vérité ».
theological_decisions:
- issue: Critère permettant de reconnaître un vrai prophète
  choice: L’accomplissement d’une prophétie de paix permet de reconnaître que son auteur a véritablement été envoyé par Yahweh.
  alternative: 'Traduire plus littéralement : « quand viendra la parole du prophète, on reconnaîtra le prophète que Yahweh a envoyé en vérité ».'
  rationale: La syntaxe relie temporellement et logiquement la réalisation de la parole à la reconnaissance de l’authenticité du prophète. La traduction explicite ce lien sans généraliser au-delà du cas précis d’une prophétie de paix.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la solennité du propos tout en employant une syntaxe naturelle. « Quant au » marque le contraste contextuel avec les prophètes annonçant guerre, malheur et peste au verset précédent.
