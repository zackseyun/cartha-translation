id: JER.28.4
reference: Jeremiah 28:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת יְכָנְיָ֣ה בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְ֠הוּדָה וְ/אֶת כָּל גָּל֨וּת יְהוּדָ֜ה הַ/בָּאִ֣ים בָּבֶ֗לָ/ה אֲנִ֥י מֵשִׁ֛יב אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה נְאֻם יְהוָ֑ה כִּ֣י אֶשְׁבֹּ֔ר אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/004.yaml
  text: And I will bring back to this place Jeconiah son of Jehoiakim[a], king of Judah, and all the exiles of Judah who came to Babylon, declares Yahweh, for I will break the yoke of the king of Babylon.
translation:
  language: fr
  text: Je ramènerai en ce lieu Yekonia, fils de Joïakim et roi de Juda, ainsi que tous les exilés de Juda qui sont venus à Babylone — déclaration de Yahweh —, car je briserai le joug du roi de Babylone.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְכָנְיָה
  choice: Yekonia
  rationale: Translittération française claire de la forme hébraïque complète du nom, sans la remplacer par une forme abrégée ou harmonisée.
- source_word: גָּלוּת
  choice: les exilés
  rationale: Le nom peut désigner l’exil ou la communauté déportée; le participe pluriel qui suit favorise ici le sens collectif de personnes exilées.
- source_word: הַבָּאִים בָּבֶלָה
  choice: qui sont venus à Babylone
  rationale: Rend directement le participe de בוא et sa direction vers Babylone, sans ajouter une tournure passive telle que «qui ont été déportés».
- source_word: מֵשִׁיב
  choice: je ramènerai
  rationale: Le hiphil de שוב exprime le fait de faire revenir; avec des personnes comme objets et «en ce lieu» comme destination, «ramènerai» est naturel et précis.
- source_word: הַמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Formulation française digne et naturelle qui conserve la référence déictique sans préciser explicitement Jérusalem.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Conserve la forme nominale solennelle de la formule prophétique plutôt que de la réduire à un simple verbe de parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: עֹל
  choice: joug
  rationale: Préserve l’image concrète traditionnelle de la domination et de la servitude politique.
- source_word: אֶשְׁבֹּר אֶת עֹל מֶלֶךְ בָּבֶל
  choice: je briserai le joug du roi de Babylone
  rationale: Traduction proche de la forme hébraïque qui maintient la métaphore sans l’expliciter ni l’aplatir.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin, non un titre; «Yahweh» le conserve explicitement.
- issue: Portée de l’annonce attribuée à Yahweh
  choice: Conserver sans commentaire la formule «déclaration de Yahweh» dans le discours de Hanania
  alternative: Signaler dans le verset qu’il s’agit d’une prétention prophétique ultérieurement réfutée
  rationale: Le verset rapporte directement les paroles de Hanania; ajouter ici une réserve interprétative anticiperait le jugement narratif du contexte.
translation_notes:
  register: Français international moderne, fluide et digne. «En ce lieu» et «déclaration de Yahweh» gardent la tonalité prophétique; «les exilés» reste immédiatement compréhensible. La coordination identifie sans ambiguïté Yekonia comme fils de Joïakim et roi de Juda.
