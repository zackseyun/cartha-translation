source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עֹ֣ל בַּרְזֶ֡ל נָתַ֜תִּי עַל צַוַּ֣אר כָּל הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה לַ/עֲבֹ֛ד אֶת נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וַ/עֲבָדֻ֑/הוּ וְ/גַ֛ם אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה נָתַ֥תִּי לֽ/וֹ־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/014.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: I have put an iron yoke on the necks of all these nations, to serve Nebuchadnezzar king of Babylon, and they shall serve him[b]. I have also given him the beasts of the field.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh des armées, le Dieu d’Israël : J’ai placé un joug de fer sur le cou de toutes ces nations, pour qu’elles servent Nabuchodonosor, roi de Babylone, et elles le serviront. Je lui ai aussi donné les bêtes des champs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par le terme français courant dans ce titre, sans limiter explicitement les armées à un seul domaine.
- source_word: עֹל בַּרְזֶל
  choice: un joug de fer
  rationale: Rend directement la construction hébraïque et souligne, dans le contexte, une domination plus dure que le joug de bois.
- source_word: נָתַתִּי עַל צַוַּאר
  choice: J’ai placé ... sur le cou
  rationale: נתן peut signifier « donner, mettre, placer » ; « placer sur le cou » est naturel en français tout en conservant le singulier collectif hébreu.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: toutes ces nations
  rationale: Le contexte concerne des entités politiques soumises à Babylone ; « nations » convient donc précisément.
- source_word: לַעֲבֹד ... וַעֲבָדֻהוּ
  choice: afin qu’elles servent ... et elles le serviront
  rationale: Maintient la répétition de la racine עבד et rend la seconde forme selon sa valeur future ou résultative dans cette proclamation prophétique.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom royal correspondant à la graphie hébraïque de ce verset.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: Expression française actuelle qui restitue naturellement le sens collectif des animaux vivant hors de l’espace domestique.
theological_decisions:
- issue: Souveraineté divine sur les nations et le monde animal
  choice: Le texte affirme directement que Yahweh a imposé le joug aux nations et donné les animaux au roi de Babylone.
  alternative: Atténuer ces affirmations en les présentant comme une simple évolution politique permise par Dieu.
  rationale: La répétition de נָתַתִּי attribue explicitement ces actes à Dieu ; la traduction conserve cette force sans commentaire doctrinal ajouté.
- issue: Valeur temporelle des verbes
  choice: « J’ai placé ... elles le serviront ... j’ai donné »
  alternative: Employer partout un passé simple ou un passé composé.
  rationale: Les parfaits encadrants présentent des décisions divines accomplies et en vigueur, tandis que וַעֲבָדֻהוּ exprime ici le résultat futur certain.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe prophétique et les répétitions significatives sont conservées, avec une formulation naturelle.
