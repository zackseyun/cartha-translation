id: JER.28.1
reference: Jeremiah 28:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/הִ֗יא בְּ/רֵאשִׁית֙ מַמְלֶ֨כֶת֙ צִדְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֔ה ב/שנת הָֽ/רְבִעִ֔ית בַּ/חֹ֖דֶשׁ הַ/חֲמִישִׁ֑י אָמַ֣ר אֵלַ֡/י חֲנַנְיָה֩ בֶן עַזּ֨וּר הַ/נָּבִ֜יא אֲשֶׁ֤ר מִ/גִּבְעוֹן֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/עֵינֵ֧י הַ/כֹּהֲנִ֛ים וְ/כָל הָ/עָ֖ם לֵ/אמֹֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/001.yaml
  text: And it happened in that year[a], at the beginning of the reign of Zedekiah king of Judah, in the fourth year, in the fifth month, that Hananiah son of Azzur, the prophet from Gibeon, spoke to me in the house of Yahweh, in the sight of the priests and all the people, saying[b],
translation:
  language: fr
  text: 'Cette année-là, au commencement du règne de Sédécias, roi de Juda — la quatrième année[a], au cinquième mois —, Hanania, fils d’Azzour, le prophète originaire de Gabaon, me parla dans la maison de Yahweh, sous les yeux des prêtres et de tout le peuple, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit à la fois « au commencement du règne de Sédécias » et « la quatrième année ». Ces deux indications sont conservées sans harmonisation.
    reason: textual_tension
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַהִיא
  choice: Cette année-là
  rationale: Le wayyiqtol introduit ici un nouvel épisode. En français, l’ouverture temporelle suffit à rendre naturellement cette fonction narrative sans recourir à la formule vieillie « Il arriva que ».
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: au commencement du règne de
  rationale: מַמְלָכָה désigne ici l’exercice du pouvoir royal; « règne » convient mieux que « royaume ».
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Sédécias, roi de Juda
  rationale: Emploi des formes françaises usuelles du nom propre et du titre royal.
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: la quatrième année
  rationale: La notice chronologique est conservée explicitement, malgré sa tension apparente avec « au commencement du règne ».
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: au cinquième mois
  rationale: Rendu direct du calendrier hébraïque, sans lui substituer un mois moderne.
- source_word: אָמַר אֵלַי
  choice: me parla
  rationale: Rend naturellement l’acte de parole adressé au narrateur et permet d’introduire le discours par « en ces termes ».
- source_word: חֲנַנְיָה בֶן עַזּוּר
  choice: Hanania, fils d’Azzour
  rationale: Transcription française claire des noms et rendu direct de la filiation.
- source_word: הַנָּבִיא אֲשֶׁר מִגִּבְעוֹן
  choice: le prophète originaire de Gabaon
  rationale: Conserve le titre défini et indique naturellement la provenance exprimée par מִן.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: « Maison » préserve l’image hébraïque de בַּיִת, tandis que « Yahweh » rend directement le nom divin.
- source_word: לְעֵינֵי הַכֹּהֲנִים וְכָל הָעָם
  choice: sous les yeux des prêtres et de tout le peuple
  rationale: Cette expression française conserve l’image de « devant les yeux de » tout en signifiant clairement que la déclaration est publique.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Introduction idiomatique en français d’un discours direct qui se poursuit au verset suivant.
theological_decisions:
- issue: Tension chronologique entre « au commencement du règne de Sédécias » et « la quatrième année »
  choice: Conserver les deux indications sans les harmoniser
  alternative: Assouplir le sens de « commencement » ou modifier l’une des indications chronologiques
  rationale: Le texte hébreu présente les deux formulations. La traduction maintient cette tension textuelle au lieu de la résoudre implicitement.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve ici le nom propre divin sans lui substituer un titre.
- issue: Désignation de Hanania comme הַנָּבִיא
  choice: le prophète
  alternative: un prophète ou celui qui se disait prophète
  rationale: Le titre défini du texte est conservé sans anticiper le jugement narratif ultérieur ni ajouter une réserve interprétative.
translation_notes:
  register: 'Français international moderne, digne et lisible. La ponctuation met en relief les indications chronologiques sans supprimer leur tension. « Sous les yeux de » garde l’image hébraïque tout en restant idiomatique; « en ces termes : » signale que la parole se poursuit au verset suivant.'
