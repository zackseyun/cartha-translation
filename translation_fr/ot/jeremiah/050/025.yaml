  to: Yahweh a ouvert sa réserve[a] et en a fait sortir les armes[b] de sa fureur, car le Seigneur Yahweh des armées[c] a une œuvre à accomplir dans le pays des Chaldéens[d].
  rationale: La révision corrige le rendu du titre divin et de la relation syntaxique « une œuvre pour/qui incombe au Seigneur », tout en conservant le registre, les choix principaux et l’ambiguïté lexicale signalée par les notes. Le remplacement de « dépôt » par « réserve » améliore la fluidité sans réduire le champ sémantique du terme hébreu.
