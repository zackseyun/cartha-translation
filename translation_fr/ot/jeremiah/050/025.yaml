  text: פָּתַ֤ח יְהוָה֙ אֶת א֣וֹצָר֔/וֹ וַ/יּוֹצֵ֖א אֶת כְּלֵ֣י זַעְמ֑/וֹ כִּי מְלָאכָ֣ה הִ֗יא לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/אֶ֥רֶץ כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/025.yaml
  text: Yahweh has opened his storehouse and brought out the weapons of his wrath[d][c][b][a], for this is a work of the Lord GOD of Armies in the land of the Chaldeans.
translation:
  language: fr
  text: Yahweh a ouvert sa réserve[a] et en a fait sortir les armes[b] de sa fureur, car le Seigneur Yahweh des armées[c] a une œuvre à accomplir dans le pays des Chaldéens[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son trésor » ou « son arsenal ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les instruments de sa fureur » ; le mot hébreu peut désigner plus largement des objets, des instruments ou des équipements.
    reason: lexical_alternative
  - marker: c
    text: 'Traduction traditionnelle : « le Seigneur DIEU de l’univers ».'
    reason: lexical_alternative
  - marker: d
    text: Ou « en Chaldée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: a ouvert
  rationale: Le qatal présente l’ouverture comme accomplie; le passé composé convient naturellement au français et conserve la vivacité de l’oracle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel au lieu de lui substituer un titre.
- source_word: אֹצָרוֹ
  choice: son dépôt
  rationale: Le nom désigne un lieu où l’on conserve des biens ou des réserves. « Dépôt » maintient cette image générale sans imposer d’emblée le sens militaire d’« arsenal ».
- source_word: וַיּוֹצֵא
  choice: et en a fait sortir
  rationale: La tournure française exprime clairement que Yahweh tire les objets du dépôt qu’il vient d’ouvrir.
- source_word: כְּלֵי
  choice: les armes
  rationale: Le terme peut désigner divers objets, instruments ou équipements; dans cet oracle de jugement contre Babylone, son sens militaire est le plus probable.
- source_word: זַעְמוֹ
  choice: de sa fureur
  rationale: « Fureur » conserve l’intensité judiciaire de זַעַם et s’associe naturellement aux armes du jugement divin.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication de l’action précédente.
- source_word: מְלָאכָה הִיא לַאדֹנָי
  choice: il s’agit d’une œuvre du Seigneur
  rationale: Cette formulation française solennelle conserve l’idée d’une œuvre ou tâche relevant du Seigneur sans préciser excessivement la nuance du lamed.
- source_word: יְהוִה צְבָאוֹת
  choice: Yahweh, maître des armées
  rationale: « Maître des armées » communique le sens de צְבָאוֹת en français actuel et évite l’opacité de « des armées » employé seul.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: dans le pays des Chaldéens
  rationale: Cette traduction suit l’expression ethnographique littérale de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: « Yahweh » représente le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre traditionnel.
- issue: Rendu du titre composé אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur Yahweh, maître des armées
  alternative: le Seigneur DIEU de l’univers
  rationale: Le choix maintient ensemble le titre אֲדֹנָי, le nom divin יְהוָה et la référence aux armées, sans assimiler silencieusement צְבָאוֹת à l’univers.
- issue: Nature des כְּלֵי זַעְמוֹ
  choice: les armes de sa fureur
  alternative: les instruments de sa fureur
  rationale: Le contexte de l’assaut contre Babylone favorise le sens militaire, tandis qu’une note préserve le sens lexical plus large.
translation_notes:
  register: Français international actuel, digne et lisible. Le rythme reste proche de l’hébreu, tout en employant des tournures idiomatiques. « Dépôt » conserve la métaphore du lieu de réserve, et les notes signalent les principales possibilités lexicales sans surcharger le verset.
