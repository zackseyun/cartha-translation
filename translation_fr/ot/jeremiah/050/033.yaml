  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֲשׁוּקִ֛ים בְּנֵי יִשְׂרָאֵ֥ל וּ/בְנֵי יְהוּדָ֖ה יַחְדָּ֑ו וְ/כָל שֹֽׁבֵי/הֶם֙ הֶחֱזִ֣יקוּ בָ֔/ם מֵאֲנ֖וּ שַׁלְּחָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/033.yaml
  text: 'Thus says Yahweh of hosts: The sons of Israel and the sons of Judah alike are oppressed[a]; all their captors hold them fast[b]; they refuse to let them go.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : les fils d’Israël et les fils de Juda sont tous deux opprimés[a]. Tous ceux qui les ont emmenés en captivité les retiennent fermement et refusent de les laisser partir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Les fils d’Israël sont opprimés, et les fils de Juda avec eux. »'
    reason: ambiguïté syntaxique concernant le rattachement de יַחְדָּו
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique française consacrée, naturelle et digne, qui conserve la solennité de l’hébreu.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par un terme français transparent pouvant désigner les armées célestes ou terrestres.
- source_word: עֲשׁוּקִים
  choice: sont opprimés
  rationale: Le participe passif décrit l’état présent commun aux deux groupes.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: Les fils d’Israël et les fils de Juda
  rationale: Préserve le parallélisme et l’expression filiale explicite de l’hébreu.
- source_word: יַחְדָּו
  choice: tous
  rationale: Dans cette construction, indique que les deux groupes partagent pareillement la même oppression; cette place est idiomatique en français.
- source_word: שֹׁבֵיהֶם
  choice: ceux qui les ont emmenés en captivité
  rationale: Explicite naturellement le participe actif de שׁבה sans le confondre avec de simples geôliers.
- source_word: הֶחֱזִיקוּ בָם
  choice: les retiennent fermement
  rationale: Rend l’idée d’une prise persistante et d’un refus de relâcher les captifs.
- source_word: מֵאֲנוּ שַׁלְּחָם
  choice: refusent de les laisser partir
  rationale: Expression française courante qui restitue le refus persistant de libérer les captifs.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom propre sans le remplacer par un titre.
- issue: Rendu de בְּנֵי pour les deux peuples
  choice: les fils d’Israël et les fils de Juda
  alternative: les Israélites et les Judéens
  rationale: Le rendu retenu conserve l’image généalogique et l’exact parallélisme du texte, sans réduire les groupes à des désignations politiques modernes.
- issue: Portée de יַחְדָּו
  choice: les deux groupes sont tous opprimés
  alternative: les fils de Juda avec eux
  rationale: La syntaxe permet de comprendre l’adverbe comme qualifiant la condition commune d’Israël et de Juda. La traduction principale préserve cette lecture naturelle, tandis que la note signale l’autre rattachement possible.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La répétition « les fils » conserve le parallélisme hébreu; « emmenés en captivité » privilégie la précision contextuelle à la brièveté de « ravisseurs ».
