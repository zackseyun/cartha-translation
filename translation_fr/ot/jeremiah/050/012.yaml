source:
  edition: WLC
  text: בּ֤וֹשָׁה אִמְּ/כֶם֙ מְאֹ֔ד חָפְרָ֖ה יֽוֹלַדְתְּ/כֶ֑ם הִנֵּה֙ אַחֲרִ֣ית גּוֹיִ֔ם מִדְבָּ֖ר צִיָּ֥ה וַ/עֲרָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/012.yaml
  text: Your mother will be utterly ashamed; she who gave birth to you will be disgraced. Behold[a], she will be the last of the nations, a wilderness, a dry land, and a desert.
translation:
  language: fr
  text: Votre mère sera profondément honteuse ; celle qui vous a mis au monde sera déshonorée. Voici qu’elle sera la dernière parmi les nations[a], un désert, une terre desséchée et une plaine aride.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la moindre des nations ». L’expression hébraïque peut désigner la position finale et diminuée de Babylone parmi les nations.'
    reason: Alternative lexicale liée à l’ambiguïté de אַחֲרִית גּוֹיִם.
lexical_decisions:
- source_word: בּוֹשָׁה
  choice: sera profondément honteuse
  rationale: Le parfait qal féminin singulier prend ici, dans le contexte de l’oracle prophétique, une valeur future. Cette formulation exprime naturellement la honte sans introduire plus explicitement que l’hébreu un agent qui la provoquerait.
- source_word: אִמְּכֶם
  choice: votre mère
  rationale: La métaphore maternelle désignant Babylone est conservée directement plutôt qu’explicitée par « ville mère » ou « patrie ».
- source_word: מְאֹד
  choice: profondément
  rationale: Cet adverbe rend avec naturel l’intensité de מְאֹד en français actuel.
- source_word: חָפְרָה
  choice: sera déshonorée
  rationale: Le terme exprime l’humiliation et la confusion. « Déshonorée » maintient une distinction avec בּוֹשָׁה tout en restant naturel dans le parallélisme.
- source_word: יֹלַדְתְּכֶם
  choice: celle qui vous a mis au monde
  rationale: Cette tournure conserve explicitement l’image de l’enfantement et évite un accord de genre absent du suffixe hébreu de deuxième personne du pluriel.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette formule attire l’attention sur l’issue annoncée et conserve le ton solennel de l’oracle dans un français compréhensible.
- source_word: אַחֲרִית גּוֹיִם
  choice: la dernière parmi les nations
  rationale: אַחֲרִית peut évoquer la position finale ou l’état auquel Babylone sera réduite. « La dernière parmi les nations » conserve cette ambiguïté de rang et d’aboutissement ; « la moindre » est signalé en note.
- source_word: מִדְבָּר
  choice: un désert
  rationale: Dans cet oracle de jugement, le mot décrit un espace désert et désolé. Le terme français est direct et distinct des deux expressions suivantes.
- source_word: צִיָּה
  choice: une terre desséchée
  rationale: Le substantif désigne un lieu marqué par la sécheresse ; « desséchée » restitue avec force cet état.
- source_word: וַעֲרָבָה
  choice: et une plaine aride
  rationale: עֲרָבָה désigne une plaine ou steppe désertique. « Plaine aride » est clair pour le lecteur moderne et préserve la progression en trois termes.
theological_decisions:
- issue: Personnification de Babylone comme mère et comme celle qui enfante
  choice: Conserver directement la métaphore maternelle dans le texte principal
  alternative: Expliciter par « ville mère » ou « patrie »
  rationale: L’image poétique appartient au texte hébreu. La conserver évite d’imposer dans la traduction une interprétation explicative.
- issue: Valeur des parfaits prophétiques
  choice: Rendre les deux premiers verbes au futur
  alternative: Employer le présent ou un passé à valeur résultative
  rationale: Dans cet oracle de jugement, les parfaits présentent comme certaine une issue encore annoncée. Le futur communique clairement cette fonction en français moderne.
- issue: Sens de אַחֲרִית גּוֹיִם
  choice: « la dernière parmi les nations » dans le texte, avec l’autre lecture en note
  alternative: « la moindre des nations »
  rationale: L’expression peut viser tant la dernière position que l’abaissement extrême de Babylone. Le texte principal garde la formulation la plus formellement proche, tandis que la note préserve l’autre nuance réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique et la métaphore maternelle sont conservés ; la série finale distingue trois images de désolation sans technicisme excessif.
