  text: ק֥וֹל מִלְחָמָ֖ה בָּ/אָ֑רֶץ וְ/שֶׁ֖בֶר גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/022.yaml
  text: The sound of war is in the land[a], and great destruction.
translation:
  language: fr
  text: Un bruit de guerre dans le pays[a], et un grand désastre !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un bruit de guerre dans le pays, et un grand fracas ! » Le nom hébreu שֶׁבֶר peut évoquer une cassure, un fracas, un effondrement ou une ruine, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Bruit
  rationale: קוֹל désigne une voix, un son ou un bruit. Dans ce contexte militaire et dans cette phrase exclamative sans verbe, « bruit » évoque naturellement le fracas audible de la guerre.
- source_word: מִלְחָמָה
  choice: guerre
  rationale: מִלְחָמָה peut désigner la guerre ou le combat. « Guerre » convient à l'ampleur territoriale de l'oracle contre Babylone.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut signifier terre, pays ou territoire. Ici, le contexte vise le pays de Babylone plutôt que la terre entière.
- source_word: וְשֶׁבֶר
  choice: désastre
  rationale: שֶׁבֶר exprime littéralement la cassure ou l'effondrement et, dans les annonces prophétiques de jugement, la ruine ou le désastre. « Désastre » rend clairement le résultat dévastateur tout en laissant la note signaler l'image concrète.
- source_word: גָּדוֹל
  choice: immense
  rationale: גָּדוֹל signifie grand ou considérable. « Immense » forme ici une exclamation naturelle et vigoureuse avec « désastre ».
