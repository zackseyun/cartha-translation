source:
  edition: WLC
  text: גֹּאֲלָ֣/ם חָזָ֗ק יְהוָ֤ה צְבָאוֹת֙ שְׁמ֔/וֹ רִ֥יב יָרִ֖יב אֶת רִיבָ֑/ם לְמַ֨עַן֙ הִרְגִּ֣יעַ אֶת הָ/אָ֔רֶץ וְ/הִרְגִּ֖יז לְ/יֹשְׁבֵ֥י בָבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/034.yaml
  text: Their Redeemer is strong[a]; Yahweh of Armies is his name. He will surely plead their case[d][c][b], so that he may give rest to the earth and bring unrest to the inhabitants of Babylon.
translation:
  language: fr
  text: Leur rédempteur est puissant[a] ; Yahvé des armées[b], tel est son nom. Il défendra certainement leur cause[c], afin de donner du repos à la terre[d] et de troubler les habitants de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Celui qui les rachète est puissant ». Le terme hébreu peut désigner un proche parent chargé de racheter, de délivrer ou de défendre les droits d’un membre de sa famille.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « le SEIGNEUR des armées » ou « le SEIGNEUR des puissances ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « Il prendra certainement en main leur litige ». L’hébreu répète ici des mots de même racine pour renforcer l’affirmation.
    reason: lexical_alternative
  - marker: d
    text: « La terre » peut aussi se traduire par « le pays ».
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּאֲלָם
  choice: leur rédempteur
  rationale: Le nom גֹּאֵל désigne celui qui rachète, délivre ou fait valoir les droits d’un proche. « Rédempteur » conserve cette fonction sans limiter le terme à une seule de ses dimensions juridiques ou familiales.
- source_word: חָזָק
  choice: puissant
  rationale: L’adjectif exprime la force. « Puissant » convient naturellement à une personne capable de délivrer et garde le registre solennel de l’oracle.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: « Yahvé » représente le nom divin יהוה, tandis que « des armées » rend concrètement צְבָאוֹת plutôt que de reprendre l’expression traditionnelle et moins transparente « des armées célestes » ou « des puissances ».
- source_word: שְׁמוֹ
  choice: tel est son nom
  rationale: Cette formulation française naturelle restitue la formule hébraïque d’identification et met le titre divin en relief.
- source_word: רִיב יָרִיב אֶת רִיבָם
  choice: Il défendra certainement leur cause
  rationale: Le verbe et le nom apparentés relèvent du litige ou de la contestation judiciaire. « Défendra leur cause » en garde la portée juridique, et « certainement » traduit l’intensification produite par l’infinitif absolu suivi du verbe conjugué.
- source_word: לְמַעַן
  choice: afin de
  rationale: La locution exprime clairement le but ou le résultat visé dans un français actuel et digne.
- source_word: הִרְגִּיעַ אֶת הָאָרֶץ
  choice: donner du repos à la terre
  rationale: Le causatif de רגע indique l’action d’apaiser ou de faire reposer. « Donner du repos » conserve cette valeur causative. הָאָרֶץ peut désigner la terre au sens large ou le pays.
- source_word: וְהִרְגִּיז
  choice: troubler
  rationale: Le verbe signifie provoquer agitation, tremblement ou inquiétude. « Troubler » est idiomatique et maintient l’opposition avec le repos accordé à la terre sans imposer un tremblement uniquement physique.
- source_word: לְיֹשְׁבֵי בָבֶל
  choice: les habitants de Babylone
  rationale: Cette expression française claire reproduit le sens collectif de ceux qui résident à Babylone.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La forme « Yahvé », courante en français, le présente comme un nom propre plutôt que de le remplacer par un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Les deux sens sont possibles. Le contraste entre le repos donné à la terre et le trouble infligé aux habitants de Babylone favorise ici la portée plus large, sans exclure l’autre lecture, signalée en note.
- issue: Portée juridique de ריב
  choice: défendra leur cause
  alternative: soutiendra leur procès
  rationale: La racine évoque un litige et l’intervention en faveur d’une partie. La traduction choisie conserve cette dimension judiciaire dans une formulation française accessible, sans préciser indûment le rôle procédural.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe reste proche du parallélisme hébreu, tandis que « défendra leur cause » et « troubler » rendent les images juridiques et rhétoriques dans un langage courant. Les quatre appels de note figurent explicitement dans le texte principal.
