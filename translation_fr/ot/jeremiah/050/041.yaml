  text: הִנֵּ֛ה עַ֥ם בָּ֖א מִ/צָּפ֑וֹן וְ/ג֤וֹי גָּדוֹל֙ וּ/מְלָכִ֣ים רַבִּ֔ים יֵעֹ֖רוּ מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/041.yaml
  text: Behold[a], a people is coming from the north[b], and a great nation and many kings will be stirred up from the farthest parts of the earth.
translation:
  language: fr
  text: Voici qu’un peuple vient du nord ; une grande nation et de nombreux rois seront mis en mouvement[a] depuis les régions les plus reculées de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront réveillés » ou « seront mobilisés » ; le verbe hébreu évoque le fait d’être éveillé ou poussé à l’action.
    reason: lexical_alternative
  - marker: b
    text: Ou « depuis les confins de la terre » ou « depuis les extrémités de la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Marqueur discursif qui attire solennellement l’attention sur l’annonce, dans un français actuel et digne.
- source_word: עַם
  choice: un peuple
  rationale: Rend le groupe humain désigné par עַם et maintient la distinction avec גּוֹי, traduit ensuite par « nation ».
- source_word: בָּא
  choice: vient
  rationale: Le parfait après הִנֵּה présente ici l’arrivée de manière vive et imminente ; le présent français conserve cet effet prophétique.
- source_word: מִצָּפוֹן
  choice: du nord
  rationale: Rendu directionnel direct et idiomatique.
- source_word: גּוֹי גָּדוֹל
  choice: une grande nation
  rationale: « Nation » convient à la dimension collective et politique de גּוֹי tout en la distinguant du « peuple » précédent.
- source_word: וּמְלָכִים רַבִּים
  choice: et de nombreux rois
  rationale: Traduction naturelle qui conserve explicitement la pluralité des souverains.
- source_word: יֵעֹרוּ
  choice: seront mis en mouvement
  rationale: Le nifal exprime le fait d’être éveillé, soulevé ou poussé à l’action. Cette formulation préserve la valeur passive sans préciser au-delà du texte la nature exacte de la mobilisation.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: depuis les régions les plus reculées de la terre
  rationale: La locution désigne les confins ou parties éloignées de la terre ; ce rendu exprime naturellement l’éloignement extrême.
theological_decisions: []
