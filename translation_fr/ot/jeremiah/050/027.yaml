  text: חִרְבוּ֙ כָּל פָּרֶ֔י/הָ יֵרְד֖וּ לַ/טָּ֑בַח ה֣וֹי עֲלֵי/הֶ֔ם כִּֽי בָ֥א יוֹמָ֖/ם עֵ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/027.yaml
  text: Slay all her bulls; let them go down to the slaughter. Woe to them[a], for their day has come, the time of their punishment.
translation:
  language: fr
  text: Abattez tous ses jeunes taureaux ! Qu’ils descendent au massacre ! Malheur à eux, car leur jour est arrivé, le temps de leur châtiment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temps de leur visitation ». Le terme hébreu peut désigner une visitation pour le jugement, une inspection ou un règlement de comptes ; ici, le contexte indique un jugement punitif.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְבוּ
  choice: Abattez
  rationale: L’impératif causatif exprime ici la mise à mort dans un contexte guerrier. « Abattez » est direct, naturel en français et s’accorde avec l’image animale des jeunes taureaux.
- source_word: כָּל פָּרֶיהָ
  choice: tous ses jeunes taureaux
  rationale: פָּר désigne un jeune taureau. La traduction conserve l’image prophétique plutôt que de la remplacer par son référent possible, les guerriers ou les puissants de Babylone.
- source_word: יֵרְדוּ לַטָּבַח
  choice: Qu’ils descendent au lieu d’égorgement
  rationale: Le jussif est rendu par « Qu’ils descendent ». טֶבַח évoque l’abattage ou l’égorgement; la formulation conserve le mouvement et prolonge l’image des taureaux.
- source_word: הוֹי עֲלֵיהֶם
  choice: Malheur à eux
  rationale: Formule prophétique française naturelle, qui garde à la fois la lamentation et l’annonce du jugement.
- source_word: כִּי בָא יוֹמָם
  choice: car leur jour est arrivé
  rationale: Le parfait présente le jour fixé comme désormais arrivé. « Leur jour » conserve l’expression concise de l’hébreu.
- source_word: עֵת פְּקֻדָּתָם
  choice: le temps où ils devront rendre des comptes
  rationale: פְּקֻדָּה peut désigner une intervention, une inspection ou un règlement de comptes, ici dans un contexte punitif. Cette formulation française reste compréhensible tout en évitant de réduire entièrement le terme à « châtiment ».
theological_decisions:
- issue: Sens judiciaire de פְּקֻדָּה
  choice: le temps où ils devront rendre des comptes
  alternative: le temps de leur châtiment / le temps de leur intervention divine
  rationale: Le contexte annonce le jugement de Babylone, mais le nom hébreu garde une gamme sémantique plus large que le seul châtiment. « Rendre des comptes » exprime le règlement judiciaire sans imposer une précision doctrinale absente du terme lui-même.
translation_notes:
  register: Français moderne, solennel et prophétique. Les impératifs brefs conservent la violence et le rythme de l’oracle. L’image des jeunes taureaux est maintenue sans l’expliquer dans le corps du texte.
