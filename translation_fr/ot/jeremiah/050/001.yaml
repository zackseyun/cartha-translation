id: JER.50.1
reference: Jeremiah 50:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל בָּבֶ֖ל אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/001.yaml
  text: 'The word that Yahweh spoke concerning Babylon[a], concerning the land of the Chaldeans[b], by the hand of Jeremiah the prophet:'
translation:
  language: fr
  text: 'La parole que Yahweh prononça au sujet de Babylone[a], au sujet du pays des Chaldéens, par l’intermédiaire du prophète Jérémie[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre Babylone, contre le pays des Chaldéens ». La préposition hébraïque peut introduire un oracle dirigé contre une nation; dans ce titre, elle est rendue de manière plus générale par « au sujet de ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « par la main du prophète Jérémie », expression hébraïque qui signifie ici « par l’intermédiaire du prophète Jérémie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans une introduction prophétique, « la parole » conserve la formule hébraïque traditionnelle tout en restant naturelle et digne en français.
- source_word: דִּבֶּר
  choice: prononça
  rationale: « Prononça » exprime ici l’acte solennel de parler sans ajouter l’idée plus interprétative de proclamation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: au sujet de
  rationale: Dans ce titre d’oracle, cette traduction garde une portée générale et n’impose pas d’avance le sens hostile possible de « contre ».
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française usuelle du nom géographique.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: le pays des Chaldéens
  rationale: Cette formulation rend directement l’expression ethnogéographique hébraïque et demeure idiomatique en français.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression hébraïque « par la main de » marque ici l’intermédiaire ou l’agent; la formulation retenue en communique naturellement le sens en français moderne.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: du prophète Jérémie
  rationale: L’ordre français naturel intègre le titre apposé tout en identifiant clairement Jérémie comme prophète.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Valeur de אֶל dans le titre prophétique
  choice: au sujet de Babylone, au sujet du pays des Chaldéens
  alternative: contre Babylone, contre le pays des Chaldéens
  rationale: La préposition peut introduire un oracle dirigé contre une nation, mais le titre permet une formulation thématique plus large. Le texte principal préserve cette latitude, et la note signale l’autre valeur possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve la forme d’un titre prophétique. « Par l’intermédiaire » privilégie la clarté actuelle, tandis que la note maintient visible l’image littérale de la main.
