  text: At the sound of Babylon being captured, the earth quakes, and a cry is heard among the nations.
translation:
  language: fr
  text: Au bruit de la prise de Babylone, la terre tremble, et un cri retentit parmi les nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל
  choice: Au bruit de
  rationale: Rend naturellement la préposition מִן avec קוֹל dans une relation de cause ou de réaction sonore.
- source_word: נִתְפְּשָׂה בָבֶל
  choice: la prise de Babylone
  rationale: Le niphal de תפש exprime ici la capture de la ville; la tournure nominale française conserve la concision du texte.
- source_word: נִרְעֲשָׁה הָאָרֶץ
  choice: la terre tremble
  rationale: רעש décrit une forte secousse ou agitation; « tremble » est idiomatique et laisse ouverte la portée locale ou cosmique de הָאָרֶץ.
- source_word: וּזְעָקָה בַּגּוֹיִם נִשְׁמָע
  choice: et un cri retentit parmi les nations
  rationale: « Retentit » exprime le fait d'être entendu et la propagation du cri, tandis que « parmi les nations » suit la valeur de בְּ.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte peut évoquer une vaste commotion liée à la chute de Babylone; « la terre » préserve l'ampleur et l'ambiguïté du terme hébreu sans la réduire à un territoire précis.
translation_notes:
  register: Français moderne, sobre et prophétique. La phrase conserve le parallélisme entre le tremblement de la terre et le cri entendu parmi les nations.
