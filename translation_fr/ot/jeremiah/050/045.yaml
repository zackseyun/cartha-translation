  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל בָּבֶ֔ל וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נָוֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/045.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Babylon[a], and his thoughts that he has devised against the land of the Chaldeans: Surely the little ones of the flock will drag them away[c][b]; surely he will make their pasture desolate.'
translation:
  language: fr
  text: 'Écoutez donc le dessein que Yahweh a formé contre Babylone, et les projets qu’il a conçus contre le pays des Chaldéens : assurément, les jeunes du troupeau les traîneront au loin[a] ; assurément, il dévastera leur pâturage[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les plus faibles du troupeau ». L’expression peut désigner, de façon imagée, les plus faibles ou les moins importants parmi les assaillants de Babylone.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur demeure ». Le mot hébreu peut désigner un pâturage, un enclos ou un lieu d’habitation ; la construction hébraïque de cette proposition est difficile.
    reason: textual_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: donc
  rationale: Marque naturellement en français la conséquence ou la conclusion introduite par l’oracle précédent.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel appelle à une écoute attentive ; « écoutez » est plus idiomatique que « entendez » dans ce contexte prophétique.
- source_word: עֲצַת יְהוָה
  choice: le dessein que Yahweh a formé
  rationale: עֵצָה désigne ici une décision délibérée, un plan ou un dessein. « Dessein » convient au registre prophétique sans être archaïque ; le nom divin est translittéré « Yahweh ».
- source_word: וּמַחְשְׁבוֹתָיו אֲשֶׁר חָשַׁב
  choice: et les projets qu’il a conçus
  rationale: Le français naturel demande ici un terme exprimant une intention élaborée. « Projets » et « conçus » maintiennent le parallélisme tout en évitant une répétition lourde de « dessein » et « formé ».
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: le pays des Chaldéens
  rationale: Rend directement l’expression hébraïque et reste transparent pour le lecteur moderne.
- source_word: אִם לֹא
  choice: oui
  rationale: Dans cette formule de serment, l’expression ne fonctionne pas comme une condition ordinaire, mais comme une affirmation énergique. La répétition de « oui » restitue cette force avec naturel.
- source_word: צְעִירֵי הַצֹּאן
  choice: les plus petits du troupeau
  rationale: 'Préserve l’image littérale tout en permettant le sens métaphorique probable : même les membres les moins importants ou les plus faibles du groupe assaillant.'
- source_word: יִסְחָבוּם
  choice: les traîneront au loin
  rationale: Le verbe exprime l’action de tirer ou d’emporter en traînant ; le pronom objet pluriel est conservé.
- source_word: יַשִּׁים עֲלֵיהֶם נָוֶה
  choice: il dévastera leur pâturage
  rationale: Rend de manière idiomatique la destruction du נָוֶה associé aux personnes visées. La formulation hébraïque est difficile et permet aussi de comprendre נָוֶה comme habitation ou demeure.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: La translittération préserve le nom propre présent dans le texte hébreu au lieu de lui substituer un titre.
- issue: Identité des « plus petits du troupeau »
  choice: Conserver la métaphore sans identifier explicitement les assaillants
  alternative: les plus faibles des assaillants
  rationale: Le référent métaphorique probable ne doit pas être transformé en interprétation explicite dans le corps du texte.
- issue: Sens de la dernière proposition
  choice: il dévastera leur pâturage
  alternative: leur demeure sera dévastée / leur pâturage sera frappé de stupeur à leur sujet
  rationale: Le texte annonce clairement un désastre, mais sa syntaxe et le champ sémantique de נָוֶה permettent plusieurs nuances. Le texte principal retient une lecture causative courante, tandis que la note signale l’alternative lexicale sans résoudre davantage l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme prophétique est conservé, ainsi que la répétition emphatique de la formule de serment. Les pronoms masculins pluriels renvoient implicitement aux habitants ou aux défenseurs du pays des Chaldéens, sans ajout explicatif dans le texte.
