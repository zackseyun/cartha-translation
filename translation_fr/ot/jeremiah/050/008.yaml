  text: נֻ֚דוּ מִ/תּ֣וֹךְ בָּבֶ֔ל וּ/מֵ/אֶ֥רֶץ כַּשְׂדִּ֖ים יצאו וִ/הְי֕וּ כְּ/עַתּוּדִ֖ים לִ/פְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/008.yaml
  text: Flee from the midst of Babylon[a], and go out from the land of the Chaldeans; and be like male goats before the flock.
translation:
  language: fr
  text: Fuyez du milieu de Babylone, sortez du pays des Chaldéens, et soyez comme des boucs devant le troupeau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֻדוּ
  choice: Fuyez
  rationale: Dans cet appel pressant à quitter Babylone vouée au jugement, « fuyez » rend naturellement la force de l’impératif, plutôt que le sens plus général de « partez » ou « éloignez-vous ».
- source_word: מִתּוֹךְ בָּבֶל
  choice: du milieu de Babylone
  rationale: Cette formulation conserve l’image hébraïque d’un départ depuis l’intérieur même de la ville tout en restant idiomatique en français.
- source_word: וּמֵאֶרֶץ כַּשְׂדִּים יצאו
  choice: sortez du pays des Chaldéens
  rationale: Le contexte d’exhortation conduit à rendre יצאו comme la continuation de l’ordre précédent. « Pays des Chaldéens » suit explicitement la désignation hébraïque sans la remplacer par « Chaldée ».
- source_word: וִהְיוּ כְּעַתּוּדִים
  choice: soyez comme des boucs
  rationale: עַתּוּדִים désigne ici des boucs. Le terme français est précis, courant et plus naturel que « chèvres mâles ».
- source_word: לִפְנֵי צֹאן
  choice: qui marchent en tête du troupeau
  rationale: Littéralement « devant le troupeau », l’expression évoque les boucs qui passent les premiers et entraînent le troupeau. « Marchent en tête » explicite sobrement cette fonction sans abandonner l’image.
