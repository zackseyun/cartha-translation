id: JER.50.13
reference: Jeremiah 50:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/קֶּ֤צֶף יְהוָה֙ לֹ֣א תֵשֵׁ֔ב וְ/הָיְתָ֥ה שְׁמָמָ֖ה כֻּלָּ֑/הּ כֹּ֚ל עֹבֵ֣ר עַל בָּבֶ֔ל יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/013.yaml
  text: Because of the wrath of Yahweh[a], it will not be inhabited, but will become a complete desolation. Everyone who passes by Babylon will be appalled and will hiss over all her wounds.
translation:
  language: fr
  text: À cause de la fureur de Yahweh, elle ne sera plus habitée ; elle deviendra une désolation totale. Quiconque passera près de Babylone sera consterné et sifflera[a] devant toutes ses blessures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussera des sifflements ». Le verbe hébreu peut désigner un sifflement ou un son analogue, pouvant exprimer la stupeur, la dérision ou le mépris devant la ruine de Babylone.
    reason: alternative lexicale et nuance contextuelle
lexical_decisions:
- source_word: מִקֶּצֶף יְהוָה
  choice: À cause de la fureur de Yahweh
  rationale: La préposition מִן exprime ici la cause. « Fureur » restitue la force de קֶצֶף, et « Yahweh » transcrit le nom divin.
- source_word: לֹא תֵשֵׁב
  choice: elle ne sera plus habitée
  rationale: Le féminin renvoie à Babylone, conçue comme une ville. Le passif français exprime naturellement ici l'absence future d'habitants.
- source_word: וְהָיְתָה שְׁמָמָה כֻּלָּהּ
  choice: elle deviendra tout entière un lieu dévasté
  rationale: שְׁמָמָה évoque la dévastation, tandis que כֻּלָּהּ indique qu'elle atteindra la ville entière.
- source_word: כֹּל עֹבֵר עַל בָּבֶל
  choice: Quiconque passera près de Babylone
  rationale: L'expression désigne les passants qui longent la ville et voient ses ruines.
- source_word: יִשֹּׁם
  choice: sera consterné
  rationale: Le verbe שׁמם décrit ici la réaction saisie et horrifiée du passant devant la dévastation.
- source_word: וְיִשְׁרֹק
  choice: sifflera
  rationale: שרק peut désigner un sifflement ou un chuintement exprimant la stupeur, la dérision ou le mépris ; « sifflera » garde le geste concret sans en fixer excessivement la nuance.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: à la vue de toutes ses blessures
  rationale: מַכּוֹת désigne les coups reçus ou leurs blessures. La formulation française conserve la personnification féminine de Babylone.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; sa transcription préserve le nom propre plutôt que de lui substituer un titre.
- issue: Nuance du sifflement des passants
  choice: Ne pas préciser dans le corps du texte s'il exprime la stupeur ou la dérision
  alternative: sifflera de mépris
  rationale: Le contexte de jugement permet une nuance de dérision, mais le verbe hébreu n'impose pas à lui seul une seule valeur émotionnelle.
translation_notes:
  register: Français international actuel, digne et accessible. La personnification féminine de Babylone est maintenue par « elle » et « ses blessures » ; la syntaxe prophétique reste ferme sans calque hébraïque.
