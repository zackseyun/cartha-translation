revisions:
- from: À cause de la fureur de Yahweh, elle ne sera plus habitée ; elle deviendra tout entière un lieu dévasté. Quiconque passera près de Babylone sera consterné et sifflera[a] à la vue de toutes ses blessures.
  to: À cause de la fureur de Yahweh, elle ne sera plus habitée ; elle deviendra une désolation totale. Quiconque passera près de Babylone sera consterné et sifflera[a] devant toutes ses blessures.
  rationale: La révision améliore la syntaxe française et rend plus explicitement la désolation intégrale, sans modifier le sens ni supprimer l’ambiguïté contextuelle du sifflement. Le nom divin et la personnification féminine de Babylone sont conservés.
