  to: 'Car voici : moi, je suscite et fais venir contre Babylone un rassemblement de grandes nations du pays du nord. Elles se rangeront en ordre de bataille contre elle ; de là, elle sera prise.[a] Ses flèches seront comme celles d’un guerrier habile, qui ne revient pas à vide.[b]'
  rationale: La révision conserve les choix lexicaux solides du projet et corrige uniquement l’attribution du verbe singulier final. Elle maintient l’ambiguïté réelle du référent de « ses flèches » et explique, sans la résoudre de manière excessive, la relation condensée entre les flèches et le guerrier.
