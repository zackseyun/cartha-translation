review_pass:
  verdict: revise
  source_fidelity: 'La première moitié rend fidèlement l’initiative divine, l’assemblée de nations et leur déploiement contre Babylone. La finale doit toutefois mieux refléter la syntaxe hébraïque : le verbe « ne revient pas à vide » est au singulier et se rattache naturellement au « guerrier habile » de la comparaison, plutôt qu’à « aucune » des flèches.'
  naturalness: Le français est globalement moderne et soutenu. « De là, elle sera prise » est plus direct et plus naturel que « c’est de là qu’elle sera prise », tout en gardant l’antéposition de מִשָּׁם.
  terminology: « Suscite », « fais venir », « rassemblement », « pays du nord », « se rangeront en ordre de bataille » et « guerrier habile » sont appropriés. « Ses flèches » conserve utilement le suffixe singulier, dont le référent collectif reste possible.
  issues:
  - severity: medium
    issue: Le texte traduit לֹא יָשׁוּב רֵיקָם par « aucune ne reviendra à vide ».
    rationale: Le verbe hébreu est au singulier. Dans la construction condensée, il se comprend le plus naturellement du guerrier habile, même si l’image des flèches demeure liée à la comparaison. « Aucune » impose les flèches comme sujet et modifie cette relation.
  - severity: low
    issue: La note b présente comme littérale une formulation française où « ne reviendront » est au pluriel.
    rationale: Cette formulation ne reproduit pas le singulier de יָשׁוּב et renforce l’interprétation que le texte révisé évite d’imposer.
