language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה אָנֹכִ֡י מֵעִיר֩ וּ/מַעֲלֶ֨ה עַל בָּבֶ֜ל קְהַל גּוֹיִ֤ם גְּדֹלִים֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וְ/עָ֣רְכוּ לָ֔/הּ מִ/שָּׁ֖ם תִּלָּכֵ֑ד חִצָּי/ו֙ כְּ/גִבּ֣וֹר מַשְׁכִּ֔יל לֹ֥א יָשׁ֖וּב רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/009.yaml
  text: For behold[a], I am stirring up and bringing against Babylon an assembly of great nations from the land of the north. They will array themselves against her; from there she will be captured. Their arrows are like those of a skilled warrior[b]; none returns empty-handed.
translation:
  language: fr
  text: 'Car voici : moi, je suscite et fais venir contre Babylone un rassemblement de grandes nations du pays du nord. Elles se rangeront en ordre de bataille contre elle ; de là, elle sera prise.[a] Ses flèches seront comme celles d’un guerrier habile, qui ne revient pas à vide.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « de là » renvoie probablement à l’endroit où les nations se rangeront contre Babylone.
    reason: cultural_note
  - marker: b
    text: 'Littéralement, la comparaison est condensée : « Ses flèches, comme un guerrier habile ; il ne revient pas à vide. » Le singulier « il ne revient pas » se rapporte probablement au guerrier ; l’image peut aussi évoquer l’efficacité des flèches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִיר
  choice: je suscite
  rationale: Le participe hiphil exprime l’action de mettre en mouvement ou de pousser à agir. « Susciter » rend clairement la causalité divine dans un français actuel et digne.
- source_word: וּמַעֲלֶה
  choice: fais venir contre
  rationale: Dans ce contexte militaire, le hiphil de עלה désigne le fait d’amener une force contre une ville. « Fais venir contre » conserve la valeur causative sans imposer en français l’image géographique de la montée.
- source_word: קְהַל גּוֹיִם גְּדֹלִים
  choice: un rassemblement de grandes nations
  rationale: קהל désigne un corps réuni ou convoqué. « Rassemblement » reste proche du sens et évite le terme plus interprétatif « coalition » ; « grandes nations » préserve l’ambivalence entre grandeur, puissance et importance.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: du pays du nord
  rationale: Cette formulation naturelle conserve l’expression géographique prophétique sans la préciser davantage.
- source_word: וְעָרְכוּ לָהּ
  choice: Elles se rangeront en ordre de bataille contre elle
  rationale: 'ערך possède ici un sens militaire : disposer des troupes en formation. Le pronom pluriel reprend naturellement les nations, tandis que « elle » désigne Babylone.'
- source_word: מִשָּׁם תִּלָּכֵד
  choice: c’est de là qu’elle sera prise
  rationale: La tournure met en relief l’adverbe « de là » comme dans l’hébreu et conserve le passif militaire de לכד.
- source_word: חִצָּיו
  choice: Ses flèches
  rationale: Le suffixe hébreu est masculin singulier et peut reprendre collectivement le rassemblement ennemi. Le singulier français « rassemblement » permet de conserver cette forme sans choisir artificiellement un référent personnel.
- source_word: כְּגִבּוֹר מַשְׂכִּיל
  choice: comme celles d’un guerrier habile
  rationale: משכיל peut évoquer l’habileté, la perspicacité ou la réussite. « Habile » convient à l’image guerrière ; « celles d’un » explicite seulement le rapport comparatif très condensé en hébreu.
- source_word: לֹא יָשׁוּב רֵיקָם
  choice: aucune ne reviendra à vide
  rationale: Cette traduction garde l’image littérale d’un retour qui n’est pas « vide » et laisse ouverte la manière précise dont les flèches atteignent leur objectif.
theological_decisions:
- issue: Action divine dans l’invasion de Babylone
  choice: Le locuteur divin se présente comme celui qui suscite et fait venir les nations contre Babylone.
  alternative: Comprendre le verset comme une simple annonce descriptive de l’invasion.
  rationale: Le pronom emphatique אָנֹכִי et les deux formes causatives מֵעִיר et מַעֲלֶה attribuent explicitement l’initiative au locuteur divin.
- issue: Référent du suffixe dans חִצָּיו
  choice: « Ses flèches » renvoie au rassemblement ennemi envisagé comme une unité collective.
  alternative: « Leurs flèches » renverrait directement aux nations au pluriel, ou « ses flèches » pourrait viser un guerrier personnifié.
  rationale: Le suffixe est grammaticalement singulier, mais son antécédent précis demeure légèrement ambigu. La traduction conserve le singulier hébreu sans transformer le collectif en personnage explicitement identifié.
translation_notes:
  register: 'Français international moderne, clair et soutenu sans archaïsmes. « Car voici : moi » conserve l’ouverture solennelle et l’emphase du pronom hébreu. Le vocabulaire militaire reste explicite, tandis que les notes signalent les deux ambiguïtés réelles du texte.'
