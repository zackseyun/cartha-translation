source:
  edition: WLC
  text: אֵ֤יךְ נִגְדַּע֙ וַ/יִּשָּׁבֵ֔ר פַּטִּ֖ישׁ כָּל הָ/אָ֑רֶץ אֵ֣יךְ הָיְתָ֧ה לְ/שַׁמָּ֛ה בָּבֶ֖ל בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/023.yaml
  text: How the hammer of the whole earth has been cut down and broken! How Babylon has become a desolation among the nations![a][b]
translation:
  language: fr
  text: Comment le marteau[a] de toute la terre a été abattu et brisé ! Comment Babylone est devenue un lieu dévasté[b] parmi les nations !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le marteau de guerre de toute la terre ». La métaphore hébraïque présente Babylone comme l’instrument qui écrasait les nations.
    reason: lexical_alternative
  - marker: b
    text: Ou « un objet d’horreur parmi les nations ». Le terme hébreu peut évoquer à la fois la dévastation et la stupeur horrifiée causée par cette ruine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment… !
  rationale: Introduit ici deux exclamations de stupeur ou de lamentation, et non des questions demandant une réponse. La tournure française « Comment… ! » conserve cette force rhétorique.
- source_word: נִגְדַּע
  choice: a été abattu
  rationale: Le niphal de גדע exprime l'action d'être coupé ou abattu. Avec l'image du marteau personnifiant Babylone, « abattu » est naturel et évoque sa chute sans ajouter une interprétation.
- source_word: וַיִּשָּׁבֵר
  choice: et brisé
  rationale: Le verbe שבר indique ici que le marteau a été brisé. Le choix reste sobre et garde la coordination hébraïque.
- source_word: פַּטִּישׁ
  choice: le marteau
  rationale: Le nom désigne un marteau et sert métaphoriquement à présenter Babylone comme l'instrument qui écrasait les nations. L'image directe est conservée.
- source_word: כָּל הָאָרֶץ
  choice: de toute la terre
  rationale: Dans ce contexte international, renforcé par « parmi les nations », « terre » rend mieux la portée globale que « pays ».
- source_word: הָיְתָה לְשַׁמָּה
  choice: est devenue un lieu dévasté
  rationale: שַׁמָּה peut désigner la dévastation ainsi que la stupeur horrifiée qu'elle provoque. « Un lieu dévasté » exprime naturellement en français l'état de ruine, tandis que l'autre nuance est signalée en note.
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française usuelle du nom géographique.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Dans ce contexte géopolitique, גּוֹיִם désigne les nations en général ; « nations » évite la connotation théologique plus tardive de « païens ».
theological_decisions:
- issue: Identification métaphorique de Babylone comme « le marteau de toute la terre »
  choice: Conserver directement la métaphore du marteau.
  alternative: Rendre par « le destructeur de toute la terre » ou expliciter « le marteau de guerre de toute la terre ».
  rationale: 'L''image hébraïque structure l''ironie du jugement : l''instrument qui frappait les autres est lui-même abattu et brisé. La conserver évite de réduire ou de résoudre la métaphore.'
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les deux exclamations parallèles et la métaphore centrale sont préservées. Le passé composé restitue naturellement l'état résultant des formes verbales dans ce cri de stupeur.
