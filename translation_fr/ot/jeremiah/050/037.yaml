    text: Ou « toute la population étrangère » ou « toutes les troupes auxiliaires étrangères ». L’hébreu désigne probablement une population composite ou des forces étrangères présentes à Babylone.
    reason: lexical_alternative
  - marker: b
    text: 'Expression guerrière ancienne : elle signifie qu’ils perdront courage ou deviendront craintifs.'
    reason: cultural_note
  revision_rationale: 'La seule correction nécessaire est syntaxique : le référent de la population mêlée est formulé au pluriel afin d’accorder naturellement « ils deviendront », conformément au pluriel hébreu. Les notes restent ancrées aux expressions qu’elles expliquent et l’ambiguïté de עֶרֶב est conservée.'
