  variant: modern international French
source:
  edition: WLC
  text: חֶ֜רֶב אֶל סוּסָ֣י/ו וְ/אֶל רִכְבּ֗/וֹ וְ/אֶל כָּל הָ/עֶ֛רֶב אֲשֶׁ֥ר בְּ/תוֹכָ֖/הּ וְ/הָי֣וּ לְ/נָשִׁ֑ים חֶ֥רֶב אֶל אוֹצְרֹתֶ֖י/הָ וּ/בֻזָּֽזוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/037.yaml
  text: A sword against his horses and against his chariots[a], and against all the mixed people in her midst, and they will become women. A sword against her treasuries[b], and they will be plundered.
translation:
  language: fr
  text: 'L’épée contre ses chevaux et contre ses chars, contre tous les membres de la population mêlée qui est en son sein[a] : ils deviendront des femmes[b]. L’épée contre ses trésors, et ils seront pillés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la population étrangère » ou « toutes les troupes auxiliaires étrangères ». L’hébreu désigne probablement une population composite ou des forces étrangères présentes à Babylone.
    reason: lexical_alternative
  - marker: b
    text: 'Expression guerrière ancienne : elle signifie qu’ils perdront courage ou deviendront craintifs.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶרֶב
  choice: L’épée contre
  rationale: La formule nominale elliptique annonce avec concision une attaque. Cette tournure conserve le rythme abrupt de l’oracle sans ajouter un verbe absent de l’hébreu.
- source_word: סוּסָיו
  choice: ses chevaux
  rationale: Le suffixe masculin singulier renvoie au détenteur des forces de Babylone. En français, « ses » préserve naturellement la référence sans imposer un genre au possesseur.
- source_word: רִכְבּוֹ
  choice: ses chars
  rationale: Le singulier collectif hébreu désigne ici les chars ou les forces de chars; le pluriel français exprime naturellement ce sens militaire.
- source_word: כָּל הָעֶרֶב
  choice: toute la population mêlée
  rationale: עֶרֶב désigne vraisemblablement un ensemble de populations diverses ou des auxiliaires étrangers. « Population mêlée » conserve ce sens sans préciser de façon incertaine qu’il s’agit de mercenaires.
- source_word: בְּתוֹכָהּ
  choice: qui se trouve au milieu d’elle
  rationale: Le suffixe féminin renvoie à Babylone personnifiée comme ville. La formulation maintient cette personnification.
- source_word: וְהָיוּ לְנָשִׁים
  choice: Ils deviendront des femmes
  rationale: La traduction garde l’expression explicite et provocante de l’hébreu; sa valeur idiomatique ancienne est expliquée en note plutôt que remplacée dans le texte.
- source_word: אוֹצְרֹתֶיהָ
  choice: ses trésors
  rationale: Le terme peut désigner des réserves de richesses ou les lieux où elles sont conservées. « Trésors » convient au contexte de richesses saisies et permet un référent naturel au verbe passif suivant.
- source_word: וּבֻזָּזוּ
  choice: et ils seront pillés
  rationale: Le passif pluriel se rapporte le plus naturellement aux trésors; « pillés » restitue le cadre de conquête militaire.
theological_decisions:
- issue: Expression genrée לְנָשִׁים
  choice: Ils deviendront des femmes
  alternative: Ils perdront courage / ils deviendront craintifs
  rationale: Le texte principal préserve la formulation genrée de l’hébreu et la tension culturelle qu’elle produit. La note indique sa fonction idiomatique dans l’ancien langage guerrier sans l’atténuer silencieusement.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « L’épée contre » et les exclamations maintiennent le caractère abrupt de l’oracle. Les suffixes hébreux de genres différents sont rendus par le possessif français non marqué « ses », tandis que « elle » conserve la personnification féminine de Babylone.
