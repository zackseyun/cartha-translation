  rationale: 'La seule correction nécessaire est syntaxique : le référent de la population mêlée est formulé au pluriel afin d’accorder naturellement « ils deviendront », conformément au pluriel hébreu. Les notes restent ancrées aux expressions qu’elles expliquent et l’ambiguïté de עֶרֶב est conservée.'
