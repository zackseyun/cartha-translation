source:
  edition: WLC
  text: עַל הָ/אָ֤רֶץ מְרָתַ֨יִם֙ עֲלֵ֣ה עָלֶ֔י/הָ וְ/אֶל יוֹשְׁבֵ֖י פְּק֑וֹד חֲרֹ֨ב וְ/הַחֲרֵ֤ם אַֽחֲרֵי/הֶם֙ נְאֻם יְהוָ֔ה וַ/עֲשֵׂ֕ה כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/021.yaml
  text: Go up against the land of Merathaim[a], against it, and against the inhabitants of Pekod. Put them to the sword and devote them to destruction after them, declares Yahweh[c][b], and do all that I have commanded you.
translation:
  language: fr
  text: Monte contre le pays de Merataïm[a], contre lui, et contre les habitants de Peqod[b]. Passe-les au fil de l’épée et voue-les à la destruction[c] sur leurs traces[d] — déclaration de Yahweh —, et fais tout ce que je t’ai ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Merataïm est probablement un nom symbolique de Babylone. En hébreu, il peut évoquer une « double rébellion » ou peut-être une « double amertume ».
    reason: lexical_alternative
  - marker: b
    text: Peqod est un nom de lieu ou de peuple ; il peut aussi faire écho à une racine hébraïque évoquant l’intervention, la visite ou le châtiment.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « mets-les à l’interdit ». Le verbe hébreu désigne le fait de vouer quelque chose à la destruction.'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « derrière eux » ou « après eux ». Le sens précis de cette expression est incertain.'
    reason: textual_or_syntactical_ambiguity
lexical_decisions:
- source_word: מְרָתַיִם
  choice: Merataïm
  rationale: Le terme fonctionne comme un nom propre désignant symboliquement Babylone. La translittération française conserve ce statut sans trancher le jeu de mots probable.
- source_word: עֲלֵה
  choice: Monte contre
  rationale: Dans un contexte militaire, עלה signifie avancer ou monter contre un adversaire. « Monte contre » garde l’image hébraïque tout en restant compréhensible.
- source_word: יוֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe de ישב désigne collectivement ceux qui résident dans un lieu ; cette formulation est concise et naturelle en français.
- source_word: פְּקוֹד
  choice: Peqod
  rationale: Le mot est traité comme un nom de lieu ou de peuple, tout en laissant en note son écho possible avec la racine פקד.
- source_word: חֲרֹב
  choice: Passe-les au fil de l’épée
  rationale: Dans cet oracle militaire, l’impératif elliptique exprime une mise à mort violente. La formule française rend explicitement cette force contextuelle.
- source_word: וְהַחֲרֵם
  choice: voue-les à la destruction
  rationale: Le hifil de חרם évoque la mise à l’interdit, avec destruction. Cette traduction conserve la dimension technique sans réduire le verbe à un simple « détruis ».
- source_word: אַחֲרֵיהֶם
  choice: sur leurs traces
  rationale: L’expression signifie littéralement « derrière eux » ou « après eux ». « Sur leurs traces » préserve l’idée spatiale ou poursuivante sans imposer une interprétation définitive.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule prophétique solennelle présente les paroles comme un oracle divin et conserve le nom personnel יְהוָה sous la forme « Yahweh ».
- source_word: וַעֲשֵׂה כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: et fais tout ce que je t’ai ordonné
  rationale: La formulation naturelle en français maintient l’idée d’une obéissance complète exprimée par כְכֹל.
theological_decisions:
- issue: Faut-il atténuer le vocabulaire du jugement militaire ?
  choice: Conserver la pleine force de la mise à mort et de la consécration à la destruction.
  alternative: Employer des termes généraux comme « vaincs-les » ou « défais-les ».
  rationale: Les impératifs hébreux sont violents et comprennent le vocabulaire technique de l’interdit. Les adoucir masquerait la gravité du jugement sans que le verset lui-même l’autorise.
- issue: Comment rendre les noms symboliques מְרָתַיִם et פְּקוֹד ?
  choice: Translittérer « Merataïm » et « Peqod » dans le texte, puis expliquer leurs résonances en notes.
  alternative: Les traduire directement par « Double Rébellion », « Double Amertume » ou « Châtiment ».
  rationale: Ils occupent syntaxiquement la place de noms propres, mais peuvent simultanément porter un jeu de mots. La translittération accompagnée de notes préserve cette tension.
- issue: Comment comprendre אַחֲרֵיהֶם ?
  choice: Garder une formulation ouverte, « sur leurs traces », avec une note sur le sens littéral.
  alternative: Interpréter explicitement comme « jusqu’au dernier » ou supprimer l’expression pour lisser la phrase.
  rationale: La syntaxe hébraïque est difficile et peut évoquer la poursuite, la continuation de l’action derrière les fuyards ou son achèvement. Une traduction prudente évite de trancher ce que le texte laisse obscur.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme impératif et la violence de l’oracle sont conservés. Les noms propres sont adaptés à la graphie française, et les ambiguïtés lexicales ou syntaxiques sont signalées sans être résolues artificiellement.
