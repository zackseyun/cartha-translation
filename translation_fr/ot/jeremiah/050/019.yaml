  text: וְ/שֹׁבַבְתִּ֤י אֶת יִשְׂרָאֵל֙ אֶל נָוֵ֔/הוּ וְ/רָעָ֥ה הַ/כַּרְמֶ֖ל וְ/הַ/בָּשָׁ֑ן וּ/בְ/הַ֥ר אֶפְרַ֛יִם וְ/הַ/גִּלְעָ֖ד תִּשְׂבַּ֥ע נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/019.yaml
  text: And I will bring Israel back to his pasture[a], and he will graze on Carmel and Bashan; and on the hill country of Ephraim and Gilead his appetite will be satisfied.
translation:
  language: fr
  text: Je ramènerai Israël dans son pâturage ; il paîtra sur le Carmel et le Bashân, et il se rassasiera dans la région montagneuse d’Éphraïm et en Galaad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son âme sera rassasiée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּי
  choice: Je ramènerai
  rationale: Le verbe exprime ici le retour causé ou la restauration. « Ramener » conserve le mouvement concret vers le pâturage et la portée restauratrice du contexte.
- source_word: נָוֵהוּ
  choice: dans son pâturage
  rationale: נָוֶה peut désigner une demeure, un enclos ou un lieu de pâture. Le verbe « paître » dans la proposition suivante favorise le sens pastoral.
- source_word: וְרָעָה
  choice: il paîtra
  rationale: 'Le verbe est employé dans son sens pastoral : Israël, présenté collectivement comme un troupeau, se nourrira dans ces régions fertiles.'
- source_word: הַכַּרְמֶל
  choice: le Carmel
  rationale: Nom géographique rendu selon sa forme française habituelle ; l’article hébreu est naturellement conservé en français.
- source_word: הַבָּשָׁן
  choice: le Bashân
  rationale: Nom régional rendu selon la translittération française traditionnelle, avec l’article attendu en français.
- source_word: וּבְהַר אֶפְרַיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: הַר désigne ici non une montagne isolée, mais la région montagneuse associée à Éphraïm.
- source_word: וְהַגִּלְעָד
  choice: en Galaad
  rationale: Nom régional rendu sous sa forme française établie ; « en » convient naturellement à une région.
- source_word: תִּשְׂבַּע נַפְשׁוֹ
  choice: il se rassasiera
  rationale: L’expression signifie littéralement que sa נֶפֶשׁ sera rassasiée. Dans le contexte alimentaire et pastoral, la tournure pronominale française communique naturellement le rassasiement de l’être vivant sans imposer à « âme » un sens anthropologique plus étroit.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne collectivement le peuple, personnifié au singulier dans le texte hébreu.
theological_decisions:
- issue: Personnification d’Israël et nombre grammatical
  choice: Conserver le singulier avec « son » et « il »
  alternative: Employer le pluriel pour représenter explicitement les membres du peuple
  rationale: L’hébreu présente Israël comme une entité collective singulière. Le singulier français préserve cette personnification et l’image pastorale.
- issue: Sens de נֶפֶשׁ dans l’expression de rassasiement
  choice: Traduire idiomatiquement par « il se rassasiera »
  alternative: « son âme sera rassasiée »
  rationale: Dans ce contexte de pâturage et de nourriture, נֶפֶשׁ évoque l’être vivant, le désir ou l’appétit. La traduction principale évite de réduire le mot à une âme immatérielle, tandis que la note rend visible la formulation littérale.
translation_notes:
  register: 'Français moderne, naturel et digne. La métaphore pastorale est maintenue par « pâturage » et « paîtra ». Les formes françaises usuelles des toponymes bibliques sont employées : Carmel, Bashân, Éphraïm et Galaad.'
