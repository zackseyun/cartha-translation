  text: בֹּֽאוּ לָ֤/הּ מִ/קֵּץ֙ פִּתְח֣וּ מַאֲבֻסֶ֔י/הָ סָלּ֥וּ/הָ כְמוֹ עֲרֵמִ֖ים וְ/הַחֲרִימ֑וּ/הָ אַל תְּהִי לָ֖/הּ שְׁאֵרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/026.yaml
  text: Come against her from the farthest border[a]; open her storehouses; pile her up like heaps, and devote her to destruction[c][b]; let no remnant remain to her.
translation:
  language: fr
  text: Venez contre elle depuis les confins[a] ; ouvrez ses entrepôts[b] ; amoncelez-la comme des monceaux et vouez-la à la destruction[c] ; qu’il ne subsiste pour elle aucun reste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’extrémité ». L’expression hébraïque peut désigner les régions les plus éloignées du territoire.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses greniers », « ses granges », voire « ses mangeoires ». Le terme hébreu désigne littéralement des lieux où l’on nourrit les animaux et peut, ici, s’appliquer à des lieux où sont gardées des provisions.
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque signifie « la mettre sous l’interdit », c’est-à-dire la vouer à une destruction totale.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ לָהּ
  choice: Venez contre elle
  rationale: L’impératif de בוא appelle ici les forces assaillantes à se mettre en marche, et לָהּ prend en contexte une valeur hostile. « Venez contre elle » exprime naturellement cette convocation militaire.
- source_word: מִקֵּץ
  choice: depuis les confins
  rationale: קֵץ désigne l’extrémité ou la limite. « Les confins » convient à l’idée des régions les plus éloignées sans préciser explicitement un territoire absent du texte hébreu.
- source_word: מַאֲבֻסֶיהָ
  choice: ses entrepôts
  rationale: Le terme peut désigner des mangeoires ou des lieux où sont gardées des provisions. Dans le contexte du pillage de Babylone, « entrepôts » rend clairement le sens métonymique probable.
- source_word: סָלּוּהָ כְמוֹ עֲרֵמִים
  choice: amoncelez-la en tas
  rationale: סלל exprime l’action d’entasser, tandis que עֲרֵמִים désigne des tas ou des monceaux, souvent de produits agricoles. Cette formulation française conserve l’image vive et le suffixe féminin visant Babylone, tout en évitant une comparaison peu idiomatique.
- source_word: וְהַחֲרִימוּהָ
  choice: et vouez-la à la destruction
  rationale: Le hiphil de חרם ne signifie pas seulement détruire, mais placer sous l’interdit en vue d’une destruction totale. La formulation retenue préserve cette portée technique et judiciaire.
- source_word: אַל תְּהִי לָהּ שְׁאֵרִית
  choice: qu’il ne lui reste aucun survivant
  rationale: שְׁאֵרִית peut désigner ce qui reste ou le groupe des survivants. Dans cet ordre adressé aux assaillants, « aucun survivant » communique clairement la totalité du jugement tout en maintenant le sens humain possible du nom.
theological_decisions:
- issue: Portée de החרים dans cet oracle de jugement
  choice: vouez-la à la destruction
  alternative: détruisez-la entièrement / mettez-la sous l’interdit
  rationale: Le verbe porte des connotations judiciaires et sacrales que le simple verbe « détruire » atténuerait. « Vouer à la destruction » conserve cette tension sans introduire une interprétation confessionnelle.
- issue: Sens de שְׁאֵרִית à la fin du verset
  choice: aucun survivant
  alternative: aucun reste / aucun vestige
  rationale: Le mot peut viser un reste au sens général ou un groupe survivant. Le contexte militaire favorise le sens personnel, mais l’ambiguïté lexicale est signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais direct. Les impératifs gardent le rythme pressant de l’oracle. « Confins », « amoncelez » et « vouez » maintiennent sa dignité et ses images fortes sans archaïsme excessif. La note [d] documente une ambiguïté réelle, mais aucun marqueur [d] n’est requis dans le texte principal puisque la formulation principale porte déjà le sens retenu.
