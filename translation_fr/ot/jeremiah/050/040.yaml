source:
  edition: WLC
  text: כְּ/מַהְפֵּכַ֨ת אֱלֹהִ֜ים אֶת סְדֹ֧ם וְ/אֶת עֲמֹרָ֛ה וְ/אֶת שְׁכֵנֶ֖י/הָ נְאֻם יְהוָ֑ה לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/040.yaml
  text: As when God overthrew Sodom and Gomorrah and their neighboring towns[a], declares Yahweh, no man will live there[b], and no son of man will dwell in her.
translation:
  language: fr
  text: Comme lorsque Dieu a bouleversé Sodome et Gomorrhe et les villes voisines[a], déclare Yahweh, aucun homme n’habitera là et aucun fils d’homme[b] ne séjournera en elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses voisines »; il s’agit des villes ou localités voisines de Sodome et Gomorrhe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « être humain ». L’expression hébraïque signifie littéralement « fils d’homme » et désigne ici un humain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: Comme lorsque Dieu a bouleversé
  rationale: La préposition כְּ introduit une comparaison, et מַהְפֵּכָה désigne un bouleversement destructeur. Cette formulation française exprime naturellement l’action de Dieu sans affaiblir l’image du renversement.
- source_word: סְדֹם וְעֲמֹרָה
  choice: Sodome et Gomorrhe
  rationale: Formes françaises traditionnelles et immédiatement reconnaissables des deux noms de lieux.
- source_word: שְׁכֵנֶיהָ
  choice: les villes voisines
  rationale: Le mot signifie littéralement « ses voisines ». Dans ce contexte géographique, il désigne les localités associées à Sodome et Gomorrhe; « villes voisines » rend clairement ce sens, tandis qu’une note conserve la forme littérale.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: נְאֻם introduit une déclaration prophétique solennelle, et le nom divin יהוה est transcrit « Yahweh ».
- source_word: יֵשֵׁב
  choice: habitera
  rationale: Dans cette formule de désolation, ישׁב signifie habiter ou résider durablement, plutôt que simplement s’asseoir.
- source_word: אִישׁ
  choice: aucun homme
  rationale: Le nom masculin singulier est employé de manière représentative. « Aucun homme » en conserve la forme tout en étant naturel dans cette formule française.
- source_word: יָגוּר
  choice: ne séjournera
  rationale: גור peut exprimer le fait de séjourner ou de résider comme étranger. « Séjournera » préserve cette nuance et évite de confondre entièrement les deux verbes parallèles.
- source_word: בֶּן אָדָם
  choice: fils d’Adam
  rationale: La traduction formelle préserve l’expression hébraïque et son parallélisme avec אִישׁ. Une note en explicite le sens générique.
- source_word: בָּהּ
  choice: en elle
  rationale: Le pronom féminin singulier renvoie à Babylone, envisagée comme une entité féminine dans le contexte. La formulation conserve ce genre grammatical et le contraste avec « là ».
theological_decisions:
- issue: Transcription du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel de Dieu plutôt que de le remplacer par un titre.
- issue: Portée de בֶּן אָדָם
  choice: fils d’Adam
  alternative: être humain
  rationale: Ici, l’expression n’est pas un titre messianique, mais un désignant poétique de l’être humain. La traduction conserve néanmoins sa forme source, et la note prévient une lecture trop spécialisée.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme prophétique et le parallélisme sont conservés. « Séjournera » distingue le second verbe du premier, tandis que « en elle » maintient la personnification grammaticale de Babylone.
