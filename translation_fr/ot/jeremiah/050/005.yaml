  text: צִיּ֣וֹן יִשְׁאָ֔לוּ דֶּ֖רֶךְ הֵ֣נָּה פְנֵי/הֶ֑ם בֹּ֚אוּ וְ/נִלְו֣וּ אֶל יְהוָ֔ה בְּרִ֥ית עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/005.yaml
  text: 'They will ask the way to Zion[a], with their faces turned toward it: ‘Come[b], let us join ourselves to Yahweh in an everlasting covenant that will not be forgotten.’'
translation:
  language: fr
  text: Ils demanderont le chemin qui mène à Sion, le visage tourné vers elle. « Venez, attachons-nous à Yahweh par une alliance éternelle qui ne sera pas oubliée.[a] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Venez, soyons unis à Yahweh par une alliance éternelle qui ne sera pas oubliée. » Le verbe hébreu peut exprimer le fait de s’attacher soi-même ou d’être uni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: יִשְׁאָלוּ דֶּרֶךְ
  choice: Ils demanderont le chemin
  rationale: Le qal imparfait de שאל décrit, dans ce contexte prophétique, l’action future de demander ou rechercher la route.
- source_word: הֵנָּה פְנֵיהֶם
  choice: le visage tourné dans cette direction
  rationale: La formulation conserve l’image concrète des visages orientés vers Sion et rend naturellement l’adverbe directionnel הֵנָּה.
- source_word: בֹּאוּ
  choice: Venez
  rationale: Impératif masculin pluriel introduisant une exhortation collective.
- source_word: וְנִלְווּ
  choice: attachons-nous
  rationale: Le niphal de לוה peut exprimer le fait de se joindre ou d’être joint. Ici, après l’impératif « Venez », la valeur exhortative « attachons-nous » est naturelle et conserve la nuance d’engagement volontaire.
- source_word: אֶל יְהוָה
  choice: à Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre de l’alliance présent dans le texte hébreu.
- source_word: בְּרִית עוֹלָם
  choice: par une alliance éternelle
  rationale: « Alliance » rend ברית, et עולם souligne ici sa durée permanente. « Par » exprime naturellement le moyen ou le lien selon lequel le peuple s’attache à Yahweh.
- source_word: לֹא תִשָּׁכֵחַ
  choice: qui ne sera pas oubliée
  rationale: Le niphal imparfait féminin singulier s’accorde avec « alliance » et reçoit directement son sens passif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme comme nom propre; « Yahweh » le distingue d’un simple titre tout en restant intelligible en français.
- issue: Voix et nuance de וְנִלְווּ
  choice: attachons-nous
  alternative: soyons unis
  rationale: La forme niphal permet une nuance réfléchie ou passive. Le contexte exhortatif favorise la première sans exclure la seconde, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’image hébraïque tout en évitant les tournures vieillies. Le discours direct est ponctué comme une exhortation collective.
