base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/018.yaml
  text: 'Therefore thus says Yahweh of hosts[a], the God of Israel: Behold, I am about to punish the king of Babylon and his land, just as I punished the king of Assyria.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh des armées, le Dieu d’Israël : Voici, je vais punir le roi de Babylone et son pays, comme j’ai puni le roi d’Assyrie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Voici, je vais demander des comptes au roi de Babylone et à son pays, comme j’ai demandé des comptes au roi d’Assyrie. » Le verbe hébreu peut signifier « visiter », « intervenir à l’égard de » ou « demander des comptes » ; dans ce contexte de jugement, il a un sens punitif.'
    reason: alternative lexicale
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conclusion tirée du contexte précédent.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Formule prophétique solennelle, rendue dans un français actuel et idiomatique.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par un terme français clair, capable d’évoquer les armées célestes aussi bien que terrestres.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe du groupe construit hébreu.
- source_word: הִנְנִי פֹקֵד
  choice: Je vais demander des comptes
  rationale: « Je vais » marque l’action imminente; « demander des comptes » communique la portée judiciaire de פקד tout en préservant davantage sa nuance de visitation responsable que le seul verbe « punir ».
- source_word: אֶל מֶלֶךְ בָּבֶל וְאֶל אַרְצוֹ
  choice: au roi de Babylone et à son pays
  rationale: Avec « demander des comptes », la préposition française « à » est idiomatique; « pays » désigne ici le territoire soumis au roi.
- source_word: כַּאֲשֶׁר פָּקַדְתִּי
  choice: comme j’ai demandé des comptes
  rationale: Préserve le parallèle lexical avec la première occurrence de פקד et la comparaison avec le jugement de l’Assyrie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin; sa translittération le distingue d’un simple titre.
- issue: Sens de פקד dans cet oracle de jugement
  choice: demander des comptes
  alternative: punir
  rationale: Le contexte impose une portée punitive, mais l’expression retenue conserve la nuance plus large de visitation et de mise en cause portée par le verbe hébreu, sans affaiblir le jugement annoncé.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » reste proche du lexème hébreu et évite de résoudre trop précisément la nature des armées évoquées par le titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est naturelle sans être familière; le parallélisme verbal de l’hébreu est conservé.
