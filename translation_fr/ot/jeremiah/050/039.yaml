id: JER.50.39
reference: Jeremiah 50:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן יֵשְׁב֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/יָ֥שְׁבוּ בָ֖/הּ בְּנ֣וֹת יַֽעֲנָ֑ה וְ/לֹֽא תֵשֵׁ֥ב עוֹד֙ לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכּ֖וֹן עַד דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/039.yaml
  text: Therefore desert creatures will dwell there with hyenas[a], and ostriches will dwell in her; she will never again be inhabited forever[c][b], nor will she be lived in from generation to generation.
translation:
  language: fr
  text: C’est pourquoi les créatures du désert y habiteront avec les hyènes[a], et les autruches[b] habiteront en elle. Elle ne sera plus jamais habitée[c], et personne n’y résidera, de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chacals » ou « les bêtes qui hurlent » ; l’identification exacte de ces animaux du désert en hébreu est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les filles de l’autruche », c’est-à-dire des autruches. Certaines traductions anciennes ont « les hiboux ».
    reason: lexical_alternative
  - marker: c
    text: 'En hébreu, la ville de Babylone est personnifiée au féminin : « en elle », « elle ne sera plus jamais habitée ».'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du jugement prononcé contre Babylone.
- source_word: צִיִּים
  choice: les créatures du désert
  rationale: Rendu générique adapté aux êtres associés aux lieux désertiques et aux ruines, puisque leur identification zoologique exacte demeure incertaine.
- source_word: אֶת אִיִּים
  choice: avec les hyènes
  rationale: אֶת a ici une valeur associative. « Hyènes » est une identification plausible de אִיִּים, mais l’incertitude est signalée en note.
- source_word: בְּנוֹת יַעֲנָה
  choice: les autruches
  rationale: L’expression signifie littéralement « filles de l’autruche » et désigne vraisemblablement des autruches.
- source_word: בָהּ
  choice: en elle
  rationale: Conserve le pronom féminin qui renvoie à Babylone, ville personnifiée.
- source_word: לֹא תֵשֵׁב עוֹד לָנֶצַח
  choice: Elle ne sera plus jamais habitée
  rationale: Exprime en français idiomatique la permanence emphatique produite par la combinaison de « plus » et « pour toujours » en hébreu.
- source_word: וְלֹא תִשְׁכּוֹן עַד דּוֹר וָדוֹר
  choice: et personne n’y résidera, de génération en génération
  rationale: Rend le parallélisme sur l’absence durable d’habitants tout en évitant une répétition passive peu naturelle en français.
theological_decisions: []
