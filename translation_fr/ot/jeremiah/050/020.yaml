  source_fidelity: 'Le sens essentiel est fidèlement rendu : l’iniquité/le péché d’Israël et de Juda ne pourra être trouvé, parce que le SEIGNEUR pardonne à ceux qu’il laisse subsister. La formulation révisée conserve le singulier de עָוֹן, le pluriel de חַטֹּאת et l’ellipse parallèle du texte, rendue de façon explicite et naturelle en français.'
  naturalness: « Comme reste » est peu idiomatique en français moderne dans cette construction. « Ceux que je laisserai subsister » exprime naturellement l’action divine indiquée par אַשְׁאִיר. La formule prophétique « déclare le SEIGNEUR » et la reprise explicite de « on recherchera » améliorent la lisibilité sans ajouter de sens.
  terminology: « Faute », « péchés », « pardonnerai » et « SEIGNEUR » sont des choix recevables. « Laisser subsister » rend le mieux ici l’idée de personnes épargnées/laissées en vie, sans imposer une terminologie confessionnelle telle que « reste » ou « rémanent ».
  issues:
