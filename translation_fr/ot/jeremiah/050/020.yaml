base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/020.yaml
  text: In those days and at that time, declares the LORD, the guilt of Israel will be sought, but there will be none, and the sins of Judah, but they will not be found; for I will forgive those whom I leave as a remnant.
translation:
  language: fr
  text: En ces jours-là et en ce temps-là, déclare le SEIGNEUR, on recherchera la faute d’Israël, mais il n’y en aura pas ; on recherchera les péchés de Juda, mais on ne les trouvera pas, car je pardonnerai à ceux que je laisserai subsister.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲוֹן
  choice: faute
  rationale: Le terme peut désigner la faute, l’iniquité ou la culpabilité qui en découle. « Faute » conserve ici une portée morale sans surinterpréter l’aspect de culpabilité ou de châtiment.
- source_word: חַטֹּאת
  choice: péchés
  rationale: Le pluriel hébreu désigne naturellement les péchés de Juda.
- source_word: נְאֻם יְהוָה
  choice: déclaration du SEIGNEUR
  rationale: Formule prophétique solennelle qui présente les paroles comme l’oracle de YHWH; « SEIGNEUR » suit la convention française courante pour le tétragramme.
- source_word: אֶסְלַח
  choice: je pardonnerai
  rationale: Rend directement le verbe hébreu de pardon.
- source_word: לַאֲשֶׁר אַשְׁאִיר
  choice: à ceux que je laisserai comme reste
  rationale: Le relatif peut désigner ceux que Dieu laissera subsister; « comme reste » explicite la valeur contextuelle de שׁאר sans imposer un vocabulaire confessionnel.
theological_decisions:
- issue: Disparition de la faute et des péchés
  choice: « il n’y en aura plus » et « on ne les trouvera pas », reliés au pardon divin
  alternative: Comprendre qu’Israël et Juda seront devenus intrinsèquement sans péché
  rationale: Le verset explique leur introuvabilité par « car je pardonnerai »; la traduction préserve le lien entre absence judiciaire de faute et pardon sans développer une théorie doctrinale.
- issue: Identité des bénéficiaires du pardon
  choice: « ceux que je laisserai comme reste »
  alternative: « mon reste » ou « les survivants »
  rationale: L’hébreu met l’accent sur l’action divine de laisser subsister certains, sans employer explicitement un possessif ni un nom signifiant simplement survivants.
translation_notes:
  register: Français moderne, digne et lisible. La reprise « mais » conserve le parallélisme hébreu. « En ces jours-là, en ce temps-là » maintient la double formule temporelle, et les tirets isolent naturellement la formule prophétique.
