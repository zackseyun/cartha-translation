source:
  edition: WLC
  text: יָקֹ֨שְׁתִּי לָ֤/ךְ וְ/גַם נִלְכַּדְתְּ֙ בָּבֶ֔ל וְ/אַ֖תְּ לֹ֣א יָדָ֑עַתְּ נִמְצֵאת֙ וְ/גַם נִתְפַּ֔שְׂתְּ כִּ֥י בַֽ/יהוָ֖ה הִתְגָּרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/024.yaml
  text: I set a trap for you[a], and you also were caught, Babylon, and you did not know it; you were found and also seized[c][b], because you contended against Yahweh.
translation:
  language: fr
  text: Je t’ai tendu un piège[a], et tu as aussi été prise, Babylone, et tu ne le savais pas ; tu as été trouvée et aussi saisie[b], parce que tu as défié Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je t’ai tendu un collet ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Tu as été trouvée et aussi capturée » ; les deux verbes successifs renforcent l’image de la chute de Babylone.
    reason: lexical_alternative
  - marker: c
    text: Ou « parce que tu t’es dressée contre Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֹשְׁתִּי לָךְ
  choice: Je t’ai tendu un piège
  rationale: Le verbe יקשׁ évoque la pose d’un piège ou d’un collet. Cette formulation française conserve l’image concrète et identifie clairement Babylone comme la cible.
- source_word: וְגַם נִלְכַּדְתְּ
  choice: et tu as bel et bien été prise
  rationale: Le niphal de לכד exprime le fait d’être prise ou capturée; «bel et bien» restitue ici la valeur emphatique de גַם tout en prolongeant naturellement l’image du piège.
- source_word: וְאַתְּ לֹא יָדָעַתְּ
  choice: sans t’en rendre compte
  rationale: L’hébreu dit littéralement «et toi, tu ne savais pas». La tournure française exprime naturellement l’absence de conscience du piège et de la capture sans préciser davantage leur objet implicite.
- source_word: נִמְצֵאת
  choice: Tu as été découverte
  rationale: Le niphal de מצא peut signifier «être trouvée» ou «être découverte». Dans ce contexte de traque et de capture, «découverte» est naturel tout en restant proche du sens.
- source_word: וְגַם נִתְפַּשְׂתְּ
  choice: et également saisie
  rationale: Le niphal de תפשׂ désigne le fait d’être saisie ou appréhendée. «Également» maintient la valeur additive de גַם, et «saisie» évite de confondre ce verbe avec le précédent.
- source_word: כִּי בַיהוָה הִתְגָּרִית
  choice: parce que tu as défié Yahweh
  rationale: כִּי introduit ici la cause. Le hitpael de גרה avec ב exprime une confrontation délibérée, rendue avec concision par «défier». Le nom divin יהוה est translittéré «Yahweh».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. «Yahweh» conserve le nom propre et évite de le remplacer silencieusement par un titre.
- issue: Nature de l’opposition de Babylone à Yahweh
  choice: tu as défié Yahweh
  alternative: tu t’es dressée contre Yahweh
  rationale: Le verbe הִתְגָּרִית décrit une attitude de confrontation ou de provocation. «Défié» garde cette force sans préciser indûment la forme politique, militaire ou spirituelle de l’opposition.
translation_notes:
  register: Français international moderne, direct et digne. Le féminin singulier est maintenu parce que Babylone est personnifiée et directement interpellée. Les deux occurrences de גַם sont rendues distinctement («bel et bien», «également») afin de préserver leur force sans alourdir la phrase.
