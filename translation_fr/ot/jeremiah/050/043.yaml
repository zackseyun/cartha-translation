  text: שָׁמַ֧ע מֶֽלֶךְ בָּבֶ֛ל אֶת שִׁמְעָ֖/ם וְ/רָפ֣וּ יָדָ֑י/ו צָרָה֙ הֶחֱזִיקַ֔תְ/הוּ חִ֖יל כַּ/יּוֹלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/043.yaml
  text: The king of Babylon has heard the report about them[a], and his hands have gone limp; distress has seized him, anguish like a woman in labor.
translation:
  language: fr
  text: Le roi de Babylone a appris la nouvelle à leur sujet[a] ; ses mains ont perdu leur force. La détresse l’a saisi, une angoisse comme celle d’une femme en travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur nouvelle » ou « leur rapport ». Littéralement, l’hébreu porte « leur nouvelle/rapport » ; dans le contexte, il s’agit de la nouvelle concernant les forces ennemies qui approchent.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: a appris
  rationale: Le qal accompli exprime ici la réception d’une nouvelle dont les effets immédiats sont ensuite décrits. « A appris » est naturel en français et convient mieux qu’un simple « a entendu » pour une information rapportée.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: La chaîne construite désigne directement le souverain de Babylone ; l’article défini est requis par l’usage français.
- source_word: שִׁמְעָם
  choice: ce qu’on raconte à leur sujet
  rationale: 'Le nom שֵׁמַע peut désigner une nouvelle ou un récit entendu, et le suffixe pluriel peut être compris comme objectif : ce qui est rapporté au sujet des forces mentionnées dans le contexte. Cette formulation française garde la nuance de « ce qui se dit ».'
- source_word: וְרָפוּ יָדָיו
  choice: ses mains ont perdu toute force
  rationale: L’expression concrète décrit l’effondrement de la force ou du courage. La traduction conserve l’image des mains sans employer le peu naturel « ses mains se sont relâchées ».
- source_word: צָרָה
  choice: la détresse
  rationale: Le nom évoque une situation oppressante et l’angoisse qu’elle provoque ; « détresse » convient au parallélisme avec la douleur qui suit.
- source_word: הֶחֱזִיקַתְהוּ
  choice: l’a saisi
  rationale: Le hiphil de חזק signifie ici prendre fortement possession de quelqu’un, le saisir ou l’étreindre.
- source_word: חִיל
  choice: une douleur
  rationale: Dans ce contexte, חִיל évoque la douleur convulsive, notamment celle de l’enfantement. « Douleur » permet au complément comparatif d’en préciser la nature sans imposer le seul sens émotionnel d’« angoisse ».
- source_word: כַּיּוֹלֵדָה
  choice: semblable à celle d’une femme qui accouche
  rationale: Le participe féminin désigne une femme en train d’enfanter. La tournure est naturelle, actuelle et conserve explicitement la comparaison.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le rythme en deux phrases met en relief la réaction du roi, tout en conservant les images corporelles des mains sans force et des douleurs de l’accouchement.
