  text: וְ/הָיְתָ֥ה כַשְׂדִּ֖ים לְ/שָׁלָ֑ל כָּל שֹׁלְלֶ֥י/הָ יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/010.yaml
  text: And Chaldea will become plunder[a]; all who plunder her will have their fill[b], declares Yahweh.
translation:
  language: fr
  text: La Chaldée deviendra un butin[a] ; tous ceux qui la pilleront seront rassasiés[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Chaldéens ». La forme hébraïque est plurielle, mais elle semble désigner ici le pays ou la puissance de la Chaldée, comme le suggère le suffixe féminin singulier dans « ceux qui la pillent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « seront satisfaits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: deviendra
  rationale: Dans ce discours prophétique, le parfait avec conjonction exprime naturellement un résultat futur ; « deviendra » souligne le changement d’état.
- source_word: כַשְׂדִּים
  choice: la Chaldée
  rationale: Bien que la forme hébraïque soit plurielle, le suffixe féminin singulier de « la pilleront » indique ici le pays ou la puissance chaldéenne.
- source_word: לְשָׁלָל
  choice: un butin
  rationale: « Butin » est un terme français actuel et naturel dans ce contexte de conquête et de pillage.
- source_word: שֹׁלְלֶיהָ
  choice: tous ceux qui la pilleront
  rationale: La proposition relative rend naturellement le participe hébreu tout en conservant son sens actif et le référent féminin.
- source_word: יִשְׂבָּעוּ
  choice: seront rassasiés
  rationale: Le verbe signifie être rassasié ou comblé ; cette traduction préserve l’image d’abondance sans préciser au-delà du texte de quoi les pillards seront rassasiés.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique est rendue dans un français direct et digne, tandis que le nom divin est translittéré.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme ; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Référent de כַשְׂדִּים
  choice: la Chaldée, comprise comme le pays ou la puissance politique
  alternative: les Chaldéens, compris comme le peuple
  rationale: La morphologie permet « les Chaldéens », mais le suffixe féminin singulier suivant favorise une désignation territoriale ou politique. L’alternative est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La tournure conserve le parallélisme bref de l’hébreu et maintient l’ambiguïté lexicale au moyen des notes.
