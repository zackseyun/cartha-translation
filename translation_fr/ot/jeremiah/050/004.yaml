  text: בַּ/יָּמִ֨ים הָ/הֵ֜מָּה וּ/בָ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל הֵ֥מָּה וּ/בְנֵֽי יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּ/בָכוֹ֙ יֵלֵ֔כוּ וְ/אֶת יְהוָ֥ה אֱלֹהֵי/הֶ֖ם יְבַקֵּֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/004.yaml
  text: In those days and at that time[a], declares Yahweh, the children of Israel will come, they and the children of Judah together. Going and weeping, they will go[b], and they will seek Yahweh their God.
translation:
  language: fr
  text: « En ces jours-là et en ce temps-là, déclare Yahvé, les descendants d’Israël[a] viendront, eux et les descendants de Juda, tous ensemble. Ils iront en pleurant[b] et chercheront Yahvé, leur Dieu. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « les fils d’Israël » et, plus loin, « les fils de Juda » ; ces expressions désignent collectivement leurs descendants ou leurs peuples.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète l’idée d’aller : littéralement, « en allant et en pleurant, ils iront », ce qui exprime une marche continue accompagnée de pleurs.'
    reason: source_form
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה וּבָעֵת הַהִיא
  choice: En ces jours-là et à ce moment-là
  rationale: Conserve les deux indications temporelles coordonnées de la formule prophétique hébraïque, sans les fondre en une seule.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: Rend naturellement en français moderne la formule solennelle qui authentifie la parole prophétique.
- source_word: בְנֵי יִשְׂרָאֵל ... וּבְנֵי יְהוּדָה
  choice: les descendants d’Israël ... les descendants de Juda
  rationale: « Descendants » communique la valeur collective et familiale de בְנֵי dans un français actuel; une note conserve l’expression hébraïque littérale.
- source_word: הֵמָּה ... יַחְדָּו
  choice: eux ... tous ensemble
  rationale: « Eux » maintient la reprise emphatique du pronom hébreu, tandis que « tous ensemble » souligne la réunion des deux groupes.
- source_word: הָלוֹךְ וּבָכוֹ יֵלֵכוּ
  choice: Ils avanceront en pleurant
  rationale: Formulation française naturelle qui exprime un déplacement continu accompagné de pleurs; la répétition du verbe de mouvement dans l’hébreu est signalée en note.
- source_word: וְאֶת יְהוָה אֱלֹהֵיהֶם יְבַקֵּשׁוּ
  choice: et chercheront Yahvé, leur Dieu
  rationale: « Chercher » préserve la portée ouverte de בקשׁ, qui peut évoquer aussi bien la quête que le retour religieux vers Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le nom divin; « Yahvé » le rend comme nom propre plutôt que de lui substituer un titre.
- issue: Restauration conjointe d’Israël et de Juda
  choice: Maintenir les deux groupes distincts réunis « tous ensemble »
  alternative: Généraliser en « tout Israël » ou donner une interprétation ecclésiologique
  rationale: Le verset nomme séparément Israël et Juda tout en annonçant leur réunion; la traduction conserve cette tension historique et théologique.
- issue: Sens de la recherche de Yahvé
  choice: chercheront Yahvé
  alternative: reviendront à Yahvé; adoreront Yahvé
  rationale: Le verbe hébreu signifie « chercher » et peut avoir une portée relationnelle ou cultuelle; la formulation choisie n’impose pas une interprétation plus précise que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique reste solennelle sans devenir archaïque. Les répétitions hébraïques significatives sont soit conservées, soit explicitées en note lorsqu’une reproduction littérale serait peu naturelle.
