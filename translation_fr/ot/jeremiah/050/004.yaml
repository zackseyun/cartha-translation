  rationale: La révision remplace « à ce moment-là » par « en ce temps-là » et « ils avanceront » par « ils iront ». Elle maintient ainsi la formule temporelle prophétique et le verbe de mouvement du texte hébreu, tout en conservant un français moderne et la note qui signale l’infinitif absolu et la répétition verbale.
