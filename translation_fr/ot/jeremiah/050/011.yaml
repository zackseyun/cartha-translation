id: JER.50.11
reference: Jeremiah 50:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י תשמחי כִּ֣י תעלזי שֹׁסֵ֖י נַחֲלָתִ֑/י כִּ֤י תפושי כְּ/עֶגְלָ֣ה דָשָׁ֔ה ו/תצהלי כָּ/אֲבִּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/011.yaml
  text: Because you rejoice[a], because you exult, plunderers of my inheritance, because you frolic like a threshing heifer and neigh like stallions[b],
translation:
  language: fr
  text: Parce que tu te réjouis[a], parce que tu exultes, toi qui pilles mon héritage[b], parce que tu gambades comme une génisse qui foule le grain et que tu hennisses comme des étalons[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Même si tu te réjouis ». La particule hébraïque peut être comprise ici soit comme causale (« parce que »), soit comme concessive (« même si »).
    reason: lexical_alternative
  - marker: b
    text: « Mon héritage » peut désigner le peuple du SEIGNEUR, son pays, ou les deux.
    reason: referential_ambiguity
  - marker: c
    text: Littéralement « comme des puissants ». Dans le contexte du hennissement, le terme est compris comme désignant des chevaux puissants; « étalons » en est une interprétation contextuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: parce que
  rationale: La répétition introduit ici les motifs du jugement annoncé à Babylone. « Parce que » conserve la valeur causale ordinaire de la particule et sa force rhétorique, tout en signalant en note la lecture concessive possible.
- source_word: תשמחי / תעלזי
  choice: vous vous réjouissez / vous exultez
  rationale: Ces deux verbes parallèles expriment une joie croissante. Les deux formulations françaises restent distinctes et gardent le ton poétique et accusateur.
- source_word: שֹׁסֵי נַחֲלָתִי
  choice: vous qui pillez mon héritage
  rationale: Le participe désigne ceux qui dépouillent ou pillent. « Mon héritage » garde l'idée de ce qui appartient au SEIGNEUR, qu'il s'agisse de son peuple, de son pays, ou des deux.
- source_word: תפושי
  choice: vous gambadez
  rationale: Dans cette image animale, le verbe évoque un mouvement vif, libre et joyeux. « Gambader » rend naturellement la nuance moqueuse.
- source_word: כְּעֶגְלָה דָשָׁה
  choice: comme une génisse qui foule le grain
  rationale: La formulation explicite l'activité de la génisse sur l'aire de battage sans perdre l'image agricole hébraïque.
- source_word: וְתִצְהֲלִי כָּאֲבִּרִים
  choice: et que vous hennissez comme des étalons
  rationale: Le verbe désigne ici le cri du cheval. Le contexte équin permet de comprendre אַבִּירִים comme des chevaux puissants, rendu vivement par « étalons ».
theological_decisions:
- issue: Référent des verbes à la deuxième personne du féminin singulier
  choice: Babylone personnifiée, avec le pronom français « vous »
  alternative: Les habitants de Babylone pris collectivement
  rationale: Les formes féminines singulières s'accordent naturellement avec Babylone personnifiée comme une ville. Le français « vous » préserve l'adresse directe sans ajouter un pronom féminin absent de la construction.
- issue: Valeur de כִּי dans les propositions répétées
  choice: 'Valeur causale : « parce que »'
  alternative: 'Valeur concessive : « bien que / même si »'
  rationale: La valeur causale relie clairement la jubilation des pillards au jugement qui suit et correspond au sens courant de כִּי. La lecture concessive reste grammaticalement et contextuellement possible, donc elle est conservée en note.
translation_notes:
  register: Français international actuel, digne et poétique. La répétition de « parce que » reproduit l'insistance de l'hébreu ; les images animales et agricoles restent concrètes. Le verset se termine par une virgule puisqu'il se prolonge dans l'annonce du jugement au verset suivant.
