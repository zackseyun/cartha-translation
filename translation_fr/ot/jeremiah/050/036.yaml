  text: חֶ֥רֶב אֶל הַ/בַּדִּ֖ים וְ/נֹאָ֑לוּ חֶ֥רֶב אֶל גִּבּוֹרֶ֖י/הָ וָ/חָֽתּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/036.yaml
  text: A sword is against the diviners[a], and they will become fools; a sword is against her warriors[b], and they will be dismayed.
translation:
  language: fr
  text: 'Une épée contre les devins[a] : ils deviendront insensés ! Une épée contre ses guerriers : ils seront terrifiés[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les menteurs ». Le mot hébreu peut désigner plus largement ceux qui profèrent des mensonges ou trompent les autres.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils seront abattus » ou « ils s’effondreront ». Le verbe hébreu peut exprimer aussi bien l’effroi que l’effondrement.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב אֶל
  choice: Une épée contre
  rationale: La formule nominale elliptique annonce avec vigueur un jugement violent dirigé contre les groupes nommés; le français peut conserver cette concision sans ajouter de verbe.
- source_word: הַבַּדִּים
  choice: les devins
  rationale: Le terme peut désigner des menteurs ou des imposteurs, mais, dans ce contexte babylonien et prophétique, il vise probablement ceux qui prononcent des prédictions trompeuses. Une note conserve l'autre sens possible.
- source_word: וְנֹאָלוּ
  choice: ils deviendront insensés
  rationale: Le verbe exprime le fait de devenir insensé ou de se révéler tel; cette formulation préserve sa valeur résultative.
- source_word: גִּבּוֹרֶיהָ
  choice: ses guerriers
  rationale: Dans ce contexte militaire, גִּבּוֹר désigne naturellement les combattants puissants de Babylone.
- source_word: וָחָתּוּ
  choice: ils seront terrifiés
  rationale: Le verbe peut évoquer l'effroi, l'abattement ou l'effondrement. Ici, « terrifiés » rend clairement la débâcle psychologique des guerriers sans imposer l'idée plus matérielle d'une destruction.
