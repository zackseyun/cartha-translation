  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ זָד֔וֹן נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת כִּ֛י בָּ֥א יוֹמְ/ךָ֖ עֵ֥ת פְּקַדְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/031.yaml
  text: Behold[a], I am against you, O arrogant one, declares the Lord GOD of hosts, for your day has come[b], the time when I will punish you.
translation:
  language: fr
  text: « Me voici contre toi, l’Arrogante[a] ! — déclaration du Seigneur Yahweh des armées — car ton jour est arrivé, le moment où je te demanderai des comptes[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut aussi se traduire par « l’Insolente » ou « la Présomptueuse ». Il donne ici à Babylone un nom tiré de son arrogance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le moment où je m’occuperai de toi » ou « où je te visiterai ». Dans ce contexte, cette intervention consiste à appeler Babylone à rendre compte et à la juger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: Me voici contre toi
  rationale: La formule הִנְנִי introduit solennellement l’intervention divine, tandis que אֵלֶיךָ prend ici, dans un contexte de jugement, le sens hostile de « contre toi ».
- source_word: זָדוֹן
  choice: l’Arrogante
  rationale: Le nom désigne l’arrogance ou la présomption coupable et sert ici de titre personnifiant Babylone. Le féminin correspond naturellement en français au nom « Babylone ».
- source_word: נְאֻם
  choice: déclaration
  rationale: Cette formule prophétique présente les paroles qui précèdent comme un oracle autoritatif de Dieu. « Déclaration » garde sa solennité sans archaïsme.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur Yahweh, le Dieu des armées
  rationale: « Seigneur » rend אֲדֹנָי, « Yahweh » représente explicitement le nom divin, et « le Dieu des armées » exprime en français naturel le titre צְבָאוֹת sans le réduire au seul sens de « tout-puissant ».
- source_word: בָּא יוֹמְךָ
  choice: ton jour est arrivé
  rationale: Le parfait présente le jour fixé comme désormais arrivé, avec l’immédiateté et la certitude propres à l’annonce prophétique.
- source_word: עֵת פְּקַדְתִּיךָ
  choice: le moment où je te demanderai des comptes
  rationale: Dans ce contexte judiciaire, פקד désigne une intervention où Dieu appelle Babylone à rendre compte. Cette formulation communique le jugement sans réduire le verbe à une simple visite.
theological_decisions:
- issue: Identification de זָדוֹן comme appellation de Babylone
  choice: l’Arrogante
  alternative: l’Insolente ; la Présomptueuse ; l’arrogance
  rationale: Le contexte personnifie Babylone en fonction de son arrogance. La majuscule signale un titre, tout en laissant la note expliquer que le texte hébreu emploie un nom abstrait.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur Yahweh, le Dieu des armées
  alternative: le Seigneur DIEU des armées ; le Seigneur, l’Éternel, le maître de l’univers
  rationale: Le choix conserve distinctement אֲדֹנָי et le nom personnel יְהוִה, puis rend צְבָאוֹת comme un titre militaire et céleste sans l’assimiler silencieusement à « tout-puissant ».
- issue: Portée judiciaire de פקד
  choice: je te demanderai des comptes
  alternative: je te punirai ; j’interviendrai contre toi ; je te visiterai
  rationale: Le contexte exige une intervention de jugement. « Demander des comptes » en exprime la portée judiciaire tout en préservant davantage l’image de l’intervention divine que le seul verbe « punir ».
translation_notes:
  register: Français international actuel, solennel mais accessible. La phrase conserve le rythme de l’oracle, la personnification de Babylone et l’immédiateté du jugement. Les notes rendent visibles les principales ambiguïtés lexicales sans alourdir le texte.
