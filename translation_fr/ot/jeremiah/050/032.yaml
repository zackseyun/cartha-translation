  naturalness: Le français est naturel et de registre biblique moderne. « Je mettrai le feu dans ses villes » est également idiomatique et évite le léger déplacement de sens de « mettre le feu à ses villes ».
  terminology: '« L’arrogant », « trébuchera », « le relever » et « dévorera » conviennent. La personnification masculine est préservée par « le », puis par « ses » et « l’ ». La note a peut utilement conserver l’alternative abstraite sans affirmer que les pronoms accompagnent directement זָדוֹן : les formes masculines singulières appartiennent à la description contextuelle de la figure personnifiée.'
