  text: וְ/כָשַׁ֤ל זָדוֹן֙ וְ/נָפַ֔ל וְ/אֵ֥ין ל֖/וֹ מֵקִ֑ים וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה כָּל סְבִיבֹתָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/032.yaml
  text: And the arrogant one will stumble and fall[a], with no one to raise him up; and I will kindle a fire in his cities[b], and it will consume all around him.
translation:
  language: fr
  text: L’arrogant trébuchera et tombera[a], sans personne pour le relever. Je mettrai le feu dans ses villes[b], et il dévorera tout ce qui l’entoure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’orgueil » ou « l’insolence ». Le mot hébreu זָדוֹן est souvent abstrait, mais il est rendu ici par « l’arrogant » : dans le contexte, la figure décrite est au masculin singulier.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans ses villes ». Babylone est ici personnifiée sous les traits d’une figure masculine singulière.'
    reason: cultural_note
lexical_decisions:
- source_word: זָדוֹן
  choice: l’arrogant
  rationale: Le nom désigne souvent l’orgueil ou l’insolence de manière abstraite, mais les verbes et suffixes masculins singuliers du contexte favorisent ici une personnification. « L’arrogant » conserve cette référence personnelle sans effacer l’ambiguïté lexicale, signalée en note.
- source_word: כָשַׁל
  choice: trébuchera
  rationale: Dans ce discours prophétique de jugement, l’accompli hébreu peut présenter comme certain un événement à venir. « Trébuchera » restitue l’image et s’enchaîne naturellement avec « tombera ».
- source_word: נָפַל
  choice: et tombera
  rationale: La coordination préserve la progression hébraïque de la perte d’équilibre à la chute complète.
- source_word: מֵקִים
  choice: pour le relever
  rationale: Le participe causatif de קום évoque quelqu’un qui fait se relever celui qui est tombé. Cette formulation conserve l’image sans l’interpréter explicitement comme une restauration politique.
- source_word: הִצַּתִּי אֵשׁ
  choice: Je mettrai le feu
  rationale: Cette expression française courante rend fidèlement l’action d’allumer un feu destructeur. Le futur convient au contexte prophétique.
- source_word: בְּעָרָיו
  choice: à ses villes
  rationale: Le suffixe hébreu est masculin singulier et renvoie à la figure personnifiée. En français, « ses » permet de conserver la relation sans imposer un genre grammatical visible.
- source_word: וְאָכְלָה
  choice: et il dévorera
  rationale: Le sujet est le feu. En français, le pronom masculin « il » s’accorde avec « feu », tandis que « dévorera » préserve la vive métaphore hébraïque.
- source_word: כָּל סְבִיבֹתָיו
  choice: tout ce qui l’entoure
  rationale: Cette formulation naturelle exprime la totalité de ce qui se trouve autour de la figure jugée et maintient la référence personnelle du suffixe hébreu.
theological_decisions:
- issue: Personnification de Babylone au masculin singulier
  choice: 'Conserver une figure personnelle masculine : « l’arrogant… le… l’ »'
  alternative: Traduire de façon abstraite par « l’orgueil » ou traiter Babylone comme une entité féminine selon le genre français
  rationale: La grammaire hébraïque présente de manière suivie une figure masculine singulière. La traduction maintient cette personnification tout en indiquant en note que זָדוֹן peut également être compris comme un nom abstrait.
translation_notes:
  register: Français international moderne, digne et direct. « Mettre le feu à » est plus idiomatique aujourd’hui que « allumer un feu dans », tandis que « dévorera » maintient la force poétique de l’image. La ponctuation en deux phrases allège la longue coordination hébraïque sans modifier sa logique.
