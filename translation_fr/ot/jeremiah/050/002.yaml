source:
  edition: WLC
  text: הַגִּ֨ידוּ בַ/גּוֹיִ֤ם וְ/הַשְׁמִ֨יעוּ֙ וּֽ/שְׂאוּ נֵ֔ס הַשְׁמִ֖יעוּ אַל תְּכַחֵ֑דוּ אִמְרוּ֩ נִלְכְּדָ֨ה בָבֶ֜ל הֹבִ֥ישׁ בֵּל֙ חַ֣ת מְרֹדָ֔ךְ הֹבִ֣ישׁוּ עֲצַבֶּ֔י/הָ חַ֖תּוּ גִּלּוּלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/002.yaml
  text: Declare among the nations and proclaim[a]; lift up a banner. Proclaim; do not hide it. Say, “Babylon is captured; Bel is put to shame; Merodach is shattered. Her images are put to shame[b]; her idols are shattered.”
translation:
  language: fr
  text: 'Annoncez-le parmi les nations, proclamez-le ; levez un étendard ! Proclamez-le, ne le cachez pas ! Dites : « Babylone est prise ! Bel est couvert de honte, Mérodak[a] est terrifié[c]. Ses images sont couvertes de honte, ses idoles[b] sont terrifiées[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mérodak est la forme hébraïque du nom du dieu babylonien plus couramment appelé Mardouk.
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « idoles » est fortement péjoratif et évoque quelque chose d’immonde ou de méprisable.
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu peut exprimer l’effroi ou la consternation ; dans ce contexte, certains le comprennent au sens d’être brisé ou anéanti.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Annoncez-le
  rationale: Le hiphil impératif de נגד appelle une annonce publique. En français, le pronom explicite rend naturellement le verbe transitif et renvoie au message qui suit.
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les nations étrangères en général, sans le sens technique plus tardif de « païens ».
- source_word: וְהַשְׁמִיעוּ / הַשְׁמִיעוּ
  choice: proclamez-le
  rationale: Le hiphil de שמע signifie faire entendre publiquement. La répétition est conservée afin de respecter l'insistance rhétorique.
- source_word: וּשְׂאוּ נֵס
  choice: levez un étendard
  rationale: נֵס désigne un signal visible, souvent un étendard dressé pour le rassemblement ou l'annonce publique.
- source_word: אַל תְּכַחֵדוּ
  choice: ne le cachez pas
  rationale: Le piel de כחד exprime l'action de cacher ou de retenir une information. Cette formulation est actuelle et directe.
- source_word: נִלְכְּדָה בָבֶל
  choice: Babylone est prise
  rationale: Le niphal accompli présente la ville comme saisie ou conquise. « Est prise » convient au ton d'une proclamation de victoire.
- source_word: הֹבִישׁ / הֹבִישׁוּ
  choice: est couvert de honte / sont couvertes de honte
  rationale: Le hiphil de בוש décrit ici le déshonneur subi par les divinités et leurs représentations.
- source_word: בֵּל
  choice: Bel
  rationale: Le nom propre de la divinité est translittéré selon sa forme hébraïque.
- source_word: חַת / חַתּוּ
  choice: est terrifié / sont terrifiées
  rationale: Dans ces formes du qal, חתת exprime principalement l'effroi, la consternation ou l'abattement. La traduction garde cette valeur tout en signalant en note l'autre nuance contextuellement possible.
- source_word: מְרֹדָךְ
  choice: Mérodak
  rationale: Cette forme française translittère la forme hébraïque du nom, avec une note donnant la forme babylonienne plus connue.
- source_word: עֲצַבֶּיהָ
  choice: ses images
  rationale: עֲצַבִּים désigne des représentations façonnées servant d'idoles. « Images » permet de le distinguer du terme péjoratif qui suit.
- source_word: גִּלּוּלֶיהָ
  choice: ses idoles
  rationale: גִּלּוּלִים est un terme fortement méprisant pour les idoles. Le texte principal reste naturel, tandis que la note restitue sa charge péjorative.
theological_decisions:
- issue: Noms des divinités babyloniennes
  choice: Translittérer « Bel » et « Mérodak »
  alternative: Employer directement l'identification babylonienne « Mardouk » dans le texte
  rationale: La translittération respecte la forme du texte hébreu sans introduire dans le corps du verset une identification historique explicative.
- issue: Portée de חַת / חַתּוּ
  choice: Traduire par « terrifié / terrifiées »
  alternative: Traduire par « brisé / brisées » ou « anéanti / anéanties »
  rationale: Les formes qal favorisent ici l'idée d'effroi ou de consternation. La chute de Babylone peut suggérer en contexte l'effondrement de la puissance de ses dieux, mais cette interprétation n'est pas imposée silencieusement au texte.
- issue: Vocabulaire péjoratif appliqué aux idoles
  choice: Employer « idoles » dans le texte et expliciter la nuance dans une note
  alternative: Employer dans le texte une expression comme « idoles immondes » ou « idoles-déjections »
  rationale: Cette solution conserve une lecture française digne et intelligible tout en rendant accessible la virulence du terme hébreu.
translation_notes:
  register: Français international moderne, direct et solennel. Les impératifs répétés et les exclamations rendent le caractère pressant de la proclamation prophétique. Les accords féminins de la dernière phrase renvoient aux « images » et aux « idoles ».
