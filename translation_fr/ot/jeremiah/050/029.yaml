review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : appel à mobiliser des assaillants, encerclement de Babylone, absence d’échappée, rétribution proportionnée et accusation d’arrogance envers Yahweh. Toutefois, « faites-lui tout ce qu’elle a fait » est syntaxiquement et sémantiquement ambigu en français : il peut se lire comme l’ordre de lui faire tout ce qu’elle a elle-même fait, sans exprimer clairement la rétribution qu’énonce le datif hébreu. « Faites-lui subir tout ce qu’elle a fait » restitue clairement l’idée : infligez-lui ce qu’elle a infligé.'
  naturalness: Le français est moderne et soutenu. « Appelez contre Babylone de nombreux combattants » est naturel dans ce contexte militaire, même si « combattants » explicite légèrement le référent de « nombreux ». La révision de la seconde injonction de rétribution améliore nettement la clarté idiomatique. La note est ajustée afin de décrire plus précisément l’ambiguïté lexicale sans employer « évasion », moins naturel ici.
  terminology: « Yahweh » correspond au tétragramme et « le Saint d’Israël » rend exactement le titre prophétique. « Que personne ne s’échappe » préserve à bon droit la portée non tranchée de פְּלֵטָה ; la note conserve les lectures possibles de survivant ou de rescapé.
  issues:
  - severity: medium
    issue: Ambiguïté de « faites-lui tout ce qu’elle a fait »
    rationale: La formulation ne rend pas assez clairement la construction de rétribution « faites à elle selon tout ce qu’elle a fait ». L’ajout de « subir » explicite l’objet implicite sans changer le sens du jugement rétributif.
  - severity: low
    issue: 'Formulation de la note : « l’évasion »'
    rationale: פְּלֵטָה peut renvoyer à l’échappée/délivrance ou à des personnes échappées ; « le fait d’échapper » est plus précis et plus naturel en français dans cette explication lexicale.
