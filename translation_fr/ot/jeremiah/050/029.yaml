  text: הַשְׁמִ֣יעוּ אֶל בָּבֶ֣ל רַ֠בִּים כָּל דֹּ֨רְכֵי קֶ֜שֶׁת חֲנ֧וּ עָלֶ֣י/הָ סָבִ֗יב אַל יְהִי פְּלֵטָ֔ה שַׁלְּמוּ לָ֣/הּ כְּ/פָעֳלָ֔/הּ כְּ/כֹ֛ל אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָ֑/הּ כִּ֧י אֶל יְהוָ֛ה זָ֖דָה אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/029.yaml
  text: Summon many against Babylon[a], all who bend the bow; encamp around her on every side; let there be no escape. Repay her according to her work; according to all that she has done, do to her. For she has acted arrogantly against Yahweh, against the Holy One of Israel.
translation:
  language: fr
  text: Appelez contre Babylone de nombreux combattants, tous ceux qui bandent l’arc. Campez tout autour d’elle ; que personne ne s’échappe[a]. Rendez-lui selon ses actes ; faites-lui subir tout ce qu’elle a fait. Car elle a agi avec arrogance contre Yahweh, contre le Saint d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il n’y ait aucun survivant » ou « qu’il ne reste aucun rescapé ». Le mot hébreu peut désigner le fait d’échapper ou ceux qui ont échappé.
    reason: Alternative lexicale liée à l’ambiguïté de פְּלֵטָה.
lexical_decisions:
- source_word: הַשְׁמִיעוּ אֶל־בָּבֶל רַבִּים
  choice: Appelez contre Babylone de nombreux combattants
  rationale: Le hiphil impératif de שמע lance ici un appel à mobiliser des forces. « Appelez » rend naturellement cette valeur dans le contexte militaire. רַבִּים est substantivé ; « de nombreux combattants » explicite seulement le référent imposé par le contexte.
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: tous ceux qui bandent l’arc
  rationale: L’expression désigne les archers, mais la formulation retenue conserve l’image concrète de l’hébreu tout en restant naturelle en français.
- source_word: חֲנוּ עָלֶיהָ סָבִיב
  choice: Campez tout autour d’elle
  rationale: L’impératif décrit l’encerclement militaire de Babylone. « Tout autour » exprime clairement la totalité suggérée par סָבִיב.
- source_word: אַל יְהִי פְּלֵטָה
  choice: que personne ne s’échappe
  rationale: פְּלֵטָה peut désigner l’évasion, la délivrance ou ceux qui échappent. Cette formulation française convient à l’encerclement sans imposer explicitement le sens plus fort de « aucun survivant ».
- source_word: שַׁלְּמוּ לָהּ כְּפָעֳלָהּ
  choice: Rendez-lui selon ses actes
  rationale: Le piel de שלם exprime ici la rétribution. Le pluriel « actes » est idiomatique en français et rend la conduite de Babylone sans alourdir la phrase par le littéral « selon son œuvre ».
- source_word: כְּכֹל אֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: faites-lui tout ce qu’elle a fait
  rationale: La formulation conserve la répétition et la réciprocité judiciaire du texte hébreu dans un ordre naturel en français.
- source_word: זָדָה
  choice: a agi avec arrogance
  rationale: Le verbe évoque un comportement orgueilleux, présomptueux ou insolent. La traduction retenue communique à la fois l’attitude et l’action.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette expression prophétique établie est rendue sous une forme française reconnaissable, concise et fidèle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée de פְּלֵטָה dans l’oracle de jugement
  choice: que personne ne s’échappe
  alternative: qu’il n’y ait aucun survivant ; qu’il ne reste aucun rescapé
  rationale: Le contexte d’encerclement favorise l’idée d’absence d’évasion, mais le mot peut aussi désigner un survivant ou un reste échappé. La traduction principale évite de trancher en faveur d’une extermination totale, et la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme impératif et l’imagerie militaire sont conservés. La personnification féminine de Babylone est maintenue par « elle ». Aucun vocabulaire confessionnel propre à une tradition particulière n’est introduit.
