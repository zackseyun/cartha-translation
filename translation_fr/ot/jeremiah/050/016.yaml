source:
  edition: WLC
  text: כִּרְת֤וּ זוֹרֵ֨עַ֙ מִ/בָּבֶ֔ל וְ/תֹפֵ֥שׂ מַגָּ֖ל בְּ/עֵ֣ת קָצִ֑יר מִ/פְּנֵי֙ חֶ֣רֶב הַ/יּוֹנָ֔ה אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ לְ/אַרְצ֖/וֹ יָנֻֽסוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/016.yaml
  text: Cut off from Babylon the sower[a], and the one who handles the sickle at the time of harvest. Because of the sword of the oppressor, each man will turn to his own people, and each will flee to his own land.
translation:
  language: fr
  text: Retranchez de Babylone celui qui sème et celui qui manie la faucille au temps de la moisson. À cause de l’épée de l’oppresseur[a], chacun retournera vers son peuple, chacun fuira vers son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épée de celui qui opprime ». L’expression hébraïque a aussi été comprise comme « l’épée cruelle » ou, plus littéralement mais moins probablement, « l’épée de la colombe ».
    reason: Alternative lexicale pour une expression hébraïque ambiguë.
lexical_decisions:
- source_word: כִּרְתוּ
  choice: Retranchez
  rationale: L’impératif pluriel de כרת exprime ici l’élimination ou l’exclusion. « Retranchez » garde cette force de jugement sans préciser indûment le moyen employé.
- source_word: זוֹרֵעַ
  choice: celui qui sème
  rationale: Le participe substantivé désigne la personne occupée à semer. Cette formulation est naturelle en français moderne et évite le terme plus spécialisé « semeur ».
- source_word: מִבָּבֶל
  choice: de Babylone
  rationale: Avec כרת, la préposition מן indique le lieu d’où quelqu’un est retranché.
- source_word: וְתֹפֵשׂ מַגָּל
  choice: et celui qui manie la faucille
  rationale: תפשׂ signifie saisir ou tenir et, par extension dans ce contexte agricole, manier. La traduction conserve l’image précise de la faucille.
- source_word: בְּעֵת קָצִיר
  choice: au temps de la moisson
  rationale: Rendu temporel direct, clair et digne, correspondant à l’expression hébraïque.
- source_word: מִפְּנֵי
  choice: Devant
  rationale: La locution peut exprimer la fuite face à une menace et, par implication, sa cause. « Devant » préserve ici à la fois la nuance spatiale et causale.
- source_word: חֶרֶב הַיּוֹנָה
  choice: l’épée de l’oppresseur
  rationale: הַיּוֹנָה est probablement lié au verbe ינה, « opprimer », et désigne alors l’auteur de l’oppression. Une note conserve les autres analyses possibles de cette expression difficile.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: chacun retournera vers son peuple
  rationale: אישׁ a ici un sens distributif. « Chacun » est idiomatique en français et יפנו indique dans le contexte un mouvement de retour vers son propre peuple.
- source_word: וְאִישׁ לְאַרְצוֹ יָנֻסוּ
  choice: chacun fuira vers son pays
  rationale: נוס exprime la fuite; ארץ désigne ici le territoire d’origine, naturellement rendu par « pays » en français actuel.
theological_decisions:
- issue: Portée distributive et genre de אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: Dans ces deux propositions, אישׁ fonctionne distributivement. Le français « chacun » représente fidèlement cette portée générale sans imposer une restriction aux seuls hommes.
- issue: Interprétation de חֶרֶב הַיּוֹנָה
  choice: l’épée de l’oppresseur
  alternative: l’épée cruelle / l’épée de la colombe
  rationale: Le contexte de l’attaque contre Babylone favorise une dérivation verbale liée à l’oppression, mais la difficulté lexicale réelle est signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la fin du verset est conservé par la répétition de « chacun », tandis que les participes agricoles sont rendus par des expressions courantes et immédiatement compréhensibles.
