source:
  edition: WLC
  text: ק֥וֹל נָסִ֛ים וּ/פְלֵטִ֖ים מֵ/אֶ֣רֶץ בָּבֶ֑ל לְ/הַגִּ֣יד בְּ/צִיּ֗וֹן אֶת נִקְמַת֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ נִקְמַ֖ת הֵיכָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/028.yaml
  text: The sound of fugitives and escapees from the land of Babylon[a], to declare in Zion the vengeance of Yahweh our God[c][b], the vengeance for his temple.
translation:
  language: fr
  text: On entend les fuyards et les rescapés venus du pays de Babylone[a] annoncer dans Sion la vengeance de Yahweh notre Dieu, la vengeance pour son temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Une voix — des fuyards et des rescapés du pays de Babylone — pour annoncer… »'
    reason: La construction nominale hébraïque est concise et peut être rendue comme l’annonce soudaine d’une voix ou d’un bruit.
  - marker: b
    text: 'Littéralement : « la vengeance de son temple », c’est-à-dire la vengeance liée au tort fait à son temple.'
    reason: Le groupe construit hébreu laisse implicite la relation exacte entre la vengeance et le temple.
lexical_decisions:
- source_word: ק֥וֹל
  choice: On entend
  rationale: קוֹל désigne une voix, un bruit ou un son. Ici, cette tournure restitue naturellement en français la scène auditive introduite par le nom hébreu, sans imposer l’idée d’une seule voix.
- source_word: נָסִים וּפְלֵטִים
  choice: les fuyards et les rescapés
  rationale: נָסִים désigne ceux qui fuient, tandis que פְלֵטִים désigne ceux qui ont échappé au désastre. « Fuyards et rescapés » maintient la distinction et le parallélisme sans les assimiler simplement à des réfugiés.
- source_word: מֵאֶרֶץ בָּבֶל
  choice: venus du pays de Babylone
  rationale: Le texte mentionne explicitement le « pays » de Babylone. « Venus » explicite en français le lien naturel entre leur provenance et leur présence entendue à Sion.
- source_word: לְהַגִּיד בְּצִיּוֹן
  choice: annoncer dans Sion
  rationale: L’infinitif exprime ici le but ou l’action des rescapés, et la préposition ב situe l’annonce dans Sion. « Annoncer » convient à une proclamation publique.
- source_word: נִקְמַת
  choice: la vengeance
  rationale: נקמה exprime la vengeance ou la rétribution punitive. « Vengeance » conserve la force judiciaire et théologique du terme, que « réhabilitation » atténuerait.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh notre Dieu
  rationale: 'Le nom divin est translittéré et le suffixe de première personne du pluriel est conservé, maintenant ainsi la confession d’Israël : « notre Dieu ».'
- source_word: נִקְמַת הֵיכָלוֹ
  choice: la vengeance exercée pour son temple
  rationale: Le second groupe construit répète « vengeance » et la rapporte au temple. Cette formulation française indique qu’il s’agit de venger le tort fait au temple, tout en signalant en note la formulation hébraïque plus compacte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin, non un titre. La translittération « Yahweh » préserve cette donnée du texte source.
- issue: Rapport entre la vengeance et le temple
  choice: la vengeance exercée pour son temple
  alternative: la vengeance de son temple
  rationale: Le complément hébreu est compact et peut désigner la vengeance motivée par la profanation ou la destruction du temple. Le texte principal donne le sens contextuel le plus naturel sans faire du temple l’agent de la vengeance; la note préserve la forme littérale.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « On entend » transforme avec mesure l’ouverture nominale hébraïque en une phrase naturelle; la répétition de « la vengeance » est conservée pour respecter l’insistance du texte.
