source:
  edition: WLC
  text: חֶ֥רֶב עַל כַּשְׂדִּ֖ים נְאֻם יְהוָ֑ה וְ/אֶל יֹשְׁבֵ֣י בָבֶ֔ל וְ/אֶל שָׂרֶ֖י/הָ וְ/אֶל חֲכָמֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/035.yaml
  text: A sword is against the Chaldeans[a], declares Yahweh, and against the inhabitants of Babylon, and against her officials[b], and against her wise men.
translation:
  language: fr
  text: L’épée contre les Chaldéens[a] ! — oracle de Yahweh — contre les habitants de Babylone, contre ses hauts fonctionnaires[b] et contre ses sages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Babyloniens ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses princes » ou « ses chefs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב עַל
  choice: L’épée contre
  rationale: La proposition nominale hébraïque ouvre abruptement l’oracle. En français, cette formulation elliptique conserve la force de la proclamation de jugement et évoque à la fois l’arme et la guerre.
- source_word: כַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le terme est l’ethnonyme précis du texte hébreu. Il désigne ici les Babyloniens, mais « Chaldéens » préserve la nuance historique et ethnique.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule française, intégrée comme incise, rend le caractère solennel de la formule prophétique et conserve le nom divin.
- source_word: וְאֶל
  choice: contre
  rationale: Dans cette série parallèle, אֶל reprend la direction hostile exprimée par עַל après « épée »; la répétition de « contre » rend cette portée explicite et soutient la cadence.
- source_word: יֹשְׁבֵי בָבֶל
  choice: les habitants de Babylone
  rationale: Rend naturellement en français le participe substantivé signifiant littéralement « ceux qui habitent Babylone ».
- source_word: שָׂרֶיהָ
  choice: ses hauts fonctionnaires
  rationale: שׂרים désigne ici les détenteurs de l’autorité politique ou administrative de Babylone. « Hauts fonctionnaires » évite de faire nécessairement de ces hommes des fils de roi, tout en marquant leur rang.
- source_word: חֲכָמֶיהָ
  choice: ses sages
  rationale: Traduction directe qui conserve la référence à la classe savante et conseillère renommée de Babylone sans la réduire aux seuls conseillers.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée métaphorique de חֶרֶב
  choice: Conserver « l’épée »
  alternative: Expliciter par « la guerre » ou « la destruction »
  rationale: L’image prophétique peut désigner la guerre et le jugement, mais le texte les exprime par la figure concrète de l’épée; la traduction ne résout donc pas cette richesse en une seule abstraction.
translation_notes:
  register: Français international moderne, solennel et incisif. L’ouverture elliptique avec point d’exclamation reproduit l’annonce abrupte de l’hébreu; les tirets isolent la formule prophétique. Les possessifs féminins hébreux renvoyant à Babylone sont rendus par « ses », forme naturelle mais non genrée en français.
