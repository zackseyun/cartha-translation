  verdict: revise
  source_fidelity: Le projet rend bien la structure et l’imagerie du verset, y compris l’adresse poétique finale. Toutefois, « saisissent » est plus ponctuel et énergique que יַחֲזִיקוּ (« tiennent / prennent en main »), « montent des chevaux » décrit plus naturellement l’action de les enfourcher que le fait de les chevaucher, et « fracas » précise indûment le sens plus général de קוֹלָם (« leur bruit / leur voix »).
  naturalness: Le français est globalement clair et soutenu. « Ils chevauchent des chevaux » et « en ordre de bataille » sont plus idiomatiques et plus précis dans ce contexte que « ils montent des chevaux, rangés ».
  terminology: « Arc », « javelot », « cruels », « aucune compassion », « combat » et « fille de Babylone » sont appropriés. La note sur « comme un seul homme » conserve utilement l’alternative idiomatique sans la substituer au singulier masculin du texte.
  issues:
  - severity: medium
    issue: « Ils saisissent » pour יַחֲזִיקוּ
    rationale: Le verbe hébreu exprime ici le fait de tenir ou de prendre en main les armes; « saisissent » peut suggérer une prise soudaine, nuance non explicitée par le texte.
  - severity: medium
    issue: « Leur fracas » pour קוֹלָם
    rationale: « Fracas » évoque spécifiquement un bruit violent de choc ou de destruction. Le terme hébreu signifie plus largement leur voix, bruit ou son; « leur bruit » préserve cette portée.
  - severity: medium
    issue: « Ils montent des chevaux » pour עַל סוּסִים יִרְכָּבוּ
    rationale: En français moderne, « monter des chevaux » peut se comprendre comme les enfourcher ou les dresser. « Chevaucher des chevaux » exprime directement l’action durable de monter à cheval.
  - severity: low
    issue: « Rangés comme un homme »
    rationale: Le sens de formation militaire est mieux rendu par « en ordre de bataille »; cette formulation conserve le participe de préparation/disposition et se lie naturellement à « comme un homme ».
