  text: קֶ֣שֶׁת וְ/כִידֹ֞ן יַחֲזִ֗יקוּ אַכְזָרִ֥י הֵ֨מָּה֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/042.yaml
  text: They seize bow and javelin; they are cruel and will show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Babylon.
translation:
  language: fr
  text: Ils tiennent l’arc et le javelot ; ils sont cruels et n’auront aucune compassion. Leur bruit gronde comme la mer, et ils chevauchent des chevaux, en ordre de bataille comme un homme[a], pour le combat contre toi, fille de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un seul homme », pour souligner l’unité de la formation militaire.
    reason: Alternative lexicale et interprétative de כְּאִישׁ.
lexical_decisions:
- source_word: קֶשֶׁת
  choice: l’arc
  rationale: Le singulier collectif désigne l’arme portée par les envahisseurs ; « l’arc » conserve naturellement cette valeur en français.
- source_word: כִידֹן
  choice: le javelot
  rationale: Le terme désigne une arme d’hast pouvant être lancée ; « javelot » la distingue de l’arc et reste plus précis que le terme général « lance ».
- source_word: יַחֲזִיקוּ
  choice: ils saisissent
  rationale: La forme verbale exprime ici le fait de prendre ou tenir fermement les armes, avec une nuance de préparation militaire.
- source_word: אַכְזָרִי הֵמָּה
  choice: ils sont cruels
  rationale: Traduction directe du caractère impitoyable des envahisseurs, confirmé par la proposition suivante.
- source_word: וְלֹא יְרַחֵמוּ
  choice: et n’auront aucune compassion
  rationale: Cette formulation idiomatique garde la portée prospective du contexte sans atténuer l’absence totale de pitié.
- source_word: קוֹלָם
  choice: leur fracas
  rationale: קוֹל peut désigner voix, son ou bruit. Dans la comparaison avec la mer et le contexte d’une armée, « fracas » rend naturellement le bruit collectif tout en conservant sa force.
- source_word: כַּיָּם יֶהֱמֶה
  choice: gronde comme la mer
  rationale: Le verbe évoque un mugissement ou un tumulte ; « gronde » convient au bruit puissant de la mer et d’une armée.
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: et ils montent des chevaux
  rationale: Rendu direct de l’action militaire, idiomatique en français moderne.
- source_word: עָרוּךְ
  choice: rangés
  rationale: Le participe décrit une troupe disposée en formation et prête au combat. L’accord français au pluriel rend explicite le lien contextuel avec les envahisseurs.
- source_word: כְּאִישׁ
  choice: comme un homme
  rationale: Le texte hébreu porte formellement le singulier masculin. Le rendu principal préserve cette image, tandis que le sens possible d’unité collective est signalé en note.
- source_word: לַמִּלְחָמָה
  choice: pour le combat
  rationale: « Combat » est naturel dans cette scène militaire immédiate et rend fidèlement מִלְחָמָה.
- source_word: בַּת בָּבֶל
  choice: fille de Babylone
  rationale: Cette expression conserve la personnification poétique de la ville et l’adresse directe, sans ajouter de qualification absente de l’hébreu.
theological_decisions:
- issue: Singulier masculin dans la comparaison militaire כְּאִישׁ
  choice: comme un homme
  alternative: comme un seul homme
  rationale: Le texte principal conserve la forme et l’image masculines de l’hébreu. Toutefois, l’expression peut décrire l’unité de la formation militaire ; cette lecture est maintenue en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme militaire est soutenu par des propositions brèves et par « fracas » et « gronde ». La personnification finale « fille de Babylone » est conservée. Le marqueur de note est placé immédiatement après l’expression ambiguë qu’il explique.
