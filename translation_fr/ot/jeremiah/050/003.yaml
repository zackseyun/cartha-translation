revisions:
- from: Car une nation est montée contre elle depuis le nord. Elle réduira son pays en désolation, et il n’y aura plus aucun habitant. De l’être humain jusqu’à la bête[a], tous ont fui, ils sont partis.
  to: Car une nation est montée contre elle du nord ; elle fera de son pays une désolation, et il n’y aura plus personne pour y habiter. Des humains jusqu’aux bêtes[a], ils ont fui, ils sont partis.
  rationale: La révision conserve l’aspect accompli de l’avancée hostile (« est montée »), la personnification féminine de Babylone et la succession des deux verbes finaux. Elle emploie des tournures plus idiomatiques en français moderne, explicite le complément locatif du texte source et rend la note plus exacte.
