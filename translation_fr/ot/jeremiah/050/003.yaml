source:
  edition: WLC
  text: כִּ֣י עָלָה֩ עָלֶ֨י/הָ גּ֜וֹי מִ/צָּפ֗וֹן הֽוּא יָשִׁ֤ית אֶת אַרְצָ/הּ֙ לְ/שַׁמָּ֔ה וְ/לֹֽא יִהְיֶ֥ה יוֹשֵׁ֖ב בָּ֑/הּ מֵ/אָדָ֥ם וְ/עַד בְּהֵמָ֖ה נָ֥דוּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/003.yaml
  text: For a nation has come up against her from the north; it will make her land a desolation[a], and there will be no inhabitant in it. From man to beast, they have fled; they have gone away.
translation:
  language: fr
  text: Car une nation est montée contre elle du nord ; elle fera de son pays une désolation, et il n’y aura plus personne pour y habiter. Des humains jusqu’aux bêtes[a], ils ont fui, ils sont partis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Des humains jusqu’aux bêtes. » Cette expression hébraïque indique que tous les êtres vivants, humains comme animaux, sont partis.'
    reason: Explicitation de l’expression hébraïque de totalité.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel précédent à annoncer la chute de Babylone et conserve naturellement la valeur explicative de la conjonction.
- source_word: עָלָה עָלֶיהָ
  choice: est montée contre elle
  rationale: Le verbe avec עַל décrit ici l’avancée hostile d’une armée. Cette formulation conserve l’image hébraïque tout en restant intelligible en français.
- source_word: גּוֹי
  choice: une nation
  rationale: Dans ce contexte d’invasion, le terme désigne une entité politique et militaire.
- source_word: מִצָּפוֹן
  choice: depuis le nord
  rationale: Indique la provenance de l’envahisseur, motif fréquent dans Jérémie.
- source_word: הוּא יָשִׁית אֶת אַרְצָהּ לְשַׁמָּה
  choice: Elle réduira son pays en désolation
  rationale: Le pronom reprend « une nation », féminin en français. « Réduire en désolation » exprime clairement le résultat dévastateur de l’action.
- source_word: וְלֹא יִהְיֶה יוֹשֵׁב בָּהּ
  choice: et il n’y aura plus aucun habitant
  rationale: Rend l’absence totale d’habitants annoncée par la proposition hébraïque; « plus » explicite naturellement en français le nouvel état résultant du jugement.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: De l’être humain jusqu’à la bête
  rationale: Conserve l’expression de totalité allant des humains aux animaux, sans employer en français un masculin susceptible d’être compris comme exclusivement masculin.
- source_word: נָדוּ הָלָכוּ
  choice: tous ont fui, ils sont partis
  rationale: Les deux verbes successifs expriment la fuite puis le départ effectif. « Tous » rend explicite le sujet collectif impliqué par l’expression précédente et par les verbes au pluriel.
theological_decisions:
- issue: Portée générique de אָדָם dans une expression de totalité
  choice: l’être humain
  alternative: l’homme
  rationale: Ici, אָדָם englobe l’ensemble des humains en contraste avec les animaux. « L’être humain » transmet cette portée générique sans modifier le sens théologique ni restreindre artificiellement le référent.
translation_notes:
  register: Français international moderne, sobre et prophétique. La personnification féminine de Babylone est maintenue par « elle », tandis que « son pays » évite une formulation artificielle. Le marqueur de note est placé après l’expression qu’il explique.
