  text: צֹ֤אן אֹֽבְדוֹת֙ היה עַמִּ֔/י רֹעֵי/הֶ֣ם הִתְע֔וּ/ם הָרִ֖ים שובבים מֵ/הַ֤ר אֶל גִּבְעָה֙ הָלָ֔כוּ שָׁכְח֖וּ רִבְצָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/006.yaml
  text: My people have been lost sheep[a]; their shepherds have led them astray, turning them away on the mountains. They have gone from mountain to hill[b]; they have forgotten their resting place.
translation:
  language: fr
  text: Mon peuple était un troupeau de brebis perdues[a]. Leurs bergers les ont égarées, les faisant errer dans les montagnes. Elles sont allées de montagne en colline[b] et ont oublié leur lieu de repos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Mon peuple était des brebis perdues ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « de montagne en colline » peut aussi évoquer les déplacements d’Israël parmi les hauts lieux, souvent associés à l’infidélité dans Jérémie.
    reason: cross_reference
  - marker: c
    text: 'Le mot rendu par « les faisant errer » est difficile. Une analyse plus formelle peut comprendre : « les montagnes les détournaient » ou « les montagnes errantes ».'
    reason: textual_uncertainty
lexical_decisions:
- source_word: צֹאן אֹבְדוֹת
  choice: un troupeau de brebis perdues
  rationale: צֹאן est un nom collectif, tandis que le participe féminin pluriel אֹבְדוֹת présente les membres du troupeau comme perdus. Cette formulation française conserve à la fois l’image collective et l’accord implicite au pluriel.
- source_word: היה עַמִּי
  choice: Mon peuple était
  rationale: Le qatal היה introduit ici un état passé dans l’accusation prophétique. L’imparfait français exprime naturellement cet état sans imposer une valeur temporelle plus précise.
- source_word: רֹעֵיהֶם
  choice: leurs bergers
  rationale: Le terme pastoral est maintenu afin de préserver la métaphore par laquelle Jérémie désigne les responsables du peuple.
- source_word: הִתְעוּם
  choice: les avaient égarées
  rationale: 'Le hifil de תעה est causatif : les bergers ont fait s’égarer les brebis. Le plus-que-parfait s’accorde naturellement avec le cadre narratif français et souligne leur responsabilité.'
- source_word: הָרִים שובבים
  choice: les faisaient errer dans les montagnes
  rationale: La construction hébraïque est difficile. La traduction rend le mouvement errant produit par les bergers tout en conservant les montagnes comme cadre du déplacement; une note signale une analyse plus formelle possible.
- source_word: מֵהַר אֶל גִּבְעָה
  choice: de montagne en colline
  rationale: Cette tournure française concise restitue le mouvement répété d’un relief à l’autre sans expliciter une éventuelle allusion cultuelle.
- source_word: הָלָכוּ
  choice: elles allaient
  rationale: Le verbe signifie simplement « aller » ou « marcher ». L’imparfait laisse le contexte des brebis perdues communiquer l’idée d’errance sans la redoubler lexicalement.
- source_word: שָׁכְחוּ רִבְצָם
  choice: avaient oublié leur lieu de repos
  rationale: רִבְצָם désigne l’endroit où les animaux se couchent. « lieu de repos » est clair, actuel et moins spécifique que « bergerie » ou « enclos ».
theological_decisions:
- issue: Allusion possible aux hauts lieux idolâtres dans les montagnes et les collines
  choice: Conserver les termes géographiques et pastoraux sans rendre l’idolâtrie explicite dans le texte principal.
  alternative: Traduire de manière interprétative pour mettre en avant les hauts lieux cultuels.
  rationale: Dans Jérémie, montagnes et collines peuvent évoquer l’apostasie, mais l’image immédiate est celle de brebis égarées. La formulation retenue préserve cette possible résonance sans l’imposer.
- issue: Analyse du difficile שובבים
  choice: Le comprendre contextuellement comme décrivant l’errance que les bergers font subir aux brebis.
  alternative: Comprendre l’expression plus formellement comme « les montagnes les rendaient rebelles/errantes » ou rattacher le participe aux bergers avec le sens de « les détournant ».
  rationale: La syntaxe permet plusieurs analyses et ne doit pas servir à trancher artificiellement une question théologique. Le texte principal privilégie une phrase française intelligible, tandis que la note conserve l’ambiguïté philologique.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore pastorale est conservée. Les imparfaits et plus-que-parfaits présentent naturellement en français l’état du peuple, l’action antérieure de ses bergers et son errance prolongée. Les deux marqueurs de note figurent dans le texte principal.
