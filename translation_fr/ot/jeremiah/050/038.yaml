source:
  edition: WLC
  text: חֹ֥רֶב אֶל מֵימֶ֖י/הָ וְ/יָבֵ֑שׁוּ כִּ֣י אֶ֤רֶץ פְּסִלִים֙ הִ֔יא וּ/בָ/אֵימִ֖ים יִתְהֹלָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/038.yaml
  text: A drought is against her waters[a], and they will dry up, for it is a land of carved idols[b], and they are mad over terrifying things.
translation:
  language: fr
  text: Une sécheresse s’abat sur ses eaux[a], et elles tariront, car c’est un pays d’idoles sculptées ; ses habitants délirent au sujet de choses terrifiantes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu vocalisé porte « sécheresse ». Ses consonnes peuvent aussi évoquer « épée », mot fréquent dans les annonces de jugement de Jérémie.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ils deviennent fous à cause de leurs idoles terrifiantes » ; littéralement, « ils délirent au sujet des terreurs » ou « des choses terrifiantes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹרֶב
  choice: La sécheresse
  rationale: La vocalisation massorétique חֹרֶב désigne ici la sécheresse, sens particulièrement naturel devant « ses eaux » et « elles tariront ». Le texte consonantique évoque toutefois le mot très proche signifiant « épée », fréquent dans les formules de jugement de Jérémie.
- source_word: אֶל מֵימֶיהָ
  choice: frappe ses eaux
  rationale: Littéralement « contre ses eaux ». En français, « frappe ses eaux » exprime naturellement l’action hostile de la sécheresse tout en conservant l’image du jugement.
- source_word: וְיָבֵשׁוּ
  choice: et elles tariront
  rationale: Le qal a ici pour sujet les eaux et indique qu’elles s’assécheront. « Tarir » est le verbe français idiomatique pour des eaux qui viennent à manquer.
- source_word: אֶרֶץ פְּסִלִים
  choice: un pays d’idoles sculptées
  rationale: פְּסִלִים désigne concrètement des images taillées ou sculptées employées comme idoles ; cette formulation conserve les deux aspects.
- source_word: וּבָאֵימִים
  choice: devant des objets terrifiants
  rationale: אֵימִים signifie littéralement « terreurs » ou « choses terrifiantes ». Le contexte peut viser les idoles effrayantes sans imposer explicitement cette identification.
- source_word: יִתְהֹלָלוּ
  choice: ses habitants délirent
  rationale: La forme exprime une conduite insensée ou frénétique. Le sujet implicite est rendu par « ses habitants » afin d’éviter en français un « ils » sans antécédent clair.
theological_decisions:
- issue: Sens de חֹרֶב devant « ses eaux »
  choice: La sécheresse
  alternative: L’épée
  rationale: La vocalisation du WLC et l’effet annoncé sur les eaux favorisent nettement « sécheresse ». La proximité consonantique avec « épée » peut néanmoins produire un écho intentionnel aux formules de jugement du contexte ; cette possibilité est signalée sans remplacer le sens principal.
- issue: Référent de אֵימִים
  choice: des objets terrifiants
  alternative: des idoles terrifiantes / des terreurs
  rationale: Le terme peut qualifier les objets idolâtriques du membre précédent, mais le texte ne les nomme pas directement une seconde fois. La traduction garde donc le référent ouvert.
translation_notes:
  register: Français international moderne, digne et direct. « Ses habitants » explicite sobrement le sujet humain implicite du dernier verbe. Le point-virgule met en relief la cause idolâtrique du jugement sans résoudre l’ambiguïté du dernier groupe nominal.
