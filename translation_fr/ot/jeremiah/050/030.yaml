source:
  edition: WLC
  text: לָ/כֵ֛ן יִפְּל֥וּ בַחוּרֶ֖י/הָ בִּ/רְחֹבֹתֶ֑י/הָ וְ/כָל אַנְשֵׁ֨י מִלְחַמְתָּ֥/הּ יִדַּ֛מּוּ בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/030.yaml
  text: Therefore her young men will fall in her streets[a], and all her warriors will be silenced on that day, declares Yahweh.
translation:
  language: fr
  text: C’est pourquoi ses jeunes hommes tomberont dans ses rues, et tous ses guerriers seront réduits au silence[a] ce jour-là — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « périront ». Le verbe hébreu peut signifier « devenir silencieux, immobile » et, dans ce contexte, évoquer le silence de la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du jugement annoncé auparavant.
- source_word: יִפְּלוּ
  choice: tomberont
  rationale: Conserve l’image hébraïque de la chute, qui implique ici la mort au combat sans l’expliciter davantage.
- source_word: בַחוּרֶיהָ
  choice: ses jeunes hommes
  rationale: Désigne des hommes dans la force de l’âge, avec une possible connotation militaire; cette traduction reste naturelle et sobre.
- source_word: בִּרְחֹבֹתֶיהָ
  choice: dans ses rues
  rationale: רחובות peut désigner de larges rues ou des places publiques; « rues » convient naturellement à cette scène urbaine.
- source_word: אַנְשֵׁי מִלְחַמְתָּהּ
  choice: ses guerriers
  rationale: Rend avec concision l’expression littérale « les hommes de sa guerre » tout en conservant son sens militaire.
- source_word: יִדַּמּוּ
  choice: seront réduits au silence
  rationale: Préserve l’image de l’immobilité ou du silence, tout en laissant le contexte de jugement suggérer la mort.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Formulation prophétique idiomatique et naturelle en français moderne.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique comme une affirmation solennelle attribuée à celui qui parle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » en préserve le caractère de nom personnel.
- issue: Degré d’explicitation de יִדַּמּוּ
  choice: seront réduits au silence
  alternative: périront; seront anéantis
  rationale: Le verbe évoque le silence ou l’immobilité et peut, dans ce contexte guerrier, impliquer la mort. Le texte principal conserve cette tension, tandis que la note donne le sens contextuel possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique, l’image de la chute et l’ambiguïté mortelle du silence sont conservés; la formule finale reste solennelle sans archaïsme.
