  text: עִרְכ֨וּ עַל בָּבֶ֤ל סָבִיב֙ כָּל דֹּ֣רְכֵי קֶ֔שֶׁת יְד֣וּ אֵלֶ֔י/הָ אַֽל תַּחְמְל֖וּ אֶל חֵ֑ץ כִּ֥י לַֽ/יהוָ֖ה חָטָֽאָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/014.yaml
  text: Draw up against Babylon all around, all you who bend the bow; shoot at her; do not spare an arrow, for she has sinned against Yahweh.
translation:
  language: fr
  text: Prenez position contre Babylone, tout autour d’elle, vous tous qui bandez l’arc ! Tirez sur elle, n’épargnez aucune flèche, car elle a péché contre Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִרְכוּ עַל בָּבֶל סָבִיב
  choice: Prenez position tout autour de Babylone
  rationale: Dans ce contexte militaire, ערך appelle les combattants à se mettre en ordre de bataille; « prenez position » est naturel en français et סָבִיב exprime l’encerclement.
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: vous tous qui bandez l’arc
  rationale: L’expression désigne les archers tout en conservant l’image concrète de ceux qui tendent ou bandent l’arc.
- source_word: יְדוּ אֵלֶיהָ
  choice: Tirez sur elle
  rationale: Le hiphil de ידה a ici le sens de tirer des projectiles; le pronom féminin maintient la personnification de Babylone.
- source_word: אַל תַּחְמְלוּ אֶל חֵץ
  choice: n’épargnez aucune flèche
  rationale: L’interdiction demande de ne retenir ni économiser les flèches. Le singulier hébreu reçoit une valeur distributive naturelle en français avec « aucune ».
- source_word: כִּי לַיהוָה חָטָאָה
  choice: car elle a péché contre Yahweh
  rationale: כִּי introduit le motif de l’attaque; avec חטא, ל marque la personne envers laquelle la faute est commise, d’où « contre ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » distingue le nom divin d’un titre et suit la décision fournie, sans masquer le nom propre.
- issue: Rapport entre le péché de Babylone et Yahweh
  choice: elle a péché contre Yahweh
  alternative: elle a péché envers Yahweh
  rationale: Bien que l’hébreu emploie ל, la construction avec חטא indique idiomatiquement celui contre qui le péché est commis. « Contre » transmet clairement cette relation en français.
translation_notes:
  register: Français international moderne, direct et solennel. Les impératifs conservent l’urgence militaire du verset; la personnification féminine de Babylone est maintenue par « elle ».
