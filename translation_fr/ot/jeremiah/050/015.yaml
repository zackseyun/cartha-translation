source:
  edition: WLC
  text: הָרִ֨יעוּ עָלֶ֤י/הָ סָבִיב֙ נָתְנָ֣ה יָדָ֔/הּ נָֽפְלוּ֙ אשויתי/ה נֶהֶרְס֖וּ חֽוֹמוֹתֶ֑י/הָ כִּי֩ נִקְמַ֨ת יְהוָ֥ה הִיא֙ הִנָּ֣קְמוּ בָ֔/הּ כַּ/אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/015.yaml
  text: Raise a shout against her all around[a]; she has given her hand; her foundations have fallen, her walls are torn down. For it is the vengeance of Yahweh—take vengeance on her; as she has done[b], do to her.
translation:
  language: fr
  text: Lancez des cris contre elle, de tous côtés ! Elle a donné sa main[a] ; ses ouvrages défensifs[b] sont tombés, ses murailles sont démolies. Car c’est la vengeance de Yahweh. Vengez-vous d’elle ; comme elle a agi, agissez envers elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette expression signifie probablement : « Elle s’est rendue » ou « elle s’est soumise ». Littéralement : « elle a donné sa main ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est incertain ; il peut désigner des fondations, des contreforts, des remparts ou d’autres structures défensives.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: הָרִיעוּ עָלֶיהָ סָבִיב
  choice: Poussez contre elle, de tous côtés, un cri de guerre
  rationale: Le hifil impératif pluriel de רוע/ריע désigne ici un cri poussé dans un contexte militaire. « Cri de guerre » rend naturellement ce contexte sans préciser davantage la nature exacte du cri ; « contre elle » et « de tous côtés » conservent l’hostilité et l’encerclement exprimés par עָלֶיהָ סָבִיב.
- source_word: נָתְנָה יָדָהּ
  choice: Elle a donné sa main
  rationale: La traduction conserve l’image littérale de l’hébreu. Dans le contexte, cette expression signifie probablement qu’elle s’est rendue ou soumise, sens indiqué en note sans effacer l’expression originale.
- source_word: אשויתיה
  choice: ses ouvrages défensifs
  rationale: Le nom est rare et de sens incertain. Dans le contexte du siège et en parallèle avec les murailles, il semble désigner des structures défensives ou des éléments de fortification. La formulation générale évite de choisir arbitrairement entre fondations, contreforts et remparts.
- source_word: נֶהֶרְסוּ חוֹמוֹתֶיהָ
  choice: ses murailles sont démolies
  rationale: Le nifal de הרס exprime la destruction ou la démolition. « Murailles » convient mieux que le terme général « murs » aux fortifications d’une ville assiégée.
- source_word: נִקְמַת יְהוָה הִיא
  choice: c’est la vengeance de Yahweh
  rationale: La proposition identifie cette destruction à la vengeance appartenant à Yahweh ou exercée en son nom. Le nom divin est translittéré « Yahweh ».
- source_word: הִנָּקְמוּ בָהּ
  choice: Vengez-vous d’elle
  rationale: L’impératif pluriel commande aux assaillants d’exercer la vengeance contre Babylone. Cette formulation française est directe et conserve le vocabulaire de la vengeance.
- source_word: כַּאֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: comme elle a fait, faites-lui de même
  rationale: La formulation conserve la brièveté, la réciprocité et la force impérative de l’hébreu, tout en étant idiomatique en français.
theological_decisions:
- issue: Faut-il expliciter la reddition dans נָתְנָה יָדָהּ ?
  choice: Conserver dans le texte l’image « elle a donné sa main » et expliquer en note son sens probable.
  alternative: elle s’est rendue
  rationale: L’expression désigne vraisemblablement la capitulation, mais sa forme imagée mérite d’être préservée afin de ne pas résoudre silencieusement une tournure qui reste interprétative.
- issue: Comment rendre le nom incertain אשויתיה ?
  choice: ses ouvrages défensifs
  alternative: ses fondations ; ses contreforts ; ses remparts
  rationale: Le contexte favorise une réalité architecturale ou militaire, mais ne permet pas de l’identifier avec certitude. Une désignation englobante dans le texte, accompagnée d’une note, préserve cette incertitude.
- issue: Rapport entre la vengeance de Yahweh et l’ordre adressé aux assaillants
  choice: Maintenir côte à côte « la vengeance de Yahweh » et « Vengez-vous d’elle ».
  alternative: Exercez contre elle la vengeance de Yahweh
  rationale: L’hébreu présente sans l’expliquer la vengeance comme celle de Yahweh, tout en ordonnant aux assaillants de l’accomplir. La traduction conserve cette tension d’agence.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme impératif et militaire du verset est conservé. « Murailles » situe naturellement la scène dans un siège, tandis que les notes signalent les deux principales difficultés lexicales sans alourdir le texte.
