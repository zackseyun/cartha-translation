  text: שֶׂ֧ה פְזוּרָ֛ה יִשְׂרָאֵ֖ל אֲרָי֣וֹת הִדִּ֑יחוּ הָ/רִאשׁ֤וֹן אֲכָל/וֹ֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/זֶ֤ה הָ/אַחֲרוֹן֙ עִצְּמ֔/וֹ נְבוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/017.yaml
  text: Israel is a scattered sheep[a]; lions have driven him away. First the king of Assyria devoured him[c][b], and this last one—Nebuchadnezzar king of Babylon—has gnawed his bones.
translation:
  language: fr
  text: Israël est une brebis dispersée[a] que des lions ont chassée. Le premier à le dévorer fut le roi d’Assyrie ; puis le dernier, Nabuchodonosor, roi de Babylone, lui a rongé les os[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner une brebis, un mouton ou un agneau.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu, rare, peut évoquer le fait de ronger les os, de les dépouiller ou, plus généralement, de les broyer. Le nom hébreu du roi est ici Neboukadrètsar, forme correspondant à « Nebucadretsar » ; « Nabuchodonosor » est la forme française traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה פְזוּרָה
  choice: une brebis dispersée
  rationale: שֶׂה désigne une bête du petit bétail, jeune ou adulte, et פְזוּרָה la présente comme dispersée. « Brebis dispersée » conserve l’image pastorale, la vulnérabilité de l’animal et l’accord féminin du texte hébreu.
- source_word: אֲרָיוֹת הִדִּיחוּ
  choice: que des lions ont chassée
  rationale: Le hiphil de נדח exprime ici l’action de faire fuir ou de chasser. La relative donne une phrase française naturelle tout en maintenant l’image des prédateurs.
- source_word: הָרִאשׁוֹן אֲכָלוֹ
  choice: Le premier à le dévorer
  rationale: « Dévorer » restitue la métaphore prédatrice plus vivement que le littéral « manger ». « Le premier » marque la succession des deux puissances impériales.
- source_word: עִצְּמוֹ
  choice: lui a rongé les os
  rationale: Ce verbe rare évoque vraisemblablement l’action de ronger ou de dépouiller les os. La formulation retenue maintient l’image animale très concrète sans masquer l’incertitude lexicale.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: La forme française traditionnelle et largement reconnaissable est retenue dans le texte ; la forme plus proche de l’hébreu de ce verset est signalée en note.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rendu direct et idiomatique de la chaîne construite hébraïque.
theological_decisions:
- issue: Personnification d’Israël et variation de genre
  choice: L’image initiale est féminine (« brebis… chassée »), puis Israël est repris au masculin (« le dévorer », « lui »).
  alternative: Maintenir partout le féminin en reprenant uniquement « la brebis », ou employer un pluriel collectif.
  rationale: L’hébreu associe Israël à un animal qualifié au féminin, mais emploie ensuite des suffixes masculins singuliers renvoyant à Israël. La traduction garde cette tension grammaticale et la personnification nationale singulière.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore du petit bétail poursuivi par des lions est conservée avec sa violence croissante. Le point-virgule distingue les deux étapes historiques sans expliciter davantage que le texte source.
