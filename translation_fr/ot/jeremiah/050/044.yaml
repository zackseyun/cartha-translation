source:
  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤עָה ארוצ/ם מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יוֹעִדֶ֔/נִּי וּ/מִֽי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/044.yaml
  text: Look[a], like a lion he comes up from the thicket of the Jordan against a secure pasture; for in an instant I will make them run from it, and I will appoint over it whoever is chosen. For who is like me[c][b], and who can summon me? What shepherd can stand before me?
translation:
  language: fr
  text: 'Voici : tel un lion, il monte des fourrés du Jourdain[a] vers un pâturage sûr. Car, en un instant, je les en ferai fuir[b], et j’établirai sur lui celui qui sera choisi. En effet, qui est comme moi ? Qui peut me convoquer[c] ? Quel berger peut me faire face ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « de l’orgueil du Jourdain » ; l’expression désigne probablement la végétation dense et luxuriante de ses rives.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je les en chasserai ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Qui peut me fixer un rendez-vous ? » L’hébreu peut évoquer le fait de fixer un moment de rencontre ou de sommer quelqu’un de comparaître.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marqueur discursif qui introduit vivement la scène prophétique ; « Voici » reste digne et courant en français biblique moderne.
- source_word: כְּאַרְיֵה
  choice: tel un lion
  rationale: Rend directement la comparaison tout en conservant un rythme naturel et solennel.
- source_word: יַעֲלֶה
  choice: il monte
  rationale: Le présent donne à la vision prophétique son caractère immédiat ; le verbe conserve le mouvement ascendant exprimé par עלה.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: des fourrés du Jourdain
  rationale: Dans cette expression liée au Jourdain, גָּאוֹן désigne probablement la végétation dense et luxuriante de ses rives, d’où pouvait surgir un lion. Le sens littéral est signalé en note.
- source_word: אֶל נְוֵה אֵיתָן
  choice: vers un pâturage sûr
  rationale: נָוֶה peut désigner le lieu où demeure ou paît un troupeau, et אֵיתָן exprime ici la solidité ou la sécurité. Ce choix maintient l’imagerie pastorale développée à la fin du verset.
- source_word: כִּי אַרְגִּעָה
  choice: Car, en un instant
  rationale: Rend la soudaineté exprimée par la forme verbale de רגע dans cette construction.
- source_word: ארוצם מֵעָלֶיהָ
  choice: je les en ferai fuir
  rationale: Conserve le suffixe pluriel « les » et comprend la forme de רוץ dans un sens causatif ; « en » reprend naturellement le pâturage en français.
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: et j’établirai sur lui celui qui aura été choisi
  rationale: La proposition hébraïque est resserrée. Cette formulation préserve la nuance passive de בָחוּר et le sens de nomination ou d’établissement de פקד, sans identifier le personnage choisi.
- source_word: כִּי מִי כָמוֹנִי
  choice: En effet, qui est comme moi ?
  rationale: Question rhétorique conservée formellement ; « En effet » relie naturellement cette affirmation de l’incomparabilité divine à ce qui précède.
- source_word: וּמִי יוֹעִדֶנִּי
  choice: Qui peut me convoquer ?
  rationale: Le hiphil de יעד peut exprimer l’idée de fixer un rendez-vous ou de convoquer. « Convoquer » garde la force du défi sans préciser excessivement s’il s’agit d’une comparution judiciaire.
- source_word: וּמִי זֶה רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  choice: Quel berger peut tenir devant moi ?
  rationale: Préserve l’image du berger et l’expression « tenir devant », qui évoque ici la capacité de faire face ou de résister.
theological_decisions:
- issue: Rapport entre l’image du lion et la parole divine à la première personne
  choice: Conserver sans explication ajoutée le passage de « il monte » à « je les en ferai fuir » et aux questions divines.
  alternative: Identifier explicitement le lion soit au Seigneur, soit au souverain envahisseur.
  rationale: L’hébreu passe lui-même de la figure du lion à la déclaration divine. Ne pas expliciter son identité préserve la tension prophétique entre l’agent historique du jugement et la souveraineté de Dieu qui agit derrière l’événement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme bref des questions finales est maintenu. L’imagerie cohérente du lion, du pâturage et du berger est conservée, ainsi que les ambiguïtés du texte sur l’identité du lion, le personnage choisi et la portée exacte de la convocation.
