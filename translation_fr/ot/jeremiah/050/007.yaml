  variant: modern international French
source:
  edition: WLC
  text: כָּל מוֹצְאֵי/הֶ֣ם אֲכָל֔וּ/ם וְ/צָרֵי/הֶ֥ם אָמְר֖וּ לֹ֣א נֶאְשָׁ֑ם תַּ֗חַת אֲשֶׁ֨ר חָטְא֤וּ לַֽ/יהוָה֙ נְוֵה צֶ֔דֶק וּ/מִקְוֵ֥ה אֲבֽוֹתֵי/הֶ֖ם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/007.yaml
  text: All who found them devoured them[a], and their adversaries said, “We are not guilty, because they sinned against Yahweh, the habitation of righteousness[b], the hope of their fathers—Yahweh.”
translation:
  language: fr
  text: 'Tous ceux qui les trouvaient les dévoraient, et leurs adversaires disaient : « Nous ne sommes pas coupables, puisqu’ils ont péché contre Yahweh, demeure de justice[a] et espérance de leurs pères[b] — Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pâturage de justice ». Le mot hébreu peut désigner une demeure, un lieu de séjour ou un pâturage.
    reason: lexical_alternative
  - marker: b
    text: Ou « attente de leurs pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצְאֵיהֶם
  choice: tous ceux qui les trouvaient
  rationale: Le participe substantivé désigne quiconque rencontrait le peuple; cette formulation est naturelle en français et conserve la portée générale de כָּל.
- source_word: אֲכָלוּם
  choice: les dévoraient
  rationale: Le sens littéral « les mangeaient » sert ici d’image pour une destruction prédatrice; « dévoraient » restitue cette force métaphorique.
- source_word: צָרֵיהֶם
  choice: leurs adversaires
  rationale: Le terme désigne des personnes hostiles sans se limiter nécessairement à des ennemis militaires.
- source_word: לֹא נֶאְשָׁם
  choice: Nous ne sommes pas coupables
  rationale: La forme à la première personne dans le discours direct exprime la prétention des adversaires à l’innocence.
- source_word: תַּחַת אֲשֶׁר
  choice: puisque
  rationale: La locution introduit le motif avancé par les adversaires pour nier leur culpabilité.
- source_word: חָטְאוּ לַיהוָה
  choice: ils ont péché contre Yahweh
  rationale: Avec חטא, la préposition ל indique ici celui contre qui le péché est commis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent deux fois dans le texte, au lieu de lui substituer un titre.
- source_word: נְוֵה צֶדֶק
  choice: demeure de justice
  rationale: נְוֵה peut désigner une demeure ou un pâturage. « Demeure de justice » convient à l’apposition divine tout en laissant l’autre nuance en note.
- source_word: מִקְוֵה אֲבוֹתֵיהֶם
  choice: espérance de leurs pères
  rationale: מִקְוֵה signifie ici « espérance » ou « attente »; « leurs pères » conserve le lien explicite avec les générations ancestrales.
theological_decisions:
- issue: Référent de נְוֵה צֶדֶק וּמִקְוֵה אֲבוֹתֵיהֶם
  choice: Les deux expressions sont comprises comme des appositions décrivant Yahweh.
  alternative: Comprendre נְוֵה צֶדֶק comme le pays ou le bercail d’Israël.
  rationale: La construction suit immédiatement « Yahweh » et se clôt par la répétition de son nom, ce qui favorise l’interprétation appositionnelle sans supprimer l’imagerie pastorale possible.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom propre divin à deux reprises; sa répétition rhétorique est donc conservée.
translation_notes:
  register: Français international actuel, digne et accessible. L’imparfait rend les actions répétées ou habituelles du contexte. Le tiret conserve la reprise finale et emphatique du nom « Yahweh ».
