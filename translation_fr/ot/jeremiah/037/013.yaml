base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/013.yaml
  text: And when he was at the Benjamin Gate[a], there was a captain of the guard there whose name was Irijah son of Shelemiah, son of Hananiah, and he seized Jeremiah the prophet, saying, “You are deserting to the Chaldeans!”
translation:
  language: fr
  text: 'Comme il se trouvait à la porte de Benjamin, il y avait là un officier chargé de la garde, nommé Yiriya, fils de Shélémia, fils de Hanania. Il saisit le prophète Jérémie en lui disant : « Tu passes du côté des Chaldéens[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tu tombes vers les Chaldéens. » L’expression peut aussi se traduire : « Tu fais défection en faveur des Chaldéens » ou « Tu désertes pour rejoindre les Chaldéens. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: à la porte de Benjamin
  rationale: Le nom commun שַׁעַר suivi de Benjamin désigne ici une porte de la ville; cette formulation française est claire et naturelle.
- source_word: בַּעַל פְּקִדֻת
  choice: un officier de garde
  rationale: L’expression désigne littéralement une personne chargée d’une fonction de surveillance. Le contexte de la porte favorise un responsable de la garde, sans préciser excessivement son grade.
- source_word: יִרְאִיָּה
  choice: Yiriya
  rationale: Translittération française moderne du nom hébreu, qui en reflète les consonnes et la prononciation plus directement que la forme anglaise.
- source_word: וַיִּתְפֹּשׂ
  choice: il saisit
  rationale: Le verbe exprime le fait de mettre la main sur quelqu’un avec force; « saisit » conserve cette action sans introduire explicitement une procédure judiciaire formelle.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Ordre idiomatique en français qui conserve l’apposition et l’identification de Jérémie comme prophète.
- source_word: אֶל הַכַּשְׂדִּים אַתָּה נֹפֵל
  choice: Tu passes du côté des Chaldéens
  rationale: Dans ce contexte militaire et politique, נפל אֶל est une expression signifiant passer à l’ennemi. Cette traduction rend clairement l’accusation tout en conservant « Chaldéens ».
