revisions:
- from: 'Lorsqu’il arriva à la porte de Benjamin, il y avait là un officier de garde nommé Yiriya, fils de Shélémia, fils de Hanania. Il saisit le prophète Jérémie en l’accusant : « Tu passes du côté des Chaldéens[a] ! »'
  to: 'Comme il se trouvait à la porte de Benjamin, il y avait là un officier chargé de la garde, nommé Yiriya, fils de Shélémia, fils de Hanania. Il saisit le prophète Jérémie en lui disant : « Tu passes du côté des Chaldéens[a] ! »'
  rationale: La révision élimine l’implication non nécessaire d’une arrivée et rend plus précisément la fonction de בעל פקדות comme responsable de la garde. Elle conserve tous les choix terminologiques essentiels, l’ambiguïté lexicale documentée en note, et le sens accusateur de l’énoncé sans ajouter une qualification procédurale.
