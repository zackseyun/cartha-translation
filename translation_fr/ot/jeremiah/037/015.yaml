  source_fidelity: La causalité ajoutée par « le firent mettre » ne correspond pas directement à ונתנו (« ils le mirent/placèrent »). Le lieu est explicitement désigné comme une « maison de détention », puis identifié comme la maison de Jonathan. Le nom hébreu est bien Jonathan dans l’usage français courant, et « scribe » rend sobrement הסופר sans réduire indûment la fonction à celle d’un secrétaire moderne.
  naturalness: « Les dignitaires s’irritèrent contre Jérémie » est idiomatique, narratif et rend la vive colère. « Maison de détention » conserve l’expression concrète du texte tout en restant intelligible en français moderne.
  terminology: '« Dignitaires » convient à שרים dans un contexte de cour et évite à la fois l’idée dynastique de « princes » et la précision administrative excessive de « hauts fonctionnaires ». « Scribe » est préférable à « secrétaire », qui interprète la fonction. La note proposée ne doit pas être maintenue : elle présente le rendu source (« scribe ») comme une simple variante alors que le texte principal retenait l’interprétation « secrétaire ».'
