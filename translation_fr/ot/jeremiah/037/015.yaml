  text: וַ/יִּקְצְפ֧וּ הַ/שָּׂרִ֛ים עַֽל יִרְמְיָ֖הוּ וְ/הִכּ֣וּ אֹת֑/וֹ וְ/נָתְנ֨וּ אוֹת֜/וֹ בֵּ֣ית הָ/אֵס֗וּר בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר כִּֽי אֹת֥/וֹ עָשׂ֖וּ לְ/בֵ֥ית הַ/כֶּֽלֶא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/015.yaml
  text: And the officials were enraged at Jeremiah[a], and they beat him and put him in the prison house, in the house of Jehonathan the scribe[b], for they had made it a prison.
translation:
  language: fr
  text: Les dignitaires s’irritèrent contre Jérémie, le frappèrent et le mirent dans la maison de détention, la maison de Jonathan le scribe, car ils en avaient fait une prison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְצְפוּ
  choice: furieux
  rationale: Le verbe קצף exprime une vive colère. La tournure « furieux contre » en restitue naturellement l’intensité en français.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Dans ce contexte politique et judiciaire, שׂרים désigne les dignitaires ou responsables du royaume, non nécessairement des princes de sang royal.
- source_word: וְהִכּוּ אֹתוֹ
  choice: le frappèrent
  rationale: נכה signifie frapper et peut désigner des coups infligés comme mauvais traitement. « Le frappèrent » reste proche du texte sans préciser indûment le nombre de coups.
- source_word: וְנָתְנוּ אֹתוֹ בֵּית הָאֵסוּר
  choice: le firent mettre en prison
  rationale: Littéralement, ils le « mirent dans la maison de détention ». Cette formulation française actuelle exprime clairement l’incarcération tout en permettant à la suite d’identifier le bâtiment.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: dans la maison de Jonathan, le secrétaire
  rationale: La seconde occurrence de « maison » identifie le lieu de détention. יְהוֹנָתָן correspond à Jonathan en français biblique courant, et סֹפֵר peut désigner ici un secrétaire administratif.
- source_word: כִּי אֹתוֹ עָשׂוּ לְבֵית הַכֶּלֶא
  choice: car ils en avaient fait une prison
  rationale: כִּי introduit l’explication, tandis que עשה ל־ indique que la maison avait été transformée ou affectée à cet usage avant l’incarcération de Jérémie.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Hauts fonctionnaires » évite l’ambiguïté moderne de « princes »; « secrétaire » rend la fonction probable de סֹפֵר, avec l’équivalent traditionnel « scribe » en note. Le nom יְהוֹנָתָן est rendu par la forme française usuelle « Jonathan ».
