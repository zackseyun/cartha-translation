id: JER.37.2
reference: Jeremiah 37:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֥א שָׁמַ֛ע ה֥וּא וַ/עֲבָדָ֖י/ו וְ/עַ֣ם הָ/אָ֑רֶץ אֶל דִּבְרֵ֣י יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/002.yaml
  text: But he and his servants and the people of the land did not listen to the words of Yahweh that he spoke through Jeremiah the prophet[a][b][c].
translation:
  language: fr
  text: Mais ni lui, ni ses serviteurs, ni le peuple du pays[b] n’écoutèrent[a] les paroles de Yahweh, qu’il avait prononcées par l’intermédiaire du prophète Jérémie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’obéirent pas aux paroles de Yahweh ». Le verbe hébreu peut signifier « entendre », « écouter » ou, par implication, « obéir ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le peuple du pays »; cette expression peut désigner largement la population ou les gens du commun.
    reason: cultural_note
  - marker: c
    text: Littéralement « par la main du prophète Jérémie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Mais … n’écoutèrent pas
  rationale: Le waw prend ici naturellement une nuance adversative dans la continuité du récit. שׁמע exprime l’écoute attentive et peut impliquer l’obéissance; « écouter » conserve cette amplitude sans expliciter trop fortement « obéir ».
- source_word: הוּא וַעֲבָדָיו
  choice: ni lui, ni ses serviteurs
  rationale: La construction négative française avec « ni… ni… » coordonne clairement les groupes. « Serviteurs » conserve le terme large, qui peut désigner les agents ou dignitaires royaux.
- source_word: וְעַם הָאָרֶץ
  choice: ni le peuple du pays
  rationale: Cette traduction garde l’expression hébraïque transparente, tout en signalant en note qu’elle peut désigner plus largement la population ou les gens du commun.
- source_word: דִּבְרֵי יְהוָה
  choice: les paroles de Yahweh
  rationale: Le pluriel דִּבְרֵי est rendu par « paroles », et le tétragramme est translittéré « Yahweh » comme nom propre.
- source_word: אֲשֶׁר דִּבֶּר
  choice: qu’il avait prononcées
  rationale: Le plus-que-parfait situe naturellement en français les paroles divines antérieurement transmises; « prononcer » évite la répétition maladroite de « paroles… parlées ».
- source_word: בְּיַד יִרְמְיָהוּ הַנָּבִיא
  choice: par l’intermédiaire du prophète Jérémie
  rationale: L’idiome littéral « par la main de » marque ici l’intermédiaire ou l’agent de la transmission prophétique. La formulation choisie en donne le sens en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom divin. « Yahweh » préserve ce nom au lieu de lui substituer un titre.
- issue: Portée de שׁמע face à la parole prophétique
  choice: n’écoutèrent pas
  alternative: n’obéirent pas
  rationale: Le contexte implique le refus de tenir compte de la parole, mais le verbe garde les nuances d’entendre, d’écouter et, par implication, d’obéir. Le texte principal conserve cette tension; la note donne l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination « ni lui, ni ses serviteurs, ni le peuple » rend idiomatiquement la négation portant sur les trois groupes. Les notes préservent l’ambiguïté de שׁמע et l’image hébraïque de l’intermédiaire prophétique.
