  - severity: low
    issue: Ordre de l’adresse royale
    rationale: « ô roi, mon seigneur » est compréhensible, mais « mon seigneur le roi » est plus naturel en français et reproduit plus directement l’appellation אֲדֹנִי הַמֶּלֶךְ.
