translation_notes:
  register: Français moderne, respectueux et pressant, adapté à une supplique adressée au roi. Le tutoiement suit l’adresse directe de l’hébreu sans diminuer la déférence, explicitement portée par « ô roi, mon seigneur » et « daigne ».
