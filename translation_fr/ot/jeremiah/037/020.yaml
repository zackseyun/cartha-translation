  text: וְ/עַתָּ֕ה שְֽׁמַֽע נָ֖א אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ תִּפָּל נָ֤א תְחִנָּתִ/י֙ לְ/פָנֶ֔י/ךָ וְ/אַל תְּשִׁבֵ֗/נִי בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר וְ/לֹ֥א אָמ֖וּת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/020.yaml
  text: So now[a], please hear, my lord the king; please let my plea fall before you, and do not send me back to the house of Jehonathan the scribe, lest I die there.
translation:
  language: fr
  text: Maintenant donc, je t’en prie, écoute-moi, mon seigneur le roi ! Daigne accueillir ma supplication[a] et ne me renvoie pas dans la maison de Yehonatân, le scribe, de peur que je n’y meure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que ma supplication tombe devant toi. » Il s’agit d’une expression hébraïque désignant la présentation d’une requête à un supérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Marque la transition vers un appel pressant tout en conservant la valeur connective de וְ.
- source_word: שְׁמַע נָא
  choice: je t’en prie, écoute-moi
  rationale: L’impératif שׁמע accompagné de נָא exprime ici une demande à la fois respectueuse et urgente ; cette formulation est naturelle en français moderne.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ô roi, mon seigneur
  rationale: Conserve le titre royal et l’appellation honorifique dans une forme française digne convenant à une adresse directe.
- source_word: תִּפָּל נָא תְחִנָּתִי לְפָנֶיךָ
  choice: Daigne accueillir ma supplication
  rationale: Rend naturellement l’expression idiomatique hébraïque selon laquelle une requête « tombe devant » un supérieur, tout en signalant le sens littéral en note.
- source_word: וְאַל תְּשִׁיבֵנִי
  choice: ne me renvoie pas
  rationale: Le hiphil de שׁוב est causatif ; « renvoyer » exprime naturellement le fait de faire retourner Jérémie à son lieu de détention.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: la maison de Yehonatân, le secrétaire
  rationale: « Maison » respecte בֵּית, tandis que « secrétaire » rend la fonction administrative probable de הַסֹּפֵר dans ce contexte royal. La forme Yehonatân reflète précisément le nom hébreu.
- source_word: וְלֹא אָמוּת שָׁם
  choice: de peur que je n’y meure
  rationale: La proposition coordonnée exprime le résultat redouté qui motive la demande ; cette tournure française en restitue clairement la force.
