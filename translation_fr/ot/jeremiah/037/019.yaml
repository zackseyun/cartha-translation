base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/019.yaml
  text: And where are your prophets who prophesied to you[a], saying, ‘The king of Babylon will not come against you or against this land’?”
translation:
  language: fr
  text: 'Et où sont vos prophètes, ceux qui vous ont prophétisé : « Le roi de Babylone ne viendra ni contre vous ni contre ce pays[a] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « sur vous ni sur ce pays ». Dans ce contexte d’avance militaire, la préposition hébraïque a probablement le sens de « contre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Et où sont
  rationale: La conjonction relie la question au contexte précédent, tandis que l’interrogatif introduit une contestation rhétorique appuyée.
- source_word: נְבִיאֵיכֶם
  choice: vos prophètes
  rationale: Rend directement le pluriel avec suffixe de deuxième personne du masculin pluriel.
- source_word: אֲשֶׁר נִבְּאוּ לָכֶם
  choice: ceux qui vous prophétisaient
  rationale: L’imparfait français présente leur activité prophétique passée et répétée dans le contexte, sans la réduire à une seule déclaration.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français courant, les deux-points introduisent naturellement le contenu des paroles et évitent le calque plus lourd « en disant ».
- source_word: לֹא יָבֹא
  choice: ne viendra ni… ni…
  rationale: Le futur rend la prédiction exprimée par l’inaccompli hébreu; la construction négative corrélative est naturelle en français devant les deux compléments coordonnés.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Rend clairement et traditionnellement la chaîne construite hébraïque.
- source_word: עֲלֵיכֶם
  choice: contre vous
  rationale: Avec un verbe de venue dans ce contexte militaire, עַל indique vraisemblablement un mouvement hostile.
- source_word: וְעַל הָאָרֶץ הַזֹּאת
  choice: ni contre ce pays
  rationale: Sous la portée de la négation, « ni… ni… » exprime naturellement en français la coordination hébraïque; « ce pays » convient ici au territoire visé.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et directement compréhensible. La question rhétorique conserve son mordant. La formulation « ni contre vous ni contre ce pays » rend idiomatiquement la coordination placée sous la négation.
