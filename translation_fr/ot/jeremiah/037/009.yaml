base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/009.yaml
  text: 'Thus says Yahweh: Do not deceive yourselves[a], saying[c][b], ‘The Chaldeans will surely go away from us,’ for they will not go away.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh : « Ne vous faites pas d’illusions[a] en vous disant : “Les Chaldéens[b] vont certainement s’éloigner de nous[c]”, car ils ne s’éloigneront pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne vous trompez pas vous-mêmes. » L’hébreu parle littéralement d’eux-mêmes, mais l’expression met ici en garde contre l’illusion et les faux espoirs.'
    reason: lexical_alternative
  - marker: b
    text: Les « Chaldéens » désignent ici les forces babyloniennes.
    reason: cultural_note
  - marker: c
    text: 'Ou : « vont bel et bien s’éloigner de nous ». L’hébreu renforce le verbe au moyen d’un infinitif absolu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française naturelle conserve la formule prophétique de messager et rend le tétragramme par le nom personnel « Yahweh ».
- source_word: אַל תַּשִּׁיאוּ נַפְשֹׁתֵיכֶם
  choice: Ne vous trompez pas vous-mêmes
  rationale: L’expression hébraïque, qui mentionne littéralement les « personnes/âmes », dénonce ici l’illusion entretenue par les destinataires eux-mêmes.
- source_word: לֵאמֹר
  choice: en vous disant
  rationale: La tournure introduit le contenu précis de leur illusion et s’intègre naturellement à l’expression française de la tromperie envers soi-même.
- source_word: הָלֹךְ יֵלְכוּ
  choice: vont bel et bien s’éloigner
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’affirmation ; « bel et bien » en restitue l’assurance emphatique.
- source_word: מֵעָלֵינוּ
  choice: de nous
  rationale: Dans ce contexte militaire, la préposition exprime le mouvement par lequel les forces ennemies cesseraient de peser sur Juda et s’en éloigneraient.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le terme historique précis du texte est conservé plutôt que remplacé dans le corps du verset par « Babyloniens ».
- source_word: כִּי לֹא יֵלֵכוּ
  choice: car ils ne s’éloigneront pas
  rationale: « Car » conserve la relation explicative, tandis que la répétition de « s’éloigner » maintient le contraste rhétorique du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les guillemets emboîtés distinguent la parole prophétique de la pensée citée. « Bel et bien » rend l’emphase sans alourdir la phrase, et « Chaldéens » préserve la désignation historique du texte source.
