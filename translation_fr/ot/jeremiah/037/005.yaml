  text: וְ/חֵ֥יל פַּרְעֹ֖ה יָצָ֣א מִ/מִּצְרָ֑יִם וַ/יִּשְׁמְע֨וּ הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עַל יְרוּשָׁלִַ֨ם֙ אֶת שִׁמְעָ֔/ם וַ/יֵּ֣עָל֔וּ מֵ/עַ֖ל יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/005.yaml
  text: Pharaoh’s army had come out from Egypt[a], and when the Chaldeans who were besieging Jerusalem heard the report about them[c][b], they withdrew from Jerusalem.
translation:
  language: fr
  text: L’armée du pharaon était sortie d’Égypte. Lorsque les Chaldéens[a] qui assiégeaient Jérusalem apprirent la nouvelle concernant l’armée du pharaon[b], ils levèrent le siège de Jérusalem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Babyloniens ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « entendirent leur nouvelle », c’est-à-dire la nouvelle concernant les forces du pharaon.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ils montèrent de dessus Jérusalem » ; dans ce contexte, cette expression signifie qu’ils se retirèrent de la ville qu’ils assiégeaient.
    reason: idiom_explanation
lexical_decisions:
- source_word: חֵיל פַּרְעֹה
  choice: l’armée du pharaon
  rationale: Dans ce contexte militaire, חֵיל désigne les forces armées du pharaon. « L’armée » est clair et naturel en français moderne.
- source_word: יָצָא מִמִּצְרָיִם
  choice: était sortie d’Égypte
  rationale: Le plus-que-parfait présente cette sortie comme la situation antérieure qui provoque les actions suivantes du récit.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: « Chaldéens » rend directement l’ethnonyme hébreu; « Babyloniens » est une équivalence contextuelle possible.
- source_word: הַצָּרִים עַל יְרוּשָׁלַם
  choice: qui assiégeaient Jérusalem
  rationale: Le participe de צור décrit ici une action militaire continue contre une ville, à savoir son siège.
- source_word: אֶת שִׁמְעָם
  choice: la nouvelle à son sujet
  rationale: שֵׁמַע signifie « nouvelle, information, rapport ». Le suffixe masculin pluriel renvoie aux forces du pharaon; en français, le pronom singulier s’accorde naturellement avec le collectif « armée ».
- source_word: וַיֵּעָלוּ מֵעַל יְרוּשָׁלָם
  choice: ils levèrent le siège de Jérusalem
  rationale: L’expression signifie littéralement qu’ils « montèrent de dessus/contre Jérusalem »; dans ce contexte, elle indique que les assiégeants se sont retirés et ont interrompu le siège.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait établit l’arrière-plan narratif; « levèrent le siège » restitue naturellement l’idiome militaire sans ajouter de précision théologique.
