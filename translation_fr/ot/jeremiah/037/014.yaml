source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִרְמְיָ֜הוּ שֶׁ֗קֶר אֵינֶ֤/נִּי נֹפֵל֙ עַל הַ/כַּשְׂדִּ֔ים וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑י/ו וַ/יִּתְפֹּ֤שׂ יִרְאִיָּיה֙ בְּ/יִרְמְיָ֔הוּ וַ/יְבִאֵ֖/הוּ אֶל הַ/שָּׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/014.yaml
  text: But Jeremiah said[a], “That is a lie; I am not defecting to the Chaldeans.” But he would not listen to him[c][b], and Irijah seized Jeremiah and brought him to the officials.
translation:
  language: fr
  text: 'Mais Jérémie répondit : « C’est faux ! Je ne passe pas du côté des Chaldéens[a]. » Yiriya ne voulut pas l’écouter ; il saisit Jérémie et le conduisit auprès des hauts fonctionnaires[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je ne fais pas défection au profit des Chaldéens ». Les « Chaldéens » désignent ici les forces babyloniennes.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Ou « des chefs » ; le terme hébreu peut désigner des dirigeants ou de hauts responsables.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: C’est faux !
  rationale: Rend naturellement en français moderne la réfutation exclamative et vigoureuse de Jérémie, sans introduire explicitement l’idée d’un mensonge délibéré.
- source_word: אֵינֶנִּי נֹפֵל עַל הַכַּשְׂדִּים
  choice: Je ne passe pas du côté des Chaldéens
  rationale: Dans ce contexte militaire, נפל על désigne le fait de passer dans le camp adverse. Cette formulation conserve le mouvement figuré de l’hébreu et laisse la note expliciter l’idée de défection.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Conserve le terme ethnopolitique hébreu, courant dans Jérémie, plutôt que de le remplacer dans le texte par son référent contextuel, les Babyloniens.
- source_word: וְלֹא שָׁמַע אֵלָיו
  choice: Yiriya ne voulut pas l’écouter
  rationale: Le contexte indique un refus de tenir compte de la dénégation, et non une simple absence d’audition. Le nom du sujet est répété pour éviter toute ambiguïté pronominale en français.
- source_word: וַיִּתְפֹּשׂ
  choice: il saisit
  rationale: Exprime l’appréhension par la force sans ajouter la nuance juridique plus précise de « arrêter ».
- source_word: וַיְבִאֵהוּ אֶל
  choice: le conduisit auprès de
  rationale: Formulation française naturelle pour l’action d’amener Jérémie devant les autorités.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Le terme désigne ici des autorités dirigeantes. « Hauts fonctionnaires » est actuel et évite le sens dynastique trompeur que pourrait suggérer « princes ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La ponctuation souligne la vigueur de la dénégation. « Yiriya » translittère יִרְאִיָּיה sans passer par la forme anglaise Irijah. Les marqueurs de note sont placés immédiatement après les expressions concernées.
