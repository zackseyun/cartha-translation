source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/006.yaml
  text: Then the word of Yahweh came to Jeremiah the prophet[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh fut adressée au prophète Jérémie en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors … fut adressée
  rationale: Le wayyiqtol fait avancer le récit. En français moderne, « Alors » marque naturellement la succession, tandis que la tournure « la parole fut adressée » rend idiomatiquement la venue de la parole.
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « la parole » conserve l’expression biblique reconnue et la notion de révélation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: אֶל
  choice: à
  rationale: La destination de la parole est intégrée à la locution française « être adressé à ».
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française usuelle du nom du prophète.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: « Prophète » est l’équivalent direct de נָבִיא; l’article est conservé dans l’apposition antéposée « au prophète Jérémie ».
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette expression introduit naturellement en français le contenu du discours divin donné au verset suivant, sans le calque peu idiomatique « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » le présente comme nom personnel et évite de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et fluide. La formule prophétique reste reconnaissable, avec une syntaxe française naturelle. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
