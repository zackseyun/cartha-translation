base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/017.yaml
  text: Then King Zedekiah sent and had him brought[a], and the king questioned him privately in his house, and said, “Is there any word from Yahweh?” Jeremiah said, “There is.” Then he said[b], “You will be given into the hand of the king of Babylon.”
translation:
  language: fr
  text: 'Alors le roi Sédécias envoya chercher Jérémie et se le fit amener. Dans sa maison, le roi l’interrogea en secret[a] : « Y a-t-il une parole de la part de Yahweh ? » Jérémie répondit : « Il y en a une. » Jérémie ajouta : « Tu seras livré entre les mains[b] du roi de Babylone. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en privé ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la main », expression hébraïque signifiant « au pouvoir de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקָּחֵהוּ
  choice: envoya chercher Jérémie et se le fit amener
  rationale: Cette formulation naturelle en français conserve la succession des deux verbes hébreux tout en indiquant que le roi fait venir Jérémie plutôt que de le saisir personnellement.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: l’interrogea
  rationale: Le verbe signifie « demander, interroger ». « L’interrogea » convient à cet entretien royal et introduit naturellement la question directe.
- source_word: בְּבֵיתוֹ
  choice: dans sa résidence
  rationale: בַּיִת signifie littéralement « maison », mais peut désigner la demeure royale. « Résidence » reste sobre et compréhensible sans imposer le terme plus interprétatif « palais ».
- source_word: בַּסֵּתֶר
  choice: en secret
  rationale: La locution exprime le caractère secret ou caché de l’entretien. « En secret » est naturel et plus proche de la forme hébraïque que « en privé ».
- source_word: הֲיֵשׁ דָּבָר מֵאֵת יְהוָה
  choice: Y a-t-il une parole de la part de Yahweh ?
  rationale: « Parole » préserve le vocabulaire prophétique de דָּבָר, tandis que « de la part de » rend explicitement la provenance indiquée par מֵאֵת.
- source_word: יֵשׁ
  choice: Il y en a une
  rationale: La réponse hébraïque est très brève, littéralement « il y en a ». Cette formulation française conserve sa concision et reprend clairement « une parole ».
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: entre les mains du roi de Babylone
  rationale: L’expression française rend naturellement l’image idiomatique hébraïque de la remise au pouvoir d’une personne. Le pluriel est celui de l’idiome français, tandis que la forme littérale est signalée en note.
- source_word: תִּנָּתֵן
  choice: tu seras livré
  rationale: Le nifal exprime ici un passif. « Être livré » rend clairement la remise de Sédécias au pouvoir du roi de Babylone sans préciser un agent absent de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Agent implicite de תִּנָּתֵן
  choice: 'forme passive sans agent : « tu seras livré »'
  alternative: « Dieu te livrera »
  rationale: L’hébreu ne nomme pas l’agent. La traduction conserve cette indétermination au lieu d’expliciter théologiquement qui livrera Sédécias.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe narrative reste fluide, la réponse de Jérémie demeure volontairement concise, et l’idiome hébreu est conservé sous une forme française naturelle avec une note explicative.
