  text: וְ/הָיָ֗ה בְּ/הֵֽעָלוֹת֙ חֵ֣יל הַ/כַּשְׂדִּ֔ים מֵ/עַ֖ל יְרֽוּשָׁלִָ֑ם מִ/פְּנֵ֖י חֵ֥יל פַּרְעֹֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/011.yaml
  text: When the army of the Chaldeans had gone up from Jerusalem because of Pharaoh’s army,[a]
translation:
  language: fr
  text: Lorsque l’armée des Chaldéens se fut retirée de Jérusalem devant l’armée du pharaon,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque l’armée des Chaldéens se fut éloignée de Jérusalem » ; dans ce contexte, il s’agit de la levée du siège et du retrait de l’armée devant celle du pharaon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Lorsque
  rationale: La formule narrative introduit ici la circonstance temporelle liée à l’infinitif suivant. En français actuel, « Lorsque » assure naturellement cette transition sans reprendre une formule archaïque comme « il arriva que ».
- source_word: בְּהֵעָלוֹת
  choice: se fut retirée
  rationale: L’infinitif construit de עלה avec ב indique le moment de l’action. Avec מֵעַל (« de dessus, loin de ») et dans le contexte d’un siège, il décrit la levée du dispositif militaire et le retrait de l’armée. Le plus-que-parfait du subjonctif convient à la proposition temporelle antérieure dans ce fragment.
- source_word: חֵיל
  choice: armée
  rationale: Dans ce contexte, חֵיל désigne une force militaire organisée ; « armée » est le terme français courant et précis.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Cette traduction conserve directement l’ethnonyme hébreu plutôt que de le remplacer par l’explication historique « Babyloniens ».
- source_word: מֵעַל יְרוּשָׁלִָם
  choice: de Jérusalem
  rationale: L’expression signifie littéralement « de dessus Jérusalem » et, dans le contexte du siège, indique que l’armée s’est éloignée de ses positions autour de la ville.
- source_word: מִפְּנֵי
  choice: devant
  rationale: מִפְּנֵי peut exprimer le retrait face à une menace. « Devant l’armée du pharaon » préserve à la fois l’image spatiale et l’idée causale, sans préciser au-delà de l’hébreu si l’armée égyptienne était déjà arrivée au contact.
- source_word: חֵיל פַּרְעֹה
  choice: l’armée du pharaon
  rationale: Le rapport construit exprime ici l’appartenance. En français, « l’armée du pharaon » est naturel et conserve le titre comme nom commun.
