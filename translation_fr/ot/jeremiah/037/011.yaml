translation_notes:
  register: Français international moderne, digne et accessible. Le verset reste un fragment syntaxique, comme dans le texte source, puisqu’il introduit l’action poursuivie au verset suivant. « Se fut retirée » explicite sobrement l’emploi militaire contextuel de עלה מֵעַל, tandis que la note conserve une formulation plus proche du mouvement exprimé.
