  text: וְ/יִרְמְיָ֕הוּ בָּ֥א וְ/יֹצֵ֖א בְּ/ת֣וֹךְ הָ/עָ֑ם וְ/לֹֽא נָתְנ֥וּ אֹת֖/וֹ בֵּ֥ית ה/כליא־׃
