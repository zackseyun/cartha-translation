  yaml_path: translation/ot/jeremiah/037/004.yaml
  text: Jeremiah was coming and going among the people[a], for they had not yet put him in the prison house.
translation:
  language: fr
  text: Jérémie allait et venait parmi le peuple, car ils ne l’avaient pas mis en prison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la maison de détention ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא וְיֹצֵא
  choice: allait et venait
  rationale: Cette expression idiomatique rend le mouvement libre et habituel de Jérémie tout en conservant la tournure concrète de l’hébreu.
- source_word: בְּתוֹךְ הָעָם
  choice: parmi le peuple
  rationale: Rend naturellement « au milieu de » et indique que Jérémie circulait librement au sein de la population.
- source_word: וְלֹא נָתְנוּ אֹתוֹ
  choice: car ils ne l’avaient pas encore mis
  rationale: Le plus-que-parfait situe l’emprisonnement non réalisé avant la scène décrite. « Car » explicite la valeur explicative possible de la conjonction, tandis que « encore » exprime naturellement que cette détention n’avait pas eu lieu à ce stade du récit.
- source_word: בֵּית הַכְּלִיא
  choice: en prison
  rationale: Formulation française actuelle et naturelle pour l’expression littérale « maison de détention » ; la forme concrète de l’hébreu est signalée en note.
- source_word: וְיִרְמְיָהוּ
  choice: Jérémie
  rationale: La conjonction narrative hébraïque n’exige pas ici l’ajout français de « Or » ou « Maintenant ».
