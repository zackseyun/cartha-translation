  yaml_path: translation/ot/jeremiah/037/012.yaml
  text: Jeremiah went out from Jerusalem to go to the land of Benjamin[a], to receive his portion there among the people.
translation:
  language: fr
  text: Jérémie sortit de Jérusalem pour se rendre dans le territoire de Benjamin, afin d’y obtenir sa part[a], parmi le peuple, provenant de là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « afin d’y réclamer une part ». Le sens de l’infinitif hébreu לַחֲלִק est incertain : il peut être question de recevoir une part attribuée, de partager des biens ou de revendiquer une part.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא exprime couramment le fait de sortir ou de partir d’un lieu. « Sortit de Jérusalem » conserve ici le mouvement indiqué sans ajouter de nuance.
- source_word: מִירוּשָׁלִַם
  choice: de Jérusalem
  rationale: La préposition מִן marque l’éloignement depuis la ville.
- source_word: לָלֶכֶת
  choice: pour se rendre
  rationale: L’infinitif de הלך indique le but. « Se rendre » est plus naturel en français que la répétition « sortir… pour aller », tout en gardant le sens.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: le territoire de Benjamin
  rationale: אֶרֶץ désigne ici la région associée à Benjamin. « Territoire » rend clairement ce sens régional et tribal en français moderne.
- source_word: לַחֲלִק
  choice: afin d’y recevoir sa part
  rationale: Cet infinitif de חלק est difficile. Dans ce contexte, il paraît désigner l’obtention d’une part, mais peut aussi évoquer le partage ou la revendication d’une part; la note préserve cette incertitude.
- source_word: מִשָּׁם
  choice: y
  rationale: Dans une formulation française naturelle, « y » reprend le territoire de Benjamin et rend la valeur locale de מִשָּׁם sans le calque maladroit « de là ».
- source_word: בְּתוֹךְ הָעָם
  choice: parmi le peuple
  rationale: La locution signifie littéralement « au milieu du peuple ». « Parmi le peuple » reste naturel et évite de préciser sans nécessité qu’il s’agirait de troupes.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe évite une répétition pesante tout en conservant le mouvement depuis Jérusalem et le but du déplacement. L’ambiguïté du verbe חלק est explicitement maintenue en note.
