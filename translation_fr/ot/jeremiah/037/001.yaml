  text: וַ/יִּ֨מְלָךְ מֶ֔לֶךְ צִדְקִיָּ֖הוּ בֶּן יֹֽאשִׁיָּ֑הוּ תַּ֗חַת כָּנְיָ֨הוּ֙ בֶּן יְה֣וֹיָקִ֔ים אֲשֶׁ֥ר הִמְלִ֛יךְ נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/001.yaml
  text: And King Zedekiah son of Josiah reigned in place of Coniah son of Jehoiakim[b][a], whom Nebuchadnezzar king of Babylon had made king in the land of Judah.
translation:
  language: fr
  text: Le roi Sédécias, fils de Josias, régna à la place de Konia, fils de Joïakim[a], que Nabuchodonosor[b], roi de Babylone, avait établi roi dans le pays de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici « Konia », également appelé « Jéconias » ailleurs.
    reason: alternative_reading
  - marker: b
    text: La graphie hébraïque de ce verset correspond plus précisément à « Nabuchadrezzar » ; la forme française habituelle est « Nabuchodonosor ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלָךְ
  choice: régna
  rationale: Le verbe מלך dans cette forme narrative décrit l’accession ou le règne; « régna » conserve la formulation historique concise du texte.
- source_word: מֶלֶךְ צִדְקִיָּהוּ
  choice: le roi Sédécias
  rationale: Le titre royal et le nom propre sont rendus selon l’usage français courant.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: fils de Josias
  rationale: La désignation filiale est conservée directement.
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans ce contexte de succession, le terme exprime le remplacement d’un roi par un autre.
- source_word: כָּנְיָהוּ
  choice: Konia
  rationale: Cette forme suit le nom hébreu présent dans le verset sans l’harmoniser avec la forme plus connue « Jéconias »; cette dernière est signalée en note.
- source_word: בֶּן יְהוֹיָקִים
  choice: fils de Joïakim
  rationale: La filiation est rendue littéralement, avec la forme française usuelle du nom.
- source_word: אֲשֶׁר הִמְלִיךְ
  choice: l’avait établi roi
  rationale: Le hiphil de מלך est causatif (« faire roi »). Le plus-que-parfait marque naturellement l’antériorité de cette action par rapport au règne de Sédécias.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: La forme française traditionnelle et immédiatement reconnaissable est retenue; la graphie plus proche de l’hébreu de ce verset est indiquée en note.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Le groupe construit hébreu est rendu directement.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: Cette formulation reproduit explicitement le substantif אֶרֶץ et la préposition ב sans ajouter l’idée de domination contenue dans « sur ».
