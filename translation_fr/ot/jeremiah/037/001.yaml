  register: Français international moderne, digne et accessible. La syntaxe est divisée en deux phrases afin d’éviter une relative lourde et ambiguë, tout en maintenant clairement que le pronom « l’ » renvoie à Sédécias. Les noms suivent les formes françaises usuelles, sauf Konia, conservé conformément à la forme hébraïque propre à ce verset.
