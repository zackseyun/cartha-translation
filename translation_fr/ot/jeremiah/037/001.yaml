  - severity: low
    issue: Graphie alternative de Nabuchodonosor à normaliser dans la note.
    rationale: « Nabuchadrezzar » est une translittération française couramment employée pour refléter plus étroitement la forme hébraïque נְבוּכַדְרֶאצַּר; « Nabuchodreççar » est moins usuelle et peut déconcerter.
