  source_fidelity: 'Le sens est fidèlement rendu : Sédécias envoie les deux hommes à Jérémie afin de solliciter son intercession auprès de Yahweh. Les noms, les relations filiales et l’identification de Sophonie comme prêtre sont adéquats. Toutefois, « Prie … Yahweh notre Dieu pour nous » place de façon peu idiomatique en français le destinataire de la prière et exige une ponctuation appositive.'
