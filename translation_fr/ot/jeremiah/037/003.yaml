  text: וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ אֶת יְהוּכַ֣ל בֶּן שֶֽׁלֶמְיָ֗ה וְ/אֶת צְפַנְיָ֤הוּ בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר הִתְפַּלֶּל נָ֣א בַעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/003.yaml
  text: Then King Zedekiah sent Jehucal son of Shelemiah and Zephaniah son of Maaseiah the priest to Jeremiah the prophet[a], saying, “Please pray to Yahweh our God for us.”
translation:
  language: fr
  text: 'Alors le roi Sédécias envoya Yehoukal[a], fils de Shélémia, et le prêtre Sophonie, fils de Maaséya, auprès du prophète Jérémie, avec ce message : « Prie, je t’en prie, pour nous auprès de Yahweh, notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu Yehoukal ; le même homme est appelé Youkal, forme abrégée du nom, en Jérémie 38.1.
    reason: Variante du nom propre dans le texte hébreu de Jérémie.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors … envoya
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession narrative en français.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: le roi Sédécias
  rationale: Forme française courante et idiomatique du titre suivi du nom propre.
- source_word: יְהוּכַל
  choice: Yehoukal
  rationale: Transcription française proche de la forme hébraïque complète du nom dans ce verset; la forme abrégée « Youkal » est signalée en note.
- source_word: בֶּן שֶׁלֶמְיָה
  choice: fils de Shélémia
  rationale: La relation filiale est rendue directement, dans un français naturel.
- source_word: צְפַנְיָהוּ בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: le prêtre Sophonie, fils de Maaséya
  rationale: Dans le contexte de Jérémie, le titre désigne le plus naturellement Sophonie. L’antéposition de « le prêtre » évite qu’en français le titre paraisse modifier Maaséya.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: auprès du prophète Jérémie
  rationale: « Auprès de » convient au déplacement de messagers vers une personne; l’ordre titre-nom est naturel en français.
- source_word: לֵאמֹר
  choice: 'avec ce message :'
  rationale: Cette tournure française introduit clairement et naturellement le discours direct sans ajouter de contenu.
- source_word: הִתְפַּלֶּל נָא
  choice: Prie, je t’en prie
  rationale: L’impératif rend l’appel à prier, tandis que « je t’en prie » restitue la nuance de demande de נָא sans durcir le ton.
- source_word: בַעֲדֵנוּ
  choice: pour nous
  rationale: Rend simplement l’idée d’intercession en faveur des locuteurs.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh notre Dieu
  rationale: Le nom divin est transcrit comme nom propre, et le suffixe possessif de אֱלֹהֵינוּ est pleinement conservé.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme comme nom divin. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Identification de « le prêtre » dans צְפַנְיָהוּ בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: Le titre qualifie Sophonie
  alternative: Le titre qualifie Maaséya
  rationale: La construction peut sembler localement ouverte en raison de la proximité de Maaséya, mais les occurrences parallèles de Sophonie fils de Maaséya dans Jérémie l’identifient comme prêtre. La formulation française explicite cette lecture contextuellement forte.
translation_notes:
  register: Français international moderne, clair et digne. Les noms bibliques français bien établis « Sédécias », « Sophonie » et « Jérémie » sont conservés; les noms moins stabilisés sont transcrits de près. La demande demeure respectueuse sans devenir cérémonieuse.
