  yaml_path: translation/ot/jeremiah/037/016.yaml
  text: For Jeremiah had come into the dungeon house and into the cells[a], and Jeremiah remained there many days.
translation:
  language: fr
  text: Car Jérémie était entré dans la maison de la fosse, dans les cellules[a], et il y resta pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les salles voûtées » ou « les compartiments » ; le terme hébreu est rare et désigne probablement des espaces fermés à l’intérieur de la prison.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: en effet
  rationale: La conjonction introduit ici une explication de la situation de Jérémie; « en effet » en conserve la valeur explicative dans un récit français naturel.
- source_word: בָא
  choice: était entré
  rationale: Le plus-que-parfait situe l'entrée de Jérémie avant son séjour prolongé; « entrer » convient au mouvement vers l'intérieur marqué par אֶל.
- source_word: בֵּית הַבּוֹר
  choice: la maison de la citerne
  rationale: Cette traduction conserve l'image concrète du composé hébreu, littéralement « maison de la fosse/citerne », sans réduire d'emblée le lieu au terme général « prison ».
- source_word: הַחֲנֻיוֹת
  choice: les cellules
  rationale: Le terme rare semble désigner des compartiments fermés dans le lieu de détention. « Cellules » est clair en français moderne, tandis que l'incertitude architecturale est signalée en note.
- source_word: וַיֵּשֶׁב שָׁם
  choice: il y resta
  rationale: Dans ce contexte carcéral, ישב exprime mieux la permanence dans le lieu que la posture assise.
- source_word: יָמִים רַבִּים
  choice: de nombreux jours
  rationale: Rendu proche de l'expression hébraïque, qui souligne une durée prolongée sans la préciser.
