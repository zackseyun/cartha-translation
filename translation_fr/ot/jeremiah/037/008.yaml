  text: וְ/שָׁ֨בוּ֙ הַ/כַּשְׂדִּ֔ים וְ/נִלְחֲמ֖וּ עַל הָ/עִ֣יר הַ/זֹּ֑את וּ/לְכָדֻ֖/הָ וּ/שְׂרָפֻ֥/הָ בָ/אֵֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/008.yaml
  text: Then the Chaldeans will return and fight against this city[a], and they will capture it and burn it with fire.
translation:
  language: fr
  text: Alors les Chaldéens[a] reviendront, combattront contre cette ville, s’en empareront et la brûleront par le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Babyloniens ». Le texte hébreu porte « les Chaldéens », désignation historique employée dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: Alors ... reviendront
  rationale: Le verbe שׁוּב signifie ici « revenir ». « Alors » rend naturellement la progression prophétique marquée par la conjonction sans ajouter de contenu.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Cette désignation ethnique et politique correspond directement à l’hébreu et conserve la formulation historique du contexte.
- source_word: וְנִלְחֲמוּ עַל
  choice: combattront
  rationale: Avec עַל, le verbe נלחם exprime une action militaire dirigée contre la ville. En français, « combattront cette ville » est compréhensible, tout en restant proche de la construction source.
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Le démonstratif proximal זֹאת se rend directement par « cette ».
- source_word: וּלְכָדֻהָ
  choice: s’en empareront
  rationale: לכד désigne la prise militaire d’une ville. « S’en emparer » est idiomatique et précis en français.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: la brûleront
  rationale: La mention hébraïque du feu est inhérente au verbe français « brûler » ; « la brûleront par le feu » serait lourd et peu naturel. La formulation conserve pleinement le sens de destruction par incendie.
