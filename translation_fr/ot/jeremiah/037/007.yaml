  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כֹּ֤ה תֹֽאמְרוּ֙ אֶל מֶ֣לֶךְ יְהוּדָ֔ה הַ/שֹּׁלֵ֧חַ אֶתְ/כֶ֛ם אֵלַ֖/י לְ/דָרְשֵׁ֑/נִי הִנֵּ֣ה חֵ֣יל פַּרְעֹ֗ה הַ/יֹּצֵ֤א לָ/כֶם֙ לְ/עֶזְרָ֔ה שָׁ֥ב לְ/אַרְצ֖/וֹ מִצְרָֽיִם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/007.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Thus you shall say to the king of Judah, who sent you to me to inquire of me, ‘Behold, Pharaoh’s army, which came out to help you, has returned to its own land[c][b], Egypt.’'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, le Dieu d’Israël : Voici ce que vous direz au roi de Juda, qui vous a envoyés auprès de moi pour me consulter : « Voici que l’armée de Pharaon, qui était sortie pour vous secourir,[a] est retournée dans son pays, l’Égypte.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui sort pour vous secourir ». L’hébreu emploie un participe, dont la valeur temporelle dépend du contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « est retournée au pays d’Égypte » ou « retourne dans son pays, l’Égypte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule française consacrée et naturelle pour la formule prophétique de messager.
- source_word: כֹּה תֹאמְרוּ
  choice: Voici ce que vous direz
  rationale: Rend l’instruction au futur de façon claire et idiomatique en français moderne.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם אֵלַי
  choice: qui vous a envoyés auprès de moi
  rationale: Le participe désigne ici l’action déjà accomplie par le roi; « auprès de moi » convient au déplacement vers le prophète tout en conservant la parole de Yahweh.
- source_word: לְדָרְשֵׁנִי
  choice: pour me consulter
  rationale: Dans ce contexte prophétique, le verbe désigne la recherche d’une réponse divine; cette formulation conserve la première personne du texte.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Marque l’attention et l’annonce solennelle sans archaïsme excessif.
- source_word: חֵיל פַּרְעֹה
  choice: l’armée du pharaon
  rationale: חֵיל désigne ici clairement une force militaire.
- source_word: הַיֹּצֵא לָכֶם לְעֶזְרָה
  choice: qui était sortie pour vous porter secours
  rationale: Le participe peut être compris comme concomitant ou antérieur; l’imparfait plus participe passé exprime naturellement l’expédition entreprise pour secourir Juda.
- source_word: שָׁב
  choice: retourne
  rationale: Le parfait prophétique annonce avec certitude le retrait; le présent français garde la vigueur directe de l’oracle sans imposer qu’il soit déjà matériellement achevé.
- source_word: לְאַרְצוֹ מִצְרָיִם
  choice: dans son pays, en Égypte
  rationale: Conserve le suffixe possessif singulier rattaché collectivement à l’armée ou à Pharaon, puis explicite l’apposition géographique.
theological_decisions:
- issue: Valeur temporelle de שָׁב dans l’annonce prophétique
  choice: « retourne »
  alternative: « est retournée » / « retournera »
  rationale: Le parfait hébreu présente le retour comme certain ou accompli du point de vue de l’oracle. Le présent français préserve cette tension mieux qu’un passé qui fixerait la chronologie ou qu’un futur qui atténuerait la certitude.
translation_notes:
  register: Français international moderne, clair et digne. La tournure prophétique « Ainsi parle Yahweh » est conservée; « Voici ce que vous direz » évite un calque raide. Les ambiguïtés aspectuelles des participes et du parfait sont signalées en notes.
