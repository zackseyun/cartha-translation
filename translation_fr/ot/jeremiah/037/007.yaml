  to: 'Ainsi parle Yahweh, le Dieu d’Israël : Voici ce que vous direz au roi de Juda, qui vous a envoyés auprès de moi pour me consulter : « Voici que l’armée de Pharaon, qui était sortie pour vous secourir,[a] est retournée dans son pays, l’Égypte.[b] »'
