source:
  edition: WLC
  text: כִּ֣י אִם הִכִּיתֶ֞ם כָּל חֵ֤יל כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים אִתְּ/כֶ֔ם וְ/נִ֨שְׁאֲרוּ בָ֔/ם אֲנָשִׁ֖ים מְדֻקָּרִ֑ים אִ֤ישׁ בְּ/אָהֳל/וֹ֙ יָק֔וּמוּ וְ/שָֽׂרְפ֛וּ אֶת הָ/עִ֥יר הַ/זֹּ֖את בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/010.yaml
  text: For even if you were to strike down the whole army of the Chaldeans who are fighting against you[a], and only wounded men remained among them, each in his tent[b], they would rise up and burn this city with fire.
translation:
  language: fr
  text: Car même si vous battiez toute l’armée des Chaldéens qui combattent contre vous[a], et qu’il ne restait parmi eux que des hommes transpercés[b], chacun dans sa tente, ils se relèveraient et brûleraient cette ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Babyloniens ». L’hébreu porte « les Chaldéens », nom ethnique souvent employé dans Jérémie pour désigner les forces babyloniennes.
    reason: lexical_alternative
  - marker: b
    text: Ou « des hommes blessés ». L’hébreu signifie littéralement « des hommes transpercés » ou « percés de part en part ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car même si
  rationale: Rend à la fois la valeur explicative de כִּי et la force concessive et hypothétique de אִם dans le contexte.
- source_word: הִכִּיתֶם
  choice: vous battiez
  rationale: Dans cette proposition hypothétique, le verbe נכה désigne ici le fait de frapper ou vaincre militairement; « battiez » reste naturel sans imposer l’idée que tous seraient tués.
- source_word: כָּל חֵיל כַּשְׂדִּים
  choice: toute l’armée des Chaldéens
  rationale: חֵיל désigne ici une force militaire; cette formulation rend naturellement le collectif singulier précédé de כָּל.
- source_word: כַּשְׂדִּים
  choice: les Chaldéens
  rationale: Conserve l’ethnonyme hébreu, couramment employé dans Jérémie pour les forces babyloniennes.
- source_word: הַנִּלְחָמִים אִתְּכֶם
  choice: qui combattent contre vous
  rationale: Dans ce contexte militaire hostile, אֵת avec לחם marque l’opposition.
- source_word: וְנִשְׁאֲרוּ בָם
  choice: et qu’il ne reste parmi eux que
  rationale: 'Le tour français explicite naturellement le caractère restrictif du scénario: seuls ces survivants resteraient.'
- source_word: אֲנָשִׁים מְדֻקָּרִים
  choice: des hommes transpercés
  rationale: מְדֻקָּרִים signifie littéralement « transpercés » ou « percés d’un coup »; ce choix conserve l’image forte du texte plutôt que de la généraliser en « blessés ».
- source_word: אִישׁ בְּאָהֳלוֹ
  choice: chacun dans sa tente
  rationale: Rend clairement la valeur distributive du singulier אִישׁ et conserve le cadre concret de la tente.
- source_word: יָקֻמוּ
  choice: ils se relèveraient
  rationale: Le conditionnel poursuit l’hypothèse irréelle ou extrême, tandis que « se relever » exprime le mouvement de blessés qui reprennent l’action.
- source_word: וְשָׂרְפוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ
  choice: et brûleraient cette ville par le feu
  rationale: Conserve l’expression instrumentale emphatique de l’hébreu, malgré une légère redondance naturelle au registre biblique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe hypothétique est maintenue au conditionnel, et l’image concrète et dramatique des hommes transpercés qui se relèvent est préservée.
