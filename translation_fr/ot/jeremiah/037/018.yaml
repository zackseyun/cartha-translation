  text: וַ/יֹּ֣אמֶר יִרְמְיָ֔הוּ אֶל הַ/מֶּ֖לֶךְ צִדְקִיָּ֑הוּ מֶה֩ חָטָ֨אתִֽי לְ/ךָ֤ וְ/לַ/עֲבָדֶ֨י/ךָ֙ וְ/לָ/עָ֣ם הַ/זֶּ֔ה כִּֽי נְתַתֶּ֥ם אוֹתִ֖/י אֶל בֵּ֥ית הַ/כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/018.yaml
  text: Then Jeremiah said to King Zedekiah, “What have I sinned against you, against your servants, and against this people, that you have put me into the prison?”
translation:
  language: fr
  text: 'Jérémie dit alors au roi Sédécias : « Quel péché ai-je commis contre toi, contre tes serviteurs et contre ce peuple ? Pourquoi m’avez-vous mis en prison ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה חָטָאתִי
  choice: Quel péché ai-je commis
  rationale: Rend naturellement en français la question littérale « qu’ai-je péché ? », tout en conservant le vocabulaire explicite du péché.
- source_word: לְךָ וְלַעֲבָדֶיךָ וְלָעָם הַזֶּה
  choice: contre toi, contre tes serviteurs ou contre ce peuple
  rationale: La préposition ל après חטא indique ici les personnes envers lesquelles une faute aurait été commise. « Ou » convient à l’énumération française dans une question sans changer sa portée globale.
- source_word: נְתַתֶּם אֹתִי
  choice: vous m’ayez mis
  rationale: 'Le pluriel hébreu contraste avec les singuliers « toi » et « tes » : Jérémie interpelle d’abord le roi, puis inclut les responsables de son emprisonnement.'
- source_word: בֵּית הַכֶּלֶא
  choice: en prison
  rationale: Expression idiomatique française pour l’hébreu « maison de détention / prison » ; le contexte vise le lieu d’incarcération plutôt que le bâtiment comme tel.
theological_decisions:
- issue: Nature de la faute alléguée par Jérémie
  choice: Conserver « péché »
  alternative: « faute » ou « mal »
  rationale: חטא porte un sens moral explicite ; le texte formule une contestation de culpabilité sans préciser davantage la faute supposée.
translation_notes:
  register: Français moderne, courant et digne. Le passage du singulier (« toi », « tes ») au pluriel (« vous m’ayez mis ») est conservé afin de refléter le changement de nombre dans l’hébreu.
