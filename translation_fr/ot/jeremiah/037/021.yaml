    text: L’expression hébraïque peut désigner la rue des boulangers, ou plus largement le quartier où ils travaillaient et vendaient leur pain.
    reason: cultural_note
  revision_rationale: Suppression des connecteurs inférentiels non exprimés par le texte source, resserrement de la clause sur l’épuisement du pain, et reformulation de la note afin de préserver l’incertitude lexicale et topographique.
