base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/021.yaml
  text: So King Zedekiah gave orders[a], and they committed Jeremiah to the court of the guard, and gave him a loaf of bread daily from the bakers’ street, until all the bread from the city was gone. So Jeremiah remained in the court of the guard.
translation:
  language: fr
  text: Le roi Sédécias donna des ordres. On plaça Jérémie dans la cour de la garde et on lui donna chaque jour une miche de pain provenant de la rue des boulangers[a], jusqu’à l’épuisement de tout le pain de la ville. Jérémie resta dans la cour de la garde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut désigner la rue des boulangers, ou plus largement le quartier où ils travaillaient et vendaient leur pain.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: donna des ordres
  rationale: Le verbe צוה exprime ici un ordre royal. « Donna des ordres » est naturel en français moderne et convient au contexte.
- source_word: וַיַּפְקִדוּ
  choice: on plaça
  rationale: Dans ce contexte de détention, פקד désigne l’affectation ou le placement de Jérémie dans un lieu sous garde. Le sujet pluriel indéfini hébreu est rendu naturellement par « on ».
- source_word: חֲצַר הַמַּטָּרָה
  choice: la cour de la garde
  rationale: Cette expression désigne dans Jérémie une cour surveillée servant de lieu de détention. La traduction conserve l’idée institutionnelle sans en faire explicitement une prison.
- source_word: וְנָתוֹן לוֹ
  choice: et on lui donna
  rationale: La forme infinitive prolonge le contenu ou l’exécution de l’ordre royal. Une proposition coordonnée au passé simple restitue clairement cette relation en français.
- source_word: כִכַּר לֶחֶם
  choice: une miche de pain
  rationale: ככר désigne ici un pain, probablement de forme ronde. « Une miche de pain » exprime une unité concrète sans précision excessive.
- source_word: לַיּוֹם
  choice: chaque jour
  rationale: L’expression indique une ration quotidienne régulière.
- source_word: מִחוּץ הָאֹפִים
  choice: provenant de la rue des boulangers
  rationale: חוץ peut désigner un espace extérieur ou une rue. Dans ce contexte urbain, l’expression renvoie probablement à la rue ou au quartier où travaillaient et vendaient les boulangers; la note conserve cette incertitude.
- source_word: עַד תֹּם כָּל הַלֶּחֶם מִן הָעִיר
  choice: jusqu’à ce qu’il n’y ait plus du tout de pain dans la ville
  rationale: La clause indique que la ration fut maintenue jusqu’à l’épuisement complet des réserves de pain de la ville.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: ישב exprime ici le maintien de Jérémie dans ce lieu de détention, plutôt que l’action physique de s’asseoir.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
