id: JER.2.14
reference: Jeremiah 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/עֶ֨בֶד֙ יִשְׂרָאֵ֔ל אִם יְלִ֥יד בַּ֖יִת ה֑וּא מַדּ֖וּעַ הָיָ֥ה לָ/בַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/014.yaml
  text: Is Israel a servant[b][a], or a homeborn servant? Why then has he become plunder?
translation:
  language: fr
  text: Israël est-il un esclave, ou un esclave né dans la maison[a] ? Pourquoi donc est-il devenu un butin[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quelqu’un né dans la maison ». L’expression désigne une personne née dans la maisonnée d’un maître, en condition d’esclavage.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une proie » ; autre traduction possible : « livré au pillage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֶבֶד
  choice: un esclave
  rationale: Le nom עֶבֶד peut désigner un serviteur ou un esclave. Ici, son rapprochement avec une personne née dans la maison du maître met au premier plan la condition servile ; « esclave » en conserve clairement la force.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom propre.
- source_word: אִם
  choice: ou
  rationale: Dans cette construction interrogative, אִם introduit une autre possibilité plutôt qu’une condition.
- source_word: יְלִיד בַּיִת
  choice: un esclave né dans la maison
  rationale: L’expression désigne littéralement une personne « née dans la maison », c’est-à-dire née au sein de la maisonnée d’un maître et appartenant à sa domesticité servile. Le mot « esclave » explicite en français la condition impliquée par le contexte.
- source_word: הוּא
  choice: il
  rationale: Le pronom masculin singulier reprend Israël, personnifié.
- source_word: מַדּוּעַ
  choice: Pourquoi donc
  rationale: « Pourquoi » rend l’interrogatif ; « donc » fait ressortir le lien rhétorique avec la question précédente.
- source_word: הָיָה
  choice: est-il devenu
  rationale: Le verbe exprime ici l’entrée dans un état dont le résultat est constaté ; le passé composé français convient à cette nuance.
- source_word: לָבַז
  choice: un butin
  rationale: בַּז désigne ce qui est pris comme dépouille ou butin. « Devenir un butin » conserve l’image nominale et l’idée qu’Israël est livré à d’autres.
theological_decisions:
- issue: Terminologie de la condition sociale exprimée par עֶבֶד et יְלִיד בַּיִת
  choice: Employer le vocabulaire explicite de l’esclavage dans les deux membres
  alternative: Employer « serviteur » ou traduire seulement « quelqu’un né dans la maison »
  rationale: Le cadre est celui d’une dépendance héréditaire au sein d’une maison. « Esclave » évite d’atténuer cette réalité sociale, sans transformer la question rhétorique en affirmation sur le statut d’Israël.
- issue: Valeur rhétorique des deux premières propositions
  choice: Conserver deux possibilités reliées par « ou » dans une même question
  alternative: Comprendre אִם avec sa valeur conditionnelle ordinaire, « si »
  rationale: La syntaxe interrogative présente deux désignations apparentées comme possibilités, puis oppose à celles-ci le sort inexplicable d’Israël devenu butin. La traduction garde cette tension sans fournir une réponse absente du verset.
translation_notes:
  register: 'Français international moderne, sobre et digne. La répétition d’« esclave » est volontaire : elle rend explicite le statut social sous-entendu dans יְלִיד בַּיִת et maintient le parallélisme de la question. « Butin » préserve l’image concrète du nom hébreu.'
