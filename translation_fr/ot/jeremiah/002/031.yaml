source:
  edition: WLC
  text: הַ/דּ֗וֹר אַתֶּם֙ רְא֣וּ דְבַר יְהוָ֔ה הֲ/מִדְבָּ֤ר הָיִ֨יתִי֙ לְ/יִשְׂרָאֵ֔ל אִ֛ם אֶ֥רֶץ מַאְפֵּ֖לְיָ֑ה מַדּ֜וּעַ אָמְר֤וּ עַמִּ/י֙ רַ֔דְנוּ לֽוֹא נָב֥וֹא ע֖וֹד אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/031.yaml
  text: 'O generation[a], you yourselves, see the word of Yahweh: Have I been a wilderness to Israel, or a land of deep darkness? Why has my people said, ‘We are lords; we will come to you no more’?”'
translation:
  language: fr
  text: 'Vous qui êtes de cette génération, considérez la parole de Yahweh :


    « Ai-je été pour Israël un désert,


    ou un pays de ténèbres profondes ?


    Pourquoi mon peuple a-t-il dit :


    “Nous sommes libres[a] ;


    nous ne viendrons plus vers toi” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est difficile. On peut aussi comprendre : « Nous errons librement », « Nous dominons » ou « Nous avons rompu toute entrave ». Dans ce contexte, le peuple affirme son indépendance envers Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוֹר אַתֶּם
  choice: Vous, gens de cette génération
  rationale: Cette formulation rend l’adresse directe et l’emphase du pronom indépendant אַתֶּם dans un français actuel, sans conserver l’apostrophe artificielle « Ô génération ».
- source_word: רְאוּ דְבַר יְהוָה
  choice: voyez la parole de Yahweh
  rationale: « Voyez » conserve l’image de ראה tout en invitant à considérer attentivement la parole prophétique. « Parole » maintient le registre biblique de דָּבָר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הֲמִדְבָּר הָיִיתִי לְיִשְׂרָאֵל
  choice: Ai-je été pour Israël un désert
  rationale: La tournure préserve la question rhétorique et la métaphore d’un lieu aride et inhospitalier.
- source_word: אֶרֶץ מַאְפֵּלְיָה
  choice: un pays d’épaisses ténèbres
  rationale: « Épaisses ténèbres » exprime l’intensité de מַאְפֵּלְיָה, tandis que « pays » rend naturellement אֶרֶץ.
- source_word: רַדְנוּ
  choice: Nous sommes libres[a]
  rationale: Le verbe est textuellement et lexicalement difficile. Cette traduction exprime la revendication d’indépendance suggérée par le contexte sans trancher silencieusement entre les sens proposés de libre errance, domination ou rupture de toute contrainte.
- source_word: לֹא נָבוֹא עוֹד אֵלֶיךָ
  choice: nous ne viendrons plus vers toi
  rationale: 'La négation avec עוֹד indique la cessation : le peuple déclare qu’il ne reviendra plus auprès de Yahweh.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le nom personnel est conservé afin de maintenir la référence explicite au Dieu d’Israël sans remplacer le tétragramme par un titre.
- issue: Interprétation de רַדְנוּ
  choice: Nous sommes libres[a]
  alternative: Nous errons librement ; nous dominons ; nous avons rompu toute entrave
  rationale: Le contexte indique une déclaration d’autonomie à l’égard de Yahweh, mais l’étymologie et le sens précis de la forme restent discutés. Le texte principal demeure bref et la note préserve les principales possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et les questions rhétoriques sont conservés. « Vous, gens de cette génération » évite un vocatif archaïque, tandis que « voyez la parole » maintient volontairement l’image hébraïque.
