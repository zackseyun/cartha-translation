source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח בְּתוּלָה֙ עֶדְיָ֔/הּ כַּלָּ֖ה קִשֻּׁרֶ֑י/הָ וְ/עַמִּ֣/י שְׁכֵח֔וּ/נִי יָמִ֖ים אֵ֥ין מִסְפָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/032.yaml
  text: Does a virgin forget her jewelry[b][a], or a bride her ornaments? Yet my people have forgotten me for days without number.
translation:
  language: fr
  text: 'Une vierge oublie-t-elle ses bijoux[a],

    ou une mariée ses ornements de noces[b] ?

    Pourtant, mon peuple m’a oublié

    depuis des jours sans nombre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa parure ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner plus précisément des bandeaux, des ceintures ou d’autres ornements attachés ou noués.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: oublie-t-elle ?
  rationale: La tournure interrogative rend la question rhétorique introduite par הֲ et convient à une vérité générale en français.
- source_word: בְּתוּלָה
  choice: une jeune fille vierge
  rationale: Cette formulation préserve le sens de virginité tout en restant plus naturelle en français moderne que le substantif isolé « une vierge ».
- source_word: עֶדְיָהּ
  choice: ses bijoux
  rationale: Le mot désigne ce qui sert à la parure personnelle. « Bijoux » est concret et naturel, tandis que le sens plus large est signalé en note.
- source_word: כַּלָּה
  choice: une mariée
  rationale: Le nom désigne une femme au moment de ses noces; l’indéfini convient à la comparaison générale.
- source_word: קִשֻּׁרֶיהָ
  choice: ses ornements de noces
  rationale: Le terme semble viser des accessoires attachés ou noués, mais leur nature exacte reste incertaine. La traduction conserve l’image nuptiale sans préciser excessivement l’objet.
- source_word: וְעַמִּי
  choice: Pourtant, mon peuple
  rationale: « Pourtant » fait ressortir le contraste entre le comportement normalement attendu et l’oubli de Dieu par son peuple.
- source_word: שְׁכֵחוּנִי
  choice: m’a oublié
  rationale: Le passé composé exprime un oubli accompli dont l’état se prolonge. Le singulier suit naturellement le nom collectif français « peuple », malgré le verbe pluriel hébreu.
- source_word: יָמִים אֵין מִסְפָּר
  choice: depuis des jours sans nombre
  rationale: Cette expression reste proche de l’image hébraïque d’une durée impossible à compter tout en étant intelligible en français.
theological_decisions:
- issue: Portée relationnelle de l’oubli de Dieu par « mon peuple »
  choice: Conserver « mon peuple m’a oublié »
  alternative: « mon peuple m’a abandonné »
  rationale: Le contexte évoque l’infidélité de l’alliance, mais le verset emploie précisément le langage de l’oubli. La traduction n’intensifie donc pas l’accusation en abandon explicite.
translation_notes:
  register: Français international moderne, naturel et digne. La disposition en lignes met en valeur le parallélisme poétique et le contraste final. Les notes préservent l’incertitude lexicale des deux termes relatifs à la parure.
