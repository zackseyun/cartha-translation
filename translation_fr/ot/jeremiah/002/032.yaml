    issue: « Une jeune fille vierge » surtraduit בְּתוּלָה.
    rationale: Le syntagme français associe une catégorie d’âge (« jeune fille ») et l’état de virginité, alors que le mot hébreu ne requiert pas ce double rendu dans cette phrase. Cela est également redondant et moins fluide. « Une vierge » conserve l’ambiguïté relative à l’âge tout en exprimant le sens lexical retenu.
