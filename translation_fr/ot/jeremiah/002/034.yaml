  - severity: low
    issue: « Je ne les ai pas surpris » est plus interprétatif que le verbe « trouver ».
    rationale: Le texte massorétique porte littéralement « je ne les ai pas trouvés ». « Surpris » peut être une conséquence contextuelle, mais risque de présenter comme explicite l’idée de flagrant délit.
  - severity: low
