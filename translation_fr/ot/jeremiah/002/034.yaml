revisions:
- from: Même sur les pans de ton vêtement se trouve le sang de pauvres innocents[a]. Je ne les ai pas surpris en train de commettre une effraction[b] ; pourtant, tout cela…[c]
  to: Même sur les pans de ton vêtement se trouve le sang de pauvres innocents[a]. Je ne les ai pas trouvés en pleine effraction[b], mais à cause de tout cela[c].
  rationale: La révision maintient le sens concret et judiciaire du verset, mais remplace l’ellipse française non lexicale par une traduction qui conserve « à cause de tout cela ». Elle retient « trouvés », plus proche de la forme massorétique à la première personne avec objet pluriel, et laisse la construction difficile sans la résoudre doctrinalement ou par émendation. Les notes explicitent les alternatives textuelles et interprétatives nécessaires.
