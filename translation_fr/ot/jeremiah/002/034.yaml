source:
  edition: WLC
  text: גַּ֤ם בִּ/כְנָפַ֨יִ/ךְ֙ נִמְצְא֔וּ דַּ֛ם נַפְשׁ֥וֹת אֶבְיוֹנִ֖ים נְקִיִּ֑ים לֹֽא בַ/מַּחְתֶּ֥רֶת מְצָאתִ֖י/ם כִּ֥י עַל כָּל אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/034.yaml
  text: Even on your skirts is found the blood of the lives of innocent poor people[a]. I did not find them in a break-in[c][b], but on account of all these things.
translation:
  language: fr
  text: Même sur les pans de ton vêtement se trouve le sang de pauvres innocents[a]. Je ne les ai pas trouvés en pleine effraction[b], mais à cause de tout cela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le sang des vies de pauvres innocents »; « vies » désigne ici des personnes, et non des âmes au sens théologique ultérieur.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une effraction accomplie en creusant ou en perçant un mur; voir le cadre juridique d’Exode 22.1.
    reason: cross_reference
  - marker: c
    text: 'La fin du verset est elliptique et difficile en hébreu. Elle peut aussi se comprendre : « non parce que je les ai trouvés en pleine effraction, mais à cause de tout cela ». Certains interprètent ou corrigent le verbe comme une deuxième personne : « tu ne les as pas trouvés en pleine effraction ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּכְנָפַיִךְ
  choice: sur les pans de ton vêtement
  rationale: כָּנָף désigne littéralement une aile ou une extrémité et, pour un vêtement, son pan ou son bord. L’expression française rend concrètement l’image de traces de sang sur l’habit.
- source_word: דַּם נַפְשׁוֹת
  choice: le sang de pauvres innocents
  rationale: נֶפֶשׁ renvoie ici aux personnes ou à leur vie, non à l’« âme » au sens théologique ultérieur. Une traduction littérale comme « le sang des vies » serait peu naturelle en français ; le sang versé implique déjà la vie ôtée.
- source_word: אֶבְיוֹנִים נְקִיִּים
  choice: de pauvres innocents
  rationale: אֶבְיוֹנִים désigne des personnes pauvres ou démunies, et נְקִיִּים leur innocence. « Pauvres innocents » est naturel, digne et conserve la portée sociale et judiciaire.
- source_word: לֹא בַמַּחְתֶּרֶת
  choice: pas … en train de commettre une effraction
  rationale: מַחְתֶּרֶת évoque une effraction pratiquée en creusant ou en perçant un mur. La formulation rappelle le cadre juridique d’Exode 22.1 et exprime clairement qu’ils n’ont pas été tués comme cambrioleurs pris sur le fait.
- source_word: מְצָאתִים
  choice: je ne les ai pas surpris
  rationale: 'La forme massorétique est à la première personne du singulier avec un objet pluriel : « je les ai trouvés ». « Surprendre en train de » rend naturellement en français la découverte de personnes prises sur le fait, sans modifier la personne grammaticale.'
- source_word: כִּי עַל כָּל אֵלֶּה
  choice: pourtant, tout cela…
  rationale: La proposition finale est elliptique et difficile. Plutôt que d’imposer un lien causal incertain, la traduction conserve sa rupture et son caractère accusateur ; les points de suspension signalent l’inachèvement syntaxique.
theological_decisions:
- issue: Identité du locuteur et référent de l’objet dans מְצָאתִים
  choice: 'Le Seigneur parle à la première personne : « Je ne les ai pas surpris », et « les » renvoie aux pauvres innocents.'
  alternative: 'Corriger ou interpréter le verbe à la deuxième personne : « tu ne les as pas surpris en pleine effraction ».'
  rationale: Le texte massorétique porte une première personne singulière avec suffixe objet de troisième personne plurielle. Le conserver évite une émendation et maintient la forme de l’accusation divine.
- issue: Sens de la proposition finale elliptique
  choice: 'Conserver l’ellipse : « pourtant, tout cela… »'
  alternative: « mais à cause de tout cela » ou « mais pour toutes ces choses »
  rationale: כִּי עַל כָּל אֵלֶּה ne fournit pas un énoncé complet et son rapport exact à ce qui précède reste débattu. La traduction ne tranche donc pas artificiellement entre cause, portée générale et contraste.
translation_notes:
  register: Français international moderne, sobre et judiciaire. L’image concrète du vêtement taché de sang est préservée. Le tour « surpris en train de commettre une effraction » explicite idiomatiquement la situation sans effacer son arrière-plan ancien. L’ellipse finale est volontairement maintenue afin de ne pas résoudre un hébreu obscur.
