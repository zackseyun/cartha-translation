source:
  edition: WLC
  text: הֲ/לוֹא זֹ֖את תַּעֲשֶׂה לָּ֑/ךְ עָזְבֵ/ךְ֙ אֶת יְהוָ֣ה אֱלֹהַ֔יִ/ךְ בְּ/עֵ֖ת מוֹלִיכֵ֥/ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/017.yaml
  text: Has not this brought it upon you[b][a], because you have forsaken Yahweh your God when he was leading you in the way?
translation:
  language: fr
  text: N’est-ce pas ton abandon de Yahweh, ton Dieu, qui t’a attiré cela[a], alors qu’il te conduisait sur le chemin[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu place « ceci » avant « ton abandon » ; on peut aussi comprendre : « N’est-ce pas cela qui t’arrive parce que tu as abandonné Yahweh, ton Dieu ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur la voie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: N’est-ce pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative et conserve la force du reproche.
- source_word: זֹאת תַּעֲשֶׂה לָּךְ
  choice: toi qui t’es attiré cela
  rationale: Rend idiomatiquement l’idée d’un malheur provoqué par la conduite de Juda, tout en signalant en note la formulation hébraïque plus littérale et son ambiguïté.
- source_word: עָזְבֵךְ
  choice: en abandonnant
  rationale: L’infinitif construit avec suffixe exprime ici la cause; cette tournure française relie clairement l’abandon de Dieu aux conséquences subies.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהַיִךְ
  choice: ton Dieu
  rationale: Reproduit simplement l’expression possessive d’alliance, adressée à Juda au féminin singulier en hébreu.
- source_word: בְּעֵת מוֹלִיכֵךְ
  choice: alors qu’il te conduisait
  rationale: Exprime à la fois la relation temporelle et l’action continue suggérée par le participe causatif.
- source_word: בַּדָּרֶךְ
  choice: sur la voie
  rationale: Conserve l’image du chemin, avec sa possible portée morale et relationnelle, dans un français naturel et digne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; sa transcription préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de « la voie »
  choice: Conserver l’image sans l’expliciter
  alternative: le bon chemin
  rationale: L’hébreu permet une portée concrète, morale ou liée à l’alliance; ajouter « bon » trancherait une nuance que le texte laisse implicite.
translation_notes:
  register: Français international actuel, accessible et digne. Le tutoiement singulier reflète l’adresse hébraïque à Juda personnifiée au féminin. La phrase principale privilégie une formulation idiomatique, tandis que les notes préservent la concision et l’ambiguïté de l’hébreu.
