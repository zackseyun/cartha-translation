revisions:
- from: C’est pourquoi je serai encore en procès avec vous[a], déclare Yahweh, et je serai en procès avec les enfants de vos enfants.
  to: C’est pourquoi je plaiderai encore contre vous[a], déclare Yahweh, et je plaiderai contre les enfants de vos enfants.
  rationale: La révision remplace une tournure statique et peu idiomatique par « je plaiderai », qui rend l’action future de ריב et son registre judiciaire. « Contre » explicite la force adversative contextuelle de la construction, tandis que la note préserve prudemment la possibilité formelle de « avec » sans trancher au-delà du texte.
  reviewer_model: gpt-5.6-terra
