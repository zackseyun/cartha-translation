  yaml_path: translation/ot/jeremiah/002/009.yaml
  text: Therefore I will still contend with you[a], declares Yahweh, and with your children's children I will contend.
translation:
  language: fr
  text: C’est pourquoi je plaiderai encore contre vous[a], déclare Yahweh, et je plaiderai contre les enfants de vos enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je serai encore en litige avec vous […] et avec les enfants de vos enfants ». Le verbe hébreu évoque une contestation judiciaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence logique de l’accusation formulée dans le contexte précédent, dans un français naturel et soutenu.
- source_word: עוֹד
  choice: encore
  rationale: Conserve la possibilité d’une action qui se poursuit ou se répète, sans trancher entre « toujours » et « de nouveau ».
- source_word: אָרִיב
  choice: je serai en procès
  rationale: Le verbe ריב appartient ici au registre de la contestation judiciaire ou du procès d’alliance. Cette formulation française garde la dimension juridique sans préciser excessivement la procédure.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: Rend directement la préposition hébraïque tout en laissant au contexte judiciaire le soin d’exprimer le caractère adversatif.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique d’autorité dans un français actuel et digne, tout en conservant le nom divin.
- source_word: וְאֶת בְּנֵי בְנֵיכֶם
  choice: et … avec les enfants de vos enfants
  rationale: Reprend la même relation judiciaire pour la génération suivante et conserve l’expression familiale solennelle de l’hébreu plutôt que de la réduire à « petits-enfants ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Portée judiciaire de ריב
  choice: être en procès avec
  alternative: intenter un procès contre / accuser
  rationale: Le choix maintient l’image de la controverse judiciaire d’alliance tout en évitant de définir plus précisément que l’hébreu la fonction exercée par Yahweh.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de la formule judiciaire est maintenue pour reproduire l’insistance de l’hébreu; « enfants de vos enfants » conserve la solennité de l’expression source.
