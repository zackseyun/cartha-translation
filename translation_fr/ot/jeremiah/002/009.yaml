    rationale: Cette expression décrit plus volontiers une situation durable qu’une action de contestation judiciaire. Elle ne restitue pas avec assez de dynamisme le verbe אָרִיב, répété dans le verset.
  - severity: low
    issue: La note présente « je plaiderai ... contre » comme alternative alors que ce sens est déjà celui qu’elle explicite.
    rationale: Après la révision, la note doit plutôt signaler l’alternative plus littérale liée à la préposition hébraïque, tout en évitant de suggérer une lecture collaborative de « plaider avec ».
