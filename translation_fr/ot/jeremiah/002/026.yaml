source:
  edition: WLC
  text: כְּ/בֹ֤שֶׁת גַּנָּב֙ כִּ֣י יִמָּצֵ֔א כֵּ֥ן הֹבִ֖ישׁוּ בֵּ֣ית יִשְׂרָאֵ֑ל הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם וְ/כֹהֲנֵי/הֶ֖ם וּ/נְבִיאֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/026.yaml
  text: As a thief is ashamed when he is found[a], so the house of Israel has been put to shame—they, their kings, their officials, their priests[b], and their prophets.
translation:
  language: fr
  text: 'Comme un voleur est couvert de honte lorsqu’il est découvert[a], ainsi la maison d’Israël a été couverte de honte : elle-même, ses rois, ses responsables[b], ses prêtres et ses prophètes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsqu’on le trouve ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ses chefs » ou « ses princes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹשֶׁת
  choice: Comme … est couvert de honte
  rationale: La préposition comparative כְּ avec le nom בֹשֶׁת introduit une comparaison. La tournure verbale française exprime naturellement la honte manifeste du voleur tout en conservant le motif lexical.
- source_word: גַּנָּב
  choice: un voleur
  rationale: Le singulier indéfini convient à la portée générique de la comparaison.
- source_word: כִּי יִמָּצֵא
  choice: lorsqu’il est découvert
  rationale: Le nifal de מצא signifie ici être trouvé ou découvert. « Découvert » met naturellement l’accent sur la mise au jour du voleur, sans préciser qu’il est nécessairement arrêté.
- source_word: כֵּן
  choice: ainsi
  rationale: Ce corrélatif reprend clairement et sobrement la comparaison initiale.
- source_word: הֹבִישׁוּ
  choice: a été couverte de honte
  rationale: La formulation exprime l’état public de honte et de déshonneur résultant de l’exposition d’Israël. L’accord au singulier suit en français le nom collectif « la maison d’Israël ».
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette traduction conserve l’expression collective et son poids historique et communautaire.
- source_word: הֵמָּה
  choice: elle
  rationale: Le pronom reprend avec insistance la maison d’Israël et introduit la liste explicative de ses dirigeants religieux et civils.
- source_word: מַלְכֵיהֶם
  choice: ses rois
  rationale: Traduction directe du pluriel muni du suffixe possessif, adapté en français au référent collectif singulier.
- source_word: שָׂרֵיהֶם
  choice: ses responsables
  rationale: שׂרים désigne des dirigeants, hauts fonctionnaires ou chefs. « Responsables » reste moderne et assez large, sans imposer l’idée d’une noblesse héréditaire.
- source_word: כֹהֲנֵיהֶם
  choice: ses prêtres
  rationale: Équivalent français courant et précis de כֹהֲנִים.
- source_word: נְבִיאֵיהֶם
  choice: ses prophètes
  rationale: Équivalent français courant et précis de נְבִיאִים.
theological_decisions:
- issue: Étendue de la culpabilité dans la liste en apposition
  choice: La honte concerne collectivement la maison d’Israël, avec mention explicite de ses principales catégories de dirigeants.
  alternative: Limiter l’accusation aux seuls dirigeants énumérés.
  rationale: Le texte nomme d’abord la maison d’Israël dans son ensemble, puis emploie un pronom emphatique et énumère rois, responsables, prêtres et prophètes. La traduction conserve à la fois la portée collective et la mise en cause particulière des dirigeants.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « honte » est volontaire afin de préserver le lien lexical et rhétorique de la comparaison hébraïque. Les deux-points rendent l’apposition emphatique sans ajouter d’interprétation.
