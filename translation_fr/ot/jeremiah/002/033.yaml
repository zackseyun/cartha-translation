base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/033.yaml
  text: How well you make your way to seek love! Therefore even evil women you have taught your ways.
translation:
  language: fr
  text: Comme tu sais bien diriger ta conduite pour chercher l’amour ! C’est pourquoi tu as même enseigné tes voies aux femmes mauvaises[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, si le féminin pluriel est compris de façon abstraite : « tu as même enseigné tes voies aux choses mauvaises ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּיטִבִי
  choice: Comme tu sais bien orienter
  rationale: La tournure exclamative exprime ironiquement le degré d’habileté. « Sais bien orienter » rend naturellement en français la nuance causative de la forme verbale.
- source_word: דַּרְכֵּךְ
  choice: ta voie
  rationale: Le terme désigne à la fois un chemin et une manière d’agir. « Voie » conserve la métaphore et prépare la reprise au pluriel dans la dernière proposition.
- source_word: לְבַקֵּשׁ אַהֲבָה
  choice: pour rechercher l’amour
  rationale: Le texte hébreu emploie le nom singulier « amour », et non le mot « amants ». La traduction maintient cette formulation et son ambiguïté métaphorique.
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Cette expression marque clairement la conséquence ou la conclusion introduite par le terme hébreu.
- source_word: גַּם
  choice: même
  rationale: 'Dans ce contexte, le mot renforce l’accusation : la destinataire est présentée comme capable d’instruire jusqu’à des femmes déjà mauvaises.'
- source_word: הָרָעוֹת
  choice: aux femmes mauvaises
  rationale: Le féminin pluriel substantivé peut naturellement désigner des femmes mauvaises dans le contexte où Juda est figurée comme une femme recherchant un amour illicite. La lecture abstraite reste signalée en note.
- source_word: למדתי
  choice: tu as enseigné
  rationale: La lecture massorétique contextuelle est celle de la deuxième personne du féminin singulier, en accord avec l’adresse féminine de l’ensemble du verset.
- source_word: דְּרָכָיִךְ
  choice: tes voies
  rationale: Le pluriel est conservé, ainsi que la répétition du vocabulaire de la « voie », pour évoquer les conduites ou pratiques transmises à d’autres.
theological_decisions:
- issue: Référent du féminin pluriel הָרָעוֹת dans la métaphore de l’amour illicite
  choice: 'Référent personnel : « femmes mauvaises »'
  alternative: 'Référent abstrait : « choses mauvaises » ou « mauvaises actions »'
  rationale: Le contexte présente Juda sous les traits d’une femme qui recherche un amour illicite ; le référent personnel s’accorde donc bien avec l’image. Comme la forme hébraïque permet aussi une compréhension abstraite, celle-ci est conservée en note plutôt qu’écartée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’exclamation conserve l’ironie prophétique ; la répétition « ta voie / tes voies » maintient le fil lexical du texte hébreu.
