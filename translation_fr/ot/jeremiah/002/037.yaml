  variant: modern international French
source:
  edition: WLC
  text: גַּ֣ם מֵ/אֵ֥ת זֶה֙ תֵּֽצְאִ֔י וְ/יָדַ֖יִ/ךְ עַל רֹאשֵׁ֑/ךְ כִּֽי מָאַ֤ס יְהֹוָה֙ בְּ/מִבְטַחַ֔יִ/ךְ וְ/לֹ֥א תַצְלִ֖יחִי לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/037.yaml
  text: From this one too you will go out with your hands on your head[a], for Yahweh has rejected those in whom you trust[d][c][b], and you will not prosper through them.
translation:
  language: fr
  text: Tu sortiras aussi de chez celui-ci[a], les mains sur la tête[b], car Yahweh a rejeté ceux en qui tu mets ta confiance[c], et tu ne réussiras pas grâce à eux[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Celui-ci » désigne probablement la puissance étrangère qui vient d’être mentionnée, c’est-à-dire l’Égypte. On peut aussi traduire plus littéralement : « de ceci ».'
    reason: alternative_reading
  - marker: b
    text: Mettre les mains sur la tête est un geste de deuil, de honte ou de défaite.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « tes confiances ». Autres traductions possibles : « ceux auxquels tu te fies » ou « tes appuis ».'
    reason: lexical_alternative
  - marker: d
    text: 'Autre traduction possible : « tu ne réussiras pas avec eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Marque la continuation par rapport aux autres appuis étrangers évoqués dans le contexte.
- source_word: מֵאֵת זֶה
  choice: de chez celui-ci
  rationale: Conserve la valeur démonstrative et l’idée de s’éloigner d’un allié, sans nommer explicitement l’Égypte dans le texte.
- source_word: תֵּצְאִי
  choice: tu repartiras
  rationale: Rend naturellement le départ d’auprès de l’allié étranger dans un contexte d’échec et de honte.
- source_word: וְיָדַיִךְ עַל רֹאשֵׁךְ
  choice: les mains sur la tête
  rationale: Préserve l’image hébraïque de ce geste exprimant la détresse, la honte ou la défaite.
- source_word: מָאַס
  choice: a rejeté
  rationale: Exprime clairement la répudiation par Dieu des appuis auxquels Juda se fie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme.
- source_word: בְּמִבְטַחַיִךְ
  choice: ceux en qui tu mets ta confiance
  rationale: Le pluriel hébreu signifie littéralement « tes confiances » ou « tes appuis »; le contexte vise vraisemblablement les puissances étrangères auxquelles Juda se fie.
- source_word: תַצְלִיחִי לָהֶם
  choice: tu ne réussiras pas grâce à eux
  rationale: Rend le verbe au sens de réussir et comprend la préposition comme indiquant les alliés par le moyen desquels Juda espère réussir.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom divin personnel.
- issue: Identification des « confiances » de Juda
  choice: ceux en qui tu mets ta confiance
  alternative: tes appuis
  rationale: La formulation personnelle convient aux alliés étrangers du contexte, tout en signalant en note que l’hébreu emploie un nom abstrait pluriel.
translation_notes:
  register: Français international actuel, digne et accessible. Le féminin singulier de l’hébreu est conservé par « tu », qui s’adresse à Juda personnifiée. L’image corporelle et l’ambiguïté relative du démonstratif sont maintenues.
