source:
  edition: WLC
  text: עָלָי/ו֙ יִשְׁאֲג֣וּ כְפִרִ֔ים נָתְנ֖וּ קוֹלָ֑/ם וַ/יָּשִׁ֤יתוּ אַרְצ/וֹ֙ לְ/שַׁמָּ֔ה עָרָ֥י/ו נצתה מִ/בְּלִ֥י יֹשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/015.yaml
  text: Young lions roar against him; they raise their voice. They make his land a desolation; his cities are burned[a], without inhabitant.
translation:
  language: fr
  text: De jeunes lions rugissent contre lui ; ils font retentir leur voix. Ils font de son pays une désolation ; ses villes sont incendiées[a], privées d’habitants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses villes sont dévastées, privées d’habitants ». La forme hébraïque נצתה est difficile et peut évoquer soit l’incendie, soit, plus généralement, la dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: contre lui
  rationale: Avec le verbe « rugir », la préposition עַל exprime ici l’hostilité dirigée contre Israël, personnifié au masculin singulier.
- source_word: יִשְׁאֲגוּ
  choice: rugissent
  rationale: Rendu courant et précis du cri des lions, qui conserve l’image vive de prédateurs menaçants.
- source_word: כְפִרִים
  choice: de jeunes lions
  rationale: Le terme désigne des lions jeunes et vigoureux, plutôt que de petits lionceaux.
- source_word: נָתְנוּ קוֹלָם
  choice: ils font entendre leur voix
  rationale: Expression française naturelle qui rend l’idiome hébreu, littéralement « ils donnent leur voix », et souligne la puissance du cri.
- source_word: וַיָּשִׁיתוּ
  choice: ils réduisent
  rationale: Dans ce contexte résultatif, שׁית indique que les assaillants mettent le pays dans un état de désolation.
- source_word: אַרְצוֹ
  choice: son pays
  rationale: « Pays » convient naturellement à la terre nationale ravagée, tout en maintenant le possessif singulier de la personnification.
- source_word: לְשַׁמָּה
  choice: à la désolation
  rationale: Conserve la valeur nominale du terme et exprime clairement la dévastation du pays.
- source_word: עָרָיו
  choice: ses villes
  rationale: Rendu direct du pluriel muni du suffixe masculin singulier, qui prolonge la personnification nationale.
- source_word: נצתה
  choice: sont incendiées
  rationale: Le contexte permet de comprendre la forme difficile comme se rapportant au feu ou à l’incendie ; l’autre lecture générale, « dévastées », est signalée en note.
- source_word: מִבְּלִי יֹשֵׁב
  choice: privées d’habitants
  rationale: Formulation française claire et concise exprimant le dépeuplement total, avec une valeur collective correspondant au participe singulier hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La personnification masculine singulière d’Israël est maintenue par « lui », « son » et « ses ». Le parallélisme poétique demeure perceptible sans calquer lourdement l’idiome hébreu.
