reference: Jeremiah 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/הֵימִ֥יר גּוֹי֙ אֱלֹהִ֔ים וְ/הֵ֖מָּה לֹ֣א אֱלֹהִ֑ים וְ/עַמִּ֛/י הֵמִ֥יר כְּבוֹד֖/וֹ בְּ/ל֥וֹא יוֹעִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/011.yaml
  text: Has a nation changed its gods—though they are not gods? Yet my people have changed their glory for what does not profit[a][b][c].
translation:
  language: fr
  text: Une nation a-t-elle changé de dieux — alors que ce ne sont pas des dieux ? Pourtant, mon peuple a échangé sa gloire contre ce qui ne sert à rien[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sa gloire » désigne probablement le SEIGNEUR, véritable gloire d’Israël ; l’hébreu ne le nomme toutefois pas directement ici.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « contre ce qui n’est d’aucun secours » ou « contre ce qui ne procure aucun avantage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵימִיר
  choice: changé / a échangé
  rationale: Le verbe peut signifier changer, échanger ou remplacer. « Changé » convient à la question initiale, tandis que « a échangé… contre » rend naturellement la construction du second membre sans effacer l’unité lexicale.
- source_word: גּוֹי
  choice: une nation
  rationale: Le terme désigne ici une collectivité nationale dans une question rhétorique.
- source_word: אֱלֹהִים
  choice: dieux
  rationale: Le pluriel vise les divinités supposées des nations.
- source_word: וְהֵמָּה לֹא אֱלֹהִים
  choice: alors que ce ne sont pas des dieux
  rationale: Cette formulation française exprime clairement la concession et respecte le pluriel hébreu.
- source_word: וְעַמִּי
  choice: Pourtant, mon peuple
  rationale: « Pourtant » fait ressortir le contraste ironique entre les nations qui gardent leurs faux dieux et Israël qui abandonne sa gloire.
- source_word: כְּבוֹדוֹ
  choice: sa gloire
  rationale: Le nom singulier avec suffixe masculin singulier signifie littéralement « sa gloire ». Le contexte peut faire de cette gloire une désignation métonymique du SEIGNEUR, sans qu’il soit nécessaire de rendre cette interprétation explicite dans le texte.
- source_word: בְּלֹא יוֹעִיל
  choice: contre ce qui ne sert à rien
  rationale: Cette expression actuelle et digne rend l’idée de ce qui n’apporte aucun profit ni secours.
theological_decisions:
- issue: Référent de כְּבוֹדוֹ (« sa gloire »)
  choice: Conserver « sa gloire » dans le texte, avec une note indiquant qu’il s’agit probablement du SEIGNEUR, gloire d’Israël.
  alternative: Rendre explicitement « le SEIGNEUR, sa gloire » ou comprendre la gloire d’Israël de manière abstraite.
  rationale: Le contexte oppose les faux dieux au vrai Dieu d’Israël, mais l’hébreu emploie une expression métonymique plutôt que le nom divin. La traduction préserve cette tension et évite de trancher silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et le contraste prophétique sont maintenus. La variation « changé / échangé » reflète les possibilités du même verbe hébreu tout en assurant une syntaxe française idiomatique.
