source:
  edition: WLC
  text: שֹׁ֥מּוּ שָׁמַ֖יִם עַל זֹ֑את וְ/שַׂעֲר֛וּ חָרְב֥וּ מְאֹ֖ד נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/012.yaml
  text: Be appalled at this[a], O heavens; shudder, be utterly desolate, declares Yahweh.
translation:
  language: fr
  text: Soyez consternés de cela, ô cieux ! Frémissez, soyez totalement dévastés, déclare Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמּוּ
  choice: Soyez consternés
  rationale: L’impératif pluriel de שמם appelle les cieux à une réaction de stupeur horrifiée. « Soyez consternés » est naturel, digne et conserve cette force.
- source_word: שָׁמַיִם
  choice: ô cieux
  rationale: Le nom est ici un vocatif. « Ô cieux » maintient l’apostrophe poétique et le rôle de témoins donné aux cieux.
- source_word: עַל זֹאת
  choice: à ce sujet
  rationale: La locution renvoie à la réalité choquante décrite auparavant. « À ce sujet » conserve le renvoi démonstratif sans expliciter davantage sa cause.
- source_word: וְשַׂעֲרוּ
  choice: Frémissez
  rationale: L’impératif de שער évoque vraisemblablement un frisson ou un hérissement d’effroi. « Frémissez » rend cette réaction physique sans paraphrase excessive.
- source_word: חָרְבוּ מְאֹד
  choice: soyez profondément dévastés
  rationale: חרב peut évoquer la dessiccation ou la dévastation; dans cette adresse poétique aux cieux, « dévastés » préserve l’image forte, tandis que « profondément » rend l’intensif מְאֹד sans lever entièrement la tension métaphorique.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » rend avec solennité la formule prophétique נְאֻם, et le nom divin est conservé sous la forme « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. La translittération « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée métaphorique de חָרְבוּ appliqué aux cieux
  choice: soyez profondément dévastés
  alternative: soyez complètement desséchés
  rationale: Le verbe peut exprimer la dévastation ou la dessiccation. Le contexte accumule des réactions cosmiques d’horreur; « dévastés » convient au français tout en gardant la violence de l’image, sans imposer une lecture cosmologique particulière.
translation_notes:
  register: Français international moderne, avec une solennité prophétique. L’apostrophe « ô cieux » est conservée; les trois impératifs maintiennent le rythme et l’intensification de l’hébreu.
