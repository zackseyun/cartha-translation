id: JER.2.22
reference: Jeremiah 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י אִם תְּכַבְּסִי֙ בַּ/נֶּ֔תֶר וְ/תַרְבִּי לָ֖/ךְ בֹּרִ֑ית נִכְתָּ֤ם עֲוֺנֵ/ךְ֙ לְ/פָנַ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/022.yaml
  text: For though you wash with natron and use much lye[a], your guilt is stained before me[c][b], declares the Lord YHWH.
translation:
  language: fr
  text: Car même si tu te laves avec du natron[a] et emploies beaucoup d’alcali[b], ta faute reste marquée[c] devant moi, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le natron est un produit minéral alcalin utilisé autrefois pour le nettoyage.
    reason: lexical_alternative
  - marker: b
    text: Ou « de lessive ». Le mot hébreu désigne une ancienne substance alcaline utilisée pour le lavage, pas nécessairement du savon au sens moderne.
    reason: lexical_alternative
  - marker: c
    text: Ou « ta culpabilité demeure tachée » ; le verbe peut évoquer une marque ou une tache persistante.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car même si
  rationale: 'Dans ce contexte, la tournure a une valeur concessive : même un lavage intensif ne changerait pas le constat qui suit. « Car » conserve aussi le lien avec le contexte précédent.'
- source_word: תְּכַבְּסִי
  choice: tu te laves
  rationale: Le verbe désigne normalement le lavage, notamment celui des vêtements, mais il évoque ici une tentative de purification morale. La forme féminine singulière est conservée, Jérusalem étant interpellée.
- source_word: בַּנֶּתֶר
  choice: avec du natron
  rationale: Le terme désigne un produit minéral alcalin utilisé autrefois pour nettoyer. « Natron » est précis et maintient la réalité ancienne.
- source_word: וְתַרְבִּי לָךְ
  choice: et emploies beaucoup de
  rationale: La formulation hébraïque exprime l'emploi abondant d'un produit. Cette tournure est naturelle en français sans effacer l'idée de quantité.
- source_word: בֹּרִית
  choice: lessive
  rationale: Il s'agit vraisemblablement d'une substance alcaline végétale servant au lavage, et non du savon moderne. « Lessive » convient au contexte et reste accessible.
- source_word: נִכְתָּם
  choice: reste marquée
  rationale: Le passif indique une faute marquée ou tachée de manière persistante. « Reste marquée » rend à la fois le résultat durable et l'image du lavage inefficace.
- source_word: עֲוֺנֵךְ
  choice: ta faute
  rationale: עָוֹן peut désigner l'acte pervers aussi bien que la culpabilité qui en découle. « Faute » préserve cette amplitude mieux qu'un terme limité au seul sentiment de culpabilité.
- source_word: לְפָנַי
  choice: devant moi
  rationale: La formule exprime la présence, le regard et le jugement directs de Dieu dans un français simple et solennel.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: « Déclare » rend naturellement la formule prophétique נְאֻם. « Le Seigneur Yahweh » représente distinctement le titre אֲדֹנָי et le nom divin יהוה.
theological_decisions:
- issue: 'Sens de עָוֹן : acte fautif ou culpabilité résultante'
  choice: ta faute
  alternative: ta culpabilité
  rationale: Le contexte autorise les deux dimensions. « Faute » laisse ouvertes l'iniquité elle-même et la responsabilité qui s'y attache, sans réduire le terme à une seule nuance.
- issue: Représentation de אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction retenue distingue le titre divin du nom propre présent dans le texte consonantique et évite de les fondre silencieusement.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement féminin singulier reflète l'adresse à Jérusalem. L'image concrète du lavage est conservée, avec des notes brèves pour les produits anciens et l'ambiguïté entre faute, culpabilité, marque et tache.
