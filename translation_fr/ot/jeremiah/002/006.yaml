  terminology: « Yahweh » respecte le choix de translittérer le tétragramme. « A fait monter », « a conduits », « sécheresse » et « profonde obscurité » sont appropriés. La note conserve avec justesse l’alternative traditionnelle pour צַלְמָוֶת, sans imposer cette lecture.
