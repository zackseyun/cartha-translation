  text: וְ/לֹ֣א אָמְר֔וּ אַיֵּ֣ה יְהוָ֔ה הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַ/מּוֹלִ֨יךְ אֹתָ֜/נוּ בַּ/מִּדְבָּ֗ר בְּ/אֶ֨רֶץ עֲרָבָ֤ה וְ/שׁוּחָה֙ בְּ/אֶ֨רֶץ֙ צִיָּ֣ה וְ/צַלְמָ֔וֶת בְּ/אֶ֗רֶץ לֹֽא עָ֤בַר בָּ/הּ֙ אִ֔ישׁ וְ/לֹֽא יָשַׁ֥ב אָדָ֖ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/006.yaml
  text: They did not say[a], ‘Where is Yahweh, who brought us up from the land of Egypt, who led us through the wilderness, through a land of desert plain and pit, through a land of drought and deep darkness, through a land where no man passed through and no human dwelt?’
translation:
  language: fr
  text: 'Ils n’ont pas dit : « Où est Yahweh, lui qui nous a fait monter du pays d’Égypte, qui nous a conduits dans le désert, dans une terre de plaine aride et de gouffre, dans une terre de sécheresse et de profonde obscurité[a], dans une terre que personne ne traversait et où aucun être humain n’habitait ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ombre de la mort ».
    reason: Alternative lexicale possible pour צַלְמָוֶת.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: הַמַּעֲלֶה אֹתָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: lui qui nous a fait monter du pays d’Égypte
  rationale: Le hiphil de עלה exprime l’action de faire monter ou de faire sortir vers le haut. Cette formulation conserve l’image hébraïque tout en restant intelligible en français.
- source_word: הַמּוֹלִיךְ אֹתָנוּ
  choice: qui nous a conduits
  rationale: Le hiphil de הלך signifie ici conduire ou mener. « Conduits » est naturel dans le récit du parcours au désert.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: La préposition hébraïque signifie littéralement « dans ». Avec « conduire », le français exprime suffisamment le déplacement sans devoir traduire par « à travers ».
- source_word: עֲרָבָה
  choice: plaine aride
  rationale: Le nom désigne une steppe ou une plaine désertique. « Plaine aride » rend le relief et l’aridité dans un français courant.
- source_word: שׁוּחָה
  choice: ravins
  rationale: Le terme peut désigner une fosse, un creux ou un ravin. Dans la description d’un territoire dangereux, « ravins » donne une image géographique naturelle sans effacer l’idée de creux périlleux.
- source_word: צִיָּה
  choice: sécheresse
  rationale: Le mot évoque l’aridité extrême ou un sol desséché. « Sécheresse » conserve la force de l’image.
- source_word: צַלְמָוֶת
  choice: profonde obscurité
  rationale: Le terme peut désigner une obscurité très profonde, tout en permettant l’interprétation traditionnelle « ombre de la mort ». Le choix contextuel et l’alternative sont tous deux conservés.
- source_word: לֹא עָבַר בָּהּ אִישׁ
  choice: que personne ne traversait
  rationale: Cette formulation rend naturellement en français l’idée qu’aucun individu ne parcourait cette terre désolée.
- source_word: וְלֹא יָשַׁב אָדָם שָׁם
  choice: et où aucun être humain n’habitait
  rationale: אָדָם a ici un sens générique. « Être humain » le distingue de אִישׁ dans le membre précédent et ישב est rendu par l’habitation durable.
theological_decisions:
- issue: Sens de צַלְמָוֶת
  choice: profonde obscurité
  alternative: ombre de la mort
  rationale: Dans cette évocation du désert, le mot décrit vraisemblablement une obscurité ou une détresse extrême. Comme sa formation et son usage permettent aussi la lecture traditionnelle liée à la mort, celle-ci est signalée en note plutôt que supprimée.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « dans une terre » maintient le rythme anaphorique de l’hébreu. Le nom divin est translittéré « Yahweh ». Le marqueur [a] est placé immédiatement après l’expression concernée.
