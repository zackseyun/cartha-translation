  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בֵּ֣ית יַעֲקֹ֑ב וְ/כָֽל מִשְׁפְּח֖וֹת בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/004.yaml
  text: Hear the word of Yahweh[a], O house of Jacob, and all the clans of the house of Israel.
translation:
  language: fr
  text: Écoutez la parole de Yahweh, maison de Jacob, et vous toutes, clans de la maison d’Israël !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel de שׁמע. « Écoutez » exprime en français actuel l’appel direct à entendre et à prendre en compte le message.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Conserve la formule prophétique traditionnelle et sa portée théologique, sans réduire דָּבָר au seul sens de « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בֵּית יַעֲקֹב
  choice: maison de Jacob
  rationale: Préserve l’image collective et l’adresse vocative. Le français n’exige pas l’ajout d’un « ô » absent de l’hébreu.
- source_word: וְכָל מִשְׁפְּחוֹת
  choice: vous tous, clans
  rationale: Rend le lien avec le premier destinataire tout en clarifiant en français que l’appel s’adresse à l’ensemble des groupes de parenté.
- source_word: מִשְׁפְּחוֹת
  choice: clans
  rationale: Le terme désigne ici des groupes de parenté constitutifs d’Israël ; « familles » risquerait d’évoquer seulement des foyers, et « tribus » serait trop large.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Maintient le parallélisme avec « maison de Jacob » et la dimension collective de l’expression.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; la transcription « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
translation_notes:
  register: Français moderne, solennel sans archaïsme. L’impératif pluriel et l’exclamation rendent la vigueur de la sommation prophétique. Aucun marqueur de note n’est nécessaire, puisque « clans » exprime directement le sens contextuel de מִשְׁפְּחוֹת.
