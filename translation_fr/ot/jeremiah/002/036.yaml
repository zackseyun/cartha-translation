source:
  edition: WLC
  text: מַה תֵּזְלִ֥י מְאֹ֖ד לְ/שַׁנּ֣וֹת אֶת דַּרְכֵּ֑/ךְ גַּ֤ם מִ/מִּצְרַ֨יִם֙ תֵּב֔וֹשִׁי כַּ/אֲשֶׁר בֹּ֖שְׁתְּ מֵ/אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/036.yaml
  text: Why do you go about so much[a], changing your way? You will also be put to shame by Egypt[b], as you were put to shame by Assyria.
translation:
  language: fr
  text: Pourquoi t’agites-tu tant pour changer de voie[a] ? Tu connaîtras aussi la honte à cause de l’Égypte[b], comme tu l’as connue à cause de l’Assyrie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi vas-tu tantôt ici, tantôt là pour changer de route ? » L’expression hébraïque peut souligner un mouvement instable dans la recherche d’alliances changeantes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Tu seras aussi déçue par l’Égypte, comme tu l’as été par l’Assyrie. » Le verbe hébreu peut exprimer la honte ou la déception causée par une confiance trompée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּזְלִי מְאֹד
  choice: Pourquoi vas-tu tant de-ci de-là
  rationale: La question exprime un reproche. « De-ci de-là » rend le mouvement agité ou inconstant suggéré dans ce contexte, sans lui attribuer explicitement une connotation sexuelle ou morale.
- source_word: לְשַׁנּוֹת אֶת דַּרְכֵּךְ
  choice: pour changer de voie
  rationale: L’infinitif exprime ici le but. « Voie » conserve l’amplitude de דֶּרֶךְ, qui peut désigner aussi bien la conduite que l’orientation politique.
- source_word: גַּם
  choice: aussi
  rationale: Le terme ajoute l’Égypte à l’Assyrie comme autre source de honte et de déception.
- source_word: מִמִּצְרַיִם תֵּבֹשִׁי
  choice: Tu connaîtras aussi la honte à cause de l’Égypte
  rationale: בושׁ peut évoquer la honte comme la déception née d’une confiance trompée. Cette formulation garde la honte au premier plan tout en présentant l’Égypte comme sa cause ou son occasion.
- source_word: כַּאֲשֶׁר בֹּשְׁתְּ מֵאַשּׁוּר
  choice: comme tu l’as connue à cause de l’Assyrie
  rationale: La reprise de « la honte » maintient le parallélisme entre l’échec passé lié à l’Assyrie et celui qui viendra par l’Égypte.
theological_decisions:
- issue: Portée de « ta voie » dans le reproche prophétique
  choice: Maintenir le terme général « voie »
  alternative: Préciser « orientation politique » ou « conduite »
  rationale: Le contexte vise les changements d’alliances étrangères, mais le reproche prophétique porte aussi une dimension morale et spirituelle. Le français conserve cette tension sans réduire le sens à un seul domaine.
- issue: Sens de la honte liée à l’Égypte et à l’Assyrie
  choice: Parler de « connaître la honte à cause de » ces puissances
  alternative: « être déçue par » ou « être couverte de honte par »
  rationale: Le verbe hébreu peut décrire honte, humiliation ou attente déçue. Le choix retenu préserve la notion explicite de honte sans transformer nécessairement les nations en agents directs de l’humiliation.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier féminin implicite vise Juda/Jérusalem. « De-ci de-là » rend concrètement l’agitation du texte, tandis que « voie » conserve à la fois les dimensions politique, morale et spirituelle.
