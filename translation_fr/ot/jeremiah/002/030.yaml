base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/030.yaml
  text: In vain I struck your sons[a]; they accepted no correction[c][b]. Your sword devoured your prophets like a destroying lion.
translation:
  language: fr
  text: 'C’est en vain que j’ai frappé vos fils[a] : ils n’ont accepté aucune correction[b]. Votre épée a dévoré vos prophètes comme un lion destructeur[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos enfants » ; l’hébreu dit littéralement « vos fils ».
    reason: lexical_alternative
  - marker: b
    text: Ou « discipline » ou « instruction » ; le mot hébreu peut désigner à la fois une mesure corrective et un enseignement moral.
    reason: lexical_alternative
  - marker: c
    text: Ou « comme un lion qui détruit », ou « comme un lion dévorant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשָּׁוְא
  choice: C’est en vain
  rationale: La construction לַשָּׁוְא exprime ici l’absence de résultat. « C’est en vain que » est idiomatique en français et souligne que les coups n’ont pas produit l’effet correctif recherché.
- source_word: הִכֵּיתִי
  choice: j’ai frappé
  rationale: Le hiphil de נכה signifie couramment « frapper ». Ce choix reste direct sans préciser à tort que les personnes ont été tuées.
- source_word: בְּנֵיכֶם
  choice: vos fils
  rationale: Le texte hébreu emploie littéralement le masculin pluriel « vos fils ». La possibilité d’un sens collectif plus large est signalée en note.
- source_word: מוּסָר
  choice: correction
  rationale: מוּסָר peut désigner la correction, la discipline ou l’instruction. Après « j’ai frappé », « correction » rend naturellement la visée éducative et corrective du jugement.
- source_word: לֹא לָקָחוּ
  choice: ils n’ont accepté aucune
  rationale: Avec מוּסָר, לקח signifie idiomatiquement recevoir ou accepter la correction. « N’ont accepté aucune » exprime clairement le refus.
- source_word: אָכְלָה
  choice: a dévoré
  rationale: Le verbe אכל personnifie l’épée comme une force qui dévore. Le français conserve cette image vive.
- source_word: חַרְבְּכֶם
  choice: Votre épée
  rationale: Le possessif hébreu est maintenu et attribue la violence au peuple auquel Dieu s’adresse.
- source_word: נְבִיאֵיכֶם
  choice: vos prophètes
  rationale: Le possessif est conservé, sans trancher si ces prophètes venaient du peuple ou lui avaient été envoyés.
- source_word: כְּאַרְיֵה מַשְׁחִית
  choice: comme un lion destructeur
  rationale: Cette formulation garde la comparaison et la valeur participiale de מַשְׁחִית, tout en restant compréhensible en français moderne.
theological_decisions:
- issue: Portée de בְּנֵיכֶם
  choice: Traduction littérale « vos fils », avec une variante en note
  alternative: « vos enfants »
  rationale: Le masculin pluriel est explicite, mais « fils » peut aussi représenter collectivement les membres ou descendants du peuple. La note préserve cette amplitude sans la résoudre dans le texte.
- issue: Nature de מוּסָר
  choice: « correction »
  alternative: « discipline » ou « instruction »
  rationale: Le contexte associe le terme aux coups infligés par Dieu, ce qui favorise la correction, mais le champ pédagogique du mot demeure signalé en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est préservé, ainsi que la métaphore violente de l’épée qui dévore. Les termes « frappé », « correction » et « lion destructeur » restent proches de l’hébreu sans archaïsme.
