  text: מִנְעִ֤י רַגְלֵ/ךְ֙ מִ/יָּחֵ֔ף ו/גורנ/ך מִ/צִּמְאָ֑ה וַ/תֹּאמְרִ֣י נוֹאָ֔שׁ ל֕וֹא כִּֽי אָהַ֥בְתִּי זָרִ֖ים וְ/אַחֲרֵי/הֶ֥ם אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/025.yaml
  text: Keep your feet from going unshod and your throat from thirst. But you said[a], “It is hopeless! No, for I have loved strangers, and after them I will go.”
translation:
  language: fr
  text: 'Préserve tes pieds de marcher nus,

    et ta gorge de souffrir de la soif.

    Mais tu as dit : « C’est sans espoir ! Non !

    Car j’ai aimé des étrangers[a],

    et je les suivrai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gens d’ailleurs ». Dans ce contexte, le terme peut désigner métaphoriquement des dieux étrangers, des amants étrangers ou des nations étrangères recherchées comme alliées.
    reason: Alternative lexicale et maintien de l’ambiguïté du référent.
lexical_decisions:
- source_word: מִנְעִי רַגְלֵךְ מִיָּחֵף
  choice: Épargne à tes pieds de marcher nus
  rationale: L’impératif féminin singulier s’adresse à Juda personnifiée. Le singulier collectif « ton pied » est rendu naturellement par « tes pieds », tandis que « marcher nus » conserve l’image d’une poursuite épuisante qui laisse les pieds sans protection.
- source_word: וְגֹרֹנֵךְ מִצִּמְאָה
  choice: et à ta gorge de souffrir de la soif
  rationale: « Gorge » correspond au sens contextuel de גָּרוֹן devant « soif ». La tournure française explicite sobrement l’effet de la soif sans effacer l’image corporelle.
- source_word: וַתֹּאמְרִי
  choice: Mais tu as dit
  rationale: 'Le waw prend ici une valeur adversative : la réponse de Juda s’oppose à l’exhortation. Le passé composé rend naturellement l’accompli narratif en français.'
- source_word: נוֹאָשׁ
  choice: C’est sans espoir !
  rationale: Cette formule exprime le découragement ou la résignation, sans préciser à tort s’il est impossible de changer ou inutile d’essayer.
- source_word: לֹא
  choice: Non !
  rationale: Le terme marque ici un refus énergique de l’exhortation précédente.
- source_word: כִּי אָהַבְתִּי
  choice: Car j’aime
  rationale: L’accompli hébreu décrit ici un attachement acquis et persistant. Le présent français exprime plus naturellement cet état actuel que le littéral « j’ai aimé », qui pourrait suggérer un amour révolu.
- source_word: זָרִים
  choice: les étrangers
  rationale: Le terme désigne littéralement des êtres étrangers. Cette formulation conserve l’ouverture de la métaphore entre amants, dieux et puissances étrangères.
- source_word: וְאַחֲרֵיהֶם אֵלֵךְ
  choice: et je les suivrai
  rationale: Cette formulation française naturelle conserve l’idée hébraïque d’aller derrière eux et la valeur prospective de l’inaccompli.
theological_decisions:
- issue: Référent des « étrangers » dans la métaphore d’infidélité
  choice: Maintenir « les étrangers » dans le texte principal.
  alternative: Préciser « les dieux étrangers », « les amants étrangers » ou « les nations étrangères ».
  rationale: Le contexte associe l’idolâtrie, l’infidélité conjugale figurée et la recherche d’alliances étrangères. Une désignation plus précise trancherait une polysémie probablement intentionnelle.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme corporel est conservé, tout comme le ton abrupt et résolu de la réponse de Juda.
