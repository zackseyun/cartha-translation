  naturalness: La première ligne demande une correction syntaxique. « Préserve tes pieds de marcher nus » est naturel, clair et maintient l’image corporelle et l’exhortation à ne pas s’épuiser dans cette poursuite. « Des étrangers » est plus naturel et plus proche du pluriel indéfini sans article en hébreu que « les étrangers ».
  terminology: « Gorge » convient à גָּרוֹן dans son association avec la soif. « Étrangers » maintient volontairement le référent ouvert entre amants, divinités et puissances étrangères; la note explicite cette polysémie sans l’imposer au texte.
