id: JER.2.7
reference: Jeremiah 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל אֶ֣רֶץ הַ/כַּרְמֶ֔ל לֶ/אֱכֹ֥ל פִּרְיָ֖/הּ וְ/טוּבָ֑/הּ וַ/תָּבֹ֨אוּ֙ וַ/תְּטַמְּא֣וּ אֶת אַרְצִ֔/י וְ/נַחֲלָתִ֥/י שַׂמְתֶּ֖ם לְ/תוֹעֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/007.yaml
  text: I brought you into a fertile land to eat its fruit and its goodness[a], but when you came in[b], you defiled my land and made my inheritance an abomination.
translation:
  language: fr
  text: Je vous ai fait entrer dans une terre fertile[a], pour y manger son fruit et ses biens. Mais, quand vous y êtes entrés, vous avez souillé ma terre et fait de mon héritage une abomination.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une terre de vergers » ; le mot hébreu peut désigner une terre riche, cultivée et féconde. Certains y voient le nom propre Carmel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִיא
  choice: Je vous ai fait entrer
  rationale: Le hifil de בוא exprime ici l’action de faire venir ou entrer. Cette formulation conserve l’initiative divine et prépare la reprise de וַתָּבֹאוּ.
- source_word: אֶרֶץ הַכַּרְמֶל
  choice: un pays fertile
  rationale: Dans ce contexte, כַּרְמֶל désigne vraisemblablement une terre riche, cultivée et féconde plutôt que le nom propre Carmel.
- source_word: לֶאֱכֹל פִּרְיָהּ וְטוּבָהּ
  choice: pour que vous mangiez ses fruits et ce qu’il a de bon
  rationale: La proposition rend la valeur de but de l’infinitif, garde le sens concret de פְּרִי et laisse à טוּב son ampleur, sans le limiter aux seuls produits agricoles.
- source_word: וַתָּבֹאוּ
  choice: quand vous y êtes entrés
  rationale: La subordination temporelle rend naturellement en français la progression du récit et met en relief le contraste entre le don de Dieu et la conduite du peuple.
- source_word: וַתְּטַמְּאוּ
  choice: vous avez souillé
  rationale: « Souiller » conserve la forte portée morale et cultuelle du piel de טמא, tout en étant plus naturel ici que « rendre impur ».
- source_word: אַרְצִי
  choice: mon pays
  rationale: Le possessif est maintenu afin de souligner que le pays appartient à Dieu.
- source_word: נַחֲלָתִי
  choice: mon héritage
  rationale: « Héritage » préserve la valeur possessive et l’arrière-plan d’alliance de נַחֲלָה, sans réduire le terme à un simple bien foncier.
- source_word: שַׂמְתֶּם לְתוֹעֵבָה
  choice: fait de mon héritage une abomination
  rationale: Cette expression conserve la force morale et religieuse de תּוֹעֵבָה ainsi que le registre solennel du texte.
theological_decisions:
- issue: Sens de כַּרְמֶל
  choice: 'Nom commun : « pays fertile »'
  alternative: 'Nom propre : « pays du Carmel »'
  rationale: La mention immédiate des fruits et de ce que le pays a de bon favorise le sens descriptif d’une terre féconde, tout en laissant l’autre analyse en note.
- issue: Portée de טוּב appliqué au pays
  choice: « ce qu’il a de bon »
  alternative: « son abondance » ou « ses biens »
  rationale: Le terme hébreu est plus large que les seules récoltes. La formulation retenue préserve cette amplitude sans imposer une interprétation exclusivement agricole.
translation_notes:
  register: Français international moderne, naturel et solennel. La répétition du mouvement d’entrée est conservée, de même que les termes forts « souillé », « héritage » et « abomination », afin de respecter la tension morale, cultuelle et théologique de l’hébreu.
