  yaml_path: translation/ot/jeremiah/002/016.yaml
  text: Even the sons of Noph and Tahpanhes have grazed your crown.
translation:
  language: fr
  text: Même les habitants de Noph[a][b] et de Tahpanès t’ont brouté[c] le crâne[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de Noph ». En hébreu, « fils de » peut désigner les habitants d’un lieu.'
    reason: lexical_alternative
  - marker: b
    text: Noph est généralement identifiée à Memphis, en Égypte.
    reason: cultural_note
  - marker: c
    text: La forme hébraïque est difficile. Elle peut évoquer l’action de « paître », « brouter » ou « se nourrir de » ; beaucoup de traductions comprennent, selon le contexte et une autre analyse lexicale, « briser » ou « écraser ».
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « le sommet de la tête » ou « le cuir chevelu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: Rend la valeur additive et emphatique du terme dans le contexte.
- source_word: בְּנֵי
  choice: les habitants de
  rationale: Dans une expression liée à des villes, l’hébreu « fils de » désigne naturellement leurs habitants; une traduction littérale par « fils de » serait moins claire en français actuel.
- source_word: נֹף
  choice: Noph
  rationale: Conserve la forme hébraïque du nom de lieu, avec son identification habituelle indiquée en note.
- source_word: תחפנס
  choice: Tahpanès
  rationale: Translittération française courante de ce nom de lieu égyptien.
- source_word: יִרְעוּךְ
  choice: t’ont brouté
  rationale: Préserve le sens concret et l’image insolite du verbe רעה, « paître, brouter, se nourrir de », sans l’aplanir en « briser » ou « écraser ».
- source_word: קָדְקֹד
  choice: le sommet de la tête
  rationale: Exprime précisément le haut ou la partie supérieure de la tête et évite l’ambiguïté française de « couronne ».
