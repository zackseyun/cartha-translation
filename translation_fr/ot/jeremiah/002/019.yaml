revisions:
- from: Ta méchanceté te corrigera, et tes infidélités[a] te reprendront. Sache donc et vois combien il est mauvais et amer d’abandonner Yahvé, ton Dieu, et que la crainte de moi n’est pas en toi[b], déclare le Seigneur Yahvé, des armées[c].
  to: Ta méchanceté te corrigera, et tes infidélités[a] te reprendront. Sache donc et vois qu’il est mauvais et amer d’abandonner Yahvé, ton Dieu, et que la crainte que l’on doit avoir de moi ne t’habite pas, déclare le Seigneur Yahvé des armées[c].
  rationale: La révision retire l’intensification non nécessaire de « combien », rend plus idiomatiquement l’absence de crainte révérencielle tout en préservant la forme nominale par une note littérale, et réunit correctement les trois composantes du titre divin. L’ancre b est supprimée du texte, car la note b est désormais informative sur la tournure littérale plutôt qu’une alternative nécessaire à la lecture retenue.
