id: JER.2.19
reference: Jeremiah 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תְּיַסְּרֵ֣/ךְ רָעָתֵ֗/ךְ וּ/מְשֻֽׁבוֹתַ֨יִ/ךְ֙ תּוֹכִחֻ֔/ךְ וּ/דְעִ֤י וּ/רְאִי֙ כִּי רַ֣ע וָ/מָ֔ר עָזְבֵ֖/ךְ אֶת יְהוָ֣ה אֱלֹהָ֑יִ/ךְ וְ/לֹ֤א פַחְדָּתִ/י֙ אֵלַ֔יִ/ךְ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/019.yaml
  text: Your evil will discipline you[a], and your apostasies will reprove you. So know and see that it is evil and bitter for you to forsake Yahweh your God, and that my fear is not in you[c][b], declares the Lord GOD of hosts.
translation:
  language: fr
  text: Ta méchanceté te corrigera, et tes infidélités[a] te reprendront. Sache donc et vois qu’il est mauvais et amer d’abandonner Yahvé, ton Dieu, et que la crainte que l’on doit avoir de moi ne t’habite pas, déclare le Seigneur Yahvé des armées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes apostasies » ou « tes égarements loin de Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: Les « armées » peuvent évoquer les armées célestes aussi bien que les forces placées sous l’autorité de Yahvé ; l’expression hébraïque ne précise pas ici leur nature.
    reason: cultural_note
lexical_decisions:
- source_word: תְּיַסְּרֵךְ
  choice: te corrigera
  rationale: Le piel de יסר associe correction et discipline, avec une possible dimension punitive. « Corrigera » garde cette portée tout en restant naturel en français actuel.
- source_word: רָעָתֵךְ
  choice: ta méchanceté
  rationale: Dans le contexte de l’abandon de Yahvé, le sens moral de רעה est prioritaire. « Méchanceté » évite de comprendre ici le mot comme le simple malheur qui en résulte.
- source_word: מְשֻׁבוֹתַיִךְ
  choice: tes infidélités
  rationale: Le terme désigne des détournements répétés de Yahvé et donc une infidélité d’alliance. « Infidélités » exprime cette dimension sans employer le terme plus technique « apostasies ».
- source_word: תּוֹכִחֻךְ
  choice: te reprendront
  rationale: Le hiphil de יכח peut signifier reprendre, convaincre de faute ou mettre la culpabilité en évidence. Ici, les infidélités elles-mêmes accusent et reprennent Juda.
- source_word: וּדְעִי וּרְאִי
  choice: Sache donc et vois
  rationale: Les deux impératifs féminins singuliers sont conservés. « Donc » rend le lien logique avec la discipline annoncée dans la phrase précédente.
- source_word: רַע וָמָר
  choice: mauvais et amer
  rationale: Le couple décrit à la fois le caractère condamnable et la conséquence douloureuse de l’abandon de Yahvé.
- source_word: עָזְבֵךְ אֶת־יְהוָה אֱלֹהָיִךְ
  choice: d’abandonner Yahvé, ton Dieu
  rationale: Cette formulation française rend naturellement l’infinitif construit avec suffixe et maintient son lien avec « mauvais et amer ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle rend explicitement le nom divin YHWH au lieu de le remplacer par un titre.
- source_word: וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: et que la crainte de moi n’est pas en toi
  rationale: La formulation conserve l’expression nominale hébraïque et son insistance sur l’absence de crainte révérencielle, sans la réduire au simple verbe « craindre ».
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: déclare le Seigneur Yahvé, des armées
  rationale: « Déclare » rend idiomatiquement נְאֻם. « Seigneur Yahvé » distingue le titre אֲדֹנָי du nom יְהוָה, et « des armées » conserve l’image de צְבָאוֹת sans préciser indûment la nature de ces armées.
theological_decisions:
- issue: Sens de מְשֻׁבוֹתַיִךְ dans le contexte de l’alliance
  choice: tes infidélités
  alternative: tes apostasies ; tes égarements
  rationale: Le mot vise le fait de se détourner de Yahvé. « Infidélités » garde la dimension relationnelle et religieuse de cette rupture, tandis que la note signale une traduction plus explicite et plus technique.
- issue: Forme nominale de וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: la crainte de moi n’est pas en toi
  alternative: tu n’as aucune crainte de moi ; tu ne me crains pas
  rationale: La traduction maintient l’accent hébraïque sur l’absence de la « crainte » révérencielle elle-même. Une formulation française plus idiomatique est donnée en note.
- issue: Titre divin אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur Yahvé, des armées
  alternative: le Seigneur Yahvé, maître des armées ; le Seigneur, Yahvé des armées
  rationale: Le choix évite d’ajouter « Dieu » ou « maître », absents de la formule hébraïque, tout en préservant la juxtaposition du titre, du nom divin et de צְבָאוֹת. La ponctuation française marque l’unité du titre final sans résoudre la portée exacte des « armées ».
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement suit l’adresse hébraïque au féminin singulier, qui personnifie Juda ou Jérusalem. Les répétitions et les deux impératifs sont maintenus. Le nom divin est rendu par « Yahvé ». La tournure finale, volontairement compacte, conserve les éléments du titre hébraïque sans ajouter un nom comme « Dieu » ou une fonction comme « maître ».
