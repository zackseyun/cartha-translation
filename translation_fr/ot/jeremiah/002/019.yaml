review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : la conduite mauvaise et les détournements de Juda deviennent eux-mêmes instruments de correction et de réprimande. Toutefois, « combien il est mauvais » introduit une nuance intensive qui n’est pas explicitement portée par כִּי, et la ponctuation de « le Seigneur Yahvé, des armées » dissocie de façon peu naturelle les éléments d’un titre unique.'
  naturalness: Le texte est globalement fluide et d’un registre approprié. « La crainte de moi n’est pas en toi » est néanmoins peu idiomatique en français moderne et peut être remplacé par une formulation nominale claire qui conserve l’idée de la crainte due à Yahvé.
  terminology: '« Méchanceté », « infidélités », « Yahvé » et « armées » sont des choix recevables. Le titre final doit être formulé comme une unité : « le Seigneur Yahvé des armées ».'
  issues:
  - severity: medium
    issue: « combien il est mauvais et amer »
    rationale: Le כִּי hébreu introduit le constat que l’abandon de Yahvé est mauvais et amer ; « combien » ajoute une idée de degré. « Qu’il est mauvais et amer » rend le lien plus directement.
  - severity: medium
    issue: « la crainte de moi n’est pas en toi »
    rationale: Cette expression est calquée sur l’hébreu mais demeure maladroite et ambiguë en français. « La crainte que l’on doit avoir de moi ne t’habite pas » conserve l’expression nominale tout en explicitant naturellement le génitif objectif.
  - severity: low
    issue: Virgule dans « le Seigneur Yahvé, des armées »
    rationale: La virgule sépare artificiellement צְבָאוֹת du titre divin. Le groupe doit se lire comme un titre continu.
  revised_text: Ta méchanceté te corrigera, et tes infidélités[a] te reprendront. Sache donc et vois qu’il est mauvais et amer d’abandonner Yahvé, ton Dieu, et que la crainte que l’on doit avoir de moi ne t’habite pas, déclare le Seigneur Yahvé des armées[c].
  revised_footnotes:
  - marker: a
    text: 'Ou : « tes apostasies » ou « tes égarements loin de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « ma crainte n’est pas en toi ». Ou, plus naturellement : « tu n’as aucune crainte de moi ».'
    reason: lexical_alternative
  - marker: c
    text: Les « armées » peuvent évoquer les armées célestes aussi bien que les forces placées sous l’autorité de Yahvé ; l’expression hébraïque ne précise pas ici leur nature.
    reason: cultural_note
  revision_rationale: La révision retire l’intensification non nécessaire de « combien », rend plus idiomatiquement l’absence de crainte révérencielle tout en préservant la forme nominale par une note littérale, et réunit correctement les trois composantes du titre divin. L’ancre b est supprimée du texte, car la note b est désormais informative sur la tournure littérale plutôt qu’une alternative nécessaire à la lecture retenue.
