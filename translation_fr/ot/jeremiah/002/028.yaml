id: JER.2.28
reference: Jeremiah 2:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַיֵּ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ לָּ֔/ךְ יָק֕וּמוּ אִם יוֹשִׁיע֖וּ/ךָ בְּ/עֵ֣ת רָעָתֶ֑/ךָ כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/028.yaml
  text: But where are your gods that you made for yourself? Let them arise[a], if they can save you in the time of your trouble. For your gods, Judah[b], are as many as your cities.
translation:
  language: fr
  text: Mais où sont tes dieux, ceux que tu t’es fabriqués ? Qu’ils se lèvent, s’ils peuvent te sauver au temps de ton malheur[a] ! Car tes dieux sont aussi nombreux que tes villes, Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « malheur » désigne une calamité ou une catastrophe, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: Mais où sont
  rationale: אַיֵּה demande où se trouvent les dieux; le וְ prend ici une valeur discursive adversative qui convient au reproche prophétique.
- source_word: אֱלֹהֶיךָ
  choice: tes dieux
  rationale: Le pluriel désigne, dans ce contexte, les divinités fabriquées par Juda.
- source_word: אֲשֶׁר עָשִׂיתָ לָּךְ
  choice: ceux que tu t’es fabriqués
  rationale: Cette formulation naturelle conserve à la fois l’idée de fabrication humaine et la nuance réflexive de לָּךְ.
- source_word: יָקוּמוּ
  choice: Qu’ils se lèvent
  rationale: L’imparfait à valeur jussive lance aux idoles le défi ironique d’intervenir.
- source_word: אִם יוֹשִׁיעוּךָ
  choice: s’ils peuvent te sauver
  rationale: Après le défi, אִם introduit une condition empreinte de doute; « peuvent » rend clairement cette mise à l’épreuve sans changer son sens.
- source_word: בְּעֵת רָעָתֶךָ
  choice: au temps de ton malheur
  rationale: רָעָה désigne ici l’adversité ou la catastrophe qui atteint Juda, non le mal moral.
- source_word: כִּי מִסְפַּר עָרֶיךָ הָיוּ אֱלֹהֶיךָ
  choice: Car tes dieux sont aussi nombreux que tes villes
  rationale: La tournure française exprime naturellement la correspondance numérique indiquée par מִסְפַּר, tandis que le présent rend l’état constaté par הָיוּ.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Le nom propre est rendu selon sa forme française usuelle et fonctionne ici comme une apostrophe.
theological_decisions:
- issue: Référent de « tes dieux »
  choice: Les idoles ou faux dieux fabriqués par Juda
  alternative: Le Seigneur ou des divinités non explicitement qualifiées
  rationale: La relative « ceux que tu t’es fabriqués » exclut le Seigneur comme référent et maintient la polémique du texte contre l’idolâtrie.
- issue: Portée du défi « s’ils peuvent te sauver »
  choice: Défi ironique mettant en doute la capacité des idoles à délivrer Juda
  alternative: 'Simple condition neutre: « s’ils te sauvent »'
  rationale: L’enchaînement jussif-conditionnel présente une sommation rhétorique, sans qu’il soit nécessaire d’ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne masculine singulière adressées collectivement à Juda. L’exclamation souligne le défi rhétorique sans ajouter de contenu au texte.
