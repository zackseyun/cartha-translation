source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le waw consécutif avec היה introduit l’événement de parole. La tournure française « la parole… fut adressée » exprime naturellement cette venue sans reproduire littéralement « et il arriva ».
- source_word: דְבַר
  choice: la parole
  rationale: « La parole » conserve la formule prophétique récurrente דְבַר יְהוָה et le caractère de communication divine, contrairement à « message », plus explicatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement en français la direction exprimée par la préposition אֶל et le suffixe de première personne.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le contenu de la parole qui suit. « En ces termes : » remplit cette fonction avec naturel en français et prépare la citation du verset suivant.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans imposer la substitution traditionnelle par un titre.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la formule prophétique tout en évitant le calque peu naturel « Et la parole de Yahweh vint à moi, disant ».
