  to: 'Va proclamer à Jérusalem : « Voici ce que dit Yahweh : Je garde le souvenir de l’attachement fidèle de ta jeunesse, de l’amour de tes fiançailles[a], lorsque tu me suivais dans le désert, dans une terre non ensemencée. »'
