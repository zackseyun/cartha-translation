  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ בְ/אָזְנֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה זָכַ֤רְתִּי לָ/ךְ֙ חֶ֣סֶד נְעוּרַ֔יִ/ךְ אַהֲבַ֖ת כְּלוּלֹתָ֑יִ/ךְ לֶכְתֵּ֤/ךְ אַחֲרַ/י֙ בַּ/מִּדְבָּ֔ר בְּ/אֶ֖רֶץ לֹ֥א זְרוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/002.yaml
  text: 'Go and proclaim in the hearing of Jerusalem[a], saying, ‘Thus says Yahweh: I remember for you the faithful love of your youth, the love of your betrothal, when you went after me in the wilderness[b], in a land not sown.’'
translation:
  language: fr
  text: 'Va proclamer à Jérusalem : « Voici ce que dit Yahweh : Je garde le souvenir de l’attachement fidèle de ta jeunesse, de l’amour de tes fiançailles[a], lorsque tu me suivais dans le désert, dans une terre non ensemencée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « l’amour de tes fiançailles » peut aussi se comprendre comme « l’amour de tes jours de jeune mariée » ou « l’amour de tes noces ». Le terme hébreu évoque une relation nuptiale sans préciser avec certitude son étape exacte.
    reason: alternative_reading
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: Va proclamer
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’ordre. « Va proclamer » exprime naturellement le déplacement et l’annonce publique prophétique.
- source_word: בְאָזְנֵי יְרוּשָׁלִַם
  choice: aux oreilles de Jérusalem
  rationale: Cette formulation conserve l’image hébraïque et la personnification de Jérusalem, tout en restant intelligible en français.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formule française actuelle et digne correspondant à la formule prophétique de messager; le nom divin est translittéré.
- source_word: זָכַרְתִּי לָךְ
  choice: Je me souviens de
  rationale: Le français ne peut rendre naturellement le datif hébreu par « pour toi » ici. « Se souvenir de » transmet le rapport à Jérusalem sans tournure artificielle.
- source_word: חֶסֶד
  choice: affection fidèle
  rationale: Cette expression réunit la chaleur relationnelle et la fidélité durable que peut porter חֶסֶד dans ce contexte nuptial.
- source_word: נְעוּרַיִךְ
  choice: ta jeunesse
  rationale: Rendu direct de l’image des débuts d’Israël dans sa relation avec Yahweh.
- source_word: אַהֲבַת כְּלוּלֹתָיִךְ
  choice: l’amour de tes fiançailles
  rationale: Conserve la métaphore nuptiale sans décider si le terme vise précisément les fiançailles, les noces ou les premiers temps du mariage.
- source_word: לֶכְתֵּךְ אַחֲרַי
  choice: quand tu me suivais
  rationale: Rend naturellement en français la construction temporelle et l’idée d’aller derrière Yahweh.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme français courant pour le cadre inculte de l’exode et convient au contraste avec une terre ensemencée.
- source_word: בְּאֶרֶץ לֹא זְרוּעָה
  choice: sur une terre où rien n’était semé
  rationale: Rend clairement l’image agricole d’une terre non ensemencée, sans transformer explicitement celle-ci en jugement sur sa fertilité.
theological_decisions:
- issue: Métaphore conjugale décrivant les débuts de la relation entre Israël et Yahweh
  choice: l’amour de tes fiançailles
  alternative: l’amour de ton temps de jeune mariée
  rationale: Le texte présente Jérusalem ou Israël comme une femme aux premiers temps de son lien conjugal avec Yahweh. Le rendu maintient cette image et son imprécision chronologique plutôt que de l’assimiler à un modèle doctrinal particulier.
- issue: Évaluation positive de la marche d’Israël au désert
  choice: Conserver l’éloge apparent sans l’harmoniser avec les récits de rébellion au désert
  alternative: Interpréter explicitement le souvenir comme celui de l’amour de Yahweh envers Israël
  rationale: La syntaxe associe naturellement l’affection et l’amour à la jeunesse nuptiale de la destinataire, puis à sa marche derrière Yahweh. La traduction préserve cette tension avec d’autres portraits bibliques du désert.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification féminine de Jérusalem est maintenue par le tutoiement et les possessifs féminins implicites dans le contexte. « Aux oreilles de Jérusalem » conserve volontairement l’image concrète de l’hébreu.
