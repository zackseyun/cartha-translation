    issue: 'Formulation calquée et peu naturelle : « Va proclamer aux oreilles de Jérusalem ».'
    rationale: L’hébreu dit littéralement « aux oreilles de Jérusalem », mais le français moderne ne dit pas naturellement « proclamer aux oreilles de ». « À Jérusalem » conserve la destination de l’annonce sans introduire un calque maladroit.
  - severity: medium
    issue: L’appel de note [a] est placé à la fin de la phrase, alors que la note traite de « l’amour de tes fiançailles ».
    rationale: L’ancre doit suivre l’expression concernée afin que le lecteur identifie clairement l’alternative de traduction.
  - severity: low
    issue: « Affection fidèle » est moins idiomatique et un peu moins évocateur de la loyauté d’alliance que « attachement fidèle ».
    rationale: Dans ce contexte où Jérusalem/Israël est décrite comme suivant Yahweh, « attachement fidèle » exprime clairement une dévotion relationnelle sans surinterpréter le terme hébreu.
