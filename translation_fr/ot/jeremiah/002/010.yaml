  text: כִּ֣י עִבְר֞וּ אִיֵּ֤י כִתִּיִּים֙ וּ/רְא֔וּ וְ/קֵדָ֛ר שִׁלְח֥וּ וְ/הִֽתְבּוֹנְנ֖וּ מְאֹ֑ד וּ/רְא֕וּ הֵ֥ן הָיְתָ֖ה כָּ/זֹֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/010.yaml
  text: For cross over to the coasts of Kittim and see[a]; send to Kedar and consider carefully[b]; see whether there has ever been anything like this.
translation:
  language: fr
  text: Car allez jusqu’aux îles de Kittim[a] et voyez ; envoyez à Qédar[b], examinez très attentivement, et voyez si une chose pareille s’est produite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « îles » peut aussi désigner des régions côtières. Kittim renvoie probablement à Chypre ou, plus largement, aux terres maritimes de l’ouest.
    reason: lexical_alternative
  - marker: b
    text: Qédar désigne des tribus arabes ou leur territoire à l’est ou au sud-est. Avec Kittim, ce nom forme une comparaison géographique allant de l’ouest à l’est.
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: traversez jusqu’aux
  rationale: L’impératif pluriel appelle à se rendre au-delà, vers une région maritime lointaine. Cette formulation conserve l’idée concrète de déplacement tout en restant naturelle en français.
- source_word: אִיֵּי כִתִּיִּים
  choice: aux îles de Kittim
  rationale: אִיִּים peut désigner des îles ou des régions côtières. « Îles » convient au cadre maritime associé à Kittim, tout en laissant la note signaler l’extension possible du terme.
- source_word: וּרְאוּ
  choice: et regardez / Regardez
  rationale: La répétition de ראה est maintenue afin de préserver l’insistance rhétorique sur l’observation directe.
- source_word: וְקֵדָר שִׁלְחוּ
  choice: envoyez des messagers à Qédar
  rationale: L’hébreu laisse implicite ce qui doit être envoyé. Le français exige plus naturellement un complément ; « des messagers » explicite l’action vraisemblablement sous-entendue sans préciser le contenu de l’enquête.
- source_word: וְהִתְבּוֹנְנוּ מְאֹד
  choice: examinez attentivement
  rationale: Le hitpael de בין exprime ici une observation réfléchie et approfondie, renforcée par מְאֹד. « Examinez attentivement » rend à la fois l’enquête et son intensité.
- source_word: הֵן הָיְתָה כָּזֹאת
  choice: Regardez si pareille chose s’est produite !
  rationale: La tournure conserve la question implicite et l’étonnement du texte hébreu, sans ajouter « jamais », qui n’est pas exprimé lexicalement.
