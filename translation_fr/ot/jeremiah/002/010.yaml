    rationale: Le כי initial est ici causal/exhortatif (« Car »), et non simplement une particule affirmative ou emphatique.
  - severity: medium
    issue: Ajout de « des messagers »
    rationale: שִׁלְחוּ (« envoyez ») ne précise pas ce qui est envoyé. L’ajout est plausible, mais il réduit une ellipse que le texte source maintient.
  - severity: low
    issue: Placement des ancres de notes
    rationale: La note a concerne « îles de Kittim », mais son ancre est placée après « regardez » ; la note b concerne Qédar, mais elle est placée après « attentivement ».
  - severity: low
    issue: Ponctuation finale exclamative
    rationale: La séquence הֵן ... ? appelle à constater si un tel fait s’est produit ; une question rend plus justement sa force rhétorique.
