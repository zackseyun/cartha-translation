- from: Oui, traversez jusqu’aux îles de Kittim et regardez[a] ; envoyez des messagers à Qédar et examinez attentivement[b]. Regardez si pareille chose s’est produite !
  to: Car allez jusqu’aux îles de Kittim[a] et voyez ; envoyez à Qédar[b], examinez très attentivement, et voyez si une chose pareille s’est produite.
  rationale: La révision rend le כי initial par « Car », évite d’expliciter l’objet sous-entendu de « envoyez », replace les ancres au contact des termes commentés et restitue la forme interrogative finale. « Allez jusqu’aux » est plus naturel que « traversez jusqu’aux » tout en gardant l’orientation vers des régions lointaines.
