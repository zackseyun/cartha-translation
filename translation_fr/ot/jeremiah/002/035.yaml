  text: וַ/תֹּֽאמְרִי֙ כִּ֣י נִקֵּ֔יתִי אַ֛ךְ שָׁ֥ב אַפּ֖/וֹ מִמֶּ֑/נִּי הִנְ/נִי֙ נִשְׁפָּ֣ט אוֹתָ֔/ךְ עַל אָמְרֵ֖/ךְ לֹ֥א חָטָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/035.yaml
  text: Yet you said[a], “I am innocent; surely his anger has turned away from me.” Behold, I am entering into judgment with you because you say, “I have not sinned.”
translation:
  language: fr
  text: 'Pourtant, tu as dit : « Je suis innocente ; sa colère s’est certainement détournée de moi. » Voici, j’entre en procès avec toi, parce que tu dis : « Je n’ai pas péché. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: Pourtant, tu as dit
  rationale: Le waw poursuit l’accusation avec une valeur contrastive naturelle dans le contexte. Le féminin singulier de l’hébreu est rendu par « innocente », l’interlocutrice étant Juda/Jérusalem personnifiée.
- source_word: נִקֵּיתִי
  choice: Je suis innocente
  rationale: Le niphal de נקה exprime ici le fait de se déclarer libre de faute ou de culpabilité ; « innocente » convient au contexte moral et judiciaire.
- source_word: אַךְ
  choice: certainement
  rationale: La particule renforce ici l’assurance présomptueuse de la locutrice plutôt qu’elle n’exprime une restriction.
- source_word: שָׁב אַפּוֹ מִמֶּנִּי
  choice: sa colère s’est certainement détournée de moi
  rationale: L’expression décrit la colère qui se retire ou se détourne de quelqu’un. Cette formulation conserve l’image hébraïque dans un français naturel.
- source_word: הִנְנִי
  choice: Eh bien
  rationale: La particule attire l’attention sur la réponse divine et marque une réplique ferme. « Eh bien » rend ici cette transition avec dignité et naturel, sans l’archaïsme de « voici » employé devant une action à la première personne.
- source_word: נִשְׁפָּט אוֹתָךְ
  choice: j’entre en procès avec toi
  rationale: Le participe niphal de שׁפט avec la personne visée relève du langage judiciaire et peut signifier engager une procédure ou soutenir une accusation contre quelqu’un. « Entrer en procès avec » préserve cette nuance sans réduire l’expression au simple fait de juger.
- source_word: עַל אָמְרֵךְ
  choice: parce que tu dis
  rationale: La construction indique le motif de l’action judiciaire ; cette formulation est causale et idiomatique en français.
- source_word: לֹא חָטָאתִי
  choice: Je n’ai pas péché
  rationale: Le parfait, dans cette déclaration de dénégation, se rend naturellement par le passé composé français.
theological_decisions:
- issue: Nuance judiciaire de l’action divine
  choice: j’entre en procès avec toi
  alternative: je te mets en jugement ; je vais te juger
  rationale: L’hébreu emploie un langage de confrontation judiciaire. La traduction conserve cette image sans préciser indûment la forme exacte de la procédure ni importer un cadre doctrinal particulier.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse directe au féminin singulier, et « innocente » rend visible la personnification féminine de Juda/Jérusalem. La ponctuation distingue clairement les deux déclarations citées.
