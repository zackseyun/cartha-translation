  variant: modern international French
source:
  edition: WLC
  text: אֹמְרִ֨ים לָ/עֵ֜ץ אָ֣בִ/י אַ֗תָּה וְ/לָ/אֶ֨בֶן֙ אַ֣תְּ ילדת/ני כִּֽי פָנ֥וּ אֵלַ֛/י עֹ֖רֶף וְ/לֹ֣א פָנִ֑ים וּ/בְ/עֵ֤ת רָֽעָתָ/ם֙ יֹֽאמְר֔וּ ק֖וּמָ/ה וְ/הוֹשִׁיעֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/027.yaml
  text: They say to a tree[a], “You are my father,” and to a stone, “You gave birth to me.” For they have turned their back to me and not their face; but in the time of their trouble they say[c][b], “Rise up and save us!”
translation:
  language: fr
  text: 'Ils disent à un arbre : « Tu es mon père », et à une pierre : « C’est toi qui m’as mis au monde. » Car ils m’ont tourné le dos, au lieu de se tourner vers moi[a]. Mais au temps de leur malheur[b], ils disent : « Lève-toi et sauve-nous ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « ils ont tourné vers moi la nuque, et non le visage » — image exprimant le rejet.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de leur calamité » ou « de leur détresse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָעֵץ
  choice: à un arbre
  rationale: עֵץ peut désigner un arbre ou du bois. « Un arbre » conserve ici l’image concrète et saisissante d’un matériau créé auquel on attribue la paternité.
- source_word: אָבִי אַתָּה
  choice: Tu es mon père
  rationale: Cette formulation naturelle en français préserve sans l’atténuer l’attribution directe de la paternité à l’idole.
- source_word: וְלָאֶבֶן
  choice: et à une pierre
  rationale: La traduction directe maintient le parallélisme entre l’arbre et la pierre, matériaux des idoles.
- source_word: אַתְּ יְלַדְתִּנִי
  choice: C’est toi qui m’as mis au monde
  rationale: Le verbe ילד signifie ici enfanter ou mettre au monde. La formulation française respecte le féminin du sujet « pierre » tout en restant naturelle et actuelle.
- source_word: פָנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: ils m’ont tourné le dos, au lieu de se tourner vers moi
  rationale: L’hébreu oppose littéralement le dos ou la nuque au visage. La tournure choisie restitue clairement en français l’image du rejet et son contraste relationnel.
- source_word: וּבְעֵת רָעָתָם
  choice: Mais au temps de leur malheur
  rationale: רָעָה peut désigner le mal, le malheur ou la calamité. Le contexte d’un appel au secours favorise « malheur »; « mais » rend le contraste pragmatique avec leur rejet antérieur.
- source_word: יֹאמְרוּ
  choice: ils disent
  rationale: L’imparfait hébreu peut exprimer ici une réaction habituelle ou typique. Le présent français donne à l’accusation sa vivacité.
- source_word: קוּמָה וְהוֹשִׁיעֵנוּ
  choice: Lève-toi et sauve-nous !
  rationale: Les impératifs sont rendus directement dans un français moderne, énergique et digne.
theological_decisions:
- issue: Attribution de la parenté et de l’origine aux idoles
  choice: Conserver les paroles directes adressées à l’arbre et à la pierre
  alternative: Généraliser en disant seulement que le peuple adore des idoles
  rationale: Le texte hébreu attribue explicitement aux objets la paternité et l’enfantement. Garder cette formulation préserve la vigueur de l’accusation prophétique sans ajouter d’interprétation confessionnelle.
- issue: Contraste entre le rejet de Dieu et l’appel au secours
  choice: Rendre explicitement l’opposition idiomatique entre tourner le dos et se tourner vers Dieu
  alternative: Traduire littéralement « ils ont tourné vers moi la nuque et non le visage »
  rationale: Le choix transmet l’image hébraïque et son sens de rejet dans un français immédiatement intelligible, tout en signalant la forme littérale en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme prophétique et les citations directes sont conservés; l’idiome du dos et du visage est rendu naturellement, avec sa forme littérale en note.
