  source_fidelity: 'Le sens général est bien rendu : l’image de l’ânesse sauvage, son désir ardent, ses chaleurs, l’impossibilité de la faire revenir et la facilité avec laquelle on la trouve « en son mois » sont tous conservés. Toutefois, « poussée par son désir » transforme la locution hébraïque בְּאַוַּת נַפְשׁוֹ (« dans l’ardeur/le désir de son être ») en une indication causale plus explicite. Il est préférable de conserver une formulation circonstancielle et l’enchaînement de l’image.'
  naturalness: L’ajout de l’article indéfini rend l’attaque naturelle en français. « Dans l’ardeur de son désir » est idiomatique, soutenu sans être archaïque, et évite la tournure un peu explicative « poussée par ». « Ne se fatigueront pas » reflète directement l’imparfait/inaccompli hébreu dans l’énoncé proverbial-prophétique.
  terminology: « Ânesse sauvage », « désert », « en chaleur » et « faire revenir » sont appropriés. Le féminin est justifié par l’accord contextuel dominant. « En son mois » conserve délibérément l’expression hébraïque ambiguë ; la note en fournit l’éclairage sans l’intégrer de force au texte.
