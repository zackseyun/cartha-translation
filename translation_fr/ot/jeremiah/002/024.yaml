source:
  edition: WLC
  text: פֶּ֣רֶה לִמֻּ֣ד מִדְבָּ֗ר בְּ/אַוַּ֤ת נפש/ו שָׁאֲפָ֣ה ר֔וּחַ תַּאֲנָתָ֖/הּ מִ֣י יְשִׁיבֶ֑/נָּה כָּל מְבַקְשֶׁ֨י/הָ֙ לֹ֣א יִיעָ֔פוּ בְּ/חָדְשָׁ֖/הּ יִמְצָאֽוּ/נְהָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/024.yaml
  text: A wild donkey accustomed to the wilderness[a], in the craving of her appetite sniffs the wind; in her heat, who can turn her back? All who seek her will not weary themselves[c][b]; in her month they will find her.
translation:
  language: fr
  text: 'Une ânesse sauvage, habituée au désert, hume le vent dans l’ardeur de son désir[a]. Lorsqu’elle est en chaleur[b], qui peut la faire revenir ? Tous ceux qui la cherchent ne se fatigueront pas : ils la trouveront en son mois[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aspire avidement l’air ». L’expression hébraïque évoque l’animal qui flaire ou aspire l’air avec agitation sous l’effet d’un désir ardent.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans son désir sexuel ». L’hébreu désigne l’état ou le temps de l’ardeur sexuelle de l’animal.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « en son mois » ; il s’agit probablement du moment de ses chaleurs ou de son cycle d’accouplement.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּרֶה
  choice: ânesse sauvage
  rationale: Le nom désigne l’onagre, ou âne sauvage. Le féminin rend l’accord dominant des verbes et suffixes hébreux et convient à l’image de Juda personnifiée.
- source_word: לִמֻּד מִדְבָּר
  choice: habituée au désert
  rationale: La construction décrit un animal accoutumé à la vie désertique ; cette formulation est naturelle et fidèle.
- source_word: בְּאַוַּת נַפְשׁוֹ
  choice: poussée par son désir
  rationale: נפש peut ici exprimer l’être animé, l’appétit ou le désir. La formulation conserve l’intensité sans réduire à elle seule toute l’expression à un sens exclusivement sexuel.
- source_word: שָׁאֲפָה רוּחַ
  choice: elle hume le vent
  rationale: L’image est celle de l’animal qui aspire ou flaire avidement l’air. « Humer le vent » est imagé et idiomatique en français.
- source_word: תַּאֲנָתָהּ
  choice: quand elle est en chaleur
  rationale: Le nom désigne l’état ou le temps du désir sexuel de l’animal. « Être en chaleur » est l’expression zoologique française naturelle.
- source_word: מִי יְשִׁיבֶנָּה
  choice: qui peut la faire revenir ?
  rationale: Le hiphil de שוב exprime ici l’action de faire retourner ou revenir. Cette traduction garde l’image du retour tout en suggérant l’impossibilité de la détourner.
- source_word: כָּל מְבַקְשֶׁיהָ לֹא יִיעָפוּ
  choice: Tous ceux qui la cherchent n’ont pas à se fatiguer
  rationale: Le sens contextuel est que ses poursuivants peuvent la trouver sans s’épuiser lorsque le moment propice arrive.
- source_word: בְּחָדְשָׁהּ
  choice: quand vient son mois
  rationale: La formulation maintient l’expression littérale « son mois » et laisse la note en éclairer la probable référence au cycle de l’animal.
- source_word: יִמְצָאוּנְהָ
  choice: ils la trouveront
  rationale: Rendu direct de la forme verbale dans cette annonce contextuelle.
theological_decisions:
- issue: Accord de genre dans la métaphore animale appliquée à Juda
  choice: Employer systématiquement le féminin pour l’ânesse sauvage
  alternative: Reproduire ponctuellement le suffixe masculin apparent de נַפְשׁוֹ
  rationale: Les verbes et les autres suffixes du verset sont féminins et présentent Juda sous l’image d’une femelle. Un masculin isolé en français obscurcirait l’image sans restituer utilement la tension textuelle.
- issue: Degré d’explicitation sexuelle de la métaphore
  choice: Employer « désir » dans la première proposition, puis l’expression précise « en chaleur »
  alternative: Traduire les deux expressions par un vocabulaire explicitement sexuel, comme « rut » ou « désir sexuel »
  rationale: L’hébreu progresse d’une expression générale de désir intense vers un terme lié aux chaleurs de l’animal. La traduction conserve cette progression et la force métaphorique sans la surinterpréter.
translation_notes:
  register: Français international actuel, digne et imagé. La syntaxe conserve l’ouverture nominale vive de l’hébreu tout en ajoutant un pronom de reprise naturel en français. Le lexique zoologique reste compréhensible sans atténuer la métaphore.
