source:
  edition: WLC
  text: אֵ֣יךְ תֹּאמְרִ֞י לֹ֣א נִטְמֵ֗אתִי אַחֲרֵ֤י הַ/בְּעָלִים֙ לֹ֣א הָלַ֔כְתִּי רְאִ֤י דַרְכֵּ/ךְ֙ בַּ/גַּ֔יְא דְּעִ֖י מֶ֣ה עָשִׂ֑ית בִּכְרָ֥ה קַלָּ֖ה מְשָׂרֶ֥כֶת דְּרָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/023.yaml
  text: How can you say[a], ‘I have not defiled myself; I have not gone after the Baals’? Look at your way in the valley; know what you have done— a swift young she-camel[c][b], twisting her ways.
translation:
  language: fr
  text: 'Comment peux-tu dire : « Je ne me suis pas souillée[a], je n’ai pas suivi les Baals[b] » ? Regarde ton chemin dans la vallée ; reconnais ce que tu as fait — une jeune chamelle agile, qui va et vient en tous sens[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne suis pas devenue impure ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je ne suis pas allée à la suite des Baals ».'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu est rare et son sens exact est incertain. Il semble décrire une jeune chamelle dont les déplacements ou les pistes s’entrecroisent et se tortillent.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְמֵאתִי
  choice: Je ne me suis pas rendue impure
  rationale: Le niphal de טמא exprime le fait de devenir impur ou de se souiller. La formulation pronominale conserve ici la défense morale et religieuse de Jérusalem, personnifiée au féminin.
- source_word: אַחֲרֵי הַבְּעָלִים ... הָלַכְתִּי
  choice: je ne suis pas allée après les Baals
  rationale: La tournure conserve l’image concrète de הלך אחרי tout en restant compréhensible en français. Le pluriel « les Baals » reflète fidèlement le texte hébreu.
- source_word: רְאִי דַרְכֵּךְ
  choice: Regarde le chemin que tu as pris
  rationale: דרך peut désigner à la fois un chemin et une conduite. Cette formulation française maintient l’image du déplacement dans la vallée tout en laissant entendre la conduite reprochée.
- source_word: בַּגַּיְא
  choice: dans la vallée
  rationale: גיא désigne une vallée ou un ravin. « Vallée » est naturel en français et ne précise pas au-delà du texte le lieu cultuel probablement évoqué.
- source_word: דְּעִי
  choice: reconnais
  rationale: L’impératif de ידע signifie littéralement « sache ». Dans ce contexte accusateur, « reconnais » exprime naturellement l’appel à prendre conscience et à admettre ce qui a été fait.
- source_word: בִּכְרָה קַלָּה
  choice: jeune chamelle rapide
  rationale: בכרה désigne une jeune femelle du chameau, et קלה évoque la légèreté ou la rapidité de son mouvement. « Jeune chamelle rapide » est précis et idiomatique.
- source_word: מְשָׂרֶכֶת דְּרָכֶיהָ
  choice: qui va et vient en tous sens
  rationale: Le participe rare שרך décrit vraisemblablement un mouvement tortueux, désordonné ou entrecroisé. Cette traduction rend l’image sans attribuer au terme un sens plus précis que ne le permet l’hébreu.
theological_decisions:
- issue: Le pluriel בְּעָלִים dans l’accusation d’idolâtrie
  choice: les Baals
  alternative: Baal ; les maîtres
  rationale: Le pluriel hébreu est maintenu et renvoie aux diverses formes ou manifestations du culte de Baal. Le réduire au singulier ou le traduire comme un nom commun atténuerait l’accusation précise du texte.
translation_notes:
  register: Français moderne, international et digne. Le féminin est conservé parce que Jérusalem ou Juda est interpellée comme une femme. La ponctuation fait ressortir l’accusation puis la comparaison animale, sans expliciter davantage son arrière-plan cultuel ou sexuel.
