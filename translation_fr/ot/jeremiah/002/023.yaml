  - severity: medium
    issue: « je ne suis pas allée après les Baals »
    rationale: Cette tournure est un calque de l’hébreu peu idiomatique en français international moderne. « Je n’ai pas suivi les Baals » restitue l’idiome sans perte de sens.
  - severity: low
    issue: Absence d’article dans « jeune chamelle rapide » après les deux-points
    rationale: La comparaison est plus naturelle et grammaticalement explicite avec « une jeune chamelle agile ».
