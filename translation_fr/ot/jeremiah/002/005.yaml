revisions:
- from: 'Ainsi parle Yahweh : « Quelle injustice vos ancêtres ont-ils trouvée en moi[a] pour s’éloigner de moi, suivre ce qui n’est que néant[b] et devenir eux-mêmes néant ? »'
  to: 'Ainsi parle Yahweh : « Quelle injustice[a] vos ancêtres ont-ils trouvée en moi, si bien qu’ils se sont éloignés de moi, ont suivi le néant[b] et sont eux-mêmes devenus néant ? »'
  rationale: La révision évite la nuance de finalité introduite par « pour s’éloigner » et replace l’ancre de la variante sur le terme auquel elle se rapporte. Elle maintient le nom Yahweh, l’ambiguïté de הֶבֶל et la répétition française destinée à refléter le jeu de mots de la racine hébraïque.
