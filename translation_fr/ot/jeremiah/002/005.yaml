review_pass:
  verdict: revise
  source_fidelity: La question rhétorique, le nom divin et la progression du texte sont bien rendus. Toutefois, « pour s’éloigner » peut présenter l’éloignement comme un but; le כי introduit plutôt la conséquence ou la manifestation de l’accusation supposée. La traduction révisée conserve aussi le jeu de mots entre הֶבֶל et וַיֶּהְבָּלוּ, sans transformer trop directement l’idée en annihilation littérale.
  naturalness: « Ainsi parle Yahweh » est naturel dans un registre biblique moderne. La reprise de « néant » est volontairement marquée, mais elle est intelligible et justifiée par le parallélisme lexical hébreu. La coordination au passé composé est fluide en français international.
  terminology: « Ancêtres » convient à אֲבוֹתֵיכֶם dans cette adresse collective. « Injustice » rend correctement עָוֶל. « Le néant » préserve l’ouverture de הֶבֶל, qui peut évoquer les idoles sans être limité à elles. « Yahweh » rend explicitement le tétragramme.
  issues:
  - severity: medium
    issue: Valeur de « pour » dans « pour s’éloigner de moi »
    rationale: Cette tournure infinitive peut indiquer une finalité (« afin de s’éloigner »), alors que le כי hébreu relie leur éloignement à la prétendue injustice trouvée en Yahweh. Une proposition avec « si bien qu’ » rend mieux le lien sans trancher excessivement entre conséquence et explication.
  - severity: low
    issue: Ancre de la note a
    rationale: La note offre une variante pour « injustice »; son ancre doit suivre ce mot plutôt que « moi ».
