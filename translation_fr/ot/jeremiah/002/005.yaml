  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מַה מָּצְא֨וּ אֲבוֹתֵי/כֶ֥ם בִּ/י֙ עָ֔וֶל כִּ֥י רָחֲק֖וּ מֵ/עָלָ֑/י וַ/יֵּֽלְכ֛וּ אַחֲרֵ֥י הַ/הֶ֖בֶל וַ/יֶּהְבָּֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/005.yaml
  text: 'Thus says Yahweh: What wrong did your fathers find in me[a], that they went far from me, and went after vanity[b], and became vain?'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Quelle injustice[a] vos ancêtres ont-ils trouvée en moi, si bien qu’ils se sont éloignés de moi, ont suivi le néant[b] et sont eux-mêmes devenus néant ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quel tort vos ancêtres ont-ils trouvé en moi ? »'
    reason: alternative_reading
  - marker: b
    text: 'En hébreu, « néant » et « sont devenus néant » viennent de la même racine : en suivant ce qui est vide et sans valeur, ils sont eux-mêmes devenus vides et sans valeur. Le terme peut désigner ici les faux dieux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formulation française, digne et naturelle, conserve la formule prophétique de messager ainsi que le nom divin.
- source_word: אֲבוֹתֵיכֶם
  choice: vos ancêtres
  rationale: Dans ce rappel historique adressé à une génération entière, « ancêtres » exprime naturellement les générations antérieures sans perdre la portée collective du masculin pluriel hébreu.
- source_word: בִּי עָוֶל
  choice: Quelle injustice ... en moi
  rationale: עָוֶל peut désigner l’injustice, le tort ou la perversité. « Injustice » conserve ici la dimension morale de l’accusation rhétorique.
- source_word: כִּי רָחֲקוּ מֵעָלָי
  choice: pour s’éloigner de moi
  rationale: « S’éloigner » maintient la métaphore spatiale de la rupture relationnelle. La conjonction est rendue par « pour » selon le lien logique naturel en français, sans nier sa nuance explicative.
- source_word: וַיֵּלְכוּ אַחֲרֵי הַהֶבֶל
  choice: suivre ce qui n’est que néant
  rationale: הלך אחרי signifie ici « suivre, aller à la suite de ». הֶבֶל évoque le souffle, le vide et ce qui est sans valeur; cette formulation laisse entendre les idoles sans les introduire explicitement.
- source_word: וַיֶּהְבָּלוּ
  choice: devenir eux-mêmes néant
  rationale: 'Le verbe appartient à la même racine que הֶבֶל. La répétition de « néant » reproduit clairement le jeu lexical : ceux qui poursuivent le néant en viennent à lui ressembler.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » rend le nom personnel sans le remplacer par un titre.
- issue: Référent de הַהֶבֶל
  choice: ce qui n’est que néant
  alternative: les idoles
  rationale: Le contexte suggère les faux dieux, mais le mot hébreu demeure plus large et souligne leur inconsistance. La traduction préserve cette tension plutôt que d’expliciter le référent dans le corps du verset.
- issue: Valeur de כִּי
  choice: pour
  alternative: si bien qu’ils / puisque alors ils
  rationale: Dans la question rhétorique, la particule relie l’injustice prétendument trouvée à l’éloignement qui s’ensuit. « Pour » donne en français un lien idiomatique de motif ou de conséquence, tout en laissant ouverte la nuance exacte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La question rhétorique reste directe. La répétition volontaire de « néant » privilégie le jeu de mots hébreu, même si elle est plus marquée que l’usage français ordinaire.
