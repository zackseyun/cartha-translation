id: JER.2.13
reference: Jeremiah 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי שְׁתַּ֥יִם רָע֖וֹת עָשָׂ֣ה עַמִּ֑/י אֹתִ֨/י עָזְב֜וּ מְק֣וֹר מַ֣יִם חַיִּ֗ים לַ/חְצֹ֤ב לָ/הֶם֙ בֹּאר֔וֹת בֹּארֹת֙ נִשְׁבָּרִ֔ים אֲשֶׁ֥ר לֹא יָכִ֖לוּ הַ/מָּֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/013.yaml
  text: 'For my people have done two evils: they have forsaken me[a], the fountain of living waters, to dig for themselves cisterns—broken cisterns that cannot hold water.'
translation:
  language: fr
  text: 'Car mon peuple a commis deux méfaits : ils m’ont abandonné, moi, la source d’eau vive[a], pour se creuser des citernes, des citernes fissurées qui ne retiennent pas l’eau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la source des eaux vives »; l’expression désigne une eau fraîche et courante.
    reason: Précise la forme plurielle de l’hébreu et le sens concret de l’expression מַיִם חַיִּים, que le français rend idiomatiquement au singulier.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’accusation précédente et conserve naturellement la valeur causale du terme hébreu.
- source_word: שְׁתַּיִם רָעוֹת
  choice: deux méfaits
  rationale: Conserve le nombre précis et la portée morale de רָעוֹת, tout en évitant que « deux maux » soit compris comme deux malheurs subis.
- source_word: עָשָׂה עַמִּי
  choice: mon peuple a commis
  rationale: En français, « commettre des méfaits » est plus idiomatique que « faire des méfaits », sans modifier le sens du verbe hébreu courant.
- source_word: אֹתִי עָזְבוּ
  choice: ils m’ont abandonné
  rationale: Exprime clairement la rupture relationnelle et l’infidélité grave indiquées par עזב dans ce contexte prophétique.
- source_word: מְקוֹר מַיִם חַיִּים
  choice: la source d’eau vive
  rationale: « Source » désigne naturellement une eau jaillissante, tandis que l’expression française consacrée « eau vive » conserve l’image d’une eau fraîche et courante sans l’expliciter théologiquement.
- source_word: לַחְצֹב לָהֶם
  choice: pour se creuser
  rationale: Le pronom réfléchi rend la valeur bénéficiaire de לָהֶם; « creuser » est clair en français pour la confection de citernes, même si le verbe hébreu peut évoquer le fait de tailler la roche.
- source_word: בֹּארוֹת
  choice: des citernes
  rationale: Le contexte oppose une source naturelle à des réservoirs aménagés par l’être humain; « puits » brouillerait cette opposition.
- source_word: בֹּארֹת נִשְׁבָּרִים
  choice: des citernes fissurées
  rationale: « Fissurées » rend concrètement le défaut qui empêche les citernes de conserver leur eau et convient mieux à l’image que le plus général « brisées ».
- source_word: אֲשֶׁר לֹא יָכִלוּ הַמָּיִם
  choice: qui ne retiennent pas l’eau
  rationale: Rend en français naturel l’incapacité de ces citernes à contenir ou conserver l’eau.
theological_decisions:
- issue: Métaphore de l’eau appliquée à Dieu
  choice: Conserver l’apposition « moi, la source d’eau vive »
  alternative: Expliciter par « moi qui donne la vie » ou « la source d’une eau qui donne la vie »
  rationale: L’hébreu présente directement Dieu comme la source sans expliquer la métaphore. L’apposition préserve donc la force poétique et la richesse théologique du texte sans imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « des citernes, des citernes fissurées » est conservée pour reproduire l’insistance rhétorique de l’hébreu. Le pluriel « ils » reprend collectivement « mon peuple », comme le passage de l’hébreu du singulier grammatical au pluriel verbal.
