  text: קֹ֤דֶשׁ יִשְׂרָאֵל֙ לַ/יהוָ֔ה רֵאשִׁ֖ית תְּבוּאָתֹ֑/ה כָּל אֹכְלָ֣י/ו יֶאְשָׁ֔מוּ רָעָ֛ה תָּבֹ֥א אֲלֵי/הֶ֖ם נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/003.yaml
  text: Israel was holy to Yahweh[a], the firstfruits of his harvest; all who devoured him became guilty; disaster came upon them[c][b], declares Yahweh.
translation:
  language: fr
  text: 'Israël était consacré à Yahweh,

    prémices de sa récolte.

    Tous ceux qui le dévoreront se rendront coupables ;

    le malheur viendra sur eux,

    — déclaration de Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: consacré
  rationale: Dans cette construction prédicative, le nom exprime le statut sacré d’Israël, mis à part pour Yahweh. « Consacré » est naturel en français et conserve la force cultuelle de l’hébreu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le ל marque ici l’appartenance ou la consécration. « Consacré à Yahweh » exprime clairement cette relation sans alourdir le texte.
- source_word: רֵאשִׁית תְּבוּאָתוֹ
  choice: prémices de sa récolte
  rationale: « Prémices » conserve l’image cultuelle des premiers produits réservés à Dieu, tandis que « récolte » rend naturellement תְּבוּאָה dans ce contexte.
- source_word: אֹכְלָיו
  choice: ceux qui le dévoraient
  rationale: Le verbe « dévorer » maintient la métaphore violente appliquée aux peuples qui attaquaient et pillaient Israël. Le pronom masculin singulier suit Israël comme collectif.
- source_word: יֶאְשָׁמוּ
  choice: se rendaient coupables
  rationale: Cette formulation rend l’idée de contracter une culpabilité ou d’en devenir passible, sans imposer un cadre judiciaire plus précis que l’hébreu.
- source_word: רָעָה תָּבֹא אֲלֵיהֶם
  choice: le malheur fondait sur eux
  rationale: Dans ce contexte de jugement, רָעָה désigne le malheur ou la calamité plutôt que le mal moral. L’imparfait français harmonise les verbes hébreux prospectifs dans cette évocation du passé d’Israël, sans effacer leur portée habituelle.
- source_word: נְאֻם יְהוָה
  choice: — déclaration de Yahweh
  rationale: Cette formule solennelle et concise restitue la formule prophétique nominale נְאֻם יְהוָה, tout en restant intelligible en français actuel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » représente le nom d’alliance sans le remplacer par un titre.
- issue: Israël représenté comme produit consacré
  choice: prémices de sa récolte
  alternative: le premier produit de sa récolte
  rationale: '« Prémices » préserve la dimension cultuelle : Israël appartient spécialement à Yahweh comme la première part de la récolte, sans développer l’image au-delà du texte.'
- issue: Valeur temporelle des verbes יֶאְשָׁמוּ et תָּבֹא
  choice: 'imparfait français : « se rendaient… fondait »'
  alternative: 'futur ou valeur modale : « seront coupables… le malheur fondra »'
  rationale: Dans le cadre rétrospectif des débuts d’Israël, ces formes peuvent décrire ce qui arrivait à ses agresseurs. Leur morphologie hébraïque permet toutefois une nuance générale ou prospective, préservée dans la note.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le vers est disposé en lignes poétiques. « Consacré » évite l’expression moins naturelle « saint pour Yahweh » tout en gardant le champ sacral. Aucune note n’est indispensable dans le texte principal ; l’ambiguïté aspectuelle est signalée dans les décisions éditoriales.
