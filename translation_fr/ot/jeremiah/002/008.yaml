id: JER.2.8
reference: Jeremiah 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/כֹּהֲנִ֗ים לֹ֤א אָֽמְרוּ֙ אַיֵּ֣ה יְהוָ֔ה וְ/תֹפְשֵׂ֤י הַ/תּוֹרָה֙ לֹ֣א יְדָע֔וּ/נִי וְ/הָ/רֹעִ֖ים פָּ֣שְׁעוּ בִ֑/י וְ/הַ/נְּבִיאִים֙ נִבְּא֣וּ בַ/בַּ֔עַל וְ/אַחֲרֵ֥י לֹֽא יוֹעִ֖לוּ הָלָֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/008.yaml
  text: The priests did not say[a], ‘Where is Yahweh?’ Those who handle the law did not know me; the shepherds rebelled against me[c][b]; the prophets prophesied by Baal and went after things that do not profit.
translation:
  language: fr
  text: 'Les prêtres n’ont pas dit : « Où est Yahweh ? » Ceux qui manient la Loi[a] ne me connaissaient pas. Les bergers se sont révoltés contre moi ; les prophètes ont prophétisé par Baal[b] et ont suivi ce qui n’apporte aucun profit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui se saisissent de la Loi » ou « ceux qui enseignent la Loi ». L’hébreu parle littéralement de ceux qui la « saisissent » ou la « manient ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ont prophétisé au nom de Baal ».
    reason: alternative_reading
  - marker: c
    text: Ou « ont couru après ce qui est inutile ». Le contexte fait penser aux faux dieux, mais l’hébreu ne les nomme pas explicitement ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Le pluriel concret désigne les responsables sacerdotaux ; « les prêtres » est direct et naturel.
- source_word: אַיֵּה יְהוָה
  choice: Où est Yahweh ?
  rationale: La question rhétorique est conservée, ainsi que le nom divin personnel יהוה sous la forme « Yahweh ».
- source_word: תֹפְשֵׂי הַתּוֹרָה
  choice: ceux qui manient la Loi
  rationale: Le participe תפשׂ évoque le fait de saisir ou de manier. Cette formulation garde l’image concrète sans réduire d’emblée ces personnes aux seuls enseignants.
- source_word: הַתּוֹרָה
  choice: la Loi
  rationale: « Loi » est ici reconnaissable et idiomatique, tout en pouvant désigner plus largement l’instruction révélée de Dieu.
- source_word: לֹא יְדָעוּנִי
  choice: ne me connaissaient pas
  rationale: La formulation préserve la connaissance personnelle et relationnelle impliquée par ידע, plutôt que de la réduire à une absence d’information.
- source_word: הָרֹעִים
  choice: les bergers
  rationale: Le terme est métaphorique pour les dirigeants, mais conserver « bergers » maintient l’image prophétique du texte hébreu.
- source_word: פָּשְׁעוּ בִי
  choice: se sont révoltés contre moi
  rationale: פשׁע exprime une rébellion ou une rupture d’allégeance, plus forte qu’une simple faute.
- source_word: הַנְּבִיאִים נִבְּאוּ בַבַּעַל
  choice: les prophètes ont prophétisé par Baal
  rationale: « Par Baal » garde ouverte la valeur de la préposition ב, qui peut indiquer le moyen, l’agent ou la sphère, sans imposer dans le texte principal « au nom de Baal ».
- source_word: אַחֲרֵי לֹא יוֹעִלוּ הָלָכוּ
  choice: ont suivi ce qui n’apporte aucun profit
  rationale: « Ont suivi » rend naturellement l’expression « aller après ». Le référent demeure non précisé, comme dans l’hébreu, tandis que l’idée d’inutilité est clairement exprimée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie explicitement le Tétragramme. « Yahweh » conserve le nom d’alliance comme nom personnel plutôt que de le remplacer par un titre.
- issue: Sens de la prophétie בַבַּעַל
  choice: prophétisé par Baal
  alternative: prophétisé au nom de Baal
  rationale: La préposition ב permet plusieurs nuances. Le texte principal préserve cette tension, et la note signale l’interprétation idiomatique courante.
- issue: Identification du dernier référent
  choice: ce qui n’apporte aucun profit
  alternative: les idoles inutiles
  rationale: Le contexte évoque clairement les faux dieux, mais l’objet reste implicite dans l’hébreu. La traduction évite donc d’ajouter explicitement « idoles ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe accusatrice et les images de la Loi « maniée » et des dirigeants comme « bergers » sont conservées. Les termes techniques ou confessionnels ont été évités ; les ambiguïtés de בַבַּעַל et du dernier objet implicite sont maintenues et documentées.
