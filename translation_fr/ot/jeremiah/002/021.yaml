id: JER.2.21
reference: Jeremiah 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ נְטַעְתִּ֣י/ךְ שֹׂרֵ֔ק כֻּלֹּ֖/ה זֶ֣רַע אֱמֶ֑ת וְ/אֵיךְ֙ נֶהְפַּ֣כְתְּ לִ֔/י סוּרֵ֖י הַ/גֶּ֥פֶן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/021.yaml
  text: Yet I planted you as a choice vine[a], wholly of true seed[c][b]. How then have you turned for me into the degenerate shoots of a foreign vine?
translation:
  language: fr
  text: Pourtant, moi, je t’ai plantée comme une vigne de choix[a], tout entière issue d’une semence authentique[b]. Comment donc t’es-tu changée, pour moi, en pousses dégénérées[c] d’une vigne étrangère ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cépage de choix » ; le terme hébreu désigne une vigne sélectionnée ou noble.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout entière, semence de vérité » ; autre traduction possible : « tout entière de souche véritable ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le terme hébreu est difficile ; autres traductions possibles : « rameaux sauvages », « pousses dévoyées » ou « croissance corrompue ».'
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: נְטַעְתִּיךְ
  choice: je t’avais plantée
  rationale: Le qal accompli à la 1re personne du singulier, avec suffixe féminin singulier, décrit l’action antérieure de Dieu envers le peuple personnifié comme une femme. Le plus-que-parfait rend naturellement en français son antériorité par rapport à la transformation constatée.
- source_word: שֹׂרֵק
  choice: une vigne de choix
  rationale: Le terme désigne une vigne sélectionnée ou noble. Cette formulation française conserve à la fois l’image viticole et l’idée de qualité supérieure.
- source_word: כֻּלֹּה זֶרַע אֱמֶת
  choice: tout entière issue d’une semence authentique
  rationale: L’expression souligne que la plantation provenait intégralement d’une souche véritable et fiable. « Authentique » rend ici אֱמֶת sans imposer au mot un sens exclusivement moral.
- source_word: וְאֵיךְ
  choice: Comment donc
  rationale: La tournure introduit une question rhétorique marquant la stupeur devant le contraste avec la plantation initiale.
- source_word: נֶהְפַּכְתְּ לִי
  choice: t’es-tu changée, pour moi, en
  rationale: Le nifal de הפך exprime une transformation. La traduction conserve לִי, « pour moi », afin de préserver la dimension relationnelle du constat divin.
- source_word: סוּרֵי
  choice: pousses dégénérées
  rationale: La forme hébraïque est difficile. Dans l’image de la vigne, elle paraît désigner une croissance qui a dévié de sa qualité d’origine; « pousses dégénérées » garde à la fois l’image et le jugement négatif, tout en signalant l’incertitude en note.
- source_word: הַגֶּפֶן נָכְרִיָּה
  choice: d’une vigne étrangère
  rationale: נָכְרִיָּה signifie « étrangère » ou « autre ». La formulation reste naturelle et conserve l’opposition entre la vigne choisie plantée par Dieu et une vigne d’une autre provenance.
theological_decisions:
- issue: Métaphore d’Israël ou de Juda comme vigne plantée par Dieu
  choice: Conserver directement l’image de la vigne, de la semence et des pousses.
  alternative: 'Paraphraser : « Je t’avais formée comme un peuple pur, mais tu es devenue corrompue. »'
  rationale: Le texte hébreu développe une image agricole porteuse de résonances prophétiques et relationnelles. La maintenir évite de réduire le verset à une explication morale et préserve sa tension propre.
- issue: Valeur de אֱמֶת dans l’expression זֶרַע אֱמֶת
  choice: « authentique », au sens de provenance véritable ou fiable
  alternative: « fidèle », compris comme une qualité morale ou religieuse
  rationale: Dans ce contexte viticole, le mot qualifie d’abord la qualité vraie de la semence ou du plant. Traduire par « fidèle » risquerait de transformer trop tôt la métaphore végétale en affirmation morale explicite.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La reprise « moi, je » rend l’emphase de וְאָנֹכִי. L’accord féminin (« plantée », « changée », « tout entière ») reflète le peuple interpellé comme une figure féminine. La ponctuation isole « pour moi » afin d’en conserver la force relationnelle sans alourdir la question.
