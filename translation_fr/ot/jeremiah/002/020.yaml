  text: כִּ֣י מֵ/עוֹלָ֞ם שָׁבַ֣רְתִּי עֻלֵּ֗/ךְ נִתַּ֨קְתִּי֙ מוֹסְרֹתַ֔יִ/ךְ וַ/תֹּאמְרִ֖י לֹ֣א אעבד כִּ֣י עַֽל כָּל גִּבְעָ֞ה גְּבֹהָ֗ה וְ/תַ֨חַת֙ כָּל עֵ֣ץ רַעֲנָ֔ן אַ֖תְּ צֹעָ֥ה זֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/020.yaml
  text: For long ago I broke your yoke[a]; I tore off your bonds. But you said, “I will not serve.” Indeed, on every high hill and under every green tree[c][b], you sprawled out as a prostitute.
translation:
  language: fr
  text: 'Car il y a longtemps, j’ai brisé ton joug[a], j’ai rompu tes liens. Mais tu as dit : « Je ne servirai pas. » Oui, sur toute haute colline et sous tout arbre verdoyant[b], tu t’étendais comme une prostituée[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis les temps anciens ». L’expression hébraïque peut désigner un passé lointain ; ici, elle renvoie vraisemblablement aux anciennes délivrances d’Israël.
    reason: lexical_alternative
  - marker: b
    text: L’expression « sous tout arbre verdoyant » est une formule prophétique courante désignant des lieux associés aux cultes idolâtres.
    reason: cultural_note
  - marker: c
    text: Le verbe hébreu traduit par « tu t’étendais » est rare et difficile. On pourrait aussi comprendre « tu te courbais » ou une expression semblable décrivant une posture de disponibilité sexuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: il y a longtemps
  rationale: L’expression temporelle renvoie ici vraisemblablement aux anciennes délivrances d’Israël. Cette formulation française est naturelle tout en laissant la note signaler la portée possible « depuis les temps anciens ».
- source_word: שָׁבַרְתִּי עֻלֵּךְ
  choice: j’ai brisé ton joug
  rationale: Traduction concrète de l’image de la libération hors de la servitude, avec sa résonance dans l’histoire de l’alliance.
- source_word: נִתַּקְתִּי מוֹסְרֹתַיִךְ
  choice: j’ai rompu tes liens
  rationale: Le verbe exprime l’action d’arracher ou de rompre ce qui retient. « Liens » conserve l’image de l’asservissement sans imposer un objet plus précis que l’hébreu.
- source_word: לֹא אעבד
  choice: Je ne servirai pas
  rationale: עבד peut exprimer le service, l’asservissement ou le culte. « Servir » préserve cette amplitude entre refus d’obéir et refus de rendre un culte à Dieu.
- source_word: עַל כָּל גִּבְעָה גְּבֹהָה וְתַחַת כָּל עֵץ רַעֲנָן
  choice: sur toute haute colline et sous tout arbre verdoyant
  rationale: La traduction maintient l’expression prophétique concrète désignant des lieux associés aux cultes idolâtres, sans remplacer l’image par son interprétation.
- source_word: צֹעָה
  choice: tu t’étendais
  rationale: Le verbe rare semble décrire ici une posture corporelle dans le cadre de la métaphore sexuelle. « Tu t’étendais » reste évocateur sans préciser davantage un terme hébreu incertain.
- source_word: זֹנָה
  choice: comme une prostituée
  rationale: Le langage explicite de la prostitution est conservé, car il porte la métaphore prophétique de l’infidélité d’Israël. « Prostituée » est actuel et clair.
theological_decisions:
- issue: Métaphore de l’infidélité sexuelle appliquée à l’idolâtrie
  choice: Conserver explicitement l’image de la prostituée dans le texte principal
  alternative: Atténuer en « tu étais infidèle » ou expliciter par « tu pratiquais l’idolâtrie »
  rationale: Jérémie présente délibérément la rupture de l’alliance au moyen d’une image sexuelle. L’atténuer supprimerait une part de la force prophétique et résoudrait à tort la métaphore en simple explication.
- issue: Sens de עבד dans « Je ne servirai pas »
  choice: Garder le verbe général « servir »
  alternative: Traduire « Je ne serai pas esclave » ou « Je ne rendrai pas de culte »
  rationale: Le contexte du joug et des liens évoque la servitude, tandis que les lieux de culte idolâtre évoquent le service religieux. Le terme général conserve cette tension sémantique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement féminin est conservé parce que le prophète personnifie Israël en femme. Les images concrètes du joug, des liens et de la prostitution sont maintenues, tandis que les principales incertitudes lexicales sont signalées en notes.
