base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/018.yaml
  text: And now[a], what have you to do with the way to Egypt, to drink the waters of Shihor? And what have you to do with the way to Assyria[b], to drink the waters of the River?
translation:
  language: fr
  text: Et maintenant, qu’as-tu à faire sur le chemin qui mène en Égypte, pour boire les eaux du Shihor[a] ? Et qu’as-tu à faire sur le chemin qui mène en Assyrie, pour boire les eaux du Fleuve[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Shihor est probablement un nom du Nil ou de l’un de ses bras orientaux.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire l’Euphrate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la liaison exprimée par וְ et la transition temporelle עַתָּה, dans un français naturel.
- source_word: מַה לָּךְ
  choice: qu’as-tu à faire
  rationale: Cette tournure rend l’expression idiomatique de désolidarisation et de reproche, sans la réduire à une simple demande d’information.
- source_word: לְדֶרֶךְ מִצְרַיִם
  choice: sur le chemin de l’Égypte
  rationale: Maintient l’image concrète du chemin et sa destination, tout en s’intégrant naturellement à la tournure française « avoir à faire sur le chemin ».
- source_word: לִשְׁתּוֹת
  choice: pour boire
  rationale: Rend l’infinitif de but de façon directe et idiomatique.
- source_word: מֵי שִׁחוֹר
  choice: les eaux du Shihor
  rationale: Conserve le nom propre hébreu au lieu d’imposer dans le texte son identification probable au Nil.
- source_word: וּמַה לָּךְ
  choice: Et qu’as-tu à faire
  rationale: Reproduit la répétition et le parallélisme rhétorique du texte hébreu.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Désignation française usuelle de cette puissance antique.
- source_word: מֵי נָהָר
  choice: les eaux du Fleuve
  rationale: Conserve l’expression hébraïque, où « le Fleuve » désigne contextuellement l’Euphrate, sans remplacer le terme source par son identification.
theological_decisions:
- issue: Sens de l’image consistant à boire les eaux de puissances étrangères
  choice: Conserver l’image de l’Égypte et de l’Assyrie sans expliciter dans le texte qu’elle évoque la recherche d’un appui politique étranger.
  alternative: 'Paraphraser : « chercher du secours auprès de l’Égypte et de l’Assyrie ».'
  rationale: Le contexte permet de comprendre une dépendance politique envers des nations étrangères, mais le verset formule cette idée au moyen d’une métaphore. La traduction préserve donc l’image et sa force sans trancher davantage dans le corps du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement singulier reflète les formes hébraïques adressées à Juda personnifié. La répétition syntaxique et la métaphore des eaux étrangères sont conservées.
