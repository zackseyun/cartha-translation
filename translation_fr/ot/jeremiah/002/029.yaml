  text: לָ֥/מָּה תָרִ֖יבוּ אֵלָ֑/י כֻּלְּ/כֶ֛ם פְּשַׁעְתֶּ֥ם בִּ֖/י נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/029.yaml
  text: Why do you contend with me? All of you have rebelled against me[b][a], declares Yahweh.
translation:
  language: fr
  text: Pourquoi me cherchez-vous querelle[a] ? Vous tous, vous vous êtes révoltés contre moi[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pourquoi plaidez-vous contre moi ? » Le verbe hébreu peut désigner le fait de chercher querelle, de contester ou d’intenter une action en justice.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous avez transgressé contre moi ». Le verbe hébreu exprime souvent plus fortement l’idée de rébellion ou de révolte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Introduit naturellement en français la question rhétorique qui demande la raison de la conduite du peuple.
- source_word: תָרִיבוּ
  choice: entrez-vous en contestation
  rationale: Le verbe ריב peut désigner une querelle, une contestation ou une action en justice. Cette formulation conserve la dimension conflictuelle et la possible nuance judiciaire.
- source_word: אֵלַי
  choice: avec moi
  rationale: Avec ריב, « avec moi » est idiomatique en français et évite de renforcer inutilement l’hostilité par « contre moi ».
- source_word: כֻּלְּכֶם
  choice: tous
  rationale: 'Préserve l’insistance collective : l’accusation vise l’ensemble des destinataires.'
- source_word: פְּשַׁעְתֶּם
  choice: vous êtes révoltés
  rationale: פשע exprime souvent une rébellion ou une rupture de loyauté, et non une simple faute.
- source_word: בִּי
  choice: contre moi
  rationale: Avec פשע, la préposition désigne la personne contre laquelle la révolte est dirigée.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique avec solennité et fait entendre directement le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme ; « Yahweh » préserve le nom propre et le distingue d’un titre.
- issue: Force de פשע
  choice: vous êtes révoltés
  alternative: vous avez péché contre moi
  rationale: Le choix retenu conserve la notion forte de rébellion et de rupture de loyauté sans la réduire à une faute générique.
translation_notes:
  register: Français international moderne, clair et digne. « Entrer en contestation » maintient la possible nuance judiciaire sans recourir à un vocabulaire excessivement technique ; « se révolter » restitue la vigueur de l’accusation.
