base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/016.yaml
  text: And when they heard all the words[a], each man turned in fear to his companion, and they said to Baruch, “We must surely tell the king all these words.”
translation:
  language: fr
  text: 'Quand ils eurent entendu toutes les paroles, ils se regardèrent les uns les autres avec effroi[a]. Puis ils dirent à Baruch : « Nous devons absolument rapporter au roi toutes ces paroles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ils eurent peur, chacun vers son compagnon ». Cette expression décrit une réaction de peur entre eux; on peut aussi traduire : « chacun regarda son compagnon avec effroi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Quand ils eurent entendu
  rationale: La tournure narrative avec וַיְהִי introduit ici la réaction qui suit l’écoute. Le français rend naturellement la relation temporelle sans reproduire lourdement « il arriva que ».
- source_word: אֶת כָּל הַדְּבָרִים
  choice: toutes ces paroles
  rationale: Dans le contexte de la lecture du rouleau, דְּבָרִים désigne les paroles qui viennent d’être lues. « Ces » explicite en français la référence immédiate sans modifier le sens.
- source_word: פָּחֲדוּ אִישׁ אֶל רֵעֵהוּ
  choice: ils prirent peur et se regardèrent les uns les autres
  rationale: פָּחֲדוּ exprime la peur, tandis que l’expression distributive אִישׁ אֶל רֵעֵהוּ décrit une réaction mutuelle. La formulation française conserve les deux éléments, tout en signalant par une note que l’action de se regarder reste une explicitation possible de l’idiome.
- source_word: וַיֹּאמְרוּ אֶל בָּרוּךְ
  choice: Puis ils dirent à Baruch
  rationale: « Puis » marque avec naturel la progression du récit, et « dirent » correspond au sens simple du verbe.
- source_word: הַגֵּיד נַגִּיד
  choice: Nous devons absolument rapporter
  rationale: L’infinitif absolu associé à l’imparfait de נגד renforce l’affirmation. La première personne du pluriel indique que les responsables annoncent leur ferme intention ou nécessité de faire un rapport, et non qu’ils donnent à Baruch seul l’ordre de parler.
- source_word: לַמֶּלֶךְ
  choice: au roi
  rationale: Le roi régnant est défini par le contexte; cette traduction est directe et naturelle.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: « Paroles » convient au contenu du rouleau et préserve la répétition présente dans l’hébreu.
