source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/שָּׁנָ֣ה הָ/רְבִיעִ֔ת לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָ֞ה הַ/דָּבָ֤ר הַ/זֶּה֙ אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/001.yaml
  text: In the fourth year of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying,
translation:
  language: fr
  text: 'La quatrième année du règne de Jojakim, fils de Josias, roi de Juda, cette parole fut adressée à Jérémie de la part de Yahweh :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הָרְבִיעִת לִיהוֹיָקִים
  choice: La quatrième année du règne de Jojakim
  rationale: La formule narrative situe directement l’événement dans le temps. « Du règne de » explicite naturellement en français la datation selon l’année royale, sans ajouter de contenu substantiel.
- source_word: בֶּן־יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: fils de Josias, roi de Juda
  rationale: Rendu direct du lien filial et du titre royal; la ponctuation française rattache sans ambiguïté « roi de Juda » à Jojakim.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל־יִרְמְיָהוּ
  choice: cette parole fut adressée à Jérémie
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message divin. « Fut adressée » rend idiomatiquement היה ... אל tout en conservant « parole » et sa portée théologique.
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: מֵאֵת marque ici l’origine personnelle de la parole. Le nom divin est translittéré « Yahweh » afin de représenter directement le tétragramme.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit naturellement en français moderne les paroles qui suivent au verset suivant; il remplit la fonction de l’infinitif hébreu sans le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le caractère de nom propre plutôt que de le remplacer par un titre.
- issue: Portée de הַדָּבָר הַזֶּה
  choice: cette parole
  alternative: ce message
  rationale: « Parole » préserve l’idiome prophétique et sa résonance théologique, sans exclure le sens concret de message communiqué.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe évite l’archaïsme « il arriva que » et le calque « en disant », tout en conservant la formule prophétique et le nom divin.
