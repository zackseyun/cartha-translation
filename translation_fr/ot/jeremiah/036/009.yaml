source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/שָּׁנָ֣ה הַ֠/חֲמִשִׁית לִ/יהוֹיָקִ֨ים בֶּן יֹאשִׁיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בַּ/חֹ֣דֶשׁ הַ/תְּשִׁעִ֔י קָרְא֨וּ צ֜וֹם לִ/פְנֵ֧י יְהוָ֛ה כָּל הָ/עָ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/כָל הָ/עָ֗ם הַ/בָּאִ֛ים מֵ/עָרֵ֥י יְהוּדָ֖ה בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/009.yaml
  text: And it happened in the fifth year of Jehoiakim son of Josiah[a], king of Judah, in the ninth month, that they proclaimed a fast before Yahweh for all the people in Jerusalem and all the people coming from the cities of Judah into Jerusalem.
translation:
  language: fr
  text: La cinquième année du règne de Jojakim, fils de Josias et roi de Juda, au neuvième mois, on proclama un jeûne devant Yahvé[a] pour tout le peuple qui se trouvait à Jérusalem et pour tous ceux qui venaient des villes de Juda à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: Signaler l’autre convention courante pour traduire le nom divin.
lexical_decisions:
- source_word: וַיְהִי
  choice: La cinquième année…
  rationale: La formule narrative hébraïque introduit ici la date de l’événement. En français actuel, l’intégrer directement à la proposition produit un récit naturel sans recourir à l’archaïsme « il advint ».
- source_word: בַשָּׁנָה הַחֲמִשִׁית לִיהוֹיָקִים
  choice: La cinquième année du règne de Jojakim
  rationale: Dans cette formule de datation royale, le lamed désigne l’année du règne du roi; l’explicitation « du règne » est naturelle et non ambiguë en français.
- source_word: לִיהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Jojakim, fils de Josias et roi de Juda
  rationale: Les formes françaises usuelles des noms bibliques sont retenues. La coordination précise naturellement que « roi de Juda » qualifie Jojakim.
- source_word: בַּחֹדֶשׁ הַתְּשִׁעִי
  choice: au neuvième mois
  rationale: Traduction directe de la notation calendaire, sans ajouter le nom d’un mois absent de l’hébreu.
- source_word: קָרְאוּ צוֹם
  choice: on proclama un jeûne
  rationale: קרא associé à צום désigne la proclamation publique d’un jeûne. Le pronom indéfini « on » respecte le sujet non exprimé du verbe sans attribuer arbitrairement l’initiative au peuple.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: « Devant » conserve l’idée d’orientation ou de présence exprimée par לִפְנֵי, tandis que « Yahvé » représente le nom divin.
- source_word: כָּל הָעָם בִּירוּשָׁלָם
  choice: tout le peuple qui se trouvait à Jérusalem
  rationale: Cette formulation conserve la localisation marquée par ב et évite de limiter le groupe aux seuls habitants originaires de Jérusalem.
- source_word: וְכָל הָעָם הַבָּאִים מֵעָרֵי יְהוּדָה בִּירוּשָׁלָם
  choice: et pour tous ceux qui venaient des villes de Juda à Jérusalem
  rationale: La relative rend naturellement le participe הַבָּאִים. Le second « pour » clarifie que ces personnes sont également concernées par le jeûne; le dernier complément indique leur mouvement vers Jérusalem.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » préserve sa fonction de nom propre, sans imposer une lecture confessionnelle particulière.
- issue: Sujet de la proclamation du jeûne
  choice: sujet indéfini rendu par « on »
  alternative: faire du peuple le sujet de « proclama »
  rationale: La forme verbale קָרְאוּ a un sujet pluriel non exprimé. Le contexte ne l’identifie pas; une tournure indéfinie préserve cette indétermination et évite de présenter les participants comme les autorités ayant proclamé le jeûne.
translation_notes:
  register: Français international moderne, clair et digne. La longue phrase conserve la structure chronologique du verset, mais les relations syntaxiques sont explicitées avec sobriété. Le redoublement de « Jérusalem » est maintenu parce qu’il distingue les personnes déjà présentes de celles qui arrivent des villes de Juda.
