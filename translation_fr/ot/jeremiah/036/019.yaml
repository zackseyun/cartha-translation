  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ אֶל בָּר֔וּךְ לֵ֥ךְ הִסָּתֵ֖ר אַתָּ֣ה וְ/יִרְמְיָ֑הוּ וְ/אִ֥ישׁ אַל יֵדַ֖ע אֵיפֹ֥ה אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/019.yaml
  text: Then the officials said to Baruch, “Go, hide yourself, you and Jeremiah, and let no one know where you are.”
translation:
  language: fr
  text: 'Alors les hauts fonctionnaires dirent à Baruch : « Va te cacher, toi et Jérémie, et que personne ne sache où vous êtes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Dans ce contexte royal et administratif, שׂרים désigne des dignitaires exerçant une autorité. « Hauts fonctionnaires » est moderne et précis, sans l’ambiguïté dynastique de « princes ».
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif de הלך appelle ici un ordre direct; « Va » en conserve simplement la force.
- source_word: הִסָּתֵר
  choice: te cacher
  rationale: L’impératif nifal de סתר exprime l’action de se dissimuler. Après « Va », l’infinitif « te cacher » produit en français une formulation naturelle.
- source_word: אַתָּה וְיִרְמְיָהוּ
  choice: toi et Jérémie
  rationale: Le pronom explicite met Baruch en relief comme destinataire, puis lui associe Jérémie. « Toi et Jérémie » préserve cette structure emphatique.
- source_word: וְאִישׁ אַל יֵדַע
  choice: et que personne ne sache
  rationale: אישׁ sous la négation a une valeur indéfinie (« personne »), tandis que la construction prohibitive est naturellement rendue par « que personne ne sache ».
- source_word: אֵיפֹה אַתֶּם
  choice: où vous êtes
  rationale: Le pronom pluriel englobe Baruch et Jérémie. « Où vous êtes » rend directement leur lieu de retraite.
- source_word: וַיֹּאמְרוּ
  choice: Alors ... dirent
  rationale: La forme narrative fait progresser la séquence. « Alors » exprime cet enchaînement, et le passé simple convient au registre narratif biblique digne sans être obscur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif soutenu courant dans la traduction biblique; la parole directe reste concise et impérative.
