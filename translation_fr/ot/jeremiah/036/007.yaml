  text: אוּלַ֞י תִּפֹּ֤ל תְּחִנָּתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה כִּֽי גָד֤וֹל הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל הָ/עָ֥ם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/007.yaml
  text: Perhaps their plea will fall before Yahweh[a], and each man will turn from his evil way[c][b], for great is the anger and the wrath that Yahweh has spoken against this people.
translation:
  language: fr
  text: Peut-être leur supplication sera-t-elle présentée devant Yahweh[a], et chacun se détournera de sa mauvaise voie[b], car grandes sont la colère et la fureur que Yahweh a prononcées contre ce peuple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur supplication tombera devant Yahweh »; c’est-à-dire qu’elle sera portée en sa présence.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chaque homme se détournera de sa mauvaise voie ». L’hébreu emploie un masculin singulier avec une valeur distributive.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « que Yahweh a adressées à ce peuple ». La préposition hébraïque signifie formellement « à » ou « vers »; « contre » fait ressortir le contexte de jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Peut-être
  rationale: Exprime une possibilité teintée d’espoir, sans en faire une certitude.
- source_word: תִּפֹּל תְּחִנָּתָם לִפְנֵי יְהוָה
  choice: leur supplication parviendra devant Yahweh
  rationale: L’hébreu dit littéralement que la supplication « tombera devant » Yahweh. En français actuel, « parviendra devant » conserve l’idée d’une requête portée en sa présence sans produire une tournure obscure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: וְיָשֻׁבוּ
  choice: et chacun se détournera
  rationale: Le verbe שׁוב évoque ici un changement de direction morale. « Se détourner de » préserve cette image sans expliciter davantage par « se repentir ».
- source_word: אִישׁ
  choice: chacun
  rationale: Rend naturellement en français la valeur distributive du masculin singulier hébreu; le contexte vise chaque membre du peuple individuellement.
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: de sa mauvaise voie
  rationale: Conserve la métaphore biblique de la « voie » pour la conduite et rend רָעָה sans amplification.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison qui rend urgent le changement de conduite.
- source_word: גָדוֹל הָאַף וְהַחֵמָה
  choice: grandes sont la colère et la fureur
  rationale: Préserve les deux termes hébreux qui se renforcent mutuellement ainsi que l’accent porté sur leur intensité.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל הָעָם הַזֶּה
  choice: que Yahweh a annoncées contre ce peuple
  rationale: Le verbe signifie littéralement « a dites/parlées » et אֶל « à/vers ». Dans ce contexte de jugement, « annoncées contre » donne un français naturel tout en signalant l’orientation menaçante des paroles.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin; sa transcription permet de le distinguer d’un titre.
- issue: Valeur individuelle de אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: « Chacun » restitue clairement la distribution individu par individu en français naturel. La forme hébraïque est un masculin singulier distributif, fait signalé en note.
- issue: Orientation de la parole divine avec אֶל
  choice: annoncées contre ce peuple
  alternative: adressées à ce peuple
  rationale: Le contexte immédiat est celui d’une menace de colère. Toutefois, la préposition signifie formellement « à/vers »; l’alternative est donc conservée en note afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la métaphore de la voie, distingue les deux termes relatifs à la colère et préserve en note les particularités de l’idiome hébreu ainsi que l’ambiguïté de la préposition finale.
