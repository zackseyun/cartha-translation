  text: וַ/יְצַוֶּ֣ה יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ לֵ/אמֹ֑ר אֲנִ֣י עָצ֔וּר לֹ֣א אוּכַ֔ל לָ/ב֖וֹא בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/005.yaml
  text: Then Jeremiah commanded Baruch[a], saying, “I am restrained; I cannot go into the house of Yahweh.”
translation:
  language: fr
  text: 'Jérémie ordonna à Baruch : « Je suis retenu[a] ; je ne peux pas entrer dans la maison de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détenu », « enfermé » ou « empêché ». L’hébreu ne précise pas la nature exacte de la restriction subie par Jérémie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: donna cet ordre
  rationale: Le piel de צוה exprime un ordre ou une directive. Cette tournure française conserve cette force tout en restant naturelle.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles qui suivent sans qu’il soit nécessaire de traduire littéralement « en disant ».
- source_word: עָצוּר
  choice: retenu
  rationale: Le terme indique que Jérémie est empêché ou maintenu à l’écart, sans préciser la nature de la contrainte. « Retenu » préserve cette ambiguïté.
- source_word: לֹא אוּכַל
  choice: je ne peux pas
  rationale: Rendu idiomatique direct de l’incapacité exprimée par la forme négative de יכל.
- source_word: לָבוֹא
  choice: entrer
  rationale: Dans la construction avec la maison de Yahweh, le verbe désigne l’entrée dans le sanctuaire ou son enceinte.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction conserve l’expression hébraïque « maison de YHWH » ainsi que le nom divin, tout en demeurant intelligible en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom propre divin est translittéré afin de représenter directement le tétragramme du texte hébreu.
theological_decisions:
- issue: Nature de la restriction imposée à Jérémie
  choice: retenu
  alternative: détenu, enfermé ou empêché
  rationale: Le contexte immédiat ne précise pas si la restriction est officielle, physique, rituelle ou d’une autre nature ; la traduction ne doit donc pas l’identifier à un emprisonnement.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve ici sa fonction de nom propre sans substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite l’archaïsme « disant » et conserve l’ambiguïté du participe hébreu עָצוּר.
