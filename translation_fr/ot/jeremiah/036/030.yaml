language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַל יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִֽהְיֶה לּ֥/וֹ יוֹשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד וְ/נִבְלָת/וֹ֙ תִּֽהְיֶ֣ה מֻשְׁלֶ֔כֶת לַ/חֹ֥רֶב בַּ/יּ֖וֹם וְ/לַ/קֶּ֥רַח בַּ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/030.yaml
  text: 'Therefore this is what Yahweh says concerning Jehoiakim king of Judah: He will have no one to sit on the throne of David[a], and his dead body will be thrown out to the heat by day and to the frost by night.'
translation:
  language: fr
  text: 'C’est pourquoi voici ce que dit Yahweh au sujet de Jojakim, roi de Juda : Il n’aura personne pour siéger sur le trône de David, et son cadavre sera jeté dehors et exposé à la chaleur[a] le jour et au gel la nuit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « chaleur » peut aussi désigner la sécheresse ou l’aridité.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime clairement la conséquence du jugement annoncé dans le contexte précédent, tout en restant naturel en français moderne.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Rend de manière naturelle et reconnaissable la formule prophétique de messager, tout en conservant le nom divin.
- source_word: עַל
  choice: au sujet de
  rationale: Introduit la personne visée par l’oracle sans imposer à la préposition seule la nuance plus forte de « contre ».
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Jojakim, roi de Juda
  rationale: Emploie la forme française usuelle du nom et conserve directement le titre royal.
- source_word: לֹא יִהְיֶה לּוֹ יוֹשֵׁב עַל כִּסֵּא דָוִד
  choice: Il n’aura personne pour siéger sur le trône de David
  rationale: Reproduit l’idée de l’idiome hébreu sans ajouter explicitement « descendant », bien que cette implication dynastique soit probable.
- source_word: נִבְלָתוֹ
  choice: son cadavre
  rationale: Terme français direct et digne qui garde la dureté et l’indignité de l’image.
- source_word: מֻשְׁלֶכֶת
  choice: sera jeté dehors
  rationale: Exprime le rejet et l’abandon déshonorant du corps dans une langue courante et vive.
- source_word: לַחֹרֶב בַּיּוֹם
  choice: exposé à la chaleur pendant le jour
  rationale: Dans le parallélisme avec le gel nocturne et le contexte d’un corps privé de sépulture, « chaleur » rend au mieux l’exposition diurne; « exposé » explicite naturellement la relation sans changer l’image.
- source_word: לַקֶּרַח בַּלָּיְלָה
  choice: au gel pendant la nuit
  rationale: « Gel » conserve l’image concrète de קֶרַח et le contraste entre les extrêmes du jour et de la nuit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Portée dynastique de יוֹשֵׁב עַל כִּסֵּא דָוִד
  choice: personne pour siéger sur le trône de David
  alternative: aucun de ses descendants ne siégera sur le trône de David
  rationale: Le contexte suggère une portée dynastique, mais le mot « descendant » n’est pas exprimé; la traduction préserve donc la formulation plus ouverte de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique reste marquée sans archaïsme; « cadavre » et « jeté dehors » conservent la violence déshonorante du jugement.
