source:
  edition: WLC
  text: וַ/יִּקְרָ֨א בָר֥וּךְ בַּ/סֵּ֛פֶר אֶת דִּבְרֵ֥י יִרְמְיָ֖הוּ בֵּ֣ית יְהוָ֑ה בְּ/לִשְׁכַּ֡ת גְּמַרְיָהוּ֩ בֶן שָׁפָ֨ן הַ/סֹּפֵ֜ר בֶּ/חָצֵ֣ר הָ/עֶלְי֗וֹן פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הֶֽ/חָדָ֔שׁ בְּ/אָזְנֵ֖י כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/010.yaml
  text: And Baruch read from the scroll the words of Jeremiah in the house of Yahweh[a], in the chamber of Gemariah son of Shaphan the scribe, in the upper court, at the entrance of the new gate of the house of Yahweh, in the hearing of all the people.
translation:
  language: fr
  text: Baruch lut dans le rouleau les paroles de Jérémie, dans la maison de Yahweh[a], dans la salle de Guemaria, fils de Shaphân le scribe, dans la cour supérieure, à l’entrée de la porte nouvelle de la maison de Yahweh, à l’écoute de tout le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temple de Yahweh » ; littéralement, « la maison de Yahweh » désigne ici le temple et ses dépendances.
    reason: Alternative lexicale pour בֵּית יְהוָה, tout en conservant le rendu retenu du nom divin.
lexical_decisions:
- source_word: וַיִּקְרָא ... בַּסֵּפֶר
  choice: lut dans le rouleau
  rationale: קרא désigne ici une lecture publique à voix haute, et ספר un document écrit sous forme de rouleau. La préposition ב est conservée par la tournure française naturelle « lire dans le rouleau ».
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: les paroles de Jérémie
  rationale: Cette formulation garde le rapport construit de l’hébreu et le registre prophétique de « paroles ».
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » rend formellement בֵּית tout en désignant ici le temple et ses dépendances; le nom divin est translittéré « Yahweh ».
- source_word: בְּלִשְׁכַּת
  choice: dans la salle de
  rationale: לִשְׁכָּה désigne une pièce officielle située dans l’enceinte du temple. « Salle » est clair et actuel, sans la nuance résidentielle que pourrait avoir « chambre ».
- source_word: גְּמַרְיָהוּ בֶן שָׁפָן הַסֹּפֵר
  choice: Guemaria, fils de Shafân, le scribe
  rationale: Les noms sont translittérés en français. La ponctuation rattache naturellement le titre « le scribe » à Shafân, le nom immédiatement précédent, conformément à la syntaxe hébraïque.
- source_word: בֶּחָצֵר הָעֶלְיוֹן
  choice: dans la cour supérieure
  rationale: La formulation rend directement le vocabulaire architectural du complexe du temple.
- source_word: פֶּתַח שַׁעַר ... הֶחָדָשׁ
  choice: à l’entrée de la nouvelle porte
  rationale: פֶּתַח indique l’entrée ou l’ouverture, tandis que חָדָשׁ est rendu simplement par « nouvelle ».
- source_word: בְּאָזְנֵי כָּל הָעָם
  choice: devant tout le peuple
  rationale: Littéralement « aux oreilles de tout le peuple », l’expression signifie que la lecture est faite publiquement et de manière audible. La reprise « Il lut » explicite naturellement en français cette relation après la longue indication de lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre; une note indique l’équivalent traditionnel courant.
- issue: Référent du titre הַסֹּפֵר
  choice: Shafân, le scribe
  alternative: Guemaria, fils du scribe Shafân
  rationale: L’apposition hébraïque suit immédiatement « Shafân » et s’accorde avec lui; la traduction garde ce rattachement sans surinterpréter la fonction administrative précise.
translation_notes:
  register: Français international moderne, digne et accessible. La longue phrase hébraïque est divisée afin d’éviter une accumulation lourde d’indications de lieu, tout en conservant leur ordre et leur relation. Le passé simple convient au registre narratif biblique actuel.
