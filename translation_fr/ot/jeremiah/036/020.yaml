  text: וַ/יָּבֹ֤אוּ אֶל הַ/מֶּ֨לֶךְ֙ חָצֵ֔רָ/ה וְ/אֶת הַ/מְּגִלָּ֣ה הִפְקִ֔דוּ בְּ/לִשְׁכַּ֖ת אֱלִישָׁמָ֣ע הַ/סֹּפֵ֑ר וַ/יַּגִּ֨ידוּ֙ בְּ/אָזְנֵ֣י הַ/מֶּ֔לֶךְ אֵ֖ת כָּל הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/020.yaml
  text: Then they went to the king in the court[a], and they deposited the scroll in the chamber of Elishama the scribe[b], and they reported all the words in the hearing of the king.
translation:
  language: fr
  text: Puis ils allèrent trouver le roi dans la cour ; ils déposèrent le rouleau dans la chambre d’Élishama, le scribe, et ils rapportèrent au roi toutes les paroles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־הַמֶּלֶךְ חָצֵרָה
  choice: Puis ils se rendirent auprès du roi, dans la cour
  rationale: Le wayyiqtol fait progresser le récit, tandis que le ה directionnel de חָצֵרָה exprime le mouvement vers la cour. La formulation française indique naturellement que le roi s’y trouve sans multiplier les compléments de destination.
- source_word: הַמְּגִלָּה
  choice: le rouleau
  rationale: מְגִלָּה désigne ici un document écrit enroulé. « Rouleau » est le terme français courant dans ce contexte ancien.
- source_word: הִפְקִדוּ
  choice: après avoir laissé … en dépôt
  rationale: Le hiphil de פקד signifie ici placer ou confier quelque chose pour qu’il soit gardé. La tournure rend explicite que le rouleau a été mis en sûreté avant l’entretien avec le roi.
- source_word: בְּלִשְׁכַּת אֱלִישָׁמָע
  choice: dans la salle d’Élishama
  rationale: לִשְׁכָּה désigne une salle ou pièce officielle. « Salle » reste naturel en français tout en convenant au cadre palatial.
- source_word: הַסֹּפֵר
  choice: le secrétaire
  rationale: Dans le cadre de la cour royale, סֹפֵר désigne vraisemblablement un haut fonctionnaire chargé des écrits; « secrétaire » communique mieux cette fonction au lecteur moderne que « scribe ».
- source_word: וַיַּגִּידוּ בְּאָזְנֵי הַמֶּלֶךְ
  choice: Ils rapportèrent au roi
  rationale: נגד au hiphil signifie annoncer ou rapporter. L’expression littérale « aux oreilles du roi » est un idiome signifiant qu’ils lui firent entendre leur rapport.
- source_word: אֵת כָּל־הַדְּבָרִים
  choice: tout ce qui avait été dit
  rationale: דְּבָרִים peut désigner des paroles ou des faits. Dans le contexte immédiat, il s’agit du contenu entendu lors de la lecture; cette formulation française conserve ce lien sans suggérer nécessairement une récitation mot à mot.
