  yaml_path: translation/ot/jeremiah/036/025.yaml
  text: Yet even Elnathan[a], Delaiah, and Gemariah urged the king not to burn the scroll, but he did not listen to them.
translation:
  language: fr
  text: Même Elnathan, Delaya et Guemaria supplièrent le roi de ne pas brûler le rouleau, mais il ne les écouta pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: Même
  rationale: Dans ce contexte, la combinaison marque une addition emphatique, avec une légère nuance de contraste. « Même » l’exprime naturellement en français sans alourdir la phrase.
- source_word: הִפְגִּעוּ בַמֶּלֶךְ
  choice: supplièrent le roi
  rationale: Le hiphil de פגע avec ב désigne ici une démarche insistante auprès du roi. « Supplièrent le roi » restitue la force de l’appel et constitue une tournure française naturelle.
- source_word: לְבִלְתִּי שְׂרֹף
  choice: de ne pas brûler
  rationale: La construction exprime l’action que les responsables demandent au roi de ne pas accomplir. Cet infinitif négatif est la formulation française la plus directe après « supplier ».
- source_word: הַמְּגִלָּה
  choice: le rouleau
  rationale: מְגִלָּה désigne ici le rouleau matériel sur lequel le texte a été écrit. « Rouleau » est précis et bien établi dans ce contexte narratif.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: mais il ne les écouta pas
  rationale: Le contexte donne à la conjonction une valeur adversative. « Ne les écouta pas » rend clairement le refus du roi de tenir compte de leur requête.
