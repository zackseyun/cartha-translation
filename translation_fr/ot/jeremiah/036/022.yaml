  text: וְ/הַ/מֶּ֗לֶךְ יוֹשֵׁב֙ בֵּ֣ית הַ/חֹ֔רֶף בַּ/חֹ֖דֶשׁ הַ/תְּשִׁיעִ֑י וְ/אֶת הָ/אָ֖ח לְ/פָנָ֥י/ו מְבֹעָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/022.yaml
  text: The king was sitting in the winter house in the ninth month[a], with the brazier burning before him.
translation:
  language: fr
  text: Le roi était assis dans la résidence d’hiver, au neuvième mois[a], et le brasero était allumé devant lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le neuvième mois correspond approximativement à novembre-décembre.
    reason: contexte_calendaire
  - marker: b
    text: Ou « récipient à feu » ; le terme hébreu désigne un récipient contenant des braises ou du feu, utilisé pour se chauffer.
    reason: alternative_lexicale
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Le roi
  rationale: Le nom est défini. Le ו narratif n’a pas besoin d’être rendu isolément en français dans cette phrase descriptive.
- source_word: יוֹשֵׁב
  choice: était assis
  rationale: Le participe présente une situation en cours et sert à planter le décor.
- source_word: בֵּית הַחֹרֶף
  choice: la résidence d’hiver
  rationale: Littéralement « maison d’hiver » ; « résidence d’hiver » exprime naturellement en français le lieu saisonnier sans préciser indûment qu’il s’agit d’un palais.
- source_word: בַּחֹדֶשׁ הַתְּשִׁיעִי
  choice: au neuvième mois
  rationale: Rendu direct de l’indication temporelle selon le calendrier mentionné dans le récit.
- source_word: וְאֶת
  choice: tandis que
  rationale: Introduit ici une circonstance concomitante ; « tandis que » rend naturellement le rapport avec la proposition principale.
- source_word: הָאָח
  choice: un brasero
  rationale: Le terme désigne un récipient contenant du feu ou des braises pour se chauffer ; « brasero » est précis et courant.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Équivalent spatial naturel et exact.
- source_word: מְבֹעָרֶת
  choice: brûlait
  rationale: Le participe passif décrit le brasero comme allumé ou en train de brûler ; le français emploie naturellement le verbe actif avec ce sujet.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Résidence d’hiver » évite le calque moins naturel « maison d’hiver » ainsi que la précision non explicite de « palais ». Le marqueur [a] figure dans le texte principal.
