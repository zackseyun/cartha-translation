  text: וְ/יִרְמְיָ֜הוּ לָקַ֣ח מְגִלָּ֣ה אַחֶ֗רֶת וַֽ/יִּתְּנָ/הּ֮ אֶל בָּר֣וּךְ בֶּן נֵרִיָּהוּ֮ הַ/סֹּפֵר֒ וַ/יִּכְתֹּ֤ב עָלֶ֨י/הָ֙ מִ/פִּ֣י יִרְמְיָ֔הוּ אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׂרַ֛ף יְהוֹיָקִ֥ים מֶֽלֶךְ יְהוּדָ֖ה בָּ/אֵ֑שׁ וְ/ע֨וֹד נוֹסַ֧ף עֲלֵי/הֶ֛ם דְּבָרִ֥ים רַבִּ֖ים כָּ/הֵֽמָּה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/032.yaml
  text: Then Jeremiah took another scroll and gave it to Baruch son of Neriah[a], the scribe, and he wrote on it from the mouth of Jeremiah all the words of the scroll that Jehoiakim king of Judah had burned in the fire; and many similar words were added to them besides.
translation:
  language: fr
  text: Jérémie prit alors un autre rouleau et le donna au scribe Baruch, fils de Nérija. Celui-ci y écrivit, sous la dictée de Jérémie[a], toutes les paroles du rouleau que Jojakim, roi de Juda, avait brûlé dans le feu. De nombreuses autres paroles semblables furent ajoutées à celles-ci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la bouche de Jérémie ».'
    reason: La note conserve l’image hébraïque derrière l’expression française idiomatique « sous la dictée de Jérémie ».
lexical_decisions:
- source_word: מְגִלָּה אַחֶרֶת
  choice: un autre rouleau
  rationale: « Rouleau » désigne clairement et concrètement le support écrit ancien; אַחֶרֶת signifie « autre ».
- source_word: וַיִּתְּנָהּ אֶל בָּרוּךְ
  choice: le donna à Baruch
  rationale: Rend directement le verbe נתן et son complément, sans ajouter l’idée plus précise de le lui remettre en main propre.
- source_word: הַסֹּפֵר
  choice: le scribe
  rationale: « Scribe » conserve la fonction historique de rédacteur professionnel; « secrétaire » serait possible, mais évoquerait plus facilement une fonction administrative moderne.
- source_word: וַיִּכְתֹּב עָלֶיהָ
  choice: Celui-ci y écrivit
  rationale: Le sujet naturel est Baruch, antécédent immédiat. « Celui-ci » lève en français l’ambiguïté créée par deux personnages masculins, et « y » renvoie au rouleau.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: sous la dictée de Jérémie
  rationale: Littéralement « de la bouche de Jérémie »; l’expression désigne ici la transmission orale consignée par Baruch. La formulation idiomatique est retenue dans le texte, avec le sens littéral en note.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: toutes les paroles du rouleau
  rationale: דְּבָרִים peut signifier « paroles » ou « mots »; « paroles » convient au contenu prophétique transmis oralement. Dans ce contexte, סֵפֶר renvoie au rouleau matériel détruit puis remplacé.
- source_word: אֲשֶׁר שָׂרַף ... בָּאֵשׁ
  choice: que Jojakim, roi de Juda, avait brûlé dans le feu
  rationale: Le plus-que-parfait situe correctement la destruction avant la copie. « Dans le feu » suit explicitement בָּאֵשׁ sans transformer le geste en « jeter au feu ».
- source_word: וְעוֹד נוֹסַף עֲלֵיהֶם דְּבָרִים רַבִּים כָּהֵמָּה
  choice: De nombreuses autres paroles semblables y furent ajoutées
  rationale: La tournure passive rend le niphal נוֹסַף; « autres » exprime וְעוֹד et « semblables » rend כָּהֵמָּה. Le pronom « y » renvoie naturellement au rouleau.
