  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑הוּ אַחֲרֵ֣י שְׂרֹ֣ף הַ/מֶּ֗לֶךְ אֶת הַ/מְּגִלָּה֙ וְ/אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֨ר כָּתַ֥ב בָּר֛וּךְ מִ/פִּ֥י יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/027.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after the king had burned the scroll and the words that Baruch had written from the mouth of Jeremiah, saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh parvint à Jérémie, après que le roi eut brûlé le rouleau et les paroles que Baruch avait écrites sous la dictée de Jérémie[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la bouche de Jérémie ».'
    reason: La note préserve l’image hébraïque sous-jacente à l’expression idiomatique rendue dans le texte par « sous la dictée de Jérémie ».
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: Alors la parole de Yahweh parvint à Jérémie
  rationale: La formule conserve « la parole de Yahweh », expression prophétique consacrée, tandis que « alors » marque naturellement la progression narrative du wayyiqtol.
- source_word: אַחֲרֵי שְׂרֹף הַמֶּלֶךְ
  choice: après que le roi eut brûlé
  rationale: La préposition suivie de l’infinitif construit exprime l’antériorité. Le passé antérieur convient au récit littéraire et situe clairement l’incendie avant la venue de la parole.
- source_word: הַמְּגִלָּה
  choice: le rouleau
  rationale: מְגִלָּה désigne un document écrit enroulé ; « rouleau » est l’équivalent français courant dans ce contexte ancien.
- source_word: וְאֶת הַדְּבָרִים
  choice: et les paroles
  rationale: Le texte distingue le support matériel, le rouleau, de son contenu verbal. « Paroles » maintient cette distinction ainsi que la portée prophétique.
- source_word: אֲשֶׁר כָּתַב בָּרוּךְ
  choice: que Baruch avait écrites
  rationale: Le plus-que-parfait rend clairement l’écriture antérieure à l’acte du roi ; l’accord féminin pluriel renvoie à « paroles ».
- source_word: מִפִּי יִרְמְיָהוּ
  choice: sous la dictée de Jérémie
  rationale: Littéralement « de la bouche de Jérémie », l’expression indique que Baruch écrivait ce que Jérémie prononçait. La formulation choisie est naturelle en français et le sens littéral est signalé en note.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif « disant » introduit la parole divine qui suit. En français actuel, les deux-points remplissent naturellement cette fonction sans alourdir la phrase.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom personnel. « Yahweh » le conserve au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. « Parvint » et le passé antérieur donnent une tenue narrative sans archaïsme excessif. Les deux-points annoncent directement le discours du verset suivant.
