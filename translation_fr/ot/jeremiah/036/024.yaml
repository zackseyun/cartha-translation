  yaml_path: translation/ot/jeremiah/036/024.yaml
  text: Yet neither the king nor any of his servants who heard all these words were afraid[b][a], nor did they tear their garments.
translation:
  language: fr
  text: Pourtant, le roi et tous ses serviteurs qui avaient entendu toutes ces paroles n’eurent pas peur et ne déchirèrent pas leurs vêtements[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements était, dans le Proche-Orient ancien, une manière habituelle d’exprimer le deuil, l’horreur ou la repentance.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא פָחֲדוּ
  choice: ne furent saisis de crainte
  rationale: Le verbe פחד exprime la peur ou l'effroi. Cette formulation naturelle et digne rend ici la réaction de crainte attendue sans en exagérer l'intensité.
- source_word: וְלֹא ... הַמֶּלֶךְ וְכָל־עֲבָדָיו
  choice: Pourtant, ni le roi ni aucun de ses serviteurs ... ne
  rationale: La double négation hébraïque est restructurée selon l'idiome français. « Pourtant » restitue la portée adversative du contexte, et « aucun de ses serviteurs » évite de suggérer que seule une partie d'entre eux est visée.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce cadre royal, le terme désigne les hommes au service du roi, vraisemblablement ses officiers ou courtisans. « Serviteurs » conserve le terme traditionnel sans imposer ici la nuance d'esclavage.
- source_word: הַשֹּׁמְעִים
  choice: qui avaient entendu
  rationale: Le participe qualifie le roi et ses serviteurs comme les auditeurs des paroles lues. Le plus-que-parfait situe naturellement cette audition avant l'absence de réaction rapportée.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דברים peut signifier « paroles », « choses » ou « affaires ». Puisqu'il s'agit du contenu d'un rouleau lu à haute voix, « paroles » préserve au mieux la dimension verbale et textuelle.
- source_word: קָרְעוּ אֶת־בִּגְדֵיהֶם
  choice: déchirèrent leurs vêtements
  rationale: La traduction garde concrètement le geste culturel de déchirer ses habits en signe de deuil, d'horreur ou de repentance, dans un registre littéraire accessible.
theological_decisions:
- issue: Nature de la réaction attendue devant les paroles prophétiques
  choice: Conserver côte à côte l'absence de crainte et l'absence du geste de déchirer les vêtements
  alternative: Interpréter explicitement ces réactions comme une absence de repentance
  rationale: Le texte décrit des réactions sans nommer directement la repentance. La traduction préserve cette tension et laisse la note culturelle éclairer le geste sans intégrer une interprétation théologique au corps du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La structure « ni... ni aucun... ne » rend clairement la portée des négations, tandis que « déchirer leurs vêtements » conserve l'image culturelle concrète. Le marqueur de note est placé immédiatement après l'expression expliquée.
