  text: וַ/יַּ֗עַשׂ בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יִרְמְיָ֣הוּ הַ/נָּבִ֑יא לִ/קְרֹ֥א בַ/סֵּ֛פֶר דִּבְרֵ֥י יְהוָ֖ה בֵּ֥ית יְהֹוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/008.yaml
  text: And Baruch son of Neriah did according to all that Jeremiah the prophet had commanded him, to read from the scroll the words of the LORD in the house of the LORD.
translation:
  language: fr
  text: 'Baruch, fils de Néria, fit tout ce que le prophète Jérémie lui avait ordonné : il lut dans le rouleau les paroles du SEIGNEUR dans la maison du SEIGNEUR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... כְּכֹל
  choice: fit tout ce que
  rationale: Expression française naturelle qui conserve l’idée d’une exécution complète des instructions reçues.
- source_word: לִקְרֹא בַסֵּפֶר
  choice: il lut dans le rouleau
  rationale: Le contexte donne à l’infinitif une valeur explicative quant au contenu de l’ordre exécuté. « Rouleau » rend le support écrit antique plus précisément que « livre ».
- source_word: דִּבְרֵי יְהוָה
  choice: les paroles du SEIGNEUR
  rationale: « Paroles » préserve le pluriel hébreu; « le SEIGNEUR » suit la convention française courante pour le tétragramme.
- source_word: בֵּית יְהוָה
  choice: la maison du SEIGNEUR
  rationale: Rendu formel de l’expression hébraïque, intelligible dans ce contexte cultuel sans expliciter « Temple ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La convention en petites capitales signale le nom divin tout en restant naturelle dans une Bible française; elle n’introduit aucune vocalisation disputée.
- issue: Rapport syntaxique de לִקְרֹא avec l’ordre de Jérémie
  choice: 'proposition explicative : « il lut »'
  alternative: « afin de lire » ou « de lire »
  rationale: Dans le récit, Baruch accomplit effectivement l’ordre; une proposition finie évite qu’en français l’infinitif paraisse exprimer seulement une intention, sans modifier le sens contextuel.
translation_notes:
  register: Français moderne, sobre et narratif. La répétition « du SEIGNEUR » est maintenue pour refléter celle de l’hébreu. Aucun marqueur de note n’est requis.
