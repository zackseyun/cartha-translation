  variant: modern international French
source:
  edition: WLC
  text: קַח לְ/ךָ֮ מְגִלַּת סֵפֶר֒ וְ/כָתַבְתָּ֣ אֵלֶ֗י/הָ אֵ֣ת כָּל הַ/דְּבָרִ֞ים אֲשֶׁר דִּבַּ֧רְתִּי אֵלֶ֛י/ךָ עַל יִשְׂרָאֵ֥ל וְ/עַל יְהוּדָ֖ה וְ/עַל כָּל הַ/גּוֹיִ֑ם מִ/יּ֞וֹם דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ מִ/ימֵ֣י יֹאשִׁיָּ֔הוּ וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/002.yaml
  text: Take for yourself a scroll[a], and write on it all the words that I have spoken to you concerning Israel and concerning Judah and concerning all the nations, from the day I spoke to you, from the days of Josiah until this day.
translation:
  language: fr
  text: Prends un rouleau et écris-y toutes les paroles que je t’ai adressées au sujet d’Israël, de Juda et de toutes les nations[a], depuis le jour où je t’ai parlé, depuis l’époque de Josias jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre Israël, contre Juda et contre toutes les nations ». Dans ce contexte prophétique, la préposition hébraïque peut avoir l’un ou l’autre sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח לְךָ
  choice: Prends
  rationale: Le datif éthique לְךָ implique Jérémie personnellement, mais « Prends-toi » serait peu naturel ou ambigu en français moderne. L’impératif simple exprime clairement l’ordre.
- source_word: מְגִלַּת סֵפֶר
  choice: un rouleau
  rationale: La construction désigne un rouleau destiné à l’écriture. « Rouleau » est l’équivalent français naturel et historiquement approprié.
- source_word: וְכָתַבְתָּ אֵלֶיהָ
  choice: et écris-y
  rationale: Le parfait coordonné prolonge l’impératif. Le pronom adverbial « y » renvoie naturellement au rouleau et rend l’idée d’écrire dessus.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: toutes les paroles
  rationale: Dans ce contexte de révélation prophétique mise par écrit, דְּבָרִים désigne les paroles transmises plutôt que de simples choses ou événements.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: que je t’ai adressées
  rationale: Cette formulation rend le discours divin dirigé vers Jérémie et s’accorde naturellement avec « paroles ».
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה וְעַל כָּל הַגּוֹיִם
  choice: au sujet d’Israël, de Juda et de toutes les nations
  rationale: עַל peut signifier « au sujet de » ou « contre » dans un contexte prophétique. Le sens plus large convient ici au résumé de l’ensemble des paroles reçues, sans limiter celles-ci aux jugements.
- source_word: מִיּוֹם דִּבַּרְתִּי אֵלֶיךָ
  choice: depuis le jour où j’ai commencé à te parler
  rationale: Le début de l’action est explicité naturellement en français et le début de la période est ensuite situé à l’époque de Josias.
- source_word: מִימֵי יֹאשִׁיָּהוּ
  choice: à l’époque de Josias
  rationale: L’expression idiomatique française rend les « jours de Josias » comme une période historique sans suggérer plusieurs règnes ou journées précises.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Cette formulation actuelle et digne exprime clairement le terme de la période indiquée par עַד.
theological_decisions:
- issue: Valeur de עַל devant Israël, Juda et les nations
  choice: au sujet d’Israël, de Juda et de toutes les nations
  alternative: contre Israël, contre Juda et contre toutes les nations
  rationale: Le verset récapitule toutes les paroles divines reçues par Jérémie, lesquelles ne se limitent pas nécessairement à des oracles de condamnation. Le texte principal conserve donc le sens relationnel large, tandis que la note préserve la valeur adversative possible dans le discours prophétique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe évite le littéralisme pesant tout en conservant la portée totale de « toutes les paroles » et l’ambiguïté réelle de la préposition עַל dans une note.
