  variant: modern international French
source:
  edition: WLC
  text: אוּלַ֤י יִשְׁמְעוּ֙ בֵּ֣ית יְהוּדָ֔ה אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י חֹשֵׁ֖ב לַ/עֲשׂ֣וֹת לָ/הֶ֑ם לְמַ֣עַן יָשׁ֗וּבוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֔ה וְ/סָלַחְתִּ֥י לַ/עֲוֺנָ֖/ם וּ/לְ/חַטָּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/003.yaml
  text: Perhaps the house of Judah will hear of all the disaster that I am planning to bring on them[a], so that each man may turn from his evil way[b], and I will forgive their iniquity and their sin.
translation:
  language: fr
  text: Peut-être la maison de Juda entendra-t-elle parler de tout le malheur que je projette de faire venir sur elle[a], afin que chacun se détourne de sa mauvaise voie[b], et je pardonnerai leur faute et leur péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la calamité ». L’hébreu dit littéralement « tout le mal » ; ici, il s’agit du malheur que Dieu menace de faire venir sur Juda dans son jugement, et non d’un mal moral en Dieu.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie au singulier un mot signifiant « homme », de manière représentative pour les membres de Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Peut-être
  rationale: Conserve la nuance d’éventualité et d’espoir sans transformer celle-ci en certitude.
- source_word: יִשְׁמְעוּ
  choice: entendra-t-elle parler de
  rationale: שׁמע signifie d’abord entendre, avec une possible implication d’écoute attentive. En français, « entendre parler de » convient naturellement lorsque l’objet est le malheur annoncé.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: Maintient l’expression hébraïque collective et son caractère historique et communautaire.
- source_word: אֵת כָּל הָרָעָה
  choice: tout le malheur
  rationale: Dans ce contexte de jugement annoncé, רָעָה désigne le malheur ou la calamité, non un mal moral commis par Dieu.
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: que je projette de faire venir sur elle
  rationale: חֹשֵׁב avec l’infinitif exprime ici un projet ou une intention. « Faire venir sur » est idiomatique avec « malheur »; le singulier « elle » reprend le collectif « maison de Juda ».
- source_word: לְמַעַן יָשׁוּבוּ
  choice: Alors, chacun pourra revenir
  rationale: Le contexte exprime le but recherché par l’annonce. « Revenir » conserve le mouvement de שׁוב et évite de remplacer directement l’image par le terme interprétatif « se repentir ».
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: chacun pourra revenir de sa mauvaise voie
  rationale: « Chacun » rend naturellement en français le singulier représentatif אִישׁ, tandis que « sa mauvaise voie » conserve l’image prophétique de la conduite individuelle.
- source_word: וְסָלַחְתִּי
  choice: et je pardonnerai
  rationale: Rend simplement la conséquence promise sans ajouter une condition plus explicite que celle du texte.
- source_word: לַעֲוֺנָם וּלְחַטָּאתָם
  choice: leur faute et leur péché
  rationale: Distingue les deux termes hébreux. « Faute » est un équivalent français actuel et digne pour עָוֹן, tandis que « péché » rend normalement חַטָּאת.
theological_decisions:
- issue: Sens de רָעָה dans l’annonce du jugement divin
  choice: malheur
  alternative: mal, calamité
  rationale: Le nom désigne ici le désastre annoncé contre Juda et non une perversité morale attribuée à Dieu. « Malheur » préserve à la fois la gravité et l’ambiguïté lexicale générale du mot.
- issue: Portée du masculin singulier אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: En français moderne, « chacun » exprime fidèlement la distribution individuelle au sein de la maison de Juda sans donner à tort l’impression que seuls les hommes sont visés.
- issue: Relation entre l’annonce, le retour et le pardon
  choice: Alors, chacun pourra revenir… et je pardonnerai
  alternative: afin que chacun revienne… et je pardonnerai
  rationale: La formulation conserve l’orientation de l’annonce vers le retour et le pardon, sans résoudre la tension entre dessein divin, possibilité humaine et réponse attendue.
translation_notes:
  register: Français international moderne, naturel et digne. La structure reste proche de l’hébreu tout en évitant les tournures artificielles. Les marqueurs [a] et [b] figurent dans le texte principal.
