  text: וַ/יַּגֵּ֤ד לָ/הֶם֙ מִכָ֔יְהוּ אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֣ר שָׁמֵ֑עַ בִּ/קְרֹ֥א בָר֛וּךְ בַּ/סֵּ֖פֶר בְּ/אָזְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/013.yaml
  text: And Micaiah told them all the words that he had heard when Baruch read the scroll in the hearing of the people[a].
translation:
  language: fr
  text: Micaïa leur rapporta toutes les paroles qu’il avait entendues quand Baruch lisait le rouleau devant le peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qu’il avait entendu pendant que Baruch lisait le rouleau aux oreilles du peuple » ; l’expression signifie qu’il le lisait publiquement, de manière à être entendu du peuple.'
    reason: Alternative de formulation pour l’expression temporelle et conservation de l’image idiomatique hébraïque « aux oreilles du peuple ».
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: rapporta
  rationale: Le hifil de נגד signifie ici faire connaître des informations. « Rapporta » convient au cadre narratif et exprime clairement que Michée transmet aux responsables ce qu’il a entendu.
- source_word: לָהֶם
  choice: leur
  rationale: Pronom complément indirect renvoyant, dans le contexte, aux responsables.
- source_word: מִכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et largement reconnue de ce nom biblique.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: toutes les paroles
  rationale: דְּבָרִים désigne ici le contenu lu. « Toutes les paroles » conserve le vocabulaire concret de l’hébreu et l’accent récurrent du livre sur les paroles écrites et proclamées.
- source_word: אֲשֶׁר שָׁמֵעַ
  choice: qu’il avait entendues
  rationale: Le plus-que-parfait indique naturellement que Michée a entendu ces paroles avant de les rapporter.
- source_word: בִּקְרֹא
  choice: lorsque … avait lu
  rationale: La préposition ב avec l’infinitif construit marque la circonstance temporelle. Le plus-que-parfait situe la lecture de Baruch avant le compte rendu de Michée, sans exclure la nuance possible d’une action en cours.
- source_word: בָרוּךְ
  choice: Baruch
  rationale: Translittération française usuelle du nom.
- source_word: בַּסֵּפֶר
  choice: le rouleau
  rationale: סֵפֶר peut désigner un livre, un document ou un rouleau. Dans Jérémie 36, le contexte indique précisément le rouleau écrit sous la dictée de Jérémie.
- source_word: בְּאָזְנֵי הָעָם
  choice: devant le peuple
  rationale: L’expression idiomatique signifie que la lecture a lieu publiquement, de manière à être entendue du peuple. « Devant le peuple » est naturel en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Rapporta » évite la faiblesse possible de « dit » tout en restant moins solennel que « déclara ». La note conserve à la fois la valeur durative possible de בִּקְרֹא et l’image hébraïque de בְּאָזְנֵי.
