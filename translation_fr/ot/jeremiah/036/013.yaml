- from: Michée leur rapporta toutes les paroles qu’il avait entendues lorsque Baruch avait lu le rouleau devant le peuple[a].
  to: Micaïa leur rapporta toutes les paroles qu’il avait entendues quand Baruch lisait le rouleau devant le peuple[a].
  rationale: La révision corrige la forme française du nom propre afin de distinguer מִכָיְהוּ de מִיכָה, et remplace le plus-que-parfait de la lecture par l’imparfait, qui rend mieux la simultanéité de l’audition et de la lecture. Le reste de la formulation est conservé, car il reflète fidèlement le texte hébreu et reste idiomatique.
