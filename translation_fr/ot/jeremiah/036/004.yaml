  text: וַ/יִּקְרָ֣א יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ בֶּן נֵֽרִיָּ֑ה וַ/יִּכְתֹּ֨ב בָּר֜וּךְ מִ/פִּ֣י יִרְמְיָ֗הוּ אֵ֣ת כָּל דִּבְרֵ֧י יְהוָ֛ה אֲשֶׁר דִּבֶּ֥ר אֵלָ֖י/ו עַל מְגִלַּת סֵֽפֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/004.yaml
  text: So Jeremiah called Baruch son of Neriah[a], and Baruch wrote on a scroll all the words of Yahweh from Jeremiah’s mouth[b], which he had spoken to him.
translation:
  language: fr
  text: Jérémie appela Baruch, fils de Nériya. Sous la dictée de Jérémie[a], Baruch écrivit sur un rouleau[b] toutes les paroles que Yahweh avait adressées à Jérémie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la bouche de Jérémie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur un rouleau de livre », c’est-à-dire un rouleau servant de document écrit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Dans ce contexte, קרא signifie appeler quelqu’un auprès de soi. « Appela » est naturel et n’ajoute pas la nuance plus forte de « convoqua ».
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: Baruch, fils de Nériya
  rationale: Les noms propres sont translittérés selon leur forme hébraïque, et la filiation est exprimée dans un français courant.
- source_word: וַיִּכְתֹּב
  choice: écrivit
  rationale: Rend directement le sens de כתב sans ajouter inutilement « mit par écrit ».
- source_word: מִפִּי יִרְמְיָהוּ
  choice: sous la dictée de Jérémie
  rationale: Littéralement « de la bouche de Jérémie » ; dans ce récit, l’expression indique que Baruch écrit ce que Jérémie lui dicte. La formulation idiomatique française est retenue, avec le tour littéral en note.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: toutes les paroles que Yahweh avait adressées
  rationale: « Toutes les paroles » conserve le caractère verbal et concret de דִּבְרֵי ; la proposition française rattache explicitement ces paroles à Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֲשֶׁר דִּבֶּר אֵלָיו
  choice: que Yahweh avait adressées à Jérémie
  rationale: Le relatif renvoie aux paroles de Yahweh, et אֵלָיו désigne Jérémie. La répétition des noms évite en français une succession de pronoms potentiellement trompeuse sans modifier les référents du texte.
- source_word: עַל מְגִלַּת סֵפֶר
  choice: sur un rouleau
  rationale: L’expression désigne un rouleau destiné à recevoir un document écrit. « Sur un rouleau » est clair en français moderne ; la forme plus littérale est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente directement au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La première coordination hébraïque est rendue par deux phrases pour alléger la syntaxe. « Sous la dictée » explicite l’idiome hébreu, tandis que la note en conserve l’image. La répétition de « Jérémie » à la fin évite une ambiguïté pronominale artificielle en français.
