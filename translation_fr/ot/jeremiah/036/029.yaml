source:
  edition: WLC
  text: וְ/עַל יְהוֹיָקִ֤ים מֶֽלֶךְ יְהוּדָה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה אַ֠תָּה שָׂרַ֜פְתָּ אֶת הַ/מְּגִלָּ֤ה הַ/זֹּאת֙ לֵ/אמֹ֔ר מַדּוּעַ֩ כָּתַ֨בְתָּ עָלֶ֜י/הָ לֵ/אמֹ֗ר בֹּֽא יָב֤וֹא מֶֽלֶךְ בָּבֶל֙ וְ/הִשְׁחִית֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/הִשְׁבִּ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/029.yaml
  text: 'And concerning Jehoiakim king of Judah[a], you shall say, ‘Thus says Yahweh: You have burned this scroll, saying, “Why have you written on it, saying, ‘The king of Babylon will surely come and destroy this land, and cut off from it man and beast’?”’'
translation:
  language: fr
  text: 'Quant à Joïakim, roi de Juda, tu diras : « Voici ce que dit Yahweh : Tu as brûlé ce rouleau en disant : “Pourquoi y as-tu écrit : ‘Le roi de Babylone viendra certainement détruire ce pays et en fera disparaître les humains et les animaux[a]’ ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’être humain et la bête ». Cette expression hébraïque traditionnelle évoque une dévastation totale.'
    reason: La note conserve la forme idiomatique du texte source et explique la portée collective de la traduction.
lexical_decisions:
- source_word: וְעַל
  choice: Quant à
  rationale: Avec le verbe de parole, la préposition introduit ici la personne visée par l’oracle. « Quant à » est naturel en français et ne surinterprète pas le rapport comme signifiant explicitement « contre ».
- source_word: תֹּאמַר
  choice: tu diras
  rationale: L’imparfait hébreu de deuxième personne a ici une valeur directive adressée à Jérémie ; le futur français conserve cette instruction.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle et digne rend la formule de messager prophétique, tandis que le nom propre Yahweh représente directement le tétragramme.
- source_word: שָׂרַפְתָּ
  choice: Tu as brûlé
  rationale: Le parfait désigne l’action accomplie de Joïakim ; le passé composé convient à l’accusation directe.
- source_word: הַמְּגִלָּה הַזֹּאת
  choice: ce rouleau
  rationale: מְגִלָּה désigne un document écrit enroulé ; « rouleau » est historiquement précis et courant dans le registre biblique.
- source_word: כָּתַבְתָּ עָלֶיהָ
  choice: y as-tu écrit
  rationale: Le pronom adverbial « y » rend naturellement en français l’idée d’écrire sur ou dans le rouleau sans lourdeur.
- source_word: בֹּא יָבֹא
  choice: viendra certainement
  rationale: L’infinitif absolu suivi de l’imparfait renforce la certitude de la venue ; « certainement » conserve cette emphase.
- source_word: וְהִשְׁחִית
  choice: détruire
  rationale: Le hiphil de שׁחת exprime ici la dévastation infligée au pays ; « détruire » en restitue la gravité.
- source_word: וְהִשְׁבִּית מִמֶּנָּה
  choice: en fera disparaître
  rationale: Le hiphil de שׁבת signifie faire cesser ou éliminer de ce lieu. « Faire disparaître » exprime l’élimination des habitants humains et animaux sans imposer un procédé particulier.
- source_word: אָדָם וּבְהֵמָה
  choice: les humains et les animaux
  rationale: Dans cette formule de dévastation totale, אָדָם a un sens collectif et בְּהֵמָה désigne les animaux domestiques ou le bétail par contraste ; la formulation choisie est claire en français moderne tout en conservant la portée globale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le traite comme le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de אָדָם וּבְהֵמָה dans la menace de dévastation
  choice: les humains et les animaux
  alternative: l’homme et le bétail
  rationale: Il s’agit d’une formule mérismatique décrivant une dévastation complète. Le pluriel collectif français communique ce sens sans limiter אָדָם aux hommes de sexe masculin ni בְּהֵמָה au seul bétail, tandis que la note signale la forme plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. Les niveaux de citation imbriqués sont maintenus par les guillemets français, anglais doubles puis simples. La cadence prophétique demeure perceptible sans archaïsmes.
