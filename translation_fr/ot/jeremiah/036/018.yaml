base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/018.yaml
  text: Then Baruch said to them[a], “He would recite all these words to me with his mouth, and I was writing them on the scroll with ink.”
translation:
  language: fr
  text: 'Alors Baruch leur dit[a] : « Il me dictait de vive voix toutes ces paroles, et moi, je les écrivais à l’encre sur le rouleau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Il me lisait toutes ces paroles, et moi, je les écrivais à l’encre sur le rouleau. » Le verbe hébreu signifie souvent « lire » ou « proclamer » ; dans ce contexte, il peut désigner la transmission orale de paroles destinées à être écrites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … répondit
  rationale: Le waw consécutif fait progresser le récit. Dans ce contexte d’interrogatoire, « répondit » rend naturellement la fonction de l’énoncé, tandis qu’« alors » en conserve la succession narrative.
- source_word: בָּרוּךְ
  choice: Baruch
  rationale: Translittération française usuelle du nom propre.
- source_word: מִפִּיו
  choice: de sa propre bouche
  rationale: Conserve l’image concrète de l’hébreu, littéralement « de sa bouche », et souligne que les paroles étaient prononcées personnellement par Jérémie.
- source_word: יִקְרָא אֵלַי
  choice: Il me dictait
  rationale: קרא signifie couramment « lire » ou « proclamer », mais la situation décrite est celle d’une transmission orale destinée à être mise par écrit. « Dictait » exprime clairement cette fonction en français.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דברים désigne ici les paroles prophétiques prononcées puis consignées par écrit.
- source_word: וַאֲנִי כֹּתֵב
  choice: et moi, je les écrivais
  rationale: La tournure met Baruch en relief et présente son écriture comme concomitante à la dictée. Le pronom objet « les » est naturel en français et reprend « toutes ces paroles ».
- source_word: עַל הַסֵּפֶר
  choice: sur le rouleau
  rationale: Dans Jérémie 36, סֵפֶר désigne le support écrit sous forme de rouleau plutôt qu’un livre relié moderne.
- source_word: בַּדְּיוֹ
  choice: à l’encre
  rationale: Rend naturellement en français le beth de moyen ou de matière.
