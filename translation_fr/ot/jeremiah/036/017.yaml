  text: וְ/אֶ֨ת בָּר֔וּךְ שָׁאֲל֖וּ לֵ/אמֹ֑ר הַגֶּד נָ֣א לָ֔/נוּ אֵ֗יךְ כָּתַ֛בְתָּ אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה מִ/פִּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/017.yaml
  text: And they asked Baruch[a], saying, “Please tell us, how did you write all these words from his mouth?”
translation:
  language: fr
  text: 'Ils interrogèrent Baruch : « Dis-nous, s’il te plaît, comment as-tu écrit toutes ces paroles sous sa dictée[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de sa bouche » ; l’expression désigne ici des paroles reçues oralement, sous la dictée de Jérémie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ
  choice: demandèrent
  rationale: Le verbe signifie ici « demander, interroger ». « Demandèrent à Baruch » est naturel en français dans ce contexte d’interrogation.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points rend naturellement en français la formule hébraïque introduisant le discours direct, sans le calque lourd « en disant ».
- source_word: הַגֶּד נָא לָנוּ
  choice: Dis-nous, s’il te plaît
  rationale: L’impératif de נגד appelle une explication, tandis que נָא apporte une nuance de requête polie.
- source_word: אֵיךְ כָּתַבְתָּ
  choice: comment as-tu écrit
  rationale: Rend directement la question portant sur la manière dont l’acte d’écrire a été accompli.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: Dans ce contexte de proclamation prophétique mise par écrit, « paroles » convient mieux que « choses » ou « affaires ».
- source_word: מִפִּיו
  choice: sous sa dictée
  rationale: Littéralement « de sa bouche » ; dans ce contexte scribal, l’expression indique que Baruch écrivait les paroles prononcées oralement par Jérémie.
- source_word: וְאֶת בָּרוּךְ
  choice: Ils demandèrent à Baruch
  rationale: Le marqueur d’objet place Baruch comme personne interrogée. L’ordre choisi est idiomatique en français ; la coordination narrative peut rester implicite à l’échelle du verset.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formule littérale « de sa bouche » étant peu naturelle et potentiellement obscure en français, le texte explicite l’idée de dictée tout en conservant la formulation hébraïque dans la note.
