  text: וַ/יִּשְׁלְח֨וּ כָל הַ/שָּׂרִ֜ים אֶל בָּר֗וּךְ אֶת יְהוּדִ֡י בֶּן נְ֠תַנְיָהוּ בֶּן שֶׁלֶמְיָ֣הוּ בֶן כּוּשִׁי֮ לֵ/אמֹר֒ הַ/מְּגִלָּ֗ה אֲשֶׁ֨ר קָרָ֤אתָ בָּ/הּ֙ בְּ/אָזְנֵ֣י הָ/עָ֔ם קָחֶ֥/נָּה בְ/יָדְ/ךָ֖ וָ/לֵ֑ךְ וַ֠/יִּקַּח בָּר֨וּךְ בֶּן נֵרִיָּ֤הוּ אֶת הַ/מְּגִלָּה֙ בְּ/יָד֔/וֹ וַ/יָּבֹ֖א אֲלֵי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/014.yaml
  text: Then all the officials sent Jehudi son of Nethaniah[a], son of Shelemiah, son of Cushi, to Baruch, saying, “Take in your hand the scroll from which you read in the hearing of the people, and come.” So Baruch son of Neriah took the scroll in his hand and came to them.
translation:
  language: fr
  text: 'Alors tous les hauts fonctionnaires envoyèrent Yehoudi, fils de Netania, fils de Shélémia, fils de Koushi, auprès de Baruch, avec ce message : « Prends avec toi le rouleau dont tu as fait la lecture devant le peuple, et viens[a]. » Baruch, fils de Néria, prit le rouleau dans sa main et vint auprès d’eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et va ». Dans ce contexte de convocation, le français dit naturellement « viens » lorsque quelqu’un est appelé à rejoindre ceux qui parlent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Dans ce cadre royal et administratif, שָׂר désigne des responsables de l’État plutôt que des princes au sens dynastique. « Hauts fonctionnaires » est précis et compréhensible en français moderne.
- source_word: אֶת יְהוּדִי ... אֶל בָּרוּךְ
  choice: envoyèrent auprès de Baruch Yehoudi
  rationale: La construction désigne Yehoudi comme l’émissaire et Baruch comme la personne auprès de laquelle il est envoyé. Cet ordre est naturel en français malgré la longue généalogie qui suit le nom.
- source_word: יְהוּדִי
  choice: Yehoudi
  rationale: La chaîne généalogique montre qu’il s’agit ici d’un nom propre, non de l’appellatif « Judéen ».
- source_word: הַמְּגִלָּה
  choice: le rouleau
  rationale: מְגִלָּה désigne un support écrit enroulé. « Rouleau » est le terme français courant et historiquement approprié.
- source_word: קָרָאתָ בָּהּ בְּאָזְנֵי הָעָם
  choice: dans lequel tu as lu à haute voix devant le peuple
  rationale: La formulation indique une lecture publique et audible faite à partir du rouleau. « À haute voix devant le peuple » rend naturellement l’idée littérale d’une lecture « aux oreilles du peuple ».
- source_word: קָחֶנָּה בְיָדְךָ
  choice: Prends en main le rouleau
  rationale: La tournure conserve l’image concrète de la main ainsi que le parallélisme avec l’action ultérieure de Baruch.
- source_word: וָלֵךְ
  choice: et viens
  rationale: Le verbe hébreu signifie littéralement « va », mais, dans une convocation vers le lieu où se trouvent les locuteurs, le français emploie naturellement « viens ». La valeur littérale est signalée en note.
- source_word: בְּיָדוֹ
  choice: en main
  rationale: Cette formulation reprend celle de l’ordre donné et souligne que Baruch s’y conforme exactement.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: et se rendit auprès d’eux
  rationale: Cette expression française indique clairement le déplacement de Baruch vers les hauts fonctionnaires sans imposer artificiellement le choix déictique entre « vint » et « alla ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. Les noms propres suivent une translittération française transparente. La répétition « en main » est maintenue pour faire ressortir l’accomplissement précis de l’ordre donné.
