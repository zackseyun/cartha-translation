revisions:
- from: 'Alors tous les hauts fonctionnaires envoyèrent auprès de Baruch Yehoudi, fils de Netania, fils de Shélémia, fils de Koushi, avec ce message : « Prends en main le rouleau dans lequel tu as lu à haute voix devant le peuple, et viens[a]. » Baruch, fils de Néria, prit donc le rouleau en main et se rendit auprès d’eux.'
  to: 'Alors tous les hauts fonctionnaires envoyèrent Yehoudi, fils de Netania, fils de Shélémia, fils de Koushi, auprès de Baruch, avec ce message : « Prends avec toi le rouleau dont tu as fait la lecture devant le peuple, et viens[a]. » Baruch, fils de Néria, prit le rouleau dans sa main et vint auprès d’eux.'
  rationale: La révision clarifie la syntaxe de l’envoi, améliore l’expression française de la lecture publique à partir du rouleau et rend l’impératif plus idiomatique, tout en maintenant le sens, les noms, le registre et la note relative au déplacement.
