source:
  edition: WLC
  text: וּ/בָאתָ֣ אַתָּ֡ה וְ/קָרָ֣אתָ בַ/מְּגִלָּ֣ה אֲשֶׁר כָּתַֽבְתָּ מִ/פִּ/י֩ אֶת דִּבְרֵ֨י יְהוָ֜ה בְּ/אָזְנֵ֥י הָ/עָ֛ם בֵּ֥ית יְהוָ֖ה בְּ/י֣וֹם צ֑וֹם וְ/גַ֨ם בְּ/אָזְנֵ֧י כָל יְהוּדָ֛ה הַ/בָּאִ֥ים מֵ/עָרֵי/הֶ֖ם תִּקְרָאֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/006.yaml
  text: So you yourself must go and read from the scroll that you wrote from my mouth—the words of Yahweh—in the hearing of the people in the house of Yahweh on a day of fasting[b][a]; and you must also read them in the hearing of all Judah who come from their cities.
translation:
  language: fr
  text: Tu iras donc toi-même lire à haute voix, dans le rouleau que tu as écrit sous ma dictée[b], les paroles de Yahweh devant le peuple, dans la maison de Yahweh[a], un jour de jeûne. Tu les liras aussi devant tous les gens de Juda venus de leurs villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de Yahweh » désigne ici le temple.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « que tu as écrit de ma bouche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ אַתָּה
  choice: Tu iras donc toi-même
  rationale: Le waw suivi du qatal poursuit ici l’instruction avec une valeur injonctive. Le pronom אַתָּה est emphatique; « toi-même » conserve cette insistance. Le déplacement vers le temple se rend naturellement par « iras » en français.
- source_word: וְקָרָאתָ בַמְּגִלָּה
  choice: lire à haute voix, dans le rouleau
  rationale: Avec un document écrit pour objet, קרא signifie « lire »; la situation publique indique une lecture orale, explicitée naturellement par « à haute voix ». La préposition ב désigne ici le document dans lequel le texte est lu.
- source_word: אֲשֶׁר כָּתַבְתָּ מִפִּי
  choice: que tu as écrit sous ma dictée
  rationale: L’expression signifie littéralement « que tu as écrit de ma bouche » et indique que Baruch a mis par écrit les paroles prononcées par Jérémie. « Sous ma dictée » exprime clairement cet idiome en français, tandis que la note en donne la forme littérale.
- source_word: אֶת דִּבְרֵי יְהוָה
  choice: les paroles de Yahweh
  rationale: « Paroles » convient au contenu divin prononcé puis consigné dans le rouleau. Le nom personnel יהוה est translittéré « Yahweh ».
- source_word: בְּאָזְנֵי הָעָם
  choice: devant le peuple
  rationale: Littéralement « aux oreilles du peuple », cet idiome désigne une lecture faite de manière à être entendue. « Devant le peuple », associé à « lire à haute voix », restitue naturellement le sens auditif.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction formelle « maison de Yahweh » conserve l’expression hébraïque; une note précise qu’elle désigne ici le temple.
- source_word: בְּיוֹם צוֹם
  choice: un jour de jeûne
  rationale: La formulation désigne l’occasion d’un jeûne sans identifier nécessairement une fête particulière ou un jour fixe.
- source_word: בְּאָזְנֵי כָל יְהוּדָה הַבָּאִים מֵעָרֵיהֶם
  choice: devant tous les gens de Juda venus de leurs villes
  rationale: « Tous les gens de Juda » rend le collectif « tout Juda » en évitant de faire du territoire lui-même l’auditeur. Le participe décrit ceux qui viennent de leurs différentes villes.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’enchaînement hébreu, tout en employant « sous ma dictée » et « devant » pour rendre naturellement deux idiomes. « Lire à haute voix » explicite la dimension orale imposée par la scène publique.
