  text: וַ/יְצַוֶּ֣ה הַ֠/מֶּלֶךְ אֶת יְרַחְמְאֵ֨ל בֶּן הַ/מֶּ֜לֶךְ וְ/אֶת שְׂרָיָ֣הוּ בֶן עַזְרִיאֵ֗ל וְ/אֶת שֶֽׁלֶמְיָ֨הוּ֙ בֶּֽן עַבְדְּאֵ֔ל לָ/קַ֨חַת֙ אֶת בָּר֣וּךְ הַ/סֹּפֵ֔ר וְ/אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יַּסְתִּרֵ֖/ם יְהוָֽה־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/026.yaml
  text: Then the king commanded Jerahmeel the king’s son[a], and Seraiah son of Azriel, and Shelemiah son of Abdeel, to seize Baruch the scribe and Jeremiah the prophet[b], but Yahweh hid them.
translation:
  language: fr
  text: Alors le roi ordonna à Yerahméel, fils du roi, à Seraya, fils d’Azriel, et à Shelemya, fils d’Abdéel, de s’emparer de Baruch, le scribe, et de Jérémie, le prophète. Mais Yahweh les cacha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: ordonna
  rationale: Le verbe צוה exprime ici un ordre royal faisant autorité; « ordonna » est naturel et conserve cette force.
- source_word: יְרַחְמְאֵל בֶּן הַמֶּלֶךְ
  choice: Yerahméel, fils du roi
  rationale: La traduction garde la relation explicitement exprimée par בן המלך sans la remplacer par le titre interprétatif « prince ».
- source_word: שְׂרָיָהוּ בֶן עַזְרִיאֵל
  choice: Seraya, fils d’Azriel
  rationale: Les noms sont translittérés sous des formes lisibles en français, et le patronyme est rendu directement.
- source_word: שֶׁלֶמְיָהוּ בֶּן עַבְדְּאֵל
  choice: Shelemya, fils d’Abdéel
  rationale: Les noms sont translittérés sous des formes lisibles en français, et le patronyme est conservé.
- source_word: לָקַחַת
  choice: de s’emparer de
  rationale: Dans ce contexte de poursuite ordonnée par le roi, לקח signifie appréhender avec hostilité. « S’emparer de » communique ce sens sans introduire le cadre juridique moderne suggéré par « arrêter ».
- source_word: בָּרוּךְ הַסֹּפֵר
  choice: Baruch, le scribe
  rationale: סֹפֵר peut désigner un scribe ou un secrétaire; « scribe » préserve ici le rôle littéraire explicitement associé à Baruch.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: Jérémie, le prophète
  rationale: « Prophète » est l’équivalent direct et courant de נביא et conserve le rôle attribué à Jérémie.
- source_word: וַיַּסְתִּרֵם
  choice: les cacha
  rationale: La forme causative de סתר avec le suffixe pluriel signifie que Yahweh les mit à l’abri des recherches; « les cacha » est direct et idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu et à la politique du projet.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie le tétragramme comme nom propre; « Yahweh » en préserve la fonction au lieu de lui substituer un titre.
- issue: Portée de לָקַחַת dans l’ordre royal
  choice: s’emparer de
  alternative: prendre; arrêter
  rationale: Le contexte indique une appréhension hostile. « S’emparer de » rend cette force tout en évitant de préciser indûment une procédure juridique formelle.
- issue: Identification de יְרַחְמְאֵל בֶּן הַמֶּלֶךְ
  choice: Yerahméel, fils du roi
  alternative: Yerahméel, le prince
  rationale: Même si l’expression pourrait fonctionner comme une désignation de statut, le texte formule explicitement une relation filiale; la traduction conserve cette formulation sans trancher davantage.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination répétée garde la solennité de l’ordre royal, tandis que deux phrases rendent clairement le contraste introduit par l’intervention divine. Aucun appel de note n’est nécessaire.
