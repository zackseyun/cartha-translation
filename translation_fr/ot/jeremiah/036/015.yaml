  text: And they said to him[a], “Please sit down and read it in our hearing.” So Baruch read it in their hearing.
translation:
  language: fr
  text: 'Ils lui dirent : « Assieds-toi, s’il te plaît, et lis-le pour que nous l’entendions[a]. » Baruch le lut pour qu’ils l’entendent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à nos oreilles », puis « à leurs oreilles ». Cette expression hébraïque signifie que le texte est lu de manière à être entendu par eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Ils lui dirent
  rationale: Le waw consécutif fait progresser le récit. Le passé simple convient au registre narratif français sans donner à la conjonction une valeur plus précise que le contexte ne l’exige.
- source_word: שֵׁב נָא
  choice: Assieds-toi, s’il te plaît
  rationale: L’impératif שֵׁב signifie ici « s’asseoir », et נָא donne à la demande une nuance de politesse ou d’insistance courtoise.
- source_word: וּקְרָאֶנָּה
  choice: et lis-le-nous
  rationale: Dans le contexte d’un document écrit, קרא signifie « lire ». Le suffixe féminin renvoie au rouleau ou au document mentionné auparavant; le pronom français prend le genre de « texte/rouleau » sous-entendu, tandis que « nous » explicite naturellement les destinataires indiqués par l’expression suivante.
- source_word: בְּאָזְנֵינוּ
  choice: à haute voix
  rationale: Littéralement « à nos oreilles », l’expression signifie que la lecture doit être audible pour les personnes présentes. « À haute voix » est naturel en français et convient à une lecture devant un auditoire.
- source_word: וַיִּקְרָא בָרוּךְ
  choice: Baruch le leur lut donc
  rationale: Le verbe rapporte que Baruch donne suite à leur demande. « Donc » exprime naturellement cette réponse dans le déroulement narratif.
- source_word: בְּאָזְנֵיהֶם
  choice: à haute voix
  rationale: La même expression idiomatique revient avec « leurs oreilles ». La traduction répétée par « à haute voix » conserve le parallèle tout en restant idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le dialogue reste poli, et le passé simple maintient un registre narratif biblique accessible. La répétition « à haute voix » reflète le parallélisme de l’hébreu sans reproduire littéralement son idiome.
