source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/קְר֣וֹא יְהוּדִ֗י שָׁלֹ֣שׁ דְּלָתוֹת֮ וְ/אַרְבָּעָה֒ יִֽקְרָעֶ֨/הָ֙ בְּ/תַ֣עַר הַ/סֹּפֵ֔ר וְ/הַשְׁלֵ֕ךְ אֶל הָ/אֵ֖שׁ אֲשֶׁ֣ר אֶל הָ/אָ֑ח עַד תֹּם֙ כָּל הַ/מְּגִלָּ֔ה עַל הָ/אֵ֖שׁ אֲשֶׁ֥ר עַל הָ/אָֽח׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/023.yaml
  text: And whenever Yehudi had read three or four columns[a], he would cut it off with the scribe’s knife and throw it into the fire that was in the brazier[b], until the entire scroll was consumed in the fire that was in the brazier.
translation:
  language: fr
  text: Chaque fois que Yehoudi avait lu trois ou quatre colonnes[a], il en coupait une partie avec le couteau du scribe et la jetait dans le feu qui était dans le brasero[b], jusqu’à ce que tout le rouleau soit entièrement consumé dans le feu qui était dans le brasero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « trois ou quatre portes » ; le terme désigne ici des divisions du rouleau, probablement ses colonnes ou ses panneaux.
    reason: lexical_alternative
  - marker: b
    text: Ou « foyer » ou « récipient à feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּקְרֹא
  choice: Chaque fois que … avait lu
  rationale: 'La construction temporelle, jointe à la suite du récit, décrit une action répétée : après chaque groupe de colonnes lu, un morceau était découpé et jeté au feu.'
- source_word: יְהוּדִי
  choice: Yehoudi
  rationale: Cette translittération française moderne reproduit directement la forme du nom hébreu et évite de traduire un nom propre.
- source_word: שָׁלֹשׁ דְּלָתוֹת וְאַרְבָּעָה
  choice: trois ou quatre colonnes
  rationale: Le terme signifie littéralement « portes » ou « battants », mais désigne ici les divisions successives du rouleau, vraisemblablement ses colonnes ou panneaux écrits.
- source_word: יִקְרָעֶהָ
  choice: il en découpait le morceau
  rationale: Le verbe signifie habituellement « déchirer », mais la mention du couteau indique ici une découpe. Le pronom sujet demeure « il », car l’hébreu ne nomme pas explicitement l’agent dans ce verset.
- source_word: בְּתַעַר הַסֹּפֵר
  choice: avec le couteau du scribe
  rationale: תַּעַר désigne une lame ou un rasoir ; « couteau » convient naturellement à l’instrument servant à découper un rouleau. « Scribe » conserve le cadre littéraire et administratif.
- source_word: וְהַשְׁלֵךְ
  choice: et le jetait
  rationale: L’imparfait français exprime naturellement la répétition de cette action dans le récit.
- source_word: הָאָח
  choice: brasero
  rationale: Le mot désigne un foyer ou récipient à feu intérieur ; « brasero » correspond bien au contexte hivernal immédiat.
- source_word: עַד תֹּם כָּל הַמְּגִלָּה
  choice: jusqu’à ce que tout le rouleau ait disparu
  rationale: La formule indique l’achèvement du processus. « Ait disparu » rend le résultat impliqué par la découpe et la combustion sans suggérer que le rouleau aurait été brûlé intact.
- source_word: הַמְּגִלָּה
  choice: rouleau
  rationale: « Rouleau » est l’équivalent français courant d’un document écrit enroulé.
- source_word: אֶל הָאֵשׁ אֲשֶׁר אֶל הָאָח / עַל הָאֵשׁ אֲשֶׁר עַל הָאָח
  choice: dans le feu du brasero
  rationale: Cette formulation française naturelle exprime le rapport entre le feu et son récipient sans reproduire lourdement la légère variation des prépositions hébraïques.
theological_decisions:
- issue: Identité de celui qui découpe et jette les morceaux
  choice: Conserver le pronom « il » sans expliciter son référent
  alternative: « le roi les découpait » ou « Yehoudi les découpait »
  rationale: Le contexte peut orienter l’interprétation, mais le texte hébreu du verset ne donne qu’un sujet verbal implicite. La traduction préserve donc cette ambiguïté grammaticale au lieu de la résoudre.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait rend la série d’actions répétées ; le sujet pronominal reste volontairement non explicité, conformément à l’hébreu.
