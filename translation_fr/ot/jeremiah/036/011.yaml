  text: וַ֠/יִּשְׁמַ֗ע מִכָ֨יְהוּ בֶן גְּמַרְיָ֧הוּ בֶן שָׁפָ֛ן אֶת כָּל דִּבְרֵ֥י יְהוָ֖ה מֵ/עַ֥ל הַ/סֵּֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/011.yaml
  text: And Micaiah son of Gemariah[a], son of Shaphan, heard all the words of Yahweh from the scroll.
translation:
  language: fr
  text: Michée, fils de Guemaria, fils de Shaphân, entendit toutes les paroles de Yahvé[a] consignées sur le rouleau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « l’ÉTERNEL ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel en français biblique.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit
  rationale: Le verbe שׁמע décrit ici la réception auditive de la lecture; le passé simple convient à la narration française.
- source_word: מִכָיְהוּ בֶן גְּמַרְיָהוּ בֶן שָׁפָן
  choice: Michée, fils de Guemaria, fils de Shaphân
  rationale: Les formes françaises usuelles des noms bibliques sont retenues, et la chaîne patronymique hébraïque est conservée.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: toutes les paroles de Yahvé
  rationale: « Toutes » préserve la portée exhaustive de כָּל, tandis que « paroles » rend directement דִּבְרֵי et « Yahvé » représente le nom divin.
- source_word: מֵעַל הַסֵּפֶר
  choice: lues dans le rouleau
  rationale: Dans ce contexte, les paroles sont entendues parce qu’elles sont lues à partir du document; « rouleau » correspond à la forme du support antique et l’ajout de « lues » explicite naturellement l’implication contextuelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme comme nom propre. « Yahvé » le représente dans le corps du texte, tandis qu’une note signale la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué; la syntaxe reste proche de l’hébreu tout en explicitant que les paroles ont été entendues lors de la lecture du rouleau.
