source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ אֶת יְהוּדִ֗י לָ/קַ֨חַת֙ אֶת הַ/מְּגִלָּ֔ה וַ/יִּ֨קָּחֶ֔/הָ מִ/לִּשְׁכַּ֖ת אֱלִישָׁמָ֣ע הַ/סֹּפֵ֑ר וַ/יִּקְרָאֶ֤/הָ יְהוּדִי֙ בְּ/אָזְנֵ֣י הַ/מֶּ֔לֶךְ וּ/בְ/אָזְנֵי֙ כָּל הַ/שָּׂרִ֔ים הָ/עֹמְדִ֖ים מֵ/עַ֥ל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/021.yaml
  text: Then the king sent Jehudi to get the scroll[a], and he took it from the chamber of Elishama the scribe[d][c][b]. And Jehudi read it in the hearing of the king and in the hearing of all the officials standing beside the king.
translation:
  language: fr
  text: Alors le roi envoya Yehoudi prendre le rouleau. Yehoudi le prit dans la salle d’Élishama, le secrétaire[a], puis il en fit la lecture devant le roi et tous les hauts fonctionnaires qui se tenaient auprès du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le scribe ». Dans ce contexte royal, le terme peut désigner un secrétaire chargé des écrits officiels.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui se tenaient au-dessus du roi »; il s’agit vraisemblablement des dignitaires présents auprès de lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol de שׁלח poursuit naturellement le récit; « envoya » est l’équivalent français courant.
- source_word: יְהוּדִי
  choice: Yehoudi
  rationale: Translittération française du nom propre hébreu, distinguée du nom commun « Juif ».
- source_word: לָקַחַת
  choice: chercher
  rationale: Après « envoyer », « chercher » exprime naturellement le but consistant à aller prendre et rapporter le rouleau.
- source_word: הַמְּגִלָּה
  choice: le rouleau
  rationale: מְגִלָּה désigne ici un support écrit enroulé; « rouleau » est clair et historiquement approprié.
- source_word: וַיִּקָּחֶהָ
  choice: le prit
  rationale: Le suffixe féminin renvoie au rouleau; « le prit » traduit directement l’action sans ajouter explicitement l’idée de retour.
- source_word: מִלִּשְׁכַּת
  choice: dans la pièce de
  rationale: לִשְׁכָּה désigne une salle ou pièce d’un complexe officiel. « Pièce » est naturel en français moderne sans préciser abusivement qu’il s’agit d’un bureau.
- source_word: אֱלִישָׁמָע
  choice: Élishama
  rationale: Translittération française du nom propre hébreu.
- source_word: הַסֹּפֵר
  choice: le secrétaire
  rationale: Dans ce contexte administratif royal, סֹפֵר peut désigner un secrétaire officiel; une note conserve l’autre traduction traditionnelle, « scribe ».
- source_word: וַיִּקְרָאֶהָ
  choice: il le lut
  rationale: Avec un écrit pour objet, קרא signifie « lire »; la présence d’auditeurs rend la lecture à voix haute implicite.
- source_word: בְּאָזְנֵי
  choice: aux oreilles de
  rationale: Cette formulation française intelligible conserve l’image concrète et la répétition de l’expression hébraïque, plutôt que de la réduire à « devant ».
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Dans la cour royale, שׂרים désigne des dignitaires ou responsables de haut rang, et non nécessairement des princes de sang royal.
- source_word: הָעֹמְדִים מֵעַל הַמֶּלֶךְ
  choice: qui se tenaient auprès du roi
  rationale: La tournure littérale « se tenant au-dessus du roi » décrit vraisemblablement leur position auprès de lui comme courtisans ou assistants; « auprès » évite de suggérer une supériorité hiérarchique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « du roi » et l’image « aux oreilles de » ont été maintenues pour refléter la structure et l’accent auditif de l’hébreu. Les noms propres suivent une translittération française lisible.
