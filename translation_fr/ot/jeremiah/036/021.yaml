revisions:
- from: Alors le roi envoya Yehoudi chercher le rouleau. Yehoudi le prit dans la pièce d’Élishama, le secrétaire[a], puis il le lut aux oreilles du roi et de tous les hauts fonctionnaires qui se tenaient auprès du roi[b].
  to: Alors le roi envoya Yehoudi prendre le rouleau. Yehoudi le prit dans la salle d’Élishama, le secrétaire[a], puis il en fit la lecture devant le roi et tous les hauts fonctionnaires qui se tenaient auprès du roi[b].
  rationale: La révision remplace « chercher » par « prendre », plus direct et plus fidèle à l’infinitif hébreu, et reformule le calque « aux oreilles de » par une expression française idiomatique qui maintient l’idée d’une lecture entendue par le roi et les responsables. Le reste du texte et les notes sont conservés, avec « salle » pour une pièce officielle plus fluide dans ce contexte.
