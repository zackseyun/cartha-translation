base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/028.yaml
  text: Take for yourself another scroll and write on it all the former words that were on the first scroll[a], which Jehoiakim king of Judah burned.
translation:
  language: fr
  text: Prends encore[a] un autre rouleau et écris-y toutes les paroles précédentes qui figuraient sur le premier rouleau, celui que Jojakim, roi de Juda, a brûlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prends de nouveau un autre rouleau ». Le terme hébreu initial signifie littéralement « retourne » et, avec « prends », indique ici que l’action doit être répétée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב קַח לְךָ
  choice: Prends de nouveau
  rationale: שׁוּב suivi de l’impératif קַח exprime idiomatiquement la répétition de l’action. « Prends de nouveau » garde cette valeur sans rendre littéralement « retourne ». Le pronom לְךָ, fréquent dans ce type d’injonction, n’exige pas ici le lourd « prends pour toi-même » en français.
- source_word: מְגִלָּה אַחֶרֶת
  choice: un autre rouleau
  rationale: מְגִלָּה désigne un rouleau destiné à l’écriture; « rouleau » est l’équivalent français courant et historiquement approprié. אַחֶרֶת signifie « autre ».
- source_word: וּכְתֹב עָלֶיהָ
  choice: et écris-y
  rationale: Le pronom adverbial « y » rend naturellement עָלֶיהָ, littéralement « dessus/sur lui », avec le rouleau comme antécédent.
- source_word: אֵת כָּל הַדְּבָרִים הָרִאשֹׁנִים
  choice: toutes les paroles précédentes
  rationale: דְּבָרִים désigne ici les paroles constituant le contenu prophétique du rouleau. הָרִאשֹׁנִים peut signifier « premières » ou « précédentes »; ce dernier terme exprime clairement leur antériorité.
- source_word: אֲשֶׁר הָיוּ עַל הַמְּגִלָּה הָרִאשֹׁנָה
  choice: qui figuraient sur le premier rouleau
  rationale: « Figuraient sur » restitue naturellement en français l’idée des paroles qui se trouvaient écrites sur le rouleau. הָרִאשֹׁנָה est rendu par « premier » dans le contraste avec le nouveau rouleau.
- source_word: אֲשֶׁר שָׂרַף יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: celui que Jojakim, roi de Juda, a brûlé
  rationale: La reprise par « celui » rattache sans ambiguïté la relative au premier rouleau. שָׂרַף est rendu simplement par « a brûlé », sans intensification ajoutée. « Jojakim » est la forme française biblique usuelle du nom.
