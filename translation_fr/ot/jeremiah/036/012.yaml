  text: וַ/יֵּ֤רֶד בֵּית הַ/מֶּ֨לֶךְ֙ עַל לִשְׁכַּ֣ת הַ/סֹּפֵ֔ר וְ/הִ֨נֵּה שָׁ֔ם כָּל הַ/שָּׂרִ֖ים יֽוֹשְׁבִ֑ים אֱלִישָׁמָ֣ע הַ/סֹּפֵ֡ר וּ/דְלָיָ֣הוּ בֶן שְׁ֠מַעְיָהוּ וְ/אֶלְנָתָ֨ן בֶּן עַכְבּ֜וֹר וּ/גְמַרְיָ֧הוּ בֶן שָׁפָ֛ן וְ/צִדְקִיָּ֥הוּ בֶן חֲנַנְיָ֖הוּ וְ/כָל הַ/שָּׂרִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/012.yaml
  text: 'he went down to the king''s house, to the scribe''s chamber, and behold, all the officials were sitting there: Elishama the scribe, Delaiah son of Shemaiah, Elnathan son of Achbor, Gemariah son of Shaphan, Zedekiah son of Hananiah, and all the officials.'
translation:
  language: fr
  text: 'Il descendit au palais royal, dans la salle du secrétaire. Et voici, tous les hauts fonctionnaires y siégeaient : le secrétaire Élishama, Delaya fils de Shemaya, Elnatan fils d’Akbor, Guemaria fils de Shafân, Sédécias fils de Hanania, et tous les hauts fonctionnaires.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: palais royal
  rationale: Littéralement « maison du roi » ; dans ce contexte administratif, « palais royal » est l’expression française naturelle.
- source_word: לִשְׁכַּת הַסֹּפֵר
  choice: dans la salle du secrétaire
  rationale: לִשְׁכָּה désigne une pièce ou salle du complexe palatial ; הַסֹּפֵר désigne ici un secrétaire officiel.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Dans ce cadre de cour royale, שָׂרִים désigne des dignitaires ou responsables de haut rang plutôt que des « princes » au sens dynastique.
- source_word: יֹשְׁבִים
  choice: y siégeaient
  rationale: Le verbe signifie littéralement « étaient assis » ; « siégeaient » rend naturellement leur réunion officielle sans surinterpréter sa nature.
- source_word: וְהִנֵּה
  choice: Tous… y siégeaient
  rationale: Le présentatif hébreu attire l’attention sur la scène découverte. En français narratif moderne, l’effet est porté par une phrase autonome plutôt que par l’archaïsant « voici ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes françaises lisibles et proches de l’hébreu. « Tous les autres » à la fin évite l’impression que les personnes déjà nommées s’ajoutent à un groupe entièrement distinct.
