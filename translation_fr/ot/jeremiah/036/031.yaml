base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/031.yaml
  text: And I will punish him and his offspring and his servants for their iniquity[a], and I will bring on them, on the inhabitants of Jerusalem, and on the men of Judah all the disaster that I spoke against them, but they did not listen.
translation:
  language: fr
  text: Je le punirai, lui, ses descendants et ses serviteurs, pour leur faute. Je ferai venir sur eux, sur les habitants de Jérusalem et sur chaque homme de Juda[a], tout le malheur que je leur ai annoncé, mais ils n’ont pas écouté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « chaque homme de Juda ». Le singulier est distributif et de forme masculine ; on peut aussi le comprendre collectivement : « tous les hommes de Juda » ou « le peuple de Juda ».'
    reason: Préserver la forme distributive masculine de l’hébreu tout en signalant sa portée collective possible.
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלָיו
  choice: Je lui demanderai compte
  rationale: Dans ce contexte de jugement, פקד על exprime une intervention punitive. « Demander compte » restitue l’idée de mise en cause judiciaire sans employer le neutre « visiter ».
- source_word: זַרְעוֹ
  choice: ses descendants
  rationale: זֶרַע désigne ici la postérité, non une semence au sens propre. « Descendants » est clair et naturel en français moderne.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans le cadre de la cour royale, עֶבֶד désigne naturellement les serviteurs ou agents du roi; le contexte ne requiert pas « esclaves ».
- source_word: אֶת עֲוֺנָם
  choice: de leur faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou sa conséquence. Ici, il s’agit de la faute dont ils doivent répondre; « faute » conserve le poids moral tout en s’intégrant naturellement à « demander compte ».
- source_word: וְהֵבֵאתִי עֲלֵיהֶם
  choice: Je ferai venir sur eux
  rationale: הביא על est un idiome courant pour faire venir un jugement ou un malheur sur quelqu’un.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Le participe désigne ceux qui habitent Jérusalem; cette formulation est concise et usuelle.
- source_word: וְאֶל אִישׁ יְהוּדָה
  choice: et sur chaque homme de Juda
  rationale: אִישׁ est un singulier distributif et grammaticalement masculin. « Chaque homme de Juda » en préserve la forme et la force, tandis que « sur » suit le parallélisme avec עַל.
- source_word: כָּל הָרָעָה
  choice: tout le malheur
  rationale: Dans cet oracle de jugement, רָעָה désigne une calamité annoncée plutôt que le mal moral. « Malheur » est naturel dans le registre prophétique français.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיהֶם
  choice: que j’avais annoncé contre eux
  rationale: Le contenu est une menace de jugement. « Annoncé contre eux » rend la portée hostile de l’oracle, et le plus-que-parfait situe naturellement l’annonce avant son exécution.
- source_word: וְלֹא שָׁמֵעוּ
  choice: mais ils n’ont pas écouté
  rationale: שׁמע évoque ici le refus de prêter attention et, implicitement, d’obéir. « Écouté » conserve cette amplitude sans expliciter excessivement « obéi ».
theological_decisions:
- issue: Portée de אִישׁ יְהוּדָה
  choice: chaque homme de Juda
  alternative: tous les habitants de Juda / le peuple de Juda
  rationale: Le texte hébreu emploie un singulier distributif masculin. Le choix principal en conserve la précision formelle; une note signale qu’il peut être rendu collectivement dans un français plus généralisant.
- issue: Rapport entre la faute et le châtiment dans עָוֹן
  choice: leur faute comme motif de la reddition de comptes
  alternative: leur châtiment / la conséquence de leur faute
  rationale: Dans cette construction, le sens de culpabilité ou de faute explique le jugement. La traduction évite de confondre explicitement le péché avec sa sanction, tout en reconnaissant la polysémie du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement réorganisée en deux phrases pour éviter une coordination trop lourde. « Demander compte » maintient la tonalité judiciaire; « malheur » convient au registre prophétique sans suggérer le mal moral.
