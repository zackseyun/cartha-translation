revisions:
- from: Je lui demanderai compte de sa faute, ainsi qu’à ses descendants et à ses serviteurs. Je ferai venir sur eux, sur les habitants de Jérusalem et sur chaque homme de Juda[a], tout le malheur que j’avais annoncé contre eux, mais ils n’ont pas écouté.
  to: Je le punirai, lui, ses descendants et ses serviteurs, pour leur faute. Je ferai venir sur eux, sur les habitants de Jérusalem et sur chaque homme de Juda[a], tout le malheur que je leur ai annoncé, mais ils n’ont pas écouté.
  rationale: La révision rend explicitement le pluriel « leur faute » et remplace une construction française ambiguë par une formulation judiciaire simple. Elle conserve la distinction des groupes visés, le singulier distributif d’« homme de Juda » avec sa note, et le registre prophétique. « Je leur ai annoncé » est plus proche de la préposition hébraïque tout en laissant le contexte exprimer la menace.
