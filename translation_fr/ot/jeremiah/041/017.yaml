  yaml_path: translation/ot/jeremiah/041/017.yaml
  text: So they went and stayed at Geruth Chimham[a], which is beside Bethlehem[b], intending to go on into Egypt.
translation:
  language: fr
  text: Ils partirent donc et s’arrêtèrent à Guérouth-Kimham[a][b], près de Bethléem, avec l’intention de se rendre en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au lieu d’hébergement de Kimham ». Le mot hébreu rendu par « Guérouth » est probablement employé ici comme nom de lieu, mais il peut aussi désigner un lieu de séjour ou d’hébergement associé à Kimham.'
    reason: lexical_alternative
  - marker: b
    text: La forme écrite du nom dans le texte hébreu fourni est irrégulière. Le contexte et les témoins anciens appuient la lecture « Kimham », nom connu en 2 Samuel 19.38-41 et associé à un lieu proche de Bethléem.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Ils partirent donc
  rationale: Le wayyiqtol fait progresser le récit. « Partirent donc » exprime naturellement le déplacement et son lien avec les événements précédents.
- source_word: וַיֵּשְׁבוּ
  choice: et s’arrêtèrent
  rationale: Dans ce contexte de voyage, ישׁב désigne un séjour ou une halte plutôt que le simple fait de s’asseoir ou une installation durable.
- source_word: בְּגֵרוּת
  choice: à Guérouth
  rationale: Le terme fonctionne vraisemblablement comme un nom de lieu associé à Kimham, tout en gardant en note son sens lexical possible de lieu de séjour ou d’hébergement.
- source_word: כמו/הם
  choice: Kimham
  rationale: La forme écrite transmise ici est irrégulière. Le contexte, les témoins anciens et le rapprochement avec 2 Samuel 19 appuient la lecture du nom propre Kimham.
- source_word: אֲשֶׁר אֵצֶל בֵּית לָחֶם
  choice: près de Bethléem
  rationale: אֵצֶל indique la proximité. Cette formulation est claire et idiomatique en français moderne.
- source_word: לָלֶכֶת לָבוֹא מִצְרָיִם
  choice: avec l’intention de poursuivre leur route jusqu’en Égypte
  rationale: Les infinitifs introduits par ל expriment ici le but du déplacement. La formulation française conserve l’idée d’une route à poursuivre et d’une entrée projetée en Égypte sans reproduire une construction hébraïque lourde.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « S’arrêtèrent » évoque une halte temporaire; « avec l’intention de » rend explicitement la valeur finale des infinitifs, tandis que « jusqu’en Égypte » indique que l’entrée dans le pays était le but envisagé.
