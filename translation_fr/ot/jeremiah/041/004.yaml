  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שֵּׁנִ֖י לְ/הָמִ֣ית אֶת גְּדַלְיָ֑הוּ וְ/אִ֖ישׁ לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/004.yaml
  text: And it happened on the second day after he had killed Gedaliah[a], when no man yet knew it,
translation:
  language: fr
  text: Le deuxième jour après qu’il eut tué Guedalia, alors que personne ne le savait encore,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[rendu implicitement par la tournure temporelle]'
  rationale: Dans ce fragment de phrase, la formule narrative introduit la circonstance temporelle. Une traduction autonome comme « Il arriva que » serait plus formelle, mais alourdirait le français et s’enchaînerait moins naturellement avec la suite du récit.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour
  rationale: Reproduit la numérotation explicite du jour en hébreu sans la réduire à « le lendemain ».
- source_word: לְהָמִית אֶת גְּדַלְיָהוּ
  choice: après qu’il eut tué Guedalia
  rationale: L’infinitif construit avec לְ fixe ici le meurtre comme repère temporel. Le sujet masculin implicite renvoie naturellement à Ismaël dans le contexte précédent; le passé antérieur marque clairement l’antériorité.
- source_word: גְּדַלְיָהוּ
  choice: Guedalia
  rationale: Translittération française courante et lisible du nom hébreu.
- source_word: וְאִישׁ לֹא יָדָע
  choice: alors que personne ne le savait encore
  rationale: « Personne » rend naturellement l’indéfini אִישׁ sous négation. Le pronom « le » explicite en français l’objet sous-entendu de יָדַע, à savoir le meurtre de Guedalia, et « encore » exprime la situation persistante dans ce cadre temporel.
