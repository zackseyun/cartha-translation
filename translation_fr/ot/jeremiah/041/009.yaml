source:
  edition: WLC
  text: וְ/הַ/בּ֗וֹר אֲשֶׁר֩ הִשְׁלִ֨יךְ שָׁ֤ם יִשְׁמָעֵאל֙ אֵ֣ת כָּל פִּגְרֵ֣י הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר הִכָּה֙ בְּ/יַד גְּדַלְיָ֔הוּ ה֗וּא אֲשֶׁ֤ר עָשָׂה֙ הַ/מֶּ֣לֶךְ אָסָ֔א מִ/פְּנֵ֖י בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֑ל אֹת֗/וֹ מִלֵּ֛א יִשְׁמָעֵ֥אל בֶּן נְתַנְיָ֖הוּ חֲלָלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/009.yaml
  text: The cistern into which Ishmael had thrown all the corpses of the men whom he had struck down because of Gedaliah was the one that King Asa had made because of Baasha king of Israel[b][a]. Ishmael son of Nethaniah filled it with the slain.
translation:
  language: fr
  text: La citerne dans laquelle Ismaël avait jeté tous les cadavres des hommes qu’il avait tués en lien avec Guedalia[a] était celle que le roi Asa avait fait construire à cause de Baésha, roi d’Israël[b]. Ismaël, fils de Nethania, la remplit de ceux qu’il avait tués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il avait tués à cause de Guedalia », « avec Guedalia » ou « aux côtés de Guedalia ». L’expression hébraïque, littéralement « par la main de Guedalia », est difficile et son sens dépend du contexte.
    reason: alternative_reading
  - marker: b
    text: Ou « par crainte de Baésha, roi d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹר
  choice: la citerne
  rationale: בּוֹר peut désigner une fosse ou une citerne. Puisqu’il s’agit ici d’un ouvrage aménagé sous le roi Asa, « citerne » exprime naturellement l’idée d’un réservoir creusé par l’être humain.
- source_word: הִשְׁלִיךְ שָׁם
  choice: avait jeté ... dans laquelle
  rationale: Le verbe signifie « jeter ». La construction française avec « dans laquelle » rend naturellement la destination exprimée par שָׁם dans le cadre de la proposition relative.
- source_word: פִּגְרֵי
  choice: les cadavres
  rationale: פֶּגֶר désigne des corps morts; « cadavres » en conserve la force macabre sans l’atténuer.
- source_word: הָאֲנָשִׁים
  choice: des hommes
  rationale: Le nom hébreu est ici masculin pluriel et désigne les hommes tués.
- source_word: הִכָּה
  choice: avait tués
  rationale: Dans ce contexte létal, נכה signifie abattre ou tuer. « Tuer » est direct, clair et actuel en français.
- source_word: בְּיַד גְּדַלְיָהוּ
  choice: à cause de Guedalia
  rationale: Littéralement « par/près de la main de Guedalia », la formule est difficile dans ce contexte. « À cause de Guedalia » conserve une relation générale avec Guedalia sans faire de lui l’auteur des meurtres; les autres interprétations plausibles sont signalées en note.
- source_word: הוּא אֲשֶׁר עָשָׂה
  choice: était celle que ... avait fait aménager
  rationale: La tournure résomptive identifie la citerne mentionnée à l’ouvrage du roi Asa. « Faire aménager » convient à la réalisation d’une citerne sans imposer qu’Asa l’ait construite personnellement.
- source_word: מִפְּנֵי בַּעְשָׁא
  choice: à cause de Baésha
  rationale: מִפְּנֵי peut exprimer la cause, la menace ou la crainte. « À cause de » demeure assez large pour ne pas préciser indûment le motif.
- source_word: מִלֵּא
  choice: la remplit
  rationale: Le piel de מלא signifie simplement « remplir ».
- source_word: חֲלָלִים
  choice: de victimes
  rationale: חֲלָלִים désigne des personnes tuées, notamment par violence. « Victimes » est naturel après « remplit », tout en renvoyant clairement aux morts; la violence est déjà explicite dans le contexte.
theological_decisions:
- issue: Sens de בְּיַד גְּדַלְיָהוּ
  choice: à cause de Guedalia
  alternative: avec Guedalia / aux côtés de Guedalia
  rationale: La syntaxe hébraïque est inhabituelle et permet plusieurs compréhensions contextuelles. Le texte principal garde une relation causale large, tandis que la note préserve les lectures associatives sans trancher abusivement.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit la structure identificatrice de l’hébreu tout en restant naturelle. Les ambiguïtés de בְּיַד et de מִפְּנֵי sont conservées dans les notes plutôt que résolues silencieusement.
