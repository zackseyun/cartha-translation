revisions:
- from: La citerne dans laquelle Ismaël avait jeté tous les cadavres des hommes qu’il avait tués à cause de Guedalia[a] était celle que le roi Asa avait fait aménager à cause de Baésha, roi d’Israël[b]. Ismaël, fils de Netania, la remplit de victimes.
  to: La citerne dans laquelle Ismaël avait jeté tous les cadavres des hommes qu’il avait tués en lien avec Guedalia[a] était celle que le roi Asa avait fait construire à cause de Baésha, roi d’Israël[b]. Ismaël, fils de Nethania, la remplit de ceux qu’il avait tués.
  rationale: La révision renforce la fidélité de la dernière expression (« ceux qu’il avait tués »), préserve mieux l’ambiguïté textuelle relative à Guedalia dans le texte et la note, et harmonise la graphie française de Nethania. Les deux ancres de note restent attachées aux expressions qu’elles éclairent.
