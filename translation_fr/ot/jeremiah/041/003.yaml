base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/003.yaml
  text: And Ishmael struck down all the Judeans who were with Gedaliah at Mizpah[c][b][a], and the Chaldeans who were found there—the men of war.
translation:
  language: fr
  text: Ismaël frappa tous les Judéens[a] qui étaient avec Guedalia à Mitspa, ainsi que les Chaldéens[b] qui se trouvaient là, les hommes de guerre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Juifs ». Le terme hébreu peut désigner les habitants ou le peuple de Juda.
    reason: lexical_alternative
  - marker: b
    text: Ou « les Babyloniens ». Le texte hébreu porte « les Chaldéens ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « les hommes de guerre », c’est-à-dire les combattants ou les soldats.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְּהוּדִים
  choice: les Judéens
  rationale: Dans ce cadre historique, le terme désigne les gens de Juda; « Judéens » met en valeur cette nuance géographique et politique sans exclure la traduction traditionnelle « Juifs ».
- source_word: אִתּוֹ אֶת גְּדַלְיָהוּ
  choice: qui étaient avec Guedalia
  rationale: Le pronom de אִתּוֹ est explicité par le nom Guedalia; le français naturel évite de reproduire la redondance « avec lui, avec Guedalia ».
- source_word: בַּמִּצְפָּה
  choice: à Mitspa
  rationale: « À » est la préposition française habituelle devant le nom d’une localité.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Cette traduction conserve la désignation historique précise du texte hébreu, même si elle vise ici des Babyloniens.
- source_word: נִמְצְאוּ שָׁם
  choice: qui se trouvaient là
  rationale: Cette tournure française naturelle rend le niphal de מצא dans son sens contextuel de personnes présentes sur place.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les hommes de guerre
  rationale: La traduction conserve l’expression hébraïque et sa portée militaire; une note précise le sens idiomatique.
- source_word: הִכָּה
  choice: frappa
  rationale: Le verbe נכה exprime le fait d’abattre ou de frapper mortellement. « Frappa » préserve la formulation concrète et la portée létale donnée par le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms propres suivent des formes françaises usuelles. La syntaxe garde l’apposition finale de l’hébreu et laisse subsister son rattachement potentiellement ouvert, tout en la reliant naturellement aux Chaldéens les plus proches.
