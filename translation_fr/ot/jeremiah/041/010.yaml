source:
  edition: WLC
  text: וַ/יִּ֣שְׁבְּ יִ֠שְׁמָעֵאל אֶת כָּל שְׁאֵרִ֨ית הָ/עָ֜ם אֲשֶׁ֣ר בַּ/מִּצְפָּ֗ה אֶת בְּנ֤וֹת הַ/מֶּ֨לֶךְ֙ וְ/אֶת כָּל הָ/עָם֙ הַ/נִּשְׁאָרִ֣ים בַּ/מִּצְפָּ֔ה אֲשֶׁ֣ר הִפְקִ֗יד נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֑ם וַ/יִּשְׁבֵּ/ם֙ יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וַ/יֵּ֕לֶךְ לַ/עֲבֹ֖ר אֶל בְּנֵ֥י עַמּֽוֹן׀־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/010.yaml
  text: Then Ishmael took captive all the remnant of the people who were in Mizpah—the king’s daughters and all the people who were left in Mizpah[a], whom Nebuzaradan the captain of the guard had entrusted to Gedaliah son of Ahikam[b]. Ishmael son of Nethaniah took them captive and went to cross over to the Ammonites.
translation:
  language: fr
  text: 'Ismaël emmena alors en captivité[a] tout le reste du peuple qui se trouvait à Mitspa : les filles du roi et tous ceux qui étaient restés à Mitspa, que Nebouzaradan, chef de la garde, avait confiés à Guedalia, fils d’Ahiqam. Ismaël, fils de Netania, les emmena en captivité et partit pour passer vers les Ammonites[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fit prisonniers ». Le verbe hébreu souligne la capture et l’enlèvement forcé.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils d’Ammon », c’est-à-dire les Ammonites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּ / וַיִּשְׁבֵּם
  choice: emmena en captivité / les emmena en captivité
  rationale: Le verbe שׁבה désigne la capture et l’emmenement forcé de personnes. Cette formulation française exprime clairement la contrainte et conserve la répétition emphatique de l’hébreu.
- source_word: שְׁאֵרִית הָעָם
  choice: tout le reste du peuple
  rationale: שְׁאֵרִית désigne ici la partie survivante ou demeurée sur place. « Tout le reste du peuple » est naturel en français tout en gardant l’idée d’un reste.
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: les filles du roi
  rationale: Traduction directe de l’expression hébraïque, préférable à « princesses », qui expliciterait davantage le statut.
- source_word: הִפְקִיד ... אֶת גְּדַלְיָהוּ
  choice: avait confiés à Guedalia
  rationale: Dans ce contexte, Nebouzaradan avait placé les personnes restées à Mitspa sous la responsabilité de Guedalia. La formulation respecte cette relation sans alourdir la phrase.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Ce titre officiel désigne le haut responsable de la garde royale; la traduction idiomatique évite le littéralisme trompeur lié au sens premier de טבח.
- source_word: לַעֲבֹר אֶל
  choice: pour passer chez
  rationale: עבר avec אל exprime un déplacement vers une destination, avec une possible idée de traversée. « Passer chez » conserve cette nuance sans préciser une frontière ou un cours d’eau non mentionné.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: C’est l’équivalent ethnonymique naturel en français de l’expression littérale « fils d’Ammon ».
