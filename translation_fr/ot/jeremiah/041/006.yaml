base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/006.yaml
  text: Then Ishmael son of Nethaniah went out from Mizpah to meet them[a], going and weeping. When he met them, he said to them, “Come to Gedaliah son of Ahikam.”
translation:
  language: fr
  text: 'Alors Ismaël, fils de Netania, sortit de Mitspa à leur rencontre, avançant tout en pleurant[a]. Lorsqu’il les rencontra, il leur dit : « Venez auprès de Guedalia, fils d’Ahikam. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « allant, allant et pleurant », tournure qui exprime une action continue pendant qu’il s’approchait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Alors … sortit
  rationale: Le waw consécutif fait progresser le récit; « Alors » exprime naturellement la succession narrative.
- source_word: לִקְרָאתָם
  choice: à leur rencontre
  rationale: Cette tournure exprime le mouvement vers des personnes dans le but de les rencontrer.
- source_word: מִן הַמִּצְפָּה
  choice: de Mitspa
  rationale: La préposition מן marque ici le point de départ; « de Mitspa » est idiomatique et précis.
- source_word: הֹלֵךְ הָלֹךְ וּבֹכֶה
  choice: avançant tout en pleurant
  rationale: La combinaison du participe et de l’infinitif absolu présente une action continue; cette formulation française restitue le mouvement et les pleurs simultanés sans calque pesant.
- source_word: וַיְהִי כִּפְגֹשׁ אֹתָם
  choice: Lorsqu’il les rencontra
  rationale: La construction hébraïque introduit une circonstance temporelle; cette formulation moderne évite le littéral « il arriva que ».
- source_word: בֹּאוּ אֶל
  choice: Venez auprès de
  rationale: L’impératif suivi de אֶל invite les hommes à se rendre vers Guedalia; « auprès de » conserve cette orientation sans suggérer nécessairement l’entrée dans un lieu.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם
  choice: Guedalia, fils d’Ahikam
  rationale: Les noms sont translittérés selon leur forme française usuelle, et le patronyme hébreu est rendu directement par « fils de ».
