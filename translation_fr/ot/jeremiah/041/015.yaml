id: JER.41.15
reference: Jeremiah 41:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֗ה נִמְלַט֙ בִּ/שְׁמֹנָ֣ה אֲנָשִׁ֔ים מִ/פְּנֵ֖י יֽוֹחָנָ֑ן וַ/יֵּ֖לֶךְ אֶל בְּנֵ֥י עַמּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/015.yaml
  text: But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites[a][b][c].
translation:
  language: fr
  text: Mais Ismaël, fils de Netania, échappa à Yohanan avec huit hommes et se rendit chez les Ammonites[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu commence par « et Ismaël »; « mais » fait ressortir le contraste avec ce qui précède.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « échappa de devant Yohanan », tournure qui évoque sa présence ou sa poursuite.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « vers les fils d’Ammon », c’est-à-dire les Ammonites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: Mais Ismaël
  rationale: 'La conjonction ו signifie normalement « et », mais « mais » exprime ici naturellement le contraste narratif : malgré l’intervention de Yohanan, Ismaël réussit à s’échapper.'
- source_word: בֶּן נְתַנְיָה
  choice: fils de Netania
  rationale: Cette construction patronymique hébraïque se rend directement et naturellement ainsi en français.
- source_word: נִמְלַט
  choice: échappa
  rationale: Le nifal de מלט désigne ici une fuite réussie; « échappa » convient au récit et à la construction avec מִפְּנֵי.
- source_word: בִּ/שְׁמֹנָה אֲנָשִׁים
  choice: avec huit hommes
  rationale: 'La préposition ב est comprise dans son sens associatif : huit hommes accompagnaient Ismaël dans sa fuite.'
- source_word: מִ/פְּנֵי יֽוֹחָנָן
  choice: à Yohanan
  rationale: L’expression signifie littéralement « de devant Yohanan ». Avec le verbe « échapper », le français idiomatique emploie « échapper à quelqu’un ».
- source_word: וַ/יֵּלֶךְ
  choice: et se rendit
  rationale: Le wayyiqtol marque la progression du récit. « Se rendit » exprime naturellement un déplacement vers un peuple ou son territoire.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: chez les Ammonites
  rationale: Littéralement « vers les fils d’Ammon », expression ethnographique désignant les Ammonites; « chez » indique naturellement qu’Ismaël gagna leur territoire ou leur milieu.
