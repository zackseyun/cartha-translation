base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/018.yaml
  text: because of the Chaldeans[a], for they were afraid of them, because Ishmael son of Nethaniah had struck down Gedaliah son of Ahikam[c][b], whom the king of Babylon had appointed over the land.
translation:
  language: fr
  text: à cause des Chaldéens[a], car ils les craignaient, parce qu’Ismaël, fils de Netania, avait frappé à mort[b] Guedalia, fils d’Ahikam, que le roi de Babylone avait établi à la tête du pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Babyloniens ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avait tué » ; le verbe hébreu signifie littéralement « avait frappé », ici dans un contexte mortel.
    reason: lexical_alternative
  - marker: c
    text: Ou « avait placé à la tête du pays » ou « avait chargé du pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי הַכַּשְׂדִּים
  choice: à cause des Chaldéens
  rationale: La locution מִפְּנֵי exprime ici la cause. « Chaldéens » conserve l’ethnonyme hébreu désignant dans ce contexte la puissance babylonienne.
- source_word: כִּי יָרְאוּ מִפְּנֵיהֶם
  choice: car ils avaient peur d’eux
  rationale: Le premier כִּי introduit une explication, et ירא avec מִפְּנֵי exprime naturellement la peur en français.
- source_word: כִּי הִכָּה
  choice: parce que … avait frappé à mort
  rationale: Le second כִּי donne le motif de leur peur. נכה signifie « frapper » et, dans ce contexte manifestement mortel, « frapper à mort » conserve à la fois l’image verbale et son résultat.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismaël, fils de Netania
  rationale: Translittération française courante des noms, avec restitution directe de la relation filiale.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: Guedalia, fils d’Ahikam
  rationale: Le marqueur d’objet אֶת n’est pas rendu; les noms et la filiation sont exprimés selon l’usage français.
- source_word: אֲשֶׁר הִפְקִיד
  choice: que … avait établi responsable
  rationale: Le hiphil de פקד désigne ici l’action de placer quelqu’un dans une fonction d’autorité. Cette formulation explicite naturellement la responsabilité administrative sans préciser un titre absent de l’hébreu.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Rendu français standard et naturel de la chaîne construite.
- source_word: בָּאָרֶץ
  choice: du pays
  rationale: Avec « établir responsable », la préposition reçoit un sens administratif. « Pays » désigne naturellement le territoire concerné.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le verset demeure syntaxiquement rattaché au verset précédent par l’ouverture « à cause de ». Les deux propositions causales introduites par כִּי sont distinguées par « car » puis « parce que » afin de préserver leur enchaînement sans lourdeur.
