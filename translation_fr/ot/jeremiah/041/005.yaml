  text: וַ/יָּבֹ֣אוּ אֲ֠נָשִׁים מִ/שְּׁכֶ֞ם מִ/שִּׁל֤וֹ וּ/מִ/שֹּֽׁמְרוֹן֙ שְׁמֹנִ֣ים אִ֔ישׁ מְגֻלְּחֵ֥י זָקָ֛ן וּ/קְרֻעֵ֥י בְגָדִ֖ים וּ/מִתְגֹּֽדְדִ֑ים וּ/מִנְחָ֤ה וּ/לְבוֹנָה֙ בְּ/יָדָ֔/ם לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/005.yaml
  text: Then eighty men came from Shechem[a], from Shiloh, and from Samaria, with their beards shaved, their clothes torn, and gashing themselves[c][b], with grain offerings and frankincense in their hands to bring to the house of Yahweh.
translation:
  language: fr
  text: Alors arrivèrent quatre-vingts hommes venus de Sichem, de Silo et de Samarie. Ils avaient la barbe rasée, les vêtements déchirés et se faisaient des entailles[a]. Ils portaient dans leurs mains une offrande de céréales[b] et de l’oliban[c], qu’ils venaient apporter à la maison de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se faisaient des coupures ». Il s’agit d’incisions pratiquées sur soi comme signe de deuil.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi signifier plus généralement « offrande » ou « présent » ; dans ce contexte cultuel, il désigne probablement une offrande de céréales.
    reason: lexical_alternative
  - marker: c
    text: 'L’oliban est une résine aromatique employée comme encens. Littéralement : « la maison de Yahvé ». Dans ce contexte postérieur à la destruction de Jérusalem, l’expression peut désigner le lieu du sanctuaire plutôt qu’un temple encore intact.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Alors arrivèrent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession narrative en français.
- source_word: אֲנָשִׁים ... שְׁמֹנִים אִישׁ
  choice: quatre-vingts hommes
  rationale: Le contexte désigne des personnes de sexe masculin; la tournure française place naturellement le nombre devant le nom.
- source_word: מִשְּׁכֶם מִשִּׁלוֹ וּמִשֹּׁמְרוֹן
  choice: venus de Sichem, de Silo et de Samarie
  rationale: Les formes françaises usuelles des toponymes sont retenues, et la répétition de « de » reflète la structure hébraïque.
- source_word: מְגֻלְּחֵי זָקָן
  choice: Ils avaient la barbe rasée
  rationale: Cette formulation française naturelle exprime l’état résultant indiqué par la construction participiale passive.
- source_word: וּקְרֻעֵי בְגָדִים
  choice: les vêtements déchirés
  rationale: Expression concrète et courante qui conserve le signe de deuil décrit par l’hébreu.
- source_word: וּמִתְגֹּדְדִים
  choice: se faisaient des entailles
  rationale: La forme verbale désigne des incisions volontaires pratiquées sur soi, ici comme geste de deuil. « Entailles » en restitue la force sans employer un terme médical ou archaïque.
- source_word: וּמִנְחָה
  choice: une offrande de céréales
  rationale: Dans ce contexte cultuel, minḥah désigne vraisemblablement l’offrande végétale ou céréalière plutôt qu’un simple présent.
- source_word: וּלְבוֹנָה
  choice: de l’encens
  rationale: Le mot désigne précisément l’oliban; « encens » est toutefois le terme français courant et immédiatement compréhensible pour cette résine aromatique dans un contexte cultuel.
- source_word: בְּיָדָם
  choice: dans leurs mains
  rationale: La formulation conserve l’image concrète du texte hébreu.
- source_word: לְהָבִיא
  choice: qu’ils venaient apporter
  rationale: Cette tournure exprime clairement le but de leur venue tout en donnant une phrase française fluide.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: « Maison » traduit directement בֵּית sans présumer qu’un temple intact subsistait, et « Yahvé » représente le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme. « Yahvé » rend explicitement le nom propre divin sans le remplacer par un titre.
- issue: Référent de בֵּית יְהוָה après la destruction de Jérusalem
  choice: la maison de Yahvé
  alternative: le temple de Yahvé
  rationale: La traduction littérale préserve l’ambiguïté entre le temple comme édifice et son emplacement cultuel, au lieu d’affirmer que le bâtiment était encore intact.
translation_notes:
  register: Français international moderne, clair et digne. Les gestes de deuil restent concrets, les toponymes suivent les formes françaises établies, et la formulation préserve l’incertitude historique attachée à la « maison de Yahvé ».
