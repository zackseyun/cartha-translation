  text: וַ/יִּקְחוּ֙ אֶת כָּל הָ֣/אֲנָשִׁ֔ים וַ/יֵּ֣לְכ֔וּ לְ/הִלָּחֵ֖ם עִם יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֑ה וַ/יִּמְצְא֣וּ אֹת֔/וֹ אֶל מַ֥יִם רַבִּ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/012.yaml
  text: They took all the men and went to fight against Ishmael son of Nethaniah[a], and they found him by the great waters that are in Gibeon.
translation:
  language: fr
  text: Ils prirent tous les hommes et partirent combattre contre Ismaël, fils de Netania. Ils le trouvèrent près des grandes eaux qui sont à Gabaon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « près des eaux abondantes » ou « près du grand réservoir de Gabaon ». L’hébreu dit littéralement : « près des eaux nombreuses/grandes qui sont à Gabaon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת כָּל הָאֲנָשִׁים
  choice: Ils prirent tous les hommes
  rationale: Le verbe לקח signifie ici « prendre, emmener avec soi » dans la suite narrative. « Tous les hommes » conserve le sens masculin de אֲנָשִׁים sans préciser davantage qu’il s’agit de soldats.
- source_word: וַיֵּלְכוּ לְהִלָּחֵם עִם
  choice: et partirent combattre
  rationale: Cette tournure française naturelle rend le déplacement suivi de l’intention hostile exprimée par הלך et l’infinitif de לחם avec עִם.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismaël, fils de Netania
  rationale: Les noms suivent leur forme française biblique usuelle; la filiation hébraïque est conservée explicitement.
- source_word: וַיִּמְצְאוּ אֹתוֹ
  choice: Ils le trouvèrent
  rationale: מצא a ici son sens courant de « trouver » dans le contexte d’une poursuite.
- source_word: אֶל מַיִם רַבִּים
  choice: près des grandes eaux
  rationale: « Grandes eaux » conserve l’image littérale et l’ambiguïté de מַיִם רַבִּים, qui peut désigner des eaux abondantes ou une grande étendue/réserve d’eau. « Près de » exprime naturellement la localisation après « trouver ».
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: qui sont à Gabaon
  rationale: La relative hébraïque est maintenue; « à Gabaon » est idiomatique en français pour situer ces eaux dans cette localité.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit écrit. La formulation conserve l’image hébraïque inhabituelle « grandes eaux », tandis que la note présente les principales interprétations géographiques possibles.
