source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְא֤וֹת כָּל הָ/עָם֙ אֲשֶׁ֣ר אֶת יִשְׁמָעֵ֔אל אֶת יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֵ֛ת כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וַ/יִּשְׂמָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/013.yaml
  text: And when all the people who were with Ishmael saw Johanan son of Kareah and all the commanders of the forces who were with him[a], they rejoiced.
translation:
  language: fr
  text: Quand tous ceux qui étaient avec Ismaël virent Yohanan, fils de Qaréah, et tous les chefs des troupes qui l’accompagnaient, ils se réjouirent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quand … virent
  rationale: La construction introduit la circonstance temporelle du récit. En français actuel, « Quand … virent » restitue naturellement le sens sans conserver une formule narrative lourde comme « Il arriva que ».
- source_word: כָּל הָעָם
  choice: tous ceux
  rationale: Le nom collectif désigne ici l’ensemble des personnes mentionnées dans le contexte. « Tous ceux » s’intègre naturellement à la relative française et évite de suggérer toute une population.
- source_word: אֲשֶׁר אֶת יִשְׁמָעֵאל
  choice: qui étaient avec Ismaël
  rationale: La proposition hébraïque est elliptique et emploie אֵת dans un sens comitatif. Le contexte désigne les personnes qui se trouvaient avec Ismaël.
- source_word: יֽוֹחָנָן בֶּן קָרֵחַ
  choice: Yohanan, fils de Qaréah
  rationale: Le patronyme est rendu directement. Les translittérations « Yohanan » et « Qaréah » suivent de près les formes hébraïques tout en restant lisibles en français.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: les chefs des troupes
  rationale: שָׂרֵי désigne des responsables ou commandants, et הַחֲיָלִים les forces militaires. « Chefs des troupes » est clair, actuel et fidèle au contexte militaire.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui l’accompagnaient
  rationale: Le pronom singulier renvoie naturellement à Yohanan. « L’accompagnaient » exprime idiomatiquement le fait d’être avec lui sans ajouter de précision absente de l’hébreu.
- source_word: וַיִּשְׂמָחוּ
  choice: ils se réjouirent
  rationale: Le verbe שׂמח exprime la joie. « Se réjouirent » conserve la force verbale et convient au registre narratif digne.
