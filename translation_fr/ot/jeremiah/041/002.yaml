base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/002.yaml
  text: Then Ishmael son of Nethaniah rose up with the ten men who were with him[a], and they struck down Gedaliah son of Ahikam, son of Shaphan, with the sword, and killed him—the one whom the king of Babylon had appointed over the land.
translation:
  language: fr
  text: Alors Ismaël, fils de Netania, se leva avec les dix hommes qui étaient avec lui, et ils frappèrent Guedalia, fils d’Ahikam, fils de Shafân, avec l’épée, et Ismaël le tua[a] — lui que le roi de Babylone avait établi à la tête du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie successivement deux verbes : le premier est au pluriel (« ils frappèrent »), le second au singulier (« il le tua »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום marque ici le début de l’action hostile. « Se leva » conserve la dynamique narrative sans expliciter davantage que l’hébreu.
- source_word: וַעֲשֶׂרֶת הָאֲנָשִׁים אֲשֶׁר הָיוּ אִתּוֹ
  choice: avec les dix hommes qui étaient avec lui
  rationale: Cette formulation respecte la détermination du groupe et la proposition relative de l’hébreu, dans un français simple et naturel.
- source_word: וַיַּכּוּ
  choice: ils frappèrent
  rationale: נכה désigne ici l’agression violente. « Frappèrent » préserve la distinction avec le verbe causatif suivant, qui en énonce l’issue mortelle.
- source_word: בַּחֶרֶב
  choice: avec l’épée
  rationale: Le beth instrumental est rendu naturellement par « avec »; le singulier collectif conserve l’expression hébraïque.
- source_word: וַיָּמֶת אֹתוֹ
  choice: et le tuèrent
  rationale: Le hiphil de מות exprime la causation de la mort. « Le tuèrent » rend directement et naturellement l’issue fatale.
- source_word: אֲשֶׁר הִפְקִיד
  choice: lui que ... avait établi
  rationale: Dans ce contexte administratif, הפקיד signifie placer quelqu’un dans une fonction d’autorité. « Établir sur » exprime cette nomination sans ajouter de titre absent du texte.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Rendu français standard de la chaîne construite hébraïque.
- source_word: בָּאָרֶץ
  choice: sur le pays
  rationale: Avec הִפְקִיד, la préposition indique ici le domaine d’autorité confié à Guedalia plutôt qu’une simple localisation.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: Guedalia, fils d’Ahikam, fils de Shafân
  rationale: La chaîne patronymique est conservée. Les noms suivent des formes françaises lisibles et proches des consonnes hébraïques.
