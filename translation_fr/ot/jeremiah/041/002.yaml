    issue: Le sujet de « le tuèrent » est pluriel, contrairement au verbe hébreu singulier וַיְמִתֵהוּ.
    rationale: Le texte distingue les dix hommes, qui frappent Guedalia, d’Ismaël, qui le met à mort. La forme française actuelle attribue explicitement les deux actions au groupe et perd cette donnée du texte source.
  - severity: low
    issue: « Avait établi sur le pays » est une tournure peu idiomatique en français international moderne.
    rationale: « Avait établi à la tête du pays » conserve l’idée d’une nomination à l’autorité sur le territoire tout en étant plus naturel.
