  text: וַ/יְהִ֕י כְּ/בוֹאָ֖/ם אֶל תּ֣וֹךְ הָ/עִ֑יר וַ/יִּשְׁחָטֵ֞/ם יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ אֶל תּ֣וֹךְ הַ/בּ֔וֹר ה֖וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/007.yaml
  text: And when they came into the midst of the city[a], Ishmael son of Nethaniah slaughtered them and threw them into the midst of the cistern, he and the men who were with him.
translation:
  language: fr
  text: Quand ils entrèrent au milieu de la ville, Ismaël, fils de Netania, les égorgea et les jeta au milieu de la citerne[a], lui et les hommes qui l’accompagnaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fosse ». Le mot hébreu peut désigner une fosse ou une citerne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹאָם
  choice: Quand ils furent arrivés
  rationale: La tournure narrative hébraïque introduit naturellement en français l’événement qui se produit à leur arrivée, sans qu’il soit nécessaire de traduire littéralement « il arriva que ».
- source_word: אֶל תּוֹךְ הָעִיר
  choice: au cœur de la ville
  rationale: Cette expression rend la valeur spatiale de תּוֹךְ (« intérieur, milieu ») dans un français naturel et évite d’aplatir le texte en simple « dans la ville ».
- source_word: וַיִּשְׁחָטֵם
  choice: les égorgea
  rationale: Le verbe שׁחט désigne normalement l’action de trancher la gorge ou d’abattre; « égorgea » conserve ici la violence concrète du terme.
- source_word: אֶל תּוֹךְ הַבּוֹר
  choice: et les jeta au fond de la citerne
  rationale: L’hébreu associe l’égorgement à un mouvement vers l’intérieur de la citerne. Le français explicite sobrement le dépôt ou la chute des victimes dans celle-ci; « au fond » restitue idiomatiquement תּוֹךְ sans suggérer qu’Ismaël se trouvait lui-même à l’intérieur.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: lui et les hommes qui l’accompagnaient
  rationale: Cette formulation garde l’insistance appositionnelle de l’hébreu et associe clairement les hommes d’Ismaël à l’action.
- source_word: בּוֹר
  choice: citerne
  rationale: בּוֹר peut désigner une fosse ou une citerne. Dans ce contexte narratif, une citerne correspond le mieux à l’installation visée, tout en signalant l’autre possibilité en note.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Égorgea » conserve la force précise du verbe hébreu; la construction finale maintient l’insistance sur la participation d’Ismaël et de ses hommes.
