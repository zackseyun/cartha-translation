    rationale: אֶל־תּוֹךְ הַבּוֹר désigne l’entrée ou l’intérieur/le milieu de la citerne, sans dire explicitement « au fond ». Cette précision matérielle ne doit pas être introduite.
  - severity: low
    issue: Répétition spatiale à rendre plus littéralement
    rationale: Le même תּוֹךְ est employé pour la ville et la citerne. « Au milieu de » dans les deux membres préserve ce parallélisme sans nuire au français.
  revised_text: Quand ils entrèrent au milieu de la ville, Ismaël, fils de Netania, les égorgea et les jeta au milieu de la citerne[a], lui et les hommes qui l’accompagnaient.
