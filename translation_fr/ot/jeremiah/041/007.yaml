- from: Quand ils furent arrivés au cœur de la ville, Ismaël, fils de Netania, les égorgea et les jeta au fond de la citerne[a], lui et les hommes qui l’accompagnaient.
  to: Quand ils entrèrent au milieu de la ville, Ismaël, fils de Netania, les égorgea et les jeta au milieu de la citerne[a], lui et les hommes qui l’accompagnaient.
  rationale: La révision remplace « au cœur » et surtout « au fond » par « au milieu », afin de rendre de façon cohérente et non surinterprétative la valeur spatiale de תּוֹךְ dans les deux occurrences. Elle conserve l’explicitation idiomatique « les jeta », soutenue par le contexte et par la piste d’audit anglaise, sans modifier le sens narratif.
