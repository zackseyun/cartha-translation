  text: וַ/יָּסֹ֨בּוּ֙ כָּל הָ/עָ֔ם אֲשֶׁר שָׁבָ֥ה יִשְׁמָעֵ֖אל מִן הַ/מִּצְפָּ֑ה וַ/יָּשֻׁ֨בוּ֙ וַ/יֵּ֣לְכ֔וּ אֶל יֽוֹחָנָ֖ן בֶּן קָרֵֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/014.yaml
  text: Then all the people whom Ishmael had taken captive from Mizpah turned around and went back to Johanan son of Kareah[a].
translation:
  language: fr
  text: Alors, tous ceux qu’Ismaël avait emmenés captifs[a] de Mitspa firent demi-tour, revinrent et allèrent rejoindre Yohanan, fils de Karéah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’Ismaël avait faits prisonniers » ; plus formellement, « qu’Ismaël avait emmenés en captivité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: firent demi-tour
  rationale: Le verbe סבב décrit ici un changement concret de direction. « Firent demi-tour » est naturel en français moderne et le distingue du verbe suivant.
- source_word: כָּל הָעָם
  choice: tous ceux
  rationale: Le collectif désigne ici l’ensemble des personnes capturées. « Tous ceux » s’accorde naturellement avec la relative qui suit, sans ajouter d’information.
- source_word: אֲשֶׁר שָׁבָה יִשְׁמָעֵאל
  choice: qu’Ismaël avait emmenés captifs
  rationale: Le qal de שבה signifie prendre ou emmener en captivité. Le plus-que-parfait marque l’antériorité de cette capture par rapport aux actions principales.
- source_word: מִן הַמִּצְפָּה
  choice: de Mitspa
  rationale: La préposition מן indique le lieu d’où Ismaël avait emmené les captifs.
- source_word: וַיָּשֻׁבוּ
  choice: revinrent
  rationale: Le verbe שוב est rendu séparément afin de préserver la succession verbale du texte hébreu et son léger effet de reprise après « firent demi-tour ».
- source_word: וַיֵּלְכוּ אֶל
  choice: allèrent rejoindre
  rationale: הלך avec אל exprime le déplacement vers Yohanan. « Allèrent rejoindre » est idiomatique dans ce contexte, sans imposer explicitement l’idée d’une défection politique.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Yohanan, fils de Karéah
  rationale: Les noms sont translittérés et la filiation hébraïque est conservée dans une formulation française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La succession des trois verbes hébreux est conservée malgré une légère redondance intentionnelle.
