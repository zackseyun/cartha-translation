    issue: Omission de « furent trouvés »
    rationale: Le texte hébreu dit explicitement que dix hommes « furent trouvés parmi eux » (נִמְצְאוּ בָם). Le brouillon passe directement à leur parole, supprimant cette information narrative.
  - severity: low
    issue: « avec leurs frères » ne rend pas précisément בְּתוֹךְ
    rationale: La préposition hébraïque signifie « au milieu de / parmi », non simplement « avec ». La correction conserve l’ambiguïté sur l’identité exacte de ces « frères ».
