base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/008.yaml
  text: But ten men were found among them[a], and they said to Ishmael, “Do not put us to death, for we have hidden stores in the field—wheat and barley[b], oil and honey.” So he refrained and did not put them to death among their brothers.
translation:
  language: fr
  text: 'Mais dix hommes furent trouvés parmi eux, et ils dirent à Ismaël : « Ne nous mets pas à mort, car nous avons des provisions cachées dans la campagne : du blé, de l’orge, de l’huile et du miel. » Alors il s’abstint de les mettre à mort au milieu de leurs frères.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Leurs frères » peut désigner leurs compagnons ou les autres membres de leur peuple qui furent tués.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשָׂרָה אֲנָשִׁים נִמְצְאוּ בָם
  choice: Mais dix hommes parmi eux
  rationale: Le וַ initial prend ici une valeur adversative, puisque ces dix hommes constituent une exception au massacre précédent. En français naturel, « parmi eux » suffit à rendre leur présence au sein du groupe; traduire mécaniquement נִמְצְאוּ par « furent trouvés » serait lourd et pourrait suggérer une découverte fortuite étrangère au contexte.
- source_word: אַל תְּמִתֵנוּ
  choice: Ne nous fais pas mourir
  rationale: Cette formulation conserve la valeur causative du hiphil de מות et la supplication directe, sans atténuer la menace de mise à mort.
- source_word: כִּי יֵשׁ לָנוּ מַטְמֹנִים
  choice: car nous avons des réserves cachées
  rationale: מַטְמֹנִים désigne des choses dissimulées. La liste qui suit indique ici des provisions cachées plutôt que des objets précieux au sens général.
- source_word: בַּשָּׂדֶה
  choice: dans les champs
  rationale: Le singulier hébreu peut désigner collectivement la campagne ou les terres cultivées. Le pluriel français « dans les champs » est idiomatique pour des provisions dissimulées sur des terres agricoles.
- source_word: חִטִּים וּשְׂעֹרִים וְשֶׁמֶן וּדְבָשׁ
  choice: du blé, de l’orge, de l’huile et du miel
  rationale: La liste est rendue simplement et précisément. L’huile est probablement de l’huile d’olive, mais le texte ne le précise pas.
- source_word: וַיֶּחְדַּל וְלֹא הֱמִיתָם
  choice: Alors il renonça à les tuer
  rationale: חדל exprime le fait de cesser ou de s’abstenir. La formulation française réunit naturellement les deux propositions hébraïques, dont la seconde explicite la première.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: avec leurs frères
  rationale: « Frères » préserve le terme de parenté hébreu, tandis que « avec » rend ici l’idée qu’ils ne subirent pas le même sort au milieu du groupe.
