  verdict: revise
  source_fidelity: 'La proposition passive נִמְצְאוּ (« furent trouvés ») est omise dans le brouillon : « dix hommes parmi eux dirent » ne rend pas explicitement que ces dix faisaient partie du groupe et furent épargnés. « Avec leurs frères » affaiblit également le sens spatial de בְּתוֹךְ (« au milieu de / parmi »). Le reste rend fidèlement la supplique, les provisions cachées et l’abstention de mise à mort.'
  naturalness: La formulation révisée demeure naturelle en français international moderne. « Furent trouvés parmi eux » est sobre et narrativement clair; « au milieu de leurs frères » est idiomatique dans ce contexte et conserve la relation au groupe.
  terminology: « Ismaël », « mettre à mort », « provisions cachées », « blé », « orge », « huile », « miel » et « frères » conviennent au registre narratif et respectent les termes hébreux. « Dans la campagne » rend naturellement le singulier collectif « dans le champ » sans imposer plusieurs champs précis.
  issues:
