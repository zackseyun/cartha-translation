revisions:
- from: 'Mais dix hommes parmi eux dirent à Ismaël : « Ne nous fais pas mourir, car nous avons des réserves cachées dans les champs : du blé, de l’orge, de l’huile et du miel. » Alors il renonça à les tuer avec leurs frères.[a]'
  to: 'Mais dix hommes furent trouvés parmi eux, et ils dirent à Ismaël : « Ne nous mets pas à mort, car nous avons des provisions cachées dans la campagne : du blé, de l’orge, de l’huile et du miel. » Alors il s’abstint de les mettre à mort au milieu de leurs frères.[a]'
  rationale: La révision rétablit la forme passive et l’information narrative exprimées par נִמְצְאוּ בָם, puis remplace « avec » par « au milieu de » pour rendre בְּתוֹךְ. Elle conserve l’ambiguïté de « leurs frères » signalée par la note, sans préciser indûment de quel groupe il s’agit.
