source:
  edition: WLC
  text: וַ/יִּשְׁמַע֙ יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֣ר עָשָׂ֔ה יִשְׁמָעֵ֖אל בֶּן נְתַנְיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/011.yaml
  text: When Johanan son of Kareah, and all the commanders of the forces who were with him, heard of all the evil that Ishmael son of Nethaniah had done,
translation:
  language: fr
  text: Lorsque Johanan, fils de Karéah, et tous les chefs des troupes qui étaient avec lui apprirent tout le mal qu’avait fait Ismaël, fils de Netania,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Lorsque ... apprirent
  rationale: Le waw consécutif fait progresser le récit, mais la proposition reste suspendue jusqu’au verset suivant. « Lorsque » rend naturellement ce lien temporel; le pluriel convient au sujet composé.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: les chefs des troupes
  rationale: שָׂרִים désigne ici des responsables militaires et חֲיָלִים les troupes placées sous leur autorité. Cette formulation est claire et actuelle.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui étaient avec lui
  rationale: La proposition relative identifie simplement les chefs qui accompagnaient Johanan.
- source_word: אֵת כָּל הָרָעָה
  choice: tout le mal
  rationale: רָעָה désigne ici à la fois la gravité morale et les effets nuisibles des actes d’Ismaël; « mal » conserve cette portée sans la réduire au seul dommage.
- source_word: עָשָׂה
  choice: avait fait
  rationale: Le plus-que-parfait situe naturellement les actes antérieurement au moment où Johanan et ses compagnons en apprennent la nouvelle, tout en conservant le sens général de « faire ».
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Johanan, fils de Karéah
  rationale: Les noms sont translittérés sous une forme française usuelle; les virgules rendent l’apposition naturelle.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismaël, fils de Netania
  rationale: Les noms sont translittérés sous une forme française courante, sans ajouter d’interprétation.
