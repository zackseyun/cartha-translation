  text: וַ/יִּקַּח֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֣ים אֲשֶׁר אִתּ֗/וֹ אֵ֣ת כָּל שְׁאֵרִ֤ית הָ/עָם֙ אֲשֶׁ֣ר הֵ֠שִׁיב מֵ/אֵ֨ת יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ מִן הַ/מִּצְפָּ֔ה אַחַ֣ר הִכָּ֔ה אֶת גְּדַלְיָ֖ה בֶּן אֲחִיקָ֑ם גְּבָרִ֞ים אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/נָשִׁ֤ים וְ/טַף֙ וְ/סָ֣רִסִ֔ים אֲשֶׁ֥ר הֵשִׁ֖יב מִ/גִּבְעֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/016.yaml
  text: 'Then Yohanan son of Kareah[a], and all the commanders of the forces who were with him, took all the remnant of the people whom he had recovered from Ishmael son of Nethaniah, from Mizpah, after he had struck down Gedaliah son of Ahikam: the soldiers, the men of war, and the women, and the little children, and the court officials[b], whom he had brought back from Gibeon.'
translation:
  language: fr
  text: Alors Yohanan, fils de Qaréah, et tous les chefs des troupes qui étaient avec lui prirent tout le reste du peuple que Yohanan avait ramené d’auprès d’Ismaël, fils de Netania, de Mitspa, après qu’Ismaël eut frappé Guedalia, fils d’Ahiqam. Il s’agissait des hommes, des hommes de guerre, des femmes, des jeunes enfants et des officiers de la cour[a], que Yohanan avait ramenés de Gabaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « eunuques » ; le terme hébreu peut désigner des eunuques au sens propre ou des officiers de la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Alors ... prirent
  rationale: Le waw consécutif fait progresser le récit. « Alors » rend naturellement la succession; le pluriel français suit le sujet composé, Yohanan et les chefs.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: les chefs des troupes
  rationale: שָׂרִים désigne des chefs ou commandants, et חֲיָלִים les forces armées ou troupes; cette formulation est claire et actuelle.
- source_word: שְׁאֵרִית הָעָם
  choice: tout le reste du peuple
  rationale: Dans ce récit, « le reste du peuple » exprime naturellement le groupe demeuré ou survivant sans imposer au terme un sens théologique technique.
- source_word: הֵשִׁיב
  choice: avait ramené
  rationale: Le hiphil de שוב signifie faire revenir ou ramener. Ce choix conserve l’idée de retour tout en convenant à la délivrance des captifs; une note signale « repris » comme nuance contextuelle possible.
- source_word: מֵאֵת יִשְׁמָעֵאל
  choice: d’auprès d’Ismaël
  rationale: La préposition marque l’éloignement hors de la présence ou de la maîtrise d’Ismaël, sans ajouter l’expression absente « de la main de ».
- source_word: מִן הַמִּצְפָּה
  choice: depuis Mitspa
  rationale: מִן indique normalement le point d’origine. « Depuis Mitspa » rattache le groupe au lieu d’où Ismaël l’avait emmené et évite de confondre ce complément avec Gabaon.
- source_word: אַחַר הִכָּה
  choice: après qu’Ismaël eut frappé
  rationale: נכה signifie frapper et peut impliquer ici la mise à mort. Répéter « Ismaël » lève en français l’ambiguïté grammaticale du pronom sans modifier le référent narratif.
- source_word: גְּבָרִים אַנְשֵׁי הַמִּלְחָמָה
  choice: les hommes, les gens de guerre
  rationale: La formulation garde les deux éléments hébreux et leur relation appositionnelle possible, au lieu de les réduire à un seul mot comme « soldats ».
- source_word: טַף
  choice: les jeunes enfants
  rationale: טַף désigne les petits enfants ou les personnes à charge; « jeunes enfants » exprime leur âge et leur vulnérabilité en français courant.
- source_word: סָרִסִים
  choice: les hauts fonctionnaires
  rationale: סָרִיסִים peut désigner des eunuques ou des dignitaires de cour. Le contexte n’établit pas leur condition physique; la note conserve explicitement l’autre sens.
- source_word: מִגִּבְעוֹן
  choice: de Gabaon
  rationale: La préposition indique le lieu depuis lequel Yohanan avait ramené ces personnes.
- source_word: יוֹחָנָן; קָרֵחַ; יִשְׁמָעֵאל; נְתַנְיָה; גְּדַלְיָה; אֲחִיקָם; הַמִּצְפָּה; גִּבְעוֹן
  choice: Yohanan; Qaréah; Ismaël; Netania; Guedalia; Ahiqam; Mitspa; Gabaon
  rationale: Les noms sont translittérés sous des formes françaises reconnaissables, avec « Yohanan » proche de la forme hébraïque et les toponymes usuels Mitspa et Gabaon.
theological_decisions: []
