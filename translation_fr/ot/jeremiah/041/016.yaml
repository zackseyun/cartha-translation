revisions:
- from: 'Alors Yohanan, fils de Qaréah, et tous les chefs des troupes qui étaient avec lui prirent tout le reste du peuple qu’il avait ramené[a] d’auprès d’Ismaël, fils de Netania, depuis Mitspa, après qu’Ismaël eut frappé Guedalia, fils d’Ahiqam : les hommes, les gens de guerre, les femmes, les jeunes enfants et les hauts fonctionnaires[b] qu’il avait ramenés de Gabaon.'
  to: Alors Yohanan, fils de Qaréah, et tous les chefs des troupes qui étaient avec lui prirent tout le reste du peuple que Yohanan avait ramené d’auprès d’Ismaël, fils de Netania, de Mitspa, après qu’Ismaël eut frappé Guedalia, fils d’Ahiqam. Il s’agissait des hommes, des hommes de guerre, des femmes, des jeunes enfants et des officiers de la cour[a], que Yohanan avait ramenés de Gabaon.
  rationale: La révision remplace une ponctuation qui risquait de restreindre la dernière relative aux seuls officiers de la cour par deux phrases françaises naturelles. Elle maintient les deux désignations hébraïques des adultes masculins (« hommes » et « hommes de guerre »), le sens de retour de הֵשִׁיב et l’ambiguïté lexicale de סָרִיסִים. « De Mitspa » est plus idiomatique que « depuis Mitspa » sans modifier le sens de provenance.
