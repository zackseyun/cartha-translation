source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֣ה בֶן אֱלִישָׁמָ֣ע מִ/זֶּ֣רַע הַ֠/מְּלוּכָה וְ/רַבֵּ֨י הַ/מֶּ֜לֶךְ וַ/עֲשָׂרָ֨ה אֲנָשִׁ֥ים אִתּ֛/וֹ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֹּ֨אכְלוּ שָׁ֥ם לֶ֛חֶם יַחְדָּ֖ו בַּ/מִּצְפָּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/001.yaml
  text: In the seventh month[a], Ishmael son of Nethaniah, son of Elishama, of the royal line and one of the chief officers of the king, came with ten men to Gedaliah son of Ahikam at Mizpah[c][b], and they ate bread there together in Mizpah.
translation:
  language: fr
  text: Au septième mois, Ismaël, fils de Netania, fils d’Élishama, qui était de la lignée royale[b] et l’un des hauts dignitaires du roi[c], vint avec dix hommes auprès de Guedalia, fils d’Ahikam, à Mitspa. Là, ils mangèrent du pain ensemble[a], à Mitspa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mangèrent du pain » ; cette expression peut désigner le fait de prendre un repas ensemble.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la semence royale », c’est-à-dire de la descendance royale.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’un des grands du roi » ; l’expression peut désigner un noble ou un haut responsable royal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Au septième mois
  rationale: La formule narrative introduit la scène. En français moderne, aucun « maintenant » explicite n’est nécessaire ; l’enchaînement narratif est porté naturellement par le complément temporel.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: au septième mois
  rationale: Rendu direct qui conserve l’indication chronologique sans préciser une année que le texte hébreu ne donne pas.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: de la lignée royale
  rationale: זֶרַע désigne ici l’ascendance ou la descendance, non une semence au sens propre. « Lignée royale » exprime clairement l’appartenance dynastique.
- source_word: וְרַבֵּי הַמֶּלֶךְ
  choice: et l’un des hauts dignitaires du roi
  rationale: Le pluriel hébreu désigne vraisemblablement la classe des grands personnages ou responsables royaux. Comme l’expression qualifie Ismaël, le français demande une formulation représentative au singulier.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: avec dix hommes
  rationale: Cette formulation française naturelle rend pleinement l’idée d’accompagnement sans répéter inutilement « avec lui ».
- source_word: אֶל גְּדַלְיָהוּ ... הַמִּצְפָּתָה
  choice: auprès de Guedalia … à Mitspa
  rationale: La forme directive de Mitspa indique le lieu de destination. « Vint … auprès de Guedalia … à Mitspa » rend naturellement le mouvement vers la personne qui s’y trouvait.
- source_word: וַיֹּאכְלוּ שָׁם לֶחֶם יַחְדָּו
  choice: Là, ils mangèrent du pain ensemble
  rationale: Le texte principal conserve le mot explicite « pain », tandis que la note indique que l’expression signifie plus largement prendre un repas en commun.
- source_word: בַּמִּצְפָּה
  choice: à Mitspa
  rationale: La répétition du lieu est conservée, car elle appartient au texte hébreu et encadre la scène.
theological_decisions:
- issue: Nature de l’appartenance royale d’Ismaël
  choice: de la lignée royale
  alternative: de la descendance royale / de sang royal
  rationale: Le texte affirme une ascendance dynastique sans en préciser davantage le degré ni les conséquences politiques.
- issue: Statut d’Ismaël parmi les רַבֵּי הַמֶּלֶךְ
  choice: l’un des hauts dignitaires du roi
  alternative: l’un des grands du roi / l’un des principaux officiers du roi
  rationale: Le terme peut viser des nobles ou de hauts responsables. « Hauts dignitaires » garde cette ampleur sans imposer une fonction administrative ou militaire précise.
translation_notes:
  register: Français international moderne, digne et narratif. Les noms propres suivent des formes françaises usuelles. La syntaxe explicite les deux qualifications d’Ismaël sans atténuer l’incertitude relative à son rang exact. Tous les appels de note sont placés sur l’expression qu’ils expliquent.
