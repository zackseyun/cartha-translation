id: JER.21.12
reference: Jeremiah 21:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֵּ֣ית דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה דִּ֤ינוּ לַ/בֹּ֨קֶר֙ מִשְׁפָּ֔ט וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עוֹשֵׁ֑ק פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מעללי/הם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/012.yaml
  text: 'House of David[a], thus says Yahweh: Administer justice in the morning, and deliver the one who has been robbed from the hand of the oppressor, lest my wrath go out like fire and burn with no one to quench it[c][b], because of the evil of their deeds.'
translation:
  language: fr
  text: 'Maison de David, voici ce que dit Yahweh : Rendez la justice le matin[a] et délivrez celui qu’on a dépouillé du pouvoir de l’oppresseur[b], de peur que ma colère ne jaillisse comme un feu[c] et ne brûle sans que personne puisse l’éteindre, à cause de la méchanceté de leurs actes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « chaque matin » ; on peut aussi traduire : « Prononcez un jugement le matin » ou « Jugez chaque matin avec justice ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de la main de l’oppresseur », expression hébraïque qui désigne son pouvoir ou son emprise.
    reason: cultural_note
  - marker: c
    text: Ou « que ma fureur ne sorte comme un feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית דָּוִד
  choice: Maison de David
  rationale: Le groupe construit sert d’interpellation à la dynastie ou à la maison royale issue de David. « Maison de David » conserve la formulation biblique tout en restant claire en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: דִּינוּ ... מִשְׁפָּט
  choice: Rendez la justice
  rationale: Cette tournure française exprime naturellement l’obligation judiciaire et éthique confiée à la maison royale, sans réduire מִשְׁפָּט à un simple verdict.
- source_word: לַבֹּקֶר
  choice: le matin
  rationale: Rend sobrement l’indication temporelle. Le contexte peut suggérer une pratique quotidienne, possibilité signalée en note sans l’imposer dans le texte.
- source_word: וְהַצִּילוּ
  choice: délivrez
  rationale: L’impératif demande une intervention concrète pour soustraire la victime à l’oppression. « Délivrez » convient au registre solennel et judiciaire.
- source_word: גָזוּל
  choice: celui qu’on a dépouillé
  rationale: Le participe passif désigne une personne victime de spoliation. Cette formulation est naturelle et compréhensible en français moderne.
- source_word: מִיַּד עוֹשֵׁק
  choice: du pouvoir de l’oppresseur
  rationale: L’expression hébraïque « de la main de » désigne ici le pouvoir ou l’emprise. Le sens idiomatique est donné dans le texte, et l’image littérale est conservée en note.
- source_word: פֶּן
  choice: de peur que
  rationale: Introduit l’avertissement et sa conséquence redoutée, dans un registre prophétique soutenu mais courant.
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: ma colère ne jaillisse comme un feu
  rationale: Conserve le mouvement de la colère divine qui sort ou se déchaîne ainsi que la comparaison explicite avec le feu.
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: et ne brûle sans que personne puisse l’éteindre
  rationale: Prolonge sans l’expliquer excessivement l’image du feu impossible à éteindre une fois le jugement déclenché.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיהֶם
  choice: à cause de la méchanceté de leurs actes
  rationale: Rend la cause du jugement et conserve le pronom pluriel du texte hébreu sans préciser davantage son référent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: « Yahweh » représente directement le nom propre hébreu et évite de le remplacer par un titre.
- issue: Portée du commandement judiciaire
  choice: Rendez la justice le matin
  alternative: Prononcez un jugement le matin ; jugez chaque matin avec justice
  rationale: Le choix français réunit l’acte de juger et l’exigence éthique de justice, tandis que la note maintient l’ambiguïté temporelle entre un moment précis et une pratique régulière.
- issue: Référent de « leurs actes »
  choice: Maintien du pluriel non explicité
  alternative: Vos actes ; les actes des oppresseurs
  rationale: Le suffixe hébreu est à la troisième personne du pluriel et son référent n’est pas explicitement résolu dans ce verset. Le texte français conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique demeure solennelle sans archaïsmes inutiles. Les images du feu et de la colère sont conservées, tandis que l’idiome de la « main » est rendu par son sens naturel dans le texte et expliqué en note.
