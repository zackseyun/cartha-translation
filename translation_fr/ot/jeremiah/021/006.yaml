source:
  edition: WLC
  text: וְ/הִכֵּיתִ֗י אֶת יֽוֹשְׁבֵי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת הָ/אָדָ֖ם וְ/אֶת הַ/בְּהֵמָ֑ה בְּ/דֶ֥בֶר גָּד֖וֹל יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/006.yaml
  text: And I will strike the inhabitants of this city, both man and beast; they will die by a great pestilence.
translation:
  language: fr
  text: Je frapperai les habitants de cette ville, les êtres humains comme les bêtes ; ils mourront d’une grave épidémie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: Je frapperai
  rationale: Le hiphil de נכה exprime ici l’action directe de frapper. Cette formulation moderne conserve la force du jugement sans anticiper inutilement l’énoncé explicite de la mort.
- source_word: יֹשְׁבֵי הָעִיר הַזֹּאת
  choice: les habitants de cette ville
  rationale: Le participe de ישב désigne ceux qui demeurent dans la ville ; « habitants » est naturel, précis et digne.
- source_word: הָאָדָם
  choice: les êtres humains
  rationale: Dans l’opposition collective avec les bêtes, le terme désigne l’ensemble des humains. Cette formulation restitue nettement la catégorie humaine sans introduire une restriction au sexe masculin.
- source_word: הַבְּהֵמָה
  choice: les bêtes
  rationale: בהמה désigne ici collectivement les animaux, probablement surtout domestiques. « Bêtes » maintient l’opposition traditionnelle et solennelle entre humains et animaux.
- source_word: בְּדֶבֶר גָּדוֹל
  choice: d’une terrible épidémie
  rationale: דבר désigne une maladie épidémique meurtrière. En français actuel, « épidémie » est plus immédiatement intelligible que « peste », tandis que « terrible » rend naturellement l’intensité de גָּדוֹל.
- source_word: יָמֻתוּ
  choice: ils mourront
  rationale: Le futur français exprime directement le résultat annoncé du jugement.
- source_word: וְאֶת הָאָדָם וְאֶת הַבְּהֵמָה
  choice: les êtres humains comme les bêtes
  rationale: Cette tournure rend l’inclusion emphatique des deux catégories marquées séparément comme objets en hébreu.
theological_decisions:
- issue: Sens collectif de אָדָם dans l’association humains-animaux
  choice: les êtres humains
  alternative: l’homme
  rationale: Le singulier hébreu est collectif et s’oppose ici à la catégorie animale. « Les êtres humains » conserve exactement cette portée sans laisser entendre que seuls les hommes de sexe masculin sont concernés.
- issue: Agent du jugement
  choice: Je frapperai
  alternative: seront frappés
  rationale: La première personne du texte hébreu attribue directement l’action à Dieu ; la traduction conserve cette affirmation théologique sans l’atténuer par un passif.
translation_notes:
  register: 'Français international moderne, clair et solennel. La ponctuation conserve le mouvement en deux temps : annonce de la frappe, puis conséquence mortelle. Aucun archaïsme ni particularisme confessionnel.'
