id: JER.21.8
reference: Jeremiah 21:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֤ם הַ/זֶּה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֤י נֹתֵן֙ לִ/פְנֵי/כֶ֔ם אֶת דֶּ֥רֶךְ הַ/חַיִּ֖ים וְ/אֶת דֶּ֥רֶךְ הַ/מָּֽוֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/008.yaml
  text: 'And to this people you shall say[a], ‘Thus says Yahweh: Behold, I am setting before you the way of life and the way of death.’'
translation:
  language: fr
  text: 'Et à ce peuple, tu diras : « Ainsi parle Yahweh : Voici, je place devant vous[a] le chemin de la vie et le chemin de la mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je donne devant vous » ; dans ce contexte, l’expression signifie que Dieu place ou présente ces deux voies devant le peuple.'
    reason: alternative lexicale et éclaircissement de l’idiome hébreu
lexical_decisions:
- source_word: וְ/אֶל הָ/עָם הַ/זֶּה
  choice: Et à ce peuple
  rationale: La conjonction relie l’ordre au contexte précédent, tandis que le singulier collectif עָם et le démonstratif sont conservés naturellement par « ce peuple ».
- source_word: תֹּאמַר
  choice: tu diras
  rationale: L’imparfait hébreu a ici une valeur directive adressée à Jérémie ; le futur français exprime sobrement cet ordre.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formulation conserve la solennité de la formule prophétique et rend directement le nom divin יהוה par « Yahweh ».
- source_word: הִנְ/נִי
  choice: Voici
  rationale: « Voici » marque l’attention, l’immédiateté et la solennité de la déclaration divine sans transformer la construction en « me voici », peu naturelle ici.
- source_word: נֹתֵן לִ/פְנֵי/כֶם
  choice: je place devant vous
  rationale: נתן signifie littéralement « donner », mais avec « devant vous » et les deux chemins comme objets, « placer devant » rend clairement l’idée de présenter deux issues. Le présent correspond à la valeur actuelle ou imminente du participe.
- source_word: דֶּרֶךְ הַ/חַיִּים
  choice: le chemin de la vie
  rationale: דֶּרֶךְ désigne ici une voie ou orientation menant à une issue ; חַיִּים, bien que morphologiquement pluriel, exprime couramment la notion abstraite de vie.
- source_word: דֶּרֶךְ הַ/מָּוֶת
  choice: le chemin de la mort
  rationale: La traduction maintient le parallélisme antithétique exact entre la vie et la mort.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le Tétragramme comme nom propre ; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Nature des deux chemins
  choice: le chemin de la vie et le chemin de la mort
  alternative: le chemin qui mène à la vie et celui qui mène à la mort
  rationale: Le génitif hébreu demeure ouvert quant à la relation précise entre le chemin et son issue. La formulation plus formelle préserve cette concision et cette tension sans expliciter silencieusement « mène à ».
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier vise Jérémie (« tu diras »), tandis que le pluriel « vous » vise collectivement le peuple. « Ainsi parle » conserve le registre de la proclamation prophétique sans archaïsme excessif.
