  variant: modern international French
source:
  edition: WLC
  text: הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב וּ/בָ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יּוֹצֵא֩ וְ/נָפַ֨ל עַל הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עֲלֵי/כֶם֙ יחיה וְ/הָֽיְתָה לּ֥/וֹ נַפְשׁ֖/וֹ לְ/שָׁלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/009.yaml
  text: The one who stays in this city will die by the sword[a], by famine, and by pestilence; but the one who goes out and defects to the Chaldeans who are besieging you will live[b], and his life will be to him as plunder.
translation:
  language: fr
  text: Celui qui restera dans cette ville mourra par l’épée, par la famine et par la peste. Mais celui qui en sortira et passera du côté des Chaldéens[a] qui vous assiègent vivra, et sa vie sera pour lui comme un butin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « tombera vers les Chaldéens » ; dans ce contexte, cette expression signifie passer du côté de l’ennemi ou se rendre à lui.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « sa vie sera pour lui pour butin » : il échappera au désastre avec sa seule vie.'
    reason: idiom_explanation
lexical_decisions:
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: Celui qui restera dans cette ville
  rationale: Le participe de ישׁב désigne ici le fait de demeurer dans la ville assiégée. « Restera » exprime naturellement cette valeur contextuelle sans suggérer la simple position assise.
- source_word: יָמוּת
  choice: mourra
  rationale: Le futur français convient à l’annonce prophétique et restitue directement le verbe « mourir ».
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: par l’épée, par la famine et par la peste
  rationale: Cette formulation conserve la triade concrète et récurrente de Jérémie. « L’épée » représente la mort violente liée à la guerre, tandis que « la peste » rend naturellement דֶּבֶר dans ce contexte de jugement et de siège.
- source_word: וְהַיּוֹצֵא
  choice: Mais celui qui en sortira
  rationale: Le contexte donne à la conjonction une valeur contrastive. Le pronom « en » reprend naturellement « cette ville » en français.
- source_word: וְנָפַל עַל
  choice: passera du côté de
  rationale: Dans ce contexte militaire, l’expression idiomatique signifie passer à l’ennemi ou se livrer à lui. « Passera du côté de » reste naturel, n’impose pas le degré d’intention que pourrait suggérer « se ralliera », et évite le calque obscur « tombera sur ».
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le terme ethnique précis du texte hébreu est conservé plutôt que remplacé par « Babyloniens ».
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: qui vous assiègent
  rationale: Le participe de צור décrit ici les forces qui encerclent la ville et lui imposent un siège.
- source_word: יִחְיֶה
  choice: vivra
  rationale: Cette traduction directe conserve le contraste lexical entre mourir et vivre.
- source_word: וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל
  choice: et sa vie sera pour lui comme un butin
  rationale: La formulation préserve l’image hébraïque du butin tout en restant intelligible en français. Elle indique que la seule chose sauvée du désastre sera la vie de la personne.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: Dans cet idiome de survie, נֶפֶשׁ désigne la vie de la personne, non une âme immatérielle distinguée du corps.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ dans une formule de survie
  choice: Traduire par « sa vie »
  alternative: « son âme »
  rationale: Le passage traite de la survie physique au cours d’un siège. « Son âme » introduirait une distinction anthropologique ou doctrinale que l’hébreu n’affirme pas ici.
- issue: Nature du passage vers les forces chaldéennes
  choice: « passera du côté des Chaldéens »
  alternative: « se rendra aux Chaldéens » ou « fera défection auprès des Chaldéens »
  rationale: L’idiome militaire implique le passage vers l’armée ennemie, mais le texte ne précise pas à lui seul toutes les nuances modernes de la reddition ou de la défection. Le choix retenu conserve cette relative largeur de sens.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « mourra » et « vivra » est maintenu, de même que la métaphore finale du butin. Les deux phrases rendent clairement le contraste sans alourdir la syntaxe.
