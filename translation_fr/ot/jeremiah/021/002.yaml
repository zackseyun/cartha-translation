  variant: modern international French
source:
  edition: WLC
  text: דְּרָשׁ נָ֤א בַעֲדֵ֨/נוּ֙ אֶת יְהוָ֔ה כִּ֛י נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל נִלְחָ֣ם עָלֵ֑י/נוּ אוּלַי֩ יַעֲשֶׂ֨ה יְהוָ֤ה אוֹתָ֨/נוּ֙ כְּ/כָל נִפְלְאֹתָ֔י/ו וְ/יַעֲלֶ֖ה מֵ/עָלֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/002.yaml
  text: Please inquire of Yahweh on our behalf[a], because Nebuchadnezzar king of Babylon is fighting against us. Perhaps Yahweh will act for us according to all his wondrous acts[c][b], so that he will withdraw from us.
translation:
  language: fr
  text: « Consulte Yahweh pour nous, je t’en prie, car Nabuchodonosor[a], roi de Babylone, nous fait la guerre. Peut-être Yahweh agira-t-il en notre faveur selon tous ses prodiges[b], et le roi se retirera de nous[c]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Nabuchodrétsar », forme plus proche de l’orthographe hébraïque employée ici.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon tous ses prodiges », c’est-à-dire sur le modèle de ses interventions extraordinaires.'
    reason: lexical_clarification
  - marker: c
    text: 'Littéralement : « et il montera de dessus nous » ; dans ce contexte militaire, l’expression évoque le retrait de l’assaillant.'
    reason: idiom_clarification
lexical_decisions:
- source_word: דְּרָשׁ נָא
  choice: Consulte donc
  rationale: Le verbe דרש désigne ici une démarche auprès de Dieu par l’intermédiaire du prophète. « Consulte » exprime cette demande d’oracle, tandis que « donc » donne à נא une nuance pressante et polie sans alourdir la phrase.
- source_word: בַעֲדֵנוּ
  choice: pour nous
  rationale: Dans ce contexte, בעד indique que Jérémie doit intervenir auprès de Yahweh en faveur des envoyeurs. « Pour nous » est naturel et conserve cette valeur de représentation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du tétragramme conserve le nom divin présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: « Nabuchodonosor » est la forme française courante et immédiatement reconnaissable; une note signale la forme plus proche de l’orthographe hébraïque du verset.
- source_word: נִלְחָם עָלֵינוּ
  choice: nous fait la guerre
  rationale: Le participe niphal décrit une action militaire hostile en cours. Cette tournure française est claire, actuelle et plus précise ici que le simple verbe « combattre ».
- source_word: אוּלַי
  choice: Peut-être
  rationale: Le terme maintient l’incertitude et l’espoir de la requête, sans transformer l’attente en certitude.
- source_word: יַעֲשֶׂה יְהוָה אוֹתָנוּ
  choice: Yahweh agira-t-il en notre faveur
  rationale: Littéralement, la construction dit que Yahweh « fera avec/nous ». Dans le contexte d’une intervention espérée, « agir en notre faveur » rend le sens sans introduire une délivrance certaine.
- source_word: כְּכָל נִפְלְאֹתָיו
  choice: selon tous ses prodiges
  rationale: נפלאות désigne les actes extraordinaires de Dieu. « Prodiges » conserve leur caractère merveilleux, et « selon » maintient la comparaison avec le modèle de ses interventions passées.
- source_word: וְיַעֲלֶה מֵעָלֵינוּ
  choice: et le roi se retirera-t-il loin de nous
  rationale: Littéralement, le sujet implicite « montera de dessus nous ». Le contexte militaire indique le retrait de l’assaillant. La mention « le roi » évite qu’en français le pronom soit attribué à Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette donnée sans lui substituer un titre.
- issue: Référent du sujet implicite de וְיַעֲלֶה
  choice: le roi de Babylone se retirera
  alternative: « il s’éloignera de nous », avec un référent grammaticalement ambigu
  rationale: Dans la situation décrite, c’est l’assaillant dont on espère le retrait. Le français exige une clarification pour ne pas faire de Yahweh, sujet de la proposition précédente, celui qui s’éloigne.
- issue: Nature espérée de l’intervention divine
  choice: agir en notre faveur selon ses prodiges
  alternative: nous traiter selon ses prodiges
  rationale: La formulation garde l’espoir d’une intervention salvatrice tout en conservant le « peut-être » du texte et sans garantir l’issue demandée.
translation_notes:
  register: Français international moderne, digne et accessible. La requête reste polie et pressante; le vocabulaire militaire est direct. L’inversion « agira-t-il » et « se retirera-t-il » maintient un registre biblique soigné sans archaïsme marqué.
