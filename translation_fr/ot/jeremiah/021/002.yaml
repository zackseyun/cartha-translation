- from: « Consulte donc Yahweh pour nous, car Nabuchodonosor[a], roi de Babylone, nous fait la guerre. Peut-être Yahweh agira-t-il en notre faveur selon tous ses prodiges[b], et le roi se retirera-t-il loin de nous[c]. »
  to: « Consulte Yahweh pour nous, je t’en prie, car Nabuchodonosor[a], roi de Babylone, nous fait la guerre. Peut-être Yahweh agira-t-il en notre faveur selon tous ses prodiges[b], et le roi se retirera de nous[c]. »
  rationale: La révision remplace l’inférentiel « donc » par une formule de requête correspondant à נא, supprime l’intensification non nécessaire « loin », et allège la syntaxe finale. Elle préserve l’ambiguïté formelle du yiqtol tout en explicitant, comme le contexte l’exige, que le sujet du retrait est le roi assaillant.
