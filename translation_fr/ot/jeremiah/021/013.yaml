source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלַ֜יִ/ךְ יֹשֶׁ֧בֶת הָ/עֵ֛מֶק צ֥וּר הַ/מִּישֹׁ֖ר נְאֻם יְהוָ֑ה הָ/אֹֽמְרִים֙ מִֽי יֵחַ֣ת עָלֵ֔י/נוּ וּ/מִ֥י יָב֖וֹא בִּ/מְעוֹנוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/013.yaml
  text: Behold[a], I am against you, O inhabitant of the valley, O rock of the plain, declares Yahweh—you who say, “Who will come down against us[b], and who will enter into our dwellings?”
translation:
  language: fr
  text: 'Me voici contre toi, habitante de la vallée, rocher de la plaine — déclaration de Yahvé —, vous qui dites : « Qui descendra contre nous[a] ? Qui entrera dans nos demeures[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui fondra sur nous ? » Le verbe hébreu est difficile; la ville se vante ici d’être à l’abri d’une attaque.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nos demeures »; le mot peut évoquer ici des habitations sûres ou des refuges fortifiés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Me voici contre toi
  rationale: L’expression introduit solennellement l’intervention hostile de Dieu. « Me voici » conserve la force prophétique de הִנְנִי, tandis que « contre toi » rend la valeur adversative du contexte de jugement.
- source_word: יֹשֶׁבֶת הָעֵמֶק
  choice: habitante de la vallée
  rationale: Le participe féminin singulier s’adresse à la ville personnifiée. « Habitante » maintient cette personnification et la forme vocative.
- source_word: צוּר הַמִּישֹׁר
  choice: rocher de la plaine
  rationale: La traduction conserve les images topographiques littérales et leur tension apparente, sans interpréter צוּר comme « forteresse » ni מִישׁוֹר comme « plateau ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: Formule prophétique nominale rendue avec solennité; « Yahvé » représente explicitement le nom divin יְהוָה.
- source_word: הָאֹמְרִים
  choice: vous qui dites
  rationale: Le pluriel hébreu désigne les habitants qui parlent au sein de l’adresse à la ville personnifiée au féminin singulier. Le passage de « toi » à « vous » préserve cette variation grammaticale significative.
- source_word: מִי יֵחַת עָלֵינוּ
  choice: Qui descendra contre nous ?
  rationale: Le verbe est difficile, mais « descendra » conserve son sens spatial probable et la portée militaire de עָלֵינוּ, sans éliminer l’ambiguïté.
- source_word: וּמִי יָבוֹא בִּמְעוֹנוֹתֵינוּ
  choice: Qui entrera dans nos demeures ?
  rationale: Avec בְּ et un lieu habité, « entrera dans » est naturel en français. « Demeures » reste proche de מְעוֹנוֹת sans imposer le sens plus interprétatif de « forteresses ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération française usuelle « Yahvé » rend explicitement le tétragramme et suit la décision doctrinale fournie, sans le remplacer par un titre.
- issue: Adresse à la ville au féminin singulier et parole de ses habitants au pluriel
  choice: Maintenir « toi, habitante », puis « vous qui dites »
  alternative: Uniformiser tout au singulier ou tout au pluriel
  rationale: L’hébreu associe la ville personnifiée au féminin singulier et ses habitants au pluriel. La variation française préserve cette tension rhétorique plutôt que de la lisser.
translation_notes:
  register: Français international moderne, digne et prophétique. La syntaxe conserve le contraste entre l’adresse féminine singulière à la ville et le pluriel de ses habitants. Les images « vallée », « rocher » et « plaine » restent volontairement non harmonisées.
