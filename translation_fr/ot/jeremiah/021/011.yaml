  text: וּ/לְ/בֵית֙ מֶ֣לֶךְ יְהוּדָ֔ה שִׁמְע֖וּ דְּבַר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/011.yaml
  text: 'And to the house of the king of Judah: Hear the word of Yahweh[a].'
translation:
  language: fr
  text: Et vous, maison du roi de Juda, écoutez la parole de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quant à la maison du roi de Juda ». La préposition hébraïque peut introduire une nouvelle parole adressée à la maison royale ou prononcée à son sujet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית
  choice: Quant à la maison de
  rationale: Le waw relie cette parole à la précédente, tandis que לְ peut introduire une adresse dirigée vers la maison royale ou un sujet qui la concerne. « Quant à » marque naturellement en français l’ouverture d’une nouvelle section sans trancher excessivement entre ces nuances; la variante est signalée en note.
- source_word: מֶלֶךְ יְהוּדָה
  choice: du roi de Juda
  rationale: Cette construction nominale est rendue directement et idiomatiquement. Avec « maison », elle peut désigner la maisonnée, la cour ou la dynastie royale, ambiguïté que le français conserve.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif est au pluriel et s’adresse collectivement à la maison royale. « Écoutez » exprime en français moderne l’attention et l’obéissance attendues dans une proclamation prophétique.
- source_word: דְּבַר
  choice: la parole
  rationale: « Parole » conserve la formule prophétique traditionnelle et la portée d’une communication divine, sans la réduire à un simple renseignement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », qui préserve le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu porte le nom divin. « Yahweh » le représente directement et évite de le remplacer silencieusement par un titre.
- issue: Destinataire ou thème introduit par לְ
  choice: Quant à la maison du roi de Juda
  alternative: À la maison du roi de Juda
  rationale: La préposition peut introduire une parole adressée à la maison royale ou prononcée à son sujet. Le texte principal adopte une transition française naturelle, tandis que la note conserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif pluriel « Écoutez » maintient l’adresse collective. « Maison » est conservé afin de ne pas réduire le référent au palais matériel et de préserver les sens possibles de maisonnée, cour ou dynastie.
