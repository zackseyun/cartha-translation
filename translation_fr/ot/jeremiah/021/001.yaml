  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/שְׁלֹ֨חַ אֵלָ֜י/ו הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ אֶת פַּשְׁחוּר֙ בֶּן מַלְכִּיָּ֔ה וְ/אֶת צְפַנְיָ֧ה בֶן מַעֲשֵׂיָ֛ה הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/001.yaml
  text: The word that came to Jeremiah from Yahweh when King Zedekiah sent to him Pashhur son of Malchiah and Zephaniah son of Maaseiah the priest[a], saying,
translation:
  language: fr
  text: 'Voici la parole qui parvint à Jérémie de la part de Yahweh, lorsque le roi Sédécias envoya auprès de lui Pashhour, fils de Malkiya, ainsi que Sophonie, fils de Maaséya, le prêtre[a], pour dire :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu place « le prêtre » après « fils de Maaséya ». Le titre désigne probablement Sophonie; voir aussi Jérémie 29.25 et 37.3.
    reason: La portée syntaxique du titre est signalée sans imposer dans le texte une résolution qui dépasse l’ordre de l’hébreu.
lexical_decisions:
- source_word: הַדָּבָר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message reçu de Dieu. « La parole » conserve la formulation traditionnelle et la force de l’expression hébraïque.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: qui parvint à
  rationale: Littéralement, la parole « fut vers » Jérémie. « Parvint à » rend naturellement en français l’idée d’une révélation qui lui est adressée.
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: מֵאֵת marque ici la source. « De la part de » convient à une parole transmise, et le nom divin יְהוָה est rendu directement par « Yahweh ».
- source_word: בִּשְׁלֹחַ
  choice: lorsque … envoya
  rationale: L’infinitif construit précédé de בְּ a une valeur temporelle; cette tournure est claire et idiomatique en français.
- source_word: אֵלָיו
  choice: lui envoya
  rationale: Le pronom renvoie à Jérémie. La construction française avec un complément indirect placé avant le verbe évite une répétition inutile de son nom.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: le roi Sédécias
  rationale: L’ordre titre-nom est naturel en français; la forme française traditionnelle et intelligible du nom est retenue.
- source_word: פַּשְׁחוּר בֶּן מַלְכִּיָּה
  choice: Pashhour, fils de Malkiya
  rationale: Les noms sont translittérés sous des formes adaptées au français, et בֶּן est rendu de façon transparente par « fils de ».
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: le prêtre Sophonie, fils de Maaséya
  rationale: Le titre הַכֹּהֵן est placé après toute la désignation en hébreu, mais il identifie très probablement Sophonie. Son déplacement avant le nom rend cette relation claire et naturelle en français, tandis qu’une note signale la disposition hébraïque.
- source_word: לֵאמֹר
  choice: 'pour lui dire :'
  rationale: Le terme introduit les paroles rapportées au verset suivant. « Pour lui dire » convient au contexte d’émissaires envoyés auprès de Jérémie et appelle naturellement les deux-points.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin sans le remplacer par un titre.
- issue: Référent du titre « le prêtre »
  choice: Sophonie
  alternative: Maaséya
  rationale: Bien que הַכֹּהֵן suive immédiatement « Maaséya » dans l’ordre des mots, l’apposition peut qualifier Sophonie après sa désignation complète; ailleurs dans Jérémie, Sophonie fils de Maaséya est lui-même identifié comme prêtre. La note conserve toutefois la visibilité de la formulation hébraïque.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase garde la forme d’introduction prophétique et demeure ouverte sur les paroles du verset suivant. Les noms suivent des formes françaises courantes ou des translittérations transparentes.
