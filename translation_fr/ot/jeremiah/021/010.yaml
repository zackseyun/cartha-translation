source:
  edition: WLC
  text: כִּ֣י שַׂ֣מְתִּי פָ֠נַ/י בָּ/עִ֨יר הַ/זֹּ֧את לְ/רָעָ֛ה וְ/לֹ֥א לְ/טוֹבָ֖ה נְאֻם יְהוָ֑ה בְּ/יַד מֶ֤לֶךְ בָּבֶל֙ תִּנָּתֵ֔ן וּ/שְׂרָפָ֖/הּ בָּ/אֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/010.yaml
  text: For I have set my face against this city for harm and not for good[a], declares Yahweh. It will be given into the hand of the king of Babylon[b], and he will burn it with fire.
translation:
  language: fr
  text: Car j’ai tourné mon visage contre cette ville pour son malheur, et non pour son bien[a], — oracle de Yahweh. Elle sera livrée aux mains du roi de Babylone[b], et il la brûlera par le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le désastre »; plus littéralement, « pour le mal ». Ici, l’hébreu רָעָה désigne le malheur ou la calamité qui frappera la ville, et non un mal moral commis par Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « dans la main du roi de Babylone » : expression signifiant qu’elle sera livrée à son pouvoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתִּי פָנַי
  choice: j’ai tourné mon visage contre
  rationale: Conserve l’image hébraïque du visage tout en exprimant en français naturel une opposition résolue. « Contre » est explicité par le contexte hostile.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: pour son malheur, et non pour son bien
  rationale: « Malheur » rend ici רָעָה comme calamité infligée à la ville, sans lui donner le sens d’un mal moral; « bien » préserve l’antithèse large et concise de l’hébreu.
- source_word: נְאֻם יְהוָה
  choice: — déclaration de Yahweh
  rationale: Formule prophétique solennelle qui distingue נְאֻם d’un simple verbe « dire » et conserve le nom divin.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: aux mains du roi de Babylone
  rationale: Préserve l’idiome concret de la main, aisément compris en français comme le pouvoir ou la domination de quelqu’un.
- source_word: תִּנָּתֵן
  choice: Elle sera livrée
  rationale: Le passif correspond au niphal; le féminin « elle » reprend naturellement « cette ville ». « Livrée » exprime mieux que « donnée » la remise au pouvoir d’un conquérant.
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: et il la brûlera par le feu
  rationale: Respecte la construction active avec sujet masculin singulier implicite et objet féminin singulier; « par le feu » garde l’expression instrumentale et la solennité du registre.
theological_decisions:
- issue: Sens de רָעָה dans le langage du jugement divin
  choice: pour son malheur
  alternative: pour le mal; pour le désastre
  rationale: Le contexte annonce une calamité judiciaire visant Jérusalem. « Malheur » maintient la gravité et la tension du propos sans faire de רָעָה une qualification morale de l’action de Dieu.
- issue: Référent du sujet de וּשְׂרָפָהּ
  choice: il la brûlera
  alternative: elle sera brûlée
  rationale: La forme hébraïque est active, avec un sujet masculin singulier non exprimé. Le roi de Babylone est l’antécédent grammatical le plus proche, sans exclure que l’action soit accomplie par ses forces.
translation_notes:
  register: Français international moderne, digne et accessible. L’image hébraïque du visage est conservée, tandis que « livrée aux mains » rend naturellement l’idiome de domination. La ponctuation met en relief la formule prophétique sans alourdir la phrase.
