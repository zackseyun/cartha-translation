source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֣י מֵסֵב֮ אֶת כְּלֵ֣י הַ/מִּלְחָמָה֮ אֲשֶׁ֣ר בְּ/יֶדְ/כֶם֒ אֲשֶׁ֨ר אַתֶּ֜ם נִלְחָמִ֣ים בָּ֗/ם אֶת מֶ֤לֶךְ בָּבֶל֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים הַ/צָּרִ֣ים עֲלֵי/כֶ֔ם מִ/ח֖וּץ לַֽ/חוֹמָ֑ה וְ/אָסַפְתִּ֣י אוֹתָ֔/ם אֶל תּ֖וֹךְ הָ/עִ֥יר הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/004.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Behold, I am turning back the weapons of war that are in your hands, with which you are fighting against the king of Babylon and against the Chaldeans who are besieging you outside the wall, and I will gather them into the midst of this city.'
translation:
  language: fr
  text: 'Voici ce que dit Yahvé, le Dieu d’Israël : « Je vais retourner les armes de guerre que vous tenez en main et avec lesquelles vous combattez le roi de Babylone et les Chaldéens qui vous assiègent à l’extérieur de la muraille. Je les rassemblerai[a] au milieu de cette ville. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom « les » peut aussi désigner le roi de Babylone et les Chaldéens : Dieu ferait alors entrer les forces ennemies dans la ville.'
    reason: Lecture alternative rendue possible par l’ambiguïté de l’antécédent du pronom hébreu masculin pluriel.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » rend le nom divin personnel plutôt que de lui substituer le titre « le Seigneur ».
- source_word: הִנְנִי
  choice: Je vais
  rationale: Dans cette déclaration divine, la construction introduit une action imminente. En français, « je vais » en restitue naturellement la force sans employer l’archaïsme « voici que ».
- source_word: מֵסֵב
  choice: faire se retourner
  rationale: Le participe causatif décrit Yahvé faisant changer de direction aux armes. Cette formulation conserve l’image militaire sans préciser abusivement qu’elles se retourneraient contre leurs détenteurs.
- source_word: כְּלֵי הַמִּלְחָמָה
  choice: les armes de guerre
  rationale: Cette expression claire et actuelle conserve le sens militaire de la locution hébraïque.
- source_word: בְּיֶדְכֶם
  choice: que vous tenez en main
  rationale: La formulation garde l’image concrète de l’hébreu et indique que les défenseurs manient actuellement ces armes.
- source_word: נִלְחָמִים בָּם
  choice: avec lesquelles vous combattez
  rationale: Le français explicite naturellement la valeur instrumentale de la préposition et conserve l’action en cours.
- source_word: אֶת מֶלֶךְ בָּבֶל וְאֶת הַכַּשְׂדִּים
  choice: le roi de Babylone et les Chaldéens
  rationale: Après « combattre », le complément direct français exprime sans ambiguïté la relation hostile, sans qu’il soit nécessaire d’ajouter « contre ».
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le terme historique et ethnique du texte source est conservé plutôt que généralisé en « Babyloniens ».
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: qui vous assiègent
  rationale: Le contexte de la muraille et de l’attaque babylonienne appelle le vocabulaire précis du siège.
- source_word: מִחוּץ לַחוֹמָה
  choice: de l’extérieur de la muraille
  rationale: Cette traduction conserve à la fois la provenance marquée par מִן et la position des assiégeants hors de l’enceinte.
- source_word: וְאָסַפְתִּי אוֹתָם
  choice: Je les rassemblerai
  rationale: Le verbe « rassembler » garde l’image hébraïque, tandis que le pronom masculin pluriel laisse ouverte l’identité de son antécédent.
- source_word: אֶל תּוֹךְ הָעִיר הַזֹּאת
  choice: au cœur de cette ville
  rationale: « Au cœur de » rend de façon naturelle l’idée d’un mouvement vers l’intérieur de la ville.
theological_decisions:
- issue: Référent du pronom dans « Je les rassemblerai »
  choice: Le texte principal laisse le pronom renvoyer aux armes de guerre.
  alternative: Le pronom peut renvoyer au roi de Babylone et aux Chaldéens, Yahvé faisant alors entrer les forces ennemies dans la ville.
  rationale: Le masculin pluriel peut grammaticalement reprendre les armes, et la séquence où Dieu les fait se retourner puis les rassemble dans la ville est cohérente. Toutefois, la proximité des Chaldéens et le contexte du siège rendent aussi possible le renvoi aux forces ennemies ; l’ambiguïté est donc signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe prophétique demeure solennelle sans archaïsmes, et l’ambiguïté du pronom final est conservée puis explicitée en note.
