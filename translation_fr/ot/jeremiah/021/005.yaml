id: JER.21.5
reference: Jeremiah 21:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נִלְחַמְתִּ֤י אֲנִי֙ אִתְּ/כֶ֔ם בְּ/יָ֥ד נְטוּיָ֖ה וּ/בִ/זְר֣וֹעַ חֲזָקָ֑ה וּ/בְ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֥צֶף גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/005.yaml
  text: And I myself will fight against you with an outstretched hand and a strong arm[b][a], and with anger and wrath and great fury.
translation:
  language: fr
  text: Et moi, je combattrai contre vous d’une main étendue et d’un bras puissant[a], avec colère, avec fureur et avec une grande indignation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « d’une main étendue et d’un bras puissant » décrit une intervention divine décisive. Souvent associée à la délivrance lors de l’Exode, elle est ici employée pour le jugement.
    reason: cross_reference
  - marker: b
    text: Ou « avec une grande colère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחַמְתִּי
  choice: je combattrai
  rationale: Le niphal de לחם a ici le sens actif de « combattre ». Le futur français convient à l’action annoncée.
- source_word: אֲנִי
  choice: Et moi, je
  rationale: Le pronom indépendant renforce le sujet déjà marqué dans le verbe. La dislocation « moi, je » rend naturellement cette insistance en français.
- source_word: אִתְּכֶם
  choice: contre vous
  rationale: Avec נלחם, אֵת désigne ici l’adversaire affronté, non un compagnon de combat.
- source_word: בְּיָד נְטוּיָה
  choice: d’une main étendue
  rationale: Cette traduction conserve l’image anthropomorphique et l’écho de la formule biblique décrivant l’intervention puissante de Dieu.
- source_word: וּבִזְרֹעַ חֲזָקָה
  choice: et d’un bras puissant
  rationale: « Puissant » exprime naturellement חָזָק dans cette formule et maintient le parallélisme entre la main et le bras.
- source_word: וּבְאַף
  choice: avec colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère.
- source_word: וּבְחֵמָה
  choice: avec fureur
  rationale: חֵמָה évoque une colère ardente et intense. « Fureur » préserve cette force tout en distinguant le terme du précédent.
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: avec une grande indignation
  rationale: קֶצֶף désigne une vive colère ou indignation. « Grande indignation » rend l’intensification de גָּדוֹל et conserve l’accumulation de trois termes.
theological_decisions:
- issue: Langage anthropomorphique appliqué à l’action divine
  choice: Conserver « d’une main étendue et d’un bras puissant » comme image de l’intervention directe et puissante de Dieu dans le jugement.
  alternative: Paraphraser par « avec une grande puissance ».
  rationale: L’hébreu emploie intentionnellement une formule corporelle qui rappelle notamment les récits de l’Exode; ici, cette puissance se retourne en jugement contre Jérusalem. La métaphore et sa tension intertextuelle doivent être préservées.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « avec » maintient l’accumulation solennelle de l’hébreu; « moi, je » rend l’emphase sans archaïsme.
