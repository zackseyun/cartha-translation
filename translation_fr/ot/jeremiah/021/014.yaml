source:
  edition: WLC
  text: וּ/פָקַדְתִּ֧י עֲלֵי/כֶ֛ם כִּ/פְרִ֥י מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָ֑ה וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/יַעְרָ֔/הּ וְ/אָכְלָ֖ה כָּל סְבִיבֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/014.yaml
  text: And I will punish you according to the fruit of your deeds[a], declares Yahweh, and I will kindle a fire in her forest[b], and it will consume all that is around her.
translation:
  language: fr
  text: Je vous punirai selon le fruit de vos actes[a] — déclaration de Yahweh. Je mettrai le feu à sa forêt[b], et il dévorera tout ce qui se trouve autour d’elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je vous demanderai compte selon le fruit de vos actes ». Le verbe hébreu peut aussi signifier intervenir auprès de quelqu’un ou lui demander compte; ici, le contexte est celui du jugement.
    reason: lexical_alternative
  - marker: b
    text: « Sa forêt » désigne probablement, de manière poétique, Jérusalem ou son complexe royal; certains y voient une image de ses nombreux bâtiments ou de ses défenses.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיכֶם
  choice: Je vous demanderai compte
  rationale: Dans ce contexte de jugement, פקד avec על exprime une intervention par laquelle Dieu tient les destinataires responsables. Cette formulation française garde la portée judiciaire sans réduire le verbe à une simple punition.
- source_word: כִּפְרִי מַעַלְלֵיכֶם
  choice: selon le fruit de vos actes
  rationale: La traduction conserve la métaphore hébraïque du « fruit » et rend כ par « selon », qui exprime la correspondance entre la conduite et le jugement.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם est une formule solennelle d’oracle prophétique. « Déclaration de » demeure naturelle et distingue cette formule d’un simple verbe de parole; le nom divin est translittéré Yahweh.
- source_word: וְהִצַּתִּי אֵשׁ בְּיַעְרָהּ
  choice: Je mettrai le feu à sa forêt
  rationale: Le hiphil de יצת indique l’action d’allumer ou de provoquer un incendie. La formulation est idiomatique en français et garde littéralement יער, « forêt ».
- source_word: וְאָכְלָה כָּל סְבִיבֶיהָ
  choice: et il dévorera tout ce qui l’entoure
  rationale: Le feu est le sujet implicite masculin en français. « Dévorera » conserve l’image vigoureuse du verbe אכל, tandis que « tout ce qui l’entoure » rend les suffixes féminins sans expliciter leur référent.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre divin. La translittération « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Portée de פקד dans un contexte de jugement
  choice: Je vous demanderai compte
  alternative: Je vous punirai; j’interviendrai contre vous; je vous visiterai
  rationale: Le contexte est clairement judiciaire, mais le verbe possède une gamme de sens plus large que « punir ». « Demander compte » exprime ici la responsabilité et le jugement sans effacer entièrement cette amplitude.
- issue: Référent des suffixes féminins de בְּיַעְרָהּ et סְבִיבֶיהָ
  choice: Conserver « sa » et « l’ » sans nommer le référent
  alternative: Expliciter Jérusalem, Sion ou le complexe royal
  rationale: Les suffixes renvoient naturellement à la ville personnifiée dans le contexte, mais le verset ne nomme pas directement le référent. La traduction préserve cette tension littéraire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme prophétique et les images de « fruit », de « forêt » et de feu dévorant. Le féminin hébreu est maintenu indirectement par « sa » et « l’entoure », sans imposer dans le texte principal une identification précise.
