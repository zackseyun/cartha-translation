  language: fr
  text: 'Jérémie leur dit : « Voici ce que vous direz à Sédécias :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר fait avancer le récit. En français narratif, « dit » rend naturellement la succession sans qu’il soit nécessaire de traduire le waw par « et ».
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֲלֵיהֶם
  choice: leur
  rationale: La préposition אֶל avec le suffixe masculin pluriel désigne les destinataires de la parole ; le pronom indirect « leur » est idiomatique en français.
- source_word: כֹּה
  choice: Voici ce que
  rationale: כֹּה introduit ici la teneur d’un message officiel. « Voici ce que » conserve cette fonction tout en étant plus naturel en français moderne que « Ainsi » dans cette construction.
- source_word: תֹאמְרֻן
  choice: vous direz
  rationale: L’imparfait hébreu à la deuxième personne du masculin pluriel a ici une valeur directive. Le futur français exprime naturellement l’instruction adressée au groupe.
- source_word: אֶל
  choice: à
  rationale: La préposition marque le destinataire du message ; « à » est l’équivalent français normal avec le verbe dire.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et largement reconnue du nom du roi.
