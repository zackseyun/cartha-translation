  text: וְ/אַחֲרֵי כֵ֣ן נְאֻם יְהוָ֡ה אֶתֵּ֣ן אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֣ה וְ/אֶת עֲבָדָ֣י/ו וְ/אֶת הָ/עָ֡ם וְ/אֶת הַ/נִּשְׁאָרִים֩ בָּ/עִ֨יר הַ/זֹּ֜את מִן הַ/דֶּ֣בֶר מִן הַ/חֶ֣רֶב וּ/מִן הָ/רָעָ֗ב בְּ/יַד֙ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וּ/בְ/יַד֙ אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הִכָּ֣/ם לְ/פִי חֶ֔רֶב לֹֽא יָח֣וּס עֲלֵי/הֶ֔ם וְ/לֹ֥א יַחְמֹ֖ל וְ/לֹ֥א יְרַחֵֽם־־־־־׀־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/007.yaml
  text: And after that[a], declares Yahweh, I will give Zedekiah king of Judah, his servants, the people, and those left in this city from the plague, from the sword, and from the famine into the hand of Nebuchadnezzar king of Babylon, into the hand of their enemies, and into the hand of those seeking their life; and he will strike them down with the edge of the sword. He will not spare them or have pity or compassion.
translation:
  language: fr
  text: 'Après cela — déclaration de Yahweh — je livrerai Sédécias, roi de Juda, ses serviteurs, le peuple et ceux qui resteront dans cette ville après l’épidémie, l’épée et la famine, au pouvoir de Nabuchodonosor[a], roi de Babylone, au pouvoir de leurs ennemis et de ceux qui en veulent à leur vie. Il les frappera du tranchant de l’épée. Il ne les épargnera pas : il n’aura pour eux ni pitié ni compassion.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici « Neboukadrètsar », forme correspondant plus directement à « Nabuchodrétsar » ; « Nabuchodonosor » est la forme française traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Marque clairement la succession temporelle avec un français naturel et digne.
- source_word: נְאֻם יְהוָה
  choice: — déclaration de Yahweh —
  rationale: Conserve la force solennelle de la formule prophétique et la distingue de la proposition principale.
- source_word: אֶתֵּן ... בְּיַד
  choice: je livrerai ... au pouvoir de
  rationale: L’ensemble idiomatique signifie remettre quelqu’un sous la domination d’un autre. « Au pouvoir de » communique naturellement le sens tout en maintenant la triple répétition.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Rendu assez large pour inclure les serviteurs royaux et les fonctionnaires sans préciser abusivement leur rang.
- source_word: הַנִּשְׁאָרִים
  choice: ceux qui ... auront survécu
  rationale: Le contexte décrit les personnes demeurées en vie après les trois fléaux; cette formulation évite la charge théologique possible de « reste ».
- source_word: הַדֶּבֶר
  choice: l’épidémie
  rationale: Terme moderne et accessible pour une maladie collective meurtrière; « peste » pourrait indûment suggérer une maladie précise.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: ceux qui en veulent à leur vie
  rationale: Expression française naturelle qui conserve la visée meurtrière de l’idiome hébreu sans réduire נֶפֶשׁ à une conception technique de l’âme.
- source_word: לְפִי חֶרֶב
  choice: du tranchant de l’épée
  rationale: Rend l’image hébraïque conventionnelle de la « bouche de l’épée » par son équivalent français usuel.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle du nom royal, tout en signalant en note la forme précise portée par le texte hébreu.
- source_word: לֹא יָחוּס ... וְלֹא יַחְמֹל וְלֹא יְרַחֵם
  choice: 'Il ne les épargnera pas : il n’aura pour eux ni pitié ni compassion'
  rationale: Préserve les trois éléments de la négation et leur intensification, dans une syntaxe française fluide.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Sujet de וְהִכָּם
  choice: Il les frappera, avec Nabuchodonosor comme antécédent
  alternative: On les frappera / leurs ennemis les frapperont
  rationale: Le verbe est au singulier masculin, et Nabuchodonosor est l’antécédent singulier le plus naturel. Le rendu ne transforme toutefois pas cette action humaine en action divine directe.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme et l’accumulation judiciaire du texte hébreu sont maintenus, tandis que les idiomes « donner dans la main » et « chercher la vie » sont rendus par des équivalents français naturels. Le marqueur [a] figure immédiatement après le nom concerné.
