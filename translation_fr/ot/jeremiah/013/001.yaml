review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : la formule divine, l’ordre d’acheter le vêtement de lin pour soi, de le placer à la taille et de ne pas le mettre dans l’eau sont bien rendus. Toutefois, « ne la plonge pas » suggère plus précisément une immersion que l’hébreu וּבַמַּיִם לֹא תְבִיאֵהוּ (« ne la mets/ne la fais pas entrer dans l’eau »), sans exiger nécessairement cette nuance.'
  naturalness: Le français est naturel, moderne et adapté au discours direct. « Va t’acheter » et « autour de ta taille » sont idiomatiques. « Ne la mets pas dans l’eau » est à la fois plus proche de la formulation source et plus neutre que « ne la plonge pas ».
  terminology: « Yahweh » reproduit correctement le tétragramme selon les choix du projet. « Ceinture de lin » est un choix recevable pour אֵזוֹר פִּשְׁתִּים, à condition de conserver en note l’incertitude sur la forme exacte. Dans la note actuelle, « écharpe » évoque normalement un vêtement de cou et n’est pas une alternative française appropriée ici ; « ceinture », « bande » ou « pagne » conviennent mieux.
  issues:
  - severity: low
    issue: « ne la plonge pas dans l’eau » est trop spécifique
    rationale: Le verbe causatif « faire entrer » dans l’eau peut inclure l’immersion, mais ne l’impose pas. « Ne la mets pas dans l’eau » préserve mieux l’ampleur du texte hébreu.
  - severity: low
    issue: Alternative « écharpe de lin » dans la note
    rationale: En français moderne, une écharpe se porte ordinairement au cou et ne rend pas naturellement un vêtement ou une pièce portée à la taille. Il faut la remplacer par une alternative centrée sur la taille.
  revised_text: 'Voici ce que Yahweh m’a dit : « Va t’acheter une ceinture de lin[a] et mets-la autour de ta taille, mais ne la mets pas dans l’eau. »'
