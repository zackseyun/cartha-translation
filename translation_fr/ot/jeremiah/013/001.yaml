source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָל֞וֹךְ וְ/קָנִ֤יתָ לְּ/ךָ֙ אֵז֣וֹר פִּשְׁתִּ֔ים וְ/שַׂמְתּ֖/וֹ עַל מָתְנֶ֑י/ךָ וּ/בַ/מַּ֖יִם לֹ֥א תְבִאֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/001.yaml
  text: 'Thus Yahweh said to me: “Go and buy yourself a linen waistband[a], and put it on your waist, but do not put it in water.”'
translation:
  language: fr
  text: 'Voici ce que Yahweh m’a dit : « Va t’acheter une ceinture de lin[a] et mets-la autour de ta taille, mais ne la mets pas dans l’eau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une bande de lin », « une ceinture de lin » ou, peut-être, « un pagne de lin ». Le mot hébreu désigne une pièce portée autour de la taille.
    reason: Le terme hébreu אֵזוֹר désigne un objet ou vêtement porté à la taille, sans permettre d’en déterminer avec certitude la forme exacte.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que ... m’a dit
  rationale: Rend naturellement en français moderne la formule prophétique tout en conservant sa solennité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu.
- source_word: הָלוֹךְ וְקָנִיתָ לְּךָ
  choice: Va t’acheter
  rationale: L’impératif français restitue la force injonctive de l’infinitif absolu, tandis que « t’acheter » conserve le sens commercial et la nuance de לְּךָ.
- source_word: אֵזוֹר פִּשְׁתִּים
  choice: une ceinture de lin
  rationale: אֵזוֹר désigne un objet ou vêtement porté autour de la taille sans en préciser exactement la forme; פִּשְׁתִּים indique le lin.
- source_word: וְשַׂמְתּוֹ עַל מָתְנֶיךָ
  choice: mets-la autour de ta taille
  rationale: Formulation française naturelle pour un objet porté sur la région des reins ou de la taille.
- source_word: וּבַמַּיִם לֹא תְבִאֵהוּ
  choice: mais ne la plonge pas dans l’eau
  rationale: La forme causative de בוא signifie faire entrer l’objet dans l’eau; « plonger » exprime clairement l’action concrète sans supposer sa finalité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » le représente directement sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au discours direct singulier adressé à Jérémie. « Ceinture » est retenu dans le texte, avec une note préservant l’incertitude concernant la forme précise du vêtement.
