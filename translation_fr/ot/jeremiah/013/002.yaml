source:
  edition: WLC
  text: וָ/אֶקְנֶ֥ה אֶת הָ/אֵז֖וֹר כִּ/דְבַ֣ר יְהוָ֑ה וָ/אָשִׂ֖ם עַל מָתְנָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/002.yaml
  text: So I bought the loincloth according to the word of Yahweh[a], and put it on my waist.
translation:
  language: fr
  text: J’ai donc acheté la ceinture[a] conformément à la parole de Yahvé, et je l’ai mise autour de ma taille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pagne », « la bande » ou « l’écharpe » ; le mot hébreu désigne une pièce portée autour de la taille, près du corps.
    reason: alternative lexicale
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: J’ai donc acheté
  rationale: Le wayyiqtol qal à la première personne du singulier poursuit la séquence narrative. Le passé composé est naturel en français moderne, et « donc » marque l’exécution de l’ordre précédent.
- source_word: הָאֵזוֹר
  choice: la ceinture
  rationale: אֵזוֹר désigne une pièce portée autour de la taille, possiblement une ceinture, une écharpe ou un pagne. « Ceinture » est clair et naturel, tandis qu’une note conserve l’étendue du terme.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahvé
  rationale: Cette formulation rend de près l’idée d’une action accomplie selon la parole, c’est-à-dire l’ordre, de Yahvé.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente directement le nom divin plutôt que de lui substituer un titre.
- source_word: וָאָשִׂם
  choice: et je l’ai mise
  rationale: Le verbe שׂים signifie couramment « mettre » ou « placer » ; le pronom reprend naturellement « la ceinture ».
- source_word: עַל מָתְנָי
  choice: autour de ma taille
  rationale: מָתְנַיִם désigne les reins ou la taille. Dans le contexte d’un vêtement ou d’une ceinture, « autour de ma taille » est idiomatique et précis.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahvé » en conserve la fonction de nom propre sans imposer la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé favorise la lisibilité actuelle ; « conformément à la parole de Yahvé » conserve toutefois la tournure solennelle et la relation explicite avec l’ordre divin.
