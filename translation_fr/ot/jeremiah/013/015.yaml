id: JER.13.15
reference: Jeremiah 13:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְע֥וּ וְ/הַאֲזִ֖ינוּ אַל תִּגְבָּ֑הוּ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/015.yaml
  text: Hear and listen; do not be proud[a], for Yahweh has spoken.
translation:
  language: fr
  text: Écoutez, prêtez attention ! Ne vous enorgueillissez pas[a], car Yahweh a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne soyez pas hautains » ou « ne vous élevez pas ». Le verbe hébreu évoque le fait de s’élever ou d’être haut, ici au sens de l’orgueil.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel de שׁמע appelle directement les destinataires à écouter. « Écoutez » est naturel en français moderne et permet de conserver le redoublement rhétorique avec l’impératif suivant.
- source_word: וְהַאֲזִינוּ
  choice: prêtez attention
  rationale: L’impératif hiphil de אזן exprime une écoute attentive. « Prêtez attention » distingue naturellement ce second appel du premier et en rend l’intensification.
- source_word: אַל תִּגְבָּהוּ
  choice: Ne vous enorgueillissez pas
  rationale: La construction prohibitive avec גבהּ, littéralement associé à l’idée de hauteur, désigne ici l’élévation orgueilleuse. Cette formulation garde la nuance réflexive possible sans devenir obscure.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’interdiction. « Car » convient au ton solennel de la proclamation prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de représenter directement le tétragramme du texte hébreu.
- source_word: דִּבֵּר
  choice: a parlé
  rationale: Le parfait piel de דבר présente la parole divine comme prononcée et décisive. Le passé composé est idiomatique en français et maintient sa pertinence présente.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre, tandis que « le SEIGNEUR » lui substituerait un titre traditionnel.
- issue: Portée morale de תִּגְבָּהוּ
  choice: Ne vous enorgueillissez pas
  alternative: Ne soyez pas hautains / ne vous élevez pas
  rationale: Le contexte appelle un sens moral lié à l’orgueil, mais la note conserve l’image hébraïque de la hauteur et les autres formulations possibles.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme des deux impératifs initiaux est maintenu sans employer l’archaïsme « prêtez l’oreille ». La ponctuation souligne l’appel pressant du prophète.
