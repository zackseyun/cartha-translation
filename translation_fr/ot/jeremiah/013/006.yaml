source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ יָמִ֣ים רַבִּ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֚וּם לֵ֣ךְ פְּרָ֔תָ/ה וְ/קַ֤ח מִ/שָּׁם֙ אֶת הָ֣/אֵז֔וֹר אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/טָמְנ/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/006.yaml
  text: And it happened after many days that Yahweh said to me[a], “Arise, go to Perath[c][b], and take from there the waistband that I commanded you to hide there.”
translation:
  language: fr
  text: 'Bien des jours plus tard, Yahweh me dit : « Lève-toi, va à Perath[a] et prends là-bas la ceinture[b] que je t’avais ordonné d’y cacher[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perath peut désigner l’Euphrate ; le nom hébreu est ici translittéré plutôt que traduit dans le texte principal.
    reason: alternative_reading
  - marker: b
    text: Ou « pagne », « bande de tissu » ou « ceinture de taille ». Le terme hébreu désigne une pièce portée autour de la taille.
    reason: lexical_alternative
  - marker: c
    text: Ou « enfouir ». Le verbe hébreu peut signifier cacher ou dissimuler, parfois en mettant en terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים רַבִּים
  choice: Bien des jours plus tard
  rationale: Cette formulation naturelle rend la transition narrative et l’idée qu’un long intervalle s’est écoulé, sans conserver inutilement l’expression hébraïque littérale « à la fin de nombreux jours ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה; sa translittération préserve le nom propre plutôt que de lui substituer un titre.
- source_word: קוּם לֵךְ
  choice: Lève-toi, va
  rationale: Les deux impératifs sont conservés afin de rendre le mouvement ordonné et le rythme direct de l’hébreu.
- source_word: פְּרָתָה
  choice: jusqu’à Perath
  rationale: Le nom hébreu est translittéré afin de ne pas trancher dans le texte principal entre l’Euphrate et une autre identification possible; « jusqu’à » convient au déplacement vers une destination.
- source_word: וְקַח מִשָּׁם
  choice: et prends là-bas
  rationale: Rend directement l’impératif et l’origine locale marquée par מִשָּׁם, tout en restant idiomatique en français.
- source_word: הָאֵזוֹר
  choice: la ceinture
  rationale: אֵזוֹר désigne une pièce portée autour de la taille. « Ceinture » est clair et suffisamment général, tandis que des désignations plus précises restent possibles.
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: que je t’avais ordonné
  rationale: Le plus-que-parfait situe naturellement l’ordre avant cette nouvelle parole, et « ordonné » conserve sa force d’autorité.
- source_word: לְטָמְנוֹ שָׁם
  choice: d’y cacher
  rationale: Le verbe טמן signifie cacher ou dissimuler et peut, selon le contexte, impliquer l’enfouissement; le choix général évite de préciser indûment le procédé.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » en préserve la fonction de nom propre sans remplacer celui-ci par un titre.
- issue: Identification de פְּרָת
  choice: Perath dans le texte principal
  alternative: l’Euphrate
  rationale: L’Euphrate est une identification naturelle du nom, mais le passage a suscité une incertitude géographique; la translittération conserve cette tension et la note présente l’autre lecture.
translation_notes:
  register: Français international moderne, direct et digne. Le récit est rendu avec une temporalité naturelle; les impératifs gardent leur cadence. Les notes préservent les principales ambiguïtés géographique et lexicale sans alourdir le texte.
