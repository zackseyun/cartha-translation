source:
  edition: WLC
  text: וָ/אֵלֵ֕ךְ וָ/אֶטְמְנֵ֖/הוּ בִּ/פְרָ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/005.yaml
  text: So I went and hid it by the Euphrates[a], as Yahweh had commanded me.
translation:
  language: fr
  text: Je suis donc allé cacher la ceinture près de l’Euphrate[a], comme le SEIGNEUR me l’avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Perath, généralement compris comme désignant l’Euphrate; certains y voient le nom d’un lieu local, « Perath ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵלֵךְ
  choice: Je suis donc allé
  rationale: Le wayyiqtol fait progresser le récit; « donc » exprime naturellement en français l’exécution de l’ordre précédent.
- source_word: וָאֶטְמְנֵהוּ
  choice: cacher la ceinture
  rationale: טמן signifie « cacher, dissimuler ». Le complément pronominal masculin renvoie à la ceinture mentionnée dans le contexte; répéter le nom évite l’ambiguïté que créerait « la cacher » après un sujet masculin parlant.
- source_word: בִּפְרָת
  choice: près de l’Euphrate
  rationale: פְרָת désigne normalement l’Euphrate. La préposition ב est rendue ici par « près de », formulation adaptée à l’action de cacher quelque chose dans les environs d’un lieu, sans préciser indûment la manière.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction exprime la conformité de l’action à l’ordre reçu.
- source_word: צִוָּה
  choice: m’avait ordonné
  rationale: Le plus-que-parfait situe clairement l’ordre divin avant son exécution dans le récit.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Cette forme française respecte la convention révérencielle établie pour le tétragramme tout en le distinguant typographiquement du titre ordinaire « Seigneur ».
- source_word: אוֹתִי
  choice: me
  rationale: Le marqueur d’objet direct avec suffixe de première personne se rend idiomatiquement par le pronom « me » après « ordonner ».
theological_decisions:
- issue: Identification de פְרָת
  choice: l’Euphrate
  alternative: Perath, compris comme un toponyme local non traduit
  rationale: Le sens lexical usuel et la lecture traditionnelle sont « l’Euphrate ». L’hypothèse d’un lieu local nommé Perath reste toutefois possible en raison des considérations géographiques du récit; elle est donc signalée en note sans trancher au-delà des données.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression narrative et la tension géographique du texte. « Ceinture » explicite le référent contextuel du suffixe hébreu sans ajouter une information étrangère au passage.
