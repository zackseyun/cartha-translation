lexical_decisions:
- source_word: וַיְהִי
  choice: Alors … fut adressée
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession, tandis que la tournure française « fut adressée » rend idiomatiquement la venue de la parole.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve le sens lexical de דָּבָר et la portée de la formule prophétique traditionnelle, sans l’expliciter en « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me fut adressée
  rationale: Cette formulation française naturelle exprime que la parole est venue « à moi », sans lourdeur ni archaïsme.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit les paroles divines qui suivent. « En ces termes » remplit naturellement cette fonction en français et prépare la citation du verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation prophétique reste reconnaissable, tandis que les expressions hébraïques sont rendues idiomatiquement; le deux-points annonce la parole du verset suivant.
