  text: Then the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh me fut adressée en ces termes[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et il arriva que la parole de Yahweh vint à moi, disant. »'
