id: JER.13.4
reference: Jeremiah 13:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קַ֧ח אֶת הָ/אֵז֛וֹר אֲשֶׁ֥ר קָנִ֖יתָ אֲשֶׁ֣ר עַל מָתְנֶ֑י/ךָ וְ/קוּם֙ לֵ֣ךְ פְּרָ֔תָ/ה וְ/טָמְנֵ֥/הוּ שָׁ֖ם בִּ/נְקִ֥יק הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/004.yaml
  text: Take the waistband that you bought[a], which is on your waist, and arise, go to Perath, and hide it there in a crevice of the rock.
translation:
  language: fr
  text: « Prends la ceinture que tu as achetée et que tu portes autour de la taille. Lève-toi, va à Perath[a] et cache-la là, dans une fente du rocher. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perath est traditionnellement identifié à l’Euphrate; beaucoup de traductions rendent donc ici « l’Euphrate ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֵזוֹר
  choice: ceinture
  rationale: Le terme désigne une pièce portée autour de la taille. « Ceinture » est naturel en français moderne et évite de préciser indûment qu’il s’agit d’un pagne ou d’une ceinture rigide.
- source_word: קָנִיתָ
  choice: tu as achetée
  rationale: Dans ce contexte narratif, le sens concret d’achat convient mieux que le plus général « acquise ».
- source_word: עַל מָתְנֶיךָ
  choice: que tu portes autour de la taille
  rationale: Cette formulation idiomatique rend clairement la position de la ceinture sans employer l’archaïsme « reins ».
- source_word: וְקוּם לֵךְ
  choice: Lève-toi, va
  rationale: Les deux impératifs sont conservés, avec un registre courant mais digne.
- source_word: פְּרָתָה
  choice: à Perath
  rationale: Le nom de lieu est translittéré afin de ne pas trancher dans le texte principal son identification traditionnelle avec l’Euphrate.
- source_word: טָמְנֵהוּ
  choice: cache-la
  rationale: Le verbe signifie cacher ou dissimuler; « cache-la » préserve ce sens général sans ajouter l’idée explicite d’enfouissement.
- source_word: נְקִיק הַסָּלַע
  choice: dans une fente du rocher
  rationale: « Fente » rend naturellement la fissure ou cavité étroite désignée, tandis que « rocher » correspond au sens concret de סֶלַע.
theological_decisions:
- issue: Identification de פְּרָתָה
  choice: Conserver « Perath » dans le texte principal
  alternative: « l’Euphrate »
  rationale: L’identification géographique influe sur l’interprétation du déplacement demandé à Jérémie. Le texte principal préserve le nom hébreu sans résoudre la question, et la note signale l’identification traditionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination « que tu as achetée et que tu portes » allège la répétition hébraïque tout en conservant les deux précisions. Le pronom féminin « la » reprend « ceinture ».
