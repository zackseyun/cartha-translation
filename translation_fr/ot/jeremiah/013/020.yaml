source:
  edition: WLC
  text: שאי עֵֽינֵי/כֶם֙ ו/ראי הַ/בָּאִ֖ים מִ/צָּפ֑וֹן אַיֵּ֗ה הָ/עֵ֨דֶר֙ נִתַּן לָ֔/ךְ צֹ֖אן תִּפְאַרְתֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/020.yaml
  text: Lift up your eyes and see those who are coming from the north. Where is the flock that was given to you[a], your beautiful sheep?
translation:
  language: fr
  text: Lève les yeux et regarde ceux qui viennent du nord. Où est le troupeau qui t’a été donné, tes splendides brebis[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes brebis glorieuses ». Le mot hébreu peut évoquer la beauté, la splendeur ou la gloire.
    reason: lexical_alternative
lexical_decisions:
- source_word: שאי עֵינֵי/כֶם
  choice: Levez les yeux
  rationale: L’expression idiomatique française conserve l’image hébraïque. Le pluriel français reflète le suffixe de deuxième personne du pluriel, malgré les impératifs féminins singuliers du texte hébreu, dont l’adresse collective demeure perceptible.
- source_word: ו/ראי
  choice: et regardez
  rationale: L’impératif de ראה appelle ici l’attention visuelle; « regardez » est naturel avec « levez les yeux » et garde la force directe de l’ordre.
- source_word: הַ/בָּאִים מִ/צָּפוֹן
  choice: ceux qui viennent du nord
  rationale: Le participe substantivé est rendu avec sa valeur progressive sans préciser qu’il s’agit d’envahisseurs, identification laissée au contexte.
- source_word: הָ/עֵדֶר
  choice: le troupeau
  rationale: עדר désigne couramment un troupeau; ce choix maintient la métaphore pastorale.
- source_word: נִתַּן לָ/ךְ
  choice: qui vous a été confié
  rationale: Le passif de נתן est conservé dans son sens contextuel de remise à la garde ou à la responsabilité de la destinataire; « confié » est plus naturel en français que « donné » dans cette image.
- source_word: צֹאן
  choice: les brebis
  rationale: Le terme désigne le petit bétail, souvent les moutons. « Brebis » évite de répéter « troupeau » et respecte l’apposition pastorale.
- source_word: תִּפְאַרְתֵּ/ךְ
  choice: qui faisaient votre fierté
  rationale: תפארת peut exprimer la beauté, la splendeur, la gloire ou ce dont on se glorifie. Cette formulation française naturelle présente les brebis comme un bien prestigieux et précieux tout en signalant l’alternative en note.
theological_decisions:
- issue: Référent métaphorique du troupeau
  choice: Conserver la métaphore pastorale sans identifier explicitement le troupeau.
  alternative: Le troupeau peut représenter le peuple de Juda ou de Jérusalem, éventuellement les sujets confiés à ses dirigeants.
  rationale: Le verset hébreu ne décode pas lui-même l’image; l’expliciter dans le texte réduirait sa portée rhétorique et interprétative.
- issue: Variation entre adresse singulière féminine et suffixe pluriel
  choice: Employer le vouvoiement français, qui permet une adresse digne à Jérusalem tout en correspondant formellement au suffixe pluriel de « vos yeux ».
  alternative: 'Employer le singulier familier : « Lève les yeux et regarde »; ou émender implicitement le suffixe pour harmoniser les formes.'
  rationale: Le français ne peut reproduire exactement la discordance morphologique hébraïque. Le vouvoiement conserve une adresse unifiée sans imposer une correction du texte source.
translation_notes:
  register: 'Français moderne, international et digne. Le vouvoiement convient à l’adresse personnifiée à Jérusalem et permet de rendre naturellement la suite des impératifs. La ponctuation maintient les deux mouvements rhétoriques : regarder la menace qui approche, puis constater la disparition du troupeau.'
