revisions:
- from: Levez les yeux et regardez ceux qui viennent du nord. Où est le troupeau qui vous a été confié, les brebis qui faisaient votre fierté[a] ?
  to: Lève les yeux et regarde ceux qui viennent du nord. Où est le troupeau qui t’a été donné, tes splendides brebis[a] ?
  rationale: Le texte révisé restitue l’adresse féminine singulière du texte massorétique, tout en laissant implicite l’incongruité du suffixe pluriel attaché à « yeux », que le français ne reproduit pas idiomatiquement. Il conserve le passif non interprété de « donné » et l’apposition pastorale, sans identifier le troupeau ni son référent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : les impératifs hébreux sont au féminin singulier, tandis que le brouillon les met au pluriel. De plus, « qui vous a été confié » interprète utilement mais plus étroitement le passif « qui t’a été donné », et « faisaient votre fierté » introduit un imparfait absent de l’hébreu.'
  naturalness: « Lève les yeux et regarde » est naturel en français moderne dans l’adresse personnifiée à Jérusalem. La reprise appositionnelle « le troupeau..., tes splendides brebis » conserve l’insistance poétique sans explicitation du référent métaphorique.
  terminology: « Troupeau » rend היטב עֵדֶר et « brebis » rend naturellement צֹאן dans ce contexte. « Splendides » rend תִּפְאַרְתֵּךְ sans transformer le nom en proposition verbale; la note préserve l’alternative « glorieuses ».
  issues:
  - severity: medium
    issue: Nombre des impératifs
    rationale: שְׂאִי et וּרְאִי sont des impératifs féminins singuliers. Le pluriel français du brouillon efface cette donnée, alors que l’adresse singulière à Jérusalem peut être rendue naturellement.
  - severity: medium
    issue: Rendu de נִתַּן לָךְ
    rationale: « Confié » explicite une nuance de responsabilité possible dans le contexte, mais le passif hébreu dit plus directement « donné ». « Qui t’a été donné » maintient l’ambiguïté.
  - severity: low
    issue: Temps et catégorie de תִּפְאַרְתֵּךְ
    rationale: « Qui faisaient votre fierté » ajoute un imparfait et convertit le nom hébreu en prédication. « Tes splendides brebis » conserve mieux l’apposition nominale.
  revised_text: Lève les yeux et regarde ceux qui viennent du nord. Où est le troupeau qui t’a été donné, tes splendides brebis[a] ?
  revised_footnotes:
  - marker: a
    text: Ou « tes brebis glorieuses ». Le mot hébreu peut évoquer la beauté, la splendeur ou la gloire.
    reason: lexical_alternative
