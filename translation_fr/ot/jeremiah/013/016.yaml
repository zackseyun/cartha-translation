source:
  edition: WLC
  text: תְּנוּ֩ לַ/יהוָ֨ה אֱלֹהֵי/כֶ֤ם כָּבוֹד֙ בְּ/טֶ֣רֶם יַחְשִׁ֔ךְ וּ/בְ/טֶ֛רֶם יִֽתְנַגְּפ֥וּ רַגְלֵי/כֶ֖ם עַל הָ֣רֵי נָ֑שֶׁף וְ/קִוִּיתֶ֤ם לְ/אוֹר֙ וְ/שָׂמָ֣/הּ לְ/צַלְמָ֔וֶת ישית לַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/016.yaml
  text: Give glory to Yahweh your God before he brings darkness[a], and before your feet stumble on the mountains at twilight. Then you will hope for light, but he will make it deep darkness; he will turn it into gloom.
translation:
  language: fr
  text: Rendez gloire à Yahweh, votre Dieu, avant qu’il fasse venir les ténèbres et avant que vos pieds trébuchent sur les montagnes au crépuscule. Vous espérerez la lumière, mais il la changera en ténèbres profondes[a] ; il en fera une obscurité épaisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « l’ombre de la mort ». Le terme hébreu peut désigner soit des ténèbres associées à la mort, soit des ténèbres très profondes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ ... כָּבוֹד
  choice: Rendez gloire
  rationale: L’impératif pluriel de נתן associé à כָּבוֹד forme l’expression « rendre gloire ». Cette formulation française naturelle conserve l’appel pressant adressé au peuple.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération rend explicitement le nom propre divin יהוה et correspond à la couche de consultation anglaise fournie.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le suffixe de deuxième personne du pluriel est rendu directement et conserve l’adresse collective.
- source_word: יַחְשִׁךְ
  choice: qu’il fasse venir les ténèbres
  rationale: La forme verbale est comprise comme causative. La formulation française exprime clairement l’action divine sans réduire l’image à la simple tombée naturelle de la nuit.
- source_word: יִתְנַגְּפוּ רַגְלֵיכֶם
  choice: que vos pieds trébuchent
  rationale: Le verbe décrit les pieds qui heurtent un obstacle et font trébucher. La tournure reste proche de l’image hébraïque.
- source_word: עַל הָרֵי נָשֶׁף
  choice: sur les montagnes au crépuscule
  rationale: נָשֶׁף désigne ici la pénombre du crépuscule. La traduction conserve les montagnes comme lieu dangereux dans la lumière déclinante, sans en faire un nom de lieu.
- source_word: וְקִוִּיתֶם לְאוֹר
  choice: Vous espérerez la lumière
  rationale: קוה exprime l’attente confiante ou l’espoir. « Espérer la lumière » convient au contexte où le peuple attend un soulagement qui ne viendra pas.
- source_word: וְשָׂמָהּ לְצַלְמָוֶת
  choice: mais il la changera en ténèbres profondes
  rationale: Le pronom reprend « la lumière ». צַלְמָוֶת peut désigner une obscurité extrême ou, selon l’analyse traditionnelle, « l’ombre de la mort » ; le sens contextuel principal est retenu et l’autre possibilité signalée en note.
- source_word: יָשִׁית לַעֲרָפֶל
  choice: il en fera une obscurité épaisse
  rationale: עֲרָפֶל évoque une obscurité dense, parfois associée à une nuée sombre. « Obscurité épaisse » préserve cette intensité.
theological_decisions:
- issue: L’action divine dans la venue des ténèbres
  choice: Yahweh fait venir les ténèbres et transforme la lumière espérée.
  alternative: Les ténèbres tombent d’elles-mêmes, comme un phénomène naturel.
  rationale: La valeur causative de יַחְשִׁךְ, ainsi que les verbes suivants dont Dieu est le sujet, présentent les ténèbres comme une action de jugement divin.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la progression des images de lumière vers des ténèbres de plus en plus denses sont conservés.
