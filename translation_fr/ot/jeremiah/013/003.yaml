  text: And the word of Yahweh came to me a second time[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée une deuxième fois :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique ויהי דבר־יהוה אלי, le français idiomatique dit que la parole « fut adressée » au prophète, plutôt que de reproduire littéralement « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: « Parole » rend directement le nom hébreu et conserve son sens de révélation divine dans la formule prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom objet intégré à « me fut adressée » exprime naturellement en français la direction vers Jérémie.
- source_word: שֵׁנִית
  choice: une deuxième fois
  rationale: Cette expression indique explicitement qu'il s'agit de la seconde occurrence, conformément à l'adverbe hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit naturellement en français les paroles divines qui suivent, sans le calque lourd « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle.
translation_notes:
  register: Français moderne, digne et naturel. La formule « la parole de Yahweh me fut adressée » appartient au registre biblique courant sans être archaïque. Le deux-points rend la fonction introductive de לֵאמֹר.
