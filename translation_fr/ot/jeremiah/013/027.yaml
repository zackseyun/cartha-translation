  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נִֽאֻפַ֤יִ/ךְ וּ/מִצְהֲלוֹתַ֨יִ/ךְ֙ זִמַּ֣ת זְנוּתֵ֔/ךְ עַל גְּבָעוֹת֙ בַּ/שָּׂדֶ֔ה רָאִ֖יתִי שִׁקּוּצָ֑יִ/ךְ א֥וֹי לָ/ךְ֙ יְר֣וּשָׁלִַ֔ם לֹ֣א תִטְהֲרִ֔י אַחֲרֵ֥י מָתַ֖י עֹֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/027.yaml
  text: Your adulteries[a], your lustful neighings, the depravity of your prostitution on the hills in the field—I have seen your abominations. Woe to you, Jerusalem! Will you not be made clean?[d][c][b] How long will it still be?
translation:
  language: fr
  text: 'Tes adultères, tes hennissements pleins de désir, l’infamie de ta prostitution sur les collines, dans la campagne : j’ai vu tes abominations. Malheur à toi, Jérusalem ! Ne seras-tu pas purifiée ?[a] Combien de temps encore ?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Tu ne seras pas purifiée » ou « Ne deviendras-tu pas pure ? »'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu est elliptique, littéralement : « après quand encore ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֻפַיִךְ
  choice: tes adultères
  rationale: Le pluriel désigne des actes d’adultère et maintient l’image concrète de l’infidélité de Jérusalem.
- source_word: וּמִצְהֲלוֹתַיִךְ
  choice: tes hennissements pleins de désir
  rationale: Le terme évoque le hennissement des chevaux comme image d’un désir sexuel débridé, en écho à Jérémie 5.8.
- source_word: זִמַּת זְנוּתֵךְ
  choice: l’infamie de ta prostitution
  rationale: זִמָּה exprime ici une conduite honteuse et moralement perverse; « infamie » conserve la force accusatrice avec un français naturel et digne.
- source_word: עַל גְּבָעוֹת בַּשָּׂדֶה
  choice: sur les collines, dans la campagne
  rationale: Cette formulation préserve le cadre topographique des pratiques dénoncées et rend idiomatiquement בַּשָּׂדֶה.
- source_word: רָאִיתִי שִׁקּוּצַיִךְ
  choice: j’ai vu tes abominations
  rationale: Le passé composé maintient la pertinence présente de l’accusation; « abominations » conserve les possibles connotations idolâtres et cultuelles.
- source_word: אוֹי לָךְ
  choice: Malheur à toi
  rationale: Équivalent français courant et solennel de la formule prophétique de lamentation et de jugement.
- source_word: לֹא תִטְהֲרִי
  choice: Ne te laisseras-tu pas purifier ?
  rationale: La question rhétorique convient à l’appel angoissé du contexte; la tournure pronominale causative préserve la possibilité d’une nuance passive sans exclure la responsabilité de Jérusalem.
- source_word: אַחֲרֵי מָתַי עוֹד
  choice: Combien de temps encore ?
  rationale: Rendu français idiomatique de l’expression hébraïque elliptique, sans fournir artificiellement un complément absent.
theological_decisions:
- issue: Langage sexuel comme image de l’infidélité et de l’idolâtrie
  choice: Conserver les images concrètes d’adultère, de hennissement et de prostitution.
  alternative: Employer des termes abstraits tels que « infidélité » ou « immoralité ».
  rationale: Les images volontairement choquantes appartiennent à la force prophétique du texte; les atténuer ferait disparaître une tension essentielle.
- issue: Valeur de לֹא תִטְהֲרִי
  choice: 'Lire la proposition comme une question rhétorique : « Ne te laisseras-tu pas purifier ? »'
  alternative: 'Lire une déclaration : « Tu ne seras pas purifiée. »'
  rationale: La syntaxe non ponctuée permet les deux compréhensions, mais la question temporelle qui suit favorise un appel rhétorique. Une note conserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le tutoiement féminin singulier correspond à Jérusalem personnifiée. Les images sexuelles et animales sont maintenues sans archaïsme; la ponctuation rend l’accusation puis l’appel final.
