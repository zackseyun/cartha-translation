  terminology: '« Yahweh » respecte la décision relative au tétragramme. « Fracasser », « épargner », « avoir pitié » et « faire preuve de compassion » rendent bien la gradation lexicale sans imposer une lecture doctrinale. Aucun ajout de note n’est requis : l’ancre a couvre adéquatement l’alternative lexicale principale.'
