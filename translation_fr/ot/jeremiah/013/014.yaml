source:
  edition: WLC
  text: וְ/נִפַּצְתִּי/ם֩ אִ֨ישׁ אֶל אָחִ֜י/ו וְ/הָ/אָב֧וֹת וְ/הַ/בָּנִ֛ים יַחְדָּ֖ו נְאֻם יְהוָ֑ה לֹֽא אֶחְמ֧וֹל וְ/לֹֽא אָח֛וּס וְ/לֹ֥א אֲרַחֵ֖ם מֵ/הַשְׁחִיתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/014.yaml
  text: And I will smash them against each other[a], man against his brother, fathers and sons together, declares Yahweh. I will not spare, nor will I pity, nor will I have compassion[b], from destroying them.
translation:
  language: fr
  text: Je les fracasserai les uns contre les autres[a], chacun contre son frère, pères et fils ensemble — oracle de Yahweh. Je n’épargnerai pas, je n’aurai pas pitié, je ne ferai pas preuve de compassion, sans me retenir de les détruire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Je les briserai les uns contre les autres » ou « Je les projetterai violemment les uns contre les autres ».

      '
    reason: Le verbe hébreu נפץ peut évoquer le fait de fracasser, de briser ou de projeter avec violence.
lexical_decisions:
- source_word: וְנִפַּצְתִּים
  choice: Je les fracasserai
  rationale: Le verbe נפץ exprime ici une action violente qui brise ou fracasse. « Fracasser » conserve cette force concrète et convient à des personnes projetées les unes contre les autres.
- source_word: אִישׁ אֶל אָחִיו
  choice: chacun contre son frère
  rationale: La construction distributive au singulier signifie que chaque homme est opposé à son frère. « Chacun contre son frère » reste naturel en français tout en conservant le terme masculin de parenté.
- source_word: וְהָאָבוֹת וְהַבָּנִים יַחְדָּו
  choice: les pères et les fils tous ensemble
  rationale: L’hébreu nomme explicitement les pères et les fils. Cette formulation préserve les liens familiaux masculins ainsi que l’insistance de יַחְדָּו.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: La formule prophétique נְאֻם est rendue comme une déclaration solennelle, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: לֹא אֶחְמֹל
  choice: Je n’épargnerai pas
  rationale: חמל peut désigner le fait de s’abstenir de détruire par pitié. « Épargner » exprime clairement cette retenue refusée.
- source_word: וְלֹא אָחוּס
  choice: je n’aurai pas pitié
  rationale: חוס recouvre les notions de pitié et d’épargne. « Avoir pitié » permet de distinguer ce membre du précédent sans effacer l’accumulation de quasi-synonymes.
- source_word: וְלֹא אֲרַחֵם
  choice: je ne ferai pas preuve de compassion
  rationale: רחם exprime la compassion ou la miséricorde. Ce choix conserve la dimension affective du terme sans ajouter une nuance doctrinale étrangère au contexte.
- source_word: מֵהַשְׁחִיתָם
  choice: rien ne m’empêchera de les détruire
  rationale: 'Le מן suivi de l’infinitif se rattache à l’idée de retenue exprimée par les trois verbes précédents. Cette formulation française rend naturellement le sens : aucune pitié ou compassion ne retiendra Yahweh de les détruire.'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » le traite comme le nom propre divin plutôt que de le remplacer par un titre.
- issue: Langage masculin des liens familiaux
  choice: chacun contre son frère, les pères et les fils
  alternative: les uns contre les autres, parents et enfants
  rationale: L’hébreu emploie אָחִיו, הָאָבוֹת et הַבָּנִים. Conserver « frère », « pères » et « fils » respecte les relations précisément nommées et la violence de leur rupture.
- issue: Rapport syntaxique de מֵהַשְׁחִיתָם avec les trois négations
  choice: rien ne m’empêchera de les détruire
  alternative: sans les détruire / de les détruire
  rationale: Le syntagme peut se rendre très littéralement par « de les détruire », mais cette tournure serait maladroite après trois verbes distincts en français. Le texte affirme que ni l’épargne, ni la pitié, ni la compassion ne retiendront la destruction; la formulation choisie explicite ce rapport sans adoucir le jugement.
translation_notes:
  register: Français international moderne, solennel et direct. Le rythme ternaire des refus divins est conservé par trois propositions distinctes. « Déclaration de Yahweh » garde le caractère formulaire de l’énoncé prophétique; le deux-points rend explicite, en français naturel, l’aboutissement des trois négations.
