  source_fidelity: La formulation « la part que je t’ai mesurée » absorbe מֵאִתִּי (« de ma part / venant de moi ») dans un verbe de mesure qui n’est pas explicitement présent sous cette forme. Elle produit aussi une tournure française peu naturelle (« mesurer quelqu’un »). La révision rend explicitement l’origine divine de la part tout en conservant l’idée de mesure portée par l’expression hébraïque.
  naturalness: Le français révisé est fluide, solennel sans archaïsme, et convient à une déclaration prophétique. « Voici » est plus neutre et direct que « Voilà » dans ce registre.
  terminology: « Lot », « part », « Yahweh », « oublié » et « mensonge » rendent adéquatement les termes clés sans restreindre le sens de שֶּׁקֶר à une forme particulière de tromperie.
