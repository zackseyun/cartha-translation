source:
  edition: WLC
  text: זֶ֣ה גוֹרָלֵ֧/ךְ מְנָת מִדַּ֛יִ/ךְ מֵֽ/אִתִּ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֙ שָׁכַ֣חַתְּ אוֹתִ֔/י וַֽ/תִּבְטְחִ֖י בַּ/שָּֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/025.yaml
  text: This is your lot[a], the portion measured out to you from me, declares Yahweh[b], because you have forgotten me and trusted in falsehood.
translation:
  language: fr
  text: Voici ton lot[a], la part qui t’est mesurée et qui vient de moi — déclaration de Yahweh —, parce que tu m’as oublié et que tu as mis ta confiance dans le mensonge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lot qui t’est attribué » ou « ton destin ». L’hébreu associe les idées de sort, de part et de mesure pour souligner ce qui t’est assigné.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans ce qui est faux » ou « dans la tromperie ». Le terme hébreu peut désigner le mensonge, la fausseté ou la tromperie.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה גוֹרָלֵךְ
  choice: Voilà le sort qui t’est réservé
  rationale: Le démonstratif introduit solennellement la sentence. « Sort » conserve l’idée d’un lot attribué, tandis que « qui t’est réservé » rend ce sens de façon naturelle en français.
- source_word: מְנָת מִדַּיִךְ
  choice: la part que je t’ai mesurée
  rationale: La formulation restitue l’image d’une part déterminée par mesure, sans réduire la répétition hébraïque de l’attribution à une simple notion abstraite de destin.
- source_word: מֵאִתִּי
  choice: je t’ai mesurée
  rationale: 'Le pronom de première personne est intégré à la proposition verbale : la part vient bien de Yahweh, qui l’a fixée.'
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale garde la solennité de la formule prophétique et rend directement le nom divin.
- source_word: אֲשֶׁר
  choice: parce que
  rationale: Dans le contexte, la particule introduit la cause de la sentence annoncée.
- source_word: שָׁכַחַתְּ אוֹתִי
  choice: tu m’as oublié
  rationale: Le féminin singulier de l’hébreu est conservé par l’adresse directe, sans ajouter explicitement « Juda » ou « Jérusalem ».
- source_word: וַתִּבְטְחִי בַּשָּׁקֶר
  choice: et que tu as mis ta confiance dans le mensonge
  rationale: « Mettre sa confiance dans » rend naturellement le verbe בטח. « Le mensonge » demeure assez large pour désigner ce qui est faux, trompeur ou illusoire sans préciser indûment son référent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le tétragramme comme nom propre; « Yahweh » le restitue directement plutôt que de lui substituer un titre.
- issue: Référent des formes à la deuxième personne du féminin singulier
  choice: Maintien de l’adresse au singulier « tu »
  alternative: Expliciter « Juda » ou « Jérusalem »
  rationale: Le verset apostrophe une entité féminine collective, mais ne la nomme pas ici; l’adresse directe préserve cette caractéristique sans ajout interprétatif.
- issue: Portée de בַּשָּׁקֶר
  choice: dans le mensonge
  alternative: dans les mensonges / dans ce qui est faux / dans la tromperie
  rationale: Le singulier collectif ou abstrait reste ouvert à plusieurs formes de fausseté et évite de déterminer précisément l’objet de la confiance.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. L’adresse au féminin singulier n’est pas morphologiquement visible dans « tu », mais elle n’est pas remplacée par un référent ajouté. Les tirets isolent la formule prophétique sans alourdir la phrase.
