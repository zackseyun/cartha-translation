  text: הָ/עָם֩ הַ/זֶּ֨ה הָ/רָ֜ע הַֽ/מֵּאֲנִ֣ים לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֗/י הַ/הֹֽלְכִים֙ בִּ/שְׁרִר֣וּת לִבָּ֔/ם וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וִ/יהִי֙ כָּ/אֵז֣וֹר הַ/זֶּ֔ה אֲשֶׁ֥ר לֹא יִצְלַ֖ח לַ/כֹּֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/010.yaml
  text: This evil people[a], who refuse to hear my words, who walk in the stubbornness of their heart, and who go after other gods to serve them and to bow down to them, will become like this waistband, which is good for nothing.
translation:
  language: fr
  text: Ce peuple mauvais, qui refuse d’écouter mes paroles, qui marche selon l’obstination de son cœur et qui va à la suite d’autres dieux pour les servir et se prosterner devant eux, deviendra comme cette ceinture[a], qui n’est bonne à rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bande portée autour de la taille » ou « pagne ». Le mot hébreu אֵזוֹר désigne une pièce portée autour de la taille, dont la forme exacte reste incertaine dans ce récit symbolique.'
    reason: Alternative lexicale et incertitude concernant la forme précise du vêtement.
lexical_decisions:
- source_word: הָעָם הַזֶּה הָרָע
  choice: Ce peuple mauvais
  rationale: עָם désigne ici collectivement le peuple de Juda et de Jérusalem. « Mauvais » conserve la sévérité morale de רַע sans remplacer « peuple » par « nation ».
- source_word: הַמֵּאֲנִים לִשְׁמוֹעַ אֶת־דְּבָרַי
  choice: qui refuse d’écouter mes paroles
  rationale: מָאֵן exprime un refus délibéré. « Écouter » rend naturellement en français la portée d’une écoute qui appelle l’obéissance, et le pluriel « paroles » respecte l’hébreu.
- source_word: הַהֹלְכִים בִּשְׁרִרוּת לִבָּם
  choice: qui marche selon l’obstination de son cœur
  rationale: « Marche » préserve l’image hébraïque de la conduite habituelle. שְׁרִרוּת indique l’obstination, et le singulier collectif « son cœur » est maintenu.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: et qui va à la suite d’autres dieux
  rationale: Cette formulation conserve l’image de suivre d’autres dieux et s’intègre à la série descriptive, sans imposer une nuance temporelle plus précise que le contexte.
- source_word: לְעָבְדָם וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: pour les servir et se prosterner devant eux
  rationale: 'Les deux verbes hébreux restent distincts : עבד désigne le service voué aux dieux, tandis que השתחוה évoque concrètement la prosternation.'
- source_word: וִיהִי כָאֵזוֹר הַזֶּה
  choice: deviendra comme cette ceinture
  rationale: « Deviendra » exprime le résultat annoncé. אֵזוֹר désigne une pièce portée autour de la taille ; « ceinture » est clair et naturel, tandis qu’une note préserve l’étendue possible du terme.
- source_word: אֲשֶׁר לֹא יִצְלַח לַכֹּל
  choice: qui n’est bonne à rien
  rationale: Cette tournure française naturelle rend l’inutilité totale exprimée par l’idiome hébreu.
theological_decisions:
- issue: Distinction entre les deux expressions de l’idolâtrie
  choice: « les servir et se prosterner devant eux »
  alternative: Rendre les deux verbes par une expression générale telle que « les adorer »
  rationale: L’hébreu emploie deux verbes différents. Les conserver évite d’aplatir l’accusation et maintient à la fois l’idée de service cultuel et le geste concret de prosternation.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe conserve la longue caractérisation prophétique du peuple, tandis que « écouter », « va à la suite de » et « n’est bonne à rien » assurent une compréhension immédiate. Le marqueur de note est placé après « ceinture », le terme auquel la note se rapporte.
