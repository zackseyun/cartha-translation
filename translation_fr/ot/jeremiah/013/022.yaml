  text: וְ/כִ֤י תֹאמְרִי֙ בִּ/לְבָבֵ֔/ךְ מַדּ֖וּעַ קְרָאֻ֣/נִי אֵ֑לֶּה בְּ/רֹ֧ב עֲוֺנֵ֛/ךְ נִגְל֥וּ שׁוּלַ֖יִ/ךְ נֶחְמְס֥וּ עֲקֵבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/022.yaml
  text: And if you say in your heart[a], ‘Why have these things happened to me?’—because of the greatness of your iniquity your skirts have been uncovered[b], your heels have been violated.
translation:
  language: fr
  text: 'Et si tu dis dans ton cœur : « Pourquoi tout cela m’est-il arrivé[a] ? » C’est à cause de la grandeur de ton iniquité que les pans de ta robe ont été découverts et que tes talons ont été violentés[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi ces malheurs se sont-ils abattus sur moi ? »'
    reason: lexical_alternative
  - marker: b
    text: L’expression poursuit l’image d’une exposition humiliante ; l’hébreu peut aussi s’entendre plus généralement d’un traitement violent ou abusif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Et si
  rationale: Introduit l’objection intérieure envisagée tout en maintenant le lien avec le verset précédent, sans imposer une valeur strictement temporelle ou causale.
- source_word: תֹאמְרִי בִּלְבָבֵךְ
  choice: tu dis dans ton cœur
  rationale: Conserve l’image hébraïque de la parole intérieure dans un français biblique clair et digne.
- source_word: קְרָאֻנִי אֵלֶּה
  choice: tout cela m’est-il arrivé
  rationale: Rend idiomatiquement la construction inhabituelle par laquelle la locutrice demande pourquoi ces événements l’ont atteinte; « tout cela » est plus naturel en français que « ces choses ».
- source_word: בְּרֹב עֲוֺנֵךְ
  choice: à cause de la grandeur de ton iniquité
  rationale: La préposition exprime ici la cause; « grandeur » reflète רֹב et « iniquité » conserve la portée morale forte de עָוֹן.
- source_word: נִגְלוּ שׁוּלַיִךְ
  choice: les pans de ta robe ont été découverts
  rationale: שׁוּלַיִם désigne les parties basses ou les pans du vêtement; la formulation préserve l’image d’une exposition publique humiliante.
- source_word: נֶחְמְסוּ עֲקֵבָיִךְ
  choice: tes talons ont subi la violence
  rationale: Le niphal de חמס évoque une violence ou un traitement injuste subi. Cette formulation garde le membre du corps explicitement nommé et la dureté du verbe sans préciser davantage la nature de l’atteinte.
theological_decisions:
- issue: Image prophétique d’exposition honteuse et de violence
  choice: Conserver l’exposition forcée des pans de la robe et la violence infligée aux talons, sans atténuer l’humiliation ni expliciter un acte sexuel précis.
  alternative: Paraphraser par « ta nudité a été exposée » ou rendre l’image comme une agression sexuelle explicitement décrite.
  rationale: Le texte présente le jugement contre Jérusalem sous les traits d’une femme publiquement humiliée. La traduction doit préserver la gravité et la tension de l’image sans ajouter des détails que l’hébreu ne formule pas explicitement.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « dans ton cœur » conserve l’idiome biblique; « les pans de ta robe » rend concrètement l’image vestimentaire, tandis que « ont subi la violence » maintient l’ambiguïté sévère de l’hébreu.
