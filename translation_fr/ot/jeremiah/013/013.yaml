id: JER.13.13
reference: Jeremiah 13:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י מְמַלֵּ֣א אֶת כָּל יֹשְׁבֵ֣י הָ/אָ֪רֶץ הַ/זֹּ֟את וְ/אֶת הַ/מְּלָכִ֣ים הַ/יֹּשְׁבִים֩ לְ/דָוִ֨ד עַל כִּסְא֜/וֹ וְ/אֶת הַ/כֹּהֲנִ֣ים וְ/אֶת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת כָּל יֹשְׁבֵ֥י יְרוּשָׁלִָ֖ם שִׁכָּרֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/013.yaml
  text: 'Then you shall say to them[a], ‘Thus says Yahweh: Behold, I am about to fill all the inhabitants of this land—and the kings who sit on David’s throne, and the priests, and the prophets[b], and all the inhabitants of Jerusalem—with drunkenness.’'
translation:
  language: fr
  text: 'Tu leur diras : « Ainsi parle Yahweh : Me voici, je vais remplir d’ivresse[b] tous les habitants de ce pays, les rois qui siègent sur le trône de David[a], les prêtres, les prophètes et tous les habitants de Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « les rois qui siègent pour David sur son trône », tournure qui souligne leur succession dynastique à David.'
    reason: lexical_alternative
  - marker: b
    text: L’« ivresse » évoque probablement ici le désarroi et le jugement que Dieu impose ; l’image concrète est néanmoins maintenue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Tu leur diras
  rationale: Le futur français exprime naturellement l’instruction prophétique et la progression du discours, sans alourdir la phrase par un « alors » non indispensable.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule française consacrée et digne pour la formule de messager prophétique; le nom divin est translittéré selon la donnée théologique fournie.
- source_word: הִנְנִי מְמַלֵּא
  choice: Me voici, je vais remplir
  rationale: « Me voici » conserve l’insistance de הִנְנִי sur l’intervention personnelle de Dieu; « je vais » rend la valeur imminente du participe dans ce contexte.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: tous les habitants de ce pays
  rationale: « Pays » désigne naturellement ici le territoire de Juda plutôt que la terre entière.
- source_word: הַמְּלָכִים הַיֹּשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: les rois qui siègent sur le trône de David
  rationale: Cette formulation française naturelle exprime la succession dynastique; la tournure hébraïque inhabituelle avec לְדָוִד est signalée en note.
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: les prêtres, les prophètes
  rationale: Traduction directe des deux fonctions religieuses, sans préciser si les prophètes sont fidèles ou infidèles.
- source_word: שִׁכָּרוֹן
  choice: ivresse
  rationale: Le terme concret préserve l’image des récipients à vin dans le contexte et la force de la métaphore du jugement, au lieu de la réduire à « confusion » ou « stupeur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération garde le nom d’alliance présent dans le texte hébreu et suit l’orientation fournie, sans le remplacer par un titre.
- issue: Portée de שִׁכָּרוֹן
  choice: Conserver l’image concrète de l’ivresse
  alternative: stupeur; confusion
  rationale: Le contexte présente l’ivresse comme une image du désarroi et du jugement imposés par Dieu. La traduction ne résout pas la métaphore dans un effet abstrait.
- issue: Sens dynastique de לְדָוִד עַל כִּסְאוֹ
  choice: sur le trône de David, avec note
  alternative: qui siègent pour David sur son trône
  rationale: Le texte principal reste naturel en français, tandis que la note conserve l’étrangeté de la construction hébraïque et sa nuance de succession représentative.
translation_notes:
  register: Français international actuel, digne et accessible. La formule prophétique garde une certaine solennité; la syntaxe demeure fluide. Les deux appels de note [a] et [b] figurent dans le texte principal.
