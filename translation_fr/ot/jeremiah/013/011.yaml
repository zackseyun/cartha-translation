source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ יִדְבַּ֨ק הָ/אֵז֜וֹר אֶל מָתְנֵי אִ֗ישׁ כֵּ֣ן הִדְבַּ֣קְתִּי אֵ֠לַ/י אֶת כָּל בֵּ֨ית יִשְׂרָאֵ֜ל וְ/אֶת כָּל בֵּ֤ית יְהוּדָה֙ נְאֻם יְהוָ֔ה לִֽ/הְי֥וֹת לִ/י֙ לְ/עָ֔ם וּ/לְ/שֵׁ֥ם וְ/לִ/תְהִלָּ֖ה וּ/לְ/תִפְאָ֑רֶת וְ/לֹ֖א שָׁמֵֽעוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/011.yaml
  text: For as the waistband clings to a man's waist[a], so I made the whole house of Israel and the whole house of Judah cling to me, declares Yahweh, to be for me a people, a name, a praise, and a glory[c][b], but they did not listen.
translation:
  language: fr
  text: Car, de même que la ceinture[a] s’attache à la taille d’un homme[b], de même j’ai attaché à moi toute la maison d’Israël et toute la maison de Juda — déclaration de Yahweh — afin qu’elles soient pour moi un peuple, un nom[c], une louange et une gloire. Mais elles n’ont pas écouté[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ceinturon », « écharpe » ou, peut-être, « pagne » : il s’agit d’une pièce portée autour de la taille ou des reins.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici le singulier masculin dans une comparaison représentative.
    reason: cultural_note
  - marker: c
    text: Ici, « un nom » peut évoquer la renommée ou la réputation.
    reason: lexical_alternative
  - marker: d
    text: '« N’ont pas écouté » peut aussi impliquer : « n’ont pas obéi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵזוֹר
  choice: la ceinture
  rationale: Le terme désigne ici une pièce portée autour de la taille ou des reins. « Ceinture » conserve clairement l’image concrète sans préciser indûment la forme exacte du vêtement.
- source_word: יִדְבַּק / הִדְבַּקְתִּי
  choice: s’attache / j’avais attaché
  rationale: Le même champ lexical est maintenu dans les deux propositions. « S’attacher » exprime à la fois le contact étroit de la ceinture et, dans la métaphore, l’attachement relationnel voulu par Yahweh.
- source_word: מָתְנֵי אִישׁ
  choice: la taille d’un homme
  rationale: « Taille » est naturel en français moderne pour la partie du corps autour de laquelle la pièce est portée; « d’un homme » reflète le singulier masculin אִישׁ.
- source_word: כָּל בֵּית יִשְׂרָאֵל וְאֶת כָּל בֵּית יְהוּדָה
  choice: toute la maison d’Israël et toute la maison de Juda
  rationale: Le maintien de « maison » préserve la dimension collective, familiale et historique de l’hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale solennelle rend le marqueur prophétique נְאֻם et transcrit directement le nom divin.
- source_word: לִהְיוֹת לִי לְעָם
  choice: afin qu’elles soient pour moi un peuple
  rationale: Cette formulation garde l’expression de finalité et la syntaxe d’appartenance de l’hébreu, sans la réduire à la tournure plus habituelle « mon peuple ».
- source_word: לְשֵׁם
  choice: un nom
  rationale: La traduction littérale conserve la série nominale dense du texte; une note signale le sens possible de renommée ou de réputation.
- source_word: לִתְהִלָּה
  choice: un sujet de louange
  rationale: Cette expression restitue naturellement en français l’idée que ce peuple devait susciter la louange, tout en conservant le substantif central.
- source_word: לְתִפְאָרֶת
  choice: une gloire
  rationale: « Gloire » convient au contexte élevé et couvre les nuances de splendeur, d’honneur et de beauté associées au terme.
- source_word: וְלֹא שָׁמֵעוּ
  choice: Mais elles n’ont pas écouté
  rationale: « Écouter » préserve l’ambivalence de שׁמע entre l’audition attentive et l’obéissance. « Mais » marque le contraste entre le dessein de Yahweh et la réaction des deux maisons.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Valeur de l’attachement exprimé par דבק
  choice: maintien d’un verbe concret identique dans la comparaison et son application
  alternative: traduire l’application par « unir » ou « faire adhérer »
  rationale: La répétition lexicale conserve la force de la métaphore sans expliciter davantage sa portée d’alliance.
- issue: Finalité collective de l’élection d’Israël et de Juda
  choice: « afin qu’elles soient pour moi un peuple, un nom, un sujet de louange et une gloire »
  alternative: « afin qu’elles soient mon peuple, ma renommée, ma louange et ma gloire »
  rationale: La formulation retenue suit la construction hébraïque et ne renforce pas artificiellement les possessifs, tout en laissant paraître l’appartenance et la vocation collectives.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition « de même… de même » reproduit la structure comparative. L’incise prophétique est démarquée sans rompre la longue phrase, et la dernière proposition forme une phrase distincte afin de rendre nettement le contraste final.
