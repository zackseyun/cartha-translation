revisions:
- from: Un Koushite peut-il changer la couleur de sa peau[a], ou un léopard ses taches ? Alors, vous aussi, vous pourrez faire le bien, vous qui êtes habitués à faire le mal[b].
  to: Un Koushite peut-il changer sa peau, ou un léopard ses taches ? Vous aussi, vous pouvez faire le bien, vous qui êtes habitués à faire le mal[a].
  rationale: La révision restitue « sa peau » sans l’explicitation ajoutée de « couleur », remplace le futur par le présent modal correspondant à l’hébreu, et conserve la force ironique de l’analogie sans en tirer de conclusion doctrinale élargie. La note sur l’expression hébraïque finale est maintenue et resserrée; l’ancienne note a est supprimée car elle ne répond plus à aucune difficulté de traduction.
