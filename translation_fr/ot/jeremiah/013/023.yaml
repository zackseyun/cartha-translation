review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu dit littéralement qu’un Koushite peut-il « changer/transformer sa peau » et un léopard ses taches. « La couleur de sa peau » explicite correctement l’implication, mais ajoute un élément absent du texte et rend la note a incohérente avec la formulation du corps du texte. La seconde partie exprime ironiquement la capacité à faire le bien de personnes habituées ou entraînées au mal. « Vous pourrez » au futur affaiblit légèrement la modalité présente de תוכלו (« vous pouvez/êtes capables »), même si l’ironie contextuelle demeure.
  naturalness: « Un Koushite », « changer sa peau », « un léopard ses taches » et « habitués à faire le mal » sont naturels en français moderne international. La formulation directe « vous pourrez, vous aussi, faire le bien » est moins fidèle que « vous aussi, vous pouvez faire le bien », qui conserve la question implicite et l’ironie rhétorique.
  terminology: « Koushite » respecte l’ethnonyme hébreu sans anachronisme géographique. « Faire le bien » et « faire le mal » sont idiomatiques et conviennent au registre. « Habitués à faire le mal » restitue sobrement לִמֻּדֵי הָרֵעַ; la note peut signaler l’idée d’apprentissage ou d’accoutumance sans imposer une notion de formation institutionnelle.
  issues:
  - severity: medium
    issue: Ajout de « la couleur de » dans le texte traduit
    rationale: עוֹרוֹ signifie « sa peau », non « la couleur de sa peau ». L’explicitation est interprétative et n’est pas nécessaire en français; de plus, la note a qualifie à tort « sa peau » de littéral alors que le texte principal ne le porte pas.
  - severity: low
    issue: « Vous pourrez » rend le présent modal par un futur
    rationale: תּוּכְלוּ est un imparfait/modal pouvant se rendre naturellement par « vous pouvez ». Dans cette séquence rhétorique, le présent maintient mieux l’analogie ironique sans expliciter davantage la condition implicite.
  - severity: low
    issue: Note a devenue sans objet après restitution de « sa peau »
    rationale: Une fois la traduction alignée sur le sens littéral, aucune note n’est requise pour ce terme. La note pertinente concerne plutôt l’ethnonyme, si l’on souhaite l’expliciter.
  revised_text: Un Koushite peut-il changer sa peau, ou un léopard ses taches ? Vous aussi, vous pouvez faire le bien, vous qui êtes habitués à faire le mal[a].
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « instruits dans le mal » ; l’expression désigne des personnes accoutumées ou entraînées à faire le mal.'
    reason: lexical_alternative
  revision_rationale: La révision restitue « sa peau » sans l’explicitation ajoutée de « couleur », remplace le futur par le présent modal correspondant à l’hébreu, et conserve la force ironique de l’analogie sans en tirer de conclusion doctrinale élargie. La note sur l’expression hébraïque finale est maintenue et resserrée; l’ancienne note a est supprimée car elle ne répond plus à aucune difficulté de traduction.
