source:
  edition: WLC
  text: הֲ/יַהֲפֹ֤ךְ כּוּשִׁי֙ עוֹר֔/וֹ וְ/נָמֵ֖ר חֲבַרְבֻּרֹתָ֑י/ו גַּם אַתֶּם֙ תּוּכְל֣וּ לְ/הֵיטִ֔יב לִמֻּדֵ֖י הָרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/023.yaml
  text: Can a Cushite change his skin[b][a], or a leopard its spots? Then you also can do good—you who are trained in evil.
translation:
  language: fr
  text: Un Koushite peut-il changer sa peau, ou un léopard ses taches ? Vous aussi, vous pouvez faire le bien, vous qui êtes habitués à faire le mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « instruits dans le mal » ; l’expression désigne des personnes accoutumées ou entraînées à faire le mal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: Koushite
  rationale: Conserve directement l’ethnonyme hébreu plutôt que de lui substituer le terme géographique plus tardif « Éthiopien ».
- source_word: הֲיַהֲפֹךְ
  choice: peut-il changer
  rationale: Dans cette question rhétorique, « changer » exprime naturellement l’idée de modifier une caractéristique tenue pour fixe.
- source_word: עוֹרוֹ
  choice: la couleur de sa peau
  rationale: En français, cette formulation rend explicite la caractéristique visuelle impliquée par la comparaison, sans suggérer qu’il s’agirait de remplacer sa peau elle-même.
- source_word: נָמֵר
  choice: léopard
  rationale: Équivalent français courant du nom de l’animal.
- source_word: חֲבַרְבֻּרֹתָיו
  choice: ses taches
  rationale: Désigne naturellement les marques caractéristiques du léopard.
- source_word: גַּם אַתֶּם תּוּכְלוּ
  choice: Alors, vous aussi, vous pourrez
  rationale: 'Préserve l’ironie de l’analogie : ils ne pourront faire le bien que si les transformations impossibles évoquées auparavant peuvent avoir lieu.'
- source_word: לְהֵיטִיב
  choice: faire le bien
  rationale: Formulation française concise et naturelle pour agir de manière bonne ou droite.
- source_word: לִמֻּדֵי הָרֵעַ
  choice: habitués à faire le mal
  rationale: Rend l’idée d’un comportement appris et devenu habituel, sans faire nécessairement penser à une formation organisée.
theological_decisions:
- issue: Incapacité morale exprimée par une analogie rhétorique
  choice: Le verset présente l’habitude profondément enracinée du mal comme une incapacité, au moyen d’une analogie avec des caractéristiques physiques impossibles à changer.
  alternative: Lire le verset soit comme une affirmation universelle d’une incapacité humaine totale en tout domaine, soit comme une simple hyperbole ne disant rien d’une véritable incapacité morale.
  rationale: La traduction garde toute la force de l’analogie dans son contexte immédiat, sans l’élargir en une formulation doctrinale que le verset n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. « Koushite » conserve la référence historique du texte hébreu. La tournure future et conditionnelle implicite de « Alors… vous pourrez » maintient l’ironie de la question rhétorique.
