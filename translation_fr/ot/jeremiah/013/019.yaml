source:
  edition: WLC
  text: עָרֵ֥י הַ/נֶּ֛גֶב סֻגְּר֖וּ וְ/אֵ֣ין פֹּתֵ֑חַ הָגְלָ֧ת יְהוּדָ֛ה כֻּלָּ֖/הּ הָגְלָ֥ת שְׁלוֹמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/019.yaml
  text: The cities of the Negev are shut up[a], with no one to open them; all Judah has been carried away into exile[c][b], wholly carried away into exile.
translation:
  language: fr
  text: Les villes du Néguev[a] sont fermées, sans personne pour les ouvrir ; tout Juda a été déporté, déporté tout entier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les villes du sud ». Le Néguev peut désigner plus précisément la région méridionale de Juda.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Juda a été déporté, tout entier ; il a été déporté complètement. » On pourrait aussi comprendre : « déporté en paix », mais le contexte favorise ici l’idée d’une déportation totale.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי הַנֶּגֶב
  choice: les villes du Néguev
  rationale: נֶגֶב peut désigner le sud en général ou, plus précisément, la région aride située au sud de Juda. « Néguev » conserve ici la valeur géographique sans exclure l’autre possibilité, signalée en note.
- source_word: סֻגְּרוּ
  choice: sont fermées
  rationale: 'Le passif exprime un état résultant : les villes ont été fermées et le restent. Cette formulation française demeure sobre et conserve l’image du texte.'
- source_word: וְאֵין פֹּתֵחַ
  choice: et personne ne les ouvre
  rationale: La tournure hébraïque indique qu’il n’y a personne pour ouvrir les villes. La formulation choisie est naturelle en français et maintient le contraste avec leur fermeture.
- source_word: הָגְלָת
  choice: a été déporté
  rationale: 'La forme hophal de גלה est passive et causative : Juda subit un déplacement forcé. « Être déporté » rend directement cette mise en exil imposée.'
- source_word: יְהוּדָה כֻּלָּהּ
  choice: tout Juda
  rationale: Cette expression rend de façon concise la totalité explicitement marquée par כֻּלָּהּ.
- source_word: הָגְלָת שְׁלוֹמִים
  choice: déporté tout entier
  rationale: Dans ce contexte, שְׁלוֹמִים souligne vraisemblablement le caractère complet de la déportation. La répétition de « déporté » reproduit l’insistance de l’hébreu, tandis que « tout entier » fait écho à כֻּלָּהּ.
theological_decisions:
- issue: Sens de שְׁלוֹמִים dans la formule décrivant l’exil
  choice: 'expression adverbiale de totalité : « tout entier »'
  alternative: « en paix » ou « paisiblement »
  rationale: La répétition du verbe de déportation et le parallèle avec כֻּלָּהּ favorisent une insistance sur la totalité du jugement. Toutefois, puisque שְׁלוֹמִים appartient à la famille lexicale de שׁלום, l’autre compréhension reste réellement possible et est conservée en note.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition « déporté, déporté » est volontaire : elle restitue l’insistance poétique de l’hébreu sans alourdir excessivement la phrase.'
