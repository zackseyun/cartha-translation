reference: Jeremiah 13:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמָע֔וּ/הָ בְּ/מִסְתָּרִ֥ים תִּבְכֶּֽה נַפְשִׁ֖/י מִ/פְּנֵ֣י גֵוָ֑ה וְ/דָמֹ֨עַ תִּדְמַ֜ע וְ/תֵרַ֤ד עֵינִ/י֙ דִּמְעָ֔ה כִּ֥י נִשְׁבָּ֖ה עֵ֥דֶר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/017.yaml
  text: But if you will not listen[a], my soul will weep in secret because of pride; my eyes will weep bitterly and run down with tears[e][d][c][b], because the flock of Yahweh has been taken captive.
translation:
  language: fr
  text: Mais si vous ne l’écoutez pas[a], mon âme pleurera en secret[b] à cause de l’orgueil[c] ; mes yeux pleureront abondamment[d] et laisseront couler des larmes, car le troupeau de Yahweh[e] a été emmené en captivité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « ne lui obéissez pas ». Le verbe hébreu peut signifier entendre, écouter ou obéir.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans des lieux cachés ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « à cause de l’arrogance ». Le contexte peut désigner l’orgueil des destinataires.'
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu renforce le verbe par un infinitif absolu : « elle pleurera, oui, elle pleurera ».'
    reason: lexical_alternative
  - marker: e
    text: Le nom divin יהוה est ici transcrit « Yahweh » ; de nombreuses traductions françaises emploient « le SEIGNEUR » ou « l’Éternel ».
    reason: translation_tradition
lexical_decisions:
- source_word: תִשְׁמָעוּהָ
  choice: vous ne l’écoutez pas
  rationale: Le verbe שׁמע peut exprimer l’écoute aussi bien que l’obéissance. Le pronom féminin singulier est conservé par « l’ » et renvoie naturellement à la parole ou à l’exhortation précédente, sans préciser davantage son antécédent.
- source_word: בְּמִסְתָּרִים
  choice: en secret
  rationale: Le pluriel hébreu signifie littéralement « dans des lieux cachés » ; « en secret » exprime naturellement en français l’idée d’un deuil à l’abri des regards.
- source_word: תִּבְכֶּה נַפְשִׁי
  choice: mon âme pleurera
  rationale: Cette formulation garde נֶפֶשׁ et la profondeur poétique de la douleur intérieure, au lieu de réduire l’expression à « je pleurerai ».
- source_word: מִפְּנֵי גֵוָה
  choice: à cause de l’orgueil
  rationale: La préposition exprime ici naturellement la cause. « Orgueil » rend גֵוָה sans ajouter explicitement un possesseur que l’hébreu ne nomme pas.
- source_word: וְדָמֹעַ תִּדְמַע
  choice: mes yeux pleureront sans relâche
  rationale: L’infinitif absolu associé au verbe conjugué intensifie les pleurs. « Sans relâche » restitue cette insistance dans un français naturel sans imposer la nuance particulière de « amèrement ».
- source_word: וְתֵרַד עֵינִי דִּמְעָה
  choice: et laisseront couler leurs larmes
  rationale: Le singulier poétique « mon œil » est rendu par le pluriel idiomatique français « mes yeux » ; l’image de la larme qui descend est conservée par « couler ».
- source_word: נִשְׁבָּה
  choice: a été emmené en captivité
  rationale: Le niphal de שׁבה indique que le troupeau a été pris et conduit captif. Cette expression garde cette précision sans élargir arbitrairement le sens à tout le concept d’exil.
- source_word: עֵדֶר יְהוָה
  choice: le troupeau de Yahweh
  rationale: Le groupe construit désigne le peuple appartenant à Yahweh sous l’image d’un troupeau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel représenté par le tétragramme, conformément à la couche de consultation fournie.
theological_decisions:
- issue: Référent du suffixe féminin dans תִשְׁמָעוּהָ
  choice: Conserver un pronom féminin singulier renvoyant implicitement à la parole ou à l’exhortation précédente
  alternative: Expliciter « cette parole », « cet avertissement », ou ne pas exprimer l’objet
  rationale: « Vous ne l’écoutez pas » représente le suffixe réellement présent dans le texte hébreu tout en évitant de fixer son antécédent avec une précision absente du verset.
- issue: Voix de la lamentation
  choice: Maintenir la première personne comme lamentation du prophète
  alternative: Présenter explicitement ces pleurs comme ceux de Yahweh exprimés par le prophète
  rationale: La grammaire fait entendre la douleur personnelle du locuteur prophétique, mais la traduction n’empêche pas que la compassion divine résonne à travers lui ; elle préserve ainsi la tension.
- issue: Cause des pleurs exprimée par גֵוָה
  choice: « à cause de l’orgueil », sans possesseur explicite
  alternative: « à cause de votre orgueil » ou « à cause de l’arrogance »
  rationale: Le contexte suggère l’orgueil des destinataires, mais l’hébreu ne porte aucun suffixe possessif. La formulation retenue préserve cette sobriété et l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le rythme en deux mouvements conserve la progression de la douleur intérieure secrète vers les larmes visibles. « Sans relâche » rend l’intensification hébraïque avec dignité, tandis que « emmené en captivité » maintient l’image pastorale et la réalité de la déportation.
