  to: Mais si vous ne l’écoutez pas[a], mon âme pleurera en secret[b] à cause de l’orgueil[c] ; mes yeux pleureront abondamment[d] et laisseront couler des larmes, car le troupeau de Yahweh[e] a été emmené en captivité.
