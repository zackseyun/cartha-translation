source:
  edition: WLC
  text: מַה תֹּֽאמְרִי֙ כִּֽי יִפְקֹ֣ד עָלַ֔יִ/ךְ וְ֠/אַתְּ לִמַּ֨דְתְּ אֹתָ֥/ם עָלַ֛יִ/ךְ אַלֻּפִ֖ים לְ/רֹ֑אשׁ הֲ/ל֤וֹא חֲבָלִים֙ יֹאחֱז֔וּ/ךְ כְּמ֖וֹ אֵ֥שֶׁת לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/021.yaml
  text: What will you say when he appoints over you those whom you yourself taught to be leaders over you? Will not labor pains seize you like a woman giving birth?[a][b]
translation:
  language: fr
  text: Que diras-tu quand il placera à ta tête[a] ceux que toi-même tu as formés comme chefs[b] ? Les douleurs de l’accouchement ne te saisiront-elles pas, comme une femme qui accouche ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand il interviendra contre toi » ou « quand il te punira ». Le verbe hébreu peut signifier s’occuper de quelqu’un, intervenir, visiter, punir ou établir dans une fonction ; ici, la suite du verset favorise l’idée de placer des chefs à la tête de Juda.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes proches ». Le terme hébreu peut désigner des chefs de clan ou des compagnons familiers ; dans ce contexte, il semble évoquer ceux que Juda avait cultivés comme alliés et qui deviennent maintenant ses maîtres.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֹּאמְרִי
  choice: Que diras-tu
  rationale: La question rhétorique s’adresse au féminin singulier à Juda personnifiée. Le futur rend naturellement l’imparfait hébreu dans ce contexte.
- source_word: כִּי יִפְקֹד עָלַיִךְ
  choice: quand il établira au-dessus de toi
  rationale: Le verbe פקד possède un large éventail de sens, mais la mention immédiate de dirigeants placés à la tête de Juda favorise ici le sens d’établir ou de placer en autorité. « Quand » rend la valeur temporelle contextuelle de כִּי.
- source_word: וְאַתְּ לִמַּדְתְּ אֹתָם
  choice: ceux que tu as toi-même formés
  rationale: Le piel de למד signifie enseigner ou former. Le pronom indépendant וְאַתְּ marque une insistance, rendue par « toi-même ».
- source_word: עָלַיִךְ אַלֻּפִים לְרֹאשׁ
  choice: pour être tes dirigeants
  rationale: אַלֻּפִים peut désigner des chefs, des responsables de clan ou des proches. Avec עָלַיִךְ et לְרֹאשׁ, le contexte met en avant leur position d’autorité sur Juda. « Dirigeants » est actuel et suffisamment large.
- source_word: הֲלוֹא
  choice: ne… pas
  rationale: La particule introduit une question rhétorique qui appelle une réponse affirmative.
- source_word: חֲבָלִים
  choice: les douleurs de l’accouchement
  rationale: Même si le nom peut ailleurs désigner des cordes ou des liens, la comparaison explicite avec une femme qui accouche impose ici le sens de douleurs d’enfantement.
- source_word: יֹאחֱזוּךְ
  choice: te saisiront
  rationale: Le verbe אחז exprime l’action de saisir ou d’empoigner et souligne le caractère irrésistible des douleurs.
- source_word: כְּמוֹ אֵשֶׁת לֵדָה
  choice: comme une femme qui accouche
  rationale: Cette formulation française naturelle conserve l’image concrète de la femme en train d’enfanter.
theological_decisions:
- issue: Référent du sujet masculin singulier implicite de יִפְקֹד
  choice: Maintien du pronom implicite sous la forme « il », sans identifier son référent
  alternative: Préciser « le Seigneur », « le roi ennemi » ou une puissance étrangère
  rationale: L’hébreu ne nomme pas le sujet. Il peut évoquer l’action du Seigneur par l’intermédiaire de puissances étrangères ou celle du dominateur lui-même. La traduction préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement féminin singulier reflète l’adresse à Juda personnifiée. La syntaxe a été légèrement réorganisée pour être naturelle en français, tout en conservant l’insistance de « toi-même », la question rhétorique et l’ambiguïté du sujet de יִפְקֹד.
