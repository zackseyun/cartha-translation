id: JER.13.9
reference: Jeremiah 13:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה כָּ֠כָה אַשְׁחִ֞ית אֶת גְּא֧וֹן יְהוּדָ֛ה וְ/אֶת גְּא֥וֹן יְרוּשָׁלִַ֖ם הָ/רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/009.yaml
  text: 'Thus says Yahweh: In this way I will ruin the pride of Judah and the great pride of Jerusalem[a][b].'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « C’est ainsi que je ruinerai[a] l’orgueil[b] de Juda et le grand orgueil de Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je détruirai » ou « j’abîmerai ». Le verbe hébreu peut désigner le fait de gâter, de ruiner ou de détruire ; « ruinerai » rappelle ici la ceinture devenue inutilisable.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « orgueil » peut aussi signifier « arrogance » ou, moins probablement ici, « grandeur » ou « majesté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, à la fois claire, digne et fidèle à la tournure hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription française usuelle du nom divin, qui préserve ici le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כָּכָה
  choice: C’est ainsi que
  rationale: Exprime la manière de l’action annoncée et distingue cette expression de la formule introductive כֹּה אָמַר.
- source_word: אַשְׁחִית
  choice: je ruinerai
  rationale: Le verbe שׁחת au hifil peut exprimer l’idée d’abîmer, de gâter ou de détruire. « Ruiner » convient à l’image de la ceinture rendue inutilisable tout en restant naturel avec « orgueil ».
- source_word: גְּאוֹן
  choice: orgueil
  rationale: Dans ce contexte de jugement, le terme évoque principalement l’orgueil ou l’arrogance, sans exclure entièrement la nuance de grandeur ou de prestige.
- source_word: גְּאוֹן יְרוּשָׁלִַם הָרָב
  choice: le grand orgueil de Jérusalem
  rationale: Conserve la relation de possession, l’intensification portée par הָרָב et le parallélisme avec « l’orgueil de Juda ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Sens de גְּאוֹן dans l’annonce du jugement
  choice: orgueil
  alternative: arrogance ; grandeur
  rationale: Le contexte condamne l’exaltation de Juda et de Jérusalem, ce qui favorise « orgueil », tout en laissant la note signaler la polysémie du terme.
translation_notes:
  register: Français international moderne, avec une cadence prophétique sobre. Les guillemets français délimitent la parole divine. La formulation conserve le parallélisme hébreu sans lourdeur excessive.
