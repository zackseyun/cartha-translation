revisions:
- from: 'Je suis donc allé à Perath[a]. J’ai creusé et repris la ceinture à l’endroit où je l’avais cachée. Or, la ceinture était abîmée[b] : elle n’était plus bonne à rien.'
  to: 'Je suis donc allé à Perath[a]. J’ai creusé et j’ai pris la ceinture[b] à l’endroit où je l’avais cachée. Et voici : la ceinture était détériorée ; elle ne servait plus à rien.'
  rationale: La révision conserve le nom Perath et l’ambiguïté concernant son identification. Elle rend plus littéralement l’action de prendre l’objet, renforce avec mesure la détérioration exprimée par le texte, et replace la note lexicale sur « ceinture », le terme qu’elle documente. « Et voici » restitue le marqueur d’attention hébreu sans archaïsme marqué.
  reviewer_model: gpt-5.6-terra
