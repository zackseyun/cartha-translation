base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/007.yaml
  text: So I went to Perath[a], and dug, and took the waistband from the place where I had hidden it. And behold, the waistband was ruined[b]; it was good for nothing.
translation:
  language: fr
  text: 'Je suis donc allé à Perath[a]. J’ai creusé et j’ai pris la ceinture[b] à l’endroit où je l’avais cachée. Et voici : la ceinture était détériorée ; elle ne servait plus à rien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perath peut désigner l’Euphrate ; l’hébreu porte le nom de lieu « Perath ».
    reason: alternative_reading
  - marker: b
    text: Ou « ceinture de tissu », « pagne » ou « écharpe ». Le terme hébreu désigne un vêtement porté autour de la taille.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָתָה
  choice: à Perath
  rationale: Le texte hébreu donne le nom de lieu Perath avec une terminaison indiquant la direction. La translittération préserve le nom sans imposer son identification possible avec l’Euphrate.
- source_word: אֵזוֹר
  choice: ceinture
  rationale: Le terme désigne un vêtement ou une pièce portée autour de la taille. « Ceinture » est naturel et compréhensible en français, tout en laissant en note les possibilités plus spécifiques.
- source_word: טְמַנְתִּיו
  choice: où je l’avais cachée
  rationale: Le verbe signifie cacher ou dissimuler, parfois en enfouissant. « Cachée » conserve cette amplitude, tandis que « J’ai creusé » indique déjà que l’objet était sous terre.
- source_word: וְהִנֵּה
  choice: Or
  rationale: Dans ce contexte de découverte, « Or » attire l’attention sur l’état inattendu de la ceinture sans recourir à l’archaïsme « voici ».
- source_word: נִשְׁחַת
  choice: était abîmée
  rationale: Le niphal décrit l’objet devenu détérioré ou gâté. « Était abîmée » est clair et naturel; la note signale la nuance plus forte possible « ruinée ».
- source_word: לֹא יִצְלַח לַכֹּל
  choice: elle n’était plus bonne à rien
  rationale: Cette tournure française rend naturellement l’inutilité totale exprimée par l’idiome hébreu. « Plus » explicite l’état résultant constaté après la détérioration.
- source_word: וָאֵלֵךְ ... וָאֶחְפֹּר ... וָאֶקַּח
  choice: Je suis donc allé… J’ai creusé et repris
  rationale: Les formes narratives présentent des actions successives. Le passé composé convient au français narratif moderne, et « repris » rend le retrait de l’objet de sa cachette.
theological_decisions: []
