  text: וַ/אֲפִיצֵ֖/ם כְּ/קַשׁ עוֹבֵ֑ר לְ/ר֖וּחַ מִדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/024.yaml
  text: So I will scatter them like chaff passing away before the desert wind[a].
translation:
  language: fr
  text: Je les disperserai donc comme de la paille emportée par le vent du désert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme du chaume emporté par le vent du désert ».'
    reason: Conserve l’alternative lexicale « chaume » pour קַשׁ, sans imposer à עוֹבֵר et à לְ une formulation française artificielle ou spatialement trompeuse.
lexical_decisions:
- source_word: וַאֲפִיצֵם
  choice: Je les disperserai donc
  rationale: Le hiphil à la première personne du singulier avec suffixe objet de troisième personne du pluriel signifie « je les disperserai ». « Donc » rend naturellement la valeur consécutive du waw dans ce contexte de jugement.
- source_word: כקש
  choice: comme de la paille
  rationale: קַשׁ peut désigner la paille ou le chaume. L’image d’une matière légère emportée par le vent favorise ici « paille », tandis que l’autre possibilité est conservée en note.
- source_word: עובר
  choice: emportée
  rationale: Le participe de עבר signifie littéralement « passant ». Dans cette comparaison, le mouvement de la paille devant le vent est rendu en français naturel par « emportée », sans ajouter une destination absente du texte.
- source_word: לרוח מדבר
  choice: par le vent du désert
  rationale: Dans cette image, ל marque le rapport de la paille au vent qui la pousse. מִדְבָּר désigne un désert ou une région sauvage; « désert » restitue ici clairement le cadre aride.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation principale privilégie une image immédiatement compréhensible, tandis que la note préserve une traduction plus formelle et l’ambiguïté lexicale.
