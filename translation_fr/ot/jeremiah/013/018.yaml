id: JER.13.18
reference: Jeremiah 13:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱמֹ֥ר לַ/מֶּ֛לֶךְ וְ/לַ/גְּבִירָ֖ה הַשְׁפִּ֣ילוּ שֵׁ֑בוּ כִּ֤י יָרַד֙ מַרְאֲשׁ֣וֹתֵי/כֶ֔ם עֲטֶ֖רֶת תִּֽפְאַרְתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/018.yaml
  text: Say to the king and to the queen mother[a], ‘Humble yourselves; sit down[b], for your glorious crown has come down from your heads.’
translation:
  language: fr
  text: 'Dis au roi et à la reine mère[a] : « Abaissez-vous et asseyez-vous, car votre couronne magnifique est descendue de vos têtes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « reine mère » est un titre royal qui peut désigner la mère du roi plutôt que son épouse.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « la couronne de votre splendeur est descendue de vos têtes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Dis
  rationale: Impératif singulier de אמר. « Dis » introduit naturellement et directement le message prophétique.
- source_word: לַמֶּלֶךְ
  choice: au roi
  rationale: Nom défini précédé de la préposition ל ; il désigne le roi régnant.
- source_word: וְלַגְּבִירָה
  choice: et à la reine mère
  rationale: Dans un contexte royal, גְּבִירָה désigne couramment la mère du roi investie d’un rang officiel, plutôt que nécessairement l’épouse du roi.
- source_word: הַשְׁפִּילוּ
  choice: Abaissez-vous
  rationale: L’impératif hiphil pluriel de שׁפל évoque à la fois l’abaissement concret et la perte de rang. « Abaissez-vous » conserve ces deux dimensions.
- source_word: שֵׁבוּ
  choice: asseyez-vous
  rationale: Impératif pluriel de ישׁב. Cette formulation française naturelle garde l’image d’une descente depuis une position élevée.
- source_word: כִּי
  choice: car
  rationale: Introduit le motif des deux impératifs et conserve la relation explicative du texte hébreu.
- source_word: יָרַד
  choice: est descendue
  rationale: Le qal accompli de ירד signifie « descendre ». Ce choix préserve l’image sans préciser si la couronne est tombée ou a été retirée.
- source_word: מַרְאֲשׁוֹתֵיכֶם
  choice: de vos têtes
  rationale: Le terme peut désigner l’endroit situé à la tête ou un chevet, mais, associé à une couronne, il renvoie ici naturellement aux têtes sur lesquelles elle reposait.
- source_word: עֲטֶרֶת תִּפְאַרְתְּכֶם
  choice: votre couronne magnifique
  rationale: La construction signifie littéralement « la couronne de votre splendeur ». « Votre couronne magnifique » restitue avec naturel l’objet royal et sa splendeur, tandis qu’une note conserve la structure littérale.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs pluriels s’adressent ensemble au roi et à la reine mère. L’image de la descente de la couronne est conservée sans expliciter davantage la nature du jugement.
