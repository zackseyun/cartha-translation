  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כָּל נֵ֖בֶל יִמָּ֣לֵא יָ֑יִן וְ/אָמְר֣וּ אֵלֶ֔י/ךָ הֲ/יָדֹ֨עַ֙ לֹ֣א נֵדַ֔ע כִּ֥י כָל נֵ֖בֶל יִמָּ֥לֵא יָֽיִן־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/012.yaml
  text: 'So you shall say to them this word: Thus says the LORD, the God of Israel, ‘Every jar will be filled with wine.’ And they will say to you, ‘Do we not certainly know that every jar will be filled with wine?’'
translation:
  language: fr
  text: 'Tu leur diras cette parole : Ainsi parle le SEIGNEUR, le Dieu d’Israël : « Toute jarre sera remplie de vin. » Ils te répondront : « Ne savons-nous pas très bien que toute jarre sera remplie de vin ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, en petites capitales textuellement représentées ici par des majuscules.
- source_word: נֵבֶל
  choice: jarre
  rationale: Désigne ici un récipient destiné notamment au vin ; « jarre » est naturel et précis dans ce contexte.
- source_word: יִמָּלֵא
  choice: sera remplie
  rationale: Conserve la forme passive et la valeur future de l’imparfait hébreu dans cette déclaration prophétique.
- source_word: הֲיָדֹעַ לֹא נֵדַע
  choice: Ne savons-nous pas très bien
  rationale: Reproduit la question rhétorique et l’intensification produite par l’infinitif absolu associé au verbe.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit une convention biblique française transparente et non confessionnelle sans introduire dans le corps du verset une vocalisation discutée.
- issue: Force de la réponse des interlocuteurs
  choice: question rhétorique exprimant une connaissance évidente
  alternative: « Ne savons-nous pas certainement… ? »
  rationale: L’hébreu intensifie « savoir » ; « très bien » exprime naturellement en français leur réaction presque dédaigneuse sans surinterpréter.
translation_notes:
  register: Français moderne, courant et digne. La répétition exacte de « toute jarre sera remplie de vin » est conservée pour maintenir l’effet rhétorique de l’hébreu.
