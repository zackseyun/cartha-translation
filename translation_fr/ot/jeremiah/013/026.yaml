  text: וְ/גַם אֲנִ֛י חָשַׂ֥פְתִּי שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/נִרְאָ֖ה קְלוֹנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/026.yaml
  text: So I myself have also lifted up your skirts over your face[c][b][a], and your shame has been seen.
translation:
  language: fr
  text: Moi aussi, je relèverai les pans de ton vêtement jusque sur ton visage[a], et l’on verra ta honte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai découvert les pans de ton vêtement sur ton visage ». Le parfait hébreu peut présenter le jugement annoncé comme déjà accompli, soulignant ainsi sa certitude ; le futur français exprime ici l''annonce du jugement.'
    reason: lexical_and_tense_note
  - marker: b
    text: Cette exposition forcée est une image prophétique d’humiliation publique sous le jugement.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Moi aussi
  rationale: L’expression maintient la valeur additive de וְגַם et l’accent porté par le pronom explicite אֲנִי, tout en restant naturelle en français.
- source_word: חָשַׂפְתִּי
  choice: je relèverai
  rationale: Le verbe signifie découvrir ou exposer. Avec les pans d’un vêtement, « relever » rend naturellement l’image concrète. Le parfait prophétique hébreu présente le jugement futur comme certain; le futur convient ici au contexte français.
- source_word: שׁוּלַיִךְ
  choice: les pans de ton vêtement
  rationale: Le nom désigne les bords inférieurs ou les pans d’un habit. Cette formulation conserve l’image sans imposer un type précis de vêtement.
- source_word: עַל פָּנָיִךְ
  choice: jusque sur ton visage
  rationale: La préposition exprime ici la position du vêtement ramené sur le visage; « jusque sur » rend clairement le mouvement implicite et son résultat.
- source_word: וְנִרְאָה
  choice: et l’on verra
  rationale: Le niphal exprime le fait de devenir visible ou d’être vu. La tournure impersonnelle française garde le sens passif sans lourdeur.
- source_word: קְלוֹנֵךְ
  choice: ta honte
  rationale: Le terme désigne la honte ou l’ignominie publiquement exposée; « honte » conserve à la fois les dimensions sociale et personnelle.
theological_decisions:
- issue: Image d’exposition publique dans le jugement divin
  choice: Conserver l’image concrète des pans du vêtement relevés et de la honte rendue visible
  alternative: Atténuer l’image en parlant seulement de déshonneur public
  rationale: L’hébreu emploie volontairement une image brutale d’exposition forcée pour représenter l’humiliation de Jérusalem sous le jugement. L’atténuer affaiblirait la force de l’oracle.
- issue: Valeur temporelle du parfait prophétique
  choice: Employer le futur français
  alternative: 'Employer le passé composé: « j’ai relevé… on a vu »'
  rationale: La forme accomplie hébraïque souligne la certitude du jugement annoncé. Dans ce contexte prophétique, le futur communique plus clairement en français que l’action est annoncée comme certaine, sans nier l’aspect rhétoriquement accompli de l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. L’image corporelle demeure explicite sans être amplifiée. Le tutoiement féminin est conservé, car le discours s’adresse à Jérusalem personnifiée.
