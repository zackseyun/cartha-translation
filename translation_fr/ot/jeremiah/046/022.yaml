  text: קוֹלָ֖/הּ כַּ/נָּחָ֣שׁ יֵלֵ֑ךְ כִּֽי בְ/חַ֣יִל יֵלֵ֔כוּ וּ/בְ/קַרְדֻּמּוֹת֙ בָּ֣אוּ לָ֔/הּ כְּ/חֹטְבֵ֖י עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/022.yaml
  text: Her sound goes like a serpent[a], for they go with an army and come against her with axes[c][b], like woodcutters.
translation:
  language: fr
  text: Sa voix[a] s’en va comme un serpent, car ils avancent en force[b] et viennent contre elle[c] avec des haches, tels des bûcherons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Son son » ou « Son bruit » ; le nom hébreu peut signifier « voix », « son » ou « bruit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec une armée » ; le mot hébreu peut désigner une force militaire, la force ou une armée.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « viennent vers elle » ; dans ce contexte, leur venue est hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלָהּ
  choice: sa voix
  rationale: קוֹל peut désigner une voix, un son ou un bruit. « Sa voix » conserve la personnification féminine de l’Égypte et reste naturelle en français, sans imposer qu’il s’agisse de paroles articulées.
- source_word: כַּנָּחָשׁ
  choice: comme celle du serpent
  rationale: נָחָשׁ signifie « serpent ». La reprise « celle du serpent » établit clairement que la comparaison porte sur la voix ou le son.
- source_word: יֵלֵךְ
  choice: s’en va
  rationale: הלך signifie fondamentalement « aller ». Avec « voix » pour sujet, « s’en va » préserve le mouvement inhabituel de l’image hébraïque sans ajouter une manière précise telle que « glisser » ou « siffler ».
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici l’explication de l’image précédente ; « car » maintient ce lien causal de façon concise.
- source_word: בְחַיִל
  choice: en force
  rationale: חַיִל peut désigner la force ou une armée. « En force » convient au contexte militaire tout en préservant cette amplitude lexicale.
- source_word: יֵלֵכוּ
  choice: ils avancent
  rationale: הלך signifie « aller » ; dans le contexte d’une troupe hostile, « avancent » est naturel sans préciser indûment qu’elle marche au pas.
- source_word: וּבְקַרְדֻּמּוֹת
  choice: avec des haches
  rationale: קַרְדֹּם désigne une hache. La préposition בְּ a ici une valeur instrumentale.
- source_word: בָּאוּ לָהּ
  choice: viennent contre elle
  rationale: L’expression signifie littéralement « viennent vers elle », mais le contexte d’invasion rend manifeste son orientation hostile ; « contre elle » l’exprime naturellement.
- source_word: כְּחֹטְבֵי עֵצִים
  choice: tels des bûcherons
  rationale: L’expression désigne littéralement des coupeurs de bois ou d’arbres. « Bûcherons » est l’équivalent français courant et conserve l’image de l’abattage.
