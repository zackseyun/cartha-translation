  naturalness: « Sa voix s’en va comme un serpent » garde volontairement l’étrangeté imagée de l’hébreu tout en restant recevable dans un registre prophétique moderne. « Ils avancent en force » et « viennent contre elle avec des haches, tels des bûcherons » sont naturels et clairs.
