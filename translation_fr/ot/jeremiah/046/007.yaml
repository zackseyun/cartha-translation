  text: מִי זֶ֖ה כַּ/יְאֹ֣ר יַֽעֲלֶ֑ה כַּ/נְּהָר֕וֹת יִֽתְגָּעֲשׁ֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/007.yaml
  text: Who is this[a], rising like the Nile[b], like rivers whose waters surge?
translation:
  language: fr
  text: Qui est celui-ci, qui monte comme le Nil[a], comme les fleuves dont les eaux se soulèvent[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner un fleuve, mais, dans ce contexte égyptien, il renvoie très probablement au Nil.
    reason: lexical_alternative
  - marker: b
    text: Ou « bouillonnent », « s’agitent avec fracas » ou « grondent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Qui est celui-ci
  rationale: La tournure interrogative suivie du démonstratif introduit avec vivacité celui qui sera identifié dans la suite. « Qui est celui-ci » conserve cette force rhétorique et la référence masculine suggérée par le contexte.
- source_word: כַּיְאֹר
  choice: comme le Nil
  rationale: Dans cet oracle concernant l’Égypte, יְאֹר désigne naturellement le Nil plutôt qu’un cours d’eau indéterminé.
- source_word: יַעֲלֶה
  choice: qui monte
  rationale: Le verbe עלה exprime ici la montée des eaux. Le présent français rend naturellement la scène poétique sans transformer la forme verbale en participe détaché.
- source_word: כַּנְּהָרוֹת
  choice: comme les fleuves
  rationale: Le pluriel נְהָרוֹת est conservé. L’article défini donne en français une comparaison générique naturelle avec les fleuves en crue.
- source_word: יִתְגָּעֲשׁוּ
  choice: bouillonnent
  rationale: Le hitpael de געש évoque des eaux agitées, tumultueuses, qui se soulèvent. « Bouillonnent » rend clairement ce mouvement en français poétique courant, sans exclure la nuance de grondement.
- source_word: מֵימָיו
  choice: dont les eaux
  rationale: Littéralement « ses eaux ». « Dont les eaux » rattache naturellement le pronom aux fleuves et préserve l’image collective.
