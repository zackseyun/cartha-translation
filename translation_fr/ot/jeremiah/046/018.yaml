source:
  edition: WLC
  text: חַי אָ֨נִי֙ נְאֻם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ כִּ֚י כְּ/תָב֣וֹר בֶּֽ/הָרִ֔ים וּ/כְ/כַרְמֶ֖ל בַּ/יָּ֥ם יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/018.yaml
  text: As I live[a], declares the King, whose name is Yahweh of Armies, surely as Tabor among the mountains and as Carmel by the sea[b], so he will come.
translation:
  language: fr
  text: « Aussi vrai que je suis vivant, déclare le Roi, dont le nom est Yahvé des armées[a], aussi sûrement que le Tabor parmi les montagnes et le Carmel au bord de la mer, il viendra[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Yahvé, le Maître des armées ». Traduction traditionnelle : « le SEIGNEUR des armées ».'
    reason: lexical_alternative
  - marker: b
    text: Le sujet de « viendra » n’est pas exprimé en hébreu ; le contexte renvoie au conquérant annoncé dans les versets voisins.
    reason: cross_reference
lexical_decisions:
- source_word: חַי אָ֨נִי
  choice: Aussi vrai que je suis vivant
  rationale: Cette tournure française naturelle rend la formule hébraïque de serment par laquelle Dieu garantit solennellement sa déclaration par sa propre vie.
- source_word: נְאֻם
  choice: déclare
  rationale: Rend clairement et sobrement la formule prophétique qui introduit une déclaration divine.
- source_word: הַמֶּלֶךְ
  choice: le Roi
  rationale: Le titre défini désigne ici Dieu et conserve sa portée royale.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: « Yahvé » représente directement le nom divin, tandis que « des armées » conserve la dimension militaire de צְבָאוֹת sans la diluer dans une expression abstraite.
- source_word: שְׁמוֹ
  choice: lui qui a pour nom
  rationale: Construction française fluide qui maintient l’identification explicite du Roi par son nom.
- source_word: כִּי
  choice: oui
  rationale: Dans ce serment, כִּי a une valeur affirmative et emphatique plutôt que causale ; « oui » introduit naturellement le contenu garanti.
- source_word: כְּתָבוֹר בֶּהָרִים
  choice: tel le Tabor parmi les montagnes
  rationale: La comparaison et la position remarquable du Tabor dans le paysage montagneux sont conservées.
- source_word: וּכְכַרְמֶל בַּיָּם
  choice: et tel le Carmel au bord de la mer
  rationale: Rend la seconde comparaison et la situation géographique du mont Carmel près de la Méditerranée.
- source_word: יָבֹוא
  choice: il viendra
  rationale: Le verbe hébreu est au masculin singulier, mais son sujet reste implicite. Le pronom français permet une phrase naturelle sans identifier davantage le conquérant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte donne le nom divin lui-même ; « Yahvé » le représente directement sans substituer un titre.
- issue: Sens de צְבָאוֹת
  choice: des armées
  alternative: des armées célestes / de l’univers
  rationale: « Des armées » préserve la force martiale et la relative ouverture du terme, qui peut englober les puissances placées sous le commandement divin.
- issue: Sujet implicite de יָבֹוא
  choice: il viendra, avec une note explicative
  alternative: un homme viendra / le conquérant viendra
  rationale: Le masculin singulier est conservé, mais le texte français ne précise pas une identité que ce verset ne nomme pas explicitement ; le contexte indique le conquérant annoncé.
translation_notes:
  register: Français international moderne, solennel et accessible. La structure comparative inhabituelle du texte hébreu est maintenue afin de ne pas expliciter indûment le rapport entre la venue du conquérant, le Tabor et le Carmel.
