revisions:
- from: Mais toi, mon serviteur Jacob, n’aie pas peur — déclaration de Yahweh —, car je suis avec toi. En effet, j’exterminerai toutes les nations où je t’ai chassé, mais toi, je ne t’exterminerai pas[a]. Je te corrigerai avec justice, mais je ne te laisserai certainement pas impuni[b].
  to: Mais toi, Jacob, mon serviteur, n’aie pas peur — déclaration de Yahweh —, car je suis avec toi. Car je détruirai complètement toutes les nations parmi lesquelles je t’ai chassé, mais je ne te détruirai pas complètement[a]. Je te corrigerai selon le droit, mais je ne te laisserai certainement pas impuni[b].
  rationale: La révision corrige la relation spatiale/distributive avec les nations (« parmi lesquelles »), rend de façon plus transparente la répétition de כָלָה dans les deux membres, et ajuste « avec justice » en « selon le droit » pour mieux conserver la coloration juridique de לַמִּשְׁפָּט. Le sens de discipline juste et de non-impunité demeure intact.
