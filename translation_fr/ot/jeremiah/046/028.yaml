  text: אַ֠תָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ נְאֻם יְהוָ֔ה כִּ֥י אִתְּ/ךָ֖ אָ֑נִי כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הִדַּחְתִּ֣י/ךָ שָׁ֗מָּ/ה וְ/אֹֽתְ/ךָ֙ לֹא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/028.yaml
  text: But you[a], do not fear, my servant Jacob, declares Yahweh, for I am with you. For I will make a full end of all the nations where I have driven you, but of you I will not make a full end. Yet I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: fr
  text: Mais toi, Jacob, mon serviteur, n’aie pas peur — déclaration de Yahweh —, car je suis avec toi. Car je détruirai complètement toutes les nations parmi lesquelles je t’ai chassé, mais je ne te détruirai pas complètement[a]. Je te corrigerai selon le droit, mais je ne te laisserai certainement pas impuni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « je ne ferai pas de toi une destruction complète ». L’hébreu répète la même expression pour opposer le sort des nations à celui de Jacob.
    reason: lexical_alternative
  - marker: b
    text: Ou « je ne te tiendrai certainement pas pour innocent » ou « je ne t’acquitterai certainement pas ». Le verbe hébreu peut aussi avoir une nuance judiciaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: n’aie pas peur
  rationale: Formulation directe, naturelle en français moderne, qui conserve la valeur prohibitive et le ton rassurant.
- source_word: עַבְדִּי יַעֲקֹב
  choice: mon serviteur Jacob
  rationale: Conserve à la fois le titre d’alliance « mon serviteur » et le nom collectif et personnel « Jacob ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique solennelle sans la réduire à un simple verbe de parole et conserve le nom divin.
- source_word: כִּי אִתְּךָ אָנִי
  choice: car je suis avec toi
  rationale: Équivalent français naturel de la formule d’assurance fondée sur la présence divine.
- source_word: אֶעֱשֶׂה כָלָה
  choice: j’exterminerai
  rationale: Dans cette construction, l’expression désigne une destruction complète. Le même verbe est répété dans les deux membres afin de préserver leur contraste rhétorique.
- source_word: אֲשֶׁר הִדַּחְתִּיךָ שָׁמָּה
  choice: où je t’ai chassé
  rationale: Le hiphil de נדח exprime ici l’action de repousser ou d’envoyer de force en exil; « chassé » reste direct sans ajouter l’idée distincte de dispersion.
- source_word: וְיִסַּרְתִּיךָ לַמִּשְׁפָּט
  choice: Je te corrigerai avec justice
  rationale: « Corriger » garde la dimension disciplinaire de יסר, tandis que « avec justice » exprime une intervention conforme au droit plutôt qu’arbitraire.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: je ne te laisserai certainement pas impuni
  rationale: L’infinitif absolu suivi du verbe intensifie la négation. Cette formulation transmet le sens contextuel sans effacer la possibilité d’une nuance judiciaire.
theological_decisions:
- issue: Jugement de Jacob par contraste avec celui des nations
  choice: Yahweh promet de ne pas exterminer Jacob, tout en affirmant qu’il le corrigera justement et ne le soustraira pas aux conséquences de sa faute.
  alternative: Comprendre que Jacob ne subira aucune forme de jugement, ou que sa correction équivaut à son extermination.
  rationale: 'Le texte maintient ensemble préservation et jugement : Jacob échappe à l’anéantissement promis aux nations, mais non à la discipline divine.'
- issue: Portée de נקה dans la conclusion
  choice: Rendre le sens contextuel par « laisser impuni », tout en signalant en note la nuance judiciaire « tenir pour innocent » ou « acquitter ».
  alternative: Traduire directement « je ne t’acquitterai certainement pas ».
  rationale: La formulation retenue est claire en français courant, tandis que la note préserve l’ambiguïté lexicale et la tension judiciaire du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe au personnage collectif Jacob. La répétition de « exterminer » conserve le contraste du texte hébreu; les notes rendent les formulations littérales et la nuance judiciaire sans alourdir le verset.
