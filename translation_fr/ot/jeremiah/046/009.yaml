  text: עֲל֤וּ הַ/סּוּסִים֙ וְ/הִתְהֹלְל֣וּ הָ/רֶ֔כֶב וְ/יֵצְא֖וּ הַ/גִּבּוֹרִ֑ים כּ֤וּשׁ וּ/פוּט֙ תֹּפְשֵׂ֣י מָגֵ֔ן וְ/לוּדִ֕ים תֹּפְשֵׂ֖י דֹּ֥רְכֵי קָֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/009.yaml
  text: Go up, O horses, and rage, O chariots; let the warriors go out—Cush and Put, who grasp the shield, and the Ludim, who grasp and bend the bow.
translation:
  language: fr
  text: 'Montez, chevaux ! Déchaînez-vous, chars ! Que les guerriers sortent : Koush et Pouth, qui saisissent le bouclier, et les Loudim, qui saisissent et bandent l’arc.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלוּ הַסּוּסִים
  choice: Montez, chevaux !
  rationale: Conserve l’impératif et l’image hébraïque de la montée ou de l’assaut, sans expliciter davantage le mouvement.
- source_word: וְהִתְהֹלְלוּ הָרֶכֶב
  choice: Lancez-vous avec furie, chars !
  rationale: Le verbe exprime ici un mouvement déchaîné ou frénétique. Cette formulation française naturelle garde la violence de l’image tout en s’adressant directement aux chars.
- source_word: וְיֵצְאוּ הַגִּבּוֹרִים
  choice: Que les guerriers se mettent en marche
  rationale: Le sens littéral est « que les guerriers sortent » ; dans ce contexte militaire, « se mettent en marche » communique naturellement leur départ au combat.
- source_word: כּוּשׁ וּפוּט
  choice: Koush et Pouth
  rationale: Translittération française moderne des noms de peuples, sans les identifier de manière conjecturale à des États contemporains.
- source_word: וְלוּדִים
  choice: les Loudiens
  rationale: Rend l’ethnonyme hébreu sous une forme française transparente, sans trancher l’identification historique du peuple.
- source_word: תֹּפְשֵׂי דֹּרְכֵי קָשֶׁת
  choice: qui saisissent et bandent l’arc
  rationale: 'Reproduit les deux actions du texte : prendre fermement l’arc et le tendre en vue du combat.'
