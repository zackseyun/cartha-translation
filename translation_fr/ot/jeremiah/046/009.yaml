review_pass:
  verdict: revise
  source_fidelity: 'La première injonction est bien rendue. « Que les guerriers se mettent en marche » interprète toutefois « qu’ils sortent » et peut évoquer une mobilisation plutôt que leur sortie au combat. L’ethnonyme לוּדִים ne permet pas d’affirmer une identification historique : « Loudiens » le transforme en gentilé français et risque de le rapprocher indûment d’un peuple identifié. Une translittération est préférable. Le rendu des combattants maniant/bandant l’arc conserve correctement les deux éléments verbaux.'
  naturalness: Le rythme martial et les apostrophes sont naturels. « Déchaînez-vous, chars ! » rend plus idiomatiquement la violence frénétique du verbe adressé aux chars que « Lancez-vous avec furie ».
  terminology: « Koush » et « Pouth » sont des translittérations cohérentes. « Loudim » préserve l’ethnonyme hébreu et son incertitude historique, sans imposer « Lydiens » ni une autre identification. « Bouclier » et « arc » sont exacts.
  issues:
  - severity: medium
    issue: « se mettent en marche » remplace « sortent »
    rationale: וְיֵצְאוּ signifie littéralement « qu’ils sortent ». Dans le contexte, la sortie est militaire, mais « se mettre en marche » ajoute une nuance de départ/mobilisation qui n’est pas exprimée.
  - severity: medium
    issue: « Loudiens » interprète l’ethnonyme
    rationale: לוּדִים est un nom de peuple à l’identification discutée. Le gentilé français « Loudiens » n’est pas une simple translittération et peut suggérer une identification historique indue.
  - severity: low
    issue: Formulation des chars perfectible
    rationale: « Lancez-vous avec furie » est compréhensible, mais « Déchaînez-vous » est plus direct et reproduit mieux le caractère débridé du verbe hébreu dans une apostrophe poétique.
