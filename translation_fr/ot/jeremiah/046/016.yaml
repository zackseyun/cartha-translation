revisions:
- from: 'Il en a fait trébucher beaucoup ; chacun est même tombé sur son compagnon. Ils se disent : « Debout ! Retournons vers notre peuple, au pays où nous sommes nés, loin de l’épée de l’oppresseur[a]. »'
  to: 'Il a multiplié les chancelants ; chacun tombe même contre son compagnon. Ils disent : « Levez-vous ! Retournons vers notre peuple et vers le pays où nous sommes nés, loin de l’épée de l’oppresseur[a]. »'
  rationale: La révision resserre le rendu sur la syntaxe et l’imagerie hébraïques sans sacrifier un français international naturel. Elle conserve l’interprétation contextuelle « l’oppresseur » tout en ancrant clairement en note la lecture littérale disputée.
