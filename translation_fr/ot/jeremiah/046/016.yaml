  text: הִרְבָּ֖ה כּוֹשֵׁ֑ל גַּם נָפַ֞ל אִ֣ישׁ אֶל רֵעֵ֗/הוּ וַ/יֹּֽאמְרוּ֙ ק֣וּמָ/ה וְ/נָשֻׁ֣בָה אֶל עַמֵּ֗/נוּ וְ/אֶל אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/נוּ מִ/פְּנֵ֖י חֶ֥רֶב הַ/יּוֹנָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/016.yaml
  text: He has multiplied the stumbling; indeed[a], each man falls against his companion, and they say, “Come, and let us return to our people and to the land of our birth, away from the sword of the oppressor.”
translation:
  language: fr
  text: 'Il a multiplié les chancelants ; chacun tombe même contre son compagnon. Ils disent : « Levez-vous ! Retournons vers notre peuple et vers le pays où nous sommes nés, loin de l’épée de l’oppresseur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épée de la colombe ». Le mot hébreu peut se lire littéralement ainsi, mais, dans ce contexte, il est généralement compris au sens de « l’oppresseur » ou de « le violent ».
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְבָּה כּוֹשֵׁל
  choice: Il en a fait trébucher beaucoup
  rationale: Le hiphil de רבה exprime ici l’accroissement ou la multiplication, tandis que כּוֹשֵׁל désigne celui qui trébuche. Cette formulation française rend naturellement l’idée causative dans le contexte de la déroute, avec Dieu comme sujet implicite hérité du contexte.
- source_word: גַּם נָפַל אִישׁ אֶל רֵעֵהוּ
  choice: chacun est même tombé sur son compagnon
  rationale: גַּם a une valeur intensive, rendue par « même ». Le singulier distributif אִישׁ devient « chacun », et אֶל רֵעֵהוּ conserve l’image de combattants qui s’effondrent les uns contre les autres.
- source_word: קוּמָה וְנָשֻׁבָה
  choice: Debout ! Retournons
  rationale: L’impératif קוּמָה lance l’appel au départ et le cohortatif וְנָשֻׁבָה exprime une résolution collective. « Debout ! Retournons » garde à la fois la vigueur et la direction du mouvement.
- source_word: אֶל עַמֵּנוּ
  choice: vers notre peuple
  rationale: עַם désigne ici le peuple d’appartenance des soldats étrangers qui veulent rentrer chez eux.
- source_word: וְאֶל אֶרֶץ מוֹלַדְתֵּנוּ
  choice: au pays où nous sommes nés
  rationale: Cette tournure moderne et naturelle rend explicitement le sens de la « terre de notre naissance » sans perdre la référence à la patrie d’origine.
- source_word: מִפְּנֵי חֶרֶב
  choice: loin de l’épée
  rationale: מִפְּנֵי indique qu’ils fuient la présence menaçante de l’épée ; « loin de » exprime en français le mouvement d’éloignement et son motif.
- source_word: הַיּוֹנָה
  choice: l’oppresseur
  rationale: Dans ce contexte militaire, le terme est compris à partir du sens d’opprimer ou de maltraiter. La lecture littérale possible « colombe » est conservée en note.
theological_decisions:
- issue: Sens de הַיּוֹנָה dans l’expression finale
  choice: l’oppresseur
  alternative: la colombe
  rationale: « L’épée de l’oppresseur » convient au contexte de bataille et de fuite. La forme hébraïque peut toutefois se lire littéralement « la colombe » ; cette ambiguïté textuelle et lexicale est signalée au lieu d’être effacée.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme bref restitue la panique de la déroute. « Compagnon » conserve la relation exprimée par רֵעֵהוּ, tandis que « au pays où nous sommes nés » évite une tournure artificielle.
