revisions:
- from: 'Annoncez-le en Égypte et faites-le entendre à Migdol ; faites-le entendre à Noph[a] et à Tahpanès. Dites : « Prends position et prépare-toi, car l’épée a dévoré tout autour de toi. »'
  to: 'Annoncez-le en Égypte et faites-le entendre à Migdol ; faites-le entendre à Noph[a] et à Tahpanès. Dites : « Prends position et prépare-toi, car l’épée a dévoré ce qui t’entoure. »'
  rationale: 'La révision limitée de la dernière proposition rétablit en français la fonction syntaxique de l’expression hébraïque : l’épée dévore les alentours du destinataire. « Ce qui t’entoure » ne tranche pas indûment si ces alentours sont compris comme des personnes, des forces ou des lieux.'
