source:
  edition: WLC
  text: הַגִּ֤ידוּ בְ/מִצְרַ֨יִם֙ וְ/הַשְׁמִ֣יעוּ בְ/מִגְדּ֔וֹל וְ/הַשְׁמִ֥יעוּ בְ/נֹ֖ף וּ/בְ/תַחְפַּנְחֵ֑ס אִמְר֗וּ הִתְיַצֵּב֙ וְ/הָכֵ֣ן לָ֔/ךְ כִּֽי אָכְלָ֥ה חֶ֖רֶב סְבִיבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/014.yaml
  text: Declare it in Egypt[a], and proclaim it in Migdol; proclaim it in Noph and in Tahpanhes. Say, ‘Take your stand and prepare yourself, for the sword has devoured those around you.’
translation:
  language: fr
  text: 'Annoncez-le en Égypte et faites-le entendre à Migdol ; faites-le entendre à Noph[a] et à Tahpanès. Dites : « Prends position et prépare-toi, car l’épée a dévoré ce qui t’entoure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noph est le nom hébreu de Memphis.
    reason: Identification historique du toponyme hébreu conservé dans le texte.
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Annoncez-le
  rationale: L’impératif hiphil de נגד demande de faire connaître publiquement une nouvelle. « Annoncez-le » restitue naturellement cette proclamation ; le pronom objet est suppléé par le contexte.
- source_word: וְהַשְׁמִיעוּ
  choice: faites-le entendre
  rationale: Le hiphil de שמע signifie littéralement faire entendre. Cette formulation française conserve l’image et la répétition des deux occurrences.
- source_word: בְמִצְרַיִם
  choice: en Égypte
  rationale: La préposition ב est ici locative ; « en Égypte » est la formulation française directe.
- source_word: בְמִגְדּוֹל
  choice: à Migdol
  rationale: Le nom de lieu est translittéré ; en français, la préposition naturelle devant une ville est « à ».
- source_word: בְנֹף
  choice: à Noph
  rationale: Le nom hébreu est conservé dans le texte, tandis que son équivalent historique Memphis est indiqué en note.
- source_word: וּבְתַחְפַּנְחֵס
  choice: et à Tahpanès
  rationale: Le toponyme hébreu est translittéré sous une forme française lisible.
- source_word: אִמְרוּ
  choice: Dites
  rationale: L’impératif simple introduit directement les paroles à proclamer.
- source_word: הִתְיַצֵּב
  choice: Prends position
  rationale: L’impératif hitpael de יצב exprime le fait de se placer et de se tenir prêt ; « Prends position » en garde la nuance volontaire.
- source_word: וְהָכֵן לָךְ
  choice: prépare-toi
  rationale: Le verbe accompagné de לָךְ a ici une valeur réfléchie, rendue clairement par « prépare-toi ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison des ordres précédents.
- source_word: אָכְלָה חֶרֶב
  choice: l’épée a dévoré
  rationale: Le parfait présente la destruction comme accomplie ou déjà engagée. « A dévoré » maintient l’aspect accompli et la personnification saisissante de l’épée.
- source_word: סְבִיבֶיךָ
  choice: tout autour de toi
  rationale: L’expression désigne ce qui entoure le destinataire sans objet explicite. La traduction évite d’ajouter « ceux » et conserve l’indétermination du texte hébreu.
theological_decisions:
- issue: Passage du pluriel au singulier dans l’adresse
  choice: 'Conserver le pluriel des ordres de proclamation, puis le singulier dans la citation : « Prends position et prépare-toi… autour de toi. »'
  alternative: Uniformiser au pluriel ou comprendre le singulier comme visant explicitement une ville ou une unité militaire.
  rationale: Le changement grammatical appartient à la rhétorique du texte. Le singulier peut viser l’Égypte personnifiée, mais la traduction n’explicite pas cette interprétation.
- issue: Valeur aspectuelle de אָכְלָה
  choice: « a dévoré »
  alternative: « dévorera » ou « dévore »
  rationale: Le parfait hébreu peut décrire un désastre déjà engagé ou présenter un événement imminent comme certain. Le passé composé respecte le mieux la forme accomplie sans la transformer en simple prédiction future.
- issue: Objet implicite après « a dévoré »
  choice: « tout autour de toi »
  alternative: « ceux qui t’entourent »
  rationale: L’hébreu ne nomme pas expressément les personnes ou les lieux dévorés. La formulation retenue préserve cette tension et l’image d’une dévastation environnante.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « faites-le entendre » reproduit l’insistance hébraïque. Les toponymes suivent des formes françaises usuelles ou lisibles, et le changement du pluriel au singulier est volontairement maintenu.
