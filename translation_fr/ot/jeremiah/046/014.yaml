  revision_rationale: 'La révision limitée de la dernière proposition rétablit en français la fonction syntaxique de l’expression hébraïque : l’épée dévore les alentours du destinataire. « Ce qui t’entoure » ne tranche pas indûment si ces alentours sont compris comme des personnes, des forces ou des lieux.'
