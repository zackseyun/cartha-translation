id: JER.46.24
reference: Jeremiah 46:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֹבִ֖ישָׁה בַּת מִצְרָ֑יִם נִתְּנָ֖ה בְּ/יַ֥ד עַם צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/024.yaml
  text: The daughter of Egypt is put to shame[a]; she is given into the hand of a people from the north.
translation:
  language: fr
  text: La fille de l’Égypte est couverte de honte ; elle est livrée aux mains[a] d’un peuple venu du nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main de » ; expression signifiant « au pouvoir de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישָׁה
  choice: est couverte de honte
  rationale: Le hifil de בוש exprime ici la honte ou le déshonneur subi. « Est couverte de honte » rend naturellement en français la valeur résultative et judiciaire du verbe, sans la réduire au sentiment intérieur d’avoir honte.
- source_word: בַּת מִצְרָיִם
  choice: la fille de l’Égypte
  rationale: Cette expression prophétique personnifie l’Égypte sous les traits d’une femme. La traduction conserve cette image ainsi que l’accord féminin du verset.
- source_word: נִתְּנָה
  choice: elle est livrée
  rationale: Le nifal de נתן marque une remise passive au pouvoir d’un adversaire. Dans ce contexte hostile, « est livrée » est plus naturel et plus précis que le calque « est donnée ».
- source_word: בְּיַד
  choice: aux mains de
  rationale: L’expression hébraïque signifie être placé sous le pouvoir de quelqu’un. « Livrée aux mains de » conserve l’image tout en employant une tournure française idiomatique.
- source_word: עַם צָפוֹן
  choice: un peuple venu du nord
  rationale: L’hébreu désigne de façon indéfinie un peuple associé au nord. « Venu du nord » exprime naturellement la provenance sans identifier explicitement ce peuple à Babylone.
theological_decisions:
- issue: Faut-il préciser l’identité historique du peuple venu du nord ?
  choice: Conserver la désignation générale « un peuple venu du nord »
  alternative: Nommer Babylone ou parler de l’armée babylonienne
  rationale: Le texte hébreu ne donne ici aucun nom propre. La formulation prophétique est donc maintenue sans introduire dans le corps du texte une identification historique interprétative.
translation_notes:
  register: Français moderne, international et digne. La personnification poétique est conservée, tandis que « livrée aux mains de » rend l’idiome hébreu de manière immédiatement compréhensible.
