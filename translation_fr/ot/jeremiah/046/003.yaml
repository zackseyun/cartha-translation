  text: עִרְכ֤וּ מָגֵן֙ וְ/צִנָּ֔ה וּ/גְשׁ֖וּ לַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/003.yaml
  text: Prepare buckler and shield[a], and advance to battle.
translation:
  language: fr
  text: 'Préparez le petit bouclier et le grand bouclier[a],

    et avancez au combat !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Disposez le bouclier et le grand bouclier, et approchez-vous pour le combat. »'
    reason: La taille respective des deux types de boucliers est probable, mais elle n’est pas explicitement indiquée par des adjectifs dans l’hébreu ; ערך et נגשׁ peuvent aussi être rendus plus littéralement par « disposer » et « s’approcher ».
lexical_decisions:
- source_word: עִרְכוּ
  choice: Préparez
  rationale: L’impératif de ערך signifie mettre en ordre ou disposer. Avec des armes comme compléments, « Préparez » exprime naturellement leur mise en état pour le combat.
- source_word: מָגֵן
  choice: le petit bouclier
  rationale: מָגֵן désigne ici vraisemblablement un bouclier plus petit que la צִנָּה. « Petit bouclier » maintient cette distinction en français moderne sans recourir au terme moins courant « bocle ».
- source_word: צִנָּה
  choice: le grand bouclier
  rationale: צִנָּה désigne généralement un grand bouclier couvrant davantage le corps. La traduction explicite préserve le contraste lexical avec מָגֵן.
- source_word: וּגְשׁוּ
  choice: et avancez
  rationale: נגשׁ signifie s’approcher ou se présenter. Dans cet appel militaire, « avancez » rend avec naturel le mouvement vers l’affrontement.
- source_word: לַמִּלְחָמָה
  choice: au combat
  rationale: La préposition ל marque ici la progression vers l’engagement armé. « Au combat » est une formulation française concise et idiomatique.
theological_decisions: []
translation_notes:
  register: Impératifs militaires directs, dans un français moderne, énergique et digne. La distinction entre les deux boucliers est explicitée dans le texte tout en étant nuancée par une note.
