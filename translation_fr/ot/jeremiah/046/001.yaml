  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא עַל הַ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/001.yaml
  text: The word of Yahweh that came to Jeremiah the prophet concerning the nations:[a]
translation:
  language: fr
  text: 'La parole de Yahweh qui fut adressée à Jérémie, le prophète, au sujet des nations[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre les nations ». La préposition hébraïque peut introduire le sujet de ces paroles de façon générale ou, dans ce contexte, des oracles hostiles dirigés contre les nations.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל
  choice: Parole de Yahweh adressée à
  rationale: Cette formulation française naturelle rend l’expression prophétique selon laquelle la parole divine « fut/vint à » quelqu’un, sans calquer lourdement la syntaxe hébraïque. Le tour nominal convient à une rubrique introductive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé par le tétragramme.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: au prophète Jérémie
  rationale: Conserve explicitement le nom et le titre apposé, dans l’ordre naturel du français.
- source_word: עַל
  choice: au sujet de
  rationale: Introduit largement le thème des oracles sans imposer dès la rubrique leur orientation hostile; « contre » reste possible en contexte.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Désigne ici les peuples étrangers comme entités collectives et politiques; « nations » est plus approprié que « païens ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin, rendu directement afin de préserver sa valeur de nom propre.
- issue: Portée de עַל הַגּוֹיִם dans la rubrique
  choice: au sujet des nations
  alternative: contre les nations
  rationale: La préposition peut signaler simplement le sujet des oracles, mais leur contexte de jugement permet aussi le sens hostile « contre »; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation nominale marque clairement la fonction de rubrique du verset; les deux-points annoncent les oracles qui suivent.
