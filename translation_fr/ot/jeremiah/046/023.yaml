    issue: « impénétrable » pour לֹא יֵחָקֵר
    rationale: Le verbe חקר au niphal signifie plus précisément « être exploré, sondé, scruté ». « Impénétrable » peut évoquer une barrière physiquement infranchissable et resserre l’image. « Impossible à explorer » maintient la portée du texte.
  - severity: low
    issue: Élision de la copule dans « ..., innombrables »
    rationale: 'L’hébreu ajoute une proposition complète : « et il n’y a pas de nombre pour eux ». « et ils sont innombrables » restitue clairement la coordination et reste naturel.'
  revised_text: Ils abattent sa forêt[a] — déclaration de Yahweh —, bien qu’elle soit impossible à explorer, car ils sont plus nombreux que les criquets, et ils sont innombrables.
