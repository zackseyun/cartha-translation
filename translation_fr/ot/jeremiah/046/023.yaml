source:
  edition: WLC
  text: כָּרְת֤וּ יַעְרָ/הּ֙ נְאֻם יְהוָ֔ה כִּ֖י לֹ֣א יֵֽחָקֵ֑ר כִּ֤י רַבּוּ֙ מֵֽ/אַרְבֶּ֔ה וְ/אֵ֥ין לָ/הֶ֖ם מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/023.yaml
  text: They have cut down her forest[a], declares Yahweh, though it cannot be searched out, because they are more numerous than locusts, and they are without number.
translation:
  language: fr
  text: Ils abattent sa forêt[a] — déclaration de Yahweh —, bien qu’elle soit impossible à explorer, car ils sont plus nombreux que les criquets, et ils sont innombrables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car elle est impossible à explorer ». La conjonction hébraïque peut avoir un sens causal (« car ») ou concessif (« bien que »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְתוּ
  choice: Ils abattent
  rationale: Le qatal qal 3e personne du pluriel peut présenter l’action prophétique comme accomplie ou certaine. Le présent français rend naturellement la scène vive sans imposer une chronologie passée.
- source_word: יַעְרָהּ
  choice: sa forêt
  rationale: יַעַר désigne une forêt ou une région boisée. Le suffixe féminin renvoie à l’Égypte personnifiée; « sa » conserve cette référence sans alourdir le français.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formulation conserve le caractère solennel de la formule prophétique nominale et rend directement le nom divin.
- source_word: כִּי לֹא יֵחָקֵר
  choice: bien qu’elle soit impénétrable
  rationale: Le niphal de חקר exprime ce qui ne peut être exploré à fond. « Impénétrable » transpose naturellement l’image d’une forêt impossible à parcourir ou sonder, avec une lecture concessive de כִּי.
- source_word: רַבּוּ מֵאַרְבֶּה
  choice: ils sont plus nombreux que les criquets
  rationale: רבה suivi de מִן établit ici une comparaison numérique. Le pluriel « criquets » évoque clairement une nuée destructrice.
- source_word: וְאֵין לָהֶם מִסְפָּר
  choice: innombrables
  rationale: Cette formulation française concise rend l’idiome littéral « il n’y a pas pour eux de nombre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Valeur du premier כִּי après la formule divine
  choice: bien que
  alternative: car
  rationale: La lecture concessive souligne que même une forêt impénétrable est abattue. La valeur causale demeure grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et imagé. Le présent prophétique donne de l’immédiateté; la métaphore de la forêt et celle de la nuée de criquets sont maintenues.
