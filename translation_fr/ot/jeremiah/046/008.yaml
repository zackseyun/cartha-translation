  text: מִצְרַ֨יִם֙ כַּ/יְאֹ֣ר יַֽעֲלֶ֔ה וְ/כַ/נְּהָר֖וֹת יִתְגֹּ֣עֲשׁוּ מָ֑יִם וַ/יֹּ֗אמֶר אַֽעֲלֶה֙ אֲכַסֶּה אֶ֔רֶץ אֹבִ֥ידָה עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/008.yaml
  text: Egypt rises like the Nile[a], and its waters surge like rivers. It says, ‘I will rise, I will cover the earth; I will destroy the city and those who dwell in it.’
translation:
  language: fr
  text: 'L’Égypte monte comme le Nil, et ses eaux se soulèvent comme des fleuves. Elle dit : « Je monterai, je couvrirai la terre[a] ; je détruirai la ville et ceux qui l’habitent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays ; le texte principal conserve l’ampleur hyperbolique de la vantardise de l’Égypte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: L’Égypte
  rationale: Nom français usuel du pays, ici personnifié. Le féminin grammatical français commande ensuite « Elle dit ».
- source_word: כַּיְאֹר
  choice: comme le Nil
  rationale: Dans un contexte égyptien, יְאֹר désigne naturellement le Nil plutôt qu’un fleuve indéterminé.
- source_word: יַעֲלֶה
  choice: monte
  rationale: Le présent rend la vigueur de la scène poétique et convient à la fois à la crue et à l’avancée militaire.
- source_word: וְכַנְּהָרוֹת יִתְגֹּעֲשׁוּ מָיִם
  choice: et ses eaux bouillonnent comme celles des fleuves
  rationale: « Bouillonnent » exprime l’agitation violente de יתגעשו. La formulation française explicite que les eaux de l’Égypte sont comparées à celles de fleuves, sans abandonner l’image de la crue.
- source_word: וַיֹּאמֶר
  choice: Elle dit
  rationale: L’Égypte est personnifiée et parle ; le présent conserve l’immédiateté poétique.
- source_word: אַעֲלֶה
  choice: Je monterai
  rationale: Reprend le même verbe que « monte » et maintient le double sens de crue et d’offensive.
- source_word: אֲכַסֶּה אֶרֶץ
  choice: je couvrirai la terre
  rationale: אֶרֶץ peut désigner la terre au sens large ou le pays. « La terre » conserve ici l’ampleur hyperbolique de la vantardise égyptienne.
- source_word: אֹבִידָה
  choice: je détruirai
  rationale: Rendu direct et naturel de la forme causative de אבד dans cette menace militaire.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: la ville et ceux qui l’habitent
  rationale: Le singulier hébreu est conservé. Cette tournure reste claire et proche du texte sans rendre l’expression artificiellement soutenue.
