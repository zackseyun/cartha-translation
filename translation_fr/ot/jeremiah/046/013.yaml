  text: הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ הַ/נָּבִ֑יא לָ/ב֗וֹא נְבֽוּכַדְרֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל לְ/הַכּ֖וֹת אֶת אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/013.yaml
  text: The word that Yahweh spoke to Jeremiah the prophet about the coming of Nebuchadnezzar king of Babylon to strike the land of Egypt:[a]
translation:
  language: fr
  text: 'La parole que Yahweh adressa au prophète Jérémie au sujet de la venue de Nabuchodonosor[a], roi de Babylone, pour frapper le pays d’Égypte :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici une forme du nom correspondant plus précisément à « Nabuchodréçar » ; « Nabuchodonosor » est la forme française traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans une introduction prophétique, דָּבָר désigne la parole ou le message divin. « La parole » conserve l’idiome biblique tout en restant naturel en français.
- source_word: דִּבֶּר ... אֶל
  choice: adressa à
  rationale: Littéralement « parla à ». Avec « la parole » comme complément antéposé, « adressa à » évite une répétition lourde et exprime naturellement l’acte de communication.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, plutôt que substitution par un titre.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Titre apposé à Jérémie, rendu directement.
- source_word: לָבוֹא
  choice: au sujet de la venue de
  rationale: L’infinitif construit avec ל introduit ici le contenu de l’oracle. Cette formulation conserve son caractère nominal et prospectif.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable; la graphie plus proche de l’hébreu du verset est signalée en note.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rendu direct et idiomatique de la chaîne construite.
- source_word: לְהַכּוֹת
  choice: pour frapper
  rationale: נכה peut signifier frapper, attaquer ou vaincre. « Frapper » maintient l’ampleur sémantique et la force militaire ou judiciaire sans préciser indûment le résultat.
- source_word: אֶרֶץ מִצְרָיִם
  choice: le pays d’Égypte
  rationale: Rend explicitement אֶרֶץ et préserve la dimension territoriale de l’attaque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et lisible. La structure d’introduction prophétique est conservée; « adressa » assure une syntaxe française naturelle, tandis que « frapper » préserve la portée non spécifiée du verbe hébreu.
