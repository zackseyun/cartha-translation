source:
  edition: WLC
  text: אַל יָנ֣וּס הַ/קַּ֔ל וְ/אַל יִמָּלֵ֖ט הַ/גִּבּ֑וֹר צָפ֨וֹנָ/ה֙ עַל יַ֣ד נְהַר פְּרָ֔ת כָּשְׁל֖וּ וְ/נָפָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/006.yaml
  text: Let not the swift flee[a], and let not the mighty man escape; in the north, by the bank of the Euphrates River[c][b], they have stumbled and fallen.
translation:
  language: fr
  text: Que l’homme rapide ne fuie pas, et que le vaillant[a] ne s’échappe pas ! Au nord[b], près de l’Euphrate[c], ils ont trébuché et sont tombés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le guerrier ». Le terme hébreu גִּבּוֹר désigne souvent un homme fort ou vaillant, notamment un combattant.
    reason: lexical_alternative
  - marker: b
    text: Ou « vers le nord ». La forme hébraïque צָפוֹנָה peut indiquer aussi bien la direction que la localisation.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « à la main du fleuve Euphrate ». L’hébreu emploie une expression signifiant « à côté de » ou « le long de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָנוּס
  choice: Que … ne fuie pas
  rationale: La particule אַל suivie de l’inaccompli exprime ici une défense à la troisième personne. La tournure française avec « que » en conserve la force sans la transformer en ordre adressé directement à quelqu’un.
- source_word: הַקַּל
  choice: l’homme rapide
  rationale: L’adjectif substantivé désigne celui qui est léger ou rapide, vraisemblablement un soldat agile. « L’homme rapide » est clair en français et évite de préciser indûment son type d’armement.
- source_word: יִמָּלֵט
  choice: s’échappe
  rationale: Dans ce contexte de défaite militaire, le nifal de מלט signifie naturellement « échapper » ou « se tirer d’affaire ».
- source_word: הַגִּבּוֹר
  choice: le vaillant
  rationale: גִּבּוֹר peut désigner un homme fort, vaillant ou un guerrier. « Le vaillant » préserve la forme adjectivale substantivée et la tonalité poétique.
- source_word: צָפוֹנָה
  choice: Au nord
  rationale: La forme peut marquer une direction ou une localisation. Avec la mention suivante de l’Euphrate, « au nord » exprime naturellement le lieu de la chute tout en laissant l’alternative directionnelle en note.
- source_word: עַל יַד
  choice: près de
  rationale: L’expression signifie littéralement « à la main de », mais constitue un idiome spatial signifiant « à côté de » ou « le long de ». « Près de » est naturel et exact dans ce contexte géographique.
- source_word: נְהַר פְּרָת
  choice: l’Euphrate
  rationale: En français courant, le nom propre « l’Euphrate » suffit à identifier le fleuve ; la note indique la présence explicite de נְהַר, « fleuve », en hébreu.
- source_word: כָּשְׁלוּ וְנָפָלוּ
  choice: ils ont trébuché et sont tombés
  rationale: Les deux accomplis décrivent avec vivacité une défaite achevée. Le passé composé rend cet accomplissement tout en conservant l’enchaînement poétique des deux verbes.
