  text: קָרְא֖וּ שָׁ֑ם פַּרְעֹ֤ה מֶֽלֶךְ מִצְרַ֨יִם֙ שָׁא֔וֹן הֶעֱבִ֖יר הַ/מּוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/017.yaml
  text: There they cry[a], ‘Pharaoh king of Egypt is only a noise; he has let the appointed time pass by.’
translation:
  language: fr
  text: 'Là, ils s’écrient[a] : « Pharaon, roi d’Égypte, n’est que vacarme ; il a laissé passer le moment fixé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Là, on l’appelle : “Pharaon, roi d’Égypte, est un vacarme ; il a manqué le moment fixé.” » L’hébreu est concis et railleur ; שָׁאוֹן peut aussi se traduire par « tumulte », « fracas » ou « vaine fanfaronnade ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: ils s’écrient
  rationale: Le qatal qal, troisième personne du pluriel, rapporte ici une proclamation moqueuse. Le présent de narration français restitue la vivacité de l’exclamation sans effacer la valeur verbale du texte.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe local est rendu directement et naturellement.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Pharaon, roi d’Égypte
  rationale: Le nom et le titre en apposition sont conservés dans un ordre naturel en français.
- source_word: שָׁאוֹן
  choice: n’est que vacarme
  rationale: Le nom peut désigner le bruit, le tumulte ou le fracas. Dans cette formule de dérision, « n’est que vacarme » exprime une agitation bruyante mais inefficace, sans transformer l’image en simple explication.
- source_word: הֶעֱבִיר
  choice: il a laissé passer
  rationale: 'Le hiphil de עבר conserve ainsi sa nuance causative : Pharaon a laissé le moment décisif passer.'
- source_word: הַמּוֹעֵד
  choice: le moment fixé
  rationale: מוֹעֵד désigne ici vraisemblablement un temps déterminé ou une occasion décisive, plutôt qu’une fête cultuelle. « Moment fixé » garde l’idée d’un rendez-vous temporel établi.
