  naturalness: La version révisée conserve un registre biblique moderne et accessible. « Au bord de l’Euphrate, à Karkemish » est idiomatique, et « que … battit » rattache clairement les deux relatives à l’armée.
  terminology: Les formes françaises usuelles « pharaon Néko », « Nabuchodonosor », « Jojakim », « Josias » et « Juda » sont appropriées. La note sur Nabuchodonosor est précisée pour refléter plus exactement la forme consonantique/vocalisée hébraïque. L’ancre a est déplacée vers l’expression qu’elle documente.
