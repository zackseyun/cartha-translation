source:
  edition: WLC
  text: לְ/מִצְרַ֗יִם עַל חֵ֨יל פַּרְעֹ֤ה נְכוֹ֙ מֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁר הָיָ֥ה עַל נְהַר פְּרָ֖ת בְּ/כַרְכְּמִ֑שׁ אֲשֶׁ֣ר הִכָּ֗ה נְבֽוּכַדְרֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַת֙ הָֽ/רְבִיעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/002.yaml
  text: 'Concerning Egypt: concerning the army of Pharaoh Neco king of Egypt[a], which was by the Euphrates River at Carchemish, which Nebuchadnezzar king of Babylon struck down in the fourth year of Jehoiakim son of Josiah[b], king of Judah.'
translation:
  language: fr
  text: 'Au sujet de l’Égypte[a] : au sujet de l’armée du pharaon Néko, roi d’Égypte, qui se trouvait au bord de l’Euphrate, à Karkemish, et que Nabuchodonosor, roi de Babylone[b], battit la quatrième année du règne de Jojakim, fils de Josias, roi de Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire la première expression par « Contre l’Égypte » ; « Au sujet de l’Égypte » est retenu ici parce que le verset sert de titre et présente le thème de l’oracle.
    reason: alternative_reading
  - marker: b
    text: La forme hébraïque du nom est plus proche de « Neboukadrétsar » ; « Nabuchodonosor » est la forme française traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִצְרַיִם
  choice: Au sujet de l’Égypte
  rationale: Dans cette suscription prophétique, לְ introduit naturellement le sujet de l’oracle. « Contre l’Égypte » reste possible, mais explicite davantage l’hostilité.
- source_word: עַל חֵיל
  choice: au sujet de l’armée
  rationale: עַל reprend et précise le thème, tandis que חֵיל désigne ici les forces militaires égyptiennes.
- source_word: פַּרְעֹה נְכוֹ
  choice: du pharaon Néko
  rationale: « Néko » est une forme française courante et proche de la vocalisation hébraïque.
- source_word: אֲשֶׁר הָיָה עַל נְהַר פְּרָת
  choice: qui se trouvait près de l’Euphrate
  rationale: Dans ce contexte locatif, עַל indique la position auprès du fleuve; « se trouvait près de » est naturel en français.
- source_word: בְּכַרְכְּמִשׁ
  choice: à Karkemish
  rationale: La préposition marque le lieu où l’armée était stationnée et où eut lieu la bataille.
- source_word: הִכָּה
  choice: battit
  rationale: Dans un contexte militaire, נכה peut exprimer le fait de frapper ou de vaincre. « Battit » conserve la force verbale et indique clairement l’issue militaire.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Le texte hébreu présente une forme plus proche de « Nabuchodrétsar », mais « Nabuchodonosor » est la forme traditionnelle et immédiatement reconnaissable en français.
- source_word: בִּשְׁנַת הָרְבִיעִית לִיהוֹיָקִים
  choice: la quatrième année du règne de Jojakim
  rationale: La formule hébraïque désigne une année de règne; l’ajout de « du règne » rend cette valeur explicite et idiomatique en français.
theological_decisions:
- issue: Valeur de la préposition dans la suscription sur l’Égypte
  choice: Au sujet de l’Égypte
  alternative: Contre l’Égypte
  rationale: La formulation retenue préserve la fonction thématique de la suscription sans exclure le caractère judiciaire de l’oracle qui suit.
translation_notes:
  register: Français international moderne, digne et accessible. La double formule « Au sujet de » reflète la structure de la suscription. Les noms propres suivent les formes françaises bibliques usuelles, avec une note lorsque la forme hébraïque diffère sensiblement.
