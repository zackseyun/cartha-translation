language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם שְׂכִרֶ֤י/הָ בְ/קִרְבָּ/הּ֙ כְּ/עֶגְלֵ֣י מַרְבֵּ֔ק כִּֽי גַם הֵ֧מָּה הִפְנ֛וּ נָ֥סוּ יַחְדָּ֖יו לֹ֣א עָמָ֑דוּ כִּ֣י י֥וֹם אֵידָ֛/ם בָּ֥א עֲלֵי/הֶ֖ם עֵ֥ת פְּקֻדָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/021.yaml
  text: Even her hired soldiers in her midst are like fattened calves; for even they have turned and fled together; they did not stand[a], for the day of their disaster has come upon them, the time of their punishment.
translation:
  language: fr
  text: Même les mercenaires qui sont au milieu d’elle sont comme des veaux engraissés. Car eux aussi ont tourné le dos et se sont enfuis tous ensemble ; ils n’ont pas tenu bon. En effet, le jour de leur désastre est venu sur eux, le temps de leur châtiment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temps de l’intervention à leur égard » ou « le temps où des comptes leur seront demandés ».
    reason: 'Alternative lexicale : פְּקֻדָּה peut évoquer une intervention, une reddition de comptes ou, dans ce contexte, un châtiment.'
lexical_decisions:
- source_word: שְׂכִרֶיהָ
  choice: ses mercenaires
  rationale: Dans cet oracle militaire contre l’Égypte, le nom désigne des combattants engagés contre rémunération. « Mercenaires » est précis, courant et plus naturel en français que « soldats à gages ».
- source_word: בְקִרְבָּהּ
  choice: qui sont au milieu d’elle
  rationale: La formulation conserve le repère spatial du texte hébreu et le pronom féminin qui renvoie à l’Égypte.
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: comme des veaux engraissés
  rationale: L’expression évoque des veaux nourris à l’étable pour être engraissés ; cette traduction restitue à la fois leur aisance apparente et leur vulnérabilité.
- source_word: הִפְנוּ נָסוּ
  choice: ont tourné le dos et se sont enfuis
  rationale: « Tourner le dos » exprime naturellement le mouvement de retraite introduit par le premier verbe, tandis que le second indique explicitement la fuite.
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: Cette tournure française rend l’action collective avec l’emphase appropriée au contexte de déroute générale.
- source_word: לֹא עָמָדוּ
  choice: ils n’ont pas tenu bon
  rationale: Dans un contexte militaire, « tenir bon » restitue naturellement l’idée de rester ferme ou de résister, sans ajouter l’idée d’une incapacité exprimée explicitement.
- source_word: יוֹם אֵידָם
  choice: le jour de leur désastre
  rationale: אֵיד désigne ici la catastrophe ou le malheur qui les frappe. « Désastre » convient au registre prophétique tout en restant actuel.
- source_word: עֵת פְּקֻדָּתָם
  choice: le temps de leur châtiment
  rationale: Dans ce contexte de jugement, פְּקֻדָּה a une valeur punitive. « Châtiment » exprime clairement cette nuance, tandis que l’ambiguïté lexicale est signalée en note.
theological_decisions:
- issue: Valeur de פְּקֻדָּה dans un oracle de jugement
  choice: le temps de leur châtiment
  alternative: le temps de leur intervention / le temps où des comptes leur seront demandés
  rationale: Le parallélisme avec « le jour de leur désastre » favorise le sens punitif. La note maintient toutefois les autres nuances possibles du terme, qui peut désigner une intervention ou une reddition de comptes.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le mouvement de la déroute et la répétition de « eux aussi », tandis que « mercenaires », « veaux engraissés » et « tenu bon » rendent le contexte militaire immédiatement compréhensible.
