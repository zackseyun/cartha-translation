revisions:
- from: 'Mais toi, n’aie pas peur, Jacob, mon serviteur ; ne te laisse pas abattre, Israël. Car me voici : je vais te sauver, toi qui es au loin,[a] et sauver ta descendance du pays où elle est captive. Jacob reviendra ; il vivra dans le calme et la tranquillité, sans personne pour l’effrayer.[b]'
  to: 'Mais toi, n’aie pas peur, Jacob, mon serviteur ; ne sois pas terrifié, Israël. Car voici : je vais te sauver, toi qui es au loin,[a] et sauver ta descendance du pays de leur captivité. Jacob reviendra ; il vivra dans le calme et la tranquillité, sans personne pour l’effrayer.[b]'
  rationale: 'La révision resserre deux rendus sur le texte hébreu tout en améliorant la diction française : l’interdiction de תֵּחַת reçoit une expression de peur/consternation plus directe, et la captivité de la descendance conserve son possessif pluriel. « Car voici » est une légère amélioration idiomatique. Le choix « je vais te sauver » demeure recevable pour le participe précédé de הִנְנִי, dont la valeur est promissive et assurée.'
  reviewer_model: gpt-5.6-terra
