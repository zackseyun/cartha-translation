source:
  edition: WLC
  text: וְ֠/אַתָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲק֛וֹב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/027.yaml
  text: But as for you[a], do not fear, my servant Jacob, and do not be dismayed, Israel; for behold, I will save you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: fr
  text: 'Mais toi, n’aie pas peur, Jacob, mon serviteur ; ne sois pas terrifié, Israël. Car voici : je vais te sauver, toi qui es au loin,[a] et sauver ta descendance du pays de leur captivité. Jacob reviendra ; il vivra dans le calme et la tranquillité, sans personne pour l’effrayer.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « je te sauve » ou « je te sauverai d’un lieu lointain ». L’hébreu emploie un participe, qui peut présenter l’action comme imminente ou certaine.'
    reason: lexical_alternative
  - marker: b
    text: « Jacob » et « Israël » personnifient ici le peuple de l’alliance.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: Le pronom indépendant accompagné de la conjonction marque un changement de destinataire et un contraste avec le jugement annoncé auparavant.
- source_word: אַל תִּירָא
  choice: n’aie pas peur
  rationale: Formulation directe, naturelle et actuelle de l’interdiction exprimée par ירא.
- source_word: עַבְדִּי יַעֲקֹב
  choice: Jacob, mon serviteur
  rationale: Conserve le titre d’alliance « mon serviteur » et l’adresse personnelle portée par le nom Jacob.
- source_word: וְאַל תֵּחַת
  choice: ne te laisse pas abattre
  rationale: Le niphal de חתת peut exprimer l’effondrement intérieur ou le découragement. Cette formulation française rend ce sens sans répéter simplement « avoir peur ».
- source_word: כִּי הִנְנִי מוֹשִׁיעֲךָ
  choice: 'Car me voici : je vais te sauver'
  rationale: « Car » donne le motif de l’exhortation, « me voici » garde la force présentative de הִנְנִי, et « je vais te sauver » rend le participe comme une action divine imminente ou assurée.
- source_word: מֵרָחוֹק
  choice: toi qui es au loin
  rationale: Évite l’ambiguïté française de « te sauver de loin », qui pourrait signifier sauver à distance, tout en conservant l’idée spatiale du lieu éloigné.
- source_word: וְאֶת זַרְעֲךָ
  choice: et sauver ta descendance
  rationale: זֶרַע désigne ici collectivement les descendants. La répétition de « sauver » explicite naturellement en français l’ellipse verbale hébraïque.
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: du pays où elle est captive
  rationale: Rend le pays de captivité en accordant le pronom collectif avec « descendance », sans réduire nécessairement שְׁבִי à un terme technique particulier pour l’exil.
- source_word: וְשָׁב יַעֲקֹב
  choice: Jacob reviendra
  rationale: שׁוּב désigne ici le retour après l’éloignement ou la captivité.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: il vivra dans le calme et la tranquillité
  rationale: Les deux verbes décrivent une existence paisible, stable et sans trouble après le retour. La formulation française garde leur complémentarité sans suggérer un simple silence.
- source_word: וְאֵין מַחֲרִיד
  choice: sans personne pour l’effrayer
  rationale: Reproduit l’absence de tout agent qui ferait trembler Jacob ou troublerait sa sécurité.
theological_decisions:
- issue: Référent de « Jacob » et d’« Israël »
  choice: Les noms sont conservés comme personnification collective du peuple de l’alliance.
  alternative: Comprendre le patriarche Jacob individuellement comme figure symbolique.
  rationale: Dans ce contexte de captivité et de restauration, « Jacob » et « Israël » sont des appellations parallèles du peuple. Garder les noms préserve l’image prophétique sans la remplacer par une paraphrase interprétative.
- issue: Valeur temporelle de מוֹשִׁיעֲךָ avec הִנְנִי
  choice: « je vais te sauver », promesse présentée comme imminente ou certaine.
  alternative: « je te sauve » ou « je te sauverai ».
  rationale: Le participe hébreu ne fixe pas à lui seul un temps français précis. La périphrase choisie maintient la tension entre présentation vive de l’action et orientation future de la promesse.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent personnels et accessibles ; le parallélisme prophétique est conservé, tandis que les tournures susceptibles de produire un faux sens en français, notamment « sauver de loin », sont évitées.
