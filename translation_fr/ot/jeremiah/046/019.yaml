  source_fidelity: 'Le sens global est fidèlement rendu : l’impératif féminin, l’image des préparatifs d’exil, la personnification de l’Égypte, Noph, la désolation et l’absence d’habitants sont conservés. La coordination française actuelle (« deviendra un lieu désolé et sera dévastée ») associe toutefois un prédicat nominal masculin à un participe/attribut féminin se rapportant implicitement à la ville; une légère reformulation rend le référent et la syntaxe nets sans modifier le sens.'
  naturalness: « Fille d’Égypte qui y habites » est compréhensible, mais « y » a un antécédent peu naturel dans cette apostrophe personnifiée. « Toi qui habites en Égypte, fille d’Égypte » est plus clair et reste direct. La reprise explicite « elle » pour Noph améliore aussi la fluidité.
  terminology: « Bagages pour l’exil », « fille d’Égypte », « Noph », « désolation », « dévastée » et « sans aucun habitant » rendent les termes clés sans imposer l’interprétation du feu. Les notes lexicales conservent convenablement les alternatives et l’identification historique de Noph.
