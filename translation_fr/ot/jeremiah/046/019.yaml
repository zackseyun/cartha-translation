  text: כְּלֵ֤י גוֹלָה֙ עֲשִׂ֣י לָ֔/ךְ יוֹשֶׁ֖בֶת בַּת מִצְרָ֑יִם כִּֽי נֹף֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ה וְ/נִצְּתָ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/019.yaml
  text: Prepare your baggage for exile[a], O daughter dwelling in Egypt, for Noph will become a desolation, laid waste[c][b], without inhabitant.
translation:
  language: fr
  text: 'Prépare tes bagages pour l’exil[b], toi qui habites en Égypte, fille d’Égypte, car Noph[a] deviendra une désolation : elle sera dévastée, sans aucun habitant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noph est le nom hébreu de la ville égyptienne connue plus tard sous le nom de Memphis.
    reason: cross_reference
  - marker: b
    text: Littéralement « des objets pour l’exil » ou « un équipement de déportée » ; l’image hébraïque est celle des affaires préparées en vue d’une déportation.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: tes bagages pour l’exil
  rationale: L’expression désigne concrètement les affaires que l’on prépare en vue d’une déportation. Cette formulation est naturelle en français moderne tout en conservant l’image des biens emportés de force.
- source_word: עֲשִׂי לָךְ
  choice: Prépare tes
  rationale: L’impératif féminin accompagné du pronom réfléchi appelle la destinataire à préparer pour elle-même ce qui sera nécessaire. En français, le possessif exprime naturellement cette idée.
- source_word: יוֹשֶׁבֶת בַּת מִצְרָיִם
  choice: fille d’Égypte qui y habites
  rationale: La formulation conserve la personnification féminine de l’Égypte ainsi que l’idée exprimée par le participe « habiter ». Le pronom « y » rend la phrase idiomatique sans supprimer l’adresse prophétique.
- source_word: נֹף
  choice: Noph
  rationale: Le nom hébreu est conservé dans le texte; son identification habituelle avec Memphis est donnée en note.
- source_word: לְשַׁמָּה
  choice: un lieu désolé
  rationale: Le terme évoque une dévastation effroyable. « Un lieu désolé » exprime clairement le résultat concret dans un français accessible.
- source_word: וְנִצְּתָה
  choice: sera dévastée
  rationale: Dans ce contexte, le verbe annonce la ruine complète de la ville. La traduction principale n’impose pas l’image du feu, possible mais discutée; celle-ci est signalée en note.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sans aucun habitant
  rationale: Cette expression rend de façon concise et solennelle l’absence totale de résidents.
