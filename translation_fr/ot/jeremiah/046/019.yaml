translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse prophétique au féminin singulier. La personnification « fille d’Égypte » et le nom hébreu Noph sont maintenus; les formulations trop littérales ou archaïques ont été évitées.
