    issue: « a préparé un sacrifice » ajoute une action au texte.
    rationale: 'L’hébreu porte une clause nominale : « car [il y a / c’est] un sacrifice pour Yahweh ». Aucun verbe signifiant « préparer » n’est présent.'
  - severity: low
    issue: La tournure « où il se vengera » explicite l’infinitif par un futur relatif.
    rationale: « Pour se venger de ses adversaires » reproduit plus directement la relation de but de לְהִנָּקֵם et conserve la concision de l’original.
  - severity: low
    issue: « dévorera jusqu’à satiété » fusionne deux verbes coordonnés.
    rationale: Le texte hébreu dit que l’épée dévore puis se rassasie ; les exprimer séparément préserve le parallélisme et la personnification.
