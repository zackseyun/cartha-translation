reference: Jeremiah 46:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ/הַ/יּ֨וֹם הַ/ה֜וּא לַ/אדֹנָ֧/י יְהוִ֣ה צְבָא֗וֹת י֤וֹם נְקָמָה֙ לְ/הִנָּקֵ֣ם מִ/צָּרָ֔י/ו וְ/אָכְלָ֥ה חֶ֨רֶב֙ וְ/שָׂ֣בְעָ֔ה וְ/רָוְתָ֖ה מִ/דָּמָ֑/ם כִּ֣י זֶ֠בַח לַ/אדֹנָ֨/י יְהוִ֧ה צְבָא֛וֹת בְּ/אֶ֥רֶץ צָפ֖וֹן אֶל נְהַר פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/010.yaml
  text: That day belongs to the Lord GOD of Armies[a], a day of vengeance, to avenge himself on his foes. The sword will devour and be satisfied and drink its fill of their blood, for the Lord GOD of Armies has a sacrifice in the land of the north[b], by the Euphrates River.
translation:
  language: fr
  text: 'Ce jour-là appartient au Seigneur Yahweh, le Dieu des armées[a] : c’est un jour de vengeance, pour se venger de ses adversaires. L’épée dévorera, se rassasiera et s’abreuvera de leur sang. Car il y a un sacrifice[b] pour le Seigneur Yahweh, le Dieu des armées, dans le pays du nord, près de l’Euphrate.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le Seigneur Yahweh des armées ». Le titre peut évoquer les armées terrestres aussi bien que les puissances célestes placées sous son autorité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car le Seigneur Yahweh, le Dieu des armées, a un sacrifice ». La construction hébraïque peut être comprise comme une proposition relationnelle plutôt qu’existentielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend naturellement le syntagme temporel démonstratif; la conjonction initiale est omise en français, où elle alourdirait l’ouverture sans apporter ici de contraste nécessaire.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: appartient au Seigneur Yahweh, le Dieu des armées
  rationale: Le לְ exprime ici la relation d’appartenance. « Seigneur Yahweh » distingue אֲדֹנָי du nom divin, tandis que « le Dieu des armées » rend le titre צְבָאוֹת dans un français clair et idiomatique.
- source_word: יוֹם נְקָמָה לְהִנָּקֵם מִצָּרָיו
  choice: un jour de vengeance, où il se vengera de ses adversaires
  rationale: Conserve la répétition entre le nom נְקָמָה et le verbe נקם ainsi que la dimension personnelle de l’action divine. « Adversaires » convient au contexte de jugement et de guerre.
- source_word: וְאָכְלָה חֶרֶב וְשָׂבְעָה
  choice: L’épée dévorera jusqu’à satiété
  rationale: Maintient la personnification de l’épée et réunit idiomatiquement l’action de dévorer et celle d’être rassasiée.
- source_word: וְרָוְתָה מִדָּמָם
  choice: elle s’abreuvera de leur sang
  rationale: Préserve l’image de l’épée qui boit abondamment, sans réduire רוה à la seule idée d’être mouillée ou trempée.
- source_word: כִּי זֶבַח לַאדֹנָי
  choice: Car le Seigneur Yahweh […] a préparé un sacrifice
  rationale: Le contexte permet de comprendre une construction possessive ou existentielle. « A préparé » donne un français naturel et explicite l’implication contextuelle, tout en signalant l’autre analyse en note.
- source_word: בְּאֶרֶץ צָפוֹן
  choice: dans le pays du Nord
  rationale: Expression géographique naturelle qui conserve la désignation traditionnelle du nord comme région.
- source_word: אֶל נְהַר פְּרָת
  choice: près de l’Euphrate
  rationale: Dans ce contexte local, אֶל indique la proximité du fleuve. Le français nomme naturellement celui-ci « l’Euphrate » sans ajouter « fleuve ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU / Seigneur, l’Éternel
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. Les distinguer évite de confondre le nom divin avec un second titre et reflète directement les deux éléments hébreux.
- issue: Rendu de צְבָאוֹת
  choice: le Dieu des armées
  alternative: des armées / des puissances célestes
  rationale: Dans cet oracle militaire, « armées » garde la force martiale du titre. L’ajout idiomatique de « le Dieu » évite en français l’ambiguïté de « Seigneur Yahweh des armées », qui pourrait sembler faire de Yahweh un membre des armées.
- issue: Image sacrificielle appliquée au jugement
  choice: sacrifice
  alternative: massacre
  rationale: זֶבַח appartient au vocabulaire sacrificiel. Garder « sacrifice » préserve la tension théologique et la métaphore choquante du texte au lieu de la réduire à une simple tuerie.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste vive et poétique; la personnification de l’épée et l’image sacrificielle sont conservées. Les deux occurrences du titre divin sont rendues de manière uniforme.
