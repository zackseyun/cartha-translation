  text: שָׁמְע֤וּ גוֹיִם֙ קְלוֹנֵ֔/ךְ וְ/צִוְחָתֵ֖/ךְ מָלְאָ֣ה הָ/אָ֑רֶץ כִּֽי גִבּ֤וֹר בְּ/גִבּוֹר֙ כָּשָׁ֔לוּ יַחְדָּ֖יו נָפְל֥וּ שְׁנֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/012.yaml
  text: The nations have heard of your shame[a], and your cry has filled the earth; for warrior has stumbled against warrior; together both of them have fallen.
translation:
  language: fr
  text: Les nations ont entendu parler de ton déshonneur, et ton cri a rempli la terre[a] ; car un guerrier a trébuché contre un autre guerrier ; tous deux sont tombés ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays ; « la terre » est retenu ici parce que la proposition précédente parle des nations.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ גוֹיִם
  choice: Les nations ont appris
  rationale: Le parfait de שׁמע présente ici la diffusion déjà accomplie de la nouvelle. « Ont appris » est naturel en français et exprime mieux qu’« ont entendu » le fait que les nations ont eu connaissance du déshonneur de l’Égypte.
- source_word: קְלוֹנֵךְ
  choice: ton déshonneur
  rationale: קָלוֹן désigne la honte publique, l’ignominie ou le déshonneur. « Déshonneur » convient au contexte de défaite nationale et conserve l’adresse féminine singulière à l’Égypte.
- source_word: וְצִוְחָתֵךְ
  choice: et ton cri
  rationale: צְוָחָה est un cri de détresse. « Ton cri » reste sobre, naturel et suffisamment ouvert quant à sa nuance exacte.
- source_word: מָלְאָה הָאָרֶץ
  choice: a rempli la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un pays. La mention précédente des nations favorise ici la portée large de « la terre », sans supprimer l’autre possibilité.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication de la honte et du cri qui se répandent. « Car » maintient ce lien dans un registre prophétique digne.
- source_word: גִבּוֹר בְּגִבּוֹר כָּשָׁלוּ
  choice: les guerriers ont trébuché les uns contre les autres
  rationale: Dans ce cadre militaire, גִּבּוֹר désigne des guerriers. Le ב marque vraisemblablement le heurt au milieu de la débâcle. La tournure française rend le pluriel verbal hébreu et l’action réciproque sans confondre כשל, « trébucher », avec נפל, « tomber ».
- source_word: יַחְדָּיו נָפְלוּ שְׁנֵיהֶם
  choice: et tous deux sont tombés ensemble
  rationale: La formulation conserve à la fois l’idée de simultanéité exprimée par יַחְדָּו et l’insistance duale de שְׁנֵיהֶם.
