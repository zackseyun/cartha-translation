- from: Les nations ont appris ton déshonneur, et ton cri a rempli la terre[a] ; car les guerriers ont trébuché les uns contre les autres, et tous deux sont tombés ensemble.
  to: Les nations ont entendu parler de ton déshonneur, et ton cri a rempli la terre[a] ; car un guerrier a trébuché contre un autre guerrier ; tous deux sont tombés ensemble.
  rationale: La révision rétablit le singulier distributif « un guerrier ... un autre guerrier » et la relation avec « tous deux », conformément au texte hébreu. Elle améliore aussi légèrement l’équivalence idiomatique de שָׁמְעוּ ... קְלוֹנֵךְ par « ont entendu parler de ton déshonneur ». La note existante est exacte et son ancre est conservée.
