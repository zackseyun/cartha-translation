  source_fidelity: La première partie rend fidèlement le parfait de שׁמע, l’adresse féminine singulière à l’Égypte, le cri de détresse et l’ambiguïté possible de הָאָרֶץ. En revanche, « les guerriers ... les uns contre les autres » généralise l’image hébraïque distributive « guerrier contre guerrier » et affaiblit l’accent explicite sur deux combattants dans שְׁנֵיהֶם.
  naturalness: Le français est clair et de registre approprié. « Un guerrier a trébuché contre un autre guerrier ; tous deux sont tombés ensemble » est à la fois idiomatique et plus précis. « Ont entendu parler de » exprime naturellement en français le sens de « have heard of » sans suggérer que les nations auraient instruit ou découvert activement le déshonneur.
  terminology: « Déshonneur », « cri », « guerrier », « trébuché » et « tombés » conviennent bien. La distinction entre כשל (« trébucher ») et נפל (« tomber ») est maintenue. La note sur אֶרֶץ préserve correctement l’alternative « terre/pays ».
