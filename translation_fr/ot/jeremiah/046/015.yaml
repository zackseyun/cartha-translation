id: JER.46.15
reference: Jeremiah 46:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַדּ֖וּעַ נִסְחַ֣ף אַבִּירֶ֑י/ךָ לֹ֣א עָמַ֔ד כִּ֥י יְהוָ֖ה הֲדָפֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/015.yaml
  text: Why has your mighty one been swept away? He did not stand[a], for Yahweh drove him away.
translation:
  language: fr
  text: Pourquoi ton puissant a-t-il été emporté ? Il n’a pas tenu bon[a], car Yahweh l’a repoussé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes puissants ». Le terme hébreu peut aussi être compris comme « ton taureau », peut-être en référence à Apis, le taureau sacré de l’Égypte.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Adverbe interrogatif introduisant une question rhétorique ; « Pourquoi » est l’équivalent français naturel.
- source_word: נִסְחַף
  choice: a-t-il été emporté
  rationale: Le passif exprime le fait d’être balayé ou entraîné, ici dans une scène de défaite ; « emporté » conserve l’image sans la préciser excessivement.
- source_word: אַבִּירֶיךָ
  choice: ton puissant
  rationale: Le mot peut désigner un être puissant ou un taureau. Malgré la forme consonantique susceptible d’être comprise comme un pluriel, les formes singulières qui suivent favorisent ici « ton puissant ».
- source_word: לֹא עָמַד
  choice: Il n’a pas tenu bon
  rationale: Cette formulation française naturelle conserve l’image militaire de quelqu’un qui ne réussit pas à maintenir sa position.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la cause de la défaite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: הֲדָפוֹ
  choice: l’a repoussé
  rationale: Le verbe signifie pousser, refouler ou repousser ; le pronom objet est singulier.
theological_decisions:
- issue: Référent de אַבִּירֶיךָ dans l’oracle contre l’Égypte
  choice: « ton puissant » dans le texte principal
  alternative: « tes puissants » ; « ton taureau », peut-être une allusion à Apis, le taureau sacré égyptien
  rationale: Le lexème exprime la force et peut désigner un puissant ou un taureau. Les formes verbales et pronominales singulières favorisent le singulier, mais l’éventuelle référence à Apis n’est pas assez explicite pour être imposée dans le texte principal.
translation_notes:
  register: Français moderne, international et digne. « Tenir bon » rend naturellement l’idée de conserver sa position face à l’attaque. L’ambiguïté du référent est maintenue au moyen de la note.
