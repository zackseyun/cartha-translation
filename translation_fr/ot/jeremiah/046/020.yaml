lexical_decisions:
- source_word: עֶגְלָה
  choice: génisse
  rationale: Le nom désigne une jeune femelle bovine et maintient la personnification féminine de l’Égypte.
- source_word: יְפֵה פִיָּה
  choice: très belle
  rationale: Cette expression souligne la beauté remarquable de la génisse. « Très belle » est naturel en français tout en conservant l’intensité de la description.
- source_word: מִצְרָיִם
  choice: l’Égypte
  rationale: Forme française usuelle du nom du pays, ici personnifié sous les traits d’une génisse.
- source_word: קֶרֶץ
  choice: taon
  rationale: Ce nom rare peut désigner un insecte qui pique. « Taon » préserve de manière concise et naturelle l’image cohérente d’une génisse harcelée par un insecte.
- source_word: מִצָּפוֹן
  choice: venu du nord
  rationale: La tournure exprime clairement l’origine de la menace et rattache naturellement le complément au taon.
- source_word: בָּא בָא
  choice: arrive, il arrive
  rationale: La répétition hébraïque est conservée pour rendre l’insistance et l’urgence. Le présent convient à l’irruption vivement annoncée dans cet oracle poétique.
theological_decisions:
- issue: Sens de קֶרֶץ dans la métaphore du jugement
  choice: Image concrète d’un insecte piqueur (« taon »)
  alternative: « la destruction » ou « le désastre » venu du nord
  rationale: Le sens concret prolonge le mieux l’image de la génisse, sans effacer l’incertitude lexicale. Le sens abstrait, également défendable, est signalé en note.
translation_notes:
  register: Français moderne, international et digne. La ponctuation et l’exclamation rendent l’urgence de la répétition hébraïque sans l’atténuer.
