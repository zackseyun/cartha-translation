  text: Egypt is a beautiful heifer; destruction from the north has come[a], it has come.
translation:
  language: fr
  text: L’Égypte est une très belle génisse ; un taon venu du nord arrive[a], il arrive !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la destruction venue du nord arrive » ; le sens du nom hébreu est incertain.'
