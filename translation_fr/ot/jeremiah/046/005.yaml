source:
  edition: WLC
  text: מַדּ֣וּעַ רָאִ֗יתִי הֵ֣מָּה חַתִּים֮ נְסֹגִ֣ים אָחוֹר֒ וְ/גִבּוֹרֵי/הֶ֣ם יֻכַּ֔תּוּ וּ/מָנ֥וֹס נָ֖סוּ וְ/לֹ֣א הִפְנ֑וּ מָג֥וֹר מִ/סָּבִ֖יב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/005.yaml
  text: Why have I seen this? They are terrified[a], turning back; their warriors are crushed, and they have fled hastily and have not turned back. Terror is on every side[b], declares Yahweh.
translation:
  language: fr
  text: Pourquoi ai-je vu cela ? Les voilà terrifiés, ils battent en retraite ! Leurs guerriers sont écrasés ; ils fuient à toutes jambes[a] sans se retourner[b]. La terreur est de tous côtés — déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « ils ont fui d’une fuite », tournure emphatique qui souligne la déroute complète.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sans faire volte-face ». Le verbe peut évoquer le fait de ne pas se retourner ou de ne pas revenir faire face à l’ennemi.'
    reason: ambiguity
lexical_decisions:
- source_word: מַדּוּעַ רָאִיתִי
  choice: Pourquoi ai-je vu cela ?
  rationale: Conserve l’interrogation saisie du prophète et le parfait hébreu, tout en donnant une phrase française naturelle.
- source_word: הֵמָּה חַתִּים
  choice: Les voilà terrifiés
  rationale: Le pronom indépendant met les hommes en relief; « les voilà » rend cette insistance. חַתִּים décrit ici l’effondrement intérieur et la panique militaire.
- source_word: נְסֹגִים אָחוֹר
  choice: ils battent en retraite
  rationale: Expression française idiomatique qui rend le mouvement de recul dans un contexte militaire.
- source_word: גִבּוֹרֵיהֶם יֻכַּתּוּ
  choice: Leurs guerriers sont écrasés
  rationale: גִבּוֹרִים désigne les combattants d’élite; le passif יֻכַּתּוּ exprime leur défaite violente et décisive.
- source_word: וּמָנוֹס נָסוּ
  choice: ils fuient à toutes jambes
  rationale: La tournure idiomatique restitue l’intensité de l’accusatif interne hébreu sans produire en français la formulation maladroite « fuir d’une fuite ».
- source_word: וְלֹא הִפְנוּ
  choice: sans se retourner
  rationale: Rend le verbe « tourner » dans la scène d’une déroute, sans préciser à tort s’ils refusent de regarder derrière eux ou de faire face à l’ennemi.
- source_word: מָגוֹר מִסָּבִיב
  choice: La terreur est de tous côtés
  rationale: Préserve la formule récurrente de Jérémie et l’idée d’un danger environnant.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend avec solennité la formule prophétique et transcrit directement le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Nature de l’effondrement exprimé par חַתִּים
  choice: terrifiés
  alternative: abattus / brisés
  rationale: Dans cette scène de fuite, le terme peut évoquer à la fois l’épouvante et l’effondrement moral. « Terrifiés » convient au contexte sans transformer le mot en description certaine d’une blessure physique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les phrases brèves et l’exclamation rendent la stupeur et le mouvement précipité de la scène; le vocabulaire militaire reste immédiatement compréhensible.
