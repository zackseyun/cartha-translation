  text: אִסְר֣וּ הַ/סּוּסִ֗ים וַֽ/עֲלוּ֙ הַ/פָּ֣רָשִׁ֔ים וְ/הִֽתְיַצְּב֖וּ בְּ/כ֥וֹבָעִ֑ים מִרְקוּ֙ הָֽ/רְמָחִ֔ים לִבְשׁ֖וּ הַ/סִּרְיֹנֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/004.yaml
  text: Harness the horses[a]; mount up, you horsemen; take your stand with helmets on. Polish the spears[b]; put on the armor.
translation:
  language: fr
  text: Harnachez les chevaux ; montez, cavaliers ! Prenez position, casques en tête. Faites briller les lances ; revêtez vos armures[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une armure protégeant le corps, peut-être une cotte de mailles ou une cuirasse.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְרוּ
  choice: Harnachez
  rationale: Dans ce contexte de préparation militaire, le verbe אסר évoque l’action d’équiper ou d’attacher les chevaux en vue du combat ; « harnachez » rend naturellement cette idée en français.
- source_word: הַסּוּסִים
  choice: les chevaux
  rationale: Traduction directe du nom défini au pluriel.
- source_word: וַעֲלוּ
  choice: montez
  rationale: עלה signifie littéralement « monter » ; avec les cavaliers, le commandement invite naturellement à monter à cheval.
- source_word: הַפָּרָשִׁים
  choice: cavaliers
  rationale: Le nom désigne ici les hommes à cheval et prend une valeur d’apostrophe dans la série d’impératifs.
- source_word: וְהִתְיַצְּבוּ
  choice: Prenez position
  rationale: La forme réfléchie de יצב exprime le fait de se placer fermement ou en formation ; « prenez position » convient au contexte militaire.
- source_word: בְּכֹובָעִים
  choice: le casque en tête
  rationale: כּוֹבָעִים désigne des casques militaires ; cette tournure française rend de façon idiomatique l’équipement porté par chaque combattant.
- source_word: מִרְקוּ
  choice: Faites briller
  rationale: Le verbe désigne l’action de rendre lisse ou brillant. Cette formulation actuelle et claire convient aux armes que l’on prépare.
- source_word: הָרְמָחִים
  choice: les lances
  rationale: רְמָחִים désigne des armes d’hast, rendues ici par le terme français courant « lances ».
- source_word: לִבְשׁוּ
  choice: revêtez
  rationale: Le verbe לבשׁ signifie mettre ou porter un vêtement ou un équipement ; « revêtez » conserve ici la solennité de l’ordre militaire.
- source_word: הַסִּרְיֹנֹת
  choice: vos armures
  rationale: סִרְיֹן désigne une protection corporelle militaire, sans que sa forme précise soit certaine. « Armures » préserve cette généralité ; le possessif, implicite dans la situation, rend l’ordre naturel en français.
theological_decisions: []
translation_notes:
  register: Français international actuel, énergique et digne. La succession brève des impératifs conserve le rythme martial du texte hébreu. Le point d’exclamation marque l’urgence des ordres sans en multiplier artificiellement les effets.
