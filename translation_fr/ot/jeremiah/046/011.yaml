translation_notes:
  register: 'Français international moderne, sobre et prophétique. « Galaad » et « baume » maintiennent l’arrière-plan culturel sans l’alourdir dans le corps du verset. L’ironie demeure implicite : même le remède fameux de Galaad ne peut guérir l’Égypte.'
