  text: עֲלִ֤י גִלְעָד֙ וּ/קְחִ֣י צֳרִ֔י בְּתוּלַ֖ת בַּת מִצְרָ֑יִם לַ/שָּׁוְא֙ הרביתי רְפֻא֔וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/011.yaml
  text: Go up to Gilead and get balm[a], virgin daughter of Egypt. In vain you have multiplied remedies[b]; there is no healing for you.
translation:
  language: fr
  text: 'Monte en Galaad et procure-toi du baume, vierge, fille de l’Égypte. C’est en vain que tu as multiplié les remèdes[a] : il n’y a pas de guérison pour toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte consonantique hébreu et la forme verbale présentent une difficulté textuelle et morphologique. La lecture habituellement retenue est comprise comme « tu as multiplié », adressé à l’Égypte personnifiée ; on peut aussi rendre le sens : « C’est sans résultat que tu emploies de nombreux remèdes. » Dans le contexte, le sens général reste clair : les nombreux traitements de l’Égypte sont inutiles.'
    reason: textual_variant
lexical_decisions:
- source_word: עֲלִי
  choice: Monte
  rationale: Impératif qal féminin singulier de עלה. « Monte » conserve la direction et s’adresse à l’Égypte personnifiée.
- source_word: גִלְעָד
  choice: Galaad
  rationale: Forme française traditionnelle et courante du nom de lieu, région réputée pour son baume médicinal.
- source_word: וּקְחִי
  choice: et procure-toi
  rationale: Impératif qal féminin singulier de לקח. Dans ce contexte, il s’agit d’aller obtenir le remède, sens que « procure-toi » exprime naturellement.
- source_word: צֳרִי
  choice: du baume
  rationale: Désigne une résine aromatique employée comme remède. « Baume » préserve l’image historique et médicinale liée à Galaad.
- source_word: בְּתוּלַת בַּת מִצְרָיִם
  choice: vierge, fille de l’Égypte
  rationale: Conserve la personnification prophétique et les deux éléments de l’expression hébraïque, avec une ponctuation naturelle en français.
- source_word: לַשָּׁוְא
  choice: C’est en vain
  rationale: Exprime directement la futilité des nombreux traitements tentés.
- source_word: הרביתי
  choice: tu multiplies
  rationale: Le texte consonantique et la morphologie sont difficiles, mais le contexte appelle une forme féminine singulière adressée à l’Égypte. Le présent français donne une valeur générale et actuelle à l’action sans trancher inutilement son aspect.
- source_word: רְפֻאוֹת
  choice: les remèdes
  rationale: Dans le champ lexical du baume et des soins, « remèdes » désigne naturellement les traitements multipliés.
- source_word: תְּעָלָה
  choice: guérison
  rationale: Le nom évoque le rétablissement ou la cicatrisation. « Guérison » convient au contexte médical et à la sentence prophétique.
- source_word: אֵין לָךְ
  choice: il n’y a pas de … pour toi
  rationale: Reproduit naturellement en français la construction existentielle négative suivie du pronom féminin.
