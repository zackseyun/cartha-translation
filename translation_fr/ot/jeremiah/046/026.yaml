source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ם בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשָׁ֔/ם וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַד עֲבָדָ֑י/ו וְ/אַחֲרֵי כֵ֛ן תִּשְׁכֹּ֥ן כִּֽ/ימֵי קֶ֖דֶם נְאֻם יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/026.yaml
  text: And I will give them into the hand of those who seek their life[a], and into the hand of Nebuchadnezzar king of Babylon, and into the hand of his servants. But afterward she will dwell as in days of old[b], declares Yahweh.
translation:
  language: fr
  text: Je les livrerai à ceux qui cherchent à leur ôter la vie[a], à Nabuchodonosor[b], roi de Babylone, et à ses serviteurs. Mais après cela, l’Égypte sera habitée comme autrefois, déclare Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui cherchent leur vie ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte ici une forme du nom plus proche de « Nabuchodrétsar ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים בְּיַד
  choice: Je les livrerai à
  rationale: Dans ce contexte hostile, נתן בְיַד signifie remettre quelqu’un au pouvoir d’un autre. « Livrer à » restitue naturellement en français le sens de l’expression hébraïque sans alourdir la phrase par le calque « dans la main de ».
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: ceux qui cherchent à leur ôter la vie
  rationale: L’hébreu dit littéralement « ceux qui cherchent leur vie ». L’expression française choisie conserve l’image de la vie recherchée tout en rendant clairement l’intention meurtrière.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du roi de Babylone; la forme plus proche de l’orthographe hébraïque de ce verset est signalée en note.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme désigne largement les personnes au service du roi, sans imposer ici le sens plus précis d’« esclaves » ou de « fonctionnaires ».
- source_word: וְאַחֲרֵי כֵן
  choice: Mais après cela
  rationale: « Après cela » marque la succession temporelle, tandis que « mais » fait ressortir le retournement contextuel entre jugement et rétablissement.
- source_word: תִּשְׁכֹּן
  choice: l’Égypte sera habitée
  rationale: Le verbe féminin singulier renvoie à l’Égypte. Pour un pays, la tournure française « sera habitée » exprime naturellement l’idée qu’elle retrouvera une population établie, sans recourir à l’étrange « elle habitera ».
- source_word: כִּימֵי קֶדֶם
  choice: comme autrefois
  rationale: Formulation française actuelle et concise pour le retour à la situation des temps passés.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: Rend avec solennité la formule prophétique et transcrit le nom divin plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahvé » conserve le nom propre de l’alliance sous sa forme française courante, au lieu de lui substituer un titre.
- issue: Sujet féminin de תִּשְׁכֹּן
  choice: l’Égypte sera habitée
  alternative: elle habitera
  rationale: Le féminin singulier renvoie au pays d’Égypte, nom féminin en français. La formulation choisie maintient ce référent sans transformer artificiellement le pays en personne qui « habite ».
translation_notes:
  register: Français international moderne, digne et accessible. La répétition hébraïque de « dans la main de » est allégée par une coordination française naturelle, tandis que la structure en trois groupes — ennemis, roi, serviteurs — reste nette.
