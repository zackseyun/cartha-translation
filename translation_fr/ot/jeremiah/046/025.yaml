id: JER.46.25
reference: Jeremiah 46:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י פוֹקֵד֙ אֶל אָמ֣וֹן מִ/נֹּ֔א וְ/עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם וְ/עַל אֱלֹהֶ֖י/הָ וְ/עַל מְלָכֶ֑י/הָ וְ/עַ֨ל פַּרְעֹ֔ה וְ/עַ֥ל הַ/בֹּטְחִ֖ים בּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/025.yaml
  text: 'Yahweh of hosts[a], the God of Israel, says: Behold, I am about to punish Amon of No, and Pharaoh, and Egypt, and her gods, and her kings, and Pharaoh[b], and those who trust in him.'
translation:
  language: fr
  text: 'Ainsi parle Yahvé des armées, le Dieu d’Israël : « Voici que je vais punir Amon de No[a], le pharaon, l’Égypte, ses dieux et ses rois, ainsi que le pharaon et ceux qui mettent leur confiance en lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Amon de Thèbes ». « No » est le nom hébreu de la ville égyptienne généralement identifiée à Thèbes.
    reason: cultural_note
  - marker: b
    text: Ou « ceux qui mettent leur confiance en elle », si le pronom renvoie à l’Égypte plutôt qu’au pharaon.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Rend le nom divin par « Yahvé » et conserve la formulation ample du titre צְבָאוֹת sans la réduire aux seules armées humaines.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et naturelle de la construction hébraïque.
- source_word: אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique française naturelle et solennelle, équivalente à « dit » dans cette déclaration divine.
- source_word: הִנְנִי פוֹקֵד
  choice: Voici que je vais punir
  rationale: « Voici que » garde la force d’annonce de הִנְנִי, tandis que « je vais punir » exprime ici clairement l’intervention judiciaire imminente de פקד.
- source_word: אָמֹון מִנֹּא
  choice: Amon de No
  rationale: Conserve le nom hébreu de la ville et le lien entre la divinité égyptienne Amon et No, sans introduire l’identification interprétative à Thèbes dans le corps du texte.
- source_word: וְעַל
  choice: le pharaon, l’Égypte… ainsi que
  rationale: La coordination française évite une répétition lourde de « contre » tout en maintenant l’accumulation des objets du jugement.
- source_word: אֱלֹהֶיהָ וְעַל מְלָכֶיהָ
  choice: ses dieux et ses rois
  rationale: Les suffixes féminins renvoient naturellement à « l’Égypte », nom également féminin en français.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Rend le titre royal égyptien avec l’article attendu en français courant; sa répétition dans l’hébreu est conservée.
theological_decisions:
- issue: Référent du pronom בּוֹ (« en lui / en elle »)
  choice: 'Le pronom renvoie au pharaon : « ceux qui mettent leur confiance en lui ».'
  alternative: 'Le pronom peut renvoyer plus largement à l’Égypte : « ceux qui mettent leur confiance en elle ».'
  rationale: Le pharaon, masculin singulier et immédiatement antérieur, constitue l’antécédent grammatical le plus proche. L’Égypte demeure toutefois un référent contextuellement possible, d’où la note.
translation_notes:
  register: Français international actuel, solennel mais accessible. La répétition du « pharaon » est maintenue parce qu’elle appartient au texte hébreu. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
