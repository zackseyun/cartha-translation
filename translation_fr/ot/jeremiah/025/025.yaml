source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י זִמְרִ֗י וְ/אֵת֙ כָּל מַלְכֵ֣י עֵילָ֔ם וְ/אֵ֖ת כָּל מַלְכֵ֥י מָדָֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/025.yaml
  text: and all the kings of Zimri[a], and all the kings of Elam, and all the kings of Media[b];
translation:
  language: fr
  text: et tous les rois de Zimri[a], tous les rois d’Élam et tous les rois de Médie[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identité de Zimri est incertaine ; ce nom pourrait désigner un peuple ou une région que l’on ne peut identifier clairement par ailleurs.
    reason: cultural_note
  - marker: b
    text: 'Ou : « des Mèdes ». Le terme hébreu peut désigner soit la Médie, soit le peuple mède.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: et
  rationale: La conjonction וְ est rendue par « et » au début de cette nouvelle série coordonnée. Le marqueur d’objet אֵת n’a pas d’équivalent direct en français. Les occurrences suivantes de וְאֵת sont exprimées par la coordination naturelle de la liste, sans répéter systématiquement « et ».
- source_word: כָּל
  choice: tous les
  rationale: Devant le pluriel construit מַלְכֵי, כָּל désigne l’ensemble des rois de chaque peuple ou territoire ; « tous les » est la formulation française naturelle.
- source_word: מַלְכֵי
  choice: rois de
  rationale: Le pluriel construit de מֶלֶךְ signifie « rois de ». L’article défini est intégré à l’expression « tous les rois de ».
- source_word: זִמְרִי
  choice: Zimri
  rationale: Le nom est translittéré, car son référent demeure incertain et ne doit pas être identifié arbitrairement.
- source_word: עֵילָם
  choice: Élam
  rationale: « Élam » est la forme française usuelle du nom géographique עֵילָם.
- source_word: מָדָי
  choice: Médie
  rationale: Le terme peut désigner la Médie ou les Mèdes. Dans la construction « rois de » et au sein de cette liste géographique, « Médie » donne une expression française naturelle tout en conservant l’autre lecture en note.
