id: JER.25.7
reference: Jeremiah 25:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא שְׁמַעְתֶּ֥ם אֵלַ֖/י נְאֻם יְהוָ֑ה לְמַ֧עַן הכעסו/ני בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶ֖ם לְ/רַ֥ע לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/007.yaml
  text: Yet you did not listen to me[a], declares Yahweh, to provoke me to anger by the work of your hands, to your own harm.
translation:
  language: fr
  text: Pourtant, vous ne m’avez pas écouté — déclaration de Yahweh —, pour m’irriter par l’œuvre de vos mains, pour votre malheur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « pour » peut exprimer ici le but ou la conséquence. « L’œuvre de vos mains » désigne souvent, dans Jérémie, des idoles ou des pratiques idolâtres.
    reason: La note préserve l’ambiguïté de לְמַעַן et signale la connotation contextuelle de l’idiome sans l’imposer dans le texte.
lexical_decisions:
- source_word: וְלֹא שְׁמַעְתֶּם אֵלַי
  choice: Pourtant, vous ne m’avez pas écouté
  rationale: « Pourtant » rend la valeur adversative du contexte, et « écouter » conserve le sens auditif et réceptif de שׁמע sans expliciter entièrement l’idée d’obéir.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule solennelle rend l’expression prophétique hébraïque et transcrit le nom divin.
- source_word: לְמַעַן הַכְעִסוּנִי
  choice: de sorte que vous m’avez irrité
  rationale: לְמַעַן peut exprimer le but ou le résultat. « De sorte que » convient ici sans attribuer nécessairement au peuple l’intention consciente d’irriter Dieu; « irriter » rend la forme causative de כעס.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: par l’œuvre de vos mains
  rationale: La formulation conserve l’idiome hébreu et son singulier collectif, sans remplacer explicitement l’expression par « idoles ».
- source_word: לְרַע לָכֶם
  choice: pour votre propre malheur
  rationale: Cette expression française naturelle communique la conséquence nuisible qui retombe sur les destinataires.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: 'Valeur de לְמַעַן : but ou résultat'
  choice: de sorte que
  alternative: afin de
  rationale: Le contexte permet une nuance de résultat aussi bien que de finalité. Le choix principal évite d’affirmer que provoquer Yahweh constituait nécessairement le but conscient du refus d’écouter.
- issue: Portée de « l’œuvre de vos mains »
  choice: maintien de l’idiome dans le texte principal
  alternative: les idoles fabriquées de vos mains
  rationale: Dans Jérémie, l’expression évoque souvent les idoles ou les pratiques idolâtres, mais le verset ne les nomme pas explicitement; l’ambiguïté est donc préservée.
translation_notes:
  register: Français international moderne, digne et accessible. L’incise « déclaration de Yahweh » maintient le caractère solennel de la formule prophétique. Le passé composé convient à l’adresse directe et actuelle en français.
