  source_fidelity: 'La structure et les termes principaux sont bien rendus : « vous ne m’avez pas écouté », « déclaration de Yahweh », « par l’œuvre de vos mains » et la conséquence dommageable correspondent à l’hébreu. Toutefois, « de sorte que vous m’avez irrité » transforme la construction לְמַעַן + infinitif (« pour/afin de m’irriter ») en conséquence assertée et remplace l’infinitif par un verbe fini au passé. Même si une nuance consécutive est possible dans le contexte, le français peut conserver l’ambiguïté finalité/résultat sans modifier ainsi la syntaxe source.'
