  variant: modern international French
source:
  edition: WLC
  text: מִן שְׁלֹ֣שׁ עֶשְׂרֵ֣ה שָׁנָ֡ה לְ/יֹאשִׁיָּ֣הוּ בֶן אָמוֹן֩ מֶ֨לֶךְ יְהוּדָ֜ה וְ/עַ֣ד הַ/יּ֣וֹם הַ/זֶּ֗ה זֶ֚ה שָׁלֹ֤שׁ וְ/עֶשְׂרִים֙ שָׁנָ֔ה הָיָ֥ה דְבַר יְהוָ֖ה אֵלָ֑/י וָ/אֲדַבֵּ֧ר אֲלֵי/כֶ֛ם אַשְׁכֵּ֥ים וְ/דַבֵּ֖ר וְ/לֹ֥א שְׁמַעְתֶּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/003.yaml
  text: From the thirteenth year of Josiah son of Amon[a], king of Judah, even to this day, these twenty-three years, the word of Yahweh has come to me, and I have spoken to you, rising early and speaking, but you have not listened.
translation:
  language: fr
  text: Depuis la treizième année du règne de Josias, fils d’Amon, roi de Juda, jusqu’à ce jour — voilà vingt-trois ans —, la parole de Yahweh m’a été adressée, et je vous ai parlé avec insistance[a], mais vous n’avez pas écouté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « me levant de bonne heure et parlant » ; idiome hébreu exprimant une action persistante et répétée.'
    reason: Conserver l’image littérale d’un idiome rendu selon son sens dans le texte principal.
lexical_decisions:
- source_word: מִן ... וְעַד
  choice: Depuis… jusqu’à
  rationale: Exprime naturellement en français la période qui va d’un point de départ passé jusqu’au présent du prophète.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְיֹאשִׁיָּהוּ
  choice: la treizième année du règne de Josias
  rationale: Le contexte désigne une année de règne. L’ajout explicatif « du règne de » évite de faire comprendre une durée de treize ans.
- source_word: הַיּוֹם הַזֶּה
  choice: ce jour
  rationale: Conserve le caractère déictique et solennel de l’expression hébraïque, tout en restant naturel.
- source_word: זֶה שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: voilà vingt-trois ans
  rationale: Rend la récapitulation emphatique de la durée et la valeur démonstrative de זֶה dans un français idiomatique.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: la parole de Yahweh m’a été adressée
  rationale: Reproduit la formule prophétique sans imposer l’idée d’une unique venue de la parole; le passé composé s’accorde avec la période qui s’étend jusqu’au jour présent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וָאֲדַבֵּר אֲלֵיכֶם אַשְׁכֵּים וְדַבֵּר
  choice: et je n’ai cessé de vous parler[a]
  rationale: Communique la persistance et la répétition exprimées par l’idiome hébreu; son image littérale est conservée en note.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mais vous n’avez pas écouté
  rationale: Préserve la métaphore auditive de שׁמע et l’ambiguïté entre entendre attentivement et obéir.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre; sa transcription préserve cette fonction sans le remplacer par un titre.
- issue: Portée de l’idiome אַשְׁכֵּים וְדַבֵּר
  choice: je n’ai cessé de vous parler
  alternative: me levant de bon matin et parlant
  rationale: L’expression souligne une proclamation répétée et empressée. Le sens idiomatique figure dans le texte, tandis que l’image hébraïque reste accessible en note.
- issue: Sens de שׁמע dans le reproche final
  choice: écouté
  alternative: obéi
  rationale: « Écouté » maintient à la fois l’image du texte et sa tension sémantique; l’idée d’obéissance est impliquée sans être explicitée à la place du lecteur.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la longue portée temporelle de l’hébreu, mais les tirets isolent la récapitulation « voilà vingt-trois ans » afin d’en faciliter la lecture.
