id: JER.25.2
reference: Jeremiah 25:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁ֨ר דִּבֶּ֜ר יִרְמְיָ֤הוּ הַ/נָּבִיא֙ עַל כָּל עַ֣ם יְהוּדָ֔ה וְ/אֶ֛ל כָּל יֹשְׁבֵ֥י יְרוּשָׁלִַ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/002.yaml
  text: 'which Jeremiah the prophet spoke to all the people of Judah and to all the inhabitants of Jerusalem[b][a], saying:'
translation:
  language: fr
  text: 'que le prophète Jérémie adressa à tout le peuple de Juda et à tous les habitants de Jérusalem[a], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La préposition traduite par « à » peut aussi signifier « au sujet de », voire « contre » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronom relatif renvoyant à « la parole » du verset 1; cette formulation relie naturellement le fragment à son antécédent en français.
- source_word: דִּבֶּר
  choice: adressa
  rationale: Avec les compléments introduisant les destinataires, « adressa » exprime naturellement une parole dirigée vers eux et évite la lourdeur de « parla… en disant ».
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Ordre idiomatique en français pour le nom accompagné de son titre appositif, tout en conservant l'identification explicite du personnage.
- source_word: עַל
  choice: à
  rationale: Dans ce contexte, en parallèle avec וְאֶל, la préposition désigne vraisemblablement les personnes auxquelles Jérémie s'adresse. Les sens « au sujet de » et « contre » demeurent possibles et sont signalés en note.
- source_word: כָּל עַם יְהוּדָה
  choice: tout le peuple de Juda
  rationale: Le singulier collectif עַם est rendu par « peuple »; « Juda » convient au royaume et à sa population dans ce contexte prophétique.
- source_word: וְאֶל
  choice: et à
  rationale: Introduit le second groupe destinataire de la parole.
- source_word: כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: tous les habitants de Jérusalem
  rationale: Rend clairement le participe substantivé « ceux qui habitent » dans un registre digne et courant.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: Conserve la formule hébraïque qui introduit les paroles rapportées à partir du verset suivant.
theological_decisions:
- issue: Orientation de la parole marquée par עַל
  choice: adressée « à » tout le peuple de Juda
  alternative: parole « au sujet de » ou « contre » tout le peuple de Juda
  rationale: Le parallélisme avec וְאֶל devant les habitants de Jérusalem favorise l'identification des destinataires, sans exclure lexicalement les autres nuances; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le fragment conserve son lien syntaxique avec le verset 1. « Adressa » rend la direction du discours sans reproduire la répétition peu naturelle « parla… en disant ».
