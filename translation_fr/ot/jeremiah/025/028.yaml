  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֧י יְמָאֲנ֛וּ לָ/קַֽחַת הַ/כּ֥וֹס מִ/יָּדְ/ךָ֖ לִ/שְׁתּ֑וֹת וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת שָׁת֥וֹ תִשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/028.yaml
  text: 'And if they refuse to take the cup from your hand to drink[a], then you shall say to them, ‘Thus says Yahweh of hosts: You shall surely drink.’'
translation:
  language: fr
  text: 'Et s’ils refusent de prendre de ta main la coupe pour la boire, tu leur diras : « Voici ce que dit Yahweh des armées : Vous boirez assurément[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un infinitif absolu suivi d’un verbe conjugué pour exprimer l’insistance et la certitude : « Vous boirez assurément. »'
    reason: Rend compte de la construction emphatique שָׁתוֹ תִשְׁתּוּ sans alourdir le texte principal.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Et s’ils
  rationale: Cette tournure introduit ici une éventualité future. « Et s’ils » conserve la valeur conditionnelle dans un français naturel.
- source_word: יְמָאֲנוּ
  choice: refusent
  rationale: Le piel de מאן exprime un refus actif, bien rendu par « refusent ».
- source_word: לָקַחַת הַכּוֹס מִיָּדְךָ
  choice: de prendre de ta main la coupe
  rationale: La formulation conserve le verbe « prendre », la métaphore de la coupe et le singulier de « ta main », tout en respectant l’ordre naturel du français.
- source_word: לִשְׁתּוֹת
  choice: pour la boire
  rationale: L’infinitif indique le but de la prise de la coupe. Le pronom « la » rend explicite en français le complément naturellement sous-entendu en hébreu.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: tu leur diras
  rationale: Dans cette suite d’instructions prophétiques, la forme verbale porte une valeur directive future.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française actuelle et digne rend naturellement la formule de messager prophétique.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh, le maître des armées
  rationale: « Yahweh » reproduit le nom divin, tandis que « le maître des armées » communique le titre צבאות en français intelligible sans réduire les armées aux seules armées humaines.
- source_word: שָׁתוֹ תִשְׁתּוּ
  choice: Vous la boirez, oui, vous la boirez !
  rationale: La répétition idiomatique française restitue avec force l’infinitif absolu suivi du verbe conjugué, qui souligne le caractère inéluctable de l’action.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » maintient le nom propre plutôt que de le remplacer par un titre.
- issue: Explicitation symbolique de la coupe
  choice: Conserver simplement « la coupe »
  alternative: la coupe de la colère
  rationale: Même si le contexte associe la coupe au jugement divin, le présent verset ne précise pas « de la colère ». La métaphore est donc préservée sans ajout interprétatif.
- issue: Force de שָׁתוֹ תִשְׁתּוּ
  choice: 'Exprimer une certitude emphatique : « Vous la boirez, oui, vous la boirez ! »'
  alternative: « Vous devez absolument boire »
  rationale: La construction hébraïque accentue ici l’inéluctabilité de l’action tout en gardant une force contraignante. Le rendu choisi évite de réduire cette tension à une simple obligation.
translation_notes:
  register: Français international moderne, clair et digne. Tutoiement singulier pour Jérémie (« ta main », « tu leur diras ») et vouvoiement pluriel pour les nations (« vous la boirez »). La formule prophétique est rendue de façon naturelle plutôt que littéralement par « Ainsi dit ».
