    rationale: צְבָאוֹת signifie « armées/forces » dans ce titre. La relation exprimée par le génitif (« Yahweh des armées ») rend le texte sans introduire explicitement « maître ».
  - severity: low
    issue: La répétition « oui, vous la boirez ! » amplifie inutilement la forme emphatique.
    rationale: L’infinitif absolu suivi du verbe fini souligne fortement la certitude. « Vous boirez assurément » le rend de façon idiomatique sans répéter le verbe ni ajouter une exclamation.
