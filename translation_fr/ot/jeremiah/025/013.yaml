id: JER.25.13
reference: Jeremiah 25:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ו/הבאיתי עַל הָ/אָ֣רֶץ הַ/הִ֔יא אֶת כָּל דְּבָרַ֖/י אֲשֶׁר דִּבַּ֣רְתִּי עָלֶ֑י/הָ אֵ֤ת כָּל הַ/כָּתוּב֙ בַּ/סֵּ֣פֶר הַ/זֶּ֔ה אֲשֶׁר נִבָּ֥א יִרְמְיָ֖הוּ עַל כָּל הַ/גּוֹיִֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/013.yaml
  text: And I will bring upon that land all my words that I have spoken against it—all that is written in this book[b][a], which Jeremiah prophesied against all the nations.
translation:
  language: fr
  text: Je ferai venir sur ce pays toutes les paroles que j’ai prononcées contre lui, tout ce qui est écrit dans ce livre[a], ce que Jérémie a prophétisé contre toutes les nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ce rouleau ». Le mot hébreu peut désigner un rouleau écrit ou un livre.
    reason: lexical_alternative
  - marker: b
    text: Ou « au sujet de toutes les nations ». La préposition hébraïque peut avoir ce sens plus large, bien que le contexte favorise ici « contre ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Je ferai venir
  rationale: Le hiphil de בוא exprime ici l’action de faire advenir les jugements annoncés. « Je ferai venir » conserve cette valeur causative et s’accorde naturellement avec « sur ce pays ».
- source_word: עַל הָאָרֶץ הַהִיא
  choice: sur ce pays
  rationale: אֶרֶץ désigne ici le territoire soumis au jugement, d’où « pays ». Avec le verbe causatif, עַל se rend naturellement par « sur ».
- source_word: אֶת כָּל דְּבָרַי
  choice: toutes les paroles
  rationale: « Paroles » maintient le lien entre les déclarations divines et leur accomplissement, sans réduire explicitement leur contenu aux seuls jugements.
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלֶיהָ
  choice: que j’ai prononcées contre lui
  rationale: Le passé composé relie les déclarations antérieures à leur accomplissement prochain. « Contre lui » rend la valeur hostile ou judiciaire de עַל dans ce contexte.
- source_word: אֵת כָּל הַכָּתוּב
  choice: tout ce qui est écrit
  rationale: Cette formulation française courante exprime la totalité du contenu écrit et respecte la construction hébraïque.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: dans ce livre
  rationale: סֵפֶר peut désigner un livre ou un rouleau. « Livre » est naturel en français moderne; la variante historique est signalée en note.
- source_word: אֲשֶׁר נִבָּא יִרְמְיָהוּ
  choice: ce que Jérémie a prophétisé
  rationale: Cette tournure rattache naturellement la proposition au contenu écrit et rend directement le verbe נבא.
- source_word: עַל כָּל הַגּוֹיִם
  choice: contre toutes les nations
  rationale: Avec נבא, עַל peut signifier « au sujet de », mais le contexte d’oracles de jugement favorise ici « contre », sans effacer l’autre possibilité.
theological_decisions:
- issue: Portée des oracles prophétiques dans la proposition finale
  choice: contre toutes les nations
  alternative: au sujet de toutes les nations
  rationale: La préposition עַל avec נבא admet un sens thématique aussi bien qu’adversatif. Le contexte judiciaire favorise « contre », tandis qu’une note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque tout en évitant une formulation artificielle. Les répétitions essentielles (« toutes », « paroles », « écrit », « prophétisé ») sont conservées.
