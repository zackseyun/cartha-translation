source:
  edition: WLC
  text: וְ/אָבַ֥ד מָנ֖וֹס מִן הָֽ/רֹעִ֑ים וּ/פְלֵיטָ֖ה מֵ/אַדִּירֵ֥י הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/035.yaml
  text: Escape has perished from the shepherds[b][a], and deliverance from the lords of the flock.
translation:
  language: fr
  text: Tout moyen de fuir a disparu pour les bergers[a], toute échappatoire pour les puissants du troupeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « bergers » et les « puissants du troupeau » sont des images prophétiques désignant les responsables et les membres éminents du peuple.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבַד
  choice: a disparu
  rationale: Le qal accompli de אבד exprime ici la disparition complète d’une possibilité. Le passé composé convient à l’annonce prophétique et sonne naturellement en français.
- source_word: מָנוֹס
  choice: tout moyen de fuir
  rationale: Le nom peut désigner un refuge, une fuite ou une possibilité d’échapper. Dans ce contexte de jugement, cette formulation française rend clairement l’absence de toute issue.
- source_word: מִן הָרֹעִים
  choice: pour les bergers
  rationale: 'La préposition מן exprime la privation ou l’éloignement : la possibilité de fuir est retirée aux bergers. « Pour » restitue ce rapport idiomatiquement en français tout en conservant l’image pastorale.'
- source_word: וּפְלֵיטָה
  choice: toute échappatoire
  rationale: פְלֵיטָה peut évoquer l’évasion, la délivrance ou la survie. En parallèle avec מָנוֹס, « échappatoire » désigne naturellement une voie permettant d’échapper au désastre.
- source_word: מֵאַדִּירֵי הַצֹּאן
  choice: pour les puissants du troupeau
  rationale: אַדִּירֵי désigne ceux qui sont puissants, éminents ou nobles. « Les puissants du troupeau » conserve l’image et l’ambiguïté du texte hébreu sans réduire explicitement ces personnages à des dirigeants politiques.
theological_decisions:
- issue: Image prophétique des bergers et des membres puissants du troupeau
  choice: Conserver dans le texte les images « bergers » et « puissants du troupeau ».
  alternative: Expliciter « dirigeants » ou « chefs du peuple ».
  rationale: L’hébreu développe une métaphore pastorale. La préserver maintient la tension imagée du passage et évite d’intégrer directement son interprétation politique au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé par deux groupes nominaux coordonnés sans répéter le verbe; « tout moyen » et « toute échappatoire » rendent la disparition totale des possibilités de fuite.
