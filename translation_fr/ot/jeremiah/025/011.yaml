  text: וְ/הָֽיְתָה֙ כָּל הָ/אָ֣רֶץ הַ/זֹּ֔את לְ/חָרְבָּ֖ה לְ/שַׁמָּ֑ה וְ/עָ֨בְד֜וּ הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה אֶת מֶ֥לֶךְ בָּבֶ֖ל שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/011.yaml
  text: And all this land will become a ruin and a horror[a], and these nations will serve the king of Babylon for seventy years.
translation:
  language: fr
  text: Et tout ce pays deviendra un champ de ruines et un objet d’épouvante[a], et ces nations serviront le roi de Babylone pendant soixante-dix ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet d’horreur » ; le terme souligne la réaction d’effroi suscitée par la dévastation du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Et … deviendra
  rationale: Dans ce discours prophétique, la forme verbale décrit un état futur résultant du jugement ; « deviendra » l’exprime naturellement en français.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: tout ce pays
  rationale: Dans le contexte immédiat, אֶרֶץ désigne le pays soumis au jugement plutôt que la terre entière ; « tout ce pays » conserve le quantificateur et le démonstratif.
- source_word: לְחָרְבָּה
  choice: un champ de ruines
  rationale: Le nom évoque un territoire ravagé. Cette expression française concrète et naturelle rend mieux l’état de dévastation que le peu idiomatique « une ruine » appliqué à tout un pays.
- source_word: לְשַׁמָּה
  choice: un sujet d’épouvante
  rationale: Le terme désigne à la fois l’état effroyable du pays et la réaction horrifiée qu’il provoque ; la formulation française maintient cette nuance.
- source_word: וְעָבְדוּ
  choice: serviront
  rationale: Avec le roi comme complément direct, עבד exprime le service imposé ou la soumission politique ; « serviront » reste direct sans expliciter davantage que l’hébreu.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ces nations
  rationale: גּוֹיִם désigne ici les entités politiques ou les peuples placés sous la domination babylonienne ; « nations » convient au contexte.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction directe et usuelle du groupe nominal hébreu.
- source_word: שִׁבְעִים שָׁנָה
  choice: pendant soixante-dix ans
  rationale: « Pendant » exprime naturellement en français la durée indiquée par le syntagme hébreu.
theological_decisions:
- issue: Étendue du « pays » visé par le jugement
  choice: Le pays de la région concernée par l’oracle
  alternative: La terre entière, ou « toute la terre » dans un sens hyperbolique
  rationale: Le contexte porte sur Juda et les nations voisines soumises à Babylone. « Pays » évite d’universaliser indûment la portée géographique de l’oracle.
- issue: Nature du service rendu au roi de Babylone
  choice: Conserver le verbe général « servir »
  alternative: Expliciter par « seront soumis au roi de Babylone »
  rationale: Le contexte implique une domination politique, mais le verbe hébreu garde le lexème de service ; la traduction préserve cette formulation et sa portée potentielle.
translation_notes:
  register: Français moderne, international et digne. « Champ de ruines » rend concrètement la dévastation à l’échelle d’un pays ; « sujet d’épouvante » conserve la réaction suscitée par celle-ci. La coordination répétée respecte le rythme prophétique de l’hébreu.
