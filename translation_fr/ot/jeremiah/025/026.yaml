base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/026.yaml
  text: and all the kings of the north[a], both near and far, each one with his brother, and all the kingdoms of the earth that are on the face of the ground. And the king of Sheshach will drink after them.
translation:
  language: fr
  text: Et tous les rois du nord, proches et lointains, les uns avec les autres, et tous les royaumes de la terre qui se trouvent à la surface du sol. Le roi de Shéshak[a] boira après eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shéshak est généralement compris comme un nom crypté de Babylone, probablement formé au moyen du procédé appelé atbash, qui remplace chaque lettre par la lettre correspondante prise depuis l’autre extrémité de l’alphabet.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְכֵי הַצָּפוֹן
  choice: les rois du nord
  rationale: Cette construction génitive directe conserve le sens géographique sans préciser abusivement une région particulière.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: proches ou lointains
  rationale: Cette formulation française naturelle rend les deux pôles de l’expression hébraïque et son idée d’exhaustivité.
- source_word: אִישׁ אֶל אָחִיו
  choice: chacun avec son voisin
  rationale: Littéralement, l’expression évoque chacun par rapport à son « frère ». Ici, « voisin » conserve l’idée de proximité ou de juxtaposition entre les rois sans imposer le sens temporel plus interprétatif de « l’un après l’autre ».
- source_word: כָּל הַמַּמְלְכוֹת הָאָרֶץ
  choice: tous les royaumes de la terre
  rationale: Le contexte élargit la portée à l’ensemble des royaumes, et « terre » rend naturellement אֶרֶץ.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: qui se trouvent à la surface du sol
  rationale: La formulation garde l’expression hébraïque de totalité géographique et distingue אֲדָמָה, « sol », de אֶרֶץ, « terre », dans la proposition précédente.
- source_word: שֵׁשַׁךְ
  choice: Shéshak
  rationale: Le nom opaque du texte hébreu est translittéré plutôt que remplacé par son identification probable avec Babylone.
- source_word: יִשְׁתֶּה אַחֲרֵיהֶם
  choice: boira après eux
  rationale: Cette traduction maintient la succession temporelle et prolonge implicitement l’image de la coupe présente dans le contexte, sans ajouter « la coupe » au verset.
theological_decisions:
- issue: Identité de Shéshak
  choice: Conserver « Shéshak » dans le texte et signaler en note son identification probable avec Babylone.
  alternative: Remplacer directement « Shéshak » par « Babylone » dans le texte.
  rationale: Le texte massorétique porte שֵׁשַׁךְ et non בָּבֶל. Garder ce nom préserve l’opacité voulue du texte source, tandis que la note fournit l’information nécessaire sans transformer une identification probable en équivalence explicite.
- issue: Sens de אִישׁ אֶל אָחִיו
  choice: Rendre l’expression par « chacun avec son voisin ».
  alternative: « l’un après l’autre » ou, littéralement, « chacun avec son frère ».
  rationale: Dans cette énumération, le terme ne désigne vraisemblablement pas une fraternité biologique. « Voisin » préserve mieux l’idée relationnelle ou spatiale sans trancher en faveur d’une succession temporelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la longue énumération du texte hébreu. « Puis » assure une transition française naturelle vers la dernière proposition sans renforcer « après eux » en « en dernier ».
