base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/020.yaml
  text: and all the mixed people[a], and all the kings of the land of Uz, and all the kings of the land of the Philistines—Ashkelon, Gaza, Ekron, and the remnant of Ashdod[c][b];
translation:
  language: fr
  text: et toute la population mêlée[a], tous les rois du pays d’Uts, tous les rois du pays des Philistins[b], et Ashkelon, Gaza, Ékron et le reste d’Ashdod[c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la multitude mêlée » ; il s’agit peut-être d’une population étrangère d’origines diverses plutôt que d’un groupe ethnique précis.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le pays des Philistins » ; traditionnellement : « la Philistie ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « ce qui reste d’Ashdod » ou « les survivants d’Ashdod ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶרֶב
  choice: les peuples mêlés
  rationale: Le terme désigne probablement ici une population d’origines diverses plutôt qu’un groupe ethnique précis. Le pluriel collectif est naturel en français dans cette liste de peuples et de royaumes.
- source_word: מַלְכֵי אֶרֶץ הָעוּץ
  choice: les rois du pays d’Outs
  rationale: אֶרֶץ a ici son sens géopolitique courant de « pays », et Outs est conservé comme nom propre selon l’usage biblique français.
- source_word: מַלְכֵי אֶרֶץ פְּלִשְׁתִּים
  choice: les rois du pays des Philistins
  rationale: Cette formulation transparente conserve l’expression ethno-géographique de l’hébreu sans la remplacer dans le texte par « Philistie ».
- source_word: אַשְׁקְלוֹן
  choice: Ashkelon
  rationale: Transcription moderne et reconnaissable du nom de la ville philistine.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forme française courante du nom de lieu.
- source_word: עֶקְרוֹן
  choice: Éqron
  rationale: Transcription française moderne du nom de la ville, avec accent initial pour guider la prononciation.
- source_word: שְׁאֵרִית אַשְׁדּוֹד
  choice: ce qui reste d’Ashdod
  rationale: Cette traduction préserve l’indétermination de שְׁאֵרִית, qui peut viser le reste de la population ou de la cité-État, sans imposer exclusivement l’idée de survivants.
