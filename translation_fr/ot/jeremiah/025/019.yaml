  text: אֶת פַּרְעֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם וְ/אֶת עֲבָדָ֥י/ו וְ/אֶת שָׂרָ֖י/ו וְ/אֶת כָּל עַמּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/019.yaml
  text: Pharaoh king of Egypt, his servants, his officials, and all his people;
translation:
  language: fr
  text: Pharaon, roi d’Égypte, ses serviteurs, ses hauts fonctionnaires et tout son peuple ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Titre royal employé comme nom propre, rendu selon la forme française consacrée.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: roi d’Égypte
  rationale: La chaîne construite identifie Pharaon comme souverain de l’Égypte ; l’apposition sans article est naturelle en français.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עֶבֶד peut désigner un serviteur, un esclave ou un membre du service royal. Ici, « serviteurs » conserve cette portée générale sans imposer un statut servile précis.
- source_word: שָׂרָיו
  choice: ses hauts fonctionnaires
  rationale: שַׂר désigne des responsables de haut rang, tels que dignitaires, chefs ou officiers. « Hauts fonctionnaires » exprime clairement leur rôle politique sans les présenter comme des fils de roi.
- source_word: כָּל עַמּוֹ
  choice: tout son peuple
  rationale: Rendu direct et idiomatique du collectif עַם, avec la totalité exprimée par כָּל.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: coordination française en liste
  rationale: La répétition du marqueur d’objet structure les éléments dépendant du verbe dans la phrase élargie. Le français ne l’exprime pas et coordonne naturellement les groupes nominaux.
