  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנֵּ֥ה רָעָ֛ה יֹצֵ֖את מִ/גּ֣וֹי אֶל גּ֑וֹי וְ/סַ֣עַר גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/032.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], disaster is going out from nation to nation[c][b], and a great storm is being stirred up from the farthest parts of the earth.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : Voici, un désastre se propage d’une nation à l’autre[a], et une grande tempête se lève des régions les plus reculées de la terre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’une nation à une nation »; autre traduction : « de nation en nation ».'
    reason: alternative_reading
  - marker: b
    text: 'Autres traductions : « des confins de la terre », « des extrémités de la terre » ou « des régions les plus lointaines de la terre ». L’expression hébraïque désigne les régions extrêmes et éloignées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Rend la formule prophétique consacrée avec une cadence solennelle, naturelle en français biblique moderne.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par « armées », terme clair qui évoque les puissances placées sous le commandement divin.
- source_word: הִנֵּה
  choice: Voici
  rationale: Préserve la force présentative et l’urgence prophétique sans archaïsme excessif.
- source_word: רָעָה
  choice: un désastre
  rationale: Dans ce contexte de jugement, le mot désigne un malheur destructeur plutôt que le mal moral.
- source_word: יֹצֵאת מִגּוֹי אֶל גּוֹי
  choice: se propage d’une nation à l’autre
  rationale: Le participe présente une action en cours, tandis que la tournure exprime clairement son extension successive parmi les nations.
- source_word: סַעַר גָּדוֹל
  choice: une grande tempête
  rationale: Restitue directement l’image d’une violente tempête liée au jugement.
- source_word: יֵעוֹר
  choice: se lève
  rationale: Expression française naturelle pour une tempête qui s’éveille ou est soulevée; elle conserve la vivacité prophétique, même si une forme future reste possible.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: des régions les plus reculées de la terre
  rationale: Exprime les confins éloignés de la terre sans réduire l’image à une formule moins précise.
theological_decisions:
- issue: Sens de רָעָה dans une parole de jugement divin
  choice: désastre
  alternative: mal; malheur
  rationale: Le contexte indique une calamité de jugement. « Mal » risquerait en français d’évoquer le mal moral, tandis que « désastre » préserve ici le sens contextuel.
- issue: Valeur temporelle de יֵעוֹר
  choice: 'présent prophétique : « se lève »'
  alternative: 'futur : « se lèvera »; passif : « est soulevée »'
  rationale: Le présent maintient la scène vive introduite par « Voici » sans nier que l’accomplissement puisse être imminent ou futur.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la cadence prophétique, le nom divin Yahweh et l’image de la tempête, tout en évitant les tournures inutilement archaïques.
