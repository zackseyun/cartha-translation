source:
  edition: WLC
  text: הִנְ/נִ֣י שֹׁלֵ֡חַ וְ/לָקַחְתִּי֩ אֶת כָּל מִשְׁפְּח֨וֹת צָפ֜וֹן נְאֻם יְהוָ֗ה וְ/אֶל נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶל֮ עַבְדִּ/י֒ וַ/הֲבִ֨אֹתִ֜י/ם עַל הָ/אָ֤רֶץ הַ/זֹּאת֙ וְ/עַל יֹ֣שְׁבֶ֔י/הָ וְ/עַ֛ל כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה סָבִ֑יב וְ/הַ֣חֲרַמְתִּ֔י/ם וְ/שַׂמְתִּי/ם֙ לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה וּ/לְ/חָרְב֖וֹת עוֹלָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/009.yaml
  text: Look[a], I am sending for and taking all the clans of the north, declares Yahweh, and Nebuchadnezzar king of Babylon, my servant, and I will bring them against this land and against its inhabitants and against all these surrounding nations[b]. I will devote them to destruction and make them a horror, a hissing[c], and everlasting ruins.
translation:
  language: fr
  text: « Voici que je vais envoyer chercher toutes les populations du nord, déclare Yahweh, ainsi que Nebucadnetsar, roi de Babylone, mon serviteur[a]. Je les ferai venir contre ce pays, contre ses habitants et contre toutes les nations qui l’entourent. Je les vouerai à la destruction[b] et je ferai d’eux un sujet d’effroi[c], un objet de sifflements et des ruines à jamais. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « mon serviteur » présente Nebucadnetsar comme un instrument dont Yahweh se sert pour accomplir son dessein; l’expression n’affirme pas nécessairement qu’il est un adorateur fidèle.
    reason: cultural_note
  - marker: b
    text: Ou « je les détruirai complètement ». Le verbe hébreu peut désigner le fait de placer des personnes ou des choses sous interdit, en les vouant à la destruction.
    reason: lexical_alternative
  - marker: c
    text: Ou « une désolation ». Le mot hébreu peut désigner aussi bien l’état de désolation que l’effroi qu’il inspire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici que
  rationale: Cette formule attire solennellement l’attention sur l’action imminente de Dieu. « Voici que » conserve cette fonction sans donner à la phrase le sens d’une simple présentation de soi.
- source_word: שֹׁלֵחַ וְלָקַחְתִּי
  choice: je vais envoyer chercher
  rationale: L’expression décrit une convocation suivie du rassemblement des forces du nord. La tournure française rend l’imminence et l’unité de l’action plus naturellement qu’un calque de deux verbes coordonnés.
- source_word: מִשְׁפְּחוֹת צָפוֹן
  choice: toutes les populations du nord
  rationale: מִשְׁפָּחוֹת désigne ici des groupes humains ou ethnopolitiques, et non de simples foyers domestiques. « Populations » évite de leur imposer une organisation précise en clans ou en tribus.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique avec solennité et conserve le nom divin personnel.
- source_word: וְאֶל נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל עַבְדִּי
  choice: ainsi que Nebucadnetsar, roi de Babylone, mon serviteur
  rationale: La coordination hébraïque inclut Nebucadnetsar dans la convocation tout en produisant une syntaxe difficile si elle est calquée. « Ainsi que » rend cette inclusion clairement; « mon serviteur » est conservé sans atténuation.
- source_word: וַהֲבִאֹתִים
  choice: Je les ferai venir
  rationale: Le causatif exprime que Yahweh conduit ces forces contre les peuples visés. Le futur rend la suite annoncée de l’action.
- source_word: וְהַחֲרַמְתִּים
  choice: Je les vouerai à l’anéantissement
  rationale: Le verbe חרם peut désigner la mise à part sous interdit en vue de la destruction. Cette formulation conserve sa force technique sans employer le jargon peu transparent de « mettre au ban ».
- source_word: לְשַׁמָּה
  choice: un spectacle effroyable
  rationale: Le nom peut évoquer à la fois la dévastation et l’effroi qu’elle suscite chez ceux qui la voient. Cette traduction convient à la série des conséquences publiques du jugement.
- source_word: לִשְׁרֵקָה
  choice: un objet de sifflements
  rationale: Le sifflement est une réaction publique devant le désastre, susceptible d’exprimer stupeur ou dérision. L’image concrète de l’hébreu est préservée.
- source_word: לְחָרְבוֹת עוֹלָם
  choice: des ruines à jamais
  rationale: Formulation française concise qui maintient la portée durable, voire indéfinie, de עוֹלָם dans cette annonce de jugement.
theological_decisions:
- issue: Nebucadnetsar appelé « mon serviteur »
  choice: Conserver littéralement le titre et expliquer qu’il désigne ici l’instrument du dessein de Yahweh.
  alternative: Comprendre ce titre comme l’affirmation de la piété personnelle ou de la fidélité à l’alliance de Nebucadnetsar.
  rationale: Le contexte présente le roi de Babylone comme l’agent souverainement employé pour exécuter le jugement. Le texte ne permet pas à lui seul de conclure à son adhésion fidèle à Yahweh.
- issue: Portée de חרם
  choice: « vouer à l’anéantissement »
  alternative: « détruire complètement »
  rationale: La traduction choisie garde la notion de mise sous interdit vouée à la destruction, sans réduire le verbe à une simple indication d’intensité.
- issue: Ambiguïté de שַׁמָּה
  choice: « un spectacle effroyable » dans le texte, avec l’alternative « une dévastation » en note
  alternative: « une dévastation » uniquement
  rationale: Le terme peut désigner l’état dévasté ou l’horreur qu’il provoque. Le texte et la note préservent ensemble cette amplitude sémantique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe a été légèrement réorganisée pour rendre intelligible la longue coordination hébraïque, tout en conservant la solennité de l’oracle, le nom « Yahweh », l’image des sifflements et les ambiguïtés lexicales significatives.
