  naturalness: Le français est globalement clair et soutenu. « Sujet d’effroi » offre une formulation plus directe et idiomatique dans la série « sujet d’effroi, objet de sifflements, ruines à jamais ».
  terminology: Yahweh, Nebucadnetsar, Babylone et « mon serviteur » sont cohérents. « Vouer à la destruction » préserve mieux le sens technique de חרם tout en restant naturel; la note explicite la notion d’interdit.
