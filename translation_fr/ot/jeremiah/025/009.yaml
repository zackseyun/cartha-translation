  to: « Voici que je vais envoyer chercher toutes les populations du nord, déclare Yahweh, ainsi que Nebucadnetsar, roi de Babylone, mon serviteur[a]. Je les ferai venir contre ce pays, contre ses habitants et contre toutes les nations qui l’entourent. Je les vouerai à la destruction[b] et je ferai d’eux un sujet d’effroi[c], un objet de sifflements et des ruines à jamais. »
