base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/005.yaml
  text: saying[a], ‘Please turn back, each man from his evil way and from the evil of your deeds[b], and dwell in the land that Yahweh gave to you and to your fathers from of old and forever.’
translation:
  language: fr
  text: 'en disant : « Revenez, je vous en prie, chacun de sa mauvaise voie et de la méchanceté de vos actes, et habitez sur la terre que Yahvé vous a donnée, à vous et à vos pères, depuis les temps anciens et pour toujours. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif construit introduit ici le contenu répété du message prophétique; « en disant » conserve cette articulation avec le verset précédent.
- source_word: שׁוּבוּ נָא
  choice: Revenez donc
  rationale: שׁוּב exprime le retour, avec une portée morale dans ce contexte; נָא marque une exhortation pressante ou déférente plutôt qu’une indication temporelle. « donc » rend naturellement cette nuance sans imposer le sens de « maintenant ».
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: chacun de sa mauvaise voie
  rationale: אִישׁ a une valeur distributive après l’impératif pluriel. « Chacun » est naturel en français et le singulier « sa » conserve le passage distributif du pluriel au singulier. « Voie » maintient la métaphore biblique de la conduite.
- source_word: וּמֵרֹעַ מַעַלְלֵיכֶם
  choice: et de la méchanceté de vos actes
  rationale: Cette formulation rend le substantif abstrait רֹעַ ainsi que les actes concrets désignés par מַעֲלָלִים, tout en conservant le retour au pluriel « vos » du texte hébreu.
- source_word: וּשְׁבוּ עַל הָאֲדָמָה
  choice: et habitez sur la terre
  rationale: יָשַׁב désigne ici une habitation stable; « habitez » convient au contexte du don territorial. « Sur la terre » suit עַל et reste idiomatique en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente directement le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: à vous et à vos pères
  rationale: La répétition de « à » reflète les deux prépositions hébraïques. « Pères » conserve le vocabulaire familial et historique du texte.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: depuis les temps anciens et pour toujours
  rationale: L’expression présente une orientation rétrospective puis prospective. Cette traduction française conserve cette asymétrie temporelle sans transformer la formule en « d’éternité en éternité ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé », forme implantée en français, préserve le nom propre divin au lieu de le remplacer par un titre.
- issue: Portée de la promesse liée à la terre
  choice: depuis les temps anciens et pour toujours
  alternative: d’éternité en éternité
  rationale: La formulation garde ensemble l’ancienneté du don et sa projection durable, sans résoudre la tension entre la permanence exprimée et le contexte prophétique de jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les changements de nombre du texte hébreu (« chacun de sa… vos actes »), ainsi que la métaphore de la « voie ». Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
