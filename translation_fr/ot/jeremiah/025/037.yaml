id: JER.25.37
reference: Jeremiah 25:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָדַ֖מּוּ נְא֣וֹת הַ/שָּׁל֑וֹם מִ/פְּנֵ֖י חֲר֥וֹן אַף יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/037.yaml
  text: And the peaceful pastures are laid waste because of the burning anger of Yahweh[a].
translation:
  language: fr
  text: Les pâturages paisibles sont dévastés[a] à cause de l’ardente colère de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les pâturages de paix ». Le verbe peut aussi évoquer le fait d’être réduits au silence.'
    reason: La note préserve à la fois la tournure hébraïque formelle et la nuance possible du verbe דמם.
lexical_decisions:
- source_word: וְנָדַמּוּ
  choice: sont dévastés
  rationale: Le niphal de דמם peut évoquer le silence ou l’immobilité; appliqué ici aux pâturages sous l’effet du jugement divin, il décrit leur réduction à la désolation. « Sont dévastés » exprime naturellement ce résultat sans effacer entièrement l’idée d’un lieu rendu silencieux.
- source_word: נְאוֹת
  choice: pâturages
  rationale: Dans cette image pastorale, le terme désigne des lieux où paissent les troupeaux plutôt que des habitations au sens général.
- source_word: הַשָּׁלוֹם
  choice: paisibles
  rationale: Le groupe hébreu signifie littéralement « pâturages de paix ». « Pâturages paisibles » rend en français courant l’idée de tranquillité et de sécurité, tandis que la formulation littérale est conservée en note.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition indique ici la cause de la dévastation, non une relation spatiale.
- source_word: חֲרוֹן אַף
  choice: l’ardente colère
  rationale: Cette expression idiomatique hébraïque dépeint une colère intense au moyen de l’image de la chaleur; « ardente colère » conserve cette image en français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de l’image pastorale et de la métaphore de la colère ardente, tout en employant une syntaxe naturelle.
