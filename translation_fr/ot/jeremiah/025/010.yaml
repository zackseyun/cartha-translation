  text: וְ/הַאֲבַדְתִּ֣י מֵ/הֶ֗ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה ק֥וֹל רֵחַ֖יִם וְ/א֥וֹר נֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/010.yaml
  text: And I will destroy from among them the sound of joy and the sound of gladness[a], the voice of the bridegroom and the voice of the bride[b], the sound of the millstones and the light of the lamp.
translation:
  language: fr
  text: Je ferai disparaître de leur milieu les cris d’allégresse et les cris de joie[a], la voix du marié et la voix de la mariée[b], le bruit des meules et la lumière de la lampe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je mettrai fin à ces cris au milieu d’eux. » Le verbe hébreu est causatif : « faire périr » ou « faire disparaître ».'
    reason: lexical_alternative
  - marker: b
    text: « La voix du marié et la voix de la mariée » évoquent les célébrations de mariage, image traditionnelle de la vie normale d’une communauté.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: Je ferai disparaître
  rationale: 'Le hiphil de אבד exprime ici la causation : faire périr ou faire disparaître. Comme les compléments sont les sons et les signes de la vie ordinaire, « faire disparaître » restitue naturellement ce sens sans suggérer que des sons seraient matériellement détruits.'
- source_word: מֵהֶם
  choice: de leur milieu
  rationale: La préposition מן avec le pronom indique le retrait hors de leur sein. « De leur milieu » est idiomatique en français et situe la disparition au sein de la communauté.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: les cris d’allégresse et les cris de joie
  rationale: קוֹל peut désigner un son ou une voix. Avec les deux termes de réjouissance, « cris » exprime naturellement les manifestations audibles de la fête. « Allégresse » et « joie » maintiennent la paire hébraïque sans les confondre.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: la voix du marié et la voix de la mariée
  rationale: Avec des personnes, קוֹל signifie naturellement « voix ». « Marié » et « mariée » sont actuels et rendent l’image nuptiale sans archaïsme.
- source_word: קוֹל רֵחַיִם
  choice: le bruit des meules
  rationale: רֵחַיִם, de forme duelle, désigne les deux meules du moulin. « Le bruit des meules » évoque clairement l’activité domestique quotidienne.
- source_word: אוֹר נֵר
  choice: la lumière de la lampe
  rationale: La traduction directe du groupe construit conserve l’image concrète d’une habitation éclairée et, par extension, de la vie ordinaire.
theological_decisions:
- issue: Images du jugement prophétique
  choice: Conserver l’énumération concrète des manifestations de la vie communautaire et domestique qui disparaîtront.
  alternative: Résumer par une paraphrase telle que « Je ferai taire toute joie et toute activité ».
  rationale: Le texte hébreu fait ressentir la dévastation par la disparition progressive de voix, de bruits et de lumière. Garder ces images préserve la force du jugement sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « cris » puis de « voix » conserve le rythme de l’énumération hébraïque, tandis que « meules » et « lampe » maintiennent ses images concrètes de la vie quotidienne.
