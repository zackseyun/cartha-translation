id: JER.25.27
reference: Jeremiah 25:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁת֤וּ וְ/שִׁכְרוּ֙ וּ/קְי֔וּ וְ/נִפְל֖וּ וְ/לֹ֣א תָק֑וּמוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֵי/כֶֽםס־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/027.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Drink and become drunk, and vomit, and fall, and do not rise, because of the sword that I am sending among you.’'
translation:
  language: fr
  text: 'Tu leur diras : « Voici ce que dit Yahweh des armées, le Dieu d’Israël : Buvez, enivrez-vous, vomissez[a], tombez et ne vous relevez pas, à cause de l’épée que j’envoie au milieu de vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu rare peut aussi évoquer le fait de recracher ou de rejeter ce qui a été bu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Tu leur diras
  rationale: Le waw suivi de l’accompli prend ici une valeur directive dans le discours prophétique. Le futur français exprime naturellement la mission confiée à Jérémie.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française actuelle et digne rend la formule du messager prophétique tout en conservant l’immédiateté de la parole divine.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » transcrit le nom divin, tandis que « des armées » rend צְבָאוֹת dans ce titre et évoque les forces placées sous son commandement.
- source_word: שְׁתוּ וְשִׁכְרוּ
  choice: Buvez, enivrez-vous
  rationale: Les deux impératifs pluriels sont rendus directement; « enivrez-vous » exprime le fait de devenir ivre dans un registre soutenu mais courant.
- source_word: וּקְיוּ
  choice: vomissez
  rationale: Ce verbe rare désigne l’action de vomir ou de rejeter ce qui a été bu. « Vomissez » est l’équivalent français le plus direct et le plus clair.
- source_word: וְנִפְלוּ וְלֹא תָקוּמוּ
  choice: tombez et ne vous relevez pas
  rationale: La traduction conserve l’enchaînement littéral et laisse au contexte l’idée d’une chute irréversible, sans ajouter « jamais » ou « de nouveau ».
- source_word: מִפְּנֵי הַחֶרֶב
  choice: à cause de l’épée
  rationale: Dans ce contexte, la locution introduit la cause de leur chute et de leur incapacité à se relever.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ בֵּינֵיכֶם
  choice: que j’envoie au milieu de vous
  rationale: « Au milieu de vous » préserve la nuance spatiale de בֵּינֵיכֶם et l’image de l’épée qui se déploie parmi les peuples.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; sa transcription préserve le caractère personnel du nom divin plutôt que de lui substituer un titre.
- issue: Portée de l’image de l’ivresse
  choice: Conserver la suite concrète des impératifs sans l’expliquer dans le corps du texte
  alternative: Expliciter qu’il s’agit de l’ivresse provoquée par le jugement divin
  rationale: Le contexte de la coupe et de l’épée fournit l’interprétation, mais le verset maintient volontairement l’image saisissante de l’ivresse et de la chute.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier s’adresse à Jérémie, tandis que les impératifs au pluriel visent les peuples. La coordination a été légèrement allégée en français sans modifier la succession des actions.
