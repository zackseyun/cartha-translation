source:
  edition: WLC
  text: וְ/הָיָ֣ה כִ/מְלֹ֣אות שִׁבְעִ֣ים שָׁנָ֡ה אֶפְקֹ֣ד עַל מֶֽלֶךְ בָּבֶל֩ וְ/עַל הַ/גּ֨וֹי הַ/ה֧וּא נְאֻם יְהוָ֛ה אֶת עֲוֺנָ֖/ם וְ/עַל אֶ֣רֶץ כַּשְׂדִּ֑ים וְ/שַׂמְתִּ֥י אֹת֖/וֹ לְ/שִֽׁמְמ֥וֹת עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/012.yaml
  text: And when seventy years are completed[a], I will punish the king of Babylon and that nation—oracle of Yahweh—for their iniquity, and the land of the Chaldeans[b], and I will make it an everlasting desolation.
translation:
  language: fr
  text: Quand les soixante-dix ans seront accomplis, je punirai, pour leur faute, le roi de Babylone et cette nation — déclaration de Yahvé —, ainsi que le pays des Chaldéens, et j’en ferai une désolation perpétuelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des désolations pour toujours »; le pluriel hébreu est rendu ici par un singulier abstrait naturel en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִמְלֹאות שִׁבְעִים שָׁנָה
  choice: Quand les soixante-dix ans seront accomplis
  rationale: La construction introduit le moment futur où les soixante-dix ans seront arrivés à leur terme. Cette formulation française est naturelle et conserve la valeur temporelle.
- source_word: אֶפְקֹד עַל
  choice: je punirai
  rationale: Dans ce contexte de jugement, פקד avec עַל signifie demander compte ou infliger une sanction. « Punir » exprime clairement ce sens.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction directe de la chaîne construite hébraïque.
- source_word: הַגּוֹי הַהוּא
  choice: cette nation
  rationale: גוי désigne ici Babylone comme entité politique; « nation » convient au contexte géopolitique.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: Cette formule nominale conserve le caractère solennel de la formule prophétique sans la transformer en proposition verbale.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française traditionnelle et reconnaissable du nom divin représenté par le tétragramme.
- source_word: אֶת עֲוֺנָם
  choice: pour leur faute
  rationale: עון peut désigner la faute, la culpabilité ou ses conséquences. Ici, il indique le motif moral de la punition; « faute » reste clair sans surcharger le registre.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: le pays des Chaldéens
  rationale: Conserve la désignation ethnique et historique du texte hébreu.
- source_word: וְשַׂמְתִּי אֹתוֹ
  choice: et j’en ferai
  rationale: La tournure française rend naturellement שׂים suivi d’un complément d’état. Le pronom singulier renvoie le plus directement au « pays ».
- source_word: לְשִׁמְמוֹת עוֹלָם
  choice: une désolation perpétuelle
  rationale: Le pluriel hébreu שִׁמְמוֹת a ici une valeur abstraite ou intensive que le singulier français rend plus naturellement; עוֹלָם exprime la durée indéfinie et durable du jugement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. Le rendre par « Yahvé » le distingue d’un simple titre tout en employant sa forme française courante.
- issue: Référent du pronom singulier אֹתוֹ
  choice: Le pronom renvoie principalement au pays des Chaldéens.
  alternative: Le pronom pourrait résumer collectivement le roi, la nation et le pays comme une seule entité jugée.
  rationale: « Pays » est l’antécédent singulier le plus proche, et le fait qu’un pays devienne une désolation forme une image cohérente dans ce contexte.
- issue: Portée de אֶפְקֹד עַל
  choice: Le même jugement atteint le roi, la nation et le pays.
  alternative: Répéter explicitement le verbe devant « le pays des Chaldéens ».
  rationale: La syntaxe coordonne les objets du jugement. La formulation française « ainsi que » maintient cette portée sans ajouter un second verbe absent de l’hébreu.
translation_notes:
  register: Français international moderne, solennel mais accessible. L’incise « déclaration de Yahvé » préserve la formule prophétique nominale. La ponctuation clarifie la longue phrase hébraïque sans en modifier les relations syntaxiques.
