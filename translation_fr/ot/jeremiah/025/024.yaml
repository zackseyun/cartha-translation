  text: and all the kings of Arabia[a], and all the kings of the mixed peoples who dwell in the wilderness[b];
translation:
  language: fr
  text: tous les rois d’Arabie, et tous les rois des populations mêlées[a] qui habitent dans le désert[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la troupe mêlée » ou « de la multitude mêlée ». L’hébreu distingue ce groupe de l’« Arabie » mentionnée dans l’expression précédente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans la région sauvage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי
  choice: rois de / rois des
  rationale: Le pluriel construit de מֶלֶךְ régit les noms de groupes qui suivent ; cette tournure est naturelle en français.
- source_word: עֲרָב
  choice: Arabie
  rationale: Le nom propre désigne ici la région ou ses peuples dans une liste géopolitique ; « Arabie » convient au contexte.
- source_word: הָעֶרֶב
  choice: les populations mêlées
  rationale: Ce terme, distinct de עֲרָב dans le membre précédent, désigne vraisemblablement un ensemble humain composite. « Populations mêlées » préserve cette distinction sans identifier plus précisément le groupe.
- source_word: הַשֹּׁכְנִים
  choice: qui habitent
  rationale: Le participe qal pluriel de ישׁב qualifie les populations mentionnées ; « qui habitent » est clair et naturel.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région aride ou inhabitée. « Désert » est ici idiomatique en français moderne.
- source_word: וְאֵת ... וְאֵת
  choice: et… et
  rationale: Les conjonctions et marqueurs d’objet poursuivent l’énumération ; le français conserve la coordination, sans traduire les marqueurs d’objet.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le contraste lexical entre עֲרָב (« Arabie ») et הָעֶרֶב (« populations mêlées ») est conservé. Le point-virgule signale que le verset appartient à une énumération plus longue.
