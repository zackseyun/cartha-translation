source:
  edition: WLC
  text: כִּי֩ הִנֵּ֨ה בָ/עִ֜יר אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלֶ֗י/הָ אָֽנֹכִי֙ מֵחֵ֣ל לְ/הָרַ֔ע וְ/אַתֶּ֖ם הִנָּקֵ֣ה תִנָּק֑וּ לֹ֣א תִנָּק֔וּ כִּ֣י חֶ֗רֶב אֲנִ֤י קֹרֵא֙ עַל כָּל יֹשְׁבֵ֣י הָ/אָ֔רֶץ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/029.yaml
  text: For behold[a], in the city over which my name is called, I am beginning to bring harm, and shall you indeed go unpunished? You shall not go unpunished, for I am calling for a sword against all the inhabitants of the earth[b], declares Yahweh of hosts.
translation:
  language: fr
  text: 'Car voici : dans la ville sur laquelle mon nom est invoqué[a], je commence à faire venir le malheur. Et vous, serez-vous vraiment impunis ? Vous ne resterez pas impunis, car je convoque l’épée contre tous les habitants de la terre[b], déclare Yahweh des armées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la ville qui porte mon nom ». L’expression hébraïque signifie littéralement « dans la ville sur laquelle mon nom est invoqué ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les habitants du pays ». Le mot hébreu peut désigner soit le pays, soit la terre entière.
    reason: alternative_reading
lexical_decisions:
- source_word: בָעִיר אֲשֶׁר נִקְרָא שְׁמִי עָלֶיהָ
  choice: dans la ville sur laquelle mon nom est invoqué
  rationale: Cette formulation conserve l’image hébraïque d’un nom invoqué sur une ville, signe d’appartenance, tout en restant compréhensible en français. La tournure plus idiomatique « la ville qui porte mon nom » est signalée en note.
- source_word: מֵחֵל לְהָרַע
  choice: je commence à faire venir le malheur
  rationale: La construction exprime le commencement d’une action. Dans ce contexte de jugement, רעה désigne un malheur ou une calamité, non une faute morale commise par Dieu.
- source_word: הִנָּקֵה תִנָּקוּ
  choice: resteriez-vous vraiment impunis ?
  rationale: L’infinitif absolu renforce la forme verbale. « Vraiment » restitue cette intensification, tandis que « rester impunis » exprime naturellement le sens judiciaire du nifal de נקה.
- source_word: לֹא תִנָּקוּ
  choice: Vous ne resterez pas impunis
  rationale: La répétition du même rendu lexical maintient le lien rhétorique direct avec la question précédente.
- source_word: חֶרֶב אֲנִי קֹרֵא
  choice: j’appelle l’épée
  rationale: Ce rendu préserve la personnification concrète de l’épée comme instrument de jugement convoqué par Dieu, sans l’aplatir en « guerre ».
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: tous les habitants de la terre
  rationale: Le contexte élargi aux nations favorise la portée universelle de « terre », mais le sens régional « pays » demeure possible et est conservé en note.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclare Yahweh des armées
  rationale: « Déclare » rend naturellement la formule prophétique נְאֻם. « Yahweh » représente le nom divin, et « des armées » conserve l’image du titre צְבָאוֹת.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée morale ou calamiteuse de לְהָרַע
  choice: faire venir le malheur
  alternative: faire le mal ; provoquer le désastre
  rationale: Dans ce contexte judiciaire, le verbe désigne la calamité infligée en jugement. Ce choix évite d’attribuer à Dieu une faute morale tout en préservant la dureté de l’énoncé.
- issue: Étendue de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte du chapitre, qui vise plusieurs nations, soutient une portée étendue, sans supprimer l’ambiguïté lexicale de אֶרֶץ, explicitée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression rhétorique de l’hébreu et sa répétition judiciaire. « Car voici » garde le relief de כִּי הִנֵּה sans recourir à une tournure archaïque.
