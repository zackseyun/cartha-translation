  text: and Dedan[a], and Tema, and Buz, and all who clip the corners of their hair,
translation:
  language: fr
  text: Dedân, Téma, Bouz et tous ceux qui se coupent les cheveux aux tempes[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les coupés du bord ». L’expression désigne probablement ceux qui coupent ou rasent les cheveux aux tempes ; elle peut aussi viser les bords de la barbe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּדָן
  choice: Dedân
  rationale: Nom propre d’un peuple ou d’un lieu, translittéré selon l’usage français.
- source_word: תֵּימָא
  choice: Téma
  rationale: Nom propre désignant vraisemblablement l’oasis ou le groupe tribal arabe de Téma; translittération française courante.
- source_word: בּוּז
  choice: Bouz
  rationale: Nom propre d’un peuple ou d’une région; la forme « Bouz » convient à la phonétique et à l’usage français.
- source_word: כָּל
  choice: tous ceux qui
  rationale: Cette formulation exprime naturellement en français le quantificateur inclusif appliqué à un groupe caractérisé par une pratique.
- source_word: קְצוּצֵי
  choice: se coupent
  rationale: Le terme vient du verbe « couper, retrancher »; une tournure verbale française rend clairement la désignation participiale du groupe.
- source_word: פֵאָה
  choice: les cheveux sur les côtés
  rationale: Le mot signifie littéralement « bord, extrémité, coin ». Dans cet emploi ethnographique, il paraît désigner les cheveux situés sur les côtés, sans que le texte précise entièrement la pratique.
