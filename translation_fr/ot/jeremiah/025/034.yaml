id: JER.25.34
reference: Jeremiah 25:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵילִ֨ילוּ הָ/רֹעִ֜ים וְ/זַעֲק֗וּ וְ/הִֽתְפַּלְּשׁוּ֙ אַדִּירֵ֣י הַ/צֹּ֔אן כִּֽי מָלְא֥וּ יְמֵי/כֶ֖ם לִ/טְב֑וֹחַ וּ/תְפוֹצ֣וֹתִי/כֶ֔ם וּ/נְפַלְתֶּ֖ם כִּ/כְלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/034.yaml
  text: Wail[a], you shepherds, and cry out; roll in the dust, you lords of the flock, for the days of your slaughter are fulfilled[b], and your dispersions have come[e][d][c], and you will fall like a precious vessel.
translation:
  language: fr
  text: Lamentez-vous[a], bergers, et poussez des cris ! Roulez-vous dans la poussière[b], puissants du troupeau[c], car vos jours destinés à l’égorgement sont arrivés à leur terme, et le temps de vos dispersions est venu[d]. Vous tomberez comme un vase précieux[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hurlez ». Le verbe hébreu désigne une lamentation poussée à grands cris.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « roulez-vous » ou « vautrez-vous ». Il s’agit probablement d’un geste de deuil consistant à se rouler dans la poussière ou la cendre.
    reason: cultural_note
  - marker: c
    text: Ou « nobles du troupeau » ou « chefs du troupeau ».
    reason: lexical_alternative
  - marker: d
    text: L’hébreu, littéralement « et vos dispersions », est difficile. On peut aussi comprendre que les jours fixés pour leur égorgement et leur dispersion sont arrivés à leur terme.
    reason: alternative_reading
  - marker: e
    text: Ou « comme un objet de prix ». Le mot traduit par « vase » peut désigner divers objets ou récipients; l’image évoque un objet apprécié qui tombe et risque de se briser.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Lamentez-vous
  rationale: L’impératif désigne une lamentation forte et audible. « Lamentez-vous » convient au registre prophétique sans atténuer la détresse; la note précise la nuance de hurlement.
- source_word: הָרֹעִים
  choice: bergers
  rationale: Le terme désigne littéralement les bergers. L’image pastorale, qui évoque ici les dirigeants, est conservée plutôt qu’explicitée dans le texte.
- source_word: וְזַעֲקוּ
  choice: et poussez des cris
  rationale: זעק exprime un cri puissant, souvent provoqué par la détresse. Cette formulation française est naturelle et maintient l’intensité.
- source_word: וְהִתְפַּלְּשׁוּ
  choice: Roulez-vous dans la poussière
  rationale: La forme réfléchie évoque vraisemblablement le fait de se rouler par terre en signe de deuil ou d’humiliation. « Dans la poussière » explicite sobrement le geste implicite.
- source_word: אַדִּירֵי הַצֹּאן
  choice: puissants du troupeau
  rationale: אַדִּיר peut désigner ceux qui sont puissants, éminents ou nobles. « Puissants » conserve leur rang et leur autorité tout en maintenant la métaphore du troupeau.
- source_word: כִּי מָלְאוּ יְמֵיכֶם לִטְבוֹחַ
  choice: car vos jours destinés à l’égorgement sont arrivés à leur terme
  rationale: La formulation rend l’idée littérale de jours devenus pleins ou accomplis en vue de l’égorgement, dans un français clair et solennel.
- source_word: וּתְפוֹצוֹתִיכֶם
  choice: et le temps de votre dispersion est venu
  rationale: Le mot nominal signifie « vos dispersions » ou « votre dispersion », mais la construction est difficile. La formulation française reprend le parallélisme temporel de la proposition précédente sans dissimuler l’incertitude, signalée en note.
- source_word: וּנְפַלְתֶּם
  choice: Vous tomberez
  rationale: Dans ce contexte d’annonce du jugement, le parfait précédé de waw a une valeur future ou résultative.
- source_word: כִּכְלִי חֶמְדָּה
  choice: comme un vase précieux
  rationale: כְּלִי désigne un récipient, un objet ou un ustensile, et חֶמְדָּה ce qui est désirable ou précieux. « Vase précieux » conserve l’image d’un objet de valeur susceptible de tomber et de se briser.
theological_decisions:
- issue: Référent métaphorique des « bergers » et des « puissants du troupeau »
  choice: Conserver intégralement l’image pastorale dans le texte principal.
  alternative: Traduire explicitement par « dirigeants », « chefs » ou « souverains ».
  rationale: Dans Jérémie, les bergers représentent souvent les responsables des peuples, mais le verset formule lui-même cette réalité sous forme de métaphore. La conserver évite d’imposer l’interprétation au texte.
- issue: Force de l’image de l’égorgement
  choice: Employer « égorgement ».
  alternative: Atténuer par « mort » ou « destruction ».
  rationale: Le verbe טבח évoque directement l’abattage ou l’égorgement. Le vocabulaire violent appartient à l’annonce du jugement et ne doit pas être adouci.
- issue: Rapport entre l’égorgement et la dispersion
  choice: Présenter deux aspects coordonnés du jugement tout en signalant en note la difficulté grammaticale du second.
  alternative: Refondre sans note en « le temps est venu pour vous d’être égorgés et dispersés ».
  rationale: Le substantif hébreu « vos dispersions » est inhabituel dans cette construction. Le texte retenu reste intelligible sans faire passer une interprétation unique pour certaine.
translation_notes:
  register: Français international moderne, digne et prophétique. Les impératifs sont vifs, la métaphore pastorale est préservée et la violence du jugement n’est pas atténuée. La ponctuation clarifie la progression sans effacer la difficulté syntaxique de וּתְפוֹצוֹתִיכֶם.
