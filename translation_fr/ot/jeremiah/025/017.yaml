id: JER.25.17
reference: Jeremiah 25:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֶקַּ֥ח אֶת הַ/כּ֖וֹס מִ/יַּ֣ד יְהוָ֑ה וָֽ/אַשְׁקֶה֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁר שְׁלָחַ֥/נִי יְהוָ֖ה אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/017.yaml
  text: So I took the cup from the hand of Yahweh and made all the nations to whom Yahweh had sent me drink[a][b].
translation:
  language: fr
  text: Je pris donc la coupe de la main de Yahweh[a] et je fis boire toutes les nations auxquelles Yahweh m’avait envoyé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main de Yahweh »; cette expression souligne que Jérémie reçoit directement la coupe de lui.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « et je donnai à boire à toutes les nations auxquelles Yahweh m’avait envoyé ». Le verbe hébreu est causatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Je pris donc
  rationale: Le wayyiqtol de לקח poursuit la séquence narrative. « donc » marque naturellement en français que Jérémie exécute l’ordre reçu au verset précédent.
- source_word: הַכּוֹס
  choice: la coupe
  rationale: Rend directement le nom défini כּוֹס sans expliciter ici son contenu ni sa valeur symbolique, déjà donnés par le contexte.
- source_word: מִיַּד יְהוָה
  choice: de la main de Yahweh
  rationale: Conserve l’image hébraïque concrète de la réception directe depuis la main de Dieu, plutôt que de la réduire à « de Yahweh ».
- source_word: וָאַשְׁקֶה
  choice: je fis boire
  rationale: Le hiphil de שׁקה est causatif. « faire boire » en exprime clairement la force et reste idiomatique en français.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici les nations visées par la série d’oracles; « nations » est précis et naturel.
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה אֲלֵיהֶם
  choice: auxquelles Yahweh m’avait envoyé
  rationale: La proposition relative se rattache sans ambiguïté à « toutes les nations ». Le plus-que-parfait indique naturellement que l’envoi précède l’action racontée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin YHWH. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Nature de l’action de faire boire les nations
  choice: Conserver la formulation causative et imagée
  alternative: Expliciter immédiatement qu’il s’agit d’une action prophétique symbolique ou d’un jugement
  rationale: Le verset affirme que Jérémie fait boire les nations, sans expliquer ici le mode d’accomplissement. La traduction préserve cette tension et laisse le contexte en préciser la portée.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit littéraire; « m’avait envoyé » évite le tour régional ou vieilli « vers lesquelles » tout en conservant le rapport spatial exprimé par אֲלֵיהֶם.
