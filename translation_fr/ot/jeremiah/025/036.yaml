id: JER.25.36
reference: Jeremiah 25:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֚וֹל צַעֲקַ֣ת הָֽ/רֹעִ֔ים וִֽ/ילְלַ֖ת אַדִּירֵ֣י הַ/צֹּ֑אן כִּֽי שֹׁדֵ֥ד יְהוָ֖ה אֶת מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/036.yaml
  text: The sound of the cry of the shepherds[a], and the wailing of the leaders of the flock[b], for Yahweh is devastating their pasture.
translation:
  language: fr
  text: On entend le cri des bergers et les lamentations des chefs du troupeau[a], car Yahweh dévaste leur pâturage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des puissants du troupeau » ou « des nobles du troupeau ».
    reason: lexical_alternative
  - marker: b
    text: L’image des bergers, du troupeau et du pâturage renvoie probablement aux dirigeants, à ceux qui leur sont confiés et au territoire où ils vivent.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹל צַעֲקַת
  choice: On entend le cri
  rationale: Littéralement « le son/la voix du cri ». Cette formulation française naturelle conserve l’accent sur ce qui se fait entendre sans alourdir la phrase.
- source_word: הָרֹעִים
  choice: des bergers
  rationale: Le terme désigne littéralement des bergers. L’image prophétique est maintenue plutôt que remplacée dans le texte par son interprétation politique.
- source_word: וִילְלַת
  choice: et les lamentations
  rationale: Le nom issu de ילל exprime des cris de douleur ou de deuil. « Lamentations » transmet cette intensité dans un registre digne et actuel.
- source_word: אַדִּירֵי הַצֹּאן
  choice: des chefs du troupeau
  rationale: אַדִּירֵי peut désigner les puissants, les nobles ou les principaux personnages. « Chefs » exprime clairement leur rang tout en conservant l’image du troupeau.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la cause des cris et des lamentations.
- source_word: שֹׁדֵד
  choice: dévaste
  rationale: Le participe de שׁדד évoque une action violente de ravage ou de destruction. Le présent français rend son caractère en cours ou vivement présenté.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מַרְעִיתָם
  choice: leur pâturage
  rationale: Le mot désigne un lieu où paît le troupeau. « Pâturage » conserve l’ensemble de l’image pastorale et son possible sens métaphorique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie explicitement le tétragramme; la translittération préserve le nom propre sans le remplacer par un titre.
- issue: Interprétation de l’image des bergers, du troupeau et du pâturage
  choice: Conserver l’image pastorale dans le texte principal
  alternative: Traduire explicitement par les dirigeants, le peuple et le pays
  rationale: Le contexte peut viser les gouvernants et ceux qui leur sont confiés, mais le verset formule cette réalité au moyen d’une métaphore cohérente. La conserver évite de transformer une interprétation probable en traduction certaine.
- issue: Valeur de אַדִּירֵי הַצֹּאן
  choice: les chefs du troupeau
  alternative: les puissants du troupeau; les nobles du troupeau
  rationale: Le terme exprime la prééminence sans préciser entièrement sa nature. « Chefs » convient au contexte, tandis qu’une note maintient les autres nuances lexicales possibles.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « On entend » restitue idiomatiquement la construction nominale hébraïque, tandis que le vocabulaire pastoral et son ambiguïté métaphorique sont préservés.
