id: JER.25.8
reference: Jeremiah 25:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת יַ֕עַן אֲשֶׁ֥ר לֹֽא שְׁמַעְתֶּ֖ם אֶת דְּבָרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/008.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Because you have not listened to my words[b],'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahvé des armées : « Puisque vous n’avez pas écouté[a] mes paroles,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « obéi à ». Le verbe hébreu peut désigner une écoute qui se traduit par l’obéissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’accusation qui précède.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Rend la formule prophétique consacrée avec une tournure française actuelle, solennelle et fidèle à sa fonction introductive.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre ; « Yahvé » est la forme française courante.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Conserve l’image des forces placées sous l’autorité divine sans en restreindre explicitement la portée aux seules armées humaines.
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: Introduit avec naturel la cause du jugement annoncé et convient à la phrase laissée en suspens vers le verset suivant.
- source_word: לֹא שְׁמַעְתֶּם
  choice: vous n’avez pas écouté
  rationale: Le verbe שׁמע exprime ici l’écoute attendue de la parole divine, avec une implication d’obéissance ; le passé composé convient au lien avec le jugement présent.
- source_word: אֶת דְּבָרָי
  choice: mes paroles
  rationale: Traduction directe et naturelle de דְּבָרָי dans ce contexte prophétique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin ; sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Portée de שׁמע
  choice: écouté, avec une note signalant le sens d’obéir
  alternative: obéi à
  rationale: « Écouté » maintient l’image auditive explicite tout en laissant perceptible l’exigence d’une réponse obéissante ; la note rend compte de l’autre nuance sans trancher silencieusement.
translation_notes:
  register: Français international moderne, sobre et solennel. La formule « ainsi parle » conserve la cadence prophétique sans archaïsme excessif. Le deux-points et le guillemet ouvrant indiquent que la déclaration divine se poursuit au verset suivant.
