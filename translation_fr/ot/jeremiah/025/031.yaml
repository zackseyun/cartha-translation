id: JER.25.31
reference: Jeremiah 25:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּ֤א שָׁאוֹן֙ עַד קְצֵ֣ה הָ/אָ֔רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ בַּ/גּוֹיִ֔ם נִשְׁפָּ֥ט ה֖וּא לְ/כָל בָּשָׂ֑ר הָ/רְשָׁעִ֛ים נְתָנָ֥/ם לַ/חֶ֖רֶב נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/031.yaml
  text: An uproar has come to the end of the earth[a], for Yahweh has a case against the nations; he is entering into judgment with all flesh. He has given the wicked to the sword[d][c][b], declares Yahweh.
translation:
  language: fr
  text: Le fracas parvient jusqu’aux confins de la terre[a], car Yahweh engage un procès contre les nations ; il entre en jugement avec toute chair[b]. Il livre les méchants à l’épée[c] — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à l’extrémité de la terre ».
    reason: lexical_alternative
  - marker: b
    text: « Toute chair » signifie ici toute l’humanité.
    reason: idiom_explanation
  - marker: c
    text: Ou « Il remet les méchants au pouvoir de l’épée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוֹן
  choice: fracas
  rationale: Le terme désigne ici un bruit puissant et tumultueux lié au jugement. « Fracas » est naturel, évocateur et garde la force auditive de l’hébreu.
- source_word: בָּא
  choice: parvient
  rationale: Dans ce contexte, le verbe exprime la venue ou l’extension du fracas jusqu’à la limite du monde. Le présent rend vivement l’annonce prophétique.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: jusqu’aux confins de la terre
  rationale: Cette expression française naturelle conserve l’image de l’extrémité de la terre sans laisser entendre un seul point géographique précis.
- source_word: רִיב לַיהוָה בַּגּוֹיִם
  choice: Yahweh engage un procès contre les nations
  rationale: רִיב possède ici une nette valeur judiciaire. « Engager un procès contre » communique clairement le différend porté en justice et s’accorde avec la suite du verset.
- source_word: נִשְׁפָּט הוּא
  choice: il entre en jugement
  rationale: Cette formulation préserve la nuance judiciaire du niphal et la tension du texte, qui présente Yahweh dans l’action du procès sans réduire l’expression à une simple condamnation.
- source_word: לְכָל בָּשָׂר
  choice: avec toute chair
  rationale: Le calque intelligible « toute chair » conserve l’image biblique et la portée universelle de l’expression ; une note en explicite le sens.
- source_word: הָרְשָׁעִים
  choice: les méchants
  rationale: Rendu moral direct et usuel du substantif adjectival, sans le limiter au seul statut judiciaire de « coupables ».
- source_word: נְתָנָם לַחֶרֶב
  choice: Il livre les méchants à l’épée
  rationale: « Livrer à l’épée » exprime naturellement en français le fait de vouer à la mort violente. La reprise explicite de « les méchants » évite une ambiguïté pronominale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte source plutôt que de lui substituer un titre.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Formule prophétique solennelle qui distingue nettement l’oracle d’une simple parole rapportée.
theological_decisions:
- issue: Imagerie juridique du jugement divin
  choice: « engage un procès » et « entre en jugement »
  alternative: « a un différend » et « juge »
  rationale: Les termes רִיב et נשפט appartiennent tous deux au champ judiciaire. Leur maintien fait entendre Yahweh à la fois comme partie au litige et comme acteur du jugement, sans harmoniser cette tension.
- issue: Portée de כָל־בָּשָׂר
  choice: « toute chair »
  alternative: « toute l’humanité »
  rationale: La formulation retenue préserve l’image hébraïque et sa portée universelle, tandis que la note assure l’accessibilité.
- issue: Référent du suffixe dans נְתָנָם
  choice: Reprise explicite de « les méchants »
  alternative: « il les livre »
  rationale: L’antécédent hébreu est énoncé par הָרְשָׁעִים ; le français explicite ce groupe pour éviter que « les » ne soit rapporté à « toute chair » ou aux « nations ».
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme prophétique reste soutenu ; le vocabulaire judiciaire et l’expression biblique « toute chair » sont conservés, avec des notes brèves pour éclairer les lecteurs.
