source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה עַֽל יִרְמְיָ֨הוּ֙ עַל כָּל עַ֣ם יְהוּדָ֔ה בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֗יא הַ/שָּׁנָה֙ הָ/רִ֣אשֹׁנִ֔ית לִ/נְבֽוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/001.yaml
  text: The word that came to Yirmeyahu concerning all the people of Judah in the fourth year of Jehoiakim son of Josiah[a], king of Judah—it was the first year of Nebuchadnezzar king of Babylon—
translation:
  language: fr
  text: La parole qui fut adressée à Jérémie au sujet de tout le peuple de Juda[a], la quatrième année de Joïaqim, fils de Josias, roi de Juda — c’était la première année de Nabuchodonosor, roi de Babylone —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre tout le peuple de Juda ». Dans un contexte prophétique, la préposition hébraïque peut avoir l’un ou l’autre sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans les suscriptions prophétiques, דָּבָר désigne couramment une communication divine. « La parole » conserve cet idiome biblique sans le paraphraser en « message ».
- source_word: אֲשֶׁר הָיָה עַל יִרְמְיָהוּ
  choice: qui fut adressée à Jérémie
  rationale: L’expression היה על, employée à propos d’un prophète, indique qu’une parole lui advient ou lui est communiquée. Cette formulation est naturelle et digne en français moderne.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: La forme française traditionnelle est immédiatement reconnaissable et convient à une traduction destinée au grand public.
- source_word: עַל כָּל עַם יְהוּדָה
  choice: au sujet de tout le peuple de Juda
  rationale: La préposition עַל peut ici signifier « au sujet de » ou « contre ». Le texte principal retient le sens le moins chargé, tandis que la note préserve l’autre possibilité.
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: la quatrième année de Jojakim
  rationale: Formule française usuelle pour dater un événement d’après une année de règne.
- source_word: בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: fils de Josias, roi de Juda
  rationale: Rendu direct de la filiation et du titre royal, en maintenant l’attachement syntaxique naturel au nom de Jojakim.
- source_word: הִיא הַשָּׁנָה הָרִאשֹׁנִית לִנְבוּכַדְרֶאצַּר
  choice: c’était la première année de Nabuchodonosor
  rationale: Le pronom הִיא reprend l’année déjà indiquée et l’identifie à la première année du règne de Nabuchodonosor.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Traduction française standard du titre royal.
theological_decisions:
- issue: Valeur de עַל devant « tout le peuple de Juda »
  choice: au sujet de tout le peuple de Juda
  alternative: contre tout le peuple de Juda
  rationale: Bien que le chapitre annonce un jugement, la suscription peut simplement indiquer l’objet de la parole. Le choix principal préserve cette portée générale, et la note maintient explicitement la lecture hostile possible.
translation_notes:
  register: Français international moderne, clair et soutenu. Les noms propres suivent leurs formes françaises bibliques usuelles. Le tiret final est conservé, car le verset forme une suscription qui se poursuit syntaxiquement au verset suivant.
