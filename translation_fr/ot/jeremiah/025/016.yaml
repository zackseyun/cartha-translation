source:
  edition: WLC
  text: וְ/שָׁת֕וּ וְ/הִֽתְגֹּֽעֲשׁ֖וּ וְ/הִתְהֹלָ֑לוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/016.yaml
  text: They will drink[a], and stagger, and act like madmen because of the sword that I am sending among them.
translation:
  language: fr
  text: Ils boiront, tituberont et se comporteront comme des fous[a] à cause de l’épée que j’envoie parmi eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : perdront la raison. Le verbe hébreu peut désigner une conduite irrationnelle ou le fait de devenir fou.'
    reason: Alternative lexicale préservant l’ambiguïté entre comportement observable et état mental.
lexical_decisions:
- source_word: וְשָׁתוּ
  choice: Ils boiront
  rationale: Le parfait qal avec waw poursuit ici la séquence prophétique et prend une valeur future. Cette formulation conserve l’image concrète de la coupe.
- source_word: וְהִתְגֹּעֲשׁוּ
  choice: tituberont
  rationale: Le verbe exprime une agitation violente ou un mouvement instable. « Tituberont » s’accorde naturellement avec l’image de la boisson tout en évoquant la déstabilisation provoquée par le jugement.
- source_word: וְהִתְהֹלָלוּ
  choice: se comporteront comme des fous
  rationale: La forme verbale désigne un comportement insensé ou dément. Cette traduction préserve sa nuance comportementale sans affirmer plus précisément un état mental.
- source_word: מִפְּנֵי הַחֶרֶב
  choice: à cause de l’épée
  rationale: 'Dans ce contexte, מִפְּנֵי a une valeur causale : l’épée provoque leur titubation et leur conduite insensée.'
- source_word: הַחֶרֶב
  choice: l’épée
  rationale: Le sens lexical direct maintient l’image prophétique concrète de la guerre et du jugement.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ
  choice: que j’envoie
  rationale: Le participe avec le pronom emphatique présente l’action divine comme actuelle ou imminente. Le présent français convient naturellement dans la proposition relative.
- source_word: בֵּינֹתָם
  choice: parmi eux
  rationale: La préposition situe l’épée au milieu des nations considérées collectivement.
theological_decisions:
- issue: Nature des images du jugement
  choice: Conserver les images concrètes de la boisson, de la titubation et de la conduite démente comme effets du jugement divin par l’épée.
  alternative: Reformuler abstraitement en termes de terreur générale ou d’effondrement politique.
  rationale: Le contexte est celui de la coupe de colère, et le verset attribue explicitement cet état à l’épée envoyée par Dieu. Les images prophétiques sont donc maintenues sans être réduites à une interprétation abstraite.
translation_notes:
  register: Français international moderne, naturel et digne. « Se comporteront comme des fous » reste compréhensible sans être familier; « tituberont » restitue vivement le mouvement instable lié à la coupe.
