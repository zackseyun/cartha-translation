id: JER.25.38
reference: Jeremiah 25:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָזַ֥ב כַּ/כְּפִ֖יר סֻכּ֑/וֹ כִּֽי הָיְתָ֤ה אַרְצָ/ם֙ לְ/שַׁמָּ֔ה מִ/פְּנֵי֙ חֲר֣וֹן הַ/יּוֹנָ֔ה וּ/מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/038.yaml
  text: Like a young lion[a], he has left his den, for their land has become a desolation because of the burning anger of the oppressor[b], and because of his burning anger.
translation:
  language: fr
  text: Comme un jeune lion, il a quitté son repaire, car leur pays est devenu un lieu dévasté à cause de la colère ardente de l’oppresseur[a] et à cause de son ardente colère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la colère ardente de la colombe ». La forme hébraïque écrite peut se lire ainsi, mais le contexte favorise nettement un sens tel que « l’oppresseur ».
    reason: alternative_reading
  - marker: b
    text: Le possessif « son » renvoie probablement au Seigneur dans le contexte, mais certains comprennent qu’il renvoie à l’oppresseur mentionné juste avant.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַב
  choice: il a quitté
  rationale: Le qal parfait décrit une action accomplie. « A quitté » reste naturel et n’ajoute pas la nuance plus forte d’un abandon définitif.
- source_word: כַּכְּפִיר
  choice: comme un jeune lion
  rationale: כְּפִיר désigne couramment un lion jeune mais déjà vigoureux; cette formulation conserve clairement l’image.
- source_word: סֻכּוֹ
  choice: son repaire
  rationale: סֻכָּה signifie littéralement un abri, mais, dans cette image animale, « repaire » désigne naturellement le lieu où demeure le lion.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de l’action précédente; « car » rend ce lien explicatif dans un registre digne et courant.
- source_word: הָיְתָה אַרְצָם לְשַׁמָּה
  choice: leur pays est devenu un lieu dévasté
  rationale: Cette tournure exprime le résultat de la dévastation tout en conservant la valeur nominale de שַׁמָּה, sans produire le français peu naturel « est devenu une dévastation ».
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Dans les deux occurrences, cette locution exprime naturellement la cause.
- source_word: חֲרוֹן
  choice: colère ardente
  rationale: חֲרוֹן évoque la chaleur brûlante appliquée à la colère; « colère ardente » préserve cette image.
- source_word: הַיּוֹנָה
  choice: l’oppresseur
  rationale: Dans ce contexte de jugement et de dévastation, l’interprétation « l’oppresseur » offre le meilleur sens contextuel. La lecture formelle « la colombe » demeure possible et est signalée en note.
- source_word: וּמִפְּנֵי חֲרוֹן אַפּוֹ
  choice: et à cause de son ardente colère
  rationale: אַפּוֹ appartient à l’idiome hébreu associant le nez à la colère. La traduction communique naturellement cet idiome et maintient le parallélisme avec la proposition précédente.
theological_decisions:
- issue: Référent de l’image du lion et du pronom final
  choice: Le texte principal laisse entendre, conformément au contexte immédiat, que le Seigneur est représenté comme le lion et que le pronom « son » renvoie à lui.
  alternative: L’image du lion peut désigner Nabuchodonosor ou un autre destructeur humain, et le pronom final peut renvoyer à l’oppresseur mentionné juste avant.
  rationale: Dans Jérémie 25.30-38, le Seigneur est le sujet principal de l’action judiciaire, ce qui favorise le premier référent. Toutefois, l’hébreu ne nomme pas explicitement le sujet dans ce verset et l’oppresseur constitue un antécédent grammatical possible; la note conserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé par la répétition de « à cause de » et de « colère ardente ». « Repaire » rend l’image du lion sans littéralisme obscur, tandis que les notes préservent les ambiguïtés textuelle et référentielle.
