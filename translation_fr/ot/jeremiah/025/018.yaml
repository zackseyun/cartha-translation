- from: Jérusalem, les villes de Juda, ses rois et ses dirigeants, pour en faire un champ de ruines, un sujet d’épouvante[a], de sifflements méprisants[b] et de malédiction, comme c’est le cas aujourd’hui.
  to: Jérusalem, les villes de Juda, ses rois et ses dirigeants, pour en faire un objet de désolation, de stupeur[a], de sifflement[b] et de malédiction, comme c’est le cas aujourd’hui.
  rationale: La révision remplace une image limitée aux lieux par « objet de désolation », qui peut englober la ville, ses villes associées et leurs autorités dans le jugement annoncé. Elle rétablit aussi une série française grammaticalement parallèle, tout en conservant les images et l’ambiguïté lexicale du texte hébreu.
