  source_fidelity: 'Le sens de la liste hébraïque est globalement bien rendu : Jérusalem, les villes de Juda, ses rois et ses responsables sont destinés à devenir une réalité de dévastation, suscitant stupeur, sifflement moqueur et malédiction. Toutefois, « un champ de ruines » convient mal à des personnes aussi bien qu’à des villes, et la coordination française actuelle ne maintient pas clairement les quatre termes comme compléments parallèles.'
  naturalness: La formulation proposée présente une rupture syntaxique dans « un sujet d’épouvante, de sifflements méprisants et de malédiction ». Une formulation avec « objet de … » permet une série homogène, naturelle dans le registre prophétique français, sans expliciter indûment le texte.
  terminology: « dirigeants » est acceptable pour שָׂרֶיהָ. « Désolation » rend de façon plus englobante חָרְבָּה que « champ de ruines » dans une liste qui comprend aussi les rois et les responsables. « Stupeur » conserve la nuance de réaction consternée de שַׁמָּה; « sifflement » maintient l’image concrète, potentiellement dérisoire, de שְׂרֵקָה.
