  text: אֶת יְרוּשָׁלִַ֨ם֙ וְ/אֶת עָרֵ֣י יְהוּדָ֔ה וְ/אֶת מְלָכֶ֖י/הָ אֶת שָׂרֶ֑י/הָ לָ/תֵ֨ת אֹתָ֜/ם לְ/חָרְבָּ֧ה לְ/שַׁמָּ֛ה לִ/שְׁרֵקָ֥ה וְ/לִ/קְלָלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/018.yaml
  text: Jerusalem[a], the cities of Judah, her kings, and her officials—to make them a ruin, a horror, a hissing, and a curse[b], as it is this day.
translation:
  language: fr
  text: Jérusalem, les villes de Juda, ses rois et ses dirigeants, pour en faire un objet de désolation, de stupeur[a], de sifflement[b] et de malédiction, comme c’est le cas aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’horreur ». Le terme hébreu peut mettre l’accent sur la réaction de stupeur effrayée que provoque la dévastation.
    reason: lexical_alternative
  - marker: b
    text: Ou « de sifflements ». Le terme hébreu désigne le son dérisoire produit par ceux qui contemplent un lieu dévasté.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française consacrée du nom de lieu.
- source_word: עָרֵי יְהוּדָה
  choice: les villes de Juda
  rationale: Rend naturellement la chaîne construite hébraïque et conserve clairement le rapport géographique.
- source_word: מְלָכֶיהָ
  choice: ses rois
  rationale: Le possessif singulier reprend l’entité collective féminine du texte hébreu; en français, « ses » conserve cette relation sans lourdeur.
- source_word: שָׂרֶיהָ
  choice: ses dirigeants
  rationale: שָׂרִים désigne ici les responsables politiques aux côtés des rois; « dirigeants » est moderne et n’implique pas qu’il s’agisse de fils de roi.
- source_word: לָתֵת אֹתָם
  choice: pour en faire
  rationale: L’infinitif de נתן suivi de compléments introduits par ל exprime ici le résultat produit; « en faire » est idiomatique et garde cette valeur causative.
- source_word: לְחָרְבָּה
  choice: un champ de ruines
  rationale: Expression française concrète et naturelle pour une réalité entièrement dévastée.
- source_word: לְשַׁמָּה
  choice: un sujet d’épouvante
  rationale: Le nom évoque une dévastation qui provoque une réaction de stupeur horrifiée; cette formulation en exprime à la fois l’état et l’effet sur les témoins.
- source_word: לִשְׁרֵקָה
  choice: des sifflements méprisants
  rationale: Conserve l’image sonore des témoins qui sifflent devant le lieu dévasté, tout en explicitant la valeur de dérision.
- source_word: וְלִקְלָלָה
  choice: de malédiction
  rationale: Rend l’idée que ces lieux et leurs habitants deviennent un exemple invoqué dans des formules de malédiction.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme c’est le cas aujourd’hui
  rationale: Formulation française actuelle qui présente la situation présente comme constat de l’accomplissement.
