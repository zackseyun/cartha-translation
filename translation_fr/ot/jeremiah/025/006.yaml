id: JER.25.6
reference: Jeremiah 25:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַל תֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וְ/לֹֽא תַכְעִ֤יסוּ אוֹתִ/י֙ בְּ/מַעֲשֵׂ֣ה יְדֵי/כֶ֔ם וְ/לֹ֥א אָרַ֖ע לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/006.yaml
  text: And do not go after other gods to serve them and to bow down to them[a], and do not provoke me to anger by the work of your hands[b], and I will do you no harm.
translation:
  language: fr
  text: N’allez pas à la suite d’autres dieux pour les servir et vous prosterner devant eux. Ne provoquez pas ma colère par l’œuvre de vos mains, et je ne vous ferai aucun mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et je ne ferai pas venir le malheur sur vous » .'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּלְכוּ אַחֲרֵי
  choice: aller à la suite de
  rationale: Cette tournure conserve l’image hébraïque du déplacement derrière quelqu’un tout en exprimant naturellement l’idée d’adhésion et de fidélité.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe qui désigne des divinités autres que le Seigneur sans ajouter la notion non explicite de dieux étrangers.
- source_word: לְעָבְדָם
  choice: pour les servir
  rationale: « Servir » garde le sens lexical fondamental et le distingue du geste de prosternation mentionné ensuite.
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: et vous prosterner devant eux
  rationale: Cette formulation préserve le geste physique de révérence exprimé par le verbe hébreu sans le confondre avec le service cultuel.
- source_word: תַכְעִיסוּ אֹתִי
  choice: provoquez ma colère
  rationale: 'Expression française naturelle qui restitue la valeur causative du hifil : susciter la colère de Dieu.'
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: par l’œuvre de vos mains
  rationale: La formulation conserve l’image hébraïque des objets fabriqués par les humains, ici vraisemblablement les idoles, sans expliciter davantage que le texte.
- source_word: וְלֹא אָרַע לָכֶם
  choice: et je ne vous ferai aucun mal
  rationale: Le hifil de רעע peut signifier faire du mal ou causer un désastre. Cette traduction est claire en français et évite la connotation morale trompeuse de « faire le mal ».
theological_decisions:
- issue: Rapport logique de la dernière proposition avec les interdictions
  choice: et je ne vous ferai aucun mal
  alternative: afin que je ne vous fasse aucun mal ; et je ne ferai pas venir le malheur sur vous
  rationale: L’hébreu emploie une simple coordination négative. La traduction conserve cette forme d’assurance divine sans transformer explicitement la proposition en but, tout en signalant en note l’autre portée possible de רעע.
translation_notes:
  register: Français moderne, digne et accessible. Le pluriel d’exhortation est maintenu. « Aller à la suite de » préserve l’image de l’hébreu ; « se prosterner devant » distingue l’acte corporel du service rendu aux divinités.
