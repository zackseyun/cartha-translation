base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/030.yaml
  text: 'And you, you shall prophesy all these words against them, and you shall say to them: The LORD will roar from on high, and from his holy dwelling he will give his voice; he will surely roar against his pasture. He will answer with a shout like those who tread grapes, against all the inhabitants of the earth.'
translation:
  language: fr
  text: 'Et toi, tu leur prophétiseras toutes ces paroles et tu leur diras :


    « Le SEIGNEUR rugira d’en haut ;

    de sa demeure sainte, il fera retentir sa voix.

    Il rugira avec force contre son pâturage ;

    il lancera un cri, comme les fouleurs de raisin,

    vers tous les habitants de la terre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du pays » ; le mot hébreu peut désigner la terre entière ou un territoire particulier.'
    reason: Préserver l’ambiguïté réelle de הָאָרֶץ.
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, sans lui substituer un nom propre conjectural dans le corps du texte.
- source_word: יִתֵּן קוֹלוֹ
  choice: il fera retentir sa voix
  rationale: Littéralement « il donnera sa voix » ; cette tournure française naturelle conserve l’idée d’une voix puissante qui se fait entendre.
- source_word: שָׁאֹג יִשְׁאַג
  choice: il rugira avec force
  rationale: L’infinitif absolu suivi du verbe intensifie ou affirme l’action ; « avec force » restitue cette insistance sans lourdeur.
- source_word: נָוֵהוּ
  choice: son pâturage
  rationale: Le nom peut désigner un pâturage, un lieu de séjour ou un enclos. « Pâturage » convient au contexte imagé tout en maintenant la métaphore.
- source_word: הֵידָד כְּדֹרְכִים
  choice: par un cri, comme ceux qui foulent le raisin
  rationale: הֵידָד désigne ici le cri rythmé poussé par les fouleurs de raisin ; la formulation explicite l’image sans ajouter « raisins », absent mais implicite en hébreu.
- source_word: יַעֲנֶה
  choice: il répondra
  rationale: Conserve le sens ordinaire de la racine ענה et l’étrangeté expressive de l’énoncé, plutôt que de la réduire à « il poussera » un cri.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le contexte de jugement international favorise « la terre », tout en laissant possible le sens plus restreint de « pays ».
theological_decisions:
- issue: Portée de « son pâturage »
  choice: Conserver l’image sans identifier explicitement le pâturage à Israël, au temple ou au monde.
  alternative: Traduire ou expliquer par « son pays », « sa demeure » ou « son peuple ».
  rationale: Le référent précis de נָוֵהוּ n’est pas explicité dans le verset ; une identification doctrinale ou historique dans le texte lèverait indûment cette ambiguïté.
- issue: Portée de « la terre »
  choice: Retenir « la terre » avec une note signalant l’autre possibilité.
  alternative: Traduire « le pays ».
  rationale: Le passage environnant vise les nations, mais le mot hébreu peut avoir les deux portées ; la traduction principale rend la lecture universelle sans dissimuler l’ambiguïté lexicale.
translation_notes:
  register: Style prophétique solennel mais actuel. Le parallélisme et les répétitions sonores sont conservés autant que le permet un français naturel ; la mise en vers souligne la structure poétique de l’oracle.
