  to: 'Et toi, tu leur prophétiseras toutes ces paroles et tu leur diras :


    « Le SEIGNEUR rugira d’en haut ;

    de sa demeure sainte, il fera retentir sa voix.

    Il rugira avec force contre son pâturage ;

    il lancera un cri, comme les fouleurs de raisin,

    vers tous les habitants de la terre[a]. »'
  rationale: La révision conserve le contenu et le registre du projet, tout en rendant plus naturellement la relation entre le cri de vendange et les habitants de la terre. Elle ne précise pas le référent de « son pâturage » et maintient la note d'ambiguïté sur הָאָרֶץ.
