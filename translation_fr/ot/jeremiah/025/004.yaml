source:
  edition: WLC
  text: וְ/שָׁלַח֩ יְהוָ֨ה אֲלֵי/כֶ֜ם אֶֽת כָּל עֲבָדָ֧י/ו הַ/נְּבִאִ֛ים הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/לֹֽא הִטִּיתֶ֥ם אֶֽת אָזְנְ/כֶ֖ם לִ/שְׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/004.yaml
  text: And Yahweh sent to you all his servants the prophets[a], rising early and sending them, but you did not listen, nor did you incline your ear to hear.
translation:
  language: fr
  text: Yahvé vous a envoyé tous ses serviteurs, les prophètes, avec empressement et sans relâche[a] ; mais vous n’avez pas écouté, ni tendu l’oreille pour entendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se levant tôt et envoyant ». Cette expression hébraïque évoque l’empressement et l’action répétée : Yahvé a envoyé les prophètes avec insistance, encore et encore.'
    reason: 'Note idiomatique : elle explique l’expression hébraïque tout en indiquant plus exactement sa forme littérale.'
lexical_decisions:
- source_word: וְשָׁלַח
  choice: a envoyé
  rationale: Le qatal qal à la troisième personne du masculin singulier présente ici l’action passée de manière naturelle en français ; le passé composé convient au discours adressé directement aux destinataires.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle rend directement le tétragramme, plutôt que de le remplacer par un titre comme « le Seigneur ».
- source_word: כָּל עֲבָדָיו הַנְּבִאִים
  choice: tous ses serviteurs, les prophètes
  rationale: « Les prophètes » est en apposition et précise l’identité des serviteurs ; « serviteurs » exprime ici leur fonction d’agents mandatés par Dieu sans mettre l’accent sur l’esclavage.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: se levant de bon matin pour les envoyer
  rationale: La formulation conserve l’image concrète de l’expression hébraïque tout en restant intelligible ; une note en explicite la valeur idiomatique de diligence et de répétition.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mais vous n’avez pas écouté
  rationale: Dans ce reproche prophétique, שׁמע désigne une écoute attentive et réceptive, non la simple perception auditive ; « mais » fait ressortir le contraste.
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם לִשְׁמֹעַ
  choice: ni tendu l’oreille pour entendre
  rationale: Cette traduction garde la métaphore hébraïque de l’oreille orientée volontairement vers la parole et maintient la répétition entre écouter et entendre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin. « Yahvé » le représente directement dans une forme française reconnue, sans le remplacer par un titre.
- issue: Image de Dieu se levant de bon matin
  choice: conserver l’image et l’expliquer en note
  alternative: traduire seulement par « les envoyant sans relâche »
  rationale: L’hébreu emploie une image anthropomorphique idiomatique pour souligner l’empressement et la persévérance. La conserver évite d’effacer la forme expressive du texte, tandis que la note prévient une lecture trop littérale.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve les métaphores hébraïques « se levant de bon matin » et « tendre l’oreille », avec une ponctuation qui clarifie le contraste entre l’envoi persévérant de Dieu et le refus d’écouter.
