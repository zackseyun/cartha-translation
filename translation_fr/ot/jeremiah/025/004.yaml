    issue: La construction « se levant de bon matin pour les envoyer » ne rend pas pleinement la coordination intensive de l’idiome hébreu.
    rationale: Les deux infinitifs absolus décrivent l’empressement persistant de Yahvé à envoyer les prophètes. « Pour les envoyer » peut suggérer une simple finalité, plutôt que l’action répétée exprimée par la formule.
  - severity: low
    issue: La note qualifie de « littéralement » une formulation française qui introduit « pour » et le pronom objet « les ».
    rationale: Le texte hébreu dit littéralement « se levant tôt et envoyant »; l’objet est implicite et la relation de finalité n’est pas exprimée. La note doit distinguer la forme littérale de son explication idiomatique.
