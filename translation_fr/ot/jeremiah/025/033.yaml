source:
  edition: WLC
  text: וְ/הָי֞וּ חַֽלְלֵ֤י יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ לֹ֣א יִסָּפְד֗וּ וְ/לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/033.yaml
  text: And the slain of Yahweh on that day will be from one end of the earth even to the other end of the earth[a]. They will not be mourned, or gathered, or buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: fr
  text: Ce jour-là, les victimes de Yahweh seront d’un bout à l’autre de la terre[a]. On ne les pleurera pas, on ne les recueillera pas et on ne les ensevelira pas ; elles deviendront du fumier à la surface du sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un bout à l’autre du pays ». Le mot hébreu peut signifier « terre » ou « pays » ; ici, « terre » est retenu en raison de la vaste portée de l’oracle.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלְלֵי יְהוָה
  choice: ceux que Yahweh aura tués
  rationale: Le substantif construit חַלְלֵי désigne les personnes tuées. La formulation française rend explicitement l’agence de Yahweh, lecture naturelle du construit dans ce contexte de jugement, sans suggérer qu’il s’agit de personnes qui lui seraient consacrées.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle idiomatique en français moderne, qui conserve le registre prophétique.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: d’un bout à l’autre de la terre
  rationale: Cette expression française restitue naturellement le mérisme hébreu. « Terre » convient à la vaste portée de l’oracle, tout en laissant en note l’autre sens possible de אֶרֶץ.
- source_word: לֹא יִסָּפְדוּ
  choice: On ne mènera pas deuil sur eux
  rationale: Le niphal indique que ces morts ne recevront aucune lamentation funèbre. Cette tournure est claire et digne.
- source_word: וְלֹא יֵאָסְפוּ
  choice: on ne les ramassera pas
  rationale: Dans la séquence relative aux cadavres, אסף évoque leur enlèvement ou leur rassemblement. « Ramasser » exprime concrètement cet abandon sur le sol.
- source_word: וְלֹא יִקָּבֵרוּ
  choice: on ne les enterrera pas
  rationale: Équivalent français direct et naturel du passif de קבר.
- source_word: לְדֹמֶן
  choice: du fumier
  rationale: דֹמֶן désigne du fumier ou des excréments. « Fumier » préserve l’image dégradante et brutale sans atténuation.
- source_word: עַל־פְּנֵי הָאֲדָמָה
  choice: à la surface du sol
  rationale: Rend le sens concret de l’expression littérale « sur la face du sol » dans un français actuel.
- source_word: יִהְיוּ
  choice: ils deviendront
  rationale: Avec לְדֹמֶן, le verbe décrit ici l’état résultant. « Deviendront » conserve la force de l’image sans ajouter une comparaison absente de l’hébreu.
theological_decisions:
- issue: Portée de אֶרֶץ
  choice: terre
  alternative: pays
  rationale: Le contexte élargi concerne les nations et favorise une portée universelle. Le mot hébreu peut toutefois désigner un pays ou un territoire, possibilité conservée en note.
- issue: Valeur du construit חַלְלֵי יְהוָה
  choice: ceux que Yahweh aura tués
  alternative: les tués de Yahweh
  rationale: Le construit peut rester formellement compact, mais le contexte de jugement soutient une relation d’agence. La formulation choisie est naturelle en français et explicite cette lecture sans importer une doctrine étrangère au texte.
- issue: Nature de l’image לְדֹמֶן ... יִהְיוּ
  choice: ils deviendront du fumier
  alternative: ils seront comme du fumier
  rationale: L’hébreu ne comporte pas de particule comparative explicite. La traduction garde donc la métaphore directe et sa dureté.
translation_notes:
  register: Français international moderne, solennel et direct. La répétition hébraïque de « extrémité de la terre » est rendue par le mérisme idiomatique « d’un bout à l’autre de la terre ». L’accumulation des trois absences de rites ou de traitement funéraire est conservée.
