revisions:
- from: Ce jour-là, ceux que Yahweh aura tués seront étendus d’un bout à l’autre de la terre[a]. On ne mènera pas deuil sur eux, on ne les ramassera pas et on ne les enterrera pas. Ils deviendront du fumier à la surface du sol.
  to: Ce jour-là, les victimes de Yahweh seront d’un bout à l’autre de la terre[a]. On ne les pleurera pas, on ne les recueillera pas et on ne les ensevelira pas ; elles deviendront du fumier à la surface du sol.
  rationale: La révision élimine l’ajout spatial « étendus » et l’antériorité du futur antérieur, améliore l’idiome funéraire français et conserve le mérisme, le nom divin, l’image directe du fumier ainsi que la note sur la portée de אֶרֶץ.
