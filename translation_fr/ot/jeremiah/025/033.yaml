review_pass:
  verdict: revise
  source_fidelity: La portée universelle de אֶרֶץ est correctement rendue par « terre », avec une note qui conserve l’alternative « pays ». La séquence « ne seront pas lamentés, rassemblés ni ensevelis » est préservée. Toutefois, « ceux que Yahweh aura tués » explicite l’agent et ajoute un antériorité que le construit חַלְלֵי יְהוָה et le futur du verset n’expriment pas de façon aussi précise. « Seront étendus » ajoute aussi une image spatiale absente du texte.
  naturalness: « On ne mènera pas deuil sur eux » est peu idiomatique en français international moderne. « On ne les pleurera pas » est plus naturel, tout en gardant le sens de lamentation funèbre. « Recueillir » et « ensevelir » conviennent au registre solennel et au contexte des corps non pris en charge.
  terminology: « Yahweh » est conforme au rendu du tétragramme. « Les victimes de Yahweh » fournit en français une formulation naturelle pour le construit, sans imposer le plus-que-parfait « aura tués » ; le contexte de jugement laisse percevoir l’implication divine. « Fumier » conserve l’image dégradante de דֹמֶן.
  issues:
  - severity: medium
    issue: Explicitation et aspect temporel dans « ceux que Yahweh aura tués »
    rationale: Le texte hébreu dit littéralement « les tués de Yahweh » et les situe dans le futur. La formulation au futur antérieur explicite une relation agentive et une antériorité qui ne sont pas formulées avec cette précision ; une formulation plus compacte préserve mieux la construction source.
  - severity: low
    issue: Ajout de « seront étendus »
    rationale: Le mérisme indique l’étendue, « d’une extrémité de la terre à l’autre », mais n’emploie pas de verbe signifiant « être étendu ». L’ajout est évocateur mais non nécessaire.
  - severity: low
    issue: Tournure « mener deuil sur eux »
    rationale: La tournure est compréhensible, mais moins naturelle que « les pleurer » dans un français moderne et solennel.
