  text: כִּ֣י עָֽבְדוּ בָ֤/ם גַּם הֵ֨מָּה֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדוֹלִ֑ים וְ/שִׁלַּמְתִּ֥י לָ/הֶ֛ם כְּ/פָעֳלָ֖/ם וּ/כְ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/014.yaml
  text: For many nations and great kings will make even them serve[a], and I will repay them according to their work and according to the work of their hands.
translation:
  language: fr
  text: Car de nombreuses nations et de grands rois les asserviront eux aussi[a], et je les rétribuerai selon leurs actes et selon l’œuvre de leurs mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « car de nombreuses nations et de grands rois ont travaillé avec eux / se sont servis d’eux, eux aussi ». La formulation hébraïque est très condensée; dans ce contexte, elle signifie probablement que les Babyloniens seront à leur tour contraints de servir de nombreuses nations et de grands rois.'
    reason: La construction עבד avec ב et la fonction de גַּם הֵמָּה permettent plusieurs formulations littérales; la note préserve cette ambiguïté réelle.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du jugement annoncé au verset précédent.
- source_word: עָבְדוּ בָם גַּם הֵמָּה
  choice: eux aussi seront asservis
  rationale: 'Le contexte annonce un renversement : les Babyloniens, qui ont dominé d’autres peuples, seront à leur tour soumis. Le passif français exprime clairement ce sens contextuel sans masquer dans la note la formulation hébraïque compacte.'
- source_word: גּוֹיִם רַבִּים וּמְלָכִים גְּדוֹלִים
  choice: de nombreuses nations et de grands rois
  rationale: Traduction directe et naturelle des acteurs politiques désignés par l’hébreu.
- source_word: וְשִׁלַּמְתִּי לָהֶם
  choice: Je leur rendrai la pareille
  rationale: Exprime en français actuel l’idée de rétribution contenue dans le piel de שׁלם.
- source_word: כְּפָעֳלָם
  choice: selon leurs actes
  rationale: פעל désigne ici leur activité ou leurs actions; « actes » convient au contexte judiciaire et reste distinct du membre parallèle.
- source_word: וּכְמַעֲשֵׂה יְדֵיהֶם
  choice: selon l’œuvre de leurs mains
  rationale: Conserve l’image concrète des mains et le parallélisme de la formulation hébraïque.
theological_decisions:
- issue: Référent du pronom dans le renversement du jugement
  choice: Le pronom renvoie aux Babyloniens ou Chaldéens, qui seront eux-mêmes asservis.
  alternative: Comprendre littéralement la proposition comme « de nombreuses nations et de grands rois ont travaillé pour eux / se sont servis d’eux ».
  rationale: Jérémie 25.12-14 porte sur le jugement du roi de Babylone et de son pays; la lecture retenue rend le motif contextuel du renversement tout en signalant l’ambiguïté grammaticale en note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure passive clarifie le renversement annoncé par le contexte; « l’œuvre de leurs mains » conserve l’image hébraïque.
