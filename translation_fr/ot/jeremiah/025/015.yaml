source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵלַ֔/י קַ֠ח אֶת כּ֨וֹס הַ/יַּ֧יִן הַ/חֵמָ֛ה הַ/זֹּ֖את מִ/יָּדִ֑/י וְ/הִשְׁקִיתָ֤ה אֹת/וֹ֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר אָנֹכִ֛י שֹׁלֵ֥חַ אוֹתְ/ךָ֖ אֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/015.yaml
  text: 'For thus said Yahweh[a], the God of Israel, to me: “Take from my hand this cup of the wine of wrath, and make all the nations to whom I am sending you drink it.”'
translation:
  language: fr
  text: 'Car voici ce que Yahvé, le Dieu d’Israël, m’a dit : « Prends de ma main cette coupe du vin de la colère[a], et fais-en boire toutes les nations vers lesquelles je t’envoie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la fureur ».
    reason: Alternative lexicale possible pour חֵמָה.
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que … m’a dit
  rationale: Rend à la fois le lien discursif de כִּי et la formule introductive כֹה אָמַר dans un français actuel et digne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre, conformément à sa fonction dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Reproduction directe et idiomatique de la construction hébraïque.
- source_word: קַח
  choice: Prends
  rationale: Impératif simple correspondant au qal impératif.
- source_word: כּוֹס הַיַּיִן הַחֵמָה הַזֹּאת
  choice: cette coupe du vin de la colère
  rationale: Conserve l’image concrète de la coupe et le lien métaphorique entre le vin et la colère divine, sans explicitation absente de l’hébreu.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: Préserve l’image selon laquelle Dieu remet lui-même la coupe au prophète.
- source_word: וְהִשְׁקִיתָה אֹתוֹ
  choice: fais-en boire
  rationale: Exprime naturellement en français la valeur causative du hiphil; le pronom « en » renvoie au vin à boire.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: Dans ce contexte de jugement international, גּוֹיִם désigne les nations, sans la connotation plus tardive de « païens ».
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אוֹתְךָ אֲלֵיהֶם
  choice: vers lesquelles je t’envoie
  rationale: Rend clairement la mission en cours tout en respectant le mouvement exprimé par אֲלֵיהֶם.
theological_decisions:
- issue: Sens du terme de jugement חֵמָה
  choice: colère
  alternative: fureur
  rationale: « Colère » conserve le poids judiciaire de l’image prophétique sans imposer l’idée d’une émotion incontrôlée; « fureur » reste une possibilité lexicale réelle, signalée en note.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La métaphore de la coupe et du vin est maintenue, ainsi que le présent de la mission prophétique (« je t’envoie »).
