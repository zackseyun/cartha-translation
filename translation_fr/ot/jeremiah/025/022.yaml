  text: וְ/אֵת֙ כָּל מַלְכֵי צֹ֔ר וְ/אֵ֖ת כָּל מַלְכֵ֣י צִיד֑וֹן וְ/אֵת֙ מַלְכֵ֣י הָ/אִ֔י אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/022.yaml
  text: and all the kings of Tyre[a], and all the kings of Sidon, and the kings of the coastland that is across the sea;
translation:
  language: fr
  text: et tous les rois de Tyr, et tous les rois de Sidon, et les rois du territoire côtier[a] situé de l’autre côté de la mer ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’île ». Le mot hébreu peut désigner une île, mais aussi plus largement une côte ou une région maritime.'
    reason: alternative lexicale
lexical_decisions:
- source_word: כָּל
  choice: tous
  rationale: Rend la portée globale du terme hébreu et convient naturellement à l’énumération des rois.
- source_word: מַלְכֵי
  choice: les rois de
  rationale: Reproduit directement le pluriel construit hébreu sans l’élargir au sens plus général de « dirigeants ».
- source_word: צֹר
  choice: Tyr
  rationale: Forme française usuelle du nom de lieu.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Forme française usuelle du nom de lieu.
- source_word: הָאִי
  choice: le territoire côtier
  rationale: אִי peut désigner une île, mais aussi, notamment dans les textes prophétiques, une côte ou une région maritime. « Territoire côtier » préserve ici cette portée géographique sans imposer le sens plus étroit d’île.
- source_word: אֲשֶׁר בְּעֵבֶר הַיָּם
  choice: situé de l’autre côté de la mer
  rationale: Expression française naturelle qui représente explicitement la proposition relative et conserve le rapport spatial du texte hébreu.
- source_word: וְאֵת ... וְאֵת ... וְאֵת
  choice: et ... et ... et
  rationale: La répétition de « et » maintient le rythme cumulatif de l’énumération; le marqueur d’objet direct אֵת n’a pas d’équivalent autonome en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve le caractère cumulatif de la liste hébraïque, tandis que « territoire côtier » offre un rendu lisible sans effacer l’ambiguïté géographique de אִי.
