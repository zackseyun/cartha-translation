language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא אוֹתָ֜/ם מֵ/אֶ֣רֶץ צָפ֗וֹן וְ/קִבַּצְתִּי/ם֮ מִ/יַּרְכְּתֵי אָרֶץ֒ בָּ֚/ם עִוֵּ֣ר וּ/פִסֵּ֔חַ הָרָ֥ה וְ/יֹלֶ֖דֶת יַחְדָּ֑ו קָהָ֥ל גָּד֖וֹל יָשׁ֥וּבוּ הֵֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/008.yaml
  text: Behold[a], I am bringing them from the land of the north, and I will gather them from the farthest parts of the earth. Among them are the blind and the lame, the pregnant woman and the woman in labor, together; a great assembly will return here.
translation:
  language: fr
  text: Voici, je les fais venir du pays du nord, et je les rassemblerai depuis les régions les plus reculées de la terre[a]. Parmi eux se trouvent l’aveugle et le boiteux, la femme enceinte et celle qui accouche, tous ensemble. Une grande assemblée reviendra ici.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les régions les plus reculées du pays » ; le mot hébreu אֶרֶץ peut désigner la « terre » ou un « pays », selon le contexte.
    reason: Alternative lexicale reflétant l’ambiguïté sémantique de אֶרֶץ.
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Conserve la formule prophétique qui attire solennellement l’attention, dans un français actuel et digne.
- source_word: מֵבִיא
  choice: je les fais venir
  rationale: Le participe associé à הִנְנִי présente l’action comme en cours, imminente ou certaine. « Je les fais venir » en garde la vivacité sans imposer un simple futur.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: du pays du nord
  rationale: « Pays » convient ici à une région géographique sans préciser abusivement qu’il s’agit exclusivement de Babylone.
- source_word: וְקִבַּצְתִּים
  choice: et je les rassemblerai
  rationale: Rend directement le verbe du rassemblement, important dans le contexte du retour du peuple dispersé.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: depuis les régions les plus reculées de la terre
  rationale: יַרְכְּתֵי désigne des extrémités ou régions éloignées. Cette formulation exprime clairement l’éloignement tout en conservant l’ambiguïté de אֶרֶץ dans une note.
- source_word: בָּם
  choice: Parmi eux se trouvent
  rationale: Introduit naturellement en français les différents membres compris dans le groupe rassemblé.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: l’aveugle et le boiteux
  rationale: Préserve la paire concise au singulier représentatif et l’inclusion explicite de personnes vulnérables.
- source_word: הָרָה וְיֹלֶדֶת
  choice: la femme enceinte et celle qui accouche
  rationale: Respecte les formes féminines singulières et le sens concret du participe יֹלֶדֶת sans l’atténuer.
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: Exprime l’insistance sur la présence conjointe de tous les membres du groupe; « tous » explicite naturellement en français la portée collective du contexte.
- source_word: קָהָל גָּדוֹל
  choice: Une grande assemblée
  rationale: Garde le sens collectif de קָהָל dans un registre digne, sans introduire une connotation ecclésiale particulière.
- source_word: יָשׁוּבוּ הֵנָּה
  choice: reviendra ici
  rationale: « Revenir » traduit le mouvement de retour, tandis que « ici » conserve la valeur directionnelle de הֵנָּה. Le singulier français s’accorde avec le nom collectif « assemblée ».
theological_decisions:
- issue: Inclusion des personnes vulnérables dans le peuple restauré
  choice: Le texte nomme réellement l’aveugle, le boiteux, la femme enceinte et celle qui accouche comme membres du groupe qui revient.
  alternative: Considérer cette liste comme une simple amplification rhétorique évoquant une foule nombreuse.
  rationale: La syntaxe les situe explicitement parmi les personnes rassemblées. La traduction préserve cette portée inclusive sans lui ajouter de développement doctrinal.
- issue: Portée géographique de אֶרֶץ dans מִיַּרְכְּתֵי אָרֶץ
  choice: « les régions les plus reculées de la terre »
  alternative: « les régions les plus reculées du pays »
  rationale: Le contexte du rassemblement depuis des lieux très éloignés permet le sens large de « terre », mais le mot hébreu peut également désigner un pays; la note maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la solennité prophétique de « Voici », le mouvement concret du rassemblement et le singulier représentatif des catégories nommées. La note est placée après « terre », le terme auquel elle se rapporte.
