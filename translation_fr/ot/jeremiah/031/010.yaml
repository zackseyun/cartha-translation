  text: שִׁמְע֤וּ דְבַר יְהוָה֙ גּוֹיִ֔ם וְ/הַגִּ֥ידוּ בָ/אִיִּ֖ים מִ/מֶּרְחָ֑ק וְ/אִמְר֗וּ מְזָרֵ֤ה יִשְׂרָאֵל֙ יְקַבְּצֶ֔/נּוּ וּ/שְׁמָר֖/וֹ כְּ/רֹעֶ֥ה עֶדְרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/010.yaml
  text: Hear the word of the LORD, O nations, and declare it in the coastlands far away; say, “He who scattered Israel will gather him and will keep him as a shepherd keeps his flock.”
translation:
  language: fr
  text: 'Nations, écoutez la parole du SEIGNEUR ! Proclamez-la dans les îles lointaines et dites : « Celui qui a dispersé Israël le rassemblera et veillera sur lui comme un berger sur son troupeau. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹיִם
  choice: Nations
  rationale: Vocatif placé en tête pour produire une interpellation naturelle en français tout en conservant le sens collectif du terme hébreu.
- source_word: אִיִּים
  choice: îles
  rationale: Le terme désigne littéralement des îles ou des terres maritimes; « îles » préserve l'image géographique sans la réduire au seul littoral.
- source_word: מְזָרֵה
  choice: Celui qui a dispersé
  rationale: Le participe hébreu présente le sujet par son action; cette tournure française en conserve la force sans préciser explicitement une identité déjà déductible du contexte.
- source_word: וּשְׁמָרוֹ
  choice: veillera sur lui
  rationale: שׁמר exprime ici la garde attentive et protectrice; « veiller sur » convient naturellement à la comparaison pastorale.
theological_decisions:
- issue: Identification de « celui qui a dispersé Israël »
  choice: Conserver la désignation indirecte
  alternative: Traduire explicitement « Le Seigneur, qui a dispersé Israël »
  rationale: Le texte hébreu ne répète pas le nom divin dans la citation; la formulation retenue préserve cette structure et laisse le contexte établir l'identité du sujet.
- issue: Genre et référent du pronom suffixé dans יְקַבְּצֶנּוּ / וּשְׁמָרוֹ
  choice: « le » / « lui », renvoyant à Israël comme entité collective masculine
  alternative: Employer « les » pour désigner les Israélites individuellement
  rationale: Les suffixes hébreux sont masculins singuliers et reprennent Israël comme peuple collectif; le français peut conserver cette personnification.
translation_notes:
  register: Français international moderne, digne et oralement fluide. L'impératif initial est rendu par une apostrophe directe. « Proclamez-la » reprend explicitement « la parole » afin d'éviter un « proclamez-le » ambigu en français. La répétition de « gardera » dans la comparaison a été évitée au profit de « veillera sur », naturel dans l'image du berger.
