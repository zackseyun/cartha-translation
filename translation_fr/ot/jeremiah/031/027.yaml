source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/זָרַעְתִּ֗י אֶת בֵּ֤ית יִשְׂרָאֵל֙ וְ/אֶת בֵּ֣ית יְהוּדָ֔ה זֶ֥רַע אָדָ֖ם וְ/זֶ֥רַע בְּהֵמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/027.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will sow the house of Israel and the house of Judah with the seed of man and the seed of beast.
translation:
  language: fr
  text: Voici que des jours viennent, déclare Yahvé, où j’ensemencerai la maison d’Israël et la maison de Juda d’une semence humaine[a] et d’une semence animale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « semence d’être humain » ; l’expression désigne ici la descendance humaine ou les êtres humains et, associée à « semence animale », évoque le repeuplement par les humains et les animaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Conserve le signal d’attention solennel qui introduit l’oracle, dans une tournure prophétique naturelle en français.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Reproduit la formule prophétique d’annonce sans ajouter l’article absent de l’hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: Rend clairement la formule d’oracle et conserve le nom divin personnel.
- source_word: וְזָרַעְתִּי
  choice: j’ensemencerai
  rationale: Préserve l’image agricole du verbe זרע tout en permettant en français le complément indiquant ce dont Israël et Juda seront peuplés.
- source_word: בֵּית יִשְׂרָאֵל ... בֵּית יְהוּדָה
  choice: la maison d’Israël et la maison de Juda
  rationale: Maintient l’expression collective et historique « maison de » au lieu de la réduire aux seuls noms propres.
- source_word: זֶרַע אָדָם
  choice: une semence humaine
  rationale: Conserve à la fois la métaphore de la semence et le sens générique de אָדָם, sans suggérer qu’il s’agit uniquement d’hommes de sexe masculin.
- source_word: וְזֶרַע בְּהֵמָה
  choice: et une semence animale
  rationale: Préserve le parallélisme avec « semence humaine » et le collectif hébreu, qui évoque ici le repeuplement par les animaux, notamment le bétail.
theological_decisions:
- issue: Métaphore de la restauration et du repeuplement
  choice: 'Conserver l’image de l’ensemencement : « j’ensemencerai… d’une semence humaine et d’une semence animale »'
  alternative: « je repeuplerai Israël et Juda d’êtres humains et d’animaux »
  rationale: La formulation retenue communique le repeuplement tout en maintenant l’image agricole voulue par le texte et ses résonances dans Jérémie, sans ajouter d’interprétation théologique.
- issue: Valeur générique de אָדָם
  choice: « humaine »
  alternative: « d’homme »
  rationale: Dans ce contexte, אָדָם désigne l’humanité en général et non les seuls individus masculins. « Humaine » respecte cette portée tout en conservant le parallélisme du texte.
translation_notes:
  register: Français moderne, international et digne. « Voici que » garde la tonalité prophétique sans archaïsme excessif. La répétition de « la maison » et de « semence » reproduit le parallélisme hébreu, tandis que « humaine » et « animale » rendent naturellement les collectifs génériques.
