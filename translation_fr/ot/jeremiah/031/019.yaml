  text: כִּֽי אַחֲרֵ֤י שׁוּבִ/י֙ נִחַ֔מְתִּי וְ/אַֽחֲרֵי֙ הִוָּ֣דְעִ֔/י סָפַ֖קְתִּי עַל יָרֵ֑ךְ בֹּ֚שְׁתִּי וְ/גַם נִכְלַ֔מְתִּי כִּ֥י נָשָׂ֖אתִי חֶרְפַּ֥ת נְעוּרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/019.yaml
  text: For after I turned back[a], I repented; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
translation:
  language: fr
  text: Car, après être revenu[a], j’ai ressenti du regret ; après avoir été instruit, je me suis frappé la cuisse[b]. J’ai eu honte, j’ai aussi été humilié, car j’ai porté l’opprobre de ma jeunesse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir fait demi-tour ». L’hébreu distingue ici le fait de revenir (שׁוב) du regret exprimé ensuite (נחם).
    reason: lexical_alternative
  - marker: b
    text: Se frapper la cuisse était un geste exprimant la douleur, la stupeur ou le remords.
    reason: cultural_note
  - marker: c
    text: Ou « le déshonneur de ma jeunesse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: être revenu
  rationale: Le verbe שׁוב exprime d’abord le retour ou le fait de faire demi-tour. « Revenu » conserve cette image et le distingue de נחם dans la proposition suivante.
- source_word: נִחַמְתִּי
  choice: j’ai regretté ce que j’avais fait
  rationale: Dans ce contexte pénitentiel, נחם exprime le regret et le changement intérieur. Cette formulation française naturelle évite de confondre le terme avec שׁוב tout en rendant sa portée morale.
- source_word: הִוָּדְעִי
  choice: après avoir été instruit
  rationale: La forme niphal de ידע peut signifier être amené à savoir ou être instruit. Le passif est préservé sans préciser qui instruit, puisque le texte ne l’explicite pas ici.
- source_word: סָפַקְתִּי עַל יָרֵךְ
  choice: je me suis frappé la cuisse
  rationale: Traduction concrète du geste hébreu de douleur, de stupeur ou de remords, dont la portée culturelle est expliquée en note.
- source_word: בֹּשְׁתִּי
  choice: j’ai eu honte
  rationale: Rendu direct et idiomatique de בושׁ, exprimant le sentiment de honte.
- source_word: נִכְלַמְתִּי
  choice: j’ai même été couvert d’opprobre
  rationale: Le choix distingue ce verbe du précédent et rend l’idée plus forte de déshonneur ou de confusion, sans les réduire à un seul synonyme français.
- source_word: נָשָׂאתִי
  choice: j’ai porté
  rationale: נשא décrit ici le fait de porter ou de supporter l’opprobre comme un fardeau.
- source_word: חֶרְפַּת נְעוּרָי
  choice: le déshonneur de ma jeunesse
  rationale: חרפה peut désigner l’opprobre, la honte ou le déshonneur. « Déshonneur » est clair en français moderne et conserve le lien avec les fautes ou l’égarement de la jeunesse sans les expliciter.
- source_word: כִּי
  choice: Car / car
  rationale: Le premier כִּי relie l’aveu à ce qui précède par une explication ; le second donne la cause de la honte exprimée.
theological_decisions:
- issue: Progression entre le retour et le regret pénitentiel
  choice: Distinguer « être revenu » de « regretter ce que l’on a fait »
  alternative: Traduire les deux verbes par des formulations relevant directement de la repentance
  rationale: L’hébreu emploie deux verbes distincts, שׁוב et נחם. La traduction maintient donc la progression entre le retour et le regret intérieur, sans imposer une systématisation doctrinale.
- issue: Sens de l’instruction reçue
  choice: Conserver le passif « avoir été instruit » sans nommer l’agent
  alternative: Expliciter « après que tu m’as instruit » ou traduire « après avoir compris »
  rationale: La forme hébraïque indique que le locuteur a été amené à connaître, mais elle ne nomme pas explicitement l’agent dans ce verset. Le passif préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme de la confession hébraïque, tout en distinguant clairement le retour, le regret, l’instruction et la honte. Les trois marqueurs de note figurent dans le texte principal dans l’ordre de leur apparition.
