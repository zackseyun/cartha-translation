  yaml_path: translation/ot/jeremiah/031/039.yaml
  text: And the measuring line will go out farther[a], straight ahead to the hill of Gareb[b], and then it will turn toward Goah.
translation:
  language: fr
  text: Le cordeau à mesurer s’étendra encore[a] devant lui[b], vers la colline de Gareb, puis il tournera en direction de Goah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nouveau ». Le mot hébreu עוֹד peut indiquer une répétition ou une extension supplémentaire ; dans ce contexte, il peut évoquer le prolongement du tracé.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « en face de lui » ou « devant lui ». Le référent exact du pronom n’est pas certain dans cette description des limites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: se prolongera
  rationale: Dans cette description prophétique du tracé des limites, le verbe exprime le mouvement du cordeau qui s’étend vers l’extérieur. Le futur convient au contexte.
- source_word: עוֹד
  choice: encore
  rationale: Le terme peut exprimer soit la répétition, soit une extension supplémentaire. « Encore » conserve cette souplesse en français, tandis que la note explicite l’autre lecture possible.
- source_word: קוה הַמִּדָּה
  choice: le cordeau à mesurer
  rationale: L’expression désigne le cordeau utilisé pour prendre des mesures ou tracer une limite; cette formulation garde l’image concrète et reste claire en français moderne.
- source_word: נֶגְדּוֹ
  choice: devant lui
  rationale: Cette traduction suit de près le sens spatial de la préposition et conserve le pronom dont le référent exact demeure incertain.
- source_word: עַל
  choice: jusqu’à
  rationale: Avec le mouvement du cordeau et un point topographique comme destination, « jusqu’à » exprime naturellement l’aboutissement du tracé.
- source_word: גִּבְעַת גָּרֵב
  choice: la colline de Gareb
  rationale: Le syntagme construit est rendu littéralement, et le nom de lieu est translittéré.
- source_word: וְנָסַב
  choice: puis il tournera
  rationale: Le verbe décrit un changement de direction dans le tracé d’une limite; « puis » rend clairement la succession des étapes.
- source_word: גֹּעָתָה
  choice: en direction de Goah
  rationale: La terminaison directionnelle du nom de lieu est explicitée par « en direction de ».
