  source_fidelity: 'Le sens général est fidèle : l’intensif initial, la lamentation d’Éphraïm, l’image du veau non formé, la répétition de שוב et le nom divin sont bien rendus. Toutefois, « j’ai reçu la correction » atténue et nominalise la forme passive וָאִוָּסֵר ; « j’ai été corrigé » préserve mieux la voix et l’écho verbal de l’hébreu. Le « Oui » initial n’est pas requis par l’infinitif absolu, déjà rendu par « bien ».'
  naturalness: Le français est moderne et clair. « J’ai bien entendu » est plus naturel et plus sobre que « Oui, j’ai bien entendu » dans ce contexte. « J’ai été corrigé » est idiomatique et assure un parallélisme net avec « Tu m’as corrigé ».
  terminology: « Éphraïm », « Yahweh » et « mon Dieu » conviennent. « Corrigé » rend de façon accessible le vocabulaire de discipline formative ; la note conserve utilement « discipliné » comme option. « Fais-moi revenir » maintient à juste titre la répétition du radical שוב.
