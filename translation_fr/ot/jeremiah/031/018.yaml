  text: שָׁמ֣וֹעַ שָׁמַ֗עְתִּי אֶפְרַ֨יִם֙ מִתְנוֹדֵ֔ד יִסַּרְתַּ֨/נִי֙ וָֽ/אִוָּסֵ֔ר כְּ/עֵ֖גֶל לֹ֣א לֻמָּ֑ד הֲשִׁיבֵ֣/נִי וְ/אָשׁ֔וּבָה כִּ֥י אַתָּ֖ה יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/018.yaml
  text: 'I have surely heard Ephraim grieving: ‘You disciplined me[a], and I was disciplined, like an untrained calf. Restore me, and I will return[b], for you are Yahweh my God.’'
translation:
  language: fr
  text: 'J’ai bien entendu Éphraïm se lamenter : « Tu m’as corrigé[a], et j’ai été corrigé, comme un veau qui n’est pas dressé. Fais-moi revenir, et je reviendrai[b], car toi, tu es Yahweh, mon Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tu m’as discipliné ». Le verbe hébreu désigne une correction destinée à former ou à redresser.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète le même verbe : littéralement, « Fais-moi revenir, et je reviendrai » ; on peut aussi comprendre « Ramène-moi, et je reviendrai ».'
    reason: lexical_clarification
lexical_decisions:
- source_word: שָׁמוֹעַ שָׁמַעְתִּי
  choice: Oui, j’ai bien entendu
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « bien » rend naturellement cette insistance en français, tandis que « Oui » lui donne sa pleine valeur discursive.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé et accentué selon l’usage français. Dans le contexte, il personnifie au singulier le peuple du royaume du Nord.
- source_word: מִתְנוֹדֵד
  choice: se lamenter
  rationale: Le participe hitpolèl de נוד peut évoquer une lamentation exprimée, avec une nuance réflexive. « se lamenter » est naturel en français et préserve cette nuance sans archaïsme.
- source_word: יִסַּרְתַּנִי
  choice: Tu m’as corrigé
  rationale: יסר désigne une correction disciplinaire. « corriger » exprime ici clairement l’action corrective sans suggérer seulement une punition.
- source_word: וָאִוָּסֵר
  choice: et j’ai reçu la correction
  rationale: La forme niphal peut être comprise passivement ou avec une nuance médiane. Cette formulation garde l’écho lexical tout en laissant entendre qu’Éphraïm a effectivement subi la correction.
- source_word: כְּעֵגֶל לֹא לֻמָּד
  choice: comme un veau qui n’est pas dressé
  rationale: La traduction conserve l’image agricole d’un jeune animal non encore habitué au dressage ou au joug.
- source_word: הֲשִׁיבֵנִי
  choice: Fais-moi revenir
  rationale: Le hiphil impératif de שוב signifie littéralement causer le retour. Cette formulation préserve le lien verbal explicite avec וְאָשׁוּבָה et la demande adressée à Dieu.
- source_word: וְאָשׁוּבָה
  choice: et je reviendrai
  rationale: La forme cohortative exprime le retour envisagé ou résolu en conséquence de l’action divine. Le futur français convient naturellement à cet enchaînement.
- source_word: כִּי אַתָּה יְהוָה אֱלֹהָי
  choice: car toi, tu es Yahweh, mon Dieu
  rationale: כִּי introduit le motif de la demande. La dislocation « toi, tu » rend l’insistance du pronom אַתָּה, et le nom divin est translittéré.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve ici le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Rapport entre l’action divine et le retour d’Éphraïm
  choice: « Fais-moi revenir, et je reviendrai »
  alternative: « Rétablis-moi, et je reviendrai »
  rationale: 'Le même radical שוב figure sous une forme causative puis simple. La traduction conserve cette répétition et la tension du texte : Éphraïm demande à Dieu de provoquer son retour, puis affirme qu’il reviendra.'
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition centrale de שוב est conservée, tout comme la personnification singulière d’Éphraïm. Les guillemets français marquent la parole rapportée.
