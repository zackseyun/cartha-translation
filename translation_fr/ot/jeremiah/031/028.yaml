revisions:
- from: Et il arrivera que, tout comme j’ai veillé sur eux pour déraciner, abattre, démolir, faire disparaître et faire venir le malheur[a], de même je veillerai sur eux pour bâtir et planter — déclaration de Yahweh.
  to: Et il arrivera que, tout comme j’ai veillé à les déraciner, à les abattre, à les démolir, à les faire disparaître et à faire venir le malheur[a], de même je veillerai à les bâtir et à les planter — déclaration de Yahweh.
  rationale: La révision remplace « veiller sur eux pour » par « veiller à les ... », formulation française idiomatique qui traduit la vigilance intentionnelle de שׁקד sans introduire la connotation protectrice habituelle de « veiller sur ». Les pronoms répétés rendent explicite, en français, le complément sous-entendu des infinitifs et gardent le parallélisme entre jugement et restauration.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens et la structure du texte hébreu sont bien rendus : l''opposition entre la vigilance divine exercée pour le jugement et celle exercée pour la restauration est conservée, de même que la série de cinq verbes destructeurs suivie de « bâtir et planter ». « Faire venir le malheur » rend correctement לְהָרֵעַ dans son contexte judiciaire, avec une note qui signale l''éventail sémantique pertinent.'
  naturalness: '« Veiller sur eux pour déraciner » est ambigu et peu naturel en français : « veiller sur » évoque normalement une protection ou une garde bienveillante. La construction « veiller à + infinitif » exprime clairement l''attention active et déterminée du verbe שׁקד, tout en préservant le parallélisme des deux membres.'
  terminology: « Yahweh » représente explicitement le tétragramme. « Déraciner », « abattre », « démolir », « faire disparaître », « bâtir » et « planter » maintiennent de façon intelligible l'accumulation et les images du texte. « Déclaration de Yahweh » est une représentation recevable de נְאֻם יְהוָה.
  issues:
  - severity: medium
    issue: Construction « veiller sur eux pour déraciner »
    rationale: En français moderne, « veiller sur quelqu'un » signifie ordinairement le protéger ou prendre soin de lui. Cette association brouille le fait que la vigilance est ici dirigée vers l'exécution d'actes de jugement. « Veiller à les déraciner » rend plus exactement la valeur active de שׁקד avec les infinitifs qui suivent.
