id: JER.31.28
reference: Jeremiah 31:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֞ה כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם לִ/נְת֧וֹשׁ וְ/לִ/נְת֛וֹץ וְ/לַ/הֲרֹ֖ס וּ/לְ/הַאֲבִ֣יד וּ/לְ/הָרֵ֑עַ כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם לִ/בְנ֥וֹת וְ/לִ/נְט֖וֹעַ נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/028.yaml
  text: And it shall be that[a], just as I watched over them to uproot and to tear down and to overthrow and to destroy and to bring harm, so I will watch over them to build and to plant, declares Yahweh.
translation:
  language: fr
  text: Et il arrivera que, tout comme j’ai veillé à les déraciner, à les abattre, à les démolir, à les faire disparaître et à faire venir le malheur[a], de même je veillerai à les bâtir et à les planter — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur faire du mal ». Le verbe hébreu peut désigner le fait de causer du tort ou de faire venir une calamité dans le cadre d’un jugement.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְהָיָה
  choice: Et il arrivera que
  rationale: Formule prophétique tournée vers l’avenir, naturelle en français moderne et plus directement événementielle que « il sera que ».
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: tout comme ... de même
  rationale: Rend explicitement la correspondance structurante entre le jugement passé et la restauration future.
- source_word: שָׁקַדְתִּי / אֶשְׁקֹד
  choice: j’ai veillé / je veillerai
  rationale: Conserve l’idée d’une attention vigilante et intentionnelle de Dieu, répétée à l’identique dans les deux volets du verset.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: 'Avec « veiller », cette préposition maintient le parallélisme : la même vigilance divine s’exerce d’abord en jugement, puis en restauration.'
- source_word: לִנְתוֹשׁ
  choice: déraciner
  rationale: Préserve l’image agricole, qui trouve son pendant dans « planter ».
- source_word: וְלִנְתוֹץ
  choice: abattre
  rationale: Terme courant désignant la destruction d’une construction et distinct du verbe suivant.
- source_word: וְלַהֲרֹס
  choice: démolir
  rationale: Maintient l’accumulation rhétorique des actes destructeurs sans fusionner ce verbe avec הַאֲבִיד.
- source_word: וּלְהַאֲבִיד
  choice: faire disparaître
  rationale: Rend la valeur causative de אבד et évite de répéter « détruire » après les verbes de démolition.
- source_word: וּלְהָרֵעַ
  choice: faire venir le malheur
  rationale: Dans ce contexte de jugement, le causatif exprime l’action d’infliger le malheur ou la calamité; cette formulation évite d’attribuer sans nuance un mal moral à Dieu tout en conservant la force du terme.
- source_word: לִבְנוֹת וְלִנְטוֹעַ
  choice: bâtir et planter
  rationale: Conserve les deux images complémentaires de la restauration et répond à la série des verbes destructeurs.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique comme une parole solennelle attribuée directement à Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » représente le nom propre plutôt que de le remplacer par un titre.
- issue: Sens de וּלְהָרֵעַ appliqué à l’action divine
  choice: faire venir le malheur
  alternative: faire du mal
  rationale: Le contexte indique une calamité infligée en jugement. Le choix principal exprime ce sens sans effacer l’amplitude du verbe, signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’accumulation des cinq infinitifs de jugement et le parallélisme avec les deux infinitifs de restauration sont conservés. « Bâtir » convient au registre prophétique sans être archaïque.
