source:
  edition: WLC
  text: לֹ֣א כַ/בְּרִ֗ית אֲשֶׁ֤ר כָּרַ֨תִּי֙ אֶת אֲבוֹתָ֔/ם בְּ/יוֹם֙ הֶחֱזִיקִ֣/י בְ/יָדָ֔/ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֖רֶץ מִצְרָ֑יִם אֲשֶׁר הֵ֜מָּה הֵפֵ֣רוּ אֶת בְּרִיתִ֗/י וְ/אָנֹכִ֛י בָּעַ֥לְתִּי בָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/032.yaml
  text: not like the covenant that I made with their fathers on the day I took them by the hand to bring them out of the land of Egypt[a], my covenant that they themselves broke, though I was their husband, declares Yahweh.
translation:
  language: fr
  text: 'Elle ne sera pas comme l’alliance que j’ai conclue avec leurs pères, le jour où je les ai pris par la main pour les faire sortir du pays d’Égypte : mon alliance qu’ils ont eux-mêmes rompue, alors que j’étais leur époux[a], déclare Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « alors que j’étais leur maître » ou « alors que j’exerçais mon autorité sur eux ». Le verbe hébreu peut évoquer soit la relation conjugale, soit l’autorité ; la forme grecque citée en Hébreux 8.9 reflète ce second sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כַבְּרִית
  choice: Elle ne sera pas comme l’alliance
  rationale: Le כ préfixé exprime la comparaison. Le pronom « Elle » reprend naturellement « l’alliance » annoncée au verset précédent, sans nier l’existence d’une alliance.
- source_word: כָּרַתִּי
  choice: j’ai conclue
  rationale: L’expression hébraïque littérale « couper une alliance » se rend idiomatiquement en français par « conclure une alliance ».
- source_word: אֶת אֲבוֹתָם
  choice: avec leurs pères
  rationale: « Avec » convient à l’idiome français de l’alliance, tandis que « leurs pères » conserve la formulation familiale et historique de l’hébreu.
- source_word: בְּיוֹם הֶחֱזִיקִי בְיָדָם
  choice: le jour où je les ai pris par la main
  rationale: Cette formulation restitue l’image concrète d’une prise par la main, tout en restant naturelle en français.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: pour les faire sortir du pays d’Égypte
  rationale: Le causatif de יצא signifie ici « faire sortir » et renvoie directement à l’Exode.
- source_word: אֲשֶׁר הֵמָּה הֵפֵרוּ אֶת בְּרִיתִי
  choice: mon alliance, qu’eux-mêmes ont rompue
  rationale: « Eux-mêmes » préserve l’emphase du pronom indépendant הֵמָּה, et « rompre une alliance » est précis et idiomatique.
- source_word: וְאָנֹכִי
  choice: bien que je
  rationale: La conjonction et le pronom emphatique marquent ici un contraste entre leur rupture de l’alliance et la relation maintenue par Yahweh.
- source_word: בָּעַלְתִּי בָם
  choice: fusse leur époux
  rationale: Le verbe בעל peut exprimer la relation d’époux et s’accorde avec l’imagerie conjugale de l’alliance chez Jérémie. Le registre de « fusse » convient à la subordination concessive et au style prophétique digne.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette traduction rend clairement la formule prophétique et conserve le nom divin personnel.
theological_decisions:
- issue: Sens de בָּעַלְתִּי בָם dans la formule d’alliance
  choice: bien que je fusse leur époux
  alternative: bien que je fusse leur maître / que j’aie exercé mon autorité sur eux
  rationale: Le texte massorétique permet naturellement une lecture conjugale, cohérente avec l’imagerie prophétique de l’alliance. Cependant, le verbe peut aussi évoquer la maîtrise ou l’autorité; cette possibilité, reflétée par la forme grecque citée en Hébreux 8.9, est donc conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la comparaison, l’emphase sur « eux-mêmes » et la tension entre les sens conjugal et seigneurial de בעל. Le deux-points clarifie que « mon alliance » reprend l’alliance conclue lors de l’Exode.
