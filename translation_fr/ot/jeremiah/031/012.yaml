  text: וּ/בָאוּ֮ וְ/רִנְּנ֣וּ בִ/מְרוֹם צִיּוֹן֒ וְ/נָהֲר֞וּ אֶל ט֣וּב יְהוָ֗ה עַל דָּגָן֙ וְ/עַל תִּירֹ֣שׁ וְ/עַל יִצְהָ֔ר וְ/עַל בְּנֵי צֹ֖אן וּ/בָקָ֑ר וְ/הָיְתָ֤ה נַפְשָׁ/ם֙ כְּ/גַ֣ן רָוֶ֔ה וְ/לֹא יוֹסִ֥יפוּ לְ/דַאֲבָ֖ה עֽוֹד־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/012.yaml
  text: They will come and shout for joy on the height of Zion[a], and they will stream to the goodness of Yahweh, to the grain, the new wine, and the fresh oil, and to the young of the flock and the herd. Their life will be like a well-watered garden[d][c][b], and they will never again waste away.
translation:
  language: fr
  text: 'Ils viendront pousser des cris de joie sur la hauteur de Sion, et ils afflueront vers les bienfaits de Yahweh[a] : vers le blé, le vin nouveau et l’huile fraîche, vers les petits du petit bétail et du gros bétail. Leur vie[b] sera comme un jardin bien arrosé, et jamais plus ils ne dépériront[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers la bonté de Yahweh ». Le mot hébreu désigne ici la bonté de Yahweh manifestée dans les biens qu’il accorde, comme le montre la liste qui suit.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leur âme ». Ici, le terme hébreu désigne leur vie ou leur personne vivante tout entière, et non seulement une composante immatérielle.
    reason: lexical_clarification
  - marker: c
    text: Ou « ils ne languiront plus » ou « ils ne seront plus dans la peine ». Le verbe hébreu peut décrire une peine qui fait dépérir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ וְרִנְּנוּ
  choice: Ils viendront pousser des cris de joie
  rationale: Dans cette promesse prophétique, les formes verbales décrivent l’avenir. רנן exprime une manifestation vocale et jubilante de joie.
- source_word: בִמְרוֹם צִיּוֹן
  choice: sur la hauteur de Sion
  rationale: Le nom singulier מָרוֹם désigne ici le lieu élevé de Sion; «sur la hauteur» en conserve le nombre et l’image topographique.
- source_word: וְנָהֲרוּ
  choice: ils afflueront
  rationale: Le verbe évoque un mouvement comparable à celui d’un cours d’eau. «Affluer» restitue naturellement en français ce mouvement collectif vers les bienfaits de Yahweh.
- source_word: אֶל טוּב יְהוָה
  choice: vers les bienfaits de Yahweh
  rationale: טוּב désigne ici la bonté rendue concrète par les dons énumérés ensuite. «Bienfaits» exprime ce sens sans dissocier les dons de leur source divine.
- source_word: עַל דָּגָן וְעַל תִּירֹשׁ וְעַל יִצְהָר
  choice: vers le blé, le vin nouveau et l’huile fraîche
  rationale: La répétition de עַל introduit les manifestations concrètes des bienfaits. תִּירוֹשׁ est le vin nouveau et יִצְהָר l’huile fraîche, vraisemblablement l’huile d’olive.
- source_word: בְּנֵי צֹאן וּבָקָר
  choice: les petits du petit bétail et du gros bétail
  rationale: בְּנֵי désigne les jeunes animaux. Les termes צֹאן et בָּקָר distinguent le petit bétail du gros bétail sans imposer les espèces précises «agneaux» et «veaux».
- source_word: נַפְשָׁם
  choice: leur vie
  rationale: נֶפֶשׁ renvoie ici à la vie ou à la personne entière, et non exclusivement à une composante immatérielle appelée «âme».
- source_word: כְּגַן רָוֶה
  choice: comme un jardin bien arrosé
  rationale: רָוֶה évoque un jardin abondamment irrigué et florissant; «bien arrosé» est précis et idiomatique.
- source_word: וְלֹא יוֹסִיפוּ לְדַאֲבָה עוֹד
  choice: et jamais plus ils ne dépériront
  rationale: La construction marque la cessation définitive. דָּאַב peut évoquer le fait de languir ou de dépérir sous l’effet de la peine; «dépérir» conserve à la fois la souffrance et son effet sur la vitalité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. La translittération «Yahweh» le distingue d’un simple titre.
- issue: Portée de נֶפֶשׁ
  choice: leur vie
  alternative: leur âme
  rationale: Dans ce contexte de restauration concrète et de vitalité retrouvée, le terme désigne la vie ou l’être entier. «Âme» risquerait de restreindre indûment le sens à l’immatériel.
- issue: Sens de טוּב יְהוָה
  choice: les bienfaits de Yahweh
  alternative: la bonté de Yahweh
  rationale: Le mot peut exprimer la bonté divine ou l’abondance qu’elle procure. La liste agricole qui suit favorise ici «bienfaits», tandis que la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement poétique du texte hébreu, avec «afflueront» pour l’image de l’écoulement et une énumération claire des dons agricoles. Les répétitions hébraïques sont légèrement allégées sans effacer leur structure.
