id: JER.31.30
reference: Jeremiah 31:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֛י אִם אִ֥ישׁ בַּ/עֲוֺנ֖/וֹ יָמ֑וּת כָּל הָֽ/אָדָ֛ם הָ/אֹכֵ֥ל הַ/בֹּ֖סֶר תִּקְהֶ֥ינָה שִׁנָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/030.yaml
  text: But each man will die for his own iniquity; every person who eats the sour grapes[a], his teeth will be set on edge.
translation:
  language: fr
  text: Mais chacun mourra pour sa propre faute ; toute personne qui mange des raisins verts[a] en aura les dents agacées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des raisins non mûrs ». Le mot hébreu désigne des raisins qui ne sont pas encore mûrs et qui sont donc acides.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: La locution introduit ici une correction contrastive par rapport au proverbe rejeté au verset précédent. « Mais » restitue naturellement cette opposition.
- source_word: אִישׁ
  choice: chacun
  rationale: Dans ce contexte, le singulier a une valeur distributive. « Chacun » exprime clairement la responsabilité individuelle sans alourdir la phrase.
- source_word: בַּעֲוֺנוֹ
  choice: pour sa propre faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de celle-ci. Ici, « faute » conserve le sens moral, tandis que « propre » rend le suffixe personnel et l'accent distributif.
- source_word: יָמוּת
  choice: mourra
  rationale: Le futur simple convient à cette déclaration prophétique.
- source_word: כָּל הָאָדָם
  choice: toute personne
  rationale: אָדָם désigne ici l'être humain de manière générique, et la construction singulière est distributive. « Toute personne » est naturelle en français moderne.
- source_word: הָאֹכֵל
  choice: qui mange
  rationale: Le participe fonctionne comme une proposition relative caractérisant la personne concernée.
- source_word: הַבֹּסֶר
  choice: des raisins verts
  rationale: בֹּסֶר désigne des raisins non mûrs, donc acides. « Raisins verts » conserve l'image proverbiale et se comprend naturellement en français.
- source_word: תִּקְהֶינָה שִׁנָּיו
  choice: en aura les dents agacées
  rationale: L'expression décrit l'effet des raisins acides sur les dents. « Avoir les dents agacées » est l'équivalent idiomatique français, et « en » explicite naturellement le rapport de conséquence.
theological_decisions:
- issue: Responsabilité individuelle et responsabilité collective
  choice: Le verset affirme que chacun meurt pour sa propre faute.
  alternative: Une simple reformulation proverbiale sans accent théologique particulier sur la responsabilité individuelle.
  rationale: La syntaxe oppose nettement cette affirmation au proverbe du verset précédent et souligne la responsabilité personnelle, sans tirer de conclusion doctrinale plus large que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme proverbial tout en évitant un calque peu naturel de l'hébreu. Le point-virgule marque les deux affirmations liées, et le pronom « en » rend idiomatiquement le rapport entre les raisins verts et l'effet sur les dents.
