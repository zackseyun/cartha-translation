  text: וְ/יֵשׁ תִּקְוָ֥ה לְ/אַחֲרִיתֵ֖/ךְ נְאֻם יְהוָ֑ה וְ/שָׁ֥בוּ בָנִ֖ים לִ/גְבוּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/017.yaml
  text: There is hope for your future[a], declares Yahweh[b], and your children will return to their own territory.
translation:
  language: fr
  text: Il y a de l’espérance pour ton avenir[a], déclare Yahweh, et tes enfants reviendront sur leur territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour ta fin dernière » ou « quant à l’issue qui t’attend ».
    reason: lexical_alternative
  - marker: b
    text: Ou, plus littéralement, « tes fils reviendront dans leur territoire »; l’hébreu peut aussi désigner une « frontière ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Il y a
  rationale: Rend naturellement la tournure existentielle; la conjonction initiale n’a pas besoin d’être exprimée en français.
- source_word: תִּקְוָה
  choice: de l’espérance
  rationale: « Espérance » convient au registre biblique tout en restant actuel et exprime ici l’attente confiante d’un rétablissement.
- source_word: לְאַחֲרִיתֵךְ
  choice: pour ton avenir
  rationale: אַחֲרִית peut désigner la fin, l’issue ou l’avenir; dans cette promesse de restauration, « avenir » communique clairement l’orientation future sans effacer les autres nuances, signalées en note.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend avec gravité la formule prophétique et conserve le nom divin explicite.
- source_word: וְשָׁבוּ
  choice: reviendront
  rationale: Le parfait avec waw reçoit ici, dans le discours prophétique, une valeur future; « reviendront » préserve aussi le thème du retour.
- source_word: בָנִים
  choice: tes enfants
  rationale: Bien que le nom soit formellement masculin pluriel, il désigne dans le contexte les descendants de Rachel collectivement; « enfants » rend ce sens sans le limiter aux fils.
- source_word: לִגְבוּלָם
  choice: sur leur territoire
  rationale: גְּבוּל peut désigner une frontière ou le territoire qu’elle délimite. Le français idiomatique dit revenir « sur » un territoire; le possessif exprime qu’il s’agit du leur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve ici le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de בָנִים
  choice: tes enfants
  alternative: tes fils
  rationale: Le contexte évoque Rachel et le retour collectif de ses descendants; le français « enfants » conserve cette portée sans imposer une référence exclusivement masculine.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé pour l’adresse féminine singulière à Rachel. La formulation reste proche de la structure hébraïque tout en étant idiomatique.
