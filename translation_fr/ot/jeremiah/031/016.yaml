base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/016.yaml
  text: 'Thus says Yahweh: Restrain your voice from weeping and your eyes from tears[a], for there is a reward for your work, declares Yahweh[b], and they will return from the land of the enemy.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Ne laisse plus ta voix pleurer ni tes yeux verser de larmes[a], car il y a une récompense pour ton travail — déclare Yahweh —, et ils reviendront du pays de l’ennemi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Retiens ta voix de pleurer. »'
    reason: lexical_alternative
  - marker: b
    text: Le sujet sous-entendu de « ils reviendront » est celui des enfants de Rachel, c’est-à-dire des exilés évoqués dans le contexte.
    reason: cross_reference
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique consacrée, rendue de manière concise et solennelle. Le nom divin est translittéré « Yahweh ».
- source_word: מִנְעִי
  choice: Retiens
  rationale: Impératif féminin singulier de מנע, adressé à Rachel personnifiée. « Retiens » conserve l’exhortation directe sans l’aplatir en simple constat.
- source_word: קוֹלֵךְ מִבֶּכִי
  choice: ta voix de pleurer
  rationale: Cette formulation conserve l’image hébraïque inhabituelle de la voix que l’on retient loin des pleurs, plutôt que de réduire le sens à « cesse de pleurer ».
- source_word: וְעֵינַיִךְ מִדִּמְעָה
  choice: et tes yeux de verser des larmes
  rationale: Le complément verbal explicite produit un français compréhensible tout en maintenant le parallélisme concret entre la voix et les yeux.
- source_word: כִּי יֵשׁ שָׂכָר
  choice: car il y a une récompense
  rationale: שָׂכָר peut désigner un salaire, une rétribution ou une récompense. « Récompense » convient au contexte de promesse sans imposer une nuance strictement commerciale.
- source_word: לִפְעֻלָּתֵךְ
  choice: pour ton travail
  rationale: פְעֻלָּה désigne l’action, l’œuvre ou le travail. « Travail » reste large, naturel et fidèle au rapport avec la récompense.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale conserve la solennité et le caractère distinct de נְאֻם, au lieu de la confondre avec la formule introductive « Ainsi parle ».
- source_word: וְשָׁבוּ
  choice: et ils reviendront
  rationale: Le parfait avec waw reçoit ici une valeur future dans le discours prophétique. Le sujet pluriel demeure implicite dans l’hébreu et est donc rendu par le simple pronom « ils ».
- source_word: מֵאֶרֶץ אוֹיֵב
  choice: du pays de l’ennemi
  rationale: La construction garde le singulier générique ou collectif de אוֹיֵב et correspond au cadre de l’exil.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Sujet implicite de וְשָׁבוּ
  choice: ils reviendront
  alternative: tes enfants reviendront
  rationale: L’hébreu ne nomme pas le sujet du verbe pluriel. Le pronom maintient cette concision et cette légère implicitation, tandis que le contexte identifie les personnes visées aux enfants de Rachel, c’est-à-dire aux exilés.
translation_notes:
  register: Français international moderne, au registre digne et prophétique. La formulation conserve volontairement l’image poétique de la voix qui pleure et le parallélisme entre la voix et les yeux, malgré une tournure légèrement marquée.
