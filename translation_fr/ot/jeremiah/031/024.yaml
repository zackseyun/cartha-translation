  yaml_path: translation/ot/jeremiah/031/024.yaml
  text: And Judah and all its cities will dwell there together[a], farmers and those who journey with the flock.
translation:
  language: fr
  text: 'Juda et toutes ses villes y habiteront ensemble : les cultivateurs et ceux qui se déplaceront avec le troupeau[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bergers qui se déplaceront avec leurs troupeaux ». L’hébreu dit littéralement « et ils partiront avec le troupeau » ; il s’agit probablement de pasteurs nomades ou itinérants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: y habiteront
  rationale: Le verbe יָשַׁב exprime ici le fait d’habiter ou de demeurer. Le pronom adverbial « y » reprend naturellement en français le lieu féminin désigné par בָהּ, sans préciser davantage son référent.
- source_word: יְהוּדָה וְכָל עָרָיו
  choice: Juda et toutes ses villes
  rationale: « Juda » conserve le nom propre et peut désigner collectivement le pays et sa population. Le possessif masculin singulier de עָרָיו renvoie naturellement à Juda ; « ses villes » est idiomatique en français.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe indique une habitation commune ou simultanée ; « ensemble » en restitue simplement le sens.
- source_word: אִכָּרִים
  choice: les cultivateurs
  rationale: Le terme désigne ceux qui travaillent la terre. « Cultivateurs » est moderne, clair et légèrement plus précis que « agriculteurs » dans ce contexte ancien.
- source_word: וְנָסְעוּ בָּעֵדֶר
  choice: et ceux qui se déplaceront avec le troupeau
  rationale: נָסַע signifie partir, se mettre en route ou se déplacer. Le texte hébreu ne nomme pas explicitement les bergers ; la tournure « ceux qui » préserve cette retenue tout en rendant la phrase compréhensible. עֵדֶר est conservé au singulier par « le troupeau ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les deux-points clarifient que les cultivateurs et les personnes se déplaçant avec le troupeau sont les habitants évoqués, sans ajouter une identification absente de l’hébreu.
