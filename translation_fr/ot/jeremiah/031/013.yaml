  text: אָ֣ז תִּשְׂמַ֤ח בְּתוּלָה֙ בְּ/מָח֔וֹל וּ/בַחֻרִ֥ים וּ/זְקֵנִ֖ים יַחְדָּ֑ו וְ/הָפַכְתִּ֨י אֶבְלָ֤/ם לְ/שָׂשׂוֹן֙ וְ/נִ֣חַמְתִּ֔י/ם וְ/שִׂמַּחְתִּ֖י/ם מִ/יגוֹנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/013.yaml
  text: Then the virgin will rejoice in the dance[a], and young men and old men together; and I will turn their mourning into gladness[c][b], and I will comfort them and make them rejoice from their sorrow.
translation:
  language: fr
  text: Alors la jeune femme[a] se réjouira dans la danse ; les jeunes hommes et les vieillards se réjouiront ensemble. Je changerai leur deuil en allégresse[b] ; je les consolerai et les réjouirai, les éloignant de leur chagrin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la vierge ». Le singulier hébreu représente probablement les jeunes femmes de la communauté.
    reason: lexical_alternative
  - marker: b
    text: Ou « en joie » ou « en réjouissance ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « de leur chagrin ». La préposition peut évoquer l’éloignement ou la sortie hors du chagrin.
    reason: translation_clarity
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque naturellement en français le résultat futur des promesses de rétablissement qui précèdent.
- source_word: בְּתוּלָה
  choice: la jeune femme
  rationale: Le nom peut désigner une vierge ou une jeune femme en âge de se marier. Ici, le singulier paraît représenter les jeunes femmes de la communauté ; « jeune femme » est naturel et évite de faire de la virginité le point central du passage.
- source_word: בְּמָחוֹל
  choice: dans la danse
  rationale: Conserve l’image concrète de la danse comme cadre et expression de la réjouissance.
- source_word: וּבַחֻרִים וּזְקֵנִים יַחְדָּו
  choice: et les jeunes hommes comme les vieillards, tous ensemble
  rationale: Rend le contraste d’âge et l’idée de participation commune, sans donner à זְקֵנִים le sens institutionnel d’« anciens ».
- source_word: וְהָפַכְתִּי אֶבְלָם לְשָׂשׂוֹן
  choice: Je changerai leur deuil en allégresse
  rationale: Exprime clairement le passage d’un état à son contraire ; « allégresse » convient à la joie publique et festive de שָׂשׂוֹן.
- source_word: וְנִחַמְתִּים
  choice: je les consolerai
  rationale: Rend le piel de נחם dans son sens de consolation après la détresse.
- source_word: וְשִׂמַּחְתִּים מִיגוֹנָם
  choice: et leur donnerai de la joie après leur chagrin
  rationale: Préserve la valeur causative de שׂמח. Dans ce contexte, מִן indique naturellement l’éloignement ou le passage hors du chagrin ; « après » produit un français clair sans confondre celui-ci avec la source de la joie.
theological_decisions:
- issue: Singulier représentatif de בְּתוּלָה
  choice: Conserver le singulier sous la forme « la jeune femme » et signaler sa portée probablement représentative.
  alternative: « les jeunes femmes » ou « la vierge »
  rationale: Le singulier hébreu mérite d’être visible, mais le contexte communautaire indique vraisemblablement une figure représentative. La note maintient aussi l’alternative lexicale « vierge ».
- issue: Sens de זְקֵנִים
  choice: « les vieillards »
  alternative: « les anciens »
  rationale: Le parallélisme avec « les jeunes hommes » met au premier plan l’âge plutôt qu’une fonction sociale ou religieuse.
- issue: Rapport exprimé par מִיגוֹנָם
  choice: « après leur chagrin »
  alternative: « loin de leur chagrin », « au sortir de leur chagrin » ou, très littéralement, « de leur chagrin »
  rationale: La préposition peut exprimer l’éloignement ou la sortie d’un état. La traduction choisie ne présente pas le chagrin comme la cause de la joie et respecte le mouvement de restauration.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation répartit les deux volets du verset sans effacer leur enchaînement. « Vieillards » marque clairement le contraste générationnel ; « allégresse » conserve le registre festif sans rendre l’ensemble archaïque.
