revisions:
- from: Alors la jeune femme[a] se réjouira dans la danse, et les jeunes hommes comme les vieillards, tous ensemble. Je changerai leur deuil en allégresse[b] ; je les consolerai et leur donnerai de la joie après leur chagrin[c].
  to: Alors la jeune femme[a] se réjouira dans la danse ; les jeunes hommes et les vieillards se réjouiront ensemble. Je changerai leur deuil en allégresse[b] ; je les consolerai et les réjouirai, les éloignant de leur chagrin[c].
  rationale: La révision conserve les choix lexicaux solides du projet, mais rend la coordination des groupes d’âge sans nuance comparative et exprime plus fidèlement la relation de sortie hors du chagrin. La note c est également corrigée afin de ne pas attribuer une valeur littérale indue à des paraphrases interprétatives.
