source:
  edition: WLC
  text: מֵ/רָח֕וֹק יְהוָ֖ה נִרְאָ֣ה לִ֑/י וְ/אַהֲבַ֤ת עוֹלָם֙ אֲהַבְתִּ֔י/ךְ עַל כֵּ֖ן מְשַׁכְתִּ֥י/ךְ חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/003.yaml
  text: 'From far away Yahweh appeared to me: “I have loved you with an everlasting love[b][a]; therefore I have drawn you with steadfast love.”'
translation:
  language: fr
  text: 'De loin, Yahweh m’est apparu[a] :


    « Je t’ai aimée d’un amour éternel ;


    c’est pourquoi je t’ai attirée avec un amour fidèle[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « Yahweh lui est apparu de loin », selon la manière de rattacher « de loin » et d’identifier le pronom dans le contexte.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu חֶסֶד désigne un amour loyal et durable, souvent associé à la fidélité dans l’alliance. On pourrait aussi traduire : « avec bonté » ou « avec fidélité à l’alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרָחוֹק
  choice: De loin
  rationale: L’expression indique l’éloignement et reste naturellement rattachable à « est apparu », tout en conservant une certaine souplesse syntaxique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve ici le nom personnel plutôt que de le remplacer par un titre.
- source_word: נִרְאָה לִי
  choice: m’est apparu
  rationale: Le nifal de ראה exprime couramment l’apparition ; cette formulation est idiomatique et proche de l’hébreu.
- source_word: אַהֲבַת עוֹלָם
  choice: d’un amour éternel
  rationale: עוֹלָם évoque ici une durée sans fin ; « amour éternel » est clair, digne et naturel en français contemporain.
- source_word: אֲהַבְתִּיךְ
  choice: Je t’aime
  rationale: Le parfait hébreu présente un amour établi qui demeure actuel. Le présent français exprime naturellement cette continuité mieux qu’un passé composé potentiellement ponctuel.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette locution rend clairement le lien de conséquence, dans un registre moins raide que « par conséquent ».
- source_word: מְשַׁכְתִּיךְ
  choice: je t’ai attirée à moi
  rationale: משך signifie tirer ou attirer. « À moi » explicite le mouvement relationnel impliqué sans remplacer l’image du verbe ; le féminin correspond à la destinataire collective, Israël personnifiée.
- source_word: חָסֶד
  choice: avec un amour fidèle
  rationale: חסד désigne une bonté aimante, loyale et durable, souvent située dans le cadre de l’alliance. « Amour fidèle » garde sa proximité avec אַהֲבָה tout en distinguant les deux termes.
theological_decisions:
- issue: Rapport entre אַהֲבָה et חָסֶד
  choice: Traduire par « amour » puis « amour fidèle »
  alternative: Employer « amour » pour les deux termes, ou rendre חָסֶד par « fidélité à l’alliance »
  rationale: Les deux mots sont proches mais non identiques. La formulation choisie préserve leur relation et leur différence sans imposer un vocabulaire confessionnel technique.
- issue: Valeur temporelle des parfaits אֲהַבְתִּיךְ et מְשַׁכְתִּיךְ
  choice: Employer le présent pour l’amour durable et le passé composé pour l’action d’attirer
  alternative: 'Employer deux passés composés : « je t’ai aimée… je t’ai attirée »'
  rationale: Le français ne reproduit pas mécaniquement l’aspect verbal hébreu. Le présent fait entendre la permanence de l’amour, tandis que le passé composé présente l’action divine passée avec sa portée actuelle.
- issue: Genre de la destinataire
  choice: Marquer le féminin dans « attirée »
  alternative: Reformuler pour éviter toute marque de genre
  rationale: Le suffixe hébreu de deuxième personne est féminin singulier et renvoie vraisemblablement à Israël personnifiée ; le conserver respecte la forme du texte sans préciser davantage son identité.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est conservé sur trois lignes. « Yahweh » maintient le nom divin ; « amour fidèle » évite à la fois l’archaïsme et un jargon théologique trop étroit.
