source:
  edition: WLC
  text: כִּ֣י יֶשׁ י֔וֹם קָרְא֥וּ נֹצְרִ֖ים בְּ/הַ֣ר אֶפְרָ֑יִם ק֚וּמוּ וְ/נַעֲלֶ֣ה צִיּ֔וֹן אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/006.yaml
  text: For there will be a day when watchmen will call out on the hill country of Ephraim[a], ‘Rise up, and let us go up to Zion[b], to Yahweh our God.’
translation:
  language: fr
  text: 'Car un jour viendra où des guetteurs lanceront cet appel dans la région montagneuse d’Éphraïm[a] : « Debout ! Montons à Sion, vers Yahweh[b], notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les montagnes d’Éphraïm » ; l’hébreu emploie le singulier « montagne » pour désigner cette région montagneuse.'
    reason: lexical_alternative
  - marker: b
    text: Yahweh représente le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur explicative du lien avec la promesse précédente.
- source_word: יֶשׁ יוֹם
  choice: un jour viendra
  rationale: Rend naturellement en français la perspective future de la tournure existentielle dans ce contexte prophétique.
- source_word: קָרְאוּ
  choice: lanceront cet appel
  rationale: Le parfait peut exprimer ici une action future tenue pour certaine; cette formulation convient à une proclamation publique et introduit naturellement les paroles citées.
- source_word: נֹצְרִים
  choice: des guetteurs
  rationale: Le participe désigne ceux qui surveillent ou gardent; « guetteurs » maintient l’image concrète sans préciser davantage leur fonction.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: Le singulier הַר peut désigner collectivement le territoire montagneux d’Éphraïm plutôt qu’un sommet isolé.
- source_word: קוּמוּ
  choice: Debout !
  rationale: Rend avec vigueur l’impératif pluriel qui met les auditeurs en mouvement.
- source_word: וְנַעֲלֶה
  choice: Montons
  rationale: Préserve la valeur exhortative inclusive du cohortatif ainsi que l’idée d’une montée géographique et cultuelle vers Sion.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française consacrée du nom de lieu, qui en conserve aussi la portée théologique.
- source_word: אֶל יְהוָה
  choice: vers Yahweh
  rationale: « vers » exprime le mouvement orienté vers Dieu; « Yahweh » représente directement le nom divin YHWH.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend simplement le possessif communautaire et l’affirmation d’appartenance à Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend explicitement le nom propre divin présent dans le texte hébreu, tandis que la note signale l’usage traditionnel sans imposer une lecture confessionnelle particulière.
- issue: Sens de נֹצְרִים dans ce contexte
  choice: guetteurs
  alternative: gardiens / sentinelles
  rationale: « Guetteurs » préserve l’image de personnes chargées de veiller et lançant un appel public; le texte ne précise pas davantage leur statut.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le rythme de l’appel est conservé par « Debout ! Montons… ». Le marqueur [b] est placé à la fin de la phrase pour éviter de couper l’expression « Yahweh notre Dieu », tout en renvoyant clairement au nom divin.
