  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים נְאֻם יְהוָ֑ה וְ/נִבְנְתָ֤ה הָ/עִיר֙ לַֽ/יהוָ֔ה מִ/מִּגְדַּ֥ל חֲנַנְאֵ֖ל שַׁ֥עַר הַ/פִּנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/038.yaml
  text: Behold[a], days are coming, declares Yahweh, when the city will be rebuilt for Yahweh, from the Tower of Hananel to the Corner Gate.
translation:
  language: fr
  text: 'Voici : des jours viennent — déclaration de Yahweh — où la ville sera rebâtie pour Yahweh, depuis la tour de Hananel jusqu’à la porte de l’Angle[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera bâtie » ; le passif hébreu peut désigner aussi bien la construction que la reconstruction, mais le contexte de restauration favorise « sera rebâtie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה יָמִים
  choice: Voici que des jours viennent
  rationale: Cette tournure française actuelle conserve la force déictique et solennelle de l’annonce prophétique tout en rendant naturellement l’idiome hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: La formule nominale préserve le caractère formel et autoritatif de נְאֻם, tandis que le nom divin est translittéré.
- source_word: וְנִבְנְתָה
  choice: sera rebâtie
  rationale: Le nifal exprime ici le passif. Dans le contexte de la restauration de Jérusalem, « rebâtie » est plus probable que « bâtie », sans exclure cette possibilité, signalée en note.
- source_word: הָעִיר
  choice: la ville
  rationale: Le texte hébreu ne nomme pas explicitement Jérusalem; la traduction conserve donc la formulation générique dont le référent ressort du contexte.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le lamed indique vraisemblablement la destination, l’appartenance ou la consécration de la ville à Yahweh; « pour » rend naturellement cette relation.
- source_word: מִמִּגְדַּל חֲנַנְאֵל
  choice: depuis la tour de Hananel
  rationale: מִן marque le point de départ de l’étendue annoncée; le nom propre est translittéré selon une forme française transparente.
- source_word: שַׁעַר הַפִּנָּה
  choice: jusqu’à la porte de l’Angle
  rationale: La préposition d’arrivée est implicite après le point de départ exprimé par מִן. Le nom topographique est traduit littéralement et clairement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Portée de לַיהוָה
  choice: pour Yahweh
  alternative: à Yahweh
  rationale: « Pour » exprime sans surdétermination que la ville reconstruite lui est destinée, lui appartient ou lui est consacrée.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici que » maintient le relief prophétique sans archaïsme excessif; les tirets isolent naturellement la formule d’oracle. Le nom divin est rendu de manière cohérente par « Yahweh ».
