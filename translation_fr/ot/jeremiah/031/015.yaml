  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה ק֣וֹל בְּ/רָמָ֤ה נִשְׁמָע֙ נְהִי֙ בְּכִ֣י תַמְרוּרִ֔ים רָחֵ֖ל מְבַכָּ֣ה עַל בָּנֶ֑י/הָ מֵאֲנָ֛ה לְ/הִנָּחֵ֥ם עַל בָּנֶ֖י/הָ כִּ֥י אֵינֶֽ/נּוּ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/015.yaml
  text: 'Thus says Yahweh: “A voice is heard in Ramah[a], lamentation and bitter weeping—Rachel weeping for her children. She refuses to be comforted for her children[b], because they are no more.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Une voix se fait entendre à Rama[a] : une plainte, des pleurs amers. Rachel pleure ses enfants. Elle refuse d’être consolée au sujet de ses enfants, car ils ne sont plus[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rama était une ville du territoire de Benjamin. Rachel est ici représentée poétiquement comme la mère ancestrale qui pleure ses descendants.
    reason: cultural_note
  - marker: b
    text: 'Ou, plus littéralement : « car il n’est plus ». L’hébreu emploie ici une forme au singulier, bien que le contexte parle collectivement des enfants de Rachel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin sous sa forme usuelle dans le projet, plutôt que de le remplacer par un titre.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Rend naturellement en français moderne la formule solennelle du messager prophétique.
- source_word: קוֹל בְּרָמָה נִשְׁמָע
  choice: Une voix se fait entendre à Rama
  rationale: Préserve l’image auditive et l’ordre emphatique de l’hébreu dans une formulation française idiomatique.
- source_word: נְהִי
  choice: une plainte
  rationale: Désigne ici une lamentation funèbre; « plainte » est clair, digne et s’accorde bien avec les pleurs qui suivent.
- source_word: בְּכִי תַמְרוּרִים
  choice: des pleurs amers
  rationale: Reproduit l’intensité affective de la construction hébraïque sans lourdeur littérale.
- source_word: רָחֵל מְבַכָּה עַל בָּנֶיהָ
  choice: Rachel pleure ses enfants
  rationale: Le verbe avec עַל exprime le deuil à leur sujet; « enfants » rend la valeur collective de בנים dans ce contexte.
- source_word: מֵאֲנָה לְהִנָּחֵם
  choice: Elle refuse d’être consolée
  rationale: Conserve le refus volontaire et le sens passif du niphal.
- source_word: כִּי אֵינֶנּוּ
  choice: car ils ne sont plus
  rationale: Le singulier grammatical renvoie idiomatiquement au collectif « ses enfants »; le pluriel est requis en français courant, tandis que la forme source est signalée en note.
theological_decisions:
- issue: Nombre et référent de כִּי אֵינֶנּוּ après le collectif « ses enfants »
  choice: car ils ne sont plus
  alternative: car il n’est plus
  rationale: La forme hébraïque est singulière, mais son antécédent contextuel est le collectif « ses enfants ». Le texte principal exprime le sens collectif naturel en français, sans effacer la particularité grammaticale, qui est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La cadence poétique est conservée par des phrases brèves et une ponctuation qui distingue l’annonce auditive, la lamentation et le portrait de Rachel. Tous les appels de note figurent dans le texte principal et correspondent à leur contenu.
