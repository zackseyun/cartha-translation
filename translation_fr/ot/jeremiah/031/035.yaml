language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה נֹתֵ֥ן שֶׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם חֻקֹּ֛ת יָרֵ֥חַ וְ/כוֹכָבִ֖ים לְ/א֣וֹר לָ֑יְלָה רֹגַ֤ע הַ/יָּם֙ וַ/יֶּהֱמ֣וּ גַלָּ֔י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/035.yaml
  text: 'Thus says Yahweh[a], who gives the sun for light by day, the fixed order of the moon and stars for light by night[b], who stirs up the sea so that its waves roar—Yahweh of hosts is his name:'
translation:
  language: fr
  text: 'Ainsi parle Yahweh,


    celui qui donne le soleil pour éclairer le jour,


    qui établit l’ordre immuable[a] de la lune et des étoiles pour éclairer la nuit,


    qui agite[b] la mer, et ses vagues grondent —


    Yahweh des armées est son nom :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les lois » ou « les règles fixes » de la lune et des étoiles. Le terme hébreu peut désigner des prescriptions ou un ordre établi ; dans ce contexte, il évoque la régularité des astres.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui apaise la mer ». Le verbe hébreu peut avoir ce sens dans d’autres contextes ; ici, le grondement des vagues favorise le sens « agite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formulation française, digne et naturelle, conserve la formule prophétique de messager et rend directement le nom divin.
- source_word: נֹתֵן שֶׁמֶשׁ לְאוֹר יוֹמָם
  choice: celui qui donne le soleil pour éclairer le jour
  rationale: Le participe נֹתֵן décrit l’action constante de Yahweh; « pour éclairer » exprime naturellement la fonction indiquée par לְאוֹר.
- source_word: חֻקֹּת יָרֵחַ וְכוֹכָבִים
  choice: qui établit l’ordre immuable de la lune et des étoiles
  rationale: חֻקֹּת désigne ici l’ordre établi ou les lois fixes des astres. L’ajout verbal « établit » produit une syntaxe française claire sans changer l’agent implicite du texte.
- source_word: רֹגַע הַיָּם
  choice: qui agite la mer
  rationale: Bien que רֹגַע puisse ailleurs évoquer l’apaisement, la proposition suivante, où les vagues grondent, favorise ici l’idée d’agitation.
- source_word: וַיֶּהֱמוּ גַלָּיו
  choice: et ses vagues grondent
  rationale: La coordination garde la relation hébraïque sans imposer une valeur causale plus précise; « grondent » rend le bruit tumultueux exprimé par המה.
- source_word: יְהוָה צְבָאוֹת שְׁמוֹ
  choice: Yahweh des armées est son nom
  rationale: « Des armées » rend concrètement צְבָאוֹת tout en laissant ouverte l’étendue des forces célestes ou terrestres évoquées par le titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de רֹגַע appliqué à la mer
  choice: qui agite la mer
  alternative: qui apaise la mer
  rationale: Le grondement immédiat des vagues soutient le sens d’agitation, tout en reconnaissant que le verbe peut prendre ailleurs le sens d’apaiser.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: Yahweh des armées
  alternative: Yahweh de l’univers; Yahweh tout-puissant
  rationale: La traduction formelle préserve l’image des armées ou forces sans la réduire à une paraphrase doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme du vers hébreu est conservé par la disposition en lignes; le deux-points final maintient le lien syntaxique avec la suite du passage.
