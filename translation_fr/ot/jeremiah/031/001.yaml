id: JER.31.1
reference: Jeremiah 31:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה אֶֽהְיֶה֙ לֵֽ/אלֹהִ֔ים לְ/כֹ֖ל מִשְׁפְּח֣וֹת יִשְׂרָאֵ֑ל וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/001.yaml
  text: At that time[a], declares Yahweh, I will be God to all the families of Israel, and they will be my people.
translation:
  language: fr
  text: En ce temps-là, déclare Yahvé, je serai le Dieu de tous les clans[a] d’Israël, et eux, ils seront mon peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « familles ». Le terme hébreu peut désigner des groupes familiaux élargis au sein d’Israël.
    reason: Alternative lexicale pour מִשְׁפָּחוֹת, afin de préserver l’ambiguïté entre « clans » et « familles ».
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: En ce temps-là
  rationale: Expression temporelle naturelle en français moderne, qui conserve la référence prophétique à une période future.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: La formule prophétique נְאֻם exprime une déclaration solennelle; « déclare » reste clair et digne, tandis que le nom divin est rendu par « Yahvé ».
- source_word: אֶהְיֶה לֵאלֹהִים
  choice: je serai le Dieu de
  rationale: Cette tournure française idiomatique restitue la formule d’alliance et la relation d’appartenance exprimée par l’hébreu.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשְׂרָאֵל
  choice: de tous les clans d’Israël
  rationale: מִשְׁפָּחוֹת désigne ici vraisemblablement les groupes de parenté qui constituent Israël; « clans » est précis et naturel dans ce contexte collectif.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: et eux, ils seront mon peuple
  rationale: La dislocation « eux, ils » rend l’accent porté par le pronom hébreu הֵמָּה, tout en conservant la formule réciproque de l’alliance.
theological_decisions:
- issue: Formule d’alliance réciproque
  choice: je serai le Dieu de tous les clans d’Israël, et eux, ils seront mon peuple
  alternative: je serai Dieu pour toutes les familles d’Israël, et elles seront pour moi un peuple
  rationale: Le choix retient en français naturel la relation réciproque entre Dieu et Israël, sans atténuer la portée collective de « tous les clans » ni ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la solennité de l’oracle, le nom divin et l’emphase du pronom hébreu, sans archaïsme inutile.
