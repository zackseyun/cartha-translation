source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה מָצָ֥א חֵן֙ בַּ/מִּדְבָּ֔ר עַ֖ם שְׂרִ֣ידֵי חָ֑רֶב הָל֥וֹךְ לְ/הַרְגִּיע֖/וֹ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/002.yaml
  text: 'Thus says Yahweh: The people who survived the sword found favor in the wilderness; Israel[a], when it went to find rest for him.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh :


    « Le peuple qui a survécu à l’épée a trouvé grâce dans le désert ; Israël[a], quand il est allé lui procurer le repos. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand il est allé donner du repos à Israël ». L’hébreu de la dernière proposition est difficile et peut se comprendre de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin et préserve sa valeur de nom propre d’alliance, sans le remplacer par un titre.
- source_word: מָצָא חֵן
  choice: a trouvé faveur
  rationale: Rend directement l’expression idiomatique signifiant obtenir un accueil favorable, sans lui imposer une nuance théologique postérieure.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français biblique courant, « désert » peut désigner une région inculte ou peu habitée, et conserve l’écho de l’Exode.
- source_word: עַם שְׂרִידֵי חָרֶב
  choice: le peuple qui a survécu à l’épée
  rationale: Expression française claire qui conserve l’image hébraïque de rescapés d’une guerre ou d’un jugement.
- source_word: הָלוֹךְ
  choice: quand il est allé
  rationale: Donne à l’infinitif absolu une valeur verbale circonstancielle intelligible tout en maintenant l’idée de déplacement.
- source_word: לְהַרְגִּיעוֹ
  choice: lui procurer le repos
  rationale: Reflète la valeur causative du hiphil et le suffixe masculin singulier, sans identifier explicitement son référent.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom national ; sa position conserve son lien possible avec « le peuple » et l’ambiguïté syntaxique de la fin du verset.
theological_decisions:
- issue: Syntaxe et référents de הָלוֹךְ לְהַרְגִּיעוֹ יִשְׂרָאֵל
  choice: « Israël, quand il est allé lui procurer le repos »
  alternative: « quand il est allé donner du repos à Israël »
  rationale: L’hébreu permet difficilement de déterminer avec certitude le sujet implicite, le référent du suffixe masculin et la fonction exacte d’« Israël ». Le texte principal garde donc une formulation resserrée et la note signale une autre analyse importante, sans trancher artificiellement.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’image de l’épée et du désert ainsi que l’ambiguïté réelle de la proposition finale ; le marqueur [a] figure immédiatement après « Israël ».
