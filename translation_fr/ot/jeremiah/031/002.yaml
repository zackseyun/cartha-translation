  naturalness: « A trouvé faveur » est un calque peu naturel en français moderne. « A trouvé grâce » est l’expression française idiomatique correspondante et n’ajoute pas, dans ce contexte, de sens doctrinal. La construction finale demeure volontairement abrupte, car le texte hébreu l’est aussi; la note en avertit le lecteur.
  terminology: « Yahweh », « désert », « épée » et « Israël » sont appropriés. « Trouver grâce » restitue naturellement מצא חן. « Procurer le repos » maintient la valeur causative de להרגיעו sans fixer le référent du pronom.
