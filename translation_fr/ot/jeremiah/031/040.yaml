source:
  edition: WLC
  text: וְ/כָל הָ/עֵ֣מֶק הַ/פְּגָרִ֣ים וְ/הַ/דֶּ֡שֶׁן וְ/כָֽל ה/שרמות עַד נַ֨חַל קִדְר֜וֹן עַד פִּנַּ֨ת שַׁ֤עַר הַ/סּוּסִים֙ מִזְרָ֔חָ/ה קֹ֖דֶשׁ לַֽ/יהוָ֑ה לֹֽא יִנָּתֵ֧שׁ וְֽ/לֹא יֵהָרֵ֛ס ע֖וֹד לְ/עוֹלָֽם־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/040.yaml
  text: And the whole valley of the corpses and the ashes[a], and all the terraces as far as the Kidron Valley, as far as the corner of the Horse Gate toward the east, shall be holy to Yahweh[c][b]. It shall not be uprooted or overthrown again forever.
translation:
  language: fr
  text: L’ensemble de la vallée des cadavres et des cendres, ainsi que toutes les terrasses[a], jusqu’à la vallée du Cédron[b], jusqu’à l’angle de la porte des Chevaux, vers l’est, sera consacré à Yahweh. La ville ne sera plus jamais déracinée ni démolie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est difficile; on propose aussi « champs » ou « pentes ». Il est traditionnellement compris comme désignant les terrains en terrasses autour de Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire « le torrent du Cédron » ou « l’oued du Cédron »; le mot hébreu peut désigner aussi bien un cours d’eau saisonnier que sa vallée.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ne sera plus jamais arrachée ni abattue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵמֶק
  choice: la vallée
  rationale: עֵמֶק désigne couramment une vallée ou une zone basse; « vallée » convient naturellement à cette description topographique.
- source_word: הַפְּגָרִים
  choice: les cadavres
  rationale: פֶּגֶר désigne des corps morts. « Cadavres » rend directement l’image de souillure attachée autrefois à ce lieu.
- source_word: הַדֶּשֶׁן
  choice: les cendres
  rationale: Dans ce contexte, דֶּשֶׁן renvoie vraisemblablement à des amas de cendres provenant des sacrifices ou des déchets, plutôt qu’à la graisse au sens littéral.
- source_word: השרמות
  choice: les terrasses
  rationale: La forme hébraïque est difficile. « Terrasses » conserve l’interprétation topographique traditionnelle sans préciser indûment qu’il s’agit de champs cultivés.
- source_word: נַחַל קִדְרוֹן
  choice: la vallée du Cédron
  rationale: נַחַל peut désigner un oued, son cours d’eau saisonnier ou sa vallée. « Vallée du Cédron » est clair dans cette délimitation géographique.
- source_word: פִּנַּת שַׁעַר הַסּוּסִים
  choice: l’angle de la porte des Chevaux
  rationale: פִּנָּה signifie « angle » ou « coin »; « angle » convient à la description des limites de la ville.
- source_word: מִזְרָחָה
  choice: vers l’est
  rationale: L’adverbe directionnel indique l’orientation vers l’est.
- source_word: קֹדֶשׁ לַיהוָה
  choice: seront saintes pour Yahweh
  rationale: La formule exprime à la fois la sainteté et l’appartenance consacrée à Yahweh. L’accord au pluriel produit un français naturel avec les deux éléments énumérés.
- source_word: לֹא יִנָּתֵשׁ
  choice: ne sera plus jamais arrachée
  rationale: נתשׁ au nifal signifie être arraché ou déraciné. « Arrachée » maintient l’une des images récurrentes du livre de Jérémie.
- source_word: וְלֹא יֵהָרֵס
  choice: ni démolie
  rationale: הרס au nifal signifie être abattu ou démoli; « démolie » convient particulièrement à une ville ou à un espace bâti.
- source_word: עוֹד לְעוֹלָם
  choice: plus jamais
  rationale: Cette formulation française idiomatique réunit l’idée de répétition niée portée par עוֹד et celle de permanence portée par לְעוֹלָם.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Étendue de la sanctification
  choice: La vallée et les terrasses décrites seront saintes pour Yahweh
  alternative: Seule la ville reconstruite proprement dite serait sainte, les secteurs périphériques ne faisant qu’en marquer la limite
  rationale: La syntaxe place l’ensemble de la zone énumérée sous le prédicat קֹדֶשׁ לַיהוָה; la traduction conserve ce renversement frappant d’un ancien lieu de souillure en espace saint.
- issue: Référent implicite de la dernière proposition
  choice: « Elle » renvoie, selon le contexte, à la ville ou à l’entité territoriale décrite
  alternative: Rendre la proposition de manière impersonnelle ou répéter explicitement « la ville »
  rationale: L’hébreu n’exprime pas de sujet nominal dans cette proposition. Le pronom français maintient le lien contextuel sans ajouter explicitement un référent absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’énumération topographique et le contraste entre l’ancienne souillure du lieu et sa future sainteté. « Porte des Chevaux » garde la forme traditionnelle et transparente du toponyme.
