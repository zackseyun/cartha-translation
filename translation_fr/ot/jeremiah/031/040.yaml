    rationale: Dans le projet, « seront saintes » a pour sujet une énumération plurielle, tandis que « Elle ne sera » est singulier et ne possède pas d’antécédent grammatical clair. L’hébreu emploie des verbes singuliers; le contexte permet d’expliciter « la ville » pour produire un français clair.
  - severity: low
