revisions:
- from: Toute la vallée des cadavres et des cendres, ainsi que toutes les terrasses[a] jusqu’à la vallée du Cédron[b], jusqu’à l’angle de la porte des Chevaux, vers l’est, seront saintes pour Yahweh. Elle ne sera plus jamais arrachée ni démolie.
