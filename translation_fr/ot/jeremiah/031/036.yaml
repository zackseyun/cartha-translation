source:
  edition: WLC
  text: אִם יָמֻ֜שׁוּ הַ/חֻקִּ֥ים הָ/אֵ֛לֶּה מִ/לְּ/פָנַ֖/י נְאֻם יְהוָ֑ה גַּם֩ זֶ֨רַע יִשְׂרָאֵ֜ל יִשְׁבְּת֗וּ מִֽ/הְי֥וֹת גּ֛וֹי לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/036.yaml
  text: If these fixed ordinances depart from before me[a], declares Yahweh[c][b], then the offspring of Israel also will cease from being a nation before me forever.
translation:
  language: fr
  text: Si ces lois établies venaient à s’éloigner de devant moi[a] — déclaration de Yahvé —, alors la descendance d’Israël[b] cesserait, elle aussi, d’être une nation devant moi pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces prescriptions » ou « ces décrets » ; dans le contexte, l’expression désigne l’ordre stable établi pour la création.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la semence d’Israël », expression collective désignant sa descendance.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « tous les jours », expression qui marque ici une continuité durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמֻשׁוּ
  choice: venaient à disparaître
  rationale: Le verbe exprime ici l’éloignement ou la disparition d’un ordre maintenu en place. La tournure « venaient à » rend naturellement en français le caractère hypothétique de la condition.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: ces lois établies
  rationale: Dans le contexte immédiat, il s’agit de l’ordre fixé du soleil, de la lune et de la mer, non de commandements adressés aux humains. « Lois établies » conserve à la fois l’idée de règle et celle de stabilité.
- source_word: מִלְּפָנַי / לְפָנַי
  choice: de devant moi / devant moi
  rationale: Cette formulation préserve l’image spatiale et relationnelle de l’hébreu ainsi que la répétition interne du verset.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: Rend avec solennité la formule prophétique et la distingue d’un simple verbe de parole.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin représenté par le tétragramme hébreu.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: la descendance d’Israël
  rationale: Rend naturellement le nom collectif hébreu « semence » sans réduire la référence à une seule génération.
- source_word: יִשְׁבְּתוּ מִהְיוֹת גּוֹי
  choice: cesserait […] d’être une nation
  rationale: Conserve explicitement l’idée de cessation et l’identité collective et nationale exprimée par גּוֹי.
- source_word: כָּל הַיָּמִים
  choice: pour toujours
  rationale: Cette expression idiomatique française transmet clairement la continuité durable exprimée littéralement en hébreu par « tous les jours ».
theological_decisions:
- issue: La permanence de l’identité collective d’Israël
  choice: Conserver explicitement « la descendance d’Israël » et « être une nation devant moi »
  alternative: Généraliser la promesse en parlant seulement d’un peuple spirituel ou d’une continuité non nationale
  rationale: Le texte hébreu lie directement la permanence de la descendance d’Israël en tant que nation devant Dieu à la stabilité de l’ordre créé. La traduction maintient cette affirmation sans trancher les débats théologiques ultérieurs.
translation_notes:
  register: Français international actuel, digne et accessible. La construction hypothétique « venaient à… cesserait » souligne le rapport conditionnel sans affaiblir la solennité de la promesse. Les deux occurrences de לְפָנַי sont rendues de manière parallèle.
