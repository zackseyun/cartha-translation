  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ע֣וֹד יֹאמְר֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בְ/עָרָ֔י/ו בְּ/שׁוּבִ֖/י אֶת שְׁבוּתָ֑/ם יְבָרֶכְ/ךָ֧ יְהוָ֛ה נְוֵה צֶ֖דֶק הַ֥ר הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/023.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: They will yet say this word in the land of Judah and in its cities, when I restore their fortunes: “May Yahweh bless you, O habitation of righteousness[b], O holy mountain.”'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh des armées, le Dieu d’Israël : On dira encore cette parole dans le pays de Juda et dans ses villes, quand je rétablirai leur sort[a] : « Que Yahweh te bénisse, demeure de justice[b], montagne sainte ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand je ramènerai leurs captifs » ou « quand je les ferai revenir de captivité ». L’expression hébraïque peut désigner précisément le retour d’exil ou, plus largement, le rétablissement après le malheur.
    reason: lexical_alternative
  - marker: b
    text: Ou « lieu de séjour de la justice »; le mot hébreu peut aussi désigner un pâturage.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » transcrit le nom divin, tandis que « des armées » conserve la portée large du titre צְבָאוֹת sans préciser s’il s’agit d’armées célestes ou terrestres.
- source_word: עוֹד יֹאמְרוּ אֶת־הַדָּבָר הַזֶּה
  choice: On dira encore cette parole
  rationale: « Encore » exprime la reprise future de cette parole après la restauration. Le pronom indéfini « on » rend naturellement en français le pluriel hébreu sans sujet exprimé.
- source_word: בְּאֶרֶץ יְהוּדָה וּבְעָרָיו
  choice: dans le pays de Juda et dans ses villes
  rationale: Le suffixe masculin singulier renvoie à Juda envisagé comme territoire; « ses villes » est naturel en français.
- source_word: בְּשׁוּבִי אֶת־שְׁבוּתָם
  choice: quand je rétablirai leur situation
  rationale: Cette formulation rend l’idée générale d’un renversement favorable de leur condition, tout en laissant une note signaler le sens plus précis possible de retour de captivité.
- source_word: יְבָרֶכְךָ
  choice: Que Yahweh te bénisse
  rationale: L’imparfait hébreu a ici une valeur de souhait ou de bénédiction, bien rendue par le subjonctif français introduit par « que ».
- source_word: נְוֵה צֶדֶק
  choice: demeure de justice
  rationale: « Demeure » conserve le sens locatif de נָוֶה dans cette appellation de Jérusalem ou de Sion; « justice » rend צֶדֶק sans réduire sa portée à la seule rectitude morale individuelle.
- source_word: הַר הַקֹּדֶשׁ
  choice: montagne sainte
  rationale: Cette expression rend directement l’appellation de Sion comme montagne consacrée, sans ajouter un article absent de l’adresse poétique française.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme; sa transcription préserve le nom propre et évite de le remplacer par un titre.
- issue: Portée de l’expression שׁוּב שְׁבוּת
  choice: rétablir leur situation
  alternative: ramener leurs captifs / les faire revenir de captivité
  rationale: L’expression peut viser concrètement le retour d’exil ou, plus largement, le rétablissement après le malheur. Le texte principal garde cette amplitude et la note présente les lectures plus précises.
- issue: Référent de « demeure de justice, montagne sainte »
  choice: conserver l’adresse poétique sans expliciter le référent
  alternative: ajouter « Jérusalem » ou « Sion »
  rationale: Le contexte suggère Jérusalem ou Sion, mais le verset ne les nomme pas ici; les ajouter résoudrait implicitement ce que le texte laisse sous forme de titres.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique est légèrement solennelle sans archaïsme. Les deux marqueurs de note figurent à l’endroit exact où se présente l’ambiguïté lexicale.
