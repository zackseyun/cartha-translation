source:
  edition: WLC
  text: הֲ/בֵן֩ יַקִּ֨יר לִ֜/י אֶפְרַ֗יִם אִ֚ם יֶ֣לֶד שַׁעֲשֻׁעִ֔ים כִּֽי מִ/דֵּ֤י דַבְּרִ/י֙ בּ֔/וֹ זָכֹ֥ר אֶזְכְּרֶ֖/נּוּ ע֑וֹד עַל כֵּ֗ן הָמ֤וּ מֵעַ/י֙ ל֔/וֹ רַחֵ֥ם אֲֽרַחֲמֶ֖/נּוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/020.yaml
  text: Is Ephraim a precious son to me[a], a child of delight? For as often as I speak of him, I still surely remember him. Therefore my inward parts are stirred for him; I will surely have compassion on him[b], declares Yahweh.
translation:
  language: fr
  text: Éphraïm est-il pour moi un fils précieux, un enfant qui fait mes délices ? Car chaque fois que je parle de lui[a], je ne cesse de me souvenir de lui. C’est pourquoi mes entrailles frémissent pour lui[b] ; oui, j’aurai compassion de lui, déclare Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque fois que je parle contre lui ». L’hébreu peut signifier plus simplement « de lui » ou « à son sujet », mais le contexte peut évoquer les paroles de jugement prononcées contre Éphraïm.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement « mes entrailles frémissent pour lui » : image hébraïque d’une émotion profonde et compatissante ; on pourrait aussi traduire « mon cœur frémit pour lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵן יַקִּיר לִי
  choice: Éphraïm est-il pour moi un fils précieux
  rationale: La question rhétorique et la valeur affective de יַקִּיר sont conservées. « Précieux » exprime à la fois la valeur et l’attachement.
- source_word: אִם יֶלֶד שַׁעֲשֻׁעִים
  choice: un enfant qui fait mes délices
  rationale: Cette formulation française naturelle conserve l’idée d’un enfant qui procure joie et délice, sans réduire l’expression à une simple qualité de caractère.
- source_word: כִּי מִדֵּי דַבְּרִי בוֹ
  choice: Car chaque fois que je parle de lui
  rationale: La préposition בּוֹ est rendue sobrement par « de lui ». Le contexte peut suggérer des paroles prononcées contre lui, possibilité signalée en note sans l’imposer au texte.
- source_word: זָכֹר אֶזְכְּרֶנּוּ עוֹד
  choice: je ne cesse de me souvenir de lui
  rationale: La tournure restitue en français courant l’intensification produite par l’infinitif absolu et la persistance exprimée par עוֹד.
- source_word: הָמוּ מֵעַי לוֹ
  choice: mes entrailles frémissent pour lui
  rationale: La métaphore corporelle hébraïque est préservée dans une expression française digne et intelligible, qui évoque une émotion profonde.
- source_word: רַחֵם אֲרַחֲמֶנּוּ
  choice: oui, j’aurai compassion de lui
  rationale: « Oui » marque l’intensification de l’infinitif absolu, tandis que « avoir compassion » correspond au champ affectif de רחם.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: La formule prophétique garde sa solennité, et le nom divin est rendu par « Yahvé » conformément à la couche de consultation fournie.
theological_decisions:
- issue: Référent et tonalité d’Éphraïm
  choice: Éphraïm représente le peuple du royaume du Nord, personnifié comme un fils aimé.
  alternative: Éphraïm désignerait uniquement l’ancêtre tribal individuel.
  rationale: Le contexte de Jérémie 31 favorise le sens collectif personnifié. La traduction maintient ensemble la parole divine concernant Éphraïm et la compassion persistante de Dieu.
- issue: Sens de דַבְּרִי בוֹ
  choice: « je parle de lui »
  alternative: « je parle contre lui »
  rationale: L’hébreu permet une relation plus neutre, « de/au sujet de lui ». Le contexte de jugement peut toutefois soutenir « contre lui » ; cette tension est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique, la question rhétorique, les intensifications hébraïques et la métaphore corporelle sont conservées sans tournure archaïque.
