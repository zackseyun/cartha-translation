source:
  edition: WLC
  text: וְ/רִוֵּיתִ֛י נֶ֥פֶשׁ הַ/כֹּהֲנִ֖ים דָּ֑שֶׁן וְ/עַמִּ֛/י אֶת טוּבִ֥/י יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/014.yaml
  text: I will satisfy the priests with abundance[a], and my people will be filled with my goodness[c][b], declares Yahweh.
translation:
  language: fr
  text: Je rassasierai les prêtres de nourriture riche[a], et mon peuple se rassasiera de mes bienfaits[b], — déclaration de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je rassasierai l’appétit des prêtres de graisse », c’est-à-dire de nourriture riche et abondante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon peuple se rassasiera de ma bonté » ou « de mes bonnes choses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִוֵּיתִי
  choice: Je comblerai
  rationale: Le piel de רוה exprime l’action de donner à boire à satiété et, par extension, de satisfaire pleinement. « Combler » rend naturellement cette plénitude dans le contexte d’une provision abondante.
- source_word: נֶפֶשׁ הַכֹּהֲנִים
  choice: les prêtres
  rationale: נפש désigne ici idiomatiquement l’appétit ou la personne même des prêtres. Le français naturel permet de prendre directement « les prêtres » comme complément, tandis que la note conserve l’image hébraïque.
- source_word: דָּשֶׁן
  choice: de mets généreux
  rationale: דשן évoque littéralement la graisse, puis ce qui est riche, nourrissant et abondant. « Mets généreux » maintient l’image alimentaire suggérée par נפש et le parallélisme avec le rassasiement du peuple.
- source_word: וְעַמִּי
  choice: et mon peuple
  rationale: Rend directement le possessif d’alliance « mon peuple ».
- source_word: אֶת־טוּבִי
  choice: de mes bienfaits
  rationale: טוב peut désigner la bonté, l’abondance ou les bonnes choses accordées. Le pluriel « bienfaits » garde ensemble la bienveillance divine et ses dons concrets.
- source_word: יִשְׂבָּעוּ
  choice: se rassasiera
  rationale: שבע signifie être rassasié, avoir pleinement de quoi satisfaire son besoin. Le singulier s’accorde naturellement en français avec le collectif « mon peuple ».
- source_word: נְאֻם יְהוָה
  choice: — déclaration de Yahvé
  rationale: Formule prophétique solennelle. « Déclaration de » traduit la valeur nominale de נְאֻם, et « Yahvé » représente explicitement le nom divin יהוה.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé plutôt que remplacé par un titre. « Yahvé » est la forme française traditionnelle et immédiatement reconnaissable, tout en signalant que l’hébreu porte le tétragramme.
- issue: Nature des dons promis aux prêtres et au peuple
  choice: « mets généreux » et « bienfaits »
  alternative: « abondance » et « bonté »
  rationale: Le premier membre conserve la métaphore concrète de richesse nourricière, tandis que le second laisse les dons de Dieu plus larges. Cette formulation n’impose pas une lecture exclusivement matérielle ou spirituelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est préservé par « combler » / « se rassasier ». « Mets généreux » évite le littéralisme aujourd’hui déroutant de « graisse », et les notes rendent visibles les principales possibilités lexicales.
