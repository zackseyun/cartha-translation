id: JER.31.31
reference: Jeremiah 31:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/כָרַתִּ֗י אֶת בֵּ֧ית יִשְׂרָאֵ֛ל וְ/אֶת בֵּ֥ית יְהוּדָ֖ה בְּרִ֥ית חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/031.yaml
  text: Look[a], days are coming, declares Yahweh, when I will make a new covenant with the house of Israel and the house of Judah.
translation:
  language: fr
  text: Voici que des jours viennent, déclare Yahweh, où je conclurai avec la maison d’Israël et avec la maison de Juda une alliance nouvelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une alliance renouvelée ». L’adjectif hébreu signifie le plus naturellement « nouvelle », mais certains interprètes soulignent la continuité de l’alliance et le comprennent au sens de « renouvelée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette formule attire l’attention sur l’annonce prophétique tout en restant naturelle et digne en français moderne.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Rend directement l’idiome prophétique et conserve le mouvement de la construction participiale hébraïque.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » restitue la solennité de la formule prophétique נְאֻם, tandis que « Yahweh » représente le nom divin.
- source_word: וְכָרַתִּי
  choice: je conclurai
  rationale: Le français dit naturellement « conclure une alliance »; cette expression rend l’idiome hébreu littéralement formulé « couper une alliance » sans en reproduire l’étrangeté.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve l’image collective et dynastique de « maison » présente dans l’hébreu.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: Préserve le parallélisme avec « la maison d’Israël » et le langage collectif du texte source.
- source_word: בְּרִית חֲדָשָׁה
  choice: une alliance nouvelle
  rationale: חֲדָשָׁה signifie le plus naturellement « nouvelle »; le nom בְּרִית est rendu par le terme biblique et juridique courant « alliance ».
theological_decisions:
- issue: Faut-il rendre חֲדָשָׁה par « nouvelle » ou l’interpréter comme « renouvelée »?
  choice: une alliance nouvelle
  alternative: une alliance renouvelée
  rationale: Le sens lexical le plus direct de l’adjectif est « nouvelle ». « Renouvelée » peut exprimer une lecture insistant sur la continuité de l’alliance, mais elle explicite une interprétation théologique que le mot hébreu n’impose pas à lui seul.
translation_notes:
  register: Français international moderne, clair et solennel. « Voici que » garde la force de l’annonce prophétique; « conclure une alliance » est l’expression française idiomatique, tandis que « maison » préserve l’image collective de l’original.
