id: JER.31.37
reference: Jeremiah 31:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם יִמַּ֤דּוּ שָׁמַ֨יִם֙ מִ/לְ/מַ֔עְלָ/ה וְ/יֵחָקְר֥וּ מֽוֹסְדֵי אֶ֖רֶץ לְ/מָ֑טָּה גַּם אֲנִ֞י אֶמְאַ֨ס בְּ/כָל זֶ֧רַע יִשְׂרָאֵ֛ל עַֽל כָּל אֲשֶׁ֥ר עָשׂ֖וּ נְאֻם יְהוָֽה׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/037.yaml
  text: 'Thus says Yahweh: If the heavens above can be measured[a], and the foundations of the earth below can be searched out, then I also will reject all the offspring of Israel for all that they have done, declares Yahweh.'
translation:
  language: fr
  text: 'Ainsi parle Yahvé : Si l’on peut mesurer les cieux là-haut et scruter les fondations de la terre ici-bas, alors moi aussi, je rejetterai toute la descendance d’Israël à cause de tout ce qu’ils ont fait — déclaration de Yahvé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française traditionnelle et reconnaissable du nom divin, qui préserve sa valeur de nom propre.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique concise, idiomatique en français biblique moderne et d’un registre digne.
- source_word: אִם יִמַּדּוּ
  choice: Si l’on peut mesurer
  rationale: Préserve la forme conditionnelle et rend naturellement le passif hébreu impersonnel ainsi que la possibilité hypothétique.
- source_word: שָׁמַיִם מִלְמַעְלָה
  choice: le ciel là-haut
  rationale: Rend l’expression cosmologique et conserve l’opposition verticale avec « ici-bas ».
- source_word: וְיֵחָקְרוּ
  choice: explorer jusqu’au fond
  rationale: Exprime l’idée d’une investigation exhaustive portée par חקר, sans laisser entendre une simple observation superficielle.
- source_word: מוֹסְדֵי אֶרֶץ לְמָטָּה
  choice: les fondations de la terre ici-bas
  rationale: Conserve l’image cosmologique des fondations terrestres et le parallélisme spatial du verset.
- source_word: גַּם אֲנִי
  choice: alors moi aussi
  rationale: Marque clairement l’apodose et l’insistance du pronom hébreu.
- source_word: אֶמְאַס
  choice: je rejetterai
  rationale: « Rejeter » rend clairement le sens contextuel de מאס sans accentuer indûment la nuance de mépris.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: toute la descendance d’Israël
  rationale: Rend naturellement en français le collectif זֶרַע et son extension à l’ensemble des descendants.
- source_word: עַל כָּל אֲשֶׁר עָשׂוּ
  choice: à cause de tout ce qu’ils ont fait
  rationale: Rend explicitement la valeur causale de עַל dans ce contexte et conserve le lien avec les actes passés d’Israël.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: Préserve la formule solennelle distincte de la formule introductive, sans ajouter un verbe absent de l’hébreu.
theological_decisions:
- issue: Portée de la condition concernant le rejet d’Israël
  choice: Maintenir une condition hypothétique dont le contexte fait entendre le caractère irréalisable
  alternative: 'Reformuler directement : « Jamais je ne rejetterai… »'
  rationale: Le texte hébreu conserve la forme conditionnelle, tandis que Jérémie 31.35-37 présente l’ordre cosmique et l’impossibilité d’en sonder pleinement les profondeurs comme garantie. La traduction laisse cette rhétorique agir sans en remplacer la formulation.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme « là-haut / ici-bas » est conservé. Aucun marqueur de note n’est nécessaire, puisque le texte français ne comporte pas de note.
