  to: 'Ainsi parle Yahvé : Si l’on peut mesurer les cieux là-haut et scruter les fondations de la terre ici-bas, alors moi aussi, je rejetterai toute la descendance d’Israël à cause de tout ce qu’ils ont fait — déclaration de Yahvé.'
  rationale: 'Révision limitée à « les cieux » et « scruter » afin de mieux refléter le pluriel hébreu et la portée investigatrice de חקר, tout en conservant la condition rhétorique, le parallélisme vertical et le registre solennel. Aucune note n’est nécessaire : le français conserve l’ambiguïté et la force de la condition sans ajout interprétatif.'
