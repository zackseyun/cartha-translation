    rationale: Le français peut employer le singulier collectif, mais « les cieux » préserve plus directement la forme et l’imagerie cosmologique de l’hébreu.
  - severity: medium
    issue: « explorer jusqu’au fond les fondations » est une explicitation et une collocation peu naturelle.
    rationale: וְיֵחָקְרוּ signifie être recherché ou scruté de manière approfondie; « jusqu’au fond » ajoute une précision spatiale qui n’est pas exprimée, tandis que « scruter » transmet l’idée sans surcharge.
