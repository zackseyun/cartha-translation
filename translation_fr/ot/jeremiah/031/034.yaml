  text: וְ/לֹ֧א יְלַמְּד֣וּ ע֗וֹד אִ֣ישׁ אֶת רֵעֵ֜/הוּ וְ/אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר דְּע֖וּ אֶת יְהוָ֑ה כִּֽי כוּלָּ/ם֩ יֵדְע֨וּ אוֹתִ֜/י לְ/מִ/קְטַנָּ֤/ם וְ/עַד גְּדוֹלָ/ם֙ נְאֻם יְהוָ֔ה כִּ֤י אֶסְלַח֙ לַֽ/עֲוֺנָ֔/ם וּ/לְ/חַטָּאתָ֖/ם לֹ֥א אֶזְכָּר עֽוֹד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/034.yaml
  text: And they will no longer teach[a], each man his neighbor and each man his brother, saying, ‘Know Yahweh,’ for they will all know me, from the least of them to the greatest of them, declares Yahweh. For I will forgive their iniquity[c][b], and I will remember their sin no more.
translation:
  language: fr
  text: 'Personne n’enseignera plus son prochain ni son frère[a] en disant : « Connaissez Yahvé ! » Car tous me connaîtront, du plus petit au plus grand — déclaration de Yahvé. En effet, je pardonnerai leur faute[b] et je ne me souviendrai plus de leur péché.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme son prochain et un homme son frère » ; le masculin singulier est employé de manière distributive pour les membres de la communauté.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur culpabilité ». Le mot hébreu peut désigner la faute elle-même, la culpabilité qu’elle entraîne ou ses conséquences.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יְלַמְּדוּ עוֹד
  choice: Personne n’enseignera plus
  rationale: 'La négation avec עוֹד exprime la cessation : « ne… plus ». La tournure française distributive « personne ne… » restitue naturellement le sujet pluriel hébreu suivi de אִישׁ.'
- source_word: אִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת אָחִיו
  choice: son prochain ni son frère
  rationale: רֵעַ désigne ici le prochain ou le compagnon au sein de la communauté, tandis que אָח conserve l’image familiale et communautaire de « frère ». Une note signale la formulation masculine distributive de l’hébreu.
- source_word: דְּעוּ אֶת־יְהוָה
  choice: Connaissez Yahvé !
  rationale: L’impératif pluriel de ידע est rendu directement par « connaissez », sans réduire sa portée relationnelle à une simple connaissance intellectuelle. « Yahvé » est la forme française courante du nom divin YHWH.
- source_word: כִּי כוּלָּם יֵדְעוּ אוֹתִי
  choice: Car tous me connaîtront
  rationale: ידע avec un objet personnel peut exprimer une connaissance relationnelle. « Me connaîtront » en préserve la richesse sans l’expliciter doctrinalement.
- source_word: לְמִקְטַנָּם וְעַד גְּדוֹלָם
  choice: du plus petit au plus grand
  rationale: Cette expression mérismatique englobe toute la communauté, indépendamment du rang, de l’importance ou de l’âge. La formulation française est concise et idiomatique.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: נְאֻם introduit solennellement une parole prophétique. « Déclaration de Yahvé » garde sa forme nominale et sa force, sans ajouter un verbe de parole absent de la formule.
- source_word: אֶסְלַח לַעֲוֺנָם
  choice: je pardonnerai leur faute
  rationale: סלח est le verbe usuel du pardon divin. עָוֹן peut désigner la faute, la culpabilité ou les conséquences de la faute ; « faute » convient ici et reste distinct du « péché » de la proposition suivante.
- source_word: וּלְחַטָּאתָם לֹא אֶזְכָּר עוֹד
  choice: je ne me souviendrai plus de leur péché
  rationale: La construction avec זכר et ל est naturellement rendue par « se souvenir de ». « Ne… plus » traduit de nouveau la négation associée à עוֹד.
theological_decisions:
- issue: Nature de la connaissance de Dieu dans la nouvelle alliance
  choice: Conserver le verbe simple « connaître »
  alternative: « reconnaître », « avoir une relation salvatrice avec »
  rationale: Dans ce contexte, ידע possède une profondeur relationnelle et communautaire, mais le texte ne définit pas cette connaissance par une formule doctrinale plus étroite. « Connaître » préserve cette tension.
- issue: Formulation masculine distributive
  choice: Employer en français la tournure naturelle « personne… son prochain… son frère », avec une note sur la forme hébraïque
  alternative: « chaque homme… son prochain… son frère »
  rationale: L’hébreu emploie deux fois אִישׁ de manière distributive. Une reproduction mécanique par « chaque homme » serait lourde et peu naturelle après la négation ; la traduction conserve néanmoins « frère » et documente la forme source.
- issue: Transcription du nom divin יהוה
  choice: Yahvé
  alternative: « le Seigneur », « Yahweh », « Jéhovah »
  rationale: « Yahvé » est la transcription française courante de YHWH et préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de « du plus petit au plus grand »
  choice: Laisser ouverte la référence au rang, à l’âge ou à l’importance
  alternative: Expliciter « du moins important au plus important »
  rationale: Le mérisme hébreu vise l’ensemble de la communauté sans préciser un seul axe de comparaison ; la traduction ne doit pas trancher cette ambiguïté.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe évite le calque pesant tout en conservant la structure argumentative, les deux termes distincts pour la faute et le péché, le mérisme et la solennité de la formule prophétique.
