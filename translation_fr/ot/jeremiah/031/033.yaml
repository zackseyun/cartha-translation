  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/033.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], declares Yahweh: I will put my law within them, and I will write it on their hearts. And I will be their God[c][b], and they shall be my people.'
translation:
  language: fr
  text: 'Car voici l’alliance que je conclurai[a] avec la maison d’Israël après ces jours-là — déclare Yahweh : je mettrai[c] ma loi[b] au-dedans d’eux et je l’écrirai sur leur cœur. Je serai leur Dieu, et eux seront mon peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « je couperai une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon instruction ». Le mot hébreu torah peut désigner la loi ou l’instruction.'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu a formellement la valeur « j’ai mis », mais il est compris ici avec une portée future, conformément aux promesses qui l’entourent.
    reason: textual_or_grammatical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la promesse précédente et conserve naturellement la valeur explicative ou causale de la conjonction.
- source_word: הַבְּרִית אֲשֶׁר אֶכְרֹת
  choice: l’alliance que je conclurai
  rationale: « Alliance » est le terme français consacré pour בְּרִית dans la relation entre Dieu et Israël. « Conclure une alliance » rend naturellement l’expression idiomatique hébraïque, littéralement « couper une alliance ».
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve l’expression collective et covenantale de l’hébreu sans la réduire simplement à « Israël ».
- source_word: אַחֲרֵי הַיָּמִים הָהֵם
  choice: après ces jours-là
  rationale: Rend étroitement la tournure temporelle et maintient son orientation prophétique sans préciser ce que le texte ne précise pas.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formule prophétique claire et solennelle qui conserve le nom divin personnel.
- source_word: נָתַתִּי אֶת תּוֹרָתִי בְּקִרְבָּם
  choice: je mettrai ma loi au-dedans d’eux
  rationale: Le futur s’accorde au cadre de la promesse et aux autres verbes du verset. « Au-dedans d’eux » exprime l’intériorité de בְּקִרְבָּם, renforcée par le parallèle avec le cœur.
- source_word: תּוֹרָתִי
  choice: ma loi
  rationale: Dans ce contexte d’alliance, « loi » maintient la portée normative et les échos bibliques du terme, tandis que la possibilité « instruction » est signalée en note.
- source_word: וְעַל לִבָּם אֶכְתֲּבֶנָּה
  choice: et je l’écrirai sur leur cœur
  rationale: Conserve la métaphore de l’écriture et le singulier collectif « leur cœur » du texte hébreu; le pronom renvoie clairement à la loi.
- source_word: וְהָיִתִי לָהֶם לֵאלֹהִים וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: Je serai leur Dieu, et eux seront mon peuple
  rationale: Rend directement la formule réciproque de l’alliance; « eux » fait entendre l’accent porté par le pronom hébreu explicite.
theological_decisions:
- issue: Valeur temporelle du parfait נָתַתִּי dans une promesse d’alliance future
  choice: « je mettrai »
  alternative: « j’ai mis »
  rationale: 'Bien que la forme soit morphologiquement un parfait, le verset est encadré par des formes futures : « je conclurai », « j’écrirai », « je serai » et « ils seront ». La valeur future respecte donc la cohérence du discours prophétique sans supprimer la particularité formelle, indiquée en note.'
- issue: Sens de תּוֹרָה dans le contexte de la nouvelle alliance
  choice: « ma loi » dans le texte principal
  alternative: « mon instruction »
  rationale: Le contexte met en avant la norme de l’alliance et justifie « loi », mais le champ sémantique plus large de תּוֹרָה demeure authentique et est préservé en note.
- issue: Singulier collectif de לִבָּם
  choice: « leur cœur »
  alternative: « leurs cœurs »
  rationale: Le singulier français reproduit le singulier collectif hébreu et présente la maison d’Israël comme une communauté, sans nier l’intériorité personnelle de la promesse.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la cadence de la formule d’alliance. « Au-dedans d’eux » est légèrement soutenu, mais reste compréhensible et exprime plus précisément l’intériorité que le simple « en eux ». Les marqueurs de notes suivent immédiatement les expressions concernées.
