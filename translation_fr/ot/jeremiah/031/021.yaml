  variant: modern international French
source:
  edition: WLC
  text: הַצִּ֧יבִי לָ֣/ךְ צִיֻּנִ֗ים שִׂ֤מִי לָ/ךְ֙ תַּמְרוּרִ֔ים שִׁ֣תִי לִבֵּ֔/ךְ לַֽ/מְסִלָּ֖ה דֶּ֣רֶךְ הלכתי שׁ֚וּבִי בְּתוּלַ֣ת יִשְׂרָאֵ֔ל שֻׁ֖בִי אֶל עָרַ֥יִ/ךְ אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/021.yaml
  text: Set up road markers for yourself[a]; place guideposts for yourself. Set your heart toward the highway, the way you went. Return, virgin Israel[c][b]; return to these your cities.
translation:
  language: fr
  text: Dresse pour toi des repères[a] ; place pour toi des jalons[b]. Tourne ton cœur vers la grand-route, le chemin que tu as emprunté. Reviens, vierge d’Israël[c] ; reviens dans ces villes qui sont les tiennes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des panneaux » ; le terme hébreu désigne des marques permettant de reconnaître la route.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est rare ; dans ce contexte, il désigne probablement des marques ou des jalons placés le long de l’itinéraire.
    reason: lexical_alternative
  - marker: c
    text: « Reviens » peut évoquer à la fois le retour de l’exil et le retour à la fidélité envers Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיבִי
  choice: Dresse
  rationale: L’impératif hiphil féminin singulier appelle à installer des marques visibles. « Dresse » garde la force concrète de l’ordre dans un français naturel et soutenu.
- source_word: צִיֻּנִים
  choice: des repères
  rationale: Le nom désigne des marques servant à reconnaître un itinéraire. « Repères » convient au contexte routier sans imposer l’idée moderne de panneaux officiels.
- source_word: שִׂמִי
  choice: place
  rationale: L’impératif qal féminin singulier signifie « mettre, placer ». Ce choix rend simplement l’action demandée et maintient le parallélisme avec « dresse ».
- source_word: תַּמְרוּרִים
  choice: des poteaux indicateurs
  rationale: Ce terme rare paraît, dans ce contexte et en parallèle avec צִיֻּנִים, désigner des marques qui jalonnent ou indiquent la route. La formulation française explicite cette fonction sans retenir le sens de « choses amères », peu adapté ici.
- source_word: שִׁתִי לִבֵּךְ
  choice: Tourne ton cœur vers
  rationale: L’expression signifie littéralement « place ton cœur ». « Tourne ton cœur vers » préserve l’image du cœur comme siège de l’attention, de la volonté et de l’orientation intérieure, tout en restant idiomatique.
- source_word: לַמְסִלָּה
  choice: vers la grand-route
  rationale: מְסִלָּה désigne couramment une route aménagée ou surélevée. « Grand-route » conserve l’idée d’un axe principal sans évoquer nécessairement une autoroute moderne.
- source_word: דֶּרֶךְ הלכתי
  choice: le chemin que tu as emprunté
  rationale: דֶּרֶךְ précise ici la grand-route, et la forme verbale s’adresse à Israël personnifiée au féminin. « Emprunté » exprime naturellement un trajet déjà parcouru.
- source_word: שׁוּבִי
  choice: Reviens
  rationale: L’impératif féminin de שוב peut évoquer à la fois le retour géographique et le retournement dans la fidélité à l’alliance. « Reviens » laisse ces deux dimensions ouvertes.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: vierge d’Israël
  rationale: La formule prophétique personnifie la nation au féminin. La traduction directe garde l’image et n’en fait pas un titre doctrinal.
- source_word: אֶל עָרַיִךְ אֵלֶּה
  choice: vers tes villes que voici
  rationale: La préposition marque la direction du retour, tandis que le démonstratif souligne les villes désignées comme appartenant à Israël. « Que voici » restitue cette insistance dans un français littéraire mais compréhensible.
theological_decisions:
- issue: Portée du retour commandé par שׁוּבִי
  choice: Traduire par « Reviens » sans limiter le commandement au seul retour d’exil ni à la seule conversion spirituelle.
  alternative: « Repens-toi » ou « Reviens de l’exil »
  rationale: Les routes, les repères et les villes indiquent nettement un retour géographique, mais le langage de Jérémie sur le rétablissement garde aussi une portée relationnelle et liée à l’alliance. « Reviens » préserve cette tension.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Les impératifs féminins singuliers sont conservés parce qu’ils s’adressent à Israël personnifiée. « Grand-route » évite l’anachronisme possible de « route nationale » ou « autoroute », tandis que « que voici » maintient l’emphase du démonstratif final.
