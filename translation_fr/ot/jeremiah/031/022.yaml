  text: עַד מָתַי֙ תִּתְחַמָּקִ֔י/ן הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה כִּֽי בָרָ֨א יְהוָ֤ה חֲדָשָׁה֙ בָּ/אָ֔רֶץ נְקֵבָ֖ה תְּס֥וֹבֵֽב גָּֽבֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/022.yaml
  text: 'How long will you waver[c][b][a], faithless daughter? For Yahweh has created a new thing in the land: a woman will surround a man.'
translation:
  language: fr
  text: 'Jusqu’à quand te déroberas-tu[a], fille rebelle[b] ? Car Yahweh a créé quelque chose de nouveau dans le pays[c] : une femme entourera un homme[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te détourneras-tu » ou « chercheras-tu à t’échapper ». Le verbe hébreu évoque un mouvement d’évitement ou de retrait.
    reason: lexical_alternative
  - marker: b
    text: Ou « fille infidèle » ou « fille qui s’est détournée ». L’expression décrit une rébellion et une infidélité dans le cadre de l’alliance.
    reason: lexical_alternative
  - marker: c
    text: Ou « sur la terre ». Dans ce contexte, « le pays » désigne probablement le pays d’Israël.
    reason: lexical_alternative
  - marker: d
    text: 'La dernière proposition est difficile et très discutée. Elle est rendue ici selon son sens lexical concret. Parmi les interprétations proposées : « une femme fera la cour à un homme », « la faible dominera le fort », ou une image d’Israël restauré revenant à Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְחַמָּקִין
  choice: te déroberas-tu
  rationale: Le verbe חמק évoque le fait de se détourner, de s’esquiver ou d’échapper. « Te déroberas-tu » exprime naturellement en français ce mouvement d’évitement sans le réduire à une hésitation intérieure.
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: fille rebelle
  rationale: Dans Jérémie, שׁוֹבֵבָה désigne celle qui se détourne et se montre infidèle à l’alliance. « Rebelle » conserve le reproche adressé à la figure féminine d’Israël sans imposer une paraphrase confessionnelle.
- source_word: כִּי
  choice: Car
  rationale: כִּי introduit ici le motif ou l’explication de la question précédente.
- source_word: בָרָא
  choice: a créé
  rationale: Le qatal est rendu comme un acte accompli ayant une portée présente, tout en laissant au contexte prophétique sa tension temporelle.
- source_word: חֲדָשָׁה
  choice: quelque chose de nouveau
  rationale: L’adjectif féminin est employé substantivement. Cette formulation française est naturelle et maintient le caractère indéterminé de la nouveauté annoncée.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner la terre ou un pays. Dans ce contexte de restauration nationale, « le pays » renvoie vraisemblablement au pays d’Israël.
- source_word: נְקֵבָה
  choice: une femme
  rationale: Le terme signifie littéralement « femelle », mais il concerne ici une relation humaine ; « femme » est donc le rendu français naturel et exact quant au genre.
- source_word: תְּסוֹבֵב
  choice: entourera
  rationale: Le sens concret fondamental de סבב est tourner autour, encercler ou entourer. Ce choix évite d’intégrer au texte une interprétation particulière d’une proposition très discutée.
- source_word: גָּבֶר
  choice: un homme
  rationale: גֶּבֶר désigne un homme, avec parfois une nuance de force. Le rendu simple « un homme » reste transparent sans surinterpréter cette nuance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Interprétation de la proposition énigmatique נְקֵבָה תְּסוֹבֵב גָּבֶר
  choice: 'Conserver dans le texte l’image concrète : « une femme entourera un homme ».'
  alternative: « une femme fera la cour à un homme » ; « la faible dominera le fort » ; Israël, figuré par la femme, reviendra à Yahweh ; « une femme protégera un homme ».
  rationale: Les mots pris séparément sont relativement clairs, mais le sens de l’ensemble demeure très débattu. Le rendu concret préserve cette ambiguïté et évite de faire d’une interprétation théologique particulière le texte même.
- issue: Valeur temporelle de בָרָא dans le discours prophétique
  choice: « a créé »
  alternative: « créera » ou « crée »
  rationale: La forme hébraïque est un qatal. Le passé composé la reflète directement, sans nier qu’elle puisse exprimer, en contexte prophétique, la certitude d’un acte encore à venir du point de vue historique.
translation_notes:
  register: Français international moderne, digne et accessible. La question conserve une adresse féminine singulière. « Se dérober » rend l’évitement de façon idiomatique ; la proposition finale reste volontairement concrète et énigmatique.
