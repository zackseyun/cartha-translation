revisions:
- from: Ils viendront en pleurant, et je les conduirai tandis qu’ils supplieront[a] ; je les mènerai vers des cours d’eau, par un chemin droit où ils ne trébucheront pas. Car je suis un père pour Israël, et Éphraïm est mon premier-né.
  to: Ils viendront en pleurant, et je les conduirai au milieu de leurs supplications ; je les mènerai vers des cours d’eau, par un chemin droit où ils ne trébucheront pas. Car je suis un père pour Israël, et Éphraïm est mon premier-né.
  rationale: La correction restitue la fonction du groupe prépositionnel hébreu, sans prétendre déterminer la cause des pleurs ni imposer une lecture doctrinale des supplications. Le reste de la traduction est conservé, car il reflète fidèlement le texte massorétique dans un français moderne et naturel.
