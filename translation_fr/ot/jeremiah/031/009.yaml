  text: בִּ/בְכִ֣י יָבֹ֗אוּ וּֽ/בְ/תַחֲנוּנִים֮ אֽוֹבִילֵ/ם֒ אֽוֹלִיכֵ/ם֙ אֶל נַ֣חֲלֵי מַ֔יִם בְּ/דֶ֣רֶךְ יָשָׁ֔ר לֹ֥א יִכָּשְׁל֖וּ בָּ֑/הּ כִּֽי הָיִ֤יתִי לְ/יִשְׂרָאֵל֙ לְ/אָ֔ב וְ/אֶפְרַ֖יִם בְּכֹ֥רִ/י הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/009.yaml
  text: They will come with weeping, and with pleas for mercy[a] I will lead them; I will guide them to streams of water, on a straight path where they will not stumble. For I am a father to Israel, and Ephraim is my firstborn.
translation:
  language: fr
  text: Ils viendront en pleurant, et je les conduirai au milieu de leurs supplications ; je les mènerai vers des cours d’eau, par un chemin droit où ils ne trébucheront pas. Car je suis un père pour Israël, et Éphraïm est mon premier-né.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּבְכִי
  choice: en pleurant
  rationale: Exprime naturellement en français la manière dont ils viendront, sans préciser si leurs larmes relèvent du repentir, de la douleur ou de la joie.
- source_word: וּבְתַחֲנוּנִים
  choice: tandis qu’ils supplieront
  rationale: תַּחֲנוּנִים désigne des supplications ou des appels à la faveur et à la compassion. Cette formulation rattache la locution à l’action de conduire tout en restant idiomatique.
- source_word: אֹבִילֵם
  choice: je les conduirai
  rationale: Le hifil de יבל exprime l’action de mener ou conduire un groupe.
- source_word: אֹלִיכֵם
  choice: je les mènerai
  rationale: Le hifil de הלך a ici un sens causatif de déplacement. « Mènerai » préserve ce sens et évite une répétition française trop lourde.
- source_word: נַחֲלֵי מַיִם
  choice: des cours d’eau
  rationale: La locution désigne des chenaux ou cours d’eau ; ce choix est naturel en français moderne et conserve l’image vivifiante.
- source_word: בְּדֶרֶךְ יָשָׁר
  choice: par un chemin droit
  rationale: יָשָׁר évoque une voie droite, directe et sans obstacle ; « chemin droit » conserve l’image sans l’expliciter excessivement.
- source_word: לֹא יִכָּשְׁלוּ בָּהּ
  choice: où ils ne trébucheront pas
  rationale: Le pronom féminin renvoie au chemin ; « où » rend ce lien de façon fluide en français.
- source_word: כִּי הָיִיתִי לְיִשְׂרָאֵל לְאָב
  choice: Car je suis un père pour Israël
  rationale: Le qatal statif affirme ici une relation établie. Le présent français évite de suggérer que cette paternité commencerait seulement lors du retour.
- source_word: וְאֶפְרַיִם בְּכֹרִי הוּא
  choice: et Éphraïm est mon premier-né
  rationale: בְּכוֹר désigne le premier-né, notamment quant au statut. La construction française rend naturellement la proposition hébraïque.
theological_decisions:
- issue: Nature des pleurs et des supplications
  choice: Le texte ne précise pas la cause des pleurs et présente les supplications sans leur attribuer une motivation doctrinale particulière.
  alternative: Comprendre les pleurs comme exclusivement pénitentiels ou exclusivement joyeux.
  rationale: L’hébreu indique la manière dont le peuple vient, mais non la cause émotionnelle ou théologique de ses larmes.
- issue: Rapport syntaxique de וּבְתַחֲנוּנִים
  choice: '« tandis qu’ils supplieront » : les supplications accompagnent la conduite divine.'
  alternative: « et avec des supplications je les conduirai », formulation pouvant faire des supplications la manière dont Dieu les conduit.
  rationale: L’hébreu permet une certaine souplesse de rattachement. Le sens lexical de supplication favorise l’idée que le peuple supplie, mais une note conserve la formulation plus littérale et son ambiguïté.
- issue: Valeur de הָיִיתִי dans l’affirmation de la paternité
  choice: « je suis un père pour Israël »
  alternative: « j’ai été un père pour Israël »
  rationale: Le qatal statif exprime une relation établie dans la déclaration prophétique ; une lecture ingressive ajouterait un commencement que le texte n’énonce pas.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux verbes de conduite est conservé par « conduirai » et « mènerai ». La ponctuation distingue la promesse du retour de l’affirmation qui la fonde.
