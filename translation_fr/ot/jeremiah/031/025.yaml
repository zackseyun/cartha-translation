  - severity: low
    issue: « L’être » est une formulation abstraite pour נֶפֶשׁ.
    rationale: Bien que défendable, ce terme est moins naturel en français biblique moderne. La répétition de « âme » reproduit le parallélisme du texte source et reste sémantiquement recevable dans ce contexte.
