  text: כִּ֥י הִרְוֵ֖יתִי נֶ֣פֶשׁ עֲיֵפָ֑ה וְ/כָל נֶ֥פֶשׁ דָּאֲבָ֖ה מִלֵּֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/025.yaml
  text: For I have satisfied the weary soul[b][a], and every faint soul I have filled.
translation:
  language: fr
  text: Car j’ai rassasié l’âme épuisée[a], et j’ai comblé toute âme languissante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai désaltéré l’âme épuisée » ; le verbe hébreu évoque littéralement le fait de donner à boire en abondance.
    reason: lexical_alternative
  - marker: b
    text: Ou « toute âme affligée » ou « toute âme qui dépérit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français la raison ou le fondement de la promesse qui précède.
- source_word: הִרְוֵיתִי
  choice: je désaltère
  rationale: Le hiphil de רוה évoque concrètement le fait de donner à boire abondamment. « Désaltérer » conserve cette image tout en exprimant la restauration.
- source_word: נֶפֶשׁ
  choice: l’être
  rationale: Ici, נֶפֶשׁ désigne la personne vivante dans son intériorité, non nécessairement une âme conçue comme partie séparable. « L’être » reste poétique et englobe la personne entière.
- source_word: עֲיֵפָה
  choice: épuisé
  rationale: Exprime l’accablement ou l’épuisement physique et intérieur avec une formulation française actuelle.
- source_word: וְכָל
  choice: et… tout
  rationale: Rend la coordination et la portée distributive de כָל, avec un ordre naturel en français.
- source_word: דָּאֲבָה
  choice: qui dépérit
  rationale: דאב peut évoquer le fait de languir, dépérir ou souffrir. « Qui dépérit » préserve l’indétermination entre faiblesse et affliction.
- source_word: מִלֵּאתִי
  choice: je comble
  rationale: Le piel de מלא signifie remplir ou rendre plein. « Combler » restitue idiomatiquement l’abondance et forme un parallèle naturel avec « désaltère ».
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ
  choice: « l’être » dans les deux membres poétiques
  alternative: « l’âme » ou « la personne »
  rationale: « L’être » préserve la dimension intérieure et globale de נֶפֶשׁ sans imposer une anthropologie dualiste; la répétition maintient le parallélisme.
- issue: Valeur des verbes au parfait
  choice: 'présent français à valeur déclarative : « je désaltère… je comble »'
  alternative: passé composé (« j’ai désaltéré… j’ai comblé ») ou futur assuré
  rationale: Dans ce discours prophétique, les parfaits peuvent présenter comme certaine l’action restauratrice de Dieu. Le présent français exprime naturellement cette déclaration sans trancher excessivement entre accomplissement et promesse assurée.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé, avec des verbes concrets et naturels. Les notes signalent l’image littérale de l’abreuvement et l’amplitude sémantique de דָּאֲבָה.
