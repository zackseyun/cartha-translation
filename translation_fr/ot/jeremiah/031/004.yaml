  source_fidelity: Le texte rend fidèlement la double occurrence de עוֹד (« De nouveau »), le jeu de racine entre אֶבְנֵךְ et וְנִבְנֵית (« je te bâtirai ... tu seras bâtie »), et l’adresse féminine métaphorique בְּתוּלַת יִשְׂרָאֵל. Le futur, l’image des tambourins, la sortie festive et la danse sont tous conservés. « Ceux qui se réjouissent » rend sobrement le participe מְשַׂחֲקִים dans son sens festif.
