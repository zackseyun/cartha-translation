  variant: modern international French
source:
  edition: WLC
  text: ע֤וֹד אֶבְנֵ/ךְ֙ וְֽ/נִבְנֵ֔ית בְּתוּלַ֖ת יִשְׂרָאֵ֑ל ע֚וֹד תַּעְדִּ֣י תֻפַּ֔יִ/ךְ וְ/יָצָ֖את בִּ/מְח֥וֹל מְשַׂחֲקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/004.yaml
  text: Again I will build you[a], and you will be built, O virgin Israel[c][b]; again you will adorn yourself with your tambourines and go out in the dance of those who celebrate.
translation:
  language: fr
  text: De nouveau, je te bâtirai[a], et tu seras bâtie, ô vierge d’Israël[b] ; de nouveau, tu te pareras de tes tambourins et tu sortiras dans la danse de ceux qui se réjouissent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « je te rebâtirai ». L’hébreu emploie deux fois la même racine : « je te bâtirai, et tu seras bâtie ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « jeune fille d’Israël ». Il s’agit d’une manière métaphorique de s’adresser à Israël.
    reason: lexical_alternative
  - marker: c
    text: Ou « tu sortiras en dansant avec ceux qui sont en fête ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: De nouveau
  rationale: L’expression annonce la reprise, après le jugement, d’actions liées au rétablissement d’Israël. Sa répétition dans les deux propositions est conservée.
- source_word: אֶבְנֵךְ … וְנִבְנֵית
  choice: je te bâtirai… et tu seras bâtie
  rationale: La répétition de la racine בנה à l’actif puis au passif est préservée, ainsi que l’image prophétique de la reconstruction. Le féminin correspond à l’adresse métaphorique qui suit.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: ô vierge d’Israël
  rationale: Cette formulation conserve l’adresse métaphorique et la relation construite entre « vierge » et « Israël ». « Ô » signale clairement le vocatif dans un registre prophétique digne.
- source_word: תַּעְדִּי תֻפַּיִךְ
  choice: tu te pareras de tes tambourins
  rationale: Le verbe exprime l’action de se parer, tandis que les tambourins évoquent la célébration publique. La formulation conserve cette image inhabituelle sans l’expliquer dans le texte.
- source_word: וְיָצָאת
  choice: tu sortiras
  rationale: Le verbe décrit une sortie publique et festive ; le futur français convient à la promesse de restauration.
- source_word: בִּמְחוֹל מְשַׂחֲקִים
  choice: dans la danse de ceux qui se réjouissent
  rationale: La traduction garde l’image concrète de la danse et rend le participe משׂחקים par une expression naturelle indiquant une joie festive.
theological_decisions:
- issue: L’adresse métaphorique « vierge d’Israël » dans une promesse de restauration
  choice: Conserver directement « ô vierge d’Israël »
  alternative: « ô jeune fille d’Israël »
  rationale: Le texte personnifie Israël sans préciser entièrement la portée de l’image. La traduction maintient donc la métaphore prophétique et sa tension, au lieu de l’expliciter comme une affirmation doctrinale ou une description littérale.
translation_notes:
  register: Français international actuel, clair et digne, avec une légère élévation poétique adaptée à l’oracle prophétique. La répétition, le passif et les images festives de l’hébreu sont maintenus sans archaïsmes inutiles.
