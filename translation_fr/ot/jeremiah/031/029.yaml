source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם לֹא יֹאמְר֣וּ ע֔וֹד אָב֖וֹת אָ֣כְלוּ בֹ֑סֶר וְ/שִׁנֵּ֥י בָנִ֖ים תִּקְהֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/029.yaml
  text: In those days they will no longer say[a], ‘The fathers have eaten sour grapes, and the sons’ teeth are set on edge.’
translation:
  language: fr
  text: 'En ces jours-là, on ne dira plus : « Les pères ont mangé des raisins verts, et les dents des fils en sont agacées.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les pères ont mangé des raisins acides, et les dents des fils se sont émoussées. »'
    reason: 'Alternative lexicale : בֹסֶר peut souligner l’acidité de raisins non mûrs; תִּקְהֶינָה peut évoquer l’émoussement ou l’engourdissement des dents, tandis que « en sont agacées » rend l’expression française idiomatique.'
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Expression temporelle naturelle et consacrée dans le discours prophétique, correspondant directement à l’hébreu.
- source_word: לֹא יֹאמְרוּ עוֹד
  choice: on ne dira plus
  rationale: Le pronom indéfini « on » rend naturellement en français le pluriel hébreu à sujet indéterminé, tout en conservant l’idée de cessation exprimée par עוֹד.
- source_word: אָבוֹת
  choice: les pères
  rationale: Le terme hébreu désigne précisément les pères. Ce choix conserve les termes masculins du proverbe sans en élargir silencieusement le sens à « parents » ou « ancêtres ».
- source_word: אָכְלוּ
  choice: ont mangé
  rationale: Le passé composé convient au français moderne et présente l’action accomplie dont la conséquence atteint la génération suivante.
- source_word: בֹסֶר
  choice: des raisins verts
  rationale: Le mot désigne des raisins non mûrs, donc acides. « Raisins verts » est une expression française naturelle qui préserve l’image concrète; « raisins acides » demeure possible.
- source_word: וְשִׁנֵּי בָנִים
  choice: et ce sont les dents des fils
  rationale: « Fils » reproduit la désignation masculine de l’hébreu. La tournure clivée rend clairement le contraste intergénérationnel implicite dans le proverbe.
- source_word: תִּקְהֶינָה
  choice: qui en ont été agacées
  rationale: En parlant des dents, « agacées » exprime en français la sensation désagréable produite par l’acidité, plutôt qu’un émoussement matériel. Le pronom « en » explicite naturellement le lien avec les raisins.
theological_decisions:
- issue: Termes de parenté dans le proverbe
  choice: Conserver « les pères » et « les fils »
  alternative: « les parents » et « les enfants »
  rationale: Le texte emploie des noms masculins précis. Les conserver respecte sa forme tout en laissant intacte la portée intergénérationnelle du proverbe.
- issue: Rapport entre la faute des pères et la conséquence subie par les fils
  choice: Préserver le contraste proverbial sans l’expliquer dans le verset
  alternative: Expliciter une doctrine de culpabilité héréditaire ou de responsabilité individuelle
  rationale: Ce verset cite un proverbe et annonce qu’il cessera d’être employé. Il ne convient pas de résoudre ici, par ajout interprétatif, la tension théologique que le contexte développe.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure proverbiale et les termes de parenté masculins de l’hébreu. « Agacer les dents » est idiomatique en français; la note signale une traduction plus formelle de l’image.
