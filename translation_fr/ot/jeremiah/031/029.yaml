  source_fidelity: 'Le sens du proverbe est globalement bien rendu : le futur de cessation, les termes « pères » et « fils », les raisins non mûrs et l’effet sur les dents sont préservés. Toutefois, la tournure clivée « ce sont les dents des fils qui » introduit une mise en relief absente de l’hébreu et alourdit inutilement le parallélisme proverbial.'
