base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/011.yaml
  text: For Yahweh has redeemed Jacob and ransomed him from the hand of one stronger than he[a].
translation:
  language: fr
  text: 'Car Yahweh a délivré Jacob

    et l’a racheté[a] de la main d’un plus fort que lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et l’a délivré ». Le verbe hébreu גאל désigne souvent l’action de racheter ou de délivrer, notamment lorsqu’un proche parent intervient en faveur d’un membre de sa parenté ou pour le tirer de la détresse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la promesse exprimée dans le contexte et assure un enchaînement naturel en français.
- source_word: פָדָה
  choice: a délivré
  rationale: Le verbe désigne la libération d’une servitude ou d’un danger, souvent par rachat. « A délivré » exprime ici clairement le sauvetage tout en permettant de distinguer les deux verbes hébreux parallèles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Reproduit le nom explicitement employé dans le texte, sans remplacer celui-ci par son référent collectif, Israël.
- source_word: וּגְאָלוֹ
  choice: et l’a racheté
  rationale: גאל évoque l’intervention d’un rédempteur, notamment celui qui agit en faveur d’un proche ou reprend quelqu’un à la détresse. « Racheté » conserve cette nuance et le suffixe objet est rendu par « l’ ».
- source_word: מִיַּד
  choice: de la main de
  rationale: Conserve l’image hébraïque de la main comme symbole de pouvoir ou de domination, image encore intelligible en français.
- source_word: חָזָק מִמֶּנּוּ
  choice: d’un plus fort que lui
  rationale: Rend la valeur comparative de מִמֶּנּוּ et le caractère masculin singulier de חָזָק sans préciser indûment l’identité de l’adversaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte le nom divin personnel; sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Distinction entre פדה et גאל dans le parallélisme
  choice: « a délivré » puis « l’a racheté »
  alternative: Traduire les deux verbes par « racheter »
  rationale: Les deux verbes appartiennent au même champ du salut et du rachat, mais ne sont pas identiques. Deux termes français proches préservent à la fois leur parallélisme et leur nuance propre, sans construire deux catégories doctrinales séparées.
translation_notes:
  register: Français international moderne, sobre et digne. La disposition sur deux lignes fait ressortir le parallélisme poétique. « De la main de » conserve l’image source sans nuire à la compréhension.
