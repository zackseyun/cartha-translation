source:
  edition: WLC
  text: ע֚וֹד תִּטְּעִ֣י כְרָמִ֔ים בְּ/הָרֵ֖י שֹֽׁמְר֑וֹן נָטְע֥וּ נֹטְעִ֖ים וְ/חִלֵּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/005.yaml
  text: Again you will plant vineyards on the mountains of Samaria[a]; planters will plant and enjoy them.
translation:
  language: fr
  text: De nouveau, tu planteras des vignes sur les montagnes de Samarie ; les planteurs les planteront et en jouiront[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les rendront accessibles à l’usage ordinaire » ; l’expression désigne la possibilité de consommer les produits de la vigne et d’en profiter.'
    reason: Alternative lexicale et explication de l’idiome agricole
lexical_decisions:
- source_word: עוֹד
  choice: De nouveau
  rationale: Dans ce contexte de rétablissement, le terme annonce la reprise d’une activité interrompue. « De nouveau » est naturel et conserve cette idée.
- source_word: תִּטְּעִי
  choice: tu planteras
  rationale: L’imparfait qal à la deuxième personne du féminin singulier exprime ici une action future et s’adresse à Israël personnifié, désigné au verset précédent au féminin.
- source_word: כְרָמִים
  choice: des vignes
  rationale: En français courant, « planter des vignes » désigne naturellement l’établissement de vignobles et évite la tournure moins idiomatique « planter des vignobles ».
- source_word: בְּהָרֵי שֹׁמְרוֹן
  choice: sur les montagnes de Samarie
  rationale: Cette formulation conserve l’image géographique de הָרִים tout en restant claire en français.
- source_word: נָטְעוּ נֹטְעִים
  choice: ceux qui les planteront
  rationale: La formulation française rend les planteurs et l’action de planter sans reproduire lourdement la répétition étymologique de l’hébreu. Le parfait est compris, dans ce contexte prophétique, comme annonçant avec assurance le rétablissement futur.
- source_word: וְחִלֵּלוּ
  choice: en jouiront
  rationale: Dans le contexte viticole, le piel de חלל évoque le passage à l’usage ordinaire du produit de la vigne, donc la possibilité d’en profiter. Cette traduction évite le contresens que provoquerait ici « profaner ».
theological_decisions:
- issue: Destinataire du verbe au féminin singulier
  choice: Maintien de l’adresse directe « tu », renvoyant à Israël personnifié
  alternative: Répéter explicitement « vierge d’Israël » d’après le verset précédent
  rationale: La forme grammaticale féminine renvoie au contexte immédiat, mais le présent verset ne répète pas le nom de la destinataire. La traduction préserve donc l’adresse sans explicitation ajoutée.
- issue: Sens agricole de וְחִלֵּלוּ
  choice: « en jouiront », au sens d’en faire librement usage
  alternative: « les rendront profanes » ou « les rendront communs »
  rationale: Le passage annonce le retour à une vie agricole normale. Le verbe ne décrit pas ici une profanation cultuelle, mais l’accès ordinaire aux produits de la vigne après la période où ils ne pouvaient pas être consommés.
translation_notes:
  register: Français international moderne, direct et digne. « Des vignes » est préféré à « des vignobles » après « planter » pour une expression agricole naturelle. Le point-virgule conserve les deux mouvements parallèles du verset.
