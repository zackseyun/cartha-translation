review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : la reprise future de la plantation en Samarie et l’usage libre de la récolte sont bien rendus. Toutefois, « ceux qui les planteront » condense la construction expressive נָטְעוּ נֹטְעִים (« les planteurs planteront ») et en efface la répétition emphatique. Une restitution française concise peut la conserver.'
  naturalness: Le français est moderne et naturel. « Des vignes » convient après « planter », et « en jouiront » rend de façon fluide l’accès à la production. « Les planteurs les planteront » est légèrement marqué par la répétition, mais celle-ci reflète volontairement celle de l’hébreu et reste intelligible.
  terminology: '« Samarie », « vignes » et « jouir de » sont appropriés. La note doit éviter de donner « rendront communs » comme une description directe des vignes elles-mêmes : l’idiome vise leur mise à disposition pour l’usage ordinaire, c’est-à-dire la consommation ou la jouissance de leur production.'
  issues:
  - severity: low
    issue: La répétition נָטְעוּ נֹטְעִים n’est pas représentée.
    rationale: La formulation actuelle ne mentionne qu’une seule fois l’action de planter. Le texte hébreu associe explicitement « planteurs » et « planter », dans une tournure emphatique qu’il est possible de conserver en français.
  - severity: low
    issue: La formulation littérale de la note est imprécise.
    rationale: « Les rendront communs » peut laisser entendre que les vignes elles-mêmes changent de statut. Dans le contexte agricole, le verbe évoque l’usage ordinaire de leur production.
  revised_text: De nouveau, tu planteras des vignes sur les montagnes de Samarie ; les planteurs les planteront et en jouiront[a].
