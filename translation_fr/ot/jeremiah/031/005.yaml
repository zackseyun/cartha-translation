- from: De nouveau, tu planteras des vignes sur les montagnes de Samarie ; ceux qui les planteront en jouiront[a].
  to: De nouveau, tu planteras des vignes sur les montagnes de Samarie ; les planteurs les planteront et en jouiront[a].
  rationale: La révision conserve la structure future et l’adresse directe, tout en représentant la répétition emphatique « les planteurs planteront ». La note précise le sens idiomatique de וְחִלֵּלוּ sans introduire le sens cultuel trompeur de « profaner » ni traiter les vignes elles-mêmes comme l’objet matériel de la mise à l’usage ordinaire.
