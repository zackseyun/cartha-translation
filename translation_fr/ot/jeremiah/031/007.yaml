base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/007.yaml
  text: 'For thus says Yahweh: Sing aloud with gladness for Jacob[a], and shout at the head of the nations; proclaim, praise, and say, “Save, Yahweh, your people, the remnant of Israel.”'
translation:
  language: fr
  text: 'Car ainsi parle Yahweh :


    « Poussez des cris de joie pour Jacob,


    lancez des acclamations à la tête des nations[a] !


    Proclamez, louez et dites :


    “Sauve, Yahweh, ton peuple,


    le reste d’Israël !” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au premier rang des nations » ou « au-dessus des nations ». L’expression hébraïque, littéralement « à/dans la tête des nations », est difficile. Elle peut évoquer la place éminente d’Israël parmi les nations ou le caractère public de cette proclamation.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: רָנּוּ ... שִׂמְחָה
  choice: Poussez des cris de joie
  rationale: Rend naturellement en français l’appel impératif à une expression vocale, forte et joyeuse.
- source_word: לְיַעֲקֹב
  choice: pour Jacob
  rationale: Conserve la valeur relationnelle de ל dans ce contexte de réjouissance au sujet de la restauration de Jacob.
- source_word: וְצַהֲלוּ
  choice: acclamez
  rationale: Exprime un cri public et exultant tout en évitant une répétition lourde de « criez ».
- source_word: בְּרֹאשׁ הַגּוֹיִם
  choice: à la tête des nations
  rationale: Traduction proche de la formulation hébraïque, dont le sens exact reste difficile; l’ambiguïté est signalée en note.
- source_word: הַשְׁמִיעוּ
  choice: Faites entendre votre voix
  rationale: Reproduit la valeur causative de שמע et convient à une proclamation publique; l’objet non exprimé en hébreu n’est pas précisé artificiellement.
- source_word: הַלְלוּ
  choice: louez
  rationale: Équivalent direct de l’impératif de הלל, sans ajouter explicitement un complément absent du texte.
- source_word: הוֹשַׁע
  choice: Sauve
  rationale: Rend directement l’impératif causatif de ישׁע adressé à Yahweh.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: Préserve la désignation relationnelle et covenantale du texte.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: le reste d’Israël
  rationale: « Le reste » est naturel en français biblique moderne et conserve le thème prophétique du groupe préservé ou survivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve le caractère de nom personnel sans lui substituer un titre.
- issue: Interprétation de בְּרֹאשׁ הַגּוֹיִם
  choice: à la tête des nations
  alternative: parmi les principales nations; au-dessus des nations; au premier rang des nations
  rationale: La tournure hébraïque, littéralement « à/dans la tête des nations », peut évoquer la prééminence d’Israël ou le cadre public de l’acclamation. Le texte principal reste proche de l’hébreu et la note maintient l’incertitude.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La disposition poétique fait ressortir les impératifs successifs et la prière finale. Le tutoiement correspond au singulier hébreu dans l’adresse directe à Yahweh.
