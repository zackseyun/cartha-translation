  verdict: revise
  source_fidelity: 'Le sens général, les impératifs successifs, le nom divin Yahweh et « le reste d’Israël » sont fidèlement rendus. La formule difficile בְּרֹאשׁ הַגּוֹיִם est conservée de manière proche dans le texte et son incertitude est signalée. Toutefois, « acclamez à la tête des nations » est syntaxiquement et sémantiquement peu naturel : en français moderne, « acclamer » appelle normalement un complément désignant la personne ou la chose acclamée, alors que l’hébreu commande ici un cri jubilatoire.'
  naturalness: « Lancez des acclamations » restitue naturellement le cri public et exultant sans introduire un objet absent du texte. « Proclamez » est plus idiomatique et plus concis que « Faites entendre votre voix » pour l’impératif causatif elliptique הַשְׁמִיעוּ.
  terminology: Yahweh, Jacob et Israël sont cohérents. « Le reste d’Israël » est un rendu naturel du terme prophétique שְׁאֵרִית et maintient sa portée lexicale. Le tutoiement dans la prière adressée à Yahweh correspond au singulier hébreu.
  issues:
  - severity: medium
    issue: « Acclamez à la tête des nations »
    rationale: La construction française est maladroite, car « acclamer » est usuellement transitif. Elle risque de faire entendre que les nations elles-mêmes sont acclamées, ce qui n’est pas dans le texte source.
  - severity: low
    issue: « Faites entendre votre voix »
    rationale: Cette expression ajoute « votre voix », absent de l’hébreu, et elle est moins directe que le verbe de proclamation requis par le contexte.
  - severity: low
    issue: Note alternative « parmi les principales nations »
    rationale: Cette option déplace le sens vers un groupe de nations principales. Il vaut mieux expliciter l’ambiguïté de la formule hébraïque sans la présenter comme une alternative trop déterminée.
