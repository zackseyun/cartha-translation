id: JER.6.19
reference: Jeremiah 6:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְעִ֣י הָ/אָ֔רֶץ הִנֵּ֨ה אָנֹכִ֜י מֵבִ֥יא רָעָ֛ה אֶל הָ/עָ֥ם הַ/זֶּ֖ה פְּרִ֣י מַחְשְׁבוֹתָ֑/ם כִּ֤י עַל דְּבָרַ/י֙ לֹ֣א הִקְשִׁ֔יבוּ וְ/תוֹרָתִ֖/י וַ/יִּמְאֲסוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/019.yaml
  text: 'Hear[a], O earth: behold, I am bringing disaster on this people, the fruit of their thoughts, because they have not listened to my words[b], and they have rejected my law.'
translation:
  language: fr
  text: Écoute, ô terre ! Voici que je fais venir sur ce peuple un malheur, fruit de leurs pensées[a], car ils n’ont pas prêté attention à mes paroles et ils ont rejeté ma loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fruit de leurs projets » ou « résultat de leurs desseins ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mon instruction ». Le mot hébreu torah peut désigner la loi ou l’instruction ; ici, « loi » conserve la force normative liée à l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Écoute
  rationale: L’impératif féminin singulier s’adresse à la terre personnifiée. « Écoute » garde la force de la convocation prophétique tout en étant naturel en français moderne.
- source_word: הָאָרֶץ
  choice: ô terre
  rationale: 'Dans cette adresse solennelle, « terre » convient mieux que « pays » : elle présente la terre comme témoin, sans limiter explicitement la portée au territoire de Juda.'
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette formule introduit avec solennité l’annonce divine et rend naturellement la particule de présentation en français.
- source_word: מֵבִיא רָעָה
  choice: je fais venir […] un malheur
  rationale: רָעָה désigne ici une calamité relevant du jugement, et non le mal moral. « Je fais venir » reflète la construction participiale et l’action annoncée par Dieu.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Cette traduction respecte le singulier collectif et conserve la tonalité prophétique de mise en accusation.
- source_word: פְּרִי מַחְשְׁבוֹתָם
  choice: fruit de leurs pensées
  rationale: 'La formulation conserve la métaphore du fruit : le malheur correspond à ce que leur propre manière de penser a produit. « Pensées » reste plus large et moins interprétatif que « projets » ou « machinations ».'
- source_word: עַל דְּבָרַי לֹא הִקְשִׁיבוּ
  choice: ils n’ont pas prêté attention à mes paroles
  rationale: הקשיב על exprime une écoute attentive. Cette traduction évite de réduire le sens à la simple perception auditive sans expliciter excessivement l’idée d’obéissance.
- source_word: וְתוֹרָתִי
  choice: ma loi
  rationale: Dans ce contexte prophétique d’alliance, « loi » exprime la force normative de l’enseignement révélé de Dieu, tandis que « instruction » demeure une possibilité lexicale signalée en note.
- source_word: וַיִּמְאֲסוּ בָהּ
  choice: ils ont rejeté ma loi
  rationale: Le verbe מאס exprime le refus ou la répudiation. « Rejeté » est clair, ferme et idiomatique en français.
theological_decisions:
- issue: Traduction de תּוֹרָה dans un contexte prophétique d’alliance
  choice: ma loi
  alternative: mon instruction
  rationale: « Ma loi » maintient la dimension normative et liée à l’alliance de l’accusation. « Mon instruction » est également possible et rend la portée pédagogique plus visible ; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse « ô terre » et « Voici que » préservent la solennité prophétique sans recourir à une syntaxe archaïque. La métaphore du fruit et l’ambivalence lexicale de torah sont maintenues.
