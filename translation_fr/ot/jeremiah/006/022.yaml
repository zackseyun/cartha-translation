source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֛ה עַ֥ם בָּ֖א מֵ/אֶ֣רֶץ צָפ֑וֹן וְ/ג֣וֹי גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/022.yaml
  text: 'Thus says Yahweh: Behold[a], a people is coming from the land of the north, and a great nation is stirred up from the farthest parts of the earth.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh :


    « Voici, un peuple arrive


    du pays du nord,


    et une grande nation s’ébranle


    des régions les plus reculées de la terre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des extrémités de la terre » ou « des régions reculées du pays ». L’expression hébraïque désigne les confins ou les régions les plus éloignées.
    reason: alternative lexicale
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formule française naturelle conserve la fonction solennelle de la formule prophétique de messager et rend directement le nom divin.
- source_word: הִנֵּה
  choice: Un peuple arrive
  rationale: La tournure présentative « voici » est déjà employée dans la formule introductive française; l’imminence et la vivacité de הִנֵּה sont donc exprimées par le présent dynamique « arrive », sans répétition maladroite de « voici ».
- source_word: עַם בָּא
  choice: Un peuple arrive
  rationale: « Peuple » respecte le sens collectif de עַם, tandis que le présent « arrive » communique l’action imminente décrite avec vivacité.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: du pays du nord
  rationale: Cette traduction conserve le substantif אֶרֶץ et présente le nord comme la région d’où vient l’envahisseur.
- source_word: וְגוֹי גָּדוֹל
  choice: et une grande nation
  rationale: « Nation » distingue גּוֹי du précédent עַם et convient à la dimension géopolitique et militaire du contexte.
- source_word: יֵעוֹר
  choice: se met en mouvement
  rationale: Le niphal de עור évoque ici une nation réveillée ou mobilisée pour agir. Cette expression française naturelle garde l’idée de mise en action sans préciser un agent absent du texte.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: depuis les régions les plus reculées de la terre
  rationale: יַּרְכְּתֵי désigne les extrémités ou les parties lointaines; cette formulation exprime clairement l’éloignement tout en maintenant la possibilité idiomatique de « terre ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu porte le tétragramme. « Yahweh » le traite comme un nom propre et évite de lui substituer silencieusement un titre.
- issue: Valeur de יֵעוֹר
  choice: se met en mouvement
  alternative: est réveillée; est soulevée; sera mise en mouvement
  rationale: Le texte laisse ouverte l’identité de l’agent qui mobilise la nation. La formulation retenue conserve cette indétermination et l’image d’une puissance qui entre en action.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes fait ressortir le parallélisme entre « un peuple » et « une grande nation ». « Voici ce que dit » restitue naturellement la formule prophétique, tandis que « se met en mouvement » évoque une mobilisation militaire sans surinterpréter son agent.
