base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/017.yaml
  text: 'I set watchmen over you: ‘Listen to the sound of the trumpet!’ But they said[b][a], ‘We will not listen.’'
translation:
  language: fr
  text: 'J’ai placé pour vous des guetteurs[a] : « Écoutez le son du cor[b] ! » Mais ils ont dit : « Nous n’écouterons pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « J’ai établi des guetteurs pour vous ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : shofar, cor employé notamment comme signal d’alarme ; traditionnellement traduit par « trompette ».'
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: J’ai établi
  rationale: Le hifil de קום peut signifier faire se tenir, placer ou établir dans une fonction. « J’ai établi » exprime naturellement la désignation des guetteurs tout en conservant l’idée de leur mise en place.
- source_word: עֲלֵיכֶם
  choice: sur vous
  rationale: La préposition עַל situe les guetteurs par rapport au peuple dans une fonction de surveillance. « Sur vous » préserve cette relation sans lui donner à tort un sens hostile.
- source_word: צֹפִים
  choice: des guetteurs
  rationale: Le participe de צפה désigne ceux qui veillent afin de repérer un danger et de donner l’alerte. « Guetteurs » conserve l’image sans préciser abusivement qu’il s’agit de prophètes, de sentinelles militaires ou de dirigeants.
- source_word: הַקְשִׁיבוּ
  choice: Écoutez
  rationale: L’impératif de קשב appelle à une écoute attentive. « Écoutez » est direct, actuel et permet de reprendre le même verbe dans la réponse de refus.
- source_word: לְקוֹל
  choice: le son du
  rationale: קוֹל désigne ici le son produit par l’instrument. Cette formulation est idiomatique en français et évite de préciser davantage la nature du signal.
- source_word: שׁוֹפָר
  choice: cor
  rationale: Le שׁוֹפָר est un cor employé notamment pour sonner l’alarme ou appeler au rassemblement. « Cor » est plus concret que « trompette » en français, tandis que la note explique la réalité culturelle.
- source_word: וַיֹּאמְרוּ
  choice: Mais ils ont dit
  rationale: Le waw fait progresser le discours; « mais » rend clairement le contraste contextuel entre l’ordre d’écouter et le refus du peuple.
- source_word: לֹא נַקְשִׁיב
  choice: Nous n’écouterons pas
  rationale: L’imparfait à la première personne du pluriel avec לֹא exprime ici un refus résolu. Cette traduction conserve la correspondance lexicale avec l’impératif « Écoutez ».
theological_decisions:
- issue: Identité et fonction des guetteurs
  choice: Conserver l’image générale de guetteurs établis par Dieu pour avertir le peuple.
  alternative: Les identifier explicitement à des prophètes, à des sentinelles militaires ou à des dirigeants.
  rationale: Le texte hébreu ne précise pas leur identité exacte. « Guetteurs » maintient la portée prophétique possible de l’image et son ambiguïté légitime.
translation_notes:
  register: Français international moderne, direct et digne. La répétition « Écoutez / nous n’écouterons pas » reproduit l’opposition rhétorique de l’hébreu. « Cor » garde la réalité de l’instrument, explicitée en note.
