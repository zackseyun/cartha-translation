- from: 'J’ai établi sur vous des guetteurs[a] : « Écoutez le son du cor[b] ! » Mais ils ont dit : « Nous n’écouterons pas. »'
  to: 'J’ai placé pour vous des guetteurs[a] : « Écoutez le son du cor[b] ! » Mais ils ont dit : « Nous n’écouterons pas. »'
  rationale: 'La révision remplace la construction peu idiomatique « établi sur vous » par « placé pour vous », qui exprime en français la mise en poste de guetteurs chargés d’avertir le peuple. Elle corrige en conséquence la note a. Le reste du texte est conservé : il respecte le sens, la répétition rhétorique et l’ambiguïté sur l’identité des guetteurs.'
