source:
  edition: WLC
  text: כְּ/הָקִ֥יר בור מֵימֶ֔י/הָ כֵּ֖ן הֵקֵ֣רָה רָעָתָ֑/הּ חָמָ֣ס וָ֠/שֹׁד יִשָּׁ֨מַע בָּ֧/הּ עַל פָּנַ֛/י תָּמִ֖יד חֳלִ֥י וּ/מַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/007.yaml
  text: As a well keeps its waters fresh[a], so she keeps her evil fresh. Violence and destruction are heard in her[c][b]; before me continually are sickness and wounds.
translation:
  language: fr
  text: Comme une citerne garde son eau fraîche[a], ainsi elle entretient sa méchanceté. La violence et la dévastation[b] se font entendre en elle ; devant moi se trouvent constamment maladie et blessure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme un puits garde ses eaux fraîches. » Le verbe hébreu est difficile ; il peut évoquer le fait de refroidir, de maintenir fraîche ou de faire continuellement jaillir l’eau.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la destruction », « les ravages » ou « le pillage ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « devant ma face constamment, maladie et blessure » ; ces mots peuvent décrire des maux concrets ou, par image, l’état de la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהָקִיר ... הֵקֵרָה
  choice: garde ... fraîches / garde ... fraîche
  rationale: La répétition du même verbe conserve le parallélisme hébreu entre le puits et Jérusalem. « Garder frais » rend naturellement en français l’idée difficile de refroidir, préserver ou fournir continuellement, sans trancher entièrement l’image.
- source_word: בור
  choice: puits
  rationale: Le contexte des eaux favorise « puits », image naturelle en français, bien que « citerne » reste possible.
- source_word: מֵימֶיהָ
  choice: ses eaux
  rationale: Le pluriel hébreu est conservé et s’accorde avec l’image poétique du puits.
- source_word: רָעָתָהּ
  choice: sa méchanceté
  rationale: Le contexte de violence et de dévastation indique ici le mal moral. « Méchanceté » exprime cette conduite mauvaise sans la réduire à un acte précis.
- source_word: חָמָס
  choice: violence
  rationale: Équivalent courant et précis dans les dénonciations prophétiques de brutalité et d’oppression.
- source_word: שֹׁד
  choice: dévastation
  rationale: Le terme peut désigner la destruction, les ravages ou le pillage. « Dévastation » conserve cette amplitude et s’associe naturellement à « violence ».
- source_word: יִשָּׁמַע בָּהּ
  choice: se font entendre en elle
  rationale: La tournure passive et durative est conservée, ainsi que la personnification féminine de la ville.
- source_word: עַל־פָּנַי תָּמִיד
  choice: constamment devant moi
  rationale: Cette formulation garde la perspective divine directe et l’idée de continuité, tout en restant idiomatique en français.
- source_word: חֳלִי וּמַכָּה
  choice: maladie et blessure
  rationale: Les termes concrets maintiennent l’image corporelle, sans décider si elle décrit des maux physiques ou, métaphoriquement, l’état de la ville.
theological_decisions:
- issue: Personnification féminine de Jérusalem
  choice: Conserver « elle » et les possessifs féminins
  alternative: Employer le neutre implicite d’un nom de ville ou répéter « la ville »
  rationale: Les suffixes féminins hébreux personnifient la ville. Le français permet de préserver cette rhétorique sans ajout doctrinal.
- issue: Portée de « maladie et blessure »
  choice: Maintenir les images corporelles concrètes
  alternative: Expliciter un état moral ou social, par exemple « corruption et souffrance »
  rationale: L’hébreu laisse ouverte la portée littérale ou métaphorique de ces mots ; la traduction ne résout donc pas cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme volontairement saisissant de l’hébreu est conservé, de même que la personnification féminine de Jérusalem et l’ambiguïté de l’image du puits.
