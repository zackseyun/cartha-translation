id: JER.6.4
reference: Jeremiah 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ מִלְחָמָ֔ה ק֖וּמוּ וְ/נַעֲלֶ֣ה בַֽ/צָּהֳרָ֑יִם א֥וֹי לָ֨/נוּ֙ כִּי פָנָ֣ה הַ/יּ֔וֹם כִּ֥י יִנָּט֖וּ צִלְלֵי עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/004.yaml
  text: Consecrate war against her; rise up[a], and let us go up at noon. Woe to us, for the day is turning away, for the shadows of evening are stretching out.
translation:
  language: fr
  text: Consacrez la guerre contre elle[a] ! Levez-vous ! Montons à midi ! Malheur à nous, car le jour s’en va, car les ombres du soir s’étirent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Préparez-vous à combattre contre elle ». L’hébreu emploie littéralement le langage de la consécration pour la guerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Consacrez
  rationale: Le pi‘el impératif de קדשׁ exprime littéralement la mise à part ou la consécration. Le choix conserve le langage sacral de la préparation au combat, tandis que la note indique le sens militaire idiomatique.
- source_word: עָלֶיהָ
  choice: contre elle
  rationale: Avec מִלְחָמָה, עַל marque ici la direction hostile. Le pronom féminin renvoie à la ville visée dans le contexte.
- source_word: מִלְחָמָה
  choice: la guerre
  rationale: « Guerre » rend la portée générale du terme et maintient l’expression hébraïque inhabituelle « consacrer la guerre ».
- source_word: קוּמוּ
  choice: Levez-vous !
  rationale: L’impératif pluriel appelle à une action immédiate. Cette formulation est claire et énergique en français moderne.
- source_word: וְנַעֲלֶה
  choice: Montons
  rationale: Le cohortatif de עלה évoque une montée ou une avance contre la ville. « Montons » préserve cette image sans expliciter prématurément « attaquons ».
- source_word: בַצָּהֳרָיִם
  choice: à midi
  rationale: Traduction directe et naturelle du moment de la journée indiqué.
- source_word: אוֹי לָנוּ
  choice: Malheur à nous
  rationale: Cette exclamation garde la gravité du cri de détresse ou de frustration.
- source_word: כִּי פָנָה הַיּוֹם
  choice: car le jour s’en va
  rationale: Cette expression française naturelle conserve l’image d’un jour qui se détourne et disparaît, sans la réduire à une simple indication horaire.
- source_word: יִנָּטוּ
  choice: s’étirent
  rationale: Le niphal de נטה décrit ici l’extension des ombres. « S’étirent » est à la fois idiomatique et imagé.
- source_word: צִלְלֵי עָרֶב
  choice: les ombres du soir
  rationale: La formulation reproduit clairement le rapport construit entre les ombres et le soir.
theological_decisions:
- issue: L’expression militaire et sacrale קַדְּשׁוּ ... מִלְחָמָה
  choice: 'Conserver explicitement le langage de consécration : « Consacrez la guerre contre elle »'
  alternative: « Préparez-vous à combattre contre elle »
  rationale: Le texte place dans la bouche des assaillants un idiome de guerre sacralisée. Le maintien de « consacrez » préserve cette texture théologique sans affirmer que Dieu approuve leur attaque.
translation_notes:
  register: Français international moderne, digne et énergique. Les impératifs brefs restituent l’urgence du discours militaire. « Le jour s’en va » et « les ombres du soir s’étirent » conservent les images hébraïques dans une expression française naturelle.
