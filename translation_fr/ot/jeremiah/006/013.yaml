base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/013.yaml
  text: For from their least to their greatest[a], every one of them is greedy for unjust gain; and from prophet to priest[c][b], every one of them practices falsehood.
translation:
  language: fr
  text: Car, du plus petit au plus grand parmi eux, chacun est avide d’un gain malhonnête[a] ; du prophète au prêtre, chacun agit avec fausseté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « est avide de gain » ; l’expression implique probablement un profit malhonnête ou injuste.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « agit de manière trompeuse » ou « se livre à la fraude ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication ou le fondement de l’accusation précédente, tout en assurant un enchaînement naturel en français.
- source_word: מִקְּטַנָּם וְעַד גְּדוֹלָם
  choice: du plus petit au plus grand parmi eux
  rationale: Conserve la totalité exprimée par le mérisme ainsi que le rapport aux personnes concernées, dans une formulation française naturelle.
- source_word: כֻּלּוֹ
  choice: tous
  rationale: Rend la portée collective et distributive du terme sans alourdir la phrase ; dans chacun des deux membres, il inclut tous les individus du groupe.
- source_word: בּוֹצֵעַ בָּצַע
  choice: sont avides d’un gain malhonnête
  rationale: La construction avec verbe et nom apparentés accentue la recherche avide du profit ; le contexte et l’usage de l’expression lui donnent probablement une connotation injuste ou déshonnête.
- source_word: וּמִנָּבִיא וְעַד כֹּהֵן
  choice: du prophète au prêtre
  rationale: Préserve le second mérisme, qui étend l’accusation aux responsables religieux, avec une tournure concise et idiomatique.
- source_word: עֹשֶׂה שָּׁקֶר
  choice: pratiquent la tromperie
  rationale: Exprime une conduite habituelle caractérisée par la fausseté ou la fraude, plutôt qu’un mensonge isolé.
