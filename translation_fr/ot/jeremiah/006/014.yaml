id: JER.6.14
reference: Jeremiah 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְרַפְּא֞וּ אֶת שֶׁ֤בֶר עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/014.yaml
  text: They have healed the wound of my people lightly[a], saying, ‘Peace, peace,’ when there is no peace.
translation:
  language: fr
  text: 'Ils soignent à la légère[a] la blessure de mon peuple en disant : « Paix ! Paix ! » alors qu’il n’y a pas de paix.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils soignent superficiellement la fracture de mon peuple. »'
    reason: Alternative lexicale reflétant plus explicitement les sens possibles de שֶׁבֶר et עַל נְקַלָּה.
lexical_decisions:
- source_word: וַיְרַפְּאוּ
  choice: Ils soignent
  rationale: רפא signifie normalement « guérir ». Ici, « soignent » conserve l’image médicale sans laisser entendre que la guérison a réellement réussi, ce que dément l’accusation prophétique.
- source_word: שֶׁבֶר
  choice: la blessure
  rationale: Le terme peut désigner une fracture, une brèche ou un grave dommage. « Blessure » s’accorde naturellement avec « soignent » et exprime l’état sérieux du peuple.
- source_word: עַמִּי
  choice: de mon peuple
  rationale: Rend directement le possessif et conserve la force relationnelle de la parole divine.
- source_word: עַל נְקַלָּה
  choice: à la légère
  rationale: Cette expression indique que le mal grave est traité comme insignifiant. La tournure française exprime clairement cette minimisation coupable.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rend naturellement l’infinitif hébreu qui introduit les paroles citées.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: « Paix ! Paix ! »
  rationale: 'La répétition est maintenue pour traduire l’insistance de la fausse assurance. « Paix » conserve l’étendue sémantique de שָׁלוֹם : sécurité, bien-être et intégrité.'
- source_word: וְאֵין שָׁלוֹם
  choice: alors qu’il n’y a pas de paix
  rationale: Cette formulation française fait ressortir le contraste entre la proclamation rassurante et la réalité, sans ajouter d’explication.
theological_decisions:
- issue: Accusation prophétique de fausse assurance
  choice: Le soin annoncé est présenté ironiquement comme léger et inadéquat, tandis que la paix proclamée n’existe pas.
  alternative: Traduire littéralement par « Ils guérissent », ce qui pourrait suggérer à tort qu’une restauration réelle a eu lieu.
  rationale: « Ils soignent » préserve la métaphore médicale et l’ironie du texte sans atténuer l’accusation contre ceux qui minimisent la gravité de la situation.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « Paix ! Paix ! » et le contraste final sont conservés afin de maintenir la vigueur rhétorique de l’hébreu.
