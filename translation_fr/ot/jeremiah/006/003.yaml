source:
  edition: WLC
  text: אֵלֶ֛י/הָ יָבֹ֥אוּ רֹעִ֖ים וְ/עֶדְרֵי/הֶ֑ם תָּקְע֨וּ עָלֶ֤י/הָ אֹהָלִים֙ סָבִ֔יב רָע֖וּ אִ֥ישׁ אֶת יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/003.yaml
  text: To her shepherds will come with their flocks[a]; they will pitch tents against her all around; each will pasture his own place.
translation:
  language: fr
  text: Des bergers viendront vers elle avec leurs troupeaux ; ils dresseront leurs tentes contre elle tout autour ; chacun fera paître sa part[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « chacun fera paître sa main ». L’expression signifie probablement que chacun fera paître, ou consumera, la zone qui lui revient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: vers elle
  rationale: Préserve le sens directionnel courant de אֶל ; l’hostilité ressort ensuite de « contre elle ».
- source_word: רֹעִים וְעֶדְרֵיהֶם
  choice: des bergers… avec leurs troupeaux
  rationale: Maintient l’image pastorale suivie dans tout le verset, tout en rendant naturellement la valeur d’accompagnement du waw.
- source_word: תָּקְעוּ עָלֶיהָ אֹהָלִים סָבִיב
  choice: ils dresseront leurs tentes contre elle tout autour
  rationale: « Dresser des tentes » rend l’expression idiomatique, tandis que « contre elle » et « tout autour » font entendre le contexte de siège.
- source_word: רָעוּ
  choice: fera paître
  rationale: Conserve la métaphore des bergers plutôt que de l’expliciter par « dévorer » ou « ravager ».
- source_word: אִישׁ אֶת יָדוֹ
  choice: chacun… sa part
  rationale: Rend de façon compréhensible une expression hébraïque difficile, littéralement liée à la « main », qui semble désigner la zone revenant à chacun.
