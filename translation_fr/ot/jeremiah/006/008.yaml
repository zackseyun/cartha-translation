  text: הִוָּסְרִי֙ יְר֣וּשָׁלִַ֔ם פֶּן תֵּקַ֥ע נַפְשִׁ֖/י מִמֵּ֑/ךְ פֶּן אֲשִׂימֵ֣/ךְ שְׁמָמָ֔ה אֶ֖רֶץ ל֥וֹא נוֹשָֽׁבָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/008.yaml
  text: Be warned[a], O Jerusalem, lest my soul turn away from you, lest I make you a desolation[b], a land not inhabited.
translation:
  language: fr
  text: Accepte la correction[a], Jérusalem, de peur que mon âme ne se détache[b] de toi, de peur que je ne fasse de toi une désolation, un pays inhabité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Laisse-toi instruire », « Laisse-toi reprendre » ou « Reçois l’avertissement ». Le verbe hébreu évoque le fait de recevoir une discipline ou une correction, et non simplement d’être informé.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne s’éloigne de toi » ou « ne devienne étrangère à toi ». Littéralement, le verbe rare évoque le fait d’être arraché ou séparé.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִוָּסְרִי
  choice: Accepte la correction
  rationale: L’impératif nifal féminin singulier de יסר invite Jérusalem à se laisser reprendre et à recevoir la discipline. Cette formulation française exprime clairement la dimension corrective, et non une simple transmission d’information.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Nom géographique standard, employé ici en apostrophe.
- source_word: פֶּן
  choice: de peur que
  rationale: Introduit dans les deux propositions la conséquence redoutée si Jérusalem refuse la correction; la répétition conserve la structure solennelle de l’hébreu.
- source_word: תֵּקַע
  choice: ne se détache
  rationale: Le verbe rare évoque l’arrachement, l’éloignement ou l’aliénation. « Se détache » préserve l’image d’une rupture relationnelle sans en préciser excessivement le mécanisme.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Conserve l’expression anthropopathique explicite de l’hébreu et sa force littéraire, plutôt que de la réduire à « je ».
- source_word: מִמֵּךְ
  choice: de toi
  rationale: Le suffixe féminin singulier renvoie directement à Jérusalem.
- source_word: אֲשִׂימֵךְ
  choice: je ne fasse de toi
  rationale: שׂים signifie ici mettre ou rendre Jérusalem dans un état donné. La tournure est naturelle en français et maintient le lien direct entre l’action divine et son résultat.
- source_word: שְׁמָמָה
  choice: un lieu dévasté
  rationale: Le nom désigne un état ou un endroit de désolation. « Un lieu dévasté » restitue concrètement le résultat du jugement en français courant et digne.
- source_word: אֶרֶץ לֹא נוֹשָׁבָה
  choice: un pays inhabité
  rationale: Rend de manière concise la proposition hébraïque « un pays qui n’est pas habité », en conservant son rôle d’apposition explicative.
theological_decisions:
- issue: Expression anthropopathique de la נפש divine
  choice: mon âme ne se détache de toi
  alternative: je ne me détourne de toi
  rationale: Le texte attribue explicitement une נפש à Dieu. Garder « mon âme » préserve la personnification saisissante et la tension théologique du texte au lieu de l’aplanir.
translation_notes:
  register: Français international moderne, sobre et solennel. L’apostrophe « Jérusalem » et la répétition de « de peur que » conservent le rythme de l’avertissement prophétique. Les notes signalent les principales incertitudes lexicales sans imposer une interprétation confessionnelle.
