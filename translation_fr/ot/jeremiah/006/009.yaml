  text: כֹּ֤ה אָמַר֙ יְהֹוָ֣ה צְבָא֔וֹת עוֹלֵ֛ל יְעוֹלְל֥וּ כַ/גֶּ֖פֶן שְׁאֵרִ֣ית יִשְׂרָאֵ֑ל הָשֵׁב֙ יָדְ/ךָ֔ כְּ/בוֹצֵ֖ר עַל סַלְסִלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/009.yaml
  text: 'Thus says Yahweh of hosts: They will thoroughly glean the remnant of Israel as a vine[a]; pass your hand over the branches again like a grape-gatherer.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : « Ils grappilleront jusqu’au dernier le reste d’Israël, comme une vigne. Repasse ta main sur les sarments[a], comme le vendangeur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « sur les vrilles ». Le terme hébreu est rare et son sens précis est discuté ; certains comprennent aussi « sur les paniers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom d’alliance et rend le titre צְבָאוֹת de manière transparente et digne en français.
- source_word: עוֹלֵל יְעוֹלְלוּ
  choice: Ils grappilleront jusqu’au dernier
  rationale: Le verbe répété sous la forme infinitif absolu + inaccompli exprime une action intensive; cette formulation conserve l’image du grappillage et l’idée d’un dépouillement complet.
- source_word: כַגֶּפֶן
  choice: comme une vigne
  rationale: Rend directement la comparaison agricole sans en préciser davantage le rapport syntaxique.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: le reste d’Israël
  rationale: « Le reste » est naturel en français et conserve la portée contextuelle et théologique de שְׁאֵרִית.
- source_word: הָשֵׁב יָדְךָ
  choice: Repasse ta main
  rationale: Exprime naturellement l’ordre de recommencer le geste de la récolte tout en restant proche de l’image hébraïque.
- source_word: כְּבוֹצֵר
  choice: comme le vendangeur
  rationale: « Vendangeur » désigne précisément celui qui récolte les raisins et convient au registre biblique moderne.
- source_word: עַל סַלְסִלּוֹת
  choice: sur les sarments
  rationale: Dans le contexte viticole, « sarments » est une interprétation plausible du terme rare סַלְסִלּוֹת; son incertitude est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé plutôt que remplacé par un titre, conformément à la lecture retenue dans la couche de consultation et sans effacer le nom d’alliance.
- issue: Portée de שְׁאֵרִית יִשְׂרָאֵל
  choice: le reste d’Israël
  alternative: ce qui reste d’Israël
  rationale: « Le reste » préserve la formulation condensée et sa résonance théologique, sans déterminer ici si le groupe possède une valeur positive ou salvifique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La métaphore viticole est conservée, de même que l’intensité de la construction hébraïque et l’incertitude du dernier nom.
