  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה עִמְדוּ֩ עַל דְּרָכִ֨ים וּ/רְא֜וּ וְ/שַׁאֲל֣וּ לִ/נְתִב֣וֹת עוֹלָ֗ם אֵי זֶ֨ה דֶ֤רֶךְ הַ/טּוֹב֙ וּ/לְכוּ בָ֔/הּ וּ/מִצְא֥וּ מַרְגּ֖וֹעַ לְ/נַפְשְׁ/כֶ֑ם וַ/יֹּאמְר֖וּ לֹ֥א נֵלֵֽךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/016.yaml
  text: 'Thus says Yahweh: “Stand by the roads and look[a], and ask for the ancient paths, where the good way is; then walk in it, and find rest for your souls. But they said[b], ‘We will not walk in it.’”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh :


    « Arrêtez-vous près des routes et regardez ;


    renseignez-vous sur les sentiers d’autrefois[a] :


    “Où est le bon chemin ?”


    Empruntez-le,


    et vous trouverez le repos pour vos âmes[b]. »


    Mais ils ont dit : « Nous n’y marcherons pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sentiers anciens » ou « les sentiers éternels ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour vos âmes » ; le mot hébreu peut également désigner les personnes elles-mêmes ou leurs vies.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: עִמְדוּ עַל דְּרָכִים
  choice: Tenez-vous sur les routes
  rationale: Cette formulation conserve l’image concrète de personnes qui s’arrêtent sur les voies afin de discerner laquelle suivre, sans préciser indûment qu’il s’agit d’un carrefour.
- source_word: וּרְאוּ
  choice: regardez
  rationale: L’impératif peut évoquer à la fois l’observation et le discernement; « regardez » convient naturellement à l’image des routes.
- source_word: וְשַׁאֲלוּ לִנְתִבוֹת עוֹלָם
  choice: Interrogez-vous sur les sentiers d’autrefois
  rationale: נְתִיבוֹת désigne des sentiers ou pistes, et עוֹלָם renvoie ici probablement à leur ancienneté. La note conserve les autres nuances possibles.
- source_word: אֵי זֶה דֶּרֶךְ הַטּוֹב
  choice: Quel est le bon chemin ?
  rationale: La tournure française identifie naturellement la voie à rechercher tout en conservant la métaphore du chemin.
- source_word: וּלְכוּ בָהּ
  choice: Suivez-le
  rationale: En français actuel, « suivre un chemin » exprime naturellement le fait d’y marcher et son sens figuré de conduite.
- source_word: וּמִצְאוּ מַרְגּוֹעַ
  choice: et vous trouverez le repos
  rationale: La suite d’impératifs peut exprimer ici le résultat promis. Le futur rend clairement cette relation en français sans transformer la promesse en simple ordre de se reposer.
- source_word: לְנַפְשְׁכֶם
  choice: pour vos âmes
  rationale: Cette traduction garde la force personnelle et intérieure de נֶפֶשׁ, tandis que la note indique que le mot peut désigner plus largement la personne ou la vie.
- source_word: וַיֹּאמְרוּ לֹא נֵלֵךְ
  choice: 'Mais ils ont dit : « Nous n’y marcherons pas. »'
  rationale: « Mais » explicite le contraste contextuel entre l’appel de Yahweh et le refus du peuple. Le pronom « y » reprend sans lourdeur le bon chemin mentionné juste avant.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ dans la promesse de repos
  choice: pour vos âmes
  alternative: pour vous-mêmes / pour vos vies
  rationale: « Âmes » préserve la résonance spirituelle et traditionnelle du passage sans imposer une anthropologie dualiste; la note signale l’étendue sémantique du terme hébreu.
- issue: Nature des « sentiers » qualifiés par עוֹלָם
  choice: les sentiers d’autrefois
  alternative: les sentiers anciens / les sentiers éternels
  rationale: Dans cet appel à revenir à la bonne voie, l’ancienneté est la lecture contextuelle la plus probable. Comme עוֹלָם peut aussi évoquer une durée indéfinie ou perpétuelle, cette possibilité demeure visible en note.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La mise en lignes fait ressortir la succession des impératifs, la promesse de repos et le refus final. Les métaphores de la route, du chemin et de la marche sont maintenues autant que le permet l’idiome français.
