  to: 'Ainsi parle Yahweh :


    « Arrêtez-vous près des routes et regardez ;


    renseignez-vous sur les sentiers d’autrefois[a] :


    “Où est le bon chemin ?”


    Empruntez-le,


    et vous trouverez le repos pour vos âmes[b]. »


    Mais ils ont dit : « Nous n’y marcherons pas. »'
  rationale: La révision corrige surtout le faux sens réflexif de « Interrogez-vous ». Elle conserve la métaphore filée des routes et du chemin, l’ambiguïté raisonnable de עוֹלָם en note, ainsi que la portée personnelle de נֶפֶשׁ. « Empruntez-le » rend naturellement l’injonction de marcher dans la bonne voie ; le « y » du refus final explicite seulement l’antécédent immédiatement présent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : appel à examiner les voies anciennes, à reconnaître la bonne voie, à y marcher et promesse de repos, suivi du refus. Cependant, « Interrogez-vous sur » signifie normalement en français « posez-vous des questions sur » et ne rend pas l’impératif adressé au peuple d’interroger/demander. La formulation doit donc être corrigée.'
  naturalness: Le registre est globalement digne et moderne. « Tenez-vous sur les routes » est un peu moins idiomatique et peut évoquer le fait de se tenir physiquement sur la chaussée. « Arrêtez-vous près des routes » conserve l’image sans surinterpréter « carrefours ». La ponctuation et le découpage peuvent rester sobres afin de suivre la progression des impératifs.
  terminology: « Yahweh », « sentiers d’autrefois », « bon chemin », « repos » et « âmes » sont des choix recevables. « Âmes » maintient la résonance traditionnelle sans exclure les sens plus larges de נֶפֶשׁ, signalés en note. La note sur עוֹלָם doit présenter « éternels » comme possibilité lexicale sans en faire le sens imposé.
  issues:
  - severity: medium
    issue: « Interrogez-vous sur les sentiers d’autrefois »
    rationale: En français moderne, cette expression est réflexive et décrit une délibération intérieure. Le texte hébreu commande de demander ou de s’informer au sujet des sentiers anciens. « Renseignez-vous sur » rend l’acte d’enquête sans ajouter un interlocuteur ou une interprétation.
  - severity: low
    issue: « Tenez-vous sur les routes »
    rationale: Cette formulation est compréhensible mais légèrement raide et peut suggérer qu’on se tient au milieu des routes. « Arrêtez-vous près des routes » est plus naturel tout en gardant l’image de l’arrêt pour discerner.
