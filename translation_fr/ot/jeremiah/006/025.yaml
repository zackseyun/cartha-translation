    issue: Explicitation de la relation entre l’épée et l’ennemi
    rationale: « L’ennemi est armé de l’épée » transforme le groupe nominal elliptique hébreu en une proposition affirmative et emploie un défini français (« l’épée ») peu naturel dans cette paraphrase. « L’épée de l’ennemi » est à la fois plus fidèle et plus idiomatique.
  - severity: low
    issue: Ancrage de la note sur le féminin singulier
    rationale: La note porte sur les verbes d’adresse ; son appel est plus cohérent après le premier impératif que seulement à la fin du verset.
