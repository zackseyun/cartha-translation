  text: אַל תצאי הַ/שָּׂדֶ֔ה וּ/בַ/דֶּ֖רֶךְ אַל תלכי כִּ֚י חֶ֣רֶב לְ/אֹיֵ֔ב מָג֖וֹר מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/025.yaml
  text: Do not go out into the field[a], and do not walk on the road[b], for the sword of the enemy and terror are on every side.
translation:
  language: fr
  text: Ne sors pas[a] dans les champs et ne marche pas sur la route, car l’épée de l’ennemi et la terreur sont de tous côtés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les verbes hébreux sont au féminin singulier ; l’avertissement s’adresse vraisemblablement à Jérusalem, personnifiée comme une femme, ou à la « fille de Sion ». L’hébreu juxtapose de façon concise : « épée de/pour l’ennemi ; terreur de tous côtés ».'
    reason: cultural_note
lexical_decisions:
- source_word: אַל תצאי
  choice: Ne sors pas
  rationale: La particule de défense אַל avec l’imparfait exprime une interdiction. Le verbe est à la deuxième personne du féminin singulier, forme que le français ne marque pas ici.
- source_word: הַשָּׂדֶה
  choice: dans les champs
  rationale: שׂדה désigne le champ ou la campagne. Le pluriel français exprime naturellement ici l’espace cultivé ou découvert sans changer le sens collectif du singulier hébreu.
- source_word: וּבַדֶּרֶךְ אַל תלכי
  choice: et ne marche pas sur la route
  rationale: דרך désigne la route ou le chemin, et הלך signifie marcher ou aller. « Marche » conserve la variation par rapport à « sors ».
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction dans un registre prophétique concis.
- source_word: חֶרֶב לְאֹיֵב
  choice: l’ennemi est armé de l’épée
  rationale: 'Le ל peut exprimer ici la possession ou l’association : littéralement, « une épée à/pour l’ennemi ». Cette formulation française rend clairement la menace tout en conservant l’image concrète de l’épée.'
- source_word: מָגוֹר מִסָּבִיב
  choice: la terreur règne de tous côtés
  rationale: מָגוֹר signifie terreur ou effroi, et מִסָּבִיב indique un danger environnant. La tournure française restitue naturellement la formule récurrente de Jérémie.
theological_decisions:
- issue: Identité de la destinataire au féminin singulier
  choice: Conserver une adresse directe sans ajouter « Jérusalem » ni « fille de Sion » dans le texte
  alternative: 'Expliciter : « Jérusalem, ne sors pas… »'
  rationale: Le contexte permet probablement une personnification de Jérusalem ou de la fille de Sion, mais le verset hébreu ne nomme pas ici la destinataire. Le français ne marqueant pas le genre dans ces impératifs, une note signale cette donnée sans résoudre davantage l’identification.
- issue: Relation syntaxique entre l’épée, l’ennemi et la terreur
  choice: 'Présenter deux dangers coordonnés : l’ennemi armé et la terreur environnante'
  alternative: « car l’épée de l’ennemi, la terreur, est de tous côtés » ou « car l’épée appartient à l’ennemi ; terreur de tous côtés »
  rationale: L’hébreu juxtapose des groupes nominaux sans verbe explicite. La traduction garde la tension entre menace militaire et terreur ambiante sans les identifier l’une à l’autre.
translation_notes:
  register: Français international moderne, direct et solennel. « Dans les champs » et « sur la route » sont usuels et concrets ; « règne de tous côtés » conserve la force poétique de l’avertissement sans archaïsme.
