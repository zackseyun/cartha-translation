id: JER.6.10
reference: Jeremiah 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל מִ֨י אֲדַבְּרָ֤ה וְ/אָעִ֨ידָה֙ וְ/יִשְׁמָ֔עוּ הִנֵּה֙ עֲרֵלָ֣ה אָזְנָ֔/ם וְ/לֹ֥א יוּכְל֖וּ לְ/הַקְשִׁ֑יב הִנֵּ֣ה דְבַר יְהוָ֗ה הָיָ֥ה לָ/הֶ֛ם לְ/חֶרְפָּ֖ה לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/010.yaml
  text: To whom shall I speak and give warning[a], that they may hear? Look, their ear is uncircumcised, and they are not able to listen. Look, the word of Yahweh has become a reproach to them[b]; they take no delight in it.
translation:
  language: fr
  text: À qui parlerai-je et adresserai-je un avertissement[a], pour qu’ils entendent ? Voici, leur oreille est incirconcise[b], et ils sont incapables de prêter attention. Voici, la parole de Yahweh est devenue pour eux un objet de mépris ; ils n’y prennent aucun plaisir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « témoigner » ou « prendre à témoin » ; le verbe hébreu peut désigner un avertissement solennel ou un témoignage.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « leur oreille est incirconcise » : image exprimant leur insensibilité et leur refus d’écouter.'
    reason: cultural_note
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: parlerai-je
  rationale: La forme à valeur délibérative apparaît dans une question rhétorique. Le futur interrogatif français en préserve naturellement la force.
- source_word: וְאָעִידָה
  choice: et adresserai-je un avertissement
  rationale: Le hifil de עוד peut exprimer l’action d’avertir solennellement ou de témoigner. Dans ce contexte prophétique, « adresser un avertissement » restitue clairement sa portée sans exclure l’autre nuance, signalée en note.
- source_word: וְיִשְׁמָעוּ
  choice: pour qu’ils entendent
  rationale: 'La proposition est comprise comme exprimant le but recherché : parler de manière à être entendu. « Entendre » conserve le parallèle avec l’attention mentionnée ensuite.'
- source_word: עֲרֵלָה אָזְנָם
  choice: leur oreille est incirconcise
  rationale: La traduction conserve l’image corporelle et liée à l’alliance, plutôt que de la réduire à « leurs oreilles sont fermées ». Le singulier collectif suit l’hébreu.
- source_word: לְהַקְשִׁיב
  choice: prêter attention
  rationale: Cette expression française naturelle marque ici l’écoute attentive et réceptive, en complément du simple fait d’entendre.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: L’expression prophétique est rendue directement, et le nom divin est translittéré.
- source_word: הָיָה לָהֶם לְחֶרְפָּה
  choice: est devenue pour eux un objet de mépris
  rationale: Cette formulation exprime que la parole de Yahweh est traitée comme quelque chose de honteux ou de méprisable. Elle est plus idiomatique en français moderne que « est devenue un opprobre pour eux ».
- source_word: לֹא יַחְפְּצוּ בוֹ
  choice: ils n’y prennent aucun plaisir
  rationale: חפץ associe désir et plaisir. Cette traduction conserve la dimension affective et volontaire de leur rejet.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre.
- issue: Image de l’oreille incirconcise
  choice: Conserver « leur oreille est incirconcise »
  alternative: leurs oreilles sont fermées / ils sont spirituellement sourds
  rationale: L’image hébraïque évoque une absence de réceptivité avec une portée liée à l’alliance. La conserver évite d’aplanir cette force théologique, tandis qu’une note en éclaire le sens.
- issue: Portée de וְאָעִידָה
  choice: adresser un avertissement
  alternative: témoigner / prendre à témoin
  rationale: Le contexte prophétique favorise l’idée d’un avertissement solennel, mais le verbe peut aussi relever du témoignage. La note maintient cette possibilité lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement rhétorique et les deux « Voici » du texte hébreu. L’image inhabituelle de l’oreille incirconcise est maintenue dans le corps du texte et expliquée en note.
