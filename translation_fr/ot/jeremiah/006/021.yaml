source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י נֹתֵ֛ן אֶל הָ/עָ֥ם הַ/זֶּ֖ה מִכְשֹׁלִ֑ים וְ/כָ֣שְׁלוּ בָ֠/ם אָב֨וֹת וּ/בָנִ֥ים יַחְדָּ֛ו שָׁכֵ֥ן וְ/רֵע֖/וֹ יאבדו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/021.yaml
  text: 'Therefore[a], thus says Yahweh: Behold, I am setting stumbling blocks before this people, and they will stumble over them—fathers and sons together[b]; neighbor and his friend will perish.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahweh : « Voici que je place des obstacles devant ce peuple[a]. Ils trébucheront dessus, les pères et les fils ensemble ; le voisin et son compagnon périront. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Je place des obstacles sur le chemin de ce peuple. »'
    reason: Alternative de formulation qui explicite l’image spatiale des obstacles sans transformer la préposition en interprétation hostile.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’accusation et de l’annonce de jugement qui précèdent.
- source_word: כֹּה אָמַר יְהוָה
  choice: ainsi parle Yahweh
  rationale: Conserve la formule solennelle du messager prophétique tout en employant le présent idiomatique français.
- source_word: הִנְנִי נֹתֵן
  choice: Voici que je place
  rationale: Rend à la fois la force présentative de הִנְנִי et l’action en cours ou imminente exprimée par le participe נֹתֵן.
- source_word: אֶל הָעָם הַזֶּה
  choice: devant ce peuple
  rationale: Dans l’image d’obstacles provoquant une chute, « devant » indique leur placement sur la route du peuple sans réduire la préposition à un seul sens abstrait.
- source_word: מִכְשֹׁלִים
  choice: des obstacles
  rationale: Terme français courant qui garde l’image concrète de ce qui fait trébucher, sans préciser que ces obstacles seraient nécessairement des pierres.
- source_word: וְכָשְׁלוּ בָם
  choice: Ils trébucheront dessus
  rationale: Préserve la reprise lexicale entre les obstacles et le verbe כשל, avec une tournure naturelle en français moderne.
- source_word: אָבוֹת וּבָנִים יַחְדָּו
  choice: les pères et les fils ensemble
  rationale: Respecte les termes masculins précis de l’hébreu et souligne que le jugement atteint conjointement les générations.
- source_word: שָׁכֵן וְרֵעוֹ
  choice: le voisin et son compagnon
  rationale: Distingue le voisin géographique du compagnon ou proche associé, comme le fait l’hébreu.
- source_word: יֹאבֵדוּ
  choice: périront
  rationale: Exprime la gravité du jugement sans imposer un mode précis de destruction que le verbe hébreu ne spécifie pas.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR (substitution liturgique traditionnelle)
  rationale: Le texte hébreu porte directement le Tétragramme. « Yahweh » conserve ici le nom personnel plutôt que de le remplacer par un titre.
- issue: Nature des obstacles placés par Dieu
  choice: des obstacles devant ce peuple
  alternative: des causes de chute contre ce peuple
  rationale: Le contexte présente ces obstacles comme un acte de jugement divin, mais l’image et la préposition ne permettent pas d’en préciser davantage la nature. La traduction maintient donc la métaphore sans identifier les obstacles.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La formule « ainsi parle Yahweh » garde la dignité prophétique ; « Voici que » reste soutenu mais intelligible. La ponctuation met en relief l’annonce divine puis ses effets sur la famille et le voisinage.
