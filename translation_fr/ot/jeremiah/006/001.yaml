id: JER.6.1
reference: Jeremiah 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָעִ֣זוּ בְּנֵ֣י בִניָמִ֗ן מִ/קֶּ֨רֶב֙ יְר֣וּשָׁלִַ֔ם וּ/בִ/תְק֨וֹעַ֙ תִּקְע֣וּ שׁוֹפָ֔ר וְ/עַל בֵּ֥ית הַכֶּ֖רֶם שְׂא֣וּ מַשְׂאֵ֑ת כִּ֥י רָעָ֛ה נִשְׁקְפָ֥ה מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/001.yaml
  text: Take cover[a], sons of Benjamin, from the midst of Jerusalem! Blow the trumpet in Tekoa, and raise a signal over Beth-haccherem, for disaster is looking down from the north[d][c][b], and great destruction.
translation:
  language: fr
  text: Mettez-vous à l’abri[a], fils de Benjamin, hors de Jérusalem ! Sonnez du cor à Téqoa et élevez un signal[c] sur Beth-Hakkérem[b], car un malheur se profile du nord[d], et une grande destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fuyez pour vous mettre en sûreté » ou « Rassemblez-vous pour fuir ». L’impératif hébreu est difficile et semble exprimer la recherche urgente d’un refuge.
    reason: lexical_alternative
  - marker: b
    text: Beth-Hakkérem est un nom de lieu, probablement un point élevé servant à transmettre des signaux d’alarme entre Jérusalem et Téqoa.
    reason: cultural_note
  - marker: c
    text: Ou « élevez un feu de signalisation » ou « dressez un signal d’alarme ».
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu dit plus littéralement : « un malheur regarde d’en haut depuis le nord », personnifiant la calamité qui approche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִזוּ
  choice: Mettez-vous à l’abri
  rationale: L’impératif hiphil est difficile, mais le contexte d’alarme et d’invasion imminente favorise l’idée de chercher d’urgence un lieu sûr. Cette formulation reste concise sans réduire le verbe à une simple exhortation au courage.
- source_word: בְּנֵי בִנְיָמִן
  choice: fils de Benjamin
  rationale: La formulation conserve l’expression filiale et l’identité tribale de l’hébreu ; elle désigne collectivement les membres de Benjamin.
- source_word: מִקֶּרֶב יְרוּשָׁלִַם
  choice: loin du cœur de Jérusalem
  rationale: קֶרֶב désigne l’intérieur ou le milieu. Avec l’appel à chercher refuge, « loin du cœur de » exprime naturellement en français le mouvement hors de la ville.
- source_word: וּבִתְקוֹעַ תִּקְעוּ שׁוֹפָר
  choice: Sonnez du cor à Teqoa
  rationale: שׁוֹפָר est un cor, souvent fait d’une corne de bélier, utilisé ici pour donner l’alarme. « Sonner du cor » est précis et naturel.
- source_word: וְעַל בֵּית הַכֶּרֶם
  choice: sur Beth-Hakkérem
  rationale: עַל garde son sens spatial de « sur », cohérent avec l’élévation d’un signal en un lieu probablement situé en hauteur.
- source_word: שְׂאוּ מַשְׂאֵת
  choice: élevez un signal
  rationale: מַשְׂאֵת désigne ici quelque chose que l’on élève pour avertir. « Signal » préserve l’indétermination du texte sans imposer qu’il s’agisse d’un feu.
- source_word: כִּי רָעָה
  choice: car un malheur
  rationale: Dans ce contexte prophétique, רָעָה désigne une calamité plutôt que le mal moral. « Malheur » convient au registre et à la menace annoncée.
- source_word: נִשְׁקְפָה
  choice: se profile
  rationale: Le verbe évoque ce qui regarde ou apparaît depuis un point élevé. « Se profile » rend naturellement l’imminence visible de la calamité, tandis qu’une note conserve l’image littérale.
- source_word: מִצָּפוֹן
  choice: du nord
  rationale: Traduction directionnelle directe ; chez Jérémie, le nord est fréquemment la direction d’où arrive l’envahisseur.
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: et une grande destruction
  rationale: שֶׁבֶר évoque littéralement une fracture ou un brisement, mais désigne ici la ruine produite par l’invasion. La proposition nominale demeure elliptique comme en hébreu.
theological_decisions:
- issue: Adresse tribale au masculin
  choice: fils de Benjamin
  alternative: gens de Benjamin ; Benjaminites
  rationale: Le choix maintient l’expression masculine filiale du texte tout en la comprenant comme une adresse collective à la tribu, sans la neutraliser ni la restreindre artificiellement.
- issue: Langage du jugement imminent
  choice: un malheur… une grande destruction
  alternative: un mal… une grande ruine
  rationale: Les mots décrivent ici les effets calamiteux du jugement annoncé, non une définition du mal moral. La traduction n’ajoute aucune précision doctrinale étrangère au verset.
- issue: Personnification de la calamité
  choice: se profile
  alternative: regarde d’en haut ; se penche
  rationale: La formulation principale privilégie un français naturel tout en gardant l’image d’une menace visible et imminente. La note signale explicitement la personnification plus littérale afin de ne pas l’effacer.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs conservent l’urgence de l’alarme. « Cor » précise la nature du shofar ; les noms de lieux sont translittérés sous des formes lisibles en français. L’ellipse finale est volontairement maintenue pour refléter la vigueur de l’hébreu.
