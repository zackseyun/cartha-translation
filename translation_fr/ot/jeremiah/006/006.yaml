id: JER.6.6
reference: Jeremiah 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּרְת֣וּ עֵצָ֔ה וְ/שִׁפְכ֥וּ עַל יְרוּשָׁלִַ֖ם סֹלְלָ֑ה הִ֚יא הָ/עִ֣יר הָפְקַ֔ד כֻּלָּ֖/הּ עֹ֥שֶׁק בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/006.yaml
  text: 'For thus says Yahweh of hosts: “Cut down trees[a], and heap up a siege ramp against Jerusalem. This is the city that must be punished[b]; there is nothing but oppression within her.”'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh des armées : « Abattez des arbres et élevez une rampe de siège[a] contre Jérusalem. Voilà la ville qui doit être punie[b] : il n’y a en son sein qu’oppression. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « versez une rampe de siège », expression qui évoque l’amoncellement des matériaux nécessaires à sa construction.
    reason: Précision sur l’image littérale et son sens idiomatique.
  - marker: b
    text: Ou « la ville à laquelle il faut demander des comptes ». Le verbe hébreu peut littéralement évoquer une « visitation », ici dans le sens d’une intervention judiciaire.
    reason: Maintien de l’alternative lexicale et de la nuance judiciaire du verbe.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et le distingue d’un titre tel que « Seigneur ».
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend directement le titre hébreu tout en conservant son ampleur militaire, sans le limiter explicitement aux seules armées humaines ou célestes.
- source_word: כִּרְתוּ עֵצָה
  choice: Abattez des arbres
  rationale: Le singulier עֵצָה a ici un sens collectif; cette formulation française est naturelle dans le contexte des préparatifs d’un siège.
- source_word: וְשִׁפְכוּ ... סֹלְלָה
  choice: élevez une rampe de siège
  rationale: Le verbe signifie littéralement « verser », mais l’expression désigne ici l’amoncellement de matériaux pour construire un ouvrage de siège.
- source_word: עַל יְרוּשָׁלִַם
  choice: contre Jérusalem
  rationale: Dans ce contexte militaire, עַל marque l’action hostile dirigée contre la ville.
- source_word: הִיא הָעִיר
  choice: Voilà la ville
  rationale: Cette tournure restitue avec naturel l’insistance du pronom hébreu.
- source_word: הָפְקַד
  choice: qui doit être punie
  rationale: Dans le contexte du siège annoncé, la « visitation » exprimée par פקד est judiciaire et punitive.
- source_word: כֻּלָּהּ עֹשֶׁק
  choice: il n’y a ... qu’oppression
  rationale: Cette formulation idiomatique conserve la portée totalisante et énergique de l’hébreu.
- source_word: בְּקִרְבָּהּ
  choice: en son sein
  rationale: Expression française digne et naturelle qui maintient la personnification féminine de la ville.
theological_decisions:
- issue: Portée judiciaire de הָפְקַד
  choice: qui doit être punie
  alternative: qui doit être visitée / à qui il faut demander des comptes
  rationale: Le contexte prophétique et militaire indique une intervention divine de jugement; la note conserve toutefois le sens plus littéral et l’éventail sémantique du verbe.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe conserve le ton d’un ordre militaire et la personnification de Jérusalem; les notes signalent les deux expressions hébraïques dont une traduction strictement littérale serait obscure ou ambiguë.
