  naturalness: Le français est globalement clair et de registre approprié. « Leur clameur gronde comme la mer » est plus direct et plus idiomatique. « Ils montent des chevaux » peut se comprendre comme l’action de monter à cheval plutôt que comme le fait de chevaucher ; « ils sont à cheval » convient naturellement dans cette description militaire. La formulation littérale « rangés comme un homme » demeure volontairement inhabituelle, mais elle est intelligible et sa note explique l’ambiguïté.
  terminology: « Arc », « javelot », « cruels », « combat » et « fille de Sion » sont des choix justes et cohérents. La note sur כְאִישׁ préserve adéquatement l’alternative « comme un seul homme » sans imposer une interprétation unique.
