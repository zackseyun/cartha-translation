  text: קֶ֣שֶׁת וְ/כִיד֞וֹן יַחֲזִ֗יקוּ אַכְזָרִ֥י הוּא֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/023.yaml
  text: They seize bow and javelin; they are cruel and show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Zion.
translation:
  language: fr
  text: Ils saisissent l’arc et le javelot ; ils sont cruels et n’ont aucune compassion. Leur clameur gronde comme la mer. Ils sont à cheval, rangés comme un homme[a] pour le combat contre toi, fille de Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rangés comme un seul homme pour le combat ». Le singulier hébreu peut exprimer soit une comparaison avec un combattant, soit l’unité de la formation.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: קֶשֶׁת וְכִידוֹן
  choice: l’arc et le javelot
  rationale: Le singulier a ici une valeur générique ou collective dans cette description militaire. « Javelot » conserve la spécificité de כִידוֹן sans le réduire au terme plus général « lance ».
- source_word: יַחֲזִיקוּ
  choice: ils saisissent
  rationale: Le hiphil de חזק exprime ici le fait de prendre ou tenir fermement des armes. « Saisissent » garde la vigueur de l’image sans ajouter l’idée plus interprétative de maniement.
- source_word: אַכְזָרִי הוּא
  choice: ils sont cruels
  rationale: Le singulier hébreu renvoie collectivement au peuple envahisseur, tandis que les verbes du contexte sont au pluriel ; l’accord pluriel est naturel en français.
- source_word: וְלֹא יְרַחֵמוּ
  choice: et n’ont aucune compassion
  rationale: Le piel de רחם désigne la compassion ou la pitié. Cette formulation française reste directe et forte.
- source_word: קוֹלָם כַיָּם יֶהֱמֶה
  choice: Leur grondement est pareil à celui de la mer
  rationale: קוֹל désigne ici le bruit collectif de l’armée, et המה son tumulte grondant. La formulation reproduit l’image sonore sans attribuer littéralement une voix à l’armée.
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: Ils montent des chevaux
  rationale: Rendu français naturel de l’image des assaillants à cheval.
- source_word: עָרוּךְ
  choice: rangés
  rationale: Dans un contexte militaire, le terme évoque une troupe disposée ou mise en ordre pour le combat.
- source_word: כְאִישׁ
  choice: comme un homme
  rationale: Le texte hébreu porte le singulier « comme un homme ». Cette traduction formelle en maintient l’ambiguïté, explicitée en note.
- source_word: לַמִּלְחָמָה
  choice: pour le combat
  rationale: Expression française courante qui convient à la scène militaire immédiate.
- source_word: עָלַיִךְ בַּת צִיּוֹן
  choice: contre toi, fille de Sion
  rationale: Conserve l’adresse directe et la personnification poétique de Sion comme une fille.
theological_decisions:
- issue: Interprétation du singulier כְאִישׁ
  choice: comme un homme
  alternative: comme un seul homme
  rationale: Le singulier peut comparer la troupe à un combattant prêt à la bataille ou souligner son unité. Le texte principal suit la forme hébraïque, tandis que la note préserve l’autre lecture contextuelle.
- issue: Rendu de la ville personnifiée בַּת צִיּוֹן
  choice: fille de Sion
  alternative: fille Sion
  rationale: L’expression est une personnification poétique de Sion ou Jérusalem, sans portée doctrinale particulière. « Fille de Sion » est idiomatique en français tout en préservant l’image et l’interpellation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme bref et martial est conservé. « Fille de Sion » maintient la personnification prophétique traditionnelle sans archaïsme d’adresse.
