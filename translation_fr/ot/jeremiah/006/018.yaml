id: JER.6.18
reference: Jeremiah 6:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֖ן שִׁמְע֣וּ הַ/גּוֹיִ֑ם וּ/דְעִ֥י עֵדָ֖ה אֶת אֲשֶׁר בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/018.yaml
  text: Therefore hear[a], O nations, and know, O congregation[b], what is among them.
translation:
  language: fr
  text: C’est pourquoi, écoutez, nations ! Et toi, communauté[a], sache ce qui se trouve parmi eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assemblée » ou « congrégation ». Le terme hébreu עֵדָה est collectif, et son référent précis est discuté.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qui est en eux ». L’expression hébraïque est concise et peut désigner ce qui se trouve en eux ou parmi eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence de l’accusation et du jugement annoncés précédemment, dans un français naturel et soutenu.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif pluriel appelle les nations à prêter attention. « Écoutez » exprime plus naturellement en français moderne la portée de l’hébreu que le seul verbe « entendre ».
- source_word: הַגּוֹיִם
  choice: nations
  rationale: Correspond au sens courant de גּוֹיִם dans l’adresse prophétique, sans introduire la nuance plus particulière de « païens ».
- source_word: וּדְעִי
  choice: Et toi… sache
  rationale: L’impératif est au féminin singulier. La tournure avec « toi » rend clairement le changement du pluriel au singulier tout en conservant le sens fondamental de ידע, « savoir ».
- source_word: עֵדָה
  choice: communauté
  rationale: Nom collectif féminin singulier pouvant désigner une communauté, une assemblée ou une congrégation. « Communauté » reste actuel, digne et assez large puisque le référent précis est discuté.
- source_word: אֶת אֲשֶׁר בָּם
  choice: ce qui se trouve parmi eux
  rationale: La formule hébraïque est concise et elliptique. Cette traduction demeure ouverte à ce qui est présent en eux ou au milieu d’eux, sans préciser indûment son objet.
theological_decisions:
- issue: Référent et fonction de עֵדָה
  choice: 'Le comprendre comme un collectif singulier pris à partie directement : « Et toi, communauté »'
  alternative: Le rattacher aux nations comme une apposition (« assemblée des nations »), ou proposer une correction du texte en raison de sa difficulté.
  rationale: La vocalisation massorétique présente un impératif féminin singulier suivi d’un nom collectif singulier. L’adresse directe conserve cette donnée grammaticale et la tension rhétorique du texte sans recourir à une conjecture.
translation_notes:
  register: Français international moderne, au registre prophétique digne. La ponctuation souligne les deux impératifs et le passage d’un destinataire pluriel (« nations ») à un collectif singulier (« communauté »).
