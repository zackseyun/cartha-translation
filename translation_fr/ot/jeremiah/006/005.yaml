  yaml_path: translation/ot/jeremiah/006/005.yaml
  text: Rise up[a], and let us go up by night, and let us destroy her palaces.
translation:
  language: fr
  text: Debout ! Montons de nuit et détruisons ses palais[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses citadelles » ou « ses forteresses ». Le terme hébreu peut désigner aussi bien des bâtiments palatiaux que d’imposantes constructions fortifiées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמוּ
  choice: Debout !
  rationale: L’impératif masculin pluriel de קום lance un appel collectif urgent. « Debout ! » est naturel en français moderne et conserve la vigueur militaire de l’injonction.
- source_word: וְ/נַעֲלֶ֣ה
  choice: Montons
  rationale: Le cohortatif à la première personne du pluriel de עלה a une valeur exhortative. « Montons » préserve à la fois cette force et l’image spatiale de l’hébreu, sans expliciter le verbe par « attaquons ».
- source_word: בַ/לָּ֔יְלָה
  choice: de nuit
  rationale: La locution prépositionnelle indique le moment de l’action. « De nuit » est idiomatique, concise et adaptée au contexte d’une offensive.
- source_word: וְ/נַשְׁחִ֖יתָה
  choice: et détruisons
  rationale: Le cohortatif de שׁחת au causatif exprime une destruction délibérée. « Détruisons » rend clairement l’exhortation coordonnée.
- source_word: אַרְמְנוֹתֶֽי/הָ
  choice: ses palais
  rationale: Le nom אַרְמוֹן peut désigner des palais ou de grands bâtiments fortifiés. « Palais » est une traduction naturelle et traditionnelle, tandis que la note conserve les autres possibilités lexicales.
