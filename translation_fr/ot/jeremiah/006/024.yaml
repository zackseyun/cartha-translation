  yaml_path: translation/ot/jeremiah/006/024.yaml
  text: We have heard the report of it[a]; our hands hang limp. Distress has seized us[c][b], pain like a woman giving birth.
translation:
  language: fr
  text: Nous avons entendu la nouvelle à son sujet[a] ; nos mains sont sans force[b]. La détresse nous a saisis, des douleurs comme celles d’une femme qui accouche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa nouvelle ». Le suffixe hébreu peut désigner la nouvelle concernant l’ennemi ou, moins probablement dans ce contexte, la nouvelle qui lui est attribuée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nos mains se sont affaiblies », expression qui évoque la perte de force ou de courage.'
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction : « une douleur comme celle d’une femme en travail ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Nous avons entendu
  rationale: Le qal accompli à la première personne du pluriel exprime ici une nouvelle entendue dont les effets se font encore sentir.
- source_word: אֶת שָׁמְעוֹ
  choice: en parler
  rationale: שֵׁמַע désigne une nouvelle ou une rumeur. Le suffixe masculin singulier renvoie vraisemblablement à l’ennemi évoqué dans le contexte ; « en parler » rend naturellement en français le fait d’avoir reçu des nouvelles à son sujet tout en évitant une lourdeur.
- source_word: רָפוּ יָדֵינוּ
  choice: nos mains sont sans force
  rationale: L’expression associe l’image concrète des mains devenues faibles à la perte de force et de courage.
- source_word: צָרָה
  choice: La détresse
  rationale: צָרָה évoque une situation d’angoisse et d’oppression ; « détresse » convient au contexte de terreur.
- source_word: הֶחֱזִיקַתְנוּ
  choice: nous a saisis
  rationale: Le hiphil de חזק décrit ici la détresse qui s’empare des personnes avec force.
- source_word: חִיל
  choice: des douleurs
  rationale: חִיל peut désigner douleur, tournoiement ou angoisse ; la comparaison immédiate avec l’accouchement favorise « douleurs ».
- source_word: כַּיּוֹלֵדָה
  choice: comme celles d’une femme qui accouche
  rationale: Le participe de ילד présente une femme en train d’enfanter ; cette formulation est claire et actuelle.
