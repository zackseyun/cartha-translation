source:
  edition: WLC
  text: נָחַ֣ר מַפֻּ֔חַ מ/אשת/ם עֹפָ֑רֶת לַ/שָּׁוְא֙ צָרַ֣ף צָר֔וֹף וְ/רָעִ֖ים לֹ֥א נִתָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/029.yaml
  text: The bellows blow fiercely[a]; the lead is consumed by the fire. In vain the refiner keeps refining[b], but the wicked are not separated out.
translation:
  language: fr
  text: Le soufflet souffle avec force[a] ; le plomb est consumé par le feu. L’affineur affine encore et encore, en vain[b], mais les méchants ne sont pas écartés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Le soufflet est brûlé ; le plomb est consumé par le feu qui en provient. » L’hébreu de cette proposition est difficile, et le rapport entre le feu et le plomb est incertain.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « l’affineur continue d’affiner ». Dans un sens plus strictement métallurgique, la dernière proposition peut se traduire : « mais les impuretés ne sont pas retirées » ou « ne sont pas séparées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחַר
  choice: souffle avec force
  rationale: Le verbe évoque littéralement un souffle bruyant ou haletant. Avec « soufflet » pour sujet, cette formulation exprime naturellement l’intensité du soufflage tout en gardant l’image de la fonderie.
- source_word: מַפֻּחַ
  choice: le soufflet
  rationale: Le nom désigne le soufflet employé pour attiser le feu lors de l’affinage des métaux.
- source_word: מֵאִשְׁתָּם
  choice: par le feu
  rationale: La forme hébraïque est difficile. Dans ce contexte métallurgique, elle indique vraisemblablement l’action du feu, sans qu’il soit possible d’en préciser sûrement le rapport syntaxique.
- source_word: עֹפָרֶת
  choice: le plomb
  rationale: Le terme désigne le plomb, probablement utilisé dans le procédé d’affinage.
- source_word: לַשָּׁוְא
  choice: a beau
  rationale: La tournure française « avoir beau » rend clairement l’idée d’un effort répété qui reste vain.
- source_word: צָרַף ... צָרוֹף
  choice: l’affineur poursuit l’affinage
  rationale: La répétition de la racine hébraïque intensifie ou prolonge l’action. Cette formulation restitue l’effort persistant dans un français naturel ; « l’affineur » est explicité d’après le contexte.
- source_word: וְרָעִים
  choice: les méchants
  rationale: L’adjectif peut évoquer, dans la métaphore, les éléments mauvais ou impurs, mais il désigne couramment des personnes mauvaises. « Les méchants » maintient l’application morale du contexte.
- source_word: נִתָּקוּ
  choice: ne sont pas éliminés
  rationale: Dans l’image de l’affinage, le verbe indique que les éléments mauvais ne sont ni détachés ni retirés. « Éliminés » convient à la fois à la métaphore et à son application humaine.
theological_decisions:
- issue: Interprétation de la métaphore de l’affinage
  choice: 'Le verset présente l’échec de l’affinage comme l’image de l’endurcissement moral du peuple : malgré un effort intense, les méchants ne sont pas éliminés.'
  alternative: 'Comprendre la dernière proposition dans un sens uniquement métallurgique : « les impuretés ne sont pas retirées ».'
  rationale: Le contexte immédiat applique l’image de l’affinage à l’épreuve morale du peuple. La traduction conserve donc la scène métallurgique tout en laissant apparaître son référent humain.
translation_notes:
  register: Français international moderne, clair et soutenu. L’image métallurgique est conservée, avec une syntaxe naturelle. Les notes signalent l’incertitude réelle de la première proposition et la double portée, morale ou métallurgique, de la dernière.
