  text: הַ/נָּוָה֙ וְ/הַ/מְּעֻנָּגָ֔ה דָּמִ֖יתִי בַּת צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/002.yaml
  text: I have likened daughter Zion to a lovely and delicate woman[a].
translation:
  language: fr
  text: J’ai comparé la fille de Sion à une femme belle et délicate[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Je détruirai la fille de Sion, la belle et délicate. » Le verbe hébreu est difficile ici; certains lui donnent un sens de destruction ou de réduction au silence plutôt que celui de comparaison.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּוָה
  choice: belle
  rationale: L’adjectif féminin qualifie ici le plus naturellement l’attrait ou la beauté. « Belle » est clair, actuel et s’accorde avec le second adjectif.
- source_word: וְהַמְּעֻנָּגָה
  choice: et délicate
  rationale: Le terme évoque la délicatesse, le raffinement ou une vie protégée. « Délicate » préserve cette nuance sans introduire le jugement défavorable que pourrait suggérer « choyée ».
- source_word: דָּמִיתִי
  choice: J’ai comparé
  rationale: Le qal à la première personne peut exprimer l’idée de ressemblance ou de comparaison. La tournure française avec « à » rend naturellement la construction, tout en signalant en note l’autre interprétation ancienne et possible.
- source_word: בַּת צִיּוֹן
  choice: la fille de Sion
  rationale: Cette expression française traditionnelle et intelligible conserve la personnification prophétique de Sion sans ajouter d’explication au corps du verset.
- source_word: adjectifs féminins substantivés implicites
  choice: une femme
  rationale: Le français demande ici un support nominal pour exprimer clairement la comparaison. « Femme » respecte le féminin des adjectifs sans ajouter l’idée de jeunesse qu’impliquerait « jeune fille ».
theological_decisions:
- issue: Sens du verbe central דָּמִיתִי
  choice: Le locuteur compare la fille de Sion à une femme belle et délicate.
  alternative: « Je détruirai la fille de Sion, la belle et délicate » ou « Je réduirai au silence la fille de Sion, la belle et délicate ».
  rationale: Le sens de comparaison lié à דמה s’accorde naturellement avec les deux adjectifs féminins. Toutefois, le texte hébreu est difficile et permet une analyse donnant au verbe un sens de destruction ou de réduction au silence; cette tension est donc conservée dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image poétique et la personnification de Sion, tandis que la note présente sans la trancher l’importante ambiguïté du verbe hébreu.
