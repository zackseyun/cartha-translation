source:
  edition: WLC
  text: כֻּלָּ/ם֙ סָרֵ֣י סֽוֹרְרִ֔ים הֹלְכֵ֥י רָכִ֖יל נְחֹ֣שֶׁת וּ/בַרְזֶ֑ל כֻּלָּ֥/ם מַשְׁחִיתִ֖ים הֵֽמָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/028.yaml
  text: All of them are the most stubborn rebels[a], going about as slanderers; they are bronze and iron[d][c][b]; all of them are corrupters.
translation:
  language: fr
  text: Ils sont tous des rebelles endurcis[a], qui vont partout colporter la médisance[b]. Ils sont de bronze et de fer[c] ; tous causent la corruption[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, de façon peu idiomatique : « des rebelles de rebelles » ; l’expression hébraïque est intensive. Autre traduction possible : « les pires des rebelles ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « répandre la calomnie », « colporter des racontars » ou « répandre la médisance ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’expression « bronze et fer » est probablement imagée : elle peut évoquer leur dureté ou, dans le contexte de l’affinage, la présence de métaux communs mêlés au minerai.'
    reason: cultural_note
  - marker: d
    text: 'Ou : « tous causent la ruine » ou « tous sont des destructeurs » ; le terme hébreu peut exprimer la corruption aussi bien que la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Ils sont tous / tous
  rationale: La répétition de כֻּלָּם encadre l’accusation et souligne qu’aucun membre du groupe n’est excepté.
- source_word: סָרֵי סוֹרְרִים
  choice: des rebelles endurcis
  rationale: L’expression hébraïque est intensive, littéralement proche de « rebelles parmi les rebelles ». « Rebelles endurcis » en restitue naturellement la force sans imposer l’idée hiérarchique de « chefs ».
- source_word: הֹלְכֵי רָכִיל
  choice: qui vont partout répandre la calomnie
  rationale: Le participe exprime une conduite habituelle. רָכִיל peut désigner la médisance, les racontars ou la calomnie ; cette formulation conserve le mouvement et la portée nuisible de leur parole.
- source_word: נְחֹשֶׁת וּבַרְזֶל
  choice: de bronze et de fer
  rationale: Traduction directe de l’image métallurgique. נְחֹשֶׁת peut désigner le cuivre ou le bronze ; « bronze » convient à l’association traditionnelle avec le fer et au contexte de l’épreuve du métal.
- source_word: מַשְׁחִיתִים
  choice: sèment la corruption
  rationale: Le participe hiphil de שׁחת décrit ceux qui causent corruption ou ruine. La tournure verbale est plus idiomatique en français que « corrupteurs », tout en préservant le rôle actif.
- source_word: הֵמָּה
  choice: ils sont
  rationale: Le pronom explicite renforce l’identification finale ; en français, cette insistance est portée par la proposition autonome et la reprise de « tous ».
