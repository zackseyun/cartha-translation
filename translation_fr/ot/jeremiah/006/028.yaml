  source_fidelity: La structure accusatrice et la répétition de « tous » reflètent bien כֻּלָּם. « Des rebelles endurcis » rend de façon naturelle l’intensité de סָרֵי סוֹרְרִים. L’image « de bronze et de fer » est conservée sans en fixer indûment le sens. En revanche, « sèment la corruption » introduit une métaphore absente de מַשְׁחִיתִים et atténue la désignation participiale de personnes qui causent effectivement ruine ou corruption.
  naturalness: Le français est clair, moderne et d’un registre approprié. « Qui vont partout répandre la calomnie » est compréhensible, mais « colporter la médisance » est plus proche du champ de רָכִיל, qui peut viser le commérage malveillant ou la délation sans exiger la fausseté spécifique que suppose parfois « calomnie ».
  terminology: '« Bronze et fer » est approprié. La note sur l’image métallurgique maintient avec justesse son caractère probable et non certain. La note a doit éviter de présenter « parmi les rebelles » comme une formulation littérale : le tour hébreu est plus exactement, quoique de façon peu idiomatique, « rebelles de rebelles ».'
