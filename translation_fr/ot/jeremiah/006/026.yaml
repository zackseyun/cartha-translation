source:
  edition: WLC
  text: בַּת עַמִּ֤/י חִגְרִי שָׂק֙ וְ/הִתְפַּלְּשִׁ֣י בָ/אֵ֔פֶר אֵ֤בֶל יָחִיד֙ עֲשִׂ֣י לָ֔/ךְ מִסְפַּ֖ד תַּמְרוּרִ֑ים כִּ֣י פִתְאֹ֔ם יָבֹ֥א הַ/שֹּׁדֵ֖ד עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/026.yaml
  text: Daughter of my people[a], put on sackcloth and roll in ashes; make mourning as for an only son, a most bitter lamentation[c][b], for suddenly the destroyer will come upon us.
translation:
  language: fr
  text: Fille de mon peuple, ceins-toi d’un sac et roule-toi dans la cendre[a] ! Prends le deuil comme pour un fils unique[b], livre-toi à des lamentations très amères, car le dévastateur viendra soudain sur nous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vautre-toi dans la cendre » ou « couvre-toi de cendre ». Le verbe hébreu évoque un geste physique de deuil accompli dans la cendre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un deuil d’unique » ; dans ce contexte, il s’agit du deuil éprouvé pour un fils unique.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte « sur nous ». Le prophète s’inclut ainsi parmi le peuple, tandis que certaines traductions harmonisent la phrase en mettant « sur toi » ou « contre vous ».
    reason: alternative_reading
lexical_decisions:
- source_word: בַּת עַמִּי
  choice: Fille de mon peuple
  rationale: Conserve l’apostrophe et la personnification prophétique du peuple sous les traits d’une fille.
- source_word: חִגְרִי שָׂק
  choice: revêts-toi d’un sac
  rationale: Exprime naturellement l’action de se ceindre d’une toile de sac en signe de deuil, tout en restant proche de l’image hébraïque.
- source_word: וְהִתְפַּלְּשִׁי בָאֵפֶר
  choice: et roule-toi dans la cendre
  rationale: Le hitpael évoque un geste physique intense consistant à se rouler ou à se vautrer dans la cendre en signe de deuil.
- source_word: אֵבֶל יָחִיד
  choice: le deuil comme pour un fils unique
  rationale: Dans ce contexte funéraire, יָחִיד désigne idiomatiquement un enfant unique, vraisemblablement un fils unique, image d’un deuil extrême.
- source_word: עֲשִׂי לָךְ
  choice: Prends le deuil
  rationale: Rend l’impératif avec son orientation réflexive de manière idiomatique en français, sans reproduire lourdement « pour toi-même ».
- source_word: מִסְפַּד תַּמְרוּרִים
  choice: livre-toi à des lamentations très amères
  rationale: מִסְפַּד désigne les lamentations ou les cris funèbres, tandis que le pluriel תַּמְרוּרִים en souligne l’extrême amertume.
- source_word: כִּי פִתְאֹם
  choice: car ... soudain
  rationale: Préserve à la fois le lien causal et la soudaineté de l’arrivée annoncée.
- source_word: הַשֹּׁדֵד
  choice: le dévastateur
  rationale: Le participe désigne celui qui ravage, pille et détruit; « dévastateur » conserve cette portée sans la réduire au seul pillage.
- source_word: עָלֵינוּ
  choice: sur nous
  rationale: Conserve explicitement la première personne du pluriel et l’identification du prophète au peuple menacé.
theological_decisions:
- issue: Passage de l’adresse à la deuxième personne féminine à la première personne du pluriel
  choice: Conserver « Fille de mon peuple ... sur nous »
  alternative: Harmoniser en « sur toi » ou « contre vous »
  rationale: Le texte hébreu passe réellement de l’apostrophe adressée au peuple personnifié à une formulation où le prophète s’inclut avec lui. Cette tension rhétorique ne doit pas être effacée.
translation_notes:
  register: Français international moderne, digne et imagé. Les impératifs gardent l’intensité du discours prophétique; « sac », « cendre », « fils unique » et « dévastateur » préservent les images concrètes du texte. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
