base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/020.yaml
  text: 'Why is this to me: frankincense comes from Sheba[a], and sweet cane from a distant land? Your burnt offerings are not acceptable[b], and your sacrifices do not please me.'
translation:
  language: fr
  text: Que m’importe l’oliban qui vient de Saba et le roseau aromatique d’un pays lointain ? Vos holocaustes ne sont pas acceptés, et vos sacrifices ne me plaisent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה זֶּה לִי
  choice: À quoi me sert
  rationale: 'Rend naturellement en français la question rhétorique et le datif לִי, avec le sens contextuel : « quelle utilité cela a-t-il pour moi ? »'
- source_word: לְבוֹנָה
  choice: encens
  rationale: Dans l’usage biblique français, « encens » désigne naturellement ici la résine aromatique appelée plus précisément oliban; le contexte d’importation évite le sens général d’une fumigation.
- source_word: מִשְּׁבָא
  choice: de Saba
  rationale: Forme française traditionnelle et largement reconnue du nom géographique שְׁבָא.
- source_word: תָבֹוא
  choice: arrive
  rationale: Le verbe exprime ici l’acheminement du produit importé; « arrive » convient à la question rhétorique et reste proche du sens verbal.
- source_word: קָנֶה הַטּוֹב
  choice: le roseau aromatique
  rationale: קָנֶה est un roseau ou une tige; avec הַטּוֹב, l’expression désigne vraisemblablement une plante aromatique recherchée. Cette formulation est claire sans imposer l’identification botanique plus technique « calamus ».
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: d’un pays lointain
  rationale: Reproduit simplement l’accent géographique sur l’origine éloignée.
- source_word: עֹלוֹתֵיכֶם
  choice: vos holocaustes
  rationale: « Holocauste » est le terme cultuel français précis pour l’offrande entièrement brûlée désignée par עֹלָה.
- source_word: לֹא לְרָצוֹן
  choice: ne me sont pas agréables
  rationale: Exprime l’absence d’agrément ou d’acceptation divine tout en conservant la nuance cultuelle de רָצוֹן.
- source_word: זִבְחֵיכֶם
  choice: vos sacrifices
  rationale: Équivalent français courant et suffisamment large du terme sacrificiel זֶבַח.
- source_word: לֹא עָרְבוּ לִי
  choice: ne me plaisent pas
  rationale: Rend idiomatiquement le sens d’être agréable ou plaisant à quelqu’un, sans conserver artificiellement l’image possible de douceur.
theological_decisions:
- issue: Rejet divin des biens cultuels importés et des sacrifices
  choice: La parole est rendue comme une question rhétorique suivie du rejet explicite des holocaustes et des sacrifices.
  alternative: Une traduction plus littérale, « Pourquoi ceci pour moi ? », laisserait davantage au lecteur le soin d’inférer l’idée d’inutilité.
  rationale: Le contexte syntaxique et la suite du verset montrent que Dieu récuse la valeur de ces dons pour lui. La formulation française explicite l’effet pragmatique sans ajouter la raison morale donnée dans le contexte plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le contraste entre la grande valeur des produits importés et leur absence d’agrément devant Dieu. Aucun marqueur de note n’est requis puisque le projet ne retient ici aucune note.
