  text: כֶּ֣סֶף נִמְאָ֔ס קָרְא֖וּ לָ/הֶ֑ם כִּֽי מָאַ֥ס יְהוָ֖ה בָּ/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/030.yaml
  text: They call them rejected silver[a], because Yahweh has rejected them.
translation:
  language: fr
  text: On les appelle « argent rejeté »[a], car Yahweh les a rejetés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « argent de rebut » ou « argent méprisé ». L’hébreu emploie l’image du raffinage : le métal éprouvé est jugé sans valeur.'
    reason: Alternative lexicale et explicitation de la métaphore métallurgique.
lexical_decisions:
- source_word: כֶּסֶף
  choice: argent
  rationale: Dans le contexte du raffinage, le nom désigne le métal précieux, non la monnaie. « Argent » conserve naturellement cette image en français.
- source_word: נִמְאָס
  choice: rejeté
  rationale: Le participe passif de מאס exprime ce qui a été refusé ou jugé sans valeur. « Rejeté » est clair et permet de reproduire la répétition du même radical dans la seconde proposition.
- source_word: קָרְאוּ לָהֶם
  choice: On les appelle
  rationale: Le verbe à la troisième personne du pluriel a ici un sujet non précisé et introduit une désignation. Le pronom indéfini « on » rend cet emploi avec naturel sans inventer de sujet déterminé.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de cette appellation. « Car » exprime nettement ce rapport causal dans un registre biblique actuel et digne.
- source_word: מָאַס
  choice: a rejetés
  rationale: 'La reprise de « rejeter », déjà employé pour נִמְאָס, conserve le jeu verbal intentionnel : ils sont un argent « rejeté » parce que Yahweh les a « rejetés ».'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à sa forme personnelle dans le texte source.
- source_word: בָּהֶם
  choice: les
  rationale: Avec מאס, la préposition introduit idiomatiquement l'objet du rejet. En français, le complément d'objet direct « les » est la tournure naturelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Portée du rejet
  choice: Conserver la formulation directe « Yahweh les a rejetés »
  alternative: Expliciter le rejet comme provisoire, définitif ou limité à une catégorie particulière
  rationale: Le verset affirme le rejet au moyen de la métaphore du raffinage, sans en préciser ici la durée ni développer ses implications théologiques. La traduction ne tranche donc pas au-delà du texte.
translation_notes:
  register: Français international moderne, sobre et digne. « On les appelle » rend naturellement le sujet indéfini du pluriel hébreu. La répétition « rejeté / rejetés » est volontaire afin de préserver l’écho lexical du texte source.
