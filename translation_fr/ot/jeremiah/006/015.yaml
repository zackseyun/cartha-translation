  text: הֹבִ֕ישׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵב֗וֹשׁוּ גַּם הַכְלִים֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֧וּ בַ/נֹּפְלִ֛ים בְּ/עֵת פְּקַדְתִּ֥י/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/015.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time I punish them, they will stumble, says Yahweh.
translation:
  language: fr
  text: Ont-ils eu honte d’avoir commis une abomination ? Pas du tout ! Ils n’ont pas honte du tout ; ils ne savent même pas rougir. C’est pourquoi ils tomberont parmi ceux qui tombent ; quand j’interviendrai contre eux[a], ils trébucheront, déclare Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand je les punirai » ou « quand je leur demanderai des comptes ». Le verbe hébreu peut signifier « visiter » ou « s’occuper de » quelqu’un ; ici, il désigne une intervention punitive.'
    reason: alternative lexicale
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: Ont-ils eu honte
  rationale: Le parfait est compris, selon le contexte immédiat, comme une question rhétorique à laquelle les deux propositions suivantes apportent une réponse négative.
- source_word: תוֹעֵבָה
  choice: une abomination
  rationale: Ce terme fort conserve la portée morale et cultuelle de l’hébreu prophétique sans l’atténuer.
- source_word: גַּם בּוֹשׁ לֹא יֵבוֹשׁוּ
  choice: Ils n’ont éprouvé aucune honte
  rationale: La tournure intensive hébraïque est rendue par une négation totale, naturelle en français.
- source_word: גַּם הַכְלִים לֹא יָדָעוּ
  choice: ils ne savent même pas rougir
  rationale: « Rougir » exprime naturellement la manifestation visible de la honte, tandis que « même » restitue l’emphase de גַּם.
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: ils tomberont parmi ceux qui tombent
  rationale: Cette formulation préserve la répétition poétique de la racine נפל et laisse ouverte l’image précise du groupe auquel ils se joignent.
- source_word: בְּעֵת פְּקַדְתִּים
  choice: quand j’interviendrai contre eux
  rationale: Dans ce contexte de jugement, פקד désigne une intervention punitive. La formulation française en communique la direction hostile sans réduire le verbe à une seule nuance lexicale.
- source_word: יִכָּשְׁלוּ
  choice: ils trébucheront
  rationale: Le sens direct maintient le parallélisme imagé avec « tomberont ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle représente le nom divin plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Valeur de פקד dans une annonce de jugement
  choice: j’interviendrai contre eux
  alternative: je les punirai / je leur demanderai des comptes
  rationale: Le contexte impose une intervention judiciaire, mais le choix principal préserve une partie de l’étendue sémantique du verbe hébreu ; la note indique les équivalents plus explicites.
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur / l’Éternel
  rationale: Le texte source emploie un nom propre. Le conserver évite de le transformer silencieusement en titre.
translation_notes:
  register: Français international actuel, clair et digne. La répétition « tomberont parmi ceux qui tombent » est volontairement conservée pour reproduire le jeu verbal hébreu. « Pas du tout ! » rend explicitement la réponse implicite à la question rhétorique, comme l’exigent les propositions négatives qui suivent.
