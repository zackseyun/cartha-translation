  text: I have made you a tester among my people[a], a fortress[b], so that you may know and test their way.
translation:
  language: fr
  text: Je t’ai établi comme examinateur parmi mon peuple[a], comme une forteresse, afin que tu discernes et que tu mettes à l’épreuve leur conduite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je t’ai établi comme essayeur parmi mon peuple, comme une forteresse ». L’hébreu est concis et difficile. « Essayeur » souligne l’image du contrôle des métaux présente dans le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחוֹן
  choice: celui qui éprouve
  rationale: Le nom désigne ici vraisemblablement quelqu’un qui examine la qualité d’un métal. Cette formulation conserve le lien avec le verbe « éprouver » tout en restant plus accessible que « essayeur ».
- source_word: נְתַתִּיךָ
  choice: Je t’ai établi
  rationale: Dans cette construction de nomination, נתן signifie mettre ou assigner quelqu’un à une fonction; « établir » est naturel et fidèle.
- source_word: בְעַמִּי
  choice: mon peuple
  rationale: Avec le rôle d’examinateur, la préposition ב peut indiquer le groupe soumis à l’examen. La construction française « éprouver mon peuple » rend ce rapport naturellement, tout en laissant la difficulté signalée en note.
- source_word: מִבְצָר
  choice: comme une forteresse
  rationale: Le texte massorétique porte le nom concret « forteresse » ou « place forte ». La comparaison explicite évite une juxtaposition française obscure sans effacer la métaphore.
- source_word: וְתֵדַע
  choice: afin que tu discernes
  rationale: L’imparfait coordonné peut exprimer le but de l’établissement. « Discerner » convient à l’examen moral visé et distingue ce verbe de בחן.
- source_word: וּבָחַנְתָּ
  choice: et éprouves
  rationale: « Éprouver » reprend la racine בחן du nom initial et convient à l’image métallurgique du contexte.
- source_word: דַּרְכָּם
  choice: sa conduite
  rationale: דרך désigne ici figurativement la manière de vivre du peuple. Le singulier collectif « sa » reprend naturellement « mon peuple » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la racine בחן est conservé par « celui qui éprouve / éprouves ». La métaphore difficile de la « forteresse » est maintenue plutôt qu’interprétée ou corrigée.
