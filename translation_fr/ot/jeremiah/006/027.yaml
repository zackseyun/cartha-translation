  source_fidelity: La formulation principale omet le sens spatial/social de בְּעַמִּי (« parmi/au milieu de mon peuple ») en faisant de « mon peuple » l’objet direct de « éprouve ». Le texte hébreu, difficile et compact, présente Jérémie comme un examinateur placé parmi le peuple et comme une forteresse; la proposition révisée conserve ces deux éléments. « Leur conduite » rend correctement דַּרְכָּם dans son sens figuré, et « afin que » est une lecture contextuellement défendable de la coordination עם l’imparfait.
  naturalness: « Examinateur parmi mon peuple » est clair en français international moderne, sans recourir au terme technique moins courant « essayeur ». « Mettre à l’épreuve leur conduite » est naturel et évite l’ambiguïté fréquente de « éprouver », qui peut évoquer la souffrance plutôt que l’examen.
  terminology: « Examinateur » et « mettre à l’épreuve » conservent le champ sémantique de בחן. « Forteresse » maintient le terme concret מִבְצָר et la difficulté du texte massorétique, sans correction conjecturale. « Conduite » restitue le sens moral figuré de « voie » dans ce contexte.
