id: JER.6.11
reference: Jeremiah 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵת֩ חֲמַ֨ת יְהוָ֤ה מָלֵ֨אתִי֙ נִלְאֵ֣יתִי הָכִ֔יל שְׁפֹ֤ךְ עַל עוֹלָל֙ בַּ/ח֔וּץ וְ/עַ֛ל ס֥וֹד בַּחוּרִ֖ים יַחְדָּ֑ו כִּֽי גַם אִ֤ישׁ עִם אִשָּׁה֙ יִלָּכֵ֔דוּ זָקֵ֖ן עִם מְלֵ֥א יָמִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/011.yaml
  text: But I am full of the wrath of Yahweh[a]; I am weary of holding it in. Pour it out on the child in the street, and on the company of young men together; for both man and woman will be taken[b], the old man along with the very aged.
translation:
  language: fr
  text: Mais moi, je suis rempli de la fureur de Yahweh[a] ; je suis épuisé de la contenir. Déverse-la sur le petit enfant dans la rue et sur le groupe des jeunes gens réunis. Car l’homme comme la femme seront pris, le vieillard comme celui qui est très avancé en âge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la colère ardente de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « plein de jours », expression désignant une personne très âgée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת יְהוָה
  choice: la fureur de Yahweh
  rationale: חֵמָה désigne une colère ardente et intense. « Fureur » conserve cette force dans le contexte du jugement prophétique, tandis que le nom divin יְהוָה est transcrit « Yahweh ».
- source_word: מָלֵאתִי
  choice: je suis rempli de
  rationale: Le parfait décrit ici l’état présent du prophète, qui se trouve rempli de la fureur divine.
- source_word: נִלְאֵיתִי הָכִיל
  choice: je suis épuisé de la contenir
  rationale: נלא exprime la lassitude poussée jusqu’à l’épuisement, et כול évoque l’action de contenir ou retenir. Le pronom féminin reprend naturellement « la fureur ».
- source_word: שְׁפֹךְ
  choice: Déverse-la
  rationale: L’impératif prolonge l’image d’une fureur contenue qui doit maintenant être répandue. L’objet implicite est explicité par le pronom.
- source_word: עוֹלָל בַּחוּץ
  choice: le petit enfant dans la rue
  rationale: עוֹלָל désigne un très jeune enfant, et חוּץ l’espace public extérieur, ici la rue. Le singulier générique de l’hébreu est conservé.
- source_word: סוֹד בַּחוּרִים יַחְדָּו
  choice: le groupe des jeunes gens réunis
  rationale: סוֹד peut désigner un cercle ou un groupe assemblé. « Groupe » évite de suggérer un conseil officiel, et « réunis » rend la valeur de יַחְדָּו sans lourdeur.
- source_word: יִלָּכֵדוּ
  choice: seront pris
  rationale: Le niphal de לכד signifie être pris, saisi ou capturé. « Seront pris » laisse ouverte la nuance précise du jugement.
- source_word: אִישׁ עִם אִשָּׁה
  choice: l’homme comme la femme
  rationale: La paire est générique et inclut les deux sexes sans imposer le sens de « mari et femme ».
- source_word: זָקֵן עִם מְלֵא יָמִים
  choice: le vieillard comme celui qui est très avancé en âge
  rationale: מְלֵא יָמִים signifie littéralement « plein de jours » et désigne une personne parvenue à un âge très avancé. La formulation distingue le vieillard de l’homme extrêmement âgé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: La transcription « Yahweh » rend directement le nom propre de l’alliance présent dans le texte hébreu, sans le remplacer par un titre.
- issue: Identité du locuteur et force de שְׁפֹךְ
  choice: Le prophète dit qu’il est rempli de la fureur de Yahweh, puis l’impératif « Déverse-la » est conservé sans identifier explicitement celui à qui il s’adresse.
  alternative: Comprendre la seconde phrase comme une parole directe de Yahweh ou comme l’annonce par le prophète de sa propre action.
  rationale: La séquence hébraïque est concise et permet plusieurs analyses de la transition de voix. La traduction préserve l’impératif et l’ambiguïté du destinataire au lieu de la résoudre dans le corps du texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les reprises pronominales rendent l’image de la fureur contenue puis déversée. La ponctuation conserve la tension et la brusque transition de l’hébreu.
