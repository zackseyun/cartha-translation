  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָסַ֤בּוּ בָֽתֵּי/הֶם֙ לַ/אֲחֵרִ֔ים שָׂד֥וֹת וְ/נָשִׁ֖ים יַחְדָּ֑ו כִּֽי אַטֶּ֧ה אֶת יָדִ֛/י עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/012.yaml
  text: Their houses will be turned over to others[a], together with their fields and wives; for I will stretch out my hand against the inhabitants of the land[b], declares Yahweh.
translation:
  language: fr
  text: Leurs maisons passeront à d’autres, ainsi que leurs champs et leurs femmes[a]. Car j’étendrai ma main contre les habitants du pays[b] — oracle de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épouses ». Le mot hébreu נָשִׁים peut avoir les deux sens ; dans ce contexte de perte des biens et du foyer, « épouses » est probablement visé.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la terre ». Le mot hébreu הָאָרֶץ peut désigner le pays ou la terre ; le contexte favorise ici le sens local.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָסַבּוּ
  choice: passeront à
  rationale: Le nifal de סבב exprime ici le changement de détenteur des biens. « Passeront à » est naturel en français et rend clairement la dépossession sans introduire l’idée littérale inadéquate de rotation.
- source_word: בָתֵּיהֶם לַאֲחֵרִים
  choice: leurs maisons passeront à d’autres
  rationale: Cette formulation conserve les éléments explicites du texte hébreu et exprime simplement le transfert des maisons à d’autres personnes.
- source_word: שָׂדוֹת וְנָשִׁים
  choice: leurs champs et leurs femmes
  rationale: « Champs » désigne naturellement les terres agricoles. En français, « femmes » peut signifier aussi bien les femmes que les épouses, ce qui préserve opportunément l’ambiguïté lexicale de נָשִׁים.
- source_word: יַחְדָּו
  choice: tout ensemble
  rationale: L’expression souligne que maisons, champs et femmes sont tous concernés par la même dépossession.
- source_word: כִּי אַטֶּה אֶת־יָדִי עַל
  choice: Car j’étendrai ma main contre
  rationale: La tournure conserve l’image hébraïque traditionnelle d’une intervention active et hostile de Dieu, tandis que « car » maintient le lien explicatif.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Dans le contexte immédiat du jugement de Juda, le sens local de אֶרֶץ est le plus probable, sans exclure lexicalement le sens plus large de « terre ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule garde le caractère solennel de la formule prophétique נְאֻם et rend directement le nom divin יהוה par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de הָאָרֶץ
  choice: du pays
  alternative: de la terre
  rationale: Le contexte annonce le jugement des habitants de Juda et favorise donc le sens local, tout en signalant en note l’autre valeur possible du mot hébreu.
- issue: Sens de נָשִׁים
  choice: femmes
  alternative: épouses
  rationale: Le mot hébreu peut désigner des femmes ou des épouses. Le français « femmes » conserve cette tension lexicale, même si le contexte domestique rend le sens « épouses » probable.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la structure hébraïque tout en étant idiomatique. « Femmes » préserve naturellement l’ambiguïté de l’original, et « déclaration de Yahweh » maintient la solennité de la formule prophétique.
