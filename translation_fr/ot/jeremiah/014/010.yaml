source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/עָ֣ם הַ/זֶּ֗ה כֵּ֤ן אָֽהֲבוּ֙ לָ/נ֔וּעַ רַגְלֵי/הֶ֖ם לֹ֣א חָשָׂ֑כוּ וַ/יהוָה֙ לֹ֣א רָצָ֔/ם עַתָּה֙ יִזְכֹּ֣ר עֲוֺנָ֔/ם וְ/יִפְקֹ֖ד חַטֹּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/010.yaml
  text: 'Thus says Yahweh concerning this people: Thus they have loved to wander[a]; they have not restrained their feet. Therefore Yahweh does not accept them[c][b]. Now he will remember their iniquity and punish their sins.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh au sujet de ce peuple : Ainsi ils aiment à vagabonder[a] ; ils ne retiennent pas leurs pas. C’est pourquoi Yahweh ne les accepte pas[b]. Maintenant, il se souviendra de leur faute et leur demandera compte de leurs péchés[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « errer » ou « rôder ». Le verbe peut évoquer aussi bien le déplacement continuel que l’égarement moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne prend pas plaisir en eux » ou « ne les agrée pas ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il visitera leurs péchés », expression hébraïque signifiant ici qu’il leur en demandera compte dans son jugement.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לָעָם הַזֶּה
  choice: au sujet de ce peuple
  rationale: La préposition introduit ici le peuple concerné par la déclaration divine; cette formulation est naturelle en français.
- source_word: כֵּן אָהֲבוּ לָנוּעַ
  choice: Ils ont tant aimé vagabonder
  rationale: Dans ce contexte, כֵּן peut souligner la manière ou le degré; « tant… que » rend naturellement son lien avec la proposition suivante, tandis que « aimer vagabonder » conserve la préférence volontaire exprimée par אָהַב suivi de l’infinitif.
- source_word: רַגְלֵיהֶם לֹא חָשָׂכוּ
  choice: ils n’ont pas retenu leurs pas
  rationale: Cette traduction préserve l’image corporelle des pieds tout en employant une expression française claire pour une conduite sans retenue.
- source_word: לֹא רָצָם
  choice: ne les accueille pas favorablement
  rationale: רצה exprime ici l’acceptation favorable; cette formulation garde la dimension relationnelle sans réduire le terme à un simple sentiment de plaisir.
- source_word: יִזְכֹּר עֲוֺנָם
  choice: il se souviendra de leur faute
  rationale: « Se souvenir » conserve l’image judiciaire du texte; « faute » rend עָוֺן dans un français courant tout en le distinguant des « péchés » qui suivent.
- source_word: וְיִפְקֹד חַטֹּאתָם
  choice: leur demandera compte de leurs péchés
  rationale: Dans ce contexte de jugement, פקד signifie intervenir pour appeler les péchés en jugement. Cette expression française rend la portée judiciaire sans ajouter un châtiment précis que le verset ne décrit pas.
theological_decisions:
- issue: Portée de רצה dans le refus divin
  choice: Yahweh ne les accueille pas favorablement
  alternative: Yahweh ne prend pas plaisir en eux
  rationale: Le choix principal préserve l’idée d’approbation ou d’acceptation divine sans la ramener exclusivement à une émotion.
- issue: Langage du jugement dans וְיִפְקֹד חַטֹּאתָם
  choice: leur demandera compte de leurs péchés
  alternative: punira leurs péchés
  rationale: Le contexte est clairement judiciaire, mais פקד conserve une certaine amplitude sémantique. « Demander compte » exprime la mise en jugement sans préciser davantage la forme de la sanction.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « tant… que » évite la répétition raide de « ainsi » tout en reliant l’attachement du peuple à l’errance et l’absence de retenue. Les images de la marche et du souvenir divin sont conservées, et l’idiome judiciaire final est rendu clairement avec une note littérale.
