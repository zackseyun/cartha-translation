source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שֶׁ֚קֶר הַ/נְּבִאִים֙ נִבְּאִ֣ים בִּ/שְׁמִ֔/י לֹ֤א שְׁלַחְתִּי/ם֙ וְ/לֹ֣א צִוִּיתִ֔י/ם וְ/לֹ֥א דִבַּ֖רְתִּי אֲלֵי/הֶ֑ם חֲז֨וֹן שֶׁ֜קֶר וְ/קֶ֤סֶם ו/אלול ו/תרמות לִבָּ֔/ם הֵ֖מָּה מִֽתְנַבְּאִ֥ים לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/014.yaml
  text: And Yahweh said to me[a], “The prophets are prophesying lies in my name. I did not send them, nor did I command them, nor did I speak to them. They are prophesying to you a false vision, divination, emptiness, and the deceit of their own heart.”
translation:
  language: fr
  text: 'Et Yahvé me dit : « Les prophètes prophétisent des mensonges en mon nom. Je ne les ai pas envoyés, je ne leur ai donné aucun ordre et je ne leur ai pas parlé. Ce qu’ils vous prophétisent, ce sont une vision mensongère, de la divination, du néant[a] et la tromperie de leur propre cœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une chose sans valeur », voire « une idole » ; le mot hébreu peut porter ces sens selon le contexte.
    reason: Alternative lexicale liée à la polysémie de אֱלִיל.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française traditionnelle et reconnaissable du nom divin, qui le rend comme un nom propre plutôt que de le remplacer par un titre.
- source_word: שֶׁקֶר / חֲזוֹן שֶׁקֶר
  choice: des mensonges / une vision mensongère
  rationale: Le nom désigne la fausseté ou la tromperie. La variation française respecte les deux constructions et reste naturelle.
- source_word: הַנְּבִאִים נִבְּאִים
  choice: les prophètes prophétisent
  rationale: Conserve la répétition étymologique de l’hébreu tout en restant intelligible en français.
- source_word: בִּשְׁמִי
  choice: en mon nom
  rationale: Expression française courante qui préserve la prétention à parler avec l’autorité divine.
- source_word: לֹא שְׁלַחְתִּים
  choice: je ne les ai pas envoyés
  rationale: Exprime directement l’absence de mission divine.
- source_word: וְלֹא צִוִּיתִים
  choice: je ne leur ai donné aucun ordre
  rationale: Rend naturellement l’idée d’un commandement ou d’une commission prophétique, tout en maintenant la négation.
- source_word: וְלֹא דִבַּרְתִּי אֲלֵיהֶם
  choice: je ne leur ai pas parlé
  rationale: 'Préserve le troisième élément de la triple dénégation : envoyer, ordonner et parler.'
- source_word: קֶסֶם
  choice: divination
  rationale: Terme français précis pour une pratique visant à obtenir illicitement une connaissance surnaturelle.
- source_word: אֱלִיל
  choice: néant
  rationale: Dans cette série décrivant le contenu frauduleux des prophéties, le sens de chose vaine, inconsistante ou sans valeur convient au contexte; l’ambiguïté lexicale est signalée en note.
- source_word: תַּרְמִית לִבָּם
  choice: la tromperie de leur propre cœur
  rationale: Rend l’idée d’une fraude ou illusion issue de leur intériorité et non d’une parole divine; « propre » explicite naturellement la valeur possessive.
- source_word: הֵמָּה מִתְנַבְּאִים לָכֶם
  choice: ce qu’ils vous prophétisent, ce sont
  rationale: La construction disloquée conserve l’emphase du pronom hébreu et rattache clairement toute l’énumération au contenu annoncé aux destinataires.
theological_decisions:
- issue: Origine et nature du message des faux prophètes
  choice: Le texte nie toute autorisation divine et présente leur message comme mensonger, divinatoire, vain et issu de leur propre cœur.
  alternative: On peut comprendre les éléments de la liste comme des catégories distinctes ou comme une accumulation de termes proches décrivant globalement la fausse prophétie.
  rationale: La traduction maintient l’énumération sans imposer une taxonomie technique, préservant ainsi l’ambiguïté et la force de la triple dénégation divine.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « prophètes prophétisent » est volontaire afin de refléter l’effet hébreu. La syntaxe « Ce qu’ils vous prophétisent, ce sont… » rend l’emphase finale sans alourdir excessivement la phrase.
