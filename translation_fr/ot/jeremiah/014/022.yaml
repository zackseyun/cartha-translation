source:
  edition: WLC
  text: הֲ/יֵ֨שׁ בְּ/הַבְלֵ֤י הַ/גּוֹיִם֙ מַגְשִׁמִ֔ים וְ/אִם הַ/שָּׁמַ֖יִם יִתְּנ֣וּ רְבִבִ֑ים הֲ/לֹ֨א אַתָּה ה֜וּא יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ וּ֨/נְקַוֶּה לָּ֔/ךְ כִּֽי אַתָּ֥ה עָשִׂ֖יתָ אֶת כָּל אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/022.yaml
  text: Are there any among the idols of the nations that bring rain? Or can the heavens give showers? Is it not you[a], O Yahweh our God? And we wait for you[c][b], for you have made all these things.
translation:
  language: fr
  text: Y a-t-il, parmi les idoles des nations[a], une seule qui fasse pleuvoir ? Ou le ciel peut-il donner des averses ? N’est-ce pas toi, Yahweh notre Dieu ? Et nous mettons notre espérance en toi[b], car c’est toi qui as fait tout cela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les vanités des nations » ; l’expression désigne leurs idoles ou leurs dieux sans valeur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous t’attendons avec espérance ». Le verbe hébreu exprime une attente confiante.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tu as accompli toutes ces choses ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְלֵי הַגּוֹיִם
  choice: les idoles des nations
  rationale: הֶבֶל signifie littéralement « souffle », « vapeur » ou « vanité », et désigne ici, dans la polémique prophétique, les dieux sans valeur des nations. « Idoles » explicite naturellement le référent en français.
- source_word: מַגְשִׁמִים
  choice: qui fasse pleuvoir
  rationale: La forme causative exprime l’action de produire la pluie. Cette tournure française est directe et naturelle.
- source_word: הַשָּׁמַיִם
  choice: le ciel
  rationale: Bien que le mot hébreu ait une forme plurielle, il désigne couramment le ciel. Le singulier est ici le rendu français le plus idiomatique.
- source_word: יִתְּנוּ רְבִבִים
  choice: donner des averses
  rationale: רְבִבִים désigne des ondées ou des averses. « Donner » conserve l’image du verbe hébreu נתן.
- source_word: וּנְקַוֶּה לָּךְ
  choice: Et nous mettons notre espérance en toi
  rationale: קוה associe l’attente à une espérance confiante. Cette formulation exprime cette attente confiante sans la réduire à une attente temporelle.
- source_word: עָשִׂיתָ אֶת כָּל אֵלֶּה
  choice: tu as fait tout cela
  rationale: Le verbe עשה peut signifier « faire » ou « accomplir ». « Faire » maintient en français cette latitude sémantique, tandis que « tout cela » reprend naturellement les réalités évoquées.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le nom divin. Sa translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de עָשִׂיתָ dans la conclusion
  choice: tu as fait tout cela
  alternative: tu as créé toutes ces choses / tu as accompli tout cela
  rationale: Le français « faire » conserve l’ambiguïté de l’hébreu entre l’idée de produire ou créer les réalités mentionnées et celle d’agir souverainement, sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques restent nettes, et la répétition emphatique de אַתָּה הוּא est rendue par « c’est toi » dans la dernière proposition.
