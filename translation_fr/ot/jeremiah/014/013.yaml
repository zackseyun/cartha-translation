  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה הַ/נְּבִאִ֜ים אֹמְרִ֤ים לָ/הֶם֙ לֹֽא תִרְא֣וּ חֶ֔רֶב וְ/רָעָ֖ב לֹֽא יִהְיֶ֣ה לָ/כֶ֑ם כִּֽי שְׁל֤וֹם אֱמֶת֙ אֶתֵּ֣ן לָ/כֶ֔ם בַּ/מָּק֖וֹם הַ/זֶּֽה׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/013.yaml
  text: Then I said, “Ah, Lord GOD, look, the prophets are saying to them, ‘You will not see the sword, and famine will not come upon you, for I will give you true peace in this place.’”
translation:
  language: fr
  text: 'Alors je dis : « Ah ! Seigneur DIEU ! Voici que les prophètes leur disent : “Vous ne verrez pas l’épée, la famine ne vous atteindra pas, car je vous donnerai une paix véritable en ce lieu.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Conserve l’interjection de détresse du prophète dans une forme française naturelle et solennelle.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur DIEU
  rationale: Rend le titre אֲדֹנָי et distingue le nom divin יהוה selon la convention typographique française, sans introduire une vocalisation contestée.
- source_word: הִנֵּה
  choice: Voici
  rationale: Maintient la particule qui attire vivement l’attention du Seigneur sur les paroles des prophètes.
- source_word: חֶרֶב
  choice: l’épée
  rationale: Traduction formelle de l’image biblique, qui désigne ici la guerre ou la violence armée sans effacer la métaphore.
- source_word: שְׁלוֹם אֱמֶת
  choice: une paix véritable
  rationale: Rend שָׁלוֹם par « paix » et אֱמֶת comme une qualification de réalité et de fiabilité.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Formulation française digne et directe correspondant exactement à l’indication locale.
theological_decisions:
- issue: Identité du locuteur dans la promesse citée
  choice: Conserver la première personne « je vous donnerai » dans la bouche des faux prophètes citant Dieu.
  alternative: Expliciter « Dieu vous donnera » ou signaler dans le texte qu’ils prétendent parler au nom de Dieu.
  rationale: L’hébreu passe directement à la première personne dans la citation. Cette forme préserve la prétention prophétique et l’ambiguïté rhétorique du discours rapporté.
- issue: Sens de שְׁלוֹם אֱמֶת
  choice: « une paix véritable »
  alternative: « une paix durable » ou « une paix sûre »
  rationale: « Véritable » conserve le lien lexical avec la vérité et la fiabilité, sans décider si l’accent porte surtout sur l’authenticité, la stabilité ou la durée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de discours enchâssé est conservée avec des guillemets distincts. « Chez vous » traduit naturellement לָכֶם dans la proposition existentielle sur la famine, tandis que « au contraire » rend la valeur contrastive de כִּי dans ce contexte.
