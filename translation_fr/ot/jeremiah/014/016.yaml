  terminology: « Famine », « épée », « ensevelir » et « déverser » correspondent bien au registre et aux images du texte. « Leur mal » préserve utilement l’ambiguïté de רָעָתָם entre mal moral et malheur/jugement subi; la note doit conserver ces possibilités sans les trancher.
