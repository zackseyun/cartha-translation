  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : les destinataires de la prophétie sont livrés à la famine et à l’épée, restent sans sépulture avec leurs familles, puis Dieu annonce qu’il déversera sur eux leur רָעָה. Toutefois, « ses membres » n’est pas présent dans l’hébreu et transforme inutilement le collectif en une formulation explicative.'
