  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ/עָ֣ם אֲשֶׁר הֵ֣מָּה נִבְּאִ֣ים לָ/הֶ֡ם יִֽהְי֣וּ מֻשְׁלָכִים֩ בְּ/חֻצ֨וֹת יְרוּשָׁלִַ֜ם מִ/פְּנֵ֣י הָ/רָעָ֣ב וְ/הַ/חֶ֗רֶב וְ/אֵ֤ין מְקַבֵּר֙ לָ/הֵ֔מָּה הֵ֣מָּה נְשֵׁי/הֶ֔ם וּ/בְנֵי/הֶ֖ם וּ/בְנֹֽתֵי/הֶ֑ם וְ/שָׁפַכְתִּ֥י עֲלֵי/הֶ֖ם אֶת רָעָתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/016.yaml
  text: And the people to whom they are prophesying will be thrown out into the streets of Jerusalem because of the famine and the sword[a], with no one to bury them—them, their wives, their sons, and their daughters. And I will pour out on them their evil.
translation:
  language: fr
  text: Les gens auxquels ils prophétisent seront jetés dans les rues de Jérusalem à cause de la famine et de l’épée[a], sans personne pour les ensevelir — eux, leurs femmes, leurs fils et leurs filles. Je déverserai sur eux leur mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur méchanceté », ou « le malheur qui les atteint », « leur calamité ». Le terme hébreu peut désigner le mal moral ou le désastre qui en résulte.
    reason: alternative_reading
lexical_decisions:
- source_word: נִבְּאִים לָהֶם
  choice: à qui ils prophétisent
  rationale: Le participe niphal décrit ici l’activité prophétique exercée à l’adresse du peuple. Cette formulation française est naturelle et conserve le caractère continu suggéré par le contexte.
- source_word: מֻשְׁלָכִים בְּחֻצוֹת יְרוּשָׁלִַם
  choice: seront jetés dans les rues de Jérusalem
  rationale: Le participe hophal exprime le fait d’être jeté; les « rues » ou places ouvertes sont le lieu où les corps resteront exposés sans sépulture.
- source_word: מִפְּנֵי הָרָעָב וְהַחֶרֶב
  choice: à cause de la famine et de l’épée
  rationale: מִפְּנֵי a ici une valeur causale. « L’épée » préserve l’image concrète hébraïque plutôt que de l’interpréter simplement comme la guerre.
- source_word: וְאֵין מְקַבֵּר לָהֵמָּה
  choice: sans personne pour les ensevelir
  rationale: La construction existentielle avec le participe indique qu’il ne se trouvera personne pour assurer leur sépulture. « Ensevelir » convient au contexte funéraire.
- source_word: הֵמָּה נְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם
  choice: eux, leurs femmes, leurs fils et leurs filles
  rationale: Le pronom repris avec insistance est conservé avant l’énumération de tous ceux qui resteront sans sépulture.
- source_word: וְשָׁפַכְתִּי עֲלֵיהֶם
  choice: Je déverserai sur eux
  rationale: La métaphore de שׁפך est conservée, car elle porte la force rhétorique de l’annonce du jugement.
- source_word: אֶת רָעָתָם
  choice: leur mal
  rationale: רָעָה peut désigner leur mal moral aussi bien que le malheur qui leur revient. La formulation littérale maintient cette ambiguïté, explicitée en note.
theological_decisions:
- issue: Sens de רָעָתָם dans la formule de jugement
  choice: leur mal
  alternative: leur méchanceté; le malheur qui leur revient; leur calamité
  rationale: L’hébreu peut évoquer soit leur propre mal rendu sur leur tête, soit le désastre qui les frappe. Le texte principal ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Quant au peuple… ses membres » évite l’incohérence française entre le collectif singulier « peuple » et le pluriel des personnes jetées et ensevelies. « Épée » et « déverser » maintiennent les images du texte hébreu.
