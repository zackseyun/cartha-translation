source:
  edition: WLC
  text: כִּ֣י יָצֻ֗מוּ אֵינֶ֤/נִּי שֹׁמֵ֨עַ֙ אֶל רִנָּתָ֔/ם וְ/כִ֧י יַעֲל֛וּ עֹלָ֥ה וּ/מִנְחָ֖ה אֵינֶ֣/נִּי רֹצָ֑/ם כִּ֗י בַּ/חֶ֨רֶב֙ וּ/בָ/רָעָ֣ב וּ/בַ/דֶּ֔בֶר אָנֹכִ֖י מְכַלֶּ֥ה אוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/012.yaml
  text: Though they fast[a], I do not hear their cry; and though they offer up burnt offering and grain offering, I do not accept them. Rather, by the sword, by famine[d][c][b], and by pestilence I am consuming them.
translation:
  language: fr
  text: Même s’ils jeûnent, je n’écoute pas leur cri ; et même s’ils offrent un holocauste et une offrande de céréales, je ne leur suis pas favorable. Au contraire, c’est par l’épée, par la famine et par la peste que moi, je les fais périr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יָצֻמוּ
  choice: Même s’ils jeûnent
  rationale: 'Dans ce contexte, כִּי introduit une concession : le jeûne du peuple ne change pas le refus divin. « Même si » rend clairement cette valeur sans la transformer en simple causalité.'
- source_word: אֵינֶנִּי שֹׁמֵעַ אֶל רִנָּתָם
  choice: je n’écoute pas leur cri
  rationale: La construction négative avec le participe exprime ici le refus de prêter attention. « Écouter » rend la portée relationnelle de שׁמע אֶל, tandis que « cri » conserve la largeur sémantique de רִנָּה.
- source_word: יַעֲלוּ עֹלָה וּמִנְחָה
  choice: ils offrent un holocauste et une offrande de céréales
  rationale: Le hiphil de עלה possède ici son sens sacrificiel. עֹלָה est rendu par le terme français établi « holocauste », et מִנְחָה par « offrande de céréales », précis dans ce contexte cultuel.
- source_word: אֵינֶנִּי רֹצָם
  choice: je ne les agrée pas
  rationale: רצה désigne l’accueil favorable, notamment dans un contexte sacrificiel. « Agréer » garde cette nuance et le pronom « les » préserve l’ambiguïté du référent.
- source_word: כִּי בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: Au contraire, c’est par l’épée, par la famine et par la peste
  rationale: Le dernier כִּי marque ici le contraste avec les rites rejetés. La construction clivée souligne les trois moyens du jugement et reproduit la triade traditionnelle.
- source_word: אָנֹכִי מְכַלֶּה אוֹתָם
  choice: que moi, je les anéantis
  rationale: Le pronom emphatique אָנֹכִי est conservé par « moi, je ». Le participe מְכַלֶּה présente l’action comme en cours ou arrêtée dans la volonté divine ; le présent « anéantis » évite d’en faire uniquement un événement futur.
theological_decisions:
- issue: Refus divin du jeûne et des sacrifices pendant le jugement
  choice: Le texte affirme que Dieu ne prête pas attention au cri du peuple et n’agrée pas ses offrandes, tandis qu’il exerce son jugement.
  alternative: Limiter le refus aux prières, ou présenter les rites comme capables de suspendre le jugement.
  rationale: Les deux propositions parallèles rejettent respectivement le cri associé au jeûne et les sacrifices ; la proposition finale oppose à ces rites l’action divine de jugement.
- issue: Référent du suffixe dans רֹצָם
  choice: Conserver en français un pronom pouvant renvoyer immédiatement aux sacrifices, tout en signalant qu’il peut aussi viser les personnes.
  alternative: Expliciter uniquement « je n’agrée pas leurs offrandes » ou uniquement « je ne les accueille pas favorablement ».
  rationale: Le masculin pluriel hébreu peut reprendre l’ensemble sacrificiel ou désigner les membres du peuple. Une note maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et direct. « Holocauste », « offrande de céréales » et « agréer » maintiennent le registre sacrificiel biblique sans archaïsme excessif. La répétition de « par » et l’emphase « moi, je » reflètent la solennité et l’insistance du texte hébreu.
