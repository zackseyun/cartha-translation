revisions:
- from: Même s’ils jeûnent, je n’écoute pas leur cri ; et même s’ils offrent un holocauste et une offrande de céréales, je ne les agrée pas[a]. Au contraire, c’est par l’épée, par la famine et par la peste que moi, je les anéantis.
  to: Même s’ils jeûnent, je n’écoute pas leur cri ; et même s’ils offrent un holocauste et une offrande de céréales, je ne leur suis pas favorable. Au contraire, c’est par l’épée, par la famine et par la peste que moi, je les fais périr.
  rationale: La révision corrige l'annotation du pronom afin de respecter le genre grammatical du suffixe hébreu et rend explicitement son référent le plus probable, le peuple. Elle modère aussi « anéantis » en une expression fidèle à l'idée de les consumer ou de les faire périr. Les autres choix, notamment les termes sacrificiels et la formulation concessive, sont conservés.
