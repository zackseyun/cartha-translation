  to: As-tu entièrement rejeté Juda ? Ou[a] ton âme[b] a-t-elle pris Sion en horreur ? Pourquoi nous as-tu frappés, et n’y a-t-il pour nous aucune guérison ? Nous espérions la paix, mais aucun bien ; nous attendions un temps de guérison, mais voici l’épouvante !
