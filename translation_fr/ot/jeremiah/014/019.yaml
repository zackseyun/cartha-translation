    issue: Ajout de « donc » dans la première question
    rationale: L’intensif hébreu est déjà rendu par « entièrement » ; « donc » ajoute une inférence discursive absente du texte.
  - severity: low
    issue: « sans qu’il y ait pour nous de guérison »
    rationale: L’hébreu coordonne « tu nous as frappés » et « il n’y a pas pour nous de guérison ». La formulation avec « sans que » suggère plus fortement une conséquence ou une modalité que le texte ne l’exprime.
  - severity: low
    issue: Ajout verbal dans « rien de bon n’est venu »
    rationale: Cette explicitation est intelligible, mais l’hébreu dit plus littéralement « pas de bien ». « Aucun bien » conserve mieux la concision et la généralité du terme טוב.
