base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/019.yaml
  text: Have you utterly rejected Judah? Does your soul loathe Zion? Why have you struck us so that there is no healing for us? We hoped for peace[a], but there was no good, and for a time of healing, but behold[b], terror.
translation:
  language: fr
  text: As-tu entièrement rejeté Juda ? Ou[a] ton âme[b] a-t-elle pris Sion en horreur ? Pourquoi nous as-tu frappés, et n’y a-t-il pour nous aucune guérison ? Nous espérions la paix, mais aucun bien ; nous attendions un temps de guérison, mais voici l’épouvante !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu peut introduire ici la seconde question par « ou » ; on peut aussi comprendre simplement : « Ton âme a-t-elle pris Sion en horreur ? »'
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque désignant l’être intérieur ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמָאֹס מָאַסְתָּ
  choice: As-tu donc entièrement rejeté
  rationale: L’infinitif absolu suivi du verbe de même racine intensifie l’idée de rejet. « Entièrement rejeté » rend cette insistance dans un français naturel.
- source_word: אִם
  choice: Ou
  rationale: Dans cette suite interrogative, אִם peut introduire la seconde question avec une valeur disjonctive. « Ou » fait entendre le lien entre les deux interrogations sans transformer celles-ci en affirmations.
- source_word: גָּעֲלָה נַפְשֶׁךָ
  choice: ton âme a-t-elle pris … en horreur
  rationale: געל exprime une vive répulsion. La formulation conserve aussi l’image hébraïque de נֶפֶשׁ, qui désigne ici l’être intérieur ou la personne elle-même.
- source_word: הִכִּיתָנוּ
  choice: nous as-tu frappés
  rationale: Le verbe נכה signifie concrètement « frapper ». Cette traduction préserve l’image du coup divin qui appelle une guérison.
- source_word: מַרְפֵּא
  choice: guérison
  rationale: Le même nom apparaît deux fois. « Guérison » convient aux deux occurrences et maintient la métaphore de la blessure et du rétablissement.
- source_word: קַוֵּה לְשָׁלוֹם
  choice: Nous espérions la paix
  rationale: La forme hébraïque exprime ici l’attente ou l’espoir. Le passé « espérions » rend naturellement la déception exprimée par la suite.
- source_word: טוֹב
  choice: rien de bon
  rationale: טוֹב reste général dans le texte. « Rien de bon » en conserve l’ampleur sans préciser indûment « prospérité » ou « bien-être ».
- source_word: בְעָתָה
  choice: l’épouvante
  rationale: Le nom désigne une terreur soudaine ou accablante. « Épouvante » préserve la force poétique du contraste avec la guérison espérée.
theological_decisions:
- issue: Le rejet de Juda et la répulsion envers Sion attribués à Dieu dans la lamentation
  choice: Conserver les questions directes et leur langage très fort
  alternative: Reformuler en termes de discipline temporaire ou d’abandon apparent
  rationale: Le verset présente une prière qui ose interroger Dieu au cœur du jugement. La traduction maintient cette tension théologique sans fournir une explication doctrinale absente du texte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe interrogative demeure directe, tandis que « prendre en horreur » et « épouvante » conservent l’intensité poétique de la lamentation. La répétition de « guérison » reproduit celle du texte hébreu.
