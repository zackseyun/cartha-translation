id: JER.14.21
reference: Jeremiah 14:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּנְאַץ֙ לְמַ֣עַן שִׁמְ/ךָ֔ אַל תְּנַבֵּ֖ל כִּסֵּ֣א כְבוֹדֶ֑/ךָ זְכֹ֕ר אַל תָּפֵ֥ר בְּרִֽיתְ/ךָ֖ אִתָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/021.yaml
  text: Do not spurn us for the sake of your name; do not dishonor your glorious throne[a]. Remember; do not break your covenant with us.
translation:
  language: fr
  text: Ne nous méprise pas, à cause de ton nom ; ne déshonore pas le trône de ta gloire[a]. Souviens-toi, ne romps pas ton alliance avec nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton trône glorieux ».'
    reason: Alternative française plus idiomatique pour la construction hébraïque littérale « le trône de ta gloire ».
lexical_decisions:
- source_word: תִּנְאַץ
  choice: méprise pas
  rationale: Le verbe נאץ exprime ici un rejet empreint de mépris. « Ne nous méprise pas » en conserve la force et fournit l’objet « nous », implicite dans le contexte et confirmé par la fin du verset.
- source_word: לְמַעַן שִׁמְךָ
  choice: à cause de ton nom
  rationale: L’expression fonde l’appel sur le nom de Dieu, c’est-à-dire sa réputation et son caractère. « À cause de ton nom » reste naturel tout en conservant cette portée.
- source_word: תְּנַבֵּל
  choice: déshonore pas
  rationale: Au piel, נבל signifie traiter honteusement ou couvrir de déshonneur. « Déshonorer » convient au trône et n’introduit pas nécessairement l’idée d’impureté rituelle.
- source_word: כִּסֵּא כְבוֹדֶךָ
  choice: le trône de ta gloire
  rationale: Cette formulation suit directement la construction hébraïque et maintient le lien explicite entre le trône et la gloire divine.
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: L’impératif direct garde l’urgence de la supplication et son langage d’alliance.
- source_word: תָּפֵר
  choice: romps pas
  rationale: פרר s’emploie couramment pour la rupture ou la violation d’une alliance. « Rompre une alliance » est idiomatique en français.
- source_word: בְּרִיתְךָ אִתָּנוּ
  choice: ton alliance avec nous
  rationale: La formulation traduit simplement ברית et la préposition אִתָּנוּ sans ajouter l’idée explicite de conclure l’alliance.
theological_decisions:
- issue: Référent du « trône de ta gloire »
  choice: Conserver l’expression sans préciser le référent.
  alternative: Identifier le trône au temple ou à Sion, ou au trône céleste de Dieu.
  rationale: L’hébreu peut évoquer le temple ou Sion comme lieu terrestre de la gloire divine, tout en renvoyant aussi au règne céleste de Dieu. La traduction préserve cette pluralité possible.
translation_notes:
  register: Français moderne, digne et accessible. Le rythme impératif de la supplication est maintenu. Le point-virgule distingue les deux premières demandes, puis la virgule après « Souviens-toi » rend la succession serrée des impératifs hébreux.
