    issue: La personnification est rendue par « la jeune fille, mon peuple ».
    rationale: 'Cette apposition est grammaticalement et sémantiquement insuffisante : elle omet « fille de » et remplace la désignation poétique complète par une identification directe du peuple à la jeune fille.'
  - severity: medium
    issue: « a subi un immense désastre » remplace « grande brisure est brisée ».
    rationale: Le rendu transforme une construction passive et emphatique, fondée sur un nom et un verbe de même racine, en une paraphrase événementielle. Une note seule ne compense pas entièrement cette perte dans le texte.
  - severity: low
    issue: « sans s’arrêter » absorbe la seconde proposition en subordonnée.
    rationale: La coordination « et qu’elles ne cessent pas » reproduit mieux le parallélisme du texte source et maintient clairement les yeux comme sujet.
