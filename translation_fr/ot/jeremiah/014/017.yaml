source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה תֵּרַ֨דְנָה עֵינַ֥/י דִּמְעָ֛ה לַ֥יְלָה וְ/יוֹמָ֖ם וְ/אַל תִּדְמֶ֑ינָה כִּי֩ שֶׁ֨בֶר גָּד֜וֹל נִשְׁבְּרָ֗ה בְּתוּלַת֙ בַּת עַמִּ֔/י מַכָּ֖ה נַחְלָ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/017.yaml
  text: 'And you shall say to them this word: ‘Let my eyes run down with tears night and day[a], and let them not cease, for the virgin daughter of my people is broken with a great breaking[c][b], with a very grievous wound.’'
translation:
  language: fr
  text: 'Tu leur diras cette parole : « Que mes yeux ruissellent de larmes nuit et jour, et qu’ils ne cessent pas[a], car la vierge, fille de mon peuple[b], a été brisée d’une grande brisure[c], d’une blessure très grave. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et qu’ils ne soient pas silencieux » ou « et qu’ils ne connaissent pas de repos » ; le verbe hébreu peut exprimer le fait de devenir immobile ou de cesser.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « la vierge, fille de mon peuple » ; le peuple y est poétiquement représenté comme une jeune femme.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu emploie un nom et un verbe de même racine : littéralement, « une grande brisure a été brisée », pour exprimer l’intensité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Tu leur diras
  rationale: Le parfait qal précédé de la conjonction a ici une valeur directive dans l’instruction prophétique. Le futur français exprime naturellement cet ordre solennel.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: דָּבָר désigne ici la parole ou le message à prononcer. « Cette parole » reste proche de l’hébreu et convient au registre prophétique.
- source_word: תֵּרַדְנָה עֵינַי דִּמְעָה
  choice: Que mes yeux ruissellent de larmes
  rationale: La tournure française conserve l’image vive des yeux d’où les larmes descendent, tout en étant naturelle et immédiatement compréhensible.
- source_word: לַיְלָה וְיוֹמָם
  choice: nuit et jour
  rationale: Cette expression rend naturellement le mérisme hébreu indiquant une lamentation continuelle.
- source_word: וְאַל תִּדְמֶינָה
  choice: sans s’arrêter
  rationale: Dans ce contexte, דמה signifie devenir immobile ou cesser. La formulation rattache clairement l’absence d’arrêt au ruissellement des larmes.
- source_word: שֶׁבֶר גָּדוֹל נִשְׁבְּרָה
  choice: a subi un immense désastre
  rationale: Le groupe cognat exprime avec force un effondrement, une fracture ou une catastrophe. Le français ne reproduit pas naturellement « être brisée d'une grande brisure » ; « immense désastre » communique l’intensité sans lourdeur, tandis qu’une note signale la figure hébraïque.
- source_word: בְּתוּלַת בַּת־עַמִּי
  choice: la jeune fille, mon peuple
  rationale: L’expression poétique personnifie le peuple comme une jeune femme. « Jeune fille » traduit ici בְּתוּלָה sans imposer en français une lecture principalement sexuelle du terme, et l’apposition rend la personnification intelligible.
- source_word: מַכָּה נַחְלָה מְאֹד
  choice: une blessure extrêmement grave
  rationale: מַכָּה évoque un coup ou une blessure, et נַחְלָה מְאֹד en souligne la gravité extrême, avec une possible nuance de mal incurable. La traduction conserve l’intensité sans préciser abusivement le pronostic.
theological_decisions:
- issue: Personnification exprimée par בְּתוּלַת בַּת־עַמִּי
  choice: Conserver la personnification sous la forme « la jeune fille, mon peuple »
  alternative: Paraphraser par « mon peuple, Juda » ou rendre littéralement « la vierge, fille de mon peuple »
  rationale: Le texte présente poétiquement le peuple comme une jeune femme frappée. La personnification est maintenue sans identifier plus précisément que ne le fait le verset la figure à Sion ou à Juda, et sans transformer בְּתוּלָה en affirmation doctrinale ou biologique.
- issue: Valeur de נַחְלָה appliqué à la blessure
  choice: Rendre la gravité par « extrêmement grave »
  alternative: Traduire par « incurable »
  rationale: Le mot peut suggérer une blessure maladive ou incurable, mais le contexte immédiat établit surtout sa très grande gravité. La traduction évite de trancher une nuance discutée.
translation_notes:
  register: Français international moderne, digne et poétique. Le discours direct garde la force de la lamentation prophétique. Les formulations évitent à la fois l’archaïsme de « vierge fille » et une paraphrase qui effacerait la personnification.
