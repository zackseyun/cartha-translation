review_pass:
  verdict: revise
  source_fidelity: La première proposition et l’image des yeux qui coulent en larmes sont bien rendues. Toutefois, « la jeune fille, mon peuple » ne rend pas fidèlement la double désignation « vierge/fille de mon peuple » et produit une apposition française défectueuse. « a subi un immense désastre » explicite et généralise le groupe cognat hébreu, en effaçant l’image de brisure et la voix passive.
  naturalness: « Que mes yeux ruissellent de larmes nuit et jour » est naturel dans un registre prophétique moderne. La reprise explicite « et qu’ils ne cessent pas » est plus fidèle à la coordination hébraïque et plus nette que « sans s’arrêter ». La formulation révisée conserve une diction poétique compréhensible; « d’une grande brisure » est volontairement marqué afin de refléter l’insistance cognate, clarifiée par note.
  terminology: « La vierge, fille de mon peuple » conserve la personnification poétique et les deux éléments lexicaux sans imposer une identification doctrinale. « Blessure très grave » rend sobrement מַכָּה נַחְלָה מְאֹד; elle ne tranche pas la possible nuance d’incurabilité.
