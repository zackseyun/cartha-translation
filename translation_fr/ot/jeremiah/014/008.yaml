review_pass:
  verdict: revise
  source_fidelity: Le texte principal rend fidèlement l’interpellation vocative, les deux titres appliqués à Dieu, la valeur rhétorique de l’inaccompli et le contraste entre le gēr et le voyageur de passage. « Pourquoi serais-tu » est une bonne formulation française de la protestation rhétorique. « Fait halte pour passer la nuit » transmet correctement l’idée d’un arrêt provisoire pour loger.
  naturalness: Le français est moderne, digne et fluide. La ponctuation et les majuscules des titres conviennent à une adresse à Dieu. La structure parallèle des deux comparaisons est bien conservée.
  terminology: « Espérance », « Sauveur », « détresse », « étranger », « pays » et « voyageur » sont appropriés. La note a doit toutefois éviter « immigré », terme administratif contemporain qui suggère une démarche migratoire et ne correspond pas de façon sûre à la portée lexicale de גֵּר. La note b est mieux présentée comme une variante que comme une traduction « plus littérale », car « se détourne » ne constitue pas à lui seul une équivalence littérale non ambiguë de l’expression entière.
  issues:
