    issue: La note a propose « immigré » comme alternative pour גֵּר.
    rationale: « Immigré » introduit des connotations administratives et sociopolitiques modernes absentes du terme hébreu, qui désigne ici un étranger/ résidant venu d’ailleurs. Il vaut mieux conserver une alternative explicitant le statut de résident étranger.
  - severity: low
    issue: La note b qualifie « se détourne pour passer la nuit » de rendu « plus littéral ».
    rationale: Le verbe נָטָה peut soutenir l’idée de se détourner ou de faire halte selon le contexte, mais la formulation proposée n’est pas une littéralité suffisamment nette pour justifier cette étiquette. Une note de variante est plus exacte.
