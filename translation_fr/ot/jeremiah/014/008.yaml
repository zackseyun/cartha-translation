source:
  edition: WLC
  text: מִקְוֵה֙ יִשְׂרָאֵ֔ל מֽוֹשִׁיע֖/וֹ בְּ/עֵ֣ת צָרָ֑ה לָ֤/מָּה תִֽהְיֶה֙ כְּ/גֵ֣ר בָּ/אָ֔רֶץ וּ/כְ/אֹרֵ֖חַ נָטָ֥ה לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/008.yaml
  text: O Hope of Israel[a], his Savior in time of distress, why should you be like a foreigner in the land[b], like a traveler who turns aside to spend the night?
translation:
  language: fr
  text: Espérance d’Israël, son Sauveur au temps de la détresse, pourquoi serais-tu comme un étranger dans le pays[a], comme un voyageur qui fait halte pour passer la nuit[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un étranger résidant dans le pays » ou « comme un résident étranger dans le pays ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un voyageur qui s’arrête pour passer la nuit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוֵה
  choice: Espérance
  rationale: Dans cette interpellation adressée à Dieu, le nom désigne celui en qui Israël place son espérance. « Espérance » conserve la force du titre tout en restant naturel en français.
- source_word: מוֹשִׁיעוֹ
  choice: son Sauveur
  rationale: Le suffixe masculin singulier renvoie à Israël, envisagé collectivement. « Son Sauveur » respecte cette construction et la fonction de titre divin.
- source_word: בְּעֵת צָרָה
  choice: au temps de la détresse
  rationale: Cette expression désigne une période de crise ou d’affliction. La formulation choisie est claire, grave et proche de l’hébreu.
- source_word: לָמָּה תִהְיֶה
  choice: pourquoi serais-tu
  rationale: Le conditionnel français rend bien la valeur modale de l’inaccompli dans cette question rhétorique empreinte de lamentation.
- source_word: כְּגֵר בָּאָרֶץ
  choice: comme un étranger dans le pays
  rationale: גֵר désigne une personne vivant hors de son milieu d’origine, avec un statut d’étranger résident. « Étranger » exprime clairement ici l’absence apparente d’appartenance durable, tandis que « le pays » préserve la possible résonance de la terre d’Israël.
- source_word: וּכְאֹרֵחַ
  choice: comme un voyageur
  rationale: Le terme désigne quelqu’un de passage. « Voyageur » est courant et convient au contraste entre présence temporaire et demeure permanente.
- source_word: נָטָה לָלוּן
  choice: qui fait halte pour passer la nuit
  rationale: La formulation exprime l’arrêt temporaire en vue de loger une seule nuit. Elle privilégie un français naturel sans effacer l’idée d’un bref détour ou arrêt.
theological_decisions:
- issue: Adresse directe à Dieu et titres divins
  choice: 'Lire l’ouverture comme une interpellation directe : « Espérance d’Israël, son Sauveur au temps de la détresse »'
  alternative: « Espoir d’Israël, celui qui le sauve au temps de la détresse »
  rationale: Le contexte est celui d’une prière adressée à Dieu. Les noms initiaux fonctionnent comme des titres, sans qu’il soit nécessaire d’ajouter un contenu doctrinal absent du texte.
- issue: Tension entre le rôle salvateur de Dieu et son apparente absence
  choice: Conserver la question « pourquoi serais-tu comme… »
  alternative: Reformuler comme une affirmation de l’éloignement de Dieu
  rationale: Le texte ne nie pas que Dieu soit le Sauveur d’Israël ; il exprime sous forme de lamentation le contraste entre ce titre et une présence qui paraît passagère. La question maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Les majuscules à « Espérance » et « Sauveur » signalent leur emploi comme titres dans l’adresse à Dieu. La syntaxe conserve le mouvement de la lamentation hébraïque et sa question rhétorique.
