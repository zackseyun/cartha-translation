  to: Pourquoi serais-tu comme un homme frappé de stupeur, comme un guerrier incapable de sauver ? Pourtant, tu es au milieu de nous, Yahweh, et nous portons ton nom[a]. Ne nous abandonne pas !
  rationale: La seule correction nécessaire concerne la formule « ton nom est invoqué sur nous ». Le texte révisé emploie l’équivalent idiomatique français « nous portons ton nom », tandis que la note conserve l’image littérale hébraïque et en explicite sobrement la fonction d’appartenance. Le reste du projet est maintenu.
