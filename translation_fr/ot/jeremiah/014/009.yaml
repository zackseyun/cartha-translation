source:
  edition: WLC
  text: לָ֤/מָּה תִֽהְיֶה֙ כְּ/אִ֣ישׁ נִדְהָ֔ם כְּ/גִבּ֖וֹר לֹא יוּכַ֣ל לְ/הוֹשִׁ֑יעַ וְ/אַתָּ֧ה בְ/קִרְבֵּ֣/נוּ יְהוָ֗ה וְ/שִׁמְ/ךָ֛ עָלֵ֥י/נוּ נִקְרָ֖א אַל תַּנִּחֵֽ/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/009.yaml
  text: Why should you be like a stunned man[a], like a warrior who cannot save? Yet you are in our midst, O Yahweh, and your name is called over us; do not forsake us.
translation:
  language: fr
  text: Pourquoi serais-tu comme un homme frappé de stupeur, comme un guerrier incapable de sauver ? Pourtant, tu es au milieu de nous, Yahweh, et nous portons ton nom[a]. Ne nous abandonne pas !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ton nom est appelé sur nous ». Cette expression indique que le peuple est désigné par le nom de Yahweh et lui appartient.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: לָמָּה תִהְיֶה
  choice: Pourquoi serais-tu
  rationale: L’interrogatif suivi de l’imparfait exprime ici une protestation suppliante plutôt qu’un simple futur. Le conditionnel français rend naturellement cette nuance modale.
- source_word: כְּאִישׁ נִדְהָם
  choice: comme un homme frappé de stupeur
  rationale: Le participe nifal נִדְהָם évoque une personne saisie, déconcertée au point d’être comme paralysée. Cette formulation conserve à la fois le choc et l’impuissance suggérés par le contexte.
- source_word: כְּגִבּוֹר
  choice: comme un guerrier
  rationale: גִּבּוֹר désigne ici un homme fort envisagé dans un contexte de combat et de délivrance; « guerrier » rend clairement cette image.
- source_word: לֹא יוּכַל לְהוֹשִׁיעַ
  choice: incapable de sauver
  rationale: יכול avec l’infinitif exprime l’incapacité, et הושיע signifie sauver, délivrer ou secourir. « Sauver » maintient le lien lexical et théologique sans surinterprétation.
- source_word: וְאַתָּה בְקִרְבֵּנוּ
  choice: Pourtant, tu es au milieu de nous
  rationale: Le waw prend en contexte une valeur contrastive. « Au milieu de nous » préserve l’image hébraïque de la présence divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte source.
- source_word: וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: et ton nom est invoqué sur nous
  rationale: Cette traduction conserve l’image littérale du nom prononcé sur le peuple tout en restant intelligible en français. L’idiome exprime l’appartenance et la revendication divine, précisées en note.
- source_word: אַל תַּנִּחֵנוּ
  choice: Ne nous abandonne pas
  rationale: La forme négative à valeur jussive exprime une supplication. Dans ce contexte, le hiphil de נוח signifie laisser ou délaisser; « abandonner » est actuel, digne et naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération préserve le caractère personnel du nom divin sans lui substituer un titre.
- issue: Formule d’appartenance וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: ton nom est invoqué sur nous
  alternative: nous portons ton nom / nous sommes appelés de ton nom
  rationale: Le texte principal garde l’image hébraïque du nom prononcé « sur » le peuple, laquelle peut exprimer appartenance, protection ou revendication d’alliance, sans réduire cette tension à une seule explication.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement convient à l’adresse directe à Dieu. Le conditionnel interrogatif traduit la plainte suppliante, et l’exclamation finale restitue son intensité sans alourdir la phrase.
