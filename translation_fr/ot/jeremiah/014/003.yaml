source:
  edition: WLC
  text: וְ/אַדִּ֣רֵי/הֶ֔ם שָׁלְח֥וּ צעורי/הם לַ/מָּ֑יִם בָּ֣אוּ עַל גֵּבִ֞ים לֹא מָ֣צְאוּ מַ֗יִם שָׁ֤בוּ כְלֵי/הֶם֙ רֵיקָ֔ם בֹּ֥שׁוּ וְ/הָכְלְמ֖וּ וְ/חָפ֥וּ רֹאשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/003.yaml
  text: Their nobles send their servants for water[a]; they come to the cisterns and find no water. They return with their containers empty; they are ashamed and humiliated[c][b], and they cover their heads.
translation:
  language: fr
  text: Leurs notables envoient leurs serviteurs chercher de l’eau[a]. Ceux-ci vont aux citernes[b], mais ne trouvent pas d’eau. Ils reviennent avec leurs récipients vides. Honteux et humiliés, ils se couvrent la tête[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs jeunes gens », « leurs petits » ou « leurs subordonnés » ; le mot hébreu peut évoquer l’âge ou un rang inférieur. Le contexte favorise ici le sens social.
    reason: lexical_alternative
  - marker: b
    text: Ou « fosses », « bassins » ou « réservoirs ».
    reason: lexical_alternative
  - marker: c
    text: Se couvrir la tête était un signe de honte, de deuil ou de détresse.
    reason: cultural_note
lexical_decisions:
- source_word: אַדִּירֵיהֶם
  choice: leurs notables
  rationale: Le terme désigne des personnes puissantes, éminentes ou de haut rang. « Notables » exprime naturellement leur position sociale dans ce contexte.
- source_word: צְעוּרֵיהֶם
  choice: leurs serviteurs
  rationale: Le mot peut désigner les plus jeunes ou les personnes de rang inférieur. Puisque les notables les chargent d’aller chercher de l’eau, « serviteurs » rend clairement la relation sociale suggérée par le contexte, tandis qu’une note conserve les autres possibilités.
- source_word: לַמָּיִם
  choice: chercher de l’eau
  rationale: Avec le verbe « envoyer », la préposition exprime ici le but de la mission. « Chercher de l’eau » est idiomatique en français et convient au contexte de sécheresse.
- source_word: גֵּבִים
  choice: citernes
  rationale: Le terme désigne des excavations ou réservoirs destinés à recueillir de l’eau. « Citernes » est précis et naturel, sans exclure en note les sens plus larges de fosses ou bassins.
- source_word: שָׁבוּ כְלֵיהֶם רֵיקָם
  choice: Ils reviennent avec leurs récipients vides
  rationale: La formulation française indique clairement qu’ils reviennent alors que les récipients emportés pour l’eau sont vides, sans préciser indûment leur forme.
- source_word: בֹּשׁוּ וְהָכְלְמוּ
  choice: Honteux et humiliés
  rationale: Les deux verbes hébreux associés intensifient l’expérience de honte et d’opprobre. Deux termes distincts préservent ce parallélisme sans lourdeur.
- source_word: וְחָפוּ רֹאשָׁם
  choice: ils se couvrent la tête
  rationale: La traduction directe conserve le geste culturel concret sans en réduire le sens à une seule émotion.
