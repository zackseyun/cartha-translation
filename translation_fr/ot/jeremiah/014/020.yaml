id: JER.14.20
reference: Jeremiah 14:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָדַ֧עְנוּ יְהוָ֛ה רִשְׁעֵ֖/נוּ עֲוֺ֣ן אֲבוֹתֵ֑י/נוּ כִּ֥י חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/020.yaml
  text: We acknowledge[a], O Yahweh, our wickedness, the iniquity of our fathers, for we have sinned against you.
translation:
  language: fr
  text: Nous reconnaissons, Yahvé, notre méchanceté et la faute de nos pères[a], car nous avons péché contre toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nos ancêtres ». L’hébreu dit littéralement : « nos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְנוּ
  choice: Nous reconnaissons
  rationale: Le verbe signifie littéralement « connaître », mais, dans cette prière de repentance, il exprime le fait d’admettre lucidement sa culpabilité. « Reconnaissons » garde cette nuance sans aller jusqu’à expliciter une formule de confession.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » restitue le nom divin plutôt que de le remplacer par un titre.
- source_word: רִשְׁעֵנוּ
  choice: notre méchanceté
  rationale: Le nom désigne la conduite mauvaise ou la culpabilité qui en découle. « Méchanceté » conserve ici la valeur morale du terme et reste distinct de עָוֹן.
- source_word: עֲוֺן
  choice: la faute
  rationale: Le terme peut désigner la faute, la culpabilité ou ses conséquences. « Faute » est naturel en français et convient au parallèle pénitentiel sans se confondre entièrement avec « méchanceté » et « péché ».
- source_word: אֲבוֹתֵינוּ
  choice: nos pères[a]
  rationale: Le texte porte littéralement « nos pères », c’est-à-dire les générations antérieures. La formulation genrée du texte est conservée, avec « nos ancêtres » indiqué en note comme équivalent contextuel.
- source_word: כִּי
  choice: car
  rationale: 'La conjonction introduit le motif de cette reconnaissance : le peuple a péché contre Dieu.'
- source_word: חָטָאנוּ
  choice: nous avons péché
  rationale: Le passé composé exprime naturellement en français un acte accompli dont la portée demeure présente dans cette confession.
- source_word: לָךְ
  choice: contre toi
  rationale: Avec le verbe « pécher », la préposition désigne la personne offensée ; « contre toi » est l’expression idiomatique française.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. La traduction le restitue sous sa forme française courante plutôt que de lui substituer un titre.
- issue: Portée de אֲבוֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » suit la forme masculine explicite de l’hébreu, tandis que « nos ancêtres » rend plus directement sa portée collective. La traduction principale conserve la forme source et la note signale l’autre possibilité.
translation_notes:
  register: Français moderne, sobre et digne, adapté à une prière collective. L’adresse « Yahvé » est encadrée par des virgules, sans interjection archaïsante. La coordination par « et » rend explicite le lien entre les deux objets du verbe, implicite par juxtaposition en hébreu.
