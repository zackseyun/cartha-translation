source:
  edition: WLC
  text: בַּ/עֲב֤וּר הָ/אֲדָמָה֙ חַ֔תָּה כִּ֛י לֹא הָיָ֥ה גֶ֖שֶׁם בָּ/אָ֑רֶץ בֹּ֥שׁוּ אִכָּרִ֖ים חָפ֥וּ רֹאשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/004.yaml
  text: Because the ground is dismayed[a], since there has been no rain in the land, the farmers are ashamed[b]; they cover their heads.
translation:
  language: fr
  text: Parce que le sol est crevassé[a], puisqu’il n’y a pas eu de pluie dans le pays, les cultivateurs ont honte[b] ; ils se couvrent la tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sol est consterné » ou « brisé ». Le verbe hébreu peut évoquer la consternation ou le fait d’être brisé ; dans ce contexte de sécheresse, il peut aussi décrire une terre crevassée.
    reason: lexical_alternative
  - marker: b
    text: Se couvrir la tête était un signe de honte, de douleur ou de deuil.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Parce que
  rationale: Introduit la cause de la situation décrite et permet une formulation française naturelle.
- source_word: הָאֲדָמָה
  choice: le sol
  rationale: Désigne ici la terre cultivable touchée par la sécheresse, plutôt que le pays dans son ensemble.
- source_word: חַתָּה
  choice: est crevassé
  rationale: Le verbe peut évoquer ce qui est brisé ou consterné. Dans le contexte concret de l’absence de pluie, « crevassé » exprime naturellement l’état du sol sans effacer l’autre possibilité, signalée en note.
- source_word: כִּי
  choice: puisque
  rationale: Introduit l’explication de l’état du sol tout en évitant la répétition immédiate de « parce que ».
- source_word: גֶשֶׁם
  choice: pluie
  rationale: Équivalent français simple et direct du terme désignant la pluie.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Renvoie au territoire touché par la sécheresse ; « pays » distingue ici אֶרֶץ du sol cultivé, אֲדָמָה.
- source_word: בֹּשׁוּ
  choice: sont couverts de honte
  rationale: Rend la honte et l’humiliation exprimées par le verbe, en lien avec le geste qui suit.
- source_word: אִכָּרִים
  choice: les cultivateurs
  rationale: Terme moderne et précis pour les personnes qui travaillent la terre, sans les limiter à l’action de labourer.
- source_word: חָפוּ רֹאשָׁם
  choice: ils se couvrent la tête
  rationale: Conserve le geste culturel concret associé à la honte, au deuil ou à l’affliction sans l’interpréter directement dans le corps du texte.
