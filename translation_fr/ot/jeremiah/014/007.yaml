id: JER.14.7
reference: Jeremiah 14:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם עֲוֺנֵ֨י/נוּ֙ עָ֣נוּ בָ֔/נוּ יְהוָ֕ה עֲשֵׂ֖ה לְמַ֣עַן שְׁמֶ֑/ךָ כִּֽי רַבּ֥וּ מְשׁוּבֹתֵ֖י/נוּ לְ/ךָ֥ חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/007.yaml
  text: Though our iniquities testify against us[a], O Yahweh, act for your name’s sake; for our apostasies are many[b]; against you we have sinned.
translation:
  language: fr
  text: Même si nos fautes témoignent contre nous[a], Yahweh, agis à cause de ton nom ! Car nos infidélités sont nombreuses[b] ; c’est contre toi que nous avons péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si nos fautes témoignent contre nous. » Le mot hébreu peut introduire une condition (« si ») ou une concession (« même si ») ; dans cette prière, le contexte favorise la concession.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nos actes de rébellion » ou « nos égarements ». Le terme hébreu désigne le fait de se détourner de Yahweh et de lui être infidèle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: La particule peut être conditionnelle (« si ») ou concessive. Dans cette prière, l’aveu de culpabilité suivi d’un appel à l’intervention divine favorise le sens concessif, tout en justifiant une note sur l’autre lecture.
- source_word: עֲוֺנֵינוּ
  choice: nos fautes
  rationale: Le nom עָוֹן exprime des torts moralement coupables et peut aussi évoquer la culpabilité qui en résulte. « Fautes » est naturel en français moderne et garde ici la référence aux actes qui déposent contre le peuple.
- source_word: עָנוּ בָנוּ
  choice: témoignent contre nous
  rationale: 'Le verbe ענה construit avec ב prend ici une nuance judiciaire : les fautes elles-mêmes déposent à charge. Cette formulation française rend clairement cette image.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par une translittération du nom divin plutôt que par un titre substitutif.
- source_word: עֲשֵׂה
  choice: agis
  rationale: L’impératif est littéralement très large (« fais »), mais le contexte demande à Yahweh d’intervenir. « Agis » reste concis sans préciser indûment la forme de cette intervention.
- source_word: לְמַעַן שְׁמֶךָ
  choice: à cause de ton nom
  rationale: L’expression appelle Dieu à agir en considération de son nom, qui représente sa réputation et son caractère. « À cause de ton nom » est clair et idiomatique sans ajouter explicitement ces notions.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la justification confessionnelle de la supplication.
- source_word: רַבּוּ
  choice: sont nombreuses
  rationale: Le parfait décrit l’abondance désormais constatée des actes d’infidélité ; le présent français exprime naturellement cet état résultant.
- source_word: מְשׁוּבֹתֵינוּ
  choice: nos infidélités
  rationale: Le terme désigne des détournements répétés de la fidélité due à Yahweh. « Infidélités » conserve la dimension relationnelle et alliance sans employer le terme français plus technique « apostasies ».
- source_word: לְךָ חָטָאנוּ
  choice: c’est contre toi que nous avons péché
  rationale: Avec חטא, la préposition לְ désigne ici la personne offensée. La tournure clivée souligne en français cette mise en relief finale de « contre toi ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Portée de מְשׁוּבֹתֵינוּ
  choice: nos infidélités
  alternative: nos apostasies / nos égarements
  rationale: « Infidélités » exprime les actes répétés par lesquels le peuple se détourne de sa relation avec Yahweh, sans réduire le mot à de simples erreurs ni lui imposer un sens dogmatique ultérieur.
- issue: Valeur de אִם
  choice: Même si
  alternative: Si
  rationale: Le contexte permet de comprendre la proposition comme un aveu concédé avant l’appel à Dieu. La valeur conditionnelle reste grammaticalement possible et est préservée en note.
translation_notes:
  register: 'Français international moderne, digne et directement compréhensible. Le rythme conserve les trois mouvements du verset : aveu à charge, supplication fondée sur le nom divin, puis confession de l’infidélité et du péché. Le point d’exclamation marque la force de l’impératif sans rendre le ton emphatique à l’excès.'
