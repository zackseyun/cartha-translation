base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/002.yaml
  text: Judah mourns[a], and her gates languish; they grow dark on the ground, and the cry of Jerusalem goes up.
translation:
  language: fr
  text: Juda est en deuil, et ses portes dépérissent ; elles sont sombres à terre[a], et le cri de Jérusalem s’élève.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deviennent sombres à terre ». L’hébreu peut évoquer à la fois l’obscurité du deuil et l’abaissement jusqu’au sol.
    reason: 'La construction hébraïque est concise et son image exacte demeure ambiguë : assombrissement, tenue de deuil ou posture d’abattement.'
lexical_decisions:
- source_word: אָבְלָה
  choice: est en deuil
  rationale: Le qal exprime l’état de deuil ou l’affliction. « Est en deuil » est naturel en français et conserve l’image collective appliquée à Juda.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom du territoire et de sa population.
- source_word: שְׁעָרֶיהָ
  choice: ses portes
  rationale: Le terme désigne concrètement les portes de la ville, personnifiées ici et pouvant représenter la vie civique qui s’y concentre.
- source_word: אֻמְלְלוּ
  choice: dépérissent
  rationale: Le verbe évoque l’affaiblissement et le dépérissement. Ce choix rend l’état de désolation sans limiter l’image au domaine végétal.
- source_word: קָדְרוּ
  choice: s’assombrissent
  rationale: Le verbe indique le fait de devenir sombre ou noirâtre et peut évoquer l’apparence du deuil. La traduction conserve cette image sans ajouter explicitement une posture absente du verbe.
- source_word: לָאָרֶץ
  choice: jusqu’à terre
  rationale: La préposition orientée vers la terre est conservée dans une formulation concise, tout en laissant ouverte l’image d’abaissement ou de prostration.
- source_word: צִוְחַת
  choice: le cri
  rationale: Le nom désigne un cri de détresse. « Le cri » est simple, fort et naturel dans ce contexte poétique.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
- source_word: עָלָתָה
  choice: s’élève
  rationale: Le verbe signifie monter. « S’élève » rend naturellement en français le mouvement ascendant du cri.
