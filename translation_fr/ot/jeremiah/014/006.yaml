  text: וּ/פְרָאִים֙ עָמְד֣וּ עַל שְׁפָיִ֔ם שָׁאֲפ֥וּ ר֖וּחַ כַּ/תַּנִּ֑ים כָּל֥וּ עֵינֵי/הֶ֖ם כִּי אֵ֥ין עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/006.yaml
  text: And the wild donkeys stand on the bare heights[a]; they pant for air like jackals. Their eyes fail[c][b], because there is no grass.
translation:
  language: fr
  text: Les ânes sauvages[a] se tiennent sur les hauteurs dénudées ; ils aspirent l’air[b] comme des chacals[c]. Leurs yeux défaillent, car il n’y a pas d’herbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les onagres ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils halètent » ; plus littéralement, « ils aspirent le vent ».
    reason: lexical_alternative
  - marker: c
    text: L’identification de l’animal hébreu est discutée. Dans ce contexte désertique, il s’agit très probablement du chacal ; certaines traductions anciennes ont « dragons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְרָאִים
  choice: Les ânes sauvages
  rationale: פְרָאִים désigne des équidés sauvages, probablement des onagres, et non des ânes domestiques. « Ânes sauvages » est précis et immédiatement compréhensible.
- source_word: עָמְדוּ
  choice: se tiennent
  rationale: Le parfait hébreu décrit ici de façon saisissante la situation présente créée par la sécheresse ; le présent français convient à ce tableau continu.
- source_word: עַל שְׁפָיִם
  choice: sur les hauteurs dénudées
  rationale: שְׁפָיִם évoque des hauteurs découvertes et sans végétation. Cette formulation rend à la fois le relief et l’exposition du terrain sans connotation cultuelle.
- source_word: שָׁאֲפוּ רוּחַ
  choice: ils aspirent l’air
  rationale: L’expression signifie littéralement qu’ils font entrer de l’air ou du vent. « Aspirent l’air » conserve cette image tout en exprimant leur respiration désespérée.
- source_word: כַּתַּנִּים
  choice: comme des chacals
  rationale: Dans ce contexte terrestre de sécheresse et de désolation, תַּנִּים désigne très probablement des chacals plutôt que des créatures marines ou des « dragons » au sens des anciennes traductions.
- source_word: כָּלוּ עֵינֵיהֶם
  choice: Leurs yeux s’éteignent
  rationale: כלה appliqué aux yeux exprime leur épuisement, leur affaiblissement ou la perte de leur éclat. « S’éteignent » rend naturellement en français cette défaillance physique sans en préciser excessivement le mécanisme.
- source_word: כִּי אֵין עֵשֶׂב
  choice: car il n’y a plus d’herbe
  rationale: עֵשֶׂב désigne ici l’herbe ou la végétation dont se nourrissent les animaux. « Il n’y a plus » fait ressortir le résultat de la sécheresse tout en restant fidèle à l’absence exprimée en hébreu.
