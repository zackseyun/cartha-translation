  source_fidelity: 'Le sens global est fidèle au texte hébreu : les ânes sauvages se trouvent sur les hauteurs arides, respirent avidement à la manière des chacals, et leurs yeux défaillent faute d’herbe. Toutefois, « il n’y a plus d’herbe » introduit l’idée d’une disparition antérieure (« plus ») qui n’est pas explicitement exprimée par אֵין (« il n’y a pas »).'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Aspirent l’air » est recevable et conserve l’image de l’hébreu ; la note offre utilement « ils halètent ». « Leurs yeux défaillent » est légèrement plus proche de la défaillance exprimée par כָּלוּ que « s’éteignent », tout en restant naturel.
  terminology: « Ânes sauvages » convient bien pour פְרָאִים, avec « onagres » en variante. « Hauteurs dénudées » rend bien שְׁפָיִם. « Chacals » est le choix contextuellement le plus probable pour תַּנִּים, tandis que la note signale correctement l’incertitude d’identification sans la masquer.
  issues:
