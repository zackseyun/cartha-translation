    issue: « il n’y a plus d’herbe »
    rationale: Le mot « plus » explicite une conséquence temporelle de la sécheresse qui est plausible dans le contexte, mais absente de l’énoncé hébreu, lequel dit simplement qu’il n’y a pas d’herbe.
  - severity: low
    issue: « Leurs yeux s’éteignent »
    rationale: La formulation est compréhensible, mais « défaillent » rend plus directement l’idée de yeux qui viennent à manquer/devenir défaillants sous l’effet de l’épuisement, sans suggérer aussi fortement une extinction définitive.
