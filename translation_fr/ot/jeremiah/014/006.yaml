  rationale: La révision retire l’ajout implicite de « plus » afin de reproduire l’absence d’herbe exprimée directement par l’hébreu. Elle remplace aussi « s’éteignent » par « défaillent », formulation française naturelle et plus étroitement correspondante à l’image hébraïque des yeux qui dépérissent ou font défaut. Les autres choix et les trois ancres de notes sont conservés.
