id: JER.14.15
reference: Jeremiah 14:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַֽל הַ/נְּבִאִ֞ים הַ/נִּבְּאִ֣ים בִּ/שְׁמִ/י֮ וַ/אֲנִ֣י לֹֽא שְׁלַחְתִּי/ם֒ וְ/הֵ֨מָּה֙ אֹֽמְרִ֔ים חֶ֣רֶב וְ/רָעָ֔ב לֹ֥א יִהְיֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את בַּ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִתַּ֔מּוּ הַ/נְּבִאִ֖ים הָ/הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/015.yaml
  text: 'Therefore thus says Yahweh concerning the prophets who prophesy in my name though I did not send them[a], and who say, ‘Sword and famine will not be in this land’: by sword and by famine those prophets will be consumed.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh au sujet des prophètes qui prophétisent en mon nom sans que je les aie envoyés et qui disent : « Il n’y aura ni guerre ni famine dans ce pays[a] » : ces prophètes-là périront par la guerre et par la famine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « L’épée et la famine ne seront pas dans ce pays. »'
    reason: Préserve la formulation concrète de l’hébreu, où « l’épée » peut désigner la guerre.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conclusion tirée du contexte précédent, dans un français naturel.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Rend naturellement en français moderne la formule de messager prophétique tout en conservant le nom divin.
- source_word: עַל
  choice: au sujet de
  rationale: Introduit les prophètes comme objet de la déclaration divine sans surinterpréter la préposition par « contre ».
- source_word: הַנְּבִאִים הַנִּבְּאִים
  choice: les prophètes qui prophétisent
  rationale: Préserve la construction apparentée du nom et du verbe en hébreu.
- source_word: בִּשְׁמִי
  choice: en mon nom
  rationale: Expression française courante qui conserve l’idée d’une autorité divine revendiquée.
- source_word: וַאֲנִי לֹא שְׁלַחְתִּים
  choice: sans que je les aie envoyés
  rationale: Exprime clairement le contraste entre leur prétention à parler au nom de Dieu et l’absence de mandat divin.
- source_word: וְהֵמָּה אֹמְרִים
  choice: et qui disent
  rationale: Rend directement le participe hébreu sans imposer une nuance itérative supplémentaire.
- source_word: חֶרֶב וְרָעָב
  choice: guerre ni famine
  rationale: Dans cette annonce, « épée » fonctionne comme métonymie de la guerre; « guerre » est immédiatement intelligible en français, tandis que la traduction littérale est signalée en note.
- source_word: לֹא יִהְיֶה בָּאָרֶץ הַזֹּאת
  choice: Il n’y aura ... dans ce pays
  rationale: Reproduit naturellement la construction existentielle et rend אֶרֶץ par « pays » dans ce contexte territorial.
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: par la guerre et par la famine
  rationale: Préserve la répétition instrumentale et le parallélisme solennel de la sentence.
- source_word: יִתַּמּוּ
  choice: périront
  rationale: Communique dans ce contexte de jugement l’issue fatale du verbe « arriver à son terme, être anéanti », avec plus de naturel que « seront consumés ».
- source_word: הַנְּבִאִים הָהֵמָּה
  choice: ces prophètes-là
  rationale: Le démonstratif renforcé renvoie avec insistance aux prophètes qui viennent d’être dénoncés.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel sans lui substituer un titre.
- issue: Portée de חֶרֶב
  choice: guerre dans le texte, avec « épée » en note
  alternative: épée
  rationale: Le terme signifie littéralement « épée », mais désigne ici par métonymie la guerre. La note préserve l’image et l’ambiguïté lexicales de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique reste solennelle sans adopter une syntaxe archaïque. Le parallélisme de la menace finale est conservé.
