  text: The word of Yahweh that came to Jeremiah concerning the droughts[a].
translation:
  language: fr
  text: La parole de Yahweh qui fut adressée à Jérémie au sujet des sécheresses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet de la sécheresse » ou « au sujet des événements liés aux sécheresses ». L’hébreu emploie un pluriel, qui peut désigner des épisodes répétés de sécheresse ou les crises qu’ils provoquent.
    reason: Alternative lexicale et conservation de l’ambiguïté du pluriel hébreu.
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: La parole de Yahweh qui fut adressée à Jérémie
  rationale: La formule prophétique signifie idiomatiquement que la parole divine parvient au prophète. « Fut adressée à » est naturel en français et conserve le caractère de rubrique du verset.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans le remplacer par un titre.
- source_word: עַל דִּבְרֵי
  choice: au sujet de
  rationale: Dans cette construction, דִּבְרֵי a le sens idiomatique de « question » ou « affaire »; « au sujet de » exprime clairement le thème de l’oracle sans traduire littéralement par « paroles ».
- source_word: הַבַּצָּרוֹת
  choice: les sécheresses
  rationale: Le terme désigne des sécheresses ou les pénuries qu’elles provoquent. Le pluriel français préserve le pluriel hébreu sans imposer l’idée plus précise de famines.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée du pluriel הַבַּצָּרוֹת
  choice: les sécheresses
  alternative: la sécheresse
  rationale: Le pluriel peut évoquer des épisodes répétés ou plusieurs manifestations d’une même crise. Le texte principal en maintient la forme, tandis que la note signale l’autre lecture possible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le style d’une rubrique prophétique; « fut adressée » rend naturellement l’idiome hébreu, et le pluriel inhabituel « sécheresses » reste visible dans le texte.
