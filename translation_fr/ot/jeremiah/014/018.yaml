  variant: modern international French
source:
  edition: WLC
  text: אִם יָצָ֣אתִי הַ/שָּׂדֶ֗ה וְ/הִנֵּה֙ חַלְלֵי חֶ֔רֶב וְ/אִם֙ בָּ֣אתִי הָ/עִ֔יר וְ/הִנֵּ֖ה תַּחֲלוּאֵ֣י רָעָ֑ב כִּֽי גַם נָבִ֧יא גַם כֹּהֵ֛ן סָחֲר֥וּ אֶל אֶ֖רֶץ וְ/לֹ֥א יָדָֽעוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/018.yaml
  text: If I go out into the field[a], look—those slain by the sword! And if I enter the city[b], look—those sick with famine! For both prophet and priest wander through the land and do not know what to do.
translation:
  language: fr
  text: Si je sors dans la campagne, voici les victimes de l’épée ! Si j’entre dans la ville, voici les malades de la famine ! Car prophète et prêtre, tous deux, parcourent le pays sans savoir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du verset est difficile en hébreu. Elle pourrait aussi se comprendre ainsi : « font du commerce dans le pays sans comprendre », « errent dans le pays sans savoir quoi faire », ou « sont partis vers un pays qu’ils ne connaissent pas ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם יָצָאתִי הַשָּׂדֶה
  choice: Si je sors dans la campagne
  rationale: Le présent français rend naturellement l’observation conditionnelle et saisissante. « La campagne » exprime ici le territoire ouvert opposé à la ville, sans réduire שׂדה à une parcelle cultivée.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » conserve la fonction déictique de הִנֵּה et l’effet de découverte immédiate dans un registre digne mais actuel.
- source_word: חַלְלֵי חֶרֶב
  choice: les victimes de l’épée
  rationale: Le syntagme désigne les personnes transpercées ou tuées par l’épée. « Victimes de l’épée » est naturel et laisse entendre leur mort sans lourdeur littérale.
- source_word: וְאִם בָּאתִי הָעִיר
  choice: Si j’entre dans la ville
  rationale: Avec une destination, בוא signifie naturellement entrer dans un lieu. La reprise de « Si » maintient le parallélisme.
- source_word: תַּחֲלוּאֵי רָעָב
  choice: les malades de la famine
  rationale: Cette expression concrète fait pendant aux victimes de l’épée et désigne probablement les personnes rendues malades par la famine. La formulation conserve aussi l’étrangeté expressive de l’hébreu.
- source_word: כִּי גַם נָבִיא גַם כֹּהֵן
  choice: Car prophète et prêtre, tous deux
  rationale: « Car » introduit l’explication, tandis que « tous deux » rend l’insistance produite par la répétition de גַם.
- source_word: סָחֲרוּ אֶל אֶרֶץ
  choice: parcourent le pays
  rationale: Le verbe peut évoquer le déplacement, notamment celui de marchands. « Parcourent » reste neutre et fluide sans imposer le commerce ni l’errance, tandis que « le pays » rend אֶרֶץ dans ce contexte national.
- source_word: וְלֹא יָדָעוּ
  choice: sans savoir
  rationale: L’hébreu ne précise aucun complément à « savoir ». La traduction conserve volontairement cette suspension plutôt que d’ajouter « quoi faire » ou « où aller ».
theological_decisions:
- issue: Situation du prophète et du prêtre sous le jugement
  choice: Ils parcourent le pays « sans savoir », formulation qui souligne leur désorientation sans en préciser la nature.
  alternative: Ils errent dans le pays sans savoir quoi faire ; ils font du commerce dans le pays sans comprendre ; ils sont partis vers un pays qu’ils ne connaissent pas.
  rationale: La clause hébraïque finale est difficile. Le texte retenu ne transforme pas les responsables religieux en source de solution et n’impose ni une accusation commerciale, ni l’exil, ni un objet absent après le verbe « savoir ».
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme campagne/ville et les exclamations rendent l’immédiateté de la vision. La formulation finale demeure volontairement elliptique afin de préserver l’ambiguïté réelle de l’hébreu.
