  text: כִּ֤י גַם אַיֶּ֨לֶת֙ בַּ/שָּׂדֶ֔ה יָלְדָ֖ה וְ/עָז֑וֹב כִּ֥י לֹֽא הָיָ֖ה דֶּֽשֶׁא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/005.yaml
  text: For even the doe in the field gives birth and abandons her young[a], because there is no grass.
translation:
  language: fr
  text: Car même la biche, dans la campagne, met bas et abandonne son petit[a], parce qu’il n’y a pas d’herbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et le laisse » ; l’hébreu ne précise pas l’objet, mais le contexte indique que la biche abandonne le petit qu’elle vient de mettre au monde.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Même
  rationale: Dans la construction כִּי גַם, כִּי contribue à l’emphase plutôt qu’à une causalité distincte; le français naturel peut rendre l’ensemble simplement par « Même ».
- source_word: גַם
  choice: Même
  rationale: Souligne que la sécheresse atteint jusqu’aux animaux sauvages.
- source_word: אַיֶּלֶת
  choice: la biche
  rationale: Désigne précisément la femelle du cerf; « biche » est courant, exact et non archaïque.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שׂדה peut désigner l’espace ouvert plutôt qu’un champ cultivé précis; « dans la campagne » convient mieux à une biche sauvage.
- source_word: יָלְדָה
  choice: met bas
  rationale: Expression française idiomatique et précise pour un animal qui donne naissance.
- source_word: וְעָזוֹב
  choice: et abandonne son petit
  rationale: Le verbe signifie laisser ou abandonner. L’objet n’est pas exprimé en hébreu, mais le contexte indique le nouveau-né; il est explicité dans le texte et signalé en note.
- source_word: כִּי לֹא הָיָה
  choice: parce qu’il n’y a pas
  rationale: Introduit clairement la cause de l’abandon; le présent rend de façon naturelle la scène poétique et l’état de sécheresse.
- source_word: דֶּשֶׁא
  choice: d’herbe
  rationale: Désigne l’herbe tendre ou la jeune végétation; « herbe » est ici la formulation française la plus claire et concise.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. « Met bas » est idiomatique pour la naissance d’un animal; « campagne » évoque l’espace ouvert sans suggérer nécessairement une parcelle cultivée.
