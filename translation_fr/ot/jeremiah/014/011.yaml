  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י אַל תִּתְפַּלֵּ֛ל בְּעַד הָ/עָ֥ם הַ/זֶּ֖ה לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/011.yaml
  text: Then Yahweh said to me[a], “Do not pray for the welfare of this people.”
translation:
  language: fr
  text: 'Alors Yahweh me dit : « Ne prie pas pour le bien de ce peuple. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui conserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: אֵלָי
  choice: me
  rationale: Avec « dire », le pronom indirect « me » est l’équivalent français naturel de « à moi ».
- source_word: אַל תִּתְפַּלֵּל
  choice: Ne prie pas
  rationale: אַל suivi de cette forme verbale exprime une interdiction ; « Ne prie pas » la rend directement.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: pour ce peuple
  rationale: בְּעַד marque ici l’intercession en faveur de quelqu’un ; « pour ce peuple » est concis et idiomatique.
- source_word: לְטוֹבָה
  choice: pour le bien
  rationale: L’expression désigne le bien ou l’avantage recherché pour le peuple ; cette formulation reste proche de l’hébreu sans surinterprétation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre au lieu de le remplacer par un titre.
- issue: Portée de לְטוֹבָה
  choice: pour le bien de ce peuple
  alternative: en faveur de ce peuple
  rationale: La traduction retenue conserve explicitement l’idée de bien ou de bénéfice, tandis que l’alternative peut estomper cette nuance.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est naturelle tout en conservant le collectif singulier « ce peuple » et la nuance finale de bénéfice exprimée par לְטוֹבָה.
