  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/תְּאֵנִ֥ים הַ/טֹּב֖וֹת הָ/אֵ֑לֶּה כֵּֽן אַכִּ֞יר אֶת גָּל֣וּת יְהוּדָ֗ה אֲשֶׁ֨ר שִׁלַּ֜חְתִּי מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה אֶ֥רֶץ כַּשְׂדִּ֖ים לְ/טוֹבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/005.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Like these good figs, so I will regard the exiles of Judah, whom I sent away from this place to the land of the Chaldeans[b], for good.'
translation:
  language: fr
  text: 'Voici ce que dit YHWH, le Dieu d’Israël : « Comme ces bonnes figues, ainsi je considérerai favorablement les exilés de Juda[a], que j’ai envoyés de ce lieu au pays des Chaldéens, en vue du bien[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’exil de Juda » ou « la captivité de Juda ». Le terme hébreu peut désigner les personnes exilées ou la situation d’exil ; ici, le sens personnel correspond mieux à « que j’ai envoyés ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « pour le bien ». L’hébreu ne précise pas qui en bénéficiera.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend naturellement en français moderne la formule prophétique de messager, tout en conservant sa solennité.
- source_word: יְהוָה
  choice: YHWH
  rationale: Reproduit distinctement le nom divin du texte hébreu sans le remplacer par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction hébraïque, qui maintient l’identification d’alliance.
- source_word: כַּתְּאֵנִים הַטֹּבוֹת הָאֵלֶּה
  choice: Comme ces bonnes figues
  rationale: Conserve la comparaison, la qualité positive des figues et la valeur démonstrative de « ces ».
- source_word: כֵּן אַכִּיר
  choice: ainsi je porterai un regard favorable sur
  rationale: Le hiphil de נכר exprime ici une manière de considérer ou de traiter, et non une simple reconnaissance cognitive. Cette formulation française explicite naturellement l’évaluation suggérée par la comparaison avec les bonnes figues.
- source_word: גָּלוּת יְהוּדָה
  choice: les exilés de Juda
  rationale: Le nom peut désigner l’exil, la captivité ou collectivement les personnes déportées. Le relatif personnel qui suit favorise ici le sens concret des exilés.
- source_word: שִׁלַּחְתִּי
  choice: j’ai envoyés loin
  rationale: Préserve l’action et l’initiative divines sans introduire le terme politique plus technique « déporter ».
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: de ce lieu
  rationale: Rendu direct et idiomatique de l’origine du déplacement.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: au pays des Chaldéens
  rationale: Conserve la désignation ethnogéographique du texte hébreu plutôt que de la remplacer par « Babylonie ».
- source_word: לְטוֹבָה
  choice: pour leur bien
  rationale: Exprime en français idiomatique la finalité bénéfique, tout en signalant en note que le bénéficiaire demeure implicite dans l’hébreu.
theological_decisions:
- issue: Référent de גָּלוּת יְהוּדָה
  choice: les exilés de Juda, c’est-à-dire les personnes
  alternative: l’exil de Juda ou la captivité de Juda
  rationale: La comparaison avec les bonnes figues et le relatif « que j’ai envoyés » orientent vers les personnes, sans supprimer l’ambiguïté lexicale, indiquée en note.
- issue: Portée de לְטוֹבָה
  choice: pour leur bien
  alternative: pour le bien
  rationale: Le contexte permet d’identifier les exilés comme bénéficiaires, mais l’hébreu ne comporte aucun pronom explicite. La note conserve cette concision et cette légère indétermination.
- issue: Sens de אַכִּיר dans la comparaison
  choice: porter un regard favorable sur
  alternative: reconnaître, considérer ou regarder
  rationale: Dans ce contexte, le verbe décrit l’évaluation ou l’attitude de Dieu envers les exilés figurés par les bonnes figues, plutôt qu’une simple identification intellectuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique reste solennelle sans archaïsme. « YHWH » maintient visiblement le nom divin hébreu. Les guillemets français délimitent la parole divine.
