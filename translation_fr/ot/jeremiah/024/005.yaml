  to: 'Voici ce que dit YHWH, le Dieu d’Israël : « Comme ces bonnes figues, ainsi je considérerai favorablement les exilés de Juda[a], que j’ai envoyés de ce lieu au pays des Chaldéens, en vue du bien[b]. »'
  rationale: La révision retire l’ajout non exprimé « loin » et rend la finalité de לְטוֹבָה sans expliciter le bénéficiaire. « Je considérerai favorablement » communique naturellement en français la valeur évaluative positive de אַכִּיר dans cette comparaison, sans en faire une simple reconnaissance intellectuelle.
