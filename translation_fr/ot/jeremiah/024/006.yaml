  text: וְ/שַׂמְתִּ֨י עֵינִ֤/י עֲלֵי/הֶם֙ לְ/טוֹבָ֔ה וַ/הֲשִׁבֹתִ֖י/ם עַל הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְנִיתִי/ם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וּ/נְטַעְתִּ֖י/ם וְ/לֹ֥א אֶתּֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/006.yaml
  text: I will set my eyes on them for good[a], and I will bring them back to this land. I will build them up and not tear them down[c][b]; I will plant them and not uproot them.
translation:
  language: fr
  text: Je poserai mon regard sur eux pour leur bien[a], et je les ramènerai dans ce pays-ci[b]. Je les bâtirai, je ne les démolirai pas ; je les planterai, je ne les déracinerai pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Je mettrai mon œil sur eux pour le bien. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je les rétablirai dans ce pays-ci ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie deux couples d’images : « bâtir… ne pas démolir » et « planter… ne pas déraciner ».'
    reason: literary_structure
lexical_decisions:
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: Je veillerai sur eux
  rationale: L’expression hébraïque signifie littéralement « mettre mon œil sur eux ». En français moderne, « veiller sur eux » conserve l’idée d’une attention active et bienveillante sans produire une tournure artificielle.
- source_word: לְטוֹבָה
  choice: pour leur bien
  rationale: La préposition לְ exprime ici une visée favorable. « Pour leur bien » rend explicitement et naturellement le bénéficiaire déjà indiqué par « eux ».
- source_word: וַהֲשִׁבֹתִים
  choice: je les ramènerai
  rationale: Le hifil de שוב avec un complément d’objet signifie ici faire revenir. Le contexte de l’exil et la mention du pays imposent un retour concret plutôt qu’une restauration seulement générale.
- source_word: עַל הָאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: Avec le verbe de retour, עַל a ici une valeur directionnelle. « Dans ce pays » est idiomatique en français et désigne le territoire précis dont il est question, non la terre au sens universel.
- source_word: וּבְנִיתִים וְלֹא אֶהֱרֹס
  choice: Je les bâtirai, je ne les démolirai pas
  rationale: La traduction maintient le couple métaphorique בנה/הרס. « Bâtir » appliqué à un peuple reste intelligible et conserve mieux l’image prophétique que sa paraphrase explicative.
- source_word: וּנְטַעְתִּים וְלֹא אֶתּוֹשׁ
  choice: je les planterai, je ne les déracinerai pas
  rationale: Le couple agricole est rendu directement. « Déraciner » exprime clairement l’arrachement de ce qui a été planté et correspond au registre prophétique de Jérémie.
theological_decisions:
- issue: Portée de la promesse de restauration après le jugement
  choice: Présenter une promesse concrète de bienveillance divine, de retour dans le pays et de rétablissement du peuple.
  alternative: Comprendre la phrase comme une promesse générale de prospérité ou comme une restauration exclusivement spirituelle.
  rationale: Le contexte immédiat concerne les exilés et leur retour dans le pays. La traduction préserve cette dimension historique et territoriale sans fermer la possibilité d’implications théologiques plus larges.
- issue: Force des négations dans les métaphores de restauration
  choice: 'Conserver les affirmations suivies de négations : « bâtirai… ne démolirai pas » et « planterai… ne déracinerai pas ».'
  alternative: Réduire les deux couples à une simple affirmation de rétablissement durable.
  rationale: La répétition et la tension entre action positive et action négative appartiennent à la formulation du texte et soulignent la stabilité promise.
translation_notes:
  register: Français international moderne, digne et accessible. Les images prophétiques du bâtiment et de la plantation sont conservées. « Je veillerai sur eux » privilégie une expression française naturelle tout en signalant en note l’image hébraïque de l’œil.
