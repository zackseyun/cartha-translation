base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/007.yaml
  text: And I will give them a heart to know me[a], that I am Yahweh; and they will be my people, and I will be their God[b], for they will return to me with all their heart.
translation:
  language: fr
  text: Je leur donnerai un cœur pour me connaître, afin qu’ils reconnaissent que je suis Yahvé. Ils seront mon peuple, et moi, je serai leur Dieu, car ils reviendront à moi de tout leur cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je leur donnerai
  rationale: Le parfait qal avec waw, dans cette promesse prophétique, exprime naturellement un futur. En français, l’absence de « Et » initial rend la phrase plus naturelle sans perdre la continuité du discours.
- source_word: לֵב לָדַעַת אֹתִי
  choice: un cœur capable de me connaître
  rationale: לֵב désigne ici la personne intérieure, notamment sa volonté et son intelligence. « Capable de » explicite sobrement la fonction du cœur donné, tandis que « me connaître » conserve la portée relationnelle et covenantale de ידע.
- source_word: כִּי אֲנִי יְהוָה
  choice: de savoir que je suis Yahvé
  rationale: כִּי introduit vraisemblablement le contenu de la connaissance. La reprise « de savoir » rend en français le passage de la connaissance personnelle à son contenu sans réduire l’une à l’autre. Le nom divin est translittéré « Yahvé ».
- source_word: וְהָיוּ לִי לְעָם
  choice: Ils seront mon peuple
  rationale: Cette formulation idiomatique conserve la première moitié de la formule d’alliance.
- source_word: וְאָנֹכִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: et moi, je serai leur Dieu
  rationale: Le pronom אָנֹכִי est rendu par la tournure emphatique « moi, je », et la formulation préserve la réciprocité de l’alliance.
- source_word: כִּי יָשֻׁבוּ אֵלַי
  choice: car ils reviendront à moi
  rationale: Le second כִּי est compris comme causal. « Reviendront à moi » garde l’idée concrète et relationnelle de retour portée par שׁוב.
- source_word: בְּכָל לִבָּם
  choice: de tout leur cœur
  rationale: Cette expression française naturelle conserve l’image hébraïque de l’engagement de toute la personne intérieure.
theological_decisions:
- issue: Formule d’alliance
  choice: Conserver « Ils seront mon peuple, et moi, je serai leur Dieu »
  alternative: Paraphraser en termes généraux d’appartenance réciproque
  rationale: Le texte emploie une formule d’alliance caractéristique de Jérémie. La conserver maintient sa force intertextuelle sans ajouter d’interprétation confessionnelle.
- issue: Nature de la connaissance de Dieu
  choice: « me connaître, de savoir que je suis Yahvé »
  alternative: « reconnaître que je suis Yahvé »
  rationale: La formulation retenue maintient à la fois la connaissance relationnelle de Dieu et le contenu introduit par כִּי, au lieu de ramener le passage à une simple reconnaissance intellectuelle.
- issue: Valeur du dernier כִּי
  choice: 'Valeur causale : « car »'
  alternative: Valeur explicative ou asseverative, sans lien causal marqué
  rationale: La lecture causale relie naturellement le rétablissement de la relation d’alliance à leur retour entier vers Dieu, tout en laissant intacte la tension entre le cœur donné par Dieu et le retour humain.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme de l’alliance, l’image du cœur et la tension entre l’initiative divine (« je leur donnerai ») et la réponse humaine (« ils reviendront »). Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
