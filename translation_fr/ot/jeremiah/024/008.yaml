    issue: Formulation de la conséquence comparative
    rationale: « Je traiterai de même Sédécias » est compréhensible, mais « de même » est moins nettement rattaché à l’image qui précède. « Je traiterai ainsi » est plus fluide et garde le caractère volontairement elliptique de כֵּן אֶתֵּן.
  - severity: low
    issue: Répétition dans la description des figues
    rationale: « Mauvaises figues ... tant elles sont mauvaises » reflète le lexique hébreu, mais la répétition est lourde en français. « Trop mauvaises pour être mangées » exprime naturellement l’inedibilité causée par leur très mauvais état.
  - severity: low
    issue: Note explicative sur le sort des figues
    rationale: 'Dire que les personnes subiront « un sort correspondant à celui des mauvaises figues » peut induire en erreur : le texte compare d’abord leur statut aux figues impropres à être mangées, et le jugement concret est développé ensuite. La note doit présenter l’ellipse sans lui attribuer un “sort” déjà explicité.'
