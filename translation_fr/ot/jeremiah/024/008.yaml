  text: וְ/כַ/תְּאֵנִים֙ הָֽ/רָע֔וֹת אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹ֑עַ כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה כֵּ֣ן אֶ֠תֵּן אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֤ה וְ/אֶת שָׂרָי/ו֙ וְ/אֵ֣ת שְׁאֵרִ֣ית יְרוּשָׁלִַ֗ם הַ/נִּשְׁאָרִים֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/הַ/יֹּשְׁבִ֖ים בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/008.yaml
  text: 'But like the bad figs that cannot be eaten because they are so bad[a], thus says Yahweh: so I will make Zedekiah king of Judah, his officials, the remnant of Jerusalem who remain in this land, and those who dwell in the land of Egypt.'
translation:
  language: fr
  text: '« Mais, comme les mauvaises figues, trop mauvaises pour être mangées, voici ce que dit Yahweh : je traiterai ainsi[a] Sédécias, roi de Juda, ses hauts fonctionnaires, le reste de Jérusalem qui demeure dans ce pays, ainsi que ceux qui habitent dans le pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ainsi je donnerai Sédécias… » Le verbe hébreu signifie « donner »; la comparaison avec les figues mauvaises fournit le sens elliptique. On peut aussi rendre : « je livrerai Sédécias… », mais cette formulation explicite davantage le sens de jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כַ/תְּאֵנִים הָרָעוֹת
  choice: Mais, comme les mauvaises figues
  rationale: « Mais » marque naturellement le contraste avec les bonnes figues du contexte précédent, tandis que « comme » conserve explicitement la comparaison. Dans le cadre de la qualité des fruits, רָעוֹת signifie ici « mauvaises » plutôt que « méchantes ».
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: qu’on ne peut manger tant elles sont mauvaises
  rationale: Cette formulation française exprime l’impossibilité de les manger en raison de leur très mauvaise qualité et rend la valeur causale de מִן avec רֹעַ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: כֵּן אֶתֵּן
  choice: je traiterai de même[a]
  rationale: Le sens contextuel est que Yahweh fera subir aux personnes nommées un sort correspondant à celui des mauvaises figues. Cette formulation complète naturellement en français la comparaison dont le complément est implicite en hébreu; la note signale le verbe littéral « donner ».
- source_word: שָׂרָיו
  choice: ses hauts fonctionnaires
  rationale: שָׂרִים désigne ici les responsables politiques ou dignitaires de la cour. « Hauts fonctionnaires » est clair en français moderne et évite le sens dynastique moderne de « princes ».
- source_word: שְׁאֵרִית יְרוּשָׁלִַם
  choice: le reste de Jérusalem
  rationale: « Le reste » rend directement שְׁאֵרִית et demeure naturel en français, tout en conservant la notion prophétique d’un groupe subsistant.
- source_word: הַנִּשְׁאָרִים בָּאָרֶץ הַזֹּאת
  choice: qui demeure dans ce pays
  rationale: Le participe précise que ce reste est encore présent dans le pays. Le singulier « demeure » s’accorde avec le collectif « le reste ».
- source_word: וְהַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: ainsi que ceux qui habitent en Égypte
  rationale: « Habitent » rend le participe יֹשְׁבִים dans un français actuel. « En Égypte » exprime naturellement בְּאֶרֶץ מִצְרָיִם sans alourdir la phrase.
theological_decisions:
- issue: Interprétation de la formule de jugement כֵּן אֶתֵּן dans la comparaison avec les mauvaises figues
  choice: je traiterai de même
  alternative: ainsi je donnerai / je livrerai
  rationale: Le verbe נָתַן signifie normalement « donner », mais son complément comparatif est implicite ici. « Je traiterai de même » préserve la correspondance annoncée entre les personnes et les mauvaises figues sans préciser prématurément la forme du jugement, développée dans les versets suivants. La traduction plus littérale est conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit le mouvement de la comparaison hébraïque tout en plaçant la formule « voici ce que dit Yahweh » de façon naturelle. « Hauts fonctionnaires » évite l’archaïsme de « princes », et « ceux qui habitent » conserve un ton soutenu sans être vieilli.
