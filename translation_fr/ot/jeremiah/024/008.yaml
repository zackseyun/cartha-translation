revisions:
- from: '« Mais, comme les mauvaises figues qu’on ne peut manger tant elles sont mauvaises, voici ce que dit Yahweh : je traiterai de même[a] Sédécias, roi de Juda, ses hauts fonctionnaires, le reste de Jérusalem qui demeure dans ce pays, ainsi que ceux qui habitent en Égypte. »'
  to: '« Mais, comme les mauvaises figues, trop mauvaises pour être mangées, voici ce que dit Yahweh : je traiterai ainsi[a] Sédécias, roi de Juda, ses hauts fonctionnaires, le reste de Jérusalem qui demeure dans ce pays, ainsi que ceux qui habitent dans le pays d’Égypte. »'
  rationale: La révision conserve l’image et l’ambiguïté syntaxique de l’hébreu tout en produisant un français moderne plus fluide. Elle ne précise pas la nature du jugement au-delà de ce que permet la comparaison, et la note rend compte de « donner » sans transformer l’image en un sort explicitement décrit dans ce seul verset.
