  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique ויהי דבר־יהוה אלי, « la parole … me fut adressée » est une tournure française naturelle et digne qui exprime la venue de la parole sans calquer lourdement l’hébreu.
- source_word: דְבַר
  choice: parole
  rationale: « Parole » conserve la portée du terme hébreu et la formule prophétique biblique récurrente; « message » serait possible, mais moins formellement proche.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin personnel écrit dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom indirect dans « me fut adressée » rend naturellement en français la direction exprimée par אֵלַי, littéralement « vers moi / à moi ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles qui suivent et rendent la fonction discursive de לֵאמֹר sans la tournure pesante « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel, tandis que « le SEIGNEUR » reflète une tradition de substitution liturgique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation maintient la formule prophétique traditionnelle tout en évitant un calque peu idiomatique. Les deux-points relient ce verset à la parole directe du verset suivant.
