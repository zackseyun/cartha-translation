  text: הַ/דּ֣וּד אֶחָ֗ד תְּאֵנִים֙ טֹב֣וֹת מְאֹ֔ד כִּ/תְאֵנֵ֖י הַ/בַּכֻּר֑וֹת וְ/הַ/דּ֣וּד אֶחָ֗ד תְּאֵנִים֙ רָע֣וֹת מְאֹ֔ד אֲשֶׁ֥ר לֹא תֵֽאָכַ֖לְנָה מֵ/רֹֽעַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/002.yaml
  text: One basket had very good figs[a], like first-ripe figs, and one basket had very bad figs[b], which could not be eaten because of their badness.
translation:
  language: fr
  text: Un panier contenait de très bonnes figues, comme les figues qui mûrissent les premières[a] ; l’autre panier contenait de très mauvaises figues, si mauvaises qu’on ne pouvait pas les manger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme les figues précoces » ou « comme les figues de la première récolte ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement en hébreu : « qui ne pouvaient pas être mangées à cause de leur mauvaiseté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּד
  choice: panier
  rationale: Dans cette vision, le récipient contient des figues déposées devant le temple. « Panier » convient naturellement au contexte, même si le nom peut désigner ailleurs un pot ou un chaudron.
- source_word: אֶחָד ... אֶחָד
  choice: l’un ... l’autre
  rationale: Cette tournure française naturelle rend la répartition entre les deux récipients sans alourdir la phrase par la répétition de « un panier ».
- source_word: תְּאֵנִים
  choice: figues
  rationale: Équivalent direct du fruit nommé dans la vision.
- source_word: טֹבוֹת מְאֹד
  choice: de très bonnes
  rationale: Rend simplement l’adjectif renforcé par מְאֹד et maintient le contraste marqué avec les mauvaises figues.
- source_word: כִּתְאֵנֵי הַבַּכֻּרוֹת
  choice: comme les figues qui mûrissent les premières
  rationale: Préserve l’idée des premières figues arrivées à maturité, sans réduire le terme à une catégorie technique de récolte.
- source_word: רָעוֹת מְאֹד
  choice: de très mauvaises
  rationale: Rendu direct qui forme en français un contraste net avec « de très bonnes ».
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: si mauvaises qu’on ne pouvait pas les manger
  rationale: Formulation idiomatique qui conserve la relation causale exprimée par מֵרֹעַ sans préciser indûment si les figues étaient pourries ou atteintes d’un autre défaut.
