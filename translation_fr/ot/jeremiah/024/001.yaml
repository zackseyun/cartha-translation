source:
  edition: WLC
  text: הִרְאַ/נִי֮ יְהוָה֒ וְ/הִנֵּ֗ה שְׁנֵי֙ דּוּדָאֵ֣י תְאֵנִ֔ים מוּעָדִ֕ים לִ/פְנֵ֖י הֵיכַ֣ל יְהוָ֑ה אַחֲרֵ֣י הַגְל֣וֹת נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֡ל אֶת יְכָנְיָ֣הוּ בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָה֩ וְ/אֶת שָׂרֵ֨י יְהוּדָ֜ה וְ/אֶת הֶ/חָרָ֤שׁ וְ/אֶת הַ/מַּסְגֵּר֙ מִ/יר֣וּשָׁלִַ֔ם וַ/יְבִאֵ֖/ם בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/001.yaml
  text: Yahweh showed me[a], and behold, two baskets of figs were set before the temple of Yahweh, after Nebuchadrezzar king of Babylon had taken into exile Jeconiah son of Jehoiakim, king of Judah, along with the officials of Judah, the craftsmen, and the smiths from Jerusalem[c][b], and had brought them to Babylon.
translation:
  language: fr
  text: 'Après que Nebucadretsar[a], roi de Babylone, eut déporté de Jérusalem Jéconias, fils de Jojakim et roi de Juda, ainsi que les responsables[b] de Juda, les artisans et les forgerons[c], et les eut emmenés à Babylone, Yahweh me fit voir, et voici : deux corbeilles de figues étaient placées devant le temple de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme hébraïque est « Nebucadretsar » ; le français emploie plus couramment « Nabuchodonosor ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les chefs de Juda » ; le terme peut aussi désigner des princes ou des dirigeants.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les ouvriers du métal » ; le sens précis du terme hébreu est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאַנִי
  choice: me fit voir ceci
  rationale: Le hiphil de ראה signifie « faire voir, montrer ». Cette tournure garde la dimension de révélation tout en introduisant naturellement la scène montrée au prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, plutôt que substitution par un titre.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » restitue la présentation vive et soudaine marquée par הִנֵּה dans un français actuel et digne.
- source_word: שְׁנֵי דּוּדָאֵי תְאֵנִים
  choice: deux corbeilles de figues
  rationale: דּוּד peut désigner un récipient ou un panier ; avec des figues, « corbeilles » est précis et naturel en français.
- source_word: מוּעָדִים
  choice: placées
  rationale: Dans ce contexte, le participe passif indique que les corbeilles ont été disposées devant le temple.
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahweh
  rationale: הֵיכָל désigne ici l’édifice du temple ; « temple » est le terme français le plus clair.
- source_word: הַגְלוֹת
  choice: eut déporté
  rationale: L’infinitif hiphil exprime l’action de conduire en exil. Le plus-que-parfait antérieur français marque clairement que cette déportation précède la vision.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebucadretsar
  rationale: Cette translittération suit la forme hébraïque du nom présente dans ce verset, sans l’harmoniser silencieusement avec sa forme française traditionnelle.
- source_word: יְכָנְיָהוּ
  choice: Jéconias
  rationale: Forme française traditionnelle et reconnaissable du nom porté par le roi dans ce verset.
- source_word: שָׂרֵי יְהוּדָה
  choice: les hauts fonctionnaires de Juda
  rationale: שָׂרִים désigne les détenteurs d’une autorité politique. « Hauts fonctionnaires » évite de suggérer qu’il s’agit nécessairement de fils de roi.
- source_word: הֶחָרָשׁ
  choice: les artisans
  rationale: Le singulier collectif חָרָשׁ désigne ici une catégorie de travailleurs qualifiés ; le pluriel français en rend le sens collectif.
- source_word: הַמַּסְגֵּר
  choice: les forgerons
  rationale: Le terme désigne probablement une catégorie d’ouvriers travaillant le métal, mais son sens technique exact reste incertain.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. Sa translittération préserve la distinction entre ce nom et un titre.
- issue: Nature des groupes professionnels déportés
  choice: les artisans et les forgerons
  alternative: les artisans et les ouvriers du métal
  rationale: Le texte distingue deux groupes, mais le métier précis exprimé par הַמַּסְגֵּר est discuté. Le texte principal retient le rendu traditionnel plausible et la note conserve l’alternative plus large.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici » maintient la vivacité de la vision. La seconde phrase réorganise légèrement l’ordre des constituants pour lever toute ambiguïté syntaxique en français, sans modifier les participants ni la chronologie.
