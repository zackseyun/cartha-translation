id: JER.24.9
reference: Jeremiah 24:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/נְתַתִּי/ם֙ ל/זועה לְ/רָעָ֔ה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ לְ/חֶרְפָּ֤ה וּ/לְ/מָשָׁל֙ לִ/שְׁנִינָ֣ה וְ/לִ/קְלָלָ֔ה בְּ/כָל הַ/מְּקֹמ֖וֹת אֲשֶֽׁר אַדִּיחֵ֥/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/009.yaml
  text: I will make them a horror[a], a calamity, to all the kingdoms of the earth—a reproach, a proverb, a taunt[c][b], and a curse in all the places where I drive them.
translation:
  language: fr
  text: Je ferai d’eux un objet d’épouvante[a], un malheur pour tous les royaumes de la terre, un sujet de honte, un proverbe[b], un objet de raillerie et une malédiction, dans tous les lieux où je les chasserai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une cause d’horreur ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « proverbe » peut désigner une formule que l’on répète à leur sujet avec mépris.
    reason: lexical_alternative
  - marker: c
    text: Ou « bannirai ». Le verbe peut signifier chasser au loin ou bannir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: Je ferai d’eux
  rationale: Avec la suite de compléments introduits par ל, נתן exprime ici le fait de placer des personnes dans un état ou de faire d’elles quelque chose. Cette tournure française est naturelle et conserve la valeur résultative.
- source_word: לְזַוֲעָה
  choice: un objet d’épouvante
  rationale: Le nom désigne ce qui provoque l’effroi ou le frisson. « Objet d’épouvante » rend explicitement le fait qu’ils inspireront l’horreur aux autres.
- source_word: לְרָעָה
  choice: un malheur
  rationale: Dans ce contexte de jugement, רָעָה évoque une réalité funeste ou désastreuse. « Un malheur » conserve la force nominale de l’énumération sans réduire le terme à une faute morale.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: pour tous les royaumes de la terre
  rationale: La préposition marque ici les royaumes devant lesquels, ou pour lesquels, ils deviendront un spectacle funeste. « Pour » s’intègre naturellement à la syntaxe française tout en maintenant la portée universelle.
- source_word: לְחֶרְפָּה
  choice: un sujet de honte
  rationale: חֶרְפָּה désigne la honte, l’opprobre ou le déshonneur infligé publiquement. Cette expression est claire en français courant et garde la dimension sociale du terme.
- source_word: וּלְמָשָׁל
  choice: un proverbe
  rationale: מָשָׁל peut désigner un proverbe ou une formule devenue exemplaire. Le terme direct est conservé, tandis qu’une note signale la nuance péjorative propre au contexte.
- source_word: לִשְׁנִינָה
  choice: un objet de raillerie
  rationale: Ce nom rare renvoie à des propos moqueurs ou à une formule répétée avec dérision. La traduction distingue cette idée de celle de מָשָׁל et reste idiomatique.
- source_word: וְלִקְלָלָה
  choice: une malédiction
  rationale: קְלָלָה désigne une malédiction; leur sort deviendra notamment une formule servant à maudire. Le substantif français préserve la concision de l’hébreu.
- source_word: בְּכָל הַמְּקֹמוֹת
  choice: dans tous les lieux
  rationale: Cette traduction formelle conserve la portée distributive de כֹּל et introduit clairement la proposition relative.
- source_word: אֲשֶׁר אַדִּיחֵם שָׁם
  choice: où je les chasserai
  rationale: 'Le hifil de נדח exprime une action énergique: repousser, chasser ou bannir. « Chasser » garde cette force sans préciser davantage le mode de dispersion.'
theological_decisions:
- issue: Nature de la formule de jugement
  choice: Maintenir l’accumulation de statuts et de conséquences exprimés par les substantifs successifs.
  alternative: Fondre toute la série dans une paraphrase générale décrivant seulement leur désastre ou leur humiliation.
  rationale: La répétition de ל en hébreu donne à la sentence son intensité rhétorique. Conserver l’énumération respecte le jugement annoncé sans lui ajouter une interprétation doctrinale.
- issue: Portée de רָעָה dans ce contexte
  choice: Traduire par « un malheur », au sens de réalité funeste ou calamiteuse.
  alternative: Traduire par « un mal » ou « une chose mauvaise », ce qui pourrait être compris principalement comme une qualification morale.
  rationale: Le contexte porte sur le désastre public résultant du jugement. « Malheur » rend cette dimension tout en conservant la tension du vocabulaire hébreu de רָעָה.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’accumulation solennelle de l’hébreu, tout en employant des expressions idiomatiques comme « objet d’épouvante », « sujet de honte » et « objet de raillerie ».
