  source_fidelity: 'La triade de jugements est fidèlement rendue : « l’épée, la famine et la peste ». « Contre eux » rend correctement la valeur hostile de בָם, et « jusqu’à ce qu’ils aient disparu du pays » conserve l’aboutissement de תמם et l’éloignement du territoire exprimé par מֵעַל הָאֲדָמָה, sans imposer une modalité précise de disparition.'
