  text: וְ/שִׁלַּ֣חְתִּי בָ֔/ם אֶת הַ/חֶ֖רֶב אֶת הָ/רָעָ֣ב וְ/אֶת הַ/דָּ֑בֶר עַד תֻּמָּ/ם֙ מֵ/עַ֣ל הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/הֶ֖ם וְ/לַ/אֲבוֹתֵי/הֶֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/010.yaml
  text: And I will send against them the sword[a], the famine, and the pestilence, until they are consumed from the land that I gave to them and to their fathers.
translation:
  language: fr
  text: J’enverrai contre eux l’épée, la famine et la peste[a], jusqu’à ce qu’ils aient disparu du pays que je leur ai donné, à eux et à leurs pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’épidémie ». Le terme hébreu peut désigner plus largement une maladie épidémique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי בָם
  choice: J’enverrai contre eux
  rationale: Le piel de שׁלח avec ב et des agents de jugement exprime ici un envoi dirigé contre eux. Cette formulation conserve l’action divine et la valeur hostile de la préposition.
- source_word: הַחֶרֶב
  choice: l’épée
  rationale: Le terme désigne littéralement l’épée et, par métonymie, la guerre ou la mort violente. Le concret est maintenu afin de préserver la triade prophétique.
- source_word: הָרָעָב
  choice: la famine
  rationale: Dans cette formule de jugement, רָעָב désigne la famine plutôt que la simple sensation de faim.
- source_word: הַדָּבֶר
  choice: la peste
  rationale: Dans les formules prophétiques, דֶּבֶר désigne une épidémie meurtrière. « La peste » est le terme français traditionnel et naturel pour cette catégorie, sans nécessairement identifier une maladie précise.
- source_word: עַד תֻּמָּם
  choice: jusqu’à ce qu’ils disparaissent
  rationale: La forme de תמם indique qu’ils seront menés à leur terme, entièrement éliminés. « Disparaissent » exprime naturellement ce résultat sans suggérer qu’ils seraient matériellement consumés par le feu.
- source_word: מֵעַל הָאֲדָמָה
  choice: du pays
  rationale: מֵעַל marque l’éloignement de dessus ou hors de, tandis que אֲדָמָה désigne ici le territoire donné par Dieu. En français, « disparaître du pays » rend naturellement l’ensemble.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם וְלַאֲבוֹתֵיהֶם
  choice: que j’ai donné à eux et à leurs pères
  rationale: La construction hébraïque attribue explicitement le pays aux destinataires et à leurs pères. La répétition de « à » préserve cette coordination, et « pères » maintient la spécificité historique et patriarcale du texte.
theological_decisions:
- issue: Langage du don de la terre dans le cadre de l’alliance
  choice: le pays que j’ai donné à eux et à leurs pères
  alternative: le pays que je leur ai donné, ainsi qu’à leurs ancêtres
  rationale: « Pères » conserve la formulation masculine et historiquement précise de אבותיהם, tandis que « donné à eux et à » évite de fondre les deux groupes en un seul complément ambigu.
translation_notes:
  register: Français moderne, international et digne. La structure solennelle de la triade « l’épée, la famine et la peste » est conservée. Aucun marqueur de note n’est requis, car « peste » rend directement le sens contextuel du terme hébreu.
