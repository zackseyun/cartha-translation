base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/003.yaml
  text: Then Yahweh said to me[a], “What do you see, Jeremiah?” And I said, “Figs—the good figs are very good, and the bad figs are very bad, so bad that they cannot be eaten.”
translation:
  language: fr
  text: 'Alors Yahweh me dit : « Que vois-tu, Jérémie ? » Je répondis : « Des figues. Les bonnes figues sont très bonnes, et les mauvaises figues sont très mauvaises, si mauvaises qu’on ne peut pas les manger[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’on ne peut pas manger à cause de leur mauvais état ».'
    reason: La préposition מֵרֹעַ peut exprimer la cause de leur caractère non comestible; le texte principal rend naturellement sa valeur intensive.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: Alors Yahweh me dit
  rationale: Le waw consécutif fait progresser le récit; « alors » rend naturellement cette succession, et le présent de narration convient au français moderne.
- source_word: מָה אַתָּה רֹאֶה
  choice: Que vois-tu
  rationale: Rend simplement et directement la question construite avec le participe, tout en conservant son immédiateté.
- source_word: תְּאֵנִים
  choice: Des figues
  rationale: Identification concise de ce que voit Jérémie; le pluriel est conservé.
- source_word: הַתְּאֵנִים הַטֹּבוֹת טֹבוֹת מְאֹד
  choice: Les bonnes figues sont très bonnes
  rationale: Conserve la répétition emphatique de « bonnes » présente dans l’hébreu.
- source_word: וְהָרָעוֹת רָעוֹת מְאֹד
  choice: et les mauvaises sont très mauvaises
  rationale: Dans ce contexte, רָעוֹת qualifie la mauvaise qualité des fruits plutôt qu’un mal moral; la répétition emphatique est maintenue.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: au point qu’on ne peut pas les manger tant elles sont mauvaises
  rationale: Exprime à la fois l’impossibilité de les manger et la valeur causale ou intensive de מֵרֹעַ, sans préciser indûment qu’elles sont pourries.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme; sa transcription préserve le nom personnel plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le présent de narration allège le récit; « je répondis » marque naturellement la réplique. La répétition « bonnes… très bonnes / mauvaises… très mauvaises » reproduit l’insistance de l’hébreu.
