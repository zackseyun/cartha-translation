source:
  edition: WLC
  text: שָׂמָ/הּ֙ לִ/שְׁמָמָ֔ה אָבְלָ֥ה עָלַ֖/י שְׁמֵמָ֑ה נָשַׁ֨מָּה֙ כָּל הָ/אָ֔רֶץ כִּ֛י אֵ֥ין אִ֖ישׁ שָׂ֥ם עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/011.yaml
  text: They have made it a desolation[a]; it mourns before me, desolate. The whole land is laid waste[c][b], because no one takes it to heart.
translation:
  language: fr
  text: Il l’a réduite à la désolation[a] ; elle se lamente devant moi, désolée. Tout le pays[b] est dévasté, car personne ne le prend à cœur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il en a fait une désolation. » Le verbe hébreu est au singulier ; d’après le contexte, le sujet pourrait toutefois être collectif et renvoyer aux dévastateurs mentionnés auparavant.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu peut aussi être traduit par « terre » ; ici, il désigne probablement le territoire dévasté de Juda.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « personne ne met sur son cœur », une expression qui signifie que personne n’y prête une attention sérieuse ou ne le prend à cœur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמָהּ
  choice: Il en a fait
  rationale: Le verbe hébreu est à la troisième personne du masculin singulier et porte un suffixe féminin singulier. « Il en a fait » en respecte la forme sans imposer dans le texte un sujet pluriel tiré du contexte.
- source_word: לִשְׁמָמָה
  choice: un lieu désolé
  rationale: שְׁמָמָה désigne un état ou un lieu de désolation. Cette formulation naturelle en français conserve l’image concrète de la dévastation.
- source_word: אָבְלָה
  choice: il est en deuil
  rationale: Le verbe אבל exprime le deuil. Le pronom masculin s’accorde naturellement avec « lieu » et peut reprendre l’héritage ou le territoire évoqué dans le contexte.
- source_word: עָלַי
  choice: devant moi
  rationale: Dans cette plainte prononcée par Dieu, « devant moi » rend naturellement l’idée que le territoire endeuillé se trouve sous son regard, tout en évitant de faire de Dieu la cause explicite du deuil.
- source_word: שְׁמֵמָה
  choice: dévasté
  rationale: L’adjectif décrit l’état de désolation. « Dévasté » évite une répétition lourde de « désolé » tout en gardant la brève apposition hébraïque.
- source_word: נָשַׁמָּה
  choice: est ravagé
  rationale: La forme exprime l’état résultant de la dévastation. « Est ravagé » est idiomatique et vigoureux en français actuel.
- source_word: כָּל הָאָרֶץ
  choice: Tout le pays
  rationale: אֶרֶץ peut désigner la terre ou un pays. Le contexte immédiat concerne le territoire de Juda ; « pays » rend donc au mieux le référent local.
- source_word: כִּי אֵין אִישׁ
  choice: car personne
  rationale: Bien que אִישׁ soit morphologiquement masculin singulier, la construction négative a ici une portée générique. « Personne » est le moyen naturel et exact de l’exprimer en français moderne.
- source_word: שָׂם עַל לֵב
  choice: ne le prend à cœur
  rationale: Littéralement, l’expression signifie « mettre sur le cœur ». L’idiome français « prendre à cœur » conserve le langage du cœur et l’idée de considérer sérieusement la situation.
theological_decisions:
- issue: Sujet de שָׂמָהּ
  choice: Il
  alternative: Ils / On
  rationale: Le singulier du texte hébreu est conservé. Le contexte peut orienter vers les dévastateurs mentionnés auparavant, mais le verset lui-même ne les nomme pas comme sujet ; une note maintient cette tension.
- issue: Référent de אֶרֶץ
  choice: pays
  alternative: terre
  rationale: Le jugement vise ici le territoire dévasté de Juda. « Pays » évite d’universaliser indûment la portée du verset, tandis qu’une note signale l’autre sens possible.
- issue: Portée générique de אִישׁ
  choice: personne
  alternative: aucun homme
  rationale: Dans « il n’y a pas אִישׁ », le nom masculin fonctionne comme indéfini négatif. « Personne » transmet cette portée universelle sans introduire l’idée que seules les personnes de sexe masculin sont visées.
translation_notes:
  register: Français international moderne, sobre et prophétique. La structure brève et répétitive de l’hébreu est conservée sans raideur excessive. Le singulier du premier verbe et l’ambiguïté de son sujet sont maintenus, avec éclaircissement en note.
