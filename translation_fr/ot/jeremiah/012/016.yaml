  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לָמֹ֣ד יִלְמְדוּ֩ אֶת דַּֽרְכֵ֨י עַמִּ֜/י לְ/הִשָּׁבֵ֤עַ בִּ/שְׁמִ/י֙ חַי יְהוָ֔ה כַּ/אֲשֶׁ֤ר לִמְּדוּ֙ אֶת עַמִּ֔/י לְ/הִשָּׁבֵ֖עַ בַּ/בָּ֑עַל וְ/נִבְנ֖וּ בְּ/ת֥וֹךְ עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/016.yaml
  text: And it will happen that if they indeed learn the ways of my people[a], to swear by my name, ‘As Yahweh lives,’ just as they taught my people to swear by Baal[c][b], then they will be built up in the midst of my people.
translation:
  language: fr
  text: 'Et il arrivera que, s’ils apprennent vraiment les voies de mon peuple[a], en jurant par mon nom : « Aussi vrai que Yahweh est vivant[b] », comme ils ont enseigné à mon peuple à jurer par Baal, alors ils seront établis au milieu de mon peuple[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu associe un infinitif absolu au verbe conjugué pour mettre l’apprentissage en relief. On pourrait aussi traduire : « s’ils apprennent pleinement » ou « s’ils apprennent bel et bien ».'
    reason: lexical_alternative
  - marker: b
    text: 'Formule hébraïque de serment, également traduisible littéralement : « Yahweh est vivant. »'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils seront bâtis parmi mon peuple ». L’hébreu dit littéralement : « ils seront construits au milieu de mon peuple ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Et voici ce qui arrivera
  rationale: Rend naturellement en français moderne la formule hébraïque qui introduit une éventualité future et son résultat.
- source_word: לָמֹד יִלְמְדוּ
  choice: ils apprennent vraiment
  rationale: L’infinitif absolu suivi du verbe conjugué souligne l’action. « Vraiment » conserve cette emphase sans ajouter l’idée particulière d’assiduité.
- source_word: דַּרְכֵי עַמִּי
  choice: les voies de mon peuple
  rationale: « Voies » préserve la métaphore hébraïque et sa portée à la fois pratique, morale et cultuelle.
- source_word: לְהִשָּׁבֵעַ בִּשְׁמִי
  choice: de manière à jurer par mon nom
  rationale: Cette formulation exprime le contenu concret de l’apprentissage tout en maintenant le vocabulaire du serment.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Formule française idiomatique qui restitue la valeur performative de la formule hébraïque de serment.
- source_word: כַּאֲשֶׁר לִמְּדוּ אֶת עַמִּי
  choice: tout comme ils ont appris à mon peuple
  rationale: Conserve le parallèle délibéré entre l’influence idolâtre passée des nations et leur possible apprentissage des voies du peuple de Dieu.
- source_word: לְהִשָּׁבֵעַ בַּבָּעַל
  choice: à jurer par Baal
  rationale: Maintient le parallélisme exact avec le serment prêté par le nom de Yahweh.
- source_word: וְנִבְנוּ
  choice: alors ils seront édifiés
  rationale: Préserve la métaphore passive de la construction sans la réduire à la prospérité matérielle ni expliciter excessivement l’idée d’intégration.
- source_word: בְּתוֹךְ עַמִּי
  choice: au milieu de mon peuple
  rationale: Rend directement l’expression spatiale hébraïque et laisse ouverte la portée communautaire de cette incorporation.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin propre. « Yahweh » le représente directement et permet de conserver le contraste explicite avec Baal.
- issue: Portée de וְנִבְנוּ בְּתוֹךְ עַמִּי
  choice: ils seront édifiés au milieu de mon peuple
  alternative: ils seront établis parmi mon peuple
  rationale: Le rendu choisi conserve la métaphore hébraïque de la construction ainsi que l’ambiguïté entre établissement, restauration et incorporation au sein du peuple de Dieu.
- issue: Relation exprimée par לְהִשָּׁבֵעַ
  choice: de manière à jurer par mon nom
  alternative: en jurant par mon nom
  rationale: L’infinitif peut préciser le contenu ou le résultat de l’apprentissage. La formulation retenue garde ce lien sans en faire seulement une circonstance temporelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste légèrement solennelle pour convenir au discours prophétique. Les métaphores des « voies » et de l’édification sont maintenues, tandis que les notes signalent les principales possibilités lexicales sans résoudre l’ambiguïté théologique.
