- from: 'Et voici ce qui arrivera : s’ils apprennent vraiment les voies de mon peuple[a], de manière à jurer par mon nom en disant : « Aussi vrai que Yahweh est vivant[b] », tout comme ils ont appris à mon peuple à jurer par Baal, alors ils seront édifiés au milieu de mon peuple[c].'
  to: 'Et il arrivera que, s’ils apprennent vraiment les voies de mon peuple[a], en jurant par mon nom : « Aussi vrai que Yahweh est vivant[b] », comme ils ont enseigné à mon peuple à jurer par Baal, alors ils seront établis au milieu de mon peuple[c].'
  rationale: La révision corrige le rendu du verbe « enseigner » et remplace deux formulations françaises susceptibles d’induire une nuance absente du texte source. Elle conserve l’emphase de « vraiment », le nom Yahweh, le parallélisme des serments et l’ouverture sémantique de ונבנו grâce à la note.
