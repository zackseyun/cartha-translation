source:
  edition: WLC
  text: כִּ֧י גַם אַחֶ֣י/ךָ וּ/בֵית אָבִ֗י/ךָ גַּם הֵ֨מָּה֙ בָּ֣גְדוּ בָ֔/ךְ גַּם הֵ֛מָּה קָרְא֥וּ אַחֲרֶ֖י/ךָ מָלֵ֑א אַל תַּאֲמֵ֣ן בָּ֔/ם כִּֽי יְדַבְּר֥וּ אֵלֶ֖י/ךָ טוֹבֽוֹת־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/006.yaml
  text: For even your brothers and your father’s house—even they have dealt treacherously with you[a]; even they have called out loudly after you. Do not trust them[b], though they speak good things to you.
translation:
  language: fr
  text: Car même tes frères[a] et la maison de ton père, eux aussi t’ont trahi ; eux aussi ont crié après toi à pleine voix[b]. Ne leur fais pas confiance, même s’ils t’adressent des paroles agréables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie le masculin « tes frères » ; dans ce contexte, il désigne les proches parents masculins de Jérémie, tandis que « la maison de ton père » englobe la maisonnée au sens large.
    reason: cultural_note
  - marker: b
    text: 'Ou : « ont appelé après toi de toute leur voix ». L’expression peut évoquer une clameur publique hostile ou une poursuite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֶיךָ
  choice: tes frères
  rationale: Le pluriel masculin de אָח désigne directement les frères de Jérémie, tout en pouvant parfois englober des proches parents. « Tes frères » conserve ici la forme genrée et le lien familial explicite.
- source_word: וּבֵית אָבִיךָ
  choice: et la maison de ton père
  rationale: Cette expression sociale et familiale désigne la maisonnée ou le groupe familial paternel. La formulation française conserve l’image hébraïque sans la réduire au terme plus général « famille ».
- source_word: בָּגְדוּ בָךְ
  choice: t’ont trahi
  rationale: בגד exprime la déloyauté, la perfidie ou la trahison. « T’ont trahi » rend avec naturel et force cette conduite envers Jérémie.
- source_word: קָרְאוּ אַחֲרֶיךָ מָלֵא
  choice: ont crié derrière toi à pleine voix
  rationale: קרא désigne ici un appel ou un cri, tandis que מָלֵא l’intensifie. « À pleine voix » préserve cette intensité et laisse ouverte la nature exacte, probablement hostile, de ce cri lancé derrière Jérémie.
- source_word: אַל תַּאֲמֵן בָּם
  choice: Ne leur fais pas confiance
  rationale: Au hiphil, אמן peut signifier croire ou se fier à quelqu’un. Le contexte de trahison et de paroles trompeusement favorables privilégie la confiance relationnelle.
- source_word: כִּי יְדַבְּרוּ אֵלֶיךָ טוֹבוֹת
  choice: même s’ils t’adressent des paroles agréables
  rationale: טוֹבוֹת qualifie des propos favorables, plaisants ou rassurants. Cette formulation naturelle indique leur apparence positive sans affirmer leur sincérité.
theological_decisions:
- issue: Valeur de כִּי devant la dernière proposition
  choice: même si
  alternative: car / quand
  rationale: Après l’interdiction de leur faire confiance, la proposition décrit la circonstance trompeuse dans laquelle cette interdiction reste valable. La valeur concessive convient au contexte, sans modifier la portée théologique de l’avertissement.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme « eux aussi » reproduit l’insistance de גַּם הֵמָּה. « Maison de ton père » conserve l’idiome familial ancien, éclairé par la note, tandis que « à pleine voix » maintient l’image expressive du texte hébreu.
