  source_fidelity: 'Le texte rend correctement les principaux termes : « tes frères », « la maison de ton père », la trahison, l’avertissement de ne pas faire confiance et les paroles favorables. Toutefois, « ont crié derrière toi » est ambigu en français et peut décrire une simple position spatiale plutôt que l’action de crier après quelqu’un. « Ont crié après toi à pleine voix » exprime plus clairement קָרְאוּ אַחֲרֶיךָ מָלֵא tout en conservant l’ambiguïté sur la nature exacte de la clameur.'
