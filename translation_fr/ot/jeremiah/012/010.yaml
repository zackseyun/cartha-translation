id: JER.12.10
reference: Jeremiah 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רֹעִ֤ים רַבִּים֙ שִֽׁחֲת֣וּ כַרְמִ֔/י בֹּסְס֖וּ אֶת חֶלְקָתִ֑/י נָֽתְנ֛וּ אֶת חֶלְקַ֥ת חֶמְדָּתִ֖/י לְ/מִדְבַּ֥ר שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/010.yaml
  text: Many shepherds have ruined my vineyard[a]; they have trampled my portion[b]; they have made my pleasant portion a desolate wilderness.
translation:
  language: fr
  text: De nombreux bergers ont ravagé ma vigne[a] ; ils ont piétiné la part qui m’appartient ; ils ont fait de la part qui m’est chère un désert dévasté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « De nombreux dirigeants » ou « De nombreux chefs » ; le mot hébreu signifie littéralement « bergers », image prophétique courante pour ceux qui gouvernent ou ont la charge du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעִים רַבִּים
  choice: De nombreux bergers
  rationale: Conserve la métaphore prophétique littérale des « bergers », qui peut désigner des dirigeants, sans réduire le sens à une catégorie précise.
- source_word: שִׁחֲתוּ
  choice: ont ravagé
  rationale: Exprime une grave détérioration dans le cadre agricole sans imposer l’idée d’une destruction totale.
- source_word: כַרְמִי
  choice: ma vigne
  rationale: Rendu direct qui préserve l’image prophétique de la vigne.
- source_word: בֹּסְסוּ
  choice: ont piétiné
  rationale: Restitue naturellement l’image concrète de ce qui est foulé aux pieds.
- source_word: חֶלְקָתִי
  choice: la part qui m’appartient
  rationale: חֶלְקָה peut désigner une part ou une parcelle. Cette formulation française rend clairement la possession sans préciser indûment « héritage » ou « terrain ».
- source_word: נָתְנוּ
  choice: ils ont fait de…
  rationale: Dans cette construction résultative avec לְ, le verbe signifie idiomatiquement « faire de » ou « transformer en ».
- source_word: חֶלְקַת חֶמְדָּתִי
  choice: la part qui m’est chère
  rationale: Rend la valeur affective et précieuse exprimée par חֶמְדָּה dans un français naturel, tout en conservant l’image de la part possédée.
- source_word: לְמִדְבַּר שְׁמָמָה
  choice: un désert dévasté
  rationale: Associe l’espace désertique de מִדְבָּר à la désolation de שְׁמָמָה dans une expression française concise et forte.
theological_decisions:
- issue: Interprétation des « bergers » comme dirigeants politiques ou religieux
  choice: Conserver « bergers » dans le texte
  alternative: dirigeants, chefs ou responsables religieux
  rationale: L’hébreu présente directement cette métaphore. La conserver maintient l’imagerie prophétique et évite de trancher entre plusieurs référents possibles.
- issue: Explication des images de la vigne et de la part comme désignant Juda, Israël ou le pays
  choice: Conserver les images de « vigne » et de « part »
  alternative: ma terre ou mon héritage
  rationale: Ces images possèdent plusieurs niveaux littéraires et théologiques. Les expliciter dans le texte principal en réduirait la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme poétique de l’hébreu. « La part qui m’appartient » évite le caractère abstrait ou financier que pourrait prendre isolément « ma part », tandis que « la part qui m’est chère » restitue l’affection exprimée par חֶמְדָּה.
