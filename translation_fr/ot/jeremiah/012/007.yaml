id: JER.12.7
reference: Jeremiah 12:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָזַ֨בְתִּי֙ אֶת בֵּיתִ֔/י נָטַ֖שְׁתִּי אֶת נַחֲלָתִ֑/י נָתַ֛תִּי אֶת יְדִד֥וּת נַפְשִׁ֖/י בְּ/כַ֥ף אֹיְבֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/007.yaml
  text: I have forsaken my house[a]; I have abandoned my inheritance[c][b]; I have given the beloved of my soul into the hand of her enemies.
translation:
  language: fr
  text: J’ai abandonné ma maison ; j’ai délaissé mon héritage ; j’ai livré la bien-aimée de mon âme[a] entre les mains de ses ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celle que mon âme aime » ou « celle qui m’est très chère ». L’expression hébraïque est une formule intime de profonde affection.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la paume de ses ennemis », c’est-à-dire sous leur pouvoir. Le suffixe hébreu traduit par « ses » est féminin ; il peut renvoyer à l’héritage personnifié, à Juda ou Jérusalem, ou à la bien-aimée. Le texte ne précise pas davantage.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַבְתִּי אֶת־בֵּיתִי
  choice: J’ai abandonné ma maison
  rationale: Le verbe עזב exprime ici le fait de laisser ou d’abandonner. « Ma maison » conserve l’expression ouverte du texte hébreu, qui peut évoquer la demeure, le Temple ou la maisonnée sans imposer un seul référent.
- source_word: נָטַשְׁתִּי אֶת־נַחֲלָתִי
  choice: j’ai délaissé mon héritage
  rationale: נטש renforce le premier verbe tout en restant distinct. « Délaissé » préserve le parallélisme sans répéter « abandonné », et « héritage » rend le langage d’appartenance et de possession associé à נחלה.
- source_word: נָתַתִּי
  choice: j’ai livré
  rationale: נתן signifie littéralement « donner », mais, avec le complément « entre les mains de ses ennemis », il désigne ici une remise au pouvoir d’adversaires. « Livré » exprime naturellement cette valeur en français.
- source_word: יְדִדוּת נַפְשִׁי
  choice: la bien-aimée de mon âme
  rationale: Cette expression affective désigne ce qui est profondément aimé par le locuteur. La formulation conserve à la fois son intensité, sa couleur poétique et sa forme féminine.
- source_word: בְּכַף אֹיְבֶיהָ
  choice: entre les mains de ses ennemis
  rationale: כף signifie littéralement « paume », mais l’expression indique le pouvoir ou la domination. « Entre les mains de » est l’équivalent idiomatique naturel en français.
theological_decisions:
- issue: Référent du suffixe féminin dans אֹיְבֶיהָ (« ses ennemis »)
  choice: Conserver « ses ennemis » et signaler l’ambiguïté en note.
  alternative: Préciser « les ennemis de Juda », « les ennemis de Jérusalem » ou « les ennemis de mon héritage ».
  rationale: 'Le suffixe hébreu est féminin, mais son référent exact n’est pas explicité : il peut renvoyer à l’héritage personnifié, à Juda ou Jérusalem, ou encore à la bien-aimée. La traduction ne tranche pas cette tension poétique et théologique.'
translation_notes:
  register: Français international actuel, digne et poétique. Le parallélisme des trois propositions est maintenu, ainsi que l’intensification qui conduit de l’abandon à la remise au pouvoir des ennemis.
