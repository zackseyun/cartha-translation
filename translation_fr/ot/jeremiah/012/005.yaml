id: JER.12.5
reference: Jeremiah 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אֶת רַגְלִ֥ים רַ֨צְתָּה֙ וַ/יַּלְא֔וּ/ךָ וְ/אֵ֥יךְ תְּתַֽחֲרֶ֖ה אֶת הַ/סּוּסִ֑ים וּ/בְ/אֶ֤רֶץ שָׁלוֹם֙ אַתָּ֣ה בוֹטֵ֔חַ וְ/אֵ֥יךְ תַּעֲשֶׂ֖ה בִּ/גְא֥וֹן הַ/יַּרְדֵּֽן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/005.yaml
  text: If you have run with footmen and they have worn you out[a], then how will you compete with horses? And if in a land of peace you feel secure, then what will you do in the thicket of the Jordan?
translation:
  language: fr
  text: Si tu as couru avec des hommes à pied et qu’ils t’ont épuisé, comment rivaliseras-tu avec des chevaux ? Et si tu te sens en sécurité dans un pays où règne la paix, que feras-tu dans les fourrés du Jourdain[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la majesté du Jourdain » ou « dans les hautes eaux du Jourdain ». L’expression hébraïque est discutée ; elle peut désigner la végétation dense des rives du Jourdain ou, plus littéralement, son « orgueil » ou sa « majesté ».
    reason: Lecture alternative d’une expression hébraïque ambiguë.
lexical_decisions:
- source_word: רַגְלִים
  choice: des hommes à pied
  rationale: Le terme désigne littéralement ceux qui vont à pied, ici opposés aux chevaux. « Hommes à pied » conserve cette comparaison sans imposer un cadre militaire aussi nettement que « fantassins ».
- source_word: רַצְתָּה
  choice: tu as couru
  rationale: Traduction directe du verbe « courir » ; le passé composé convient naturellement dans la proposition conditionnelle française.
- source_word: וַיַּלְאוּךָ
  choice: ils t’ont épuisé
  rationale: Le verbe exprime la fatigue ou l’épuisement causé. « Épuisé » est actuel, clair et suffisamment fort pour préparer la comparaison avec les chevaux.
- source_word: תְּתַחֲרֶה
  choice: rivaliseras-tu
  rationale: Le verbe évoque le fait d’entrer en compétition. « Rivaliser » maintient l’image de la course sans la limiter excessivement à une course organisée.
- source_word: הַסּוּסִים
  choice: des chevaux
  rationale: Équivalent lexical direct, qui préserve l’intensification du contraste avec les hommes à pied.
- source_word: בְאֶרֶץ שָׁלוֹם
  choice: dans un pays où règne la paix
  rationale: 'Cette formulation française naturelle conserve les deux notions concrètes du texte hébreu : le pays et la paix, comprise ici comme une situation exempte de troubles.'
- source_word: בּוֹטֵחַ
  choice: tu te sens en sécurité
  rationale: Dans ce contexte, le participe exprime l’assurance ou la sécurité éprouvée dans des conditions paisibles, plutôt qu’une confiance explicitement dirigée vers Dieu.
- source_word: תַּעֲשֶׂה
  choice: que feras-tu
  rationale: Rendu direct et idiomatique du verbe très général עשה dans cette question rhétorique.
- source_word: גְּאוֹן הַיַּרְדֵּן
  choice: les fourrés du Jourdain
  rationale: L’expression probablement géographique évoque la végétation dense et dangereuse des rives du Jourdain. Comme גאון signifie littéralement « orgueil », « majesté » ou peut évoquer une montée des eaux, l’ambiguïté est signalée en note.
theological_decisions:
- issue: Sens de בּוֹטֵחַ dans le contexte
  choice: sécurité liée à une situation paisible
  alternative: confiance, éventuellement comprise comme confiance en Dieu
  rationale: Le contraste porte sur une épreuve supportée dans des conditions favorables par rapport à un danger plus grand. La traduction évite donc d’introduire un objet théologique de la confiance que l’hébreu ne précise pas.
- issue: Interprétation de גְּאוֹן הַיַּרְדֵּן
  choice: la végétation dense et dangereuse bordant le Jourdain
  alternative: « l’orgueil/la majesté du Jourdain » ou « la crue du Jourdain »
  rationale: Le contexte favorise un lieu dangereux opposé au pays paisible, mais l’expression hébraïque reste discutée. Le texte principal donne le référent contextuel probable et la note préserve les autres possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement conserve l’adresse directe au prophète. Les deux questions rhétoriques et la progression entre une difficulté moindre et un danger plus grand sont maintenues.
