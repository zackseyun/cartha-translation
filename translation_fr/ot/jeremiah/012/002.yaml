  naturalness: « Ils croissent » et surtout « leur être profond » sont moins naturels en français international contemporain. « Ils poussent » et « leur for intérieur » sont plus idiomatiques tout en conservant le registre sobre et poétique. La formulation « près de leur bouche » est inhabituelle mais volontairement proche de l’image hébraïque et demeure intelligible dans ce contexte.
  terminology: La note explique adéquatement que « reins » est une expression anthropologique hébraïque relative à la vie intérieure et aux motivations cachées. « For intérieur » évite de substituer sans nécessité « cœur » au terme source et ne charge pas le texte d’une lecture doctrinale.
