  text: נְטַעְתָּ/ם֙ גַּם שֹׁרָ֔שׁוּ יֵלְכ֖וּ גַּם עָ֣שׂוּ פֶ֑רִי קָר֤וֹב אַתָּה֙ בְּ/פִי/הֶ֔ם וְ/רָח֖וֹק מִ/כִּלְיוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/002.yaml
  text: You planted them; they have even taken root. They grow; they even produce fruit. You are near in their mouth[a], but far from their innermost being.
translation:
  language: fr
  text: Tu les as plantés, et ils ont pris racine. Ils poussent et portent du fruit. Tu es près de leur bouche[a], mais loin de leur for intérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « loin de leurs reins ». Dans la pensée hébraïque, les reins peuvent représenter l’être intérieur et ses motivations cachées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַעְתָּם
  choice: Tu les as plantés
  rationale: Le qal accompli, deuxième personne masculine singulière avec suffixe de troisième personne masculine plurielle, s’adresse directement à Dieu. Le passé composé est naturel en français et conserve l’action divine explicite.
- source_word: גַּם שֹׁרָשׁוּ
  choice: et ils ont pris racine
  rationale: שׁרשׁ signifie ici « prendre racine ». Dans cette succession, גַּם a une valeur additive que « et » rend naturellement sans alourdir la phrase par la répétition de « même ».
- source_word: יֵלְכוּ
  choice: Ils croissent
  rationale: Le sens premier est « aller, avancer » ; dans la métaphore végétale, le verbe décrit leur progression ou leur développement. « Ils croissent » maintient cette dynamique et s’intègre au champ lexical de la plantation, sans expliciter excessivement l’idée de prospérité.
- source_word: גַּם עָשׂוּ פֶרִי
  choice: et portent du fruit
  rationale: עשה פרי signifie idiomatiquement « produire/porter du fruit ». Le présent français convient à la description de leur état actuel ; גַּם est rendu par la coordination additive.
- source_word: קָרוֹב אַתָּה בְּפִיהֶם
  choice: Tu es près de leur bouche
  rationale: Cette formulation conserve l’image hébraïque de la bouche et le contraste spatial entre קָרוֹב et רָחוֹק. Elle suggère que Dieu est présent dans leurs paroles sans résoudre davantage l’implication.
- source_word: רָחוֹק מִכִּלְיוֹתֵיהֶם
  choice: loin de leur être profond
  rationale: כְּלָיוֹת désigne littéralement les reins, considérés en hébreu comme le siège de la vie intérieure, des sentiments ou des motivations cachées. « Être profond » communique cette valeur anthropologique en français courant ; le sens anatomique est signalé en note.
theological_decisions:
- issue: Métaphore anthropologique de כִּלְיוֹתֵיהֶם
  choice: leur être profond
  alternative: leurs reins ; leur for intérieur
  rationale: Le contraste oppose la confession extérieure à la réalité intérieure. Traduire anatomiquement par « reins » serait opaque pour beaucoup de lecteurs modernes, tandis que « cœur » remplacerait l’image source par une autre. « Être profond » conserve le sens sans imposer une interprétation doctrinale, et la note documente la métaphore hébraïque.
- issue: Portée de יֵלְכוּ dans la métaphore végétale
  choice: Ils croissent
  alternative: Ils avancent ; ils prospèrent
  rationale: Le verbe peut évoquer le fait d’avancer ou de prospérer. Dans la séquence planter–s’enraciner–porter du fruit, « croître » est naturel, tout en laissant implicite la prospérité des méchants qui motive la plainte.
translation_notes:
  register: Français international moderne, sobre et poétique. Le tutoiement convient à l’adresse directe à Dieu. La métaphore agricole est conservée, ainsi que l’opposition entre proximité dans la bouche et éloignement intérieur.
