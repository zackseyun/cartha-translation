  rationale: Révision limitée à deux expressions de style. « Ils poussent » actualise « ils croissent » tout en respectant la progression agricole de יֵלְכוּ. « Leur for intérieur » est une expression française établie pour l’intériorité cachée évoquée par כִּלְיוֹתֵיהֶם; la note conserve l’ancrage anatomique littéral et son sens culturel. Aucun changement de sens théologique ni ajout interprétatif n’est introduit.
