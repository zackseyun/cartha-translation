source:
  edition: WLC
  text: זָרְע֤וּ חִטִּים֙ וְ/קֹצִ֣ים קָצָ֔רוּ נֶחְל֖וּ לֹ֣א יוֹעִ֑לוּ וּ/בֹ֨שׁוּ֙ מִ/תְּבוּאֹ֣תֵי/כֶ֔ם מֵ/חֲר֖וֹן אַף יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/013.yaml
  text: They have sown wheat[a], but they have reaped thorns; they have exhausted themselves, but they profit nothing. Be ashamed of your produce because of the burning anger of Yahweh.
translation:
  language: fr
  text: Ils ont semé du blé, mais ils ont récolté des épines ; ils se sont épuisés sans aucun profit. Ayez honte de vos récoltes[a], à cause de l’ardente colère de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et vous aurez honte de vos récoltes », si וּבֹשׁוּ est compris comme une forme prédictive plutôt que comme un impératif.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָרְעוּ חִטִּים
  choice: Ils ont semé du blé
  rationale: Le parfait qal décrit l’action accomplie, et חִטִּים désigne précisément le blé. Le passé composé est naturel en français et maintient le lien avec ses conséquences.
- source_word: וְקֹצִים קָצָרוּ
  choice: mais ils ont récolté des épines
  rationale: קֹצִים signifie « épines ». « Mais » explicite l’opposition portée ici par le waw, tandis que « récolté » rend naturellement קצר dans ce contexte agricole.
- source_word: נֶחְלוּ
  choice: ils se sont épuisés
  rationale: La forme est comprise comme un niphal de חלה exprimant l’affaiblissement ou l’épuisement causé par l’effort, sens qui convient au contexte mieux qu’une dérivation de נחל, « hériter ».
- source_word: לֹא יוֹעִלוּ
  choice: sans aucun profit
  rationale: Le hiphil de יעל exprime l’utilité ou le bénéfice. Cette formulation française concise restitue l’absence totale de résultat malgré l’effort.
- source_word: וּבֹשׁוּ
  choice: Ayez honte
  rationale: La forme est prise comme un impératif masculin pluriel, en accord avec le suffixe de deuxième personne plurielle dans « vos récoltes » et avec le passage prophétique à l’interpellation directe.
- source_word: מִתְּבוּאֹתֵיכֶם
  choice: de vos récoltes
  rationale: תְּבוּאָה peut désigner le produit, le rendement ou la récolte. Au pluriel, « vos récoltes » prolonge clairement l’image agricole en français.
- source_word: מֵחֲרוֹן אַף
  choice: à cause de l’ardente colère
  rationale: L’expression idiomatique évoque une colère brûlante ou violente. « Ardente colère » conserve cette image dans un registre digne et actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de représenter directement le tétragramme du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve sous une translittération française courante sans lui substituer un titre.
- issue: Valeur de וּבֹשׁוּ et changement de personne
  choice: 'impératif adressé directement au peuple : « Ayez honte »'
  alternative: 'prédictif : « vous aurez honte » ; continuation à la troisième personne : « ils ont eu honte »'
  rationale: La lecture impérative s’accorde naturellement avec le suffixe de deuxième personne plurielle de מִתְּבוּאֹתֵיכֶם et rend le brusque passage prophétique de la description à l’interpellation. La lecture prédictive reste possible et est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme agricole et l’opposition entre semailles et résultat sont conservés. Le passage de la troisième personne à l’adresse directe n’est pas lissé.
