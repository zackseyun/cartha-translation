source:
  edition: WLC
  text: צַדִּ֤יק אַתָּה֙ יְהוָ֔ה כִּ֥י אָרִ֖יב אֵלֶ֑י/ךָ אַ֤ךְ מִשְׁפָּטִים֙ אֲדַבֵּ֣ר אוֹתָ֔/ךְ מַדּ֗וּעַ דֶּ֤רֶךְ רְשָׁעִים֙ צָלֵ֔חָה שָׁל֖וּ כָּל בֹּ֥גְדֵי בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/001.yaml
  text: 'You are righteous[a], O Yahweh, when I bring a case before you[c][b]; yet I would speak with you about matters of justice: Why does the way of the wicked prosper? Why are all who deal treacherously at ease?'
translation:
  language: fr
  text: 'Tu es juste, Yahweh, quand je plaide ma cause devant toi. Pourtant, je veux parler avec toi de questions de justice[a] : Pourquoi la voie des méchants prospère-t-elle ? Pourquoi tous ceux qui agissent avec perfidie sont-ils tranquilles[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des jugements » ; le pluriel peut désigner des questions ou des affaires de justice.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie une tournure intensive, littéralement « tous les traîtres de trahison », pour souligner leur perfidie.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: juste
  rationale: Adjectif attribut exprimant la droiture morale de Yahweh; « juste » conserve aussi la tonalité judiciaire du contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin présent dans le texte hébreu.
- source_word: כִּי אָרִיב אֵלֶיךָ
  choice: quand je plaide ma cause devant toi
  rationale: Le verbe ריב peut désigner une contestation ou l'action de plaider une cause; le contexte judiciaire favorise cette formulation sans supprimer la hardiesse de Jérémie.
- source_word: מִשְׁפָּטִים
  choice: questions de justice
  rationale: Le pluriel renvoie ici à des questions ou affaires relevant de la justice plutôt qu'à des jugements déterminés.
- source_word: דֶּרֶךְ רְשָׁעִים
  choice: la conduite des méchants
  rationale: דֶּרֶךְ désigne métaphoriquement la manière de vivre; « conduite » rend naturellement ce sens en français actuel.
- source_word: צָלֵחָה
  choice: réussit
  rationale: Le verbe exprime le succès ou la prospérité; « réussir » s'accorde naturellement avec « conduite ».
- source_word: שָׁלוּ
  choice: vivent tranquilles
  rationale: Le terme évoque le calme, l'aisance ou l'absence de trouble, sans nécessairement exprimer la paix au sens théologique.
- source_word: בֹּגְדֵי בָגֶד
  choice: ceux qui trahissent sans scrupule
  rationale: La construction avec participe et nom apparenté intensifie la perfidie; « sans scrupule » transmet cette emphase sans calque maladroit.
theological_decisions:
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom propre divin; sa transcription préserve cette donnée.
- issue: Tonalité de כִּי אָרִיב אֵלֶיךָ
  choice: quand je plaide ma cause devant toi
  alternative: même si je conteste avec toi
  rationale: La traduction retient l'image judiciaire tout en préservant la tension entre la confession initiale de la justice de Dieu et la plainte audacieuse du prophète.
translation_notes:
  register: Français international moderne, digne et direct. La structure judiciaire du propos est conservée, tandis que les idiomes hébreux sont rendus de manière naturelle. Les deux interrogations maintiennent la plainte sans atténuer l'affirmation initiale de la justice de Yahweh.
