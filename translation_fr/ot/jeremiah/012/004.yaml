id: JER.12.4
reference: Jeremiah 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד מָתַי֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/עֵ֥שֶׂב כָּל הַ/שָּׂדֶ֖ה יִיבָ֑שׁ מֵ/רָעַ֣ת יֹֽשְׁבֵי בָ֗/הּ סָפְתָ֤ה בְהֵמוֹת֙ וָ/ע֔וֹף כִּ֣י אָמְר֔וּ לֹ֥א יִרְאֶ֖ה אֶת אַחֲרִיתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/004.yaml
  text: How long will the land mourn, and the grass of every field dry up? Because of the evil of those who dwell in it, beasts and birds are swept away, for they say, “He will not see our end.”
translation:
  language: fr
  text: 'Jusqu’à quand le pays sera-t-il en deuil,

    et l’herbe de tous les champs se desséchera-t-elle ?

    À cause de la méchanceté de ses habitants,

    les bêtes et les oiseaux ont disparu,

    car ils disent :

    « Il ne verra pas notre avenir[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « notre fin » ou « ce qui nous arrivera ».'
    reason: Signale l’étendue sémantique de אַחֲרִיתֵנוּ sans alourdir le texte principal.
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: sera-t-il en deuil
  rationale: Le verbe signifie « mener deuil » ou « se lamenter » ; cette personnification du pays est conservée.
- source_word: מֵרָעַת יֹשְׁבֵי בָהּ
  choice: À cause de la méchanceté de ses habitants
  rationale: Rend directement la relation causale et le sens moral de רָעָה dans ce contexte.
- source_word: סָפְתָה
  choice: ont disparu
  rationale: Le verbe exprime ici le fait d’être supprimé, emporté ou anéanti. « Ont disparu » est naturel en français et convient collectivement aux bêtes et aux oiseaux sans préciser le mécanisme.
- source_word: אַחֲרִיתֵנוּ
  choice: notre avenir
  rationale: אַחֲרִית peut désigner la fin, l’issue ou ce qui arrivera par la suite. « Notre avenir » préserve mieux cette amplitude que « notre fin », qui suggérerait presque nécessairement la mort en français.
theological_decisions:
- issue: Référent du sujet implicite de « il ne verra pas »
  choice: Conserver le simple pronom « Il » sans identifier son référent
  alternative: Expliciter « Dieu » ou « Jérémie »
  rationale: L’hébreu n’identifie pas le sujet dans ce verset. L’expliciter trancherait une ambiguïté réelle du texte.
- issue: Portée de « notre avenir »
  choice: Conserver l’indétermination entre avenir, issue et fin
  alternative: Traduire exclusivement par « notre fin »
  rationale: Le terme hébreu permet plusieurs nuances liées à l’aboutissement ou à ce qui vient ensuite ; la traduction ne doit pas imposer une lecture doctrinale ou narrative unique.
translation_notes:
  register: Français moderne, digne et accessible. La disposition poétique met en relief la plainte et la parole finale. « Pays » rend ici la terre habitée dont les habitants, les champs et les animaux sont en vue.
