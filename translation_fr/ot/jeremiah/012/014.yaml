source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עַל כָּל שְׁכֵנַ/י֙ הָֽ/רָעִ֔ים הַ/נֹּֽגְעִים֙ בַּֽ/נַּחֲלָ֔ה אֲשֶׁר הִנְחַ֥לְתִּי אֶת עַמִּ֖/י אֶת יִשְׂרָאֵ֑ל הִנְ/נִ֤י נֹֽתְשָׁ/ם֙ מֵ/עַ֣ל אַדְמָתָ֔/ם וְ/אֶת בֵּ֥ית יְהוּדָ֖ה אֶתּ֥וֹשׁ מִ/תּוֹכָֽ/ם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/014.yaml
  text: 'Thus says Yahweh concerning all my wicked neighbors who touch the inheritance that I caused my people Israel to inherit: behold[a], I am about to uproot them from upon their land[b], and I will uproot the house of Judah from among them.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh au sujet de tous mes voisins malfaisants qui touchent à l’héritage[a] que j’ai donné en héritage à mon peuple, Israël : voici, je vais les déraciner[b] de leur terre, et je déracinerai la maison de Juda du milieu d’eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui empiètent sur l’héritage ». L’hébreu dit littéralement « qui touchent à l’héritage » ; le contexte implique une atteinte hostile.
    reason: lexical_alternative
  - marker: b
    text: Ou « les arracher ». Le verbe hébreu évoque l’arrachage d’une plante et revient dans Jérémie comme image du jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique consacrée, proche de l’hébreu et naturelle dans un registre biblique français actuel. Le nom divin est translittéré.
- source_word: שְׁכֵנַי הָרָעִים
  choice: mes voisins malfaisants
  rationale: Le suffixe de première personne exige « mes voisins »; « malfaisants » exprime ici leur hostilité morale et leurs actes nuisibles sans la faiblesse de « mauvais » ni une surcharge interprétative.
- source_word: הַנֹּגְעִים בַּנַּחֲלָה
  choice: qui touchent à l’héritage
  rationale: La formulation conserve le sens concret de נגע, tandis que « toucher à » peut aussi suggérer en français une atteinte hostile. Une note explicite l’autre traduction contextuelle.
- source_word: אֲשֶׁר הִנְחַלְתִּי אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: que j’ai donné en héritage à mon peuple, Israël
  rationale: Cette tournure rend le causatif de נחל et maintient le lien lexical avec « héritage », tout en étant plus idiomatique que « que j’ai fait hériter ».
- source_word: הִנְנִי נֹתְשָׁם
  choice: me voici, je vais les déraciner
  rationale: « Me voici » rend l’emphase de הִנְנִי, et « je vais » communique la proximité de l’action portée par la construction avec le participe. « Déraciner » préserve l’image récurrente de Jérémie.
- source_word: מֵעַל אַדְמָתָם
  choice: de leur terre
  rationale: Rendu français naturel de l’éloignement exprimé par מֵעַל et du territoire ou sol désigné par אֲדָמָה.
- source_word: וְאֶת בֵּית יְהוּדָה אֶתּוֹשׁ מִתּוֹכָם
  choice: et je déracinerai la maison de Juda du milieu d’eux
  rationale: La répétition de « déraciner » conserve celle de נתש; « maison de Juda » maintient la désignation collective nationale, et « du milieu d’eux » suit précisément מִתּוֹכָם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Valeur de הִנְנִי suivi du participe נֹתְשָׁם
  choice: me voici, je vais les déraciner
  alternative: voici que je les déracine / je les déracinerai
  rationale: La construction annonce avec emphase une action divine imminente. Le choix français conserve à la fois l’auto-présentation emphatique et l’imminence, sans réduire la phrase à un simple futur.
- issue: Rapport entre le jugement des nations voisines et celui de Juda
  choice: répéter « déraciner » pour les voisins et pour Juda
  alternative: varier les verbes afin de distinguer les deux actions
  rationale: 'Le même radical hébreu נתש décrit les deux arrachements. La traduction garde cette tension : Yahweh juge les voisins hostiles tout en retirant aussi Juda de leur milieu.'
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve les répétitions et les images structurantes de l’hébreu, tout en évitant les calques peu naturels. Les marqueurs [a] et [b] figurent dans le texte à l’endroit correspondant à chaque note.
