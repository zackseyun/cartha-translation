  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָה֙ יְדַעְתָּ֔/נִי תִּרְאֵ֕/נִי וּ/בָחַנְתָּ֥ לִבִּ֖/י אִתָּ֑/ךְ הַתִּקֵ/ם֙ כְּ/צֹ֣אן לְ/טִבְחָ֔ה וְ/הַקְדִּשֵׁ֖/ם לְ/י֥וֹם הֲרֵגָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/003.yaml
  text: But you[a], O Yahweh, know me; you see me, and you test my heart toward you. Pull them out like sheep for slaughter[c][b], and set them apart for the day of killing.
translation:
  language: fr
  text: Mais toi, Yahvé, tu me connais ; tu me vois et tu examines mon cœur, tourné vers toi.[a] Arrache-les comme des brebis destinées à être égorgées, et mets-les à part[b] pour le jour du carnage.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu éprouves mon cœur, qui est avec toi ». L’expression hébraïque est très concise et peut évoquer l’orientation intérieure ou la fidélité de Jérémie envers Yahvé.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « consacre-les ». Le verbe signifie littéralement « mettre à part » ; ici, il s’agit d’une mise à part pour le jugement, non pour une bénédiction.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « pour le jour de la mise à mort » ou « pour le jour du massacre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est conservé sous sa forme française courante plutôt que remplacé par le titre « le Seigneur ».
- source_word: יְדַעְתָּנִי
  choice: tu me connais
  rationale: Le parfait hébreu exprime ici une connaissance établie et actuelle ; le présent est naturel en français dans ce contraste.
- source_word: תִּרְאֵנִי
  choice: tu me vois
  rationale: Le verbe désigne ici un regard qui discerne la personne, en parallèle avec « tu me connais ».
- source_word: וּבָחַנְתָּ לִבִּי
  choice: tu examines mon cœur
  rationale: בחן évoque la mise à l’épreuve ou l’examen de l’être intérieur. « Examines » est idiomatique et conserve cette portée.
- source_word: אִתָּךְ
  choice: tourné vers toi
  rationale: La formule hébraïque très compacte peut décrire l’orientation intérieure ou la loyauté de Jérémie envers Dieu. Cette traduction reste intelligible sans masquer l’ambiguïté, signalée en note.
- source_word: הַתִּקֵם
  choice: Arrache-les
  rationale: Le hiphil de נתק exprime l’action d’arracher ou d’emporter au loin. « Arrache-les » rend avec force la demande de jugement.
- source_word: כְּצֹאן לְטִבְחָה
  choice: comme des brebis destinées à être égorgées
  rationale: Cette formulation française naturelle conserve explicitement l’image violente de brebis vouées à l’abattage.
- source_word: וְהַקְדִּשֵׁם
  choice: mets-les à part
  rationale: Le hiphil de קדש signifie mettre à part ou consacrer. Ici, cette mise à part destine les méchants au jugement et non à une bénédiction.
- source_word: לְיוֹם הֲרֵגָה
  choice: pour le jour du carnage
  rationale: הֲרֵגָה désigne une mise à mort ou un massacre. « Carnage » conserve le ton sombre et collectif de la demande.
theological_decisions:
- issue: Prière imprécatoire contre les méchants
  choice: Conserver directement la demande de jugement et les images de mise à mort.
  alternative: Atténuer en parlant seulement de préparation au jugement ou d’exposition figurée.
  rationale: L’hébreu emploie explicitement le vocabulaire de l’égorgement et de la mise à mort. La traduction ne doit ni adoucir cette violence ni lui ajouter une justification théologique absente du verset.
- issue: Relation du cœur de Jérémie à Yahvé
  choice: Comprendre אִתָּךְ comme l’orientation du cœur « vers toi », tout en signalant la construction littérale.
  alternative: « mon cœur est avec toi »
  rationale: La syntaxe hébraïque permet plus d’une analyse. Le texte principal exprime naturellement l’orientation intérieure, tandis que la note préserve l’autre lecture sans trancher excessivement.
translation_notes:
  register: Français moderne, digne et direct. Les propositions brèves reproduisent la progression « connaître, voir, examiner ». L’image pastorale devient explicitement meurtrière, comme en hébreu, sans euphémisme. « Yahvé » est la forme française usuelle du nom divin.
