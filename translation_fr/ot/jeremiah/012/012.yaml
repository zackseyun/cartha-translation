revisions:
- from: Sur toutes les hauteurs dénudées du désert, des dévastateurs sont venus[a], car l’épée de Yahweh dévore d’un bout du pays à l’autre[b] ; il n’y a de paix pour aucun être vivant[c].
  to: Sur toutes les hauteurs dénudées du désert, des ravageurs sont venus[a], car l’épée de Yahweh dévore d’une extrémité du pays à l’autre extrémité du pays[b] ; il n’y a de paix pour aucun être vivant[c].
  rationale: La révision corrige le littéral de la note c, qui doit refléter « toute chair » malgré la portée négative de la phrase entière. Elle emploie aussi « ravageurs », plus naturel pour des agents de destruction, et restitue la répétition de « pays » présente dans l’hébreu. Les ancres a, b et c demeurent attachées respectivement aux ravageurs, à l’étendue de הארץ et à « être vivant ».
