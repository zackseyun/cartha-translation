source:
  edition: WLC
  text: עַֽל כָּל שְׁפָיִ֣ם בַּ/מִּדְבָּ֗ר בָּ֚אוּ שֹֽׁדְדִ֔ים כִּ֣י חֶ֤רֶב לַֽ/יהוָה֙ אֹֽכְלָ֔ה מִ/קְצֵה אֶ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ אֵ֥ין שָׁל֖וֹם לְ/כָל בָּשָֽׂר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/012.yaml
  text: Upon all the bare heights in the wilderness destroyers have come[a], for the sword of Yahweh is devouring from one end of the land to the other end of the land[c][b]; there is no peace for any flesh.
translation:
  language: fr
  text: Sur toutes les hauteurs dénudées du désert, des ravageurs sont venus[a], car l’épée de Yahweh dévore d’une extrémité du pays à l’autre extrémité du pays[b] ; il n’y a de paix pour aucun être vivant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pillards » ou « dévastateurs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « d’une extrémité de la terre à l’autre extrémité de la terre ». Le mot hébreu אֶרֶץ peut signifier « pays » ou « terre ».
    reason: alternative_reading
  - marker: c
    text: Littéralement « pour toute chair », expression qui désigne les êtres de chair, notamment les humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָיִם
  choice: hauteurs dénudées
  rationale: Le terme désigne des hauteurs exposées, sans couverture végétale. « Hauteurs dénudées » conserve cette image sans suggérer les hauts lieux cultuels.
- source_word: בַּמִּדְבָּר
  choice: du désert
  rationale: מִדְבָּר peut désigner le désert, la steppe ou une région sauvage. « Désert » convient au paysage poétique évoqué ici et reste naturel en français.
- source_word: שֹׁדְדִים
  choice: dévastateurs
  rationale: Le participe désigne ceux qui ravagent et pillent avec violence. « Dévastateurs » exprime clairement les effets de leur action militaire.
- source_word: חֶרֶב לַיהוָה
  choice: l’épée de Yahweh
  rationale: La tournure indique une épée appartenant à Yahweh ou mise en œuvre par lui. La formulation française conserve l’image personnifiée du jugement.
- source_word: אֹכְלָה
  choice: dévore
  rationale: La forme féminine s’accorde avec « épée » et décrit une action en cours. Le présent français rend avec vivacité cette personnification.
- source_word: מִקְצֵה אֶרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: d’un bout du pays à l’autre
  rationale: אֶרֶץ peut signifier « pays » ou « terre ». Le contexte immédiat favorise le pays dévasté, tandis qu’une note conserve l’autre possibilité. Cette expression française restitue naturellement la totalité exprimée par la répétition hébraïque.
- source_word: אֵין שָׁלוֹם
  choice: il n’y a de paix
  rationale: שָׁלוֹם comprend la paix, la sécurité et le bien-être. Dans ce contexte de guerre et de jugement, « paix » demeure le terme le plus direct et le plus ample.
- source_word: לְכָל בָּשָׂר
  choice: pour aucun être vivant
  rationale: Sous la négation, l’expression signifie qu’aucun être de chair n’échappe au désastre. « Aucun être vivant » rend l’idiome en français moderne, tandis que la note en indique la forme littérale.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- issue: Portée de אֶרֶץ
  choice: pays
  alternative: terre
  rationale: Le contexte de Jérémie 12 vise principalement le pays dévasté, probablement Juda, mais le mot hébreu permet aussi une portée plus universelle ; cette ambiguïté est signalée en note.
- issue: Portée de לְכָל בָּשָׂר
  choice: aucun être vivant
  alternative: nulle chair
  rationale: L’hébreu peut viser largement les êtres de chair plutôt que les seuls humains. La traduction conserve cette ampleur sans imposer une restriction anthropologique.
translation_notes:
  register: Français international moderne, poétique et digne. La phrase garde l’image forte de l’épée qui dévore, tout en rendant les idiomes hébreux de façon intelligible. Les ambiguïtés portant sur אֶרֶץ et בָּשָׂר sont préservées dans les notes.
