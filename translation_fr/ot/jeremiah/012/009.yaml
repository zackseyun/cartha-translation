  text: הַ/עַ֨יִט צָב֤וּעַ נַחֲלָתִ/י֙ לִ֔/י הַ/עַ֖יִט סָבִ֣יב עָלֶ֑י/הָ לְכ֗וּ אִסְפ֛וּ כָּל חַיַּ֥ת הַ/שָּׂדֶ֖ה הֵתָ֥יוּ לְ/אָכְלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/009.yaml
  text: Is my inheritance to me a speckled bird of prey? Are the birds of prey against her all around? Go[a], gather all the beasts of the field[b]; bring them to devour.
translation:
  language: fr
  text: Mon héritage est-il pour moi un rapace au plumage tacheté[a] ? Les rapaces[b] l’entourent-ils de toutes parts ? Allez, rassemblez toutes les bêtes sauvages ; amenez-les pour qu’elles dévorent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une hyène ». Certains comprennent le terme hébreu répété ici comme désignant un prédateur tel qu’une hyène. Le sens habituel est toutefois « rapace » ou « oiseau de proie ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le singulier « le rapace » ; il peut avoir ici une valeur collective.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַיִט
  choice: un rapace / les rapaces
  rationale: עַיִט désigne habituellement un oiseau de proie ou un charognard. « Rapace » conserve l’image zoologique sans préciser indûment l’espèce ; la seconde occurrence au singulier est comprise collectivement.
- source_word: צָבוּעַ
  choice: au plumage tacheté
  rationale: Le terme évoque une coloration bigarrée ou marquée. L’ajout de « plumage » rend naturellement en français son application au rapace sans supprimer l’étrangeté de l’image.
- source_word: נַחֲלָתִי
  choice: mon héritage
  rationale: « Héritage » traduit directement נַחֲלָה et en maintient les résonances d’appartenance et d’alliance, sans identifier explicitement le peuple ou le pays.
- source_word: לִי
  choice: pour moi
  rationale: La tournure conserve le datif hébreu et la force de la question rhétorique tout en restant idiomatique en français.
- source_word: הַעַיִט סָבִיב עָלֶיהָ
  choice: les rapaces sont-ils tout autour d’elle, contre elle ?
  rationale: Le singulier peut avoir une valeur collective. « Tout autour d’elle » rend סָבִיב et « contre elle » préserve la nuance hostile possible de עָלֶיהָ sans la confondre avec la seule localisation.
- source_word: לְכוּ אִסְפוּ
  choice: Allez, rassemblez
  rationale: Les deux impératifs constituent un appel direct à réunir les prédateurs.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: toutes les bêtes sauvages
  rationale: Cette formulation française naturelle exprime les animaux non domestiques visés par l’expression biblique « bêtes des champs ».
- source_word: הֵתָיוּ לְאָכְלָה
  choice: amenez-les pour qu’elles la dévorent
  rationale: La proposition finale exprime clairement le but de leur venue. Le complément « la » est implicite dans le contexte et désigne l’héritage personnifié au féminin.
theological_decisions:
- issue: Référent de « mon héritage »
  choice: Conserver « mon héritage » sans identifier davantage son référent.
  alternative: Préciser Juda, Jérusalem, le pays ou le peuple de l’alliance.
  rationale: Le contexte évoque le peuple ou le pays de YHWH soumis au jugement, mais le verset ne précise pas lui-même le référent ; la traduction garde donc cette ouverture.
- issue: Rapport des rapaces à l’héritage
  choice: 'Rendre à la fois l’encerclement et l’hostilité : « tout autour d’elle, contre elle ».'
  alternative: 'Ne rendre qu’une localisation : « tout autour d’elle ».'
  rationale: Cette formulation conserve la tension sémantique de סָבִיב עָלֶיהָ sans réduire le tableau à une simple position spatiale.
translation_notes:
  register: Français international moderne, digne et imagé. La syntaxe rhétorique de l’hébreu est conservée, tandis que « au plumage tacheté » et « bêtes sauvages » assurent une compréhension immédiate.
