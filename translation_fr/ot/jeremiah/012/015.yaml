source:
  edition: WLC
  text: וְ/הָיָ֗ה אַֽחֲרֵי֙ נָתְשִׁ֣/י אוֹתָ֔/ם אָשׁ֖וּב וְ/רִֽחַמְתִּ֑י/ם וַ/הֲשִׁבֹתִ֛י/ם אִ֥ישׁ לְ/נַחֲלָת֖/וֹ וְ/אִ֥ישׁ לְ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/015.yaml
  text: And it will happen[a], after I have uprooted them, that I will return and have compassion on them, and I will bring them back[c][b], each man to his inheritance and each man to his land.
translation:
  language: fr
  text: Après les avoir déracinés, je reviendrai vers eux et j’aurai compassion d’eux. Je les ramènerai, chacun vers son héritage et chacun vers son pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun vers son héritage et chacun vers son pays ». Le masculin singulier hébreu a ici une valeur distributive et désigne chaque membre des peuples rétablis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אַחֲרֵי
  choice: Après
  rationale: La tournure française exprime naturellement la succession temporelle annoncée par la construction hébraïque, sans calquer inutilement « et il arrivera ».
- source_word: נָתְשִׁי
  choice: je les aurai déracinés
  rationale: Le verbe évoque l’action d’arracher avec les racines, métaphore fréquente du jugement chez Jérémie. Le futur antérieur situe cette action avant le retour compatissant de Dieu.
- source_word: אָשׁוּב
  choice: je reviendrai vers eux
  rationale: Le verbe est compris comme le retour de Dieu vers les peuples. « Vers eux » explicite sobrement la relation contextuelle sans confondre ce verbe avec le causatif qui suit.
- source_word: וְרִחַמְתִּים
  choice: et j’aurai compassion d’eux
  rationale: Cette formulation conserve la nuance affective de רחם et reste digne et compréhensible en français moderne.
- source_word: וַהֲשִׁבֹתִים
  choice: Je les ramènerai
  rationale: 'Le hiphil de שׁוב est causatif : Dieu fait revenir les peuples. « Ramener » préserve clairement l’image d’un déplacement inverse.'
- source_word: אִישׁ ... וְאִישׁ
  choice: chacun ... et chacun
  rationale: La répétition restitue la construction distributive hébraïque tout en employant une formulation française naturelle qui inclut chaque membre des peuples concernés.
- source_word: לְנַחֲלָתוֹ
  choice: dans son patrimoine
  rationale: נחלה désigne ici le bien territorial reçu ou transmis. « Patrimoine » garde l’idée de possession héritée sans suggérer principalement un héritage futur.
- source_word: לְאַרְצוֹ
  choice: dans son pays
  rationale: אֶרֶץ désigne ici le territoire propre à chaque peuple. « Pays » convient au contexte international et distingue utilement ce terme du patrimoine territorial précédent.
theological_decisions:
- issue: Nature du rétablissement promis après le jugement
  choice: Un retour concret des peuples déplacés dans leur patrimoine et leur pays après le déracinement
  alternative: Un rétablissement uniquement spirituel, sans dimension territoriale
  rationale: Les termes נחלה et ארץ ont un sens territorial concret. La traduction conserve cette dimension sans ajouter de précisions doctrinales absentes du verset.
- issue: Sujet implicite du retour exprimé par אָשׁוּב
  choice: Dieu revient vers les peuples pour leur témoigner sa compassion
  alternative: Dieu recommence simplement à avoir compassion d’eux
  rationale: Le sens verbal de « revenir » est conservé, avec un complément contextuel minimal, plutôt que d’effacer l’image au profit d’un simple adverbe comme « de nouveau ».
translation_notes:
  register: Français international moderne, naturel et digne. La phrase d’ouverture est restructurée pour éviter un calque hébraïque lourd. La métaphore du déracinement, le double emploi de la racine שׁוב et la répétition distributive sont préservés autant que le permet un français fluide.
