id: JER.12.8
reference: Jeremiah 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָיְתָה לִּ֥/י נַחֲלָתִ֖/י כְּ/אַרְיֵ֣ה בַ/יָּ֑עַר נָתְנָ֥ה עָלַ֛/י בְּ/קוֹלָ֖/הּ עַל כֵּ֥ן שְׂנֵאתִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/008.yaml
  text: My inheritance has become to me like a lion in the forest[a]; she has lifted up her voice against me[c][b]; therefore I hate her.
translation:
  language: fr
  text: Mon héritage est devenu pour moi comme un lion dans la forêt ; il a élevé la voix contre moi[a]. C’est pourquoi je le hais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il a rugi contre moi ». L’hébreu dit littéralement « il a donné sa voix contre moi » ; dans l’image du lion, cette voix peut être comprise comme un rugissement hostile.
    reason: lexical_alternative
  - marker: b
    text: Ou « je l’ai haï » ou « je l’ai pris en haine ». La forme verbale hébraïque peut désigner, selon le contexte, une action passée ou un état actuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתִי
  choice: Mon héritage
  rationale: נַחֲלָה désigne un héritage, un patrimoine ou un bien attribué. « Mon héritage » conserve ici la portée relationnelle et l’arrière-plan d’alliance, tout en étant naturel en français.
- source_word: כְּאַרְיֵה
  choice: comme un lion
  rationale: אַרְיֵה est le terme masculin courant pour « lion », et כְּ introduit une comparaison. Le genre grammatical féminin de נַחֲלָה ne transforme pas l’animal en lionne.
- source_word: בַיָּעַר
  choice: dans la forêt
  rationale: יַעַר désigne une forêt ou une région boisée ; « forêt » est la traduction française la plus directe.
- source_word: נָתְנָה עָלַי בְּקוֹלָהּ
  choice: il a élevé la voix contre moi
  rationale: L’expression signifie littéralement qu’il a « donné sa voix contre moi ». « Élever la voix contre » rend naturellement l’hostilité de l’idiome sans imposer la lecture contextuelle plus précise « rugir ».
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution introduit la conséquence de l’hostilité précédente ; « c’est pourquoi » est clair et idiomatique.
- source_word: שְׂנֵאתִיהָ
  choice: je le hais
  rationale: Le qatal de שׂנא exprime directement la haine et peut recevoir en contexte une valeur passée ou actuelle. Le présent français convient à la conséquence immédiate, sans atténuer le terme en « rejeter ».
- source_word: suffixes féminins -הּ / -הָ
  choice: il / le
  rationale: Les pronoms hébreux sont féminins parce que נַחֲלָה est grammaticalement féminin. En français, « héritage » est masculin ; l’accord naturel exige donc « il » et « le », sans supprimer pour autant la personnification portée par l’action.
theological_decisions:
- issue: Attitude divine exprimée par שְׂנֵאתִיהָ
  choice: je le hais
  alternative: je l’ai pris en haine / je l’ai rejeté
  rationale: La formulation directe conserve la dureté et la tension du langage de jugement dans l’alliance. « Rejeter » atténuerait ou interpréterait le verbe, tandis que le parfait hébreu permet aussi une traduction passée, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et la violence rhétorique du texte. Les pronoms suivent le genre français de « héritage » plutôt que le genre grammatical hébreu ; l’agentivité maintient la personnification.
