- from: Mais s’ils n’écoutent pas[a], alors j’arracherai cette nation, je l’arracherai et la détruirai — déclaration de Yahweh.
  to: Mais s’ils n’écoutent pas[a], alors je déracinerai complètement cette nation et la détruirai — oracle de Yahweh.
  rationale: La révision conserve le contraste conditionnel, l’ambiguïté volontaire de « écouter », le nom divin et les deux verbes de jugement. Elle exprime l’intensification de l’infinitif absolu par « complètement », solution française naturelle qui préserve l’emphase sans introduire une répétition artificielle.
