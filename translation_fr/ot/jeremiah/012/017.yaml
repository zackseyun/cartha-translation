id: JER.12.17
reference: Jeremiah 12:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֖ם לֹ֣א יִשְׁמָ֑עוּ וְ/נָ֨תַשְׁתִּ֜י אֶת הַ/גּ֥וֹי הַ/ה֛וּא נָת֥וֹשׁ וְ/אַבֵּ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/017.yaml
  text: But if they do not listen[a], then I will uproot that nation, uprooting and destroying it, declares Yahweh.
translation:
  language: fr
  text: Mais s’ils n’écoutent pas[a], alors je déracinerai complètement cette nation et la détruirai — oracle de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’obéissent pas ». Le verbe hébreu peut signifier aussi bien « écouter » qu’« obéir », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction introduit ici une condition en contraste avec la promesse du verset précédent.
- source_word: לֹא יִשְׁמָעוּ
  choice: ils n’écoutent pas
  rationale: Le verbe שׁמע signifie écouter ou entendre et, par extension, obéir. « Écoutent » conserve l’image hébraïque tout en laissant entendre l’exigence d’obéissance.
- source_word: וְנָתַשְׁתִּי ... נָתוֹשׁ
  choice: j’arracherai ... je l’arracherai
  rationale: La reprise du verbe נתשׁ par un infinitif absolu renforce l’action. La répétition française préserve à la fois l’image de l’arrachage et l’insistance inhabituelle de l’hébreu.
- source_word: הַגּוֹי הַהוּא
  choice: cette nation
  rationale: גּוֹי désigne ici l’une des nations voisines considérées comme une entité collective.
- source_word: וְאַבֵּד
  choice: et la détruirai
  rationale: La forme causative exprime le fait de faire périr ou de détruire; le pronom explicite rend la coordination naturelle en français.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formulation solennelle rend la formule prophétique נְאֻם tout en conservant le nom divin personnel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom divin personnel; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de שׁמע dans la condition
  choice: écoutent
  alternative: obéissent
  rationale: Le contexte implique l’obéissance, mais le verbe conserve aussi son sens concret d’écoute; le texte principal maintient cette tension et la note signale l’autre traduction possible.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition « j’arracherai… je l’arracherai » est volontaire afin de refléter l’intensification hébraïque, malgré son caractère marqué en français.
