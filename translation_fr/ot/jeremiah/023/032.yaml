revisions:
- from: Me voici contre ceux qui prophétisent des rêves mensongers[a], déclare Yahweh, qui les racontent et égarent mon peuple par leurs mensonges et leur irresponsabilité[b]. Moi, je ne les ai pas envoyés et je ne leur ai donné aucun ordre. Ils ne sont absolument d’aucune utilité à ce peuple, déclare Yahweh.
  to: Me voici contre ceux qui prophétisent des rêves mensongers[a], déclare Yahweh, qui les racontent et égarent mon peuple par leurs mensonges et leur irresponsabilité[b], alors que moi, je ne les ai pas envoyés ni ne leur ai donné d’ordre. Ils ne sont d’aucun profit pour ce peuple, déclare Yahweh.
