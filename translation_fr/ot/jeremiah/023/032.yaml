source:
  edition: WLC
  text: הִ֠נְ/נִי עַֽל נִבְּאֵ֞י חֲלֹמ֥וֹת שֶׁ֨קֶר֙ נְאֻם יְהוָ֔ה וַֽ/יְסַפְּרוּ/ם֙ וַ/יַּתְע֣וּ אֶת עַמִּ֔/י בְּ/שִׁקְרֵי/הֶ֖ם וּ/בְ/פַחֲזוּתָ֑/ם וְ/אָנֹכִ֨י לֹֽא שְׁלַחְתִּ֜י/ם וְ/לֹ֣א צִוִּיתִ֗י/ם וְ/הוֹעֵ֛יל לֹֽא יוֹעִ֥ילוּ לָֽ/עָם הַ/זֶּ֖ה נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/032.yaml
  text: Behold[a], I am against those who prophesy lying dreams, declares Yahweh, and who tell them and lead my people astray by their lies and by their recklessness, though I did not send them or command them. They do not profit this people at all[b], declares Yahweh.
translation:
  language: fr
  text: Me voici contre ceux qui prophétisent des rêves mensongers[a], déclare Yahweh, qui les racontent et égarent mon peuple par leurs mensonges et leur irresponsabilité[b], alors que moi, je ne les ai pas envoyés ni ne leur ai donné d’ordre. Ils ne sont d’aucun profit pour ce peuple, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de faux rêves ». L’hébreu dit littéralement « des rêves de mensonge », le nom « mensonge » qualifiant ici les rêves.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est difficile ; il peut aussi évoquer leur présomption, leur témérité ou leur frivolité, c’est-à-dire une conduite inconsidérée et arrogante.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי עַל
  choice: Me voici contre
  rationale: Cette tournure conserve la solennité de l’annonce divine et exprime clairement l’opposition hostile indiquée par עַל.
- source_word: נִבְּאֵי חֲלֹמוֹת שֶׁקֶר
  choice: ceux qui prophétisent des rêves mensongers
  rationale: Le participe désigne les personnes par leur activité; « rêves mensongers » garde la valeur nominale de שֶׁקֶר tout en restant naturel en français.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique comme une déclaration solennelle et conserve le nom divin.
- source_word: וַיְסַפְּרוּם
  choice: qui les racontent
  rationale: Le pronom « les » reprend explicitement les rêves, conformément au suffixe objet hébreu.
- source_word: וַיַּתְעוּ
  choice: égarent
  rationale: 'Exprime la forme causative du verbe תעה: faire errer, détourner du bon chemin.'
- source_word: בְּשִׁקְרֵיהֶם
  choice: par leurs mensonges
  rationale: La préposition בְּ est instrumentale et le pluriel de שֶׁקֶר est rendu directement.
- source_word: וּבְפַחֲזוּתָם
  choice: et leur irresponsabilité
  rationale: Le terme rare פחזות évoque une conduite irréfléchie, présomptueuse et inconsidérée; « irresponsabilité » convient au contexte de prétentions prophétiques sans mandat.
- source_word: וְאָנֹכִי לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים
  choice: Moi, je ne les ai pas envoyés et je ne leur ai donné aucun ordre
  rationale: « Moi » marque l’emphase de אָנֹכִי. La formulation française exprime directement l’absence d’envoi et de mandat divins.
- source_word: וְהוֹעֵיל לֹא יוֹעִילוּ
  choice: Ils ne sont absolument d’aucune utilité
  rationale: L’adverbe « absolument » et la tournure négative forte rendent l’intensification produite par l’infinitif absolu suivi du verbe conjugué.
- source_word: לָעָם הַזֶּה
  choice: à ce peuple
  rationale: Conserve la désignation collective et la légère prise de distance de l’expression hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Nature des rêves condamnés
  choice: rêves mensongers
  alternative: faux rêves
  rationale: La formulation retenue préserve la construction hébraïque avec le substantif « mensonge » employé attributivement, sans décider si le mensonge caractérise surtout le contenu, l’origine ou la présentation des rêves.
- issue: Portée de פחזות
  choice: irresponsabilité
  alternative: présomption, témérité ou frivolité
  rationale: Le mot est difficile et peut mêler irréflexion, insolence et légèreté. Le choix contextuel évite de réduire son sens à une seule attitude intérieure, tandis qu’une note conserve l’incertitude lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. « Me voici contre » maintient la force prophétique sans archaïsme excessif. Les phrases ont été légèrement segmentées pour la clarté, tout en conservant l’emphase du pronom divin et la répétition de la formule « déclare Yahweh ».
