  variant: modern international French
source:
  edition: WLC
  text: אֹמְרִ֤ים אָמוֹר֙ לִֽ/מְנַאֲצַ֔/י דִּבֶּ֣ר יְהוָ֔ה שָׁל֖וֹם יִֽהְיֶ֣ה לָ/כֶ֑ם וְ֠/כֹל הֹלֵ֞ךְ בִּ/שְׁרִר֤וּת לִבּ/וֹ֙ אָֽמְר֔וּ לֹֽא תָב֥וֹא עֲלֵי/כֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/017.yaml
  text: 'They keep saying to those who despise me[a], ‘Yahweh has spoken: You will have peace’; and to everyone who walks in the stubbornness of his own heart they say[c][b], ‘No disaster will come upon you.’'
translation:
  language: fr
  text: 'Ils ne cessent de dire à ceux qui me méprisent[a] : « Yahweh a parlé : vous aurez la paix[b]. » Et à tous ceux qui suivent l’obstination de leur propre cœur, ils disent : « Aucun malheur ne s’abattra sur vous[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ceux qui me bafouent » ou « à ceux qui me rejettent ». L’hébreu dit littéralement « à ceux qui me méprisent ».
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « paix » peut aussi évoquer le bien-être, la sécurité ou la prospérité.
    reason: lexical_alternative
  - marker: c
    text: Ou « Aucun désastre ne viendra sur vous ». Ici, le terme hébreu désigne une calamité, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים אָמוֹר
  choice: Ils ne cessent de dire
  rationale: Le participe accompagné de l’infinitif absolu donne à l’expression une valeur intensive et répétitive. Cette formulation naturelle en français fait ressortir leur insistance continuelle.
- source_word: לִמְנַאֲצַי
  choice: à ceux qui me méprisent
  rationale: Le participe de נאץ avec le suffixe de première personne désigne ceux qui méprisent ou bafouent le locuteur. « Méprisent » exprime clairement l’offense personnelle envers Dieu sans surinterpréter le terme.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh a parlé
  rationale: Le parfait de דבר présente la parole comme prononcée et sert ici de formule par laquelle les faux prophètes revendiquent une autorité divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: שָׁלוֹם
  choice: paix
  rationale: שָׁלוֹם peut désigner la paix, la sécurité, le bien-être ou la prospérité. « Paix » reste concis, naturel et conserve la résonance prophétique du terme.
- source_word: יִהְיֶה לָכֶם
  choice: Vous aurez
  rationale: Cette tournure rend naturellement en français la construction existentielle hébraïque littéralement proche de « la paix sera pour vous ».
- source_word: וְכֹל הֹלֵךְ
  choice: Et à tous ceux qui suivent
  rationale: Le singulier collectif hébreu désigne une catégorie générale. Le pluriel français s’accorde naturellement avec le « vous » collectif de la parole rapportée, tandis que « suivent » restitue la métaphore habituelle d’une conduite choisie.
- source_word: בִּשְׁרִרוּת לִבּוֹ
  choice: l’obstination de leur propre cœur
  rationale: שְׁרִרוּת exprime l’entêtement ou l’obstination. « Leur propre cœur » souligne que leur conduite procède de leur volonté intérieure plutôt que de la parole de Dieu.
- source_word: אָמְרוּ
  choice: ils disent
  rationale: Dans la description d’une pratique persistante, le parfait hébreu se rend naturellement par le présent français. Le sujet demeure celui des faux prophètes.
- source_word: לֹא תָבוֹא עֲלֵיכֶם רָעָה
  choice: Aucun malheur ne s’abattra sur vous
  rationale: Dans ce contexte de jugement prophétique, רָעָה désigne une calamité plutôt que le mal moral. « S’abattra sur vous » restitue avec naturel l’idée hébraïque de quelque chose qui vient sur des personnes.
theological_decisions:
- issue: Référent du suffixe de première personne dans « ceux qui me méprisent »
  choice: Le « me » renvoie à Yahweh.
  alternative: Le « me » pourrait être compris comme renvoyant à Jérémie.
  rationale: Le contexte porte sur le rejet de la parole de Yahweh, que les faux prophètes prétendent pourtant transmettre. La traduction conserve simplement le pronom du texte hébreu sans ajouter explicitement son référent.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde l’insistance répétitive de l’ouverture, la métaphore du cœur obstiné et la fausse assurance solennelle des prophètes. Le nom divin est rendu par « Yahweh ».
