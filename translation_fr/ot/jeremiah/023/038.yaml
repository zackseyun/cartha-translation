  text: וְ/אִם מַשָּׂ֣א יְהוָה֮ תֹּאמֵרוּ֒ לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֧עַן אֲמָרְ/כֶ֛ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה מַשָּׂ֣א יְהוָ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תֹאמְר֖וּ מַשָּׂ֥א יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/038.yaml
  text: 'But if you say[a], ‘The burden of Yahweh,’ therefore this is what Yahweh says: Because you have said this word, ‘The burden of Yahweh,’ though I sent to you, saying, ‘You shall not say, “The burden of Yahweh,”’'
translation:
  language: fr
  text: 'Mais si vous dites : « Le fardeau[a] de Yahweh », alors voici ce que dit Yahweh : Parce que vous avez prononcé cette parole : « Le fardeau de Yahweh », alors que je vous avais pourtant fait dire : « Vous ne devez pas dire : “Le fardeau de Yahweh” »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’oracle de Yahweh ». Le mot hébreu massa peut désigner une déclaration prophétique, mais « fardeau » est retenu ici afin de préserver le jeu de mots répété dans ce passage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition en contraste avec l’interdiction du verset précédent ; « Mais si » restitue à la fois la conjonction et sa nuance adversative.
- source_word: מַשָּׂא
  choice: fardeau
  rationale: Le nom peut désigner une charge ou, par extension, un oracle prophétique. « Fardeau » conserve la répétition, l’ironie et le jeu de mots développés dans ce passage.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement par le tétragramme hébreu.
- source_word: לָכֵן כֹּה אָמַר יְהוָה
  choice: alors voici ce que dit Yahweh
  rationale: Rend avec naturel en français la conséquence introduite par לָכֵן et la formule prophétique de messager.
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit explicitement la raison du jugement annoncé.
- source_word: אֲמָרְכֶם אֶת הַדָּבָר הַזֶּה
  choice: vous avez prononcé ces mots
  rationale: Désigne l’expression précise que les interlocuteurs ont employée. Le pluriel français « ces mots » est idiomatique sans changer la référence à l’énoncé cité.
- source_word: וָאֶשְׁלַח אֲלֵיכֶם לֵאמֹר
  choice: bien que je vous aie envoyé dire
  rationale: Conserve l’image d’un avertissement transmis et explicite la valeur concessive que prend la coordination dans le contexte.
- source_word: לֹא תֹאמְרוּ
  choice: Vous ne devez pas dire
  rationale: Exprime clairement en français moderne la force prohibitive de la forme hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin ; sa transcription préserve cette donnée sans le remplacer par un titre.
- issue: Sens de מַשָּׂא dans le jeu de mots prophétique
  choice: fardeau
  alternative: oracle ; message
  rationale: « Oracle » convient souvent au terme dans les titres prophétiques, mais « fardeau » maintient ici la tension entre ses sens et l’ironie de sa répétition. L’autre sens est signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique reste solennelle sans archaïsme marqué. La phrase demeure ouverte par une virgule finale, conformément à la syntaxe du verset, qui conduit à la suite de l’annonce.
