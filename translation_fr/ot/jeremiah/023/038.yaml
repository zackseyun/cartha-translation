  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : la condition, la formule « fardeau de Yahweh », la justification divine et l''interdiction répétée sont conservées. Toutefois, « je vous aie envoyé dire » n''est pas une formulation française correcte dans cette construction et risque de faire comprendre que les destinataires étaient envoyés pour parler. « Je vous avais pourtant fait dire » rend naturellement l''avertissement antérieur communiqué aux destinataires, tout en conservant la nuance concessive contextuelle.'
