    issue: Tournure « bien que je vous aie envoyé dire »
    rationale: Après « bien que », le subjonctif passé est grammaticalement possible en soi, mais « envoyer quelqu'un dire » signifie normalement envoyer cette personne accomplir l'action de parler. La formulation ne rend donc pas clairement « j'ai envoyé [un message] vers vous, disant ». Une expression telle que « je vous avais pourtant fait dire » est idiomatique et conserve l'idée d'un avertissement transmis auparavant.
  - severity: low
    issue: « ces mots » au pluriel pour הַדָּבָר הַזֶּה au singulier
    rationale: Le pluriel est idiomatique mais atténue la reprise précise du singulier hébreu (« cette parole / cette expression »). « Cette parole » est à la fois fidèle et naturel.
