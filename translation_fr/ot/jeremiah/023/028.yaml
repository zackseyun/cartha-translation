  text: הַ/נָּבִ֞יא אֲשֶׁר אִתּ֤/וֹ חֲלוֹם֙ יְסַפֵּ֣ר חֲל֔וֹם וַ/אֲשֶׁ֤ר דְּבָרִ/י֙ אִתּ֔/וֹ יְדַבֵּ֥ר דְּבָרִ֖/י אֱמֶ֑ת מַה לַ/תֶּ֥בֶן אֶת הַ/בָּ֖ר נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/028.yaml
  text: Let the prophet who has a dream tell the dream[a], but let the one who has my word speak my word truthfully[b]. What is straw to grain? declares Yahweh.
translation:
  language: fr
  text: Le prophète qui a un rêve, qu’il raconte ce rêve ; mais celui qui a ma parole, qu’il dise ma parole en vérité[a]. Quel rapport y a-t-il entre la paille et le grain[b] ? déclare Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il dise véritablement ma parole » ou « qu’il dise ma parole véritable ». L’hébreu peut souligner soit la manière véridique de parler, soit le caractère véritable de la parole elle-même.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Qu’y a-t-il entre la paille et le grain ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר אִתּוֹ חֲלוֹם
  choice: Le prophète qui a un rêve
  rationale: L’article défini est conservé dans une formulation française à valeur générique. L’expression hébraïque signifie littéralement que le prophète a « avec lui » un rêve ; « qui a un rêve » en rend naturellement le sens sans qualifier d’avance l’origine de ce rêve.
- source_word: יְסַפֵּר חֲלוֹם
  choice: qu’il raconte ce rêve
  rationale: Le piel de ספר signifie ici « raconter » ou « relater ». Le démonstratif « ce » évite une répétition française maladroite tout en désignant clairement le rêve mentionné.
- source_word: וַאֲשֶׁר דְּבָרִי אִתּוֹ
  choice: mais celui qui a ma parole
  rationale: Dans le contexte, la conjonction introduit un contraste entre le rêve et la parole de Yahvé. « Mais » exprime ce contraste sans ajouter d’explication doctrinale.
- source_word: יְדַבֵּר דְּבָרִי אֱמֶת
  choice: qu’il dise fidèlement ma parole
  rationale: « Dire ma parole » reste proche de דבר, tandis que « fidèlement » rend la valeur adverbiale probable de אֱמֶת. Une note conserve l’autre analyse possible, où אֱמֶת qualifie la parole elle-même.
- source_word: מַה לַתֶּבֶן אֶת הַבָּר
  choice: Quel rapport y a-t-il entre la paille et le grain ?
  rationale: La question idiomatique souligne l’absence de commune mesure. תֶּבֶן désigne la paille, et בָּר le grain, sans qu’il soit nécessaire de préciser « blé ».
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: Formule prophétique solennelle et naturelle en français ; le nom divin est rendu par « Yahvé ».
theological_decisions:
- issue: Contraste entre le rêve rapporté et la parole de Yahvé
  choice: Présenter les deux propositions comme des injonctions contrastées, la seconde exigeant une transmission fidèle de la parole divine.
  alternative: Coordonner les deux propositions de manière neutre avec « et ».
  rationale: Le contexte et la comparaison finale entre la paille et le grain indiquent un contraste net, sans qu’il soit nécessaire d’affirmer que tout rêve est faux en soi.
- issue: Portée syntaxique de אֱמֶת
  choice: 'Comprendre principalement אֱמֶת comme un adverbe : « fidèlement ».'
  alternative: 'Le rattacher à « ma parole » : « ma parole véritable » ou « ma vraie parole ».'
  rationale: Les deux analyses sont grammaticalement possibles. Le texte principal retient une lecture naturelle et contextuellement forte, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et direct. La structure détachée « Le prophète…, qu’il… » reproduit naturellement la force injonctive de l’hébreu. La répétition de « ma parole » est maintenue pour préserver l’insistance du texte source.
