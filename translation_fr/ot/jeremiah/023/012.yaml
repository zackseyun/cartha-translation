- from: C’est pourquoi leur chemin sera pour eux comme des passages glissants dans l’obscurité ; ils seront poussés et y tomberont. Car je ferai venir sur eux le malheur, l’année de leur châtiment[a] — déclaration de Yahweh.
  to: C’est pourquoi leur chemin sera pour eux comme des endroits glissants dans l’obscurité ; ils seront entraînés et y tomberont. Car je ferai venir sur eux le malheur, l’année de leur châtiment[a] — déclaration de Yahweh.
  rationale: Révision limitée à deux expressions pour une langue française plus naturelle. Le sens, la structure du jugement, le pluriel de l’image et l’ambiguïté référentielle du pronom « y » sont conservés. La formulation appositionnelle finale maintient le lien étroit du texte hébreu entre le malheur annoncé et l’année de la visitation punitive.
