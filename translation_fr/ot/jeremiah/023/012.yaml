id: JER.23.12
reference: Jeremiah 23:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵן֩ יִֽהְיֶ֨ה דַרְכָּ֜/ם לָ/הֶ֗ם כַּ/חֲלַקְלַקּוֹת֙ בָּֽ/אֲפֵלָ֔ה יִדַּ֖חוּ וְ/נָ֣פְלוּ בָ֑/הּ כִּֽי אָבִ֨יא עֲלֵי/הֶ֥ם רָעָ֛ה שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/012.yaml
  text: Therefore their way will be to them like slippery places in the darkness; they will be driven along and fall in it[a], for I will bring disaster on them in the year of their punishment, declares Yahweh.
translation:
  language: fr
  text: C’est pourquoi leur chemin sera pour eux comme des endroits glissants dans l’obscurité ; ils seront entraînés et y tomberont. Car je ferai venir sur eux le malheur, l’année de leur châtiment[a] — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’année où je leur demanderai des comptes ». Le terme hébreu peut désigner le moment où Dieu intervient pour juger et demander des comptes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence judiciaire qui découle de l’accusation précédente.
- source_word: יִהְיֶה דַרְכָּם לָהֶם
  choice: leur chemin sera pour eux
  rationale: Conserve la construction hébraïque et l’idée que leur propre conduite ou destinée se retourne contre eux.
- source_word: כַחֲלַקְלַקּוֹת בָּאֲפֵלָה
  choice: comme des passages glissants dans l’obscurité
  rationale: « Passages glissants » préserve le pluriel et l’image concrète d’un parcours dangereux, tandis que « obscurité » garde la portée à la fois physique et métaphorique.
- source_word: יִדַּחוּ וְנָפְלוּ בָהּ
  choice: ils seront poussés et y tomberont
  rationale: Le passif rend le niphal comme une impulsion subie. Le pronom « y » conserve la référence concise du suffixe hébreu sans préciser excessivement s’il renvoie surtout à l’obscurité ou à la situation décrite.
- source_word: רָעָה
  choice: le malheur
  rationale: Dans ce contexte de jugement, le mot désigne une calamité infligée plutôt qu’un mal moral ; « malheur » est idiomatique et solennel en français.
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: l’année de leur châtiment
  rationale: Le contexte judiciaire favorise le sens de punition, tout en laissant en note l’autre nuance importante d’intervention ou de reddition de comptes.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique solennelle et conserve le nom divin explicite du texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Sens de רָעָה lorsque Dieu exerce son jugement
  choice: le malheur
  alternative: le mal
  rationale: Ici, le terme désigne la calamité judiciaire que Dieu fait venir, non le mal moral.
- issue: Sens judiciaire de פְּקֻדָּה
  choice: châtiment
  alternative: intervention / reddition de comptes
  rationale: Le contexte annonce un jugement punitif, mais la polysémie du terme est signalée afin de ne pas effacer l’idée d’une intervention divine où les coupables doivent rendre compte.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve le mouvement prophétique et l’image du chemin dangereux sans devenir artificiellement littérale.
