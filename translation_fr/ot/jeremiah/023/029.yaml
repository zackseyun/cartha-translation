base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/029.yaml
  text: Is not my word like fire—oracle of Yahweh—and like a hammer that shatters rock?[a]
translation:
  language: fr
  text: « Ma parole n’est-elle pas comme un feu — déclaration de Yahweh — et comme un marteau qui fracasse le roc ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: n’est-elle pas
  rationale: Conserve la question rhétorique qui appelle une réponse affirmative.
- source_word: כֹה דְבָרִי כָאֵשׁ
  choice: ma parole… comme un feu
  rationale: Rend naturellement la comparaison en français tout en conservant le singulier collectif « ma parole » et l’image vive du feu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Préserve la forme nominale de la formule prophétique et rend directement le nom divin.
- source_word: וּכְפַטִּישׁ
  choice: et comme un marteau
  rationale: Conserve la coordination et la seconde comparaison sans préciser excessivement le type de marteau.
- source_word: יְפֹצֵץ
  choice: qui fracasse
  rationale: Exprime avec force l’action de briser en morceaux, dans un français actuel et digne.
- source_word: סָלַע
  choice: le roc
  rationale: « Roc » évoque une masse rocheuse résistante et convient particulièrement à l’image du marteau.
theological_decisions:
- issue: Formule prophétique נְאֻם יְהוָה
  choice: déclaration de Yahweh
  alternative: déclare Yahweh / oracle de Yahweh
  rationale: « Déclaration » garde la valeur nominale de נְאֻם, tandis que « Yahweh » représente directement le Tétragramme, sans transformer la formule en proposition verbale.
translation_notes:
  register: Français international moderne, soutenu mais immédiatement compréhensible. La ponctuation par tirets détache la formule prophétique comme dans l’hébreu, sans affaiblir le parallélisme entre le feu et le marteau.
