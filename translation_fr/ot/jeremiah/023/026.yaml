source:
  edition: WLC
  text: עַד מָתַ֗י הֲ/יֵ֛שׁ בְּ/לֵ֥ב הַ/נְּבִאִ֖ים נִבְּאֵ֣י הַ/שָּׁ֑קֶר וּ/נְבִיאֵ֖י תַּרְמִ֥ת לִבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/026.yaml
  text: How long will this be in the heart of the prophets who prophesy falsehood[b][a], and who prophesy the deceit of their own heart?
translation:
  language: fr
  text: Jusqu’à quand cela sera-t-il[a] dans le cœur des prophètes qui prophétisent le mensonge[b] et qui sont prophètes de la tromperie de leur propre cœur ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique ; plus littéralement : « Jusqu’à quand y a-t-il dans le cœur des prophètes… ? » La traduction explicite le sens impliqué par le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de manière plus condensée : « les faux prophètes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Expression interrogative temporelle naturelle en français, qui conserve l’exaspération exprimée dans l’hébreu.
- source_word: הֲיֵשׁ
  choice: cela restera-t-il
  rationale: La tournure existentielle hébraïque est elliptique. Le français exige ici un prédicat plus explicite ; « restera-t-il » exprime la durée impliquée par « jusqu’à quand » sans préciser indûment la nature de « cela ».
- source_word: בְּלֵב
  choice: dans le cœur
  rationale: '« Cœur » préserve l’anthropologie biblique : le terme hébreu englobe la pensée, les intentions et la volonté, et pas seulement les émotions.'
- source_word: הַנְּבִאִים
  choice: des prophètes
  rationale: Équivalent direct et naturel du nom hébreu au pluriel.
- source_word: נִבְּאֵי הַשָּׁקֶר
  choice: qui prophétisent le mensonge
  rationale: Cette formulation conserve la force verbale de l’expression et met l’accent sur le contenu mensonger de leur prophétie plutôt que sur une simple étiquette.
- source_word: וּנְבִיאֵי
  choice: et qui prophétisent
  rationale: Le parallélisme avec l’expression précédente favorise en français une reprise verbale, claire et naturelle.
- source_word: תַּרְמִת
  choice: la tromperie
  rationale: Le nom désigne la tromperie ou la fraude ; « tromperie » convient au reproche moral formulé ici.
- source_word: לִבָּם
  choice: de leur propre cœur
  rationale: « Leur » rend le suffixe possessif, tandis que « propre » souligne naturellement que cette tromperie vient d’eux-mêmes.
theological_decisions:
- issue: Sens anthropologique de לֵב
  choice: cœur
  alternative: pensée ; être intérieur
  rationale: Le terme hébreu peut inclure pensée, intention et volonté. « Cœur » conserve l’image et l’anthropologie du texte sans les réduire à la seule faculté intellectuelle.
- issue: Faut-il condenser נִבְּאֵי הַשָּׁקֶר en une désignation catégorielle ?
  choice: qui prophétisent le mensonge
  alternative: les faux prophètes
  rationale: L’expression retenue préserve l’accent du texte sur l’acte et le contenu de la prophétie mensongère, sans transformer cette formulation en titre interprétatif.
- issue: Résolution de l’ellipse après עַד מָתַי הֲיֵשׁ
  choice: cela restera-t-il
  alternative: y a-t-il ; cela durera-t-il
  rationale: La syntaxe hébraïque est abrupte et laisse une partie du sens implicite. La traduction rend la question compréhensible en français tout en maintenant l’indétermination de « cela » et en signalant l’ellipse dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « prophétisent » est conservée afin de refléter le parallélisme et l’insistance de l’hébreu. L’ambiguïté de la construction initiale est maintenue autant que le permet une phrase française intelligible, puis explicitée en note.
