  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בִ/נְבִיאֵ֥י שֹׁמְר֖וֹן רָאִ֣יתִי תִפְלָ֑ה הִנַּבְּא֣וּ בַ/בַּ֔עַל וַ/יַּתְע֥וּ אֶת עַמִּ֖/י אֶת יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/013.yaml
  text: 'And among the prophets of Samaria I saw something offensive: they prophesied by Baal and led my people Israel astray[a][b].'
translation:
  language: fr
  text: 'Et chez les prophètes de Samarie, j’ai vu une chose révoltante[a] : ils ont prophétisé au nom de Baal[b] et ont égaré mon peuple, Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une folie » ou « une chose affreuse ». Le mot hébreu désigne ici quelque chose de moralement ou religieusement inadmissible.
    reason: lexical_alternative
  - marker: b
    text: Ou « par Baal » ou « pour Baal ». Leur activité prophétique s’exerçait sous l’autorité revendiquée de Baal ou en association avec lui.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבִנְבִיאֵי
  choice: Et chez les prophètes de
  rationale: Le waw et la préposition ב introduisent ici le groupe au sein duquel le constat est fait. « Chez les prophètes de » est naturel en français et garde ce rapport sans la lourdeur de « dans les prophètes de ».
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom de la capitale du royaume du Nord, pouvant aussi évoquer ici son milieu prophétique.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le qatal à la première personne rapporte un constat accompli. Le passé composé convient naturellement au discours français actuel.
- source_word: תִפְלָה
  choice: une chose révoltante
  rationale: Le terme qualifie quelque chose de moralement ou religieusement inadmissible. « Révoltante » exprime cette forte réprobation sans réduire le sens à une simple erreur intellectuelle.
- source_word: הִנַּבְּאוּ
  choice: ils prophétisaient
  rationale: Le hitpael de נבא désigne l’exercice de l’activité prophétique. L’imparfait décrit naturellement leur pratique.
- source_word: בַבַּעַל
  choice: par Baal
  rationale: La préposition ב marque ici vraisemblablement l’autorité, le moyen ou l’association sous lesquels ils prophétisaient. « Par Baal » conserve cette portée tout en restant concise.
- source_word: וַיַּתְעוּ
  choice: et égaraient
  rationale: 'Le hiphil de תעה est causatif : faire errer, détourner du bon chemin. « Égaraient » rend ce sens moral et religieux.'
- source_word: אֶת־עַמִּי אֶת־יִשְׂרָאֵל
  choice: mon peuple, Israël
  rationale: Le second syntagme précise par apposition l’identité de « mon peuple ». La virgule rend clairement cette apposition en français.
theological_decisions:
- issue: Rapport des prophètes à Baal dans הִנַּבְּאוּ בַבַּעַל
  choice: ils prophétisaient par Baal
  alternative: ils prophétisaient au nom de Baal / pour Baal
  rationale: « Par Baal » préserve l’ambiguïté de la préposition entre autorité revendiquée, moyen et association cultuelle, sans ajouter une formulation théologique plus précise que l’hébreu.
- issue: Force morale et religieuse de תִפְלָה
  choice: une chose révoltante
  alternative: une folie / une chose affreuse
  rationale: Le contexte condamne une corruption prophétique et cultuelle, et non une simple déficience intellectuelle. Cette formulation communique la gravité du jugement tout en signalant les autres nuances possibles en note.
translation_notes:
  register: Français international actuel, digne et accessible. « Chez les prophètes » est idiomatique; « une chose révoltante » garde la forte évaluation du texte; l’imparfait présente les actions comme leur pratique habituelle. Les deux appels de note [a] et [b] figurent dans le texte.
