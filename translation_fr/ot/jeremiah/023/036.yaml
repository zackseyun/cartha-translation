source:
  edition: WLC
  text: וּ/מַשָּׂ֥א יְהוָ֖ה לֹ֣א תִזְכְּרוּ ע֑וֹד כִּ֣י הַ/מַּשָּׂ֗א יִֽהְיֶה֙ לְ/אִ֣ישׁ דְּבָר֔/וֹ וַ/הֲפַכְתֶּ֗ם אֶת דִּבְרֵי֙ אֱלֹהִ֣ים חַיִּ֔ים יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/036.yaml
  text: But you shall no longer mention ‘the burden of Yahweh,’ for each man's own word will become his burden[a], and you have twisted the words of the living God, Yahweh of hosts[b], our God.
translation:
  language: fr
  text: 'Mais vous ne direz plus : « le fardeau de Yahweh », car le fardeau de chacun sera sa parole[a], et vous avez déformé les paroles du Dieu vivant, Yahweh des armées, notre Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu traduit par « fardeau » peut aussi signifier « oracle » ou « message prophétique ». Le verset joue vraisemblablement sur les deux sens : ce qui est présenté comme un « fardeau de Yahweh » devient, pour chacun, sa propre parole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: fardeau
  rationale: Le terme peut désigner une charge ou, dans un contexte prophétique, un oracle. « Fardeau » permet de conserver le jeu polémique entre la formule citée et la parole qui retombe sur celui qui la prononce.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, conformément à la valeur de nom propre du tétragramme.
- source_word: תִזְכְּרוּ
  choice: dire
  rationale: Avec une formule citée comme complément, le verbe signifie ici évoquer ou prononcer cette expression ; « dire » est naturel dans l'interdiction française.
- source_word: הַמַּשָּׂא יִהְיֶה לְאִישׁ דְּבָרוֹ
  choice: la parole de chacun deviendra son propre fardeau
  rationale: Cette formulation rend la prédication hébraïque condensée et maintient la reprise de מַשָּׂא sans trancher davantage la manière dont la parole devient un fardeau.
- source_word: וַהֲפַכְתֶּם
  choice: vous avez déformé
  rationale: Le verbe exprime ici l'altération coupable des paroles divines. « Déformé » est actuel, clair et moins chargé de connotations étrangères au contexte que « perverti ».
- source_word: דִּבְרֵי אֱלֹהִים חַיִּים
  choice: les paroles du Dieu vivant
  rationale: Rend naturellement le syntagme construit tout en conservant le titre théologique.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Rendu transparent du titre, qui préserve l'image des armées ou puissances plutôt que de la remplacer par l'interprétation « Tout-Puissant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l'Éternel
  rationale: Le texte porte un nom propre ; sa translittération le distingue des titres divins.
- issue: Jeu de mots sur מַשָּׂא
  choice: « fardeau » aux deux occurrences
  alternative: « oracle » ou « message » à la première occurrence
  rationale: La répétition française conserve le retournement rhétorique de l'hébreu, où le même terme peut évoquer à la fois un oracle prophétique et une charge pesante.
- issue: Sens de la parole qui devient un fardeau
  choice: formulation littérale sans explicitation causale
  alternative: expliciter que la parole retombera sur celui qui la prononce
  rationale: L'hébreu est condensé et laisse ouverte la manière précise dont la parole de chacun devient son fardeau ; le texte principal préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la vigueur de l'hébreu tout en étant idiomatique. « Yahweh des armées » conserve l'image du titre hébreu ; le jeu de mots central est maintenu par la répétition de « fardeau ».
