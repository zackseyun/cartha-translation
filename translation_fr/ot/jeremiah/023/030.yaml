revisions:
- from: C’est pourquoi, me voici contre les prophètes — déclaration de Yahweh —, eux qui se volent mes paroles les uns aux autres[a].
  to: C’est pourquoi, me voici contre les prophètes — déclaration de Yahweh —, qui dérobent mes paroles, chacun à son prochain[a].
  rationale: La révision remplace la tournure réciproque « les uns aux autres » par « chacun à son prochain ». Elle conserve ainsi le caractère distributif de אִישׁ et le rapport de provenance de מֵאֵת, tout en employant la construction française naturelle « dérober quelque chose à quelqu’un ».
  reviewer_model: gpt-5.6-terra
