source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִ֥י עַל הַ/נְּבִאִ֖ים נְאֻם יְהוָ֑ה מְגַנְּבֵ֣י דְבָרַ֔/י אִ֖ישׁ מֵ/אֵ֥ת רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/030.yaml
  text: Therefore[a], behold, I am against the prophets, declares Yahweh, who steal my words, each from his neighbor.
translation:
  language: fr
  text: C’est pourquoi, me voici contre les prophètes — déclaration de Yahweh —, qui dérobent mes paroles, chacun à son prochain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « chacun de chez son prochain ».'
    reason: Indique de façon non interprétative la tournure distributive et la provenance exprimées par l’hébreu.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence de la dénonciation précédente tout en conservant l’enchaînement argumentatif du discours prophétique.
- source_word: הִנְנִי עַל
  choice: me voici contre
  rationale: « Me voici » conserve l’annonce emphatique et personnelle, tandis que « contre » exprime clairement l’opposition divine dans ce contexte de jugement.
- source_word: הַנְּבִאִים
  choice: les prophètes
  rationale: Rend directement le pluriel désignant ceux qui prétendent transmettre une parole prophétique.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Formule prophétique solennelle qui conserve la valeur nominale de נְאֻם et rend explicitement le nom divin.
- source_word: מְגַנְּבֵי דְבָרַי
  choice: eux qui se volent mes paroles
  rationale: Le participe caractérise les prophètes par une activité habituelle. La construction pronominale prépare naturellement en français la réciprocité exprimée par la suite, sans réduire le pluriel « mes paroles » à un message collectif singulier.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: les uns aux autres
  rationale: Rend naturellement en français la tournure distributive masculine singulière « chacun de la part de son prochain » et son sens réciproque dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; sa translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de l’accusation מְגַנְּבֵי דְבָרַי
  choice: les prophètes se volent entre eux les paroles que Yahweh revendique comme siennes
  alternative: les prophètes volent directement des paroles à Yahweh
  rationale: Le complément de provenance « chacun de la part de son prochain » indique que les paroles sont prises aux autres prophètes, tout en demeurant appelées « mes paroles » par Yahweh. La traduction conserve cette tension.
- issue: Expression distributive אִישׁ ... רֵעֵהוּ
  choice: les uns aux autres
  alternative: chacun à son prochain
  rationale: Le masculin singulier hébreu a ici une fonction distributive. Le français réciproque en reproduit le sens sans donner artificiellement à l’accusation une portée limitée aux hommes.
translation_notes:
  register: Français moderne, solennel et accessible. « Me voici contre » conserve la vigueur de l’annonce divine; les tirets isolent la formule prophétique sans obscurcir la phrase.
