  variant: modern international French
source:
  edition: WLC
  text: לַ/נְּבִאִ֞ים נִשְׁבַּ֧ר לִבִּ֣/י בְ/קִרְבִּ֗/י רָֽחֲפוּ֙ כָּל עַצְמוֹתַ֔/י הָיִ֨יתִי֙ כְּ/אִ֣ישׁ שִׁכּ֔וֹר וּ/כְ/גֶ֖בֶר עֲבָ֣ר/וֹ יָ֑יִן מִ/פְּנֵ֣י יְהוָ֔ה וּ/מִ/פְּנֵ֖י דִּבְרֵ֥י קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/009.yaml
  text: 'Concerning the prophets: my heart is broken within me[a]; all my bones tremble. I have become like a drunken man, like a strong man overcome by wine[c][b], because of Yahweh and because of his holy words.'
translation:
  language: fr
  text: 'Au sujet des prophètes[a] :


    Mon cœur est brisé en moi ;

    tous mes os tremblent[b].


    Je suis devenu comme un homme ivre,

    comme un homme fort terrassé par le vin,

    à cause de Yahweh et de ses paroles saintes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Contre les prophètes ». La préposition hébraïque peut introduire le sujet de l’oracle ou être comprise dans un sens hostile.
    reason: alternative_reading
  - marker: b
    text: Ou « frémissent » ou « sont secoués ».
    reason: lexical_alternative
  - marker: c
    text: Ou « devant Yahweh et devant ses paroles saintes ». Ici, « à cause de » comprend l’expression comme indiquant la cause de l’état bouleversé du prophète.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַנְּבִאִים
  choice: Au sujet des prophètes
  rationale: Le ל préfixé introduit ici naturellement le thème de l’oracle. « Au sujet de » conserve cette fonction sans imposer la nuance hostile possible dans « contre ».
- source_word: נִשְׁבַּר לִבִּי בְקִרְבִּי
  choice: Mon cœur est brisé au-dedans de moi
  rationale: Le nifal de שׁבר décrit un état de brisement. La formulation garde explicitement בְּקִרְבִּי tout en restant claire en français.
- source_word: רָחֲפוּ כָּל עַצְמוֹתַי
  choice: tous mes os tremblent
  rationale: רחף exprime ici une agitation physique, un tremblement ou un frémissement. « Tremblent » est naturel et préserve l’intensité corporelle de l’image.
- source_word: הָיִיתִי כְּאִישׁ שִׁכּוֹר
  choice: Je suis devenu comme un homme ivre
  rationale: Le parfait décrit l’état dans lequel le locuteur s’est trouvé. « Je suis devenu » rend naturellement cette situation résultante.
- source_word: וּכְגֶבֶר
  choice: comme un homme robuste
  rationale: גֶּבֶר peut évoquer un homme dans sa vigueur. « Robuste » conserve cette nuance et souligne que même sa force est neutralisée.
- source_word: עֲבָרוֹ יָיִן
  choice: terrassé par le vin
  rationale: L’expression présente le vin comme ayant pris le dessus sur l’homme. « Terrassé » rend vivement cette idée sans traduire mécaniquement le verbe עבר.
- source_word: מִפְּנֵי יְהוָה
  choice: à cause de Yahweh
  rationale: Dans le contexte, מִפְּנֵי peut exprimer la cause de l’état bouleversé du prophète. La possibilité plus spatiale ou relationnelle, « devant », est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: דִּבְרֵי קָדְשׁוֹ
  choice: ses paroles saintes
  rationale: Le groupe construit désigne naturellement les paroles caractérisées par la sainteté de Yahweh. Cette formulation française conserve aussi le suffixe possessif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Valeur de מִפְּנֵי dans la conclusion
  choice: à cause de
  alternative: devant
  rationale: La lecture causale relie directement l’effondrement physique du prophète à Yahweh et à ses paroles saintes, mais la valeur « devant » demeure linguistiquement possible et est conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La disposition en lignes fait ressortir le mouvement poétique du verset. Les images corporelles et l’ambiguïté des prépositions hébraïques sont préservées sans explication doctrinale ajoutée.
