  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עַֽל הָ/רֹעִים֮ הָ/רֹעִ֣ים אֶת עַמִּ/י֒ אַתֶּ֞ם הֲפִצֹתֶ֤ם אֶת צֹאנִ/י֙ וַ/תַּדִּח֔וּ/ם וְ/לֹ֥א פְקַדְתֶּ֖ם אֹתָ֑/ם הִנְ/נִ֨י פֹקֵ֧ד עֲלֵי/כֶ֛ם אֶת רֹ֥עַ מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/002.yaml
  text: 'Therefore this is what Yahweh[a], the God of Israel, says concerning the shepherds who shepherd my people: You have scattered my flock and driven them away, and you have not attended to them. Behold, I am about to attend to you for the evil of your deeds[b], declares Yahweh.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh, le Dieu d’Israël, au sujet[a] des bergers qui font paître mon peuple : « Vous avez dispersé mon troupeau, vous l’avez chassé et vous ne vous êtes pas occupés de lui. Me voici : je vais m’occuper de vous à cause de la méchanceté de vos actes[b], déclare Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre » ; la préposition hébraïque peut introduire un oracle dirigé contre les bergers.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète le même verbe dans les deux propositions : « vous ne vous êtes pas occupés de lui… je vais m’occuper de vous ». Ce retournement souligne que Yahweh demandera des comptes aux bergers pour leur négligence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: עַל הָרֹעִים
  choice: au sujet des bergers
  rationale: עַל peut signifier « au sujet de » ou, dans ce contexte de jugement, « contre » ; le texte principal garde la formulation non marquée et la note signale la nuance hostile possible.
- source_word: הָרֹעִים הָרֹעִים אֶת עַמִּי
  choice: les bergers qui font paître mon peuple
  rationale: Conserve la métaphore pastorale ainsi que la répétition de la même racine dans le nom et le verbe.
- source_word: הֲפִצֹתֶם אֶת צֹאנִי
  choice: vous avez dispersé mon troupeau
  rationale: Rend directement le causatif de פוץ et le sens collectif de צֹאן.
- source_word: וַתַּדִּחוּם
  choice: vous l’avez chassé
  rationale: Exprime l’action de repousser ou d’éloigner de force, tout en accordant naturellement le pronom avec « troupeau » en français.
- source_word: וְלֹא פְקַדְתֶּם אֹתָם … הִנְנִי פֹקֵד עֲלֵיכֶם
  choice: vous ne vous êtes pas occupés de lui … moi, je vais m’occuper de vous
  rationale: 'La répétition de « s’occuper de » reproduit le retournement produit par les deux emplois de פקד : les bergers ont négligé le troupeau, Yahweh va maintenant intervenir contre eux.'
- source_word: אֶת רֹעַ מַעַלְלֵיכֶם
  choice: à cause de la méchanceté de vos actes
  rationale: Préserve la construction hébraïque qui désigne le caractère mauvais de leurs actes comme motif du jugement.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formulation prophétique solennelle, claire et courante en français biblique moderne.
theological_decisions:
- issue: Le double sens de פקד dans la négligence et le jugement
  choice: Employer « s’occuper de » dans les deux propositions, le contexte et « à cause de la méchanceté de vos actes » donnant au second emploi sa portée punitive.
  alternative: Traduire « vous n’avez pas pris soin d’eux » puis « je vais vous punir ».
  rationale: Le choix conserve le jeu verbal et le renversement délibéré sans masquer la réalité du jugement.
- issue: La désignation des responsables comme bergers
  choice: Conserver « bergers » et « font paître ».
  alternative: Interpréter directement par « dirigeants » ou « chefs ».
  rationale: La métaphore structure le passage et doit rester visible, même si elle vise des responsables humains.
- issue: La portée de עַל dans l’introduction de l’oracle
  choice: Retenir « au sujet de » dans le texte et signaler « contre » en note.
  alternative: Traduire directement « contre les bergers ».
  rationale: La préposition permet les deux nuances ; la réprimande qui suit rend manifeste l’hostilité de l’oracle sans qu’il soit nécessaire de trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici ce que dit » et « déclare Yahweh » maintiennent la solennité prophétique ; « Eh bien, moi » marque naturellement l’opposition emphatique de הִנְנִי. Les pronoms français reprennent le collectif singulier « troupeau », alors que l’hébreu envisage les membres du troupeau au pluriel.
