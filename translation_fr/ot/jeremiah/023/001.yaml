id: JER.23.1
reference: Jeremiah 23:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֣וֹי רֹעִ֗ים מְאַבְּדִ֧ים וּ/מְפִצִ֛ים אֶת צֹ֥אן מַרְעִיתִ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/001.yaml
  text: Woe to the shepherds who are destroying and scattering the sheep of my pasture[a], declares Yahweh.
translation:
  language: fr
  text: Malheur aux bergers qui font périr et dispersent les brebis de mon pâturage[a] ! — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le troupeau de mon pâturage ».
    reason: Alternative lexicale pour צֹאן, nom collectif pouvant désigner les brebis ou le troupeau.
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule française conserve la force de dénonciation et l’annonce du jugement exprimées par l’interjection prophétique.
- source_word: רֹעִים
  choice: bergers
  rationale: Le sens concret est maintenu afin de préserver la métaphore pastorale appliquée aux dirigeants.
- source_word: מְאַבְּדִים
  choice: font périr
  rationale: Le participe décrit une action en cours; la tournure causative française rend naturellement la valeur intensive et destructrice du piel.
- source_word: וּמְפִצִים
  choice: et dispersent
  rationale: Le verbe parallèle évoque la dispersion continue du troupeau sans préciser davantage le moyen employé.
- source_word: אֶת צֹאן
  choice: les brebis
  rationale: Dans l’image des bergers, « brebis » rend concrètement le nom collectif צֹאן et demeure naturel en français.
- source_word: מַרְעִיתִי
  choice: de mon pâturage
  rationale: La traduction conserve le substantif et le suffixe possessif, ainsi que l’ambiguïté entre le lieu nourricier appartenant à Yahweh et, par métonymie, le troupeau dont il prend soin.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale solennelle suit de près la formule prophétique hébraïque et évite de transformer explicitement le nom en verbe de parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération représente le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Métaphore des bergers et du troupeau
  choice: Conserver « bergers » et « brebis » dans le texte principal.
  alternative: Interpréter directement la métaphore par « dirigeants » et « peuple ».
  rationale: L’hébreu présente explicitement une image pastorale structurante; la conserver respecte sa portée littéraire et théologique sans imposer son interprétation dans le texte.
- issue: Rapport exprimé par מַרְעִיתִי
  choice: « les brebis de mon pâturage »
  alternative: « le troupeau dont je prends soin »
  rationale: La formulation retenue préserve l’image concrète et la construction hébraïque, tandis que l’alternative explicite une relation de soin seulement implicite.
translation_notes:
  register: Français international moderne, solennel et accessible. La ponctuation française renforce l’oracle de jugement; « déclaration de Yahweh » garde le caractère formel de la clausule prophétique.
