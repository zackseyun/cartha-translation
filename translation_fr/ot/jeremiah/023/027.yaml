source:
  edition: WLC
  text: הַ/חֹשְׁבִ֗ים לְ/הַשְׁכִּ֤יחַ אֶת עַמִּ/י֙ שְׁמִ֔/י בַּ/חֲל֣וֹמֹתָ֔/ם אֲשֶׁ֥ר יְסַפְּר֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ כַּ/אֲשֶׁ֨ר שָׁכְח֧וּ אֲבוֹתָ֛/ם אֶת שְׁמִ֖/י בַּ/בָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/027.yaml
  text: who plan to make my people forget my name by their dreams that they tell[a], each man to his neighbor[b], just as their fathers forgot my name because of Baal.
translation:
  language: fr
  text: eux qui projettent de faire oublier mon nom à mon peuple par les rêves que chacun raconte à son prochain[a], tout comme leurs pères ont oublié mon nom à cause de Baal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moyen de leurs rêves » ou « dans leurs rêves ». La préposition hébraïque peut indiquer le moyen ou la sphère.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour Baal » ou « par Baal ». L’hébreu signifie probablement que l’attachement à Baal les a conduits à oublier son nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹשְׁבִים
  choice: qui projettent
  rationale: Le participe de חשׁב exprime ici une intention délibérée dans le contexte des faux prophètes, et non une simple pensée.
- source_word: לְהַשְׁכִּיחַ
  choice: de faire oublier
  rationale: L’infinitif hiphil de שׁכח est causatif; « faire oublier » en conserve naturellement la valeur.
- source_word: עַמִּי
  choice: à mon peuple
  rationale: Le possessif explicite et la portée relationnelle de l’expression sont conservés.
- source_word: שְׁמִי
  choice: mon nom
  rationale: La traduction littérale préserve le poids biblique du nom comme expression de l’identité révélée de Dieu, sans l’expliciter abusivement.
- source_word: בַּחֲלֹמוֹתָם
  choice: par les rêves
  rationale: La préposition ב peut ici indiquer le moyen ou la sphère; le contexte favorise les rêves comme moyen employé pour provoquer l’oubli.
- source_word: אֲשֶׁר יְסַפְּרוּ
  choice: qu’ils se racontent
  rationale: Le piel de ספר signifie raconter. La tournure pronominale s’accorde naturellement avec l’échange réciproque indiqué ensuite.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: l’un à l’autre
  rationale: Cette expression française restitue clairement la valeur distributive et réciproque de l’hébreu sans alourdir la phrase.
- source_word: כַּאֲשֶׁר
  choice: tout comme
  rationale: La locution marque nettement la comparaison entre l’action des faux prophètes et l’apostasie des générations antérieures.
- source_word: שָׁכְחוּ אֲבוֹתָם
  choice: leurs pères ont oublié
  rationale: « Leurs pères » suit directement אֲבוֹתָם et maintient la comparaison intergénérationnelle.
- source_word: בַּבָּעַל
  choice: à cause de Baal
  rationale: La préposition ב peut signaler ici la cause, le moyen ou l’association; cette formulation exprime que le recours à Baal a conduit à l’oubli, tout en gardant le nom propre.
theological_decisions:
- issue: Langage du « nom » dans le cadre de l’alliance
  choice: Conserver « mon nom » aux deux occurrences
  alternative: « qui je suis » ou « ma renommée »
  rationale: La formulation littérale maintient la tension entre le nom révélé de Dieu, son identité et la fidélité qui lui est due, sans imposer une paraphrase doctrinale.
- issue: Expression distributive masculine אִישׁ לְרֵעֵהוּ
  choice: « l’un à l’autre »
  alternative: « chacun à son prochain »
  rationale: Le français idiomatique exprime ici naturellement la réciprocité collective. Le genre grammatical masculin de l’hébreu a une portée représentative et n’exige pas une formulation française marquée.
- issue: Valeur de ב dans בַּבָּעַל
  choice: « à cause de Baal »
  alternative: « pour Baal » ou « par Baal »
  rationale: Le contexte évoque l’apostasie associée au culte de Baal, mais la préposition demeure polysémique; une note conserve les autres lectures possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère accusateur du fragment hébreu, qui dépend de la phrase précédente. « Projettent » marque l’intention délibérée; « se racontent l’un à l’autre » rend l’échange oral de façon naturelle.
