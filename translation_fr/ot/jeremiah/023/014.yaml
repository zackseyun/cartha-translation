reference: Jeremiah 23:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בִ/נְבִאֵ֨י יְרוּשָׁלִַ֜ם רָאִ֣יתִי שַׁעֲרוּרָ֗ה נָא֞וֹף וְ/הָלֹ֤ךְ בַּ/שֶּׁ֨קֶר֙ וְ/חִזְּקוּ֙ יְדֵ֣י מְרֵעִ֔ים לְ/בִ֨לְתִּי שָׁ֔בוּ אִ֖ישׁ מֵ/רָֽעָת֑/וֹ הָֽיוּ לִ֤/י כֻלָּ/ם֙ כִּ/סְדֹ֔ם וְ/יֹשְׁבֶ֖י/הָ כַּ/עֲמֹרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/014.yaml
  text: 'And among the prophets of Jerusalem I have seen a horrible thing: committing adultery and walking in falsehood[a]; they have strengthened the hands of evildoers, so that no man turns back from his evil. All of them are to me like Sodom[b], and her inhabitants like Gomorrah.'
translation:
  language: fr
  text: 'Et parmi les prophètes de Jérusalem, j’ai vu une chose effroyable : ils commettent l’adultère et marchent dans le mensonge ; ils encouragent ceux qui font le mal, si bien que personne ne se détourne de sa méchanceté[a]. Ils sont tous pour moi comme Sodome, et les habitants de Jérusalem comme Gomorrhe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne se repent de sa méchanceté ». Le verbe hébreu signifie littéralement revenir ou se détourner et peut, dans ce contexte, exprimer la repentance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְבִאֵי יְרוּשָׁלִַם
  choice: Et parmi les prophètes de Jérusalem
  rationale: La préposition ב indique ici la sphère ou le groupe concerné ; « parmi » est l’équivalent français naturel. Le waw initial est conservé par « Et » pour maintenir l’enchaînement du discours.
- source_word: רָאִיתִי שַׁעֲרוּרָה
  choice: j’ai vu une chose effroyable
  rationale: Le parfait est rendu par le passé composé, naturel en français et compatible avec la portée actuelle du constat. שַׁעֲרוּרָה désigne une réalité moralement révoltante ou épouvantable.
- source_word: נָאוֹף
  choice: ils commettent l’adultère
  rationale: La tournure verbale hébraïque est explicitée comme action des prophètes, plutôt que réduite au nom abstrait « adultère ».
- source_word: וְהָלֹךְ בַּשֶּׁקֶר
  choice: et marchent dans le mensonge
  rationale: Cette formulation conserve la métaphore hébraïque de la marche comme manière de vivre, ainsi que le singulier collectif « le mensonge ».
- source_word: וְחִזְּקוּ יְדֵי מְרֵעִים
  choice: ils encouragent ceux qui font le mal
  rationale: L’expression idiomatique « fortifier les mains » signifie soutenir, affermir ou enhardir. « Encouragent » en communique clairement le sens en français moderne sans calque obscur.
- source_word: לְבִלְתִּי שָׁבוּ אִישׁ מֵרָעָתוֹ
  choice: si bien que personne ne se détourne de sa méchanceté
  rationale: לְבִלְתִּי exprime ici le résultat négatif. אִישׁ est un singulier distributif, rendu naturellement par « personne ». « Se détourne » préserve l’image de שׁוב et sa possible nuance de repentance.
- source_word: הָיוּ לִי כֻלָּם כִּסְדֹם
  choice: Ils sont tous pour moi comme Sodome
  rationale: La formulation conserve לִי, qui marque l’évaluation divine, tout en rendant היה de façon idiomatique dans ce constat comparatif.
- source_word: וְיֹשְׁבֶיהָ כַּעֲמֹרָה
  choice: et les habitants de Jérusalem comme Gomorrhe
  rationale: Le suffixe féminin renvoie à Jérusalem. La répétition explicite du nom évite qu’en français le possessif semble renvoyer par erreur à Sodome.
theological_decisions:
- issue: Portée du singulier distributif אִישׁ
  choice: personne ne se détourne de sa méchanceté
  alternative: aucun homme ne revient de son mal
  rationale: Dans ce contexte, אִישׁ a une valeur distributive représentative plutôt qu’une restriction explicite aux hommes. « Personne » rend cette portée fidèlement et naturellement en français.
- issue: Nuance de repentance dans שׁוב
  choice: se détourne
  alternative: se repent
  rationale: « Se détourner » conserve l’image lexicale du changement de direction tout en laissant entendre le retournement moral. La note signale la traduction théologique plus explicite sans l’imposer dans le texte.
- issue: Comparaison avec Sodome et Gomorrhe
  choice: Ils sont tous pour moi comme Sodome, et les habitants de Jérusalem comme Gomorrhe
  alternative: Ils sont tous devenus pour moi comme Sodome, et ses habitants comme Gomorrhe
  rationale: Le texte présente l’évaluation divine des prophètes et des habitants de Jérusalem. « Sont » évite de surinterpréter היה comme un processus de transformation, tandis que l’explicitation de Jérusalem clarifie l’antécédent.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la marche est conservée, tandis que l’idiome hébreu « fortifier les mains » est rendu selon son sens pour éviter un calque peu naturel. La structure accusatrice et la comparaison solennelle avec Sodome et Gomorrhe sont maintenues.
