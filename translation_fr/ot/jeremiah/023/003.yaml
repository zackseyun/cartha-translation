  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֗י אֲקַבֵּץ֙ אֶת שְׁאֵרִ֣ית צֹאנִ֔/י מִ/כֹּל֙ הָ/אֲרָצ֔וֹת אֲשֶׁר הִדַּ֥חְתִּי אֹתָ֖/ם שָׁ֑ם וַ/הֲשִׁבֹתִ֥י אֶתְ/הֶ֛ן עַל נְוֵ/הֶ֖ן וּ/פָר֥וּ וְ/רָבֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/003.yaml
  text: And I myself will gather the remnant of my flock out of all the lands where I have driven them[a], and I will bring them back to their pasture[b], and they will be fruitful and multiply.
translation:
  language: fr
  text: Quant à moi, je rassemblerai le reste de mon troupeau de tous les pays où je les ai chassés[a]. Je les ramènerai dans leurs pâturages[b] ; ils seront féconds et se multiplieront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dispersés ». Le verbe hébreu peut évoquer le fait de pousser au loin ou de disperser ; « chassés » conserve ici la force du jugement divin.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans leurs enclos » ou « dans leurs lieux de séjour ». Le terme hébreu peut désigner un pâturage, une demeure ou un lieu de repos ; « pâturages » prolonge ici l'image du troupeau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant souligne le sujet déjà marqué par le verbe. « Quant à moi » rend naturellement cette emphase en français et marque le contraste contextuel.
- source_word: אֲקַבֵּץ
  choice: je rassemblerai
  rationale: Le verbe קבץ désigne couramment le rassemblement de personnes ou d'un troupeau dispersés, notamment dans les annonces de restauration.
- source_word: שְׁאֵרִית צֹאנִי
  choice: le reste de mon troupeau
  rationale: « Le reste » est clair en français moderne et conserve l'idée prophétique de ce qui subsiste ; « troupeau » maintient l'image pastorale collective.
- source_word: מִכֹּל הָאֲרָצוֹת
  choice: de tous les pays
  rationale: Dans ce contexte de dispersion, אֲרָצוֹת désigne les différents territoires ou pays où le peuple a été conduit.
- source_word: הִדַּחְתִּי
  choice: je les ai chassés
  rationale: Le hiphil de נדח exprime le fait de pousser au loin ou de disperser. « Chassés » conserve la responsabilité divine et la force du jugement.
- source_word: וַהֲשִׁבֹתִי אֶתְהֶן
  choice: Je les ramènerai
  rationale: La forme causative de שוב signifie faire revenir. « Ramènerai » exprime cette action concrète avec concision.
- source_word: עַל נְוֵיהֶן
  choice: dans leurs pâturages
  rationale: נָוֶה peut désigner un pâturage, un lieu de séjour ou un enclos. « Pâturages » convient particulièrement à la métaphore du troupeau, et « dans » est idiomatique en français.
- source_word: וּפָרוּ וְרָבוּ
  choice: ils seront féconds et se multiplieront
  rationale: Cette formulation conserve le binôme biblique פרה ורבה et sa résonance de bénédiction et de restauration.
theological_decisions:
- issue: Responsabilité divine dans l'exil et la restauration
  choice: Conserver à la fois « où je les ai chassés » et la promesse « Je les ramènerai ».
  alternative: Atténuer la responsabilité divine en traduisant par une tournure passive telle que « où ils avaient été dispersés ».
  rationale: L'hébreu attribue explicitement à Dieu l'éloignement du troupeau comme son rassemblement ultérieur. La traduction préserve donc sans l'atténuer la tension entre jugement et restauration.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe en deux phrases allège le verset sans rompre sa progression. « Quant à moi » porte l'emphase du pronom hébreu ; le vocabulaire pastoral et la formule « féconds et se multiplieront » préservent les échos bibliques.
