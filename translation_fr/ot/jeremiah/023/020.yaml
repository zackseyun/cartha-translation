source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַֽחֲרִית֙ הַ/יָּמִ֔ים תִּתְבּ֥וֹנְנוּ בָ֖/הּ בִּינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/020.yaml
  text: The anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart[c][b]. In the latter days you will understand it clearly.
translation:
  language: fr
  text: La colère de Yahweh ne se détournera pas jusqu’à ce qu’il ait agi[a], jusqu’à ce qu’il ait accompli les projets de son cœur[b]. Dans les derniers jours[c], vous comprendrez cela clairement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à ce qu’il ait fait cela ». L’hébreu ne précise pas explicitement l’objet de l’action.
    reason: lexical_alternative
  - marker: b
    text: Ou « les intentions de son cœur ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans les temps à venir ». L’expression hébraïque peut désigner un avenir encore à venir, avec une résonance prophétique.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: colère
  rationale: Dans cette expression appliquée à Yahweh, le terme désigne la colère plutôt que le sens concret de « nez ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: לֹא יָשׁוּב
  choice: ne se détournera pas
  rationale: Cette formulation conserve l’image hébraïque d’une colère qui ne fait pas demi-tour et ne se retire pas.
- source_word: עַד עֲשֹׂתוֹ
  choice: avant qu’il ait agi
  rationale: Le verbe hébreu reste général et ne précise pas explicitement d’objet; « agir » restitue naturellement cette portée en français.
- source_word: וְעַד הֲקִימוֹ
  choice: et accompli
  rationale: Dans ce contexte, la forme causative de קום exprime la mise à exécution effective des projets; « accomplir » est idiomatique avec ce complément.
- source_word: מְזִמּוֹת לִבּוֹ
  choice: les projets de son cœur
  rationale: « Projets » exprime des intentions délibérées sans la connotation nécessairement négative de « desseins » ou « machinations »; « cœur » préserve l’anthropologie idiomatique hébraïque.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Dans la suite des temps
  rationale: Cette expression française conserve une orientation vers une période future sans imposer à la formule un sens eschatologique technique.
- source_word: תִּתְבּוֹנְנוּ בָהּ בִּינָה
  choice: vous le comprendrez clairement
  rationale: Le verbe de discernement renforcé par le nom בינה est rendu par l’adverbe « clairement », ce qui évite une répétition peu naturelle en français.
theological_decisions:
- issue: Portée temporelle de בְּאַחֲרִית הַיָּמִים
  choice: Dans la suite des temps
  alternative: Dans les derniers jours
  rationale: L’hébreu peut désigner les temps à venir tout en portant, dans le discours prophétique, une résonance eschatologique. Le texte retient une formulation ouverte et signale l’autre possibilité en note.
translation_notes:
  register: Français international moderne, sobre et prophétique. La phrase conserve l’image de la colère qui ne se détourne pas, le nom Yahweh et l’ambiguïté temporelle de la formule finale.
