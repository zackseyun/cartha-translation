  text: שָׁמַ֗עְתִּי אֵ֤ת אֲשֶׁר אָֽמְרוּ֙ הַ/נְּבִאִ֔ים הַֽ/נִּבְּאִ֥ים בִּ/שְׁמִ֛/י שֶׁ֖קֶר לֵ/אמֹ֑ר חָלַ֖מְתִּי חָלָֽמְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/025.yaml
  text: I have heard what the prophets have said[a], those who prophesy lies in my name, saying, ‘I have dreamed! I have dreamed!’
translation:
  language: fr
  text: 'J’ai entendu ce qu’ont dit les prophètes qui prophétisent des mensonges[a] en mon nom, en disant : « J’ai fait un rêve ! J’ai fait un rêve ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui prophétisent faussement en mon nom ».'
    reason: L’hébreu שֶׁקֶר peut désigner le contenu mensonger de la prophétie ou qualifier la manière de prophétiser.
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: Le qal accompli à la première personne du singulier exprime une audition achevée qui reste pertinente dans la dénonciation présente.
- source_word: אֵת אֲשֶׁר אָמְרוּ
  choice: ce qu’ont dit
  rationale: L’indicateur d’objet suivi du relatif se rend naturellement par « ce que » ; l’accompli אָמְרוּ est conservé par le passé composé.
- source_word: הַנְּבִאִים הַנִּבְּאִים
  choice: les prophètes, ceux qui prophétisent
  rationale: Le nom défini puis le participe niphal apposé sont distingués tout en gardant leur lien explicatif.
- source_word: בִּשְׁמִי
  choice: en mon nom
  rationale: Expression française usuelle pour une parole qui revendique l’autorité divine.
- source_word: שֶׁקֶר
  choice: des mensonges
  rationale: Le substantif concret garde la force accusatrice de l’hébreu ; il peut ici caractériser soit le contenu, soit la manière de prophétiser.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rend naturellement l’infinitif quotatif qui introduit les paroles rapportées.
- source_word: חָלַמְתִּי חָלָמְתִּי
  choice: J’ai fait un rêve ! J’ai fait un rêve !
  rationale: « Faire un rêve » est l’expression française naturelle ; la répétition et les exclamations préservent l’insistance de la revendication.
theological_decisions:
- issue: Nature de l’affirmation des faux prophètes
  choice: ceux qui prophétisent des mensonges en mon nom
  alternative: ceux qui prophétisent faussement en mon nom
  rationale: שֶׁקֶר peut être compris comme le contenu mensonger de leur prophétie ou de manière adverbiale. Le texte principal conserve la force concrète du substantif sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure appositive et la répétition emphatique de l’hébreu sont conservées ; aucune note n’est nécessaire puisque l’ambiguïté de שֶׁקֶר reste perceptible dans la formulation.
