  text: לָ/כֵ֞ן כֹּֽה אָמַ֨ר יְהוָ֤ה צְבָאוֹת֙ עַל הַ/נְּבִאִ֔ים הִנְ/נִ֨י מַאֲכִ֤יל אוֹתָ/ם֙ לַֽעֲנָ֔ה וְ/הִשְׁקִתִ֖י/ם מֵי רֹ֑אשׁ כִּ֗י מֵ/אֵת֙ נְבִיאֵ֣י יְרוּשָׁלִַ֔ם יָצְאָ֥ה חֲנֻפָּ֖ה לְ/כָל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/015.yaml
  text: 'Therefore this is what Yahweh of Armies says concerning the prophets: ‘Look[a], I am feeding them wormwood and making them drink poisoned water, because from the prophets of Jerusalem ungodliness has gone out into all the land.’'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh des armées au sujet des prophètes : « Je vais leur faire manger de l’absinthe et leur faire boire de l’eau empoisonnée[a], car c’est des prophètes de Jérusalem que l’impiété s’est répandue dans tout le pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’eau de fiel ». L’hébreu dit littéralement « des eaux de rosh », expression qui désigne une substance amère ou toxique.
    reason: Signaler la formulation plus littérale et l’incertitude sur la substance précise désignée par רֹאשׁ.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et le sens concret de צְבָאוֹת dans une formulation française claire et digne.
- source_word: עַל הַנְּבִאִים
  choice: au sujet des prophètes
  rationale: עַל peut signifier « au sujet de » ou « contre ». La première solution préserve ici l’ambiguïté de la préposition, tandis que la condamnation ressort nettement du contenu de l’oracle.
- source_word: הִנְנִי מַאֲכִיל
  choice: je vais leur faire manger
  rationale: Rend l’emphase de הִנְנִי et la valeur imminente de la construction avec le participe, tout en conservant la valeur causative de מַאֲכִיל.
- source_word: לַעֲנָה
  choice: de l’absinthe
  rationale: L’absinthe est une plante proverbialement amère ; ce choix maintient l’image prophétique concrète plutôt que de la réduire à une abstraction.
- source_word: מֵי רֹאשׁ
  choice: de l’eau empoisonnée
  rationale: Dans cette expression, רֹאשׁ désigne une substance amère ou toxique. « Eau empoisonnée » en communique clairement le sens en français moderne.
- source_word: חֲנֻפָּה
  choice: l’impiété
  rationale: Ce terme exprime la corruption religieuse et morale ou la profanation ; « impiété » en conserve les deux dimensions.
- source_word: יָצְאָה ... מֵאֵת
  choice: s’est répandue depuis
  rationale: Exprime naturellement en français le mouvement de la corruption partie des prophètes de Jérusalem, sans perdre l’idée de provenance.
- source_word: לְכָל הָאָרֶץ
  choice: dans tout le pays
  rationale: Dans ce contexte de Jérémie, הָאָרֶץ renvoie vraisemblablement au pays concerné, plutôt qu’à la terre entière.
theological_decisions:
- issue: Image du jugement divin
  choice: Conserver les images concrètes de l’absinthe donnée à manger et de l’eau empoisonnée donnée à boire.
  alternative: Paraphraser par « je leur ferai subir un jugement amer ».
  rationale: Le texte hébreu présente le jugement sous une forme imagée et saisissante. La conserver maintient sa force théologique sans l’expliquer à la place du lecteur.
- issue: Valeur temporelle de הִנְנִי avec les participes
  choice: « Je vais leur faire manger… et leur faire boire »
  alternative: « Je leur fais manger… et leur fais boire »
  rationale: La tournure annonce ici une intervention divine imminente. Le futur proche est naturel en français tout en évitant de préciser davantage le moment de son accomplissement.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe prophétique reste solennelle sans archaïsmes. Le marqueur de note [a] est placé après l’expression qu’il explique.
