  variant: modern international French
source:
  edition: WLC
  text: אִם יִסָּתֵ֨ר אִ֧ישׁ בַּ/מִּסְתָּרִ֛ים וַ/אֲנִ֥י לֹֽא אֶרְאֶ֖/נּוּ נְאֻם יְהוָ֑ה הֲ/ל֨וֹא אֶת הַ/שָּׁמַ֧יִם וְ/אֶת הָ/אָ֛רֶץ אֲנִ֥י מָלֵ֖א נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/024.yaml
  text: Can a man hide himself in secret places so that I do not see him? declares Yahweh[b][a]. Do I not fill heaven and earth? declares Yahweh.
translation:
  language: fr
  text: Quelqu’un peut-il se cacher dans des lieux secrets sans que je le voie ? — oracle de Yahweh.[a] Ne remplis-je pas les cieux et la terre ? — oracle de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Si quelqu’un se cache dans des lieux secrets, est-ce que je ne le verrai pas ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִסָּתֵר אִישׁ
  choice: Quelqu’un peut-il se cacher
  rationale: Dans cette question rhétorique, אִם introduit un défi plutôt qu’une simple condition. « Peut-il » en restitue naturellement la force, tandis que « quelqu’un » exprime en français moderne la portée générique de אִישׁ.
- source_word: בַּמִּסְתָּרִים
  choice: dans des lieux secrets
  rationale: Le pluriel hébreu désigne des endroits cachés ou retirés ; cette formulation conserve le pluriel et reste naturelle.
- source_word: וַאֲנִי לֹא אֶרְאֶנּוּ
  choice: sans que je le voie
  rationale: 'La tournure exprime le résultat envisagé : se cacher de manière à échapper au regard de Dieu. Le subjonctif français convient après « sans que ».'
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale prophétique est rendue avec solennité sans la transformer en simple verbe de parole ; le nom divin est translittéré.
- source_word: הֲלוֹא
  choice: Est-ce que je ne
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative ; cette tournure est claire en français courant.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: les cieux et la terre
  rationale: Le pluriel morphologique de שָׁמַיִם est conservé. L’ensemble forme un mérisme désignant la totalité du monde créé.
- source_word: מָלֵא
  choice: remplis
  rationale: Le choix conserve l’image forte et concrète du texte hébreu plutôt que de la remplacer par le terme doctrinal abstrait « omniprésent ».
theological_decisions:
- issue: Présence divine dans toute la création
  choice: Est-ce que je ne remplis pas les cieux et la terre ?
  alternative: Ne suis-je pas présent partout dans les cieux et sur la terre ?
  rationale: La traduction conserve la métaphore hébraïque de Dieu qui « remplit » les cieux et la terre, sans en réduire la portée à une formulation doctrinale explicative.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom propre présent dans le texte hébreu au lieu de lui substituer un titre.
- issue: Ambiguïté syntaxique de אִם
  choice: 'Question de possibilité : « Quelqu’un peut-il… ? »'
  alternative: 'Question conditionnelle : « Si quelqu’un se cache…, ne le verrai-je pas ? »'
  rationale: La lecture choisie rend naturellement le défi rhétorique en français, tandis que la lecture conditionnelle, grammaticalement possible, est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation avec tiret met en relief la formule prophétique répétée. « Quelqu’un » est employé au sens humain générique, et « les cieux » conserve la forme plurielle de l’hébreu.
