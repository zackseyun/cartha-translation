  terminology: « Yahweh » respecte le rendu du tétragramme demandé. « Les cieux et la terre » conserve les articles définis ainsi que le pluriel de שָׁמַיִם. « Oracle » rend convenablement la formule prophétique נְאֻם sans la réduire à une simple attribution de discours.
