  source_fidelity: 'Le sens des deux questions rhétoriques est fidèlement rendu : la possibilité de se soustraire au regard divin est niée, et l’image selon laquelle Yahweh « remplit » les cieux et la terre est conservée. « Quelqu’un » rend légitimement l’emploi générique de אִישׁ, sans introduire de précision absente du texte. La note préserve de façon appropriée la lecture conditionnelle possible de אִם.'
