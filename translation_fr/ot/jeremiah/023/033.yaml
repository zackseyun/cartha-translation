  yaml_path: translation/ot/jeremiah/023/033.yaml
  text: And when this people, or a prophet, or a priest asks you, saying, ‘What is the burden of the LORD?’ then you shall say to them, ‘You are the burden, and I will cast you off,’ declares the LORD.
translation:
  language: fr
  text: 'Si ce peuple, ou un prophète, ou un prêtre, te demande : « Quel est le fardeau du SEIGNEUR ? », tu leur répondras : « Quel fardeau[a] ? Je vais vous abandonner », déclare le SEIGNEUR.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon le texte hébreu vocalisé. En lisant autrement les mêmes consonnes : « C’est vous, le fardeau. »'
    reason: Signaler une ambiguïté textuelle ancienne qui modifie la réponse tout en préservant le jeu sur le mot « fardeau ».
lexical_decisions:
- source_word: מַשָּׂא
  choice: fardeau
  rationale: Le mot peut désigner à la fois une charge pesante et un oracle prophétique. « Fardeau » conserve ici le jeu de mots accusateur qui structure la réponse.
- source_word: וְנָטַשְׁתִּי אֶתְכֶם
  choice: Je vais vous abandonner
  rationale: נָטַשׁ signifie laisser, délaisser ou abandonner. Cette formulation naturelle conserve l’action divine annoncée sans préciser davantage ses modalités.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: La graphie en petites capitales représente traditionnellement le nom divin YHWH en français tout en distinguant celui-ci du titre ordinaire « Seigneur ».
theological_decisions:
- issue: Lecture de אֶת־מַה־מַשָּׂא
  choice: « Quel fardeau ? » selon le texte hébreu vocalisé transmis
  alternative: « C’est vous, le fardeau »
  rationale: Le texte massorétique vocalisé porte littéralement une question, « Quel fardeau ? ». La variante « C’est vous, le fardeau » repose sur une autre lecture des consonnes et explique bien le jeu de mots, mais elle ne doit pas remplacer silencieusement la forme attestée dans la WLC.
translation_notes:
  register: Français moderne, direct et digne. La répétition de « fardeau » est volontaire afin de conserver le jeu verbal hébreu. Le tutoiement correspond à l’adresse singulière faite à Jérémie, tandis que « leur » et « vous » visent les personnes qui l’interrogent.
