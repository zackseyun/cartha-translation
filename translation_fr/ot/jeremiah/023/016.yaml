  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אַֽל תִּשְׁמְע֞וּ עַל דִּבְרֵ֤י הַ/נְּבִאִים֙ הַ/נִּבְּאִ֣ים לָ/כֶ֔ם מַהְבִּלִ֥ים הֵ֖מָּה אֶתְ/כֶ֑ם חֲז֤וֹן לִבָּ/ם֙ יְדַבֵּ֔רוּ לֹ֖א מִ/פִּ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/016.yaml
  text: 'Thus says Yahweh of hosts: Do not listen to the words of the prophets who prophesy to you; they are deluding you. They speak a vision of their own heart[a], not from the mouth of Yahweh.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : « N’écoutez pas les paroles des prophètes qui vous prophétisent : ils vous trompent[a]. Ils proclament une vision de leur propre cœur, non de la bouche de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils vous abusent ». Plus littéralement, « ils vous rendent vains » ou « ils vous remplissent de vide » ; le verbe hébreu évoque ce qui est vide, vain ou illusoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par un terme français actuel et concret, sans limiter ces armées aux seules forces terrestres.
- source_word: אַל תִּשְׁמְעוּ עַל דִּבְרֵי
  choice: N’écoutez pas les paroles
  rationale: Formulation française naturelle qui exprime ici l’idée de ne pas prêter foi au message, tout en conservant le pluriel « paroles ».
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: des prophètes qui prophétisent pour vous
  rationale: Préserve la répétition étymologique entre « prophètes » et « prophétisent ». Le français « pour vous » rend לָכֶם sans suggérer nécessairement que leur message vient réellement de Dieu.
- source_word: מַהְבִּלִים הֵמָּה אֶתְכֶם
  choice: Ils vous égarent dans le vide
  rationale: Rend la causalité du hiphil de הבל ainsi que l’image d’inanité ou de vide, sans la réduire uniquement à la tromperie ni préciser indûment qu’il s’agit de faux espoirs.
- source_word: חֲזוֹן לִבָּם
  choice: une vision qui vient de leur propre cœur
  rationale: Conserve l’image hébraïque du cœur, siège de la pensée et de la volonté, tout en explicitant naturellement en français que la vision en provient.
- source_word: לֹא מִפִּי יְהוָה
  choice: et non de la bouche de Yahweh
  rationale: Préserve l’image concrète de la bouche divine et le contraste de provenance avec leur propre cœur.
theological_decisions:
- issue: Effet produit par les faux prophètes selon מַהְבִּלִים
  choice: Ils vous égarent dans le vide
  alternative: Ils vous trompent ; ils vous remplissent de faux espoirs ; ils vous rendent vains
  rationale: Le verbe dérivé de הבל évoque le vide, l’inanité et l’illusion. La traduction retenue garde cette amplitude et évite de résoudre le sens exclusivement en termes de faux espoir.
- issue: Origine de la vision
  choice: une vision qui vient de leur propre cœur
  alternative: une vision de leur esprit
  rationale: « Cœur » maintient l’anthropologie imagée de l’hébreu et le contraste théologique entre une parole issue de l’être humain et celle qui vient de la bouche de Yahweh.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La ponctuation met la parole divine entre guillemets. « Prophètes qui prophétisent » conserve volontairement la répétition hébraïque ; « Yahweh des armées » privilégie une formulation transparente plutôt que le traditionnel « des armées célestes », qui serait plus explicatif.
