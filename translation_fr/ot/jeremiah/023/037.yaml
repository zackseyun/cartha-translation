source:
  edition: WLC
  text: כֹּ֥ה תֹאמַ֖ר אֶל הַ/נָּבִ֑יא מֶה עָנָ֣/ךְ יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/037.yaml
  text: 'Thus you shall say to the prophet: ‘What has Yahweh answered you[a], and what has Yahweh spoken?’'
translation:
  language: fr
  text: 'Voici ce que tu diras au prophète : « Que t’a[a] répondu Yahweh, et qu’a dit Yahweh ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le suffixe rendu par « t’ » est à la deuxième personne du féminin singulier, bien que « le prophète » soit au masculin.
    reason: ambiguïté grammaticale du texte hébreu
lexical_decisions:
- source_word: כֹּה
  choice: Voici ce que
  rationale: Introduit la formulation prescrite de manière naturelle en français moderne, tout en conservant sa force directive.
- source_word: תֹאמַר
  choice: tu diras
  rationale: L’imparfait hébreu a ici une valeur injonctive; le futur français exprime naturellement cette instruction.
- source_word: אֶל הַנָּבִיא
  choice: au prophète
  rationale: Conserve le singulier défini du texte hébreu.
- source_word: מֶה עָנָךְ יְהוָה
  choice: Que t’a répondu Yahweh
  rationale: Rend ענה par « répondre » et le parfait par le passé composé, idiomatique dans une question directe en français.
- source_word: וּמַה דִּבֶּר יְהוָה
  choice: et qu’a dit Yahweh
  rationale: « Dire » rend ici naturellement דבר sans alourdir la phrase; la coordination et le parallélisme interrogatif sont maintenus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent deux fois dans le texte, plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; sa transcription préserve le caractère personnel du nom divin.
- issue: Genre grammatical du destinataire dans עָנָךְ
  choice: Forme française non marquée dans le corps du texte, avec note
  alternative: Expliciter un destinataire féminin
  rationale: Le suffixe hébreu est féminin singulier, alors que הַנָּבִיא, « le prophète », est masculin. Le français « t’ » laisse subsister cette tension sans imposer une résolution.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement conserve la deuxième personne du singulier. Les guillemets français signalent la parole prescrite.
