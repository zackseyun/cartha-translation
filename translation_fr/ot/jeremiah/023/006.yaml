base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/006.yaml
  text: 'In his days Judah will be saved[a], and Israel will dwell securely[b]; and this is the name by which he will be called: Yahweh Is Our Righteousness.'
translation:
  language: fr
  text: 'En son temps, Juda sera sauvé, et Israël habitera en sécurité ; voici le nom qu’on lui donnera : « Yahweh est notre justice[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh, notre justice. » L’hébreu ne comporte pas de verbe exprimé dans cette formule nominale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: En son temps
  rationale: L’expression signifie littéralement « dans ses jours » et désigne l’époque du roi juste annoncé dans le contexte. « En son temps » conserve cette référence personnelle dans un français naturel.
- source_word: תִּוָּשַׁע
  choice: sera sauvé
  rationale: Le nifal de ישׁע exprime le fait d’être sauvé ou délivré. « Sera sauvé » garde l’étendue du terme sans limiter le salut à sa dimension militaire, politique ou spirituelle.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: habitera en sécurité
  rationale: שׁכן indique une habitation stable, tandis que לבטח exprime la sécurité et l’absence de crainte. Cette formulation est claire et actuelle.
- source_word: אֲשֶׁר יִקְרְאוֹ
  choice: dont on l’appellera
  rationale: Le verbe hébreu est à la troisième personne du singulier avec un suffixe objet masculin. Le pronom indéfini « on » laisse le sujet de l’action non précisé, comme dans l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre יהוה au lieu de lui substituer un titre.
- source_word: צִדְקֵנוּ
  choice: notre justice
  rationale: צדק couvre la rectitude, la justice et la conformité à ce qui est droit. Dans cette formule nominale, « notre justice » est à la fois concise et suffisamment large en français.
theological_decisions:
- issue: Valeur de la formule royale יְהוָה צִדְקֵנוּ
  choice: Yahweh est notre justice
  alternative: Yahweh, notre justice
  rationale: La phrase hébraïque ne comporte pas de copule exprimée. Fournir « est » donne en français une lecture prédicative naturelle, tout en signalant en note que la formule peut aussi se comprendre comme un nom nominal sans verbe. La traduction n’explicite pas davantage la relation entre Yahweh, la justice et le roi annoncé.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la solennité de l’annonce royale sans archaïsme. « En son temps » évite le calque peu naturel « dans ses jours », et « on l’appellera » respecte l’indétermination grammaticale du sujet hébreu.
