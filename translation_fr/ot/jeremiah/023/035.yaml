source:
  edition: WLC
  text: כֹּ֥ה תֹאמְר֛וּ אִ֥ישׁ עַל רֵעֵ֖/הוּ וְ/אִ֣ישׁ אֶל אָחִ֑י/ו מֶה עָנָ֣ה יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/035.yaml
  text: Thus each man shall say to his neighbor[a], and each man to his brother, ‘What has Yahweh answered?’ and[b], ‘What has Yahweh spoken?’
translation:
  language: fr
  text: 'Voici ce que vous direz, chacun à son prochain et chacun à son frère : « Qu’a répondu Yahvé ? Et qu’a dit Yahvé ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה
  choice: Voici ce que
  rationale: Cette tournure introduit naturellement en français la manière prescrite de parler, tout en conservant la valeur de כֹּה.
- source_word: תֹאמְרוּ
  choice: vous direz
  rationale: Le futur français exprime ici la directive adressée à la deuxième personne du pluriel sans alourdir la phrase.
- source_word: אִישׁ עַל רֵעֵהוּ
  choice: chacun à son prochain
  rationale: « Chacun » rend la valeur distributive de אִישׁ, tandis que « à son prochain » exprime naturellement la personne à laquelle on parle dans ce contexte.
- source_word: וְאִישׁ אֶל אָחִיו
  choice: et chacun à son frère
  rationale: La formulation conserve le parallélisme hébreu ainsi que le terme de parenté אָחִיו.
- source_word: עָנָה
  choice: a répondu
  rationale: Le passé composé convient à la question portant sur la réponse donnée par Yahvé.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: דִּבֶּר
  choice: a dit
  rationale: Dans cette question, « dire » est l’équivalent français le plus naturel de דִּבֶּר et maintient le parallélisme avec « a répondu ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahvé » le représente directement en français sans le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle de l’hébreu est conservée, avec une ponctuation française naturelle.
