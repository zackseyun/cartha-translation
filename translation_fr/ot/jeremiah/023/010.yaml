source:
  edition: WLC
  text: כִּ֤י מְנָֽאֲפִים֙ מָלְאָ֣ה הָ/אָ֔רֶץ כִּֽי מִ/פְּנֵ֤י אָלָה֙ אָבְלָ֣ה הָ/אָ֔רֶץ יָבְשׁ֖וּ נְא֣וֹת מִדְבָּ֑ר וַ/תְּהִ֤י מְרֽוּצָתָ/ם֙ רָעָ֔ה וּ/גְבוּרָתָ֖/ם לֹא כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/010.yaml
  text: For the land is full of adulterers[a]; because of the curse the land mourns, and the pastures of the wilderness are dried up. Their course is evil[c][b], and their might is not right.
translation:
  language: fr
  text: Car le pays est rempli d’adultères. À cause de la malédiction[a], le pays est en deuil, et les pâturages du désert sont desséchés. Leur conduite[b] est mauvaise, et leur puissance n’est pas droite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause du serment » ou « du serment imprécatoire » ; le mot hébreu peut désigner un serment qui appelle une malédiction, ou la malédiction elle-même.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leur course » ; le terme évoque ici le cours de leur conduite.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « leur puissance n’est pas ainsi » ; l’expression hébraïque est concise et elliptique. On peut aussi comprendre « leur puissance n’est pas juste » ou « n’est pas droite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנָאֲפִים
  choice: adultères
  rationale: Le participe pluriel désigne des personnes qui commettent l’adultère. « Adultères » conserve directement l’accusation morale et laisse au contexte prophétique ses possibles résonances d’infidélité envers l’alliance.
- source_word: מָלְאָה הָאָרֶץ
  choice: le pays est rempli
  rationale: Dans le contexte de Jérémie, אֶרֶץ désigne naturellement le pays, notamment Juda, plutôt que la terre entière.
- source_word: מִפְּנֵי אָלָה
  choice: à cause de la malédiction
  rationale: אָלָה peut désigner un serment imprécatoire ou la malédiction qu’il entraîne. Le deuil du pays et l’assèchement des pâturages favorisent ici « malédiction », sans supprimer l’autre possibilité.
- source_word: אָבְלָה
  choice: est en deuil
  rationale: Cette expression française actuelle préserve la personnification du pays contenue dans le verbe « mener deuil ».
- source_word: יָבְשׁוּ
  choice: se dessèchent
  rationale: Le présent décrit clairement l’état de sécheresse évoqué dans ce tableau prophétique.
- source_word: נְאוֹת מִדְבָּר
  choice: les pâturages du désert
  rationale: נְאוֹת désigne des lieux de pâture; מִדְבָּר est ici rendu par « désert », terme naturel en français pour une région inculte et peu habitée.
- source_word: מְרוּצָתָם
  choice: leur conduite
  rationale: Le nom signifie littéralement leur course et décrit métaphoriquement leur manière d’agir. « Conduite » rend nettement ce sens dans un français naturel, tandis que l’image littérale est signalée en note.
- source_word: רָעָה
  choice: mauvaise
  rationale: L’adjectif porte ici un jugement moral sur leur conduite; « mauvaise » est direct et idiomatique.
- source_word: גְבוּרָתָם
  choice: leur force
  rationale: גְבוּרָה désigne la force ou la puissance. « Force » est clair et convient à la construction française.
- source_word: לֹא כֵן
  choice: ne sert pas le bien
  rationale: L’hébreu est elliptique, littéralement « n’est pas ainsi ». Dans ce parallélisme moral, cette formulation française exprime que leur force n’est pas employée comme elle devrait l’être, tout en signalant l’incertitude en note.
theological_decisions:
- issue: Sens littéral ou métaphorique de מְנָאֲפִים
  choice: adultères
  alternative: infidèles
  rationale: Le mot hébreu désigne directement ceux qui commettent l’adultère. Le rendre littéralement préserve l’accusation explicite sans exclure ses résonances d’infidélité à l’alliance.
- issue: Sens de אָלָה dans le contexte
  choice: la malédiction
  alternative: le serment ou le serment imprécatoire
  rationale: Le deuil du pays et la sécheresse orientent vers les conséquences d’une malédiction, mais le champ lexical du serment reste authentiquement possible et figure donc en note.
- issue: Interprétation de לֹא כֵן
  choice: leur force ne sert pas le bien
  alternative: leur force n’est pas droite / n’est pas ainsi
  rationale: La formule source est brève et elliptique. Le texte principal doit rester intelligible sans transformer cette imprécision en affirmation doctrinale; la note conserve les rendus plus formels.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme prophétique est conservé, avec une ponctuation lisible. Les notes maintiennent les ambiguïtés réelles de אָלָה, מְרוּצָתָם et לֹא כֵן.
