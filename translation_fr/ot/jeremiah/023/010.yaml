revisions:
- from: Car le pays est rempli d’adultères. À cause de la malédiction[a], le pays est en deuil, et les pâturages du désert se dessèchent. Leur conduite[b] est mauvaise, et leur force ne sert pas le bien[c].
  to: Car le pays est rempli d’adultères. À cause de la malédiction[a], le pays est en deuil, et les pâturages du désert sont desséchés. Leur conduite[b] est mauvaise, et leur puissance n’est pas droite[c].
  rationale: La révision élimine une explicitation interprétative dans la dernière proposition et conserve l’ellipse morale de l’hébreu par « n’est pas droite », avec les autres possibilités en note. Elle rend aussi le parfait décrivant les pâturages comme un état résultant (« sont desséchés »). Aucun autre changement de sens n’est requis.
