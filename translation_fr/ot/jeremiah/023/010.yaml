review_pass:
  verdict: revise
  source_fidelity: La dernière proposition du brouillon (« leur force ne sert pas le bien ») ajoute l’idée d’un emploi téléologique de la force, absente de l’hébreu elliptique וּגְבוּרָתָם לֹא־כֵן (« et leur puissance n’est pas droite/juste »). Le rendre par « leur puissance n’est pas droite » conserve mieux le jugement moral sans expliciter la manière dont cette puissance serait employée. « Sont desséchés » rend naturellement le parfait hébreu יָבְשׁוּ comme état résultant.
  naturalness: « Le pays est rempli d’adultères » est naturel en français moderne et garde le ton prophétique. « Leur conduite est mauvaise, et leur puissance n’est pas droite » est clair, soutenu sans archaïsme, et respecte le parallélisme concis du texte.
  terminology: « Pays », « adultères », « malédiction », « pâturages du désert », « conduite » et « puissance » sont appropriés. La note sur אָלָה maintient correctement l’alternative réelle du serment imprécatoire. La note finale doit présenter « n’est pas droite » comme rendu possible de l’ellipse, non comme le sens littéral exclusif.
