id: JER.23.11
reference: Jeremiah 23:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי גַם נָבִ֥יא גַם כֹּהֵ֖ן חָנֵ֑פוּ גַּם בְּ/בֵיתִ֛/י מָצָ֥אתִי רָעָתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/011.yaml
  text: For both prophet and priest are ungodly[a]; even in my house I have found their evil[b], declares Yahweh.
translation:
  language: fr
  text: Car le prophète comme le prêtre sont impies[a] ; même dans ma maison, j’ai trouvé leur méchanceté[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont profanes », « sont corrompus » ou « sont hypocrites ». Le verbe hébreu évoque une corruption morale et religieuse ou l’impiété.
    reason: lexical_alternative
  - marker: b
    text: L’expression « ma maison » désigne ici le temple.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le motif du jugement annoncé dans le contexte précédent ; « Car » en conserve naturellement la valeur explicative.
- source_word: גַם ... גַם
  choice: le prophète comme le prêtre
  rationale: La répétition de גַם associe les deux groupes dans une même accusation. Cette tournure française rend leur inclusion conjointe tout en conservant les singuliers collectifs de l’hébreu.
- source_word: נָבִיא
  choice: prophète
  rationale: Équivalent français courant et précis du terme hébreu.
- source_word: כֹּהֵן
  choice: prêtre
  rationale: Équivalent usuel, particulièrement approprié dans ce contexte lié au temple.
- source_word: חָנֵפוּ
  choice: sont impies
  rationale: Le verbe désigne ici une corruption morale et religieuse ou une conduite profane. « Sont impies » exprime clairement cet état sans le réduire à la seule hypocrisie.
- source_word: גַּם
  choice: même
  rationale: 'Le troisième גַם renchérit : leur mal se trouve jusque dans la maison de Yahweh. « Même » restitue cette force emphatique.'
- source_word: בְּבֵיתִי
  choice: dans ma maison
  rationale: La traduction conserve l’image hébraïque littérale ; dans la bouche de Yahweh, « ma maison » désigne le temple.
- source_word: מָצָאתִי
  choice: j’ai trouvé
  rationale: Le passé composé rend naturellement l’accompli hébreu et présente le constat comme pertinent au moment de la déclaration.
- source_word: רָעָתָם
  choice: leur méchanceté
  rationale: Le nom désigne ici leur mal moral ou leur conduite mauvaise. « Méchanceté » est idiomatique et garde la portée éthique du terme.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formulation française restitue la solennité de la formule prophétique tout en restant naturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- issue: Portée de חָנֵפוּ
  choice: sont impies
  alternative: se sont profanés ; sont corrompus ; sont hypocrites
  rationale: Le terme exprime une corruption morale et religieuse. Le rendre par « hypocrites » seulement réduirait indûment son champ sémantique, tandis que « impies » maintient la tension entre conduite mauvaise et infidélité envers Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme entre prophète et prêtre, ainsi que l’expression imagée « ma maison ». Le point-virgule marque le renchérissement de l’accusation.
