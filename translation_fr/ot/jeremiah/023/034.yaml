  text: וְ/הַ/נָּבִ֤יא וְ/הַ/כֹּהֵן֙ וְ/הָ/עָ֔ם אֲשֶׁ֥ר יֹאמַ֖ר מַשָּׂ֣א יְהוָ֑ה וּ/פָקַדְתִּ֛י עַל הָ/אִ֥ישׁ הַ/ה֖וּא וְ/עַל בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/034.yaml
  text: And as for the prophet[a], the priest, or the people who say, “The burden of Yahweh,” I will punish that man and his household.
translation:
  language: fr
  text: 'Quant au prophète, au prêtre ou au peuple qui dira : « Le fardeau de Yahweh[a] », je punirai cet homme ainsi que sa maisonnée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « L’oracle de Yahweh ». Le mot hébreu massa peut signifier « oracle », mais Jérémie semble ici exploiter son sens plus concret de « fardeau » dans le cadre de sa réprimande.
    reason: Alternative lexicale nécessaire pour préserver le double sens de מַשָּׂא.
lexical_decisions:
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Traduction usuelle de נָבִיא, avec maintien de l’article défini.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Traduction usuelle de כֹּהֵן, avec maintien de l’article défini.
- source_word: הָעָם אֲשֶׁר יֹאמַר
  choice: quelqu’un du peuple qui dira
  rationale: Le texte passe du collectif « le peuple » à un verbe singulier, puis à « cet homme ». Cette formulation française rend clairement la portée distributive sans changer le référent.
- source_word: מַשָּׂא יְהוָה
  choice: Le fardeau de Yahweh
  rationale: מַשָּׂא peut désigner un oracle, mais le contexte de Jérémie 23 exploite son sens concret de « charge, fardeau ». « Fardeau » conserve ce jeu polémique, tandis que la note signale l’autre sens.
- source_word: וּפָקַדְתִּי עַל
  choice: je punirai
  rationale: Dans ce contexte de jugement, פָּקַד עַל exprime une intervention punitive. « Je punirai » en donne directement le sens en français actuel.
- source_word: הָאִישׁ הַהוּא
  choice: cet homme
  rationale: Rend le masculin singulier du texte et désigne individuellement celui qui prononce la formule interdite.
- source_word: בֵּיתוֹ
  choice: sa famille
  rationale: בַּיִת désigne ici la maisonnée plutôt que le bâtiment. « Sa famille » est naturel et clair en français moderne.
theological_decisions:
- issue: Sens de מַשָּׂא יְהוָה dans la polémique de Jérémie
  choice: Le fardeau de Yahweh
  alternative: L’oracle de Yahweh
  rationale: Le mot peut être un terme technique pour un oracle prophétique, mais Jérémie 23:33-40 joue manifestement sur son sens de « fardeau ». La traduction principale préserve cette tension rhétorique plutôt que de la résoudre silencieusement.
- issue: Transcription du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription « Yahweh » représente le nom propre divin dans le texte source et suit la politique du projet relative à ce terme contesté.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « quelqu’un du peuple » explicite naturellement le passage du collectif hébreu à l’individu visé, et « sa famille » rend le sens social de « sa maison ».
