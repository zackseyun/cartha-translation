  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִ֥י עַל הַ/נְּבִיאִ֖ם נְאֻם יְהוָ֑ה הַ/לֹּקְחִ֣ים לְשׁוֹנָ֔/ם וַֽ/יִּנְאֲמ֖וּ נְאֻֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/031.yaml
  text: Behold[a], I am against the prophets, declares Yahweh, who take their own tongues and declare, ‘Declaration!’
translation:
  language: fr
  text: 'Voici, je suis contre les prophètes — déclaration de Yahweh —, qui prennent leur langue et proclament : « Déclaration ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui se servent de leur langue et disent : “Oracle !” » L’hébreu est concis et probablement ironique : ces prophètes donnent à leurs propres paroles l’apparence d’un oracle divin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Me voici
  rationale: Formule française naturelle et solennelle qui conserve l’emphase de la présentation divine.
- source_word: עַל
  choice: contre
  rationale: Dans la formule de jugement, la préposition exprime l’opposition de Yahweh.
- source_word: הַנְּבִיאִם
  choice: les prophètes
  rationale: Rend le terme hébreu sans ajouter ici l’étiquette interprétative « faux ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Conserve la formule prophétique d’autorité et permet de faire entendre la reprise ironique de la même racine à la fin du verset.
- source_word: הַלֹּקְחִים לְשׁוֹנָם
  choice: ceux qui prennent leur propre langue
  rationale: Reproduit l’image concrète et étrange de l’hébreu; « propre » explicite en français l’idée qu’ils tirent leur parole d’eux-mêmes.
- source_word: וַיִּנְאֲמוּ נְאֻם
  choice: 'et proclament : « Déclaration ! »'
  rationale: Préserve autant que possible la construction brève et probablement ironique fondée sur la répétition de la racine נ־א־ם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » maintient le nom propre plutôt qu’un titre de substitution.
- issue: Identification des prophètes dénoncés
  choice: les prophètes
  alternative: les faux prophètes
  rationale: Le contexte les présente comme mensongers, mais ce verset dit simplement « les prophètes »; le texte principal n’ajoute donc pas de qualification.
- issue: Sens de la formule finale נְאֻם
  choice: « Déclaration ! »
  alternative: « Déclaration de Yahweh ! »
  rationale: Le mot final est isolé dans le texte massorétique. Le traduire sans complément préserve sa concision inhabituelle et son ambiguïté, tandis que l’autre lecture rend plus explicite la prétention à parler au nom de Dieu.
translation_notes:
  register: Français international moderne, digne et prophétique. « Me voici contre » garde la force de la formule de jugement. La tournure volontairement insolite « prennent leur propre langue » reflète l’image hébraïque; la note fournit une formulation plus idiomatique.
