    issue: Ajout de « propre »
    rationale: Le texte hébreu dit littéralement « leur langue » (לשונם). Dans ce contexte, le possessif peut suggérer un discours issu d’eux-mêmes, mais « propre » explicite cette inférence dans le texte principal.
  - severity: low
    issue: Formulation de la note
    rationale: '« Déclaration divine autorisée » est moins précis : l’ironie porte sur une prétention à l’autorité divine, non sur une déclaration réellement autorisée.'
