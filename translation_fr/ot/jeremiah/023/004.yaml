source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֧י עֲלֵי/הֶ֛ם רֹעִ֖ים וְ/רָע֑וּ/ם וְ/לֹא יִֽירְא֨וּ ע֧וֹד וְ/לֹא יֵחַ֛תּוּ וְ/לֹ֥א יִפָּקֵ֖דוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/004.yaml
  text: And I will raise up over them shepherds who will shepherd them[a], and they will no longer fear, nor be dismayed, nor will any be missing, declares Yahweh.
translation:
  language: fr
  text: Je placerai à leur tête des bergers qui les feront paître. Ils n’auront plus peur, ne seront pas terrifiés, et aucun ne manquera[a], déclare Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun ne sera porté manquant » ; le sens peut aussi être compris comme « ils ne manqueront de rien ». L’hébreu évoque probablement le fait qu’aucun membre du troupeau ne sera absent ou introuvable.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Je placerai
  rationale: Dans ce contexte de direction du peuple, le hifil de קום exprime l’action divine d’établir des responsables. « Je placerai » est naturel en français et conserve cette initiative sans préciser indûment le mode de nomination.
- source_word: עֲלֵיהֶם
  choice: à leur tête
  rationale: Avec des responsables, עַל marque ici l’autorité exercée sur le peuple. « À leur tête » rend ce rapport de manière idiomatique en français moderne.
- source_word: רֹעִים
  choice: des bergers
  rationale: Le terme désigne littéralement des bergers et prolonge l’image pastorale du contexte. « Dirigeants » atténuerait cette image, tandis que « pasteurs » risquerait d’introduire une association ecclésiale postérieure.
- source_word: וְרָעוּם
  choice: qui les feront paître
  rationale: Cette formulation française conserve le lien lexical avec les bergers et l’image du troupeau, tout en exprimant leur charge de nourrir et de conduire le peuple.
- source_word: וְלֹא יִירְאוּ עוֹד
  choice: Ils n’auront plus peur
  rationale: La formulation rend directement la crainte exprimée par ירא ainsi que la valeur temporelle de עוֹד.
- source_word: וְלֹא יֵחַתּוּ
  choice: ne seront plus terrifiés
  rationale: Le nifal de חתת peut évoquer l’effondrement sous l’effet de l’épouvante ou la terreur. « Terrifiés » convient au contexte de sécurité retrouvée et reste distinct de la simple peur.
- source_word: וְלֹא יִפָּקֵדוּ
  choice: aucun ne manquera
  rationale: Le nifal de פקד signifie probablement ici qu’aucun membre du troupeau ne sera absent ou porté manquant. La tournure distributive « aucun » explicite naturellement ce sens en français sans introduire la notion théologique plus chargée d’être « perdu ».
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: נְאֻם est la formule prophétique solennelle habituelle. « Déclare » en restitue la force, et « Yahvé » représente en français le nom divin יהוה plutôt qu’un titre de substitution.
theological_decisions:
- issue: Maintien de l’image des bergers
  choice: Conserver « bergers » et l’action de « faire paître »
  alternative: Traduire par « dirigeants » qui « prendront soin » du peuple
  rationale: L’image pastorale structure le contexte immédiat et met en contraste les mauvais bergers avec ceux que Dieu établira. La conserver évite d’aplatir la portée prophétique.
- issue: Portée de וְלֹא יִפָּקֵדוּ
  choice: « aucun ne manquera »
  alternative: « ils ne manqueront de rien » ou « aucun ne sera perdu »
  rationale: Le sens le plus probable est qu’aucun membre du troupeau ne sera absent ou non retrouvé. « Aucun ne manquera » préserve cette idée concrète sans transformer la proposition en promesse de prospérité ni importer une notion ultérieure de perdition spirituelle.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore pastorale est conservée, avec une syntaxe fluide. « Yahvé » rend explicitement le tétragramme.
