  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֣ר הֶעֱלָה֩ וַ/אֲשֶׁ֨ר הֵבִ֜יא אֶת זֶ֨רַע בֵּ֤ית יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹנָ/ה וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדַּחְתִּ֖י/ם שָׁ֑ם וְ/יָשְׁב֖וּ עַל אַדְמָתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/008.yaml
  text: but[a], ‘As Yahweh lives[d][c][b], who brought up and who brought in the offspring of the house of Israel from the land of the north and from all the lands where I had driven them,’ and they shall dwell on their own soil.
translation:
  language: fr
  text: 'mais : « Yahweh est vivant, lui qui a fait monter et a fait entrer les descendants de la maison d’Israël du pays du Nord et de tous les pays où je les avais chassés. » Et ils habiteront sur leur propre sol.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: mais
  rationale: À la suite du verset 7, l’expression introduit le remplacement de l’ancienne formule de serment; « mais » assure naturellement la continuité syntaxique en français.
- source_word: חַי יְהוָה
  choice: Yahweh est vivant
  rationale: Formule hébraïque solennelle de serment, rendue de manière naturelle tout en conservant le nom divin.
- source_word: הֶעֱלָה וַאֲשֶׁר הֵבִיא
  choice: a fait monter et revenir
  rationale: « Faire monter » maintient l’écho de l’exode; dans ce contexte, « faire revenir » exprime idiomatiquement l’entrée des exilés dans leur patrie, sans effacer la distinction entre les deux verbes.
- source_word: זֶרַע בֵּית יִשְׂרָאֵל
  choice: les descendants de la maison d’Israël
  rationale: Le nom collectif זֶרַע désigne ici la postérité; « descendants » est clair et actuel, tandis que « maison d’Israël » conserve la désignation nationale et historique.
- source_word: מֵאֶרֶץ צָפוֹנָה
  choice: du pays du Nord
  rationale: Cette formulation française naturelle conserve le motif géographique et théologique du Nord dans Jérémie.
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: où je les avais chassés
  rationale: Le plus-que-parfait situe la dispersion avant le rassemblement annoncé; « chassés » conserve la force causative du verbe.
- source_word: וְיָשְׁבוּ עַל אַדְמָתָם
  choice: Et ils habiteront sur leur propre sol
  rationale: « Habiteront » convient au rétablissement durable, et « sol » préserve la nuance concrète de אֲדָמָה ainsi que la préposition « sur ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; la translittération préserve le nom personnel sans lui substituer un titre.
- issue: Restauration conçue comme délivrance et retour
  choice: distinguer « a fait monter » et « revenir »
  alternative: réunir les deux verbes sous « a ramené »
  rationale: La distinction conserve l’écho de l’exode et le mouvement complémentaire de réintégration dans la patrie, sans développer le texte en paraphrase.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste étroitement liée à la syntaxe hébraïque tout en évitant des tournures artificielles. Aucune note n’est nécessaire dans ce verset; par conséquent, aucun marqueur n’apparaît dans le texte.
