  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וַ/הֲקִמֹתִ֥י לְ/דָוִ֖ד צֶ֣מַח צַדִּ֑יק וּ/מָ֤לַךְ מֶ֨לֶךְ֙ וְ/הִשְׂכִּ֔יל וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/005.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will raise up for David a righteous Branch, and he will reign as king and act wisely[b], and he will do justice and righteousness in the land.
translation:
  language: fr
  text: Voici que des jours viennent — déclaration de Yahweh — où je susciterai pour David un Germe juste[a]. Il régnera en roi, agira avec sagesse[b] et exercera le droit et la justice dans le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une Pousse juste » ou « un Rameau juste ». L’image hébraïque désigne une nouvelle pousse issue de la lignée de David.
    reason: lexical_alternative
  - marker: b
    text: Ou « conduira ses affaires avec discernement », « réussira » ou « prospérera ». Le verbe hébreu peut désigner à la fois une action avisée et la réussite qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה יָמִים בָּאִים
  choice: Voici que des jours viennent
  rationale: Cette tournure conserve la force solennelle de l’annonce prophétique et l’aspect imminent de la formule hébraïque, tout en restant naturelle en français actuel.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: « Déclaration de » rend la formule prophétique נְאֻם comme une parole officielle et souveraine; « Yahweh » représente directement le nom divin.
- source_word: וַהֲקִמֹתִי לְדָוִד
  choice: je susciterai pour David
  rationale: Le hiphil de קום désigne ici l’action de faire surgir un descendant royal. « Pour David » préserve la préposition sans développer explicitement « dans la lignée de David ».
- source_word: צֶמַח צַדִּיק
  choice: un Germe juste
  rationale: « Germe » conserve l’image végétale d’une nouvelle pousse issue de la dynastie davidique ainsi que ses échos prophétiques. La majuscule signale son emploi comme désignation royale dans ce contexte, sans ajouter le titre « Messie ».
- source_word: וּמָלַךְ מֶלֶךְ
  choice: Il régnera en roi
  rationale: Cette formulation garde l’insistance produite en hébreu par le verbe et le nom de même racine, tout en demeurant idiomatique en français.
- source_word: וְהִשְׂכִּיל
  choice: agira avec sagesse
  rationale: Le verbe peut évoquer à la fois une conduite avisée et la réussite qui en découle. Le contexte du gouvernement royal favorise ici la sagesse pratique, tandis qu’une note conserve l’autre nuance.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: exercera le droit et la justice
  rationale: Dans le contexte de la royauté, la formule décrit l’exercice concret d’un gouvernement conforme au droit et à la justice. « Exercera » est plus naturel en français que le calque « fera ».
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans cette promesse concernant le règne davidique, אֶרֶץ désigne vraisemblablement le territoire concerné par ce gouvernement. « Dans le pays » conserve ce sens sans élargir automatiquement à toute la terre.
theological_decisions:
- issue: Portée messianique du « Germe » davidique
  choice: Conserver l’image dynastique et sa possible valeur de titre sans identifier explicitement le personnage comme « le Messie » dans le corps du texte.
  alternative: Traduire par une simple « pousse » sans majuscule, ou expliciter « le Messie ».
  rationale: Le texte présente un roi futur issu de David au moyen d’une image prophétique fortement chargée, mais il ne lui donne pas explicitement le titre de Messie. La traduction maintient donc cette tension et les échos intertextuels sans imposer une identification confessionnelle dans le verset.
- issue: Sens de וְהִשְׂכִּיל
  choice: Mettre au premier plan la conduite sage tout en signalant en note la nuance possible de réussite.
  alternative: Traduire directement « réussira » ou « prospérera ».
  rationale: Le verbe associe souvent discernement pratique et succès. La proximité du droit et de la justice fait de la conduite avisée la nuance contextuelle la plus immédiate, sans exclure le résultat favorable.
- issue: Étendue de בָּאָרֶץ
  choice: Traduire « dans le pays ».
  alternative: Traduire « sur la terre ».
  rationale: Le contexte de la restauration de la royauté davidique favorise une référence au pays, mais l’hébreu peut aussi porter un sens plus large. La traduction évite d’universaliser silencieusement la portée géographique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la solennité de l’oracle grâce à « Voici que » et à l’incise « déclaration de Yahweh », sans recourir à des formes archaïques. Le parallélisme royal et juridique de l’hébreu demeure perceptible.
