id: JER.23.21
reference: Jeremiah 23:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא שָׁלַ֥חְתִּי אֶת הַ/נְּבִאִ֖ים וְ/הֵ֣ם רָ֑צוּ לֹא דִבַּ֥רְתִּי אֲלֵי/הֶ֖ם וְ/הֵ֥ם נִבָּֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/021.yaml
  text: I did not send the prophets[a], yet they ran; I did not speak to them, yet they prophesied.
translation:
  language: fr
  text: Je n’ai pas envoyé les prophètes, et pourtant ils ont couru[a] ; je ne leur ai pas parlé, et pourtant ils ont prophétisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais ils ont couru ». La conjonction hébraïque peut aussi être rendue simplement par « et » ; dans ce contexte, elle marque un fort contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַחְתִּי
  choice: envoyé
  rationale: Le verbe signifie couramment « envoyer » et, dans ce contexte prophétique, évoque une mission reçue de Dieu sans expliciter davantage la notion de mandat.
- source_word: הַנְּבִאִים
  choice: les prophètes
  rationale: L’article défini est rendu directement ; le contexte identifie les prophètes mis en cause.
- source_word: רָצוּ
  choice: ont couru
  rationale: La traduction conserve l’image vive du verbe hébreu « courir », qui décrit ici leur empressement à agir sans mission divine.
- source_word: דִבַּרְתִּי אֲלֵיהֶם
  choice: je ne leur ai pas parlé
  rationale: Cette formulation française rend naturellement l’idée de Dieu qui adresse sa parole directement à ces prophètes.
- source_word: נִבָּאוּ
  choice: ont prophétisé
  rationale: C’est l’équivalent direct et usuel du verbe hébreu désignant l’activité prophétique.
- source_word: וְהֵם
  choice: et pourtant ils
  rationale: La conjonction hébraïque peut simplement signifier « et », mais le parallélisme et la négation créent ici un contraste net, rendu naturellement par « et pourtant ».
- source_word: לֹא
  choice: ne… pas
  rationale: La négation française avec le passé composé exprime clairement l’absence antérieure d’envoi et de parole divine.
theological_decisions:
- issue: Nature de l’activité des faux prophètes
  choice: Le verset affirme que ces prophètes ont agi sans avoir été envoyés par Dieu ni avoir reçu sa parole.
  alternative: On pourrait comprendre la première proposition comme une critique de leur empressement plutôt que comme la négation de tout mandat.
  rationale: Les deux affirmations parallèles, « je n’ai pas envoyé » et « je ne leur ai pas parlé », indiquent fortement l’absence d’autorisation et de révélation divines, sans étendre cette accusation au-delà du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient au discours direct contemporain. L’expression littérale « ont couru » préserve l’image hébraïque, tandis que la note signale l’ambiguïté de la conjonction.
