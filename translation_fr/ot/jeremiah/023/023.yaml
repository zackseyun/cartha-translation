  text: הַ/אֱלֹהֵ֧י מִ/קָּרֹ֛ב אָ֖נִי נְאֻם יְהוָ֑ה וְ/לֹ֥א אֱלֹהֵ֖י מֵ/רָחֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/023.yaml
  text: Am I a God who is near[a], declares Yahweh, and not a God who is far away?
translation:
  language: fr
  text: « Suis-je un Dieu proche[a], déclare Yahweh, et non un Dieu lointain ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens rhétorique : « Suis-je seulement un Dieu proche… et non aussi un Dieu lointain ? » La question nie que Yahweh soit limité à ce qui est proche.'
    reason: Alternative lexicale et explicitation de la portée rhétorique.
lexical_decisions:
- source_word: הַ/אֱלֹהֵי
  choice: Suis-je un Dieu
  rationale: Le ה préfixé a ici une valeur interrogative. La proposition hébraïque est sans verbe exprimé ; le français exige l’ajout naturel de la copule « suis ».
- source_word: מִ/קָּרֹב
  choice: de près
  rationale: Cette expression, mise en parallèle avec מֵ/רָחֹק, établit un contraste entre proximité et éloignement. « De près » conserve la formulation spatiale et l’ambiguïté concise de l’hébreu.
- source_word: אָ֖נִי
  choice: je
  rationale: Le pronom de première personne est explicitement conservé dans « Suis-je ».
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formulation rend avec naturel et solennité la formule prophétique נְאֻם, tandis que le nom divin est transcrit « Yahweh ».
- source_word: וְ/לֹא
  choice: et non
  rationale: Ce choix traduit directement la coordination négative sans ajouter « seulement » ou « aussi » dans le texte principal.
- source_word: אֱלֹהֵי מֵ/רָחֹק
  choice: un Dieu de loin
  rationale: La formulation fait écho à « un Dieu de près » et préserve le contraste spatial ainsi que la concision de l’original.
theological_decisions:
- issue: Portée de la question rhétorique sur la proximité et l’éloignement de Dieu
  choice: Suis-je un Dieu de près… et non un Dieu de loin ?
  alternative: Suis-je seulement un Dieu proche… et ne suis-je pas aussi un Dieu lointain ?
  rationale: 'Le texte principal conserve la structure et la tension de l’hébreu sans expliciter silencieusement « seulement » et « aussi ». La note indique la portée rhétorique probable : Yahweh n’est pas limité à ce qui est proche.'
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription « Yahweh » représente le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et concis. Le parallélisme « de près / de loin » garde la force poétique et l’ambiguïté de la formulation hébraïque ; la lecture plus explicite est réservée à la note.
