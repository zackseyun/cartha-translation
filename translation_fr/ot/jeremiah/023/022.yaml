  text: וְ/אִֽם עָמְד֖וּ בְּ/סוֹדִ֑/י וְ/יַשְׁמִ֤עוּ דְבָרַ/י֙ אֶת עַמִּ֔/י וִֽ/ישִׁבוּ/ם֙ מִ/דַּרְכָּ֣/ם הָ/רָ֔ע וּ/מֵ/רֹ֖עַ מַֽעַלְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/022.yaml
  text: But if they had stood in my council[a], then they would have caused my people to hear my words, and they would have turned them from their evil way and from the evil of their deeds.
translation:
  language: fr
  text: Mais s’ils s’étaient tenus dans mon conseil[a], ils auraient fait entendre mes paroles à mon peuple et les auraient détournés de leur mauvaise conduite et du mal de leurs actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans mon conseil secret » ou « dans mon cercle intime ». Le terme hébreu סוֹד peut désigner un conseil confidentiel, un cercle intime ou un conseil.
    reason: 'Alternative lexicale : le terme peut évoquer l’assemblée délibérative, la confidentialité ou l’intimité, sans imposer une interprétation unique.'
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’ils
  rationale: « Mais » exprime naturellement le contraste avec la dénonciation précédente des faux prophètes.
- source_word: עָמְדוּ
  choice: s’étaient tenus
  rationale: Le plus-que-parfait convient à la condition irréelle suggérée par le contexte et conserve l’idée de se tenir dans la présence ou l’assemblée divine.
- source_word: בְּסוֹדִי
  choice: dans mon conseil
  rationale: סוֹד peut désigner le cercle confidentiel ou le conseil où l’on délibère. « Conseil » préserve ici l’image de l’assemblée divine sans réduire le terme à un simple avis.
- source_word: וְיַשְׁמִעוּ דְבָרַי אֶת־עַמִּי
  choice: ils auraient fait entendre mes paroles à mon peuple
  rationale: La tournure causative « faire entendre » rend le hiphil de שׁמע, tandis que « mes paroles » conserve le pluriel hébreu.
- source_word: וִישִׁבוּם
  choice: l’auraient détourné
  rationale: Le hiphil de שוב est causatif. Avec le complément introduit par « de », « détourner » exprime naturellement le fait d’amener le peuple à abandonner sa conduite mauvaise.
- source_word: מִדַּרְכָּם הָרָע
  choice: de sa mauvaise conduite
  rationale: Le singulier collectif « mon peuple » appelle naturellement « sa ». « Conduite » transmet en français actuel la métaphore hébraïque de la voie comme manière de vivre.
- source_word: וּמֵרֹעַ מַעַלְלֵיהֶם
  choice: et du mal qu’il commet
  rationale: Cette formulation conserve l’abstraction « mal » et la référence aux actes, tout en évitant le tour peu naturel « du mal de ses actions ».
theological_decisions:
- issue: Nature du סוֹד divin
  choice: « mon conseil »
  alternative: « mon conseil secret » ou « mes desseins »
  rationale: « Conseil » maintient l’image probable de l’assemblée délibérative divine et l’accès prophétique à la présence de Dieu, sans imposer une interprétation plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé, avec une légère explicitation idiomatique dans « mauvaise conduite » et « du mal qu’il commet ».
