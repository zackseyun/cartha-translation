source:
  edition: WLC
  text: לָ/כֵ֣ן הִנְ/נִ֔י וְ/נָשִׁ֥יתִי אֶתְ/כֶ֖ם נָשֹׁ֑א וְ/נָטַשְׁתִּ֣י אֶתְ/כֶ֗ם וְ/אֶת הָ/עִיר֙ אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם וְ/לַ/אֲבוֹתֵי/כֶ֖ם מֵ/עַ֥ל פָּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/039.yaml
  text: Therefore[a], behold, I will surely lift you up and cast you away, you and the city that I gave to you and to your fathers[b], from before my face.
translation:
  language: fr
  text: 'C’est pourquoi, me voici : je vais bel et bien vous emporter et rejeter loin de ma présence[a], vous et la ville que je vous ai donnée, à vous et à vos ancêtres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant ma face ». Le premier verbe hébreu est difficile et peut aussi être compris comme : « je vais complètement vous oublier ». On peut également le rendre : « je vais bel et bien vous emporter ».'
    reason: Conserve la formulation littérale relative à la présence divine et signale, sans trancher au-delà du texte, l’alternative ancienne et la possibilité contextuelle de « emporter » pour le verbe ambigu.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de la dénonciation précédente.
- source_word: הִנְנִי
  choice: me voici
  rationale: Conserve la force déictique et solennelle de la formule prophétique dans un français actuel et digne.
- source_word: וְנָשִׁיתִי אֶתְכֶם נָשֹׂא
  choice: je vais bel et bien vous soulever
  rationale: Suit le texte massorétique vocalisé, maintient l’image de soulever/emporter et rend l’intensification de l’infinitif absolu par « bel et bien ». Le contexte indique une action punitive, précisée par le rejet qui suit.
- source_word: וְנָטַשְׁתִּי אֶתְכֶם
  choice: et vous rejeter
  rationale: Dans ce contexte judiciaire, « rejeter » exprime l’abandon et l’éloignement impliqués par le verbe, sans adoucir la menace.
- source_word: הָעִיר
  choice: la ville
  rationale: Conserve la désignation non explicite du texte hébreu, qui renvoie contextuellement à Jérusalem.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: que j’ai donnée à vous et à vos ancêtres
  rationale: Préserve la distinction explicite entre les destinataires présents et leurs ancêtres, ainsi que la perspective historique du don.
- source_word: מֵעַל פָּנָי
  choice: loin de moi
  rationale: Rend idiomatiquement l’expulsion hors de la présence divine. Le sens plus formel « de devant ma face » est indiqué en note.
theological_decisions:
- issue: Ambiguïté textuelle et lexicale de וְנָשִׁיתִי ... נָשֹׂא
  choice: je vais bel et bien vous soulever
  alternative: je vais vous oublier complètement ; je vais bel et bien vous emporter
  rationale: Le choix principal suit la vocalisation massorétique et laisse entendre le jeu de mots avec מַשָּׂא dans le contexte, sans transformer « soulever » en exaltation positive puisque « rejeter » en précise immédiatement la portée punitive. L’autre compréhension ancienne et largement attestée, « oublier », est conservée en note.
- issue: Image de la présence divine dans מֵעַל פָּנָי
  choice: loin de moi
  alternative: de devant ma face ; hors de ma présence
  rationale: Le texte principal privilégie un français naturel tout en conservant l’idée de bannissement de la présence de Dieu; la formulation anthropomorphique littérale reste accessible dans la note.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « Me voici » conserve le ton prophétique; « bel et bien » rend l’emphase hébraïque de façon compréhensible. La syntaxe maintient l’ironie de « soulever » suivi de « rejeter », tandis que la note expose les principales lectures concurrentes.
