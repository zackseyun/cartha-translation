  - severity: low
    issue: « que j’ai donnée à vous »
    rationale: La tournure est grammaticalement possible mais peu idiomatique en français international moderne; le pronom datif antéposé est préférable.
  - severity: low
    issue: Portée de « vous ainsi que la ville »
    rationale: La coordination explicite des objets de « rejeter » rend plus nette la structure hébraïque, où les destinataires et la ville sont tous deux concernés par l’expulsion.
