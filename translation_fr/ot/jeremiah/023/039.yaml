  naturalness: « Que j’ai donnée à vous et à vos ancêtres » est sensiblement moins naturel que « que je vous ai donnée, à vous et à vos ancêtres ». Une syntaxe qui coordonne explicitement « vous et la ville » comme objets du rejet évite aussi que l’ajout final soit lu comme une simple apposition aux destinataires.
  terminology: « Me voici » convient au registre prophétique. « Loin de ma présence » est moderne et fidèle à l’idée de bannissement; la note conserve utilement le littéral « de devant ma face ». La note doit distinguer l’alternative « oublier » de la lecture principale sans présenter indûment l’ambiguïté comme une certitude textuelle.
