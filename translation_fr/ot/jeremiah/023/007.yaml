id: JER.23.7
reference: Jeremiah 23:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹא יֹ֤אמְרוּ עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/007.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when they will no longer say, ‘As Yahweh lives, who brought up the sons of Israel from the land of Egypt,’
translation:
  language: fr
  text: 'C’est pourquoi, voici que des jours viennent — déclaration de Yahweh — où l’on ne dira plus : « Aussi vrai que Yahweh est vivant, lui qui a fait monter les fils d’Israël[a] du pays d’Égypte… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « les Israélites ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque l’inférence tirée du contexte précédent dans un français actuel et soutenu.
- source_word: הִנֵּה יָמִים בָּאִים
  choice: voici que des jours viennent
  rationale: Conserve à la fois la force déictique de הִנֵּה et l’expression prophétique annonçant un temps futur.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend distinctement la formule prophétique solennelle נְאֻם sans la réduire à un simple verbe de parole.
- source_word: וְלֹא יֹאמְרוּ עוֹד
  choice: où l’on ne dira plus
  rationale: Le pronom indéfini « on » rend naturellement en français le sujet pluriel non précisé, tandis que « ne… plus » exprime la cessation indiquée par עוֹד.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Formulation française intelligible qui restitue la valeur de serment solennel de cette expression figée.
- source_word: אֲשֶׁר הֶעֱלָה
  choice: lui qui a fait monter
  rationale: Préserve le sens causatif du hifil de עלה ainsi que l’image de la montée depuis l’Égypte, sans remplacer silencieusement le verbe par « faire sortir ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rendu formel qui conserve l’expression hébraïque et son lien avec le nom ancestral Israël; l’équivalent collectif idiomatique est signalé en note.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Conserve la mention explicite du « pays », importante dans l’évocation historique de l’Exode.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin personnel; « Yahweh » le translittère au lieu de lui substituer un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: Le texte principal garde la forme masculine et la transparence généalogique de l’hébreu, sans nier que l’expression désigne collectivement le peuple; la formulation idiomatique est donnée en note.
- issue: Valeur de חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  alternative: Yahweh est vivant; Par la vie de Yahweh
  rationale: Le choix explicite la force juratoire de la formule tout en maintenant l’affirmation que Yahweh est vivant.
translation_notes:
  register: Français international moderne, digne et prophétique. « Voici que » et « déclaration de Yahweh » maintiennent la solennité sans archaïsme excessif. Les points de suspension indiquent que la formule citée se poursuit au verset suivant.
