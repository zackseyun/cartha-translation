source:
  edition: WLC
  text: כִּ֣י מִ֤י עָמַד֙ בְּ/ס֣וֹד יְהוָ֔ה וְ/יֵ֖רֶא וְ/יִשְׁמַ֣ע אֶת דְּבָר֑/וֹ מִֽי הִקְשִׁ֥יב דבר/י וַ/יִּשְׁמָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/018.yaml
  text: For who has stood in the council of Yahweh[a], that he should see and hear his word? Who has paid attention to my word and heard it?
translation:
  language: fr
  text: Car qui s’est tenu dans le conseil de Yahvé[a] pour voir et entendre sa parole ? Qui a prêté attention à ma parole et l’a entendue ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le secret de Yahvé » ou « dans le conseil intime de Yahvé ». Le mot hébreu peut désigner aussi bien un conseil ou une assemblée qu’un échange confidentiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification rhétorique de l’accusation précédente et conserve naturellement le lien argumentatif.
- source_word: עָמַד
  choice: s’est tenu
  rationale: Le passé composé exprime en français actuel une participation accomplie dont la pertinence demeure dans la question rhétorique.
- source_word: בְּסוֹד
  choice: dans le conseil
  rationale: Dans cette polémique prophétique, סוֹד évoque probablement le conseil délibératif divin, tout en pouvant aussi désigner une confidence ou un cercle intime; cette ambiguïté est signalée en note.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui le distingue du titre « le Seigneur ».
- source_word: וְיֵרֶא וְיִשְׁמַע
  choice: pour voir et entendre
  rationale: Le français exprime naturellement comme finalité ou conséquence l’accès perceptif qui découle du fait de se tenir dans le conseil, sans rompre le parallélisme des deux verbes.
- source_word: דְּבָרוֹ
  choice: sa parole
  rationale: « Parole » conserve la portée prophétique et révélatrice de דָּבָר sans la réduire à une simple information.
- source_word: הִקְשִׁיב
  choice: a prêté attention à
  rationale: Rend la valeur intensive et attentive du hiphil plus nettement qu’un simple « écouter ».
- source_word: דְבָרִי
  choice: ma parole
  rationale: Préserve le passage soudain à la première personne divine et la cohérence lexicale avec « sa parole ».
- source_word: וַיִּשְׁמָע
  choice: et l’a entendue
  rationale: Prolonge le motif de l’écoute; le pronom reprend explicitement « ma parole » sans imposer le sens plus interprétatif d’« obéir ».
theological_decisions:
- issue: Sens de סוֹד יְהוָה
  choice: le conseil de Yahvé
  alternative: le secret de Yahvé / le cercle intime de Yahvé / les confidences de Yahvé
  rationale: Le contexte des vrais et faux prophètes favorise l’image du conseil divin auquel le véritable prophète a accès. Comme le terme peut également désigner un secret, une confidence ou un cercle de proches, la note conserve ces possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux questions rhétoriques est conservée, ainsi que le passage de « sa parole » à « ma parole » présent dans le texte hébreu.
