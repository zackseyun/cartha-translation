source:
  edition: WLC
  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה וְ/סַ֖עַר מִתְחוֹלֵ֑ל עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/019.yaml
  text: Look[a], the storm of Yahweh has gone out in wrath, a whirling tempest[c][b]; it will whirl down on the head of the wicked.
translation:
  language: fr
  text: 'Voici : la tempête de Yahweh est sortie avec fureur[a], un ouragan tourbillonnant ; elle tournoiera sur la tête des méchants[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un accompli : le jugement à venir est présenté comme déjà mis en mouvement, ce qui souligne sa certitude.'
    reason: aspect_verbal
  - marker: b
    text: 'Ou : « elle s’abattra sur la tête des méchants ». Le verbe peut évoquer à la fois le tournoiement de la tempête et la violence de son impact.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » conserve la force déictique et l’immédiateté solennelle de l’annonce, tout en restant courant en français biblique moderne.
- source_word: סַעֲרַת יְהוָה
  choice: la tempête de Yahweh
  rationale: סַעֲרָה désigne une tempête violente. Le complément construit indique qu’elle vient de Yahweh ou lui appartient, sans qu’il soit nécessaire de trancher entre ces nuances.
- source_word: חֵמָה יָצְאָה
  choice: Elle s’est déchaînée avec fureur
  rationale: Cette formulation française naturelle rattache la fureur à la sortie de la tempête et rend la violence de חֵמָה, tout en conservant l’accompli hébreu.
- source_word: וְסַעַר מִתְחוֹלֵל
  choice: ouragan tourbillonnant
  rationale: La proposition précise et intensifie l’image de la tempête. « Tourbillonnant » exprime le mouvement violent du participe hitpolel מִתְחוֹלֵל.
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: sur la tête des méchants
  rationale: Le singulier collectif « la tête » est conservé, de même que le pluriel substantivé רְשָׁעִים, rendu naturellement par « les méchants ».
- source_word: יָחוּל
  choice: elle tournoiera
  rationale: Le verbe reprend probablement l’idée de mouvement circulaire violent exprimée par מִתְחוֹלֵל. « Tournoiera » maintient ce lien lexical, sans exclure l’idée d’un impact.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve la référence au nom propre divin sans la remplacer par un titre.
- issue: Valeur de l’accompli יָצְאָה dans une annonce de jugement
  choice: s’est déchaînée
  alternative: se déchaînera
  rationale: L’accompli présente le jugement annoncé comme déjà mis en mouvement et donc certain. Le passé composé français préserve cet effet rhétorique au lieu de le réduire à un simple futur.
- issue: Portée du dernier verbe יָחוּל
  choice: elle tournoiera
  alternative: elle s’abattra
  rationale: La traduction retient d’abord le mouvement tourbillonnant suggéré par la racine et son parallèle immédiat, tout en signalant en note que le contexte peut mettre l’accent sur l’impact contre les méchants.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation fait de « ouragan tourbillonnant » une apposition qui intensifie la première image sans alourdir la phrase. Le féminin des pronoms reprend « tempête ».
