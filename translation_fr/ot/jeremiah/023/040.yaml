  yaml_path: translation/ot/jeremiah/023/040.yaml
  text: And I will put on you everlasting reproach and everlasting disgrace[a], which will not be forgotten.
translation:
  language: fr
  text: Je ferai peser sur vous un opprobre éternel et une honte éternelle[a], qui ne sera pas oubliée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un opprobre perpétuel et une honte perpétuelle ». Le mot hébreu עוֹלָם peut désigner une durée éternelle ou une perpétuité indéfinie, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je ferai peser
  rationale: Avec עֲלֵיכֶם et des noms abstraits, נתן exprime ici l’imposition d’une condition. « Faire peser sur » rend naturellement cet idiome en français.
- source_word: עֲלֵיכֶם
  choice: sur vous
  rationale: La préposition עַל avec suffixe indique que l’opprobre et la honte sont imposés aux destinataires.
- source_word: חֶרְפַּת
  choice: un opprobre
  rationale: חֶרְפָּה évoque le déshonneur public, le mépris ou l’objet des railleries. « Opprobre » conserve ce sens tout en restant distinct de כְּלִמּוּת.
- source_word: עוֹלָם
  choice: éternel
  rationale: Dans cette parole de jugement, עוֹלָם exprime une durée sans terme envisagé. « Éternel » préserve la force solennelle du texte; la note signale l’autre nuance possible.
- source_word: וּכְלִמּוּת
  choice: et une honte
  rationale: כְּלִמּוּת désigne la honte, l’humiliation ou le déshonneur. « Honte » est naturel en français et maintient une distinction avec « opprobre ».
- source_word: אֲשֶׁר לֹא תִשָּׁכֵחַ
  choice: qui ne tomberont pas dans l’oubli
  rationale: Le niphal de שׁכח signifie « être oublié ». Cette tournure française rend clairement le passif; le pluriel est exigé en français parce que le relatif reprend deux noms coordonnés.
theological_decisions:
- issue: Portée de עוֹלָם dans une parole de jugement
  choice: éternel
  alternative: perpétuel, durable à jamais
  rationale: Le terme annonce un déshonneur durable, sans limite précisée. « Éternel » en conserve la gravité sans ajouter d’explication doctrinale; la note maintient l’ambiguïté lexicale réelle.
translation_notes:
  register: Français moderne, digne et accessible. « Opprobre » garde la dimension publique de חֶרְפָּה, tandis que « honte » rend כְּלִמּוּת sans confondre les deux termes. « Faire peser sur » évite le calque peu naturel « mettre sur vous ».
