  source_fidelity: Le sens des deux substantifs et de l’imposition du déshonneur sur les destinataires est bien rendu. Toutefois, le verbe hébreu תִשָּׁכֵחַ est au singulier féminin. Il se rapporte naturellement à כְּלִמּוּת (« honte/disgrâce »), le second nom féminin singulier, plutôt qu’aux deux noms coordonnés. Le pluriel français « tomberont » efface cette particularité syntaxique.
  naturalness: « Je ferai peser sur vous » est une formulation moderne et naturelle pour l’idiome hébreu. « Opprobre » convient au registre prophétique tout en restant compréhensible. La correction au singulier rend la phrase grammaticalement naturelle et plus fidèle.
  terminology: « Opprobre » distingue adéquatement חֶרְפָּה de « honte », qui rend bien כְּלִמּוּת. « Éternel » est possible pour עוֹלָם, à condition que la note conserve la nuance d’une durée durable ou indéfinie selon le contexte; la note le fait de façon satisfaisante.
