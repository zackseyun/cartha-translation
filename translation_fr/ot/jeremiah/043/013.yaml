source:
  edition: WLC
  text: וְ/שִׁבַּ֗ר אֶֽת מַצְּבוֹת֙ בֵּ֣ית שֶׁ֔מֶשׁ אֲשֶׁ֖ר בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֶת בָּתֵּ֥י אֱלֹהֵֽי מִצְרַ֖יִם יִשְׂרֹ֥ף בָּ/אֵֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/013.yaml
  text: He will shatter the pillars of Beth-shemesh that is in the land of Egypt[b][a], and he will burn the temples of the gods of Egypt with fire.
translation:
  language: fr
  text: Il brisera les stèles de Beth-Shémesh, qui se trouve en Égypte,[a][b] et il mettra le feu aux temples des dieux d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierres dressées » ou « stèles sacrées ». Le terme hébreu désigne ici des pierres dressées à usage cultuel.
    reason: lexical_alternative
  - marker: b
    text: Beth-Shémesh signifie « Maison du Soleil » et désigne probablement la ville égyptienne connue sous le nom d’Héliopolis en grec.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁבַּר
  choice: Il brisera
  rationale: Le verbe שׁבר exprime ici une destruction violente. « Brisera » est naturel, digne et suffisamment énergique en français moderne.
- source_word: מַצְּבוֹת
  choice: les stèles
  rationale: מַצֵּבָה désigne des pierres dressées, souvent cultuelles. « Stèles » restitue bien l’objet concret sans ajouter explicitement une qualification religieuse.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Le nom de lieu est translittéré selon un usage biblique français reconnaissable; son sens et son identification probable sont réservés à une note.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: qui se trouve en Égypte
  rationale: Cette formulation française naturelle conserve la proposition relative qui localise Beth-Shémesh, tout en rendant אֶרֶץ מִצְרָיִם sans le calque plus lourd « le pays d’Égypte ».
- source_word: בָּתֵּי אֱלֹהֵי מִצְרַיִם
  choice: les temples des dieux de l’Égypte
  rationale: Bien que בָּתִּים signifie littéralement « maisons », le contexte cultuel appelle naturellement « temples » en français.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: il brûlera par le feu
  rationale: La formulation maintient l’expression hébraïque explicite associant le verbe « brûler » et « le feu », ainsi que sa force rhétorique.
