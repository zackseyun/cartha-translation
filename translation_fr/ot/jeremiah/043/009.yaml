id: JER.43.9
reference: Jeremiah 43:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קַ֣ח בְּ/יָדְ/ךָ֞ אֲבָנִ֣ים גְּדֹל֗וֹת וּ/טְמַנְתָּ֤/ם בַּ/מֶּ֨לֶט֙ בַּ/מַּלְבֵּ֔ן אֲשֶׁ֛ר בְּ/פֶ֥תַח בֵּית פַּרְעֹ֖ה בְּ/תַחְפַּנְחֵ֑ס לְ/עֵינֵ֖י אֲנָשִׁ֥ים יְהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/009.yaml
  text: Take large stones in your hand and hide them in the mortar[a], in the brick pavement that is at the entrance of Pharaoh’s house in Tahpanhes[c][b], before the eyes of the Jewish men.
translation:
  language: fr
  text: Prends dans ta main de grosses pierres et cache-les[a] dans le mortier, dans le pavement de briques[b] qui se trouve à l’entrée de la maison du pharaon, à Tahpanès, sous les yeux des hommes de Juda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfouis-les ». Le verbe hébreu peut désigner le fait de cacher quelque chose en le plaçant dans le sol ou dans une construction.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’ouvrage de briques », « dans la terrasse de briques », ou peut-être « dans le four à briques ». Le terme hébreu est rare, et son sens architectural précis demeure incertain.
    reason: lexical_alternative
  - marker: c
    text: Ou « des hommes juifs » ou « des Judéens ». L’adjectif hébreu peut désigner les Juifs sur le plan ethnique ou, plus précisément, les gens de Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בְּיָדְךָ
  choice: Prends dans ta main
  rationale: L’impératif et le singulier « ta main » sont conservés; la tournure reste naturelle tout en gardant l’image concrète de l’hébreu.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: de grosses pierres
  rationale: « Grosses pierres » exprime naturellement en français moderne la taille physique indiquée par l’hébreu.
- source_word: וּטְמַנְתָּם
  choice: cache-les
  rationale: Le verbe טמן désigne l’action de dissimuler, souvent en enfouissant ou en incorporant l’objet dans le sol ou une construction; « cache-les » en préserve l’étendue sémantique.
- source_word: בַּמֶּלֶט
  choice: dans le mortier
  rationale: Dans ce contexte de maçonnerie, « mortier » convient mieux que « ciment », qui serait anachronique, et mieux que « argile », moins précis.
- source_word: בַּמַּלְבֵּן
  choice: dans le pavement de briques
  rationale: Le terme rare désigne vraisemblablement un ouvrage ou un espace en briques. À l’entrée de la maison du pharaon, « pavement de briques » donne un sens architectural cohérent sans masquer l’incertitude, signalée en note.
- source_word: אֲשֶׁר בְּפֶתַח בֵּית פַּרְעֹה
  choice: qui se trouve à l’entrée de la maison du pharaon
  rationale: La traduction garde « maison » plutôt que l’interprétation « palais » et rend explicitement, en français naturel, la localisation exprimée par l’hébreu.
- source_word: בְּתַחְפַּנְחֵס
  choice: à Tahpanès
  rationale: Translittération française usuelle et reconnaissable du nom de lieu.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression française conserve la force visuelle et publique de l’idiome hébreu.
- source_word: אֲנָשִׁים יְהוּדִים
  choice: des hommes de Juda
  rationale: Cette formulation conserve le nom masculin explicite אֲנָשִׁים et rend יְהוּדִים dans son cadre historique, tout en signalant l’autre compréhension possible en note.
theological_decisions: []
