  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יִרְמְיָ֜הוּ לְ/דַבֵּ֣ר אֶל כָּל הָ/עָ֗ם אֶת כָּל דִּבְרֵי֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם אֲשֶׁ֧ר שְׁלָח֛/וֹ יְהוָ֥ה אֱלֹהֵי/הֶ֖ם אֲלֵי/הֶ֑ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/001.yaml
  text: And when Jeremiah had finished speaking to all the people all the words of Yahweh their God[a], with which Yahweh their God had sent him to them—all these words—
translation:
  language: fr
  text: Lorsque Jérémie eut fini de dire à tout le peuple toutes les paroles de Yahvé, leur Dieu, avec lesquelles Yahvé, leur Dieu, l’avait envoyé vers eux — toutes ces paroles[a] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu reprend ici l’expression « toutes ces paroles » pour insister.
    reason: La répétition appositionnelle peut paraître redondante en français, mais elle appartient à la forme emphatique du texte source.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Lorsque … eut fini
  rationale: La construction temporelle introduit une action achevée avant celle du verset suivant. Le passé antérieur convient au registre narratif soutenu sans reprendre littéralement l’idiome וַיְהִי.
- source_word: לְדַבֵּר אֶל כָּל הָעָם
  choice: d’adresser à tout le peuple
  rationale: Dans ce contexte, דבר אל désigne la parole adressée à des destinataires. Cette formulation française permet de conserver « toutes les paroles » comme complément direct sans lourdeur excessive.
- source_word: אֶת כָּל דִּבְרֵי יְהוָה
  choice: toutes les paroles de Yahvé
  rationale: « Paroles » conserve l’expression concrète du discours prophétique et prépare la répétition finale du texte hébreu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que par un titre substitutif.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Malgré sa forme morphologique plurielle, אֱלֹהִים est ici singulier et se trouve en apposition à Yahvé.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם אֲלֵיהֶם
  choice: que Yahvé, leur Dieu, l’avait envoyé leur annoncer
  rationale: La formulation garde l’idée que Dieu a envoyé Jérémie vers le peuple, tout en explicitant naturellement en français que les paroles constituent le message annoncé.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: La reprise appositionnelle est maintenue afin de préserver l’insistance du texte source; « paroles » reste cohérent avec le contexte immédiat.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. « Yahvé » en conserve la fonction de nom propre dans une forme bien établie en français.
- issue: Rapport entre les paroles et l’envoi de Jérémie
  choice: Dieu avait envoyé Jérémie les annoncer
  alternative: Dieu avait envoyé Jérémie vers eux avec ces paroles
  rationale: L’hébreu rattache les paroles à la mission de Jérémie sans expliciter un verbe comme « annoncer ». La traduction française l’ajoute pour rendre le rapport syntaxique intelligible, sans modifier le contenu de la mission.
translation_notes:
  register: Français moderne, digne et narratif. Le passé antérieur marque clairement l’antériorité. Les tirets préservent la reprise emphatique finale, et la virgule terminale signale que la phrase se poursuit au verset suivant.
