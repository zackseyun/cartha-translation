  text: וַ/יֹּ֨אמֶר עֲזַרְיָ֤ה בֶן הוֹשַֽׁעְיָה֙ וְ/יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל הָ/אֲנָשִׁ֖ים הַ/זֵּדִ֑ים אֹמְרִ֣ים אֶֽל יִרְמְיָ֗הוּ שֶׁ֚קֶר אַתָּ֣ה מְדַבֵּ֔ר לֹ֣א שְׁלָחֲ/ךָ֞ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹֽא תָבֹ֥אוּ מִצְרַ֖יִם לָ/ג֥וּר שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/002.yaml
  text: Azariah son of Hoshaiah, Johanan son of Kareah, and all the arrogant men said to Jeremiah, “You are speaking a lie. The LORD our God has not sent you to say, ‘You must not go to Egypt to sojourn there.’”
translation:
  language: fr
  text: 'Azaria, fils de Hoshaïa, Yohanân, fils de Qaréah, et tous les hommes arrogants dirent à Jérémie : « Tu mens ! Le SEIGNEUR, notre Dieu, ne t’a pas envoyé pour dire : “N’allez pas en Égypte pour y séjourner.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזֵּדִים
  choice: arrogants
  rationale: Le terme désigne des hommes présomptueux ou insolents; « arrogants » est naturel et conserve leur attitude condamnable.
- source_word: שֶׁקֶר אַתָּה מְדַבֵּר
  choice: C’est un mensonge que tu dis !
  rationale: Rend directement l’accusation hébraïque, plus forte qu’une simple affirmation d’erreur.
- source_word: לָגוּר שָׁם
  choice: pour y séjourner
  rationale: Le verbe גּוּר évoque une résidence comme étranger, sans nécessairement impliquer une installation définitive.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française digne et largement intelligible pour représenter le tétragramme.
theological_decisions:
- issue: Force de l’interdiction rapportée
  choice: N’allez pas en Égypte
  alternative: Vous ne devez pas aller en Égypte
  rationale: L’hébreu לֹא תָבֹאוּ peut se rendre naturellement comme une interdiction directe; cette formulation ne renforce pas inutilement la modalité.
- issue: Destinataire implicite de « dire »
  choice: nous dire
  alternative: dire
  rationale: Le contexte et la construction indiquent que le message leur est adressé; « nous » rend l’implicite naturel en français sans modifier le sens.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Les noms propres suivent une translittération française cohérente; le discours direct conserve la véhémence de l’accusation.
