  source_fidelity: 'Le sens fondamental est bien rendu : les deux chefs et les hommes présomptueux accusent Jérémie de mensonge et nient que YHWH les ait chargés d’interdire le départ en Égypte. Toutefois, « ces hommes » ajoute un démonstratif absent du texte, et « nous dire » explicite un destinataire qui reste implicite dans l’hébreu.'
