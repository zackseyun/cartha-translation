id: JER.43.5
reference: Jeremiah 43:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יוֹחָנָ֤ן בֶּן קָרֵ֨חַ֙ וְ/כָל שָׂרֵ֣י הַ/חֲיָלִ֔ים אֵ֖ת כָּל שְׁאֵרִ֣ית יְהוּדָ֑ה אֲשֶׁר שָׁ֗בוּ מִ/כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר נִדְּחוּ שָׁ֔ם לָ/ג֖וּר בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/005.yaml
  text: Then Johanan son of Kareah[a], and all the commanders of the forces, took all the remnant of Judah who had returned from all the nations where they had been driven away[b], to sojourn in the land of Judah—
translation:
  language: fr
  text: Alors, Yohanan, fils de Qaréah, et tous les chefs des troupes prirent tous ceux qui restaient de Juda et qui étaient revenus de toutes les nations où ils avaient été chassés[a], afin de séjourner[b] dans le pays de Juda —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dispersés ». Le verbe hébreu peut évoquer le fait d’être chassé, banni ou dispersé.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu désigne souvent le fait de résider quelque part comme hôte, étranger ou résident non établi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Alors, … prirent
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession, tandis que « prirent » conserve le sens concret de לקח.
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Yohanan, fils de Qaréah
  rationale: Les noms sont translittérés d’après l’hébreu, et le patronyme est rendu par la formule française naturelle « fils de ».
- source_word: שָׂרֵי הַחֲיָלִים
  choice: les chefs des troupes
  rationale: שָׂרִים désigne ici les chefs militaires, et le pluriel חֲיָלִים les troupes ou forces placées sous leur commandement.
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: tous ceux qui restaient de Juda
  rationale: Cette formulation française naturelle conserve l’idée collective de שְׁאֵרִית, le reste ou les survivants, sans imposer à elle seule une interprétation théologique du « reste ».
- source_word: אֲשֶׁר שָׁבוּ
  choice: qui étaient revenus
  rationale: Le plus-que-parfait indique clairement que leur retour précède l’action principale.
- source_word: מִכָּל הַגּוֹיִם
  choice: de toutes les nations
  rationale: La formulation rend directement l’origine du retour depuis les nations étrangères.
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: où ils avaient été chassés
  rationale: Le niphal de נדח exprime un déplacement subi, pouvant évoquer l’expulsion, le bannissement ou la dispersion. « Chassés » garde la force de la contrainte.
- source_word: לָגוּר
  choice: afin de séjourner
  rationale: גור désigne souvent le fait de résider comme hôte, étranger ou résident non établi. « Séjourner » préserve cette nuance, même si le contexte concerne leur propre pays.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: Cette traduction conserve la désignation territoriale hébraïque et l’usage biblique français de « Juda ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le pluriel « tous ceux qui restaient » explicite naturellement le collectif hébreu et permet des reprises pronominales claires. Le tiret final signale que la phrase se poursuit au verset suivant.
