id: JER.43.4
reference: Jeremiah 43:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַע֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֛ים וְ/כָל הָ/עָ֖ם בְּ/ק֣וֹל יְהוָ֑ה לָ/שֶׁ֖בֶת בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/004.yaml
  text: But Johanan son of Kareah[a], and all the commanders of the forces, and all the people, did not listen to the voice of Yahweh, to remain in the land of Judah.
translation:
  language: fr
  text: Mais Yohanan, fils de Qaréah, tous les chefs des troupes et tout le peuple n’écoutèrent pas la voix de Yahweh[a], qui leur demandait de rester dans le pays de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « écouter la voix de Yahweh » peut aussi signifier « obéir à Yahweh ».
    reason: Précise la valeur idiomatique possible de שׁמע בקול sans remplacer l’image concrète dans le texte principal.
lexical_decisions:
- source_word: וְלֹא
  choice: Mais … ne … pas
  rationale: Dans le contexte, la conjonction introduit le contraste entre l’ordre transmis précédemment et le refus qui suit.
- source_word: שָׁמַע … בְּקוֹל
  choice: écouter la voix de
  rationale: Cette formulation conserve l’image auditive de l’expression hébraïque tout en laissant entendre, dans le contexte, l’idée de tenir compte de la parole ou d’obéir.
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Yohanan, fils de Qaréah
  rationale: Les noms sont translittérés selon des usages français actuels; la virgule rend naturellement le patronyme en apposition.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: les chefs des troupes
  rationale: « Chefs » exprime la fonction de commandement, et « troupes » préserve la référence militaire ainsi que le pluriel.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: Rendu direct et idiomatique du collectif hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לָשֶׁבֶת
  choice: de rester
  rationale: Dans ce contexte, l’infinitif désigne le maintien dans le pays, par opposition au départ vers l’Égypte.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: Cette formulation conserve le sens territorial de אֶרֶץ et évite l’anachronisme « Judée ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme; « Yahweh » en préserve le caractère de nom propre.
- issue: Portée de l’expression שׁמע בקול
  choice: n’écoutèrent pas la voix de Yahweh
  alternative: n’obéirent pas à Yahweh
  rationale: Le texte principal conserve l’image hébraïque de la voix sans effacer la tension entre l’écoute littérale et l’obéissance impliquée.
translation_notes:
  register: Français international moderne, clair et digne. La relative « qui leur demandait de rester » explicite naturellement en français le contenu de l’infinitif hébreu sans modifier l’ordre donné. Le marqueur [a] est placé après l’expression qu’il explique.
