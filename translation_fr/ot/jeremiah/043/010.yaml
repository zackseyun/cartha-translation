source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י שֹׁלֵ֨חַ֙ וְ֠/לָקַחְתִּי אֶת נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עַבְדִּ֔/י וְ/שַׂמְתִּ֣י כִסְא֔/וֹ מִ/מַּ֛עַל לָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה אֲשֶׁ֣ר טָמָ֑נְתִּי וְ/נָטָ֥ה אֶת שפרור/ו עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/010.yaml
  text: 'And say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am sending and will take Nebuchadnezzar king of Babylon, my servant, and I will set his throne above these stones that I have hidden, and he will spread his canopy over them.’'
translation:
  language: fr
  text: 'Tu leur diras : « Ainsi parle Yahweh des armées, le Dieu d’Israël : Voici, j’envoie chercher et je ferai venir Nebucadnetsar, roi de Babylone, mon serviteur. Je placerai son trône au-dessus de ces pierres que j’ai cachées, et il déploiera sur elles son dais[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son pavillon », « sa tente royale » ; le terme hébreu est rare et pourrait désigner un autre type de couverture royale déployée.
    reason: Incertitude lexicale concernant שפרורו.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par le terme français courant dans ce titre, sans le réduire aux seules armées humaines.
- source_word: הִנְנִי שֹׁלֵחַ וְלָקַחְתִּי
  choice: Voici que j’envoie chercher… et que je le prends
  rationale: « Voici que » garde la force solennelle de l’annonce; « j’envoie chercher » explicite en français le mouvement suggéré par l’envoi, tandis que « je le prends » préserve le second verbe et l’action souveraine de Dieu.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebucadnetsar
  rationale: Forme française moderne et largement reconnue du nom du roi babylonien.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Désigne ici le roi comme instrument au service de Dieu, sans affirmer sa fidélité religieuse ni son approbation morale.
- source_word: כִסְאוֹ
  choice: son trône
  rationale: Le contexte royal appelle nettement « trône » plutôt que le terme général « siège ».
- source_word: מִמַּעַל לָאֲבָנִים הָאֵלֶּה
  choice: au-dessus de ces pierres
  rationale: Reproduit le rapport spatial sans préciser à tort si le trône repose directement sur les pierres.
- source_word: טָמָנְתִּי
  choice: que j’ai cachées
  rationale: Conserve la première personne du texte hébreu ainsi que le sens de dissimulation, sans la préciser en « enfouies ».
- source_word: שפרורו
  choice: son dais
  rationale: Le mot hébreu rare semble désigner une couverture ou installation royale déployée. « Dais » convient à la scène du trône, tout en laissant l’incertitude lexicale à la note.
- source_word: וְנָטָה
  choice: il déploiera
  rationale: Rend naturellement l’idée d’étendre ou de déployer une couverture royale.
theological_decisions:
- issue: Nebucadnetsar appelé עַבְדִּי
  choice: mon serviteur
  alternative: mon esclave; mon agent
  rationale: 'La traduction maintient la tension du texte : un roi païen peut être employé souverainement par Dieu sans que cela implique une approbation morale ou une fidélité d’alliance.'
- issue: Première personne dans « les pierres que j’ai cachées »
  choice: Conserver la parole divine à la première personne
  alternative: les pierres que tu as cachées
  rationale: Même si Jérémie accomplit matériellement le geste dans le contexte immédiat, le texte massorétique porte explicitement la première personne. La traduction ne corrige pas cette tension en fonction du récit.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe de l’annonce prophétique est conservée sans archaïsmes inutiles. Le marqueur [a] est placé après « dais », le mot auquel la note se rapporte.
