source:
  edition: WLC
  text: כִּ֗י בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה מַסִּ֥ית אֹתְ/ךָ֖ בָּ֑/נוּ לְמַעַן֩ תֵּ֨ת אֹתָ֤/נוּ בְ/יַֽד הַ/כַּשְׂדִּים֙ לְ/הָמִ֣ית אֹתָ֔/נוּ וּ/לְ/הַגְל֥וֹת אֹתָ֖/נוּ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/003.yaml
  text: For Baruch son of Neriah is inciting you against us[a], in order to give us into the hand of the Chaldeans[c][b], to put us to death and to carry us away into exile to Babylon.
translation:
  language: fr
  text: Car Baruc, fils de Néria, t’incite à agir contre nous[a], afin de nous livrer aux mains des Chaldéens[b], de nous faire mourir et de nous déporter à Babylone[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te pousse à agir contre nous » ou « te monte contre nous ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la main des Chaldéens », expression qui signifie être livré à leur pouvoir.
    reason: cultural_note
  - marker: c
    text: Ou « nous emmener en exil à Babylone » ou « nous exiler à Babylone ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison avancée pour justifier le refus exprimé dans le contexte précédent.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: Baruch, fils de Nérija
  rationale: Rend naturellement le patronyme hébreu tout en conservant les formes françaises usuelles des noms bibliques.
- source_word: מַסִּית אֹתְךָ בָּנוּ
  choice: t’incite contre nous
  rationale: Le participe hiphil exprime ici l’instigation hostile; cette formulation conserve l’accusation selon laquelle Baruch pousse Jérémie à agir contre les locuteurs.
- source_word: לְמַעַן
  choice: afin de
  rationale: Marque explicitement le but attribué à Baruch.
- source_word: תֵּת אֹתָנוּ בְיַד הַכַּשְׂדִּים
  choice: nous livrer aux mains des Chaldéens
  rationale: « Livrer aux mains de » restitue l’image hébraïque de la main comme pouvoir tout en restant idiomatique en français.
- source_word: לְהָמִית אֹתָנוּ
  choice: pour qu’ils nous fassent mourir
  rationale: Rend la valeur causative du hiphil et laisse les Chaldéens, mentionnés immédiatement avant, comme agents naturels de l’action.
- source_word: וּלְהַגְלוֹת אֹתָנוּ בָּבֶל
  choice: et nous déportent à Babylone
  rationale: « Déporter » exprime clairement le déplacement forcé vers l’exil; « à Babylone » indique la destination.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la vigueur accusatrice du discours ainsi que l’image hébraïque des « mains », sans lourdeur excessive.
