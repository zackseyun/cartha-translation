- from: Car Baruch, fils de Nérija, t’incite contre nous[a] afin de nous livrer aux mains des Chaldéens[b], pour qu’ils nous fassent mourir et nous déportent à Babylone[c].
  to: Car Baruc, fils de Néria, t’incite à agir contre nous[a], afin de nous livrer aux mains des Chaldéens[b], de nous faire mourir et de nous déporter à Babylone[c].
  rationale: La révision emploie les formes françaises usuelles des noms propres, améliore l’idiomaticité de l’accusation formulée contre Jérémie et préserve l’ambiguïté syntaxique de la chaîne d’infinitifs hébraïques en ne désignant pas explicitement les Chaldéens comme agents des deux dernières actions. Les ancres de notes restent attachées aux expressions auxquelles elles se rapportent.
