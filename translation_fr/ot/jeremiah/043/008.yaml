  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶֽל יִרְמְיָ֔הוּ בְּ/תַחְפַּנְחֵ֖ס לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/008.yaml
  text: Then the word of Yahweh came to Jeremiah in Tahpanhes[a], saying,
translation:
  language: fr
  text: 'Alors[a], la parole de Yahweh parvint à Jérémie, à Tahpanès :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et il arriva que la parole de Yahweh vint à Jérémie… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors ... fut adressée
  rationale: Le wayyiqtol de היה fait progresser le récit et introduit un nouvel événement. Cette tournure française naturelle évite l’archaïsme « il arriva que » tout en conservant la transition narrative.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: La formule prophétique désigne la parole divine communiquée au prophète. « Parole » en préserve la portée formelle et théologique mieux que « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל יִרְמְיָהוּ
  choice: à Jérémie
  rationale: La préposition אֶל indique ici le destinataire de la parole; le nom du prophète suit sa forme française usuelle.
- source_word: בְּתַחְפַּנְחֵס
  choice: à Tahpanès
  rationale: Le préfixe בְּ marque le lieu. En français, « à » est la préposition naturelle devant le nom d’une ville.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans ajouter le calque lourd « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération conserve le nom personnel et évite de le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et fluide. La formule « la parole de Yahweh fut adressée à » conserve le registre prophétique traditionnel sans employer « il advint » ou « en disant », ressentis comme archaïques ou calqués.
