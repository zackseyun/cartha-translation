  text: וְ/הִצַּ֣תִּי אֵ֗שׁ בְּ/בָתֵּי֙ אֱלֹהֵ֣י מִצְרַ֔יִם וּ/שְׂרָפָ֖/ם וְ/שָׁבָ֑/ם וְ/עָטָה֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם כַּ/אֲשֶׁר יַעְטֶ֤ה הָֽ/רֹעֶה֙ אֶת בִּגְד֔/וֹ וְ/יָצָ֥א מִ/שָּׁ֖ם בְּ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/012.yaml
  text: And he will set fire to the temples of the gods of Egypt[a], and he will burn them and carry them away. He will wrap himself in the land of Egypt as a shepherd wraps himself in his garment[b], and he will go out from there in peace.
translation:
  language: fr
  text: Je mettrai le feu aux temples des dieux d’Égypte[a]. Il les brûlera et les emportera[b]. Il se couvrira du pays d’Égypte comme un berger se couvre de son manteau, puis il en sortira en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « Je mettrai le feu ». Les verbes suivants sont à la troisième personne du singulier et se rapportent, dans le contexte, au roi de Babylone.'
    reason: grammatical_tension
  - marker: b
    text: 'Ou : « il les emmènera captifs ». Le pronom peut renvoyer aux dieux, à leurs images ou aux biens de leurs temples.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: Je mettrai le feu
  rationale: La forme hébraïque transmise est à la première personne du singulier. Cette traduction la conserve, malgré le passage immédiat à une série de verbes à la troisième personne ayant pour sujet le roi de Babylone.
- source_word: בְּבָתֵּי אֱלֹהֵי מִצְרַיִם
  choice: aux temples des dieux d’Égypte
  rationale: Le mot בָּתִּים signifie littéralement « maisons », mais les « maisons » de divinités sont ici leurs sanctuaires ; « temples » exprime naturellement ce sens en français.
- source_word: וּשְׂרָפָם וְשָׁבָם
  choice: Il les brûlera et les emportera
  rationale: Les suffixes masculins pluriels sont conservés sans préciser s’ils désignent les dieux, leurs images, leurs temples ou leurs biens. « Emportera » rend le résultat concret de שבה dans ce contexte tout en maintenant l’ambiguïté de l’objet.
- source_word: וְעָטָה אֶת אֶרֶץ מִצְרַיִם
  choice: Il s’enveloppera du pays d’Égypte
  rationale: La formulation garde l’image audacieuse de l’Égypte traitée comme un vêtement dont le conquérant s’enveloppe, sans la remplacer par une explication telle que « prendra possession ».
- source_word: כַּאֲשֶׁר יַעְטֶה הָרֹעֶה אֶת בִּגְדוֹ
  choice: comme un berger s’enveloppe de son manteau
  rationale: La répétition de « s’envelopper » reflète celle du verbe עטה. « Manteau » désigne naturellement le vêtement extérieur dans lequel un berger peut s’envelopper.
- source_word: וְיָצָא מִשָּׁם בְּשָׁלוֹם
  choice: puis il en sortira en paix
  rationale: « En paix » conserve le sens direct de בְּשָׁלוֹם, qui peut aussi impliquer une sortie saine et sauve. « En » reprend naturellement le pays d’Égypte en français.
theological_decisions:
- issue: Sujet du premier verbe, à la première personne en hébreu, face aux verbes suivants à la troisième personne
  choice: Conserver « Je mettrai », où le Seigneur parle, puis « il », qui désigne le roi de Babylone.
  alternative: « Il mettra le feu », en faisant du roi de Babylone le sujet de toute la séquence.
  rationale: La forme massorétique וְהִצַּתִּי est explicitement à la première personne. Le changement de personne peut présenter le Seigneur comme l’auteur du jugement et le roi de Babylone comme son agent. La traduction ne doit pas effacer cette tension grammaticale et théologique au profit d’une simple harmonisation contextuelle.
- issue: Référent des pronoms dans « il les brûlera et les emportera »
  choice: Laisser le référent indéterminé dans le texte principal.
  alternative: Préciser qu’il s’agit des statues des dieux ou des trésors des temples.
  rationale: L’hébreu emploie seulement des suffixes masculins pluriels ; préciser « statues » ou « trésors » introduirait une identification qui n’est pas explicitement donnée.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La métaphore inhabituelle de l’Égypte comme vêtement est maintenue. Les changements de personne et l’ambiguïté des pronoms sont conservés plutôt que résolus silencieusement.
