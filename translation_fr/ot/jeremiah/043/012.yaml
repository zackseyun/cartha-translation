  naturalness: « Il s’enveloppera du pays d’Égypte » est compréhensible mais peu naturel en français moderne. « Il se couvrira du pays d’Égypte » transmet plus idiomatiquement l’image volontairement frappante du pays porté comme un vêtement, avec un parallèle clair dans la comparaison du berger.
  terminology: '« Temples des dieux d’Égypte », « manteau » et « en paix » conviennent au registre. La note b doit éviter de présenter « il les fera captifs » comme une traduction littérale : le verbe signifie plutôt prendre ou emmener captif, et son objet demeure ambigu.'
