  text: אֶֽת הַ֠/גְּבָרִים וְ/אֶת הַ/נָּשִׁ֣ים וְ/אֶת הַ/טַּף֮ וְ/אֶת בְּנ֣וֹת הַ/מֶּלֶךְ֒ וְ/אֵ֣ת כָּל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר הִנִּ֨יחַ֙ נְבוּזַרְאֲדָ֣ן רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֣ם בֶּן שָׁפָ֑ן וְ/אֵת֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא וְ/אֶת בָּר֖וּךְ בֶּן נֵרִיָּֽהוּ־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/006.yaml
  text: the men[a], the women, the little children, the king’s daughters, and every person whom Nebuzaradan the captain of the guard had left with Gedaliah son of Ahikam, son of Shaphan, and Jeremiah the prophet[c][b], and Baruch son of Neriah—
translation:
  language: fr
  text: 'les hommes, les femmes, les jeunes enfants[a], les filles du roi et toutes les personnes[b] que Nebouzaradan, chef de la garde[c], avait laissées : Guedalia, fils d’Ahiqam, fils de Shafan, le prophète Jérémie et Baruch, fils de Néria —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants »; le mot hébreu peut désigner les petits enfants ou, plus largement, les enfants à charge.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « toute âme »; en hébreu, « âme » désigne ici une personne.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « chef des massacreurs » ou « chef des exécuteurs »; il s’agit d’un titre officiel couramment rendu par « chef de la garde ».
    reason: cultural_note
lexical_decisions:
- source_word: הַגְּבָרִים
  choice: les hommes
  rationale: Dans cette énumération associant hommes, femmes et enfants, le terme désigne naturellement les hommes comme groupe.
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Le contexte ne justifie pas le sens plus précis d’« épouses ».
- source_word: הַטַּף
  choice: les jeunes enfants
  rationale: Le terme désigne les petits enfants ou, plus largement, les enfants à charge; « jeunes enfants » exprime clairement le sens principal dans cette liste familiale.
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: les filles du roi
  rationale: Cette formulation traduit directement l’expression hébraïque sans lui substituer le titre interprétatif « princesses ».
- source_word: כָּל הַנֶּפֶשׁ
  choice: toutes les personnes
  rationale: נֶפֶשׁ désigne ici des êtres humains, non une âme immatérielle. Le pluriel français rend naturellement la portée collective de l’expression.
- source_word: הִנִּיחַ
  choice: avait laissées
  rationale: Le verbe indique que Nebouzaradan avait laissé ces personnes sur place, dans l’entourage ou sous l’autorité de Guedalia.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Il s’agit d’un titre officiel babylonien. Cette expression française en communique la fonction sans suggérer le sens moderne trompeur de « chef des bouchers ».
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: auprès de Guedalia, fils d’Ahiqam et petit-fils de Shafan
  rationale: « Auprès de » exprime sobrement le lien avec Guedalia. « Petit-fils de Shafan » rend naturelle en français la généalogie hébraïque à deux degrés.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Le titre explicite est conservé dans l’ordre idiomatique du français.
- source_word: בָּרוּךְ בֶּן נֵרִיָּהוּ
  choice: Baruch, fils de Néria
  rationale: Les noms sont translittérés selon l’usage français, et le patronyme est conservé.
