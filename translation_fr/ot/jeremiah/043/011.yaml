reference: Jeremiah 43:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ו/בא/ה וְ/הִכָּ֖ה אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֧ר לַ/מָּ֣וֶת לַ/מָּ֗וֶת וַ/אֲשֶׁ֤ר לַ/שְּׁבִי֙ לַ/שֶּׁ֔בִי וַ/אֲשֶׁ֥ר לַ/חֶ֖רֶב לֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/011.yaml
  text: 'He will come and strike the land of Egypt: those for death[a], to death; those for captivity, to captivity; and those for the sword, to the sword.'
translation:
  language: fr
  text: 'Il viendra et frappera le pays d’Égypte : ceux qui sont voués à la mort, à la mort ; ceux qui sont voués à la captivité, à la captivité ; et ceux qui sont voués à l’épée, à l’épée.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, plus littérale : « celui qui est pour la mort, à la mort ; celui qui est pour la captivité, à la captivité ; et celui qui est pour l’épée, à l’épée ». L’hébreu emploie une formule de jugement brève et répétitive.'
    reason: La construction hébraïque est volontairement concise et peut se rendre soit collectivement, soit par un singulier distributif.
lexical_decisions:
- source_word: וּבָאָה
  choice: Il viendra
  rationale: Le qatal précédé de la conjonction poursuit ici la séquence prophétique avec une valeur future. Le sujet masculin singulier renvoie, dans le contexte, au roi de Babylone.
- source_word: וְהִכָּה
  choice: et frappera
  rationale: Le verbe נכה signifie couramment « frapper ». Cette formulation conserve sa portée générale sans préciser indûment la forme de l’attaque.
- source_word: אֶת־אֶרֶץ מִצְרַיִם
  choice: le pays d’Égypte
  rationale: Cette traduction conserve אֶרֶץ et désigne naturellement en français le territoire égyptien soumis au jugement.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: ceux qui sont voués à la mort, à la mort
  rationale: « Voués à » rend intelligible la destination exprimée par ל tout en maintenant la répétition lapidaire et judiciaire de l’hébreu.
- source_word: וַאֲשֶׁר לַשְּׁבִי לַשֶּׁבִי
  choice: ceux qui sont voués à la captivité, à la captivité
  rationale: שְׁבִי désigne ici la captivité, plutôt que l’exil au sens large. La répétition préserve le parallélisme de la formule.
- source_word: וַאֲשֶׁר לַחֶרֶב לֶחָרֶב
  choice: ceux qui sont voués à l’épée, à l’épée
  rationale: La traduction littérale d’חֶרֶב conserve l’image hébraïque de la mort violente et le troisième membre de la structure ternaire.
theological_decisions:
- issue: Référent du sujet masculin singulier
  choice: Le pronom « Il » est conservé et renvoie contextuellement au roi de Babylone, instrument du jugement.
  alternative: Expliciter « Nabuchodonosor viendra » ou employer une tournure impersonnelle.
  rationale: Les formes verbales hébraïques sont au masculin singulier et le contexte immédiat identifie le référent. Ne pas ajouter son nom respecte la formulation du verset et évite de rendre le sujet plus explicite que l’original.
- issue: Portée de la formule distributive de jugement
  choice: Employer « ceux qui sont voués à… » sans préciser qui détermine chaque sort.
  alternative: Traduire « ceux qui sont destinés par Dieu à… » ou reformuler en catégories de victimes.
  rationale: Le texte affirme la répartition inexorable des jugements, mais ne nomme pas explicitement dans cette formule l’auteur de cette destination. La traduction préserve cette tension sans ajout doctrinal.
translation_notes:
  register: Français moderne, digne et accessible. La répétition inhabituelle est maintenue pour restituer le rythme sévère de la formule hébraïque ; « voués à » apporte la clarté minimale nécessaire sans supprimer l’ambiguïté sur l’agent de cette destination.
