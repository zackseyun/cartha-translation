  text: וַ/יָּבֹ֨אוּ֙ אֶ֣רֶץ מִצְרַ֔יִם כִּ֛י לֹ֥א שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה וַ/יָּבֹ֖אוּ עַד תַּחְפַּנְחֵֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/007.yaml
  text: So they entered the land of Egypt[a], for they did not listen to the voice of Yahweh, and they came as far as Tahpanhes.
translation:
  language: fr
  text: Ils entrèrent dans le pays d’Égypte, car ils n’avaient pas écouté la voix de Yahweh[a], et ils parvinrent jusqu’à Tahpanès.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’avaient pas obéi à Yahweh ». L’expression hébraïque « écouter la voix de » peut désigner le fait d’obéir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: ils entrèrent
  rationale: Avec « le pays d’Égypte » comme complément, בוא exprime naturellement l’entrée dans un territoire. « Entrèrent » conserve le mouvement du récit.
- source_word: אֶרֶץ מִצְרַיִם
  choice: le pays d’Égypte
  rationale: La traduction garde l’expression hébraïque explicite « pays d’Égypte » et sa portée territoriale.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici l’explication de leur conduite. « Car » convient au registre narratif et dignifié.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: ils n’avaient pas écouté la voix de
  rationale: Cette formulation préserve l’image hébraïque de l’écoute, tout en laissant la note signaler que l’expression implique aussi le refus d’obéir. Le plus-que-parfait rend clairement en français l’antériorité logique de ce refus par rapport à leur entrée en Égypte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: וַיָּבֹאוּ עַד
  choice: ils allèrent jusqu’à
  rationale: La combinaison de בוא et עַד indique que le déplacement atteignit ce lieu. « Allèrent jusqu’à » rend naturellement cette limite ou destination en français.
- source_word: תַּחְפַּנְחֵס
  choice: Tahpanès
  rationale: La forme française usuelle du toponyme hébreu est employée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte porte le tétragramme comme nom divin. « Yahweh » le conserve explicitement sans lui substituer un titre.
- issue: Portée de l’expression שׁמע בקול
  choice: écouter la voix de
  alternative: obéir à
  rationale: L’expression peut désigner l’obéissance, mais sa formulation imagée reste intelligible en français. La traduction principale conserve donc cette image et la note explicite la valeur possible sans réduire l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, narratif et dignifié. La syntaxe demeure accessible, le nom divin est explicite, et l’idiome hébreu de l’écoute est conservé avec une note explicative.
