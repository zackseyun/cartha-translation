  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא יִפְרְס֥וּ לָ/הֶ֛ם עַל אֵ֖בֶל לְ/נַחֲמ֣/וֹ עַל מֵ֑ת וְ/לֹֽא יַשְׁק֤וּ אוֹתָ/ם֙ כּ֣וֹס תַּנְחוּמִ֔ים עַל אָבִ֖י/ו וְ/עַל אִמּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/007.yaml
  text: No one will break bread for them in mourning[a], to comfort him for the dead[b], and no one will give them the cup of consolation to drink for his father or for his mother.
translation:
  language: fr
  text: On ne rompra pas le pain pour eux lors d’un deuil[a], afin de le consoler de la mort de quelqu’un, et on ne leur fera pas boire la coupe de consolation[b] à la mort de son père ou de sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « on partagera avec eux le repas de deuil ». Le verbe hébreu signifie littéralement « diviser, rompre » et renvoie probablement au repas traditionnel pris à l’occasion d’un deuil.
    reason: lexical_alternative
  - marker: b
    text: La « coupe de consolation » désigne probablement une boisson que l’on offrait traditionnellement aux personnes endeuillées pour les réconforter après un décès.
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרְסוּ
  choice: partagera ... de pain
  rationale: Le verbe פרס signifie littéralement « diviser, rompre ». Sans complément explicite et dans ce contexte funéraire, il évoque vraisemblablement le partage du repas de deuil. La formulation française reste concrète tout en étant naturelle.
- source_word: עַל אֵבֶל
  choice: pendant le deuil
  rationale: La préposition עַל situe ici l'action dans les circonstances du deuil. « Pendant le deuil » exprime clairement cette valeur circonstancielle.
- source_word: לְנַחֲמוֹ עַל מֵת
  choice: pour consoler celui qui pleure un mort
  rationale: Le suffixe de לְנַחֲמוֹ est masculin singulier et doit être conservé malgré les pluriels environnants. L'explicitation « celui qui pleure » rend en français le rapport entre la consolation et le décès sans identifier abusivement le mort au bénéficiaire.
- source_word: יַשְׁקוּ אוֹתָם
  choice: on ne leur fera pas boire
  rationale: Le hiphil de שׁקה signifie « faire boire, donner à boire ». Cette formulation restitue directement le causatif et s'accorde avec l'objet pluriel אוֹתָם.
- source_word: כּוֹס תַּנְחוּמִים
  choice: la coupe de consolation
  rationale: Cette expression désigne vraisemblablement une boisson offerte rituellement aux endeuillés. Le calque intelligible préserve l'image culturelle du texte.
- source_word: עַל אָבִיו וְעַל אִמּוֹ
  choice: pour son père ou pour sa mère
  rationale: 'Les suffixes sont masculins singuliers. Le français « ou » exprime naturellement la portée distributive : qu''il s''agisse du décès du père ou de celui de la mère.'
theological_decisions:
- issue: Alternance entre référents pluriels et singulier masculin
  choice: Conserver « eux/leur » puis « celui... son »
  alternative: Harmoniser tous les pronoms au pluriel
  rationale: L'hébreu passe réellement du pluriel אוֹתָם aux suffixes masculins singuliers de לְנַחֲמוֹ, אָבִיו et אִמּוֹ. La traduction conserve cette tension grammaticale au lieu de la normaliser.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l'alternance inhabituelle entre pluriel et masculin singulier présente dans l'hébreu, tandis que « celui qui pleure un mort » évite une ambiguïté française qui ferait du mort la personne consolée.
