  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה אַל תָּבוֹא֙ בֵּ֣ית מַרְזֵ֔חַ וְ/אַל תֵּלֵ֣ךְ לִ/סְפּ֔וֹד וְ/אַל תָּנֹ֖ד לָ/הֶ֑ם כִּֽי אָסַ֨פְתִּי אֶת שְׁלוֹמִ֜/י מֵ/אֵ֨ת הָ/עָ֤ם הַ/זֶּה֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֖סֶד וְ/אֶת הָֽ/רַחֲמִֽים־׀־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/005.yaml
  text: 'For thus says Yahweh: Do not enter a house of mourning[a], and do not go to mourn or show sympathy for them, for I have taken away my peace from this people[c][b], declares Yahweh—steadfast love and compassion.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh : « N’entre pas dans une maison de deuil[a] ; ne va pas te lamenter ni leur témoigner ta sympathie[b]. En effet, j’ai retiré à ce peuple ma paix[c], l’amour fidèle et la compassion — déclaration de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une maison de festin ». Le terme hébreu peut désigner un lieu de banquet, mais les mentions de lamentations et de condoléances favorisent ici le sens de « maison de deuil ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les consoler ». Le verbe hébreu peut désigner des gestes ou des paroles de condoléances adressés à des personnes en deuil.
    reason: lexical_alternative
  - marker: c
    text: Ici, la « paix » comprend probablement aussi le bien-être, l’intégrité et la prospérité, et non seulement l’absence de conflit.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel et le distingue du titre « Seigneur », conformément à la forme retenue dans la couche de consultation.
- source_word: בֵּית מַרְזֵחַ
  choice: une maison de deuil
  rationale: מַרְזֵחַ peut désigner un lieu de banquet, mais les verbes voisins relatifs aux lamentations et aux condoléances indiquent ici un rassemblement funéraire.
- source_word: לִסְפּוֹד
  choice: te lamenter
  rationale: Le verbe désigne les lamentations prononcées à l’occasion d’un décès ; cette expression conserve la dimension active du rite funéraire.
- source_word: תָּנֹד לָהֶם
  choice: leur témoigner ta sympathie
  rationale: Dans ce contexte, נוד évoque les gestes ou paroles par lesquels on s’associe au deuil d’autrui. La formulation française reste claire sans préciser un geste particulier.
- source_word: אָסַפְתִּי אֶת שְׁלוֹמִי
  choice: j’ai retiré à ce peuple ma paix
  rationale: אָסַף exprime ici le retrait de ce qui avait été accordé. « Paix » conserve le terme central tout en laissant ouverte sa portée plus large de bien-être et de plénitude.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale solennelle rend le caractère d’oracle prophétique tout en respectant sa position au milieu de la proposition hébraïque.
- source_word: הַחֶסֶד
  choice: l’amour fidèle
  rationale: חֶסֶד associe bienveillance durable et fidélité relationnelle ; « amour fidèle » rend ces deux dimensions sans vocabulaire archaïque.
- source_word: הָרַחֲמִים
  choice: la compassion
  rationale: Le pluriel hébreu fonctionne ici comme un abstrait intensif ou collectif ; le singulier français est naturel et précis.
theological_decisions:
- issue: Rapport entre « ma paix » et « l’amour fidèle et la compassion »
  choice: Conserver les groupes nominaux successifs après la formule d’oracle, sans expliciter s’ils forment une liste de bienfaits retirés ou si les deux derniers précisent le contenu de la paix.
  alternative: 'Rendre les deux derniers termes comme une apposition explicative : « ma paix — c’est-à-dire l’amour fidèle et la compassion » ; ou répéter le verbe : « j’ai aussi retiré l’amour fidèle et la compassion ».'
  rationale: L’hébreu marque « ma paix », « l’amour fidèle » et « la compassion » comme objets, mais l’insertion de נְאֻם יְהוָה permet plusieurs analyses de leur relation. La ponctuation retenue préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs sont au tutoiement singulier, comme dans l’hébreu adressé à Jérémie. Les guillemets français encadrent la parole divine ; le point-virgule sépare nettement les deux interdictions sans alourdir la phrase.
