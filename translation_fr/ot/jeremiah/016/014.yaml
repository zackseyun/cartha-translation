  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹֽא יֵאָמֵ֥ר עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/014.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when it will no longer be said, ‘As Yahweh lives[b], who brought up the sons of Israel from the land of Egypt,’
translation:
  language: fr
  text: 'C’est pourquoi, voici que des jours viennent — déclaration de Yahweh — où l’on ne dira plus : « Aussi vrai que Yahweh est vivant, lui qui a fait monter[a] les fils d’Israël[b] du pays d’Égypte… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « a fait sortir ». Le verbe hébreu signifie littéralement « faire monter » et désigne ici la délivrance hors d’Égypte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Israël »; l’expression désigne collectivement les Israélites, le peuple d’Israël.'
    reason: semantic_clarification
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conclusion tirée du contexte précédent, tout en conservant le lien logique du texte hébreu.
- source_word: הִנֵּה יָמִים בָּאִים
  choice: voici que des jours viennent
  rationale: Conserve à la fois l’appel solennel à l’attention porté par הִנֵּה et la formule prophétique annonçant une intervention future.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique comme une déclaration divine solennelle sans la réduire à un simple verbe de parole.
- source_word: וְלֹא יֵאָמֵר עוֹד
  choice: où l’on ne dira plus
  rationale: Le pronom indéfini « on » restitue idiomatiquement le passif impersonnel hébreu; « où » rattache naturellement l’énoncé aux jours annoncés.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Exprime clairement en français la valeur de serment de cette formule hébraïque figée.
- source_word: אֲשֶׁר הֶעֱלָה
  choice: lui qui a fait monter
  rationale: Préserve l’image du verbe עלה au causatif, formule traditionnelle associée à la sortie d’Égypte, malgré la possibilité d’une formulation plus idiomatique avec « faire sortir ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduit la forme filiale explicite de l’hébreu; une note précise sa portée collective.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: hors du pays d’Égypte
  rationale: Conserve le nom « pays » et rend clairement le mouvement depuis l’Égypte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de la formule de serment חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  alternative: Par la vie de Yahweh
  rationale: La formulation retenue communique sans ambiguïté au lecteur moderne qu’il s’agit d’un serment, tout en conservant l’affirmation que Yahweh est vivant.
- issue: Expression genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La traduction garde la forme concrète de l’hébreu, tandis que la note signale que l’expression désigne collectivement le peuple.
translation_notes:
  register: Français moderne, solennel et accessible. « Voici que des jours viennent » maintient le registre prophétique. Les points de suspension indiquent que la formule citée se poursuit au verset suivant; ils ne cherchent pas à résoudre la tension syntaxique créée par la coupure du verset.
