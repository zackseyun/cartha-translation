id: JER.16.20
reference: Jeremiah 16:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/יַעֲשֶׂה לּ֥/וֹ אָדָ֖ם אֱלֹהִ֑ים וְ/הֵ֖מָּה לֹ֥א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/020.yaml
  text: Can a man make gods for himself? Yet they are not gods[a].
translation:
  language: fr
  text: Un être humain peut-il se faire des dieux ? Pourtant, ce ne sont pas des dieux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Un être humain se ferait-il des dieux ? Mais ce ne sont pas des dieux. »'
    reason: La forme verbale interrogative peut aussi se rendre par un conditionnel rhétorique, et la conjonction par « mais ».
lexical_decisions:
- source_word: הֲיַעֲשֶׂה
  choice: peut-il se faire
  rationale: La particule interrogative avec l’imparfait de עשה introduit une question rhétorique empreinte d’incrédulité. « Peut-il se faire » en restitue naturellement la force en français.
- source_word: לּוֹ
  choice: se faire
  rationale: Le complément introduit par ל avec suffixe de troisième personne masculine singulière a ici une valeur idiomatiquement réflexive, rendue par le pronom « se ».
- source_word: אָדָם
  choice: un être humain
  rationale: Le nom désigne ici une personne humaine de manière générique. « Un être humain » conserve le singulier représentatif sans introduire une restriction de sexe absente du contexte.
- source_word: אֱלֹהִים
  choice: des dieux
  rationale: Le pluriel désigne les divinités ou idoles fabriquées par les humains. « Des dieux » préserve le pluriel et la pointe polémique.
- source_word: וְהֵמָּה
  choice: Pourtant, ce
  rationale: La conjonction suivie du pronom indépendant marque un contraste appuyé. « Pourtant » exprime cette valeur adversative, et « ce » reprend naturellement en français les objets fabriqués.
- source_word: לֹא אֱלֹהִים
  choice: ne sont pas des dieux
  rationale: La proposition nie explicitement le statut divin réel des dieux fabriqués, sans transformer le pluriel en référence au Dieu unique.
theological_decisions:
- issue: Nature de la polémique contre les idoles
  choice: Le verset nie que les divinités fabriquées par les humains soient réellement des dieux.
  alternative: Le verset tourne seulement en dérision la fabrication des idoles, sans portée ontologique plus large.
  rationale: La proposition finale לֹא אֱלֹהִים formule une négation directe de leur qualité de dieux. La traduction conserve cette affirmation sans lui ajouter de terminologie philosophique.
translation_notes:
  register: Français international moderne, naturel et digne. « Un être humain » rend le singulier générique ; la tournure « se faire des dieux » garde l’idée de fabrication à son propre usage. Le pronom neutre « ce » convient aux objets désignés comme dieux tout en soutenant la négation polémique.
