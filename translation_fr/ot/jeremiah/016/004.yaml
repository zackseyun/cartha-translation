revisions:
- from: Ils mourront de maladies mortelles[a]. On ne prendra pas le deuil pour eux et on ne les enterrera pas. Ils deviendront du fumier à la surface du sol. Ils seront anéantis par l’épée et par la famine, et leurs cadavres serviront de nourriture aux oiseaux du ciel et aux bêtes de la terre.
  to: Ils mourront de maladies mortelles[a]. Personne ne les pleurera ni ne les enterrera. Ils deviendront du fumier à la surface du sol. Ils périront par l’épée et par la famine, et leurs cadavres serviront de nourriture aux oiseaux du ciel et aux bêtes de la terre.
  rationale: La révision corrige la note lexicale, rend l’absence de lamentation funèbre dans un français plus idiomatique et emploie « périront » pour refléter sobrement le verbe hébreu. Elle conserve toutes les images du texte, y compris sa dureté.
