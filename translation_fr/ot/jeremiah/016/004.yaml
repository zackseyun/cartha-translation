    rationale: מְמוֹתֵי תַחֲלֻאִים correspond littéralement à « morts de maladies » (ou « morts causées par des maladies »), non à « ils mourront de morts de maladies ». Le verbe יָמֻתוּ est distinct.
  - severity: low
    issue: « On ne prendra pas le deuil pour eux » est une formulation peu naturelle.
    rationale: Le verbe ספד désigne le fait de se lamenter ou de pleurer les morts. « Personne ne les pleurera » est idiomatique tout en préservant l’absence de rites funèbres.
  - severity: low
    issue: « Seront anéantis » est légèrement plus interprétatif que nécessaire.
    rationale: כלה exprime ici la disparition ou la mort sous l’effet de l’épée et de la famine. « Périront » est direct, naturel et suffisamment fort.
