base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/004.yaml
  text: They will die of deadly diseases[a]. They will not be mourned or buried. They will become dung on the surface of the ground. They will be consumed by the sword and by famine[c][b], and their carcasses will become food for the birds of the heavens and for the beasts of the earth.
translation:
  language: fr
  text: Ils mourront de maladies mortelles[a]. Personne ne les pleurera ni ne les enterrera. Ils deviendront du fumier à la surface du sol. Ils périront par l’épée et par la famine, et leurs cadavres serviront de nourriture aux oiseaux du ciel et aux bêtes de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « morts de maladies » ; l’expression désigne des morts causées par de graves maladies.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמוֹתֵי תַחֲלֻאִים יָמֻתוּ
  choice: Ils mourront de maladies mortelles
  rationale: La tournure hébraïque, littéralement « ils mourront de morts de maladies », exprime des morts causées par de graves maladies. Cette formulation française conserve la force de l’expression sans reproduire sa construction inhabituelle.
- source_word: לֹא יִסָּפְדוּ
  choice: On ne prendra pas le deuil pour eux
  rationale: Le nifal de ספד évoque les lamentations et les rites de deuil accomplis pour les morts. La tournure impersonnelle française rend clairement l’absence de deuil public.
- source_word: וְלֹא יִקָּבֵרוּ
  choice: on ne les enterrera pas
  rationale: Cette formulation directe et naturelle conserve le parallélisme avec l’absence de deuil.
- source_word: לְדֹמֶן עַל פְּנֵי הָאֲדָמָה יִהְיוּ
  choice: Ils deviendront du fumier à la surface du sol
  rationale: דֹּמֶן désigne le fumier ou les excréments. « Fumier » préserve l’image dégradante, tandis que « à la surface du sol » rend naturellement l’idée de restes exposés et non ensevelis.
- source_word: וּבַחֶרֶב וּבָרָעָב יִכְלוּ
  choice: Ils seront anéantis par l’épée et par la famine
  rationale: כלה indique ici qu’ils seront entièrement détruits ou éliminés. « Anéantis » exprime cette intensité et maintient l’épée et la famine comme moyens du jugement.
- source_word: וְהָיְתָה נִבְלָתָם לְמַאֲכָל
  choice: leurs cadavres serviront de nourriture
  rationale: נְבֵלָה désigne ici les corps morts abandonnés. « Cadavres » est précis et naturel en français; « serviront de nourriture » restitue idiomatiquement la construction résultative.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: aux oiseaux du ciel
  rationale: « Du ciel » est l’équivalent français naturel de l’expression hébraïque et conserve son imagerie.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: aux bêtes de la terre
  rationale: « Bêtes » maintient le ton sombre du contexte et forme un parallélisme biblique naturel avec « oiseaux du ciel ».
