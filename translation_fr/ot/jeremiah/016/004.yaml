  source_fidelity: 'Le sens global est fidèle au texte hébreu : mort par maladie, absence de lamentation et de sépulture, exposition dégradante des morts, puis destruction par l’épée et la famine, avec les cadavres livrés aux oiseaux et aux bêtes. « Périront » rend plus directement וכלה dans ce contexte que « seront anéantis », sans accroître l’intensité au-delà du texte.'
  naturalness: « On ne prendra pas le deuil pour eux » est compréhensible, mais peu idiomatique en français international moderne et moins précis pour ספד, qui vise les lamentations funèbres. « Personne ne les pleurera » est naturel et conserve l’idée. La note actuelle donne une pseudo-littéralité qui inclut indûment le verbe français « ils mourront » dans le syntagme explicité.
  terminology: « Maladies mortelles », « fumier », « cadavres », « oiseaux du ciel » et « bêtes de la terre » conviennent au registre direct et sombre du passage. « Cadavres » est préférable à un terme euphémisant et garde l’image d’exposition aux charognards.
