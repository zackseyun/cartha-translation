id: JER.16.17
reference: Jeremiah 16:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י עֵינַ/י֙ עַל כָּל דַּרְכֵי/הֶ֔ם לֹ֥א נִסְתְּר֖וּ מִ/לְּ/פָנָ֑/י וְ/לֹֽא נִצְפַּ֥ן עֲוֺנָ֖/ם מִ/נֶּ֥גֶד עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/017.yaml
  text: For my eyes are on all their ways[a]; they are not hidden from me[c][b], and their iniquity is not concealed from before my eyes.
translation:
  language: fr
  text: Car mes yeux sont fixés sur toutes leurs voies[a] ; elles ne me sont pas cachées, et leur faute[b] n’est pas dissimulée à mes yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, les « voies » désignent leur conduite, leur manière de vivre.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur culpabilité ». Le mot hébreu peut désigner la faute commise ou la culpabilité qui en résulte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et convient naturellement au discours prophétique.
- source_word: עֵינַי עַל
  choice: mes yeux sont fixés sur
  rationale: Conserve l’image concrète du regard divin attentif, dans un français actuel.
- source_word: כָּל דַּרְכֵיהֶם
  choice: toutes leurs voies
  rationale: Préserve la métaphore hébraïque de la voie, qui désigne ici la conduite ou la manière de vivre.
- source_word: לֹא נִסְתְּרוּ מִלְּפָנַי
  choice: elles ne me sont pas cachées
  rationale: Respecte le passif et l’accord pluriel avec « voies », tout en rendant naturellement l’idée hébraïque « loin de/devant ma face ».
- source_word: וְלֹא נִצְפַּן
  choice: n’est pas dissimulée
  rationale: Préserve le passif singulier et le champ sémantique de ce qui est soustrait au regard.
- source_word: עֲוֺנָם
  choice: leur faute
  rationale: Le terme peut désigner la perversité commise ou la culpabilité qui en résulte. « Faute » garde cette amplitude mieux que « iniquité », plus soutenu en français moderne.
- source_word: מִנֶּגֶד עֵינָי
  choice: à mes yeux
  rationale: Expression française naturelle qui conserve explicitement l’image du regard, sans reproduire lourdement l’expression spatiale hébraïque.
theological_decisions:
- issue: Langage anthropomorphique concernant la connaissance divine
  choice: Conserver l’image des yeux de Dieu fixés sur leurs voies.
  alternative: Paraphraser par « je vois tout ce qu’ils font » ou « rien ne m’échappe ».
  rationale: L’image concrète exprime la connaissance et l’examen moral divins sans les remplacer par une formulation théologique abstraite.
- issue: Sens de עָוֹן
  choice: leur faute
  alternative: leur iniquité ; leur culpabilité
  rationale: Le contexte permet aussi bien la faute morale que la culpabilité qui s’y attache. Le choix retenu préserve cette tension, et une note signale l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux propositions parallèles et l’image répétée du regard sont conservées, tandis que les tournures hébraïques trop raides sont rendues idiomatiquement.
