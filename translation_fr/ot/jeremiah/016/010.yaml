id: JER.16.10
reference: Jeremiah 16:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י תַגִּיד֙ לָ/עָ֣ם הַ/זֶּ֔ה אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמְר֣וּ אֵלֶ֗י/ךָ עַל מֶה֩ דִבֶּ֨ר יְהוָ֤ה עָלֵ֨י/נוּ֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את וּ/מֶ֤ה עֲוֺנֵ֨/נוּ֙ וּ/מֶ֣ה חַטָּאתֵ֔/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/010.yaml
  text: And when you tell this people all these words[a], and they say to you, ‘Why has Yahweh spoken against us all this great disaster? And what is our iniquity, and what is our sin that we have sinned against Yahweh our God?’
translation:
  language: fr
  text: 'Quand tu annonceras à ce peuple toutes ces paroles, ils te demanderont : « Pourquoi Yahweh a-t-il annoncé contre nous toute cette grande calamité[a] ? Quelle est notre faute, et quel est le péché que nous avons commis contre Yahweh notre Dieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce grand malheur ». Le mot hébreu peut aussi signifier « mal », mais il désigne ici le malheur ou le jugement qui va frapper le peuple, et non un mal moral en Yahweh.
    reason: Alternative lexicale et clarification contextuelle de רָעָה.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette tournure introduit une situation future envisagée. « Quand » en restitue naturellement la valeur temporelle en français.
- source_word: תַגִּיד
  choice: tu annonceras
  rationale: Le hifil de נגד signifie ici faire connaître ou communiquer. « Annoncer » convient au contexte de proclamation prophétique.
- source_word: לָעָם הַזֶּה
  choice: à ce peuple
  rationale: Le singulier collectif עָם et le démonstratif sont conservés dans l’expression prophétique naturelle « ce peuple ».
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: Dans ce discours prophétique, דְּבָרִים désigne le message communiqué. « Paroles » en préserve le caractère verbal.
- source_word: דִבֶּר יְהוָה עָלֵינוּ
  choice: Yahweh a-t-il annoncé contre nous
  rationale: Dans ce contexte de jugement, דבר avec עַל désigne une déclaration prononcée contre le peuple. « Annoncé contre nous » reste clair et naturel.
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: un malheur aussi grand
  rationale: רָעָה désigne ici une calamité annoncée comme jugement, non le mal moral. La formulation française exprime naturellement l’intensité portée par l’ensemble des déterminants hébreux.
- source_word: עֲוֺנֵנוּ
  choice: notre faute
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. « Faute » conserve ici la portée morale tout en restant compréhensible et distinct du terme suivant.
- source_word: חַטָּאתֵנוּ אֲשֶׁר חָטָאנוּ
  choice: quel est le péché que nous avons commis
  rationale: « Péché » rend חַטָּאת, tandis que « commis » permet une formulation française naturelle sans reproduire lourdement la répétition étymologique de חטא.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: contre Yahweh notre Dieu
  rationale: Avec le verbe « pécher », la préposition לְ exprime idiomatiquement en français l’offense dirigée « contre » Dieu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme, nom personnel du Dieu d’Israël. La translittération « Yahweh » le distingue d’un simple titre.
- issue: Sens de רָעָה dans une annonce de jugement
  choice: malheur
  alternative: mal
  rationale: Le contexte parle d’une calamité frappant le peuple. « Malheur » évite de suggérer que le texte attribuerait à Yahweh un mal moral, sans effacer la gravité du jugement annoncé.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe interrogative reste directe, et la distinction entre « faute » et « péché » préserve autant que possible les deux termes hébreux.
