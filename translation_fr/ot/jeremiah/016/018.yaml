source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֣י רִֽאשׁוֹנָ֗ה מִשְׁנֵ֤ה עֲוֺנָ/ם֙ וְ/חַטָּאתָ֔/ם עַ֖ל חַלְּלָ֣/ם אֶת אַרְצִ֑/י בְּ/נִבְלַ֤ת שִׁקּֽוּצֵי/הֶם֙ וְ/תוֹעֲב֣וֹתֵי/הֶ֔ם מָלְא֖וּ אֶת נַחֲלָתִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/018.yaml
  text: And first I will repay double their iniquity and their sin[a], because they have defiled my land with the carcasses of their detestable idols and have filled my inheritance with their abominations.
translation:
  language: fr
  text: Je leur ferai d’abord payer le double de leur faute et de leur péché, parce qu’ils ont souillé ma terre avec les cadavres de leurs idoles répugnantes[a] et qu’ils ont rempli mon héritage de leurs abominations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cadavres de leurs choses abominables » ; dans les textes prophétiques, le terme hébreu désigne souvent des idoles.
    reason: Alternative lexicale préservant une expression plus littérale pour le terme rendu par « idoles répugnantes ».
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Je leur ferai payer
  rationale: Le piel de שלם exprime ici l’idée de rétribution. Cette tournure française naturelle conserve la portée judiciaire du verbe.
- source_word: רִאשׁוֹנָה
  choice: d’abord
  rationale: L’adverbe marque vraisemblablement la priorité de la rétribution; « d’abord » est idiomatique et laisse attendre la suite annoncée dans le contexte.
- source_word: מִשְׁנֵה
  choice: au double
  rationale: Le terme désigne une quantité double. « Au double » préserve la formulation concise et forte de l’hébreu.
- source_word: עֲוֺנָם וְחַטָּאתָם
  choice: leur faute et leur péché
  rationale: « Faute » peut porter la dimension de culpabilité de עָוֹן, tandis que « péché » distingue חַטָּאת sans effacer le parallélisme au singulier collectif.
- source_word: עַל
  choice: parce que
  rationale: La préposition introduit ici la raison de la rétribution.
- source_word: חַלְּלָם אֶת־אַרְצִי
  choice: ils ont souillé mon pays
  rationale: חלל évoque la profanation et la contamination religieuse ou morale. « Souillé » convient à l’image de pollution du territoire et reste immédiatement compréhensible.
- source_word: בְּנִבְלַת שִׁקּוּצֵיהֶם
  choice: avec les cadavres de leurs idoles répugnantes
  rationale: נִבְלָה désigne un cadavre ou une carcasse; שִׁקּוּצִים renvoie souvent, dans le discours prophétique, aux idoles. « Répugnantes » maintient la forte aversion du terme.
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: leurs abominations
  rationale: Le mot peut désigner des objets ou des pratiques religieuses abhorrés. « Abominations » conserve sa force et son caractère général.
- source_word: מָלְאוּ אֶת־נַחֲלָתִי
  choice: ils ont rempli mon héritage
  rationale: נַחֲלָה présente le pays comme la possession attribuée à Dieu. « Mon héritage » en conserve la résonance territoriale et relationnelle.
theological_decisions:
- issue: Explicitation du référent de שִׁקּוּצֵיהֶם
  choice: « leurs idoles répugnantes » dans le texte
  alternative: « leurs choses répugnantes » ou « leurs objets abominables »
  rationale: Dans le contexte polémique de Jérémie, le terme vise couramment des objets idolâtres. L’explicitation aide le lecteur moderne sans imposer une doctrine supplémentaire; la formulation plus littérale est signalée en note.
- issue: Rapport entre la faute et la rétribution double
  choice: « payer au double leur faute et leur péché »
  alternative: « leur rendre au double leur faute et leur péché »
  rationale: La formulation retenue exprime une rétribution proportionnée et conserve la tension du texte, sans expliquer pourquoi elle est dite double.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé, ainsi que les images fortes du paiement au double, des cadavres et de l’héritage.
