  revision_rationale: La révision se limite à une correction idiomatique de l’expression de la rétribution (« le double de ») et au choix de « ma terre », plus proche de l’image hébraïque. Elle conserve l’ordre, l’intensité et les ambiguïtés pertinentes du texte source, ainsi que l’ancrage et la fonction de la note.
