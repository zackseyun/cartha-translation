  source_fidelity: 'Le projet rend correctement la séquence du texte hébreu : rétribution annoncée en priorité, au double, puis motif de la profanation de la terre et du remplissage de l’héritage divin. « Idoles » est une explicitation contextuellement défendable de שִׁקּוּצִים, et la note conserve l’alternative plus littérale. La formulation de la rétribution doit toutefois être ajustée : « faire payer au double leur faute » est moins idiomatique et peut laisser entendre que la faute elle-même est l’objet d’un prix, plutôt que la sanction correspondant à cette faute.'
  naturalness: « Je leur ferai d’abord payer le double de leur faute et de leur péché » est naturel en français moderne et exprime sans détour la rétribution double. « Ma terre » est plus direct et plus proche de l’imagerie territoriale et cultuelle de אַרְצִי que « mon pays », sans perdre l’accessibilité internationale.
  terminology: « Faute » et « péché » préservent utilement la distinction entre עָוֹן et חַטָּאת. « Souillé », « idoles répugnantes », « abominations » et « mon héritage » conviennent au registre prophétique. La note emploie « choses abominables », expression française plus naturelle que « choses répugnantes » dans ce contexte, tout en gardant l’alternative lexicale.
  issues:
