revisions:
- from: Je leur ferai d’abord payer au double leur faute et leur péché, parce qu’ils ont souillé mon pays avec les cadavres de leurs idoles répugnantes[a] et qu’ils ont rempli mon héritage de leurs abominations.
  to: Je leur ferai d’abord payer le double de leur faute et de leur péché, parce qu’ils ont souillé ma terre avec les cadavres de leurs idoles répugnantes[a] et qu’ils ont rempli mon héritage de leurs abominations.
  rationale: La révision se limite à une correction idiomatique de l’expression de la rétribution (« le double de ») et au choix de « ma terre », plus proche de l’image hébraïque. Elle conserve l’ordre, l’intensité et les ambiguïtés pertinentes du texte source, ainsi que l’ancrage et la fonction de la note.
