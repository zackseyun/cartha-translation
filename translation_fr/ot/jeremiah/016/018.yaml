    issue: 'Tour de la rétribution : « payer au double leur faute »'
    rationale: Le français usuel dit « payer le double de [quelque chose] » ou « payer double pour [une faute] ». L’ajout de « le double de » rend explicitement et naturellement la valeur de מִשְׁנֶה sans modifier le sens.
  - severity: low
    issue: « mon pays » pour אַרְצִי
    rationale: « Ma terre » reflète plus directement la terre appartenant à Dieu dans l’imagerie de Jérémie et évite une nuance moderne de pays politique ou national.
