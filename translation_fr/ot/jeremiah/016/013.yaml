base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/013.yaml
  text: So I will cast you out from this land onto a land that neither you nor your fathers have known[a], and there you will serve other gods day and night[d][c][b], for I will show you no favor.
translation:
  language: fr
  text: Je vous jetterai donc hors de ce pays[a], dans un pays que ni vous ni vos pères[b] n’avez connu. Là, vous servirez[c] d’autres dieux jour et nuit, car je ne vous accorderai aucune faveur[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est énergique : il peut évoquer le fait de jeter ou de projeter quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « vos ancêtres ». Littéralement : « vos pères ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « adorerez ». Le verbe hébreu signifie « servir » et peut désigner le service cultuel rendu à un dieu.
    reason: lexical_alternative
  - marker: d
    text: Ou « aucune grâce ». Le nom hébreu désigne une faveur accordée avec bienveillance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: Je vous jetterai … hors de
  rationale: Le hifil de טול exprime ici une expulsion énergique, comme le fait de jeter quelqu’un au loin. Cette formulation française conserve cette force tout en indiquant clairement l’arrachement au pays.
- source_word: מֵעַל הָאָרֶץ הַזֹּאת עַל הָאָרֶץ
  choice: hors de ce pays, dans un pays
  rationale: « Pays » convient au cadre territorial. « Hors de … dans » rend naturellement en français le mouvement exprimé par les deux prépositions hébraïques, sans l’artificiel « sur un pays ».
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם אַתֶּם וַאֲבוֹתֵיכֶם
  choice: que ni vous ni vos pères n’avez connu
  rationale: La tournure « ni… ni » communique clairement la négation portant sur les destinataires et leurs pères. Le verbe ידע garde son sens simple de « connaître ».
- source_word: וַעֲבַדְתֶּם שָׁם אֶת אֱלֹהִים אֲחֵרִים
  choice: Là, vous servirez d’autres dieux
  rationale: « Servir » conserve l’étendue sémantique de עבד et laisse subsister la tension entre service cultuel, assimilation et contrainte en exil.
- source_word: יוֹמָם וָלַיְלָה
  choice: jour et nuit
  rationale: La locution française correspond directement à l’expression hébraïque et suggère une activité continuelle.
- source_word: אֲשֶׁר לֹא אֶתֵּן לָכֶם חֲנִינָה
  choice: car je ne vous accorderai aucune faveur
  rationale: Le dernier אֲשֶׁר est compris comme causal dans le contexte. « Faveur » rend חֲנִינָה sans lui imposer un sens théologique technique, et « accorder » donne une formulation française naturelle.
theological_decisions:
- issue: Portée de וַאֲבוֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: « Pères » suit le terme masculin explicite du texte hébreu; une note signale que le mot peut désigner plus largement les ancêtres.
- issue: Nature du service rendu aux autres dieux
  choice: vous servirez d’autres dieux
  alternative: vous adorerez d’autres dieux
  rationale: « Servir » préserve l’ambiguïté du texte quant à un culte volontaire, une assimilation imposée ou les deux, alors qu’« adorer » préciserait davantage la nature de l’acte.
- issue: Lien de la dernière proposition avec ce qui précède
  choice: car je ne vous accorderai aucune faveur
  alternative: et je ne vous accorderai aucune faveur
  rationale: Dans ce contexte, אֲשֶׁר peut introduire la raison ou l’explication du sort décrit. « Car » exprime cette lecture tout en évitant de développer le rapport au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de l’hébreu, mais « dans un pays » remplace un calque peu naturel de la préposition. « Vos pères » conserve la formulation source, tandis que les notes présentent les principales nuances lexicales sans résoudre les ambiguïtés du texte.
