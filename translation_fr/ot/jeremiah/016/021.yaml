revisions:
- from: C’est pourquoi, voici, cette fois-ci, je vais leur faire connaître ma main et ma puissance, je vais les leur faire connaître, et ils sauront que mon nom est Yahvé.[a]
  to: 'C’est pourquoi, voici : je leur fais connaître — cette fois-ci, je leur ferai connaître ma main et ma puissance —, et ils sauront que mon nom est Yahvé.[a]'
  rationale: 'La révision rétablit la syntaxe et la répétition du texte hébreu : Dieu fait connaître quelque chose au peuple, puis annonce qu’il lui fera connaître sa main et sa puissance. Elle élimine la reprise pronominale française erronée, conserve l’image de la « main », le parallélisme avec « puissance » et le nom divin « Yahvé ».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'La draft inverse la relation syntaxique des deux occurrences causatives de ידע : la première a « eux » pour objet/participants (« je leur fais connaître »), tandis que la seconde introduit explicitement « ma main et ma puissance » comme contenu connu. « Je vais les leur faire connaître » fait au contraire de « ma main et ma puissance » l’antécédent de « les » et produit une construction qui ne correspond pas au texte hébreu.'
  naturalness: La reprise « je vais les leur faire connaître » est également lourde et ambiguë en français. La répétition « je leur fais connaître … je leur ferai connaître » est claire, naturelle dans un registre biblique actuel et rend l’insistance du participe suivi de l’imparfait consécutif.
  terminology: « Yahvé » est la transcription française usuelle de יהוה et « ma main et ma puissance » maintient utilement les deux images/termes distincts du texte source. La note sur la substitution traditionnelle par « le SEIGNEUR » est appropriée.
  issues:
  - severity: high
    issue: Inversion de l’objet et du complément dans la seconde expression « je vais les leur faire connaître ».
    rationale: En hébreu, les deux suffixes de מוֹדִיעָם / אוֹדִיעֵם désignent le peuple comme destinataire de l’action causative. « Ma main et ma puissance » sont le contenu explicitement introduit après la seconde forme verbale, non des réalités à faire connaître « à eux » par une reprise pronominale.
  - severity: medium
    issue: Valeur temporelle et emphatique insuffisamment distinguée entre les deux formes verbales.
    rationale: Le participe מוֹדִיעָם présente l’annonce en cours (« je leur fais connaître »), suivi de l’accompli à valeur future (« je leur ferai connaître »). La révision conserve cette progression sans imposer un contenu absent de la première occurrence.
  revised_text: 'C’est pourquoi, voici : je leur fais connaître — cette fois-ci, je leur ferai connaître ma main et ma puissance —, et ils sauront que mon nom est Yahvé.[a]'
  revised_footnotes:
  - marker: a
    text: 'Ou : « mon nom est le SEIGNEUR ». L’hébreu porte le nom divin YHWH, traditionnellement remplacé dans la lecture et dans de nombreuses traductions par « le SEIGNEUR ».'
    reason: alternative_reading
  revision_rationale: 'La révision rétablit la syntaxe et la répétition du texte hébreu : Dieu fait connaître quelque chose au peuple, puis annonce qu’il lui fera connaître sa main et sa puissance. Elle élimine la reprise pronominale française erronée, conserve l’image de la « main », le parallélisme avec « puissance » et le nom divin « Yahvé ».'
