  text: לָ/כֵן֙ הִנְ/נִ֣י מֽוֹדִיעָ֔/ם בַּ/פַּ֣עַם הַ/זֹּ֔את אוֹדִיעֵ֥/ם אֶת יָדִ֖/י וְ/אֶת גְּבֽוּרָתִ֑/י וְ/יָדְע֖וּ כִּֽי שְׁמִ֥/י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/021.yaml
  text: Therefore[a], behold, I am making them know—this time I will make them know my hand and my might[c][b], and they will know that my name is Yahweh.
translation:
  language: fr
  text: 'C’est pourquoi, voici : je leur fais connaître — cette fois-ci, je leur ferai connaître ma main et ma puissance —, et ils sauront que mon nom est Yahvé.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon nom est le SEIGNEUR ». L’hébreu porte le nom divin YHWH, traditionnellement remplacé dans la lecture et dans de nombreuses traductions par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée du contexte précédent.
- source_word: הִנְנִי
  choice: voici, je vais
  rationale: « Voici » conserve l’emphase de l’annonce divine; avec le participe causatif, « je vais » exprime une action imminente sans lourdeur.
- source_word: מוֹדִיעָם / אוֹדִיעֵם
  choice: je vais leur faire connaître… je vais les leur faire connaître
  rationale: Conserve la valeur causative de ידע et sa répétition emphatique. La reprise pronominale renvoie naturellement à « ma main et ma puissance » tout en maintenant les personnes comme destinataires.
- source_word: בַּפַּעַם הַזֹּאת
  choice: cette fois-ci
  rationale: Expression française naturelle qui garde l’insistance démonstrative de l’hébreu.
- source_word: יָדִי
  choice: ma main
  rationale: Préserve l’image hébraïque de la main comme manifestation active de la puissance.
- source_word: גְּבוּרָתִי
  choice: ma puissance
  rationale: Rend la force souveraine ou la puissance manifestée, sans confondre le terme avec l’image distincte de la main.
- source_word: וְיָדְעוּ
  choice: et ils sauront
  rationale: Conserve la coordination et le résultat futur exprimés en hébreu.
- source_word: שְׁמִי
  choice: mon nom
  rationale: Traduction directe qui maintient la portée de l’auto-identification divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française moderne et largement reconnue du tétragramme, plutôt que son remplacement par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; le transcrire préserve explicitement l’auto-identification formulée dans le verset.
- issue: Interprétation de « ma main »
  choice: Conserver « ma main »
  alternative: ma force
  rationale: La traduction littérale préserve l’image biblique et la distinction rhétorique entre la main et la puissance.
- issue: Objet de la seconde occurrence causative de ידע
  choice: « je vais les leur faire connaître », avec « ma main et ma puissance » comme objets repris
  alternative: « je vais le leur faire savoir », formulation impersonnelle
  rationale: La syntaxe hébraïque permet une certaine ambiguïté quant à l’objet; cette lecture rattache naturellement la seconde occurrence aux réalités nommées juste après la première, sans supprimer la répétition.
translation_notes:
  register: Français international actuel, digne et lisible. La répétition causative de « faire connaître » et l’image de la « main » sont maintenues, tout en évitant une tournure française artificielle.
