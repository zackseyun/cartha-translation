  to: Voici que j’envoie chercher de nombreux pêcheurs, déclare Yahweh, et ils les pêcheront. Après cela, j’enverrai chercher de nombreux chasseurs[a], et ils les traqueront sur toutes les montagnes, sur toutes les collines et dans les crevasses des rochers.
  rationale: La seule correction nécessaire remplace « ils les prendront » par « ils les pêcheront ». Cette formulation, inhabituelle mais intelligible dans une métaphore délibérément concrète, conserve le verbe de pêche et renforce le parallélisme avec « ils les traqueront ». Le reste du texte préserve adéquatement la portée exhaustive des montagnes, collines et crevasses sans identifier les personnes ni les agents au-delà de ce que dit le verset.
