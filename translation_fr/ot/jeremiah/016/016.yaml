id: JER.16.16
reference: Jeremiah 16:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁלֵ֜חַ ל/דוגים רַבִּ֛ים נְאֻם יְהוָ֖ה וְ/דִיג֑וּ/ם וְ/אַֽחֲרֵי כֵ֗ן אֶשְׁלַח֙ לְ/רַבִּ֣ים צַיָּדִ֔ים וְ/צָד֞וּ/ם מֵ/עַ֤ל כָּל הַר֙ וּ/מֵ/עַ֣ל כָּל גִּבְעָ֔ה וּ/מִ/נְּקִיקֵ֖י הַ/סְּלָעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/016.yaml
  text: Look[a], I am sending for many fishermen, declares Yahweh, and they will catch them; and after that I will send for many hunters[b], and they will hunt them from every mountain and from every hill and from the clefts of the rocks.
translation:
  language: fr
  text: Voici que j’envoie chercher de nombreux pêcheurs, déclare Yahweh, et ils les pêcheront. Après cela, j’enverrai chercher de nombreux chasseurs[a], et ils les traqueront sur toutes les montagnes, sur toutes les collines et dans les crevasses des rochers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les images des pêcheurs et des chasseurs représentent des personnes recherchées et saisies jusque dans toutes leurs cachettes. Le verset ne précise pas davantage qui sont les agents envoyés par Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici que je
  rationale: Introduit avec solennité et vivacité une annonce divine, dans un français moderne et digne.
- source_word: שֹׁלֵחַ
  choice: j’envoie chercher
  rationale: Le participe avec הִנְנִי présente l’action comme imminente ou déjà engagée; la préposition suivante indique ici la convocation d’agents.
- source_word: לְדוגים רַבִּים
  choice: de nombreux pêcheurs
  rationale: Conserve l’image concrète d’un grand nombre de personnes chargées de pêcher.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique avec solennité et conserve le nom divin explicite.
- source_word: וְדִיגוּם
  choice: et ils les prendront
  rationale: Exprime idiomatiquement le résultat de la pêche tout en conservant le pronom objet pluriel; « prendront » évite une tournure française artificielle.
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Marque clairement la succession entre les deux envois.
- source_word: אֶשְׁלַח לְרַבִּים צַיָּדִים
  choice: j’enverrai chercher de nombreux chasseurs
  rationale: Reproduit le parallélisme avec les pêcheurs et rend la convocation des agents.
- source_word: וְצָדוּם
  choice: et ils les traqueront
  rationale: Maintient explicitement l’image de la chasse et suggère la poursuite jusque dans les cachettes, sans ajouter l’idée de capture au-delà du verbe.
- source_word: מֵעַל כָּל הַר וּמֵעַל כָּל גִּבְעָה
  choice: sur toutes les montagnes, sur toutes les collines
  rationale: En français, avec « traquer », « sur » rend naturellement les lieux où les personnes sont recherchées; la répétition souligne l’étendue exhaustive.
- source_word: וּמִנְּקִיקֵי הַסְּלָעִים
  choice: et jusque dans les crevasses des rochers
  rationale: « Crevasses » rend concrètement les fissures servant de cachettes; « jusque dans » explicite naturellement en français la portée exhaustive de la poursuite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée métaphorique des pêcheurs et des chasseurs
  choice: Conserver les images concrètes et le pronom « les » sans identifier davantage les personnes visées ni les agents.
  alternative: Identifier explicitement les agents comme des envahisseurs ennemis ou interpréter l’action comme le rassemblement des exilés.
  rationale: Le verset décrit des personnes recherchées et saisies sans nommer explicitement les agents ni résoudre à lui seul la portée punitive ou restauratrice de l’image.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre pêcheurs et chasseurs est conservé; la syntaxe évite les calques artificiels tout en maintenant l’ambiguïté du pronom objet et de l’identité des agents.
