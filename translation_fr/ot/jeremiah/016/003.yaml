  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל הַ/בָּנִים֙ וְ/עַל הַ/בָּנ֔וֹת הַ/יִּלּוֹדִ֖ים בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/עַֽל אִמֹּתָ֞/ם הַ/יֹּלְד֣וֹת אוֹתָ֗/ם וְ/עַל אֲבוֹתָ֛/ם הַ/מּוֹלִדִ֥ים אוֹתָ֖/ם בָּ/אָ֥רֶץ הַ/זֹּֽאת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/003.yaml
  text: 'For thus says Yahweh concerning the sons and the daughters born in this place[a], and concerning their mothers who bear them[c][b], and their fathers who father them in this land:'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh au sujet des fils et des filles nés en ce lieu, de leurs mères qui les mettent au monde et de leurs pères qui les engendrent dans ce pays :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication divine qui justifie l’ordre donné au verset précédent.
- source_word: כֹה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Formule prophétique rendue dans un français actuel et digne, tout en conservant le nom divin.
- source_word: עַל
  choice: au sujet de
  rationale: La préposition introduit ici les personnes visées par la déclaration; la répétition hébraïque est rendue naturellement par « de » dans les éléments coordonnés suivants.
- source_word: הַבָּנִים וְהַבָּנוֹת
  choice: les fils et les filles
  rationale: Conserve la mention explicite des deux sexes au lieu de la réduire au terme générique « enfants ».
- source_word: הַיִּלּוֹדִים בַּמָּקוֹם הַזֶּה
  choice: nés en ce lieu
  rationale: Rend directement le participe passif et maintient la désignation solennelle du lieu.
- source_word: הַיֹּלְדוֹת אוֹתָם
  choice: qui les mettent au monde
  rationale: Expression française naturelle pour l’action des mères qui donnent naissance.
- source_word: הַמּוֹלִדִים אוֹתָם
  choice: qui les engendrent
  rationale: Préserve le rôle paternel exprimé par la forme causative de ילד sans employer une tournure excessivement archaïque.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire où vivent les personnes concernées; « pays » distingue naturellement cette expression de « ce lieu ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La cadence de l’oracle est conservée, avec une syntaxe fluide et sans archaïsmes inutiles.
