  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé[a] me fut adressée :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre forme : « Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Avec דְבַר ... אֵלַי, la forme narrative de היה introduit idiomatiquement la réception d’une parole divine. « Fut adressée » est naturel en français et restitue l’arrivée de la parole sans calquer lourdement « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: Dans la formule prophétique דְבַר יְהוָה, « la parole » conserve l’expression biblique consacrée et reste moins interprétative que « le message ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme un nom propre. « Yahvé » est la forme française courante, plutôt qu’une substitution par le titre « le SEIGNEUR ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom objet de « fut adressée » rend naturellement en français la préposition אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif לֵאמֹר introduit les paroles directes qui suivent. En français, les deux-points remplissent cette fonction plus naturellement que le calque « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre par « Yahvé » préserve son statut de nom personnel, tandis que la note signale la tradition qui lui substitue un titre.
translation_notes:
  register: Français moderne, sobre et digne. La formule « La parole de Yahvé me fut adressée » est idiomatique dans le registre prophétique sans être archaïque. Les deux-points annoncent directement le contenu du discours au verset suivant.
