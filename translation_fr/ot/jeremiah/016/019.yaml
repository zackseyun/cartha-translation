  timestamp: '2026-07-15T05:39:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : Yahweh est invoqué comme force, forteresse et refuge ; les nations viennent des régions les plus lointaines et reconnaissent l’inanité de l’héritage religieux de leurs pères. Une légère révision rend plus nettement la coordination hébraïque entre « mensonge », « vanité » et l’absence de profit.'
  naturalness: Le français est généralement naturel et poétique. Toutefois, la majuscule à « Depuis » au milieu de la phrase est fautive, et « de choses vaines qui ne servent à rien » peut faire de la proposition relative une simple qualification de « choses » plutôt que de rendre l’hébreu « en elles il n’y a rien d’utile ».
  terminology: « Yahweh », « ma force », « ma forteresse » et « mon refuge » sont appropriés. « Certes » rend plus naturellement l’emphase de אַךְ dans cet aveu que « Oui ». « Vanité » conserve utilement le singulier collectif et la densité du terme הֶבֶל, avec une note qui indique ses autres possibilités sans le réduire aux idoles.
  issues:
  - severity: low
    issue: Majuscule injustifiée à « Depuis ».
    rationale: 'Le syntagme « depuis les extrémités de la terre » poursuit la même proposition : « les nations viendront vers toi depuis… ». Il doit commencer par une minuscule.'
  - severity: low
    issue: Rendu de la conclusion hébraïque à resserrer.
    rationale: וְאֵין־בָּם מוֹעִיל signifie littéralement « et il n’y a en elles rien d’utile / de profitable ». « où il n’y a rien d’utile » exprime plus directement cette relation que « qui ne servent à rien ».
  - severity: low
    issue: « Oui » est un peu oral et sous-marque l’emphase confessionnelle.
    rationale: « Certes » est moderne, naturel dans ce registre solennel, et rend l’assertion emphatique de אַךְ sans transformer le terme en restriction pure.
