  to: 'Yahweh, ma force et ma forteresse,

    mon refuge au jour de la détresse,

    vers toi les nations viendront

    depuis les extrémités de la terre,

    et elles diront :

    « Certes, nos pères[a] n’ont hérité que du mensonge,

    de la vanité[b] où il n’y a rien d’utile. »'
  rationale: La révision corrige la ponctuation et la capitalisation, améliore le rendu idiomatique de l’emphase initiale du discours des nations, et reflète plus directement la formule finale « il n’y a en elles rien d’utile ». Elle conserve le parallélisme, les images protectrices distinctes et l’ambiguïté volontaire de הֶבֶל.
