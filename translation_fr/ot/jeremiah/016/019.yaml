id: JER.16.19
reference: Jeremiah 16:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֞ה עֻזִּ֧/י וּ/מָעֻזִּ֛/י וּ/מְנוּסִ֖/י בְּ/י֣וֹם צָרָ֑ה אֵלֶ֗י/ךָ גּוֹיִ֤ם יָבֹ֨אוּ֙ מֵֽ/אַפְסֵי אָ֔רֶץ וְ/יֹאמְר֗וּ אַךְ שֶׁ֨קֶר֙ נָחֲל֣וּ אֲבוֹתֵ֔י/נוּ הֶ֖בֶל וְ/אֵֽין בָּ֥/ם מוֹעִֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/019.yaml
  text: O Yahweh[a], my strength and my stronghold, my refuge in the day of distress, to you the nations will come from the ends of the earth and say, “Surely our fathers inherited only lies[b], worthless things in which there is no profit.”
translation:
  language: fr
  text: 'Yahweh, ma force et ma forteresse,

    mon refuge au jour de la détresse,

    vers toi les nations viendront

    depuis les extrémités de la terre,

    et elles diront :

    « Certes, nos pères[a] n’ont hérité que du mensonge,

    de la vanité[b] où il n’y a rien d’utile. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ».
    reason: Précise la portée ancestrale possible de l’hébreu אֲבוֹתֵינוּ tout en conservant « nos pères » dans le texte principal.
  - marker: b
    text: Le mot hébreu peut aussi être rendu par « choses vaines » ou « choses sans consistance » ; dans ce contexte, il peut évoquer des idoles futiles.
    reason: Signale l’étendue sémantique de הֶבֶל et son possible emploi appliqué aux idoles, sans imposer ce sens dans le texte.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé directement dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: עֻזִּי
  choice: ma force
  rationale: Rend naturellement le nom désignant la force ou la puissance dans cette adresse directe.
- source_word: מָעֻזִּי
  choice: ma forteresse
  rationale: Conserve l’image d’un lieu fortifié où l’on trouve la sécurité, tout en le distinguant du refuge mentionné ensuite.
- source_word: מְנוּסִי
  choice: mon refuge
  rationale: Exprime le lieu vers lequel on fuit pour être en sécurité.
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: Préserve la tournure temporelle hébraïque et la gravité de צָרָה.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Correspond au sens collectif international du terme sans imposer ici l’opposition théologique suggérée par « les païens ».
- source_word: מֵאַפְסֵי אָרֶץ
  choice: depuis les extrémités de la terre
  rationale: Rend l’expression idiomatique désignant les régions les plus lointaines.
- source_word: אַךְ
  choice: Oui
  rationale: Marque ici l’affirmation énergique introduisant l’aveu des nations, sans lui donner uniquement un sens restrictif.
- source_word: שֶׁקֶר
  choice: du mensonge
  rationale: Conserve le singulier collectif hébreu et désigne la fausseté transmise comme héritage.
- source_word: נָחֲלוּ
  choice: ont hérité
  rationale: Préserve le vocabulaire précis de l’héritage et l’ironie d’une tradition ancestrale reçue.
- source_word: אֲבוֹתֵינוּ
  choice: nos pères
  rationale: Suit la forme masculine du texte tout en laissant entendre, comme en hébreu, les générations ancestrales.
- source_word: הֶבֶל
  choice: de choses vaines
  rationale: Exprime l’inconsistance, la vacuité et l’inutilité du terme sans le réduire explicitement aux idoles.
- source_word: וְאֵין בָּם מוֹעִיל
  choice: qui ne servent à rien
  rationale: Formulation française naturelle qui garde l’idée qu’aucun profit ni avantage ne se trouve en ces choses.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le représente directement et évite de le remplacer silencieusement par un titre.
- issue: Référent de הֶבֶל
  choice: de choses vaines
  alternative: des idoles
  rationale: Le contexte peut viser les idoles et la fausse religion héritée, mais le mot hébreu évoque plus largement ce qui est vain, inconsistant et futile. Le rendu principal conserve cette portée sans expliciter davantage que le texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme poétique est maintenu par la disposition en lignes. « Forteresse » et « refuge » préservent les deux images protectrices distinctes ; « qui ne servent à rien » rend idiomatiquement la conclusion hébraïque.
