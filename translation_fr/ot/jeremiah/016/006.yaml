source:
  edition: WLC
  text: וּ/מֵ֨תוּ גְדֹלִ֧ים וּ/קְטַנִּ֛ים בָּ/אָ֥רֶץ הַ/זֹּ֖את לֹ֣א יִקָּבֵ֑רוּ וְ/לֹֽא יִסְפְּד֣וּ לָ/הֶ֔ם וְ/לֹ֣א יִתְגֹּדַ֔ד וְ/לֹ֥א יִקָּרֵ֖חַ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/006.yaml
  text: Both great and small will die in this land[a]. They will not be buried, and no one will mourn for them, or cut himself[b], or make himself bald for them.
translation:
  language: fr
  text: Grands et petits mourront dans ce pays. Ils ne seront pas enterrés, et personne ne se lamentera pour eux, ne se fera d’entailles[a] ni ne se rasera la tête pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ces entailles, comme le rasage de la tête, faisaient partie de certaines pratiques de deuil pour les morts.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵתוּ
  choice: mourront
  rationale: Dans ce contexte prophétique, le parfait précédé de la conjonction annonce un événement futur. « Mourront » rend simplement le sens de מות.
- source_word: גְדֹלִים וּקְטַנִּים
  choice: Grands et petits
  rationale: Cette paire inclusive désigne les personnes de tout rang ou de toute condition, sans imposer une seule nuance telle que l’âge.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: Ici, אֶרֶץ désigne le territoire où s’accomplira le jugement. « Pays » est naturel en français moderne et conserve la portée géographique.
- source_word: לֹא יִקָּבֵרוּ
  choice: Ils ne seront pas enterrés
  rationale: Le niphal exprime clairement le passif; « être enterré » est courant, digne et précis.
- source_word: וְלֹא יִסְפְּדוּ לָהֶם
  choice: et personne ne prendra le deuil pour eux
  rationale: Le verbe pluriel à sujet indéfini peut être rendu naturellement par « personne ». ספד évoque ici les manifestations ou rites de deuil, davantage que la seule tristesse intérieure.
- source_word: וְלֹא יִתְגֹּדַד
  choice: ne se fera d’entailles
  rationale: La forme réfléchie renvoie aux incisions pratiquées sur soi comme rite funéraire. Le singulier collectif français après « personne » restitue naturellement le sujet indéfini.
- source_word: וְלֹא יִקָּרֵחַ לָהֶם
  choice: ni ne se rasera la tête pour eux
  rationale: Le verbe dérivé de קרח désigne le fait de se rendre chauve comme signe de deuil. Cette formulation française explicite l’acte sans remplacer le rite concret par une généralité.
theological_decisions:
- issue: Maintien de la spécificité des rites funéraires
  choice: Nommer dans le texte les entailles et le rasage de la tête
  alternative: Employer une formule générale telle que « accomplir des rites de deuil »
  rationale: L’hébreu énumère des gestes corporels précis. Les conserver maintient la force de l’oracle de jugement sans les atténuer ni leur attribuer une valeur doctrinale supplémentaire.
- issue: Portée de גְדֹלִים וּקְטַנִּים
  choice: « Grands et petits » sans préciser s’il s’agit du rang, de l’âge ou de la condition
  alternative: « Jeunes et vieux » ou « puissants et humbles »
  rationale: La paire peut fonctionner comme un mérisme inclusif. Une traduction littérale et idiomatique préserve cette amplitude.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination a été adaptée au sujet indéfini « personne » afin d’éviter des pronoms genrés et de rendre naturellement les verbes hébreux à sujet indéfini.
