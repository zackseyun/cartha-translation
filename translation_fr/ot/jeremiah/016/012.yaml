source:
  edition: WLC
  text: וְ/אַתֶּ֛ם הֲרֵעֹתֶ֥ם לַ/עֲשׂ֖וֹת מֵ/אֲבֽוֹתֵי/כֶ֑ם וְ/הִנְּ/כֶ֣ם הֹלְכִ֗ים אִ֚ישׁ אַֽחֲרֵי֙ שְׁרִר֣וּת לִבּֽ/וֹ הָ/רָ֔ע לְ/בִלְתִּ֖י שְׁמֹ֥עַ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/012.yaml
  text: But you have done worse than your fathers[a], and look, each of you is walking after the stubbornness of his evil heart[c][b], refusing to listen to me.
translation:
  language: fr
  text: Mais vous, vous avez fait pire que vos pères[a]. Et voici que chacun de vous[b] suit l’obstination de son cœur mauvais[c], refusant de m’écouter[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos ancêtres ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « chaque homme »; l’expression est employée distributivement pour l’ensemble du peuple.
    reason: lexical_alternative
  - marker: c
    text: Ou « la volonté obstinée de son cœur mauvais »; le terme hébreu évoque une disposition intérieure opiniâtre.
    reason: lexical_alternative
  - marker: d
    text: Ou « afin de ne pas m’écouter » ou « sans m’écouter ».
    reason: source_ambiguity
lexical_decisions:
- source_word: הֲרֵעֹתֶם לַעֲשׂוֹת
  choice: vous avez fait pire
  rationale: Cette tournure française naturelle rend la valeur comparative de la forme verbale suivie de מִן, tout en conservant clairement le jugement moral.
- source_word: מֵאֲבוֹתֵיכֶם
  choice: que vos pères
  rationale: « Pères » conserve l’image familiale et la formulation genrée de l’hébreu; dans le contexte, le terme désigne les générations antérieures.
- source_word: וְהִנְכֶם
  choice: Et voici que
  rationale: Cette formule attire l’attention sur la conduite présente du peuple, avec un registre digne mais encore courant.
- source_word: הֹלְכִים אִישׁ אַחֲרֵי
  choice: chacun de vous suit
  rationale: Le participe décrit une conduite continue; « suit » rend naturellement en français l’expression métaphorique « marcher derrière », tandis que « chacun de vous » restitue l’emploi distributif de אִישׁ.
- source_word: שְׁרִרוּת
  choice: l’obstination
  rationale: Dans Jérémie, le nom évoque une volonté intérieure opiniâtre et rebelle. « Obstination » est clair et conserve cette nuance morale.
- source_word: לִבּוֹ הָרָע
  choice: son cœur mauvais
  rationale: La formulation garde le cœur comme centre de la volonté et de la pensée, ainsi que l’évaluation morale explicite portée par רַע.
- source_word: לְבִלְתִּי שְׁמֹעַ אֵלָי
  choice: refusant de m’écouter
  rationale: La tournure exprime naturellement la non-écoute volontaire impliquée par le contexte, sans réduire שׁמע à la simple perception auditive.
theological_decisions:
- issue: Portée du masculin singulier distributif אִישׁ
  choice: chacun de vous
  alternative: chaque homme
  rationale: Le mot individualise les membres de tout le peuple interpellé, sans limiter nécessairement l’énoncé aux hommes. La traduction conserve à la fois l’adresse collective et la responsabilité individuelle.
- issue: Désignation des générations antérieures par אָבוֹת
  choice: vos pères
  alternative: vos ancêtres
  rationale: « Pères » préserve la texture familiale et masculine du texte hébreu; une note explicite que le mot peut désigner plus largement les ancêtres.
- issue: Rapport logique de לְבִלְתִּי avec la conduite décrite
  choice: refusant de m’écouter
  alternative: afin de ne pas m’écouter
  rationale: Le contexte présente une désobéissance volontaire, mais la construction hébraïque peut aussi être comprise plus formellement comme un but ou un résultat négatif; cette possibilité est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise « Mais vous, vous » marque le contraste emphatique avec les générations précédentes. Le texte privilégie la clarté de « suit » plutôt que le calque peu naturel « marche derrière », tout en conservant en note les principales ambiguïtés lexicales et syntaxiques.
