  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מַשְׁבִּ֜ית מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה לְ/עֵינֵי/כֶ֖ם וּ/בִֽ/ימֵי/כֶ֑ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֥וֹל כַּלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/009.yaml
  text: 'For thus says Yahweh of Armies[a], the God of Israel: Behold, I am about to put an end, from this place before your eyes and in your days, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahvé des armées[a], le Dieu d’Israël : « Voici que je vais faire disparaître de ce lieu, sous vos yeux et de votre vivant, les cris de joie et les cris d’allégresse, la voix du jeune marié et la voix de la jeune mariée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le Seigneur des armées » ; certaines traductions françaises portent « l’Éternel des armées ».'
    reason: Signale les principales formulations traditionnelles du nom et du titre divins sans les introduire dans le texte principal.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: « Yahvé » représente directement le nom divin, tandis que « des armées » conserve le sens concret de צְבָאוֹת. La note signale la formulation française traditionnelle.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et naturelle de la construction hébraïque.
- source_word: הִנְנִי מַשְׁבִּית
  choice: Voici que je vais faire disparaître
  rationale: « Voici que » garde la valeur d’annonce de הִנְנִי ; « je vais » exprime l’imminence portée par la construction avec le participe, et « faire disparaître » conserve la valeur causative de מַשְׁבִּית dans ce contexte.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: de ce lieu
  rationale: La préposition מִן indique ici que ces manifestations de fête seront retirées de l’endroit visé.
- source_word: לְעֵינֵיכֶם וּבִימֵיכֶם
  choice: sous vos yeux et de votre vivant
  rationale: « Sous vos yeux » exprime le caractère public et observable de l’événement ; « de votre vivant » communique naturellement que celui-ci surviendra durant la vie des destinataires.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: les cris de joie et les cris d’allégresse
  rationale: קוֹל désigne ici les manifestations audibles de la fête. La répétition de « cris » reflète celle de קוֹל, et deux termes distincts rendent les deux noms hébreux apparentés.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: la voix du jeune marié et la voix de la jeune mariée
  rationale: Avec des personnes, « voix » rend naturellement קוֹל. « Jeune marié » et « jeune mariée » désignent clairement les deux protagonistes des noces, sans supposer leur âge.
theological_decisions:
- issue: Traduction du titre divin יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  alternative: le Seigneur des armées / l’Éternel des armées
  rationale: Le texte hébreu emploie explicitement le nom divin. « Yahvé » le représente plutôt que de le remplacer par un titre, tandis que la note préserve l’accès à la formulation française traditionnelle.
translation_notes:
  register: Français international actuel, solennel mais accessible. Le parallélisme et la répétition de קוֹל sont maintenus autant que le permet un français naturel.
