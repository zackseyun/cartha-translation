  text: וּ/בֵית מִשְׁתֶּ֥ה לֹא תָב֖וֹא לָ/שֶׁ֣בֶת אוֹתָ֑/ם לֶ/אֱכֹ֖ל וְ/לִ/שְׁתּֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/008.yaml
  text: And you shall not enter a house of feasting to sit with them[a], to eat and to drink.
translation:
  language: fr
  text: Tu n’entreras pas non plus dans une maison où l’on festoie[a] pour t’asseoir avec eux, manger et boire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une maison de banquet » ou « dans une maison où l’on fait la fête ». L’expression hébraïque désigne un lieu où l’on se rassemble pour manger et boire dans une ambiance festive.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית מִשְׁתֶּה
  choice: dans une maison où l’on festoie
  rationale: Cette formulation conserve l’image concrète de la « maison » tout en exprimant naturellement en français le lieu caractérisé par un repas festif. וּ est rendu par « non plus » pour marquer la continuité avec les interdictions précédentes.
- source_word: לֹא תָבוֹא
  choice: tu n’entreras pas
  rationale: L’imparfait hébreu à valeur prohibitive est rendu par un futur de défense, au ton solennel et naturel dans ce contexte prophétique.
- source_word: לָשֶׁבֶת
  choice: pour t’asseoir
  rationale: L’infinitif indique ici le but de l’entrée; dans le contexte d’un repas, ישׁב signifie prendre place avec les convives.
- source_word: אוֹתָם
  choice: avec eux
  rationale: Après « s’asseoir », le marqueur avec suffixe exprime idiomatiquement l’association aux personnes présentes; « avec eux » restitue cette participation sociale.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: manger et boire
  rationale: Les deux infinitifs coordonnés sont conservés et dépendent naturellement de « pour », sans qu’il soit nécessaire de répéter cette préposition en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Maison où l’on festoie » préserve l’image hébraïque sans employer le calque peu naturel « maison de festin ». Le tutoiement singulier correspond à la deuxième personne masculine du texte source.
