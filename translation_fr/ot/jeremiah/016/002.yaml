  text: לֹֽא תִקַּ֥ח לְ/ךָ֖ אִשָּׁ֑ה וְ/לֹֽא יִהְי֤וּ לְ/ךָ֙ בָּנִ֣ים וּ/בָנ֔וֹת בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/002.yaml
  text: You shall not take a wife for yourself[a], nor shall you have sons or daughters in this place.
translation:
  language: fr
  text: Tu ne prendras pas femme[a] et tu n’auras ni fils ni filles dans ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus dynamique : « Tu ne te marieras pas et tu n’auras ni fils ni filles dans ce lieu. »'
    reason: Alternative lexicale rendant explicitement le sens matrimonial de l’idiome hébreu « prendre une femme ».
lexical_decisions:
- source_word: תִקַּח לְךָ אִשָּׁה
  choice: tu ne prendras pas de femme
  rationale: La tournure « prendre femme » restitue directement l’idiome hébreu לקח אשה dans son sens matrimonial. Elle conserve la solennité de l’interdiction tout en restant compréhensible en français moderne.
- source_word: וְלֹא יִהְיוּ לְךָ
  choice: et tu n’auras
  rationale: La construction היה avec לְ exprime ici la possession ou l’existence par rapport à Jérémie. « Tu n’auras » est la formulation française naturelle, sans transformer l’interdiction en simple prédiction.
- source_word: בָּנִים וּבָנוֹת
  choice: ni fils ni filles
  rationale: L’hébreu nomme explicitement les descendants des deux sexes. Après une négation, la corrélation française « ni… ni… » rend naturellement cette totalité.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: dans ce lieu
  rationale: מָקוֹם désigne fondamentalement un lieu. « Dans ce lieu » préserve la référence déictique sans l’élargir indûment à tout le pays.
theological_decisions:
- issue: Portée de l’interdiction adressée à Jérémie
  choice: Une interdiction divine directe faite à Jérémie de se marier et d’avoir des enfants dans le lieu concerné.
  alternative: Une simple annonce selon laquelle Jérémie restera célibataire et sans enfants, ou une interdiction explicitement étendue à tout le pays.
  rationale: Les formes à la deuxième personne du masculin singulier et la négation employée ont une valeur prohibitive. La traduction conserve « ce lieu » afin de ne pas élargir la portée géographique du texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Prendre femme » est légèrement soutenu mais clair; la note fournit une formulation plus courante. Le tutoiement correspond à l’adresse divine directe à Jérémie.
