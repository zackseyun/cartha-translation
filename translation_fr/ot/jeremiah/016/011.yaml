- from: 'Tu leur diras : « C’est parce que vos pères m’ont abandonné, déclare l’Éternel, qu’ils sont allés après d’autres dieux, les ont servis et se sont prosternés devant eux. Moi, ils m’ont abandonné, et ils n’ont pas observé ma loi. »'
  to: 'Tu leur diras : « Parce que vos pères m’ont abandonné — déclaration de l’Éternel —, ont suivi d’autres dieux, les ont servis et se sont prosternés devant eux ; et que moi, ils m’ont abandonné et n’ont pas observé ma loi. »'
  rationale: La révision corrige la relation syntaxique entre les propositions tout en préservant la série accusatrice, le contraste emphatique avec YHWH et le vocabulaire théologique du projet. Aucun renvoi de note n’est requis.
