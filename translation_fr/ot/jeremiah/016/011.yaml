  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם עַל֩ אֲשֶׁר עָזְב֨וּ אֲבוֹתֵי/כֶ֤ם אוֹתִ/י֙ נְאֻם יְהוָ֔ה וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יַּעַבְד֖וּ/ם וַ/יִּשְׁתַּחֲו֣וּ לָ/הֶ֑ם וְ/אֹתִ֣/י עָזָ֔בוּ וְ/אֶת תּוֹרָתִ֖/י לֹ֥א שָׁמָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/011.yaml
  text: Then you shall say to them, ‘Because your fathers abandoned me,’ declares the LORD, ‘and went after other gods, and served them, and bowed down to them. But me they abandoned, and my law they did not keep.’
translation:
  language: fr
  text: 'Tu leur diras : « Parce que vos pères m’ont abandonné — déclaration de l’Éternel —, ont suivi d’autres dieux, les ont servis et se sont prosternés devant eux ; et que moi, ils m’ont abandonné et n’ont pas observé ma loi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Rend directement le terme hébreu désignant les ancêtres, tout en conservant la formulation biblique naturelle en français.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Convention française traditionnelle et immédiatement reconnaissable pour le tétragramme, sans introduire une vocalisation incertaine dans le corps du texte.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: ils sont allés après
  rationale: Préserve l’image hébraïque du fait de suivre d’autres dieux plutôt que de la réduire à une simple adhésion intellectuelle.
- source_word: וַיַּעַבְדוּם
  choice: les ont servis
  rationale: Exprime le service cultuel rendu aux autres dieux et maintient la série verbale de l’original.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: se sont prosternés devant eux
  rationale: Rend concrètement le geste d’hommage ou d’adoration exprimé par le verbe hébreu.
- source_word: תּוֹרָתִי
  choice: ma loi
  rationale: Dans ce contexte, désigne l’instruction normative de Dieu; « ma loi » est clair, usuel et fidèle.
- source_word: לֹא שָׁמָרוּ
  choice: ils n’ont pas observé
  rationale: « Observer » rend naturellement l’idée de garder et mettre en pratique la loi.
theological_decisions:
- issue: Mise en relief de l’abandon de YHWH
  choice: « Moi, ils m’ont abandonné »
  alternative: « Ils m’ont abandonné »
  rationale: La dislocation avec « Moi » conserve l’emphase de וְאֹתִי placé en tête, ainsi que le contraste entre les autres dieux honorés et YHWH abandonné.
- issue: Lien causal introduit par עַל אֲשֶׁר
  choice: « C’est parce que… que… »
  alternative: « Parce que vos pères… »
  rationale: Cette structure française rend explicitement la réponse à la question implicite du contexte sans résoudre ni modifier le contenu théologique.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le parallélisme accusateur et l’emphase de l’hébreu, avec une ponctuation qui distingue la poursuite des autres dieux de l’abandon direct de Dieu et de sa loi.
