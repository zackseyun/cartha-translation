review_pass:
  verdict: revise
  source_fidelity: 'La structure causale de עַל אֲשֶׁר porte sur toute la série des actes attribués aux pères : abandonner YHWH, suivre d’autres dieux, les servir, se prosterner devant eux, puis abandonner YHWH et ne pas garder sa loi. Dans le projet, « C’est parce que… qu’ils sont allés » transforme grammaticalement le fait d’aller après d’autres dieux en conséquence de l’abandon, plutôt qu’en élément coordonné de la cause. La révision rétablit cette portée sans ajouter d’interprétation.'
  naturalness: « Aller après d’autres dieux » est intelligible mais peu idiomatique en français moderne hors d’un calque biblique. « Suivre d’autres dieux » est naturel et conserve l’image de l’hébreu. La réponse introduite simplement par « Parce que » convient au contexte interrogatif du verset précédent.
  terminology: « L’Éternel », « autres dieux », « se prosterner », « ma loi » et « observer » sont des rendus cohérents et fidèles. L’emphase de וְאֹתִי est conservée par « moi, ils m’ont abandonné ».
  issues:
  - severity: medium
    issue: Portée causale faussée par « C’est parce que… qu’ils sont allés »
    rationale: Cette construction subordonne les actes suivants à l’abandon initial, alors que le texte hébreu les coordonne tous sous « parce que ».
  - severity: low
    issue: « Ils sont allés après d’autres dieux » est un calque peu naturel
    rationale: « Ils ont suivi d’autres dieux » rend le même sens avec une formulation moderne plus fluide.
  revised_text: 'Tu leur diras : « Parce que vos pères m’ont abandonné — déclaration de l’Éternel —, ont suivi d’autres dieux, les ont servis et se sont prosternés devant eux ; et que moi, ils m’ont abandonné et n’ont pas observé ma loi. »'
