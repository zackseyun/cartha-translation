review_pass:
  verdict: revise
  source_fidelity: 'Le sens du texte hébreu est bien rendu : le contraste avec la formule de serment antérieure, le nom Yahweh, la sortie « du pays du nord » et de tous les autres pays, l’action divine de chasser puis de ramener, ainsi que le don de la terre aux pères sont conservés. « Dans leur pays » rend plus idiomatiquement le mouvement de retour exprimé par וַהֲשִׁבֹתִים עַל אַדְמָתָם, sans perdre la référence à leur terre propre.'
  naturalness: '« Je les ramènerai sur leur terre » est compréhensible, mais peu naturel en français contemporain après « ramener ». « Dans leur pays » est la formulation habituelle et claire. « Mais plutôt » explicite également la valeur corrective de כִּי אִם dans sa dépendance au v. 14 et évite que « mais : » paraisse abrupt dans un découpage isolé du verset.'
  terminology: « Yahweh », « Israélites », « pays du nord », « chassés » et « leurs pères » sont appropriés. La formule « Yahweh est vivant » préserve de façon sobre la formule de serment sans ajouter une interprétation confessionnelle.
  issues:
  - severity: low
    issue: Préposition avec « ramener »
    rationale: En français moderne, « ramener dans leur pays » est plus idiomatique que « ramener sur leur terre » dans ce contexte de retour territorial. Le changement ne modifie pas le sens de la terre donnée aux pères.
  - severity: low
    issue: Transition initiale abrupte
    rationale: '« Mais plutôt : » rend plus nettement la valeur contrastive de כִּי אִם, qui dépend de l’énoncé du verset précédent (« on ne dira plus... mais plutôt... »).'
  revised_text: 'mais plutôt : « Yahweh est vivant, lui qui a fait remonter les Israélites du pays du nord et de tous les pays où il les avait chassés. » Je les ramènerai dans leur pays, celui que j’ai donné à leurs pères.'
