  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֨ר הֶעֱלָ֜ה אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדִּיחָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִֽׁבֹתִי/ם֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבוֹתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/015.yaml
  text: but[a], ‘As Yahweh lives[b], who brought up the children of Israel from the land of the north and from all the lands where he had driven them.’ For I will bring them back to their own land that I gave to their fathers.
translation:
  language: fr
  text: 'mais plutôt : « Yahweh est vivant, lui qui a fait remonter les Israélites du pays du nord et de tous les pays où il les avait chassés. » Je les ramènerai dans leur pays, celui que j’ai donné à leurs pères.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: mais
  rationale: Dans la construction amorcée au verset 14, l’expression marque le contraste entre l’ancienne formule de serment et celle qui la remplacera. « Mais » restitue naturellement cette opposition.
- source_word: חַי יְהוָה
  choice: Yahweh est vivant
  rationale: Formule hébraïque de serment, rendue de manière idiomatique et digne en français tout en conservant le nom divin.
- source_word: הֶעֱלָה
  choice: a fait remonter
  rationale: Le hiphil de עלה signifie littéralement faire monter. Cette formulation conserve l’écho au langage de l’exode sans le réduire à une simple sortie.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent français actuel et naturel de « fils d’Israël » lorsqu’il désigne collectivement le peuple, sans restriction aux seuls hommes.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: du pays du nord
  rationale: Rendu proche de l’expression géographique hébraïque, sans identifier le lieu à un État moderne précis.
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: et de tous les pays
  rationale: « Pays » convient au pluriel de אֶרֶץ et reste naturel en français dans ce contexte de dispersion.
- source_word: הִדִּיחָם שָׁמָּה
  choice: où il les avait chassés
  rationale: Le verbe exprime une expulsion énergique; « chassés » maintient la sévérité et l’action du même sujet divin. L’adverbe שָׁמָּה est naturellement intégré à la relative « où ».
- source_word: וַהֲשִׁבֹתִים
  choice: Je les ramènerai
  rationale: Le hiphil exprime le fait de faire revenir. « Ramener » est clair, idiomatique et conserve l’action restauratrice de Dieu.
- source_word: עַל אַדְמָתָם
  choice: sur leur terre
  rationale: La préposition עַל est conservée par « sur », et אַדָמָה désigne ici la terre propre du peuple, avec une nuance concrète de sol territorial.
- source_word: אֲשֶׁר נָתַתִּי לַאֲבוֹתָם
  choice: celle que j’ai donnée à leurs pères
  rationale: « Pères » conserve le terme masculin et sa portée historique et liée à l’alliance; « celle » clarifie naturellement en français l’antécédent « terre ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Référent de לַאֲבוֹתָם
  choice: à leurs pères
  alternative: à leurs ancêtres
  rationale: L’hébreu emploie le terme masculin « pères », susceptible d’évoquer les pères ancestraux et le don lié à l’alliance. La traduction ne neutralise pas cette formulation.
- issue: Sujet de הִדִּיחָם
  choice: 'Yahweh demeure le sujet : « où il les avait chassés »'
  alternative: 'une tournure passive : « où ils avaient été dispersés »'
  rationale: La syntaxe rattache le verbe à Yahweh. Maintenir cette action divine conserve la tension théologique entre le jugement de l’exil et la restauration promise.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formule de serment est conservée sous une forme proche de l’hébreu. « Israélites » évite l’expression vieillie « enfants d’Israël », tandis que « leurs pères » préserve la précision du texte source.
