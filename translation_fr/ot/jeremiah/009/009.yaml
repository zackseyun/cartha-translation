source:
  edition: WLC
  text: עַל הֶ֨/הָרִ֜ים אֶשָּׂ֧א בְכִ֣י וָ/נֶ֗הִי וְ/עַל נְא֤וֹת מִדְבָּר֙ קִינָ֔ה כִּ֤י נִצְּתוּ֙ מִ/בְּלִי אִ֣ישׁ עֹבֵ֔ר וְ/לֹ֥א שָׁמְע֖וּ ק֣וֹל מִקְנֶ֑ה מֵ/ע֤וֹף הַ/שָּׁמַ֨יִם֙ וְ/עַד בְּהֵמָ֔ה נָדְד֖וּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/009.yaml
  text: Over the mountains I will lift up weeping and wailing[a], and over the pastures of the wilderness a lament, because they are laid waste so that no man passes through, and they do not hear the sound of livestock. From the birds of the heavens to the beasts, they have fled[c][b]; they are gone.
translation:
  language: fr
  text: 'Sur les montagnes, je ferai monter des pleurs et des gémissements ; sur les pâturages du désert, une lamentation, car ils ont été ravagés[a] : plus personne n’y passe, et l’on n’y entend plus le bruit des troupeaux. Des oiseaux du ciel jusqu’aux bêtes, tous ont fui, ils sont partis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brûlés » ou « incendiés ». Le verbe hébreu peut décrire une dévastation en conservant l’image concrète du feu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא בְכִי וָנֶהִי
  choice: je ferai monter des pleurs et des gémissements
  rationale: L’expression associe le verbe « lever, porter » à deux termes de deuil. « Faire monter » conserve l’image hébraïque tout en formant une expression française naturelle et solennelle.
- source_word: נְאוֹת מִדְבָּר
  choice: les pâturages du désert
  rationale: Le nom désigne ici des lieux de pâture. La mention ultérieure des troupeaux confirme ce sens plutôt que celui d’habitations.
- source_word: קִינָה
  choice: une lamentation
  rationale: Le terme désigne une plainte funèbre ou un chant de deuil. « Lamentation » convient au registre poétique et reste distinct de « pleurs » et de « gémissements ».
- source_word: נִצְּתוּ
  choice: ils ont été ravagés
  rationale: Le verbe peut évoquer concrètement des lieux brûlés ou embrasés, tout en exprimant plus largement leur dévastation. « Ravagés » maintient cette portée sans supprimer l’image possible du feu, signalée en note.
- source_word: מִבְּלִי אִישׁ עֹבֵר
  choice: plus personne n’y passe
  rationale: אִישׁ est générique dans cette tournure. « Plus personne » exprime clairement l’abandon total et évite en français moderne un masculin inutilement marqué.
- source_word: קוֹל מִקְנֶה
  choice: le bruit des troupeaux
  rationale: קוֹל signifie ici le son audible, et מִקְנֶה désigne collectivement le bétail. « Le bruit des troupeaux » est idiomatique et adapté au contexte pastoral.
- source_word: מֵעוֹף הַשָּׁמַיִם וְעַד בְּהֵמָה
  choice: Des oiseaux du ciel jusqu’aux bêtes
  rationale: La construction « de… jusqu’à… » présente toute l’étendue du monde animal, des oiseaux aux animaux terrestres. « Ciel » rend naturellement le pluriel hébreu dans cet emploi.
- source_word: נָדְדוּ הָלָכוּ
  choice: tous ont fui, ils sont partis
  rationale: Les deux verbes successifs insistent sur la disparition des animaux. Les rendre séparément conserve cette emphase sans produire une répétition artificielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La ponctuation fait ressortir le mouvement de la lamentation puis les signes successifs de l’abandon. L’ajout de « tous » explicite la portée englobante de la construction « des oiseaux… jusqu’aux bêtes » sans modifier son sens.
