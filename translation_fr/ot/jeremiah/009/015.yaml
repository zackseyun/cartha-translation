review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : dispersion parmi des peuples inconnus, suivie de l’épée, jusqu’à l’élimination des destinataires. Toutefois, « parmi des nations » ne rend pas la détermination de בַּגּוֹיִם aussi précisément que « parmi les nations », et « anéantisse » est plus absolu et interprétatif que ne l’exige כַּלּוֹתִי.'
  naturalness: 'La séquence « qu’ils n’ont connues, ni eux ni leurs pères » est maladroite en français moderne : le pronom « ils » est repris de manière redondante et la portée de « ni eux ni leurs pères » arrive trop tard. « que ni eux ni leurs pères n’ont connues » est clair et idiomatique.'
  terminology: « Disperser », « pères », « l’épée » et « à leur poursuite » rendent bien les termes et l’image hébraïques. « Faire disparaître » exprime ici, sans surtraduction, l’idée de mettre fin à/consommer les destinataires ; la note conserve les autres possibilités lexicales.
  issues:
  - severity: medium
    issue: Syntaxe de la relative négative
    rationale: « qu’ils n’ont connues, ni eux ni leurs pères » est une construction lourde et ambiguë. L’hébreu associe explicitement les deux sujets sous la négation ; le français naturel est « que ni eux ni leurs pères n’ont connues ».
  - severity: low
    issue: Article devant « nations »
    rationale: Le syntagme בַּגּוֹיִם comporte l’article défini. « Parmi les nations » est à la fois plus proche de la source et plus naturel dans ce contexte.
  - severity: low
    issue: Intensité de « anéantisse »
    rationale: כלה peut désigner le fait de mener à terme, d’achever ou de détruire. « Anéantir » impose plus fortement l’idée d’une destruction totale ; « faire disparaître » conserve la gravité tout en restant plus souple.
