revisions:
- from: Je les disperserai parmi des nations qu’ils n’ont connues, ni eux ni leurs pères[a]. J’enverrai l’épée[b] à leur poursuite jusqu’à ce que je les anéantisse[c].
  to: Je les disperserai parmi les nations que ni eux ni leurs pères n’ont connues[a]. J’enverrai l’épée[b] à leur poursuite jusqu’à ce que je les fasse disparaître[c].
  rationale: La révision corrige la construction française de la relative, restitue l’article défini du texte hébreu et atténue une surinterprétation possible de כלה, sans minimiser la violence du jugement ni expliciter davantage l’image de l’épée.
