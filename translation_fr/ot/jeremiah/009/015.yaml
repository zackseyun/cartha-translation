base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/015.yaml
  text: And I will scatter them among the nations that neither they nor their fathers have known[c][b][a], and I will send the sword after them until I have consumed them.
translation:
  language: fr
  text: Je les disperserai parmi les nations que ni eux ni leurs pères n’ont connues[a]. J’enverrai l’épée[b] à leur poursuite jusqu’à ce que je les fasse disparaître[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs ancêtres ». L’hébreu dit littéralement « leurs pères ».
    reason: lexical_alternative
  - marker: b
    text: Dans la Bible, « l’épée » représente souvent la guerre ou un jugement entraînant la mort.
    reason: cultural_note
  - marker: c
    text: Ou « jusqu’à ce que j’en finisse avec eux » ou « jusqu’à ce que je les détruise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִים
  choice: Je les disperserai
  rationale: Le hifil de פוץ exprime l’action de disperser. « Disperser » est naturel en français et conserve l’idée du jugement sans ajouter celle d’un exil explicitement formulé.
- source_word: בַּגּוֹיִם
  choice: parmi des nations
  rationale: גּוֹיִם désigne ici des nations ou des peuples étrangers. « Des nations » convient au caractère indéfini de ces peuples inconnus et évite le terme « païens », plus interprétatif.
- source_word: אֲשֶׁר לֹא יָדְעוּ הֵמָּה וַאֲבוֹתָם
  choice: qu’ils n’ont connues, ni eux ni leurs pères
  rationale: יָדַע indique ici la connaissance par expérience ou familiarité. La tournure française explicite naturellement que la négation porte à la fois sur la génération présente et sur ses pères.
- source_word: וְשִׁלַּחְתִּי
  choice: J’enverrai
  rationale: שׁלח signifie couramment « envoyer ». Ce choix reste proche du texte sans renforcer l’expression par « déchaîner ».
- source_word: אַחֲרֵיהֶם
  choice: à leur poursuite
  rationale: Littéralement « après eux » ; dans ce contexte, l’épée les poursuit. « À leur poursuite » restitue clairement cette image en français courant.
- source_word: אֶת־הַחֶרֶב
  choice: l’épée
  rationale: חֶרֶב signifie littéralement « épée » et peut représenter par métonymie la guerre ou une mort violente. L’image concrète est conservée.
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: jusqu’à ce que je les anéantisse
  rationale: כלה dans cette construction signifie mener à son terme, faire disparaître ou détruire. « Anéantir » exprime la sévérité du jugement, tandis qu’une note signale des formulations plus proches de l’idée d’achèvement.
theological_decisions:
- issue: Portée historique de וַאֲבוֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: « Pères » correspond directement au nom masculin hébreu et préserve sa résonance familiale et historique, sans exclure que le terme puisse désigner plus largement les ancêtres.
- issue: Valeur métaphorique de הַחֶרֶב
  choice: l’épée
  alternative: la guerre ou le jugement mortel
  rationale: Le texte présente une image concrète susceptible de désigner la guerre et la mort violente. La traduction ne réduit pas cette image à une seule interprétation.
- issue: Force de עַד כַּלּוֹתִי אוֹתָם
  choice: jusqu’à ce que je les anéantisse
  alternative: jusqu’à ce que j’en finisse avec eux
  rationale: Le contexte est celui d’un jugement destructeur, mais le verbe porte aussi l’idée de mener quelque chose à son terme. Le texte principal rend la force contextuelle et la note conserve la nuance lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant les calques peu naturels. Les images prophétiques de la dispersion et de l’épée sont conservées.
