id: JER.9.23
reference: Jeremiah 9:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אִם בְּ/זֹ֞את יִתְהַלֵּ֣ל הַ/מִּתְהַלֵּ֗ל הַשְׂכֵּל֮ וְ/יָדֹ֣עַ אוֹתִ/י֒ כִּ֚י אֲנִ֣י יְהוָ֔ה עֹ֥שֶׂה חֶ֛סֶד מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָ֑רֶץ כִּֽי בְ/אֵ֥לֶּה חָפַ֖צְתִּי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/023.yaml
  text: 'But let the one who boasts boast in this: that he understands and knows me[a], that I am Yahweh, who practices steadfast love, justice, and righteousness in the earth; for in these I delight[b], declares Yahweh.'
translation:
  language: fr
  text: 'Mais que celui qui se glorifie se glorifie de ceci : avoir du discernement et me connaître, savoir que moi, je suis Yahweh, celui qui exerce l’amour fidèle[a], le droit et la justice sur la terre[b] ; car c’est en cela que je prends plaisir — déclaration de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu חֶסֶד est un terme riche, souvent lié à l’alliance ; selon le contexte, il peut aussi être rendu par « bonté », « amour constant », « miséricorde » ou « fidélité à l’alliance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre en général, soit un pays particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: Dans le contraste avec les motifs de fierté rejetés au verset précédent, l’expression introduit le véritable motif de fierté.
- source_word: בְּזֹאת
  choice: de ceci
  rationale: Cette formulation française naturelle conserve la valeur prospective du démonstratif, qui annonce ce qui suit.
- source_word: יִתְהַלֵּל / הַמִּתְהַלֵּל
  choice: que celui qui se glorifie se glorifie
  rationale: La répétition de la même racine hébraïque est reproduite, tout en gardant le singulier représentatif sans le limiter explicitement à un homme.
- source_word: הַשְׂכֵּל
  choice: avoir du discernement
  rationale: Dans son association avec « me connaître », le verbe évoque une compréhension juste et pénétrante plutôt qu’une simple acquisition d’informations.
- source_word: וְיָדֹעַ אוֹתִי
  choice: et me connaître
  rationale: Le verbe ידע peut exprimer une connaissance personnelle et relationnelle ; la traduction directe préserve cette profondeur sans la développer artificiellement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: עֹשֶׂה
  choice: celui qui exerce
  rationale: Le participe présente ces actions comme caractéristiques de Yahweh ; « exerce » convient naturellement aux trois termes coordonnés.
- source_word: חֶסֶד
  choice: l’amour fidèle
  rationale: Cette expression réunit la dimension d’amour ou de bonté et celle de loyauté durable portée par ce terme riche, souvent lié à l’alliance.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans le binôme avec צְדָקָה, « le droit » désigne l’ordre juste et le jugement équitable tout en restant distinct de « la justice ».
- source_word: וּצְדָקָה
  choice: et la justice
  rationale: Le choix conserve la distinction entre les deux notions éthiques parallèles sans nier leur important chevauchement sémantique.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre en général ou un pays déterminé. Le sens large convient à cette affirmation sur l’action et le caractère de Yahweh, tandis que la note conserve l’autre possibilité.
- source_word: כִּי בְאֵלֶּה חָפַצְתִּי
  choice: car c’est en cela que je prends plaisir
  rationale: La tournure exprime le plaisir et l’approbation, et non une simple préférence abstraite ; le singulier collectif français renvoie naturellement aux trois réalités citées.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule rend l’énoncé prophétique solennel sans ajouter un verbe absent de l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère de nom personnel plutôt que de le remplacer par un titre.
- issue: Portée de בָּאָרֶץ
  choice: sur la terre
  alternative: dans le pays
  rationale: L’affirmation décrit de manière générale ce que Yahweh accomplit et ce en quoi il prend plaisir. Le sens local demeure toutefois possible et est signalé en note.
- issue: Nature de la connaissance de Yahweh
  choice: avoir du discernement et me connaître
  alternative: comprendre que l’on me connaît / me reconnaître
  rationale: La coordination hébraïque maintient ensemble discernement et connaissance personnelle. La traduction évite de réduire cette connaissance à une notion purement intellectuelle ou de la paraphraser en adhésion confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition rhétorique de « se glorifie » et la solennité de la formule prophétique sont conservées. « Amour fidèle », « droit » et « justice » forment une triade claire sans effacer les nuances des termes hébreux.
