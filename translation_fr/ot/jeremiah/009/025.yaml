  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל מִצְרַ֣יִם וְ/עַל יְהוּדָ֗ה וְ/עַל אֱד֞וֹם וְ/עַל בְּנֵ֤י עַמּוֹן֙ וְ/עַל מוֹאָ֔ב וְ/עַל֙ כָּל קְצוּצֵ֣י פֵאָ֔ה הַ/יֹּשְׁבִ֖ים בַּ/מִּדְבָּ֑ר כִּ֤י כָל הַ/גּוֹיִם֙ עֲרֵלִ֔ים וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל עַרְלֵי לֵֽב־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/025.yaml
  text: against Egypt[a], and against Judah, and against Edom, and against the sons of Ammon, and against Moab, and against all those with the corners of their hair cut off, who dwell in the wilderness; for all the nations are uncircumcised, and all the house of Israel are uncircumcised in heart.
translation:
  language: fr
  text: contre l’Égypte, contre Juda, contre Édom, contre les fils d’Ammon, contre Moab et contre tous ceux qui se coupent les cheveux aux tempes[a] et qui habitent dans le désert. En effet, toutes les nations sont incirconcises, et toute la maison d’Israël a le cœur incirconcis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ceux qui se rasent les tempes ». L’hébreu évoque probablement une coiffure caractéristique de certains peuples du désert.'
    reason: Alternative lexicale et incertitude ethnographique concernant קְצוּצֵי פֵאָה.
lexical_decisions:
- source_word: עַל
  choice: contre
  rationale: Dans la continuité de l’annonce du jugement au verset précédent, la préposition introduit les peuples visés et porte ici une force hostile et judiciaire.
- source_word: בְּנֵי עַמּוֹן
  choice: les fils d’Ammon
  rationale: Cette formulation garde la construction hébraïque et sa forme masculine collective, tout en restant compréhensible en français biblique courant.
- source_word: כָּל קְצוּצֵי פֵאָה
  choice: tous ceux qui se coupent les cheveux aux tempes
  rationale: La formule évoque littéralement une coupe pratiquée aux bords ou aux coins de la chevelure. « Aux tempes » rend concrètement l’image sans identifier avec certitude la coutume.
- source_word: הַיֹּשְׁבִים בַּמִּדְבָּר
  choice: qui habitent dans le désert
  rationale: « Désert » est naturel en français moderne et convient aux populations nomades ou semi-nomades ici désignées, sans exiger l’idée d’une étendue uniquement sablonneuse.
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit l’explication générale qui fonde le jugement annoncé.
- source_word: כָל הַגּוֹיִם
  choice: toutes les nations
  rationale: Le contexte désigne les peuples environnants; « nations » préserve cette portée sans introduire une opposition théologique plus tardive entre Juifs et non-Juifs.
- source_word: עֲרֵלִים
  choice: incirconcises
  rationale: La traduction littérale conserve la force corporelle, polémique et liée à l’alliance du terme hébreu.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: L’expression collective reproduit l’idiome hébreu tout en demeurant claire et digne en français.
- source_word: עַרְלֵי לֵב
  choice: a le cœur incirconcis
  rationale: Cette tournure française naturelle conserve la métaphore hébraïque de l’incirconcision intérieure.
theological_decisions:
- issue: Portée métaphorique de la condition d’Israël
  choice: a le cœur incirconcis
  alternative: est incirconcise de cœur; est rebelle intérieurement
  rationale: Le texte oppose implicitement le signe extérieur de l’alliance à l’état intérieur d’Israël. Garder l’image du cœur incirconcis préserve cette tension au lieu de l’expliquer par une paraphrase.
- issue: Désignation des Ammonites
  choice: les fils d’Ammon
  alternative: les Ammonites
  rationale: La traduction formelle maintient la désignation généalogique masculine du texte source, employée collectivement, sans lui ajouter une portée doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « contre » conserve le rythme judiciaire de l’énumération. Le parallélisme final et la métaphore de la circoncision sont maintenus; la ponctuation française répartit les propositions sans atténuer leur contraste.
