translation_notes:
  register: Français international moderne, courant et digne. Le contraste entre la parole extérieure et l’intention intérieure est nettement conservé. La métaphore violente de la langue-flèche demeure explicite, et la cible implicite de l’embuscade n’est pas ajoutée au texte.
