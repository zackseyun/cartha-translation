  naturalness: '« Elle profère la tromperie » est compréhensible, mais peu idiomatique en français moderne : on profère plus naturellement des paroles, des menaces ou des injures. « Elle dit des paroles trompeuses » est plus naturel tout en conservant l''accusation de tromperie. Le reste est fluide et de registre approprié.'
