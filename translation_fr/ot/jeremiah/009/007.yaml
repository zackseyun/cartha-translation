  text: חֵ֥ץ שוחט לְשׁוֹנָ֖/ם מִרְמָ֣ה דִבֵּ֑ר בְּ/פִ֗י/ו שָׁל֤וֹם אֶת רֵעֵ֨/הוּ֙ יְדַבֵּ֔ר וּ/בְ/קִרְבּ֖/וֹ יָשִׂ֥ים אָרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/007.yaml
  text: Their tongue is a slaughtering arrow[a]; it speaks deceit. With his mouth each man speaks peace to his neighbor[c][b], but within himself he sets his ambush.
translation:
  language: fr
  text: Leur langue est une flèche meurtrière[a] ; elle dit des paroles trompeuses. De sa bouche, chacun parle de paix à son prochain[b], mais au fond de lui, il prépare une embuscade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une flèche mortelle » ou « une flèche qui tue ». Le participe hébreu vient du verbe « égorger, abattre » et souligne l’intention de tuer, non la seule acuité de la flèche.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « parle de paix à son prochain » ; autrement dit, il lui tient des propos amicaux ou rassurants tout en projetant intérieurement de lui nuire.'
    reason: cultural_note
  - marker: c
    text: Ou « il place son embuscade » ou « il tend un guet-apens ». L’hébreu ne précise pas explicitement qui en est la cible.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵץ שוחט
  choice: une flèche meurtrière
  rationale: חֵץ désigne une flèche, et le participe שוחט, issu du verbe « égorger, abattre », en souligne la visée mortelle. « Meurtrière » restitue naturellement en français la force de l’image sans réduire le terme à l’idée d’une simple flèche aiguisée.
- source_word: לשונם
  choice: leur langue
  rationale: Le singulier collectif hébreu est conservé naturellement en français et porte l’accusation sur l’ensemble du groupe.
- source_word: מרמה דבר
  choice: elle profère la tromperie
  rationale: מרמה désigne la tromperie ou la duplicité. Le verbe masculin singulier renvoie à la langue envisagée dans l’image précédente ; « elle profère » maintient ce lien en français.
- source_word: בפיו
  choice: de sa bouche
  rationale: La tournure marque le moyen ou la provenance de la parole et prépare le contraste entre les propos extérieurs et l’intention intérieure.
- source_word: שלום
  choice: de paix
  rationale: « Paix » conserve le sens fondamental de שלום et l’expression hébraïque, tout en laissant le contexte indiquer qu’il s’agit de paroles amicales ou rassurantes.
- source_word: את רעהו
  choice: à son prochain
  rationale: רֵעַ désigne ici l’autre avec lequel on entretient une relation sociale proche. « Prochain » est naturel, digne et moins restrictif que « ami ».
- source_word: ידבר
  choice: parle
  rationale: L’imparfait hébreu décrit ici un comportement habituel ; le présent français convient à cette portée générale.
- source_word: ובקרבו
  choice: au fond de lui
  rationale: La locution exprime l’intériorité et contraste nettement avec « de sa bouche », sans préciser davantage que l’hébreu le siège de l’intention.
- source_word: ישים ארבו
  choice: il prépare une embuscade
  rationale: שים signifie « mettre, placer, établir » et ארב une embuscade ou le fait de guetter. En français, « préparer une embuscade » rend naturellement l’action, tandis que la cible demeure implicite comme en hébreu.
