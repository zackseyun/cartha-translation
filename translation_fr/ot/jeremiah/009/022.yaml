source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל יִתְהַלֵּ֤ל חָכָם֙ בְּ/חָכְמָת֔/וֹ וְ/אַל יִתְהַלֵּ֥ל הַ/גִּבּ֖וֹר בִּ/גְבֽוּרָת֑/וֹ אַל יִתְהַלֵּ֥ל עָשִׁ֖יר בְּ/עָשְׁרֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/022.yaml
  text: 'Thus says Yahweh: Let not the wise man boast in his wisdom[a], and let not the mighty man boast in his might; let not the rich man boast in his riches.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Que le sage ne se glorifie pas de sa sagesse, que l’homme vaillant ne se glorifie pas de sa force, et que le riche ne se glorifie pas de sa richesse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Rend naturellement la formule prophétique solennelle tout en conservant le présent de proclamation et le nom divin.
- source_word: אַל יִתְהַלֵּל
  choice: Que… ne se glorifie pas
  rationale: Le hitpael de הלל exprime ici le fait de tirer gloire de soi ou de ses avantages; cette tournure conserve la valeur jussive de l’interdiction et le registre digne.
- source_word: חָכָם בְּחָכְמָתוֹ
  choice: le sage… de sa sagesse
  rationale: Le masculin singulier substantivé et le parallélisme lexical de l’hébreu sont maintenus dans un français naturel.
- source_word: הַגִּבּוֹר בִּגְבוּרָתוֹ
  choice: l’homme vaillant… de sa force
  rationale: גִּבּוֹר peut désigner un homme fort ou vaillant sans imposer ici un contexte strictement militaire; « force » rend clairement גְּבוּרָה.
- source_word: עָשִׁיר בְּעָשְׁרוֹ
  choice: le riche… de sa richesse
  rationale: Préserve le singulier représentatif ainsi que la reprise étymologique et le parallélisme de la troisième proposition.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Sens de l’interdiction אַל יִתְהַלֵּל
  choice: ne se glorifie pas de
  alternative: ne se vante pas de
  rationale: « Se glorifier de » garde le poids théologique et la dignité du propos, sans ajouter l’idée plus familière ou exclusivement ostentatoire que peut suggérer « se vanter ».
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme ternaire et les singuliers représentatifs du texte hébreu sont conservés; aucune note n’est nécessaire pour cette formulation.
