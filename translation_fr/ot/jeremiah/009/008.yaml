id: JER.9.8
reference: Jeremiah 9:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/עַל אֵ֥לֶּה לֹֽא אֶפְקָד בָּ֖/ם נְאֻם יְהוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/008.yaml
  text: Shall I not punish them for these things? declares Yahweh[a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: fr
  text: « Ne les punirai-je pas pour ces choses ? déclare Yahvé. Mon âme[a] ne se vengera-t-elle pas d’une nation pareille ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon âme » ; expression anthropopathique. Autres traductions possibles : « moi-même » ou « mon être ».'
    reason: Préciser l’image hébraïque et ses principales possibilités lexicales.
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: pour ces choses
  rationale: L’interrogation rhétorique porte sur le motif du jugement ; « pour ces choses » conserve la valeur causale de עַל dans un français naturel.
- source_word: אֶפְקָד
  choice: punirai
  rationale: Dans ce contexte de jugement, פקד signifie demander des comptes ou punir ; « punir » exprime clairement la portée judiciaire.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: Cette formulation conserve la solennité de la formule prophétique, tandis que « Yahvé » représente le nom divin יהוה.
- source_word: אִם ... לֹא
  choice: ne ... pas ... ?
  rationale: אִם introduit ici une seconde question rhétorique qui appelle une réponse affirmative, en parallèle avec la première.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: d’une nation pareille
  rationale: Cette tournure idiomatique garde la force démonstrative de כָּזֶה et convient au verbe pronominal « se venger de ».
- source_word: תִתְנַקֵּם
  choice: se vengera
  rationale: Le hitpael de נקם possède ici une valeur réfléchie ou moyenne, directement rendue par le verbe pronominal français.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: La traduction littérale préserve l’image vive et la tension anthropopathique du texte hébreu, sans la réduire silencieusement à « moi-même ».
theological_decisions:
- issue: La référence divine à נַפְשִׁי dans un contexte de jugement
  choice: mon âme
  alternative: moi-même ; mon être
  rationale: « Mon âme » maintient l’expression anthropopathique et sa force affective. La note signale les équivalents possibles sans résoudre l’image à la place du lecteur.
translation_notes:
  register: Français international moderne, clair et solennel. Les deux questions rhétoriques et leur parallélisme sont conservés. Le marqueur de note est placé après « mon âme », expression qu’il explique.
