  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י צוֹרְפָ֖/ם וּ/בְחַנְתִּ֑י/ם כִּֽי אֵ֣יךְ אֶעֱשֶׂ֔ה מִ/פְּנֵ֖י בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/006.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Behold, I am refining them and testing them[b], for how else can I act because of the daughter of my people?'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh des armées : « Voici, je vais les affiner et les mettre à l’épreuve, car comment pourrais-je faire autrement à cause de la fille de mon peuple[a] ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression prophétique littérale qui peut désigner affectueusement « mon peuple » ou « mon peuple bien-aimé ».
    reason: lexical_alternative
  - marker: b
    text: 'La question hébraïque est elliptique. Autre traduction possible : « car que pourrais-je faire d’autre à cause de la fille de mon peuple ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend clairement la valeur conclusive du connecteur hébreu dans un français actuel.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par le terme français naturel « armées », sans limiter explicitement celles-ci aux armées terrestres ou célestes.
- source_word: הִנְנִי צוֹרְפָם
  choice: Je vais les affiner au creuset
  rationale: הִנְנִי avec le participe présente ici une action imminente ou résolue. « Affiner au creuset » conserve l’image métallurgique de צרף tout en étant compréhensible en français.
- source_word: וּבְחַנְתִּים
  choice: et les mettre à l’épreuve
  rationale: בחן exprime l’examen ou la mise à l’épreuve; cette formulation française reste naturelle et maintient son lien avec l’image de l’affinage.
- source_word: כִּי אֵיךְ אֶעֱשֶׂה
  choice: car comment pourrais-je agir autrement
  rationale: Rend la question rhétorique et l’idée contextuelle d’une autre manière d’agir, sans transformer cette nécessité rhétorique en affirmation doctrinale explicite.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Exprime ici de façon directe la cause ou le motif de l’action.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: Préserve l’expression prophétique familiale et son caractère affectif, plutôt que de l’aplanir dans le corps du texte.
theological_decisions:
- issue: Sens de l’expression prophétique בַּת עַמִּי
  choice: la fille de mon peuple
  alternative: mon peuple ; mon peuple bien-aimé
  rationale: La traduction littérale maintient l’image relationnelle et affective du texte hébreu. Une note signale les équivalents idiomatiques sans imposer une seule interprétation.
- issue: Portée de la question כִּי אֵיךְ אֶעֱשֶׂה
  choice: comment pourrais-je agir autrement
  alternative: comment agirais-je ? ; que pourrais-je faire d’autre ?
  rationale: La formulation choisie conserve la force rhétorique d’une action présentée comme exigée par la situation, sans développer une théorie de la nécessité divine.
- issue: Valeur temporelle de הִנְנִי avec le participe צוֹרְפָם
  choice: Je vais les affiner
  alternative: Voici que je les affine ; me voici les affinant
  rationale: Dans ce contexte prophétique, la construction peut annoncer avec vivacité une action imminente. Le futur proche français restitue cette nuance plus naturellement qu’un calque participial.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « voici ce que dit » évite l’archaïsme de « ainsi parle », tandis que « affiner au creuset » maintient l’image métallurgique. Les notes sont placées exactement sur les expressions qu’elles expliquent.
