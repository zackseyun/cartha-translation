  naturalness: Le français est moderne et digne. « Voici, je vais » et « comment pourrais-je faire autrement » sont naturels dans ce registre. La note a doit expliquer l’idiome plutôt que le présenter comme une littéralité alors que celui-ci figure déjà dans le texte.
  terminology: « Yahweh des armées » préserve le nom divin et le titre צבאות sans surinterprétation. « Affiner » et « mettre à l’épreuve » rendent adéquatement les deux verbes, tout en conservant le lien avec la métaphore métallurgique.
