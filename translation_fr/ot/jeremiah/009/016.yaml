id: JER.9.16
reference: Jeremiah 9:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִתְבּֽוֹנְנ֛וּ וְ/קִרְא֥וּ לַ/מְקוֹנְנ֖וֹת וּ/תְבוֹאֶ֑ינָה וְ/אֶל הַ/חֲכָמ֥וֹת שִׁלְח֖וּ וְ/תָבֽוֹאנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/016.yaml
  text: 'Thus says Yahweh of hosts: Consider[a], and call for the mourning women, that they may come; and send for the skillful women[b], that they may come.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées :

    « Prêtez attention et faites appeler les pleureuses[a] ;

    qu’elles viennent !

    Envoyez chercher les femmes expertes[b] ;

    qu’elles viennent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les femmes qui entonnent des lamentations » ; il s’agit vraisemblablement de pleureuses de métier.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les femmes sages » ; dans ce contexte, probablement des femmes habiles à conduire les lamentations.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique française consacrée, concise et digne, qui conserve la solennité de l’annonce hébraïque.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת sans limiter explicitement ces armées aux seules forces terrestres ou célestes.
- source_word: הִתְבּוֹנְנוּ
  choice: Prêtez attention
  rationale: L’impératif appelle à une considération attentive. Cette formulation est naturelle en français malgré l’absence d’un complément explicite dans l’hébreu.
- source_word: וְקִרְאוּ לַמְקוֹנְנוֹת
  choice: et faites appeler les pleureuses
  rationale: Le tour causatif français exprime naturellement l’ordre de convoquer des femmes chargées de mener la lamentation.
- source_word: וּתְבוֹאֶינָה / וְתָבֹאנָה
  choice: qu’elles viennent
  rationale: Dans la suite des impératifs, les imparfaits expriment l’action souhaitée. La répétition préserve le parallélisme hébraïque.
- source_word: הַחֲכָמוֹת
  choice: les femmes expertes
  rationale: חֲכָמוֹת signifie littéralement « sages », mais désigne ici, en parallèle avec les pleureuses, des femmes ayant une compétence reconnue dans l’art de la lamentation.
- source_word: שִׁלְחוּ
  choice: Envoyez chercher
  rationale: Rend idiomatiquement l’idée d’envoyer quelqu’un afin de faire venir ces femmes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: des puissances
  rationale: « Des armées » reste proche du sens lexical et maintient l’ampleur du titre sans préciser de manière injustifiée la nature de ces armées.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La mise en lignes fait ressortir le parallélisme et la répétition de l’hébreu.
