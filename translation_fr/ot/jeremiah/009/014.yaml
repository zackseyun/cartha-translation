  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מַאֲכִילָ֛/ם אֶת הָ/עָ֥ם הַ/זֶּ֖ה לַֽעֲנָ֑ה וְ/הִשְׁקִיתִ֖י/ם מֵי רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/014.yaml
  text: 'Therefore thus says Yahweh of Armies[a], the God of Israel: Behold, I am feeding this people wormwood[b], and I will make them drink poisoned water.'
translation:
  language: fr
  text: 'C’est pourquoi voici ce que dit Yahvé des armées, le Dieu d’Israël : Je vais nourrir ce peuple d’absinthe[a] et lui faire boire des eaux empoisonnées[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’absinthe est une plante très amère, souvent employée comme image du jugement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « des eaux de poison » ; traduction traditionnelle : « des eaux de fiel » ou « une eau de fiel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence introduite par l’hébreu.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, … le maître des armées
  rationale: Conserve le nom divin et rend le titre militaire de façon naturelle; l’apposition « le Dieu d’Israël » est maintenue dans l’ordre hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite qui identifie Yahvé comme le Dieu d’Israël.
- source_word: הִנְנִי מַאֲכִילָם
  choice: Je vais nourrir
  rationale: La formule avec הִנְנִי et le participe annonce avec force une action imminente et certaine; « je vais » est idiomatique en français moderne.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Préserve le démonstratif et la désignation prophétique du peuple jugé.
- source_word: לַעֲנָה
  choice: d’absinthe
  rationale: Garde l’image concrète de cette plante intensément amère plutôt que de la réduire à son sens figuré.
- source_word: וְהִשְׁקִיתִים
  choice: et lui faire boire
  rationale: Rend clairement la valeur causative du hiphil, avec le pronom collectif singulier naturel en français pour « ce peuple ».
- source_word: מֵי רֹאשׁ
  choice: une eau empoisonnée
  rationale: Communique le caractère toxique de רֹאשׁ dans cette expression sans employer le traditionnel « fiel », devenu moins transparent.
theological_decisions:
- issue: Rendu du titre divin יְהוָה צְבָאוֹת
  choice: Yahvé, le Dieu d’Israël, le maître des armées
  alternative: le SEIGNEUR de l’univers / l’Éternel des armées
  rationale: Le texte porte explicitement le nom divin et un titre évoquant des armées. Le choix conserve ces deux éléments sans substituer au nom un titre ni élargir silencieusement צְבָאוֹת à « univers ».
translation_notes:
  register: Français international moderne, clair et digne. La formule « voici ce que dit » restitue l’annonce prophétique sans archaïsme; « Je vais » garde l’imminence vive de הִנְנִי avec le participe.
