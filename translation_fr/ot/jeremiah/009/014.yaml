  - severity: low
    issue: Le pluriel de מֵי est neutralisé dans « une eau empoisonnée ».
    rationale: Le singulier français est possible comme nom de substance, mais « des eaux empoisonnées » conserve mieux le pluriel hébreu et l’image traditionnelle de la formule מֵי רֹאשׁ.
