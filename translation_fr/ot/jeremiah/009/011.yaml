- from: Qui est l’homme sage capable de comprendre cela ? À qui la bouche de Yahweh[a] a-t-elle parlé, pour qu’il le fasse savoir ? Pourquoi le pays est-il en ruine, brûlé[b] comme un désert, sans que personne n’y passe ?
  to: Qui est l’homme sage capable de comprendre cela ? À qui la bouche de Yahweh[a] a-t-elle parlé, pour qu’il l’annonce ? Pourquoi le pays a-t-il péri, dévasté comme le désert, sans que personne n’y passe ?
  rationale: La révision remplace « brûlé » par « dévasté » afin de ne pas imposer une cause par le feu là où l’hébreu exprime avant tout la désolation. Elle ajuste aussi le verbe de communication à « l’annonce », plus concis et approprié au registre prophétique. La note lexicale b est conservée sous une forme qui reflète l’ambiguïté sans surinterprétation.
