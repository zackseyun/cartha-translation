base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/011.yaml
  text: Who is the wise man who can understand this? To whom has the mouth of Yahweh spoken[a], that he may declare it? Why has the land perished, laid waste like the wilderness[c][b], with no one passing through?
translation:
  language: fr
  text: Qui est l’homme sage capable de comprendre cela ? À qui la bouche de Yahweh[a] a-t-elle parlé, pour qu’il l’annonce ? Pourquoi le pays a-t-il péri, dévasté comme le désert, sans que personne n’y passe ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la bouche de Yahweh » ; expression qui désigne sa parole directe.'
    reason: cultural_note
lexical_decisions:
- source_word: מִי הָאִישׁ הֶחָכָם וְיָבֵן אֶת זֹאת
  choice: Qui est l’homme sage capable de comprendre cela ?
  rationale: La formulation conserve le masculin singulier explicite et rend la valeur potentielle de l’imparfait par « capable de comprendre », dans un français naturel.
- source_word: וַאֲשֶׁר דִּבֶּר פִּי יְהוָה אֵלָיו
  choice: À qui la bouche de Yahweh a-t-elle parlé
  rationale: La tournure interrogative restitue la construction relative hébraïque, tandis que l’image de la « bouche » est maintenue comme expression de la parole divine directe.
- source_word: וְיַגִּדָהּ
  choice: pour qu’il le fasse savoir
  rationale: Le hiphil de נגד exprime l’action de faire connaître ou d’annoncer. Le pronom « le » reprend naturellement en français le contenu à comprendre et à communiquer.
- source_word: עַל מָה אָבְדָה הָאָרֶץ
  choice: Pourquoi le pays est-il en ruine
  rationale: עַל מָה demande la cause. Pour une terre ou un pays, « être en ruine » exprime idiomatiquement le résultat de אבד sans suggérer sa disparition matérielle totale.
- source_word: נִצְּתָה כַמִּדְבָּר
  choice: brûlé comme un désert
  rationale: נִצְּתָה peut décrire ce qui a été incendié ou consumé. « Brûlé » garde cette image concrète, et מִדְבָּר est ici rendu par le courant « désert ».
- source_word: מִבְּלִי עֹבֵר
  choice: sans que personne n’y passe
  rationale: Cette formulation française naturelle préserve l’idée d’une absence totale de passants et ajoute seulement le pronom locatif requis par le français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme personnelle employée dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël ; sa translittération préserve cette distinction sans le remplacer par un titre.
- issue: Image anthropomorphique « bouche de Yahweh »
  choice: Image conservée dans le texte principal
  alternative: Yahweh lui a parlé
  rationale: La formulation hébraïque souligne que le message procède directement de Yahweh. La conserver maintient l’image et la force prophétique sans explicitation doctrinale.
- issue: Masculin singulier de הָאִישׁ הֶחָכָם
  choice: l’homme sage
  alternative: la personne sage
  rationale: Le texte source emploie explicitement un substantif masculin singulier. Le français le conserve sans étendre ni restreindre davantage sa portée représentative.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les questions successives et l’image prophétique sont conservées ; « pays » rend הָאָרֶץ dans son sens territorial, tandis que « désert » est plus naturel ici que « région sauvage ».
