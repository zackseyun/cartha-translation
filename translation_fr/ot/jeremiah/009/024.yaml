source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וּ/פָ֣קַדְתִּ֔י עַל כָּל מ֖וּל בְּ/עָרְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/024.yaml
  text: Look[a], days are coming, declares Yahweh[b], when I will punish everyone circumcised only in foreskin.
translation:
  language: fr
  text: Voici que des jours viennent — déclaration de Yahweh — où je punirai tous les circoncis dans l’incirconcision[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « tous les circoncis avec les incirconcis ». L’hébreu peut être compris ainsi, mais sa formulation paradoxale est alors moins directement perceptible.'
    reason: alternative_reading
  - marker: b
    text: L’expression vise probablement ceux qui portent extérieurement la circoncision tout en demeurant incirconcis dans un sens plus profond lié à l’alliance ; voir les versets suivants et Jérémie 4.4.
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Introduit avec emphase l’annonce prophétique, dans un français actuel et digne.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Conserve de près la formule prophétique hébraïque sans ajouter l’article absent du texte source.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule solennelle נְאֻם et conserve le nom divin personnel יהוה.
- source_word: וּפָקַדְתִּי עַל
  choice: je punirai
  rationale: Dans ce contexte de jugement, פקד avec על désigne une intervention punitive plutôt qu’une simple visite.
- source_word: עַל כָּל מוּל
  choice: tout circoncis
  rationale: מוּל est employé substantivement; cette formulation concise garde la portée distributive de כָּל.
- source_word: בְּעָרְלָה
  choice: dans l’incirconcision
  rationale: Cette traduction conserve le paradoxe abrupt de מוּל בְּעָרְלָה sans le résoudre explicitement en une référence au cœur.
theological_decisions:
- issue: Sens de l’expression paradoxale מוּל בְּעָרְלָה
  choice: tout circoncis dans l’incirconcision
  alternative: tous les circoncis avec les incirconcis
  rationale: Le choix principal reproduit la tension du texte hébreu entre circoncision et incirconcision. Il laisse le contexte expliquer qu’une marque extérieure peut coexister avec une incirconcision plus profonde, sans introduire cette explication dans le corps du verset.
translation_notes:
  register: Français international moderne, sobre et prophétique. « Voici que » et l’incise « déclaration de Yahweh » maintiennent la solennité sans archaïsme marqué. La formulation finale demeure volontairement paradoxale, conformément à l’hébreu.
