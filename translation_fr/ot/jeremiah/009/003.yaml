  text: אִ֤ישׁ מֵ/רֵעֵ֨/הוּ֙ הִשָּׁמֵ֔רוּ וְ/עַל כָּל אָ֖ח אַל תִּבְטָ֑חוּ כִּ֤י כָל אָח֙ עָק֣וֹב יַעְקֹ֔ב וְ/כָל רֵ֖עַ רָכִ֥יל יַהֲלֹֽךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/003.yaml
  text: Each man[a], beware of his neighbor, and do not trust any brother; for every brother surely deceives[c][b], and every neighbor goes about as a slanderer.
translation:
  language: fr
  text: Que chacun se garde de son ami, et qu’il ne se fie à aucun frère[a] ; car tout frère cherche à supplanter[b], et tout ami va de-ci de-là en colportant des propos calomnieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Frère » peut désigner un frère de sang ou, plus largement, un membre de la même communauté.
    reason: lexical_alternative
  - marker: b
    text: Ou « trompe assurément » ou « agit avec une profonde fourberie ». L’hébreu intensifie la racine עקב, qui peut évoquer la tromperie ou le fait de supplanter.
    reason: lexical_alternative
  - marker: c
    text: Ou « en colportant des médisances » ou « comme un calomniateur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מֵרֵעֵהוּ הִשָּׁמֵרוּ
  choice: Que chacun se garde de son prochain
  rationale: אִישׁ a ici une valeur distributive. « Que chacun » rend naturellement cette portée en français, tandis que « se garder de » exprime l’impératif niphal et le complément introduit par מִן. « Prochain » conserve l’étendue sociale possible de רֵעַ.
- source_word: וְעַל כָּל אָח אַל תִּבְטָחוּ
  choice: et ne faites confiance à aucun frère
  rationale: La tournure prohibitive avec כָּל se rend idiomatiquement par « aucun ». « Frère » préserve l’ambiguïté entre le frère au sens familial et un membre de la même communauté.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’avertissement.
- source_word: עָקוֹב יַעְקֹב
  choice: ne cesse de tromper
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action issue de la racine עקב. « Ne cesse de tromper » communique une conduite insistante ou répétée sans reproduire artificiellement la racine en français.
- source_word: וְכָל רֵעַ רָכִיל יַהֲלֹךְ
  choice: et tout prochain va partout en colportant des calomnies
  rationale: רָכִיל désigne celui qui fait circuler médisances ou calomnies, et יַהֲלֹךְ évoque une conduite habituelle de déplacement. La formulation française restitue ensemble l’idée de circuler et de propager des propos nuisibles.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. L’alternance entre « chacun » au singulier et les impératifs au pluriel reflète la formulation hébraïque : l’avertissement vise chaque membre du groupe auquel le prophète s’adresse. Les répétitions de « frère » et « prochain » sont maintenues pour préserver la structure et la tension sociale du texte.'
