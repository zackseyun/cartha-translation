- from: Que chacun se garde de son prochain, et ne faites confiance à aucun frère[a] ; car tout frère ne cesse de tromper[b], et tout prochain va partout en colportant des calomnies[c].
  to: Que chacun se garde de son ami, et qu’il ne se fie à aucun frère[a] ; car tout frère cherche à supplanter[b], et tout ami va de-ci de-là en colportant des propos calomnieux[c].
  rationale: La révision rétablit une syntaxe française cohérente, évite de convertir l’intensification hébraïque en action ininterrompue, et rend plus idiomatiquement l’image d’une personne qui circule en répandant des propos nuisibles. Les notes conservent les principales possibilités lexicales sans résoudre de façon doctrinale ou excessive l’ambiguïté du texte.
