  text: Let them hurry and raise a lament over us[a], so that our eyes may run down with tears and our eyelids flow with water.
translation:
  language: fr
  text: Qu’elles se hâtent et élèvent sur nous une lamentation, afin que nos yeux ruissellent de larmes et que l’eau coule de nos paupières[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « eau », en parallèle poétique avec « larmes ».
    reason: La note signale que le terme source est « eau » et explicite sobrement son parallélisme poétique, sans attribuer au texte hébreu la préposition française « de ».
lexical_decisions:
- source_word: וּתְמַהֵרְנָה
  choice: Qu’elles se hâtent
  rationale: La forme verbale à valeur volitive exprime ici l’urgence. Cette tournure conserve cette force tout en restant naturelle en français.
- source_word: וְתִשֶּׂנָה עָלֵינוּ נֶהִי
  choice: et entonnent sur nous une complainte
  rationale: L’expression avec נשׂא et נֶהִי signifie littéralement « élever une lamentation ». « Entonner une complainte » rend naturellement l’idée d’un chant funèbre commencé à notre sujet.
- source_word: נֶהִי
  choice: une complainte
  rationale: Le nom désigne des lamentations ou un chant de deuil. « Complainte » convient au registre poétique et funèbre sans imposer une forme musicale trop précise.
- source_word: וְתֵרַדְנָה עֵינֵינוּ דִמְעָה
  choice: afin que nos yeux ruissellent de larmes
  rationale: La formulation française restitue le mouvement descendant des larmes et interprète le singulier hébreu comme collectif, conformément à l’usage.
- source_word: וְעַפְעַפֵּינוּ יִזְּלוּ מָיִם
  choice: et que l’eau coule de nos paupières
  rationale: Cette traduction conserve l’image concrète et le parallélisme poétique de l’hébreu, malgré son caractère inhabituel en français.
- source_word: מָיִם
  choice: l’eau
  rationale: Le texte hébreu dit bien « eau », employé poétiquement en parallèle avec les larmes. L’image source est donc maintenue dans le texte principal.
