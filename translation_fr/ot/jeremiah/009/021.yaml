  to: '« Parle : Ainsi parle Yahweh : “Le cadavre de l’être humain[a] tombera comme du fumier à la surface du champ, et comme une gerbe derrière le moissonneur, sans personne pour le ramasser.” »'
  rationale: La révision rétablit le singulier de « champ » et supprime l’adjectif interprétatif « abandonnée ». « Sans personne pour le ramasser » conserve l’absence de tout rassembleur, tout en permettant au pronom de reprendre le « cadavre » grammaticalement masculin et de maintenir l’idée de corps non recueilli.
