source:
  edition: WLC
  text: דַּבֵּ֗ר כֹּ֚ה נְאֻם יְהוָ֔ה וְ/נָֽפְלָה֙ נִבְלַ֣ת הָֽ/אָדָ֔ם כְּ/דֹ֖מֶן עַל פְּנֵ֣י הַ/שָּׂדֶ֑ה וּ/כְ/עָמִ֛יר מֵ/אַחֲרֵ֥י הַ/קֹּצֵ֖ר וְ/אֵ֥ין מְאַסֵּֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/021.yaml
  text: 'Speak: Thus says Yahweh[a], “The corpse of man will fall like dung on the face of the field, and like a sheaf behind the reaper, with no one to gather it.”'
translation:
  language: fr
  text: '« Parle : Ainsi parle Yahweh : “Le cadavre de l’être humain[a] tombera comme du fumier à la surface du champ, et comme une gerbe derrière le moissonneur, sans personne pour le ramasser.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cadavre de l’homme » ou « le cadavre de l’humanité ». Le mot hébreu אָדָם est au singulier, mais peut avoir un sens générique.
    reason: alternative lexicale et préservation de la portée générique
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif masculin singulier introduit directement la proclamation prophétique et conserve toute la force de l’ordre.
- source_word: כֹּה נְאֻם יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique naturelle et digne en français, qui conserve le nom divin explicite.
- source_word: וְנָפְלָה
  choice: tombera
  rationale: Le parfait dans ce discours prophétique annonce un jugement futur certain.
- source_word: נִבְלַת הָאָדָם
  choice: le cadavre de l’être humain
  rationale: נִבְלָה désigne crûment un cadavre, tandis que אָדָם au singulier peut avoir ici une valeur générique; cette formulation préserve le singulier sans limiter le propos aux hommes de sexe masculin.
- source_word: כְּדֹמֶן
  choice: comme du fumier
  rationale: Le terme garde le caractère dégradant et agricole de la comparaison.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: à la surface des champs
  rationale: Formulation française naturelle qui restitue l’image de corps exposés en plein champ; le singulier hébreu a une portée collective dans cette scène.
- source_word: וּכְעָמִיר
  choice: comme une gerbe abandonnée
  rationale: עָמִיר évoque une gerbe; « abandonnée » explicite sobrement sa position derrière le moissonneur et prépare l’absence de ramasseur.
- source_word: מֵאַחֲרֵי הַקֹּצֵר
  choice: derrière le moissonneur
  rationale: Le sens spatial convient à l’image de la moisson et demeure proche de l’hébreu.
- source_word: וְאֵין מְאַסֵּף
  choice: sans personne pour la ramasser
  rationale: Cette tournure idiomatique exprime l’abandon total. Le pronom féminin suit grammaticalement « gerbe », sans supprimer l’allusion au cadavre laissé sans sépulture.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre divin au lieu de lui substituer un titre.
- issue: Portée de הָאָדָם
  choice: l’être humain
  alternative: l’homme / l’humanité
  rationale: Le singulier אָדָם peut désigner génériquement l’être humain. Le choix maintient le singulier représentatif et l’ambiguïté entre individu humain et humanité, sans introduire une restriction sexuelle.
translation_notes:
  register: Français international moderne, direct et solennel. L’image du jugement reste volontairement crue. « À la surface des champs » est plus idiomatique que le calque « sur la face du champ », tandis que « fumier », « gerbe » et « moissonneur » préservent le réseau agricole du texte.
