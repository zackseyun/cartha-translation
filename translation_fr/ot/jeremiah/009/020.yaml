source:
  edition: WLC
  text: כִּֽי עָ֤לָה מָ֨וֶת֙ בְּ/חַלּוֹנֵ֔י/נוּ בָּ֖א בְּ/אַרְמְנוֹתֵ֑י/נוּ לְ/הַכְרִ֤ית עוֹלָל֙ מִ/ח֔וּץ בַּחוּרִ֖ים מֵ/רְחֹבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/020.yaml
  text: For death has climbed in through our windows[a]; it has entered our palaces, to cut off the child from outside[b], the young men from the streets.
translation:
  language: fr
  text: Car la mort est montée par nos fenêtres ; elle est entrée dans nos palais pour retrancher les petits enfants[a] du dehors et les jeunes hommes des places publiques[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le petit enfant », au singulier collectif. Le mot hébreu peut désigner un enfant en très bas âge.
    reason: lexical_alternative
  - marker: b
    text: Ou « des rues ». Le terme hébreu désigne de larges espaces publics à l’intérieur d’une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’appel à la lamentation qui précède, avec une valeur causale naturelle en français.
- source_word: עָלָה מָוֶת
  choice: la mort est montée
  rationale: Conserve la personnification saisissante de la mort ainsi que le mouvement ascendant exprimé par le verbe hébreu.
- source_word: בְּחַלּוֹנֵינוּ
  choice: par nos fenêtres
  rationale: Exprime naturellement en français la voie par laquelle la mort pénètre, sans alourdir l’image.
- source_word: בָּא בְּאַרְמְנוֹתֵינוּ
  choice: elle est entrée dans nos palais
  rationale: Rend explicitement le mouvement d’entrée et traduit ארמון par son sens courant de palais ou résidence imposante.
- source_word: לְהַכְרִית
  choice: pour retrancher
  rationale: Préserve l’image forte de כרת, qui signifie couper ou retrancher, plutôt que de la réduire à un verbe général comme « tuer ».
- source_word: עוֹלָל
  choice: les petits enfants
  rationale: Le singulier hébreu peut avoir ici une portée collective. Le pluriel français rend naturellement la catégorie visée, tout en indiquant le très jeune âge.
- source_word: מִחוּץ
  choice: du dehors
  rationale: Conserve le contraste spatial avec les places publiques et reste proche de l’expression hébraïque.
- source_word: בַּחוּרִים
  choice: les jeunes hommes
  rationale: Rend directement le masculin pluriel désignant des hommes jeunes, potentiellement en âge de combattre.
- source_word: מֵרְחֹבוֹת
  choice: des places publiques
  rationale: רחבות désigne souvent les espaces larges et ouverts d’une ville. « Places publiques » préserve mieux cette nuance que le terme plus général « rues ».
