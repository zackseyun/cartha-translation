id: JER.9.10
reference: Jeremiah 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֧י אֶת יְרוּשָׁלִַ֛ם לְ/גַלִּ֖ים מְע֣וֹן תַּנִּ֑ים וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מִ/בְּלִ֖י יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/010.yaml
  text: And I will make Jerusalem a heap of ruins[a], a haunt of jackals; and I will make the cities of Judah a desolation[c][b], without inhabitant.
translation:
  language: fr
  text: Je ferai de Jérusalem un monceau de ruines[a], un repaire de chacals[b] ; je rendrai les villes de Juda dévastées, sans aucun habitant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des monceaux de ruines ».'
    reason: lexical_alternative
  - marker: b
    text: Hébreu tannim ; terme traditionnellement rendu aussi par « dragons », mais qui désigne très probablement ici des chacals.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « où personne n’habite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי / אֶתֵּן
  choice: Je ferai / je rendrai
  rationale: Le verbe נתן signifie fondamentalement « donner, placer », mais les compléments expriment ici le résultat produit. Ces formulations françaises rendent naturellement l’action divine et son résultat sans littéralisme maladroit.
- source_word: לְגַלִּים
  choice: un monceau de ruines
  rationale: Le pluriel גלים désigne des amas ou des monceaux, notamment des décombres. « Un monceau de ruines » restitue clairement l’image d’une ville réduite à des débris.
- source_word: מְעוֹן
  choice: un repaire
  rationale: Le nom désigne une demeure ou un lieu d’habitation. Pour des animaux sauvages occupant une ville abandonnée, « repaire » est naturel et évocateur.
- source_word: תַּנִּים
  choice: chacals
  rationale: Dans les scènes prophétiques de désolation, le terme désigne très probablement des chacals, animaux associés aux lieux abandonnés.
- source_word: עָרֵי יְהוּדָה
  choice: les villes de Juda
  rationale: Traduction directe de la construction hébraïque, avec la forme française traditionnelle et courante du nom géographique.
- source_word: שְׁמָמָה
  choice: dévastées
  rationale: Le substantif hébreu exprime la dévastation ou l’état désertique. L’adjectif français donne ici une tournure idiomatique tout en conservant le résultat du jugement.
- source_word: מִבְּלִי יוֹשֵׁב
  choice: sans aucun habitant
  rationale: La formule signifie littéralement qu’il n’y a personne qui habite le lieu. La traduction retenue est concise, claire et adaptée au registre prophétique.
theological_decisions:
- issue: L’action divine exprimée par les deux emplois de נתן
  choice: Employer « Je ferai » puis « je rendrai » pour exprimer que Dieu produit l’état de ruine et de dévastation.
  alternative: Traduire plus littéralement par « je donnerai » ou « je placerai ».
  rationale: Le contexte est celui d’un jugement dont Dieu est l’agent. La formulation résultative exprime cette action sans ajouter de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La structure garde le parallélisme du jugement tout en variant légèrement « ferai » et « rendrai » pour une expression naturelle. Tous les appels de notes figurent dans le texte.
