source:
  edition: WLC
  text: שִׁבְתְּ/ךָ֖ בְּ/ת֣וֹךְ מִרְמָ֑ה בְּ/מִרְמָ֛ה מֵאֲנ֥וּ דַֽעַת אוֹתִ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/005.yaml
  text: Your dwelling is in the midst of deceit[a]; through deceit they refuse to know me[b], declares Yahweh.
translation:
  language: fr
  text: Ta demeure est au milieu de la tromperie[a] ; par tromperie, ils refusent de me connaître[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe du singulier (« ta demeure ») au pluriel (« ils refusent »), peut-être en s’adressant d’abord au peuple ou à la ville comme à une seule entité, puis à ses habitants.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par tromperie, ils ont refusé de me connaître ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְתְּךָ
  choice: Tu habites
  rationale: La forme issue de ישׁב avec suffixe masculin singulier peut désigner le fait d’habiter ou la demeure. La tournure verbale « Tu habites » est naturelle en français et conserve l’adresse au singulier.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Rend l’idée d’une présence au sein d’un environnement qui entoure le destinataire.
- source_word: מִרְמָה
  choice: tromperie
  rationale: Le terme désigne la tromperie, la fausseté ou la perfidie. « Tromperie » est clair, courant et permet de reproduire sa répétition.
- source_word: בְּמִרְמָה
  choice: par tromperie
  rationale: 'Le ב préfixé peut être instrumental : la tromperie est le moyen par lequel le refus se maintient. La formulation conserve la répétition marquée de מִרְמָה.'
- source_word: מֵאֲנוּ
  choice: ils refusent
  rationale: Le verbe מאן exprime le refus ou le manque de volonté. Le présent décrit naturellement ici une attitude persistante, tandis que le pluriel hébreu est conservé.
- source_word: דַעַת אֹתִי
  choice: de me connaître
  rationale: L’infinitif de ידע avec son objet signifie directement « connaître ». Cette traduction laisse intacte sa portée relationnelle et théologique sans l’expliciter dans le texte.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » restitue avec dignité la formule prophétique, et « Yahweh » représente directement le nom divin יהוה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de lui substituer un titre.
- issue: Passage du singulier au pluriel
  choice: « Tu habites » puis « ils refusent »
  alternative: Uniformiser tout le verset au singulier ou au pluriel
  rationale: L’hébreu passe d’une adresse masculine singulière à un verbe pluriel. Ce changement, susceptible de viser d’abord la collectivité puis ses membres, est préservé plutôt que résolu.
- issue: Valeur temporelle de מֵאֲנוּ
  choice: 'présent : « ils refusent »'
  alternative: 'passé composé : « ils ont refusé »'
  rationale: Le parfait hébreu peut présenter un refus établi ; le présent français exprime bien l’attitude persistante dans ce contexte, tandis que l’autre lecture demeure possible.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tromperie » et l’alternance singulier-pluriel ont été maintenues afin de préserver la forme et l’ambiguïté du texte hébreu.
