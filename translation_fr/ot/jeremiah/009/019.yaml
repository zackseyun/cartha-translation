  text: כִּֽי שְׁמַ֤עְנָה נָשִׁים֙ דְּבַר יְהוָ֔ה וְ/תִקַּ֥ח אָזְנְ/כֶ֖ם דְּבַר פִּ֑י/ו וְ/לַמֵּ֤דְנָה בְנֽוֹתֵי/כֶם֙ נֶ֔הִי וְ/אִשָּׁ֥ה רְעוּתָ֖/הּ קִינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/019.yaml
  text: For hear the word of Yahweh[a], O women, and let your ear receive the word of his mouth; teach your daughters a lament[c][b], and each woman her neighbor a dirge.
translation:
  language: fr
  text: Car écoutez la parole de Yahweh, ô femmes, et que votre oreille reçoive la parole de sa bouche[b]. Enseignez à vos filles une complainte[a], et que chaque femme enseigne à sa voisine un chant funèbre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les deux termes hébreux rendus ici par « complainte » et « chant funèbre » sont proches, mais distincts ; ils désignent des expressions formelles de deuil.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « que votre oreille reçoive » ; cette image exprime une écoute attentive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur connective et causale du terme dans le contexte, où cette exhortation s’appuie sur ce qui précède.
- source_word: שְׁמַעְנָה נָשִׁים
  choice: écoutez… femmes
  rationale: L’impératif féminin pluriel et l’adresse explicite aux femmes sont maintenus dans une formulation française directe.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la formule prophétique, et le nom divin est translittéré conformément à la forme explicite du texte hébreu.
- source_word: וְתִקַּח אָזְנְכֶם
  choice: que votre oreille accueille
  rationale: La formulation garde l’image concrète et le singulier collectif de l’hébreu tout en restant intelligible en français.
- source_word: דְּבַר פִּיו
  choice: la parole de sa bouche
  rationale: Conserve l’image hébraïque concrète et le parallélisme avec « la parole de Yahweh ».
- source_word: וְלַמֵּדְנָה בְנוֹתֵיכֶם
  choice: Enseignez à vos filles
  rationale: Rend directement l’impératif féminin pluriel et maintient la référence explicite aux filles.
- source_word: נֶהִי
  choice: une complainte
  rationale: Désigne une expression vocale de deuil; « complainte » convient à une forme de lamentation que l’on peut transmettre et apprendre.
- source_word: וְאִשָּׁה רְעוּתָהּ
  choice: et chacune à sa compagne
  rationale: « Chacune » explicite la valeur distributive, tandis que le verbe « enseignez » reste sous-entendu comme en hébreu.
- source_word: קִינָה
  choice: un chant funèbre
  rationale: Désigne une composition formelle de deuil; ce choix la distingue légèrement de נֶהִי sans effacer leur proximité sémantique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; sa translittération préserve cette particularité plutôt que de la remplacer par un titre.
- issue: Adresse proprement féminine
  choice: femmes / vos filles / chacune / sa compagne
  alternative: personnes / vos enfants / chacun / son prochain
  rationale: Les formes impératives et les noms hébreux désignent explicitement des femmes et des filles; la traduction ne neutralise pas cette donnée.
- issue: Rapport entre נֶהִי et קִינָה
  choice: complainte / chant funèbre
  alternative: lamentation / lamentation
  rationale: Les deux termes appartiennent au même champ du deuil, mais ne sont pas strictement identiques; deux expressions proches préservent à la fois le parallélisme et la nuance.
translation_notes:
  register: Français international moderne, digne et direct. L’ordre des mots est adapté à l’usage français, mais les images concrètes de l’oreille et de la bouche, l’adresse féminine et l’ellipse du dernier membre sont conservés.
