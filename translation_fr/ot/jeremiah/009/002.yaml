source:
  edition: WLC
  text: וַֽ/יַּדְרְכ֤וּ אֶת לְשׁוֹנָ/ם֙ קַשְׁתָּ֣/ם שֶׁ֔קֶר וְ/לֹ֥א לֶ/אֱמוּנָ֖ה גָּבְר֣וּ בָ/אָ֑רֶץ כִּי֩ מֵ/רָעָ֨ה אֶל רָעָ֧ה יָצָ֛אוּ וְ/אֹתִ֥/י לֹֽא יָדָ֖עוּ נְאֻם יְהוָֽה־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/002.yaml
  text: They bend their tongue[a] like their bow for falsehood, and not for faithfulness have they grown strong in the land; for from evil to evil they go out, and they do not know me[b], declares Yahweh.
translation:
  language: fr
  text: Ils bandent leur langue comme leur arc pour le mensonge ; ce n’est pas pour la fidélité qu’ils se sont imposés dans le pays. Car ils passent d’un mal à l’autre[a] et ne me connaissent pas[b] — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils sortent de mal en mal ».'
    reason: La note signale le mouvement concret de l’expression hébraïque derrière le français idiomatique « passent d’un mal à l’autre ».
  - marker: b
    text: Ici, « connaître » peut aussi impliquer reconnaître Yahweh et vivre en relation fidèle avec lui.
    reason: La note conserve la portée relationnelle et liée à l’alliance que peut avoir le verbe hébreu ידע.
lexical_decisions:
- source_word: וַיַּדְרְכוּ
  choice: ils bandent
  rationale: Avec l’image de l’arc, דרך désigne l’action de tendre ou de bander l’arme. « Bandent » conserve précisément cette métaphore guerrière.
- source_word: לְשׁוֹנָם קַשְׁתָּם
  choice: leur langue comme leur arc
  rationale: L’hébreu juxtapose « leur langue » et « leur arc ». L’ajout de « comme » explicite en français la comparaison elliptique sans en modifier l’image.
- source_word: שֶׁקֶר
  choice: pour le mensonge
  rationale: שׁקר désigne ici la fausseté ou la tromperie. « Le mensonge » est naturel en français et maintient son opposition éthique à la fidélité.
- source_word: לֶאֱמוּנָה
  choice: par la fidélité
  rationale: אֱמוּנָה peut exprimer la fidélité, la fiabilité ou la vérité. « Fidélité » conserve la portée relationnelle et morale du terme.
- source_word: גָּבְרוּ
  choice: ils l’emportent
  rationale: גבר signifie devenir fort, prévaloir ou l’emporter. Cette formulation française exprime ici leur puissance dominante sans suggérer une simple croissance physique.
- source_word: בָאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte de Jérémie, אֶרֶץ renvoie naturellement au pays et à sa société plutôt qu’à la terre entière.
- source_word: מֵרָעָה אֶל־רָעָה יָצָאוּ
  choice: ils passent d’un mal à l’autre
  rationale: La formulation rend naturellement le mouvement continu exprimé par יצא dans la séquence « de mal en mal », sans réduire רָעָה à un type précis de faute.
- source_word: יָדָעוּ
  choice: connaissent
  rationale: ידע exprime la connaissance tout en pouvant inclure la reconnaissance personnelle et relationnelle. Le verbe « connaître » préserve cette amplitude.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale solennelle présente la parole comme un oracle divin. « Déclaration de Yahweh » en conserve la forme et la force prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Portée relationnelle et d’alliance de « me connaître »
  choice: ne me connaissent pas
  alternative: ne me reconnaissent pas
  rationale: Le texte peut viser davantage qu’une connaissance intellectuelle, mais « connaître » garde ouverte la dimension personnelle, relationnelle et liée à l’alliance sans la rendre exclusivement explicite.
- issue: Sens d’אֱמוּנָה dans son opposition au mensonge
  choice: fidélité
  alternative: vérité
  rationale: « Fidélité » préserve les dimensions de fiabilité et de loyauté du terme, tandis que le contexte permet aussi de comprendre « vérité ». Le choix ne réduit pas l’opposition à une notion purement intellectuelle.
translation_notes:
  register: Français international actuel, digne et accessible. La métaphore de l’arc, l’opposition entre mensonge et fidélité, ainsi que l’ambiguïté relationnelle de « connaître » sont maintenues. La ponctuation clarifie les unités poétiques sans effacer leur tension.
