  naturalness: Le français est globalement naturel, actuel et de registre prophétique sobre. « Se sont imposés dans le pays » est idiomatique et exprime bien l’idée de devenir puissants ou de prévaloir.
  terminology: « Mensonge », « fidélité », « pays », « connaître » et « Yahweh » sont appropriés. La note sur « connaître » conserve correctement la portée relationnelle et d’alliance sans imposer une interprétation confessionnelle.
