  text: וַ/יֵּ֣לְכ֔וּ אַחֲרֵ֖י שְׁרִר֣וּת לִבָּ֑/ם וְ/אַחֲרֵי֙ הַ/בְּעָלִ֔ים אֲשֶׁ֥ר לִמְּד֖וּ/ם אֲבוֹתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/013.yaml
  text: They went after the stubbornness of their heart and after the Baals[a], which their fathers taught them.
translation:
  language: fr
  text: Ils ont suivi l’obstination de leur cœur et les Baals que leurs pères[a] leur avaient enseignés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs ancêtres ». L’hébreu dit littéralement « leurs pères » et désigne ici les générations précédentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: Ils ont suivi
  rationale: L’expression idiomatique signifie « aller à la suite de, suivre ». « Suivre » est naturel en français et exprime ici l’adhésion ou l’allégeance.
- source_word: שְׁרִרוּת לִבָּם
  choice: l’obstination de leur cœur
  rationale: שְׁרִרוּת désigne l’entêtement volontaire; « obstination » convient au registre moral du contexte. Le singulier collectif « leur cœur » conserve la forme hébraïque.
- source_word: וְאַחֲרֵי הַבְּעָלִים
  choice: et les Baals
  rationale: Le verbe « suivre » régit naturellement les deux compléments en français; répéter « après » serait peu idiomatique. Le pluriel désigne les diverses manifestations locales de Baal.
- source_word: אֲשֶׁר לִמְּדוּם אֲבוֹתָם
  choice: comme leurs pères le leur avaient appris
  rationale: La relative hébraïque exprime ce que les générations précédentes leur ont enseigné. « Comme » rend naturellement ce rapport en français; « le » reprend le fait de suivre les Baals, sans les présenter artificiellement comme l’objet direct de « apprendre ».
theological_decisions:
- issue: Sens de אֲבוֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Le texte porte littéralement le masculin pluriel « leurs pères », tout en visant les générations antérieures. La formulation littérale est maintenue dans le texte, et le sens plus large est signalé en note.
- issue: Antécédent et portée de אֲשֶׁר
  choice: comme leurs pères le leur avaient appris
  alternative: les Baals que leurs pères leur avaient enseignés
  rationale: Même si le relatif suit « les Baals », le sens naturel est que leurs pères leur ont appris à les suivre ou à leur rendre un culte. La traduction française évite l’expression étrange « enseigner les Baals » sans préciser davantage la pratique cultuelle.
translation_notes:
  register: Français moderne, digne et accessible. La coordination est légèrement restructurée pour éviter le calque « aller après » et produire une phrase naturelle, tout en conservant le parallélisme sémantique des deux attachements.
