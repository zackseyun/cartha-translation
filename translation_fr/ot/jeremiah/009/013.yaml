  source_fidelity: 'Le texte hébreu présente deux objets parallèles de « suivre » : l’obstination de leur cœur et les Baals. La relative אשר למדום אבותם se rattache grammaticalement aux « Baals » : ce sont les Baals que leurs pères leur avaient enseignés. La formulation proposée avec « comme » transforme cette relative en proposition comparative et rend l’antécédent de « le » moins précis.'
