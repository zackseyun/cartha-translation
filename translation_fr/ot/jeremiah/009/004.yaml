source:
  edition: WLC
  text: וְ/אִ֤ישׁ בְּ/רֵעֵ֨/הוּ֙ יְהָתֵ֔לּוּ וֶ/אֱמֶ֖ת לֹ֣א יְדַבֵּ֑רוּ לִמְּד֧וּ לְשׁוֹנָ֛/ם דַּבֶּר שֶׁ֖קֶר הַעֲוֵ֥ה נִלְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/004.yaml
  text: And each man deceives his neighbor[a], and they do not speak truth; they have taught their tongue to speak falsehood[b]; they weary themselves committing iniquity.
translation:
  language: fr
  text: Chacun trompe son prochain[a], et personne ne dit la vérité. Ils ont habitué leur langue à dire des mensonges ; ils s’épuisent à faire le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se moque de son prochain » ou « agit de façon trompeuse envers son prochain ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils se fatiguent à mal agir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier אִישׁ a ici une valeur distributive. « Chacun » rend naturellement cette portée générale en français sans alourdir la phrase.
- source_word: בְּרֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ désigne ici l’autre membre de la communauté, sans impliquer nécessairement une amitié intime. « Prochain » convient au contexte social et éthique.
- source_word: יְהָתֵלּוּ
  choice: trompe
  rationale: Dans ce contexte, le hiphil de התל exprime surtout l’action de duper ou d’induire en erreur, en parallèle avec l’absence de vérité dans les paroles.
- source_word: אֱמֶת
  choice: la vérité
  rationale: Le parallélisme avec le mensonge indique qu’il s’agit ici de paroles véridiques plutôt que, plus largement, de fidélité.
- source_word: לִמְּדוּ לְשׁוֹנָם
  choice: ils ont appris à leur langue
  rationale: Cette formulation conserve l’image frappante de la langue que l’on instruit et souligne une habitude délibérément acquise.
- source_word: דַּבֶּר שֶׁקֶר
  choice: à dire des mensonges
  rationale: Cette expression française actuelle et claire rend l’action habituelle de proférer ce qui est faux, tout en conservant la force morale de שֶׁקֶר.
- source_word: הַעֲוֵה
  choice: à faire le mal
  rationale: L’infinitif exprime l’action perverse ou fautive à laquelle ils consacrent leurs efforts. « Faire le mal » est naturel et garde la portée morale du terme.
- source_word: נִלְאוּ
  choice: ils s’épuisent
  rationale: 'Le niphal décrit le résultat de leurs efforts persistants : ils se fatiguent jusqu’à l’épuisement dans leur pratique du mal.'
