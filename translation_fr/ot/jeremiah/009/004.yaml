revisions:
- from: Chacun trompe son prochain[a], et ils ne disent pas la vérité. Ils ont appris à leur langue à dire des mensonges ; ils s’épuisent à faire le mal[b].
  to: Chacun trompe son prochain[a], et personne ne dit la vérité. Ils ont habitué leur langue à dire des mensonges ; ils s’épuisent à faire le mal[b].
  rationale: La révision corrige une construction non naturelle qui risquait d’inverser l’image hébraïque de la langue instruite. Elle conserve la force distributive de « chacun », le sens de tromperie de יְהָתֵלּוּ et l’idée d’effort épuisant dans le mal. Les ancres de notes sont maintenues aux unités lexicales concernées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : chacun agit de manière trompeuse envers son prochain, la vérité est absente de la parole, la langue est délibérément entraînée au mensonge, et le mal est pratiqué avec un effort qui épuise. Toutefois, « ils ont appris à leur langue » inverse et obscurcit la relation exprimée par l’hébreu : ce sont eux qui ont entraîné leur langue.'
  naturalness: « Ils ont appris à leur langue à dire des mensonges » n’est pas idiomatique en français moderne. « Ils ont habitué leur langue à dire des mensonges » conserve la personnification hébraïque tout en étant naturel. La reformulation de la seconde proposition en « personne ne dit la vérité » évite l’enchaînement peu fluide entre « chacun » et « ils » sans modifier la portée universelle.
  terminology: '« Son prochain », « vérité », « mensonges » et « faire le mal » conviennent au registre prophétique moderne. « S’épuisent » rend bien נִלְאוּ. La note b ne doit pas être qualifiée de littérale : elle donne une formulation alternative du même sens.'
  issues:
  - severity: medium
    issue: Construction française non idiomatique et relation agent/objet obscurcie
    rationale: « Ils ont appris à leur langue » ne rend pas clairement לִמְּדוּ לְשׁוֹנָם, où les sujets ont entraîné leur propre langue. « Ils ont habitué leur langue » restitue l’image et le sens.
  - severity: low
    issue: Qualification inexacte de la note b
    rationale: La note « Littéralement » propose une paraphrase française plutôt qu’une traduction littérale distinctive; elle doit être présentée comme une variante de rendu.
