source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה עַל עָזְבָ/ם֙ אֶת תּ֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/הֶ֑ם וְ/לֹא שָׁמְע֥וּ בְ/קוֹלִ֖/י וְ/לֹא הָ֥לְכוּ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/012.yaml
  text: And Yahweh said[a], "Because they have forsaken my law that I set before them[b], and have not obeyed my voice or walked in it,"
translation:
  language: fr
  text: 'Et Yahweh dit : « Parce qu’ils ont abandonné ma loi[a], que j’avais placée devant eux, qu’ils n’ont pas écouté ma voix[b] et qu’ils n’ont pas marché selon elle, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon enseignement ». Le mot hébreu torah peut désigner l’enseignement au sens large, mais il possède ici une forte portée liée à l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Ou « n’ont pas obéi à ma voix ». En hébreu, l’expression « écouter la voix » implique souvent l’obéissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom personnel divin et suit la convention du projet, plutôt que de le remplacer par un titre.
- source_word: וַיֹּאמֶר
  choice: Et … dit
  rationale: Le waw consécutif fait progresser le discours; cette formulation reste naturelle dans le contexte narratif.
- source_word: עַל עָזְבָם
  choice: C’est parce qu’ils ont abandonné
  rationale: עַל introduit ici la cause, tandis que עזב exprime un abandon chargé d’une portée d’alliance.
- source_word: תּוֹרָתִי
  choice: ma loi
  rationale: « Loi » rend la force juridique et liée à l’alliance de תּוֹרָה dans ce contexte; « enseignement » demeure une possibilité lexicale.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיהֶם
  choice: que j’avais placée devant eux
  rationale: L’expression signifie mettre quelque chose devant quelqu’un comme norme à observer; le plus-que-parfait clarifie l’antériorité sans modifier le sens.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: qu’ils n’ont pas écouté ma voix
  rationale: Conserve l’image hébraïque de l’écoute tout en laissant entendre, sans l’expliciter entièrement, la notion d’obéissance.
- source_word: וְלֹא הָלְכוּ בָהּ
  choice: et n’ont pas marché selon elle
  rationale: Préserve la métaphore biblique de la marche comme conduite conforme à une norme, tout en étant idiomatique en français.
theological_decisions:
- issue: Traduction de תּוֹרָה dans un contexte d’alliance
  choice: ma loi
  alternative: mon enseignement
  rationale: Le passage dénonce la rupture de l’alliance et la désobéissance à la norme donnée par Dieu. « Loi » en conserve la force, tandis que la note signale le champ sémantique plus large.
- issue: Faut-il rendre explicitement שׁמע par « obéir » ?
  choice: n’ont pas écouté ma voix
  alternative: n’ont pas obéi à ma voix
  rationale: L’expression implique vraisemblablement l’obéissance, mais son image littérale est celle de l’écoute. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure causale met en relief le motif annoncé par עַל. La métaphore de la marche est conservée. La virgule finale signale que la déclaration se poursuit au verset suivant.
