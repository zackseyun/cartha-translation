  text: כִּ֣י ק֥וֹל נְהִ֛י נִשְׁמַ֥ע מִ/צִּיּ֖וֹן אֵ֣יךְ שֻׁדָּ֑דְנוּ בֹּ֤שְׁנֽוּ מְאֹד֙ כִּֽי עָזַ֣בְנוּ אָ֔רֶץ כִּ֥י הִשְׁלִ֖יכוּ מִשְׁכְּנוֹתֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/018.yaml
  text: 'For the sound of wailing is heard from Zion: “How we are devastated! We are utterly ashamed[a], because we have left the land[c][b], because they have cast down our dwellings.”'
translation:
  language: fr
  text: 'Car une voix de lamentation se fait entendre depuis Sion :


    « Comme nous sommes dévastés[a] !


    Nous sommes couverts de honte,


    car nous avons quitté le pays[b],


    car ils ont jeté bas nos demeures[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Comme nous avons été pillés ! » Le verbe hébreu peut mettre l’accent soit sur la dévastation générale, soit sur le pillage par un ennemi.
    reason: lexical_alternative
  - marker: b
    text: Ou « car nous avons abandonné le pays ». L’hébreu peut décrire soit un départ, éventuellement forcé, soit l’abandon du pays ; le contexte de lamentation favorise l’idée d’un départ subi sous le jugement.
    reason: lexical_alternative
  - marker: c
    text: Ou « nos habitations » ou « nos foyers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’appel au deuil dans le contexte. « Car » rend naturellement ce lien discursif.
- source_word: קוֹל נְהִי
  choice: une voix de lamentation
  rationale: קוֹל désigne une voix ou un son, et נְהִי une lamentation. Cette formulation conserve à la fois l’image auditive et le registre poétique.
- source_word: נִשְׁמַע
  choice: se fait entendre
  rationale: Le nifal a un sens passif. Le présent convient au caractère vivant de la scène prophétique.
- source_word: מִצִּיּוֹן
  choice: depuis Sion
  rationale: Cette traduction indique clairement l’origine de la lamentation tout en conservant le nom propre et sa portée poétique.
- source_word: אֵיךְ
  choice: Comme
  rationale: Le mot introduit une exclamation de lamentation. « Comme » restitue directement cette force exclamative en français.
- source_word: שֻׁדָּדְנוּ
  choice: nous sommes dévastés
  rationale: Le passif de שׁדד peut évoquer la dévastation, la ruine ou le pillage. « Dévastés » exprime ici la destruction collective sans la réduire au seul pillage.
- source_word: בֹּשְׁנוּ מְאֹד
  choice: Nous sommes couverts de honte
  rationale: בושׁ exprime la honte ou le déshonneur, et מְאֹד l’intensifie. L’expression française choisie est forte, naturelle et digne.
- source_word: כִּי עָזַבְנוּ אָרֶץ
  choice: car nous avons quitté le pays
  rationale: עזב peut signifier quitter, délaisser ou abandonner. Dans cette lamentation, « quitté » préserve la possibilité d’un départ forcé sans l’imposer explicitement.
- source_word: אָרֶץ
  choice: le pays
  rationale: Le contexte renvoie au territoire ancestral, et non à la terre entière. « Le pays » est naturel en français et convient à cette référence territoriale.
- source_word: כִּי הִשְׁלִיכוּ
  choice: car ils ont renversé
  rationale: השליך signifie littéralement jeter ou précipiter. Avec les demeures comme objet, « renversé » exprime naturellement leur destruction violente. Le sujet pluriel non précisé reste « ils ».
- source_word: מִשְׁכְּנוֹתֵינוּ
  choice: nos demeures
  rationale: מִשְׁכָּן désigne un lieu d’habitation. « Demeures » conserve le collectif et le registre soutenu de la lamentation sans suggérer nécessairement des tentes.
theological_decisions: []
