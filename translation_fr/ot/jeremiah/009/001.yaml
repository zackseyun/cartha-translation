source:
  edition: WLC
  text: מִֽי יִתְּנֵ֣/נִי בַ/מִּדְבָּ֗ר מְלוֹן֙ אֹֽרְחִ֔ים וְ/אֶֽעֶזְבָה֙ אֶת עַמִּ֔/י וְ/אֵלְכָ֖ה מֵֽ/אִתָּ֑/ם כִּ֤י כֻלָּ/ם֙ מְנָ֣אֲפִ֔ים עֲצֶ֖רֶת בֹּגְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/001.yaml
  text: Oh[a], that I had a travelers' lodging place in the wilderness, so that I might leave my people and go away from them! For all of them are adulterers[d][c][b], an assembly of traitors.
translation:
  language: fr
  text: Ah ! si seulement j’avais dans le désert un gîte pour les voyageurs[a] ! Alors je quitterais mon peuple et je m’éloignerais d’eux, car ils sont tous des adultères[b], une assemblée de traîtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Qui me donnera dans le désert un gîte pour les voyageurs ? » Cette formule exprime ici un souhait ardent.'
    reason: lexical_alternative
  - marker: b
    text: Ou « des gens adultères ». Dans le contexte prophétique, le terme peut aussi évoquer l’infidélité envers Dieu, sans exclure l’adultère au sens propre.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: Ah ! si seulement j’avais
  rationale: La formule signifie littéralement « Qui me donnera… ? », mais exprime ici un souhait ardent. Cette tournure française en restitue naturellement la valeur optative.
- source_word: בַמִּדְבָּר
  choice: dans le désert
  rationale: Le terme désigne une région inculte ou peu habitée. « Désert » est clair en français moderne et convient à l’image d’un lieu retiré.
- source_word: מְלוֹן אֹרְחִים
  choice: un gîte pour les voyageurs
  rationale: מְלוֹן désigne un lieu où passer la nuit, et אֹרְחִים des voyageurs. « Gîte » évoque un hébergement temporaire sans imposer l’image d’une auberge organisée.
- source_word: וְאֶעֶזְבָה … וְאֵלְכָה מֵאִתָּם
  choice: Alors je quitterais mon peuple et je m’éloignerais d’eux
  rationale: Les cohortatifs expriment l’action souhaitée qui découlerait de la réalisation du vœu. « Alors » rend ce lien avec naturel, tandis que « m’éloignerais d’eux » conserve l’idée de séparation.
- source_word: כִּי כֻלָּם
  choice: car ils sont tous
  rationale: כִּי introduit la raison du désir de partir, et כֻלָּם souligne la totalité du groupe.
- source_word: מְנָאֲפִים
  choice: des adultères
  rationale: Le participe désigne directement ceux qui commettent l’adultère. Le choix conserve le sens concret tout en laissant subsister sa possible portée prophétique et relationnelle.
- source_word: עֲצֶרֶת בֹּגְדִים
  choice: une assemblée de traîtres
  rationale: עֲצֶרֶת est un rassemblement ou une assemblée, tandis que בֹּגְדִים désigne ceux qui agissent avec perfidie. La formulation conserve le collectif et la vigueur de l’accusation.
theological_decisions:
- issue: Portée concrète ou métaphorique de מְנָאֲפִים
  choice: Conserver « adultères » dans le texte principal.
  alternative: « infidèles » ou « gens infidèles à Dieu »
  rationale: Dans le langage prophétique, l’adultère peut désigner aussi bien une faute sexuelle que l’infidélité envers Dieu. Traduire par le terme concret préserve cette tension sans imposer exclusivement l’une des deux lectures.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. L’exclamation initiale porte la lamentation; « gîte » garde l’idée d’un hébergement temporaire, et « assemblée de traîtres » maintient la force accusatrice ainsi que l’ironie possible du nom collectif.
