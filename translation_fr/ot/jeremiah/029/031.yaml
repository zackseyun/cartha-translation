source:
  edition: WLC
  text: שְׁלַ֤ח עַל כָּל הַ/גּוֹלָה֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה אֶל שְׁמַעְיָ֖ה הַ/נֶּחֱלָמִ֑י יַ֡עַן אֲשֶׁר֩ נִבָּ֨א לָ/כֶ֜ם שְׁמַעְיָ֗ה וַֽ/אֲנִי֙ לֹ֣א שְׁלַחְתִּ֔י/ו וַ/יַּבְטַ֥ח אֶתְ/כֶ֖ם עַל שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/031.yaml
  text: 'Send to all the exiles[a], saying, ‘Thus says Yahweh concerning Shemaiah the Nehelamite: Because Shemaiah has prophesied to you, though I did not send him, and has made you trust in a lie,’'
translation:
  language: fr
  text: 'Envoie ce message à tous les exilés : « Voici ce que dit Yahweh au sujet de Shemaïa le Néhélamite[a] : Parce que Shemaïa vous a prophétisé sans que je l’aie envoyé et qu’il vous a amenés à mettre votre confiance dans un mensonge, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « le rêveur », si ce qualificatif vient d’un mot lié au rêve plutôt que d’un nom de lieu ou de clan.
    reason: Alternative lexicale due à l’étymologie incertaine de הַנֶּחֱלָמִי.
lexical_decisions:
- source_word: שְׁלַח עַל כָּל הַגּוֹלָה
  choice: Envoie ce message à tous les exilés
  rationale: L’impératif singulier s’adresse à Jérémie. Dans ce contexte épistolaire, עַל indique les destinataires; « ce message » explicite naturellement en français ce qui doit être envoyé sans ajouter de contenu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif quotatif hébreu est rendu naturellement par les deux-points qui introduisent les paroles à transmettre.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formulation prophétique claire et actuelle, avec transcription du nom divin personnel.
- source_word: אֶל שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: au sujet de Shemaïa le Néhélamite
  rationale: Après la formule du messager, אֶל introduit ici l’objet de l’oracle, non son destinataire. Le qualificatif est translittéré puisque son origine exacte reste incertaine.
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: Conserve la relation causale qui introduit le motif du jugement annoncé dans la suite.
- source_word: נִבָּא לָכֶם
  choice: vous a prophétisé
  rationale: Rend directement le verbe נבא et son complément, dans une formulation française compréhensible.
- source_word: וַאֲנִי לֹא שְׁלַחְתִּיו
  choice: sans que je l’aie envoyé
  rationale: Exprime clairement le contraste entre l’activité prophétique de Shemaïa et l’absence de mandat divin.
- source_word: וַיַּבְטַח אֶתְכֶם עַל שָׁקֶר
  choice: il vous a amenés à mettre votre confiance dans un mensonge
  rationale: Préserve la valeur causative du hiphil de בטח et rend עַל שָׁקֶר comme le fondement ou l’objet trompeur de cette confiance.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Identification de הַנֶּחֱלָמִי
  choice: le Néhélamite
  alternative: le rêveur; l’homme de Néhélam
  rationale: L’étymologie et la fonction du terme sont incertaines. La translittération évite de trancher entre un gentilé, une désignation de clan et un titre lié au rêve.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte à la fin, conformément à la syntaxe du verset, dont la conséquence se poursuit au verset suivant.
