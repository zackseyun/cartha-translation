source:
  edition: WLC
  text: תַּ֛חַת אֲשֶֽׁר לֹא שָׁמְע֥וּ אֶל דְּבָרַ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֩ שָׁלַ֨חְתִּי אֲלֵי/הֶ֜ם אֶת עֲבָדַ֤/י הַ/נְּבִאִים֙ הַשְׁכֵּ֣ם וְ/שָׁלֹ֔חַ וְ/לֹ֥א שְׁמַעְתֶּ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/019.yaml
  text: because they did not listen to my words[a], declares Yahweh, which I sent to them by my servants the prophets, rising early and sending them, and you did not listen[b], declares Yahweh.
translation:
  language: fr
  text: 'parce qu’ils n’ont pas écouté mes paroles — déclaration de Yahweh — : je leur ai envoyé sans relâche[a] mes serviteurs, les prophètes, et vous, vous n’avez pas écouté[b] — déclaration de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « me levant tôt et envoyant ». Cette expression hébraïque évoque un envoi répété, empressé et persévérant.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe de « ils n’ont pas écouté » à « vous n’avez pas écouté »; ce changement de personne est conservé pour rendre l’interpellation directe.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: parce que
  rationale: Cette locution introduit la cause du jugement annoncé au verset précédent. « Parce que » en conserve clairement la valeur causale dans un français naturel.
- source_word: שָׁמְעוּ / שְׁמַעְתֶּם
  choice: n’ont pas écouté / n’avez pas écouté
  rationale: Avec אֶל, שׁמע exprime ici une écoute qui implique l’attention et l’accueil. « Écouter » préserve cette nuance sans réduire le sens à la simple perception auditive ni l’expliciter entièrement par « obéir ».
- source_word: אֶל דְּבָרַי
  choice: mes paroles
  rationale: Le pluriel hébreu désigne les déclarations répétées de Yahweh. « Mes paroles » en maintient le nombre et le caractère concret.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule prophétique solennelle authentifie la parole divine. « Déclaration de Yahweh » garde son caractère formulaire sans la transformer en verbe ordinaire de parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר שָׁלַחְתִּי אֲלֵיהֶם אֶת עֲבָדַי הַנְּבִאִים
  choice: alors que je leur ai envoyé mes serviteurs les prophètes
  rationale: La particule אֵת marque « mes serviteurs les prophètes » comme objet direct du verbe « envoyer ». « Alors que » articule naturellement en français la circonstance qui aggrave leur refus d’écouter.
- source_word: עֲבָדַי הַנְּבִאִים
  choice: mes serviteurs les prophètes
  rationale: « Serviteurs » met ici l’accent sur leur mission au service de Yahweh; « les prophètes » est en apposition et précise leur fonction.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: envoyé sans relâche
  rationale: L’expression idiomatique, littéralement liée au fait de se lever tôt pour envoyer, évoque l’empressement et la répétition persistante. « Sans relâche » communique ce sens en français actuel, tandis que la note conserve l’image hébraïque.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: Mais vous, vous n’avez pas écouté
  rationale: Le redoublement naturel « vous, vous » fait ressortir le brusque passage de la troisième à la deuxième personne. « Mais » explicite ici la valeur adversative que la coordination acquiert dans le contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom personnel sans lui substituer un titre.
- issue: Passage de la troisième à la deuxième personne
  choice: conserver « ils n’ont pas écouté » puis « vous, vous n’avez pas écouté »
  alternative: harmoniser les deux propositions à la troisième ou à la deuxième personne
  rationale: Le texte massorétique passe brusquement de « ils » à « vous ». La traduction préserve cette tension rhétorique, qui interpelle directement les destinataires.
- issue: Rapport entre l’envoi et les prophètes
  choice: comprendre « mes serviteurs les prophètes » comme l’objet de « j’ai envoyé »
  alternative: comprendre les prophètes comme l’intermédiaire par lequel les paroles ont été envoyées
  rationale: La présence de la marque d’objet direct אֵת devant « mes serviteurs les prophètes » favorise nettement l’idée que Yahweh a envoyé les prophètes eux-mêmes aux destinataires.
translation_notes:
  register: Français international actuel, digne et accessible. La formule prophétique est volontairement solennelle. L’idiome hébreu est rendu par son sens dans le corps du texte et son image littérale est conservée en note; le changement rhétorique de personne est accentué sans être harmonisé.
