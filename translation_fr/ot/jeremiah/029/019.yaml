  terminology: « Yahweh », « mes paroles », « mes serviteurs, les prophètes » et « déclaration de Yahweh » sont cohérents, précis et adaptés à un français international moderne. « Sans relâche » exprime de façon recevable la persistance de l’idiome hébreu, à condition que la note en conserve l’image littérale.
