base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/022.yaml
  text: And from them a curse will be taken up by all the exiles of Judah who are in Babylon[a], saying, “May Yahweh make you like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire.”
translation:
  language: fr
  text: 'Tous les exilés de Juda qui sont à Babylone tireront d’eux une formule de malédiction, en disant : « Que Yahweh te rende semblable à Sédécias et à Achab, que le roi de Babylone a rôtis dans le feu[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a brûlés dans le feu ». Le verbe hébreu peut être rendu plus généralement par « brûler », tandis que « rôtir » en conserve la force particulièrement saisissante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֻקַּח מֵהֶם קְלָלָה
  choice: On tirera d’eux une formule de malédiction
  rationale: Le passif de לקח indique qu’une formule sera tirée de leur sort et adoptée dans l’usage. « Formule de malédiction » explicite ici la valeur concrète de קְלָלָה, immédiatement illustrée par la citation.
- source_word: לְכֹל גָּלוּת יְהוּדָה אֲשֶׁר בְּבָבֶל
  choice: que tous les exilés de Juda qui sont à Babylone reprendront
  rationale: גָּלוּת peut désigner collectivement la communauté déportée. La relative avec « reprendront » rend naturellement le rôle des exilés comme usagers de la formule, exprimé par לְ dans ce contexte.
- source_word: יְשִׂמְךָ יְהוָה
  choice: Que Yahweh te rende
  rationale: La forme verbale exprime ici un souhait imprécatoire. « Que… te rende » est idiomatique en français et conserve la force de la malédiction.
- source_word: כְּצִדְקִיָּהוּ וּכְאֶחָב
  choice: semblable à Sédécias et à Achab
  rationale: La comparaison répétée en hébreu est rendue dans une tournure française claire, sans modifier le sens de la formule.
- source_word: קָלָם ... בָּאֵשׁ
  choice: a fait rôtir au feu
  rationale: Le piel de קלה peut évoquer l’action de rôtir ou griller. Cette traduction conserve la violence imagée du verbe, tandis qu’une note signale le rendu plus général possible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. La translittération « Yahweh » le distingue d’un simple titre et suit directement la forme source.
- issue: Degré de précision du supplice exprimé par קלה
  choice: fait rôtir au feu
  alternative: fait brûler dans le feu
  rationale: Le verbe peut avoir une force plus précise et saisissante que le générique « brûler ». Le texte principal conserve cette vigueur sans exclure l’autre analyse, indiquée en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe explicite l’emploi collectif de la formule sans gommer le passif initial. « Exilés » est préféré à l’abstrait « déportation » pour désigner les personnes.
