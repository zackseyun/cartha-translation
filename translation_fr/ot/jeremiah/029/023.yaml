  source_fidelity: 'Le sens principal est bien rendu : causalité, faute moralement scandaleuse, adultère, parole mensongère prononcée sous l’autorité revendiquée de Yahweh, et affirmation divine de connaissance et de témoignage. Toutefois, les deux-points donnent indûment aux propositions suivantes l’allure d’une explicitation de « infamie », alors que l’hébreu les coordonne comme motifs distincts. L’explicitation « de prononcer » est possible, mais « de dire » est plus directement lié à la parole mensongère et évite une répétition lourde.'
  naturalness: Le français est globalement clair et digne. La coordination par des virgules et « et » reflète plus naturellement le mouvement de la phrase hébraïque que les deux-points. « Un mensonge » est plus idiomatique que « une parole mensongère » dans ce contexte, sans perte de sens.
  terminology: « Infamie » rend bien נְבָלָה et maintient une forte réprobation morale. « Adultère », « en mon nom », « témoin » et « Yahweh » sont justes et adaptés au registre. « Les femmes de leurs prochains » conserve la portée communautaire de רֵעֵיהֶם sans la réduire à la proximité géographique.
