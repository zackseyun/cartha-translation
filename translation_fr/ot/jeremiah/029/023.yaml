language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַ֡עַן אֲשֶׁר֩ עָשׂ֨וּ נְבָלָ֜ה בְּ/יִשְׂרָאֵ֗ל וַ/יְנַֽאֲפוּ֙ אֶת נְשֵׁ֣י רֵֽעֵי/הֶ֔ם וַ/יְדַבְּר֨וּ דָבָ֤ר בִּ/שְׁמִ/י֙ שֶׁ֔קֶר אֲשֶׁ֖ר ל֣וֹא צִוִּיתִ֑/ם וְ/אָנֹכִ֛י הו ידע וָ/עֵ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/023.yaml
  text: because they have committed an outrageous act in Israel[a], and have committed adultery with their neighbors’ wives, and have spoken in my name a lie that I did not command them. And I am the one who knows and is a witness[c][b], declares Yahweh.
translation:
  language: fr
  text: parce qu’ils ont commis une infamie en Israël[a], qu’ils ont commis l’adultère avec les femmes de leurs prochains et qu’ils ont dit en mon nom un mensonge que je ne leur avais pas ordonné de dire. Moi, je suis celui qui sait et qui est témoin[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un acte honteux » ou « une folie scandaleuse ». Le mot hébreu désigne un acte moralement révoltant et déshonorant.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Moi, je sais et je suis témoin ». L’hébreu insiste sur le sujet : « Et moi, je suis celui qui sait et qui est témoin. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: parce que
  rationale: La locution introduit la cause du jugement annoncé au verset précédent ; « parce que » en conserve clairement la valeur causale.
- source_word: עָשׂוּ נְבָלָה
  choice: ont commis une infamie
  rationale: נְבָלָה désigne un acte moralement scandaleux et déshonorant. « Une infamie » restitue avec naturel la forte réprobation du terme.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition ב est rendue dans son sens locatif le plus direct, tout en laissant entendre le cadre communautaire.
- source_word: וַיְנַאֲפוּ אֶת נְשֵׁי רֵעֵיהֶם
  choice: ils ont commis l’adultère avec les femmes de leurs prochains
  rationale: נאף désigne précisément l’adultère. רֵעַ vise ici les autres membres de la communauté ; « prochains » évite de réduire le sens aux seuls amis ou voisins géographiques.
- source_word: וַיְדַבְּרוּ דָבָר בִּשְׁמִי שֶׁקֶר
  choice: ont prononcé en mon nom une parole mensongère
  rationale: Cette formulation conserve le substantif דָבָר et l’accusation concrète de שֶׁקֶר, tout en exprimant la prétention à parler avec l’autorité divine.
- source_word: אֲשֶׁר לֹא צִוִּיתִם
  choice: que je ne leur avais pas ordonné de prononcer
  rationale: Le complément implicite de « commander » est explicité en français pour éviter l’ambiguïté selon laquelle Dieu n’aurait pas donné d’ordre aux hommes eux-mêmes. Le plus-que-parfait marque naturellement l’antériorité de l’autorisation prétendue.
- source_word: וְאָנֹכִי הוּא יֹדֵעַ וָעֵד
  choice: Moi, je suis celui qui sait et qui est témoin
  rationale: Le détachement de « Moi » et « celui qui » rendent l’insistance de אָנֹכִי הוּא ; « témoin » maintient la portée judiciaire de עֵד sans transformer le témoignage en simple déclaration.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » conserve la solennité de la formule prophétique, et le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de la connaissance et du témoignage divins
  choice: celui qui sait et qui est témoin
  alternative: je sais et je témoigne
  rationale: Le choix retenu maintient à la fois l’emphase de אָנֹכִי הוּא et le statut nominal, potentiellement judiciaire, de עֵד, sans réduire le membre de phrase à l’acte verbal de témoigner.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination hébraïque est légèrement structurée par deux-points pour clarifier que les actes suivants précisent l’infamie, sans effacer leur distinction. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
