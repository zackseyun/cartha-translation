id: JER.29.20
reference: Jeremiah 29:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם שִׁמְע֣וּ דְבַר יְהוָ֑ה כָּל הַ֨/גּוֹלָ֔ה אֲשֶׁר שִׁלַּ֥חְתִּי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/020.yaml
  text: But you, all the exiles whom I sent from Jerusalem to Babylon, hear the word of Yahweh.
translation:
  language: fr
  text: Mais vous, tous les exilés que j’ai envoyés de Jérusalem à Babylone, écoutez la parole de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mais vous
  rationale: La conjonction suivie du pronom indépendant signale un changement contrastif par rapport à ce qui précède. « Mais vous » le rend naturellement en français.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif appelle à entendre avec attention. « Écoutez » est plus idiomatique que « entendez » dans cette adresse prophétique, sans expliciter excessivement l’idée d’obéissance.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la portée de la formule prophétique, tandis que « Yahweh » représente directement le nom divin יהוה.
- source_word: כָּל הַגּוֹלָה
  choice: tous les exilés
  rationale: Le nom hébreu, singulier mais collectif, désigne l’ensemble de la communauté déportée. Le pluriel est naturel et clair en français.
- source_word: אֲשֶׁר שִׁלַּחְתִּי
  choice: que j’ai envoyés
  rationale: Le verbe signifie simplement « envoyer » ici. L’accord au pluriel suit l’antécédent français « exilés ».
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: de Jérusalem à Babylone
  rationale: La préposition מִן marque le point de départ et la terminaison directionnelle de בָּבֶלָה le mouvement vers Babylone.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et direct. L’ordre de l’adresse est conservé, tout en employant « écoutez », plus naturel en français contemporain dans une exhortation.
