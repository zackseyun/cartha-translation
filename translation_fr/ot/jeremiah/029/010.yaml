source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כִּ֠י לְ/פִ֞י מְלֹ֧את לְ/בָבֶ֛ל שִׁבְעִ֥ים שָׁנָ֖ה אֶפְקֹ֣ד אֶתְ/כֶ֑ם וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ אֶת דְּבָרִ֣/י הַ/טּ֔וֹב לְ/הָשִׁ֣יב אֶתְ/כֶ֔ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/010.yaml
  text: 'For this is what Yahweh says: When seventy years for Babylon are completed[a], I will attend to you and fulfill my good word to you[c][b], to bring you back to this place.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh : Au terme de soixante-dix ans pour Babylone[a], j’interviendrai en votre faveur[b] et j’accomplirai ma bonne parole à votre égard[c], pour vous ramener en ce lieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Quand soixante-dix ans pour Babylone seront accomplis. » L’expression peut désigner la période accomplie en rapport avec Babylone.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « je m’occuperai de vous ». Le verbe hébreu peut désigner l’attention portée à quelqu’un, soit pour le juger, soit pour prendre soin de lui ; ici, le contexte est favorable.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je confirmerai ma bonne parole à votre égard ». Il s’agit de mettre à exécution ce que Yahweh a annoncé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel et suit la convention du projet en français.
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que dit
  rationale: Rend naturellement en français moderne la formule hébraïque qui introduit une déclaration divine.
- source_word: כִּי לְפִי מְלֹאת לְבָבֶל שִׁבְעִים שָׁנָה
  choice: Quand les soixante-dix ans fixés pour Babylone seront accomplis
  rationale: Exprime l’achèvement de la période tout en maintenant son association avec Babylone, sans préciser s’il s’agit de sa domination ou de la durée de l’exil.
- source_word: אֶפְקֹד אֶתְכֶם
  choice: je m’occuperai de vous
  rationale: פקד signifie ici tourner son attention vers quelqu’un en vue d’une intervention favorable. Cette formulation est naturelle et garde la portée bienveillante du contexte.
- source_word: וַהֲקִמֹתִי עֲלֵיכֶם אֶת דְּבָרִי הַטּוֹב
  choice: et j’accomplirai envers vous ma bonne parole
  rationale: Avec דבר, הקים désigne la mise à exécution d’une parole ou promesse. « Bonne parole » préserve l’expression hébraïque sans la réduire explicitement à « promesse ».
- source_word: לְהָשִׁיב אֶתְכֶם
  choice: en vous ramenant
  rationale: 'Rend la valeur causative du hifil de שוב : faire revenir les destinataires.'
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: dans ce lieu
  rationale: Traduit précisément מקום sans expliciter le lieu comme Jérusalem, Juda ou le pays.
theological_decisions:
- issue: Référence des soixante-dix ans associés à Babylone
  choice: « les soixante-dix ans fixés pour Babylone »
  alternative: « soixante-dix ans à Babylone » ou « les soixante-dix ans de Babylone »
  rationale: La construction hébraïque associe la période à Babylone sans déterminer à elle seule s’il s’agit de la durée de l’exil ou de celle de la puissance babylonienne. La traduction conserve cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu, tandis que « je m’occuperai de vous » et « en vous ramenant » assurent une lecture naturelle. Les notes préservent les principales nuances lexicales et l’ambiguïté historique.
