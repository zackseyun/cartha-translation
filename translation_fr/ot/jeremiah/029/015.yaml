id: JER.29.15
reference: Jeremiah 29:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֖י אֲמַרְתֶּ֑ם הֵקִ֨ים לָ֧/נוּ יְהוָ֛ה נְבִאִ֖ים בָּבֶֽלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/015.yaml
  text: Because you have said[b][a], “Yahweh has raised up prophets for us in Babylon,”
translation:
  language: fr
  text: 'Puisque vous avez dit[a] : « Yahweh a suscité pour nous des prophètes à Babylone »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car vous avez dit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Puisque
  rationale: Introduit ici la raison de la réponse divine qui suit. « Puisque » exprime naturellement cette valeur causale, tandis que « Car » reste possible.
- source_word: אֲמַרְתֶּם
  choice: vous avez dit
  rationale: Le qatal à la deuxième personne du pluriel rapporte une affirmation antérieure dont l'effet demeure dans le discours.
- source_word: הֵקִים
  choice: a suscité
  rationale: Le hiphil de קום désigne couramment l'action de faire surgir ou d'établir quelqu'un dans une fonction. « Susciter des prophètes » est naturel en français biblique actuel et conserve l'idée d'une initiative divine.
- source_word: לָנוּ
  choice: pour nous
  rationale: 'Le ל préfixé exprime ici le bénéficiaire : ces prophètes auraient été suscités en faveur des destinataires.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel יהוה au lieu de lui substituer un titre.
- source_word: נְבִאִים
  choice: des prophètes
  rationale: Rend directement le pluriel de נביא.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: La forme munie du suffixe directionnel est employée ici avec une valeur locale; en français, on dit naturellement « à Babylone ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le tétragramme, nom personnel de Dieu. La translittération préserve ce nom sans le remplacer par un titre.
- issue: Statut des prophètes mentionnés
  choice: des prophètes
  alternative: des gens qui se disent prophètes
  rationale: Le verset rapporte les paroles des exilés sans préciser ici si ces prophètes sont authentiques. La traduction conserve cette tension au lieu d'ajouter un jugement interprétatif.
translation_notes:
  register: Français moderne, courant et digne. « Puisque » marque clairement le lien causal avec la réponse qui suit; « suscité » conserve l'expression traditionnelle sans devenir archaïque. Le verset étant syntaxiquement rattaché à la suite, la virgule finale est maintenue.
