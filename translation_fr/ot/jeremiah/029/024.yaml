lexical_decisions:
- source_word: שְׁמַעְיָהוּ
  choice: Shemaya
  rationale: Translittération française naturelle du nom hébreu, avec sa forme longue en -yahu rendue selon l’usage biblique français.
- source_word: הַנֶּחֱלָמִי
  choice: le Néhélamite
  rationale: Le terme est conservé comme gentilé ou désignation énigmatique, sans trancher une origine géographique ou un possible lien avec les rêves.
- source_word: תֹּאמַר לֵאמֹר
  choice: 'Tu diras … :'
  rationale: La formule hébraïque introduit les paroles qui suivent. En français actuel, les deux verbes apparentés se rendent naturellement par un verbe suivi de deux-points, sans le calque lourd « tu diras en disant ».
