id: JER.29.4
reference: Jeremiah 29:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/כָל הַ֨/גּוֹלָ֔ה אֲשֶׁר הִגְלֵ֥יתִי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/004.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, to all the exiles whom I have sent into exile from Jerusalem to Babylon:'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées, le Dieu d’Israël, à tous les exilés que j’ai déportés[a] de Jérusalem à Babylone :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que j’ai envoyés en exil ». Le verbe hébreu est causatif : il signifie faire partir en exil, déporter.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule consacrée du discours prophétique, à la fois naturelle en français et fidèle à la solennité de la formule hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend concrètement le pluriel hébreu dans le titre divin; « des puissances » serait plus large mais moins direct.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Reproduction directe et idiomatique de la construction hébraïque.
- source_word: לְכָל הַגּוֹלָה
  choice: à tous les exilés
  rationale: Le nom hébreu collectif désigne ici l’ensemble des personnes déportées; le pluriel français est clair et naturel.
- source_word: הִגְלֵיתִי
  choice: j’ai déportés
  rationale: Le hiphil de גלה exprime l’action causative de faire partir en exil. « Déporter » rend cette action avec concision.
- source_word: מִירוּשָׁלַם בָּבֶלָה
  choice: de Jérusalem à Babylone
  rationale: Conserve le point de départ marqué par מִן et la destination indiquée par le suffixe directionnel.
theological_decisions:
- issue: Action divine dans l’exil
  choice: « que j’ai déportés »
  alternative: « que j’ai laissé déporter » ou attribution directe aux Babyloniens
  rationale: La première personne hébraïque attribue explicitement la déportation à Yahweh; la traduction ne réduit pas cette action à une simple permission.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération préserve le nom propre présent dans le texte hébreu.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: des puissances; de l’univers
  rationale: « Des armées » conserve l’image lexicale sans identifier explicitement ces armées ni élargir le titre par interprétation.
translation_notes:
  register: Français international moderne, digne et lisible. La formule « Ainsi parle » maintient le registre prophétique. « Exilés » désigne naturellement la communauté concernée, tandis que « déportés » exprime clairement l’action causative et l’initiative divine.
