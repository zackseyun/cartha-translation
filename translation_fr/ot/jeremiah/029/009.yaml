  - severity: low
    issue: 'Note lexicale : « dans la fausseté »'
    rationale: « Dans la fausseté » est possible mais peu naturel en français et n’éclaire pas mieux l’hébreu. « Dans le mensonge » est la traduction littérale la plus nette; « de manière mensongère » explicite l’alternative adverbiale.
