  text: כִּ֣י בְ/שֶׁ֔קֶר הֵ֛ם נִבְּאִ֥ים לָ/כֶ֖ם בִּ/שְׁמִ֑/י לֹ֥א שְׁלַחְתִּ֖י/ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/009.yaml
  text: For they are prophesying falsely to you in my name[a]; I did not send them[c][b], declares Yahweh.
translation:
  language: fr
  text: Car ils prophétisent mensongèrement[a] à votre intention en mon nom ; je ne les ai pas envoyés — déclaration de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le mensonge » ; ou : « de manière mensongère ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH, traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la mise en garde précédente et conserve clairement la valeur causale du terme hébreu.
- source_word: בְשֶׁקֶר
  choice: faussement
  rationale: La locution signifie littéralement « dans le mensonge » ou « dans la fausseté ». L’adverbe français exprime naturellement que leur activité prophétique est mensongère.
- source_word: נִבְּאִים
  choice: ils prophétisent
  rationale: Le participe hébreu présente une action en cours ou caractéristique. Le présent français convient au contexte et reste naturel.
- source_word: לָכֶם
  choice: pour vous
  rationale: La préposition ל marque ici les destinataires ou bénéficiaires visés. « Pour vous » évite la tournure peu naturelle « ils vous prophétisent » tout en maintenant cette relation.
- source_word: בִשְׁמִי
  choice: en mon nom
  rationale: Conserve l’expression biblique indiquant qu’ils revendiquent l’autorité divine.
- source_word: לֹא שְׁלַחְתִּים
  choice: je ne les ai pas envoyés
  rationale: Le passé composé exprime naturellement en français le démenti divin concernant leur envoi et leur mandat.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique solennelle נְאֻם tout en conservant le nom divin présent dans le texte hébreu.
theological_decisions:
- issue: Autorisation divine de la prophétie
  choice: Les prophètes parlent mensongèrement en revendiquant le nom divin, tandis que Dieu nie explicitement les avoir envoyés.
  alternative: Comprendre seulement qu’ils transmettent un message erroné, sans insister sur une revendication mensongère d’autorité.
  rationale: Le contraste entre « en mon nom » et « je ne les ai pas envoyés » met directement en cause leur prétention à un mandat divin.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le tétragramme. La translittération « Yahweh » préserve le nom propre, tandis que la note signale l’usage traditionnel français.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe reste proche de l’hébreu sans employer le tour peu naturel « ils vous prophétisent ». Le tiret met en relief la formule prophétique finale.
