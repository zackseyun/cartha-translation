  source_fidelity: 'Le sens global est bien rendu : la causalité, la fausseté de la prophétie, l’invocation du nom divin et le démenti de l’envoi sont conservés. Toutefois, « pour vous » ne rend pas correctement לָכֶם ici, qui désigne les destinataires : « à votre intention » / « à vous » convient mieux. La formulation retenue maintient également la portée du participe hébreu.'
  naturalness: « Ils prophétisent faussement à votre intention » est naturel et clair en français international actuel. « Déclaration de Yahweh » est une formule prophétique française établie et soutenue.
  terminology: « En mon nom », « envoyés », « Yahweh » et « déclaration de Yahweh » rendent avec justesse les expressions et le registre prophétiques. La note sur בְּשֶׁקֶר doit éviter « fausseté », moins idiomatique et moins précise ici que « mensonge » ou « de manière mensongère ».
