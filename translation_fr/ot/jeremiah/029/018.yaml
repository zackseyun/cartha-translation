  text: וְ/רָֽדַפְתִּי֙ אַֽחֲרֵי/הֶ֔ם בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וּ/נְתַתִּ֨י/ם ל/זועה לְ/כֹ֣ל מַמְלְכ֣וֹת הָ/אָ֗רֶץ לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/שְׁרֵקָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁר הִדַּחְתִּ֥י/ם שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/018.yaml
  text: And I will pursue them with the sword[a], with famine, and with pestilence, and I will make them a horror to all the kingdoms of the earth, a curse, a desolation, an object of hissing[b], and a reproach among all the nations where I have driven them.
translation:
  language: fr
  text: Je les poursuivrai par l’épée, par la famine et par la peste. Je ferai d’eux une source d’épouvante[a] pour tous les royaumes de la terre, une malédiction, une désolation, un objet de sifflements[b] et un sujet d’opprobre parmi toutes les nations où je les ai chassés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une source de terreur ». Le terme hébreu peut évoquer l’épouvante, la terreur ou le tremblement ; il désigne ici ce qui suscite l’effroi.
    reason: lexical_alternative
  - marker: b
    text: Ou « un objet de sifflement ». Le sifflement peut exprimer le mépris ou la dérision des témoins.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדַפְתִּי אַחֲרֵיהֶם
  choice: Je les poursuivrai
  rationale: Le verbe רדף avec אַחֲרֵי exprime une poursuite active et persistante. « Poursuivrai » est naturel en français et évite le sens plus étroit que pourrait prendre « persécuterai ».
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: par l’épée, par la famine et par la peste
  rationale: La traduction conserve la triade prophétique traditionnelle des instruments du jugement. « Peste » désigne ici une maladie épidémique meurtrière, tandis que « famine » convient à une calamité collective.
- source_word: וּנְתַתִּים לְזועה
  choice: Je ferai d’eux un objet d’épouvante
  rationale: La construction signifie que ces personnes deviendront, aux yeux des royaumes, un spectacle suscitant l’effroi. « Objet d’épouvante » conserve ce sens résultatif et le registre prophétique.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: pour tous les royaumes de la terre
  rationale: 'La préposition ל marque ici la relation ou le résultat : ils deviendront un objet d’épouvante aux yeux de tous les royaumes.'
- source_word: לְאָלָה
  choice: une malédiction
  rationale: אָלָה peut désigner une malédiction, parfois liée à un serment. Dans cette série de formules de jugement public, « une malédiction » est clair et suffisamment large.
- source_word: וּלְשַׁמָּה
  choice: un spectacle de désolation
  rationale: שַׁמָּה peut évoquer la désolation ou la consternation. Cette formulation préserve l’image d’une ruine offerte au regard tout en distinguant le terme de l’« épouvante » déjà mentionnée.
- source_word: וְלִשְׁרֵקָה
  choice: un objet de sifflements
  rationale: שְׁרֵקָה désigne la réaction sonore, probablement méprisante ou stupéfaite, des témoins. La formulation précise qu’ils en sont la cible.
- source_word: וּלְחֶרְפָּה
  choice: et de honte
  rationale: חֶרְפָּה recouvre la honte publique, l’opprobre ou les outrages. « Honte » est actuel et compréhensible, tout en gardant la dimension de déshonneur public.
- source_word: בְּכָל הַגּוֹיִם אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: parmi toutes les nations où je les ai chassés
  rationale: Le hiphil de נדח exprime le fait de chasser ou disperser. « Parmi » convient à la présence des exilés au milieu des nations, et le passé composé relie cette action antérieure à leur situation présente.
theological_decisions:
- issue: L’action divine dans le jugement et l’exil
  choice: 'Conserver les actions divines explicites à la première personne : « Je les poursuivrai », « Je ferai » et « je les ai chassés ».'
  alternative: Employer des tournures passives ou impersonnelles qui atténueraient l’action de Dieu.
  rationale: L’hébreu attribue explicitement à Dieu la poursuite, la transformation en signe de jugement et la dispersion. La traduction maintient cette tension théologique sans l’adoucir.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « par » souligne les trois instruments du jugement. Les expressions « objet d’épouvante » et « objet de sifflements » conservent les images publiques de la formule hébraïque sans les réduire à une interprétation unique.
