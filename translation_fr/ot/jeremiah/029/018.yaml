revisions:
- from: Je les poursuivrai par l’épée, par la famine et par la peste. Je ferai d’eux un objet d’épouvante[a] pour tous les royaumes de la terre, une malédiction, un spectacle de désolation, un objet de sifflements[b] et de honte parmi toutes les nations où je les ai chassés.
  to: Je les poursuivrai par l’épée, par la famine et par la peste. Je ferai d’eux une source d’épouvante[a] pour tous les royaumes de la terre, une malédiction, une désolation, un objet de sifflements[b] et un sujet d’opprobre parmi toutes les nations où je les ai chassés.
  rationale: La révision retire l’ajout interprétatif de « spectacle », rend plus précisément la dimension publique de חֶרְפָּה par « opprobre », et simplifie la note sur les sifflements. Elle conserve l’action divine explicite, le registre prophétique et les ambiguïtés lexicales pertinentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les principaux termes du texte hébreu sont bien rendus : poursuite, triade épée–famine–peste, action divine explicite, malédiction, sifflement et dispersion. Toutefois, « spectacle de désolation » ajoute l’idée de spectacle, qui n’est pas exprimée par שַׁמָּה, et « honte » affaiblit quelque peu la nuance publique de reproche/opprobre de חֶרְפָּה.'
  naturalness: Le français est globalement clair et d’un registre prophétique approprié. « Pour tous les royaumes » est toutefois moins direct que « pour tous les royaumes » dans une construction d’« objet de... »; la formulation révisée « une source d’épouvante pour tous les royaumes » est plus idiomatique. La série nominale gagne aussi en cohérence avec « une désolation » et « un sujet d’opprobre ».
  terminology: « Épée », « famine », « peste », « malédiction » et « sifflements » conviennent. « Opprobre » restitue mieux le déshonneur public et la réprobation exprimés par חֶרְפָּה que le simple terme « honte ». « Désolation » conserve la portée du terme hébreu sans ajouter une notion de mise en spectacle.
  issues:
  - severity: medium
    issue: « un spectacle de désolation » pour וּלְשַׁמָּה
    rationale: Le mot « spectacle » introduit une composante absente du terme hébreu, qui désigne ici la désolation ou un état désolé. « Une désolation » est plus sobre et plus fidèle.
  - severity: low
    issue: « de honte » pour וּלְחֶרְפָּה
    rationale: La honte peut être intérieure ou générale, tandis que חֶרְפָּה met particulièrement en avant le reproche, l’insulte et le déshonneur public. « Opprobre » préserve mieux cette nuance.
  - severity: low
    issue: 'Note b : « coups de sifflet »'
    rationale: Cette expression suggère des signaux ponctuels et n’est pas nécessaire pour expliquer שְׁרֵקָה. Il vaut mieux conserver l’ambiguïté entre sifflement et sifflement moqueur, sans surinterpréter.
  revised_text: Je les poursuivrai par l’épée, par la famine et par la peste. Je ferai d’eux une source d’épouvante[a] pour tous les royaumes de la terre, une malédiction, une désolation, un objet de sifflements[b] et un sujet d’opprobre parmi toutes les nations où je les ai chassés.
  revised_footnotes:
  - marker: a
    text: Ou « une source de terreur ». Le terme hébreu peut évoquer l’épouvante, la terreur ou le tremblement ; il désigne ici ce qui suscite l’effroi.
    reason: lexical_alternative
  - marker: b
    text: Ou « un objet de sifflement ». Le sifflement peut exprimer le mépris ou la dérision des témoins.
    reason: lexical_alternative
  revision_rationale: La révision retire l’ajout interprétatif de « spectacle », rend plus précisément la dimension publique de חֶרְפָּה par « opprobre », et simplifie la note sur les sifflements. Elle conserve l’action divine explicite, le registre prophétique et les ambiguïtés lexicales pertinentes.
