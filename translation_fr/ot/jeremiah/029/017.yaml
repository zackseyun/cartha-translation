  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִי֙ מְשַׁלֵּ֣חַ בָּ֔/ם אֶת הַ/חֶ֖רֶב אֶת הָ/רָעָ֣ב וְ/אֶת הַ/דָּ֑בֶר וְ/נָתַתִּ֣י אוֹתָ֗/ם כַּ/תְּאֵנִים֙ הַ/שֹּׁ֣עָרִ֔ים אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/017.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am sending against them the sword, the famine, and the pestilence, and I will make them like rotten figs that cannot be eaten because of their badness.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : Voici, j’envoie contre eux l’épée, la famine et la peste, et je les rendrai semblables à des figues si mauvaises qu’on ne peut les manger.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par le terme français clair et concret « armées », sans limiter le titre aux seules armées humaines.
- source_word: הִנְנִי מְשַׁלֵּחַ בָּם
  choice: Voici, j’envoie contre eux
  rationale: « Voici » maintient la force déictique solennelle de הִנְנִי, tandis que le présent « j’envoie » restitue la construction participiale vive et imminente; « contre eux » convient au contexte hostile.
- source_word: הַחֶרֶב אֶת הָרָעָב וְאֶת הַדָּבֶר
  choice: l’épée, la famine et la peste
  rationale: Préserve la triade concrète et traditionnelle des jugements prophétiques; « peste » désigne naturellement ici une épidémie meurtrière.
- source_word: וְנָתַתִּי אוֹתָם
  choice: je les rendrai semblables à
  rationale: Exprime en français naturel la valeur résultative de נתן suivi de la comparaison, sans ajouter l’idée non explicite de les livrer.
- source_word: הַתְּאֵנִים הַשֹּׁעָרִים
  choice: des figues pourries
  rationale: « Pourries » concrétise dans l’image alimentaire le caractère extrêmement mauvais ou répugnant exprimé par שֹׁעָרִים.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: qu’on ne peut manger tant elles sont mauvaises
  rationale: Rend l’inaptitude pratique à être mangées et conserve la causalité de מֵרֹעַ. La tournure « tant elles sont mauvaises » est idiomatique tout en évitant de moraliser le terme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La translittération conserve explicitement le nom divin du texte hébreu sans substituer un titre ni privilégier une forme confessionnelle française traditionnelle.
- issue: Portée du titre צְבָאוֹת
  choice: des armées
  alternative: de l’univers / des puissances célestes
  rationale: « Des armées » garde la métaphore et son ampleur potentielle sans trancher entre armées terrestres et célestes.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique est conservée par « Ainsi parle » et « Voici », tandis que le reste de la phrase évite les archaïsmes. Aucun marqueur de note n’est requis puisque les choix peuvent être rendus directement sans masquer une ambiguïté déterminante.
