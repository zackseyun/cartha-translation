  text: וּ/קְרָאתֶ֤ם אֹתִ/י֙ וַֽ/הֲלַכְתֶּ֔ם וְ/הִתְפַּלַּלְתֶּ֖ם אֵלָ֑/י וְ/שָׁמַעְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/012.yaml
  text: Then you will call on me and come and pray to me[b][a], and I will hear you.
translation:
  language: fr
  text: Alors vous m’invoquerez, vous irez prier auprès de moi[a], et je vous entendrai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous irez » ou « vous marcherez ». Le verbe peut évoquer un mouvement en vue de la prière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je vous écouterai » ou « je vous prêterai attention ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם אֹתִי
  choice: vous m’invoquerez
  rationale: Avec Dieu comme objet, קרא exprime ici l’appel adressé à lui. « Invoquer » est naturel en français dans le contexte de la prière et conserve l’idée d’un appel direct.
- source_word: וַהֲלַכְתֶּם
  choice: vous viendrez
  rationale: Le verbe הלך signifie littéralement « aller, marcher ». Dans cette suite, il évoque vraisemblablement le fait de s’approcher de Dieu pour prier; « venir » adopte naturellement le point de vue de Dieu, qui parle.
- source_word: וְהִתְפַּלַּלְתֶּם אֵלַי
  choice: me prier
  rationale: Le hitpael de פלל désigne ici la prière adressée à Dieu. La construction française « venir me prier » rend clairement la direction exprimée par אֵלַי sans lourdeur.
- source_word: וְשָׁמַעְתִּי אֲלֵיכֶם
  choice: je vous entendrai
  rationale: שמע avec אֶל peut signifier entendre, écouter ou prêter attention. « Je vous entendrai » conserve la formulation ouverte du texte sans préciser à tort que toute demande sera nécessairement accordée.
theological_decisions:
- issue: La réponse de Dieu à la prière
  choice: je vous entendrai
  alternative: je vous écouterai; je prêterai attention à vous
  rationale: Le texte affirme que Dieu entendra les exilés lorsqu’ils l’invoqueront. « Entendrai » préserve la tension entre l’audition, l’attention favorable et la réponse, sans transformer cette promesse en garantie explicite que toute requête sera exaucée.
translation_notes:
  register: Français international moderne, clair et digne. « Invoquer » convient au contexte religieux sans être archaïque; « entendre » maintient l’ambiguïté sémantique du verbe hébreu.
