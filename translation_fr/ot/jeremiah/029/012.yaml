review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : invocation de Dieu, prière, puis réponse divine. Toutefois, « vous viendrez me prier » est syntaxiquement possible mais peu naturel et peut être compris comme « me supplier », plutôt que comme une prière adressée à Dieu. Le déplacement exprimé par וַהֲלַכְתֶּם doit aussi rester identifiable sans affirmer que son sens est certainement « venir ».'
  naturalness: « Alors vous m’invoquerez » et « je vous entendrai » sont naturels dans un registre biblique moderne. « Vous irez prier auprès de moi » rend plus explicitement et naturellement en français le mouvement suivi de la prière, sans la construction ambiguë « me prier ».
  terminology: « Invoquer » convient à קרא dans ce contexte religieux. « Entendre » préserve utilement l’ouverture de שמע avec אֶל, sans imposer l’idée plus forte d’exaucement. La note b doit employer une formulation française plus idiomatique pour l’alternative d’attention favorable.
  issues:
  - severity: medium
    issue: Construction « vous viendrez me prier »
    rationale: En français moderne, « prier quelqu’un » se comprend fréquemment comme « supplier/demander à quelqu’un ». La construction ne marque pas clairement que la prière est adressée à Dieu et rend le mouvement de הלך moins visible.
  - severity: low
    issue: Note a trop affirmative sur « venir auprès de Dieu »
    rationale: Le verbe הלך signifie littéralement « aller/marcher »; son rôle exact dans la séquence peut être discuté. La note devrait signaler l’alternative sans présenter l’interprétation « venir » comme probable.
  - severity: low
    issue: Formulation de la note b
    rationale: « Je prêterai attention à vous » est grammatical, mais « je vous prêterai attention » est plus fluide dans ce contexte; « je vous écouterai » suffit également comme alternative proche.
  revised_text: Alors vous m’invoquerez, vous irez prier auprès de moi[a], et je vous entendrai[b].
  revised_footnotes:
