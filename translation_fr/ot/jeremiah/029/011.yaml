id: JER.29.11
reference: Jeremiah 29:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ אָנֹכִ֨י יָדַ֜עְתִּי אֶת הַ/מַּחֲשָׁבֹ֗ת אֲשֶׁ֧ר אָנֹכִ֛י חֹשֵׁ֥ב עֲלֵי/כֶ֖ם נְאֻם יְהוָ֑ה מַחְשְׁב֤וֹת שָׁלוֹם֙ וְ/לֹ֣א לְ/רָעָ֔ה לָ/תֵ֥ת לָ/כֶ֖ם אַחֲרִ֥ית וְ/תִקְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/011.yaml
  text: For I know the plans that I have for you[a], declares Yahweh, plans for peace and not for harm[b], to give you a future and a hope.
translation:
  language: fr
  text: 'Car moi, je connais les projets que je forme à votre égard — déclare Yahweh — : des projets de paix[a] et non de malheur[b], afin de vous donner un avenir et une espérance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « paix » peut aussi englober le bien-être, l’intégrité et la prospérité.
    reason: lexical_alternative
  - marker: b
    text: « Malheur » peut également se rendre par « désastre » ou « calamité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication et le fondement de l’exhortation précédente, tout en conservant naturellement le lien logique en français.
- source_word: יָדַעְתִּי
  choice: je connais
  rationale: Le parfait du verbe statif exprime ici une connaissance ferme et présente; le présent français convient mieux que « j’ai connu ».
- source_word: הַמַּחֲשָׁבוֹת / חֹשֵׁב
  choice: les projets que je forme
  rationale: מַחֲשָׁבוֹת désigne ici des pensées conçues comme des intentions ou projets; « que je forme » préserve le lien avec le verbe חֹשֵׁב sans la lourdeur de « les projets que je projette ».
- source_word: עֲלֵיכֶם
  choice: à votre égard
  rationale: Rend l’orientation des intentions divines envers les destinataires sans ajouter d’emblée une nuance bénéficiaire absente de la seule préposition.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Conserve le caractère solennel de la formule prophétique et rend directement le nom divin יהוה par « Yahweh ».
- source_word: מַחְשְׁבוֹת שָׁלוֹם
  choice: projets de paix
  rationale: '« Paix » est le correspondant direct de שָׁלוֹם et garde sa richesse contextuelle: paix, intégrité et bien-être.'
- source_word: וְלֹא לְרָעָה
  choice: et non de malheur
  rationale: Dans l’opposition à שָׁלוֹם, רָעָה désigne vraisemblablement le malheur ou le désastre plutôt que le mal moral.
- source_word: לָתֵת לָכֶם
  choice: afin de vous donner
  rationale: Exprime clairement la valeur finale de l’infinitif לָתֵת.
- source_word: אַחֲרִית
  choice: un avenir
  rationale: Dans ce contexte de restauration promise, le terme désigne l’issue à venir ou l’avenir, plutôt qu’une simple fin.
- source_word: תִקְוָה
  choice: une espérance
  rationale: Terme français digne et courant dans le registre biblique, exprimant une attente confiante.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette fonction plutôt que de lui substituer un titre.
- issue: Portée sémantique de שָׁלוֹם
  choice: paix
  alternative: bien-être; prospérité
  rationale: Le texte principal conserve le terme français le plus direct. Dans ce contexte, « paix » ne se limite pas à l’absence de conflit, mais peut inclure le bien-être et l’intégrité; cette ampleur est signalée en note.
- issue: Portée de la promesse
  choice: maintien du pluriel « vous » sans individualisation
  alternative: formulation au singulier ou application individuelle explicite
  rationale: Les suffixes hébreux sont pluriels et s’adressent aux exilés comme communauté; la traduction évite de transformer silencieusement cette promesse collective en garantie individuelle.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « les projets que je forme à votre égard » conserve l’écho lexical de l’hébreu tout en restant naturelle. Les tirets isolent la formule prophétique sans alourdir la phrase.
