revisions:
- from: Prenez des femmes et ayez des fils et des filles ; prenez des femmes pour vos fils et donnez vos filles en mariage[a], afin qu’elles aient des fils et des filles. Multipliez-vous là-bas et ne diminuez pas en nombre[b].
  to: Prenez des femmes pour épouses et engendrez des fils et des filles ; prenez des épouses pour vos fils et donnez vos filles en mariage[a], afin qu’elles aient des fils et des filles. Multipliez-vous là et ne devenez pas moins nombreux[b].
  rationale: La révision lève l’ambiguïté française des deux occurrences de « prendre des femmes » en explicitant le cadre matrimonial, restitue la valeur masculine de וְהוֹלִידוּ par « engendrez », et emploie des formulations françaises plus naturelles pour שָׁם et pour l’interdiction de décroître numériquement. Les notes et leurs ancres sont conservées et correspondent au texte révisé.
