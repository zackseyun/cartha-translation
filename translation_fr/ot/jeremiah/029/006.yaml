base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/006.yaml
  text: Take wives and father sons and daughters[a]; and take wives for your sons, and give your daughters to men, so that they may bear sons and daughters; multiply there[c][b], and do not decrease.
translation:
  language: fr
  text: Prenez des femmes pour épouses et engendrez des fils et des filles ; prenez des épouses pour vos fils et donnez vos filles en mariage[a], afin qu’elles aient des fils et des filles. Multipliez-vous là et ne devenez pas moins nombreux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnez vos filles à des hommes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne devenez pas peu nombreux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ נָשִׁים
  choice: Prenez des femmes
  rationale: L’expression hébraïque désigne le fait de prendre des femmes pour épouses. Cette formulation conserve l’image et l’impératif du texte source, tandis que le contexte matrimonial en précise le sens.
- source_word: וְהוֹלִידוּ
  choice: ayez
  rationale: Le hiphil de ילד, avec des sujets masculins, peut signifier « engendrer ». En français actuel, « ayez des fils et des filles » exprime naturellement l’idée sans employer le terme plus soutenu « engendrez ».
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: L’hébreu nomme explicitement les deux sexes ; la traduction les conserve plutôt que de généraliser par « des enfants ».
- source_word: וּקְחוּ לִבְנֵיכֶם נָשִׁים
  choice: prenez des femmes pour vos fils
  rationale: La formulation suit de près l’expression hébraïque et indique, dans le contexte, qu’il faut procurer des épouses aux fils.
- source_word: וְאֶת בְּנוֹתֵיכֶם תְּנוּ לַאֲנָשִׁים
  choice: donnez vos filles en mariage
  rationale: Littéralement, le texte dit de donner les filles « à des hommes ». En français, « donner en mariage » rend clairement et dignement l’idiome matrimonial sans suggérer un simple transfert de personnes.
- source_word: וְתֵלַדְנָה
  choice: afin qu’elles aient
  rationale: L’imparfait hébreu après les impératifs exprime vraisemblablement le résultat recherché. « Afin que » conserve cette nuance de finalité.
- source_word: וּרְבוּ
  choice: Multipliez-vous
  rationale: Le verbe רבה décrit ici l’accroissement numérique de la communauté et fait écho au langage biblique de la multiplication.
- source_word: שָׁם
  choice: là-bas
  rationale: L’adverbe renvoie au lieu d’exil mentionné dans le contexte. « Là-bas » est direct et naturel en français.
- source_word: וְאַל תִּמְעָטוּ
  choice: ne diminuez pas en nombre
  rationale: Le contraste avec « multipliez-vous » montre qu’il est question de ne pas devenir moins nombreux. L’ajout « en nombre » évite une formulation française ambiguë.
