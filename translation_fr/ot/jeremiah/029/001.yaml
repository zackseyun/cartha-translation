source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׁלַ֛ח יִרְמְיָ֥ה הַ/נָּבִ֖יא מִ/ירוּשָׁלִָ֑ם אֶל יֶ֜תֶר זִקְנֵ֣י הַ/גּוֹלָ֗ה וְ/אֶל הַ/כֹּהֲנִ֤ים וְ/אֶל הַ/נְּבִיאִים֙ וְ/אֶל כָּל הָ/עָ֔ם אֲשֶׁ֨ר הֶגְלָ֧ה נְבֽוּכַדְנֶאצַּ֛ר מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/001.yaml
  text: These are the words of the letter that Jeremiah the prophet sent from Jerusalem to the remaining elders of the exiles[a], and to the priests, the prophets[d][c][b], and all the people whom Nebuchadnezzar had carried away from Jerusalem to Babylon.
translation:
  language: fr
  text: Voici le contenu de la lettre que le prophète Jérémie envoya de Jérusalem aux anciens qui restaient parmi les exilés[a], aux prêtres, aux prophètes et à tout le peuple que Nabuchodonosor avait déporté de Jérusalem à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : «au reste des anciens de la communauté exilée». L’hébreu peut désigner les anciens qui subsistaient parmi les déportés ou parler du «reste» des anciens liés à l’exil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה דִּבְרֵי הַסֵּפֶר
  choice: Voici le contenu de la lettre
  rationale: La formule présente le texte qui suit. דִּבְרֵי désigne ici le contenu ou les paroles, et סֵפֶר un document écrit; puisque celui-ci est envoyé à des destinataires précis, «lettre» convient au contexte. «Voici le contenu» est naturel en français tout en conservant la fonction présentative de l’hébreu.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Ordre idiomatique en français pour le nom accompagné de son titre.
- source_word: יֶתֶר זִקְנֵי הַגּוֹלָה
  choice: les anciens qui restaient parmi les exilés
  rationale: יֶתֶר exprime ce qui reste, tandis que הַגּוֹלָה peut désigner la communauté déportée. Cette formulation rend clairement les anciens encore présents au sein de cette communauté sans préciser pourquoi ils «restaient».
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים וְכָל הָעָם
  choice: aux prêtres, aux prophètes et à tout le peuple
  rationale: Rend directement les groupes de destinataires et conserve l’élargissement des responsables à l’ensemble du peuple.
- source_word: אֲשֶׁר הֶגְלָה
  choice: que … avait déporté
  rationale: Le hiphil de גלה exprime une mise en exil forcée. «Déporter» est précis, courant et historiquement approprié; le plus-que-parfait marque l’antériorité par rapport à l’envoi de la lettre.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française conventionnelle et largement reconnue du nom royal.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le suffixe directionnel indique un déplacement vers Babylone, naturellement rendu par «à» après «déporter».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste formelle sans archaïsmes. «Voici le contenu de la lettre» évite le calque peu naturel «voici les paroles de la lettre», tandis que «déporté» restitue explicitement la contrainte exprimée par le verbe hébreu.
