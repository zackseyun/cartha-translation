  text: וְ/נִמְצֵ֣אתִי לָ/כֶם֮ נְאֻם יְהוָה֒ וְ/שַׁבְתִּ֣י אֶת שבית/כם וְ/קִבַּצְתִּ֣י אֶ֠תְ/כֶם מִֽ/כָּל הַ/גּוֹיִ֞ם וּ/מִ/כָּל הַ/מְּקוֹמ֗וֹת אֲשֶׁ֨ר הִדַּ֧חְתִּי אֶתְ/כֶ֛ם שָׁ֖ם נְאֻם יְהוָ֑ה וַ/הֲשִׁבֹתִ֣י אֶתְ/כֶ֔ם אֶל הַ֨/מָּק֔וֹם אֲשֶׁר הִגְלֵ֥יתִי אֶתְ/כֶ֖ם מִ/שָּֽׁם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/014.yaml
  text: And I will let myself be found by you[a], declares Yahweh, and I will restore your fortunes and gather you from all the nations and from all the places where I have driven you, declares Yahweh, and I will bring you back to the place from which I sent you into exile.
translation:
  language: fr
  text: Je me laisserai trouver par vous, déclare Yahweh. Je rétablirai votre situation[a] et je vous rassemblerai de toutes les nations et de tous les lieux où je vous ai chassés, déclare Yahweh. Je vous ramènerai au lieu d’où je vous ai envoyés en exil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je rétablirai votre captivité » ; selon une autre lecture du texte hébreu, « je ramènerai vos captifs ». L’expression est un idiome qui désigne le renversement d’une situation d’exil et de détresse.'
    reason: Alternative lexicale liée à un idiome hébreu et à une lecture textuelle possible de sa forme.
lexical_decisions:
- source_word: וְנִמְצֵאתִי לָכֶם
  choice: Je me laisserai trouver par vous
  rationale: Le nifal de מצא signifie ici « être trouvé ». La tournure pronominale et causative naturelle en français conserve à la fois l’image de la recherche et l’initiative divine, sans aller jusqu’à l’interprétation « je me révélerai ».
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique solennelle est rendue dans un français actuel et direct. Le nom divin יהוה est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: וְשַׁבְתִּי אֶת שביתכם
  choice: Je rétablirai votre situation
  rationale: L’expression שׁוּב אֶת־שְׁבוּת/שְׁבִית est un idiome de restauration après l’exil ou la détresse. « Rétablir votre situation » en exprime le sens global sans limiter la promesse au retour matériel des captifs; les lectures plus littérales sont signalées en note.
- source_word: וְקִבַּצְתִּי אֶתְכֶם
  choice: je vous rassemblerai
  rationale: קבץ désigne couramment le rassemblement d’un peuple dispersé; « rassembler » est précis et naturel dans ce contexte de retour.
- source_word: מִכָּל הַגּוֹיִם וּמִכָּל הַמְּקוֹמוֹת
  choice: de toutes les nations et de tous les lieux
  rationale: La traduction conserve le parallélisme et l’ampleur universelle des deux groupes prépositionnels hébreux.
- source_word: אֲשֶׁר הִדַּחְתִּי אֶתְכֶם שָׁם
  choice: où je vous ai chassés
  rationale: Le hifil de נדח exprime l’action de repousser ou de bannir. « Chassés » maintient la force du jugement divin, plus nettement que « dispersés ».
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם
  choice: Je vous ramènerai
  rationale: 'Le hifil de שוב est causatif: Yahweh fera revenir le peuple. « Ramener » rend ce sens clairement et idiomatiquement.'
- source_word: אֲשֶׁר הִגְלֵיתִי אֶתְכֶם מִשָּׁם
  choice: d’où je vous ai envoyés en exil
  rationale: Le hifil de גלה signifie envoyer ou déporter en exil. Cette formulation moderne explicite le sens inhérent au verbe tout en conservant Yahweh comme agent.
theological_decisions:
- issue: Sens de l’idiome שׁוּב אֶת־שְׁבוּת/שְׁבִית
  choice: Je rétablirai votre situation
  alternative: Je mettrai fin à votre captivité; je ramènerai vos captifs
  rationale: L’expression peut évoquer littéralement la captivité ou les captifs, mais fonctionne souvent comme un idiome désignant le renversement d’une condition de jugement et de détresse. Le contexte précise ensuite le rassemblement et le retour géographiques; la formulation retenue préserve donc la portée plus large de la restauration, tandis que la note maintient les possibilités littérales.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases ont été légèrement segmentées pour une lecture naturelle, sans modifier l’enchaînement des promesses. Le nom divin est rendu par « Yahweh ». Le marqueur [a] est placé après l’expression qu’il explique.
