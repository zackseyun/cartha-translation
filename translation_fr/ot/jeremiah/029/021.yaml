  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֶל אַחְאָ֤ב בֶּן קֽוֹלָיָה֙ וְ/אֶל צִדְקִיָּ֣הוּ בֶן מַֽעֲשֵׂיָ֔ה הַֽ/נִּבְּאִ֥ים לָ/כֶ֛ם בִּ/שְׁמִ֖/י שָׁ֑קֶר הִנְ/נִ֣י נֹתֵ֣ן אֹתָ֗/ם בְּ/יַד֙ נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/הִכָּ֖/ם לְ/עֵינֵי/כֶֽם־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, concerning Ahab son of Kolaiah and Zedekiah son of Maaseiah, who are prophesying a lie to you in my name: Behold, I am giving them into the hand of Nebuchadnezzar king of Babylon, and he will strike them down before your eyes.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées, le Dieu d’Israël, au sujet d’Achab, fils de Qolaya, et de Sédécias, fils de Maaséya, qui vous prophétisent des mensonges en mon nom : Voici que je les livre au pouvoir de Nabuchodonosor[a], roi de Babylone, et il les frappera sous vos yeux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici une forme du nom correspondant à « Nabuchodrezzar » ; « Nabuchodonosor » est la forme traditionnelle en français.
    reason: Variante de transcription du nom propre.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule consacrée du messager prophétique, à la fois concise, solennelle et naturelle en français biblique moderne.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre; « des armées » rend clairement צְבָאוֹת et conserve sa portée souveraine et guerrière.
- source_word: אֶל
  choice: au sujet de
  rationale: La préposition introduit ici les personnes visées par l’oracle, et non ses destinataires directs.
- source_word: הַנִּבְּאִים לָכֶם בִּשְׁמִי שָׁקֶר
  choice: qui vous prophétisent le mensonge en mon nom
  rationale: Le participe exprime leur activité en cours; « le mensonge » conserve la force substantivale de שָׁקֶר et l’idée d’une prétendue autorisation divine.
- source_word: הִנְנִי נֹתֵן אֹתָם בְּיַד
  choice: Voici que je les livre au pouvoir de
  rationale: « Voici que » maintient l’annonce emphatique, tandis que « livrer au pouvoir de » exprime naturellement en français l’image hébraïque de remettre quelqu’un dans la main d’un autre.
- source_word: וְהִכָּם
  choice: et il les frappera
  rationale: Cette formulation conserve la gravité du jugement sans préciser explicitement « tuer », nuance que le verbe seul n’impose pas.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: La translittération préserve le nom propre révélé dans le texte au lieu de lui substituer un titre; la forme « Yahweh » assure aussi la cohérence éditoriale de la POB.
- issue: Portée du verbe de jugement וְהִכָּם
  choice: il les frappera
  alternative: il les fera mourir
  rationale: Le contexte annonce un châtiment très grave, vraisemblablement mortel, mais le verbe hébreu ne rend pas nécessaire l’explicitation de la mort.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent les formes françaises courantes lorsqu’elles sont bien établies; « Qolaya » et « Maaséya » restent proches de l’hébreu. La structure solennelle de l’oracle est conservée sans archaïsmes inutiles.
