  text: וְ/דִרְשׁ֞וּ אֶת שְׁל֣וֹם הָ/עִ֗יר אֲשֶׁ֨ר הִגְלֵ֤יתִי אֶתְ/כֶם֙ שָׁ֔מָּ/ה וְ/הִתְפַּֽלְל֥וּ בַעֲדָ֖/הּ אֶל יְהוָ֑ה כִּ֣י בִ/שְׁלוֹמָ֔/הּ יִהְיֶ֥ה לָ/כֶ֖ם שָׁלֽוֹם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/007.yaml
  text: Seek the welfare of the city where I have sent you into exile[a], and pray to Yahweh on its behalf, for in its welfare you will have welfare.
translation:
  language: fr
  text: Recherchez le bien-être de la ville où je vous ai exilés[a], et priez Yahweh en sa faveur, car de son bien-être dépendra le vôtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la paix » ou « la prospérité » dans l’ensemble du verset. Le même mot hébreu, shalom, est employé pour la ville et pour les exilés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִרְשׁוּ
  choice: Recherchez
  rationale: L’impératif דרשׁ exprime ici une démarche active visant le bien de la ville. « Recherchez » en conserve la force et l’ampleur sans préciser artificiellement les moyens d’action.
- source_word: שְׁלוֹם ... בִשְׁלוֹמָהּ ... שָׁלוֹם
  choice: bien-être ... bien-être ... le vôtre
  rationale: שׁלום désigne ici globalement la paix, la stabilité et la prospérité de la communauté. La reprise de « bien-être » rend visible la répétition hébraïque; « le vôtre » évite une lourdeur finale tout en maintenant clairement le même concept.
- source_word: הָעִיר
  choice: la ville
  rationale: Le nom défini renvoie à la ville où vivent les exilés; « la ville » est le rendu français naturel.
- source_word: אֲשֶׁר הִגְלֵיתִי אֶתְכֶם שָׁמָּה
  choice: où je vous ai exilés
  rationale: Le hiphil de גלה indique que Dieu a causé leur exil. Cette formulation concise conserve son rôle d’agent, tandis que שָׁמָּה est naturellement intégré par « où ».
- source_word: וְהִתְפַּלְלוּ
  choice: et priez
  rationale: Le hitpael impératif signifie directement « priez »; le complément suivant précise que cette prière est faite pour la ville.
- source_word: בַעֲדָהּ
  choice: en sa faveur
  rationale: La préposition בעד avec suffixe indique une prière faite pour le bien de la ville. « En sa faveur » est clair et idiomatique.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est translittéré « Yahweh », ce qui préserve le nom propre présent dans le texte hébreu.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison des impératifs précédents; « car » exprime naturellement ce rapport logique.
- source_word: כִּי בִשְׁלוֹמָהּ יִהְיֶה לָכֶם שָׁלוֹם
  choice: car de son bien-être dépendra le vôtre
  rationale: La formulation française exprime naturellement que le bien-être des exilés est lié à celui de la ville. Elle ne réduit pas שׁלום à la seule prospérité économique ou à l’absence de guerre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: « Yahweh » conserve le nom personnel du texte source plutôt que de lui substituer un titre.
- issue: Lien entre le bien-être de la ville et celui des exilés
  choice: de son bien-être dépendra le vôtre
  alternative: dans son bien-être, vous aurez le bien-être
  rationale: Le choix exprime le rapport étroit établi par l’hébreu sans déterminer s’il s’agit d’une causalité exhaustive; il préserve aussi la portée globale de שׁלום.
translation_notes:
  register: Français international moderne, clair et digne. Le tour « de son bien-être dépendra le vôtre » évite le calque peu naturel « dans son bien-être » tout en gardant le parallélisme conceptuel du texte hébreu.
