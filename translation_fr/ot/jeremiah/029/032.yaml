source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֨י פֹקֵ֜ד עַל שְׁמַעְיָ֣ה הַ/נֶּחֱלָמִי֮ וְ/עַל זַרְע/וֹ֒ לֹא יִהְיֶ֨ה ל֜/וֹ אִ֣ישׁ יוֹשֵׁ֣ב בְּ/תוֹךְ הָ/עָ֣ם הַ/זֶּ֗ה וְ/לֹֽא יִרְאֶ֥ה בַ/טּ֛וֹב אֲשֶׁר אֲנִ֥י עֹשֶֽׂה לְ/עַמִּ֖/י נְאֻם יְהוָ֑ה כִּֽי סָרָ֥ה דִבֶּ֖ר עַל יְהוָֽה־־־־׀׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/032.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to punish Shemaiah the Nehelamite and his offspring. He will not have a man dwelling among this people, nor will he see the good that I am doing for my people, declares Yahweh[b], because he has spoken rebellion against Yahweh.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh : « Je vais demander des comptes à Shemaïa le Néhélamite[a], ainsi qu’à sa descendance. Aucun des siens n’habitera au milieu de ce peuple, et lui-même ne verra pas le bien que je ferai pour mon peuple — déclaration de Yahweh —, car il a prêché la révolte contre Yahweh[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « Shemaïa le rêveur ». L’épithète hébraïque peut être liée au rêve, mais son sens exact est incertain.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi évoquer l’apostasie ou la défection.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence judiciaire de l’oracle précédent.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Formulation prophétique claire et actuelle, avec transcription du nom divin.
- source_word: הִנְנִי פֹקֵד עַל
  choice: Je vais demander des comptes à
  rationale: Rend la proximité de l’action portée par הִנְנִי et la valeur judiciaire de פקד על, sans réduire le verbe au seul châtiment matériel.
- source_word: שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: Shemaïa le Néhélamite
  rationale: Transcrit le nom et conserve l’épithète comme désignation propre, puisque son origine et sa portée exactes sont incertaines.
- source_word: וְעַל זַרְעוֹ
  choice: ainsi qu’à sa descendance
  rationale: Exprime le sens collectif de זֶרַע dans un français naturel.
- source_word: לֹא יִהְיֶה לוֹ אִישׁ יֹשֵׁב
  choice: Aucun des siens n’habitera
  rationale: Restitue l’idée qu’il ne restera aucun homme issu de lui établi au sein du peuple, tout en évitant une tournure française artificielle.
- source_word: בְּתוֹךְ הָעָם הַזֶּה
  choice: au milieu de ce peuple
  rationale: Conserve l’image spatiale et sociale de l’hébreu.
- source_word: וְלֹא יִרְאֶה בַטּוֹב
  choice: et lui-même ne verra pas le bien
  rationale: Préserve l’expression hébraïque « voir le bien » et explicite que le sujet singulier renvoie à Shemaïa.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה לְעַמִּי
  choice: que je ferai à mon peuple
  rationale: Le participe peut viser une action en cours ou imminente; le futur convient ici à la bénédiction annoncée après l’exil.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Formule solennelle qui distingue la clausule prophétique du discours environnant.
- source_word: כִּי סָרָה דִבֶּר עַל יְהוָה
  choice: car il a prêché la révolte contre Yahweh
  rationale: Le verbe « prêcher » rend ici la parole publique de Shemaïa; « révolte » conserve la force de סָרָה sans trancher exclusivement en faveur de l’apostasie religieuse ou de l’insurrection.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve sa fonction de nom propre d’alliance.
- issue: Nature de la סָרָה attribuée à Shemaïa
  choice: révolte
  alternative: apostasie
  rationale: Le terme peut désigner la rébellion, la défection ou l’apostasie. « Révolte » maintient une portée assez large pour ne pas résoudre indûment cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique reste perceptible sans calque lourd; l’image « voir le bien » est conservée. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
