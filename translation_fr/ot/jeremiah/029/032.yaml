  to: 'C’est pourquoi, voici ce que dit Yahweh : « Je vais demander des comptes à Shemaïa le Néhélamite[a], ainsi qu’à sa descendance. Aucun des siens n’habitera au milieu de ce peuple, et lui-même ne verra pas le bien que je ferai pour mon peuple — déclaration de Yahweh —, car il a prêché la révolte contre Yahweh[b]. »'
