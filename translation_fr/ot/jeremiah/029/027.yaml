id: JER.29.27
reference: Jeremiah 29:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לָ֚/מָּה לֹ֣א גָעַ֔רְתָּ בְּ/יִרְמְיָ֖הוּ הָֽ/עֲנְּתֹתִ֑י הַ/מִּתְנַבֵּ֖א לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/027.yaml
  text: And now[a], why have you not rebuked Jeremiah the Anathothite, who is prophesying to you?
translation:
  language: fr
  text: Et maintenant, pourquoi n’as-tu pas réprimandé Jérémie d’Anatoth[a], qui vous adresse des prophéties ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Jérémie l’Anatotite », c’est-à-dire originaire d’Anatoth.'
    reason: Le texte hébreu emploie un gentilé, rendu dans le corps du texte par une expression d’origine plus naturelle en français.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Cette locution conserve à la fois le lien avec ce qui précède et l’introduction d’un nouveau point dans le reproche.
- source_word: לָמָּה לֹא גָעַרְתָּ
  choice: pourquoi n’as-tu pas réprimandé
  rationale: La question demande pourquoi le destinataire n’a pas adressé à Jérémie une sévère réprimande; le passé composé convient au français actuel.
- source_word: בְּיִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française usuelle du nom propre; la préposition hébraïque introduit ici la personne visée par la réprimande.
- source_word: הָעֲנְּתֹתִי
  choice: d’Anatoth
  rationale: Le gentilé hébreu désigne naturellement en français moderne l’origine de Jérémie; cette formulation évite un gentilé français rare et peu transparent.
- source_word: הַמִּתְנַבֵּא לָכֶם
  choice: qui vous adresse des prophéties
  rationale: Le participe exprime une activité prophétique en cours, et לָכֶם désigne les destinataires. Cette tournure est plus naturelle que « qui vous prophétise » tout en conservant le sens.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier de « n’as-tu » rend le destinataire individuel, tandis que « vous » dans « vous adresse » conserve le pluriel de לָכֶם, qui vise le groupe auquel les prophéties sont adressées.
