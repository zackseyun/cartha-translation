source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/030.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh[a] fut adressée à Jérémie en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors ... fut adressée
  rationale: La construction narrative fait progresser le récit. En français moderne, « Alors » marque naturellement la succession, tandis que « fut adressée » s’intègre à la formule prophétique sans reprendre littéralement l’expression vieillie « il arriva que ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « la parole » est le rendu français consacré et transparent; il préserve aussi le caractère formulaire de l’hébreu mieux que « le message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le transcrit au lieu de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole; « à » est l’équivalent français naturel dans l’expression « adresser une parole à quelqu’un ».
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Le nom est rendu selon sa forme française usuelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le discours direct qui suit. « En ces termes » remplit naturellement cette fonction en français et évite le calque lourd « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie le tétragramme comme nom propre. Le conserver sous la forme « Yahweh » distingue le nom divin du titre אֲדֹנָי, tout en signalant en note l’usage traditionnel français.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure « la parole de Yahweh fut adressée à Jérémie » conserve la formule prophétique tout en évitant l’archaïsme « il arriva que ». Le deux-points annonce le discours du verset suivant.
