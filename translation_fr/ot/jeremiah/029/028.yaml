  text: כִּ֣י עַל כֵּ֞ן שָׁלַ֥ח אֵלֵ֛י/נוּ בָּבֶ֥ל לֵ/אמֹ֖ר אֲרֻכָּ֣ה הִ֑יא בְּנ֤וּ בָתִּים֙ וְ/שֵׁ֔בוּ וְ/נִטְע֣וּ גַנּ֔וֹת וְ/אִכְל֖וּ אֶת פְּרִי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/028.yaml
  text: For this reason he sent to us in Babylon[a], saying, ‘It will be a long time. Build houses and live in them[b], and plant gardens and eat their fruit.’
translation:
  language: fr
  text: 'Car c’est pour cela qu’il nous a envoyé, à Babylone, ce message : « Cela durera longtemps[a]. Construisez des maisons et habitez-les[b] ; plantez des jardins et mangez-en les fruits. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Elle est longue. » L’hébreu est elliptique ; il indique que le séjour ou l’exil à Babylone se prolongera.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et habitez » ; « les » est sous-entendu par la mention des maisons.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַל כֵּן
  choice: Car voici ce que
  rationale: La locution introduit ici le motif de la plainte précédente. Cette formulation française conserve le lien explicatif tout en s’intégrant naturellement à la proposition suivante.
- source_word: שָׁלַח אֵלֵינוּ בָּבֶל
  choice: il nous a fait dire à Babylone
  rationale: L’hébreu signifie littéralement qu’il a « envoyé vers nous, à Babylone » ; dans ce contexte, il s’agit manifestement de l’envoi d’un message. La tournure française explicite l’acte de communication sans préciser de messager.
- source_word: לֵאמֹר
  choice: dire
  rationale: L’infinitif introduit les paroles citées ; il est intégré idiomatiquement à « a fait dire ».
- source_word: אֲרֻכָּה הִיא
  choice: Cela durera longtemps
  rationale: L’expression hébraïque elliptique signifie littéralement « elle est longue ». Le référent féminin implicite est probablement la durée du séjour ou de l’exil ; « cela » préserve l’implicite sans introduire directement « l’exil » dans le texte.
- source_word: בְּנוּ בָתִּים
  choice: Construisez des maisons
  rationale: Traduction directe et naturelle de l’impératif et de son complément.
- source_word: וְשֵׁבוּ
  choice: et habitez-les
  rationale: Le verbe peut signifier s’asseoir, demeurer ou habiter. Après « construisez des maisons », le pronom objet implicite est exprimé en français pour rendre la phrase naturelle.
- source_word: וְנִטְעוּ גַנּוֹת
  choice: plantez des jardins
  rationale: גַנּוֹת désigne couramment des jardins ; « vergers » serait ici trop spécifique.
- source_word: וְאִכְלוּ אֶת פְּרִיהֶן
  choice: et mangez-en les fruits
  rationale: Formulation française idiomatique qui maintient clairement les jardins comme antécédent.
