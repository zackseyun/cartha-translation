source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַל יַשִּׁ֧יאוּ לָ/כֶ֛ם נְבִֽיאֵי/כֶ֥ם אֲשֶׁר בְּ/קִרְבְּ/כֶ֖ם וְ/קֹֽסְמֵי/כֶ֑ם וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חֲלֹמֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם מַחְלְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/008.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Do not let your prophets who are among you and your diviners deceive you, and do not listen to your dreams that you are causing to be dreamed.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh des armées, le Dieu d’Israël : Ne vous laissez pas tromper par vos prophètes qui sont au milieu de vous ni par vos devins, et n’écoutez pas vos rêves, ceux que vous suscitez[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « que vous rêvez ». La tournure hébraïque est difficile : elle peut désigner les rêves que les gens font eux-mêmes ou ceux qu’ils favorisent ou provoquent d’une manière ou d’une autre.'
    reason: Alternative lexicale permettant de conserver l’ambiguïté de la forme hifil inhabituelle de חלם.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend le titre צְבָאוֹת sans limiter explicitement les armées au domaine terrestre ou céleste.
- source_word: אַל יַשִּׁיאוּ לָכֶם
  choice: Ne laissez pas … vous tromper
  rationale: Rend naturellement en français la valeur causative de la forme hifil de נשׁא et l’interdiction adressée aux exilés.
- source_word: נְבִיאֵיכֶם אֲשֶׁר בְּקִרְבְּכֶם
  choice: vos prophètes qui sont au milieu de vous
  rationale: Préserve à la fois le possessif et la présence de ces prophètes au sein de la communauté.
- source_word: קֹסְמֵיכֶם
  choice: vos devins
  rationale: Terme français courant et précis pour les personnes qui pratiquent la divination.
- source_word: וְאַל תִּשְׁמְעוּ אֶל
  choice: et n’écoutez pas
  rationale: Expression française directe qui peut signifier aussi bien écouter qu’accorder du crédit.
- source_word: חֲלֹמֹתֵיכֶם אֲשֶׁר אַתֶּם מַחְלְמִים
  choice: vos rêves, ceux que vous suscitez
  rationale: Le possessif est conservé, tandis que « suscitez » maintient la valeur causative inhabituelle de la forme hifil sans produire une tournure française inintelligible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; sa translittération préserve cette identification personnelle plutôt que de lui substituer un titre.
- issue: Interprétation de la forme causative מַחְלְמִים
  choice: ceux que vous suscitez
  alternative: que vous rêvez
  rationale: La formulation retenue garde perceptible la valeur causative ou intensive inhabituelle de l’hébreu, sans trancher entièrement la question de savoir comment les destinataires favorisent ou produisent ces rêves.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La structure solennelle de la formule prophétique est conservée; la dernière proposition reste légèrement marquée afin de refléter la difficulté réelle de l’hébreu.
