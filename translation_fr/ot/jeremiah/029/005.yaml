  text: בְּנ֥וּ בָתִּ֖ים וְ/שֵׁ֑בוּ וְ/נִטְע֣וּ גַנּ֔וֹת וְ/אִכְל֖וּ אֶת פִּרְיָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/005.yaml
  text: Build houses and live in them[a]; plant gardens and eat their fruit.
translation:
  language: fr
  text: Construisez des maisons et habitez-les[a] ; plantez des jardins et mangez-en les fruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « installez-vous-y ». Le verbe hébreu peut évoquer une résidence durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ בָתִּים
  choice: Construisez des maisons
  rationale: L’impératif pluriel de בנה et le pluriel concret בָּתִּים sont rendus directement, sans ajouter une nuance réfléchie absente du texte.
- source_word: וְשֵׁבוּ
  choice: et habitez-les
  rationale: Dans le contexte des maisons, ישב désigne le fait d’y résider. « Habitez-les » est naturel, digne et conserve l’idée d’une résidence établie.
- source_word: וְנִטְעוּ גַנּוֹת
  choice: plantez des jardins
  rationale: נטע est le verbe courant pour planter, et גַּנּוֹת désigne des jardins sans imposer le sens plus étroit de « vergers ».
- source_word: וְאִכְלוּ אֶת־פִּרְיָן
  choice: et mangez-en les fruits
  rationale: Le suffixe féminin pluriel renvoie aux jardins. La tournure française « mangez-en les fruits » exprime clairement ce lien tout en conservant l’image concrète des fruits.
