language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה אֶל הַ/מֶּ֨לֶךְ֙ הַ/יּוֹשֵׁב֙ אֶל כִּסֵּ֣א דָוִ֔ד וְ/אֶל כָּל הָ/עָ֔ם הַ/יּוֹשֵׁ֖ב בָּ/עִ֣יר הַ/זֹּ֑את אֲחֵי/כֶ֕ם אֲשֶׁ֛ר לֹֽא יָצְא֥וּ אִתְּ/כֶ֖ם בַּ/גּוֹלָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/016.yaml
  text: For thus says Yahweh concerning the king who sits on the throne of David[a], and concerning all the people who dwell in this city—your brothers who did not go out with you into exile—
translation:
  language: fr
  text: Car ainsi parle Yahweh au sujet du roi qui siège sur le trône de David et de tout le peuple qui habite dans cette ville — vos frères[a], qui ne sont pas partis avec vous en exil —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos compatriotes » ; l’hébreu dit littéralement « vos frères », terme masculin pluriel qui peut désigner plus largement les autres Judéens.
    reason: Précise la portée contextuelle possible du terme de parenté sans neutraliser sa forme dans le texte principal.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui prolonge la déclaration précédente, tout en conservant la valeur causale ou explicative de la particule.
- source_word: כֹה אָמַר
  choice: ainsi parle
  rationale: Rend de façon concise et digne la formule prophétique, avec un présent français naturel pour une parole proclamée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֶל
  choice: au sujet de
  rationale: Dans ce contexte, la préposition introduit les personnes concernées par la déclaration plutôt que ses destinataires directs.
- source_word: הַיּוֹשֵׁב אֶל כִּסֵּא דָוִד
  choice: qui siège sur le trône de David
  rationale: « Siège » convient au contexte royal et conserve l’image dynastique du trône de David.
- source_word: וְאֶל כָּל הָעָם
  choice: et de tout le peuple
  rationale: La coordination reprend naturellement en français la relation exprimée par אֶל, tout en conservant כָּל, « tout ».
- source_word: הַיּוֹשֵׁב בָּעִיר הַזֹּאת
  choice: qui habite dans cette ville
  rationale: Le participe singulier s’accorde avec le collectif « peuple »; « habite » est actuel, clair et proche du sens hébreu.
- source_word: אֲחֵיכֶם
  choice: vos frères
  rationale: Conserve le terme de parenté masculin pluriel du texte, tandis qu’une note en précise la portée collective possible.
- source_word: אֲשֶׁר לֹא יָצְאוּ אִתְּכֶם בַּגּוֹלָה
  choice: qui ne sont pas partis avec vous en exil
  rationale: Préserve la formulation active de יָצָא et exprime naturellement la destination ou la condition d’exil en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin; sa transcription préserve cette distinction sans le remplacer par un titre.
- issue: Portée du terme de parenté אֲחֵיכֶם
  choice: vos frères
  alternative: vos compatriotes
  rationale: Le texte principal conserve la forme masculine plurielle de l’hébreu, sans exclure la portée plus large de « compatriotes judéens », signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formule « ainsi parle » garde la solennité prophétique sans archaïsme marqué. Le tiret final est conservé parce que la phrase se poursuit au verset suivant.
