  text: אַחֲרֵ֣י צֵ֣את יְכָנְיָֽה הַ֠/מֶּלֶךְ וְ/הַ/גְּבִירָ֨ה וְ/הַ/סָּרִיסִ֜ים שָׂרֵ֨י יְהוּדָ֧ה וִ/ירוּשָׁלִַ֛ם וְ/הֶ/חָרָ֥שׁ וְ/הַ/מַּסְגֵּ֖ר מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/002.yaml
  text: after King Jeconiah[a], the queen mother, the court officials, the officials of Judah and Jerusalem[c][b], and the craftsmen and the metalworkers had gone out from Jerusalem—
translation:
  language: fr
  text: après que le roi Jéconias, la reine mère, les fonctionnaires de la cour[a], les responsables de Juda et de Jérusalem[b], les artisans et les forgerons[c] eurent quitté Jérusalem —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les eunuques » ; le terme hébreu peut désigner soit des eunuques au sens strict, soit plus largement des fonctionnaires royaux.
    reason: lexical_alternative
  - marker: b
    text: Ou « les chefs de Juda et de Jérusalem » ; ou, traditionnellement, « les princes ».
    reason: lexical_alternative
  - marker: c
    text: Ou « les ouvriers du métal » ; le sens précis du terme hébreu est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי צֵאת
  choice: après que… eurent quitté
  rationale: La construction temporelle introduit une action antérieure à l’envoi de la lettre évoquée dans le contexte. Le passé antérieur convient naturellement après « après que » dans ce registre narratif.
- source_word: יְכָנְיָה הַמֶּלֶךְ
  choice: le roi Jékonias
  rationale: « Jékonias » est la forme française traditionnelle correspondant à cette forme hébraïque du nom, sans harmonisation avec ses autres variantes bibliques.
- source_word: הַגְּבִירָה
  choice: la reine mère
  rationale: Dans ce contexte royal, le terme désigne vraisemblablement la mère du roi investie d’un rang officiel, plutôt qu’une simple dame de haut rang.
- source_word: הַסָּרִיסִים
  choice: les hauts fonctionnaires
  rationale: Le terme peut désigner des eunuques au sens strict ou, plus largement, des fonctionnaires royaux. Le contexte de cour favorise ici la fonction administrative, tout en conservant l’autre possibilité en note.
- source_word: שָׂרֵי יְהוּדָה וִירוּשָׁלַם
  choice: les responsables de Juda et de Jérusalem
  rationale: שׂרים désigne des dirigeants ou dignitaires. « Responsables » est actuel et évite le sens dynastique que « princes » pourrait suggérer.
- source_word: הֶחָרָשׁ
  choice: les artisans
  rationale: Le terme peut désigner largement les ouvriers qualifiés ou artisans; cette traduction maintient sa portée générale face au métier plus précis qui suit.
- source_word: הַמַּסְגֵּר
  choice: les forgerons
  rationale: Le terme rare désigne probablement des ouvriers du métal, souvent associés aux artisans dans les listes de déportés. « Forgerons » est naturel, tout en signalant en note la traduction plus large possible.
- source_word: מִירוּשָׁלָם
  choice: quitté Jérusalem
  rationale: La préposition marque le point de départ. Avec יצא, « quitter Jérusalem » rend naturellement « sortir de Jérusalem » sans préciser davantage si le départ était volontaire ou forcé.
