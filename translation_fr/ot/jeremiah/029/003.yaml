base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/003.yaml
  text: 'by the hand of Elasah son of Shaphan and Gemariah son of Hilkiah[a], whom Zedekiah king of Judah sent to Nebuchadnezzar king of Babylon in Babylon[b], saying:'
translation:
  language: fr
  text: 'Il la confia à Éleasa, fils de Shafân, et à Guemaria, fils de Hilqiya[a], que Sédécias, roi de Juda, envoya auprès de Nabuchodonosor, roi de Babylone, à Babylone, avec ces mots :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « par la main d’Éleasa […] et de Guemaria » ; cette expression désigne ici les messagers auxquels la lettre fut confiée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: Il la confia à
  rationale: L’expression hébraïque signifie littéralement « par la main de » et marque ici les personnes chargées de porter la lettre mentionnée au verset précédent. Cette formulation française rend naturellement l’idée d’une remise à des messagers.
- source_word: אֶלְעָשָׂה
  choice: Éleasa
  rationale: Translittération française usuelle et lisible du nom propre hébreu.
- source_word: בֶן
  choice: fils de
  rationale: Rend directement le marqueur hébreu de filiation.
- source_word: שָׁפָן
  choice: Shafân
  rationale: Translittération française du nom propre, avec l’accent circonflexe indiquant la voyelle longue sans alourdir la lecture.
- source_word: וּגְמַרְיָה
  choice: et à Guemaria
  rationale: Le waw coordonne le second porteur de la lettre; « Guemaria » est une translittération adaptée à la prononciation française.
- source_word: חִלְקִיָּה
  choice: Hilqiya
  rationale: Translittération proche de l’hébreu, qui conserve la consonne qoph et la finale théophore sans la traduire.
- source_word: אֲשֶׁר שָׁלַח
  choice: que Sédécias […] envoya
  rationale: La proposition relative se rapporte naturellement aux deux hommes chargés de la lettre.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Sédécias, roi de Juda
  rationale: Emploie la forme française traditionnelle du nom royal et rend directement la chaîne de construction.
- source_word: אֶל נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל בָּבֶלָה
  choice: à Babylone auprès de Nabuchodonosor, roi de Babylone
  rationale: La finale directionnelle de בָּבֶלָה indique le déplacement vers Babylone. « Auprès de » précise idiomatiquement que le roi en est le destinataire, tout en conservant les deux éléments du texte hébreu.
- source_word: לֵאמֹר
  choice: 'avec ces mots :'
  rationale: Formule française naturelle introduisant le contenu de la lettre qui suit.
