  source_fidelity: La formulation « à Babylone auprès de Nabuchodonosor » inverse l’ordre syntaxique des deux compléments hébreux et rend moins directement la destination première, « vers Nabuchodonosor », suivie de la destination géographique « à Babylone ». Le verbe introducteur « Il la confia » exprime correctement, dans le contexte immédiat de la lettre mentionnée au verset précédent, l’idiome בְּיַד (« par l’intermédiaire de »).
  naturalness: « Il la confia à » est naturel et clair en français moderne. Placer « auprès de Nabuchodonosor » avant « à Babylone » donne une phrase plus fluide tout en préservant explicitement les deux compléments du texte source.
  terminology: Les titres « roi de Juda » et « roi de Babylone », ainsi que les formes royales françaises « Sédécias » et « Nabuchodonosor », conviennent. Les formes de noms des messagers sont recevables dans une translittération française orientée vers l’hébreu. La note explique justement l’idiome sans lui attribuer un sens doctrinal.
