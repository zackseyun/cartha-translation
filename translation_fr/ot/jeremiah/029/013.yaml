  yaml_path: translation/ot/jeremiah/029/013.yaml
  text: You will seek me and find me[a], when you seek me with all your heart.
translation:
  language: fr
  text: Vous me chercherez et vous me trouverez[a], lorsque vous me rechercherez de tout votre cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car vous me chercherez et vous me trouverez, si vous me recherchez de tout votre cœur ». La conjonction hébraïque traduite par « lorsque » peut exprimer ici plusieurs rapports connexes.'
    reason: Alternative lexicale et syntaxique pour כִּי.
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: Vous me chercherez
  rationale: Le piel accompli précédé de la conjonction s’inscrit ici dans une promesse orientée vers l’avenir. « Chercher » exprime naturellement une démarche intentionnelle.
- source_word: אֹתִי
  choice: me
  rationale: La marque de l’objet direct munie du suffixe de première personne du singulier est rendue simplement par « me ».
- source_word: וּמְצָאתֶם
  choice: et vous me trouverez
  rationale: Le qal accompli coordonné poursuit la séquence future. La répétition explicite de « vous me » est naturelle en français et préserve nettement l’objet personnel.
- source_word: כִּי
  choice: lorsque
  rationale: Dans ce contexte, כִּי peut introduire la circonstance ou la condition liée à l’accomplissement de la promesse. « Lorsque » est clair en français, tandis qu’une note conserve les autres rapports logiques possibles.
- source_word: תִדְרְשֻׁנִי
  choice: vous me rechercherez
  rationale: דרשׁ peut désigner une recherche appliquée, notamment tournée vers Dieu. « Rechercher » permet de faire entendre la variation lexicale par rapport à בקשׁ sans surinterpréter son intensité.
- source_word: בְּכָל
  choice: de tout
  rationale: Devant « cœur », בְּכָל se rend idiomatiquement en français par « de tout », ce qui exprime la totalité de l’engagement intérieur.
- source_word: לְבַבְכֶם
  choice: votre cœur
  rationale: לֵבָב désigne la personne intérieure — pensée, volonté et affections. « Cœur » en est l’équivalent français traditionnel, naturel et suffisamment riche.
theological_decisions:
- issue: Rapport entre la recherche de Dieu et le fait de le trouver
  choice: Le verset formule la promesse réelle que ceux qui recherchent Dieu de tout leur cœur le trouveront, sans préciser ici le mécanisme théologique plus large.
  alternative: On peut accentuer soit la responsabilité humaine, soit l’action préalable de la grâce divine.
  rationale: La formulation reste proche de l’hébreu et ne tranche pas une question que ce verset n’explicite pas.
- issue: Valeur logique de כִּי
  choice: « lorsque » dans le texte principal
  alternative: « car », « parce que » ou « si »
  rationale: Le contexte permet plusieurs nuances connexes. Le texte principal privilégie une relation circonstancielle naturelle en français, et la note signale l’ambiguïté authentique.
translation_notes:
  register: Français international moderne, digne et accessible. La variation « chercherez / rechercherez » reflète les deux verbes hébreux sans créer une distinction théologique trop appuyée. Le tutoiement pluriel du texte source est rendu par « vous ».
