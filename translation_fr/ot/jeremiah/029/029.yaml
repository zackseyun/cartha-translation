  text: וַ/יִּקְרָ֛א צְפַנְיָ֥ה הַ/כֹּהֵ֖ן אֶת הַ/סֵּ֣פֶר הַ/זֶּ֑ה בְּ/אָזְנֵ֖י יִרְמְיָ֥הוּ הַ/נָּבִֽיא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/029.yaml
  text: Then Zephaniah the priest read this scroll in the hearing of Jeremiah the prophet[a].
translation:
  language: fr
  text: Le prêtre Sophonie lut alors ce document[a] à haute voix devant le prophète Jérémie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner un livre, un rouleau, une lettre ou, plus généralement, un document écrit. Ici, le contexte renvoie à la lettre de Shemaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: lut alors
  rationale: Avec un écrit comme complément, le verbe signifie ici « lire ». « Alors » exprime naturellement la progression narrative du wayyiqtol.
- source_word: צְפַנְיָה
  choice: Sophonie
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le titre défini désigne explicitement la fonction de Sophonie.
- source_word: הַסֵּפֶר הַזֶּה
  choice: ce document[a]
  rationale: סֵפֶר peut désigner un livre, un rouleau, une lettre ou, plus largement, un écrit. « Document » conserve cette latitude lexicale tout en convenant à la lettre mentionnée dans le contexte.
- source_word: בְּאָזְנֵי
  choice: à haute voix devant
  rationale: L’expression signifie littéralement « aux oreilles de » et indique que le texte est lu de manière à être entendu. Cette formulation en rend le sens en français naturel.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Le titre défini est conservé, avec l’ordre usuel en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « À haute voix devant » restitue de façon idiomatique la dimension auditive de l’expression hébraïque, tandis que « document » évite de trancher inutilement entre « lettre » et « rouleau ».
