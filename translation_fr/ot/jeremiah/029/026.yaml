source:
  edition: WLC
  text: יְהוָ֞ה נְתָנְ/ךָ֣ כֹהֵ֗ן תַּ֚חַת יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן לִֽ/הְי֤וֹת פְּקִדִים֙ בֵּ֣ית יְהוָ֔ה לְ/כָל אִ֥ישׁ מְשֻׁגָּ֖ע וּ/מִתְנַבֵּ֑א וְ/נָתַתָּ֥ה אֹת֛/וֹ אֶל הַ/מַּהְפֶּ֖כֶת וְ/אֶל הַ/צִּינֹֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/026.yaml
  text: Yahweh has made you priest in place of Jehoiada the priest[a], to be overseers in the house of Yahweh over every man who is mad and acts as a prophet[c][b], and you should put him into the stocks and the neck iron.
translation:
  language: fr
  text: Yahweh t’a établi prêtre à la place du prêtre Yehoyada, pour être chargé de la surveillance[a] dans la maison de Yahweh à l’égard de tout homme qui a perdu la raison et qui prophétise[b]. Tu dois mettre cet homme aux ceps et au collier de fer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un nom pluriel qui peut signifier « surveillants », « responsables » ou « agents », bien que le destinataire soit singulier.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi être rendu, dans le ton hostile de la lettre, par « se donne des airs de prophète ».
    reason: alternative_reading
  - marker: c
    text: Le sens exact du terme traduit par « collier de fer » est incertain; il désigne probablement une entrave métallique, peut-être portée au cou, employée avec les ceps.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, plutôt que substitution par un titre.
- source_word: נְתָנְךָ כֹהֵן
  choice: t’a établi prêtre
  rationale: Dans cette construction, נתן exprime la nomination à une fonction; « établir » rend naturellement ce sens en français.
- source_word: תַּחַת יְהוֹיָדָע הַכֹּהֵן
  choice: à la place du prêtre Yehoyada
  rationale: תחת marque ici le remplacement ou la succession dans la charge, et non la subordination.
- source_word: לִהְיוֹת פְּקִדִים
  choice: pour être chargé de la surveillance
  rationale: Cette formulation française naturelle exprime la responsabilité de contrôle tout en évitant un désaccord artificiel entre le destinataire singulier et le nom hébreu morphologiquement pluriel.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Conserve l’image hébraïque de la « maison », qui désigne ici le temple.
- source_word: לְכָל אִישׁ מְשֻׁגָּע
  choice: à l’égard de tout homme qui a perdu la raison
  rationale: Rend la portée de l’autorité et conserve le caractère masculin singulier de איש ainsi que le jugement hostile exprimé par משגע, sans employer une insulte française inutilement clinique.
- source_word: וּמִתְנַבֵּא
  choice: et qui prophétise
  rationale: Traduction directe et non préjugée du participe; le contexte et l’expression précédente portent déjà l’hostilité du locuteur.
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Tu dois mettre cet homme
  rationale: Exprime l’action attendue du responsable dans un français actuel et clarifie le référent du pronom.
- source_word: הַמַּהְפֶּכֶת
  choice: les ceps
  rationale: Désigne un dispositif servant à immobiliser et punir; « ceps » est le terme français traditionnel précis.
- source_word: הַצִּינֹק
  choice: le collier de fer
  rationale: Le mot rare paraît désigner une entrave métallique portée au cou, mais son identification exacte demeure incertaine et est signalée en note.
theological_decisions:
- issue: Caractérisation hostile de l’activité prophétique
  choice: qui a perdu la raison et qui prophétise
  alternative: qui est fou et se donne des airs de prophète
  rationale: La traduction conserve l’accusation de folie formulée par l’auteur de la lettre, mais rend מתנבא de façon neutre afin de ne pas décider implicitement si la prophétie est authentique.
- issue: Portée masculine de אִישׁ
  choice: tout homme
  alternative: toute personne
  rationale: « Tout homme » reflète la forme masculine singulière de l’hébreu sans élargir explicitement la formulation.
- issue: Pluralité de פְּקִדִים avec un destinataire singulier
  choice: être chargé de la surveillance
  alternative: être des surveillants
  rationale: La fonction est rendue sans corriger silencieusement le texte; l’anomalie grammaticale réelle est conservée dans une note plutôt que reproduite sous une forme française trompeuse.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en deux phrases pour préserver la clarté. « Maison de Yahweh » maintient l’image du texte source; « ceps » conserve le vocabulaire historique précis, éclairé par le contexte et la note sur la seconde entrave.
