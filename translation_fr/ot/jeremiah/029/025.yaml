source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַ֡עַן אֲשֶׁ֣ר אַתָּה֩ שָׁלַ֨חְתָּ בְ/שִׁמְ/כָ֜ה סְפָרִ֗ים אֶל כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירוּשָׁלִַ֔ם וְ/אֶל צְפַנְיָ֤ה בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן וְ/אֶ֥ל כָּל הַ/כֹּהֲנִ֖ים לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/025.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Because you have sent letters in your own name to all the people who are in Jerusalem, and to Zephaniah son of Maaseiah the priest, and to all the priests, saying,'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées, le Dieu d’Israël : Puisque tu as envoyé en ton propre nom[a] des lettres à tout le peuple qui se trouve à Jérusalem, ainsi qu’à Sophonie, le prêtre, fils de Maaséya, et à tous les prêtres, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en ton nom ». L’expression souligne probablement que Shemaya a agi de sa propre autorité, et non au nom de Yahweh.'
    reason: Précise la formulation littérale et l’implication contextuelle sans l’imposer comme seul sens possible.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée qui conserve la solennité de l’hébreu tout en restant naturelle en français moderne.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est transcrit, et « des armées » rend צְבָאוֹת sans limiter la portée du titre aux seules forces humaines.
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: Introduit naturellement la cause sur laquelle repose la déclaration qui suit.
- source_word: בְשִׁמְךָ
  choice: en ton propre nom
  rationale: Rend le possessif et fait ressortir que l’expéditeur se réclame de sa propre autorité; une note donne la formulation plus littérale.
- source_word: סְפָרִים
  choice: des lettres
  rationale: Le contexte d’envoi à des destinataires précis indique une correspondance plutôt que des livres ou des documents génériques.
- source_word: כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: tout le peuple qui se trouve à Jérusalem
  rationale: Reproduit la relative hébraïque dans un français courant.
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: Sophonie, fils de Maaséya, le prêtre
  rationale: Suit l’ordre syntaxique de l’hébreu et emploie des formes françaises reconnaissables pour les noms propres.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Annonce le contenu de la lettre cité au verset suivant et maintient la continuité syntaxique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription le distingue du titre אֲדֹנָי et évite de remplacer silencieusement le nom par un titre.
- issue: Portée de בְשִׁמְךָ
  choice: en ton propre nom
  alternative: en ton nom
  rationale: Le contexte suggère une action fondée sur l’autorité personnelle de Shemaya plutôt que sur celle de Yahweh, sans toutefois transformer cette implication en une paraphrase doctrinale.
- issue: Identification de « le prêtre »
  choice: apposition à Sophonie
  alternative: apposition possible à Maaséya selon la ponctuation française
  rationale: La construction et le contexte identifient naturellement Sophonie comme prêtre; les virgules conservent néanmoins l’ordre hébreu sans réorganiser explicitement la phrase.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la structure d’une déclaration prophétique et laisse la phrase ouverte, puisque le contenu annoncé par « en disant » se poursuit au verset suivant.
