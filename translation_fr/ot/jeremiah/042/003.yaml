source:
  edition: WLC
  text: וְ/יַגֶּד לָ֨/נוּ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֣ר נֵֽלֶךְ בָּ֑/הּ וְ/אֶת הַ/דָּבָ֖ר אֲשֶׁ֥ר נַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/003.yaml
  text: that Yahweh your God may tell us the way in which we should walk[a], and the thing that we should do.
translation:
  language: fr
  text: afin que Yahweh, ton Dieu, nous indique le chemin que nous devons suivre et ce que nous devons faire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַגֶּד
  choice: afin que … nous indique
  rationale: 'Le hiphil de נגד exprime ici, dans la continuité de la requête du verset précédent, le but recherché : que Dieu leur fasse connaître sa direction. « Indique » est naturel en français et conserve cette valeur de requête sans en faire une simple prédiction.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier s’adresse à Jérémie. Le tutoiement convient à l’adresse directe et au registre biblique français actuel.
- source_word: הַדֶּרֶךְ אֲשֶׁר נֵלֶךְ בָּהּ
  choice: le chemin que nous devons suivre
  rationale: « Chemin » conserve l’image hébraïque du parcours à prendre. En français, « suivre un chemin » exprime naturellement l’hébreu littéral « marcher dans [ce chemin] » tout en évoquant une ligne de conduite.
- source_word: הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: ce que nous devons faire
  rationale: דבר désigne ici la chose ou la conduite à accomplir, en parallèle avec le chemin à suivre. Cette formulation française est claire et fidèle sans introduire le sens trompeur de « parole ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Force modale de נֵלֶךְ et נַעֲשֶׂה
  choice: nous devons suivre / nous devons faire
  alternative: nous suivrons / nous ferons
  rationale: Dans cette demande de direction divine, les formes verbales concernent la conduite à adopter, non une simple annonce de l’avenir. « Devons » exprime cette orientation normative sans surcharger le texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase commence par « afin que » parce que le waw et le contexte rattachent ce membre à la demande formulée au verset précédent. Le parallélisme entre le chemin à suivre et l’action à accomplir est préservé.
