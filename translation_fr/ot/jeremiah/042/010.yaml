  edition: WLC
  text: אִם שׁ֤וֹב תֵּֽשְׁבוּ֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וּ/בָנִ֤יתִי אֶתְ/כֶם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וְ/נָטַעְתִּ֥י אֶתְ/כֶ֖ם וְ/לֹ֣א אֶתּ֑וֹשׁ כִּ֤י נִחַ֨מְתִּי֙ אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר עָשִׂ֖יתִי לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/010.yaml
  text: If you will indeed remain in this land[a], then I will build you up and not tear you down, and I will plant you and not uproot you[c][b]; for I relent concerning the harm that I did to you.
translation:
  language: fr
  text: Si vous restez vraiment dans ce pays[a], je vous bâtirai et ne vous démolirai pas ; je vous planterai et ne vous déracinerai pas[b], car j’ai renoncé au malheur que je vous ai fait subir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si vous demeurez réellement dans ce pays. » L’hébreu renforce ici le verbe « demeurer, rester » au moyen d’un infinitif absolu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je vous planterai et ne vous arracherai pas ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu peut aussi se traduire : « car j’ai renoncé au désastre que je vous ai infligé ». Le « malheur » désigne ici une calamité, non un mal moral commis par Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם שׁוֹב תֵּשְׁבוּ
  choice: Si vous restez vraiment
  rationale: L’infinitif absolu שׁוֹב placé avant le verbe de la racine ישׁב renforce l’idée de demeurer. « Restez vraiment » exprime cette insistance et convient au contexte, où il s’agit de rester en Juda plutôt que de partir en Égypte.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: « Pays » désigne naturellement ici le territoire où les rescapés doivent rester. « Dans cette terre » serait possible, mais moins idiomatique dans ce contexte précis.
- source_word: וּבָנִיתִי אֶתְכֶם
  choice: je vous bâtirai
  rationale: La traduction conserve la métaphore prophétique de la construction. En français, « bâtir » peut prendre des personnes pour objet dans un registre imagé et dignifié.
- source_word: וְלֹא אֶהֱרֹס
  choice: et ne vous démolirai pas
  rationale: « Démolir » maintient le contraste architectural direct avec « bâtir », sans réduire l’image à une simple idée abstraite de destruction.
- source_word: וְנָטַעְתִּי אֶתְכֶם
  choice: je vous planterai
  rationale: La formulation préserve l’image agricole caractéristique de Jérémie au lieu de l’aplanir en « établir ».
- source_word: וְלֹא אֶתּוֹשׁ
  choice: et ne vous déracinerai pas
  rationale: Dans ce parallélisme avec « planter », « déraciner » rend clairement et naturellement l’idée d’arracher ce qui a été planté.
- source_word: כִּי נִחַמְתִּי
  choice: car je renonce
  rationale: Avec Dieu pour sujet, נחם exprime ici le fait de revenir sur la poursuite d’un jugement ou d’y renoncer. « Je renonce » évite la connotation moderne de faute morale que pourrait porter « je me repens », tout en préservant l’idée d’un changement de conduite annoncé.
- source_word: אֶל הָרָעָה
  choice: au malheur
  rationale: רָעָה désigne ici la calamité ou le malheur du jugement, non le mal moral. « Malheur » est naturel, accessible et conserve une part de l’ampleur sémantique du terme.
- source_word: אֲשֶׁר עָשִׂיתִי לָכֶם
  choice: que je vous ai fait subir
  rationale: Cette formulation française naturelle rend l’action effectivement exercée contre eux. Elle est légèrement plus explicite que le littéral « que je vous ai fait », qui serait ambigu ou maladroit en français.
theological_decisions:
- issue: Le changement exprimé par נחם lorsque Dieu est le sujet
  choice: je renonce au malheur que je vous ai fait subir
  alternative: je me repens du mal que je vous ai fait
  rationale: Le passage présente Dieu comme renonçant à poursuivre le malheur judiciaire infligé au peuple. La traduction garde cette tension anthropopathique sans suggérer que Dieu reconnaîtrait avoir commis une faute morale.
- issue: Sens de רָעָה dans le jugement divin
  choice: malheur
  alternative: mal
  rationale: Dans ce contexte, le mot désigne une calamité subie, non une action moralement mauvaise. « Malheur » empêche une lecture éthique indue tout en restant proche du champ sémantique hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Les deux métaphores coordonnées — bâtir/démolir et planter/déraciner — sont conservées. Le tutoiement collectif est évité au profit de « vous », conforme à l’adresse au groupe. La ponctuation met en évidence le parallélisme poétique sans fragmenter la phrase.
