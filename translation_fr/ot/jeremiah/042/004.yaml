source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יִרְמְיָ֤הוּ הַ/נָּבִיא֙ שָׁמַ֔עְתִּי הִנְ/נִ֧י מִתְפַּלֵּ֛ל אֶל יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כְּ/דִבְרֵי/כֶ֑ם וְֽ/הָיָ֡ה כָּֽל הַ/דָּבָר֩ אֲשֶׁר יַעֲנֶ֨ה יְהוָ֤ה אֶתְ/כֶם֙ אַגִּ֣יד לָ/כֶ֔ם לֹֽא אֶמְנַ֥ע מִ/כֶּ֖ם דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/004.yaml
  text: Then Jeremiah the prophet said to them[a], “I have heard. Behold, I am praying to Yahweh your God according to your words, and whatever Yahweh answers you, I will tell you[b]. I will not withhold a word from you.”
translation:
  language: fr
  text: 'Alors le prophète Jérémie leur dit : « J’ai bien entendu. Me voici : je vais prier Yahweh votre Dieu comme vous me l’avez demandé[a]. Tout ce que Yahweh vous répondra, je vous le ferai connaître. Je ne vous en cacherai pas un mot. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon vos paroles ».'
    reason: La note préserve la forme hébraïque derrière la traduction française idiomatique.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Cet ordre est naturel en français tout en conservant le nom et le titre.
- source_word: שָׁמַעְתִּי
  choice: J’ai bien entendu
  rationale: Dans cette réponse à une requête, le parfait indique que Jérémie a entendu et pris acte de leur demande ; « bien » rend cette valeur sans ajouter une promesse distincte.
- source_word: הִנְנִי מִתְפַּלֵּל
  choice: 'Me voici : je vais prier'
  rationale: הִנְנִי attire l’attention sur l’engagement immédiat du prophète, tandis que le participe présente une action imminente ou engagée. Cette formulation française conserve les deux aspects.
- source_word: אֶל יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh votre Dieu
  rationale: Le nom divin est rendu par « Yahweh », et le suffixe de deuxième personne du pluriel par « votre ».
- source_word: כְּדִבְרֵיכֶם
  choice: comme vous me l’avez demandé
  rationale: La formulation transmet idiomatiquement le sens contextuel de « selon vos paroles » ; la note conserve la forme plus littérale.
- source_word: כָּל הַדָּבָר אֲשֶׁר יַעֲנֶה יְהוָה אֶתְכֶם
  choice: Tout ce que Yahweh vous répondra
  rationale: « Tout ce que » rend naturellement la portée globale de כָּל הַדָּבָר sans imposer ici à דָּבָר le seul sens lexical de « parole ».
- source_word: אַגִּיד לָכֶם
  choice: je vous le ferai connaître
  rationale: Le hiphil de נגד signifie faire connaître ou annoncer ; cette traduction convient au rôle de transmission du prophète.
- source_word: לֹא אֶמְנַע מִכֶּם דָּבָר
  choice: Je ne vous en cacherai pas un mot
  rationale: Cette expression française naturelle conserve l’image concrète de דָּבָר et souligne que Jérémie transmettra la réponse intégralement.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie explicitement le tétragramme ; « Yahweh » conserve le nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. « Me voici » conserve la solennité du marqueur hébreu sans recourir à l’archaïsme « voici que ». Le discours direct reste ferme et naturel.
