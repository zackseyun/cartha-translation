  text: וַ/יְהִ֕י מִ/קֵּ֖ץ עֲשֶׂ֣רֶת יָמִ֑ים וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/007.yaml
  text: And it happened[a], at the end of ten days, that the word of Yahweh came to Jeremiah.
translation:
  language: fr
  text: Au bout de dix jours, la parole de Yahweh fut adressée à Jérémie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Au bout de… fut adressée
  rationale: La première occurrence introduit la progression narrative; en français moderne, elle n’a pas besoin d’être traduite séparément par une formule lourde comme « il arriva ». La seconde s’intègre naturellement à la formule prophétique « la parole… fut adressée à ».
- source_word: מִקֵּץ
  choice: Au bout de
  rationale: Cette expression française marque naturellement l’achèvement de la période indiquée et correspond au sens temporel de « lorsque les dix jours furent écoulés ».
- source_word: עֲשֶׂרֶת יָמִים
  choice: dix jours
  rationale: Traduction directe de la construction associant le nombre cardinal au nom.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « La parole » conserve la formule prophétique et la notion de révélation divine, sans la réduire au sens plus interprétatif de « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin exprimé par le tétragramme, plutôt que substitution par un titre.
- source_word: אֶל יִרְמְיָהוּ
  choice: fut adressée à Jérémie
  rationale: Dans cette formule prophétique, cette tournure idiomatique rend naturellement en français la venue de la parole divine vers Jérémie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formule littérale répétée וַיְהִי est intégrée à une phrase française fluide sans perte du développement narratif ni de la formule prophétique.
