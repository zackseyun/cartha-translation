  text: וָ/אַגִּ֥ד לָ/כֶ֖ם הַ/יּ֑וֹם וְ/לֹ֣א שְׁמַעְתֶּ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/לְ/כֹ֖ל אֲשֶׁר שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/021.yaml
  text: I have told you today[a], but you have not obeyed the voice of Yahweh your God or anything for which he sent me to you.
translation:
  language: fr
  text: Je vous l’ai annoncé aujourd’hui, mais vous n’avez pas écouté la voix de Yahweh, votre Dieu, ni tout ce qu’il m’a envoyé vous dire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ni tout ce qu’il m’a envoyé vers vous ». La formulation hébraïque est condensée ; elle désigne ce que Yahweh avait envoyé Jérémie leur communiquer.'
    reason: La note signale la construction elliptique sans présenter comme littérale une interprétation du mandat ni effacer le verbe « envoyer ».
lexical_decisions:
- source_word: וָאַגִּד
  choice: Je vous l’ai déclaré
  rationale: Le hiphil de נגד signifie « annoncer, déclarer, faire connaître ». Le passé composé exprime naturellement en français une communication achevée dont la portée demeure actuelle.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’accusatif adverbial temporel et conserve son relief.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹל
  choice: mais vous n’avez pas écouté la voix
  rationale: שׁמע בְּקוֹל implique normalement une écoute qui conduit à l’obéissance. « Écouter la voix » préserve l’image hébraïque et laisse entendre cette portée sans la réduire au seul fait d’entendre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel plutôt que substitution par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend la construction avec suffixe de deuxième personne du pluriel.
- source_word: וּלְכֹל אֲשֶׁר שְׁלָחַנִי אֲלֵיכֶם
  choice: ni tout ce qu’il m’a chargé de vous dire
  rationale: Le texte dit littéralement « ni tout ce pour quoi il m’a envoyé vers vous ». Dans ce contexte prophétique, la formulation choisie explicite naturellement le contenu du mandat sans perdre l’idée que Dieu a envoyé Jérémie.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel et évite de le remplacer par un titre.
- issue: Portée de שׁמע בְּקוֹל
  choice: écouté la voix
  alternative: obéi à
  rationale: L’expression comporte une forte idée d’obéissance, mais la traduction littérale reste idiomatique en français et préserve à la fois l’image de la voix et la tension entre écoute et obéissance.
translation_notes:
  register: Français international moderne, sobre et digne. « Déclaré » convient à la transmission solennelle d’un message prophétique; la syntaxe demeure claire pour un lectorat général.
