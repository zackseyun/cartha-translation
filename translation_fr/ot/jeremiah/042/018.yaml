  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֣ה צְבָאוֹת֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ כַּ/אֲשֶׁר֩ נִתַּ֨ךְ אַפִּ֜/י וַ/חֲמָתִ֗/י עַל יֹֽשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם כֵּ֣ן תִּתַּ֤ךְ חֲמָתִ/י֙ עֲלֵי/כֶ֔ם בְּ/בֹאֲ/כֶ֖ם מִצְרָ֑יִם וִ/הְיִיתֶ֞ם לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה וְ/לֹֽא תִרְא֣וּ ע֔וֹד אֶת הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/018.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Just as my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you enter Egypt, and you will become an oath, a horror, a curse, and a reproach, and you will never again see this place.'
translation:
  language: fr
  text: 'Car voici ce que dit YHWH, le Dieu des armées, le Dieu d’Israël : « De même que ma colère et ma fureur se sont déversées sur les habitants de Jérusalem, de même ma fureur se déversera sur vous lorsque vous entrerez en Égypte. Vous deviendrez une formule de malédiction[a], un objet d’effroi, une malédiction et un sujet de honte, et vous ne reverrez jamais ce lieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un serment de malédiction » ; le terme hébreu peut désigner un serment qui appelle une malédiction.
    reason: Le nom אָלָה possède une nuance de serment imprécatoire que « formule de malédiction » exprime de façon contextuelle sans épuiser toute son étendue lexicale.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: YHWH, le Dieu des armées
  rationale: « YHWH » représente directement le nom divin sans lui substituer un titre. « Le Dieu des armées » rend le titre צְבָאוֹת tout en laissant ouverte l’étendue de ces armées, célestes ou terrestres.
- source_word: נִתַּךְ ... תִּתַּךְ
  choice: se sont déversées ... se déversera
  rationale: Ce choix conserve la métaphore d’une colère conçue comme un liquide répandu et reproduit le parallélisme entre le jugement passé et le jugement annoncé.
- source_word: אַפִּי וַחֲמָתִי
  choice: ma colère et ma fureur
  rationale: Les deux termes proches sont maintenus afin de préserver l’intensité rhétorique. « Colère » rend l’emploi idiomatique de אַף, tandis que « fureur » distingue חֵמָה sans affaiblir sa force.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Expression française naturelle et précise pour le participe désignant ceux qui résident dans la ville.
- source_word: בְּבֹאֲכֶם מִצְרָיִם
  choice: lorsque vous entrerez en Égypte
  rationale: La préposition avec l’infinitif construit a ici une valeur temporelle. « Entrer en Égypte » exprime naturellement le mouvement vers le pays.
- source_word: לְאָלָה
  choice: une formule de malédiction
  rationale: Le nom peut désigner un serment assorti d’une malédiction ou une formule imprécatoire. Cette formulation rend le sens contextuel tout en distinguant le terme de קְלָלָה plus loin dans la série.
- source_word: לְשַׁמָּה
  choice: un objet d’effroi
  rationale: Le terme évoque la réaction horrifiée provoquée par une ruine frappante. « Objet d’effroi » est idiomatique et conserve cette dimension publique.
- source_word: לִקְלָלָה
  choice: une malédiction
  rationale: Traduction directe du nom, qui indique ici que leur sort deviendra emblématique dans les paroles de malédiction.
- source_word: לְחֶרְפָּה
  choice: un sujet de honte
  rationale: Cette expression communique la honte publique et le mépris attachés à leur sort, sans limiter le sens à une simple insulte verbale.
- source_word: וְלֹא תִרְאוּ עוֹד
  choice: vous ne reverrez jamais
  rationale: Dans ce contexte, la négation avec עוֹד signifie qu’ils ne verront plus ce lieu. « Ne reverrez jamais » est naturel en français et rend la portée définitive de l’avertissement.
theological_decisions:
- issue: Rendu des deux termes de jugement divin אַף et חֵמָה
  choice: ma colère et ma fureur
  alternative: ma colère et mon courroux
  rationale: Le texte juxtapose deux quasi-synonymes pour intensifier l’annonce du jugement. Les conserver séparément évite de réduire cette tension rhétorique, tandis que le sens anatomique littéral de אַף (« nez ») n’est pas retenu puisque l’emploi idiomatique désigne clairement la colère.
- issue: Identification du locuteur par le nom divin et le titre צְבָאוֹת
  choice: YHWH, le Dieu des armées
  alternative: le Seigneur de l’univers
  rationale: Le choix principal conserve le nom propre et l’image des armées du texte hébreu, sans réduire celles-ci aux seules forces militaires humaines ni élargir explicitement le titre à tout l’univers.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme hébreu est conservé par « De même que… de même… ». La série finale varie légèrement les déterminants (« formule », « objet », « sujet ») pour rester naturelle en français tout en maintenant ses quatre éléments distincts.
