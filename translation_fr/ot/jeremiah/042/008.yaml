source:
  edition: WLC
  text: וַ/יִּקְרָ֗א אֶל יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֶ֛ל כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וּ/לְ/כָ֨ל הָ/עָ֔ם לְ/מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/008.yaml
  text: Then he called Johanan son of Kareah, all the commanders of the forces who were with him, and all the people, from the least to the greatest,
translation:
  language: fr
  text: Alors il appela Yohanân, fils de Qaréah, tous les chefs des troupes qui étaient avec lui, ainsi que tout le peuple, du plus petit au plus grand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Alors il appela
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession, et « appela » conserve le sens simple de קרא sans renforcer indûment en « convoqua ».
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Yohanân, fils de Qaréah
  rationale: Les noms sont translittérés selon une forme française proche de l’hébreu, et le patronyme est explicitement conservé.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: tous les chefs des troupes
  rationale: Dans ce contexte militaire, שָׂרֵי désigne les responsables ou commandants, tandis que הַחֲיָלִים renvoie aux troupes. « Chefs des troupes » est clair, actuel et non archaïque.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui étaient avec lui
  rationale: La proposition relative se rattache le plus naturellement aux chefs militaires et indique leur association avec Yohanân.
- source_word: וּלְכָל הָעָם
  choice: ainsi que tout le peuple
  rationale: Le לְ introduit un groupe supplémentaire auquel Jérémie s’adresse. « Ainsi que » rend cette coordination avec fluidité en français.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: du plus petit au plus grand
  rationale: Cette formule idiomatique englobe tous les rangs de la communauté. La traduction française traditionnelle et naturelle conserve les termes de l’image sans les réduire à une taille physique.
