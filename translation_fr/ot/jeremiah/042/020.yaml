    issue: Formulation réflexive redondante
    rationale: La place de « vous-mêmes » après « vous êtes trompés » alourdit inutilement la phrase. Le déplacer avant le participe rend la phrase plus naturelle sans réduire la force réflexive.
  - severity: low
    issue: Expression de l’intercession
    rationale: « En notre faveur » explicite plus clairement le sens de בַּעַד (« en faveur de, pour ») que la construction potentiellement ambiguë « prie ... pour nous ».
