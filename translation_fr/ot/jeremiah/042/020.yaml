source:
  edition: WLC
  text: כִּ֣י התעתי/ם בְּ/נַפְשֽׁוֹתֵי/כֶם֒ כִּֽי אַתֶּ֞ם שְׁלַחְתֶּ֣ם אֹתִ֗/י אֶל יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לֵ/אמֹ֔ר הִתְפַּלֵּ֣ל בַּעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵ֑י/נוּ וּ/כְ/כֹל֩ אֲשֶׁ֨ר יֹאמַ֜ר יְהוָ֧ה אֱלֹהֵ֛י/נוּ כֵּ֥ן הַגֶּד לָ֖/נוּ וְ/עָשִֽׂינוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/020.yaml
  text: For you have deceived yourselves[a], because you sent me to Yahweh your God, saying, ‘Pray for us to Yahweh our God, and whatever Yahweh our God says, tell us, and we will do it.’
translation:
  language: fr
  text: 'Car vous vous êtes vous-mêmes trompés[a] : c’est vous qui m’avez envoyé vers Yahweh, votre Dieu, en disant : « Prie Yahweh, notre Dieu, en notre faveur. Tout ce que Yahweh, notre Dieu, dira, fais-le-nous connaître, et nous le ferons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « vous vous êtes égarés au péril de vos vies », ce qui souligne les conséquences potentiellement mortelles de leur erreur.'
    reason: La construction hébraïque peut évoquer soit le fait de se tromper soi-même, soit une erreur mettant en danger sa propre vie.
lexical_decisions:
- source_word: התעיתם בְּנַפְשׁוֹתֵיכֶם
  choice: vous vous êtes trompés vous-mêmes
  rationale: Le hifil de תעה associé à בְּנַפְשׁוֹתֵיכֶם est difficile. Cette formulation française naturelle exprime ici l’égarement coupable et l’illusion entretenue par les interlocuteurs eux-mêmes, tout en laissant en note l’interprétation qui met l’accent sur le péril encouru par leur vie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: הִתְפַּלֵּל בַּעֲדֵנוּ
  choice: Prie … pour nous
  rationale: Rend simplement et naturellement la prière faite en faveur d’autrui.
- source_word: וּכְכֹל אֲשֶׁר יֹאמַר
  choice: Tout ce que … dira
  rationale: Exprime en français courant la portée exhaustive de la formule hébraïque.
- source_word: הַגֶּד לָנוּ
  choice: rapporte-le-nous
  rationale: Dans ce contexte, il s’agit de transmettre fidèlement aux demandeurs la réponse reçue de Dieu.
- source_word: וְעָשִׂינוּ
  choice: nous le ferons
  rationale: 'Le pronom explicite naturellement en français l’objet implicite : tout ce que Dieu prescrira.'
theological_decisions:
- issue: Interprétation de התעיתם בנפשותיכם
  choice: vous vous êtes trompés vous-mêmes
  alternative: vous vous êtes égarés au péril de votre vie
  rationale: Le contexte immédiat souligne le caractère fallacieux de leur engagement à obéir. Cependant, נֶפֶשׁ peut désigner la vie, et la tournure peut aussi insister sur les conséquences mortelles de leur erreur ; cette possibilité est donc conservée en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin personnel ; sa transcription le distingue d’un titre tout en restant intelligible.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points marque naturellement l’explication introduite par la seconde proposition en כִּי. La répétition de « Yahweh, notre Dieu » est conservée conformément au texte hébreu.
