  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִֽהְי֣וּ כָל הָ/אֲנָשִׁ֗ים אֲשֶׁר שָׂ֨מוּ אֶת פְּנֵי/הֶ֜ם לָ/ב֤וֹא מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם יָמ֕וּתוּ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/לֹֽא יִהְיֶ֤ה לָ/הֶם֙ שָׂרִ֣יד וּ/פָלִ֔יט מִ/פְּנֵי֙ הָֽ/רָעָ֔ה אֲשֶׁ֥ר אֲנִ֖י מֵבִ֥יא עֲלֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/017.yaml
  text: Then all the men who have set their faces to go to Egypt to sojourn there shall die by the sword[a], by famine, and by pestilence[b]. None of them shall have a survivor or an escapee from the disaster that I am bringing on them.
translation:
  language: fr
  text: Alors, tous les hommes qui ont pris la ferme décision d’aller en Égypte pour y séjourner comme étrangers[a] mourront par l’épée, par la famine et par la peste. Aucun d’eux ne survivra ni n’échappera au malheur que je fais venir sur eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut désigner le fait de résider dans un pays en qualité d’étranger.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Il n’y aura pour eux ni survivant ni rescapé, à cause du malheur que je fais venir sur eux. »'
    reason: formal_equivalence
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: Alors
  rationale: Introduit naturellement la conséquence de l’avertissement précédent; la valeur prédictive est portée par « mourront ».
- source_word: כָל הָאֲנָשִׁים
  choice: tous les hommes
  rationale: Reproduit le pluriel masculin אֲנָשִׁים sans le neutraliser.
- source_word: אֲשֶׁר שָׂמוּ אֶת־פְּנֵיהֶם
  choice: qui ont pris la ferme décision
  rationale: Rend clairement l’idiome hébreu « placer leur visage », qui exprime ici une résolution arrêtée; un calque serait peu naturel en français courant.
- source_word: לָבוֹא מִצְרַיִם
  choice: d’aller en Égypte
  rationale: בוא peut signifier venir, aller ou entrer selon le point de vue; « aller en Égypte » convient au contexte.
- source_word: לָגוּר שָׁם
  choice: pour y séjourner comme étrangers
  rationale: Conserve la nuance de גור, résidence temporaire ou résidence en qualité d’étranger, tout en restant intelligible.
- source_word: יָמוּתוּ
  choice: mourront
  rationale: Exprime directement la prédiction solennelle du jugement.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: par l’épée, par la famine et par la peste
  rationale: Préserve la triade traditionnelle du jugement chez Jérémie et l’image concrète de l’épée.
- source_word: שָׂרִיד וּפָלִיט
  choice: ne survivra ni n’échappera
  rationale: 'Transforme naturellement en verbes la paire nominale hébraïque tout en conservant ses deux idées complémentaires: rester en vie et parvenir à fuir.'
- source_word: מִפְּנֵי הָרָעָה
  choice: au malheur
  rationale: Dans ce contexte de jugement, רָעָה désigne une calamité plutôt que le mal moral.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם
  choice: que je fais venir sur eux
  rationale: Préserve l’action divine explicite ainsi que la valeur actuelle ou imminente du participe מֵבִיא.
theological_decisions:
- issue: Agent du jugement annoncé
  choice: le malheur que je fais venir sur eux
  alternative: le malheur qui viendra sur eux
  rationale: Le texte hébreu attribue explicitement à Dieu la venue du malheur; la formulation retenue ne réduit pas cette responsabilité directe.
- issue: Portée de שָׂרִיד וּפָלִיט
  choice: Aucun d’eux ne survivra ni n’échappera
  alternative: Il ne restera chez eux ni survivant ni rescapé
  rationale: La formulation conserve la totalité du jugement sans donner à שָׂרִיד un sens technique ou doctrinal de « reste ».
translation_notes:
  register: Français international moderne, clair et digne. La tournure idiomatique « ont pris la ferme décision » évite le calque obscur « ont tourné leur visage », tandis que « séjourner comme étrangers » conserve une nuance réelle de l’hébreu. Les deux marqueurs de note figurent dans le texte principal.
