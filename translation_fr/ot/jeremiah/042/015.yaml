  source_fidelity: 'Le sens global est bien rendu : les deux marqueurs discursifs, l’adresse au reste de Juda, la formule prophétique, le nom divin et l’intensité de la résolution sont conservés. Toutefois, « vous qui restez de Juda » affaiblit le substantif collectif שְׁאֵרִית (« reste, survivants »), et « séjourner en étrangers » n’est pas idiomatique en français moderne.'
  naturalness: Le registre est globalement digne et clair, et la virgule finale est nécessaire puisque la protase se poursuit au verset suivant. « Vous, reste de Juda » est une apostrophe naturelle dans un registre prophétique. « Vous vous y rendez pour y séjourner comme étrangers » exprime plus naturellement le déplacement et le statut de résidents étrangers.
  terminology: « Yahweh des armées » et « le Dieu d’Israël » sont fidèles aux expressions hébraïques. « Reste de Juda » préserve le terme collectif établi pour שְׁאֵרִית, sans imposer de lecture théologique supplémentaire. La note doit éviter « votre face » au singulier, alors que l’hébreu porte « vos faces » dans un idiome.
