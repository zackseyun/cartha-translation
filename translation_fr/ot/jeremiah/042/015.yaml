source:
  edition: WLC
  text: וְ/עַתָּ֕ה לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה שְׁאֵרִ֣ית יְהוּדָ֑ה כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם אַ֠תֶּם שׂ֣וֹם תְּשִׂמ֤וּ/ן פְּנֵי/כֶם֙ לָ/בֹ֣א מִצְרַ֔יִם וּ/בָאתֶ֖ם לָ/ג֥וּר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/015.yaml
  text: 'Now therefore hear the word of Yahweh[a], O remnant of Judah. Thus says Yahweh of hosts, the God of Israel: If you are determined to go to Egypt and to go to sojourn there,'
translation:
  language: fr
  text: 'Et maintenant, écoutez donc la parole de Yahweh, vous, reste de Juda. Voici ce que dit Yahweh des armées, le Dieu d’Israël : Si vous êtes fermement décidés[a] à aller en Égypte et que vous vous y rendez pour y séjourner comme étrangers,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si vous fixez résolument vos visages pour aller en Égypte » ; cette expression hébraïque marque une ferme résolution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: Et maintenant, ... donc
  rationale: Conserve à la fois la valeur temporelle de וְעַתָּה et la valeur déductive de לָכֵן, dans un ordre naturel en français.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: écoutez ... la parole de Yahweh
  rationale: Dans cette interpellation prophétique, « écoutez » exprime naturellement l’attention et l’obéissance demandées; « la parole de Yahweh » maintient la formule prophétique.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: vous qui restez de Juda
  rationale: Rend directement le groupe survivant interpellé. Cette formulation est plus claire en français courant que le substantif théologique « reste », tout en conservant le sens collectif de שְׁאֵרִית.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Équivalent français naturel et solennel de la formule de messager prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme, au lieu de lui substituer un titre.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Rend צְבָאוֹת de façon intelligible et conserve les connotations militaires et célestes du titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la construction hébraïque.
- source_word: אִם אַתֶּם שׂוֹם תְּשִׂימוּן פְּנֵיכֶם
  choice: Si vous êtes fermement décidés
  rationale: Exprime l’idiome « placer sa face » ainsi que l’intensification produite par l’infinitif absolu suivi du verbe conjugué.
- source_word: לָבֹא מִצְרַיִם
  choice: à aller en Égypte
  rationale: Avec une destination, בוא désigne ici le déplacement vers l’Égypte; « aller en Égypte » est idiomatique en français.
- source_word: וּבָאתֶם לָגוּר שָׁם
  choice: et que vous y allez pour y séjourner en étrangers
  rationale: Le parfait coordonné prolonge la condition; גור évoque la résidence de personnes étrangères, sans nécessairement fixer ici sa durée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte le nom personnel YHWH. La translittération le distingue du titre אֲדֹנָי et évite de remplacer le nom par un titre.
- issue: Portée du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh de l’univers
  rationale: « Des armées » conserve l’image hébraïque et sa tension entre armées célestes et puissance guerrière, sans la résoudre par une paraphrase cosmique.
- issue: Nuance de גור
  choice: séjourner en étrangers
  alternative: s’installer / séjourner temporairement
  rationale: גור met l’accent sur le statut d’étranger résident. Le texte ne tranche pas à lui seul entre un séjour bref et une installation prolongée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, puisque la conséquence de la proposition conditionnelle se poursuit au verset suivant. Le vocatif est rendu par « vous qui restez de Juda » afin d’éviter l’opacité possible de « reste de Juda ».
