  - severity: medium
    issue: « séjourner en étrangers »
    rationale: La formulation est peu naturelle en français. גור désigne ici le fait de résider en situation d’étranger ; « séjourner comme étrangers » restitue cette nuance dans une syntaxe idiomatique.
  - severity: low
