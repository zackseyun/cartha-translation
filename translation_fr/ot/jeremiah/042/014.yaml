revisions:
- from: 'en disant : « Non ! Nous irons plutôt dans le pays d’Égypte, où nous ne verrons pas la guerre, où nous n’entendrons pas le son de la trompette et où nous n’aurons pas faim de pain. C’est là que nous nous installerons[a]. »'
  to: 'en disant : « Non, nous irons plutôt dans le pays d’Égypte, où nous ne verrons pas la guerre, où nous n’entendrons pas le son de la trompette et où nous ne souffrirons pas de la faim par manque de pain ; là, nous habiterons[a]. »'
  rationale: La révision conserve tous les éléments du texte hébreu et le ton résolu du discours. Elle remplace une expression française ambiguë et peu idiomatique par une formulation explicite qui maintient la mention du pain, et elle rend נֵשֵׁב par « nous habiterons », avec une note qui préserve l’alternative « demeurer ».
