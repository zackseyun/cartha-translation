source:
  edition: WLC
  text: לֵ/אמֹ֗ר לֹ֚א כִּ֣י אֶ֤רֶץ מִצְרַ֨יִם֙ נָב֔וֹא אֲשֶׁ֤ר לֹֽא נִרְאֶה֙ מִלְחָמָ֔ה וְ/ק֥וֹל שׁוֹפָ֖ר לֹ֣א נִשְׁמָ֑ע וְ/לַ/לֶּ֥חֶם לֹֽא נִרְעָ֖ב וְ/שָׁ֥ם נֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/014.yaml
  text: saying[a], ‘No, but we will go into the land of Egypt, where we will not see war, and we will not hear the sound of the trumpet, and we will not be hungry for bread; and there we will live.’
translation:
  language: fr
  text: 'en disant : « Non, nous irons plutôt dans le pays d’Égypte, où nous ne verrons pas la guerre, où nous n’entendrons pas le son de la trompette et où nous ne souffrirons pas de la faim par manque de pain ; là, nous habiterons[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « là, nous demeurerons ». Le verbe hébreu peut désigner le fait d’habiter dans un lieu, d’y demeurer ou d’y résider.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: en disant
  rationale: Cette tournure rattache le verset à la proposition conditionnelle précédente et introduit directement les paroles citées.
- source_word: לֹא כִּי
  choice: Non ! … plutôt
  rationale: Cette formulation exprime le refus énergique suivi de la décision contraire, tout en restant naturelle en français moderne.
- source_word: אֶרֶץ מִצְרַיִם
  choice: le pays d’Égypte
  rationale: « Pays » rend explicitement אֶרֶץ sans la lourdeur qu’aurait ici « terre d’Égypte ».
- source_word: נָבוֹא
  choice: nous irons dans
  rationale: Avec un lieu comme destination, בוא exprime le fait d’y aller ou d’y entrer. « Irons dans » convient naturellement au projet de migration.
- source_word: אֲשֶׁר
  choice: où
  rationale: Le relatif renvoie au pays d’Égypte et introduit les conditions que les locuteurs espèrent y trouver.
- source_word: לֹא נִרְאֶה מִלְחָמָה
  choice: nous ne verrons pas la guerre
  rationale: La traduction conserve l’image concrète du texte hébreu sans la remplacer par le plus interprétatif « subir la guerre ».
- source_word: קוֹל שׁוֹפָר
  choice: le son de la trompette
  rationale: Le שׁוֹפָר est un cor servant notamment à donner l’alarme. « Trompette » est immédiatement compréhensible et la phrase conserve la mention explicite de son bruit.
- source_word: לֹא נִשְׁמָע
  choice: nous n’entendrons pas
  rationale: Le contexte et la série de verbes à la première personne du pluriel appellent cette formulation française directe.
- source_word: וְלַלֶּחֶם לֹא נִרְעָב
  choice: nous n’aurons pas faim de pain
  rationale: Cette traduction garde l’image précise du pain et l’idée de faim exprimées en hébreu, malgré une tournure volontairement plus concrète que le français courant « nous ne manquerons pas de nourriture ».
- source_word: וְשָׁם נֵשֵׁב
  choice: C’est là que nous nous installerons
  rationale: Dans ce contexte de déplacement durable vers l’Égypte, ישׁב évoque l’établissement ou la résidence. La note conserve l’autre nuance possible, celle de demeurer sur place.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La triple reprise de « où » clarifie la série des motifs invoqués sans effacer sa structure parallèle. Le discours garde le ton résolu du refus initial.
