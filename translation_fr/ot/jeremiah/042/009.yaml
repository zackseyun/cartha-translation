  yaml_path: translation/ot/jeremiah/042/009.yaml
  text: And he said to them, “Thus says the LORD, the God of Israel, to whom you sent me to lay your plea before him:”
translation:
  language: fr
  text: 'Il leur dit : « Ainsi parle le Seigneur, le Dieu d’Israël, auprès de qui vous m’avez envoyé pour déposer devant lui votre supplication : »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le Seigneur
  rationale: Rend le tétragramme selon l’usage français courant et digne, sans introduire une vocalisation discutée du nom divin.
- source_word: לְהַפִּיל תְּחִנַּתְכֶם לְפָנָיו
  choice: pour déposer devant lui votre supplication
  rationale: Préserve l’image hébraïque de faire tomber ou déposer une demande devant quelqu’un, tout en restant naturel en français.
- source_word: תְּחִנַּתְכֶם
  choice: votre supplication
  rationale: Exprime une requête pressante et humble, plus précisément qu’une simple demande.
theological_decisions:
- issue: Référent de אֵלָיו (« vers lui »)
  choice: vers qui
  alternative: auprès duquel
  rationale: Le pronom renvoie au Seigneur, Dieu d’Israël; la formulation relative conserve clairement cette relation sans ajouter d’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique « Ainsi parle le Seigneur » est conservée. Le deux-points final maintient la continuité avec l’oracle qui suit.
