source:
  edition: WLC
  text: וְ/הֵ֨מָּה֙ אָמְר֣וּ אֶֽל יִרְמְיָ֔הוּ יְהִ֤י יְהוָה֙ בָּ֔/נוּ לְ/עֵ֖ד אֱמֶ֣ת וְ/נֶאֱמָ֑ן אִם לֹ֡א כְּֽ/כָל הַ֠/דָּבָר אֲשֶׁ֨ר יִֽשְׁלָחֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֵלֵ֖י/נוּ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/005.yaml
  text: And they said to Jeremiah[b][a], “May Yahweh be a true and faithful witness against us if we do not act according to all the word that Yahweh your God sends to us through you.”
translation:
  language: fr
  text: 'Ils dirent à Jérémie : « Que Yahweh soit contre nous un témoin véridique et fidèle si nous n’agissons pas selon toute parole que Yahweh, ton Dieu, nous transmettra par ton intermédiaire.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que Yahweh, ton Dieu, t’enverra vers nous ». Le contexte présente Jérémie comme le porteur de la parole divine. L’expression « contre nous » peut aussi se traduire plus littéralement par « parmi nous ».'
    reason: La note préserve à la fois la construction littérale de יִשְׁלָחֲךָ אֵלֵינוּ et l’ambiguïté prépositionnelle de בָּנוּ, que la traduction courante explicite selon le contexte de serment.
lexical_decisions:
- source_word: יְהִי
  choice: Que … soit
  rationale: Le jussif de היה exprime ici une invocation solennelle; cette tournure convient naturellement à un serment en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בָּנוּ לְעֵד
  choice: contre nous un témoin
  rationale: Dans ce contexte de serment, Yahweh est invoqué comme témoin à charge si les locuteurs n’obéissent pas; la note conserve le sens spatial plus littéral possible de בָּנוּ.
- source_word: אֱמֶת וְנֶאֱמָן
  choice: véridique et fidèle
  rationale: « Véridique » exprime אֱמֶת appliqué au témoin, tandis que « fidèle » rend la fiabilité durable exprimée par נֶאֱמָן.
- source_word: אִם לֹא
  choice: si nous ne… pas
  rationale: Cette formulation introduit clairement la condition négative du serment sans en atténuer la force.
- source_word: כְּכָל הַדָּבָר
  choice: selon toute parole
  rationale: Le singulier collectif דָּבָר peut désigner chaque parole ou l’ensemble du message; « toute parole » préserve le singulier et l’exigence d’obéissance intégrale.
- source_word: יִשְׁלָחֲךָ … אֵלֵינוּ
  choice: nous transmettra par ton intermédiaire
  rationale: Littéralement, Yahweh « enverra Jérémie vers nous »; le contexte implique qu’il l’envoie comme porteur de sa parole. La formulation française explicite sobrement cette fonction.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne du singulier est conservé, sans harmonisation en « notre Dieu ».
- source_word: כֵּן נַעֲשֶׂה
  choice: nous n’agissons pas selon
  rationale: Intégré à la proposition conditionnelle du serment, le verbe exprime leur engagement à agir conformément à la totalité de la parole reçue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin; le conserver évite de le remplacer par un titre.
- issue: Formule « ton Dieu » adressée à Jérémie
  choice: ton Dieu
  alternative: notre Dieu
  rationale: L’hébreu emploie explicitement la deuxième personne masculine du singulier. Le texte français préserve cette formulation et sa possible tension relationnelle.
- issue: Force juridique de בָּנוּ לְעֵד
  choice: témoin contre nous
  alternative: témoin parmi nous
  rationale: Le contexte d’auto-imprécation favorise la fonction accusatrice du témoin en cas de désobéissance, tout en signalant en note l’ambiguïté de la préposition.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe garde la solennité judiciaire du serment sans devenir archaïque. « Par ton intermédiaire » est idiomatique et explicite le rôle de messager implicite dans l’hébreu.
