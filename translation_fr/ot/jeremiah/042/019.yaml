source:
  edition: WLC
  text: דִּבֶּ֨ר יְהוָ֤ה עֲלֵי/כֶם֙ שְׁאֵרִ֣ית יְהוּדָ֔ה אַל תָּבֹ֖אוּ מִצְרָ֑יִם יָדֹ֨עַ֙ תֵּֽדְע֔וּ כִּי הַעִידֹ֥תִי בָ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/019.yaml
  text: 'Yahweh has spoken concerning you[a], remnant of Judah: Do not go to Egypt. Know for certain that I have warned you today.'
translation:
  language: fr
  text: 'Yahweh a parlé à votre sujet, reste de Juda : « N’allez pas en Égypte. Sachez avec certitude que je vous ai avertis[a] aujourd’hui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai témoigné solennellement contre vous aujourd’hui ». Le verbe hébreu peut exprimer un témoignage formel ou un avertissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: a parlé
  rationale: Le parfait présente la parole divine comme prononcée et toujours pertinente ; le passé composé est naturel en français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin plutôt que de lui substituer un titre.
- source_word: עֲלֵיכֶם
  choice: à votre sujet
  rationale: Avec דִּבֶּר, la préposition עַל signifie ici naturellement « au sujet de » ; « contre vous » accentuerait indûment l’hostilité.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: reste de Juda
  rationale: « Reste » conserve à la fois le sens historique des survivants et la résonance prophétique du terme.
- source_word: אַל תָּבֹאוּ
  choice: N’allez pas
  rationale: La tournure exprime clairement l’interdiction de se rendre dans un pays ; « n’entrez pas » serait plus littéral mais moins idiomatique dans ce contexte.
- source_word: מִצְרַיִם
  choice: Égypte
  rationale: Forme française usuelle du nom de lieu.
- source_word: יָדֹעַ תֵּדְעוּ
  choice: Sachez avec certitude
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’exhortation ; cette formulation en restitue l’insistance en français clair.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qu’ils doivent savoir.
- source_word: הַעִידֹתִי בָכֶם
  choice: je vous ai avertis
  rationale: Le hiphil de עוּד peut désigner un avertissement ou un témoignage solennel. Dans le contexte, « avertis » exprime naturellement la fonction de la déclaration, tandis que la note conserve la nuance judiciaire possible.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français direct et naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: « Yahweh » préserve le nom personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- issue: Portée de שְׁאֵרִית
  choice: reste de Juda
  alternative: survivants de Juda
  rationale: « Reste » maintient ensemble la réalité historique des survivants et la portée prophétique du terme, sans développer une interprétation doctrinale supplémentaire.
- issue: Nuance de הַעִידֹתִי בָכֶם
  choice: je vous ai avertis
  alternative: j’ai témoigné solennellement contre vous
  rationale: Le contexte favorise l’acte d’avertir, mais le verbe et la préposition peuvent aussi évoquer un témoignage formel à charge ; cette possibilité est donc signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse « reste de Juda » conserve le registre prophétique, et les guillemets délimitent naturellement la parole divine rapportée.
