base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/006.yaml
  text: Whether it is good or whether it is bad, we will obey the voice of the LORD our God, to whom we are sending you, so that it may go well with us when we obey the voice of the LORD our God.
translation:
  language: fr
  text: Que ce soit bon ou mauvais, nous obéirons à la voix du SEIGNEUR notre Dieu, vers qui nous t’envoyons, afin que tout aille bien pour nous, puisque nous obéirons à la voix du SEIGNEUR notre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם טוֹב וְאִם רָע
  choice: Que cela nous paraisse bon ou mauvais
  rationale: Rend l’alternative hébraïque de manière naturelle tout en explicitant qu’il s’agit de leur appréciation du message reçu, non de la qualité morale de la parole divine.
- source_word: בְּקוֹל ... נִשְׁמָע
  choice: nous obéirons à la voix de…
  rationale: L’expression hébraïque « écouter la voix » implique ici l’obéissance; la formulation conserve l’image de la voix tout en exprimant clairement sa force.
- source_word: אֲשֶׁר אֲנַחְנוּ שֹׁלְחִים אֹתְךָ אֵלָיו
  choice: vers qui nous t’envoyons
  rationale: 'Suit directement la relation grammaticale du texte hébreu: le pronom renvoie au SEIGNEUR, auprès de qui Jérémie est envoyé.'
- source_word: לְמַעַן אֲשֶׁר יִיטַב לָנוּ
  choice: Ainsi, tout ira bien pour nous
  rationale: Formulation française idiomatique qui restitue le but ou le résultat favorable exprimé par לְמַעַן et יִיטַב.
- source_word: כִּי נִשְׁמַע
  choice: puisque nous obéirons
  rationale: כִּי reçoit ici sa valeur causale la plus directe. L’ambiguïté possible avec une nuance temporelle demeure reconnue dans la décision théologique.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme, en petites capitales typographiques simulées par des capitales.
theological_decisions:
- issue: Lien logique exprimé par כִּי dans la dernière proposition
  choice: puisque nous obéirons
  alternative: quand nous obéirons
  rationale: 'Le sens causal de כִּי est le plus immédiat dans le texte massorétique: leur bien-être est associé à leur obéissance déclarée. La lecture temporelle reste possible, mais elle précise davantage le rapport que ne le fait l’hébreu.'
- issue: Portée de « bon ou mauvais »
  choice: ce qui leur paraît bon ou mauvais
  alternative: que le message soit bon ou mauvais en lui-même
  rationale: Le contexte présente l’engagement du peuple à accepter la réponse divine, agréable ou pénible à entendre. Cette formulation évite de suggérer que la parole de Dieu pourrait être moralement mauvaise.
translation_notes:
  register: Français moderne, international et digne. La répétition de « la voix du SEIGNEUR notre Dieu » est conservée parce qu’elle structure l’engagement solennel du peuple. Le tutoiement correspond à l’adresse singulière à Jérémie.
