  rationale: La révision retire l’explicitation subjective absente de l’hébreu et restitue plus directement la finalité introduite par לְמַעַן. Elle conserve « puisque » pour כִּי, lecture causale naturelle et bien attestée par le contexte, ainsi que la répétition et le registre solennel de l’original.
