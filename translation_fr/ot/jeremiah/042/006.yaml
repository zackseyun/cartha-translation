- from: Que cela nous paraisse bon ou mauvais, nous obéirons à la voix du SEIGNEUR notre Dieu, vers qui nous t’envoyons. Ainsi, tout ira bien pour nous, puisque nous obéirons à la voix du SEIGNEUR notre Dieu.
