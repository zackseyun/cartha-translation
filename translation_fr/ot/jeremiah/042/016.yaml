id: JER.42.16
reference: Jeremiah 42:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיְתָ֣ה הַ/חֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔/נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְ/כֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הָ/רָעָ֞ב אֲשֶׁר אַתֶּ֣ם דֹּאֲגִ֣ים מִמֶּ֗/נּוּ שָׁ֣ם יִדְבַּ֧ק אַחֲרֵי/כֶ֛ם מִצְרַ֖יִם וְ/שָׁ֥ם תָּמֻֽתוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/016.yaml
  text: Then the sword that you fear will overtake you there in the land of Egypt[a], and the famine that you dread will follow close after you there in Egypt[b], and there you will die.
translation:
  language: fr
  text: Alors, l’épée que vous redoutez vous rattrapera là, en Égypte, et la famine qui vous inquiète s’attachera à vos pas là, en Égypte[a] ; c’est là que vous mourrez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’attachera derrière vous » ; l’image évoque une poursuite dont on ne peut se défaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Alors, …
  rationale: Introduit naturellement en français la conséquence annoncée, sans reproduire la tournure hébraïque de manière pesante.
- source_word: הַחֶרֶב
  choice: l’épée
  rationale: Conserve l’image prophétique concrète de la mort violente et de la guerre.
- source_word: יְרֵאִים מִמֶּנָּה
  choice: que vous redoutez
  rationale: Exprime une peur forte dans un français naturel et convient à la menace de l’épée.
- source_word: תַּשִּׂיג אֶתְכֶם
  choice: vous rattrapera
  rationale: 'Rend le sens de poursuite du hiphil de נשׂג : atteindre quelqu’un qui cherche à échapper.'
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: là, en Égypte
  rationale: Préserve שָׁם et la destination géographique, tout en évitant le tour plus lourd « dans le pays d’Égypte » en français moderne.
- source_word: הָרָעָב
  choice: la famine
  rationale: Désigne ici une calamité collective, non la simple sensation de faim.
- source_word: דֹּאֲגִים מִמֶּנּוּ
  choice: qui vous inquiète
  rationale: דאג exprime l’inquiétude ou le souci anxieux ; cette formulation maintient la nuance distincte de ירא, employé pour l’épée.
- source_word: יִדְבַּק אַחֲרֵיכֶם
  choice: s’attachera à vos pas
  rationale: Conserve l’image de דבק, « s’attacher, adhérer », avec l’idée d’une poursuite persistante exprimée idiomatiquement en français.
- source_word: וְשָׁם תָּמֻתוּ
  choice: c’est là que vous mourrez
  rationale: La construction clivée restitue avec naturel l’insistance répétée sur שָׁם, le lieu même où ils espèrent trouver refuge.
theological_decisions:
- issue: Nature des jugements désignés par « l’épée » et « la famine »
  choice: Maintenir les images concrètes « l’épée » et « la famine ».
  alternative: Interpréter par « la guerre » et « la faim », ou expliciter « la mort violente » et « la famine ».
  rationale: Le texte hébreu emploie des images prophétiques traditionnelles de jugement. Les conserver évite d’en réduire ou d’en préciser indûment la portée.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « là, en Égypte » et l’emphase finale sont maintenues afin de souligner que le lieu recherché comme refuge deviendra le lieu du jugement.
