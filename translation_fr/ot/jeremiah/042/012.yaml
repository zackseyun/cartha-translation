  text: וְ/אֶתֵּ֥ן לָ/כֶ֛ם רַחֲמִ֖ים וְ/רִחַ֣ם אֶתְ/כֶ֑ם וְ/הֵשִׁ֥יב אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/012.yaml
  text: And I will show you mercy[a], and he will have mercy on you and restore you to your own land.
translation:
  language: fr
  text: Je vous accorderai de la compassion[a], et il aura compassion de vous et vous ramènera dans votre pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Je vous donnerai de la compassion » ; autre traduction possible : « Je vous accorderai miséricorde ».'
    reason: L'hébreu emploie littéralement « donner » avec le nom « compassion ». La note signale cette formulation tout en laissant le texte français conserver une tournure naturelle; elle ne précise pas indûment de qui provient la compassion.
lexical_decisions:
- source_word: וְאֶתֵּן לָכֶם רַחֲמִים
  choice: Je vous ferai obtenir compassion
  rationale: Littéralement, « je vous donnerai compassion ». En français actuel, « faire obtenir compassion » exprime naturellement que Dieu disposera le tiers mentionné ensuite à la compassion, sans effacer le passage explicite de la première à la troisième personne.
- source_word: וְרִחַם אֶתְכֶם
  choice: il aura compassion de vous
  rationale: Le verbe רחם reprend la même racine que רַחֲמִים. « Avoir compassion de » conserve cet écho lexical et le sujet masculin singulier distinct.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: et vous ramènera
  rationale: Le hiphil de שוב indique ici l’action de faire revenir. « Ramènera » est naturel, précis et conserve la valeur causative.
- source_word: אֶל אַדְמַתְכֶם
  choice: sur votre terre
  rationale: אֲדָמָה désigne la terre ou le sol. Avec « ramener », « sur votre terre » est idiomatique en français et respecte le possessif sans ajouter l’idée de patrie.
theological_decisions:
- issue: Changement de sujet entre la première personne divine et les verbes à la troisième personne du masculin singulier
  choice: 'Conserver le changement : « Je… il… »'
  alternative: 'Harmoniser tous les verbes à la première personne : « j’aurai compassion… je vous ramènerai »'
  rationale: L’hébreu passe explicitement de אֶתֵּן, première personne du singulier, à רִחַם et הֵשִׁיב, troisième personne du masculin singulier. Le contexte permet de comprendre ce « il » comme le roi de Babylone, mais le texte du verset ne le nomme pas; la traduction préserve donc à la fois le changement grammatical et cette référence contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points rend lisible le lien entre le don divin de compassion et l’action du sujet humain, tout en maintenant le changement de personne de l’hébreu.
