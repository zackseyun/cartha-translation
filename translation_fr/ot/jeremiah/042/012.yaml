    issue: « Je vous ferai obtenir compassion »
    rationale: Cette expression est peu idiomatique et transforme « je vous donnerai/accorderai de la compassion » en une action consistant à faire obtenir la compassion d'un tiers. Le contexte peut suggérer ce tiers, mais le verset n'exprime pas cette médiation dans le premier verbe.
  - severity: low
    issue: « sur votre terre »
    rationale: La formule est compréhensible, mais « ramener dans votre pays » est plus usuelle en français pour le retour vers le territoire où l'on réside. Elle rend adéquatement אַדָמָה dans ce contexte.
  revised_text: Je vous accorderai de la compassion[a], et il aura compassion de vous et vous ramènera dans votre pays.
