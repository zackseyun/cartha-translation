source:
  edition: WLC
  text: וְ/עַתָּה֙ יָדֹ֣עַ תֵּֽדְע֔וּ כִּ֗י בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר תָּמ֑וּתוּ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר חֲפַצְתֶּ֔ם לָ/ב֖וֹא לָ/ג֥וּר שָֽׁם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/022.yaml
  text: Now therefore[a], know for certain that you will die by the sword, by famine, and by pestilence in the place where you desired to go to sojourn there.
translation:
  language: fr
  text: 'Maintenant donc, sachez-le avec certitude : vous mourrez par l’épée, par la famine et par l’épidémie[a], dans le lieu où vous avez désiré aller séjourner.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la peste ». Le terme hébreu peut désigner plus généralement une maladie épidémique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Marque la transition et la conséquence de l’avertissement précédent, sans développer davantage le lien logique.
- source_word: יָדֹעַ תֵּדְעוּ
  choice: sachez-le avec certitude
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’injonction; cette formulation française rend clairement cette insistance.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: par l’épée, par la famine et par l’épidémie
  rationale: Conserve le parallélisme de la triade prophétique; « épidémie » exprime en français actuel la maladie contagieuse collective désignée par דֶּבֶר.
- source_word: תָּמ֑וּתוּ
  choice: vous mourrez
  rationale: Le futur simple rend naturellement l’annonce solennelle et certaine du jugement.
- source_word: בַּמָּקוֹם
  choice: dans le pays
  rationale: מָקוֹם signifie littéralement « lieu », mais désigne ici la contrée de destination, l’Égypte; « pays » évite une tournure finale lourde en français.
- source_word: אֲשֶׁר חֲפַצְתֶּם
  choice: où vous avez désiré
  rationale: Préserve la nuance volontaire de חפץ et l’ironie liée à la destination choisie.
- source_word: לָבוֹא לָגוּר שָׁם
  choice: aller séjourner
  rationale: « Aller » convient au point de vue du locuteur, tandis que « séjourner » rend la résidence temporaire ou étrangère exprimée par גור; le sens locatif de שָׁם est déjà porté par « où ».
theological_decisions:
- issue: Formule de jugement חרב / רעב / דבר
  choice: par l’épée, par la famine et par l’épidémie
  alternative: par l’épée, par la famine et par la peste
  rationale: La traduction conserve la triade récurrente du jugement prophétique sans lui ajouter d’interprétation doctrinale; « épidémie » reste assez large pour ne pas identifier une maladie précise.
translation_notes:
  register: Français international actuel, digne et direct. La répétition de « par » maintient le rythme solennel de la triade. « Sachez-le avec certitude » préserve l’emphase hébraïque sans archaïsme.
