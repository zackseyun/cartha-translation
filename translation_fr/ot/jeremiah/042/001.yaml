source:
  edition: WLC
  text: וַֽ/יִּגְּשׁוּ֙ כָּל שָׂרֵ֣י הַ/חֲיָלִ֔ים וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וִֽ/יזַנְיָ֖ה בֶּן הוֹשַֽׁעְיָ֑ה וְ/כָל הָ/עָ֖ם מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/001.yaml
  text: Then all the commanders of the forces approached[a], along with Yohanan son of Kareah and Yizaniah son of Hoshaiah[b], and all the people from the least to the greatest.
translation:
  language: fr
  text: Alors tous les chefs des troupes[a], ainsi que Yohanan, fils de Qaréah, et Yizaniah, fils de Hoshaya, et tout le peuple, du plus petit au plus grand[b], s’approchèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les commandants des forces » ou « tous les officiers de l’armée ».
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque désignant l’ensemble de la communauté, sans exception.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: s’approchèrent
  rationale: Le verbe נגשׁ désigne ici le fait de s’avancer ou de venir auprès de quelqu’un. « S’approchèrent » est naturel en français et ne précise pas davantage que l’hébreu la destination, fournie par le contexte.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: tous les chefs des troupes
  rationale: שָׂרֵי désigne des chefs ou commandants, tandis que חֲיָלִים renvoie ici à des forces militaires. « Chefs des troupes » restitue clairement ce sens sans employer un grade moderne trop précis.
- source_word: וְיוֹחָנָן בֶּן־קָרֵחַ
  choice: Yohanan, fils de Qaréah
  rationale: Les noms sont translittérés d’après l’hébreu. « Fils de » conserve la désignation patronymique habituelle.
- source_word: וִיזַנְיָה בֶּן־הוֹשַׁעְיָה
  choice: Yizania, fils de Hoshaya
  rationale: Cette forme suit au plus près les consonnes et la vocalisation du texte massorétique, plutôt que les formes traditionnelles issues d’autres langues.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: הָעָם est le terme courant pour désigner collectivement le peuple ou la population ; la traduction simple convient au contexte.
- source_word: מִקָּטֹן וְעַד־גָּדוֹל
  choice: du plus petit au plus grand
  rationale: La traduction conserve le mérisme hébreu qui englobe toutes les catégories de la communauté, sans le réduire à une distinction d’âge, de taille ou de statut.
theological_decisions: []
