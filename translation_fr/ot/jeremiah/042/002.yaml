  text: וַ/יֹּאמְר֞וּ אֶֽל יִרְמְיָ֣הוּ הַ/נָּבִ֗יא תִּפָּל נָ֤א תְחִנָּתֵ֨/נוּ֙ לְ/פָנֶ֔י/ךָ וְ/הִתְפַּלֵּ֤ל בַּעֲדֵ֨/נוּ֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּעַ֖ד כָּל הַ/שְּׁאֵרִ֣ית הַ/זֹּ֑את כִּֽי נִשְׁאַ֤רְנוּ מְעַט֙ מֵֽ/הַרְבֵּ֔ה כַּ/אֲשֶׁ֥ר עֵינֶ֖י/ךָ רֹא֥וֹת אֹתָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/002.yaml
  text: And they said to Jeremiah the prophet[a], “Please let our plea come before you, and pray for us to Yahweh your God, for all this remnant, for we are left as few out of many[b], as your eyes see us.”
translation:
  language: fr
  text: 'Ils dirent au prophète Jérémie : « Nous t’en prions, que notre supplication[a] parvienne jusqu’à toi, et prie Yahweh, ton Dieu, pour nous, pour tout ce reste. Car, de nombreux que nous étions, nous ne sommes plus qu’un petit nombre, comme tu peux le constater de tes propres yeux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que notre supplication tombe devant toi », expression désignant la présentation instante d’une requête.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפָּל נָא תְחִנָּתֵנוּ לְפָנֶיךָ
  choice: Nous t’en prions, accueille notre supplication
  rationale: L’expression hébraïque dit littéralement que la supplication « tombe devant » Jérémie. La formulation française exprime naturellement la présentation instante d’une requête, tandis que la note conserve l’image originale.
- source_word: וְהִתְפַּלֵּל בַּעֲדֵנוּ
  choice: et prie ... en notre faveur
  rationale: Le hitpael de פלל désigne ici la prière faite pour autrui. « Prie ... en notre faveur » reste clair et plus proche de la répétition de בַּעַד que le terme plus interprétatif « intercède ».
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré « Yahweh ». Le possessif singulier « ton » conserve la manière dont les interlocuteurs parlent à Jérémie de son Dieu.
- source_word: בְּעַד כָּל הַשְּׁאֵרִית הַזֹּאת
  choice: en faveur de tout ce reste
  rationale: « Reste » conserve le vocabulaire prophétique récurrent de שְׁאֵרִית sans préciser davantage l’identité ou le statut des survivants.
- source_word: כִּי נִשְׁאַרְנוּ מְעַט מֵהַרְבֵּה
  choice: Car, de nombreux que nous étions, nous ne sommes plus qu’un petit nombre
  rationale: Cette formulation française rend le contraste entre la multitude antérieure et le petit nombre qui subsiste, implicite dans l’expression hébraïque concise.
- source_word: כַּאֲשֶׁר עֵינֶיךָ רֹאוֹת אֹתָנוּ
  choice: comme tu peux le constater de tes propres yeux
  rationale: La tournure idiomatique française garde la référence appuyée aux yeux de Jérémie et à son observation directe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme, rendu par la translittération du nom propre plutôt que par un titre de substitution.
- issue: Maintien du vocabulaire du « reste »
  choice: tout ce reste
  alternative: tous ces survivants
  rationale: « Reste » préserve un terme important et récurrent chez Jérémie, sans introduire une interprétation supplémentaire.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le vouvoiement n’est pas employé : le singulier hébreu adressé à Jérémie est rendu par « tu », usage naturel dans ce contexte biblique. La répétition « en notre faveur, en faveur de » reproduit l’insistance de l’hébreu sans alourdir excessivement la phrase.'
