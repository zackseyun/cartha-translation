source:
  edition: WLC
  text: וְ/אִם אֹמְרִ֣ים אַתֶּ֔ם לֹ֥א נֵשֵׁ֖ב בָּ/אָ֣רֶץ הַ/זֹּ֑את לְ/בִלְתִּ֣י שְׁמֹ֔עַ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/013.yaml
  text: But if you say[a], ‘We will not stay in this land,’ not obeying the voice of Yahweh your God—
translation:
  language: fr
  text: 'Mais si vous dites : « Nous ne resterons pas dans ce pays », afin de ne pas obéir[a] à la voix de Yahweh, votre Dieu—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « écouter la voix de ». En hébreu, cette expression implique souvent une écoute qui se traduit par l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction et la particule conditionnelle introduisent ici une hypothèse qui contraste avec l’assurance donnée auparavant.
- source_word: אֹמְרִים אַתֶּם
  choice: vous dites
  rationale: Le participe accompagné du pronom explicite se rend naturellement en français par un présent dans cette proposition conditionnelle.
- source_word: לֹא נֵשֵׁב
  choice: Nous ne resterons pas
  rationale: Dans ce contexte, יָשַׁב désigne le fait de demeurer ou de se maintenir dans le pays; « rester » exprime clairement la décision envisagée.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: Ici, אֶרֶץ désigne concrètement le territoire de Juda. « Pays » est naturel en français tout en conservant la portée géographique du terme.
- source_word: לְבִלְתִּי
  choice: afin de ne pas
  rationale: Cette construction infinitive exprime le but ou l’intention négative; la traduction conserve ce rapport sans le réduire à une simple circonstance.
- source_word: שְׁמֹעַ בְּקוֹל
  choice: obéir à la voix de
  rationale: L’expression hébraïque signifie littéralement écouter la voix, mais implique dans ce contexte une écoute suivie d’obéissance. « Obéir à la voix de » garde à la fois le sens idiomatique et l’image de la parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Cette traduction directe conserve l’adresse collective et la relation d’alliance exprimée par le possessif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Valeur de שׁמע בקול dans un contexte d’alliance
  choice: obéir à la voix de
  alternative: écouter la voix de
  rationale: La formule désigne une écoute qui entraîne une réponse obéissante. La traduction retenue rend cette portée tout en conservant l’image de la voix.
translation_notes:
  register: Français moderne, courant et digne. La phrase reste ouverte par un tiret, conformément à la continuité syntaxique avec le verset suivant. « Afin de ne pas » conserve la nuance intentionnelle de l’infinitif hébreu.
