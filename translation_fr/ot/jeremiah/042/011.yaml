  variant: modern international French
source:
  edition: WLC
  text: אַל תִּֽירְא֗וּ מִ/פְּנֵי֙ מֶ֣לֶךְ בָּבֶ֔ל אֲשֶׁר אַתֶּ֥ם יְרֵאִ֖ים מִ/פָּנָ֑י/ו אַל תִּֽירְא֤וּ מִמֶּ֨/נּוּ֙ נְאֻם יְהוָ֔ה כִּֽי אִתְּ/כֶ֣ם אָ֔נִי לְ/הוֹשִׁ֧יעַ אֶתְ/כֶ֛ם וּ/לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/011.yaml
  text: Do not fear the king of Babylon[a], before whom you are afraid. Do not fear him, declares Yahweh[b], for I am with you to save you and to deliver you from his hand.
translation:
  language: fr
  text: N’ayez pas peur du roi de Babylone, que vous redoutez. N’ayez pas peur de lui, déclare Yahweh, car je suis avec vous pour vous sauver et vous délivrer de sa main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּירְאוּ / יְרֵאִים
  choice: ayez peur / redoutez
  rationale: Le français naturel ne permet pas de reproduire élégamment toutes les occurrences par un seul verbe. « Avoir peur » convient à l’interdiction répétée, tandis que « redouter » exprime l’état présent indiqué par le participe.
- source_word: מִפְּנֵי ... מִפָּנָיו
  choice: du roi de Babylone, que vous redoutez
  rationale: Après ירא, la locution littérale « de devant la face de » désigne l’objet de la crainte. La formulation française conserve ce sens sans importer l’image faciale peu naturelle ici.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Équivalent français direct et usuel de la construction hébraïque.
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: La préposition française requise après « avoir peur » correspond naturellement à la construction idiomatique hébraïque.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formulation conserve le caractère solennel et formulaire de l’expression prophétique, plutôt que de la réduire à un simple « dit Yahweh ».
- source_word: כִּי אִתְּכֶם אָנִי
  choice: car je suis avec vous
  rationale: La proposition donne le fondement de l’interdiction et préserve l’insistance de l’hébreu sur la présence divine.
- source_word: לְהוֹשִׁיעַ
  choice: pour vous sauver
  rationale: « Sauver » rend le hiphil de ישׁע et demeure distinct du verbe suivant.
- source_word: וּלְהַצִּיל
  choice: et vous délivrer
  rationale: « Délivrer » rend נצל sans confondre les deux verbes hébreux coordonnés.
- source_word: מִיָּדוֹ
  choice: de sa main
  rationale: L’image biblique de la main comme puissance ou emprise reste claire en français et mérite d’être conservée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » maintient le nom propre divin sans le remplacer par un titre.
- issue: Portée de la promesse divine
  choice: « pour vous sauver et vous délivrer » exprime le but de la présence de Yahweh
  alternative: interpréter les infinitifs comme une simple conséquence
  rationale: Les infinitifs préfixés par לְ dépendent naturellement de « je suis avec vous » et présentent ici le dessein salvateur, sans préciser davantage la manière dont il s’accomplira.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « N’ayez pas peur » reproduit l’insistance du texte. « Que vous redoutez » évite le tour lourd « devant qui vous avez peur », tout en gardant la reprise de la crainte actuelle. Les tirets isolent naturellement la formule prophétique.
