  text: וְ/עָשָׂ֤ה ה/רעה בְּ/עֵינַ֔/י לְ/בִלְתִּ֖י שְׁמֹ֣עַ בְּ/קוֹלִ֑/י וְ/נִֽחַמְתִּי֙ עַל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָמַ֖רְתִּי לְ/הֵיטִ֥יב אוֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/010.yaml
  text: but if it does what is evil in my sight[a], not listening to my voice[b], then I will relent concerning the good that I said I would do to it.
translation:
  language: fr
  text: mais si elle fait ce qui est mal à mes yeux, sans écouter ma voix, alors je renoncerai[a] au bien que j’avais dit lui faire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je changerai d’avis ». Le verbe hébreu peut désigner le fait de renoncer à une ligne d’action annoncée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lui faire du bien ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וְעָשָׂה
  choice: mais si elle fait
  rationale: Le verbe signifie « faire ». La condition est reprise du verset précédent, d’où l’ajout naturel de « si ». Le pronom renvoie collectivement à la nation ou à l’entité politique évoquée dans le contexte.
- source_word: הָרָעָה בְּעֵינַי
  choice: ce qui est mal à mes yeux
  rationale: Cette formulation conserve l’idiome hébreu « à mes yeux » tout en exprimant clairement l’évaluation morale de Dieu.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלִי
  choice: sans écouter ma voix
  rationale: La construction exprime le refus ou le fait de ne pas tenir compte de la voix de Dieu. « Écouter ma voix » préserve l’image hébraïque et laisse entendre sa portée d’obéissance.
- source_word: וְנִחַמְתִּי
  choice: alors je reviendrai sur
  rationale: Dans ce contexte, נחם désigne l’abandon ou la révision d’une action annoncée. « Revenir sur » est naturel en français et préserve la contingence réelle de l’annonce sans suggérer une faute morale de Dieu.
- source_word: עַל הַטּוֹבָה
  choice: sur le bien
  rationale: La préposition introduit ici ce sur quoi porte le changement de conduite annoncé; « sur le bien » s’accorde naturellement avec « revenir sur ».
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: que j’avais déclaré
  rationale: « Déclaré » rend אמר dans le cadre d’une annonce divine. Le plus-que-parfait explicite l’antériorité de cette annonce en français.
- source_word: לְהֵיטִיב אֹתוֹ
  choice: vouloir lui faire
  rationale: 'Avec « le bien » comme antécédent, cette formulation évite une répétition lourde tout en gardant le sens de l’infinitif causatif : faire du bien ou agir favorablement envers elle.'
theological_decisions:
- issue: Langage de נחם appliqué à Dieu
  choice: je reviendrai sur
  alternative: je changerai d’avis au sujet de
  rationale: Le verset présente le bien annoncé comme dépendant de la conduite de la nation. La traduction retenue conserve cette tension théologique et le changement de ligne d’action, sans attribuer à Dieu un repentir moral.
translation_notes:
  register: Français international actuel, digne et accessible. La structure conditionnelle est rendue explicitement; l’idiome « à mes yeux » et l’image d’« écouter ma voix » sont conservés. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
