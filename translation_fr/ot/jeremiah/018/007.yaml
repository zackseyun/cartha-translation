base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/007.yaml
  text: At one moment I may speak concerning a nation and concerning a kingdom[a], to uproot and to tear down and to destroy.
translation:
  language: fr
  text: À un moment, je parle au sujet d’une nation et d’un royaume[a], afin de déraciner, d’abattre et de détruire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre une nation et contre un royaume ». La préposition peut prendre ici un sens plus adversatif, compte tenu des verbes de jugement qui suivent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: À un moment donné
  rationale: Le nom désigne un moment ou un instant. Cette formulation conserve la valeur temporelle et prépare la structure parallèle du verset suivant.
- source_word: אֲדַבֵּר
  choice: je parle
  rationale: L’imparfait piel à la première personne décrit ici une action susceptible de se produire dans l’énoncé d’un principe général. Le présent français convient naturellement à cette portée générale sans transformer explicitement la modalité en capacité.
- source_word: עַל
  choice: au sujet de
  rationale: Avec le verbe « parler », la préposition peut introduire le thème ou l’objet de la déclaration. Cette traduction préserve cette valeur sans imposer d’emblée le sens adversatif, tandis que les verbes suivants expriment clairement le jugement.
- source_word: גּוֹי
  choice: nation
  rationale: « Nation » rend naturellement l’entité collective et politique visée.
- source_word: מַמְלָכָה
  choice: royaume
  rationale: Le terme désigne un royaume ou un domaine royal et forme une paire naturelle avec « nation ».
- source_word: לִנְתוֹשׁ
  choice: les déraciner
  rationale: Le verbe évoque l’arrachage d’une plante avec ses racines, image caractéristique chez Jérémie. « Déraciner » la conserve dans un français actuel.
- source_word: לִנְתוֹץ
  choice: les démolir
  rationale: Le verbe désigne l’action d’abattre ou de démolir, notamment une construction. « Démolir » maintient cette image destructive.
- source_word: וּלְהַאֲבִיד
  choice: les détruire
  rationale: Le hiphil de אבד signifie ici faire périr ou détruire. « Détruire » est clair et approprié à la progression du jugement.
theological_decisions:
- issue: Valeur de la formule de parole divine dans l’énoncé conditionnel des versets 7 à 10
  choice: 'Présent de portée générale : « je parle »'
  alternative: « je peux parler » ou « je déclarerai »
  rationale: Le passage énonce un principe général concernant les annonces de Dieu envers les nations. Le présent français garde cette portée ouverte et situationnelle sans réduire le texte à un événement passé ni présenter la modalité comme une simple capacité.
- issue: Orientation de la parole envers la nation et le royaume
  choice: « au sujet d’une nation et d’un royaume »
  alternative: « contre une nation et contre un royaume »
  rationale: La préposition עַל permet ici une lecture thématique aussi bien qu’adversative. Le texte principal conserve la formulation la moins restrictive, et la note signale l’autre possibilité, particulièrement plausible à cause des verbes de jugement.
translation_notes:
  register: Français international moderne, clair et digne. La répétition des pronoms « les » rend explicite en français que les trois infinitifs portent sur la nation et le royaume, sans modifier le sens. Le rythme ternaire conserve la force de l’hébreu.
