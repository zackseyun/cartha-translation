id: JER.18.19
reference: Jeremiah 18:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַקְשִׁ֥יבָ/ה יְהוָ֖ה אֵלָ֑/י וּ/שְׁמַ֖ע לְ/ק֥וֹל יְרִיבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/019.yaml
  text: Pay attention to me[a], O Yahweh, and hear the voice of my adversaries.
translation:
  language: fr
  text: Prête attention à moi, Yahweh, et écoute la voix de mes adversaires[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « écoute la voix de mes adversaires » peut demander à Dieu soit d’entendre leurs accusations contre Jérémie, soit de prendre connaissance de leurs manœuvres hostiles.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Prête attention
  rationale: L’impératif hiphil de קשׁב demande une écoute attentive. « Prête attention » exprime naturellement en français moderne l’urgence de la requête.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֵלַי
  choice: à moi
  rationale: 'La préposition אֶל avec le suffixe de première personne indique clairement la direction : Jérémie demande à Yahweh de tourner son attention vers lui.'
- source_word: וּשְׁמַע
  choice: et écoute
  rationale: L’impératif qal de שׁמע signifie « entendre » ou « écouter ». « Écoute » convient à une supplication adressée directement à Dieu et maintient le parallélisme avec le premier impératif.
- source_word: לְקוֹל
  choice: la voix de
  rationale: קוֹל désigne littéralement la voix ou le son. La formulation concrète « la voix de » conserve l’image hébraïque sans préciser indûment ce qui est dit.
- source_word: יְרִיבַי
  choice: mes adversaires
  rationale: Le terme issu de ריב désigne ceux qui contestent, accusent ou s’opposent au prophète. « Mes adversaires » garde cette portée générale sans réduire le contexte à une procédure judiciaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel du Dieu d’Israël sans lui substituer un titre.
- issue: Objet de l’écoute demandée
  choice: Conserver « écoute la voix de mes adversaires »
  alternative: « écoute leurs accusations » ou « prends garde à leurs complots »
  rationale: L’hébreu ne précise pas si Jérémie demande à Dieu d’entendre les accusations prononcées contre lui ou de prendre connaissance des projets hostiles de ses opposants. Le texte principal et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La répétition sémantique entre « prête attention » et « écoute » conserve le parallélisme pressant de la prière hébraïque.
