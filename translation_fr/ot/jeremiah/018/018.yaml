  to: 'Alors ils dirent : « Venez, élaborons des plans contre Jérémie, car l’enseignement ne disparaîtra pas chez le prêtre, ni le conseil chez le sage, ni la parole chez le prophète. Venez, attaquons-le par la langue[a] et ne prêtons attention à aucune de ses paroles. »'
  rationale: La révision rend explicitement la relation exprimée par מִן dans les trois membres parallèles (« chez le prêtre... ») et remplace une image française maladroite par une expression naturelle, tout en maintenant l’image littérale dans la note. Aucun changement de sens, de registre ni de portée théologique n’est introduit.
