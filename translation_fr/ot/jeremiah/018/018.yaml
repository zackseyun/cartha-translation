  text: וַ/יֹּאמְר֗וּ לְכ֨וּ וְ/נַחְשְׁבָ֣ה עַֽל יִרְמְיָהוּ֮ מַחֲשָׁבוֹת֒ כִּי֩ לֹא תֹאבַ֨ד תּוֹרָ֜ה מִ/כֹּהֵ֗ן וְ/עֵצָה֙ מֵֽ/חָכָ֔ם וְ/דָבָ֖ר מִ/נָּבִ֑יא לְכוּ֙ וְ/נַכֵּ֣/הוּ בַ/לָּשׁ֔וֹן וְ/אַל נַקְשִׁ֖יבָה אֶל כָּל דְּבָרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/018.yaml
  text: Then they said[a], “Come, let us devise plans against Jeremiah, for instruction will not perish from the priest, nor counsel from the wise man, nor word from the prophet. Come, let us strike him with the tongue, and let us not pay attention to any of his words.”
translation:
  language: fr
  text: 'Alors ils dirent : « Venez, élaborons des plans contre Jérémie, car l’enseignement ne disparaîtra pas chez le prêtre, ni le conseil chez le sage, ni la parole chez le prophète. Venez, attaquons-le par la langue[a] et ne prêtons attention à aucune de ses paroles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « frappons-le avec la langue ». Peut désigner une attaque verbale, notamment par la calomnie ou l’accusation.'
    reason: La note préserve l’image lexicale du texte hébreu et indique son sens possible dans le contexte, sans imposer une seule précision interprétative.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors ils dirent
  rationale: Le waw consécutif fait avancer le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: לְכוּ
  choice: Venez
  rationale: L’impératif sert ici d’exhortation à une action commune.
- source_word: וְנַחְשְׁבָה ... מַחֲשָׁבוֹת
  choice: élaborons des plans
  rationale: Le verbe et son nom apparenté soulignent une préparation délibérée ; cette formulation française conserve l’idée de complot sans répétition artificielle.
- source_word: עַל יִרְמְיָהוּ
  choice: contre Jérémie
  rationale: Le contexte hostile donne à la préposition un sens adversatif.
- source_word: תּוֹרָה
  choice: enseignement
  rationale: Dans cette association avec le prêtre, le terme désigne l’instruction sacerdotale plutôt que seulement une loi codifiée.
- source_word: לֹא תֹאבַד ... מִכֹּהֵן
  choice: ne manquera pas au prêtre
  rationale: Cette tournure idiomatique exprime que l’enseignement ne disparaîtra pas du ministère sacerdotal et permet de conserver le parallélisme de la phrase.
- source_word: עֵצָה מֵחָכָם
  choice: le conseil au sage
  rationale: « Conseil » garde le sens de direction avisée, tandis que le singulier masculin représentatif est conservé.
- source_word: דָבָר מִנָּבִיא
  choice: la parole au prophète
  rationale: « Parole » préserve l’ampleur du terme hébreu et sa résonance prophétique.
- source_word: וְנַכֵּהוּ בַלָּשׁוֹן
  choice: frappons-le avec la langue
  rationale: La métaphore hébraïque est maintenue, tandis qu’une note en indique les principaux sens possibles.
- source_word: וְאַל נַקְשִׁיבָה אֶל כָּל דְּבָרָיו
  choice: et ne prêtons attention à aucune de ses paroles
  rationale: La formulation rend l’exhortation négative et la portée totale de כָּל sous la négation.
theological_decisions:
- issue: Singuliers représentatifs dans כֹּהֵן, חָכָם et נָבִיא
  choice: au prêtre, au sage, au prophète
  alternative: aux prêtres, aux sages, aux prophètes
  rationale: Le texte présente trois fonctions sociales au singulier représentatif. Le maintien du singulier conserve leur parallélisme et n’ajoute aucune précision doctrinale.
- issue: Portée de la déclaration sur les trois sources de direction
  choice: ne manquera pas
  alternative: ne disparaîtra pas
  rationale: Les conspirateurs affirment que ces fonctions continueront sans Jérémie. « Ne manquera pas » rend cette affirmation sans déterminer si elle est théologiquement valide ou seulement leur justification hostile.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme ternaire et la métaphore concrète de la langue sont conservés ; la note éclaire cette dernière sans la remplacer dans le texte.
