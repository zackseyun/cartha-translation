base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/008.yaml
  text: And if that nation turns from its evil[a], against which I spoke[c][b], then I will relent concerning the disaster that I planned to do to it.
translation:
  language: fr
  text: Et si cette nation contre laquelle j’ai parlé se détourne[a] du mal[b] qu’elle commet, je renoncerai[c] au malheur que j’avais projeté de lui infliger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « revient » ou « change de conduite ». Le verbe hébreu signifie littéralement « tourner, revenir ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le même mot pour le « mal » de la nation et pour le « malheur » projeté par Dieu ; le sens passe du mal moral à la calamité.
    reason: lexical_alternative
  - marker: c
    text: Ou « je changerai d’avis » ou « je reviendrai sur ma décision ». Le verbe hébreu exprime ici le retrait d’un jugement annoncé en réponse au changement de la nation.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁב
  choice: Et si … se détourne
  rationale: Le verbe שׁוב signifie concrètement « tourner, revenir ». Le contexte conditionnel du verset précédent justifie d’expliciter « si » en français, tandis que « se détourne » conserve l’image d’un changement de direction morale.
- source_word: הַגּוֹי הַהוּא
  choice: cette nation
  rationale: גּוֹי désigne ici une nation prise collectivement. « Cette nation » rend naturellement le démonstratif hébreu dans ce contexte.
- source_word: מֵרָעָתוֹ
  choice: du mal qu’elle commet
  rationale: רָעָה désigne ici le mal moral de la nation. L’ajout idiomatique « qu’elle commet » clarifie ce sens sans confondre ce mal avec le malheur annoncé dans la suite.
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלָיו
  choice: contre laquelle j’ai parlé
  rationale: דבר על peut signifier « parler au sujet de » ou, dans un contexte de jugement, « parler contre ». Le pronom masculin singulier renvoie naturellement à גּוֹי, la nation; placer la relative après « nation » évite une construction française ambiguë.
- source_word: וְנִחַמְתִּי
  choice: je renoncerai
  rationale: Dans ce contexte, נחם exprime le retrait d’un jugement annoncé en réponse au changement de la nation. « Je renoncerai » est naturel et n’attribue pas à Dieu une faute morale, tout en maintenant le caractère réellement conditionnel de l’annonce.
- source_word: עַל הָרָעָה
  choice: au malheur
  rationale: Le même nom רָעָה prend ici le sens de calamité ou de désastre, et non de mal moral. « Malheur » convient au jugement annoncé et permet de faire entendre en français un écho lexical avec « mal ».
- source_word: אֲשֶׁר חָשַׁבְתִּי
  choice: que j’avais projeté
  rationale: חשב peut exprimer une pensée, une intention ou un projet. Le plus-que-parfait français situe naturellement ce projet avant le renoncement annoncé.
- source_word: לַעֲשׂוֹת לוֹ
  choice: de lui faire
  rationale: Cette formulation rend directement l’infinitif עשׂה avec le pronom indirect et reste idiomatique en français avec « malheur ».
theological_decisions:
- issue: Le langage de נחם appliqué à Dieu
  choice: je renoncerai
  alternative: je changerai d’avis / je reviendrai sur ma décision
  rationale: Le texte présente le jugement annoncé par Dieu comme répondant au retournement humain. « Je renoncerai » préserve cette tension et l’idée d’un retrait effectif sans suggérer une repentance morale de Dieu.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit l’ordre logique naturel du français en rattachant explicitement la proposition relative à « cette nation ». Le couple « mal / malheur » conserve autant que possible le jeu lexical hébreu sans attribuer à Dieu un mal moral.
