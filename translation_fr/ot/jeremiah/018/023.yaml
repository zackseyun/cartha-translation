  to: Mais toi, Yahvé, tu connais tous leurs projets contre moi pour me tuer[a]. Ne couvre pas leur faute[b] et n’efface pas leur péché de devant toi. Qu’ils trébuchent devant toi[c] ! Au temps de ta colère, agis contre eux.
  rationale: La révision améliore la fluidité du français sans modifier le sens ni atténuer le caractère imprécatoire. « Pour me tuer » rend de manière idiomatique le dessein de mort. La demande « Qu’ils trébuchent » est naturelle dans le texte principal ; la note conserve explicitement l’ambiguïté sémantique et la nuance passive-causative du hophal, qui ne doit pas être imposée par une périphrase française maladroite.
