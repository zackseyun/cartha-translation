source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֠הוָה יָדַ֜עְתָּ אֶֽת כָּל עֲצָתָ֤/ם עָלַ/י֙ לַ/מָּ֔וֶת אַל תְּכַפֵּר֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תֶּ֑מְחִי ו/היו מֻכְשָׁלִים֙ לְ/פָנֶ֔י/ךָ בְּ/עֵ֥ת אַפְּ/ךָ֖ עֲשֵׂ֥ה בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/023.yaml
  text: But you[a], O Yahweh, know all their counsel against me for death. Do not cover over their iniquity, and do not blot out their sin from before you. Let them be made to stumble before you; in the time of your anger[c][b], act against them.
translation:
  language: fr
  text: Mais toi, Yahvé, tu connais tous leurs projets contre moi pour me tuer[a]. Ne couvre pas leur faute[b] et n’efface pas leur péché de devant toi. Qu’ils trébuchent devant toi[c] ! Au temps de ta colère, agis contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « contre moi pour la mort » ; autre traduction : « en vue de ma mort ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « Ne pardonne pas leur faute » ou « N’expie pas leur culpabilité ». Le verbe hébreu peut évoquer l’action de couvrir, d’expier ou de pardonner une faute.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu peut aussi évoquer une nuance passive-causative : « Qu’ils soient fait trébucher devant toi ». Autre traduction : « Qu’ils soient renversés devant toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, qui le distingue d’un titre tel que « le Seigneur ».
- source_word: עֲצָתָם
  choice: leurs projets
  rationale: עֵצָה peut désigner un conseil, un dessein ou un projet. Dans ce contexte hostile, « projets » est naturel et laisse la finalité meurtrière être précisée par la suite de la phrase.
- source_word: עָלַי לַמָּוֶת
  choice: contre moi pour me faire mourir
  rationale: Cette formulation française explicite naturellement la visée de mort du tour hébreu très condensé, littéralement « contre moi pour la mort », sans préciser le moyen envisagé.
- source_word: תְּכַפֵּר עַל עֲוֺנָם
  choice: ne couvre pas leur faute
  rationale: Le piel de כפר peut exprimer l’expiation, le recouvrement ou l’effacement d’une culpabilité. « Couvre » conserve ici la métaphore concrète et la dureté de la requête, tandis qu’une note signale le sens possible « pardonner ».
- source_word: עֲוֺנָם
  choice: leur faute
  rationale: עָוֺן peut désigner la faute aussi bien que la culpabilité qui en découle. « Faute » est clair en français actuel et demeure distinct du « péché » du membre parallèle.
- source_word: חַטָּאתָם
  choice: leur péché
  rationale: Équivalent français direct de חַטָּאת dans ce contexte moral et religieux.
- source_word: תֶּמְחִי מִלְּפָנֶיךָ
  choice: n’efface pas … de devant toi
  rationale: « Effacer » conserve l’image de מחה, et « de devant toi » maintient l’idiome spatial hébreu ainsi que sa possible portée judiciaire.
- source_word: וְהָיוּ מֻכְשָׁלִים לְפָנֶיךָ
  choice: Qu’ils soient amenés à trébucher devant toi
  rationale: La formulation rend la valeur souhaitée de la proposition et conserve la nuance passive-causative du hophal de כשל, malgré une tournure française volontairement marquée.
- source_word: בְּעֵת אַפְּךָ
  choice: Au temps de ta colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère. Cette formulation garde le complément temporel sans archaïsme inutile.
- source_word: עֲשֵׂה בָהֶם
  choice: agis contre eux
  rationale: L’hébreu dit sobrement « fais/agis en eux ou contre eux ». Le contexte imprécatoire justifie « contre eux », sans spécifier la forme du jugement demandé.
theological_decisions:
- issue: Conserver la force des demandes imprécatoires
  choice: Le texte demeure une demande directe pour que Dieu ne couvre ni n’efface la faute des adversaires et qu’il agisse contre eux dans sa colère.
  alternative: Atténuer les impératifs en les transformant en simples constats, ou traduire כפר directement par « pardonner ».
  rationale: Les formes hébraïques ont une force impérative ou volitive nette. La traduction préserve donc la sévérité et la tension théologique de la prière sans les expliquer ni les adoucir.
- issue: Agent de la chute des adversaires
  choice: 'Employer une tournure passive-causative sans nommer explicitement l’agent : « qu’ils soient amenés à trébucher ».'
  alternative: « Qu’ils trébuchent » ou « qu’ils soient renversés ».
  rationale: Le hophal suggère qu’ils sont conduits à la chute, mais le texte ne formule pas séparément l’identité de l’agent. La traduction conserve cette retenue.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme « faute / péché » et les images hébraïques de couverture, d’effacement et de chute sont conservés autant que le permet un français naturel.
