    rationale: Cette formulation est possible, mais elle dépasse l’alternative immédiate de la comparaison. Une note opposant « comme ce potier » à « comme le fait ce potier » rend plus exactement la concision syntaxique hébraïque.
  revised_text: '« Ne puis-je pas agir envers vous[a], maison d’Israël, comme ce potier ? déclare Yahweh. Voici : comme l’argile dans la main du potier, ainsi êtes-vous dans ma main, maison d’Israël. »'
