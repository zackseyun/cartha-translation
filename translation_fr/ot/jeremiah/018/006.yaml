  text: הֲ/כַ/יּוֹצֵ֨ר הַ/זֶּ֜ה לֹא אוּכַ֨ל לַ/עֲשׂ֥וֹת לָ/כֶ֛ם בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הִנֵּ֤ה כַ/חֹ֨מֶר֙ בְּ/יַ֣ד הַ/יּוֹצֵ֔ר כֵּן אַתֶּ֥ם בְּ/יָדִ֖/י בֵּ֥ית יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/006.yaml
  text: Can I not do with you[a], house of Israel, as this potter does? declares Yahweh. Look, like clay in the hand of the potter, so are you in my hand, house of Israel.
translation:
  language: fr
  text: '« Ne puis-je pas agir envers vous[a], maison d’Israël, comme ce potier ? déclare Yahweh. Voici : comme l’argile dans la main du potier, ainsi êtes-vous dans ma main, maison d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme le fait ce potier ». La comparaison hébraïque est concise et peut être rendue de façon légèrement différente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכַיּוֹצֵר הַזֶּה לֹא אוּכַל לַעֲשׂוֹת לָכֶם
  choice: Ne puis-je pas agir envers vous, comme ce potier ?
  rationale: La question rhétorique exprime le pouvoir de Yahweh. « Agir envers vous » rend naturellement עשה avec ל sans préciser indûment si l’action est favorable ou punitive; « comme ce potier » conserve la comparaison concise de l’hébreu.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Cette désignation collective et conventionnelle préserve l’adresse solennelle du registre prophétique.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: נְאֻם est la formule prophétique solennelle « déclare », et le nom divin יהוה est translittéré « Yahweh ».
- source_word: הִנֵּה
  choice: Regardez
  rationale: L’impératif pluriel français correspond aux destinataires collectifs et rend la fonction emphatique et déictique de הִנֵּה dans une langue actuelle.
- source_word: כַחֹמֶר בְּיַד הַיּוֹצֵר
  choice: comme l’argile dans la main du potier
  rationale: Cette formulation conserve directement l’image matérielle et la comparaison; l’article défini devant « argile » est idiomatique en français pour la matière représentée dans la scène.
- source_word: כֵּן אַתֶּם בְּיָדִי
  choice: ainsi êtes-vous dans ma main
  rationale: « Ainsi » marque nettement la correspondance entre l’argile et Israël tout en préservant la métaphore de la main.
theological_decisions:
- issue: La souveraineté divine dans l’image du potier et de l’argile
  choice: Conserver sans l’expliciter l’autorité de Yahweh sur Israël exprimée par la métaphore.
  alternative: Interpréter l’image comme une affirmation de prédestination absolue, ou l’atténuer en simple image de soin artisanal.
  rationale: Le verset affirme le pouvoir de Yahweh d’agir envers Israël, mais ne développe pas à lui seul un système doctrinal; la traduction maintient donc la force et la tension de l’image.
- issue: Portée de לַעֲשׂוֹת לָכֶם
  choice: « agir envers vous »
  alternative: « vous traiter » ou « faire de vous »
  rationale: Le syntagme peut couvrir diverses actions de Yahweh envers Israël. La formulation retenue évite de décider ici si l’action est exclusivement punitive, bénéfique ou transformatrice.
translation_notes:
  register: Français international moderne, digne et prophétique. La question rhétorique reste directe; « Regardez » évite l’archaïsme de « Voici » tout en attirant explicitement l’attention. Le double vocatif « maison d’Israël » et la métaphore de la main sont conservés.
