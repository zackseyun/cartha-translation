  to: '« Ne puis-je pas agir envers vous[a], maison d’Israël, comme ce potier ? déclare Yahweh. Voici : comme l’argile dans la main du potier, ainsi êtes-vous dans ma main, maison d’Israël. »'
  rationale: La révision remplace « Regardez » par « Voici » afin de reproduire la valeur déictique de הִנֵּה sans ajouter un impératif pluriel. Elle resserre aussi la note pour qu’elle signale l’alternative syntaxique réelle sans expliciter davantage l’action divine. Le reste du texte est conservé.
