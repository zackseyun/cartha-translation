  text: וְ/עַתָּ֡ה אֱמָר נָ֣א אֶל אִישׁ יְהוּדָה֩ וְ/עַל יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤ר עֲלֵי/כֶם֙ רָעָ֔ה וְ/חֹשֵׁ֥ב עֲלֵי/כֶ֖ם מַֽחֲשָׁבָ֑ה שׁ֣וּבוּ נָ֗א אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וְ/הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַעַלְלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/011.yaml
  text: 'Now therefore[a], say to the men of Judah and to the inhabitants of Jerusalem, saying, ‘Thus says Yahweh: Behold, I am shaping disaster against you and devising a plan against you. Turn back, please, each man from his evil way[c][b], and make your ways and your deeds good.’'
translation:
  language: fr
  text: '« Maintenant donc, dis, je te prie, aux hommes de Juda et aux habitants de Jérusalem : “Ainsi parle Yahweh : Voici, je façonne[a] contre vous un malheur et je conçois contre vous un projet. Revenez, je vous en prie, chacun de sa mauvaise voie[b], et améliorez vos voies et vos actes.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe traduit par « façonner » reprend l’image du potier dans les versets précédents. On pourrait aussi traduire : « former contre vous une calamité ».'
    reason: Écho lexical et autre traduction possible.
  - marker: b
    text: 'Littéralement : « revenez, chacun de sa mauvaise voie ». Le singulier a une valeur distributive : l’appel s’adresse à chaque membre de la communauté.'
    reason: Précision grammaticale et portée collective.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve la transition temporelle et logique avec l’image du potier qui précède, sans alourdir la phrase.
- source_word: אֱמָר נָא
  choice: adresse donc ces paroles
  rationale: L’impératif est rendu naturellement en français, tandis que « donc » fait entendre la nuance d’insistance de נָא.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: aux gens de Juda
  rationale: אִישׁ a ici une valeur collective. « Les gens de Juda » exprime cette portée sans faire croire que seuls les hommes adultes sont visés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme un nom propre plutôt que remplacé par un titre.
- source_word: יוֹצֵר
  choice: façonner
  rationale: Le choix reprend délibérément le vocabulaire du potier dans le contexte immédiat.
- source_word: רָעָה
  choice: malheur
  rationale: Dans cette annonce de jugement, le mot désigne une calamité infligée, non le mal moral.
- source_word: וְחֹשֵׁב ... מַחֲשָׁבָה
  choice: concevoir un projet
  rationale: Cette formulation française naturelle maintient le lien entre la réflexion divine et le projet arrêté, sans reproduire lourdement la construction apparentée de l’hébreu.
- source_word: שׁוּבוּ נָא
  choice: Revenez donc
  rationale: « Revenir » préserve l’image concrète du changement de direction; « donc » rend l’exhortation insistante portée par נָא.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: chacun de sa mauvaise voie
  rationale: 'Le singulier distributif est conservé : l’appel collectif vise chaque membre du peuple individuellement.'
- source_word: וְהֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: changez en bien vos voies et vos actes
  rationale: La formulation conserve l’idée causative de rendre bon et maintient la distinction entre les voies suivies et les actes accomplis.
theological_decisions:
- issue: Sens de רָעָה lorsque Yahweh annonce son action
  choice: malheur
  alternative: mal, désastre, calamité
  rationale: Le contexte parle du jugement que Dieu prépare, et non d’un mal moral qu’il commettrait. « Malheur » garde toutefois la gravité et l’étendue du terme.
- issue: Portée de אִישׁ dans l’adresse à Juda
  choice: les gens de Juda
  alternative: les hommes de Juda; chaque homme de Juda
  rationale: Le premier אִישׁ est collectif dans cette construction. Le rendre par « gens » communique l’adresse au peuple, tandis que le second est rendu par « chacun » pour préserver sa force distributive.
- issue: Nature de l’appel exprimé par שׁוב
  choice: Revenez
  alternative: Repentez-vous; détournez-vous
  rationale: « Revenez » maintient la métaphore hébraïque du retour et ne réduit pas d’avance l’appel à un terme théologique spécialisé.
translation_notes:
  register: Français international actuel, digne et accessible. La formule prophétique reste solennelle, tandis que « gens de Juda » évite une restriction masculine absente de la portée collective du passage. Les images de la voie, du retour et du façonnage sont maintenues.
