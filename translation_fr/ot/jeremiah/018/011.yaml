revisions:
- from: '« Et maintenant, adresse donc ces paroles aux gens de Juda et aux habitants de Jérusalem : “Voici ce que dit Yahweh : Je suis en train de façonner contre vous un malheur[a] et de concevoir un projet contre vous. Revenez donc, chacun de sa mauvaise voie[b], et changez en bien vos voies et vos actes.” »'
  to: '« Maintenant donc, dis, je te prie, aux hommes de Juda et aux habitants de Jérusalem : “Ainsi parle Yahweh : Voici, je façonne[a] contre vous un malheur et je conçois contre vous un projet. Revenez, je vous en prie, chacun de sa mauvaise voie[b], et améliorez vos voies et vos actes.” »'
  rationale: La révision conserve le sens et la structure du texte hébreu, tout en rendant explicitement les deux requêtes marquées par נָא. Elle emploie la formule prophétique française « Ainsi parle Yahweh », rétablit « hommes de Juda » pour la formulation collective source, et corrige l’emplacement de l’ancre de note. Aucune ambiguïté textuelle disputée n’est tranchée de manière interprétative.
