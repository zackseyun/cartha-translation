  text: תִּשָּׁמַ֤ע זְעָקָה֙ מִ/בָּ֣תֵּי/הֶ֔ם כִּֽי תָבִ֧יא עֲלֵי/הֶ֛ם גְּד֖וּד פִּתְאֹ֑ם כִּֽי כָר֤וּ שיחה לְ/לָכְדֵ֔/נִי וּ/פַחִ֖ים טָמְנ֥וּ לְ/רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/022.yaml
  text: Let a cry be heard from their houses when you suddenly bring a raiding band upon them[b][a], for they have dug a pit to capture me and hidden traps for my feet.
translation:
  language: fr
  text: Qu’un cri de détresse se fasse entendre depuis leurs maisons quand tu feras soudain venir contre eux une bande de pillards[a] ! Car ils ont creusé une fosse pour me prendre et caché des pièges[b] pour mes pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une troupe » ou « une bande de maraudeurs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des lacets pour mes pieds ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשָּׁמַע
  choice: Qu’un ... se fasse entendre
  rationale: Le nifal imparfait de שׁמע est passif. Dans cette prière imprécatoire, la tournure française avec « que » rend naturellement la valeur jussive.
- source_word: זְעָקָה
  choice: un cri de détresse
  rationale: Le nom désigne un cri poussé dans la détresse; cette expression française en communique clairement la charge émotionnelle sans la préciser à l’excès.
- source_word: מִבָּתֵּיהֶם
  choice: depuis leurs maisons
  rationale: La préposition indique la provenance du cri. « Maisons » conserve l’image concrète du texte.
- source_word: כִּי
  choice: quand
  rationale: Le premier כִּי introduit ici la circonstance temporelle dans laquelle le cri se fera entendre.
- source_word: תָבִיא עֲלֵיהֶם
  choice: tu feras ... venir contre eux
  rationale: Le hifil de בוא exprime l’action de faire venir; la formulation garde aussi le sens hostile de עֲלֵיהֶם.
- source_word: גְּדוּד
  choice: une bande de pillards
  rationale: Le terme peut désigner une troupe, particulièrement un groupe menant une incursion ou un pillage. Cette traduction est naturelle et restitue ce caractère hostile.
- source_word: פִּתְאֹם
  choice: soudain
  rationale: L’adverbe exprime la soudaineté ou le caractère inattendu de l’attaque.
- source_word: כִּי
  choice: Car
  rationale: 'Le second כִּי donne le motif de la demande: le complot déjà tramé contre Jérémie.'
- source_word: כָרוּ שיחה
  choice: ils ont creusé une fosse
  rationale: Le parfait décrit une action accomplie qui motive la demande présente. « Fosse » conserve l’image du piège creusé.
- source_word: לְלָכְדֵנִי
  choice: pour me prendre
  rationale: L’infinitif exprime le but. « Prendre » convient à la fois à l’image du piège et au projet hostile.
- source_word: וּפַחִים טָמְנוּ לְרַגְלָי
  choice: et caché des pièges sous mes pas
  rationale: פַּחִים désigne des pièges ou des lacets, tandis que טמן signifie cacher ou dissimuler. « Sous mes pas » rend naturellement l’image de pièges placés sur le chemin du locuteur.
theological_decisions:
- issue: Force imprécatoire de la prière de Jérémie
  choice: Conserver la demande directe de jugement au moyen de « Qu’un ... se fasse entendre »
  alternative: Présenter la phrase comme une simple prédiction future
  rationale: Dans le contexte, l’imparfait hébreu a une valeur jussive. Une simple prédiction atténuerait la force rhétorique et théologique de la prière.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve l’image concrète des maisons, de la fosse et des pièges, ainsi que la force non atténuée de la prière imprécatoire.
