  text: ק֥וּם וְ/יָרַדְתָּ֖ בֵּ֣ית הַ/יּוֹצֵ֑ר וְ/שָׁ֖מָּ/ה אַשְׁמִֽיעֲ/ךָ֥ אֶת דְּבָרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/002.yaml
  text: Arise and go down to the potter’s house[a], and there I will let you hear my words.
translation:
  language: fr
  text: « Lève-toi et descends à la maison du potier ; là, je te ferai entendre mes paroles. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וּם
  choice: Lève-toi
  rationale: L’impératif de קום appelle Jérémie à se mettre debout et à agir. « Lève-toi » est naturel en français tout en conservant le ton solennel de l’ordre prophétique.
- source_word: וְ/יָרַדְתָּ֖
  choice: et descends
  rationale: Le verbe ירד exprime un déplacement vers le bas, probablement en rapport avec la topographie de Jérusalem. « Descends » maintient cette indication directionnelle sans lourdeur.
- source_word: בֵּ֣ית הַ/יּוֹצֵ֑ר
  choice: à la maison du potier
  rationale: Le groupe construit signifie littéralement « maison du potier ». Cette formulation est claire et idiomatique en français.
- source_word: הַ/יּוֹצֵר
  choice: potier
  rationale: Le participe de יצר désigne celui qui façonne. Le contexte immédiat du travail de l’argile précise qu’il s’agit ici d’un potier.
- source_word: וְ/שָׁ֖מָּ/ה
  choice: là
  rationale: L’adverbe local souligne que la révélation aura lieu à cet endroit. Après le point-virgule, « là » restitue naturellement cette mise en relief.
- source_word: אַשְׁמִֽיעֲ/ךָ֥
  choice: je te ferai entendre
  rationale: 'La forme hiphil de שמע est causative : « faire entendre ». La traduction conserve explicitement cette nuance et reste naturelle dans un registre biblique digne.'
- source_word: אֶת דְּבָרָֽ/י
  choice: mes paroles
  rationale: Le pluriel hébreu est maintenu. « Mes paroles » convient mieux au registre que « mes mots » et évite de réduire l’expression au singulier interprétatif « mon message ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse divine singulière. La formulation conserve l’impératif, le mouvement descendant, l’accent local de « là » et la valeur causative du hiphil.
