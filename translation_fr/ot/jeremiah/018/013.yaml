  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַֽׁאֲלוּ נָא֙ בַּ/גּוֹיִ֔ם מִ֥י שָׁמַ֖ע כָּ/אֵ֑לֶּה שַֽׁעֲרֻרִת֙ עָשְׂתָ֣ה מְאֹ֔ד בְּתוּלַ֖ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/013.yaml
  text: 'Therefore thus says Yahweh: Ask now among the nations[b][a], who has heard such things? Virgin Israel has done a very horrible thing.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh : « Interrogez donc les nations : qui a jamais entendu parler de choses pareilles ? La vierge d’Israël a commis un acte extrêmement révoltant[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a commis une chose effroyable » ou « un acte monstrueux ». Le terme hébreu évoque quelque chose d’horrifiant, de scandaleux ou de révoltant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée du contexte précédent.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Formule prophétique rendue dans un français actuel et digne, avec conservation du nom divin.
- source_word: שַׁאֲלוּ נָא בַּגּוֹיִם
  choice: Interrogez donc les nations
  rationale: L’impératif pluriel appelle à consulter les nations; « donc » restitue ici la nuance pressante de נָא sans suggérer une demande polie.
- source_word: מִי שָׁמַע כָּאֵלֶּה
  choice: qui a jamais entendu parler de choses pareilles ?
  rationale: La tournure idiomatique conserve la force comparative et rhétorique de l’hébreu.
- source_word: שַׁעֲרֻרִת עָשְׂתָה מְאֹד
  choice: a commis une abomination effroyable
  rationale: « Abomination effroyable » exprime l’acte scandaleux et horrifiant, tandis que l’adjectif restitue l’intensification de מְאֹד.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: la vierge d’Israël
  rationale: Préserve la personnification prophétique sans ajouter « fille », absent du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel de Dieu plutôt que de le remplacer par un titre.
- issue: Portée de בְּתוּלַת יִשְׂרָאֵל
  choice: la vierge d’Israël
  alternative: Israël, la vierge
  rationale: Le choix conserve la métaphore nationale et son caractère ouvert, sans lui imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formule prophétique reste solennelle; la question rhétorique est rendue idiomatiquement. Le marqueur [a] figure dans le texte principal.
