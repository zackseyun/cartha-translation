  text: וָ/אֵרֵ֖ד בֵּ֣ית הַ/יּוֹצֵ֑ר ו/הנ/הו עֹשֶׂ֥ה מְלָאכָ֖ה עַל הָ/אָבְנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/003.yaml
  text: So I went down to the potter’s house[a], and there he was[b], doing work on the wheel.
translation:
  language: fr
  text: Je descendis donc à la maison du potier, et voici qu’il travaillait au tour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est au duel, littéralement « sur les deux pierres »; il désigne probablement le dispositif du tour du potier.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֵרֵד
  choice: Je descendis donc
  rationale: Le wayyiqtol de ירד poursuit la séquence narrative et conserve l’idée de descendre. « Donc » exprime naturellement le lien avec l’ordre reçu au verset précédent.
- source_word: בֵּית הַיּוֹצֵר
  choice: à la maison du potier
  rationale: Le groupe construit signifie littéralement « maison du potier ». Cette formulation reste claire et permet d’entendre aussi bien son habitation que son lieu de travail.
- source_word: וְהִנֵּהוּ
  choice: et voici qu’il
  rationale: הִנֵּה attire vivement l’attention sur ce que Jérémie découvre. « Voici que » en garde la force présentative sans ajouter d’interprétation.
- source_word: עֹשֶׂה מְלָאכָה
  choice: travaillait
  rationale: L’expression désigne l’activité artisanale en cours. Le verbe français rend naturellement le participe et son complément sans préciser indûment l’objet fabriqué.
- source_word: עַל הָאָבְנָיִם
  choice: au tour[a]
  rationale: Le duel hébreu désigne l’appareil du potier, vraisemblablement composé de deux disques. En français courant, « au tour » nomme clairement cet outil, tandis que la note conserve la particularité de la forme hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Voici qu’il » conserve la vivacité de la scène; « au tour » privilégie l’expression artisanale française naturelle, avec la forme duelle explicitée en note.
