id: JER.18.12
reference: Jeremiah 18:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמְר֖וּ נוֹאָ֑שׁ כִּֽי אַחֲרֵ֤י מַחְשְׁבוֹתֵ֨י/נוּ֙ נֵלֵ֔ךְ וְ/אִ֛ישׁ שְׁרִר֥וּת לִבּֽ/וֹ הָ/רָ֖ע נַעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/012.yaml
  text: But they will say[a], ‘It is hopeless, for we will follow our own plans, and each of us will act according to the stubbornness of his evil heart.’
translation:
  language: fr
  text: 'Mais ils diront[a] : « C’est sans espoir ! Nous suivrons nos propres projets, et chacun de nous agira selon l’obstination de son cœur mauvais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est inutile ! » ou « Il n’y a aucun espoir ! » L’expression hébraïque peut traduire le désespoir ou présenter l’appel du prophète comme vain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹאָשׁ
  choice: C’est sans espoir !
  rationale: L’expression peut marquer le désespoir ou présenter l’appel du prophète comme vain. « C’est sans espoir ! » est naturel en français moderne et conserve cette ambiguïté, explicitée en note.
- source_word: אַחֲרֵי מַחְשְׁבוֹתֵינוּ נֵלֵךְ
  choice: Nous suivrons nos propres projets
  rationale: L’expression « aller après » signifie ici suivre ou poursuivre, et מַחְשְׁבוֹת désigne des pensées, des projets ou des desseins. « Projets » exprime naturellement leur volonté de se diriger eux-mêmes.
- source_word: וְאִישׁ
  choice: et chacun de nous
  rationale: Le singulier distributif hébreu désigne chaque membre du groupe. « Chacun de nous » en restitue clairement la portée collective.
- source_word: שְׁרִרוּת
  choice: obstination
  rationale: Le terme désigne l’entêtement et la volonté rebelle. « Obstination » garde sa forte portée morale tout en étant idiomatique.
- source_word: לִבּוֹ הָרָע
  choice: son cœur mauvais
  rationale: Dans ce contexte, לֵב représente le centre intérieur de la pensée et de la volonté. « Cœur mauvais » conserve l’image hébraïque et l’évaluation morale explicite.
- source_word: נַעֲשֶׂה
  choice: agira
  rationale: Le verbe עשה est général, mais « agir » rend naturellement ici la conduite déterminée par le cœur.
theological_decisions:
- issue: Réponse exprimant le désespoir ou le rejet méprisant de l’appel prophétique
  choice: C’est sans espoir !
  alternative: C’est inutile ! / Il n’y a aucun espoir !
  rationale: L’hébreu peut exprimer soit l’absence d’espoir, soit l’idée que l’appel à changer est vain. Le texte principal préserve la tonalité de refus sans trancher entièrement, tandis que la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur exprime la résolution déclarée du peuple. L’image biblique du cœur est conservée, et le singulier distributif est rendu inclusivement par « chacun de nous ».
