  text: כְּ/רֽוּחַ קָדִ֥ים אֲפִיצֵ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב עֹ֧רֶף וְ/לֹֽא פָנִ֛ים אֶרְאֵ֖/ם בְּ/י֥וֹם אֵידָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/017.yaml
  text: Like an east wind I will scatter them before the enemy[a]; I will show them the back and not the face in the day of their disaster.
translation:
  language: fr
  text: Comme un vent d’est, je les disperserai devant l’ennemi ; je leur montrerai mon dos, et non mon visage, au jour de leur désastre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Je ne verrai d’eux que le dos, et non le visage, au jour de leur désastre. » L’hébreu peut être analysé de cette manière ; l’image exprime dans les deux cas le retrait de la faveur du Seigneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּחַ קָדִים
  choice: Comme un vent d’est
  rationale: Le préfixe כְּ marque la comparaison, רוּחַ désigne le vent et קָדִים le vent d’est, souvent destructeur. La formulation conserve l’image sans ajouter explicitement « brûlant ».
- source_word: אֲפִיצֵם
  choice: je les disperserai
  rationale: Le hifil de פוץ exprime l’action de disperser ou d’éparpiller. « Disperser » est direct, naturel et adapté au contexte de jugement.
- source_word: לִפְנֵי אוֹיֵב
  choice: devant l’ennemi
  rationale: La locution signifie littéralement « devant l’ennemi » et évoque ici leur dispersion face à l’adversaire.
- source_word: עֹרֶף וְלֹא פָנִים
  choice: mon dos, et non mon visage
  rationale: עֹרֶף désigne littéralement la nuque ou le revers du corps, en contraste avec פָנִים, le visage. Le possessif, implicite dans la construction française avec « montrer », rend l’image intelligible sans en effacer le caractère concret.
- source_word: אֶרְאֵם
  choice: je leur montrerai
  rationale: Dans cette construction, ראה peut exprimer le fait de faire voir ou de montrer. Cette lecture s’accorde avec le complément prédicatif « dos… visage ».
- source_word: בְּיוֹם אֵידָם
  choice: au jour de leur désastre
  rationale: אֵיד désigne le désastre, la calamité ou la ruine. « Au jour de leur désastre » conserve la forme temporelle et le registre prophétique.
theological_decisions:
- issue: Langage anthropomorphique exprimant le rejet divin
  choice: 'Conserver l’image corporelle : « je leur montrerai mon dos, et non mon visage »'
  alternative: Paraphraser par « je me détournerai d’eux » ou « je leur retirerai ma faveur »
  rationale: L’hébreu exprime concrètement le retrait de la présence favorable de Dieu. Garder la métaphore préserve sa force et évite de réduire l’image à une seule explication abstraite.
- issue: Ambiguïté syntaxique de אֶרְאֵם
  choice: 'Comprendre : « je leur montrerai »'
  alternative: 'Comprendre : « je les regarderai [du] dos et non [de] face »'
  rationale: La lecture causative « montrer » produit en français une phrase cohérente avec les termes « dos » et « visage », tout en signalant en note l’autre analyse possible de la forme verbale.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation souligne les deux actes de jugement. L’image anthropomorphique est maintenue dans le texte principal, et l’ambiguïté du verbe hébreu est conservée en note.
