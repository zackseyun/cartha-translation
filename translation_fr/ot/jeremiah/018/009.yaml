  text: And at another moment I may speak concerning a nation and concerning a kingdom[a], to build and to plant.
translation:
  language: fr
  text: Et à un autre moment, je parle au sujet d’une nation et au sujet d’un royaume[a], pour bâtir et planter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et à un moment, je parle au sujet d’une nation et au sujet d’un royaume, pour bâtir et planter. » L’hébreu emploie le mot « moment » pour encadrer les déclarations de Dieu aux versets 7 à 10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרֶגַע
  choice: Et à un autre moment
  rationale: רֶגַע désigne un moment ou un instant. Dans le parallélisme contrasté avec le v. 7, « à un autre moment » rend naturellement la succession des deux cas tout en conservant l’image temporelle hébraïque.
- source_word: אֲדַבֵּר
  choice: je peux parler
  rationale: L’imparfait s’inscrit ici dans l’énoncé d’un cas éventuel au sein de la structure conditionnelle des v. 7–10. « Je peux parler » préserve cette valeur sans remplacer le verbe simple « parler » par une paraphrase.
- source_word: עַל
  choice: au sujet de
  rationale: Avec דבר, la préposition indique ce dont Dieu parle. « Au sujet de » est précis et naturel; « contre » introduirait à tort une nuance hostile dans ce verset positif.
- source_word: גּוֹי
  choice: nation
  rationale: Le terme désigne ici une collectivité nationale et politique, en parallèle avec « royaume ».
- source_word: מַמְלָכָה
  choice: royaume
  rationale: « Royaume » est l’équivalent courant et exact dans ce contexte politique.
- source_word: לִבְנוֹת
  choice: pour bâtir
  rationale: Le verbe בנה signifie littéralement « bâtir ». Cette traduction conserve l’image, sans l’expliciter par « établir » ou « relever ».
- source_word: וְלִנְטֹעַ
  choice: et pour planter
  rationale: Le verbe נטע signifie « planter ». L’absence de complément explicite dans l’hébreu est respectée et la métaphore agricole est conservée.
theological_decisions:
- issue: Caractère conditionnel de la parole prophétique divine
  choice: « je peux parler » dans un scénario éventuel
  alternative: « je parle » ou « je parlerai »
  rationale: Les v. 7–10 exposent des cas de figure où les annonces divines sont liées à la réaction d’une nation. Cette formulation maintient la contingence présentée par le texte sans suggérer une incertitude de Dieu ni effacer la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « nation… royaume » et les métaphores « bâtir… planter » sont maintenus. La répétition de « au sujet de » reflète celle de עַל; l’article est élidé devant « une » selon l’usage français.
