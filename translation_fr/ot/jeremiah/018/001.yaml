source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/001.yaml
  text: The word that came to Yirmeyahu from Yahweh[a], saying,
translation:
  language: fr
  text: 'La parole qui parvint à Jérémie de la part de Yahweh, en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message divin. « La parole » conserve le lien formel avec la révélation proclamée.
- source_word: הָיָה אֶל
  choice: fut adressée à
  rationale: Littéralement « fut/vint à ». La tournure française « fut adressée à » exprime naturellement la réception d’une parole prophétique sans en modifier la source.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: « Jérémie » est la forme française traditionnelle, actuelle et immédiatement reconnaissable du nom hébreu Yirmeyahou.
- source_word: מֵאֵת
  choice: de la part de
  rationale: Ici, מֵאֵת marque l’origine personnelle de la parole. « De la part de » est idiomatique et plus précis que le simple « de ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles qui suivent. En français, les deux-points remplissent naturellement cette fonction et évitent la tournure lourde « en ces termes ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le Tétragramme. Le conserver sous la forme « Yahweh » distingue le nom propre du titre אֲדֹנָי, « Seigneur ».
translation_notes:
  register: Français moderne, digne et accessible. La formulation garde la solennité de la formule prophétique tout en employant une syntaxe naturelle. Les deux-points annoncent directement le discours du verset suivant.
