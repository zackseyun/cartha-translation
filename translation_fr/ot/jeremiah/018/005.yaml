  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors … fut adressée
  rationale: La forme narrative fait progresser le récit. En français actuel, « Alors » exprime naturellement cette succession, tandis que « fut adressée » rend idiomatiquement l’ensemble de la formule plutôt qu’un littéral lourd comme « il arriva que ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message communiqué par Dieu. « La parole » conserve l’expression biblique établie tout en restant claire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le rend comme un nom propre plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément de « fut adressée » exprime naturellement en français la direction indiquée par la préposition אֶל et le suffixe de première personne.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit les paroles divines qui suivent. « En ces termes : » assure une transition française naturelle vers le discours du verset suivant.'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre par « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’expression prophétique traditionnelle « la parole de Yahweh » tout en évitant le calque archaïque « il arriva que ».
