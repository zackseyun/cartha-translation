  text: כִּֽי שְׁכֵחֻ֥/נִי עַמִּ֖/י לַ/שָּׁ֣וְא יְקַטֵּ֑רוּ וַ/יַּכְשִׁל֤וּ/ם בְּ/דַרְכֵי/הֶם֙ שְׁבִילֵ֣י עוֹלָ֔ם לָ/לֶ֣כֶת נְתִיב֔וֹת דֶּ֖רֶךְ לֹ֥א סְלוּלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/015.yaml
  text: For my people have forgotten me[a]; they burn incense to emptiness. They have stumbled in their ways, in the ancient paths, to walk on side roads[d][c][b], on a road not built up.
translation:
  language: fr
  text: Car mon peuple m’a oublié ; ils brûlent de l’encens pour le néant[a]. Ils les ont fait trébucher sur leurs chemins, les sentiers anciens[b][c], pour les faire marcher sur des chemins de traverse[d], sur une route non aménagée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la vanité », « pour ce qui est faux » ou « pour des idoles ». L’hébreu dit littéralement « pour le néant / la fausseté », expression souvent employée à propos d’un culte sans valeur.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une forme causative active : « ils les ont fait trébucher ». L’identité de « ils » et de « les » n’est pas précisée dans cette phrase.'
    reason: alternative_reading
  - marker: c
    text: L’expression « les sentiers anciens » reprend l’image, fréquente chez Jérémie, de la voie établie depuis longtemps par Dieu pour son peuple ; voir Jérémie 6.16.
    reason: cross_reference
  - marker: d
    text: Ou « des sentiers secondaires » ou « des pistes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכֵחֻנִי
  choice: m’a oublié
  rationale: Le qal avec suffixe de première personne signifie directement « m’a oublié ». Cette formulation conserve aussi la portée relationnelle et covenantale du verbe sans la paraphraser.
- source_word: לַשָּׁוְא
  choice: pour ce qui n’est que néant
  rationale: שָׁוְא peut désigner le néant, la vanité ou la fausseté. Dans le contexte cultuel, l’expression vise vraisemblablement de faux objets de culte, mais cette traduction préserve la formulation générale de l’hébreu sans ajouter explicitement « idoles ».
- source_word: יְקַטֵּרוּ
  choice: il brûle de l’encens
  rationale: Le piel de קטר désigne couramment l’action de brûler de l’encens ou de faire fumer une offrande. Le singulier français reprend naturellement le collectif « mon peuple ».
- source_word: וַיַּכְשִׁלוּם
  choice: On l’a fait trébucher
  rationale: La forme hébraïque est causative et porte un suffixe objet pluriel, mais son sujet n’est pas clairement exprimé. La tournure française avec « on » conserve la causalité et l’agent indéterminé ; le pronom collectif « l’ » reprend « mon peuple ».
- source_word: בְּדַרְכֵיהֶם
  choice: sur ses chemins
  rationale: La préposition ב dans l’image du déplacement est rendue naturellement par « sur ». Le possessif singulier reprend en français le nom collectif « mon peuple ».
- source_word: שְׁבִילֵי עוֹלָם
  choice: les sentiers de toujours
  rationale: עוֹלָם qualifie ici des voies établies depuis longtemps. « De toujours » garde l’idée de permanence et d’ancienneté dans un français naturel, tout en faisant écho à l’image récurrente des voies anciennes chez Jérémie.
- source_word: לָלֶכֶת
  choice: afin qu’il marche
  rationale: L’infinitif de הלך est rendu par « marcher », ce qui maintient la métaphore de la conduite comme déplacement sur un chemin.
- source_word: נְתִיבוֹת
  choice: des chemins de traverse
  rationale: Le terme peut désigner des sentiers ou des pistes. Le contexte les oppose aux sentiers établis ; « chemins de traverse » exprime clairement cette déviation sans suggérer nécessairement une route moderne.
- source_word: דֶּרֶךְ לֹא סְלוּלָה
  choice: une route qui n’est pas aménagée
  rationale: סלל évoque l’aménagement ou le terrassement d’une route. « Qui n’est pas aménagée » conserve l’image concrète sans employer une tournure archaïque.
theological_decisions:
- issue: Objet du culte impliqué par לַשָּׁוְא
  choice: « ce qui n’est que néant »
  alternative: « les idoles », « les faux dieux » ou « en vain »
  rationale: Le contexte condamne un culte infidèle, mais le substantif hébreu reste plus large que le mot « idoles ». La traduction retenue préserve cette amplitude et la force polémique de l’image.
- issue: Agent de וַיַּכְשִׁלוּם
  choice: Conserver un agent indéterminé par « On l’a fait trébucher »
  alternative: « ils les ont fait trébucher » ou « il a trébuché »
  rationale: L’hébreu présente une forme causative avec objet, mais le référent du sujet demeure comprimé et ambigu. La tournure retenue ne supprime ni la causalité ni l’incertitude sur l’agent.
translation_notes:
  register: Français international moderne, digne et accessible. Le collectif « mon peuple » gouverne des pronoms au singulier. La ponctuation garde le mouvement poétique de l’hébreu, tandis que les notes signalent les principales ambiguïtés lexicales et syntaxiques.
