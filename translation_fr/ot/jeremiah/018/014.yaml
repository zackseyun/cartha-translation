  text: הֲ/יַעֲזֹ֥ב מִ/צּ֛וּר שָׂדַ֖י שֶׁ֣לֶג לְבָנ֑וֹן אִם יִנָּתְשׁ֗וּ מַ֛יִם זָרִ֥ים קָרִ֖ים נוֹזְלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/014.yaml
  text: Does the snow of Lebanon leave the rock of the open country? Or are cold[b][a], flowing foreign waters ever uprooted?
translation:
  language: fr
  text: La neige du Liban quitte-t-elle le rocher de la campagne[a] ? Ou bien les eaux étrangères[b], froides, qui coulent, sont-elles arrachées ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rocher des champs », « l’escarpement de la campagne », ou une expression semblable. L’hébreu est difficile et évoque probablement les hauteurs rocheuses ou la campagne ouverte associées à la neige du Liban.
    reason: lexical_alternative
  - marker: b
    text: Ou « étranges » ou « venues d’ailleurs ». Il peut s’agir d’eaux provenant d’une source éloignée, sans que « étrangères » ait ici un sens moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲזֹב
  choice: quitte-t-elle
  rationale: L’interrogatif introduit une question rhétorique. « Quitter » convient naturellement à l’image de la neige sans personnaliser excessivement le verbe.
- source_word: מִצּוּר שָׂדַי
  choice: le rocher en pleine campagne
  rationale: צוּר désigne un rocher ou un escarpement, et שָׂדַי se rattache au champ ou à la campagne ouverte. La formulation conserve l’image concrète et la difficulté du syntagme sans la préciser abusivement.
- source_word: שֶׁלֶג לְבָנוֹן
  choice: la neige du Liban
  rationale: Rend directement la relation entre la neige et le Liban, dans un français naturel.
- source_word: אִם
  choice: Ou bien
  rationale: Dans le parallélisme poétique, le terme introduit une seconde question rhétorique plutôt qu’une condition.
- source_word: יִנָּתְשׁוּ
  choice: sont-elles arrachées
  rationale: Le niphal de נטש évoque normalement ce qui est arraché ou déraciné. « Arrachées » maintient cette métaphore frappante appliquée aux eaux, au lieu de la réduire à « tarissent ».
- source_word: מַיִם זָרִים
  choice: les eaux lointaines
  rationale: זָרִים peut signifier « étrangères » ou « venues d’ailleurs ». Dans cette image naturelle, « lointaines » suggère une source éloignée tout en évitant une connotation morale indue; l’ambiguïté est signalée en note.
- source_word: קָרִים
  choice: froides
  rationale: L’adjectif décrit directement la température des eaux de montagne.
- source_word: נוֹזְלִים
  choice: ruisselantes
  rationale: Le participe décrit des eaux en mouvement. « Ruisselantes » offre une image naturelle et poétique, sans imposer l’idée d’un faible débit.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. Les deux questions rhétoriques et la métaphore inhabituelle des eaux « arrachées » sont conservées; les syntagmes hébreux incertains sont explicités sans être résolus dans les notes.
