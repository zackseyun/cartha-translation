source:
  edition: WLC
  text: הַ/יְשֻׁלַּ֤ם תַּֽחַת טוֹבָה֙ רָעָ֔ה כִּֽי כָר֥וּ שׁוּחָ֖ה לְ/נַפְשִׁ֑/י זְכֹ֣ר עָמְדִ֣/י לְ/פָנֶ֗י/ךָ לְ/דַבֵּ֤ר עֲלֵי/הֶם֙ טוֹבָ֔ה לְ/הָשִׁ֥יב אֶת חֲמָתְ/ךָ֖ מֵ/הֶֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/020.yaml
  text: Should evil be repaid for good? For they have dug a pit for my life[a]. Remember that I stood before you to speak good on their behalf[b], to turn your wrath away from them.
translation:
  language: fr
  text: Rend-on le mal pour le bien ? Car ils ont creusé une fosse pour m’ôter la vie[a]. Souviens-toi que je me suis tenu devant toi pour parler en leur faveur[b], afin de détourner d’eux ta fureur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour ma vie » ; le mot hébreu peut aussi désigner la personne elle-même dans un contexte de danger mortel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour parler pour leur bien » ou « pour dire du bien à leur sujet ». Dans ce contexte, il s’agit d’une intercession en leur faveur devant Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְשֻׁלַּם
  choice: Rend-on
  rationale: Le passif pual dans cette question rhétorique exprime la rétribution. La tournure impersonnelle française « Rend-on » est naturelle et conserve la force interrogative.
- source_word: תַּחַת
  choice: pour
  rationale: Dans l’expression de rétribution « le mal pour le bien », « pour » rend naturellement l’idée d’un échange en retour.
- source_word: טוֹבָה ... רָעָה
  choice: le bien ... le mal
  rationale: Ces termes généraux maintiennent le contraste moral net de l’hébreu.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit le motif qui fonde la question rhétorique et convient au registre de la lamentation.
- source_word: כָרוּ שׁוּחָה
  choice: ils ont creusé une fosse
  rationale: L’expression désigne une fosse creusée comme piège. Le passé composé rend naturellement l’accompli hébreu.
- source_word: לְנַפְשִׁי
  choice: pour m’ôter la vie
  rationale: נֶפֶשׁ désigne ici la vie ou la personne menacée de mort. Cette formulation explicite en français la finalité meurtrière de la fosse sans introduire une opposition entre corps et âme.
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: Impératif adressé à Dieu ; cette traduction est directe, naturelle et digne.
- source_word: עָמְדִי לְפָנֶיךָ
  choice: que je me suis tenu devant toi
  rationale: La formulation conserve l’image concrète de Jérémie se tenant en présence de Dieu dans une posture d’intercession.
- source_word: לְדַבֵּר עֲלֵיהֶם טוֹבָה
  choice: pour parler en leur faveur
  rationale: La préposition עַל et le substantif טוֹבָה indiquent ici une parole bénéfique prononcée à leur sujet, dans un contexte d’intercession.
- source_word: לְהָשִׁיב אֶת חֲמָתְךָ מֵהֶם
  choice: afin de détourner d’eux ta fureur
  rationale: Le hifil de שׁוב exprime le fait de faire revenir ou d’écarter ; « détourner d’eux » est idiomatique et respecte le mouvement exprimé par l’hébreu. « Fureur » rend l’intensité de חֵמָה.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans un contexte de danger mortel
  choice: ma vie, exprimé par « pour m’ôter la vie »
  alternative: mon âme
  rationale: Le contexte porte sur un complot contre la personne et la vie de Jérémie. « Âme » risquerait de suggérer une distinction anthropologique absente du passage.
- issue: Rendu de la colère divine חֲמָה
  choice: fureur
  alternative: colère
  rationale: « Fureur » préserve l’intensité du terme dans le contexte du jugement divin, sans en faire un concept théologique technique.
- issue: Portée de לְדַבֵּר עֲלֵיהֶם טוֹבָה
  choice: parler en leur faveur
  alternative: dire du bien d’eux
  rationale: Le contexte devant Dieu et la proposition finale sur le détournement de sa fureur indiquent une intercession pour leur bien, plutôt qu’un simple éloge.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique reste concise ; les images de la fosse et de la comparution devant Dieu sont conservées. Le tutoiement correspond à l’adresse biblique directe à Dieu.
