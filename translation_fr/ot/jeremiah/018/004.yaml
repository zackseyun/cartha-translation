  text: וְ/נִשְׁחַ֣ת הַ/כְּלִ֗י אֲשֶׁ֨ר ה֥וּא עֹשֶׂ֛ה בַּ/חֹ֖מֶר בְּ/יַ֣ד הַ/יּוֹצֵ֑ר וְ/שָׁ֗ב וַֽ/יַּעֲשֵׂ֨/הוּ֙ כְּלִ֣י אַחֵ֔ר כַּ/אֲשֶׁ֥ר יָשַׁ֛ר בְּ/עֵינֵ֥י הַ/יּוֹצֵ֖ר לַ/עֲשֽׂוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/004.yaml
  text: And the vessel that he was making from the clay was spoiled in the potter’s hand[a], and he turned and made it into another vessel[b], as seemed right in the potter’s eyes to make.
translation:
  language: fr
  text: Le vase qu’il façonnait dans l’argile s’abîma dans la main du potier[a]. Celui-ci recommença et en fit un autre vase, comme il jugea bon de le faire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « se détériora » ou « fut gâché ». Le verbe hébreu indique que le vase devint défectueux pendant le façonnage.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon ce qui était droit aux yeux du potier de faire », expression qui signifie : « comme le potier jugea bon de le faire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁחַת
  choice: s’abîma
  rationale: Le nifal de שׁחת décrit ici le vase qui devient défectueux pendant le façonnage. « S’abîma » conserve ce résultat sans préciser indûment la cause ni suggérer nécessairement une destruction totale.
- source_word: הַכְּלִי
  choice: le vase
  rationale: Dans le contexte explicite du travail d’un potier, « vase » est le terme français courant et précis, tout en gardant le sens général de récipient façonné.
- source_word: עֹשֶׂה
  choice: façonnait
  rationale: Le participe exprime une action en cours. « Façonnait » convient naturellement au travail du potier et rend cet aspect progressif.
- source_word: בַּחֹמֶר
  choice: dans l’argile
  rationale: La préposition introduit ici la matière travaillée. « Dans l’argile » est une formulation française concise pour un objet façonné dans cette matière.
- source_word: בְּיַד הַיּוֹצֵר
  choice: dans la main du potier
  rationale: Cette traduction garde l’image concrète et le singulier de l’hébreu, sans transformer la scène en explication théologique.
- source_word: וְשָׁב
  choice: Celui-ci recommença
  rationale: שׁוב marque ici la reprise de l’action plutôt qu’un déplacement. « Recommença » exprime naturellement cette nouvelle tentative; « Celui-ci » identifie clairement le potier.
- source_word: וַיַּעֲשֵׂהוּ כְּלִי אַחֵר
  choice: et en fit un autre vase
  rationale: Le pronom renvoie à la matière ou à l’objet défectueux repris par le potier. La construction avec « en » conserve cette référence sans trancher plus précisément.
- source_word: כַּאֲשֶׁר יָשַׁר בְּעֵינֵי הַיּוֹצֵר לַעֲשׂוֹת
  choice: comme il jugea bon de le faire
  rationale: Cette tournure française naturelle rend l’idiome « fut droit/bon aux yeux du potier » comme l’expression de ce qui lui semblait approprié.
theological_decisions:
- issue: Image du potier et portée théologique
  choice: Conserver uniquement la scène concrète du potier dans le verset.
  alternative: Expliciter dès ce verset la souveraineté de Dieu sur les personnes ou les nations.
  rationale: Le verset décrit d’abord ce que Jérémie observe dans l’atelier; l’interprétation théologique vient dans le contexte suivant. L’expliciter ici anticiperait le texte et réduirait sa tension narrative.
- issue: Référence du pronom dans וַיַּעֲשֵׂהוּ
  choice: Employer « en fit » sans préciser s’il s’agit du vase défectueux ou de la masse d’argile.
  alternative: Dire explicitement « reprit l’argile » ou « refit le vase ».
  rationale: L’hébreu permet de comprendre la matière du vase reprise et remodelée. Une formulation non spécifiée préserve cette souplesse référentielle.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire reste concret et accessible. La première phrase conserve l’image hébraïque de la « main » au singulier; la seconde privilégie une expression française fluide tout en signalant l’idiome littéral en note.
