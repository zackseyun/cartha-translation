    rationale: Cette expression française peut désigner des personnes mortellement blessées, tandis que le participe hébreu הרוגים les présente comme tués. « Frappés par la mort » conserve le caractère difficile de l’expression et l’idée d’une destruction accomplie, sans identifier abusivement la mort à une personne ou à une maladie précise.
