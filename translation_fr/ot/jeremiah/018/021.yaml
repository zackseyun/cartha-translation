revisions:
- from: C’est pourquoi, livre leurs enfants à la famine[a] et abandonne-les au pouvoir de l’épée. Que leurs femmes soient privées de leurs enfants et deviennent veuves ; que leurs hommes soient frappés à mort[b], et leurs jeunes gens abattus par l’épée au combat.
  to: C’est pourquoi, livre leurs enfants[a] à la famine et abandonne-les au pouvoir de l’épée. Que leurs femmes perdent leurs enfants et deviennent veuves ; que leurs hommes soient frappés par la mort[b], et leurs jeunes gens abattus par l’épée au combat.
  rationale: La révision évite de faire de « frappés à mort » une simple blessure mortelle et restitue plus adéquatement l’expression hébraïque inhabituelle « tués de mort ». Elle rend aussi plus nettement le deuil des enfants et replace l’ancre de la note lexicale sur le mot qu’elle explique.
