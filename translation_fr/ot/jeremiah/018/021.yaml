source:
  edition: WLC
  text: לָ/כֵן֩ תֵּ֨ן אֶת בְּנֵי/הֶ֜ם לָ/רָעָ֗ב וְ/הַגִּרֵ/ם֮ עַל יְדֵי חֶרֶב֒ וְ/תִֽהְיֶ֨נָה נְשֵׁי/הֶ֤ם שַׁכֻּלוֹת֙ וְ/אַלְמָנ֔וֹת וְ/אַ֨נְשֵׁי/הֶ֔ם יִֽהְי֖וּ הֲרֻ֣גֵי מָ֑וֶת בַּח֣וּרֵי/הֶ֔ם מֻכֵּי חֶ֖רֶב בַּ/מִּלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/021.yaml
  text: Therefore give their children over to famine[a], and hand them over to the power of the sword. Let their wives become bereaved and widowed, and let their men be slain by death[c][b], their young men struck down by the sword in battle.
translation:
  language: fr
  text: C’est pourquoi, livre leurs enfants[a] à la famine et abandonne-les au pouvoir de l’épée. Que leurs femmes perdent leurs enfants et deviennent veuves ; que leurs hommes soient frappés par la mort[b], et leurs jeunes gens abattus par l’épée au combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs fils ». Le mot hébreu peut désigner les fils plus précisément, mais aussi les enfants de façon collective.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tués de mort », expression hébraïque difficile qui souligne une destruction fatale.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence de ce qui précède dans un français naturel et soutenu.
- source_word: תֵּן ... לָרָעָב
  choice: livre ... à la famine
  rationale: Le verbe נתן avec ל exprime ici l’abandon à un sort ou à une puissance ; « livrer à » restitue bien cette force.
- source_word: בְּנֵיהֶם
  choice: leurs enfants
  rationale: בנים peut désigner plus précisément les fils, mais peut aussi fonctionner collectivement pour la descendance ; « enfants » préserve cette portée possible.
- source_word: וְהַגִּרֵם עַל יְדֵי חֶרֶב
  choice: abandonne-les au pouvoir de l’épée
  rationale: Le hiphil de נגר est difficile ici. Avec l’expression littéralement « sur les mains de l’épée », le contexte indique qu’ils sont livrés à la puissance meurtrière de l’épée.
- source_word: שַׁכֻּלוֹת
  choice: privées de leurs enfants
  rationale: Le terme désigne des femmes endeuillées par la perte de leurs enfants ; cette formulation explicite la nature du deuil mieux que le seul adjectif « endeuillées ».
- source_word: וְאַנְשֵׁיהֶם
  choice: leurs hommes
  rationale: Le mot vise ici les hommes adultes, en parallèle avec les femmes et les jeunes gens, sans devoir être limité au sens de « maris ».
- source_word: הֲרֻגֵי מָוֶת
  choice: frappés à mort
  rationale: La construction difficile signifie littéralement quelque chose comme « tués de mort ». « Frappés à mort » conserve l’idée de mise à mort et son intensité sans produire un français artificiel.
- source_word: בַּחוּרֵיהֶם מֻכֵּי חֶרֶב בַּמִּלְחָמָה
  choice: leurs jeunes gens abattus par l’épée au combat
  rationale: בחור désigne des hommes jeunes, souvent en âge de combattre ; « abattus par l’épée au combat » rend la tournure passive et la scène de guerre.
theological_decisions:
- issue: Formulation d’une prière imprécatoire adressée à Dieu
  choice: Conserver les demandes directes de jugement
  alternative: Transformer les demandes en prédictions ou atténuer la violence
  rationale: Les impératifs et les formes volitives de l’hébreu présentent une supplication directe. La traduction doit préserver cette tension théologique et rhétorique sans l’adoucir ni l’approuver au-delà de ce que dit le texte.
- issue: Sens de הֲרֻגֵי מָוֶת
  choice: frappés à mort
  alternative: tués par la Mort
  rationale: La construction peut être personnifiée dans certaines lectures, mais le contexte n’impose pas nettement « la Mort » comme agent personnel. Une expression française marquant l’issue fatale préserve mieux l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs et souhaits de jugement sont maintenus. Le parallélisme familial et militaire du verset est conservé, sans archaïsmes tels que « glaive » ou « que leurs femmes soient sans enfants ».
