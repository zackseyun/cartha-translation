  text: making their land a desolation[a], an object of perpetual hissing[b]; everyone who passes by it will be appalled and shake his head.
translation:
  language: fr
  text: pour faire de leur pays une désolation, un objet de sifflements perpétuels[a]. Quiconque passera devant lui sera frappé de stupeur et secouera la tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sifflement perpétuel ». L’hébreu évoque probablement les sifflements de dérision suscités par la vue d’un pays en ruine.
    reason: lexical_alternative
  - marker: b
    text: Secouer la tête était un geste pouvant exprimer le mépris, la stupeur ou la consternation devant la dévastation.
    reason: cultural_note
lexical_decisions:
- source_word: לָשׂוּם
  choice: pour faire
  rationale: L’infinitif construit avec ל peut exprimer ici le but ou le résultat dans la continuité du verset précédent; « pour faire » conserve ce lien syntaxique.
- source_word: אַרְצָם
  choice: leur pays
  rationale: אֶרֶץ désigne ici le territoire habité appartenant au peuple jugé; « pays » est naturel en français dans ce contexte.
- source_word: לְשַׁמָּה
  choice: un lieu dévasté
  rationale: שַׁמָּה évoque la dévastation produite par le jugement; cette formulation française garde l’image concrète sans employer le peu naturel « une désolation ».
- source_word: שרוקת עוֹלָם
  choice: un objet de sifflements perpétuels
  rationale: Le nom lié à שרק désigne vraisemblablement les sifflements de dérision ou de stupeur suscités par le pays ruiné; עוֹלָם indique ici leur caractère durable.
- source_word: כֹּל עוֹבֵר עָלֶיהָ
  choice: Tous ceux qui passeront près de lui
  rationale: L’expression vise les passants qui voient le pays dévasté; le pronom masculin français reprend naturellement « pays ».
- source_word: יִשֹּׁם
  choice: seront consternés
  rationale: Le qal de שמם peut exprimer la stupeur ou la consternation devant une dévastation; « consternés » convient au spectacle décrit.
- source_word: וְיָנִיד בְּרֹאשׁוֹ
  choice: et secoueront la tête
  rationale: L’expression décrit un geste pouvant traduire le mépris, la stupeur ou l’accablement; « secouer la tête » est l’équivalent français moderne le plus naturel.
