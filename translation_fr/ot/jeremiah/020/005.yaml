reference: Jeremiah 20:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת כָּל חֹ֨סֶן֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת כָּל יְגִיעָ֖/הּ וְ/אֶת כָּל יְקָרָ֑/הּ וְ/אֵ֨ת כָּל אוֹצְר֜וֹת מַלְכֵ֣י יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְזָזוּ/ם֙ וּ/לְקָח֔וּ/ם וֶ/הֱבִיא֖וּ/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/005.yaml
  text: And I will give all the wealth of this city[a], all its gains, all its precious things, and all the treasures of the kings of Judah into the hand of their enemies. They will plunder them, take them[c][b], and bring them to Babylon.
translation:
  language: fr
  text: Je livrerai toutes les richesses de cette ville, tout le fruit de son travail[a], tous ses biens précieux et tous les trésors des rois de Juda au pouvoir de leurs ennemis[b]. Ceux-ci les pilleront, s’en empareront et les emporteront à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout son labeur » ou « tout ce qu’elle a produit ». Le terme hébreu peut désigner le travail lui-même ou le résultat de ce travail.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la main de leurs ennemis », expression hébraïque signifiant sous leur contrôle ou en leur pouvoir.
    reason: cultural_note
lexical_decisions:
- source_word: חֹסֶן
  choice: richesses
  rationale: Dans cette énumération de biens livrés au pillage, le nom désigne les ressources matérielles de la ville plutôt qu’une force abstraite.
- source_word: יְגִיעָהּ
  choice: le fruit de son travail
  rationale: Le terme peut désigner le travail pénible lui-même ou ce qu’il produit. Puisqu’il s’agit ici de biens susceptibles d’être pillés, la formulation retient le résultat du travail tout en maintenant le lien avec celui-ci.
- source_word: יְקָרָהּ
  choice: ses biens précieux
  rationale: Dans une liste de richesses saisissables, le sens concret de choses précieuses ou de valeur convient mieux que les sens abstraits d’honneur ou de splendeur.
- source_word: אוֹצְרוֹת מַלְכֵי יְהוּדָה
  choice: les trésors des rois de Juda
  rationale: Le contexte met l’accent sur les biens emportés plutôt que sur les bâtiments ou dépôts qui les contiennent.
- source_word: בְּיַד
  choice: au pouvoir de
  rationale: L’expression hébraïque « dans la main de » est un idiome indiquant la remise sous le contrôle ou au pouvoir de quelqu’un; la traduction française en explicite naturellement le sens.
- source_word: אֹיְבֵיהֶם
  choice: leurs ennemis
  rationale: Le suffixe pluriel renvoie le plus naturellement aux rois de Juda, antécédent pluriel immédiat. Le pronom français conserve cette référence sans identifier davantage les ennemis.
- source_word: וּבְזָזוּם
  choice: les pilleront
  rationale: Le verbe désigne l’action de piller ou de prendre comme butin, sens adapté au contexte militaire.
- source_word: וּלְקָחוּם
  choice: s’en empareront
  rationale: Cette formulation exprime la prise effective des biens après leur pillage, sans anticiper leur transport à Babylone mentionné ensuite.
- source_word: וֶהֱבִיאוּם בָּבֶלָה
  choice: les emporteront à Babylone
  rationale: Le causatif et la terminaison directionnelle indiquent que les biens seront conduits jusqu’à Babylone; « emporter » est idiomatique en français pour des objets pillés.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Je livrerai » rend le don comme remise au pouvoir des ennemis; « ceux-ci » clarifie le changement de sujet sans ajouter d’acteur. Les marqueurs [a] et [b] figurent dans le texte à l’endroit pertinent.
