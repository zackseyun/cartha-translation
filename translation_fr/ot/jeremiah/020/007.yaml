  text: פִּתִּיתַ֤/נִי יְהוָה֙ וָֽ/אֶפָּ֔ת חֲזַקְתַּ֖/נִי וַ/תּוּכָ֑ל הָיִ֤יתִי לִ/שְׂחוֹק֙ כָּל הַ/יּ֔וֹם כֻּלֹּ֖/ה לֹעֵ֥ג לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/007.yaml
  text: You persuaded me[a], Yahweh, and I was persuaded; you overpowered me and prevailed. I have become a laughingstock all day long; everyone mocks me.
translation:
  language: fr
  text: Tu m’as séduit[a], Yahweh, et je me suis laissé séduire ; tu as été plus fort que moi et tu l’as emporté. Je suis devenu la risée tout au long du jour ; tous se moquent de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu m’as trompé, Yahweh, et j’ai été trompé. » Le verbe hébreu peut signifier séduire, persuader, attirer ou tromper ; la plainte de Jérémie est volontairement très forte.'
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתִּיתַנִי
  choice: Tu m’as séduit
  rationale: Le verbe פתה peut signifier séduire, persuader, attirer ou tromper selon le contexte. « Séduire » conserve en français la force équivoque et troublante de la plainte sans imposer exclusivement l’idée de tromperie.
- source_word: וָאֶפָּת
  choice: et je me suis laissé séduire
  rationale: La tournure française exprime naturellement la valeur passive ou réflexive du verbe et maintient le parallélisme avec le premier membre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre substitutif.
- source_word: חֲזַקְתַּנִי
  choice: tu as été plus fort que moi
  rationale: Cette formulation rend directement l’exercice d’une force supérieure sur Jérémie, tout en évitant de préciser plus que l’hébreu la manière dont cette force s’exerce.
- source_word: וַתּוּכָל
  choice: et tu l’as emporté
  rationale: יכל exprime ici la réussite ou la victoire dans un rapport de force. Cette expression est claire, actuelle et digne.
- source_word: הָיִיתִי לִשְׂחוֹק
  choice: Je suis tourné en dérision
  rationale: L’expression désigne le fait d’être devenu l’objet des rires et du mépris publics.
- source_word: כָּל־הַיּוֹם כֻּלֹּה
  choice: tout au long du jour
  rationale: Cette formulation restitue l’insistance de l’expression hébraïque sur la durée entière.
- source_word: לֹעֵג לִי
  choice: tous se moquent de moi
  rationale: Le participe singulier a une portée distributive dans ce contexte ; le français collectif rend clairement que chacun se moque du prophète.
theological_decisions:
- issue: Faut-il rendre פתה par une accusation explicite de tromperie divine ?
  choice: Employer « séduit » dans le texte et signaler « trompé » en note.
  alternative: « Tu m’as trompé, Yahweh, et j’ai été trompé. »
  rationale: La lamentation est volontairement audacieuse, et le verbe hébreu peut évoquer aussi bien la séduction ou la persuasion que la tromperie. « Séduit » préserve cette tension sémantique, tandis que la note maintient visible la lecture accusatrice plus forte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formulation conserve le caractère personnel, âpre et accusateur de la lamentation ainsi que l’ambiguïté du verbe initial.
