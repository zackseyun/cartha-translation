  source_fidelity: 'Le premier hémistiche rend bien la tension de פתה : « séduire » est un choix français établi et suffisamment ambigu, tandis que la note conserve explicitement la possibilité plus accusatrice de « tromper ». « Tu as été plus fort que moi et tu l’as emporté » restitue correctement les deux verbes de domination. En revanche, « Je suis tourné en dérision » décrit surtout un état présent et ne rend pas aussi nettement l’accompli הָיִיתִי (« je suis devenu »).'
