id: JER.20.13
reference: Jeremiah 20:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁ֚ירוּ לַֽ/יהוָ֔ה הַֽלְל֖וּ אֶת יְהוָ֑ה כִּ֥י הִצִּ֛יל אֶת נֶ֥פֶשׁ אֶבְי֖וֹן מִ/יַּ֥ד מְרֵעִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/013.yaml
  text: Sing to Yahweh[a]; praise Yahweh[c][b], for he has delivered the life of the poor from the hand of evildoers.
translation:
  language: fr
  text: Chantez à Yahweh[a] ! Louez Yahweh ! Car il a délivré la vie du pauvre[b] de la main des malfaiteurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, traditionnellement rendu par « le Seigneur ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « l’âme du pauvre » ; ici, « la vie » désigne la personne elle-même en danger.
    reason: lexical_alternative
  - marker: c
    text: Ou « du pouvoir des malfaiteurs » ; « de la main » est une expression hébraïque évoquant leur puissance ou leur emprise.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Chantez
  rationale: Impératif pluriel de שׁיר. « Chantez » rend directement l’appel collectif sans ajouter l’idée de louange, déjà exprimée par l’impératif suivant.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici le destinataire du chant. « Pour Yahweh » est naturel en français et conserve le nom divin.
- source_word: הַלְלוּ
  choice: Louez
  rationale: Impératif pluriel intensif de הלל dans un contexte cultuel ; « Louez » est l’équivalent français direct et idiomatique.
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation. « Car » maintient clairement le lien causal dans un registre poétique digne.
- source_word: הִצִּיל
  choice: a délivré
  rationale: Le hiphil accompli de נצל désigne une action de sauvetage achevée. Le passé composé convient au français actuel et garde la portée présente de cette délivrance.
- source_word: נֶפֶשׁ
  choice: la vie
  rationale: Dans ce contexte de menace humaine, נֶפֶשׁ désigne la vie ou la personne exposée au danger, non nécessairement une âme immatérielle.
- source_word: אֶבְיוֹן
  choice: du pauvre
  rationale: Le singulier אֶבְיוֹן désigne une personne pauvre ou indigente. « Du pauvre » est direct et préserve le singulier représentatif.
- source_word: מִיַּד
  choice: de la main
  rationale: Conserve l’image hébraïque de la main comme siège de la puissance ou de l’emprise ; la métaphore reste intelligible en français.
- source_word: מְרֵעִים
  choice: des malfaiteurs
  rationale: Participe substantivé désignant ceux qui font le mal. « Malfaiteurs » est concis, naturel et adapté au registre prophétique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le caractère de nom propre sans substituer un titre.
- issue: Sens de נֶפֶשׁ dans un contexte de délivrance
  choice: la vie
  alternative: l’âme ; la personne
  rationale: Le contexte décrit le sauvetage d’un être humain menacé par des malfaiteurs. « La vie » rend le sens concret sans imposer une anthropologie technique.
- issue: Valeur de l’expression מִיַּד מְרֵעִים
  choice: de la main des malfaiteurs
  alternative: du pouvoir des malfaiteurs
  rationale: Le rendu principal préserve la métaphore corporelle de l’hébreu, tandis que la note explicite sa valeur idiomatique de pouvoir ou d’emprise.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux impératifs brefs conservent le parallélisme de l’hébreu. La métaphore « de la main » est maintenue dans le texte et expliquée en note.
