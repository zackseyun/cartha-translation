source:
  edition: WLC
  text: כִּֽי מִ/דֵּ֤י אֲדַבֵּר֙ אֶזְעָ֔ק חָמָ֥ס וָ/שֹׁ֖ד אֶקְרָ֑א כִּֽי הָיָ֨ה דְבַר יְהוָ֥ה לִ֛/י לְ/חֶרְפָּ֥ה וּ/לְ/קֶ֖לֶס כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/008.yaml
  text: For whenever I speak[a], I cry out; I proclaim, “Violence and destruction!” For the word of Yahweh has become to me a reproach and a derision all day long.
translation:
  language: fr
  text: 'Car chaque fois que je parle[a], je crie ; je proclame : « Violence et dévastation ! » Car la parole de Yahweh est devenue pour moi un objet d’opprobre et de dérision toute la journée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Aussi souvent que je parle ».'
    reason: L’expression hébraïque מִדֵּי avec l’imparfait marque la répétition ; « chaque fois que » et « aussi souvent que » sont deux rendus français possibles.
lexical_decisions:
- source_word: מִדֵּי אֲדַבֵּר
  choice: chaque fois que je parle
  rationale: L’expression מִדֵּי suivie de l’imparfait indique une occurrence répétée. « Chaque fois que » est naturel en français moderne et conserve cette valeur itérative.
- source_word: אֶזְעָק
  choice: je dois crier
  rationale: זעק exprime un cri puissant. Dans le contexte, la parole prophétique entraîne nécessairement ce cri ; « je dois crier » rend cette contrainte implicite sans en préciser abusivement la cause.
- source_word: חָמָס וָשֹׁד
  choice: Violence et dévastation !
  rationale: חָמָס désigne la violence ou l’injustice violente, tandis que שֹׁד évoque les ravages, la destruction ou le pillage. « Dévastation » restitue ici la portée générale de שֹׁד.
- source_word: אֶקְרָא
  choice: je proclame
  rationale: קרא introduit ici le contenu du message annoncé publiquement. « Je proclame » évite une répétition maladroite après « je dois crier ».
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette expression prophétique traditionnelle conserve la portée littéraire et théologique de דָּבָר, tandis que le nom divin est translittéré.
- source_word: לְחֶרְפָּה וּלְקֶלֶס
  choice: insultes et moqueries
  rationale: חֶרְפָּה renvoie à l’opprobre et aux insultes, et קֶלֶס à la dérision. Le pluriel concret exprime naturellement en français le traitement subi par Jérémie à cause de la parole.
- source_word: כָּל הַיּוֹם
  choice: sans cesse
  rationale: Littéralement « tout le jour », cette expression peut marquer une durée continuelle. « Sans cesse » s’intègre naturellement à la proposition et évite de suggérer que les réactions cessent chaque nuit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Agent de l’opprobre et de la dérision
  choice: La parole de Yahweh attire à Jérémie insultes et moqueries
  alternative: La parole de Yahweh est elle-même devenue un objet d’opprobre et de dérision pour Jérémie
  rationale: La construction לִי peut indiquer que la parole est pour Jérémie la cause du traitement hostile qu’il subit, mais l’hébreu permet aussi de comprendre que la parole elle-même devient pour lui objet d’opprobre. La traduction principale privilégie le sens contextuel, et la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le parallélisme du cri prophétique est conservé, avec une ponctuation qui met en relief son contenu. La note signale l’ambiguïté réelle de la dernière proposition.
