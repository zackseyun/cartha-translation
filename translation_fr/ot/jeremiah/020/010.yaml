  naturalness: « Les propos malveillants de beaucoup de gens » est plus naturel en français international moderne que « les calomnies de beaucoup », tout en évitant d’affirmer que les accusations étaient nécessairement mensongères. « Nous nous vengerons de lui » est idiomatique et conserve le registre grave. La note b doit éviter l’ambiguïté de « sa chute ».
  terminology: « Terreur de tous côtés » conserve la formule récurrente de Jérémie. « Dénoncez » est recevable dans ce contexte hostile, avec une note qui signale le sens plus large d’annoncer ou rapporter. « Ceux qui étaient en paix avec moi » garde sans surinterprétation l’expression « hommes de ma paix ».
