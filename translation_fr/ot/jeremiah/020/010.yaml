source:
  edition: WLC
  text: כִּ֣י שָׁמַ֜עְתִּי דִּבַּ֣ת רַבִּים֮ מָג֣וֹר מִ/סָּבִיב֒ הַגִּ֨ידוּ֙ וְ/נַגִּידֶ֔/נּוּ כֹּ֚ל אֱנ֣וֹשׁ שְׁלוֹמִ֔/י שֹׁמְרֵ֖י צַלְעִ֑/י אוּלַ֤י יְפֻתֶּה֙ וְ/נ֣וּכְלָה ל֔/וֹ וְ/נִקְחָ֥ה נִקְמָתֵ֖/נוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/010.yaml
  text: 'For I have heard the whispering of many: “Terror on every side!” “Report[a], and let us report it!” All the men at peace with me are watching for my stumbling: “Perhaps he will be deceived, and we will prevail against him[b], and we will take our vengeance on him.”'
translation:
  language: fr
  text: 'Car j’ai entendu les propos malveillants de beaucoup de gens : « Terreur de tous côtés ! » « Dénoncez[a], et nous le dénoncerons ! » Tous ceux qui étaient en paix avec moi guettent mon faux pas[b] : « Peut-être se laissera-t-il tromper ; alors nous l’emporterons sur lui et nous nous vengerons de lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Signalez, et nous le signalerons ! » Le verbe hébreu signifie « annoncer, déclarer, rapporter » ; dans ce contexte hostile, il peut prendre le sens de « dénoncer ». Le premier impératif n’a pas de complément exprimé en hébreu ; le suffixe du second peut renvoyer à Jérémie ou à l’accusation portée contre lui.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « guettent mon côté » ou peut-être « guettent ma boiterie » ; ils surveillent une faiblesse ou un faux pas qui pourrait le faire tomber.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּת רַבִּים
  choice: les calomnies de beaucoup
  rationale: דִּבָּה désigne un mauvais propos, une rumeur diffamatoire ou une calomnie. Dans ce contexte d’hostilité et de complot, « calomnies » rend clairement la portée malveillante, tandis que « de beaucoup » conserve l’ampleur indéfinie de רַבִּים.
- source_word: מָגוֹר מִסָּבִיב
  choice: Terreur de tous côtés !
  rationale: Cette formule caractéristique de Jérémie évoque une menace qui encercle le locuteur. « De tous côtés » est naturel en français et préserve cette image.
- source_word: הַגִּידוּ וְנַגִּידֶנּוּ
  choice: Dénoncez-le, et nous le dénoncerons !
  rationale: Le verbe נגד signifie fondamentalement annoncer, déclarer ou rapporter. Le contexte accusateur permet ici « dénoncer ». Le suffixe de וְנַגִּידֶנּוּ renvoie vraisemblablement à Jérémie; la première proposition laisse cependant son objet implicite dans l’hébreu, d’où une note.
- source_word: כֹּל אֱנוֹשׁ שְׁלוֹמִי
  choice: Tous ceux qui étaient en paix avec moi
  rationale: L’expression signifie littéralement « tout homme de ma paix » et désigne les personnes entretenant des rapports pacifiques ou amicaux avec le locuteur. La formulation française reste proche sans limiter inutilement le groupe à ses amis intimes.
- source_word: שֹׁמְרֵי צַלְעִי
  choice: guettent mon faux pas
  rationale: צֶלַע peut évoquer le côté, la boiterie ou une faiblesse. Dans cette expression, les adversaires surveillent Jérémie dans l’attente d’une faute ou d’une chute. « Guetter mon faux pas » rend naturellement l’intention hostile tout en signalant l’image plus littérale en note.
- source_word: יְפֻתֶּה
  choice: se laissera-t-il tromper
  rationale: Le niphal de פתה peut signifier être séduit, dupé ou trompé. La tournure pronominale française exprime la possibilité que Jérémie tombe dans leur piège sans préciser le procédé.
- source_word: וְנוּכְלָה לוֹ
  choice: alors nous l’emporterons sur lui
  rationale: יכל avec ל exprime ici le fait de pouvoir vaincre ou prévaloir contre quelqu’un. « L’emporter sur lui » est idiomatique et conserve la force adversative.
- source_word: וְנִקְחָה נִקְמָתֵנוּ מִמֶּנּוּ
  choice: nous tirerons vengeance de lui
  rationale: La formulation conserve l’idée hébraïque de prendre sa vengeance de quelqu’un, dans un registre grave et naturel.
