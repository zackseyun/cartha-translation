translation_notes:
  register: Français international moderne, digne et oralement fluide. Le parallélisme des paroles hostiles est conservé par les citations directes. « Ceux qui étaient en paix avec moi » évite de surinterpréter l’expression comme une amitié profonde, et les notes maintiennent les ambiguïtés lexicales réelles.
