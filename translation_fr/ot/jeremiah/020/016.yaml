language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֙ הָ/אִ֣ישׁ הַ/ה֔וּא כֶּֽ/עָרִ֛ים אֲשֶׁר הָפַ֥ךְ יְהוָ֖ה וְ/לֹ֣א נִחָ֑ם וְ/שָׁמַ֤ע זְעָקָה֙ בַּ/בֹּ֔קֶר וּ/תְרוּעָ֖ה בְּ/עֵ֥ת צָהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/016.yaml
  text: Let that man be like the cities that Yahweh overthrew without relenting[b][a], and let him hear a cry in the morning and a battle shout at the time of noon.
translation:
  language: fr
  text: Que cet homme soit comme les villes que Yahweh a renversées sans se raviser[a], et qu’il entende un cri le matin et un cri de guerre à l’heure de midi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation évoque probablement les villes que Yahweh a renversées lors de son jugement, notamment Sodome et Gomorrhe.
    reason: cross_reference
  - marker: b
    text: Ou « un signal d’alarme » ou « une sonnerie de trompette » pour « un cri de guerre » (hébreu terouʿah).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Que … soit
  rationale: Dans le contexte de cette malédiction, la forme exprime un souhait imprécatoire plutôt qu’un simple futur. « Que … soit » restitue naturellement cette valeur en français.
- source_word: הָאִישׁ הַהוּא
  choice: cet homme
  rationale: Le démonstratif désigne avec précision et distance l’homme mentionné au verset précédent; le masculin singulier est conservé.
- source_word: כֶּעָרִים
  choice: comme les villes
  rationale: La préposition כְּ marque la comparaison, et la relative qui suit détermine les villes en question.
- source_word: אֲשֶׁר הָפַךְ יְהוָה
  choice: que Yahweh a renversées
  rationale: הפך évoque ici le renversement catastrophique de villes sous le jugement divin, probablement en écho à Sodome et Gomorrhe. « Renversées » conserve cette image sans la réduire au terme général « détruites ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le distinguer d’un titre tel que « le Seigneur ».
- source_word: וְלֹא נִחָם
  choice: sans se raviser
  rationale: נחם indique ici que Yahweh ne revient pas sur le jugement prononcé. « Sans se raviser » exprime l’absence de revirement sans suggérer un repentir moral de Dieu.
- source_word: וְשָׁמַע
  choice: et qu’il entende
  rationale: La tournure poursuit la valeur imprécatoire du début du verset.
- source_word: זְעָקָה
  choice: un cri
  rationale: Le nom désigne un cri de détresse; « un cri » reste naturel et ne précise pas davantage que l’hébreu.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Expression temporelle française courante correspondant directement à l’hébreu.
- source_word: וּתְרוּעָה
  choice: un cri de guerre
  rationale: תְּרוּעָה peut désigner une clameur guerrière, un signal d’alarme ou une sonnerie. Dans ce contexte de catastrophe violente, « cri de guerre » convient, tandis que les autres possibilités sont signalées en note.
- source_word: בְּעֵת צָהֳרָיִם
  choice: à l’heure de midi
  rationale: Cette formulation conserve la structure plus développée de l’hébreu, littéralement « au temps de midi », tout en restant idiomatique en français.
theological_decisions:
- issue: Rendre l’absence de revirement de Yahweh sans suggérer une faute morale de sa part
  choice: sans se raviser
  alternative: sans regretter / sans se repentir
  rationale: Le contexte porte sur la mise à exécution irrévocable d’un jugement. « Se raviser » conserve l’idée contextuelle de נחם sans faire entendre que Dieu se repentirait d’une faute.
- issue: Identifier les villes évoquées sans rendre implicite une référence qui demeure allusive
  choice: conserver « les villes » dans le texte et expliquer l’écho probable en note
  alternative: nommer Sodome et Gomorrhe dans le texte
  rationale: L’hébreu ne nomme pas les villes. La note peut indiquer l’allusion probable sans transformer cette probabilité en identification explicite.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe en « Que… » maintient le ton solennel de la malédiction; « à l’heure de midi » conserve l’expression temporelle développée de l’hébreu sans lourdeur excessive.
