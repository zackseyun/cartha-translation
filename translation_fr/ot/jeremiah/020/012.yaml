source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ בֹּחֵ֣ן צַדִּ֔יק רֹאֶ֥ה כְלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/012.yaml
  text: But you[a], O Yahweh of Armies, who test the righteous, who see the kidneys and the heart, let me see your vengeance on them[b], for to you I have revealed my case.
translation:
  language: fr
  text: Mais toi, Yahweh des armées, qui mets le juste à l’épreuve et qui vois les reins et le cœur[a], que je voie ta vengeance contre eux, car c’est à toi que j’ai exposé ma cause[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’anthropologie hébraïque, les reins et le cœur représentent les pensées, les motivations et les sentiments les plus profonds.
    reason: cultural_note
  - marker: b
    text: Ou « mon affaire », « mon différend ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Mais toi, Yahweh des armées
  rationale: Le waw prend ici une valeur contrastive naturelle en français. Le nom divin est transcrit « Yahweh », et צְבָאוֹת est rendu concrètement par « des armées ». L’ajout idiomatique de « toi » marque l’adresse directe sans modifier le référent.
- source_word: בֹּחֵן צַדִּיק
  choice: qui mets le juste à l’épreuve
  rationale: Le participe décrit l’action caractéristique et continue de Yahweh. « Mettre à l’épreuve » exprime l’examen éprouvant impliqué par בחן; צַדִּיק est conservé au singulier représentatif.
- source_word: רֹאֶה כְלָיוֹת וָלֵב
  choice: qui vois les reins et le cœur
  rationale: La formulation conserve l’image anthropologique concrète de l’hébreu, où les reins et le cœur représentent la vie intérieure profonde.
- source_word: אֶרְאֶה
  choice: que je voie
  rationale: 'L’imparfait hébreu de première personne a ici une nuance volitive: Jérémie exprime le souhait de voir l’intervention de Dieu.'
- source_word: נִקְמָתְךָ מֵהֶם
  choice: la vengeance que tu exerceras contre eux
  rationale: Cette formulation française rend naturellement le possessif et la relation exprimée par מִן, tout en maintenant la force judiciaire et punitive de נְקָמָה.
- source_word: אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: c’est à toi que j’ai exposé ma cause
  rationale: La tournure emphatique préserve la mise en relief de « à toi ». « Exposer ma cause » rend l’idée de dévoiler et présenter son affaire à Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; sa transcription conserve le nom propre d’alliance au lieu de le remplacer par un titre.
- issue: Image anthropologique de כְלָיוֹת וָלֵב
  choice: les reins et le cœur
  alternative: les pensées et les sentiments les plus profonds
  rationale: Le maintien de l’image corporelle respecte la texture et l’anthropologie du texte hébreu; la note en explicite le sens culturel sans l’aplatir dans le texte principal.
- issue: Portée de נִקְמָה
  choice: vengeance
  alternative: rétribution ou justification
  rationale: « Vengeance » conserve la force du terme hébreu et la tension de la demande du prophète, sans l’adoucir en simple justification.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la forme d’une adresse solennelle et d’une requête, tout en évitant les archaïsmes. Les images concrètes et la tension théologique du texte hébreu sont maintenues.
