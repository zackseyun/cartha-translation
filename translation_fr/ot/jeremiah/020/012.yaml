  source_fidelity: Le texte rend fidèlement l’adresse à Yahweh, l’examen du juste, l’image des « reins et du cœur » et l’exposé de la cause. Toutefois, « la vengeance que tu exerceras contre eux » explicite le possessif par une relative au futur, alors que l’hébreu emploie simplement le nom « ta vengeance » dans une requête volitive. Une formulation nominale directe conserve mieux la concision et n’ajoute pas de temporalité grammaticale.
  naturalness: Le français est naturel, moderne et d’un registre approprié. « Que je voie ta vengeance contre eux » est à la fois idiomatique, solennel et plus proche de la syntaxe source que la périphrase au futur.
  terminology: « Yahweh des armées », « mettre à l’épreuve », « le juste », « les reins et le cœur » et « ma cause » sont des choix exacts et cohérents. L’image corporelle est utilement conservée; la note doit expliquer son sens culturel sans présenter comme « littérale » une expression déjà donnée littéralement dans le texte.
