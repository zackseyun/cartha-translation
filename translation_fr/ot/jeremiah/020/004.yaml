  text: כִּ֣י כֹ֣ה אָמַ֣ר יְהוָ֡ה הִנְ/נִי֩ נֹתֶנְ/ךָ֨ לְ/מָג֜וֹר לְ/ךָ֣ וּ/לְ/כָל אֹהֲבֶ֗י/ךָ וְ/נָֽפְל֛וּ בְּ/חֶ֥רֶב אֹיְבֵי/הֶ֖ם וְ/עֵינֶ֣י/ךָ רֹא֑וֹת וְ/אֶת כָּל יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/הִגְלָ֥/ם בָּבֶ֖לָ/ה וְ/הִכָּ֥/ם בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/004.yaml
  text: 'For thus says Yahweh: Behold[a], I am making you a terror to yourself and to all your loved ones, and they will fall by the sword of their enemies while your eyes look on. And I will give all Judah into the hand of the king of Babylon[c][b], and he will carry them away to Babylon and strike them with the sword.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh : « Je vais faire de toi un sujet d’effroi pour toi-même et pour tous ceux qui t’aiment[a]. Ils tomberont sous l’épée de leurs ennemis, et tu le verras de tes propres yeux. Je livrerai tout Juda au roi de Babylone : il les déportera à Babylone[b] et les frappera de l’épée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « sujet d’effroi » reprend le mot hébreu magor, « effroi » ou « terreur », qui fait écho au nom donné à Pashhour dans le contexte : « Effroi de tous côtés ».'
    reason: cross_reference
  - marker: b
    text: 'Ou : « il les emmènera en exil à Babylone ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הִנְנִי נֹתֶנְךָ לְמָגוֹר
  choice: Je vais faire de toi un sujet d’effroi
  rationale: Rend naturellement l’annonce imminente et l’emploi causatif idiomatique de נתן avec מָגוֹר, tout en conservant la notion d’effroi.
- source_word: לְךָ
  choice: pour toi-même
  rationale: 'Conserve la portée réflexive : Pashhour deviendra lui-même saisi d’effroi ou source d’effroi pour lui-même.'
- source_word: אֹהֲבֶיךָ
  choice: tous ceux qui t’aiment
  rationale: Traduction directe et suffisamment large pour englober proches, amis et alliés sans introduire une nuance romantique.
- source_word: וְנָפְלוּ בְּחֶרֶב אֹיְבֵיהֶם
  choice: Ils tomberont sous l’épée de leurs ennemis
  rationale: Expression française naturelle qui conserve l’image hébraïque de la chute par l’épée.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: tu le verras de tes propres yeux
  rationale: Exprime clairement l’insistance hébraïque sur le fait que Pashhour sera témoin personnel de leur mort.
- source_word: אֶתֵּן בְּיַד
  choice: Je livrerai ... au
  rationale: Équivalent français idiomatique de la remise au pouvoir d’un autre, sans calquer inutilement « dans la main de ».
- source_word: וְהִגְלָם בָּבֶלָה
  choice: il les déportera à Babylone
  rationale: Rend précisément la forme causative de גלה, qui désigne ici l’envoi forcé en exil.
- source_word: וְהִכָּם בֶּחָרֶב
  choice: les frappera de l’épée
  rationale: Reste proche de נכה, dont le sens est plus large que « tuer », tout en laissant au contexte sa violence manifeste.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin; la translittération le préserve sans le remplacer par un titre.
- issue: Portée de לְמָגוֹר appliqué à Pashhour
  choice: un sujet d’effroi pour toi-même
  alternative: une terreur pour toi-même
  rationale: La formulation conserve l’idée que Pashhour sera associé à l’effroi jusque pour lui-même, sans importer dans le corps du verset toute la formule « Effroi de tous côtés » donnée par le contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le discours prophétique garde sa solennité sans archaïsmes; les idiomes hébreux sont rendus naturellement, tandis que le jeu contextuel sur מָגוֹר est signalé en note.
