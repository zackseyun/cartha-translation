lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: Pourquoi donc
  rationale: « Pourquoi » rend la question directe, et « donc » restitue naturellement l’insistance ajoutée par זֶּה.
- source_word: מֵרֶחֶם יָצָאתִי
  choice: suis-je sorti du ventre
  rationale: Cette formulation conserve l’image concrète de la sortie du ventre, plutôt que de la remplacer par le plus interprétatif « suis-je né ».
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: Le sens premier est « voir »; dans cette lamentation, l’idée d’éprouver reste naturellement perceptible sans être explicitée.
- source_word: עָמָל
  choice: la peine
  rationale: « Peine » peut évoquer à la fois l’épreuve, la misère et le labeur pénible, ce qui convient à l’étendue sémantique du terme hébreu.
- source_word: יָגוֹן
  choice: le chagrin
  rationale: « Chagrin » exprime clairement la souffrance intérieure et forme en français une paire naturelle avec « peine ».
- source_word: וַיִּכְלוּ ... יָמָי
  choice: pour que mes jours s’achèvent
  rationale: La tournure garde « mes jours » comme sujet et exprime leur arrivée à leur terme dans un français naturel; le lien final avec la question est rendu explicitement pour assurer la fluidité.
- source_word: בְּבֹשֶׁת
  choice: dans la honte
  rationale: Traduction directe qui conserve le caractère accablant de la conclusion.
