  naturalness: Le français est globalement moderne et digne. La coordination de « pour voir » avec « pour que » est toutefois un peu lourde et, surtout, sémantiquement orientée. Une proposition coordonnée sans « pour que » est plus naturelle et plus proche du mouvement de la plainte.
