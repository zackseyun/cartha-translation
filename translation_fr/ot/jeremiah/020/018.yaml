  yaml_path: translation/ot/jeremiah/020/018.yaml
  text: Why did I come out from the womb to see trouble and sorrow[b][a], and for my days to end in shame?
translation:
  language: fr
  text: Pourquoi donc suis-je sorti du ventre pour voir la peine et le chagrin[a], et mes jours s’achèvent dans la honte[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fatigue et la douleur ».
    reason: lexical_alternative
