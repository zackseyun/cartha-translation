    issue: Nuance de contrainte insuffisamment exprimée dans « vous partirez en captivité »
    rationale: Le contexte et l’expression hébraïque impliquent que Pashhour et les habitants de sa maison seront emmenés captifs. « Partir » seul peut laisser entendre un déplacement volontaire; « être emmenés en captivité » rend cette dimension sans modifier le sens.
