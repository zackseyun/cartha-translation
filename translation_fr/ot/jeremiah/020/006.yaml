source:
  edition: WLC
  text: וְ/אַתָּ֣ה פַשְׁח֗וּר וְ/כֹל֙ יֹשְׁבֵ֣י בֵיתֶ֔/ךָ תֵּלְכ֖וּ בַּ/שֶּׁ֑בִי וּ/בָבֶ֣ל תָּב֗וֹא וְ/שָׁ֤ם תָּמוּת֙ וְ/שָׁ֣ם תִּקָּבֵ֔ר אַתָּה֙ וְ/כָל אֹ֣הֲבֶ֔י/ךָ אֲשֶׁר נִבֵּ֥אתָ לָ/הֶ֖ם בַּ/שָּֽׁקֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/006.yaml
  text: And you[a], Pashhur, and all who live in your house will go into captivity; and you will come to Babylon, and there you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.
translation:
  language: fr
  text: Et toi, Pashhour, ainsi que tous ceux qui vivent dans ta maison, vous serez emmenés en captivité. Tu arriveras à Babylone ; là, tu mourras et là, tu seras enterré, toi et tous ceux qui t’aiment, à qui tu as prophétisé faussement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à qui tu as prophétisé le mensonge » (ou « des mensonges »).'
    reason: Alternative lexicale reflétant la construction hébraïque בַּשָּׁקֶר, qui peut être rendue soit adverbialement (« faussement »), soit par un nom (« le mensonge/des mensonges »).
lexical_decisions:
- source_word: יֹשְׁבֵי בֵיתֶךָ
  choice: tous ceux qui vivent dans ta maison
  rationale: Cette formulation rend naturellement le participe « ceux qui habitent » tout en maintenant la portée concrète de « ta maison », sans réduire nécessairement le groupe à la famille proche.
- source_word: תֵּלְכוּ בַּשֶּׁבִי
  choice: vous partirez en captivité
  rationale: L’expression hébraïque désigne le fait d’être emmené comme captif. « En captivité » conserve cette idée plus précisément que le seul terme « exil ».
- source_word: וּבָבֶל תָּבוֹא
  choice: tu arriveras à Babylone
  rationale: Le verbe בוא signifie venir, arriver ou entrer. « Tu arriveras à Babylone » est naturel en français et conserve le mouvement vers la destination sans imposer un point de vue déictique artificiel.
- source_word: וְשָׁם תָּמוּת וְשָׁם תִּקָּבֵר
  choice: là, tu mourras et là, tu seras enterré
  rationale: La répétition de « là » reproduit l’insistance de l’hébreu sur le lieu où le jugement s’accomplira.
- source_word: אֹהֲבֶיךָ
  choice: tous ceux qui t’aiment
  rationale: Le participe désigne littéralement ceux qui aiment Pashhour. Cette traduction reste plus large et plus fidèle que « tes amis », tout en évitant les connotations trompeuses de « tes amants ».
- source_word: נִבֵּאתָ לָהֶם בַּשָּׁקֶר
  choice: à qui tu as prophétisé faussement
  rationale: La formulation française exprime clairement la fausseté de la prophétie sans affirmer davantage que le texte sur l’intention subjective de Pashhour.
theological_decisions:
- issue: Nature de la faute de Pashhour dans son activité prophétique
  choice: à qui tu as prophétisé faussement
  alternative: à qui tu as prophétisé le mensonge
  rationale: Le texte condamne la fausseté de son message prophétique. La traduction principale préserve cette accusation sans trancher explicitement la question de son intention personnelle ; la note conserve la possibilité d’une formulation nominale plus forte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passage du pluriel « vous partirez » au singulier « tu arriveras » suit exactement le changement de nombre du texte hébreu. La répétition de « là » est volontairement conservée.
