source:
  edition: WLC
  text: אֲשֶׁ֥ר לֹא מוֹתְתַ֖/נִי מֵ/רָ֑חֶם וַ/תְּהִי לִ֤/י אִמִּ/י֙ קִבְרִ֔/י וְ/רַחְמָ֖/הֿ הֲרַ֥ת עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/017.yaml
  text: because he did not kill me from the womb[a], so that my mother would have been my grave[c][b], and her womb forever pregnant.
translation:
  language: fr
  text: 'parce qu’il ne m’a pas fait mourir dès le ventre maternel[a] : ma mère aurait alors été mon tombeau[b], et sa matrice serait restée enceinte pour toujours[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « depuis le ventre maternel » ou « à partir du ventre maternel ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu juxtapose « ma mère » et « mon tombeau » : s’il était mort avant de naître, sa mère aurait été le lieu de sa sépulture.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « et sa matrice, enceinte pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: parce que
  rationale: Dans le contexte de la malédiction prononcée aux versets 14–18, le relatif introduit ici la raison de la plainte; « parce que » rend naturellement cette valeur discursive.
- source_word: מוֹתְתַנִי
  choice: il ne m’a pas fait mourir
  rationale: La forme causative avec suffixe de première personne est transitive. « Faire mourir » garde cette nuance sans suggérer simplement qu’il aurait dû laisser l’enfant mourir.
- source_word: מֵרָחֶם
  choice: dès le sein maternel
  rationale: La préposition marque le point de départ. « Dès le sein maternel » conserve ce mouvement tout en restant idiomatique en français; la note signale la traduction plus formelle.
- source_word: וַתְּהִי לִי
  choice: aurait ainsi été
  rationale: Le contexte irréel de la lamentation appelle le conditionnel passé en français et exprime la conséquence souhaitée rétrospectivement.
- source_word: אִמִּי קִבְרִי
  choice: ma mère aurait été mon tombeau
  rationale: La juxtaposition saisissante de « ma mère » et « mon tombeau » est maintenue sans expliciter « le sein de ma mère » dans le texte.
- source_word: וְרַחְמָהּ
  choice: et son sein
  rationale: Le sens anatomique est imposé par le contexte de la grossesse et de la naissance. « Sein » est digne et naturel ici.
- source_word: הֲרַת עוֹלָם
  choice: serait resté enceint pour toujours
  rationale: Cette formulation exprime un état de grossesse sans fin et concorde avec la syntaxe contrefactuelle du membre précédent.
theological_decisions:
- issue: Syntaxe de la lamentation contrefactuelle
  choice: 'Employer le conditionnel passé : « ma mère aurait ainsi été mon tombeau » et « son sein serait resté… »'
  alternative: 'Traduire comme un résultat au passé : « ma mère devint mon tombeau »'
  rationale: Le contexte exprime le regret de ne pas être mort avant de naître. Le conditionnel communique cette irréalité en français sans éliminer la violence ni la tension de la plainte.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset garde la métaphore brutale de la mère devenue tombeau et rend explicitement, par le conditionnel, la lamentation irréelle suggérée par le contexte.
