  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּצֵ֥א פַשְׁח֛וּר אֶֽת יִרְמְיָ֖הוּ מִן הַ/מַּהְפָּ֑כֶת וַ/יֹּ֨אמֶר אֵלָ֜י/ו יִרְמְיָ֗הוּ לֹ֤א פַשְׁחוּר֙ קָרָ֤א יְהוָה֙ שְׁמֶ֔/ךָ כִּ֖י אִם מָג֥וֹר מִ/סָּבִֽיב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/003.yaml
  text: And it happened the next day[a], when Pashhur brought Jeremiah out of the stocks, that Jeremiah said to him, “Yahweh has not called your name Pashhur, but Terror on Every Side.”
translation:
  language: fr
  text: 'Le lendemain, Pashehour fit sortir Jérémie du carcan. Jérémie lui dit : « Yahweh ne t’a pas donné le nom de Pashehour, mais celui de “Terreur de tous côtés”[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Magor-Missabib », expression qui signifie « terreur de tous côtés » ou « terreur tout autour ».'
    reason: La note conserve la forme hébraïque du nouveau nom et indique l’autre rendu idiomatique possible.
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Le lendemain
  rationale: Cette expression temporelle désigne le jour suivant; « le lendemain » est naturel et précis en français.
- source_word: וַיֹּצֵא ... אֶת יִרְמְיָהוּ מִן הַמַּהְפָּכֶת
  choice: Pashhour fit sortir Jérémie du carcan
  rationale: La forme causative de יצא signifie ici « faire sortir ». Cette formulation suit de près la structure hébraïque sans présumer plus explicitement une libération définitive.
- source_word: הַמַּהְפָּכֶת
  choice: le carcan
  rationale: Le terme désigne un dispositif de contrainte et de châtiment qui immobilisait vraisemblablement le prisonnier dans une position pénible. « Carcan » est compréhensible en français et évite d’identifier trop précisément sa forme.
- source_word: קָרָא ... שְׁמֶךָ
  choice: ne t’a pas donné le nom de
  rationale: L’idiome hébraïque porte explicitement sur l’attribution d’un nom. Cette tournure française conserve la force de la déclaration divine de changement de nom.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte source.
- source_word: כִּי אִם
  choice: mais celui de
  rationale: Après la négation, cette construction introduit le nom opposé; la formulation française rend naturellement le contraste « non pas… mais… ».
- source_word: מָגוֹר מִסָּבִיב
  choice: Terreur de tous côtés
  rationale: Cette expression récurrente chez Jérémie évoque une terreur qui environne la personne de toutes parts. Les majuscules et les guillemets signalent qu’elle devient ici un nom attribué à Pashhour.
- source_word: פַשְׁחוּר
  choice: Pashhour
  rationale: Translittération française usuelle du nom propre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. Le rendre comme un nom propre préserve la distinction entre le nom divin et un titre.
- issue: Nature de la déclaration sur le nom de Pashhour
  choice: Yahweh ne t’a pas donné le nom de Pashhour, mais celui de « Terreur de tous côtés »
  alternative: On ne t’appellera plus Pashhour, mais Terreur de tous côtés
  rationale: La traduction maintient Yahweh comme sujet explicite de l’attribution du nom et évite de transformer la parole en simple prédiction impersonnelle.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été divisée en deux phrases pour une lecture naturelle. « Carcan » garde l’idée d’un instrument de contrainte sans imposer une reconstitution technique incertaine; le nouveau nom est mis entre guillemets pour rendre sa fonction claire.
