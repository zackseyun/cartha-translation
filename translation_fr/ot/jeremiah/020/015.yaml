  text: אָר֣וּר הָ/אִ֗ישׁ אֲשֶׁ֨ר בִּשַּׂ֤ר אֶת אָבִ/י֙ לֵ/אמֹ֔ר יֻֽלַּד לְ/ךָ֖ בֵּ֣ן זָכָ֑ר שַׂמֵּ֖חַ שִׂמֳּחָֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/015.yaml
  text: Cursed be the man who brought my father the news[a], saying[b], “A son has been born to you,” making him very glad.
translation:
  language: fr
  text: 'Maudit soit l’homme qui a annoncé à mon père : « Un fils[a] t’est né ! », et qui l’a comblé de joie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un fils, un mâle » (c’est-à-dire un enfant de sexe masculin).'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu associe un infinitif absolu à un verbe de même racine pour renforcer l’idée : cet homme a vivement réjoui le père, ou l’a comblé de joie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: L’adjectif prédicatif a ici une valeur imprécatoire. « Maudit soit » restitue directement la dénonciation de Jérémie dans un français digne et naturel.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le nom défini désigne le messager précis dont il est question.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif introduit la proposition qui caractérise cet homme.
- source_word: בִּשַּׂר
  choice: a annoncé
  rationale: Le verbe désigne l’annonce d’une nouvelle, souvent heureuse. Ici, le contenu de l’annonce suffit à en montrer le caractère joyeux, sans qu’il soit nécessaire d’ajouter « bonne ».
- source_word: אֶת אָבִי
  choice: à mon père
  rationale: Le père de Jérémie est le destinataire de l’annonce. Le français construit naturellement « annoncer » avec « à », même si l’hébreu marque grammaticalement un objet direct.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit naturellement en français les paroles rapportées et remplit la fonction de la formule hébraïque « en disant » sans l’alourdir.
- source_word: יֻלַּד לְךָ
  choice: t’est né
  rationale: Le passif de ילד accompagné du datif est rendu par la tournure française consacrée pour annoncer une naissance.
- source_word: בֵּן זָכָר
  choice: Un fils
  rationale: L’expression signifie littéralement « un fils, un mâle ». En français, « fils » indique déjà le sexe masculin; la formulation complète est donc signalée en note.
- source_word: שַׂמֵּחַ שִׂמֳּחָהוּ
  choice: le remplissant d’une grande joie
  rationale: L’infinitif absolu associé à un verbe de même racine intensifie l’action. Cette tournure française exprime à la fois la joie causée au père et son intensité.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La tournure « t’est né » conserve la forme traditionnelle de l’annonce d’une naissance tout en restant claire. La structure imprécatoire et l’intensité émotionnelle du texte hébreu sont préservées.
