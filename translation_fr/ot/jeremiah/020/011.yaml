id: JER.20.11
reference: Jeremiah 20:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אוֹתִ/י֙ כְּ/גִבּ֣וֹר עָרִ֔יץ עַל כֵּ֛ן רֹדְפַ֥/י יִכָּשְׁל֖וּ וְ/לֹ֣א יֻכָ֑לוּ בֹּ֤שׁוּ מְאֹד֙ כִּֽי לֹ֣א הִשְׂכִּ֔ילוּ כְּלִמַּ֥ת עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/011.yaml
  text: But Yahweh is with me like a mighty warrior[a]; therefore my persecutors will stumble and will not prevail. They will be utterly ashamed, because they have not acted wisely[c][b]; their everlasting disgrace will not be forgotten.
translation:
  language: fr
  text: Mais Yahweh est avec moi comme un guerrier redoutable[a] ; c’est pourquoi ceux qui me persécutent[b] trébucheront et ne l’emporteront pas. Ils seront profondément humiliés, car ils n’ont pas agi avec discernement[c] ; leur honte perpétuelle ne sera pas oubliée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme un guerrier puissant et redoutable ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui me poursuivent ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « car ils n’ont pas compris » ; le verbe peut aussi évoquer le fait d’agir avec sagesse ou de réussir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Mais Yahweh
  rationale: Le waw marque ici le contraste avec la plainte précédente. Le nom divin est translittéré « Yahweh » afin de représenter directement le tétragramme.
- source_word: אוֹתִי
  choice: est avec moi
  rationale: Dans cette proposition nominale, la construction exprime naturellement la présence et le soutien de Yahweh auprès de Jérémie.
- source_word: כְגִבּוֹר עָרִיץ
  choice: comme un guerrier redoutable
  rationale: גִּבּוֹר désigne un guerrier puissant ou un champion, tandis que עָרִיץ souligne son caractère redoutable et irrésistible. La traduction conserve les deux nuances.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette locution introduit la conséquence de la présence protectrice de Yahweh.
- source_word: רֹדְפַי
  choice: ceux qui me persécutent
  rationale: רדף peut signifier poursuivre ou persécuter. Le contexte d’hostilité envers Jérémie favorise « persécutent », tandis que le sens plus concret est signalé en note.
- source_word: יִכָּשְׁלוּ
  choice: trébucheront
  rationale: Le verbe conserve l’image d’un faux pas ou d’un échec sans préciser davantage la forme de leur défaite.
- source_word: וְלֹא יֻכָלוּ
  choice: et ne l’emporteront pas
  rationale: Littéralement, ils « ne pourront pas » ; dans ce contexte conflictuel, l’expression signifie qu’ils ne réussiront pas à vaincre Jérémie.
- source_word: בֹּשׁוּ מְאֹד
  choice: Ils seront profondément humiliés
  rationale: בוש exprime la honte ou la confusion, et מְאֹד l’intensifie. Le futur français s’accorde avec la série de conséquences annoncées dans le verset.
- source_word: כִּי לֹא הִשְׂכִּילוּ
  choice: car ils n’ont pas agi avec discernement
  rationale: Le hifil de שׂכל peut évoquer la compréhension, une conduite avisée ou la réussite. « Agi avec discernement » rend ici la dimension pratique sans réduire le terme à la seule compréhension intellectuelle.
- source_word: כְּלִמַּת עוֹלָם
  choice: leur déshonneur éternel
  rationale: כְּלִמָּה désigne la honte ou le déshonneur, et עוֹלָם indique ici une durée perpétuelle.
- source_word: לֹא תִשָּׁכֵחַ
  choice: ne sera pas oublié
  rationale: La forme féminine singulière renvoie au déshonneur mentionné juste avant ; la tournure passive est conservée.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » préserve le nom personnel d’alliance sans le remplacer par un titre.
- issue: Nature du soutien divin dans אוֹתִי
  choice: Yahweh est avec moi
  alternative: Yahweh est pour moi
  rationale: La proposition affirme d’abord la présence secourable de Yahweh. « Avec moi » respecte cette image sans expliciter excessivement la manière dont il intervient.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique est maintenu par deux phrases équilibrées ; le vocabulaire martial et les images de chute, de honte et de mémoire durable sont conservés.
