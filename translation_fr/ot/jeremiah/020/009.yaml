  naturalness: Le français révisé reste moderne, clair et digne. « Je m’épuise à le contenir, et je ne peux pas » conserve l’ellipse finale expressive sans la tournure plus relâchée « je n’y arrive pas ».
  terminology: « faire mention de », « parler en son nom », « feu ardent » et « enfermé dans mes os » rendent fidèlement les expressions et images hébraïques. Les pronoms et le sujet implicite sont maintenus sans explicitation confessionnelle.
