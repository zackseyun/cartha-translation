source:
  edition: WLC
  text: וְ/אָמַרְתִּ֣י לֹֽא אֶזְכְּרֶ֗/נּוּ וְ/לֹֽא אֲדַבֵּ֥ר עוֹד֙ בִּ/שְׁמ֔/וֹ וְ/הָיָ֤ה בְ/לִבִּ/י֙ כְּ/אֵ֣שׁ בֹּעֶ֔רֶת עָצֻ֖ר בְּ/עַצְמֹתָ֑/י וְ/נִלְאֵ֥יתִי כַּֽלְכֵ֖ל וְ/לֹ֥א אוּכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/009.yaml
  text: If I say[a], “I will not mention him, or speak any longer in his name,” then in my heart it is like a burning fire, shut up in my bones; I grow weary of holding it in[c][b], and I cannot.
translation:
  language: fr
  text: 'Si je dis[a] : « Je ne ferai pas mention de lui et je ne parlerai plus en son nom[b] », alors, dans mon cœur, c’est comme un feu ardent, enfermé dans mes os. Je m’épuise à le contenir[c], et je ne peux pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si je dis : “Je ne me souviendrai pas de lui.” » Le verbe hébreu peut signifier « se souvenir » ou « mentionner »; ici, « mentionner » correspond mieux au parallèle avec le fait de parler.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire parler comme son représentant ou sous son autorité.
    reason: cultural_note
  - marker: c
    text: L’objet reste implicite en hébreu; il s’agit probablement du message du Seigneur ou de la force intérieure qui pousse Jérémie à le proclamer.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתִּי
  choice: Si je dis
  rationale: Bien que la forme soit littéralement « et j’ai dit », le contexte exprime une résolution envisagée ou répétée; la tournure conditionnelle rend naturellement cette délibération intérieure.
- source_word: אֶזְכְּרֶנּוּ
  choice: Je ne ferai plus mention de lui
  rationale: Le verbe זכר peut signifier « se souvenir » ou « mentionner ». Le sens verbal « mentionner » convient mieux au parallélisme avec « parler en son nom », tout en laissant l’autre possibilité en note.
- source_word: אֲדַבֵּר עוֹד בִּשְׁמוֹ
  choice: je ne parlerai plus en son nom
  rationale: La formulation conserve l’expression prophétique qui désigne le fait de parler comme représentant de quelqu’un ou sous son autorité.
- source_word: וְהָיָה בְלִבִּי
  choice: alors, dans mon cœur, c’est
  rationale: Le sujet masculin singulier reste implicite en hébreu. Le pronom démonstratif neutre français évite d’ajouter explicitement « sa parole » tout en assurant une phrase naturelle.
- source_word: כְּאֵשׁ בֹּעֶרֶת
  choice: comme un feu ardent
  rationale: Cette expression française actuelle conserve l’image concrète et l’intensité du feu qui brûle.
- source_word: עָצֻר בְּעַצְמֹתָי
  choice: enfermé dans mes os
  rationale: « Enfermé » exprime la contrainte ou le confinement indiqués par עצר et préserve la forte image corporelle du texte.
- source_word: וְנִלְאֵיתִי כַּלְכֵל
  choice: Je m’épuise à le contenir
  rationale: נלאיתי marque l’épuisement, tandis que כלכל évoque ici l’effort pour contenir ou retenir. La formulation française reste vive et intelligible.
- source_word: וְלֹא אוּכָל
  choice: mais je n’y arrive pas
  rationale: Le français explicite idiomatiquement l’incapacité sans préciser davantage l’objet implicite. « Mais » fait ressortir l’échec de l’effort de contention.
theological_decisions:
- issue: Référent des pronoms de troisième personne
  choice: Conserver « lui » et « son » dans le texte principal.
  alternative: Remplacer les pronoms par « l’Éternel » ou « le Seigneur ».
  rationale: Le contexte permet d’identifier le référent, mais l’hébreu emploie des pronoms. Les conserver évite d’ajouter un nom divin absent de ce verset.
- issue: Sujet implicite de l’image du feu
  choice: Employer « c’est comme un feu ardent » sans nommer explicitement ce qui brûle.
  alternative: Traduire « sa parole est dans mon cœur comme un feu ardent ».
  rationale: Le verbe hébreu a un sujet masculin singulier implicite; le message divin est vraisemblablement visé, mais il n’est pas nommé. La traduction préserve cette ambiguïté.
- issue: Objet implicite de l’effort pour contenir
  choice: Employer le pronom « le » et expliquer son référent probable en note.
  alternative: Préciser dans le texte « contenir sa parole » ou « retenir ce feu ».
  rationale: Le texte ne nomme pas explicitement l’objet. Une formulation pronominale conserve cette indétermination sans rendre le français obscur.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme conserve la progression de la résolution intérieure vers l’image corporelle du feu, puis vers l’épuisement et l’incapacité. Les pronoms et les éléments implicites de l’hébreu ne sont pas remplacés par des précisions théologiques dans le texte principal.
