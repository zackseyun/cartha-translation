id: JER.20.1
reference: Jeremiah 20:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּשְׁחוּר֙ בֶּן אִמֵּ֣ר הַ/כֹּהֵ֔ן וְ/הֽוּא פָקִ֥יד נָגִ֖יד בְּ/בֵ֣ית יְהוָ֑ה אֶֽת יִרְמְיָ֔הוּ נִבָּ֖א אֶת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/001.yaml
  text: Pashhur son of Immer the priest[a], who was chief officer in the house of Yahweh, heard Jeremiah prophesying these words.
translation:
  language: fr
  text: Le prêtre Pashhour, fils d’Immer, qui était le responsable en chef dans la maison de Yahweh[a], entendit Jérémie prophétiser ces paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le temple de Yahweh » ; littéralement : « dans la maison de Yahweh ».'
    reason: La « maison de Yahweh » désigne ici le temple, mais le texte hébreu emploie littéralement le mot « maison ».
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit
  rationale: Le verbe שׁמע fait avancer le récit et indique simplement que Pashhour entendit Jérémie, sans impliquer l’attention volontaire que pourrait suggérer « écouta ».
- source_word: פַּשְׁחוּר בֶּן אִמֵּר הַכֹּהֵן
  choice: Le prêtre Pashhour, fils d’Immer
  rationale: Cette formulation française rattache naturellement le titre sacerdotal à Pashhour, personnage principal de la proposition, tout en conservant le patronyme hébreu.
- source_word: וְהוּא פָקִיד נָגִיד
  choice: qui était le responsable en chef
  rationale: Les deux termes administratifs expriment ensemble une fonction officielle de surveillance et un rang supérieur. « Responsable en chef » en restitue le sens sans lourde redondance.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: La traduction conserve l’image littérale de la « maison », tout en signalant en note le sens contextuel de temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme un nom propre plutôt que remplacé par un titre.
- source_word: נִבָּא
  choice: prophétiser
  rationale: L’infinitif après « entendit » rend naturellement en français l’action prophétique en cours exprimée par le participe hébreu.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans ce contexte de proclamation prophétique, « paroles » exprime plus précisément le contenu verbal que « choses ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même. Sa translittération préserve cette distinction au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit écrit ; « responsable en chef » rend de façon accessible la combinaison de deux titres administratifs hébreux.
