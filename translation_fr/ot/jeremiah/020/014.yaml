id: JER.20.14
reference: Jeremiah 20:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָר֣וּר הַ/יּ֔וֹם אֲשֶׁ֥ר יֻלַּ֖דְתִּי בּ֑/וֹ י֛וֹם אֲשֶׁר יְלָדַ֥תְ/נִי אִמִּ֖/י אַל יְהִ֥י בָרֽוּךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/014.yaml
  text: Cursed be the day on which I was born[a]; the day my mother bore me[b], let it not be blessed.
translation:
  language: fr
  text: Maudit soit le jour où je suis né[a] ! Le jour où ma mère m’a mis au monde[b], qu’il ne soit pas béni !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Maudit soit le jour où l’on m’a mis au monde. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le jour où ma mère m’a donné naissance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: L’adjectif passif de ארר a ici une valeur imprécatoire. « Maudit soit » restitue directement la force de la lamentation et forme un contraste net avec « béni ».
- source_word: הַיּוֹם
  choice: le jour
  rationale: Le nom défini désigne le jour précis de la naissance du locuteur.
- source_word: אֲשֶׁר ... בּוֹ
  choice: où
  rationale: Le relatif et la reprise prépositionnelle renvoient au jour. En français moderne, « où » exprime naturellement ce rapport temporel sans traduire בּוֹ de façon lourde.
- source_word: יֻלַּדְתִּי
  choice: je suis né
  rationale: Le passif de ילד signifie ici que le locuteur est venu au monde. « Je suis né » est la formulation française courante et fidèle.
- source_word: יוֹם
  choice: Le jour
  rationale: La répétition reprend le même jour et maintient le parallélisme emphatique de l’hébreu.
- source_word: יְלָדַתְנִי אִמִּי
  choice: ma mère m’a mis au monde
  rationale: Cette expression française naturelle rend l’action maternelle concrète de ילד tout en conservant la solennité du verset.
- source_word: אַל יְהִי
  choice: qu’il ne soit pas
  rationale: Le jussif négatif exprime un souhait imprécatoire. « Qu’il ne soit pas » en conserve clairement la valeur volitive.
- source_word: בָרוּךְ
  choice: béni
  rationale: « Béni » préserve l’opposition lexicale et rhétorique avec « maudit ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme, l’imprécation et l’antithèse entre « maudit » et « béni » sont conservés. Les points d’exclamation rendent la vigueur émotionnelle de la lamentation sans ajouter de contenu doctrinal.
