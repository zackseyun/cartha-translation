source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה פַשְׁח֔וּר אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יִּתֵּ֨ן אֹת֜/וֹ עַל הַ/מַּהְפֶּ֗כֶת אֲשֶׁ֨ר בְּ/שַׁ֤עַר בִּנְיָמִן֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/002.yaml
  text: Then Pashhur struck Jeremiah the prophet and put him in the stocks that were at the upper Benjamin Gate[a], which was in the house of Yahweh.
translation:
  language: fr
  text: Alors Pashhour frappa le prophète Jérémie et le mit aux ceps[a], à la porte supérieure de Benjamin. Cette porte se trouvait dans la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « au chevalet » ou dans un autre dispositif de contrainte douloureuse ; la forme exacte de la מַהְפֶּכֶת est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: frappa
  rationale: Le verbe נכה signifie couramment « frapper ». Ce choix naturel ne précise pas s’il s’agit d’un seul coup ou d’une série de coups, conformément à l’ambiguïté de l’hébreu.
- source_word: פַשְׁחוּר
  choice: Pashhour
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Conserve explicitement le titre apposé à Jérémie, tout en adoptant l’ordre le plus naturel en français.
- source_word: וַיִּתֵּן אֹתוֹ עַל
  choice: le mit aux
  rationale: Rend idiomatiquement l’action de placer Jérémie dans un dispositif de contrainte, sans reproduire mécaniquement la préposition hébraïque.
- source_word: הַמַּהְפֶּכֶת
  choice: les ceps
  rationale: « Ceps » désigne en français un instrument immobilisant le corps ou les membres et correspond à l’interprétation traditionnelle, mais la forme exacte du dispositif demeure incertaine; cette incertitude est signalée en note.
- source_word: שַׁעַר בִּנְיָמִן הָעֶלְיוֹן
  choice: la porte supérieure de Benjamin
  rationale: Rend le nom de la porte et l’adjectif הָעֶלְיוֹן sans décider si « supérieure » indique son emplacement ou sert de désignation officielle.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Préserve l’expression hébraïque « maison de Yahweh » plutôt que de l’expliciter par « temple », et rend le tétragramme comme un nom propre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve ici le nom divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative reste concise. « Maison de Yahweh » conserve l’image hébraïque; « ceps » est maintenu dans le texte avec une note pour éviter de masquer l’incertitude lexicale.
