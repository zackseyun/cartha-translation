source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה וּ/נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֣ל וְ/כָל חֵיל֡/וֹ וְ/כָל מַמְלְכ֣וֹת אֶרֶץ֩ מֶמְשֶׁ֨לֶת יָד֜/וֹ וְ/כָל הָ/עַמִּ֗ים נִלְחָמִ֧ים עַל יְרוּשָׁלִַ֛ם וְ/עַל כָּל עָרֶ֖י/הָ לֵ/אמֹֽר־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], when Nebuchadnezzar king of Babylon and all his army, and all the kingdoms of the earth under the dominion of his hand, and all the peoples, were fighting against Jerusalem and against all its cities, saying[b],
translation:
  language: fr
  text: 'La parole qui fut adressée à Jérémie de la part de Yahweh, alors que Nabuchodonosor[a], roi de Babylone, toute son armée, tous les royaumes de la terre[b] soumis au pouvoir de sa main et tous les peuples faisaient la guerre contre Jérusalem et contre toutes ses villes, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Nebucadretsar » ; « Nabuchodonosor » est la forme française traditionnelle.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous les royaumes du pays soumis au pouvoir de sa main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: La parole qui fut adressée à Jérémie
  rationale: Cette formulation française naturelle conserve la formule prophétique dans laquelle דָּבָר désigne une communication divine.
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: מֵאֵת marque la provenance, et « de la part de » convient à une parole transmise au prophète. Le nom divin est rendu directement par « Yahweh ».
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: La forme française traditionnelle et immédiatement reconnaissable est retenue dans le texte; la forme plus proche de l’hébreu est signalée en note.
- source_word: חֵילוֹ
  choice: toute son armée
  rationale: Dans le contexte du siège, חַיִל désigne clairement les forces militaires du roi.
- source_word: כָל מַמְלְכוֹת אֶרֶץ מֶמְשֶׁלֶת יָדוֹ
  choice: tous les royaumes de la terre placés sous son autorité
  rationale: La traduction exprime clairement la sujétion politique indiquée par מֶמְשֶׁלֶת יָדוֹ. « Terre » conserve l’ampleur géopolitique de אֶרֶץ, dont l’autre sens possible est indiqué en note.
- source_word: וְכָל הָעַמִּים
  choice: et tous les peuples
  rationale: Le pluriel « peuples » préserve la pluralité ethnique et politique exprimée par עַמִּים.
- source_word: נִלְחָמִים עַל
  choice: faisaient la guerre à
  rationale: Le participe décrit une action en cours; cette tournure est naturelle en français dans un contexte de siège.
- source_word: וְעַל כָּל עָרֶיהָ
  choice: et à toutes ses villes
  rationale: Le possessif féminin est conservé sans expliciter davantage le rapport entre Jérusalem et les villes qui lui sont rattachées.
- source_word: לֵאמֹר
  choice: 'Elle disait :'
  rationale: Cette phrase autonome évite une période française trop lourde et introduit clairement le discours divin du verset suivant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme. « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- issue: Portée de מַמְלְכוֹת אֶרֶץ
  choice: les royaumes de la terre
  alternative: les royaumes du pays
  rationale: Dans ce contexte impérial, « terre » rend la portée géopolitique large, tout en laissant ouverte en note la valeur plus locale possible de אֶרֶץ.
translation_notes:
  register: 'Français international moderne, digne et lisible. La longue construction hébraïque est allégée par une phrase finale (« Elle disait : »), tout en conservant la relation circonstancielle et la liste cumulative des forces assiégeantes.'
