source:
  edition: WLC
  text: לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֧ישׁ אֶת שִׁפְחָת֛/וֹ הָ/עִבְרִ֥י וְ/הָ/עִבְרִיָּ֖ה חָפְשִׁ֑ים לְ/בִלְתִּ֧י עֲבָד בָּ֛/ם בִּ/יהוּדִ֥י אָחִ֖י/הוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/009.yaml
  text: that each man should set free his male servant and each man his female servant[a], the Hebrew man and the Hebrew woman, so that no one should enslave a Jew, his brother, among them.
translation:
  language: fr
  text: que chacun libère son esclave et sa servante, l’Hébreu et l’Hébreuse, afin que nul parmi eux ne tienne en esclavage un Judéen, son frère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un Juif, son frère ». Le terme hébreu peut désigner un Juif au sens ethnoreligieux ou, dans ce contexte historique, plus précisément un Judéen.
    reason: alternative_reading
lexical_decisions:
- source_word: לְשַׁלַּח
  choice: libère
  rationale: Dans le contexte de l’affranchissement prévu par l’alliance, le verbe désigne la remise en liberté, et non un simple renvoi.
- source_word: עַבְדּוֹ וְשִׁפְחָתוֹ
  choice: son esclave et sa servante
  rationale: Les deux termes désignent ici des personnes en état de servitude et marquent explicitement le masculin et le féminin. « Esclave » et « servante » forment en français une paire naturelle, claire et digne, sans atténuer la réalité de l’asservissement.
- source_word: הָעִבְרִי וְהָעִבְרִיָּה
  choice: l’Hébreu et l’Hébreuse
  rationale: Les formes masculine et féminine sont conservées, puisqu’elles identifient respectivement l’homme et la femme réduits en servitude comme Hébreux.
- source_word: חָפְשִׁים
  choice: libère
  rationale: L’état de liberté exprimé par l’adjectif hébreu est rendu idiomatiquement en français par le verbe « libérer », déjà exigé par la construction de la phrase.
- source_word: לְבִלְתִּי עֲבָד בָּם
  choice: afin que personne ne réduise en esclavage
  rationale: La construction exprime le but de l’affranchissement. Dans ce contexte, עבד a le sens de faire servir ou de maintenir en servitude; « réduire en esclavage » explicite cette valeur sans suggérer un simple service volontaire.
- source_word: בִּיהוּדִי אָחִיהוּ אִישׁ
  choice: son frère judéen
  rationale: Cette formulation française naturelle conserve à la fois l’identité judéenne et le langage de fraternité solidaire. Le terme יהודי peut aussi être rendu par « Juif », possibilité signalée en note.
theological_decisions:
- issue: Désignation du statut de dépendance
  choice: Employer le vocabulaire de l’esclavage
  alternative: Employer seulement « serviteur » et « servante »
  rationale: Le passage porte sur un affranchissement réel; il ne faut donc pas adoucir le statut de servitude visé par le texte.
- issue: Sens de יהודי
  choice: « judéen » dans le texte principal
  alternative: « Juif »
  rationale: Dans le cadre historique de la fin du royaume de Juda, « Judéen » est précis, tandis que « Juif » demeure lexicalement possible. La note préserve cette ambiguïté réelle.
- issue: Marquage du genre
  choice: Conserver « l’Hébreu et l’Hébreuse »
  alternative: Employer une désignation collective non genrée
  rationale: L’hébreu distingue expressément les formes masculine et féminine; la traduction maintient cette distinction.
translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure subordonnée (« que chacun… »), comme dans le texte source, puisqu’elle poursuit la formulation de l’alliance commencée au verset précédent.
