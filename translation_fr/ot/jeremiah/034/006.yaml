  text: Then Jeremiah the prophet spoke all these words to Zedekiah king of Judah in Jerusalem.
translation:
  language: fr
  text: Alors le prophète Jérémie adressa toutes ces paroles à Sédécias, roi de Juda, à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … transmit
  rationale: Le waw consécutif fait progresser le récit. Dans ce contexte, דבר introduit la communication du message prophétique précédent ; « transmit » exprime naturellement en français le fait de communiquer l’ensemble de ces paroles.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: « Jérémie » est la forme française usuelle du nom, et le titre défini « le prophète » est conservé. Cet ordre est naturel en français moderne.
- source_word: אֶל צִדְקִיָּהוּ
  choice: à Sédécias
  rationale: La préposition marque ici le destinataire de la parole. « Sédécias » est la forme française traditionnelle et courante du nom royal.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le groupe construit est rendu directement. Après le nom propre en apposition, l’absence d’article est naturelle en français.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: Dans ce contexte, דְּבָרִים désigne le message prophétique formulé précédemment. « Paroles » en conserve la dimension verbale, tandis que « toutes » et « ces » rendent les deux précisions hébraïques.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition בְּ est ici locative. En français, on dit naturellement « à Jérusalem » ; la place finale maintient le cadre géographique de la scène.
