  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אוֹתָ/ם֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/020.yaml
  text: And I will give them into the hand of their enemies and into the hand of those who seek their life[c][b][a], and their dead bodies will become food for the birds of the sky and for the beasts of the earth.
translation:
  language: fr
  text: Je les livrerai au pouvoir de leurs ennemis et au pouvoir de ceux qui en veulent à leur vie[a]. Leurs cadavres serviront de nourriture aux oiseaux du ciel et aux bêtes de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui cherchent leur vie », c’est-à-dire ceux qui cherchent à les tuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָם בְּיַד
  choice: Je les livrerai au pouvoir de
  rationale: Avec בְּיַד, נתן exprime la remise de personnes sous l’autorité ou à la merci d’autrui. Cette formulation rend naturellement en français le sens de l’idiome hébreu.
- source_word: אֹיְבֵיהֶם
  choice: leurs ennemis
  rationale: Équivalent direct et naturel du terme hébreu.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: ceux qui en veulent à leur vie
  rationale: Cette expression française conserve l’image de la « vie » tout en communiquant clairement l’intention meurtrière de l’idiome hébreu.
- source_word: וְהָיְתָה נִבְלָתָם לְמַאֲכָל
  choice: Leurs cadavres serviront de nourriture
  rationale: נְבֵלָה désigne ici les corps morts; « cadavres » convient aux référents humains. « Serviront de nourriture » exprime naturellement l’état résultant marqué par היה avec le prédicat.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: aux oiseaux du ciel
  rationale: Rendu transparent de l’expression hébraïque, naturel en français biblique moderne.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: et aux bêtes de la terre
  rationale: « Bêtes » préserve le registre solennel et la dureté de l’image de jugement, tandis que « de la terre » maintient le parallélisme avec « du ciel ».
theological_decisions:
- issue: 'Image de jugement: des cadavres privés de sépulture et dévorés par les animaux'
  choice: Conserver sans atténuation l’image concrète des cadavres livrés aux oiseaux et aux bêtes
  alternative: Réduire le propos à la mort ou à la défaite aux mains des ennemis
  rationale: Le texte présente l’exposition déshonorante des morts comme partie intégrante du jugement. La formulation française maintient cette tension et cette violence sans les paraphraser.
translation_notes:
  register: Français international moderne, clair et digne. « Livrer au pouvoir de » évite un calque peu naturel de « donner dans la main de », tandis que « en vouloir à leur vie » conserve l’image hébraïque sous une forme idiomatique. Le vocabulaire concret et sévère du jugement est maintenu.
