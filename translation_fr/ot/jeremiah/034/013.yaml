  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָנֹכִ֗י כָּרַ֤תִּֽי בְרִית֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/י֨וֹם הוֹצִאִ֤/י אוֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בֵּ֥ית עֲבָדִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/013.yaml
  text: 'Thus says Yahweh, the God of Israel: I myself made a covenant with your fathers on the day I brought them out from the land of Egypt, from the house of servants, saying,'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, le Dieu d’Israël : C’est moi qui ai conclu une alliance[a] avec vos pères, le jour où je les ai fait sortir du pays d’Égypte, de la maison des esclaves[b], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « couper une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « de la maison de l’esclavage ». L’hébreu dit littéralement : « de la maison des esclaves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle dans un registre français digne et soutenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel au lieu de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction hébraïque et son identification d’alliance.
- source_word: אָנֹכִי כָּרַתִּי
  choice: C’est moi qui ai conclu
  rationale: La tournure clivée exprime naturellement en français la présence emphatique du pronom indépendant אָנֹכִי.
- source_word: כָּרַתִּי בְרִית
  choice: ai conclu une alliance
  rationale: « Conclure une alliance » est l’équivalent idiomatique français de l’expression hébraïque littérale « couper une alliance ».
- source_word: אֶת אֲבֹתֵיכֶם
  choice: avec vos pères
  rationale: Conserve la désignation masculine explicite du texte hébreu et le langage historique de l’alliance.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Reproduit la formulation temporelle sans l’alourdir.
- source_word: הוֹצִיאִי אוֹתָם
  choice: je les ai fait sortir
  rationale: Rend précisément le hiphil de יצא et préserve la formule caractéristique de l’Exode.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Conserve l’expression historique complète.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  rationale: Suit concrètement l’hébreu « maison des esclaves » sans atténuer la réalité de l’esclavage.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: Introduit la stipulation citée au verset suivant; les deux-points sont naturels en français avant un discours direct.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Préserve le nom personnel du Dieu d’Israël et sa portée dans le contexte de l’alliance.
- issue: Portée emphatique de אָנֹכִי
  choice: C’est moi qui ai conclu
  alternative: J’ai conclu
  rationale: Le pronom indépendant, ajouté à une forme verbale qui marque déjà la première personne, peut porter une emphase réelle; la tournure française la conserve sans excès.
- issue: Sens de עֲבָדִים dans la formule de l’Exode
  choice: esclaves
  alternative: serviteurs; esclavage
  rationale: Le contexte concerne la libération de l’asservissement en Égypte; « esclaves » garde cette réalité sociale concrète.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique reste soutenue; la syntaxe française conserve l’emphase de אָנֹכִי et la continuité de la phrase vers le verset suivant.
