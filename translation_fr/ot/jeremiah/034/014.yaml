  source_fidelity: 'Le sens du texte hébreu est globalement bien rendu : échéance de sept ans, valeur distributive de « chacun », frère hébreu vendu, six années de service, libération, puis reproche adressé aux pères. La forme française « qui aura été vendu à lui » est toutefois lourde et moins naturelle que « qui lui aura été vendu », sans différence de sens. La reprise au singulier (« tu ») est justifiée par le singulier distributif du texte source.'
  naturalness: Le registre est digne et accessible. « Qui lui aura été vendu » est idiomatique et évite l’enchaînement peu naturel « vendu à lui ». « Libre de chez toi » est compréhensible et conserve l’idée de séparation d’avec le maître ; la formulation est maintenue afin de ne pas ajouter « de ton service », absent de l’hébreu.
  terminology: « Frère hébreu », « servir » et « laisser partir libre » respectent le langage juridique et relationnel du verset sans atténuer la vente ni importer une qualification historique supplémentaire. Les notes préservent correctement l’ambiguïté possible du nifal de מכר.
