language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/קֵּ֣ץ שֶׁ֣בַע שָׁנִ֡ים תְּֽשַׁלְּח֡וּ אִישׁ֩ אֶת אָחִ֨י/ו הָ/עִבְרִ֜י אֲשֶֽׁר יִמָּכֵ֣ר לְ/ךָ֗ וַ/עֲבָֽדְ/ךָ֙ שֵׁ֣שׁ שָׁנִ֔ים וְ/שִׁלַּחְתּ֥/וֹ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ וְ/לֹֽא שָׁמְע֤וּ אֲבֽוֹתֵי/כֶם֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/014.yaml
  text: At the end of seven years[a], each of you shall send away his Hebrew brother who has been sold to you and has served you six years; you shall send him away free from you[c][b]. But your fathers did not listen to me or incline their ear.
translation:
  language: fr
  text: Au terme de sept ans[a], chacun de vous laissera partir son frère hébreu[b] qui lui aura été vendu[c] et l’aura servi pendant six ans ; tu le laisseras partir libre de chez toi. Mais vos pères ne m’ont pas écouté et n’ont pas prêté l’oreille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Après sept ans. » L’expression hébraïque peut désigner l’achèvement d’une période de sept ans.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « son compatriote hébreu » ou « son parent hébreu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui se sera vendu à lui » ; dans ce contexte juridique, la forme hébraïque peut être comprise au passif ou au sens réfléchi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: Au terme de sept ans
  rationale: Rend le repère temporel de façon naturelle tout en conservant l’idée d’achèvement d’une période de sept ans.
- source_word: תְּשַׁלְּחוּ אִישׁ
  choice: chacun de vous laissera partir
  rationale: « Chacun de vous » exprime la valeur distributive de אִישׁ, et « laisser partir » convient au sens de libération de שלח dans ce contexte juridique.
- source_word: אָחִיו הָעִבְרִי
  choice: son frère hébreu
  rationale: Conserve le langage masculin singulier et la force familiale et communautaire de אָח, sans décider s’il s’agit d’un frère biologique.
- source_word: אֲשֶׁר יִמָּכֵר לְךָ
  choice: qui aura été vendu à lui
  rationale: Le passif français reflète directement le nifal hébreu; la note signale la lecture réfléchie possible dans ce contexte juridique. « À lui » maintient l’accord distributif avec « chacun ».
- source_word: וַעֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: et l’aura servi pendant six ans
  rationale: Exprime naturellement en français l’accomplissement des six années de service précédant la libération.
- source_word: וְשִׁלַּחְתּוֹ חָפְשִׁי מֵעִמָּךְ
  choice: tu le laisseras partir libre de chez toi
  rationale: Reproduit la répétition de שלח et rend חָפְשִׁי ainsi que l’éloignement exprimé par מֵעִמָּךְ sans ajouter « service » au texte.
- source_word: וְלֹא שָׁמְעוּ אֲבוֹתֵיכֶם אֵלַי
  choice: Mais vos pères ne m’ont pas écouté
  rationale: Préserve la métaphore auditive de שמע et laisse subsister son implication d’obéissance.
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  choice: et n’ont pas prêté l’oreille
  rationale: Expression française actuelle et digne qui conserve l’image hébraïque de l’oreille attentive.
theological_decisions:
- issue: Langage d’appartenance communautaire au masculin singulier
  choice: son frère hébreu
  alternative: son compatriote hébreu / son parent hébreu
  rationale: Le choix conserve la rhétorique familiale de l’alliance et la forme juridique masculine, tout en signalant en note des sens non biologiques possibles.
- issue: Nature de la vente conduisant au service
  choice: qui aura été vendu à lui
  alternative: qui se sera vendu à lui
  rationale: Le nifal peut être passif ou réfléchi dans ce cadre. Le texte principal retient le passif formellement direct sans trancher la question grâce à une note.
- issue: Terminologie du service sous contrat ou pour dette
  choice: l’aura servi pendant six ans
  alternative: aura travaillé pour lui pendant six ans
  rationale: « Servir » correspond à עבד et maintient le cadre de dépendance juridique sans importer des précisions absentes du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple convient au discours juridique cité. L’alternance entre « chacun de vous… à lui » et « tu… chez toi » reflète le passage de la construction distributive au singulier de l’hébreu, tandis que la conclusion revient au pluriel (« vos pères »).
