base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/011.yaml
  text: But afterward they turned back and brought back the male servants and the female servants whom they had set free[a], and they forced them into slavery as male and female servants.
translation:
  language: fr
  text: 'Mais ensuite, ils revinrent sur leur décision : ils firent revenir les esclaves, hommes et femmes, qu’ils avaient affranchis, et les asservirent, les hommes comme esclaves et les femmes comme servantes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils les soumirent comme esclaves et comme servantes ». Le verbe hébreu signifie « soumettre » ou « assujettir » ; dans ce contexte, il désigne leur réduction à la condition d’esclaves.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: ils revinrent sur leur décision
  rationale: Le qal de שׁוב exprime ici un revirement après la libération. Cette tournure française rend naturellement le changement de conduite sans le réduire à un simple déplacement.
- source_word: אַחֲרֵי כֵן
  choice: par la suite
  rationale: Cette expression temporelle marque l’action postérieure de manière concise et naturelle en français moderne.
- source_word: וַיָּשִׁבוּ
  choice: ils firent revenir
  rationale: Le hiphil de שׁוב est causatif. « Firent revenir » conserve cette valeur et fait écho au premier emploi du même verbe hébreu.
- source_word: הָעֲבָדִים וְהַשְּׁפָחוֹת
  choice: les hommes et les femmes
  rationale: Dans ce contexte d’affranchissement puis de remise en servitude, les deux substantifs désignent respectivement les esclaves masculins et féminins. La formulation française évite l’ambiguïté moderne de « servantes », tandis que « esclavage » explicite leur condition dans la même phrase.
- source_word: שִׁלְּחוּ חָפְשִׁים
  choice: qu’ils avaient affranchis
  rationale: L’expression signifie libérer de la servitude. « Affranchir » est précis, idiomatique et marque clairement l’action antérieure accomplie.
- source_word: וַיִּכְבְּשׁוּם
  choice: les contraignirent de nouveau à l’esclavage
  rationale: כָּבַשׁ évoque l’assujettissement par la force. Dans ce contexte, la conséquence est une remise en esclavage ; la traduction exprime à la fois la coercition et le résultat.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: à l’esclavage
  rationale: Le ל indique ici l’état auquel les personnes sont ramenées. Le français collectif « à l’esclavage » restitue naturellement ce résultat, tandis que « les hommes et les femmes » conserve plus tôt la distinction de sexe.
