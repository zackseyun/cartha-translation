translation_notes:
  register: Français international moderne, courant et digne. La répétition de la racine שׁוב est partiellement conservée par « revinrent » et « firent revenir ». Le point-virgule implicite du texte hébreu est rendu par deux-points pour clarifier que le revirement se manifeste dans les actes qui suivent.
