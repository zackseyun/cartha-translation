  naturalness: La phrase révisée est fluide en français moderne. « Les esclaves, hommes et femmes » évite la lourdeur de « esclaves de sexe masculin/féminin » tout en conservant l’information. La reprise distributive « les hommes comme esclaves et les femmes comme servantes » rend clairement le couple hébreu.
  terminology: « Affranchis » est précis pour שִׁלְּחוּ חָפְשִׁים. « Asservir » rend sobrement la domination coercitive de כבש dans ce contexte sans imposer une interprétation doctrinale. « Esclaves » et « servantes » reflètent le couple masculin/féminin du texte; ici « servantes » désigne des femmes en servitude, non de simples employées domestiques.
