source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ אַתֶּ֜ם הַ/יּ֗וֹם וַ/תַּעֲשׂ֤וּ אֶת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י לִ/קְרֹ֥א דְר֖וֹר אִ֣ישׁ לְ/רֵעֵ֑/הוּ וַ/תִּכְרְת֤וּ בְרִית֙ לְ/פָנַ֔/י בַּ/בַּ֕יִת אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/015.yaml
  text: And you yourselves had turned back today and had done what was right in my eyes[a], by proclaiming liberty, each man to his neighbor[b]; and you had cut a covenant before me in the house that is called by my name.
translation:
  language: fr
  text: 'Aujourd’hui, vous aviez changé de conduite et fait ce qui est droit à mes yeux : chacun de vous avait proclamé la liberté en faveur de son prochain, et vous aviez conclu une alliance[a] devant moi, dans la maison qui porte mon nom[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « coupé une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le temple de Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: vous aviez changé de conduite
  rationale: Le verbe שׁוב signifie fondamentalement revenir ou faire demi-tour. Ici, le contexte indique un abandon temporaire de leur conduite précédente. Cette formulation française exprime ce retournement sans impliquer nécessairement une repentance intérieure complète.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’indication temporelle et son caractère immédiat.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: ce qui est droit à mes yeux
  rationale: Conserve l’image hébraïque tout en restant naturelle en français et exprime l’évaluation morale divine.
- source_word: לִקְרֹא דְרוֹר
  choice: proclamer la liberté
  rationale: דְּרוֹר désigne ici la libération juridique d’esclaves. « Proclamer la liberté » conserve le caractère public et solennel de l’acte.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: chacun pour son prochain
  rationale: Préserve la construction distributive du texte hébreu et la relation entre les membres de la communauté, sans alourdir le français.
- source_word: וַתִּכְרְתוּ בְרִית
  choice: vous aviez conclu une alliance
  rationale: « Conclure une alliance » est l’équivalent français naturel de l’expression idiomatique hébraïque « couper une alliance ». Le sens littéral est signalé en note puisqu’il peut évoquer le rite décrit dans le contexte.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Conserve le langage de présence et de solennité lié à l’alliance.
- source_word: בַּבַּיִת אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: dans la maison qui porte mon nom
  rationale: Rend naturellement l’idée hébraïque d’un édifice placé sous le nom et l’autorité de Dieu, tout en conservant « maison » dans le texte principal.
theological_decisions:
- issue: Expression d’alliance כרת ברית
  choice: conclu une alliance
  alternative: coupé une alliance
  rationale: La formulation idiomatique française communique clairement l’acte solennel d’alliance. Une note conserve l’image hébraïque, particulièrement pertinente dans le contexte rituel de Jérémie 34.
- issue: Portée de אִישׁ לְרֵעֵהוּ
  choice: chacun pour son prochain
  alternative: chacun pour son compatriote
  rationale: « Prochain » garde la relation communautaire exprimée par רֵעַ sans préciser davantage que le texte. La construction distributive « chacun » demeure visible.
translation_notes:
  register: Français moderne, digne et accessible. Le plus-que-parfait situe ces actes avant le revirement dénoncé au verset suivant. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
