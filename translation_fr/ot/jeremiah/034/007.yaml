source:
  edition: WLC
  text: וְ/חֵ֣יל מֶֽלֶךְ בָּבֶ֗ל נִלְחָמִים֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֛ל כָּל עָרֵ֥י יְהוּדָ֖ה הַ/נּֽוֹתָר֑וֹת אֶל לָכִישׁ֙ וְ/אֶל עֲזֵקָ֔ה כִּ֣י הֵ֗נָּה נִשְׁאֲר֛וּ בְּ/עָרֵ֥י יְהוּדָ֖ה עָרֵ֥י מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/007.yaml
  text: while the army of the king of Babylon was fighting against Jerusalem and against all the remaining cities of Judah[a], against Lachish and against Azekah, for these alone remained among the cities of Judah as fortified cities.
translation:
  language: fr
  text: tandis que l’armée du roi de Babylone combattait contre Jérusalem et contre toutes les villes de Juda qui restaient[a], contre Lakish et contre Azéqa. En effet, parmi les villes de Juda, seules celles-ci subsistaient comme villes fortifiées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui restaient, c’est-à-dire Lakish et Azéqa ». L’hébreu peut présenter les deux noms comme une précision identifiant les villes de Juda encore assiégées.
    reason: alternative_syntaxique
lexical_decisions:
- source_word: חֵיל
  choice: armée
  rationale: Dans ce contexte militaire, le terme désigne les forces armées du roi de Babylone; « armée » est précis et naturel en français.
- source_word: נִלְחָמִים
  choice: combattait contre
  rationale: Le participe exprime une action militaire en cours. Le singulier s’accorde naturellement avec le nom collectif « armée ».
- source_word: הַנּוֹתָרוֹת
  choice: qui restaient
  rationale: Le participe qualifie les villes de Juda qui n’étaient pas encore tombées; cette tournure est claire et idiomatique.
- source_word: אֶל לָכִישׁ וְאֶל עֲזֵקָה
  choice: contre Lakish et contre Azéqa
  rationale: La répétition de « contre » respecte la syntaxe hébraïque et maintient ouverte la relation exacte entre les deux villes nommées et l’ensemble précédent.
- source_word: כִּי הֵנָּה
  choice: En effet… seules celles-ci
  rationale: Le pronom féminin renvoie aux deux villes nommées. « Seules » explicite la valeur restrictive indiquée par le contexte immédiat.
- source_word: נִשְׁאֲרוּ
  choice: subsistaient
  rationale: Le verbe indique que ces villes demeuraient encore intactes, contrairement aux autres déjà tombées.
- source_word: בְּעָרֵי יְהוּדָה
  choice: parmi les villes de Juda
  rationale: '« Parmi » rend la nuance partitive: ces deux villes sont distinguées au sein des villes de Juda.'
- source_word: עָרֵי מִבְצָר
  choice: villes fortifiées
  rationale: Cette expression désigne des villes pourvues d’ouvrages défensifs; « villes fortifiées » est la formulation française courante et précise.
theological_decisions: []
