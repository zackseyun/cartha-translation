source:
  edition: WLC
  text: לָ/כֵן֮ כֹּה אָמַ֣ר יְהוָה֒ אַתֶּם֙ לֹֽא שְׁמַעְתֶּ֣ם אֵלַ֔/י לִ/קְרֹ֣א דְר֔וֹר אִ֥ישׁ לְ/אָחִ֖י/ו וְ/אִ֣ישׁ לְ/רֵעֵ֑/הוּ הִנְ/נִ֣י קֹרֵא֩ לָ/כֶ֨ם דְּר֜וֹר נְאֻם יְהוָ֗ה אֶל הַ/חֶ֨רֶב֙ אֶל הַ/דֶּ֣בֶר וְ/אֶל הָ/רָעָ֔ב וְ/נָתַתִּ֤י אֶתְ/כֶם֙ ל/זועה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/017.yaml
  text: 'Therefore thus says Yahweh: You have not listened to me[a], to proclaim liberty, each man to his brother and each man to his neighbor. Behold, I am proclaiming liberty for you, declares Yahweh—to the sword, to the pestilence[c][b], and to the famine—and I will make you a horror to all the kingdoms of the earth.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahvé : Vous ne m’avez pas écouté, pour proclamer la libération, chacun à son frère et chacun à son prochain. Voici que je vous proclame la libération[a] — oracle de Yahvé — : à l’épée, à la peste et à la famine. Je ferai de vous un objet d’épouvante[b] pour tous les royaumes de la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même mot hébreu signifie « libération », « remise en liberté » ou « liberté » dans les deux emplois. Ici, Yahvé annonce ironiquement qu’il les « libère » pour l’épée, la peste et la famine.
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « une cause d’effroi » ou « un objet de terreur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » rend le nom divin personnel plutôt que de lui substituer le titre « le Seigneur ».
- source_word: שְׁמַעְתֶּם אֵלַי
  choice: vous ne m’avez pas écouté
  rationale: Cette formulation conserve l’image auditive de l’hébreu tout en laissant entendre, sans la surtraduire, la désobéissance qui en découle.
- source_word: לִקְרֹא דְרוֹר / דְרוֹר
  choice: proclamer la libération / libération
  rationale: « Libération » convient à l’affranchissement juridique des esclaves hébreux et sa répétition dans les deux propositions préserve l’ironie délibérée du texte.
- source_word: אִישׁ לְאָחִיו וְאִישׁ לְרֵעֵהוּ
  choice: chacun en faveur de son frère et chacun en faveur de son prochain
  rationale: « Chacun » restitue la valeur distributive de la répétition d’אִישׁ, tandis que « frère » et « prochain » maintiennent la distinction entre les deux noms hébreux.
- source_word: הִנְנִי
  choice: Eh bien, moi
  rationale: Dans cette annonce de jugement, cette tournure française marque avec naturel l’intervention solennelle et contrastée de Yahvé.
- source_word: קֹרֵא לָכֶם דְרוֹר אֶל הַחֶרֶב אֶל הַדֶּבֶר וְאֶל הָרָעָב
  choice: je proclame pour vous la libération… en vous livrant à l’épée, à la peste et à la famine
  rationale: La formulation conserve le mot répété « libération » tout en rendant intelligible en français la destination funeste exprimée par les trois occurrences d’אֶל.
- source_word: נְאֻם יְהוָה
  choice: oracle de Yahvé
  rationale: Formule prophétique française concise et consacrée, qui marque que l’annonce vient directement de Yahvé.
- source_word: לְזַוֲעָה
  choice: un objet d’épouvante
  rationale: Le nom désigne ici ce qui provoque effroi et consternation; « objet d’épouvante » exprime clairement cette valeur causative.
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: les royaumes de la terre
  rationale: Le contexte vise l’ensemble international des royaumes, et non seulement le territoire de Juda.
theological_decisions:
- issue: Ironie de la « libération » divine
  choice: Répéter « libération » dans les deux parties du verset
  alternative: Employer « libération » d’abord, puis seulement « livrer » ou « abandonner » dans la seconde partie
  rationale: 'Le même mot hébreu דְרוֹר est intentionnellement repris : ceux qui ont refusé de libérer leurs compatriotes sont à leur tour « libérés », mais pour être exposés aux instruments du jugement. La répétition garde cette tension rhétorique et théologique.'
- issue: Rapport entre la libération et les trois fléaux
  choice: Expliciter la conséquence par « en vous livrant à » tout en signalant l’ironie en note
  alternative: Traduire littéralement « la libération vers l’épée, vers la peste et vers la famine »
  rationale: La construction hébraïque est volontairement saisissante, mais un calque serait obscur et peu naturel en français. La traduction choisie communique le sens sans supprimer le terme répété.
- issue: Portée de la formule distributive
  choice: chacun en faveur de son frère et chacun en faveur de son prochain
  alternative: chacun en faveur de son compatriote
  rationale: La traduction conserve les deux relations distinctes exprimées par l’hébreu, sans les réduire à une seule catégorie sociale ni introduire une précision confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique reste solennelle sans archaïsmes; « oracle de Yahvé » conserve le registre de proclamation. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
