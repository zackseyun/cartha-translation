revisions:
- from: 'C’est pourquoi, voici ce que dit Yahvé : Vous ne m’avez pas écouté en proclamant la libération, chacun en faveur de son frère et chacun en faveur de son prochain. Eh bien, moi, je proclame pour vous la libération[a] — oracle de Yahvé — en vous livrant à l’épée, à la peste et à la famine. Je ferai de vous un objet d’épouvante[b] pour tous les royaumes de la terre.'
  to: 'C’est pourquoi, ainsi parle Yahvé : Vous ne m’avez pas écouté, pour proclamer la libération, chacun à son frère et chacun à son prochain. Voici que je vous proclame la libération[a] — oracle de Yahvé — : à l’épée, à la peste et à la famine. Je ferai de vous un objet d’épouvante[b] pour tous les royaumes de la terre.'
  rationale: La révision corrige le rapport syntaxique de l’infinitif, relève légèrement le registre de l’annonce divine et rétablit plus directement l’association intentionnellement paradoxale entre la « libération » et les instruments du jugement. Elle conserve la répétition lexicale, les deux termes relationnels (« frère », « prochain »), la formule « oracle de Yahvé » et les deux ancres de notes.
