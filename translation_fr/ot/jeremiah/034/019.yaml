  yaml_path: translation/ot/jeremiah/034/019.yaml
  text: the officials of Judah and the officials of Jerusalem[a], the court officials and the priests, and all the people of the land who passed between the pieces of the calf—
translation:
  language: fr
  text: les dirigeants de Juda et les dirigeants de Jérusalem, les fonctionnaires de la cour[a], les prêtres et tout le peuple du pays qui était passé entre les morceaux du veau —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les eunuques ». Le terme hébreu peut désigner soit des eunuques au sens propre, soit des fonctionnaires de la cour.'
    reason: Alternative lexicale préservant l’ambiguïté réelle du terme hébreu סָרִיסִים.
lexical_decisions:
- source_word: שָׂרֵי
  choice: dirigeants
  rationale: Le terme désigne ici des personnes investies d’autorité. « Dirigeants » est naturel en français moderne et convient aussi bien à Juda qu’à Jérusalem.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et usuelle du nom.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville.
- source_word: הַסָּרִסִים
  choice: fonctionnaires de la cour
  rationale: Le terme peut désigner des eunuques au sens propre ou des fonctionnaires attachés à la cour. Dans cette liste de groupes sociaux et administratifs, la fonction paraît être au premier plan, tandis que l’autre sens est conservé en note.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français standard du terme hébreu.
- source_word: כֹל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: Cette formulation conserve l’expression collective hébraïque sans préciser abusivement qu’il s’agirait seulement des gens du peuple.
- source_word: הָעֹבְרִים
  choice: tous ceux qui étaient passés
  rationale: Le participe identifie les personnes ayant accompli le rite mentionné dans le contexte. Le plus-que-parfait exprime naturellement en français l’antériorité de ce geste dans l’énumération.
- source_word: בֵּין
  choice: entre
  rationale: Rendu direct et idiomatique de la préposition dans la description du rite d’alliance.
- source_word: בִּתְרֵי
  choice: les morceaux
  rationale: Le nom désigne les parties découpées de l’animal ; « morceaux » est clair et naturel.
- source_word: הָעֵגֶל
  choice: du veau
  rationale: « Veau » est le sens ordinaire du terme et correspond à l’animal coupé en deux dans le contexte immédiat.
theological_decisions:
- issue: Sens de סָרִיסִים dans l’énumération sociale
  choice: fonctionnaires de la cour
  alternative: eunuques
  rationale: L’hébreu permet les deux sens. Le contexte favorise probablement la désignation d’une catégorie administrative, mais la note maintient explicitement la possibilité qu’il s’agisse d’eunuques au sens propre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste un fragment syntaxique lié au verset précédent, et le tiret final signale la continuation de la phrase. Le marqueur de note est placé immédiatement après l’expression qu’il explique.
