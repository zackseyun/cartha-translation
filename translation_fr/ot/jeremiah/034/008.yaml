id: JER.34.8
reference: Jeremiah 34:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה אַחֲרֵ֡י כְּרֹת֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ בְּרִ֗ית אֶת כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירֽוּשָׁלִַ֔ם לִ/קְרֹ֥א לָ/הֶ֖ם דְּרֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/008.yaml
  text: 'The word that came to Jeremiah from Yahweh after King Zedekiah had made a covenant with all the people who were in Jerusalem[b][a], to proclaim liberty to them:'
translation:
  language: fr
  text: 'La parole qui fut adressée à Jérémie de la part de Yahweh, après que le roi Sédécias eut conclu une alliance[a] avec tout le peuple qui se trouvait à Jérusalem, afin de leur proclamer la libération[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « couper une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « la liberté » ou « l’affranchissement ». Le terme hébreu désigne ici une remise en liberté officiellement proclamée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: La parole qui fut adressée à Jérémie
  rationale: Cette formulation rend naturellement en français la formule prophétique hébraïque, tout en conservant « la parole » plutôt que de l’expliciter par « le message ».
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: La préposition marque l’origine de la parole, et le nom divin est transcrit directement afin de préserver le nom propre de l’hébreu.
- source_word: אַחֲרֵי כְּרֹת ... בְּרִית
  choice: après que ... eut conclu une alliance
  rationale: כרת ברית est une locution signifiant « conclure une alliance ». Le passé antérieur marque clairement que cette action précède la parole adressée à Jérémie.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: le roi Sédécias
  rationale: « Sédécias » est la forme française traditionnelle et courante du nom hébreu.
- source_word: אֶת כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: avec tout le peuple qui se trouvait à Jérusalem
  rationale: La traduction conserve l’idée de totalité ainsi que la proposition relative de l’hébreu.
- source_word: לִקְרֹא לָהֶם דְּרוֹר
  choice: afin de leur proclamer la libération
  rationale: קרא désigne ici une proclamation publique et officielle. Dans ce contexte juridique, דְּרוֹר évoque la remise en liberté ou l’affranchissement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, rendu ici comme un nom propre sans le remplacer par un titre.
- issue: Portée de דְּרוֹר
  choice: la libération
  alternative: la liberté / l’affranchissement
  rationale: « Libération » maintient le caractère formel et juridique de la proclamation sans réduire d’emblée le mot au seul statut servile, même si le contexte immédiat concerne l’affranchissement.
translation_notes:
  register: Français moderne, soutenu mais accessible. La syntaxe conserve la forme d’introduction prophétique et la longue articulation de la phrase hébraïque, tout en employant des expressions françaises idiomatiques.
