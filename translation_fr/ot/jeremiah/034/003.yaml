  terminology: « Son pouvoir » et « livré entre ses mains » rendent convenablement les deux emplois de l’idiome de la main, tout en conservant une image concrète dans la seconde expression. « Bel et bien » communique l’insistance de l’infinitif absolu sans surcharge doctrinale ni interprétative.
