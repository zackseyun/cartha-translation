  text: וְ/אַתָּ֗ה לֹ֚א תִמָּלֵט֙ מִ/יָּד֔/וֹ כִּ֚י תָּפֹ֣שׂ תִּתָּפֵ֔שׂ וּ/בְ/יָד֖/וֹ תִּנָּתֵ֑ן וְֽ֠/עֵינֶי/ךָ אֶת עֵינֵ֨י מֶֽלֶךְ בָּבֶ֜ל תִּרְאֶ֗ינָה וּ/פִ֛י/הוּ אֶת פִּ֥י/ךָ יְדַבֵּ֖ר וּ/בָבֶ֥ל תָּבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/003.yaml
  text: And you will not escape from his hand[a], for you will surely be captured and given into his hand. Your eyes will see the eyes of the king of Babylon, and his mouth will speak to your mouth, and you will go to Babylon.
translation:
  language: fr
  text: Et toi, tu n’échapperas pas à son pouvoir, car tu seras bel et bien capturé et livré entre ses mains. Tes yeux verront les yeux du roi de Babylone, et il te parlera directement[a]. Et tu iras à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa bouche parlera à ta bouche ».'
    reason: La note conserve l’image concrète et inhabituelle de l’hébreu, rendue de manière idiomatique dans le texte principal.
lexical_decisions:
- source_word: תִמָּלֵט מִיָּדוֹ
  choice: tu n’échapperas pas à son pouvoir
  rationale: L’expression hébraïque évoque littéralement le fait d’échapper à la « main » de quelqu’un, c’est-à-dire à son pouvoir ou à son emprise. Cette formulation restitue naturellement le sens en français moderne.
- source_word: כִּי תָּפֹשׂ תִּתָּפֵשׂ
  choice: car tu seras bel et bien capturé
  rationale: La combinaison de l’infinitif absolu et du verbe conjugué renforce la certitude de la capture. « Bel et bien » rend cette insistance dans un français naturel.
- source_word: וּבְיָדוֹ תִּנָּתֵן
  choice: et livré entre ses mains
  rationale: Le passif de נתן suivi de « dans sa main » exprime la remise au pouvoir de quelqu’un. L’expression française « livré entre ses mains » conserve l’image tout en restant idiomatique.
- source_word: וְעֵינֶיךָ אֶת־עֵינֵי מֶלֶךְ בָּבֶל תִּרְאֶינָה
  choice: Tes yeux verront ceux du roi de Babylone
  rationale: Cette traduction conserve l’image concrète et emphatique des yeux de Sédécias rencontrant ceux du roi, plutôt que de la réduire à une simple mention de leur rencontre.
- source_word: וּפִיהוּ אֶת־פִּיךָ יְדַבֵּר
  choice: et il te parlera directement[a]
  rationale: L’expression hébraïque, littéralement « sa bouche parlera à ta bouche », décrit une conversation directe. Le corps du texte en donne le sens naturel, tandis que la note préserve la formulation imagée inhabituelle.
- source_word: וּבָבֶל תָּבוֹא
  choice: Puis tu iras à Babylone
  rationale: בוא peut signifier « venir » ou « aller » selon le point de vue. Du point de vue du destinataire qui se trouve encore à Jérusalem, « aller à Babylone » est naturel. « Puis » exprime ici la progression portée par la conjonction.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, digne et accessible. La traduction privilégie une équivalence optimale : elle conserve l’image des yeux et celle des mains là où elles restent naturelles, mais explicite l’idiome de la « main » dans la première proposition et celui de la bouche dans le texte principal.'
