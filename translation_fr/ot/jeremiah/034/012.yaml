id: JER.34.12
reference: Jeremiah 34:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/012.yaml
  text: Then the word of Yahweh came to Jeremiah from Yahweh[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh fut adressée à Jérémie de la part de Yahweh[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors ... fut adressée
  rationale: Le wayyiqtol fait progresser le récit. La tournure française idiomatique « la parole fut adressée » exprime naturellement la venue de la parole sans calquer lourdement l’hébreu.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la formule prophétique et son lien avec la révélation, tandis que « message » serait plus interprétatif.
- source_word: אֶל יִרְמְיָהוּ
  choice: à Jérémie
  rationale: La préposition indique le destinataire; le nom propre suit sa forme française usuelle.
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: מֵאֵת marque ici la source. « De la part de » restitue clairement cette origine et évite en français la répétition maladroite « de Yahweh ... de Yahweh ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Devant le discours direct qui suit au verset suivant, les deux-points constituent en français moderne l’équivalent naturel de la formule introductive hébraïque « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte deux fois le tétragramme. « Yahweh » conserve le nom divin personnel plutôt que de lui substituer un titre; la note signale la tradition de traduction.
translation_notes:
  register: Français international moderne, sobre et digne. La formule prophétique est conservée, mais « disant » est remplacé par les deux-points selon l’usage naturel du français. La répétition emphatique du nom divin demeure visible.
