source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ֙ וַ/תְּחַלְּל֣וּ אֶת שְׁמִ֔/י וַ/תָּשִׁ֗בוּ אִ֤ישׁ אֶת עַבְדּ/וֹ֙ וְ/אִ֣ישׁ אֶת שִׁפְחָת֔/וֹ אֲשֶׁר שִׁלַּחְתֶּ֥ם חָפְשִׁ֖ים לְ/נַפְשָׁ֑/ם וַ/תִּכְבְּשׁ֣וּ אֹתָ֔/ם לִֽ/הְי֣וֹת לָ/כֶ֔ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/016.yaml
  text: 'But you turned back and profaned my name: each of you made his male servant and his female servant return, though you had set them free to go where they wished; then you subjugated them to be your male and female servants.'
translation:
  language: fr
  text: 'Mais vous avez fait volte-face et profané mon nom : chacun de vous a fait revenir l’homme et la femme qui étaient ses esclaves, alors que vous les aviez libérés pour qu’ils vivent à leur guise[a] ; puis vous les avez soumis pour en faire vos esclaves, hommes et femmes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour eux-mêmes » ; l’expression évoque ici la liberté de disposer d’eux-mêmes.'
    reason: Le syntagme לְנַפְשָׁם est concis et peut être rendu de plusieurs manières. La note préserve sa forme et son amplitude sémantique sans employer une glose française opaque.
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: vous avez fait volte-face
  rationale: Le verbe שׁוב exprime ici le renversement de la décision précédente. « Faire volte-face » rend clairement ce revirement sans l’atténuer.
- source_word: וַתְּחַלְּלוּ אֶת־שְׁמִי
  choice: et profané mon nom
  rationale: Le piel de חלל signifie traiter comme profane, notamment lorsque « mon nom » est l’objet. « Profaner mon nom » est précis et idiomatique en français biblique actuel.
- source_word: וַתָּשִׁיבוּ
  choice: a fait revenir
  rationale: 'Le hiphil est causatif : les propriétaires ont obligé les personnes libérées à revenir. La formulation française conserve cette causalité.'
- source_word: עַבְדּוֹ וְשִׁפְחָתוֹ
  choice: l’homme et la femme qui étaient ses esclaves
  rationale: Cette formulation naturelle en français maintient à la fois la distinction sexuelle des deux termes hébreux et la réalité de l’esclavage, sans employer « serviteur » ou « servante », qui pourrait l’atténuer.
- source_word: שִׁלַּחְתֶּם חָפְשִׁים
  choice: vous les aviez libérés
  rationale: L’expression désigne une véritable mise en liberté, et non un simple renvoi.
- source_word: לְנַפְשָׁם
  choice: pour qu’ils vivent à leur guise
  rationale: Dans ce contexte, l’expression indique que les affranchis pouvaient désormais disposer d’eux-mêmes. La formulation garde l’idée d’autonomie sans la réduire à la seule liberté de déplacement.
- source_word: וַתִּכְבְּשׁוּ אֹתָם
  choice: vous les avez soumis
  rationale: כבש exprime l’action de placer quelqu’un sous domination ou de l’assujettir. « Soumis » rend cette contrainte avec sobriété.
- source_word: לִהְיוֹת לָכֶם לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: pour en faire vos esclaves, hommes et femmes
  rationale: La traduction exprime le statut résultant, garde la relation de possession et conserve la distinction entre les catégories masculine et féminine.
theological_decisions:
- issue: Vocabulaire de l’esclavage dans un contexte d’affranchissement annulé
  choice: esclaves
  alternative: serviteurs et servantes
  rationale: La libération puis la soumission forcée montrent qu’il s’agit d’un statut servile réel. « Esclaves » évite d’adoucir la dénonciation du texte.
- issue: Sens de לְנַפְשָׁם après la mise en liberté
  choice: pour qu’ils vivent à leur guise
  alternative: pour aller où ils voulaient / pour eux-mêmes
  rationale: L’expression peut évoquer le fait de disposer librement de sa personne, sans préciser exclusivement un lieu où aller. La traduction conserve cette amplitude.
- issue: Répétition de la distinction homme-femme
  choice: l’homme et la femme qui étaient ses esclaves … vos esclaves, hommes et femmes
  alternative: son esclave et sa servante … vos serviteurs et vos servantes
  rationale: Ce choix maintient la distinction explicite du texte hébreu tout en employant un français naturel et en évitant d’atténuer le statut d’esclave.
translation_notes:
  register: Français international moderne, digne et direct. « Faire volte-face » souligne le revirement accusateur ; « esclaves » nomme sans euphémisme la condition décrite. La syntaxe reste fluide tout en conservant le parallélisme entre hommes et femmes.
