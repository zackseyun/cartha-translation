id: JER.34.4
reference: Jeremiah 34:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֚ךְ שְׁמַ֣ע דְּבַר יְהוָ֔ה צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ עָלֶ֔י/ךָ לֹ֥א תָמ֖וּת בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/004.yaml
  text: 'Yet hear the word of Yahweh, Zedekiah king of Judah: Thus says Yahweh concerning you, You shall not die by the sword.'
translation:
  language: fr
  text: 'Cependant, écoute la parole de Yahweh, Sédécias, roi de Juda : Voici ce que Yahweh dit à ton sujet : Tu ne mourras pas par l’épée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Cependant
  rationale: La particule introduit ici une nuance adversative qui tempère le jugement précédent; « Cependant » exprime clairement cette qualification consolante.
- source_word: שְׁמַע
  choice: écoute
  rationale: L’impératif appelle Sédécias à prêter attention et à recevoir l’oracle; « écoute » est plus naturel en français moderne que « entends » dans cette formule.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve le caractère solennel et prophétique de la formule hébraïque sans la réduire à une simple information.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel attesté dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et largement reconnue du nom royal.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rend directement le groupe construit désignant la fonction et le royaume de Sédécias.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que Yahweh dit
  rationale: Formulation française naturelle et digne de la formule prophétique, tout en préservant son caractère déclaratif.
- source_word: עָלֶיךָ
  choice: à ton sujet
  rationale: Dans ce contexte de parole prononcée concernant le destin de Sédécias, la préposition signifie « au sujet de » plutôt que « contre ».
- source_word: לֹא תָמוּת
  choice: Tu ne mourras pas
  rationale: Le futur français exprime naturellement l’issue annoncée par l’imparfait hébreu nié.
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: Conserve l’image hébraïque d’une mort violente par arme sans préciser indûment qu’elle aurait lieu au combat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Portée de עָלֶיךָ dans l’oracle
  choice: à ton sujet
  alternative: contre toi; à toi
  rationale: La suite annonce le sort personnel de Sédécias et n’exige pas la nuance hostile de « contre toi »; le français garde ainsi la portée référentielle du syntagme.
translation_notes:
  register: Français international moderne, clair et solennel. La tournure « Voici ce que Yahweh dit » rend la formule prophétique avec naturel; « écoute la parole » conserve son registre biblique sans archaïsme.
