  text: בְּ/שָׁל֣וֹם תָּמ֗וּת וּֽ/כְ/מִשְׂרְפ֣וֹת אֲ֠בוֹתֶי/ךָ הַ/מְּלָכִ֨ים הָ/רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ כֵּ֚ן יִשְׂרְפוּ לָ֔/ךְ וְ/ה֥וֹי אָד֖וֹן יִסְפְּדוּ לָ֑/ךְ כִּֽי דָבָ֥ר אֲנִֽי דִבַּ֖רְתִּי נְאֻם יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/005.yaml
  text: You will die in peace[a]. And as spices were burned for your fathers, the former kings who were before you, so they will burn spices for you, and they will lament for you, saying, “Alas, lord!” For I have spoken the word[b], declares Yahweh.
translation:
  language: fr
  text: 'Tu mourras en paix. De même qu’on a fait des feux funèbres en l’honneur de tes pères, les rois d’autrefois qui t’ont précédé, de même on en fera pour toi[a]. On te pleurera : « Hélas, seigneur ! » Car c’est moi qui ai prononcé cette parole, déclare Yahvé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de feux cérémoniels allumés en l’honneur des rois défunts, probablement pour y brûler des aromates, et non de l’incinération du corps.
    reason: cultural_note
lexical_decisions:
- source_word: בְּשָׁלוֹם תָּמוּת
  choice: Tu mourras en paix
  rationale: Conserve l’expression hébraïque et présente la mort comme non violente ou sans trouble, sans la réduire à un état émotionnel.
- source_word: וּכְמִשְׂרְפוֹת
  choice: Comme on a fait des feux funèbres en l’honneur de
  rationale: מִשְׂרְפוֹת désigne ici des combustions cérémonielles liées aux funérailles royales. Cette formulation reste proche de l’image hébraïque sans suggérer que le corps était incinéré.
- source_word: אֲבוֹתֶיךָ הַמְּלָכִים הָרִאשֹׁנִים אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: tes pères, les rois d’autrefois qui t’ont précédé
  rationale: « Tes pères » traduit littéralement אֲבוֹתֶיךָ, tandis que l’apposition précise qu’il s’agit des prédécesseurs royaux.
- source_word: כֵּן יִשְׂרְפוּ לָךְ
  choice: ainsi on en fera pour toi
  rationale: Le pronom « en » reprend les feux funèbres et évite l’ambiguïté française qui pourrait laisser croire que l’on brûlera le roi.
- source_word: וְהוֹי אָדוֹן יִסְפְּדוּ לָךְ
  choice: 'On prononcera sur toi cette lamentation : « Hélas, seigneur ! »'
  rationale: יִסְפְּדוּ exprime une lamentation funèbre formelle; הוֹי est un cri de deuil et אָדוֹן un titre respectueux donné au roi défunt.
- source_word: כִּי דָבָר אֲנִי דִבַּרְתִּי
  choice: Car c’est moi qui ai prononcé cette parole
  rationale: La tournure emphatique « c’est moi » et la répétition notionnelle de « parole/prononcer » rendent l’insistance de l’hébreu sur l’engagement divin.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: Rend la formule prophétique de manière naturelle et transcrit le nom divin יהוה sous la forme française traditionnelle « Yahvé ».
theological_decisions:
- issue: Nature des feux funèbres royaux
  choice: Des combustions cérémonielles en l’honneur du roi défunt, probablement d’aromates, et non l’incinération de son corps
  alternative: « On brûlera des aromates pour toi » ou, plus littéralement, « on fera des brûlements pour toi »
  rationale: Le contexte promet à Sédécias des honneurs funèbres comparables à ceux de ses prédécesseurs. Le texte ne nomme toutefois pas explicitement les aromates; le corps du verset conserve donc le terme plus général, et la note expose l’interprétation culturelle probable.
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: Yahweh
  rationale: « Yahvé » est une forme française claire et établie du tétragramme, qui conserve le nom propre au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique et le parallélisme sont préservés; les tournures susceptibles de faire croire à une crémation sont évitées. Le cri « Hélas, seigneur ! » garde la solennité de la lamentation royale.
