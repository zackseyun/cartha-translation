  variant: modern international French
source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָלֹךְ֙ וְ/אָ֣מַרְתָּ֔ אֶל צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וּ/שְׂרָפָ֖/הּ בָּ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Go and speak to Zedekiah king of Judah, and say to him, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will burn it with fire.’'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, le Dieu d’Israël : « Va parler à Sédécias, roi de Juda, et dis-lui : “Ainsi parle Yahweh : Voici que je livre cette ville entre les mains[a] du roi de Babylone, et il la brûlera par le feu.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au pouvoir du roi de Babylone ».'
    reason: Alternative explicative de l’idiome hébreu בְּיַד, littéralement « dans la main de ».
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule classique du messager prophétique, naturelle en français biblique actuel et fidèle à la solennité de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, qui préserve son statut de nom propre plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction hébraïque qui identifie Yahweh comme le Dieu d’Israël.
- source_word: הָלֹךְ
  choice: Va
  rationale: L’infinitif absolu a ici une valeur impérative ; l’impératif bref en restitue la force.
- source_word: וְאָמַרְתָּ ... וְאָמַרְתָּ אֵלָיו
  choice: parler à… et dis-lui
  rationale: Conserve les deux verbes de parole sans produire une tournure artificielle en français.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rend naturellement le titre apposé au nom du souverain.
- source_word: הִנְנִי נֹתֵן
  choice: Voici que je livre
  rationale: « Voici que » exprime la solennité et l’imminence signalées par הִנְנִי, tandis que « je livre » rend le participe comme une action décidée et annoncée avec certitude.
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Équivalent français direct et naturel du nom défini suivi du démonstratif.
- source_word: בְּיַד
  choice: entre les mains
  rationale: Expression idiomatique française qui conserve l’image corporelle de l’hébreu tout en indiquant la remise au pouvoir d’un autre.
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: et il la brûlera par le feu
  rationale: Le sujet implicite masculin renvoie au roi de Babylone et le suffixe féminin à la ville ; la formulation garde l’expression explicite « par le feu ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte le nom divin lui-même. La translittération « Yahweh » le présente comme un nom propre et évite de remplacer celui-ci par un titre, sans prétendre lever toute incertitude sur sa vocalisation ancienne.
- issue: Image de la remise « dans la main » du roi de Babylone
  choice: entre les mains du roi de Babylone
  alternative: au pouvoir du roi de Babylone
  rationale: Le texte principal conserve l’image sémitique sous une forme idiomatique en français ; la note explicite le sens de domination sans l’imposer dans le corps du verset.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. Les guillemets emboîtés rendent clairement les deux niveaux de discours. La répétition de la formule prophétique est maintenue, de même que les deux verbes introducteurs de parole.
