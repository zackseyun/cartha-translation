source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל הַ/שָּׂרִ֨ים וְ/כָל הָ/עָ֜ם אֲשֶׁר בָּ֣אוּ בַ/בְּרִ֗ית לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֤ישׁ אֶת שִׁפְחָת/וֹ֙ חָפְשִׁ֔ים לְ/בִלְתִּ֥י עֲבָד בָּ֖/ם ע֑וֹד וַֽ/יִּשְׁמְע֖וּ וַ/יְשַׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/010.yaml
  text: So all the officials and all the people who had entered into the covenant to send away[a], each man his male servant and each man his female servant, free, so as not to make them serve any longer[b], obeyed and sent them away.
translation:
  language: fr
  text: Tous les responsables et tout le peuple qui étaient entrés dans l’alliance s’engagèrent à ce que chacun libère son esclave et chacun sa servante, afin de ne plus les tenir en esclavage. Ils obéirent et les libérèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ ... וַיִּשְׁמְעוּ
  choice: s’engagèrent ... Ils obéirent donc
  rationale: La première occurrence introduit le contenu auquel les participants donnent leur assentiment, tandis que la seconde, suivie de l’acte de libération, exprime clairement l’obéissance effective. Le français évite ainsi une répétition artificielle tout en conservant la progression du récit.
- source_word: הַשָּׂרִים
  choice: les responsables
  rationale: Désigne ici les autorités dirigeantes. « Responsables » est actuel, clair et suffisamment large dans ce contexte civique.
- source_word: בָּאוּ בַבְּרִית
  choice: étaient entrés dans l’alliance
  rationale: Reproduit naturellement l’expression hébraïque de participation formelle à une alliance.
- source_word: לְשַׁלַּח ... וַיְשַׁלֵּחוּ
  choice: à libérer ... les libérèrent
  rationale: Dans ce contexte d’affranchissement, « libérer » rend mieux la portée juridique et sociale de שׁלח qu’un littéral « renvoyer ».
- source_word: אִישׁ אֶת עַבְדּוֹ וְאִישׁ אֶת שִׁפְחָתוֹ
  choice: chacun son esclave et sa servante
  rationale: « Chacun » conserve la valeur distributive de אִישׁ ... וְאִישׁ sans lourdeur. « Esclave » explicite le statut servile; « servante », en parallèle, marque le féminin dans un français naturel, le contexte d’esclavage étant rendu sans ambiguïté par la suite.
- source_word: חָפְשִׁים
  choice: libérer
  rationale: L’idée de les faire partir libres est intégrée au verbe français « libérer », ce qui donne une formulation naturelle sans perdre la manumission exprimée par l’hébreu.
- source_word: לְבִלְתִּי עֲבָד בָּם עוֹד
  choice: afin de ne plus les tenir en esclavage
  rationale: Rend le but de la libération et la cessation définitive de leur assujettissement. La tournure met clairement en lumière le rapport de domination impliqué.
theological_decisions:
- issue: Terminologie de l’esclavage dans un contexte d’affranchissement
  choice: « son esclave et sa servante », puis « les tenir en esclavage »
  alternative: « son serviteur et sa servante », puis « les faire travailler pour eux »
  rationale: Le passage porte sur la libération de personnes juridiquement asservies. Le vocabulaire retenu ne minimise pas cette réalité sociale, tout en restant idiomatique en français.
- issue: Rapport entre les deux occurrences de שׁמע
  choice: Exprimer d’abord l’assentiment à l’engagement, puis l’obéissance concrète
  alternative: Traduire les deux occurrences par « ils obéirent » ou par « ils écoutèrent »
  rationale: La syntaxe fait de la première occurrence l’introduction du contenu accepté, tandis que la seconde récapitule l’obéissance avant l’action. Cette distinction préserve la tension entre consentement et mise en œuvre sans imposer un sens purement auditif.
- issue: Langage distributif masculin
  choice: « chacun »
  alternative: « chaque homme »
  rationale: Dans ce contexte, אִישׁ fonctionne distributivement. « Chacun » conserve cette fonction sans suggérer à tort que le texte insiste sur le sexe des propriétaires.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase suit la progression hébraïque: adhésion collective à l’alliance, contenu de l’engagement, obéissance, puis exécution. Aucun archaïsme juridique ou ecclésiastique n’est ajouté.'
