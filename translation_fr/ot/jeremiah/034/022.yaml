    issue: Direction de « je les ramènerai dans cette ville »
    rationale: Le causatif de שוב signifie ramener les troupes vers Jérusalem ; « vers cette ville » évite de suggérer seulement une localisation intérieure.
  - severity: low
    issue: « l’incendieront » ne rend pas explicitement « par le feu »
    rationale: Bien que naturel, « incendieront » condense l’expression hébraïque וּשְׂרָפוּהָ בָּאֵשׁ. « La brûleront par le feu » préserve l’élément lexical sans devenir artificiel.
  - severity: low
    issue: « des lieux dévastés » pour שְׁמָמָה
    rationale: Le texte emploie le singulier abstrait « une désolation ». Cette formulation conserve mieux l’image et la force résultative, tout en étant naturelle en français.
