  text: הִנְ/נִ֨י מְצַוֶּ֜ה נְאֻם יְהוָ֗ה וַ/הֲשִׁ֨בֹתִ֜י/ם אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/נִלְחֲמ֣וּ עָלֶ֔י/הָ וּ/לְכָד֖וּ/הָ וּ/שְׂרָפֻ֣/הָ בָ/אֵ֑שׁ וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מֵ/אֵ֥ין יֹשֵֽׁב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/022.yaml
  text: Behold[a], I am commanding, declares Yahweh, and I will bring them back to this city, and they will fight against it and capture it and burn it with fire. And I will make the cities of Judah a desolation[b], without inhabitant.
translation:
  language: fr
  text: '« Voici, je donne l’ordre, déclare Yahweh : je les ramènerai vers cette ville. Ils combattront contre elle, s’en empareront et la brûleront par le feu. Je ferai des villes de Juda une désolation, sans aucun habitant[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « sans habitant » et souligne la dépopulation complète des villes.
    reason: idiom_explanation
lexical_decisions:
- source_word: הִנְנִי מְצַוֶּה
  choice: Voici que je donne un ordre
  rationale: « Voici que » conserve la formule prophétique qui attire solennellement l’attention, tandis que le présent « je donne » rend la valeur immédiate du participe מְצַוֶּה.
- source_word: וַהֲשִׁבֹתִים
  choice: je les ramènerai
  rationale: 'Le hiphil de שוב a ici un sens causatif : Yahweh fera revenir vers Jérusalem les forces ennemies qui s’en étaient éloignées.'
- source_word: וְנִלְחֲמוּ עָלֶיהָ
  choice: Ils livreront bataille contre elle
  rationale: Cette tournure française naturelle conserve explicitement l’idée d’un combat militaire dirigé contre la ville.
- source_word: וּלְכָדוּהָ
  choice: s’en empareront
  rationale: Dans le contexte d’un siège, לכד désigne la prise militaire d’une ville ; « s’en emparer » est clair et idiomatique.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: l’incendieront
  rationale: Le verbe français exprime naturellement l’action de brûler une ville par le feu, sans la tournure redondante « la brûleront par le feu ».
- source_word: אֶתֵּן שְׁמָמָה
  choice: Je ferai … des lieux dévastés
  rationale: Cette formulation rend la valeur résultative de נתן avec שְׁמָמָה et convient au pluriel « villes », tout en restant naturelle en français.
- source_word: מֵאֵין יֹשֵׁב
  choice: sans aucun habitant
  rationale: Cette expression concise rend l’absence totale de population indiquée par l’idiome hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente comme un nom plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, solennel et accessible. La formulation garde le rythme ferme de l’oracle prophétique sans archaïsmes ; les actions successives du siège restent nettement articulées.
