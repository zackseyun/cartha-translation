source:
  edition: WLC
  text: וְ/אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/אֶת שָׂרָ֗י/ו אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וּ/בְ/יַד חֵ֚יל מֶ֣לֶךְ בָּבֶ֔ל הָ/עֹלִ֖ים מֵ/עֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/021.yaml
  text: And I will give Zedekiah king of Judah and his officials into the hand of their enemies[a], into the hand of those who seek their life, and into the hand of the army of the king of Babylon, which has withdrawn from you.
translation:
  language: fr
  text: Je livrerai Sédécias, roi de Juda, et ses hauts fonctionnaires entre les mains de leurs ennemis, entre les mains de ceux qui en veulent à leur vie, et entre les mains des troupes du roi de Babylone, qui se sont retirées de devant vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui sont en train de se retirer de devant vous ». L’hébreu dit littéralement « qui montent de dessus vous », expression qui désigne ici des forces s’éloignant de la ville qu’elles assiégeaient.
    reason: L’aspect du participe hébreu peut décrire un retrait en cours ou caractériser les troupes qui se sont retirées; l’expression spatiale est idiomatique dans ce contexte militaire.
lexical_decisions:
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: שָׂרָיו
  choice: ses hauts fonctionnaires
  rationale: שַׂר désigne ici les dignitaires qui entourent le roi; cette formulation exprime leur rang politique sans leur attribuer une fonction militaire précise.
- source_word: אֶתֵּן בְּיַד
  choice: je livrerai entre les mains de
  rationale: L’expression française rend naturellement l’idée de remettre quelqu’un au pouvoir d’un autre, tout en conservant l’image de la main et sa triple répétition.
- source_word: אֹיְבֵיהֶם
  choice: leurs ennemis
  rationale: Équivalent direct du nom pluriel avec suffixe de troisième personne du pluriel.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: ceux qui en veulent à leur vie
  rationale: Cette tournure française naturelle conserve la référence explicite à leur vie et exprime la menace de mort portée par l’idiome hébreu.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: les troupes du roi de Babylone
  rationale: חַיִל désigne ici une force militaire. Le pluriel collectif « troupes » s’accorde naturellement avec le participe hébreu pluriel הָעֹלִים.
- source_word: הָעֹלִים מֵעֲלֵיכֶם
  choice: qui se sont retirées de devant vous
  rationale: L’expression décrit les forces babyloniennes qui ont temporairement levé leur pression contre Jérusalem. « De devant vous » conserve quelque chose de l’image spatiale hébraïque sans produire une formulation obscure.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La triple reprise de « entre les mains de » reproduit l’insistance rhétorique de l’hébreu. « Hauts fonctionnaires » évite l’archaïsme et l’ambiguïté moderne de « princes », tandis que « troupes » rend le collectif militaire et l’accord pluriel du texte source.
