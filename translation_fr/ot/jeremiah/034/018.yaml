  text: וְ/נָתַתִּ֣י אֶת הָ/אֲנָשִׁ֗ים הָ/עֹֽבְרִים֙ אֶת בְּרִתִ֔/י אֲשֶׁ֤ר לֹֽא הֵקִ֨ימוּ֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרְת֖וּ לְ/פָנָ֑/י הָ/עֵ֨גֶל֙ אֲשֶׁ֣ר כָּרְת֣וּ לִ/שְׁנַ֔יִם וַ/יַּעַבְר֖וּ בֵּ֥ין בְּתָרָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/018.yaml
  text: And I will hand over the men who transgressed my covenant[a], who did not uphold the words of the covenant that they made before me[c][b], the calf that they cut in two and passed between its pieces.
translation:
  language: fr
  text: Je livrerai les hommes qui ont transgressé mon alliance[a], ceux qui n’ont pas respecté les paroles de l’alliance[b] qu’ils avaient conclue devant moi, comme le veau qu’ils avaient coupé en deux et entre les morceaux duquel ils étaient passés[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « qui ont violé mon alliance ». Le verbe hébreu signifie ici « transgresser », mais il fait écho au verbe « passer » employé plus loin pour leur passage entre les morceaux.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les paroles de l’alliance », c’est-à-dire ses engagements ou ses clauses.'
    reason: lexical_alternative
  - marker: c
    text: 'Couper un animal et passer entre ses morceaux faisait partie d’un rite de conclusion d’alliance : les participants appelaient symboliquement sur eux-mêmes un jugement semblable s’ils rompaient leur engagement. Voir Genèse 15.9-17.'
    reason: cultural_note
  - marker: d
    text: 'La phrase hébraïque est elliptique : elle ne contient pas de mot correspondant à « comme ». Dans ce contexte, le veau coupé exprime le sort auquel les hommes infidèles sont livrés; le verset suivant en précise les conséquences.'
    reason: textual_clarity
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je livrerai
  rationale: Dans ce contexte de jugement, נתן signifie remettre des personnes au pouvoir d’un autre. « Livrer » exprime naturellement cette valeur sans ajouter dans ce verset le destinataire, indiqué par la suite du passage.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le pluriel de אִישׁ désigne ici les hommes précis qui ont participé à l’engagement d’alliance; le terme masculin du texte source est donc conservé.
- source_word: הָעֹבְרִים אֶת־בְּרִיתִי
  choice: qui ont transgressé mon alliance
  rationale: Avec « alliance », עבר exprime une violation. « Transgressé » garde la force juridique et morale du verbe et permet de signaler en note son écho avec le passage physique entre les morceaux.
- source_word: לֹא הֵקִימוּ אֶת דִּבְרֵי הַבְּרִית
  choice: qui n’ont pas respecté les paroles de l’alliance
  rationale: הקים signifie ici maintenir ou exécuter les engagements. « Respecté » est naturel en français moderne, tandis que « les paroles de l’alliance » conserve l’expression concrète de l’hébreu plutôt que de la réduire silencieusement à « clauses ».
- source_word: אֲשֶׁר כָּרְתוּ לְפָנָי
  choice: qu’ils avaient conclue devant moi
  rationale: כרת ברית est l’expression idiomatique pour conclure une alliance. Le plus-que-parfait clarifie en français que cet acte précédait leur violation, et « devant moi » maintient l’idée de la présence et du témoignage divins.
- source_word: הָעֵגֶל אֲשֶׁר כָּרְתוּ לִשְׁנַיִם
  choice: le veau qu’ils avaient coupé en deux
  rationale: עגל désigne naturellement un veau ou un jeune bovin. La formulation garde l’image concrète du rite et l’emploi répété de כרת, rendu idiomatiquement par « conclure » pour l’alliance et littéralement par « couper » pour l’animal.
- source_word: וַיַּעַבְרוּ בֵּין בְּתָרָיו
  choice: et entre les morceaux duquel ils étaient passés
  rationale: Le verbe décrit ici le déplacement rituel réel entre les parties de l’animal. La tournure française maintient clairement le veau comme antécédent de « ses morceaux ».
theological_decisions:
- issue: Rapport syntaxique entre les hommes livrés et le veau coupé
  choice: Conserver la construction appositionnelle abrupte au moyen d’un tiret, sans introduire explicitement « comme » dans le texte principal.
  alternative: Expliciter la comparaison par « comme le veau » ou ajouter « je les traiterai comme le veau ».
  rationale: L’hébreu place « le veau » en reprise appositionnelle après de longues relatives, sans particule comparative. Le contexte immédiat fait comprendre que les violateurs subiront le sort invoqué par le rite, mais l’ajout de « comme » résoudrait une ellipse que le verset laisse formellement ouverte. Une note avertit donc le lecteur de la construction et de son implication contextuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Livrer », « transgresser » et « conclure une alliance » appartiennent au registre biblique courant sans archaïsme marqué. Les plus-que-parfaits rendent naturelle la chronologie des relatives en français. Le tiret conserve volontairement la tension et l’ellipse de la syntaxe hébraïque.
