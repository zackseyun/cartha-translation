  terminology: « Insensé » convient à סָכָל, qui relève de la déraison morale autant qu’intellectuelle. « Sans intelligence » transmet de manière idiomatique la valeur cognitive de לֵב; la note conserve avec justesse l’expression littérale « sans cœur » et son explication.
