source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֔את עַ֥ם סָכָ֖ל וְ/אֵ֣ין לֵ֑ב עֵינַ֤יִם לָ/הֶם֙ וְ/לֹ֣א יִרְא֔וּ אָזְנַ֥יִם לָ/הֶ֖ם וְ/לֹ֥א יִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/021.yaml
  text: Hear this now[a], foolish people without understanding, who have eyes but do not see, who have ears but do not hear.
translation:
  language: fr
  text: Écoutez donc ceci, peuple insensé et sans intelligence[a], eux qui ont des yeux et ne voient pas, des oreilles et n’entendent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « peuple insensé et sans cœur ». Ici, le « cœur » désigne la faculté de comprendre et de discerner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: Écoutez donc ceci
  rationale: L’impératif pluriel שִׁמְעוּ lance une sommation prophétique. « Écoutez » convient au français naturel et maintient l’écho avec le dernier verbe du verset ; « donc » rend la nuance d’insistance de נָא sans lui donner ici une politesse artificielle.
- source_word: עַם סָכָל
  choice: peuple insensé
  rationale: עַם désigne collectivement le peuple interpellé. סָכָל exprime une déraison morale et spirituelle ; « insensé » en conserve la portée sans réduire le propos à un manque d’intelligence.
- source_word: וְאֵין לֵב
  choice: et sans intelligence
  rationale: Dans cet idiome, לֵב, le « cœur », désigne notamment la faculté de comprendre et de discerner. La formulation française exprime ce sens tout en signalant la métaphore littérale en note.
- source_word: עֵינַיִם לָהֶם וְלֹא יִרְאוּ
  choice: vous qui avez des yeux, mais ne voyez pas
  rationale: Le passage de la tournure possessive hébraïque à une relative à la deuxième personne est naturel après l’apostrophe directe et conserve le contraste entre possession physique et absence de perception.
- source_word: אָזְנַיִם לָהֶם וְלֹא יִשְׁמָעוּ
  choice: des oreilles, mais n’entendez pas
  rationale: Cette formulation parallèle garde l’ironie prophétique et l’écho lexical entre l’ordre initial d’écouter et le constat final qu’ils n’entendent pas.
theological_decisions:
- issue: Valeur anthropologique de לֵב
  choice: sans intelligence
  alternative: sans cœur
  rationale: Le « cœur » hébraïque englobe ici la compréhension et le discernement moral. « Sans intelligence » communique cet idiome en français moderne sans importer une conception du cœur limitée aux émotions ; la formulation littérale reste indiquée en note.
- issue: Passage de la troisième personne hébraïque à l’adresse directe
  choice: vous qui avez… mais ne voyez pas… n’entendez pas
  alternative: ils ont des yeux, mais ne voient pas ; ils ont des oreilles, mais n’entendent pas
  rationale: Le peuple est directement interpellé au début du verset. La deuxième personne rend cette apostrophe cohérente en français, sans modifier l’identité du référent ni résoudre une ambiguïté théologique.
translation_notes:
  register: Français international moderne, direct et digne. La répétition de « mais » maintient le parallélisme hébraïque, tandis que « écoutez » et « n’entendez pas » conservent l’écho verbal du texte source.
