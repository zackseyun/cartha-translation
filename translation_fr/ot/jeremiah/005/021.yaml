    rationale: Le texte hébreu emploie des suffixes de troisième personne (« à eux ») et des verbes à la troisième personne plurielle (« ils ne voient pas », « ils n’entendent pas »). L’apostrophe initiale ne justifie pas de transformer ces propositions descriptives en « vous… ne voyez pas ». Il est préférable de préserver l’alternance présente dans la source.
