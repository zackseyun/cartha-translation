  text: הַגִּ֥ידוּ זֹ֖את בְּ/בֵ֣ית יַעֲקֹ֑ב וְ/הַשְׁמִיע֥וּ/הָ בִ/יהוּדָ֖ה לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/020.yaml
  text: 'Declare this in the house of Jacob[a], and proclaim it in Judah, saying:'
translation:
  language: fr
  text: 'Annoncez ceci dans la maison de Jacob et proclamez-le en Juda en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Annoncez
  rationale: L’impératif pluriel appelle une déclaration publique. « Annoncez » est naturel en français moderne tout en conservant la force solennelle du verbe.
- source_word: זֹאת
  choice: ceci
  rationale: Le démonstratif féminin singulier renvoie au message qui suit.
- source_word: בְּבֵית יַעֲקֹב
  choice: dans la maison de Jacob
  rationale: La formulation conserve l’image collective et traditionnelle de la « maison de Jacob », qui désigne le peuple issu de Jacob, ainsi que la valeur locative de la préposition.
- source_word: וְהַשְׁמִיעוּהָ
  choice: et proclamez-le
  rationale: La forme causative signifie littéralement « faites-le entendre ». « Proclamez-le » rend naturellement l’idée d’une diffusion publique et exprime le suffixe objet féminin, qui reprend l’annonce.
- source_word: בִיהוּדָה
  choice: en Juda
  rationale: 'La préposition a ici un sens locatif : la proclamation doit retentir sur le territoire ou parmi la population de Juda.'
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: Cet infinitif introduit la teneur de la proclamation donnée dans la suite.
