  text: שָׁמְנ֣וּ עָשְׁת֗וּ גַּ֚ם עָֽבְר֣וּ דִבְרֵי רָ֔ע דִּ֣ין לֹא דָ֔נוּ דִּ֥ין יָת֖וֹם וְ/יַצְלִ֑יחוּ וּ/מִשְׁפַּ֥ט אֶבְיוֹנִ֖ים לֹ֥א שָׁפָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/028.yaml
  text: They have grown fat[a]; they are sleek. They also have gone beyond evil words. They do not judge with justice the case of the fatherless, so that they might prosper[c][b], and they do not uphold the justice of the poor.
translation:
  language: fr
  text: Ils sont devenus gras et luisants. Ils ont même dépassé les bornes du mal.[a] Ils ne rendent pas justice à l’orphelin, pour qu’il prospère,[b] et ils ne font pas droit aux pauvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ont même dépassé des paroles — ou des choses — de mal »; l’expression peut aussi évoquer des actes mauvais.'
    reason: lexical_alternative
  - marker: b
    text: 'Le lien de cette proposition avec la précédente est difficile. L’orphelin est ici un terme collectif; on peut donc aussi traduire : « pour qu’ils prospèrent ». Le verbe peut encore être compris, selon une autre analyse, comme : « et pourtant ils prospèrent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְנוּ
  choice: ils sont devenus gras
  rationale: Le parfait qal décrit leur embonpoint comme le résultat d’une prospérité complaisante. L’image concrète et critique de l’hébreu est conservée.
- source_word: עָשְׁתוּ
  choice: et luisants
  rationale: Ce verbe rare, associé à l’embonpoint, évoque une apparence lisse ou luisante due à l’aisance. « Luisants » garde cette image sans l’expliquer excessivement.
- source_word: גַּם עָבְרוּ דִבְרֵי רָע
  choice: ils ont même dépassé toute limite dans le mal
  rationale: עבר exprime le franchissement d’une limite, tandis que דברי רע peut désigner des paroles, des faits ou des actes mauvais. La formulation française rend l’idée idiomatique d’un mal qui dépasse les bornes, et la littéralité ambiguë est signalée en note.
- source_word: דִּין לֹא דָנוּ דִּין יָתוֹם
  choice: ils ne rendent pas justice dans la cause de l’orphelin
  rationale: La construction apparentée nom-verbe insiste sur l’acte judiciaire. « Cause » conserve la dimension juridique, et « orphelin » est le terme français courant pour un enfant privé de père ou de parents.
- source_word: וְיַצְלִיחוּ
  choice: et pourtant ils prospèrent
  rationale: Le verbe signifie réussir ou prospérer. Le lien syntaxique avec la proposition précédente est difficile; la tournure concessive produit un français naturel tout en maintenant le contraste, les autres analyses étant données en note.
- source_word: וּמִשְׁפַּט אֶבְיוֹנִים לֹא שָׁפָטוּ
  choice: ils ne font pas droit aux pauvres
  rationale: « Faire droit à » exprime naturellement en français la reconnaissance et la défense du droit légal des personnes démunies, tout en conservant la force judiciaire de מִשְׁפָּט et שׁפט.
theological_decisions:
- issue: Sens de יָתוֹם
  choice: l’orphelin
  alternative: l’enfant privé de père
  rationale: Le mot hébreu vise particulièrement celui qui n’a plus de père, mais « orphelin » est la désignation juridique et sociale naturelle en français moderne. Aucun élargissement doctrinal n’est introduit.
- issue: Rapport syntaxique de וְיַצְלִיחוּ avec la cause de l’orphelin
  choice: 'lecture concessive : « et pourtant ils prospèrent »'
  alternative: 'lecture finale : « afin qu’ils prospèrent »; ou rattachement à la cause : « pour qu’elle aboutisse »'
  rationale: La syntaxe massorétique est comprimée et permet plusieurs rapports logiques. Le texte principal conserve le contraste prophétique le plus intelligible, tandis que la note maintient les autres lectures possibles sans trancher silencieusement.
translation_notes:
  register: Français international moderne, sobre et prophétique. Les expressions « dépasser toute limite », « rendre justice dans la cause de » et « faire droit à » rendent le langage judiciaire accessible sans effacer sa force. Les images physiques de l’hébreu sont maintenues.
