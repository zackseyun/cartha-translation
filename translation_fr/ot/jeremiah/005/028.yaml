  naturalness: Le français est globalement naturel et de registre prophétique sobre. « Rendre justice à l’orphelin » est plus idiomatique et plus direct que « rendre justice dans la cause de l’orphelin », tout en conservant le sens judiciaire.
  terminology: « Orphelin », « rendre justice » et « faire droit aux pauvres » conviennent au français international moderne et au vocabulaire juridique du verset. « Gras et luisants » maintient l’image corporelle volontairement critique de l’hébreu.
