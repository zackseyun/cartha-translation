  to: Ils sont devenus gras et luisants. Ils ont même dépassé les bornes du mal.[a] Ils ne rendent pas justice à l’orphelin, pour qu’il prospère,[b] et ils ne font pas droit aux pauvres.
  rationale: La révision conserve les images et la critique sociale du texte, mais remplace la lecture concessive imposée par une construction qui reflète plus directement la lecture traditionnelle de la séquence hébraïque. La note explicite que « l’orphelin » peut être collectif et préserve l’autre analyse syntaxique. Les deux notes restent ancrées aux emplacements pertinents.
