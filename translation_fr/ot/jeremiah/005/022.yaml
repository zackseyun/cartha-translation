  text: הַ/אוֹתִ֨/י לֹא תִירָ֜אוּ נְאֻם יְהֹוָ֗ה אִ֤ם מִ/פָּנַ/י֙ לֹ֣א תָחִ֔ילוּ אֲשֶׁר שַׂ֤מְתִּי חוֹל֙ גְּב֣וּל לַ/יָּ֔ם חָק עוֹלָ֖ם וְ/לֹ֣א יַעַבְרֶ֑/נְהוּ וַ/יִּֽתְגָּעֲשׁוּ֙ וְ/לֹ֣א יוּכָ֔לוּ וְ/הָמ֥וּ גַלָּ֖י/ו וְ/לֹ֥א יַעַבְרֻֽ/נְהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/022.yaml
  text: Do you not fear me? declares Yahweh[a]. Do you not tremble before me, he who set the sand as a boundary for the sea, an everlasting decree that it cannot cross? Though its waves toss, they cannot prevail; though they roar[b], they cannot cross it.
translation:
  language: fr
  text: « Ne me craignez-vous pas ? déclare Yahweh. Ne tremblez-vous pas devant moi, moi qui ai placé le sable comme limite pour la mer, comme barrière perpétuelle qu’elle ne peut franchir ? Ses vagues ont beau s’agiter, elles ne peuvent rien ; elles ont beau mugir, elles ne franchissent pas cette barrière. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹתִי לֹא תִירָאוּ
  choice: Ne me craignez-vous pas ?
  rationale: La particule interrogative introduit une question rhétorique. « Craindre » conserve ici à la fois l’idée de crainte et celle de respect soumis.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique solennelle est rendue naturellement, et le tétragramme est translittéré comme nom propre.
- source_word: אִם מִפָּנַי לֹא תָחִילוּ
  choice: Ne tremblez-vous pas devant moi
  rationale: Le verbe חיל peut évoquer le tremblement, les convulsions ou l’angoisse ; en parallèle avec « craindre », « trembler » convient au contexte.
- source_word: אֲשֶׁר שַׂמְתִּי
  choice: moi qui ai placé
  rationale: Le relatif renvoie au locuteur divin. La reprise « moi qui » rend clairement l’auto-désignation emphatique de l’hébreu sans passer artificiellement à la troisième personne.
- source_word: חוֹל גְּבוּל לַיָּם
  choice: le sable comme limite à la mer
  rationale: La construction signifie que le sable est établi comme frontière de la mer ; « limite » est courant et précis en français.
- source_word: חָק עוֹלָם
  choice: prescription perpétuelle
  rationale: חֹק désigne ce qui est fixé, prescrit ou décrété. « Prescription » préserve cette idée, tandis que « perpétuelle » exprime la durée de עוֹלָם.
- source_word: וְלֹא יַעַבְרֶנְהוּ
  choice: qu’elle ne franchira pas
  rationale: Le sujet est la mer et le suffixe renvoie vraisemblablement à la limite fixée. Le futur français exprime bien la permanence de l’ordre.
- source_word: וַיִּתְגָּעֲשׁוּ וְלֹא יוּכָלוּ
  choice: Ses vagues ont beau s’agiter, elles ne peuvent rien
  rationale: La tournure concessive rend l’opposition contextuelle. יכל est laissé sans complément explicite dans l’hébreu ; « ne peuvent rien » conserve cette ellipse mieux que « ne peuvent l’emporter », qui préciserait davantage l’implicite.
- source_word: וְהָמוּ גַלָּיו
  choice: elles ont beau mugir
  rationale: המה décrit le bruit tumultueux des vagues. « Mugir » est une expression française naturelle et digne pour le grondement de la mer.
- source_word: וְלֹא יַעַבְרֻנְהוּ
  choice: elles ne la franchiront pas
  rationale: La répétition de « franchir » reproduit celle du verbe עבר ; le pronom féminin renvoie naturellement à « limite ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom personnel. La translittération conserve cette fonction sans le remplacer par un titre.
- issue: Référent et personne de אֲשֶׁר שַׂמְתִּי
  choice: moi qui ai placé
  alternative: lui qui a placé
  rationale: Le verbe hébreu est explicitement à la première personne. Le français garde donc la voix directe de Yahweh plutôt que d’introduire un passage à la troisième personne.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme rhétorique est conservé, ainsi que la répétition finale de « franchir ». Aucune note n’est nécessaire, car les ambiguïtés pertinentes peuvent être respectées directement dans le texte.
