base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/025.yaml
  text: Your iniquities have turned these away[b][a], and your sins have withheld the good from you.
translation:
  language: fr
  text: Vos iniquités ont détourné ces choses[a], et vos péchés vous ont privés du bien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux-ci » ou « ces choses ». Le démonstratif renvoie à ce qui vient d’être mentionné dans le contexte précédent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de ce qui est bon », « des biens » ou « du bien-être ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנוֹתֵיכֶם
  choice: vos fautes
  rationale: Le terme עָוֹן désigne des actes coupables et peut aussi évoquer la culpabilité qui en découle. « Fautes » conserve ici le poids moral tout en restant naturel et en se distinguant de « péchés » dans le second membre.
- source_word: הִטּוּ
  choice: ont détourné
  rationale: Le hifil de נטה exprime ici l’idée de faire dévier ou d’écarter. « Ont détourné » rend directement l’action exercée sur les bienfaits évoqués par le contexte.
- source_word: אֵלֶּה
  choice: ces bienfaits
  rationale: Le démonstratif renvoie aux bienfaits mentionnés dans les versets précédents, notamment les pluies saisonnières et les récoltes. Le français exige plus naturellement un nom après « ces » ; « bienfaits » explicite minimalement le référent contextuel sans le limiter aux seules pluies.
- source_word: וְחַטֹּאותֵיכֶם
  choice: et vos péchés
  rationale: חַטָּאת est le terme courant pour le péché ou la faute. « Péchés » est clair, digne et maintient une variation lexicale par rapport à עֲוֺנוֹתֵיכֶם.
- source_word: מָנְעוּ
  choice: vous ont privés
  rationale: מנע exprime le fait de retenir ou d’empêcher quelqu’un de recevoir quelque chose. La construction française « priver quelqu’un de » restitue naturellement la relation de dépossession indiquée par מִכֶּם.
- source_word: הַטּוֹב
  choice: du bonheur
  rationale: Le substantif adjectival singulier avec article peut désigner collectivement ce qui est bon, les biens ou le bien-être. « Bonheur » garde ici une portée large, incluant prospérité et bienfaits, sans réduire le sens à des possessions matérielles.
- source_word: מִכֶּם
  choice: vous ont privés de
  rationale: La préposition מן marque la séparation ou la privation. Elle est intégrée idiomatiquement à la construction française « priver de ».
theological_decisions:
- issue: Identification du référent de אֵלֶּה
  choice: Rendre le démonstratif par « ces bienfaits » tout en signalant en note la formulation plus littérale.
  alternative: « ces choses » ou, de manière plus précise, « ces pluies »
  rationale: L’hébreu garde le référent implicite, mais le français ne permet pas naturellement « ont détourné ces ». « Bienfaits » reprend le contexte sans trancher exclusivement entre les pluies, les saisons réglées et les récoltes.
- issue: Portée de הַטּוֹב
  choice: « le bonheur », au sens large du bien et du bien-être accordés
  alternative: « les bonnes choses », « les biens » ou « ce qui est bon »
  rationale: Le singulier hébreu peut être abstrait ou collectif. « Bonheur » conserve cette amplitude et évite de limiter le propos à la prospérité matérielle ; une note présente l’autre rendu possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux membres est conservé, ainsi que la distinction entre « fautes » et « péchés ». Les notes préservent l’indétermination du démonstratif et l’étendue sémantique de הַטּוֹב.
