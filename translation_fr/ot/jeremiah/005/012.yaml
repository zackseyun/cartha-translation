source:
  edition: WLC
  text: כִּֽחֲשׁוּ֙ בַּ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֹא ה֑וּא וְ/לֹא תָב֤וֹא עָלֵ֨י/נוּ֙ רָעָ֔ה וְ/חֶ֥רֶב וְ/רָעָ֖ב ל֥וֹא נִרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/012.yaml
  text: They have denied Yahweh and said, “He is not there, and no disaster will come upon us; we will not see sword or famine.”
translation:
  language: fr
  text: 'Ils ont renié Yahweh et ont dit : « Il n’est pas[a], et aucun malheur ne nous atteindra ; nous ne verrons ni l’épée ni la famine. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce n’est pas lui » ou « Il ne fera rien ». L’hébreu est bref et elliptique.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּחֲשׁוּ בַּיהוָה
  choice: Ils ont renié Yahweh
  rationale: Avec la préposition ב, le verbe כחשׁ exprime ici le fait de renier Yahweh ou d’agir faussement envers lui. « Renié » rend la répudiation exprimée par les paroles qui suivent.
- source_word: לֹא הוּא
  choice: Il n’est pas là
  rationale: La formule hébraïque est très brève et elliptique. Cette traduction naturelle en français conserve le sujet personnel sans préciser indûment s’il s’agit de l’existence, de la présence ou de l’action de Yahweh.
- source_word: רָעָה
  choice: malheur
  rationale: Dans ce contexte de jugement prophétique, רָעָה désigne un malheur ou une calamité, non le mal moral.
- source_word: חֶרֶב
  choice: l’épée
  rationale: La traduction concrète préserve l’image biblique de la violence guerrière.
- source_word: רָעָב
  choice: la famine
  rationale: Le terme désigne ici la famine collective, et non simplement la faim individuelle.
- source_word: לֹא נִרְאֶה
  choice: nous ne connaîtrons
  rationale: Littéralement « nous ne verrons pas » ; en français, « connaître » exprime naturellement le fait de ne pas subir ou éprouver ces fléaux.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le nom propre de l’alliance est translittéré afin de conserver sa fonction de nom divin dans le texte source.
- issue: Sens de la formule elliptique לֹא הוּא
  choice: Il n’est pas là
  alternative: Ce n’est pas lui ; Il ne fera rien
  rationale: L’hébreu peut nier la présence, la réalité effective ou l’intervention de Yahweh. Le texte principal garde cette indétermination autant que le permet un français naturel, et la note signale les autres lectures.
translation_notes:
  register: Français moderne, international et digne. « Aucun malheur ne nous atteindra » évite une tournure lourde tout en rendant l’idée de venue sur eux ; « nous ne connaîtrons » explicite idiomatiquement l’expérience des fléaux.
