id: JER.5.10
reference: Jeremiah 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲל֤וּ בְ/שָׁרוֹתֶ֨י/הָ֙ וְ/שַׁחֵ֔תוּ וְ/כָלָ֖ה אַֽל תַּעֲשׂ֑וּ הָסִ֨ירוּ֙ נְטִ֣ישׁוֹתֶ֔י/הָ כִּ֛י ל֥וֹא לַ/יהוָ֖ה הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/010.yaml
  text: Go up through her vine-rows and destroy[a], but do not make a full end. Remove her branches[b], for they are not Yahweh’s.
translation:
  language: fr
  text: Montez parmi ses rangées de vignes et détruisez[a], mais ne l’anéantissez pas entièrement. Enlevez ses sarments[b], car ils n’appartiennent pas à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Montez sur ses murailles et détruisez. » Le terme hébreu rendu par « parmi ses rangées de vignes » est difficile; certains comprennent l’image comme architecturale plutôt que viticole.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Enlevez ses pousses » ou « ses vrilles ». L’hébreu peut prolonger la métaphore de la vigne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ
  choice: Montez
  rationale: L’impératif pluriel de עלה commande aux assaillants de monter. « Montez » conserve le mouvement militaire sans ajouter explicitement « contre elle ».
- source_word: בְשָׁרוֹתֶיהָ
  choice: parmi ses rangées de vignes
  rationale: Le terme hébreu est difficile et discuté. Le contexte immédiat, notamment les « sarments », favorise une image viticole; « parmi » rend naturellement la préposition ב sans imposer un déplacement précis.
- source_word: וְשַׁחֵתוּ
  choice: et détruisez
  rationale: L’impératif de שׁחת exprime une action forte de destruction; « détruisez » est direct et naturel.
- source_word: וְכָלָה אַל תַּעֲשׂוּ
  choice: mais ne l’anéantissez pas entièrement
  rationale: L’expression idiomatique interdit une destruction totale. Cette formulation française actuelle préserve la tension entre le jugement ordonné et la limite qui lui est imposée.
- source_word: הָסִירוּ
  choice: Enlevez
  rationale: L’impératif signifie faire disparaître ou ôter. « Enlevez » convient aussi bien aux sarments qu’à l’autre interprétation possible de l’image.
- source_word: נְטִישׁוֹתֶיהָ
  choice: ses sarments
  rationale: Dans la lecture viticole retenue, « sarments » désigne naturellement les rameaux de la vigne et maintient la cohérence de la métaphore.
- source_word: כִּי לֹא לַיהוָה הֵמָּה
  choice: car ils n’appartiennent pas à Yahweh
  rationale: La construction avec ל exprime ici l’appartenance ou la relation. Le pluriel renvoie le plus naturellement aux sarments; le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de l’interdiction וְכָלָה אַל תַּעֲשׂוּ
  choice: ne l’anéantissez pas entièrement
  alternative: ne faites pas une destruction complète
  rationale: La traduction retenue exprime clairement en français l’interdiction d’une destruction totale, sans expliquer davantage la raison théologique de cette limite.
translation_notes:
  register: Français international moderne, digne et direct. La métaphore viticole est retenue dans le texte principal, tandis que l’interprétation architecturale et les nuances lexicales sont conservées en notes. Le contraste entre destruction et préservation partielle demeure explicite.
