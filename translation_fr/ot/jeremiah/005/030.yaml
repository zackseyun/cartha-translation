  text: שַׁמָּה֙ וְ/שַׁ֣עֲרוּרָ֔ה נִהְיְתָ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/030.yaml
  text: An appalling and horrible thing has happened in the land:[a]
translation:
  language: fr
  text: Une chose effroyable et monstrueuse s’est produite dans le pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une horreur, une chose révoltante, s’est produite dans le pays. »
    reason: Les deux noms hébreux peuvent être rendus plus littéralement comme deux désignations coordonnées de l’événement terrifiant et scandaleux.
lexical_decisions:
- source_word: שַׁמָּה
  choice: une chose effroyable
  rationale: Le nom désigne ici quelque chose qui provoque l’effroi ou la consternation. Cette formulation concrète et naturelle restitue sa force sans lui donner le sens plus contextuel de « dévastation ».
- source_word: וְשַׁעֲרוּרָה
  choice: et monstrueuse
  rationale: Le terme évoque une réalité horrible, choquante ou révoltante. « Monstrueuse » renforce « effroyable » tout en conservant le caractère exceptionnel et scandaleux de ce qui s’est produit.
- source_word: נִהְיְתָה
  choice: s’est produite
  rationale: La forme de היה exprime ici la survenue d’un événement ou d’un état de fait. « S’est produite » est idiomatique en français et conserve l’aspect accompli.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte prophétique, הָאָרֶץ renvoie au pays concerné, vraisemblablement Juda, plutôt qu’à la terre entière. « Dans le pays » est naturel et évite une portée universelle injustifiée.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et solennel. La coordination intensive des deux termes hébreux est conservée sous une forme idiomatique.
