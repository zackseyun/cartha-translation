id: JER.5.1
reference: Jeremiah 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שׁוֹטְט֞וּ בְּ/חוּצ֣וֹת יְרוּשָׁלִַ֗ם וּ/רְאוּ נָ֤א וּ/דְעוּ֙ וּ/בַקְשׁ֣וּ בִ/רְחוֹבוֹתֶ֔י/הָ אִם תִּמְצְא֣וּ אִ֔ישׁ אִם יֵ֛שׁ עֹשֶׂ֥ה מִשְׁפָּ֖ט מְבַקֵּ֣שׁ אֱמוּנָ֑ה וְ/אֶסְלַ֖ח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/001.yaml
  text: Roam through the streets of Jerusalem[a], and please look and know, and search in her squares, whether you can find a man, whether there is one who does justice, who seeks faithfulness[b], and I will forgive her.
translation:
  language: fr
  text: Parcourez en tous sens les rues de Jérusalem ; regardez donc, constatez et cherchez sur ses places si vous trouvez un homme[a], s’il y en a un qui pratique la justice et recherche la fidélité[b] ; et je pardonnerai à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « un homme » : le singulier masculin hébreu souligne qu’on ne pourrait trouver ne serait-ce qu’une seule personne répondant à cette description.'
    reason: lexical_alternative
  - marker: b
    text: Ou « la vérité ». Le mot hébreu peut désigner la fidélité, la fiabilité ou la véracité.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹטְטוּ
  choice: Parcourez en tous sens
  rationale: L’impératif évoque un déplacement étendu et attentif à travers la ville. Cette formulation naturelle conserve l’idée d’aller çà et là dans le cadre d’une recherche.
- source_word: בְּחוּצוֹת
  choice: les rues
  rationale: Dans ce contexte urbain, חוּצוֹת désigne les rues ou espaces extérieurs de la ville.
- source_word: וּרְאוּ נָא
  choice: regardez donc
  rationale: « Donc » rend ici la nuance d’exhortation portée par נָא sans donner à l’ordre une politesse artificielle.
- source_word: וּדְעוּ
  choice: constatez
  rationale: Le verbe signifie littéralement « sachez », mais désigne ici le fait de vérifier et de reconnaître la situation réelle. « Constatez » est idiomatique dans cette suite d’impératifs.
- source_word: וּבַקְשׁוּ
  choice: cherchez
  rationale: Le verbe exprime une recherche délibérée et approfondie.
- source_word: בִּרְחוֹבוֹתֶיהָ
  choice: sur ses places
  rationale: רְחֹבוֹת désigne les larges espaces publics ou places d’une ville. Le possessif maintient le renvoi féminin à Jérusalem.
- source_word: אִם תִּמְצְאוּ אִישׁ
  choice: si vous trouvez un homme
  rationale: La formulation conserve le singulier masculin אִישׁ et l’idée rhétorique qu’il suffirait d’en trouver un seul.
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: qui pratique la justice
  rationale: Cette expression française naturelle décrit une conduite conforme à la justice, comme le fait la tournure hébraïque.
- source_word: מְבַקֵּשׁ אֱמוּנָה
  choice: recherche la fidélité
  rationale: אֱמוּנָה peut désigner la fidélité, la fiabilité ou la vérité. « Fidélité » conserve ici sa dimension morale et relationnelle.
- source_word: וְאֶסְלַח לָהּ
  choice: alors je lui pardonnerai
  rationale: Le pronom féminin renvoie à Jérusalem personnifiée. « Alors » explicite en français la conséquence conditionnelle exprimée par l’enchaînement hébreu.
theological_decisions:
- issue: Portée du singulier masculin אִישׁ
  choice: un homme
  alternative: quelqu’un
  rationale: Le texte hébreu emploie explicitement un nom masculin singulier, tout en lui donnant une portée représentative. Le texte principal maintient cette forme et la note en précise le sens.
- issue: Sens de אֱמוּנָה dans ce contexte éthique
  choice: fidélité
  alternative: vérité
  rationale: Le terme recouvre la fidélité, la fiabilité et la véracité. « Fidélité » rend bien la constance morale et relationnelle, tandis que « vérité » demeure une possibilité authentique signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La succession énergique des impératifs et la personnification féminine de Jérusalem sont conservées, avec une ponctuation qui rend lisible la longue phrase hébraïque.
