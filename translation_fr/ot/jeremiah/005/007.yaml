  text: אֵ֤י לָ/זֹאת֙ אסלוח לָ֔/ךְ בָּנַ֣יִ/ךְ עֲזָב֔וּ/נִי וַ/יִּשָּׁבְע֖וּ בְּ/לֹ֣א אֱלֹהִ֑ים וָ/אַשְׂבִּ֤עַ אוֹתָ/ם֙ וַ/יִּנְאָ֔פוּ וּ/בֵ֥ית זוֹנָ֖ה יִתְגֹּדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/007.yaml
  text: How can I forgive you for this? Your children have forsaken me and have sworn by those that are not gods[a]. When I had fed them to the full[b], they committed adultery and crowded into a prostitute’s house.
translation:
  language: fr
  text: Comment te pardonnerais-je pour cela ? Tes enfants m’ont abandonné et ont juré par ceux qui ne sont pas des dieux. Je les ai rassasiés, et ils ont commis l’adultère et se sont attroupés dans la maison d’une prostituée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se sont rassemblés en bandes dans la maison d’une prostituée ».'
    reason: Le verbe hébreu peut évoquer un rassemblement en foule ou en bandes.
lexical_decisions:
- source_word: אֵי לָזֹאת אֶסְלַח לָךְ
  choice: Comment pourrais-je te pardonner cela ?
  rationale: La tournure interrogative exprime l’incrédulité devant la possibilité de pardonner. Le singulier « te » conserve l’adresse hébraïque à une entité collective féminine.
- source_word: בָּנַיִךְ עֲזָבוּנִי
  choice: Tes enfants m’ont abandonné
  rationale: « Enfants » rend la valeur collective de בנים sans limiter le propos aux hommes ; « abandonné » exprime clairement la rupture de fidélité.
- source_word: וַיִּשָּׁבְעוּ בְּלֹא אֱלֹהִים
  choice: ont juré par ceux qui ne sont pas des dieux
  rationale: Cette formulation naturelle conserve la portée polémique de l’hébreu envers les prétendues divinités invoquées dans les serments.
- source_word: וָאַשְׂבִּעַ אוֹתָם
  choice: Je les ai rassasiés
  rationale: La lecture issue de שבע, « rassasier », convient au contraste entre les bienfaits accordés par Dieu et l’infidélité du peuple. Une autre vocalisation ou analyse liée au serment demeure possible et est signalée en note.
- source_word: וַיִּנְאָפוּ
  choice: ils ont commis l’adultère
  rationale: Le rendu direct préserve à la fois le sens sexuel et sa possible portée métaphorique d’infidélité envers Dieu.
- source_word: וּבֵית זוֹנָה יִתְגֹּדָדוּ
  choice: se sont attroupés dans la maison d’une prostituée
  rationale: « Se sont attroupés » rend l’idée de se rassembler en groupe ; « maison d’une prostituée » reste concret et moderne sans déterminer s’il s’agit d’un lieu typique ou collectif.
theological_decisions:
- issue: Adultère littéral ou métaphorique
  choice: Conserver « commis l’adultère » sans explicitation.
  alternative: Préciser qu’il s’agit d’idolâtrie ou, inversement, uniquement d’inconduite sexuelle.
  rationale: Le langage prophétique peut superposer infidélité sexuelle et infidélité envers Dieu ; la traduction ne tranche pas ce que le texte laisse en tension.
- issue: Identité et nombre du destinataire
  choice: Employer le singulier « te » puis le pluriel « tes enfants ».
  alternative: Nommer explicitement Jérusalem ou Juda, ou employer partout un pluriel.
  rationale: L’hébreu adresse une entité collective féminine au singulier et parle ensuite de ses membres au pluriel ; aucun nom propre ne doit être ajouté.
- issue: Sens de וָאַשְׂבִּיעַ
  choice: Lire « je les ai rassasiés ».
  alternative: Lire « je leur ai fait prêter serment ».
  rationale: Le contexte met probablement en contraste la générosité divine et l’infidélité humaine, mais l’autre analyse morphologique est assez significative pour être conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Abandonné » est préféré à « délaissé » pour son naturel actuel ; « prostituée » évite l’archaïsme de « courtisane » ou « prostituée sacrée », cette dernière précision n’étant pas présente dans le texte. Les deux marqueurs de note figurent dans le corps du verset.
