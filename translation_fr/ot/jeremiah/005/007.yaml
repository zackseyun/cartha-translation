  terminology: « Enfants », « abandonné », « ceux qui ne sont pas des dieux », « rassasiés », « commis l’adultère » et « prostituée » sont appropriés. « Se sont attroupés » exprime convenablement l’idée d’un regroupement, sans imposer une interprétation cultuelle ou métaphorique.
