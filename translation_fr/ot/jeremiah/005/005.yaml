id: JER.5.5
reference: Jeremiah 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵֽלֲכָה לִּ֤/י אֶל הַ/גְּדֹלִים֙ וַ/אֲדַבְּרָ֣ה אוֹתָ֔/ם כִּ֣י הֵ֗מָּה יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶ֑ם אַ֣ךְ הֵ֤מָּה יַחְדָּו֙ שָׁ֣בְרוּ עֹ֔ל נִתְּק֖וּ מוֹסֵרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/005.yaml
  text: I will go to the great men and speak to them[a], for they know the way of Yahweh, the justice of their God. But they too, together, have broken the yoke; they have torn off the bonds.
translation:
  language: fr
  text: J’irai trouver les grands et je leur parlerai, car eux, ils connaissent le chemin de Yahweh, le droit de leur Dieu[a]. Mais eux aussi, tous ensemble, ont brisé le joug et rompu les liens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la justice de leur Dieu », « le jugement de leur Dieu » ou « la règle de leur Dieu ». Le mot hébreu peut désigner le droit, la justice, un jugement ou une exigence juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֲכָה לִּי
  choice: J’irai trouver
  rationale: Le cohortatif, accompagné du datif éthique לִי, exprime une résolution. « J’irai trouver » rend naturellement en français le mouvement vers les personnes visées.
- source_word: הַגְּדֹלִים
  choice: les grands
  rationale: Dans le contraste avec les pauvres du contexte précédent, le terme désigne les personnes socialement importantes ou puissantes. « Les grands » conserve ce contraste sans préciser indûment qu’il s’agit de dirigeants officiels.
- source_word: וַאֲדַבְּרָה אוֹתָם
  choice: et je leur parlerai
  rationale: Le second cohortatif poursuit l’intention résolue du locuteur. La formulation est claire, naturelle et digne.
- source_word: דֶּרֶךְ יְהוָה
  choice: le chemin de Yahweh
  rationale: « Chemin » conserve l’image hébraïque courante de la conduite ou de la volonté divine, sans la réduire à une seule interprétation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: le droit établi par leur Dieu
  rationale: מִשְׁפָּט couvre ici le champ de la justice, du jugement et de la règle normative. « Le droit établi par leur Dieu » exprime la dimension juridico-normative tout en laissant les autres nuances en note.
- source_word: אַךְ
  choice: Mais
  rationale: La conjonction introduit un contraste marqué entre ce que le locuteur attend des grands et leur conduite réelle.
- source_word: הֵמָּה יַחְדָּו
  choice: eux aussi, tous ensemble
  rationale: « Eux aussi » marque leur participation à la faute déjà constatée, et « tous ensemble » conserve la portée collective de יַחְדָּו.
- source_word: שָׁבְרוּ עֹל
  choice: ont brisé le joug
  rationale: La traduction conserve l’image concrète du joug et la violence de son rejet sans en imposer une explication doctrinale.
- source_word: נִתְּקוּ מוֹסֵרוֹת
  choice: rompu les liens
  rationale: « Rompre les liens » restitue le parallélisme avec le joug et l’idée d’une libération violente de contraintes.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve directement au lieu de le remplacer par un titre traditionnel.
- issue: Sens de מִשְׁפַּט אֱלֹהֵיהֶם
  choice: le droit établi par leur Dieu, avec une note signalant l’ambiguïté
  alternative: la justice de leur Dieu / le jugement de leur Dieu / l’ordonnance de leur Dieu
  rationale: Le substantif hébreu possède une gamme de sens juridique et éthique que le contexte ne réduit pas avec certitude à une seule nuance. La note préserve cette pluralité.
- issue: Image du joug et des liens
  choice: Conserver les métaphores concrètes
  alternative: Expliciter comme un rejet de la loi ou de l’autorité de Dieu
  rationale: Le texte ne définit pas ici précisément la portée du joug et des liens. Garder les images préserve leur tension morale, sociale et liée à l’alliance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition « eux » est maintenue pour refléter l’emphase hébraïque; les métaphores du joug et des liens restent intactes.
