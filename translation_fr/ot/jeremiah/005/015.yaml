id: JER.5.15
reference: Jeremiah 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִ֣י מֵבִיא֩ עֲלֵי/כֶ֨ם גּ֧וֹי מִ/מֶּרְחָ֛ק בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהֹוָ֑ה גּ֣וֹי אֵיתָ֣ן ה֗וּא גּ֤וֹי מֵ/עוֹלָם֙ ה֔וּא גּ֚וֹי לֹא תֵדַ֣ע לְשֹׁנ֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע מַה יְדַבֵּֽר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/015.yaml
  text: Look[a], I am bringing against you a nation from far away, O house of Israel, declares Yahweh. It is a mighty nation; it is an ancient nation[b], a nation whose language you do not know[c], and whose speech you do not understand.
translation:
  language: fr
  text: « Voici que je fais venir contre vous une nation venue de loin, maison d’Israël, déclare Yahweh. C’est une nation puissante[a], une nation ancienne[b], une nation dont vous ne connaissez pas la langue[c] et dont vous ne comprenez pas les paroles. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « forte » ou « solidement établie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une nation qui existe depuis les temps anciens ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dont vous ne connaissez pas la langue et vous ne comprenez pas ce qu’elle dit ».'
    reason: source_form
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici que je
  rationale: Introduit avec solennité l’annonce divine tout en restant naturel en français moderne.
- source_word: מֵבִיא עֲלֵיכֶם
  choice: je fais venir contre vous
  rationale: Le participe présente une action imminente; « contre vous » exprime la valeur hostile de עַל dans ce contexte de jugement.
- source_word: גּוֹי
  choice: nation
  rationale: Rend l’entité politique et ethnique et permet de conserver la répétition rhétorique du terme.
- source_word: מִמֶּרְחָק
  choice: venue de loin
  rationale: Expression française naturelle qui conserve l’idée de distance et la menace d’une invasion étrangère.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Conserve l’appellation collective traditionnelle et sa fonction d’apostrophe.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend clairement la formule prophétique et conserve le nom divin personnel.
- source_word: גּוֹי אֵיתָן
  choice: une nation puissante
  rationale: אֵיתָן peut évoquer la force, la fermeté ou la permanence; dans le contexte d’une invasion, « puissante » exprime naturellement son caractère redoutable sans effacer les autres possibilités, signalées en note.
- source_word: גּוֹי מֵעוֹלָם
  choice: une nation ancienne
  rationale: מֵעוֹלָם renvoie ici à une existence remontant à un passé lointain, non à l’éternité.
- source_word: לֹא תֵדַע לְשֹׁנוֹ
  choice: dont vous ne connaissez pas la langue
  rationale: « Langue » communique idiomatiquement le sens de לָשׁוֹן dans ce contexte.
- source_word: וְלֹא תִשְׁמַע מַה יְדַבֵּר
  choice: et dont vous ne comprenez pas les paroles
  rationale: שׁמע désigne ici l’écoute aboutissant à la compréhension; « les paroles » rend naturellement ce que cette nation dit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition de « nation » est maintenue pour préserver l’insistance rhétorique. Le texte principal emploie « vous » de manière cohérente en français, tandis qu’une note signale le passage hébreu au singulier collectif.
