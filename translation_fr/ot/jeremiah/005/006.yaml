language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּן֩ הִכָּ֨/ם אַרְיֵ֜ה מִ/יַּ֗עַר זְאֵ֤ב עֲרָבוֹת֙ יְשָׁדְדֵ֔/ם נָמֵ֤ר שֹׁקֵד֙ עַל עָ֣רֵי/הֶ֔ם כָּל הַ/יּוֹצֵ֥א מֵ/הֵ֖נָּה יִטָּרֵ֑ף כִּ֤י רַבּוּ֙ פִּשְׁעֵי/הֶ֔ם עָצְמ֖וּ משבותי/הם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/006.yaml
  text: Therefore a lion from the forest strikes them down[a]; a wolf of the deserts devastates them; a leopard keeps watch over their cities. Everyone who goes out from them will be torn apart, because their transgressions are many[b]; their apostasies have grown strong.
translation:
  language: fr
  text: C’est pourquoi un lion venu de la forêt les abat ; un loup des steppes[a] les ravage ; un léopard guette leurs villes. Quiconque en sort sera mis en pièces, car leurs rébellions sont nombreuses et leurs apostasies[b] se sont renforcées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un loup du soir ». L’expression hébraïque peut aussi être comprise en lien avec le soir et la prédation nocturne ; elle désigne plus directement ici les plaines arides ou les steppes.
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs infidélités » ou « leurs retours en arrière ». Le terme hébreu évoque des détournements répétés de la fidélité due à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּם
  choice: les abat
  rationale: Le verbe נכה désigne ici un coup violent, potentiellement mortel. Le présent donne en français une scène de jugement vive et cohérente avec les formes verbales suivantes, sans réduire l’action à une simple attaque.
- source_word: אַרְיֵה מִיַּעַר
  choice: un lion venu de la forêt
  rationale: Cette formulation conserve l’image concrète du prédateur et son lieu d’origine tout en étant naturelle en français.
- source_word: זְאֵב עֲרָבוֹת
  choice: un loup des steppes
  rationale: עֲרָבוֹת peut désigner des plaines arides ou des régions de steppe. « Des steppes » exprime ce milieu sauvage avec plus de précision et de naturel que « des déserts » en français.
- source_word: יְשָׁדְדֵם
  choice: les ravage
  rationale: Le verbe שדד évoque la dévastation violente et le pillage. « Ravage » convient particulièrement à l’image d’un prédateur.
- source_word: נָמֵר
  choice: un léopard
  rationale: « Léopard » est l’équivalent français courant de cet animal et maintient la force visuelle de l’image.
- source_word: שֹׁקֵד עַל
  choice: guette
  rationale: Le participe exprime une vigilance soutenue. Dans ce contexte prédateur, « guette » rend naturellement l’idée d’une surveillance hostile sans explicitation excessive.
- source_word: עָרֵיהֶם
  choice: leurs villes
  rationale: « Villes » est le sens courant de עָרִים et convient au cadre collectif du jugement.
- source_word: כָּל הַיּוֹצֵא מֵהֵנָּה
  choice: Quiconque en sort
  rationale: « Quiconque » restitue la portée distributive de כָּל, tandis que « en sort » renvoie naturellement aux villes qui viennent d’être mentionnées.
- source_word: יִטָּרֵף
  choice: sera mis en pièces
  rationale: Le nifal de טרף évoque une victime déchirée par une bête. La formulation française reste vive et explicite.
- source_word: פִּשְׁעֵיהֶם
  choice: leurs actes de rébellion
  rationale: 'פשע désigne plus qu’une faute ordinaire : il comporte l’idée d’une révolte contre une autorité légitime. La locution est claire en français moderne.'
- source_word: רַבּוּ
  choice: sont nombreux
  rationale: 'Cette tournure rend simplement l’état résultant exprimé par le verbe : les rébellions abondent.'
- source_word: מְשֻׁבוֹתֵיהֶם
  choice: leurs apostasies
  rationale: Le terme désigne des détournements répétés et une infidélité persistante. « Apostasies » préserve la gravité religieuse et relationnelle de cette rupture.
- source_word: עָצְמוּ
  choice: ont pris de l’ampleur
  rationale: Le verbe עצם exprime ici le renforcement ou l’intensification. Cette expression française conserve cette progression sans suggérer seulement un dénombrement.
theological_decisions:
- issue: Caractère relationnel et religieux de מְשֻׁבוֹתֵיהֶם
  choice: leurs apostasies
  alternative: leurs infidélités ; leurs retours en arrière
  rationale: « Apostasies » communique la gravité d’un abandon répété de la fidélité due à Dieu, sans préciser davantage la nature de la rupture que ne le fait le texte.
- issue: Valeur temporelle de la séquence verbale
  choice: présent de narration pour les attaques, puis futur pour le sort de celui qui sort
  alternative: « les a abattus » pour le qatal הִכָּם ; ou une série entièrement au futur
  rationale: L’hébreu combine un qatal, un yiqtol et un participe dans une scène prophétique vive. Le français au présent préserve cette vivacité et évite de résoudre rigidement la séquence comme entièrement passée ou future.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les verbes courts (« abat », « ravage », « guette ») maintiennent le rythme menaçant des trois prédateurs. La ponctuation en points-virgules rend clairement la progression des images.
