  source_fidelity: 'L’alternance réelle des formes verbales hébraïques est bien conservée : singulier (וְאָכַל, יֹאכַל) puis pluriel (יֹאכְלוּ), puis singulier. Les rendus des biens agricoles, du bétail et des villes fortifiées sont fidèles. Pour יְרֹשֵׁשׁ, appliqué aux villes et suivi de « par l’épée », « détruira » rend plus clairement et plus naturellement la ruine militaire exprimée par le contexte.'
  naturalness: 'Le français est globalement naturel, soutenu et accessible. Toutefois, « il réduira par l’épée tes villes fortifiées » est elliptique et peu idiomatique : « réduire » appelle normalement un complément tel que « en ruines » et l’ordre des compléments alourdit la phrase. La formulation révisée est nette et naturelle.'
