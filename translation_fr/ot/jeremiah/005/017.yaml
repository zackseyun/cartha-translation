source:
  edition: WLC
  text: וְ/אָכַ֨ל קְצִֽירְ/ךָ֜ וְ/לַחְמֶ֗/ךָ יֹאכְלוּ֙ בָּנֶ֣י/ךָ וּ/בְנוֹתֶ֔י/ךָ יֹאכַ֤ל צֹאנְ/ךָ֙ וּ/בְקָרֶ֔/ךָ יֹאכַ֥ל גַּפְנְ/ךָ֖ וּ/תְאֵנָתֶ֑/ךָ יְרֹשֵׁ֞שׁ עָרֵ֣י מִבְצָרֶ֗י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בָּ/הֵ֖נָּה בֶּ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/017.yaml
  text: And they will consume your harvest and your bread[a]; they will consume your sons and your daughters; they will consume your flock and your herd; they will consume your vine and your fig tree; they will destroy your fortified cities, in which you trust[b], with the sword.
translation:
  language: fr
  text: Il dévorera ta moisson et ton pain[a] ; ils dévoreront tes fils et tes filles ; il dévorera ton petit bétail et ton gros bétail ; il dévorera ta vigne et ton figuier ; il détruira tes villes fortifiées, sur lesquelles tu comptes[b], par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mangera », de même pour toutes les reprises de ce verbe dans le verset.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu alterne ici les verbes au singulier et au pluriel, considérant probablement la nation ennemie tantôt comme un ensemble, tantôt comme ses différentes forces.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַל / יֹאכְלוּ / יֹאכַל
  choice: il dévorera / ils dévoreront
  rationale: Le verbe אָכַל signifie d’abord « manger », mais décrit ici l’anéantissement causé par l’envahisseur. « Dévorer » convient naturellement aux récoltes, aux personnes, au bétail et aux cultures, tout en conservant la répétition et la force de l’image.
- source_word: קְצִירְךָ
  choice: ta moisson
  rationale: קָצִיר désigne ici le produit de la récolte. « Moisson » est concret, naturel et fidèle à l’image agricole.
- source_word: לַחְמֶךָ
  choice: ton pain
  rationale: לֶחֶם signifie littéralement « pain », avec parfois le sens plus large de nourriture. Le sens concret est conservé.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: tes fils et tes filles
  rationale: L’hébreu nomme explicitement les deux groupes ; la traduction maintient ce parallélisme.
- source_word: צֹאנְךָ וּבְקָרֶךָ
  choice: ton petit bétail et ton gros bétail
  rationale: צֹאן désigne collectivement les ovins et caprins, tandis que בָּקָר désigne les bovins. Cette formulation française préserve clairement la distinction.
- source_word: גַּפְנְךָ וּתְאֵנָתֶךָ
  choice: ta vigne et ton figuier
  rationale: Les singuliers hébreux sont maintenus comme représentants des ressources agricoles.
- source_word: יְרֹשֵׁשׁ
  choice: il réduira
  rationale: Ce verbe rare exprime l’idée de dépouiller, ruiner ou réduire à l’impuissance. Avec le complément instrumental « par l’épée », « réduira » préserve cette nuance sans affirmer plus précisément que le texte ne le permet.
- source_word: עָרֵי מִבְצָרֶיךָ
  choice: tes villes fortifiées
  rationale: Expression française directe et exacte pour des villes munies de fortifications.
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בָּהֵנָּה
  choice: sur lesquelles tu comptes
  rationale: בָּטַח exprime la confiance ou le fait de se fier à quelque chose. « Compter sur » est naturel en français moderne et met en évidence la sécurité recherchée dans les fortifications.
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: La préposition indique ici le moyen de l’action militaire ; « par l’épée » est idiomatique et laisse entendre la force armée.
theological_decisions:
- issue: Alternance entre le singulier et le pluriel pour l’envahisseur
  choice: Conserver « il » pour les verbes au singulier et « ils » pour le verbe au pluriel.
  alternative: Uniformiser toute la séquence au pluriel (« ils ») ou au singulier collectif.
  rationale: L’hébreu alterne délibérément les formes verbales singulières et plurielles, présentant vraisemblablement la nation ennemie à la fois comme un tout collectif et comme l’ensemble de ses forces. La traduction conserve cette tension plutôt que de la niveler.
- issue: Portée de יְרֹשֵׁשׁ appliqué aux villes fortifiées
  choice: « il réduira par l’épée tes villes fortifiées »
  alternative: « il détruira » ou « il dévastera tes villes fortifiées »
  rationale: Le verbe rare peut évoquer la ruine, le dépouillement ou la réduction à l’impuissance. « Réduire par l’épée » maintient l’idée militaire tout en évitant de trancher en faveur d’une destruction matérielle totale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Juda. La répétition de « dévorer » et l’alternance singulier-pluriel sont volontairement conservées.
