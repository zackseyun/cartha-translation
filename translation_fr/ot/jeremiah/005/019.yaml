id: JER.5.19
reference: Jeremiah 5:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ֣י תֹאמְר֔וּ תַּ֣חַת מֶ֗ה עָשָׂ֨ה יְהֹוָ֧ה אֱלֹהֵ֛י/נוּ לָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עֲזַבְתֶּ֤ם אוֹתִ/י֙ וַ/תַּעַבְד֞וּ אֱלֹהֵ֤י נֵכָר֙ בְּ/אַרְצְ/כֶ֔ם כֵּ֚ן תַּעַבְד֣וּ זָרִ֔ים בְּ/אֶ֖רֶץ לֹ֥א לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/019.yaml
  text: And when you say[a], ‘Why has Yahweh our God done all these things to us?’ then you shall say to them, ‘Just as you have forsaken me and served foreign gods in your land, so you shall serve foreigners in a land not yours.’
translation:
  language: fr
  text: 'Et lorsque vous direz : « Pourquoi Yahweh, notre Dieu, nous a-t-il fait tout cela ? », tu leur répondras : « De même que vous m’avez abandonné et avez servi des dieux étrangers dans votre pays, de même vous servirez des étrangers[a] dans un pays qui n’est pas le vôtre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des gens d’un autre pays ». Le mot hébreu désigne ici des personnes étrangères, par contraste avec les « dieux étrangers » mentionnés plus haut.'
    reason: Précision lexicale sur זָרִים et conservation du contraste interne au verset.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Et lorsque
  rationale: Cette formule introduit une éventualité future. « Et lorsque » en rend naturellement la valeur temporelle en français.
- source_word: תַּחַת מֶה
  choice: Pourquoi
  rationale: L’expression demande idiomatiquement la raison de ce qui arrive ; « pourquoi » est l’équivalent français le plus direct.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה ; sa translittération distingue ce nom personnel du titre « Seigneur ».
- source_word: עָשָׂה ... אֶת כָּל אֵלֶּה
  choice: nous a-t-il fait tout cela
  rationale: Cette formulation française naturelle conserve l’idée de la totalité des jugements évoqués.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: tu leur répondras
  rationale: Le singulier s’adresse au prophète, tandis que « répondras » exprime naturellement que cette parole doit être donnée en réponse à leur question.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: De même que ... de même
  rationale: La construction corrélative conserve le parallélisme entre la faute et son châtiment.
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: vous m’avez abandonné
  rationale: « Abandonné » rend la gravité relationnelle et covenantale de עזב dans un français actuel.
- source_word: וַתַּעַבְדוּ ... תַּעַבְדוּ
  choice: avez servi ... servirez
  rationale: La répétition du même verbe préserve la correspondance voulue entre le service cultuel rendu aux dieux étrangers et le service imposé auprès d’étrangers.
- source_word: אֱלֹהֵי נֵכָר
  choice: des dieux étrangers
  rationale: Le syntagme désigne des divinités étrangères ; cette traduction est claire et maintient son contraste avec les personnes étrangères mentionnées ensuite.
- source_word: בְּאַרְצְכֶם ... בְּאֶרֶץ לֹא לָכֶם
  choice: dans votre pays ... dans un pays qui n’est pas le vôtre
  rationale: La répétition de « pays » reflète celle de אֶרֶץ et souligne le renversement entre le territoire propre du peuple et la terre étrangère.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le pluriel désigne ici des personnes étrangères, et non des dieux ; le choix conserve aussi le jeu de correspondance avec « dieux étrangers ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom personnel. « Yahweh » le rend explicitement sans le remplacer par un titre.
- issue: Portée de עבד dans les deux propositions
  choice: servir dans les deux cas
  alternative: adorer des dieux, puis être asservis à des étrangers
  rationale: Employer le même verbe conserve la symétrie théologique et rhétorique du jugement correspondant à la faute, sans préciser au-delà du texte la forme exacte du second service.
translation_notes:
  register: Français international moderne, digne et accessible. Le passage du « vous » adressé au peuple au « tu » adressé au prophète est conservé. La répétition de « servir » et de « pays » maintient le parallélisme serré de l’hébreu.
