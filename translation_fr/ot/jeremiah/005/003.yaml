- from: Yahvé, tes yeux ne recherchent-ils pas la fidélité ? Tu les as frappés, mais ils n’ont pas souffert[a] ; tu les as anéantis, mais ils ont refusé d’accepter la correction. Ils ont rendu leur visage plus dur que le roc ; ils ont refusé de revenir[b].
  to: Yahvé, tes yeux ne sont-ils pas tournés vers la fidélité ? Tu les as frappés, mais ils n’ont pas souffert[a] ; tu les as consumés, mais ils ont refusé d’accepter la correction. Ils ont rendu leur visage plus dur que le roc ; ils ont refusé de revenir[b].
  rationale: La révision remplace « anéantis » par « consumés », terme qui reflète le champ sémantique de כלה sans imposer une destruction totale. Elle ajuste aussi l’expression du regard divin afin de conserver plus étroitement l’image et l’orientation de l’hébreu. Les notes, y compris leurs ancres, sont maintenues et restent adéquates.
