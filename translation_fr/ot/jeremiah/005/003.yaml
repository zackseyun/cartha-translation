source:
  edition: WLC
  text: יְהֹוָ֗ה עֵינֶי/ךָ֮ הֲ/ל֣וֹא לֶ/אֱמוּנָה֒ הִכִּ֤יתָה אֹתָ/ם֙ וְֽ/לֹא חָ֔לוּ כִּלִּיתָ֕/ם מֵאֲנ֖וּ קַ֣חַת מוּסָ֑ר חִזְּק֤וּ פְנֵי/הֶם֙ מִ/סֶּ֔לַע מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/003.yaml
  text: O Yahweh[a], are not your eyes on faithfulness? You struck them, but they did not feel pain; you consumed them, but they refused to accept discipline. They made their faces harder than rock[b]; they refused to return.
translation:
  language: fr
  text: Yahvé, tes yeux ne sont-ils pas tournés vers la fidélité ? Tu les as frappés, mais ils n’ont pas souffert[a] ; tu les as consumés, mais ils ont refusé d’accepter la correction. Ils ont rendu leur visage plus dur que le roc ; ils ont refusé de revenir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne se sont pas affaiblis » ou « ils ne sont pas devenus malades ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de se repentir ». L’hébreu dit littéralement « de revenir », expression prophétique courante pour désigner le retour à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » représente directement le nom divin et convient à l’adresse directe, sans ajouter une interjection absente de l’hébreu.
- source_word: עֵינֶיךָ הֲלוֹא לֶאֱמוּנָה
  choice: tes yeux ne recherchent-ils pas la fidélité ?
  rationale: Conserve l’image concrète des yeux tout en exprimant naturellement leur orientation vers ce que Dieu attend. אֱמוּנָה désigne ici la fidélité, la fiabilité ou la loyauté.
- source_word: הִכִּיתָה אֹתָם
  choice: Tu les as frappés
  rationale: Rend directement le jugement exprimé par נכה dans un français actuel et vigoureux.
- source_word: וְלֹא חָלוּ
  choice: mais ils n’ont pas souffert
  rationale: חלה peut évoquer la souffrance, l’affaiblissement ou la maladie. « Souffert » convient à la réaction attendue après les coups sans préciser excessivement sa nature.
- source_word: כִּלִּיתָם
  choice: tu les as anéantis
  rationale: Le piel de כלה peut signifier mener à son terme, consumer ou détruire. « Anéantis » restitue l’intensification du jugement, même si le contexte montre que l’expression n’exige pas nécessairement une disparition littérale de tous.
- source_word: מֵאֲנוּ קַחַת מוּסָר
  choice: ils ont refusé d’accepter la correction
  rationale: מוּסָר associe correction, discipline et instruction ; « correction » exprime ici à la fois la sanction et sa visée éducative.
- source_word: חִזְּקוּ פְנֵיהֶם מִסֶּלַע
  choice: Ils ont rendu leur visage plus dur que le roc
  rationale: Préserve l’image hébraïque du visage et la comparaison explicite, qui expriment une résistance obstinée.
- source_word: מֵאֲנוּ לָשׁוּב
  choice: ils ont refusé de revenir
  rationale: « Revenir » conserve le sens concret de שׁוב et l’image prophétique d’un retour vers Dieu, sans remplacer cette image par son interprétation théologique.
theological_decisions:
- issue: Portée morale et religieuse de שׁוּב
  choice: revenir
  alternative: se repentir
  rationale: Le verbe signifie littéralement « revenir » ou « retourner » et, dans ce contexte prophétique, implique la repentance. Le texte principal conserve l’image relationnelle et la note explicite sa portée.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé dans l’adresse à Dieu, conformément à l’usage biblique français courant. Parallélisme et images corporelles de l’hébreu maintenus.
