source:
  edition: WLC
  text: הַֽ/עַל אֵ֥לֶּה לֹֽא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/029.yaml
  text: Shall I not punish for these things? declares Yahweh[b][a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: fr
  text: « Ne punirai-je pas pour ces choses[a] ? — déclaration de Yahweh. Mon âme ne se vengera-t-elle pas[b] d’une nation comme celle-ci ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne demanderai-je pas compte de ces choses ? » Le verbe hébreu peut désigner une intervention judiciaire visant à demander des comptes ou à punir.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « mon âme ne se vengera-t-elle pas… ? » Dans cet idiome hébreu, « mon âme » exprime la détermination personnelle de Yahweh ; on pourrait traduire plus librement : « ne me vengerai-je pas… ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: Ne… pas de tels actes
  rationale: La particule interrogative introduit une question rhétorique, tandis que עַל indique le motif de l’intervention. « De tels actes » renvoie naturellement aux fautes décrites auparavant.
- source_word: אֶפְקֹד
  choice: punirais
  rationale: Dans ce contexte judiciaire, פקד désigne une intervention de Dieu pour demander compte et infliger un châtiment. « Punir » en exprime clairement la force, tout en signalant l’autre nuance en note.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: La formule prophétique solennelle נְאֻם est rendue de façon nominale, et le nom divin יהוה est transcrit « Yahweh ».
- source_word: אִם
  choice: ne… pas ?
  rationale: Dans ce parallélisme, אִם introduit une interrogation rhétorique à valeur emphatique plutôt qu’une condition ordinaire.
- source_word: תִתְנַקֵּם
  choice: ne se vengera-t-elle pas
  rationale: La forme hitpael de נקם possède ici une valeur réfléchie ou moyenne. La tournure française conserve cette valeur avec « mon âme » comme sujet.
- source_word: נַפְשִׁי
  choice: Mon âme
  rationale: La traduction littérale préserve l’expression hébraïque et souligne l’engagement personnel de Yahweh, sans réduire silencieusement cette formulation à un simple pronom.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: d’une nation pareille
  rationale: Avec « se venger », la préposition se rend naturellement par « de ». « Une nation pareille » restitue avec concision la qualification emphatique אֲשֶׁר כָּזֶה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Expression anthropopathique « mon âme »
  choice: conserver « Mon âme » dans le texte
  alternative: « Ne me vengerais-je pas… ? »
  rationale: Le texte hébreu attribue directement à Dieu נַפְשִׁי, « mon âme / ma personne ». La conserver respecte la texture et l’intensité personnelles de l’énoncé, tandis que la note explique sa valeur idiomatique.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Les deux questions rhétoriques et leur parallélisme sont conservés. « Déclaration de Yahweh » garde le caractère formel de la formule prophétique, et « mon âme » maintient volontairement la tension de l’expression hébraïque.
