  text: אַשְׁפָּת֖/וֹ כְּ/קֶ֣בֶר פָּת֑וּחַ כֻּלָּ֖/ם גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/016.yaml
  text: Their quiver is like an open grave[b][a]; all of them are mighty men.
translation:
  language: fr
  text: Son carquois[a] est comme une tombe ouverte ; tous sont de vaillants guerriers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Leurs carquois sont comme des tombes ouvertes », en comprenant le singulier hébreu dans un sens collectif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des hommes vaillants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁפָּתוֹ
  choice: Son carquois
  rationale: Le nom désigne un carquois. Le suffixe hébreu est morphologiquement au masculin singulier (« son ») et renvoie ici à la nation envahissante envisagée collectivement ; le singulier français conserve cette forme et reste naturel.
- source_word: כְּקֶבֶר פָּתוּחַ
  choice: est comme une tombe ouverte
  rationale: כְּ introduit une comparaison ; קֶבֶר désigne une tombe ou un tombeau, et פָתוּחַ la présente comme ouverte. « Tombe ouverte » rend l'image de façon directe et naturelle.
- source_word: כֻּלָּם
  choice: tous
  rationale: Le terme souligne la totalité du groupe ; « tous » en conserve clairement la portée collective.
- source_word: גִּבּוֹרִים
  choice: de vaillants guerriers
  rationale: Dans ce contexte militaire, le mot désigne des hommes forts et valeureux au combat. « Vaillants guerriers » exprime à la fois leur force et leur fonction sans la connotation héroïque moderne que pourrait avoir « héros ».
theological_decisions:
- issue: Portée du masculin pluriel גִּבּוֹרִים
  choice: de vaillants guerriers
  alternative: des hommes vaillants
  rationale: Le contexte présente les membres masculins d'une force d'invasion. « Guerriers » garde cette référence humaine et militaire en français naturel, tandis que « hommes vaillants » suit plus littéralement la forme sans être nécessairement plus précis ici.
- issue: Référent du suffixe singulier dans אַשְׁפָּתוֹ
  choice: Son carquois
  alternative: Leurs carquois
  rationale: Le suffixe du texte hébreu est singulier et se rapporte à la nation ennemie considérée comme une unité. Le conserver évite de résoudre silencieusement cette construction collective en un pluriel distributif.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le singulier collectif de l'hébreu et emploie un vocabulaire militaire courant.
