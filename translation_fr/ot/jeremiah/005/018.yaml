    rationale: Le verbe français peut évoquer un mode déterminé de mise à mort collective et porte des connotations contemporaines qui ne sont pas précisées par l’hébreu. « Détruire complètement » rend la totalité de la destruction sans ajout.
  - severity: low
    issue: La force connective de וְגַם n’est que partiellement exprimée.
    rationale: « Même » rend l’emphase, mais « Mais même » reflète aussi la continuation contrastive du discours.
