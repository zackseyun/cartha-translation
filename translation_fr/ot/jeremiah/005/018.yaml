  text: וְ/גַ֛ם בַּ/יָּמִ֥ים הָ/הֵ֖מָּה נְאֻם יְהֹוָ֑ה לֹֽא אֶעֱשֶׂ֥ה אִתְּ/כֶ֖ם כָּלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/018.yaml
  text: Yet even in those days[a], declares Yahweh, I will not make a full end of you.
translation:
  language: fr
  text: Mais même en ces jours-là, déclare Yahweh, je ne vous détruirai pas complètement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: Même
  rationale: 'Dans ce contexte de jugement sévère, וְגַם ajoute une nuance concessive et emphatique : malgré tout, même durant cette période.'
- source_word: בַּיָּמִים הָהֵמָּה
  choice: en ces jours-là
  rationale: Expression temporelle prophétique courante, naturelle en français et renvoyant à la période annoncée.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formulation conserve le caractère solennel et nominal de la formule prophétique hébraïque נְאֻם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לֹא אֶעֱשֶׂה אִתְּכֶם כָּלָה
  choice: je ne vous exterminerai pas complètement
  rationale: L’expression idiomatique עשה ... כלה signifie ici mener à une destruction totale. Cette formulation française transmet clairement le sens sans calquer maladroitement « faire une fin avec vous ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source porte un nom propre. « Yahweh » le représente directement sans introduire de titre de substitution.
- issue: Portée du jugement annoncé
  choice: je ne vous exterminerai pas complètement
  alternative: je ne mettrai pas complètement fin à vous
  rationale: 'Le français idiomatique choisi maintient la tension du verset : un jugement réel est annoncé, mais il n’aboutira pas à l’anéantissement total du peuple.'
translation_notes:
  register: Français international moderne, sobre et digne. Les tirets isolent naturellement la formule prophétique. « Exterminer » exprime ici l’anéantissement collectif total et non la simple punition.
