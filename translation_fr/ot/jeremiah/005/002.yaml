  source_fidelity: Le brouillon rend bien la formule de serment חַי יְהוָה et l’accusation de faux serment. Toutefois, « ils prêtent un serment mensonger » passe d’un verbe pluriel (« ils jurent ») à un nom singulier et laisse moins percevoir la force concessive/intensive de la construction, y compris לָכֵן (« néanmoins / assurément »).
