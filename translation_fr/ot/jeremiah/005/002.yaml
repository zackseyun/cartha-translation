lexical_decisions:
- source_word: וְאִם
  choice: Même lorsqu’ils
  rationale: 'Dans ce contexte, la tournure conditionnelle introduit un fait concédé : même quand ils emploient la formule de serment orthodoxe, leur serment reste faux.'
- source_word: חַי יְהוָה
  choice: Aussi vrai que le SEIGNEUR est vivant !
  rationale: Rend naturellement en français la formule hébraïque de serment tout en conservant le titre SEIGNEUR pour le tétragramme.
- source_word: לַשֶּׁקֶר יִשָּׁבֵעוּ
  choice: ils prêtent un serment mensonger
  rationale: Exprime directement l’idée de jurer faussement, avec un registre actuel et digne.
theological_decisions:
- issue: Valeur de לָכֵן dans la proposition principale
  choice: ils prêtent un serment mensonger
  alternative: même ainsi, ils jurent faussement
  rationale: לָכֵן peut ici renforcer la constatation ou marquer la conséquence. Une traduction française sans connecteur explicite évite de surinterpréter sa nuance tout en préservant le contraste entre la formule pieuse et le faux serment.
translation_notes:
  register: Français international moderne, clair et digne. La formule de serment est rendue idiomatiquement sans atténuer l’accusation de parjure.
