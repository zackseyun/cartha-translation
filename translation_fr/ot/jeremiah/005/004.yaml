source:
  edition: WLC
  text: וַ/אֲנִ֣י אָמַ֔רְתִּי אַךְ דַּלִּ֖ים הֵ֑ם נוֹאֲל֕וּ כִּ֣י לֹ֤א יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/004.yaml
  text: But I said[a], “Surely these are only the poor; they are foolish, for they do not know the way of Yahweh, the justice of their God.”
translation:
  language: fr
  text: 'Mais moi, je me suis dit : « Ce ne sont sûrement que les pauvres. Ils sont insensés, car ils ne connaissent pas la voie de Yahweh, ni la justice de leur Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jugement de leur Dieu » ou « la règle établie par leur Dieu ». Le mot hébreu peut désigner la justice, un jugement ou une prescription juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: Mais moi, je me suis dit
  rationale: Le pronom explicite marque un contraste avec la recherche précédente. Le passé composé et la tournure pronominale rendent naturellement en français un discours intérieur, tout en restant proches du verbe « dire ».
- source_word: אַךְ דַּלִּים הֵם
  choice: Ce ne sont sûrement que les pauvres
  rationale: « Sûrement » exprime la nuance d'affirmation de אַךְ, tandis que « ne… que » en restitue la valeur restrictive. « Les pauvres » convient au sens économique et social de דַּלִּים.
- source_word: נוֹאֲלוּ
  choice: Ils sont insensés
  rationale: La formulation décrit leur manque de discernement, expliqué par la proposition suivante. « Insensés » est plus digne et moins familier que « idiots ».
- source_word: כִּי לֹא יָדְעוּ
  choice: car ils ne connaissent pas
  rationale: La proposition donne la raison du constat précédent. « Connaître » préserve la portée relationnelle et pratique possible de יָדַע.
- source_word: דֶּרֶךְ יְהוָה
  choice: la voie de Yahweh
  rationale: « La voie » conserve l'image biblique d'une conduite ou d'une volonté à suivre. Le nom divin est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: la justice de leur Dieu
  rationale: מִשְׁפָּט peut désigner la justice, un jugement ou une prescription. « Justice » convient au parallèle avec la voie divine sans réduire le terme à une règle juridique précise.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte le nom divin lui-même. Sa translittération préserve sa fonction de nom propre sans lui substituer un titre.
- issue: Portée de מִשְׁפַּט
  choice: la justice de leur Dieu
  alternative: le jugement de leur Dieu / la règle établie par leur Dieu
  rationale: Le terme conserve ici une tension entre l’ordre juste de Dieu, ses décisions judiciaires et ses exigences. Le texte principal retient « justice », et la note signale les autres sens possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le contraste du locuteur, l’hypothèse restrictive et le parallélisme entre la voie de Yahweh et la justice de Dieu.
