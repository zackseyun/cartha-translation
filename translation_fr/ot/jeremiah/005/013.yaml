  text: וְ/הַ/נְּבִיאִים֙ יִֽהְי֣וּ לְ/ר֔וּחַ וְ/הַ/דִּבֵּ֖ר אֵ֣ין בָּ/הֶ֑ם כֹּ֥ה יֵעָשֶׂ֖ה לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/013.yaml
  text: And the prophets will become wind[a], and the word is not in them; thus it will be done to them.
translation:
  language: fr
  text: Et les prophètes deviendront du vent[a] ; la parole n’est pas en eux. Ainsi leur sera-t-il fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du souffle » ou « de l’esprit ». Le mot hébreu רוּחַ peut avoir chacun de ces sens ; ici, « du vent » suggère probablement que ces prophètes sont inconsistants ou que leurs paroles sont vides.
    reason: Alternative lexicale et préservation de la polysémie de l’hébreu.
lexical_decisions:
- source_word: וְהַנְּבִיאִים
  choice: Et les prophètes
  rationale: Le nom défini au pluriel précédé de la conjonction est rendu simplement, sans ajouter d’emphase absente de l’hébreu.
- source_word: יִהְיוּ לְרוּחַ
  choice: deviendront du vent
  rationale: La construction היה avec לְ peut exprimer un devenir. « Du vent » rend ici l’idée polémique de paroles inconsistantes, tout en conservant en note la polysémie de רוּחַ.
- source_word: וְהַדִּבֵּר
  choice: la parole
  rationale: Cette forme nominale renvoie naturellement à la parole ou au message proclamé. « La parole » garde la concision et l’ambiguïté du texte.
- source_word: אֵין בָּהֶם
  choice: n’est pas en eux
  rationale: La formulation reproduit l’image hébraïque et ne précise pas indûment s’il s’agit de la parole divine ou, plus largement, d’un message véritable.
- source_word: כֹּה יֵעָשֶׂה לָהֶם
  choice: Que cela leur soit fait !
  rationale: Dans le contexte, la proposition se lit naturellement comme le souhait ou la déclaration citée des interlocuteurs évoqués aux versets précédents. Le passif impersonnel et l’agent non exprimé sont préservés.
theological_decisions:
- issue: Sens de רוּחַ dans la dénonciation des prophètes
  choice: vent
  alternative: souffle ou esprit
  rationale: « Vent » convient au reproche d’inconsistance renforcé par « la parole n’est pas en eux », sans faire nécessairement référence à l’Esprit de Dieu. La note conserve toutefois l’étendue sémantique réelle du terme hébreu.
- issue: Qui prononce « Que cela leur soit fait ! »
  choice: La traduction laisse l’énoncé sans attribution explicite, comme l’hébreu
  alternative: Comprendre la phrase comme une annonce directe de ce qui arrivera aux prophètes
  rationale: Le contexte immédiat permet d’y voir la fin des propos incrédules du peuple, mais le texte massorétique n’emploie pas de guillemets et l’attribution demeure discutée. Ne pas expliciter le locuteur préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure concise et conserve le parallélisme ainsi que le passif indéfini de l’hébreu. Le point d’exclamation rend la force probable de la déclaration citée sans en préciser le locuteur.
