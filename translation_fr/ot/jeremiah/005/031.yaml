reference: Jeremiah 5:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/נְּבִיאִ֞ים נִבְּא֣וּ בַ/שֶּׁ֗קֶר וְ/הַ/כֹּהֲנִים֙ יִרְדּ֣וּ עַל יְדֵי/הֶ֔ם וְ/עַמִּ֖/י אָ֣הֲבוּ כֵ֑ן וּ/מַֽה תַּעֲשׂ֖וּ לְ/אַחֲרִיתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/031.yaml
  text: The prophets prophesy falsely[a], and the priests rule by their authority, and my people love it so[b]. But what will you do when its end comes?
translation:
  language: fr
  text: Les prophètes prophétisent mensongèrement, et les prêtres exercent leur pouvoir sous leur direction[a]. Mon peuple aime qu’il en soit ainsi. Mais que ferez-vous quand viendra la fin de tout cela[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les prêtres exercent leur pouvoir par leur entremise » ou « les prêtres dominent par leurs mains ». L’expression hébraïque est difficile.
    reason: alternative_reading
  - marker: b
    text: Littéralement « à sa fin ». Le suffixe hébreu est féminin et peut renvoyer à la situation, au pays ou à la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְּאוּ בַשֶּׁקֶר
  choice: prophétisent mensongèrement
  rationale: L’expression garde le verbe répété de l’hébreu et rend בַשֶּׁקֶר comme une qualification mensongère de l’activité prophétique, dans un français clair et soutenu.
- source_word: יִרְדּוּ
  choice: exercent leur pouvoir
  rationale: Le verbe רדה désigne l’exercice d’une domination ou d’un pouvoir. Cette formulation naturelle conserve cette idée sans préciser indûment la forme institutionnelle de l’autorité.
- source_word: עַל יְדֵיהֶם
  choice: sous leur direction
  rationale: L’expression hébraïque est difficile. Dans ce contexte, elle peut indiquer que les prêtres agissent sous l’impulsion ou l’autorité des prophètes; la note conserve les autres possibilités.
- source_word: כֵן
  choice: qu’il en soit ainsi
  rationale: Cette tournure idiomatique exprime que le peuple approuve et aime l’état de choses qui vient d’être décrit.
- source_word: לְאַחֲרִיתָהּ
  choice: quand viendra la fin de tout cela
  rationale: אַחֲרִית désigne la fin ou l’issue. « De tout cela » rapporte prudemment le suffixe féminin à la situation décrite, tout en signalant en note l’ambiguïté de son référent.
- source_word: וּמַה תַּעֲשׂוּ
  choice: Mais que ferez-vous
  rationale: « Mais » restitue le tournant rhétorique qui oppose l’approbation présente du peuple à l’issue annoncée.
theological_decisions:
- issue: Rapport entre les prêtres et les prophètes dans עַל יְדֵיהֶם
  choice: Les prêtres exercent leur pouvoir sous la direction des prophètes.
  alternative: Les prêtres dominent par leurs propres mains, ou agissent avec l’appui des prophètes.
  rationale: La syntaxe est obscure et ne permet pas de trancher absolument. Le texte principal retient une relation de dépendance plausible, tandis que la note expose les principales lectures sans résoudre artificiellement la difficulté.
- issue: Référent du suffixe féminin dans לְאַחֲרִיתָהּ
  choice: La situation corrompue qui vient d’être décrite, rendue par « tout cela ».
  alternative: Le suffixe peut renvoyer à la terre ou à la ville, d’où « à sa fin » ou « quand viendra sa fin ».
  rationale: Aucun antécédent féminin explicite n’apparaît dans le verset. La formulation principale demeure naturelle sans identifier arbitrairement le référent, et la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « prophètes prophétisent » conserve l’effet rhétorique de l’hébreu. Les deux ambiguïtés majeures sont maintenues au moyen de notes.
