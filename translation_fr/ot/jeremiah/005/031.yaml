  source_fidelity: 'Le texte principal rend avec justesse les propositions hébraïques : les prophètes « prophétisent mensongèrement », les prêtres exercent une domination, le peuple approuve cet état de choses, puis vient la question rhétorique sur l’issue. « Sous leur direction » constitue une lecture contextuellement plausible de עַל־יְדֵיהֶם, dont la difficulté est signalée. « La fin de tout cela » rend naturellement l’issue tout en évitant d’attribuer avec certitude le suffixe féminin à un antécédent précis.'
