source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת יַ֚עַן דַּבֶּרְ/כֶ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה הִנְ/נִ֣י נֹתֵן֩ דְּבָרַ֨/י בְּ/פִ֜י/ךָ לְ/אֵ֗שׁ וְ/הָ/עָ֥ם הַ/זֶּ֛ה עֵצִ֖ים וַ/אֲכָלָֽתַ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/014.yaml
  text: 'Therefore thus says Yahweh[a], the God of hosts: Because you speak this word, behold, I am making my words in your mouth fire, and this people wood[c][b], and it will consume them.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahweh, le Dieu des armées : Puisque vous prononcez cette parole[a], voici que je mets mes paroles dans ta bouche comme un feu[b], et ce peuple comme du bois[c] ; ce feu les dévorera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puisque vous avez prononcé cette parole. » L’infinitif construit hébreu peut, selon le contexte, se rendre par un présent ou par un passé récent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je donne mes paroles dans ta bouche comme feu ». Le verbe signifie « donner » ; l’expression présente les paroles confiées à Jérémie comme un feu.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « et ce peuple, du bois » ; le terme peut évoquer du bois destiné au feu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend naturellement la conséquence qui relie cet oracle de jugement au contexte précédent.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Formule prophétique consacrée, exprimée dans un français actuel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: Préserve la force militaire du pluriel צְבָאוֹת sans préciser indûment s’il s’agit d’armées terrestres ou célestes.
- source_word: יַעַן
  choice: Puisque
  rationale: Introduit clairement la cause de l’action annoncée.
- source_word: דַּבֶּרְכֶם אֶת־הַדָּבָר הַזֶּה
  choice: vous prononcez cette parole
  rationale: Conserve le présent possible du participe, le pluriel de l’interlocuteur et le lien lexical avec les « paroles » divines.
- source_word: הִנְנִי
  choice: voici que
  rationale: Garde la solennité et l’immédiateté de la formule d’annonce prophétique.
- source_word: נֹתֵן
  choice: je mets
  rationale: Reste proche du sens concret de « donner/placer » tout en produisant une construction française naturelle avec « dans ta bouche ».
- source_word: דְּבָרַי
  choice: mes paroles
  rationale: Respecte le pluriel explicite de l’hébreu.
- source_word: בְּפִיךָ
  choice: dans ta bouche
  rationale: Préserve l’image corporelle et le suffixe singulier, qui désigne vraisemblablement Jérémie.
- source_word: לְאֵשׁ
  choice: comme un feu
  rationale: Exprime en français la fonction prédicative et métaphorique du feu sans imposer l’idée d’une transformation matérielle.
- source_word: הָעָם הַזֶּה עֵצִים
  choice: ce peuple comme du bois
  rationale: Préserve la métaphore collective et la relation prédicative elliptique de l’hébreu.
- source_word: וַאֲכָלָתַם
  choice: ce feu les dévorera
  rationale: Le sujet grammatical hébreu est le feu, féminin en hébreu ; sa reprise explicite évite en français que « ce peuple » soit compris comme sujet.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé afin de ne pas le remplacer silencieusement par un titre.
- issue: Référent de « dans ta bouche »
  choice: Singulier, adressé à Jérémie
  alternative: Adresse collective au peuple
  rationale: Le suffixe hébreu est singulier, à la différence du verbe pluriel précédent ; ce contraste est donc maintenu en français par « vous » puis « ta ».
- issue: Agent de la destruction finale
  choice: Le feu dévore le peuple
  alternative: Les paroles dévorent le peuple
  rationale: En hébreu, le verbe féminin singulier renvoie naturellement à אֵשׁ, « feu », également féminin ; le français explicite cette reprise pour éviter une ambiguïté grammaticale accidentelle.
translation_notes:
  register: Français international moderne, solennel sans archaïsme excessif. « Ainsi parle » conserve le registre prophétique. L’alternance « vous prononcez » / « dans ta bouche » reproduit délibérément le passage du pluriel au singulier dans l’hébreu. Les ajouts comparatifs « comme » rendent lisible la métaphore nominale, et « ce feu » clarifie le sujet de la dernière proposition.
