id: JER.5.11
reference: Jeremiah 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ בָג֨וֹד בָּגְד֜וּ בִּ֗/י בֵּ֧ית יִשְׂרָאֵ֛ל וּ/בֵ֥ית יְהוּדָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/011.yaml
  text: For the house of Israel and the house of Judah have dealt very treacherously with me[a], declares Yahweh.
translation:
  language: fr
  text: Car la maison d’Israël et la maison de Juda m’ont été totalement infidèles[a], — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « ont agi avec une grande perfidie envers moi » ou « m’ont complètement trahi ». L’hébreu associe un infinitif absolu au verbe conjugué pour renforcer l’idée verbale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici le motif de l’accusation ou du jugement précédent et conserve naturellement la valeur explicative de la conjonction.
- source_word: בָגוֹד בָּגְדוּ
  choice: ont été totalement infidèles
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’idée de בגד, qui exprime une conduite perfide ou déloyale. Cette formulation française rend à la fois l’infidélité relationnelle et l’emphase.
- source_word: בִּי
  choice: m’ont été
  rationale: Avec «être infidèle», le pronom complément indirect rend idiomatiquement la personne envers qui l’infidélité est commise, sans effacer son caractère personnel.
- source_word: בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: la maison d’Israël et la maison de Juda
  rationale: Conserve l’expression collective répétée et le parallélisme qui distingue les deux communautés.
- source_word: נְאֻם יְהוָה
  choice: — déclaration de Yahweh
  rationale: Rend la formule prophétique solennelle comme une affirmation divine faisant autorité, tout en conservant le nom personnel divin.
theological_decisions:
- issue: Portée de בגד dans le contexte de la relation avec Yahweh
  choice: infidèles
  alternative: perfides / m’ont trahi
  rationale: «Infidèles» laisse percevoir la rupture de loyauté envers Yahweh sans préciser davantage que l’hébreu la nature de cette relation ni importer une formulation doctrinale particulière.
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom divin présent dans le texte source plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. «Maison» préserve le langage collectif du texte; «totalement» restitue l’intensification hébraïque. Le tiret détache sobrement la formule prophétique finale.
