  text: סוּסִ֥ים מְיֻזָּנִ֖ים מַשְׁכִּ֣ים הָי֑וּ אִ֛ישׁ אֶל אֵ֥שֶׁת רֵעֵ֖/הוּ יִצְהָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/008.yaml
  text: They were well-fed[a], lusty stallions; each one neighing after his neighbor’s wife.
translation:
  language: fr
  text: C’étaient des étalons bien nourris, pleins d’ardeur[a] ; chacun hennissait après la femme de son voisin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « qui se levaient de bonne heure ». Le mot hébreu est difficile et peut évoquer soit l’ardeur et l’empressement, soit le fait de se lever tôt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּסִים
  choice: étalons
  rationale: Le nom désigne des chevaux, mais la comparaison à caractère sexuel met ici au premier plan des mâles ; « étalons » rend cette image explicite et naturelle en français.
- source_word: מְיֻזָּנִים
  choice: bien nourris
  rationale: Le participe passif décrit des animaux nourris et vigoureux. « Bien nourris » restitue simplement cette idée sans ajouter celle de luxe ou d’embonpoint.
- source_word: מַשְׁכִּים
  choice: pleins d’ardeur[a]
  rationale: La forme est difficile. Le contexte d’adultère suggère une ardeur sexuelle, mais la vocalisation massorétique peut évoquer le fait de se lever tôt ; cette possibilité est conservée en note.
- source_word: אִישׁ
  choice: chacun
  rationale: 'Le singulier a une valeur distributive : chaque homme du groupe est individuellement visé.'
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: pour la femme de son voisin
  rationale: La préposition marque l’orientation du désir, et רֵעֵהוּ désigne ici l’autre, le compagnon ou le voisin. « Son voisin » est courant et fait clairement ressortir l’adultère.
- source_word: יִצְהָלוּ
  choice: hennissait de désir
  rationale: Le verbe désigne le cri du cheval. « Hennissait » maintient la métaphore animale ; « de désir » rend en français naturel la visée sexuelle que le contexte et le complément expriment.
theological_decisions:
- issue: Caractère explicite de l’accusation d’adultère
  choice: Conserver l’image sexuelle directe des étalons qui hennissent de désir
  alternative: Atténuer l’image en parlant seulement d’hommes qui recherchent la femme d’autrui
  rationale: Le texte prophétique emploie délibérément une comparaison animale crue pour dénoncer le désir adultère ; l’atténuer affaiblirait sa force rhétorique.
translation_notes:
  register: Français international actuel, direct et digne. « Étalons » et « hennissait » préservent la vigueur de la métaphore, tandis que la note maintient l’incertitude lexicale de מַשְׁכִּים.
