source:
  edition: WLC
  text: הַֽ/עַל אֵ֥לֶּה לוֹא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה וְ/אִם֙ בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/009.yaml
  text: Shall I not punish for these things? declares Yahweh[a]. And on a nation such as this[b], shall I not avenge myself?
translation:
  language: fr
  text: « Ne sévirai-je pas à cause de tout cela ? — déclare Yahweh. Et[a], d’une nation pareille, mon âme[b] ne se vengera-t-elle pas ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et si ». Ici, l’expression introduit une seconde question rhétorique plutôt qu’une véritable condition.'
    reason: lexical_alternative
  - marker: b
    text: « Mon âme » est une manière hébraïque vive par laquelle Yahweh parle de sa propre personne.
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: à cause de tout cela
  rationale: La préposition עַל exprime ici le motif du jugement, et אֵלֶּה renvoie aux fautes décrites auparavant. « Tout cela » est naturel en français sans préciser davantage le référent.
- source_word: אֶפְקֹד
  choice: sévirais-je
  rationale: Dans ce contexte de jugement, פקד désigne une intervention punitive. « Sévir » rend ce sens sans introduire un complément absent de l’hébreu, contrairement à « punir », qui appellerait normalement une personne ou des actes comme objet.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique solennelle est rendue de façon concise et actuelle, tandis que le nom divin personnel est translittéré conformément au choix du projet.
- source_word: וְאִם
  choice: Et[a]
  rationale: Dans ce parallélisme interrogatif, la conjonction introduit une seconde question rhétorique qui renforce la première. La traduction principale privilégie un français fluide, tandis que la note conserve la forme plus littérale « Et si ».
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: d’une nation pareille
  rationale: Avec נקם, ב marque l’objet de la vengeance. Le français idiomatique dit « se venger de ». « Pareille » conserve la comparaison accusatrice portée par כָּזֶה.
- source_word: תִתְנַקֵּם נַפְשִׁי
  choice: mon âme ne se vengerait-elle pas
  rationale: La formulation conserve à la fois la valeur réflexive du hitpael de נקם et l’expression hébraïque saisissante « mon âme », plutôt que de les aplanir en « ne me vengerais-je pas ».
theological_decisions:
- issue: L’expression anthropopathique נַפְשִׁי appliquée à Yahweh
  choice: conserver « mon âme » dans le texte
  alternative: « moi-même » ou simplement « je »
  rationale: L’hébreu attribue à Dieu cette manière personnelle et imagée de parler de lui-même. La conserver respecte la tension et la force du texte sans en tirer de conclusion sur la constitution de Dieu.
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: l’Éternel, le Seigneur ou Yahvé
  rationale: Le nom divin est translittéré selon l’orientation du projet plutôt que remplacé par un titre.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Sévir » maintient la portée judiciaire du verbe sans alourdir la phrase; « d’une nation pareille » et « mon âme » gardent le relief rhétorique de l’hébreu.
