    rationale: Le texte hébreu emploie un verbe distinct, « ils se sont enrichis ». Cette formulation française conserve mieux la progression verbale sans ajouter l’idée qu’ils se seraient enrichis eux-mêmes.
  - severity: low
    issue: La relation comparative peut être explicitée.
    rationale: Tout comme… rend naturellement le rapport « comme… ainsi » marqué par כֵּן.
