  text: כִּ/כְלוּב֙ מָ֣לֵא ע֔וֹף כֵּ֥ן בָּתֵּי/הֶ֖ם מְלֵאִ֣ים מִרְמָ֑ה עַל כֵּ֥ן גָּדְל֖וּ וַֽ/יַּעֲשִֽׁירוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/027.yaml
  text: Like a cage full of birds[a], so their houses are full of deceit[b]; therefore they have become great and grown rich.
translation:
  language: fr
  text: Tout comme une cage est pleine d’oiseaux[a], leurs maisons sont pleines de tromperie[b] ; c’est pourquoi ils sont devenus grands et se sont enrichis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner une corbeille ou un enclos à oiseaux.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « tromperie » peut aussi évoquer la perfidie ou la fraude, et couvre largement les conduites malhonnêtes et abusives.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלוּב
  choice: cage
  rationale: Le nom désigne un contenant où l’on garde des oiseaux. « Cage » restitue naturellement l’image dans ce contexte, sans exclure les autres formes possibles du contenant.
- source_word: מָלֵא עוֹף
  choice: pleine d’oiseaux
  rationale: עוֹף est un terme général désignant les oiseaux ou créatures ailées ; « oiseaux » est ici le terme français courant et précis.
- source_word: כֵּן
  choice: comme… ainsi (comparaison rendue par la construction française)
  rationale: La particule met en parallèle la cage remplie d’oiseaux et les maisons remplies de tromperie. En français, la structure « Comme…, … » exprime clairement cette comparaison sans lourdeur.
- source_word: בָּתֵּיהֶם
  choice: leurs maisons
  rationale: Le rendu concret « maisons » conserve à la fois l’image des habitations et, possiblement, celle des maisonnées.
- source_word: מְלֵאִים מִרְמָה
  choice: sont pleines de tromperie
  rationale: מִרְמָה couvre la tromperie, la fraude et la perfidie. « Tromperie » garde cette portée morale générale sans limiter le sens à la fraude financière.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: 'Cette locution française marque clairement la conséquence : leur puissance et leur richesse découlent de leurs pratiques trompeuses.'
- source_word: גָּדְלוּ
  choice: sont devenus puissants
  rationale: Le verbe signifie littéralement « devenir grands ». Dans ce contexte social, « puissants » exprime naturellement l’élévation en importance ou en influence, tandis qu’une note préserve le sens plus littéral.
- source_word: וַיַּעֲשִׁירוּ
  choice: et riches
  rationale: Le verbe signifie « devenir riche ». Avec l’auxiliaire commun « sont devenus », « et riches » offre une formulation française concise sans ajouter l’idée plus forte qu’ils se seraient activement enrichis eux-mêmes.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La comparaison concrète est conservée, tandis que « puissants » évite le peu naturel « devenus grands » pour un statut social. La causalité du texte hébreu reste explicite.
