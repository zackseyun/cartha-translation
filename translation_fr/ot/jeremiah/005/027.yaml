  source_fidelity: Le parallélisme comparatif est globalement bien rendu, ainsi que « maisons », « tromperie » et la conséquence exprimée par עַל־כֵּן. Toutefois, « puissants » restreint le sens plus large de גָּדְלוּ (« ils sont devenus grands / importants »), et « sont devenus … riches » atténue quelque peu la valeur verbale distincte de וַיַּעֲשִׁירוּ (« ils se sont enrichis »).
  naturalness: Le français est clair et moderne. Une formulation explicite de la comparaison (« Tout comme… ») est plus naturelle et rend mieux le corrélatif hébreu que la juxtaposition actuelle.
  terminology: « Cage », « oiseaux », « maisons » et « tromperie » sont des choix appropriés. « Tromperie » conserve utilement l’ampleur de מִרְמָה. Le terme « grands » doit être maintenu dans le texte afin de ne pas imposer « puissants » comme unique interprétation sociale.
