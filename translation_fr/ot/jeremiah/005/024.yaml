  text: וְ/לֹֽא אָמְר֣וּ בִ/לְבָבָ֗/ם נִ֤ירָא נָא֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ הַ/נֹּתֵ֗ן גֶּ֛שֶׁם ו/ירה וּ/מַלְק֖וֹשׁ בְּ/עִתּ֑/וֹ שְׁבֻע֛וֹת חֻקּ֥וֹת קָצִ֖יר יִשְׁמָר לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/024.yaml
  text: They did not say in their heart[a], ‘Let us now fear Yahweh our God, who gives rain in its season, both the early rain and the latter rain, who keeps for us the appointed weeks of the harvest.’
translation:
  language: fr
  text: 'Ils ne se sont pas dit en eux-mêmes : « Craignons donc Yahweh, notre Dieu, lui qui donne la pluie en son temps, la pluie d’automne comme la pluie du printemps[a], et qui préserve pour nous les semaines fixées de la moisson. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la pluie précoce et la pluie tardive ».'
    reason: Les termes hébreux désignent les pluies du début et de la fin de la saison pluvieuse; « d’automne » et « du printemps » en donnent le repère agricole habituel.
lexical_decisions:
- source_word: וְלֹא אָמְרוּ בִלְבָבָם
  choice: Ils ne se sont pas dit dans leur cœur
  rationale: La tournure conserve l’image hébraïque du cœur tout en rendant naturellement en français l’idée d’une réflexion intérieure. Le singulier collectif « leur cœur » suit le texte source.
- source_word: נִירָא נָא
  choice: Craignons donc
  rationale: Le cohortatif exprime l’exhortation, et נָא lui donne ici une nuance d’insistance que « donc » restitue naturellement.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, notre Dieu
  rationale: Le nom divin est transcrit « Yahweh », tandis que le rapport exprimé par le suffixe est rendu directement par « notre Dieu ».
- source_word: הַנֹּתֵן גֶּשֶׁם יוֹרֶה וּמַלְקוֹשׁ בְּעִתּוֹ
  choice: lui qui donne en son temps la pluie d’automne et la pluie du printemps
  rationale: Le participe décrit l’action habituelle de Dieu. Les désignations saisonnières rendent clairement la pluie du début et celle de la fin du cycle agricole; « en son temps » conserve le singulier et la place sémantique de l’indication temporelle.
- source_word: שְׁבֻעוֹת חֻקּוֹת קָצִיר
  choice: les semaines fixées pour la moisson
  rationale: חֻקּוֹת indique des périodes établies ou prescrites. Cette formulation française exprime clairement les semaines déterminées du temps de la moisson.
- source_word: יִשְׁמָר לָנוּ
  choice: qui nous réserve
  rationale: שׁמר désigne ici le fait de maintenir ou préserver ces semaines au bénéfice du peuple. « Réserver » exprime naturellement cette nuance avec לָנוּ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; la transcription « Yahweh » préserve le nom propre et sa portée d’alliance sans le remplacer par un titre.
- issue: Rapport de Dieu à l’ordre des saisons agricoles
  choice: qui nous réserve les semaines fixées pour la moisson
  alternative: il préserve pour nous les semaines prescrites de la moisson
  rationale: La traduction maintient l’affirmation que Dieu garantit au peuple les périodes établies de la moisson, sans préciser davantage le mode de cette providence.
translation_notes:
  register: Français moderne, clair et digne. L’image biblique du cœur et le nom divin sont conservés; les termes agricoles sont rendus par leurs équivalents saisonniers intelligibles, avec la formulation plus littérale en note.
