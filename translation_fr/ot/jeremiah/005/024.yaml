  terminology: « Yahweh » est cohérent avec les décisions fournies. « Pluie d’automne » et « pluie de printemps » sont des rendus contextuels clairs de יוֹרֶה et מַלְקוֹשׁ, à condition que la note les présente comme une autre formulation possible, non comme une paraphrase littérale. « Préserve pour nous » rend plus directement שׁמר que « réserve » dans ce contexte.
