  text: For wicked men are found among my people[a]; they lie in wait like fowlers. They set a trap[b]; they catch men.
translation:
  language: fr
  text: Car il se trouve parmi mon peuple des hommes méchants. Ils guettent comme des oiseleurs[a] ; ils posent un piège[b] et capturent des hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. Autres traductions possibles : « comme des oiseleurs à l’affût » ou « comme lorsque des oiseleurs s’accroupissent ». L’image est celle de chasseurs dissimulés qui attendent de prendre leur proie.'
    reason: lexical_alternative
  - marker: b
    text: Ou « une embûche » ou « un dispositif destructeur ». Le mot hébreu désigne ce qui détruit ou cause la ruine ; dans ce contexte, il s’agit probablement d’un dispositif destiné à capturer des personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’accusation formulée dans le contexte précédent.
- source_word: נִמְצְאוּ בְעַמִּי רְשָׁעִים
  choice: il se trouve parmi mon peuple des hommes méchants
  rationale: La tournure impersonnelle est naturelle en français et rend la présence de personnes mauvaises au sein du peuple ; « hommes » conserve la forme masculine du substantif hébreu.
- source_word: יָשׁוּר כְּשַׁךְ יְקוּשִׁים
  choice: Ils guettent, tapis comme des oiseleurs
  rationale: Rend l’image de chasseurs d’oiseaux dissimulés qui attendent leur proie, tout en signalant en note l’incertitude d’une expression hébraïque difficile.
- source_word: הִצִּיבוּ
  choice: ils posent
  rationale: Verbe français idiomatique pour la mise en place d’un piège.
- source_word: מַשְׁחִית
  choice: un piège destructeur
  rationale: Conserve explicitement la valeur destructrice du terme hébreu tout en l’inscrivant dans la métaphore immédiate du piégeage.
- source_word: אֲנָשִׁים יִלְכֹּדוּ
  choice: capturent des hommes
  rationale: « Capturent » restitue le verbe de prise dans le contexte du piège, et « hommes » correspond au pluriel masculin אֲנָשִׁים.
