id: JER.30.4
reference: Jeremiah 30:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל יִשְׂרָאֵ֖ל וְ/אֶל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/004.yaml
  text: And these are the words that Yahweh spoke concerning Israel and Judah:[a]
translation:
  language: fr
  text: 'Et voici les paroles que Yahweh prononça au sujet d’Israël et de Juda[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Israël et à Juda ». La préposition hébraïque peut désigner les destinataires des paroles; dans cet en-tête, elle peut aussi introduire ceux qu’elles concernent.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Et voici
  rationale: « Et » maintient le lien avec le contexte précédent, tandis que « voici » rend naturellement en français la présentation démonstrative introduite par אֵלֶּה.
- source_word: הַ/דְּבָרִים
  choice: les paroles
  rationale: Dans cette formule prophétique, דְּבָרִים désigne les paroles prononcées plutôt que des choses ou des affaires.
- source_word: דִּבֶּר
  choice: prononça
  rationale: Le verbe français « prononcer » convient à l’introduction solennelle de paroles divines et évite la tournure moins naturelle « parla des paroles ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, sans lui substituer un titre.
- source_word: אֶל יִשְׂרָאֵל וְ/אֶל יְהוּדָה
  choice: au sujet d’Israël et de Juda
  rationale: Dans cette phrase qui sert d’en-tête à l’oracle, la préposition peut présenter Israël et Juda comme le sujet des paroles. La possibilité plus littérale d’un discours qui leur est adressé est conservée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin propre; sa translittération le distingue d’un titre.
- issue: Valeur de אֶל devant Israël et Juda
  choice: au sujet d’Israël et de Juda
  alternative: à Israël et à Juda
  rationale: Le contexte d’en-tête prophétique favorise ici le sens référentiel, mais l’hébreu permet également de comprendre qu’il s’agit des destinataires. La note préserve cette ambiguïté sans trancher silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici » conserve la continuité du discours tout en donnant à la formule introductive une tournure française courante.
