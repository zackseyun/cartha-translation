    rationale: « Dans les jours à venir » exprime un futur indéterminé, mais ne laisse pas entendre la nuance de « derniers/ultérieurs jours » portée par l’expression prophétique hébraïque. Employer « dans les derniers jours » sans expliciter une chronologie dans la traduction conserve mieux cette tension; la note peut présenter « dans les jours à venir » comme possibilité interprétative.
