source:
  edition: WLC
  text: לֹ֣א יָשׁ֗וּב חֲרוֹן֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים תִּתְבּ֥וֹנְנוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/024.yaml
  text: The burning anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart. In the latter days you will understand it.
translation:
  language: fr
  text: L’ardente colère de Yahweh ne se détournera pas jusqu’à ce qu’il ait agi, jusqu’à ce qu’il ait mené à bien les projets de son cœur. Dans les derniers jours[a], vous le comprendrez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les jours à venir » ou « à la fin des jours ». L’expression hébraïque peut désigner l’aboutissement futur des desseins de Dieu sans en préciser exactement le moment.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרוֹן אַף
  choice: l’ardente colère
  rationale: Cette expression conserve l’image hébraïque de la chaleur de la colère tout en restant naturelle et digne en français.
- source_word: יָשׁוּב
  choice: ne se détournera pas
  rationale: Le verbe שׁוב évoque un mouvement de retour ou de détour. Ici, cette formulation exprime que la colère ne cessera ni ne changera de cours avant l’accomplissement du dessein annoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עַד עֲשֹׂתוֹ
  choice: jusqu’à ce qu’il ait agi
  rationale: Cette formulation garde l’objet de l’action implicite, comme en hébreu, et évite d’ajouter un complément non exprimé.
- source_word: הֲקִימוֹ
  choice: qu’il ait mené à bien
  rationale: Le hifil de קום indique ici la mise en œuvre effective. « Mener à bien » s’emploie naturellement avec « projets » et exprime leur réalisation ferme.
- source_word: מְזִמּוֹת לִבּוֹ
  choice: les projets de son cœur
  rationale: « Projets » rend la délibération exprimée par מְזִמּוֹת, tandis que « de son cœur » conserve l’anthropologie et l’image du texte source.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Dans les jours à venir
  rationale: Cette expression française naturelle préserve l’horizon futur de la formule prophétique sans lui imposer une chronologie eschatologique plus précise que l’hébreu.
- source_word: תִּתְבּוֹנְנוּ בָהּ
  choice: vous le comprendrez
  rationale: La forme verbale désigne une compréhension attentive ou un discernement. Le pronom neutre français renvoie naturellement à ce qui vient d’être annoncé.
theological_decisions:
- issue: Portée temporelle et eschatologique de בְּאַחֲרִית הַיָּמִים
  choice: Dans les jours à venir
  alternative: Dans les derniers jours ; à la fin des jours
  rationale: La formule peut viser l’aboutissement futur des desseins de Dieu et porter une résonance eschatologique, sans préciser à elle seule le moment exact. La traduction principale en conserve donc l’ouverture, et la note signale des rendus plus littéraux.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux propositions introduites par « jusqu’à ce que » reflète l’insistance de l’hébreu sans alourdir excessivement la phrase. Le marqueur de note est placé sur l’expression temporelle qu’il explique.
