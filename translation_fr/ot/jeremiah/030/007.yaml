source:
  edition: WLC
  text: ה֗וֹי כִּ֥י גָד֛וֹל הַ/יּ֥וֹם הַ/ה֖וּא מֵ/אַ֣יִן כָּמֹ֑/הוּ וְ/עֵֽת צָרָ֥ה הִיא֙ לְ/יַֽעֲקֹ֔ב וּ/מִמֶּ֖/נָּה יִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/007.yaml
  text: Alas! For that day is great[a]; there is none like it. It is a time of distress for Jacob[c][b], yet he will be saved out of it.
translation:
  language: fr
  text: Hélas ! Car ce jour-là est grand[a] ; aucun ne lui est comparable. C’est un temps de détresse pour Jacob[b], mais il sera sauvé de cette détresse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Malheur ! » ; l’interjection initiale exprime l’alarme ou la lamentation.
    reason: lexical_alternative
  - marker: b
    text: Ou « une période d’angoisse pour Jacob ».
    reason: lexical_alternative
  - marker: c
    text: Ou « mais il sera délivré de cette détresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Hélas !
  rationale: Interjection exprimant ici la lamentation ou l’effroi. « Hélas ! » restitue naturellement l’exclamation sans lui imposer la valeur plus nettement judiciaire de « Malheur ! ».
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exclamation initiale et conserve clairement sa valeur explicative.
- source_word: גָדוֹל
  choice: grand
  rationale: Le mot désigne d’abord ce qui est grand par son importance ou son ampleur. Le caractère redoutable du jour ressort du contexte sans qu’il faille traduire par « terrible ».
- source_word: הַיּוֹם הַהוּא
  choice: ce jour
  rationale: Expression prophétique désignant un jour précis. En français, « ce jour » garde la force démonstrative de l’hébreu dans un style naturel.
- source_word: מֵאַיִן כָּמֹהוּ
  choice: aucun autre ne lui ressemble
  rationale: Rend l’expression idiomatique d’incomparabilité tout en évitant la tournure moins naturelle « il n’y en a aucun comme lui ».
- source_word: וְעֵת צָרָה
  choice: C’est un temps de détresse
  rationale: עֵת désigne un temps ou une période, et צָרָה une détresse, une adversité ou une situation critique. « Temps de détresse » est clair, grave et fidèle.
- source_word: לְיַעֲקֹב
  choice: pour Jacob
  rationale: Conserve le nom propre du texte hébreu plutôt que de l’expliciter par « Israël » ou « les descendants de Jacob ».
- source_word: וּמִמֶּנָּה
  choice: en
  rationale: Le pronom français « en » renvoie naturellement au temps de détresse et exprime la délivrance hors de celui-ci.
- source_word: יִוָּשֵׁעַ
  choice: il sera sauvé
  rationale: Le nifal de ישׁע exprime le fait d’être sauvé ou délivré. « Sera sauvé » maintient le vocabulaire biblique du salut, tandis que « en » en précise ici la dimension concrète.
theological_decisions:
- issue: Référent de « Jacob »
  choice: Le nom « Jacob » est maintenu et représente collectivement le peuple sans que cette identification soit explicitée dans le corps du texte.
  alternative: Israël ; les descendants de Jacob ; le peuple de Dieu
  rationale: Le texte hébreu nomme Jacob. Garder ce nom préserve la texture prophétique et l’ambiguïté entre la figure personnelle et le peuple personnifié.
- issue: Portée de יִוָּשֵׁעַ
  choice: « il sera sauvé »
  alternative: il sera délivré ; il sera secouru
  rationale: Cette traduction conserve la résonance plus large du vocabulaire du salut sans imposer un sens exclusivement spirituel ou eschatologique, puisque le complément indique un salut hors de la détresse.
- issue: Relation logique de la dernière proposition
  choice: « mais »
  alternative: et
  rationale: La conjonction hébraïque ו peut être simplement coordonnante, mais le contraste entre la détresse et le salut est net. « Mais » le rend naturellement sans modifier le contenu propositionnel.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation garde le ton de lamentation et l’intensité prophétique. Les formulations confessionnelles particulières sont évitées, et le nom « Jacob » ainsi que la portée contextuelle du salut restent ouverts à leur tension littéraire et théologique.
