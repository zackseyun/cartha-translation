  naturalness: Le français est dans l’ensemble naturel et d’un registre prophétique approprié. « Il sera sauvé de cette détresse » est plus idiomatique et plus clair que « il en sera sauvé », tout en conservant le vocabulaire du salut.
  terminology: « Hélas ! », « détresse », « Jacob » et « sauvé » sont des choix appropriés. La note a doit proposer une véritable alternative pour l’interjection הוֹי ; « redoutable » est une interprétation contextuelle de גָדוֹל, non une alternative lexicale à « Hélas ! ».
