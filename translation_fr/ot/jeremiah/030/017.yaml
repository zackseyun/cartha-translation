  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ אַעֲלֶ֨ה אֲרֻכָ֥ה לָ֛/ךְ וּ/מִ/מַּכּוֹתַ֥יִ/ךְ אֶרְפָּאֵ֖/ךְ נְאֻם יְהוָ֑ה כִּ֤י נִדָּחָה֙ קָ֣רְאוּ לָ֔/ךְ צִיּ֣וֹן הִ֔יא דֹּרֵ֖שׁ אֵ֥ין לָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/017.yaml
  text: 'For I will bring healing to you[a], and I will heal you from your wounds, declares Yahweh, because they have called you an outcast: ‘It is Zion[c][b]; no one cares for her.’'
translation:
  language: fr
  text: 'Car je ferai venir la guérison pour toi[a] et je te guérirai de tes blessures, déclare Yahvé, parce qu’on t’a appelée « la Rejetée »[b] : « C’est Sion, dont personne ne se soucie[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je rétablirai ta santé ». L’expression hébraïque signifie littéralement « je ferai monter la guérison pour toi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la Chassée », « la Bannie ». Le mot hébreu désigne une personne repoussée ou mise à l’écart.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Sion — personne ne la recherche », ce qui peut signifier que personne ne prend de ses nouvelles, ne se préoccupe d’elle ou ne vient à son aide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲלֶה אֲרֻכָה
  choice: je ferai venir la guérison
  rationale: Cette formulation garde la valeur causative de l’expression hébraïque, littéralement « je ferai monter la guérison », tout en restant claire en français.
- source_word: וּמִמַּכּוֹתַיִךְ אֶרְפָּאֵךְ
  choice: et je te guérirai de tes blessures
  rationale: « Blessures » convient au contexte de guérison et la construction conserve la personne guérie comme objet, ainsi que le complément introduit par מִן.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: Formule prophétique concise et solennelle ; « Yahvé » rend le nom divin sous sa forme française courante.
- source_word: נִדָּחָה
  choice: la Rejetée
  rationale: Le participe passif féminin désigne celle qui a été repoussée, chassée ou abandonnée. La majuscule signale ici le sobriquet infamant donné à Sion.
- source_word: קָרְאוּ לָךְ
  choice: on t’a appelée
  rationale: Le sujet pluriel n’étant pas identifié, le pronom français « on » restitue naturellement cette indétermination. Le féminin correspond à Sion et à la forme hébraïque.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: דֹּרֵשׁ אֵין לָהּ
  choice: dont personne ne se soucie
  rationale: Le verbe peut évoquer le fait de rechercher, de prendre des nouvelles ou de venir en aide. En contexte, cette formulation exprime naturellement l’abandon, tandis qu’une note conserve le sens plus littéral.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte donne explicitement le tétragramme. « Yahvé » préserve le nom propre divin dans une forme française usuelle au lieu de le remplacer par un titre.
- issue: Portée de la promesse de guérison
  choice: Conserver l’image concrète de la guérison et des blessures
  alternative: Expliciter directement une restauration nationale ou spirituelle
  rationale: Le contexte concerne la restauration de Sion, mais le verset formule cette promesse au moyen d’une métaphore corporelle. La traduction ne réduit pas cette tension en imposant une seule interprétation.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement correspond à l’adresse directe à Sion personnifiée au féminin. Les guillemets emboîtés distinguent le sobriquet de la parole méprisante rapportée.
