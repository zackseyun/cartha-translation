  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָנ֣וּשׁ לְ/שִׁבְרֵ֑/ךְ נַחְלָ֖ה מַכָּתֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/012.yaml
  text: 'For thus says Yahweh: Your fracture is incurable[a]; your wound is grievous.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh : ta fracture est incurable[a] ; ta plaie est grave.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ta blessure est incurable ; ta plaie est grave. »'
    reason: Alternative lexicale pour שֶׁבֶר (« fracture », « blessure »), tout en conservant la valeur d’אָנּוּשׁ et de נַחְלָה dans l’image médicale.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou la déclaration divine en lien avec le contexte précédent.
- source_word: כֹה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Rend naturellement en français moderne la formule prophétique du messager, tout en conservant le nom divin.
- source_word: אָנושׁ
  choice: incurable
  rationale: Dans cette métaphore médicale, le terme indique que la fracture est désespérée, au-delà de la guérison.
- source_word: לְשִׁבְרֵךְ
  choice: ta fracture
  rationale: Préserve l’image concrète d’une rupture ou d’une cassure corporelle, en parallèle avec la plaie.
- source_word: נַחְלָה
  choice: est grave
  rationale: Exprime la gravité extrême de l’atteinte sans répéter « incurable »; le sens exact peut aussi être compris comme « douloureuse ».
- source_word: מַכָּתֵךְ
  choice: ta plaie
  rationale: Correspond naturellement à l’image corporelle et médicale du contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme; « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Portée des images médicales
  choice: fracture… plaie
  alternative: blessure… mal
  rationale: La traduction maintient les deux termes imagés et leur parallélisme sans réduire d’emblée la déclaration à une interprétation spirituelle ou politique.
translation_notes:
  register: Français international moderne, digne et direct. La formule « voici ce que dit » est idiomatique tout en gardant la solennité prophétique; le tutoiement singulier correspond aux suffixes hébreux féminins singuliers, qui s’adressent ici à la collectivité personnifiée.
