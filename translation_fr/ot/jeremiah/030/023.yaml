  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה סַ֖עַר מִתְגּוֹרֵ֑ר עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/023.yaml
  text: Look[a], Yahweh’s storm of wrath has gone out, a sweeping tempest[b]; it will whirl down on the head of the wicked.
translation:
  language: fr
  text: 'Voici[a] : la tempête de Yahweh, sa colère, est sortie, un tourbillon qui se déchaîne ; elle tourbillonnera sur la tête des méchants[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Voici : la tempête de Yahweh, la colère, est sortie ; un tourbillon qui se déchaîne. » L’hébreu accumule abruptement des termes de tempête et de colère.'
    reason: lexical_alternative
  - marker: b
    text: Le dernier verbe est difficile. Il peut aussi être rendu par « elle s’abattra » ou « elle fondra » sur la tête des méchants.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit l’annonce avec force et immédiateté, dans un français actuel mais digne.
- source_word: סַעֲרַת יְהוָה
  choice: la tempête de Yahweh
  rationale: Conserve le rapport construit hébreu et présente la tempête comme venant de Yahweh ou lui appartenant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: חֵמָה
  choice: Sa fureur
  rationale: Exprime l’intensité de la colère divine dans ce contexte de jugement ; le possessif explicite naturellement en français le lien avec Yahweh.
- source_word: יָצְאָה
  choice: s’est déchaînée
  rationale: Rend le parfait comme une action déjà mise en mouvement et convient à l’image d’une fureur-tempête, sans aplatir le mouvement du verbe.
- source_word: סַעַר מִתְגּוֹרֵר
  choice: un tourbillon impétueux
  rationale: Préserve l’accumulation des termes de tempête et traduit le participe difficile par l’idée d’un mouvement violent et irrésistible.
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: sur la tête des méchants
  rationale: Maintient l’image concrète hébraïque du jugement qui retombe sur la tête des personnes mauvaises.
- source_word: יָחוּל
  choice: il tournoiera
  rationale: Retient le sens de mouvement circulaire suggéré par le contexte de tempête, tout en signalant en note l’incertitude du verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; la translittération préserve le nom personnel sans introduire un titre à sa place.
- issue: Rapport entre חֵמָה et la tempête
  choice: Sa fureur s’est déchaînée
  alternative: une tempête de Yahweh, la fureur est sortie
  rationale: Le texte juxtapose des termes et permet plusieurs analyses syntaxiques. Le corps du texte donne une formulation française naturelle, tandis que la note conserve la possibilité d’une apposition plus abrupte.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La ponctuation restitue l’élan de l’annonce prophétique. « Méchants » garde la portée morale de רְשָׁעִים, et l’image concrète de la tête est conservée.
