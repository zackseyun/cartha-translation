- from: Voici[a] la tempête de Yahweh ! Sa fureur s’est déchaînée, un tourbillon impétueux ; il tournoiera sur la tête des méchants[b].
  to: 'Voici[a] : la tempête de Yahweh, sa colère, est sortie, un tourbillon qui se déchaîne ; elle tourbillonnera sur la tête des méchants[b].'
  rationale: La correction rétablit le sens spatial et dynamique de « est sortie » pour la colère-tempête de Yahweh, tout en conservant l’ambiguïté syntaxique et l’intensification poétique du texte hébreu. Elle ajuste aussi la note a afin qu’elle ne passe pas indûment du défini à l’indéfini.
