base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/019.yaml
  text: From them will come thanksgiving and the sound of those who rejoice[a]; I will multiply them, and they will not be few; I will honor them[b], and they will not be insignificant.
translation:
  language: fr
  text: D’eux viendront des actions de grâce et le son de ceux qui se réjouissent[a]. Je les rendrai nombreux, et ils ne seront pas en petit nombre ; je les honorerai[b], et ils ne seront pas insignifiants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le son de ceux qui font la fête » ou « de ceux qui jouent » : le participe hébreu peut évoquer le rire joyeux, le jeu ou les réjouissances.'
    reason: lexical_alternative
  - marker: b
    text: Ou « je les rendrai importants, et ils ne seront pas petits ». Les termes hébreux peuvent renvoyer tant à l’honneur et au rang social qu’à l’importance ou à la petitesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵהֶם
  choice: De chez eux s’élèveront
  rationale: Le verbe qal, employé dans ce discours prophétique, a une valeur future. Avec מֵהֶם, la formulation exprime ce qui émanera de la communauté restaurée ; « s’élèveront » est naturel en français avec les actions de grâce et les voix.
- source_word: תּוֹדָה
  choice: des actions de grâce
  rationale: Dans ce contexte, le nom désigne la reconnaissance exprimée envers Dieu plutôt qu’un sacrifice précis. Le pluriel français est idiomatique pour une expression collective de gratitude.
- source_word: וְקוֹל מְשַׂחֲקִים
  choice: et les voix de ceux qui se réjouissent[a]
  rationale: קוֹל désigne ici l’expression audible de la fête. Le participe de שׂחק peut évoquer le rire, le jeu ou les réjouissances ; « ceux qui se réjouissent » convient au contexte sans imposer une image trop étroite.
- source_word: וְהִרְבִּתִים
  choice: Je les rendrai nombreux
  rationale: Le hiphil de רבה exprime l’action de faire croître en nombre. Cette formulation française est claire et conserve le caractère concret de la promesse.
- source_word: וְלֹא יִמְעָטוּ
  choice: et ils ne seront pas peu nombreux
  rationale: מעט signifie ici devenir peu nombreux ou diminuer. Cette traduction garde le contraste numérique explicite avec la proposition précédente, malgré une légère répétition voulue.
- source_word: וְהִכְבַּדְתִּים
  choice: je les honorerai[b]
  rationale: Le hiphil de כבד peut signifier rendre important, glorieux ou honoré. « Honorer » exprime naturellement en français l’élévation de leur condition sociale.
- source_word: וְלֹא יִצְעָרוּ
  choice: et ils ne seront pas insignifiants
  rationale: צער peut exprimer la petitesse, la faiblesse numérique ou le peu d’importance. En parallèle avec « je les honorerai », le sens relatif au statut paraît dominant, sans exclure les autres nuances signalées en note.
theological_decisions:
- issue: Nature des bénédictions promises lors de la restauration
  choice: Présenter une restauration communautaire concrète, marquée par la reconnaissance, la joie, l’accroissement et l’honneur.
  alternative: Spiritualiser entièrement la promesse, ou la limiter exclusivement à une exaltation nationale et politique.
  rationale: Le texte hébreu énonce directement ces dimensions de la restauration sans préciser un accomplissement ecclésiologique ou eschatologique ultérieur. La traduction n’ajoute donc aucun cadre doctrinal absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme hébreu. « De chez eux s’élèveront » rend de façon idiomatique l’origine des louanges, tandis que la répétition de « nombreux » préserve le lien lexical et logique de la promesse d’accroissement.
