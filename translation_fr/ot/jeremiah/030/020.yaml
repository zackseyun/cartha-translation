source:
  edition: WLC
  text: וְ/הָי֤וּ בָנָי/ו֙ כְּ/קֶ֔דֶם וַ/עֲדָת֖/וֹ לְ/פָנַ֣/י תִּכּ֑וֹן וּ/פָ֣קַדְתִּ֔י עַ֖ל כָּל לֹחֲצָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/020.yaml
  text: His children will be as in former times[a], and his congregation will be established before me[d][c][b]; and I will punish all his oppressors.
translation:
  language: fr
  text: Ses enfants[a] seront comme autrefois[b], et sa communauté[c][d] sera établie devant moi ; je punirai tous ceux qui l’oppriment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses fils » ; le terme peut désigner collectivement ses enfants ou ses descendants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme auparavant ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « son assemblée ».'
    reason: lexical_alternative
  - marker: d
    text: Le singulier « sa » renvoie probablement à Jacob ou à Israël considéré comme un tout.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: seront
  rationale: Le qatal précédé de la conjonction poursuit ici, dans le discours prophétique, l’annonce future du rétablissement.
- source_word: בָנָיו
  choice: ses enfants
  rationale: Bien que בנים puisse signifier littéralement « fils », le mot désigne aussi collectivement les enfants ou descendants ; « enfants » convient au rétablissement du peuple.
- source_word: כְּקֶדֶם
  choice: comme autrefois
  rationale: Cette formulation naturelle conserve la comparaison avec une situation antérieure sans en préciser davantage la période.
- source_word: וַעֲדָתוֹ
  choice: sa communauté
  rationale: עֵדָה désigne une collectivité constituée ou assemblée. « Communauté » est actuel et compréhensible, tout en gardant le sens collectif.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Rendu direct qui préserve l’idée de présence et de relation à Dieu.
- source_word: תִּכּוֹן
  choice: sera solidement établie
  rationale: Le niphal de כון exprime l’état de ce qui est établi, affermi ou rendu stable ; l’adverbe fait ressortir cette nuance sans changer la voix passive.
- source_word: וּפָקַדְתִּי
  choice: je punirai
  rationale: Dans ce contexte de jugement, avec עַל et les oppresseurs comme objet, פקד a une valeur punitive.
- source_word: עַל כָּל לֹחֲצָיו
  choice: tous ceux qui l’oppriment
  rationale: Le participe substantivé désigne ceux qui exercent une oppression sur lui ; cette tournure française conserve clairement l’action en cours et le suffixe singulier.
theological_decisions:
- issue: Référent des suffixes possessifs singuliers (« ses enfants », « sa communauté », « ceux qui l’oppriment »)
  choice: Conserver les formes singulières sans expliciter leur référent.
  alternative: Employer le pluriel (« leurs enfants », « leur communauté ») en interprétant explicitement Jacob ou Israël comme une collectivité.
  rationale: L’hébreu emploie des suffixes singuliers, probablement dans une personnification collective de Jacob ou d’Israël. Les maintenir préserve la formulation et son ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Communauté » évite la coloration ecclésiale plus marquée de « congrégation ». La ponctuation conserve les deux volets de la promesse et du jugement.
