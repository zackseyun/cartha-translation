    issue: Formulations françaises opaques pour le singulier collectif
    rationale: « Issu de lui » et « du milieu de lui » sont grammaticalement possibles mais peu idiomatiques et ambiguës en français moderne. Le contexte permet de rendre explicitement le référent collectif par « l’un des siens » et « de son peuple ».
  - severity: medium
    issue: Le conditionnel ne reflète pas le parfait hébreu dans la question rhétorique
    rationale: עָרַב est au parfait. « Qui donc a engagé son cœur » conserve mieux l’aspect présenté comme accompli, sans supprimer la force rhétorique.
  - severity: low
    issue: Ancre de la note lexicale a mal placée
    rationale: La note a explique אַדִּיר (« chef », « noble », « homme puissant »), mais elle est ancrée sur « lui ». Elle doit suivre le terme traduit par « chef ».
