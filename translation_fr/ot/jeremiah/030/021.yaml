  text: וְ/הָיָ֨ה אַדִּיר֜/וֹ מִמֶּ֗/נּוּ וּ/מֹֽשְׁל/וֹ֙ מִ/קִּרְבּ֣/וֹ יֵצֵ֔א וְ/הִקְרַבְתִּ֖י/ו וְ/נִגַּ֣שׁ אֵלָ֑/י כִּי֩ מִ֨י הוּא זֶ֜ה עָרַ֧ב אֶת לִבּ֛/וֹ לָ/גֶ֥שֶׁת אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/021.yaml
  text: His ruler will be one of them[a], and his governor will come out from his midst. I will bring him near, and he will approach me[c][b], for who is this who has pledged his heart to approach me? declares Yahweh.
translation:
  language: fr
  text: Son chef[a] sera l’un des siens[b], et son dirigeant sortira de son peuple. Je le ferai approcher, et il s’approchera de moi ; car qui donc a engagé son cœur à s’approcher de moi[c] ? — déclaration de YHWH.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son noble » ou « son homme puissant » ; le terme hébreu désigne une personne éminente, puissante ou noble.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « issu de lui ». Le singulier renvoie collectivement au peuple : le chef vient de son propre peuple.'
    reason: clarification
  - marker: c
    text: Ou « car qui donc oserait dans son cœur s’approcher de moi ? » L’expression hébraïque parle littéralement d’engager ou de donner son cœur en gage.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדִּירוֹ
  choice: son chef
  rationale: Le terme peut désigner un homme puissant, éminent ou noble. Dans le parallélisme avec מֹשְׁלוֹ, « chef » exprime naturellement la fonction dirigeante sans préciser indûment un titre politique.
- source_word: מִמֶּנּוּ
  choice: issu de lui
  rationale: La forme signifie littéralement « de lui » et renvoie ici collectivement au peuple évoqué dans le contexte. Cette formulation conserve le singulier collectif et l’idée que le chef vient du peuple lui-même.
- source_word: מֹשְׁלוֹ
  choice: celui qui le gouvernera
  rationale: Le participe de משל désigne celui qui exerce le pouvoir. La périphrase évite de répéter « chef » tout en gardant clairement le sens de gouvernement.
- source_word: מִקִּרְבּוֹ
  choice: du milieu de lui
  rationale: Cette traduction conserve l’image et le singulier collectif de l’hébreu, malgré une légère solennité inhabituelle en français.
- source_word: וְהִקְרַבְתִּיו
  choice: Je le ferai approcher
  rationale: Le hifil est causatif et souligne que YHWH prend l’initiative de donner à ce dirigeant accès auprès de lui.
- source_word: וְנִגַּשׁ אֵלַי
  choice: et il s’approchera de moi
  rationale: « S’approcher » préserve la répétition de la racine נגשׁ et ses possibles résonances cultuelles ou liées à l’accès à un souverain.
- source_word: עָרַב אֶת־לִבּוֹ
  choice: engagerait son cœur
  rationale: L’expression évoque le fait de donner son cœur en gage ou de le risquer. « Engager son cœur » conserve la métaphore et l’idée d’un engagement audacieux sans trancher entre elles.
- source_word: לָגֶשֶׁת אֵלַי
  choice: à s’approcher de moi
  rationale: La même traduction de נגשׁ maintient la répétition intentionnelle du texte hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de YHWH
  rationale: Cette formule solennelle rend distinctement l’expression prophétique נְאֻם et conserve le nom divin sous la forme YHWH.
theological_decisions:
- issue: Nature de l’accès du dirigeant à Dieu
  choice: Le texte présente un dirigeant issu du peuple, que YHWH lui-même fait approcher de lui.
  alternative: Identifier explicitement ce dirigeant comme le Messie, un gouverneur politique ou un roi-prêtre.
  rationale: Le vocabulaire peut évoquer un accès privilégié, voire cultuel, mais le verset ne donne explicitement aucun de ces titres. La traduction maintient donc cette tension sans imposer une identification doctrinale.
- issue: Sens de l’engagement du cœur
  choice: Conserver l’image « engager son cœur » et signaler en note la nuance d’audace.
  alternative: Traduire directement « oserait s’approcher de moi ».
  rationale: Le verbe ערב exprime d’abord l’idée de gage ou de cautionnement, tandis que l’audace résulte du contexte. Garder la métaphore évite d’effacer cette ambiguïté.
translation_notes:
  register: Français moderne, digne et relativement formel. Le singulier collectif de l’hébreu est conservé dans « issu de lui » et « du milieu de lui », avec une note explicative. La répétition de « s’approcher » est intentionnelle. Le nom divin est rendu par « YHWH » afin de représenter directement le tétragramme.
