revisions:
- from: Son chef sera issu de lui[a], et celui qui le gouvernera sortira du milieu de lui[b]. Je le ferai approcher, et il s’approchera de moi, car qui donc engagerait son cœur à s’approcher de moi[c] ? — déclaration de YHWH.
  to: Son chef[a] sera l’un des siens[b], et son dirigeant sortira de son peuple. Je le ferai approcher, et il s’approchera de moi ; car qui donc a engagé son cœur à s’approcher de moi[c] ? — déclaration de YHWH.
  rationale: La révision remplace des calques singuliers peu naturels par des formulations françaises claires qui rendent le référent collectif attesté par le contexte, tout en maintenant l’origine interne du dirigeant. Elle rend le parfait hébreu par « a engagé », conserve la répétition de « s’approcher », et replace les ancres de notes sur les expressions qu’elles expliquent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : un dirigeant issu du peuple, amené par YHWH à s’approcher de lui, puis la question rhétorique sur celui qui a « engagé son cœur ». Toutefois, le conditionnel « engagerait » atténue le parfait hébreu ערב (« a engagé / a donné en gage »), et les singuliers français « issu de lui » et « du milieu de lui » sont inutilement opaques, alors que le référent est collectivement le peuple de Jacob.'
  naturalness: Le registre est digne, mais « issu de lui » et surtout « du milieu de lui » ne sont pas naturels en français moderne et risquent de faire comprendre un individu plutôt que le peuple. « L’un des siens » et « de son peuple » communiquent clairement le singulier collectif sans surcharge interprétative.
  terminology: '« Chef », « dirigeant », « faire approcher », « s’approcher », « engager son cœur » et « déclaration de YHWH » conviennent au registre et préservent les répétitions et l’accès privilégié sans identifier doctrinalement le dirigeant. Les ancres de notes doivent être réalignées : la note sur אַדִּיר doit suivre « chef », non « lui ».'
  issues:
