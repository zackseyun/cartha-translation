id: JER.30.15
reference: Jeremiah 30:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַה תִּזְעַק֙ עַל שִׁבְרֵ֔/ךְ אָנ֖וּשׁ מַכְאֹבֵ֑/ךְ עַ֣ל רֹ֣ב עֲוֺנֵ֗/ךְ עָֽצְמוּ֙ חַטֹּאתַ֔יִ/ךְ עָשִׂ֥יתִי אֵ֖לֶּה לָֽ/ךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/015.yaml
  text: Why do you cry out over your injury? Your pain is incurable[a]. Because your iniquity is great, because your sins are many[b], I have done these things to you.
translation:
  language: fr
  text: Pourquoi pousses-tu des cris à cause de ta blessure[a] ? Ta douleur est incurable[b]. Parce que ta faute est immense, parce que tes péchés sont nombreux, je t’ai fait tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner une fracture, une rupture ou un désastre.
    reason: lexical_alternative
  - marker: b
    text: Ou « désespérée » ou « gravissime ». L’adjectif hébreu décrit un mal très grave ou sans remède.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תִּזְעַק
  choice: Pourquoi pousses-tu des cris
  rationale: מַה introduit ici une question rhétorique exprimant « pourquoi », tandis que זעק désigne un cri intense poussé dans la détresse. « Pousser des cris » en conserve la force.
- source_word: עַל שִׁבְרֵךְ
  choice: à cause de ta blessure
  rationale: שֶׁבֶר peut évoquer une fracture, une rupture ou une blessure. Dans cette image de souffrance, « blessure » est naturel et suffisamment large ; עַל indique ce qui provoque la plainte.
- source_word: אָנושׁ מַכְאֹבֵךְ
  choice: Ta douleur est incurable
  rationale: מַכְאוֹב désigne la douleur ou la souffrance, et אָנושׁ qualifie un mal grave, désespéré ou sans remède. « Incurable » exprime ici le caractère irrémédiable de la douleur.
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: Parce que ta faute est immense
  rationale: עַל introduit la cause du jugement, רֹב exprime ici la grandeur ou l’ampleur, et עָוֹן désigne la faute morale. « Faute » est plus immédiatement compréhensible en français moderne qu’« iniquité ».
- source_word: עָצְמוּ חַטֹּאתַיִךְ
  choice: parce que tes péchés sont nombreux
  rationale: Avec le pluriel « péchés », עצם exprime naturellement leur grand nombre ou leur importance. Le parallélisme favorise ici le sens quantitatif.
- source_word: עָשִׂיתִי אֵלֶּה לָךְ
  choice: je t’ai fait tout cela
  rationale: Le parfait à la première personne maintient l’action directe du locuteur. « Tout cela » rend naturellement en français le démonstratif pluriel אֵלֶּה dans ce contexte.
theological_decisions:
- issue: L’action divine dans le jugement
  choice: « je t’ai fait tout cela »
  alternative: « tout cela t’est arrivé »
  rationale: L’hébreu emploie explicitement la première personne du singulier עָשִׂיתִי. La traduction conserve cette attribution directe au locuteur, identifié comme le Seigneur par le contexte, sans transformer le jugement en événement impersonnel.
translation_notes:
  register: Français international moderne, naturel et digne. « Pousses-tu des cris » garde l’intensité du verbe hébreu ; « faute » évite un terme inutilement archaïque, tandis que « péchés » conserve clairement la dimension morale et théologique.
