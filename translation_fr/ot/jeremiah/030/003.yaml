id: JER.30.3
reference: Jeremiah 30:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֠י הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ֠/שַׁבְתִּי אֶת שְׁב֨וּת עַמִּ֧/י יִשְׂרָאֵ֛ל וִֽ/יהוּדָ֖ה אָמַ֣ר יְהוָ֑ה וַ/הֲשִׁבֹתִ֗י/ם אֶל הָ/אָ֛רֶץ אֲשֶׁר נָתַ֥תִּי לַ/אֲבוֹתָ֖/ם וִֽ/ירֵשֽׁוּ/הָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/003.yaml
  text: For look, days are coming, declares the LORD, when I will restore the fortunes of my people Israel and Judah, says the LORD, and I will bring them back to the land that I gave to their fathers, and they will possess it.
translation:
  language: fr
  text: Car voici que des jours viennent — déclaration du SEIGNEUR — où je rétablirai la situation de mon peuple, Israël et Juda, dit le SEIGNEUR. Je les ramènerai dans le pays que j’ai donné à leurs ancêtres, et ils en prendront possession.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici que
  rationale: Conserve à la fois la liaison explicative de כִּי et la formule d’annonce הִנֵּה dans un français digne et naturel.
- source_word: נְאֻם יְהוָה
  choice: déclaration du SEIGNEUR
  rationale: Rend la formule prophétique solennelle et le nom divin selon la convention française en petites capitales.
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: je rétablirai la situation
  rationale: L’expression idiomatique désigne un renversement de condition et une restauration; cette formulation évite de la limiter au seul retour des captifs.
- source_word: לַאֲבוֹתָם
  choice: à leurs ancêtres
  rationale: « Ancêtres » communique naturellement le sens collectif de « pères » dans ce contexte historique.
- source_word: וִירֵשׁוּהָ
  choice: ils en prendront possession
  rationale: Exprime l’idée d’entrer en possession du pays, sans réduire le verbe à une simple résidence.
theological_decisions:
- issue: Portée de la restauration annoncée
  choice: « je rétablirai la situation de mon peuple, Israël et Juda »
  alternative: « je ramènerai les captifs de mon peuple »
  rationale: Le tour hébreu שׁוב שׁבות peut évoquer le retour d’exil tout en portant un sens plus large de restauration. Le choix retenu conserve cette amplitude, tandis que la proposition suivante explicite le retour au pays.
- issue: Référent d’Israël et de Juda
  choice: Maintenir les deux noms coordonnés sans les fusionner ni préciser leur relation
  alternative: « tout mon peuple, Israël et Juda »
  rationale: Le texte nomme distinctement Israël et Juda; la traduction préserve cette formulation et sa tension historique et théologique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition des deux formules divines est conservée. « Pays » est retenu pour הָאָרֶץ dans le contexte du territoire donné aux ancêtres.
