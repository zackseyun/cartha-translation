source:
  edition: WLC
  text: וְ/אַתָּ֡ה אַל תִּירָא֩ עַבְדִּ֨/י יַעֲקֹ֤ב נְאֻם יְהֹוָה֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁיעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲקֹ֛ב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/010.yaml
  text: But as for you[a], do not fear, my servant Jacob, declares Yahweh, and do not be dismayed, Israel; for behold, I am saving you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: fr
  text: 'Mais toi, n’aie pas peur, Jacob, mon serviteur — déclare Yahweh —, et ne te laisse pas abattre, Israël ! Car me voici : je vais te sauver[a] de loin, et tes descendants du pays où ils sont captifs[b]. Jacob reviendra ; il vivra dans le calme et en sécurité, sans personne pour le faire trembler.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je te sauve ». Avec « me voici », la forme participiale hébraïque peut présenter l’action comme en cours, imminente ou certaine.
    reason: ambiguïté aspectuelle
  - marker: b
    text: Littéralement « du pays de leur captivité » ; on peut aussi comprendre « du pays de leur exil ».
    reason: variante lexicale
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: Le pronom indépendant, précédé de la conjonction, marque ici une transition emphatique et contrastive. « Mais toi » est naturel en français et conserve cette mise en relief.
- source_word: אַל תִּירָא
  choice: n’aie pas peur
  rationale: Cette formulation actuelle et directe rend l’interdiction exprimée avec ירא.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte prophétique, le terme est une désignation honorifique et relationnelle de Jacob, sans accent particulier sur l’asservissement.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule conserve le caractère solennel de la formule prophétique nominale et rend directement le nom divin.
- source_word: וְאַל תֵּחַת
  choice: ne sois pas terrifié
  rationale: Le niphal de חתת évoque le fait d’être abattu ou saisi de terreur. Ce choix le distingue du précédent « n’aie pas peur ».
- source_word: הִנְנִי מוֹשִׁיעֲךָ
  choice: 'me voici : je vais te sauver'
  rationale: הִנְנִי apporte présence et insistance, tandis que le participe peut présenter une action imminente ou certaine. Le futur proche est idiomatique en français.
- source_word: מֵרָחוֹק
  choice: d’un lieu lointain
  rationale: La formulation explicite la valeur spatiale de l’expression sans suggérer à tort que Yahweh sauverait à distance.
- source_word: זַרְעֲךָ
  choice: tes descendants
  rationale: זרע est un collectif. « Tes descendants » en exprime clairement le sens humain dans un français courant.
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: du pays où ils sont captifs
  rationale: Cette tournure naturelle conserve à la fois l’idée du pays et celle de la captivité, tout en reflétant le suffixe pluriel.
- source_word: וְשָׁב
  choice: reviendra
  rationale: שוב désigne ici le retour de Jacob dans le cadre de sa restauration.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: il connaîtra le calme et la tranquillité
  rationale: Les deux verbes décrivent une existence paisible, sans trouble et en sécurité. Cette paire française en maintient le parallélisme sans produire le peu naturel « être silencieux ».
- source_word: וְאֵין מַחֲרִיד
  choice: sans personne pour le faire trembler
  rationale: La construction nie l’existence de quiconque pourrait provoquer la terreur. La formulation garde la valeur causative du participe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Emploi parallèle de Jacob et d’Israël
  choice: Conserver les deux noms
  alternative: Uniformiser avec « Israël »
  rationale: Le texte hébreu emploie intentionnellement les deux noms dans une adresse parallèle. Les maintenir préserve sa texture littéraire et son langage d’alliance.
- issue: Aspect de הִנְנִי מוֹשִׁיעֲךָ
  choice: je vais te sauver
  alternative: je te sauve
  rationale: Le participe précédé de הִנְנִי peut exprimer une action en cours, imminente ou tenue pour certaine. Le futur proche garde l’imminence sans exclure la certitude de la promesse.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique est conservé par l’adresse directe, l’incise « déclaration de Yahweh » et les propositions brèves. Les termes abstraits ou archaïques ont été évités lorsque leur emploi aurait obscurci le sens.
