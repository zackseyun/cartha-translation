    issue: Rendu de מֵרָחוֹק
    rationale: « D’un lieu lointain » explicite par un substantif qui ne figure pas dans l’hébreu. « De loin » conserve l’ambiguïté spatiale concise du texte source.
  - severity: low
    issue: Formule prophétique et second impératif
    rationale: « Déclare Yahweh » est plus fluide en français courant dans cette position, et « ne te laisse pas abattre » rend la nuance de חתת en la distinguant de ירא.
  - severity: low
    issue: Rendu de וְשָׁקַט וְשַׁאֲנַן
    rationale: La paire évoque la quiétude et une sécurité sans trouble. « Dans le calme et en sécurité » préserve mieux les deux composantes que deux quasi-synonymes abstraits.
