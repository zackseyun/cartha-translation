  to: 'Mais toi, n’aie pas peur, Jacob, mon serviteur — déclare Yahweh —, et ne te laisse pas abattre, Israël ! Car me voici : je vais te sauver[a] de loin, et tes descendants du pays où ils sont captifs[b]. Jacob reviendra ; il vivra dans le calme et en sécurité, sans personne pour le faire trembler.'
