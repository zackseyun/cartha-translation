revisions:
- from: Tous tes amants t’ont oubliée[a] ; aucun ne se soucie de toi. Car je t’ai frappée comme frappe un ennemi, je t’ai infligé une correction cruelle[b], à cause de la gravité de ta faute et du grand nombre de tes péchés.
  to: Tous tes amants t’ont oubliée[a] ; ils ne te recherchent pas. Car je t’ai frappée du coup d’un ennemi, d’un châtiment cruel[b], à cause de l’ampleur de ta faute, parce que tes péchés sont nombreux.
  rationale: 'La révision rend plus directement les verbes et la structure parallèle de l’hébreu, tout en conservant un français international moderne. Elle maintient l’ambiguïté contrôlée du « coup d’un ennemi » : Dieu demeure le sujet de « j’ai frappée », sans transformer le syntagme en affirmation selon laquelle l’ennemi seul aurait agi.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:32Z'
review_pass:
  verdict: revise
  source_fidelity: La proposition « aucun ne se soucie de toi » atténue le sens lexical de יִדְרֹשׁוּ (« chercher, s’enquérir de »). La construction « je t’ai frappée comme frappe un ennemi, je t’ai infligé… » réorganise et explicite excessivement les deux compléments instrumentaux hébreux. Une formulation plus proche peut conserver Dieu comme sujet de « j’ai frappée » sans attribuer grammaticalement le coup à un autre agent.
  naturalness: Le français est globalement fluide et d’un registre approprié. « Du coup d’un ennemi » et « d’un châtiment cruel » sont concis, compréhensibles et conservent l’énergie parallèle du texte. « Ils ne te recherchent pas » est plus direct et fidèle que « aucun ne se soucie de toi ».
  terminology: « Amants » préserve utilement la métaphore; la note « alliés » donne l’alternative contextuelle. « Châtiment cruel » convient à מוּסַר אַכְזָרִי sans imposer un cadre doctrinal. « L’ampleur de ta faute » rend רֹב עֲוֺנֵךְ, et « tes péchés sont nombreux » rend naturellement la dernière proposition.
  issues:
  - severity: medium
    issue: Rendu de יִדְרֹשׁוּ
    rationale: « Se soucier de » interprète le résultat affectif de l’abandon, mais ne traduit pas directement « chercher / s’enquérir de ». Le verbe « rechercher » conserve le noyau lexical et reste naturel ici.
  - severity: medium
    issue: Restructuration de מַכַּת אוֹיֵב … מוּסַר אַכְזָרִי
    rationale: La répétition « je t’ai infligé » et la comparaison développée « comme frappe un ennemi » vont au-delà de la syntaxe nominale parallèle du texte. Les compléments « du coup d’un ennemi, d’un châtiment cruel » préservent plus directement la formulation source et l’agent divin explicite.
  - severity: low
    issue: Fusion des deux motifs causaux
    rationale: La coordination par « et » est possible, mais elle efface légèrement la seconde proposition verbale « tes péchés sont nombreux ». La restituer maintient le parallélisme et évite de réduire la fin du verset à un simple groupe nominal.
  revised_text: Tous tes amants t’ont oubliée[a] ; ils ne te recherchent pas. Car je t’ai frappée du coup d’un ennemi, d’un châtiment cruel[b], à cause de l’ampleur de ta faute, parce que tes péchés sont nombreux.
  revised_footnotes:
