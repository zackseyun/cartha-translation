  text: כָּל מְאַהֲבַ֣יִ/ךְ שְׁכֵח֔וּ/ךְ אוֹתָ֖/ךְ לֹ֣א יִדְרֹ֑שׁוּ כִּי֩ מַכַּ֨ת אוֹיֵ֤ב הִכִּיתִי/ךְ֙ מוּסַ֣ר אַכְזָרִ֔י עַ֚ל רֹ֣ב עֲוֺנֵ֔/ךְ עָצְמ֖וּ חַטֹּאתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/014.yaml
  text: All your lovers have forgotten you[a]; they do not seek you. For I have struck you with the wound of an enemy, with cruel discipline, because of the greatness of your iniquity[b]; your sins are numerous.
translation:
  language: fr
  text: Tous tes amants t’ont oubliée[a] ; ils ne te recherchent pas. Car je t’ai frappée du coup d’un ennemi, d’un châtiment cruel[b], à cause de l’ampleur de ta faute, parce que tes péchés sont nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alliés ». L’hébreu dit littéralement « amants », image récurrente chez Jérémie pour parler notamment des attachements politiques et spirituels infidèles.
    reason: lexical_alternative
  - marker: b
    text: Ou « une correction impitoyable » ou « une sévère discipline ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַהֲבַיִךְ
  choice: tes amants
  rationale: Le terme désigne littéralement des amants. Dans Jérémie, il évoque aussi les puissances étrangères recherchées comme alliées et conserve ainsi la métaphore relationnelle et politique.
- source_word: שְׁכֵחוּךְ
  choice: t’ont oubliée
  rationale: Le verbe signifie « oublier ». Le passé composé exprime naturellement en français un acte passé dont le résultat demeure.
- source_word: אוֹתָךְ לֹא יִדְרֹשׁוּ
  choice: aucun ne se soucie de toi
  rationale: דרש signifie chercher ou s’enquérir de quelqu’un. Dans ce contexte d’abandon, « se soucier de » rend naturellement l’idée qu’aucun ancien amant ne vient prendre de ses nouvelles, sans aller jusqu’à paraphraser par « abandonner ».
- source_word: מַכַּת אוֹיֵב הִכִּיתִיךְ
  choice: je t’ai frappée comme frappe un ennemi
  rationale: La tournure française conserve le lien entre מַכָּה, « coup/blessure », et נכה, « frapper », tout en rendant clairement la comparaison ou caractérisation implicite du coup comme celui d’un ennemi.
- source_word: מוּסַר אַכְזָרִי
  choice: une correction cruelle
  rationale: מוּסָר désigne une correction, discipline ou réprimande, tandis que אַכְזָרִי exprime la cruauté ou l’absence de pitié. « Correction cruelle » reste direct, grave et non technique.
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: à cause de la gravité de ta faute
  rationale: רֹב peut marquer la grandeur ou l’abondance, et עָוֹן la faute, la perversité ou la culpabilité. « Gravité de ta faute » exprime ici le poids moral qui motive le jugement.
- source_word: עָצְמוּ חַטֹּאתָיִךְ
  choice: du grand nombre de tes péchés
  rationale: עצם peut signifier devenir fort ou être nombreux. En parallèle avec רֹב et avec « péchés » comme sujet, le sens quantitatif est naturel. La coordination française avec la proposition causale précédente évite de suggérer un processus temporel non explicite.
theological_decisions:
- issue: Cause et agent du jugement
  choice: Dieu déclare avoir lui-même frappé Juda/Sion à cause de sa faute et de ses nombreux péchés.
  alternative: Atténuer l’action divine en ne parlant que des coups d’un ennemi ou de conséquences impersonnelles.
  rationale: Le texte hébreu dit explicitement « je t’ai frappée » et donne la faute et les péchés comme raison. La traduction maintient cette tension théologique sans l’adoucir ni l’amplifier.
- issue: Valeur de מַכַּת אוֹיֵב
  choice: comme frappe un ennemi
  alternative: d’une blessure d’ennemi / du coup d’un ennemi
  rationale: Le syntagme peut décrire un coup ou une blessure propre à un ennemi. La formulation retenue conserve l’image ennemie sans laisser croire qu’un autre agent que le « je » divin est grammaticalement responsable.
translation_notes:
  register: Français international moderne, digne et accessible. Les accords féminins (« oubliée », « frappée ») reflètent l’adresse à Sion/Juda personnifiée. La ponctuation et la coordination finale privilégient une lecture fluide tout en préservant les deux motifs parallèles du jugement.
