    text: Ou « alliés ». L’hébreu dit littéralement « amants », image récurrente chez Jérémie pour parler notamment des attachements politiques et spirituels infidèles.
    reason: lexical_alternative
  - marker: b
    text: Ou « une correction impitoyable » ou « une sévère discipline ».
    reason: lexical_alternative
  revision_rationale: 'La révision rend plus directement les verbes et la structure parallèle de l’hébreu, tout en conservant un français international moderne. Elle maintient l’ambiguïté contrôlée du « coup d’un ennemi » : Dieu demeure le sujet de « j’ai frappée », sans transformer le syntagme en affirmation selon laquelle l’ennemi seul aurait agi.'
