source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], saying,
translation:
  language: fr
  text: 'La parole qui fut adressée à Jérémie de la part de Yahweh[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », nom divin traditionnellement rendu par « le SEIGNEUR » dans de nombreuses traductions françaises.'
    reason: Signaler la forme hébraïque et le rendu traditionnel alternatif du tétragramme.
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message divin. « La parole » conserve la formulation biblique usuelle sans réduire le terme à une simple information.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: qui fut adressée à
  rationale: Littéralement, la parole « fut à » Jérémie. En français, « fut adressée à » exprime naturellement la réception prophétique tout en restant proche de la construction hébraïque.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: מֵאֵת
  choice: de la part de
  rationale: La préposition composée marque l’origine de la parole. « De la part de » indique clairement que Yahweh en est la source et s’accorde naturellement avec « adressée ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du tétragramme, qui préserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit les paroles directes qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction et évitent le calque pesant « en disant » en fin de verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre YHWH. « Yahweh » le représente directement, tandis que « le SEIGNEUR » relève de la tradition de substitution par un titre; la note signale cette tradition.
translation_notes:
  register: Français moderne, digne et fluide. La formule « la parole qui fut adressée » garde le caractère solennel de l’introduction prophétique. Les deux-points rendent idiomatiquement לֵאמֹר et assurent le lien avec le discours du verset suivant.
