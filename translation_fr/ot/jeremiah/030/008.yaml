source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אֶשְׁבֹּ֤ר עֻלּ/וֹ֙ מֵ/עַ֣ל צַוָּארֶ֔/ךָ וּ/מוֹסְרוֹתֶ֖י/ךָ אֲנַתֵּ֑ק וְ/לֹא יַעַבְדוּ ב֥/וֹ ע֖וֹד זָרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/008.yaml
  text: And it shall happen in that day[a], declares Yahweh of Armies, that I will break his yoke from off your neck, and I will tear off your bonds[b], and foreigners shall no longer make him their servant.
translation:
  language: fr
  text: « Ce jour-là, déclare Yahvé[a] des armées, je briserai son joug qui est sur ton cou et je romprai tes liens. Les étrangers ne l’asserviront plus[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « le SEIGNEUR des armées ».'
    reason: lexical_alternative
  - marker: b
    text: La proposition hébraïque est condensée et son analyse est discutée. Dans le contexte du joug et des liens, le verbe exprime vraisemblablement l’imposition d’un travail ou d’une servitude.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: La formule prophétique annonce un événement futur. En français actuel, « Ce jour-là » exprime naturellement cette valeur sans recourir à la tournure lourde « il arrivera en ce jour-là ».
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclare Yahvé des armées
  rationale: נְאֻם est la formule d’affirmation prophétique « déclare ». Le nom divin est rendu par « Yahvé », et צְבָאוֹת par « des armées », formulation transparente qui conserve la portée militaire et céleste du titre.
- source_word: אֶשְׁבֹּר עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: je briserai son joug de dessus ton cou
  rationale: « Briser » convient directement à l’image du joug. « Son joug » conserve le suffixe masculin singulier de עֻלּוֹ, dont le référent reste implicite, tandis que « de dessus ton cou » restitue la force spatiale de מֵעַל.
- source_word: וּמוֹסְרוֹתֶיךָ אֲנַתֵּק
  choice: je romprai tes liens
  rationale: מוֹסְרוֹת désigne des attaches ou liens de servitude, et נתק exprime leur rupture ou leur arrachement. « Rompre tes liens » est clair, vigoureux et naturel en français.
- source_word: וְלֹא יַעַבְדוּ בוֹ עוֹד זָרִים
  choice: Les étrangers ne l’asserviront plus
  rationale: Dans le contexte du joug et des liens, עבד a ici le sens de soumettre au service forcé. Cette formulation rend le sens contextuel tout en conservant le pronom masculin singulier correspondant à בוֹ.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente le nom propre divin plutôt que de le remplacer par un titre; l’usage traditionnel français est signalé en note.
- issue: Sens de עבד dans la proposition finale
  choice: ne l’asserviront plus
  alternative: ne se serviront plus de lui
  rationale: Le contexte immédiat de joug et de liens favorise nettement l’idée d’asservissement. La syntaxe hébraïque demeure toutefois condensée, d’où la mention de la formulation plus littérale en note.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le tutoiement singulier et les pronoms masculins singuliers sont maintenus afin de préserver les changements de personne et l’ambiguïté référentielle du texte hébreu.
