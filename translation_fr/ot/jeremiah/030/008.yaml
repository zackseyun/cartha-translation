  source_fidelity: 'Le sens général est fidèle : Yahvé annonce qu’il brisera le joug imposé à son destinataire, détachera ses liens et mettra fin à la domination étrangère. « Ne l’asserviront plus » rend de façon contextuellement justifiée la dernière proposition difficile, dans l’imagerie cohérente du joug et des liens. Toutefois, la note b qualifie à tort « ne se serviront plus de lui » de formulation plus littérale : cette expression française ne reflète pas clairement la construction hébraïque ni sa valeur de travail/servitude imposé.'
  naturalness: Le français est moderne, clair et d’un registre prophétique approprié. « Son joug de dessus ton cou » est intelligible mais légèrement raide ; « son joug qui est sur ton cou » conserve l’image et se lit plus naturellement.
  terminology: « Yahvé des armées » est une forme française établie et fidèle à יהוה צבאות. « Liens », « joug » et « asservir » conviennent au champ lexical de la servitude. Les ancres de notes sont placées sur les éléments qu’elles éclairent.
