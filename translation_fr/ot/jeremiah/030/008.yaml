  to: « Ce jour-là, déclare Yahvé[a] des armées, je briserai son joug qui est sur ton cou et je romprai tes liens. Les étrangers ne l’asserviront plus[b]. »
  rationale: La révision conserve le sens contextuel de libération de la servitude, tout en supprimant une prétendue formulation littérale qui risquait de fausser la difficulté syntaxique de l’hébreu. Une légère amélioration syntaxique rend aussi l’image du joug plus naturelle en français moderne.
