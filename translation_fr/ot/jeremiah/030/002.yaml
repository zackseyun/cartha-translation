  text: כֹּֽה אָמַ֧ר יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּתָב לְ/ךָ֗ אֵ֧ת כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבַּ֥רְתִּי אֵלֶ֖י/ךָ אֶל סֵֽפֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Write for yourself in a scroll all the words that I have spoken to you.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh, le Dieu d’Israël : « Écris dans un rouleau[a] toutes les paroles que je t’ai dites. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un livre »; le mot hébreu désigne un document écrit, souvent un rouleau dans ce contexte.
    reason: Alternative lexicale pour סֵפֶר et précision historique sur le support d’écriture.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette tournure française naturelle conserve la formule prophétique de messager et sa force déclarative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement par le tétragramme, sans le remplacer par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend clairement le groupe construit et son identification relationnelle.
- source_word: לֵאמֹר
  choice: ': «'
  rationale: En français, les deux-points et les guillemets introduisent naturellement la citation directe sans alourdir la phrase par « en disant ».
- source_word: כְּתָב לְךָ
  choice: Écris
  rationale: L’impératif est rendu directement. Le datif לְךָ n’exige pas ici un « pour toi-même » peu naturel en français et peut marquer l’implication personnelle du destinataire.
- source_word: כָּל הַדְּבָרִים
  choice: toutes les paroles
  rationale: Dans le contexte de paroles divines à mettre par écrit, « paroles » préserve mieux la dimension verbale que « choses ».
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: que je t’ai dites
  rationale: Le passé composé relie naturellement en français les paroles antérieures à l’ordre présent de les consigner; l’accord reprend « paroles ».
- source_word: אֶל־סֵפֶר
  choice: dans un rouleau
  rationale: סֵפֶר désigne un document écrit et, dans ce cadre historique, probablement un rouleau; « dans » rend idiomatiquement la destination de l’écriture.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le conserve explicitement sans substituer un titre ni adopter l’autre vocalisation traditionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique garde une certaine solennité, tandis que la citation reste directe et naturelle. Le pronom singulier « te » correspond à Jérémie.
