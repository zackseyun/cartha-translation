  - severity: low
    issue: « Livides » est une approximation chromatique
    rationale: Le mot peut convenir à la pâleur, mais יֵרָקוֹן évoque plus précisément une pâleur maladive tirant vers le jaune-vert. « Pâlir » est plus neutre dans le texte, tandis que la note conserve la nuance.
