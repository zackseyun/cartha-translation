base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/006.yaml
  text: 'Ask now[a], and see: does a male give birth? Why then do I see every man with his hands on his loins like a woman in labor, and every face turned pale?'
translation:
  language: fr
  text: 'Demandez donc et voyez : un homme accouche-t-il ? Pourquoi vois-je tous les hommes, les mains sur les reins, comme une femme en travail, et tous les visages pâlir[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prendre une teinte verdâtre ». Le terme hébreu évoque une pâleur maladive, tirant sur le vert.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ נָא וּרְאוּ
  choice: Demandez donc et voyez
  rationale: Les deux impératifs pluriels sont conservés. « donc » rend naturellement la particule נָא comme une invitation pressante à examiner la question.
- source_word: אִם יֹלֵד זָכָר
  choice: un homme met-il au monde un enfant ?
  rationale: La question rhétorique souligne l’impossibilité pour un être masculin d’accoucher. « Mettre au monde un enfant » est clair et naturel en français, tandis que « homme » exprime ici le contraste sexué porté par זָכָר.
- source_word: מַדּוּעַ רָאִיתִי
  choice: Pourquoi vois-je
  rationale: Le parfait hébreu est compris comme une perception vive et actuelle. Le présent français convient au tableau immédiat sans ajouter un second « donc », inutile dans la phrase française.
- source_word: כָל גֶּבֶר
  choice: chaque homme
  rationale: גֶּבֶר évoque l’homme, souvent sous l’angle de sa vigueur. « Chaque homme » garde la portée distributive et rend frappant le renversement décrit.
- source_word: יָדָיו עַל חֲלָצָיו
  choice: les mains sur les reins
  rationale: Expression française traditionnelle mais encore intelligible pour la région des lombes et des hanches; elle conserve l’image corporelle de la douleur sans l’affaiblir.
- source_word: כַּיּוֹלֵדָה
  choice: comme une femme en plein travail
  rationale: Le participe féminin désigne explicitement une femme qui accouche. « En plein travail » est une expression moderne et vive pour les douleurs de l’enfantement.
- source_word: וְנֶהֶפְכוּ כָל פָּנִים לְיֵרָקוֹן
  choice: et tous les visages devenir livides
  rationale: La construction infinitive dépend naturellement de « vois-je ». « Livides » communique la pâleur maladive, tandis que la nuance verdâtre du terme rare יֵרָקוֹן est signalée en note.
