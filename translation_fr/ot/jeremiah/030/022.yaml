base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/022.yaml
  text: And you will be my people[a], and I will be your God.
translation:
  language: fr
  text: Vous serez mon peuple[a], et moi, je serai votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Vous serez pour moi un peuple, et moi, je serai pour vous Dieu » ; c’est une formule d’alliance exprimant une appartenance réciproque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: Vous serez
  rationale: Le qatal de היה précédé de la conjonction prend ici une valeur future dans la formule d’alliance. « Vous serez » est naturel en français moderne.
- source_word: לִי לְעָם
  choice: mon peuple
  rationale: La construction hébraïque, littéralement « pour moi comme peuple », exprime idiomatiquement l’appartenance réciproque; « mon peuple » la rend clairement en français.
- source_word: וְאָנֹכִי
  choice: et moi, je
  rationale: Le pronom indépendant אָנֹכִי est emphatique. La dislocation « moi, je » conserve cette mise en relief sans alourdir la phrase.
- source_word: אֶהְיֶה
  choice: je serai
  rationale: L’imparfait de היה a ici une valeur future et répond symétriquement à « vous serez ».
- source_word: לָכֶם לֵאלֹהִים
  choice: votre Dieu
  rationale: Dans cette formule d’alliance, la construction signifie idiomatiquement « votre Dieu ». אֱלֹהִים désigne ici le Dieu d’Israël.
theological_decisions:
- issue: Formule d’alliance
  choice: Vous serez mon peuple, et moi, je serai votre Dieu.
  alternative: Vous serez pour moi un peuple, et je serai pour vous Dieu.
  rationale: La formulation retenue exprime naturellement en français l’appartenance mutuelle portée par la formule hébraïque, tout en conservant son orientation future et l’emphase du pronom אָנֹכִי.
translation_notes:
  register: Français moderne, simple et digne. La tournure « moi, je » préserve l’emphase de l’hébreu; la note signale la construction littérale sans imposer une interprétation confessionnelle.
