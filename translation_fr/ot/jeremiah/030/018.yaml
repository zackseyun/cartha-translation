id: JER.30.18
reference: Jeremiah 30:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי שָׁב֙ שְׁבוּת֙ אָהֳלֵ֣י יַֽעֲק֔וֹב וּ/מִשְׁכְּנֹתָ֖י/ו אֲרַחֵ֑ם וְ/נִבְנְתָ֥ה עִיר֙ עַל תִּלָּ֔/הּ וְ/אַרְמ֖וֹן עַל מִשְׁפָּט֥/וֹ יֵשֵֽׁב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/018.yaml
  text: 'Thus says Yahweh: Behold[a], I am restoring the fortunes of the tents of Jacob, and I will have compassion on his dwellings. The city will be rebuilt on its mound, and the palace will stand in its proper place.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Voici, je rétablis le sort des tentes de Jacob[a], et j’aurai compassion de ses demeures. La ville sera rebâtie sur son tertre, et le palais se dressera à sa place légitime.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ramène les captifs des tentes de Jacob », ou : « je ramène Jacob de captivité ». L’expression hébraïque peut désigner précisément le retour de captivité ou, plus largement, le rétablissement d’une situation favorable.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et préserve sa fonction d’alliance, conformément à l’usage du projet.
- source_word: הִנְנִי
  choice: Voici, je
  rationale: « Voici » conserve la valeur déictique et emphatique de la formule prophétique tout en gardant un registre digne et intelligible.
- source_word: שָׁב שְׁבוּת
  choice: je rétablis le sort
  rationale: Rend naturellement l’idiome hébreu de renversement de situation sans le limiter au seul retour matériel des captifs; l’autre possibilité est signalée en note.
- source_word: אָהֳלֵי יַעֲקֹב
  choice: les tentes de Jacob
  rationale: Conserve l’image concrète et collective de l’hébreu sans l’expliciter abusivement.
- source_word: מִשְׁכְּנֹתָיו
  choice: ses demeures
  rationale: Terme français courant et digne qui maintient l’image des lieux d’habitation.
- source_word: אֲרַחֵם
  choice: j’aurai compassion
  rationale: Exprime clairement la compassion miséricordieuse du verbe רחם sans la nuance dépréciative possible de « prendre en pitié ».
- source_word: וְנִבְנְתָה עִיר
  choice: La ville sera rebâtie
  rationale: Le contexte désigne une ville connue, vraisemblablement Jérusalem; « rebâtie » rend naturellement la restauration après destruction.
- source_word: עַל תִּלָּהּ
  choice: sur son tertre
  rationale: « Tertre » rend תֵּל comme élévation ou amas associé à l’ancien emplacement urbain, sans réduire le terme à une simple colline.
- source_word: אַרְמוֹן
  choice: le palais
  rationale: Rend le sens usuel d’un édifice royal ou prestigieux sans imposer la fonction militaire de « citadelle ».
- source_word: עַל מִשְׁפָּטוֹ יֵשֵׁב
  choice: se dressera à sa place légitime
  rationale: Exprime l’idée idiomatique d’un rétablissement conforme à l’ordre ou à l’emplacement qui convient; « se dressera » convient en français à un édifice.
theological_decisions:
- issue: Portée de la restauration dans שָׁב שְׁבוּת
  choice: Restauration globale de la situation de Jacob, formulée par « rétablir le sort ».
  alternative: Ramener les captifs des tentes de Jacob, ou ramener Jacob de captivité.
  rationale: L’idiome peut viser le retour d’exil ou des captifs, mais il désigne aussi plus largement un renversement favorable de situation. Le contexte associe le retour aux habitations et à la reconstruction de la ville et du palais; la note conserve donc la dimension possible de captivité sans l’imposer comme sens exclusif.
translation_notes:
  register: Français international moderne, naturel et solennel. La syntaxe prophétique est préservée sans archaïsmes inutiles. « Tertre » garde la précision topographique, tandis que « place légitime » rend lisible l’expression idiomatique finale sans effacer son idée d’ordre juste.
