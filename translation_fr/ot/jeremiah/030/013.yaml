    rationale: « aucun traitement pour la cicatriser » ne représente qu’une seule notion et explicite une action de cicatrisation. L’hébreu énonce distinctement l’absence de רפואות et de תְּעָלָה ; la traduction doit conserver cette double absence.
  - severity: low
    issue: La formulation « pour la cicatriser » surdétermine le sens du terme rare.
    rationale: Le sens précis de תְּעָלָה est disputé (remède, pansement, formation de chair nouvelle). « Cicatriser » privilégie une interprétation ; « remède », avec note, préserve mieux l’ambiguïté.
