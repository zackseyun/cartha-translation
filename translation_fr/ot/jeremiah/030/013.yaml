id: JER.30.13
reference: Jeremiah 30:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵֽין דָּ֥ן דִּינֵ֖/ךְ לְ/מָז֑וֹר רְפֻא֥וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/013.yaml
  text: There is no one to plead your case for your wound[a]; there is no healing for you[b], no remedy.
translation:
  language: fr
  text: Personne ne plaide ta cause au sujet de ta blessure[a] ; tu n’as ni guérison ni remède[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Personne ne juge ta cause concernant ta blessure ». L’image juridique hébraïque peut évoquer soit la défense d’une cause, soit son jugement.
    reason: lexical_alternative
  - marker: b
    text: Le dernier terme hébreu est rare. Il peut désigner un remède ; on peut aussi le comprendre comme « bandage » ou « chair nouvelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין דָּן
  choice: Personne ne défend
  rationale: La négation existentielle suivie du participe signifie qu’il ne se trouve personne pour intervenir. Dans ce contexte juridique, « défendre » exprime naturellement l’action de soutenir la cause de quelqu’un, tout en laissant l’autre lecture en note.
- source_word: דִּינֵךְ
  choice: ta cause
  rationale: Le nom désigne une affaire ou une cause en contexte judiciaire. « Ta cause » conserve l’image juridique dans un français naturel et digne.
- source_word: לְמָזוֹר
  choice: au sujet de ta blessure
  rationale: 'מָזוֹר peut désigner une plaie ou une blessure. La préposition est comprise comme introduisant l’objet de la cause juridique : la situation de blessure dont personne ne prend la défense.'
- source_word: רְפֻאוֹת
  choice: traitement
  rationale: Le pluriel hébreu désigne collectivement des soins ou des moyens curatifs. Le singulier collectif « traitement » convient à l’expression française.
- source_word: תְּעָלָה
  choice: pour la cicatriser
  rationale: Ce terme rare évoque probablement la cicatrisation, la chair nouvelle ou ce qui permet à une plaie de se refermer. La formulation verbale rend clairement cette image sans imposer l’idée précise d’un bandage.
- source_word: אֵין לָךְ
  choice: tu n’as aucun
  rationale: Cette tournure française traduit directement l’inexistence de tout moyen curatif à la disposition de la destinataire féminine.
theological_decisions:
- issue: Portée du constat d’absence de guérison
  choice: 'Conserver l’affirmation absolue dans le cadre immédiat : « tu n’as aucun traitement »'
  alternative: Atténuer en disant qu’aucun traitement humain n’est disponible
  rationale: Le texte hébreu ne précise pas « humain ». Ajouter cette restriction résoudrait théologiquement une tension que le verset laisse intacte.
translation_notes:
  register: Français international actuel, sobre et digne. Le tutoiement féminin reflète les suffixes hébreux adressés à Sion/Jacob personnifié. La première proposition conserve l’image judiciaire, tandis que la seconde maintient l’image médicale et son caractère sans appel.
