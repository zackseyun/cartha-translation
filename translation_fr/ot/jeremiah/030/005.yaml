  rationale: La révision conserve la structure et le registre de l’annonce divine, tout en rendant explicitement et naturellement en français les prédications nominales finales. « Tremblement » restitue l’image de חֲרָדָה, tandis que la note préserve les possibilités contextuelles de frayeur ou de terreur et les nuances de קוֹל.
