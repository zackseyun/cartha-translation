  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה ק֥וֹל חֲרָדָ֖ה שָׁמָ֑עְנוּ פַּ֖חַד וְ/אֵ֥ין שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/005.yaml
  text: 'For thus says Yahweh: “We have heard a sound of trembling[a], of fear[b], and there is no peace.”'
translation:
  language: fr
  text: 'Car voici ce que dit Yahvé : « Nous avons entendu un bruit de tremblement : il y a de la peur et il n’y a pas de paix. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’annonce divine avec la valeur explicative du connecteur hébreu, sans préciser davantage le rapport logique.
- source_word: כֹה אָמַר
  choice: voici ce que dit
  rationale: Formulation française naturelle et actuelle de la formule prophétique conventionnelle, tout en conservant son caractère solennel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin représenté par le tétragramme, au lieu de le remplacer par un titre.
- source_word: קוֹל חֲרָדָה
  choice: un bruit d’épouvante
  rationale: קוֹל désigne ce qui est entendu, tandis que חֲרָדָה évoque le tremblement causé par l’effroi. Cette expression française rend l’ensemble sans décider s’il s’agit précisément d’une voix, d’un cri ou d’un autre bruit.
- source_word: שָׁמָעְנוּ
  choice: Nous avons entendu
  rationale: Le passé composé conserve la première personne du pluriel et exprime naturellement en français un fait passé dont la portée reste présente.
- source_word: פַּחַד
  choice: la peur
  rationale: Rend directement le nom hébreu, qui peut aller de la peur à la terreur selon le contexte.
- source_word: וְאֵין שָׁלוֹם
  choice: et aucune paix
  rationale: La tournure nominale brève respecte le parallélisme heurté de l’hébreu et son contraste entre peur et paix, sans ajouter de verbe absent du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahvé » est sa forme française courante et permet de distinguer le nom propre d’un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation nominale « la peur, et aucune paix » conserve le rythme abrupt et oppressant de l’hébreu plutôt que de l’expliciter par des verbes ajoutés.
