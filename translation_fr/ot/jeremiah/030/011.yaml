  text: כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הֽוֹשִׁיעֶ֑/ךָ כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הֲפִצוֹתִ֣י/ךָ שָּׁ֗ם אַ֤ךְ אֹֽתְ/ךָ֙ לֹֽא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/011.yaml
  text: For I am with you—oracle of Yahweh—to save you[a]. For I will make a full end of all the nations where I have scattered you, but of you I will not make a full end. I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: fr
  text: Car moi, je suis avec toi — déclaration de Yahweh — pour te sauver.[a] Oui, je réduirai à néant toutes les nations parmi lesquelles je t’ai dispersé, mais toi, je ne te réduirai pas à néant. Je te corrigerai avec justice, et je ne te laisserai certainement pas impuni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « oracle de Yahweh »; ou encore : « déclare Yahweh ». L’hébreu emploie une formule prophétique consacrée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je ne t’acquitterai absolument pas ». L’hébreu renforce la négation par la répétition de la racine verbale signifiant « tenir pour innocent, acquitter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et préserve sa valeur d’alliance, conformément à l’orientation du projet.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique de façon formelle et intelligible en français actuel; « oracle de Yahweh » reste possible.
- source_word: לְהוֹשִׁיעֶךָ
  choice: pour te sauver
  rationale: Le hiphil de ישׁע exprime le fait de sauver ou délivrer; « sauver » conserve ici l’étendue du sens.
- source_word: כָלָה
  choice: réduire à néant
  rationale: Exprime l’idée d’une fin complète ou d’une destruction totale et permet de reproduire naturellement la répétition hébraïque.
- source_word: הֲפִצוֹתִיךָ
  choice: je t’ai dispersé
  rationale: Rend le hiphil de פוץ dans son contexte d’exil parmi les nations.
- source_word: אַךְ
  choice: mais
  rationale: Marque clairement le contraste entre le sort des nations et celui du peuple auquel Yahweh s’adresse.
- source_word: וְיִסַּרְתִּיךָ
  choice: je te corrigerai
  rationale: יסר désigne ici une discipline corrective; « corriger » est naturel et garde cette visée sans atténuer la sévérité.
- source_word: לַמִּשְׁפָּט
  choice: avec justice
  rationale: Indique que la correction s’exerce selon une juste mesure plutôt que de façon arbitraire.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: je ne te laisserai certainement pas impuni
  rationale: L’infinitif absolu associé au verbe renforce la négation. Cette formulation française restitue l’insistance et s’accorde avec le contexte immédiat de correction.
theological_decisions:
- issue: La dernière proposition doit-elle être formulée en termes judiciaires (« acquitter ») ou disciplinaires (« laisser impuni »)?
  choice: je ne te laisserai certainement pas impuni
  alternative: je ne t’acquitterai absolument pas
  rationale: 'Le contexte rapproche explicitement le salut, la non-destruction et une correction juste. La formulation retenue maintient cette tension: le peuple sera préservé, mais non soustrait au jugement mérité.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque au peuple personnifié. La répétition de כָלָה est conservée par « réduire à néant », tandis que la formule finale garde son emphase sans archaïsme.
