base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/016.yaml
  text: Therefore all who devour you will be devoured[a], and all your adversaries, every one of them, will go into captivity; those who plunder you will become plunder, and all who prey on you I will give up to prey.
translation:
  language: fr
  text: C’est pourquoi tous ceux qui te dévorent seront dévorés, et tous tes adversaires, sans exception, iront en captivité. Ceux qui te dépouillent deviendront eux-mêmes du butin, et tous ceux qui te pillent, je les livrerai au pillage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend naturellement la valeur consécutive ou inférentielle de la transition hébraïque.
- source_word: אֹכְלַיִךְ / יֵאָכֵלוּ
  choice: tous ceux qui te dévorent seront dévorés
  rationale: Conserve la métaphore vive et la reprise exacte du même verbe dans le renversement annoncé.
- source_word: צָרַיִךְ
  choice: tes adversaires
  rationale: Terme actuel et digne qui exprime l’hostilité sans restreindre indûment le référent.
- source_word: כֻּלָּם
  choice: sans exception
  rationale: Exprime avec fluidité l’insistance de « tous, eux tous » sans répétition pesante en français.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: partiront en captivité
  rationale: Préserve l’idée précise de captivité et le mouvement exprimé par le verbe hébreu.
- source_word: שֹׁאסַיִךְ / לִמְשִׁסָּה
  choice: ceux qui te dépouillent seront dépouillés
  rationale: Reproduit le renversement lexical de la proposition hébraïque dans un français clair; le passif verbal rend idiomatiquement le fait de devenir objet de spoliation.
- source_word: בֹּזְזַיִךְ / אֶתֵּן לָבַז
  choice: tous ceux qui te pillent, je les livrerai au pillage
  rationale: Maintient le lien lexical entre le verbe בזז et le nom בז, ainsi que l’action personnelle de Dieu exprimée par « je donnerai/livrerai ».
theological_decisions:
- issue: Images guerrières et renversement judiciaire
  choice: Conserver les images de dévoration, de captivité, de dépouillement et de pillage.
  alternative: Les remplacer par une formulation générale annonçant seulement le châtiment des ennemis.
  rationale: Le sens et la force théologique du verset résident dans le renversement terme pour terme du sort infligé au peuple; atténuer ces images appauvrirait le texte.
- issue: Agent explicite dans la dernière proposition
  choice: Maintenir « je les livrerai », avec Dieu comme sujet parlant.
  alternative: Employer un simple passif, par exemple « ils seront livrés au pillage ».
  rationale: La première personne אֶתֵּן présente explicitement Dieu comme l’auteur du jugement; elle ne doit pas être effacée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en quatre mouvements et les répétitions intentionnelles du texte hébreu sont conservées sans archaïsmes.
