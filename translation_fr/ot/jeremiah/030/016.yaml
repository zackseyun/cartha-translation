revisions:
- from: C’est pourquoi tous ceux qui te dévorent seront dévorés, et tous tes adversaires, sans exception, partiront en captivité. Ceux qui te dépouillent seront dépouillés, et tous ceux qui te pillent, je les livrerai au pillage.
  to: C’est pourquoi tous ceux qui te dévorent seront dévorés, et tous tes adversaires, sans exception, iront en captivité. Ceux qui te dépouillent deviendront eux-mêmes du butin, et tous ceux qui te pillent, je les livrerai au pillage.
  rationale: 'La révision corrige la troisième proposition afin de rendre explicitement le sens de « devenir du butin », tout en conservant le parallélisme judiciaire et le lexique de la spoliation. Elle remplace aussi « partiront » par « iront » pour une formulation plus directe de la captivité. Aucune note n’est nécessaire : le français retenu exprime suffisamment la construction et l’imagerie hébraïques.'
  reviewer_model: gpt-5.6-terra
