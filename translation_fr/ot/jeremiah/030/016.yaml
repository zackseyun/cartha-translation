review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la structure de renversement, la captivité et l’agent divin explicite de la dernière proposition. Toutefois, « seront dépouillés » transforme לִמְשִׁסָּה (« en butin / comme butin ») en simple passif verbal et atténue la formulation précise selon laquelle les spoliateurs deviennent eux-mêmes du butin. « Iront en captivité » est également plus direct et moins susceptible de suggérer un départ volontaire que « partiront en captivité ».
  naturalness: Le français est moderne, clair et d’un registre prophétique approprié. La révision proposée conserve une syntaxe naturelle et rend plus exactement les deux expressions nominales de butin/pillage sans lourdeur excessive.
  terminology: « Dévorent », « adversaires », « captivité », « pillent », « butin » et « livrerai au pillage » sont adaptés. « Butin » traduit naturellement מְשִׁסָּה, tandis que « au pillage » rend l’expression לָבַז et son idée d’être livré comme proie au pillage.
  issues:
  - severity: medium
    issue: « Ceux qui te dépouillent seront dépouillés » pour וְהָיוּ שֹׁאסַיִךְ לִמְשִׁסָּה
    rationale: L’hébreu dit littéralement qu’ils « seront/deviendront pour butin », non seulement qu’ils subiront eux-mêmes un dépouillement. « Devenir eux-mêmes du butin » préserve l’image de rétribution et la construction nominale.
  - severity: low
    issue: « partiront en captivité » pour בַּשְּׁבִי יֵלֵכוּ
    rationale: La formulation est possible, mais « iront en captivité » est plus proche du simple verbe de mouvement hébreu et plus idiomatique dans ce contexte de déportation forcée.
  revised_text: C’est pourquoi tous ceux qui te dévorent seront dévorés, et tous tes adversaires, sans exception, iront en captivité. Ceux qui te dépouillent deviendront eux-mêmes du butin, et tous ceux qui te pillent, je les livrerai au pillage.
  revised_footnotes: []
  revision_rationale: 'La révision corrige la troisième proposition afin de rendre explicitement le sens de « devenir du butin », tout en conservant le parallélisme judiciaire et le lexique de la spoliation. Elle remplace aussi « partiront » par « iront » pour une formulation plus directe de la captivité. Aucune note n’est nécessaire : le français retenu exprime suffisamment la construction et l’imagerie hébraïques.'
