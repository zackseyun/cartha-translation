source:
  edition: WLC
  text: וְ/עָ֣בְד֔וּ אֵ֖ת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/אֵת֙ דָּוִ֣ד מַלְכָּ֔/ם אֲשֶׁ֥ר אָקִ֖ים לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/009.yaml
  text: They will serve Yahweh their God and David their king[a], whom I will raise up for them.
translation:
  language: fr
  text: Ils serviront Yahweh, leur Dieu, et David, leur roi[a], que je susciterai pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un futur roi de la lignée de David » ; beaucoup comprennent ici « David » comme une référence prophétique au Messie plutôt qu’à David lui-même.
    reason: Signaler une interprétation possible tout en conservant dans le texte principal le nom employé par l’hébreu.
lexical_decisions:
- source_word: וְעָבְדוּ
  choice: Ils serviront
  rationale: Le verbe עבד signifie couramment « servir » et peut inclure, dans un contexte d’alliance, le service cultuel. « Servir » conserve cette amplitude sans réduire le sens à l’adoration.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: 'La forme avec suffixe pronominal exprime directement la relation d’appartenance : « leur Dieu ».'
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: et David, leur roi
  rationale: La conjonction relie un second complément au verbe « servir ». Le nom David est conservé tel quel, et מֶלֶךְ est rendu par « roi », qui préserve la portée royale de la promesse.
- source_word: אֲשֶׁר אָקִים
  choice: que je susciterai
  rationale: Le hifil de קום peut signifier « faire surgir », « établir » ou « susciter ». « Susciter » rend naturellement l’action de Dieu qui fait venir ou établit un dirigeant, sans suggérer nécessairement une résurrection.
- source_word: לָהֶם
  choice: pour eux
  rationale: La préposition avec suffixe indique que ce roi est suscité en faveur du peuple.
theological_decisions:
- issue: Identité de « David, leur roi »
  choice: Conserver le nom littéral « David » dans le texte principal.
  alternative: Comprendre « David » comme un futur roi davidique, voire comme une référence messianique.
  rationale: L’hébreu nomme explicitement David. La traduction préserve cette formulation et laisse la note signaler l’interprétation prophétique possible, sans la substituer au texte.
translation_notes:
  register: Français international actuel, clair et digne. « Susciter » maintient l’idiome biblique dans une formulation naturelle. La ponctuation présente « leur roi » comme une apposition à « David ».
