  text: וַ/יֹּ֨אמֶר֙ הַ/מֶּ֣לֶךְ צִדְקִיָּ֔הוּ הִנֵּה ה֖וּא בְּ/יֶדְ/כֶ֑ם כִּֽי אֵ֣ין הַ/מֶּ֔לֶךְ יוּכַ֥ל אֶתְ/כֶ֖ם דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/005.yaml
  text: Then King Zedekiah said[a], “Look, he is in your hands, for the king can do nothing against you.”
translation:
  language: fr
  text: 'Alors le roi Sédécias dit : « Le voici entre vos mains, car le roi ne peut rien faire contre vous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le roi n’est pas capable [de faire] quoi que ce soit à votre égard ». Dans ce contexte, le sens est qu’il ne peut pas s’opposer à eux ni passer outre à leur volonté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » en restitue naturellement la succession narrative.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: le roi Sédécias
  rationale: Cette construction titre-nom se rend naturellement ainsi en français moderne.
- source_word: הִנֵּה הוּא
  choice: Le voici
  rationale: « Le voici » réunit naturellement la particule déictique et le pronom, attire l’attention sur Jérémie et convient au contexte où il est livré à leur pouvoir.
- source_word: בְּיֶדְכֶם
  choice: entre vos mains
  rationale: Cette expression française conserve l’image hébraïque de la main comme symbole de pouvoir ou de contrôle.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison donnée par le roi pour sa concession.
- source_word: אֵין הַמֶּלֶךְ יוּכַל
  choice: le roi ne peut rien faire
  rationale: La formulation exprime l’incapacité et conserve l’auto-référence du roi à la troisième personne.
- source_word: אֶתְכֶם דָּבָר
  choice: contre vous
  rationale: La construction hébraïque est elliptique. Dans le contexte, elle indique que le roi ne peut s’opposer à ces hommes ni passer outre à leur volonté.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Le voici » évite l’archaïsme de « voici » employé isolément tout en gardant la force déictique ; la troisième personne « le roi » est maintenue plutôt que remplacée par « je ».
