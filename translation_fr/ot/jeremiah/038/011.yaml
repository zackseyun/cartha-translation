base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/011.yaml
  text: So Ebed-melech took the men with him and went into the king’s house[a], to a place below the storeroom, and from there took worn-out rags and worn-out garments[c][b], and sent them down by ropes to Jeremiah in the cistern.
translation:
  language: fr
  text: Ébed-Mélek prit donc les hommes avec lui, entra dans la maison du roi et se rendit dans l’endroit situé sous la réserve[a]. Il y prit des chiffons usés et des vêtements usés[b], puis les fit descendre avec des cordes jusqu’à Jérémie, dans la citerne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous le trésor ». Le mot hébreu peut désigner un trésor, un entrepôt ou une réserve ; le contexte favorise ici un lieu de stockage.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « vêtements » est rare et son sens exact est incertain. Le contexte évoque de vieux articles textiles destinés à protéger Jérémie des cordes.
    reason: lexical_alternative
  - marker: c
    text: Ou « fosse ». Le mot hébreu peut désigner une fosse ou une citerne ; « citerne » convient ici au cadre du récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: Ébed-Mélek
  rationale: Translittération française du nom propre, avec accents pour guider la prononciation.
- source_word: הָאֲנָשִׁים בְּיָדוֹ
  choice: les hommes avec lui
  rationale: L’expression idiomatique indique ici que les hommes l’accompagnent ou agissent sous sa direction.
- source_word: בֵית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: Rendu proche de l’hébreu et intelligible; « palais » serait également possible.
- source_word: אֶל תַּחַת הָאוֹצָר
  choice: jusqu’à l’endroit situé sous la réserve
  rationale: תַּחַת désigne une zone inférieure, et אוֹצָר peut être une réserve, un entrepôt ou un trésor; le contexte matériel favorise « réserve ».
- source_word: בְּלוֹיֵ הַסְּחָבוֹת
  choice: des chiffons usés
  rationale: Le premier terme marque l’usure et le second désigne des haillons ou chiffons.
- source_word: וּבְלוֹיֵ מְלָחִים
  choice: de vieux morceaux d’étoffe
  rationale: מְלָחִים est rare et de sens incertain; le contexte suggère des articles textiles destinés à protéger Jérémie du frottement des cordes.
- source_word: וַיְשַׁלְּחֵם
  choice: les fit descendre
  rationale: Le verbe signifie littéralement « envoya »; le mouvement vers Jérémie au fond de la citerne implique ici une descente.
- source_word: אֶל יִרְמְיָהוּ אֶל הַבּוֹר
  choice: jusqu’à Jérémie, dans la citerne
  rationale: La répétition de אֶל est rendue naturellement en français; בּוֹר peut désigner une fosse ou une citerne, cette dernière convenant au cadre narratif.
- source_word: בַּחֲבָלִים
  choice: avec des cordes
  rationale: Le beth instrumental indique le moyen employé.
