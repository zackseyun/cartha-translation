source:
  edition: WLC
  text: וַ/יִּמְשְׁכ֤וּ אֶֽת יִרְמְיָ֨הוּ֙ בַּֽ/חֲבָלִ֔ים וַ/יַּעֲל֥וּ אֹת֖/וֹ מִן הַ/בּ֑וֹר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/013.yaml
  text: So they pulled Jeremiah up with the ropes and brought him up out of the cistern[b][a], and Jeremiah remained in the court of the guard.
translation:
  language: fr
  text: Ils tirèrent donc Jérémie avec les cordes et le firent remonter de la citerne[a]. Jérémie resta dans la cour de la garde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la fosse ». Le mot hébreu peut désigner une fosse, une citerne ou un cachot; ici, « citerne » correspond au contexte du récit.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la cour de la prison ». L’expression hébraïque désigne l’espace gardé où Jérémie était détenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁכוּ
  choice: ils tirèrent
  rationale: Le verbe משׁך décrit l’action de tirer. « Tirèrent » est naturel et rend directement l’extraction de Jérémie au moyen de cordes.
- source_word: בַּחֲבָלִים
  choice: avec les cordes
  rationale: חֲבָלִים désigne des cordes ou cordages, et la préposition בְּ a ici une valeur instrumentale.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: le firent remonter
  rationale: Le hiphil de עלה exprime l’idée de faire monter. « Le firent remonter » conserve cette valeur causative et convient à la sortie de la citerne.
- source_word: מִן הַבּוֹר
  choice: de la citerne
  rationale: בּוֹר peut désigner une fosse, une citerne ou un cachot. Dans ce récit, la cavité est une citerne, même si le terme hébreu reste plus large.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: ישׁב peut signifier s’asseoir, demeurer ou rester. Ici, le récit indique le lieu où Jérémie continua d’être détenu; « resta » est donc clair sans suggérer simplement une posture.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: dans la cour de la garde
  rationale: חָצֵר désigne une cour, et מַטָּרָה renvoie ici à l’espace gardé où Jérémie était détenu. La formulation évite de préciser indûment qu’il s’agissait d’un bâtiment carcéral.
