  to: 'Jérémie répondit : « Ils ne te livreront pas. Écoute, je t’en prie, la voix de Yahweh en suivant ce que je te dis ; alors tout ira bien pour toi et tu auras la vie sauve. »'
  rationale: 'La révision améliore l’idiomaticité française et rend plus explicitement le rapport contextuel entre l’écoute de Yahweh et l’instruction que Jérémie transmet. Elle conserve le nom divin, l’appel pressant, l’assurance de ne pas être livré et le sens concret de survie. Aucune note n’est nécessaire : les choix retenus sont transparents dans le texte et aucun ancrage de note n’est présent dans le projet.'
