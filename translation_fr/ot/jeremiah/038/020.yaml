source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ לֹ֣א יִתֵּ֑נוּ שְֽׁמַֽע נָ֣א בְּ/ק֣וֹל יְהוָ֗ה לַ/אֲשֶׁ֤ר אֲנִי֙ דֹּבֵ֣ר אֵלֶ֔י/ךָ וְ/יִ֥יטַב לְ/ךָ֖ וּ/תְחִ֥י נַפְשֶֽׁ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/020.yaml
  text: Jeremiah said[a], “They will not hand you over. Please listen to the voice of Yahweh in what I am speaking to you, so that it may go well with you and your life may be spared.”
translation:
  language: fr
  text: 'Jérémie répondit : « Ils ne te livreront pas. Écoute, je t’en prie, la voix de Yahweh en suivant ce que je te dis ; alors tout ira bien pour toi et tu auras la vie sauve. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יִתֵּנוּ
  choice: Ils ne te livreront pas
  rationale: Le verbe à la 3e personne du pluriel a un complément sous-entendu fourni par le contexte. « Livrer » exprime naturellement en français la remise du roi au pouvoir de ses ennemis.
- source_word: שְׁמַע נָא
  choice: Je t’en prie, écoute
  rationale: L’impératif שְׁמַע et la particule נָא forment une supplication pressante; cette formulation en restitue à la fois l’appel et l’insistance polie.
- source_word: בְּקוֹל יְהוָה
  choice: écoute la voix de Yahweh
  rationale: La tournure conserve l’image hébraïque de l’écoute tout en impliquant que cette parole doit être suivie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לַאֲשֶׁר אֲנִי דֹּבֵר אֵלֶיךָ
  choice: dans ce que je te dis
  rationale: Cette traduction garde le lien étroit entre la voix de Yahweh et les paroles que Jérémie adresse au roi, sans rendre la phrase inutilement lourde.
- source_word: וְיִיטַב לְךָ
  choice: afin que tout aille bien pour toi
  rationale: La formule française rend naturellement l’expression hébraïque indiquant une issue favorable et fait ressortir la portée résultative de l’exhortation.
- source_word: וּתְחִי נַפְשֶׁךָ
  choice: et que tu restes en vie
  rationale: Dans ce contexte de menace mortelle, נֶפֶשׁ désigne la vie de la personne. La formulation française est naturelle et conserve l’idée explicite de vivre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
- issue: Sens de נֶפֶשׁ dans un contexte de danger de mort
  choice: que tu restes en vie
  alternative: que ton âme vive
  rationale: Le contexte concerne la survie physique de Sédécias. « Âme » risquerait d’introduire ici une précision anthropologique absente du propos.
- issue: Rapport logique des deux dernières propositions
  choice: afin que… et que…
  alternative: et tout ira bien… et ta vie vivra
  rationale: Les formes verbales peuvent suivre l’impératif avec une valeur de conséquence ou de résultat. La construction choisie exprime ce rapport sans transformer la promesse en affirmation détachée de l’appel à écouter.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au roi en hébreu. L’image « écouter la voix » est maintenue, tandis que la dernière expression est rendue idiomatiquement pour éviter le calque peu naturel « ta vie vivra ».
