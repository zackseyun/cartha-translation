revisions:
- from: 'Jérémie dit à Sédécias : « Si je te le révèle, ne me feras-tu pas mourir à coup sûr[a] ? Et si je te conseille, tu ne m’écouteras pas[b]. »'
  to: 'Jérémie dit à Sédécias : « Si je te le dis, ne me tueras-tu pas certainement[a] ? Et si je te conseille, tu ne m’écouteras pas[b]. »'
  rationale: La révision emploie « dire », terme plus large et fidèle au verbe hébreu, et « tuer », équivalent français direct de « mettre à mort ». Elle maintient la question rhétorique négative, l’emphase de la construction infinitif absolu + verbe fini, le parallélisme des deux conditions et l’ambiguïté contextuelle d’« écouter ».
