  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל צִדְקִיָּ֔הוּ כִּ֚י אַגִּ֣יד לְ/ךָ֔ הֲ/ל֖וֹא הָמֵ֣ת תְּמִיתֵ֑/נִי וְ/כִי֙ אִיעָ֣צְ/ךָ֔ לֹ֥א תִשְׁמַ֖ע אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/015.yaml
  text: Jeremiah said to Zedekiah[a], “If I tell you, will you not surely put me to death? And if I advise you[b], you will not listen to me.”
translation:
  language: fr
  text: 'Jérémie dit à Sédécias : « Si je te le dis, ne me tueras-tu pas certainement[a] ? Et si je te conseille, tu ne m’écouteras pas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu associe un infinitif absolu au verbe conjugué pour renforcer l’expression : « ne me tueras-tu pas à coup sûr ? »'
    reason: lexical_alternative
  - marker: b
    text: Ici, « écouter » peut aussi signifier « tenir compte de mes paroles » ou « m’obéir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אַגִּיד לְךָ
  choice: Si je te le révèle
  rationale: Dans ce contexte, כִּי introduit la condition, tandis que נגד au hiphil signifie faire connaître ou révéler. Le pronom « le » reprend naturellement en français l’information demandée par le roi.
- source_word: הֲלוֹא
  choice: ne… pas ?
  rationale: La tournure interrogative négative conserve la question rhétorique qui attend une réponse affirmative.
- source_word: הָמֵת תְּמִיתֵנִי
  choice: me feras-tu pas mourir à coup sûr
  rationale: « Faire mourir » rend la valeur causative de la forme verbale, et « à coup sûr » restitue l’intensité produite par l’infinitif absolu associé au verbe conjugué.
- source_word: וְכִי אִיעָצְךָ
  choice: Et si je te conseille
  rationale: La formulation maintient le parallélisme conditionnel et rend simplement le verbe יעץ, « conseiller ».
- source_word: לֹא תִשְׁמַע אֵלָי
  choice: tu ne m’écouteras pas
  rationale: « Écouter » préserve le sens immédiat de שׁמע avec אֶל, tout en laissant ouverte la nuance contextuelle de tenir compte du conseil ou d’obéir.
- source_word: יִרְמְיָהוּ / צִדְקִיָּהוּ
  choice: Jérémie / Sédécias
  rationale: Les noms suivent leurs formes françaises bibliques usuelles.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et le parallélisme des deux propositions conditionnelles sont conservés, sans réduire la portée possible d’« écouter » à la seule audition ni l’identifier exclusivement à l’obéissance.
