id: JER.38.18
reference: Jeremiah 38:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא תֵצֵ֗א אֶל שָׂרֵי֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נִתְּנָ֞ה הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד הַ/כַּשְׂדִּ֔ים וּ/שְׂרָפ֖וּ/הָ בָּ/אֵ֑שׁ וְ/אַתָּ֖ה לֹֽא תִמָּלֵ֥ט מִ/יָּדָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/018.yaml
  text: But if you do not go out to the officials of the king of Babylon[a], then this city will be given into the hand of the Chaldeans, and they will burn it with fire[b], and you will not escape from their hand.
translation:
  language: fr
  text: Mais si tu ne sors pas pour aller vers les hauts responsables du roi de Babylone[a], cette ville sera livrée aux Chaldéens, qui l’incendieront, et toi, tu ne leur échapperas pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les princes du roi de Babylone » ou « les commandants du roi de Babylone ». Le terme hébreu désigne de manière générale des personnes de haut rang.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « cette ville sera livrée dans la main des Chaldéens » et « tu n’échapperas pas à leur main ». En hébreu, la « main » représente ici le pouvoir exercé sur quelqu’un ou quelque chose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֵצֵא
  choice: Mais si tu ne sors pas pour aller
  rationale: Le verbe signifie littéralement « sortir ». La formulation conserve cette image tout en rendant explicite en français le mouvement vers les responsables babyloniens; le contexte laisse entendre une reddition sans l’introduire directement dans le texte.
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: vers les hauts responsables du roi de Babylone
  rationale: שָׂרִים peut désigner des princes, des chefs, des commandants ou de hauts fonctionnaires. « Hauts responsables » garde cette largeur sémantique sans imposer un rang militaire précis.
- source_word: וְנִתְּנָה הָעִיר הַזֹּאת
  choice: cette ville sera livrée
  rationale: Le passif de נתן exprime ici le transfert de la ville au pouvoir ennemi. « Sera livrée » est naturel en français et rend clairement cette conséquence.
- source_word: בְּיַד הַכַּשְׂדִּים
  choice: aux Chaldéens
  rationale: L’expression hébraïque littérale « dans la main des Chaldéens » signifie qu’elle passera sous leur pouvoir. Le français idiomatique « livrée aux Chaldéens » transmet ce sens.
- source_word: וּשְׂרָפוּהָ בָּאֵשׁ
  choice: qui l’incendieront
  rationale: Littéralement, « ils la brûleront par le feu ». « L’incendieront » rend avec naturel la destruction de la ville par le feu.
- source_word: וְאַתָּה לֹא תִמָּלֵט מִיָּדָם
  choice: et toi, tu ne leur échapperas pas
  rationale: Le pronom indépendant וְאַתָּה reçoit un léger relief avec « et toi ». « Leur échapper » exprime naturellement l’idiome hébreu « échapper de leur main ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le tutoiement suit l’adresse directe du prophète au roi. Les idiomes de la « main » sont rendus naturellement dans le texte et signalés en note; la répétition lourde de « brûler par le feu » est exprimée par « incendier ».
