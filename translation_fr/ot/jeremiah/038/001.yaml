  text: וַ/יִּשְׁמַ֞ע שְׁפַטְיָ֣ה בֶן מַתָּ֗ן וּ/גְדַלְיָ֨הוּ֙ בֶּן פַּשְׁח֔וּר וְ/יוּכַל֙ בֶּן שֶׁ֣לֶמְיָ֔הוּ וּ/פַשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה אֶ֨ת הַ/דְּבָרִ֔ים אֲשֶׁ֧ר יִרְמְיָ֛הוּ מְדַבֵּ֥ר אֶל כָּל הָ/עָ֖ם לֵ/אמֹֽר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/001.yaml
  text: Shephatiah son of Mattan[a], Gedaliah son of Pashhur, Jucal son of Shelemiah, and Pashhur son of Malchiah heard the words that Jeremiah was speaking to all the people, saying,
translation:
  language: fr
  text: 'Shephatia, fils de Mattân, Guedalia, fils de Pashhour, Youkal[a], fils de Shélémia, et Pashhour, fils de Malkiya, entendirent les paroles que Jérémie adressait à tout le peuple en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu יוּכַל est rendu ici par « Youkal » ; le même homme est appelé « Yehoukal » sous une forme plus développée en Jérémie 37.3.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendirent
  rationale: Le qal narratif de שׁמע décrit simplement le fait que ces quatre hommes entendent les paroles de Jérémie. Le passé simple convient au récit et le pluriel français est exigé par le sujet composé.
- source_word: שְׁפַטְיָה ... גְדַלְיָהוּ ... יוּכַל ... פַשְׁחוּר
  choice: Shephatia ... Guedalia ... Youkal ... Pashhour
  rationale: Les noms propres sont translittérés sous des formes lisibles en français moderne. Pour יוּכַל, « Youkal » suit la forme consonantique de ce verset, tandis que la forme plus développée attestée ailleurs est signalée en note.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu généalogique direct et naturel, qui identifie chaque homme par son père.
- source_word: אֶת הַדְּבָרִים
  choice: les paroles
  rationale: Dans ce contexte de proclamation orale, דְּבָרִים désigne les paroles prononcées plutôt que des choses ou des affaires.
- source_word: אֲשֶׁר יִרְמְיָהוּ מְדַבֵּר
  choice: que Jérémie adressait
  rationale: Le participe מְדַבֵּר présente l’action comme en cours. L’imparfait français en conserve l’aspect, et « adressait » s’accorde naturellement avec le complément « à tout le peuple ».
- source_word: אֶל כָּל הָעָם
  choice: à tout le peuple
  rationale: עָם désigne ici l’ensemble des personnes auxquelles Jérémie parle; « tout le peuple » est direct, courant et suffisamment large.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif quotatif introduit le contenu du discours au verset suivant. En français, « en ces termes : » remplit cette fonction plus naturellement qu’un participe comme « disant ».'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en évitant le calque peu naturel « disant ». Le marqueur de note est placé après « Youkal », le nom auquel il se rapporte.
