  text: אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ הֵרֵ֜עוּ הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ אֵ֣ת כָּל אֲשֶׁ֤ר עָשׂוּ֙ לְ/יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֵ֥ת אֲשֶׁר הִשְׁלִ֖יכוּ אֶל הַ/בּ֑וֹר וַ/יָּ֤מָת תַּחְתָּי/ו֙ מִ/פְּנֵ֣י הָֽ/רָעָ֔ב כִּ֣י אֵ֥ין הַ/לֶּ֛חֶם ע֖וֹד בָּ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/009.yaml
  text: My lord the king[a], these men have done evil in all that they did to Jeremiah the prophet, whom they threw into the cistern, and he will die there because of the famine, for there is no bread left in the city.
translation:
  language: fr
  text: '« Mon seigneur le roi, ces hommes ont mal agi en tout ce qu’ils ont fait au prophète Jérémie : ils l’ont jeté dans la citerne[a], et il y mourra à cause de la famine, car il n’y a plus de pain dans la ville. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fosse ». Le mot hébreu bor peut désigner une fosse, un cachot ou une citerne ; ici, « citerne » correspond le mieux au contexte immédiat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mon seigneur le roi
  rationale: Cette formule conserve à la fois le possessif honorifique et le titre royal, dans un français respectueux adapté à une adresse de cour.
- source_word: הֵרֵעוּ
  choice: ont fait le mal
  rationale: Le hifil de רעע exprime ici une conduite mauvaise; cette formulation en garde la portée morale sans l’atténuer en simple erreur.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ces hommes
  rationale: Le nom hébreu est ici au masculin pluriel et désigne les responsables mentionnés dans le contexte.
- source_word: אֵת כָּל אֲשֶׁר עָשׂוּ לְיִרְמְיָהוּ הַנָּבִיא
  choice: par tout ce qu’ils ont fait au prophète Jérémie
  rationale: La traduction conserve la portée globale de כָּל אֲשֶׁר et le titre prophétique de Jérémie, tout en restant idiomatique en français.
- source_word: הִשְׁלִיכוּ אֶל הַבּוֹר
  choice: ils l’ont jeté dans la citerne
  rationale: בּוֹר peut désigner une fosse, un cachot ou une citerne; le contexte immédiat, notamment la boue au fond, favorise ici « citerne ».
- source_word: וַיָּמָת תַּחְתָּיו
  choice: il va y mourir
  rationale: Bien que וַיָּמָת ait formellement la forme narrative, le contexte exprime l’issue imminente si Jérémie reste là. « Va mourir » rend cette menace immédiate, et « y » transmet naturellement la valeur locative de תַּחְתָּיו dans ce contexte.
- source_word: מִפְּנֵי הָרָעָב
  choice: de faim
  rationale: רָעָב peut évoquer la faim ou la famine. Ici, « mourir de faim » exprime naturellement en français la cause personnelle de la mort, tandis que la proposition suivante l’inscrit clairement dans la pénurie générale de la ville.
- source_word: כִּי אֵין הַלֶּחֶם עוֹד בָּעִיר
  choice: car il n’y a plus de pain dans la ville
  rationale: « Pain » conserve l’image concrète de לֶחֶם, et « plus » rend naturellement עוֹד dans cette phrase négative.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et oralement naturel. La phrase conserve l’accusation morale, l’urgence de la mort annoncée et le lien explicite avec l’épuisement des réserves de pain.
