source:
  edition: WLC
  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לָ/צֵ֑את זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר הִרְאַ֖/נִי יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/021.yaml
  text: 'But if you refuse to go out[a], this is the word that Yahweh has shown me:'
translation:
  language: fr
  text: 'Mais si tu refuses de sortir, voici ce que Yahweh m’a montré[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « voici la parole que Yahweh m’a montrée » ; le terme hébreu peut aussi désigner une chose ou une affaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Dans le contexte, la conjonction introduit l’éventualité opposée à l’obéissance évoquée auparavant ; « Mais si » exprime naturellement ce contraste.
- source_word: מָאֵן
  choice: refuses
  rationale: Le verbe désigne un refus volontaire, et non une simple incapacité ou hésitation.
- source_word: לָצֵאת
  choice: de sortir
  rationale: Cette traduction garde le sens direct de l’infinitif. Le contexte implique d’aller vers les chefs babyloniens, mais le verbe ne signifie pas explicitement « se rendre ».
- source_word: זֶה הַדָּבָר
  choice: voici ce que
  rationale: Cette tournure française rend naturellement l’introduction de ce qui a été montré à Jérémie. Le nom דָּבָר peut désigner une parole, une chose ou une affaire ; une note conserve cette diversité possible.
- source_word: אֲשֶׁר הִרְאַנִי
  choice: m’a montré
  rationale: Le hiphil de ראה signifie « montrer » ou « faire voir ». « M’a montré » préserve la nuance visuelle de la révélation sans l’expliciter davantage.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie ici le tétragramme, nom personnel de Dieu ; « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Nature de la communication divine exprimée par זֶה הַדָּבָר
  choice: voici ce que Yahweh m’a montré
  alternative: voici la parole que Yahweh m’a montrée
  rationale: Le texte associe le terme polysémique דָּבָר au verbe « montrer ». La formulation retenue préserve la révélation visuelle et reste idiomatique, tandis que la note signale la lecture « parole » sans imposer une catégorie exclusivement verbale.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle au roi dans le contexte. La syntaxe reste concise et maintient les deux-points annonçant la vision ou révélation qui suit.
