  register: Français international moderne, digne et accessible. La parole des femmes est disposée en lignes poétiques afin de faire ressortir la forme de la raillerie. Le présent de « sont conduites » maintient la vision vive du participe hébreu; dans le contexte, la scène est annoncée comme une conséquence à venir.
