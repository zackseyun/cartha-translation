base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/022.yaml
  text: And behold[a], all the women who remain in the house of the king of Judah are being brought out to the officials of the king of Babylon, and they are saying, ‘The men at peace with you have misled you and overcome you; your feet have sunk into the mud[b]; they have turned back.’
translation:
  language: fr
  text: 'Et voici que toutes les femmes restées dans le palais du roi de Juda sont conduites auprès des dignitaires du roi de Babylone. Elles disent :


    « Les hommes qui vivaient en paix avec toi[a]

    t’ont égaré et ont pris le dessus sur toi.

    Ils ont enfoncé tes pieds dans la boue[b],

    ils ont reculé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les hommes de ta paix » ; c’est-à-dire tes proches, tes alliés ou tes associés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le bourbier ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la fonction présentative et la vivacité du marqueur hébreu dans un français naturel.
- source_word: בְּבֵית מֶלֶךְ יְהוּדָה
  choice: dans le palais du roi de Juda
  rationale: Dans ce contexte, « maison du roi » désigne le palais et non un simple bâtiment domestique.
- source_word: מוּצָאוֹת
  choice: sont conduites
  rationale: Le participe hophal exprime une action causative passive. Le présent donne à la scène annoncée son caractère vivant, sans exclure sa portée future dans le contexte.
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  choice: les hauts fonctionnaires du roi de Babylone
  rationale: שׂרים désigne ici les dignitaires ou responsables du roi, sans imposer un rang nobiliaire ou militaire précis.
- source_word: הִסִּיתוּךָ
  choice: t’ont égaré
  rationale: Rend l’idée d’une influence qui détourne ou induit en erreur, sans la limiter à une incitation formelle ni affirmer une tromperie explicite.
- source_word: וְיָכְלוּ לְךָ
  choice: et ont pris le dessus sur toi
  rationale: Expression française courante qui rend יכל avec ל, « l’emporter sur, prévaloir contre ».
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: Les hommes qui vivaient en paix avec toi
  rationale: Préserve l’image de l’expression hébraïque tout en restant intelligible; elle désigne les proches, alliés ou associés du roi.
- source_word: הָטְבְּעוּ בַבֹּץ רַגְלֶךָ
  choice: Ils ont enfoncé tes pieds dans la boue
  rationale: Respecte la forme causative plurielle du verbe et conserve l’image concrète de l’enlisement.
- source_word: נָסֹגוּ אָחוֹר
  choice: puis ils ont reculé
  rationale: Garde le mouvement de retrait exprimé par l’hébreu; « puis » explicite naturellement la succession suggérée par la scène.
