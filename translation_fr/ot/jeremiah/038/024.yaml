  text: וַ/יֹּ֨אמֶר צִדְקִיָּ֜הוּ אֶֽל יִרְמְיָ֗הוּ אִ֛ישׁ אַל יֵדַ֥ע בַּ/דְּבָֽרִים הָ/אֵ֖לֶּה וְ/לֹ֥א תָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/024.yaml
  text: Then Zedekiah said to Jeremiah[a], “Let no one know about these things[b], and you will not die.”
translation:
  language: fr
  text: 'Alors Sédécias dit à Jérémie : « Que personne ne sache rien de cela, et tu ne mourras pas[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition peut aussi exprimer le but ou la conséquence : « afin que tu ne meures pas » ou « ainsi, tu ne mourras pas ».'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » restitue naturellement cette progression en français moderne.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: אֶל יִרְמְיָהוּ
  choice: à Jérémie
  rationale: La préposition אֶל introduit ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: אִישׁ אַל יֵדַע
  choice: Que personne ne sache
  rationale: אִישׁ, littéralement « homme », a ici une portée générique sous la négation. La tournure avec le subjonctif rend l’interdiction exprimée par אַל et le jussif.
- source_word: בַּדְּבָרִים הָאֵלֶּה
  choice: rien de ces choses
  rationale: דְּבָרִים peut désigner des paroles, des faits ou des affaires. « Ces choses » conserve cette amplitude ; « ne sache rien de » est idiomatique en français.
- source_word: וְלֹא תָמוּת
  choice: et tu ne mourras pas
  rationale: La coordination simple reproduit la forme hébraïque sans trancher entre assurance, conséquence et finalité.
theological_decisions:
- issue: Rapport logique entre le secret demandé et la survie de Jérémie
  choice: et tu ne mourras pas
  alternative: afin que tu ne meures pas / sinon tu mourras
  rationale: L’hébreu coordonne les propositions avec וְ et ne précise pas explicitement le rapport logique. La traduction retenue préserve cette tension au lieu d’imposer une finalité ou une menace.
translation_notes:
  register: Français international moderne, sobre et digne. « Que personne ne sache » est naturel tout en conservant la force directive ; le tutoiement correspond à l’adresse directe singulière du texte hébreu.
