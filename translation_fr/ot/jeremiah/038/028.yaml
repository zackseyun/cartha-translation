  text: וַ/יֵּ֤שֶׁב יִרְמְיָ֨הוּ֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה עַד י֖וֹם אֲשֶׁר נִלְכְּדָ֣ה יְרוּשָׁלִָ֑ם וְ/הָיָ֕ה כַּ/אֲשֶׁ֥ר נִלְכְּדָ֖ה יְרוּשָׁלִָֽם־־ס׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/028.yaml
  text: And Jeremiah remained in the court of the guard until the day Jerusalem was captured[b][a]. And it happened when Jerusalem was captured—
translation:
  language: fr
  text: Jérémie resta dans la cour de la garde jusqu’au jour où Jérusalem fut prise[b]. Et il arriva que, lorsque Jérusalem fut prise—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu s’interrompt brusquement : « Et il arriva que, lorsque Jérusalem fut prise— ». Cette formulation sert probablement de transition vers ce qui suit plutôt que de constituer à elle seule une phrase complète.'
    reason: textual_variant
  - marker: b
    text: Ou « fut conquise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Dans ce contexte de détention, « resta » exprime la continuité de la présence de Jérémie sans suggérer qu’il y résidait volontairement.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: dans la cour de la garde
  rationale: Cette formulation conserve le sens institutionnel probable de la cour servant de lieu de garde ou de détention et correspond au contexte immédiat.
- source_word: עַד יוֹם אֲשֶׁר
  choice: jusqu’au jour où
  rationale: Rend naturellement la construction temporelle qui marque le terme du séjour de Jérémie dans cette cour.
- source_word: נִלְכְּדָה
  choice: fut prise
  rationale: Le niphal de לכד désigne ici la prise militaire d’une ville. En français, « une ville fut prise » est idiomatique et direct.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Et lorsque
  rationale: La proposition hébraïque est inachevée et sert vraisemblablement de transition. « Et lorsque » en préserve la suspension sans ajouter un verbe principal absent du texte.
