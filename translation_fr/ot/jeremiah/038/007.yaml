source:
  edition: WLC
  text: וַ/יִּשְׁמַ֡ע עֶֽבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י אִ֣ישׁ סָרִ֗יס וְ/הוּא֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ כִּֽי נָתְנ֥וּ אֶֽת יִרְמְיָ֖הוּ אֶל הַ/בּ֑וֹר וְ/הַ/מֶּ֥לֶךְ יוֹשֵׁ֖ב בְּ/שַׁ֥עַר בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/007.yaml
  text: Ebed-melech the Cushite[a], a court official who was in the king’s house, heard that they had put Jeremiah into the cistern[c][b], while the king was sitting at the Benjamin Gate.
translation:
  language: fr
  text: Ébed-Mélek, le Koushite[a], un fonctionnaire de la cour[b] qui se trouvait dans le palais royal, apprit qu’ils avaient mis Jérémie dans la citerne[c], tandis que le roi était assis à la porte de Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Koushite est un homme originaire de Koush ; les traductions traditionnelles disent parfois « l’Éthiopien ». Le terme ne correspond pas nécessairement à l’Éthiopie moderne.
    reason: cultural_note
  - marker: b
    text: Ou « un eunuque ». Le terme hébreu peut désigner un eunuque au sens propre ou, plus largement, un fonctionnaire de la cour royale.
    reason: lexical_alternative
  - marker: c
    text: Ou « la fosse ». Le mot hébreu peut désigner une fosse ou une citerne ; ici, le contexte indique une citerne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Le verbe שׁמע signifie ici qu’Ébed-Mélek reçoit l’information. « Apprit » est naturel en français narratif et évite de suggérer qu’il entend directement la scène.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ébed-Mélek
  rationale: Le groupe fonctionne ici comme un nom propre; il est donc translittéré et adapté à l’orthographe française plutôt que traduit par « serviteur du roi ».
- source_word: הַכּוּשִׁי
  choice: le Koushite
  rationale: Le terme désigne un homme originaire de Koush. « Koushite » conserve la désignation ethnogéographique hébraïque sans l’identifier de façon anachronique à l’Éthiopie moderne.
- source_word: אִישׁ סָרִיס
  choice: un fonctionnaire de la cour
  rationale: סָרִיס peut désigner un eunuque au sens propre ou, plus largement, un haut fonctionnaire royal. Le contexte met en avant sa fonction à la cour; l’autre sens possible est signalé en note.
- source_word: וְהוּא בְּבֵית הַמֶּלֶךְ
  choice: qui se trouvait dans le palais royal
  rationale: Littéralement « dans la maison du roi ». Dans ce contexte, l’expression désigne le palais ou l’ensemble palatial; cette formulation est claire et naturelle en français.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce qu’Ébed-Mélek apprend.
- source_word: נָתְנוּ אֶת־יִרְמְיָהוּ אֶל־הַבּוֹר
  choice: ils avaient mis Jérémie dans la citerne
  rationale: בּוֹר peut désigner une fosse ou une citerne. Le contexte immédiat de Jérémie 38 indique une citerne; le plus-que-parfait marque l’antériorité de l’action par rapport à l’information reçue.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: tandis que le roi siégeait
  rationale: Le participe présente une situation simultanée en arrière-plan. « Siégeait » convient à la présence officielle du roi à une porte urbaine, lieu d’audience et d’administration, tout en conservant l’idée qu’il était assis.
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: à la porte de Benjamin
  rationale: Formulation française usuelle pour une porte urbaine portant ce nom.
theological_decisions: []
translation_notes:
