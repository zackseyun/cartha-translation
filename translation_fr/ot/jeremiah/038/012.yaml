base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/012.yaml
  text: Then Ebed-melech the Cushite said to Jeremiah[a], “Please put these worn-out rags and torn clothes under your armpits[c][b], under the ropes.” And Jeremiah did so.
translation:
  language: fr
  text: 'Alors Ébed-Mélek, le Koushite[a], dit à Jérémie : « Mets, je te prie, ces vieux chiffons et ces morceaux d’étoffe usés[b] sous tes aisselles[c], sous les cordes. » Jérémie fit ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Éthiopien ». L’hébreu dit « le Koushite », c’est-à-dire un homme originaire de Koush.
    reason: lexical_alternative
  - marker: b
    text: Les mots hébreux désignant ces objets sont rares; ils renvoient probablement à des tissus usés servant à protéger le corps de Jérémie contre les cordes.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « sous les articulations de tes mains ou de tes bras »; le contexte indique la région sous les bras, là où les cordes exerceraient une pression pendant la remontée.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: Ébed-Mélek
  rationale: Translittération française du nom propre, avec accents facilitant sa prononciation.
- source_word: הַכּוּשִׁי
  choice: le Koushite
  rationale: Désigne un homme originaire de Koush et reste plus proche du terme ethnogéographique hébreu que « l’Éthiopien ».
- source_word: שִׂים נָא
  choice: Mets, je te prie
  rationale: L’impératif accompagné de נָא exprime ici une demande; cette tournure conserve cette nuance dans un registre digne et naturel.
- source_word: בְּלוֹאֵי הַסְּחָבוֹת
  choice: ces vieux chiffons
  rationale: Le groupe désigne des objets de tissu détériorés; « vieux chiffons » rend naturellement leur état et leur fonction probable de rembourrage.
- source_word: וְהַמְּלָחִים
  choice: et ces morceaux d’étoffe usés
  rationale: Le second substantif est rare et incertain. Cette traduction indique une matière textile détériorée sans prétendre en préciser indûment la nature.
- source_word: תַּחַת אַצִּלוֹת יָדֶיךָ
  choice: sous tes aisselles
  rationale: L’expression est littéralement liée aux articulations ou aux parties jointives des bras; dans la scène de levage, elle vise vraisemblablement la région sous les bras.
- source_word: מִתַּחַת לַחֲבָלִים
  choice: sous les cordes
  rationale: Les étoffes doivent être placées entre le corps de Jérémie et les cordes.
- source_word: וַיַּעַשׂ יִרְמְיָהוּ כֵּן
  choice: Jérémie fit ainsi
  rationale: Formule narrative concise exprimant que Jérémie exécute l’instruction.
