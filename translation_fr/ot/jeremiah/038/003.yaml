  source_fidelity: Le texte rend fidèlement la formule prophétique, l’intensif hébreu de הִנָּתוֹן תִּנָּתֵן (« sera bel et bien livrée »), le sens militaire de חֵיל, et la prise de la ville. « Aux mains de » exprime de façon idiomatique le transfert sous le contrôle de l’armée, tout en conservant l’image de la main. Le masculin singulier de « il s’en emparera » maintient le déplacement syntaxique du texte hébreu vers le roi, sans attribuer indûment l’action à l’armée comme sujet grammatical.
