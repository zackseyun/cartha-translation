id: JER.38.3
reference: Jeremiah 38:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנָּתֹ֨ן תִּנָּתֵ֜ן הָ/עִ֣יר הַ/זֹּ֗את בְּ/יַ֛ד חֵ֥יל מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/003.yaml
  text: 'Thus says Yahweh: This city will surely be given into the hand of the army of the king of Babylon[a], and he will capture it.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Cette ville sera bel et bien livrée aux mains de l’armée du roi de Babylone[a], et il s’en emparera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main de l’armée du roi de Babylone » ; cette expression signifie « sous le pouvoir de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: La formule prophétique est rendue dans un registre digne et courant. Le présent français exprime la proclamation autorisée, et le nom divin est transcrit « Yahweh ».
- source_word: הִנָּתֹן תִּנָּתֵן
  choice: sera bel et bien livrée
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de l’action passive. « Bel et bien » restitue cette insistance en français naturel.
- source_word: הָעִיר הַזֹּאת
  choice: Cette ville
  rationale: Équivalent direct et idiomatique du syntagme démonstratif hébreu.
- source_word: בְּיַד
  choice: aux mains de
  rationale: Cette expression conserve l’image hébraïque de la main tout en signifiant clairement le passage sous le pouvoir ou le contrôle d’autrui.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: l’armée du roi de Babylone
  rationale: Dans ce contexte militaire, חֵיל désigne l’armée ou les forces armées. Le complément construit est rendu naturellement en français.
- source_word: וּלְכָדָהּ
  choice: et il s’en emparera
  rationale: לכד désigne ici la prise d’une ville. Le sujet masculin singulier demeure implicite comme en hébreu et renvoie grammaticalement au roi, son armée étant l’instrument de la conquête.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom divin personnel sans lui substituer un titre.
- issue: Sujet de וּלְכָדָהּ
  choice: il s’en emparera
  alternative: elle s’en emparera
  rationale: La forme verbale hébraïque est au masculin singulier et peut grammaticalement renvoyer au « roi de Babylone », même si l’armée exécute matériellement la prise. La traduction conserve ce déplacement plutôt que de l’aplanir.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’insistance de l’hébreu, son image de la « main » sous une forme idiomatique, ainsi que le passage du collectif « armée » au sujet masculin singulier.
