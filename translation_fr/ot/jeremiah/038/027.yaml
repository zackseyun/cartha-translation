base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/027.yaml
  text: Then all the officials came to Jeremiah and questioned him[a], and he told them all these words that the king had commanded. So they were silent before him, for the matter had not been heard.
translation:
  language: fr
  text: Alors tous les responsables vinrent trouver Jérémie et l’interrogèrent. Il leur rapporta toutes ces paroles que le roi lui avait ordonné de dire. Ils gardèrent le silence, car l’affaire n’avait pas été entendue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car l’affaire n’avait pas été entendue ». Le mot hébreu peut désigner une parole, une affaire ou, dans ce contexte, la conversation entre le roi et Jérémie.'
    reason: Préserve l’ambiguïté de דָּבָר tout en signalant l’interprétation contextuelle possible, sans l’imposer dans le texte.
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Dans ce contexte royal, שָׂרִים désigne les principaux responsables du royaume. « Hauts fonctionnaires » est moderne et évite l’archaïsme ou la connotation dynastique de « princes ».
- source_word: וַיִּשְׁאֲלוּ אֹתוֹ
  choice: l’interrogèrent
  rationale: Le verbe שׁאל décrit ici un questionnement insistant visant à découvrir ce que le roi et Jérémie se sont dit, plutôt qu’une simple demande.
- source_word: וַיַּגֵּד לָהֶם
  choice: il leur rapporta
  rationale: Le hifil de נגד signifie faire connaître ou rapporter. Ce choix convient à la répétition d’une réponse dictée par le roi.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: exactement les paroles
  rationale: La préposition כְּ avec כָּל exprime la conformité à l’ensemble des paroles prescrites. « Exactement » rend naturellement cette idée sans alourdir la phrase.
- source_word: אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: que le roi lui avait ordonné de dire
  rationale: צוה exprime un ordre royal. « De dire » explicite en français l’objet implicite de l’ordre, déjà établi par le contexte immédiat.
- source_word: וַיַּחֲרִשׁוּ מִמֶּנּוּ
  choice: ils cessèrent donc de le questionner
  rationale: חרשׁ signifie se taire; avec מִמֶּנּוּ, l’expression indique qu’ils ne poursuivirent pas leur échange avec lui. La formulation retenue communique naturellement l’effet narratif.
- source_word: כִּי לֹא נִשְׁמַע הַדָּבָר
  choice: car la conversation n’avait pas été entendue
  rationale: דָּבָר peut désigner une parole, une affaire ou ici l’échange confidentiel avec le roi. Le passif indéfini de שׁמע est préservé par « n’avait pas été entendue ».
