    rationale: Le mot hébreu peut renvoyer à une parole, à un échange ou à une affaire. Le contexte favorise l’échange du roi avec Jérémie, mais ne le formule pas explicitement; « l’affaire » permet de préserver cette indétermination.
  - severity: low
    issue: « Ils cessèrent donc de le questionner » interprète le silence comme la seule cessation de l’interrogatoire.
    rationale: וַיַּחֲרִשׁוּ exprime d’abord le fait de se taire. « Ils gardèrent le silence » garde la formulation plus générale du texte source.
  - severity: low
