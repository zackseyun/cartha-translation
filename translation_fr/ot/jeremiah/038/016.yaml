base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/016.yaml
  text: Then King Zedekiah swore secretly to Jeremiah[a], saying, “As Yahweh lives, who made this life for us, I will not put you to death, nor will I give you into the hand of these men who are seeking your life.”
translation:
  language: fr
  text: 'Puis le roi Sédécias prêta secrètement serment à Jérémie en disant : « Aussi vrai que Yahweh est vivant, lui qui a fait pour nous cette vie[a], je ne te ferai pas mourir et je ne te livrerai pas aux mains de ces hommes qui cherchent à prendre ta vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui nous a donné cette vie ». L’hébreu dit plus littéralement : « qui a fait pour nous cette vie » ou « cette âme ».'
    reason: 'L’expression hébraïque est inhabituelle : עָשָׂה signifie « faire », tandis que נֶפֶשׁ peut désigner la vie, la personne ou l’âme.'
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: prêta serment
  rationale: Le verbe désigne la prestation d’un serment. Cette formulation est naturelle et solennelle en français.
- source_word: בַּסֵּתֶר
  choice: secrètement
  rationale: L’adverbe exprime le caractère caché de l’échange sans alourdir la phrase.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formule française restitue clairement la valeur solennelle de la formule hébraïque de serment.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription rend directement le nom divin présent dans le texte hébreu.
- source_word: אֲשֶׁר עָשָׂה לָנוּ אֶת הַנֶּפֶשׁ הַזֹּאת
  choice: lui qui a fait pour nous cette vie
  rationale: La formulation conserve le verbe « faire » et rend נֶפֶשׁ par « vie », sens approprié ici. L’étrangeté relative de l’expression hébraïque est préservée, avec une variante idiomatique en note.
- source_word: אִם אֲמִיתֶךָ
  choice: je ne te ferai pas mourir
  rationale: Après la formule de serment, אִם porte elliptiquement une valeur négative. Le français doit expliciter cette négation.
- source_word: וְאִם אֶתֶּנְךָ בְּיַד
  choice: et je ne te livrerai pas aux mains de
  rationale: La traduction conserve l’image hébraïque de la remise entre les mains de quelqu’un tout en restant idiomatique.
- source_word: מְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: qui cherchent à prendre ta vie
  rationale: Cette formulation conserve l’image de la « vie » recherchée tout en rendant clairement en français l’intention meurtrière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans la formule de serment
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme; « Yahweh » préserve le caractère de nom propre sans substituer un titre.
translation_notes:
  register: Français moderne, digne et accessible. Le discours royal conserve une certaine solennité sans archaïsmes. La répétition de « vie » reflète celle de נֶפֶשׁ dans le texte hébreu.
