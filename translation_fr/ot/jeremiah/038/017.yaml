  text: וַ/יֹּ֣אמֶר יִרְמְיָ֣הוּ אֶל צִדְקִיָּ֡הוּ כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם יָצֹ֨א תֵצֵ֜א אֶל שָׂרֵ֤י מֶֽלֶךְ בָּבֶל֙ וְ/חָיְתָ֣ה נַפְשֶׁ֔/ךָ וְ/הָ/עִ֣יר הַ/זֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּ/אֵ֑שׁ וְ/חָיִ֖תָה אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/017.yaml
  text: 'Then Jeremiah said to Zedekiah[a], “Thus says Yahweh, the God of hosts, the God of Israel: If you indeed go out to the officials of the king of Babylon, your life will be spared, and this city will not be burned with fire[c][b]; and you and your household will live.”'
translation:
  language: fr
  text: 'Alors Jérémie dit à Sédécias : « Voici ce que dit Yahweh, le Dieu des armées, le Dieu d’Israël : Si tu te rends vraiment[a] aux responsables du roi de Babylone, tu auras la vie sauve[b], et cette ville ne sera pas brûlée par le feu. Toi et ta maisonnée[c], vous vivrez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Si vraiment tu sors vers ». En contexte, sortir vers les responsables babyloniens signifie se rendre à eux. L’hébreu renforce le verbe par un infinitif absolu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ta vie vivra ». Le mot hébreu peut aussi désigner la personne elle-même ; ici, il est question de survivre.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ta maison ». Ici, ce terme désigne la maisonnée — la famille et les personnes qui en dépendent — plutôt que le bâtiment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יִרְמְיָהוּ אֶל צִדְקִיָּהוּ
  choice: Alors Jérémie dit à Sédécias
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: Le syntagme construit désigne Dieu comme Dieu des armées ; cette formulation française est claire et conserve l’image du texte hébreu.
- source_word: אִם יָצֹא תֵצֵא
  choice: Si tu te livres vraiment
  rationale: L’infinitif absolu suivi du verbe conjugué marque l’insistance. Dans ce contexte, « sortir vers » les responsables babyloniens signifie se rendre ou se livrer à eux.
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: aux hauts fonctionnaires du roi de Babylone
  rationale: שָׂרִים désigne ici les principaux responsables du roi ; « hauts fonctionnaires » laisse ouverte leur fonction exacte, civile ou militaire.
- source_word: וְחָיְתָה נַפְשֶׁךָ
  choice: tu auras la vie sauve
  rationale: נֶפֶשׁ désigne ici la vie ou la personne dans une promesse de survie, non une âme immatérielle distinguée du corps.
- source_word: לֹא תִשָּׂרֵף בָּאֵשׁ
  choice: ne sera pas brûlée par le feu
  rationale: La formulation conserve explicitement בָּאֵשׁ tout en restant idiomatique en français.
- source_word: וְחָיִתָה אַתָּה וּבֵיתֶךָ
  choice: Toi et les gens de ta maison, vous vivrez
  rationale: בַּיִת renvoie ici à la maisonnée, c’est-à-dire à la famille et aux personnes qui dépendent du roi, plutôt qu’au bâtiment.
theological_decisions:
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens de נֶפֶשׁ dans une formule de survie
  choice: tu auras la vie sauve
  alternative: ton âme vivra ; tu vivras
  rationale: Le contexte porte sur la survie physique de Sédécias. Ce rendu évite d’introduire une conception anthropologique étrangère au passage.
- issue: Portée de בֵּיתֶךָ
  choice: les gens de ta maison
  alternative: ta maison ; ta maisonnée
  rationale: L’expression désigne vraisemblablement la famille et les dépendants de Sédécias. Le rendu évite de faire croire que le bâtiment lui-même « vivra ».
translation_notes:
  register: Français international actuel, digne et directement compréhensible. Le tutoiement correspond à l’adresse singulière du prophète au roi. « Voici ce que dit » rend la formule prophétique de manière naturelle ; « hauts fonctionnaires » évite de préciser indûment une charge civile ou militaire.
