source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הַ/שָּׂרִ֜ים אֶל הַ/מֶּ֗לֶךְ י֣וּמַת נָא֮ אֶת הָ/אִ֣ישׁ הַ/זֶּה֒ כִּֽי עַל כֵּ֡ן הֽוּא מְרַפֵּ֡א אֶת יְדֵי֩ אַנְשֵׁ֨י הַ/מִּלְחָמָ֜ה הַֽ/נִּשְׁאָרִ֣ים בָּ/עִ֣יר הַ/זֹּ֗את וְ/אֵת֙ יְדֵ֣י כָל הָ/עָ֔ם לְ/דַבֵּ֣ר אֲלֵי/הֶ֔ם כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה כִּ֣י הָ/אִ֣ישׁ הַ/זֶּ֗ה אֵינֶ֨/נּוּ דֹרֵ֧שׁ לְ/שָׁל֛וֹם לָ/עָ֥ם הַ/זֶּ֖ה כִּ֥י אִם לְ/רָעָֽה־־־־־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/004.yaml
  text: Then the officials said to the king[a], “Please let this man be put to death, for in this way he is weakening the hands of the men of war who remain in this city, and the hands of all the people, by speaking to them words like these. For this man is not seeking the welfare of this people[c][b], but their harm.”
translation:
  language: fr
  text: 'Alors les hauts responsables dirent au roi : « Nous t’en prions, que cet homme soit mis à mort ! En effet, il démoralise[a] ainsi les soldats[b] qui restent dans cette ville, ainsi que tout le peuple, en leur tenant de tels propos. Car cet homme ne cherche pas le bien-être[c] de ce peuple, mais son malheur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il relâche les mains ». Cette expression signifie qu’il décourage ou démoralise.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les hommes de guerre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « la paix ». Le mot hébreu peut désigner la paix, le bien-être et la prospérité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: les hauts responsables
  rationale: Le terme désigne ici des responsables exerçant une autorité politique ou militaire. « Hauts responsables » est actuel, naturel et suffisamment large, contrairement à « princes » ou à un grade militaire précis.
- source_word: יּוּמַת נָא
  choice: Nous t’en prions, que cet homme soit mis à mort !
  rationale: La forme verbale demande l’exécution de l’homme, tandis que נָא présente cette exigence comme une requête adressée au roi. « Mis à mort » conserve la dimension d’une exécution ordonnée par l’autorité.
- source_word: עַל כֵּן
  choice: En effet, … ainsi
  rationale: Dans ce contexte, l’expression introduit le motif de la demande et renvoie à la manière dont les paroles de Jérémie produisent leur effet. La formulation française répartit naturellement ces deux nuances.
- source_word: מְרַפֵּא אֶת יְדֵי
  choice: il démoralise
  rationale: L’expression signifie littéralement qu’il « relâche les mains » et décrit la perte de courage ou de détermination. « Démoralise » communique clairement le sens idiomatique, tandis qu’une note conserve l’image hébraïque.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les soldats
  rationale: Littéralement « les hommes de guerre ». « Soldats » est le terme français moderne et naturel pour les combattants encore présents dans la ville, sans modifier la portée du texte.
- source_word: הַנִּשְׁאָרִים
  choice: qui restent
  rationale: Le participe désigne ceux qui sont encore présents ou qui ont été laissés dans la ville. « Qui restent » est direct et n’ajoute pas l’idée plus précise de survie.
- source_word: וְאֵת יְדֵי כָל הָעָם
  choice: ainsi que tout le peuple
  rationale: Le verbe idiomatique « démoraliser » porte également sur le second complément. Répéter littéralement « les mains » en français obscurcirait la phrase ; l’image originale est signalée dans la note.
- source_word: לְדַבֵּר אֲלֵיהֶם כַּדְּבָרִים הָאֵלֶּה
  choice: en leur tenant de tels propos
  rationale: La construction indique le moyen par lequel Jérémie les démoralise. « De tels propos » rend la valeur comparative de כַּ et demeure naturel en français.
- source_word: דֹרֵשׁ לְשָׁלוֹם
  choice: ne cherche pas le bien-être
  rationale: שָׁלוֹם peut désigner la paix, mais aussi le bien-être, la sécurité ou la prospérité. Ici, « bien-être » exprime largement le bien du peuple et forme le contraste avec son malheur, sans effacer l’autre sens possible, conservé en note.
- source_word: כִּי אִם לְרָעָה
  choice: mais son malheur
  rationale: La construction restrictive et adversative oppose le bien recherché au mal destiné au peuple. « Son malheur » explicite naturellement en français le complément implicite et conserve le contraste rhétorique.
theological_decisions:
- issue: Portée de שָׁלוֹם dans l’accusation portée contre Jérémie
  choice: le bien-être de ce peuple
  alternative: la paix de ce peuple
  rationale: Le contexte porte sur ce qui est favorable ou nuisible au peuple, mais le mot hébreu garde une dimension possible de paix. La traduction principale privilégie le sens contextuel large, et la note maintient l’ambiguïté lexicale sans imposer une lecture théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la solennité de la requête adressée au roi tout en traduisant clairement l’expression idiomatique hébraïque. Les notes préservent l’image des « mains », la formulation littérale « hommes de guerre » et l’étendue sémantique de שָׁלוֹם.
