base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/019.yaml
  text: Then King Zedekiah said to Jeremiah[a], “I am afraid of the Judeans who have defected to the Chaldeans[e][d][c][b], lest they hand me over to them and they mistreat me.”
translation:
  language: fr
  text: 'Le roi Sédécias dit alors à Jérémie : « J’ai peur des Judéens[a] qui sont passés du côté des Chaldéens[b], de peur qu’ils ne me livrent aux mains des Chaldéens et que ceux-ci ne me maltraitent[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Juifs ». Ici, le terme hébreu désigne plus précisément les gens de Juda.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui se sont rendus aux Chaldéens » ou « qui ont fait défection en faveur des Chaldéens ». Les Chaldéens désignent ici les Babyloniens.
    reason: lexical_alternative
  - marker: d
    text: Ou « et que ceux-ci me traitent cruellement » ou « et qu’ils se jouent de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹאֵג
  choice: J’ai peur
  rationale: Dans ce contexte, le participe exprime l’inquiétude craintive de Sédécias devant ce qui pourrait lui arriver. Cette formulation est naturelle et garde la force émotionnelle de l’hébreu.
- source_word: הַיְּהוּדִים
  choice: les Judéens
  rationale: Dans ce cadre historique, le terme désigne les gens de Juda. « Judéens » est plus précis que « Juifs » et limite les associations anachroniques.
- source_word: נָפְלוּ אֶל
  choice: sont passés du côté de
  rationale: L’expression idiomatique décrit le ralliement au camp adverse, sans imposer la nuance plus précise de désertion ou de reddition.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Ce choix conserve la désignation précise du texte hébreu pour les forces néo-babyloniennes.
- source_word: פֶּן
  choice: Ils pourraient
  rationale: La formulation française exprime naturellement l’éventualité redoutée introduite par פֶּן, sans recourir au tour plus soutenu « de peur que ».
- source_word: יִתְּנוּ אֹתִי בְּיָדָם
  choice: me livrer entre leurs mains
  rationale: Cette expression française conserve l’image hébraïque de la main tout en indiquant clairement la remise au pouvoir des Judéens ralliés.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: et me maltraiter
  rationale: Le verbe évoque un traitement abusif, cruel ou humiliant. « Maltraiter » garde cette portée sans préciser indûment la forme des sévices.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste simple et oral, tandis que « Judéens » et « Chaldéens » préservent la précision historique. Les notes signalent les principales possibilités lexicales et l’image littérale de l’hébreu.
