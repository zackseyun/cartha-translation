base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/014.yaml
  text: Then King Zedekiah sent and took Jeremiah the prophet to himself[a], to the third entrance that is in the house of Yahweh, and the king said to Jeremiah, “I am asking you something[b]; do not hide anything from me.”
translation:
  language: fr
  text: 'Le roi Sédécias envoya chercher le prophète Jérémie et le fit venir auprès de lui, à la troisième entrée de la maison de Yahweh[a]. Le roi dit à Jérémie : « J’ai quelque chose à te demander. Ne me cache rien[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du temple de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne me cache pas une chose ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  choice: envoya chercher ... et le fit venir
  rationale: 'Cette formulation française naturelle conserve les deux actions successives : le roi donne l’ordre, puis fait amener Jérémie auprès de lui. « Prit » laisserait entendre à tort que le roi agit personnellement.'
- source_word: אֵלָיו
  choice: auprès de lui
  rationale: Exprime clairement le mouvement vers le roi et la rencontre personnelle, sans lourdeur.
- source_word: מָבוֹא הַשְּׁלִישִׁי
  choice: la troisième entrée
  rationale: Rend directement le lieu d’accès désigné par le texte sans chercher à préciser de quelle entrée il s’agit.
- source_word: בְּבֵית יְהוָה
  choice: de la maison de Yahweh
  rationale: Conserve l’expression hébraïque « maison de Yahweh » tout en signalant en note l’équivalent contextuel « temple ».
- source_word: שֹׁאֵל אֲנִי אֹתְךָ דָּבָר
  choice: J’ai quelque chose à te demander
  rationale: Rend de façon idiomatique en français la construction participiale immédiate et le sens indéfini de דָּבָר.
- source_word: אַל תְּכַחֵד מִמֶּנִּי דָּבָר
  choice: Ne me cache rien
  rationale: Restitue avec concision le verbe « cacher, dissimuler » et la portée totale de דָּבָר dans la négation.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin יְהוָה. La translittération « Yahweh » préserve ici le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le récit reste soutenu sans tournures archaïques ; le dialogue direct est naturel et ferme.
