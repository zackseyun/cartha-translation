  text: וַ/יֵּצֵ֥א עֶֽבֶד מֶ֖לֶךְ מִ/בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְדַבֵּ֥ר אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/008.yaml
  text: Then Ebed-melech went out from the king’s house and spoke to the king[a], saying,
translation:
  language: fr
  text: 'Ébed-Mélek sortit alors de la maison du roi et parla au roi en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit alors
  rationale: Le verbe יצא exprime un mouvement vers l’extérieur; le passé simple convient au récit, et « alors » marque naturellement la succession portée par le wayyiqtol.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ébed-Mélek
  rationale: Il s’agit ici d’un nom propre. La translittération française avec accents facilite une prononciation naturelle.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: de la maison du roi
  rationale: Cette formulation conserve l’expression hébraïque littérale. Dans ce contexte royal, elle peut désigner le palais, mais traduire directement par « palais » serait plus interprétatif.
- source_word: וַיְדַבֵּר אֶל הַמֶּלֶךְ
  choice: et parla au roi
  rationale: דבר avec אֶל signifie couramment « parler à ». Ce choix maintient aussi la distinction avec לֵאמֹר, qui introduit les paroles à venir.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'La formule introduit le discours direct du verset suivant. En français moderne, « en ces termes : » est plus naturel que le calque « disant » tout en conservant sa fonction.'
