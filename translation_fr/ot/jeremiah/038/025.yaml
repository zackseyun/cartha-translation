- from: 'Mais si les hauts fonctionnaires apprennent que je t’ai parlé et qu’ils viennent te dire : « Dis-nous, s’il te plaît, ce que tu as dit au roi. Ne nous le cache pas, sinon nous te ferons mourir. Dis-nous aussi ce que le roi t’a dit. »'
  to: 'Mais si les hauts fonctionnaires apprennent que je t’ai parlé et viennent te voir pour te dire : « Dis-nous, s’il te plaît, ce que tu as dit au roi. Ne nous le cache pas, et nous ne te mettrons pas à mort. Dis-nous aussi ce que le roi t’a dit. »'
  rationale: La révision corrige l’inversion de sens dans la clause relative à la mise à mort. Elle conserve la structure conditionnelle, le niveau de langue et les choix lexicaux du brouillon, tout en formulant plus naturellement la séquence « venir ... dire ». La répétition explicite de « Dis-nous aussi » dans la dernière phrase rend en français l’ellipse de la demande finale sans ajouter de contenu.
  reviewer_model: gpt-5.6-terra
