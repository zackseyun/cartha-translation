source:
  edition: WLC
  text: וְ/כִֽי יִשְׁמְע֣וּ הַ/שָּׂרִים֮ כִּֽי דִבַּ֣רְתִּי אִתָּ/ךְ֒ וּ/בָ֣אוּ אֵלֶ֣י/ךָ וְֽ/אָמְר֪וּ אֵלֶ֟י/ךָ הַגִּֽידָ/ה נָּ֨א לָ֜/נוּ מַה דִּבַּ֧רְתָּ אֶל הַ/מֶּ֛לֶךְ אַל תְּכַחֵ֥ד מִמֶּ֖/נּוּ וְ/לֹ֣א נְמִיתֶ֑/ךָ וּ/מַה דִּבֶּ֥ר אֵלֶ֖י/ךָ הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/025.yaml
  text: But if the officials hear that I have spoken with you[a], and they come to you and say to you, ‘Please tell us what you said to the king; do not hide it from us, and we will not put you to death, and what the king said to you,’
translation:
  language: fr
  text: 'Mais si les hauts fonctionnaires apprennent que je t’ai parlé et viennent te voir pour te dire : « Dis-nous, s’il te plaît, ce que tu as dit au roi. Ne nous le cache pas, et nous ne te mettrons pas à mort. Dis-nous aussi ce que le roi t’a dit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Mais si
  rationale: Introduit naturellement en français une éventualité conditionnelle liée aux instructions précédentes, avec une légère nuance adversative.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Dans ce contexte, le terme désigne les principaux responsables de la cour et du gouvernement, non des fils de roi. « Hauts fonctionnaires » est clair et actuel.
- source_word: דִבַּרְתִּי אִתָּךְ
  choice: je t’ai parlé
  rationale: Le passé composé rend naturellement l’action achevée dont les conséquences restent pertinentes dans le scénario envisagé.
- source_word: וּבָאוּ אֵלֶיךָ
  choice: et qu’ils viennent
  rationale: Le présent du subjonctif s’intègre idiomatiquement à la proposition conditionnelle française et conserve l’éventualité exprimée.
- source_word: הַגִּידָה נָּא לָנוּ
  choice: Dis-nous, s’il te plaît
  rationale: L’impératif associé à נָא exprime une demande pressante sous une forme polie.
- source_word: מַה דִּבַּרְתָּ אֶל־הַמֶּלֶךְ
  choice: ce que tu as dit au roi
  rationale: Formulation française directe et naturelle pour rapporter le contenu des paroles adressées au roi.
- source_word: אַל־תְּכַחֵד מִמֶּנּוּ
  choice: Ne nous le cache pas
  rationale: כחד signifie ici cacher ou dissimuler; le pronom « le » reprend naturellement le contenu de la conversation.
- source_word: וְלֹא נְמִיתֶךָ
  choice: sinon nous te ferons mourir
  rationale: 'Dans le discours menaçant des responsables, la coordination hébraïque exprime pragmatiquement la conséquence d’un refus : s’il ne cache rien, ils ne le tueront pas. La formulation française rend clairement cette menace sans en modifier la portée.'
- source_word: וּמַה דִּבֶּר אֵלֶיךָ הַמֶּלֶךְ
  choice: Dis-nous aussi ce que le roi t’a dit
  rationale: La répétition du verbe, sous-entendu dans l’hébreu, produit une demande complète et idiomatique en français tout en conservant le second objet de l’interrogatoire.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement est conservé conformément aux formes hébraïques singulières. La syntaxe de la citation a été légèrement explicitée afin d’éviter l’enchaînement maladroit que produirait un calque de l’hébreu.
