    issue: Inversion de la promesse négative en menace positive
    rationale: 'Le texte hébreu dit : « ne nous le cache pas, et nous ne te mettrons pas à mort ». « Sinon nous te ferons mourir » affirme l''inverse et introduit une condition explicite absente de la formulation source.'
  revised_text: 'Mais si les hauts fonctionnaires apprennent que je t’ai parlé et viennent te voir pour te dire : « Dis-nous, s’il te plaît, ce que tu as dit au roi. Ne nous le cache pas, et nous ne te mettrons pas à mort. Dis-nous aussi ce que le roi t’a dit. »'
