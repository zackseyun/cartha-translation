base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/010.yaml
  text: Then the king commanded Ebed-melech the Cushite[a], saying, “Take with you from here thirty men[b], and bring Jeremiah the prophet up from the cistern before he dies.”
translation:
  language: fr
  text: 'Alors le roi donna cet ordre à Ébed-Mélek, le Koushite[a] : « Prends avec toi trente hommes d’ici et fais remonter le prophète Jérémie hors de la citerne[b], avant qu’il ne meure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Éthiopien ». L’hébreu dit « le Koushite », c’est-à-dire un homme originaire de Koush.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la fosse » ou, dans une tradition plus ancienne, « du cachot ». Le mot hébreu peut désigner une fosse ou une citerne ; « citerne » correspond au cadre du récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: donna cet ordre
  rationale: Le verbe צוה exprime ici un ordre royal direct. Cette formulation française est naturelle et conserve sa force d’autorité.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ébed-Mélek
  rationale: Le contexte traite cette expression comme un nom propre; la translittération française évite de la traduire à tort comme « serviteur du roi ».
- source_word: הַכּוּשִׁי
  choice: le Koushite
  rationale: Le terme désigne un homme originaire de Koush. « Koushite » reste proche du nom ethnogéographique hébreu, contrairement au traditionnel « Éthiopien », potentiellement anachronique ou imprécis.
- source_word: קַח בְּיָדְךָ מִזֶּה שְׁלֹשִׁים אֲנָשִׁים
  choice: Prends ici trente hommes avec toi
  rationale: בידך est une expression idiomatique indiquant que les hommes accompagnent Ébed-Mélek sous sa conduite. « Ici » rend concise­ment מזה dans le lieu immédiat.
- source_word: וְהַעֲלִיתָ
  choice: fais remonter
  rationale: La forme causative de עלה signifie faire monter. Dans le contexte d’une extraction verticale, « fais remonter » conserve à la fois la causativité et le mouvement ascendant.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Cette tournure est naturelle en français et conserve le titre explicitement présent dans l’hébreu.
- source_word: מִן הַבּוֹר
  choice: hors de la citerne
  rationale: בור peut désigner une fosse ou une citerne. Le contexte narratif d’une cavité de stockage contenant de la boue favorise « citerne »; « hors de » s’accorde naturellement avec « faire remonter ».
- source_word: בְּטֶרֶם יָמוּת
  choice: avant qu’il ne meure
  rationale: בטרם marque la limite temporelle. Le subjonctif avec le ne explétif donne une formulation française courante et digne, sans valeur négative.
