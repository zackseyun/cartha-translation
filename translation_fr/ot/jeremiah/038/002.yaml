  text: כֹּה֮ אָמַ֣ר יְהוָה֒ הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יֹּצֵ֤א אֶל הַ/כַּשְׂדִּים֙ יחיה וְ/הָיְתָה לּ֥/וֹ נַפְשׁ֛/וֹ לְ/שָׁלָ֖ל וָ/חָֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/002.yaml
  text: 'Thus says Yahweh: He who remains in this city will die by the sword[a], by famine, and by pestilence; but he who goes out to the Chaldeans will live, and his life will be to him as spoil, and he will live.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh : « Celui qui restera dans cette ville mourra par l’épée, par la famine et par la peste. Mais celui qui sortira vers les Chaldéens vivra ; sa vie sera pour lui comme un butin[a], et il vivra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa vie sera pour lui comme un butin ». Cette expression hébraïque signifie qu’il échappera au désastre en ayant la vie sauve.'
    reason: Explication de l’idiome hébraïque et de sa métaphore guerrière.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin et préserve sa valeur de nom propre dans le texte source.
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: celui qui restera dans cette ville
  rationale: Le participe de ישׁב désigne ici le fait de demeurer dans la ville assiégée, non l’action littérale de s’asseoir. Le futur français convient à l’annonce prophétique.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: par l’épée, par la famine et par la peste
  rationale: Conserve la triade caractéristique de Jérémie ainsi que la répétition des prépositions devant les deux premiers éléments, tout en restant naturel en français.
- source_word: וְהַיֹּצֵא אֶל הַכַּשְׂדִּים
  choice: mais celui qui sortira pour aller vers les Chaldéens
  rationale: « Mais » explicite le contraste porté par le waw dans ce contexte. La formulation conserve le mouvement littéral vers les Chaldéens sans remplacer celui-ci par l’interprétation plus explicite « se rendre ».
- source_word: יִחְיֶה ... וָחָי
  choice: vivra ... et il vivra
  rationale: Maintient la répétition insistante de la racine חיה au lieu d’en supprimer la dernière occurrence ou de la varier par « survivra ».
- source_word: וְהָיְתָה לוֹ נַפְשׁוֹ לְשָׁלָל
  choice: sa vie sera pour lui comme un butin
  rationale: נֶפֶשׁ désigne ici la vie préservée, et non spécialement l’âme immatérielle. La traduction garde l’image guerrière du butin tout en signalant la comparaison idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le rend explicitement sans le remplacer par un titre.
- issue: Sens de נֶפֶשׁ dans l’expression נַפְשׁוֹ לְשָׁלָל
  choice: sa vie sera pour lui comme un butin
  alternative: son âme sera pour lui comme un butin / il sauvera sa vie
  rationale: Le contexte porte sur la préservation physique au milieu du siège. « Vie » évite d’introduire une affirmation anthropologique étrangère au passage, tandis que l’image du butin reste visible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le contraste, la triade de jugements et la répétition finale de « vivra ». Le tour légèrement marqué « comme un butin » est maintenu afin de préserver l’image hébraïque, avec une note explicative.
