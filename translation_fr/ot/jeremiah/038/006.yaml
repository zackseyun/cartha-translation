  text: וַ/יִּקְח֣וּ אֶֽת יִרְמְיָ֗הוּ וַ/יַּשְׁלִ֨כוּ אֹת֜/וֹ אֶל הַ/בּ֣וֹר מַלְכִּיָּ֣הוּ בֶן הַ/מֶּ֗לֶךְ אֲשֶׁר֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה וַ/יְשַׁלְּח֥וּ אֶֽת יִרְמְיָ֖הוּ בַּ/חֲבָלִ֑ים וּ/בַ/בּ֤וֹר אֵֽין מַ֨יִם֙ כִּ֣י אִם טִ֔יט וַ/יִּטְבַּ֥ע יִרְמְיָ֖הוּ בַּ/טִּֽיט־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/006.yaml
  text: So they took Jeremiah and threw him into the cistern of Malkijah the king’s son[a], which was in the court of the guard, and they lowered Jeremiah with ropes. Now there was no water in the cistern, but only mud[c][b], and Jeremiah sank into the mud.
translation:
  language: fr
  text: Ils prirent donc Jérémie et le jetèrent dans la citerne de Malkiya, fils du roi, qui se trouvait dans la cour de la garde. Ils y descendirent Jérémie à l’aide de cordes. Il n’y avait pas d’eau dans la citerne, mais seulement de la boue, et Jérémie s’enfonça dans la boue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils prirent
  rationale: Le verbe לקח a ici son sens narratif courant, « prendre ». « S’emparèrent de » serait possible dans le contexte, mais ajouterait une nuance de violence que le verbe lui-même n’impose pas.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ אֶל הַבּוֹר
  choice: le jetèrent dans la citerne
  rationale: השליך exprime l’action de jeter. בור peut désigner une fosse ou une citerne ; la précision qu’elle ne contenait plus d’eau mais de la boue favorise nettement « citerne ».
- source_word: מַלְכִּיָּהוּ בֶן הַמֶּלֶךְ
  choice: Malkiya, fils du roi
  rationale: La translittération « Malkiya » rend le nom hébreu de façon naturelle en français. « Fils du roi » reproduit la relation exprimée sans préciser davantage le statut du personnage.
- source_word: אֲשֶׁר בַּחֲצַר הַמַּטָּרָה
  choice: qui se trouvait dans la cour de la garde
  rationale: חצר désigne une cour, et מטרה renvoie dans Jérémie à un lieu surveillé servant à la détention. « Cour de la garde » reste proche du texte sans surinterpréter par « prison ».
- source_word: וַיְשַׁלְּחוּ אֶת יִרְמְיָהוּ בַּחֲבָלִים
  choice: Ils y descendirent Jérémie à l’aide de cordes
  rationale: Dans ce contexte, שלח avec des cordes décrit le fait de faire descendre quelqu’un. Le pronom « y » explicite naturellement en français la destination déjà mentionnée, sans ajouter de contenu.
- source_word: וּבַבּוֹר אֵין מַיִם כִּי אִם טִיט
  choice: Il n’y avait pas d’eau dans la citerne, mais seulement de la boue
  rationale: 'אין indique l’absence, et כי אם a ici une valeur exceptive : « mais seulement ». « Boue » est l’équivalent moderne et clair de טיט.'
- source_word: וַיִּטְבַּע יִרְמְיָהוּ בַּטִּיט
  choice: Jérémie s’enfonça dans la boue
  rationale: טבע exprime l’idée de s’enfoncer ou de sombrer. « S’enfonça » convient précisément à la boue et conserve le mouvement ainsi que le danger de la scène.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation demeure proche de la syntaxe et des images hébraïques tout en évitant des tournures vieillies comme « bourbier » ou « le descendirent avec des cordes ». Aucun appel de note n’est nécessaire, car les choix « citerne », « cour de la garde » et « boue » sont bien soutenus par le contexte et restent naturels.
