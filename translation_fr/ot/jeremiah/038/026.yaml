base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/026.yaml
  text: Then you shall say to them[a], ‘I was presenting my plea before the king, that he should not send me back to the house of Jonathan to die there.’
translation:
  language: fr
  text: 'Alors tu leur diras : « Je présentais ma requête au roi : qu’il ne me renvoie pas dans la maison de Jonathan, pour que je n’y meure pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Alors tu leur diras
  rationale: Le waw suivi de la forme verbale exprime ici la suite de l’instruction. « Alors » rend naturellement cette progression en français.
- source_word: מַפִּיל אֲנִי תְחִנָּתִי לִפְנֵי הַמֶּלֶךְ
  choice: Je présentais ma requête au roi
  rationale: L’expression hébraïque signifie littéralement « je fais tomber ma supplication devant le roi » et désigne une demande instante. L’imparfait rend l’aspect duratif du participe dans le récit que Jérémie doit faire de l’entretien tout juste achevé.
- source_word: תְחִנָּתִי
  choice: ma requête
  rationale: Le terme désigne une demande pressante de faveur ou de grâce. « Requête » reste digne, clair et adapté à une démarche adressée au roi.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: au roi
  rationale: Dans cette locution de supplication, « au roi » est plus naturel en français moderne que le calque « devant le roi », tout en conservant le destinataire de la demande.
- source_word: לְבִלְתִּי הֲשִׁיבֵנִי
  choice: qu’il ne me renvoie pas
  rationale: La construction indique le contenu ou le but de la requête. Le pronom « il » renvoie au roi, agent implicite du causatif « faire revenir ».
- source_word: בֵּית יְהוֹנָתָן
  choice: la maison de Jonathan
  rationale: Traduction transparente de l’état construit, qui maintient la désignation récurrente de ce lieu dans le récit.
- source_word: לָמוּת שָׁם
  choice: pour que je n’y meure pas
  rationale: L’infinitif indique ici l’issue redoutée d’un retour dans cette prison. Cette formulation française explicite naturellement le rapport final-consécutif sans changer le sens contextuel.
