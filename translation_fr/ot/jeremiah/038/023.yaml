base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/023.yaml
  text: And all your wives and your sons will be brought out to the Chaldeans[a], and you yourself will not escape from their hand, for you will be seized by the hand of the king of Babylon[c][b], and this city will be burned with fire.
translation:
  language: fr
  text: Toutes tes femmes et tous tes fils seront emmenés auprès des Chaldéens[a]. Toi-même, tu ne leur échapperas pas, car tu seras capturé par le roi de Babylone[b], et tu mettras le feu à cette ville[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auprès des Babyloniens ».'
    reason: lexical_alternative
  - marker: b
    text: En hébreu, « échapper à leur main » et « être capturé par la main du roi de Babylone » sont des expressions qui évoquent le pouvoir ou l’emprise.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu met « cette ville » après le marqueur du complément d’objet direct ; le verbe s’adresse donc au roi : « tu brûleras cette ville par le feu ».'
    reason: grammatical_note
lexical_decisions:
- source_word: נָשֶׁיךָ
  choice: tes femmes
  rationale: Dans le contexte de la maison royale et avec le suffixe de deuxième personne, le terme désigne naturellement les épouses du roi.
- source_word: בָנֶיךָ
  choice: tes fils
  rationale: Le nom hébreu désigne ici les fils et non les enfants en général.
- source_word: מוֹצִאִים
  choice: seront emmenés
  rationale: Le participe hophal exprime une action causée et passive, avec une valeur future dans cet avertissement prophétique.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le rendu conserve l’ethnonyme hébreu; dans ce contexte, il désigne les Babyloniens.
- source_word: לֹא תִמָּלֵט מִיָּדָם
  choice: tu ne leur échapperas pas
  rationale: Cette formulation française naturelle transmet l’idiome de la main comme pouvoir ou emprise sans calquer maladroitement l’hébreu.
- source_word: בְיַד מֶלֶךְ בָּבֶל תִּתָּפֵשׂ
  choice: tu seras capturé par le roi de Babylone
  rationale: Le niphal de תפשׂ indique la capture; «par le roi» rend naturellement l’expression instrumentale ou agentive «par la main du roi».
- source_word: וְאֶת הָעִיר הַזֹּאת תִּשְׂרֹף בָּאֵשׁ
  choice: et cette ville sera livrée aux flammes
  rationale: La forme verbale féminine singulière se rapporte à «ville». Le passif restitue le sens contextuel, tandis que «livrée aux flammes» exprime naturellement la destruction par le feu.
theological_decisions:
- issue: Sujet grammatical de תִּשְׂרֹף
  choice: La ville sera brûlée, et non Sédécias présenté comme celui qui y met personnellement le feu.
  alternative: «Tu brûleras cette ville» en prenant le verbe comme une deuxième personne masculine.
  rationale: La forme consonantique peut sembler ambiguë sans vocalisation, mais le texte massorétique vocalise un féminin singulier qui s’accorde avec «cette ville»; le contexte parallèle soutient également ce sens.
translation_notes:
  register: Français international moderne, clair et digne. Les idiomes de la «main» sont rendus naturellement dans le texte, avec leur image hébraïque signalée en note. «Chaldéens» est conservé pour la précision historique, avec «Babyloniens» comme équivalent explicatif.
