source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יָד֔/וֹ וַ/יַּגַּ֖ע עַל פִּ֑/י וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י הִנֵּ֛ה נָתַ֥תִּי דְבָרַ֖/י בְּ/פִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/009.yaml
  text: Then the LORD stretched out his hand and touched my mouth, and the LORD said to me, “Look, I have put my words in your mouth.”
translation:
  language: fr
  text: 'Alors le SEIGNEUR étendit sa main et toucha ma bouche. Puis le SEIGNEUR me dit : « Voici, j’ai mis mes paroles dans ta bouche. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le nom divin selon la convention française courante en petites capitales, tout en le distinguant du titre ordinaire « Seigneur ».
- source_word: וַיִּשְׁלַח ... אֶת־יָדוֹ
  choice: étendit la main
  rationale: Expression française naturelle correspondant au geste décrit par le verbe « envoyer/étendre » avec « sa main ».
- source_word: וַיַּגַּע עַל־פִּי
  choice: toucha ma bouche
  rationale: Le français n’exige pas de rendre séparément la préposition עַל dans cette construction; « toucher la bouche » exprime fidèlement l’action.
- source_word: הִנֵּה
  choice: Regarde
  rationale: Conserve la force déictique et interpellative de הִנֵּה dans un français moderne et direct.
- source_word: נָתַתִּי דְבָרַי בְּפִיךָ
  choice: j’ai mis mes paroles dans ta bouche
  rationale: Préserve l’image concrète ainsi que le pluriel « mes paroles » du texte hébreu.
theological_decisions:
- issue: Nature de la mise des paroles divines dans la bouche du prophète
  choice: Conserver littéralement l’image « j’ai mis mes paroles dans ta bouche »
  alternative: Expliciter par « je te donne les paroles que tu devras prononcer »
  rationale: Le texte affirme l’origine divine du message prophétique au moyen d’une image forte; l’expliciter davantage réduirait sa portée et pourrait résoudre indûment sa tension théologique.
translation_notes:
  register: Français international moderne, simple et digne. Ponctuation scindée en deux phrases pour une lecture fluide, sans modifier la progression narrative. Tutoiement maintenu dans la parole divine adressée individuellement à Jérémie.
