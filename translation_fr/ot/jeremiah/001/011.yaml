id: JER.1.11
reference: Jeremiah 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֵלַ֣/י לֵ/אמֹ֔ר מָה אַתָּ֥ה רֹאֶ֖ה יִרְמְיָ֑הוּ וָ/אֹמַ֕ר מַקֵּ֥ל שָׁקֵ֖ד אֲנִ֥י רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/011.yaml
  text: And the word of Yahweh came to me[a], saying, “What do you see, Jeremiah?” And I said, “I see a branch of an almond tree.”
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée : « Que vois-tu, Jérémie ? » Je répondis : « Je vois une branche d’amandier[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un bâton en bois d’amandier ». Le mot hébreu peut désigner aussi bien un bâton ou une baguette qu’une branche. Le verset suivant repose sur un jeu de mots entre « amandier » (shaqed) et « veiller » (shoqed).
    reason: Alternative lexicale et préservation du jeu de mots hébreu.
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: La parole de Yahweh me fut adressée
  rationale: Cette formulation française naturelle conserve la formule prophétique fondée sur « la parole de Yahweh », tout en rendant idiomatiquement l’idée qu’elle parvient au prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles qui suivent sans imposer le calque lourd « en disant ».
- source_word: מָה אַתָּה רֹאֶה
  choice: Que vois-tu
  rationale: Le présent rend naturellement la question directe exprimée par le participe hébreu.
- source_word: מַקֵּל שָׁקֵד
  choice: une branche d’amandier
  rationale: Dans cette vision, « branche d’amandier » produit une image claire et naturelle. מַקֵּל peut toutefois désigner un bâton ou une baguette, possibilité conservée en note.
- source_word: וָאֹמַר
  choice: Je répondis
  rationale: Dans cet échange, « répondre » exprime naturellement la fonction du verbe « dire » après une question, sans ajouter de contenu.
- source_word: אֲנִי רֹאֶה
  choice: Je vois
  rationale: Le français simple et direct correspond au participe avec pronom explicite, sans accentuation artificielle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Nature de l’objet vu
  choice: branche d’amandier
  alternative: bâton en bois d’amandier
  rationale: Le contexte visuel permet de comprendre מַקֵּל comme une branche, mais le terme peut aussi désigner un bâton. La traduction principale privilégie l’image végétale naturelle sans éliminer l’autre lecture, signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe évite le calque « et il arriva » ainsi que « disant », tout en conservant la formule prophétique et la brièveté du dialogue.
