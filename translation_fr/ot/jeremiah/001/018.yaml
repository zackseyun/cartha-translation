source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נְתַתִּ֣י/ךָ הַ/יּ֗וֹם לְ/עִ֨יר מִבְצָ֜ר וּ/לְ/עַמּ֥וּד בַּרְזֶ֛ל וּ/לְ/חֹמ֥וֹת נְחֹ֖שֶׁת עַל כָּל הָ/אָ֑רֶץ לְ/מַלְכֵ֤י יְהוּדָה֙ לְ/שָׂרֶ֔י/הָ לְ/כֹהֲנֶ֖י/הָ וּ/לְ/עַ֥ם הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/018.yaml
  text: And I—behold[a], I have made you today a fortified city, an iron pillar, and bronze walls against the whole land—against the kings of Judah, its officials, its priests[b], and the people of the land.
translation:
  language: fr
  text: 'Quant à moi, voici qu’aujourd’hui je fais de toi une ville fortifiée[a], une colonne de fer et des murailles de bronze contre tout le pays : contre les rois de Juda, contre ses dirigeants, contre ses prêtres et contre le peuple du pays[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « je t’établis aujourd’hui comme une ville fortifiée ». Le verbe hébreu signifie littéralement « donner, placer » et exprime ici le fait d’établir Jérémie comme une présence fortifiée.'
    reason: lexical_alternative
  - marker: b
    text: Dans certains contextes, « le peuple du pays » désigne les gens du commun par contraste avec les dirigeants ; ici, l’expression peut aussi viser plus largement l’ensemble de la population.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Quant à moi, voici que
  rationale: « Quant à moi » restitue la mise en relief du pronom indépendant, tandis que « voici que » conserve la force déictique et solennelle de הִנֵּה dans un français naturel.
- source_word: נְתַתִּיךָ
  choice: je fais de toi
  rationale: Le verbe נתן signifie fondamentalement « donner, placer, établir », mais les compléments prédicatifs introduits par לְ expriment ici ce que Dieu constitue Jérémie à être.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’indication temporelle et l’immédiateté de l’appel prophétique.
- source_word: לְעִיר מִבְצָר
  choice: une ville fortifiée
  rationale: Le לְ a une valeur prédicative après נתן ; la métaphore présente Jérémie comme une place forte capable de résister.
- source_word: וּלְעַמּוּד בַּרְזֶל
  choice: une colonne de fer
  rationale: Traduction directe et idiomatique de l’image hébraïque.
- source_word: וּלְחֹמוֹת נְחֹשֶׁת
  choice: des murailles de bronze
  rationale: Le pluriel est conservé. נְחֹשֶׁת peut désigner le cuivre ou le bronze ; « bronze » convient à l’image de solidité défensive.
- source_word: עַל כָּל הָאָרֶץ
  choice: contre tout le pays
  rationale: Dans ce contexte de confrontation, עַל marque l’opposition. La liste qui suit indique que הָאָרֶץ désigne le pays de Juda plutôt que la terre entière.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: contre les rois de Juda
  rationale: Le לְ précise ici les adversaires compris dans « tout le pays » ; la répétition de « contre » clarifie la relation en français.
- source_word: לְשָׂרֶיהָ
  choice: contre ses dirigeants
  rationale: שָׂרִים désigne les responsables politiques ou administratifs ; « dirigeants » est actuel, accessible et suffisamment large.
- source_word: לְכֹהֲנֶיהָ
  choice: contre ses prêtres
  rationale: Traduction courante et directe de כֹּהֲנִים.
- source_word: וּלְעַם הָאָרֶץ
  choice: contre le peuple du pays
  rationale: La formulation conserve l’expression hébraïque sans décider si elle vise spécialement les gens du commun ou, plus largement, l’ensemble de la population.
theological_decisions:
- issue: Étendue de « tout le pays »
  choice: Le pays de Juda dans son ensemble
  alternative: La terre entière
  rationale: Les rois de Juda, ses dirigeants, ses prêtres et son peuple explicitent immédiatement l’expression ; le cadre national est donc le plus probable, sans affaiblir l’idée de totalité.
- issue: Portée sociale de « le peuple du pays »
  choice: Conserver l’expression sans la limiter
  alternative: Les gens du commun
  rationale: עַם הָאָרֶץ peut désigner une catégorie sociale distincte des élites, mais peut aussi englober plus largement la population. La traduction maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Les images militaires sont conservées, ainsi que la solennité de « voici que ». La répétition de « contre » évite toute ambiguïté syntaxique dans l’énumération.
