source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י מִ/צָּפוֹן֙ תִּפָּתַ֣ח הָ/רָעָ֔ה עַ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/014.yaml
  text: And Yahweh said to me[b][a], “From the north the disaster will break forth against all the inhabitants of the land.”
translation:
  language: fr
  text: 'Yahweh me dit : « Du nord, le malheur se déchaînera contre tous les habitants du pays.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la terre ». Il s’agit probablement ici du pays de Juda. Littéralement, l’image hébraïque est : « Du nord, la calamité sera ouverte. »'
    reason: Signale l’autre sens possible de אֶרֶץ et conserve l’image littérale inhabituelle de תִּפָּתַח avec un accord grammatical exact.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר ... אֵלָי
  choice: me dit
  rationale: Rend naturellement en français moderne la progression narrative et le complément « à moi ».
- source_word: מִצָּפוֹן
  choice: Du nord
  rationale: Exprime directement l’origine géographique du jugement annoncé.
- source_word: תִּפָּתַח
  choice: se déchaînera
  rationale: Le nifal de פתח signifie littéralement « être ouvert » ; associé au malheur, il évoque ici une calamité libérée qui éclate.
- source_word: הָרָעָה
  choice: le malheur
  rationale: Dans ce contexte de jugement prophétique, רָעָה désigne une calamité plutôt que le mal moral.
- source_word: עַל
  choice: contre
  rationale: Rend la portée hostile de la calamité qui atteint les habitants.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: tous les habitants du pays
  rationale: Formulation française claire ; dans le contexte immédiat, אֶרֶץ renvoie vraisemblablement au pays de Juda, tout en pouvant lexicalement signifier « terre ».
theological_decisions:
- issue: Sens de הָרָעָה dans l’annonce du jugement
  choice: le malheur
  alternative: le mal ; la calamité
  rationale: Le contexte indique un désastre subi, sans transformer le verset en affirmation selon laquelle Dieu produirait le mal moral.
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contexte de Jérémie favorise le pays de Juda, mais l’ambiguïté lexicale est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Se déchaînera » conserve l’image dynamique d’une calamité libérée, tandis que la note préserve la formulation hébraïque plus littérale.
