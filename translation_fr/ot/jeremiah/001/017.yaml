  to: Mais toi, ceins tes reins[a], lève-toi et dis-leur tout ce que je t’ordonnerai. Ne te laisse pas intimider devant eux, de peur que je ne t’intimide devant eux.
  rationale: La révision améliore l’idiomaticité française de l’image des reins et rend plus exactement la portée de חתת. Elle conserve l’image corporelle, le ton solennel, l’exhaustivité de l’ordre divin, les deux occurrences de « devant eux » et le jeu verbal de l’avertissement.
