source:
  edition: WLC
  text: וְ/אַתָּה֙ תֶּאְזֹ֣ר מָתְנֶ֔י/ךָ וְ/קַמְתָּ֙ וְ/דִבַּרְתָּ֣ אֲלֵי/הֶ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י אֲצַוֶּ֑/ךָּ אַל תֵּחַת֙ מִ/פְּנֵי/הֶ֔ם פֶּֽן אֲחִתְּ/ךָ֖ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/017.yaml
  text: But you[a], gird up your loins, and arise and speak to them all that I command you. Do not be dismayed before them, lest I dismay you before them.
translation:
  language: fr
  text: Mais toi, ceins tes reins[a], lève-toi et dis-leur tout ce que je t’ordonnerai. Ne te laisse pas intimider devant eux, de peur que je ne t’intimide devant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque signifiant : « prépare-toi à agir ». Elle évoque le fait d’attacher ses vêtements autour de la taille pour pouvoir se mettre en action.'
    reason: Explication d’un idiome hébraïque conservé dans le texte.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: Le pronom explicite marque une transition appuyée vers la mission personnelle de Jérémie; « Mais toi » rend naturellement ce contraste.
- source_word: תֶּאְזֹר מָתְנֶיךָ
  choice: ceins-toi les reins
  rationale: Cette expression conserve l’image corporelle hébraïque de vêtements attachés autour de la taille afin d’être prêt à agir. Une note en explicite le sens.
- source_word: וְקַמְתָּ
  choice: lève-toi
  rationale: Dans cette suite à valeur injonctive, « lève-toi » est actuel, direct et digne.
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: dis-leur
  rationale: Le verbe דבר avec אל désigne ici l’acte de parler aux destinataires. « Dis-leur » convient naturellement en français, sans renforcer indûment le verbe par « proclame ».
- source_word: אֵת כָּל אֲשֶׁר אָנֹכִי אֲצַוֶּךָּ
  choice: tout ce que je t’ordonnerai
  rationale: Le futur français rend bien l’imparfait hébreu dans le cadre d’une mission où Dieu communiquera ses ordres, tout en soulignant que Jérémie doit tout transmettre.
- source_word: אַל תֵּחַת ... פֶּן אֲחִתְּךָ
  choice: Ne tremble pas ... de peur que je ne te fasse trembler
  rationale: 'La répétition de « trembler » reproduit autant que possible le jeu entre le niphal et le hiphil de חתת: être saisi d’effroi, puis être amené à cet état.'
- source_word: מִפְּנֵיהֶם ... לִפְנֵיהֶם
  choice: devant eux ... devant eux
  rationale: La répétition conserve à la fois la dimension spatiale et la confrontation exprimées par l’hébreu.
theological_decisions:
- issue: Maintien de l’image corporelle dans l’appel prophétique
  choice: Conserver « ceins-toi les reins » dans le texte principal
  alternative: « prépare-toi à agir »
  rationale: L’image concrète participe à la solennité de l’envoi et évoque la disponibilité immédiate à l’action; la note en garantit l’intelligibilité.
- issue: Jeu verbal et force de l’avertissement divin
  choice: « Ne tremble pas ... de peur que je ne te fasse trembler »
  alternative: « Ne te laisse pas intimider ... sinon je te terrifierai »
  rationale: 'La formulation retenue préserve le parallélisme lexical et la tension du texte: Jérémie ne doit pas céder à la peur des hommes, sous peine d’être lui-même livré à l’effroi devant eux. Elle n’atténue ni ne développe la portée théologique de l’avertissement.'
translation_notes:
  register: Français international moderne, au ton direct et solennel. L’idiome ancien est maintenu pour préserver l’image hébraïque, avec une note explicative; le reste de la phrase privilégie une syntaxe française claire et actuelle.
