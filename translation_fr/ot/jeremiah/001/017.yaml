review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement la séquence d’envoi : contraste initial (« Mais toi »), préparation, levée, parole exhaustive, puis avertissement. « Je t’ordonnerai » reflète de façon recevable l’imparfait hébreu dans ce contexte d’instructions à transmettre. La répétition de « devant eux » maintient la confrontation exprimée par les prépositions hébraïques. Pour חתת, « ne tremble pas / je te fasse trembler » est possible, mais réduit le champ de « être consterné, brisé ou intimidé » à une manifestation physique de peur.'
  naturalness: « Ceins tes reins » est la formulation française établie et plus directe pour l’idiome conservé; elle évite le tour réflexif moins idiomatique « ceins-toi les reins ». « Ne te laisse pas intimider ... de peur que je ne t’intimide » est naturel en français international moderne et rend mieux l’avertissement que « trembler ».
  terminology: Le maintien de « reins » est justifié par l’image hébraïque et est correctement expliqué par la note. « Intimider » permet de garder le même lexème français dans les deux membres, en écho au jeu Niphal/Hiphil de חתת, sans prétendre reproduire exactement sa morphologie.
  issues:
  - severity: low
    issue: 'Formulation de l’idiome : « ceins-toi les reins »'
    rationale: Le tour est compréhensible, mais « ceins tes reins » est la forme française traditionnelle et la plus idiomatique pour traduire directement le possessif hébreu.
  - severity: medium
    issue: « Ne tremble pas ... je ne te fasse trembler » restreint חתת
    rationale: Le verbe hébreu vise l’effroi, le découragement ou l’intimidation, et non nécessairement le tremblement physique. « Intimider » préserve mieux cette portée tout en conservant l’écho verbal voulu.
