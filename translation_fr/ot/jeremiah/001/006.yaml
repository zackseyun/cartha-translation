  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהֹוִ֔ה הִנֵּ֥ה לֹא יָדַ֖עְתִּי דַּבֵּ֑ר כִּי נַ֖עַר אָנֹֽכִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/006.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I do not know how to speak[c][b], for I am a youth.”
translation:
  language: fr
  text: 'Alors j’ai dit : « Ah ! Seigneur Yahweh ! Vois, je ne sais pas parler[a], car je suis jeune[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne sais pas comment parler ». La tournure hébraïque peut exprimer l’incapacité ou l’inexpérience.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un garçon », « un jeune homme ». Le mot hébreu peut désigner une personne allant de l’enfance au début de l’âge adulte, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors j’ai dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors j’ai dit » rend naturellement la succession narrative en français.
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Cette interjection exprime ici le désarroi ou la protestation de Jérémie. « Ah ! » reste naturel et immédiat, sans la tonalité principalement funèbre de « Hélas ! ».
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Le titre associe אֲדֹנָי, « Seigneur », au nom divin YHWH. « Seigneur Yahweh » représente explicitement les deux éléments sans produire « Seigneur SEIGNEUR ».
- source_word: הִנֵּה
  choice: Vois
  rationale: La particule attire l’attention sur l’objection qui suit. L’impératif « Vois » conserve sa force déictique dans un français actuel et digne.
- source_word: לֹא יָדַעְתִּי דַּבֵּר
  choice: je ne sais pas parler
  rationale: La tournure hébraïque signifie littéralement « je ne sais pas parler ». Cette formulation française naturelle préserve l’idée d’incapacité ou d’inexpérience sans préciser indûment qu’il s’agirait d’un défaut d’éloquence.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Jérémie. « Car » exprime clairement ce rapport explicatif.
- source_word: נַעַר
  choice: jeune
  rationale: נַעַר peut désigner un enfant, un garçon ou un jeune homme selon le contexte. L’adjectif substantivé « jeune » préserve ici la largeur du terme et met l’accent sur l’âge et l’inexpérience.
- source_word: אָנֹכִי
  choice: je suis
  rationale: Le pronom indépendant souligne le sujet. La construction française « je suis jeune » transmet naturellement cette insistance dans son contexte.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le texte contient à la fois le titre אֲדֹנָי et le tétragramme. « Seigneur Yahweh » maintient distinctement le titre et le nom propre, tandis que « Seigneur DIEU » relève d’une convention typographique traditionnelle qui masque le nom.
- issue: Nature de l’incapacité invoquée par Jérémie
  choice: Ne pas préciser au-delà de « je ne sais pas parler »
  alternative: Je ne suis pas doué pour parler
  rationale: Le texte peut évoquer l’inexpérience, l’incapacité ressentie ou le manque d’aptitude, mais il ne définit pas précisément un défaut rhétorique. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation rend l’émotion de l’interjection sans archaïsme. « Vois » conserve l’appel d’attention de הִנֵּה; « je suis jeune » évite de fixer un âge que l’hébreu laisse indéterminé.
