source:
  edition: WLC
  text: בְּ/טֶ֨רֶם אצור/ך בַ/בֶּ֨טֶן֙ יְדַעְתִּ֔י/ךָ וּ/בְ/טֶ֛רֶם תֵּצֵ֥א מֵ/רֶ֖חֶם הִקְדַּשְׁתִּ֑י/ךָ נָבִ֥יא לַ/גּוֹיִ֖ם נְתַתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/005.yaml
  text: Before I formed you in the womb[a], I knew you, and before you came out from the womb, I set you apart[b]; I appointed you as a prophet to the nations.
translation:
  language: fr
  text: Avant de te façonner dans le ventre maternel, je te connaissais[a] ; avant que tu sortes du sein maternel, je t’ai mis à part[b] ; je t’ai désigné comme prophète pour les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu traduit par « connaissais » peut aussi évoquer une attention personnelle ou un choix, mais sa formulation plus large est conservée dans le texte.
    reason: lexical_alternative
  - marker: b
    text: Ou « je t’ai consacré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Avant de / avant que
  rationale: La locution exprime l’antériorité. Les deux constructions françaises s’adaptent naturellement aux verbes qui suivent sans ajouter d’emphase absente de l’hébreu.
- source_word: אצורך
  choice: te façonner
  rationale: Le verbe יצר évoque l’action de former ou de façonner. « Façonner » conserve cette image concrète sans élargir le sens à « créer ».
- source_word: בַבֶּטֶן
  choice: dans le ventre maternel
  rationale: בטן peut désigner le ventre ou le sein maternel ; le contexte prénatal impose ici ce dernier sens. Cette formulation est claire et courante en français moderne.
- source_word: יְדַעְתִּיךָ
  choice: je te connaissais
  rationale: ידע signifie fondamentalement « connaître » et peut comporter ici une dimension personnelle ou élective. L’imparfait rend naturellement en français un état déjà réel avant la formation de Jérémie, sans réduire le verbe à « choisir ».
- source_word: תֵּצֵא מֵרֶחֶם
  choice: tu sortes du sein maternel
  rationale: La traduction garde l’image concrète de יצא, « sortir », tandis que רחם désigne ici le sein maternel. « Naître » serait naturel, mais plus interprétatif.
- source_word: הִקְדַּשְׁתִּיךָ
  choice: je t’avais mis à part
  rationale: Au hiphil, קדש exprime ici la consécration ou la mise à part pour une fonction sainte. « Mettre à part » reste accessible, tandis que « consacrer » est signalé en note.
- source_word: נָבִיא
  choice: prophète
  rationale: Équivalent français usuel et précis de נביא.
- source_word: לַגּוֹיִם
  choice: pour les nations
  rationale: גוים désigne les nations ou les peuples. « Pour les nations » exprime la portée de la mission sans restreindre le terme aux seuls non-Juifs.
- source_word: נְתַתִּיךָ
  choice: je t’avais établi
  rationale: נתן signifie littéralement « donner », mais peut, dans une formule de mandat, exprimer l’établissement ou la désignation à une fonction. « Établir prophète » est idiomatique et conserve l’idée d’une mission conférée.
theological_decisions:
- issue: 'Portée de « je te connaissais » (יְדַעְתִּיךָ) : connaissance, relation ou choix divin'
  choice: Conserver « je te connaissais » dans le texte principal.
  alternative: « je t’avais choisi » ou « je t’avais reconnu »
  rationale: Le contexte peut faire entendre une connaissance personnelle et un choix en vue d’une vocation, mais le verbe hébreu reste « connaître ». La traduction préserve cette amplitude et ne tranche pas une question théologique que le mot laisse ouverte.
- issue: Sens de הִקְדַּשְׁתִּיךָ
  choice: Employer « je t’avais mis à part ».
  alternative: « je t’avais consacré »
  rationale: Les deux rendus expriment une affectation à un usage saint. « Mis à part » est immédiatement compréhensible, tandis que la note conserve le terme théologique traditionnel « consacré ».
- issue: Portée de la mission prophétique exprimée par לַגּוֹיִם
  choice: Traduire « prophète pour les nations ».
  alternative: « prophète auprès des nations » ou « prophète des nations »
  rationale: La formulation exprime une mission orientée vers les nations sans laisser entendre que Jérémie leur appartiendrait ni limiter arbitrairement son ministère.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux expressions « ventre maternel » et « sein maternel » rendent les deux termes hébreux du contexte prénatal sans répétition lourde. Les plus-que-parfaits des deux dernières propositions marquent naturellement, dans un récit rétrospectif, l’antériorité de la mise à part et de l’établissement.
