  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלַ֖/י הֵיטַ֣בְתָּ לִ/רְא֑וֹת כִּֽי שֹׁקֵ֥ד אֲנִ֛י עַל דְּבָרִ֖/י לַ/עֲשֹׂתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/012.yaml
  text: Then Yahweh said to me[a], “You have seen well[c][b], for I am watching over my word to perform it.”
translation:
  language: fr
  text: 'Alors Yahweh me dit : « Tu as bien vu, car je veille[a] sur ma parole pour l’accomplir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu, il y a un jeu de mots entre la « branche d’amandier » du verset précédent (shaqed) et « je veille » ici (shoqed). On peut aussi traduire : « Tu as vu juste » et « pour la réaliser ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit; « Alors » marque naturellement la succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, plutôt que substitution par un titre.
- source_word: הֵיטַבְתָּ לִרְאוֹת
  choice: Tu as bien vu
  rationale: Rend directement l’idiome hébreu tout en restant naturel; « tu as vu juste » serait également possible.
- source_word: כִּי
  choice: car
  rationale: Introduit l’explication de l’affirmation précédente.
- source_word: שֹׁקֵד
  choice: je veille sur
  rationale: Exprime la vigilance active du participe et convient à la relation avec « ma parole ».
- source_word: דְּבָרִי
  choice: ma parole
  rationale: Conserve le singulier et la portée relativement large de דָּבָר sans le réduire à « promesse » ou « message ».
- source_word: לַעֲשֹׂתוֹ
  choice: pour l’accomplir
  rationale: Rend le but exprimé par l’infinitif et indique que Yahweh fera advenir sa parole; formulation française naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin; sa translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de דְּבָרִי dans le contexte prophétique
  choice: ma parole
  alternative: ma promesse; mon message
  rationale: « Ma parole » maintient l’étendue sémantique du terme hébreu et évite de préciser davantage que le texte.
- issue: Force de לַעֲשֹׂתוֹ
  choice: pour l’accomplir
  alternative: pour la réaliser; pour l’exécuter
  rationale: « Accomplir » exprime que Yahweh donne effet à sa parole sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de l’hébreu sans devenir artificielle. Le jeu de mots, impossible à reproduire naturellement dans le corps du texte, est signalé en note.
