  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/004.yaml
  text: The word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh[a] me fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu « le SEIGNEUR » ; autre transcription possible : « Yahvé ».'
    reason: Signaler le nom divin présent dans l’hébreu ainsi que les principales conventions françaises de rendu.
lexical_decisions:
- source_word: וַיְהִי
  choice: me fut adressée
  rationale: Avec דְבַר et אֵלַי, la forme narrative de היה exprime ici la venue de la parole au prophète. La tournure française idiomatique « me fut adressée » restitue naturellement cet événement sans ajouter un adverbe temporel absent de l’hébreu.
- source_word: דְבַר
  choice: La parole
  rationale: Dans la formule prophétique דְבַר יְהוָה, « la parole » conserve le lien explicite avec la révélation divine et reste plus proche du texte que « le message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription « Yahweh » représente le nom divin YHWH au lieu de lui substituer un titre. Une note signale la convention traditionnelle française et la variante de transcription « Yahvé ».
- source_word: אֵלַי
  choice: me
  rationale: 'Le pronom complément dans « me fut adressée » rend naturellement en français la préposition אֶל avec le suffixe de première personne : « à moi ».'
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cet infinitif introduit les paroles directes qui suivent. « En ces termes : » remplit cette fonction clairement en français moderne et évite le calque peu naturel « disant ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte hébreu porte le nom propre YHWH. Le conserver sous la forme « Yahweh » distingue ce nom du titre אֲדֹנָי, tandis que la note reconnaît les usages français courants sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français moderne, clair et digne. La formule « me fut adressée en ces termes » est légèrement soutenue, conformément au registre prophétique, tout en restant immédiatement compréhensible. Le deux-points prépare la parole directe du verset suivant.
