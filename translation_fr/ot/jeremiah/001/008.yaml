source:
  edition: WLC
  text: אַל תִּירָ֖א מִ/פְּנֵי/הֶ֑ם כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הַצִּלֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/008.yaml
  text: Do not be afraid of them[a], for I am with you to deliver you[b], declares Yahweh.
translation:
  language: fr
  text: N’aie pas peur d’eux[a], car je suis avec toi pour te délivrer[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « de devant eux » ou « de leur présence » ; l’expression signifie ici « d’eux » ou « à cause d’eux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour te secourir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: La particule négative אַל suivie de l’inaccompli à valeur jussive exprime une interdiction. « N’aie pas peur » est la formulation française actuelle et naturelle.
- source_word: מִפְּנֵיהֶם
  choice: d’eux
  rationale: L’expression signifie littéralement « de devant leur face », mais, avec le verbe ירא, elle désigne idiomatiquement les personnes que l’on craint. « D’eux » transmet clairement ce sens.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’interdiction. « Car » conserve avec naturel ce rapport explicatif.
- source_word: אִתְּךָ אֲנִי
  choice: je suis avec toi
  rationale: L’ordre hébreu met en relief la présence personnelle de Dieu. La formulation française préserve directement cette assurance.
- source_word: לְהַצִּלְךָ
  choice: pour te délivrer
  rationale: Le hifil de נצל signifie arracher au danger, secourir ou délivrer. « Délivrer » garde l’étendue du terme sans le limiter à un type précis de salut.
- source_word: נְאֻם
  choice: déclare
  rationale: Ce mot appartient à une formule prophétique solennelle. « Déclare » en restitue la force tout en restant lisible en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin, et non un titre. « Yahweh » le représente directement en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le verset emploie explicitement le tétragramme. Le rendre par « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de לְהַצִּיל
  choice: délivrer
  alternative: secourir / sauver
  rationale: La promesse concerne l’intervention protectrice de Dieu dans la mission de Jérémie. « Délivrer » conserve la portée générale du verbe sans imposer un sens exclusivement physique ou sotériologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier hébreu adressé à Jérémie. La structure brève et solennelle de l’oracle est conservée.
