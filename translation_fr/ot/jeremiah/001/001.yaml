  yaml_path: translation/ot/jeremiah/001/001.yaml
  text: The words of Yirmeyahu son of Hilqiyahu[a], one of the priests who were in Anathoth, in the land of Benjamin.
translation:
  language: fr
  text: Paroles de Yirmeyahou, fils de Hilqiyahou[a], l’un des prêtres qui étaient à Anatoth, dans le territoire de Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les versions françaises traditionnelles emploient généralement « Jérémie, fils de Hilqiya » ou une forme voisine. Ici, les noms hébreux sont translittérés plus directement : « Yirmeyahou » et « Hilqiyahou ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Paroles de
  rationale: Le pluriel construit de דָּבָר sert ici de titre au livre. « Paroles de » est naturel en français et conserve la portée assez large du terme sans le réduire à des oracles particuliers.
- source_word: יִרְמְיָהוּ
  choice: Yirmeyahou
  rationale: Translittération adaptée à la lecture française et proche de la forme hébraïque, plutôt que recours automatique à la forme traditionnelle « Jérémie ».
- source_word: בֶּן
  choice: fils de
  rationale: Rend simplement le lien généalogique exprimé par בֶּן.
- source_word: חִלְקִיָּהוּ
  choice: Hilqiyahou
  rationale: Translittération adaptée au français qui représente directement la forme hébraïque du nom.
- source_word: מִן הַכֹּהֲנִים
  choice: l’un des prêtres
  rationale: 'מִן devant un groupe pluriel a ici un sens partitif : Yirmeyahou appartient au groupe des prêtres.'
- source_word: אֲשֶׁר
  choice: qui étaient
  rationale: Le relatif rattache naturellement les prêtres à leur lieu de résidence; le verbe « étaient » est explicité comme l’exige le français.
- source_word: בַּעֲנָתוֹת
  choice: à Anatoth
  rationale: La préposition locative est rendue idiomatiquement par « à » devant ce nom de lieu.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: dans le territoire de Benjamin
  rationale: אֶרֶץ désigne ici la région tribale. « Territoire » rend ce sens géographique plus clairement que « terre » en français moderne.
