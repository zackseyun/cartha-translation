  text: אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו בִּ/ימֵ֛י יֹאשִׁיָּ֥הוּ בֶן אָמ֖וֹן מֶ֣לֶךְ יְהוּדָ֑ה בִּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה לְ/מָלְכֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/002.yaml
  text: to whom the word of Yahweh came in the days of Josiah son of Amon, king of Judah, in the thirteenth year of his reign.
translation:
  language: fr
  text: à qui la parole de Yahweh fut adressée au temps de Josias, fils d’Amon, roi de Juda, la treizième année de son règne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר … אֵלָיו
  choice: à qui
  rationale: La proposition relative renvoie à Jérémie au verset 1. « À qui » intègre naturellement en français le pronom prépositionnel אֵלָיו sans en répéter le sens.
- source_word: הָיָה דְבַר יְהוָה אֵלָיו
  choice: la parole de Yahweh fut adressée
  rationale: Cette formule prophétique indique que la parole divine parvint à Jérémie. « Fut adressée » est idiomatique en français tout en conservant « parole » et la direction exprimée par אֶל.
- source_word: דְבַר
  choice: la parole
  rationale: « Parole » préserve la portée révélatrice du terme דָּבָר et correspond à l’usage biblique français, sans expliciter davantage par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בִּימֵי
  choice: au temps de
  rationale: Équivalent français naturel de la formule temporelle hébraïque, moins archaïsant que « aux jours de ».
- source_word: יֹאשִׁיָּהוּ בֶן אָמוֹן
  choice: Josias, fils d’Amôn
  rationale: Emploi des formes françaises bibliques usuelles pour ces noms, avec une translittération qui distingue Amôn du nom divin Amon.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rend directement le titre royal et le territoire gouverné.
- source_word: בִּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְמָלְכוֹ
  choice: la treizième année de son règne
  rationale: Formulation française habituelle pour une date calculée selon les années de règne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve ici le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et fluide. La minuscule initiale et la proposition relative maintiennent la continuité syntaxique avec Jérémie 1.1. « Au temps de » évite l’archaïsme de « aux jours de », tandis que « fut adressée » conserve le caractère solennel de la formule prophétique.
