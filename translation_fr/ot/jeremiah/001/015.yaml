reference: Jeremiah 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י הִנְ/נִ֣י קֹרֵ֗א לְ/כָֽל מִשְׁפְּח֛וֹת מַמְלְכ֥וֹת צָפ֖וֹנָ/ה נְאֻם יְהוָ֑ה וּ/בָ֡אוּ וְֽ/נָתְנוּ֩ אִ֨ישׁ כִּסְא֜/וֹ פֶּ֣תַח שַׁעֲרֵ֣י יְרוּשָׁלִַ֗ם וְ/עַ֤ל כָּל חוֹמֹתֶ֨י/הָ֙ סָבִ֔יב וְ/עַ֖ל כָּל עָרֵ֥י יְהוּדָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/015.yaml
  text: For behold[a], I am calling all the clans of the kingdoms of the north, declares Yahweh, and they will come, and each will set his throne at the entrance of the gates of Jerusalem, against all her walls all around[b], and against all the cities of Judah.
translation:
  language: fr
  text: Car voici que je convoque tous les clans des royaumes du nord[a], déclare Yahweh. Ils viendront et chacun placera son trône à l’entrée des portes de Jérusalem[b], contre toutes les murailles qui l’entourent et contre toutes les villes de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les familles des royaumes du nord ». Le terme hébreu peut désigner des familles élargies, des clans ou d’autres groupes sociaux apparentés.
    reason: lexical_alternative
  - marker: b
    text: L’image de chacun plaçant son trône aux portes de Jérusalem représente des souverains envahisseurs prenant position pour exercer leur autorité et leur jugement.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הִנְנִי קֹרֵא
  choice: Car voici que je convoque
  rationale: כִּי introduit l’explication de l’annonce précédente, הִנְנִי souligne l’imminence de l’action divine, et « convoque » rend l’appel autoritaire exprimé par קֹרֵא dans ce contexte.
- source_word: לְכָל מִשְׁפְּחוֹת מַמְלְכוֹת צָפוֹנָה
  choice: tous les clans des royaumes du nord
  rationale: « Clans » exprime les groupes de parenté désignés par מִשְׁפְּחוֹת sans suggérer de simples foyers domestiques; le pluriel « royaumes » est conservé.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formule prophétique solennelle rendue dans un français actuel; le nom divin est translittéré.
- source_word: וְנָתְנוּ אִישׁ כִּסְאוֹ
  choice: chacun placera son trône
  rationale: אִישׁ a ici une valeur distributive. « Trône » conserve l’image royale et judiciaire, tandis que « placera » rend directement וְנָתְנוּ.
- source_word: פֶּתַח שַׁעֲרֵי יְרוּשָׁלִַם
  choice: à l’entrée des portes de Jérusalem
  rationale: La formulation maintient à la fois פֶּתַח, « entrée », et le pluriel שַׁעֲרֵי, « portes ».
- source_word: וְעַל כָּל חוֹמֹתֶיהָ סָבִיב
  choice: contre toutes ses murailles, tout autour
  rationale: Dans ce contexte militaire, עַל marque une action dirigée contre la ville; סָבִיב évoque son encerclement.
- source_word: וְעַל כָּל עָרֵי יְהוּדָה
  choice: et contre toutes les villes de Juda
  rationale: « Contre » garde la valeur hostile de עַל, et le pluriel reproduit l’étendue du jugement annoncé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur de l’image des trônes aux portes de Jérusalem
  choice: 'Conserver littéralement l’image: « chacun placera son trône »'
  alternative: 'Expliciter dans le texte: « chaque souverain y établira son autorité »'
  rationale: Le sens peut inclure conquête, gouvernement et jugement. La traduction conserve cette tension imagée plutôt que d’en imposer une seule interprétation.
- issue: Expression distributive masculine אִישׁ ... כִּסְאוֹ
  choice: chacun placera son trône
  alternative: chaque homme placera son trône
  rationale: אִישׁ fonctionne distributivement et renvoie aux dirigeants convoqués; « chacun » rend cette fonction sans ajouter une insistance sur le sexe absente du propos.
translation_notes:
  register: 'Français international moderne, digne et accessible. La coordination hébraïque est légèrement aérée par la ponctuation, sans supprimer la progression: Jérusalem, ses murailles, puis toutes les villes de Juda. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.'
