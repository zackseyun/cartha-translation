source:
  edition: WLC
  text: רְאֵ֞ה הִפְקַדְתִּ֣י/ךָ הַ/יּ֣וֹם הַ/זֶּ֗ה עַל הַ/גּוֹיִם֙ וְ/עַל הַ/מַּמְלָכ֔וֹת לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּ/לְ/הַאֲבִ֣יד וְ/לַ/הֲר֑וֹס לִ/בְנ֖וֹת וְ/לִ/נְטֽוֹעַ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/010.yaml
  text: See[a], today I have appointed you over the nations and over the kingdoms, to uproot and to tear down, and to destroy and to demolish[c][b], to build and to plant.
translation:
  language: fr
  text: 'Vois : aujourd’hui, je t’ai établi sur les nations et sur les royaumes[a], pour déraciner et abattre, pour détruire et démolir, pour bâtir et planter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de l’autorité liée à la mission prophétique de Jérémie envers les nations et les royaumes, non de l’exercice direct d’un pouvoir politique sur eux.
    reason: cultural_note
lexical_decisions:
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif sert à attirer solennellement l’attention de Jérémie. « Vois » reste concis et direct, sans recourir à l’archaïsme « voici ».
- source_word: הִפְקַדְתִּיךָ
  choice: je t’établis
  rationale: Le hiphil de פקד exprime ici l’établissement dans une charge. « Je t’établis » rend la commission divine sans suggérer une simple localisation ni expliciter excessivement sa nature.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Équivalent idiomatique moderne de l’expression temporelle, qui en conserve l’immédiateté.
- source_word: עַל הַגּוֹיִם וְעַל הַמַּמְלָכוֹת
  choice: sur les nations et sur les royaumes
  rationale: Avec פקד, עַל désigne naturellement le domaine confié ou la sphère d’autorité. La formulation conserve cette portée tout en laissant les infinitifs suivants préciser comment s’exerce la mission prophétique.
- source_word: לִנְתוֹשׁ
  choice: pour déraciner
  rationale: Le verbe évoque l’arrachage avec les racines. « Déraciner » conserve l’image agricole et répond directement à « planter ».
- source_word: לִנְתּוֹץ
  choice: renverser
  rationale: Le verbe décrit l’action d’abattre ou de mettre à bas. « Renverser » est naturel en français et reste distinct du verbe suivant rendu par « démolir ».
- source_word: וּלְהַאֲבִיד
  choice: pour détruire
  rationale: Le hiphil de אבד a une valeur causative, rendue naturellement ici par « détruire » dans la série des actes de jugement.
- source_word: וְלַהֲרוֹס
  choice: démolir
  rationale: « Démolir » exprime l’action de ruiner ou d’abattre et préserve l’effet cumulatif des quatre verbes de jugement sans les confondre.
- source_word: לִבְנוֹת
  choice: pour bâtir
  rationale: Le sens architectural et restaurateur est conservé littéralement. « Bâtir » convient au registre solennel tout en restant courant.
- source_word: וְלִנְטוֹעַ
  choice: planter
  rationale: La traduction littérale préserve l’image agricole de la restauration et son contraste avec « déraciner ».
theological_decisions:
- issue: Nature de l’autorité de Jérémie sur les nations et les royaumes
  choice: Conserver « sur » comme expression de la charge prophétique confiée par Dieu.
  alternative: Traduire « au sujet des nations et des royaumes » ou « contre les nations et les royaumes ».
  rationale: Dans ce contexte de commission, עַל avec פקד indique le domaine sur lequel porte la charge. Les infinitifs montrent que cette autorité s’exerce par la parole prophétique annonçant jugement et restauration, non par un gouvernement politique direct. « Sur » préserve la force du texte et sa tension sans réduire la mission au seul jugement.
translation_notes:
  register: Français international moderne, direct et digne. Le rythme en trois paires — déraciner et renverser, détruire et démolir, bâtir et planter — reproduit la progression du texte hébreu et le contraste entre jugement et restauration.
